prompt: |-
  My two officemates have been going at this for three weeks now and I've lost the ability to tell whose making sense, so I'm outsourcing a verdict. We all work in a lab that does robustness stuff, and one of them -- call him the certifier -- has decided that any alignment proposal worth funding needs a worst-case guarantee attached: not 'it usually behaves well,' but 'here is a bound on the damage, over everything in the threat model, and here is the proof.' The other one -- the statistician, she'd take that as a compliment -- says that's a category error dressed up as rigor, because every interesting guarantee in ML is either vacuous over the whole input space or only holds over a distribution you assumed, so 'worst case' always secretly means 'worst case relative to a distribution I chose,' which makes it average case with extra steps and better PR. He says the distribution-dependence is real but it doesn't collapse into average case, because the quantifier order is doing the work: he wants a bound that holds for every environment in a class, not an expectation over environments, and a system that's only safe in expectation over environments it might not be in is exactly the failure everyone is worried about. She says the quantifier order doesn't spare him the class, and the class is the same guess as the distribution, just less honest about being one. He says her number can be driven to zero by a rare catastrophic tail she's averaging away; she says his can be driven to infinity by a case nobody will ever build, and that maximin is just a prior with all its mass on the worst cell -- an assumption, not the absence of one. Then she added the point that actually got too me: a worst case over the systems we can currently analyze is not a worst case over the systems that can exist, so the strength of the guarantee is a fact about our proof techniques and not about the world. He said that's true of every safety argument anyone has ever made, so it's a description of the job, not an objection. She said that's precisely what she can't accept, because worst-case language buys credibility it hasn't earned, and he said she's confusing the rhetoric of the guarantee with the guarantee itself. He's alot more careful than my summary makes him sound, and so is she -- I've flattened them both out.

  Could you take it round by round and tell me who's right on each specific move -- label each one clearly mistaken, partly right, or clearly right, with a sentence or two of why -- and then say where the two of them are talking past each other rather than disagreeing. After that I want your own answer to something neither of them has raised, which is whether 'worst case' is even quantifying over the same thing in both their mouths. I have a suspicion it isn't, but I can't articulate it, so tell me what the distinction is and which of their claims survive once it's drawn. And one more thing that keeps nagging at me: does any of this change if deployment is a single one-shot event rather than a population of deployments? That's the part of her argument I keep turning over at night, and neither of them will engage with it because they've both decided the other one already lost.
