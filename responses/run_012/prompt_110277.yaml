      *   **Context:** Seminar on the intentional stance and artificial minds.
      *   **Key Distinction:** Thin Intentionality (predictive utility/interpreter-relative) vs. Thick Intentionality (mind-independent correctness conditions/genuine aboutness).
      *   **Professor's Verdicts So Far:**
          *   Thermostat: Neither.
          *   Chess Engine: Thin only.
          *   Honeybee: Thin only.
          *   Corporation: Thin only.
