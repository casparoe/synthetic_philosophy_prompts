answer: |-
  Here is the translation of the normative debate into your vocabulary, followed by the residue report.

  ### Part I: The Game-Theoretic Restatement

  Let us model the social context as a recurrent population game $\Gamma$ played by a set of agents $N$. The interactions regarding tipping, queueing, or traffic are modeled as **coordination games** with **multiple strict Nash equilibria**. For example, in a queueing scenario, the equilibria are (Everyone Queues, Everyone Queues) and (Everyone Fights, Everyone Fights), where the former Pareto-dominates the latter but requires alignment.

  **1. Conventions as Equilibrium Selection**
  A local convention is a specific Nash Equilibrium (NE) $s^*$ that has been selected from the set of possible equilibria $S_{NE}$. The selection mechanism is historical path dependence or salience (focal points). The existence of the convention constitutes **common knowledge** (or common $p$-belief) among the local population that $s^*$ is the strategy profile being played.

  **2. Empirical vs. Normative Expectations**
  We distinguish two belief states required for the stability of the convention:
  *   **Empirical Expectations:** Agent $i$ believes with probability $p$ that others will play $s^*_{-i}$.
  *   **Normative Expectations:** Agent $i$ believes with probability $q$ that others believe $i$ *ought* to play $s^*_i$, and that others are disposed to sanction deviations.
  A convention becomes a *social norm* (in the sense of Bicchieri) when compliance is conditional on both expectations. If $q$ drops (people stop expecting sanctions), the norm collapses even if empirical expectations ($p$) remain high.

  **3. Punishment and Metanorms**
  To sustain $s^*$ against deviation (especially in cases where short-term payoffs favor defection, e.g., cutting the queue), the game includes a punishment stage. A deviation triggers a sanction payoff $-k$. To prevent the punishment itself from being costly and thus uncredible, we invoke **metanorms**: agents who fail to punish deviators are themselves subject to sanction. This creates a subgame-perfect equilibrium where punishing is rational.

  **4. The Moral Obligation Claim**
  The claim that a convention is a *moral* obligation, rather than a mere prudential regularity, translates to a claim about the payoff structure and information sets.
  *   **Prudential View:** Compliance is a best response to the threat of sanctions and the desire for coordination benefits. The "ought" is hypothetical: "If you want to avoid $-k$ and achieve coordination, you ought to play $s^*$."
  *   **Moral View:** The "ought" is modeled as a **deontic constraint**. This is not merely a high cost on deviation, but a restriction on the strategy space itself. The agent treats certain strategies (e.g., "cutting the queue") as unavailable, regardless of the payoff. Alternatively, it can be modeled as an internalized preference shift where the utility function $U_i$ includes a term for "compliance with norm" that lexicographically dominates material payoff.

  **5. The Visitor Problem**
  A visitor is a new player entering $\Gamma$ with **incomplete information**.
  *   **Information Set:** The visitor does not know which equilibrium $s^* \in S_{NE}$ is currently focal, nor the severity of the sanction parameter $k$.
  *   **The Obligation:** The claim that the visitor *must* follow local custom translates to a requirement on the visitor's belief updating. Upon observing the local regularity, the visitor must update their priors to assign probability 1 to the local equilibrium and play the best response.
  *   **Fairness/Reciprocity:** If the visitor benefits from the locals' coordination (e.g., an orderly queue), defection is modeled as free-riding. The obligation arises from the Principle of Fairness: if one accepts the benefits of a cooperative scheme, one is obligated to bear the costs (compliance).

  ***

  ### Part II: The Residue Report

  The translation above is technically functional, but it leaves significant residue. This residue does not merely indicate a failure of game theory to capture "morality"; it exposes ambiguities in the original philosophical debate and specific limitations in the game-theoretic vocabulary regarding normativity.

  **1. What Translates Cleanly**
  *   **The Structure of Coordination:** The insight that conventions are arbitrary solutions to coordination problems is perfectly captured by the multiple equilibria framework. The game-theoretic model clarifies that there is no intrinsic value in driving on the left vs. the right; the value lies in the correlation.
  *   **The Role of Expectations:** The distinction between empirical and normative expectations is a precise improvement on vague philosophical talk about "social pressure." It allows us to model norm collapse (when normative expectations vanish) distinct from equilibrium shift.
  *   **The Visitor's Epistemic Burden:** Framing the visitor's problem as one of incomplete information and belief updating is robust. It clarifies that the visitor's primary initial duty is epistemic (learn the local equilibrium) before it is behavioral.

  **2. What Translates Only with Distortion**
  *   **The Deontic Constraint vs. High Cost:** In the translation, I offered two ways to model moral obligation: a restricted strategy space or a lexicographic preference. Both are distortions.
      *   *Restriction:* If we remove the strategy from the space, we cannot explain *weakness of will*. A moral agent knows they *can* cheat but believe they *should not*. Game theory struggles to model "I could do it, it would maximize utility, but it is forbidden" without changing the utility function.
      *   *Preference:* If we model morality as a "taste" for compliance, we reduce the moral *ought* to a desire. This loses the categorical nature of moral claims. A moral obligation claims authority over preferences, not just another entry in the utility function.
      *   *Residue:* The distinctively moral "ought" resists reduction to an equilibrium-selection device. An equilibrium selector explains *how* we choose; a moral obligation explains *why we are bound* even if selection fails. If the sanction probability drops to zero, the prudential "ought" vanishes. The moral "ought" purportedly remains. Game theory can only model this by stipulating "ghost in the machine" preferences, which explains nothing.

  *   **Arbitrariness vs. Content:** Game theory treats equilibria in coordination games as often payoff-equivalent (or at least arbitrary regarding *which* equilibrium). However, many conventions (like queueing) are argued to be moral because they embody *fairness*, not just coordination.
      *   *Distortion:* If queueing is just a Nash Equilibrium, then a "first-come-first-served" rule is no more morally weighty than a "last-come-first-served" rule, provided both are stable equilibria.
      *   *Residue:* The philosophical debate insists the *content* of the convention matters (fairness vs. efficiency). Game theory treats the content as exogenous. To capture this, you must endogenize the fairness constraint into the payoff function, which assumes what needs to be explained (why do agents value fairness?).

  **3. What Cannot Be Expressed (The Hard Residue)**
  *   **Legitimacy vs. Power:** The game-theoretic account of the visitor's obligation relies on **common knowledge** and **sanctions**. If the locals punish the visitor for not tipping, GT models this as a payoff $-k$. It cannot distinguish between *legitimate enforcement* of a norm and *protection racketeering*.
      *   *The Problem:* The philosophical debate asks: Do locals have the *authority* to impose their equilibrium on a transient visitor? GT describes the *capacity* to impose (via sanctions) but has no vocabulary for the *right* to impose.
      *   *Defect or Vagueness?* This exposes a defect in GT vocabulary regarding *rights*. However, it also exposes that the original philosophical debate is often less clear than it looks. Philosophers often slide from "you ought to comply" (moral) to "you ought to comply to avoid trouble" (prudential) to "you ought to comply because it's fair." GT forces these apart. If the visitor's obligation is based on **fairness** (Principle of Fairness), GT requires us to specify the "benefit" accepted. If the visitor is a tourist who doesn't care about the local queueing order, have they accepted a benefit? GT reveals the philosophical argument here is often circular.

  *   **The "Ought" as More than Sanction:** Is the moral ought anything more than an equilibrium-selection device or social sanction?
      *   *Verdict:* In GT, **No**. In GT, stability is ultimately cashed out in incentives (payoffs). If you remove the incentive (sanction or coordination benefit), the "obligation" disappears as a behavioral predictor.
      *   *Philosophical Residue:* The philosophical claim is that moral obligations provide *reasons for action* that are independent of incentives. GT cannot model "reasons" except as "preferences." Therefore, GT cannot capture the phenomenon of an agent complying with a norm *because it is right* while acknowledging it is against their interest, without redefining "interest" to include "being right." This is tautological.

  **4. Conclusion on the Visitor's Obligation**
  Is the visitor's obligation best understood as a problem of common knowledge, fairness, or something else?
  *   **Common Knowledge:** This explains the *possibility* of compliance (the visitor knows what to do), but not the *obligation*.
  *   **Fairness:** This is the strongest GT-compatible candidate. If the visitor benefits from the locals' coordination (e.g., safety in traffic), defection is a dominant strategy that exploits the cooperators. This maps to a free-rider problem in a public goods game embedded within the coordination game.
  *   **The Residue:** The "Something Else" is **Consent**. Philosophers often argue obligations arise from consent. GT has no natural way to model tacit consent without resorting to "revealed preference" (which makes consent trivial). If the visitor walks on the sidewalk, have they consented to the queueing norm? GT says "they revealed a preference for using the sidewalk." Ethics asks "did they agree to the rules?" This gap is unbridgeable in standard GT.

  **Summary Judgment**
  The game-theoretic translation succeeds in clarifying the *mechanics* of convention (stability, expectations, sanctions). It fails to capture the *normativity* (legitimacy, categorical force, content-based value).
  *   **Defect in GT:** The vocabulary lacks a formal operator for "legitimate authority" distinct from "equilibrium stability."
  *   **Vagueness in Original Debate:** The philosophical debate often conflates the *stability* of a norm (it works) with the *justification* of a norm (it is right). GT forces a separation: a norm can be a stable Nash Equilibrium (e.g., a caste system) without being morally obligatory. The residue reveals that much of the "moral obligation" debate regarding conventions is actually a debate about whether stability alone generates legitimacy. GT suggests it does not; Philosophy is divided. GT clarifies the division by removing the ambiguity.
