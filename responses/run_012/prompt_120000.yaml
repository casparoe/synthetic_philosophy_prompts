  8.  **Constructing the Argument (Mental Outline):**
      *   **Thesis:** The show is a *process* theodicy wrapped in a *static* metaphysical costume. It saves Leibniz's intuition (evil serves good) but rejects his mechanism (pre-established harmony).
      *   **The Points System:** Perfect analogy for compossibility. Unintended consequences make isolation impossible.
      *   **The Reboots:** This is the friction point. Leibniz's God doesn't reboot. But if we view the reboots as *internal* to the single chosen timeline (Michael learning is part of the script), it works.
