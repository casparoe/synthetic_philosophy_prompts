answer: |-
  This is the classic "Normativity Objection" to deflationism, and it is the strongest card your colleague has to play. It feels intuitive: if truth isn't a *substantive* property (like mass or charge, or even a robust correspondence relation), how can it carry the weight of a *goal*? How can we be obligated to pursue something that is metaphysically thin?

  Your colleague is assuming that for a norm to be binding, the property governing it must be causally or metaphysically robust. That is the mistake you need to target.

  Here is the reply you should give her, followed by a way to handle the student's worry, because they are actually two sides of the same coin.

  ### The Reply to Your Colleague

  **"You're conflating the metaphysics of the property with the constitutive norms of the attitude."**

  Tell her this: Deflationism denies that truth is a *substantive* property, not that it is a *normative* one. The normativity doesn't come from the word 'true' adding some extra metaphysical glow to a proposition. The normativity comes from the nature of **belief** itself.

  To believe that $p$ *just is* to hold $p$ as true. You cannot separate the attitude of belief from the aim of truth. As Bernard Williams and others have argued, truth is a constitutive norm of belief. If I admit that I believe $p$ but I don't care whether $p$ is true, I am no longer describing a belief; I am describing a fantasy or a hope.

  So, when we say "inquiry aims at truth," the deflationist translation is: "Inquiry aims at believing $p$ only if $p$."

  The work isn't being done by a robust property called Truth; it's being done by the **content** of the beliefs and the **constraints of the world**.
  *   Why ought I believe it is raining? Not because "truth" is a magical target.
  *   I ought to believe it is raining because *it is raining*, and I want my mind to match the world.

  The predicate 'true' earns its keep logically (allowing us to say "Everything the Pope says is true" without infinite conjunction), not normatively. The normativity is already present in the act of asserting and believing. Deflationism doesn't remove the obligation to believe what is true; it clarifies that the obligation stems from our commitment to representing the world accurately, not from a reverence for a property called Truth.

  **The Punchline:** "You think I need a robust property to ground the norm. I say the norm is grounded in the practice of assertion. If I assert $p$, I undertake a commitment that $p$. 'True' is just the marker of that commitment. The 'ought' comes from the rules of the game of giving and asking for reasons, not from the metaphysics of the scorekeeper."

  ### The Reply to the Student (and the "Real Truth" Worry)

  Your student's worry ("Is it *really* true or just what we say?") suggests they think deflationism collapses into relativism or subjectivism. This is the most common misunderstanding. The Equivalence Schema is actually your best weapon against relativism, not a concession to it.

  When the student asks, "Is it *really* true?", they usually mean: "Is this true independently of what I think?"

  **Tell them this:** "Deflationism is actually the most realistic view you can hold. Look at the schema:
  *'Snow is white' is true if and only if snow is white.*

  The right side of that equation ('snow is white') does not mention us, our language, or our verification procedures. It mentions snow. If snow is white, the sentence is true, regardless of whether we say it, like it, or know it.

  When you worry that deflationism makes truth 'just whatever we say,' you are confusing **truth** with **warranted assertibility**.
  *   **Warranted Assertibility:** Do we have evidence to say this? (This depends on us).
  *   **Truth:** Is this the case? (This depends on the world).

  Deflationism says 'true' doesn't add anything to 'is the case.' So, if you think the world exists independently of us, then truth exists independently of us. I am not saying a statement is true because we endorse it. I am saying we *ought* to endorse it because it is true (i.e., because the world is that way).

  The schema protects realism. It says you can't have the truth without the world cooperating."

  ### Synthesizing the Two: Why the Predicate Still "Earns Its Keep"

  Your colleague says the predicate stops earning its keep. You need to correct her on *what* the keep is.

  If truth were a robust property, we would expect it to explain things causally (e.g., "He succeeded *because* his beliefs were true"). Deflationists (like Field) admit this is tricky, but the reply is that the explanatory work is done by the **reliability of the cognitive mechanism**, not the property of truth.

  However, the predicate 'true' earns its keep **expressively**. Without it, we are linguistically crippled.
  *   Without 'true', I cannot say: "Every theorem in this book is correct." (I'd have to list them all).
  *   Without 'true', I cannot say: "I want to believe only what is true." (I'd have to say "I want to believe $p$ only if $p$, and believe $q$ only if $q$..." for every proposition).

  **The Closing Argument for your Colleague:**
  "You say I can't claim truth is what inquiry aims at. But my view explains *why* that slogan is empty if taken metaphysically. Inquiry aims at believing $p$ only if $p$. The 'value' of true beliefs isn't that they possess the property of Truth; it's that true beliefs allow us to navigate the world successfully. If I believe the bridge is safe, and it *is* safe (true), I cross successfully. The success comes from the bridge's safety, not the truth-predicate. Deflationism doesn't make truth less important; it stops us from worshipping the word and forces us to look at the world."

  ### Summary for your next meeting

  1.  **Normativity is Constitutive:** The "ought" comes from the nature of belief, not the nature of the property Truth.
  2.  **Schema = Realism:** The T-schema anchors truth to the world, not to our endorsement. It blocks relativism.
  3.  **Expressive Utility:** The predicate earns its keep by enabling generalization, not by being a causal power.

  You aren't denying that truth matters. You are denying that it matters *because* it is a mysterious, robust property. It matters because getting things right matters. Deflationism is the view that "getting things right" doesn't need metaphysical inflation to be valuable.
