prompt: |-
  My colleague in the next office has been on my case again about deflationism. Her line: once you say 'true' is just an endorsement device and the equivalence schema does all the work, you can't any longer claim that truth is what inquiry aims at, or that you ought to believe what's true -- the predicate stops earning its keep -- and I'll admit that when a student asks whether anything is really true or whether it's all just whatever we say, I get tongue-tied. I can recite the schema, but if deflationists are denying that truth is a real property, then what seperates my true beliefs from my false ones, and why is believing the true ones anything more than a slogan? I want the reply I should have given her, and I'd rather you didn't just tell me to go back and re-read the objections.
