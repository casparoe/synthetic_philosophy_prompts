answer: |-
  **Essay Question**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. You may not consult external materials. Define your terms clearly.

  Consider the following six systems:
  1.  **The Autocatalytic Reactor:** A chemical network in a continuous-flow reactor that maintains a far-from-equilibrium steady state, constructs its own membrane-like boundary from feedstock, and transmits heritable variation in boundary composition to daughter reactors. It contains no nucleic acids.
  2.  **The Digital Strings:** A population of code strings inside a computer that copy themselves with mutation and are winnowed by a selection algorithm, yet possess no physical metabolism or thermodynamic boundary.
  3.  **The Virus:** A protein-encased genetic element that evolves rapidly but requires a host cell to replicate.
  4.  **The Mule:** A sterile mammalian hybrid that maintains homeostasis but cannot reproduce.
  5.  **The Prion:** A misfolded protein that induces misfolding in others, propagating structure without genetic material.
  6.  **The Mitochondrion:** An organelle that metabolizes and maintains boundaries but relies on the host nucleus for replication instructions.

  It has been proposed that the question "Is this alive?" conflates two distinct inquiries: (A) Does the system currently sustain itself away from equilibrium? (Self-Maintenance) and (B) Does the system belong to a lineage with a selective history? (Lineage).

  Write an essay that addresses the following:
  1.  Evaluate whether the distinction between Self-Maintenance and Lineage clarifies the status of the six cases above.
  2.  Deliver a definitive verdict on whether **The Autocatalytic Reactor** or **The Digital Strings** qualifies as "alive." Justify this verdict using your evaluation of the distinction.
  3.  Conclude by arguing whether "Life" is a single natural kind, a disjunction of criteria that merely happen to co-occur on Earth, or a pragmatic term whose content shifts depending on the scientific project (e.g., biosafety vs. astrobiology).

  ***

  **Model Answer**

  The proposal that "Is it alive?" conflates Self-Maintenance and Lineage is not merely helpful; it is necessary to dissolve the confusion surrounding borderline cases. Standard definitions fail because they assume these two properties always travel together. On Earth, they usually do. When they decouple, the ambiguity reveals that "Life" is not a single natural kind discovered in nature, but a pragmatic term whose definition shifts depending on whether the inquiry is thermodynamic or evolutionary.

  To evaluate the distinction, we must apply it rigorously. The Virus fails Self-Maintenance; it is chemically inert outside a host. It passes Lineage. The Mule passes Self-Maintenance but fails Lineage, as it cannot contribute to a selective history. The Prion fails Lineage in the Darwinian sense; it propagates structure but lacks the variation required for open-ended evolution. The Mitochondrion passes Self-Maintenance but fails Lineage as an independent unit; its evolutionary history is now subsumed by the host. These classifications are only confusing if we insist "Life" must be a binary switch. If we accept the two-question hypothesis, the status of each becomes clear relative to the criterion being applied.

  This distinction forces a verdict on the unfamiliar cases. The Digital Strings must be judged **not alive** in a biological context. While they satisfy Lineage perfectly, mutating and selecting within their environment, they lack Self-Maintenance. They do not fight entropy; they do not harvest energy to maintain a physical boundary. They are patterns, not systems. To call them alive is to confuse the map with the territory. Evolution requires a substrate, but life requires the *work* of staying alive against thermodynamic decay. Without the thermodynamic cost of existence, there is no biological agency, only information processing.

  The Autocatalytic Reactor, conversely, **is alive**. It satisfies both criteria. It maintains a far-from-equilibrium state (Self-Maintenance) and transmits heritable variation subject to selection (Lineage). The absence of nucleic acid is irrelevant; chemistry is the substrate, not the definition. If a system builds its own boundary and evolves, it is a living system. The hesitation to call it alive stems from carbon chauvinism, not conceptual rigor. It demonstrates that Life is a disjunction of criteria that *can* co-occur independently, but only constitute "Life" in the full biological sense when combined.

  Therefore, "Life" is not a natural kind. A natural kind implies a single underlying essence shared by all members. There is no such essence here. There is only a cluster of properties—thermodynamic agency and evolutionary history—that coincide on Earth. For the biochemist, Self-Maintenance is the primary criterion; without metabolism, there is nothing to study. For the evolutionary biologist, Lineage is primary; without history, there is no adaptation. For astrobiology, we must prioritize Self-Maintenance, as we cannot observe exoplanet lineages from afar. For biosafety, we prioritize Lineage, as only evolving systems pose epidemic risks.

  To insist on a single definition is to mistake a tool for a truth. The distinction between Self-Maintenance and Lineage does not solve the definition of life; it dissolves it. It shows that the question is not "What is life?" but "Which property matters for this inquiry?" The Reactor is alive because it works and evolves. The Strings are not because they do not work. The Virus is a genetic parasite, not a living organism. This pragmatic approach avoids the traps of essentialism and allows science to categorize based on causal power rather than linguistic comfort. We should not ask if something is alive. We should ask what it does, and whether that matters to us.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  1.  **Evaluation of the Distinction (4 marks)**
      *   *Requirement:* Explicitly applies the Self-Maintenance/Lineage split to at least four of the familiar cases (Virus, Mule, Prion, Mitochondrion) to show how it clarifies their status.
      *   *Common Mistake:* Students recite standard definitions of these cases without mapping them onto the two proposed criteria.

  2.  **Verdict on Unfamiliar Case (4 marks)**
      *   *Requirement:* Delivers a clear "Yes/No" verdict on either the Reactor or the Strings (or both) with justification grounded in the Self-Maintenance/Lineage framework.
      *   *Common Mistake:* Hedging the verdict (e.g., "It depends on who you ask") rather than taking a committed stance as instructed.

  3.  **Ontological Conclusion (4 marks)**
      *   *Requirement:* Takes a position on whether Life is a natural kind, a disjunction, or a pragmatic term, consistent with the earlier argument.
      *   *Common Mistake:* Concluding that Life is a natural kind despite evidence presented in the essay that suggests otherwise.

  4.  **Argumentative Coherence (4 marks)**
      *   *Requirement:* The essay maintains a single logical thread where the verdict on the unfamiliar case supports the ontological conclusion.
      *   *Common Mistake:* Contradicting the earlier analysis in the conclusion (e.g., arguing for pragmatism after arguing for essentialism).

  5.  **Handling of Constraints (4 marks)**
      *   *Requirement:* Adheres to the exam conditions (no citations/authors) and uses the provided case descriptions accurately without importing external assumptions.
      *   *Common Mistake:* Importing external knowledge (e.g., claiming the Reactor is impossible) rather than analyzing the hypothetical as given.

  **Differentiation:** A first-class answer distinguishes itself by recognizing that the "Self-Maintenance/Lineage" distinction itself implies the pragmatic view, whereas a solid second-class answer treats the distinction merely as a better checklist for the same old definition.
