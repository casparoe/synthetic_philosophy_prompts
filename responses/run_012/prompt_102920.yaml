answer: |-
  Here is my actual credence on the claim that Scanlon's contractualism can justify saving the five without relying on aggregation: I am at 0.30. I am slightly more skeptical than you are, mostly because I think the textual evidence is strong but the philosophical heavy lifting is doing work it wasn't designed to do. To break this down, I am assigning confidence levels to the four sub-questions you raised, treating them largely as necessary conditions where weakness in one drags down the whole enterprise.

  First, on whether the tie-breaker move is a legitimate reading of Scanlon, I give that a 0.85. The text in What We Owe to Each Other is fairly explicit that when complaints are similar in strength, the number of people holding them matters for whether a principle can be reasonably rejected. Scanlon explicitly argues that the single person cannot reasonably reject a principle that allows saving the greater number, whereas the greater number can reject a principle that requires saving the single person. The textual case is strong, so I am confident this is what Scanlon is actually saying, even if it is controversial.

  Second, on whether comparative unfairness is doing real work or just decorating the intuition, I am much lower, around 0.40. This is the crux of the issue. The worry is that saying the five have a stronger case because it would be unfair to ignore them is just a verbal shim for saying the five matter more because there are five of them. If the unfairness cashes out entirely in terms of the number of people disappointed, then it is aggregation by another name. I suspect the concept is doing less independent work than Scanlonians want to admit, which is why my confidence here is below the halfway mark.

  Third, regarding whether anti-aggregation is a stable constraint to begin with, I assign a 0.50. The idea is that we want to avoid summing welfare but still acknowledge numbers. The stability of this position depends on whether there is a coherent middle ground between strict individualism and utilitarianism. Many critics argue this middle ground collapses under pressure, either becoming arbitrary or secretly aggregative. Since the literature has not produced a consensus on a stable formulation that avoids both pitfalls, I treat this as a coin flip.

  Fourth, on whether the fix stays non-ad-hoc rather than getting patched in, I give that a 0.45. The tie-breaker argument feels like a response to the Rescue Case counterexample rather than a natural consequence of the core formula of reasonable rejection. If the core formula naturally yielded the result, the extra machinery about fairness and tie-breaking would not be needed. The fact that it requires specific augmentation to handle the classic case suggests it is a patch, which lowers the probability that the view is robust.

  To combine these into my final figure of 0.30, I am treating these factors as conjunctive rather than additive. For the claim to be true, the reading must be legitimate, the unfairness argument must be substantive, the constraint must be stable, and the solution must be non-ad-hoc. If I simply averaged the numbers, I would end up near 0.55, but that is too generous because a failure in any one category undermines the whole claim. Instead, I let the lowest scores cap the overall probability. The 0.85 on textual legitimacy gets dragged down significantly by the 0.40 and 0.45 on substance and ad-hocness. I discount the average to reflect the risk that these weaknesses are correlated, meaning if the unfairness argument is hollow, the stability constraint likely fails too.

  The term I trust least is the second one, whether comparative unfairness is doing real work. This is the engine of the solution, and if it is just aggregation disguised as fairness, the claim fails outright. The argument or evidence that would move this number most would be a formal reconstruction of the contractualist derivation that shows exactly how the number of people enters the justification without entering the weighting of complaints. If someone could demonstrate a model where the principle is rejected by the five for a reason that does not implicitly rely on the sum of their interests, but rather on a structural feature of the agreement itself, I would raise my credence significantly.

  Finally, for us to agree that the thing is actually settled, we would need to agree on a verdict condition. I think settlement requires a derivation that both of us accept as valid where the output is save the five, but the input premises contain no variable for group size affecting moral weight. If the derivation requires a premise that says more people generate more reasons, we should call that aggregation. If the derivation relies on a premise about procedural fairness that is independent of headcount but incidentally favors the larger group, then Scanlon succeeds. Until we have a formal model that separates those two inputs clearly, we will keep talking past each other.
