answer: |-
  The arithmetic of the Virginia 94th District case begins with the electorate size, approximately 23,216 valid votes cast for the two major candidates. Under the independent fair coin assumption, the probability of a tie among $N$ voters scales as $1/\sqrt{N}$, yielding an ex ante pivotal probability of roughly $5 \times 10^{-3}$. Under the more realistic assumption that the margin is a normal random variable with a standard deviation of a few percentage points, uncertainty dominates sampling error, and the probability scales as $1/N$, dropping the estimate to orders of magnitude near $10^{-5}$. If we assign a cost ($C$) of voting—time, travel, opportunity—of roughly \$50, the required benefit ($B$) of controlling the chamber to make voting rational is \$10,000 under the coin model and \$5,000,000 under the uncertainty model. While \$10,000 is conceivable for a high-stakes policy shift, \$5,000,000 is not available to an ordinary voter, suggesting the instrumental calculus fails unless the probability estimate is inflated by hindsight.

  The rational-choice calculus struggles to accommodate the specific mechanics of this episode. First, because ties are resolved by lot, a vote that creates a tie is only half-pivotal, halving the expected benefit term further. Second, the decisive acts were judicial (counting a disputed ballot) and random (the draw), meaning the locus of decision temporarily left the voters entirely, rendering the instrumental value of casting a ballot contingent on external arbiters. Third, the presence of a Libertarian candidate taking 675 votes complicates the binary assumption underlying the standard probability formulas, though this is a minor technicality compared to the lot resolution. Finally, the ex post fact of a one-vote margin is often mistaken for ex ante probability; while the margin was zero, the expectation before the vote was not, and rational choice relies on the expectation.

  Contrast this with the 2014 Scottish independence referendum, where $N \approx 3.6$ million and the margin was 10 percentage points. Here, the pivotal probability is astronomically lower than in Virginia, effectively zero for both the coin and uncertainty models, yet turnout was 84.6 per cent. The rational-choice theory can only explain this by inflating the duty or expressive term ($D$) to massive proportions, whereas the Virginia case allows a slender thread of instrumental rationality under the coin-flip assumption. The theory explains why turnout might be sensitive to poll closeness in Virginia, but it misdescribes the Scottish case as irrational unless $D$ is doing all the work, and it passes over the expressive value of participating in a historic event regardless of impact.

  This leaves the theory in an embarrassed but unfalsifiable position. It is embarrassed because the instrumental term ($PB$) is negligible in almost all real elections, including Virginia under realistic uncertainty assumptions. It is unfalsifiable because the duty term ($D$) can be adjusted post hoc to match any turnout rate, absorbing the discrepancy between predicted and observed behavior. An expressive or collective-action account does better by positing that voting is a consumption good or a social signal, explaining high turnout in large elections like Scotland where instrumental impact is nil. However, this account gives up the claim that voters are motivated by policy outcomes, suggesting they vote to affirm identity rather than to change results.

  To discriminate between these accounts, consider a binding vote in a small committee of ten people versus a national election. The instrumental account predicts high turnout in the committee (where $P$ is high) and low turnout nationally; the expressive account predicts high turnout in both if the social pressure or identity salience is equal. If turnout remains high in the national election despite $P \approx 0$, the expressive account is vindicated, whereas the instrumental account must rely on the unfalsifiable duty term.

