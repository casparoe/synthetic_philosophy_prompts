answer: |-
  You have independently reconstructed the central problems of the philosophy of language from the last 140 years. Your intuition that "something has to give" is correct; the history of this field is a history of philosophers choosing which of your requirements to sacrifice to save the others.

  Below is the specification you asked for. It is organized as a set of constraints any theory of names and identity must satisfy. I have annotated each with the **Consideration** (why it is demanded), the **Status** (whether it is a hard fact or a theoretical commitment), and I have flagged the **Conflicts** where the requirements clash.

  ### I. The Data Constraints (Cases the Theory Must Cover)

  **1. The Informative Identity Constraint**
  *   **Case:** The Long Water / Black River. Learning they are the same is a discovery; learning the Long Water is the Long Water is not.
  *   **Consideration:** A theory must explain why $a=b$ has a different cognitive value than $a=a$, even if $a$ and $b$ refer to the same object.
  *   **Status:** **Genuine.** This is a phenomenological fact about learning.
  *   **Conflict:** Clashes with the view that the *only* function of a name is to pick out an object (if the object is the same, the statement should be equally trivial).

  **2. The Empty Name Constraint**
  *   **Case:** The Invented Grandmother. The name was used meaningfully for decades, though no person bore it.
  *   **Consideration:** A theory must account for the meaningfulness of sentences containing names that have no referent. We can say "The Grandmother never existed" meaningfully.
  *   **Status:** **Genuine.** We do communicate using empty names.
  *   **Conflict:** Clashes with the view that a name's meaning *is* its bearer (if there is no bearer, there is no meaning).

  **3. The Ambiguity Constraint**
  *   **Case:** One Name / Two People (e.g., two neighbors named "John").
  *   **Consideration:** A theory must explain how the same sound/text can refer to different objects in different contexts without changing the name itself.
  *   **Status:** **Genuine.** Homonymy is a fact of language.
  *   **Conflict:** Clashes with the view that a name is a unique description (if the description fits two people, the name should fail or refer to both).

  **4. The Ignorance and Error Constraint**
  *   **Case:** Borrowed Reference. Using a name confidently on say-so, unable to identify the bearer uniquely.
  *   **Consideration:** A theory must allow that a speaker can successfully refer to an object even if their personal knowledge of that object is false or insufficient.
  *   **Status:** **Genuine.** Most of our knowledge of history/science is borrowed.
  *   **Conflict:** Clashes with the view that to use a name, you must possess a defining description of the object (Descriptivism).

  **5. The Persistence Constraint**
  *   **Case:** The Outliving Name. The thing is destroyed, but the name is still used (e.g., "The World Trade Center" after 2001).
  *   **Consideration:** A theory must explain whether the name now refers to a memory, a ruin, nothing, or the past object.
  *   **Status:** **Genuine.** Language persists through ontological change.
  *   **Conflict:** Clashes with the view that reference requires a present causal link to an existing object.

  **6. The Relativity Constraint**
  *   **Case:** The Archivist vs. You. The identity is a discovery for you, but trivia for the archivist.
  *   **Consideration:** A theory must account for the fact that "informativeness" is not a property of the sentence alone, but of the sentence *relative to a mind*.
  *   **Status:** **Genuine.** Information is observer-dependent.
  *   **Conflict:** Clashes with the view that "Meaning" is a public, static object shared identically by all speakers.

  ---

  ### II. The Distinctions (Boundaries the Theory Must Not Collapse)

  **7. The Reference / Sense Distinction**
  *   **Requirement:** The theory must distinguish *what the name picks out* (the object) from *how the name picks it out* (the mode of presentation).
  *   **Consideration:** Without this, you cannot solve the Long Water/Black River case.
  *   **Status:** **Partisan Commitment.** (Fregean). Some theories (Millianism) deny this distinction exists semantically, pushing it into psychology.
  *   **Conflict:** If you enforce this, you complicate the logic of identity. If you reject it, you cannot explain discovery.

  **8. The Semantic / Pragmatic Distinction**
  *   **Requirement:** The theory must distinguish what a sentence *says* (truth conditions) from what a speaker *conveys* (contextual information).
  *   **Consideration:** Needed to handle the Archivist case. The sentence says the same thing to both; it conveys new info to one.
  *   **Status:** **Partisan Commitment.** (Gricean/Modern).
  *   **Conflict:** Hard to draw the line cleanly in cases of Empty Names.

  ---

  ### III. The Incompatibility Matrix (What Has to Give)

  You asked to flag pairs that cannot be held together. Here are the critical fault lines:

  **Conflict A: The "Meaning is Reference" Thesis vs. The Informative Identity Constraint**
  *   **Tension:** If the meaning of a name is just the object it names, then "Long Water = Black River" means exactly the same as "Long Water = Long Water" (Object = Object).
  *   **Verdict:** These cannot be held together.
  *   **Resolution:** You must surrender the idea that Meaning = Reference. You must allow that names have a "mode of presentation" (Sense) or that cognitive value is separate from semantic content.

  **Conflict B: The "Descriptive" Thesis vs. The Ignorance Constraint**
  *   **Tension:** If a name means "the person who did X," and I don't know who did X (or believe falsely they did Y), I shouldn't be able to use the name. But I do.
  *   **Verdict:** These cannot be held together.
  *   **Resolution:** You must surrender the idea that names are disguised descriptions. Reference must be sustained by something other than your personal knowledge (e.g., a social chain).

  **Conflict C: The "Public Meaning" Thesis vs. The Relativity Constraint**
  *   **Tension:** If meaning is a shared public object, how can the sentence be informative to me but not the archivist?
  *   **Verdict:** These cannot be held together *if* you define "Meaning" as "Cognitive Information."
  *   **Resolution:** You must distinguish **Semantic Content** (public, shared, truth-conditional) from **Cognitive Significance** (private, variable, informational).

  ---

  ### IV. The Verdict

  You asked three specific questions to conclude. Here are the answers based on the specification above.

  **1. Which pair cannot be reconciled, and which should be surrendered?**
  The pair is: **"Meaning is shared by everyone"** vs. **"Identity statements differ in informativeness."**
  *   **Surrender:** You should surrender the requirement that **"Meaning" must account for "Informativeness."**
  *   **Reasoning:** Informativeness is a psychological state (the Archivist case). Meaning is a linguistic tool. If you try to build the psychological state into the linguistic meaning, you break the ability to communicate (because we all have different psychological states).
  *   **The Fix:** Adopt a two-tier view. The *Semantic Content* is shared (the fact that the river is the river). The *Cognitive Path* to that content is private (how you identified the river). The theory must explain the content, not the psychology.

  **2. Which single requirement does the most to rule out the obvious theories?**
  **The Ignorance and Error Constraint (Case 4).**
  *   **Reasoning:** The most "obvious" theory (Descriptivism) says a name is a shorthand for a description (e.g., "Aristotle" means "The teacher of Alexander"). This theory is intuitive and easy to teach.
  *   **The Killer:** Your case of the person using a name on "say-so" destroys this. If I say "Feynman" but cannot describe him uniquely (I might confuse him with Gell-Mann), Descriptivism says I have failed to refer. But intuitively, I *did* refer to Feynman.
  *   **Impact:** This requirement forces the theory to move away from individual knowledge and toward **social mechanisms** (causal chains, communities, usage). It rules out any theory that locates reference entirely inside the speaker's head.

  **3. What is the specification's hardest demand?**
  **The Empty Name Constraint (Case 2).**
  *   **Reasoning:** It is easy to make a theory that handles reference when things exist (Causal theories work well here). It is easy to make a theory that handles information (Fregean Senses work well here).
  *   **The Hard Part:** Explaining how "Santa Claus does not exist" is true. If "Santa Claus" has no reference, the sentence seems to be about nothing. If it has a "sense," what is that sense made of? This requirement breaks almost every system that tries to be logically rigorous.

  ### Summary Advice for Your Thinking
  You are currently holding a view that mixes **Semantics** (how words hook to the world) with **Epistemology** (how we know things).
  *   The **Archivist Case** proves these are different.
  *   The **Long Water Case** proves names have more to them than just the object.
  *   The **Say-So Case** proves names have less to do with your knowledge than you think.

  Any theory you accept must separate the **Social Mechanism of Reference** (how the name gets to the object) from the **Individual Cognitive State** (what you know about the object). If you try to make them the same thing, the specification will break.
