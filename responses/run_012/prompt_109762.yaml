prompt: |-
  I have no academic training, but I have been thinking on my own about how an identity statement can tell you something, and before I read any more about it I want the specification first. Not a theory — the list of requirements any theory in this area would have to meet. Give me the cases it must get right, the distinctions it must not collapse, and the facts about how names actually work that it has to fit, each with the consideration that puts it on the list; say which of the requirements are genuine and which are only the commitments of one side; and flag any pair that cannot be held together.

  The cases I keep coming back to, and would want covered: two names for the same thing learned in separate settings, where learning that they name one thing is a real discovery (a river that the people upstream call the Long Water and the people downstream call the Black River, and someone walks its whole length); a name with no bearer at all, used for decades in a family for a grandmother who turns out to have been invented; one name carried by two different people; a name used confidently on nothing but other people's say-so, by someone who could not say who it names; a name that outlives the thing it named, still used as though the thing were there; and a true identity that is a discovery to one person and nothing to another, since the fact that startles me when I recognise myself in an old newspaper story is a fact an archivist has known for years.

  I am fairly sure something has to give here, and I want to know what. A theory that says the meaning of a sentence is shared by everyone who understands it seems to sit badly with the requirement that learning that the two names name one river differs in meaning from learning that the river is itself. If that pair really cannot be reconciled, say which one should be surrendered, and tell me which single requirement does the most to rule out the obvious theories.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Profile:** No academic training in philosophy/logic, but has been thinking deeply about identity statements (specifically names and reference).
      *   **Goal:** Wants a "specification" (a list of requirements/constraints) for any theory of names/identity *before* reading existing theories.
      *   **Specific Demands:**
          *   List of cases the theory must get right.
          *   Distinctions it must not collapse.
          *   Facts about name usage it must fit.
          *   For each requirement: Explain *why* it's on the list (the consideration).
          *   Classify requirements: Genuine vs. Commitments of one side.
          *   Flag incompatibilities: Pairs that cannot be held together.
          *   Resolve the specific tension mentioned: Shared meaning vs. informative identity (Frege's Puzzle).
          *   Identify the single requirement that rules out the most obvious theories.

  2.  **Deconstruct the User's Examples (The "Data"):**
      *   *Long Water/Black River:* Two names, one object, informative identity ($a=b$ is informative, $a=a$ is not). This is the classic Fregean puzzle.
      *   *Invented Grandmother:* Empty name (no bearer), yet used meaningfully for decades.
      *   *One Name, Two People:* Ambiguity/Homonymy (e.g., "John Smith").
      *   *Borrowed Reference:* Using a name on say-so without knowing the bearer (Kripke's "Gödel/Schmidt" style or Evans's "Madagascar" case).
      *   *Outliving the Thing:* Names persisting after destruction/death (e.g., "Vulcan" or a destroyed building).
      *   *Relative Informativeness:* Identity is a discovery for me, but known by the archivist. (Context-dependence of cognitive significance).

  3.  **Drafting the Specification (The Requirements):**
      *   I need to formalize these intuitions into constraints.
      *   *Constraint 1: The Informative Identity Constraint.* (Long Water/Black River). $a=a$ is trivial; $a=b$ can be informative.
      *   *Constraint 2: The Empty Name Constraint.* (Invented Grandmother). Names can be meaningful even if nothing bears them.
      *   *Constraint 3: The Uniqueness/Sharing Constraint.* (One name, two people). A name form can apply to multiple objects; context determines which.
      *   *Constraint 4: The Ignorance/Error Constraint.* (Borrowed reference). You can use a name successfully without knowing the defining description of the object.
      *   *Constraint 5: The Persistence Constraint.* (Outliving the thing). Reference can fail or shift when the object ceases to exist, but the name remains in circulation.
      *   *Constraint 6: The Cognitive Variance Constraint.* (Archivist vs. Me). The *value* of the information depends on the speaker/hearer's state, not just the sentence.

  4.  **Analyzing Compatibility & Tensions (The "Hard Stuff"):**
      *   *The Big Tension:* Meaning as Shared vs. Meaning as Cognitive Significance.
      *   If meaning is public/shared (social), how can $a=b$ be informative to me but not you?
      *   If meaning is individual/cognitive, how do we communicate at all?
      *   *Frege's Solution:* Sense ($Sinn$) vs. Reference ($Bedeutung$).
      *   *Kripke's Solution:* Rigid Designation + Causal Chain (rejects descriptive meaning).
      *   *The Conflict:* The "Informative Identity Constraint" clashes with a naive "Meaning = Reference" theory. It also clashes with a strict "Meaning = Shared Public Content" theory if cognitive significance varies.

  5.  **Classifying Requirements (Genuine vs. Partisan):**
      *   *Genuine:* We actually do learn things from $a=b$. We actually do use empty names. We actually do borrow reference.
      *   *Partisan:* "Meaning must be a mental idea" (Fregean). "Meaning must be purely causal" (Kripkean). "Sentences have truth values independent of context" (Classical logic).

  6.  **Addressing the Specific Question:** "If that pair really cannot be reconciled, say which one should be surrendered."
      *   The pair: "Meaning is shared" vs. "Identity is informative."
      *   Standard philosophical consensus: You don't surrender "Identity is informative" (that's a datum). You refine "Meaning is shared." You distinguish *Semantic Content* (shared) from *Cognitive Significance* (individual).
      *   However, the user asks for *my* assessment based on the specification.
      *   The requirement that does the most damage to "obvious theories" (like Descriptivism) is the *Ignorance/Error Constraint* (Kripke's modal argument/epistemic argument).

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the sophistication of the inquiry.
      *   **The Specification (The List):** Group by Cases, Distinctions, and Facts.
      *   **Annotation:** For each, add the "Consideration" (Why it matters) and "Status" (Genuine/Partisan).
      *   **The Incompatibility Matrix:** Highlight the tensions.
      *   **The Verdict:** Address the "Meaning vs. Information" tension and the "Killer Constraint."

  8.  **Self-Correction/Nuance Check:**
      *   *Caution:* Don't just lecture on Frege/Kripke. The user asked for the *specification*, not the history. Use the history to inform the specification but keep the focus on the constraints.
      *   *Tone:* Respectful of the "no academic training" claim (which is clearly modest given the insight). Treat them as a peer in inquiry.
      *   *Empty Names:* This is a huge problem for Millianism (Meaning = Reference). Must highlight this.
      *   *Archivist Case:* This highlights the difference between *proposition expressed* and *proposition grasped*.
      *   *One Name/Two People:* This challenges the idea that names are uniquely identifying descriptions.

  9.  **Finalizing the "Surrender" Advice:**
      *   Which requirement to surrender? Usually, philosophers try to keep all. But if forced, the idea that "Semantic Meaning *is* Cognitive Information" must go. Semantic meaning is stable; cognitive information is variable.
      *   Which requirement rules out obvious theories? The "Ignorance/Error" case (using a name without knowing the bearer) kills the Descriptivist theory (that a name *means* a description).

  10. **Drafting the Content (Mental Outline):**
      *   Intro: You've reinvented the core problems of the Philosophy of Language (Frege, Kripke, etc.).
      *   Section 1: The Data Points (Your cases formalized).
      *   Section 2: The Distinctions (Sense/Ref, Use/Mention, etc.).
      *   Section 3: The Conflicts (The "Something has to give").
      *   Section 4: The Verdict (What to drop, what kills theories).

  11. **Refining the "Genuine vs. Partisan" distinction:**
      *   Genuine: Phenomenological facts (I learned something).
      *   Partisan: Theoretical constructs (There exists an abstract 'Sense').

  12. **Final Polish:** Ensure clear headings and direct answers to the specific prompts at the end. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to simply say "Frege solved this." The user wants the *specification* that *leads* to the theory. I must present the constraints as neutral demands first, then analyze the tension.

  *(Key Insight)*: The user's "Archivist" case is crucial. It shows that informativeness is not a property of the *sentence* alone, but of the sentence *relative to a mind*. This challenges the idea that meaning is solely in the public language.

  *(Decision)*: I will structure this as a "Technical Specification Document" for a theory of reference, honoring the user's request for a "specification first."

  *(Final check on the "Surrender" question)*: The user asks: "If that pair really cannot be reconciled, say which one should be surrendered." The pair is "Meaning is shared" vs "Identity is informative."
  *   Option A: Surrender "Meaning is shared." (Leads to idiolects/psychologism).
  *   Option B: Surrender "Identity is informative." (Leads to Millianism/Salmon - says it *is* trivial, we just think it's not).
  *   Option C: Distinguish "Semantic Content" from "Cognitive Value." (This is the standard move).
  *   *My advice:* Don't surrender the data (informativeness). Refine the definition of "Meaning." But if forced to choose a *requirement* to drop, drop the requirement that "Semantic Meaning must explain Cognitive Informativeness."

  *(Key Constraint Killer)*: The "Ignorance/Error" constraint (using a name on say-so) is the one that destroys Descriptivism. I will highlight this.

