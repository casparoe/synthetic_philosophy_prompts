answer: |-
  This is a classic problem. You have essentially reconstructed the central debate of distributive justice from 1980–2000 (Dworkin, Sen, Cohen, Arneson) in your own head. Your confusion isn't a bug; it's the feature of the literature.

  Your gut reactions 1–4 point toward a specific hybrid theory. Reaction 5 is the "Internal Conversion Factor" problem that haunts that theory. Reaction 6 is the "Positional Goods" objection.

  Here is the precise principle that captures 1–4, how to handle 5 without collapsing into welfare, and what to do with 6.

  ### The Principle: Responsibility-Sensitive Effective Capability

  Your verdicts are best captured by a **Luck-Egalitarian Capability Approach**.

  **The Principle:** *Justice requires equalizing the **effective capability set** (the real freedom to achieve valuable functionings), holding individuals responsible for their **choices** made from within that set, but compensating for deficits in **capacity** (internal or external) that limit the ability to choose or convert resources.*

  Here is how it maps to your first four verdicts:

  *   **Verdict 1 (Expensive Tastes):** **Fit.** The sailor has the *capability* to be happy (he has the income/health), but he chooses to spend his capability on a high-cost preference. Justice equalizes the *power to choose*, not the satisfaction of specific preferences.
  *   **Verdict 2 (Disability):** **Fit.** Income is a resource, but the wheelchair user has a lower *conversion factor*. To have the same *effective capability* (mobility/employment), they need more resources.
  *   **Verdict 3 (Adaptive Preferences):** **Fit.** The contented poor person has a distorted *capability set* (they don't perceive options that are theoretically there, or their psychology was shaped by deprivation). Their reported welfare is irrelevant; their effective freedom was curtailed.
  *   **Verdict 4 (Choice vs. Outcome):** **Fit.** If the capability set is identical and the difference is purely agential choice, justice is satisfied. We equalize the starting line, not the finish line.

  ### The Hard Case: Verdict 5 vs. Verdict 4

  This is the crux of your anxiety.
  *   **Verdict 4** says: If options are equal, outcomes don't matter.
  *   **Verdict 5** says: If the person can't *use* the option due to psychological weariness, options aren't really equal.

  **Do you have to give up Verdict 4?**
  No, but you must refine your definition of "Option."

  In your statement of Case 4, you said: *"Two people with the exact same real options open to them."*
  In Case 5, you said: *"Formally the capability is there... My gut says no, it isn't really."*

  **The Resolution:** You must distinguish between **Formal Capability** (the door is unlocked) and **Effective Capability** (the person has the psychological/physical capacity to walk through it).

  *   **Case 4** describes two agents with equal *Effective Capability*. One chooses not to use it. No compensation.
  *   **Case 5** describes an agent with equal *Formal Capability* but reduced *Effective Capability* due to an internal constraint (depression/trauma).

  **The Principled Line:**
  The line is **Voluntariness vs. Incapacity**.
  *   **Expensive Tastes (Case 1):** I *can* be happy with cheap hobbies, I just *prefer* not to be. (Compensation denied).
  *   **Depression/Weariness (Case 5):** I *cannot* mobilize myself to take the option, even if I want to. The psychological machinery required to convert the resource into a functioning is broken. (Compensation owed).

  **The Risk:** You are worried this slides back into Welfare. It only does if you define "capacity" as "ability to feel happy." You must define it as "ability to exercise agency."
  *   **Verdict to Adjust:** You need to tweak Verdict 4 slightly. It's not that "outcomes don't matter." It's that "outcomes resulting from **unimpaired agency** don't matter." If the misery in Case 4 stems from a hidden psychological impairment (like Case 5), then it *is* a justice issue. If it stems from a voluntary preference (like Case 1), it is not.

  **Recommendation:** Keep Verdict 5. It is morally robust. Modify Verdict 4 to specify that the options must be *effectively* accessible, not just formally available. This aligns with Amartya Sen's distinction regarding "internal conversion factors" (like metabolism or psychology).

  ### The Scope Case: Verdict 6 (Positional Goods)

  *   **The Problem:** You can't equalize "being the best singer" or "social status." If everyone has it, no one has it.
  *   **The Principle's Answer:** These goods are **out of scope** for distributive justice.
  *   **Why:** Egalitarianism is about ensuring everyone has enough *power* to live a dignified life, not about ensuring everyone wins the status game.
  *   **The Fix:** Most capability theorists (like Sen and Nussbaum) focus on a list of **Central Capabilities** (health, bodily integrity, practical reason, affiliation). "Being the best" is not on the list. "Having the social basis of self-respect" *is* on the list.
  *   **Verdict:** You don't need to change your principle. You just need to bound it. Equality of What applies to *basic functionings required for agency*, not competitive goods. If your theory tries to equalize status, it will fail. If it equalizes the *capacity to participate in society without humiliation*, it succeeds.

  ### The "Badly Off on Every Currency" Case

  You asked: *Someone who is badly off on every currency at once: does the theory just say more of the relevant thing, or does that need a separate story?*

  **The Answer:** It says "more of the relevant thing," but with **Priority**.

  A Responsibility-Sensitive Capability view usually incorporates a **Prioritarian** twist.
  1.  **Threshold:** First, bring the person up to a threshold of **Effective Capability** (Case 2 & 5 logic). Give them the wheelchair, the therapy, the income.
  2.  **Currency:** You don't just give cash (Resource) because they might not be able to convert it (Case 2). You don't just aim for happiness (Welfare) because their preferences might be adaptive (Case 3). You target the **functioning** directly (e.g., provide the medical care, not just the money for it).
  3.  **Responsibility:** Once they are above the threshold of effective agency, *then* responsibility kicks in. If they are deeply disadvantaged, the "responsibility" clause is suspended until they have the actual capacity to be responsible.

  So, the theory handles this by saying: **Capability is the currency, but Priority is the rule.** You must restore the capacity for agency before you hold them responsible for their choices.

  ### Summary: What to Keep and What to Drop

  To have a clean, defensible position for your course:

  1.  **Keep:** The rejection of Welfare (Cases 1 & 3).
  2.  **Keep:** The rejection of strict Resources (Case 2).
  3.  **Keep:** The intuition on Case 5 (Internal constraints limit capability).
  4.  **Modify:** Verdict 4. Do not say "options open to them." Say "effective power to use those options." If the misery in Case 4 is caused by a lack of psychological capacity, it becomes a Case 5. If it is caused by preference, it stays Case 4.
  5.  **Exclude:** Verdict 6. Declare positional goods outside the scope of distributive justice. Focus on "sufficient status for dignity" rather than "equal status."

  **Your Unified Theory Statement:**
  > "Justice requires equalizing the **effective capability** to achieve valuable functionings. This requires compensating for both external resource deficits and internal conversion deficits (physical or psychological), but does not require compensating for voluntary preferences or choices made by agents with intact effective capability. Positional goods are excluded from the metric of equality."

  If you write that down, you have basically synthesized Dworkin's Resource Egalitarianism with Sen's Capability Approach, while using Cohen's distinction on expensive tastes to handle the responsibility angle. It's a very strong position. You aren't inconsistent; you just identified the exact friction points the philosophers spend careers arguing about.
