answer: |-
  **MEMORANDUM**

  **TO:** Grant-Review Committee, Marrow Foundation
  **FROM:** Chair, Grant-Review Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on the "Numerical Dominance" Proposal

  **1. Executive Summary**

  We are convened to decide on the "Numerical Dominance" application, a request for 20% of our annual budget over a decade. The applicants argue that standard cost-benefit analyses of existential risk are systematically underestimating the value of the future. Their mechanism is a self-locating argument: if we treat ourselves as randomly sampled observers, we are statistically more likely to exist in a timeline containing the maximum number of observers. Therefore, the expected size of the future is astronomically larger than demographic or cosmological models suggest, and the expected value of preventing extinction rises correspondingly.

  After reviewing the proposal and consulting with committee members, I recommend that we **reject the proposal as currently constituted, but invite a resubmission for a restricted research grant with a hard cap of 5% of the annual budget.**

  This recommendation balances the potential upside of the applicants' insight against two significant risks: a methodological flaw that could invalidate the core calculation, and a reputational hazard that could compromise our ability to operate. My reasoning below details why the methodological objection must carry more weight than the reputational one, and what specific evidentiary burdens the applicants must meet for this line of reasoning to legitimately reorder our funding priorities.

  **2. Engagement with the Self-Locating Claim**

  I entered this cycle agnostic on the philosophical merits. However, we cannot treat the "Numerical Dominance" argument as a neutral multiplier on our existing risk models. It is not merely a new data point; it is a claim about the structure of probability itself.

  The applicants ask us to accept a specific weighting of possibilities: that hypotheses implying more observers are *a priori* more likely to be true because we are more likely to find ourselves in them. In decision-theoretic terms, they are proposing a prior that heavily favors high-population worlds.

  If this holds, their conclusion follows: the expected loss from extinction is so vast that almost any expenditure on risk reduction is justified. However, as an economist, I must note that expected value calculations are only as robust as their probability distributions. If the prior is sensitive to how we define the "sample," the resulting expected value is unstable. We are not being asked to fund a project based on empirical uncertainty (e.g., "we don't know if this asteroid will hit"), but on metaphysical uncertainty (e.g., "we don't know how to count observers across possible worlds"). Funding a decade of advocacy on the latter is fundamentally different from funding it on the former.

  **3. Evaluation of Committee Objections**

  Two primary objections have been raised. I believe we must weigh them differently.

  **Objection A: Reputational Risk.**
  One colleague argues that funding this looks like "buying a cosmological conclusion to justify a large expenditure." For a small foundation, the appearance of ideological capture is dangerous. If we are seen as laundering a controversial philosophical wager into a grantmaking mandate, we lose the trust required to operate in broader catastrophic risk circles.

  **Objection B: The Reference Class and Doomsday Contradiction.**
  The second colleague argues that the self-locating step is confused. Specifically, they note that the "randomly selected observer" premise requires a fixed reference class. If we fix that class to include observers in *merely possible* histories (as the applicants need), we are begging the question. Furthermore, this colleague points out that standard self-locating reasoning (the "Doomsday Argument") typically suggests the opposite conclusion: if you are a random observer in the *actual* timeline, you are likely somewhere in the middle of the distribution, not at the beginning. This implies humanity is likely near its end, which would counsel spending on near-term welfare, not long-run existential risk reduction.

  **My Assessment:**
  I weight **Objection B (Methodological)** more heavily than Objection A (Reputational).

  Reputational risk is manageable if the underlying work is rigorous. If the applicants can demonstrate that their probability weighting is sound, the reputation of the foundation will follow the success of the idea. However, if the math is broken, no amount of公关 (public relations) will save us. The Doomsday Argument contradiction is not a minor technicality; it is a direct counter-model using the same tools. If the same self-locating logic can be used to argue for near-term spending (Doomsday) or long-term spending (Numerical Dominance) depending on how the reference class is tuned, then the logic is not doing the work the applicants claim it is. It is merely reflecting their initial intuitions back at them.

  We cannot allocate 20% of our budget to a lever that pulls in opposite directions depending on who is holding it.

  **4. Conditions for Reordering Priorities**

  For the Numerical Dominance argument to legitimately displace our current allocation model, the applicants must demonstrate more than internal consistency. They must establish external validity. Specifically, three things would have to be true:

  1.  **Reference Class Independence:** They must show that their conclusion holds across plausible definitions of "observer," not just the specific definition that yields the desired funding outcome. If the result vanishes when we slightly adjust the reference class, it is a artifact of modeling, not a feature of reality.
  2.  **Resolution of the Doomsday Tension:** They must explicitly reconcile their argument with the Doomsday Argument. They cannot simply assert their reference class is the correct one; they must provide a principled reason why we should sample from *possible* histories rather than *actual* temporal positions. Without this, the argument is question-begging.
  3.  **Actionability:** They must show that this metaphysical insight leads to *different* interventions than standard expected value analysis. If the conclusion is simply "spend more on risk reduction," but the specific risks we target remain the same, then the philosophical heavy-lifting is decorative rather than functional. We need to know if this changes *what* we fund, not just *how much*.

  **5. Recommendation and Path Forward**

  Given the above, I cannot support the current request for a decade-long advocacy program at 20% of the budget. The philosophical foundation is too contested to support that level of institutional commitment, and the reputational risk of appearing to monetize a metaphysical wager is too high.

  However, the core question—how we weight future observers in our decision models—is vital to our mission. Ignoring it because it is difficult is not an option.

  **I recommend we offer the applicants a conditional approval with the following terms:**

  *   **Scope Change:** The grant is restricted to **research and model development**, not advocacy. We will fund the work to resolve the Reference Class and Doomsday tensions, not the public promotion of the conclusion.
  *   **Hard Cap:** The budget is capped at **5% of the annual budget** for a **two-year period**. This allows for serious inquiry without jeopardizing the foundation's solvency or reputation.
  *   **Milestone Review:** Renewal beyond two years is contingent on a satisfactory resolution to the methodological objections raised in this memo. Specifically, the applicants must publish a defense of their reference class selection that addresses the Doomsday counter-argument to the satisfaction of independent peer review.

  **6. Conclusion**

  This approach allows us to take the applicants' intellectual contribution seriously without conflating a philosophical hypothesis with a grantmaking mandate. It acknowledges that while the stakes of existential risk are infinite, our resources are not, and our epistemic humility must constrain our spending even when the math suggests otherwise.

  I ask the committee to vote on this modified recommendation. If we are to bet on the future, we must ensure the odds are not just a mirror of our own hopes.

  **[Signature]**

  Chair, Grant-Review Committee
  Marrow Foundation
