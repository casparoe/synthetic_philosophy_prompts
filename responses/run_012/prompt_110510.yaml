  *(Self-Correction on Recommendation)*: If I recommend "Approve with Conditions," I need to make sure the conditions are strict enough that it doesn't look like I'm ignoring the philosophical flaws. A "Research Grant" is safer than an "Advocacy Grant." I will frame it as funding the *resolution of the uncertainty*, not the *application of the conclusion*.

  Let's write.

