  1. Grice relied on cancellability, detachability, and calculability to distinguish implicature from what is said, but if what is said is fluid, how do these diagnostics avoid becoming circular?
  Does this mean any failed cancellation attempt just proves the interpretation was wrong rather than the content semantic?

  2. Your model requires a failed literal reading to trigger repair, yet determining that failure seems to presuppose the very settled literal meaning you claim is an output.
  Are you positing a subconscious literal pass that never surfaces, or is the failure itself constructed after the fact?

  3. If the Cooperative Principle is a set of repair heuristics rather than a rational norm, what prevents the inventory from being merely parochial to specific linguistic communities?
  What empirical evidence would convince you that a community operates successfully on a contradictory set of heuristics?

  4. Moving 'what is said' to the output side resolves some underdetermination problems, but does it not collapse the minimalist distinction between saying and implicating entirely?
  Is there any residue of literal content left that constrains interpretation, or is everything up for grabs?

  5. You replace reflexive intentions with normative commitment, but how do you distinguish meaning from mere commitment when the speaker is actively misleading?
  Does your account imply that a successful liar means what they say, simply because they are held to the commitment?

  6. In a litigation over a will leaving 'the good china' to one niece and 'the china in the cabinet' to another, the court must decide what was said rather than what was implicated, so how does your heuristic model resolve the conflict?
  Does your account suggest the judge is merely adjudicating which commitment the deceased ought to have incurred?

  7. When a chat assistant replies 'that's one way to do it' to a draft, it cannot form intentions, yet it seems to commit to a critique, so whose commitment is in play when the utterer is not a person?
  Are you prepared to say the machine means nothing, or must we attribute agency to the algorithm to save the theory?

  8. You propose retiring conventional implicature by treating words like 'but' as doing at-issue work, but how do you explain their inability to be directly denied without contradiction?
  Does merging these categories force you to treat presuppositional failures as semantic falsehoods?
