  1.  **Analyze the Request:**
      *   **User:** A novelist, 2/3 through 2nd draft. Setting: coastal town (faith, work, speech not the author's).
      *   **Problem:** Reading Rorty (antirepresentationalism, solidarity is made not found, final vocabulary is contingent). Finds it bracing but useless for practical revision. Needs a *procedure* to apply Rorty's ideas to prose revision.
      *   **Goal:** Distinguish between claims of "getting something right" (representation/correspondence) and "offering a redescription" (utility/solidarity). Decide what to settle alone, what to ask a sensitivity reader, and what is purely value-based.
      *   **Constraints:**
          *   British English.
          *   No preamble.
          *   Begin with the procedure itself (ordered questions) in the first sentence or two.
          *   Include reasoning behind the procedure.
          *   Run the procedure on three specific passages (Invented Ritual, Monstrous Mind, Comic Dialect).
          *   Include caveats (where it misfires, where judgments are dressed as procedure).
          *   Time/Context: 20 mins per passage, no philosophical training beyond pleasure reading.
          *   Tone: Plain, honest, no smoothing of joins.

  2.  **Deconstruct Rorty for Fiction Writing:**
      *   *Antirepresentationalism:* Language doesn't mirror reality; it's a tool. Truth is what works for us, not correspondence to facts.
      *   *Solidarity is made, not found:* We build community through shared descriptions, not by discovering pre-existing common humanity.
      *   *Final Vocabulary:* Words we use to justify ourselves that we can't justify further. Contingent.
      *   *Application:* When writing about "others," am I claiming my words *match* their reality (representation = risk of error/arrogance) or am I offering a tool to build solidarity/understanding (redescription = risk of utility failure)?
      *   *The Procedure:* Needs to be a checklist of questions to diagnose the *intent* and *effect* of the prose.

  3.  **Drafting the Procedure (The "Ordered Questions"):**
      *   Need to distinguish between "Fact/Practice" (where sensitivity reader matters) and "Value/Interpretation" (where author decides).
      *   Q1: What is the claim? (Correspondence vs. Utility)
      *   Q2: Whose vocabulary is this? (Author's vs. Character's/Community's)
      *   Q3: What is the cost of error? (Offence vs. Confusion)
      *   Q4: Who decides? (Author, Reader, Shared)
      *   Need to specify "Sufficient Answer" vs. "Evasive Answer" vs. "Stop/Handover".

  4.  **Drafting the Reasoning:**
      *   Explain why this translates Rorty. Shift from "Is this true?" to "What does this do?"
      *   Explain the solidarity aspect: Are we inviting the reader into a conversation or dictating terms?

  5.  **Running the Procedure on the Three Passages:**
      *   *Passage 1: Invented Ritual.* Reader says wrong. Author says defensible/researched.
          *   Analysis: Is it claiming correspondence (this is how they pray) or utility (this serves the narrative truth)? If correspondence, reader wins. If utility, author decides but risks solidarity.
      *   *Passage 2: Monstrous Mind.* Third-person access. Fear of essentialism.
          *   Analysis: Is this claiming "this is how monsters are" (representation) or "here is a way to look at cruelty" (redescription)? If the former, dangerous. If the latter, needs framing.
      *   *Passage 3: Comic Dialect.* Humour depends on dialect. Joke at expense?
          *   Analysis: Is the dialect a tool for caricature (breaking solidarity) or characterization (building solidarity)? Who laughs?

  6.  **Drafting the Caveats:**
      *   Acknowledge where the procedure is itself a "final vocabulary."
      *   Acknowledge that Rorty doesn't solve ethical dilemmas, just reframes them.
      *   Acknowledge the limits of a 20-minute check.

  7.  **Refining Tone and Language:**
      *   British English (e.g., "colour," "centre," "whilst," "programme" - though careful not to overdo it).
      *   Direct, professional, slightly academic but practical.
      *   No preamble. Start immediately with the procedure.

