answer: |-
  1. Is this passage claiming to correspond to a reality outside the text, or is it offering a tool for the reader to use? 2. Whose final vocabulary is at work here: the characters', the community's, or the author's? 3. Does this description expand the circle of 'us' or does it mark a boundary between 'us' and 'them'? 4. Who holds the veto: the author, the sensitivity reader, or the imagined community?

  **The Procedure**

  **Question 1: Correspondence or Utility?**
  *   **Sufficient answer:** 'This claims to show how things are' (Correspondence) or 'This claims to offer a way of seeing things' (Utility).
  *   **Evasive answer:** 'It's just a story' or 'It's based on research'.
  *   **Handover:** If Correspondence, you must hand the decision to the sensitivity reader on matters of fact-like practice. If Utility, you retain the decision but must justify the tool's use.
  *   **Stop:** If you claim Correspondence but refuse external verification, stop writing.

  **Question 2: Whose Vocabulary?**
  *   **Sufficient answer:** Identification of the specific source of the terms (e.g., 'This is my vocabulary imposed on them' or 'This is their vocabulary borrowed').
  *   **Evasive answer:** 'It's the narrator's voice' without defining the narrator's relation to the community.
  *   **Handover:** If the vocabulary belongs to the community (faith, work, speech), hand the decision to a member of that community. If it is explicitly the author's contingent vocabulary, you decide.
  *   **Stop:** If you claim the vocabulary is theirs but it is actually yours, stop writing.

  **Question 3: Solidarity Effect?**
  *   **Sufficient answer:** 'This invites the reader to feel kinship with the subject' or 'This distinguishes the subject as other'.
  *   **Evasive answer:** 'It's just funny' or 'It's just tragic'.
  *   **Handover:** If the effect marks a boundary ('them'), you must hand the decision to the sensitivity reader to assess harm. If it expands 'us', you may decide alone.
  *   **Stop:** If the humour or tragedy relies on the exclusion of the subject from the human community, stop writing.

  **Question 4: Who Holds the Veto?**
  *   **Sufficient answer:** Named individual or group with explicit authority over this specific claim.
  *   **Evasive answer:** 'My editor will catch it' or 'Readers will understand'.
  *   **Handover:** If the claim is factual (Q1) or uses community vocabulary (Q2), the sensitivity reader holds the veto. If the claim is ethical/aesthetic (Q3), the author holds the veto but accepts the consequence.
  *   **Stop:** If you cannot name the veto-holder, you are writing in bad faith.

  **The Reasoning**

  This procedure translates Rorty's antirepresentationalism from a metaphysical stance into a editorial checklist. Rorty argues that language does not mirror nature; therefore, when you write that a ritual *is* a certain way, you are not reporting a fact but making a move in a language game. If you pretend that move is a mirror (Correspondence), you invite correction by reality. If you admit it is a tool (Utility), you invite correction by usefulness. The question of 'whose vocabulary' addresses Rorty's claim that final vocabularies are contingent; using another community's final vocabulary without their consent is an act of power, not discovery. The solidarity question operationalises Rorty's claim that solidarity is made, not found; your prose either weaves the subject into the reader's circle of 'us' or it casts them out. Finally, the veto question acknowledges that while truth is made, the consequences of making it are distributed unevenly; those who bear the cost of your redescription must hold the power to reject it. This shifts your burden from 'getting it right' (impossible) to 'negotiating utility' (manageable).

  **Worked Passages**

  **1. The Invented Ritual**
  *   **Q1 (Correspondence/Utility):** You claim Correspondence ('this is how they pray'), despite the invention. The sensitivity reader claims error.
      *   *Answer:* You are claiming Correspondence based on research, but the community denies it.
      *   *Handover:* Because you claim Correspondence regarding a real-world practice, you must hand the decision to the sensitivity reader. You cannot claim 'defensible invention' while presenting it as liturgical fact.
  *   **Q2 (Vocabulary):** The vocabulary is theological and ritualistic, belonging to the community.
      *   *Answer:* It is their vocabulary, not yours.
      *   *Handover:* Hand to sensitivity reader.
  *   **Q3 (Solidarity):** The reader from the town feels excluded/lied to.
      *   *Answer:* Marks a boundary ('author knows better than local').
      *   *Handover:* Hand to sensitivity reader.
  *   **Q4 (Veto):**
      *   *Decision:* The sensitivity reader holds the veto. To keep the scene, you must shift the claim from Correspondence to Utility: signal clearly within the text that this is a specific character's deviation or a fictionalised element, thereby accepting the burden of the invention rather than imposing it as fact.

  **2. The Monstrous Mind**
  *   **Q1 (Correspondence/Utility):** You intend Utility (a redescription of cruelty), but fear readers will take it as Correspondence (psychological fact).
      *   *Answer:* Ambiguous. The text risks being read as Correspondence.
      *   *Handover:* If you cannot clarify the utility, you must hand to a reader to test reception.
  *   **Q2 (Vocabulary):** This is the author's psychological vocabulary imposed on the character.
      *   *Answer:* Author's vocabulary.
      *   *Decision:* You retain the decision, but bear the risk of essentialism.
  *   **Q3 (Solidarity):** Does explaining the monster make him part of 'us' (understandable) or 'them' (alien psychology)?
      *   *Answer:* Risk of marking boundary if the explanation feels like excusing or exoticising.
      *   *Handover:* If the redescription reduces the victim's suffering, hand to sensitivity reader.
  *   **Q4 (Veto):**
      *   *Decision:* You hold the veto, but you must revise to ensure the text signals contingency. Use framing that suggests 'this is one way to see him' rather than 'this is why he did it'. If the prose insists on *the* truth of his mind, you are violating the antirepresentationalist ethic; you must soften the claim to maintain honesty.

  **3. The Comic Dialect**
  *   **Q1 (Correspondence/Utility):** The humour is a tool (Utility), but it relies on phonetic spelling that claims to represent speech (Correspondence).
      *   *Answer:* Claims Correspondence to speech patterns for Utility of humour.
      *   *Handover:* Hand to sensitivity reader on the accuracy of the representation.
  *   **Q2 (Vocabulary):** The dialect is the community's vocabulary.
      *   *Answer:* Theirs, not yours.
      *   *Handover:* Hand to sensitivity reader.
  *   **Q3 (Solidarity):** You cannot tell if the joke is at his expense.
      *   *Answer:* Unknown. High risk of marking boundary ('us' laughing at 'them').
      *   *Handover:* Must hand to sensitivity reader. If the reader from the town laughs, solidarity is made. If they wince, solidarity is broken.
  *   **Q4 (Veto):**
      *   *Decision:* The sensitivity reader holds the veto. You cannot decide this alone because you lack the position to judge the harm. If the reader says it is caricature, you must cut it, regardless of your intent. Rorty's solidarity is made *with* them, not *for* them.

  **Caveats**

  This procedure misfires where harm is invisible even to the sensitivity reader, or where the reader is an outlier within their own community. It cannot calculate the cumulative effect of many small descriptions; it works only on discrete passages. Furthermore, the procedure itself is a final vocabulary; it is not a neutral algorithm but a contingent tool I have offered you, which you are free to discard if it ceases to be useful. The step asking you to distinguish between 'fact' and 'value' (Q1) is itself a judgment dressed as procedure; in fiction, these are often inseparable, and forcing a separation may damage the prose. Finally, this checklist cannot absolve you of the risk of writing; it only clarifies where the liability lies. You may follow every step and still cause offence, because solidarity is made in the reading, not the writing, and you cannot control the reader's reception any more than you can control the weather.
