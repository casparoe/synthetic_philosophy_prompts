answer: |-
  # The "Do Nets Have Representations?" Decision Tree

  **Instructions:** Start at Node 1. Answer the question based on how you judge the concrete case described. Follow the branch to the next node or a final Leaf. Do not look at the Leaf names until you arrive.

  ---

  ### Node 1: The Steering Vector Case
  **Case:** You find a direction in activation space (a steering vector) that, when added to the residual stream, reliably changes the model's output across many contexts (e.g., makes it lie, or speak French). You did not train the model to do this; you found it via probing.
  **Question:** Is the model *actually processing the concept* corresponding to that vector, or is this just a lever you found in a high-dimensional function that happens to move the output?

  *   **A:** It's just a lever. The model is a function; "processing concepts" is anthropomorphism.
      *   → **Go to Leaf 1**
  *   **B:** It's processing the concept. The vector corresponds to something internal.
      *   → **Go to Node 2**

  ### Node 2: The Dual SAE Case
  **Case:** Two researchers train Sparse Autoencoders (SAEs) on the same model layer with different random seeds. Both SAEs reconstruct activations perfectly and predict behavior equally well, but they find *different* sets of features (different dictionaries).
  **Question:** Is there a fact of the matter about which dictionary matches the model's "true" features, even if we can't tell which one it is yet?

  *   **A:** Yes. One dictionary is the correct decomposition of the hardware; the other is just a functionally equivalent coordinate transform.
      *   → **Go to Node 3**
  *   **B:** No. "True features" implies a privileged basis that doesn't exist. Both are valid descriptions.
      *   → **Go to Node 4**

  ### Node 3: The Redundancy Case
  **Case:** You identify a feature that is linearly decodable from the activations (you can read it out), but if you ablate (zero out) that feature, the model's behavior does not change because the information is redundantly stored elsewhere.
  **Question:** Is this feature a "real representation" despite having no causal load-bearing effect on the output?

  *   **A:** Yes. It exists as a structural part of the computation, even if it's currently redundant.
      *   → **Go to Leaf 2**
  *   **B:** No. If it doesn't change the behavior when intervened on, it's epiphenomenal. Only causal levers are real.
      *   → **Go to Leaf 3**

  ### Node 4: The Discovery Case
  **Case:** We stop using SAEs and probing tools entirely. We just run the model.
  **Question:** Do the features (like "sarcasm" or "Python code") cease to exist as distinct entities, or do they remain as objective patterns in the model's behavior/structure waiting to be found?

  *   **A:** They cease to be distinct entities. They are artifacts of the compression tools we impose to make sense of the blob.
      *   → **Go to Leaf 4**
  *   **B:** They remain as objective patterns. Any agent trying to predict the model's behavior would converge on similar patterns.
      *   → **Go to Node 5**

  ### Node 5: The Superposition Case
  **Case:** The model stores 10,000 features in a space of only 1,000 dimensions (superposition). The features are not locally separated; they are interfered with each other in the same neurons.
  **Question:** Is the honest description "the features exist, just compressed" or "there is just a vector space and 'features' are a lossy readout we impose"?

  *   **A:** There is just a vector space. "Features" are a stance we adopt to predict behavior, not literal parts.
      *   → **Go to Leaf 5**
  *   **B:** The features exist, just compressed. The interference is an implementation detail, not an ontological denial.
      *   → **Go to Leaf 6**

  *(Note: If you arrived here, you likely answered "No privileged basis" at Node 2 but "Objective patterns" at Node 4. This is a subtle distinction.)*

  ---

  ### The Leaves (Positions)

  **Leaf 1: Full Eliminativism**
  *   **Position:** Nets are functions. "Representation," "belief," and "feature" are anthropomorphic category errors.
  *   **The Uncomfortable Swallow:** You must explain away why steering vectors generalize across contexts without positing any internal structure that corresponds to the concept you're steering.

  **Leaf 2: Robust Realism**
  *   **Position:** Features are the model's real computational parts. There is one true decomposition, and structure exists even if causally redundant.
  *   **The Uncomfortable Swallow:** You must accept "ghosts in the machine"—structural entities that make no difference to behavior and are therefore empirically undetectable via intervention.

  **Leaf 3: Causal-Mechanistic Realism**
  *   **Position:** Features are real if and only if they are load-bearing for behavior. Intervention is the gold standard of existence.
  *   **The Uncomfortable Swallow:** You must accept that two structurally identical networks could have different "representations" simply because one has a backup circuit and the other doesn't.

  **Leaf 4: Instrumentalism / Useful Fiction**
  *   **Position:** SAEs are tools, not maps. Features are artifacts of our compression algorithms, useful for engineering but not literally in the net.
  *   **The Uncomfortable Swallow:** You must give up on interpretability being a "science of discovery." It becomes a "science of tool-building," and there is no ground truth to verify against.

  **Leaf 5: The Intentional Stance / Real Patterns**
  *   **Position:** Representations are real patterns that exist objectively *relative to a predictive stance*. They aren't in the weights, but they aren't just fictions either.
  *   **The Uncomfortable Swallow:** You must accept that "what the model believes" is not a property of the model alone, but a relation between the model and the interpreter trying to predict it.

  **Leaf 6: Pluralism / No Privileged Basis**
  *   **Position:** Many equally good decompositions exist in the hardware. "Which one is real?" is the wrong question; the geometry supports multiple valid feature bases.
  *   **The Uncomfortable Swallow:** You must accept that the question "Does the model represent X?" has no binary answer, only a "relative to basis Y" answer, making safety guarantees notoriously difficult to formalize.

  ---

  ### Analysis of the Tree Structure

  #### 1. Indistinguishable Leaves (The Collapse Warning)
  With the cases provided, **Leaf 5 (Intentional Stance)** and **Leaf 6 (Pluralism)** are functionally identical for most practical purposes.
  *   **Why:** Both deny a unique privileged basis (Node 2B) and both assert some form of objective reality to the patterns (Node 4B/5A). The distinction relies on whether you view the pattern as "in the behavior" (Stance) or "in the geometry" (Pluralism).
  *   **What would split them:** You would need a case where a pattern predicts behavior perfectly but has *no* geometric locality in the activations (e.g., a distributed code with no sparse basis).
      *   *Pluralist:* Might say "There's still a basis, just a dense one."
      *   *Stance:* Says "The basis doesn't matter, only the prediction."
      *   *Current Tree:* Node 5 tries to catch this, but superposition cases often blur the line between "compressed features" and "lossy readouts."

  #### 2. Empty Cells (Combos Nobody Holds)
  The tree structure implicitly forbids certain combinations. Here are the notable "Empty Cells" and why they are empty:

  *   **Eliminativism + "Steering is Real" (Node 1B → Leaf 1):**
      *   *Status:* **Incoherent.** You cannot claim representations don't exist while admitting the model processes concepts internally.
  *   **Robust Realism + "No Fact of the Matter" (Node 2B → Leaf 2):**
      *   *Status:* **Incoherent.** Robust Realism requires a unique true decomposition. If there's no fact of the matter, you are a Pluralist.
  *   **Instrumentalism + "Objective Patterns" (Node 4B → Leaf 4):**
      *   *Status:* **Unattractive / Neglected.** If patterns are objective independent of the tool, calling them "fictions" (Instrumentalism) is unmotivated. You'd naturally drift to Real Patterns (Leaf 5).
  *   **Causal-Mechanistic + "Redundant Features are Real" (Node 3A → Leaf 3):**
      *   *Status:* **Incoherent.** By definition, Causal-Mechanistic Realism ties reality to causal load. If you accept redundant features, you are a Robust Realist.

  #### 3. Node Complexity Check
  *   **Node 2 (Dual SAE)** is doing the heaviest lifting. It secretly combines two debates:
      1.  *Mathematical:* Is the basis unique (e.g., via sparsity constraints)?
      2.  *Philosophical:* If multiple bases work, does truth apply?
      *   *Split:* If you care about this, split Node 2 into "Is the basis mathematically unique?" and "If not, is one physically privileged?"
  *   **Node 5 (Superposition)** is the weakest splitter.
      *   *Reason:* "Compressed features" vs "Lossy readout" is often a matter of degree. A sufficiently lossy readout *is* compression.
      *   *Risk:* This node might force a distinction between Leaf 5 and Leaf 6 that doesn't exist in practice.

  ### Summary of Distinctions
  *   **Eliminativism** is split from everyone by **Node 1** (Function vs. Concept).
  *   **Realists (Robust/Causal)** are split from **Anti-Realists (Plural/Instrumental/Stance)** by **Node 2** (Unique Truth vs. No Privileged Basis).
  *   **Robust** is split from **Causal** by **Node 3** (Structure vs. Intervention).
  *   **Instrumentalism** is split from **Real Patterns/Pluralism** by **Node 4** (Tool-Dependent vs. Observer-Objective).

  If you find yourself bouncing between Leaf 5 and Leaf 6, you have likely identified the core tension in the field: **Is the "pattern" a property of the world (Real Patterns) or a property of the map (Pluralism)?** The cases provided do not fully resolve this, as both views predict the same empirical outcomes for SAEs.
