answer: |-
  Here is a menu of the distinct theses often conflated under the slogan "information is physical," graded from trivial to contentious, followed by an analysis of the specific inference you cited and answers to your side questions.

  ### The Menu of Theses

  **1. The Substrate Thesis**
  *Content:* Information cannot exist in the abstract; it must always be instantiated in the state of some physical system (magnetic domains, voltage levels, neural firing patterns).
  *Verdict:* **Platitude.** (There is no known counterexample; even a thought requires a brain.)

  **2. The Computational Physicalism Thesis**
  *Content:* There is no principled gap between a computation and a physical process; every logical operation corresponds to a physical transformation of the substrate.
  *Verdict:* **Platitude.** (This is merely the definition of physical computation, though it denies strong AI dualism.)

  **3. Landauer's Principle**
  *Content:* Logically irreversible operations (specifically the erasure of information) necessarily dissipate a minimum amount of heat ($kT \ln 2$ per bit) into the environment.
  *Verdict:* **Live Claim.** (Widely accepted and experimentally verified, though debates persist regarding the precise definition of "erasure" in non-equilibrium systems.)

  **4. The Entropy Identity Thesis**
  *Content:* Shannon entropy (information theoretic) and Boltzmann/Gibbs entropy (thermodynamic) are not merely analogous but are the exact same quantity viewed from different angles.
  *Verdict:* **Error.** (They map onto each other only under specific equilibrium conditions and specific coarse-grainings; treating them as universally interchangeable leads to paradoxes regarding subjective knowledge.)

  **5. The Ontological Priority Thesis ("It from Bit")**
  *Content:* Physics is at bottom about information rather than matter; physical fields and particles are derivative of informational relations.
  *Verdict:* **Contentious Metaphysics.** (A productive heuristic in quantum gravity and black hole thermodynamics, but not settled physics.)

  ***

  ### Licensing the Inference

  In the argument you described (predictor device $\to$ Maxwell's demon $\to$ $kT \ln 2$ cost), the inference is licensed exclusively by **Thesis 3 (Landauer's Principle)**.

  *   **Thesis 1 & 2** establish that the predictor must be a physical object, but they do not dictate *energy costs*. A reversible physical computer could, in principle, predict without dissipating heat.
  *   **Thesis 4** is too vague to yield a specific energy bound.
  *   **Thesis 3** provides the specific mechanism: if the predictor is to operate cyclically (as a device), it must reset its memory state. That reset is logically irreversible, which Landauer's Principle ties to thermodynamic entropy production. This is the specific link that closes the loop on the demon.

  ***

  ### Side Question 1: The Circularity Charge

  **The Charge:** If Landauer's Principle is derived from the Second Law of Thermodynamics, using it to prove that the Second Law holds (by exorcising the demon) is circular.

  **The Resolution:** The charge lands on early formulations but fails against modern statistical mechanics.
  *   **Early View:** Landauer's original 1961 argument was heuristic and relied on thermodynamic intuition, making it vulnerable to the circularity charge when used to defend the Second Law.
  *   **Modern View:** Landauer's Principle is now derived from **microscopic reversibility** (Hamiltonian or Unitary dynamics) and the statistical nature of the memory device's coupling to a heat bath. It does not assume the macroscopic Second Law; it assumes the underlying dynamics of the particles are reversible.
  *   **What is doing the work:** The work is done by the **phase-space volume argument**. When you erase a bit, you compress the phase space of the memory device. By Liouville's theorem (in classical mechanics) or unitarity (in quantum mechanics), that phase space volume must go somewhere. It is pushed into the environmental degrees of freedom, manifesting as heat. This derivation relies on micro-dynamics, not macro-thermodynamics, so using it to save the Second Law is not circular.

  ### Side Question 2: Measurement vs. Erasure

  **The Shift:**
  *   **Old Story (Szilard/Brillouin):** The demon must *measure* the particle's position. Measurement requires coupling to the system, which was argued to cost at least $kT \ln 2$ in energy to overcome thermal noise.
  *   **New Story (Bennett/Landauer):** Measurement can be performed **reversibly**. You can copy the state of the gas particle onto the demon's memory without dissipating heat (a logically reversible operation). The cost arises only when the demon must **reset** its memory to begin the next cycle.

  **What Changed:**
  The development of **reversible computing theory** showed that acquiring information (measurement) does not inherently require logical irreversibility. However, storing that information in a finite memory and reusing that memory (erasure) *is* logically irreversible. If the demon never erased its memory, it would not violate the Second Law, but it would eventually fill its memory and stop working. To be a perpetual engine, it must cycle, and cycling requires erasure.

  **Is the Replacement Clean?**
  It is cleaner, but not pristine.
  *   **Pro:** It isolates the cost to a specific logical operation (resetting) rather than the fuzzy physical process of "looking."
  *   **Con:** It relies on a clear boundary between the "system," the "demon/memory," and the "environment." In complex quantum systems or general relativistic settings (like black holes), defining where the memory ends and the environment begins can be non-trivial. Furthermore, recent work in *quantum thermodynamics* suggests that under certain correlated initial states, even erasure costs can be manipulated, though the generalized Second Law still holds. The erasure exorcism is robust for classical and standard quantum demons, but the definition of "memory" remains the delicate variable.
