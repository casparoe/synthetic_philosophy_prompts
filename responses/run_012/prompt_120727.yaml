      *   *Why the shift?* Quantum mechanics and reversible computing theory showed measurement *can* be done without dissipation in principle. Erasure is logically irreversible.
      *   *Is it clean?* Mostly, but "erasure" depends on the definition of the memory state and the environment. It's cleaner than measurement but relies on the assumption that the demon must cycle.

