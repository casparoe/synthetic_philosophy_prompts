          *   *Verdict:* Mostly acceptable metaphorically, but "whenever" is too broad/loose.

      *   *Sentence 2:* "Their central claim is the parity principle: if an external process plays a role that, were it performed inside the head, we would call it cognitive, then it just is cognitive."
          *   *Analysis:* This is the standard formulation of the Parity Principle from the 1998 paper "The Extended Mind."
          *   *Verdict:* Accurate. Defenders accept this.

      *   *Sentence 3:* "The favourite illustration is Otto, whose Alzheimer's forces him to record everything in a notebook; because he consults it automatically, the notebook literally is part of his memory, just as the biological memory of his friend Inga is part of hers."
