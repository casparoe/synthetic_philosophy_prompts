          *   *Analysis:* "Anything you habitually use" is the slippery slope. EMT requires *functional isomorphism* and specific coupling conditions (availability, trust, automatic endorsement), not just habit. "Smeared" is a bit derogatory but descriptive. "Whatever tools a person happens to carry" implies contingency that ignores the structural integration required.
