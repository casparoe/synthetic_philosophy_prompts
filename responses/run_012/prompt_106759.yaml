answer: |-
  Here is a set of desiderata for a theory of cultural causation, designed for a general-readership piece. It avoids the Weberian trap and focuses on the structural requirements of the argument itself.

  ### The Desiderata of Cultural Causation

  To claim that a set of values causes a social or economic outcome, a theory must satisfy the following requirements. Each is paired with the consideration that motivates it and labeled by its status in the field.

  **1. The Mechanism Specification**
  *   **Requirement:** The theory must specify *how* the value travels from the mind (or the group) to the outcome. It cannot simply assert a correlation between "Value X" and "Outcome Y."
  *   **Motivation:** "Culture" is not a force like gravity; it is a label for millions of individual actions. Without a mechanism, the claim is mystical.
  *   **Status:** **Non-negotiable.** (Even critics agree that a black box is not an explanation.)

  **2. The Independence Test (Exogeneity)**
  *   **Requirement:** The theory must demonstrate that the value existed *prior* to the outcome and was not produced by the same material conditions or institutional arrangements that produced the outcome.
  *   **Motivation:** This addresses the "third factor" problem. If a legal regime creates both high trust and high wealth, trust did not cause the wealth.
  *   **Status:** **Non-negotiable.** (This is the central battleground of modern social science.)

  **3. The Translation Constraint**
  *   **Requirement:** The theory must account for how the value is interpreted differently in different contexts. A value like "honor" or "thrift" must be shown to operate similarly across different groups if it is to be a general cause.
  *   **Motivation:** Values are not chemical elements; their meaning shifts with context. If "thrift" causes growth in Scotland but stagnation in Peru, the theory must explain why, or admit the cause is not the value itself but the context.
  *   **Status:** **Contested.** (Universalists demand this; particularists argue culture is inherently local and untranslatable.)

  **4. The Counterfactual Stability**
  *   **Requirement:** The theory must be able to describe what would have happened if the value were absent or different, holding other factors constant.
  *   **Motivation:** Causation implies that changing the cause changes the effect. If the outcome would have happened anyway due to geography or technology, the value is decorative, not causal.
  *   **Status:** **Non-negotiable.** (Standard scientific practice, though difficult to achieve in history.)

  **5. The Micro-Macro Bridge**
  *   **Requirement:** The theory must explain how individual adherence (or non-adherence) aggregates to a societal outcome.
  *   **Motivation:** A society can hold a value without every individual acting on it. The theory must explain the aggregation rule (e.g., is it the average? the elite? the critical mass?).
  *   **Status:** **Camp Preference.** (Economists demand this; some sociologists and historians accept holistic explanations where the "group" acts as a unit.)

  ***

  ### The Ambiguity of Mechanism: Three Claims Masquerading as One

  You asked to press on the distinction between three ways a value might cause an outcome. These are genuinely different explanatory claims, they impose different evidentiary burdens, and successful popular accounts often trade on the ambiguity between them to evade criticism.

  **1. The Motivational Claim (Content as Cause)**
  *   **The Claim:** I hold Value V. Value V prescribes Action A. I perform Action A. Outcome O results.
  *   **The Burden:** Requires psychological or survey evidence that individuals are consciously or subconsciously guided by the content of the value.
  *   **The Trap:** This is the most intuitive claim but the easiest to falsify. People often act against their stated values. If a theory relies on this, it must explain why the value overrides material self-interest.

  **2. The Coordinating Claim (Sharedness as Cause)**
  *   **The Claim:** It does not matter what I personally believe. What matters is that I *expect* you to believe Value V. Because I expect you to enforce V, I perform Action A to avoid sanction or gain cooperation.
  *   **The Burden:** Requires network analysis or game-theoretic modeling. The cause is not the *content* of the value, but the *common knowledge* of the value.
  *   **The Trap:** This explains stability well but struggles to explain change. If the value is just an equilibrium, why did we settle on *this* value rather than another?

  **3. The Selection Claim (Filter as Cause)**
  *   **The Claim:** Individuals do not need to intend the outcome. Groups that happen to hold Value V out-compete, out-survive, or out-reproduce Groups that hold Value W.
  *   **The Burden:** Requires historical data on group survival or proliferation. The value operates like a genetic trait, selected for fitness, not necessarily for truth or moral utility.
  *   **The Trap:** This is often teleological. It risks saying "They succeeded, therefore they must have had a adaptive value," which is circular unless you can identify the value independently of the success.

  **Do familiar accounts trade on this ambiguity?**
  Yes. A theorist might defend their claim against psychological criticism by saying, "It's not about individual belief, it's about social norms" (switching from 1 to 2). When challenged on why the norm exists, they may switch to, "Because it's adaptive for the society" (switching to 3). A rigorous theory must pick one lane. If you claim Motivational, you cannot hide behind Selection when the psychology doesn't add up.

  ***

  ### The Endogeneity Problem and the "Killer" Requirement

  The demand that a theory distinguish between *Value $\to$ Outcome* and *Third Factor $\to$ (Value + Outcome)* is the hardest hurdle.

  **The Requirement that Rules Out Popular Accounts:**
  **The Independence Test (Requirement #2 above)** is the primary filter.
  *   **Why it kills Culturalist accounts:** It is historically difficult to find values that are not shaped by institutions, geography, or economic incentives. If you argue "Trust causes Wealth," the critic asks, "Did Wealth (via stable courts) cause Trust?" Most culturalist accounts fail to isolate the value from the material conditions that sustain it.
  *   **Why it kills Institutional accounts:** Conversely, strict institutionalists must explain why different groups adopt different institutions. If they say "Because of leadership," the culturalist asks, "Why did that leadership emerge here and not there?"

  **Can the requirements be jointly satisfied?**
  **Plainly: No, not fully.**
  There is a tension between **Mechanism Specificity (#1)** and **Independence (#2)**.
  To prove Independence, researchers often look for "natural experiments" (e.g., migrants carrying values to a new land, or arbitrary historical borders). These methods successfully isolate the value from local institutions. *However*, in stripping away the context to prove independence, they often strip away the mechanism. A value isolated from its supporting institutions often loses its power to explain the outcome.
  *   *Result:* You can prove the value is exogenous, but then it looks too weak to cause the outcome. Or, you can show the value is powerful, but only because it is embedded in institutions (endogenous). A theory that satisfies both perfectly is the "unicorn" of social science.

  ***

  ### Scorecard: How the Main Families Fare

  **1. Exogenous Values (e.g., Landes, Harrison, Huntington)**
  *   **Strengths:** High intuitive plausibility; satisfies Mechanism Specificity (Motivational).
  *   **Weaknesses:** Fails the Independence Test. Struggles to explain why values change or why they map so neatly onto economic boundaries.
  *   **Verdict:** Fails Non-negotiable #2.

  **2. Cultural Equilibrium (e.g., Akerlof, Tabellini, Greif)**
  *   **Strengths:** Satisfies Micro-Macro Bridge; handles the Coordinating Claim well. Mathematically rigorous.
  *   **Weaknesses:** Struggles with Equilibrium Selection (why *this* culture?). Often treats culture as a residual category for "institutions we can't model."
  *   **Verdict:** Satisfies #1 and #5, but wobbles on #2 (Independence).

  **3. Institutional Reductionism (e.g., Acemoglu, Robinson)**
  *   **Strengths:** Passes the Independence Test regarding values (treats them as downstream). High predictive power on policy.
  *   **Weaknesses:** Fails to explain the origin of institutions without smuggling in cultural or geographic assumptions.
  *   **Verdict:** Satisfies #2, but risks circularity on the ultimate cause of divergence.

  ***

  ### Settled vs. Contested: A Field Map

  For your piece, it is vital to distinguish where the smoke is and where the fire is.

  **What is Settled (Common Ground):**
  *   **Correlation $\neq$ Causation:** No serious scholar argues that mere correlation between a value and an outcome constitutes proof.
  *   **Values are not Magic:** Everyone agrees values must operate through human action or selection; supernatural or mystical causation is out.
  *   **Measurement Matters:** Self-reported survey data on values is recognized as noisy and prone to bias.

  **What is Genuinely Contested (Live Disagreements):**
  *   **The Unit of Analysis:** Is "culture" a property of a nation, a class, a network, or an individual? There is no consensus on where culture "lives."
  *   **The Possibility of Exogeneity:** Some economists believe values can be treated as random variables (via migration or historical accidents); many historians and anthropologists argue values are *always* co-evolved with material conditions and cannot be isolated.
  *   **The Definition of "Value":** Psychologists define values as internal preferences; sociologists define them as external scripts; evolutionary theorists define them as heuristics. When a political scientist says "culture," an economist hears "preferences" and an anthropologist hears "meaning." They are often talking past one another.
  *   **The Time Horizon:** Can a value cause an outcome centuries later (persistence)? Or does culture update every generation? The "persistence" literature is hotly disputed regarding whether it reflects culture or enduring institutional structures.

  **A Note for the Writer:**
  If you take one thing for granted, flag it: **The assumption that "Culture" is a singular thing.** The most productive recent work suggests dropping the word "culture" entirely and speaking of specific mechanisms (trust networks, kinship tightness, time preference). The quarrel often persists only because the word "culture" is doing too much work.
