      *   The "Weberian" shadow is long, so the criteria must be robust enough to handle modern social science (econ, psych, anthro).

  3.  **Drafting the Desiderata (The Requirements List):**

      *   *Requirement 1: Mechanism Specificity.* (Addresses Focus 1). Need to specify *how* the value works.
      *   *Requirement 2: Counterfactual Stability.* (Addresses Focus 2). If the value changes, does the outcome change?
      *   *Requirement 3: Exogeneity/Independence.* (Addresses Focus 2). Can we show the value wasn't caused by the outcome or a third factor?
      *   *Requirement 4: Micro-foundations.* (Addresses Focus 1). Does it match how individuals actually think/act?
      *   *Requirement 5: Cross-Context Portability.* (Addresses generalizability). Does it work outside the specific historical case?

      *Refining the "Three Mechanisms" (Focus 1):*
      1.  *Content/Motive:* I believe X, so I do Y. (Psychological).
      2.  *Sharedness/Enforcement:* Everyone believes X, so if I don't do Y, I get punished. (Sociological/Game Theoretic).
      3.  *Selection Filter:* Groups with X survive/thrive, regardless of individual intent. (Evolutionary/Functional).
      *Analysis:* These *are* distinct. They require different data (surveys vs. network analysis vs. historical survival rates). Many theories blur them (e.g., saying "Culture matters" without saying if it's guilt or gossip).

      *Refining the "Endogeneity" (Focus 2):*
      *   The hardest requirement is *Exogeneity*. Institutions often shape values (e.g., rule of law $\to$ trust).
