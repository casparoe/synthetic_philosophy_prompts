          *   Defensible to authors (canon-knowledgeable, metaphysics-ignorant).
          *   Must distinguish rigidity *within* a branch vs. *across* worlds.
          *   Must classify claims as: Necessary A Posteriori, Contingent Authorial Stipulation, or Category Mistake.
          *   Must handle three specific test cases (Morning/Evening Star, Water/H2O, Napoleon/Counterpart).
