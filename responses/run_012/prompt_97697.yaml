answer: |-
  # Archive Modal Reference Procedure (AMRP-1)

  **To:** Editorial Assistants
  **From:** Modal Reference Editor
  **Subject:** Identity Claims and Branch Classification

  **Purpose:** To standardize decisions on identity claims (names, substances, descriptions) across archive branches.
  **Constraint:** You have 30 minutes per submission. Do not debate metaphysics with authors. Apply the test.
  **Core Principle:** The Archive treats Proper Names and Natural Kinds in the **Master Canon** as **Rigid Designators**. They pick out the same entity/substance in every branch *unless* the branch is explicitly classified as a **Counterpart World**.

  **Warning:** Do not confuse *Rigidity Within a Branch* (does "Napoleon" refer to the same guy from page 1 to page 100?) with *Rigidity Across Branches* (does "Napoleon" in this story refer to the Canon Napoleon?). This procedure tests **Across-Branch Rigidity**. Within a branch, assume names are rigid unless the text explicitly says otherwise.

  ---

  ## The Decision Procedure

  ### Q1: Branch Classification
  **Question:** Is the submission tagged as **Divergent History** (Same World, different timeline) or **Counterpart World** (Parallel Universe, no shared individuals)?
  *   **Divergent History:** Proceed to Q2.
  *   **Counterpart World:** Proceed to Q2.
  *   **Unclear/Unspecified:** **STOP.** Escalate to Editor. (We cannot assess identity without knowing the trans-world relation).

  ### Q2: Term Identification
  **Question:** What type of term is the author claiming identity or difference about?
  *   **Proper Name** (e.g., "Napoleon", "Sherlock Holmes"): Proceed to Q3.
  *   **Natural Kind** (e.g., "Water", "Gold", "Fire"): Proceed to Q3.
  *   **Definite Description** (e.g., "The Morning Star", "The Winner"): Proceed to Q3.
  *   **Vague/Abstract** (e.g., "The Spirit of the Age", "Magic"): **STOP.** Escalate to Editor. (These are not rigid designators).

  ### Q3: The Canon Baseline
  **Question:** In the Master Canon, what is the established identity of this term?
  *   **Fact:** (e.g., Water = H2O; Hesperus = Phosphorus; Napoleon = The historical organism).
  *   **Action:** Verify against the Canon Database.
  *   **If Canon is Silent:** **STOP.** Escalate to Editor. (We cannot judge deviation without a baseline).
  *   **If Canon is Established:** Proceed to Q4.

  ### Q4: The Submission Claim
  **Question:** Does the submission claim the term refers to the **Same Entity** as Canon or a **Different Entity**?
  *   **Same Entity (Identity):** (e.g., "This is Napoleon, but he won at Waterloo"). Proceed to Q5.
  *   **Different Entity (Non-Identity):** (e.g., "This 'Water' is XYZ," or "This 'Napoleon' is a different person"). Proceed to Q5.
  *   **Ambiguous:** **STOP.** Escalate to Editor.

  ### Q5: The Modal Compatibility Test
  **Question:** Based on Q1 (Branch Type) and Q4 (Claim), is the claim metaphysically compatible with the Canon?

  *   **Scenario A: Divergent History + Same Entity Claim.**
      *   *Test:* Can the Canon Entity have these different properties?
      *   *Yes (Contingent Properties):* (e.g., Napoleon loses a battle he won). **VERDICT: ACCEPT.** (Classify as Contingent Authorial Stipulation).
      *   *No (Essential/Identity Properties):* (e.g., Napoleon is a woman; Water is XYZ; Hesperus ≠ Phosphorus). **VERDICT: REJECT PREMISE.** (Classify as Category Mistake).
      *   *Judgment Call:* If unsure if a property is essential (e.g., "Napoleon is immortal"), **STOP.** Escalate to Editor.

  *   **Scenario B: Divergent History + Different Entity Claim.**
      *   *Test:* The author claims the name picks out a *different* individual/substance in the *same* world.
      *   *Result:* **VERDICT: REJECT PREMISE.** (Classify as Category Mistake).
      *   *Reasoning:* In a Divergent History, names are rigid across branches. You cannot have a "different Napoleon" in the same world history.
      *   *Option:* Offer author reclassification to Counterpart World.

  *   **Scenario C: Counterpart World + Same Entity Claim.**
      *   *Test:* The author claims it is the *strictly identical* individual/substance despite being a Counterpart World.
      *   *Result:* **VERDICT: REJECT CLASSIFICATION.** (Classify as Contradiction).
      *   *Reasoning:* Counterpart Worlds by definition do not share individuals.
      *   *Option:* Offer author reclassification to Divergent History (if metaphysically possible).

  *   **Scenario D: Counterpart World + Different Entity Claim.**
      *   *Test:* The author claims the name picks out a counterpart (similar but distinct).
      *   *Result:* **VERDICT: ACCEPT.** (Classify as Contingent Authorial Stipulation).
      *   *Note:* Ensure the text acknowledges this is a counterpart (e.g., "In this world, the man they call Napoleon...").

  ---

  ## Application to Recurring Disputes

  ### Case 1: The Morning Star / Evening Star
  *   **Submission:** Branch tagged **Divergent History**. Claim: "In this timeline, the Morning Star and Evening Star are two different planetary bodies, not one."
  *   **Q1:** Divergent History.
  *   **Q2:** Definite Description acting as Name (Hesperus/Phosphorus).
  *   **Q3:** Canon Baseline: Hesperus = Phosphorus (Venus). This is an identity statement.
  *   **Q4:** Submission Claim: Different Entities (Non-Identity).
  *   **Q5 (Scenario B):** Divergent History + Different Entity Claim.
  *   **Verdict:** **REJECT PREMISE (Category Mistake).**
  *   **Reasoning:** Identity is necessary. You cannot diverge from an identity statement. If they are two bodies, they are not Hesperus and Phosphorus.
  *   **Action:** Offer author reclassification to **Counterpart World**. If they refuse, reject.

  ### Case 2: Water / H2O
  *   **Submission:** Branch tagged **Divergent History**. Claim: "In this branch, the substance everyone calls water is not H2O but a different compound (XYZ) with the same observable behavior."
  *   **Q1:** Divergent History.
  *   **Q2:** Natural Kind (Water).
  *   **Q3:** Canon Baseline: Water = H2O (Necessary A Posteriori).
  *   **Q4:** Submission Claim: Different Entity (Water ≠ H2O).
  *   **Q5 (Scenario B):** Divergent History + Different Entity Claim.
  *   **Verdict:** **REJECT PREMISE (Category Mistake).**
  *   **Reasoning:** In the Archive's physics, "Water" rigidly designates H2O. XYZ is "Schmwater." Calling it "Water" in a Same-World branch is false.
  *   **Action:** Offer author reclassification to **Counterpart World**. If they insist this is our Earth, reject.

  ### Case 3: Napoleon / Counterpart
  *   **Submission:** Branch tagged **Divergent History**. Claim: "In this branch, the person everyone calls Napoleon is a different individual, born to the same parents and living the same life, but not the same person [numerically distinct]."
  *   **Q1:** Divergent History.
  *   **Q2:** Proper Name (Napoleon).
  *   **Q3:** Canon Baseline: Napoleon = The specific biological organism born 1769.
  *   **Q4:** Submission Claim: Different Entity (Different Individual).
  *   **Q5 (Scenario B):** Divergent History + Different Entity Claim.
  *   **Verdict:** **REJECT PREMISE (Category Mistake).**
  *   **Reasoning:** A Proper Name in a Divergent History branch rigidly designates the Canon individual. You cannot have a "different individual" who is "Napoleon" in the same world. That is the definition of a Counterpart.
  *   **Action:** **Force Reclassification to Counterpart World.**

  ---

  ## The Unpopular Verdict: Case 3 (Napoleon)

  **Verdict:** I am ordering that Case 3 be **reclassified from Divergent History to Counterpart World**, even if this downgrades a flagship story from a star author.

  **Defense:**
  Authors often believe that "Same Parents + Same Life + Same Name = Same Person." Metaphysically, this is false. If the submission explicitly claims the individual is *numerically distinct* (a different soul, organism, or entity), it is not a story about the Archive's Napoleon. It is a story about his counterpart.

  If we allow this to remain in the **Divergent History** branch, we break the trans-world identity conditions of the Archive. We tell readers that "Napoleon" refers to the Canon Individual in Story A, but refers to "Someone Else" in Story B, while claiming both are the "Same World." This makes the Canon incoherent.

  **Why you will not like this:**
  This story is likely marketed as "The True Alternate History of Napoleon." Reclassifying it to "Counterpart/Parallel" signals to readers that this story does not affect the main timeline's continuity. It reduces the story's canonical weight. The author will argue that "it's just a story" and "readers won't care." They are wrong. If we build a shared world, metaphysical consistency is the load-bearing wall. If we let this slide, we invite twenty more submissions claiming "This is Napoleon, but he's actually a robot/alien/different person," and the name "Napoleon" ceases to function as a rigid designator in our archive. It becomes a title, not a name. We do not publish titles; we publish histories.

  **Classification:** This claim is being offered as a **Contingent Authorial Stipulation** that conflicts with the **Necessary A Posteriori** truth of personal identity in the Canon. The author is treating "Napoleon" as a non-rigid description ("Whoever fits the role"). The Archive treats it as a rigid name. The Archive wins.

  ---

  ## Limitations of the Procedure

  Assistants must know what this procedure *cannot* do. Do not attempt to force the following through this algorithm; escalate them to me immediately.

  1.  **Vague Natural Kinds:** The procedure works for "Water" or "Gold." It fails for "Magic," "The Force," or "Psynergy." These are not natural kinds with microstructures. Whether "Magic in Branch A" is the same substance as "Magic in Branch B" is a thematic judgment, not a factual test. **Escalate.**
  2.  **Intentional Ambiguity:** Some literary fiction deliberately leaves identity unclear (e.g., "Is this the same man, or his son using his name?"). The procedure demands a binary choice (Same/Different). If the ambiguity is the point of the story, **Escalate.** Do not force the author to clarify if it destroys the narrative.
  3.  **Canon Errors:** This procedure assumes the Canon Baseline (Q3) is correct. If the Canon itself is contradictory (e.g., one flagship story says Water is H2O, another says it's H3O), this procedure will generate false rejections. If you find a Canon conflict, **Escalate.** Do not use this to police the Canon itself.
  4.  **Value Judgments disguised as Facts:** Assistants often mistake "This doesn't feel like Napoleon" for "This is not Napoleon."
      *   *Fact:* "The text states he is a different organism."
      *   *Value:* "The text states he acts out of character."
      *   This procedure only handles the **Fact**. If the dispute is about character consistency (acting out of character vs. being a different person), **Escalate.** That is an editorial judgment, not a modal one.

  **Final Instruction:** If the procedure tells you to Reject or Reclassify, do not apologize. State the rule: *"Archive Policy treats Proper Names as Rigid Designators across Divergent Histories. Your claim violates trans-world identity conditions."* Then send the email.
