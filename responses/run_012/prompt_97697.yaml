      *   *Crucial Distinction:* The prompt asks to distinguish rigidity *within* a branch vs. *across* worlds.
      *   *Decision:* The procedure must first establish the *relation* of the branch to the Canon.
      *   *Q1:* Branch Type. (Divergent History vs. Counterpart).
      *   *Q2:* Term Type. (Name vs. Kind).
      *   *Q3:* The Identity Claim. (Is X = Y in Canon? Is X = Y in Story?)
      *   *Q4:* The Possibility Test. (Could X be non-Y in this branch without changing the *definition*?)

      *Wait, the prompt requires specific handling of the "Necessary A Posteriori" distinction.*
      *   If "Water = H2O" is necessary a posteriori, you can't have water that isn't H2O. You can only have "watery stuff" that isn't water.
      *   If "Napoleon = The guy born to Carlo/Letizia..." is rigid, you can't have a different person with that name who is *Napoleon*.
      *   *The Twist:* Fiction often treats these as contingent. The procedure needs to police this *unless* the branch type allows it.

      *Revised Procedure Structure:*
      1.  **Branch Classification:** Divergent (Same World) vs. Counterpart (Different World).
