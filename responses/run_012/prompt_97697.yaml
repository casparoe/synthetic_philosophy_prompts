      *   What can't this do? It can't solve vague identity (Theseus ship). It can't handle intentional ambiguity. It relies on assistants knowing the Canon baseline perfectly. It simplifies "Natural Kind" (is 'Magic' a natural kind?).

  7.  **Finalizing the Tone:**
      *   Bureaucratic but philosophically rigorous.
      *   No hedging. "If X, then Y."
      *   Clear escalation paths.

  8.  **Review against Constraints:**
      *   Sequence of questions? Yes.
      *   Sufficient/Stop/Escalate answers? Yes.
      *   Handle 3 cases? Yes.
      *   Classify claim type (Nec A Post, etc.)? Yes.
      *   Distinguish Rigidity (Within vs Across)? Yes.
      *   Unpopular verdict included? Yes.
      *   Limitations section? Yes.
      *   No citations? Yes.

      *(Self-Correction during drafting)*: Make sure the distinction between "Rigidity Within" and "Rigidity Across" is explicit in the questions.
      *   *Rigidity Within:* Does the term refer to the same thing at all times in the story? (Usually yes for names).
      *   *Rigidity Across:* Does the term refer to the same thing as the Canon? (This is the Archive's main concern).
      *   *The Confusion:* Assistants think if a term is rigid across worlds, its properties can't change. (False: Napoleon can lose battles). If a term is non-rigid across worlds, it's a counterpart.
      *   *Procedure Fix:* Question 3 must explicitly ask: "Is the author claiming the *object* is different, or just the *history*?"

      *Let's finalize the Unpopular Verdict.* I'm going to rule on Case 1 (Morning/Evening Star). If an author writes a story where Hesperus and Phosphorus are distinct planets in a branch labeled "Divergent History," I will reject the premise. Identity is necessary. You cannot diverge from an identity statement. This forces the story to be either Fantasy (Counterpart) or Garbage. This is a hard Kripkean line that will annoy authors who treat astronomy as contingent.

