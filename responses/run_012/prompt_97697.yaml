      *   *Wait, better Unpopular Verdict:* Case 1. If an author writes "Hesperus is not Phosphorus" in a Divergent branch, they are denying a necessary identity. I will force this to be a Counterpart story. This demotes a "What If" history to a "Fantasy Parallel." That hurts prestige.
