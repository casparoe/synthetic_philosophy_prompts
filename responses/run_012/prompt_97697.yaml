  2.  **Deconstruct the Philosophical Problems:**
      *   *Rigid Designation:* A term refers to the same object in all possible worlds where that object exists (Kripke).
      *   *Necessary A Posteriori:* Identities like "Hesperus = Phosphorus" or "Water = H2O" are necessary if true, but known through empirical investigation.
      *   *The Archive's Problem:* Fiction often plays fast and loose with metaphysics. "What if water wasn't H2O?" is a common trope (Twin Earth). "What if Napoleon was different?" is standard alternate history.
      *   *The Conflict:* If the archive treats "Water" as rigidly designating H2O, then a story where "Water" is XYZ is technically talking about a different substance, not water. If the archive treats "Napoleon" as rigidly designating the historical individual, a story where he makes different choices is still about *him*. But if the story says "This is a different Napoleon," is it a counterpart or the same guy?
