answer: |-
  I recommend that the committee accept the physical collection into the permanent store but catalogue and display it strictly as material of unknown provenance, without any public assertion linking it to the named cave.

  This recommendation rests on a distinction between the ontology of the artifact and the epistemology of the claim. The stones are authentic worked materials; their existence is not in dispute. However, the assertion that they originate from the named cave is a historical claim requiring a standard of proof commensurate with the significance of the conclusion. If accepting this claim rewrites the regional timeline of human presence, the evidential standard must be sufficiently high to withstand falsification. We must apply a stricter standard to the public label than to the internal catalogue. A label is an assertion of knowledge to a non-specialist public; it collapses uncertainty into fact. The catalogue may hold nuance, recording the collector's account as hearsay alongside the physical description. To display the cave name as fact is to privilege a story over data, confusing provenance with tradition.

  Regarding the nature of the evidence, I propose we test two assumptions from my former trade against this specific case. The first is that the incompleteness of a record is a fact about preservation and sampling rather than about what once existed. In palaeontology, gaps are usually geological; here, the gap is human. The stones survived, but the information regarding their stratigraphic context was never recorded or was deliberately withheld. Therefore, the incompleteness here is not a neutral sampling error but an active erasure. We cannot treat this silence as a natural void to be filled by inference; it is a procedural failure. The second assumption is that a find stripped of its context is not merely weak evidence but a different kind of thing. This holds true. A stone tool in situ is a coordinate in space and time, evidence of behavior at a specific moment. A stone tool without context is merely a typological specimen; it illustrates what humans *could* make, but not what they *did* make in this specific place at this specific time. It shifts from being evidence of history to being an illustration of technology. To treat it as the former is a category error.

  This leads to the argument from silence. When does an absence of evidence constitute evidence of absence? Only when we have reasonable expectations of recovery based on known survival and recovery rates. In archaeology, we expect silence to be the norm; most sites are never found, and most records are lost. Therefore, the lack of excavation records does not prove the cave claim is false. However, it also prevents us from assigning a probability high enough for public assertion. The silence here proves nothing about the past existence of humans in the cave, but it proves everything about our current inability to verify it. We cannot infer truth from the absence of disproof, particularly when the chain of testimony is broken by death and relies on second-hand account.

  The strongest case against this recommendation comes from the development office and those who favour acceptance of the findspot. They argue that the stones are genuine, the story is plausible, and the opportunity to engage the public with a transformative narrative outweighs the risk of uncertainty. To refuse the claim is to prioritize bureaucratic purity over public inspiration. There is merit to this. Museums are not merely archives; they are storytellers. If we demand Cartesian certainty, we will display nothing. The collector's account may well be true, and by withholding the cave name, we may be obscuring a genuine historical breakthrough. Furthermore, refusing the link may discourage future collectors from donating material, driving such finds into private hands where they are lost to science entirely.

  However, the risk of error is asymmetrical. If we display the claim and it is later debunked, the museum's authority on regional history is permanently damaged, and the public narrative must be painfully retracted. If we withhold the claim, we preserve the integrity of the timeline while keeping the objects available for study. We can tell the public: "These are ancient tools, but we do not know exactly where they were found." This is itself an educational moment about how history is constructed.

  Finally, what evidence would change this recommendation? We would require independent verification of the provenance. This could take the form of residue analysis matching specific local flora or fauna unique to that cave's micro-environment, or the discovery of comparable material in a controlled excavation within the cave that matches the tool technology and raw material source precisely. Residue analysis is obtainable, though destructive and not guaranteed to yield location-specific data. Comparative excavation is obtainable only with significant funding and no guarantee of success. Until such data exists, the claim remains testimony, not evidence. We must accept the objects as things, but reject the story as history.
