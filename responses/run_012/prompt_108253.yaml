  **MEMORANDUM**

  **TO:** Grantmaking Committee
  **FROM:** Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on County Education Proposals (A vs. B)

  This Thursday, we must choose between two distinct moral frameworks. Proposal A is *prioritarian*: it prioritizes the absolute welfare of the worst-off. Proposal B is *egalitarian*: it prioritizes the relative gap between counties, even at the cost of absolute welfare.

  Trustee [Name]'s argument for Proposal B must be taken seriously. Inequality is not just a statistic; it is a social hierarchy. If the better-off county's advantage is purely *positional*—e.g., competing for limited state college slots—then their advantage is our disadvantage. In that specific context, reducing their score without raising ours is not "leveling down"; it is clearing a barrier. It helps the poor county win the slot. That is a genuine improvement.

  However, our data suggests education outcomes here are primarily *absolute* (literacy, numeracy, health), not purely positional. Proposal B imposes reporting costs that lower the rich county's performance without transferring resources or opportunities to the poor county. Because our charter prevents redirecting unspent funds to Proposal A, choosing B means accepting lower overall regional outcomes to satisfy a symmetry principle.

  This is the "leveling down" objection in practice: making someone worse off without making anyone else better off. This is only justified if the *relative status* itself causes harm greater than the absolute loss. While status anxiety is real, depriving children in the better-off county of effective programs to shrink a gap does not measurably improve life chances in the poor county under current metrics.

  Proposal A dominates Proposal B. It improves the absolute standing of the worst-off (the prioritarian mandate) and likely improves their positional standing as well (by raising their scores relative to the state). Proposal B risks harming the rich county's absolute outcomes with only speculative positional gains for the poor county.

  **Recommendation:**
  1.  **Fund Proposal A** in full for the upcoming cycle.
  2.  **Defer Proposal B.**
  3.  **Timeframe:** Funding effective November 1. Committee to commission a review by Q3 next year on whether specific regional benefits (e.g., state grant access) are purely positional, to inform future egalitarian interventions.

  We cannot solve every injustice in one cycle. We must choose the intervention that guarantees help to those who need it most, rather than one that guarantees harm to those who have enough in the name of symmetry.

  ***

