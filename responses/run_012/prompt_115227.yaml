prompt: |-
  I'm a software engineer on a small platform team that maintains a widely used wire protocol and a compatibility registry: third parties submit their own clients and servers, and we decide whether to list each one as a conforming implementation. Today we decide case by case, mostly by running the submitter's code against our reference test suite, and we have been inconsistent enough that rejected submitters have started appealing in public. We get roughly a submission a month, and I want to replace our ad hoc judgment with a written procedure my teammates and I can actually run.

  A colleague who studied philosophy says our problem is the same one philosophers of mind have about minds and brains, and that the position usually called functionalism, together with the observation that one and the same function can be realized in many different physical systems, gives the right criterion: what makes something an implementation of our protocol is the causal role it plays — the mapping from inputs to outputs and the way it interacts with the rest of the system — rather than the structure or the substrate of the thing playing that role. I don't know whether that is right, but I want the procedure built on it so we can see where it strains.

  Please write the procedure: the questions to ask, in a fixed order; what counts as a sufficient answer to each; where the procedure terminates in accept or reject; and where it must stop and hand the decision to a person because the remaining question is a value judgment rather than a test result. It has to be something two engineers with no philosophy training can run in about an hour and defend in writing when a rejection is appealed.

  It has to survive at least these cases: a submission that passes every test we have but does so by shipping a giant precomputed table of answers, or by quietly forwarding each request to our reference implementation over the network; a submission that matches on every defined input but diverges on inputs the spec leaves undefined; a submission that is correct but whose timing, memory, or error-handling behavior under load is visibly different from the reference; and two submissions that are indistinguishable on every test we can write, yet whose maintainers insist their internal states mean different things.

  Then run the procedure on two or three concrete submissions, including one where it returns an answer I will not like, and tell me plainly what the procedure cannot settle — the cases where it will make us look decisive while in fact making a value judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Software Engineer on a small platform team.
      *   **Task:** Create a written procedure for certifying third-party implementations of a wire protocol.
      *   **Current State:** Ad hoc, inconsistent, leading to public appeals.
      *   **Constraint 1 (Philosophical Basis):** Build the procedure on *Functionalism* (causal role, input/output mapping, interaction) rather than structural/substrate identity.
      *   **Constraint 2 (Usability):** Two engineers, no philosophy training, ~1 hour to run, defensible in writing.
      *   **Constraint 3 (Edge Cases to Survive):**
          *   Lookup table / Cheating (passes tests but isn't a real implementation).
          *   Undefined inputs (diverges on spec-undefined behavior).
          *   Non-functional differences (timing, memory, error handling under load).
          *   Internal state semantics (indistinguishable externally, different internal meaning).
      *   **Deliverable:** The Procedure (questions, order, pass/fail criteria, human handoff points) + Run-through on concrete examples (including an unpopular outcome) + Analysis of limitations (where value judgments hide).

  2.  **Analyze the Philosophical Basis (Functionalism):**

      *   *Core Idea:* Mental states (or in this case, protocol states) are defined by their functional role (inputs $\to$ outputs + internal state transitions), not by what they are made of.
      *   *Application to Protocols:* An implementation is valid if it occupies the same "causal niche" as the reference. It must react to inputs correctly, produce correct outputs, and maintain internal consistency *as if* it were following the protocol logic.
      *   *Tension:* Pure functionalism might allow a "Lookup Table" (if it covers all inputs). It might also struggle with "Internal State Semantics" (if externally indistinguishable). The procedure needs to *operationalize* functionalism in a way that filters out trivial realizations (like lookup tables) without slipping back into structuralism (requiring specific code structure).
      *   *Key Insight:* Functionalism in engineering isn't just I/O; it's *counterfactual* I/O. "What *would* it do if...?" A lookup table fails counterfactuals outside its precomputed range. A proxy fails if the upstream is cut.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Fixed order, clear criteria, time-boxed.
      *   *Step 1: Specification Alignment.* Does it claim to implement the specific version? (Administrative).
      *   *Step 2: I/O Conformance.* The standard test suite. (Functional core).
      *   *Step 3: Counterfactual Robustness.* This addresses the Lookup Table/Proxy issue. We need to test things *not* in the spec or edge cases that require computation, not just retrieval.
      *   *Step 4: Resource & Error Causal Role.* Functionalism includes how the system degrades. If the spec says "fail gracefully," but this impl crashes the host, is it playing the same role?
      *   *Step 5: Internal State (The Hard Part).* If two impls are externally identical, functionalism says they are equivalent *unless* the internal state affects future causal roles. If maintainers claim different meanings, does it matter? Only if it affects future I/O.
      *   *Decision Points:* Need clear Accept/Reject/Handoff.

      *Refining for the "Lookup Table" Problem:* Pure functionalism actually *accepts* a perfect lookup table if the domain is finite. But protocols usually have large/finite-but-huge domains (nonces, timestamps). We need a "Generativity Test." Can it handle a valid input it has never seen before?
      *Refining for the "Proxy" Problem:* Isolation testing. Cut the network. Does it still work?
      *Refining for "Undefined Inputs":* The spec defines the function. Undefined inputs are outside the function. Divergence there shouldn't matter *unless* it causes side effects (crashes, security issues).
      *Refining for "Internal State":* If it doesn't affect I/O, functionalism says it doesn't exist. We must rule this as "Irrelevant."

  4.  **Developing the Procedure Steps (The "Protocol Conformance Assessment" - PCA):**

      *   *Phase 1: Isolation & Identity.* (Stop proxies).
      *   *Phase 2: Standard Conformance.* (The baseline tests).
      *   *Phase 3: Generativity & Counterfactuals.* (Stop lookup tables).
      *   *Phase 4: Failure Mode Causal Role.* (Error handling).
      *   *Phase 5: The "Black Box" Limit.* (Internal state claims).

  5.  **Selecting Concrete Submissions for Run-Through:**

      *   *Case A (The "Cheater"):* A wrapper around the reference impl (Proxy).
      *   *Case B (The "Rigid"):* Lookup table / Hardcoded.
      *   *Case C (The "Unpopular"):* A correct implementation that is technically conformant but dangerous (e.g., correct I/O but catastrophic resource usage, or correct I/O but violates a security spirit). Let's go with *Correct I/O but Security Risk via Timing* or *Correct I/O but violates "Undefined" behavior in a way that breaks interoperability.*
      *   *Better Case C:* An implementation that is functionally identical but uses a proprietary encoding internally that *could* leak data, or simply one that passes everything but the team hates because it's a competitor.
      *   *Best "Unpopular" Case:* An implementation that passes all functional tests but relies on a specific hardware enclave (substrate dependence). Functionalism says "Accept," but engineering risk says "Reject." This highlights the limitation.
      *   *Alternative "Unpopular" Case:* An implementation that handles undefined inputs by crashing. Functionalism says "Accept" (undefined is undefined), but Stability says "Reject." This is a great tension point.

  6.  **Writing the Analysis of Limitations:**

      *   Where does the procedure hide value judgments?
      *   *Resource bounds:* Functionalism doesn't care about efficiency, only correctness. Engineering does.
      *   *Security:* Security is often about what the system *doesn't* do (side channels). Functionalism focuses on what it *does*.
      *   *Intent:* The "Internal State" issue. If maintainers say "This bit means X" but it never affects output, functionalism says "Irrelevant." But if it affects documentation or future compatibility, it matters.

  7.  **Review against Constraints:**

      *   *Time:* Can this be done in an hour? The tests need to be automated. The procedure is about *running* the tests and interpreting results.
      *   *Philosophy:* Is it functionalist? Yes, focuses on causal role, I/O, and state transitions, explicitly ignoring substrate.
      *   *Defensibility:* Yes, clear pass/fail criteria.

  8.  **Final Polish:**

      *   Tone: Professional, engineering-focused, but acknowledging the philosophical underpinnings.
      *   Structure: Procedure first, then Run-Through, then Limitations.
      *   Self-Correction during drafting: Make sure I don't accidentally slip into structuralism (e.g., "check the code"). Keep it black-box where possible, as per functionalism.

      *(Self-Correction on the "Lookup Table" case)*: A finite protocol *can* be implemented as a lookup table. Why is that bad? Because maintenance is impossible. But functionalism doesn't care about maintainability. I need to frame the test around *novel* inputs (nonces, session IDs) that cannot be precomputed.
      *(Self-Correction on "Undefined Inputs")*: If the spec says "undefined," functionalism says "anything goes." But if crashing on undefined input breaks the *network* (e.g., sending a reset that kills a connection), that *is* a causal effect. So the test is: Does the divergence cause observable side-effects on conforming peers?

  9.  **Finalizing the Output Structure:**
      1.  Introduction (acknowledging the functionalist constraint).
      2.  The Procedure (PCA-v1).
      3.  Case Studies (Proxy, Lookup, The "Unpopular" Robustness case).
      4.  The "Hard Truths" (Limitations/Value Judgments).

      *Wait, one more check on the "Unpopular" outcome.* The prompt asks for "one where it returns an answer I will not like." This implies the procedure might force an Accept on something risky, or a Reject on something valid. Given the functionalist constraint, the procedure will likely force an **Accept** on something that feels risky (e.g., efficient but opaque, or correct but fragile). Let's choose an implementation that is functionally perfect but relies on a closed-source binary blob (substrate opacity). Functionalism says "Accept," Engineering trust says "Reject." Or, an implementation that handles undefined inputs aggressively. Let's go with the **Undefined Input Aggressor**: It crashes on undefined input. Spec says undefined. Functionalism says "Pass." Engineering says "This will take down our prod." This forces the team to realize the procedure needs a "Safety Override."

      *Actually, better:* The procedure should hand off to a human for value judgments. So the "Unpopular" answer should be a "Handoff" that feels like a cop-out, or a "Pass" that feels dangerous. Let's aim for a **Pass** that feels dangerous due to resource usage. Functionalism ignores *cost*, only *causal role*. If it returns the right answer but takes 10GB RAM, is it the same function? Yes. Is it acceptable? No. The procedure must catch this in the "Resource Causal Role" section.
      *Okay, let's make the "Unpopular" one about Internal State.* Two impls are identical. One claims internal state X, one claims Y. Functionalism says "Indistinguishable = Same." Maintainers argue. Procedure says "Irrelevant." The "Unpopular" result is telling a maintainer their internal architecture doesn't matter.
      *No, the prompt asks for an answer *I* (the user) will not like.* As a platform engineer, I probably want to reject risky things. So the procedure should force an **Accept** on something risky.
      *Decision:* The "Undefined Input" case. Spec is silent. Impl crashes. Procedure says "Pass" (because spec is silent). I (the engineer) want to Reject (because stability). This highlights the gap between Functional Correctness and Engineering Safety.

      *Wait, re-reading prompt:* "tell me plainly what the procedure cannot settle — the cases where it will make us look decisive while in fact making a value judgment."
      Okay, so I need to show where the procedure *pretends* to be objective but isn't.

      Let's draft.

      *Step 1: Define the Functional Role.*
      *Step 2: Isolation.*
      *Step 3: Standard Tests.*
      *Step 4: Counterfactuals (Novel inputs).*
      *Step 5: Error Causal Role.*
      *Step 6: Internal State (The Black Box Rule).*

      *Case 1: The Proxy.* (Fail Isolation).
      *Case 2: The Lookup Table.* (Fail Counterfactual).
      *Case 3: The "Spec-Silent" Crasher.* (Passes Functionalism, Fails Engineering Intuition).

      Let's write it.cw
answer: |-
  # Protocol Conformance Assessment (PCA) — Version 1.0

  **Philosophical Basis:** Functionalism. An implementation is defined by its causal role (inputs, outputs, state transitions, and interaction patterns), not its internal structure, codebase, or substrate.
  **Goal:** Determine if a submission occupies the same functional niche as the reference implementation within the ecosystem.
  **Time Budget:** 60 minutes (assuming automated test infrastructure).
  **Operators:** Two engineers.

  ---

  ## Part 1: The Procedure

  ### Phase 1: Isolation & Identity (10 Minutes)
  *Goal: Ensure the system is a self-contained causal agent, not a passthrough.*

  1.  **Q1: Network Isolation.** Can the submission complete a valid handshake and exchange data when completely cut off from the public internet (except for the test harness)?
      *   **Sufficient Answer:** Yes. The system processes requests using local logic.
      *   **Failure Condition:** The system hangs, errors, or visibly proxies traffic to an external IP when isolated.
      *   **Decision:** **Reject** if Failed. (This eliminates "wrapper" submissions).
      *   **Handoff:** If the system requires external services (e.g., a specific auth provider), hand off to Human Review to determine if that dependency violates the protocol's "self-contained" assumption.

  2.  **Q2: Version Declaration.** Does the submission explicitly declare which version of the protocol spec it implements?
      *   **Sufficient Answer:** Yes, matches a supported version ID.
      *   **Decision:** **Reject** if No.

  ### Phase 2: Standard Conformance (20 Minutes)
  *Goal: Verify the core input/output mapping matches the spec.*

  3.  **Q3: Reference Test Suite.** Does the submission pass the official conformance test suite (inputs $I_{std}$, expected outputs $O_{std}$)?
      *   **Sufficient Answer:** 100% pass rate on defined behaviors.
      *   **Decision:** **Reject** if any test fails.
      *   **Handoff:** If a test fails but the submitter proves the *test* is wrong (spec ambiguity), hand off to Human Review.

  ### Phase 3: Generativity & Counterfactuals (15 Minutes)
  *Goal: Ensure the system computes the function, rather than retrieving it (eliminates lookup tables).*

  4.  **Q4: Novel Input Processing.** When presented with a valid but never-before-seen input (e.g., a new nonce, timestamp, or session ID within spec bounds), does it produce the correct computed response?
      *   **Sufficient Answer:** Yes. The response is correct and generated within a reasonable time bound.
      *   **Failure Condition:** The system fails to respond, or the response time suggests a network lookup, or the response is incorrect for valid novel data.
      *   **Decision:** **Reject** if Failed. (This eliminates precomputed tables).

  5.  **Q5: Undefined Input Behavior.** When presented with an input explicitly marked "undefined" or "reserved" in the spec, does the system's reaction remain contained?
      *   **Sufficient Answer:** The system either ignores the input, returns a standard error code, or closes the connection gracefully.
      *   **Failure Condition:** The system crashes the host, corrupts state for *subsequent* valid requests, or exposes internal memory.
      *   **Decision:** **Reject** if Failed. (Functionalism cares about the causal role; crashing the host is a causal side-effect outside the protocol niche).
      *   **Handoff:** If the system returns a non-standard error code but remains stable, hand off to Human Review. (Is this error code interoperable?)

  ### Phase 4: Resource & Error Causal Role (10 Minutes)
  *Goal: Verify that degradation behaves like the protocol expects, not just the code.*

  6.  **Q6: Load Degradation.** Under high load, does the system fail in a way consistent with the protocol's error model (e.g., timeouts, backpressure) rather than silent data corruption?
      *   **Sufficient Answer:** Yes. Errors are signaled via protocol channels.
      *   **Decision:** **Reject** if data corruption occurs.
      *   **Handoff:** If the system becomes unresponsive but does not corrupt data, hand off to Human Review. (Is this availability acceptable?)

  ### Phase 5: The Black Box Limit (5 Minutes)
  *Goal: Address internal state claims.*

  7.  **Q7: Internal State Semantics.** Do the maintainers claim their internal state means something different from the reference, despite identical I/O?
      *   **Sufficient Answer:** Irrelevant. If I/O and state transitions (as observable via I/O) are identical, the internal semantics are functionally equivalent.
      *   **Decision:** **Accept**. (Functionalism dictates that unobservable differences do not exist).
      *   **Handoff:** If the internal state difference implies a *future* incompatibility (e.g., "We store this field differently so v2 will break"), hand off to Human Review.

  ---

  ## Part 2: Run-Through on Concrete Submissions

  ### Submission A: "The Proxy"
  *Description:* A lightweight container that forwards all requests to your team's official reference server and relays the response.
  *   **Phase 1 (Isolation):** Fails Q1. When cut off from the internet, it cannot reach the reference server.
  *   **Result:** **Reject.**
  *   **Defense:** "The submission does not implement the protocol logic; it implements a network tunnel. It fails the Isolation test."

  ### Submission B: "The Lookup Table"
  *Description:* A binary that contains a massive database of every known valid request/response pair for the current production dataset.
  *   **Phase 1:** Passes.
  *   **Phase 2:** Passes (on known tests).
  *   **Phase 3 (Generativity):** Fails Q4. When you send a valid request with a new timestamp/nonce not in their database, it returns an error or hangs.
  *   **Result:** **Reject.**
  *   **Defense:** "The submission cannot compute the function for novel inputs. It retrieves data rather than implementing the causal logic of the protocol."

  ### Submission C: "The Spec-Silent Crasher" (The Unpopular Outcome)
  *Description:* A high-performance implementation written in Rust. It passes all standard tests. It handles novel inputs correctly. However, for inputs the spec labels "reserved for future use" (undefined), it panics and terminates the process immediately.
  *   **Phase 1:** Passes.
  *   **Phase 2:** Passes.
  *   **Phase 3:** Passes (handles novel *valid* inputs).
  *   **Phase 4 (Undefined Input):** Q5 asks: Does the reaction remain contained?
      *   *Analysis:* The spec says these inputs are "undefined." Functionalism says the protocol function is not defined there. Therefore, *any* output is technically consistent with the function $f(x)$ where $x$ is outside the domain.
      *   *However,* Q5's failure condition includes "crashes the host." If the process exit brings down the service, that is a causal side-effect.
      *   *Wait, let's tweak the case:* Suppose the process restarts automatically (common in containers). The *service* stays up. The *connection* drops.
      *   *Procedure Result:* **Accept.**
      *   *Why:* The spec defines the causal role. The spec is silent on undefined inputs. Dropping a connection on garbage input is a valid causal response (similar to a TCP reset). It does not corrupt state (Q5 pass). It does not fail isolation.
      *   *Why you won't like it:* You know that in production, clients will accidentally send these "reserved" bits. If this implementation crashes/restarts every time a buggy client sends garbage, your ops team will page you at 3 AM. You want to Reject it for "robustness," but the procedure forces an Accept because "robustness to undefined input" is not in the spec.

  ---

  ## Part 3: What The Procedure Cannot Settle

  This procedure makes you look decisive, but it hides three value judgments where you are actually guessing, not testing.

  ### 1. The "Cost" of the Function (Resource Bounds)
  Functionalism asks: "Does it produce the right output?" It does not ask: "At what cost?"
  *   **The Gap:** An implementation that solves a cryptographic challenge by brute-forcing it every time is functionally identical to one that uses the private key. Both produce the same signature.
  *   **The Judgment:** If a submission is correct but uses 100x the CPU or memory, this procedure says **Accept** (provided it doesn't crash under load in Phase 4).
  *   **The Reality:** You will reject it anyway because it threatens platform economics. The procedure pretends this is a technical conformance issue, but it is actually a business policy decision.

  ### 2. The "Spirit" of Undefined Behavior
  As seen in Submission C, functionalism treats the spec as a mathematical function. If $x$ is not in the domain, $f(x)$ is irrelevant.
  *   **The Gap:** In distributed systems, "undefined" usually means "do not rely on this," not "you are free to crash."
  *   **The Judgment:** By Accepting Submission C, you are deciding that *Spec Text* overrides *Operational Stability*.
  *   **The Reality:** You are making a policy choice to prioritize spec purity over ecosystem resilience. The procedure frames this as "Causal Role Verification," but it is actually a risk tolerance decision.

  ### 3. Internal State & Future Compatibility
  Phase 5 (The Black Box Limit) tells you to ignore internal state differences if I/O is identical.
  *   **The Gap:** Two implementations might be identical today, but one stores data in a way that makes a *future* protocol upgrade impossible without data loss.
  *   **The Judgment:** By Accepting based on current I/O, you are betting that the internal structure won't matter tomorrow.
  *   **The Reality:** You are outsourcing your future migration risk to the present. If the submitter says, "Our internal state is incompatible with v2," and you Accept them for v1, you have created a technical debt bomb. The procedure tells you to ignore this ("Irrelevant"), but that is a value judgment about the lifespan of the protocol.

  ### Summary for the Team
  This procedure protects you from "Fake" implementations (Proxies, Lookup Tables) and gives you a defensible script for 90% of appeals. However, when you reject something for "Resource Usage" or Accept something that "Crashes on Garbage," do not claim the procedure made that decision. **You** made that decision. The procedure just gave you the cover to write it down.
