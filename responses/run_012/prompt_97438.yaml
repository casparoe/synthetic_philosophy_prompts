      *   *Provocation 2 (Informational Limits):* This challenges the "weak judge" assumption. It's not just that the judge is slower; it's that the judge lacks the *context* to evaluate. This makes distributional shift the killer. *Verdict: Critical Reframing.*

  4.  **Develop the Defended Agenda (The "Memo"):**
