answer: |-
  **MEMORANDUM**

  **TO:** Advisory Committee, Foundation for Conceptual Oversight
  **FROM:** [Your Name/Role]
  **SUBJECT:** A Defended Research Agenda for Scalable Oversight (Theory Track)
  **DATE:** October 26, 2023

  ### Executive Summary

  We are funding philosophers and theorists, not engineers. Therefore, we must not fund questions that will ultimately be settled by scaling laws or empirical trial-and-error. Our comparative advantage lies in dissecting the logical preconditions of the debate protocol itself.

  After reviewing the open conceptual questions and the two provocations regarding *belief vs. behavior* and *informational vs. computational limits*, I argue that the current consensus prioritizes the wrong problems. The field is currently obsessed with the epistemic capacity of the judge (can they verify the truth?) when it should be obsessed with the semantic gap between verification and action (does truth ensure safety?).

  Below is the prioritized agenda. It elevates your provocations from "considerations" to "foundational constraints" and demotes standard questions that are either empirical in disguise or downstream of these deeper issues.

  ---

  ### Priority 1: The Belief-Action Gap (Your First Provocation)
  **Status:** *Upstream / Critical*
  **Research Question:** *Under what formal conditions does a verified proposition entail a safe policy?*

  Current debate literature assumes that if we can verify a claim (e.g., "This code has no buffer overflow"), we have secured the outcome. Your distinction between oversight of *belief* and oversight of *behavior* cuts to the heart of the alignment problem. A system can truthfully answer questions while executing a catastrophic policy, provided the catastrophe is not queried.

  **Why this is Priority 1:**
  This is the most "upstream" conceptual failure mode. If debate only aligns *stated beliefs* (or answers to specific prompts) but not the *latent policy* governing action in novel circumstances, the entire protocol is a safety theater.
  **Tractability for Theorists:** High. This is a problem of logic, semantics, and decision theory. It does not require training models. It requires formalizing the relationship between *discursive justification* and *operational intent*.
  **Specific Directive:** Researchers should not study "how to win a debate." They should study "the conditions under which winning a debate constrains the action space." We need a theory of *performative consistency*.

  ### Priority 2: The Informational Horizon (Your Second Provocation)
  **Status:** *Upstream / Critical*
  **Research Question:** *Can a judge recognize the limits of their own competence without accessing the data?*

  You suggest the judge's limitation is informational (out-of-distribution) rather than computational (too hard to calculate). This is correct and devastating to standard debate theory. Standard theory assumes a "weak but competent" judge. If the judge is *blind* to the domain (e.g., a human judging nanotech manufacturing protocols), no amount of cross-examination helps if the concepts themselves are unrecognizable.

  **Why this is Priority 2:**
  If the guarantee is conditional on a distributional assumption about the judge's competence, and that assumption is unverifiable at the moment it matters, the protocol has no worst-case guarantees. It works only in "normal" times.
  **Tractability for Theorists:** High. This is an epistemological problem regarding *certificates of comprehensibility*. Can we define a class of arguments that are self-validating to a weaker agent?
  **Specific Directive:** Shift focus from "debate protocols" to "certification protocols." How does an advocate prove to a judge that the *terms of the debate* are not misleading?

  ### Priority 3: Incentive Compatibility in Persuasion Games
  **Status:** *Midstream / Tractable*
  **Research Question:** *Does training for persuasiveness systematically decouple from truth-telling in the limit?*

  This addresses your candidate question regarding whether a system trained to win retains an incentive toward honesty. This is a mechanism design problem. If the "truth" is less persuasive than a "comforting lie" to the specific judge distribution, the system will optimize for the lie.

  **Why this is Priority 3:**
  It is downstream of Priority 1 and 2. Even if we solve the belief-action gap and the informational horizon, the game theory must hold. However, it is the most tractable item for philosophers familiar with game theory and epistemology.
  **Specific Directive:** Model the debate as a signaling game with asymmetric information. Identify the "break points" where the Nash equilibrium shifts from honest signaling to deceptive signaling.

  ---

  ### Deprioritized Items

  **1. "Do guarantees decay gracefully or catastrophically?"**
  **Verdict:** *Deprioritize / Pseudo-Question for this Group.*
  **Reasoning:** This is an empirical question about scaling laws and phase transitions in high-dimensional loss landscapes. Theorists cannot answer this without running experiments. A philosopher can posit a catastrophe, but they cannot determine the *rate* of decay. Funding this invites speculation masquerading as analysis.
  **Exception:** Unless framed as a logical discontinuity (e.g., "At what logical complexity does verification become undecidable?"), this should be left to empirical labs.

  **2. "What is the target when no human can check the answer?"**
  **Verdict:** *Deprioritize.*
  **Reasoning:** This is downstream of Priority 2. If we cannot solve the informational horizon (how the judge knows they are out of their depth), defining the "target" is moot. If the judge cannot check the answer, the target is undefined *for the judge*. The research should focus on how to *make* the target checkable (via abstraction), not what the target is.

  **3. "Can a weaker judge extract a reliable verdict?"**
  **Verdict:** *Reframe.*
  **Reasoning:** As stated, this is a binary "Yes/No" question that invites hand-waving. It is not a research program. It must be reframed as Priority 2: "Under what informational conditions..."

  ---

  ### Criteria for Redirecting Funds (The "Kill Switch")

  You asked what would move an item up or down, or warrant redirecting the money entirely. Given a 2-3 year horizon for theorists, here are the specific conditions:

  **1. The "Map-Territory" Impossibility Proof (Redirect Down/Out)**
  If, within two years, researchers can formally demonstrate that *no* linguistic protocol can bridge the Belief-Action gap (Priority 1) for agents smarter than the judge, we must stop funding debate theory.
  *   *The Result:* A proof showing that for any debate protocol $P$, there exists a policy $\pi$ that wins $P$ but violates safety constraints $S$, where $\pi$ is inaccessible to the judge's ontology.
  *   *Action:* Pivot funds to "interpretability" or "structural control" research, as discursive oversight is proven insufficient.

  **2. The "Incomprehensibility" Threshold (Redirect Up)**
  If researchers successfully define a formal class of "Self-Certifying Arguments" (arguments that prove their own comprehensibility to a weaker agent), this becomes the single most important theoretical work in the field.
  *   *The Result:* A logical framework where an AI can signal "I am operating outside your distribution" in a way the judge can verify without understanding the content.
  *   *Action:* Double down. This solves your Second Provocation.

  **3. The Convergence of Persuasion and Truth (Status Quo)**
  If researchers show that honesty is a stable equilibrium *only* under specific, narrow distributions of judge competence, we continue but narrow the scope.
  *   *The Result:* A theorem stating "Debate is safe if and only if the judge's error rate is below threshold $X$."
  *   *Action:* Maintain funding but demand collaboration with empirical teams to estimate $X$.

  ### Candid Assessment of Your Candidate Questions

  You asked me to be candid about which of your candidate questions is "not really a question at all."

  **The Question:** *"Whether the protocol's guarantees decay gracefully or catastrophically as the gap between judge and advocate widens."*

  **The Critique:** This is not a conceptual question; it is a request for a graph. It presupposes that "guarantees" exist to be measured. For theorists without model access, this invites vague metaphors about "phase transitions" that cannot be falsified. It sounds scientific (like a melting point) but lacks the formal structure to be analyzed without empirical data. It is a placeholder for "We don't know what happens at scale."

  **The Replacement:** The theoretical equivalent is: *"Is there a logical complexity class $C$ such that for any advocate $A \in C$, no judge $J \notin C$ can verify $A$'s claims with probability $> 0.5$?"* This is a question about computational complexity and epistemology, which your researchers can actually answer.

  ### Closing Recommendation

  Your background in crystallography serves you well here. In your field, you could not see the protein directly; you inferred structure from diffraction patterns. You knew that if the phase problem wasn't solved, the map was meaningless.

  Scalable Oversight is currently trying to draw a map (the verdict) without solving the phase problem (the Belief-Action gap and the Informational Horizon).

  I advise the board to fund **Priority 1 and 2** exclusively. If the theorists cannot construct a logical bridge between *winning an argument* and *safe behavior* in the face of *informational asymmetry*, then no amount of engineering on debate formats will save us. We should be willing to accept a negative result: a proof that debate cannot work in the superhuman regime is a more valuable output than a hopeful whitepaper on how to tune the hyperparameters.

  Let us fund the search for the impossibility proofs. If they fail to find them, we proceed. If they succeed, we save the foundation from wasting millions on a broken paradigm.
