          2.  The Core Distinction (Addressing Provocation 1).
          3.  The Epistemic Bottleneck (Addressing Provocation 2 & Question 1).
          4.  The Incentive Structure (Addressing Question 2).
          5.  Deprioritized Items (Addressing Question 4 & others).
          6.  Criteria for Success/Failure (The "Redirect" condition).
      *   *Tone:* Respectful of the user's scientific background (analogy to crystallography/structure), direct, philosophical but actionable.

  5.  **Drafting - Section by Section:**

      *   *Introduction:* Acknowledge the user's position. State the goal: A research agenda for *theorists*, not engineers.
