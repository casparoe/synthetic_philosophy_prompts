prompt: |-
  I chair the consent review subcommittee at a mid-sized academic medical center. We review roughly twenty protocols a week — interventional trials, biobank and data-use proposals, and a growing number of studies that recruit through the hospital's patient portal — and we have to reach a validity call on each within a few days, sometimes on a single pass through a consent form and a recruitment script. My reviewers are clinicians, nurses, and two community members; none of them is a philosopher; their decisions gate whether a study opens; and anything they cannot settle comes to me, with the full board hearing appeals. I want to hand them a reusable procedure, not a seminar.

  The board has been arguing about the same questions for years and has converged on a working set of distinctions that the procedure should preserve. Treat these as fixed starting points rather than things to relitigate:

  - Consent can fail at the level of the act (what was actually agreed to), the level of the process (how the agreement was obtained), or the level of the person (whether this person could authorize this particular decision at this time). A form that is flawless at one level can be void at another.
  - Coercion requires a threat, and a threat requires that the person be made worse off relative to some baseline. The choice of baseline — what they would have had without us, what they are entitled to, or the status quo — does most of the work in every hard case, and we have never agreed on which baseline to use.
  - An offer cannot coerce, but it can be an undue inducement, and the tests differ: coercion is about the wrongness of the pressure, undue inducement is about whether the offer distorts judgment or exploits a bad situation.
  - Deception comes in kinds: about the nature of what is being done, about its consequences, about the alternatives, and mere non-disclosure of something the person would want to know. The last is the one our forms keep sliding past.
  - Competence is decision-relative, not global. The same person may be able to authorize a blood draw and not a washout of their current medication.
  - Legal validity and moral validity can come apart, and when they do, we want to know which one the procedure is tracking.

  What I want from you is the procedure itself, in a form a non-philosopher can run at a desk in fifteen minutes:

  1. The questions to ask, in order, with the order justified — which question must be settled before which, and why.
  2. For each question, what counts as a sufficient answer and what counts as a red flag that stops the review rather than merely being noted.
  3. The point at which the procedure returns a hard no, and the point at which it must hand the decision to a person because the remaining question is a value judgment rather than a fact. Mark the latter explicitly; my reviewers keep treating those as if they were factual.
  4. Any test you build in that a form can pass while the consent is still hollow — valid on paper and worthless in practice — and what the procedure should do about that, if anything.

  Then run the procedure on three cases and show your work at each step:

  (a) A Phase I study paying healthy volunteers $2,000 for ten inpatient days, in a city where $2,000 is roughly a month's take-home pay for the population being recruited.
  (b) A cancer trial in which the trial drug is free and the standard-of-care drug is not, recruiting patients whose own oncologist is also the site investigator.
  (c) A portal-based study that tells participants it concerns health and mood but is actually measuring whether people with a given diagnosis respond differently to one message framing versus another, with debriefing at the end.

  For each case, say where the procedure lands, what it cannot settle, and — where the procedure's answer differs from what a thoughtful reviewer would want — say so plainly instead of smoothing it over.

  Close with a short section on where the procedure will misfire: the cases it will pass that should have been stopped, the cases it will stop that should have passed, and which of the distinctions above it flattens in the course of becoming usable. Write the whole thing in American English, as a document I can hand to the subcommittee rather than an essay about consent.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Chair of a consent review subcommittee at a mid-sized academic medical center.
      *   **Task:** Create a reusable, 15-minute desk procedure for reviewers (clinicians, nurses, community members, not philosophers) to assess consent validity.
      *   **Constraints/Starting Points:** Must preserve specific philosophical distinctions provided by the user (Act/Process/Person, Coercion/Threat/Baseline, Offer/Undue Inducement, Types of Deception, Decision-Relative Competence, Legal vs. Moral Validity).
      *   **Deliverables:**
          1.  The Procedure (Questions in order with justification, Sufficient Answers vs. Red Flags, Hard No vs. Value Judgment handoff).
          2.  Tests for "Valid on Paper, Hollow in Practice."
          3.  Application to three specific cases (Phase I payment, Cancer trial cost/therapeutic misconception, Portal-based deception).
          4.  Limitations section (Where it misfires, what it flattens).
      *   **Tone/Style:** American English, practical document (not an essay), direct, usable by non-philosophers.

  2.  **Deconstruct the Starting Points (The "Fixed Distinctions"):**
      *   *Act/Process/Person:* Need to check capacity (Person), then understanding/agreement (Act), then how it was got (Process). Actually, logically, Person (Capacity) usually comes first because if they can't consent, the rest doesn't matter. But for *protocol review* (before recruitment), we are assessing the *potential* for valid consent. So we assess the *design* for Process and Act, and the *eligibility criteria* for Person.
      *   *Coercion/Threat/Baseline:* This is the trickiest. The prompt admits the board hasn't agreed on a baseline. The procedure needs a heuristic that works *without* resolving the philosophical debate. Focus on "Worse off than entitlement" vs. "Worse off than status quo."
      *   *Offer/Undue Inducement:* Distinguish pressure (coercion) from distortion (inducement).
      *   *Deception:* Specific vs. Non-disclosure.
      *   *Competence:* Decision-relative.
      *   *Legal vs. Moral:* Need to flag when something is legally okay but morally dubious.

  3.  **Drafting the Procedure (The "15-Minute Desk Tool"):**
      *   *Ordering:*
          1.  **Person (Capacity/Eligibility):** Can *this* population legally and cognitively consent? (Stops review immediately if no).
          2.  **Act (Disclosure/Understanding):** Is the information complete and accurate? (Deception check).
          3.  **Process (Voluntariness/Pressure):** Is the agreement free from threats or distorting offers? (Coercion/Inducement).
          4.  **Validity Check (Legal vs. Moral):** Does this pass the "Smell Test"?
      *   *Justification:* Capacity is the gateway. Disclosure is the content. Voluntariness is the context. Moral/Legal is the safety valve.
      *   *Red Flags vs. Sufficient Answers:* Need concrete criteria.
      *   *Hard No vs. Value Judgment:* This is crucial. Reviewers treat value judgments as facts. I need to explicitly mark where the protocol goes to the Chair/Full Board.

  4.  **Refining the "Hollow Consent" Test:**
      *   Forms can be perfect, but the situation makes consent impossible (e.g., emergency, power differential).
      *   Need a "Contextual Reality Check."

  5.  **Running the Cases:**
      *   *Case A (Phase I Payment):* High payment relative to income.
          *   *Issue:* Undue Inducement vs. Fair Payment.
          *   *Procedure Outcome:* Likely passes Legal, flags Moral/Value Judgment on inducement.
      *   *Case B (Cancer Trial/Cost/Oncologist):* Therapeutic misconception + Cost coercion + Power differential.
          *   *Issue:* Coercion (baseline of care) + Undue Inducement (free drug) + Process (Investigator is doctor).
          *   *Procedure Outcome:* High risk of Red Flags on Process and Act (misconception).
      *   *Case C (Portal Deception):* Minimal risk but deception about purpose.
          *   *Issue:* Deception (Nature/Consequences) + Waiver of Consent.
          *   *Procedure Outcome:* Passes if waiver criteria met, but flags Non-disclosure.

  6.  **Addressing the "Misfire" Section:**
      *   Where will this fail?
      *   It flattens the "Baseline" debate (as requested, but needs acknowledgment).
      *   It might miss systemic coercion (poverty).
      *   It might over-rely on forms rather than interactions.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is the ordering logical for *protocol review*?
      *   *Correction:* In protocol review, we aren't testing the patient. We are testing the *mechanism* for assessing the patient. So Question 1 isn't "Is the patient competent?" it's "Does the protocol exclude those who cannot consent and require assessment for those on the boundary?"
      *   *Critique:* The prompt asks to preserve the baseline distinction but admits no agreement.
      *   *Correction:* The procedure must force the reviewer to *state* the baseline they are using, rather than hiding it. This makes the disagreement visible without stopping the work.
      *   *Critique:* Distinguish Legal vs. Moral.
      *   *Correction:* Add a specific "Compliance vs. Ethics" toggle at the end.
      *   *Tone Check:* Ensure it sounds like a SOP (Standard Operating Procedure), not a philosophy paper. Use bolding, boxes, and clear "STOP" indicators.

  8.  **Final Review against Constraints:**
      *   15-minute usability? Yes, if streamlined.
      *   Preserves distinctions? Yes (Act/Process/Person, Coercion/Inducement, etc.).
      *   Three cases run? Yes.
      *   Misfire section? Yes.
      *   American English? Yes.

  9.  **Drafting the Content:** (Mental outline of the document structure)
      *   Header: SUBCOMMITTEE CONSENT VALIDITY CHECKLIST (SCVC-1)
      *   Introduction: Purpose & Scope.
      *   Section 1: The Decision Tree (Questions 1-4).
      *   Section 2: The "Hollow Consent" Stress Test.
      *   Section 3: Case Applications (A, B, C).
      *   Section 4: Known Limitations & Failure Modes.

      *(Self-Correction on Case B)*: The prompt says standard-of-care is *not* free, trial drug *is* free. This is a classic "undue inducement" or "coercion by circumstance" scenario. The procedure needs to catch the financial threat aspect.
      *(Self-Correction on Case C)*: Portal study. Deception is central. Is it waived consent? The procedure needs to handle waiver criteria.

      *(Refining the "Value Judgment" Handoff)*: I need to make sure reviewers know when to stop and call the Chair. This happens when the "Baseline" for coercion is ambiguous or when Moral validity diverges from Legal.

      *(Final Polish)*: Ensure the distinction between "Act, Process, Person" is explicit in the headers.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # SUBCOMMITTEE CONSENT VALIDITY CHECKLIST (SCVC-1)
  **For Internal Review Use Only**  
  **Time Allocation:** 15 Minutes per Protocol  
  **Authority:** Consent Review Subcommittee Chair

  ## PURPOSE
  This procedure is not a philosophical inquiry. It is a triage tool. Its goal is to separate protocols that are **procedurally defective** (Hard No) from those that are **ethically contested** (Chair/Board Review). It preserves the board's working distinctions without requiring reviewers to resolve them.

  ## INSTRUCTIONS
  Complete the four sections in order. Do not skip ahead. If a **RED FLAG** is triggered, stop the review and mark the protocol as "Deferred to Chair." If a **VALUE JUDGMENT** is reached, mark "Deferred to Full Board."

  ---

  ## SECTION 1: THE PERSON (Capacity & Eligibility)
  *Justification: Consent is impossible if the agent cannot authorize the decision. This must be settled before assessing the form or the offer.*

  **Q1. Does the protocol exclude populations legally or cognitively unable to consent to *this specific decision*?**
  *   **Sufficient Answer:** Yes. The protocol explicitly excludes children, prisoners, or cognitively impaired adults *unless* a surrogate mechanism is defined and justified. For borderline cases (e.g., dementia, acute distress), the protocol requires a formal capacity assessment tool.
  *   **RED FLAG (Stop):** The protocol assumes capacity based solely on signature, or recruits a vulnerable population (e.g., emergency room patients) without a waiver of consent or surrogate provision approved by the IRB.
  *   **Note on Competence:** Competence is decision-relative. A protocol involving high-risk medication washout requires a higher threshold of capacity assessment than a protocol involving a survey.

  **Q2. Is the assessment of capacity proportional to the risk/complexity of the study?**
  *   **Sufficient Answer:** Yes. High-risk interventions include a "teach-back" method or cognitive screen. Low-risk surveys do not.
  *   **RED FLAG (Stop):** High-risk intervention with no planned verification of understanding.

  ---

  ## SECTION 2: THE ACT (Disclosure & Deception)
  *Justification: An agreement is void if the agent does not know what they are agreeing to. We distinguish between active deception and non-disclosure.*

  **Q3. Does the consent form or script actively misrepresent the nature, consequences, or alternatives of the study?**
  *   **Sufficient Answer:** No. The description matches the protocol design.
  *   **RED FLAG (Stop):** Active lying about procedures (e.g., calling a research biopsy "routine care").
  *   **Value Judgment Handoff:** If the study involves **blinding or placebo**, note that this is not deception *if* disclosed. If the study involves **concealment of the true hypothesis** (e.g., Case C), proceed to Q4.

  **Q4. Is there non-disclosure of information a reasonable person would want to know?**
  *   **Sufficient Answer:** No. All material risks and the right to withdraw are stated.
  *   **RED FLAG (Stop):** Withholding information about commercial profit, data sharing with third parties, or significant discomfort not related to clinical outcome.
  *   **Value Judgment Handoff:** If the protocol requests a **Waiver of Consent** or **Alteration of Consent** (e.g., for deception studies), this is not a Hard No, but it **must go to the Full Board**. Reviewers cannot approve waivers of informed consent elements.

  ---

  ## SECTION 3: THE PROCESS (Voluntariness, Coercion, & Inducement)
  *Justification: Even a competent person with full information cannot consent if the agreement is forced or judgment is distorted. This is where baseline disputes occur.*

  **Q5. Is there a threat that makes the participant worse off relative to their entitlements? (Coercion Check)**
  *   **Test:** If the patient says "No," do they lose access to care, benefits, or rights they are otherwise entitled to?
  *   **Sufficient Answer:** No. Refusal results in standard care or status quo.
  *   **RED FLAG (Stop):** Implicit or explicit threat that clinical care will be compromised by non-participation.
  *   **Value Judgment Handoff:** If the "Entitlement" is unclear (e.g., is access to an experimental drug an entitlement?), **mark for Chair Review**. Do not argue the baseline; flag the ambiguity.

  **Q6. Is there an offer that might distort judgment? (Undue Inducement Check)**
  *   **Test:** Is the benefit (payment, free drug) so large that it blinds the participant to the risks?
  *   **Sufficient Answer:** Payment is prorated for time/burden. Free drugs are standard for trials where the comparator is usually paid by insurance.
  *   **RED FLAG (Stop):** Payment contingent on *completion* of the study (coercive retention) rather than participation.
  *   **Value Judgment Handoff:** If the payment exceeds 1.5x local median daily wage (e.g., Case A), or if the "free drug" replaces a costly standard of care (e.g., Case B), **mark for Full Board**. This is a moral judgment on exploitation, not a factual error.

  ---

  ## SECTION 4: VALIDITY & CONTEXT (The "Hollow Consent" Test)
  *Justification: A form can be legally valid and morally hollow. This section captures the gap between compliance and ethics.*

  **Q7. Does the context make the signature meaningless despite the form's quality?**
  *   **Test:** Power differentials, acute pain, language barriers, or institutional dependency.
  *   **Sufficient Answer:** An independent recruiter (not the treating physician) is used, or a cooling-off period is provided.
  *   **RED FLAG (Stop):** The treating physician is the sole recruiter for a high-risk trial with no independent advocate.
  *   **Value Judgment Handoff:** If the protocol is **Legally Compliant** but feels **Morally Aggressive** (e.g., recruiting from a waiting room of desperate patients), check the box: **"Legal Validity: YES / Moral Validity: CONTESTED."** Send to Chair.

  ---

  ## DECISION MATRIX

  | Result | Action |
  | :--- | :--- |
  | **Any RED FLAG** | **STOP.** Return to Investigator for revision. Do not approve. |
  | **Any VALUE JUDGMENT** | **DEFER.** Send to Chair/Full Board. Note the specific ethical tension. |
  | **All Sufficient** | **APPROVE.** Consent mechanism is valid. |

  ---

  # CASE APPLICATIONS

  ### Case A: Phase I Study ($2,000 for 10 Days)
  *Context: Payment equals one month's take-home pay for the recruitment population.*

  **Step 1 (Person):** Population is healthy adults. Capacity assumed. **Pass.**
  **Step 2 (Act):** Risks of Phase I (unknown side effects) disclosed. **Pass.**
  **Step 3 (Process - Coercion):** No threat of loss of entitlements if they refuse. **Pass.**
  **Step 3 (Process - Inducement):** Payment is high relative to local income.
  *   *Procedure Check:* Does payment exceed 1.5x median wage? Likely yes.
  *   *Result:* **Value Judgment Handoff.**
  *   *Reasoning:* The procedure cannot determine if $2,000 is "undue." That depends on whether we view the baseline as "market rate for time" or "potential to blind risk."
  **Step 4 (Context):** Inpatient stay limits outside employment, making the $2,000 effectively a salary replacement.
  *   *Result:* **Legal Validity: YES / Moral Validity: CONTESTED.**

  **Final Landing:** Deferred to Full Board.
  **Reviewer Note:** "Protocol passes legal thresholds for payment. However, the ratio of payment to local income creates a risk of undue inducement. Board must decide if this exploits economic vulnerability."

  ### Case B: Cancer Trial (Free Drug vs. Costly Standard of Care)
  *Context: Patient's oncologist is the Investigator. Standard drug costs money; Trial drug is free.*

  **Step 1 (Person):** Patients are ill but presumed competent. **Pass.**
  **Step 2 (Act):** Therapeutic misconception risk. Does the form distinguish research from care?
  *   *Procedure Check:* If the form implies the trial drug is "better" or "guaranteed treatment," **RED FLAG.** Assuming form is accurate: **Pass.**
  **Step 3 (Process - Coercion):** Refusal means paying for standard care. Acceptance means free care.
  *   *Procedure Check:* Is the patient worse off relative to entitlements if they say no? Yes, they lose financial relief available only through the trial.
  *   *Result:* **Value Judgment Handoff.** (Is free access to medicine an entitlement? The board has no agreed baseline).
  **Step 3 (Process - Inducement):** The "free drug" is a massive financial offer.
  *   *Result:* **Value Judgment Handoff.**
  **Step 4 (Context):** Recruiter is the Treating Physician.
  *   *Procedure Check:* Q7 (Power Differential).
  *   *Result:* **RED FLAG.** The treating physician is the sole recruiter. Patients may fear clinical retaliation if they refuse.

  **Final Landing:** **STOP (Red Flag).**
  **Reviewer Note:** "Protocol cannot proceed without an independent recruiter. The financial disparity between trial and standard care creates a coercive baseline that requires Board review, but the physician-investigator conflict is a procedural failure."

  ### Case C: Portal Study (Deception on Message Framing)
  *Context: Participants told study is about 'health and mood'; actually testing message framing. Debriefing at end.*

  **Step 1 (Person):** Portal users. **Pass.**
  **Step 2 (Act):** Active deception about the *nature* of the study (hypothesis).
  *   *Procedure Check:* Q3 (Active Misrepresentation).
  *   *Result:* **Value Judgment Handoff.** Deception is present. This requires a Waiver of Consent elements. Reviewers cannot approve waivers.
  **Step 2 (Act - Non-disclosure):** Q4. Participants are not told they are being tested for response bias.
  *   *Result:* **Value Judgment Handoff.**
  **Step 3 (Process):** No financial threat or inducement. **Pass.**
  **Step 4 (Context):** Minimal risk. Debriefing provided.
  *   *Result:* **Legal Validity: YES (if waiver granted) / Moral Validity: CONTESTED.**

  **Final Landing:** Deferred to Full Board (for Waiver approval).
  **Reviewer Note:** "Protocol relies on deception regarding study purpose. This is permissible only with a Waiver of Informed Consent. Subcommittee cannot grant waivers. Board must weigh the scientific necessity of deception against the violation of transparency."

  ---

  # LIMITATIONS & FAILURE MODES

  **Where This Procedure Will Misfire**

  1.  **The "Compliant but Exploitative" Pass:**
      *   *Failure:* The procedure will approve protocols that meet all regulatory criteria (45 CFR 46) but exploit systemic desperation (e.g., recruiting homeless populations for Phase I trials where payment is their only income).
      *   *Reason:* The "Value Judgment Handoff" relies on the Board to catch this. If the Board rubber-stamps the Chair's recommendations, the procedure validates exploitation.
      *   *Flattened Distinction:* **Legal vs. Moral Validity.** The procedure flags the divergence but cannot resolve it. It treats moral validity as a "referral" rather than a veto.

  2.  **The "Baseline" Blind Spot:**
      *   *Failure:* In Case B (Cancer Trial), the procedure flags the financial coercion but cannot determine if it is *unjust*. One reviewer may see "free care" as a benefit; another may see "paying for standard care" as a threat.
      *   *Reason:* We preserved the distinction that "Coercion requires a threat," but we did not solve the "Baseline" problem. The procedure forces the disagreement into the open (Handoff) but does not solve it.
      *   *Flattened Distinction:* **Coercion Baselines.** The procedure treats the baseline ambiguity as an administrative hurdle rather than a philosophical error.

  3.  **The "Form Over Function" Error:**
      *   *Failure:* A protocol can pass Q7 (Context) on paper (e.g., "Independent recruiter assigned") but fail in practice (e.g., the independent recruiter is a junior fellow dependent on the PI).
      *   *Reason:* This is a desk review. We review documents, not interactions.
      *   *Flattened Distinction:* **Act vs. Process.** We assume the Process (recruitment) matches the Document (script). If the site deviates, this procedure will not catch it until an audit or adverse event.

  4.  **The "Hollow Consent" Gap:**
      *   *Failure:* The procedure may approve a consent process that is technically valid but practically impossible for the population (e.g., a 20-page form for patients in acute pain).
      *   *Reason:* Q1 checks for capacity exclusion, but not for *situational* incapacity (pain, stress).
      *   *Mitigation:* Reviewers must apply the "Reasonable Person" standard in Q4 strictly. If a reasonable person in that clinical state could not read the form, it is a Red Flag.

  **Instruction to Reviewers:**
  If you feel a protocol is "wrong" but you cannot find a Red Flag in the checklist, **do not approve it.** Mark it as "Moral Validity: Contested" and send it to the Chair. This procedure is a floor, not a ceiling. Your judgment is the final safety mechanism.
