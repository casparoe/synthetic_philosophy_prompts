answer: |-
  The Liar paradox arises from the assumption that truth is a metaphysical property that sentences possess independently of our linguistic practices. If truth is a property, the sentence "This sentence is false" appears to describe a state of affairs that must either obtain or fail to obtain, leading to contradiction. I argue that the paradox is best resolved by rejecting this property-theoretic picture in favor of a normative one: truth is not a property propositions bear, but the constitutive norm governing the speech act of assertion. To assert is to present a proposition as true; therefore, truth is the standard of correctness for assertion.

  However, to handle the "Revenge" challenges, specifically what I will call the **Normative Liar**, we must refine this view. We cannot simply identify truth with assertibility. Instead, we must defend a distinction between a proposition's **truth** (its satisfaction of the constitutive norm) and the **warrant for asserting it** (the speaker's epistemic right to perform the act). By locating the paradox in the pragmatics of assertion rather than the semantics of truth, we can dissolve the contradiction without abandoning classical logic for ordinary discourse or positing ontological truth-value gaps.

  ### The Distinction: Truth vs. Warrant

  On the normative view, the predicate "is true" functions to endorse a proposition for assertion. However, endorsement requires two components: the objective correctness of the content and the subjective authority of the speaker.

  1.  **Truth (Correctness):** A proposition is true if it meets the constitutive norm of assertion. In standard cases, this aligns with how the world is. Truth is the *aim* of assertion.
  2.  **Warrant (Permission):** Warrant is the epistemic status of the speaker. One has warrant to assert $P$ only if one has sufficient evidence or justification to take responsibility for $P$'s truth.

  In ordinary cases, these align: we assert what we have warrant for, aiming at truth. But they can come apart. One might assert a true proposition without warrant (a lucky guess), or a warranted proposition that is false (an understandable error). The Liar paradox exploits the tension between these two. The classical Liar ("This sentence is false") attempts to use the truth predicate to sabotage the condition of its own correctness. The Normative Liar attempts to sabotage the condition of its own permission.

  ### The Normative Liar

  Consider the sentence $N$: **"$N$ is not warranted for assertion."**

  If we treat truth merely as a property, $N$ generates a paradox similar to the classical Liar. If $N$ is true, then it is not warranted. If it is not warranted, can we assert it? If we cannot assert it, does that make it true?

  On the normative view, $N$ is not a paradox of truth, but a **pragmatic contradiction**. To assert $N$ is to perform a speech act that presents $N$ as correct to assert. However, the content of $N$ explicitly denies that there is a warrant for asserting it.

  1.  **The Act of Assertion:** When I assert $N$, I implicitly claim, "I have warrant to assert $N$."
  2.  **The Content of $N$:** $N$ states, "There is no warrant to assert $N$."

  Therefore, asserting $N$ generates a Moore-paradoxical situation: "I have no warrant to assert this, and I am asserting it." The contradiction does not arise in the world (as a metaphysical impossibility) but in the performance of the speech act. The sentence $N$ is **self-defeating**.

  Is $N$ true? Yes. It is indeed the case that $N$ is not warranted for assertion, precisely because asserting it involves a pragmatic contradiction.
  Is $N$ assertible? No. Because to assert it is to violate the norm of warrant.

  This resolves the paradox by blocking the inference from **Truth** to **Assertibility**. In a property-based view, if a sentence is true, it seems it *ought* to be assertible. In the normative view, Truth is the *standard* of assertion, but Warrant is the *gatekeeper*. $N$ satisfies the standard (it is true that it lacks warrant) but fails the gatekeeping condition (you cannot responsibly assert that you lack responsibility). Thus, $N$ is a true sentence that is permanently barred from assertion. There is no contradiction here, only a restriction on linguistic performance.

  ### Logical Costs: Restricting the T-Schema

  Adopting this view requires sacrificing certain logical principles, specifically the unrestricted **T-Schema** ($P \leftrightarrow \text{'P is true'}$).

  In classical semantics, if $P$ is the case, then "$P$ is true" follows, and vice versa. The normative view must reject T-Introduction for sentences that violate the norms of assertion. We cannot infer "$N$ is true" from $N$ in a way that licenses the assertion of "$N$ is true."

  Why? Because "$N$ is true" functions as an endorsement. If $N$ is "I am not warranted," then endorsing $N$ ("$N$ is true") is equivalent to asserting $N$. Since asserting $N$ is pragmatically contradictory, endorsing it as true is likewise defective. We must accept that there are meaningful sentences for which the T-Schema fails to license assertion.

  This is a significant cost, but it is localized. It applies only to pathological, self-referential sentences that target the norms of their own utterance. For all non-pathological discourse, classical logic and the T-Schema remain fully intact. We do not need to revise logic for mathematics or science; we only need to recognize that the truth predicate has a pragmatic function that can be misused.

  ### Superiority to Rival Views

  This normative resolution is preferable to the two dominant rivals: **Truth-Value Gap** views (e.g., Kripke) and **Contextualist** views.

  **1. Against Truth-Value Gaps:**
  Gap theorists argue that the Liar sentence is neither true nor false. This preserves consistency but faces the "Revenge Liar": "This sentence is not true." If the Liar is neither true nor false, then it is "not true," which makes the Revenge Liar true, reinstating the paradox.
  *Normative Advantage:* The normative view does not need to posit a gap in reality. $N$ *is* true (it correctly describes its own unwarranted status). The problem is not that the world fails to make it true or false, but that the language game forbids playing it. This explains the intuitive "wrongness" of the Liar without ontological excess. We don't need mysterious "gap" entities; we just have rules of conversation that were violated.

  **2. Against Contextualism:**
  Contextualists argue that the truth predicate shifts meaning depending on the context of evaluation. While this can block the paradox, it complicates the semantics of truth significantly, making truth relative to levels of language or contexts in a way that conflicts with our ordinary use of "true."
  *Normative Advantage:* The normative view keeps the meaning of "true" stable. "True" always means "correctly assertible." The variation is not in the meaning of truth, but in the **conditions of assertion**. The context doesn't change what truth *is*; it changes whether the speaker is *permitted* to invoke the predicate. This preserves the unity of the truth concept while accounting for the paradox through pragmatics.

  ### Conclusion

  The Liar paradox is not a discovery of a metaphysical glitch in the universe; it is a demonstration of the limits of our linguistic norms. By treating truth as a norm governing assertion, we shift the burden from semantics to pragmatics. The distinction between truth (correctness) and warrant (permission) allows us to acknowledge that the Normative Liar is true while simultaneously recognizing it as unassertible.

  This position requires us to abandon the unrestricted T-Schema for pathological cases, but this is a reasonable price to pay. It preserves classical logic for legitimate discourse, avoids the ontological commitments of truth-value gaps, and maintains a stable semantics for truth unlike contextualism. Ultimately, the normative view respects the insight that truth is not merely something sentences *have*, but something speakers *do*. The Liar sentence fails not because it describes an impossibility, but because it attempts to use the rules of the language game to break the game itself. Recognizing this dissolves the paradox without breaking our logic.
