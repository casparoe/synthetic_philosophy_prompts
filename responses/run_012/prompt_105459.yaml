      *   If $N$ is not warranted, then what it says is the case. Does this make it warranted? (The "Revenge" problem).
      *   *Normative Solution:* Assertion is governed by a rule: *Assert $P$ only if $P$ is true.* (Or *Assert $P$ only if you have warrant for $P$*).
      *   If we treat Truth as the norm, $N$ is problematic.
      *   If we distinguish Truth (the goal) from Warrant (the permission), we can say: $N$ might be *true* (it really is unwarranted), but asserting it violates the norm because you lack the warrant to assert it.
