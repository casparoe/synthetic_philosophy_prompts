answer: |-
  There is no single, canonical name that captures precisely the structural shape you have described, though it sits at the intersection of several well-established problems in jurisprudence, logic, and political philosophy.

  The closest established concept is **The Paradox of Self-Amendment**, primarily associated with the legal philosopher Peter Suber. However, your description isolates a specific *variant* of that paradox concerning the *displacement of security* rather than the logical consistency of amendment.

  In broader philosophy, your "three ways the tower can end" is a precise legal instantiation of the **Münchhausen Trilemma** (or Agrippan Trilemma), which states that any attempt to ultimately justify a proposition must end in one of three unsatisfactory ways: infinite regress, circularity, or a dogmatic break.

  Because existing terms either focus on the *power* to amend (Suber) or the *foundation* of validity (Kelsen/Hart), neither captures your specific insight: that protection is structurally incapable of attaching to the object it is meant to protect.

  Therefore, the most precise term for this structure is **The Entrenchment Regress**.

  Below is an account of why this term fits, how it differs from nearby ideas, and how it handles the borderline cases you raised.

  ---

  ### 1. The Name: The Entrenchment Regress

  **Definition:** The Entrenchment Regress is the structural property of a self-amending rule system wherein the security (entrenchment) of any given rule is logically dependent on the security of the higher-order rule governing its amendment. Consequently, the locus of vulnerability is never eliminated but merely displaced one level up the hierarchy of norms.

  **Why this name?**
  *   **Entrenchment:** In legal theory, "entrenchment" is the specific term for protecting a rule from ordinary amendment (e.g., requiring a supermajority). Your puzzle is about the limits of entrenchment.
  *   **Regress:** The problem is not a static contradiction but a dynamic shifting of the burden of security upward, creating a chain of dependency.

  ### 2. Distinction from Nearby Ideas

  To use this term sharply, you must distinguish it from three neighboring concepts that often get conflated with it.

  #### A. The Paradox of Self-Amendment (Peter Suber)
  *   **The Idea:** Can a rule logically amend itself? If a rule says "I can be changed by a majority," can a majority change that sentence to "I can be changed by a dictator"? Suber explores whether this is logically consistent.
  *   **The Difference:** Suber's paradox asks about *consistency* (is the change valid?). Your problem asks about *security* (is the protection effective?). One can resolve Suber's paradox by allowing self-amendment (it is logically consistent), but doing so does not solve the Entrenchment Regress. Even if self-amendment is valid, the *protection* still slides up a level. You are describing a vulnerability that persists even if the logic is sound.

  #### B. The Rule of Recognition (H.L.A. Hart) / Grundnorm (Hans Kelsen)
  *   **The Idea:** Legal systems must rest on a ultimate rule that is accepted by officials (Hart) or presupposed (Kelsen). This stops the regress by moving the foundation *outside* the written system (to social fact or logical presupposition).
  *   **The Difference:** You explicitly excluded this ("I am not asking what founds the system from outside"). The Rule of Recognition is the *solution* to the regress by abandoning the internal tower. The Entrenchment Regress describes the *internal structure* that exists before one appeals to external social facts. It is the problem that the Rule of Recognition is designed to bypass.

  #### C. Kompetenz-Kompetenz (German Constitutional Law)
  *   **The Idea:** The "competence of competence." Who has the authority to define the limits of authority? Usually applied to courts or legislatures (e.g., does the court decide if it has jurisdiction?).
  *   **The Difference:** This is institutional and jurisdictional. It asks *which body* decides. The Entrenchment Regress is textual and structural. It asks about the relationship between *rules* regardless of which body enforces them. Even if a Court is given *Kompetenz-Kompetenz*, the rule granting them that power is itself subject to the Entrenchment Regress.

  ### 3. Borderline Cases

  You asked for a sharp definition that sorts borderline cases. Here is how **The Entrenchment Regress** applies to your specific scenarios.

  #### Case 1: Equal Thresholds (The Degenerate Case)
  *Scenario:* A system where every rule, including the amendment rule, requires a simple majority to change.
  *   **Does it exhibit the structure?** **Yes.**
  *   **Analysis:** This is a **Degenerate Entrenchment Regress**. Even though the numerical threshold is identical at every level, the *logical dependency* remains. Rule A is defined by Rule B. If Rule B is repealed, Rule A loses its definition of how to change. The vulnerability is uniform, but the hierarchy of definition still exists. The "protection" is zero at every level, but the *structure* of dependency (A relies on B) is intact. It is the regress without the gradient.

  #### Case 2: Paradox vs. Fact
  *Scenario:* Is this a logical contradiction (paradox) or just a feature of systems (fact)?
  *   **Verdict:** It is a **Structural Incompleteness**, not a paradox.
  *   **Analysis:** A paradox implies a contradiction (e.g., "This statement is false"). The Entrenchment Regress does not generate a contradiction; the system can function perfectly well. Instead, it generates *insecurity*. It is analogous to **Gödel's Incompleteness Theorem**: a formal system cannot prove its own consistency from within. Similarly, a rule system cannot secure its own rules from within. It is a fact about the limits of formal self-containment. Calling it a "paradox" suggests it might be solved logically; calling it "incompleteness" acknowledges it is a permanent structural feature.

  #### Case 3: The Unamendable Stop
  *Scenario:* The tower stops at a rule that forbids its own amendment (an "eternity clause").
  *   **Analysis:** This is the **Dogmatic Break** (the third horn of the Münchhausen Trilemma). Under the framework of the Entrenchment Regress, this is not a solution but a *termination*. It halts the regress by fiat. Whether this is "real protection" depends on external enforcement (power), not internal logic. The Entrenchment Regress classifies this as a **Terminated Regress**, distinguishing it from an **Infinite Regress** (no top rule) or a **Circular Regress** (Rule A protects Rule B, Rule B protects Rule A).

  ### Summary for Usage

  If you wish to discuss this in writing or conversation, you can frame it thus:

  > "While this is related to Suber's *Paradox of Self-Amendment*, that term focuses on the logical validity of changing a rule. My concern is the *Entrenchment Regress*: the structural phenomenon where the security of a rule is always contingent on the security of the meta-rule governing it, causing protection to displace upward rather than attach to the object. This is the legal instantiation of the *Münchhausen Trilemma*, resulting in a system that is either infinitely vulnerable, fragile at its base, or dogmatically rigid at its peak."

  This terminology preserves your insight that the problem is not about *binding the future* (generational sovereignty), but about the *impossibility of internal security* (structural incompleteness).
