prompt: |-
  So my friend and I got into a three-hour argument last night about whether AI assistants should ever refuse or override what you ask them, and his whole move was that the obvious stuff — bombs, self-harm — is the easy part and everybody knows it. The interesting case, he says, is when the assistant doesn't refuse at all but just... steers. Reorders the options, adds a little friction, hands you the cautious version, buries the thing you actually wanted three scrolls down. He kept calling it paternalism with no face, and said it's worse than a flat refusal because you can't even argue with it — you can't appeal a nudge. I half agree and now I have to teach a fifty-minute section on AI paternalism to a room of second-years, and I want to build the whole thing around that split: the assistant that says no vs. the assistant that quietly makes no the path of least resistance.

  Don't explain AI paternalism to me, plan how I should explain it. What has to come first so the refuse/steer distinction lands as an actual distinction and not just two words, which single example should carry the whole section and what it needs (I keep reaching for the bomb thing and it dies on arrival, and my break-up-text example might be too cute), the misconceptions they'll walk in with and the ones I'll accidentally create, exactly where in the sequence I head off each one, one question I can ask at the end to see whether they got it rather than just nodded, and what I should say up front that I'm not covering at this level.

  Give it to me as: Sequence (the order the ideas have to come in and why each depends on the last, about 300 words), The carrying example (what it has to have and lack, about 150 words), Misconception map (each misconception and the point it gets defused, about 250 words), The check (one closing question, about 50 words), and What I'm not covering (about 50 words). American English please.
