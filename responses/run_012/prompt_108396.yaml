  2.  **Deconstruct the Principal Principle (PP):**
      *   *Formula:* $Cr(A | Ch(A) = x \land E) = x$.
      *   *Condition:* $E$ must be "admissible" evidence.
      *   *Intent:* PP connects *objective chance* (metaphysical feature of the world) with *subjective credence* (epistemic feature of the agent). It's a bridge principle.
      *   *Lewis's View:* Chance is temporal. It evolves. But it's not *epistemic*.

  3.  **Address the Card Case (The "Peek"):**
      *   *The User's Error:* The user assumes the chance remains 1/4 *after* the peek relative to the *same* time index, or they are conflating the chance *at the time of the shuffle* with the chance *at the time of the assessment*.
      *   *Lewis's Solution:* Chance is time-indexed. $Ch_t(A)$.
      *   *Scenario:*
          *   $t_0$: Shuffle. $Ch_{t_0}(\text{Heart}) = 1/4$.
          *   $t_1$: Peek. The card is *now* determined.
      *   *Key Insight:* Once the card is dealt and fixed (even face down), is the chance 1/4 or 1? Lewis argues that once the outcome is fixed by history, the chance becomes 1 or 0. However, usually, we talk about the chance *prior* to the determination.
      *   *Better Interpretation:* The PP applies to *future* contingents relative to the time of the chance. If I look at the card, the proposition "The card is a heart" is no longer a chancy matter *at that time*. It is a historical fact.
      *   *Admissibility:* Information about the *outcome* itself is paradigmatically *inadmissible* with respect to the chance *prior* to the outcome.
      *   *Correction:* The PP says: If you know the chance *at time t* is 1/4, and you have only admissible evidence *relative to t*, your credence should be 1/4. Knowing the card *is* a heart is inadmissible evidence regarding the chance *at the time of the shuffle*.
      *   *Wait, a stronger Lewisian point:* Lewis defines chance such that if the outcome is already fixed (even if unknown), the chance is 1 or 0. But standard usage (like the deck) treats "chance" as relative to a specific setup description. Let's stick to the standard PP interpretation: The PP governs the relationship between chance and credence *before* the outcome is revealed. Once revealed, chance is trivial (1 or 0).
      *   *Refining the Card Case:* The user says "The shuffle has not changed, so... chance is still one in four." This is the mistake. The *physical setup* hasn't changed, but the *metaphysical status* of the proposition has. At $t_{peek}$, the chance of it being a heart is 1 (because it *is* a heart). Chance supervenes on the history up to that time.
      *   *Alternative:* Even if we hold chance fixed at the shuffle time ($Ch_{shuffle}$), the evidence "I see a heart" is inadmissible with respect to $Ch_{shuffle}$.

  4.  **Address Admissibility (The Circularity Charge):**
      *   *User's Charge:* Admissible = "Evidence that doesn't break the principle." Circular.
      *   *Lewis's Defense:* Lewis gave a substantive account. Admissible evidence is evidence that does not give information about the *future* relative to the time of the chance, except via the chance itself. It's evidence about the past and present laws/history.
      *   *Thau/Hall/Elga:* There were refinements. The "New Principal Principle."
