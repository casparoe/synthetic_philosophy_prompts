answer: |-
  **PHI 450: Philosophy of Mind — Final Examination**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider this specific case: You touch a hot stove, feel a sharp **pain** (mental property), and immediately **wince** (physical behavior).

  Assume the following three premises are true:
  1.  **Supervenience:** The mental pain cannot exist without some underlying physical nerve-firing property realizing it.
  2.  **Causal Closure:** Every physical effect (like the wince) has a sufficient physical cause (the nerve-firing).
  3.  **No Overdetermination:** The wince is not causally overdetermined (it doesn't have two separate, sufficient causes happening at once, like two shooters firing at once).

  Using only the concrete case above, answer the following:

  Does the pain cause the wince? To answer this, you must clarify whether the causal relata are **events** (occurrences at a time) or **properties** (features of those occurrences). Explain why identifying the pain-event with the physical-event might fail to save mental causation if the *properties* remain distinct. Then, address **Multiple Realizability**: if pain can be realized by different physical states in different creatures, does the mental property correspond to a disjunction of physical properties? Can such a disjunction have causal powers?

  Next, evaluate the **Inheritance Move**: the idea that a realized property inherits causal powers from its realizer. Explain why this looks like a solution but ultimately collapses. Distinguish between **causal relevance** (being part of the explanation) and **causal efficacy** (doing the pushing). Is keeping relevance while losing efficacy a real position or a verbal dodge? Finally, if this argument excludes mental properties, does it also exclude chemical or biological properties (the "drainage" problem)? Pick a side: is this a reductio of the argument, or a consequence we must accept?

  Define any technical terms inline if you use them. No outside citations.

  ***

  **MODEL ANSWER**

  The intuitive answer is that the pain causes the wince. But the exclusion argument says otherwise. To see why, we have to look at what is actually doing the causing. Are we talking about events or properties? The pain-event (my feeling at t1) might be token-identical to the physical-event (C-fibers firing at t1). If they are the same event, maybe there's no exclusion. But the argument targets properties. Even if the event is one thing, the *property* of "being in pain" is distinct from the property of "C-fibers firing." Causal Closure says the physical property is sufficient for the wince. If the mental property is distinct, it looks like a second cause. No Overdetermination says we can't have two sufficient causes. So, the physical property excludes the mental property. Token identity doesn't help because causation seems to flow from the properties the events instantiate, not just the events themselves.

  This gets harder with Multiple Realizability. Pain isn't just C-fibers; aliens or robots could feel pain with different physics. So, the mental property "pain" isn't identical to one physical property. It looks like a disjunction: (C-fibers firing OR silicon-chip-state X OR...). But can a disjunction have causal powers? Generally, no. "Being either a rock or a snake" doesn't make something move; being a snake does. If the mental property is just a grab-bag of physical realizers, it lacks the unity to be a cause. The physical realizers do the work; the disjunction just labels them. So, MR doesn't save mental causation; it makes the mental property look even less causally potent.

  Some try the Inheritance Move. They say the realized property (pain) inherits causal powers from the realizer (C-fibers). This looks like a rescue because it gives the pain a job without competing with the physics. But it collapses. If the pain only has powers because the physical realizer has them, then the pain isn't doing anything *new*. It's parasitic. To say "pain causes wince because it inherits power from C-fibers" is just saying "C-fibers cause wince." The inheritance principle empties the mental property of independent causal weight. It saves the language of mental causation but removes the machinery.

  This leads to the split between causal relevance and efficacy. Maybe the pain is relevant (it explains why I winced in a way that makes sense to me) but not efficacious (it didn't actually push the muscles). Is this a real position or a dodge? It feels like a dodge. If efficacy is what makes something part of the physical world, relevance without efficacy is just epiphenomenalism with a PR team. It allows us to keep talking about beliefs and pains in psychology, but it admits those things don't actually move matter. That undermines the idea that psychology is a science of causes. If the properties don't exert force, they aren't causing anything, strictly speaking.

  Finally, does this drain causation out of chemistry and biology too? Biological properties are also multiply realized and supervenient on physics. If the exclusion argument works on pain, it works on "being a heart" or "being acidic." If we accept the argument, we have to say only fundamental physics is causally efficacious. Everything else is just patterns. Is this a reductio? I think yes. If a theory of causation implies that biology doesn't really cause anything, the theory is too strict. We should reject the No Overdetermination premise or tweak Causal Closure rather than accept that cells don't really divide. The argument proves too much, so it fails.

  ***

  **MARKING SCHEME (20 Marks Total)**

  **1. Relata Distinction (Events vs. Properties) — 4 Marks**
  *   **B Answer (2-3 marks):** States that events might be identical but properties are distinct. Mentions that closure applies to physical properties.
  *   **A Answer (4 marks):** Explicitly explains *why* token identity fails: causation depends on the properties instantiated, not just the occurrence. Clarifies that exclusion happens at the property level even if events are one.
  *   **Common Error:** Treating token identity as a full solution to exclusion without addressing property distinctness.

  **2. Multiple Realizability & Disjunctions — 4 Marks**
  *   **B Answer (2-3 marks):** Notes that pain has many realizers. States that disjunctions might not be natural kinds.
  *   **A Answer (4 marks):** Argues specifically that disjunctions lack unified causal powers. Explains that if the mental is a disjunction, the causal work is done by the disjuncts, not the disjunction itself.
  *   **Common Error:** Claiming MR automatically saves non-reductive physicalism without addressing the disjunction problem.

  **3. The Inheritance Move — 4 Marks**
  *   **B Answer (2-3 marks):** Describes inheritance as the mental getting powers from the physical. Says it might be circular.
  *   **A Answer (4 marks):** Explains *why* it collapses: inheritance makes the mental causally parasitic. If powers are borrowed, the mental property adds no causal value, reducing the move to a renaming of physical causation.
  *   **Common Error:** Accepting inheritance as a valid solution without critiquing its ontological cost.

  **4. Relevance vs. Efficacy — 4 Marks**
  *   **B Answer (2-3 marks):** Defines the terms. Says keeping relevance is useful for explanation.
  *   **A Answer (4 marks):** Takes a stand on whether this is a verbal dodge. Argues that without efficacy, the mental is excluded from the physical causal chain, making "relevance" merely pragmatic, not ontological.
  *   **Common Error:** Treating relevance and efficacy as interchangeable or failing to see the epiphenomenalist risk.

  **5. The Drainage Problem (Special Sciences) — 4 Marks**
  *   **B Answer (2-3 marks):** Notes that biology/chemistry face the same issue. Says this might be a problem.
  *   **A Answer (4 marks):** Picks a side (Reductio vs. Consequence) and defends it. Either argues the argument is false because it eliminates valid sciences, or accepts special sciences are merely explanatory patterns without fundamental causal powers.
  *   **Common Error:** Shrugging ("it's complicated") without committing to a position on whether the drainage is fatal to the argument.
