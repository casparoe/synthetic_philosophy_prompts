prompt: |-
  Hey, I'm doing my EPQ (extended project qualification) on animal consciousness and I need a hand. My supervisor keeps saying I should stop reading around the topic and actually commit to some claims, so I want to do something like a tier list but with proper arguments behind it.

  Can you take the role of a philosopher of mind who actually knows the comparative cognition side of things, and think carefully before you answer? Please don't give me the usual "mammals and birds yes, insects and fish probably not" line. Also I can't really use the internet for this bit (school filters plus our library has nothing on this) so please don't give me citations or a reading list, just reason it out from what you know. And I'm in the UK so British English please, I keep getting marked down for writing "analyze" lol.

  Before you rank anything, brainstorm out loud for a bit: what makes this question hard, what would you have to assume to answer it, and where do you think the usual rankings go wrong?

  Then rank these, from easiest to defend as conscious down to hardest. I picked them because they're not the usual suspects and I want to see where the line actually falls: common octopus, honeybee, jumping spider, hermit crab, cleaner wrasse, fruit fly, earthworm, planarian flatworm, chicken, brown rat.

  For each one give me:
  - a number from 0 to 1 for how likely it is to have phenomenal consciousness (i.e. there's something it's like to be it)
  - a seperate number for valenced experience, meaning can it feel good or bad, could it suffer
  - a tier name you've made up for it
  - a sentence or two saying why it landed there

  Then do a second pass where you flag which placements would move a lot if you switched your background theory of consciousness, say global workspace versus higher-order thought versus predictive processing, and which placements stay put no matter which of those you pick. Then tell me the single placement you think most people would disagree with you about and defend it properly.

  Please don't hedge everything into mush. If something is genuinely a coin flip, say so, but where the evidence points somewhere, commit to it. And tell me which of your numbers you'd definately bet money on and which you'd only defend in an essay.

  Last thing, and this is the bit my supervisor will care about: pull back at the end and tell me what this whole exercise shows about its own limits. Is there a hidden assumption in asking for one number per animal at all, and does ranking them this way smuggle in something about what consciousness is that I should be suspicious of? Cheers.
