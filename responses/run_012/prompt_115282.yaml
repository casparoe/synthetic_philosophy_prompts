answer: |-
  # Q&A PREP SHEET: TRIVIALITY & THE SUPPOSITIONAL MODE

  **Thesis Reminder:** The Equation ($P(\text{if } A, B) = P(B|A)$) is a category mistake. Conditionals have no truth conditions. 'If' marks a suppositional mode of assertion.

  ---

  ## OBJECTIONS (Ordered by Likelihood & Damage)

  ### 1. The "Import-Export" Escape Route
  **Who:** Formal Semanticist #1 (Stalnaker/Lewis camp)
  **Objection:** "You claim there are no stable escape routes from triviality. But dropping Import-Export ($P(\text{if } (A \land B), C) = P(\text{if } A, (\text{if } B, C))$) blocks the proof cleanly. Stalnaker's semantics validates the Equation for simple conditionals but rejects Import-Export for nested ones. Why isn't that a stable position? Why must we pay the price of abandoning truth conditions entirely when we can just pay the price of a valid inference rule?"

  **My Reply (2 min):**
  "Because the restriction becomes ad hoc and linguistically unmotivated. To block triviality, you must forbid Import-Export precisely where it would generate a contradiction, but allow it everywhere else to preserve the intuitive validity of modus ponens and reasoning by cases. But speakers *do* reason using nested conditionals without hesitation. If you say 'If it rains, then if the ground is wet, the match won't light,' you aren't signaling a shift in semantic logic.
  More critically, my argument is that the Equation itself is the category mistake. If 'if A, B' doesn't express a proposition, it doesn't *have* a probability in the sense required by the left-hand side of the Equation. Restricting Import-Export saves the truth-conditional semantics, but it leaves the Equation as a mysterious approximation that holds only when the logic looks away. I'm arguing the Equation holds *because* conditionals are suppositional, not *despite* their logic. Saving truth conditions by breaking Import-Export treats the symptom; I'm treating the diagnosis."

  **Soft Spot:** I am assuming Import-Export is linguistically robust. If they show corpus data where nested indicatives behave differently, my "unmotivated restriction" charge weakens. I also haven't fully defined validity without truth conditions, which they will pounce on next.

  ### 2. The Negation Problem
  **Who:** Graduate Student #1
  **Objection:** "This is the classic expressivist hurdle. I can say, 'It is not the case that if it rains, the match will light.' If 'if' isn't propositional, what am I negating? You can't negate a speech act or a mode. If you say I'm negating the supposition, that doesn't make sense—I'm asserting the negation. Are you forced to say this sentence is meaningless, or do you have a truth condition for negated conditionals? If the latter, why don't *they* trigger triviality?"

  **My Reply (2 min):**
  "I'm not saying the sentence is meaningless; I'm saying the negation operator here doesn't operate on a proposition. When you say 'It is not the case that if A, B,' you are rejecting the suppositional commitment. You are saying: 'Under the supposition A, I do not accept B.'
  Think of it like imperatives. 'Don't open the door' isn't negating a proposition; it's prohibiting an action. Similarly, negated conditionals express a prohibition on making the inference from A to B. This doesn't trigger triviality because we aren't assigning a probability to a truth-bearing content. We are describing a constraint on the suppositional state. The triviality proof requires the conditional to be a proposition that can be conjoined, disjoined, and assigned probability mass. A constraint on inference doesn't carry that mass."

  **Soft Spot:** This relies on an analogy with imperatives that semanticists will reject as category confusion. I need a logic of "prohibited inferences" that I haven't fully formalized. If they press on "But I can embed negated conditionals in disjunctions," I'm in trouble.

  ### 3. The Measure-Theoretic Wall
  **Who:** The Probabilist
  **Objection:** "You call the Equation a category mistake. Fine. But you still use conditional probability $P(B|A)$ to explain assertion. For $P(B|A)$ to be defined, $P(A)$ must be greater than zero. What happens when $P(A) = 0$? In standard measure theory, the conditional is undefined. Do conditionals with zero-probability antecedents lack meaning? Or are you proposing a non-standard probability space? If the latter, where is the formalism?"

  **My Reply (2 min):**
  "This is a technical constraint on the *model*, not the *phenomenon*. In natural language, we rarely encounter genuine measure-zero antecedents; we encounter counterpossibles or highly unlikely events. For counterpossibles, I agree: the suppositional mode strains, and we often shift to subjunctive semantics which *do* have truth conditions (similar worlds).
  For standard indicatives, if $P(A)$ is effectively zero, the conditional is infelicitous, not false. This matches the data: 'If 2+2=5, I am the Pope' sounds like a joke, not a truth-apt claim. My account predicts this infelicity. The Equation isn't a law of nature; it's a norm of assertion for non-zero antecedents. I don't need a new measure theory; I need to acknowledge that the suppositional mode is only active when the antecedent is a live option in the context set."

  **Soft Spot:** I am waving away counterpossibles. If they press on mathematical conditionals ("If this number is prime..."), my "infelicity" claim is false. Mathematicians assert conditionals about numbers they know are composite all the time.

  ### 4. The Embedding Data (Disjunctions)
  **Who:** Natural-Language Semanticist
  **Objection:** "You mention disjunctions. Consider: 'Either if it rains the match won't light, or if it's windy the fire will start.' This is a disjunction of conditionals. In my data, these embed under 'believe,' 'know,' and 'if.' If 'if' clauses aren't propositions, what is the 'or' operating on? You can't disjoin two speech acts. Are you claiming these sentences are all surface-structure illusions?"

  **My Reply (2 min):**
  "I'm not claiming they are illusions, but that the surface syntax misleads the semantic type. When you see 'Either if A, B or if C, D,' I argue you are not disjoining two propositions. You are asserting a complex suppositional state: 'In the A-supposition, B holds; in the C-supposition, D holds; and one of these suppositional commitments is active.'
  The embedding under 'believe' is the harder case. 'John believes that if A, B.' I treat this as: John is in a state where he accepts the inference from A to B. 'Belief' here is a relation to a doxastic disposition, not a proposition. The syntax allows embedding, but the semantics maps to attitudes toward inference rules, not attitudes toward contents. We do this with questions too: 'I know whether he came.' 'Whether' isn't a proposition."

  **Soft Spot:** The "attitude toward inference rule" is vague. The semanticist will want to know the compositional mechanism. How does 'or' combine two inference rules? I lack a formal syntax for this.

  ### 5. Gärdenfors and Iterated Revision
  **Who:** The Epistemologist
  **Objection:** "You cite Gärdenfors's theorem as the qualitative shadow of triviality. But most dynamic epistemologists think Gärdenfors just proves AGM is too static for conditionals. We have iterated revision models (Darwiche-Pearl) that handle conditionals by treating them as constraints on the *ordering* of worlds, not the set of worlds. Why isn't that a better solution than abandoning truth conditions? You keep the content, you just make the belief state richer."

  **My Reply (2 min):**
  "Because it makes the connection between belief and assertion coincidental. In those models, the conditional has truth conditions (sets of ordered worlds), but we only assert them when the Equation holds. Why? If the content is an ordering constraint, why should its *probability* match the conditional probability?
  My view explains the link: The meaning of the conditional *is* the constraint on the doxastic state. There is no gap between the content and the acceptance condition. By positing ordered worlds, you are reifying the supposition into a truth-bearer to save truth-conditional semantics. I'm arguing that reification is what generates the paradox. Don't add structure to the world to match the mind; recognize the mind's mode of operation."

  **Soft Spot:** I am characterizing their view as "coincidental" without proving it. They will argue the link is derived from rationality norms, not meaning. I need to be careful not to beg the question against rational pragmatism.

  ### 6. The "Coincidence" Charge
  **Who:** Formal Semanticist #2
  **Objection:** "You say keeping truth conditions and dropping the Equation makes the Equation a coincidence. But it's not a coincidence; it's a pragmatic norm. We assert 'If A, B' when $P(B|A)$ is high because of Gricean maxims or assertability conditions. Why is that less attractive than your category mistake? It preserves classical logic for the object language."

  **My Reply (2 min):**
  "Because the Equation is too robust to be merely pragmatic. Pragmatic implicatures are cancellable. 'If A, B, but I don't think B is probable given A' is a contradiction, not a pragmatic oddity.
  Furthermore, triviality results show that if you *have* truth conditions that obey classical logic, you *cannot* have the Equation hold generally, even as a norm, without collapsing probabilities. So the pragmatic story requires us to systematically violate the norms of probability in our semantic modeling. I find it more parsimonious to say the semantics isn't truth-conditional than to say our probability assignments are systematically decoupled from our semantics in a way that perfectly mimics a non-existent equation."

  **Soft Spot:** "Contradiction" vs "Pragmatic Oddity" is a slippery distinction. They will produce examples where the Equation seems to fail (e.g., McGee's counterexamples) to show it *is* cancellable or defeasible.

  ### 7. Disagreement and Contradiction
  **Who:** Graduate Student #2
  **Objection:** "If I say 'If A, B' and you say 'If A, not B,' we are disagreeing. One of us is wrong. If there are no truth conditions, what makes one of us wrong? Are we just clashing attitudes? That sounds like emotivism. How do you account for the normativity of logical disagreement without truth?"

  **My Reply (2 min):**
  "We are disagreeing about the viability of the inference, not the state of the world. It's like disagreeing on a move in chess. 'You can't castle now' isn't true or false about the physical board; it's correct or incorrect relative to the rules.
  When we disagree on a conditional, we are disagreeing on whether B follows from A in the current context. One of us is making a mistake in reasoning or has different background information. The 'wrongness' is a failure of rational coherence, not a mismatch with reality. This preserves normativity without requiring the conditional to describe a fact."

  **Soft Spot:** This risks collapsing into relativism. If it's just about "my rules vs. your rules," how is it objective? I need to anchor the "rules" in shared evidence or context, which starts looking like truth conditions again.

  ### 8. Conditionalization as Learning
  **Who:** The Probabilist (Follow-up)
  **Objection:** "If I learn 'If A, B,' how do I update my probability function? Standard conditionalization requires learning a proposition E. If 'If A, B' isn't a proposition, what is E? If you say 'I constrain my function so $P(B|A)=1$,' that's not conditionalization, that's imaging or something else. How do I integrate this into a Bayesian agent?"

  **My Reply (2 min):**
  "You are right, it is not standard conditionalization. It is a constraint on the posterior distribution. You adjust your probabilities to satisfy the constraint $P_{new}(B|A) = 1$ while minimizing information loss (e.g., via minimum cross-entropy).
  This isn't a bug; it's a feature. Learning a factual claim ('A is true') updates the world. Learning a conditional ('If A, B') updates the *connection* between A and B. Distinguishing these update mechanisms explains why learning 'A' and learning 'If A, B' have different effects on $P(\neg A)$. Standard truth-conditional accounts struggle to explain why learning the conditional doesn't raise the probability of the antecedent."

  **Soft Spot:** I am gesturing at "minimum cross-entropy" without a rigorous proof that this update rule is stable or unique. The probabilist might know more about this than I do.

  ---

  ## STRATEGIC CONCESSIONS (Give these to save time)

  1.  **Counterpossibles:** Concede that indicatives with impossible antecedents likely shift to a subjunctive/truth-conditional semantics. Don't fight the "If 2+2=5" cases too hard; isolate them as a different grammatical mood.
  2.  **AGM Crudeness:** Concede that AGM is static. You don't need to defend AGM specifically, only the *structural* impossibility of mapping conditionals to propositional content in *any* reasonable belief revision system.
  3.  **Rare Embeddings:** Concede that deep embeddings (e.g., conditionals inside the antecedent of another conditional) are rare and processing-heavy. You can afford a more complex story for the outliers if the core cases work.

  ---

  ## THE EXPECTED LOSS (Damage Control)

  **The Objection:** **Import-Export Validity.**
  **Who:** Formal Semanticists.
  **Why I'll Lose:** They will likely produce a specific logical derivation where Import-Export seems undeniable, and my "suppositional mode" account lacks the formal machinery to validate it without collapsing into truth conditions.
  **Damage Control:** Do not dig in. Say: "If Import-Export is valid, then my claim that 'if' is non-propositional requires a non-classical logic for the suppositional mode. I am willing to accept a non-classical logic for suppositions if it preserves the Equation. The cost of classical logic is the Equation; the cost of the Equation is classical logic. I choose the Equation."
  *Goal:* Frame it as a trade-off, not a refutation.

  ---

  ## THE HOPED-UNASKED QUESTION

  **"What is your account of Validity?"**
  If conditionals aren't propositions, they can't be premises or conclusions in a standard valid argument (which preserves truth).
  *Prep:* "Validity is preservation of *acceptability* under supposition, not preservation of truth. An argument is valid if accepting the premises forces acceptance of the conclusion in the same suppositional state." (Have this ready, but hope they don't ask for the formal definition).

  ---

  ## WEAKEST POINT (Defend Aggressively)

  **The Account of Compounds (Negation/Disjunction).**
  This is the hole in every non-propositional view.
  **Defense Strategy:** Do not try to give truth conditions for compounds. Insist that compounds of conditionals are *meta-linguistic* or *meta-doxastic* claims. "Either if A, B or if C, D" is a claim about the agent's commitment structure, not the world. If they press, reiterate: "The syntax is propositional, the semantics is not. We use propositional syntax to talk about non-propositional attitudes all the time (e.g., 'I hope that p')."
