answer: |-
  # The Interval

  The file sits on my desk even now, though I closed it three years ago. It is a thick manila folder, swollen with transcripts, medical affidavits, and the original incident report from Metro Transit. The paper has yellowed at the edges, the kind of slow oxidation that happens to wood pulp when it is kept away from light. I look at it sometimes when the office is quiet, when the hum of the HVAC system drops low enough to hear the traffic on the avenue below. I look at it to remind myself that I made a choice. But the ink on the signature line looks different depending on the angle of the lamp. Sometimes it looks wet and decisive. Sometimes it looks like a smear made by a thumb that hesitated.

  Miller's case was straightforward on paper. He was a signal operator for the rail yard. His job was to watch the gantry lights and switch the tracks. On the night of November 14th, he reported a malfunction. He saw the primary signal sweep from amber to red. He said it didn't snap; it flowed. He said the color changed while the light was physically moving across his field of vision, midway between the housing and the lens. He slammed the emergency brake. The train stopped. The cargo shifted. A container fell. No one died, but Miller claimed a neurological injury resulting from the perceptual shock.

  Code 45 covers Acute Sensory Distortion. It pays a full disability pension. Code 82 covers Retrospective Narrative Integration. It pays for therapy and a return to work. The difference is a lifetime of income versus a severance package. The difference is whether his brain broke or whether his story did.

  I met Miller in Interview Room B. It was a small box with no windows, painted a calming shade of green that had peeled near the baseboards. Miller sat on the metal chair, hands clasped in his lap. He was a big man, but he looked folded in on himself, as if trying to occupy less space.

  "Walk me through the light again, Mr. Miller," I said. I had my pen poised over the transcript log.

  "It wasn't a snap," Miller said. His voice was rough, unused. "I know how lights work. I've worked them for twenty years. They click. They're binary. This… it was like paint running. Amber bleeding into red."

  "Where were you looking?"

  "Direct at the gantry."

  "And the movement?"

  "The light bar swings. It scans the yard. It was mid-swing. That's the thing. If it had been at the apex, I'd say it was a bulb failure. But it was moving. I saw the color change while it was in transit."

  I stopped writing. This was the hinge. If the light changed color while in motion, the physics of the signal housing made that impossible. The bulb was fixed; the reflector moved. The color was determined by the filter in front of the bulb. For the color to change mid-sweep, the filter would have to shift instantaneously, or Miller's perception of the sweep would have to bridge a gap that wasn't there.

  "Did you see the change happen before the light reached the center mark, or after?" I asked.

  Miller frowned. He looked at the table, then at the wall, then back at me. "I… I told you. It was in the middle."

  "I need a timestamp, Mr. Miller. The log shows the signal switched at 02:14:03. The sweep takes four seconds. Did the change occur at second two? Second three?"

  "I don't know," he said. "It happened… while it was moving."

  "We have to place it," I said. "If the change occurred before the signal registered in the system, it's a hardware fault. If it occurred after, it's a processing error. If it occurred in your head, it's Code 82."

  Miller rubbed his thumb over his knuckles. "It felt real. I braked. My heart hammered. I tasted copper. You don't taste copper from a memory error."

  I leaned back. The fluorescent tube overhead buzzed. It was an old fixture, the starter failing. Every few seconds, the light dipped, just for a fraction of a second, a tiny strobe effect that made the shadows on Miller's face jump. I watched the shadow of his nose slide across his cheek and snap back. For a moment, the room seemed to breathe. I felt a slight nausea, a disconnect between what my eyes said was steady and what my brain said was flickering. I blinked, and the light stabilized.

  "Take a break," I said.

  Miller looked relieved. He stood up and walked to the door. I stayed seated, watching the light fixture. It hummed again. I wondered if the flicker was real or if it was the fatigue settling behind my eyes. I had been reviewing files since six in the morning. The boundary between the object and the perception of the object felt thin, like paper held up to a bulb.

  When Miller came back, he was accompanied by Hendricks from Legal. Hendricks didn't sit. He leaned against the wall, arms crossed, watching me like I was the one being interviewed.

  "We need to close this, Elias," Hendricks said. He didn't look at Miller. "The transit authority is pushing back. They say the hardware logs are clean. No voltage spike. No filter shift."

  "The hardware logs don't record perception," I said.

  "They record reality," Hendricks said. "Miller saw something that couldn't happen. That leaves us with two options. Either his brain staged the show to make sense of a lag, or he's remembering it wrong to fit the lawsuit."

  Miller shifted in his chair. "I'm not lying."

  "No one says you are," Hendricks said. He pushed off the wall and walked to the table. He tapped the file folder. "But we have to categorize the injury. Is it Stalinesque or Orwellian?"

  I looked up. "Don't use those words here."

  "Why not? It's shorthand," Hendricks said. "Either the brain held the first image, waited for the second, and showed him a edited movie—that's Stalinesque. Or he saw the truth, and his memory rewrote the script afterward to make it seamless—that's Orwellian. One is a processing lag, one is a memory fault. Neither is Code 45."

  "It's not a label," Miller said. "It hurt."

  "Pain is subjective," Hendricks said. "Payouts are objective. Elias, if you code this as perceptual, you're saying the external world behaved impossible. If you code it as memory, you're saying he's mistaken. If you code it as processing, you're saying his brain is slow. Only one of those gets the pension. And none of them are supported by the logs."

  I looked at Miller. He was staring at his hands. He looked tired, the kind of tired that goes into the bone. He was trying to hold onto something that was slipping away every time he tried to describe it.

  "Mr. Miller," I said. "When you describe the color change… do you remember seeing it, or do you remember telling us about it?"

  Miller looked up, confused. "What?"

  "We've done three interviews," I said. "In the first one, you said the light turned red at the end of the sweep. In the second, you said it was the middle. In this one, you say it bled. Which one is the memory?"

  "The truth," Miller said. But his voice wavered.

  "Or is it the version that fits the questions?" I asked. "I ask you where it happened, and you look for a place. I ask you when, and you look for a time. You're building the memory to fit the box I'm holding out."

  "I saw it," Miller said. He was louder now. "I saw the amber turn to red while it was moving. I saw it."

  "Did you?" Hendricks said. "Or did you see amber, then you saw red, and now you remember a transition because a transition makes sense?"

  "I know what I saw."

  "Your brain wants a story," Hendricks said. "It hates gaps. If there's a gap between the amber and the red, your brain fills it in. It draws the line. That's not an injury. That's biology."

  I picked up my pen. The form lay before me. Box 45: Perceptual Injury. Box 82: Cognitive Integration. There was no box for "We don't know." There was never a box for that. The system requires a cause to justify an effect. If the cause is ambiguous, the effect is denied.

  I looked at Miller. He was sweating. He was trying to hold the image in his mind, but every time he spoke, the image changed. He was sculpting it with his words, smoothing the edges, making it coherent. The more he testified, the more solid the memory became, and the less it resembled the raw shock of the moment. Was the injury the event itself? Or was the injury the act of forcing the event into language?

  "Mr. Miller," I said. "If I approve Code 45, you get the pension. But you have to undergo neural mapping. They'll look for damage. If they don't find it, you'll be flagged for fraud."

  "And if I take Code 82?"

  "Therapy. Six months. Then you go back to light duty."

  "I can't go back," Miller said. "If I can't trust the lights…"

  "Then you're disabled by fear, not by physics," Hendricks said.

  I looked at the pen. I looked at the file. The fluorescent light buzzed again. I watched the shadow on the table jump. Was the light flickering, or was my attention blinking? I realized I couldn't remember if the light had flickered during the first interview. I checked my notes. I hadn't written it down. I hadn't noticed it then. Or had I noticed it and forgotten?

  The third possibility sat in the room, unspoken. It wasn't that Miller's brain had staged the show. It wasn't that his memory had rewritten the past. It was that this room, this table, these questions were doing the work. The testimony was not a record of the event; it was the event itself. By asking him to locate the color change, I was asking him to create it. He was giving me what I needed to close the file, not what had happened in the yard.

  But I needed to close the file. The queue was growing. Hendricks was waiting. Miller was waiting. The pension fund was waiting.

  "I need a decision, Elias," Hendricks said.

  I put the pen to the paper. I felt the scratch of the nib against the stock. I made a mark. I signed the date. I slid the form across the table.

  Miller looked at it. He didn't pick it up. He looked at me. "Did I see it?" he asked.

  "You saw something," I said.

  "Is it enough?"

  "It's what we have."

  Miller stood up. He took the form. He didn't look at the code box. He just folded the paper and put it in his pocket. He walked out without saying goodbye. Hendricks stayed for a moment, watching me.

  "Good call," he said. "Save us the trouble."

  He left. I sat alone in the green room. The light buzzed. I packed my bag. I turned off the lamp.

  That was three years ago. I am writing this now because I found the file in the archive. I pulled it out to check a reference for a new case, a similar claim involving a strobe light at a construction site. I opened the folder to see how I had ruled.

  The form is there. The signature is there. It is my signature. I know the loop of the 'E', the cross of the 't'. But the box… the box is smudged. There is ink in Box 45. There is also ink in Box 82. It looks like I checked both. It looks like I checked neither. The carbon copy is faint. The original was sent to payroll. I don't have a record of what payroll processed.

  I called Miller's number. It's disconnected. I called the transit authority. They say the file was closed under Code 82. Therapy completed. Returned to work. But I remember Miller standing up. I remember him looking at the form and not reading it. If he returned to work, he would have had to pass the neural map. If he passed the neural map, it would be in the file. It isn't.

  I look at the form on my desk. The ink seems to shift under the lamp. Did I approve the pension? Did I deny it? Did I leave it blank and let the system decide by default?

  I remember the light flickering. I remember the shadow jumping. I remember Miller asking, "Did I see it?" I remember answering, "You saw something."

  But I don't remember what I decided. I don't remember if I decided then, or if I am deciding now, as I look at the paper, as I try to reconstruct the memory of the decision to fit the narrative of this report. Maybe I didn't check a box. Maybe I am checking it now in my mind, and my mind is telling me I did it then to make the story coherent.

  The hum of the HVAC drops. The traffic on the avenue rises. A car passes outside, its brake lights flashing red in the window reflection. For a second, the red light overlaps with the green of the file folder. It looks like a blend. It looks like a transition.

  I reach for the pen. I could correct the record. I could call payroll and ask them to verify the code. I could find Miller through the union. I could know.

  But if I call, I will create a new record. They will look up the file. They will tell me what the computer says. The computer will say Code 82. But the computer was updated last year. The data migration might have defaulted uncoded fields. If I ask, I will get an answer, but I won't know if the answer is what happened then, or what the system needs to be true now.

  I put the pen down. I close the folder. The sound of the cardboard covers meeting is final, a soft clap like a brake pad engaging. I sit in the quiet. I try to remember the weight of the pen in my hand that day. Was it heavy? Was it light? Did I hesitate?

  The light overhead buzzes. I watch the shadow of my hand on the desk. It jumps. It stays. I blink. I am not sure if the light flickered, or if I missed a moment. I am not sure if Miller saw the color change, or if he told me he did because I asked him where it happened. I am not sure if I granted him the pension, or if I am granting it to him now in my memory to ease the weight of the file.

  The interval between the flash and the report is where the work happens. We fill it with what makes sense. We draw the line between the points. We make the motion smooth. We make the color change happen where it should, not where it did.

  I turn off the lamp. The room goes dark. I wait for my eyes to adjust. I wait for the afterimage of the light to fade. It lingers, a green ghost on the retina, holding its shape long after the source is gone. I watch it fade. I wait to see if it snaps out or bleeds away.

  In the dark, I cannot tell.
