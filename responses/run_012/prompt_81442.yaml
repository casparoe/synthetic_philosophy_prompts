answer: |-
  You have stumbled onto one of the oldest and thorniest problems in moral philosophy and the philosophy of action. You are asking about the difference between **causal necessity** (the physics of what happened) and **causal responsibility** (the social logic of who gets blamed).

  Sam is right that, physically speaking, the cause is distributed. If you had bought the house, the boiler would have been new. If Tom had called, the gas would have been off. If Priya had called, the check would have happened. In the strict physics of "but-for causation" (i.e., *but for this event, the result would not have occurred*), you are all equally causal.

  But Sam is wrong that the blame is arbitrary. We do not assign blame based on physics; we assign it based on **social coordination.**

  Here is the "real shape" of the argument, broken down into the three filters we use to separate "not buying the house" from "not calling the plumber."

  ### 1. Background Conditions vs. Interventions
  Your intuition about "not buying the house" is correct: that is a **background condition**, not a cause.

  In philosophy (specifically in the work of H.L.A. Hart and Tony Honoré), there is a distinction between the "normal course of things" and a "deviation."
  *   **The Normal Course:** You live in a house. The house has a boiler. The boiler ages.
  *   **The Deviation:** A specific signal indicates danger (smell, letter, email), and the expected mitigation does not happen.

  When we look for a cause, we are looking for the thing that *changed* the trajectory from "safe" to "unsafe."
  *   **You not buying the house:** This is part of the background. It is the stage upon which the play is set. Blaming you for this is like blaming an actor for not writing the script. It's a permanent state of affairs, not a specific failure to act in a moment of risk.
  *   **Sam not calling:** This is an intervention (or lack thereof) within the active timeline. The risk became salient (emails, smell), and the status quo was allowed to continue despite the warning.

  We ignore background conditions because they are constant. If we blamed people for background conditions, everyone would be responsible for everything forever. We focus on deviations because they are the leverage points where the future could have been different.

  ### 2. Normative Expectations (Refining your Girlfriend's Point)
  Your girlfriend says it's about "what you were supposed to do." You feel this is circular (we pick the person to blame, then say they were supposed to do it).

  It is only circular if you think the "supposed to" is invented *after* the explosion. It isn't. The "supposed to" exists **ex-ante** (before the event).

  Society runs on scripts. We have pre-written agreements about who handles what, so we don't have to negotiate every single danger in real-time.
  *   **The Tenant Script:** When Sam signed the tenancy agreement, he didn't just sign a legal document; he entered a social role. That role comes with a pre-assigned bundle of responsibilities: paying rent, keeping the place clean, and **managing communication with the landlord regarding safety.**
  *   **The Guest Script:** Tom is a guest. The social script for a guest is "do not rearrange the host's infrastructure." If Tom calls the landlord to demand repairs, he is potentially overstepping. He is a visitor in Sam's domain.
  *   **The Housemate Script:** You and Priya are occupants, but not the leaseholder. Your script is "alert the leaseholder."

  This isn't arbitrary because it isn't about who *could* physically pick up the phone. It's about who has the **authority** to make the phone call count.
  *   If you call, the agent says, "Who are you?"
  *   If Sam calls, the agent says, "Okay, tenant, what's the issue?"

  Sam is blamed not because he was the only one with hands, but because he was the only one with the **social key** to unlock the solution. Blame is assigned to the person who held the keys to the prevention.

  ### 3. The Purpose of Blame: Future Incentives
  This is the most pragmatic part of the argument. We assign blame to shape future behavior.
  *   **Blaming you for not buying the house:** This provides zero useful incentive. You cannot go back in time and buy the house. It teaches no one anything about how to behave next time.
  *   **Blaming Tom for not calling:** This creates a confusing incentive. It tells guests they should intervene in their hosts' contractual relationships. This might lead to social friction or people feeling unable to host guests for fear they'll take over the household management.
  *   **Blaming Sam:** This creates a clear, actionable incentive for the future. It tells every future tenant: "If you hold the lease, you are the node through which safety issues must pass."

  We select Sam as the cause because fixing Sam's behavior is the most efficient way to prevent the next explosion. We are not acting as physicists analyzing the past; we are acting as engineers designing the future.

  ### Addressing Sam's Specific Defense
  Sam has two other arguments:
  1.  **"Anyone could have picked up the phone."**
      As established above, anyone could *physically* dial, but only Sam could *effectively* execute the action within the social structure.
  2.  **"The check might have missed the fault anyway."**
      This is the strongest part of Sam's argument. It attacks the link between the omission and the result. If the safety check wouldn't have found the leak, then Sam's failure to schedule it didn't actually increase the risk.

      *However*, this ignores the other warnings. The smell (detected by Tom), the noise (heard by you), the emails (received by Sam). Even if the *annual check* was a bureaucratic box-ticking exercise, the specific reports of gas smells and weird noises demand immediate, ad-hoc investigation. Sam received the emails specifically about the check. By ignoring the administrative channel, he closed off the primary route for professional intervention.

      Sam is responsible for **Risk Management**, not **Risk Elimination**. He cannot guarantee the boiler won't explode, but he is responsible for ensuring the processes designed to minimize that risk are activated. He let the processes lapse.

  ### The Verdict
  Sam is not the "physical cause" of the explosion (the gas leak was). Sam is the **moral cause**.

  The line you are looking for is drawn by **Role, Authority, and Leverage.**
  *   **You** lacked the authority (not the tenant).
  *   **Tom** lacked the standing (guest).
  *   **Priya** lacked the follow-through (left the letter, didn't chase).
  *   **Sam** had the Authority (lease), the Knowledge (emails), and the Leverage (landlord listens to him).

  It feels arbitrary to Sam because he is looking at the *physics* of the event (any hand could dial). It feels obvious to you because you are looking at the *structure* of the household (only one hand holds the keys).

  We blame Sam because he was the designated safety officer for that house, whether he wanted the job or not. When you accept the tenancy, you accept the liability for the communication chain. That isn't circular; it's the price of the rental.
