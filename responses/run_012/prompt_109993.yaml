answer: |-
  **Dialogue**

  **Alex:** Look, it's clean. The cheap dam means *these* kids exist. The expensive dam means *those* kids exist. You can't say *these* kids are harmed by being born, provided their lives are worth living.

  **Sam:** But they're contaminated. They lose years of health. Their prospects are knocked back.

  **Alex:** Compared to what? Non-existence? That's not a harm comparison. They aren't worse off than they would otherwise be, because otherwise they wouldn't be. The cheap dam is a necessary condition for their existence.

  **Sam:** So the company commits no wrong?

  **Alex:** Not against the majority. There's a small cluster of families who stay put regardless of the schedule. Their kids are born either way. Those kids are definitely harmed by the leak.

  **Sam:** So you admit a wrong exists.

  **Alex:** I admit a wrong exists against *them*. But you're upset about the ninety-five percent who wouldn't exist under the safe spec. You're treating them as if they had a claim to be born healthy into existence.

  **Sam:** I'm treating them as people who suffer.

  **Alex:** You're treating them as placeholders. If morality is about people, it's about specific people. If you change the policy, you delete the victims. You can't wrong someone by bringing them into a life they're glad to have.

  **Sam:** That's the trap. You've defined 'wrong' so narrowly it lets us off the hook for creating avoidable suffering.

  **Alex:** I've defined it so it remains tethered to subjects. Otherwise, you're worshipping abstract totals.

  **Sam:** I'm saying if we choose the cheap dam, the world is worse.

  **Alex:** Impersonally, perhaps. But who is the 'we' hurting?

  **Sam:** The future community.

  **Alex:** Which specific members?

  **Sam:** The ones living with the leak!

  **Alex:** Who owe their lives to the leak's cause. It's circular.

  **Sam:** It's not circular, it's contingent. The choice determines quality of life for whoever ends up there.

  **Alex:** But it also determines *who* ends up there. That's the hinge.

  **Sam:** So if I delay conception by a month to save money, knowing my child will have a chronic illness but still love life, I've done nothing wrong?

  **Alex:** On the person-affecting view? No. You've created a different child who has a life worth living.

  **Sam:** That's absurd.

  **Alex:** It's logical. Your absurdity is demanding a victim where there is none.

  **Sam:** My absurdity is accepting that we can knowingly build a future with more suffering and call it neutral.

  **Alex:** Call it regrettable. Don't call it wrongful.

  **Sam:** There's no practical difference.

  **Alex:** There is. One demands compensation. The other demands resignation.

  **Sam:** And you're okay with resignation?

  **Alex:** I'm okay with truth. You want morality to do work it can't do without metaphysical ghosts.

  **Sam:** I want morality to stop the leak.

  **Alex:** Then argue for the overlapping families. Or argue for the impersonal good. But don't tell me the non-existent kids are victims.

  **Sam:** I'm telling you the choice is wrong.

  **Alex:** Then you've left the person-affecting view behind.

  **Sam:** Good. It was too narrow to hold the weight of the future.

  ***

  **Where they're really disagreeing**

  The core dispute is the Person-Affecting Restriction: the claim that an act can only be wrong if it makes some particular person worse off. Alex defends this as a logical constraint on moral language; without a identifiable victim, 'wrongdoing' becomes incoherent. Sam argues that this restriction yields unacceptable conclusions in non-identity cases, implying that we cannot wrong future people by choosing policies that determine their identity while lowering their quality of life.

  It is settled among specialists that this case generates the Non-Identity Problem. It is *not* settled whether the solution is to abandon the person-affecting view (as Sam suggests), widen it to include 'possible people' (which risks collapsing into impersonalism), or accept Alex's conclusion that the act is regrettable but not wrongful. The status of the overlapping families is also contested; some argue their harm is sufficient to condemn the act, while others note this makes morality hinge on arbitrary demographic stability.

  ***

  **Best move on each side**

  **Alex:** Press the 'benefit of existence' point. If the lives are worth living, the kids themselves cannot reasonably complain they were born. To claim they are harmed is to imply they would be better off never having been, which contradicts the case stipulations.

  **Sam:** Push the 'arbitrariness' objection. It is implausible that the moral status of building a hazardous dam hinges entirely on whether the construction schedule shifts conception dates enough to change genetic identity. If the outcome is intuitively wrongful in the overlapping cases, it should be wrongful in the non-identity cases too.
