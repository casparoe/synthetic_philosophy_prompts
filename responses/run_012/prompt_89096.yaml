answer: |-
  Here is the session plan. It is designed to be adversarial but productive, leveraging the mixed audience rather than trying to homogenize them.

  ### 1. The Order of Operations (and why "Definitions First" is a trap)

  You are right. **Do not start with definitions.** If you define "preference" as *sovereign taste* and "bias" as *systematic error*, you have already answered the moral question (bias is bad, preference is neutral) before the session begins. You will spend 90 minutes defending your stipulations rather than analyzing the friction.

  **The Correct Order:**
  1.  **The Friction (Case):** Present a case where the classification is genuinely contested.
  2.  **The Failure (Taxonomy):** Let them try to sort it using standard definitions. Watch them fail.
  3.  **The Device (Tool):** Introduce your diagnostic tool to explain *why* they are stuck.
  4.  **The Boundaries (Misconceptions/Economist):** Use the tool to carve out the edge cases.
  5.  **The Open Question (Close):** Acknowledge what remains unresolved.

  **Why:** The distinction between preference and bias is not a botanical classification (two distinct species); it is a **normative status** assigned to an attitude based on context and justification. You need them to feel the *need* for the distinction before you give them the *means* to make it.

  ---

  ### 2. The Core Example: "The Language of the Table"

  **The Case:**
  A host invites a mixed group of friends to a private dinner. One guest speaks to another in a shared native language (not the host's). The host intervenes: *"In this house, at my table, we speak English. It's not a rule, it's just my preference. I find it excludes me from the flow."*

  **Why this carries the session:**
  *   **Sincere Avowal:** The host genuinely feels this is a taste/preference (flow, comfort), not a moral edict.
  *   **Reasonable Disagreement:**
      *   *Team Preference:* It's a private space; the host's comfort dictates the atmosphere.
      *   *Team Bias:* The "preference" relies on a generalization that non-English conversation is inherently exclusionary or rude, imposing a specific cultural norm as neutral.
  *   **What it lacks:** It lacks high-stakes discrimination (housing/jobs) which shuts down nuance, but it has enough social weight to feel moral.

  **Handling the Student Breakers:**
  1.  **"What if the host is lying and actually hates foreigners?"**
      *   *Move:* Bracket it. Say: *"We are analyzing the structure of the justification, not the psychic truth of the agent. Even if they are sincere, is the claim valid?"*
  2.  **"What if speaking English actually makes the conversation better?"**
      *   *Move:* Distinguish *outcome* from *attitude*. *"If it's about utility, that's an empirical claim. If it's about the right to set the norm, that's the preference/bias boundary."*
  3.  **"What if the guest is doing it intentionally to exclude the host?"**
      *   *Move:* Change the variable. *"Assume the guests are unaware. We are testing the Host's reaction, not the Guest's intent."*

  ---

  ### 3. The Device: Fixing "The Drop Test"

  Your worry is correct. The "Drop Test" (can you drop it without loss?) fails because **Moral Commitments** also resist dropping. If I say "I won't torture," I cannot drop that without felt loss and I have a justificatory story.

  **The Fix: The "Locus of Authority" Test.**
  Don't test how hard it is to drop. Test **where the justification lands.**

  *   **Preference:** The justification terminates in the **Subject**. ("I like X." / "It pleases me.")
      *   *Challenge:* "Why?" -> "No reason, just taste." (Acceptable stopping point).
  *   **Moral Commitment:** The justification terminates in **Value**. ("X is Wrong." / "It causes harm.")
      *   *Challenge:* "Why?" -> "Because it violates rights." (Acceptable stopping point).
  *   **Bias:** The justification terminates in the **Object**, but disguised as the **Subject**. ("People like *that* are just..." / "It's not how things are done.")
      *   *Challenge:* "Why?" -> "It's just unnatural/awkward/better." (Unacceptable stopping point that claims objectivity without evidence).

  **How to run it in the room:**
  When the host says "It's my preference," ask the group: *"If the host admitted 'Actually, I have no reason, I just feel uneasy,' does that make it MORE of a preference or MORE of a bias?"*
  *   If it's a preference, admitting arbitrariness should dissolve the tension.
  *   If it's a bias, admitting arbitrariness increases the tension (because it reveals the norm is unfounded).
  *   *This distinguishes Bias from Commitment.* A moral commitment cannot admit arbitrariness. A bias *fears* admitting arbitrariness.

  ---

  ### 4. The Misconceptions (Order of Arrival & Management)

  **1. "It's just Conscious vs. Unconscious." (Psych Students)**
  *   *When:* Immediately after the case.
  *   *Action:* **Squash.** Explicit bias exists. If I avow "I prefer not to hire women," that is still a bias, not a preference, in the moral sense. The distinction is about the *validity of the claim*, not the *awareness of the agent*.
  *   *Concession:* Concede that unconscious mechanisms often *drive* bias, but the *label* applies to the normative status of the output.

  **2. "Bias is Irrational, Preference is Rational." (Philosophers/Economist)**
  *   *When:* During the Device section.
  *   *Action:* **Modify.** Preferences can be irrational (intransitive). Bias is irrational in a specific way: it claims **generality** without **warrant**.
  *   *Concession:* Concede that "irrational" is too blunt. Use "Unjustified Generalization" instead.

  **3. "Preferences are Subjective so They're Immune." (Libertarians)**
  *   *When:* When discussing the Host's rights.
  *   *Action:* **Squash.** Preferences are immune to *truth* (you can't be wrong about liking cilantro), but not immune to *criticism* (you can be wrong about acting on it in a public context).
  *   *Concession:* None. This is a category error.

  **4. "It's Just Political Labelling." (Cynics)**
  *   *When:* Near the end.
  *   *Action:* **Concede the Usage, Deny the Structure.**
  *   *Script:* *"You are right that people weaponize the word 'bias' to shut down debate. That is a political move. But that doesn't mean the structural difference doesn't exist. Our job is to find the structure so we can spot the weaponization."*

  ---

  ### 5. The Economist

  **The Threat:** He will define bias as *deviation from the agent's own ranking under full information* (standard behavioral econ definition). He will argue morality is just a constraint on the utility function.

  **The Fastest Honest Counter:**
  Do not fight decision theory. Fight the **Input Legitimacy.**

  *   *Script:* *"Your definition works for internal consistency. If I prefer A to B, but choose B, that's a bias/error. But in morality, the question isn't whether I'm consistent. It's whether my preference is a **valid input** for the social calculation."*
  *   *The Trap:* Ask him: *"If my preference is to derive utility from your subordination, is that a valid preference for the model?"*
      *   If he says **Yes**: He admits the economic model is morally neutral and cannot distinguish bias from preference on its own (it just maximizes).
      *   If he says **No**: He admits there is a normative filter *outside* the agent's ranking that disqualifies certain preferences. That filter is the preference/bias distinction.
  *   *Goal:* Show him that Economics takes preferences as **given**, while Morality takes preferences as **contestable**.

  ---

  ### 6. The Closing Check

  Do not ask "What is the definition?" Ask for a **structural application.**

  **The Question:**
  *"Describe a scenario where acting on a **bias** is morally permissible, or acting on a **preference** is morally blameworthy."*

  *   *Why this works:*
      *   If they say "Bias is never permissible," they haven't understood the distinction (they've just memorized 'bias = bad').
      *   *Correct Answer Example:* "Acting on a bias is permissible if the cost of correction is impossible (e.g., split-second safety decision), provided we mitigate later." OR "Acting on a preference is blameworthy if the preference is known to rely on false facts (e.g., preferring to avoid a neighborhood based on crime stats you know are outdated)."
      *   This tests if they understand that **Preference/Bias is about the justification structure, not the moral outcome.**

  ---

  ### 7. What to Refuse to Settle (and How)

  **The Boundary Cases:**
  You will not settle whether specific real-world examples (e.g., affinity hiring, aesthetic discrimination) count as bias or preference.

  **How to say it:**
  *"We are building the caliper, not measuring the object today. If we leave here agreeing on **how to argue** about whether X is a bias, without agreeing on **whether** X is a bias, we have succeeded. If I give you a verdict on the hard cases, I'm doing your thinking for you, and the tool won't work when you leave this room."*

  **The Remedy:**
  Do not discuss how to *fix* bias. That is a separate engineering problem.
  *"Diagnosis is not treatment. We are deciding if the patient is sick, not prescribing the medicine."*

  ### Summary Timeline (90 Mins)

  *   **00-15:** **The Case.** (Language at the Table). No definitions. Just: "Host says Preference. Guest says Bias. Who is right?"
  *   **15-30:** **The Trap.** Let them define terms. Show how definitions fail to resolve the case. Introduce the **Locus of Authority Test** (The fixed Drop Test).
  *   **30-55:** **The Grind.** Apply the Test to the Case. Bring in the **Economist** (Input Legitimacy). Bring in **Psych** (Explicit vs Implicit).
  *   **55-75:** **The Breakers.** Handle the student objections (Religion, Lying, Utility). Manage the **Misconceptions** (Subjectivity, Political Labeling).
  *   **75-85:** **The Check.** The "Permissible Bias / Blameworthy Preference" question.
  *   **85-90:** **The Open.** State what is left unresolved (Boundary cases). Dismiss.
