      *   *Counter:* That defines *error*, not *bias*. If I prefer to drink poison because I like the taste, that's a preference (revealed), even if full info says I die.
      *   *The Moral Gap:* Economics deals with *efficiency* of satisfaction. Morality deals with the *legitimacy* of the satisfaction itself.
      *   *Move:* Ask him: "If my preference is to be offended by your existence, is that a valid input for the social welfare function?" If he says yes, he's a utilitarian monster (in this context). If he says no, he admits a normative filter outside of preference.

  7.  **Closing Check:**
      *   Need a question that tests structure, not definition.
      *   *Idea:* Present a case where a Bias is *useful* or a Preference is *harmful*.
      *   *Question:* "Describe a situation where acting on a bias is morally permissible, or acting on a preference is morally blameworthy." (Forces them to decouple the terms from 'good/bad' and look at the structural claim).

