          *   *Bias:* If you drop it, the *structure of the choice* feels broken, but you can't say why *without referencing the contested norm*.
          *   *Moral Commitment:* If you drop it, you feel you have done *wrong*, not just weird.
      *   *Better Device:* **The "Because" Chain.**
          *   Ask "Why?"
          *   Preference: Stops at "I like it." (Brute fact about agent).
          *   Bias: Stops at "It's just how it is" or "That's not how people like *that* are." (Brute fact about the *world/group* disguised as taste).
          *   Moral Commitment: Stops at "It causes harm/violates rights." (Brute fact about value).
      *   *Decision:* Keep the "Drop Test" but rename/tweak it to **"The Substitution Test."** Can the object of the attitude be swapped without loss of function?
          *   Preference: I prefer red wine. Swap to white? I'm sad, but dinner works.
          *   Bias: I prefer not to hire Group X. Swap to Group Y (identical qualifications)? I'm uncomfortable, implying the trait *itself* is the issue, not the fit.
          *   *Actually, let's stick closer to the user's "Repair Asymmetry" but fix the moral commitment overlap.*
          *   *Fix:* **The "Cost of Error" Test.**
          *   If I turn out to be wrong about my preference (e.g., I thought I liked cilantro, actually I don't), no harm done.
          *   If I turn out to be wrong about my bias (e.g., I thought Group X was lazy, they aren't), harm is done to *them*.
          *   If I turn out to be wrong about my moral commitment (e.g., I thought lying was okay, it's not), harm is done to *integrity/truth*.
          *   *Wait, simpler fix:* **The "Arbitrariness Tolerance."**
          *   Preference: You can admit it's arbitrary. "Why red?" "No reason."
          *   Bias: You *cannot* admit it's arbitrary without the label collapsing. "Why not Group X?" "No reason" -> Immediately sounds like bias.
          *   Moral Commitment: You *cannot* admit it's arbitrary. "Why not torture?" "No reason" -> Sounds like moral failure.
          *   *Verdict:* The user's "Drop Test" is salvageable if we distinguish **Moral Commitment** from **Bias**. Both resist dropping. But Bias *masquerades* as Preference. Moral Commitment *avows* as Obligation.
          *   *Revised Device:* **The "Masking Test."** Bias is a preference that *needs* to look like a fact. Preference is happy looking like a taste. Moral Commitment is happy looking like a law.
          *   *Let's go with the "Justification Load" fix.* Bias resists dropping *and* demands a justification that references the *object* rather than the *subject*.
