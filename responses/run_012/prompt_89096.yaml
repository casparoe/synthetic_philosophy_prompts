      *   *Conscious vs. Unconscious:* Head this off early. Bias can be avowed (explicit bias).
      *   *Rational vs. Irrational:* Concede that preferences can be irrational (preferring A>B>C>A). Bias is irrational in a specific way (systematic error + normative claim).
      *   *Subjective/Immune:* Crush this. Preferences are immune to *truth*, not *criticism* (e.g., consistency).
      *   *Political Labeling:* Concede the *usage* is political, deny the *structure* is empty.
