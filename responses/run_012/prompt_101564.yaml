answer: |-
  The clinic smelt of ozone and sterilised plastic, a scent Elias knew better than the face of the man sitting opposite him. Dr. Aris was a presence of warmth and a voice of low frequencies, but the room was defined by the hum of the server rack in the corner. For twenty-four years, that hum had been the heartbeat of Elias's world.

  He sat in the haptic rig, the black fabric of the suit clinging to his skin like a second epidermis. He knew the texture of the chair beneath him through the soles of his feet: a grid of hexagonal pressure points, familiar as a braille page. He knew the table in front of him was one metre away because the spatial audio pinged a soft *thrum* when he leaned forward.

  "Ready, Elias?" Aris asked.

  "Ready," Elias said. His hands rested on the table. He knew what was sitting there. He had shaped them himself in the modelling software an hour ago. A cube and a sphere. Perfect geometries. In the virtual space, the cube was a sharp bite of resistance against his fingertips, a sudden stop in the glide of motion. The sphere was a continuous roll, no beginning, no end.

  "Initiating the cortical link," Aris said. "Remember, it's not high fidelity. It's an edge-detection map. You won't see surfaces. You'll see where things stop."

  Elias nodded, though he knew Aris couldn't see the gesture clearly in the dim light. "Just the lines. Like the wireframe mode in the builder."

  "Exactly. Switching on now."

  There was no pain, only a sudden, violent intrusion of light.

  Elias gasped. He had expected darkness to be pushed back, but this was not daylight. It was a storm of neon scribbles against a void. The room did not appear; it erupted. Jagged green lines flickered violently, outlining the server rack, the door, the shape of Aris's head. It was coarse, stuttering like a bad connection. The lines breathed, expanding and contracting with the noise of the optical nerve firing for the first time.

  "Breathe," Aris said. His voice was now anchored to a flickering orange outline of a body.

  Elias tried to focus. In the haptic web, objects were defined by collision. If you pushed and met resistance, there was a boundary. Here, boundaries were ghosts. They hovered in front of him, disconnected from the weight he expected.

  "Look at the table," Aris instructed softly.

  Elias shifted his gaze. The table emerged as a trembling rectangle of green light. And there, resting upon it, were the objects.

  To his left, a cluster of lines forming a sharp, angular cage. To his right, a broken circle, a wobbly loop that failed to close properly due to the flicker.

  The cube. The sphere.

  His heart hammered against the haptic sensors on his chest, registering the spike as a warning vibration. He knew these shapes. He knew them in his bones. He had built them. He had touched them a thousand times in the simulation. But knowing them through the suit was a knowledge of *action*. To know the cube was to know where your finger stops. To know the sphere was to know where your hand must curve.

  This visual data was a knowledge of *distance*. It was separate.

  "Can you identify them?" Aris asked. "Don't touch. Just look."

  Elias stared. The angular cage on the left pulsed. The lines intersected at hard vertices. *Corner,* his mind supplied. *Edge.* But the visual sensation didn't feel like the tactile memory. The tactile memory was heavy, dense. The visual outline was fragile, a sketch drawn on air.

  Was that sharp intersection of green light the same thing as the sharp pressure on his thumb?

  In the virtual world, geometry was law. If the code said it was a corner, it was a corner. Here, the light flickered. The corner vanished for a millisecond and reappeared slightly to the right. It was uncertain.

  "I..." Elias started. His voice sounded thin. "The one on the left. It's... jagged."

  "It's a cube?" Aris pressed.

  Elias hesitated. This was the chasm. If he said yes, was he recognising the object, or was he guessing based on the position? He knew he'd put the cube on the left. That was memory, not vision.

  He had to know if the light *meant* the shape.

  He closed his eyes, shutting out the strobing green noise. He recalled the feel of the cube. The sudden halt. The six faces. He recalled the feel of the sphere. The endless glide.

  He opened his eyes.

  The loop on the right shimmered. It lacked vertices. It had no places where the light stopped abruptly; it merely curved back on itself.

  In the haptic suit, a curve was a change in vector over time. A corner was an immediate change in vector.

  Here, the light didn't have time. It just *was*.

  "Tell me," Aris said. "Does the sight match the touch?"

  "No," Elias whispered. "The touch is... solid. This is just a trace."

  "But do you know what they are?"

  Elias looked at the angular cage. He reached out his hand, hovering it just above the table. The haptic suit engaged, creating a phantom resistance layer so he wouldn't knock them over before he was ready.

  He looked at the green lines. He looked at his hand, outlined in similar flickering gold.

  For a lifetime, he had understood the world as resistance. Now, the world was emission. The cube wasn't pushing back against him; it was glowing at him. The philosophical knot tightened in his chest. If he called it a cube, was he translating, or was he recognising?

  If a man knows the shadow of a thing, does he know the object when the light hits it?

  "The left one," Elias said, his voice trembling. "It has... stops. The light stops."

  "Vertices," Aris supplied.

  "Yes. Stops." Elias moved his hand closer. The visual map showed his fingers approaching the green cage. The lines of his fingers overlapped the lines of the object. "The right one... it doesn't stop. It goes round."

  "So?"

  "So," Elias said. He lowered his hand. The haptic suit buzzed as his fingertips made contact with the physical plastic of the cube. The cold hardness shot up his arm, instant and absolute.

  At the exact moment of touch, the green lines of the visual map flared brighter, syncing with the pressure sensor.

  For a split second, the two worlds collided. The ghost wireframe snapped onto the physical resistance. The visual 'stop' and the tactile 'stop' became one event.

  "It's a cube," Elias said, exhaling a breath he felt he'd been holding for twenty-four years. "But I didn't know it was a cube until I touched it. The eyes... they just saw the blueprint."

  Aris leaned forward, the orange outline of his face intensifying. "But you knew which one to touch."

  Elias looked at the flickering lines again. They were already beginning to fade as the neural load balanced out.

  "I knew where the corners were," Elias said. "But I didn't know what a corner looked like until it felt like a corner again."

  He sat back, the green storm settling into a dull hum. He had seen the shape, but he had only recognised it when the world pushed back. The sight was a promise; the touch was the contract.

  "Turn it off," Elias said softly. "Please. It's too quiet without the resistance."

  Aris reached for the console. The green lines vanished. The darkness returned, heavy and familiar and true. Elias rested his hands on the table, finding the hexagonal grid of the chair, finding the hard edge of the cube, and finally, he felt safe. He could see nothing, but he knew exactly where he was.
