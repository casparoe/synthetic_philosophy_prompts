prompt: |-
  I have just come away from a long argument with a friend about Molyneux’s problem—whether someone born blind, who has learned to tell a sphere from a cube by touch, could recognise either by sight alone after gaining vision. Our dispute concerned a variant that I think deserves a story rather than a treatise: imagine a person who has spent their whole life navigating a virtual world through a haptic suit and spatial audio, and who then receives a visual prosthesis that delivers only a coarse, flickering edge-map. Write a short story that dramatises this variant, keeping the philosophical pressure on the moment of first visual recognition without turning into a lecture. Please write in British English.
