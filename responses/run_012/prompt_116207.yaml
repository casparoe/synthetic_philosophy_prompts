      *   *Trade-offs:* Invariance vs. Specificity. If you allow *too* much variation (Family Resemblance), you can't reject the mirrored version. If you require strict structure (Skeleton), you struggle with filled counters or blackletter. Learnability vs. Historical Coverage.

  5.  **Identifying the "Killer" Constraint:**
      *   Which one rules out the most candidates?
      *   *Generative Consistency (Style)* is very strong. Prototype theory struggles here (why does *this* prototype imply *that* 'b'?). Motor program struggles (why does a printed 'a' share style with a printed 'b' if no motor action produced it?).
      *   *Transformation Limits* is also strong. Template matching fails here immediately.
      *   *Decision:* The "Transformation Limits + Generative Consistency" combo is the hardest. But if I have to pick one that kills the most simple theories, it's **Generative Consistency (The Style Constraint)**. It forces the theory to be structural/relational, not just perceptual.
      *   *Wait, actually:* The distinction between **Identity vs. Typeface** is the one that kills the "Skeleton" theory if the skeleton *is* the typeface. But the "Cyrillic/Schwa" case (Semantic Intent) kills purely visual theories.
      *   *Refinement:* The hardest requirement is **D5 (Cross-Character Disambiguation)** combined with **D8 (Style)**. Purely visual theories fail D5. Purely structural theories struggle with D8.
      *   *Let's pick D8 (Generative Consistency)* as the most theoretically demanding regarding the *nature* of the representation. It requires a grammar, not just a classifier.

  6.  **Scoring the Theories (Briefly):**
      *   *Template Matching:* Fails variation, rotation, style.
