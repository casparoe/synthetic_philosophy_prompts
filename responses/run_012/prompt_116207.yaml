          *   *Constraint:* Keep the weight on the criteria (the user will do the scoring argument themselves).

  2.  **Deconstruct the Core Problem:**
      *   This is a classic problem in semiotics, cognitive science, and typography. It touches on *type-token distinction*, *categorical perception*, *generative grammar of form*, and *embodied cognition*.
      *   The user wants a "spec," not a solution. They want to know *what the test is*, not *who passed it*.
      *   The "Style" constraint (Hofstadter) is crucial. It links letter identity to *systematicity*. An 'a' isn't just an 'a'; it's an 'a' *in a specific style* that implies a specific 'b'.

  3.  **Drafting the Desiderata (The Spec):**
      *   *D1: Robustness to Variation.* Must handle the standard typographic variations (single/double story, serif/sans, weight, slant).
      *   *D2: Degradation Tolerance.* Must handle noise (photocopies, ink bleed, filled counters).
      *   *D3: Transformation Limits.* Must distinguish valid transformations (scaling, slight rotation) from invalid ones (mirroring, 180-degree rotation). *Crucial distinction.*
      *   *D4: Context Sensitivity.* Must handle cases where identity depends on neighbors (ligatures, contextual alternates).
      *   *D5: Cross-Script/Cross-Character Disambiguation.* Must distinguish Latin 'a' from Cyrillic 'а' or Schwa 'ə' despite visual identity. *This implies history/intent matters.*
      *   *D6: Identity vs. Quality.* Must distinguish "is an a" from "is a *good* a." (Badly drawn 'a' is still an 'a').
      *   *D7: Identity vs. Typeface.* Must distinguish "this is an a" from "this is a Bodoni a." (Token vs. Type + Style).
      *   *D8: Generative Consistency (The Hofstadter Constraint).* If I see an 'a', 'b', 'c' in a new style, I expect the 'd' to match. The theory must explain where the stylistic constraint comes from.
      *   *D9: Learnability.* Humans learn this from few examples. The theory shouldn't require a million labeled images.

