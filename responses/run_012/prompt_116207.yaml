          *   Include hard cases (mirrored, rotated, Cyrillic lookalike, schwa, contextual dependency, stretched logo).
          *   Include necessary distinctions (identity vs. quality, identity vs. typeface, identity vs. legibility, identity vs. similarity).
          *   Address *Style* (Hofstadter's *Letter Spirit* problem: consistency across an alphabet).
          *   Evaluate which requirements are "real" vs. "prejudices."
