          *   *Severity:* High. If shame is necessary for the "work that cannot be done" (c), how can we choose to foreground only guilt (e)?

  4.  **Evaluate the "Single Revision" Option:**
      *   *Option 1: Drop (a) and (b).* Admit both have roles. Cost: Loses the clear moral hierarchy the user wants to defend.
