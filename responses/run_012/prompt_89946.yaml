      *   (c) *Empirical/Functional Claim:* Witness half (shame-adjacent) does necessary work ledger half (guilt) cannot (identity change vs. debt settlement). Shame is "fitting" for certain wrongs.
      *   (d) *Meta-Ethical/Sociological Claim:* Emotions are cultivated/trained, not natural givens.
      *   (e) *Political/Normative Claim:* Cultures can choose which emotion to foreground. If (a) is right, choose guilt.
      *   (f) *Anti-Consequentialist Claim:* Don't choose based on behavioral compliance/outcomes (shame might win there). Choose based on moral correctness.

