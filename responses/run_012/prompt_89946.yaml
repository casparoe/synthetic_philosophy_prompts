      *   *The Real Pivot:* The conflict between (a)/(b) [Guilt Good, Shame Bad] and (c) [Shame Necessary for Identity Change].
      *   *Revision:* Acknowledge that "Shame" in (b) is *external/heteronomous* shame (fear of judgment), while "Shame" in (c) is *internal/autonomous* shame (disappointment in self).
      *   *Alternative Revision:* Admit that (a) is too strong. Guilt is better for *transactions*, Shame (of a specific kind) is better for *transformation*.

  5.  **Address the (d) vs. (a) Worry:**
      *   Does social construction undercut normative superiority? No. Justice is socially constructed (laws, courts), but we can still say it's "better" than vengeance. The *origin* doesn't dictate the *value*. However, it does mean (a) needs to be defended on *consequences for human flourishing*, not on "naturalness."

