      *   **The Puzzle:**
          *   Urn: 300 balls.
          *   Known: 100 Red.
          *   Unknown: 200 are Blue or Green.
          *   Adversary: A selector fixed the Blue/Green proportion *knowing how you would bet* and is paid *only if your bet loses*.
          *   Action: Stake on Red, Blue, or Green. Payoff fixed multiple if correct.
          *   Option: Pay a small fee to see one ball drawn.
          *   Catch: The selector decides if the shown ball is genuine or a decoy (chosen to mislead). You know this might happen.
      *   **Key Themes to Cover:**
          *   Representation of credences (single vs. set).
          *   Second-order distribution vs. set of priors.
          *   Decision rules (Maximin, E-admissibility, etc. vs. Max Expected Utility).
