      *   **Constraint 7 (No Outside Reading):** Rely on course concepts.

  2.  **Deconstruct the Mathematical/Philosophical Problem:**
      *   *Standard Hilbert Hotel (1 new guest):* Guest $n \to n+1$. Displacement = 1. This is allowed under the new rule.
