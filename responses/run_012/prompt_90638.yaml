      *   *Key Insight:* The set-theoretic fact ($\aleph_0 + \aleph_0 = \aleph_0$) remains true, but the *operational* capacity is limited by the metric/topology of the integers. The "Hotel" metaphor conflates cardinality with physical contiguity.

  5.  **Developing the Marking Scheme:**
      *   Need 5 distinct points, 4 marks each.
