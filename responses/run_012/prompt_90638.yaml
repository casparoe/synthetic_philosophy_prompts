answer: |-
  **Exam Question: The Bounded-Displacement Hotel**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Your response should demonstrate a clear understanding of set-theoretic infinity, the distinction between mathematical existence and physical procedure, and the philosophical implications of constraints on mappings. No outside reading is required.

  **Question:**
  Consider the standard Hilbert's Hotel, fully occupied by a countably infinite set of guests in rooms numbered $\mathbb{N} = \{1, 2, 3, \dots\}$. The hotel management adopts a new union rule: **No guest may be moved more than one room away from their original assignment.** That is, if a guest starts in room $n$, they must end up in room $n-1$, $n$, or $n+1$ (ignoring boundary conditions at room 1 for simplicity).

  1.  Under this constraint, can the hotel accommodate a new *infinite* busload of countably many guests? Explain why or why not, contrasting this with the standard solution for accommodating one new guest versus infinitely many new guests.
  2.  Does the failure to accommodate the infinite bus under this rule undermine the standard set-theoretic claim that an infinite set can be put into a one-to-one correspondence (bijection) with a proper subset of itself?
  3.  How might a philosophical finitist utilize this scenario to argue against the physical coherence of "actual infinity"?

  ***

  **Model Answer**

  Under the new union rule, the hotel cannot accommodate an infinite busload of new guests. While the standard Hilbert's Hotel paradox relies on the abstract properties of cardinality, the union rule introduces a topological or metric constraint on the *process* of rearrangement that reveals a tension between set-theoretic existence and procedural realizability.

  To understand the failure, we must distinguish between the two standard accommodation procedures. To accommodate one new guest, we move guest $n$ to $n+1$. This requires a displacement of exactly 1 for every guest, which satisfies the union rule. However, to accommodate $\aleph_0$ new guests, the standard solution moves guest $n$ to $2n$, freeing all odd-numbered rooms. This requires a displacement of $n$. As $n$ approaches infinity, the displacement becomes unbounded. The union rule forbids unbounded displacement; it requires the mapping function $f(n)$ to satisfy $|f(n) - n| \le 1$. If every existing guest remains within distance 1 of their origin, the "density" of occupied rooms remains asymptotically 1. One cannot create $\aleph_0$ empty slots (a density of 0.5 or less) without moving some guests arbitrarily far away. Therefore, while the rooms exist, the *local* shuffling permitted by the union cannot generate the necessary global gaps.

  This limitation does not undermine the set-theoretic claim that an infinite set can be put in bijection with a proper subset. Cantor's definition of infinite sets relies on the *existence* of a bijective function, not on the physical feasibility of implementing that function via a bounded process. The function $f(n) = 2n$ is a valid mathematical bijection from $\mathbb{N}$ to the even numbers, regardless of whether physical guests can traverse the distance. The union rule restricts the class of *admissible procedures*, not the class of *mathematical functions*. The scenario highlights that Hilbert's Hotel is often taught as a physical metaphor for a non-physical concept. The "paradox" dissolves when we recognize that cardinality is invariant under bijection, but "physical accommodability" is sensitive to the metric constraints of the rearrangement. The set-theoretic truth remains: $|\mathbb{N}| = |2\mathbb{N}|$. The operational truth is: You cannot transform $\mathbb{N}$ into $2\mathbb{N}$ via a bounded permutation.

  A philosophical finitist would seize upon this distinction to argue that "actual infinity" is physically incoherent. A finitist, skeptical of completed infinite totalities, might argue that if a property of infinity (like accommodating more guests) relies on processes that cannot be completed or bounded in the physical world, then the infinity is merely potential, not actual. They would argue that the standard set-theoretic view ignores the "cost" of the mapping. If a rearrangement requires infinite energy or infinite displacement, it is not a valid operation in a concrete universe. The bounded-displacement constraint aligns better with a finitist intuition: that operations should be local and bounded. For the finitist, the failure of the hotel under the union rule demonstrates that while we can write down symbols for infinite bijections, we cannot enact them. Thus, the scenario supports the finitist claim that mathematical existence should be tethered to constructibility or physical realizability. If the hotel cannot physically shuffle the guests to make room, the claim that "there is room" is merely a linguistic trick of set theory, not a description of reality.

  In conclusion, the bounded-displacement constraint breaks the physical metaphor of the hotel without breaking the mathematics of cardinality. It forces a separation between the abstract existence of a bijection and the procedural constraints of implementing one, providing fertile ground for finitist critiques of platonistic set theory.

  ***

  **Marking Scheme**

  **Total Marks:** 20 (5 Criteria × 4 Marks)

  | Criterion | Description of Full Credit (4 Marks) | Common Error / Deduction Note |
  | :--- | :--- | :--- |
  | **1. Verdict & Mathematical Intuition** | Clearly states the hotel **cannot** accommodate the infinite bus under the constraint. Explains that bounded displacement preserves room density/occupancy ratios. | Students often answer "Yes" by ignoring the constraint and reciting the standard $n \to 2n$ solution. |
  | **2. Comparison of Shifts** | Correctly contrasts the 1-guest shift (displacement = 1, allowed) vs. the $\infty$-guest shift (displacement = $n$, unbounded/forbidden). | Students fail to calculate or mention the specific displacement distances involved in each standard solution. |
  | **3. Bijection Principle Defense** | Argues that the set-theoretic claim is **not** undermined. Distinguishes between the *existence* of a function and the *physical constraints* on implementing it. | Students claim the failure proves Cantor wrong or that the sets are no longer the same size cardinally. |
  | **4. Finitist Interpretation** | Accurately describes the finitist reaction: using the physical impossibility to argue against "actual" infinity or for constructibility constraints. | Students describe finitism as simply "disliking infinity" without connecting it to the procedural/physical constraint of the prompt. |
  | **5. Synthesis (Bijection vs. Procedure)** | Explicitly identifies the core philosophical crux: the gap between abstract mathematical mappings and bounded physical procedures (topology vs. cardinality). | Students treat the problem as purely arithmetic without addressing the philosophical distinction between mapping and moving. |
