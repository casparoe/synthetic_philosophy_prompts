      *(Self-Correction during drafting)*: I need to make sure the mathematical reasoning for *why* it fails is clear but not requiring heavy analysis. It's about the "pigeonhole" intuition over infinite ranges. If everyone moves at most 1 spot, you can free up at most a finite number of rooms in any finite segment, so you can't create an infinite gap.
      *Actually, a stronger argument:* If $f(n)$ is the new room of guest $n$, and $|f(n) - n| \le 1$, then the image of $\{1, ..., N\}$ is contained in $\{1, ..., N+1\}$. You can't map the existing guests into a subset that leaves $\aleph_0$ holes without moving some guests arbitrarily far.
      *Wait, simpler:* To fit $\aleph_0$ new guests, you need $\aleph_0$ empty rooms. If every current guest $n$ occupies a room in $[n-1, n+1]$, then for any $K$, the rooms $1$ to $K$ are mostly occupied. Specifically, you cannot create an infinite set of empty rooms if the displacement is bounded.
