prompt: |-
  You're an expert in philosophy of mathematics and a very careful exam writer. I'm on the comittee writing the final for an upper-level course on infinity, and I want one essay question that can't be answered by reciting the usual Hilbert's hotel spiel. Here's the hook I want to build it around: the hotel adopts a new union rule that no guest may be moved more than one room from their original room. Ask students whether the hotel can still accommodate infinitely many new guests, and what that shows about the difference between the standard one-guest shift and the infinite-guest shift where everyone moves to an even-numbered room. Then get them to say whether this undermines the claim that an infinite set can be put in bijection with a proper subset, and how a finitist might react. Please think carefully and maybe brainstorm the possible answers before you write. Give me the question itself, a model answer of about 700 words, and a marking scheme with five must-hit points worth 4 marks each, total 20, plus a one-line note for each point on how students typically get it wrong. The question should be answerable in 90 minutes by a strong undergrad or MA student, and it shouldn't require any outside reading. Make the crux the bounded-displacement constraint and what it reveals about bijections vs. procedures, not just the definition of countable. Avoid asking for citations or names of papers.
