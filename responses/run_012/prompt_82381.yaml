answer: |-
  You haven't mislabeled the naturalist position; you've accurately identified its Achilles' heel. The definition you're hearing is Christopher Boorse's Biostatistical Theory (BST), the dominant **naturalist** account (the view that disease is a value-free biological fact). Boorse argues disease is a deviation from "species-typical functional organization." But as you've discovered, "typical" depends entirely on who you compare the patient to. This is the **reference class problem**.

  Here is the conceptual knot you are untangling. For a naturalist, a healthy heart pumps blood efficiently compared to other healthy hearts. But to define "healthy hearts," you must select a **reference class**—a group of similar organisms. Everyone agrees on age and sex. But what about environment? If you include the coal miners in the reference class, their damaged lungs are statistically normal. If you exclude them as "environmentally damaged," you have to explain why their dust exposure counts as an external anomaly rather than a typical condition for humans living in industrial zones.

  The naturalist wants to say disease is objective, like a broken engine. But choosing the reference class is itself a value judgment. If you define the class as "all humans," normal variations (like being short) look like diseases. If you define it as "coal miners," pathologies look like adaptations. There is no biological rulebook that tells us where to draw the line between "species design" and "environmental wear." When clean-air laws improve lung capacity over decades, the biology of the fifty-year-old hasn't changed, but his reference class has. Under strict naturalism, he becomes "diseased" relative to the new norm without any physiological change. This reveals that the "fact" of disease is partially constructed by the population we choose to measure.

  This instability is why guideline committees can turn millions into patients overnight by nudging a blood-pressure cutoff. A naturalist struggles to explain this without admitting that "disease" is partly a policy decision. If the biology is identical, why is the person diseased today but not yesterday? Usually, naturalists argue that the *risk* of future dysfunction has changed, but this smuggles in probabilistic values about what level of risk is acceptable.

  Does the **normativist** side escape cleaner? Normativists argue disease is not a biological fact but a value judgment: a condition is a disease only if it is harmful or undesirable enough to warrant intervention. This handles the guideline shifts easily: we lowered the blood-pressure threshold because we decided the risk was socially unacceptable, not because biology changed.

  However, the normativist hits a wall with your coal town. If disease requires a judgment of "harm," and the miners don't feel harmed (it's just "what a body does"), is it a disease? A sophisticated normativist will say yes, citing *objective* harm (tissue damage, reduced lifespan) rather than subjective feeling. But this risks paternalism: declaring people sick against their own lived experience because experts decide their biology is "bad." Furthermore, if disease is just "what we decide to treat," then a condition becomes a disease only when a treatment exists. This makes disease dependent on pharmaceutical innovation rather than human suffering.

  Neither side offers a clean exit. Naturalism promises objectivity but collapses when selecting the reference class requires moral choices about which environments are "normal." Normativism accepts the moral weight but struggles to explain why some conditions are diseases even when no one wants to treat them, or when the "harm" is invisible to the patient. The definition of disease remains a hybrid: a biological malfunction identified through a lens of social values. You are not hitting a wall because you're asking the wrong questions; you're hitting the wall because the concept itself is structurally unstable.

