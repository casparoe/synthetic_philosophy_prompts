answer: |-
  **The Scenario**

  Two boutique consulting firms, Apex and Bolt, are competing for a lucrative contract with a large Client. The Client states that the project requires access to a proprietary, non-transferable security certification that costs $50,000 and takes a week to procure. The Client hints they will award the contract to the first firm that demonstrates "full commitment" by purchasing the certification, implying the other will be disqualified. Both firms fear that if they hesitate, the competitor will buy in first and lock them out. Apex races to purchase the certification before Bolt, burning the $50,000 to signal dedication and secure the position.

  However, once Apex holds the certification, the dynamic flips. The Client knows Apex's certification is useless for any other project and cannot be refunded; Apex is now locked in and cannot walk away. The Client exploits this by slashing the offered fee by 40%, knowing Apex must accept to recoup costs. Bolt, having lost the race to commit, remained flexible. Seeing Apex trapped, Bolt pitches a alternative methodology that doesn't require the certification. The Client, preferring the lower cost and flexibility, awards the contract to Bolt. Apex won the commitment race but ended up with a sunk cost and no contract, while Bolt lost the race but kept the profit.

  **The Walkthrough**

  For Apex, the commitment device is the **non-refundable purchase of the proprietary certification**. Timing matters because the Client's rule is explicitly "first to commit wins the opportunity." By moving first, Apex intends to signal reliability and exclude Bolt. The payoffs are skewed: Apex is tempted to jump because the cost of losing the contract (lost revenue) seems higher than the cost of the cert, assuming standard terms. However, the **first-mover curse** arises because the commitment eliminates Apex's **threat point**—the ability to walk away. In standard commitment races (like Chicken), locking in forces the *other* party to yield. Here, locking in forces *yourself* to yield to the Client's renegotiation because you have no exit option.

  The one feature that turns the race into a trap is **asymmetric lock-in relative to the counterparty**. Apex is locked to the Client, but the Client is not locked to Apex. If you remove this feature—say, by making the certification refundable or having a signed price agreement *before* purchase—the trap collapses. If Apex could walk away, the Client couldn't lowball, and committing first would successfully lock out Bolt, returning us to the standard "precommitment is good" story. The trap exists only because the commitment binds the agent to the principal without reciprocal binding.

  **The Steelman**

  A defender of precommitment would argue that **Apex failed to structure the deal, not the strategy.** Their best line of attack is that the lock-in wasn't truly irreversible because a rational actor would never burn bridges without a signed contract in hand. They would claim Apex should have demanded a letter of intent or a penalty clause for Client withdrawal before buying the cert. If Apex had done this, the commitment would have been safe, and the first-mover advantage would have held.

  However, this attack is wishful thinking in the context of a race. The Client's demand ("buy first, talk later") creates the time pressure that defines the race. If Apex pauses to negotiate legal protections, Bolt buys the cert and wins the exclusivity. The steelman assumes cooperation or leverage that the race structure deliberately destroys. In a true commitment race, the speed required to win precludes the safeguards that make commitment safe, meaning the trap is inherent to the race conditions, not just poor execution.
