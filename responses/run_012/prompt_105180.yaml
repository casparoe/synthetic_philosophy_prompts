prompt: |-
  Give me an example of a conceptual issue that only really turns up for the inefficacy objection when the collective harm is held in place by a shared expectation rather than by a pile-up of individual contributions — the kind of case where no single person's act changes the outcome, where everyone stopping would collapse the practice, and where the practice is itself what makes it rational for each person to keep going. I want a concrete case (make one up if you like, and please skip the climate / voting / meat trio, I've read all that), and I want it to actually strain the standard rescues rather than just get waved at by them: the "you're a tiny but real cause" move, the complicity move, and the "we ought to act jointly" move. Show me exactly where each one slips. Finish by saying how confident you are in the whole analysis and which single step your least sure about.
