answer: |-
  The interface was designed to look like a banking app. Soft blues, rounded corners, a progress bar that suggested a transaction rather than an execution. Elara sat in the booth, the haptic gloves heavy on her hands. Through the glass wall of the Vicarious office, the city hummed, indifferent.

  Inside the booth, the air was recycled and cool. On the screen, the target profile rotated: Kaelen Vross. He was barricaded in the substation, fingers hovering over the override that would vent neurotoxin into the Hearth Center's ventilation system.

  "Authorization pending," the Agent said. He was a young man in a grey suit, holding a tablet, not looking at her. He was the instrument. She was the will. That was the legal fiction, and the moral buffer. "The fee covers extraction, neutralization, and disposal. The liability waiver is on page four."

  Elara didn't turn the page. She stared at the live feed from the Hearth Center. It was a community hub. She knew the people in the frame. There was Mr. Henderson, who fed the stray cats behind the loading dock. There was Sarah, who was six months pregnant and taught watercolor on Tuesdays. There was the noise of children in the gymnasium.

  If Kaelen turned the valve, they died. If Elara signed the waiver, Kaelen died.

  The door to the booth slid open. Julian stepped in, out of breath. He didn't look at the Agent; he looked at Elara's hands.

  "Don't," he said.

  Elara's finger hovered over the biometric scanner. "There are three hundred people in that room, Julian."

  "There are three hundred reasons to keep your soul intact," Julian said. He leaned against the glass, blocking her view of the city. "If you sign this, you're a murderer. Vicarious just processes the paperwork."

  "I'm not pulling the trigger."

  "You're paying for the bullet. You're the principal. The law says you're a client, but God isn't bound by contract law." Julian's voice was tight, not with anger, but with a desperate kind of arithmetic. "Look at the feed, Elara. That's Sarah. She's painting right now. If you don't sign, she stops painting."

  "If I do sign, Kaelen stops breathing."

  "Kaelen is going to kill them."

  "Kaelen *might* kill them. He hasn't turned the valve. He's making a demand. We don't know if he'll follow through." Elara pulled her hand back from the scanner. The blue light faded. "I have lived my life believing there are things we do not do. We do not use people as means to an end. Even to save others."

  Julian pushed off the glass, stepping into her personal space. The scent of rain clung to his coat. "That is a luxury belief. It's a belief for people who aren't watching their friends die on a screen." He pointed at the monitor. "Your scruples are costing them their lives. You are trading their blood for the cleanness of your own hands."

  "It's not about cleanness," Elara said, her voice quiet. "It's about the world we live in. If I authorize this, I validate the idea that some lives can be spent to save others. I make myself the accountant of human worth."

  "You're making yourself a bystander to a massacre," Julian snapped. "Is that the better world? One where you can sleep at night because you didn't technically pull the trigger, while three hundred bodies cool in the gym?"

  The Agent cleared his throat. It was a polite, bureaucratic sound. "Time is a factor. The window for a clean interception is closing. If you choose not to proceed, please state it for the record."

  Elara looked at her gloves. They were black, textured for grip. If she touched the scanner, the system would log her biometric hash. She would be the requester. The Vicarious operative in the field—the one actually holding the rifle on the substation roof—would be the executor. The law treated them differently. The operative was a service provider; Elara was a consumer.

  But the blood would be the same.

  "Julian," she said, not looking up. "If I do this, I cross a line. I become the kind of person who orders deaths to fix problems."

  "You're already the kind of person who watches deaths to avoid ordering them," Julian said. "Which one is worse? The one who acts, or the one who lets it happen because acting is ugly?"

  "The one who acts breaks the constraint," Elara said. "The constraint is the only thing keeping us from barbarism. If we say killing is okay when the numbers work out, then we're just butchers with calculators."

  "And if we say killing is wrong even when it saves everyone?" Julian leaned in, his voice dropping to a harsh whisper. "Then we're martyrs with blood on our aprons. You talk about barbarism. What do you call letting Sarah die so you don't have to be a killer?"

  "It's not about me," Elara said, though she knew it was. It was entirely about her. It was about the integrity of her own agency. If she ordered the hit, she weaponized her will. She turned a human being into an obstacle to be removed. That was the violation. The consequence—the death count—was secondary to the act itself. But looking at Sarah's face on the screen, the secondary felt primary.

  The Agent tapped his tablet. "Thirty seconds to optimal trajectory."

  Elara thought of Mr. Henderson's cats. Who would feed them? The thought was trivial, absurd, and devastatingly human. It wasn't about the number three hundred. It was about the specific, messy continuity of lives that would be severed.

  But Kaelen was a life too. A messy, broken one.

  "If I sign," Elara said, "does it make it right?"

  "No," Julian said. "It makes it done."

  "And if I don't?"

  "Then it happens to them." Julian gestured at the screen. "You want to keep your conscience clean. That's what this is. You're protecting yourself from the stain of killing. But the stain is already here. It's just on the floor of the Hearth Center instead of your hands."

  "Maybe," Elara said. "Or maybe the stain on my hands is the only thing that proves I'm still human. If I wash it away by calling it a 'service,' what am I?"

  "You're a survivor," Julian said. "And you're a savior. Don't you dare make this about your purity."

  The timer on the screen ticked down. *00:15.*

  The Agent waited, pen poised. He didn't care. To him, this was a line item. A service rendered. The moral weight was entirely hers. That was the product she was buying: the transfer of agency. She could pay to have the sin committed in her name but not by her hand.

  Was that a loophole? Or was it a deeper corruption? To outsource the violence was to admit that the violence was necessary, but that she was too good to perform it. It was aristocracy of the soul.

  *00:10.*

  Sarah moved in the video feed. She laughed at something a child said. The sound was muted, but Elara saw the tilt of her head.

  *00:05.*

  Elara placed her hand on the desk. She didn't move it toward the scanner. She didn't pull it away. She looked at Julian. He looked back, his eyes hard, waiting for the betrayal or the salvation.

  "If I do this," Elara said, "I save them. But I break the rule that says we don't do this."

  "If you don't," Julian said, "you keep the rule. And you lose them."

  *00:03.*

  The booth felt very small. The air felt very thin. Elara realized that whichever choice she made, she would be walking away from the person she thought she was. Either she would be a killer who bought a clean gun, or a witness who let the world burn to keep her hands white.

  *00:01.*

  Elara closed her eyes. She pressed her palm down.

  The screen didn't say *Confirmed*. It didn't say *Cancelled*. It simply went black, reflecting her own face back at her, pale and unresolved, while outside the glass, the city lights flickered on, one by one, indifferent to the dark gathering in the room.
