answer: |-
  # DECISION TREE: WHAT DOES THE EU ARGUMENT ESTABLISH?

  **START:** *The standard argument that rational agents must maximize expected utility seems basically right.*

  **NODE 1: Belief Ontology**
  Does the agent need *actual* psychological degrees of belief, or just preferences that act *as if* they had them?
  *   **Actual:** Go to Node 2.
  *   **As-If:** Go to Node 2 (Instrumentalist Path).

  **NODE 2: Axiom Normativity**
  Are the preference axioms (Completeness, Transitivity, etc.) strict requirements of rationality, or just modeling idealizations?
  *   **Strict:** Go to Node 3.
  *   **Idealization:** Go to Node 3 (Model-Only Path).

  **NODE 3: Violation Consequence**
  If an agent violates the axioms, are they *exploitable* (sure loss via money pump/Dutch book) or merely *defective* (incoherent/inaccurate)?
  *   **Exploitable:** Go to Node 4.
  *   **Defective:** Go to Node 4 (Normative-Only Path).

  **NODE 4: Evaluation Target**
  Does the requirement to maximize EU apply to *individual choices* as made, or *policies* adopted in advance?
  *   **Individual Acts:** Go to Node 5.
  *   **Policies/Plans:** Go to Node 5 (Plan-Based Path).

  **NODE 5: Value Comparability**
  Must all values be tradable against each other (finite/Archimedean), or can some be absolute/lexical (no trade-off)?
  *   **Tradable:** Go to Node 6.
  *   **Lexical/Infinite:** **LEAF A**

  **NODE 6: Risk Sensitivity**
  Does rationality care only about final outcomes, or also about the *structure* of the gamble (how risk is weighted)?
  *   **Outcomes Only:** Go to Node 7.
  *   **Risk Structure:** **LEAF B**

  **NODE 7: Probability Precision**
  Must beliefs be precise single numbers, or can they be sets/ranges (imprecise probabilities)?
  *   **Precise:** **LEAF C**
  *   **Imprecise:** **LEAF D**

  ---

  ### THE LEAVES (Specific Views)

  **LEAF 1 (Path: Actual, Strict, Exploitable, Acts, Tradable, Outcomes, Precise)**
  *   **View:** **Orthodox Bayesianism**
  *   **Claim:** Rationality requires precise credences and maximizing EU on every act to avoid sure loss.
  *   **Awkward Commitment:** Requires agents to have opinions on every trivial proposition (e.g., number of grains of sand on Mars).

  **LEAF 2 (Path: As-If, Idealization, Defective, Acts, Tradable, Outcomes, Precise)**
  *   **View:** **Friedman-Savage Instrumentalism**
  *   **Claim:** EU is merely a predictive tool; 'rationality' is just how well the model fits behavior.
  *   **Awkward Commitment:** Makes 'irrationality' impossible to identify in real humans, only model error.

  **LEAF 3 (Path: Actual, Strict, Defective, Acts, Tradable, Outcomes, Precise)**
  *   **View:** **Epistemic Utility Theory**
  *   **Claim:** Violating axioms makes your beliefs inaccurate, even if no one exploits you.
  *   **Awkward Commitment:** Conflates pragmatic decision-making with truth-seeking accuracy.

  **LEAF 4 (Path: Actual, Strict, Exploitable, Policies, Tradable, Outcomes, Precise)**
  *   **View:** **Plan-Based Rationality**
  *   **Claim:** You are rational if your *plan* maximizes EU, even if token acts deviate due to weakness.
  *   **Awkward Commitment:** Requires a mechanism to bind your future self against future preferences.

  **LEAF 5 (Path: Actual, Strict, Acts, Lexical/Infinite)**
  *   **View:** **Lexical Decision Theory**
  *   **Claim:** Some values (e.g., torture vs. dust specks) cannot be traded off via finite utilities.
  *   **Awkward Commitment:** Violates the Continuity axiom; implies you should pay any finite cost to avoid a lexical bad.

  **LEAF 6 (Path: Actual, Strict, Acts, Risk Structure)**
  *   **View:** **Risk-Weighted EU (Buchak)**
  *   **Claim:** Rational agents can care about the spread of risk, not just the weighted average outcome.
  *   **Awkward Commitment:** Violates the Sure-Thing Principle; leads to dynamic inconsistency without resolute choice.

  **LEAF 7 (Path: Actual, Strict, Acts, Imprecise)**
  *   **View:** **Imprecise Probabilism**
  *   **Claim:** Rationality permits sets of probabilities when evidence is sparse.
  *   **Awkward Commitment:** Often yields no unique rational choice (radical indeterminacy) in hard cases.

  **LEAF 8 (Path: Actual, Strict, Exploitable, Acts, Infinite)**
  *   **View:** **Non-Archimedean EU**
  *   **Claim:** Utilities can be infinite or hyperreal numbers to handle Pascal's Wager-type cases.
  *   **Awkward Commitment:** Vulnerable to "Pasadena Paradox" style games where expected utility is undefined.

  **LEAF 9 (Path: As-If, Strict, Exploitable, Acts, Tradable, Outcomes, Precise)**
  *   **View:** **Pragmatic Dutch Bookism**
  *   **Claim:** Beliefs are just betting dispositions; irrationality *is* susceptibility to sure loss.
  *   **Awkward Commitment:** Implies an isolated agent with no betting partners cannot be irrational.

  **LEAF 10 (Unoccupied Combination)**
  *   **View:** **Strict Idealization**
  *   **Claim:** Axioms are mere idealizations but violations guarantee exploitation.
  *   **Status:** **INCOHERENT.** If axioms are just idealizations (Node 2), violation shouldn't guarantee pragmatic loss (Node 3).

  ---

  ### META-ANALYSIS FOR DISCUSSION

  **1. Unoccupied Combinations:**
  *   **Strict Idealization + Exploitable:** (See Leaf 10). This combination is rarely defended because it contradicts itself: if the axioms are merely modeling tools (idealizations), failing them shouldn't entail a pragmatic penalty (exploitation). It is **incoherent** to claim a model's simplification error guarantees a money pump.
  *   **As-If + Strict + Real Sanction:** Views that treat beliefs as fictional (As-If) but punish agents realistically (Exploitable) are **unattractive**. Why punish an agent for failing to match a fiction?

  **2. Indistinguishable Leaves:**
  *   **Orthodox Bayesianism (Leaf 1) vs. Pragmatic Dutch Bookism (Leaf 9):** Your tree cannot separate these based on *behavior* alone. Both demand precise credences and EU maximization on acts. They only differ on *why* (truth-apt beliefs vs. betting dispositions). A student would need to ask about the *metaphysics of belief* to tell them apart.

  **3. The "Standard" Path:**
  *   The path **Actual → Strict → Exploitable → Acts → Tradable → Outcomes → Precise** (Leaf 1) is the "Orthodox" default. Every other leaf represents a specific cost paid to solve a paradox (e.g., Leaf 6 solves Allais but loses Independence; Leaf 7 solves Ellsberg but loses Decisiveness).
