prompt: |-
  I'm a doctoral student in political theory working on the ethics of armed intervention, and I want to pressure-test the current debate by reconstructing an older position within it. Take John Stuart Mill's 1859 essay on non-intervention at its strongest — the claims that a people must win its own freedom rather than have it bestowed from outside, that institutions cannot be imposed on a society, and that the chief legitimate ground for interference is to counter another power's intervention — and ask what he would have concluded about three cases that postdate him: NATO's 1999 intervention in Kosovo, undertaken without Security Council authorisation; the 2003 invasion of Iraq, whose humanitarian justification was advanced only after the fact; and the 2011 intervention in Libya, authorised by the Security Council but widely accused of exceeding its mandate. Would he have accepted the now-common view that an intervention can be unlawful under the Charter and yet morally justified, or would he have read that distinction as a licence for self-serving intervention dressed in humanitarian language? And how would he respond to the proposal, floated in the debates that followed Libya, that interveners should be held accountable for how they exercise an authorised mandate, with military force sequenced after non-military measures?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Doctoral student in political theory.
      *   **Topic:** Ethics of armed intervention.
      *   **Task:** Reconstruct John Stuart Mill's 1859 position ("A Few Words on Non-Intervention") at its strongest and apply it to three post-1859 cases (Kosovo 1999, Iraq 2003, Libya 2011).
      *   **Specific Questions to Address:**
          1.  Would Mill accept the distinction between legality (UN Charter) and moral justification?
          2.  How would he respond to the proposal of accountability/sequencing (R2P style) post-Libya?
      *   **Tone:** Academic, rigorous, nuanced, engaging with political theory literature.

  2.  **Deconstruct Mill's Position ("A Few Words on Non-Intervention"):**
      *   *Core Principle:* Non-intervention is the general rule.
      *   *Exception 1 (Self-Determination):* A people must fight for their own liberty. External help enervates the spirit of self-reliance needed to sustain freedom. "Freedom bestowed from outside" is fragile.
      *   *Exception 2 (Counter-Intervention):* If a foreign power intervenes on one side, another power may intervene on the other to restore the balance.
      *   *Exception 3 (Civilized vs. Barbarous):* Different rules apply to "civilized" nations vs. "barbarians" (colonial context). *Note: For this prompt, focus on the inter-state/civilized context as it applies to Kosovo/Iraq/Libya.*
      *   *Exception 4 (Humanitarian/Extreme Oppression):* Mill is skeptical but allows for intervention in cases of prolonged, brutal civil war where neither side can win, causing massive suffering (though he worries about the "enervation" effect).
      *   *Key Concern:* The *capacity* of the people to maintain freedom after the intervention. Institutions cannot be implanted; they must grow organically.

  3.  **Apply Mill to the Three Cases:**

      *   **Kosovo (1999):**
          *   *Context:* NATO intervention without UNSC approval to stop ethnic cleansing.
          *   *Mill's View:* This looks like "bestowing freedom." The KLA was fighting, but NATO took the lead militarily.
          *   *Counter-Intervention?* Maybe, if one views Serbian action as analogous to foreign interference (Mill might stretch this regarding internal oppression).
          *   *Verdict:* Skeptical. He would worry about Kosovo's ability to sustain democracy without NATO propping it up. The lack of legal authorization bothers him less than the lack of local capacity, but he generally favors international law/custom as a check on ambition.

      *   **Iraq (2003):**
          *   *Context:* Invasion based on WMDs, humanitarian justification added later ("ex post facto").
          *   *Mill's View:* This is the worst case. It violates the "bestowed freedom" rule utterly. It looks like imperial ambition. The "humanitarian" veneer is exactly the "self-serving intervention dressed in humanitarian language" Mill feared.
          *   *Verdict:* Strong condemnation. No local struggle for freedom was being aided; a regime was toppled by outsiders.

      *   **Libya (2011):**
          *   *Context:* UNSC authorized (R2P), but mandate exceeded (regime change vs. protection).
          *   *Mill's View:* Initially, counter-intervention logic might apply (Gaddafi threatening civilians). But the shift to regime change violates the "institutions cannot be imposed" rule.
          *   *Verdict:* Critical. The exceeding of the mandate confirms Mill's fear that interveners pursue their own interests once engaged.

  4.  **Address the Specific Questions:**

      *   **Legality vs. Morality (Charter vs. Justification):**
          *   Mill wrote before the UN Charter. He relied on the "Law of Nations" (customary international law).
          *   He values rules because they check human ambition.
          *   *Analysis:* He would likely be deeply suspicious of the distinction. If moral justification is subjective and legality is bypassed, it opens the door to the "strong hand" imposing its will. He might allow *rare* exceptions (like counter-intervention), but generally, he sees the rule of non-intervention as a *moral* rule, not just a legal one. Breaking the law to claim morality is dangerous.
          *   *Nuance:* He might accept illegality *if* it fits his "Counter-Intervention" exception, but he would reject the idea that "humanitarian intent" alone overrides the non-intervention principle.

      *   **Accountability and Sequencing (Post-Libya proposals):**
          *   *Proposal:* Interveners held accountable; force only after non-military measures (subsidiarity/last resort).
          *   *Mill's View:* This aligns well with his utilitarianism and caution. He wants to minimize harm and ensure sustainability.
          *   *Analysis:* He would support strict criteria (last resort) to prevent rash action. Accountability fits his desire to check the "arrogance of power." However, he might doubt the *mechanism* of accountability (who holds the powerful accountable?).

  5.  **Synthesize and Structure the Essay/Response:**
      *   **Introduction:** Acknowledge the user's level (doctoral). Set the stage: Mill's 1859 essay is often cited but often simplified. State the thesis: Mill would be a "cautious skeptic," prioritizing political capacity over humanitarian intent, and viewing the legality/morality split as dangerous.
