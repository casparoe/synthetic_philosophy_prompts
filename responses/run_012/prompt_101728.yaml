answer: |-
  This is a compelling exercise in intellectual history and normative theory. Reconstructing Mill's position requires resisting the temptation to anachronistically cast him as either a proto-humanitarian interventionist or a hard realist. In *A Few Words on Non-Intervention* (1859), Mill articulates a **presumptive prohibition** on intervention grounded in a specific conception of political agency and the sociological conditions required for liberty.

  For Mill, the ultimate good is not merely the absence of tyranny, but the presence of a citizenry capable of sustaining free institutions through their own virtue and energy. Consequently, he views external military aid as inherently corrosive to the "spirit of liberty" unless specific, narrow conditions are met.

  Here is a reconstruction of how Mill's strongest arguments would engage with your three cases and the structural questions regarding legality and accountability.

  ### I. The Millian Framework: Capacity, Not Just Rights

  To pressure-test the modern debate, we must foreground three Millian axioms that are often softened in contemporary readings:

  1.  **The Principle of Self-Reliance:** "To go through the hardening and demoralizing medium of a people's own efforts is the only way in which free institutions can be rendered durable." Intervention, even for a just cause, risks "enervating" the population, creating a dependency that makes tyranny likely to return once the intervener leaves.
  2.  **The Impossibility of Implantation:** Institutions cannot be transplanted. If a people are not ready to fight for freedom, they are not ready to keep it. External force can remove a tyrant, but it cannot create the civic culture required to prevent a new one.
  3.  **The Counter-Intervention Exception:** The only clear justification for interference is to neutralize the interference of another foreign power. This restores the "fair play" of the internal struggle rather than deciding the outcome.

  ### II. Application to the Cases

  #### 1. Kosovo (1999): The Problem of "Bestowed Freedom"
  Mill would view NATO's intervention in Kosovo with profound ambivalence, leaning toward skepticism.

  *   **The Argument for Intervention:** One could argue this fits Mill's "counter-intervention" clause if one characterizes Serbia's involvement as an external imposition on a distinct people, or fits his exception for "barbarous" atrocities (though Mill's distinction between civilized and barbarous nations is fraught, the logic of stopping mass slaughter aligns with his utilitarianism).
  *   **The Millian Critique:** However, the military burden was borne almost entirely by NATO, not the KLA. For Mill, this is the critical failure. By shielding the Kosovar Albanians from the full cost of their liberation, NATO risked the "enervation" of their political capacity.
  *   **Verdict:** Mill would likely argue that while the humanitarian catastrophe demanded action, the *mode* of action undermined the long-term viability of Kosovar self-government. He would worry that Kosovo's institutions remained durable only so long as NATO remained the guarantor, confirming his fear that freedom bestowed from outside is fragile.

  #### 2. Iraq (2003): The Archetype of Self-Deception
  Iraq represents the precise danger Mill sought to guard against.

  *   **Ex Post Facto Justification:** Mill was deeply suspicious of the motives of powerful states. The shift from WMDs to humanitarianism would strike him as a classic example of a nation "deceiving itself" to justify ambition. He writes that nations rarely intervene for purely disinterested reasons; they usually cloak strategic interests in moral language.
  *   **Institutional Vacuum:** The dissolution of the Ba'athist state and the attempt to build democracy from scratch violates Mill's axiom that institutions must grow organically. Mill would argue that because the Iraqi people were not engaged in a successful, unified struggle for liberty at the time of invasion, the conditions for free institutions did not exist.
  *   **Verdict:** Unqualified condemnation. This is not merely unlawful; it is morally illegitimate because it disregards the sociological prerequisites for liberty. It treats a society as a tabula rasa for engineering rather than a political organism.

  #### 3. Libya (2011): Mandate Creep and Political Capacity
  Libya presents the most complex challenge because it began with international authorization (UNSC Res 1973).

  *   **Protection vs. Regime Change:** Mill might have tolerated limited force to halt Gaddafi's advance on Benghazi (a humanitarian stopgap). However, the shift to regime change violates the non-intervention principle. By removing the head of state, the interveners assumed responsibility for the political order that followed.
  *   **The Aftermath:** The subsequent collapse of Libya into factionalism would confirm Mill's thesis. Without an internal political force capable of unifying the country and monopolizing violence, external removal of a tyrant leads not to liberty, but to anarchy or new tyranny.
  *   **Verdict:** Mill would argue the interveners failed the test of "political capacity." They judged the intervention by the *act* of removal, not by the *sustainability* of the result. For a utilitarian like Mill, the consequences (state failure) retroactively indict the morality of the intervention.

  ### III. Legality (Charter) vs. Moral Justification

  You ask whether Mill would accept the view that an intervention can be unlawful under the Charter yet morally justified.

  **Mill would likely reject this distinction as dangerous.**

  While Mill was a utilitarian and not a legal positivist, he viewed general rules (like non-intervention) as essential heuristics for maximizing utility. He understood that human beings are prone to bias. In *A Few Words on Non-Intervention*, he argues that the rule against intervention is necessary precisely because nations are poor judges of their own motives.

  *   **The Danger of Subjectivity:** To allow "moral justification" to override "legal/customary prohibition" is to hand the powerful a blank check. Mill would argue that the "moral justification" is almost always subjective and susceptible to self-interest (as seen in Iraq).
  *   **The Exception is Narrow:** Mill does allow for exceptions (e.g., counter-intervention), but these are exceptions to the *moral* rule, not just the legal one. He would not accept a framework where "morality" is a separate track that legitimizes what international law forbids. For Mill, if an action violates the established law of nations without fitting the narrow *moral* exceptions (counter-intervention or deadlocked atrocities), it is both unlawful and immoral.
  *   **Conclusion on Legality:** He would view the "illegal but legitimate" formulation as a licence for self-serving intervention dressed in humanitarian language. It removes the external check on ambition that the law provides.

  ### IV. Accountability and Sequencing (Post-Libya Proposals)

  Regarding the proposal that interveners be held accountable for mandate execution, with force sequenced after non-military measures:

  **Mill would endorse the principle but doubt the mechanism.**

  *   **Sequencing (Last Resort):** This aligns perfectly with Mill's utilitarianism. War is a great evil; it is only justified if it prevents a greater evil. Exhausting non-military measures ensures that the "hardening" effect of war is only invoked when absolutely necessary. Mill would insist that interveners prove that local capacity is sufficient to sustain the outcome *before* engaging.
  *   **Accountability:** Mill would be sympathetic to the idea that interveners bear responsibility for the aftermath ("you break it, you own it"). However, he would be deeply skeptical of *who* holds the powerful accountable. In the absence of a supranational sovereign with enforcement power, accountability relies on the domestic public opinion of the intervening state.
  *   **The Millian Caveat:** He would warn that "accountability" mechanisms often become bureaucratic boxes to check rather than substantive constraints. True accountability, for Mill, requires a citizenry in the intervening nation that is vigilant against its own government's imperial overreach.

  ### V. Synthesis for Your Dissertation

  If you are using Mill to pressure-test the current debate, his strongest contribution is the **Sociological Critique of Intervention.**

  Modern debates (including R2P) often focus on the *jus ad bellum* (right to wage war) and the *jus in bello* (conduct in war). Mill shifts the focus to the *jus post bellum* (justice after war) as a precondition for the *jus ad bellum*.

  *   **The Challenge:** Mill forces the interventionist to answer not "Is this regime evil?" but "Is this people capable of sustaining freedom without us?"
  *   **The Trap:** If the answer is "no," Mill argues you must not intervene, regardless of the humanitarian cost. This is the hardest pill for modern liberals to swallow. It implies a tragic acceptance of suffering in the short term to prevent greater political collapse in the long term.

  **Conclusion:**
  Mill would likely conclude that Kosovo, Iraq, and Libya all failed to meet the threshold of "political capacity" required for legitimate intervention. He would view the separation of legality and morality as a rhetorical device used by great powers to bypass constraints. Finally, while he would support sequencing and accountability in theory, he would argue they are insufficient without a fundamental shift in how interveners view their own role: not as liberators, but as temporary balancers of power who must prioritize the *self-activity* of the local population above the *efficiency* of the military outcome.

  For your work, Mill offers a robust counter-narrative to the "Responsibility to Protect": a **"Responsibility to Restrain,"** grounded in the belief that liberty cannot be delivered by drone or decree.
