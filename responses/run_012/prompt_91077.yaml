prompt: |-
  I'm in a little reading group that's working through the agent-foundations / AI-safety-theory stuff — we're all philosophy people, nobody in the group actually builds anything — and last week was the session on "embedded agency," which I thought I followed at the time. The idea, as I wrote it down in my notes, is that you shouldn't picture the agent as a box standing outside the world with the world laid out in front of it; the agent is one more thing inside the world, so it has to reason about a situation that includes itself and its own reasoning, its own code can be one of the options it's choosing between, and any line you draw between "agent" and "environment" is a decision you made rather than something you discovered, which then shows up as an artifact somewhere in the formalism. Then at the end somebody said "isn't this just the frame problem with new vocabulary," everybody nodded, and we moved on. It's been bugging me since, partly because I'm the one who has to write up the notes. I don't think they're the same thing at all and I can't articulate why.

  So compare them for me. The frame problem as it's normally told: the agent has a big pile of beliefs about the world, and when it acts, almost nothing in the pile tells it which few of the millions of facts are relevant to what it's doing next, and there's no general procedure for picking them out — which is suppose to be bad news for the whole idea of one general-purpose reasoner. Does the embedded-agent business add anything to that, or is it the same complaint relocated? Specifically: what does the relevance problem look like once you grant that the agent is inside the world rather than outside it, and what does the embedded-agency picture lose if you just delete the relevance problem from it entirely? I have a hunch that a genuine solution to one of these would hand you the other for free, but I can't tell which way the dependence runs, so I'd like your verdict on that, plus a verdict on the "same problem" diagnosis — right, wrong, or true but useless. And what I'd most like is a case where they come apart cleanly, a system that has one problem and not the other, because I think that would settle it; my own attempts were bad (a thermostat, which I think has both, and a proof checker, which I think has neither, but I'm not confident about either). Please don't give me a survey of what other people have written about the two of them — I've read plenty of that — it's the comparison itself I want.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Philosophy background, part of a reading group on AI safety/agent foundations. No engineering background ("nobody... actually builds anything").
      *   **Topic:** Embedded Agency vs. The Frame Problem.
      *   **Core Conflict:** A group member claimed Embedded Agency is just the Frame Problem with new vocabulary. The user disagrees but can't articulate why.
      *   **Specific Questions:**
          1.  Compare the two concepts.
          2.  Does Embedded Agency add anything to the Frame Problem, or is it the same complaint relocated?
          3.  What does the relevance problem look like *given* embeddedness?
          4.  What does Embedded Agency lose if you delete the relevance problem?
          5.  Verdict on the "same problem" diagnosis (Right, Wrong, or True but Useless).
          6.  Verdict on dependence (Does solving one solve the other?).
          7.  **Crucial:** A case where they come apart cleanly (a system with one but not the other).
      *   **Constraint:** Do *not* give a survey of literature. Focus on the comparison itself.

  2.  **Deconstruct the Concepts:**

      *   **The Frame Problem (Classic AI/Philosophy version):**
          *   *Core:* Representation and Update. How do I know what *doesn't* change when I act? How do I filter irrelevant beliefs from relevant ones without checking everything?
          *   *Structure:* Agent (Reasoner) $\to$ World Model $\to$ Action. The gap is computational/representational efficiency regarding *change*.
          *   *Metaphor:* A robot trying to move a block needs to know the block moves, but also that the wall color doesn't change, the moon doesn't fall, etc.
          *   *Key Issue:* Relevance of *facts* to *actions* in a static ontology.

      *   **Embedded Agency (ARC/LessWrong/Soares et al. version):**
          *   *Core:* Ontological Separation. The agent is part of the environment it models.
          *   *Structure:* Agent $\subset$ Environment. The map cannot perfectly contain the territory if the territory includes the map.
          *   *Key Issues:* Self-reference, counterfactuals on self, acausal trade, logical uncertainty, boundary definition.
          *   *Metaphor:* A chess engine playing chess, but realizing its own code is running on the hardware that constitutes the board, or that its opponent can read its source code.

  3.  **Evaluate the "Same Problem" Claim:**
      *   *Claim:* "Embedded agency is just the frame problem with new vocabulary."
      *   *Assessment:* Wrong. They address different structural failures.
      *   *Why:* The Frame Problem is about *filtering* information within a model. Embedded Agency is about the *impossibility* of a clean model/environment split.
      *   *Nuance:* They are related in that both hinder idealized rational agents (like AIXI), but they block different doors. Frame Problem blocks *efficiency/update*. Embedded Agency blocks *definition/consistency*.

  4.  **Drafting the Comparison (Mental Outline):**
      *   **Frame Problem:** "What stays the same?" (Inertia/Relevance). It assumes a clean split but fails at scaling.
      *   **Embedded Agency:** "Where do I end and the world begin?" (Boundary/Self-Reference). It challenges the split itself.
      *   **Intersection:** Both make standard decision theory (EDT/CDT) fail.
      *   **Dependence:** Solving Frame Problem doesn't solve Embeddedness (you can efficiently update a model that is fundamentally flawed because it excludes yourself). Solving Embeddedness doesn't solve Frame Problem (you can acknowledge you're in the world but still not know which facts matter for your next move).

  5.  **Developing the "Clean Separation" Cases (The Hardest Part):**
      *   *Goal:* System with Frame Problem but not Embedded Agency issues? System with Embedded Agency issues but not Frame Problem?
      *   *Candidate 1: Frame Problem YES, Embedded Agency NO.*
          *   Need: Agent outside the world (Cartesian), but struggles with relevance.
          *   Example: A classical GOFAI planner operating on a toy blocks world where it *isn't* part of the blocks world. It's a "god view" planner. It knows it's not a block. But it still has to figure out that moving Block A doesn't change the color of Block B.
          *   Refinement: A database update system. I update "Salary" in a record. I need to know "Address" doesn't change. I am not in the database.
      *   *Candidate 2: Embedded Agency YES, Frame Problem NO.*
          *   Need: Agent inside the world, but relevance is trivial.
          *   Example: A very simple homeostatic system that *is* part of the environment but has trivial dynamics.
          *   Refinement: This is tricky. If you're embedded, usually complexity brings frame issues.
          *   Better Angle: A self-modifying code system where the *only* thing that matters is the code.
          *   *Idea:* A Quine (program that outputs its own source). It is "embedded" in the sense that its output is itself. But there are no "facts about the world" to filter. The only relevant fact is its own code.
          *   *Better Idea:* A decision theory puzzle like Newcomb's Problem or Prisoner's Dilemma with a clone. The agent is embedded (its decision is logically linked to the other). The "frame" is tiny (just the boxes or the choice). The problem isn't "what else changed," it's "how does my choice correlate with that."
          *   *Strongest Candidate:* **Logical Induction / Proof Search.** An agent searching for a proof about itself. The "world" is math. The "agent" is the search algorithm. There is no "frame problem" in math (truth is static, no inertia). But there is an embedded agency problem (Loeb's obstacle, self-reference).

  6.  **Refining the Argument:**
      *   *The Frame Problem* is about **Inertia and Relevance** in a causal model.
      *   *Embedded Agency* is about **Boundary and Self-Reference** in the ontology.
      *   *Verdict:* The group member is Wrong. It's a category error.
      *   *Dependence:* They are orthogonal constraints.

  7.  **Addressing the Specific Questions:**
      *   *What does relevance look like once granted agent is inside?* It becomes "What parts of *myself* are relevant to *myself*?" (Self-modification, precommitment).
      *   *What does Embedded Agency lose if you delete relevance?* It becomes a static self-reference puzzle (like Godel) without dynamic action.
      *   *Verdict:* "Wrong."
      *   *Dependence:* Neither solves the other.
      *   *Cases:*
          1.  **Frame Only:** A classical planner simulating a weather system. It's not *in* the weather, but has to track which variables affect which.
          2.  **Embedded Only:** A mathematical proof checker checking its own consistency. No "world facts" to ignore, just logical self-reference.

  8.  **Polishing the Tone:**
      *   Keep it philosophical but precise.
      *   Avoid jargon soup (minimize "AIXI," "CDT/EDT" unless explained).
      *   Respect the user's intelligence (they read the notes, they know the basics).
      *   Focus on the *structural* difference.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I accidentally make the Frame Problem sound like Embedded Agency?
      *   *Correction:* Ensure I emphasize that Frame Problem assumes a Cartesian boundary exists but is hard to compute, whereas Embedded Agency says the Cartesian boundary is false.
      *   *Check:* Is the "Proof Checker" example good for "Neither"? The user suggested it. I need to beat that with a better "Embedded Only" example.
      *   *Revision:* The user suggested a proof checker has neither. I think a proof checker checking *itself* has Embedded issues (Godel) but no Frame issues (no physical change). That works for "Embedded Only."
      *   *Revision:* For "Frame Only," I need something clearly Cartesian. A human planning a garden is arguably embedded. A simulation running on a server *about* a garden, where the simulator is not affected by the garden, is Cartesian.

  10. **Final Plan:**
      *   Intro: Validate the user's suspicion (The group member is wrong).
      *   Section 1: The Structural Difference (Cartesian vs. Ontological).
      *   Section 2: The Relevance Question (Facts vs. Self).
      *   Section 3: The Verdict (Orthogonal, not identical).
      *   Section 4: The Clean Cases (The "Proof-Searcher" vs. The "God-Simulator").
      *   Conclusion: Summary for the notes.

  *(Self-Correction on the "Proof Checker" example)*: The user said "a proof checker, which I think has neither." I need to be careful. If the proof checker is just checking $A \to B$, it's neither. If it's checking *its own* consistency, it's Embedded. I should use the self-checking version to isolate Embedded Agency.

  *(Self-Correction on "Frame Only")*: A thermostat has both (simple frame, simple embeddedness). A classical STRIPS planner operating on a database it is not part of is the best bet.

