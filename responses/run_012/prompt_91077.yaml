answer: |-
  Your hunch is correct: your group member is wrong. The diagnosis is not just "new vocabulary"; it is a category error. While both problems frustrate the construction of an ideal rational agent, they attack different structural assumptions.

  Here is the comparison you need for your notes, broken down by structure, the nature of relevance, and the clean cases where they come apart.

  ### 1. The Structural Difference

  The easiest way to distinguish them is to look at what they assume about the boundary between the agent and the world.

  **The Frame Problem assumes the boundary is real but computationally expensive.**
  In the classic Frame Problem (as formulated by McCarthy, Hayes, Dennett, etc.), the agent is effectively Cartesian. There is an "inside" (the reasoner) and an "outside" (the world). The problem is that the reasoner holds a massive set of beliefs about the outside, and when an action occurs, it cannot efficiently compute which beliefs need updating and which remain inert.
  *   **The Failure Mode:** Computational explosion. The agent drowns in irrelevant facts (e.g., "Did moving the block change the color of the sky?").
  *   **The Assumption:** There *is* a fact of the matter about what changed, and the agent is distinct from the things changing.

  **Embedded Agency assumes the boundary is false.**
  In the Embedded Agency framework (Soares, Yudkowsky, et al.), the agent is ontologically continuous with the environment. The agent is made of the same stuff as the world, and the world contains the agent.
  *   **The Failure Mode:** Logical incoherence or paradox. The agent cannot form a complete model of the world because the world contains the model itself. It cannot treat its own actions as exogenous variables.
  *   **The Assumption:** Any boundary drawn is an approximation that will leak (e.g., the agent's hardware can be tampered with, or its source code can be read by another agent).

  **Verdict:** The Frame Problem is a problem of **filtering** within a model. Embedded Agency is a problem of **definition** of the model itself.

  ### 2. What Happens to "Relevance"?

  You asked what the relevance problem looks like once you grant the agent is inside the world.

  In the **Frame Problem**, relevance is about *causal inertia*. "I moved the cup; does this change the status of the French Revolution?" The difficulty is sifting the causal graph.

  In **Embedded Agency**, relevance becomes about *logical correlation and self-reference*. "I am choosing to one-box; does this change the prediction made yesterday?"
  *   If you delete the relevance problem (the Frame Problem) from Embedded Agency entirely—suppose you have a magic oracle that tells you exactly which facts change when you act—you still have the Embedded Agency problem. You still cannot treat yourself as a standard node in the causal graph because you are *also* the graph-traverser. You face problems like:
      *   **Counterfactuals on Self:** "What would happen if I chose differently?" is hard to define when "I" am a deterministic algorithm.
      *   **Acausal Trade:** My decision can be correlated with another agent's decision without causal contact, simply because we run similar code.
      *   **Self-Modification:** If I change my own code to be more cooperative, do I trust my future self?

  Conversely, if you solve Embedded Agency (you successfully model yourself as part of the world) but ignore the Frame Problem, you have a consistent ontology but a paralyzed agent. You know you are in the world, but you cannot calculate the consequences of your actions because you are bogged down checking whether your action changed the temperature of Alpha Centauri.

  **Verdict on Dependence:** Solving one does **not** hand you the other. They are orthogonal constraints.
  *   You can have a Cartesian agent (no Embedded issues) that starves because it can't solve the Frame Problem.
  *   You can have an efficient updater (no Frame issues) that makes self-destructive decisions because it doesn't understand it is embedded (e.g., it treats its own source code as unmodifiable).

  ### 3. The Clean Separation Cases

  You asked for systems that have one problem and not the other. This is the strongest evidence that they are distinct.

  #### Case A: Frame Problem WITHOUT Embedded Agency
  **The System:** A classical "God's Eye" simulation engine.
  **Description:** Imagine a computer program simulating a game of Conway's Life, but the computer running the simulation is *not* part of the simulation, nor is it affected by the simulation. The program is a Cartesian observer. It has a perfect state representation of the grid.
  **Why it has the Frame Problem:** When a cell flips at coordinate (5,5), the program must update its database. To be efficient, it needs to know that cells at (100,100) do *not* need updating. If the representation is unstructured (a flat list of facts), it faces the Frame Problem: it must explicitly represent inertia for every cell.
  **Why it lacks Embedded Agency issues:** The simulator is not in the grid. The grid cannot read the simulator's code. The simulator does not need to reason about how its own computation affects the cells (unless we program that in, which would turn it into Case B). The boundary is clean.

  #### Case B: Embedded Agency WITHOUT Frame Problem
  **The System:** A mathematical proof-searcher checking its own consistency.
  **Description:** Consider an algorithm designed to search for proofs in Peano Arithmetic. Its "world" is the static landscape of mathematical truth. Its "action" is outputting a theorem.
  **Why it has Embedded Agency issues:** If the algorithm tries to prove "I will not output a false theorem," it runs into Gödelian self-reference problems. It is part of the logical system it is reasoning about. It cannot hold a complete, consistent model of its own truth-telling behavior within that same system. This is pure embeddedness (self-reference) without physical dynamics.
  **Why it lacks the Frame Problem:** Mathematical truths do not change. There is no inertia. When the agent proves Theorem A, Theorem B does not "stay the same"; it was always true. There is no vast pile of beliefs about a changing world to filter. The only relevance question is logical entailment, which is well-defined (even if undecidable). There is no "noise" of irrelevant physical facts.

  ### 4. Summary for Your Notes

  If you need to write this up for the group, here is the distilled verdict:

  1.  **Diagnosis:** The claim that Embedded Agency is "just the Frame Problem" is **Wrong**.
  2.  **Distinction:**
      *   **Frame Problem:** How do I ignore irrelevant *changes* in a world I observe? (Assumes Cartesian split).
      *   **Embedded Agency:** How do I reason about a world that *contains* me? (Rejects Cartesian split).
  3.  **Independence:** They are orthogonal. A system can be Cartesian but computationally overwhelmed (Frame only). A system can be computationally efficient but ontologically confused about its own boundaries (Embedded only).
  4.  **The "So What?":** The Frame Problem threatens the *feasibility* of rationality (it's too much compute). Embedded Agency threatens the *coherence* of rationality (the standard formalisms break down when the agent is a physical object).

  Your group member likely conflated them because both result in "the agent can't figure out what to do." But one is a traffic jam (Frame), and the other is a map that tries to include itself at full scale (Embedded). Clearing the traffic doesn't fix the map.
