      *(Refining the "Neutrality" constraint)*: The prompt asks me to "Mark clearly which steps are register-neutral and which quietly presuppose that one register is the mature or correct one to be in." I need to be careful. The procedure *should not* presuppose one is correct. I need to identify where standard HR practices *do* presuppose Dignity and flag them as potential bias points, or design the procedure to avoid them. I will design the procedure to be neutral, but in the commentary, I will highlight where a standard CM might drift. Actually, re-reading: "Mark clearly which steps are register-neutral and which quietly presuppose..." implies I should identify if *my* procedure does this. I will strive for neutrality but acknowledge where the *structure* of a university forces a Dignity frame (e.g., we can't issue public shaming). I will mark the "Institutional Constraint" vs "Philosophical Bias."

      *Wait, one more check:* "I do not want a procedure that smuggles in the assumption that dignity culture is the grown-up position." Okay, so I must ensure the procedure treats Honor and Victimhood as valid, not just "emotional versions" of Dignity.

      *Escalation Point:* When the remedy requested requires the University to take a moral stance it cannot take (e.g. "Admit this program is racist" vs "We investigated and found X").

  9.  **Final Polish:** Ensure the distinction between the *procedure* and the *commentary* is clear. The prompt asks for the procedure, then the case runs, then the conclusion.

      *Structure:*
      1.  Definitions (Honor, Face, Dignity, Victimhood).
      2.  The 30-Minute Protocol (Questions, Routing, Mismatch, Escalation).
