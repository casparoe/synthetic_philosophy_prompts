answer: |-
  # The Tri-Register Intake and Routing Protocol (T-RIRP)

  **Purpose:** To diagnose the moral register of a conflict within 30 minutes and route it to a process capable of resolving *that* specific type of grievance.
  **Operator:** Case Manager (CM).
  **Constraint:** Do not attempt to resolve the dispute during intake. Diagnose only.

  ## Part I: Definitions and False Positives

  The CM must distinguish between the four modes of conflict. A single case may contain elements of multiple registers, but one will be the *primary currency* of the grievance.

  ### 1. Honor (Standing)
  *   **Definition:** The complaint is about hierarchical status relative to a specific audience. The harm is public diminishment; the remedy is public restoration or vindication.
  *   **Key Marker:** "Who saw this?" and "Who needs to know I was right?"
  *   **False Positive:** Anger. (One can be angry about a rule violation without caring about status.)
  *   **Distinction from Face:** Honor requires an audience of peers/competitors. Face requires a future working relationship. Honor asks, "Am I respected?" Face asks, "Can we still work together without awkwardness?"

  ### 2. Face (Relational Continuity)
  *   **Definition:** The complaint is about the smoothness of interaction and the preservation of a necessary ongoing relationship. The harm is social friction or embarrassment that impedes function.
  *   **Key Marker:** "I still have to see them every day."
  *   **False Positive:** Politeness. (One can be polite while seeking vengeance.)
  *   **Distinction from Honor:** Face is bilateral (we both save face); Honor is often unilateral (I must rise, you must fall).

  ### 3. Dignity (Rights/Rules)
  *   **Definition:** The complaint is about the impartial application of universal standards. The harm is inequality or procedural deviation.
  *   **Key Marker:** "What is the policy?" and "Was this applied consistently?"
  *   **False Positive:** Citing a rule. (One can cite a rule instrumentally to damage an enemy's Honor.)
  *   **Distinction from Victimhood:** Dignity focuses on the *act* (the violation); Victimhood focuses on the *effect* (the suffering).

  ### 4. Victimhood (Recognition/Harm)
  *   **Definition:** The complaint is about the validity of suffering and identity. The harm is invisibility or the denial that the pain counts.
  *   **Key Marker:** "Do you understand what this did to me?"
  *   **False Positive:** Crying or distress. (Distress can result from a Dignity violation, e.g., unfair firing.)
  *   **Distinction from Honor:** Honor seeks status restoration; Victimhood seeks witness to pain. Honor wants to stand *above*; Victimhood wants to be seen *in* the wound.

  ---

  ## Part II: The 30-Minute Intake Script

  **Note on Neutrality:** Steps marked **[NEUTRAL]** do not presuppose a register. Steps marked **[INSTITUTIONAL BIAS]** reflect the university's structural leaning toward Dignity (bureaucracy) and must be managed carefully to avoid dismissing Honor or Victimhood claims as "irrational."

  ### Phase 1: The Outcome Question (5 Minutes)
  **CM:** "If we are successful today, what does the resolution look like? Please describe the specific outcome you want."
  *   **[NEUTRAL]**
  *   **Sufficient Answer:** A concrete action (e.g., "A retraction," "An apology," "They get fired," "The policy changes").
  *   **Diagnostic:**
      *   "Retraction/Correction posted publicly" $\rightarrow$ **Honor**.
      *   "Policy applied correctly" $\rightarrow$ **Dignity**.
      *   "They acknowledge the harm they caused" $\rightarrow$ **Victimhood**.
      *   "We can work together without this hanging over us" $\rightarrow$ **Face**.

  ### Phase 2: The Audience Question (5 Minutes)
  **CM:** "Who needs to be involved in this resolution for you to feel it is settled?"
  *   **[NEUTRAL]**
  *   **Sufficient Answer:** Names, roles, or groups.
  *   **Diagnostic:**
      *   "The Department," "The Lab Group," "The Public" $\rightarrow$ **Honor**.
      *   "HR," "Administration," "The Committee" $\rightarrow$ **Dignity**.
      *   "Just them, and maybe a support person" $\rightarrow$ **Victimhood** or **Face**.
      *   *Crucial Follow-up:* "Does the apology/resolution need to happen *in front of* the people who saw the incident?"
          *   Yes $\rightarrow$ **Honor**.
          *   No $\rightarrow$ **Face** or **Victimhood**.

  ### Phase 3: The Harm Question (10 Minutes)
  **CM:** "What is the core damage here? Is it that a rule was broken, that your reputation was damaged, or that you were hurt?"
  *   **[NEUTRAL]**
  *   **Sufficient Answer:** The complainant prioritizes one of the three.
  *   **Diagnostic:**
      *   "It sets a bad precedent / It's unfair" $\rightarrow$ **Dignity**.
      *   "It makes me look incompetent / weak" $\rightarrow$ **Honor**.
      *   "It invalidates my experience / trauma" $\rightarrow$ **Victimhood**.
  *   **Warning:** If the CM hears "It's against policy" but the emotional weight is on "They think they're better than me," code as **Honor** using policy language.

  ### Phase 4: The Relationship Question (5 Minutes)
  **CM:** "Do you need to maintain a working relationship with the other party after this?"
  *   **[NEUTRAL]**
  *   **Sufficient Answer:** Yes/No/Unknown.
  *   **Diagnostic:**
      *   Yes + Low Conflict $\rightarrow$ **Face**.
      *   Yes + High Conflict $\rightarrow$ **Dignity** (boundaries) or **Honor** (dominance).
      *   No $\rightarrow$ **Honor** (vindication) or **Dignity** (separation).

  ### Phase 5: The Limit Check (5 Minutes)
  **CM:** "Is there any outcome you would consider unacceptable, even if it solves the problem?"
  *   **[INSTITUTIONAL BIAS]** (This step protects the university, not the registers).
  *   **Sufficient Answer:** Identification of "Red Lines."
  *   **Diagnostic:**
      *   "Private apology is unacceptable; it must be public." $\rightarrow$ **Honor**.
      *   "I won't accept money; I need them to admit they lied." $\rightarrow$ **Victimhood** or **Honor**.
      *   "I won't accept mediation; I want a ruling." $\rightarrow$ **Dignity**.

  ---

  ## Part III: Routing and Process Design

  Once diagnosed, route to the corresponding process. **Do not mix currencies.**

  | Register | Fair Process Design | Failure Mode (Translation Error) |
  | :--- | :--- | :--- |
  | **Honor** | **Public Vindication or Mediated Status Reset.**<br>Requires a public record, a correction, or a mediated meeting where status is acknowledged. | **The Dignity Trap:** Offering a private settlement or policy tweak. The party feels bought off or silenced. |
  | **Face** | **Facilitated Dialogue.**<br>Focus on future interaction protocols. No finding of fault, only finding of path forward. | **The Honor Trap:** Forcing one party to apologize admits fault, destroying Face for both. |
  | **Dignity** | **Investigation and Adjudication.**<br>Fact-finding, policy review, consistent application. Impartial decision-maker. | **The Victimhood Trap:** Treating a rule violation as a "misunderstanding." The party feels the rule doesn't matter. |
  | **Victimhood** | **Restorative Witnessing.**<br>Structured opportunity for harm to be named and acknowledged by the institution or offender. | **The Dignity Trap:** Offering a policy review when the request was for acknowledgment of pain. The party feels gaslit. |

  ### Handling Mismatched Registers
  If Party A is **Honor** (wants public apology) and Party B is **Dignity** (wants rule consistency):
  1.  **Do not** attempt to translate A's demand into B's currency (e.g., "We can't do public apology, but we can review the policy"). This humiliates A.
  2.  **Do not** attempt to translate B's demand into A's currency (e.g., "We will make them apologize so you feel respected"). This violates B's right to due process.
  3.  **Action:** Route to **Director**. This is an incommensurable conflict requiring high-level negotiation or a decision on which register the University will prioritize in this instance.

  ### Escalation Point (Handoff to Director)
  The CM must stop and hand off the case if:
  1.  **Incommensurability:** Parties are in different registers and refuse to budge (see above).
  2.  **Standing Challenge:** The complaint asks the University to validate a moral claim it cannot officially endorse (e.g., "Admit this program is systemically oppressive" vs. "We found policy violations").
  3.  **Weaponized Dignity:** A party is using a Dignity frame (policy) purely to inflict Honor damage on another (e.g., demanding maximum penalty for a minor infraction to ruin a reputation).
  4.  **Weaponized Victimhood:** A party is using a Victimhood frame to shut down legitimate academic or professional critique (e.g., "Critiquing my data is harming me").

  ---

  ## Part IV: Case Applications

  ### Case 1: The Graduate Student (Authorship)
  **Scenario:** Grad student wants a co-author removed and a correction posted to the group's public page.
  *   **Intake:**
      *   *Outcome:* "Correction on the public page." (**Honor** marker: Public audience).
      *   *Audience:* "The research community." (**Honor**).
      *   *Harm:* "They took credit that dilutes my standing." (**Honor**).
      *   *Relationship:* "I cannot work with them, but I need the field to know."
  *   **Routing:** **Honor Register.** Process requires a public correction or a mediated agreement on authorship order that is visibly recorded.
  *   **Expected Objection (from Co-Author/Dept):** "This is a personnel matter; public corrections violate privacy policy (Dignity/Privacy)."
  *   **CM Action:** If the Co-Author/Dept insists on privacy (Dignity/Face) and the Student insists on public correction (Honor), this is a **Mismatch**.
      *   *CM Instruction:* Do not offer a private letter of correction. That is a Dignity solution to an Honor problem. Hand off to Director. The Director must decide if the University supports public standing claims in research disputes or if privacy policy overrides Honor.
      *   *If Director is unavailable:* CM must inform the Student: "Our standard process protects privacy (Dignity). Your request requires an exception to that policy (Honor). I cannot authorize that exception."

  ### Case 2: The Staff Member (Policy Exception)
  **Scenario:** Staff member wants a policy applied retroactively to a colleague who received an exception.
  *   **Intake:**
      *   *Outcome:* "Apply the rule to them." (**Dignity** marker: Consistency).
      *   *Audience:* "HR/Administration." (**Dignity**).
      *   *Harm:* "Inequality. They got special treatment." (**Dignity**).
      *   *Relationship:* "We are peers; this undermines the structure."
  *   **Routing:** **Dignity Register.** Process requires an audit of the exception. Was the exception authorized? If yes, the grievance fails on Dignity terms (rules allow exceptions). If no, the remedy is correcting the record, not necessarily punishing the colleague.
  *   **Expected Objection (from Staff Member):** "An audit isn't enough. They need to lose the benefit."
      *   *Analysis:* This shifts from Dignity (fairness) to Honor (punishment/status lowering).
  *   **CM Action:** Stick to Dignity routing. "We can determine if the rule was followed. We cannot adjudicate whether the exception *should* have existed unless we change the policy."
      *   *If Staff Member insists on punishment:* Hand off to Director. This is a shift from Dignity to Honor/Victimhood that the standard grievance procedure cannot handle.

  ### Case 3: The Student (Program Culture)
  **Scenario:** Student wants the university to publicly acknowledge that a program's culture harmed them.
  *   **Intake:**
      *   *Outcome:* "Public acknowledgment of harm." (**Victimhood** marker: Recognition of suffering).
      *   *Audience:* "The University community."
      *   *Harm:* "My pain is being ignored/denied." (**Victimhood**).
      *   *Relationship:* "I am leaving, but others shouldn't suffer."
  *   **Routing:** **Victimhood Register.** Process requires a Restorative Statement or Listening Session where the harm is named.
  *   **Expected Objection (from University):** "We cannot admit liability or validate subjective cultural claims without legal risk (Dignity/Legal)."
  *   **CM Action:** This hits the **Escalation Point (Standing Challenge)**. The University often cannot grant the specific standing requested (validating "harm" vs. "policy violation") without accepting liability.
      *   *CM Instruction:* Do not promise acknowledgment you cannot deliver. "Our office can facilitate a dialogue where you share your experience, but we cannot issue an institutional finding on 'culture'."
      *   *If Student refuses:* Hand off to Director. This is a limit of the office's power. The Student is asking for moral standing the bureaucracy is designed to withhold.

  ---

  ## Part V: Limitations and Moral Analysis

  ### What This Procedure Cannot Do
  1.  **It cannot resolve incommensurable moral worlds.** If one party operates in Honor (reputation is everything) and the other in Dignity (rules are everything), there is no "fair" process that satisfies both. One register must lose. This procedure identifies the clash; it does not solve it.
  2.  **It cannot grant moral standing.** In Victimhood cases, the complainant often wants the Institution to validate their suffering as *true* in a moral sense. The Institution can only validate that *procedures* were followed. This procedure flags that gap but cannot bridge it.
  3.  **It cannot prevent weaponization.** A savvy actor can learn the codes. They can frame an Honor vendetta as a Dignity complaint ("I'm just asking for the rules to be followed") to bypass the routing. The CM must listen to emotional weight, not just keywords.

  ### Predictable Misfires
  *   **The "Professionalism" Bias:** CMs will inevitably treat Dignity as "professional" and Honor/Victimhood as "emotional." Even with this script, CMs may route Honor claims to "counseling" (pathologizing) rather than "mediation" (validating).
  *   **The Privacy Wall:** University privacy policies (FERPA, HR) are Dignity structures. They will systematically block Honor remedies (public correction) and Victimhood remedies (public acknowledgment). The procedure will frequently route cases to the Director simply because the CM lacks the authority to breach the Privacy Wall for a non-Dignity end.

  ### Is Neutrality a Moral Position?
  Yes. By refusing to rank the registers, this procedure implicitly endorses the **status quo of the Institution**.

  1.  **Bureaucratic Bias:** Universities are Dignity structures (rules, rights, policies). By treating Honor and Victimhood as "alternative registers" rather than "default human experiences," the procedure subtly frames Dignity as the operational norm and the others as deviations requiring special routing.
  2.  **The Cost of Neutrality:** Refusing to rank the registers means refusing to tell a student that their demand for public vindication (Honor) is incompatible with the university's mission of privacy (Dignity). We pass this hard choice to the Director. This preserves the CM's neutrality but burdens the leadership and delays resolution.
  3.  **Endorsement:** Ultimately, maintaining neutrality *is* a way of endorsing Dignity. Why? Because in a conflict between Honor and Dignity, if the Office remains neutral, the *structure* of the Office (which is built on Dignity) will win by default. A neutral referee in a game played on a sloped field is not neutral.

  **Directive to CM:** You are not neutral. You are operating within a Dignity institution. Your job is not to pretend the other registers are equal in *power*, but to ensure they are equal in *diagnostic weight* so that I (the Director) can make the political decision on which register prevails. Do not solve the moral conflict. Map it.
