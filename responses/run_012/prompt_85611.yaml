      *   *Check:* Is the recommendation concrete? *Censure + specific remedy (training/procedure change).*
      *   *Check:* Did I avoid citations? *Yes.*

  8.  **Final Polish:** Ensure the flow is logical. Start with the brainstorming as requested ("begin by brainstorming the strongest version of each of the four dispositions"). *Wait, the prompt asks me to think carefully and begin by brainstorming... before choosing one.* I should structure the document to reflect this deliberation process or present the final opinion *after* that internal deliberation is reflected in the text. The prompt says "Draft the written opinion I will circulate... begin by brainstorming... before choosing one." This implies the *opinion itself* should likely contain the deliberation or that I should show the work before the final text.
      *   *Correction:* Usually, a circulated opinion is the final argument. However, the prompt says "begin by brainstorming the strongest version of each of the four dispositions before choosing one." I will interpret this as an instruction for *my* thought process in generating the response, OR I can structure the opinion to show the Commission's deliberative path.
