prompt: |-
  I am writing the conceptual chapter of a dissertation on signaling — animal and human — and I have decided not to compare the handicap principle with its rivals until I know what any of them would have to deliver. I am working with the handicap principle in its plain form: a signal is credible because it is expensive, and the expense is what stops the low-quality from sending it. Please write me the specification rather than the comparison: what must a theory of signal credibility be able to do before it counts as adequate? I want to use the finished list to sort traits into signals, cues, and noise, and to explain why some honest signals are cheap.

  The theory has to cover at least the following, which are the cases I actually have to explain.

  - The peacock's tail: costly to grow and to carry, correlated with the bearer's condition, preferred by receivers, with the offspring of preferred males inheriting the viability advantage. Here the cost is a handicap in the ordinary sense.
  - The stag's roar: its pitch is fixed by the size of the animal's resonating chambers, so a small male cannot produce a deep one. Nothing was spent to make the signal honest; the physics did the work.
  - The alarm call of a bird surrounded by relatives: cheap to produce, no reliable difference in what it costs different callers, honest because the callers' interests coincide.
  - A courtship display that is difficult to perform: what excludes the weak and the young is a rate of failure, not an expenditure of resources. I want to know whether a failure rate is a cost in the relevant sense, or whether counting it as one empties the notion of cost of content.
  - A signal that imposes the same fixed toll on every signaller, with no discount for poor quality. A colleague says this cannot be honest, since anyone can pay it. I suspect he is wrong: where the value of the receiver's response rises with the signaller's quality, the marginal benefit separates signallers even when the marginal cost does not. If I am right, the honesty condition cannot be stated in terms of cost at all, and I want the list of requirements to make that explicit.
  - A deception that persists: a mimic is believed because receivers cannot afford to check, and the equilibrium is stable.
  - A trait that carries information without being a signal: a warm body tells a predator where its owner is. The theory has to say what distinguishes a signal from a mere cue, and whether the difference lies in the signaller's design, in the receiver's use, or in the information itself.

  Then the requirements. For each, give the case or consideration that motivates it, and say whether it is a genuine desideratum or a commitment of one camp — that signals must be adaptations, that honesty must be expensive, that signallers must be able to assess their own quality, that receivers' preferences must be explained rather than assumed, and so on. Tell me which requirements cannot be jointly satisfied, and which single requirement does the most to eliminate candidates. Flag any requirement that is really a demand for the theory to do something no theory of a natural phenomenon could do.

  Keep the weight on the criteria; I will run the comparison of candidates myself once I have the list.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Task:** Write a specification (list of requirements/criteria) for a theory of signal credibility.
      *   **Context:** Conceptual chapter of a dissertation on signaling (animal and human).
      *   **Constraint:** Do *not* compare the Handicap Principle with rivals yet. Focus on what *any* adequate theory must deliver.
      *   **Goal:** Use the list to sort traits into signals, cues, and noise, and explain why some honest signals are cheap.
      *   **Input Cases:** The user provides 7 specific cases that the theory *must* cover (Peacock's tail, Stag's roar, Alarm call among kin, Difficult courtship display, Fixed toll signal, Persistent deception, Warm body cue).
      *   **Output Requirements:** For each criterion, provide the motivating case, label it (genuine desideratum vs. camp commitment), identify incompatibilities, identify the most eliminative requirement, and flag impossible demands.
      *   **Tone:** Academic, precise, conceptual, rigorous.

  2.  **Deconstruct the Input Cases & Extract Theoretical Challenges:**
      *   *Peacock's Tail:* Classic Handicap. Costly, condition-dependent, genetic correlation. *Challenge:* Theory must handle differential costs based on quality.
      *   *Stag's Roar:* Index Signal. Physics enforces honesty. No "waste." *Challenge:* Theory must distinguish between cost-enforced honesty and constraint-enforced honesty.
      *   *Alarm Call (Kin):* Common Interest. Cheap. Honesty via aligned fitness. *Challenge:* Theory must account for honesty without differential costs or constraints.
      *   *Difficult Display:* Performance/Skill. Failure rate vs. Resource cost. *Challenge:* Define "cost." Is difficulty a cost? Does it risk emptying the term?
      *   *Fixed Toll Signal:* Marginal Benefit vs. Marginal Cost. User suspects cost isn't the key; benefit separation is. *Challenge:* Theory must allow honesty via benefit differences, not just cost differences.
      *   *Persistent Deception:* Mimicry/Bluffing. Stable equilibrium despite lying. *Challenge:* Theory must explain stability of dishonesty (or define signal such that this is excluded/included).
      *   *Warm Body (Cue):* Information without intent/design. *Challenge:* Distinguish Signal vs. Cue. Design? Evolutionary history? Receiver response?

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Differentiation.* The theory must distinguish Signals from Cues.
          *   *Motivation:* Warm body case.
          *   *Status:* Genuine desideratum (classification).
      *   *Requirement 2: Honesty Mechanism.* The theory must specify *why* the information is reliable.
          *   *Motivation:* All cases, especially Peacock vs. Stag vs. Kin.
          *   *Status:* Genuine desideratum.
      *   *Requirement 3: Cost Definition.* The theory must define "cost" precisely enough to include/exclude difficulty and fixed tolls.
          *   *Motivation:* Difficult display & Fixed toll cases.
          *   *Status:* Camp commitment (Handicap proponents say cost is essential; others say benefit separation works).
      *   *Requirement 4: Stability.* The theory must explain why the system doesn't collapse (e.g., due to deception).
          *   *Motivation:* Persistent deception case.
          *   *Status:* Genuine desideratum (Game Theoretic stability).
      *   *Requirement 5: Origin/Design.* Does the trait need to be an adaptation *for* signaling?
          *   *Motivation:* Cue vs. Signal.
          *   *Status:* Camp commitment (Ethology vs. Information Theory).
      *   *Requirement 6: Receiver Psychology.* Does the receiver need to evaluate cost, or just respond?
          *   *Motivation:* Fixed toll/Stag roar.
          *   *Status:* Camp commitment.

  4.  **Refining and Structuring the Specification:**
      *   I need to organize these into a coherent list of "Adequacy Conditions."
      *   I need to explicitly address the user's specific theoretical hunches (e.g., about marginal benefits).
      *   I need to highlight the tensions (e.g., Cost vs. Benefit separation).

      *   *Drafting Condition 1: The Signal-Cue Distinction.* (Based on Warm Body). Needs to address evolutionary history vs. current utility.
      *   *Drafting Condition 2: The Honesty Condition.* (Based on Peacock, Stag, Kin). Needs to allow multiple pathways (Cost, Constraint, Common Interest).
      *   *Drafting Condition 3: The Cost/Benefit Accounting.* (Based on Fixed Toll, Difficult Display). This is the crux. The user wants to move away from "cost" as the sole arbiter.
      *   *Drafting Condition 4: Equilibrium Stability.* (Based on Deception).
      *   *Drafting Condition 5: Cognitive Demands.* (Implicit in Stag/Fixed Toll). Does the animal need to calculate?

  5.  **Addressing Specific User Instructions:**
      *   "Tell me which requirements cannot be jointly satisfied." (e.g., Strict Cost Requirement vs. Fixed Toll/Benefit Separation).
      *   "Which single requirement does the most to eliminate candidates." (Likely the Honesty Condition or Signal-Cue Distinction).
      *   "Flag any requirement that is really a demand for the theory to do something no theory of a natural phenomenon could do." (e.g., Requiring conscious intent in animals).

  6.  **Developing the Content (Mental Check against Cases):**
      *   *Peacock:* Needs Cost/Condition link.
      *   *Stag:* Needs Index/Constraint link (not cost).
      *   *Kin:* Needs Common Interest link (not cost).
      *   *Display:* Needs Performance link (is failure a cost?).
      *   *Fixed Toll:* Needs Benefit Separation (User's specific point).
      *   *Deception:* Needs Stability explanation.
      *   *Warm Body:* Needs Signal/Cue boundary.

  7.  **Finalizing the List of Requirements:**
      1.  **The Intentionality/Design Criterion (Signal vs. Cue).**
      2.  **The Honesty Maintenance Criterion.** (Must explain *how* reliability is kept).
      3.  **The Cost-Benefit Symmetry Criterion.** (Must allow benefit separation, not just cost differentiation).
      4.  **The Stability Criterion.** (Must handle deception equilibria).
      5.  **The Cognitive Minimalism Criterion.** (Must not require human-like calculation).

  8.  **Review against Constraints:**
      *   Did I compare Handicap to rivals? No.
      *   Did I focus on specification? Yes.
      *   Did I use the cases? Yes.
      *   Did I label desiderata vs. commitments? Yes.
      *   Did I identify incompatibilities? Yes.

  9.  **Polishing the Tone:**
      *   Ensure it sounds like a dissertation chapter guide.
      *   Use precise terminology (e.g., "Separating Equilibrium," "Index," "Common Interest").
      *   Make sure the "Fixed Toll" insight is validated (it's a known argument in signaling theory, often associated with Grafen or later refinements, but the user wants it as a requirement for *any* theory).

  10. **Final Polish:** Check the "Impossible Demand" instruction. A common trap is requiring the *organism* to understand the theory. The theory must explain the behavior, not require the animal to do the math.

      *(Self-Correction during drafting)*: I need to be careful with the "Fixed Toll" case. The user says: "where the value of the receiver's response rises with the signaller's quality, the marginal benefit separates signallers even when the marginal cost does not." This is a crucial theoretical point (often associated with the "Strategic Cost" or benefit-based models). I must ensure Requirement 3 captures this without biasing towards Handicap.

      *(Self-Correction on Signal vs. Cue)*: The literature is divided. Some say Signal = Adapted for communication. Some say Signal = Receiver response evolved. I need to present this as a choice the dissertation must make, labeling it a commitment.

      *(Incompatibility)*: The biggest tension is between "Honesty *must* be expensive" (Handicap commitment) and "Honesty can be cheap via benefit separation/common interest" (User's cases). I need to highlight that a theory requiring universal cost fails the Kin and Stag cases.

      *(Eliminative Requirement)*: The Honesty Maintenance Criterion is the strongest filter.

      *(Impossible Demand)*: Requiring "Conscious Intent" for animals.

      Let's assemble the response.

      *Structure:*
      1.  Introduction (acknowledging the task).
      2.  The Specification (The 5 Requirements).
      3.  Analysis of Tensions/Incompatibilities.
      4.  The Eliminative Requirement.
      5.  Impossible Demands.
      6.  Conclusion.

      *Refining the "Fixed Toll" point:* This is essentially the argument that differential *benefits* can sustain honesty even with identical costs. A theory that mandates differential *costs* (strict Handicap) fails this. I will frame this as a requirement for "Accounting Completeness."

      *Refining the "Difficulty" point:* Is failure a cost? It's a risk cost. The theory needs to define if *risk* counts as *cost*.

      *Refining the "Deception" point:* If deception persists, is it still a signal? Or is the system a mix? The theory must define the boundary of "signal" in the presence of noise/lying.

      Okay, ready to write.
answer: |-
  Below is a specification for a theory of signal credibility. It is structured as a set of adequacy conditions. Each condition is motivated by the cases you provided, categorized by its theoretical status (desideratum vs. commitment), and analyzed for its logical weight.

  ### Specification for a Theory of Signal Credibility

  #### 1. The Signal-Cue Distinction Criterion
  **Requirement:** The theory must provide a non-arbitrary boundary between a *signal* (a trait evolved to modify receiver behavior) and a *cue* (a trait used by a receiver but not evolved for that purpose).
  **Motivation:** The **Warm Body** case. A predator using body heat to find prey is utilizing information, but calling this "signaling" collapses the distinction between adaptation and byproduct.
  **Status:** **Genuine Desideratum.** Without this, the theory cannot define its own subject matter. However, *where* the line is drawn is a **Camp Commitment**.
  *   *Commitment A (Sender-Centered):* A signal requires evolutionary design *for* communication (excludes cues).
  *   *Commitment B (Receiver-Centered):* A signal is defined by the receiver's evolved response (may include cues if the response is specialized).
  *   *Commitment C (Information-Centered):* A signal is any reliable correlation (collapses the distinction).
  **Note:** Your dissertation must explicitly choose A, B, or C. Choice A is standard in ethology; Choice B is common in sensory ecology.

  #### 2. The Honesty Maintenance Criterion
  **Requirement:** The theory must specify the mechanism that prevents the system from collapsing into universal dishonesty (noise). It must explain why low-quality senders do not mimic high-quality senders.
  **Motivation:** This covers the **Peacock**, **Stag**, and **Alarm Call** cases. It forces the theory to account for reliability.
  **Status:** **Genuine Desideratum.** Any theory of credibility must explain credibility.
  **Constraint:** The theory cannot simply assert "signals are honest." It must identify the *invariant* that keeps them so.
  *   In the **Peacock**, the invariant is differential cost.
  *   In the **Stag**, the invariant is physical constraint (index).
  *   In the **Alarm Call**, the invariant is common interest (kin selection).
  **Implication:** A theory that mandates *only* differential cost (strict Handicap) fails this criterion because it cannot classify the Stag or the Alarm Call as honest signals. To be adequate, the theory must allow for multiple pathways to honesty (Cost, Constraint, or Common Interest).

  #### 3. The Accounting Completeness Criterion (Cost vs. Benefit)
  **Requirement:** The theory must account for stability in terms of net fitness payoffs, allowing for separation via differential *benefits* even when *costs* are identical.
  **Motivation:** The **Fixed Toll** case. Your colleague argues that identical costs preclude honesty. You argue that if the benefit of the receiver's response scales with quality, high-quality signallers gain more from the signal than low-quality ones, sustaining honesty despite identical costs.
  **Status:** **Camp Commitment.**
  *   *Strict Handicap Commitment:* Honesty *requires* differential costs (marginal cost of signaling must be lower for high quality).
  *   *General Game-Theoretic Commitment:* Honesty requires a *separating equilibrium*, which can be achieved via differential costs OR differential benefits.
  **Implication:** If you adopt the Strict Handicap Commitment, you must classify the Fixed Toll case as "not a signal" or "unstable." If you adopt the General Commitment, you validate your intuition but dilute the specific explanatory power of "handicaps." This requirement is the primary friction point between the Handicap Principle and broader signaling theory.

  #### 4. The Performance vs. Expenditure Criterion
  **Requirement:** The theory must define whether "cost" refers strictly to resource expenditure (energy, material, risk of predation) or if it includes performance failure rates (skill constraints).
  **Motivation:** The **Difficult Display** case. If a weak male fails the display, is that a "cost"? He did not pay the cost; he was unable to pay it.
  **Status:** **Camp Commitment.**
  *   *Waste-Based Commitment:* Cost must be a net loss of fitness resources (Zahavi's original waste). Failure rates are constraints, not costs.
  *   *Efficacy-Based Commitment:* Any barrier to signaling that correlates with quality counts as a "cost" in the broad economic sense.
  **Implication:** Counting failure rates as costs risks emptying the notion of cost of content (tautology: "only those who can signal, signal"). An adequate theory must distinguish between *paying a price* (Peacock) and *meeting a threshold* (Stag/Display).

  #### 5. The Stability of Deception Criterion
  **Requirement:** The theory must explain the conditions under which dishonesty can persist without destroying the signaling channel.
  **Motivation:** The **Persistent Deception** case. If mimics exist and are believed, the system is not perfectly honest.
  **Status:** **Genuine Desideratum.** Natural systems are rarely 100% honest. A theory that requires perfect honesty describes no biological reality.
  **Constraint:** The theory must define the tolerance threshold. At what frequency of deception does the trait cease to be a signal and become noise?
  **Implication:** This requires a probabilistic or equilibrium-based definition of credibility, rather than a binary one.

  #### 6. The Cognitive Minimalism Criterion
  **Requirement:** The theory must not require the signaller or receiver to consciously calculate costs, benefits, or quality.
  **Motivation:** All animal cases (Peacock, Stag, Bird).
  **Status:** **Impossible Demand (if violated).** A theory of natural phenomena cannot demand conscious arithmetic from the subjects.
  **Implication:** The "costs" and "benefits" are currency for the theorist, not the animal. The mechanism must be implementable via instinct, conditioning, or simple heuristics. If a theory requires the stag to *know* his resonating chamber size relative to a rival to decide to roar, it is biologically implausible.

  ---

  ### Analysis of Tensions and Incompatibilities

  **1. The Cost-Benefit Incompatibility**
  You cannot jointly satisfy the **Strict Handicap Commitment** (Honesty *must* be expensive/differential cost) and the **Accounting Completeness Criterion** (Fixed Toll case).
  *   If you insist that cost differences are necessary, the Fixed Toll case is theoretically impossible.
  *   If you accept the Fixed Toll case as valid signaling, you must abandon the claim that "expense stops the low-quality." In the Fixed Toll case, *benefit differences* stop the low-quality (because the toll isn't worth it for them, even if they could afford it).
  *   **Resolution:** To cover your cases, you must adopt the General Game-Theoretic Commitment. Honesty is maintained by a *differential net payoff*, not necessarily a differential cost.

  **2. The Design vs. Information Incompatibility**
  You cannot jointly satisfy **Commitment A** (Signal = Adaptation for communication) and the **Warm Body** case if you wish to treat the Warm Body as a signal.
  *   If the Warm Body is a cue, the theory must explain why receivers treat cues and signals differently (e.g., signals are more resistant to manipulation).
  *   If the Warm Body is a signal, you must argue that the prey evolved to be warm *to be found* (absurd) or drop the design requirement.
  *   **Resolution:** Maintain the distinction. The Warm Body is a cue. The theory must explain why signals evolve *out of* cues (ritualization) and what stabilizes the signal against the cue's vulnerability to manipulation.

  **3. The "Cost" Definition Tension**
  There is a tension between the **Peacock** (resource cost) and the **Stag** (physical constraint).
  *   If you define cost broadly to include physical constraints (Stag), then the Peacock's tail is just a constraint of "viability."
  *   If you define cost narrowly (resource waste), the Stag's roar is not a handicap.
  *   **Resolution:** Your specification should distinguish **Index Signals** (honesty via physical constraint, e.g., Stag) from **Handicap Signals** (honesty via strategic cost, e.g., Peacock). A single theory of "signaling" must encompass both, but a single theory of "handicaps" should not. Since your dissertation is on *signaling*, you must accommodate both.

  ### The Eliminative Requirement

  **The Honesty Maintenance Criterion (Requirement 2)** does the most work to eliminate candidates.
  Many intuitive explanations for signaling fail here.
  *   *"Signals are honest because lying is bad for the species"* (Group Selection): Eliminated. Unstable against cheaters.
  *   *"Signals are honest because receivers punish liars"* (Policing): Eliminated, unless the policing itself is costly and stable (leads back to cost/benefit analysis).
  *   *"Signals are honest because they are conventional"* (Arbitrary): Eliminated, unless there is a cost to deviating.

  Any theory that cannot demonstrate a **Nash Equilibrium** or an **Evolutionarily Stable Strategy (ESS)** where honesty yields higher fitness than dishonesty is inadequate. This eliminates moralistic, group-selectionist, and purely psychological accounts that lack an evolutionary fitness backbone.

  ### Impossible Demands to Avoid

  **The "Conscious Assessment" Demand.**
  Do not require the theory to explain how a peacock *knows* his tail is costly. The theory must explain how the *trait* persists, not how the *mind* calculates.
  *   *Flag:* Any requirement that the signaller assesses their own quality *before* signaling is suspect. In many models (e.g., sequential assessment), quality is revealed *through* the signaling process, not assessed beforehand.
  *   *Flag:* Any requirement that the receiver calculates the "true value" of the signal. Receivers often use simple thresholds (e.g., "If roar < frequency X, attack").

  ### Summary for Your Chapter

  To build your conceptual chapter, structure the specification around these three pillars:

  1.  **Classification:** Define Signal vs. Cue based on evolutionary history (Design), not just information content. (Excludes Warm Body from Signal class).
  2.  **Stability:** Define Honesty as a Separating Equilibrium. Explicitly state that separation can be driven by Differential Costs (Peacock), Physical Constraints (Stag), or Differential Benefits (Fixed Toll/Kin). This validates your intuition about the Fixed Toll case without abandoning the Handicap principle for the Peacock.
  3.  **Mechanism:** Ensure the explanation relies on fitness consequences, not cognitive calculation.

  This specification allows you to sort traits:
  *   **Peacock:** Signal (Design), Handicap (Cost).
  *   **Stag:** Signal (Design), Index (Constraint).
  *   **Alarm Call:** Signal (Design), Common Interest (Benefit alignment).
  *   **Warm Body:** Cue (No Design).
  *   **Mimic:** Signal (Design), Dishonest Equilibrium (Stable Deception).

  This framework prevents you from forcing the Handicap Principle to do work it cannot do (explain indices or common interest) while preserving its core insight for the cases where cost is the driving factor.
