answer: |-
  **The Assay**

  Elias had begun to suspect that his fidelity was merely a lack of opportunity. It was a quiet suspicion, the kind that grows in the silence between words spoken at dinner. He loved his wife, Clara. He told her so. He brought her flowers. He came home when he said he would. But these were actions, and actions could be performed by a man who was simply afraid of the trouble that followed straying. He wanted to know if the steel inside him was real, or if it was only paint.

  He devised a regimen. He would not avoid the places where men were tempted; he would seek them. He joined a private club known for its late hours and its loose morals. He accepted invitations to drinks with colleagues who spoke of mistresses with the casual pride of men discussing car engines. He told himself this was exposure therapy. If he could stand in the fire and not burn, then the fireproofing was inherent. If he walked away, he would know he was true.

  He knew, even as he signed the club membership form, that the test was flawed. He knew that by choosing to walk into the fire, he was no longer a man resisting temptation, but a man conducting an experiment. The resistance would not be born of devotion, but of methodology. A scientist does not drink the poison to prove he is healthy; he analyzes it. By analyzing the temptation, he removed its power to tempt, and thus removed his own power to resist it virtuously. He was turning a moral struggle into a procedural hurdle.

  He knew this. He proceeded anyway.

  His friend Thomas was different. Thomas was a man of apparent solidities. Thomas never went to the club. Thomas never lingered on the subject of other women. When the topic arose, Thomas did not stiffen or preach; he simply changed the subject to football or the price of timber. His fidelity looked like a fact of nature, like gravity. It required no announcement.

  Elias watched Thomas with a mixture of envy and skepticism. He suspected Thomas was not virtuous, but oblivious. Perhaps Thomas did not see the women. Perhaps the mechanism that registered desire in other men was broken in him. If a man does not feel the pull, staying in place is not steadfastness; it is inertia. Elias wanted the pull. He wanted to feel the weight on the line and know that the hook held.

  One Tuesday, the club was quiet. Elias sat in a leather armchair in the corner, a glass of whiskey untouched on the table before him. He was waiting. He had arranged to meet a client there, a woman named Julianne who had made it clear, through smiles that lasted a second too long and touches on the forearm that lingered, that she was available.

  This was the trigger. He had engineered the circumstance. He had ensured the load would be applied to the alloy.

  Julianne arrived at ten. She wore a red dress that caught the low light of the lamps. She sat opposite him. The conversation was light, professional, then gradually, imperceptibly, it became personal. She spoke of her loneliness. She spoke of how rare it was to find a man who listened. She leaned forward. The space between them collapsed.

  Elias felt the shift in the air. This was the moment. The load was applied.

  He waited for the feeling of devotion to Clara to rise up, a shield against the offer. He waited for the memory of Clara's laugh, or the sight of her sleeping face, to push Julianne away.

  Instead, he felt a sharp, cold clarity. He felt his own mind observing the situation. He noted the pulse in his wrist. He noted the proximity of Julianne's hand. He noted the exit strategy. He was not experiencing fidelity; he was managing risk. He was calculating the probability of discovery, the cost of divorce, the disruption to his routine. The calculation was efficient. It was precise. It was not love.

  The blocking condition was his own caution. It was a disposition he had always valued—prudence, foresight, the ability to see consequences. Now, it stood between him and the test. If he refused Julianne, was it because he belonged to Clara? Or was it because he belonged to his own safety? The caution was so seamless, so much a part of his character, that it was indistinguishable from virtue. It looked like steadiness. It felt like control. But it might have been nothing more than a fear of chaos.

  Julianne suggested they go elsewhere. A bar down the street. Something quieter.

  Elias looked at her. He saw the invitation in her eyes. He saw the open door.

  He stood up. He buttoned his jacket. He told her he had an early morning. He told her he had to get home.

  It was the correct action. It was the action of a faithful husband.

  Julanne smiled, a tight, disappointed curve of the lips. She understood. She gathered her things. They parted ways at the door.

  Elias walked home. The streets were empty. The air was cold. He rehearsed the lie he would tell Clara if she asked where he had been, then discarded it. He would tell her the truth. He had been at the club. He had been with Julianne. He had come home.

  When he entered the house, the hallway was dark. He left his shoes by the door. He walked into the bedroom. Clara was asleep, her breathing steady, one arm thrown over the side of the bed where he would lie.

  He stood there for a long time. He waited for the feeling of relief. He waited for the feeling of guilt. He waited for the feeling of love.

  He felt a profound exhaustion. It was the exhaustion of a man who has carried a heavy weight across a room only to realize the weight was empty.

  He thought of Thomas. Thomas was likely asleep beside his wife, without a single calculation running through his head. Thomas's night was smooth, unbroken by tests. If Elias asked Thomas, Thomas would say he came home because he wanted to come home. Elias could not say that. Elias had come home because he had completed the procedure.

  He undressed in the dark. He slid into the bed. The sheets were cool. Clara stirred, murmuring something unintelligible, and her hand found his in the sleep-darkness. She squeezed his fingers, a reflex of recognition, and then settled back into dreams.

  Elias lay awake. He analyzed the squeeze of her hand. Was it an anchor? Or was it just pressure?

  He considered the three possibilities, though he did not name them.

  Perhaps the test had destroyed what he was measuring. Perhaps by looking for his loyalty, he had frightened it away, leaving only the hollow shell of caution behind. The basis was gone, burned out by the scrutiny.

  Perhaps the loyalty was still there, intact and strong, but the caution had stepped in front of it, blocking the view. The loyalty had pushed against the temptation, but the caution had locked the door from the inside. The outcome was the same, but the mechanism was hidden.

  Perhaps he had never had the loyalty at all. Perhaps he was merely a man who liked order, and fidelity was just a subset of order. The outcome was produced by something else altogether, in a thing that never had the disposition to begin with.

  He looked at the ceiling. The shadows from the streetlamp outside shifted as a car passed.

  Clara's hand was still resting on his chest. It was heavy. It was warm. It was real.

  He closed his eyes. He decided he would not tell her about the test. To tell her would be to invite her to measure him too, and he could not survive a second assay. He would simply stay. He would lie here until morning. He would get up and make coffee. He would kiss her cheek.

  He would perform the actions of a faithful husband. He would perform them perfectly.

  He listened to the rhythm of her breath. It was the only metric left. He matched his own breathing to hers, in and out, steady and slow, until he could no longer tell which breath was his and which was hers, or if there was any difference at all. He lay still, waiting for the morning, keeping the promise he had made to himself, or perhaps keeping the promise he had made to the test, or perhaps keeping no promise at all, merely occupying the space where a promise ought to be.

  Outside, the wind picked up, rattling the window frame. It sounded like something trying to get in. Elias did not move to check the lock. He kept his eyes closed. He kept his hand over Clara's. He waited for the sun.
