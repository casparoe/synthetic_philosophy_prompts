prompt: |-
  I have just been appointed to the ethics committee that reviews end-of-life decisions at the hospital where I work, and nearly every case turns on the line between doing something that ends a patient's life and allowing the patient to die. The committee invokes that line constantly, but no one can say what it tracks, and the cases we actually see do not resemble the ones in the textbooks. Before I vote on another one, I want the specification rather than another theory: what must any adequate account of the doing/allowing distinction deliver, given that we need it to justify decisions we are accountable for?

  Lay out the desiderata. Which cases must the account get right — the pair in which one man holds a child under water while another watches the child drown; withdrawing a ventilator versus withholding it in the first place; disconnecting a ventilator versus administering a lethal injection; cases in which the only difference is a device's default setting, such as a pump that must be actively re-programmed to keep delivering a drug; and cases in which the act is carried out in real time by an automated system that a clinician configured weeks earlier? Which distinctions must it preserve — between doing and allowing, intending and foreseeing, acting and omitting, and between the causal and the moral senses of causing? And what must it be consistent with — the law's act/omission doctrine, the asymmetry in how ordinary people judge the two kinds of case, and the fact that many clinical guidelines treat withholding and withdrawing treatment as morally equivalent while patients and families do not?

  Give the case or consideration that motivates each requirement, mark which of them are genuine desiderata and which are merely the prejudices of one camp, and say whether some subset cannot be jointly satisfied — that is the part I most need, since I suspect the committee wants it both ways. Then tell me which single requirement does the most to exclude the accounts usually on offer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A newly appointed member of a hospital ethics committee reviewing end-of-life decisions.
      *   **Context:** The committee relies heavily on the "doing vs. allowing" distinction (act/omission) to justify decisions, but the distinction is theoretically murky and doesn't match textbook cases. The user needs practical guidance *before* voting.
      *   **Task:** Specify the *desiderata* (requirements) for an adequate account of the doing/allowing distinction in this specific context.
      *   **Specific Requirements:**
          *   Lay out the desiderata.
          *   Identify specific cases the account must handle (drowning child, withholding/withdrawing ventilator, lethal injection vs. disconnect, device default settings, automated systems).
          *   Identify distinctions to preserve (doing/allowing, intending/foreseeing, acting/omitting, causal/moral causing).
          *   Identify consistency requirements (law, ordinary judgment, clinical guidelines vs. family perception).
          *   **Crucial:** Mark which are genuine desiderata vs. prejudices.
          *   **Crucial:** Identify incompatibilities (which subset cannot be jointly satisfied).
          *   **Crucial:** Identify the single requirement that excludes most standard accounts.
      *   **Tone:** Philosophical, rigorous, practical, direct, acknowledging the tension ("wants it both ways").

  2.  **Deconstruct the Problem:**
      *   The core tension in bioethics is between *moral theory* (which often struggles to find a robust difference between killing and letting die) and *clinical/legal practice* (which relies heavily on that difference).
      *   The user suspects the committee "wants it both ways." This is a key insight. They want the moral comfort of "we didn't kill him" (allowing) while achieving the same outcome as "we ended his suffering" (doing).
      *   Standard accounts (causal, counterfactual, intentional) often fail to capture the nuance required in clinical settings, especially with technology (pumps, automated systems).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Intuitive Cases.* The drowning child case (Foot/Quinn). One pushes, one watches. Moral intuition says pusher is worse. An account must explain why.
      *   *Requirement 2: Clinical Equivalence.* Withholding vs. Withdrawing. Guidelines say they are equivalent. Intuition/Families say withdrawing is harder/worse. The account needs to navigate this.
      *   *Requirement 3: Lethal Injection vs. Extubation.* Law says one is murder, one is allowing death. Morality? Debatable. The account must align with legal permissibility here.
      *   *Requirement 4: Technology/Defaults.* The pump setting. Is failing to reprogram an act or omission? The automated system configured weeks ago. Is the doctor acting *now*?
      *   *Requirement 5: Consistency.* Law, Folk Psychology, Guidelines.

  4.  **Evaluating "Genuine" vs. "Prejudice":**
      *   *Genuine:* Legal compliance (you can't vote for murder), Clinical coherence (guidelines need to make sense), Accountability (you need to know *why* you are responsible).
      *   *Prejudice:* The idea that "allowing" is *always* less morally weighty than "doing" (sometimes allowing is negligent homicide). The idea that guidelines are morally perfect (they are often pragmatic compromises). The idea that family intuition is morally binding (it's emotionally valid but not ethically definitive).

  5.  **Identifying Incompatibilities (The "Impossible Trinity"):**
      *   This is the heart of the user's suspicion.
      *   Triangle:
          1.  **Moral Consistency:** Withholding and Withdrawing are morally equivalent (as guidelines say).
          2.  **Legal/Doctrinal Consistency:** Doing (killing) is legally/morally distinct from Allowing (letting die) (as the law says).
          3.  **Psychological/Phenomenological Consistency:** Withdrawing *feels* like doing (as families/clinicians experience it).
      *   *Conflict:* If you say Withdrawing = Allowing (to match Law), you violate Moral Consistency (if Withholding = Allowing, then Withdrawing = Withholding). But if Withdrawing *feels* like Doing, maintaining the distinction requires ignoring the phenomenology.
      *   *Real Conflict:* The Law distinguishes Act/Omission. Guidelines say Withhold/Withdraw are equivalent. But Withdrawing is physically an *Act* (turning off a switch). To make Withdrawing an *Omission* (to fit the "allowing" side of the law), you need a theory that defines acts/omissions not by physics but by normativity. But then the "Automated System" case breaks it.

  6.  **Selecting the "Killer" Requirement:**
      *   What excludes most accounts (Causal, Counterfactual, Intentional)?
      *   Most accounts rely on *causal contribution*. But in end-of-life, the disease causes death in both cases.
      *   Most accounts rely on *intention*. But double effect covers that.
      *   The hardest requirement is **Technological Neutrality / Temporal Stability**.
      *   *Why?* Because standard accounts focus on the *moment* of decision. If a pump stops because no one reprogrammed it, is that an act? If a doctor sets a timer weeks ago, is the death an act *now*?
      *   *Actually, a stronger candidate:* **The requirement to validate the equivalence of withholding and withdrawing while maintaining the distinction between killing and letting die.**
      *   *Wait, let's look closer.* The prompt asks for the single requirement that excludes accounts *usually on offer*.
      *   Standard accounts (e.g., Quinn, Foot, Doctrine of Double Effect) often fail to handle the *institutional/normative* nature of medical duties.
      *   *Best Candidate:* **The requirement that the distinction track normative expectations rather than causal mechanics.** (Because causal mechanics say turning off a ventilator causes death just as much as injection).
      *   *Alternative:* **The requirement to accommodate the "Default Setting" intuition.** (Is failing to reset a pump an omission? Most causal theories say the lack of drug caused death, but the *failure* was the cause).
      *   *Let's go with the Incompatibility first.* The user suspects the committee wants it both ways. I need to confirm that.
      *   *Incompatibility:* You cannot simultaneously satisfy: (1) The Legal Act/Omission Doctrine, (2) The Clinical Guideline Equivalence (Withhold = Withdraw), and (3) The Causal Intuition (Turning off a machine is a cause).
      *   *The "Killer" Desideratum:* **Action-Description Sensitivity.** The account must allow the *same physical movement* (flipping a switch) to be an omission in one context (ventilator) and an action in another (light switch), based on prior obligations. Most standard metaphysical accounts fail this because they look at the physics, not the duty.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity and the suspicion (you are right to be suspicious).
      *   **The Desiderata List:** Group them by Cases, Distinctions, and Consistency.
      *   **Classification:** Label each as Genuine or Prejudice.
      *   **The Incompatibility Proof:** Show the triangle of tension (Law vs. Guidelines vs. Physics).
      *   **The Exclusionary Requirement:** Identify the one that kills standard theories.
      *   **Conclusion:** Practical advice for the vote.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address the automated system case? Yes, need to ensure the theory handles temporal distance.
      *   *Check:* Did I address the drowning child? Yes, that's the baseline intuition pump.
      *   *Check:* Did I distinguish "Genuine" vs "Prejudice"? Need to be careful not to dismiss family feelings as *just* prejudice, but acknowledge they aren't binding ethical truth.
      *   *Refinement on Incompatibility:* The real impossibility is between **Causal Symmetry** (physics is the same in withdraw/inject) and **Moral Asymmetry** (one is okay, one isn't). To bridge this, you need a **Normative** account, not a **Descriptive** one.
      *   *Refinement on the "Killer":* The requirement that **the classification of an act/omission must depend on the baseline of expected care, not the physics of the movement.** This kills causal theories.

  9.  **Final Polish:** Ensure the tone is professional, ethically serious, and directly answers the prompt's specific constraints. (Make sure to explicitly mark Genuine vs. Prejudice).

      *(Self-Correction on the "Killer Requirement")*: The prompt asks what excludes accounts *usually on offer*. Most accounts on offer are causal or counterfactual (e.g., "did the agent intervene in a causal chain?"). The requirement that excludes these is the one that demands the distinction hold even when the causal contribution is identical (Withdrawing vs. Injecting). So, the requirement is **Causal Invariance**: The account must yield different moral classifications for actions with identical causal structures.

      *Wait, let's look at the "Default Setting" case.* If a pump stops because it wasn't reprogrammed, is that an omission? If the account relies on "movement," it's an omission. If it relies on "cause," the lack of drug is the cause. The hardest thing is the *automated system configured weeks ago*. Is the death an act *now*? Standard accounts struggle with temporal distance.
      *Decision:* I will argue the "Killer" is the requirement that **moral classification must remain stable across technological mediation.** (i.e., using a machine doesn't change the act/omission status in ways that break moral intuition). Actually, no, the strongest is **The Equivalence Constraint** (Withhold = Withdraw) combined with **The Legal Constraint** (Killing != Letting Die).

      *Let's settle on the Incompatibility:* You cannot have (1) A purely causal definition of action, (2) The legal permission to withdraw but not inject, and (3) The guideline claim that withholding and withdrawing are equivalent.
      *Why?* Because withdrawing is causally closer to injecting than to withholding. If Withhold = Withdraw (moral), and Withdraw != Inject (moral), then Withhold != Inject. But if the definition is causal, Withdraw ~= Inject.
      *Okay, I will frame the "Killer Requirement" as the demand for **Normative Baseline Dependency**.* (Whether something is an act or omission depends on what you were supposed to do, not what you physically did). This kills causal theories.

  10. **Final Review against Prompt:**
      *   Lay out desiderata? Yes.
      *   Which cases must it get right? (Drowning, Vent, Injection, Pump, Auto). Yes.
      *   Which distinctions preserve? (Doing/Allowing, Intend/Foresee, etc.). Yes.
      *   What must it be consistent with? (Law, Folk, Guidelines). Yes.
      *   Mark Genuine vs. Prejudice? Yes.
      *   Say which subset cannot be jointly satisfied? Yes.
      *   Which single requirement excludes standard accounts? Yes.

