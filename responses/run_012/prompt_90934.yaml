th. If you want to keep steps two and seven while rejecting four, you are in good company with philosophers like T.M. Scanlon or Derek Parfit who tried to find a way for numbers to count without full aggregation. This combination is coherent, but it requires you to say that the presence of additional people creates additional moral reasons that are not simply the sum of the parts but still outweigh the reason to save the single individual. You are essentially saying that fairness requires giving each person a chance, but fairness also requires recognizing that ignoring the millionth person is worse than ignoring the single person because there are a million instances of loss rather than one. This avoids utilitarianism because you are still focused on the individual claims rather than a collective total, but it avoids Taurek's absurdity because you acknowledge that the multiplicity of claims matters. So my advice is to trust your intuition on step seven and reject step four, but be prepared to defend a view of weighted probability rather than simple summation. You do not have to become a utilitarian to say that saving the million is better, you just have to accept that the moral force of multiple individual claims can outweigh the moral force of a single individual claim even if those claims remain distinct. This is the price of avoiding the coin toss conclusion, and it is a price most ethicists are willing to pay.

