prompt: |-
  I do the records for a small maritime heritage trust — we own one old sailing vessel, a couple of sheds, and about four hundred feet of spare timber, and I'm the one who has to write the paperwork whenever a question comes up about whether the thing we've got is still the same boat. I never went to university, but I've been reading around the old Theseus puzzle for a few years now and I've got a feeling its not just a puzzle, it's basically my job, and I keep getting it wrong.

  The decisions come up maybe six times a year and they all seem to want different answers. The insurer wants to know if a rebuilt hull counts as the same vessel so the policy carries over. The heritage listing people want to know if it's still the listed ship or a new one. The donors want to know if their grandfather's plank is still in it. If we ever sold her or broke her up, someone would ask whether we're selling the ship or just a pile of timber shaped like a ship. And there's a rival group down the coast who built a replica off the original lines and are now going round saying they've got the real continuation of her, which makes me want to hit someone.

  Could you write me a procedure I can actually run: a list of questions in the order I should ask them, what counts as a good enough answer to each, where the procedure just stops and says no, and where I should stop pretending it's a factual question and take it to the trustees as a decision about what we want the ship to mean. I think the one thing I've half worked out for myself is that "the same ship" isn't one question, it's several — same for the insurance, same for the listing, same for the visitors — so the procedure has to be able to come out differently for different purposes without me looking like I'm just making it up as I go. I'd also like it to cope with the fact that a ship is a bit like a company or a club: it outlives every plank and every member and somehow carries on, and I don't know if that's a real thing or just a way of talking. Please explain any jargon in plain words, I don't know what sortal means and I looked it up once and forgot.

  Then run it on three cases. Our own boat after thirty years of replacement timber, where I honestly couldn't tell you what percentage is original anymore. The rival replica, which has none of the original material at all but was built to the original drawings by people who'd worked on ours. And the old keel and six frames sitting in a museum in another country, which is the only bit that's definitely original. I've got a trustee meeting in three weeks so it needs to be something I can put in front of people who aren't going to read a book about it. Tell me where it gives an answer I won't like, and what it can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Records officer for a small maritime heritage trust. Practical, experienced, no university degree but well-read on the Ship of Theseus problem. Feels the philosophical puzzle is actually their day-to-day job. Frustrated by conflicting stakeholder demands (insurers, heritage bodies, donors, rivals).
      *   **Task:** Create a practical *procedure* (a flowchart/list of questions) to determine "sameness" of the vessel for different purposes. It needs to handle multiple contexts (insurance, heritage, sentimental/historical). It needs to distinguish between factual questions and value judgments for trustees. It needs to explain jargon (like "sortal").
      *   **Test Cases:** Apply the procedure to three scenarios:
          1.  Their own boat (30 years of replacement timber, unknown original %).
          2.  The rival replica (no original material, built to original lines by ex-workers).
          3.  The museum artifacts (old keel + 6 frames, definitely original, stored elsewhere).
      *   **Constraints:** Plain English (no academic jargon without explanation). Needs to be presentable to trustees in 3 weeks. Must admit limitations ("where it gives an answer I won't like," "what it can't do").
      *   **Tone:** Respectful, practical, empathetic to the burden, acknowledging the philosophical depth without getting lost in it.

  2.  **Deconstruct the Philosophical Problem (Ship of Theseus):**
      *   The core issue is *identity over time*.
      *   Key concepts:
          *   *Material Constitution:* Is it the same stuff? (The planks).
          *   *Spatio-Temporal Continuity:* Is it the same continuous object in space and time? (No gaps in existence).
          *   *Form/Design:* Is it the same shape/plan? (The lines drawings).
          *   *Function:* Does it do the same thing? (Sail).
          *   *Social/Legal Designation:* Do we *say* it's the same? (Registration, listing).
      *   *Sortal:* A term from philosophy (Wiggins, etc.) referring to the kind of thing something is (e.g., "ship" vs. "pile of wood"). A "ship" has different identity conditions than a "pile of wood." I need to explain this simply.

  3.  **Drafting the Procedure (The "Identity Protocol"):**
      *   *Goal:* Make it modular. One size does *not* fit all. The definition of "same" depends on *why* you are asking.
      *   *Structure:*
          1.  **Define the Purpose:** Who is asking? (Insurance, Heritage, Public, Legal).
          2.  **The "Hard Stops" (Factual Checks):** Is it physically capable? Is it legally registered?
          3.  **The "Continuity Check":** Was there a break in existence?
          4.  **The "Significance Check":** What carries the value? (Material vs. Story).
          5.  **The Trustee Decision:** Where facts run out, values take over.
      *   *Jargon Check:* Explain "Sortal" as "The Job Description of the Object."

  4.  **Developing the Test Cases:**
      *   *Case 1 (Own Boat):* High continuity, low original material.
          *   Insurance: Likely "Yes" (continuity of risk).
          *   Heritage: Likely "Yes" (continuity of story).
          *   Donors: "No" (specific plank is gone).
      *   *Case 2 (Rival Replica):* Low continuity, no material, high design fidelity.
          *   Insurance: "No" (different risk object).
          *   Heritage: "No" (unless designated as a replica *of* the original).
          *   Rival's Claim: Weak on continuity, strong on form.
      *   *Case 3 (Museum Keel):* High material, zero function/continuity.
          *   Insurance: "No" (it's artifacts, not a ship).
          *   Heritage: "Yes" (as artifacts), "No" (as a vessel).
          *   Sentimental: "Yes" (the soul of the ship).

  5.  **Refining the Output:**
      *   *Tone:* Professional but conversational. Acknowledge the frustration.
      *   *Formatting:* Clear headings, bullet points, bold text for emphasis.
      *   *Self-Correction during drafting:* I initially thought about making a single flowchart. But the user specifically said "same for insurance, same for listing... procedure has to be able to come out differently." So, the procedure must start by *selecting the lens*.
      *   *Addressing the "Sortal" request:* Keep it very simple. "A ship is a job, wood is a material."
      *   *Addressing the "Company/Club" analogy:* This is the "Functional/Organizational" view of identity. I need to incorporate that into the "Purpose" section.

  6.  **Final Review against User Constraints:**
      *   Plain words? Yes.
      *   Procedure order? Yes.
      *   Stop points? Yes.
      *   Trustee decision points? Yes.
      *   Three cases run? Yes.
      *   Uncomfortable answers admitted? Yes.
      *   Limitations admitted? Yes.

  7.  **Final Polish:** Ensure the distinction between *numerical identity* (literally the one and only object) and *qualitative identity* (exactly similar) is handled practically without using those terms. (Decided to use "The One-and-Only" vs "The Twin" to keep it plain).

  *(Self-Correction on the "Sortal" explanation)*: Don't just define it. Explain *why* it matters. If the sortal is "Historical Artifact," the wood matters most. If the sortal is "Sailing Vessel," the function and continuity matter most.

  *(Self-Correction on the Rival Group)*: Be careful not to dismiss them entirely, but show why the procedure rules against their claim of being the *original* while acknowledging they might be a *valid replica*.

  *(Self-Correction on the Museum Keel)*: This is the trickiest. It's original material but not a ship. The procedure needs to catch this distinction early.

  8.  **Drafting the Response:** (Proceeding to generate output based on these thoughts).
answer: |-
  This is a brilliant brief. You are absolutely right: the Ship of Theseus isn't a riddle for philosophers in armchairs; it is a compliance issue for people like you. The reason you feel like you're "making it up" is that you are trying to find a single factual answer to a question that is actually three different questions wearing a mask.

  You mentioned "sortal." In plain English, a **sortal** is the "job description" of the object. It tells you what rules apply to it.
  *   If the sortal is **"Pile of Timber,"** identity is about the specific wood. If you swap a plank, it's a different pile.
  *   If the sortal is **"Sailing Vessel,"** identity is about function and continuity. You can swap planks, engines, and sails, and it's still the vessel.
  *   If the sortal is **"Historical Artifact,"** identity is about the story and the original material.

  Your job is to pick the right job description before you answer the question.

  Below is a procedure designed for your Trust. It is split into phases. It tells you when you can answer with a "Yes/No" based on facts, and when you must stop and ask the Trustees to make a value judgment.

  ***

  # The Maritime Identity Protocol (MIP)

  **Purpose:** To determine if a vessel (or parts of one) counts as "the same" for specific administrative, legal, or heritage purposes.
  **Rule 1:** There is no single answer. You must select the **Lens** (Phase 1) before asking the questions.
  **Rule 2:** If the procedure reaches the "Trustee Vote" stage, do not decide yourself. Record the options and let them choose.

  ## Phase 1: Select the Lens
  *Who is asking, and what are they paying for or protecting?*

  1.  **The Insurance Lens:** Are we asking about risk, value, and liability?
      *   *Definition of "Same":* Continuous existence and function.
  2.  **The Heritage Lens:** Are we asking about historical designation, listing, or grant eligibility?
      *   *Definition of "Same":* Connection to the original event/era, plus official registration.
  3.  **The Donor/Public Lens:** Are we asking about emotional connection, specific named parts, or "authenticity"?
      *   *Definition of "Same":* Physical presence of original material.
  4.  **The Legal/Ownership Lens:** Are we asking about title, sale, or breaking up?
      *   *Definition of "Same":* Registry number and continuous legal existence.

  *Action: Tick one Lens. If more than one applies, run the procedure for each separately. Do not blend them.*

  ## Phase 2: The Hard Stops (Factual Checks)
  *These questions have Yes/No answers. If you hit a "NO" that triggers a STOP, the answer is definitively "Not the Same" for this Lens.*

  1.  **The Existence Check:** Has the vessel ceased to exist as a functional unit at any point?
      *   *Example:* Was it sunk and raised? Was it fully dismantled and stored in a shed for 10 years?
      *   *If YES (it stopped existing):* **STOP.** For Insurance and Legal Lenses, it is likely a new object. For Heritage, proceed to Phase 3.
  2.  **The Registry Check:** Does it hold the same official registration number (or equivalent national heritage ID) without a break?
      *   *If NO:* **STOP.** For Legal and Insurance Lenses, it is not the same.
  3.  **The Material Check (Donor Lens Only):** Is the specific item in question made of the original material?
      *   *If NO:* **STOP.** For the Donor Lens, it is not the original item (e.g., "Grandfather's plank" is gone).

  ## Phase 3: The Continuity Check (The "Club" Test)
  *This addresses your point about ships being like companies. A company is the same company even if every employee and every desk is replaced, provided the paperwork and operation never stopped.*

  1.  **The Maintenance Chain:** Has there been an unbroken chain of maintenance where the intention was to *keep the ship sailing*, not to *build a new one*?
      *   *Good Answer:* "We replaced ribs as they rotted to keep her afloat."
      *   *Bad Answer:* "We took her apart to see how she was made, then put her back together."
  2.  **The Form Check:** Does the vessel still conform to the original lines and design, or has it been fundamentally altered (e.g., a sailing ship fitted with a diesel engine and hull widened)?
      *   *If fundamentally altered:* **STOP.** For Heritage Lenses, it may now be a "conversion" rather than the original.

  ## Phase 4: The Trustee Decision (The Value Judgment)
  *If you have passed Phase 2 and 3, but the answer still feels uncomfortable, or if the "Rival" question is involved, you have run out of facts. You are now in philosophy.*

  **Trigger this stage if:**
  *   The material is <10% original, but continuity is unbroken.
  *   A rival group claims identity based on design rather than continuity.
  *   The public perception conflicts with the legal reality.

  **Action:** Present the following statement to the Trustees:
  *"Factually, the vessel meets the criteria for [Lens]. However, because [Reason], there is a risk of reputational damage or ethical confusion. Do we wish to prioritize [Continuity] or [Material] for this specific case?"*

  ***

  # Running the Protocol on Your Three Cases

  Here is how the MIP handles your current headaches. I have highlighted where the answer might be painful.

  ### Case 1: Your Own Boat (30 years of replacement timber)
  *   **Lens:** Insurance & Heritage.
  *   **Phase 2 (Hard Stops):**
      *   Existence Check: No (She has been in water/service continuously). **Pass.**
      *   Registry Check: Yes (Same ID number). **Pass.**
  *   **Phase 3 (Continuity):**
      *   Maintenance Chain: Yes (Repairs done to keep her sailing). **Pass.**
      *   Form Check: Yes (Still looks and sails as designed). **Pass.**
  *   **Phase 4 (Trustee Decision):** Not triggered for Insurance/Heritage.
  *   **Result:**
      *   **Insurance:** **YES.** She is the same risk. The policy carries over.
      *   **Heritage Listing:** **YES.** She is the listed ship. Continuity matters more than wood.
      *   **Donor Lens:** **NO.** If you run the Donor Lens, the answer is "No, your grandfather's plank is not in there." You must be honest here. The *ship* is the same, the *plank* is not.
  *   **The Uncomfortable Truth:** You have to tell donors their specific wood is gone, even while telling the insurer the ship is the same. This is not lying; it is switching Lenses.

  ### Case 2: The Rival Replica (No original material, built to lines by ex-workers)
  *   **Lens:** Heritage & Public Claim (They claim to be the "real continuation").
  *   **Phase 2 (Hard Stops):**
      *   Existence Check: **NO.** They built a new hull. There was a start date.
      *   Registry Check: **NO.** They have a new build number.
  *   **Phase 3 (Continuity):**
      *   Maintenance Chain: **N/A.** This is a build, not a repair.
  *   **Result:**
      *   **Verdict:** **NOT THE SAME SHIP.**
      *   **Why:** They fail the Existence and Registry checks. They are a *Replica*, not a *Continuation*.
      *   **The "Club" Analogy:** If every member of a club quits and new people start a club with the same rules down the road, it is a new club. It might be a *better* club, or a *truer* club, but it is not the *same* legal entity.
      *   **Action:** You can acknowledge they are a "faithful replica" without conceding they are the "original vessel." This stops you looking like you're making it up; you are relying on the Existence Check.

  ### Case 3: The Museum Keel (Original material, stored abroad)
  *   **Lens:** Heritage vs. Function.
  *   **Phase 2 (Hard Stops):**
      *   Existence Check: **NO.** The vessel was broken up. The keel is now an artifact, not a ship.
      *   Registry Check: **NO.** It likely has a museum accession number, not a ship registry.
  *   **Phase 3 (Continuity):**
      *   Form Check: **NO.** A keel cannot sail. It has lost the function of the sortal "Sailing Vessel."
  *   **Result:**
      *   **Verdict:** **NOT THE SAME SHIP.** It is **Part of the Original Ship.**
      *   **Distinction:** This is crucial. It is not "The Ship." It is "Relic of the Ship."
      *   **The Uncomfortable Truth:** If you ever wanted to claim the museum owns your ship, the Protocol says they don't. They own the *bones*, you own the *ghost* (the continuity).
      *   **Trustee Decision:** If you ever want to reunite them (e.g., put the keel into a new build), you trigger Phase 4. The Trustees must decide if inserting the old keel into a new hull "resurrects" the ship. The Protocol cannot answer this; it is magic, not administration.

  ***

  # Limitations: Where this Procedure Won't Help You

  You asked me to tell you where this fails. Here are the blind spots:

  **1. The "Soul" Problem (Phase 4 Triggers)**
  If you replace 99% of the wood, but do it slowly over 100 years, the Protocol says "Same Ship." If you replace 99% of the wood in one week, the Protocol says "New Ship" (Existence Check failure).
  *   *The Problem:* There is a grey zone in between. If you rebuild the whole hull over winter in a shed using the old ribs as a template, is it the same?
  *   *The Fix:* This goes to the Trustees. You cannot solve this with a checklist. You must present it as: "We preserved the continuity of care, but not the continuity of structure. Do we value the story or the stuff?"

  **2. The Rival's "Better" Argument**
  The Protocol proves your boat is the *original*, but it does not prove your boat is the *authentic experience*.
  *   *The Problem:* The rival group might have a safer, better-sailing vessel that looks exactly like the original. The public might feel *their* boat is "more real" because it feels right, even if the paperwork says it's a copy.
  *   *The Fix:* You cannot fight this with facts. You fight it with narrative. "Ours is the grandmother; theirs is the twin." The Protocol protects your legal standing, not your public popularity.

  **3. The "Sortal" Shift**
  Sometimes the object changes its "Job Description."
  *   *The Problem:* If you convert your sailing vessel into a floating restaurant, the Insurance Lens might say "Same Object," but the Heritage Lens might say "Listing Revoked."
  *   *The Fix:* You must re-run Phase 1 every time the *use* of the vessel changes significantly.

  # Summary for your Trustees

  When you present this in three weeks, tell them this:

  1.  **"Same" is a tool, not a truth.** We use different definitions for the insurer than we do for the donors. This is standard practice, not confusion.
  2.  **Continuity beats Material.** For the vessel to remain a "Ship" (a functioning entity), the unbroken chain of care matters more than the original wood. This protects our insurance and listing.
  3.  **Material beats Continuity for Artifacts.** For the donors and the museum pieces, the original wood matters most. We must be honest that specific planks are gone, even if the ship remains.
  4.  **The Rivals are a Replica.** They fail the "Existence Check." They are a new build. We can respect their quality without conceding our identity.
  5.  **I am not the decider.** Where the facts run out (the "Soul" questions), I will bring you a recommendation, but the Trust must vote on what the ship *means*, not just what it *is*.

  This procedure won't stop the rivals from talking, and it won't stop donors from grieving their planks. But it will stop you from feeling like you're lying. You aren't making it up; you're just selecting the right Lens.
