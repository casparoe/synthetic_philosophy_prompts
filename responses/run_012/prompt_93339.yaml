answer: |-
  Consider a toy universe governed by two fundamental, non-interacting scalar fields, $\phi$ and $\psi$, whose dynamical evolution is determined by independent wave equations that make no reference to one another. Although the causal powers intrinsic to $\phi$ are entirely distinct from those intrinsic to $\psi$, and no mechanism exists to couple their behaviors, the initial boundary conditions of the universe are set such that the value of $\phi$ at every spacetime point is strictly identical to the value of $\psi$ at that point. This identity holds without exception across the entire infinite history of the cosmos, creating a perfect, universal correlation between the fields that is preserved solely by the mathematical symmetry of their separate evolutions rather than any physical interaction or shared essence.

  **Verdicts and Reasoning**
  The Humean counts the regularity ($\forall x, \phi(x) = \psi(x)$) as a law. For the Humean, laws are the axioms of the deductive system that best balances simplicity and strength in summarizing the occurrent facts. Stating the identity axiom is vastly simpler than enumerating the specific initial values for both fields, and it yields immense strength by predicting the state of $\psi$ given $\phi$ (and vice versa) throughout infinity. Since the regularity is exceptionless and independent of the dynamical axioms (the wave equations), it earns its place as a distinct axiom in the Best System.

  The Anti-Humean (specifically a Dispositional Essentialist) denies that the regularity is a law. On this view, lawhood requires a metaphysical necessitation grounded in the essences or causal powers of the properties involved. Since the scenario specifies that the causal powers of $\phi$ and $\psi$ are distinct and non-interacting, there is no essential connection between them. The correlation is merely a brute fact about the initial arrangement of the universe—a cosmic coincidence—rather than a reflection of the natures of the fields. Thus, despite being universal and exceptionless, it lacks the modal force required for lawhood.

  **The Feature Doing the Work**
  The single feature driving the disagreement is the **source of the correlation**: it arises from a contingent boundary condition rather than from the intrinsic natures or dynamical interactions of the properties. The Humean cares only that the correlation is robust and systematizing; the Anti-Humean cares that the correlation is not grounded in the essences of the relata.

  **Changing the Feature**
  If we change this feature so that the fields interact dynamically (e.g., the wave equation for $\phi$ includes a term for $\psi$), the disagreement vanishes. The Dispositional Essentialist would then acknowledge that the essences of the fields involve a reciprocal power, grounding the necessitation relation, and would classify the resulting regularity as a law. The Humean would also count it as a law (likely derivable from the coupled dynamics). Neither side shifts their verdict on the *status* of the regularity (both say "Law"), though their reasoning converges. If we instead changed the feature so the correlation held only for a finite duration, the Humean might deny it is a law (loss of strength/simplicity), while the Anti-Humean would still deny it (lack of necessity), so the disagreement on "No Law" would remain, but the Humean's verdict would have shifted from "Law" to "No Law."

  **Marginal vs. Decisive Gain**
  The case depends on the regularity providing a **decisive** gain for the Best System. The identity $\phi = \psi$ effectively halves the information required to describe the state of the universe at any time, a massive simplicity gain. If the gain were marginal (e.g., the correlation held only for 99% of spacetime, or the fields were rarely instantiated), the Humean verdict would become unstable. In that marginal case, the disagreement would become one of degree: the Humean might withhold lawhood if the simplicity cost outweighs the strength gain, while the Anti-Humean would still withhold it due to the lack of essential grounding. However, as constructed, the gain is decisive enough to secure the Humean "Law" verdict firmly.

  **Strongest Reply**
  The strongest reply comes from the Humean, who challenges the coherence of the Anti-Humean's "essence" requirement. The Humean argues that scientific practice treats robust, exceptionless regularities as laws regardless of whether we understand the underlying "natures" producing them. To deny lawhood to a perfect, universal correlation that supports counterfactuals (within the Best System) is to make lawhood epistemically inaccessible and scientifically irrelevant. The Humean contends that if a regularity plays the law-role in our best physics, positing an invisible "modal glue" to validate it is metaphysical excess, and denying it lawhood simply because the glue is absent is a category error.

  **Construction Viability**
  This construction succeeds without stipulating the verdicts. It relies on a specific version of Anti-Humeanism (Dispositional Essentialism) because other versions (like Armstrong's Universalism) might infer a necessitation relation $N(\phi, \psi)$ directly from the universal regularity, forcing them to agree with the Humean. This shows that the dispute is not merely between "Humean" and "Anti-Humean" broadly, but turns on specific commitments regarding whether lawhood supervenes on the Humean base or requires essentialist grounding. Requirement 2 is satisfied because the Anti-Humean denial follows from the essentialist commitment that distinct essences cannot necessitate one another, not from a bare stipulation that "this is not a law."
