  1. Hand each student two sealed cards containing private information: one with a verifiable fact about the room and one with an assigned belief state, then place a pot of participation points in the center they can claim only by making valid assertions.
  2. Rules state points are awarded only for statements that are both objectively true according to the fact card and honestly report the belief state on the second card, verified by you without revealing the cards to the class.
  3. In the final round, ensure half the class holds mismatched pairs like "The light is on" and "I do not believe the light is on," creating a situation where the only point-winning move is to assert a truth they cannot sincerely speak without feeling absurd.
  4. Reveal the name "Moore's Paradox" and map their inability to speak onto the omissive and commissive forms, demonstrating that a sentence can satisfy truth conditions while violating the norms of assertion.
  5. Students will likely laugh off the contradiction to secure points, forcing you to pause the game and demand they articulate why the utterance feels wrong rather than false. You must then concede the simulation cannot generate epistemic normativity on its own, requiring you to lecture on why rationality forbids the assertion despite its truth.
