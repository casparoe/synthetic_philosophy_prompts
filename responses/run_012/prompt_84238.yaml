answer: |-
  You have identified a genuine and pervasive rhetorical manoeuvre, though it does not have a single, universally recognised label in the philosophy of history. Your intuition is correct: 'environmental determinism' is not the right tag, because your mate explicitly disavows the inevitability that defines determinism.

  The structure of the argument is a specific variant of the **Motte-and-Bailey Doctrine**, applied to historical causation. However, because the subject matter involves non-human actors (volcanoes, germs, climate), it requires a more specific diagnosis to capture the 'ontological' shifting that occurs.

  Here is the carve-up of the move, the nearest established concepts, and a coined term for the specific historical variant you are describing.

  ### 1. The Structure: Motte-and-Bailey
  The overarching logical structure is the **Motte-and-Bailey** (coined by philosopher Nicholas Shackel).
  *   **The Bailey (The desirable but hard-to-defend claim):** "The volcano *caused* the revolution / *gave us* Frankenstein." Here, the volcano is an **Agent**. It has intentionality or decisive causal power. This makes for a good story.
  *   **The Motte (The defensible but boring claim):** "The climate was *one factor among many*; human choices mattered." Here, the volcano is a **Context**. It is merely a boundary condition. This is historically defensible.
  *   **The Move:** When telling the story, he occupies the Bailey (Volcano as Agent). When challenged, he retreats to the Motte (Volcano as Context). Because the two positions are blurred in casual conversation, he claims the defensibility of the Motte protects the boldness of the Bailey.

  ### 2. The Immunity Strategy: Counterfactual Blocking
  The crucial third step you identified—claiming historians cannot answer counterfactuals—is an **Immunisation Strategy**.
  In the philosophy of history, a causal claim ($X$ caused $Y$) logically implies counterfactual dependence (If not-$X$, then not-$Y$, or at least a significantly different probability of $Y$). By declaring counterfactuals "out of bounds," he removes the only tool you have to test whether the volcano was actually a cause or merely a coincidence.
  *   **Settled Literature:** In philosophy (e.g., David Lewis, Max Weber), causal claims *require* counterfactual reasoning. You cannot separate cause from "what would have happened otherwise."
  *   **Contested Literature:** Among *practising historians*, there is a live dispute. Empiricist historians often dislike counterfactuals ("virtual history"), viewing them as speculative fiction. Your mate is exploiting this methodological discomfort to shield a logical flaw. He is using a methodological hesitation to block a logical necessity.

  ### 3. The Nearest Established Concepts
  Here is how this differs from the standard academic frameworks he might try to hide behind:

  **Actor-Network Theory (ANT)**
  *   **The Concept:** Associated with Bruno Latour. It argues that non-human entities (actants) do have agency and should be treated as part of the network of causation.
  *   **The Difference:** ANT proponents are *consistent*. They argue non-humans have agency in the analysis *and* the defence. Your mate grants agency only when it suits the narrative, then denies it when pressed. This is not ANT; it is **Opportunistic Anthropomorphism**.

  **Environmental Possibilism**
  *   **The Concept:** The middle ground between determinism and free will. The environment sets constraints/possibilities, but humans choose the path.
  *   **The Difference:** Possibilism treats the volcano as a *stage*, not an *actor*. Your mate treats the volcano as an *actor* in the narrative ("the volcano decided things"), which Possibilism explicitly rejects.

  **Selection Bias (Survivorship Bias)**
  *   **The Concept:** Focusing on the successes (volcanoes that coincided with revolutions) while ignoring the failures.
  *   **The Difference:** As you noted, "the case where the volcano changed nothing never comes up." There are many volcanic eruptions that caused no political shift. By ignoring the null cases, he inflates the causal power of the event.

  ### 4. The Coinage: "Ontological Shuttling"
  Since no single existing term captures the specific *historical* version of this Motte-and-Bailey regarding non-human actors, I propose the term **Ontological Shuttling**.

  **Definition:** The rhetorical practice of moving a non-human factor between the status of **Agent** (in narrative) and **Condition** (in argument) to maximise explanatory power while minimising accountability.

  **The Boundary Cases:**
  *   **Legitimate Use:** A historian argues that a drought *constrained* peasant options (Condition), and provides evidence that similar droughts in other contexts led to different outcomes (acknowledging human agency). This is *Environmental Possibilism*.
  *   **Legitimate Use:** An ANT scholar argues a germ *acted* upon a population (Agent), and maintains that stance when challenged, providing a mechanism of action that does not rely on human intention. This is *Material Agency*.
  *   **Ontological Shuttling (The Fallacy):** Claiming the germ *toppled* the empire (Agent), but when asked if the empire could have survived the germ, replying "History isn't about 'what ifs'" (Condition/Immunity), while ignoring empires that survived similar germs (Selection Bias).

  ### 5. Summary of the Dispute
  To settle your row, you need to separate the **logical** requirement from the **methodological** preference.

  1.  **The Logical Consensus:** You cannot claim $X$ caused $Y$ without implying that $Y$ would have been different without $X$. If he refuses to entertain the counterfactual, he is making a poetic claim, not a historical one.
  2.  **The Methodological Contest:** He may argue that historians don't do counterfactuals. You can concede this is a common *preference* among historians, but insist it does not absolve him of the logical requirement of causation.
  3.  **The Selection Issue:** Ask for one example where a similar volcanic event occurred and *no* revolution/cultural shift happened. If he cannot provide one, the correlation is spurious.

  **Verdict:** Your mate is engaging in **Ontological Shuttling**, protected by a **Motte-and-Bailey** structure and immunised by a selective rejection of **Counterfactuals**. It is a compelling way to tell a story, but it is not a rigorous way to assign cause.
