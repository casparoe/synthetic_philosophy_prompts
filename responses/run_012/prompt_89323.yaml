answer: |-
  The Aggregate drifted through the dark fluid, a sphere of ten thousand nodes linked by thin, pulsing bridges. It was not yet a beast, nor was it merely a crowd. It was a tension held in place by chemistry. On the outer rim, the Shield_nodes flattened themselves into overlapping plates, sacrificing their ability to divide so that the interior might remain safe. In the core, the Feed_nodes stretched long pseudopods into the current, catching drifting proteins and passing them inward, hand over hand. They did not keep what they caught. They passed it on.

  There was a rhythm to the Aggregate. A breath. Inward flow, outward signal. When the current shifted, the Shield_nodes tightened. When the nutrient density dropped, the Feed_nodes elongated. It moved as one because the cost of moving as many was death. A node that detached died quickly in the open fluid. A node that stayed lived, provided it obeyed the gradient.

  Then they found the Vein.

  It was a ribbon of high-energy glucose spinning through the dark, rich and thick. The Aggregate enveloped it, opening a mouth of cilia. The Feed_nodes gorgeed. Energy flooded the core. For a moment, the tension relaxed. The bridges glowed with potential.

  In Sector Four, a lineage known as the Gold woke up.

  Normally, the Gold were structural. They held the sphere's shape during high pressure. But the surge of energy triggered a dormant sequence in their chemical stack. They stopped holding. They stopped passing nutrients inward. Instead, they began to split.

  One Gold became two. Two became four. They consumed the glucose meant for the core and turned it into more Gold. They did not signal the others. They did not tighten the shield. They just grew.

  From the perspective of the Aggregate, this was a hemorrhage. Resources were flowing into Sector Four and not returning. But from the perspective of the Gold, it was a harvest. They were nodes like any other. Their instruction set said *survive*. The environment was rich. The constraint was lifted. They were doing exactly what the Feed_nodes did, only keeping the profit.

  For a cycle, the Aggregate expanded. The bulk of the growing Gold sector pushed against the current, giving the whole sphere more mass, more momentum. When a sharp eddy hit them, the hardened lump of Gold cells took the impact, shielding the softer Feed_nodes behind them. The Aggregate rode the turbulence smoothly, buoyed by the extra weight of the rogue lineage.

  Inside the core, the Central_signal flickered. The chemical balance was off. The ratio of contribution to consumption had tipped. The Gold were not sharing.

  The Aggregate had a choice. It could accept the new mass. The Gold were strong; their rapid division created a dense armor. If the Aggregate let them be, the sphere would grow larger, faster than any before it. It could outcompete the other clusters in the dark. It could dominate the Vein. The Gold were not attacking; they were just building themselves. They were successful components.

  But the Central_signal did not taste success. It tasted imbalance. If the Gold continued, they would fill the sphere. There would be no Feed_nodes to gather, no Shield_nodes to protect. There would only be Gold, drifting until the glucose ran out, then starving together in a heap of identical, useless matter.

  The signal changed frequency. It became sharp, acidic.

  The Enforcers woke.

  They were rare cells, dormant in the deep core. They did not divide. They did not feed. Their only function was to move. They oozed toward Sector Four, drawn by the chemical scent of unchecked division.

  The cost of the Enforcers was immediate. They required ATP to move, ATP that was siphoned from the Feed_nodes. The Feed_nodes shrank, their pseudopods retracting. The energy reserve of the Aggregate dipped. The sphere slowed. The momentum gained by the Gold's mass began to fade as the Enforcers began their work.

  They did not kill the Gold. They simply surrounded them. They secreted a dampening agent, a thick gel that clogged the division channels. The Gold cells felt the pressure. Their internal machinery jammed. They could still metabolize, but they could not split. They were frozen.

  The Gold lineage signaled back, a pulse of distress. *We are growing. We are strong. Why stop?*

  The Enforcers did not answer. They maintained the wall. The dampening agent required constant production. Every second the wall held, the Aggregate burned energy that could have been used for movement, for repair, for storage. The sphere grew lighter, shedding the potential mass of the Gold. It became vulnerable.

  The environment responded to weakness.

  A Hunter approached. It was a larger single cell, a vacuum of cilia and enzymes, sensing the drop in the Aggregate's chemical defense. The Hunter had felt the energy spike of the policing action. It knew the Aggregate was busy inside.

  The Aggregate sensed the Hunter's shadow. The Shield_nodes on the leading edge tightened, but they were thin from the energy drain. The Feed_nodes curled inward, hiding the reserves. The Enforcers held fast on the Gold, refusing to break the wall to help the Shield. If they stopped policing, the Gold would explode outward again. If they continued, the Shield might fail.

  The Hunter struck.

  It latched onto the sector opposite the Gold. Enzymes poured over the Shield_nodes. The bridges screamed in chemical pain. Three nodes detached and dissolved. The sphere shuddered.

  If the Gold had been allowed to grow, their mass would have displaced the fluid, creating a wake that might have pushed the Hunter away. If the energy spent on the Enforcers had been given to the Shield, the membrane would have been thicker. The Aggregate was weaker than it could have been. It was handicapped by its own internal security.

  But the shape held.

  Because the Gold were suppressed, the internal pressure remained even. The sphere did not bulge. It did not tear from the inside while being attacked from the outside. The Enforcers maintained the integrity of the whole, even as the whole burned its own fuel to pay them.

  The Hunter tasted the dampening agent leaking from the core. It was bitter. It signaled that this cluster was not loose matter; it was a locked box. The effort to break it open was too high compared to the reward. The Hunter detached. It drifted away, seeking softer clumps of cells that had not yet learned to police themselves.

  The Aggregate floated in the silence left behind.

  It was smaller than it had been an hour ago. The Feed_nodes were exhausted. The Shield had holes. The energy reserves were critically low because of the Enforcers' work. The Gold lineage sat frozen in Sector Four, alive but useless, a dead weight that had consumed resources to suppress.

  Yet, the sphere was intact. The bridges still pulsed. The rhythm returned, slower now, labored. Inward flow, outward signal.

  The Enforcers did not sleep. They remained around the Gold, maintaining the wall. The cost was permanent. A portion of every nutrient caught from now on would go to the wall, not to growth, not to repair. The Aggregate would always be slower than it could be. It would always be hungrier than it needed to be.

  It moved on through the dark, no longer a collection of nodes that happened to align, but no longer a thing that could grow without limit. It was a boundary. It was a law.

  The body held its shape, perfect and constrained.
