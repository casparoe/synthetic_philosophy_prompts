prompt: |-
  Ok so I need help settling something. My friend Marcus and I have been going at this for like three weeks now, ever since I made the mistake of telling him I'd been reading about eliminative materialism, the Churchland-style line that the folk-psychological posits "belief" and "desire" are like phlogiston or caloric, the theoretical entities of a bad theory that neuroscience will eventually just drop. Marcus's killer move, which he deploys roughly six times a day, is the self-refutation thing: if there are no beliefs, then you don't believe eliminativism, so you can't really assert it or have a reason for it, and any reason you give me is itself supposed to be supported by beliefs. He also adds that you clearly care about evidence and about not being wrong, and both of those only make sense if you think getting your beliefs right matters. I think this is too quick, but I don't want to just say "that's the self-refutation objection, it's old" -- I want to actually argue for a specific line and see if it holds.

  Here's what I've been calling the two-jobs view, and I'd like you to build the strongest case for it. "Belief" gets used for at least two different jobs in our psychology-talk and the jobs come apart. Job one is the predictive/dispositional one: a state that, together with desires, explains and predicts what a system will do, and that gets implemented however the machinery happens to be implemented (I've been thinking of it as a high-precision prior in a prediction-error-minimizing system, or a stored model of the world, whichever framing you like). Job two is the commitment/normative one: being the sort of creature who can be held to a claim, asked to defend it, counted on to act in line with it, blamed for not. The eliminativist is plausibly right that job one isn't a natural kind -- it's a grab bag of mechanisms with no shared essence, and asking whether beliefs exist is a bit like asking whether memory exists. But job two is real, it's social and normative rather than internal, and it's what's actually doing the work when Marcus insists that I must believe in eliminativism in order to assert it. So the slogan that there are no beliefs comes out true of one thing and false of the other, and the whole dispute is half verbal dispute and half a real disagreement about which job matters.

  I want you to argue this for me, and to be honest about where it breaks. Does the two-jobs view really dodge self-refutation, or does it just relocate it -- can I assert the view and defend it without invoking a state of either job? Marcus is definately going to say that the normative job presupposes the predictive one, since you can only hold me to a claim if there's something in me that the claim corresponds to, and that "commitment" is just a fancy word for a belief you're proud of. And there's a case I made up that I keep going back and forth on: a patient whose speech says she's certain it'll rain tomorrow while her umbrella behavior is driven by a completely separate system that clearly expects sun, so the two jobs point in opposite directions and there's no obvious fact about what she really believes. Tell me what that case shows, whether it's even coherent, and whether my view survives it -- if the answer is that she has two beliefs, or half a belief, I want to know what that does to my slogan. No need for a reading list, Ive got the intro material already; I want the argument, the strongest version of Marcus's reply, and your verdict.
