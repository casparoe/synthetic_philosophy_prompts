answer: |-
  The coherence of Augustine's absolute prohibition on lying hinges on the stability of the bridge between his definition of the act and his rationale for its wrongness. As you have structured the problem in your seminar, the definition rests on two pillars: the formal element (signifying what one believes to be false) and the mental element (the intention to deceive). The rationale, however, locates the sin in the perversion of speech's natural end: to communicate thoughts, not to hide them. My conclusion is that the absolute prohibition on *lying*, as defined by the conjunction of those two elements, cannot be made coherent. The definition and the rationale pull in opposite directions when faced with cases where signification and deception come apart. To salvage the moral insight Augustine offers, the prohibition must be shifted from a ban on false signification to a ban on the betrayal of the communicative covenant.

  The incoherence arises because the two elements of Augustine's definition are not co-extensive, yet his moral rationale requires them to be. If the wrong is truly the perversion of speech's purpose—to make thoughts known—then the moral weight must rest entirely on the intention to deceive. The falsity of the statement becomes incidental. However, if the wrong rests on the falsity of the statement, then the intention to deceive becomes incidental. Augustine attempts to hold both, but the "pressure cases" you describe force a choice.

  Consider first the case of deception without false signification: the pursuer at the door. If I hide a fugitive and tell the pursuer, "He went that way," pointing in the direction the fugitive actually went (knowing the pursuer will look elsewhere), I have signified nothing I believe to be false. Under Augustine's formal definition, I have not lied. Yet, under his rationale, I have perverted speech. I have used a communicative act to ensure a thought remains hidden rather than made known. If Augustine condemns this (as his broader theology suggests he should), then his definition of lying is too narrow to capture the sin he wishes to prohibit. He is no longer an absolutist about *lying*; he is an absolutist about *deception*, but he lacks the vocabulary to condemn the truthful deceiver without stretching the word "lie" until it breaks.

  Conversely, consider the pressure on the other side. If we strictly adhere to the formal definition (signifying the false), we exonerate the skilled dissembler who never asserts a falsehood. This renders the absolutism morally hollow. It suggests that the moral catastrophe of lying is located in the mismatch between mind and tongue, rather than the mismatch between mind and mind. But if the mismatch between mind and tongue is the sole locus of the wrong, then the rationale regarding the "purpose of speech" becomes secondary. Why is speech given to make thoughts known? If the sin is merely the internal dissonance of the speaker, the social purpose of speech is irrelevant. Augustine wants to have it both ways: he wants the objective clarity of a rule against false statements, but the moral gravity of a rule against deception. The cases where the two diverge reveal that he cannot have both without contradiction.

  Therefore, the absolute prohibition on lying cannot be sustained in its current form. It should be replaced by a prohibition on the **betrayal of the communicative covenant**. This formulation locates the wrong not in the truth-value of the proposition, nor solely in the psychological state of the speaker, but in the violation of the implicit trust that governs human discourse. When we speak, we enter a covenant that our signs are intended to align our interlocutor's mind with our own. To intentionally sever that alignment is the wrong.

  This replacement handles the awkward cases without strain. The joker does not violate the covenant because the context signals a suspension of the expectation of literal truth; the hearer is not meant to align their belief with the speaker's. The fiction writer operates under a similar bracketed covenant. However, the pursuer at the door *is* a victim of covenant betrayal. Even if the words are technically true, the speaker has exploited the covenant's rules to violate its spirit. The hearer relies on the cooperative principle of communication; the speaker weaponizes that reliance. This shifts the absolute prohibition from "Do not assert the false" to "Do not manipulate another's understanding through communicative acts." This preserves the deontological strength of Augustine's position (it remains a rule, not a calculation of consequences) while correcting the incoherence of his definition.

  The strongest objection to this shift is the problem of **epistemic access**. A prohibition on false signification is objectively verifiable. We can compare the statement to the speaker's belief (in confession) or to reality. A prohibition on the betrayal of the communicative covenant relies on judging intention and the reasonable expectations of the hearer. This introduces a dangerous subjectivity. If the wrong is deception, how do we distinguish between a malicious lie and a polite fiction, or between a strategic silence and a withholding of information one has no right to know? By moving from the act to the intent, we risk making the moral law unknowable. An absolutist rule requires clear boundaries; "deception" is a foggy boundary compared to "false assertion."

  This objection can be met by acknowledging that moral coherence is more important than legalistic ease. We already judge intent in matters of greater gravity, such as murder versus manslaughter. The difficulty of adjudication does not negate the moral reality of the distinction. Furthermore, the "covenant" model provides an objective standard: the reasonable expectations of the communicative context. In a court of law, the covenant demands literal truth. In a social greeting ("How are you?"), the covenant demands only phatic solidarity. The wrong is not in the falsity, but in violating the specific expectations of the context. This restores coherence: the rule is absolute (do not betray the covenant), but the content of the covenant varies by context.

  What would change my mind? I would return to Augustine's original formulation if it could be demonstrated that **false signification entails an intrinsic ontological damage to the speaker** independent of any intent to deceive another. If the act of dissociating tongue from mind is itself a corruption of the *Imago Dei* within the soul—a kind of spiritual suicide that occurs regardless of whether anyone is deceived—then the formal element holds the primary moral weight. In that scenario, the "purpose of speech" rationale is secondary to the "integrity of the soul" rationale. If the sin is primarily self-harm through the fragmentation of one's own rational faculties, then the absolute prohibition on false signification is coherent, even if it lets the truthful deceiver off the hook regarding the *lie* (though they might be guilty of something else). My current verdict rests on the assumption that the wrong is interpersonal (perversion of communication); if the wrong is intrapersonal (perversion of the self), Augustine's definition stands.

  The weak point in my own reasoning lies in my **teleology of speech**. I have accepted Augustine's premise that the purpose of speech is to make thoughts known. This is a contestable claim. If speech serves multiple ends—social bonding, protection, play, power—then "perversion" is harder to define. If protecting a life is also a natural end of speech, then using speech to mislead a murderer might not be a perversion but a fulfillment of a higher communicative duty. My argument assumes that "communication of truth" is the singular master function of language. If that assumption is false, then both Augustine's prohibition and my proposed replacement rest on shaky ground. I am confident that the definition of lying must change, but I am less certain that "deception" is the correct replacement if the fundamental nature of speech is more complex than Augustine allows.
