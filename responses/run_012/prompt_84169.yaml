      *   **The Dilemma:**
          *   If the wrong is *misuse of signification* (saying what you think is false), the prohibition is too narrow (lets skilled deceivers off the hook).
          *   If the wrong is *will to deceive* (perverting speech's purpose), the prohibition is too broad (condemns misleading truths/silence, potentially exceeding the definition of "lying").
