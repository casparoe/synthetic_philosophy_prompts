      *   *Rationale:* Speech is for communicating thoughts. Using it to hide thoughts (deceive) perverts its nature.
      *   *The Tension:* The prompt suggests a gap between the *definition* (which requires false signification) and the *rationale* (which targets deception/perversion of communication).
      *   *Augustine's Actual View on "Deception without False Signification":* In *On Lying* and *Against Lying*, Augustine actually addresses this. He generally condemns deceptive truths as well. He calls them lies of the heart, even if not of the tongue. However, the prompt asks me to test the *coherence* of the absolute prohibition based on the definitions provided in the prompt's setup. The prompt sets up a specific dichotomy: Formal Element vs. Mental Element.
      *   *The Crux:* If the moral wrong is the *perversion of speech*, then deceptive truth-telling is just as bad as lying. If the moral wrong is the *false assertion*, then deceptive truth-telling is permissible. Augustine wants to forbid *all* deception, but his definition of lying hinges on the false assertion. This creates the coherence problem.

  3.  **Formulate a Thesis:**
      *   *Option A:* Defend Augustine. Argue that the "will to deceive" is the primary ground, and "false signification" is just the paradigmatic case, not the exhaustive boundary. Thus, deceptive truth-telling is morally equivalent to lying, even if linguistically distinct.
      *   *Option B:* Attack Augustine. Argue that the absolute prohibition collapses because it cannot reconcile the definition with the rationale. If it bans deceptive truth-telling, it abandons its own definition of lying. If it sticks to the definition, it fails its own rationale (allowing deception). Therefore, the absolute prohibition on *lying* is incoherent; it should be replaced by a prohibition on *deception* (or betrayal of trust).
      *   *Decision:* Option B is more philosophically interesting and addresses the prompt's pressure points more directly. It allows for a critique of the *absolutism* regarding the specific act of "lying" while acknowledging the validity of the concern about deception. However, the prompt asks if the *prohibition* can be made coherent. If I argue it should be replaced, I am arguing it *cannot* be sustained. Let's try to find a middle path that saves the *spirit* but admits the *definition* is the weak link.
      *   *Refined Thesis:* The absolute prohibition is incoherent *as defined* because the two elements (false signification and intent to deceive) are not co-extensive. To save the moral intuition (the perversion of speech), we must shift the locus of the wrong from the *falsity of the statement* to the *breach of communicative covenant*. Thus, the prohibition cannot be sustained as a prohibition on "lying" (strictly defined); it must be a prohibition on "deceptive communication."

      *Wait, let's look closer at the prompt's instruction:* "Either show that one of the two grounds can be defended... or argue that the prohibition cannot be sustained in its absolute form, and say what should replace it."
      Okay, I need to pick a side.
      If I defend Augustine: I must argue that deceptive truth-telling *is* a lie in his framework (which he actually does in *On Lying*, calling it a lie in the heart).
      If I attack Augustine: I argue the definition fails to capture the rationale.
      *Strategy:* I will argue that the prohibition *cannot* be sustained in its absolute form *as a prohibition on lying* because the definition is too narrow for the rationale. The rationale (speech is for sharing thoughts) condemns deception broadly. The definition (signifying what you believe false) condemns only a subset. To be coherent, the prohibition must shift from "lying" to "deception." This aligns with the prompt's suggestion to "say what should replace it."

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the seminar context. State the problem: The tension between the definition (false signification + intent) and the rationale (perversion of speech). State the thesis: The absolute prohibition on *lying* is incoherent; it must be reconceived as a prohibition on *deception* to match the rationale.
      *   **Analysis of Signification without Deception:** Briefly concede Augustine's handling of jokes/fiction. This establishes that intent is necessary.
      *   **Analysis of Deception without False Signification (The Pressure Point):** This is the core. The "truthful liar." If the wrong is perverting speech to hide thoughts, the truthful liar is just as guilty. But if the wrong is asserting falsehoods, they are innocent. Augustine wants them guilty. But his definition of *lying* exonerates them.
      *   **The Dilemma:**
          *   Horn 1: Stick to definition. Result: Absolutism is hollow (allows clever deception).
          *   Horn 2: Stick to rationale. Result: Absolutism is overbroad (condemns things not defined as lies).
      *   **Conclusion/Replacement:** The prohibition should be on the *betrayal of the communicative covenant*. It's not about truth-values; it's about the expectation of cooperation in communication.
      *   **Objection:** The "Slippery Slope" or "Epistemic Access" objection. If we ban deception, how do we know what someone intended? Lying is objective (statement vs. belief); deception is subjective.
      *   **Rebuttal:** While harder to adjudicate, moral coherence trumps legal ease. We judge intent in murder; we can judge it in speech.
      *   **What Would Change My Mind:** If it could be shown that false signification has an intrinsic ontological evil separate from its deceptive intent (e.g., it damages the soul of the speaker regardless of effect).
      *   **Weak Point:** The reliance on "communicative covenant" might be too consequentialist for a deontological framework like Augustine's.

