answer: |-
  # Desiderata for an Adequate Theory of Emotion

  The following list distinguishes between **Non-Negotiable Explanatory Constraints** (phenomena any adequate theory must account for, regardless of its ontological commitments) and **Ontological Preferences** (claims that privilege specific camps, such as Feeling, Appraisal, or Perceptual theories). A theory fails if it ignores a Non-Negotiable; it merely becomes partisan if it adopts a Preference.

  ## I. Non-Negotiable Explanatory Constraints
  *Any theory claiming to describe emotion must accommodate these data points. Failure to do so renders the theory empirically inadequate.*

  1.  **The Dissociation Constraint**
      *   **Requirement:** The theory must explain how the components of emotion (phenomenology, physiology, appraisal, behavior) can dissociate without dissolving the category of emotion entirely.
      *   **Consideration:** Clinical and experimental evidence shows these components come apart (e.g., spinal cord injuries altering felt intensity without eliminating emotion; amygdala damage eliminating fear responses while preserving conscious fear).
      *   **Status:** **Non-Negotiable.**

  2.  **The Normativity Constraint**
      *   **Requirement:** The theory must account for the "fittingness" or correctness conditions of emotions (e.g., fear is *unwarranted* if there is no danger) without collapsing emotion into moral judgment.
      *   **Consideration:** We criticize emotions as inappropriate or irrational; a purely causal or mechanistic theory cannot capture this normative dimension.
      *   **Status:** **Non-Negotiable.**

  3.  **The Self-Knowledge Constraint (Authority and Error)**
      *   **Requirement:** The theory must explain why subjects generally have privileged access to their emotions while simultaneously allowing for systematic self-misidentification.
      *   **Consideration:** While I usually know I am angry, self-deception, repression, and mislabeling (e.g., mistaking anxiety for excitement) are common and recognizable.
      *   **Status:** **Non-Negotiable.**

  4.  **The Continuity Constraint**
      *   **Requirement:** The theory must allow for homologous emotional states in non-linguistic animals without resorting to metaphor.
      *   **Consideration:** Comparative psychology and neuroscience demonstrate affective systems in mammals that predate human language and complex cognition.
      *   **Status:** **Non-Negotiable.**

  5.  **The Variability Constraint**
      *   **Requirement:** The theory must accommodate cross-cultural variation in emotion concepts and elicitors without collapsing into radical relativism.
      *   **Consideration:** While some expressions are universal, the granularity and valuation of emotions (e.g., *amae* in Japan, *schadenfreude* in Germany) vary significantly.
      *   **Status:** **Non-Negotiable.**

  ## II. Ontological Preferences (Camp-Specific)
  *These are not requirements for adequacy, but rather definitions that favor specific theoretical lineages. Adopting these excludes rival camps by fiat.*

  6.  **The Phenomenological Constitutivity Claim**
      *   **Requirement:** The theory must define the felt quality of the experience as essential to the emotion's identity.
      *   **Camp:** **Feeling Theories / Perceptual Theories.**
      *   **Status:** **Preference.** (Excludes Behaviorist and some Functionalist accounts).

  7.  **The Cognitive Appraisal Claim**
      *   **Requirement:** The theory must define a specific evaluative judgment or cognitive assessment as necessary for the emotion to occur.
      *   **Camp:** **Appraisal Theories / Cognitivist Theories.**
      *   **Status:** **Preference.** (Excludes Basic Emotion and Somantic theories).

  8.  **The Intentionality Claim**
      *   **Requirement:** The theory must assert that all emotional states are *about* specific objects or propositions.
      *   **Camp:** **Intentionalist / Phenomenological Camps.**
      *   **Status:** **Preference.** (Conflicts with data on free-floating anxiety and moods).

  ***

  # Application to Stipulated Test Cases

  An adequate theory must resolve the following cases without ad-hocery.

  **Case A: The Fearless Fear (Phenomenological Void)**
  *   **Scenario:** A patient exhibits full fear profile (avoidance, arousal, vigilance) tracking real danger, but reports zero felt experience.
  *   **Adjudication:**
      *   **Pass:** A Functionalist or Basic Emotion theory counts this as fear. The biological program and behavioral output suffice; the feeling is a contingent byproduct.
      *   **Fail:** A strong Feeling Theory or Perceptual Theory must deny this is fear (labeling it a "reflex" or "pseudo-emotion"), risking divergence from medical and folk usage.
      *   **Requirement Tested:** *The Dissociation Constraint.* The theory must explain what binds the case to the category "fear" if the feeling is absent.

  **Case B: The Appraisal-Free Turbulence (Cognitive Void)**
  *   **Scenario:** A subject feels intense terror and bodily chaos but lacks any belief or judgment that they are in danger (e.g., a panic attack in a safe room, or subcortical stimulation).
  *   **Adjudication:**
      *   **Pass:** A Somatic or Feeling Theory counts this as fear (or a fear-like state). The bodily feeling constitutes the emotion.
      *   **Fail:** A strict Appraisal Theory must deny this is fear, classifying it as mere "arousal" or "sensation" until a cognitive label is applied.
      *   **Requirement Tested:** *The Continuity Constraint & Dissociation Constraint.* If animals feel fear without propositional appraisal, this human case should be analogous.

  ***

  # Required Stances on Structural Issues

  The following are embedded as **Non-Negotiable** positions within the desiderata above. A theory that contradicts these is considered inadequate for this seminar.

  1.  **Object-Directedness:**
      *   **Stand:** Object-directedness is **not essential** for all affective states, but is essential for *emotions* proper.
      *   **Rationale:** A theory must distinguish between *fear of the bear* (emotion) and *free-floating anxiety* (mood). If a theory requires an object for anxiety, it fails the *Phenomenological Adequacy* test. If it denies the difference between mood and emotion, it fails the *Differentiation* test.

  2.  **Self-Knowledge and Error:**
      *   **Stand:** A theory **must allow us to be systematically wrong** about our own emotions.
      *   **Rationale:** First-person authority is not infallible. A theory that makes self-ascription incorrigible (e.g., "If you think you're angry, you are angry") cannot account for therapy, self-deception, or emotional development.

  3.  **Human-Animal Continuity:**
      *   **Stand:** A theory **must preserve continuity** with non-human affect.
      *   **Rationale:** Theories that rely exclusively on human-unique capacities (complex language, propositional judgment) render animal emotion unintelligible. The core architecture must be subcortical/evolutionary, even if human emotions are cognitively enriched.

  4.  **Cross-Cultural Variation:**
      *   **Stand:** A theory **must treat variation as real but not total.**
      *   **Rationale:** We must avoid "Biological Imperialism" (ignoring cultural scripts) and "Radical Constructivism" (denying shared biology). The theory must distinguish between the *affective mechanism* (universal) and the *emotion concept* (variable).

  ***

  # Critical Analysis

  ### The Most Exclusionary Requirement
  **The Dissociation Constraint.**

  This is the single requirement that does the most damage to popular contenders. Pure monistic theories cannot survive it without significant modification.
  *   **Pure Feeling Theories** (e.g., early Jamesian views) struggle with Case A (Fear without Feeling). If feeling is the essence, the absence of feeling means the absence of emotion, forcing them to categorize clearly fearful behavior as something else.
  *   **Pure Appraisal Theories** (e.g., strict Stoic or Nussbaum-style views) struggle with Case B (Feeling without Appraisal). If judgment is the essence, panic attacks and phobic responses (which often bypass judgment) are not emotions.
  *   **Pure Behaviorism** struggles with the *Self-Knowledge Constraint*, as it cannot account for the phenomenological authority subjects possess.

  To satisfy the Dissociation Constraint, a theory must be **pluralistic** or **hybrid** (e.g., Component Process Models). It forces the theorist to admit that "emotion" is not a natural kind with a single necessary and sufficient condition, but a cluster concept. This excludes the cleanest, most elegant ontological accounts in favor of messier, multidimensional ones.

  ### The Impossible Tension
  **The Continuity Constraint vs. The Variability Constraint.**

  I suspect these two cannot be jointly satisfied without a significant compromise on what "emotion" means.

  *   **The Tension:** To satisfy **Continuity**, you must posit a universal, biological core shared with animals (e.g., a "fear system" in the amygdala). To satisfy **Variability**, you must acknowledge that what counts as "fear" is heavily scripted by culture and language (e.g., some cultures do not distinguish fear from surprise, or lack a concept equivalent to "anger").
  *   **The Conflict:** If the biological core is sufficient for emotion (Continuity), then cultural variation is merely superficial modulation. If cultural conceptualization is necessary for the specific emotion type (Variability), then animals do not have emotions in the same sense humans do, breaking Continuity.
  *   **The Implication:** A theory that strongly embraces evolutionary naturalism (e.g., Ekman) inevitably minimizes cultural variation. A theory that strongly embraces social constructionism (e.g., Barrett) inevitably treats animal affect as a different category than human emotion. Satisfying both requires a dual-level theory that risks being unfalsifiable: positing a biological "affect" that is not yet an "emotion," and a cultural "emotion" that is not fully biological. This is the central fault line in current affective science.
