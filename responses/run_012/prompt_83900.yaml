answer: |-
  ### Part 1: Student-Facing Question

  **Question 4 (25 Marks)**
  **Time Allocation: 75 Minutes**

  Consider a market for a single asset that pays \$1 if the state of the world is $\omega=1$ and \$0 if $\omega=0$. There are two risk-neutral traders, Alice and Bob. They share a common prior: $P(\omega=1) = P(\omega=0) = 0.5$.

  Before trading, each trader $i \in \{A, B\}$ receives a private binary signal $s_i \in \{0, 1\}$. The signals are conditionally independent given the state. The accuracy of each signal is identical:
  $$P(s_i = 1 \mid \omega=1) = P(s_i = 0 \mid \omega=0) = \frac{2}{3}$$
  Consequently, the error probability is $1/3$.

  **Part A (10 Marks)**
  Suppose a price $p = 0.5$ is posted for the asset. Alice observes $s_A = 1$ and Bob observes $s_B = 0$.
  1. Calculate Alice's and Bob's posterior beliefs about $\omega$ conditioning *only* on their own private signals. Based on these beliefs, does each trader initially wish to buy or sell at $p=0.5$?
  2. Now, assume both traders are rational and this is common knowledge. Alice considers buying at $p=0.5$. She realizes Bob is only willing to sell if his valuation is below $0.5$. Update Alice's belief by conditioning on her own signal ($s_A=1$) *and* the fact that Bob is willing to sell at $p=0.5$. Calculate her new posterior. Does trade occur? Show your arithmetic explicitly.

  **Part B (5 Marks)**
  Now suppose instead of a fixed price, a competitive market maker sets a price $p(s_A, s_B)$ that fully reveals the aggregate information held by both traders (i.e., the price equals the expected value of the asset given both signals). Explain why, if such a price exists, neither trader has an incentive to acquire their private signal in the first place. How does this relate to the logic you derived in Part A regarding the information content of a counterparty's willingness to trade?

  **Part C (10 Marks)**
  For trade to occur and for prices to aggregate information without destroying the incentive to produce it, the idealized setting above must be modified. Identify two distinct modifications (e.g., regarding priors, risk preferences, or market structure) that would restore trade. For each modification, explain the specific "epistemic cost": what is lost regarding the claim that market prices reflect shared evidence or rational consensus? Compare the two modifications: which one preserves the idea of the market as an information aggregator, and which one reinterprets the market as a mechanism for reconciling irreconcilable differences?

  ***

  ### Part 2: Model Answer

  **Model Answer**

  **Part A: The No-Trade Logic**
  First, we calculate the valuations based on private signals alone. The prior odds of $\omega=1$ are $1:1$. A signal $s_i=1$ has a likelihood ratio of $\frac{P(s=1|\omega=1)}{P(s=1|\omega=0)} = \frac{2/3}{1/3} = 2$.
  Alice's posterior odds given $s_A=1$ are $1 \times 2 = 2$. Her probability is $2/3$, so her valuation is $V_A = 0.67$.
  Bob's signal $s_B=0$ has a likelihood ratio of $\frac{1/3}{2/3} = 0.5$. His posterior odds are $1 \times 0.5 = 0.5$. His probability is $1/3$, so his valuation is $V_B = 0.33$.
  At price $p=0.5$, Alice initially wants to buy ($0.67 > 0.5$) and Bob wants to sell ($0.33 < 0.5$).

  However, trade requires common knowledge of willingness. Alice knows Bob sells only if $V_B < 0.5$. Given the signal structure, Bob's valuation is $0.67$ if $s_B=1$ and $0.33$ if $s_B=0$. Thus, Bob is willing to sell if and only if $s_B=0$. By observing Bob's willingness to sell, Alice effectively learns $s_B=0$.
  Alice must now update on the joint event $\{s_A=1, s_B=0\}$.
  The likelihood of this pair given $\omega=1$ is $\frac{2}{3} \times \frac{1}{3} = \frac{2}{9}$.
  The likelihood of this pair given $\omega=0$ is $\frac{1}{3} \times \frac{2}{3} = \frac{2}{9}$.
  The likelihood ratio is $1$. Alice's posterior odds become $1 \times 1 = 1$, implying a probability of $0.5$.
  Her revised valuation is exactly $0.5$. Since the price is $0.5$, she is indifferent. The gain from trade vanishes. The same logic applies to Bob conditioning on Alice's willingness to buy. Trade collapses because the counterparty's action reveals the private information that justified the trade in the first place.

  **Part B: The Incentive Paradox**
  In the market maker scenario, the price $p$ reflects the combined signals $(s_A, s_B)$. If the price is fully revealing, observing $p$ allows a trader to infer the sum of the signals. If Alice knows $s_A$ and can infer $(s_A + s_B)$ from $p$, she knows $s_B$. Her posterior becomes the same as the market price.
  Consequently, her private valuation equals the market price. She cannot expect a profit from trading on her signal because the price has already adjusted to reflect that signal's content. If trading yields no expected profit, risk-neutral traders will not pay a cost to acquire the signal initially.
  This mirrors Part A: in both cases, the information required to justify a trade is fully incorporated into the terms of trade (the counterparty's willingness or the market price). When information becomes common knowledge via the mechanism of trade, the speculative motive disappears.

  **Part C: Restoring Trade and Epistemic Costs**
  To restore trade, we must break the link between willingness to trade and full information revelation.
  1.  **Noise/Liquidity Traders:** Introduce agents who trade for exogenous reasons (hedging, consumption shocks) rather than information.
      *   *Epistemic Cost:* Prices become noisy signals. They aggregate informed beliefs only imperfectly. The market reflects evidence plus random distortion.
      *   *Status:* Preserves the market as an information aggregator, but acknowledges aggregation is lossy.
  2.  **Heterogeneous Priors:** Allow Alice and Bob to start with different prior probabilities.
      *   *Epistemic Cost:* Trade is driven by disagreement on fundamentals, not just private evidence. Prices reflect a compromise between conflicting worldviews, not a consensus on evidence.
      *   *Status:* Reinterprets the market as a mechanism for reconciling irreconcilable differences. It surrenders the common prior assumption, which is the load-bearing axiom of the no-trade result.

  Comparing the two, the noise trader model preserves the epistemic claim that prices *track* truth, albeit with error. The heterogeneous priors model abandons the idea that there is a single rational consensus to be reached; prices reflect power and preference as much as evidence. The former maintains the market's truth-tracking function; the latter redefines the market's function as exchange based on difference rather than discovery of truth.

  ***

  ### Part 3: Marking Scheme

  **Total Marks: 25**

  **1. Correct Calculation of Initial Posteriors (5 Marks)**
  *   **Must-Hit:** Correctly derives $P(\omega=1|s=1)=2/3$ and $P(\omega=1|s=0)=1/3$ using Bayes' rule or likelihood ratios.
  *   **Common Error:** Students assume the signal probability ($2/3$) is the posterior probability without updating the prior odds, or they confuse $P(s|\omega)$ with $P(\omega|s)$.

  **2. Identification of Willingness as a Signal (5 Marks)**
  *   **Must-Hit:** Explicitly states that Bob's willingness to sell at $p=0.5$ reveals $s_B=0$ to Alice (and vice versa).
  *   **Common Error:** Students argue trade occurs because "valuations differ" and ignore the informational content of the counterparty's participation constraint.

  **3. Calculation of Updated Posterior Showing Collapse (5 Marks)**
  *   **Must-Hit:** Computes the joint likelihoods for $\{s_A=1, s_B=0\}$, shows they are equal ($2/9$), and concludes the posterior reverts to the prior ($0.5$).
  *   **Common Error:** Students assert the posterior changes but fail to show the arithmetic cancellation, or they claim the posterior becomes $1$ or $0$ due to "certainty."

  **4. Explanation of the Incentive Paradox (Part B) (5 Marks)**
  *   **Must-Hit:** Connects price informativeness to the elimination of profit opportunity; explains that if $p = E[\omega|s_A, s_B]$, private value equals price, removing the incentive to acquire $s_i$.
  *   **Common Error:** Students describe the Grossman-Stiglitz paradox by name or definition without linking it to the specific calculation in Part A (i.e., failing to see the mirror image structure).

  **5. Comparative Epistemic Analysis of Departures (Part C) (5 Marks)**
  *   **Must-Hit:** Distinguishes between modifications that preserve truth-tracking (noise) vs. those that abandon consensus (priors). Must explicitly state that heterogeneous priors surrender the common prior assumption.
  *   **Common Error:** Students list modifications (e.g., "risk aversion," "noise") as a grocery list without weighing their specific costs to the claim that prices aggregate *information* rather than just preferences.

  *(Note: To achieve full marks, the answer must flow logically from the arithmetic in Part A to the theoretical implications in Part C, demonstrating that the no-trade result is not a friction but a consequence of successful information aggregation.)*
