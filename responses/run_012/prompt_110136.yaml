  **Grade: 7/10**

  **Part (a): 3/3**
  *   **Right:** You correctly identify the argument's author (Jackson), the setup (Mary knows all physical facts), the crucial premise (she learns something new/what it's like), and the conclusion (physicalism is false/non-physical facts exist).
