answer: |-
  Good evening. For those who don't know me, I'm the best man and [Sister]'s brother. I'm a physical therapist, which means I spend my day putting bodies back together, while [Sister] spends her day proving why sets hold together in the first place. I know about half of you are here because you love [Groom]'s orchestra, and the other half are here because you know what a "poset" is. I'm going to try to bridge that gap without injuring anyone.

  I want to talk about Zorn's Lemma. It's a fundamental theorem in set theory, and I've been told by the department that if I garble this, I'll be finding typos in my own obituary.

  Here's the idea: Imagine a collection of things, ordered by how much they "extend" one another. A "chain" is just a sequence where every step leads to the next. Zorn's Lemma says that if every possible chain has an "upper bound" within that collection, then there must exist a "maximal element."

  Now, for the non-mathematicians: a maximal element isn't necessarily the "best" or the "biggest." It means nothing else extends it. It's complete. And for the mathematicians: the critical condition is that the upper bound must actually be *in* the set. It can't be an asymptote you approach forever. It has to be a point you can stand on.

  When I look at [Sister] and [Groom], I see the chain. Every date, every duet, every proof written on a napkin. One moment extending the next. A totally ordered sequence of growing love.

  For a long time, people might have wondered where that chain was going. Was there an upper bound? Some relationships drift toward a limit they never quite reach. But Zorn's Lemma requires the bound to be *in the set*. Today, standing here, you aren't approaching marriage from the outside. You are inside it. The commitment is part of the structure.

  And because that bound exists, the Lemma guarantees a maximal element. [Sister] and [Groom], you have found a state where nothing extends this commitment. Not because you're stopping, but because you're whole. There may be other loves in the universe, incomparable to this one—Zorn allows for that—but nothing out there extends what you have in here.

  [Groom], you teach middle school orchestra. You know that harmony isn't about everyone playing the same note; it's about different lines fitting into a complete structure. [Sister], you know that existence proofs don't give you a recipe, they just tell you the thing is real.

  That brings me to the Axiom of Choice. Zorn's Lemma is equivalent to it. It means that even though this maximal element exists, you still have to choose it. Every day. You have to select each other from the set of all possibilities.

  So, here is to the chain that brought you here. To the upper bound that holds you now. And to the maximal element you share—a love that nothing extends, because nothing needs to.

  To [Sister] and [Groom].
