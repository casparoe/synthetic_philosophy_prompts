  Hey, I'm in a cogsci seminar on the self and I keep running into a thing I dont have a word for. Here's what I mean. When I'm around my best friend I can basically feel her running me in her head — she finishes my sentences, and she'll call what I'm about to do before I've even decided, and honestly she's right more often than my own guess about myself is. And it's not just memory, cause she can produce stuff I've never done; ask her what I'd order at a restaurant I've never been to and she'll have an answer, and it'll probably be right. My mom's the same way. And here's the part that's bugging me: I have a sense of who I am, but so do they, and theirs is sometimes *better* — they catch me lying to myself. So which version is the real me? Also, when my grandpa died my grandma kept doing this thing where she'd know what he'd say about some new situation, and it wasn't just recalling old conversations, she'd kind of *consult* him. Is there a name for the idea that a person is partly made out of the versions of them that other people are running? Not in the boring sense that we influence each other — I mean the actual "I" being partly hosted somewhere else, and still running after the body's gone. I've heard "extended mind" but I think thats notebooks and phones, and "distributed cognition" but that's teams and cockpits and navigation, not one person's self living in another skull. Is there a term for the specific case where the extra bit of cognitive machinery is another person, or where *you're* the extra bit in someone else's machinery? And if there isn't one, can you coin one and tell me where the edges are — cause is my friend's model of me actually me, or a copy of me, or more like a portrait? Those feel completely different and I can't tell which one this is. Related: does that model count as thinking when she's not consciously running it, or only when she pulls it up? And is there a difference between the version of me in her head and the version in mine, or are we just two instances of the same pattern? I want more than a label here, I want to know what the thing actually is and where it stops being it.
