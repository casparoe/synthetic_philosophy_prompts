answer: |-
  This is one of the most profound and unsettling questions in cognitive science and philosophy of mind, and you are right to feel that "Extended Mind" (Clark & Chalmers) and "Distributed Cognition" (Hutchins) don't quite capture the *ontological weight* of what you're describing. Those frameworks usually treat the external component as a *tool* (a notebook, a calculator, a cockpit instrument). You are describing the external component as a *subject*.

  You are asking about the **Socially Extended Self**, but specifically the **Hosted Self-Model**.

  There isn't one single consensus term, but there is a cluster of concepts that get at this. Here is the breakdown of what this thing is, what we call it, and where the edges lie.

  ### 1. The Terminology: What do we call this?

  The closest academic term is **Socially Extended Cognition** (championed by philosopher Joel Krueger). Krueger argues that our emotional and cognitive regulation often happens *outside* our skulls, in the interpersonal space. However, most literature focuses on emotion regulation (e.g., a mother soothing an infant).

  You are describing something more specific: **Allocentric Self-Modeling.**
  *   **Egocentric:** Your model of you.
  *   **Allocentric:** Someone else's model of you.

  When that allocentric model becomes sophisticated enough to predict your behavior better than you can, it ceases to be just a "model" and becomes a **functional extension of your agency**.

  If we were to coin a term for your seminar, I would suggest **"The Hosted Self."**
  *   **Definition:** A cognitive subsystem representing an individual's identity, preferences, and predictive patterns, running on the neural hardware of *another* individual, capable of autonomous operation and decision-making on behalf of the original subject.

  ### 2. Is it You, a Copy, or a Portrait?

  This is the core ontological question. To answer it, we have to look at **Pattern Identity Theory** (championed by Daniel Dennett and Derek Parfit).

  *   **Substrate Identity:** You are your specific meat (neurons). If so, your friend's model is *not* you. It's a simulation.
  *   **Pattern Identity:** You are the *information structure*. If the pattern of your preferences, reactions, and logic is running elsewhere, *that is also you*, to the degree that the pattern is preserved.

  **The Verdict:** It is not a **copy** (copies imply divergence; a copy starts the same and drifts). It is not a **portrait** (portraits are static; they don't act).
  It is a **Lossy, Specialized Instance.**

  Think of it like a video game character. You are the server (the full complexity of your brain). Your friend has a "client" version of you installed in her head.
  *   **Why is it sometimes better?** Because her client version doesn't have access to your internal noise (anxiety, fatigue, self-deception). She sees the *signal* of your personality without the *static* of your immediate physiology. She sees the "center of narrative gravity" (Dennett) more clearly than you do because she isn't blinded by the immediate struggle of living it.
  *   **Is it thinking?** Yes. In predictive processing terms, her brain is running a generative model of you. When she predicts your order, that model is "firing."

  ### 3. The Dead Grandpa: Autonomous Models

  The case of your grandma consulting your dead grandpa is the critical edge case. This moves from *Extended Mind* to **Memetic Autonomy**.

  When he was alive, his brain and her brain were coupled. She updated her model of him constantly (error correction). When he died, the update channel closed. Her model of him became **frozen in time**, but because it was a high-fidelity generative model, it could still process *new* inputs.
  *   **Input:** "What would he say about this new political event?"
  *   **Processing:** Her neural weights (trained on 40 years of him) run the simulation.
  *   **Output:** "He'd say X."

  Is that him? In a **functionalist** sense: **Yes.** It is the only "him" that remains in the causal universe. It is a **Ghost in the Neural Machine**. This is why grief feels like a phantom limb; a massive cognitive processor that was part of your own regulatory system has gone offline, but the local cache (your memory/model of them) is still trying to run.

  ### 4. Where does it stop being "You"? (The Boundaries)

  You asked where the edges are. This is the most important part for your seminar. The "Hosted Self" stops being "You" when **Predictive Fidelity** breaks down due to **Update Failure**.

  1.  **Divergence:** You change. You grow. You have a new experience. If you do not communicate this to your friend, her model of you becomes outdated.
      *   *The Edge:* The moment her model predicts "Old You" but you act as "New You," the Hosted Self is no longer *you*. It is now a **historical archive** of you.
  2.  **Access:** You have private access to your qualia (the feeling of the food). She only has public access to your behavior.
      *   *The Edge:* If the restaurant serves a dish that *looks* like what you'd order but *tastes* wrong to you, she will get it wrong. Her model lacks the sensory loop.
  3.  **Agency:** Can she veto you? If she knows you're about to make a mistake and stops you, her model of you has effectively overridden your own executive function.
      *   *The Edge:* When her model of you has more control over your actions than your own model does, the boundary of the "Self" has officially expanded to include her skull.

  ### 5. Summary for your Seminar

  If you need to present this, here is the framework:

  *   **The Phenomenon:** **Interpersonal Self-Hosting.**
  *   **The Mechanism:** **Coupled Predictive Processing.** Your brains are not separate; they are a single system minimizing prediction error across two bodies.
  *   **The Ontology:** **Distributed Pattern Identity.** You are not a point; you are a field. The "Real You" is the aggregate of the self-model running in your head *plus* the high-fidelity models running in the heads of those who know you best.
  *   **The Risk:** **Model Drift.** When the external models stop updating (death, estrangement), they become ghosts. When they update too well (enmeshment), you lose individual agency.

  **The Answer to "Which version is the real me?":**
  Neither. The "Real Me" is the **negotiation** between the internal model and the external hosted models. When they align, you feel "known." When they conflict (she thinks you're lying, you think you're telling the truth), you are experiencing a **boundary error** in the distributed self.

  You are not a single player game. You are an MMO where some other players have admin privileges on your character file. That's what intimacy is.
