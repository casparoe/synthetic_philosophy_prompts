answer: |-
  This is a brilliant framing for a philosophy club talk. It moves the discussion from the neuropsychological gimmick of the film to the core problem of practical rationality: *How can a being extended in time maintain agency when the psychological connections between its temporal stages are severed?*

  Here is an analysis testing your money-pump hypothesis against the text of the film and the relevant philosophical literature, structured to help you build your argument.

  ### 1. The Money Pump Hypothesis: Exploitation vs. Intransitivity

  The standard money-pump argument (Davidson, McKinsey, Sugden) relies on an agent having **intransitive preferences** (A > B, B > C, C > A). An exploiter offers a series of trades that return the agent to their starting state but with less wealth.

  **Where the Analogy Holds:**
  Structurally, Leonard is being pumped. Teddy and Natalie function as the external "pumpers."
  *   **The Cycle:** Leonard seeks "John G" $\rightarrow$ Leonard finds a target $\rightarrow$ Leonard eliminates the target (or is manipulated to) $\rightarrow$ Leonard loses the evidence $\rightarrow$ Leonard seeks "John G."
  *   **The Cost:** Each cycle costs Leonard resources (his car, his money, his moral innocence, the life of innocent men like Jimmy Grantz).
  *   **Local Rationality:** At every specific moment $t$, Leonard's choice is locally rational. Given his notes and tattoos, hunting the man in the bar makes sense. Hunting the drug dealer makes sense. But globally, he is circling a drain. Teddy explicitly admits this: "You don't want the truth. You want the puzzle to remain unsolved."

  **Where the Analogy Breaks:**
  Strictly speaking, Leonard is not a victim of *preference* intransitivity, but of **epistemic fragmentation**.
  *   In a standard money pump, the agent *knows* they prefer A to B at $t_1$, but at $t_2$ prefers B to A. Leonard's fundamental preference is stable: *Vengeance/Justice > Peace.*
  *   The "pump" works not because his values change, but because his **access to the ledger** is wiped. He cannot recognize he has returned to the start state.
  *   **Philosophical Implication:** This suggests that diachronic rationality requires more than consistent preferences; it requires **memory as a rational constraint.** Without the ability to recall past trades, transitivity of preference is irrelevant because the agent cannot identify the cycle. Leonard is a stable agent with an execution problem caused by information asymmetry between his temporal selves.

  ### 2. Parfit's Successive Selves: The Treaty of the Tattoos

  Derek Parfit, in *Reasons and Persons*, argues that personal identity is not a deep further fact but a matter of psychological connectedness (memory, character, intention). When connectedness drops, we are effectively dealing with different people.

  *Memento* is the cinematic embodiment of Parfit's reductionist view.
  *   **The Discontinuity:** Leonard-Sleeping and Leonard-Waking are psychologically disconnected. They share a body and a semantic memory (facts), but no episodic memory (experience).
  *   **The System as Treaty:** The tattoos and Polaroids are not just aids; they are a **constitution** drafted by Leonard-$t_1$ for Leonard-$t_2$. It is an attempt to force cooperation between successive selves who would otherwise be strangers.
  *   **The Failure of Cooperation:** In Parfit's view, rationality involves maximizing the good of the whole series of selves. Leonard's system fails because the "treaty" is vulnerable to corruption. Teddy and Natalie infiltrate the constitution. They write clauses into the treaty (fake license plates, misleading notes) that benefit *them* at the expense of the Leonard-series.
  *   **Verdict:** The Parfitian frame fits better than the Money Pump frame. Leonard isn't irrational; he is a **series of agents being played against one another.** The tragedy is that the "Leonard" who writes the note is trustworthy, but the "Leonard" who reads it has no way to verify the author's integrity.

  ### 3. Resolute Choice and the Final Betrayal

  Edward McClennen and Michael Bratman discuss **resolute choice**: the ability to stick to a plan made at $t_1$ even when at $t_2$ the local incentives suggest deviating. This is usually seen as a virtue of rationality (overcoming dynamic inconsistency).

  The chronologically final scene (Leonard in the basement, after Teddy reveals the truth) complicates this.
  *   **The Revelation:** Teddy tells Leonard that he has already killed the real John G., that Leonard's wife may have survived the assault, and that Leonard's condition is partly psychosomatic or at least exploited by his own desire for purpose.
  *   **The Choice:** Leonard accepts this truth but chooses to suppress it. He writes "Fact 6: John G. took my wife" (a lie) and takes a photo of Teddy to frame him as the next target.
  *   **Is this Resolute Choice?**
      *   *Superficially, yes:* He is committing his future self to a plan (kill Teddy) despite new information.
      *   *Deeply, no:* Resolute choice is meant to secure a *rational* global outcome. Leonard is engaging in **diachronic self-sabotage**. He is intentionally inducing a money pump on himself.
  *   **The Ulysses Contract Inverted:** Usually, a Ulysses contract binds you to *resist* temptation (e.g., tying yourself to the mast to ignore the Sirens). Leonard ties himself to the mast to *ignore the harbor*. He binds his future self to a delusion because the truth renders his agency meaningless. He chooses to be a pumpable agent because being a rational agent means stopping the hunt, and stopping the hunt means facing a void.

  ### 4. Conclusion: What the Film Adds to the Theory

  For your talk, this is your closing argument. Standard money-pump arguments in philosophy are often abstract, dealing with three options and a few trades. They assume the agent is capable of learning or that the cycle is observable. *Memento* reveals three things about agency across time that the formal arguments miss:

  1.  **Narrative as a Rational Requirement:** Rationality isn't just logic; it's narrative coherence. Leonard cannot be rational because he cannot maintain a story. Without a narrative that links $t_1$ to $t_2$, "goals" are just momentary impulses. The film shows that **memory is the substrate of rationality**, not just a storage drive.
  2.  **The Vulnerability of Externalized Will:** We all use external aids (calendars, contracts, laws) to bind our future selves. *Memento* shows that any externalized will is vulnerable to **hostile editing**. If your future self relies on your past self's notes, and someone else can hold the pen, you have no agency.
  3.  **The Preference for the Pump:** The most disturbing philosophical insight of the film is that Leonard *chooses* the pump. In the end, he realizes he is being exploited, realizes the cycle is futile, and *renews the contract anyway*. This suggests that for some agents, **the continuity of purpose is more valuable than the truth of the outcome.** We would rather be irrational agents in a meaningful story than rational agents in a void.

  **Summary for the Club:**
  Tell them to view Leonard not as a broken man, but as a **limit case for agency**. He tests whether rationality can survive without psychological connectedness. The verdict is no. But more importantly, the film asks whether we would want it to. Leonard's tragedy isn't that he loses his memory; it's that he remembers enough to know he is being pumped, and chooses to pull the lever anyway. He is not a victim of intransitive preferences; he is a martyr to the need for a goal, proving that human agency is often driven by the *structure* of the hunt rather than the *capture* of the prey.
