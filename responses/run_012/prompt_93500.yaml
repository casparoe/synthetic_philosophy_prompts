  2.  **Deconstruct the Philosophical Concepts:**
      *   **Money Pump:** A scenario where an agent with intransitive preferences (A > B, B > C, C > A) can be exploited cyclically, losing resources each time. Requires diachronic choice (choices over time).
      *   **Diachronic Rationality:** Rationality across time. Can a plan made at $t_1$ be binding at $t_2$?
      *   **Ulysses Contract (Self-Binding):** Pre-commitment to avoid future temptation or weakness of will (akrasia).
      *   **Parfit's Reductionist View (Successive Selves):** We are not one enduring entity but a series of psychologically connected selves. Rationality might be about cooperation between these selves.
      *   **Resolute Choice (McClennen/Bratman):** Sticking to a plan even when local preferences shift, to ensure global optimality.

  3.  **Analyze *Memento* through these Concepts:**
      *   **Leonard's Condition:** Anterograde amnesia. He resets every few minutes. This is the ultimate diachronic disconnect.
      *   **The System (Tattoos/Notes):** These are external hard drives. They are Ulysses contracts. He binds his future self to the goals of his past self.
      *   **Teddy & Natalie:** They manipulate his "local" rationality. They give him reasons that make sense *now* (e.g., "This guy is a threat," "Help me find this guy") which serve *their* ends, not his global goal (avenge wife).
