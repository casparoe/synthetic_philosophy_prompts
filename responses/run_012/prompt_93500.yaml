          *   *Break:* Standard money pumps rely on *preference* inconsistency (A > B > C > A). Leonard's *stated* preference is constant ("Find John G"). The inconsistency is in *belief* and *information access*, not necessarily fundamental values. He is being *pumped* by others, not necessarily by his own internal intransitivity.
      *   **Successive Selves (Parfit):** Leonard is the perfect case study for Parfit. The "Leonard at $t_1$" and "Leonard at $t_2$" are barely psychologically connected. They are like different people. The tragedy is the lack of cooperation between them.
      *   **Resolute Choice:** The ending is crucial. He chooses to ignore the truth (Teddy's revelation) and sets up a clue ("Fact 6") to ensure his future self continues the hunt. This is *anti*-resolute choice in a truth-seeking sense, but *hyper*-resolute in a goal-maintenance sense. He binds his future self to a lie.

  4.  **Drafting the Response - Section by Section:**

