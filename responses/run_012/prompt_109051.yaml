answer: |-
  Here is the teaching plan. It is built on your hunch: the inefficacy objection only bites if students have already tacitly accepted a **counterfactual account of moral responsibility** (i.e., "I am only responsible for outcomes I caused"). If they don't hold that view, the objection falls flat immediately. Your job is to make them hold that view explicitly, show where it breaks, and then offer a repair.

  ### 1. The Dependency Order
  You cannot start with climate change. If you start with climate, students fight the *science* (e.g., "But supply chains respond to demand!") rather than the *ethics*. You need to isolate the logic.

  **The Sequence:**
  1.  **The Principle (Difference-Making):** Establish that, intuitively, we think blame requires making a difference. (Prerequisite for the objection to have force).
  2.  **The Stipulation (Inefficacy):** Present a case where it is *metaphysically certain* that no single act makes a difference. (Removes empirical wiggle room).
  3.  **The Verdict (Moral Intuition):** Elicit the judgment that the act is *still* wrong. (Creates the conflict).
  4.  **The Application (Climate):** Map the logic back to the real world. (Tests transfer).

  **Why this order?**
  If you present the Case (2) before the Principle (1), they won't feel the tension. If you present Climate (4) before the Case (2), they will get stuck on empirical probabilities ("Maybe my flight *does* matter"). The Case must be a "logic trap" where the inefficacy is stipulated as true, forcing them to abandon the Principle or accept an absurdity.

  ---

  ### 2. The Master Case: "The Thousand Dials"
  **Do not use:** Voting (implies thresholds/ties), Burgers (implies market signals/probability), or Climate directly (too diffuse/emotional).
  **Use:** Parfit's "Harmless Torturers" variant (The Thousand Dials).

  **The Setup:**
  *   There is **one victim** in a room.
  *   There are **1,000 agents** outside, each with a dial connected to the victim's machine.
  *   The machine measures pain on a scale of 0–1000.
  *   **The Rule:** Each agent turns their dial up by exactly **one increment**.
  *   **The Stipulation:** One increment is **imperceptible**. The victim cannot feel a single turn. They only feel pain once the sum of turns reaches a certain level.
  *   **The Outcome:** All 1,000 agents turn their dials. The victim ends up in agonizing pain (level 1,000).

  **Why this case works:**
  *   **No Threshold Trick:** Unlike voting (where one vote *could* break a tie), this case stipulates a continuous scale. There is no "magic number" where the 500th turn triggers pain while the 499th doesn't.
  *   **No Causal Chain:** Unlike burgers (where supply chains might adjust), the causal link is direct and mechanical.
  *   **No "No Victim":** The victim is singular and identifiable, countering the "diffused harm" misconception.
  *   **The Trap:** It forces the student to admit that an act can be wrong *even if* it made no perceptible difference to the outcome.

  ---

  ### 3. The 75-Minute Arc

  #### **Phase 1: The Principle (0–15 mins)**
  *Goal: Make the counterfactual picture explicit.*
  *   **Activity:** Ask: "Why is it worse to push a person down the stairs than to wish they would fall?"
  *   **Elicit:** They will say "Because you *caused* it." "Because it wouldn't have happened without you."
  *   **Board Work:** Write the **Difference-Making Principle**: *An act is morally wrong only if it makes the outcome worse than it would have been otherwise.*
  *   **Misconception Check ("No victim I can point to"):**
      *   *Where:* During the elicitation.
      *   *What to say:* "Does there need to be a specific person hurt, or just bad vibes?" (Steer them toward: Specific harm matters).
      *   *Why:* This sets up the Thousand Dials victim as the anchor. If they think harm is abstract, the case won't bite.

  #### **Phase 2: The Case & The Objection (15–40 mins)**
  *Goal: Apply the Principle to the Stipulated Case to generate the Inefficacy Objection.*
  *   **Activity:** Walk through the Thousand Dials. Ask: "Agent #432 turns their dial. Did they make the victim worse off than if they hadn't?"
  *   **The Trap:** Because the increment is imperceptible, the answer (by stipulation) is **No**. The victim feels exactly the same with or without Agent #432.
  *   **The Objection:** Ask: "So, did Agent #432 do anything wrong?"
  *   **Expected Response:** Many will say "No, they made no difference." (This is the Inefficacy Objection in its pure form).
  *   **Misconception Check ("Sum of innocents"):**
      *   *Where:* When they claim Agent #432 is innocent.
      *   *What to say:* "Okay, if #432 is innocent, and #1 is innocent, and #1000 is innocent... how did the victim end up in agony? Did the pain create itself?"
      *   *Why:* This exposes the fallacy of composition. If every part is innocent, the whole cannot be guilty. Something has to give.

  #### **Phase 3: The Turn (40–60 mins)**
  *Goal: Force the rejection or modification of the Principle.*
  *   **Activity:** Press the verdict. "Look at the victim. Look at Agent #432. Is it really permissible to turn that dial?"
  *   **The Shift:** Students will almost universally say "No, it's wrong."
  *   **The Philosophical Work:** If it's wrong, but it made no difference, then the **Difference-Making Principle is false.**
  *   **Alternative:** Introduce **Complicity/Participation**. "You are not responsible for the *outcome* (the total pain), you are responsible for the *participation* in a harmful project."
  *   **Misconception Check ("Threshold/Triggering"):**
      *   *Where:* When they try to save the Principle by saying "But someone triggered the pain!"
      *   *What to say:* "We stipulated the scale is smooth. There is no trigger. There is only the sum. If you rely on a threshold, you are changing the case."
      *   *Why:* This prevents them from solving the problem by reverting to a voting-model (where only the tie-breaker is blamed).

  #### **Phase 4: Application to Climate (60–70 mins)**
  *Goal: Transfer the logic.*
  *   **Activity:** "Now, look at your flight. The science says one flight's carbon is imperceptible to the climate system (like the dial increment). The harm is real (like the victim). Are you off the hook?"
  *   **Result:** They should now see that "making no difference" is not a valid defense, because they just rejected that principle in the Dial case.
  *   **Caveat:** Acknowledge that climate is empirically messier than dials, but the *moral structure* is identical.

  #### **Phase 5: Assessment & Boundaries (70–75 mins)**
  *Goal: Test understanding and set limits.*

  **The Final Question:**
  > "Suppose we could prove scientifically, with 100% certainty, that your individual carbon emissions this year will make **zero perceptible difference** to global temperature, sea levels, or human suffering. Based on today's discussion: Is it permissible to emit?"

  *   **Correct Structural Answer:** "No, because wrongness isn't solely about perceptible difference-making; it's about participating in a harmful collective practice."
  *   **Incorrect Answer:** "Yes, because no harm was done" (Failed to reject the Principle) OR "No, because actually it probably does make a difference" (Failed to accept the stipulation/inefficacy).

  **What to Refuse to Settle (The Boundaries):**
  1.  **The Positive Theory:** Do not try to prove *why* participation is wrong (Kantian? Virtue? Rule-Consequentialism?). Say: "We've shown the Difference-Making view fails. *Why* participation binds us is a different course."
  2.  **Overdemandingness:** If they ask, "Does this mean I can't do *anything*?", refuse to solve it. Say: "That's the problem of demandingness. Today we are only establishing that 'no difference' is not a get-out-of-jail-free card."
  3.  **Empirical Uncertainty:** If they argue, "But maybe my flight *does* tip the scale," stop them. Say: "For this argument, we grant the inefficacy objection its strongest premise. If you can't win even when you make no difference, you certainly can't win when you do."

  ### Summary of Misconception Handling

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"No victim = No wrong"** | Phase 1 (Principle) | Insist the Dial case has **one specific victim**. If they say "I can't point to which pain cell is mine," reply: "You can't point to which raindrop drowned the city, but the city is drowned." |
  | **"Sum of innocents = Innocent"** | Phase 2 (The Objection) | Use the **Agony Check**. "If 1,000 innocent acts produce agony, our definition of 'innocent' is broken, not the math." |
  | **"Only the threshold-crosser is to blame"** | Phase 3 (The Turn) | **Stipulate Continuity**. Remind them there is no threshold. If they insist, ask them to identify *which* agent crossed it. They can't. |

  ### Why the "Dial" Spine is Safe (Not a Trap)
  You worried the dial case might be a trap. It is only a trap if you let them treat it as an empirical claim. It is safe if you treat it as a **conceptual stipulation**.
  *   **Voting** misleads because it suggests *probability* saves us (expected utility).
  *   **Burgers** mislead because it suggests *market mechanics* save us (elasticity).
  *   **Dials** work because they remove the mechanics. It leaves only the morality.

  If you keep the Dial case purely normative (about blame) and not empirical (about physics), it carries the session perfectly.
