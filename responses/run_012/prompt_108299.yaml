answer: |-
  **Examination Question**

  **Question 1**
  It is often argued that if the connection between a relation and its terms is treated as just another relation, an infinite regress follows, leaving nothing truly unified. To stop this, one might deny that the connecting tie is a relation at all, or one might deny that there is a single unified object of judgment to begin with. Assess the philosophical cost of each strategy. In doing so, identify the assumption that generates the regress and explain what a genuine explanation of propositional unity would require.

  *(45 minutes; approx. 700–800 words)*

  ***

  **Model Answer**

  The problem of propositional unity arises from the distinction between a mere list of constituents and a proposition that asserts something true or false. 'Socrates' and 'wisdom' listed together are not the same as the judgment that Socrates is wise. The former is a collection; the latter possesses a structure that allows for truth. The regress argument claims that if we try to explain this structure by adding a further constituent to bind the terms, we fail. If a relation $R$ binds terms $a$ and $b$, we seemingly need a further relation $R'$ to bind $R$ to $a$ and $b$, and so on ad infinitum. The result is that unity is never achieved, only deferred.

  The assumption generating this regress is the claim that every element of complexity must be accounted for by the addition of another constituent. It treats the 'tie' that unifies a proposition as if it were merely another object within the proposition, rather than the mode of combination itself. To halt the regress, one must reject this assumption, but the available exits carry significant costs.

  The first strategy denies that the tie is a relation. On this view, predication is not a relational fact but something sui generis, perhaps a logical function or an act of assertion. The verb is not an object to be related but the glue itself. The cost here is explanatory silence. If the tie is not a relation, it cannot be analysed in terms of constituents. This risks making unity a brute fact. While this stops the regress, it may amount to changing the subject. We asked how unity is achieved; the answer 'it just is' denies the request for an explanation. If the unity of the proposition is primitive, we have labelled the mystery rather than solved it. We secure unity, but we lose the ability to explain how false propositions are possible, for if the tie is an actual act of asserting, false judgments might lack the tie entirely, ceasing to be propositions at all.

  The second strategy denies that there is a single unified object of judgment. Instead of a mind relating to a proposition, the mind enters a multiple relation with the several objects judged about. There is no 'proposition' standing between the mind and the world. The cost here is the problem of directionality. If judgment is a relation between a mind, $a$, $b$, and the relation $R$, what distinguishes judging that $a$ bears $R$ to $b$ from judging that $b$ bears $R$ to $a$? The constituents are identical. In a unified proposition, the order is internal to the structure. In a multiple relation theory, the order must be supplied by the mind's relating act. However, if the mind simply relates to the objects, there is no obvious metaphysical ground for the asymmetry.

  Is this objection fatal? It is fatal if one holds that the truth-condition of a judgment must be determined by the objects alone. If the unity is not in the world (as a fact) or in a proposition, it must be in the mind. But if the mind's attitude is the only source of order, error becomes difficult to locate. One might argue this is merely awkward, not fatal, provided we accept that logical form is imposed by the subject. However, this threatens to make truth subjective. If the unity is not independent of the judgment, it is hard to see how the world can make the judgment true. Thus, while this strategy avoids the regress by dissolving the proposition, it struggles to account for the objective conditions of truth.

  A satisfying explanation of propositional unity must do more than halt the regress; it must explain how complexity yields truth-conditions. It requires showing how constituents combine to represent a state of affairs without requiring an infinite chain of binders. This likely demands a distinction between objects and concepts, where concepts are unsaturated and require completion. This avoids treating the tie as a relatum. However, one must then explain how an unsaturated entity can exist without being a mysterious incomplete object. Ultimately, a solution must show that unity is not an added component but the condition under which components are present at all. To treat it as a component is the category mistake that generates the regress. Therefore, a satisfying answer must redefine the ontology of the proposition, showing that unity is formal, not material. Without this, we are left choosing between brute facts and subjective ordering, neither of which fully secures the objective unity required for truth.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **Must-Hit Points (4 marks each)**
  1.  **Identification of the Generating Premise:** The answer must identify that the regress arises from treating the unifying 'tie' or copula as just another constituent or relatum within the complex, rather than the mode of combination.
  2.  **Analysis of Strategy 1 (Non-Relational Tie):** The answer must explain the view that the tie is not a relation (e.g., unsaturatedness or act) and explicitly identify the cost: that this risks making unity a brute fact or changing the subject rather than explaining it.
  3.  **Analysis of Strategy 2 (Multiple Relation/No Proposition):** The answer must explain the view that judgment relates a mind to multiple objects directly and explicitly identify the cost: the difficulty of accounting for order/directionality without a unified structure.
  4.  **Evaluation of the Asymmetry Objection:** The answer must not merely state the asymmetry problem but assess whether it is fatal (e.g., threatens objective truth) or merely awkward (requires subjective ordering), providing a reason for the assessment.
  5.  **Characterisation of a Satisfying Explanation:** The answer must conclude by stating what a genuine solution requires (e.g., a category distinction between objects and functions, or showing unity is formal not material) rather than simply asserting unity is primitive.

  **Specific Mistakes (Deduct 2 marks per occurrence, up to 10 marks total)**
  *   **Benign Regress:** Treating the infinite regress as harmless or something that can be shrugged off without ontological consequence.
  *   **Conflation:** Confusing this regress with the Third Man Argument (Forms) or Zeno's paradoxes, leading to irrelevant discussion of space, time, or universals.
  *   **Primitivism without Argument:** Asserting that 'unity is simply primitive' as a final solution without acknowledging the explanatory cost requested in the question.
  *   **Name-Dropping:** Relying on labels (e.g., 'Bradley', 'Russell', 'Davidson') instead of philosophical reasoning. (Names are not forbidden, but reliance on them in place of analysis indicates rote learning).
  *   **Summary over Analysis:** Devoting more than half the essay to reconstructing the steps of the regress rather than analysing the two ways out and their costs.

  **Differentiation: First-Class vs. Competent**
  *   **Competent (10–14 marks):** Hits the five must-hit points broadly. Correctly identifies the two strategies and the asymmetry problem. The explanation of *why* the costs matter may be somewhat standard or textbook-like.
  *   **First-Class (15–20 marks):** Demonstrates a deeper grasp of the *implications* of the costs. For example, it connects the asymmetry problem directly to the possibility of falsehood or objective truth-conditions. It articulates clearly why treating the tie as a constituent is a category mistake. The writing is precise, and the conclusion regarding what counts as a 'satisfying explanation' offers genuine insight into the metaphysics of structure rather than a generic summary.
