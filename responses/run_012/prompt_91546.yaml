      To treat this like a spec, we need to define the interface a natural kind must implement and the invariants it must maintain across different environments, specifically separating it from a conventional class that just happens to be useful. The first non-negotiable requirement is inductive risk management, or what philosophers call projectibility, which means the category must support counterfactual predictions that hold up under intervention. This is where your flaky test versus race condition distinction lands. A race condition maps to a specific causal mechanism in the concurrency model, so if you identify one instance, you can predict that similar synchronization primitives will fail under load, and you can fix them by altering the locking strategy. A flaky test is just a symptom label for any test that fails intermittently, regardless of cause, so knowing a test is flaky tells you nothing about how to fix it or what else will break. A theory of natural kinds must mandate that membership implies shared causal powers, not just shared symptoms, otherwise you cannot distinguish the race condition from the flaky test.

      The second requirement is interest independence, which demands that the category exists and retains its coherence regardless of human goals or biological limitations. This is the constraint that rules out vitamins as a natural kind. Vitamins are a heterogeneous collection of molecules grouped solely because human metabolism cannot synthesize them, so if you remove the human body from the equation, the category vitamins dissolves while the category purines or amino acids remains. Your roommate's claim about iron and gold relies on this invariant, because gold retains its atomic structure whether humans are there to value it or not. However, this requirement is where the spec starts to throw exceptions when dealing with biology, because species are often defined by reproductive isolation which is a relational property, not an intrinsic one like atomic number. If you enforce strict interest independence, you might have to say species are not natural kinds, which contradicts the intuition that a tiger is a real thing in a way that a vitamin is not.

      The third requirement is stability under theory change, which asks whether the category survives when our underlying model of the world gets refactored. This handles the water mold case. When water molds were moved from fungi to protists, a natural kind theory needs to explain whether the old category was false or just deprecated. If the kind is natural, the old classification was effectively a bug because it grouped organisms by superficial morphology rather than phylogenetic lineage, meaning the category fungi did not carve nature at its joints in that instance. However, if you demand too much stability, you conflict with scientific realism, because science does change its mind about what exists. A viable spec must allow that our labels for natural kinds can be wrong without denying the existence of the kinds themselves, distinguishing between the map and the territory.

      There is a critical tension between interest independence and inductive power that might make this spec impossible to satisfy perfectly across all domains. Vitamins are highly projectible for a doctor trying to prevent scurvy, even though they are interest-dependent, while some mind-independent categories might be useless for human prediction. If you prioritize projectibility, you let vitamins in, but if you prioritize interest independence, you kick them out, and biology sits uncomfortably in the middle because species are real but also defined by historical contingencies that look a lot like human interests. This tension suggests that you might need two different interfaces, one for fundamental physics and one for special sciences like biology, rather than a single unified theory.

      The single requirement that does the most to rule out existing theories is interest independence, because it eliminates all pragmatic and conventionalist accounts that define kinds solely by their utility to scientists. Many philosophers argue that if a category works for prediction, it is real enough, but this requirement insists that utility is not sufficient without mind-independent grounding. This is the hardest constraint to meet because it requires a metaphysical commitment that we can never fully verify, only infer from the success of our predictions.

      The requirement I am least sure belongs on the list is stability under theory change, because it assumes there is a static structure to nature that we are gradually approximating, which might not be true if nature itself is evolving or if our access to it is always mediated by theory. I would drop this requirement if I saw a compelling case where a category was universally accepted as a natural kind despite undergoing a radical conceptual shift that changed its membership criteria entirely, not just refined them. For example, if the concept of species shifted from essentialism to population thinking without losing its status as a real category, it would suggest that stability is not about the definition staying the same, but about the role the category plays in explanation, which would force me to demote stability from a non-negotiable invariant to an optional feature of mature sciences.

