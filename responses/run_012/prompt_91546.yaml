prompt: |-
  I'm a backend engineer, no philosophy background beyond one ethics elective, and I've gotten into a long-running argument with my roommate, who's a second-year bio PhD, that I can't stop thinking about. It started when she said species aren't real, they're just convenient boxes, and I said fine, but then neither is iron or gold, and she said no, those are real, and now we've been going back and forth for weeks and I keep hearing myself say things like "well the point of a category is that it supports predictions" without knowing whether that's a real position or something I invented on the spot. Someone told me the general name for this is natural kinds, and that there's a phrase about nature having joints that we're supposed to cut along, which I like but don't actually understand. What I want from you isn't a tour of who said what. I want the spec first, like the one I'd write before building a service: for a theory of what makes a category a natural kind rather than a human convenience, what does it actually have to deliver? Which cases must it get right, which distinctions must it not collapse, which findings from real science must it stay consistent with, and for each item on the list, tell me the case or consideration that puts it there.

  Some cases I want the list to be able to handle, because they're the ones that keep coming up between us: the fact that water molds used to be filed under fungi and got moved out into a completely seperate branch of the tree of life, which makes me wonder whether the old category was simply wrong or just answering a different question; vitamins, which look like a grab-bag of unrelated molecules that happen to be things our bodies can't make; and something from my own work, where we have a category in our incident tracker called "flaky test" that everyone uses and that I'm pretty sure doesn't correspond to anything in the world, sitting right next to "race condition", which I'm pretty sure does, even though both are just labels we typed into a form. I also want to know which of these requirements are non-negotiable and which are really just preferences of one camp, and whether any two of them can't be satisfied at the same time. If the list turns out to be impossible as stated, that's the most interesting outcome to me, so say so and say which pair is in tension. And tell me which single requirement does the most to rule out the theories people actually hold. Skip the scorecard of the contenders, I'll read up on those myself; the requirements are the part I can't fake.

  One more thing: I don't want a confident lecture, I want to know where the thing is weakest. So at the end, tell me which requirement you're least sure belongs on the list, and what you'd have to see — some case, some result, some argument — that would make you drop it, or demote it from non-negotiable to optional. Write it as continuous prose, please, no headings, no bullet points, no bold, no tables, just paragraphs like you'd write in an email, even if a list would be tidier.
