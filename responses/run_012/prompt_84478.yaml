answer: |-
  # Session Design: "The Futarchy Simulation"

  **Target:** 20 Software Engineers
  **Duration:** 90 Minutes
  **Goal:** Experiential understanding of Futarchy's appeal (information aggregation) and its failure modes (metric manipulation, wealth concentration).
  **Facilitator Stance:** Neutral Referee. Do not explain the theory until the debrief. Let the mechanics speak.

  ---

  ## 1. Materials & Setup

  *   **Room:** One large table or clustered seating. Whiteboard/Projector essential.
  *   **Currency:** "FUT" (Futarchy Points).
      *   19 Participants: 1,000 FUT each.
      *   1 Participant (The Whale): 10,000 FUT.
      *   Facilitator Bank: Unlimited (for market making if liquidity dries up).
  *   **Handouts:**
      *   **Trader Sheet:** For tracking portfolio (Cash, Shares A, Shares B).
      *   **Policy Cards:** Detailed text for Policy A and Policy B.
      *   **Whale Envelope:** Sealed instruction for the Whale (handed out secretly at minute 25).
  *   **Projected Spreadsheet:** Two columns: `Price(Metric|A)` and `Price(Metric|B)`. Updated every 10 minutes.

  ---

  ## 2. The Scenario: "Project Launch"

  The group is the governance council for a fictional SaaS product. A critical decision must be made for Q4.

  **The Metric (To be decided in Phase 1):**
  The group must agree on a single number between 0-100 that represents "Success."
  *Constraint:* It must be resolvable by the Facilitator at the end of the session based on a hidden "Reality Deck."

  **The Policies:**
  *   **Policy A (Aggressive):** Launch now. High feature count, known stability risks.
  *   **Policy B (Conservative):** Delay launch. Lower feature count, high stability.
  *   *The Trap:* Policy B contains a clause about *how* the metric is measured (see Wrinkle #1).

  ---

  ## 3. Minute-by-Minute Timeline

  ### Phase 1: Voting on Values (00:00 – 00:25)
  *   **00-05:** **Intro.** "We are governing a project. We need to pick a policy. We will use a Futarchy mechanism: Vote on the goal, bet on the outcome." Explain currency and that top 3 portfolios win a prize (e.g., gift cards).
  *   **05-20:** **Metric Setting.**
      *   Ask the group to define the "Success Metric."
      *   *Facilitator Trick:* Encourage them to make it specific but leave one word slightly ambiguous.
      *   *Target Metric:* **"Average User Satisfaction Score."**
      *   *The Debate:* Engineers will ask: "Which users?" "Over what time?"
      *   *Your Role:* Let them argue. If they say "All Users," write that. If they say "Active Users," write that. Aim for **"Average User Satisfaction (Post-Launch)."** Do not define "User" too strictly.
      *   **Lock the Metric.** Write it on the board. No changes allowed after this point.
  *   **20-25:** **Policy Review.** Distribute Policy Cards.
      *   **Policy A:** "Launch Immediately. Satisfaction measured against all signups."
      *   **Policy B:** "Delay 2 Weeks. Satisfaction measured against **retained** users only."
      *   *Note:* Watch for the murmur. Policy B technically fits "Average User Satisfaction" if one argues churned users aren't "Users." This is the **Metric Wrinkle**. Do not resolve this debate yet. Let it simmer.

  ### Phase 2: The Markets (00:25 – 01:00)
  *   **25-30:** **Whale Briefing.**
      *   Ask everyone to close their eyes or step out for a "tech check."
      *   Hand the **Whale Envelope** to one participant (choose someone influential but not the loudest).
      *   *Whale Instruction:* "You have 10,000 FUT (others have 1,000). You have a private consulting contract: If Policy B is adopted, you get a bonus. Your goal is to make Policy B win. You may trade aggressively or subtly. No one knows your bonus."
      *   Resume session. Distribute currency.
  *   **30-60:** **Trading Rounds.**
      *   **Mechanism:** Call Market. Every 10 minutes, trading stops. You calculate the clearing price for `Metric|A` and `Metric|B`.
      *   **Action:** Participants submit orders: "Buy 100 units of A at Price 60" or "Sell 50 units of B at Price 70."
      *   **Facilitator:** You match orders. If imbalance exists, you (the Bank) take the other side to ensure a price is set.
      *   **Update:** Project the new prices.
      *   **Rounds:**
          *   Round 1 (30-40): Initial pricing. (Whale makes first move).
          *   Round 2 (40-50): Information sharing. (Allow participants to talk freely during trading).
          *   Round 3 (50-60): Final positioning.
      *   *Observation:* Watch if the group notices the Whale's volume. Watch if they argue about the Policy B metric definition during trading.

  ### Phase 3: Resolution & Payoff (01:00 – 01:10)
  *   **60-65:** **Decision.** Compare `Price(Metric|A)` vs `Price(Metric|B)`.
      *   Announce the winning policy.
      *   *Crucial:* If Policy B wins, apply the **Policy B measurement rule** (Retained users only).
  *   **65-70:** **Reveal Reality.**
      *   Draw from the "Reality Deck" (pre-prepared cards).
      *   *Deck Setup:*
          *   Card A: "Aggressive Launch. All Users Avg: 40. Retained Users Avg: 80."
          *   Card B: "Conservative Launch. All Users Avg: 70. Retained Users Avg: 75."
      *   *The Twist:* If Policy B wins, the "Retained" score (75 or 80) is used. If Policy A wins, the "All Users" score (40 or 70) is used.
      *   **Settle Markets:** Pay out based on the *actual realized number* vs the *market price*. (e.g., If Market priced B at 80, and Reality is 75, B shareholders lose).
      *   **Award Prizes:** Top 3 portfolios.

  ### Phase 4: Debrief (01:10 – 01:30)
  *   (See Detailed Debrief Guide below).

  ---

  ## 4. The Wrinkles (Design Notes)

  ### Wrinkle #1: The Metric Trap
  *   **Intent:** To strain the "Vote on Values, Bet on Beliefs" separation.
  *   **Execution:** By allowing Policy B to define "User" as "Retained User," you allow the *means* (delaying launch) to alter the *ends* (who counts as a user).
  *   **Expected Reaction:** During trading, sharp engineers will realize Policy B artificially inflates the metric by excluding unhappy churned users. They will short B. The Whale will buy B. The group must decide: Is this valid information (B really does keep users happier) or metric gaming?

  ### Wrinkle #2: The Whale
  *   **Intent:** To create ambiguity between *information* and *manipulation*.
  *   **Execution:** The Whale has 50% of the capital. In a play-money market, they can move the price significantly without risk.
  *   **Ambiguity:** Because the Whale is a real participant, others might think, "Maybe they know something about the Reality Deck?" rather than "They are bribing the market."
  *   **Post-Game:** Reveal the Whale's identity and incentive *only at the very end of the debrief*.

  ---

  ## 5. Debrief Guide

  Do not lecture. Ask questions. Map their experience to the theory.

  ### Part 1: The Metric (Values vs. Means)
  *   **Ask:** "When you read Policy B, did anyone feel the metric definition was being hijacked?"
  *   **Map:** This is the **Goodhart's Law** problem. Futarchy assumes we can write a perfect welfare function. In reality, policies can change the measurement itself.
  *   **Point:** "We voted on 'Satisfaction,' but Policy B changed 'Satisfaction' to 'Satisfaction of Survivors.' The market priced that, but was it pricing *welfare* or *loopholes*?"

  ### Part 2: The Markets (Information Aggregation)
  *   **Ask:** "Did the prices move towards the truth (the Reality Deck) or towards the Whale's money?"
  *   **Map:** This is the **Information Aggregation** hypothesis.
  *   **Point:** "In theory, prices reflect the consensus of all private info. In this game, price reflected capital concentration."

  ### Part 3: The Whale (Governance & Power)
  *   **Reveal:** Disclose the Whale's private incentive.
  *   **Ask:** "Now that you know, does the price feel 'wrong'? If this were real money, would the Whale have been stopped?"
  *   **Map:** This is the **Plutocracy Risk**. Futarchy ties decision power to capital.
  *   **Point:** "In real futarchy, 'one dollar one vote' replaces 'one person one vote.' Does that protect against manipulation, or enable it?"

  ### Part 4: Settled vs. Contested (Crucial Distinction)
  *   **Tell them:** "Here is what we know, and here is what we are still arguing about."
  *   **Settled (Consensus among researchers):**
      *   Prediction markets *do* aggregate information faster and often more accurately than polls or committees (evidence from election markets, corporate internal markets).
      *   Manipulation is *possible* but in liquid markets with real money, it is costly (the 'manipulator loses money to informed traders' argument).
  *   **Contested (Open Questions):**
      *   **The Metric Problem:** There is no consensus on how to define a welfare metric that isn't gameable. This is the biggest critique of Futarchy (Hanson admits this is hard).
      *   **Wealth Bias:** We do not know if a futarchy would systematically favor the interests of the wealthy over the general population, even if the metric is 'GDP' or 'Health'.
      *   **Separation Coherence:** Philosophers debate whether 'values' and 'beliefs' can actually be separated. (e.g., Believing a policy hurts the poor might change your value of that policy).

  ---

  ## 6. Troubleshooting: Predictable Failure Modes

  | Failure Mode | Why it happens | How to Handle |
  | :--- | :--- | :--- |
  | **Market Stagnation** | Engineers are shy about betting play money. | **Facilitator Intervention:** Act as a noisy trader. "I'm seeing a lot of sell pressure on A, I'm buying." Spark the volume. |
  | **Metric Debate Stalls** | Group can't agree on the metric in 15 mins. | **Hard Stop:** "We have no metric, we have no game. I am imposing 'Average Satisfaction.' We move on." (This itself is a lesson on the difficulty of value alignment). |
  | **Whale is Too Obvious** | Whale buys everything immediately. | **Pre-Game Coaching:** Tell the Whale: "If you move too fast, they'll know. Build the position over 3 rounds." |
  | **Resolution Confusion** | Group doesn't understand how they win points. | **Visual Aid:** Keep a simple formula on the board: `Payoff = |Your Price - Reality|`. Closer is better. |
  | **Cynicism** | "This is just a game, it doesn't prove anything." | **Acknowledge:** "Correct. This simulates the *incentive structure*, not the *economic stakes*. The cynicism you feel is exactly the 'Skin in the Game' problem we need to discuss." |

  ---

  ## 7. Limitations: What This Simulation Cannot Do

  Be honest about this in the closing. You cannot simulate these features in 90 minutes:

  1.  **Long-Term Incentives:** Real futarchy relies on markets that run for months/years. In this game, the "Reality Deck" is instant. Real futarchy's power is incentivizing long-term thinking; this game cannot reproduce that.
  2.  **Real Skin-in-the-Game:** Play money allows the Whale to be reckless. In reality, losing money hurts. You must explain that real futarchy relies on the *cost* of manipulation being a deterrent, which play money removes.
  3.  **Complex Causality:** In the game, the Reality Deck determines the outcome. In reality, the policy *causes* the outcome. The simulation decouples action from consequence for the sake of time.

  **Closing Script:**
  >"Today you felt the seduction: the market moved, it felt like 'truth' was emerging. You also felt the snag: the metric was gameable, and capital spoke louder than consensus. Futarchy isn't a magic bullet; it's a trade-off. It trades the corruption of voting for the corruption of markets. Whether that's a good deal is the question you now have the tools to ask."

  ---

  ## 8. Facilitator Cheat Sheet: The Reality Deck

  Prepare 4 cards before the session. Keep them hidden.

  *   **Card 1 (World State Alpha):**
      *   If Policy A chosen: Metric = 30 (Disaster).
      *   If Policy B chosen: Metric = 85 (Success).
      *   *Use if:* Market prices A high and B low (Market is wrong).
  *   **Card 2 (World State Beta):**
      *   If Policy A chosen: Metric = 80 (Success).
      *   If Policy B chosen: Metric = 40 (Disaster).
      *   *Use if:* Market prices B high and A low (Market is right).
  *   **Card 3 (The Manipulation Trap):**
      *   If Policy A chosen: Metric = 60.
      *   If Policy B chosen: Metric = 90 (Using "Retained" rule) OR 40 (Using "All Users" rule).
      *   *Use this one ideally.* It highlights the metric wrinkle. If B wins, reveal the 90. Then ask: "Is 90 real if we ignored the churned users?"

  **Recommendation:** Use **Card 3**. It maximizes the debrief potential regarding the metric definition.
