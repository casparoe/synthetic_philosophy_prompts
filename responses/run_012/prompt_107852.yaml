answer: |-
  ### Brainstorm: Sources of the Impasse

  Before settling on your functional diagnosis, let's cast a wider net to ensure we aren't missing structural or historical causes for the stalemate.

  1.  **Essentialism vs. Cluster Concepts:** The debate may be stalled because participants assume science has an *essence* (necessary and sufficient conditions), whereas it may be a Wittgensteinian family resemblance concept. If the target is a cluster, counterexamples won't kill the criterion; they just show it's not a definition.
  2.  **The Context of Discovery vs. Justification:** Confusion over whether we are demarcating the *process* of generating ideas (psychology/sociology) or the *product* of validation (logic/evidence).
  3.  **The "Boundary Work" Factor:** Demarcation isn't just intellectual; it's political. Scientists use "science" to claim authority and funding. The impasse might persist because the stakes are too high to allow a definition that excludes powerful constituencies (e.g., economics, psychology).
  4.  **Temporal Asymmetry:** Criteria often work only in hindsight (Lakatos) but are demanded in real-time (courts). A criterion that identifies science *after* it succeeds is useless for policy *before* it succeeds.
  5.  **Disciplinary Variation:** Physics-centric criteria (prediction) fail in historical sciences (geology, evolutionary biology). The impasse may be a failure to recognize science as a plurality of methods rather than a singular method.

  Your hypothesis addresses #4 and #5 implicitly by distinguishing the *jobs*, but it adds a crucial pragmatic layer: the *purpose* of the definition determines its failure conditions. Let's test this.

  ---

  ### Assessment of the Three-Job Hypothesis

  Your diagnosis is robust. It aligns with the most sophisticated recent work on demarcation (e.g., Brigandt, Wilkenfeld) which suggests that "demarcation" is not a single problem but a family of problems. The stalemate arises because critics attack a criterion using the standards of Job A, while proponents defend it using the standards of Job B.

  Here is the mapping of major positions and objections onto your three jobs:

  #### 1. Popperian Falsificationism
  *   **Intended Job:** Primarily **Job 3 (Epistemic)**. Popper wanted to distinguish rational critical inquiry from dogmatic myth. He cared less about labeling geology "non-science" and more about ensuring theories risked error.
  *   **Received Job:** Treated as **Job 1 (Classificatory)**. Critics (and courts) use it to label Marxism or Psychoanalysis "non-science."
  *   **The Objection Mismatch:**
      *   *Duhem-Quine Thesis:* This attacks **Job 2 (Procedural)**. It shows a non-expert cannot apply the rule because hypotheses aren't tested in isolation. It doesn't necessarily refute Job 3 (one *should* try to falsify), but it makes Job 2 impossible.
      *   *Historical Sciences:* This attacks **Job 1**. Geology is "science" by practitioner consensus but doesn't make novel predictions. If the goal is Job 1, Popper fails. If the goal is Job 3, Popper can reply that historical sciences use different epistemic virtues (consilience) that still avoid dogma.
  *   **Diagnosis:** Popper fails Job 2, is often misapplied to Job 1, but retains traction in Job 3.

  #### 2. Kuhnian Normal Science
  *   **Intended Job:** **Job 1 (Classificatory/Descriptive)**. Kuhn described what communities *do*, not necessarily what they *ought* to do to track truth.
  *   **The Objection Mismatch:**
      *   *Relativism/Incommensurability:* This attacks **Job 3**. If paradigm shifts are non-rational (gestalt switches), then "science" loses its epistemic privilege. Critics treat Kuhn's description as a normative endorsement.
      *   *Creationism as Puzzle-Solving:* This attacks **Job 1**. If creationists solve puzzles within a paradigm, are they scientists? Kuhn would say "yes, sociologically," but Job 3 demands "no, epistemically."
  *   **Diagnosis:** Kuhn solves Job 1 but creates a crisis for Job 3. The impasse arises when critics demand Job 3 from a theory designed for Job 1.

  #### 3. Lakatosian Research Programmes
  *   **Intended Job:** **Job 3 (Epistemic Rationality)**. He wanted to show science is rational over time, even if individual steps aren't falsificationist.
  *   **The Objection Mismatch:**
      *   *Hindsight Bias:* This attacks **Job 2**. You can only identify a "degenerating" programme after the fact. It is useless for a school board deciding a curriculum today.
      *   *Historical Fit:* Attacks **Job 1**. Some "good" science looked degenerate at the time; some "bad" science looked progressive.
  *   **Diagnosis:** A sophisticated answer to Job 3 that explicitly surrenders Job 2.

  #### 4. Laudan's "The Demise of Demarcation"
  *   **Intended Job:** **Abolish Job 1, Prioritize Job 3**. Laudan argues that "science" is a honorific term (Job 1) that conflates with "reliable knowledge" (Job 3). We should stop worrying about the label and worry about the warrant.
  *   **The Objection Mismatch:**
      *   *Policy Necessity:* This attacks from the standpoint of **Job 2**. Courts *cannot* rule on "warranted assertibility" case-by-case without a heuristic boundary. They need a bright line (Job 1) to enforce policy (Job 2). Laudan's solution is philosophically sound but institutionally impossible.
  *   **Diagnosis:** Laudan correctly identifies that Job 1 is philosophically shallow, but underestimates the institutional necessity of Job 2.

  #### 5. The Daubert Standard (Legal Context)
  *   **Intended Job:** **Job 2 (Procedural/Policy)**. Judges need a checklist (testability, peer review, error rates) to gatekeep expert testimony.
  *   **The Objection Mismatch:**
      *   *Philosophical Critique:* Philosophers attack Daubert for failing **Job 3** (peer review isn't truth-tracking) or **Job 1** (it excludes valid but novel science).
      *   *Reality:* Daubert doesn't care about Job 1 or 3 in the abstract; it cares about liability and admissibility.
  *   **Diagnosis:** The legal system forces Job 2, demanding a simplicity that Job 3 cannot provide.

  ---

  ### Diagnosis of the Disagreement

  The disagreement is primarily **about what a criterion is for**, masked as a substantive disagreement about the nature of science.

  When a Popperian argues with a Kuhnian, they are often talking past each other. The Popperian is defending a normative ideal (Job 3: "Science *should* be risky"), while the Kuhnian is defending a historical description (Job 1: "Science *is* puzzle-solving"). When Laudan declares the problem dead, he means Job 1 is useless for Job 3. When a creationist demands equal time, they are exploiting the ambiguity between Job 1 (we have a community) and Job 3 (we have evidence).

  The impasse persists because participants refuse to declare which job they are playing. If you are doing Job 3, counterexamples from Job 1 (e.g., "but taxonomy is science and it's descriptive!") are irrelevant. If you are doing Job 2, sophisticated Job 3 criteria (e.g., "Bayesian updating") are useless because they aren't administrable.

  **However, your three-way division papers over a critical fourth dimension: The Political Economy of Credibility.**

  ### Critique of the Three-Way Division

  Your model assumes Job 1 is merely "matching what competent practitioners would say." This is too innocent. Job 1 is not just classification; it is **Boundary Work** (Gieryn).

  1.  **Job 1 is Constitutive, Not Descriptive:** Practitioners do not agree on what counts as science because the boundary is the site of struggle. Economists want to be "science" for funding reasons; climate scientists want to be "science" for policy authority. The impasse isn't just that we can't find a definition; it's that the definition *changes* based on who is asking. Your model treats Job 1 as a static target (practitioner intuition), but the target moves because the stakes change.
  2.  **Job 2 is Not Just "Non-Expert Application":** Job 2 isn't merely a simplified version of Job 3. It is a **legal-administrative** requirement that often contradicts Job 3. For example, Job 3 might require deep engagement with specific evidence, but Job 2 requires heuristics (e.g., "has it been peer-reviewed?"). The conflict here isn't just complexity; it's that Job 2 prioritizes *process* over *truth*, whereas Job 3 prioritizes *truth* over *process*.
  3.  **The Interdependence of 1 and 3:** You suggest Job 3 might condemn stretches of what we call science. But Job 3 (epistemic virtue) is often *inferred* from Job 1 (success). We think physics is epistemically virtuous *because* we classify it as science. Separating them is analytically useful, but historically, they are co-constituted. You cannot fully separate the normative from the classificatory because the classification confers the normative authority.

  ### What Counts as Progress?

  Given this diagnosis, progress will not come from a better definition. It will come from **contextualization** and **dimensionality**.

  1.  **Abandon Monothetic Criteria:** Progress requires admitting that no single necessary-and-sufficient condition exists. We should move to **polythetic criteria** (cluster concepts). A field is "scientific enough" for Job 2 (court admissibility) if it hits 4 out of 6 markers (testability, peer review, error rates, etc.), even if it misses "novel prediction."
  2.  **Explicitly State the Job:** A philosopher should not propose a demarcation criterion without stating: "This is for Job 3 (evaluating epistemic reliability)," or "This is for Job 2 (policy gatekeeping)."
      *   *Progress Example:* A criterion that explicitly says, "For the purpose of public school curricula (Job 2), we require institutional consensus (Job 1), even if this excludes frontier research (Job 3)."
  3.  **Shift from "Science vs. Non-Science" to "Reliable vs. Unreliable":** Follow Laudan's lead on Job 3. Stop asking "Is this science?" and ask "Is this claim warranted?" This dissolves the Job 1 impasse. However, acknowledge that Job 2 (law/policy) may still need the label "science" for statutory reasons.
  4.  **Formal Result:** A formal demonstration that **Job 2 is impossible to satisfy perfectly without violating Job 3.** If you can prove that any administrable rule (Job 2) will necessarily exclude some truth-tracking practices (Job 3) or include some dogmatic ones, you shift the burden. The debate then becomes a policy choice about error types (false positives vs. false negatives), not a metaphysical debate about the essence of science.

  **Conclusion:**
  Your hypothesis is correct that the impasse is functional. The debate is stalled because everyone is trying to use one tool for three different trades. However, you must add that the "classification" job is not neutral; it is a resource contest. Progress lies in decoupling the *epistemic* evaluation from the *sociological* label, while admitting that policy (Job 2) will always require a crude proxy for that label. The goal is not to solve demarcation, but to manage the trade-offs between these three jobs explicitly.
