          *   Popper: Aimed at 3, used for 1.
          *   Kuhn: Aimed at 1, threatens 3.
          *   Lakatos: Aimed at 3, fails at 2.
          *   Laudan: Rejects 1, prioritizes 3.
          *   Courts (Daubert): Desperate need for 2, rely on flawed 1.
      *   *Section 3: Diagnosing the Disagreement.* It's a category error. People argue about criteria when they should argue about *aims*.
      *   *Section 4: Critiquing the Division.* The "Political/Stakeholder" dimension is missing. Job 1 isn't neutral description; it's boundary work (Gieryn). Also, Job 2 might be a chimera.
      *   *Closing: Progress.* Progress = abandoning the search for a single criterion (monothetic) and adopting a "dimensional" or "cluster" approach tailored to the specific job (e.g., specific criteria for courts vs. funding). Or, admit Job 2 is impossible for philosophy to solve alone.

  8.  **Refining the Tone:**
      *   Must sound like a colleague/philosopher of science.
      *   Rigorous, analytical, not dismissive.
      *   Avoid generic summaries. Focus on the *logic* of the moves.

  9.  **Self-Correction/Check during drafting:**
      *   *Did I open with a brainstorm?* Yes.
      *   *Did I map positions to the 3 jobs?* Yes.
      *   *Did I critique the 3-job model?* Yes (missing political/boundary work aspect).
      *   *Did I say what counts as progress?* Yes (dimensional approach/contextualism).
      *   *Is it too long?* Keep it tight.
      *   *Did I avoid reading lists?* Yes.

  10. **Final Polish:** Ensure the distinction between "epistemic" and "sociological" is clear in the critique of the user's model. Ensure the "Daubert" example is used for Job 2. Ensure Laudan is central to the critique of Job 1.

  *(Self-Correction on the Brainstorm)*: Make sure the brainstorm is distinct from the main assessment. It needs to be a "short brainstorm of possible sources of an impasse... before you commit to a diagnosis."

  *(Self-Correction on the Critique)*: The user's Job 1 says "matches what competent practitioners would say." I need to point out that practitioners disagree and their say-so is influenced by prestige, not just method. This is the "Boundary Work" critique (Gieryn).

  *(Self-Correction on Progress)*: Suggest that progress looks like *contextual demarcation* rather than *general demarcation*.

