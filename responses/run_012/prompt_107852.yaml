prompt: |-
  You are a philosopher of science who knows both the demarcation literature and its critics well. Think carefully, and open with a short brainstorm of the possible sources of an impasse in a debate like this one before you commit to a diagnosis.

  I am preparing a seminar on the demarcation problem and keep hitting the same wall. The debate seems to me stalled in a particular way: each proposed criterion — falsifiability, puzzle-solving within a paradigm, novel prediction by a research programme, a community's institutional norms — is refuted by a counterexample drawn from a different kind of case, and the counterexample is then treated as decisive. Falsificationists point to a doctrine that can absorb any observation; critics point to the historical sciences, to theories whose central commitments are shielded by auxiliary hypotheses, or to respectable programmes that make no risky predictions. Nobody moves.

  My hypothesis, which I want you to test rather than assume, is that the impasse is largely an artifact of three different jobs being run together under one heading: (1) sorting a finished body of work into science and non-science in a way that matches what competent practitioners would say; (2) supplying a procedure a non-expert — a court, a school board, a journalist — can apply to a live, contested claim; and (3) saying what a practice must do to be a good way of finding out about the world, even if the criterion condemns stretches of what we call science and matches no practitioner's classifications. Falsificationism, on this reading, is a poor answer to (1) and (2) and a substantive answer to (3); the classical counterexamples aim at (1); and the conclusion that the problem is a pseudo-problem follows only if (1) was the job all along.

  Assess this. For each major position and each standard objection, say which of the three jobs it is really addressing, and then diagnose the disagreement itself: is it substantive, is it about what a criterion is for, or are several parties answering different questions under one name? Close with what would count as progress — a distinction, a change of question, a formal result — or an argument that none should be expected. Engage the actual moves rather than surveying the field, and say where my three-way division itself papers over a real disagreement. No reading list; I want the diagnosis and the reasons for it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of science (expert in demarcation literature and its critics).
      *   **Task:** Assess the user's hypothesis about the "impasse" in the demarcation debate.
      *   **User's Hypothesis:** The stalemate is due to conflating three distinct jobs:
          1.  *Descriptive/Classificatory:* Sorting finished work to match practitioner intuition (Science vs. Non-Science).
          2.  *Procedural/Policy:* A tool for non-experts (courts, schools) to judge live claims.
          3.  *Normative/Epistemic:* Defining what makes a practice good for finding truth (even if it excludes "science" or includes "non-science").
      *   **Requirements:**
          *   Open with a short brainstorm of possible sources of impasse.
          *   Assess the hypothesis by mapping major positions/objections to the three jobs.
          *   Diagnose the nature of the disagreement (substantive, purpose, or talking past each other).
          *   Close with what would count as progress (or why none is expected).
          *   Critique the user's three-way division (where it papers over real disagreement).
          *   Engage actual moves, not just survey the field.
          *   No reading list.

  2.  **Initial Brainstorming (Sources of Impasse):**
      *   *Why is demarcation stuck?*
      *   *Essentialism vs. Family Resemblance:* Are we looking for necessary and sufficient conditions (Popper) or a cluster concept (Wittgenstein/Kuhn)?
      *   *Historical vs. Logical:* Are we analyzing logic of justification (Reichenbach) or history of discovery/change (Kuhn/Lakatos)?
      *   *Social vs. Epistemic:* Is science defined by method (Merton) or social structure (SSK)?
      *   *The "Death of Demarcation":* Laudan's claim that it's a pseudo-problem because no criterion works.
      *   *The "New Demarcation":* Recent attempts (e.g., Pigliucci, Boudry) to revive it for policy reasons (climate change, creationism).
      *   *Context Sensitivity:* The criteria might work differently in physics vs. psychology vs. history.
      *   *The User's Angle:* The conflation of *goals* (classification vs. policy vs. epistemic virtue). This is a pragmatic/functional diagnosis.

  3.  **Evaluating the User's Hypothesis (The Three Jobs):**
      *   *Job 1 (Descriptive/Classificatory):* Matching intuition. Laudan attacks this. Kuhn attacks this (normal science isn't always "scientific" in a high-epistemic sense).
      *   *Job 2 (Procedural/Policy):* Daubert standard, court cases. This needs clear boundaries, which philosophy struggles to provide.
      *   *Job 3 (Normative/Epistemic):* Reliabilism, truth-tracking. This might label some "science" as bad and some "philosophy" as good.
      *   *Assessment:* This is a strong, pragmatic diagnosis. It aligns with recent "functionalist" turns in demarcation (e.g., Brigandt, Wilkenfeld). However, it might oversimplify the *normative* weight of Job 1. Practitioners care about status/funding, not just epistemic virtue.

  4.  **Mapping Positions to the Three Jobs:**
      *   *Popper (Falsificationism):*
          *   Intended: Job 3 (Epistemic virtue - bold conjectures).
          *   Received as: Job 1 (Is Marxism science? No.).
          *   Objection (Duhem-Quine): Attacks Job 2/3 (you can't actually apply this procedure).
          *   Objection (Historical Sciences): Attacks Job 1 (Geology is science but doesn't predict).
      *   *Kuhn (Paradigms/Puzzle-solving):*
          *   Intended: Job 1 (Describing what scientists *do*).
          *   Objection (Incommensurability/Relativism): Attacks Job 3 (If paradigms shift arbitrarily, is it truth-tracking?).
      *   *Lakatos (Research Programmes):*
          *   Intended: Job 3 (Rational reconstruction of progress).
          *   Objection (Hindsight bias): Attacks Job 2 (Can't use in real-time).
      *   *Laudan (The Demise):*
          *   Claim: Job 1 is impossible/unnecessary. Job 3 is what matters (warranted assertibility).
          *   Critique: Ignores Job 2 (Policy needs boundaries).
      *   *SSK/Sociologists:*
          *   Focus: Job 1 (as a social boundary-making activity), often denying Job 3 (epistemic privilege).

  5.  **Diagnosing the Disagreement:**
      *   Is it substantive? Yes, about the nature of scientific rationality.
      *   Is it about purpose? Yes, largely. Popper wanted to save science from dogma (Job 3/2). Kuhn wanted to describe history (Job 1). Courts want rules (Job 2).
      *   Talking past each other? Yes. When Laudan says "demarcation is dead," he means Job 1 is useless for Job 3. When a judge asks for demarcation, they need Job 2.

  6.  **Critiquing the User's Three-Way Division:**
      *   *Where does it fail?*
      *   *Job 1 vs. Job 3:* Practitioners' intuitions (Job 1) are often *based* on perceived epistemic success (Job 3). Separating them might be artificial.
      *   *The Political Economy:* Job 1 isn't just "matching intuition"; it's about resources, prestige, and authority. The user's division misses the *political* stake in demarcation (who gets funding?).
      *   *Job 2's Impossibility:* Job 2 might be impossible *because* Job 3 is complex. It's not just a different job; it's a job that demands a simplification of Job 3 that breaks it.
      *   *The "Family Resemblance" Alternative:* Maybe the problem isn't 3 jobs, but the assumption that *any* definition must be monothetic (necessary/sufficient) rather than polythetic.

  7.  **Drafting the Response (Iterative refinement):**
