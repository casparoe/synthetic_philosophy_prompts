      *   *Close Reading:* Stick to the provided text.
      *   *The "Something Else":* Highlight the *compatibility* issue. The ancients accepted individual subjection. Constant implies moderns shouldn't accept collective subjection, but also shouldn't ignore collective rights entirely (though the latter is outside the specific quoted text, the tension is there).
      *   *Refining the Non-Domination point:* Be careful. Pettit is 20th century. Constant is 19th. But the *concept* of arbitrariness is key. If the law is arbitrary, is it still "the laws"? Constant implies "laws" = non-arbitrary rules. So being subject to law is being subject to non-arbitrary rules. This aligns with non-domination (status of not being subject to another's whim).

