answer: |-
  At a compliance firm, employees must file a daily weather report. Line one states the weather. Line two states the employee's belief about the weather. A new software system is installed to reject any report that is logically contradictory.

  Dave submits a report: "It is raining. I do not believe it is raining."

  The system rejects it.

  Dave protests, "But it's true! I haven't looked out the window!"

  His boss says, "Then change line two to: I believe it is raining."

  Dave says, "But I can't write that! I don't believe it!"

  The boss sighs, "You did when you wrote line one."
