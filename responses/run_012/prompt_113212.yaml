  **The candidate rules**

  Two candidate rules explain the track record. First, the **Rule of Empirical Recurrence**: Inferences are warranted only when supported by repeated patterns across multiple independent contexts. This approves the weights (dozens of households), ash (several settlements), and uniformity (cemetery-wide data points). It rejects the single figurine and the single-house vessel deposit. It fits the aniconic religion case awkwardly; absence across a site is widespread but negative, requiring a stipulation that absence never counts as recurrence. It also struggles with Case 4, where multiple vessels were present but in one context; the rule must specify that contexts, not artifacts, must multiply.

  Second, the **Rule of Secular Utility**: Inferences regarding economic, catastrophic, or demographic systems are warranted; inferences regarding specific theological beliefs or ritual intents are rejected. This cleanly approves weights (economic), ash (catastrophe), and uniformity (demographic). It rejects the goddess (theological), vessel concealment (ritual intent), and aniconic religion (theological). This rule handles the aniconic case more comfortably than the Recurrence rule, as it categorically bars religious doctrine regardless of evidence scale. However, it fits Case 5 (inequality) less comfortably, as social stratification borders on ideology. Both rules account for all six verdicts, but they prioritize different virtues: statistical robustness versus subject matter neutrality. The Recurrence rule demands quantity; the Secular rule demands functional causality. Together, they reveal a board skeptical of singular claims and spiritual interpretations.

  **Predictions for the new case**

  Both candidate rules predict a **Rejection** of the proposed inference, though for different reasons. Under the Rule of Empirical Recurrence, the evidence is insufficiently distributed. While there are multiple figurines, they come from a single burned house. Unlike the weights or ash layers, this pattern is not replicated across dozens of households or settlements. The correlation with bone proportions is internal to one context, failing the multiplicity threshold required to generalize behavior.

  Under the Rule of Secular Utility, the verdict is rejected based on the inference's content. The excavators propose a "ritual intended to protect," which is explicitly theological. Regardless of the wear patterns or bone correlations, the board rejects claims about belief systems and ritual intents, as seen in the figurine goddess and vessel concealment cases. The wear indicates use, but not necessarily ritual function versus toy or tool.

  The rules agree on the outcome but diverge on the rationale. The Recurrence rule leaves open the possibility that if these figurines were found in fifty houses, the inference might pass. The Secular Utility rule closes that door entirely; even widespread evidence would not warrant a publication claiming specific ritual intent. This convergence suggests a high barrier for the excavators, but the underlying justification determines the board's future scope.

  **My verdict and reasoning**

  The board will likely **Reject** the inference, guided primarily by the **Rule of Secular Utility**. While empirical recurrence is clearly valued (Case 1 vs. Case 2), the decisive factor is the subject matter. Case 6 is the critical evidence: the claim of an aniconic religion covered an entire site (implying broad evidence), yet it was rejected. The Recurrence rule struggles here, as site-wide absence is statistically significant. The Secular rule explains this perfectly: it was a religious claim.

  Similarly, Case 4 (vessel concealment) was rejected despite potentially multiple vessels, because the inference was ritualistic. The new case mirrors Case 2 and Case 4: it posits a specific belief system (protection ritual) based on ambiguous material (figurines). By ruling against this, the board commits itself to methodological agnosticism. It signals that archaeology may publish on economies, disasters, and social stratification, but not on belief. This protects the authority from speculative theology but risks silencing a key aspect of past human experience. The board prioritizes defensible materialism over interpretive richness, ensuring publications remain within the bounds of physical causality rather than reconstructed intent. This maintains public trust in scientific rigor but narrows the historical narrative. It implies that public display should reflect only what can be physically proven, excluding the spiritual lives of ancestors unless explicitly documented, effectively secularizing the heritage presented to the community.

  **The case that would settle it**

  To distinguish these rules, the board needs a case involving **mass ritual evidence**. Consider: Identical ritual altars found in every house across fifty settlements, with proposed inference of a shared household cult.

  The **Recurrence Rule** predicts **Approval**. The evidence meets the quantitative threshold of multiple independent contexts, satisfying the requirement for statistical robustness. It treats religion as a systemic behavior like measurement.

  The **Secular Utility Rule** predicts **Rejection**. Despite the abundance of evidence, the inference concerns religious practice and belief, which remains categorically barred.

  This case is decisive because it isolates the variable of subject matter from the variable of evidence quantity. If the board approves, quantity trumps topic. If they reject, topic trumps quantity, confirming the Secular Utility rule as the governing principle. It forces the board to choose between consistency in evidence standards or consistency in subject matter restrictions.
