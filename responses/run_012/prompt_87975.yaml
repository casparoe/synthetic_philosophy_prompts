  **The setup**
  You are a governing council for a new colony. You have five advisors (constituency cards). Each advisor represents a distinct moral intuition about what matters. Each has a "Stake" (1–10) indicating how intensely they feel about violations of their view. You have four policy proposals. Your goal is not to find the "true" morality, but to select a policy using four different counting protocols.

  Split into three tables of six. Each table gets the same deck. You will run four rounds. In each round, you must calculate a winner using a specific protocol provided by the facilitator. Do not debate the truth of the advisors' claims; treat them as fixed inputs. Debate only the calculation and the trade-offs.

  Materials: 5 constituency cards, 4 policy cards, score sheets, pens. Print everything.

  By the end, you should feel frustration that the "right" policy vanishes when the counting rule changes. You should feel the weight of the meta-rule doing more work than the moral views themselves. Keep the protocol names secret until the end.

  **The rules**
  **Constituency Cards:** Print 5 cards. Give each a one-line view (e.g., "Suffering is the only sin," "Rights must never be violated," "Future lives count most"). Assign Stake numbers: two cards get Stake 10, three cards get Stake 2. **Crucial:** Make two views unfamiliar (e.g., "Minimize genetic drift" or "Maximize aesthetic complexity") so participants cannot rely on prior philosophical knowledge.

  **Policy Cards:** Print 4 cards (e.g., "Ban Animal Agriculture," "Open Borders," "Maximize Growth," "Wild Animal Relief").

  **Impact Matrix:** On the back of Policy cards, list the impact score (-10 to +10) for each Constituency. *Crucial:* Pre-calculate these numbers so the winner flips.
  *   **Policy A:** Great for Low-Stake views, terrible for one High-Stake. (Wins Round 1: Plain Sum)
  *   **Policy B:** Moderate for everyone, avoids negatives. (Wins Round 3: Maximin)
  *   **Policy C:** Great for High-Stake views, ignores Low-Stake. (Wins Round 2: Weighted Sum)
  *   **Policy D:** Mixed bag requiring trade-offs. (Wins Round 4: Bargaining)

  **The Rounds:**
  1.  **Protocol Alpha:** Sum the raw impact scores. Highest wins.
  2.  **Protocol Beta:** Multiply impact by Constituency Stake. Sum results. Highest wins.
  3.  **Protocol Gamma:** Identify the lowest score any Constituency receives. Policy with the highest "lowest score" wins.
  4.  **Protocol Delta:** 10 minutes of open negotiation. Constituencies can trade support across policies. Table must unanimously agree on a winner.

  **Facilitator Script:** "Calculate the winner for Protocol Alpha. Report back. Do not discuss why the view is true, only how the numbers sum." Reveal the next protocol only after the previous winner is locked. Do not name the protocols (Utilitarianism, etc.) yet.

  **What goes wrong the first time**
  Participants will argue about the validity of the Constituency Cards ("Suffering isn't the only sin!"). Interrupt immediately: "Treat the card as a fixed constraint, like gravity." They will try to game the Bargaining Round by forming permanent coalitions that ignore the stakes. Remind them concessions must be explicit. Math errors will slow you down. Assign one person per table as "Calculator" to enforce speed. If a table finishes early, do not let them discuss the philosophy; have them verify the calculation. The goal is procedural friction, not philosophical consensus. If they agree too easily, the matrix isn't conflicting enough.

  **The debrief**
  Reveal the mapping. Constituencies are moral theories (Utilitarianism, Deontology, etc.). Protocols are meta-ethical rules (Expectationalism, Stake-weighting, Maximin, Negotiation). Ask: "Did the best policy change?" Yes. This proves the meta-rule dictates the action more than the object-level theories.

  **The Missing Feature:** The game assumes we know the "Stake" and "Impact" numbers. In reality, we don't know how to compare utility across theories (intertheoretic comparison). We don't know if one unit of "Rights violation" equals one unit of "Suffering." The game hides this normalization problem behind the printed numbers. You must supply this caveat: real moral uncertainty is harder because we don't even know the inputs, let alone the combining rule. The game solves the math to highlight the meta-ethics; reality leaves you with both unsolved.
