      *   Idea: Perhaps knowing $p$ doesn't mean you know the evidence is *misleading* in a way that allows dismissal, but rather that the evidence is *inert* relative to your current justification? Or maybe the user means that just because evidence *would* be misleading if $p$ is true, doesn't mean you can treat it as such *before* checking it.
      *   Club's pushback: "Merely renames the problem." This suggests they think the distinction doesn't solve the normative issue of whether one *can* ignore the evidence.

  4.  **Diagnose the Stalemate:**
