      *   **Different Questions:** One side might be focusing on the *metaphysics* of knowledge (what knowledge *is*), while the other focuses on the *norms* of inquiry (what we *should do*). The paradox bridges these: "If I know, what am I permitted to do?"
      *   **Hidden Question:** The closure principle. Does knowledge close under known implication? Specifically, do I know *now* that the future evidence is misleading? Or do I only know conditionally? This is the "defeasibility" issue. Knowledge might be defeasible. If new evidence comes in, do I still know?
