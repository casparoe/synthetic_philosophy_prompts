      *   Hidden question: Is knowledge a state that insulates you from future rational requirements? (The "diachronic" vs. "synchronic" issue).
      *   Progress: Needs a model of defeasibility. A counterexample where ignoring evidence leads to loss of knowledge despite the proposition being true.

