      *   Premise 1: Knowledge entails truth (If $S$ knows $p$, then $p$ is true).
      *   Premise 2: If $p$ is true, evidence against $p$ is misleading (false or misleading).
      *   Premise 3: If $S$ knows $p$, $S$ knows that evidence against $p$ is misleading (Closure principle).
      *   Conclusion: $S$ is entitled to ignore evidence against $p$.
      *   Intuition: This conclusion seems epistemically irresponsible (dogmatic).

