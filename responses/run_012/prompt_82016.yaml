  6.  **Refining the Argument:**
      *   The stalemate exists because the group is oscillating between the *fact* of knowledge and the *process* of maintaining it.
      *   The verbal dispute: "Evidence." If evidence is factive (only true propositions count), there is no evidence against a known truth. If it's non-factive (appearances), then there is. The paradox usually assumes non-factive evidence but treats it as if the agent knows it's false.
