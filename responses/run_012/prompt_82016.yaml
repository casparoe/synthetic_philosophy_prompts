      Your philosophy club has encountered one of the most persistent and fertile problems in contemporary epistemology, and the fact that you have stalled is a sign of progress rather than failure because it indicates you have reached the core tension rather than skirting around it. The dispute has likely stalled because your group is simultaneously grappling with a verbal ambiguity regarding the term evidence and a substantive disagreement about the structure of justification, but the primary engine of the deadlock is that the two sides are answering different questions about the temporal nature of knowledge. When one side argues that your distinction between misleading and inert evidence is the key, they are focusing on the metaphysical status of the counterevidence given that the proposition is known to be true, whereas the side claiming you are merely renaming the problem is focusing on the normative permissions available to the agent before that status is confirmed. This means you are talking past one another because one group is describing the world from a God's eye view where the truth is already settled, while the other is describing the perspective of the agent who must still navigate the process of inquiry.

      The verbal dispute lies in how you define evidence, specifically whether evidence must be factive, meaning it consists only of true propositions, or whether it includes apparent evidence that might turn out to be false. If evidence is factive, there can be no evidence against a known truth, and the paradox dissolves immediately, but this makes the concept of evidence too narrow for practical use. If evidence is non-factive, then apparent counterevidence exists, and the paradox gains traction. However, the deeper substantive disagreement concerns the principle of epistemic closure, which is the hidden formal question doing the work in your discussion. This principle suggests that if you know a proposition and you know that it entails another proposition, then you know the entailment. The paradox relies on a strong version of closure that assumes if you know $p$, you automatically know all the consequences of $p$, including the falsity of any counterevidence. The side that thinks your distinction renames the problem likely suspects that knowledge does not grant this kind of immediate access to the status of future evidence, implying that knowledge is defeasible, meaning it can be lost or undermined even if the proposition remains true.

      Your proposal to distinguish between misleading and epistemically inert evidence is a sophisticated move that attempts to carve out a space where counterevidence exists but does not threaten knowledge, yet the stalemate persists because this distinction does not fully address the diachronic element of the problem. The paradox forces you to ignore evidence without examining it, but your distinction only clarifies what the evidence is after the fact. The club members who remain unsatisfied are correctly pointing out that knowing the evidence is inert or misleading requires you to already have resolved the conflict, which is exactly what the paradox claims you can skip. Therefore, the disagreement is not just about what evidence is, but about whether the state of knowing provides an exemption from the usual rules of rational inquiry. One side believes knowledge creates a shield that makes examination unnecessary, while the other believes knowledge is a state that must be maintained through continued responsiveness to evidence.

      To move forward, you need to identify that the hidden question driving the debate is whether knowledge is immune to defeat by new information. Progress will not come from simply defining terms differently but from constructing a model of knowledge that accounts for defeasibility. A successful resolution would involve a counterexample or a thought experiment where an agent knows a proposition, encounters apparent counterevidence, ignores it based on their knowledge, and subsequently loses knowledge despite the proposition remaining true. This would demonstrate that the permission to ignore evidence is not entailed by knowledge itself. Alternatively, progress could be made by revising the paradox to distinguish between knowing that evidence is misleading and being permitted to act as if it is misleading without verification. If your club can agree that knowledge entails truth but not necessarily insulation from rational scrutiny, you will have dissolved the dogmatic conclusion without sacrificing the core premises. Until you address the conditional nature of justification and the limits of closure, the dispute will remain a cycle of restating the problem in different vocabulary, so the most productive path is to test whether ignoring evidence ever practically undermines the very knowledge that supposedly justified ignoring it.

