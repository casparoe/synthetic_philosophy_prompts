answer: |-
  Where the difficulty actually lies
  The mismatch isn't merely empirical; it is categorical. Welfare law requires binary statuses to function, while consciousness likely varies continuously or clusters discontinuously across taxa. The supply side offers theory-laden markers that dissociate, creating false precision—lawyers get numbers they cannot interpret. Funding empirical markers without resolving the conceptual architecture yields policy built on sand. The foundation should not fund work pretending to solve the empirical gap, but work that clarifies how to act given the gap. The priority is not finding the line, but defining what the line *is* and whether it exists. If consciousness is indeterminate, the law must assign status pragmatically; if determinate, it must discover it. This metaphysical question dictates the legal strategy. Therefore, the agenda must prioritize conceptual clarity over evidentiary accumulation. We must fund the architecture that makes the evidence intelligible, not the evidence itself. The risk is producing theory too abstract for policy, but the greater risk is policy built on conceptual confusion.

  The agenda
  1. **The Target:** Define the ethical criterion. Is it phenomenal consciousness, sentience, or simply "states that matter"? This is the most upstream question. If the colleague is right that "consciousness" is metaphysical baggage, focusing on it wastes resources. Philosophers can analyze the normative weight of different mental states without new data. This is neglected because most assume the target is fixed. If we fund this, we ensure the subsequent work addresses what actually matters morally, not just what is theoretically trendy. This question clarifies whether we are protecting experience or capacity.

  2. **Determinacy:** Once the target is fixed, is there a fact of the matter about its distribution? Or are borderline cases ontologically unsettled? This dictates whether law discovers or assigns status. Philosophers can analyze vagueness and ontic indeterminacy using tools from metaphysics and logic. This is highly neglected in welfare contexts, which assume binary facts exist. If there is no fact of the matter, the demand for a "verdict" is a category error. This work tells legislators whether they are drawing maps or drawing boundaries.

  3. **Marker Calibration:** How do we validate markers without circular reliance on human report? Philosophers can analyze the logic of inference, analogy, and structural similarity. This is tractable conceptually even without new experiments. It is less neglected but currently muddled. We need to know if cross-species inference is even coherent before trusting existing data. This bridges the gap between the metaphysical target and the empirical evidence we already have.

  *Backup:* **The Cluster Problem.** If capacities dissociate, which counts? This depends on The Target. It is secondary because dissociation only matters once we know which capacities are relevant to the Target. Fund this only if the first three stall.

  Why this order
  Upstreamness is the primary criterion. You cannot calibrate markers (3) for a target (1) you haven't defined, nor decide if borderline cases are facts or decisions (2) without knowing what property is distributed. Tractability favors this order: philosophers are best suited to analyze concepts (Target) and metaphysics (Determinacy) rather than empirical validation (Calibration), though all are conceptual. Neglectedness also aligns; marker validation is crowded, while the metaphysics of animal status is sparse. The trade-off is delaying empirical guidance, but bad empirical guidance is worse. Testability is excluded from the top three because knowing *what* is testable depends on defining *what* is being tested. If we fund Testability first, we risk testing the wrong thing. The dependency chain is strict: Target determines Determinacy, which determines Calibration. Breaking this order funds solutions to problems that may not exist. Furthermore, this order respects the limitation of no new experiments; these questions can be advanced via armchair analysis of existing commitments, whereas Testability often demands experimental design.

  What would change the ranking
  If a specific theory of consciousness (e.g., IIT) achieves near-universal acceptance among theorists, The Target becomes settled, moving Determinacy to first. If legal frameworks universally adopt the Precautionary Principle, Determinacy drops in urgency because the law acts regardless of facts, protecting the uncertain. If philosophers demonstrate that "states that matter" collapses back into standard phenomenal consciousness, The Target becomes less urgent. Evidence of radical dissociation in capacities might elevate The Cluster Problem to replace Marker Calibration. Conversely, if neuroscientists develop a universally accepted marker independent of behavior, Marker Calibration becomes trivial and drops out. Finally, if it is proven that no theory of consciousness is testable in principle, Testability becomes the primary question, superseding all others, as the enterprise would be deemed scientifically vacuous.

  Where this is most likely wrong
  The risk is over-intellectualizing a pragmatic crisis. Law may need actionable heuristics now, not metaphysical precision. If "states that matter" proves too vague to operationalize compared to "consciousness," the first question fails. Additionally, assuming philosophers can resolve Determinacy without empirical input may be optimistic; the metaphysics might depend on neural details we lack. If the policy window closes before this theoretical work matures, the fellowships will have produced elegant irrelevance. The foundation might be better served funding the Cluster Problem, which offers more immediate guidance on interpreting existing data, even if it is less philosophically fundamental.
