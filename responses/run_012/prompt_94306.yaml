  # Newcomb Diagnostic Tree

  **Root: Standard Newcomb Problem**  
  *Predictor is 99% reliable. Boxes are opaque. Do you take only Box B (1B) or both (2B)?*

  ### **BRANCH A: Two-Box (2B)**
  *You prioritize causal dominance over correlation.*
  → **Node 2: Source Code Variant**  
  *Predictor reads your actual source code before filling boxes. Do you switch to 1B?*
  *   **No (2B):** **Causal Decision Theory (CDT)**  
      *Hardest Commitment:* Accepting that you will systematically lose to predictors despite knowing the correlation.
  *   **Yes (1B):** **Functional Decision Theory (FDT) [Converted]**  
      *Hardest Commitment:* Accepting that your decision algorithm determines the past prediction without backward causation.

  ### **BRANCH B: One-Box (1B)**
  *You prioritize expected utility or logical correlation.*
  → **Node 3: Transparent Boxes Variant**  
  *Boxes are glass. You see $1M in Box B. Do you still take only Box B?*
  *   **No (2B):** **Timeless/Functional Decision Theory (TDT/FDT)**  
      *Hardest Commitment:* Accepting that once evidence is observed, you cannot influence the past prediction even via logical correlation.
      → *(Diagnostic Note: To split TDT from FDT here, ask the **Perfect Copy** variant. If you 1B because the copy is identical code, **FDT**. If you 1B because the copy is a reliable simulation, **TDT**. This tree treats them as a single leaf due to overlapping predictions.)*
  *   **Yes (1B):** **Updateless/Evidential Cluster**  
      *You maintain commitment despite visible evidence.*
      → **Node 4: Stranger Payoff Variant**  
      *Prediction based on you, but money goes to a stranger you value equally. Do you 1B?*
      *   **No (2B):** **Evidential Decision Theory (EDT)**  
          *Hardest Commitment:* Accepting that your action is merely evidence of the outcome, not a cause, even when self-interest is removed.
      *   **Yes (1B):** **Updateless Decision Theory (UDT) Cluster**  
          *You maximize policy output across scenarios.*
          → **Node 5: 60% Reliable Variant**  
          *Predictor is only 60% reliable. Do you still 1B?*
          *   **No (2B):** **Hybrid (Risk-Threshold UDT)**  
              *Hardest Commitment:* Accepting that your commitment to rational policy is conditional on environmental stability.
          *   **Yes (1B):** **Updateless Decision Theory (UDT)**  
              *Hardest Commitment:* Accepting that you must ignore current sensory evidence (transparency) to uphold a prior optimal policy.

  ---

  ### **Diagnostic Flags & Notes**

  **Indistinguishable Leaves:**
  *   **TDT vs. FDT:** This tree groups them at Node 3. Both 2B on Transparent Newcomb (updating on evidence) and 1B on Copy/Source Code variants. Separation requires nuanced questions about whether the predictor simulates *you* (TDT) or runs *your code* (FDT).
  *   **EDT vs. UDT:** Both 1B on Transparent Boxes. Separation relies on the Stranger Payoff (Node 4). EDT may 2B if the evidential link between *your* action and *stranger's* payoff feels weaker; UDT 1Bs because the policy is universal.

  **Unoccupied/Incoherent Combinations:**
  *   **Standard 2B + Source Code 1B:** Rare. Indicates a CDT agent convinced by logical determinism but unwilling to 1B on opaque boxes (inconsistent risk/profile). *Diagnosis: Unstable transition state.*
  *   **Standard 1B + Transparent 2B + Copy 2B:** Theoretically possible but practically empty. If you 1B Standard for logical reasons, you should 1B Copy. 2Bing Copy implies you reject logical correlation entirely, which contradicts Standard 1B. *Diagnosis: Incoherent.*
  *   **Standard 1B + Transparent 1B + Stranger 2B:** The classic EDT position. Occupied, but often unstable upon reflection on logical identity. *Diagnosis: Attractive but fragile.*

  **Usage:** Walk the participant through the nodes. Their path reveals their operational theory, regardless of the label they claim.
