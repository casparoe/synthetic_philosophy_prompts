prompt: |-
  I'm the volunteer treasurer of a small nonprofit and I also sit on my town's capital projects committee, so a few times a year I'm in a room voting on whether to keep paying for something that's already half-built, over budget and unpopular. The words 'sunk cost' get thrown around at our meetings but they're useless in practice, because the people who want to keep going always have real arguments — we'd be throwing away what we've spent, we'd look incompetent, the contractor would walk, and half the money is committed for next year anyway. What set me off: at our fundraiser we auctioned a mystery box where the top two bidders both had to pay — winner gets the box, runner-up gets nothing — and two people bid each other up for ages until the winner paid about five times what the box was worth and the loser paid nearly as much for nothing. Watching them, it's definately the same shape as our pool fight, just faster.

  Act as an expert on decision-making under commitment problems — someone who actually knows the theory of escalation of commitment and of auctions where the losers also pay — and help me build a procedure I can run live in a 45-minute meeting with no spreadsheet and no analyst. Think it through step by step, and start by brainstorming the different ways continuing can be genuinely rational versus just stubborn, because I suspect I've been swinging 'sunk cost' like a hammer and sometimes voting to kill things that were worth finishing.

  What I want: a short ordered list of questions to ask about any 'should we keep funding this' proposal, what a good answer to each looks like, and where the list stops with a no; an entry test for before a project starts or before I raise my own paddle, since I suspect most of the damage is done at that moment; and the places where the procedure hands the decision to a human because it's politics or values rather than arithmetic. Then run it on three cases: the pool (70% done, 40% over budget, genuinely worth having when finished, but we've cut everything else to pay for it), a charity-auction bidding war over a weekend cabin stay where both top bidders pay, and our org's half-finished custom donor database where the vendor keeps asking for one more payment.

  Two things it has to handle honestly. Sometimes continuing really is right and the mistake was upstream, so I don't want a rule that mechanically says quit. And sometimes being known as someone who never backs down is worth real money, so I don't want to be talked out of that either. Tell me what the procedure can't do, and where it'll give me an answer I won't like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Volunteer treasurer of a small nonprofit, member of a town capital projects committee.
      *   **Problem:** Struggles with "sunk cost fallacy" vs. rational continuation in high-stakes, politically charged environments (town projects, nonprofit fundraising/vendor issues). Feels the term "sunk cost" is used as a blunt instrument but doesn't address real-world constraints (contracts, reputation, committed funds).
      *   **Observation:** Noticed a parallel between the town's "half-built pool" debate and a "all-pay auction" fundraiser (winner and runner-up both pay). Recognizes this as *escalation of commitment* and *war of attrition/all-pay auction* dynamics.
      *   **Goal:** A practical, 45-minute meeting procedure (no spreadsheets/analysts) to decide whether to continue funding a troubled project.
      *   **Specific Requirements:**
          1.  Brainstorm rational vs. stubborn reasons to continue.
          2.  Ordered list of questions for the "Continue/Kill" decision (with good answers and stop conditions).
          3.  Entry test (pre-commitment).
          4.  Identification of political/value judgments (where math stops).
          5.  Application to three cases: The Pool, The Auction, The Donor Database.
          6.  Honest assessment of limitations (what the procedure can't do, unpopular answers).
      *   **Tone:** Expert on decision-making under commitment problems (escalation of commitment, auction theory), practical, nuanced, not dogmatic.

  2.  **Deconstruct the Theory:**
      *   **Sunk Cost Fallacy:** Ignoring past costs that cannot be recovered. *Correction:* Only future costs and future benefits matter.
      *   **Escalation of Commitment:** Continuing a failing course of action due to psychological, social, or structural pressures.
      *   **All-Pay Auction / War of Attrition:** Bidders pay regardless of winning. This drives bids *above* value. The town project feels like this because political capital and reputation are "bid" regardless of the outcome.
      *   **Rational Continuation:** Sometimes finishing is cheaper than stopping (contract penalties), or the asset has high strategic value despite overruns (completion bias is sometimes useful if the asset is vital).
      *   **Reputation/Signaling:** Sometimes "never backing down" has value (deterring future contractors from bluffing, maintaining donor confidence). This is a *strategic* cost/benefit, not a sunk cost.

  3.  **Drafting the Procedure (The "45-Minute Protocol"):**
      *   Needs to be simple enough for a live meeting.
      *   Needs to separate *past* from *future*.
      *   Needs to account for *reputation* without letting it hijack the math.
      *   *Step 1: The Baseline.* What do we have *now*? (Scrap value).
      *   *Step 2: The Completion Cost.* What exactly is needed to finish? (Not estimates, commitments).
      *   *Step 3: The Completion Value.* What is it worth *when done*? (Independent valuation).
      *   *Step 4: The Stop Cost.* What happens if we walk? (Penalties, reputation).
      *   *Step 5: The Opportunity Cost.* What else could this money do?
      *   *Decision Rule:* Continue if (Value - Completion Cost) > (Scrap Value - Stop Cost) + Opportunity Cost. *Wait, keep it simpler for a meeting.*
      *   *Refined Rule:* Compare "Finish Net" vs. "Kill Net".

  4.  **Brainstorming Rational vs. Stubborn (The "Why"):**
      *   *Rational:* Contractual penalties exceed completion cost; strategic asset is critical; stopping triggers loan default; reputation cost of abandonment > cost of completion.
      *   *Stubborn:* "We've come too far"; "I don't want to look bad"; "Maybe it will get better" (hope); "The other side will blink first" (auction dynamics).

  5.  **Developing the Questions (The Checklist):**
      1.  *Future Cost:* Exact dollars to finish?
      2.  *Future Value:* Independent worth upon completion?
      3.  *Termination Liability:* Cost to walk away *today*?
      4.  *Alternative Use:* Best other use for the *future* dollars?
      5.  *Reputation Signal:* Is "toughness" the product? (Crucial for the user's point about looking incompetent).

  6.  **Developing the Entry Test (Pre-Commitment):**
      *   Need to prevent the trap before it starts.
      *   Define "Kill Criteria" upfront.
      *   Separate approval for Phase 1 and Phase 2.

  7.  **Addressing the "Human/Politics" Element:**
      *   The procedure can't weigh "Mayor's re-election" vs. "Taxpayer burden." It must flag this as a value judgment.
      *   It can't measure "donor morale" precisely, but it can force the group to state it explicitly.

  8.  **Running the Cases:**
      *   *The Pool:* 70% done, 40% over. Value > Cost to finish? Or is the money better spent fixing roads? Reputation cost of stopping?
      *   *The Auction:* All-pay auction. Rational bid = 0 (or minimal) unless value is purely signaling. The procedure should show this is irrational wealth destruction.
      *   *The Database:* Vendor hold-up. Sunk cost vs. switching cost. Is the vendor bluffing?

  9.  **Limitations & Unpopular Answers:**
      *   It won't save face.
      *   It might say "quit" when the room wants "hope."
      *   It treats reputation as a cost, which might feel cynical.
      *   It requires honest numbers (which politicians might not give).

  10. **Refining the Output:**
      *   *Tone Check:* Am I sounding like an academic or a practitioner? Needs to be the latter. Use the user's "mystery box" analogy.
      *   *Structure:* Follow the user's requested order (Brainstorm -> Questions -> Entry Test -> Politics -> Cases -> Limitations).
      *   *Key Insight:* The "All-Pay Auction" dynamic in the town meeting is the critical insight. The bidders are bidding *political capital*, not just money. The procedure must expose this.

  11. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the math too complex for 45 mins?
      *   *Fix:* Simplify the decision rule to a "Compare Two Futures" approach.
      *   *Critique:* Did I address the "reputation is valuable" point?
      *   *Fix:* Ensure Question 5 explicitly validates reputation as a *future asset*, not a *past justification*.
      *   *Critique:* The auction case is tricky because it's a game theory trap.
      *   *Fix:* Highlight that the procedure reveals the game is rigged, suggesting the *rules* need changing, not just the bid.

  12. **Final Polish:** Ensure the distinction between "Sunk Cost" (past) and "Completion Cost" (future) is crystal clear. Emphasize that "looking incompetent" is a *future cost* of stopping, not a reason to ignore the past. (This is a subtle but vital distinction).

  *(Self-Correction on the Auction Case)*: The user described an all-pay auction (winner and runner-up pay). This is economically destructive. The procedure should identify this as a "Game Design Failure" rather than a "Bidder Error." I need to make sure I don't just say "don't bid," but "don't run this auction."

  *(Self-Correction on the Pool Case)*: The user says "half the money is committed for next year anyway." This is a budget constraint, not necessarily a sunk cost. If the money is *legally* committed, it's not available for alternatives. I need to distinguish between "budgeted" and "contractually obligated."

  Let's build the response.cw
answer: |-
  You have identified the core mechanism correctly: **Escalation of Commitment** often masquerades as rational investment, and **All-Pay Auctions** (where losers pay) drive bids well above asset value. In your town meetings, the "currency" isn't just dollars; it's political capital, reputation, and credibility. When bidders (council members) feel they must out-bid each other to avoid looking weak, you get the pool scenario. When bidders (donors) get caught in a status war, you get the mystery box scenario.

  A spreadsheet won't fix this because the inputs are emotional and political. You need a **Decision Protocol** that forces the room to separate *past pain* from *future gain* and explicitly prices the *reputation signal*.

  Here is the procedure, designed for a 45-minute live session.

  ### Part 1: Rational Continuation vs. Stubborn Escalation
  Before the meeting, you need to distinguish valid reasons to finish a troubled project from psychological traps.

  **Rational Reasons to Continue (The "Good" Commitment):**
  1.  **Completion Economics:** The cost to finish is less than the value of the finished asset, *and* less than the cost to terminate (penalties/legal).
  2.  **Strategic Necessity:** The asset is critical infrastructure (e.g., a bridge). An unfinished bridge is a liability; a finished one is an asset. The overrun is painful but the utility is non-negotiable.
  3.  **Reputation as an Asset:** In your specific context, "never backing down" deters future contractors from bluffing or donors from low-balling. If the *signal* of toughness saves more money in the next 5 years than this project loses today, continuing is an investment in reputation.
  4.  **Irreversible Commitments:** Funds are legally encumbered and cannot be reallocated without greater penalty (e.g., bond covenants).

  **Stubborn Reasons to Continue (The "Bad" Escalation):**
  1.  **Averaging Down:** "We've spent so much, we can't stop now." (This is the sunk cost fallacy).
  2.  **The War of Attrition:** "If I vote to kill this, the Mayor/Other Faction wins." (This is the auction dynamic you saw at the fundraiser).
  3.  **Hope Bias:** "The vendor says this is the *last* payment." (Without independent verification).
  4.  **Ego Protection:** "I approved the initial budget; admitting failure hurts my re-election/standing."

  ---

  ### Part 2: The "Continue or Kill" Protocol (45 Minutes)
  *Facilitator Note: Write the answers on a whiteboard. If anyone cites past spending, interrupt and ask: "Is that money recoverable?" If no, cross it out.*

  **Question 1: The "To-Complete" Estimate**
  *   **Ask:** "What is the exact, committed dollar amount required to make this usable *today*? Not the original budget, not the hope budget. The cost to close the contract."
  *   **Good Answer:** A fixed number backed by a change order or vendor contract (e.g., "$200k to unlock the doors").
  *   **Bad Answer:** A range, an estimate, or "we think roughly..."
  *   **Stop Condition:** If you cannot define the cost to finish, you **STOP**. You cannot invest in a fog.

  **Question 2: The "Scrap" Value**
  *   **Ask:** "If we walk away right now, what do we own? Can we sell the partial build? Can we repurpose the materials? What is the cash recovery?"
  *   **Good Answer:** "Nothing, it's a hole in the ground" or "We can sell the steel for $10k."
  *   **Bad Answer:** "We own the progress." (Progress has no cash value unless finished).
  *   **Stop Condition:** If Scrap Value + Termination Penalties > Cost to Complete, you **STOP**.

  **Question 3: The Independent Utility**
  *   **Ask:** "Ignore what we spent. If this asset appeared finished tomorrow, would we spend the *To-Complete* amount to buy it?"
  *   **Good Answer:** "Yes, the town needs a pool, and $200k is a bargain for a pool."
  *   **Bad Answer:** "We have to, because we started it."
  *   **Stop Condition:** If the answer is No, you **STOP**.

  **Question 4: The Opportunity Cost**
  *   **Ask:** "If we do *not* spend the *To-Complete* amount on this, what is the next best thing we could do with that specific money?"
  *   **Good Answer:** "Fix the main road" or "Reserve it for contingency."
  *   **Bad Answer:** "Nothing, it's earmarked." (Only valid if legally true, see Q1).
  *   **Stop Condition:** If the Alternative Use creates more public value than the Finished Project, you **STOP**.

  **Question 5: The Reputation Price (The Political Valve)**
  *   **Ask:** "What is the specific cost to our organization's credibility if we cancel? Is 'toughness' the product we are selling?"
  *   **Good Answer:** "If we cancel, contractors will bid 20% higher next time knowing we fold," or "Donors will see us as mismanagers and withhold future gifts."
  *   **Bad Answer:** "We will look incompetent." (Too vague. Who? And for how long?)
  *   **Stop Condition:** This is the **Human Handoff**. If the group agrees the reputation cost exceeds the financial loss of finishing, you **CONTINUE**, but you must explicitly record it as "Buying Reputation," not "Finishing Project."

  ---

  ### Part 3: The Entry Test (Pre-Commitment)
  *Most damage happens here. Use this before approving any new project or raising a paddle.*

  1.  **Define Kill Criteria:** "We will stop this project if costs exceed X% or if Milestone Y is not met by Date Z." (Write this into the motion).
  2.  **Phase Funding:** "We are approving funds for Phase 1 only. Phase 2 requires a new vote using the Protocol above."
  3.  **The Auction Rule:** "For any bid/auction, no participant pays unless they win." (For your nonprofit: **Never run an all-pay auction.** It incentivizes irrational escalation. If you must, cap the bid limit publicly).

  ---

  ### Part 4: Where the Procedure Hands Off to Humans
  This protocol is arithmetic and strategic. It cannot decide:
  1.  **Values:** Is a pool more important than a road? (Q4 identifies the trade-off, but humans must weigh the values).
  2.  **Pain Tolerance:** Can the town survive the scandal of stopping? (Q5 identifies the risk, but humans must accept the fallout).
  3.  **Truthfulness:** The protocol relies on honest numbers. If the contractor is lying about the "To-Complete" cost, the math fails. You need a trusted human to verify the inputs.

  ---

  ### Part 5: Running the Cases

  #### Case 1: The Town Pool (70% done, 40% over budget)
  *   **Q1 (To-Complete):** $500k (Committed for next year).
  *   **Q2 (Scrap):** $0 (Hole in ground). Termination penalty: $100k.
  *   **Q3 (Utility):** Yes, town needs a pool. Value = $2M.
  *   **Q4 (Opportunity):** $500k could fix 5 miles of road.
  *   **Q5 (Reputation):** "If we stop, voters think we can't manage capital projects. If we finish, we look fiscally irresponsible but capable."
  *   **Verdict:** **CONTINUE, BUT REFRAME.**
      *   *Why:* The math says Finish ($500k cost for $2M asset) is better than Kill ($100k penalty for $0 asset).
      *   *Caveat:* You must acknowledge the Opportunity Cost (roads don't get fixed). The "Reputation" argument is valid *only if* you communicate clearly: "We are finishing this to honor contracts, but we are cutting X program to pay for it."
      *   *Correction:* The "half money committed" argument is valid *only* if the contract legally binds you. If it's just budgeted, treat it as available cash (Q4).

  #### Case 2: The Charity Auction (All-Pay Mystery Box)
  *   **Q1 (To-Complete):** Bid amount (e.g., $1,000).
  *   **Q2 (Scrap):** $0 for loser. Box value for winner (e.g., $200).
  *   **Q3 (Utility):** Winner: Yes ($200 value). Loser: No ($0 value).
  *   **Q4 (Opportunity):** $1,000 could be donated directly without bidding.
  *   **Q5 (Reputation):** "Looking generous/competitive."
  *   **Verdict:** **STOP / CHANGE RULES.**
      *   *Why:* This is a destructive All-Pay Auction. The protocol reveals that for the *loser*, the cost is infinite (pay for nothing). For the *winner*, the cost ($1,000) exceeds value ($200).
      *   *Action:* As a board member, you vote to **ban this auction format next year**. It extracts money by triggering escalation bias, not value. It damages donor trust when they realize they paid $800 for nothing.
      *   *Personal:* You never bid. The "Reputation" gain is not worth wealth destruction.

  #### Case 3: The Donor Database (Vendor hold-up)
  *   **Q1 (To-Complete):** Vendor wants $20k "final integration fee."
  *   **Q2 (Scrap):** Database is unusable without integration. Value = $0.
  *   **Q3 (Utility):** Do we need *this* database? Maybe a $5k SaaS alternative exists.
  *   **Q4 (Opportunity):** $20k could fund 2 months of fundraising staff.
  *   **Q5 (Reputation):** "If we pay, they will keep asking. If we sue, we look litigious."
  *   **Verdict:** **LIKELY STOP (Walk Away).**
      *   *Why:* This is the "Hold-Up Problem." The vendor knows your sunk cost.
      *   *Test:* Can you buy a different system for less than $20k? If yes, **Kill**. The $20k is a tax on your past mistake.
      *   *Reputation:* Paying signals you are a "soft target" for vendors. Walking away signals you audit value.

  ---

  ### Part 6: Limitations & Unpopular Answers
  You asked what this procedure can't do and where it will hurt.

  1.  **It Cannot Save Face:** The protocol will often conclude: "We made a mistake, and the cheapest way to fix it is to admit it and stop." This requires a human to stand up and say, "I voted for this, I was wrong, and I vote to kill it now." The procedure gives you the ammo, but you still have to pull the trigger.
  2.  **It Treats Reputation as a Commodity:** Some people find it cynical to put a price on "looking competent." The protocol forces you to do this. If you aren't willing to say "Looking competent is worth $500k to us," you can't use it to justify finishing the pool.
  3.  **It Requires Honest Opponents:** If the project champion lies about the "To-Complete" cost (Q1), the math breaks. You need the authority to demand independent verification (e.g., a second contractor estimate) before the vote.
  4.  **The "Unpopular Answer":** Sometimes the protocol says **Finish**, even when you want to **Quit**. If the termination penalties are huge and the asset is vital, the math says "pay the ransom." You might hate paying the ransom, but the protocol will tell you that quitting is *more expensive*. You must respect that outcome, or you are just indulging in sunk cost fallacy in reverse.

  **Final Advice:**
  In your next meeting, when someone says "We've come too far to turn back," you say: *"That is a feeling, not a number. I am moving we apply the Continue/Kill Protocol. If the future value exceeds the future cost, I will vote to finish. If not, I will vote to cut our losses. Let's look at the future numbers only."*

  This shifts you from the "Naysayer" to the "Fiduciary." It makes the stubbornness about the *process*, not your personality.
