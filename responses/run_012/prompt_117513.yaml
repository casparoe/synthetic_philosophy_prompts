  4.  **Metaphysical Fact over Semantic Artifact:** 0.50
      *   *Justification:* While rigid designation is semantic, the biological causal chain suggests a mind-independent constraint, though the two are difficult to disentangle.

  **How They Combine**
  These function as conjunctive filters on the strength of the essentialist claim; the total credence is suppressed by the lowest confidence terms (specifically the framework and intuition reliability), preventing the semantic plausibility from boosting the metaphysical probability too high.

  **Sensitivity Analysis**
  The total is most sensitive to **Term 3 (Haecceitism vs. Counterpart Theory)**; if counterpart theory is accepted, the statement "I could not have come from a different egg" becomes category-mistaken rather than false, collapsing the metaphysical necessity into a claim about similarity weighting.

