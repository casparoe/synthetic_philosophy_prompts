answer: |-
  You have identified a precise and highly consequential maneuver in contemporary heritage politics, yet you are correct that there is no single, settled term for it in the literature. In museum policy documents, it is euphemistically branded as **"Shared Stewardship"** or **"Global Partnerships."** In critical scholarship (e.g., Dan Hicks, Sarr & Savoy), it is often dismissed pejoratively as **"restitution-lite"** or **"neo-colonial custodianship."**

  However, neither of these captures the specific *structural shape* of the offer you are describing: the conversion of a moral claim for ownership into a managed relationship of access, thereby neutralizing the legal threat while absorbing the ethical critique.

  For your MA work, I propose the term **"Proprietary Deflection."**

  Below is a definition, a set of criteria for identifying it, and an analysis of the boundary cases you requested.

  ### The Term: Proprietary Deflection

  **Definition:** A rhetorical and legal maneuver in restitution negotiations wherein a holding institution concedes the *moral* validity of a repatriation claim (acknowledging problematic provenance) but satisfies it through *access-based mechanisms* (loans, stewardship agreements) that explicitly preserve the institution's *legal title*.

  **The Logic:** It operates on the premise that **access is equivalent to justice**, whereas the claimant operates on the premise that **sovereignty (title) is equivalent to justice**. The move "deflects" the proprietary claim by saturating it with moral accommodation.

  ### Distinguishing the Move

  To use this term analytically, you need to distinguish it from a genuine return, a mere stall, or a standard loan.

  | Feature | **Genuine Restitution** | **Proprietary Deflection** | **Mere Stall / Bad Faith** |
  | :--- | :--- | :--- | :--- |
  | **Title** | Transferred to claimant. | **Retained by holding institution.** | Retained by holding institution. |
  | **Provenance** | Acknowledged as problematic. | Acknowledged as problematic. | Contested, minimized, or ignored. |
  | **Mechanism** | Deaccessioning / Gift / Transfer. | **Long-term Loan / Stewardship Pact.** | "Under Review" / "Legal Barriers." |
  | **Duration** | Permanent. | **Fixed term (even if long) or revocable.** | Indefinite delay. |
  | **Rhetoric** | "Returning what is yours." | **"Partnering for global access."** | "Protecting universal heritage." |

  **Why it is not just a "Loan":** A standard loan is a curatorial tool used between institutions that generally agree on the status quo of ownership. **Proprietary Deflection** is a *political* tool used specifically in response to a sovereignty claim. The loan is not serving a curatorial need; it is serving a diplomatic function to resolve a crisis of legitimacy without altering property law.

  ### Boundary Cases and Variables

  You asked how specific variables affect whether an offer counts as Proprietary Deflection or something else. Here is how to analyze them:

  #### 1. The Indefinite Loan
  *   **Scenario:** The museum offers a "permanent loan" or a 99-year lease.
  *   **Analysis:** This remains **Proprietary Deflection**. In legal terms, a loan is a *bailment*, not a transfer of title. No matter the duration, the power to *recall* the object remains with the titleholder. If the museum retains the right to recall the object (e.g., for conservation, security, or if the partnership sours), the sovereignty remains with the museum.
  *   **Threshold:** It only ceases to be deflection if the "loan" is legally structured as a transfer of title that is merely *physically* retained (which is rare).

  #### 2. Shipping and Cost Coverage
  *   **Scenario:** The museum offers to pay for shipping, insurance, and conservation during the loan.
  *   **Analysis:** **Irrelevant to the classification.** This is "cost absorption," not "title transfer." It makes the deflection more palatable (a "generous" deflection), but it does not change the proprietary structure. It is a concession on *logistics*, not *sovereignty*.

  #### 3. Veto Power for the Source Country
  *   **Scenario:** The source community gets veto power over future loans to third parties or over how the object is displayed.
  *   **Analysis:** This creates a **Hybrid Stewardship**. It complicates the Proprietary Deflection label. If the source community has legal veto power over the *use* of the object, the museum's ownership is "encumbered."
  *   **Verdict:** It is still Proprietary Deflection regarding *title*, but it moves toward **Shared Sovereignty**. If the veto power is legally binding and enforceable in court, the museum no longer has full "bundle of rights" ownership. This is a significant boundary case where the deflection begins to fail because actual power has shifted.

  #### 4. Human Remains vs. Art Objects
  *   **Scenario:** The object is a human ancestor vs. a bronze sculpture.
  *   **Analysis:** **Proprietary Deflection typically fails here.**
      *   *Art/Artifacts:* The debate is framed around property, culture, and access. Deflection works because "access" is a plausible substitute for "ownership."
      *   *Human Remains:* The debate is framed around **human rights, dignity, and burial.** You cannot "loan" a human ancestor for "display" without violating the core moral premise of the claim.
      *   *Verdict:* Offering a loan of human remains is not Proprietary Deflection; it is often viewed as **Continued Desecration**. The moral logic of the claim (resting dignity) cannot be satisfied by the mechanism of the offer (managed access).

  ### Why This Term Matters for Your Thesis

  Using **"Proprietary Deflection"** allows you to move beyond the binary of "Return vs. Keep." It allows you to analyze the *middle ground* not as a compromise, but as a specific strategy of **legal continuity masked as ethical progress.**

  It helps you ask:
  1.  **Who holds the "Bundle of Rights"?** (Right to sell, right to destroy, right to exclude, right to possess). In Proprietary Deflection, the museum keeps the core bundle, granting only the right to possess temporarily.
  2.  **What is the Exit Strategy?** In a genuine return, the museum's relationship ends or changes fundamentally. In Proprietary Deflection, the museum makes itself *permanently necessary* as the legal guardian, even if the object is physically away.
  3.  **Does it Precedent Future Claims?** Museums often use this to settle a specific claim without admitting a *principle* that would apply to the rest of the collection. (e.g., "This was a unique case," vs. "We acknowledge a general right to return"). Proprietary Deflection allows them to resolve the conflict without setting a legal precedent for title transfer.

  ### Summary for Your Work
  *   **Industry Term:** Shared Stewardship / Global Partnerships.
  *   **Critical Term:** Proprietary Deflection.
  *   **Core Mechanism:** Conceding moral ground to retain legal title.
  *   **Key Differentiator:** The retention of the right to recall or determine ultimate disposition.

  This terminology should give you the analytical precision to dissect the "shape of the offer" without getting bogged down in the specific politics of the Benin or Parthenon cases. You are looking at the *structure of the agreement*, not the *content of the collection*.
