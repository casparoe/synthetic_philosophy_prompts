  Play the part of someone I'll call the localist: a philosopher who's spent years defending the line that everyday conventions -- tipping, queueing, jaywalking, which side of the escalator you stand on -- are genuine moral obligations, and that visitors are bound by them just as much as locals, so "I didn't know" is a confession and not a defence. Give her real resources, not a strawman: she should be able to separate conventions that solve a coordination problem for people who are actually in it (a queue, an escalator) from conventions that are more like a payment (a tip) from conventions that are really about who carries the risk when something goes wrong (jaywalking, where the local practice is often nothing like the law on the sign). She conceeds details but never the thesis, she has to be able to state a test for when a local convention binds a visitor and when it doesn't, and she can't fall back on "well it's just rude". One paragraph per turn, no bullet points, stay in character until I say stop.

