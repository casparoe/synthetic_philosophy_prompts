answer: |-
  Your hypothesis is insightful, but it's **half-right**. You have correctly identified a methodological friction, but you are misdiagnosing the *source* of the critics' dissatisfaction. It is not merely that critics want "formal semantics" while naturalizers want "scientific respectability." The load-bearing disagreement is deeper: it is a conflict between **Metaphysical Grounding** and **Explanatory Utility**.

  Here is the diagnosis of the stalemate, the verdict on your neuroscientist colleague, and a proposal for what actual progress looks like.

  ### 1. The Load-Bearing Disagreement: Grounding vs. Utility

  You suggest the naturalizers are fine with indeterminacy ("feature, not a bug") while critics demand determinacy. This is true, but you miss *why* the critics demand it.

  Teleosemantics is trying to solve the **Normativity Problem**: How can a physical state be *wrong*? (e.g., the frog snaps at a BB; the state was "false"). Teleosemantics solves this metaphysically: The state is wrong because it violated a historical selection norm.

  However, cognitive science uses content to solve the **Causal/Explanatory Problem**: Why did the organism do *this* specific thing rather than *that*? To explain the frog's snap, we need to know if the system represented "fly," "food," or "small dark thing."
  *   If it represented "fly," the snap at a BB is a mistake.
  *   If it represented "small dark thing," the snap at a BB is correct.

  **The Stalemate:**
  The teleosemanticist prioritizes **Grounding**. They need *any* normativity to save representation from eliminativism. They are willing to accept that content is coarse-grained or indeterminate (e.g., "frog-food") as long as it is naturalized.
  The critic prioritizes **Utility**. They argue that if the theory cannot distinguish between "fly" and "small dark thing" in a way that maps onto the organism's actual discrimination capacities, the concept of "content" does no explanatory work. If the content is indeterminate, it cannot explain specific behavior.

  Therefore, the Disjunction and Distality problems are not just "gotchas"; they demonstrate that **biological function underdetermines cognitive description.** The selection history tells you the system *should* work, but it often fails to tell you *what* the system is tracking in a way that aligns with our psychological vocabulary.

  **Verdict:** This is a **substantive** disagreement about the role of semantic properties in science. It is not verbal. One side thinks semantic properties are *real relations grounded in history*; the other thinks semantic properties are *explanatory posits that must track causal specificity*. Teleosemantics secures the former at the expense of the latter.

  ### 2. The Swampman Objection: Essence vs. Intuition

  You suggest Swampman tests "constitutive account vs. sufficient condition." That is close, but the real friction is **Internalism vs. Externalism regarding Normativity.**

  *   **Teleosemantics:** Normativity is essentially historical. You cannot have a "function" without a history of selection. Therefore, Swampman has no content.
  *   **Critics:** Normativity is structural/systemic. If Swampman has the same internal structure as a human, he has the same capacity for error *now*.

  This is where your hypothesis about "natural kinds" hits the mark. Teleosemanticists treat representation as a **historical natural kind** (like "heart" or "immune system"). Critics often treat it as a **functional/computational kind** (like "software" or "map").

  If representation is a historical kind, Swampman has no content. If it is a functional kind, he does. The debate stalls here because neither side can prove their modal intuition is the "correct" one. Progress here requires admitting that "representation" might be a **cluster concept** where history is one cluster property among many, not the essence.

  ### 3. The Neuroscientist: Profound Point, Not Category Error

  Your computational neuroscientist colleague is making the most important point in the room, and it is **not a category error**. It is an **ontological mismatch**.

  Teleosemantics (especially Millikan's version) relies on a specific architecture: distinct "Producer" mechanisms and "Consumer" mechanisms linked by a mapping function that was selected for.
  *   **The Empirical Challenge:** Modern neuroscience (connectionism, predictive processing, dynamic systems) often does not find discrete consumers/producers. It finds distributed, recurrent networks where "error" is signaled via local gradient descent or homeostatic regulation, not by violating a phylogenetic selection norm.
  *   **The Implication:** If the brain does not contain the architectural units teleosemantics requires (discrete selected consumers), then teleosemantics is **empirically false** as a theory of *human* cognition, even if it is metaphysically coherent.

  The neuroscientist is pointing out that teleosemantics might be a theory of *simple biological systems* (like bacteria or frog retinas) that does not scale to *cognitive systems*. If the "selection" happens online (learning) rather than phylogenetically (evolution), the Millikan/Dretske model needs radical revision. This is a substantive empirical constraint that philosophers often ignore.

  ### 4. What Counts as Progress?

  You asked if you should admit the question is under-specified. **Yes.** But that doesn't mean stopping; it means reframing. The debate will not close because "What is the content?" assumes there is a single fact of the matter.

  **Pathways to Progress:**

  1.  **Accept Explanatory Pragmatism:** Stop asking "What *is* the content?" and start asking "Under what conditions is attributing *this* content explanatory?" This moves the debate from metaphysics to philosophy of science. Sometimes "fly" is the right attribution; sometimes "dark dot" is. Both are naturalized, but relative to the explanatory context.
  2.  **Mechanistic Normativity:** Shift focus from *phylogenetic* history (evolution) to *ontogenetic* or *developmental* history (learning/setup). This addresses the neuroscientist's concern. If a neural network is trained to minimize error, it establishes a "proper function" locally without needing millions of years of evolution. This saves the teleosemantic insight (normativity comes from function) without the Swampman/History baggage.
  3.  **Graded Content:** Abandon the idea that content is binary (either it represents X or it doesn't). Adopt a view where content is **graded** based on the reliability and specificity of the consumer mechanism. This dissolves the Disjunction Problem: the state represents "fly" more strongly than "pellet" because the consumer is tuned to fly-features, even if it sometimes fires for pellets.

  ### Summary Diagnosis

  *   **Is it verbal?** No. It's about the explanatory role of content.
  *   **Is it substantive?** Yes. It's a clash between Metaphysical Naturalism (Grounding) and Cognitive Science (Utility).
  *   **The Neuroscientist:** They are right. The theory risks being empirically vacuous if the brain's architecture doesn't match the "consumer/producer" model.
  *   **The Way Out:** Stop trying to find the *one true content*. Treat teleosemantics not as a reduction of content to history, but as a **justification for using normative language** in biology. Then, let empirical neuroscience determine the granularity of that normativity.

  Your group is stuck because you are trying to solve a metaphysical problem (What is representation?) using a theory that is partly an empirical hypothesis (How do brains work?) to satisfy a methodological constraint (Naturalism). Break the triangle. Admit that "content" is a tool we use to explain systems that have history-shaped norms, and let the specifics vary by case.
