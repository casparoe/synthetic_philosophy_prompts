answer: |-
  Your intuitions are remarkably consistent with a specific strand of republican political theory, one that distinguishes between the *will* of the community and the *administration* of the state. Your tentative principle is close, but it falters on the distinction between allocating a benefit (university admissions) and selecting an agent to perform a risky technical act (surgery), even when both involve a qualified pool.

  To resolve this, I propose a refinement based on the **nature of the competence required** and the **direction of the risk**.

  ### The Principle: Representative Judgment versus Technical Execution

  The best principle to square your verdicts is a dual criterion:

  1.  **The Competence Criterion:** Sortition is legitimate where the task relies on **general moral reasoning, representative judgment, or fair allocation** among equals. It is illegitimate where the task relies on **specialised technical skill with high variance** in outcomes, or requires **sustained strategic coordination**.
  2.  **The Risk Criterion:** Sortition is legitimate where the risk is borne by the **participants** (admissions) or is **contained and reversible** (jury verdict, advisory assembly). It is illegitimate where the risk is imposed on **non-consenting third parties** through continuous executive action (legislation, surgery, monetary policy).

  #### Resolving the Admissions vs. Surgeon Paradox
  Your tentative principle struggled here because both involve selecting from a 'qualified' pool. However, under the **Competence Criterion**, the nature of that qualification differs.
  *   **University Admissions:** Above the academic threshold, the variance in student success is often indistinguishable from noise, and the primary goal is **fair allocation** of a scarce good. The risk is borne largely by the student and the institution.
  *   **Surgeons:** Above the licensing threshold, there remains significant **variance in technical skill and outcomes**. The task is **technical execution**, not allocation. The risk is imposed on a vulnerable, non-consenting patient (in an emergency) or a trusting patient who cannot evaluate the skill variance. Therefore, meritocratic selection remains necessary to minimise harm.

  #### Verdicts to Abandon or Refine
  This principle forces you to clarify your wavering stance on the **City Council**.
  *   **Abandon:** The idea of a sortition council *administering* city services (waste management, transport logistics, housing construction). This is **Technical Execution** requiring coordination and expertise.
  *   **Refine:** You may retain a sortition council if its role is strictly **governance** (setting the budget, determining priorities, overseeing the bureaucracy) rather than administration. This aligns it with the Citizens' Assembly model (representative judgment) rather than the Legislature model (continuous law-making). However, if the council has the power to initiate binding regulations without ratification, it drifts towards the 'Legislature' verdict and should be rejected under the **Risk Criterion**.

  Consequently, your verdict on the **Legislature** is reinforced. Ordinary legislation requires coalition-building and strategic foresight (Coordination) and imposes continuous risk on the populace.

  ### Application to Further Cases

  Here is how this principle applies to your two new scenarios:

  #### 1. A Randomly Selected Body to Set the Legislative Agenda
  **Verdict: Legitimate.**
  *   **Analysis:** This body does not execute policy or pass laws; it performs a **judicative function** regarding what matters are worthy of attention. It reduces the strategic coordination burden (they do not need to pass the bills, merely prioritise them).
  *   **Reasoning:** This fits the **Citizens' Assembly** model. It is bounded (agenda only), relies on representative judgment (what does the public care about?), and acts as a check on the elected legislature rather than a replacement. The risk is low because the elected body still votes on the substance.

  #### 2. A Randomly Selected Review Panel with Veto Power over Regulations
  **Verdict: Legitimate (with caveats).**
  *   **Analysis:** This is functionally identical to a **criminal jury**, but for administrative law. They are not initiating regulations (which requires expertise/coordination) but reviewing them for acceptability.
  *   **Reasoning:** This satisfies the **Competence Criterion** (general moral reasoning on whether a rule is fair/safe) and the **Risk Criterion** (it is a negative power, preventing harm rather than risking active intervention). However, it requires that the regulations are presented clearly enough for laypersons to understand the technical implications, perhaps aided by neutral experts, similar to a trial judge advising a jury.

  ### Summary
  Your intuitions are soundest when you view sortition as a tool for **democratic judgment and fair allocation**, rather than a method for **executive management or technical selection**.

  *   **Keep:** Juries, Assemblies, Conventions, Admissions Lotteries, Agenda-Setters, Veto Panels.
  *   **Reject:** Legislatures, Central Banks, Surgeons, City Administrators.
  *   **Refine:** City Councils (permissible for oversight/priorities, impermissible for administration).

  This preserves the democratic virtue of sortition—freedom from faction and corruption—without incurring the epistemic costs of randomising expertise or strategic responsibility.
