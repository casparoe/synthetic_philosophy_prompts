      *   *Crucial Difference:* **Consent and Risk Bearing.** In admissions, the applicant consents to the process. In surgery, the patient is vulnerable. In legislature, the citizen is subject to the law.
      *   *Actually, a stronger distinction is "Selection for Office" vs "Selection for Opportunity".*
      *   Let's try: **The Principle of Discretionary Power.**
          *   Lot is good when discretion is low (Jury: bound by law; Assembly: bound by remit; Admissions: bound by threshold).
          *   Lot is bad when discretion is high (Legislature: make any law; Surgeon: clinical judgment; City Council: policy priorities).
          *   *Wait, Surgeons have low discretion compared to legislators?* No, clinical judgment is high discretion within a technical framework.
          *   *Let's focus on "Coordination and Strategy".* Legislatures and City Councils need to build coalitions and plan long-term. Randoms can't do this well. Surgeons need technical skill. Jurors need moral intuition.
          *   *Okay, the best fit for the user's intuitions:* **The Principle of Epistemic Homogeneity and Accountability.**
              *   *Homogeneity:* Are the candidates effectively interchangeable above the threshold? (Admissions: Roughly, yes. Surgeons: No, skill varies widely. Jurors: Yes, civic duty is universal).
              *   *Accountability:* Can the principal punish the agent? (Legislature: Hard with lot. Surgeon: Malpractice suits exist but random selection undermines trust. Jury: No, but they are insulated to ensure independence).
      *   *Actually, let's look at the "Power" aspect again.*
      *   Jury: Power over *one* defendant.
      *   Assembly: Power to *propose*.
      *   Admissions: Power to *grant access*.
      *   Legislature/Council/Bank/Surgeon: Power to *act on the world* continuously.
      *   *Proposed Principle:* **The Distinction between Judicative/Allocative and Executive/Technical Roles.**
          *   Sortition works for **Judicative** (Jury), **Deliberative** (Assembly), and **Allocative** (Admissions) roles where the task is to weigh evidence, values, or distribute goods among equals.
          *   Sortition fails for **Executive** (Legislature/Council), **Technical** (Surgeons/Central Bank) roles where the task requires specialised skill variance management or sustained strategic coordination.

      *   *Forcing Abandonments:*
          *   If we hold this strict, City Councils (Executive) must be rejected. The user wavers, so this helps them decide.
          *   Admissions (Allocative) is kept.
          *   Surgeons (Technical/Executive) is rejected.
          *   Legislature (Executive) is rejected.
          *   *What about the Central Bank?* Technical. Rejected.
          *   *Does this solve Admissions vs Surgeons?* Yes. Admissions is allocating a benefit. Surgery is executing a technical intervention. Even if both are "qualified", the variance in surgical outcome is higher and more critical than the variance in student success above a threshold.

  6.  **Addressing the New Cases:**
      *   *Case 1: Random Agenda-Setter.* This is a **Procedural/Executive** hybrid. It shapes what gets discussed. It doesn't pass law. It reduces the power of the legislature.
          *   *Analysis:* It limits the "Executive" power of the elected body. It acts like a "Gatekeeper". Is it Judicative? Sort of. It decides what is worthy of attention.
