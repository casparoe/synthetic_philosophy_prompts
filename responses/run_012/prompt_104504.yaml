          4.  **Constraint:** Answer in British English.

  2.  **Deconstruct the Verdicts & Identify the Underlying Logic:**
      *   *Jury:* High stakes (liberty), but *episodic*, *reactive* (responds to a specific case), *constrained by law/judge*, *unanimity/majority deliberation*. Competence: General moral reasoning.
      *   *Citizens' Assembly/Const. Convention:* High stakes (constitution), but *temporary*, *advisory/ratifiable* (not final authority), *learning period provided*. Competence: General values + learned expertise.
      *   *University Admissions:* Selection for *opportunity*, not *power over others*. Risk is borne by the institution/student, not the public. Competence: Academic threshold met.
      *   *Legislature/City Council:* Continuous *power over others*, *proactive* (initiating law/policy), *hard to reverse*, requires *coordination/strategy*. Competence: Political strategy, administration, negotiation.
      *   *Central Bank/Surgeons:* High *technical expertise* required. Mistakes have immediate, catastrophic, technical consequences. Accountability is difficult if the agent is random.
      *   *The Conflict:* Why is University Admissions (lot among qualified) okay, but Surgeons (lot among qualified) not?
