      *   *Proposed Principle:* **The Principle of Constrained Agency.** Sortition is legitimate when the agent's power is either (a) strictly constrained by external rules/oversight, (b) limited to allocating benefits rather than imposing risks, or (c) temporary and subject to ratification. It is illegitimate when the agent holds continuous, proactive executive power requiring high-variance technical expertise without immediate corrective feedback.

