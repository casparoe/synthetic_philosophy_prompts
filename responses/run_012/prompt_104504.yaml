          *   *Refinement:* **The Principle of Agency over Harm.** Sortition is permissible for allocating benefits among equals (Admissions) or judging past acts (Jury). It is impermissible for selecting agents to perform high-stakes technical interventions (Surgeons) or continuous governance (Legislature/Council) where strategic coordination and accountability are required.

