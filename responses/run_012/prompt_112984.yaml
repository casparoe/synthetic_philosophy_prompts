  ### Plain-Prose Explanation

  Your choices are the "Greatest Hits" of behavioral economics, and they cannot be explained by standard Expected Utility Theory (your friend's likely baseline) or by Loss Aversion alone. Standard theory fails because you violate the Independence Axiom (Case C, the Allais Paradox) and you switch from risk-averse to risk-seeking depending on whether you are facing gains or losses (Cases A vs. D). Loss Aversion alone fails because it cannot explain why you buy insurance for small-probability losses (Case F) but gamble on moderate-probability losses (Case D).

  The single rule that unifies all six calls is **Cumulative Prospect Theory (CPT)**. This rule dictates that you don't evaluate outcomes by final wealth, but by gains and losses relative to a reference point, processed through two specific filters: an **S-shaped value function** (concave for gains, convex for losses, steeper for losses) and an **inverse-S probability weighting function** (you overweight small probabilities and underweight moderate ones).

  This combination explains the tension you feel between Case D (risk-seeking in losses) and Case F (risk-aversion in losses): the weighting function makes the 1% catastrophe in F loom larger than its mathematical expectation, while the convex value function makes the 50% gamble in D attractive. It also explains Case C (Allais) where you overweight the certainty of the \$1M in the first pair but overweight the small chance of \$5M in the second. Case E is the tightest fit; standard parameters often predict risk-seeking for 10% gains, but your strong risk aversion there simply forces the "curvature" of your value function to be steeper than average. No cases need to be theoretically dropped, but Case E requires your risk aversion parameter to be high.

