  B. Same choice scaled down by 100: sure $5, or a coin flip between $12 and $0. Still the sure $5. Same gut feeling — not more rational, not less.
  C. First: $1,000,000 for sure, or (89% chance of $1,000,000, 10% chance of $5,000,000, 1% chance of $0). I take the sure million. Second: (11% chance of $1,000,000, otherwise $0), or (10% chance of $5,000,000, otherwise $0). Here I take the 10% shot at the five million.
  D. A sure loss of $500, or a coin flip between losing $1,000 and losing nothing. I flip the coin — here I want the gamble.
  E. Between (50% chance of $1,000, otherwise $0) and (10% chance of $5,000, otherwise $0) — same average — I take the first.
  F. I'd pay $150 to avoid a 1% chance of losing $10,000, even though the expected loss is only $100.

  Is there a single rule behind all of these? If so, state it as precisely as you can, as a formula if there is one, and say what my calls force about the shape of whatever function turns up in it. I'm fairly sure C is a real pattern and not just me being flakey, but D and the rest feel like they come from two different people, so tell me honestly which call your principle has to throw out — or whether saving it costs an ugly patch, like a separate function for gains and losses. And once you've got the rule, tell me what it predicts for a gamble I didn't write down, and what the nearest rival rule would say instead.

  Give me a short plain-prose explanation first, then a JSON object with exactly these fields: "principle_name" (a short label); "rule" (the decision rule stated as a formula or precise condition); "function_shape" (what my calls force about the function in the rule — its value at probability 1/2, its curvature, any asymmetry, etc.); "case_verdicts" (an array with one object per case A through F, each with "case", "your_rule_predicts", and "matches_my_call" as true/false); "verdict_you_have_to_drop" (the case or cases the rule cannot save, with a one-line reason each); "unlisted_case" (one new gamble I didn't give, the choice your rule predicts, and the choice the closest rival rule predicts); and "cheapest_patch" (the smallest change to the rule that would save any dropped verdict, and what it costs theoretically).
