      *   *(5) Surprise Exam:* The argument is a fallacy. Surprise is possible. (This is an epistemic logic point, analogous to BI).
      *   *(6) Decision-Theoretic Rationality:* Max EU given beliefs. Beliefs need not be correct. Rationality does not require knowing what others do at unreached nodes (counterfactuals).

