          *   (6) explicitly denies rationality requires knowledge at unreached nodes.
          *   *Severity:* **High.** Aumann's proof of BI from CKR relies on how counterfactuals are handled. If you adopt the "decision-theoretic" view where beliefs at unreached nodes are unconstrained (as per 6), Aumann's derivation often fails or requires modification (e.g., Stalnaker vs. Aumann semantics).
      *   **Tension E: (5) vs. (3).**
