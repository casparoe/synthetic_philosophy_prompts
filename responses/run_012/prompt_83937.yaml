prompt: |-
  I'm a third-year phil student and, through a chain of events I won't bore you with, I'm the undergrad rep on my university's dining and procurement committee. We meet Thursday and I have to circulate a written opinion beforehand, so I need you to draft it. Background: catering is about to sign a two-year contract with a company that makes patties and protein bars out of farmed black soldier fly larvae, and our events catering buys a ridiculous amount of shrimp. A student campaign has been pushing us to adopt a real welfare policy for university food purchasing, and they want it written in terms of sentience rather than species -- protect whatever can suffer, don't draw the line at 'vertebrates' or 'animals'. The chair thinks that's a trap and wants us to just say we'll 'take animal welfare into account' and move on. And there's a bloc that says fine, but why start with bugs and shrimp when the chickens and eggs we buy are definately from horrible conditions -- why spend our credibility on maybe-suffering instead of certain suffering?

  Two things I want in the memo, because I think they actually change the answer and nobody on the committee has heard of them. In my animal minds course we went through the checklist people use to guess whether a taxon is even a candidate for sentience -- nociceptors, some kind of centralized nervous system, integration of that info, motivational trade-offs (accepting a worse option to avoid something noxious), self-administering painkillers -- and octopuses and crabs apparently pass a good few of those, which is not what most people expect. Second, my flatmate in the EA soc keeps going on about 'welfare ranges' -- the idea that even among sentient beings, the spread of possible good and bad experience might differ a lot by species, so insect suffering could be real but small on a common scale, which is an argument for weighting it rather than ignoring it. I half buy both of these, but I can't tell whether either one actually supports the campaign's sentience-only framing or undercuts it.

  So: draft the opinion I'll circulate. It needs a concrete recommendation I can put to a vote, with a time frame and who does what, and it has to take the 'fix the certain stuff first' objection seriously rather than batting it away -- if you think that's not really the strongest consideration on the other side, tell me what is. And if you think a sentience-based framing is just the wrong instrument for a procurement policy, say so and say what we should use instead.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **User:** Third-year Philosophy undergrad, serving as undergrad rep on the University Dining and Procurement Committee.
      *   **Task:** Draft a written opinion/memo to circulate before the Thursday meeting.
      *   **Context:**
          *   Catering is about to sign a 2-year contract for black soldier fly larvae (BSFL) patties/bars.
          *   Events catering buys a lot of shrimp.
          *   Student campaign wants a "sentience-based" welfare policy (protect whatever can suffer, not just vertebrates).
          *   Chair wants vague language ("take animal welfare into account") to avoid commitment.
          *   Opposing bloc argues: "Why focus on bugs/shrimp (uncertain suffering) when chickens/eggs (certain suffering) are still bad?"
      *   **Key Intellectual Inputs from User:**
          *   *Animal Minds Course:* Invertebrates (octopuses, crabs) pass sentience checklists (nociceptors, CNS, integration, trade-offs, analgesia).
          *   *EA Flatmate:* "Welfare Range" argument (insect suffering might be real but smaller in magnitude than vertebrates).
      *   **Requirements:**
          *   Concrete recommendation (vote-able, timeframe, responsibilities).
          *   Address the "fix the certain stuff first" objection seriously.
          *   Evaluate if sentience-based framing is the right instrument or if something else is better.
          *   Evaluate if the new info (invertebrate sentience evidence + welfare ranges) supports or undercuts the campaign.
      *   **Tone:** Professional, academic but practical, persuasive, suitable for a committee memo.

  2.  **Determine the Stance/Argument:**

      *   *Sentience vs. Species:* A strict sentience-based policy is philosophically robust but administratively nightmarish for procurement. Procurement needs clear lists and standards, not case-by-case metaphysical inquiries. However, ignoring invertebrates entirely is scientifically outdated.
      *   *The "Certain Suffering" Objection:* This is the strongest practical objection. If the university claims to care about welfare but switches to bug protein while keeping factory-farmed eggs, it looks like virtue signaling. This needs to be the pivot point.
      *   *Welfare Ranges:* This actually *supports* a tiered approach rather than a binary "sentient/not sentient" switch. It suggests we should weight high-certainty/high-magnitude suffering (chickens) higher than low-certainty/low-magnitude suffering (insects), but not ignore the latter.
      *   *Recommendation:* Don't adopt the BSFL contract *yet*. Adopt a phased welfare policy that prioritizes high-certainty vertebrate welfare immediately (addressing the "certain suffering" bloc) while commissioning a review on invertebrates (addressing the campaign and the science). This bridges the gap.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the purpose and the core recommendation upfront.
      *   **Context:** Briefly mention the BSFL contract and the student campaign.
      *   **Analysis of the "Sentience" Framing:**
          *   Acknowledge the philosophical merit (consistent with utilitarianism/etc.).
          *   Highlight the administrative risk (too vague for vendors).
          *   *Crucial Point:* Integrate the user's specific points about invertebrate neuroscience (crabs/octopuses) and welfare ranges.
          *   *Conclusion on Framing:* Sentience is the *ethical foundation*, but "Recognized Welfare Standards" is the *policy instrument*.
      *   **Addressing the "Certain Suffering" Objection:**
          *   Validate it. It's the strongest argument against the current plan.
          *   Explain why ignoring it undermines credibility.
          *   Argue that prioritizing vertebrates doesn't mean ignoring invertebrates forever, but it does mean not expanding into new invertebrate markets until baseline vertebrate welfare is secured.
      *   **The Recommendation (The "Ask"):**
          *   Pause the BSFL contract.
          *   Adopt a "Tiered Welfare Procurement Policy."
          *   Tier 1 (Immediate): High-certainty vertebrates (chickens, eggs, pigs, cows) -> Require specific certifications (RSPCA, Global G.A.P., etc.).
          *   Tier 2 (Review): Invertebrates (shrimp, insects) -> Commission a review based on the sentience criteria mentioned (nociception, etc.) within 6 months.
          *   Timeline: 6 months for review, policy implementation immediate for Tier 1.
      *   **Conclusion:** Reiterate the balance between ethical consistency and practical impact.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I initially thought about telling them to reject the bug contract outright. But as an undergrad rep, I need to be constructive. A "pause and review" is more palatable than a "no."
      *   *Correction on Welfare Range:* Make sure I explain *why* this matters. It means we don't treat a fly like a cow, but we don't treat it like a rock either. It justifies the "Tiered" approach.
      *   *Tone Check:* Ensure it sounds like a philosophy student wrote it (precise, argument-driven) but also like a committee member (action-oriented). Avoid overly dense jargon but keep the philosophical rigor.
      *   *Addressing the Chair:* The Chair wants vague language. I need to show why vague language is actually *riskier* (greenwashing accusations) than specific tiers.
      *   *Addressing the Campaign:* I need to show I take their sentience argument seriously but suggest a more effective vehicle for it.

  5.  **Final Polish:**

      *   Check against constraints: Concrete recommendation? Yes. Timeframe? Yes. Who does what? Yes. Address "certain suffering"? Yes. Evaluate sentience framing? Yes.
      *   Ensure the specific scientific points (nociceptors, trade-offs, welfare ranges) are woven in naturally as evidence, not just listed.

  6.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** University Dining and Procurement Committee
  **FROM:** [Your Name], Undergraduate Student Representative
  **DATE:** [Date]
  **SUBJECT:** Recommendation Regarding Invertebrate Procurement and Animal Welfare Policy Framework

  **1. Executive Summary**
  This memo addresses the proposed two-year contract for black soldier fly larvae (BSFL) protein products and the concurrent student campaign for a sentience-based welfare policy. While the ethical impulse to expand welfare considerations to invertebrates is scientifically grounded, adopting a binary "sentience-only" policy at this stage presents significant administrative risks and credibility gaps.

  I recommend the Committee **pause the BSFL contract signing** and instead adopt a **Tiered Welfare Procurement Policy**. This approach prioritizes high-certainty vertebrate suffering (addressing the "certain suffering" objection) while establishing a defined review process for invertebrates based on emerging neuroscience (addressing the student campaign).

  **2. The Ethical Framework: Sentience vs. Procurement Reality**
  The student campaign argues for a policy based on *sentience* (capacity to suffer) rather than *taxonomy* (vertebrate vs. invertebrate). Philosophically, this is the more consistent position. However, as a procurement instrument, a raw sentience clause is vulnerable. It requires vendors to make metaphysical judgments they are not equipped to make, leading to vague compliance ("we take welfare into account") which the Chair rightly identifies as ineffective.

  However, two specific considerations from recent literature suggest we cannot simply maintain the status quo of ignoring invertebrates:

  *   **Invertebrate Sentience Criteria:** Recent comparative neuroscience indicates that decapod crustaceans (shrimp, crabs) and cephalopods (octopuses) meet several key criteria for sentience previously assumed unique to vertebrates. These include the presence of nociceptors, centralized information integration, and evidence of motivational trade-offs (e.g., accepting a worse shelter to avoid a noxious stimulus). While the evidence for insects like black soldier flies is less robust, it is not non-existent.
  *   **Welfare Ranges:** The concept of "welfare ranges" suggests that even if invertebrates are sentient, the magnitude of their positive or negative experiences may differ significantly from vertebrates. This does not justify ignoring them, but it argues for *weighting* rather than *binary inclusion*.

  **Conclusion on Framing:** A strict sentience framing is the wrong *instrument* for a contract, but it is the correct *ethical foundation*. The policy should not ask vendors to determine sentience; it should categorize species based on current scientific consensus regarding their welfare capacity.

  **3. Addressing the "Certain Suffering" Objection**
  A significant bloc on this Committee has argued: *Why focus on bugs and shrimp when our chicken and egg procurement is known to be from high-suffering conditions?*

  This is the strongest practical objection to the current plan. If the University expands into insect protein (marketing it as "ethical") while maintaining conventional supply chains for vertebrates, we expose ourselves to accusations of virtue signaling. This undermines the credibility of the welfare policy entirely.

  The "welfare range" argument actually supports prioritizing vertebrates. If the magnitude of suffering in a factory-farmed hen is orders of magnitude higher than in a farmed cricket, utilitarian calculus demands we secure the hen's welfare first. Ignoring this hierarchy creates a moral hazard where we feel virtuous about avoiding "maybe" suffering while perpetuating "definite" suffering.

  **4. Recommendation and Action Plan**
  I propose the Committee vote on the following **Tiered Welfare Procurement Policy**:

  **Action 1: Immediate Pause on Invertebrate Expansion**
  *   **Decision:** Place the BSFL two-year contract on hold for six (6) months.
  *   **Rationale:** We cannot ethically evaluate this contract without a defined framework for invertebrate welfare.

  **Action 2: Tier 1 Implementation (High-Certainty Sentience)**
  *   **Responsibility:** Procurement Office
  *   **Timeline:** Effective immediately for all renewals starting next fiscal quarter.
  *   **Policy:** All vertebrate products (poultry, eggs, pork, beef, fish) must meet verified third-party welfare standards (e.g., RSPCA Assured, Global G.A.P., or equivalent).
  *   **Goal:** Address the "certain suffering" objection to secure the policy's credibility.

  **Action 3: Tier 2 Review (Probationary Sentience)**
  *   **Responsibility:** A sub-committee including the Student Rep, a Biology Department faculty member, and the Catering Manager.
  *   **Timeline:** Report back to the full Committee within six (6) months.
  *   **Policy:** Commission a review of invertebrate procurement (shrimp and insects) using specific sentience criteria (nociception, trade-off behavior, analgesia response).
  *   **Goal:** Determine if the "welfare range" of our specific suppliers justifies procurement, rather than relying on marketing claims.

  **5. Conclusion**
  Adopting a vague "animal welfare" clause satisfies no one and changes nothing. Conversely, adopting a rigid "sentience" clause without addressing our existing vertebrate supply chain invites accusations of hypocrisy.

  This Tiered Approach allows the University to act immediately on high-certainty suffering (chickens/eggs) while treating the insect contract with the scientific scrutiny it requires. It acknowledges that while a shrimp may not suffer exactly like a chicken, the evidence that it suffers *at all* is now too strong to ignore, provided we have first secured the baseline welfare of the vertebrates we already consume.

  I move that we adopt this Tiered Framework and postpone the BSFL contract vote until the Tier 2 Review is complete.
