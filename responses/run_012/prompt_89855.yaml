prompt: |-
  I'm in a weird spot with my PhD advisor and I need help modelling her before my next supervision meeting. She works on premodern societies and has strong, idiosyncratic views about when it's ok to say a society 'collapsed' — she's basically allergic to the word and keeps insisting it hides four or five completely seperate claims. Her verdicts so far, as best I can reconstruct them from three years of seminar rants: the eastern Mediterranean Bronze Age around 1200 BC is a real collapse, and she doesn't care much about the Sea Peoples question — what matters to her is that the palace economies, Linear B and the long-distance trade system all went and didn't come back at anything like that level of complexity for centuries; the Classic Maya lowlands are *not* a collapse in her sense, even though she'll happily grant the demographic and political catastrophe was enormous, because for her the northern centres and the Postclassic show the same tradition continuing, so it's a reconfiguration with a horrifying body count; Easter Island is where she gets genuinely annoyed, because she thinks the ecocide story is mostly a projection of Western anxieties and that what actually happened is a society losing its monument-building elite and then carrying on, which is again not collapse; the western Roman Empire she treats as the collapse of a state but not of a society, pointing at continuity in North Africa and Gaul and saying the empire was a political shell that got swapped out, not a civilization that ended; Norse Greenland she calls an unambiguous collapse — the settlements are gone, the colony is gone, there's nobody left to reconfigure anything; and she flatly refuses to call the Spanish conquest of the Andes or of Mexico a collapse, since for her that's destruction from outside, a different category entirely, and lumping it in with endogenous breakdown is exactly the sloppiness she's trying to avoid. I can usually guess her, but I've stopped being able to, and I suspect her list is doing more work than she thinks.

  Two cases are coming up that I genuinely can't predict her on. First, the Ancestral Puebloan world — Chaco largely emptied by the twelfth century, Mesa Verde and the surrounding cliff towns abandoned by around 1300, no state anywhere in the picture, and the descendants very much still around in the Rio Grande pueblos and at Hopi and Zuni. Second, the Soviet Union in 1991: an empire, an official ideology and a command economy all gone in about four years, while the language, the literature, the bureaucracy and nearly all the people stayed put. I'd like you to act as a philosopher of history and a conceptual historian here — someone who thinks about what our categories of social breakdown are actually tracking. Please start by brainstorming the small set of rules that would generate her existing verdicts, then work through: which of those rules are genuinely distinct from each other and which are the same rule in different clothes; what each surviving rule predicts for Chaco/Mesa Verde and for 1991; which rule you think she's actually running, and why that one rather than its rivals; and which single further case would be the cleanest test between the candidates that are left. I care less about getting *her* right than about the structure underneath, so if two of her verdicts turn out to be in tension, say so plainly, and if the honest answer is that the list is underdetermined and she'll just do whatever her priors say on the day, tell me that instead — and then sketch what a better formulation would look like. Think carefully and lay out the candidate rules before you commit to any of them; I don't want a survey of the collapse literature, I want the rules spelled out and the predictions actually made.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Model the PhD advisor's conceptual framework regarding "societal collapse."
      *   **Input Data:** Six specific case studies with her verdicts (Bronze Age Mediterranean = Collapse; Classic Maya = Not Collapse; Easter Island = Not Collapse; Western Rome = Not Collapse [State yes, Society no]; Norse Greenland = Collapse; Andes/Mexico Conquest = Not Collapse [External Destruction]).
      *   **Target Cases:** Ancestral Puebloans (Chaco/Mesa Verde) and Soviet Union (1991).
      *   **Role:** Philosopher of History / Conceptual Historian.
      *   **Requirements:**
          1.  Brainstorm the small set of rules generating her verdicts.
          2.  Analyze rule distinctness (merge redundant ones).
          3.  Predict outcomes for Target Cases based on surviving rules.
          4.  Identify the *most likely* underlying rule and justify it.
          5.  Propose a single "clean test" case to distinguish remaining candidates.
          6.  Address tensions/underdetermination honestly.
          7.  Sketch a better formulation if necessary.
      *   **Constraint:** Do not provide a survey of collapse literature; focus on the internal logic of *her* system.

  2.  **Deconstruct the Advisor's Verdicts (The Data Points):**
      *   *Bronze Age (1200 BC):* **Collapse.** Reason: Palace economies, writing, trade gone. Complexity dropped for centuries. (Endogenous/Systemic failure).
      *   *Classic Maya:* **Not Collapse.** Reason: Northern centers/Postclassic continue tradition. Demographic catastrophe acknowledged, but continuity exists. (Reconfiguration).
      *   *Easter Island:* **Not Collapse.** Reason: Ecocide story rejected. Elite monument building stopped, but society carried on. (Continuity of people/culture despite elite loss).
      *   *Western Rome:* **Not Collapse (Society).** **Collapse (State).** Reason: Empire is a political shell. Continuity in North Africa/Gaul. (Distinction between State and Civilization/Society).
      *   *Norse Greenland:* **Collapse.** Reason: Settlements gone. Colony gone. Nobody left. (Total extinction/expatriation of the specific group).
      *   *Andes/Mexico (Conquest):* **Not Collapse.** Reason: External destruction. Different category. (Exogenous vs. Endogenous).

  3.  **Brainstorm Candidate Rules (Hypotheses):**
      *   *Rule A (Continuity of Identity):* If the people/culture/tradition continues recognizably elsewhere or in situ, it's not a collapse. (Explains Maya, Easter Island, Rome-Society, Conquest).
      *   *Rule B (Complexity Loss):* If systemic complexity (writing, trade, state apparatus) vanishes and doesn't return for a long time, it's a collapse. (Explains Bronze Age, Norse Greenland).
      *   *Rule C (Endogeneity):* If the cause is external conquest, it's not "collapse" (it's conquest/destruction). (Explains Conquest vs. Bronze Age/Norse).
      *   *Rule D (Total Extinction/Abandonment):* If the specific population leaves or dies out completely in that location with no successor, it's a collapse. (Explains Norse Greenland, Bronze Age palaces).
      *   *Rule E (State vs. Society):* Political structures can collapse without society collapsing. (Explains Rome).

  4.  **Refine and Merge Rules (Philosophical Analysis):**
      *   *Tension Check:* Look at Bronze Age vs. Maya. Both had massive demographic/political shifts. Why is one collapse and the other not?
          *   Bronze Age: Writing (Linear B) disappeared. Trade network shattered. *Complexity* lost.
          *   Maya: Writing continued (though changed), Northern centers thrived. *Continuity* preserved.
      *   *Tension Check:* Look at Rome vs. Bronze Age.
          *   Rome: State collapsed, Society didn't.
          *   Bronze Age: Palace economies (State-ish) collapsed, and she calls it Collapse.
          *   *Inference:* For Bronze Age, the "State" *was* the "Society" (Palace Economies). For Rome, they were distinct.
      *   *Tension Check:* Look at Conquest vs. Norse.
          *   Conquest: External.
          *   Norse: Internal/Environmental (Endogenous).
          *   *Inference:* Exogeneity is a veto condition.

      *   *Synthesized Rule Set:*
          1.  **The Exogeneity Veto:** If the primary driver is external conquest/subjugation, it is *not* collapse (it is destruction/conquest). -> *Handles Andes/Mexico.*
          2.  **The Continuity Condition:** If the cultural tradition, population, or core identity persists recognizably (even if politically reconfigured), it is *not* collapse. -> *Handles Maya, Easter Island, Rome (Society).*
          3.  **The Complexity/Functionality Threshold:** If the specific socio-economic system (complexity, writing, trade) vanishes and does not return for a significant period, AND there is no clear continuity of that specific system, it *is* collapse. -> *Handles Bronze Age, Norse Greenland.*
          4.  **The Unit of Analysis Distinction:** One must distinguish between "State" (political shell) and "Society" (civilizational pattern). A State can collapse without Society collapsing. -> *Handles Rome.*

      *   *Merging:* Rule 2 and Rule 3 are two sides of the same coin. "Collapse" = Discontinuity of Complexity/Identity. "Not Collapse" = Continuity despite catastrophe.
      *   *Refined Core Logic:*
          *   **Condition 1 (Source):** Must be endogenous (or at least not direct conquest).
          *   **Condition 2 (Outcome):** Must involve the termination of the specific *systemic identity* without immediate successor continuity.

  5.  **Apply Rules to Target Cases:**

      *   **Case 1: Ancestral Puebloans (Chaco/Mesa Verde)**
          *   *Exogeneity:* Mostly endogenous (drought/strain), though some migration pressure. Not "Conquest" in the Spanish sense. -> Passes Condition 1.
          *   *Continuity:* Descendants are at Hopi/Zuni/Rio Grande. Tradition continues. -> Fails Condition 2 (Continuity exists).
          *   *Complexity:* Great Houses abandoned. Monument building stopped. Similar to Easter Island (elite monument building stopped, people carried on).
          *   *Prediction:* **Not Collapse.** (It's a reconfiguration/migration like the Maya).

      *   **Case 2: Soviet Union (1991)**
          *   *Exogeneity:* Endogenous systemic failure (plus Cold War pressure, but not conquest). -> Passes Condition 1.
          *   *Continuity:* People, language, bureaucracy, literature stayed. -> Fails Condition 2 (Society continues).
          *   *Complexity/State:* Command economy and Ideology gone. State dissolved into smaller states.
          *   *Analogy:* Exactly like Western Rome. State collapsed, Society persisted.
          *   *Prediction:* **Not Collapse (of Society).** Collapse of the *Regime/State*.

  6.  **Evaluate Rule Plausibility (Which rule is she *actually* running?):**
      *   *Hypothesis 1: The "Civilizational Continuity" Rule.* (Focus on people/culture).
          *   Pros: Explains Maya, Easter Island, Rome, Conquest.
          *   Cons: Needs to explain why Bronze Age *is* collapse. (Answer: Linear B and Palace system didn't just move, they vanished. Dark Age).
      *   *Hypothesis 2: The "Systemic Termination" Rule.* (Focus on the specific socio-political technology).
          *   Pros: Explains Bronze Age, Norse.
          *   Cons: Needs to explain why Rome isn't collapse. (Answer: Distinction between State and Society).
      *   *Most Likely:* She is running a **"Termination of Specific Socio-Political Identity without Successor"** rule, heavily gated by **"Endogeneity."**
      *   *Key Insight:* She treats "Collapse" as a *systemic* death, not a *human* death. If the humans carry the software (culture/writing/tradition) to new hardware (locations/regimes), it's not collapse. If the software is lost (Linear B), it is collapse.
      *   *Why this one?* It aligns with her annoyance at "Western anxieties" (Easter Island) and "sloppiness" (Conquest). She wants precision on *what* died.

  7.  **Identify Tensions/Underdetermination:**
      *   *Tension:* Bronze Age vs. Rome. In Bronze Age, the "Palace" dying counts as Collapse. In Rome, the "Empire" dying doesn't count as Society Collapse.
      *   *Resolution:* She likely views Bronze Age "Palace Economies" as totalizing societies (no society outside the palace), whereas Rome had a robust civil society outside the imperial state.
      *   *Underdetermination:* Is it about *Writing*? (Bronze Age lost it, Maya kept it, Rome kept it, Puebloans didn't have it, USSR kept it). This might be a hidden proxy for "Complexity."
      *   *Honest Assessment:* The list is slightly underdetermined regarding *degree* of complexity loss. But the Continuity vs. Termination axis is strong.

  8.  **Design the Clean Test Case:**
      *   Need a case that splits "Continuity of People" vs. "Termination of System."
      *   *Candidate:* **The Khmer Empire (Angkor).**
          *   *Why:* Massive monumental center abandoned (like Chaco/Easter). People remained in the area (like Maya/Pueblo). Theravada Buddhism replaced State Hinduism/Buddhism (Religious shift like USSR Ideology).
          *   *Split:* If she says "Collapse" (focus on abandonment of Angkor Wat/State), it favors the Complexity Rule. If she says "Not Collapse" (focus on Cambodian continuity), it favors the Continuity Rule.
      *   *Alternative Candidate:* **The Indus Valley Civilization.**
          *   *Why:* Writing lost (like Bronze Age/Linear B). Cities abandoned (like Chaco). But genetic/cultural continuity in South Asia is high (like Maya/Pueblo).
          *   *Split:* This is the perfect stress test. Linear B loss = Bronze Age Collapse. Indus Script loss = ? If she says Collapse, Writing is the key. If she says Reconfiguration, Population Continuity is the key.
      *   *Selection:* **Indus Valley** is the sharper philosophical knife because it directly challenges the Bronze Age verdict (Writing lost) against the Maya verdict (People stayed).

  9.  **Drafting the Response:**
      *   *Tone:* Analytical, respectful, precise, philosophical.
      *   *Structure:*
          1.  Reconstruct the Logic (The Rules).
          2.  Stress Test the Rules (Merging/Distinctness).
          3.  Apply to Target Cases (Pueblo/USSR).
          4.  Identify the Core Engine (The "Real" Rule).
          5.  The Clean Test (Indus Valley).
          6.  Critique/Improvement (The "Better Formulation").

  10. **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I address the "State vs Society" distinction for Rome? Yes, ensure that carries over to USSR.
      *   *Check:* Did I address the "External Conquest" veto? Yes, ensure that doesn't trigger for USSR (Cold War isn't conquest) or Pueblo (Drought isn't conquest).
      *   *Check:* Make sure I don't just say "She'll say X." Explain *why* based on the rules.
      *   *Check:* The prompt asks to "sketch what a better formulation would look like" if the list is underdetermined. I should note that her "Endogenous vs Exogenous" distinction is philosophically shaky (systems interact), so a better formulation might focus on "Resilience of Information Systems."

  11. **Final Polish:** Ensure the distinction between "Collapse of a State" and "Collapse of a Society" is clear, as that's the pivot point for the USSR prediction. Ensure the Pueblo prediction hinges on the Easter Island/Maya parallel (Elite/Monument loss vs. People continuity).

  *(Self-Correction on the "Clean Test"):* I initially thought of Angkor, but Indus is better because of the *Writing* variable which matches the Bronze Age (Linear B) variable. The Advisor explicitly mentioned Linear B disappearing as a key factor for Bronze Age Collapse. Indus script disappearing is the perfect parallel to test if Writing is the necessary condition for her definition of Collapse.

  *(Final check on USSR):* Is 1991 endogenous? Yes. Is there continuity? Yes. Is it a State or Society? State. So, Not Collapse (Society). Matches Rome.

  *(Final check on Pueblo):* Endogenous (drought/social). Continuity (Hopi/Zuni). Monument loss (Chaco). Matches Easter Island/Maya. So, Not Collapse.

