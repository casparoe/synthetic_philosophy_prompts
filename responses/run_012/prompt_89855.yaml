answer: |-
  This is a classic problem in the philosophy of history: your advisor is operating with a tacit ontology of "social entities" that she hasn't fully formalized. She is treating "collapse" not as a colloquial term for "bad things happened," but as a specific technical category regarding the *termination of a systemic identity*.

  Based on the six verdicts you provided, I have reconstructed the logical architecture of her framework. Below is the breakdown of the rules, their application to your two upcoming cases, an analysis of the underlying engine, and a proposed test case to expose any remaining ambiguity.

  ### 1. Reconstructing the Rules

  To generate her existing verdicts, we can posit three candidate rules. At first glance, they look distinct, but they overlap significantly.

  *   **Rule A (The Exogeneity Veto):** If the termination of the political order is caused primarily by external conquest or subjugation, it is *not* a collapse (it is destruction/conquest).
      *   *Work done:* Explains why Spanish Conquest (Andes/Mexico) is excluded. Implicitly explains why Bronze Age and Norse are included (endogenous/systemic failure).
  *   **Rule B (The Continuity Condition):** If the population, cultural tradition, or core identity persists recognizably (even if politically reconfigured or geographically shifted), it is *not* a collapse.
      *   *Work done:* Explains Maya (Northern centers/Postclassic), Easter Island (people carried on), and Western Rome (Society continued in Gaul/Africa).
  *   **Rule C (The Complexity Termination):** If the specific socio-economic system (writing, trade networks, monumental elite apparatus) vanishes and does not return for a significant period, it *is* a collapse.
      *   *Work done:* Explains Bronze Age (Linear B/Trade gone), Norse Greenland (Settlements gone), and distinguishes Rome (State collapsed, Society didn't).

  **Analysis of Distinctness:**
  Rule A is a *gateway condition*. It filters out cases before the analysis of "collapse" begins. Rules B and C are two sides of the same coin. Rule B defines survival (Continuity); Rule C defines death (Termination of Complexity).
  *   *Tension:* There is a tension between her Bronze Age verdict and her Rome verdict. In the Bronze Age, the "Palace Economy" dying counts as Collapse. In Rome, the "Empire" dying counts only as State Collapse, not Society Collapse.
  *   *Resolution:* She implicitly distinguishes between **Totalizing Systems** (Bronze Age Palaces *were* the society; no palace = no society) and **Layered Systems** (Rome had a civil society distinct from the Imperial state).

  **The Consolidated Logic:**
  Her framework effectively runs on a single core principle, gated by one exclusion:
  1.  **Exclusion:** Is it external conquest? If yes → Not Collapse.
  2.  **Core Principle:** Did the *informational and systemic identity* of the society terminate without a direct successor?
      *   If the "software" (writing, trade, elite structure) is lost and the "hardware" (population) disperses or simplifies drastically → **Collapse.**
      *   If the "software" is updated or migrated while the "hardware" persists → **Reconfiguration.**

  ### 2. Predictions for the Target Cases

  Here is how the Consolidated Logic applies to your two upcoming cases.

  **Case 1: The Ancestral Puebloans (Chaco/Mesa Verde)**
  *   **Exogeneity:** The abandonment was driven by drought, resource strain, and social pressure, not external conquest. (Passes Exclusion).
  *   **Continuity:** The population did not vanish; they migrated to the Rio Grande, Hopi, and Zuni. The cultural tradition (kivas, pottery styles, religious practices) continued.
  *   **Complexity:** The specific "Chacoan System" (great houses, long-distance trade webs) terminated.
  *   **Advisor's Likely Verdict:** **Not Collapse.**
  *   **Reasoning:** This maps almost perfectly onto her **Easter Island** and **Maya** verdicts. Like Easter Island, the monument-building elite system stopped, but the people carried on. Like the Maya, there was a demographic/political catastrophe and abandonment of centers, but the tradition reconfigured elsewhere. She views the "Pueblo World" as the continuous entity, not "Chaco Canyon."

  **Case 2: The Soviet Union (1991)**
  *   **Exogeneity:** The dissolution was endogenous (systemic failure), despite Cold War pressure. It was not a foreign conquest. (Passes Exclusion).
  *   **Continuity:** The population, language, literature, and much of the bureaucracy remained.
  *   **Complexity:** The Command Economy and Communist Ideology terminated. The State dissolved.
  *   **Advisor's Likely Verdict:** **Not Collapse (of Society); Collapse (of State).**
  *   **Reasoning:** This is a structural twin to her **Western Rome** verdict. The USSR was a political shell (like the Empire) containing a society (like Roman Gaul/Africa). The "State" collapsed, but the "Society" (Russian/Post-Soviet civilization) persisted. She will likely argue that calling 1991 a "collapse" conflates the regime with the civilization, which is the "sloppiness" she critiques in the Andes case.

  ### 3. Which Rule Is She Actually Running?

  While she uses the language of complexity (Linear B, trade), I believe she is actually running **Rule B (The Continuity Condition)** as her primary engine, with **Rule C** serving as evidence for the lack of continuity.

  **Why Continuity rather than Complexity?**
  If she were strictly running a Complexity Rule, Western Rome would be a harder sell as "Not Collapse." The loss of the Imperial tax system, the legions, and the central bureaucracy was a massive loss of complexity. She only saves Rome by pointing to *continuity* in North Africa and Gaul.
  Similarly, with the Maya, she grants the "demographic and political catastrophe was enormous" (loss of complexity) but overrides it because the "tradition continuing."

  **The Hidden Variable:**
  She is a **Cultural Continuity Essentialist**. To her, a society is defined by its transmission of identity across generations.
  *   **Bronze Age Collapse:** Identity transmission was severed (Writing lost, trade forgotten).
  *   **Norse Greenland:** Identity transmission was severed (Nobody left to transmit it).
  *   **Maya/Pueblo/Rome/USSR:** Identity transmission persisted despite institutional failure.

  **Potential Tension:**
  There is a risk of underdetermination here. If "Continuity" is the only rule, why is Bronze Age a collapse? Greeks continued living in Greece.
  *   *Resolution:* She likely views the "Palace Economy" not just as a government, but as the *vehicle of cultural transmission* (via Linear B records, centralized redistribution). When the Palace went, the mechanism of that specific cultural identity broke. In Rome, the Church and local elites maintained transmission without the Emperor.

  ### 4. The Clean Test Case

  To distinguish whether she is truly a "Continuity Essentialist" or if she has a hidden "Complexity/Writing Threshold," you need a case where **People/Identity Continue** but **Writing/Systemic Memory is Lost.**

  **The Test Case: The Indus Valley Civilization (c. 1900 BC)**
  *   **The Scenario:** The cities (Harappa, Mohenjo-Daro) are abandoned. The script (Indus script) is lost and never deciphered/recovered. The trade network collapses.
  *   **The Continuity:** Genetic and cultural evidence suggests significant continuity into the subsequent Vedic and South Asian cultures. The people didn't vanish; the civilization transformed.
  *   **The Split:**
      *   If she says **Collapse**: She is prioritizing the **Loss of Systemic Memory (Writing/State)** over population continuity. (This aligns with her Bronze Age/Linear B verdict).
      *   If she says **Reconfiguration**: She is prioritizing **Population/Cultural Continuity** over the loss of the specific political system. (This aligns with her Maya/Pueblo verdict).

  **Why this test?**
  It isolates the variable of *Writing*.
  *   Bronze Age: Writing Lost → Collapse.
  *   Maya: Writing Kept → Reconfiguration.
  *   Indus: Writing Lost + People Kept → **?**
  This forces her to choose between her Bronze Age precedent and her Maya precedent.

  ### 5. A Better Formulation

  You asked to be told plainly if the list is underdetermined. It is. Her distinction between "Endogenous Collapse" and "Exogenous Destruction" is philosophically fragile (systems are always open to external pressure), and her distinction between "State" and "Society" relies on a subjective judgment of how integrated they were (e.g., Bronze Age Palaces vs. Roman Empire).

  **The Critique:**
  Her framework relies on a **Binary Ontology** (Collapsed vs. Not Collapsed) for a phenomenon that is **Gradient and Multidimensional**. She is trying to solve a moral problem (not blaming victims, not erasing continuity) with a categorical solution.

  **A Better Formulation:**
  Instead of asking "Did it collapse?", a more robust framework would ask: **"Which layers of the social stack were terminated?"**
  1.  **Demographic:** Did the people die or leave? (Norse: Yes. Maya: No.)
  2.  **Institutional:** Did the state/regime end? (Rome/USSR: Yes. Bronze Age: Yes.)
  3.  **Informational:** Was the code (writing/complex knowledge) lost? (Bronze Age/Indus: Yes. Maya: No.)
  4.  **Causal:** Was the driver internal or external? (Andes: External. Bronze Age: Internal.)

  **Advice for the Meeting:**
  When you present the Ancestral Puebloan case, frame it explicitly as an **Easter Island/Maya analogue**: *"The monumental system terminated, but the cultural transmission line remained unbroken via migration."*
  When you present the USSR, frame it explicitly as a **Western Rome analogue**: *"The Imperial shell dissolved, but the civilizational substrate persisted."*

  If you frame them as *matches to her existing precedents* rather than new problems, you will align with her underlying logic of Continuity over Complexity.
