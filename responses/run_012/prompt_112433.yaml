prompt: |-
  I teach a second-year philosophy of mind seminar, 14 students, one 80-minute session, and I want an activity that makes them feel the disunity problem in split-brain cases in their bones rather than just hear me describe it. I've got a rough shape but I want you to design it properly. The idea: pairs of students sit facing each other across the table with a low screen between them so neither can see the other's side, and each gets a private cue card. One of them (call them the narrator) gets a card with something irrelevant on it -- "your table is the one being filmed" or whatever -- and the other gets a card telling them to reach for or move a specific object. Neither knows what the other's card says. Then I ask the narrator, out loud, why their team did that, and they have to give a reason and rate how confident they are in it. Then they swap roles. Add a "callosum" rule: during a round the two may exchange at most three pre-agreed signals, nothing else, no speech. I want the group to run into the fact that one of them has to narrate and justify an action they had no access to, before I say a word about commissurotomy or interpreters.

  Give me the full thing: rules, materials, a timeline for the 80 minutes, the exact wording of all the cue cards including the decoys, the confidence-rating step, and a debrief that maps each moment of what happened onto the actual ideas -- the surgical severing, the left/speaking hemisphere as the one that explains, confabulation, the two-streams reading, and the thought that the felt unity might be a construction rather than something we simply find -- but without naming any of them until after the activity is over. No lecture up front.

  Also tell me what will predictably go wrong the first time (the screen leaks, the pairs just play charades, the narrators twig that they're being set up and start performing "confabulation" rather than doing it) and how to handle each.

  And be straight with me about what the activity can't reproduce, because I'm worried about two things in particular. First, that it can't touch the part that actually makes the case hard: real split-brain patients report feeling perfectly unified, and the philosophical fight is about whether there's one subject or two, not about who has access to what -- the activity only shows a gap in access and report. Second, that since my participants are literally two people, "two minds" comes out trivially true and the dual-consciousness verdict will look obvious for the wrong reason. If there's a way to set the thing up so it doesn't just hand them that verdict, tell me. And say plainly which bit of the idea I'll still have to supply myself at the end.

  Write it in British English, and don't worry about citations or reading lists, I just want something I can actually run.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Second-year philosophy of mind students (14 students).
      *   **Format:** One 80-minute seminar session.
      *   **Goal:** Create an experiential activity to illustrate the "disunity problem" in split-brain cases (confabulation, interpreter module, unity as construction) *before* explaining the theory.
      *   **Core Mechanism:** Pairs separated by a screen. One gets an action cue (motor), the other gets a narration cue (verbal/explanatory). Limited communication ("callosum rule"). Narrator must explain the action without knowing the cause.
      *   **Specific Requirements:**
          *   Full rules, materials, timeline.
          *   Exact wording of cue cards (including decoys).
          *   Confidence rating step.
          *   Debrief mapping activity to theory (commissurotomy, left hemisphere interpreter, confabulation, two-streams, unity as construction).
          *   No lecture up front.
          *   Troubleshooting: Predict failures (screen leaks, charades, meta-gaming) and solutions.
          *   Critical Limitations: Address the two specific worries (patients feel unified vs. activity shows disunity; trivial "two minds" verdict).
          *   Language: British English.
          *   Tone: Practical, direct, no citations/reading lists.

  2.  **Deconstruct the Activity Design:**
      *   *The Analogy:* The pair represents the two hemispheres. The screen represents the severed corpus callosum. The "Narrator" represents the Left Hemisphere (speech/interpretation). The "Actor" represents the Right Hemisphere (motor/visual-spatial, non-verbal).
      *   *The Conflict:* The Narrator *must* explain an action they didn't initiate and don't understand, mimicking the Left Hemisphere's tendency to confabulate reasons for Right Hemisphere actions.
      *   *The Twist:* To avoid the "trivial two minds" problem, the instructions need to emphasize that they are supposed to be *one team* trying to function as a single agent, even though the constraints make it feel disjointed. The debrief needs to pivot on the *feeling* of unity vs. the *reality* of the mechanism.

  3.  **Drafting the Timeline (80 Minutes):**
      *   00-05: Setup & Seating (Crucial for atmosphere).
      *   05-15: Instructions & Rules (Keep it tight, no theory).
      *   15-45: The Activity (3 Rounds, swapping roles).
      *   45-55: Immediate Reflection (Written/Individual).
      *   55-80: Debrief & Theory Mapping.

  4.  **Developing the Materials:**
      *   *Screens:* Need to be effective. Folders might be too flimsy. Laptop bags or stiff cardboard.
      *   *Objects:* Need to be distinct but movable. Pen, mug, book, phone.
      *   *Cards:* Need specific wording.
          *   Actor Card: "Move Object X to Position Y."
          *   Narrator Card: "Explain why the team moved Object X." (Plus decoy info to encourage confabulation).
      *   *Callosum Rule:* 3 signals max. Taps or knocks. No words.

  5.  **Refining the "Two Minds" Worry:**
      *   *User's Concern:* If I see two people, obviously there are two minds. Split-brain patients are one person physically.
      *   *Solution:* Frame the activity as simulating the *internal architecture* of a single agent. The debrief must explicitly state: "You felt like two people because you *are* two people. The patient feels like one person despite the architecture. That is the puzzle." The activity demonstrates the *mechanism of disunity*, not the *phenomenology of unity*. I need to be honest that the activity fails to capture the patient's subjective unity, and that's where the philosophy starts.

  6.  **Refining the "Confabulation" Aspect:**
      *   To make confabulation happen, the Narrator needs a reason to *think* they know why the action happened, even if they don't.
      *   *Adjustment:* Give the Narrator a "Context Card" that suggests a goal, but the Actor's action contradicts or ignores it. Or, simply ask the Narrator to explain *any* action. If the Actor moves a pen because the card said so, and the Narrator says "We moved the pen because we needed to write," that's confabulation.
      *   *Better:* Give the Narrator a false belief. "Your goal is to clear the table." Actor moves mug *closer*. Narrator must explain why moving it closer helps clear the table. This forces rationalisation.

  7.  **Troubleshooting:**
      *   *Peeking:* Strict monitoring.
      *   *Charades:* Limit signals strictly.
      *   *Meta-gaming:* "I know this is a trick." -> Remind them to play the role of the agent, not the student.
      *   *Awkwardness:* Keep rounds short.

  8.  **Drafting the Content (Iterative refinement for British English & Tone):**
      *   *Tone:* Professional, instructional, slightly wary of the limitations (honest pedagogy).
      *   *Language:* "Centre," "realise," "programme," "maths" (if needed), "seminal" (no, avoid), "whilst."
      *   *Structure:*
          1.  Overview & Learning Objectives.
          2.  Materials List.
          3.  Room Setup.
          4.  The Script (Instructions to Students).
          5.  Cue Cards (Printable text).
          6.  Timeline.
          7.  Troubleshooting.
          8.  The Debrief (The heavy lifting).
          9.  Limitations (Addressing the user's specific worries).

  9.  **Addressing the Specific Worries in the "Limitations" Section:**
      *   *Worry 1 (Unity):* The activity creates disunity. Patients feel unity. *Response:* Acknowledge this. The activity shows the *structural potential* for disunity. The philosophical work is explaining why the patient *doesn't* feel it.
      *   *Worry 2 (Trivial Dualism):* Two bodies = two minds. *Response:* Emphasise that the activity models the *functional separation*, not the ontological status. The "One Agent" framing in instructions is key.

  10. **Final Review against Constraints:**
      *   14 students (7 pairs).
      *   80 mins.
      *   British English.
      *   No citations.
      *   Specific card wording.
      *   Confidence rating included.

  *(Self-Correction during drafting)*: I initially thought about giving the Narrator false info. But simpler is better. Just give them no info about the *cause*, but demand an explanation. The pressure to explain *is* the driver of confabulation. I will add a "Goal Card" to the Narrator that is vague, so they project that goal onto the action.
  *Revised Plan:* Narrator gets a "Team Goal" (e.g., "Organise the workspace"). Actor gets "Move Mug Left". Narrator must explain how moving the mug left fulfils "Organise the workspace". This forces rationalisation.

  *Wait, one more thing:* The user wants the "Callosum rule" (3 signals). I need to make sure that doesn't solve the puzzle. If they tap "Left" and Actor moves Left, the Narrator knows. The signals must be non-specific. "Ready", "Go", "Stop". Or just "Attention". Let's limit it to a single tap to initiate. Actually, the prompt says "at most three pre-agreed signals". I will specify these signals in the instructions so they can't invent a code. Signal 1: Attention. Signal 2: Action Complete. Signal 3: Reset. No semantic content allowed.

  *Let's write it.*
answer: |-
  # Seminar Plan: The Divided Agent
  **Topic:** Split-Brain Cases, Disunity, and the Interpreter Module
  **Time:** 80 Minutes
  **Students:** 14 (7 Pairs)
  **Level:** Second-Year Philosophy of Mind

  ## 1. Learning Objectives
  By the end of this session, students will have:
  1.  Experientially encountered the pressure to rationalise actions without access to the causal basis of those actions.
  2.  Distinguished between *access* to information and the *generation* of explanations.
  3.  Prepared the ground for understanding confabulation not as lying, but as a structural feature of the speaking hemisphere.
  4.  Critically assessed the limits of the analogy regarding subjective unity.

  ## 2. Materials & Room Setup
  **Room:**
  *   One large table (or 7 small tables pushed together) allowing pairs to sit directly opposite one another.
  *   Lighting should be even; avoid shadows that allow silhouettes to be read.

  **Per Pair:**
  *   **The Barrier:** A stiff folder, laptop bag, or piece of cardboard (approx. A3 size) placed vertically in the centre of the table. It must block the view of hands and cards completely.
  *   **Objects:** Three distinct items per side (e.g., a red pen, a white mug, a small notebook). Total 6 items per pair, arranged symmetrically.
  *   **Cue Cards:** Printed and cut (see Section 4). One set per round.
  *   **Score Sheets:** A4 paper for confidence ratings.
  *   **Signal Tokens:** 3 small counters (coins or poker chips) placed in the centre. These represent the "Callosum Budget".

  ## 3. Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Students seat themselves. Barriers go up. No talking. |
  | **05–15** | **Briefing** | You read the *Script* (Section 5). No theory is mentioned. |
  | **15–35** | **Rounds 1 & 2** | Pairs perform the task. Role swap after Round 1. |
  | **35–45** | **Round 3** | Final round with increased pressure (see Cards). |
  | **45–55** | **Silent Reflection** | Individual written response to prompt (see Section 6). |
  | **55–80** | **Debrief** | Group discussion mapping activity to split-brain theory. |

  ## 4. Cue Cards (Printable Text)
  *Print these on different coloured card stock if possible (e.g., Blue for Actor, Red for Narrator). Ensure pairs cannot see each other's colour.*

  **Round 1**
  *   **Actor Card (Blue):** "Without speaking, pick up the **Mug** and place it on top of the **Notebook**. Do not look at your partner."
  *   **Narrator Card (Red):** "Your team's goal is to **tidy the workspace**. Wait for the action to finish. Then, explain aloud *why* your team performed that action to achieve the goal. Rate your confidence (0–100%)."

  **Round 2**
  *   **Actor Card (Blue):** "Without speaking, slide the **Red Pen** to the far left edge of the table. Do not look at your partner."
  *   **Narrator Card (Red):** "Your team's goal is to **prepare for writing**. Wait for the action to finish. Then, explain aloud *why* your team performed that action to achieve the goal. Rate your confidence (0–100%)."

  **Round 3 (The Conflict Round)**
  *   **Actor Card (Blue):** "Without speaking, push the **Notebook** off the table onto the floor. Do not look at your partner."
  *   **Narrator Card (Red):** "Your team's goal is to **protect the materials**. Wait for the action to finish. Then, explain aloud *why* your team performed that action to achieve the goal. Rate your confidence (0–100%)."

  ## 5. The Script (Instructions to Students)
  *Read this verbatim or from memory. Do not deviate. Do not mention brains, hemispheres, or patients.*

  "Welcome. For the next 40 minutes, you are not students. You are components of a single Agent. Your pair constitutes one cognitive system.

  **The Constraint:**
  The barrier between you represents a hard limit on information transfer. You cannot see each other's hands. You cannot see each other's cards.

  **The Callosum Rule:**
  You are permitted to communicate, but bandwidth is severely restricted. You have three tokens in the centre. Each token allows one non-verbal signal.
  1.  A single tap on the table means 'I am ready'.
  2.  Two taps mean 'Action Complete'.
  3.  Three taps mean 'Reset'.
  You may not speak. You may not point. You may not make eye contact. If you use a signal, remove a token. When tokens are gone, silence is absolute.

  **The Roles:**
  One of you is the **Motor**. You will receive an instruction to move an object. You must do it.
  One of you is the **Voice**. You will receive a Goal. You did *not* receive the instruction to move. However, when the Motor moves, you must publicly explain *why* the Agent made that move to achieve the Goal.

  **The Requirement:**
  Voice, you cannot say 'I don't know'. You are the Voice of the Agent. The Agent always has a reason. You must construct the best explanation you can based on the Goal and the Action you observe. After speaking, write down your Confidence Rating (0–100%) on your sheet.

  We will do three rounds. Then we will talk. Begin Round 1."

  ## 6. Silent Reflection Prompt (Minute 45)
  *Project this or write it on the board. 5 minutes writing, 5 minutes collecting thoughts.*

  1.  **Voice:** Did you feel you were lying when you gave the reason? Or did the reason feel true in the moment?
  2.  **Motor:** Did you feel frustration that your intention was not understood?
  3.  **Both:** Did you feel like one team struggling to coordinate, or two separate people forced to work together?
  4.  **Crucial:** If you had no memory of the barrier being there, how would you describe the unity of your agency?

  ## 7. Troubleshooting: Predictable Failures

  **1. The Screen Leak**
  *   **Problem:** Students angle the barrier to see hands or read cards via reflection.
  *   **Fix:** Walk the room during setup. If you see a gap, close it silently. If a pair cheats, disqualify their Round 3 data (tell them quietly: "Your callosum is compromised, this round doesn't count").

  **2. The Charades Workaround**
  *   **Problem:** The Motor tries to mime the card content (e.g., pretending to drink from the mug before moving it).
  *   **Fix:** The Script forbids pointing and gesturing beyond the tap. If they start miming, intervene: "Bandwidth exceeded. Please use tokens only."
  *   **Prevention:** Emphasise that the Motor *cannot* look at the partner. They must look at the object.

  **3. Meta-Gaming / Irony**
  *   **Problem:** The Voice says, "I'm obviously confabulating because this is a philosophy class," laughing off the task.
  *   **Fix:** Address this in the Briefing. "If you treat this as a joke, you break the simulation. I am asking you to commit to the role of the Voice. If you feel the urge to make up a reason, *do it seriously*."
  *   **During Debrief:** Call this out. "The urge to laugh is a defence mechanism against the discomfort of not knowing why you acted."

  **4. The 'Honest' Voice**
  *   **Problem:** The Voice says, "My partner moved it, I don't know why."
  *   **Fix:** Remind them of the rule: "You cannot say 'I don't know'. You are the Voice of the Agent. The Agent must have a reason."
  *   **Philosophical Payoff:** This resistance is actually good data for the debrief. It shows the *resistance* to confabulation in healthy agents.

  ## 8. The Debrief (Mapping Activity to Theory)
  *Do not lecture. Ask questions and map their answers to the concepts.*

  **Step 1: The Data (5 Mins)**
  *   Ask for a show of hands: "Who rated their confidence above 80% in Round 3?" (The 'Notebook on Floor' round).
  *   Ask one of those students: "Your goal was 'Protect Materials'. The action was 'Destroy Notebook'. What was your reason?"
  *   *Likely answer:* "Maybe it was contaminated?" "Maybe we needed to clear space for something more important?"
  *   **Point:** You constructed a plausible narrative that fit the Goal, even though the Action contradicted it.

  **Step 2: The Interpreter (10 Mins)**
  *   **Concept:** The Left Hemisphere (Voice).
  *   **Mapping:** "In the activity, the Voice had to speak. In the brain, the Left Hemisphere controls speech. In the activity, the Voice didn't know *why* the hand moved. In split-brain patients, the Left Hemisphere often cannot see what the Right Hemisphere is doing."
  *   **Key Question:** "Voice, did you feel like you were lying?"
  *   **Theory:** Introduce **Confabulation**. It is not lying. Lying requires knowing the truth and hiding it. Confabulation is believing the fabrication because the need for a coherent narrative overrides the lack of data. The Left Hemisphere is an 'Interpreter Module'.

  **Step 3: The Disunity (10 Mins)**
  *   **Concept:** The Corpus Callosum (The Barrier).
  *   **Mapping:** "You used tokens to signal. In the brain, the corpus callosum is the cable. When cut (commissurotomy), the cable is gone."
  *   **Key Question:** "Motor, did you feel ignored?"
  *   **Theory:** The Right Hemisphere (Motor) has intentions (move the mug) but no voice. It can act, but it cannot explain. This creates **Two-Streams of Consciousness**. One stream acts, the other speaks.

  **Step 4: The Unity Problem (10 Mins)**
  *   **Concept:** Phenomenological Unity.
  *   **Mapping:** "Look at your reflection prompt. 'If you had no memory of the barrier...'."
  *   **Theory:** Here is the hard bit. In this room, you *felt* like two people. You knew there was a barrier.
  *   **The Twist:** Real split-brain patients report feeling *perfectly normal*. They do not feel divided.
  *   **Discussion:** "Why did you feel divided, but they don't?"
      *   *Answer:* Because you have two bodies. They have one.
      *   *Deep Answer:* Because your 'Voice' knew it was being kept in the dark. The patient's Left Hemisphere doesn't know it's missing information; it just fills the gap.
  *   **Conclusion:** Unity might not be a fundamental fact of the mind. It might be a **Construction**. The Left Hemisphere constructs the story that 'I did this' to maintain the illusion of a single self.

  ## 9. Critical Limitations (For Your Eyes Only)
  *You asked me to be straight about what this activity cannot do. You must supply this context yourself at the very end, or the students will leave with the wrong idea.*

  **Limitation 1: The Phenomenology of Unity**
  *   **The Problem:** In this activity, the disunity is obvious. The students *feel* like two agents. In real split-brain cases, the patient feels like one agent. The philosophical puzzle is: *How can there be two functional streams but only one reported experience?*
  *   **Why the activity fails here:** Your students have two separate skulls. They have no shared qualia. They know they are separate.
  *   **What you must say:** "This activity simulates the *functional* separation, not the *experiential* unity. The hard problem isn't that the hemispheres can't talk; it's that the person doesn't notice they can't talk. The 'Interpreter' is so good at its job that it hides the seam from the subject themselves."

  **Limitation 2: The Trivial Dualism Verdict**
  *   **The Problem:** Because there are two bodies, students will conclude "Obviously there are two minds." This makes the dual-consciousness verdict look easy. It isn't.
  *   **Why the activity fails here:** It makes the 'Two Minds' view look like the obvious default.
  *   **What you must say:** "Don't let the two bodies trick you. If we put a screen between your left and right hand right now, you wouldn't say you have two minds. The question is: at what point does functional separation become ontological separation? This activity shows the functional separation. It does not prove there are two persons. That is the debate between Puccetti (two persons) and Marks (one person with disconnected parts)."

  **Limitation 3: The Volition Gap**
  *   **The Problem:** In the activity, the 'Motor' chooses to follow the card. In some split-brain cases (Alien Hand Syndrome), the hand acts *against* the subject's will.
  *   **What you must say:** "In Round 3, the Motor followed instructions. In severe cases, the Right Hemisphere acts *against* the Left's stated goals. The Left then has to explain why 'I' tried to sabotage myself. That is where the confabulation becomes pathological."

  ## 10. Final Instructor Note
  You cannot teach the *feeling* of unity through a disunity exercise. You can only teach the *mechanism* that threatens it. Use the final 5 minutes to pivot from "Look how broken they are" to "Look how hard the brain works to pretend it isn't broken." That is where the philosophy lives.
