prompt: |-
  So I'm running a four-week reading group for grad students in sociology and philosophy of social science — mostly people who read the Protestant Ethic once in a seminar and think they know it, which is the problem. Week 3 is the one I care about: can culture be a cause? using Weber as the test case, and I need to plan the session rather than just show up and talk. Don't explain the thesis to me; I know it. Tell me how to teach it.

  Here's what I want the session to actually land: the difference between three things that all get called "the Weber thesis" — (1) Protestant beliefs caused capitalism, a causal claim; (2) capitalist institutions, once running, selected for people with Protestant-ish dispositions, so the beliefs persisted for their economic effects, a selection/reproduction claim; and (3) the elective-affinity thing, where the beliefs and the economic form fit each other without either causing the other in any straightforward sense. My students will collapse all three into (1) within ten minutes unless the sequence stops them, and honestly a lot of published work collapses them too.

  The other thing I want them to get, and this is where I think the real dependency sits: Weber's causal machinery in the methodological essays — the counterfactual test where you ask what would have happened if the religious factor had been absent, hold everything else fixed, then ask whether the remaining conditions "generally" or "adequately" produce the outcome. That's the part that makes the thesis a causal thesis at all, and it's the part nobody teaches. So the plan has to put that machinery in place *before* they can even evaluate the claim, which means the sessions order is doing real work. I also need them to see that the choice of what to hold fixed isn't innocent — the ideal type of "the spirit of capitalism" is built partly out of the investigator's values, so the counterfactual is value-laden before you even run it.

  What I need from you:

  - The order the pieces have to come in, and for each step, what depends on what. Be specific about where the ideal-type construction goes relative to the counterfactual test, because I keep getting that wrong when I improvise.
  - The one carrying example. My instinct is NOT to use Franklin (they'll have read it and it turns the whole thing into a text-comprehension exercise) and NOT to use "Protestant countries are richer" (that's a correlation they'll fight about instead of the concept). I want one example that carries the whole session, and I want you to pick it and defend it — it has to be something they can hold in their heads without notes, it has to have a real counterfactual, and it has to be able to show the difference between the three claims above. If a modern case (some subculture that reproduces itself through economic success, or a firm or industry with a distinctive ethos) does this better than a historical one, make that call and say why. Don't hand me a menu; pick one.
  - The misconceptions, in the order they'll actually surface, and exactly where in the sequence I head each off. I'm expecting at least: "so Weber says ideas beat material interests" (the anti-Marx reading), "it's just a just-so story, no test possible," "the counterfactual is unfalsifiable so the whole thing is soft," "elective affinity is a cop-out that means we don't know," and "if some Catholic regions industrialized then Weber is refuted." I'm sure I'm missing some; add them and place them.
  - The check for understanding at the end: one thing I can ask or have them do that shows they've got the dependency structure and not just the vocabulary. I don't want a quiz on who wrote what.
  - What I should openly refuse to do at this level. I'd rather say "we are not settling X today" out loud than have them leave thinking the session answered it.

  Be committed: make the calls, don't lay out options for me to choose from. If you think my framing of the three claims is wrong, or that counterfactual-first is a mistake, say so and tell me what to do instead. And flag anywhere I'm leaning on a contested reading of Weber rather than the plain text, since I'm teaching this to people who will check.
