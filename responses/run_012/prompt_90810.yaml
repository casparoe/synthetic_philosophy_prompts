answer: |-
  Dear Friend,

  I have been thinking deeply about your letter and the trouble you and your friends have had in settling this argument, and it seems to me that you have correctly identified the source of the stalemate as a lack of agreement on what a good answer would even look like. You asked for a specification of the requirements any account must meet to rank these three communities adequately, and I will lay those out for you now with the care they deserve. An adequate account must explain what is actually known about where these patterns tend to arise because a moral theory that ignores the material conditions sustaining a practice is merely abstract speculation. It must account for how the same code can be a burden to the very people it governs because the moral cost of a system includes the pressure it places on its own adherents to conform. The account cannot collapse the distinction between a code and the people living under it because criticizing a social script is not the same as condemning the humans who must perform it. It must not confuse the standing of a practice with the standing of a person because a community can maintain worthy individuals even while operating under flawed norms. It cannot equate what a culture demands with what its members manage to do because individuals often resist or nuance the expectations placed upon them. The account must avoid simply assuming the standards of one of the three and calling that the answer because using one competitor as the judge ensures the verdict is rigged from the start. It must distinguish between which is morally better and which is more pleasant to live in because comfort is not a reliable proxy for virtue.

  Now I must address your suspicion that the list itself rules something out, and I believe you are right to feel that tension. The requirement to avoid assuming the standards of one of the three cannot be fully satisfied alongside the requirement to rank them morally, since any moral language we possess to make such a ranking is likely situated within one of these traditions anyway. If we judge the honor culture by the standards of dignity, we have violated the neutrality rule, but if we judge it by no standards, we have no verdict to give. Despite this impossibility, the requirement that does the most work in narrowing the field is the one forbidding the collapse of the distinction between a code and the people, as this prevents the evaluation from becoming a prejudice against entire populations and forces us to look at the structure of the expectations rather than the character of the inhabitants.

  When we apply this list to the three ways of ranking, each fares differently against the constraints. A ranking that favors the first sort of community often fails the burden requirement because it struggles to explain why the necessity of violence is a moral good rather than a tragic necessity, and it frequently collapses the code with the people by implying those who avoid fights are cowardly rather than constrained. A ranking that favors the second sort often fails the neutrality requirement because it smuggles its own preference for impartiality and intrinsic worth in as a universal truth rather than acknowledging it as a specific cultural development that arose under particular conditions of state strength. A ranking that favors the third sort risks contradicting the empirical requirement by treating injury as inherently public and competitive rather than contextual, and it sometimes struggles to distinguish between what the culture demands in terms of victimhood and what members manage to do in terms of genuine redress. You can see now why your argument has lasted for months, as each side is likely championing a ranking that satisfies some requirements while violating others, and until you agree on which requirements matter most, you will continue to talk past one another. I hope this helps you move forward, not by giving you the answer, but by showing you why the question is so hard to ask.
