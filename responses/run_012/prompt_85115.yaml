  *Refining Rank 1:* The strongest challenge is the "Integration Argument." If the music and drama are too disconnected, the music doesn't reveal truth; it reveals *mismatch*. Williams assumes a successful opera achieves the revelation. But what defines success? If dramatic coherence is part of the success condition, he's wrong.

