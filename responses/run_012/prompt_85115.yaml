      *   **User's Stance:** Convinced by Williams. Believes judging opera by dramatic realism/coherence is a category mistake. Believes the value lies in what music does that spoken drama can't.
      *   **Task:** Provide counter-arguments/cases that would challenge this view.
      *   **Specific Requirements:**
          *   Identify operas where drama seems primary or music does little work.
          *   Present the strongest case for the "opera as drama" side.
