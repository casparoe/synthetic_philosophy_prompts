          *   **Ranking:** Order the arguments from "forces real revision" to "he already has an answer."

  2.  **Recall/Research Bernard Williams's Views on Opera:**
      *   Key Essay: "Opera as a Philosophical Problem" (in *On Opera*, edited by A. C. Grayling).
      *   Core Argument: Opera is not "drama with music added." It is a form where music reveals psychological truth that words alone cannot. The "absurdity" of singing is a feature, not a bug. Realism is the wrong metric. The "work" of opera is done by the music expressing the *interiority* of the characters.
      *   Key Concept: "The impossibility of the enterprise" is part of the point. Music doesn't serve drama; drama provides the occasion for music.

  3.  **Brainstorm Counter-Arguments (The "What Would Count Against This?" phase):**
