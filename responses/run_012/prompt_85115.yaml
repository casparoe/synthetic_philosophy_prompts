      *   *Argument 2: Music Drama (Wagner).* Wagner explicitly aimed for *Gesamtkunstwerk* where music and drama are fused. Ignoring the dramatic intent seems to ignore the composer's philosophy.
      *   *Argument 3: Contemporary/Realist Opera.* Works like *Wozzeck* or *Nixon in China*. They rely heavily on dramatic coherence and political context. If the drama fails, the opera fails, regardless of the music.
      *   *Argument 4: The "Empty Virtuosity" Problem.* If music is all that matters, why isn't a concert aria better than an opera? The context *must* matter.
      *   *Argument 5: Character Consistency.* If music reveals truth, what happens when the music contradicts the dramatic situation in a way that isn't ironic? (Confusion vs. Depth).

  4.  **Select and Refine the Best Counter-Cases:**
