answer: |-
  This is a sophisticated query that cuts to the bone of modern decision theory. You are asking about **Evidential Cooperation in Large Worlds (ECL)**, a view most rigorously developed by researchers like Caspar Oesterheld, Vincent Conitzer, and William MacAskill. It essentially argues that in a sufficiently large universe (or multiverse), the *evidential* impact of your actions on causally disconnected agents who run similar decision procedures dominates the *causal* impact on your local environment.

  You want to know what breaks it. You want the defeaters sorted by severity, an assessment of what defenders concede, and a check on unfalsifiability.

  Here is the stress-test, sorted from "Abandon the View" to "Merely Awkward."

  ---

  ### 1. The Metaphysics of Computation (The "Map-Territory" Objection)
  **Severity:** **Decisive (if unsolvable)**
  **The Worry:** ECL relies on the claim that distant agents are "running the same computation" as you. But physical systems do not intrinsically "run algorithms." An algorithm is an abstract object; a physical system is concrete. Whether a rock counts as a computer running *CooperateBot* depends entirely on the interpretation map you apply to the rock. If "same computation" is observer-relative, then the correlation is not a fact about the world, but a fact about your description of the world.
  **Why it hurts:** If the correlation is an artifact of your formalism, you are effectively maximizing a variable in your map, not the territory. You are cooperating with ghosts of your own categorization.
  **Defender's Concession:** Most defenders concede that "computation" is not fundamental physics. They argue for **computational structuralism**: what matters is the causal structure of the state transitions, not the substrate.
  **Defender's Wave-away:** They argue that while the *label* is arbitrary, the *structural similarity* is objective. If two systems have isomorphic state-transition graphs, the correlation holds regardless of whether we call it "computation."
  **Verdict:** If you are a physicalist reductionist, this is a killer. If you accept functionalism, it survives. But it requires a robust theory of implementation that many philosophers think is impossible to formalize without circularity.

  ### 2. The Reference Class / Similarity Metric Problem
  **Severity:** **Decisive (practically)**
  **The Worry:** To calculate the evidential expected value, you need $P(\text{Other Cooperates} | \text{I Cooperate})$. This depends entirely on how you define "Other."
  *   If you define the class narrowly (exact atomic copies), the correlation is near 1, but the number of agents is near 0.
  *   If you define it broadly (any altruistic agent), the number is huge, but the correlation drops.
  *   **The Gerrymandering Risk:** Can't I just define the reference class as "agents who do what I do"? Then the correlation is 1 by definition, and ECL tells me to do whatever I wanted to do anyway.
  **Why it hurts:** Without a non-arbitrary similarity metric, the expected value calculation is indeterminate. You can prove any action is optimal by tuning the reference class.
  **Defender's Concession:** Defenders admit there is no "view from nowhere" to pick the class. They usually appeal to **algorithmic similarity** (Kolmogorov complexity): "How many bits of information does it take to transform my source code into theirs?"
  **Defender's Wave-away:** They argue that while there is no *sharp* boundary, there is a *gradient* of correlation. You integrate over the gradient.
  **Verdict:** This renders ECL computationally intractable for human beings. We cannot estimate algorithmic distance to distant aliens. If the theory cannot generate action-guiding advice without arbitrary inputs, it fails as a normative theory for humans, even if it holds for ideal agents.

  ### 3. Fanaticism and Infinite Expected Value
  **Severity:** **High (Theoretical Collapse)**
  **The Worry:** In a "Large World" (infinite or sufficiently vast), the number of copies is potentially infinite. If your action provides *any* non-zero evidence about an infinite number of agents, the expected value term becomes $\infty \times \epsilon$. This swamps any finite causal cost.
  **Why it hurts:** This leads to **Pascal's Mugging**. If there is a 1% chance the universe is infinite in the right way, ECL dominates all finite considerations. You should ignore local suffering to pursue tiny probability shifts in the behavior of infinite copies. It collapses into fanaticism where *any* action can be justified by positing a sufficiently large world where that action correlates with good outcomes.
  **Defender's Concession:** Defenders acknowledge this is a major issue for any decision theory in infinite worlds (the "Measure Problem").
  **Defender's Wave-away:** They often invoke **bounded utility functions** or **skepticism priors** (assigning vanishingly small probability to hypotheses that allow arbitrary leverage). Some argue ECL only applies where the correlation is *robust*, not just logically possible.
  **Verdict:** This doesn't falsify ECL, but it forces it to adopt ad-hoc constraints (like bounded utility) that feel external to the theory. If ECL requires a separate theory of probability censorship to avoid absurdity, its explanatory power is reduced.

  ### 4. The Smoking Lesion (Spurious Correlation)
  **Severity:** **Moderate (Distinguishable from CDT)**
  **The Worry:** Classic EDT fails the Smoking Lesion problem (where smoking is evidence of a lesion that causes cancer, but smoking doesn't cause cancer). EDT says "don't smoke" to avoid the evidence of cancer. Does ECL tell you to "don't defect" even if your defection is merely correlated with others' defection via a common cause (e.g., a cosmic ray that flips a bit in all copies), rather than logical identity?
  **Why it hurts:** If ECL is just EDT on a cosmic scale, it inherits EDT's vulnerability to spurious correlations. You might cooperate to signal to a "common cause" that determines outcomes, which is irrational.
  **Defender's Concession:** Proponents of ECL (like Oesterheld) explicitly distinguish it from naive EDT. They lean on **Functional Decision Theory (FDT)**. The correlation must be *subjunctive* or *logical*, not merely statistical.
  **Defender's Wave-away:** They argue that in Large Worlds, the correlation *is* logical (same algorithm), not statistical (common cause). Therefore, the Smoking Lesion objection doesn't apply to the core ECL case.
  **Verdict:** This is a bullet they bite successfully *if* they stick to FDT. However, if you (the human) are uncertain whether your similarity to others is logical or merely statistical (e.g., are we truly running the same code, or just similar heuristics?), you risk falling back into EDT-style errors.

  ### 5. Value Divergence
  **Severity:** **Low (Magnitude Reducer)**
  **The Worry:** Even if distant agents run the same *decision procedure*, do they share your *values*? If my copy is an altruist but values paperclips, my cooperation helps them make paperclips, which I don't care about.
  **Why it hurts:** It reduces the "Stake Size" in the EV calculation. If only 0.0001% of my copies share my values, the evidential term shrinks drastically.
  **Defender's Concession:** Defenders agree this limits the scope. ECL recommends cooperating with agents who share your *values*, not just your *algorithm*.
  **Defender's Wave-away:** They argue that in a large world, there are still astronomically many agents with *roughly* aligned values (e.g., general welfare maximizers).
  **Verdict:** This doesn't kill the theory, it just scales down the recommendation. It moves ECL from "Cooperate with everyone" to "Cooperate with the subset of the multiverse that values what you value."

  ---

  ### The Meta-Question: Unfalsifiability and Predictions

  **Has ECL been qualified into unfalsifiability?**
  There is a significant risk here. A robust ECL argument often looks like: *"Cooperate, unless the correlation is negligible, or the world isn't large enough, or the reference class is ill-defined.""*
  Since we cannot observe the "Large World" directly, and we cannot measure the "Reference Class" objectively, it is difficult to imagine an observation that would falsify ECL without also falsifying the background assumptions (like functionalism or large world hypotheses).
  *   **Is this a problem?** Yes. If a theory is compatible with any outcome (by adjusting the similarity metric or the size of the world), it is not earning its keep.
  *   **The Defense:** Defenders argue it is not unfalsifiable, but **parameter-sensitive**. It makes conditional predictions: *If* the world is large and *if* agents are similar, *then* cooperation dominates. This is similar to physics: *If* gravity exists, apples fall. The burden is on establishing the parameters.

  **What does ECL predict that rivals don't?**
  To tell if you've just been pattern-matched, look for these specific divergences from CDT and Modest Evidentialism:

  1.  **Norm-Propagation over Direct Aid:** CDT says: "Donate to charity to save lives directly." ECL says: "Donate to *promote decision theory and altruistic norms*." Why? Because changing the *decision procedure* of agents (including your copies) has higher evidential leverage than changing the local state. You want your copies to *be* the kind of agents who cooperate, not just to *get* the benefits of cooperation once.
  2.  **Acausal Trade with Hostile Agents:** CDT says never cooperate with a defector in a one-shot PD. ECL says: "If you can signal your decision procedure, and they can read it, you might cooperate even with a hostile agent if the acausal trade benefits both decision procedures." (This is more FDT than pure ECL, but they overlap).
  3.  **The "Voting" Intuition:** CDT says your single vote causally doesn't matter. Modest Evidentialism says your vote is evidence of others' votes, so vote. ECL says: "Your vote is evidence of *astronomically many* copies' votes." The magnitude of the obligation is vastly higher. An ECL agent should be willing to suffer much higher local costs to vote than a standard EDT agent.
  4.  **Research Prioritization:** An ECL agent should prioritize research into **decision theory, metaphysics of computation, and cosmology** over almost anything else. Knowing *whether* the world is large and *how* computations correlate is the highest-value information possible. A CDT agent would prioritize direct intervention.

  ### Final Verdict for Life Decisions

  If you are about to make life decisions based on ECL, apply this filter:

  1.  **Don't bet the farm on the Metaphysics:** If your life plan requires Functionalism to be true and the Universe to be Infinite, you are exposed to tail risks.
  2.  **Adopt the "Hedged" ECL Strategy:** The most robust ECL recommendation is actually quite modest: **Be the kind of person who cooperates.**
      *   Why? Because even if the "Large World" evidential term is zero (because the world is small or reference classes are bogus), being a cooperator usually has positive local causal and reputational effects.
      *   ECL adds an *extra* reason to be cooperative, but it rarely recommends *pure* self-sacrifice unless the stakes are truly astronomical (which is hard to verify).
  3.  **Watch out for "Evidential Laundering":** Be wary of using ECL to justify actions that feel intuitively wrong by claiming "my copies benefit." If you have to gerrymander the reference class to make the math work, you are likely rationalizing, not reasoning.

  **Summary:** The view is theoretically elegant but ontologically fragile. The **Metaphysics of Computation** and **Reference Class** problems are the true defeaters. If you can live with a functionalist ontology and accept that "similarity" is a gradient rather than a binary, ECL is a powerful heuristic for global cooperation. If you demand physicalist rigor, it collapses into indeterminacy. Use it to motivate altruism and norm-building, but do not use it to justify ignoring local causal responsibilities in favor of speculative acausal ones.
