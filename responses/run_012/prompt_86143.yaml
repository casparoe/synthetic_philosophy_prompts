  2. The proposal that right-kind reasons must stem from the object's features fails because pragmatic constraints can generate object-directed considerations, as when a lottery rules that insincere mourning dishonours the founder despite the prize being the actual motive. Here, the reason cites the object of the attitude yet remains clearly external to the value of the mourning itself, proving that object-grounding cannot filter out wrong-kind reasons.
