  5. A defender might argue that fittingness provides a formal marker for the right kind, but this merely renames the problem since fittingness is itself a value-laden notion equivalent to the one being analyzed. Abandoning the reduction is therefore necessary, as preserving it requires accepting that value is primitive rather than derived from reasons.
