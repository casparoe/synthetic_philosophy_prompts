answer: |-
  She will call the end of public hangings a **status death**.

  Here is why. In her existing taxonomy, "Arguments" are constant background noise (the case against duelling existed for centuries; the moral case against slavery was ancient). "Interests" require a shift in who pays or who profits. In the hanging case, the economics did not shift: public executions were cheap, and the state arguably lost deterrence value by hiding them. The only variable that changed was the *sensibility of the elite*. When the spectacle shifted from being a demonstration of state power to a source of shame for the officials presiding, the norm died. This mirrors the duelling case perfectly: the norm didn't fail because it stopped working, but because participating in it ceased to be compatible with being a "gentleman" (or in this case, a dignified authority).

  She might try to wriggle by claiming the state had an "interest in order" because the crowd had become a "mob." You should reject this. Crowds at executions were always potentially riotous; that was a constant, not a variable. The change wasn't the crowd's behavior, but the authorities' *tolerance* for the association. To claim it was an interest in order is to confuse the *justification* (Argument) with the *cause* (Status). The cause was that the elite no longer wished to be seen sharing a stage with the condemned.

  This verdict reveals she is fundamentally a **Status Theorist** (Honour), even when she uses the language of interests. In the Abolition case, she calls it "interests" because the economic power shifted from Land to Trade, but she admits the crucial kicker was that slaveholding became "unrespectable." Her rule appears to be: *Norms die when the coalition holding status power changes, or when the norm becomes costly to the status of that coalition.* Interests are merely the terrain on which status battles are fought.

  To settle whether she is truly a Status theorist or a covert Interest theorist, you need a case where Status and Interests point in opposite directions. The perfect test case is **The Persistence of the British Monarchy**.

  *   **The Interest Case:** The monarchy is a net cost to the taxpayer, produces no economic output, and complicates diplomatic heads-of-state protocols. A pure interest theorist predicts its abolition once the cost outweighs the "soft power" benefit.
  *   **The Status Case:** The monarchy is the apex of the national status hierarchy. Abolishing it would degrade the symbolic capital of the entire governing class.

  If she argues the monarchy survives because of hidden economic benefits (tourism, trade deals), she is signing up for **Interest Reductionism**: status is just a mask for material gain. If she argues it survives *despite* the cost because the status void would be too dangerous for the elite, she is signing up for **Status Autonomy**: symbolic capital is an independent historical force that can override material efficiency. Given her track record on duelling and hangings, she will likely argue the latter, confirming her as a Status theorist who treats interests as secondary constraints.

  Verdict: status, status-death
