  5.  **Developing the Residue Report (The Critical Analysis):**
      *   *Clean Maps:* Masked dispositions map very well to "Latent Faults covered by Safety Mechanisms" (ISO 26262 style). Finkish dispositions map to "Adaptive Systems" or "Non-Linear Material Responses."
      *   *Distortions:* Metaphysics cares about *what the object is* intrinsically. Reliability cares about *system behavior* in context. The "disposition" in metaphysics is often intrinsic; in reliability, "failure mode" is often relational (system vs. environment).
