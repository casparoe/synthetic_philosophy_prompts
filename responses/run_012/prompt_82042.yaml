      *   *Triggering Condition* $\rightarrow$ **Applied Stress / Environmental Load / Test Input**.
      *   *Manifestation* $\rightarrow$ **Functional Failure / Fault Event**.
      *   *Finkish Case* $\rightarrow$ **Stress-Induced Hardening / Adaptive Protection / Self-Healing triggered by Load**. The load itself changes the system state so the failure doesn't happen, even though the system was theoretically susceptible.
      *   *Masked Case* $\rightarrow$ **Latent Fault with Mitigation / Redundancy / Protective Device**. The susceptibility is there, the load is applied, but a safety system prevents the top-level failure.
      *   *Instrumentation/Perturbation* $\rightarrow$ **Probe Effect / Test Rig Dynamics**.

  4.  **Drafting the Mapping (Item by Item):**
