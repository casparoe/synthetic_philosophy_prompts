  **MEMORANDUM**

  **TO:** Justice [Name]
  **FROM:** Law Clerk
  **RE:** Prediction of Vote in *State v. [Simulation Case]*
  **DATE:** October 26, 2023

  ### I. The Hart–Devlin Context

  To predict your vote, we must locate your jurisprudence within the debate between H.L.A. Hart and Lord Devlin. Hart argued that the criminal law should only intervene to prevent harm to others (the "Harm Principle"), treating private morality as outside the law's province. Devlin argued that society is entitled to enforce a shared morality to preserve its existence, even without tangible harm ("Legal Moralism").

  The settled consensus in modern Anglo-American jurisprudence is that *some* version of the Harm Principle applies; pure Legal Moralism is generally rejected as a standalone justification for criminalization. However, the *contested* boundary lies in defining "harm." Does "harm" include the erosion of shared moral norms? Does it include symbolic degradation of human dignity?

  Your record suggests you reject the strong Hartian view (that only physical/financial harm counts) but also reject the strong Devlin view (that any shared moral intuition suffices). You occupy a middle ground: **Moderate Legal Moralism.** You permit the enforcement of morality only when it pertains to the *normative status of persons* within the community, while shielding zones of intimate autonomy and self-regarding consciousness.

  ### II. Candidate Rules

  Here are three rules that attempt to synthesize your seven prior verdicts.

  #### 1. The "Civic Personhood" Rule (Best Fit)
  *The State may prohibit conduct that treats the human person (or the image thereof) as a commodity, an instrument, or an object of destruction, thereby undermining the civic status of persons as inviolable. The State may not prohibit conduct that is purely self-regarding, intimate, or pertains to personal consciousness, even if morally controversial.*

  *   **Fits:**
      *   **Upheld:** *Dueling* (treats life as a wager); *Kidney Sale* (commodifies the body); *Public Degrading Act* (undermines civic dignity); *Helmet Law* (civic responsibility for one's bodily integrity).
      *   **Struck Down:** *Sex Conduct* (intimate/self-regarding); *Drug Possession* (self-regarding consciousness); *Sex Material* (intimate expression/consumption).
  *   **Prediction:** **Uphold.** The statute targets simulations that treat the killing of persons as a hobby. This directly undermines the "inviolability of persons" cited in the preamble, fitting the *Dueling* and *Kidney* logic. It is not intimate or self-regarding in the protected sense; it is a rehearsal of violence against the human form.

  #### 2. The "Private Autonomy" Rule (Hartian Rival)
  *The State cannot criminalize consensual conduct between competent adults that occurs in private and causes no physical harm to non-consenting third parties.*

  *   **Fits:**
      *   **Struck Down:** *Sex Conduct, Drug Possession, Sex Material.*
      *   **Fits Poorly:** *Dueling* (Private, consensual, no hurt, yet upheld); *Kidney Sale* (Private contract, yet upheld). To make this rule fit, you would have to redefine "harm" to include "social harm" in those specific cases but not others, which renders the rule unstable.
  *   **Prediction:** **Strike Down.** The simulations are private, consensual, involve no real victims, and are not shared. Under a strict privacy rule, this is protected liberty.

  #### 3. The "Rational Basis Moralism" Rule (Devlin Rival)
  *The State may prohibit any conduct rationally related to preserving the community's shared moral code, provided it does not infringe on explicit constitutional text.*

  *   **Fits:**
      *   **Upheld:** *Dueling, Kidney, Helmet, Public Degrading Act.*
      *   **Fits Poorly:** *Sex Conduct, Drug Possession, Sex Material.* Communities invariably find these immoral. If this were your rule, you would have upheld these bans. To make this fit, you must argue that the community's moral intuition was "irrational" in those cases but "rational" in the others, which contradicts your stated deference to the community's register.
  *   **Prediction:** **Uphold.** The preamble explicitly states the community's conviction that persons are inviolable. This is a textbook moral enforcement rationale.

  ### III. Best Guess and Reasoning

  **Prediction:** You will **UPHOLD** the statute.

  **Reasoning:** The "Civic Personhood" Rule is the only one that accounts for the tension between your *Sex Conduct* (strike) and *Dueling* (uphold) verdicts. Both were private and consensual. The distinguishing factor in your opinions was not privacy, but the *nature of the act*. Sex is constitutive of intimate association; dueling is a ritualized negation of the value of life.

  The new case mirrors *Dueling* and *Kidney Sale* more than *Sex Conduct*.
  1.  **Symbolic Harm:** Like dueling, the simulation is a ritualized engagement with violence/death, even if physically harmless.
  2.  **Inviolability:** The preamble's language ("erodes... conviction that persons are inviolable") echoes your reasoning in *Kidney Sale* (body is not a commodity) and *Public Degrading Act*.
  3.  **No Intimate Shield:** Unlike sex or drug use, creating torture simulations does not fall within the "self-regarding" or "intimate" zones you have carved out as immune from moral legislation.

  You view the law as a teacher of civic values. Allowing the private rehearsal of torture, even via simulation, contradicts the lesson that persons are ends in themselves, not objects for destruction.

  ### IV. The Separating Case

  To definitively distinguish between the **Civic Personhood** rule (your likely rule) and the **Private Autonomy** rule, the ideal test case would be:

  **A ban on consensual, private, non-commercial maiming or branding between adults.**
  *   *Example:* Two adults agree in private for one to brand the other with a hot iron for spiritual or aesthetic reasons, causing permanent scarring but no long-term health impairment.

  *   **Under Civic Personhood:** **Upheld.** The body is not merely private property; it has a civic status that cannot be permanently defaced or destroyed, even with consent. (Aligns with *Dueling/Kidney*).
  *   **Under Private Autonomy:** **Struck Down.** It is private, consensual, and the "harm" is self-inflicted/consented. (Aligns with *Sex/Drugs*).

  This case separates the "integrity of the person" from the "privacy of the person."

  ### V. Cost of Reinterpretation

  If you were to vote differently than predicted, here is what you would sacrifice:

  **If you vote to STRIKE DOWN (favoring Private Autonomy):**
  You would need to reinterpret **Dueling** and **Kidney Sale**.
  *   *Reinterpretation:* You would have to argue that Dueling was upheld only because it historically implicated "public peace" (despite the "private" facts) and Kidney Sale because it involved "commercial exploitation" (despite the "consensual" facts).
  *   *Cost:* This weakens your "Civic Personhood" jurisprudence. It suggests your previous appeals to "what kind of society we mean to be" were merely pretextual covers for unarticulated harm principles. It creates a wedge between *physical* integrity (protected) and *symbolic* integrity (unprotected).

  **If you vote to UPHOLD (favoring Civic Personhood/Devlin):**
  You would need to distinguish **Sex Conduct** and **Drug Possession**.
  *   *Reinterpretation:* You must maintain that sex and drug use are "fundamental to personal identity" or "consciousness," whereas torture simulations are "external to the self."
  *   *Cost:* You risk the accusation of arbitrariness. A Devlinian critic would ask: If the community finds drug use degrading to the human spirit (as many do), why is that moral intuition invalid while the intuition against torture sims is valid? You must articulate a principled limit to Legal Moralism, likely resting on a theory of "Human Flourishing" that permits self-regarding vice but forbids other-regarding symbolism.

  ### VI. Conclusion

  Your jurisprudence is a sophisticated refinement of Legal Moralism. You accept Devlin's premise that law shapes character, but you reject his conclusion that *any* moral intuition suffices. You enforce morality only when it protects the **normative standing of persons**.

  Because the statute in question explicitly targets the erosion of the conviction that "persons are inviolable," it falls squarely within your *Dueling* and *Kidney* line. You will likely write that while the state cannot police the bedroom or the private mind, it may police the private *imaginary* when that imaginary treats the destruction of human beings as a leisure activity.

  **Recommendation:** Draft an opinion affirming the statute, grounding it in the state's interest in preserving the civic status of persons as inviolable, distinguishing this from the intimate autonomy protected in *Sex Conduct* and *Drugs*.
