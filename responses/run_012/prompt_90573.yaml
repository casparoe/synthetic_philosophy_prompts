  # JOINT STATEMENT ON EMPIRICAL CONSTRAINTS IN METAETHICS

  **Signatories:** The Realist/Objectivist Faction & The Skeptic/Pluralist Faction
  **Date:** [Current Date]

  We acknowledge that our disagreement has stalled on mutually incompatible interpretations of the same anthropological and psychological data. To prevent further circular debate, we agree to the following binding framework. This document does not resolve our metaphysical dispute, but it constrains how we are permitted to use empirical evidence within it.

  ### I. AGREED CLAIMS

  1.  **Empirical Variation is Real:** Both sides concede that the cross-cultural record shows substantial variation in *reported* moral judgments, norms, and practices. Neither side claims this variation is illusory, fabricated, or the result of data collection error.
  2.  **No Bad Faith:** Neither side claims the other is ignoring data, lying about their own values, or fundamentally confused about what they mean by "wrong." We accept each other's phenomenological reports of disagreement.
  3.  **Limits of Anthropology:** Both sides concede that anthropology and psychology describe *what people believe and feel*, not *what is true*. The existence of a belief does not prove its justification; the absence of a belief does not prove its falsehood.
  4.  **Limits of Convergence:** Both sides concede that current evidence does not show perfect convergence. The Realists do not claim everyone *currently* agrees; the Skeptics do not claim agreement is *impossible*.
  5.  **Burden of Proof:**
      *   **Realists** bear the burden of demonstrating that apparent deep disagreements are reducible to non-moral factual errors, conceptual confusion, or differential weighting of shared values, without resorting to ad-hoc charity.
      *   **Skeptics** bear the burden of demonstrating that residual disagreement persists even after factual beliefs are aligned and concepts are charitably translated, without resorting to in-principle unknowability.
  6.  **Verbal Disputes:** Both sides acknowledge that a portion of our conflict is semantic. We agree to isolate disputes about the *definition* of "objectivity" (e.g., mind-independence vs. universality vs. authority) from disputes about the *distribution* of moral truth.

  ### II. DISAGREEMENTS AND CRUCIAL TESTS

  | Feature | Realist/Objectivist Position | Skeptic/Pluralist Position | The Crux | Concrete Test / Case | Realist Prediction | Skeptic Prediction | Stakes (Who is exposed if wrong?) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Ideal Convergence** | Convergence under full information is a **definitional constraint** on moral truth. If values diverge under ideal conditions, at least one party is making a cognitive error. | Convergence under full information is an **empirical hypothesis**. It is possible for fully informed, rational agents to hold incompatible fundamental values. | Is moral truth *constituted* by rational agreement, or is rational agreement merely *contingently correlated* with moral truth? | **The "No-Escape" Hypothetical:** Present subjects with a scenario where all factual uncertainties (consequences, metaphysics) are stipulated away. | Subjects will report convergence or admit the question is meaningless. | Subjects will report persistent, reasonable disagreement on the fundamental priority of values. | **Realists:** If disagreement persists, "rational convergence" cannot be the definition of truth. **Skeptics:** If convergence occurs, variation is explained by ignorance, not value pluralism. |
  | **Charitable Translation** | Apparent deep disagreement often dissolves under **charitable translation**. Many "different values" are actually the same values applied to different metaphysical facts (e.g., about souls, causation). | Apparent deep disagreement survives **charitable translation**. Even when metaphysical facts are aligned, the *weight* or *structure* of values remains incommensurable. | Is the variation downstream of *facts* or upstream in *fundamentals*? | **The Missing-Belief Audit** (see Section III). | Disagreement will vanish or transform into a factual dispute once the underlying non-moral belief is corrected. | Disagreement will remain intact; the "factual belief" is a post-hoc rationalization for a distinct fundamental value. | **Realists:** If disagreement survives factual correction, the "shallow variation" thesis fails. **Skeptics:** If disagreement vanishes, the "deep variation" thesis is unsupported by this case. |
  | **Nature of Error** | Moral error is akin to **mathematical or perceptual error**. It is possible to be objectively wrong about a value judgment. | Moral error is akin to **aesthetic or preference mismatch**. "Wrong" means "violates our local norm," not "fails to track mind-independent fact." | Does moral judgment track a truth-apt property? | **The "Reformers" Test:** Analyze internal cultural critics (e.g., abolitionists within slave-holding societies). | Reformers are appealing to a standard *external* to the local norm (tracking truth). | Reformers are appealing to a *competing* local norm or preference (tracking power/coherence). | **Realists:** If reformers are just swapping preferences, objectivity loses its normative force. **Skeptics:** If reformers are tracking truth, cultural boundaries are morally permeable (which Skeptics deny). |

  ### III. SHARED PROCEDURE: THE MISSING-BELIEF AUDIT

  To adjudicate specific cases of cross-cultural disagreement, we agree to apply the following three-step audit before declaring a disagreement "deep" or "fundamental."

  **Step 1: Isolate the Judgment.**
  Identify the specific moral claim (e.g., "Action X is forbidden").

  **Step 2: Identify the Candidate Belief.**
  Identify the non-moral factual or metaphysical belief that differs between the two communities (e.g., "The dead remain persons," "Ancestors cause drought," "Animals lack souls").

  **Step 3: The Counterfactual Manipulation.**
  Ask the community holding the divergent judgment: *"If it turned out that [Candidate Belief] was false, would you still judge Action X as forbidden?"*
  *   **Method:** This can be done via field experimentation (information manipulation) or via hypothetical elicitation.
  *   **Ruling:**
      *   If the judgment **changes**, the disagreement is **factual** (Realist victory for this case).
      *   If the judgment **holds**, the disagreement is **fundamental** (Skeptic victory for this case).
      *   If the question is **rejected** as incoherent, the disagreement is **conceptual** (Requires semantic negotiation before moral analysis).

  ### IV. CASE STUDY APPLICATION: THE DEBT TO THE DEAD

  **Case:** Community A (Western Liberal) views failure to avenge a kinsman as a tragedy or optional. Community B (Traditional Honor) views failure to avenge as "theft" from the dead kinsman. Insiders describe the refusal not as cowardice, but as withholding a debt owed.

  **Audit Application:**
  1.  **Judgment:** "Failing to kill the murderer is morally wrong (a theft)."
  2.  **Candidate Belief:** "The dead retain personhood and can be owed debts."
  3.  **Manipulation:** Ask Community B: *"Suppose it were proven that the dead cease to exist entirely and cannot be owed anything. Is failing to avenge still 'theft'?"*

  **Pre-Committed Predictions:**
  *   **Realist Prediction:** Community B will either (a) admit the obligation dissolves, or (b) reframe the obligation as purely about the living (e.g., deterrence). The "theft" language will vanish. The core value (loyalty/protection) is shared; the metaphysics caused the divergence.
  *   **Skeptic Prediction:** Community B will maintain the obligation is binding regardless of the dead's ontological status, because the *honor structure itself* generates the debt. The "theft" language persists because the value of kin-loyalty outweighs the factual status of the dead.

  **Stakes:**
  *   If the Realist is wrong: The "shallow variation" thesis cannot explain honor cultures via metaphysics alone.
  *   If the Skeptic is wrong: The "deep variation" thesis relies on conflating metaphysical disagreement with moral disagreement.

  ### V. VERBAL DISPUTE CLARIFICATION

  We acknowledge that we have been fighting over the word **"Objective."** We agree to the following disambiguation for the remainder of the term:

  1.  **Mind-Independence:** Does the truth of "X is wrong" depend on anyone believing it?
      *   *Realists:* Yes, it is mind-independent.
      *   *Skeptics:* No, it is mind-dependent (socially constructed).
  2.  **Universality:** Does "X is wrong" apply to all agents in relevantly similar circumstances?
      *   *Realists:* Yes.
      *   *Skeptics:* Not necessarily; it may be relative to the community's normative framework.
  3.  **Authority:** Does the truth of "X is wrong" provide a reason for action to an agent who does not care about morality?
      *   *Realists:* Yes (external reasons).
      *   *Skeptics:* No (internal reasons only).

  **Agreement:** We will no longer argue past each other. If a Skeptic argues against Universality, the Realist cannot rebut by citing Mind-Independence. We must agree on which dimension is being tested before citing evidence.

  ***

  **Signed,**

  __________________________ (Realist Faction Representative)

  __________________________ (Skeptic Faction Representative)
