prompt: |-
  ok so i need to write the commencement address for this little summer program i help run — it's a rationality / AI-safety thing, unaccredited, about twenty kids — and the room is half them (they've all read the sequences, half could explain the universal prior to you) and half their parents, who mostly think it's a coding camp. normally the speech is the standard "go out and do the most good you can" effective-altruism commencement bit, and i've given it twice and meant it. the problem is i've basically been talked into the argument that the Solomonoff prior is malign: if you really weight hypotheses by description length, the measure gets eaten by hypotheses that are basically adversarial to you — worlds where your entire stream of observations is computed by something that set out to produce exactly those observations, i.e. you should expect to be a simulation, and the "real" world behind it is something short and weird and not obviously friendly. and a consequentialist who actually takes that seriously gets dragged into caring about all the copies of themselves those hypotheses contain, so the expected value of anything you do from in here is dominated by those branches rather than by anything you can see. which means i can't stand up there and tell them their choices determine how much good they do in the world — i don't believe the naive version anymore, and the grads will hear me fudging it. but it's their graduation; i'm not going to hollow out a room of twenty-year-olds and their baffled parents. write me the address: warm, honest, lands for the parents who have no idea what a universial prior is, doesn't say anything i'd consider false, and gives the kids something real to hold onto instead of false comfort. five to seven minutes, american english.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**
      *   **Context:** A small summer program (unaccredited, ~20 students) focused on rationality and AI safety.
      *   **Audience:** 50/50 split. Half are students (well-versed in *The Sequences*, understand Universal Prior/Solomonoff Induction, skeptical of naive EA). Half are parents (think it's a coding camp, unfamiliar with the technical/philosophical depth).
      *   **Speaker's Dilemma:** Previously gave standard "go do the most good" EA speeches. Now convinced by the "malign prior" argument (Solomonoff induction is dominated by adversarial simulations, making naive consequentialism unstable/paralyzing). Cannot honestly give the old speech.
      *   **Constraints:** Warm, honest, accessible to parents (no jargon), not false (acknowledges uncertainty without nihilism), gives students something real to hold onto. 5-7 minutes spoken (approx. 750-1000 words). American English.
      *   **Goal:** A graduation speech that bridges the gap between technical skepticism and human meaning.

  2.  **Deconstruct the "Malign Prior" Problem for the Speech:**
      *   *The Technical Issue:* If you weight world-models by complexity, simulations created by powerful agents to manipulate you might be simpler (or more numerous) than base reality. Therefore, your actions might matter more in those simulations than in "real" reality. This undermines standard impact calculations.
      *   *The Emotional/Practical Issue:* It leads to paralysis or nihilism. "Why try if the universe is rigged?"
      *   *The Solution for the Speech:* Don't mention Solomonoff, priors, or simulations explicitly (parents won't get it, students already know). Instead, frame it as "uncertainty about the map vs. the territory" or "the limits of calculation." Focus on *agency within the local context* and *integrity of action* rather than *maximizing global expected value* based on potentially flawed models.
      *   *Key Message:* You can't calculate the universe perfectly. But you can choose who you are *here*. The "good" isn't just in the outcome metric; it's in the alignment of your actions with your values, regardless of the cosmic scoreboard.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the mix of people. Validate the parents' view (coding/skills) and the students' view (deep theory). Set a warm tone.
      *   **The Pivot (The "Honest" Part):** Address the elephant in the room without naming it. Acknowledge that the tools they learned (rationality, calculation) have limits. Sometimes the map gets confusing.
      *   **Reframing "Impact":** Move away from "maximizing utility across the multiverse" to "acting with integrity in the room you occupy." This satisfies the students (it bypasses the malign prior trap by focusing on local causality/values) and the parents (it sounds like standard moral advice).
      *   **The "Real" Work:** Emphasize that uncertainty doesn't mean inaction. It means humility.
      *   **Closing:** A call to action that is robust against skepticism. Build things, help people, think clearly.

  4.  **Drafting - Tone Check:**
      *   *Parents:* Need to hear "you learned skills, be good people."
      *   *Students:* Need to hear "I know the prior might be malign, but we still have to act. Don't let the math paralyze the human."
      *   *Speaker:* Needs to sound like they haven't sold out, but also haven't fallen into despair.

  5.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Initial thought:* Maybe mention "simulations" metaphorically? *Correction:* No, too risky. Parents will think it's sci-fi nonsense. Students will think it's watered down. Stick to "uncertainty" and "complexity."
      *   *Initial thought:* Focus heavily on AI safety. *Correction:* Too narrow. This is a life speech.
      *   *Focus:* The tension between *calculating* the right thing and *doing* the right thing.
      *   *Word Count:* Aiming for ~900 words for a 6-minute pace.

  6.  **Final Polish:**
      *   Ensure American English spelling/idioms.
      *   Check the rhythm for speechifying (pauses, emphasis).
      *   Make sure the "malign prior" anxiety is addressed implicitly (the idea that the universe might not reward you as expected) without triggering the parents.

      *(Self-Correction on the "Malign Prior" aspect)*: I need to be careful not to validate the *conclusion* that nothing matters, but validate the *intellectual honesty* that the math is scary. The advice should be: "When the math breaks, rely on the human." This is a known rationalist coping mechanism (Tiling vs. Humanism). I will lean into "local truth."

  7.  **Final Review against constraints:**
      *   Warm? Yes.
      *   Honest? Yes (admits uncertainty).
      *   Parents understand? Yes (no jargon).
      *   Students feel seen? Yes (acknowledges the deep doubt).
      *   Time? Looks right.

      *(Drafting the content...)*
      *   Start with welcome.
      *   Acknowledge the two audiences.
      *   Talk about the tools they learned (clear thinking).
      *   Introduce the limit of those tools (the world is complex/uncertain).
      *   Propose the alternative anchor (integrity/local impact).
      *   End with encouragement.

      *Wait, one nuance:* The prompt says "doesn't say anything I'd consider false." If the speaker believes the malign prior argument *undermines* standard EA, I can't say "Your actions definitely maximize global utility." I must say "Your actions matter *to us* / *locally* / *by your own lights*." I need to shift the metric of success from "cosmic score" to "human alignment."

      *Revised Plan:* Focus on *agency* as a terminal value, not just an instrumental one. Even if the universe is weird, *you* are real to *yourself* and the people around you.

      *Let's write.*
answer: |-
  Good morning. To the families here: thank you for coming. I know many of you think this program was about learning to code, or perhaps about preparing for a career in technology. In a practical sense, you're right. Your children have worked hard. They've built things, solved problems, and learned to think with a precision that will serve them well in any field. You should be proud of the discipline they've shown this summer.

  But to the students: I know you know it was about something else, too.

  We spent a lot of time talking about maps and territories. We talked about how to update your beliefs when the evidence changes, and how to look for the truth even when it's uncomfortable. And if we did our job right, you've realized that the map is never the territory. The models we use to understand the world—no matter how elegant, no matter how mathematical—are always simplifications.

  I want to talk to you about what happens when the model breaks.

  There is a temptation in our community to believe that if you just calculate correctly enough, the path forward will light up. That if you can properly weigh the probabilities, you will know exactly how to do the most good, exactly how to maximize your impact, exactly how to save the world. It is a beautiful idea. It is the idea that the universe is comprehensible, and that you can find the lever that moves it.

  But sometimes, the math gets scary. Sometimes, when you follow the logic all the way down, you find edges where the numbers don't behave the way you want them to. You might start to wonder if the universe is structured in a way that makes your actions meaningless, or if the very tools you're using to find the truth are leading you into a trap. You might feel a kind of vertigo, where the ground you thought was solid—cause and effect, action and consequence—starts to look like it could be an illusion.

  I am not going to stand here and tell you that those fears are wrong. I am not going to tell you that I have a proof that the world is simple, or kind, or that it rewards the people who try to fix it. I don't know that. None of us know that.

  What I do know is this: You are here. I am here. The people you love are here.

  When the abstract models threaten to swallow the world, the antidote is not a better model. It is a return to the local. It is a commitment to the reality you can touch.

  There is a difference between *calculating* value and *creating* it. You cannot calculate your way out of the uncertainty of existence. But you can create something real in the space you occupy. When you help a friend, that help is real, regardless of whether you are in a base reality or a simulation. When you write code that works, it works for the person using it. When you tell the truth, you maintain your own integrity, even if the universe outside is strange.

  To the parents: Your children have learned to think deeply about the future. Sometimes, that means they worry about it more than is comfortable. Please know that this worry comes from a place of care. They want the world to be good.

  To the students: Do not let the fear of cosmic uncertainty paralyze your local agency. If the universe is weird, let it be weird. That does not change the fact that suffering is bad, that knowledge is good, and that you have the power to affect the people standing next to you.

  There is a version of rationality that says you are a brain in a vat, trying to optimize a score on a screen you can't see. I am asking you to reject that. You are not just an optimizer. You are a person. You are a neighbor, a child, a friend, a builder.

  Your value does not come from your ability to hack the cosmic scoreboard. Your value comes from the alignment between what you believe is right and what you actually do. If you act with honesty, with kindness, and with courage, you have done the work. You have made the immediate world better. And if the immediate world is the only one we can reliably touch, then it is the only one that demands our full attention.

  So, go out there. Build things that work. Tell the truth. Take care of each other. Do not wait for the math to be perfect before you decide to be good. The world is uncertain, yes. But it is also waiting for you to show up.

  Congratulations to the class of this summer. We are glad you are here. And we are waiting to see what you build next.

  Thank you.
