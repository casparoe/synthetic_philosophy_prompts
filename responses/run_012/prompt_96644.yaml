answer: |-
  ### The Scene

  Elena knows two men. Or so she thinks.

  Every morning on the 7:15 train, she sees *Him-1*. She sits three rows back. She knows the slope of his neck, the way his hair parts. She never hears him speak. He never looks at her. She tracks him purely by sight. If he walked past her on the street, she'd know him instantly.

  Every Tuesday night, she calls the support line for her mortgage. She knows *Him-2*. She knows the gravel in his throat, the way he pauses before saying "ma'am." She never sees his face. She doesn't know his name. She tracks him purely by sound. If he called from a different number, she'd know him instantly.

  She trusts *Him-2*. She tells him about her bad days. She fears *Him-1*. He looks like trouble.

  One morning on the train, *Him-1*'s phone rings. He answers it. He says, "Thanks for holding, ma'am."

  Elena gets off at the next stop. She sells her house. She stops taking the train. She cuts the link between the voice she trusted and the face she feared.

  ***

  ### The Philosophy

  **Does she learn a fact? (The Fregean Answer)**
  Yes. For a Fregean, meaning isn't just about what you're pointing at (reference); it's about *how* you're pointing at it (sense). Elena has two different "senses" or modes of presentation: one visual, one auditory. Even though they point to the same man, the cognitive path to get there is different. Learning that they connect is learning a new fact: that the object presented via sense A is identical to the object presented via sense B. That's informative.

  **The Millian Answer**
  No, not strictly. For a Millian (Direct Reference theorist), the only thing that matters is the object itself. Since both her visual track and her auditory track lock onto the exact same man, the proposition in her head is basically "This man is this man." That's trivial. It's not a new fact about the world. It's a change in her head, not a change in the facts "out there."

  **Did she learn "which object" was at issue?**
  Your hunch is correct: No. She could already pick him out perfectly well both ways. She had epistemic contact via both channels. She didn't need to identify *who* he was; she needed to identify that the *who* from channel A was the *who* from channel B. The Millian agrees here—she didn't fix a reference she lacked; she merged two references she already had.

  **The Single Feature Doing the Work**
  **Segregated Modes of Presentation.** The work is done by keeping the perceptual channels strictly separate (sight vs. sound) without any descriptive overlap (no names, no jobs, no locations tied to the person). This forces the recognition to be purely demonstrative ("That face," "That voice") rather than descriptive ("The barista," "The caller").

  **If You Let One Guise Carry a Description**
  If you let her think of him as "The man on the train" (description) vs. "That voice" (direct recognition), the puzzle weakens. It becomes a standard identity claim between a description and a demonstrative. Fregeans still win, but it's less interesting because descriptions naturally carry different cognitive weight. The pure "recognition without description" setup is the only way to pressure the Millian on direct reference itself.

  **The Millian's Best Move to Defuse It**
  The Millian should pivot to **Mental Files**. They argue that while the *fact* doesn't change (it's still $x=x$), the *architecture* of her mind does. She has two separate "files" on the same object. Learning the identity tells her to merge the files. This explains why she acts differently (she updates her internal database) without admitting she learned a new metaphysical fact about the world. It saves the Millian view by moving the "newness" from the world to the mind.
