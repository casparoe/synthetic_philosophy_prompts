answer: |-
  The phenomenon you are describing does not have a single, universally agreed-upon label that captures every nuance you've outlined, but it is recognized across linguistics, philosophy, and sociology under a cluster of related terms. The most precise name for the linguistic mechanism is **Semantic Drift** (or **Meaning Drift**), but to "carve it at its joints" as you request, we must understand it as the intersection of three specific theoretical frameworks: **Open Texture** (philosophy of language), **Diachronic Prototype Semantics** (cognitive linguistics), and **Interpretive Drift** (sociology).

  Here is the breakdown of the phenomenon, how it differs from related concepts, and where its boundaries lie.

  ### 1. The Name and Mechanism
  While **Semantic Drift** is the standard linguistic term for meaning changing over time, your description highlights a specific *mode* of drift: it is synchronous (happening now), communal, and driven by analogical chaining.

  *   **The Structural Enabler: Open Texture.**
      In the 1950s, philosopher Friedrich Waismann coined the term **Open Texture** (*Porosität*) to describe empirical concepts. He argued that unlike mathematical terms, empirical words (like "clean," "table," or "fast") cannot be exhaustively defined because we cannot anticipate every future context in which they might be used. There is always a "penumbra" of uncertainty. This is not a defect; it is a feature that allows language to adapt. In your keyboard community, *open texture* is what licenses a member to apply "clean" to a new type of sound by analogy, without breaking the rules of the language.
  *   **The Cognitive Mechanism: Prototype Shift.**
      Cognitive linguists (notably Dirk Geeraerts in *Diachronic Prototype Semantics*) model this using **Prototype Theory**. Words are not defined by necessary and sufficient conditions (a checklist) but by a "best example" (a prototype) and a radial category of similar cases.
      *   **What you are seeing:** The *label* ("clean") remains stable, but the *prototype* (the mental image of the ideal clean sound) shifts.
      *   **The Chain:** User A calls Sound 1 "clean." User B hears Sound 2, which is analogically close to Sound 1, and calls it "clean." Over time, Sound 50 is called "clean," even though it shares no direct features with Sound 1. The center of gravity has moved. This is a **Prototype Shift**.
  *   **The Social Mechanism: Interpretive Drift.**
      Sociologist David Sudnow coined **Interpretive Drift** to describe how professionals (like lawyers or doctors) gradually change their understanding of rules through practice, without ever explicitly deciding to change them. This captures your observation that "the earliest members have not registered the change." The drift is a collective byproduct of individual analogical steps, invisible to the participants.

  ### 2. How It Differs from Related Concepts
  You correctly noted that this is not standard ambiguity or vagueness. Here is the differentiation:

  | Concept | Structure | Stability | Your Phenomenon |
  | :--- | :--- | :--- | :--- |
  | **Ambiguity / Polysemy** | **Discrete.** The word has two distinct meanings (e.g., "bank" of a river vs. "bank" for money). | **Static.** Both meanings exist simultaneously and are usually distinguishable by context. | **Continuous.** There are not two camps fighting for Definition A vs. Definition B. There is a spectrum where A slowly becomes B. |
  | **Vagueness** | **Boundary Fuzziness.** We know the center (a "tall" man), but not the edge (is 6'0" tall?). | **Static.** The fuzzy edge remains fuzzy; the center stays put. | **Center Movement.** The fuzziness remains, but the *center* migrates. What was once the "edge" (muddy) becomes the "center" (clean). |
  | **Sense Replacement** | **Succession.** Meaning A dies out and is replaced by Meaning B (e.g., "deer" once meant any animal, now a specific one). | **Historical.** Usually requires generations; old speakers don't use the new sense. | **Overlap.** Old and new users coexist. The old sense is not dead, just marginalized. The word feels stable to everyone, even though it means different things to different generations. |
  | **Essential Contestability** | **Conflict.** Concepts like "democracy" are fought over; users know they disagree. | **Static Conflict.** The disagreement is the point. | **Consensus Illusion.** "Nobody contradicts anyone." The conflict is hidden because the shift is gradual enough to maintain the *feeling* of agreement. |

  ### 3. The Logical Structure: The Sorites Chain
  The "short analogical step from the one before it" that you identified is the logical engine of this drift. It is a **Sorites Chain** (from the *Sorites Paradox*, or "heap" paradox).
  *   If Sound A is clean, and Sound B is indistinguishable from A, then Sound B is clean.
  *   Repeat 50 times.
  *   Sound Z is clean, even though Sound Z is radically different from Sound A.
  In standard logic, this is a paradox. In sociolinguistics, this is how **Semantic Drift** occurs. The "looseness that moves" is the community traversing a Sorites chain without noticing the endpoints no longer match.

  ### 4. Boundaries: Individual vs. Community
  You asked where the boundaries lie, specifically regarding individual vs. community drift.

  *   **Idiolectal Drift (Individual):** If a single expert's usage drifts but the community does not follow, this is merely **Idiolectal Variation** or **Semantic Idiosyncrasy**. It does not become "Semantic Drift" in the sociological sense until it achieves **Uptake**. For the drift to be real, the analogical extension must be accepted by others who then extend it further.
  *   **Convergence without Slip:** You asked about a community converging on a new sense without any individual experiencing a slip. This is rare but possible in **Stipulative Definition** (e.g., a standards body votes to change "clean"). This is *not* the phenomenon you described. Your phenomenon requires the *slip* (the unnoticed analogical step). If everyone consciously agrees to a new definition, it is **Reform**, not **Drift**.
  *   **The "Critical Mass" Boundary:** The phenomenon becomes **Semantic Drift** only when the new prototype achieves **Critical Mass**. If 5% of the community uses "clean" for the new sound, it is just variation. If 50% use it, and the "center of gravity" has shifted such that new members learn the *new* prototype as the default, the drift is complete. The "earliest members" you mention are the **Residual Group**; they are speaking the older version of the language within the same community.

  ### Summary
  The name for the phenomenon is **Semantic Drift**, specifically driven by **Analogical Extension** within a community exhibiting **Open Texture**.

  It is distinct because:
  1.  **It is directional:** It moves via a Sorites chain, not randomly.
  2.  **It is centrifugal:** The center moves, not just the edges (distinguishing it from vagueness).
  3.  **It is opaque:** Participants do not perceive the change (distinguishing it from contestability or ambiguity).

  In the literature of Science and Technology Studies (STS), which often studies communities like yours (hobbyists, tuners, makers), this is sometimes called **Interpretive Flexibility** leading to **Stabilization**, but since you are describing the *movement* rather than the settling, **Semantic Drift** grounded in **Open Texture** is the most accurate philosophical carving.
