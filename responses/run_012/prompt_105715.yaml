      *   *Wait, let's re-read the prompt:* "At least one of these should come out in a way I won't like — say which and why."
      *   *Idea:* In Case 1 (Poll), standard practice is to update. But if the poll is noisy, maybe the procedure says "Hold"? No, that's too contrarian.
