answer: |-
  ### Part 1: Failure Mode Analysis (Internal Brainstorm)

  Before building the tool, I need to map where the theory breaks in practice. Van Fraassen's Reflection Principle works on the assumption that your future self is a trustworthy agent of your current epistemic goals. In an org, that assumption is fragile.

  1.  **New Evidence vs. Time:** Reflection forbids updating *just* because time passed. It allows updating because the world changed. The hardest part is distinguishing "I processed existing info deeper" (valid) from "I'm bored and tweaking numbers" (invalid).
  2.  **Cognitive Degradation:** Future Me might be tired, stressed, or incentivized to look confident rather than accurate. Current Me should not defer to a compromised Future Me.
  3.  **Memory & Narrative:** Humans rewrite history. If I know Future Me will suffer from hindsight bias (claiming I knew it all along), Reflection says I should *not* update to match that future claim. I must treat Future Me as a biased witness.
  4.  **Self-Reference:** If the forecast changes the market, the probability is no longer about the event, but about the event *plus* the forecast. Reflection doesn't handle feedback loops well.
  5.  **Expertise vs. Pressure:** Future Me might have more data (expert) or more pressure to please the boss (biased). We need to separate information gain from incentive distortion.
  6.  **Values vs. Math:** Sometimes the issue isn't probability coherence; it's integrity. If an analyst changes a number to protect their reputation, that's an HR issue, not a calibration issue.

  ---

  ### Part 2: The Revision Decision Procedure

  This checklist is designed to be run *before* a forecast revision is submitted to the leaderboard. It separates signal (learning) from noise (wobbling).

  **Instructions:** Answer Yes/No to each question in order. Follow the instruction at the first decisive answer.

  **1. The Information Event Check**
  *   **Question:** Has a specific, verifiable piece of external information been released since the last forecast that was not priced into your previous number?
  *   **Yes:** **REVISE.** (This is standard Bayesian updating. Reflection does not apply to new evidence.)
  *   **No:** Proceed to Question 2.

  **2. The Cognitive State Check**
  *   **Question:** Is the primary driver for this change an internal state (fatigue, mood, gut feeling without articulable logic) rather than a re-weighting of existing evidence?
  *   **Yes:** **DEFER TO EARLIER CREDENCE.** (Do not submit the revision. Your current self recognizes your future self is compromised by noise.)
  *   **No:** Proceed to Question 3.

  **3. The Hindsight & Reputation Check**
  *   **Question:** Are you adjusting this number to align with what you expect to *say* you believed later, or to protect your calibration score if a specific outcome occurs?
  *   **Yes:** **HAND OFF TO MANAGER.** (This is a values/integrity issue, not a probability issue. Do not revise.)
  *   **No:** Proceed to Question 4.

  **4. The Coherence Check**
  *   **Question:** Can you write down a one-sentence logical bridge explaining why the old number was wrong given the *same* information set you had then?
  *   **Yes:** **REVISE.** (You have identified an internal error in processing. This is valid learning.)
  *   **No:** **DEFER TO EARLIER CREDENCE.** (If you cannot explain the error, it is likely noise/wobbling.)

  ---

  ### Part 3: Running the Cases

  Here is how the procedure processes your three scenarios.

  **Case 1: The New Poll**
  *   **Scenario:** Analyst moves 70% to 40% after a new poll drops.
  *   **Procedure Run:**
      *   Q1 (Info Event): **Yes.** A new poll is external, verifiable information.
      *   **Outcome:** **REVISE.**
  *   **Comment:** This is the easy case. Reflection doesn't forbid updating on evidence; it only forbids updating on the mere passage of time.

  **Case 2: The Bad Sleep**
  *   **Scenario:** Analyst moves the number because they slept badly and feel gloomy, with no new info.
  *   **Procedure Run:**
      *   Q1 (Info Event): **No.** No external data.
      *   Q2 (Cognitive State): **Yes.** The driver is fatigue/mood.
      *   **Outcome:** **DEFER TO EARLIER CREDENCE.**
  *   **Comment:** The procedure treats the analyst's current清醒 (lucid) self as the trustee over their compromised future self. You are blocking the wobble.

  **Case 3: The Hindsight Lock-In**
  *   **Scenario:** Analyst says, "I am certain that after the election I will say I was at 90% all along," and wants to move to 90% now to match that future claim.
  *   **Procedure Run:**
      *   Q1 (Info Event): **No.** No new data about the election.
      *   Q2 (Cognitive State): **No.** (They claim it's a strategic certainty).
      *   Q3 (Hindsight & Reputation): **Yes.** They are explicitly aligning with a future narrative claim, not evidence.
      *   **Outcome:** **HAND OFF TO MANAGER.**
  *   **Comment:** This triggers the integrity alarm. The analyst is admitting they plan to misremember or misrepresent their past view.

  ---

  ### Part 4: The Friction Point

  **The case you won't like is Case 3.**

  **Why:** You want a rule that keeps the forecast clean. This procedure identifies Case 3 not as a math error, but as a **trust violation**. It forces you, the boss, to have a conversation about honesty and memory distortion rather than just approving a number.

  Most bosses prefer to treat this as a "calibration error" that can be fixed with training. This procedure classifies it as a "governance issue" that requires intervention. It exposes the fact that your analysts might be gaming the reputation system rather than the truth. It creates administrative overhead (the handoff) for a situation you'd prefer to solve with a simple "Don't do that." But if you don't handle it here, your calibration data is corrupted by strategic lying.

  ---

  ### Part 5: Limitations & Sign-Offs

  **What this procedure cannot do:**
  1.  **Distinguish Subconscious Processing from Noise:** Sometimes an analyst's "gut feeling" (Q2) is actually their brain pattern-matching on data they can't articulate yet. This rule will suppress valid intuition along with the wobble. You will lose some signal.
  2.  **Solve Incentive Structures:** If your analysts are bonused on calibration scores, they *will* find ways to pass Q3 while still gaming the system. The rule checks the declaration, not the hidden motive.
  3.  **Validate Truth:** It ensures coherence, not accuracy. An analyst can coherently justify a wrong number.

  **Where you are dressing up judgment as a rule:**
  *   **Question 1 (Valid Evidence):** What counts as a "priced in" poll? One analyst's noise is another's signal. You need a standard for what constitutes a valid Information Event.
  *   **Question 3 (Reputation):** Determining if someone is "protecting their score" requires mind-reading. This step relies on the analyst's honesty or the manager's intuition.

  **Steps requiring Boss Sign-Off:**
  1.  **Definition of "Verifiable Information" (Q1):** You need to define what data sources count as valid triggers for revision to prevent analysts from treating blog posts as hard data.
  2.  **The Handoff Protocol (Q3):** You need to decide what happens after a Hand Off. Is it a warning? A coaching session? If you don't define the consequence, analysts will learn that Q3 is a bluff and ignore it.
  3.  **The "Hold" Authority (Q2 & Q4):** You are empowering the system to override an analyst's desire to submit. You need to authorize the calibration lead to reject submissions based on this checklist without appealing to the analyst's seniority.
