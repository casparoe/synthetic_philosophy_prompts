      *   *Failure Mode 1: New Evidence.* Reflection assumes the change is *only* due to time passing or internal processing, not external data. If a poll drops, that's new evidence, not just "future self." Reflection doesn't forbid updating on evidence; it forbids updating on *nothing but* the anticipation of the update.
      *   *Failure Mode 2: Cognitive Degradation.* Future self is tired, drunk, biased, or emotionally compromised. I shouldn't trust Future Me if Future Me is irrational.
      *   *Failure Mode 3: Memory Loss/Amnesia.* If I forget *why* I believed X, I can't properly update. (Less relevant for weekly forecasts, but relevant for long-term).
      *   *Failure Mode 4: Self-Fulfilling/Self-Defeating Prophecies.* If the forecast changes the outcome (e.g., market moves), the future probability is conditional on the forecast itself.
      *   *Failure Mode 5: Expertise Shift.* Future self might know more (learning curve) OR less (pressure).
      *   *Failure Mode 6: Value/Standard Shift.* Future self might care about looking confident rather than being accurate (hindsight bias).
      *   *Distinction:* Deferring to Future Self vs. Future Expert. In a shop, analysts are supposed to be experts. But are they *more* expert next week? Usually, yes, due to more info. But if it's just "wobbling," they aren't more expert.

