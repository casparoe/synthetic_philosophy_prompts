      *   *Selection:* Case 3 is the most dangerous. If the procedure says "Escalate," that's bureaucracy. If the procedure says "Allow it," that's fraud. I should make the procedure flag this as a trust violation. The boss might not like that the procedure forces a confrontation about honesty.
