      *(Refining Case 3)*: The analyst says "I will say I was at 90%." This is hindsight bias. If they move to 90% now, they are lying. If they stay at 70%, they will look uncalibrated later when they (inevitably) claim 90%. The procedure must forbid the move. The Boss won't like that the procedure forces a confrontation about potential dishonesty/memory distortion.

