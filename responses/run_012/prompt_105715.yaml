      *   *Step 3: Hindsight/Reputation Check.* Is the motivation to look good later (hindsight bias)? If yes -> Hand off to human (manager).
      *   *Step 4: Consistency/Logic Check.* Does the new number follow from the old number + reasoning? If no -> Wobble.
      *   *Step 5: The "Lock-in" Check.* (Specific to Case 3). Are you predicting your future bias?
