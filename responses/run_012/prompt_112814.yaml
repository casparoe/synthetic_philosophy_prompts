answer: |-
  Friends, neighbors, members of the committee, and guests who have traveled to be here.

  When this foundation was started sixty years ago, the world was full of holes. There were gaps in the ground where buildings had stood, gaps in the records where names should have been, gaps in the silence where speeches ought to have been delivered. Our founders believed that stone could fill a hole. They believed that a plaque could stop a drift. For six decades we have paid for the weight of things. We have paid for bronze to be cast and lifted. We have paid for halls to be restored so that voices could echo in them again. We have paid for gardens with stones for shipwrecks and obelisks for mill fires. We have operated on the assumption that memory is a structure, and that if you build it sturdy enough, it will hold.

  This year, for the first time, we are giving our award to a village that took a structure down.

  I know how that looks. I know what it feels like to sit in a room where some of you have spent generations arguing for the necessity of the stone, and others of you have spent generations arguing for the necessity of the ground beneath it. I know there are people here who feel that the removal of the nineteenth-century massacre monument was a final erasure, a second injury. I know there are others who feel that keeping it standing was a form of ongoing violence. There are officials here who want to know that the law was followed. There are students here who want to know what the truth is. And there are historians here who know that I am simplifying a century of debate into a single evening.

  I am simplifying it. But I am not dodging it. I want to suggest that the work this foundation has done for sixty years and the work this village has done this year are not opposites. They are two hands holding the same object. To explain why, I need to draw a line that I have come to believe is the only one that matters in this territory. It is the line between forgetting that can be reversed and forgetting that cannot.

  There are ways a community can choose to rest. You can seal records with a date written on the seal. You can take a monument down, crate it, and put it in a warehouse. You can allow an anniversary to pass quietly, unremarked, without ceremony. You can leave a name off a new plaque when it could always be added to the old one later. These are forgettings that can be undone. They are acts of closure that do not burn the bridge behind you. I believe a community may undertake these almost freely. They are a kindness. They are a form of rest. They say to the living: you do not have to carry this weight today. You can set it down, provided you know where you put it.

  Then there is the other kind. Records burned. A monument ground to dust. A name struck from every register in the county so that no trace remains to be found. These cannot be undone. The case for them is far harder, even when the thing remembered is monstrous. Once the dust is swept away, no amount of regret can bring it back.

  This distinction is where our foundation lives, and it is where this year's award belongs.

  For sixty years, people have asked me why we build so many memorials. They ask if we are trying to guilt the living. They ask if we are trying to freeze history in place. The answer is no. We build memorials so that forgetting remains a choice rather than a necessity. When we erect a stone, we are not commanding you to look at it every hour. We are ensuring that if you choose to look, it is there. We are keeping the forgetting reversible. We are providing the warehouse where the memory can be stored safely, so that it does not have to be destroyed to be out of sight. Our work has never been about forcing memory upon the unwilling. It has been about preserving the capacity for memory so that the future is not held hostage by the limitations of the present.

  This year's recipient, the village that planted the orchard, understood this better than most who build stone. They took down a monument that had become a site of contention, a place where injury was rehearsed rather than remembered. They removed the stone from the public square. But they did not burn the history. They did not grind the truth to dust. They let the ground go back to being ordinary. They planted trees that will grow, and die, and grow again. They chose a reversible forgetting. They chose rest.

  I know there is a serious argument against this. There are those who say that some remembering is itself the disease. They argue that a community can be held hostage by an injury it has agreed never to stop rehearsing. They say that sometimes, the only mercy available is irreversible forgetting. They say that to burn the record is to heal the wound, that to destroy the monument is to disarm the weapon. I do not dismiss this. I have seen communities tear themselves apart over a plaque. I have seen the pain in the eyes of descendants who walk past a stone that names their ancestors as villains every single day. There is a mercy in letting the grass grow over the scar.

  But there is a danger in mercy that destroys the evidence of its own necessity. If we agree that irreversible forgetting is the only way to find peace, we surrender the future's right to judge our peace. We surrender the possibility that a generation comes along that is strong enough to look at the monster without becoming it. Irreversible forgetting assumes that we are too weak to handle the truth, now and forever. Reversible forgetting assumes that we are tired today, but that we might be strong enough tomorrow.

  The village chose the orchard because it is living. A stone is static. It says: this happened, and it is fixed. An orchard changes with the seasons. It requires care. It produces fruit. It implies that the ground is not a grave, but a place where life continues. By removing the monument, they acknowledged that the old way of remembering was causing harm. By planting the trees, they acknowledged that the ground itself was not guilty. They made the forgetting reversible because the story remains in the archives, in the schools, in the mouths of the people. They simply stopped demanding that the land itself bear the burden.

  This is why our foundation stands with them. We have spent sixty years building containers for memory. Sometimes that container is a hall. Sometimes it is a plaque. This year, the container is a landscape that refuses to be a shrine. The function is the same. We are all trying to manage the weight of the past so that it does not crush the future.

  To the families who feel this removal is an erasure: I hear you. I know that a stone feels like a promise that the dead will not be moved again. But a promise kept too tightly can become a cage. The history is not gone. It is merely no longer forced upon the eye in the marketplace. It is sealed, not burned.

  To the officials and the skeptics: Nothing illegal happened here. Nothing shameful happened here. A community chose to rest. They chose a forgetting that can be undone if their grandchildren demand it. That is not cowardice. That is stewardship.

  To the historians in the room: I know this is not the whole theory. I know there are books written about the ethics of removal that I have not cited. I am speaking to a crowd, not a seminar. I am speaking about the weight of things in the hands of living people.

  We give this award not because removing a monument is always right, but because doing it this way was right. They drew the line at destruction. They chose the warehouse over the fire. They chose the orchard over the empty lot. They understood that memory is not just about what we keep, but about how we keep it.

  Our foundation will continue to build. We will continue to pay for plaques and halls and stones. We do this because we believe that reversible forgetting is a privilege that requires infrastructure. You cannot put memory in storage if you have no warehouse. You cannot seal the record if you have no seal. We build the warehouses. We build the seals. We build the structures that allow a community to say: we are not ready to look at this today, but we will not destroy it so that our children cannot look at it tomorrow.

  This year, the village showed us that sometimes the warehouse is the earth itself. Sometimes the seal is the season. They have honored the dead by letting the living breathe. They have honored the truth by refusing to turn it into a weapon.

  So we stand here, with our sixty years of stone and this one year of soil, and we say that they belong to the same story. The story is not about remembering versus forgetting. The story is about who holds the key. As long as the key exists, as long as the records are sealed and not burned, as long as the monument is crated and not crushed, the future remains open. That is the work we fund. That is the work we honor. And that is the work that must continue, whether we are lifting a hammer or planting a tree.

  Thank you.
