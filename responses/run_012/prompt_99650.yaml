answer: |-
  Here is a plan for your session, structured to dismantle the 'contest' metaphor and replace it with a framework of mathematical equivalence and conceptual clarity.

  ### 1. The Sequence of Ideas

  You must resist the temptation to start with the history of the debate or the definitions of 'units'. The order must follow the logic of evolutionary mechanics, not the history of the controversy.

  1.  **The Preconditions of Selection:** Establish that evolution by selection requires three things: variation in traits, differential fitness (survival/reproduction), and heritability. Without this, talk of 'units' is vacuous.
  2.  **The Partitioning of Selection:** Introduce the logic that total evolutionary change can be mathematically partitioned into components. Specifically, show that selection can operate simultaneously in opposing directions at different levels of biological organisation (within groups vs. between groups).
  3.  **The Concrete Case:** Apply the partitioning logic to a specific biological scenario. This anchors the abstraction.
  4.  **Replicator vs. Interactor:** Once the mechanics are clear, introduce the ontological distinction. A *replicator* is that which passes on its structure largely intact (the gene); an *interactor* is that which interacts with the environment such that replication is differential (the organism, the group).
  5.  **Framework Equivalence:** Conclude by showing that the 'gene-centred' view and the 'multilevel' view are accounting systems that describe the same physical process.

  **Dependencies:** You cannot discuss the partitioning of selection (2) until the preconditions (1) are accepted. You cannot distinguish replicators from interactors (4) until the students see that selection acts on interactors (via the concrete case). You cannot argue for equivalence (5) until both frameworks have been applied to the same case.

  ### 2. The Concrete Case: Altruism in Trait Groups

  You should nominate **the evolution of altruism in structured populations (Wilson's Trait Group model)**.

  **What it must contain:**
  *   **Opposing Pressures:** The case must demonstrate that within any given group, selfish individuals out-reproduce altruists (within-group selection favours selfishness). However, groups with more altruists produce more dispersers than groups with fewer altruists (between-group selection favours altruism).
  *   **Net Outcome:** Show that if the between-group pressure is strong enough, altruism evolves despite the within-group cost.
  *   **Translatability:** You must explicitly demonstrate how this scenario can be redescribed using Hamilton's Rule ($rb > c$). Show that the 'relatedness' ($r$) in the gene-centred account corresponds to the variance in altruism *between* groups in the multilevel account.

  **What it must avoid:**
  *   **Teleology:** Avoid any language suggesting the group 'tries' to survive or that the evolution is 'for' the stability of the ecosystem.
  *   **Permanent Groups:** Ensure the 'groups' are understood as temporary demographic clusters (e.g., a patch of bacteria, a litter of pups) that dissolve and reform, not permanent species-wide collectives.

  ### 3. Head-Off Points for Misconceptions

  You must intercept these errors at specific moments in the sequence, or they will calcify.

  *   **'Group selection was refuted and is unscientific.'**
      *   **When:** At step 2 (The Partitioning of Selection).
      *   **How:** Present the partitioning not as a biological hypothesis but as a mathematical tautology (derived from the Price Equation logic). Explain that the 'refutation' in the 1960s was of a specific, weak *model* of group selection (naïve group selection), not the mathematical possibility of between-group variance contributing to evolutionary change.
  *   **'It amounts to selection for the good of the species.'**
      *   **When:** At step 3 (The Concrete Case), when defining the 'group'.
      *   **How:** Be rigorous about the definition of the group. Emphasise that the 'group' is a local, transient cluster of competitors, not the species *Homo sapiens* or *Canis lupus*. Selection is for the 'good' of the group only in the sense that the group out-produces other groups, not that it maintains ecosystem balance.
  *   **'The gene-centred view denies the reality of organisms.'**
      *   **When:** At step 4 (Replicator vs. Interactor).
      *   **How:** Use David Hull's distinction. Explain that the gene-centred view identifies the *replicator*, but admits the organism is the *interactor*. The organism is causally real and essential for selection to occur; it is simply not the thing that is being copied.
  *   **'Kin selection and group selection are competing theories.'**
      *   **When:** At step 5 (Framework Equivalence).
      *   **How:** Show the translation explicitly. If they understand that the Trait Group model and Hamilton's Rule yield the same inequality for the same data, they must accept these are perspectives, not rivals.

  ### 4. The Diagnostic Question

  Do not ask them to define a unit of selection. Ask this:

  > 'If we can translate a multilevel selection model into a kin selection model without changing the empirical predictions, what distinct explanatory work is the phrase "unit of selection" actually doing, and why might a philosopher insist on keeping the distinction?'

  **What this reveals:** If they answer by trying to prove one side is 'real', they have failed. If they answer by discussing heuristic value, causal granularity, or the difference between tracking information (replicators) versus tracking causal agency (interactors), they have understood the session.

  ### 5. What to Refuse to Cover

  You must openly refuse to adjudicate on the question: **'Which level is the *true* unit of selection?'**

  State clearly at the outset that this question is a category error akin to asking whether a description of a painting in terms of brushstrokes is 'truer' than a description in terms of shapes and colours. Both are valid accounts of the same object. To spend time arguing for the 'reality' of one over the other is to misunderstand the relationship between mathematical models and biological ontology. Furthermore, refuse to cover the **historical personalities** of the debate (e.g., Williams vs. Wynne-Edwards). This reinforces the narrative of a war to be won, rather than a conceptual puzzle to be dissolved.
