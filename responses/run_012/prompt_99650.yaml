prompt: |-
  I am leading a single session of a graduate reading group in philosophy. My readers have no biology beyond school, but all of them have absorbed the popular gene-centred framing of evolution and assume that the units-of-selection debate is a contest in which one must decide whether selection really acts on genes, on individuals, or on groups. I want a plan for teaching them otherwise — not an explanation of the debate itself. Set out the order in which the ideas have to come, and say what depends on what: I take it that some account of heritable variation in fitness-relevant traits, and of selection being partitioned into a within-group and a between-group component, must precede any talk of units, and that the notion of a unit of selection has to be prised apart from that of a replicator. Nominate the one concrete case that should carry the session; say what it must contain (opposing selection at two levels, so that the gene-centred and multilevel framings can be seen as reformulations of one another rather than rivals) and what it must avoid. Set out the misconceptions I should expect — that group selection was refuted and is therefore unscientific, that it amounts to selection for the good of the species, that the gene-centred view denies the reality of organisms, that kin selection and group selection are competing theories — and say at exactly which point in the sequence each should be headed off. Finally, give me one question to put at the end that would reveal whether they have understood the debate rather than merely learned its slogans, and tell me what I should openly refuse to cover at this level. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Leading a single session of a graduate reading group in philosophy.
      *   **Audience:** Philosophers, no biology beyond school, but influenced by popular gene-centred framing (Dawkins, etc.). They think the "units-of-selection debate" is a "who is the *real* unit?" contest (genes vs. individuals vs. groups).
      *   **Goal:** Teach them *otherwise*. Move away from the "contest" metaphor towards a more nuanced understanding (multilevel selection, Price equation logic, distinction between replicator/interactor).
      *   **Constraints:**
          *   Set out the order of ideas (dependencies).
          *   Nominate *one* concrete case to carry the session.
          *   Specify what the case must contain/avoid.
          *   Identify specific misconceptions and *when* to head them off.
          *   Provide one final diagnostic question.
          *   State what to openly refuse to cover.
          *   **Language:** British English.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   The core misunderstanding is ontological rivalry ("Is it *really* genes or *really* groups?").
      *   The correction is methodological/mathematical equivalence (different ways of partitioning variance).
      *   Key concepts needed: Heritability, Fitness, Variance Partitioning (Price Equation logic without the heavy math), Replicator vs. Interactor (Hull), Multilevel Selection (MLS).
      *   The prompt explicitly states: "some account of heritable variation in fitness-relevant traits, and of selection being partitioned into a within-group and a between-group component, must precede any talk of units, and that the notion of a unit of selection has to be prised apart from that of a replicator." I must follow this structural advice.

  3.  **Drafting the Sequence of Ideas:**
      *   *Step 1: The Substrate.* Need to establish what selection *does* before asking *where* it acts. (Variation, Heritability, Differential Fitness).
      *   *Step 2: The Geometry of Selection.* Introduce the idea that selection can be mathematically partitioned (Within-group vs. Between-group). This undermines the "either/or" framing.
      *   *Step 3: The Vocabulary.* Distinguish Replicator (information) from Interactor (vehicle). This solves the "gene vs. organism" confusion.
      *   *Step 4: The Synthesis.* Show how the gene-centred view and multilevel view are translations of one another.

  4.  **Selecting the Concrete Case:**
      *   Needs to show opposing selection at two levels.
      *   Needs to be simple enough for non-biologists.
      *   Classic examples: Altruism, Meiotic Drive, Trait Groups.
      *   *Selection:* **The Evolution of Altruism via Trait Groups (or similar).** Let's refine this. The prompt asks for a case where gene-centred and multilevel framings are reformulations.
      *   *Best Candidate:* **Altruism in structured populations (e.g., Wilson's Trait Groups or a simplified Prisoner's Dilemma in groups).**
      *   *Why?* It clearly shows within-group selection favouring selfishness and between-group selection favouring altruism. It allows for kin selection translation.
      *   *Refinement:* Let's use **Altruistic Warning Calls in Ground Squirrels** or a simplified **Bacterial Plasmid/Altruism model**. Actually, for philosophers, a conceptual model is often better than messy natural history. Let's go with **Wilson's Trait Group Model of Altruism**. It's the standard pedagogical tool for MLS.
      *   *Wait, a stronger candidate for "gene-centred equivalence":* **Meiotic Drive**? No, too technical. **Altruism** is best because it connects to kin selection (Hamilton's Rule).
      *   *Decision:* **The Evolution of Altruism in Structured Populations.** specifically framed through the lens of **Price Equation partitioning** (conceptually).
      *   *What it must contain:* Opposing pressures (Selfish individuals win within groups; Altruistic groups win between groups).
      *   *What it must avoid:* "Good of the species" teleology.

  5.  **Addressing Misconceptions (and Timing):**
      *   *Misconception 1: Group selection was refuted/unscientific.* -> Head off early, when introducing the partitioning logic. Show it's math, not ideology.
      *   *Misconception 2: Good of the species.* -> Head off when defining the "group" in the concrete case. Ensure groups are temporary/demographic, not species-wide.
      *   *Misconception 3: Gene-centred view denies organisms.* -> Head off when distinguishing Replicator/Interactor.
      *   *Misconception 4: Kin vs. Group selection are rivals.* -> Head off at the end, showing mathematical equivalence.

  6.  **The Final Question:**
      *   Needs to test understanding of the *relationship* between frameworks, not just definitions.
      *   Something like: "If I prove altruism evolves via kin selection, have I disproved group selection?"

  7.  **What to Refuse to Cover:**
      *   Deep mathematical derivations (Price Equation algebra).
      *   The history of the debate (Wynne-Edwards vs. Williams) in detail.
      *   Extended Evolutionary Synthesis controversies (too broad).
      *   *Decision:* Refuse to adjudicate on "Which view is *true*?" because that's the category error.

  8.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* Organise, colour, programme (if noun), modelling, etc.
      *   *Tone:* Academic, precise, directive.

      *(Self-Correction during drafting)*: The prompt says "not an explanation of the debate itself" but a plan for teaching them otherwise. I need to focus on the *structure* of the session.
      *   *Sequence:*
          1.  The Logic of Selection (Variation, Heritability, Fitness).
          2.  The Partitioning of Selection (Within vs. Between).
          3.  The Concrete Case (Altruism in Trait Groups).
