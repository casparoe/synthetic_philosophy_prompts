          5.  Equivalence of Frameworks.
      *   *Wait, the prompt says:* "I take it that some account of heritable variation... and of selection being partitioned... must precede any talk of units." I should follow this order.
      *   *Revised Sequence:*
          1.  Preconditions (Variation, Heritability, Fitness).
          2.  Partitioning (Within/Between).
          3.  Concrete Case (applies 1 & 2).
          4.  Units (Replicator/Interactor).
          5.  Equivalence (Kin/Group).

      *   *Refining the Concrete Case:* It needs to show the *same* evolutionary outcome described in two ways. Altruism is perfect.
      *   *Refining Misconception Timing:*
          *   "Group selection refuted": Address when introducing Partitioning (Step 2).
          *   "Good of species": Address when defining the Group in the Case (Step 3).
          *   "Gene view denies organisms": Address when introducing Replicator/Interactor (Step 4).
          *   "Kin vs Group rivals": Address at the very end (Step 5).

      *   *Refusing to Cover:* Do not cover the *history* of the controversy (Williams 1966 etc.) as it reinforces the "war" narrative. Do not cover the *mathematics* of the Price Equation, only the logic.

      *   *Final Question:* "If we can translate a group selection model into a kin selection model without changing the empirical predictions, what work is the phrase 'unit of selection' actually doing?"

  9.  **Review against Constraints:**
      *   British English? Yes.
      *   Order of ideas? Yes.
      *   Dependencies clear? Yes.
      *   One concrete case? Yes (Altruism in Trait Groups).
      *   Case contents/avoids? Yes.
      *   Misconceptions mapped to sequence? Yes.
      *   One final question? Yes.
      *   What to refuse? Yes.

  10. **Final Polish:** Ensure the tone is authoritative yet helpful for a session leader. Check that the distinction between "unit of selection" and "replicator" is clear (Hull's distinction). Ensure the "reformulations" aspect is highlighted.

  *(Self-Correction on "Unit of Selection" vs "Replicator"):* The prompt says "notion of a unit of selection has to be prised apart from that of a replicator." I need to make sure I use Hull's terminology (Interactor vs Replicator) to clarify that genes are replicators, organisms/groups are interactors, and "unit of selection" is often an ambiguous conflation of the two.

  *(Final check on British English)*: "Organise", "modelling", "programme" (maybe not needed), "favour", "behaviour".

