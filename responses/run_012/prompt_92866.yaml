answer: |-
  Here is the plan for your ninety-minute session. It is structured to dismantle the classical identification of *inconsistency* with *triviality* before introducing the notion of a *true contradiction*. If you reverse this order, the session will collapse into a debate about the Liar Paradox specifically, rather than a lesson on logical consequence.

  ### I. The Sequence of Dependencies

  You must present the material in this specific order. Each step creates the conceptual space required for the next.

  **1. Consequence as Containment (Minutes 0–15)**
  *   **The Move:** Do not start with truth. Start with *consequence*. Define logical consequence for them not as truth-preservation (which they know), but as *information containment*. If $B$ follows from $A$, the information in $B$ is already contained in $A$.
  *   **Why this first:** Classical logicians equate "inconsistent premises" with "no information." You must decouple inconsistency from emptiness. You need them to see that a set of sentences can be inconsistent (contain $A$ and $\neg A$) but still contain specific information (not *all* sentences).
  *   **Dependency:** This establishes the vocabulary needed to define Explosion without invoking truth values immediately.

  **2. The Principle of Explosion as a Bridge, Not a Law (Minutes 15–30)**
  *   **The Move:** Present *Ex Falso Quodlibet* ($A, \neg A \vdash B$) not as a self-evident truth, but as a specific structural bridge connecting inconsistency to triviality. Show that in Classical Logic (CL), this bridge is mandatory.
  *   **Why this second:** You cannot motivate paraconsistency until they feel the weight of Explosion. Frame Explosion as a *cost*: it means that in CL, any inconsistency destroys the theory's ability to discriminate information.
  *   **Dependency:** This sets up the distinction between "Inconsistent" and "Trivial." In CL, they are co-extensive. In the session's new framework, they must come apart.

  **3. Paraconsistency: The Logic of Non-Trivial Inconsistency (Minutes 30–45)**
  *   **The Move:** Define a paraconsistent consequence relation simply as one where the Explosion bridge is removed. $A, \neg A \nvdash B$.
  *   **Why this third:** You must define the *tool* before the *application*. Paraconsistency is a property of the logic (the consequence relation), not the world.
  *   **Dependency:** This is the prerequisite for "true contradiction" to be intelligible. If Explosion holds, "true contradiction" implies "everything is true," which is absurd. If Explosion fails, "true contradiction" implies only "some things are true and false," which is merely counterintuitive.
  *   **Crucial Planting:** **This is where you plant the Paraconsistency/Dialetheism distinction.** State clearly: "Paraconsistency is the engine; Dialetheism is the driver. You can have the engine without the driver." One can reject Explosion (paraconsistency) without believing any contradictions are actually true (dialetheism).

  **4. The Cost of Classical Repairs (Minutes 45–60)**
  *   **The Move:** Before introducing the dialetheic solution, analyze the classical solutions to the core example (see below). Show that avoiding contradiction classically requires sacrificing expressive power (e.g., Tarskian hierarchies prevent you from stating your own semantic theory).
  *   **Why this fourth:** You need to motivate *why* anyone would accept a contradiction. It must be presented as the "least bad option" compared to the classical repairs.
  *   **Dependency:** This makes dialetheism look like a theoretical virtue (expressive completeness) rather than a capitulation to confusion.

  **5. Dialetheism: The Claim of True Contradictions (Minutes 60–75)**
  *   **The Move:** Now define dialetheism: the view that some sentences $A$ are such that $A$ and $\neg A$ are both true.
  *   **Why this fifth:** Only now, with Explosion disabled and classical repairs shown to be costly, does "true contradiction" land as a coherent philosophical position rather than a confusion.
  *   **Dependency:** Relies on the prior separation of inconsistency from triviality.

  **6. The Law of Non-Contradiction (LNC) Status (Minutes 75–85)**
  *   **The Move:** Clarify the status of $\neg(A \land \neg A)$. In many paraconsistent logics, this is still a valid theorem (it is never *false*), but it is not *true* in all models (it can be both true and false).
  *   **Why this sixth:** This heads off the misconception that dialetheists simply "deny the LNC." They accept it as a theorem but deny it as a universal truth.
  *   **Dependency:** Requires understanding the distinction between validity and truth established in step 1.

  **7. Diagnostic and Scope Limit (Minutes 85–90)**
  *   **The Move:** Pose the diagnostic question and list exclusions.

  ---

  ### II. The Core Example: The Liar Paradox

  **Decision:** You **must** let the Liar carry the session, but with a strict constraint on how it is framed.

  **Argument for the Liar:**
  Do not use Vagueness (Sorites) or Moral Dilemmas. Vagueness allows students to retreat to epistemicism or supervaluationism too easily; Moral Dilemmas allow retreat to "ought implies can." The Liar is the only case where the classical repair strategies (hierarchies, truth-value gaps) incur a direct, palpable cost to *expressive power* that graduate philosophers can recognize. The Liar forces the issue of semantic closure: a theory of truth that cannot apply to itself is expressively incomplete.

  **What the Example Must Have:**
  1.  **Semantic Closure:** The example must demonstrate that the language contains its own truth predicate.
  2.  **Inter-substitutivity:** It must show that $Tr(\langle A \rangle)$ and $A$ are interchangeable *salva veritate* in the object language.
  3.  **Recalcitrance:** It must be presented not as a puzzle to be solved, but as a *datum* that resists classical classification.

  **What the Example Must Lack:**
  1.  **Indexicality:** Do not use "This sentence is false" if it invites discussion about context-dependence. Use a formalized Gödel sentence or a fixed-point construction to block the "context shift" escape route.
  2.  **Ambiguity:** Ensure the students cannot dismiss it as an equivocation on "true."
  3.  **"Pathology" Framing:** Do not introduce it as a "paradox" (which implies a mistake exists to be found). Introduce it as an "antinomy" (a conflict between two plausible principles).

  **Why not avoid it?** If you avoid the Liar, you reduce dialetheism to a formal curiosity. The Liar is the historical and philosophical engine of the view. If they cannot see the pull of the Liar, they will not see the pull of dialetheism.

  ---

  ### III. Mapping Misconceptions and Interventions

  You must anticipate these four specific collapses and intervene at the precise moments listed.

  **1. Misconception: "Paraconsistent logic just *is* the claim that contradictions are true."**
  *   **The Collapse:** Students conflate the logic (the rules) with the metaphysics (the truth).
  *   **Intervention Point:** **Minute 30 (Step 3).**
  *   **The Move:** When defining paraconsistency, explicitly state: "A paraconsistent logician can believe every contradiction is false. They merely insist that *if* one were true, it wouldn't explode the system." Use the analogy of a fireproof building (paraconsistent) vs. a building on fire (dialetheism). You can build fireproof structures without intending to burn them down.

  **2. Misconception: "Dropping explosion licenses anything."**
  *   **The Collapse:** Students assume that without Explosion, there are no constraints on inference.
  *   **Intervention Point:** **Minute 20 (Step 2).**
  *   **The Move:** When discussing Explosion, show a derivation in a paraconsistent system (like LP) where $A, \neg A \vdash A \lor B$ holds, but $A, \neg A \vdash B$ fails. Show that inference is still restrictive; only the *specific* bridge to triviality is removed.

  **3. Misconception: "The Law of Non-Contradiction has simply been denied."**
  *   **The Collapse:** Students think dialetheists assert $\exists x (x \land \neg x)$ and therefore reject $\forall x \neg (x \land \neg x)$.
  *   **Intervention Point:** **Minute 75 (Step 6).**
  *   **The Move:** Distinguish between the LNC as a *theorem* (valid formula) and the LNC as a *truth*. Explain that dialetheists can accept $\neg(A \land \neg A)$ as a valid theorem (it is never *false*) while denying it is *true* in every case (it can be both). They do not deny the law; they deny its *universal truth*.

  **4. Misconception: "Dialetheism is relativism or a refusal to criticize."**
  *   **The Collapse:** Students think if contradictions are allowed, any theory is as good as any other.
  *   **Intervention Point:** **Minute 65 (Step 5).**
  *   **The Move:** Emphasize that dialetheism is *realist*. A contradiction is true only if the world (or semantics) makes it so. Most contradictions are still false. The criteria for theory choice (simplicity, scope, explanatory power) remain intact. Accepting a contradiction is a *cost*, not a free pass.

  ---

  ### IV. The Distinction: Paraconsistency vs. Dialetheism

  **Where to Plant It:** **Minute 30 (Immediately after defining Paraconsistency).**

  **Why there:** If you wait until the end, the session will have already collapsed into the assumption that studying paraconsistent logic commits one to dialetheism. You must establish that Paraconsistency is a *modality of consequence*, while Dialetheism is a *commitment to truth*.
  *   **Phrasing:** "Paraconsistency is the claim that inconsistency does not entail triviality. Dialetheism is the claim that some inconsistencies are true. You can accept the first as an instrumentalist about logic without accepting the second as a realist about truth. Most paraconsistent logicians are not dialetheists."

  ---

  ### V. The Diagnostic Question

  At Minute 85, pose this single question to the room:

  > **"If I hand you a sound and complete paraconsistent logic, have I forced you to accept that any specific contradiction is true?"**

  *   **Correct Answer:** No. (This reveals they grasp that the logic is a container, not a content generator.)
  *   **Incorrect Answer:** Yes. (This reveals they have collapsed paraconsistency into dialetheism.)
  *   **Follow-up:** "Then why would anyone adopt such a logic if not to model true contradictions?" (Answer: To model inconsistent information without collapse, e.g., in databases, legal codes, or belief revision, without committing to the truth of the inconsistency.)

  ---

  ### VI. What to Openly Refuse to Cover

  To stay within ninety minutes, you must explicitly exclude the following at the start (Minute 5):

  1.  **Proof Theory:** Do not teach them how to construct tableaux or natural deduction derivations in LP or K3. They need the philosophical concept of consequence, not the mechanical syntax.
  2.  **The History of Indian Logic:** While Jaina logic is historically relevant, discussing it will sidetrack the session into history rather than structural logic.
  3.  **Other Paradoxes:** Explicitly bracket the Sorites Paradox, Russell's Paradox, and Zeno's Paradoxes. Acknowledge they are relevant, but state that the Liar is the *sine qua non* for this session. If you open the door to Sorites, the discussion will dissolve into vagueness semantics.
  4.  **Quantum Logic:** Do not allow the "quantum superposition" analogy. It invites physicalist reductions that obscure the logical point about consequence relations.

  **Final Instruction:** Keep your hand on the brake during the Liar discussion. The students will want to solve the Liar. Your job is to prevent them from solving it classically and force them to live in the tension long enough to see why the logic must change.
