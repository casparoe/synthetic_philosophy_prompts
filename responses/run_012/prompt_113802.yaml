          *   *Verdict:* The dispute is often masked here. Reductionism is primarily alethic; Anti-Reductionism is often alethic but motivated by the necessity of division of labour. If the "division of labour" is a separate pragmatic norm, neither theory fully captures it, but Anti-Reductionism is closer.

