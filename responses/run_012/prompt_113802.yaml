          *   *Anti-Reductionism:* The default is entitlement. But does it cover *re-tellers*? If A tells B tells C, does C have the same entitlement as if A told C? Standard Anti-Reductionism (Burge, McDowell, Lackey's early work) usually focuses on the *presentation* of truth. A re-teller isn't presenting their own grounds. *Refinement:* Anti-reductionists might need to distinguish between *generative* testimony and *transmissive* testimony. If they don't, they risk the "rumour" problem (Chinese Whispers). They likely need a "no-defeater" condition that gets stricter with chain length or requires the chain to be a recognized institution.

      *   **Section 2: Warrant vs. Entitlement (Division of Labour).**
