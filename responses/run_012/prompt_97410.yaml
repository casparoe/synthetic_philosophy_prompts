answer: |-
  This is a classic tension in the philosophy of biology, and your TA is pointing you toward the distinction between *logical* possibility and *methodological* practice. Gould and Lewontin (G&L) wrote a polemic, not a formal proof, which is why it feels rhetorically satisfying but empirically slippery.

  Here is my decomposition of your specific claim: **"For any biological trait, in practice the evidence a working biologist can actually get will almost always be consistent with at least one adaptive explanation, so adaptationist hypotheses are effectively not falsifiable in the day-to-day research context."**

  ### The Decomposition

  **(a) Whether the unfalsifiability charge is true of the strongest version of adaptationism vs. only a strawman.**
  *   **Credence:** 0.50
  *   **Reasoning:** G&L definitely caricatured the "Panglossian Paradigm," but they weren't shooting at a ghost; in the 1970s, a significant cohort of behavioral ecologists *did* operate under a "assume adaptation first" heuristic that was resistant to disconfirmation. However, the "strongest version" (everything *must* be adaptive) is logically trivial to falsify (find one vestigial trait). The charge holds water only against the *methodological habit*, not the explicit theory. It's a wash between strawman and accurate critique of culture.

  **(b) Whether it's true of what actual working biologists do vs. what the theory in principle permits.**
  *   **Credence:** 0.25
  *   **Reasoning:** This is the weakest link in the claim. Your TA is right. In modern quantitative genetics, phylogenetics, and biomechanics, adaptive hypotheses are rejected constantly. We have measures of selection gradients ($\beta$), costs of traits, and null models (like Brownian motion) that allow biologists to say, "The data fits drift better than selection." If the claim is about *day-to-day research*, biologists falsify adaptive stories routinely (e.g., traits that reduce fitness, or traits with zero heritability).

  **(c) Whether a spandrel/byproduct/drift explanation is a genuine rival to an adaptation explanation or just a supplement.**
  *   **Credence:** 0.60
  *   **Reasoning:** This supports the G&L critique. In practice, "exaptation" often saves the adaptationist program. If a trait isn't adaptive *now*, maybe it was adaptive *then* (historical adaptation). If it isn't for *this* function, maybe it's for *that* function. The adaptive story often mutates rather than dies, absorbing the "spandrel" critique as a modification (e.g., "It's a spandrel that was later co-opted"). This resilience makes the *core* adaptationist research programme hard to kill, even if specific hypotheses fail.

  **(d) Whether a spandrel can even be identified independently, or whether calling something a spandrel is itself an unfalsifiable move.**
  *   **Credence:** 0.40
  *   **Reasoning:** This is the *tu quoque*. To prove something is a spandrel, you must posit a causal mechanism (developmental constraint, pleiotropy, drift). Critics argue these mechanisms are just as hard to prove negatively as selection is. However, developmental constraints are often physically measurable (e.g., physical laws of shell growth), whereas historical selection pressures are inferred. It's not *fully* unfalsifiable, but it is empirically difficult, lending some weight to the idea that swapping "adaptation" for "spandrel" is just swapping one hard-to-prove story for another.

  **(e) Whether falsifiability is even the right diagnostic here at all, vs. something like explanatory power or evidential weight.**
  *   **Credence:** 0.30
  *   **Reasoning:** From a philosophy of science standpoint (Lakatos, Kuhn), "falsifiability" is a blunt instrument for historical sciences. Research programmes aren't abandoned because of anomalies; they are abandoned when they stop generating novel predictions. Framing the critique as "unfalsifiable" is a category error. The real critique should be about "degenerating problem shifts." If we judge by explanatory power, adaptationism often wins because it generates testable models, whereas "it's a spandrel" can be a conversation stopper.

  ---

  ### Synthesis and Final Number

  To get the final credence in the claim ("Adaptationist hypotheses are effectively not falsifiable in practice"), I am weighting these sub-questions. The claim relies heavily on (b) and (c). If biologists actually falsify things (low b), the claim fails. If adaptive stories are resilient supplements (high c), the claim holds.

  However, (b) is the empirical reality check. Since biologists *do* reject adaptive hypotheses with quantitative data, the "effectively not falsifiable" clause is empirically false, even if the "resilient research programme" clause is philosophically true. Furthermore, (e) suggests the metric itself is flawed.

  **My Final Credence: 0.32**

  I am siding closer to your friend (0.2) than you (0.55). The claim is too absolute ("almost always," "effectively not falsifiable"). While G&L won the *culture war* (biologists are now forced to consider null hypotheses), they did not prove that adaptationism is methodologically bankrupt. It is falsifiable; it just requires rigorous work to do so, which G&L felt was being skipped.

  ### Sensitivity Analysis

  **Which sub-question moves the needle most?**
  **Sub-question (b): Practice vs. Theory.**
  This is the pivot point. If you could show that 90% of published adaptationist papers never test a null model or measure costs, my number would jump to 0.7. If you show that 90% of papers use comparative methods to reject adaptation in favor of drift, my number drops to 0.1.
  *   **What would settle this:** A meta-analysis of evolutionary biology literature. Sample 500 papers proposing an adaptive function. Code them for: (1) explicit null models (drift/constraint), (2) quantitative measurement of fitness costs/benefits, (3) rejection of the adaptive hypothesis. If the rejection rate is low *despite* data, G&L win. If the rejection rate is significant, the TA wins.

  **Is this empirical or rhetorical?**
  It is currently decided by **rhetoric and norms**, not raw data. The "settlement" of the Spandrels paper was that it changed the *norms* of review. Editors now demand null models. So, G&L's critique was a *performative* falsification: by stating adaptationism was unfalsifiable, they forced the community to make it falsifiable. The truth value of the claim changed *because* they made the claim.

  ### Calibration: You vs. Your Friend

  **Whose number is off?**
  I think **your number (0.55)** is slightly too high, and your **friend's number (0.2)** is slightly more accurate regarding modern practice, though perhaps too dismissive of the historical context.

  **Where is the gap?**
  The gap between you (0.55) and your friend (0.2) is almost entirely driven by **Sub-question (b)** and **Sub-question (e)**.

  *   **You** are likely weighting **(c)** and **(d)** heavily. You feel the *resilience* of the adaptive story (it always mutates rather than dies) and the difficulty of proving a spandrel. You are reacting to the *logical space* where an adaptive story can always be concocted.
  *   **Your Friend** is weighting **(b)** heavily. They are looking at the *methodological reality* that biologists use statistics to kill adaptive hypotheses all the time. They are also implicitly weighting **(e)**—sensing that "unfalsifiable" is the wrong accusation for a research programme that produces quantitative predictions.

  **Verdict:** Your friend is more aligned with how the science *actually operates* today (post-G&L), but you are more aligned with the *philosophical vulnerability* that G&L exposed. The reason my number is 0.32 is that while the vulnerability exists, the scientific community patched the hole. G&L complained the house had no locks; biologists heard them and installed locks. To say the house is *still* unfalsifiable ignores the locks they installed *because* of the complaint.
