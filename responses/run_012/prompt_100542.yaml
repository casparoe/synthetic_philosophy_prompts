answer: |-
  Here is the plan for the fifty minutes. It is designed to sequence the cognitive load so that students cannot retreat into the two familiar failures (etiquette or determinism) without tripping over the structure you have built.

  ### I. The Sequence and Dependencies

  **The Core Principle:** You must establish the **mechanism** before you discuss the **politics**. If you start with the political stakes (power/sexism), the "etiquette" students will dismiss it as moralizing, and the "determinism" students will treat it as causal proof. If you start with the linguistic mechanism (markedness), both groups have to engage with the structure first.

  **The Order:**
  1.  **The Mechanism (The Substitution Test):** Establish the tool using low-stakes data.
  2.  **The Carrier Case ("Chairman"):** Apply the tool to a human example with a "respectable defense."
  3.  **The Payoff (Hofstadter):** Use the satire to reveal the mechanism's operation in race, once the tool is mastered.
  4.  **The Boundary (Determinism vs. Influence):** Distinguish how language *channels* thought without *building* it.

  **Why this order?**
  *   **Test before Case:** If you present the historical case first (e.g., "The history of 'mankind'"), students will immediately argue history or intent. If you give them the Substitution Test first on neutral ground, they possess a diagnostic tool *before* they encounter the charged material. They become analysts, not litigants.
  *   **Carrier before Payoff:** Hofstadter is too potent for the opening. If you start with race, the room polarizes. If you start with gendered professional titles (familiar, debated, but less volatile), you build the analytical muscle. Hofstadter then serves as the "advanced application" that confirms the pattern, rather than the battleground.

  ---

  ### II. The Single Example: "Chairman"

  Do not use "Mankind" (too abstract) or "Fireman" (too easily dismissed as obsolete). Use **"Chairman."**

  *   **Why it works:**
      *   **Mechanical Substitution:** "Chairman" $\rightarrow$ "Chair" or "Chairperson." The swap is clean.
      *   **Respectable Defender:** There is a genuine etymological and stylistic argument here. "Chair" comes from *chaise*; "Man" was often a suffix for "person" (mankind). A defender can say, "I use 'Chairman' because it denotes the office, not the gender, just as 'mankind' denotes humanity." This position is defensible enough that students cannot simply mock it; they must dismantle it using the Test.
      *   **Inflammatory Ceiling:** It signals gender, but it does not immediately trigger the same defensive paralysis as racial slurs. It allows for cold analysis.
      *   **Markedness Visibility:** It pairs perfectly with "Male Nurse." You can show that "Nurse" defaults to female (marked by "Male"), while "Chair" defaults to male (marked by "Woman Chair").

  **Hofstadter's Role:** **The Payoff (Minutes 35–45).**
  Do not let it carry the session. Its cleverness is a trap; if used first, students admire the wit and miss the linguistics. Use it *after* they have successfully applied the Substitution Test to "Chairman."
  *   **Instruction:** "We just saw how 'Man' can function as a neutral default that excludes women. Hofstadter asks us to run that same test on 'White.' Read this not as a political argument, but as a structural mirror."
  *   **Why:** This prevents the "Is this racist?" debate. The question becomes "Does the linguistic mechanism hold?"

  ---

  ### III. The 50-Minute Map & Misconception Interception

  **0:00–0:05: The Hook (The "Accent" Puzzle)**
  *   **Activity:** Ask: "Who in this room has an accent?"
  *   **Expected Result:** Most point to the ESL students or regional speakers.
  *   **Point:** "Linguistically, everyone has an accent. But we only *mark* the ones that deviate from our default. Today is not about politeness. It is about who counts as the default."
  *   **Intercept:** **The Etiquette Misconception.** You have framed the hour as cognitive/structural, not moral.

  **0:05–0:15: The Tool (The Substitution Test)**
  *   **Activity:** Present the Test.
      1.  Take a term assumed neutral (e.g., "Lion").
      2.  Swap in the specific group (e.g., "Male Lion").
      3.  Ask: Does the meaning change?
      *   *Result:* "Lion" = Species. "Male Lion" = Specific. "Lion" is neutral.
      *   *Contrast:* "Nurse." Swap in "Male Nurse."
      *   *Result:* "Nurse" implies female. "Male Nurse" is marked.
  *   **Task:** Have students apply this to "Chairman." If I say "The Chairman is here," and a woman walks in, is the statement false? (Most will say no). If I say "The Chairwoman is here," and a man walks in, is the statement false? (Most will say yes).
  *   **Intercept:** **The Lexical Fix.** Students will suggest "Just say Chair." Stop them. "We aren't fixing words yet. We are diagnosing why 'Chairman' felt neutral to you in the first place."

  **0:15–0:25: The Case (The Respectable Defense)**
  *   **Activity:** Introduce the Defender. "A reasonable person argues: 'Man' in 'Chairman' is etymological, not biological. It means 'human.' To change it is to erase history."
  *   **Discussion:** Ask the History Colleague (pre-briefed or invited) to weigh in on the etymology. Validate the history.
  *   **Pivot:** "History explains the *origin*, not the *current effect*. If the word functions to exclude women *now*, does its origin matter?"
  *   **Intercept:** **The History/Etymology Trap.** This prevents the session from becoming a history lecture. It acknowledges the colleague without ceding the linguistic point.

  **0:25–0:35: The Stakes (Influence vs. Determinism)**
  *   **Activity:** Ask: "If we change 'Chairman' to 'Chair,' does sexism end?"
  *   **Consensus:** No.
  *   **Ask:** "If we keep 'Chairman,' are we forced to be sexist?"
  *   **Consensus:** No.
  *   **Point:** "Language does not *determine* thought (Whorf). It *habituates* it. It makes certain assumptions cheaper to think than others. It is a current, not a cage."
  *   **Intercept:** **The Whorfian Misconception.** This explicitly kills the "words cause sexism" argument while preserving the "words sustain sexism" argument.

  **0:35–0:45: The Mirror (Hofstadter)**
  *   **Activity:** Distribute the "Person Paper" excerpt.
  *   **Task:** "Apply the Substitution Test. Where does the persona claim 'White' is neutral? Where does the neutrality fail?"
  *   **Discussion:** Focus on the *structure* of the complaint, not the *race* politics. "He is using our linguistic tool against us."
  *   **Intercept:** **The Satire/Sincerity Misconception.** Explicitly state: "Hofstadter is not arguing for 'Chairwhite.' He is showing you how 'Chairman' sounds to those excluded."
  *   **Intercept:** **The Analogy Misconception.** If a student says, "But race isn't gender," agree. "The *history* is different. The *linguistic mechanism of the default* is the same. We are analyzing the mechanism."

  **0:45–0:50: The Diagnostic & The Refusal**
  *   **Activity:** The Closing Question (see below).
  *   **Closing:** State the boundaries (see below).

  ---

  ### IV. Classroom Dynamics

  *   **Students of Color / ESL Students:** Do **not** ask them for testimony ("How does this make you feel?"). This tokenizes them and makes them targets. Ask for *linguistic observation* ("What happens to the meaning when we swap the term?"). This protects them while valuing their likely heightened sensitivity to markedness.
  *   **The History Colleague:** Give them a specific lane. "Professor X, can you confirm the etymological defense?" Then, gently close the lane. "Thank you. So the history is real. The question is whether the history justifies the current default." This prevents the session from drifting into "Everything was sexist in the 18th century" (which is true but irrelevant to the linguistic mechanism).
  *   **The "Etiquette" Students:** When they say "It's just PC," refer back to Minute 5. "We aren't discussing manners. We are discussing information processing. Does the term convey accurate data, or does it convey a default assumption?"

  ---

  ### V. The Closing Question & The Refusal

  **The Diagnostic Question (Last 5 Minutes):**
  Do not ask about gender. Do not ask about race. Ask about **Ability.**

  > *"I am going to describe a building. I say, 'The building is accessible.' I do not say, 'The building is wheelchair accessible.' I say, 'The stairs are steep.' I do not say, 'The stairs are able-bodied steep.'*
  >
  > *Run the Substitution Test. Who is the default human in the word 'accessible'? And why do we mark the stairs but not the ramp?"*

  *   **Why this works:** It forces them to find the "Default" (the able-bodied person) without using gender. If they can see that "accessible" implicitly means "accessible to walkers unless marked otherwise," the concept has landed.

  **What to Refuse to Cover (Say this out loud):**
  > *"I want to be clear about what we are not doing today. I am not here to police your vocabulary. I am not going to give you a list of 'good words' and 'bad words.' And I am not arguing that changing words will solve inequality.*
  >
  > *We are doing something harder. We are learning to hear the assumptions you didn't know you were making. You can leave here and use whatever terms you like. But you cannot un-hear the default once you've identified it."*

  **Why this refusal?**
  It disarms the "Word Police" accusation by explicitly renouncing policing. It disarms the Determinism accusation by admitting words don't solve inequality. It leaves them with the only thing that matters: **Awareness.**
