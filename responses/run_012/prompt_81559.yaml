answer: |-
  **The one-liner**
  My guest argues that lying and misleading are morally different kinds of acts, not just different degrees of badness. He says lying abuses your trust, while misleading abuses your inference, and he thinks that distinction matters. We're going to test whether that line holds up when real people are trying to keep their health coverage.

  **The questions**

  1.  Let's start with the core distinction. You say a lie asks me to take your word for it, while a misleading truth asks me to do the work of getting it wrong myself. Why is that a moral wall between them, and not just a slope?
      *   *Follow-up:* If the outcome is the same—I walk away believing something false—why does the path I took to get there change your responsibility?

  2.  The law loves this distinction too. Fraud basically requires a false statement of fact. Are you describing a moral reality, or are you just describing what lawyers find convenient?
      *   *Follow-up:* If the law changed tomorrow to punish misleading exactly like lying, would your moral argument change, or would you say the law was finally catching up to morality?

  3.  So what proves this is moral? Is there a case where misleading is legally fine but you'd still call it wrong?
      *   *Follow-up:* If you can't point to a case where they come apart, how do we know morality isn't just copying the law's homework?

  4.  I want to bring this to my job. I write for an insurer. Our style guide says: "Do not make statements that are false; make statements that are complete." We say "may be reviewed" when it's already flagged. Am I in the clear?
      *   *Follow-up:* You say lying recruits trust. Doesn't saying "may be" recruit trust in your wording to hide the decision you've already made?

  5.  Here's my worry. If I lie, you might doubt me. If I mislead you, you doubt yourself. You walk away confident in a falsehood. Isn't that worse?
      *   *Follow-up:* So your theory says I'm less responsible for damaging your confidence than I am for damaging your trust?

  6.  You say the liar makes himself a party to my belief. When I write "may be reviewed," aren't I asking you to trust my choice of words enough not to look deeper?
      *   *Follow-up:* If I rely on you trusting my phrasing to hide the truth, haven't I still recruited your trust, just secretly?

  7.  It feels like a loophole. Is it possible the distinction is real, but using it intentionally to hide bad news corrupts it?
      *   *Follow-up:* So is the wrongness not the misleading itself, but the intention to use the distinction as a shield?

  8.  You say misleading puts the work on me. Does that mean I have a duty to read defensively? To assume you're hiding something?
      *   *Follow-up:* If I have to read defensively to avoid being wronged, doesn't that make the wrongness depend on how tired or busy I am?

  9.  If I'm a philosopher, I know to check. If my grandmother reads that letter, she won't. Is the same sentence moral for me but immoral for her?
      *   *Follow-up:* That makes morality about the victim's sophistication, not the speaker's action. Are you okay with that?

  10. What if I can't read defensively? If you're the insurer and I need the benefits, I can't afford to doubt you. Does the power gap close the loophole?
      *   *Follow-up:* So in real-world power dynamics, is the distinction between lying and misleading basically collapsed anyway?

  11. Last one. Would you want your own family treated by these rules?
      *   *Follow-up:* If not, why recommend them for strangers?

  **Where he'll wriggle**
  He will try to shift the blame to "conversational norms" (you inferred X, I didn't say X) or "intent" (I didn't mean to deceive). When he does, don't let him hide in his head. Drag him back to the listener's experience: "It doesn't matter what you meant, it matters what she walked away with." If he says "people should know better," hit him with the power imbalance: "They can't afford to know better."

  **The one I keep if we run long**
  Question 11. It's a personal stake question that lands well, but if we run out of time, the philosophical work is done in question 10. Cutting the personal appeal preserves the argument about power and sophistication without losing the core point.
