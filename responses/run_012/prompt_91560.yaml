      Two identical mouths where the gravel meets the pine.
      I made a promise before I left the line:
      Save the turn for the place where the values lie.
      But here I am, and the signs are blind.
      **I tell myself to drive on.**
      It feels like wisdom, sparing the first decline,
      Keeping the hope for the second design.
      Yet if this is the second, the wisdom is waste,
      And if this is the first, the turn is a haste.
      My mind cannot weigh what my eyes cannot see,
      So the plan binds my hands to a single key.
      The light changes, the moment is gone,
      **I tell myself to drive on.**
      Now the road ends where the prize should be,
      A straight line home, but not the wealth I sought.
      The map was perfect, the driver was not,
      Caught between the route I planned and the turn I caught.

