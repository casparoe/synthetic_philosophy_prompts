answer: |-
  The ward hums. That's the first thing you notice, deeper than the beep of monitors or the shuffle of shoes. It's the low, hydraulic thrum of the perfusion bridges. They line the walls like silver ribs, tubing snaking out into the bays, pulsing synthetic red against clear plastic.

  We keep two kinds of quiet here. In Bay One through Ten, the bodies are warm, chests rising on the machine's rhythm, but the lights behind the eyes are out. Brain dead. The bridges keep them pink, kept viable for parts or for families who aren't ready to let the skin go cold. They are legally dead, but they look like they're sleeping.

  In Bay Eleven through Twenty, the hearts have stopped. The bridges kick in immediately, trying to shock the muscle back into rhythm. If the heart doesn't catch within six minutes, we call it. We switch the bridge off. Cardiac death.

  I'm checking vitals on Bed Fourteen. Mr. Henderson. His heart gave out forty-five seconds ago. The bridge took over instantly, pushing oxygenated blood through a silent pump. The protocol clock on the wall above his head is counting up in bright red LEDs. 00:48. 00:49.

  "Pressure holding?" Mark asks. He's leaning against the counter, chart in hand. He doesn't look at Henderson. He looks at the clock.

  "Perfusion is stable," I say. I'm touching Henderson's wrist. It's warm. That's the trick of the bridge; it maintains thermal homeostasis better than a living heart sometimes. "But no spontaneous contraction."

  "Give it time."

  "There isn't time. You know the protocol."

  Mark shrugs. "Six minutes is the line, Elena. Not five, not seven. Six."

  I look at the EEG monitor. This is the thing we aren't supposed to focus on during a cardiac workup. The protocol assumes that if the heart doesn't restart in six minutes, the brain has suffered irreversible ischemia despite the bridge. It assumes the person is gone, even if the meat is salvageable. But the screen shows alpha waves. Steady, rolling rhythms. Sleep-like, but present.

  02:15.

  I lean in. "Mr. Henderson? Can you hear me?"

  Nothing. His chest rises because the machine tells it to.

  03:30.

  I check the pupillary response. I lift his eyelid. The iris is brown, speckled with gold. I shine the penlight. The pupil constricts. Sharp, crisp.

  "Mark," I say. "Pupils are reactive."

  He glances over, then back at his chart. "Reflex arcs don't mean consciousness. You know that."

  "The EEG isn't flat."

  "The EEG isn't the protocol. The heart is the clock."

  I feel a cold knot in my stomach, the kind I used to get when I was a kid waiting for my dad to come home from a shift that ran late. Only now I'm the one holding the shift. I look at Henderson's hands. They are resting on the sheet, palms up. There's a wedding band on the left ring finger. Gold, worn thin.

  04:45.

  I decide to test it. I take a sterile gauze and press firmly against the nail bed of his thumb. It's a pain stimulus. Standard procedure.

  His hand twitches. Not a spasm, not a reflex jerk. He withdraws. He pulls his thumb away from the pressure, then his fingers curl, gripping the sheet for a second before relaxing.

  I freeze. "Did you see that?"

  Mark puts the chart down. "See what?"

  "He grabbed the sheet. He withdrew from pain."

  "Muscle memory. Residual nerve firing."

  "He's tracking the pain, Mark. The brain is online. The heart is just... tired."

  05:10.

  The hum of the bridge seems to get louder. The red numbers glow: 05:11. 05:12.

  "If I keep this on past six minutes," Mark says, his voice dropping, "I'm violating discharge of care. If the heart doesn't restart, he's cardiac dead. Keeping the bridge on a dead body is resource misappropriation. You know the billing codes."

  "He's not dead," I say. My voice sounds too loud in the bay. "Look at him. He's right there."

  "He's got no pulse of his own. That's the definition."

  "The definition is a number on a wall."

  "It's the law."

  05:40.

  I look at Henderson's face. There's a furrow in his brow. Is it pain? Is it effort? Or is it just the settling of skin over bone? I want to tell him it's okay. I want to tell him that I know he's in there, listening to us argue over whether he exists.

  I think about my own father, three beds down in the general ICU, hooked up to older tech. He's alive by every metric, but some days he doesn't know my name. Some days I wish the bridge would just take over so I wouldn't have to watch him fade. But here, with Henderson, the fade hasn't happened. The light is on. The house just won't open the door.

  05:50.

  "Prepare to disengage," Mark says. He moves to the console. His hand hovers over the manual override.

  "Wait," I say. I grab his wrist. "Look at the EEG."

  The waves are spiking. Beta now. Alert. Anxious.

  "Elena, let go."

  "If you turn it off, you're killing him. Not letting him die. Killing him."

  "If I don't, I'm practicing medicine outside of standards. We can't keep everyone on the bridge. There aren't enough machines."

  "So we pick the ones whose hearts beat back?"

  "We pick the ones who meet the criteria."

  05:55.

  The alarm chimes softly. One minute warning.

  Henderson's chest rises. Falls. Rises. Falls. The blood is moving. The oxygen is there. The brain is firing. The heart is silent.

  I look at the switch. It's a heavy plastic guard, red underneath. Lift to cut.

  I look at Henderson's hand again. The fingers are still slightly curled from before.

  "Protocol," Mark says. He isn't looking at me anymore. He's looking at the clock.

  05:58.

  My hand is on the rail of the bed. I can feel the vibration of the pump traveling through the metal. It feels like a pulse. It feels like life.

  05:59.

  The numbers blink.

  I look at Mark. He looks at me. He waits for me to step back. He waits for me to be the nurse who knows the line.

  06:00.

  The alarm changes tone. A steady, flat tone. Time's up.

  Mark's hand moves toward the guard. I don't move mine. The hum of the machine fills the space between us, loud as a scream, loud as a whisper.
