answer: |-
  # Q&A Prep Sheet: Semantics & Pragmatics Reading Group
  **Thesis:** Indicative/Counterfactual is a modal distance continuum (single similarity-ordering semantics).
  **Goal:** Survive the hour without the project collapsing.

  ---

  ### 1. The Triviality Trap (Highest Damage)
  **Who:** The Experimentalists (Probability/Judgment focus).
  **The Objection:** "If indicatives are just counterfactuals at the 'near-actual' end of the scale, they should obey the same probability constraints. But indicatives generally obey Stalnaker's Thesis ($P(A \to B) = P(B|A)$), while counterfactuals don't. If you unify the semantics, you inherit Lewis's Triviality Results for the indicative end. Unless your 'distance' parameter blocks the triviality proof, your semantics implies that probability functions can only take two values. How do you dodge Lewis without positing the very semantic split you're trying to eliminate?"

  **2-Minute Reply:**
  "I agree this is the critical pressure point. My strategy is to treat the 'modal distance' not just as a semantic parameter, but as a contextual restrictor on the domain of worlds over which the probability function is defined. For indicatives (near-actual), the domain is restricted to epistemically accessible worlds where the probability function behaves conditionally. For counterfactuals (distant), the domain shifts to similarity-ordered worlds where the probability function tracks causal or metaphysical dependence rather than pure conditional probability. I'm not claiming the *logic* changes, but the *domain of quantification* for the probability measure shifts along the continuum. This allows me to maintain a unified truth-conditional semantics while blocking the triviality result by varying the measure, not the operator."

  **⚠️ HONEST SOFT SPOT:**
  **This is your biggest vulnerability.** You admitted you haven't fully worked out the probability story. The reply above is a *promise* of a solution, not the solution itself. If they press for the formal proof of how the domain restriction blocks Lewis's proof specifically for the "near-actual" slice, you will stall.
  **Strategy:** **Pre-empt this in your talk.** Add a slide titled "Limitations & Future Work: Probability." Explicitly state: *"While the truth-conditional unification holds, the probabilistic mapping for the indicative end requires a restricted domain approach to avoid triviality. I am currently formalizing the constraints on the probability measure that correspond to the 'near-actual' threshold."* This makes you look rigorous and honest, rather than like you were caught unprepared.

  ---

  ### 2. The "Past Fixity" Constraint (High Damage)
  **Who:** The Stalnaker/Lewis Theorists (Hardcore Similarity).
  **The Objection:** "You're treating the distinction as gradient, but the data suggests a hard boundary regarding the past. I can say, 'If Oswald didn't shoot Kennedy, someone else did' (indicative) even if I'm unsure about the past. But I cannot say, 'If Oswald didn't shoot Kennedy [and we assume he did], someone else did' using indicative morphology. Counterfactuals allow us to hold the past fixed and twist the antecedent; indicatives require the antecedent to be epistemically open. A continuum predicts intermediate cases where the past is 'slightly fixed,' but that's nonsense. The past is either fixed or it isn't. Doesn't this prove a categorical semantic difference?"

  **2-Minute Reply:**
  "That's a strong intuition, but I argue it's pragmatic, not semantic. The 'fixed past' constraint is a conversational implicature derived from the cooperative principle. When I use the indicative morphology, I signal 'near-actual distance.' In normal conversation, the actual world includes the actual past. To suggest a deviation from the actual past while using 'near-actual' signaling creates a pragmatic clash, forcing the speaker to switch to counterfactual morphology to signal 'distant.' The semantics allows the slide; the pragmatics of communication enforce a threshold. We see this in historical present tense or 'fake past' contexts where indicatives *do* discuss known falsehoods without crashing, suggesting the boundary is permeable."

  **⚠️ HONEST SOFT SPOT:**
  You need a concrete example of an indicative with a known-false antecedent that doesn't sound like a counterfactual. If you don't have one ready, they will crush you. The "historical present" defense is weak.
  **Strategy:** Have a specific corpus example ready (e.g., quiz show contexts: "If the answer is Paris, you win" — when both know the answer is already fixed).

  ---

  ### 3. The "Kratzer Rebrand" Charge (Medium Damage)
  **Who:** The Kratzerian.
  **The Objection:** "This sounds like you've just reinvented Modal Base plus Ordering Source. In my framework, the distinction is whether the Modal Base contains the actual world (indicative) or is counterfactual (subjunctive). Your 'modal distance' is just my 'Ordering Source.' Why should we adopt your terminology and machinery when Kratzer's system already handles the gradient nature of modality without needing to posit a controversial continuum for conditionals specifically?"

  **2-Minute Reply:**
  "The difference lies in the structural role of the distance parameter. In Kratzer's system, the modal base is a set of propositions; the switch is binary (actual world in or out). My proposal puts the 'distance' into the selection function itself. This matters for the Oswald/Kennedy pairs. In Kratzer's system, you often need to stipulate different modal bases to get the truth conditions right for the pair. In my system, it's the *same* modal base, just a different selection point on the similarity ordering. This explains why the two sentences feel semantically related yet distinct, without requiring a lexical ambiguity or a binary switch in the modal base composition."

  **⚠️ HONEST SOFT SPOT:**
  The distinction between "Ordering Source" and "Similarity Ordering" is technically thin. If they press on how your selection function differs mathematically from a Kratzerian ordering source, ensure you emphasize the **selection function** ($f(w, A)$) vs. **intersection of propositions**.
  **Strategy:** Don't get bogged down in notation. Emphasize the *explanatory payoff* for the Oswald/Kennedy minimal pair.

  ---

  ### 4. The "Missing Middle" Empirical Challenge (Medium/Low Damage)
  **Who:** The Experimentalists (Judgment focus).
  **The Objection:** "If this is a continuum, we should see gradient judgments on inference patterns like Antecedent Strengthening or Transitivity. We should find cases where transitivity is '50% valid.' But psycholinguistic data usually shows categorical clustering: people either accept the inference or they don't. Where is the empirical evidence for the middle of your scale? If the cognitive processing is categorical, why posit a continuous semantics?"

  **2-Minute Reply:**
  "I argue the categorical processing is a result of the 'thresholding' I mentioned earlier. However, there is emerging data on 'weak counterfactuals' or 'open future subjunctives' where speakers hesitate. My prediction is that if you prime speakers with contexts that blur the epistemic distance—like high-uncertainty forecasting—you will see increased variance in acceptance rates for inferences like contraposition. The categorical data you're seeing reflects the default settings of the indicative vs. counterfactual prototypes, not the underlying semantic capacity."

  **⚠️ HONEST SOFT SPOT:**
  You might not have this data. If they ask for the citation, you might be stuck.
  **Strategy:** Frame this as a *prediction* of your theory that invites collaboration. "This is exactly the kind of experimental work I'm hoping to collaborate on next."

  ---

  ### 5. The Material Conditional Zombie (Low Damage)
  **Who:** The Old-School Guy.
  **The Objection:** "All this talk of similarity ordering is overcomplicating things. If the antecedent is false, the conditional is true. Your 'near-actual' indicatives still suffer from the paradoxes of material implication. If I say 'If the moon is cheese, I am a billionaire,' your theory says that's false because the world is distant. But intuitively, that's just vacuously true or nonsense. Why not just stick to the material conditional for indicatives?"

  **2-Minute Reply:**
  "Because the material conditional cannot handle the Oswald/Kennedy pair. Both 'If Oswald didn't shoot, someone else did' and 'If Oswald hadn't shot, someone else would have' have true antecedents (in the sense that we are supposing them), yet they have different truth values. The material conditional collapses them. My similarity ordering preserves the intuitive truth-value difference without positing two different logical operators. It's strictly more explanatory power for the same cost."

  **⚠️ HONEST SOFT SPOT:**
  None really. This is a standard win for similarity semantics over material implication. Just don't get drawn into a debate about "paradoxes."

  ---

  ### 🛑 THE ONE QUESTION I'M HOPING NOBODY ASKS
  **The "Morphology-Semantics Mapping" Problem**

  **The Question:** "If the semantics is a single continuum, why does English (and most languages) have a **binary** morphological distinction? If there are intermediate degrees of modal distance, why is there no intermediate morphology? Why don't we have a 'slightly counterfactual' verb form? If the semantics is gradient but the syntax is binary, haven't you just moved the ambiguity from the semantics to the syntax-semantics interface, solving nothing?"

  **Why this hurts:** It attacks the core motivation. If the language forces a binary choice, positing a continuous semantics creates a mismatch that requires extra pragmatic machinery to explain away. It makes your theory less parsimonious than the binary semantic theories you are criticizing.

  **Prepared Defense (If cornered):**
  "Binary morphology is common for gradient concepts (e.g., singular/plural for quantity, present/past for time). Languages often discretize continuous domains for communicative efficiency. The cost of learning a continuum of verb forms outweighs the benefit. The 'lossiness' of the binary morphology is exactly what generates the pragmatic thresholds I described earlier. The semantics is analog; the signal is digital."

  **(Note: This is a standard linguistic defense, but be prepared for them to push back on whether 'number' and 'tense' are truly analogous to 'modal distance'.)**
