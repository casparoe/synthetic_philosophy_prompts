prompt: |-
  I'm a 4th-year PhD student and in a few weeks I have to present at a semantics-and-pragmatics reading group that I'm pretty sure is stacked against me. My thesis, roughly: the indicative/counterfactual distinction isnt a real semantic split at all — it's a continuum of "modal distance" from the actual world, and "indicative" and "counterfactual" are just labels for the two ends of that scale. I want to defend a single similarity-ordering semantics that covers both kinds of conditional, where indicatives just sit at the near-actual end of the ordering, and I claim this gets the Oswald/Kennedy pairs right (if Oswald didn't shoot Kennedy then someone else did, versus if Oswald hadn't shot Kennedy then someone else would have) without positing any lexical or structural ambiguity. The further claim, which is the part I'm least sure survives contact, is that the things everyone treats as categorical differences — antecedent strengthening, transitivity, contraposition, the intuition that a counterfactual presupposes its antecedent is false — are actually gradient and just fall out of where you sit on the scale.

  The audience is the problem. There are two hardcore Stalnaker/Lewis similarity theorists who are convinced the indicative/counterfactual difference is a genuine semantic one (different accessibility relations, or a genuinely different semantics for the two, take your pick), one Kratzerian who I'm fairly sure will say I've just reinvented modal base plus ordering source and that the whole distinction is whether the modal base contains the actual world, a couple of people who do experimental work on people's probability judgments about conditionals and who will want to know exactly how I dodge Lewis's triviality results, and one old-school guy who thinks indicatives are basically material conditionals and is going to come at me with the false-antecedent / paradoxes-of-material-implication stuff.

  Draft my Q&A prep sheet: the objections this particular room will actually raise — not the generic textbook objections, the ones these specific people will make — ordered by how much damage they'd do to me, each phrased the way that person would phrase it, with a two-minute reply and an honest note on where the reply is soft. Include the one question I'm really hoping nobody asks.

  One warning that might matter for the prep: I haven't fully worked out the probability story for the indicative end of the scale yet, so if there's an obvious place that gap shows through, flag it so I can pre-empt it instead of getting caught on it live.
