answer: |-
  # SEMINAR ACTIVITY: THE CITATION MARKET (Williams)

  **Materials:** 
  *   **Motivation Decks:** 14 envelopes, each with 5 index cards (see *Sets* below).
  *   **Action Deck:** 10 cards describing actions (e.g., "Give up seat," "Take painkiller," "Donate savings," "Stop smoking").
  *   **Whiteboard:** Track "Valid Citations" vs. "Void Citations."
  *   **Timer:** Visible to all.

  **Sets:** 
  *   **Normal (10 students):** Mix of concrete desires ("Want tenure"), commitments ("Promise to sister"), dispositions ("Hate pity"), and instrumental goals ("Stay healthy to sail").
  *   **The Wall (4 students):** 
      1.  *The Psychopath:* Only desires are immediate sensory gratification. No future concern, no care for others.
      2.  *The Nihilist:* No desire to be decent, no desire to be liked, no desire for future self.
      3.  *The Survivalist:* Every desire is conditional on being alive; no desire *to* be alive.
      4.  *The Stoic:* Indifferent to pain/pleasure; only values "acting correctly" (but no content to what that is).

  **The Rules (The Internalist Engine):**
  1.  **Secret Hands:** Keep motivation cards hidden. These are your *only* reasons.
  2.  **Citation:** Player A draws an Action Card and targets Player B. A says: "You have a reason to [Action]."
  3.  **The Trace:** A must trace a route from B's *actual* cards to the Action. 
      *   *Allowed:* Instrumental reasoning ("You want X, this does X"), belief correction ("You believe Y, but Z is true").
      *   *Forbidden:* Inventing desires ("Anyone would want..."), Moral Oughts ("It's wrong..."), Counterfactual Motivation ("If you were rational...").
  4.  **Challenge:** B listens. If the route skips a step or assumes a desire B doesn't hold, B says: **"I remain unmoved."** Citation is void. A loses turn.
  5.  **Success:** If B accepts the trace, B marks the Action as "Done." A scores a point.

  **Timeline (90 Mins):**
  *   **00–15: Setup.** Deal envelopes. Explain rules *without* using words "reason," "internal," or "external." Call them "Moves," "Cards," and "Traces." Emphasize: "You cannot give someone a card they don't have."
  *   **15–45: Round 1 (Normal).** Free play. Students circulate, citing actions. TA referees strictly. If a student says "But you should," stop them: "Check the cards."
  *   **45–60: Round 2 (The Wall).** Swap 4 students to *The Wall* sets. Continue play. Watch the room stall. Citations will fail. Frustration will rise.
  *   **60–90: Debrief.** Stop play. Reveal the philosophy.

  **Predicted Failures & Fixes:**
  *   **Cheating (Idealization):** Students argue "If you thought clearly, you'd want this." 
      *   *Fix:* Enforce the "Actual Cards" rule. "Show me the card."
  *   **Moral Slip:** "You have a reason because it's *good*." 
      *   *Fix:* Mark as Void immediately. "That's not in the hand."
  *   **Boredom:** If tracing is too easy. 
      *   *Fix:* Add a 2-minute timer per citation. Pressure creates errors.

  **Debrief (Connecting to Williams):**
  1.  **Map Mechanics:** 
      *   Hand = **Subjective Motivational Set (S)**.
      *   Trace = **Sound Deliberative Route**.
      *   "I remain unmoved" = **Rejection of External Reasons Statement**.
  2.  **The Wall:** Ask the 4 "Wall" students: "Were you irrational?" (Internalism says no). Ask the citers: "Did you feel they *should* have moved?" (Externalist intuition).
  3.  **The Terms:** Now introduce "Internal vs. External Reasons." Explain Williams' claim: External reason statements are false because they lack a link to *S*.
  4.  **Blame:** Discuss why we blame the Psychopath if they have no internal reason to be decent. (Williams: Blame is a tool to *create* a reason, not recognize one).

  **Limitation Note:**
  The game makes external reasons *illegal moves*. It cannot stage them as *true but inaccessible*. You must supply the metaphysical weight: explain that externalists claim these reasons exist *even if* the rules forbid citing them. The game simulates the *agent's perspective*, not the *observer's normative judgment* that the agent is wrong despite their coherence.

  \unstaged{The normative force of a reason independent of the agent's subjective motivational set}
