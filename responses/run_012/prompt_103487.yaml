      *(Self-Correction during drafting)*: I should check if "The Lucas Critique" is truly the best fit. The Lucas Critique is specifically about *expectations* altering *behavioral equations*. The user's example is about *visibility* altering *recorded data*. While related, **Measurement Reactivity** or **Surveillance Bias** is closer to the mechanism. However, philosophically, **Theory-Ladenness** captures the "meaning changes" aspect best. I will present a mix.
