answer: |-
  You have identified a genuine and sophisticated problem in social science and policy evaluation. You are correct that this is distinct from Goodhart's Law (which requires gaming) and distinct from simple correlation/causation errors. You are describing a situation where the **mapping between the phenomenon and the metric is non-stationary**—it changes when the system changes.

  There is no single, universally agreed-upon name for this specific pattern in philosophy, though it is recognized in fragments across economics, epidemiology, and the philosophy of science. Below are the nearest existing candidates, why they fall short, a proposed term if you wish to adopt one, and finally, a critique of where your reasoning may be overstating the case.

  ### Part 1: Existing Candidates

  #### 1. Construct Validity (Psychometrics / Social Science)
  *   **The Concept:** In measurement theory, "construct validity" asks: *Does this test actually measure the abstract concept it claims to measure?* If you use "arrests" as a proxy for "crime rate," you assume a stable relationship between the two.
  *   **Why it fits:** Your observation is exactly that the *validity* of the construct (e.g., "Recorded Usage" as a proxy for "Actual Usage") breaks down when the legal context changes. The link between the latent variable (use) and the observed variable (record) is severed.
  *   **Where it falls short:** Construct validity is usually treated as a static property of a test (e.g., "This IQ test is valid"). It does not inherently account for the *dynamic* nature of policy intervention. It describes the *flaw*, but not the *mechanism* of the shift caused by the policy itself.

  #### 2. The Lucas Critique (Economics)
  *   **The Concept:** Formulated by Robert Lucas (1976), this argues that you cannot predict the effects of a policy change using historical data because the "parameters" of the economy (people's behavior and expectations) change when the policy changes.
  *   **Why it fits:** It is the strongest structural analog. It explicitly states that past correlations (e.g., between inflation and unemployment) cannot be trusted after a policy shift because the agents in the system alter their behavior.
  *   **Where it falls short:** The Lucas Critique focuses on *rational expectations* and *behavioral change* (people consume less because tax is higher). Your example includes *measurement visibility* (people admit use because they aren't scared). While related, the Lucas Critique is about the *system dynamics*, whereas your observation is about the *observation mechanism* itself becoming unreliable.

  #### 3. Theory-Ladenness of Observation (Philosophy of Science)
  *   **The Concept:** Associated with Norwood Hanson and Thomas Kuhn, this posits that there is no "neutral" observation; what we see is determined by the theoretical framework we hold.
  *   **Why it fits:** It captures your point that the "meaning" of the figure changes. A "drug death" in a prohibition regime is a criminal statistic; in a health regime, it is a medical statistic. The data is not raw; it is cooked by the legal framework.
  *   **Where it falls short:** It is an epistemological claim (about knowledge), not a methodological one. It tells us *why* we disagree, but it doesn't offer a handle for how to evaluate the policy. It is too broad; it applies to all science, not just policy metrics.

  ### Part 2: A Proposed Term

  Since no existing term captures the specific intersection of *policy intervention*, *metric definition*, and *interpretive ambiguity*, I propose the following term for your use:

  **Term:** **Regime-Dependent Validity** (or **The Metric Regime Problem**)

  **Definition:** A condition in social measurement where the semantic relationship between an indicator (the number) and the target phenomenon (the reality) is contingent upon the regulatory or legal regime in place. When the regime changes, the indicator does not merely reflect a change in the phenomenon; it reflects a change in the *visibility* or *definition* of the phenomenon, rendering longitudinal comparison invalid without adjustment.

  **Boundaries:**
  *   **What it covers:** It applies to social metrics where the act of measurement or reporting is influenced by the rules being measured (e.g., crime stats, drug use, unemployment in systems with different benefit rules).
  *   **What it does not cover:** It does not apply to physical metrics independent of human reporting (e.g., temperature, rainfall). It does not apply to gaming or fraud (Goodhart's Law); it applies even under perfect honesty. It does not apply to simple causal confusion; it applies specifically when the *definition* of the data point shifts.

  ### Part 3: Where You Are Overstating

  Your analysis is logically sound, but you may be overstating the *total blindness* of the data. Here is where your reasoning is most vulnerable:

  **1. The Claim of Total Ambiguity ("The figure cannot choose between them")**
  You argue that the figure is equally compatible with both stories (Success vs. Failure). In Bayesian terms, you are treating the likelihood ratio as 1:1. This is rarely true.
  *   **Counter-Observation:** Metrics usually have **asymmetric sensitivity**. Decriminalization typically causes a *sharp, one-time step-change* in reported usage (the "hidden population" reveals itself), followed by a plateau. Prohibition typically causes a *slow, grinding suppression* of data.
  *   **The Discriminator:** If you see a sudden 20% spike in usage immediately following decriminalization, followed by stability, that supports the "visibility" hypothesis. If you see a continuous 5% year-over-year climb for a decade, that supports the "increased use" hypothesis. The *shape* of the time-series data often discriminates between the two narratives, even if the *absolute number* does not.

  **2. The Assumption of Single-Metric Reliance**
  You describe a scenario where "the figure" (singular) is used. In modern epidemiology and policy, **triangulation** is the standard response to Regime-Dependent Validity.
  *   **Counter-Observation:** We are not limited to self-reported surveys or arrest records. We have wastewater analysis (chemical measurement of drug metabolites), hospital admission codes (medical rather than legal), and toxicology on *all* deaths (not just suspected overdoses).
  *   **The Discriminator:** Wastewater data is regime-independent (sewage doesn't care about the law). If wastewater data stays flat while survey data rises, the "visibility" hypothesis is confirmed. If both rise, the "increased use" hypothesis is confirmed. The figure *can* choose, provided you do not rely on a single indicator.

  **3. The "Step Likely to Be Wrong"**
  The step in your reasoning most likely to be wrong is: **"The problem would survive entirely honest reporting."**
  *   **Why:** You assume that "honest reporting" implies a fixed relationship between *Truth* and *Report*. But in social systems, the *cost* of honesty is part of the reporting function.
  *   **The Error:** Under prohibition, an honest user *lies* on a survey to avoid legal risk. Under decriminalization, an honest user *tells the truth*. The "honesty" of the respondent is not a constant variable; it is a function of the policy. Therefore, the "noise" introduced is not random; it is systematic and predictable.
  *   **Correction:** The metric isn't "blind"; it is **calibrated differently**. If you treat the pre-policy and post-policy data as coming from two different instruments (which they effectively are), you can still compare them by applying a correction factor (e.g., estimating the "hidden population" size via capture-recapture methods).

  ### Summary
  You have identified **Regime-Dependent Validity**. It is not that the data is useless, but that it is **non-stationary**. The error lies not in the data, but in treating social metrics as physical constants rather than context-sensitive signals. To defeat the ambiguity, one must stop looking for a single "smoking gun" number and start looking for **convergence across regime-independent metrics** (like wastewater or anonymous biological sampling).
