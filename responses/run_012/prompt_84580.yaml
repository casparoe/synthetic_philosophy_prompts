answer: |-
  ### Exam Question (90 Minutes)

  **Question 1**

  Consider two descriptions of the past. 

  The first is a **Perfect Chronicle**: a record that captures every event exactly as it occurs, with perfect accuracy, but contains no reference to anything that happens later. In this record, a soldier writes a letter on the 14th, and a battle is lost on the 15th. The record does not label the letter "the last cheerful one" or "the beginning of the deception," because those labels depend on the battle and the capture that haven't happened yet.

  The second is a **Historical Explanation**: a narrative that connects the letter to the battle, explaining *why* the letter matters by using knowledge of the outcome.

  Answer the following in a unified essay:

  1.  Does the Perfect Chronicle contain "history"? If not, what specific element is missing that the Historical Explanation possesses?
  2.  Is the disagreement between the Covering-Law model (which seeks universal rules) and the Narrative view (which seeks stories) a dispute about **ontology** (how the world actually works) or **semantics** (how we must write to make sense of it)?
  3.  Can a Narrative Explanation function without *any* appeal to general norms (e.g., "soldiers normally write cheerfully until captured")? If a narrative *does* rely on such norms, does this mean the Covering-Law model is actually correct, or does it mean the Cover-Law model is trivially true but useless?

  ***

  ### Model Answer

  The Perfect Chronicle fails to contain "history" because it lacks significance. History is not merely a sequence of occurrences; it is a selection of occurrences organized by their consequences. In the Chronicle, the letter on the 14th is physically identical to the letter in the Historical Explanation, but it is not the *same event*. An event is defined partly by its place in a causal chain that extends into the future. The Chronicle captures the *data*, but History captures the *meaning* generated by retroactive understanding. What is missing is the narrative structure that allows later events to illuminate earlier ones. The Chronicle is blind to the future; History is structured by it.

  This suggests the debate between the Covering-Law and Narrative views is primarily semantic, not ontological. The Covering-Law model insists that explanation requires subsuming events under general laws. The Narrative view insists explanation requires telling a story. If the dispute were ontological, it would claim human actions are either law-governed or free. But both sides can agree human action is complex. The real fight is about what counts as an *explanation*. The Covering-Law model demands a logical deduction; the Narrative view demands intelligibility. The Chronicle shows that you can have all the "initial conditions" (the data) without having an explanation. Therefore, the dispute is about the form of the text required to transform data into understanding, not about whether the universe obeys laws.

  However, the Narrative view cannot function without appealing to general norms. A story is only followable if the audience understands what is "normal." If a soldier writes a cheerful letter, we only find it significant that he was captured later if we hold the norm that "captivity usually ends cheerfulness." Without that implicit generalization, the connection between the letter and the capture is arbitrary. The narrative relies on the reader's expectation of how things usually go to highlight how *this* thing went.

  Does this concede the argument to the Covering-Law model? Not exactly. It renders the Covering-Law model trivially true but explanatorily empty. Yes, there is a "law" involved (people act according to norms), but stating the law does not do the work of the explanation. The work is done by showing *how* this specific instance deviates from or fulfills the norm within a specific context. The Covering-Law model is correct that norms are present, but wrong that citing the norm constitutes the explanation. The Narrative view is correct that the story is the explanation, but wrong to think it operates without implicit laws. They are talking past each other: one describes the logical skeleton (which is always there), while the other describes the flesh and blood (which is what we actually want to know). The Chronicle proves that the skeleton alone is not history.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **General Grading Note:** 
  *   **B Grade (10-14 marks):** Identifies the key concepts and answers the three sub-questions competently. Treats the views as opposing camps. Relies on standard objections (e.g., "Hempel is too rigid").
  *   **A Grade (15-20 marks):** Synthesizes the sub-questions into a coherent argument. Recognizes the "triviality" trap. Distinguishes clearly between the structure of the world and the structure of the text.

  **1. The Chronicle and Significance (4 Marks)**
  *   **Success:** Identifies that the Chronicle lacks *retroactive significance* or *selection based on consequence*. It argues that events are defined by their future relations, not just present properties.
  *   **B vs A:** A **B** says the Chronicle is "incomplete." An **A** argues the Chronicle describes a different *ontology of events* (events as fixed vs. events as relational).
  *   **Typical Fluff:** "The Chronicle is boring because it has no plot."

  **2. Ontology vs. Semantics (4 Marks)**
  *   **Success:** Explicitly distinguishes between a dispute about reality (laws in nature) and a dispute about language (forms of explanation). Argues the debate is largely semantic/logical.
  *   **B vs A:** A **B** picks a side ("It is about text"). An **A** explains *why* the ontological question is a red herring for the definition of explanation.
  *   **Typical Fluff:** Confusing the two, claiming historians don't believe in laws so the ontology is false.

  **3. Narrative and Norms (4 Marks)**
  *   **Success:** Acknowledges that narrative requires implicit generalizations/norms to be intelligible (deviation from the expected).
  *   **B vs A:** A **B** says narratives need "context." An **A** specifies that context relies on *counterfactual norms* ("normally X would happen").
  *   **Typical Fluff:** Claiming narrative is purely unique and requires no generalizations at all.

  **4. The Triviality Objection (4 Marks)**
  *   **Success:** Addresses whether narrative's use of norms validates Covering-Law. Concludes that Covering-Law becomes "trivially true" (laws exist but don't explain) rather than "false."
  *   **B vs A:** A **B** says Covering-Law is wrong. An **A** argues Covering-Law is vacuous—it describes the container, not the content.
  *   **Typical Fluff:** Dismissing Covering-Law entirely without addressing the "secret law" in narrative.

  **5. Synthesis and Resolution (4 Marks)**
  *   **Success:** Concludes whether the views are incompatible or complementary. Argues they answer different questions (logical structure vs. intelligibility).
  *   **B vs A:** A **B** concludes "both have strengths." An **A** argues one view subsumes the other or exposes the other as a category mistake.
  *   **Typical Fluff:** Sitting on the fence without a justificatory argument ("It depends on the historian").
