answer: |-
  Here is a disambiguation of the claim "a hand up, not a handout" (or "teach a person to fish"), sorted by the kind of assertion being made, arranged from the nearly empty to the very strong.

  ### I. Claims About Consequences (Empirical/Instrumental)
  *These readings argue that one method produces better outcomes than the other. They are falsifiable by data.*

  **1. The Benevolence Reading (Nearly Empty)**
  *   **Claim:** "We intend for our intervention to improve your long-term situation, not just patch your immediate deficit."
  *   **Verdict:** **Platitude.** It asserts good intent without specifying a mechanism. It is compatible with almost any policy, including doing nothing.
  *   **What must be shown:** Nothing, other than the speaker's subjective intent.
  *   **Policies Licensed:** None specifically. Compatible with unconditional cash, training, or sanctions.
  *   **Consequence vs. Entitlement:** Purely rhetorical. It sounds like a claim about consequences but commits to neither consequences nor rights.

  **2. The Human Capital Reading (Substantive)**
  *   **Claim:** "Providing skills or employment support reduces long-term dependency more effectively than providing cash alone."
  *   **Verdict:** **Substantive and Defensible.** This is an empirical hypothesis. It is true in some contexts (tight labor markets, skills gaps) and false in others (structural unemployment, disability).
  *   **What must be shown:** Longitudinal data showing that recipients of training/welfare-to-work enter sustained employment at higher rates than recipients of unconditional cash, net of cost.
  *   **Policies Licensed:** Subsidising training, career counselling, wage subsidies. Does *not* inherently license removing cash support during training.
  *   **Consequence vs. Entitlement:** Claim about **Consequences**. However, in your office, this is often swapped: if training *works better*, it is treated as if the recipient is *entitled* only to training.

  **3. The Moral Hazard Reading (Strong)**
  *   **Claim:** "Unconditional cash creates perverse incentives that actively discourage work, making the recipient poorer in the long run."
  *   **Verdict:** **Conditionally True.** It holds in a town where low-paid work is available and the "benefit trap" (losing benefits upon working) is steep. It is **false** in a town where jobs do not exist or pay less than the benefit floor; in that case, cash does not discourage work because work is not a viable option.
  *   **What must be shown:** Elasticity of labor supply among beneficiaries. You must show that the availability of cash causes people to reject available jobs they would otherwise take.
  *   **Policies Licensed:** Making payment conditional on appointments attended, refusing cash in favour of vouchers or training, strict sanctions for missed deadlines.
  *   **Consequence vs. Entitlement:** Starts as **Consequences** (cash changes behavior), but is used to justify **Entitlement** (therefore you do not deserve cash).

  ### II. Claims About Entitlement (Normative/Deontological)
  *These readings argue about what is morally owed, regardless of the outcome.*

  **4. The Dignity Reading (Substantive)**
  *   **Claim:** "Receiving money without labor is inherently degrading; self-sufficiency is a moral good independent of income level."
  *   **Verdict:** **Substantive and Defensible (Philosophically).** This is a value judgment, not an empirical one. It cannot be proven false by data, only rejected by competing values (e.g., a right to subsistence).
  *   **What must be shown:** Nothing empirical. It requires a shared cultural agreement that labor is the primary source of social worth.
  *   **Policies Licensed:** Work requirements even for low-wage or make-work jobs. Prioritizing placement over pay.
  *   **Consequence vs. Entitlement:** Purely **Entitlement**. It argues the recipient *owes* an effort to the self, regardless of whether that effort yields more money.

  **5. The Reciprocity Reading (Strong)**
  *   **Claim:** "State support is a contractual exchange, not a right. If you take from the common pool, you owe labor to the common pool."
  *   **Verdict:** **Conditionally True.** It is coherent only if the state is viewed as a mutual aid society rather than a sovereign guarantor of rights. It collapses if the "contract" is unilateral (the state sets terms the citizen cannot negotiate).
  *   **What must be shown:** That the terms of the "contract" are mutually agreed upon or democratically legitimate.
  *   **Policies Licensed:** Making payment conditional on appointments attended, sanctions, refusing cash if conditions aren't met.
  *   **Consequence vs. Entitlement:** **Entitlement** framed as **Consequence**. (i.e., "You get no money *because* you broke the contract," not "You get no money *because* it helps you.")

  ### III. Claims About State Authority (Political/Contractual)
  *These readings define the limits of what the state may require.*

  **6. The Paternalist Reading (Strong)**
  *   **Claim:** "The state knows better than the recipient what is good for them, and may restrict their freedom (choice of how to spend money) for their own good."
  *   **Verdict:** **False as it stands (Liberal Democratic Context).** It contradicts the assumption of adult agency. It can only be defended if the recipient is deemed incapable (e.g., severe addiction, cognitive impairment), which is not the default assumption for the general caseload.
  *   **What must be shown:** Incapacity on the part of the recipient, or a specific mandate granting the state guardianship.
  *   **Policies Licensed:** Refusing cash in favour of training or vouchers, strict monitoring of spending or time.
  *   **Consequence vs. Entitlement:** **Entitlement** (of the state to rule) disguised as **Consequences** (for your own good).

  ### IV. Claims About the Metaphor (Structural/Economic)
  *These readings examine the physical reality the metaphor describes.*

  **7. The Market Functionality Reading (Very Strong)**
  *   **Claim:** "The 'pond' exists. There are jobs available that pay enough to sustain a life, and the only barrier is the recipient's lack of skill or will."
  *   **Verdict:** **Conditionally True.** This is the critical reading for your novel.
      *   **True in:** A town with labor shortages, where wages exceed benefits + childcare costs.
      *   **False/Empty in:** A town with structural unemployment, where jobs are scarce, gig-based, or pay less than the benefit floor. Here, the metaphor is a category error; you cannot teach a man to fish in a drained pond.
  *   **What must be shown:** Local labor market data. Vacancy-to-unemployment ratios. Living wage calculations vs. benefit levels.
  *   **Policies Licensed:** None of the above work if this claim is false. If true, it licenses all welfare-to-work policies. If false, it licenses only direct cash support or job creation (public works).
  *   **Consequence vs. Entitlement:** **Consequences.** It assumes the mechanism of the economy functions. If the mechanism is broken, the consequence (employment) cannot follow the action (training).

  ***

  ### The Swap: Consequence vs. Entitlement
  You noted that in the room, these two are swapped mid-sentence. Here is the mechanism of that swap, which your narrator should learn to hear:

  1.  **The Bait (Consequence):** The adviser begins with Reading #2 (Human Capital). *"We do this because training gets you better jobs."* This is hard to argue with; it sounds helpful and empirical.
  2.  **The Switch (Entitlement):** Once the recipient questions the rule, the adviser shifts to Reading #5 (Reciprocity) or #4 (Dignity). *"But you must attend the appointment to get the money."*
  3.  **The Trap:** If the recipient says, "The training doesn't lead to jobs" (attacking the Consequence), the adviser replies, "It's about taking responsibility" (defending the Entitlement). If the recipient says, "I need the money for food now" (appealing to Entitlement/Need), the adviser replies, "This is for your long-term good" (appealing to Consequence).

  **The Verdict on the Swap:** It is a rhetorical shield. It allows the adviser to claim the moral high ground of *helping* (Consequence) while wielding the power of *punishing* (Entitlement/Contract).

  ***

  ### Conditional Truth: The Town Factor
  You asked which readings are quietly empty in a town where jobs do not pay better than benefits.

  *   **Readings 2, 3, and 7 collapse.** If the jobs do not exist, or if working leaves the family poorer than welfare (due to childcare costs or benefit withdrawal), then "teaching to fish" is empirically useless. The "Hand Up" leads to a ledge, not a higher floor.
  *   **Readings 4 and 5 remain intact.** This is the danger. A belief in Dignity or Reciprocity does not require a job market. An adviser can believe you *owe* labor even if the labor is worthless, or even if no one will buy the fish. In a depressed town, the "Hand Up" becomes a ritual of compliance rather than an economic ladder.

  **For your narrator:** If she is in a depressed town, the advisers are not necessarily *lying*, but they are **irrelevant**. They are administering a cure for a disease (dependency) that isn't the primary ailment (lack of demand).

  ***

  ### Conclusion: Sincere vs. Strategic
  To write your narrator's arc, you need to distinguish the voice in her own head.

  **The Sincere Adviser**
  *   **Reading:** Leans on **#2 (Human Capital)** and **#4 (Dignity)**.
  *   **Belief:** They truly believe the pond is full. They see a person struggling and feel that giving cash is like giving a painkiller that hides the infection. They want the client to feel the pride of a paycheck.
  *   **Blind Spot:** They do not look at the vacancy rates. They mistake the *availability* of a job application for the *availability* of a job.
  *   **Voice:** Warm, frustrated when the client fails, personal. "I know you can do this."

  **The Strategic Adviser**
  *   **Reading:** Leans on **#5 (Reciprocity)** and **#6 (Paternalism)**.
  *   **Belief:** They may know the jobs are bad. It doesn't matter. The system requires movement. The phrase "hand up" is a code for "compliance." It justifies the sanction that closes the file.
  *   **Blind Spot:** They do not look at the human cost. They mistake *process* (appointments kept) for *progress* (life improved).
  *   **Voice:** Bureaucratic, calm, impersonal. "It's the policy that ensures fairness."

  **The Narrator's Realization**
  The arc depends on her hearing when she uses the phrase to **comfort herself** (Sincere: "I am helping them") versus when she uses it to **justify power** (Strategic: "I am enforcing the rules").
  *   If she says it when a client finds a job, it is a **Platitude of Celebration**.
  *   If she says it when she cuts a client's income, it is a **Weapon of Abstraction**.

  In a town where the pond is dry, the "Hand Up" is not a ladder. It is a rope thrown to someone who is not drowning in water, but buried in earth. The sincere adviser thinks they are pulling; the strategic adviser knows they are just holding the rope. Your narrator must decide which hand she is looking at.
