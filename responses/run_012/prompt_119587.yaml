      *   *Reading 3: The Psychological/Performativity Reading.* Boldness convinces others (soldiers, citizens) that Fortune is on your side, creating a self-fulfilling prophecy.
      *   *Reading 4: The Adaptive Reading (Machiavellian Nuance).* Boldness is only good *when the times suit it*. Sometimes caution is the bold move.
