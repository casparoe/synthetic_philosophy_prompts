answer: |-
  1. Begin by eliciting a concrete puzzle where likelihoods are equal but confidence differs, forcing the explicit notion of a rival hypothesis only after they have felt the need for it, then introduce the explanatory virtues as the tie-breaker before questioning their link to truth. Introduce the generation versus justification distinction only after they have attempted to justify a choice, and reserve the "best of a bad lot" objection for the end so it undermines the rule only after they have learned to use it.

  2. Use a case from historical linguistics regarding sound shifts, because it requires positing an unobserved ancestral structure to unify disparate cognates without triggering their rehearsed responses to medical diagnostics or detective work. The example must lack direct statistical frequencies to prevent Bayesian calculation, forcing reliance on structural coherence and the absence of contrivance to choose between competing genealogies.

  3. Head off the claim that virtues are merely aesthetic immediately when they propose them as tie-breakers by demanding a cash-out in terms of predictive risk, and address the Bayesian supersession objection only after the IBE rule is fully stated by showing where priors remain inaccessible. The hardest misconception, that virtues track truth rather than utility, should be left standing until the final objection so they feel the tension rather than having it resolved prematurely.

  4. Ask them to describe a scenario where the best explanation is clearly false, not because of new data, but because the true hypothesis was never generated. This forces them to articulate the gap between explanatory ranking and truth possession without reciting the objection's name.

  5. Openly refuse to derive IBE from Bayes' Theorem, stating that doing so would presuppose the very priors whose absence necessitates explanatory reasoning in the first place. Frame this not as ignoring the math but as isolating the pre-probabilistic judgment call that determines which hypotheses enter the equation.
