answer: |-
  1. The apparatus presupposes a public-centric legalistic theory that defines corruption strictly as the abuse of public office, relying on a public-private line that is merely administrative rather than principled.
  2. None of the inconsistency is forced by the theory itself, as the tolerance for domestic campaign donations reveals a second, unstated view of legal positivism where whatever is lawful in the home jurisdiction is exempt from moral scrutiny.
  3. It quietly rules out functionalist accounts that define corruption by the undue influence exerted on a decision regardless of the recipient's sector, as well as sociological accounts that view gift exchange as constituting social relations rather than deviating from them.
  4. The theory is parochial in treating particularistic gift exchange as a deviation from a norm, whereas a defensible account of corruption must be universal and focus on the integrity of the decision rather than the status of the recipient.
  5. Replacing this with a consistent functionalist theory would require banning all transfers of value intended to influence decisions, including domestic political donations and private-sector hospitality, while permitting culturally embedded gifts that carry no expectation of reciprocal commercial advantage.
