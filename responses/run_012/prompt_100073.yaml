prompt: |-
  okay so I'm in this Nietzsche seminar and the final paper is that we each pick a concept and do a genealogy of it, and honestly I've realized I don't know what I'm being asked to produce. half the room thinks a genealogy is just a story about how a concept happened to come about, the other half keeps insisting that's not the point at all, and the professor just nods at both. so before I write anything, give me the desiderata: what does any adequate genealogy of a moral concept actually have to deliver? the cases it has to get right, the distinctions it can't collapse, the objections it has to survive -- and for each one, why it's a real requirement and not just a prejudice of one camp.

  take a definite position on the stuff I know is coming up, don't just lay out the options: the genetic-fallacy objection (does the causal story even bear on whether the belief is justified, or only on whether we'd still hold it?); the imaginary-vs-actual-history thing (Nietzsche's own account doesn't read like real history -- does that make it defective, or is that a category mistake?); whether the genealogist can debunk using norms while also treating norms as debunkable without sawing off the branch; and the one I actually care about -- whether a genealogy can ever vindicate a concept rather than only undermine it, and what extra a genealogy would have to do to count as vindicatory rather than debunking.

  also flag any two requirements you think can't both be satisfied at once, because I have a suspicion the standard the seminar is implicitly using is incoherent and I want to be able to say exactly why, not just gesture at it. definately don't hedge -- give me your actual ranked list, mark which requirements are non-negotiable and which are negotiable, and say where you're genuinely unsure instead of covering every base.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is in a Nietzsche seminar, writing a final paper on the genealogy of a moral concept.
      *   **Problem:** Confusion about what constitutes a "genealogy" in this context. There's a split in the class (historical story vs. something else), and the professor is ambiguous.
      *   **Task:** Provide the *desiderata* for an adequate genealogy of a moral concept.
      *   **Specific Constraints:**
