      *   *Property View:* Fails on Joint Data (can't own shared genome solely) and Externalities (property rights usually don't cover inferred traits of others).
      *   *Killer Constraint:* The Interdependency/Joint Data constraint. It breaks the atomistic assumptions of all three simple models.

