      *   *Req 5 (Unknown vs. Un-knowable):* Call it "The Structural Constraint." Is privacy a state of mind or a state of the system? *Status:* Non-negotiable (clarifies the object of protection).

  4.  **Analyzing Trade-offs (The "Impossible Spec"):**
      *   Can we have absolute control (Req 2) *and* free speech/social interaction? No.
      *   Can we protect third parties (Req 3) *and* maintain individual autonomy (Control View)? No.
