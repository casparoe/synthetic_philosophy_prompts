  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   I need to formulate these as clear, testable conditions for a theory of privacy.
      *   *Requirement 1: The Accessibility Intuition.* (Addressing the records office vs. search box case). A theory must explain why friction matters even if information status is identical.
      *   *Requirement 2: The Joint Data Problem.* (Addressing shared info). A theory must handle interdependent data rights without leading to veto paralysis or unilateral waiver.
      *   *Requirement 3: The Externality/Consent Problem.* (Addressing the "nothing to hide" guy affecting friends). A theory must account for harms to third parties not covered by the data subject's consent.
      *   *Requirement 4: The Violation/Harm Distinction.* (Addressing "nothing bad happened"). A theory must distinguish between the *act* of intrusion and the *consequence* of intrusion.
      *   *Requirement 5: The Unknown vs. Un-knowable Distinction.* (Addressing the epistemic status). A theory must clarify if privacy is about actual secrecy or structural protection.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1 (Accessibility):* Call it "The Friction Constraint." Why? Because privacy isn't just binary (known/unknown); it's about the *effort* required. If a theory says "it's out there, so no privacy," it fails the intuition that making it *easy* changes the moral landscape. *Status:* Non-negotiable (matches strong legal/moral intuition).
