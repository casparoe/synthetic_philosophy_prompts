  **Credence:** 0.53 (Uncertainty Range: 0.43–0.63)

  **Decomposition:**
  I treat the proposition as a conjunction of four independent commitments; the final figure is the geometric mean of the probabilities assigned to each commitment holding true.

  1.  **Motive Individuation (0.80):** Folk psychology and phenomenology usually allow us to distinguish "duty" from "guilt-aversion" well enough for moral assessment, despite neural opacity.
  2.  **Single Property (0.30):** "Moral worth" functions more like a cluster concept (praise, virtue, value) in ordinary discourse than a univocal technical term, making the narrow definition stipulative rather than descriptive.
  3.  **Motive Necessity (0.80):** Creditability generally requires an internal connection to the action; a purely externalist account renders "credit" indistinguishable from "luck."
  4.  **Motive Specificity (0.40):** Reliable pro-moral dispositions (e.g., habituated virtue) often generate credit without explicit appeal to right-making features, undermining the "very considerations" constraint.

  **Combination:**
  $\sqrt[4]{0.80 \times 0.30 \times 0.80 \times 0.40} \approx 0.53$
  The low score on **Single Property** and **Motive Specificity** drags the aggregate down, reflecting that the proposition is semantically too narrow and psychologically too demanding to capture the full extension of "moral worth."

  **Sensitivity Analysis:**
  My number is most sensitive to **Motive Specificity (0.40)**. If I were convinced that habituated virtue (acting from a stable character trait rather than a occurrent moral thought) lacks moral worth, my credence would jump to ~0.70. The evidence that would move me is a case where an agent acts instinctively to save a life (no time for deliberation on right-making features) but is universally judged as *more* admirable than a deliberative agent; currently, I weigh this as evidence against the narrow view, but if persuaded that instinctive action is merely "causal" and not "agential," I would revise upward.

  **Locating the Disagreement:**
  The gap between your 0.7 and your friend's 0.3 lives mostly in **Motive Specificity**, but it is fueled by the **Single Property** question. You are likely assuming "moral worth" refers strictly to *praiseworthiness of the will* (high Specificity), while your friend likely includes *reliability of character* (low Specificity) in the definition of worth. You are both treating the term as a single property, but pointing at different members of the cluster.

  **The Revision Case:**
  Consider the **Instinctive Parent**: A mother jumps in front of a car to save her child. She acts on immediate love, not a calculation of "moral duty" or "right-making features."
  *   **Your constraint:** If she didn't act for the *moral consideration* (duty/rightness), she earns no *moral worth* credit on the narrow view.
  *   **The pressure:** If you admit she has high moral worth, you must relax **Motive Specificity** (allowing non-moral motives like love to count if reliably pro-moral). If your friend admits a psychopath who saves the child *only* to avoid a fine has *less* worth, they must accept **Motive Necessity**.
  *   **Forced Revision:** You would be forced to revise if you agree that the mother is *more* creditable than a Kantian agent who saves the child *only* because duty commanded it despite hating the child. That comparison isolates Specificity from Necessity and tests whether the "very considerations" must be moral or merely pro-moral.
