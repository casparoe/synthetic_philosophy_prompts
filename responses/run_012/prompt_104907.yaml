          *   The "Tangle": Is it a discovery (birds *are* descendants) or a stipulation (we *call* descendants reptiles)? Quine says it's both. The revision happens in the web, not in a specific "definition" box.
          *   Conclusion on this part: Supports Quine. No statement is immune.
      *   **Part 2: Saving the Distinction (The Counter-Argument):**
          *   How to defend Analytic/Synthetic?
          *   *Framework Relativity:* Within Linnaeanism, "Birds $\neq$ Reptiles" was analytic. Within Cladistics, "Birds $\in$ Reptilia" is analytic. The *change* was a pragmatic choice of framework, not a blurring of fact/meaning within a framework.
          *   *Degree of Entrenchment:* Some truths are harder to give up. "Birds are animals" is more central than "Birds are not reptiles."
          *   *Carnapian Explication:* We can distinguish the empirical input (phylogeny) from the conceptual output (rank naming).
      *   **Part 3: Conceptual Engineering vs. Scientific Revision:**
          *   Define Conceptual Engineering (CE): Deliberate improvement of concepts for specific goals (e.g., social justice, scientific clarity).
