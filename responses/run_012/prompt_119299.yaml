answer: |-
  # The Anthropics Decision Tree

  **Instructions:** Begin at **Node 1**. Answer each question based on your intuitions about the cases described. Follow the path indicated by your answer until you reach a **Leaf**.

  ### The Branch Nodes

  **Node 1 (Archivist Basic):** In the Archivist's Coin case, is your rational credence that the coin landed Heads exactly 1/2?
  *   **Yes:** Go to Node 3.
  *   **No:** Go to Node 2.

  **Node 2 (Archivist Alternative):** In the Archivist's Coin case, is your rational credence that the coin landed Heads roughly 1 in 1,000,001?
  *   **Yes:** Go to Node 9.
  *   **No:** Go to **Leaf E** (No Special Principle).

  **Node 3 (Archivist Variant):** In the Archivist's Coin variant, does learning the second-stage rule (that Tails *might* trigger more observers) change your credence in the *first* coin's landing Heads?
  *   **Yes:** Go to **Leaf F** (Hybrid/Unstable).
  *   **No:** Go to Node 4.

  **Node 4 (Presumptuous Philosopher):** Can a philosopher who has not looked out the window be rationally required to believe the universe is large or infinite on a priori grounds?
  *   **Yes (Acceptable):** Go to Node 9.
  *   **No (Reductio):** Go to Node 5.

  **Node 5 (Doomsday Soundness):** Is the Doomsday Argument sound as it stands?
  *   **Yes:** Go to Node 7.
  *   **No:** Go to Node 6.

  **Node 6 (Doomsday Status):** Is the Doomsday Argument a *reductio* of the anthropic principle that generates it?
  *   **Yes:** Go to **Leaf E** (No Special Principle).
  *   **No (Unsound but instructive):** Go to Node 7.

  **Node 7 (Reference Class):** Does your reasoning require restricting the comparison class to observers with your exact current memories/data?
  *   **Yes:** Go to Node 8.
  *   **No:** Go to Node 9.

  **Node 8 (Observer-Moments):** Should the fundamental unit of anthropic reasoning be the temporal observer-moment rather than the whole observer?
  *   **Yes:** Go to **Leaf B** (Strong SSA).
  *   **No:** Go to **Leaf A** (SSA).

  **Node 9 (Existence as Evidence):** Does the fact that you exist count as new evidence favoring hypotheses with more observers?
  *   **Yes:** Go to Node 10.
  *   **No:** Go to **Leaf A** (SSA).

  **Node 10 (Non-Indexical Conditioning):** Can all relevant self-locating evidence be expressed in non-indexical terms?
  *   **Yes:** Go to **Leaf D** (Full Non-Indexical Conditioning).
  *   **No:** Go to **Leaf C** (SIA).

  ---

  ### The Leaves (Positions)

  **Leaf A: The Self-Sampling Assumption (SSA)**
  You should reason as if you are a random sample from a **restricted reference class** of observers with your specific data. You reject the Presumptuous Philosopher's conclusion and maintain 1/2 credence in the Archivist's Coin.

  **Leaf B: The Strong Self-Sampling Assumption (Strong SSA)**
  You accept SSA but replace "observers" with **observer-moments** as the fundamental unit of sampling. This refines the reference class to temporal slices rather than whole lives.

  **Leaf C: The Self-Indication Assumption (SIA)**
  You treat your existence as evidence favoring populous worlds. You accept the Presumptuous Philosopher's conclusion as surprising but true, and assign roughly 1 in 1,000,001 credence to Heads in the Archivist's Coin.

  **Leaf D: Full Non-Indexical Conditioning**
  You reject the need for centered worlds or special anthropic principles. All reasoning is done by conditioning on non-indexical propositions about the world's structure and your place in it.

  **Leaf E: No Special Principle Needed**
  You reject the need for any special anthropic principle. You view the Doomsday Argument as a *reductio* of anthropic reasoning or deny there is a fact of the matter regarding indexical credences in these cases.

  **Leaf F: Hybrid/Unstable Position**
  You hold that credence should be 1/2 (like SSA) but acknowledge that potential observers affect rational belief (like SIA). This position is often unstable under reflection on the Archivist's Coin variant.

  ---

  ### Structural Analysis & Unoccupied Combinations

  **Unseparated Leaves:**
  This tree cannot separate **Leaf A (SSA)** from a standard "Halfer" position on Sleeping Beauty that rejects anthropic reasoning entirely. Both arrive at 1/2 credence and reject existence as evidence. Distinguishing them requires a separate node on the specific mechanics of memory loss in Sleeping Beauty.

  **Unoccupied Combinations:**
  1.  **Node 1 (No) + Node 2 (No) + Node 9 (Yes):** *Incoherent.* Denying both 1/2 and 1/million credence in the Archivist case while treating existence as evidence (SIA) lacks a probabilistic basis.
  2.  **Node 4 (Yes/Acceptable) + Node 7 (Yes/Restricted):** *Unattractive.* Accepting the Presumptuous Philosopher (SIA-like) while insisting on a Restricted Reference Class (SSA-like) creates a tension where one accepts the population weighting but restricts the pool being weighted.
  3.  **Node 10 (Yes) + Node 9 (No):** *Unexplored.* A view that treats existence as *not* evidence (No SIA) but claims all evidence is non-indexical is rarely defended, as non-indexical conditioning often mimics SIA results in populous worlds.
  4.  **Node 3 (Yes) + Node 1 (Yes):** *Unstable.* (Mapped to Leaf F). Believing the Archivist coin is 1/2 but that *potential* observers shift credence violates standard Bayesian updating on the physical coin setup.
