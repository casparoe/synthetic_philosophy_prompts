  2. Flip the coin privately, distribute envelopes from the chosen box until they run out or everyone has one, then ask participants to open them and bet on which box was used using any reasoning they prefer.
  3. The room divides between those arguing that receiving an envelope makes the larger box more likely (existence as evidence) and those arguing their specific number implies a smaller total population (random sampling).
  4. Reveal the coin result and explain how their arguments mirrored the conflict between the Self-Indication Assumption and the Self-Sampling Assumption regarding observer counts.
  5. Participants will likely fixate on the fairness of the distribution rather than the Bayesian update, and the activity cannot reproduce the moral stakes of excluding future generations from the reference class.
