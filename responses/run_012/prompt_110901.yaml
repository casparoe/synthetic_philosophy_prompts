answer: |-
  **Bottom line**
  We should adopt a policy permitting slurs to be printed in full when their explicit occurrence is constitutive of the philosophical argument, historically accurate, or necessary for linguistic analysis. I move that we adopt the "Integral Usage Policy" outlined below and accept the pending submissions conditional only on standard copyediting, not euphemization. Expect a narrow vote (likely 5-4), as the harm-based objections are sincere, but the scholarship-based arguments are decisive for our mission.

  **Why print in full**
  The strongest case for printing slurs is not about edginess, but about intellectual honesty and the mechanics of the arguments we publish. When a philosopher argues for reclamation, the act of writing the word is part of the performative success of the argument; substituting "the n-word" renders the claim incoherent, effectively censoring the phenomenon under study. Furthermore, the linguistic debate on our board mirrors the debate in the papers: if expressive content "rides along" as presupposition, euphemisms are safer, but if context can cancel derogatory force (as the reclamation and grad student papers argue), then uniform euphemization prejudges the linguistic data. By mandating asterisks, we distort the texts we publish and signal that the language of marginalized authors requires management by the journal, undermining the very agency reclamation seeks to establish.

  **Why euphemise**
  The strongest case for euphemism is not about protecting delicate sensibilities, but about preventing material harm and avoiding institutional complicity. Slurs carry a history of violence, and printing them can trigger trauma for readers or signal that our journal is an unsafe space for marginalized scholars, regardless of the author's intent. There is a legitimate concern that normalizing the visual presence of these words, even in print, contributes to a culture where their oral usage becomes less stigmatized, and the journal risks becoming a vector for harm rather than a neutral conduit for ideas. This position holds that the risk of harm outweighs the philosophical benefit of full usage, and that scholarship can proceed by referring to the words without deploying them.

  **The rule I'd adopt**
  **Policy on Offensive Language:** *Slurs and derogatory terms shall be printed in full when their explicit occurrence is necessary for the philosophical argument, historical accuracy, or linguistic analysis. In all other cases, euphemisms (e.g., "the n-word") should be used.*

  *   **Titles and Abstracts:** Full usage is permitted here if the term is central to the thesis (e.g., the reclamation paper); otherwise, euphemize.
  *   **Historical Quotations:** Always print in full to maintain archival integrity; do not alter primary sources.
  *   **Targeted Group Authors:** Defer to the author's preference. If a member of the targeted group chooses to use the term in full, the journal will not require euphemization.
  *   **The Grad Student's Paper:** Accept conditional on a brief author's note justifying the non-derogatory usage, as the argument concerns meaning fixation which requires the word as data.

  **What would change my mind**
  Concrete evidence that publishing these terms in full has led to harassment of our authors, readers, or staff, or a formal statement from relevant advocacy groups requesting we adopt a restrictive policy.
