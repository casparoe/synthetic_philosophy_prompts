answer: |-
  ### Desiderata for a Theory of Lawhood

  The following requirements are derived directly from the hard cases provided. They are sorted by priority: beginning with the core functional role of laws in explanation, moving to their modal and ontological scope, and concluding with structural refinements regarding the architecture of the nomic order.

  #### I. Foundational Requirements (The Core Function)
  *These requirements address the basic role of laws in distinguishing explanatory regularities from mere truths.*

  **1. The Nomic/Accidental Distinction Requirement**
  *   **Motivation (Case 1):** In a world generated by a simple dynamical rule plus specific initial conditions, a regularity may hold universally simply because the initial conditions dictate it, not because the dynamics necessitate it. A theory of lawhood must distinguish the dynamical rule (law) from the entailed regularity (accidental generalization), even if both are universally true in that history.
  *   **Status:** **Constitutive of Adequacy.**
  *   **Priority:** **Non-negotiable.** Without this, the concept of "law" collapses into "truth," and explanatory power is lost.

  **2. The Counterfactual Stability Requirement**
  *   **Motivation (Case 2):** Special science generalizations (e.g., in biology or economics) admit exceptions and hold only *ceteris paribus*, yet they successfully support counterfactuals and predictions. A theory must explain how a regularity can be exception-ridden yet still possess nomic force sufficient for explanation.
  *   **Status:** **Constitutive of Adequacy.**
  *   **Priority:** **Non-negotiable.** If a theory cannot accommodate the explanatory success of the special sciences, it is empirically inadequate.

  #### II. Modal and Ontological Requirements (The Scope of Authority)
  *These requirements address the reach of laws beyond the actual and the determined.*

  **3. The Modal Scope Requirement**
  *   **Motivation (Case 3):** We accept laws governing kinds of entities that never actually occur (e.g., laws regarding stable superheavy elements that decay too quickly to form). A theory must grant laws authority over uninstantiated possibilia, not merely summarize actual occurrences.
  *   **Status:** **Commitment of the Anti-Humean Camp.** (Humeans typically reject this, treating such claims as counterfactual summaries of actual laws).
  *   **Priority:** **Non-negotiable** (for a robust account of explanation). If laws cannot govern what *would* happen, they cannot support the counterfactuals required for explanation.

  **4. The Stochastic Constraint Requirement**
  *   **Motivation (Case 4):** Probabilistic laws fix objective chances without fixing specific outcomes. A theory must explain how a law can constrain the *propensity* of events without determining the *history* of events, avoiding the reduction of chance to frequency.
  *   **Status:** **Constitutive of Adequacy.**
  *   **Priority:** **Non-negotiable.** Any theory incompatible with indeterministic physics is scientifically obsolete.

  #### III. Structural Requirements (The Architecture of Law)
  *These requirements address the higher-order organization of the nomic system.*

  **5. The Meta-Nomic Hierarchy Requirement**
  *   **Motivation (Case 5):** Symmetry principles (e.g., Lorentz invariance) constrain the form of first-order laws but are not themselves regularities over events. A theory must accommodate principles that govern laws without being reducible to event-regularities.
  *   **Status:** **Constitutive of Adequacy.**
  *   **Priority:** **Optional Refinement.** While necessary for fundamental physics, a minimal theory of lawhood could arguably function without it, though it would be incomplete.

  **6. The Reflexivity Requirement**
  *   **Motivation (Case 6):** Some regularities hold of the laws themselves (e.g., conservation laws derived from symmetries of the laws). A theory must allow for nomic relations to hold between laws, not just between laws and events.
  *   **Status:** **Commitment of the Anti-Humean Camp.** (Humeans struggle to make sense of relations between summaries).
  *   **Priority:** **Optional Refinement.** This deepens the account but is not strictly required for basic scientific explanation.

  ***

  ### Analysis of the Desiderata

  #### 1. Incompatible Subset
  There is no logical contradiction among the six requirements themselves; a robust Primitivist or Dispositionalist framework can satisfy all of them. However, there is a functional incompatibility between **The Nomic/Accidental Distinction Requirement (1)** and **The Counterfactual Stability Requirement (2)** if one demands a *univocal* criterion of lawlikeness.

  *   **The Conflict:** Requirement 1 demands a sharp metaphysical cut between fundamental dynamics and boundary conditions (a binary distinction). Requirement 2 demands accommodation of vague, exception-ridden generalizations (a gradient distinction).
  *   **The Result:** A theory that satisfies Requirement 1 by positing strict, exceptionless fundamental laws often fails Requirement 2 by rendering special science generalizations "not laws" (and thus explanation-less). Conversely, a theory that satisfies Requirement 2 by allowing CP-conditions into the definition of law often fails Requirement 1 by blurring the line between fundamental dynamics and accidental initial conditions. **Satisfying both simultaneously requires a pluralistic theory of lawhood, rejecting the idea that "law" is a single natural kind.**

  #### 2. The Most Exclusionary Requirement
  **The Modal Scope Requirement (3)** does the most work excluding otherwise attractive accounts.

  *   **What it Rules Out:** It rules out **Strict Humean Supervenience** (e.g., the Best System Account in its standard form).
  *   **Why:** Humean accounts define laws as summaries of the actual mosaic of particular facts. If a kind of entity never occurs in the mosaic (Case 3), there are no facts for the law to summarize. To satisfy Requirement 3, laws must exist *independently* of their instantiation, possessing a modal force that extends to non-actual possibilia. Accepting this requirement as non-negotiable forces the abandonment of the Humean research program, as it requires laws to be ontologically prior to or independent of the actual history of the world.

  ***

  ### The Humean / Anti-Humean Divide

  The sharpest division lies between **The Modal Scope Requirement (3)** and **The Nomic/Accidental Distinction Requirement (1)**.

  *   **The Divide:** Anti-Humeans secure **Modal Scope** by positing primitive nomic relations or dispositions that exist even without instantiation, but they often struggle with **Distinction** (explaining why some universal truths aren't laws without appealing to simplicity). Humeans secure **Distinction** (via simplicity/strength criteria in the Best System) but must sacrifice **Modal Scope**, denying that laws have any grip on uninstantiated kinds beyond what is implied by the actual system.
  *   **The Cost:**
      *   **The Humean** must give up the idea that laws *govern* non-actual possibilities. They must concede that claims about uninstantiated entities are merely useful fictions derived from the actual system, weakening the counterfactual support laws provide.
      *   **The Anti-Humean** must give up **Empirical Supervenience**. To meet the Modal Scope requirement, they must accept primitive modality into their ontology, committing to entities or relations that are not reducible to the distribution of local qualities in spacetime.
