answer: |-
  First, take a deep breath. You haven't failed the course; you've actually done the work better than the readings. The reason you can't find a single, clean principle is that **there isn't one.**

  You have intuitively stumbled onto the exact debate that has occupied philosophers of medicine for the last 40 years. You are oscillating between **Naturalism** (disease is a biological fact, like a broken engine part) and **Normativism** (disease is a value judgment, like "this condition is bad enough to warrant help").

  Your list reveals that you are not a pure Naturalist or a pure Normativist. You are intuitively a **Hybrid Theorist**, specifically aligning with what philosopher Jerome Wakefield calls the **"Harmful Dysfunction" analysis.**

  Here is how your intuitions map onto that framework, where the cracks are, and which verdict you probably need to sacrifice to make your worldview coherent.

  ### 1. The Pattern: Harmful Dysfunction
  Your intuition seems to require two things to be present for something to be a "disease":
  1.  **Dysfunction (Fact):** A part of the body is failing to do what it was "designed" (by evolution) to do.
  2.  **Harm (Value):** That failure causes negative consequences *that we care about*.

  Let's test this against your contradictions:

  *   **Grief vs. Depression:** This is the strongest evidence for your "Dysfunction" criteria. In grief, the sadness mechanism is working *exactly as intended* (responding to loss). In depression (same symptoms, no loss), the mechanism is firing without the trigger. That is a **malfunction**.
  *   **Grandpa's Blood Pressure:** This is the strongest evidence for your "Harm" criteria. Biologically, it's a dysfunction. But if he felt fine and it killed no one, would we call it a disease? No. We call it a disease because of the *value judgment* that dying of a stroke is bad.
  *   **Lactose Intolerance:** This is a dysfunction (enzyme missing), but for most of human history, it was the *normal* adult state. You intuitively classify it as "variation" rather than "disease" because it doesn't threaten vital functioning in a modern context (you can just avoid milk).

  ### 2. Resolving Your Contradictions

  You are stuck on three specific pairs. Here is how a consistent philosophy untangles them, though it might require tweaking your intuition.

  **A. Myopia (Disease) vs. Presbyopia (Not Disease)**
  *   *The Conflict:* Both are optical failures. Both get glasses.
  *   *The Distinction:* **Statistical Normality vs. Pathology.**
      *   Myopia is a deviation from the species-typical design plan. Your eyes grew "wrong."
      *   Presbyopia (aging eyes) is universal entropy. Every human lens hardens.
      *   *The Principle:* We tend to reserve "disease" for things that go wrong *before their time* or *unexpectedly*. Presbyopia is "aging," not "disease," because it is inevitable.
      *   *The Fix:* You have to accept that **Aging is a category distinct from Disease.** If you accept this, the contradiction vanishes. Presbyopia isn't a "health" issue; it's a "time" issue.

  **B. Dad's Baldness (Not Disease) vs. Grandpa's Blood Pressure (Disease)**
  *   *The Conflict:* Both are biological changes. Dad hates baldness (Harm). Grandpa feels fine (No Harm).
  *   *The Distinction:* **Vital Function vs. Cosmetic/Social.**
      *   Blood pressure regulation is a *vital* internal function necessary for survival.
      *   Hair growth is, in a modern medical context, largely *cosmetic*.
      *   *The Principle:* Medicine prioritizes **survival and vital capacity** over aesthetics.
      *   *The Fix:* You have to admit that **Harm is objective, not subjective.** Your dad *feels* harmed by baldness, but medicine says his *body* is not harmed. Grandpa *feels* fine, but his *body* is at risk. Your intuition here is actually correct: Disease is about the body's risk, not the patient's feelings.

  **C. Short Stature (Not Disease) vs. ADHD symptoms (Disorder)**
  *   *The Conflict:* Both are deviations from the norm that cause social issues.
  *   *The Distinction:* **Internal Impairment vs. Social Mismatch.**
      *   The kid with ADHD has a neurological regulation failure that impairs them *everywhere* (even with Legos, eventually, or in other social contexts).
      *   The short brother is biologically healthy; the "harm" is entirely social (parents worrying, peers teasing).
      *   *The Principle:* Disease requires an **internal breakdown**, not just a social disadvantage.

  ### 3. The Hard Cases: Aging and Divorce

  You asked about **Aging itself** and the **Child of Divorce**.

  *   **Aging:** Under your current intuition (and the Harmful Dysfunction model), aging is a **universal dysfunction.** It is a failure of the body to maintain homeostasis. However, because it is universal and inevitable, we linguistically separate it from "disease."
      *   *Verdict:* If you force a binary choice, aging is **not a disease**, it is the *context* in which diseases occur. If you call aging a disease, then *being human* is a disease.
  *   **Child of Divorce:** This is the Grief case again. The misery is a **proper function** of a social animal reacting to instability.
      *   *Verdict:* **Not a disease.** It is a rational response to a harmful environment. Treating it as a disease (medicating the child) treats the symptom and ignores the cause (the divorce).

  ### 4. The Sacrifice: Which Verdict Must You Give Up?

  You asked which of your verdicts you should sacrifice to make the system coherent. You have to give up the idea that **Presbyopia (Mom's reading glasses) is fundamentally different from Myopia (Cousin's nearsightedness).**

  Here is the hard truth: **Biologically, they are the same thing.** The lens loses elasticity. The eye fails to focus.
  *   **Option A:** Admit Presbyopia *is* a disease (a mild, universal one). This makes "Disease" a purely biological fact.
  *   **Option B:** Admit Myopia is *not* a disease, but a variation. (Hard to swallow, since severe myopia causes blindness).
  *   **Option C (The Winner):** Admit that "Disease" is a **Pragmatic Category**, not a Natural Kind.

  **The Principle you are looking for:**
  > "A condition is a disease when it involves a **biological dysfunction** that creates a **risk of harm** significant enough to warrant **medical intervention** rather than social accommodation or acceptance."

  **Why this forces a sacrifice:**
  Under this principle, **Baldness** is the outlier in your list.
  *   It is a biological dysfunction (follicles stop).
  *   It causes harm (dad hates it).
  *   *But* we don't treat it as a disease because the harm is cosmetic, not vital.
  *   **However**, if your dad went to a doctor and said, "This is causing me severe depression," it *becomes* a medical issue.

  **The Verdict to Drop:**
  You need to drop the certainty that **Baldness is "not even a mild one."**
  In the philosophy of medicine, baldness *is* a dysfunction. The only reason it's not a "disease" is that we, as a society, have decided the harm isn't high enough to prioritize it alongside cancer or hypertension.
  If you admit that **Baldness is a mild dysfunction that we simply choose not to medicalize**, your list becomes consistent. It aligns with Short Stature (dysfunction, but we don't medicalize unless severe) and Presbyopia (dysfunction, but we accept it as aging).

  ### Summary for your Course
  1.  **Don't look for a Fact/Value binary.** Your intuition proves they are intertwined.
  2.  **Adopt the "Harmful Dysfunction" model.** It explains why Grief isn't a disease (no dysfunction) and why Hypertension is (high harm risk).
  3.  **Accept "Medicalization" as a social choice.** The difference between your cousin's eyes and your mom's eyes isn't biology; it's that we expect young people to see far and old people to read close. That is a social expectation, not a biological fact.
  4.  **The "Fact" about the Diagnostic Manual:** You asked: *"If it was never a disease then a whole profession was just wrong about a fact, which is a strange thing to say about a fact."*
      *   **Answer:** They weren't wrong about a *fact*; they were wrong about a *classification*. Homosexuality was removed from the DSM not because we discovered new biology, but because we changed our **value judgment** about whether that variation was "harmful." This proves disease is not purely a fact about the body.

  Your confusion is the correct philosophical position. The "single principle" is that **disease is a negotiation between how our bodies break and what we are willing to tolerate.**
