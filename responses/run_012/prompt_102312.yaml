answer: |-
  A careful student of history, presented with the standard explanation of the First World War, might reasonably pause and raise a logical objection. The textbooks list a constellation of causes: the entangling alliance system, rising nationalist rivalries, imperial competition, and the immediate trigger of the assassination at Sarajevo. The student asks: "What is the logical status of this list?"

  If the historian claims that *each* of these factors was, on its own, sufficient to produce the war, a paradox arises. If nationalist rivalries were sufficient to cause the war, then the alliance system was redundant; even without alliances, the war would have happened. If the assassination was sufficient, then imperialism was irrelevant. In this scenario, removing any single factor leaves the outcome unchanged. This renders the causal status of each factor dubious: if the effect occurs regardless of the presence of factor $X$, in what sense did $X$ cause the effect?

  Conversely, if the historian admits that *none* of these factors was sufficient on its own—that nationalism without alliances would not have sparked a general war, or that the assassination without the alliance system would have remained a local conflict—then the claim that there were "many causes" begins to look like a evasion. If no single factor caused the war, and the "cause" is merely the sum of all conditions, then strictly speaking, the cause is the total state of the world at that time. To isolate specific factors as "causes" seems arbitrary, dissolving the explanation into a vague description of the background.

  This puzzle strikes at the heart of historical explanation. What is genuinely at stake is the coherence of causal attribution itself. If the standard model of historical explanation entails logical contradictions regarding sufficiency and necessity, then historical narratives are not merely incomplete; they are conceptually confused. To resolve this, we must distinguish between the metaphysical notion of overdetermination and the pragmatic way historians utilize causal language.

  ### Metaphysical Overdetermination vs. Historical Practice

  In the metaphysics of causation, **overdetermination** has a precise, technical meaning. It occurs when two or more independent causal processes are each sufficient to produce the same effect, and they converge on that effect simultaneously. The classic example is a firing squad: two shooters fire at the same time, both hit the victim's heart, and either bullet alone would have been fatal. The death is overdetermined.

  The conceptual problem here relies on a counterfactual theory of causation (the idea that $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred). In the firing squad case, if Shooter A had not fired, the victim would still be dead (due to Shooter B). Thus, Shooter A's shot does not make a difference to the outcome. If causation requires difference-making, neither shooter caused the death, which is counterintuitive.

  However, the historian listing the causes of WWI is rarely committed to this metaphysical notion. When a historian says "nationalism caused the war," they do not typically mean that nationalism was an independent, sufficient causal chain that would have produced the war in August 1914 even in the absence of alliances or the assassination. Rather, they are speaking loosely about **contributing factors**.

  The appearance of commitment to metaphysical overdetermination arises from an ambiguity in the word "cause." In common parlance, and often in historical writing, "cause" oscillates between:
  1.  **Sufficient Condition:** A factor that guarantees the outcome.
  2.  **Necessary Condition:** A factor without which the outcome could not occur.
  3.  **Contributing Factor:** A factor that plays a role in the actual production of the outcome but is neither strictly necessary nor sufficient on its own.

  Historians generally do not believe that the alliance system was *sufficient* for war (otherwise war would have been inevitable decades earlier) nor strictly *necessary* (war might have started via a different mechanism). They are not positing multiple, independent sufficient chains (metaphysical overdetermination); they are positing a single, complex causal web where multiple strands are interwoven.

  ### A Defensible Account: INUS Conditions

  To rescue historical explanation from the student's dilemma, we can adopt a more rigorous account of multiple causation, most famously articulated by philosopher J.L. Mackie. Mackie proposed that most causal claims in complex domains (like history, medicine, or sociology) refer to what he called an **INUS condition**: an **I**nsufficient but **N**on-redundant part of an **U**nnecessary but **S**ufficient condition.

  Let us apply this to the First World War.
  *   **Insufficient:** Nationalism alone did not cause the war.
  *   **Non-redundant:** Within the specific complex of conditions that *did* obtain (nationalism + alliances + imperialism + assassination), nationalism was a required component. If you remove nationalism from that specific package, the remaining factors (alliances + imperialism + assassination) would not have produced the war.
  *   **Unnecessary:** The war *could* have happened via a different package of conditions (e.g., a colonial dispute without nationalism), so this specific package was not the only way war could occur.
  *   **Sufficient:** The *totality* of the package (nationalism + alliances + imperialism + assassination) was sufficient to produce the war.

  On this reconstruction, the historian is not claiming that nationalism was sufficient, nor that it was redundant. They are claiming it was a necessary component of the *actual* sufficient complex that operated in 1914. This preserves the explanatory force historians want. It allows them to isolate specific factors for analysis (e.g., "How did nationalism contribute?") without committing to the claim that the factor alone would have done the job. It acknowledges that causes work in concert, not in isolation.

  ### Contrastive Explanation and the Artifact of the Worry

  Even with the INUS account, the student's worry about overdetermination may persist if we assume causation is about predicting an absolute outcome. However, much of the "overdetermination" worry is an artifact of importing a binary difference-making criterion into a domain where explanations are inherently **contrastive**.

  Historical explanations rarely answer the question "What caused event $E$?" in a vacuum. They answer "Why did event $E$ occur *rather than* event $Y$?"
  *   If the contrast is **War in 1914 vs. Peace in 1914**, the assassination at Sarajevo is a salient cause. Without it, the specific timing and trigger are missing.
  *   If the contrast is **General War vs. Localized Conflict**, the alliance system is the salient cause. Without it, the assassination remains a bilateral dispute between Austria and Serbia.
  *   If the contrast is **War in the 20th Century vs. No War in the 20th Century**, imperial competition and nationalism are the salient causes.

  When we recognize the contrast class, the redundancy problem dissolves. A factor is not "redundant" if it makes the difference between the actual outcome and the specific alternative we are curious about. Metaphysical overdetermination implies that the effect is robust against the removal of any cause *simpliciter*. But in history, removing a cause changes the *description* of the outcome or the *likelihood* of the outcome relative to a specific alternative.

  ### Real Historical Overdetermination

  What, then, would a genuine case of metaphysical overdetermination look like in history? It would require two entirely independent causal chains, each capable of producing the *exact same event* at the *exact same time*, converging without interacting.

  For example: Suppose Archduke Franz Ferdinand was targeted by two independent conspirator groups, Group A and Group B. Group A's bomber and Group B's sniper fire simultaneously; either attack alone would have killed him and triggered the war clauses; the groups did not know of each other. Here, the death (and the war) is genuinely overdetermined.

  Such cases are exceedingly rare and contested in history. Historical events are usually the result of conjunctive conditions (the INUS model) rather than concurrent sufficient chains. More often, what looks like overdetermination is **preemption**. For example, if Group A's bomb killed the Archduke, and Group B's sniper shot a corpse, Group B did not cause the death. History is full of "almost" causes that were preempted by the actual cause.

  The rarity of genuine overdetermination suggests that the student's initial puzzle is based on a mischaracterization of how historical causes function. The "many causes" of WWI were not competing sufficient bullets; they were interlocking gears in a single machine.

  ### Conclusion

  The conceptual issue raised by the student highlights a tension between loose historical language and strict logical criteria. However, the dilemma dissolves when we recognize that historians are not committed to metaphysical overdetermination. They do not claim that each factor was sufficient on its own, nor do they claim that the collection of factors implies no causation.

  A defensible account views historical causes as INUS conditions: insufficient parts of a sufficient complex, non-redundant within that complex. Furthermore, by understanding historical explanation as contrastive (why this rather than that), we see that factors are not redundant if they differentiate the actual outcome from the relevant alternative. Genuine overdetermination—independent, sufficient chains converging—is a metaphysical possibility but a historical rarity. The "many causes" of the First World War were not a logical paradox, but a complex, conjunctive mechanism that historians parse by isolating the specific gears that turned the machine.
