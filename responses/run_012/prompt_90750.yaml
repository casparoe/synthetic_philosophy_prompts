          *   (2) says Solomonoff is the "gold standard" and learns *any* computable sequence.
          *   *Conflict:* NFL theorems usually state that averaged over *all possible* functions (including uncomputable ones), no learner outperforms random guessing. Solomonoff only works for *computable* environments. If the universe is uncomputable, Solomonoff fails. Does (1) acknowledge this limitation? (1) says "priors do real work," implying subjectivity/choice, but (2) posits an "objective" right prior.
          *   *Severity:* High. This is the "Problem of the Prior" in a nutshell.

      *   **Tension B: (2) vs. (4) - The Reference Machine Problem.**
          *   (2) relies on Kolmogorov Complexity (KC).
          *   (4) claims KC is "objective, mind-independent."
