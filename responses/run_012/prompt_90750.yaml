prompt: |-
  here's where I've landed on induction, and I want a consistency check before I write it up. (1) Learning from data just is Bayesian updating, and there's no free lunch, so priors do real work and you dont get them for free. (2) The right prior for induction in general is Solomonoff's — weight each computable hypothesis by 2 to the minus its Kolmogorov complexity — and Solomonoff induction is the gold standard: it learns any computable sequence in the limit. (3) So Occam's razor isn't a separate methodological rule, it just falls out of the probability calculus; simpler hypotheses get higher prior, end of story. (4) Kolmogorov complexity is objective, a mind-independent property of a string — simplicity isn't in the eye of the beholder. (5) And that's why parsimony works in real science: between a three-parameter law and a ten-parameter one, the simpler is more likely to be true.

  Which of these actually pull against each other, which only look like they do, and what's the cheapest fix for the real ones? Rank them by severity rather than telling me it's all fine or all broken.
