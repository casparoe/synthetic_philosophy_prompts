          *   *Conflict:* If KC defines the prior (via Solomonoff), and KC is objective, then the prior is objective. But (1) says "you dont get them for free," implying a burden of choice. If Solomonoff is *the* right prior, you *do* get it for free (mathematically).
          *   *Severity:* Medium. Philosophical inconsistency on the nature of priors.

  4.  **Rank and Refine:**

      *   *Rank 1 (Severe):* The Reference Machine Problem (2 vs 4). This is the biggest hole. KC isn't truly objective for finite strings.
