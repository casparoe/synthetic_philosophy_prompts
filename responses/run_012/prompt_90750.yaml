      *   **Tension C: (3) vs. (5) - Bayesian Occam vs. Parameter Counting.**
          *   (3) says Occam falls out of probability (Bayesian Occam's Razor). This usually penalizes model *flexibility* (volume of parameter space), not just parameter *count*.
          *   (5) says "three-parameter law vs. ten-parameter law... simpler is more likely."
          *   *Conflict:* Bayesian model selection (BIC/AIC/etc.) doesn't just count parameters; it integrates over them. A 10-parameter model with tight priors might be "simpler" in Bayesian terms than a 3-parameter model with wild priors. (5) simplifies this to "parameter counting," which is a frequentist or naive Occam view, not necessarily the sophisticated Bayesian view in (3).
