prompt: |-
  I'm a third-year PhD student in philosophy, mostly epistemic modality and social epistemology, so I'm definately not a logic person by trade, and I'm TAing a second-year unit on anti-realism where the knowability paradox comes up every single year. I know the shape of the derivation well enough (suppose some truth is unknown, apply the knowability principle to the conjunction, distribute knowledge over the conjunction, use factivity, contradiction), so please don't just walk me through it again; what I actually need is an audit of a summary, because the summaries I keep meeting disagree with each other about what the thing shows and I can't tell which ones are merely careless.

  Here's the one that's been bugging me, from an encyclopedia-ish blog post a friend forwarded me, paraphrasing from memory:

  'Fitch discovered that if every truth can be known then every truth is already known by somebody -- which is obviously false, so verificationism is refuted once and for all. And since there are clearly truths nobody will ever know, the proof also gives us truths that couldn't possibly be known, which is the real paradox. The catch is that the argument only goes through if you assume intuitionistic logic and that a knower can't know that they don't know something; a classical logician can just help herself to excluded middle and the whole thing dissolves. Contemporary defenders of knowability have responded by restricting the principle to simple observation statements, denying that it applies to conjunctions that contain a knowledge claim, which looks like cheating but is at least a live option.'

  Could you go clause by clause and tell me, as someone who actually works on this, what a specialist would nod at, what they'd wince at, and what's flatly wrong -- and in particular which bits are accurate reports of standard objections versus objections dressed up as refutations when they're really just contested positions? I have a stake in three specific things. First: is the conclusion really 'every truth is known by somebody', and does it matter whether that somebody is one idealised knower, or just some finite being at some time, or a community strung out across all of history? Does the paradox turn on that at all, or is it orthogonal to the whole business? Second: I have a nagging memory that the logic bit is backwards -- that the derivation is supposed to be respectable even without classical resources, or at least that the final step is where the controversy lives, and that this is precisely what makes the result awkward for the anti-realist who is already an intuitionist. Which is it, and does the anti-realist get any comfort from the difference? Third: is the response attributed to 'contemporary defenders' recognisable? My vague sense is that the live proposals are more like restricting knowability to propositions whose being known wouldn't be contradictory (I've seen the word 'Cartesian' stuck onto something like this) or distinguishing what is knowable in principle from what is knowable given how things actually turned out -- and neither of those is quite 'simple observation statements'. If the blog is gesturing at one of those, say which one it's garbling and how badly.

  If it helps, start by writing the derivation out in your own notation and flagging every assumption it leans on (factivity, closure of knowledge under conjunction, the modal logic, and how the knowability principle is being read), so that the audit hangs off the steps rather than off the prose -- that's more useful to me than a polished essay. No need for citations or reading lists, I can chase those down myself; I want the distinctions. And please be upfront about how confident you are in each of your main claims, and single out the one point where you're least sure. If some part of the blog turns out to be defensible after all, or the dispute is more open than the blog makes it sound, I'd much rather hear that than get a tidy verdict.
