  so my friend and I got into a huge thing last night about modal realism and I need someone to settle it for me. his whole move was an analogy and I honestly couldnt tell if it was genius or a cheat. He says possible worlds are basically like other places and other times. "Actual," he says, is just an indexical, same as "here" and "now" -- when I say "here" I dont mean the center of the universe, I just mean where I happen to be, and when I say "now" I dont mean some privileged present moment, I just mean the time I happen to be at. So when we call our world "the actual world" we arent picking out anything metaphysically special, we're just pointing at the one we're standing in. And then he dropped what he thought was the kicker: if you're already fine with eternalism about time -- the block universe, all times equally real, "now" is just where you're located -- then you should be exactly as fine with all possible worlds being equally real, because it's the identical move. He thinks this makes modal realism seem totally unspooky, and that anyone who accepts the one has no business rejecting the other. I pushed back but couldnt really articulate why, and now it's bugging me.

  Can you audit the analogy for me? I want the mapping spelled out first -- what plays the role of "here," of "now," of the spacetime that "here" and "now" live inside of, what corresponds to causal connection or the absence of it, and so on, a little table is fine. Then where it actually breaks down. And please be honest about which breaks matter for the conclusion he wants and which are just decoration. Like, does "actual" really behave like "here" and "now"? Is the time case quietly lending the worlds case something it doesnt have on its own -- a single connected manifold, causal relations, some kind of self-locating content -- that isnt there once we get to worlds? And does his "you should be fine with both" conclusion survive once the disanalogies are on the table, or was the analogy carrying the whole thing? If theres a better analogy for what modal realism is actually claiming, give me that too. American English please.
