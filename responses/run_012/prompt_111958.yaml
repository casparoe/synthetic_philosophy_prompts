  ok so I do this tiny podcast out of my apartment, total amateur, no degree, and next month my guest is this guy who is a hardcore one-boxer about Newcomb's problem. Just in case: a predictor that's been right like a million times in a row puts a million dollars in box B only if it predicted you'll take just box B, and leaves B empty if it predicted you'll take both boxes. Box A always has a thousand bucks in it. You either take both boxes or just B. He thinks taking just B is obviously right and that two-boxers are just confused.

  I want to grill him on the actual guts of his view, not let him restate it in his usual way. Draft me the questions, and under each one put a "Follow-up:" line keyed to the answer he's most likely to give. Also I've been messing around with my own twist and I want to spring it on him, so work it in somewhere.

  My twist: suppose the predictor only bothers to run its simulation of your brain if you sit down and deliberate hard about the choice. If you just grab on instinct without thinking it through, its accuracy drops to a coin flip. So the million is only there if you're the kind of person who agonizes over it. Does his one-boxing now tell me to avoid thinking about the problem? That seems insane but I can't see where he gets himself off the hook.

  Stuff I want covered:
  - the "the money is already in the box, my choice can't change it" objection, and what he even means by my choice being "evidence" about something that already happened
  - my twist above, and whether his view makes deliberating self-undermining
  - whether it matters that the predictor is a physical machine simulating my neurons versus some vague abstract "knower" — does the mechanism change anything for him, or is it all just about the track record
  - the smoking/lesion style cases: if he one-boxes, shouldn't he also avoid smoking because it's "evidence" of a bad gene he already has? What's actually different there
  - whether any evidence could make him drop one-boxing, or if the view can survive absolutely anything
  - and press him on whether the predictor being right means my choice was never really up to me in the first place

  Cap the whole reply at 700 words, follow-ups included, and don't pad it with throat-clearing.
