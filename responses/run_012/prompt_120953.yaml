answer: |-
  You answer when the strangers call,
  Your face lit up by someone else's pain.
  You seem to want to lose it all,
  As if the loss were distinct gain.
  It never weighs on you.

  Or else you count the Tuesday cost,
  A dog refused, the wine unpoured.
  You tally up what we have lost,
  And shear it off with duty's sword.
  It never weighs on you.

  I watch the hobbies fade to gray,
  The jokes you drop to keep the scale.
  You walk the narrow, perfect way,
  Where human clutter has no place.
  It never weighs on you.

  I love you, but I want the mess,
  The selfish sleep, the imperfect meal.
  I cannot want your holiness,
  Though I know the good is real.
  It never weighs on you.
