answer: |-
  # Bottom line

  You are asking for a factual test to solve a normative problem, and that is impossible. No checklist can tell you whether a student "really" knows something because "really" depends on which philosophical definition of knowledge your district secretly prefers. However, this procedure will force your committee to admit which definition they are using by making them choose a path at Step 3. It will not give you the truth; it will give you consistency. If you use this, you will likely have to fail a student who can clearly do the math (Case B) or pass a student who can clearly not do the math (Case A), depending on your settings. That is not a bug; it is the actual conflict your committee is trying to hide.

  # What the distinction actually says and what has to survive the translation

  Gilbert Ryle argued that "knowing how" (a skill, like riding a bike or solving an equation) is not the same thing as "knowing that" (a fact, like reciting the formula for the bike's gear ratio). For Ryle, if you can do the thing reliably, you know how. If you require a student to recite the rule before they can act, you start an infinite regress (you need a rule to apply the rule). In school terms, a Rylean view says: "If the answer is right and they can do it again on a new problem, they know it. Requiring a verbal explanation is extra, and possibly unfair."

  The "Intellectualist" pushback (the last 20–30 years of philosophy you mentioned) argues that knowing how *is* a kind of knowing that. To truly know how to solve an equation, you must grasp the proposition that *this method solves this type of problem*. Mere accidental success (or rote memorization without grasp) isn't knowledge. In school terms, this view says: "A correct answer isn't enough. They must be able to justify why it works, or they might just be pattern-matching or using a tool they don't understand."

  For your committee, the only parts of this fight that survive translation are **Reliability** vs. **Articulation**.
  *   **Reliability (Rylean):** Can the student perform the task across different contexts without crashing?
  *   **Articulation (Intellectualist):** Can the student describe the principles governing the task?

  The AI crisis has made your district lean hard toward Articulation (because AI provides Reliability without the student's internal capacity). However, leaning too hard on Articulation punishes students who have intuition but lack vocabulary. Leaning too hard on Reliability lets AI cheaters pass. You cannot have both perfect security and perfect fairness. This procedure translates the philosophy into those two measurable metrics.

  # The procedure

  **Time limit:** 10 minutes per student artifact/observation.
  **Materials:** Student work sample, one follow-up question or variant problem.

  **Step 0: The Policy Toggle (Do this once per committee term)**
  *   **Mode A (Security Focus):** Prioritizes catching AI/rote memorization. *Requires Step 3 to Pass.*
  *   **Mode B (Skill Focus):** Prioritizes actual output capability. *Step 3 is Optional.*
  *   *Note: This is the hidden philosophical fork. Mode A assumes Knowing How requires Knowing That. Mode B assumes Knowing How is a disposition.*

  **Step 1: Performance Check**
  *   **Action:** Look at the student's primary work. Is the final outcome correct according to standard rubric?
  *   **Pass:** Outcome is correct.
  *   **Fail:** Outcome is incorrect.
  *   **No Evidence Rule:** If the work is incomplete, mark "No Evidence" and stop. Do not guess.
  *   **Constraint:** If Step 1 Fails, the claim "Student knows how" is **False**. Stop. (You cannot know how to do something you cannot do).

  **Step 2: Variability Check**
  *   **Action:** Present a problem that requires the same skill but changes the surface features (different numbers, different context, reversed variables).
  *   **Pass:** Student solves the variant correctly without significant scaffolding.
  *   **Fail:** Student freezes, guesses, or applies the previous method incorrectly.
  *   **No Evidence Rule:** If you cannot administer a variant (e.g., standardized test only), mark "Assumed Pass" but flag for review.
  *   **Constraint:** If Step 2 Fails, the claim "Student knows how" is **False** (in Mode A or B). This catches the "memorized script" error.

  **Step 3: Articulation Check (The Philosophical Fork)**
  *   **Action:** Ask the student to explain *why* the method worked or to identify the rule they used.
  *   **Pass:** Student provides a coherent reason or identifies the correct principle.
  *   **Fail:** Student says "I don't know," "It just looked right," or gives a wrong reason for a right answer.
  *   **No Evidence Rule:** If the student is non-verbal or ELL and cannot explain in the target language, mark "No Evidence."
  *   **Decision Logic:**
      *   **If Mode A (Security Focus):** Step 3 Must Pass. If Fail, Claim is **False**. (This assumes Knowing How reduces to Knowing That).
      *   **If Mode B (Skill Focus):** Step 3 is Ignored. If Step 1 & 2 Passed, Claim is **True**. (This assumes Knowing How is distinct from Knowing That).
      *   **If No Evidence:** Hand off to Human Review (see section below).

  **Step 4: Final Determination**
  *   **Proficient:** Passed Step 1, Step 2, and Step 3 (if Mode A).
  *   **Not Proficient:** Failed Step 1, Step 2, or Step 3 (if Mode A).
  *   **Review Required:** Passed Step 1 & 2, but Step 3 was "No Evidence" or Mode B was selected and Step 3 Failed.

  # Run on the three cases

  **Case A: The Algebra II Girl (Explains well, freezes on new numbers)**
  *   **Step 1 (Performance):** Pass. Her initial work is perfect.
  *   **Step 2 (Variability):** Fail. She freezes when numbers change. This indicates she has memorized a specific script (Knowing That *this* sequence works for *those* numbers) but lacks the disposition to adapt (Knowing How).
  *   **Step 3 (Articulation):** Pass. She can recite the steps perfectly.
  *   **Result:** **Not Proficient.**
  *   **Why:** Step 2 is a hard gate in both Mode A and Mode B. You cannot claim to know how to solve equations if you can only solve *one specific* equation. Her ability to explain is irrelevant because she lacks the capacity. This result should feel satisfying; it catches the "parrot" problem.

  **Case B: The Fast Boy (Right answers, cannot explain)**
  *   **Step 1 (Performance):** Pass. Work is correct.
  *   **Step 2 (Variability):** Pass. He rips through variants quickly.
  *   **Step 3 (Articulation):** Fail. He genuinely cannot say why it works.
  *   **Result:** **Depends on Mode.**
      *   **If Mode A (Security Focus):** **Not Proficient.** The procedure forces you to fail him.
      *   **If Mode B (Skill Focus):** **Proficient.** The procedure forces you to pass him.
  *   **Why:** This is the uncomfortable one. If your district is freaking out about AI, you will likely run Mode A. This means you will officially mark this student as "not knowing" math, even though he can *do* math better than anyone else. The procedure exposes that your policy values *explanation* over *competence* to mitigate AI risk. You are sacrificing this kid's transcript to send a message about AI. The procedure does not hide this; it forces you to sign off on it.

  **Case C: The AI Kid (Nice work with AI, can't do it closed)**
  *   **Step 1 (Performance):** Pass (on the take-home/AI work).
  *   **Step 2 (Variability):** Fail (when tested closed-book/in class). He cannot reproduce the performance without the tool.
  *   **Step 3 (Articulation):** Fail (usually, if they relied on AI, they can't explain the logic deeply).
  *   **Result:** **Not Proficient.**
  *   **Why:** Step 2 catches this immediately. If the knowledge isn't internal, the variability check fails. Even if he could explain the AI's output (rare), failing Step 2 kills the claim. This is the easy case the procedure handles well.

  # Where it stops and a human decides

  The procedure hands the decision to a human in two specific scenarios:
  1.  **Step 3 "No Evidence" (Language/Disability):** If a student can do the math (Step 1 & 2 Pass) but cannot explain it due to a language barrier or speech issue, the procedure cannot distinguish between "He doesn't know the theory" and "He can't tell us." A human must decide if the Articulation requirement is waived for equity reasons.
  2.  **Mode B + Step 3 Fail (The Fast Boy):** If you run Mode B (Skill Focus) and the student fails Articulation, the procedure says "Proficient." However, a teacher may feel ethically uncomfortable passing a student who cannot explain their work, fearing it will hurt them later. Conversely, if you run Mode A, a human must decide if the penalty (failing a competent student) is proportionate to the risk (potential AI use).

  This is where the "values question" lives. The procedure can tell you *if* the evidence matches the definition, but it cannot tell you *which definition* is fair. That is a policy vote, not a factual finding.

  # Where this will misfire

  1.  **The "Lucky Guess" on Variability:** Step 2 assumes that getting the variant right means understanding. A smart student can pattern-match the variant without knowing the rule. The procedure will mark them Proficient. You will only notice this months later when the content gets harder.
  2.  **Anxiety Artifacts:** A student might Know How (Rylean) but freeze during the Variability Check due to test anxiety. The procedure marks them "Not Proficient." You will misidentify anxiety as ignorance.
  3.  **The "Good Liar":** As AI gets better, students will use AI to generate the *explanation* (Step 3) as well as the answer. They will Pass Step 1, Pass Step 3, but Fail Step 2 (if caught). If they memorize the AI explanation, they might Pass Step 2 on simple variants. The procedure cannot detect deep understanding, only surface reliability.
  4.  **Your Own Bias:** In Step 3 (Articulation), teachers naturally pass students who sound like *them*. If a student uses non-standard language to describe a correct concept, you might mark Step 3 as Fail. The procedure relies on your judgment there, so it inherits your bias.

  **Final Verdict:** Use this to force your committee to choose Mode A or Mode B. Do not pretend it reveals "true" knowledge. It reveals whether a student fits the box you built. If the Fast Boy gets crushed by Mode A, do not blame the procedure. Blame the decision to prioritize explanation over output.
