prompt: |-
  Ok so I'm a junior and I peer tutor in the math resource room two mornings a week before first period, and somehow I ended up as the student rep on the district committee that's rewriting our "demonstrated proficiency" rules, which everyone is suddenly freaking out about because of AI and because kids can now get right answers without (maybe) knowing anything. Here's my problem. My cousin who's a philosophy major told me about this guy Ryle who said knowing how to do something and knowing that something is the case are two completely seperate kinds of knowledge, and that the people who think knowing how is just knowing a fact in disguise are wrong, partly because if you needed to know a rule before you could do anything, you'd need a rule for applying the rule, and you'd never get started. But then my cousin also said that in the last 20-30 years a bunch of philosophers pushed back and said no, actually knowing how IS a kind of knowing that, it's just knowing a fact about a way of doing the thing, and the argument is more subtle than Ryle made it sound. Meanwhile our committee keeps writing rules that quietly assume one side or the other — like "students must be able to explain their reasoning" (that's assuming you can't know how without being able to say it) or "a correct answer is sufficient evidence of mastery" (that's assuming the opposite) — and nobody will admit it. I want something I can actually use.

  So: please write me a decision procedure I can run on paper in maybe ten minutes per case, that takes a claim like "this student knows how to solve systems of equations" or "this student knows how to parallel park" or "this student knows how to write a topic sentence," and tells me whether the claim is actually supported by what I've got. It has to be usable by teachers and administrators who have never read any philosophy and never will, so it should be plain steps in order, and for each step it should say what counts as a sufficient answer and what I do when I can't get evidence for that step at all. It also has to flag the places where the step is secretly a fork in the philosophical road, i.e., where the procedure only "works" if you've already picked a side about whether knowing how reduces to knowing that — I'd rather see the fork than have it hidden in a checklist. And it should say where the procedure has to stop and hand the decision to a person, because it's turned into a values question about what we're willing to give credit for, not a factual one about what's in the kid's head. Then run it on three cases from my actual life: (a) a girl in my algebra II group who can recite the quadratic formula steps and explain completing the square perfectly well but freezes the second the numbers are different from the ones in the book; (b) a boy who rips through problems fast and gets them right but genuinely cannot say why any of it works, and whose teacher wants to mark him down for "no understanding"; (c) a kid who turns in nice work with an AI thing open in another tab and can't do it when it's closed. At least one of those should come out in a way I don't like, and don't soften it to make me feel better about the policy. If I've got the Ryle stuff wrong, or if the whole idea that you can test "does he really know how" is confused and a checklist is the wrong shape for it, just say so plainly instead of building me a checklist to be polite — I'd rather find out now than in front of the committee. Don't give me a reading list, I'm not going to read it and I'll look up anything I actually need later.

  Can you lay it out with these headings, in this order: "Bottom line" (like three sentences, your honest verdict on whether this procedure can do what I'm asking), then "What the distinction actually says and what has to survive the translation" (roughly a page, including which parts of the Ryle-vs-the-other-side fight matter for my actual cases and which parts are just philosophy), then "The procedure" (the numbered steps, with pass/fail conditions and the no-evidence rule for each), then "Run on the three cases" (about a page, one after another, no hedging about which side of the line each one lands on), then "Where it stops and a human decides," then "Where this will misfire" (a short honest section on the cases that will break it, including anything I'll only notice after I've already used it on a real kid).
