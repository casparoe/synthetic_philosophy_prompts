answer: |-
  Your hypothesis is not rubbish; in fact, it is considerably sharper than the arguments your group has been recycling for eighteen months. You have correctly identified that the stalemate is not merely a matter of differing opinions, but of differing categories. You are not having one argument; you are having three distinct arguments that have been mistakenly conflated under the heading of 'meaning'.

  Here is a diagnosis of the impasse, based on the positions you have outlined, followed by an assessment of what progress might actually look like.

  ### 1. The Diagnosis: Jurisdiction, not Truth

  You suggest this is a verbal disagreement, two different questions sharing one word. I would refine that: it is a dispute over **jurisdiction**.

  When the Intentionalists (your first two) ask, 'What does this mean?', they are asking a historical or biographical question: *What act was performed here?* For them, a text is a speech act. If I say 'I promise', the meaning is bound to my intention to promise. If the Intentionalists are correct, interpreting a text without reference to the author is like trying to understand a promise without knowing who made it or to whom.

  When the Anti-intentionalists (your second two) ask the same question, they are asking a linguistic or structural question: *What does this machinery do?* For them, a text is an autonomous object. Once published, the author's private mind is irrelevant, much like a carpenter's thoughts are irrelevant to the structural integrity of a chair. They are looking for coherence within the system of the text itself.

  The Reader-Response advocate (your fifth member) is asking a phenomenological question: *What happens to me when I encounter this?*

  The reason nobody budsges is that these positions are axiomatically incompatible. You cannot prove to the Intentionalist that the text is an object, because they define it as an act. You cannot prove to the Anti-intentionalist that the author matters, because they define the text as severed from the author at the moment of publication. They are not disagreeing on the answer; they are disagreeing on what constitutes the question.

  ### 2. The Slide: 'Correct' vs. 'Worth Having'

  Your second point—that the group is sliding between 'which reading is correct' and 'which reading is worth having'—is the most fertile ground for progress. This is the distinction between **validity** and **utility**.

  The Intentionalists are obsessed with validity. They fear that without the anchor of intention, anything goes, and interpretation becomes a free-for-all. They want a 'right' answer to prevent chaos.
  The Anti-intentionalists and the Reader-Response advocate are often more concerned with utility. They want to know which reading yields the most interesting, coherent, or emotionally resonant discussion.

  **What counts as progress here?**
  Progress would be achieved if the group agreed to stop asking 'Who is right?' and started asking 'What does this method *yield*?'
  If the Intentionalist approach yields a dry biographical fact that kills the discussion, admit it. If the Anti-intentionalist approach yields a brilliant reading that the author would have hated, admit that too. You must separate the *authority* of the reading from its *interest*.

  A useful distinction to introduce is E.D. Hirsch's split between **Meaning** (what the author intended) and **Significance** (how that meaning relates to a later context or reader). If your group can agree that 'Meaning' might be fixed (Intentionalist view) but 'Significance' is where the actual reading group work happens (Anti-intentionalist/Reader view), you might find a truce. You can respect the author's intent as a historical boundary while acknowledging that the text's life exists beyond it.

  ### 3. The Wrinkle: Planning vs. Execution

  Your wrinkle is the most dangerous weapon in the room, and the reason your Intentionalists dislike it is that it exposes a crack in their foundation.

  If the author intended X but wrote Y, which is the intention?
  *   If they say the *plan* (X) matters, they privilege a ghost over the evidence. They are valuing a private thought over the public work.
  *   If they say the *execution* (Y) matters, they have effectively conceded to the Anti-intentionalists. They are admitting that the text itself is the only reliable evidence of intention.

  This is often called the distinction between the 'prior intention' and the 'intention-in-the-work'. Most sophisticated Intentionalists argue for the latter, but this brings them perilously close to saying 'the text means what the text says', which is the Anti-intentionalist position. Pressing this point forces the Intentionalists to admit that 'intention' is often just a reconstruction based on the text anyway.

  ### 4. The Anonymous Text

  Does the diagnosis change for an anonymous poem? Yes, and it acts as a stress test for your group.

  *   **For the Anti-intentionalists:** Nothing changes. The text remains an object. The lack of an author is irrelevant.
  *   **For the Reader-Response advocate:** Nothing changes. The reader remains the site of meaning.
  *   **For the Intentionalists:** This is where their position often collapses or becomes disingenuous. Faced with an anonymous text, a hardline Intentionalist must either:
      1.  Admit they cannot determine the meaning (which renders the text mute).
      2.  Construct a hypothetical author (the 'implied author').

  If they choose option two, they are effectively smuggling Anti-intentionalism in through the back door. They are inferring an intention *from the text*, which is exactly what the Anti-intentionalists do, they just label it 'intention' to save face. If you can get your Intentionalist friends to admit that with an anonymous poem they rely on textual conventions rather than biographical facts, you expose that their method is not actually about the *author*, but about a *construct of the author* derived from the text.

  ### 5. Conclusion: Will it Dissolve?

  Will this distinction dissolve the argument? No. It is not a muddle; it is a genuinely hard problem rooted in the ontology of art. Is a book a message from a human (requiring a sender) or a cultural object (existing independently)? Both views have merit.

  However, the stagnation can end. The progress you are looking for lies in shifting the group's goal from **adjudication** to **calibration**.

  Stop trying to decide which camp is 'correct'. Instead, treat the three positions as different lenses.
  *   Lens A (Intention): What historical problem was this solving?
  *   Lens B (Textual): How do the parts cohere structurally?
  *   Lens C (Reader): Why does this move us now?

  If you frame the discussion as, 'Let's see what we lose if we ignore the author,' versus 'Let's see what we lose if we ignore the text's autonomy,' you turn a row into a methodology.

  Your hypothesis is sound. You are not suffering from a lack of knowledge, but from a category error. The word 'meaning' is doing too much work. If you can persuade the group to specify whether they are discussing *origin*, *structure*, or *effect*, you might finally get a fresh cup of tea and a new book.
