answer: |-
  **Project Title:** Axes of Dependence: Disentangling Lock-in, Hysteresis, and Contingency in Historical Explanation

  **Applicant:** [Name]
  **Fellowship:** One-Year Residential Fellowship
  **Institute:** [Institute Name]

  **Project Summary**
  The phrase "path dependence" has become a default explanation for historical stability, but it currently performs three distinct explanatory jobs that are frequently conflated. First, in economic history, it denotes *lock-in*: early choices amplified by increasing returns make switching costs prohibitive. Second, in physical systems (and my own background in geophysics), it denotes *hysteresis*: the current state depends on the history of forces, implying irreversibility. Third, in evolutionary biology and macro-history, it denotes *contingency*: the claim that rewinding the tape of history would not yield the same outcome.

  This project argues that historical scholarship often produces evidence for the first two (the system is hard to change *now*) to support conclusions about the third (the system *had* to happen *then*). This slippage creates a false sense of inevitability. I propose to separate these axes to determine under what conditions evidence of present stability licenses claims about past contingency.

  **Intellectual Context and Stakes**
  It is settled among specialists that "path dependence" is not a unitary mechanism. Economists distinguish increasing returns from simple causality; philosophers of history distinguish between "unpredictability" and "causal dependence." However, outside these specialized silos, the terms are treated as interchangeable synonyms for "history matters." This is not merely semantic; it alters the ontological status of historical events. If a technology is locked in (Axis 1), it is an economic fact. If a biological form was inevitable (Axis 3), it is a law-like regularity.

  The contested ground lies in the migration of these concepts. Many historical narratives treat the difficulty of displacing a current regime as proof that the regime was the only possible outcome of the past. This project does not argue that path dependence is invalid, but that its current usage obscures the difference between *ex post* stability and *ex ante* necessity. Clarifying this is a prerequisite for any rigorous counterfactual history.

  **Research Question**
  *Does evidence of hysteresis or economic lock-in in a historical system reliably indicate evolutionary contingency, or can a system be simultaneously locked-in (hard to change now) and contingent (could have been otherwise then)?*

  This question admits a determinate answer: a taxonomy of cases showing where the correlation holds and where it breaks.

  **Methodology**
  I will employ a comparative case method paired with a conceptual stability analysis. I have no budget for archive travel; the work will be library-based, relying on secondary literature where the claim of path dependence is central.

  1.  **Paired Cases:** I will select two cases where path dependence is the dominant explanation.
      *   *Case A (Lock-in without Contingency):* A system where the outcome was highly contingent initially, but is now effectively irreversible (e.g., a specific technological standard).
      *   *Case B (Contingency without Lock-in):* A system where the outcome was robust across multiple initial conditions, but is currently unstable or reversible.
      *   *Analysis:* I will trace the arguments in the literature to identify where the author slides from describing the current difficulty of change to asserting the past inevitability of the outcome.

  2.  **Formal Conceptual Analysis:** I will attempt to define "would have arrived anyway" using the notion of *basins of attraction*. The goal is to map the size of the set of initial histories that reach the same end state.
      *   *Methodological Honesty:* I must note a significant risk here. In physics, basins of attraction are defined over state spaces with known variables. In history, the state space is undefined. There is a danger that this formalization is merely "physics costume"—restating the puzzle in topological language without adding predictive or explanatory power. To mitigate this, I will not attempt mathematical modeling. Instead, I will use the formalism strictly as a logical check: explicitly listing which variables must be held constant for a "replay" to count as valid. If I cannot define the boundaries of the basin without resorting to "similar outcomes," the formalization will be abandoned as decorative.

  **Failure Modes**
  A project of this kind risks concluding that the distinctions are too subtle to matter. I define failure as follows:
  1.  **The Collapse:** If the case studies reveal that in every instance of genuine lock-in, the past was also non-contingent (i.e., the axes are perfectly correlated), then the distinction is theoretically valid but empirically empty.
  2.  **The Costume:** If the "basin of attraction" analysis cannot be operationalized without vague analogies, it will be excluded from the final text rather than included as metaphor.
  3.  **The Triviality:** If the result is simply that "some things are contingent and some are not," without identifying the *mechanism* that distinguishes them, the project will not have advanced the debate.

  **Timeline**
  *   **Quarter 1:** Literature review and case selection. Finalize the criteria for distinguishing the three types of dependence. Draft the "logic check" for the formal analysis.
  *   **Quarter 2:** Deep dive into Case A. Draft the analysis of how lock-in is argued vs. how contingency is argued. Test the formal framework against this case.
  *   **Quarter 3:** Deep dive into Case B. Complete the comparative analysis. Determine if the formal framework holds or if it must be discarded (see Failure Modes).
  *   **Quarter 4:** Synthesis and writing. Produce a monograph-length manuscript (approx. 60,000 words) and one article for a general history of science journal.

  **Significance**
  For a historian of science, the stakes are methodological. We frequently use concepts from physics and economics to explain historical change. If we import "hysteresis" to explain "inevitability," we may be importing a physical necessity where there is only a social cost. By separating the difficulty of leaving a path from the probability of entering it, this project aims to restore precision to how we argue about what could have been otherwise.

  ***

  **Consultant's Note (AI Assessment)**

  You asked me to be honest with you about the formalization and the distinction. Here is my direct assessment, separate from the proposal text:

  1.  **Is the distinction confused?** No. The distinction between *ex post* lock-in (it's hard to change now) and *ex ante* contingency (it didn't have to happen) is robust. However, you are correct that it is routinely conflated in popular and semi-technical history. Your hunch that historians prove the former to claim the latter is well-founded.
  2.  **Is the formalization "physics costume"?** There is a high risk of this. In geophysics, you have state variables and energy landscapes. In history, "energy" is metaphorical (social capital, investment, etc.). If you try to define a "basin of attraction" without defining the *dimensions* of the space, it is just a metaphor.
      *   *Advice:* In the project, treat the formalization as a *negative* test. Use it to show where historical arguments *fail* to define their state space. If you can show that most historical claims of "inevitability" collapse because they cannot define the parameters of the "replay," that is a result. Don't try to solve the topology; try to show why the topology is missing.
  3.  **The Failure Mode:** The real risk isn't that the axes correlate; it's that "contingency" is unfalsifiable. If you can't run the tape again, how do you prove the basin was small? Your project succeeds if you can show that historians *claim* the basin is small without evidence, not necessarily that you can measure the basin.
  4.  **Schedule:** The quarter-by-quarter plan is realistic for a solo researcher with no archive needs. Q4 is tight for a monograph draft; consider aiming for three substantial articles instead.

  This is a strong proposal because it leverages your specific background (geophysics) to critique a methodological habit in history. Lean into the "imported metaphor" angle.
