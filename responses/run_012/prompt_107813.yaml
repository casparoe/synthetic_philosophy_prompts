answer: |-
  Here is the breakdown. I am approaching this as a social epistemologist: my interest is not in whether your grandmother's story is "true" in a correspondence sense, but in the *conditions of possibility* for any story to survive 80 years. You are dealing with two competing testimony chains (family vs. town) and a material record that is incomplete.

  Below is the brainstorm, the cut, and the ranked prioritization.

  ### Phase 1: The Brainstorm (Candidate Questions)

  1.  What specific physical events left no paper trail at all?
  2.  Who funded the publication of the official town history?
  3.  Were the family letters intended to be read by third parties or censors?
  4.  Does the official history rely on sources that no longer exist?
  5.  What administrative records (tax, utility, census) exist that were not created for historical purposes?
  6.  Which local elites were in conflict with each other during the 1940s?
  7.  What social cost would my family have paid for publicizing their version in 1950?
  8.  Is the "official" story internally consistent, or does it patch over contradictions?
  9.  What vocabulary does the official record use to describe the displaced or defeated?
  10. Does my aunt's recollection align with the letters, or has it drifted over time?
  11. What standard record-keeping protocols were in place for the village in the 1940s?
  12. Who was considered a "credible witness" by the local authorities at the time?
  13. What economic incentives existed to suppress the family's version of events?
  14. Are there gaps in the letter collection that correspond to key events?
  15. Did the "victors" need the "losers" to remain silent, or just compliant?

  ### Phase 2: The Cut

  I am discarding questions that assume a binary of "Truth vs. Lie." That is a moral framework, not an epistemic one. I am also discarding questions that require archive access you don't have (e.g., specific funding trails, deep elite biographies).

  I am keeping questions that distinguish between *structural silence* (no one wrote it down) and *active suppression* (it was written down and removed/spun). I am prioritizing questions that treat the "official" record not as a monolith of "victors" but as a product of specific local incentives, which may have nothing to do with the war's outcome.

  ### Phase 3: The Top 5 Ranked Questions

  Here are the five questions that matter most, ranked by their upstream importance to your project.

  #### 1. Is the discrepancy between the records due to *absence* (nothing was generated) or *distortion* (something was generated and altered)?
  *   **Why it is upstream:** This is the foundational diagnostic. If the family's experience was never documented because it was considered administratively irrelevant (absence), no amount of textual analysis will find it in the official record. If it was documented and then spun (distortion), you can look for the seams in the narrative. Confusing these two leads to chasing ghosts.
  *   **Tractability:** High. Compare the timeline of events in the letters against the timeline in the official record. If the official record skips a month where the letters describe chaos, that is absence. If the official record describes that month as "orderly transition," that is distortion.
  *   **What moves it:** If you find bureaucratic receipts (ration cards, repair bills) that contradict the *official narrative* but align with the *letters*, you have moved from absence to distortion.
  *   **Blunt assessment:** This is the hardest pill to swallow. It is highly probable the answer is "absence." The powerful do not always destroy records; often, they simply don't create them because the suffering of the powerless is not data they need to manage.

  #### 2. What "unintended traces" exist that were generated for bureaucracy rather than history?
  *   **Why it is upstream:** This bypasses the "who writes the narrative" problem entirely. A tax assessor, a census taker, or a utility company does not care about the town's mythos; they care about liability and revenue. These records are often more reliable regarding material conditions (who lived where, what was destroyed, economic status) than either the family letters or the town history.
  *   **Tractability:** Medium. You mentioned "local records." If these include ledgers, permits, or maps, they are your control group. They are usually dry, English-language, and systematic.
  *   **What moves it:** If the official history says "the village was abandoned voluntarily" but utility records show service cuts due to "enemy action" or "forced evacuation," the bureaucratic trace overrides the narrative.
  *   **Blunt assessment:** This is your best chance at objective footing. However, do not sentimentalize these records. They are cold. They document people as units of administration, which is its own form of violence, but it is a *consistent* violence you can measure.

  #### 3. Who were the specific local stakeholders who benefited from the *official narrative*, regardless of which side won the war?
  *   **Why it is upstream:** This addresses your point about "the victors" being incoherent. The official town history was likely written in the 1950s or 60s by local boosters, survivors, or politicians. Their goal wasn't necessarily to glorify the military victors, but to secure property rights, attract investment, or stabilize the post-war social order. The "lie" might be economic, not ideological.
  *   **Tractability:** Medium-Low. You can't access deep archives, but you can analyze the *authorship* of the official history. Who signed it? What was their profession? Did they own land that was disputed in the 1940s?
  *   **What moves it:** If the author of the official history was a land developer who bought up village plots cheaply in 1945, the narrative is likely shaped to legitimize those transactions.
  *   **Blunt assessment:** You are looking for *cui bono* (who benefits). Do not assume the benefit is political prestige. It is often property value or legal immunity.

  #### 4. Were the family letters "private" or "performative"?
  *   **Why it is upstream:** You are treating the letters as raw data. They are not. They are testimony shaped by the medium. In the 1940s, letters were subject to censorship (if military), family scrutiny, or self-censorship to protect recipients from worry. Your aunt's recollections are further degraded by time and the "family mythos" that solidified over decades.
  *   **Tractability:** High. Read the letters for audience awareness. Do they omit details? Do they use code? Does your aunt's story match the letters, or does it match the *gaps* in the letters?
  *   **What moves it:** If the letters suddenly stop discussing a specific topic but allude to "trouble," you have identified a zone of active suppression within the family archive itself.
  *   **Blunt assessment:** You are probably sentimental about the letters. You view them as "truth" against the town's "lies." They are both constructed narratives. The letters might be lying to protect your grandmother's feelings, not just the town lying to protect its reputation.

  #### 5. What was the social cost of maintaining the counter-narrative in the decades following the war?
  *   **Why it is upstream:** This explains why the official history dominates *now*. It's not just that it was written; it's that it was *accepted*. If your family's version required them to be seen as victims, collaborators, or troublemakers, they may have self-silenced over 40 years to integrate into the community.
  *   **Tractability:** Medium. Look at the timeline. When did the official history get published? Did your family move away? Did they stop talking about it after a certain date?
  *   **What moves it:** If the family story was vibrant in 1946 but silent by 1960 (when the town history was published), the pressure was likely social assimilation.
  *   **Blunt assessment:** This questions the reliability of your aunt's recollections. If the family stayed in the town, they may have unconsciously adopted the official narrative to survive socially. The "family story" might be a compromised hybrid.

  ### The "Overrated" List (What to Avoid)

  You asked for bluntness. Here are the questions you will be tempted to ask that are not worth your time.

  1.  **"What really happened?"**
      *   **Why it's overrated:** You cannot reconstruct the event ontology. You are reconstructing the *record*. Accept that you are studying the epistemology of the village, not the village itself. Chasing the "real event" leads to speculation, not analysis.
  2.  **"Who is the villain?"**
      *   **Why it's overrated:** This is moralizing, not historical. It assumes bad actors rather than structural incentives. The person who wrote the false history might have been a well-meaning schoolteacher trying to "heal the community," which is arguably more dangerous than a malicious liar.
  3.  **"Does the official history match the military records?"**
      *   **Why it's overrated:** You noted the "losers write history" problem. Military records might confirm the battle happened, but they won't explain the local social aftermath. Also, without archive access, you are relying on digitized military summaries which have their own bureaucratic blind spots.
  4.  **"Can I prove my family right?"**
      *   **Why it's overrated:** This is confirmation bias dressed as research. If you start here, you will unconsciously weight evidence that supports them and discount evidence that complicates their story. Your goal should be to understand *why the accounts diverge*, not to win the case for the defense.
  5.  **"Is the archive biased?"**
      *   **Why it's overrated:** All archives are biased. Asking this is a tautology. The useful question is *how* the bias operates (e.g., does it favor property owners? does it favor the literate? does it favor the survivors who stayed?).

  ### Final Advice for the Year

  You are a chemist. Treat the documents as samples.
  *   **The Official History** is a refined precipitate: clean, structured, but missing the volatile elements.
  *   **The Letters** are a solution: rich in data, but subject to contamination and degradation.
  *   **The Aunt** is a spectral analysis: high energy, but prone to interference patterns from memory.

  Do not try to mix them into a single solution. They will not dissolve into one truth. Your project's value lies in mapping the solubility limits—showing exactly where and why the records refuse to mix. That tension *is* the history.
