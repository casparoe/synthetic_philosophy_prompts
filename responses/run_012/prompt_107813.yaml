          *   Q2 (Admin Residue): Tractable if local records are online or accessible. User says "handful of local records." Okay.
          *   Q3 (Elite Fragmentation): Harder without deep archive access. Might need to be scaled back to "Authorship analysis."
          *   Q4 (Testimonial Ecology): Tractable via analyzing the letters (who is writing to whom).
          *   Q5 (Narrative Utility): Tractable via logical inference of the 1940s context.

      *   *Re-evaluating Q3:* If the user can't access archives, figuring out elite infighting is hard. Better to focus on *Incentive Structures*. Why would the author of the official history lie?
      *   *Re-evaluating Q1:* This is the most philosophical. It sets the stage.
      *   *Re-evaluating Sentimentality:* The user probably wants to vindicate the grandmother. I need to be blunt that "What really happened" is the wrong question. "How did the record form?" is the right one.

      *   *Revised Top 5:*
          1.  **Distinction between Structural Silence and Active Distortion.** (Upstream: Defines the problem space).
