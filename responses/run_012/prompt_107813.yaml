          3.  **The Private/Public Boundary of the Family Letters.** (Epistemic status of the counter-evidence).
          4.  **The Bureaucratic Baseline.** (Using boring records as a control group).
          5.  **The Function of the Consensus.** (Why did the town accept the official version?).

      *   *Wait, let's look at the "Losers Write History" constraint again.* The user specifically noted that defeated sides often dominate the narrative (Lost Cause, etc.). So Question 2 needs to reflect that the "Official History" might not be the "Victors" in a military sense, but the "Victors" in a cultural/political sense *locally*.
      *   *Let's sharpen Q1.* It needs to be about *generation* vs. *curation*.
      *   *Let's sharpen Q3.* It needs to address the "Aunt's Recollection" vs. "Letters." Memory vs. Contemporary Document.

      *   *Final Polish on the 5:*
          1.  **Generation vs. Curation:** (Trace survival vs. Narrative shaping).
          2.  **The Bureaucratic Control:** (Unintended records vs. Intended history).
          3.  **The Audience of the Private:** (Were the letters truly private?).
          4.  **The Local Elite's Interest:** (Not "Victors" but "Stakeholders").
          5.  **The Cost of Contradiction:** (Why the family story didn't stick).

      *   *Wait, I need to make sure I'm blunt about overrated questions.*
          *   Overrated: "What is the truth?" (Unreachable).
