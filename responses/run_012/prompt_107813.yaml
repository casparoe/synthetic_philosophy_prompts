  6.  **Drafting the Response:**
      *   *Tone:* Professional, philosophical, direct, slightly academic but accessible (Chemist to Chemist).
      *   *Structure:*
          1.  Intro (acknowledge the role and the constraint).
          2.  The Brainstorm List (10-12 items).
