          4.  The Top 5 (Ranked, with Upstream/Tractability/Movement analysis).
          5.  The "Overrated" Section (Blunt assessment).
      *   *Content Check:* Ensure American English. Ensure no citations. Ensure the "victors" slogan is nuanced.

      *(Self-Correction during drafting)*: Make sure I explicitly address the "fixing distortion vs. fixing absence" point in the ranking reasoning. That was a specific request.
      Also, ensure I don't give false hope about "solving" the history. The goal is *understanding the record*, not necessarily *recovering the event*.

      *Refining the Ranking:*
      1.  **Absence vs. Distortion:** This is the most upstream epistemological distinction. If you confuse them, you can't proceed.
      2.  **Unintended Traces:** This is the most tractable way to bypass the narrative bias.
      3.  **Local Stakeholders:** This addresses the "victors" nuance.
