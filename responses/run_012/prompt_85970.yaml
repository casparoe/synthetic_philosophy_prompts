prompt: |-
  I am a novelist at work on a book whose plot turns on a surrogacy arrangement, and after some months of reading the legal materials I have the uneasy sense that I understand the rules better than I understand the ideas underneath them. Two regimes sit at the centre of the story. In the first — much of continental Europe — the paid arrangement is prohibited outright, the woman who gives birth is the legal mother no matter whose egg she carried, and any agreement that purports to hand the child over in advance is void as against public policy. Yet the very same systems permit egg donation, allow a mother to place a newborn for adoption, and have been required by a European human-rights court to recognise after the fact the parent-child relationships they refuse to create in advance, on the ground that the child's own interests forbid leaving the tie in legal limbo. In the second regime — several American states, California being the one my plot needs — the contract is enforceable, the intended parents can be named as the child's legal parents from birth, and the woman who carries the pregnancy is treated by the law as something close to a service provider who never acquires a parental claim at all. At a dinner last week a friend who teaches law told me the two systems simply embody different values and that I should stop looking for a single principle; another insisted they are not even consistent with themselves, and that the European side is the more obviously incoherent, since it severs the genetic tie happily enough and permits the transfer of a child by adoption but draws the line at a transfer agreed in advance and paid for. I came away convinced I had been reading the wrong kinds of documents.

  What I would like from you is not a survey of either regime but an account of what each presupposes. Begin with the view of parenthood, of the body, and of what may be bought and sold that each set of rules only makes sense under: on the European side, something like the claim that gestation creates a bond no contract can dissolve and that the human body and its parts must not be a source of financial gain; on the American side, that parental status follows the intention to raise a child and that a woman's labour and risk are hers to price. Then tell me which rival views each regime quietly rules out — could a Kantian about dignity, a feminist about exploitation, a conservative about the family, and an economist about incomplete contracts all endorse the same ban, and if so, is the ban doing any theoretical work of its own? I want the distinctions kept sharp: what the rules strictly require versus what they merely sit comfortably with, and where each regime is so underdetermined that several incompatible theories would license exactly the same statutes. Address the asymmetries directly — egg donation and adoption on one side, birth certificates and pre-birth parentage orders on the other, and the recognition problem that has forced European courts to protect a relationship their legislatures had forbidden. Finally, tell me what would have to change in the rules, and not merely in the rhetoric, if a regime were rebuilt on the rival conception of what makes someone a parent. Please write in plain language and name the positions in ordinary words rather than school-of-thought labels; these arguments have to come out of the mouths of characters who have never read a word of philosophy.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist working on a book about surrogacy.
      *   **Problem:** Understands the *rules* of two regimes (Continental Europe vs. California/US) but not the underlying *ideas/values*. Feels the legal materials are dry and misses the philosophical core.
      *   **Task:** Provide an account of the presuppositions of each regime (view of parenthood, body, commodification). Explain which rival views each regime rules out. Address the asymmetries (egg donation, adoption, recognition problems). Explain what would need to change *in the rules* (not just rhetoric) to switch regimes.
      *   **Constraint:** Write in plain language. Avoid academic/school-of-thought labels (e.g., "Kantian," "Utilitarian"). The arguments must be speakable by characters who haven't read philosophy.
      *   **Goal:** Help the novelist understand the *conflict* to drive the plot/characters.

  2.  **Deconstruct the Two Regimes:**

      *   **Regime A: Continental Europe (The "Protectionist" Model)**
          *   *Rules:* Paid surrogacy banned. Birth mother = legal mother. Pre-birth transfer agreements void.
          *   *Allowances:* Egg donation allowed (sometimes). Adoption allowed (post-birth). Must recognize foreign surrogacy sometimes (ECHR rulings).
          *   *Core Ideas:* Gestation creates an unbreakable bond. The body isn't a tool for rent. Children aren't products.
          *   *Tensions:* Why allow egg donation (genetic split) but not surrogacy (gestational split)? Why allow adoption (transfer) but not pre-agreed transfer?

      *   **Regime B: California/US (The "Contractual/Intentional" Model)**
          *   *Rules:* Contracts enforceable. Intended parents = legal parents from birth. Surrogate = service provider (no parental claim).
          *   *Core Ideas:* Parenthood is about intent and commitment. Bodily autonomy includes the right to contract labor. Freedom of contract.
          *   *Tensions:* Risks treating women as incubators. Risks treating children as goods.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the novelist's insight. The law is often a patchwork of compromises, but the *foundations* differ.
      *   **The European Presuppositions:**
          *   *Parenthood:* It's something that *happens* to you, not something you *order*. The act of carrying makes you the mother.
          *   *The Body:* It's not a toolbox. You can give parts (eggs/blood) but you can't rent the whole machine for a specific outcome.
          *   *Money:* Money corrupts the relationship. If you pay for a baby, the baby becomes a product.
          *   *The Asymmetry (Egg/Adoption):* Egg donation is a *gift* of material, not a service of labor. Adoption is a *rescue* or a *change of circumstance* after the fact, not a manufacturing plan.
      *   **The American (California) Presuppositions:**
          *   *Parenthood:* It's a project you start. If you planned it and provided the material (or paid for the service), you're the parent.
          *   *The Body:* It's yours to use. If you can work a factory job, you can carry a pregnancy.
          *   *Money:* Payment acknowledges the work and risk. It makes the deal fair and clear.
          *   *The Asymmetry:* Adoption is messy and risky (birth mother might change mind). Surrogacy is clean because the intent is clear from the start.
      *   **The "Underdetermined" Areas (Where theories overlap):**
          *   Who opposes the ban? Who supports it?
          *   *The Ban:* A religious conservative (family sanctity), a feminist (exploitation), and a dignity philosopher (human worth) might all agree surrogacy is bad, but for different reasons.
          *   *The Permission:* A libertarian (freedom), a pragmatist (kids need parents), and an egalitarian (access to parenthood) might all agree it's good.
          *   *Key Insight:* The law doesn't tell you *why* it chose a side, just *that* it chose.
      *   **The Recognition Problem (The European Crack):**
          *   Europe bans making the family, but protects the family once it exists (especially for the child's sake). This creates a "hypocrisy" gap. You can't build the house, but if you build it illegally, we won't tear it down because the kid lives there.
      *   **Switching the Rules (What actually changes):**
          *   If Europe went American: You'd need to strip the birth mother's name off the certificate immediately. You'd need to treat the pregnancy as a job.
          *   If California went European: You'd need to void contracts mid-pregnancy. You'd need to force the intended parents to adopt their own genetic child.
      *   **Tone Check:** Keep it plain. No "deontology," "consequentialism," "commodification." Use words like "dignity," "work," "gift," "product," "bond."

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the distinction on egg donation clear?
      *   *Fix:* Emphasize that Europe sees egg donation as medical help for infertility, whereas surrogacy is seen as outsourcing the *work* of being a parent.
      *   *Critique:* Is the "underdetermined" section clear?
      *   *Fix:* Use the "Strange Bedfellows" analogy. Show how different people agree on the rule for different reasons.
      *   *Critique:* Is the language simple enough?
      *   *Fix:* Avoid "jurisprudence." Use "rules," "logic," "story." Ensure the explanations sound like things a character could say at a dinner table.

  5.  **Final Polish:** Check against the prompt requirements.
      *   Plain language? Yes.
      *   No school-of-thought labels? Yes.
      *   Address asymmetries? Yes.
      *   Address what rules would change? Yes.
      *   Focus on presuppositions? Yes.

  6.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  You are right to feel that the legal documents are hiding the real story. Laws are often compromises, stitched together from different arguments that don't quite match. But to write this well, you need to understand the two different stories the laws are trying to tell about what a human being is.

  Here is the breakdown of the two worlds your characters inhabit, stripped of the legal jargon.

  ### 1. The European Regime: The Body as a Person, Not a Tool

  In this system, the law is built on a specific picture of human dignity. It assumes that there are some things about being human that cannot be turned into a transaction without damaging everyone involved.

  **The View of Parenthood**
  Parenthood is not a project you manage; it is a reality you inhabit. The law assumes that the act of carrying a child creates a bond that is biological, psychological, and moral. You cannot sign a paper before the baby is born that says, "I will not love this child," because the law believes that love is a natural result of the physical connection. Therefore, the woman who gives birth is the mother, full stop. To say otherwise is to tell a lie about reality.

  **The View of the Body**
  The body is not a collection of spare parts or a piece of machinery you can rent out. You can give parts of yourself away (like blood or eggs) as a gift to help someone else, but you cannot rent out your bodily functions for a fee. Renting implies you are a tool for someone else's use. This system draws a hard line between *giving* (which is human) and *selling* (which turns the person into an object).

  **The View of the Child**
  A child is a person to be welcomed, not a product to be manufactured. If you pay for a service that results in a child, the child risks becoming the "product" of that transaction. The law wants to ensure that the child is never the object of a contract.

  **The Asymmetries (Egg Donation and Adoption)**
  This is where your friend is right that it looks inconsistent, but there is an internal logic to it.
  *   **Egg Donation:** This is allowed because it is viewed as medical treatment for infertility, akin to a tissue transplant. It is a gift of material, not a rental of labor. The woman donating the egg does not carry the child; she is not "making" the baby in her body, she is providing the seed. The law sees this as helping a natural process, not replacing a mother.
  *   **Adoption:** This is allowed because it deals with a tragedy or a change of circumstances that has *already happened*. A mother who places a child for adoption is making a decision in the face of reality. Surrogacy, by contrast, is planning the separation before the child exists. The European view is that you can fix a broken situation (adoption), but you cannot plan a broken situation (surrogacy).

  **The Recognition Problem**
  You mentioned the courts forcing recognition of foreign surrogacies. This is the crack in the wall. The European system says, "We will not let you make this family here." But when a child comes back from abroad with two parents and a surrogate mother who has walked away, the court says, "We cannot punish the child for the parents' breakage of the rules." The child needs a legal identity. So, the law forbids the creation of the relationship but protects the relationship once it exists. It creates a zone where the law is hypocritical by necessity: "What you did was wrong, but the result is now sacred."

  ### 2. The Californian Regime: The Mind as the Parent, The Body as Labor

  In this system, the law is built on a picture of autonomy and intent. It assumes that adults should be free to arrange their lives as they see fit, provided they agree on the terms.

  **The View of Parenthood**
  Parenthood is defined by *intent*. If you intended to create the child, provided the genetic material (or paid for it), and intend to raise the child, you are the parent. The physical act of pregnancy is viewed as a biological process that can be separated from the social role of motherhood. The law assumes you can carry a child without becoming its mother, just as you can build a house without living in it.

  **The View of the Body**
  The body belongs to the individual. If a woman has the right to terminate a pregnancy, she must also have the right to continue one for a specific purpose she has chosen. Her labor and risk are hers to price. If she can sell her time to dig a ditch or code software, she can sell her time to grow a fetus. To forbid this is to treat women as incapable of making serious contracts, which this system views as paternalistic.

  **The View of the Child**
  The child is best served by certainty. This system hates legal limbo. It wants the birth certificate to match the reality of who is taking the baby home. By enforcing the contract, the law ensures the child goes immediately to the parents who planned for them, avoiding the foster system or custody battles.

  **The Asymmetries (Birth Certificates and Pre-Birth Orders)**
  *   **Pre-Birth Orders:** In California, a judge can sign a paper *before* the baby is born declaring the intended parents as the legal parents. This flows from the idea that the pregnancy is a service being performed for a client. The surrogate is a provider; the intended parents are the recipients.
  *   **Adoption vs. Surrogacy:** Here, adoption is seen as the messy backup plan. Surrogacy is the clean, professional route. Adoption implies the first plan failed; surrogacy implies the first plan succeeded.

  ### 3. The Strange Bedfellows (Who Agrees on What?)

  You asked if different thinkers would endorse the same ban. Yes. This is why the law feels underdetermined. The rules stay the same, but the reasons people give for them are incompatible.

  **On the European Ban:**
  *   **The Religious Conservative:** Bans surrogacy because it separates sex, marriage, and procreation. It breaks the natural order of the family.
  *   **The Feminist Critic:** Bans surrogacy because it exploits poor women for the benefit of the rich. It turns women's bodies into factories.
  *   **The Dignity Purist:** Bans surrogacy because you cannot put a price on human life without degrading humanity.
  *   **Do they agree?** They all vote "Ban." But if you asked them why, they would argue. The Conservative wants to protect the family structure; the Feminist wants to protect the woman from the market; the Purist wants to protect the concept of human worth. The law doesn't choose between them; it just uses their combined weight to hold up the wall.

  **On the Californian Permission:**
  *   **The Libertarian:** Allows it because adults should be free to contract.
  *   **The Pragmatist:** Allows it because infertile people need a solution, and banning it just drives it underground.
  *   **The Child Advocate:** Allows it because it gives the child clear legal parents from day one.
  *   **Do they agree?** They all vote "Permit." But the Libertarian doesn't care if the woman is exploited, provided she signed the paper. The Pragmatist worries about the exploitation but thinks regulation is better than prohibition. The Child Advocate doesn't care about the contract so much as the birth certificate.

  **Is the ban doing theoretical work?**
  Sometimes, no. Sometimes a law is just a ceasefire between groups that want different things. But in the European case, the ban *does* work to maintain a specific fiction: that motherhood cannot be bought. In the Californian case, the permission *does* work to maintain a specific fiction: that a contract can perfectly predict human emotion.

  ### 4. Changing the Rules (What Actually Breaks)

  If you want your characters to understand the stakes, they need to know that you cannot just change the rhetoric; you have to break the machinery.

  **If Europe switched to the American view:**
  It is not enough to say "contracts are okay." You would have to change the birth certificate. Currently, the birth mother's name goes on the certificate automatically. To switch regimes, the state would have to refuse to name the birth mother as the parent *at all*. The hospital would have to hand the baby to the intended parents without the surrogate ever having legal custody. You would have to treat the pregnancy as a medical procedure performed on one person for the benefit of another, legally erasing the gestational link.

  **If California switched to the European view:**
  It is not enough to say "surrogacy is void." You would have to force the intended parents to adopt their own genetic child. The woman who gave birth would have the right to keep the baby, even if she is not the genetic mother. The contract would be worthless scrap paper. If she changed her mind at seven months, the intended parents would have no standing to object. The state would have to intervene to say, "The woman in the delivery room is the mother, regardless of what the paperwork says."

  ### 5. For Your Characters

  When your characters argue, keep the language grounded in the physical and the financial.

  *   **The European Character** should talk about lines that shouldn't be crossed. "You can't put a price tag on a baby." "She carried the life; how can you say it isn't hers?" "It's not a job, it's a relationship." They should feel that the American system is cold, treating the womb like a rented apartment.
  *   **The American Character** should talk about fairness and clarity. "She knew what she was signing." "Why should the genetic parents lose their child because of a technicality?" "She is doing hard work; why shouldn't she be paid?" They should feel that the European system is chaotic, leaving the child in limbo and insulting the woman's ability to make a choice.

  The tension in your book comes from the fact that both sides are trying to protect the vulnerable (the child and the woman), but they have opposite ideas about what constitutes protection. One thinks protection means *shielding from the market*. The other thinks protection means *enforcing the agreement*.

  The European system accepts hypocrisy (banning the act but recognizing the child) to avoid commodification. The American system accepts risk (the potential for coercion) to ensure certainty. Your plot turns on which of these risks your characters are willing to live with.
