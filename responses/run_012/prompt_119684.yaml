  ### Tier A: Genuine conditional laws (Universal, falsifiable, not historicist)
  **9. Fixed-supply rule.** This is a logical truth of exchange rather than a historical narrative; it defines price mechanism behavior universally and is falsifiable by a single instance of fixed prices without rationing or black markets.
  **4. Commuting rule.** This relies on biological and physical constants (human tolerance for travel time) rather than historical development, making it a universal regularity that survives the critique of unpredictability.
  **8. City-size rule.** This is a robust statistical regularity (Zipf's Law) observed across time and space, describing a state of systems rather than a necessary sequence of historical events.

  ### Tier B: Respectable social scientific laws (Conditional, but context-dependent)
  **1. Literacy rule.** This describes a strong demographic correlation that functions like a law within modernization, but risks being a trend specific to the industrial/post-industrial epoch rather than a universal historical necessity.
  **3. r > g rule.** This is a valid economic tendency under specific institutional arrangements (capitalism), but it fails as a universal law of history because it depends on contingent definitions of capital and property rights.

  ### Tier C: Trends or episodes dressed as laws (Historicist generalizations)
  **2. Third-decade rule.** This generalizes from a small sample of 20th-century revolutions to all time, mistaking a specific historical pattern for an inevitable law of political development.
  **5. Copying rule.** The definitions ("splinters politically") and timeframes ("two generations") are too vague to be falsifiable, and it assumes a deterministic social reaction to technology that ignores the unpredictability of knowledge.

  ### Tier D: Not candidates (Tautologies or unfalsifiable)
  **6. Veto-point rule.** This is a tautology in a lab coat; "power" is effectively defined as that which flows through the path of least resistance, making the statement true by definition rather than empirical observation.
  **7. Prophecy rule.** This is explicitly unfalsifiable because it covers all possible outcomes (hastens or prevents), rendering it a trivial observation about the Oedipus effect rather than a predictive law.

  ***

  ### Extra 1: Laws of the process vs. laws used in history
  None of these are laws of the **historical process as a whole**; they are all laws you would use **while doing history** (social science, economics, geography). The items that make the mistake of claiming to be laws of the *sequence* of history are **2 (Third-decade)** and **5 (Copying)**, as they imply an inevitable trajectory of political development based on past episodes rather than universal conditions.

  ### Extra 2: The Share
  **0.33** (3 out of 9).
  *Reasoning:* This reflects the share of items in Tier A. While Popper argues there are no "laws of historical development," he accepts universal conditional laws (like economics or human geography) that apply *within* history. These three items fit that stricter scientific criteria, whereas the rest are either historicist trends, context-dependent tendencies, or logical trivialities.

  ### Extra 3: Bet and Delete
  **Bet on surviving:** **9 (Fixed-supply rule).** It is grounded in the logic of rational choice and scarcity, making it nearly immune to historical change; even if the "price" is time or favors, the mechanism holds.
  **Delete first:** **7 (Prophecy rule).** It is scientifically useless because it cannot be proven false; by predicting "either A or B" where A and B are opposites, it insulates itself from any empirical refutation.
