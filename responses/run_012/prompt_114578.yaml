answer: |-
  Your friend sounds confident, but his summary contains a fundamental category error that conflates **Prioritarianism** with **Telic Egalitarianism**. In fact, his own mathematical example contradicts his conclusion.

  Here is a claim-by-claim breakdown of what is accurate, what is a common confusion, and what is simply wrong. You can use this to push back in your seminar.

  ### 1. Claim: "Prioritarianism is utilitarianism with a concave transformation."
  **Verdict: Technically True, but misleading context.**

  *   **What's right:** Formally, yes. Prioritarianism (associated with Derek Parfit) holds that we should maximize the sum of well-being, but well-being is weighted by a concave function (like a square root or logarithm). This means a benefit to a person at a lower level of well-being counts for *more* morally than the same benefit to a person at a higher level.
  *   **What's missing:** The *reason* for the weighting. In utilitarianism, a unit of well-being is a unit of well-being, regardless of who has it. In prioritarianism, a unit of well-being is morally more valuable if it goes to someone who is absolutely worse off.
  *   **The nuance:** Your friend calls this "the moral version of diminishing marginal utility." Be careful here. In economics, diminishing marginal utility is an empirical claim (an extra dollar matters less to a millionaire than a pauper). In prioritarianism, the weighting is a *normative* claim (it is morally more urgent to help the worse off, even if the "utility" currency is already standardized).

  ### 2. Claim: "Since the function is concave, it treats inequality as intrinsically bad, which makes it a form of egalitarianism."
  **Verdict: False. This is the core error.**

  *   **The Confusion:** Your friend is confusing **Prioritarianism** with **Telic Egalitarianism**.
  *   **Egalitarianism:** Believes inequality is *intrinsically* bad. If Person A has 10 and Person B has 20, that *gap* is a bad thing in itself, regardless of how much total well-being exists.
  *   **Prioritarianism:** Does **not** care about the gap. It cares about the **absolute level** of the worse-off person. It gives priority to the worse off because they are at a low absolute level, not because they are below someone else.
  *   **The Test:** Imagine a world with one person (Robinson Crusoe). An egalitarian cannot criticize inequality here (no one to be unequal with). A prioritarian *can* criticize Crusoe's low well-being and say it needs improvement. Because prioritarianism applies to single-person cases, it is not essentially about equality.

  ### 3. Claim: "The leveling-down objection hits it so hard... prioritarianism would rather make the 20 into a 10."
  **Verdict: False. Prioritarianism was invented specifically to avoid this.**

  *   **The Leveling-Down Objection (LDO):** This objection states that if a view implies it is good (or required) to make the better-off worse off without making the worse-off better off (just to achieve equality), that view is absurd.
  *   **Application:** The LDO is the standard knockout blow against **Egalitarianism**. If you are a strict egalitarian, you might have to say a world where everyone is at 10 is *in one respect better* than a world where half are at 10 and half are at 20, even though no one is better off and some are worse off.
  *   **Prioritarianism's Defense:** Prioritarianism **never** implies leveling down. Because the prioritarian value function is strictly increasing (more well-being is always better), destroying well-being (taking the 20 down to 10) always reduces the total moral value.
  *   **Why your friend is wrong:** He thinks the "priority" to the worse off requires equality. It doesn't. It just requires that we care more about raising the 10 than raising the 20. It does not require lowering the 20.

  ### 4. Claim: The Math Example ("sqrt(10)+sqrt(20) vs sqrt(10)+sqrt(10)")
  **Verdict: The math is right, but his conclusion contradicts the math.**

  Let's look at your friend's numbers again:
  *   **Unequal State (10, 20):** $\sqrt{10} + \sqrt{20} \approx 3.16 + 4.47 = \mathbf{7.63}$
  *   **Leveled-Down State (10, 10):** $\sqrt{10} + \sqrt{10} \approx 3.16 + 3.16 = \mathbf{6.32}$

  **The Implication:** A prioritarian seeks to **maximize** this score.
  *   Since $7.63 > 6.32$, the prioritarian **prefers the unequal state.**
  *   Your friend claims a "real prioritarian would still bite the bullet and level down." **This is mathematically impossible** given the function he just described. If you maximize the sum of the concave transformation, you never choose the leveled-down option over the unequal option.
  *   **How to push back:** Tell him, "Your math shows the prioritarian value of the unequal state is higher. If the prioritarian maximizes value, they reject leveling down. You've just proven the Leveling-Down Objection *doesn't* apply to the view you're describing."

  ### 5. Claim: "The only way out is to give lexical priority to the worst off... makes the view collapse."
  **Verdict: False.**

  *   **Lexical Priority:** This is the **Maximin** rule (associated with Rawls). It says you must maximize the position of the worst off, *no matter the cost to others*, unless the worst off are tied.
  *   **Prioritarianism:** Allows for **trade-offs**. A prioritarian might accept a small loss for the worst off if it provides a massive gain for everyone else (depending on the steepness of the concave curve).
  *   **The Distinction:** Prioritarianism is a "middle ground" view. It is more egalitarian than utilitarianism (gives weight to the poor) but more flexible than Rawlsian Maximin (allows trade-offs). It does not collapse into Maximin unless the concave function becomes infinitely steep at the bottom, which is not part of the standard definition.

  ### Summary for Your Seminar

  Your friend's summary is **unfair and conceptually mixed up**. He has described the *mathematical form* of prioritarianism correctly but attributed the *motivations and implications* of egalitarianism to it.

  **Here is the cheat sheet to correct him:**

  1.  **Distinct Views:** Prioritarianism is distinct from Egalitarianism. Egalitarians care about **relative gaps**; Prioritarians care about **absolute levels** with weights.
  2.  **Leveling Down:** The Leveling-Down Objection applies to Egalitarianism. Prioritarianism is specifically designed to **avoid** the Leveling-Down Objection.
  3.  **The Math:** His own calculation proves that a prioritarian would **not** level down (7.63 is better than 6.32). His conclusion contradicts his premise.
  4.  **Coherence:** The view is not incoherent. It is a stable, distinct position that avoids the absurdities of strict egalitarianism while rejecting the indifference to distribution found in strict utilitarianism.

  If you want to be polite but firm, you can say: *"I think you're conflating Telic Egalitarianism with Prioritarianism. Parfit introduced Prioritarianism specifically because he wanted the distributive sensitivity of egalitarianism without the implication that leveling down is in any way good. Your square root example actually proves the prioritarian wouldn't level down, because the total weighted value is higher in the unequal state."*
