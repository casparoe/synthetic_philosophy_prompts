prompt: |-
  My housemate is a corporate lawyer and she keeps insisting that a company really is a person -- not a legal fiction she has to put up with, but literally a thing that has beliefs, wants things, makes plans, and acts. I said come on, it's just people in a building, and she said that's like saying you're just cells in a bag; at the level of the organisation you get a genuine agent with its own knowledge (the files, the procedures, the stuff no single employee knows), its own goals (the strategy doc), and its own intentions (the five-year plan), and that's exactly why it makes sense to hold the company responsible and not just whichever employees happened to sign the forms. I want you to audit this analogy properly: group agent is to individual agent as... what, exactly? Give me the correspondence table first -- what plays the role of belief, desire, intention, memory, deliberation, the body, and the self that has all of it -- then tell me where the mapping breaks. And be careful to seperate the breaks that actually matter for her conclusion (the company is a real agent and can be blamed as one) from the ones that are just surface disanalogies. Two things I specifically want: which features of real individual agents does the analogy quietly smuggle in that a group might not have (one point of view? a single consistent preference, or even the possibility of one? someone who can actually feel the blame?), and does the responsibility conclusion survive if the analogy is only partial -- or does blaming the group end up letting the humans off the hook? If theres a better analogy that keeps the agency without pretending there's a single mind in there, tell me what it is.
