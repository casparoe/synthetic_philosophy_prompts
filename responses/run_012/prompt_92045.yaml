answer: |-
  This is a classic debate in social ontology and legal philosophy. Your housemate is arguing for **Group Agency Realism** (championed by philosophers like Philip Pettit and Christian List), while you are arguing for **Methodological Individualism** (the idea that only individuals act).

  Her "cells in a bag" analogy is powerful because it appeals to **emergence**: just as a mind emerges from neurons, corporate agency emerges from employees. However, emergence does not guarantee identity. Below is the audit of that analogy, separating functional similarities from metaphysical breaks.

  ### 1. The Correspondence Table
  Here is how the "Corporate Organism" maps onto the "Human Agent."

  | Feature | Individual Agent (Human) | Group Agent (Corporation) | Mechanism of Mapping |
  | :--- | :--- | :--- | :--- |
  | **Belief** | Neural states, convictions, perceptions. | Public records, databases, institutional knowledge, "common knowledge" within the firm. | Information storage and retrieval systems. |
  | **Desire** | Hunger, ambition, preferences, drives. | Mission statement, fiduciary duty, profit maximization, KPIs. | Incentive structures and charters. |
  | **Intention** | A plan to act formed in the mind. | Board resolutions, strategic plans, authorized signatories. | Formal decision-making protocols. |
  | **Memory** | Hippocampus, recall, muscle memory. | Archives, servers, Standard Operating Procedures (SOPs), culture. | Institutional continuity despite staff turnover. |
  | **Deliberation** | Internal reasoning, weighing pros/cons. | Meetings, voting, hierarchical approval chains, committees. | Aggregation of individual inputs into a single output. |
  | **Body** | Flesh, blood, motor functions. | Assets, property, brand, employees (as limbs/tools). | Physical capacity to interact with the world. |
  | **Self** | The conscious subject ("I"). | Legal personality (the "Corporate Veil"). | The named entity that holds rights and duties. |

  ---

  ### 2. Where the Mapping Breaks
  We need to distinguish between breaks that are merely superficial and breaks that undermine the claim that the company is a *literal* agent like a human.

  #### Surface Disanalogies (Do not undermine agency)
  *   **Biology:** Companies don't eat, sleep, or die naturally. (Irrelevant to agency; a robot could be an agent without biology).
  *   **Location:** A human is spatially continuous; a company is distributed. (Irrelevant; a human's nerves are distributed, and telecommuting makes companies more contiguous).
  *   **Lifespan:** Companies can live centuries; humans cannot. (Actually strengthens the idea of the company as a distinct entity from its current members).

  #### Structural Breaks (Undermine the "Real Person" claim)
  *   **Unity of Consciousness:** A human has a single, unified field of experience. If your left hand knows something, your right hand *can* know it. In a company, the "left hand" (Sales) often legally cannot know what the "right hand" (Legal) knows due to information silos or Chinese Walls. The "corporate mind" is often fragmented.
  *   **Phenomenology (Qualia):** A human *feels* belief and desire. A company has no internal state. It simulates belief through records, but there is no "light on inside."
  *   **Rationality Consistency:** Humans strive for logical consistency (usually). Groups are structurally prone to the **Discursive Dilemma**: A group can vote "Yes" on premise A, "Yes" on premise B, but "No" on conclusion C (which follows from A+B), simply due to majority voting rules. A human mind cannot hold that contradiction without cognitive dissonance; a company can do it indefinitely.

  ---

  ### 3. Smuggled Features: What the Analogy Assumes
  Your housemate's analogy quietly smuggles in three features of human agency that corporations fundamentally lack. These are critical for your objection.

  **1. A Single Point of View**
  *   **Human:** You experience the world from one vantage point.
  *   **Company:** A company has no vantage point. It has *many* vantage points aggregated via procedure. When a company "decides," it is often the result of power struggles, not a unified perspective.
  *   **Why it matters:** If there is no single viewpoint, there is no single "knower." This makes *mens rea* (guilty mind) legally difficult to locate without fiction.

  **2. Consistent Preference Ordering**
  *   **Human:** You generally prefer A to B and B to C, so you prefer A to C.
  *   **Company:** Because companies aggregate different people's preferences, they often have intransitive preferences (A > B > C > A) depending on which department is dominant that quarter.
  *   **Why it matters:** An agent with inconsistent preferences cannot truly be "rational," which complicates the idea that they are making "plans" in a meaningful sense.

  **3. The Capacity to Feel Blame (Moral Sentience)**
  *   **Human:** Punishment hurts. Shame modifies behavior through internal suffering.
  *   **Company:** A company cannot suffer. It can only be depleted of resources or structurally altered.
  *   **Why it matters:** This is the biggest break. "Responsibility" implies the capacity to bear a burden. A company passes the burden of fines to shareholders (who didn't do it), employees (via layoffs), or customers (via price hikes). The "entity" itself feels nothing.

  ---

  ### 4. Does the Responsibility Conclusion Survive?
  Your housemate argues: *Because the company is a real agent, we should hold the company responsible.*
  You worry: *Does this let the humans off the hook?*

  **The Verdict: The analogy supports corporate liability, but fails as a substitute for individual liability.**

  *   **Where she is right:** There is a **"Problem of Many Hands."** In complex organizations, harm is often the result of systemic culture, not one rogue employee. If you only blame the individual who signed the form, you ignore the incentive structure that forced their hand. Holding the *system* (the company) responsible is the only way to fix the *system*.
  *   **Where she is wrong (The Danger):** If you treat the company as a *literal* person, you risk **moral shielding**. If the Company is the Agent, then the employees are merely its *limbs*. We do not blame a hand for stabbing; we blame the person. If the Company is the Person, the employees become innocent tools.
  *   **The Fix:** Responsibility must be **dual**. The company is responsible for the *culture/structure* (like holding a dog owner responsible for the dog's training), and individuals are responsible for their *actions within that structure*. The analogy breaks if it implies the company's responsibility *exhausts* the moral debt.

  ---

  ### 5. A Better Analogy: The Algorithm
  The "Cells in a Bag" (Organism) analogy is too strong because it implies biological unity and consciousness. A better analogy that preserves **Agency** without pretending there is a **Single Mind** is:

  **The Corporation is an Algorithm.**

  *   **Belief:** Input data.
  *   **Desire:** Objective function (e.g., maximize profit).
  *   **Deliberation:** Processing logic/code.
  *   **Action:** Output execution.
  *   **Agency:** It acts autonomously based on its programming and inputs.
  *   **The Break:** No one claims an algorithm has a soul, feels pain, or has a unified consciousness. Yet, we acknowledge it can cause harm, have bias, and pursue goals.

  **Why this works better for your debate:**
  1.  **It grants her point:** Yes, the company is an agent. It processes info and acts on goals distinct from any single line of code (employee).
  2.  **It keeps your point:** No, it is not a "person." It is a tool created by people.
  3.  **It solves Responsibility:** When an algorithm causes harm, we blame the **Programmers** (the executives/board who wrote the rules) and the **Operators** (the employees who deployed it), while acknowledging the **System** itself needs patching (fines/restructuring).

  **Summary for your housemate:**
  Tell her you accept **Functional Agency** (the company acts like an agent) but reject **Phenomenal Personhood** (the company is a being like us). The Algorithm analogy gives her the legal leverage she needs (the system is responsible for its output) without requiring the metaphysical fiction that the system has a "mind" to lose.
