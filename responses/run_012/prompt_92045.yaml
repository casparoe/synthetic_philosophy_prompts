  2.  **Deconstruct the Housemate's Argument (Philosophical Background):**
      *   This is a classic debate in social ontology and legal philosophy.
      *   *Realism vs. Fictionalism:* Is the corporation a real entity (Realism) or just a shorthand for a nexus of contracts/people (Fictionalism/Nominalism)?
      *   *Group Agency:* Philosophers like Philip Pettit, Christian List, and Margaret Gilbert argue for "group agency." They claim groups can satisfy conditions for agency (representation, motivation, deliberation) distinct from individual members.
      *   *The "Cells in a Bag" Analogy:* This is a standard defense of emergent properties. A brain is just neurons, but the mind is real. Is a corporation like a mind?

