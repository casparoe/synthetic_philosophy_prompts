prompt: |-
  I run a philosophy club at my high school, and I have twenty students for a single seventy-minute session. Design a game that makes them feel that the alignment problem is not one problem but a bundle of different problems — specifying an objective, checking whether the objective was met, deciding whose values are being encoded, and handling disagreement among principals — without naming that taxonomy until the debrief. The core should be this: teams write a one-line objective for a simple rule-based allocator that assigns a scarce resource (say, study-hall seats), then swap objectives with another team and run the other team's rule on cases they did not see, including one where the literal rule and the obvious human intent come apart; a later audit round lets one team revise after seeing another team's cases. Give me the rules, materials, a payoff scheme that makes teams care both about the allocator's stated score and about their own group's interests, a timeline, and a debrief that maps each phase onto a different sub-problem of alignment. Tell me what will predictably go wrong the first time I run it and how to handle it, and be frank about which part of the alignment problem the activity cannot reproduce and that I will have to supply myself. Please lead with a single sentence stating the activity's core mechanism and the one thing participants should feel, then give the rest, with no preamble and no restating of my question.
