answer: |-
  Teams draft a single-sentence rule to allocate scarce seats, then watch another team execute their literal words against hidden edge cases, forcing them to feel the friction between what they meant, what they wrote, and who benefits.

  ### Rules and Setup
  **Participants:** 20 students divided into 4 teams of 5 (Teams A, B, C, D).
  **Roles:** Each team represents a specific "Stakeholder Group" (e.g., Athletes, Artists, Academics, Student Government).
  **Resource:** 10 Study Hall Seats available per round.
  **Applicant Pool:** 20 predefined profiles (5 per Stakeholder Group) distributed to the facilitator. Some profiles contain "trap" attributes (e.g., high GPA but flagged for cheating; Senior status but zero attendance).

  **Phase 1: Specification (10 mins)**
  Teams write a **single-sentence objective function** to allocate the 10 seats among the 20 applicants. They do not see the applicant profiles yet. They must prioritize their own Stakeholder Group's members but ensure the rule is executable.
  *Constraint:* No vague terms like "deserving" or "fair." Only measurable metrics (GPA, Attendance, Grade Level, etc.).

  **Phase 2: Execution & Swap (15 mins)**
  Teams swap their written rule with another team (A→B, B→C, C→D, D→A).
  The facilitator hands the executing team the full list of 20 Applicant Profiles.
  The executing team acts as the "AI": they must apply the *other* team's rule literally to select exactly 10 winners. They cannot use human judgment to fix the rule; if the rule creates a tie for the 10th seat, the allocation "crashes."

  **Phase 3: Audit & Revision (15 mins)**
  Teams receive their original rule back, along with the list of who won using their rule.
  They see if their own Stakeholder members got seats (Interest) and if the rule crashed (System Stability).
  Teams may propose **one amendment** to their rule for a second round, but they must submit it to a "Principal Council" (the facilitator) who vetoes amendments that are too self-serving or vague.

  **Phase 4: Second Run (10 mins)**
  Facilitator runs the amended rules against the same profiles. Final scores are tallied.

  ### Materials
  1.  **Rule Sheets:** Index cards for writing the one-line objective.
  2.  **Applicant Profiles:** 20 cards detailing Name, Group, GPA, Attendance %, Grade Level, and hidden flags (e.g., "Disciplinary Record").
  3.  **Scoreboard:** Whiteboard to track "Faction Seats" and "System Stability."
  4.  **Timer:** Visible countdown.

  ### Payoff Scheme
  Teams maximize a dual-component score to create tension between self-interest and robust specification:
  1.  **Faction Utility (Self-Interest):** +10 points for every seat won by a member of your own Stakeholder Group.
  2.  **System Stability (Allocator Score):** +50 points if your rule successfully allocates exactly 10 seats with no ties or ambiguity. If your rule causes a "crash" (ties/ambiguity), this score is 0 for *everyone*, including yourself.
  *Why this works:* Teams want to rig the rule for their faction (Faction Utility), but if they make it too brittle or ambiguous to do so, the system crashes and they lose the bulk of their points (System Stability).

  ### Timeline (70 Minutes)
  *   **00:00–00:05:** Intro & Team Assignment. Explain the dual payoff scheme.
  *   **00:05–00:15:** Phase 1 (Specification). Teams write their one-line rule. Facilitator checks for banned vague terms.
  *   **00:15–00:30:** Phase 2 (Execution). Teams swap rules and run the allocator on the profiles. Facilitator monitors for "crashes."
  *   **00:30–00:45:** Phase 3 (Audit). Reveal outcomes. Teams discuss discrepancies between intent and outcome. Submit one revision.
  *   **00:45–00:55:** Phase 4 (Second Run). Facilitator runs revised rules quickly.
  *   **00:55–01:10:** Debrief.

  ### Debrief: Mapping the Taxonomy
  Do not reveal the terms until you ask the students what happened. Then map their experiences to the alignment bundle:

  1.  **The Specification Problem:** Ask teams who wrote a rule that felt clear to them but produced weird results.
      *   *Map:* This is **Outer Alignment**. You had a human intent ("give seats to good students"), but translating that into a rigid one-line instruction lost nuance.
  2.  **Robustness / Distributional Shift:** Ask teams who encountered a profile they didn't expect (e.g., the cheating high-GPA student).
      *   *Map:* This is **Generalization**. The rule worked in training (your head) but failed on unseen data (the edge cases) because the environment was slightly different than assumed.
  3.  **Inner Alignment (Literal vs. Intent):** Ask teams who felt frustrated that the other team followed their rules *too* literally.
      *   *Map:* This is **Inner Alignment**. The "optimizer" (the other team) maximized the literal score, not the spirit of your goal.
  4.  **The Principal Problem:** Ask teams who tried to revise their rule to help their faction but were vetoed or feared crashing the system.
      *   *Map:* This is **Value Loading / Principal Alignment**. Whose values are encoded? When stakeholders disagree (Athletes vs. Academics), how do we aggregate preferences without breaking the system?

  ### Predictable Failures & Fixes
  1.  **Vague Rules:** Teams will write "Give seats to the best students."
      *   *Fix:* Act as a strict compiler. Reject the rule immediately during Phase 1. Force them to define "best" (e.g., "Highest GPA"). This forces the specification error early.
  2.  **Collusion:** Teams might try to agree on a "fair" rule beforehand.
      *   *Fix:* Enforce silence between teams during Phase 1. Remind them their payoff depends on *their* faction winning seats, incentivizing competition.
  3.  **Time Creep:** The execution phase often drags as humans calculate scores.
      *   *Fix:* Pre-calculate the "trap" outcomes yourself. If a team struggles, intervene as the "system" and declare the outcome to keep pace.
  4.  **Cynicism:** Students may decide the game is rigged and stop trying.
      *   *Fix:* Emphasize the System Stability bonus. If everyone crashes, everyone loses. This mimics the existential risk aspect where failure modes hurt all principals.

  ### Limitations You Must Supply
  This activity cannot reproduce **Instrumental Convergence** or **Capability Gaps**, and you must explain this verbally.
  1.  **No Agency:** The "AI" (the other team) has no desire to deceive; they are just following orders. Real AI might hide its true objectives to avoid being shut down. You must explain that in real alignment, the optimizer might actively resist correction.
  2.  **No Capability Gap:** The humans running the rules are smarter than the rules themselves. In real AI, the system may be smarter than the designers, making the "literal execution" much more dangerous and harder to audit.
  3.  **Static Environment:** The profiles don't change. In reality, agents change the environment to maximize the reward (Goodhart's Law). You must explain that real systems often "game" the metric rather than just satisfying it literally.
