answer: |-
  This is not a stupid question. In fact, you have inadvertently stumbled onto the central problem of modern moral philosophy. You aren't arguing about promises; you are arguing about the **grounds of normativity**—which is a fancy way of asking, "Where do reasons to act come from?"

  Your intuition is correct: your friends are not disagreeing about the facts. They are disagreeing about the architecture of morality itself. They are speaking four different ethical languages while using the same English words.

  Here is the diagnosis of the disagreement, an analysis of your edge cases, and an honest verdict on whether you should bring this up at dinner again.

  ### 1. The Diagnosis: Four Frameworks, One Word
  You asked if this is a verbal disagreement, a factual fight, or bedrock intuition. It is **bedrock intuition masquerading as a verbal disagreement.**

  Each friend is operating from a different foundational ethical framework. They aren't arguing about *what* a promise is; they are arguing about *what makes an obligation real.*

  *   **Friend 1 (Social Practice):** This is the **Institutional/Contractarian** view (closest to John Rawls). They believe obligations are created by rules we collectively agree to play by. Without the game, there are no moves.
  *   **Friend 2 (Reliance):** This is the **Harm/Expectation** view (closest to T.M. Scanlon). They believe morality is about how our actions affect others' ability to navigate the world. The wrong is the injury to the other person's planning.
  *   **Friend 3 (Authority/Will):** This is the **Voluntarist/Deontological** view (closest to Kant or H.L.A. Hart). They believe morality is about autonomy. By promising, you exercise a sovereign power to bind your future self. The wrong is a contradiction of your own will.
  *   **Friend 4 (Consequences):** This is the **Utilitarian** view (closest to Mill). They believe morality is a calculus of well-being. The promise itself is magic-less; only the outcome matters.

  **The Verdict:** This is not a factual fight. You cannot run an experiment to see who is right. It is a clash of axioms. Friend 4 thinks Friend 3 is being mystical about "will." Friend 3 thinks Friend 4 is missing the point of human dignity. They will never agree because they start from different first principles.

  ### 2. Stress-Testing the Positions
  Your edge cases are excellent because they act as "stress tests" that break specific frameworks. Here is how your cases diagnose the limits of each friend's view:

  **The Deathbed Promise (Secret, No Reliance)**
  *   **Friend 1 (Practice):** *Struggles.* If no one knows, are you participating in the social practice? If the practice requires public recognition, this promise is void. If the practice is internalized, it holds.
  *   **Friend 2 (Reliance):** *Fails.* The grandfather is dead; he cannot rely. No one else knows, so no one else relies. On this view, you are free to ignore it.
  *   **Friend 3 (Will):** *Wins.* You bound yourself to his will. The obligation exists because you exercised your authority to create it, regardless of an audience.
  *   **Friend 4 (Consequences):** *Fails.* If it's truly secret, breaking it erodes no general trust and hurts no one. On this view, keeping it is irrational unless it makes *you* feel better.

  **The Lying Promise (Never Intended to Keep)**
  *   **Friend 1 (Practice):** *Wrong.* You invoked a rule you didn't intend to follow. You cheated at the game.
  *   **Friend 2 (Reliance):** *Wrong.* You manufactured reliance under false pretenses.
  *   **Friend 3 (Will):** *Wrong.* You pretended to transfer authority you withheld. It's a performative contradiction.
  *   **Friend 4 (Consequences):** *Wrong.* It risks eroding the institution of trust.
  *   *Note:* This is the one case where all four agree on the *verdict* (it's wrong), but for totally different *reasons*.

  **The Stranded Strangers (No Custom)**
  *   **Friend 1 (Practice):** *Fails.* No custom exists, so the words "I promise" are just noise.
  *   **Friend 2 & 3:** *Work.* Reliance and Will don't require pre-existing culture.
  *   **Friend 4:** *Works.* If it helps survival, it's good.

  **The Promise to Self**
  *   **Friend 1 & 2:** *Skeptical.* Promises usually require two parties (a promisee).
  *   **Friend 3:** *Strong Fit.* It is the purest form of binding your own will.
  *   **Friend 4:** *Instrumental.* Only matters if it helps you achieve goals.

  ### 3. Your Pet Theory
  You suggested the split is between "something you *do*" (internal power) vs. "something that *happens to you*" (external constraint).

  You are very close, but I would refine it. The split is between **Internalism vs. Externalism about Obligation.**
  *   **Internalism (Friend 3):** The obligation comes from *you*. You generate the reason to act by exercising your agency.
  *   **Externalism (Friends 1, 2, 4):** The obligation comes from *outside you*. It comes from Society (1), the Other Person's needs (2), or the State of the World (4).

  Your deathbed case is the smoking gun here. If you feel bound by the deathbed promise, you are an Internalist (Friend 3). If you feel unbound because "nothing happens if I don't," you are an Externalist (Friends 2 & 4).

  ### 4. Can This Be Moved?
  **Honest Answer:** No. Not at dinner. Not ever, really.

  This is a "bedrock" disagreement. In philosophy, when you dig down far enough, you hit a layer where people just say, "Well, that's just how I see it."
  *   Friend 4 will never accept that a secret deathbed promise binds you, because they cannot find the *harm*.
  *   Friend 3 will never accept that a promise is only about harm, because to them, that reduces human beings to containers of utility rather than agents of will.

  If you try to force a resolution, you will just be forcing them to attack each other's foundational worldviews. That's exhausting and rarely productive.

  ### 5. How to Unstick the Argument (Or Kill It)
  You have two options. One keeps the conversation alive productively; the other saves your sanity.

  **Option A: The Pluralist Pivot (Productive)**
  Stop asking "Which one is the *real* reason?" and start asking "Which tool fits which job?"
  Propose that promising is a **hybrid concept**.
  *   *Say this:* "What if we're all right, but for different contexts? Maybe the *origin* of the promise is Will (Friend 3), but the *weight* of the promise is measured by Reliance (Friend 2), and the *social cost* is Consequences (Friend 4)."
  *   This turns the argument from a war into a map. You aren't fighting over truth; you're fighting over which lens is most useful for the specific case at hand.

  **Option B: The Functional Dissolution (Sanity-Saving)**
  Change the question from "What makes it binding?" to "What do we want promising to *do* for us?"
  *   *Say this:* "I think we're arguing about metaphysics when we should be arguing about design. What kind of world do we want to live in? One where secret deathbed promises matter? Or one where only measurable harm matters?"
  *   This exposes that their disagreement isn't about promises; it's about the kind of people they want to be. Friend 3 wants to be a person of Honor. Friend 4 wants to be a person of Utility. You can respect both without agreeing.

  ### Final Advice
  **Stop trying to win.** You won't.

  Your friends are describing different dimensions of the same object. A promise *is* a social practice, it *does* create reliance, it *is* an exercise of will, and it *has* consequences. The mistake they are making is thinking one dimension excludes the others.

  Next time it comes up, don't offer an answer. Offer a diagnosis. Say: *"I think you're arguing about whether morality comes from inside us or outside us. The promise is just the battlefield."*

  If they can't handle that level of abstraction, **let it go.** Some arguments aren't puzzles to be solved; they are just personality tests in disguise. Know which one your friends are taking, and order the next round of drinks.
