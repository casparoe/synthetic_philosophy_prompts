prompt: |-
  I'm a backend engineer by trade (distributed systems, telemetry pipelines) and I have zero formal training in philosophy. My friend teaches an upper level undergrad seminar on technology and society and she's asked me to write one exam question for her final from the practitioner side, since half the readings are about technical standards and she figures I'll know the material better than she does. So I'm outsourcing the hard part to you.

  You're a philosopher of science / STS person who's also comfortable with engineering detail. Don't start writing yet — first brainstorm: what are the distinct things people mean when they claim history "locked in" an outcome, which of those does my case below actually support, and which of them does it leave open? Then draft.

  Constraints for the question itself: closed book, 45 minutes, essay answer, worth 20 marks. It has to be unanswerable by reciting the QWERTY story, so I've invented a case the students have definately never seen. Treat the details below as the whole of the evidence — don't invent extra facts about it, and don't go looking for the companies, they're made up.

  THE CASE. Meridian is an open telemetry protocol first released in 2011 by a small shop. Its v1 wire format encodes every timestamp as a local wall-clock reading plus an index into a fixed table of 48 timezone offsets. That design wasn't reasoned out: the original author needed his box to talk to a 1970s industrial bus whose clock only ever reported local time, and the offset table was the fastest way to bolt the two together over a weekend. Over the next decade Meridian got adopted well beyond that shop. It's now the default way sensors, log shippers and dashboards talk to each other, and the ecosystem includes roughly 400 third-party client libraries, most of which reimplemented the offset table rather than parsing it. Two real problems eventually showed up: the table is wrong for dates before 1970 and after 2038, and DST rule changes break it silently; and because two readings from different regions can share an offset index, sub-second correlation across regions is unreliable. A UTC-nanosecond field was proposed in 2019 and again in 2021, and both times the working group rejected it. Reason given both times: every stored log, every parser and every client library assumes the old layout; a compatibility shim exists but requires re-ingesting a petabyte-scale archive and re-certifying a bunch of safety-critical deployments. Meanwhile the offset table is now load-bearing in ways nobody predicted — three national regulators wrote it into their audit-format rules. Now the part I keep arguing about with my friend. In 2015 a completely separate team, who had never seen Meridian, shipped a rival framework called Northwind whose format encodes timestamps the same way: local time plus an offset table, with an almost identical 48-entry table. They did it for a documented reason — their target hardware had no battery-backed clock and the OS only exposed local time. So the same design, arrived at twice, by people who couldn't have copied each other. Her students keep saying either "aha, so it was inevitable and path dependence is a myth" or the opposite, "aha, classic lock-in", and I want the question to make them actually adjudicate that instead of picking a team.

  What I need from you:

  1. The exam question — a short setup plus the actual task. A few lettered parts is fine if that's how you'd structure it.
  2. A model answer, roughly 600-700 words.
  3. A marking scheme out of 20: the must-hit moves with the marks each is worth, and for each one a line on how a B-level answer usually botches it. I want the scheme to genuinely separate an A from a B, which means an A answer has to take a position on whether the Northwind convergence undercuts the lock-in story, not just say "both views have merit".

  Some things I care about, since I'm the one who'll have to defend this question to her:

  - No bibliography, no citations, no "see David 1985". The students can't look anything up and neither can you, so don't guess at sources. If a real example helps you explain a move, use it only if you're confident in it, and keep it out of the marking scheme.
  - The interesting crux, I think, is whether the Northwind convergence shows the Meridian layout was never really a choice at all, versus showing only that the space of workable designs was narrow at the time while the cost of leaving that design later was still history-dependent. Don't let the model answer blur those.
  - Force them to distinguish "history mattered" from "we're stuck with something worse" from "we were stuck at the time but arguably aren't now".
  - Include at least one part asking what evidence would actually settle it — what a real counterfactual test would look like here, given that we can't rerun 2011.
  - The marking scheme should name specific mistakes that should cost marks. E.g. treating a large switching cost as automatically proving the old choice was worse; treating independent convergence as decisive proof of inevitability; conflating "the same design" with "an equally good design"; treating the regulator involvement as evidence about the original choice rather than about exit costs.
  - Keep the exam question itself neutral. Don't tell the students what verdict to reach or hint at the answer in the wording.
