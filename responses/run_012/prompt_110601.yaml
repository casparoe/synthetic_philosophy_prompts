    "opening_script": "You have an envelope containing two piles of cards. Pile A is 'In'. Pile B is 'Out'. There is a single consistent rule that determines why a card is In rather than Out. It is not random. It is not about the card stock. It is about what is drawn on the card. Work with your partner to find the rule. Write it down clearly. Then, there are four additional cards labelled Test 1 to 4. Predict whether each is In or Out based on your rule. You have 20 minutes. Do not open the Test cards until you have written your rule.",
