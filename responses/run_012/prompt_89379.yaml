answer: |-
  ### (1) Exam Question

  **Question 5: Logical Uncertainty and Coherence (20 points)**

  Standard Bayesian epistemology requires that a rational agent's degrees of belief satisfy the probability axioms. A direct consequence of this is "logical omniscience": if a proposition $A$ logically implies $B$, then $P(A) \leq P(B)$, and if $T$ is a logical truth, $P(T) = 1$.

  (a) Explain why logical omniscience is considered a defect for modeling bounded rational agents (such as humans or machine learning systems) rather than an idealization. Specifically, why is it insufficient to simply say "the agent is uncertain because they haven't computed the proof yet"?

  (b) Suppose we attempt to fix this by allowing an agent to assign probabilities $P(T) < 1$ to logical truths $T$ that they have not yet derived. Explain why this creates a vulnerability regarding coherence (e.g., Dutch Book arguments).

  (c) Construct or describe a specific self-referential sentence that exploits a naive attempt to assign probabilities to logical claims. Show how an agent trying to be "reasonable" about this sentence can be forced into a contradiction or a sure loss.

  (d) Briefly state what condition a successful theory of logical uncertainty must satisfy to avoid this exploit without reverting to omniscience.

  *Note: Answers that simply recite the probability axioms or claim "logical truths must have probability 1" without addressing the tension between computation and coherence will receive minimal credit.*

  ***

  ### (2) Model Answer

  Standard Bayesianism treats logical implication identically to empirical implication. If $A \vdash B$, then $P(B|A)$ must be 1. Consequently, an agent must assign probability 1 to all tautologies and logical consequences of their beliefs, regardless of computational complexity. This is the problem of logical omniscience.

  For bounded agents, this is a defect, not merely an idealization, because it conflates computational limits with empirical uncertainty. A human or a neural network cannot instantly verify whether a large number is prime or whether a complex code snippet contains a bug. Their uncertainty is not about the world's state, but about the consequences of their own knowledge. If we insist $P(T)=1$ for all theorems, we cannot model learning in mathematics or program verification. Saying "the agent is uncertain because they haven't computed the proof" is insufficient because, within standard Bayesian kinematics, there is no formal space for that uncertainty. Once the logical relation exists, the probability constraint exists, regardless of the agent's access to it. The axioms demand coherence across all logical space, not just the subset the agent has explored.

  Attempting to fix this by assigning $P(T) < 1$ to unproven truths violates the probability axioms relative to logical implication. If an agent bets on $T$ at odds reflecting $P(T) < 1$, and $T$ is actually a theorem, a bookie who knows the proof can sell the agent a ticket that pays \$1 for sure, but costs the agent less than \$1. While the agent doesn't know they are losing yet, the loss is guaranteed by logic. This violates the standard definition of coherence, which forbids sure losses even if the loss is only recognizable via logical deduction.

  The situation worsens with self-reference. Consider a sentence $G$ constructed within the agent's language that essentially says: "The agent will not assign probability greater than 0.5 to this sentence." Formally, $G \iff P(G) \leq 0.5$.

  If the agent assigns $P(G) > 0.5$, then the content of $G$ is false (since the probability is not $\leq 0.5$). If the agent is accurate, $P(G)$ should drop to 0. If the agent assigns $P(G) \leq 0.5$, then $G$ is true. If the agent recognizes $G$ is true, they should assign $P(G) = 1$, which contradicts the condition $P(G) \leq 0.5$. A naive agent trying to set a probability is forced into a loop where any static assignment makes their belief false. A bookie can exploit this by offering bets contingent on the agent's own probability assignment, forcing a Dutch Book where the agent loses money regardless of the truth value, because their belief state determines the truth value.

  To avoid this without reverting to omniscience, a successful theory must relax the requirement of immediate coherence. Instead of requiring $P(T)=1$ at all finite times, it should require that beliefs converge to coherence asymptotically as computation time increases. This is the core insight of frameworks like Logical Induction. The agent must satisfy a "reflection principle" where it trusts its future, more computationally powerful self, without requiring current certainty. The condition is not that the agent is always coherent, but that no efficient algorithm can find a specific pattern of exploitation in the agent's beliefs over time.

  ***

  ### (3) Marking Scheme (Total: 20 Points)

  **Part (a): The Defect of Omniscience (5 points)**
  *   **A Answer (5 pts):** Explicitly distinguishes between empirical uncertainty and computational limits. Notes that standard axioms leave no formal room for "unread" logical consequences.
  *   **B Answer (3 pts):** States that humans can't compute everything but fails to explain why standard Bayesianism forbids modeling this.
  *   **Common Error:** "It's unrealistic because humans are stupid." (Too vague, misses the formal constraint).

  **Part (b): Coherence and Dutch Books (5 points)**
  *   **A Answer (5 pts):** Explains that violating $P(T)=1$ allows a bookie to construct a sure loss based on logical necessity, even if the agent doesn't see it yet.
  *   **B Answer (3 pts):** Says it violates axioms but doesn't explain the betting/consequence implication.
  *   **Common Error:** "It violates the sum rule." (Correct label, no explanation of mechanism).

  **Part (c): The Self-Referential Gotcha (5 points)**
  *   **A Answer (5 pts):** Provides a concrete sentence linking truth to the agent's probability assignment (e.g., $G \iff P(G) \leq 0.5$) and shows the contradiction loop.
  *   **B Answer (3 pts):** Mentions Gödel sentences generally but fails to link them to probability assignments specifically.
  *   **Common Error:** "The liar paradox." (Too generic, doesn't involve the agent's belief state).

  **Part (d): Solution Criteria (5 points)**
  *   **A Answer (5 pts):** Identifies asymptotic coherence or reflection principles (trusting future self) as the necessary fix.
  *   **B Answer (3 pts):** Suggests "better computing power" or "approximating truth" without addressing the structural exploit.
  *   **Common Error:** "Just update faster." (Misses the structural impossibility of static coherence).

  **General Deductions:**
  *   **-2 pts:** British spelling (e.g., "behaviour", "formalized" vs "formalised").
  *   **-2 pts:** Exceeding word count significantly in model answer simulation (not applicable to student, but good for TA grading consistency).
  *   **-5 pts:** Answer claims logical truths *should* always have probability 1 (fails the prompt's premise).
