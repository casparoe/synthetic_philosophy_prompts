answer: |-
  **The Case**

  Consider a standard single-core microcontroller clocked at 1GHz, physically wired to execute a specific program that simulates a 100-node recurrent neural network (RNN) with synchronous updates. The computation in question is defined as "one synchronous update cycle of the 100-node RNN," where all nodes transition simultaneously based on their neighbors' prior states. The microcontroller's physical state sequence over 100 clock cycles is isomorphic to the RNN's state vector evolution over one cycle, with memory registers mapping to node activations and the arithmetic logic unit (ALU) operations mapping to activation functions. A reasonable observer identifies the device as a computer running a simulation.

  **Analysis**

  **Verdicts:** Under the **Mapping Account**, the system implements the computation. There exists a structure-preserving mapping between the microcontroller's physical state transitions (over 100 cycles) and the RNN's logical steps (one cycle), satisfying the isomorphism requirement. Under the **Mechanistic Account**, the system does *not* implement the computation. The RNN requires 100 causally distinct, simultaneously interacting components; the microcontroller possesses only one ALU processing nodes sequentially. The causal joints of the hardware (serial gates) do not track the causal joints of the computation (parallel nodes); the hardware simulates the function but does not instantiate the mechanism.

  **Separating Feature:** The feature is **Causal Topology vs. State Trajectory**. The Mapping Account requires only that the path through state space corresponds (trajectory), allowing time-multiplexing of distinct logical components onto a single physical component. The Mechanistic Account requires that the physical causal dependencies mirror the logical dependencies (topology). If this feature is removed (i.e., if the hardware were physically parallel with 100 distinct processing units), both accounts would agree the computation is implemented.

  **Brain Transfer:** This feature is **present** in the brain. The brain is massively parallel and analog; digital computers are typically serial and discrete. If the Mechanistic Account is correct, a serial digital simulation of a brain does not implement the brain's computation, even if input-output equivalent. Thus, the question "Is the brain a computer?" has no determinate answer: "Yes" under Mapping (functional equivalence), "No" under Mechanistic (causal mismatch). The transfer holds provided we accept the brain's parallelism is computationally relevant, not merely implementational detail.

  **Objection:** A defender of the Mapping Account may object that causal topology is irrelevant to computation, which is defined by abstract functional roles, not physical wiring. They might argue that as long as the counterfactual dependencies between inputs and outputs are preserved, the internal causal path is implementation-level detail. This can be met only by conceding that "computation" on the Mechanistic account refers to *physical* computation, whereas the Mapping account refers to *logical* computation, risking a verbal dispute.

  **Success Check:** I succeeded in constructing a case where the accounts diverge on a non-trivial system without shifting boundaries. However, the divergence relies on whether one views "causal topology" as constitutive of computation or merely contingent. If this distinction is merely terminological (i.e., "computation" vs. "physical computation"), the case collapses into a verbal dispute. Nevertheless, it demonstrates that without fixing the account, the claim "the brain is a computer" remains ambiguous between functional equivalence and mechanistic identity. The direction closed is Mechanistic=Yes / Mapping=No (since mechanism implies mapping); the open direction is Mapping=Yes / Mechanistic=No.
