  # Q&A Prep Sheet: Gödel, Time, and Global Slices

  **Context:** Joint Session (Physics Gravity Group, Kantians, Gödel Historian).
  **Thesis:** Gödel's universe demonstrates a lack of global time function/Cauchy surfaces (structural), not the unreality of time (ontological).
  **Goal:** Survive the ambush. Acknowledge soft spots.

  ---

  ### 1. The "Local Becoming" Objection (Highest Damage)
  **Who:** The Senior Relativist (Physics)
  **The Question:** "You're drawing a hard line between 'global foliation' and 'real time.' But in the Gödel metric, every observer still has a well-defined proper time along their worldline. They experience local causality; they have local light cones distinguishing past and future. If 'becoming' is just the unfolding of events along a causal curve, your distinction collapses. Why isn't local proper time sufficient for 'real time,' and if it is, hasn't Gödel's argument already failed regardless of the global topology?"

  **Your 2-Minute Reply:**
  "I grant that proper time is physically robust locally. My claim isn't that clocks stop running in Gödel's universe. It's that 'objective lapse'—the kind Gödel was targeting in the Schilpp volume—requires more than local ordering. It requires a coherent, global 'now' that separates the fixed past from the open future. In Gödel's universe, the CTCs (Closed Timelike Curves) mean that 'future' events can causally influence 'past' events on the same worldline. If I can fly a rocket to my own past, the local distinction between 'before' and 'after' loses its ontological bite. It becomes a coordinate label, not a metaphysical boundary. So, while local proper time exists, the *structure* required for a robust notion of passage—where the future is genuinely open and the past fixed—is destroyed globally. I'm arguing Gödel showed the *structure* fails, not that the *clocks* break."

  **⚠️ SOFT SPOT:** You are asserting that "real time" *requires* a global fixed/open split without proving it. The physicist will counter that local causality is all physics ever uses. If proper time is invariant, why is it not "real"? You are smuggling in a metaphysical requirement that physics doesn't need.

  ---

  ### 2. The "Definition of Reality" Objection (High Damage)
  **Who:** The Lead Kantian (Philosophy)
  **The Question:** "You seem to be assuming that for time to be 'real,' it must be a property of the world-in-itself, specifically requiring a global simultaneity structure. But isn't this just begging the question against Gödel? Gödel, reading Kant, might argue that time is indeed ideal precisely *because* it cannot be consistently objectified globally. By defining 'real time' as 'global time function,' aren't you just stipulating that time is unreal in Gödel's universe by definition, rather than discovering it?"

  **Your 2-Minute Reply:**
  "That's a fair challenge, but I'm not stipulating; I'm distinguishing categories. Gödel conflates the *measure* of time with the *passage* of time. My argument is that the failure of global hyperbolicity shows the *measure* cannot be extended universally. It doesn't force us to say the *experience* of passage is an illusion. Think of it like curvature: a curved surface doesn't mean 'distance' is unreal; it means Euclidean geometry doesn't apply globally. Similarly, Gödel's universe shows that Newtonian/Kantian global time doesn't apply. It shows the *model* of time we brought in was wrong for that manifold, not that temporality itself vanishes. I'm defending a deflationary reading: the math breaks the global clock, not the concept of becoming."

  **⚠️ SOFT SPOT:** This is your weakest philosophical ground. You are asserting a distinction between "measure" and "passage" that Gödel explicitly argued were inseparable. If the measure fails globally, Gödel claims the concept is incoherent. You haven't given an independent reason why "passage" can survive without "global measure" other than intuition.

  ---

  ### 3. The "Textual Accuracy" Objection (Medium Damage)
  **Who:** The Gödel Historian (Archives)
  **The Question:** "I've been working through the unpublished drafts from the late 40s. Gödel wasn't just worried about global slices. He was worried about the compatibility of relativity with *any* notion of change. In his letters to Carnap, he suggests that if the metric allows CTCs, the distinction between 'earlier' and 'later' is purely conventional, even locally. You're presenting him as a global-structuralist, but he was an ontological eliminativist. Aren't you attacking a version of the argument nobody holds?"

  **Your 2-Minute Reply:**
  "I appreciate the archival context, and I agree Gödel's personal ontology was robustly Platonic and eliminativist regarding becoming. However, I'm defending the *strength of the argument* derived from the metric, not necessarily Gödel's private correspondence. Even if Gödel *wanted* to prove time is an illusion, the metric itself only proves the absence of Cauchy surfaces. As philosophers of physics, we should separate the author's intent from the formal implications. The formal implication is structural: no global time function. The leap to 'time is unreal' is an extra premise about what time requires. I'm asking the room to evaluate that leap, not just Gödel's conclusion."

  **⚠️ SOFT SPOT:** The historian can produce a quote where Gödel explicitly links the local CTC possibility to the unreality of local change. If Gödel argued that *local* becoming is illusory because of *global* topology, your separation of the two looks like a charitable reconstruction that ignores the text.

  ---

  ### 4. The "Toy Model" Objection (Lower Damage)
  **Who:** The Graduate Student (Physics)
  **The Question:** "The Gödel metric isn't globally hyperbolic, sure. But it's also not expanding, it has no Big Bang, and it requires a cosmological constant that doesn't match observation. It's a toy model. Why are we drawing metaphysical conclusions about the nature of time from a solution that everyone agrees is not a live possibility for our universe?"

  **Your 2-Minute Reply:**
  "Because modal claims about time don't depend on actual cosmology. If time is a necessary feature of reality, it should be robust across possible worlds consistent with the laws of physics. General Relativity allows the Gödel metric. If the nature of time is tied to the structure of spacetime, and GR is our best theory of spacetime, then the *possibility* of this metric constrains the *concept* of time. We aren't claiming we live in a Gödel universe; we're claiming that if GR is true, this is a possible way for time to be. And if time can be that way, our definition of it needs to account for it."

  **⚠️ SOFT SPOT:** Physicists hate drawing metaphysical conclusions from non-physical solutions. They will argue that stability analysis rules this out, making it physically impossible, not just counterfactual. If it's physically impossible, it has no bearing on the nature of *physical* time.

  ---

  ### 5. The "Hope Nobody Asks" (Catastrophic Damage)
  **Who:** The Quiet Senior Philosopher (Kant/Modality)
  **The Question:** "Let's grant your distinction: Gödel proves no global time function, not that time is unreal. But why should we accept your premise that 'real time' requires a global structure in the first place? You've spent the talk showing Gödel didn't prove time is unreal. But you haven't given us a single reason to think real time *needs* what Gödel said it needs. If our universe has local proper time, and that's enough for causality and experience, why does the failure of global simultaneity in a *different* possible universe tell us anything about the reality of time in *ours*? Aren't you just fighting a ghost?"

  **Your 2-Minute Reply:**
  "That is the crux. My claim is that without a global structure, we lose the ability to define 'cosmic history' or a unified 'present.' In our universe, we assume these are coherent. Gödel shows they aren't necessary features of relativistic spacetimes. If they aren't necessary, then 'time' as we conceive it—a universal ordering of events—isn't a fundamental feature of the world, but a contingent feature of our specific cosmology. That *does* change the ontology. It makes time local and fragmentary, not universal. So the reality of time is downgraded from a fundamental structure to a local accident."

  **⚠️ SOFT SPOT:** This is the kill shot. You are admitting that "real time" is just a "contingent accident" of our universe. This concedes the main point: Time isn't a fundamental, necessary feature of reality. The questioner will smile and say, "Exactly. So Gödel was right that our *concept* of objective time is flawed." You haven't defended the reality of time; you've just redefined it to save the phenomena. You have no independent argument for why "global" is required for "real," other than tradition.
