      *   *Is it Substantive?* Yes, underlying the verbal confusion is a deep metaphysical divide. Is consciousness a fundamental property (binary switch) or an emergent functional capacity (dimmer switch)?
      *   *Is it Cross-Purpose (Metaphysical vs. Epistemic)?* This is the strongest diagnosis. The user's hunch is correct. Camp Two often argues from an epistemic uncertainty ("We don't know if the fly feels pain") which gets interpreted by Camp One as a metaphysical claim ("The fly feels *less* pain"). Conversely, Camp One argues from functional complexity ("The fly processes less information") which Camp Two interprets as a claim about the *presence* of experience rather than its *richness*.
      *   *The "Light Switch" vs. "Dimmer" Analogy:* This is a classic philosophical trope. Camp Two sees a light switch (On/Off). Camp One sees a dimmer (Bright/Dim). But often, Camp One is actually talking about the *wattage of the bulb* (complexity) while Camp Two is talking about *whether the circuit is closed* (existence).

  3.  **Address the Moral Status Question:**
      *   *Graded Sentience $\rightarrow$ Graded Moral Status?* Utilitarian views often say yes (more capacity to suffer = more weight).
