      *   *The "Club" Problem:* The user asks if moral status *has* to be all-or-nothing for equal consideration. This touches on the distinction between *moral patients* (who can be harmed) and *moral agents* (who are responsible), but also the threshold problem. If moral status is graded, does a human count for more than a dog? Most people find this intuitive regarding *some* rights (voting) but counterintuitive regarding *basic* rights (torture).
      *   *Is this a different disagreement?* Yes. The first is metaphysical/phenomenological. The second is normative/ethical. You can agree on the metaphysics and disagree on the ethics, or vice versa.

  4.  **Determine What Counts as Progress:**
      *   *Empirical Result?* Unlikely to solve the metaphysical bit. Neuroscience can show correlates, but not the "inner light."
      *   *Distinction?* Yes. Clarifying Epistemic Uncertainty vs. Metaphysical Gradience is the biggest win.
      *   *Change of Question?* Shifting from "Is it sentient?" to "What capacities does it have?" (The "Ethical Behaviorism" or "Capabilities Approach" shift).
