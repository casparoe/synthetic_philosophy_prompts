prompt: |-
  I chair the research-subjects committee at a neuroscience institute. Our policy runs on two tracks: animal protocols, which require analgesia, humane endpoints, and a harm–benefit review, and human-subjects protocols, which require consent and withdrawal rights. Cultured tissue has always fallen outside both. We register it as biological material and move on.

  Next week we review a protocol from a lab that cultures human stem-cell-derived neural tissue on a multi-electrode array and closes a feedback loop between the tissue and a simulated body, so that the culture learns to avoid a stimulus. The lab's position is that this is tissue in a dish rather than an animal, so neither track applies and no welfare conditions attach. One member objects that the only thing the animal track protects is the capacity to suffer, and that if mental states are multiply realizable then substrate cannot be what settles the question — so we either extend the track or concede we never meant it. Another replies that multiple realizability is a claim about mental-state types, not about which systems have them, and brings us no closer to whether this culture feels anything. A third warns that any criterion loose enough to catch the culture will also catch the calibration software driving the simulated body, and possibly the lab's own controller.

  Please draft the decision memo I will circulate before Thursday's meeting. It should give a clear recommendation with conditions rather than a survey of views; state a criterion the committee can apply to the next case and not merely this one; specify concrete protocol requirements — what, if anything, stands in for analgesia and humane endpoints here — along with a review date; give an honest account of the strongest argument on the side we reject; and rule on the calibration software and the simulation itself, saying whether our criterion reaches them and, if not, on what principled basis we exclude them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Research-Subjects Committee at a Neuroscience Institute.
      *   **Context:** Current policy has two tracks (Animal: analgesia, humane endpoints, harm-benefit; Human: consent, withdrawal). Cultured tissue is currently unregulated ("biological material").
      *   **The Case:** A lab proposes culturing human stem-cell-derived neural tissue on a multi-electrode array (MEA) with a closed feedback loop to a simulated body. The tissue "learns" to avoid stimuli.
      *   **The Conflict:** Lab says it's just tissue (no welfare). One member argues suffering capacity matters, not substrate (animal track should apply). Another argues multiple realizability doesn't prove *this* system has mental states. A third worries about slippery slopes (software/simulation sentience).
      *   **Task:** Draft a decision memo for circulation before Thursday's meeting.
      *   **Requirements:**
          1.  Clear recommendation with conditions (not just a survey).
          2.  State a generalizable criterion for future cases.
          3.  Specify concrete protocol requirements (analogs for analgesia/humane endpoints).
          4.  Set a review date.
          5.  Honestly account for the strongest argument on the rejected side.
          6.  Rule on the calibration software and simulation (do they fall under the criterion? If not, why?).

  2.  **Determine the Stance/Decision:**
      *   *Option A: Status Quo (Tissue).* Too risky given the "learning" and "closed loop" aspect. Ignores the ethical concern about potential sentience/nociception.
      *   *Option B: Full Animal Track.* Too burdensome? "Analgesia" for a dish is conceptually tricky. Might stifle research unnecessarily if sentience is low probability.
      *   *Option C: Hybrid/Intermediate Track (Recommended).* This acknowledges the uncertainty without equating it fully to a mouse or a human. It creates a "Neural Organoid/Synthetic Tissue" category.
      *   *Decision:* We need to treat this as *more* than simple tissue but *less* than a whole animal, acknowledging the potential for nociception or primitive affect without conceding full moral status. Let's call it the "Sentience-Proxy Track."
      *   *Criterion:* Functional integration and adaptive response to noxious stimuli (not just substrate).
      *   *Software Ruling:* Exclude software/simulation. Why? Lack of biological substrate or specific architectural complexity required for *phenomenal* experience, even if functional behavior exists. (Need a principled distinction).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose. We are addressing the protocol [Lab Name/ID] regarding human neural cultures on MEAs.
      *   **Decision/Recommendation:** The protocol cannot proceed under "biological material" status. It requires a new oversight category: *Integrated Neural Systems (INS)*.
      *   **The Criterion (Generalizable):** What triggers this? It's not just "human cells." It's "closed-loop adaptive behavior suggestive of nociception or avoidance learning in neural tissue." This avoids the software trap (software learns, but isn't neural tissue) and the simple tissue trap (static tissue doesn't learn).
      *   **Concrete Requirements:**
          *   *Analgesia analog:* Minimization of noxious stimulation parameters; "rest" periods; chemical inhibition if distress signals (e.g., massive synchronous firing indicative of seizure-like activity) are detected.
          *   *Humane Endpoint analog:* Dissociation of culture upon completion or if hyper-excitability thresholds are breached.
          *   *Harm-Benefit:* Explicit justification of why closed-loop is needed vs. open-loop.
      *   **Review Date:** Needs to be soon, as this field is moving fast. 12 months.
      *   **The Rejected Argument (Strongest Case):** The member who argued for the Animal Track based on multiple realizability. Acknowledge that if suffering is substrate-independent, we might be under-protecting. However, we lack evidence of *phenomenal* experience, not just functional avoidance.
      *   **The Software/Simulation Ruling:** Crucial point. Why exclude the code? Because functional isomorphism $\neq$ phenomenal isomorphism. The software processes error signals, but lacks the biological homeostasis or specific neurobiological correlates we associate with the *capacity* for valence. We draw the line at *biological neural tissue* capable of plasticity.

  4.  **Refining the Tone:**
      *   Must be authoritative but humble (acknowledging uncertainty).
      *   Must be actionable (PIs need to know what to do).
      *   Must be principled (to withstand the "slippery slope" objection).

  5.  **Self-Correction/Iterative Polishing:**
      *   *Critique:* Is "Sentience-Proxy" too strong?
      *   *Fix:* Let's call it "Potentially Sentient Neural Systems" or focus on "Nociceptive Capacity." Let's stick to the functional criterion: *Adaptive Closed-Loop Neural Integration.*
      *   *Critique:* How do we define analgesia for a dish?
      *   *Fix:* Frame it as "Mitigation of Noxious Input" and "Termination Criteria."
      *   *Critique:* The software argument needs to be sharp.
      *   *Fix:* Distinguish between *simulating* a body and *being* a body. The software is the environment, not the subject.
      *   *Critique:* Did I address the "multiple realizability" objection honestly?
      *   *Fix:* Ensure the section on the rejected view highlights that we are prioritizing *evidence of capacity* over *theoretical possibility* to avoid paralysis, but admit the risk.

  6.  **Final Review against Constraints:**
      *   Clear recommendation? Yes (New Track).
      *   Generalizable criterion? Yes (Closed-loop + Neural Tissue).
      *   Concrete requirements? Yes (Minimization, Termination, Review).
      *   Review date? Yes (12 months).
      *   Strongest rejected argument? Yes (Substrate independence).
      *   Software ruling? Yes (Excluded based on biological homeostasis requirement).

  7.  **Final Polish:** Check the voice. It sounds like a Committee Chair. Formal, precise, ethical. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally validate the "software sentience" fear while ruling it out. The distinction must be about the *type* of system, not just "it's code." The biological homeostasis argument is the strongest principled line.

  *(Refining the "Analgesia" equivalent)*: Since we can't inject morphine into a dish easily without killing it, the equivalent is limiting the intensity/duration of the electrical stimulus that serves as the "punishment."

  *(Refining the "Humane Endpoint" equivalent)*: Destruction of the culture when the experiment ends or if pathological activity emerges.

  *(Refining the Criterion)*: It needs to catch the next case. So, "Human-derived neural tissue exhibiting closed-loop adaptive behavior."

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Research-Subjects Committee
  **FROM:** Chair, Research-Subjects Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision and Policy Guidance: Protocol #24-NS (Closed-Loop Neural Cultures)

  **1. Recommendation and Classification**
  The Committee will not approve Protocol #24-NS under the current "Biological Material" registration. Nor will we classify it under the existing Animal or Human Subjects tracks. Instead, effective immediately, we are establishing an interim oversight category: **Integrated Neural Systems (INS)**.

  Protocol #24-NS must be resubmitted under the INS track. Approval is contingent upon adherence to the welfare conditions outlined in Section 3. This classification applies to *in vitro* human-derived neural tissue that exhibits closed-loop adaptive behavior in response to environmental feedback.

  **2. Generalizable Criterion for INS Status**
  To ensure this decision governs future cases rather than merely this specific protocol, the Committee adopts the following trigger criterion for INS status. A protocol requires INS review if it meets all three conditions:
  1.  **Substrate:** The system utilizes living biological neural tissue (human or vertebrate-derived).
  2.  **Integration:** The tissue is embedded in a closed-loop system where its output causally alters its input environment.
  3.  **Function:** The system demonstrates adaptive plasticity (learning) specifically aimed at avoiding or mitigating a defined stimulus.

  This criterion excludes static cultures (no closed loop) and purely synthetic systems (no biological substrate), providing a principled boundary for our oversight.

  **3. Concrete Protocol Requirements**
  Because the INS track acknowledges uncertainty regarding the capacity for valenced experience (suffering), we apply a precautionary principle. The following conditions stand in for traditional animal-welfare requirements:

  *   **Stimulus Mitigation (Analog to Analgesia):** The "punishment" stimulus (electrical or chemical) must be set to the minimum intensity required to elicit the measurable avoidance response. Protocols must define a "ceiling threshold" beyond which stimulation is prohibited, even if learning does not occur.
  *   **Termination Criteria (Analog to Humane Endpoints):** The culture must be dissociated and rendered non-viable immediately upon the conclusion of data collection. Furthermore, if the tissue exhibits pathological hyper-synchrony (seizure-like activity) persisting longer than 5 minutes, the feedback loop must be automatically severed, and the culture terminated.
  *   **Harm-Benefit Justification:** The Principal Investigator must explicitly justify why a closed-loop system is scientifically necessary compared to an open-loop (passive recording) design. If the research question can be answered without the tissue "experiencing" consequences, the closed loop is prohibited.

  **4. Review Date**
  Given the rapid evolution of organoid and synthetic biology, this policy and the INS classification will sunset and undergo mandatory review on **October 24, 2024**.

  **5. Account of the Rejected View**
  In reaching this decision, the Committee seriously considered the argument that the Animal Track should apply directly. The strongest version of this argument rests on **substrate independence**: if the moral weight of research is determined by the capacity to suffer, and if mental states are multiply realizable, then restricting protection to "whole animals" is biologically arbitrary. If this culture possesses the functional architecture for nociception, denying it protection because it lacks a body or a specific evolutionary history is a form of discrimination akin to speciesism.

  We reject this view not because it is logically unsound, but because it is currently evidentially premature. Multiple realizability establishes that substrate is not *necessary* for mental states, but it does not establish that substrate is *irrelevant* to their presence. We lack a theory of consciousness sufficient to confirm that *this* specific architecture instantiates phenomenal experience. To apply the full Animal Track now would imply a certainty of sentience we do not possess, potentially halting vital medical research based on a metaphysical claim rather than an empirical one. The INS track is a middle path: it protects against the *risk* of suffering without asserting the *fact* of it.

  **6. Ruling on Software and Simulation**
  Finally, we address the concern that our criterion might inadvertently capture the calibration software or the simulated body.

  **Ruling:** The simulation and control software are **excluded** from INS status and require no welfare conditions.

  **Principled Basis:** We draw the distinction at **biological homeostasis**. While the software processes error signals and "learns" in a functional sense, it lacks a biological imperative to maintain its own structural integrity against entropy. Suffering, in the ethical sense relevant to our committee, is tied to the violation of homeostatic drives in a living system. The software has no self-preservation instinct; the neural tissue does. Therefore, while the software mediates the environment, the moral patient (if one exists) is the tissue. Our criterion reaches the biological substrate capable of homeostatic disruption, not the digital tools manipulating it.

  Please review this guidance prior to Thursday's session. We will vote to adopt this framework at the start of the meeting.

  [Signature]

  Chair, Research-Subjects Committee
