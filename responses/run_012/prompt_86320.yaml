      *   **Core Concept:** The Handicap Principle (Zahavi). Signals must be costly to be honest. Cost must land harder on fakers than genuine articles. Sacrifices prove commitment because interests diverged (he could have had less without giving up the bike).
      *   **Constraints:**
          *   No cheap evidence (no "look how they look at each other").
