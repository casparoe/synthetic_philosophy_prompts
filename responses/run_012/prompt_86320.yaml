answer: |-
  Good evening. For those who don't know me, I'm the brother. For those who do, you know I'm the one who usually handles the spreadsheets. And if you've spoken to my Uncle [Uncle's Name] in the last eighteen months, you know he thinks these two have been running a deficit on common sense.

  He's not wrong about the numbers. By any standard economic logic, what [Sister] and [Groom] have done over the last year is inefficient. He sold a perfectly good motorbike. He flew here once a month for a year. She turned down a tenure-track offer in [City]. And this wedding? Well, we're all here, so we know what this cost.

  My uncle calls it a waste. I'm standing up to say it's not a waste. It's a mechanism.

  [Sister], you know this better than anyone. You spent six years studying bird song. You know that a bird doesn't sing because it's easy. It sings because it burns energy and tells predators where to hide. If the song were cheap, any weak bird could sing it. The cost is the point. It's the only way to prove you have the energy to spare.

  Human relationships work the same way when interests diverge. If [Groom] just wanted a short-term relationship, keeping the motorbike was the rational choice. He could have had most of what he wanted without selling it. The fact that he sold it means he was pricing himself out of the short-term market. A faker couldn't afford that depreciation. The cost lands harder on someone who isn't staying than on someone who is.

  Same with the commute. Flying once a month is burning cash and time. A casual partner optimizes for convenience. They minimize loss. [Groom] maximized expenditure. He accepted a handicap that would have driven anyone less committed to quit. He didn't quit.

  And [Sister], turning down the job. That's the biggest one. In biology, there's a difference between an index—you can't fake height—and a signal—you can fake wealth, but it costs you. This wedding is a signal. It's expensive enough that nobody does it unless they intend to stick around to amortize the cost. If you weren't sure about him, you keep the job in [City] and keep your options open. You didn't. You closed the options. That closure has a price tag, and you paid it.

  So, to the family: Yes, this was expensive. Yes, the bike sale was financially dubious. But efficiency isn't the goal here. Honesty is. They have burned resources to prove that their interests are now aligned. They have made it too expensive for themselves to leave.

  [Sister] and [Groom], you've sent the signal. It was loud, it was costly, and everyone in this room received it. Now, the signaling is over. The work begins. But for tonight, know that every dollar spent and every opportunity turned down wasn't a loss. It was the price of admission for the rest of us to know you're real.

  Cheers.

  ***

  ### Verification Table

  | What I claim about them | What it cost them | Who couldn't have paid it |
  | :--- | :--- | :--- |
  | He is committed for the long term. | Selling the motorbike (asset loss). | Someone seeking a short-term fling (ROI doesn't work). |
  | He prioritizes her over convenience. | Monthly flights (cash + time + fatigue). | A partner optimizing for low-effort dating. |
  | She prioritizes this union over career max. | Turning down the job in another city. | Someone keeping their exit options open. |
  | They intend to stay together. | The wedding expenditure itself. | A couple uncertain about longevity (can't amortize cost). |
  | Their interests are now aligned. | Closing off other romantic options. | Someone wanting to keep multiple options active. |
  | The signal is honest. | Total accumulated financial inefficiency. | A "faker" for whom the cost exceeds the benefit. |
