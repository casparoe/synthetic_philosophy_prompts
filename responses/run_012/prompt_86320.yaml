  2.  **Deconstruct the Handicap Principle for this Context:**
      *   *Zahavi's Idea:* A peacock's tail is cumbersome and attracts predators. Only a healthy male can afford such a handicap. Therefore, the tail signals genetic quality.
      *   *Application to Wedding/Relationship:* The wedding cost, the career sacrifices, the bike sale are the "tails." They are inefficient in pure economic terms. That's the point. If they were efficient, a fling could afford them.
      *   *Key Nuance 1 (Relative Cost):* It's not about absolute pain, but differential cost. A faker finds these costs prohibitive; a committed partner finds them acceptable relative to the value of the union.
      *   *Key Nuance 2 (Divergent Interests):* Sacrifice matters only if there was a cheaper option available. He *could* have dated her without selling the bike. He *chose* not to.
      *   *Key Nuance 3 (Index vs. Signal):* Height is an index (can't fake). A wedding is a signal (can fake, but expensive). We are dealing with costly signals.

