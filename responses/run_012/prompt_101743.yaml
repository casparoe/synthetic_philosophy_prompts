      *   Conclusion: I know any evidence for $\neg P$ is misleading, so I can ignore it.
      *   *The Flaw:* This assumes that the *status* of "knowing" is fixed prior to evaluating the new evidence. But knowledge is **defeasible**. New evidence can *destroy* the knowledge status. You don't get to keep the "I know" label *and* dismiss the evidence. You have to choose: either the evidence destroys the knowledge, or you explain the evidence without losing the knowledge. But you can't just assert the knowledge remains intact *by definition*.

