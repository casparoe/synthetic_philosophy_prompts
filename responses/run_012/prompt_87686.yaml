      *   **Generalism Claims:**
          *   *Subsuming/Reading off:* **Misrepresentation.** Most generalists deny mechanical application. Principles are guides, not algorithms.
          *   *Helpless before difficulty:* **Wrong.** Principles help structure deliberation.
      *   **The Closing Claims (The User's main worry):**
