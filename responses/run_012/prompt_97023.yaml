answer: |-
  This is a sophisticated objection. You have independently reconstructed a critique that exists in the formal literature on AI safety, often framed in terms of complexity theory (specifically, the relationship between **NP**, **co-NP**, and **Interactive Proofs**). Your intuition that the "asymmetry" relies on the existence of short certificates of falsity is correct.

  Here is the analysis of what would count against your position, ranked by decisiveness.

  ### 1. Rank the Defeaters

  **1. The Existence of Interactive Proof Systems (Theoretical Decisiveness)**
  *   **The Argument:** Your position assumes verification must be *static* (a written proof the judge reads). However, the mathematical field of Interactive Proof Systems (IP) proves that a weak verifier can check the validity of statements far beyond its own computational power by interacting with powerful, adversarial provers. The most famous result here is **MIP = NEXP**, which shows that a polynomial-time verifier can verify solutions to exponentially hard problems if it can query two non-communicating provers.
  *   **Why it defeats your position:** It demonstrates that the "certificate-size assumption" is false *for interactive protocols*. Interaction allows the verifier to spot-check consistency in a way that forces errors to localize. You do not need a static short proof of falsity; you need a protocol where lying *creates* a short proof of inconsistency dynamically.
  *   **Decisiveness:** High. This is a mathematical proof that weak judges can supervise strong agents on hard problems, provided the interaction structure is right.

  **2. The "Consistency Trap" Mechanism (Structural Decisiveness)**
  *   **The Argument:** The honest debater does not need to prove the claim is false directly. They only need to force the dishonest debater to make two claims that are mutually inconsistent, where the inconsistency is judge-checkable.
  *   **Why it defeats your position:** Your "smearing" argument assumes the liar can distribute error without contradiction. But if the decomposition implies logical dependencies (e.g., if A implies B, and the liar claims A and not-B), the honest agent can zoom in on the dependency. The "cost" of lying becomes maintaining global consistency across the tree, which scales exponentially for the liar but linearly for the checker.
  *   **Decisiveness:** Medium-High. It addresses the "smearing" concern directly by changing the winning condition from "find the false leaf" to "find the contradictory edge."

  **3. Empirical Scaling on Checkable Hard Tasks (Empirical Decisiveness)**
  *   **The Argument:** If we run debate on tasks that are hard for the judge but checkable by a stronger oracle (e.g., a weak model judging code written by strong models, where the code is later run), and debate performance scales with depth while direct supervision plateaus, this is evidence the asymmetry holds in practice.
  *   **Why it defeats your position:** It shows that even if worst-case "smearing" is theoretically possible, it does not occur on the distribution of problems that matter, or the honest agent has a heuristic strategy to find the smear.
  *   **Decisiveness:** Medium. Empirical results can always be dismissed as "not hard enough," but consistent scaling is strong evidence.

  ### 2. Would Defenders Concede?

  *   **On Interactive Proofs:** Yes. Proponents of debate (like Paul Christiano or Geoffrey Irving) explicitly cite Interactive Proof Systems as the theoretical justification for why debate might work. They would agree that without the interactive element, your critique holds. They would argue the protocol *is* the solution to the certificate problem.
  *   **On Consistency Traps:** Yes. This is a standard feature of debate designs. Defenders concede that if the liar can maintain perfect consistency while lying, debate fails. Their claim is that maintaining consistency while lying is computationally harder than maintaining consistency while telling the truth.
  *   **On Empirical Scaling:** Yes, with caveats. They would concede that if debate fails to scale on checkable hard tasks, the proposal is dead.

  ### 3. Verdict on Falsifiability

  **Your position risks being unfalsifiable in practice, though not in principle.**

  *   **In Principle:** Your position is: "Debate fails on problems where false claims lack short interactive refutations." This is falsifiable if we find a problem where false claims lack short *static* refutations, but debate *succeeds*. (The MIP=NEXP result suggests this is possible).
  *   **In Practice:** If debate fails on a task, you can say, "See, the certificate didn't exist." If debate succeeds, you can say, "The certificate existed, so this wasn't a counterexample." Because we generally cannot prove *negative* complexity results (we can't easily prove no short certificate exists), you can always retreat to the claim that the problem wasn't hard enough.
  *   **Is this a defect?** For a claim about a class of protocols, some insulation is normal. However, if the position is insulated against all empirical outcomes (i.e., success implies the task was easy, failure implies the task was hard), it loses predictive power. To avoid this, you must specify a class of problems (e.g., specific cryptographic tasks) where you predict debate *must* fail.

  ### 4. Distinct Predictions

  Your position makes specific predictions that rival "optimistic" positions do not:

  1.  **Diminishing Returns on Depth:** You predict that increasing debate depth (recursion levels) will yield diminishing returns once the "smearing" threshold is reached. Rivals predict linear or exponential gains in truth-seeking capability.
  2.  **Symmetric Compute Failure:** You predict that increasing the compute of *both* debaters equally will not help if the judge remains fixed, because the "smearing" capability scales with the liar's compute just as much as the truth-teller's. Rivals often argue that honest strategies are more compute-efficient, so symmetric scaling helps the truth.
  3.  **Specific Failure Modes:** You predict failure on problems that are **co-NP hard** or lack interactive proof structures (e.g., certain types of hashing or obfuscation), whereas direct supervision might also fail, but debate offers no *advantage*.

  **Checkability:** These are checkable in principle via controlled experiments on synthetic tasks with known complexity properties.

  ### 5. The Single Most Persuasive Thing

  **The MIP = NEXP Theorem.**

  *   **What it is:** A formal proof in complexity theory. It states that a verifier with very limited power (polynomial time) can verify the answer to any problem in NEXP (nondeterministic exponential time) by interacting with two all-powerful provers who cannot communicate with each other.
  *   **Why it persuades:** It is a concrete mathematical existence proof that your "certificate-size assumption" is wrong *for interactive systems*. It proves that interaction can compress verification complexity exponentially.
  *   **Availability:** It is available now. It is standard computer science theory (Babai, Fortnow, Lund, 1991).
  *   **Caveat:** Debate uses *one* judge and *communicating* debaters (usually), which is weaker than MIP. However, the intuition holds: interaction allows the judge to sample the "tree" in a way that forces the liar to collide with themselves. If you accept MIP=NEXP, you must accept that the structural impossibility you fear is not absolute.

  ### 6. Analysis of the Proposed Repair

  *The repair: Letting the challenged side force the decomposer to demonstrate that the class of subproblems is solvable by requiring it to solve related problems.*

  **Does this count against your position?**
  It **relocates** the problem rather than solving it.

  *   **Why it helps:** It prevents the decomposer from choosing a decomposition that is "rigged" (i.e., one where the subproblems are systematically biased or unverifiable). It forces the decomposer to bet on the verifiability of the space, not just the instance.
  *   **Why it fails your critique:** Your critique is about **error smearing within a valid-looking decomposition**. Even if the subproblems are solvable in principle, the liar can still construct a specific tree where the error is distributed across 1,000 nodes, each 0.1% wrong. Forcing the decomposer to solve *related* problems checks the *density* of solvability, but it does not guarantee that the *specific path* taken in the debate is free of distributed error.
  *   **Verdict:** It mitigates the risk of the decomposer choosing a "bad domain," but it does not solve the "bad path" problem within a good domain. It moves the certificate-size requirement from the argument to the meta-argument about the argument's structure. If the "smear" can apply to the meta-argument (the claim that "these subproblems are representative"), the structural flaw remains.

  ### Summary

  Your position is structurally sound regarding *static* verification. To be moved, you must accept that *interaction* changes the complexity class of verification. The MIP=NEXP theorem is the strongest evidence that your "certificate-size" constraint is not a hard limit on interactive protocols. If you reject that mathematical result applies by analogy to AI Debate, your position becomes insulated from theoretical counter-arguments and rests solely on empirical failure.
