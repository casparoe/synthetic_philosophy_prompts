prompt: |-
  I'm a second-year PhD student in philosophy of mind and I sit on our hospital's clinical ethics commitee as the lay member (they wanted someone who'd done some phil of mind, which is me, lucky them). We vote on Thursday week and I'm the one writing the paper.

  The case is a trial of a bedside gadget: EEG cap, a bit of machine learning, spits out a single number between 0 and 1 that's supposed to flag covert awareness in patients with disorders of consciousness. The number won't stay in the lab — the consultants have already said they want it in front of them when they're weighing up whether to carry on with treatment, so it's going to end up in best-interests meetings, and families will see it.

  What's eating me is how the thing was built. It's calibrated against people who were asked to imagine playing tennis, or walking round their own house — i.e. people following an instruction and doing something on purpose. So as far as I can tell it's a test of whether information is getting globally broadcast and made available for report and deliberate control (the workspace picture, yeah?), not a test of whether anyone's home. The family leaflet says the scan "tells us whether your relative is conscious", and a negative result is obviously going to be heard as "no one's home". One of the consultants wants to bring a negative result into a best-interests meeting next month. In the pilot, a few patients who showed nothing at all at the bedside came out above the line, and nobody knows what to do with them.

  Can you draft the memo I'll circulate? I want a recomendation I can actually defend — approve, approve with conditions, or don't — with reasons and a time frame, and a suggested rewording of the family leaflet (I've got a clunky draft line, "the scan can show awareness is there but can't show it isn't", and I don't know whether it survives scrutiny). Please take the other side properly: I keep being told that if the number tracks global access then access might be the thing that matters anyway — if nothing's broadcast, what is there to suffer? — and that a family would rather have a number than nothing, and I haven't got a good reply to either. Also our postdoc says there are studies where the same sort of signal turns up in people who aren't reporting anything at all, so she reckons I'm wrong that it's all about report. Tell me what to do with that, because I don't think I can just ignore her.
