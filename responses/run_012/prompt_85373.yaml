answer: |-
  (a) Exam Question

  **Final Exam: Ethics of War**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question:**
  Consider a hypothetical conflict where an internationally trusted neutral body has publicly verified and settled the *jus ad bellum* status of the belligerents before hostilities commence. Both sides' combatants know with certainty which state is the aggressor and which is the defender. There is no fog of war regarding the justice of the cause.

  In light of this stipulation, write an essay evaluating the status of the Moral Equality of Combatants (MEC). Your answer must address the following:
  1.  Identify which standard defenses of MEC collapse when combatant ignorance is removed, and analyze whether any non-epistemic defenses survive this scenario.
  2.  Distinguish clearly between the *liability* of combatants to be attacked and the *permission* for combatants to attack.
  3.  Explain whether the coercive context (e.g., conscripts fighting under duress) offers any remaining moral cover for unjust combatants despite their knowledge.
  4.  Conclude with a paragraph assessing whether the legal practice of treating combatants equally under the laws of war remains justified once the moral claim for equality is removed.

  Argue for your position. Do not simply recount historical debates; analyze the logical structure of the arguments under these specific conditions.

  ***

  (b) Model Answer

  The stipulation of epistemic certainty fundamentally dismantles the most common defense of the Moral Equality of Combatants (MEC). Traditionally, MEC is defended by claiming soldiers cannot reasonably know if their cause is just; they are entitled to trust their state. In this scenario, that shield is removed. If unjust combatants know their cause is wrong, the epistemic excuse vanishes. Consequently, arguments relying on "invincible ignorance" to grant unjust combatants equal standing collapse immediately. They can no longer claim they are blameless instruments acting in good faith.

  However, removing ignorance does not automatically resolve the distinction between liability and permission. Liability refers to whether a combatant has done something to make themselves a legitimate target. Permission refers to whether the combatant is morally authorized to engage in violence. Under these conditions, unjust combatants are almost certainly liable to be killed. By knowingly participating in an unjust war, they become agents of wrongful harm. The defenders, conversely, are not liable because their violence is defensive. Yet, the question of permission is more complex. Even if unjust combatants are liable, are they permitted to fight? Generally, no. Knowing participation in aggression is morally prohibited. However, this is where the coercive context matters.

  We must separate the volunteer from the conscript. An unjust volunteer who knows the cause is wrong has no excuse; they are liable and acting impermissibly. But an unjust conscript fighting under threat of execution by their own command faces a duress constraint. While their knowledge of the war's injustice might still make them liable to defensive force from the enemy (since they are still posing a threat), the duress may excuse them from moral blame. They are not permitted to kill, but their liability might be mitigated because they are acting to save their own lives. The enemy may still kill them to stop the aggression, but the conscript is not morally culpable in the same way as the volunteer. Thus, knowledge removes the excuse of ignorance, but coercion retains the excuse of necessity regarding personal blame, even if it does not negate the threat they pose.

  Regarding non-epistemic defenses, some argue that soldiers are equal simply because they are state instruments, regardless of knowledge. This argument struggles to survive the stipulation. If a soldier knows the state is acting criminally, the "just following orders" defense loses moral weight unless one adopts a strict collectivist view where individuals bear no responsibility for state acts. Most individualist accounts of liability would reject this. Therefore, few robust moral defenses of MEC survive when knowledge is guaranteed. The symmetry of status is broken because the symmetry of moral action is broken.

  Finally, we must address the legal practice. Even if moral equality evaporates under these conditions, the legal equality mandated by International Humanitarian Law (IHL) remains justified, but on pragmatic rather than moral grounds. IHL requires both sides to follow the same rules of engagement and grants equal protections to prisoners of war. If legal rights were tied to *jus ad bellum* status, the aggressor side would have no incentive to follow the rules of war, leading to greater atrocities. The legal convention is a functional tool to limit suffering, not a declaration of moral symmetry. Therefore, while the moral claim for combatant equality fails when ignorance is removed, the legal practice persists because it serves a distinct purpose: regulating conduct to minimize harm, regardless of who started the fight. The law operates on a different logic than morality, prioritizing containment over retributive justice.

  ***

  (c) Marking Scheme

  **Total Marks:** 20
  **Note:** No credit is given for name-dropping theorists (e.g., Walzer, McMahan). Credit is awarded for argumentative structure and analysis.

  | Point | Requirement | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Epistemic Condition:** Clearly identifies that standard MEC defenses relying on combatant ignorance collapse under the stipulation. | 4 | Students argue that ignorance is always present in real war, ignoring the hypothetical constraint. |
  | **2** | **Liability vs. Permission:** Distinguishes between being a legitimate target (liability) and having the right to fight (permission). | 4 | Students conflate the two, assuming that if a soldier is liable, they are also permitted to fight. |
  | **3** | **Coercion/Conscripts:** Analyzes how duress affects blame/liability for conscripts differently than volunteers despite their knowledge. | 4 | Students claim coercion makes the violence permissible, rather than excusing the agent from blame. |
  | **4** | **Non-Epistemic Defenses:** Evaluates whether arguments not based on ignorance (e.g., collective agency) survive the scenario. | 4 | Students assume all defenses die automatically without analyzing non-epistemic alternatives. |
  | **5** | **Legal Practice:** Justifies continued legal equality (IHL) on pragmatic/functional grounds despite the loss of moral equality. | 4 | Students argue legal equality must vanish because moral equality has vanished. |

  **A vs. B Distinction:** An A paper integrates these points into a cohesive argument about the relationship between knowledge and liability, whereas a B paper treats them as a checklist of separate definitions.
