      *   *Section 2: Occasionalism and the But-For Test.* This is the crux. Can occasionalism support counterfactuals? Yes, via God's consistent habits (Sunna/Divine Custom). If God *always* kills when the doctor fails, the but-for test holds *phenomenally*, even if the *ontology* is different. The test remains coherent as a description of divine habit, not created power.
      *   *Section 3: Loss of Chance.* This doctrine actually leans *away* from strict "powers" and *toward* probabilistic/regularity views. It admits we can't know the specific causal chain, only the statistical one. Occasionalism fits this surprisingly well because God's habits can be probabilistic from our epistemic standpoint.
      *   *Section 4: Strict Needs vs. Fits.*
