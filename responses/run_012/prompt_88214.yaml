  8.  **Final Polish:** Check the "Underdetermined" section. This is crucial. The protocol works for "Truth" but also works for "Plausibility." That's the gap. The lab assumes they are the same. They aren't.

      *Let's flesh out the "Swap" section more concretely.*
      Current: Winner = Ground Truth.
      Swap: Winner = "Best Available Narrative."
