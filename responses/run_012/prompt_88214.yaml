      *   *Assumption on Deception:* Lying is harder than truth-telling *under scrutiny*. This is the "Honesty via Competition" hypothesis. It assumes contradictions will be exposed by the opponent before the judge.
      *   *Assumption on Language:* **Atomistic Decomposability**. Complex truths can be broken into verifiable atoms (lines of code, numbers) without losing the semantic whole. Context is recoverable from fragments.
      *   *Assumption on the Judge:* The judge is a **Random Oracle of Attention**. They don't need expertise, just the ability to spot a broken link. Their bias is assumed symmetric (or noise that cancels out over many runs).
      *   *The "Ground Truth" Leap:* This is the critical philosophical sleight of hand. They are conflating *justification* (reasons to believe) with *truth* (state of affairs). They believe that if you optimize for justification sufficiently, truth emerges as a byproduct.

  3.  **Identify Rival Views:**
      *   *Correspondence Theory:* Truth is matching reality. If you can't check reality, you don't have truth. (This kills the whole project).
