      *   **AI Analogy:** AI models produce text ("I feel unsure") based on weights and activations (physical/functional state). If the AI has qualia (big if), and epiphenomenalism is true, the qualia don't cause the text. The weights cause the text. So the text is really about the weights/activations, not the qualia.

