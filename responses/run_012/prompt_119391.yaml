answer: |-
  Good morning. I know what some of you are thinking. I know because I wrote a story about this exact thing, and then I watched you lot actually go and do it. I also know that for sixty of you, this feels less like an honour and more like a summons. You did not put your names in a hat. You did not campaign. You woke up on a Tuesday and found out you belong to the town in a way you did not choose.

  There is anger in this room. I can see it in the front rows among the assembly members, and I can feel it from the activists on the sides who wanted a full lottocracy and see this structure as a compromise. There is also sadness in the front two rows, among the councillors who are leaving. Some of you have served this town for twenty years. Doreen, everyone knows you, and everyone knows you leave with grace. But the system that carried you here is being parked outside.

  We need to be honest about what is happening today. We are swapping one kind of fear for another.

  In the old system, the discipline was simple. If you made decisions people hated, they threw you out. The fear of the electorate was the engine of accountability. It kept you listening, or at least it kept you pretending to listen. But you sixty cannot be thrown out. You cannot be voted out. You simply time out, like milk. The rules say you serve eighteen months and then you cannot stand for elected office for six years. The activists call this the one-way door. They say it prevents careerism. They are right. But it also prevents experience.

  So what replaces the fear of the ballot box? It is not written in the rules, but it must exist if this is to work. Without the threat of removal, the only thing left is the weight of the decision itself. You are not accountable to a party whip. You are not accountable to a donor. You are accountable to the person sitting next to you, and to the town that wakes up tomorrow bound by what you decide.

  There is a risk here that I need to name, because the activists are whispering it and the councillors are too polite to say it. If the amateurs rotate through every eighteen months, and the permanent staff never leave, who actually runs the place? The clerks, the officers, the consultants—they know where the files are. They know how the budget works. You do not. The one-way door stops you from becoming politicians, but it risks handing the town to the administrators.

  This is not a defence of the old way. Twenty years in a seat can make you deaf. But six months is not enough to learn how to be brave. You will be presented with advice that sounds like fact. You must learn the difference. Your job is not to be the experts. Your job is to be the neighbours who ask the experts why. If you let the officers drive because you are temporary, then the lottery was just a theatre trick.

  Then there is the question of consent. I am not going to stand here and tell you that you consented to this by being drawn. You did not. Legitimacy in a democracy usually comes from permission. You gave none. The legitimacy here comes from representation by mirror. You are a sample. You are the town in miniature, with all its apathy and anger and confusion. The binding power of your decisions does not come from your willingness, but from your randomness. That is a cold comfort, I know. But it is the only honest one available.

  We have built safeguards. The assembly cannot be dissolved, only rotated. A third of you leave every six months, so there is always a majority who know what they are doing. Any decision you make can be sent back once by a second panel of thirty people. These people are drawn fresh, and they are not told they are chosen until the morning they sit.

  This is intended to stop corruption. But let us not pretend it stops lobbying. The activists are right to worry about the second panel meeting in secret. A mandate is public. A sample is quiet. You cannot lobby a seat that does not exist until the morning of the vote, but you can lobby the idea. You can lobby the climate. The risk of influence has not vanished; it has just gone underground. Transparency is your only weapon against it. The rules say the council must publish its reasons if it overrides you, and can only do so on a two-thirds vote. Use that. Make them speak in the light.

  I am not here to tell you this will work. I am here to tell you what it is. It is an experiment in removing ambition from power. We have given up the discipline of the election because we hoped it brought too much noise. We have given up consent because we hoped representation could be mathematical rather than voluntary. We have given up experience because we hoped freshness would bring honesty.

  Those are large things to give up.

  For the sixty of you, this is not a career. It is a burden. You will be confused. You will be tired. You will be angry that you are here instead of at work or with your families. That is not a bug in the system; it is the point. Politics should not be a profession. It should be a thing we do because it must be done.

  For the councillors leaving, know that your service is not erased by this change. You held the line when there was no other way. For the activists, know that this is not the end state. It is a mechanism. It can be broken. It can be captured. It requires vigilance, not just celebration.

  We are trying to see if a town can govern itself without the threat of being fired, and without the promise of keeping the job. We are trying to see if duty is enough motivation when ambition is removed. We are trying to see if sixty people chosen by chance can care enough about a place they did not choose to run.

  The room is full. The rules are set. The lottery has spoken. We are all waiting to see what happens next.
