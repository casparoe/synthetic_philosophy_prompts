          The analogy's critical failure lies in the **Non-Identity Problem**. School choice presupposes an existing child who benefits or suffers. Embryo selection determines *which* child comes into existence. Choosing School A over School B affects Child X. Choosing Embryo A over Embryo B means Child X exists instead of Child Y. This breaks the "no wrong done" claim. Child Y is not wronged by non-existence (they never exist), but Child X is constituted by the choice, not merely influenced.

