  Regarding **permissibility**, the analogy quietly imports the feature of a **pre-existing subject owed care**. It treats the embryo as an existing child receiving a benefit, rather than a potential person being constituted. If the choice creates the person rather than benefiting them, "designing" traits risks instrumentalizing the child as a product of preference. The school analogy hides this by assuming the child is already there waiting for the "best start."

