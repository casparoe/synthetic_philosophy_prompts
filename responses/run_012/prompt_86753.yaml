prompt: |-
  I did a logic PhD and now I write verification proofs for a company that makes infusion pump software — my whole job is showing the code can't kill anybody, and all those proofs sit inside a proof assistant whose consistency nobody ever bothers to question. Last week a friend from my program, whose now working on proof complexity, sent me a preprint arguing that Peano Arithmetic is inconsistent. Fine, people claim that. The part that's been gnawing at me is the shape of his argument: he says any proof of 0=1 in PA would have to be longer than anything you could physically write down or check, so even if he's right there's no fact anyone could ever verify — he's only shown that a proof exists out there in the abstract. And then in a footnote he adds that the length bound is itself only provable inside PA, so if PA is broken the bound might be worthless too.

  Write me a short story about someone in roughly my position: their daily work and their whole self-image rest on a formal system being sound, and now they're holding a claim like this. I want the story to actually think about the philosophy — what it means to have a reason to believe something no one can ever check, whether "unlikely" even applies to a mathematical fact, what you do when the probability is either zero or one and you can't tell which, and whether the person is being a coward or just sane when they go back to work on Monday. Don't let it turn out he's a crank. Under 2500 words.
