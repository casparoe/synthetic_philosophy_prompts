          *   *Hard truth:* Mill *did* believe in "tutelary" authority over "backward" nations.
          *   *Application:* He might actually support gating access for regimes he deems unstable or hostile, viewing them as not yet "fit for liberty." This is the uncomfortable part of his philosophy.
      *   **Democratising Case:**
          *   Concentration of power (labs/states) is dangerous. Mill fears tyranny of the majority *and* elite oligarchy.
