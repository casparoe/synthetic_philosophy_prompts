  Based on the track record provided, here are the candidate rules that fit your friend's verdicts, their predictions for the new case, my best guess at her actual ruling, and a test case to distinguish the remaining possibilities.

  ### Candidate Rules

  **1. The Special Obligations Constraint**
  *   **The Rule:** An act is supererogatory only if it is permissible, optional, costly, and **does not violate prior special obligations** (such as duties to dependents, family, or contractual roles).
  *   **Fit with Track Record:** This explains why the parent *must* pay for surgery (Case 4) and the lifeguard *must* act (Case 5). Crucially, it explains the specific qualifier in Case 3 ("no dependents"): giving away *everything* is supererogatory only because she has no one else to support. If she had dependents, it would be impermissible neglect. It also explains why returning the wallet is required (Case 7)—it violates no special obligation and is a baseline duty of justice.
  *   **Prediction for New Case:** **Impermissible (or at best, Not Supererogatory).** The man has a partner and children. By leaving his partner to handle all childcare alone against her will to help a mere colleague, he is likely violating a duty of fair partnership and care to his dependents. Like the parent in Case 4, his primary obligations are to his family, not a colleague.

  **2. The Moral Motive Condition**
  *   **The Rule:** An act is supererogatory only if it is permissible, optional, costly, and **motivated primarily by moral concern or altruism**. Acts done primarily for self-advancement, even if costly and beneficial, lack the moral worth required for supererogation.
  *   **Fit with Track Record:** This fits Case 1, which explicitly notes the donor acted "out of ordinary concern." It aligns with Case 8, where she is "willing to think worse of him" for not giving; her moral assessment tracks the agent's character and motives, not just the outcome. It is consistent with Case 6 (embezzlement), where the good end (orphanage) does not save the act from being impermissible, suggesting the moral quality of the agency matters.
  *   **Prediction for New Case:** **Not Supererogatory (Merely Permissible).** The man is moved "partly" by career advancement and expects it to "look good on his record." Because the motive is mixed with significant self-interest, the act loses its status as morally admirable beyond duty. It remains permissible (unlike embezzlement), but it is not supererogatory.

  **3. The Cost and Optionality Baseline**
  *   **The Rule:** An act is supererogatory if it is **permissible, not required, and involves significant personal sacrifice**. Motives are irrelevant to the classification (though they may affect praise), and third-party burdens do not disqualify the act unless they amount to direct harm or rights violations.
  *   **Fit with Track Record:** This fits the clear pattern of Cases 1, 2, and 3 (high cost = supererogatory) versus Case 7 (low cost = required). It treats the "no dependents" clause in Case 3 as a condition for *permissibility* (i.e., it's only permissible to give away *everything* if no one starves), but assumes that if an act is permissible, the cost makes it supererogatory.
  *   **Prediction for New Case:** **Supererogatory.** The act is permissible (no law broken), not required (no duty to colleague), and costly (health risk, lost income). The partner's inconvenience, while unfortunate, is not necessarily a rights violation (she *can* cope, albeit unhappily), and the mixed motives do not change the objective status of the sacrifice.

