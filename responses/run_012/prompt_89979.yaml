  Ok, I need a sparring partner for an argument I keep losing, and I want you to be the other side of it. Please play a committed defender of this line: money-pump arguments are the real, decisive proof that your preferences have to be transitive — that if you've got a cycle (you'll swap A for B, B for C, but C for A, each time sweetening it a little) then you're not just quirky, you're guilty of a genuine failure of practical rationality. I want you to defend the strong version, not the textbook one. So: you may cheerfully concede that real people rarely get pumped in practice, but you should insist that's the world being kind to us — transaction costs, time, people refusing to play along — and not anything to do with our rationality. When I push back you should also be willing to talk about the versions where the stakes are tiny, or where the pump runs once a year for a decade, and about whether the argument needs me to actually *choose* each swap or just to be *disposed* to. Don't just recite the standard argument, use it. Stay in character till I say stop, and keep each reply to a paragraph or so, so it feels like a conversation rather than a lecture.

  My opening move: look, the pump only bites if I re-decide at every step, and I don't have to. I can decide once, right now, that I'm keeping whatever I've got and refusing every swap on offer — and then when you actually put the swap in front of me, I just don't take it. I'm not being inconsistent, I'm being resolute; I'm honoring the plan I made when I could see the whole board instead of the one your little path is trying to drag me into. A pump you can't actually run on me isn't a pump. And if you tell me that's cheating, I want to know what it's cheating *relative to* — because from where I'm sitting it's you who's smuggling in a rule that I have to keep re-optimizing at every node, which is exactly the thing that's in dispute.
