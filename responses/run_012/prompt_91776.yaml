  2.  **Deconstruct the Symbol Grounding Problem (SGP):**
      *   *Core Issue:* How do symbols (words, concepts) get their meaning? If meaning is just definition by other symbols (dictionary), it's an infinite regress. At some point, a symbol must connect to something *non-symbolic* (the world).
      *   *Harnad's Formulation:* A system manipulating symbols based on shape alone (syntax) doesn't understand what they refer to (semantics).
      *   *The User's Analogy:* Variable name -> Memory Address -> Value. Or API call -> Hardware Register -> Voltage.

  3.  **Drafting the Translation (Strand by Strand):**

      *   *Strand 1: Symbols as Arbitrary Tokens (Syntax).*
          *   Phil: Symbols are defined by relations to other symbols.
          *   Eng: This is a pure AST or intermediate representation (IR) where variables are unresolved IDs. It's a graph of pointers where nothing points to a concrete memory address yet. It's like a linked list of `None` pointers.
          *   Key concept: Internal consistency without external reference.

      *   *Strand 2: Meaning as Use (Wittgenstein).*
          *   Phil: Meaning is how the symbol is employed in a language game.
          *   Eng: This is API usage patterns. If I see a function `open_file` always followed by `read` and `close`, its "meaning" is defined by that control flow graph. It's dynamic tracing. The "semantics" are the side effects observed during execution.
