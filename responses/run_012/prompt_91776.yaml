      *   *Verdict:* SGP names a real constraint for *autonomous* systems (AGI/Robots), but it is a non-problem for *tools* (LLMs/Backend). The user is treating the computer as a tool (where they provide grounding), while the philosopher is treating it as an agent (where it must provide grounding).

  7.  **Review against Constraints:**
