      *   *Strand 3: Grounding as Causal Contact (Harnad/Embodied).*
          *   Phil: Symbols must be anchored in sensory experience or motor capacity.
          *   Eng: This is the FFI boundary. It's the `read_sensor()` syscall. It's the pointer dereference that hits a memory-mapped I/O register. It's the point where the virtual machine touches the metal.
          *   Key concept: The `extern` keyword. The root pointer.

  4.  **Developing the Residue Report (The Mapping):**

      *   *Clean Maps:*
          *   "Symbol" = Variable Name / Token.
          *   "Reference" = Pointer / Address.
          *   "Grounding" = Dereferencing a valid pointer / FFI / Hardware Interrupt.
          *   "Infinite Regress" = Dangling Pointer / Infinite Recursion / Unresolved Linker Symbol.

      *   *Fudged Maps:*
          *   "Meaning" vs. "Value." In code, `x = 5` binds `x` to `5`. In philosophy, does "5" mean the concept of five or the physical quantity? Engineers treat the value as opaque bits unless they hit I/O. Philosophers care about the *qualia* of the value.
          *   "Understanding." Code executes; it doesn't "know." The user might argue "execution is understanding," but that's a category error in philosophy.

      *   *No Counterpart (The Gap):*
          *   *Intentionality (Aboutness):* Code pointers are *given* meaning by the programmer. The pointer itself doesn't care. SGP asks how the *system itself* (not the external user) establishes the link.
          *   *The Homunculus:* Who reads the sensor? In embedded, the CPU reads the register. But does the CPU *know* voltage = temperature? No, the code assumes a calibration curve. SGP asks where the calibration curve comes from without another symbol.

