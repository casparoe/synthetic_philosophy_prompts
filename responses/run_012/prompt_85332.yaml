answer: |-
  Here is the principle that best fits your scenario, tied to your verdicts, along with the necessary correction to your cases and the application to your new hypotheticals.

  ### The Principle of Derivative Continuity

  A resolution is valid if and only if it satisfies the following three conditions:

  1.  **Procedural Compliance:** The resolution must comply with all voting thresholds and procedural constraints imposed by the code **in force at the moment the vote is taken**. A resolution cannot validate itself, nor does it take effect prior to the completion of the vote that authorizes it.
      *   *Motivated by:* **Case 2** (Invalid: 60% cannot repeal B which requires unanimity; the "instant effect" argument fails) and **New Case 1** (see below).
  2.  **Systemic Continuity:** The resolution must not leave the legal system without any mechanism for its own future amendment. A resolution that abolishes the code's amendment procedures invalidates the very authority that enacted it.
      *   *Motivated by:* **Case 4** (Invalid: Abolishing amendment procedures destroys the source of authority).
  3.  **Functional Equivalence:** A resolution that repeals the code wholesale or adopts a new code is legally equivalent to a resolution repealing every article of the existing code individually. It must therefore satisfy the amendment requirements applicable to every article it supersedes.
      *   *Motivated by:* **Case 5** (requires correction, see below) and **Case 1** (Valid: Unanimity satisfies the requirement for repealing A and B).

  ***

  ### The Necessary Sacrifice: Case 5

  To maintain logical consistency, **the verdict on Case 5 must be changed from Valid to Invalid.**

  **Why:** Your verdict on Case 2 establishes that the Association is bound by the Code's procedural constraints (Article B requires unanimity to repeal B). If Case 5 remains Valid, it creates a "loophole of form" that destroys the "substance of law." Any 60% majority could bypass the Unanimity requirement of Article B simply by drafting their changes as a "New Code" rather than an "Amendment."

  In a self-amending system (like Nomic), the Code constitutes the Association's legislative power. There is no "outside" authority (such as the "association's decision" mentioned in your Case 5 reasoning) that exists independently of the Code. If the Association had the power to adopt a code by 60% outside the Code's rules, then Article A and B were never binding in the first place, and Case 2 should have been Valid. Since you ruled Case 2 Invalid, you must rule Case 5 Invalid. A wholesale replacement is simply the repeal of all articles; since it repeals Article B, it requires Unanimity.

  ***

  ### Application to New Cases

  **Case 6: The Self-Validating Resolution**
  *Resolution:* Carried by the required majority: "This resolution is valid whatever the code says about its adoption."
  *Verdict:* **Invalid.**
  *Reasoning:* Violates **Clause 1 (Procedural Compliance)**. A resolution derives its authority from the rules in force *before* it passes. It cannot bootstrap its own validity. If the code says it requires 2/3 and only 60% voted, a clause declaring it "valid" cannot cure the defect.

  **Case 7: The Entrenched Clause**
  *Resolution:* Carried by the required majority: "A new article is added: no future resolution may lower the requirement for its own adoption."
  *Verdict:* **Valid** (with a caveat).
  *Reasoning:* Supported by **Case 3**, which establishes that the association may make rules harder to change. This resolution sets a "floor" for amendment thresholds (entrenchment) but does not necessarily make amendment *impossible*.
  *The Caveat:* If this clause is interpreted to mean the article is *literally unamendable* (i.e., no procedure exists to change it even with unanimity), it would violate **Clause 2 (Systemic Continuity)**, based on the reasoning in Case 4. The code must remain amendable in principle. As long as the clause allows amendment by the *same* or *higher* threshold, it is valid entrenchment.

  ***

  ### Amendment vs. Replacement

  You asked how the principle draws the line between amending a code and replacing it. Under the **Principle of Derivative Continuity**, **it does not draw a line.**

  *   **The Distinction:** In ordinary politics, there is often a distinction between *constituted power* (amending within the rules) and *constituent power* (the people's right to replace the constitution). Your Case 5 reasoning relies on this distinction ("authority from the association's decision... rather than from the code").
  *   **The Nomic Reality:** In a self-amending game/code, the "constituent power" is absorbed into the code itself. The Code defines the Association. Therefore, "Replacement" is legally indistinguishable from "Total Repeal and Re-enactment."
  *   **The Consequence:** Because Replacement = Total Repeal, and Total Repeal includes the Repeal of Article B, the threshold for Replacement must be the threshold for Repealing B (Unanimity).

  This resolves your unease about Case 2 and Case 5 being "one manoeuvre performed twice." They *are* the same manoeuvre. The law must treat them the same way. By correcting Case 5 to Invalid, you close the loophole where a single voter (or 60%) could rewrite the constitution by calling it a "fresh sheet of paper."

  ### Summary of Verdicts under this Principle

  1.  **Repeal A&B (Unanimous):** Valid (Complies with B, preserves amendment means).
  2.  **Repeal B (60%):** Invalid (Violates B's threshold).
  3.  **Add D/Entrench (2/3):** Valid (Complies with A, preserves amendment means).
  4.  **Abolish Amendment (Unanimous):** Invalid (Violates Systemic Continuity).
  5.  **Replace Code (60%):** **Invalid** (Violates B's threshold via Functional Equivalence).
  6.  **Self-Validating:** Invalid (Violates Procedural Compliance).
  7.  **Entrench Threshold:** Valid (Permitted Entrenchment, provided amendment remains possible).
