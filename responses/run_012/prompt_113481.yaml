      *   **Direct Answer:** The user's mistake is assuming the higher-order proposition is available as standard evidence in the prior. Specifically, in the case where the agent knows the impact of the experience, OC on the higher-order fact yields no update, while JC yields the intended update. This shows JC is not redundant.

