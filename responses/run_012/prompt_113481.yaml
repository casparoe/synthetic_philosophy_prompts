      *   *The Problem with the Reduction:* To conditionalize on "My credence in E is 0.7", I must have had a prior probability for that proposition *before* the update. But if I didn't know what my credence would be, how did I assign that prior? If I *did* know (certainty), conditionalizing on it changes nothing (probability 1 stays 1). But JC *does* change things.
      *   *The "Rigidity" Condition:* JC assumes that conditional probabilities $P_{new}(H|E_i) = P_{old}(H|E_i)$. The user's proposal needs to replicate this.
      *   *The "Certainty" Trap:* If the evidence for OC is "My credence is now 0.7", and I become certain of this *at the moment of update*, then prior to the update, I wasn't certain. But if I wasn't certain, how do I model the transition? If I become certain of "My credence is 0.7", then $P_{new}(\text{My credence is 0.7}) = 1$. But $P_{old}(\text{My credence is 0.7})$ must be less than 1 for OC to do work.
