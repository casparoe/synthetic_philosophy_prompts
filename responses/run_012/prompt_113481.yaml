answer: |-
  Your intuition is sharp and it is a thought that has occurred to many people working on the foundations of Bayesian updating, so you are in good company. The idea that we can reduce Jeffrey conditionalization to ordinary conditionalization by treating changes in credence as evidence about our own psychological states is elegant, but it fails in a specific way that reveals why Jeffrey conditionalization is needed as a distinct rule. To see exactly where the reduction breaks down, we need to walk through a minimal case with actual numbers, paying close attention to what your prior probability distribution must look like before the update occurs.

  Let us set up a simple world with only two possibilities: it is either Raining or Shining. At time zero, before you look out the window, your prior credence in Rain is 0.5 and your prior credence in Shine is 0.5. You look out the window, but the glass is foggy, so you do not become certain of the weather. Instead, the experience shifts your credence in Rain to 0.7 and your credence in Shine to 0.3. This is the standard Jeffrey conditionalization scenario. The Jeffrey rule tells you to update any other hypothesis H by taking your old conditional probabilities given Rain and Shine and weighting them by the new probabilities of Rain and Shine. So your new credence in H becomes 0.7 times your old credence in H given Rain plus 0.3 times your old credence in H given Shine. The crucial feature here is that the input to the update is the new distribution over the partition itself, not a proposition that becomes certain.

  Now let us try to run your proposed reduction using ordinary conditionalization. You suggest that the evidence is not Rain or Shine, but rather a higher-order proposition about your mind, let us call it E_star, which says "My credence in Rain is now 0.7". To use ordinary conditionalization on E_star, you must have had a prior probability for E_star at time zero. You also need a prior conditional probability for Rain given E_star. For ordinary conditionalization to yield the same result as Jeffrey conditionalization, it must be the case that your old credence in Rain given E_star was already 0.7. This is because if you conditionalize on E_star, your new credence in Rain becomes your old credence in Rain given E_star. So, for the two methods to agree, your prior must have already encoded the fact that if you were to find yourself with 0.7 credence in Rain, then Rain was 0.7 probable. This requirement is known as the Reflection Principle.

  The divergence appears clearly when we consider the case you mentioned where you know in advance what the experience will do to you. Suppose you know the foggy glass always leaves you with 0.7 credence in Rain regardless of the actual weather, or perhaps you simply know your own psychology well enough to predict that looking out the window will land you at 0.7. In this scenario, at time zero, you are already certain that E_star is true. Your prior probability for the proposition "My credence in Rain will be 0.7" is 1. When you look out the window and indeed find your credence is 0.7, you have learned nothing new. You have conditionalized on a proposition you were already certain of. Ordinary conditionalization on a certainty produces no change in your probabilities. Your credence in Rain would remain at 0.5. However, Jeffrey conditionalization still moves you. It takes the new distribution 0.7 over Rain as an input constraint and shifts your credence from 0.5 to 0.7. Here the two procedures come apart decisively. Ordinary conditionalization on the higher-order fact says you should not move, while Jeffrey conditionalization says you must.

  You might object that in the real case, you do not know in advance what your credence will be. Suppose instead that at time zero you are uncertain about how the experience will affect you. You think there is a 50 percent chance the foggy glass will make you 0.7 confident in Rain and a 50 percent chance it will make you 0.2 confident. Now your prior probability for E_star is 0.5, not 1, so ordinary conditionalization can technically operate. However, for this to yield the correct update, your prior must contain a specific correlation between your mental state and the world. You need your old conditional probability of Rain given E_star to be 0.7. But why should that be? E_star is a proposition about your mind, not the weather. For your mental state to be evidence about the weather, you must believe that your belief-forming mechanisms are reliable. You need a prior likelihood that says "If it is Raining, I am more likely to end up with 0.7 credence than if it is Shining". Jeffrey conditionalization does not require you to have this model of your own reliability in your prior. It simply imposes the new probabilities as a constraint. By trying to reduce Jeffrey conditionalization to ordinary conditionalization, you are shifting the burden from the updating rule to the prior probability assignment. You are forcing the agent to have probabilistic beliefs about their own future belief states and their correlation with the world before the experience happens.

  This reveals the fundamental mistake in the reductionist story. It assumes that the proposition "My credence is 0.7" is available in the prior algebra as a standard event that can be correlated with Rain. But in many cases of uncertain evidence, the agent does not have a prior opinion on what their credence will be, or cannot model the reliability of the experience in probabilistic terms beforehand. Jeffrey conditionalization is designed precisely for cases where the evidence is not a proposition that becomes certain, but a shift in probabilities that is taken as primitive. If you try to force this into ordinary conditionalization, you either end up with no update in the known-impact case, or you require a sophisticated prior model of your own psychology that Jeffrey conditionalization deliberately bypasses.

  So which one should you trust? You should trust Jeffrey conditionalization for cases of uncertain evidence, and you should not treat it as redundant. The divergence in the known-impact case shows that ordinary conditionalization on higher-order facts cannot replicate the normative force of Jeffrey conditionalization. If you know you will end up at 0.7 credence, ordinary conditionalization tells you to stay at 0.5, which implies that your experience provides no evidence about the world. But intuitively, the experience does provide evidence; it is just not conclusive evidence. Jeffrey conditionalization captures this by allowing the probabilities to shift without requiring the evidence to be certain. The higher-order story fails because it treats the change in credence as news about the self, whereas Jeffrey conditionalization treats the change in credence as the direct input of the experience itself.

  The real trouble is that the higher-order proposition cannot play the role you are asking it to play without begging the question. To make ordinary conditionalization work, you must assume in your prior that your future credences are reliable indicators of the truth, which is essentially assuming the validity of the update you are trying to derive. Jeffrey conditionalization does not assume reliability; it assumes rigidity, meaning that the conditional probabilities of other hypotheses given the partition cells remain constant. This is a different constraint. It allows you to update even when you have no prior model of how your experiences correlate with the world, provided you accept the new distribution over the partition as given. Therefore, the divergence is an argument for keeping Jeffrey conditionalization as a principle in its own right. It is not merely ordinary conditionalization in disguise; it is a distinct rule for a distinct epistemic situation where the evidence is uncertain and the agent lacks the prior higher-order probabilities required to simulate the update via ordinary conditionalization. You have identified a fascinating connection between the two, but the reduction does not hold because the prior requirements for the higher-order proposition are too strong to be plausible in the very cases where Jeffrey conditionalization is needed.
