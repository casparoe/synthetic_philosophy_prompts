      *   *JC:* I set $P_{new}(Rain) = 0.7$.
      *   *Result:* They diverge. JC seems right (I saw something foggy that suggested rain). OC seems wrong (I learned nothing).
      *   *Why OC fails:* Because "I am 0.7 confident" is not independent evidence about Rain over and above the fact that I looked. If I treat my confidence as evidence, I need $P(\text{Conf}=0.7 | \text{Rain})$. If I know the mechanism, this might be 1 regardless of Rain (if the foggy glass affects me the same way regardless). If the mechanism is sensitive to Rain, then maybe. But JC doesn't care about the mechanism, it just takes the new distribution.
      *   *Key point:* The proposition "My credence is 0.7" is not a standard event in the sample space at $t_0$ that correlates with Rain in the way required to shift the probability *unless* we stipulate the correlation. But if we stipulate the correlation to make OC work, we are essentially building JC into the prior.
