      *   The Divergence: 0.5 vs 0.7.
      *   The Reason: OC treats the credence change as news. If it's not news, no update. JC treats the credence change as a constraint.
      *   The Correlation Issue: For OC to work when uncertain, my mental state must correlate with the world. But JC doesn't require that correlation to be explicit in the prior, it imposes it as a rule (rigidity).
