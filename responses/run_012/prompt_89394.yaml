answer: |-
  **Pleasure Intuitions Quiz**
  *Answer quickly. There are no right answers yet.*

  1. Scratch an itch: stings and feels good in the same spot. Is the "good" a separate feeling?
  (A) Yes, distinct feeling. (B) No, it's your attitude to the sting. (C) Pleasure isn't a real thing.

  2. Patient says "It hurts" but smiles, unbothered. Is the pain unpleasant for them?
  (A) Yes, pain is always unpleasant. (B) No, unpleasantness is separate from pain sensation.

  3. Two taste identical wine. One thinks it's expensive, enjoys it more. Is their experience different?
  (A) Yes, the pleasure itself changed. (B) No, only their judgment changed.

  4. Glued to a movie. Later say "I enjoyed that," but felt no specific "pleasure sensation." Was enjoyment real?
  (A) Yes, enjoyment doesn't need a specific feeling. (B) No, if you didn't feel it, it wasn't pleasure.

  5. Drug makes you seek X intensely but you say X feels no better. Are you getting more pleasure?
  (A) Yes, pleasure is wanting/seeking. (B) No, pleasure is how it feels. (C) Pleasure isn't a natural kind.

  6. Listen to a sad song; feel a kind of happy sadness. Is the pleasure separate from the sadness?
  (A) Yes, pleasure is a separate ingredient mixed in. (B) No, the sadness itself is being enjoyed.

  7. A scare ends. You feel relief. Did something good get added, or did something bad just stop?
  (A) Something good was added. (B) Something bad was removed.

  8. Someone enjoys pain they know is bad for them. Is the object of pleasure the pain itself?
  (A) Yes, the pain is pleasant. (B) No, they like the pain, but the pain itself hurts.

  9. Waiting for a treat feels good. Is this pleasure in the waiting or pleasure in the treat?
  (A) Pleasure is in the wanting itself. (B) Pleasure is only in getting the treat.

  10. Two identical brain states. One caused by music, one by electrodes. Is the pleasure identical?
  (A) Yes, pleasure is entirely internal. (B) No, what causes it matters to what it is.

  ***

  **Scoring Key**

  *   **Mostly A:** **Sensation Theory.** You view pleasure as a distinctive feeling-quality present across experiences.
  *   **Mostly B (especially 1, 2, 6, 8):** **Attitude Theory.** You view pleasure as "liking" or being attracted to a state of affairs, not a specific feel.
  *   **B on 1, 2, 6; A on 3, 10:** **Mode of Experiencing.** Pleasure is a way of attending to content, not the content itself.
  *   **A on 5, 9:** **Functionalism.** Pleasure is defined by its role (reinforcement, seeking), not phenomenology.
  *   **A on 1, 2 + A on 5:** **Hybrid Theory.** Pleasure requires both a felt tone and a functional role.
  *   **Mostly C:** **Eliminativism.** You suspect "pleasure" is folk vocabulary, not a natural kind.
  *   **No Pattern (Random):** **Family Resemblance.** You see no common property, only overlapping similarities.

  ***

  **Instructor Meta-Analysis**

  **Cases that fail to pull apart positions:**
  Question 7 (Relief) is decorative. Both Sensation theorists (contrast effect) and Attitude theorists (desire satisfaction) can explain relief as either adding good or removing bad. It rarely discriminates between the seven positions. Question 9 (Anticipation) overlaps significantly with Question 5 (Pill/Desire); both test whether desire constitutes pleasure. Use only one if time is short.

  **Impossible or unstable patterns:**
  A pattern of **All B except Q5 (A)** is psychologically unstable. It claims pleasure is purely attitudinal (no feeling) yet purely functional (defined by seeking). This collapses into Functionalism, making the Attitude answers redundant. A pattern of **All A except Q10 (B)** is theoretically rare; it claims pleasure is internal sensation but depends on external causes. This view exists but is uncommon.

  **Position Clustering:**
  The quiz clusters Attitude, Mode, and Functionalism under "Mostly B." Distinguishing these three requires seminar discussion. Attitude focuses on *content* (liking the wine), Mode on *manner* (how the wine is tasted), and Functionalism on *role* (seeking the wine). The quiz identifies Sensation vs. Non-Sensation primarily; the Non-Sensation cluster must be unpacked in class. Eliminativism is captured only via Option C; without it, Eliminativists would score as Family Resemblance.
