answer: |-
  This is one of the sharpest questions I've seen about the philosophy of biology in a long time. You have accurately identified the core of the ENCODE controversy (circa 2012), which pitted biochemical activity against evolutionary constraint.

  To answer your specific questions: **No, the actual practice of annotation does not force a philosopher's choice between "Causal Role" (doing something now) and "Selected Effect" (history of selection). Instead, the practice layers them as different *types of evidence* with different confidence scores.**

  However, the tension you describe absolutely bleeds into how data is interpreted, funded, and argued over in the lab. Here is how the machinery of genome annotation actually handles this, and where your character would feel the friction.

  ### 1. The Practice: Annotation is a Pipeline, Not a Verdict
  When a geneticist "annotates" a genome, they aren't sitting there reading base pairs and stamping them "Junk" or "Treasure." They are running pipelines (software suites like MAKER, BRAKER, or Ensembl) that integrate different "tracks" of evidence.

  The practice is pragmatically agnostic, but it prioritizes **predictability**.
  *   **Track A (Biochemical/CR):** RNA-seq data (is it transcribed?), ChIP-seq (do proteins bind here?), Chromatin accessibility (is the DNA open?).
  *   **Track B (Evolutionary/SE):** Phylogenetic conservation (is this sequence identical in mice, dogs, and humans?).

  **Does the practice commit to one view?**
  No. But it treats them differently.
  *   If a region shows **Biochemical Activity** but no Conservation, the pipeline might label it `lncRNA` (long non-coding RNA) or `transcribed_region`, but it will often get a "low confidence" flag.
  *   If a region shows **Conservation** but no current Activity, the pipeline might label it `CNE` (Conserved Non-coding Element) or `pseudogene`.

  The databases (like RefSeq or UCSC Genome Browser) avoid the word "functional" almost entirely in their primary labels because it is too loaded. They use structural labels: `protein_coding`, `miRNA`, `processed_transcript`, `pseudogene`. The *interpretation* of function is left to the paper written about the data, not the data itself.

  ### 2. What Flips If You Swap the Definitions?
  If your character were to toggle the definition of "function" in her analysis pipeline, here is what would change in the output:

  **Scenario A: The "Causal Role" Switch (If it does something, it counts)**
  *   **What gets labeled Functional:** Massive expansion of `lncRNA` and `enhancer` annotations. Regions that are transcribed but quickly degraded (transcriptional noise) get counted as features. Promiscuous binding sites (where a protein sticks loosely but doesn't change cell behavior) are tagged as regulatory elements.
  *   **What gets labeled Junk:** Very little. Maybe simple satellite repeats that truly do nothing.
  *   **The Vibe:** Optimistic, discovery-heavy. Good for grant writing ("We found 20,000 new functional elements!"). Risky for clinical application (most won't matter to disease).

  **Scenario B: The "Selected Effect" Switch (If selection kept it, it counts)**
  *   **What gets labeled Functional:** Drastic reduction. Only the top 5–10% of the genome survives this filter. It keeps protein-coding genes and ultra-conserved enhancers.
  *   **What gets labeled Junk:** Most `lncRNAs`, species-specific enhancers, and recently evolved regulatory regions. Even if they do something cool *now*, if they aren't conserved, they are treated as evolutionary experiments or noise.
  *   **The Vibe:** Skeptical, conservative. Good for finding drug targets (if it survived 100 million years, it's probably important). Risky for missing human-specific traits (like brain development) that haven't had time to be "selected" deeply yet.

  ### 3. The Edge Cases (The Novel Gold)
  This is where your character's internal conflict lives. The practice handles these edge cases by creating specific categories that essentially admit the ambiguity.

  **Edge Case 1: The "Noisy Transcriber"**
  *   *The Science:* A stretch of DNA is clearly transcribed into RNA (Causal Role = Yes). But the sequence varies wildly between species, implying no selection pressure to keep it specific (Selected Effect = No).
  *   *The Label:* `lncRNA` or `processed_transcript`.
  *   *The Fight:* The "Causal Role" camp says, "It's an RNA molecule, it must regulate something!" The "Selected Effect" camp says, "Polymerase is sloppy; it bumps into things and makes noise. This is transcriptional static."
  *   *In the Lab:* Your character would see this in her data as a "hit" that disappears when she crosses it with a conservation track. She has to decide: Do I publish this as a novel regulator, or dismiss it as noise? If she dismisses it, she might miss a human-specific trait. If she publishes it, reviewers might call it junk.

  **Edge Case 2: The "Sleeping Fossil"**
  *   *The Science:* A stretch of DNA is highly conserved across mammals (Selected Effect = Yes). But in this specific tissue or organism, it is methylated and silent; nothing binds to it, it isn't transcribed (Causal Role = No).
  *   *The Label:* `pseudogene` or `conserved_region`.
  *   *The Fight:* The "Selected Effect" camp says, "It was functional, maybe it's still functional in other tissues or conditions." The "Causal Role" camp says, "It's dead. It's a scar. Calling it functional is misleading."
  *   *In the Lab:* This often happens with immune genes or olfactory receptors. Your character might find a sequence that *looks* like a gene but is broken. Is it a broken gene (junk) or a reserve tank (functional potential)?

  ### 4. How to Write the Geneticist
  If you want authenticity, your character shouldn't be arguing about the *word* "function" in the lab meeting. She should be arguing about **Evidence Weights**.

  *   **The Pragmatist:** "I don't care if selection kept it. It binds the transcription factor in *this* cell line. That's a mechanism. That's a paper." (Causal Role)
  *   **The Evolutionist:** "Anyone can bind anything if you throw enough chromatin at it. Show me the constraint. Show me that mutating it breaks the mouse. Otherwise, it's just biochemical noise." (Selected Effect)

  **The "In-Between" Reality:**
  In actual annotation files (GTF/GFF3), there is a field often called `biotype` or `gene_type`.
  *   If you use the **Causal Role** definition, your file fills up with `lincRNA`, `antisense`, `enhancer_RNA`.
  *   If you use the **Selected Effect** definition, you filter those out and keep `protein_coding` and `miRNA`.

  **The Twist for Your Story:**
  The most realistic tension isn't about the definition, but about **disease association**.
  *   If a patient has a mutation in a "Causal Role" region (transcribed but not conserved), is it the cause of their disease?
  *   If your character tells the doctor "It's probably junk (Selected Effect view)," the patient might not get treated.
  *   If she says "It's functional (Causal Role view)," they might pursue a dead-end therapy.

  **Summary for your notes:**
  The practice doesn't solve the philosophical fight; it **bureaucratizes** it. It creates separate buckets (`transcribed_region` vs. `conserved_element`) so the two camps can look at the same map and point to different legends. Your character's struggle is that biology is messy, but the database requires a binary choice: *Annotate or Ignore.*

  The "Junk" isn't usually labeled "Junk" in the database. It's labeled `repeat_region`, `low_complexity`, or simply left as `intergenic`. The act of leaving it unannotated is the quiet verdict that it doesn't matter. Your character is fighting over whether to draw a box around the emptiness.
