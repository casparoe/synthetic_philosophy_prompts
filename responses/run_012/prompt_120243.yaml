  Closest existing concepts include Tesler's Law (conservation of complexity), which states complexity cannot be eliminated, only moved. However, Tesler's Law describes a trade-off (make the system simpler, make the user work harder), not a logical dependency where each side claims the other solves the hard bit. The Problem of the Criterion addresses circular justification (knowing instances vs. knowing criteria), but this is epistemological, not engineering; your phenomenon is about implementation difficulty, not justification. Circular reasoning is distinct because premises are asserted as true; here, claims are conditional ("A is easy *if* B"). Wicked problems involve changing requirements, whereas here the goal is stable, but the locus of resistance shifts. Finally, conjunctive problems require solving A and B, both hard. Here, A and B are *conditionally* easy, creating an illusion of progress while the total hardness remains constant and unassigned. Even "Motte-and-Bailey" fails; that involves retreating to defensible positions, whereas here both positions are indefensible without the other. The key mismatch is that standard models assume hardness sums across parts; this phenomenon hides hardness in the dependencies. In a normal conjunctive problem, solving A reduces total hardness. Here, solving A is impossible without B, so claiming A is "easy" is a category error. It mimics the structure of a solution without the substance. It also differs from infinite regress; the loop is closed (A needs B, B needs A), not extending outward. The frustration stems from the validity of each step; you cannot refute the claim "A is easy given B," yet the union yields no progress.

  ### The thing itself

  The phenomenon is a decomposition failure where the interface between subproblems smuggles in the solution to the whole. Call it a system P split into components A and B. The claim is not that A and B are hard, but that A is trivial given B, and B is trivial given A. The hardness is conserved but displaced, residing in the *connection* rather than the nodes. This differs from circular reasoning because no logical fallacy occurs; the conditionals are true. The error is architectural: assuming independence where there is mutual dependency.

  Consider security engineering: "Secure Software" requires "Secure Deployment," and "Secure Deployment" requires "Secure Software." If you assume the deployment environment is trusted, securing code is trivial. If you assume the code is trusted, securing deployment is trivial. The actual hard problem—establishing trust across the boundary—vanishes from the budget.

  Another example: Medical Diagnosis. "Accurate Treatment" requires "Correct Diagnosis," and "Correct Diagnosis" requires "Successful Treatment" (in retrospective validation). If you assume the treatment works, diagnosing is easy (look for response). If you assume the diagnosis is perfect, validating treatment is easy. The hard part—isolating causality—is hidden in the loop.

  This creates research stagnation where teams specialize in A or B, publishing papers on how easy their half is, while the system remains broken. The hardness isn't missing; it's encoded in the interface specification. To solve it, one must accept a 'hard start'—admitting one side is difficult unconditionally. This breaks the symmetry. For example, in alignment, assume specification is hard and build robust checking anyway, or assume checking is hard and specify values rigidly. The trap is the desire to make both halves easy simultaneously.

  The escape route requires an external anchor. You must find a metric or mechanism that does not rely on the counterpart. In alignment, this might mean specifying values without referencing reflection, or checking outputs without referencing full understanding. You need a "ground truth" independent of the split. Until then, the difficulty simply shuttles back and forth, consuming research energy without reducing the total load. It is a zero-sum game of complexity accounting where the debt is never paid, only transferred. Recognizing this shape prevents wasted effort on subproblems that cannot be solved in isolation. It demands a redesign of the problem decomposition itself, rather than deeper dives into the components.

  ### Name

  There is no standard term, though "bootstrapping problem" captures the mutual dependency without the difficulty conservation. I propose **"Reciprocal Trivialization"**. It earns its keep by highlighting the specific mechanism: each side isn't just dependent on the other, but actively claims the other solves the hard part. This distinguishes it from mere interdependence. It signals that progress is illusory because the hardness isn't being solved, just relocated. Recognizing it forces researchers to stop trading conditional easiness and start measuring absolute difficulty.
