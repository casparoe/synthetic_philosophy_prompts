answer: |-
  **EXAMINATION PAPER: PHILOSOPHY OF SET THEORY**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the question below. This is a closed-book examination.

  **Question 1**
  Skolem's Paradox arises from the tension between Cantor's theorem (which proves the existence of uncountable sets within ZFC) and the Löwenheim–Skolem theorem (which guarantees a countable model of ZFC). Consider the following two student attempts to resolve the philosophical significance of this paradox:

  > **Reply 1:** "The paradox isn't really about sets at all. Löwenheim–Skolem gives us a model whose membership relation isn't the real one, so the 'uncountable' set in it isn't one of our sets, and Cantor's theorem is left untouched."
  >
  > **Reply 2:** "The paradox shows that countability is purely relative. Whether a set is countable depends on which model you're in, so there's no fact of the matter, and Cantor's theorem doesn't establish that there are more reals than naturals."

  Critically evaluate these replies. Which is closer to the truth, and precisely where does each go wrong? In your answer, you must explain the technical resolution of the paradox by identifying exactly where the "missing bijection" resides. Does the paradox support a relativist ontology of sets? Finally, for extra credit, explain whether formalising set theory in second-order logic with full semantics avoids the paradox, and what cost this solution incurs.

  ***

  **MODEL ANSWER**

  Skolem's Paradox is dissolved not by denying the theorems, but by distinguishing between truth *in* a model and truth *about* a model. Both replies grasp half of the picture but fail on technical precision.

  Reply 1 is closer to the standard mathematical resolution but mischaracterises the membership relation. It is correct that Cantor's theorem remains untouched; ZFC proves uncountable sets exist, and this proof holds within the countable model $M$. However, it is wrong to suggest the membership relation $\in_M$ "isn't the real one." $\in_M$ is simply the restriction of the real membership relation to the domain of $M$. It is a genuine extensional relation satisfying ZFC axioms within that domain. The "uncountable" set $S \in M$ is indeed a set in our universe, but it is countable in our universe.

  Reply 2 correctly identifies that countability is model-relative but draws an unjustified ontological conclusion. It is true that a set $S$ can be uncountable in $M$ (no bijection with $\omega$ exists *inside* $M$) yet countable in the metatheory (a bijection exists *outside* $M$). However, claiming there is "no fact of the matter" conflates semantic relativity with ontological indeterminacy. Within any fixed model, Cantor's theorem holds absolutely: there is no internal bijection. The theorem establishes that *if* you accept the axioms, you must accept uncountable sets *relative to that model*. It does not prove absolute uncountability independent of a model, but neither does it reduce cardinality to mere opinion.

  The technical resolution hinges on the location of the missing bijection. Let $M$ be a countable model of ZFC. $M$ contains a set $R$ which $M$ "thinks" is uncountable. This means $\neg \exists f \in M (f: \omega^M \to R^M \text{ is a bijection})$. However, since the domain of $M$ is countable in the metatheory, there exists a bijection $g: \text{domain}(M) \to \omega$ in the metatheory. This $g$ maps $R$ to a countable subset of $\omega$. The paradox vanishes because $g \notin M$. If $g$ were in $M$, $M$ would recognise $R$ as countable, contradicting the internal proof of Cantor's theorem. The bijection exists in the universe $V$, but not in the model $M$.

  Regarding relativism, the paradox supports semantic relativism (truth is model-relative) but not necessarily ontological relativism. We can maintain that there is a intended universe $V$ where sets are absolute, acknowledging that first-order logic cannot uniquely pin down $V$.

  For the extra credit: Formalising ZF in second-order logic (ZFC2) with full semantics does avoid Skolem's Paradox. The Löwenheim–Skolem theorem fails for second-order logic; ZFC2 is categorical for the natural numbers and fixes cardinalities absolutely (e.g., there are no countable models of the reals). However, the cost is severe. Second-order logic with full semantics lacks a complete proof system (by Gödel's incompleteness). We lose the ability to effectively enumerate truths, trading syntactic completeness for semantic determinacy. Thus, the paradox is avoided only by moving to a logic where we cannot fully formalise provability.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  | Component | Marks | Required Moves for Top Band | Common Candidate Errors |
  | :--- | :---: | :--- | :--- |
  | **Technical Resolution** (The Missing Bijection) | 5 | Explicitly states the bijection exists in the metatheory/universe ($V$) but is not an element of the model ($M$). Distinguishes $\exists f \in M$ vs $\exists f \in V$. | **The "Recitation" Trap:** Stating "it's countable outside, uncountable inside" without explaining *why* (i.e., failing to locate the function $f$). Confusing the domain of $M$ with the set $R$ inside $M$. |
  | **Critique of Reply 1** | 4 | Acknowledges it saves Cantor (Correct). Identifies the error: $\in_M$ is not "fake," it is a restriction of real $\in$ that satisfies axioms locally. | Claiming Reply 1 is totally wrong. Arguing that non-standard models imply the membership relation is illusory rather than restricted. |
  | **Critique of Reply 2** | 4 | Acknowledges relativity of countability (Correct). Identifies the error: Relativity of models $\neq$ lack of fact within a model. Cantor's theorem is internally absolute. | Conceding that Cantor's theorem is undermined. Confusing "no absolute fact across all models" with "no fact within a specific model." |
  | **Relativism Assessment** | 4 | Distinguishes semantic relativity (model-dependent truth) from ontological relativity (no real sets). Concludes paradox does not force ontological relativism. | Arguing Skolem's Paradox proves sets don't exist. Arguing it proves there is no intended model $V$. |
  | **Second-Order Logic (Bonus)** | 3 | States L-S fails for SOL (avoids paradox). Identifies cost: Loss of completeness/compactness (cannot capture provability). | Claiming SOL solves everything without cost. Claiming SOL is incomplete so it doesn't help. Confusing SOL with many-sorted first-order logic. |

  **General Guidance:**
  *   **17-20 (Distinction):** Precise distinction between object language and metalanguage. Clear location of the bijection. Nuanced view on relativism. SOL answer is technically accurate.
  *   **13-16 (Merit):** Correct technical resolution but slightly vague on the philosophical implications. May miss the nuance on $\in_M$ in Reply 1. SOL answer present but cost unclear.
  *   **10-12 (Pass):** Grasps the "inside/outside" distinction but relies on the stock phrase without elaboration. Critiques are superficial. SOL omitted or incorrect.
  *   **0-9 (Fail):** Fails to locate the bijection. Claims Cantor's theorem is false. Confuses syntax and semantics fundamentally.
