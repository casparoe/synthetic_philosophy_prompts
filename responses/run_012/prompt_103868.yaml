prompt: |-
  My block's tenants' union is voting Thursday on whether to merge with the tenants' group in the building next door. The thing we can't get past is who's allowed to vote on the merger itself. The old guard says only current members, since it's our union and our rules. The newcomers, who've been coming to meetings for months and will be bound by whatever we decide, say thats circular — the whole question is whether they count, so you can't settle it by saying they don't count. Someone suggested we just let anyone affected by the decision vote, and then someone else said fine, so the landlord gets a vote, and the shops on the street, and honestly anyone downstream of a rent strike. Now we're all just staring at each other. Is there a way out of this that isn't just whoever happens to have the votes deciding who gets to have the votes? And if there isn't, what should we actually do on Thursday? I suspect this has a name and a literature behind it — tell me what it is and how the people who've thought about it handle it, but what I really want to know is what to do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** A tenants' union is voting on a merger with a neighboring building's tenants' group.
      *   **Conflict:** Who gets to vote on the merger?
          *   *Old Guard:* Only current members (based on existing rules).
          *   *Newcomers:* Circular logic (the merger decides membership, so membership shouldn't decide the merger).
          *   *Third Option:* Anyone affected (leads to absurdity: landlord, shops, etc., get votes).
      *   **Deadline:** Voting is happening Thursday.
      *   **Core Question:** Is there a way out of this paradox? What does the literature say? What should we actually *do* on Thursday?
      *   **Underlying Issue:** This is a classic boundary problem in democratic theory and organizational governance.

  2.  **Identify the Theoretical Framework:**
      *   The user suspects there's a name and literature. They are right.
      *   **Key Concept:** The *Boundary Problem* in democratic theory.
      *   **Key Principle:** The *All-Affected Principle* vs. the *All-Subjected Principle*.
      *   **Specific Paradox:** The *Paradox of Founding* or the *Constitutive Paradox* (who decides the demos?).
      *   **Relevant Thinkers:** Robert Dahl, Frederick Whelan, Harry Brighouse, Marc Stears, social movement theory (organizing vs. mobilizing).

  3.  **Evaluate the Arguments:**
      *   *Old Guard (Constitutionalists):* Rely on existing bylaws. Strength: Stability, legitimacy of current structure. Weakness: Excludes those impacted, risks irrelevance if the merger fails due to lack of buy-in.
      *   *Newcomers (Inclusionists):* Argue for prospective membership. Strength: Democratic legitimacy, buy-in. Weakness: Circular logic, potential for "packing" the vote.
      *   *All-Affected (Universalists):* Anyone impacted. Strength: Moral consistency. Weakness: Unbounded (the "landlord" problem), impractical.

  4.  **Determine Practical Solutions (What to do on Thursday):**
      *   Theoretical purity won't solve the immediate impasse. They need a procedural workaround.
      *   *Option 1: Two-Step Vote.* Vote on *who votes* first, then vote on the merger. But who votes on who votes? (Recursion).
      *   *Option 2: Supermajority/Consensus.* Raise the threshold to ensure broad agreement regardless of electorate.
      *   *Option 3: Joint Committee.* Form a temporary merged committee to oversee the vote.
      *   *Option 4: Advisory Vote.* Make the vote non-binding, requiring ratification by both existing bodies separately.
      *   *Option 5: Facilitated Compromise.* Define "eligibility" based on a concrete criterion (e.g., signed card, attended X meetings) rather than abstract "membership."

  5.  **Drafting the Response:**

      *   **Acknowledge the Depth:** Validate that this is a known, deep philosophical/political problem. It's not just them being difficult.
      *   **Name the Problem:** The "Boundary Problem" (or *demos* problem). Mention the "All-Affected Principle."
      *   **Explain the Literature:**
          *   Robert Dahl ("Who governs?").
          *   Frederick Whelan (Democratic Theory and the Boundary Problem).
          *   The circularity is inherent; there is no perfect democratic solution to defining the demos *democratically*.
      *   **Analyze the "All-Affected" Trap:** Explain why letting the landlord vote is absurd (stakeholder vs. member distinction).
      *   **Practical Advice (The "Thursday" Plan):**
          *   *Don't try to solve the philosophy.* Solve the organizing goal.
          *   *Strategy 1: The "Dual Ratification" Model.* Both unions vote separately under their *own* existing rules. If both pass, merger happens. This bypasses the "who is in the new union" question for now.
          *   *Strategy 2: Define "Voter" by Action, not Status.* Instead of "member," use "signed a card" or "attended 2 meetings." Concrete criteria break the circularity.
          *   *Strategy 3: The "Provisional Membership" Compromise.* Newcomers get provisional votes *only* on this issue, contingent on the merger passing.
          *   *Strategy 4: Consensus over Voting.* If possible, don't vote. Seek consensus. If you can't agree on who votes, you definitely can't agree on the merger.
      *   **Warning:** If the "Old Guard" insists on strict bylaws, they risk a schism. If "Newcomers" insist on open voting, they risk illegitimacy.
      *   **Recommendation:** The "Dual Ratification" is usually the cleanest legal/organizational path. It respects existing sovereignty while requiring mutual consent.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but authoritative.
      *   Avoid jargon where possible, but use the specific terms requested.
      *   Focus on *actionable* advice for Thursday.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Suggest a facilitator. *Correction:* Good, but doesn't solve the voting eligibility.
      *   *Initial thought:* Tell them to use the All-Subjected Principle. *Correction:* Too abstract for Thursday.
      *   *Key Insight:* The merger is a contract between two existing entities. Therefore, the *existing entities* should vote according to *their own* rules. The "new" union doesn't exist yet, so its rules don't apply. This solves the circularity. The newcomers in the *old* building need to be addressed via the old building's rules (e.g., join now). The neighbors vote via *their* rules.
      *   *Wait, the prompt says:* "tenants' group in the building next door." Are they a formal union? "Tenants' group" implies less formal. "Tenants' union" implies formal.
      *   *Adjustment:* If one is informal, the "Dual Ratification" still works but needs adaptation. Let's focus on the *purpose* of the vote. It's to create a new entity.
      *   *Best Practical Solution:* A joint eligibility criterion agreed upon *before* the vote. E.g., "Anyone who lives in either building and signs this card by Wednesday." This sidesteps "current member" vs "newcomer."

  8.  **Final Polish:** Structure into "The Name," "The Theory," and "The Thursday Plan." Ensure the distinction between *stakeholders* and *members* is clear to address the landlord point.

  **(Self-Correction on the "Landlord" point):** The user mentioned the landlord getting a vote under the "all-affected" principle. I need to explain why political theory rejects this (distinction between *affected interests* and *membership in the association*). The union is an association of *tenants*, not an association of *everyone impacted by tenants*.

  9.  **Finalizing the Advice:**
      1.  Name: The Boundary Problem.
      2.  Theory: No perfect solution, requires political judgment.
      3.  Action: Dual Ratification or Agreed Eligibility Criteria.

