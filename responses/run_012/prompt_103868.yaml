answer: |-
  You have stumbled directly into one of the oldest, thorniest problems in political philosophy. It is not just your block; it is the fundamental paradox of democracy itself.

  Here is the name of the problem, what the literature says about it, and a concrete plan for Thursday.

  ### 1. The Name and The Literature
  This is called **The Boundary Problem** (sometimes the *Constitutive Paradox* or the *Problem of the Demos*).

  The core question is: *Who constitutes the "people" who get to decide?*
  *   **The Old Guard** is arguing from a **Constitutionalist** position. Legitimacy comes from following existing rules and procedures.
  *   **The Newcomers** are arguing from an **All-Affected Principle**. Legitimacy comes from the fact that the decision impacts them.
  *   **The Absurd Conclusion** (landlords voting) is the reductio ad absurdum of the All-Affected Principle.

  **What the theorists say:**
  The political theorist **Frederick Whelan** (in *Democratic Theory and the Boundary Problem*) and later **Robert Dahl** established that there is **no democratic way to decide who gets to vote democratically.** It is logically circular. You cannot vote on who gets to vote, because you first need to know who gets to vote on that vote.

  Because there is no theoretical "solution," this is never solved by logic; it is solved by **power and negotiation.**

  Regarding the landlord: Political theory distinguishes between the **All-Affected Principle** (everyone impacted) and the **All-Subjected Principle** (everyone bound by the rule). A better formulation for a union is the **All-Members Principle**. A union is a voluntary association, not a state. The landlord is *affected* by your strike, but he is not a *member* of the association. The boundary is drawn at "tenant status," not "impact." So, you can reject the landlord's vote without rejecting the Newcomers' logic, provided you define the boundary as "tenants in the relevant buildings" rather than "current card-carrying members."

  ### 2. Why You Are Stuck
  You are stuck because you are trying to use the rules of the *current* union to decide the existence of the *future* union.
  *   If only current members vote, the Newcomers are right: you are rigging the outcome.
  *   If everyone affected votes, the Old Guard is right: you have no mechanism to verify voters, and the union loses its identity as a tenant organization.

  ### 3. What To Do On Thursday (Practical Solutions)
  Since theory cannot save you, you need a procedural workaround. Do not try to solve the philosophical paradox. Solve the organizing problem. Here are three options, ranked from best to riskiest.

  #### Option A: Dual Ratification (The Cleanest Legal Path)
  Treat the merger as a treaty between two sovereign entities, not an election within one.
  *   **The Mechanism:** The existing Union votes on the merger according to its *current* bylaws. The Neighboring Group votes on the merger according to *their* rules (or a simple show of hands if they are informal).
  *   **The Catch:** This sidelines the "Newcomers" in *your* building who aren't current members.
  *   **The Fix:** To address them, the Union passes a motion *before* the merger vote to temporarily expand eligibility for *this specific vote only*.
  *   **The Criterion:** Eligibility is based on a concrete, verifiable action, not abstract status. Example: *"Anyone living in Building A or B who has attended at least one meeting in the last 3 months or signed a support card by Wednesday night can vote."*
  *   **Why this works:** It breaks the circularity. You aren't voting on "who is a member." You are voting on "who is eligible for this specific ratification." It relies on objective criteria (attendance/cards) rather than subjective status (member vs. newcomer).

  #### Option B: The "Provisional" Vote
  *   **The Mechanism:** You allow the Newcomers to vote, but their votes are marked as "Provisional."
  *   **The Condition:** The merger passes only if:
      1.  A majority of *Current Members* vote Yes.
      2.  A majority of *Newcomers* vote Yes.
      3.  The combined total is a majority.
  *   **Why this works:** It gives the Old Guard a veto (protecting the existing structure) and the Newcomers a veto (protecting their buy-in). It forces consensus. If the Old Guard outvotes the Newcomers but the Newcomers overwhelmingly say No, the merger is toxic and shouldn't happen anyway.

  #### Option C: Consensus, Not Voting (The Organizing Path)
  *   **The Mechanism:** You cancel the vote. You state clearly: *"We cannot vote on a merger we don't agree on. If we can't agree on who votes, we aren't ready to merge."*
  *   **The Action:** You spend Thursday drafting a **Joint Steering Committee**.
  *   **The Plan:** You form a temporary committee with equal representation from Old Guard, Newcomers, and the Neighboring Building. Their sole job is to write a new constitution for the *merged* union, including a definition of membership.
  *   **Why this works:** It kicks the can down the road. It acknowledges that you are currently two (or three) different groups pretending to be one. It stops the bleeding. You don't merge until you have a new constitution that everyone agrees defines membership correctly. Then you vote on the merger under the *new* rules.

  ### Recommendation for Thursday
  **Do not hold the merger vote yet.** If you hold the vote with the current ambiguity, the losers will claim the process was rigged, and the merger will fail in practice even if it passes on paper.

  **Propose this motion on Thursday:**
  > *"We acknowledge that the eligibility to vote on this merger is contested. To ensure the merger has legitimate buy-in, we suspend the merger vote. Instead, we vote to form a Joint Merger Committee (composed of Old Guard, Newcomers, and Neighbors) to draft a unified eligibility criterion and new bylaws. We will vote on the merger under those new agreed-upon rules in 30 days."*

  **Why this is your way out:**
  1.  **It validates the Newcomers:** It admits their point that the current rules are circular.
  2.  **It validates the Old Guard:** It prevents an immediate "open border" vote that might violate current bylaws.
  3.  **It solves the Landlord problem:** The Committee can explicitly define eligibility as "tenants," excluding external stakeholders.
  4.  **It tests the merger:** If you can't agree on a committee, you definitely can't agree on a merger. Better to find that out now.

  **Summary:** The literature tells you there is no perfect answer. The organizing reality tells you that **legitimacy is more important than procedure.** If half the room feels disenfranchised, the union is weaker after the vote than before it. Delay the vote, form a joint committee, and agree on the rules of the game before you play it.
