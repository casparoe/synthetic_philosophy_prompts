answer: |-
  **PRE-PRESENTATION Q&A STRATEGY SHEET**
  **Topic:** Zeno, Calculus, and the Metaphysics of Traversal
  **Venue:** Seminar Room (Broken Blinds)
  **Time:** Next Thursday

  ---

  ### 1. The Historian of Ancient Philosophy
  **Likelihood:** Certain. **Damage Potential:** Critical.
  **The Objection:** "You're treating Zeno as a proto-analyst worrying about convergence, then criticizing the analysis for not being metaphysical. But Zeno wasn't arguing that infinite sums can't be added; he was arguing that *plurality* is incoherent. By framing this as a 'task completion' problem, you're importing a modern supertask framework onto a dialectic about the One and the Many. If Zeno's target was Pythagorean number-magnitude identification, your 'non sequitur' charge hits a strawman."

  **The 2-Minute Reply:**
  "I grant the anachronism risk. I'm not claiming Zeno had the concept of a supertask. I'm claiming the *Standard Solution* (the one I'm critiquing) treats Zeno as if he were making a mathematical error about sums. Even if Zeno's original target was Pythagorean plurality, the Standard Solution says, 'Zeno is wrong because the series converges.' My point is that even *if* we accept the convergence, the metaphysical gap remains: how does a continuum get traversed? Whether Zeno meant that or not, the Standard Solution fails to address the metaphysical worry that the paradox *generates* in modern readers. I'm saving Zeno from the mathematicians, not necessarily reconstructing his historical intent."

  **Soft Spot/Concession:**
  *   **Soft Spot:** If they press that the "task" language is entirely modern and Zeno never implied a temporal process.
  *   **Concede:** "Fair. I should frame it as 'The problem the Dichotomy *raises* for modern metaphysics,' not 'The problem Zeno *intended*.' I'll adjust the intro to decouple the historical Zeno from the structural paradox."

  ### 2. The Hard-Nosed Classical Analyst
  **Likelihood:** High. **Damage Potential:** High.
  **The Objection:** "You're saying epsilons and deltas don't touch the premise that you can't complete an infinite sequence. But the Completeness Axiom *guarantees* the existence of the limit point. The runner *is* at the finish line. To say they can't 'complete the tasks' is to demand a description of the process in finite steps, which is just a demand for finitism. The real numbers *are* the ontology. If you accept the continuum, you accept the traversal. Denying this isn't metaphysics; it's just refusing the math."

  **The 2-Minute Reply:**
  "I'm not denying the math. I'm denying that the math describes the *ontology of motion*. The Completeness Axiom tells us the point *exists*, not how the body *occupies* it over time. The 'at-at' theory says motion is just being at $x_1$ at $t_1$ and $x_2$ at $t_2$. But that leaves the instantaneous velocity extrinsic. If the body's state at $t$ is fixed only by its neighbors, then nothing *at* $t$ makes it move. The math maps the trajectory, but it doesn't account for the *transition*. You're conflating the map (the reals) with the territory (the physical occupation of space)."

  **Soft Spot/Concession:**
  *   **Soft Spot:** If they argue that "transition" is a magical addition not required by physics.
  *   **Concede:** "I concede physics doesn't need 'transition' to predict outcomes. My claim is that metaphysics needs it to explain *change*. If you're satisfied with the block universe, my objection dissolves. But then we've given up on motion as a process."

  ### 3. The Department Chair (The "So What?")
  **Likelihood:** High. **Damage Potential:** Career/Project defining.
  **The Objection:** "Let's say you're right. Calculus misses the metaphysical point, and the 'at-at' theory is extrinsic. You've identified a gap. But why does this gap matter? You left the causation book unfinished because you got bogged down in foundational puzzles. Is this just another puzzle? Does this change how we understand causal powers, or is it just a semantic dispute about how we define 'velocity'?"

  **The 2-Minute Reply:**
  "It matters because if instantaneous velocity is extrinsic, then the state of an object at an instant does not determine its immediate future. That breaks the Humean supervenience base for causation. If motion isn't intrinsic, then causal powers grounded in kinematic states are suspect. This isn't just about Zeno; it's about whether the present state of the world fixes the future. If the 'at-at' theory holds, we need a global constraint to fix motion, which implies a form of holism that undermines local causation. That's why the causation project depends on this."

  **Soft Spot/Concession:**
  *   **Soft Spot:** If they smell a *reductio* of your own causation project (i.e., "So causation is impossible?").
  *   **Concede:** "It implies local causation is less robust than we think. I'm not saying causation is impossible, but that its kinematic foundation is shakier than the literature assumes. I need to be clear this motivates a revision of causation, not an abandonment."

  ### 4. The Supertask Grad Students
  **Likelihood:** Medium. **Damage Potential:** Medium (Time sink).
  **The Objection:** "If you can't complete an infinite sequence of tasks, does that mean motion is impossible? Or are you saying physical space isn't infinitely divisible? If it's the latter, aren't you just arguing for discrete space/quantum gravity? If it's the former, are you a Zenoian eliminativist about motion?"

  **The 2-Minute Reply:**
  "I'm not arguing for discrete space yet. I'm arguing that the *continuous* model fails to explain motion on its own terms. If space is continuous, and motion is 'at-at', we lose the intrinsic velocity. I'm leaving open whether that means we need a new ontology of motion (like a primitive 'flux') or whether it points to discreteness. The paper's goal is to show the Standard Solution is insufficient, not to settle the topology of space."

  **Soft Spot/Concession:**
  *   **Soft Spot:** They will try to drag you into Thomson's Lamp specifics.
  *   **Concede:** "I'm not modeling the lamp. I'm modeling the runner. Let's keep it to macroscopic motion."

  ### 5. The Constructive Analyst
  **Likelihood:** Low. **Damage Potential:** Low (They are an ally, but a weird one).
  **The Objection:** "I agree the classical continuum is a fiction, but you're using classical logic to show it fails. Why not just say the reals aren't the right tool from the start? You're trying to fix a house built on sand by reinforcing the sand."

  **The 2-Minute Reply:**
  "Because the Standard Solution *uses* classical analysis. I'm meeting them on their own ground. I want to show that even *if* you accept classical analysis, it doesn't solve the metaphysical problem. If we switch to constructive math, we avoid the problem, but we also lose the physics we're trying to explain. I want the physics *and* the metaphysics to cohere."

  ---

  ### THE "HOPE NOBODY ASKS" QUESTION
  **The Question:** "If instantaneous velocity isn't intrinsic, and the 'at-at' theory fails, are you committed to saying that **nothing moves at an instant**? If nothing moves at an instant, and time is composed of instants, how does motion happen *at all*? Are you arguing that motion is an illusion?"

  **Why it sinks you:** It forces you to either accept eliminativism (motion isn't real) or posit a mysterious "flux" that sounds like occult qualities. It corners you into the very mysticism you're trying to avoid by rejecting the calculus solution.

  **The Emergency Exit:**
  "I'm arguing that 'motion at an instant' is a category mistake. Motion is a property of intervals, but the *ground* of that property isn't just the positions. I'm not saying motion is an illusion; I'm saying the *reduction* of motion to positions is what's illusory. There is a fact of the matter about motion, but it's not exhausted by the trajectory."

  ---

  ### STRATEGIC NOTES FOR THE ROOM
  *   **The Blinds:** If the sun gets in your eyes during the Q&A, stop and fix them. It buys you 30 seconds to think and resets the room's focus.
  *   **The Chair:** Maintain eye contact during the "So What?" answer. Do not look at your notes. This is about your commitment to the broader project, not just the paper.
  *   **The Historian:** Do not fight them on philology. You will lose. Fight them on *structural relevance*. "Even if Zeno didn't mean X, the paradox generates X for us."
  *   **General:** If you get stuck on a math point, defer to the Analysts but pivot back to metaphysics. "I'll defer to [Analyst] on the topology, but my question is about the *occupation* of that topology."

  Good luck. Don't let them drag you into defending a positive theory of motion unless you're ready. Keep it negative: The Standard Solution fails. That's enough for one paper.
