      *   *Claim 2:* "At-at" theory (Russellian/Bertrand Russell) relocates the problem; instantaneous velocity is extrinsic/relational.
          *   *Vulnerability:* Is this a bug or a feature? Does physics need intrinsic velocity? (Derivative accounts).
