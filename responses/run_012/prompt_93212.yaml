prompt: |-
  Alright, I need a Q&A prep sheet, and I'm hoping you can save me from writing it at 2 a.m. the night before. Next Thursday I'm presenting to our department's metaphysics-and-phil-of-science reading group (about a dozen people, we meet in the seminar room with the broken blinds) and the paper's thesis is that the standard "calculus took care of Zeno" line is a non sequitur — that convergence of the geometric series answers an argument Zeno isn't making. The premise doing the real work in the Dichotomy and the Achilles is that you can't complete an infinite sequence of tasks, and epsilons and deltas don't touch that premise; all the series tells you is that the total distance is finite. Then I go a step further and argue that the usual modern substitute — motion is nothing over and above a body occupying different positions at different instants — relocates the problem instead of dissolving it, because on that picture the body's instantaneous velocity isn't fixed by anything true of the body at that instant; it's a limit, a relation to a neighborhood of instants, so the thing we were supposed to be explaining (the motion itself) has quietly dropped out. That's the paper.

  Here's who's in the room, since they'll each come at this from a different angle: two philosophers of math — one works on constructive analysis and thinks the classical continuum is a useful fiction, the other is a hard-nosed classical analyst who will die on the hill of the completeness of the reals; one historian of ancient philosophy who's convinced the paradoxes are really an attack on the Pythagorean identification of magnitudes with numbers and gets visibly irritated when people read Zeno as a proto-analyst; two grad students who are deep in the supertask literature (Thomson's lamp and friends) and will want to know what the paradoxes look like from the inside; and my chair, who has never forgiven me for leaving the causation book unfinished and will ask some version of "so what?"

  So: give me the prep sheet, not a defense. The objections I'm actually going to get from these people, phrased the way each of them would phrase it, ordered by how likely they are and how much damage they'd do — I want to know which two or three could actually sink the paper. For each one, a reply I could give in two minutes, plus a note on where the reply is soft and what I should just concede up front rather than get dragged into. Include the one question I'm hoping nobody asks. And please dont send me a reading list; I know the literature, I want the room, not the bibliography.
