  # Seminar Handout: The Asymmetry Decision Tree
  **Topic:** Evaluating Benatar's Argument for Antinatalism  
  **Source Material:** *Better Never to Have Been* (2006) and subsequent literature.

  ### Instructions
  This tree maps the logical space surrounding David Benatar's "Asymmetry." Begin at the root (Benatar's Four Claims) and follow the branches based on your philosophical commitments regarding value, personhood, and duty. The leaves represent distinct positions in the natalist/antinatalist debate.

  ```text
  START: Benatar's Four Claims (The Data)
  (1) Presence of Pain is Bad.
  (2) Presence of Pleasure is Good.
  (3) Absence of Pain is Good (even if no one enjoys it).
  (4) Absence of Pleasure is Not Bad (unless someone is deprived).
  │
  ├── NODE 1: The Status of Claim 3 (Absent Pain)
  │   Is the "Goodness" of absent pain a matter of Impersonal Value?
  │
  │   ├── NO: It is merely about Fitting Regret/Attitudes.
  │   │   (The asymmetry reflects psychological attitudes, not metaphysical value.)
  │   │   └──► LEAF A: The Attitudinal Reading
  │   │       [Status: Descriptive claim about human psychology; 
  │   │        Deontic conclusion underdetermined by this tree.*]
  │   │
  │   ├── NO: Absences are Value-Neutral.
  │   │   (Claim 3 is false; absent pain is neither good nor bad.)
  │   │   └──► LEAF B: The Neutralist View
  │   │       [Status: Only actual states of actual people count. 
  │   │        Deontic conclusion underdetermined by this tree.*]
  │   │
  │   └── YES: It is an Impersonal Good.
  │       (Claim 3 is axiologically true.)
  │       │
  │       ├── NODE 2: Comparativism (The Status of Claim 4)
  │       │   Can nonexistence be better or worse *for* the potential person?
  │       │
  │       │   ├── YES: Comparativism is True.
  │       │   │   (If nonexistence can be worse, absence of pleasure IS bad via deprivation.)
  │       │   │   └──► LEAF C: The Symmetry View
  │       │   │       [Status: Standard Utilitarianism/Total View. 
  │       │   │        Deontic conclusion underdetermined by this tree.*]
  │       │   │
  │       │   └── NO: Comparativism is False.
  │       │       (Nonexistence cannot be worse for one; Claim 4 holds.)
  │       │       │
  │       │       ├── NODE 3: Level of the Asymmetry
  │       │       │   Does the Axiological Asymmetry entail a Deontic Constraint?
  │       │       │
  │       │       │   ├── NO: Axiological Betterness ≠ Moral Prohibition.
  │       │       │   │   (Nonexistence is better, but creating life is not wrong.)
  │       │       │   │   └──► LEAF D: Asymmetry Accepted + Procreation Permitted
  │       │       │   │       [Status: Moderate position; accepts Benatar's value 
  │       │       │   │        theory but rejects the moral conclusion.]
  │       │       │   │
  │       │       │   └── YES: Axiological Betterness Entails Prohibition.
  │       │       │       │
  │       │       │       ├── NODE 4: The Harm Premise
  │       │       │       │   Does the argument require that *every* life contains 
  │       │       │       │   sufficient harm to make existence a net negative?
  │       │       │       │
  │       │       │       ├── YES: Universal Harm Premise Accepted.
  │       │       │       │   └──► LEAF E: Standard Asymmetry + Antinatalism
  │       │       │       │       [Status: Benatar's Position. Procreation is 
  │       │       │       │        always morally wrong.]
  │       │       │       │
  │       │       │       └── NO: Universal Harm Premise Rejected.
  │       │       │           (Some lives may be net good, yet duty remains.)
  │       │       │           └──► LEAF F: [EMPTY LEAF]
  │       │       │               [Status: Unexplored/Unstable. See Annotation 1.]
  │
  ```

  ### Annotations & Analysis

  **\* Note on Underdetermined Leaves (A, B, C):**
  This tree branches primarily on the *justification* for antinatalism derived from the Asymmetry. Consequently, it terminates at the axiological commitment for views that reject the Asymmetry (Symmetry, Neutralist, Attitudinal).
  *   **Flagged Inseparability:** The tree **cannot separate** Natalist from Antinatalist conclusions for Leaves A, B, and C. For example, a proponent of the **Symmetry View (Leaf C)** could be a Classical Utilitarian Natalist (maximize pleasure) or a Negative Utilitarian Antinatalist (minimize pain). Similarly, an **Attitudinal Reading (Leaf A)** proponent might argue our regret-attitudes ground a duty, or that they are morally inert. To separate these, a fifth node regarding "Weight of Pain vs. Pleasure" or "Source of Normativity" would be required.

  **Annotation 1: The Empty Leaf (Leaf F)**
  *   **Position:** Axiological Asymmetry + Deontic Force + No Universal Harm Premise.
  *   **Verdict:** **Unattractive / Unexplored.**
  *   **Reasoning:** This position claims there is a moral duty not to procreate based on the Asymmetry, even if some lives are likely to be net good (pleasure > pain). This is theoretically possible but practically unoccupied. Benatar argues the Deontic Force *depends* on the Universal Harm Premise (the Asymmetry makes *any* harm a decisive reason against creation, and since all lives contain harm, all creation is wrong). If one denies that all lives contain decisive harm, the Deontic Force typically collapses into Leaf D (Permissibility). Holding a strict prohibition without the empirical claim that life is always a harm renders the duty arbitrary.

  **Annotation 2: The Path to Antinatalism (Leaf E)**
  *   To arrive at **Standard Antinatalism**, one must accept the "Hard Path":
      1.  Claim 3 is **Impersonal Value** (rejecting Attitudinal/Neutralist readings).
      2.  Comparativism is **False** (rejecting Symmetry).
      3.  The Asymmetry has **Deontic Force** (rejecting the "is-ought" gap here).
      4.  **Universal Harm** is True (rejecting the possibility of a "lucky" life).
  *   *Seminar Discussion Point:* Which of these four steps is the most vulnerable to criticism?

  **Annotation 3: Coherence Check**
  *   **Incoherent Combination:** Impersonal Value (Node 1) + Comparativism True (Node 2).
      *   *Why?* If Claim 3 is an *impersonal* good (good even if no one exists), but Claim 4 is governed by *comparativism* (bad only if someone exists to be deprived), the valuation of absences relies on inconsistent metaphysical grounds. Benatar avoids this by making Claim 3 impersonal and Claim 4 person-affecting (which is why it is *not* bad). If one accepts Comparativism, Claim 4 becomes "Absent Pleasure IS Bad," collapsing the Asymmetry into Symmetry (Leaf C).
