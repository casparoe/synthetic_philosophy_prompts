answer: |-
  ### Essay Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (but quality over quantity)

  **Prompt:**

  In this course, we distinguished between two ways a false assumption can function within a model:

  *   **Scaffold Assumption:** False but dispensable. If you swap it for a more realistic (messy) truth, the model's main prediction survives or degrades gracefully. Its falseness is a matter of calculative convenience.
  *   **Keystone Assumption:** False and indispensable *within the model*. If you swap it out, the specific derivation collapses and the prediction disappears. Its falseness is load-bearing for that specific argument.

  Consider a standard economic model of a competitive market.
  *   **The Assumption:** Every firm has *perfect information* about prices and costs.
  *   **The Prediction:** Market prices will track profit opportunities efficiently (i.e., prices rise when demand rises).

  Write an essay addressing the following:

  1.  Is the perfect-information assumption a **Scaffold** or a **Keystone** for *this specific model's* prediction? Justify your classification based on what happens when you relax the assumption within the model's logic.
  2.  If you classify it as a **Keystone**, does Friedman's "F-twist" (that assumptions need not be realistic, only predictive) still allow us to call this a good model?
  3.  In your answer, you must explicitly distinguish between an assumption being a "keystone *here*" (in this model) versus a "keystone *full stop*" (for the phenomenon itself). Explain why this distinction matters for evaluating the model's success.

  ***

  ### Model Answer

  To evaluate the market model, we must first apply the scaffold/keystone distinction to the perfect-information assumption. In the context of standard competitive equilibrium models, perfect information functions as a **Keystone**. This is not merely because the assumption is false—real firms operate with uncertainty and search costs—but because the mathematical derivation of the efficient price prediction relies on it structurally. If we relax this assumption within the specific architecture of this model (introducing asymmetric information or search frictions), the equilibrium often fails to clear, or multiple equilibria emerge where prices no longer track profit opportunities efficiently. The algebra breaks, and the specific explanatory claim—that *this* mechanism guarantees efficiency—collapses. Therefore, within the bounds of this specific formalism, the assumption is load-bearing.

  This classification creates tension with Friedman's F-twist. Friedman argues that a theory should be judged solely by its predictions, not the realism of its assumptions. If the assumption is a Scaffold, Friedman's position is secure: the falsity is a harmless simplification. However, if the assumption is a Keystone, critics argue the model is "getting the right answer for the wrong reasons." If the mechanism driving the prediction (perfect information) does not exist, how can it explain the outcome? A strict reading of Friedman might suggest this doesn't matter as long as prices *do* track opportunities. However, a sophisticated application of the F-twist requires us to ask whether the model's success is accidental or robust.

  This leads to the crucial distinction between a "keystone *here*" and a "keystone *full stop*." An assumption can be indispensable to one specific model (keystone *here*) without being necessary for the phenomenon to occur in reality (keystone *full stop*). The perfect-information assumption might be required to generate the prediction in *this* mathematical framework, but that does not mean perfect information is required in the *market* for prices to track opportunities.

  Other models of the same phenomenon might derive the same prediction using different, more realistic assumptions. For example, evolutionary models might show that firms blindly following heuristics survive while others perish, resulting in efficient prices without any firm possessing perfect information. Or, learning models might show that agents converge on efficient prices through trial and error. If these alternative models yield the same headline prediction without relying on the false perfect-information assumption, then the assumption is not a keystone "full stop."

  Why does this distinction save the F-twist? Because Friedman's instrumentalism is ultimately about predictive reliability, not ontological commitment. If the assumption is a keystone *here*, the model is fragile; it cannot be pushed beyond its specific idealizations. But if the result is robust across multiple models with different assumptions, the prediction is reliable even if the original model's keystone is false. We can accept the model as "good" in the Friedmanite sense not because the false assumption is true, but because the prediction holds even when the assumption is removed in *other* valid models.

  Therefore, the perfect-information assumption is a keystone for the specific competitive model, rendering that specific derivation sensitive to its falsity. However, this does not invalidate the model's utility if the prediction is robust across a family of models. The F-twist holds only if we recognize that a model's internal dependencies do not necessarily map onto the world's causal dependencies. A good model can rest on a false keystone, provided the building stands even when that keystone is removed elsewhere.

  ***

  ### Marking Scheme (Total: 20 Points)

  **The A/B Split:**
  *   **B Level (12-15 points):** Correctly identifies the assumption as a Keystone within the model, explains why the math breaks without it, and discusses Friedman's F-twist generally.
  *   **A Level (16-20 points):** All of the above, **PLUS** successfully navigates the "Trap" by distinguishing local indispensability (in the model) from global indispensability (in the world/phenomenon) via robustness analysis.

  | Move | Points | Criteria for Full Marks | Common Error (How to lose points) |
  | :--- | :---: | :--- | :--- |
  | **1. Classification & Justification** | 5 | Identifies "Perfect Information" as a **Keystone** *for this model*. Justifies this by noting that relaxing it breaks the specific equilibrium derivation (e.g., no clearing price). | **Scaffold Misclassification:** Claiming it's a Scaffold because "economics works anyway." (Ignores the *internal* logic of the specific model). |
  | **2. F-Twist Application** | 5 | Explains the tension: A false Keystone challenges F-twist more than a false Scaffold. Acknowledges Friedman's view (predictions matter) vs. the critic's view (mechanism matters). | **Dogmatic Recitation:** Simply restating "Friedman says assumptions don't matter" without engaging with the specific problem of *indispensable* false assumptions. |
  | **3. The "Here vs. Full Stop" Distinction** | 5 | **Crucial A-Grade Move.** Explicitly distinguishes between the assumption being necessary for *this model* vs. necessary for *the phenomenon*. Mentions that other models (evolutionary, learning, etc.) could yield the same result. | **Conflation:** Treating "Keystone in the model" as proof that the assumption is "Keystone in reality." Failing to mention alternative derivations/robustness. |
  | **4. Synthesis & Conclusion** | 5 | Concludes that the model can still be "good" (F-twist valid) *if* the prediction is robust across models, even if this specific model relies on a false keystone. | **Binary Verdict:** Concluding the model is either "totally valid" or "totally useless" without nuance regarding model families/robustness. |

  **Grading Notes:**
  *   **18-20 (A):** Hits all moves. The discussion of robustness/alternative models is clear. The distinction between model-logic and world-logic is sharp.
  *   **15-17 (B+):** Hits Moves 1, 2, and 4 well, but Move 3 is vague. They might say "other models exist" but don't explain why that saves the F-twist.
  *   **12-14 (B):** Hits Moves 1 and 2. Struggles with the nuance of the Keystone trap. May argue that because it's a Keystone, Friedman is wrong (or right) without the robustness caveat.
  *   **<12 (C/F):** Fails to define terms correctly, claims the assumption is realistic, or ignores the prompt's specific definitions of Scaffold/Keystone.
