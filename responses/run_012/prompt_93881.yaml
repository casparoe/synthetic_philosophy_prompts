  ### Preamble: Contested Interpretations

  Before applying the decision tree, note that the structure itself encodes a specific taxonomy of the problem: it assumes the response to the monster must locate the error in one of four distinct components (Welfare/Measurement, Axiology, Aggregation, or Usability). This is **contested**. Some philosophers argue the monster is *only* a problem for hedonistic conceptions of welfare (collapsing Level 1 and 2), while others argue it is *only* a problem for aggregation rules (collapsing Level 2 and 3). The tree below treats these as distinct branching points to maximize resolution, but respondents who view the case as a unified attack on "classical utilitarianism" may reject the branching logic itself.

  ***

  ### The Decision Tree

  **Root Commitment:** Respondents accept the stipulation that, in the described case, the sum of welfare is maximized by sacrificing the many for the monster. The tree branches by what the respondent denies to avoid the conclusion.

  #### Level 1: Measurement and Possibility
  **Question:** In the **bounded monster (b)** or **marginal monster (f)** scenarios, does the scenario describe a coherent, measurable state of affairs, or does it rely on magnitudes that are empirically impossible, conceptually incoherent, or unknowable?

  *   **Branch A (Magnitudes are impossible/unknowable):** Go to Leaves 1–3.
  *   **Branch B (Magnitudes are coherent/measurable):** Go to Level 2.

  #### Level 2: Conception of Welfare
  **Question:** If the magnitudes are coherent, does the **parasitic monster (d)** or **reverse monster (c)** show that the *source* or *type* of experience determines its value, or is value determined solely by intensity/duration?

  *   **Branch A (Source/Type matters):** Go to Leaves 4–6.
  *   **Branch B (Value is quantitative/neutral):** Go to Level 3.

  #### Level 3: Aggregation and Structure
  **Question:** If value is quantitative, does the **composite monster (e)** imply we should sum all units equally, or does the distribution across persons (or the fact they are persons) alter the ranking?

  *   **Branch A (Distribution/Structure alters ranking):** Go to Leaves 7–12.
  *   **Branch B (Sum all units equally):** Go to Level 4.

  #### Level 4: Practical Usability
  **Question:** If the sum ranks the sacrifice as best, does this ranking necessarily permit or require an agent to bring it about?

  *   **Branch A (Ranking does not dictate action):** Go to Leaves 13–14.
  *   **Branch B (Ranking dictates action):** Go to Leaf 15.

  ***

  ### Leaves

  **From Level 1, Branch A (Magnitudes are impossible/unknowable)**
  1.  **Impossibility Response (Empirical):** *Awkward Commitment:* Relies on contingent facts about psychology or physics that might change, leaving the theory vulnerable to future discoveries.
  2.  **Impossibility Response (Conceptual):** *Awkward Commitment:* Denies the conceptual coherence of interpersonal comparison at extremes, potentially undermining comparison in ordinary cases.
  3.  **Epistemic Response:** *Awkward Commitment:* Makes the theory action-guiding only in easy cases, leaving hard cases morally indeterminate.

  **From Level 2, Branch A (Source/Type matters)**
  4.  **Meta-Response (Begs question against hedonism):** *Awkward Commitment:* Concedes the argument works if hedonism is true, retreating to a defense of the welfare conception rather than the aggregation.
  5.  **Objective-List Axiology:** *Awkward Commitment:* Must specify the list of goods without arbitrariness, often struggling to explain why list-items outweigh intense pleasure.
  6.  **Value Pluralism or Incommensurability:** *Awkward Commitment:* Offers no rule for resolving clashes between incommensurable values, potentially paralyzing decision-making.

  **From Level 3, Branch A (Distribution/Structure alters ranking)**
  7.  **Moorean Value Holism:** *Awkward Commitment:* Makes value calculation opaque, as the value of the whole cannot be derived from the values of the parts.
  8.  **Average Utilitarianism:** *Awkward Commitment:* May recommend killing the unhappy or preventing the existence of those with below-average welfare to raise the mean.
  9.  **Prioritarianism:** *Awkward Commitment:* Requires a metric for 'worse off' that is distinct from welfare levels to avoid collapsing into utilitarianism.
  10. **Sufficientarianism:** *Awkward Commitment:* Remains indifferent to massive inequalities above the sufficiency threshold, even if resources could be better used.
  11. **Lexical or Leximin Rule:** *Awkward Commitment:* Sacrifices huge gains for many to help the worst-off slightly, leading to counterintuitive resource allocations.
  12. **Person-Affecting Restriction:** *Awkward Commitment:* Struggles to account for obligations to future generations or cases where no particular existing person is harmed.

  **From Level 4, Branch A (Ranking does not dictate action)**
  13. **Agent-Relative Constraints:** *Awkward Commitment:* May forbid preventing greater violations by others if doing so requires violating the constraint oneself.
  14. **Agent-Relative Prerogatives:** *Awkward Commitment:* Permits sub-optimal outcomes without reason, potentially allowing agents to ignore significant moral gains.

  **From Level 4, Branch B (Ranking dictates action)**
  15. **Total Utilitarianism (Accepts Conclusion):** *Awkward Commitment:* Requires sacrificing the many for the one if the sum is higher, contradicting common moral intuitions about rights.

  ***

  ### Unoccupied Combinations

  **1. The "Qualitative Summation" Combination**
  *   **Path:** Level 1 (Yes, Coherent) → Level 2 (Yes, Source Matters) → Level 3 (Yes, Sum Equally).
  *   **Diagnosis:** **Incoherent.** If the source or type of welfare determines its value (Level 2A), one cannot consistently claim that all units should be summed equally regardless of type (Level 3B). A view that holds welfare is qualitative must reject simple summation.

  **2. The "Incoherent Impossibility" Combination**
  *   **Path:** Level 1 (Yes, Coherent) → Level 1 (No, Unknowable).
  *   **Diagnosis:** **Contradictory.** One cannot assert the scenario is coherent and measurable while simultaneously claiming the magnitudes are unknowable. This is why the Epistemic Response and the Impossibility Responses occupy the same branch but distinct leaves; they cannot be held simultaneously regarding the same magnitude.

  ### Inseparable Leaves

  **1. Prioritarianism (Leaf 9) and Lexical/Leximin Rule (Leaf 11)**
  *   **Why Inseparable:** Both answer "Distribution alters ranking" at Level 3. The tree does not distinguish *how* the distribution alters the ranking (smooth weighting vs. absolute priority).
  *   **Separating Case:** A **trade-off case** where the worst-off person gains a trivial amount of welfare, but the better-off lose a massive amount. Leximin forbids this trade (absolute priority); Prioritarianism might allow it if the weighted sum still increases (smooth weighting).

  **2. Agent-Relative Constraints (Leaf 13) and Agent-Relative Prerogatives (Leaf 14)**
  *   **Why Inseparable:** Both answer "Ranking does not dictate action" at Level 4. The tree distinguishes the *result* (action not required) but not the *modal status* of the action (forbidden vs. optional).
  *   **Separating Case:** A **failure to save case** where the agent does not sacrifice anyone but merely fails to maximize the good (e.g., keeping resources for oneself rather than saving a distant stranger). Constraints typically permit this; Prerogatives explicitly protect this; but a case where the agent *must* harm one to save two would separate them (Constraints forbid the harm; Prerogatives might allow the failure to save).

  **3. Impossibility Response Empirical (Leaf 1) and Conceptual (Leaf 2)**
  *   **Why Inseparable:** Both answer "Magnitudes are impossible" at Level 1. The tree does not distinguish the *ground* of the impossibility.
  *   **Separating Case:** A **physically possible but logically extreme case**. If a being is constructed biologically to feel immense pleasure (Empirically possible) but the concept of 'units of pleasure' breaks down at that scale (Conceptually incoherent), the views diverge. The Empirical view accepts the case; the Conceptual view rejects it.

  ### Settled vs. Contested

  **Settled:**
  *   There is consensus that the Utility Monster is a *reductio* argument intended to test the limits of a theory.
  *   There is consensus that the case relies on interpersonal comparisons of welfare magnitude.
  *   There is consensus that Total Utilitarianism (Leaf 15) accepts the conclusion as stated in the root commitment.

  **Contested:**
  *   **The Location of the Fault:** As noted in the preamble, there is no consensus on whether the monster attacks the conception of welfare (Level 2), the aggregation rule (Level 3), or the deontic link (Level 4). Some argue the case is *only* intelligible if one already accepts a hedonistic axiology, making it a circular attack on hedonism rather than aggregation.
  *   **The Coherence of the Case:** There is no consensus on whether the "bounded monster" (Case b) successfully neutralizes the "impossibility" objections. Some argue that even a bounded monster requires welfare magnitudes that are conceptually incoherent, while others argue it is merely empirically unlikely.
  *   **The Relevance of Parasitism:** There is disagreement over whether the **parasitic monster (Case d)** is a distinct case or merely a variant of the classic monster. If welfare is purely mental, the source should not matter; if the source matters, the case is not a "utility monster" in the strict sense but a challenge to the definition of utility.
