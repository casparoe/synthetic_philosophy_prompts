      *   **Term:** *Conversational Implicature* (specifically generated by the flouting of the Maxim of Quantity).
      *   **Specific Sub-type:** *Scalar Implicature* is related (saying "some" implies "not all"), but the reference letter case is often cited as a *Generalized Conversational Implicature* or simply an inference based on the *Maxim of Quantity*.
