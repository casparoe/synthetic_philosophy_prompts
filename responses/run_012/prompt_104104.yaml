answer: |-
  The phenomenon you are describing sits at the intersection of linguistics, philosophy of language, and ethics. While there is no single word that captures every nuance you outlined, there is a precise technical framework for it, a specific rhetorical label, and a growing body of literature on its strategic use.

  Here is the carving you are looking for.

  ### 1. The Technical Mechanism: Conversational Implicature
  The specific mechanism is **Conversational Implicature**, as defined by the philosopher H.P. Grice. In fact, the exact example you gave (the letter of reference) is the canonical example Grice used in his 1975 paper *"Logic and Conversation"* to illustrate the concept.

  The engine driving this inference is the **Maxim of Quantity**, one of Grice's four "Cooperative Principle" maxims. The Maxim of Quantity states:
  1.  Make your contribution as informative as is required.
  2.  Do not make your contribution more informative than is required.

  **How it works:**
  When a landlord is asked for a reference, the context creates an expectation that they will provide all relevant positive information available. By stating only that the tenant "paid rent on time," the landlord provides *less* information than is required for the purpose of the reference. The hearer assumes the landlord is still being cooperative (adhering to the overarching Cooperative Principle). Therefore, the hearer reasons: *If the tenant were good in other ways, the landlord would have said so. Since the landlord did not say so, the tenant must not be good in other ways.*

  ### 2. The Strategic Feature: Deniable Implicature
  You asked specifically about the speaker's ability to retreat to the literal content. In contemporary pragmatics and legal theory, this is often referred to as **Deniable Implicature** or **Strategic Implicature**.

  This distinguishes the mechanism from ordinary communication. In standard conversation, if you say "It's cold in here" to imply "Close the window," and the listener says "So?", you cannot credibly say, "I didn't mean close the window." The implicature is mutually accepted.

  In the reference letter case, the speaker *invites* the negative inference but structures the utterance so they can **disavow** the inference if challenged. This relies on the distinction between:
  *   **What is said:** The literal, truth-conditional content (The tenant paid rent).
  *   **What is implicated:** The inferred meaning (The tenant is otherwise undesirable).

  The speaker owns *what is said*; the hearer generates *what is implicated*. Because the negative judgment exists only in the hearer's inference, the speaker can claim, "I never said he was a bad tenant. I only mentioned the rent. You are reading too much into it."

  ### 3. The Rhetorical Label: Damning with Faint Praise
  The idiomatic term for this specific pattern is **Damning with Faint Praise**. This captures the tonal quality: the statement is technically positive ("paid on time," "never missed class"), but its weakness relative to the context serves as the condemnation.

  ### 4. Boundaries and Distinctions (The Carving)
  You asked how this differs from lying, insinuation, and hinting. Here are the boundaries:

  **Vs. Lying**
  *   **Lying:** Requires asserting a proposition the speaker believes to be false.
  *   **This Pattern:** Every proposition asserted is true. The deception (if any) lies in the *management of expectations*, not the truth value of the statements.
  *   **The Retreat:** A liar cannot retreat to the literal truth without being caught in a falsehood. This speaker can retreat because the literal truth is their shield.

  **Vs. Insinuation**
  *   **Insinuation:** Often suggests a specific negative fact that the speaker is unwilling to state directly (e.g., "I wouldn't want my daughter alone with him"). It often carries a tone of malice or gossip.
  *   **This Pattern:** Suggests the *absence* of positive facts rather than the *presence* of negative ones. It is more bureaucratic and sterile. It relies on the *silence* regarding virtues rather than the *whisper* of vices.

  **Vs. Hinting**
  *   **Hinting:** Usually cooperative. Both parties want the message to be understood, but social norms prevent direct statement (e.g., hinting you want to leave a party).
  *   **This Pattern:** Often adversarial or evasive. The speaker wants the hearer to understand the negative (to warn them) but wants to avoid the social or legal cost of stating it (libel, burning bridges).

  **Vs. Paltering**
  *   **Paltering:** This is a related term from deception studies. It refers to the active use of truthful statements to create a false impression. Your example is a form of paltering, but paltering is broader (it can include active distraction). Your example is specifically *paltering via omission of expected informativeness*.

  ### 5. Entitlement: Is the Hearer Right?
  This is the normative crux of the issue.

  **Pragmatic Entitlement:**
  Yes, the hearer is entitled to the inference. In Gricean theory, communication is a rational activity. If we assume the speaker is following the Cooperative Principle, the inference is logically necessary. To ignore the omission is to assume the speaker is incompetent or irrelevant. Therefore, the inference is the *rational* interpretation.

  **Semantic/Contractual Entitlement:**
  No, the hearer is not entitled to the inference in a formal sense. Because the negative judgment was not encoded in the semantics of the sentence, the speaker has not formally committed to it. In a court of law or a formal grievance, the speaker wins. They did not defame the tenant; they merely failed to praise them.

  **Why the Truth Matters:**
  You asked whether it matters that the speaker can retreat precisely because what was said was true. **Yes, it is essential.**
  If the statement were false ("He paid rent on time" when he didn't), the speaker would be liable for lying. The "retreat" only works because the literal floor is solid. The truth of the statement grants the speaker the **moral license to be uninformative.** It converts what could be deception into "mere" withholding.

  ### Summary of Terms
  If you need to label this in different contexts, use these:

  1.  **Linguistic/Philosophical:** *Implicature generated by flouting the Maxim of Quantity.*
  2.  **Rhetorical:** *Damning with Faint Praise.*
  3.  **Ethical/Deception Studies:** *Paltering* or *Truthful Misleading.*
  4.  **Functional:** *Plausible Deniability via Omission.*

  ### The "Carving" Conclusion
  The phenomenon is not a "hint" (which is cooperative) nor a "lie" (which is false). It is a **strategic exploitation of the gap between semantic content and pragmatic expectation.**

  The speaker leverages the hearer's rationality against them. The speaker knows the hearer is smart enough to infer the negative, but relies on the fact that the inference is not *binding*. The message is carried not by the words, but by the **calculated silence** where stronger words should have been. The hearer is rationally justified in the inference, but legally/semantically unprotected in acting on it.
