answer: |-
  (1) "His verdict, my guess"
  Ade will oppose the cap. He'll argue that while the app has exclusivity, drivers aren't trapped because free street parking and public transit remain available alternatives. He'll view the fee as a price for convenience, not a coercive toll.

  (2) "The rules that fit"
  Rule One is the Efficiency Principle: prices must float to signal scarcity and incentivize supply. This explains his opposition to rent control, minimum wage, hurricane gouging laws, and hotel caps. It treats high prices as necessary features, not bugs, ensuring resources go to those valuing them most. Rule Two is the Coercion Constraint: price caps are permissible only when consumers lack meaningful alternatives and face monopolistic coercion. This explains his support for payday loan caps (no other credit) and opposition to cable caps (5G exists). The tension lies in defining "meaningful alternative." Rule One demands strictly non-interference generally; Rule Two carves out exceptions for trapped consumers. Ade uses Rule One as the default and Rule Two as the emergency brake. When Rule Two applies, like payday loans, he admits the market isn't functioning as a market but as a toll booth extracting rent. When it doesn't, like cable or housing, Rule One dominates. His record holds only if the distinction between a "high price" and a "toll" hinges entirely on realistic substitutability rather than the necessity of the good itself. Ultimately, he believes markets work unless they are rigged.

  (3) "Where they split on the parking fee"
  Rule One predicts opposition: capping the fee distorts the signal, potentially overcrowding the app zones or reducing app maintenance investment. The price rations the convenient spots. Rule Two is the battleground. If the app is deemed a "toll booth" because the contract blocks competitors, Rule Two might support a cap. However, Ade likely views the free street parking and bus as sufficient substitutes, mirroring the cable/5G logic. If the walk is too far or bus too unreliable, Rule Two triggers support for caps. The split depends on whether Ade views the exclusive contract as creating a coercive trap or merely a premium service option. If he sees the side streets as a valid escape hatch, Rule One wins. If he sees the contract as barring entry to a essential service without competition, Rule Two wins. The verdict hinges on how "trapped" the driver really is.

  (4) "My best guess"
  He's running Rule One (Efficiency) with Rule Two (Coercion) as a narrow exception. Since free parking and buses exist, he'll see this as a choice, not a trap, aligning with the cable case. He'll oppose the cap. The inconsistency risk lies in subjective substitutability: is 5G really like cable? Is walking three blocks like finding another lender? Ade assumes rational actors with options. If he admits the street parking is unsafe or the bus nonexistent, his record cracks. But assuming functional alternatives, he stays consistent. He views the app fee as buying time, not accessing survival credit.

  (5) "The case that would settle it"
  Test him on a single-provider electricity utility in a deregulated zone where switching providers is technically possible but practically impossible due to infrastructure costs. If he supports caps there, he prioritizes the Coercion Constraint (infrastructure lock-in). If he opposes caps because "you can move houses," he prioritizes the Efficiency Principle absolutely. This distinguishes whether "substitutes" must be frictionless or merely theoretical. It clarifies if his payday loan stance was about survival or lack of competition. A verdict here reveals if his threshold for coercion is high friction or total impossibility.
