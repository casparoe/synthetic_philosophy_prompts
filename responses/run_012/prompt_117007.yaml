prompt: |-
  I'm running a 75-minute session on modal realism for second-year undergrads who've had a bit of modal logic but no metaphysics, and I want a teaching plan, not an explanation of the view. What I keep getting wrong is the order. They've met possible worlds as harmless bookkeeping devices in semantics, so the whole difficulty is making them feel the step from "worlds are just useful posits / ways things could be" to "worlds are concrete universes of the same kind as this one," and then making the price of that step feel real rather than absurd. They'll also reach straight for "a world is just a maximal description of how things could be" and I want the sequence to make them see what that costs, without turning into a survey of alternatives. Plan it: what has to come first and what depends on what, which single example should carry the whole thing and what it must have and lack (and why the obvious sci-fi "alternate universe" example, or "a world where I had toast instead", wont do the work), where the indexical treatment of "actual" comes in — the way "now" is supposed to be indexical on a B-theory of time, or "here" on a map — and at which point that analogy breaks down and stops being helpful. Then the misconceptions they'll predictably form (my guesses: a possible world is a distant place you could in principle get to; if everything happens somewhere then nothing matters or everything is permitted; "concrete" means physical; actuality is a special intrinsic property some worlds have and ours happens to have) with exactly where in the sequence each should be headed off, one closing question that would show whether they've actually got the view, and what I should openly refuse to explain at this level and say so out loud.

  Give it to me as JSON with these fields: sequence (array of {step, idea, depends_on, why_here}), carrying_example ({example, must_have, must_lack, why_not_the_obvious_one}), misconceptions (array of {misconception, where_in_sequence, how_to_head_it_off}), check_for_understanding ({question, what_a_good_answer_looks_like, what_a_bad_one_looks_like}), and leave_out (array of {thing, why}).
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Modal Realism (David Lewis).
      *   **Audience:** 2nd-year undergrads. Some modal logic, no metaphysics.
      *   **Duration:** 75 minutes.
      *   **Goal:** A teaching plan (sequence/order), not an explanation of the view.
      *   **Key Challenge:** Bridging the gap from "possible worlds as semantic tools" to "possible worlds as concrete universes." Making the "price" feel real. Avoiding the "maximal description" trap early on.
      *   **Specific Requirements:**
          *   JSON format.
          *   Fields: `sequence`, `carrying_example`, `misconceptions`, `check_for_understanding`, `leave_out`.
          *   Specific focus on the indexical treatment of "actual" (analogy to "now"/"here" and where it breaks).
          *   Specific focus on why obvious sci-fi/toast examples won't work.
          *   Specific focus on misconceptions and where to head them off.
          *   Specific focus on what to leave out.

  2.  **Deconstruct the Content & Sequence:**
      *   *Starting Point:* Students know possible worlds semantics (Kripke semantics). They think worlds are sets of sentences or abstract states of affairs.
      *   *The Pivot:* Lewis says "No, they are concrete." Why? Because abstract worlds can't causally interact or ground modality robustly (though maybe don't dive too deep into the *argument* for realism, focus on *what* the view is first). Actually, the prompt says "making the price of that step feel real." So I need to establish the view clearly before debating it.
      *   *The Carrying Example:* Needs to be something that shows *isolation* and *concreteness*. "Toast vs. Cereal" is too trivial. "Sci-fi alternate universe" suggests travel or branching. Lewisian worlds are spatiotemporally isolated. A better example might be something involving *counterfactuals about existence* or *radical difference* that emphasizes isolation. Maybe a world where *I* don't exist, but a counterpart does. Or simply the concept of "Blue Swans" but emphasizing the *physicality* of the swans. Let's go with a "Counterpart" example involving a specific individual choice that leads to divergent lives, but emphasizing the *other* person is not *me*. Actually, the prompt asks for *one* carrying example. Let's choose "The World Where You Never Were Born." It highlights concreteness (there are physical people there), isolation (you can't visit), and the indexical nature of "actual" (to them, they are actual).
      *   *Indexicality of "Actual":* This is crucial. It comes after establishing concreteness and isolation. Analogy: "Here" and "Now". Breakdown: "Here" and "Now" are parts of *this* world. "Actual" picks out *this* world from the outside (which we can't do).
      *   *Misconceptions:* Travel, Morality (everything is permitted), Physicality, Special Property of Actuality.
      *   *Leave Out:* Plantinga's abstract worlds, Kripke's critique in depth, Quantified Modal Logic details, Counterpart theory details (too much for 75 mins if focusing on realism itself, though counterparts are needed for transworld identity). Actually, Counterpart Theory is essential to Lewisian Modal Realism to solve the transworld identity problem. I should mention it but not derive it fully. The prompt says "no metaphysics" background, so keep it intuitive.
      *   *Closing Question:* Needs to test if they grasp the *indexicality* and *concreteness*.

  3.  **Drafting the Sequence:**
      1.  *Recap:* Worlds as semantic tools (what they know).
      2.  *The Problem:* What *are* these things? Abstract vs. Concrete.
      3.  *The Lewisian Claim:* Concrete, isolated, exhaustive.
      4.  *The Carrying Example:* "The World Where You Never Were Born." Use this to illustrate concreteness (there are physical parents there who didn't meet) and isolation.
      5.  *Indexicality:* "Actual" is like "Here".
      6.  *The Cost:* Ontological extravagance.
      7.  *Misconception Check:* Address travel, morality, etc.

      *Refining the Sequence for the Prompt's constraints:*
      The prompt emphasizes the *step* from useful posit to concrete universe.
      Step 1: Establish the semantic utility (their baseline).
      Step 2: Introduce the "What are they?" question. Contrast Abstract (descriptions) vs. Concrete (universes).
      Step 3: Deploy the Carrying Example to force the Concrete intuition (why abstract descriptions fail to ground truthmakers).
      Step 4: Define Isolation (Spatiotemporal). This kills the "travel" misconception.
      Step 5: Introduce "Actual" as Indexical. This kills the "special property" misconception.
      Step 6: The Price (Parsimony).

      *Refining the Carrying Example:*
      Prompt says: "why the obvious sci-fi 'alternate universe' example, or 'a world where I had toast instead', wont do the work."
      Why won't they work?
      *   Toast: Too trivial, suggests branching time or easy access.
      *   Sci-Fi: Suggests travel or connection.
      *   Needs: To emphasize *isolation* and *concreteness* without suggesting *accessibility*.
      *   Idea: "The World Where Dinosaurs Never Went Extinct." It shows physical reality (concrete dinos), isolation (we can't go there), and radical difference. But maybe something more personal regarding the indexicality.
      *   Better Idea: "The World Where Your Parents Never Met." It involves *you* (or a counterpart), it's concrete (physical parents), it's isolated (you can't go meet them), and it highlights the indexicality of "actual" (to them, *they* are actual).
      *   Must Have: Physicality, Isolation, Counterpart relation (implicit).
      *   Must Lack: Causal connection, Temporal branching, Travel possibility.

      *Refining Indexicality:*
      Analogy: "Here" on a map.
      Breakdown: On a map, you can see all locations. In modal realism, you cannot see all worlds from a "god's eye" view within the system. We are stuck in one.

      *Refining Misconceptions:*
      1.  Travel: Head off at Isolation step.
      2.  Morality/Nihilism: Head off at Indexicality/Actuality step (my actions matter *here*).
      3.  Abstract Descriptions: Head off at the Concrete vs. Abstract step.
      4.  Special Actuality: Head off at Indexicality step.

      *Refining Leave Out:*
      1.  Counterpart Theory mechanics (too technical).
      2.  Plantinga's Abstract Realism (distracts from Lewis).
      3.  The Argument from Parsimony (deep dive).
      4.  Quantified Modal Logic syntax.

      *Refining Check for Understanding:*
      Question needs to test indexicality + concreteness.
      "If I say 'I could have been a poet', what exists according to Lewis?"
      Good: A concrete person (counterpart) in a concrete isolated universe who writes poetry.
      Bad: A description in a book, or me literally being there.

  4.  **Constructing the JSON:**
      *   Ensure valid JSON syntax (quotes, commas, brackets).
      *   Ensure all fields are present.
      *   Check constraints: 75 mins (sequence should fit), 2nd year undergrads (level appropriate).

      *Self-Correction on Sequence:*
      Make sure the "Indexical" step comes *after* "Concrete/Isolated" but *before* "The Price". If you don't understand isolation, indexicality doesn't make sense. If you don't understand indexicality, the price seems absurd (why care about *this* one?).
      Actually, the prompt asks: "where the indexical treatment of 'actual' comes in... and at which point that analogy breaks down". This needs to be explicit in the sequence or the example section. I will put it in the sequence.

      *Self-Correction on Example:*
      The prompt asks for *one* carrying example. I need to make sure it's robust enough to carry the weight of concreteness, isolation, and indexicality.
      Example: "The World Where You Were Never Born."
      Why not toast? Toast implies *you* exist in both. Lewis says *you* are world-bound. So "You never born" forces the Counterpart intuition without needing the technical term immediately. It shows concreteness (there is a physical absence of you, presence of others) and isolation.
      Wait, if I was never born, there is no counterpart? Lewis usually handles "I could have been F" with counterparts. "I could have not existed" is tricky.
      Let's go with: "The World Where You Are a Professional Pianist."
      Why not toast? Toast is too close. Pianist requires a life divergence.
      Must Have: A physical person who looks like you, lives a life, but is *not* you.
      Must Lack: Any causal link to this room.
      Why not obvious sci-fi? Sci-fi implies portals. Lewis implies no portals.

      *Wait, one more constraint:* "making the price of that step feel real rather than absurd."
      This needs to be the climax of the session.

      *Let's finalize the JSON structure.*
      `sequence`: array of objects.
      `carrying_example`: object.
      `misconceptions`: array of objects.
      `check_for_understanding`: object.
      `leave_out`: array of objects.

      *Drafting content:*
      Step 1: Semantic Utility (5 mins).
      Step 2: The Ontological Question (10 mins).
      Step 3: The Carrying Example - Concreteness (15 mins).
      Step 4: Spatiotemporal Isolation (10 mins).
      Step 5: Indexicality of 'Actual' (15 mins).
      Step 6: The Price & Evaluation (15 mins).
      Step 7: Q&A / Check (5 mins).
      Total 75.

      *Misconceptions:*
      1.  "Worlds are descriptions." -> Head off at Step 2/3.
      2.  "I can travel there." -> Head off at Step 4.
      3.  "Actual is special." -> Head off at Step 5.
      4.  "Nothing matters." -> Head off at Step 5/6.

      *Leave Out:*
      1.  Counterpart Theory formalism.
      2.  Plantinga.
      3.  Epistemic access arguments.

      *Check:*
      Question: "Where is the world where you had toast?"
      Good: It's not 'where', it's isolated. It contains a counterpart.
      Bad: It's in my mind / It's far away in space.

      *Refining the Indexical Breakdown:*
      Analogy: "Here" on a map.
      Breakdown: On a map, all locations are equally real and visible. In Modal Realism, all worlds are equally real, but *not* visible from one another. The "map" implies a container space; Lewisian worlds *are* the space.

      *Let's write the JSON.*
      Watch out for escape characters in strings.
      Ensure the tone is instructional.

      *One detail:* "what I should openly refuse to explain at this level and say so out loud." -> `leave_out` field.

      *Final check on constraints:*
      - JSON format.
      - Specific fields.
      - Teaching plan focus (not explanation).
      - Address the "order" difficulty.
      - Address the "example" difficulty.
      - Address the "indexical" difficulty.
      - Address misconceptions.

      *Wait, one nuance:* The prompt says "which single example should carry the whole thing". I need to make sure the `carrying_example` field explains *how* it carries the whole thing (must_have, must_lack).
      Also, "where the indexical treatment... comes in... and at which point that analogy breaks down". I should include this in the `sequence` or `carrying_example`? The prompt asks for it in the plan. I'll put the breakdown point in the `sequence` step where indexicality is taught, and reference the analogy in `carrying_example` or `sequence`. I'll put the analogy details in the `sequence` step for clarity on *when* it happens.

      *Re-evaluating the Example:*
      "The World Where You Are a Pianist."
      Why not toast? Toast is a momentary difference. Pianist is a life difference.
      Why not Sci-Fi? Sci-fi suggests branching or travel.
      Must Have: A concrete person (counterpart) doing concrete things.
      Must Lack: Causal connection to us.
      This works.

      *Re-evaluating the Indexical Analogy:*
      Analogy: "Now" on a timeline (B-theory).
      Breakdown: We can remember the past. We cannot perceive other worlds.
      Or "Here" on a map.
      Breakdown: A map is a single object containing all locations. Modal reality is not a single object containing all worlds; each world is a separate concrete entity.
      I will use the "Here/Map" analogy as it's more spatial like worlds.

      *Let's assemble.*
      Make sure to escape quotes inside JSON strings.
      Make sure `depends_on` references step numbers or ideas. I'll use step numbers for clarity.

      *Wait, one more thing:* "making the price of that step feel real rather than absurd."
      This needs to be emphasized in the sequence step about "The Price".
      Also, "They'll also reach straight for 'a world is just a maximal description'... I want the sequence to make them see what that costs."
      So Step 2 needs to contrast Description vs. Concrete explicitly.

      *Final Plan:*
      1. Semantics Recap (Baseline).
