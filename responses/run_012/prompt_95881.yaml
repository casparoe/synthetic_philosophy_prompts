answer: |-
  This is a precise and dangerous position you have staked out. It is the position of the quasi-realist who refuses the comfort of dual semantics. You are demanding that the expressivist machinery do the heavy lifting of logic without the crutch of propositional content, while simultaneously claiming the spoils of realism (truth, knowledge, disagreement).

  You asked for a map of exposure, sorted by lethality. You asked for what would count *against* the view, not what has been said against it. You asked for the internal concessions. Here is that accounting.

  ### I. The Three Fronts

  #### 1. The Logical Machinery (Negation and Embedding)
  **Status:** *Potentially Fatal*

  You have committed to univocal logical vocabulary. This is the strongest version of the view, and consequently the most brittle. The standard expressivist retreat is to say moral negation is different from descriptive negation (bifurcated semantics). You have forbidden this retreat.

  *   **The Exposure:** The "Negation Problem" (most rigorously formulated by Mark Schroeder). If "Wrong" expresses a specific attitude (say, *disapproval*), then "Not Wrong" must express the negation of that attitude. But the negation of an attitude is not a coherent psychological state in the way the negation of a proposition is.
      *   If I believe $p$, I can believe $\neg p$.
      *   If I *disapprove* of $X$, what is the corresponding state for $\neg(\text{disapprove of } X)$? Is it *tolerance*? *Indifference*? *Approval*? None of these map cleanly to logical negation. Tolerance is not the logical contradictory of disapproval (one can be indifferent to both).
  *   **The Fatal Test:** If you cannot specify the *commitment conditions* for complex sentences (e.g., "If stealing is wrong, then getting your brother to steal is wrong") solely in terms of attitude incompatibility without implicitly defining those attitudes by their *truth-conditions*, you have smuggled propositions back in.
      *   If you explain the inconsistency of "Stealing is wrong" and "Stealing is not wrong" by saying they express incompatible attitudes, the critic asks: *In virtue of what are they incompatible?*
      *   If the answer is "Because they have contradictory content," you are a realist.
      *   If the answer is "Because the psychology of holding both is unstable," you have reduced logic to psychology, which fails to account for the *normativity* of logic (one *ought* not hold both, regardless of psychological stability).
  *   **Verdict:** If you cannot ground the validity of Modus Ponens in moral contexts without referencing truth-preservation, the view collapses. This is not an awkwardness; it is a structural failure. The machinery must generate logical validity from the structure of attitudes alone. If it requires a "propositional shadow" to explain why the inference holds, the expressivism is merely decorative.

  #### 2. Truth, Knowledge, and Deflationary Realism
  **Status:** *Fatal to the View's Identity (Benign Absorption)*

  You want truth and knowledge without realism. You likely intend to use a deflationary account of truth (to assert $p$ is to assert that $p$ is true).

  *   **The Exposure:** The "Creeping Minimalism" problem (James Dreier). If you grant that moral sentences are truth-apt, that they can be known, that they stand in logical relations, and that "true" is just a device for endorsement... what work is left for "expressivism" to do?
      *   A deflationary realist says: "Moral sentences express propositions, but 'proposition' is just a grammatical category, not a metaphysical weight."
      *   You say: "Moral sentences express attitudes, but they function *as if* they were propositions."
      *   If the functional output is identical, the dispute is verbal.
  *   **The Fatal Test:** Can you describe a possible world where your view is true and deflationary realism is false? If the answer is no, you have not defeated realism; you have re-described it.
      *   If this is a *reductio*, it means you claimed to be offering a metaphysical alternative and failed.
      *   If this is *benign absorption*, it means you won, but only by becoming what you opposed.
  *   **Verdict:** This is not fatal to the *correctness* of your claims, but it is fatal to the *distinctiveness* of your project. If you cannot point to a substantive disagreement that remains after deflation, you have qualified the view into unfalsifiability. You become immune to error only because you have ceased to make a claim that differs from the realist's.

  #### 3. The Intention Analogy
  **Status:** *Merely Awkward (Manageable but Costly)*

  You lean on the inconsistency of intentions (planning states) to model moral inconsistency. This is Gibbard's territory.

  *   **The Exposure:** Intentions are under voluntary control in a way moral judgments are not. I can intend to go to the gym and then simply not go, or change my mind without feeling I have corrected a mistake. Moral judgments feel *responsive to reasons* in a way intentions do not.
      *   *Akrasia:* I can judge "I ought to $\phi$" and fail to $\phi$. I cannot intend to $\phi$ and fail to $\phi$ (if I fail, I didn't truly intend, or I was prevented). If moral judgments are a species of intention-like state, akrasia becomes conceptually difficult.
      *   *Revisability:* If morality is a policy, I can adopt a new policy. If I decide "Charity is no longer obligatory," the realist says I am mistaken. You must say I have changed my stance. But this makes moral progress look like changing tastes, which you explicitly disavow.
  *   **The Fatal Test:** Does the analogy break when explaining *moral ignorance*? I can be ignorant of a fact. Can I be ignorant of my own policy? If I say "I didn't realize bribery was wrong," and you say "You just hadn't adopted the stance against it," you lose the *normative grip* of the judgment. It becomes a report of my current psychology, not a demand on my future action.
  *   **Verdict:** This is awkward, not fatal. You can argue that moral judgments are a *specialized* subset of norm-acceptances that are treated as non-revisable for the sake of social coordination. But you must concede that the phenomenology of "discovering" moral truth is something your view must explain away as a useful illusion.

  ---

  ### II. Internal Concessions
  *What an expressivist of your stripe should concede on the spot.*

  If I were arguing from within your position, these are the vulnerabilities I would acknowledge without waiting for a critic to point them out:

  1.  **The Loss of "Tracking":** You must concede that moral inquiry does not *track* mind-independent features of the universe. When we deliberate, it *feels* like we are tracking something. You must classify this phenomenology as a projection necessary for the seriousness of the practice. This is a cost. It makes the "error theory" charge hard to fully deflect.
  2.  **The Explanation of Supervenience:** Realists explain the supervenience of the moral on the natural (no moral difference without a natural difference) as a metaphysical necessity. You must explain it as a conceptual constraint on attitude-consistency. This is weaker. It makes supervenience a rule of our "game" rather than a feature of the world. You must concede this makes the necessity seem more fragile than the realist's.
  3.  **The "Why Be Moral?" Question:** For the realist, the reason to be moral is that morality is *true* (or binding). For you, the reason to be moral is that you have adopted a policy. If an agent asks, "Why should I adopt this policy?", you cannot say "Because it is the right one." You can only say, "Because this is the policy that allows us to live together." You must concede that your view makes the ultimate justification of morality pragmatic, not ontological.

  ---

  ### III. The Verdict on Unfalsifiability

  You asked: *If your conclusion is that the position risks nothing... say so directly.*

  Here is the direct answer: **Your position risks collapsing into a notational variant of deflationary realism.**

  This is a defect peculiar to *ambitious* expressivism (quasi-realism). Simple expressivism (moral sentences are just cries of "Boo!") is easily falsified (it fails to account for logic). Quasi-realism saves the logic by adopting the realist's tools (truth, propositions, knowledge) but claims they are "earned" rather than "given."

  The risk is that in earning them, you have made them indistinguishable from the realist's given tools. If every objection is met by a qualification ("We can say truth, but deflationarily," "We can say propositions, but grammatically," "We can say knowledge, but as stable attitude"), then the view becomes immune to empirical or logical refutation.

  **Is this a defect?**
  Yes. A view that cannot be distinguished from its opposite in terms of practical consequence or logical output is not a metaphysical theory; it is a preference in vocabulary.

  **The Fatal Line:**
  The view remains substantive *only if* you can maintain the **Explanatory Priority**.
  *   **Realist:** Logic works because of truth conditions; attitudes track truth.
  *   **You:** Attitudes exist; logic is a projection of attitude-incompatibility; truth is a projection of logical validity.

  If you cannot explain the normativity of logic *without* implicitly relying on the realist's order of explanation, you have lost. If you find yourself saying, "Moral sentences are true *because* they correspond to the correct policies," you have surreptitiously turned policies into truth-makers.

  **Summary of Exposure:**
  1.  **Fatal:** If univocal negation requires propositional content to function logically.
  2.  **Fatal (to identity):** If the view becomes indistinguishable from deflationary realism.
  3.  **Awkward:** The phenomenology of moral discovery and the nature of akrasia.

  You are walking a razor's edge. To save the logic, you risk becoming a realist. To save the expressivism, you risk losing the logic. Your claim is that you can have both. The exposure lies in the possibility that "both" is just a name for "realism with extra steps."
