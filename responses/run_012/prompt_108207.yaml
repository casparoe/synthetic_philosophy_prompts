      4.  **Desert vs. Utility:** He doesn't switch tracks. He uses utility to *explain* the sentiment of desert. The sentiment of desert *is* the metric, and nature built utility into that metric.
      5.  **Conclusion:** It is one consistent strand: Sentimentalism. Desert is defined by sentiment, and sentiment is designed by nature for social preservation. The "intention-only" view is a rational abstraction, not the full psychological reality.

