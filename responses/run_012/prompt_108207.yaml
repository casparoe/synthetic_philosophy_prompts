answer: |-
  You have pinpointed the exact tension in Part II, Section III of *The Theory of Moral Sentiments*. Your reading of the text is accurate: Smith explicitly identifies a gap between the "rule" (intention determines desert) and the "sentiment" (outcome modulates praise and blame).

  To answer your specific question: Smith does not view this as a confusion in his argument, nor does he quietly switch from desert to utility in a way that abandons the first. Instead, he is operating within a **sentimentalist framework** where "desert" is not a metaphysical truth discovered by reason, but a feeling constituted by the impartial spectator.

  Here is how to untangle the two strands so they appear consistent rather than contradictory.

  ### 1. The "Truth" About Desert vs. The Reality of Sentiment
  Smith argues that if we consult **reason**, merit and demerit belong solely to the intention. In this abstract sense, the "intention-only" view is the rational standard. If you judge purely by the rules of justice, the person who tries to kill you but misses is as guilty as the one who succeeds.

  However, Smith is a moral sentimentalist, not a rationalist. For Smith, moral judgments are ultimately grounded in **feelings** (sympathy, gratitude, resentment), not abstract reasoning. When he says our luck-tracking feelings are an "irregularity," he means they deviate from the *rational rule*, not that they are false illusions to be discarded.

  Therefore:
  *   **Is the intention-only view the truth?** It is the truth of *reason*, but it is not the truth of *human nature*.
  *   **Are the luck-tracking feelings right?** They are "right" in the sense that they are the actual mechanism by which humans judge. Since moral judgment *is* a sentiment for Smith, these feelings constitute our practical reality of desert.

  ### 2. Is it a "Useful Error"?
  It is tempting to call it a "useful error," but Smith goes further. He argues that because Nature (or the Author of Nature) designed us this way for a specific purpose, the sentiment is **authorized**.

  He writes that this irregularity is "founded in the nature of man" and is "necessary for the preservation of society." If we only punished intention, we might become careless with consequences. If we only rewarded intention, we might neglect the actual welfare of others.

  So, it is not an "error" in the sense of a defect we should try to reason away. It is a **functional feature** of our moral psychology. Smith is saying: *Reason says X, but Nature made us feel Y, and Y is better for social survival.*

  ### 3. Desert vs. Utility: Is there a Switch?
  You asked if he switches from "what people deserve" to "what feelings are useful." He does not switch tracks; he **grounds** the track of desert in utility.

  For Smith, the question "What do I deserve?" is answered by asking "What would the impartial spectator feel toward me?" The impartial spectator feels more resentment when harm is actually done than when it is merely intended. Smith then asks, "Why does the spectator feel this way?" His answer is teleological: Nature tuned the spectator's feelings to maximize social utility (caution, humility, compensation).

  So the logic flows like this:
  1.  **Desert** is determined by the sentiments of the impartial spectator.
  2.  **The Spectator's Sentiments** are influenced by outcomes (luck), not just intentions.
  3.  **The Reason** for this influence is utility (social preservation).

  He isn't abandoning desert for utility. He is explaining *why* our sense of desert includes luck. The utility explains the origin of the sentiment, but the sentiment still determines the desert.

  ### 4. The Verdict: One Consistent Strand
  There is no confusion in Smith's text, provided you accept his sentimentalist premises.

  *   **The Rational Strand:** Intention is the proper object of moral judgment. (This keeps us from being purely consequentialist).
  *   **The Psychological Strand:** Outcomes inevitably color our judgments. (This acknowledges human reality).
  *   **The Teleological Strand:** Nature made the Psychological Strand override the Rational Strand in specific ways to ensure social order. (This justifies the irregularity).

  Smith's conclusion is that we should acknowledge the irregularity. We should recognize that while the *guilt* is in the intention, the *punishment* and *resentment* will rightly fall heavier on the outcome. He advises us to humble ourselves before this mechanism: even if our intentions were pure, if we cause harm, we must accept the resentment of others as a natural check on our actions.

  **Summary:** Smith thinks the intention-only view is the **rational ideal**, but the luck-tracking view is the **natural reality**. He does not think we should try to eliminate the luck-tracking feelings. He uses utility to explain why Nature made the feelings this way, but the feelings themselves remain the final arbiter of what is deserved in practice. It is a consistent sentimentalist argument: our moral feelings are designed for social function, even if they occasionally contradict abstract rules of justice.
