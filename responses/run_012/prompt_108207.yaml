  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Text:** Adam Smith, *The Theory of Moral Sentiments* (TMS), Part II, Section III (Concerning the influence of Fortune upon the Sentiments of Mankind).
      *   **Core Issue:** The tension between "intention determines desert" (justice/reason) vs. "outcome affects sentiment" (gratitude/resentment).
      *   **User's Understanding:** Smith acknowledges the irregularity (we judge based on luck/outcome despite intention being the "true" ground of desert). Smith calls it a disorder but says it has useful social effects (humility, caution). Nature designed it this way.
      *   **User's Question:** Is Smith saying intention-only is the *truth* about desert and luck-sentiments are a *useful error*? OR does he think luck-sentiments are *also right* about desert? Is he switching from "what is deserved" to "what is useful"? Are these consistent strands or a confusion?
      *   **Constraint:** Keep it focused, no survey of secondary literature.

  2.  **Recall/Verify Smith's Argument in TMS Part II, Section III:**
