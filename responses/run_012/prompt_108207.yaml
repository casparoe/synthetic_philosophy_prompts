      *   *The Principle of Justice:* Strictly speaking, merit and demerit belong only to the design/intention. If I try to kill you but miss, I am morally guilty, but legally/socially treated differently than if I succeed.
      *   *The Utility/Function:* Why did nature do this?
          1.  To punish rashness/carelessness (encouraging caution).
          2.  To prevent us from feeling too secure in our own innocence (humility).
          3.  To ensure that injuries are actually compensated (we care more about real suffering).
      *   *The Verdict:* Smith calls it an "irregularity" but also says it is "authorised by nature." He doesn't dismiss it as a mere illusion to be overcome by reason. He integrates it into his moral psychology.

  3.  **Address the Specific Tension (Desert vs. Utility):**
      *   *Is it a "useful error"?* Not exactly. Smith rarely treats sentiments as "errors" in the sense of things to be eradicated. They are data. However, he *does* say that regarding *strict justice* and *punishment*, intention should rule. But regarding *sentiments* (gratitude/resentment), outcome matters.
      *   *Does he switch from Desert to Utility?* This is the crux. Smith is a sentimentalist, not a pure rationalist. "Desert" isn't an abstract metaphysical truth for Smith; it's grounded in the sentiments of the impartial spectator. If the impartial spectator feels more resentment when harm occurs, then there *is* a sense in which the desert is different, even if the intention was the same.
      *   *However,* Smith explicitly distinguishes between the *propriety* of the action (intention) and the *merit/demerit* (which includes outcome in practice).
      *   *Resolution:* Smith maintains that intention is the *primary* ground of praise/blame, but outcome *modulates* the intensity of the sentiment. He doesn't abandon desert for utility; he explains why the sentiment of desert *includes* outcome considerations for functional reasons. It's a teleological explanation of a psychological fact.

  4.  **Drafting the Response (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* You're right that there's a tension. Smith says intention is the main thing. But he says nature makes us care about outcomes. It's not a confusion; it's a feature. He doesn't switch from desert to utility. He says utility explains *why* the sentiment of desert works this way. So, intention is the rule, but outcome is the exception that nature enforces for safety.

      *   *Critique 1:* Too vague. Need to address the "truth about desert" vs. "useful error" dichotomy directly.

      *   *Attempt 2 (Refining the distinction):* Smith distinguishes between the *rule* (intention) and the *sentiment* (outcome). He admits the sentiment is "irregular" compared to the rule. But he doesn't call it false. He calls it necessary. So, is it a useful error? Yes, in the sense that it deviates from the strict rule of intention. But is it "right" about desert? In a legal/social sense, yes. In a strict moral sense, no. Smith holds both: Strict moral desert = intention. Social/psychological desert = intention + outcome. He isn't confused; he's describing a gap between abstract justice and human psychology.

      *   *Attempt 3 (Focusing on the "Switch"):* The user asks if he switches from "what people deserve" to "what feelings are useful." Smith's answer is: The feelings *constitute* what we deserve, but nature tuned those feelings for utility. So it's not a switch; it's an explanation of the mechanism. The "impartial spectator" would acknowledge the irregularity but accept it.

