      *   *The AI Question:* Are LLMs/Models like maps (derived) or like minds (original)?
      *   *The "Collapse Thesis":* Maybe the distinction is fake. If a system is complex enough and interacts robustly enough, "derived" *becomes* "original" functionally. Dennett supports this (Intentional Stance). Searle denies it (Chinese Room).
