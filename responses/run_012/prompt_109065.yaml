  8.  **Final Polish:** Tone should be professional, precise, respectful of the engineer's time, and philosophically rigorous without being jargon-heavy. (Avoid "qualia," "phenomenology," etc., unless defined). Use "normative," "teleology," "intentional stance" carefully.

  *(Self-Correction on the Collapse Thesis)*: I need to be careful not to just say "Searle is right." I need to say "The distinction matters for *liability*." If the intentionality is derived, *we* are liable. If original, *it* might be (or we are liable for deploying an agent). The collapse thesis obscures this. I will argue the thesis is *pragmatically false* for policy purposes even if metaphysically ambiguous.

