      *   **Confronting the Collapse Thesis:** This needs to be sharp. If Original = Derived + Complexity, then policy is just UI design. If they are distinct, policy is liability/ethics. I will argue it breaks down at *normative grounding*. A shopping list doesn't care if it's wrong; a mind does. Does the model care? If not, it's derived.
