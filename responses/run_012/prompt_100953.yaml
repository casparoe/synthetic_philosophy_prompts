prompt: |-
  I run the quantitative risk group at a mid-size engineering consultancy -- we do the probabilistic risk assessments that regulaters and insurers make clients produce before they can build a chemical plant, keep an aging dam running, launch a medical device, that kind of thing. Every one of these jobs boils down to the same ugly task: somebody has to put a number on the probability of a failure event and then defend it in a room full of people who will ask where it came from. I've read enough LessWrong and stats blogs to know that probability is in the mind, and I know about base rates and reference classes and calibration, but none of that is a procedure I can hand to my analysts, who are good engineers and mediocre statisticians and who are always on a deadline because the client wants the report by Friday and a regulator has to sign off on it. Right now it's a mess: the old-timers want to lift numbers straight out of industry failure-rate tables, our one Bayesian wants to elicit priors from experts, and a lot of the events we assess have literally never happened anywhere, so the tables have nothing to say and nobody fully trusts the experts either. I want to fix this with an actual written procedure, not another lecture.

  So please write me a decision procedure an analyst can run on a single probability claim, from the moment they're told "assign P(event)" to the number they write down and how they record it. The key thing I want it to force is that they first work out what kind of thing the probability is supposed to be -- a long-run frequency over a population of similar items, a propensity or physical tendency of one particular system, or a degree of belief somebody holds -- because I'm convinced most of our arguments are people using different senses of the word without noticing, and I want the procedure to drag that into the open and commit to one sense per claim, with reasons. For each step I want: the question to ask, what counts as a good enough answer, what to do when the honest answer is we don't know, where the procedure stops and hands it to a human with "this one is a judgment call and here's who owns it", and how to tag the final number so the next person can see which sense it was in. Then run it end to end on three claims: (a) the failure rate of a bog-standard centrifugal pump in normal service, (b) the probability that a brand-new process chemistry has a runaway reaction during its first year of operation, and (c) the probability that one specific 60-year-old dam -- one of a kind, no population of dams quite like it -- fails sometime in the next thirty years. I fully expect it to give a clean textbook answer on (a) and to end up telling me something I won't like on (c), so don't paper over that. One more thing that keeps biting us: these numbers get multiplied together in fault trees, and I suspect we're quietly mixing senses when we do that -- a frequency from a table times somebody's degree of belief -- and nobody notices. Say whether that's actually a problem and what the procedure should tell an analyst about combining numbers that were tagged with different senses. And be straight with me about what the procedure fundamentally can't deliver, no matter how carefully we follow it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Head of Quantitative Risk Group at a mid-size engineering consultancy.
      *   **Context:** Probabilistic Risk Assessments (PRAs) for regulators/insurers (chemical plants, dams, medical devices).
      *   **Problem:** Analysts (good engineers, mediocre statisticians) struggle to assign probabilities under deadline pressure. Current methods are inconsistent (frequency tables vs. Bayesian elicitation vs. gut feel). Arguments arise from mixing interpretations of probability (frequency vs. propensity vs. belief). Fault trees mix these types indiscriminately.
      *   **Goal:** A written *decision procedure* (algorithm/checklist) for analysts to follow for *single probability claims*.
      *   **Key Requirement:** Force the analyst to explicitly identify the *interpretation* of probability (Frequency, Propensity, Degree of Belief) before assigning a number.
      *   **Specific Outputs Needed:**
          *   The Procedure (Steps: Question, Good Answer, "Don't Know" handling, Escalation, Tagging).
          *   Application to 3 Cases: (a) Centrifugal pump (standard), (b) New process chemistry runaway (novel), (c) Unique 60-year-old dam (unique/singular).
          *   Address Fault Tree Mixing: Is mixing senses a problem? How to handle it?
          *   Limitations: What can't this procedure fix?
      *   **Tone:** Professional, direct, pragmatic, no fluff, acknowledging the "ugly task" reality. No lecturing on philosophy, just operationalizing it.

  2.  **Deconstruct the Core Problem (Interpretations of Probability):**
      *   *Frequentist (Reference Class):* "How often does this happen in a population?" (Good for pumps, valves, standard components).
      *   *Propensity (Physical Model):* "What does the physics/mechanics say about this specific system's tendency to fail?" (Good for stress/strain, load/capacity, though often modeled via frequencies of inputs).
      *   *Subjective/Bayesian (Degree of Belief):* "Given what we know, how confident are we?" (Good for unique events, novel tech, regulatory judgment).
      *   *The Conflict:* Multiplying a frequency (objective rate) by a belief (subjective confidence) in a fault tree mathematically works (probability calculus holds for all), but *epistemically* it's dangerous because the uncertainty profiles are different. A frequency has sampling error; a belief has model/expert uncertainty.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   Needs to be a flowchart or step-by-step checklist.
      *   *Step 1: Classification.* Ask: "Can I count these?"
      *   *Step 2: Data Check.* Is there a reference class?
      *   *Step 3: Model Check.* Is there a physical model?
      *   *Step 4: Elicitation.* If neither, it's belief.
      *   *Tagging:* Needs a clear label (e.g., P-Freq, P-Phys, P-Belief).
      *   *Escalation:* When does it go to the Group Head (User)? When the classification is ambiguous or the stakes are high/uncertainty is massive.

  4.  **Developing the Three Cases:**
      *   *(a) Centrifugal Pump:* Classic Frequency. Industry data exists (OREDA, etc.). Low uncertainty. Tag: `P-FREQ`.
      *   *(b) New Chemistry:* No history. Physics is known but kinetics might be uncertain. Relies on expert judgment + small-scale testing. Tag: `P-BELIEF` (informed by `P-PHYS`).
      *   *(c) Unique Dam:* No reference class (unique geology/age). Physics models exist but parameter uncertainty is huge. It's a singular event. Tag: `P-BELIEF` (conditioned on `P-PHYS`). *Crucial:* Acknowledge the user won't like this because regulators want "objective" numbers, but truthfully it's epistemic.

  5.  **Addressing Fault Tree Mixing:**
      *   *Math:* $P(A \cap B) = P(A)P(B)$ holds regardless of interpretation *if* independent.
      *   *Epistemology:* It *is* a problem. Why? Because "Uncertainty on the Probability" (Second-order uncertainty) differs. A frequency of $10^{-4}$ has a confidence interval based on sample size. A belief of $10^{-4}$ has uncertainty based on expert bias/model validity.
      *   *Procedure Fix:* Tag inputs. If mixing, flag the output as "Hybrid" and require a sensitivity analysis on the subjective components.

  6.  **Addressing Limitations:**
      *   Cannot create data where none exists.
      *   Cannot force regulators to accept "Degree of Belief" labels (they want "Risk").
      *   Cannot eliminate political pressure to lower numbers.
      *   Garbage In, Garbage Out (GIGO) still applies.

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible. Use engineering terms.
      *   Be firm on the "Don't Know" paths.
      *   Ensure the distinction between "Aleatory" (randomness) and "Epistemic" (knowledge) is clear but operationalized as Frequency vs. Belief.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Propensity" useful?
      *   *Correction:* In engineering, "Propensity" usually manifests as Physics-Based Models (stress > strength). I should label this `P-PHYS` to make it actionable for engineers.
      *   *Critique:* What if they mix them in the fault tree?
      *   *Correction:* I need to explicitly state that the math works, but the *defense* fails. The procedure must require separating the uncertainty types in the report appendix.
      *   *Critique:* The user wants to know where the procedure stops.
      *   *Correction:* Add an "Escalation Trigger" step.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Decision procedure? Yes.
      *   Question/Answer/Don't Know/Escalation/Tag for each step? Yes.
      *   Run on 3 cases? Yes.
      *   Fault tree mixing addressed? Yes.
      *   Limitations addressed? Yes.
      *   Tone: Direct, no papering over the dam issue.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a standard operating procedure (SOP) designed for your analysts. It is written to be inserted directly into your quality manual. It avoids philosophical debate by forcing operational choices.

  Following the procedure, I have run the three cases, addressed the fault tree mixing issue, and listed the fundamental limitations.

  ***

  # SOP-QR-004: Probability Assignment and Classification Protocol

  **Purpose:** To ensure every probability value in a risk assessment is assigned a specific epistemic classification (Frequency, Physics, or Belief) before calculation, preventing the mixing of incompatible uncertainty types without documentation.

  **Scope:** All single-point probability claims entered into fault trees, event trees, or risk matrices.

  ## The Procedure

  ### Step 1: The Reference Class Test
  **Question:** "Can I identify a population of at least 50 identical or near-identical items/systems operating under similar conditions where this specific failure mode has been tracked?"
  *   **Good Answer:** "Yes. There are [N] units in operation. Data source is [Database Name/Study]. The failure mode matches definition [X]."
  *   **"Don't Know" Answer:** "There are some similar units, but operating conditions differ significantly," or "The failure mode is defined differently in the available data."
  *   **Action if Yes:** Proceed to **Step 2A**.
  *   **Action if No:** Proceed to **Step 2B**.

  ### Step 2A: Frequency Assignment (Tag: `P-FREQ`)
  **Question:** "Is the sample size large enough to calculate a raw rate, and have we adjusted for the 'healthy survivor' bias or reporting thresholds in the data?"
  *   **Good Answer:** "Rate is [X] failures/hour. We applied a correction factor of [Y] for under-reporting based on [Z]."
  *   **"Don't Know" Answer:** "We are just taking the mean from the table without checking the variance or data quality."
  *   **Action:** Assign the number. Record the Confidence Interval (CI) based on the sample size (e.g., Chi-squared bounds). **Tag: `P-FREQ`**.
  *   **Escalation:** If the data source is older than 10 years or the correction factor exceeds 2x, escalate to Group Head.

  ### Step 2B: The Physics Model Test
  **Question:** "Is there a deterministic physical model (stress/strength, load/capacity, kinetics) where the input parameters are uncertain but the governing equations are validated?"
  *   **Good Answer:** "Yes. We have a finite element model / kinetic rate equation. The inputs (load, material strength) are distributions, but the physics are settled."
  *   **"Don't Know" Answer:** "The physics are poorly understood," or "The system is too complex to model mechanistically."
  *   **Action if Yes:** Proceed to **Step 3A**.
  *   **Action if No:** Proceed to **Step 3B**.

  ### Step 3A: Physics-Based Probability (Tag: `P-PHYS`)
  **Question:** "Have we propagated the input uncertainties through the model to generate a probability of exceedance?"
  *   **Good Answer:** "Yes. We ran Monte Carlo on the input parameters. The output is the probability that Stress > Strength."
  *   **"Don't Know" Answer:** "We picked worst-case inputs and ran it once."
  *   **Action:** Assign the number. Record the sensitivity of the result to the input distributions. **Tag: `P-PHYS`**.
  *   **Escalation:** If the model has not been validated against real-world failure data for *any* system, escalate to Group Head.

  ### Step 3B: Expert Elicitation (Tag: `P-BELIEF`)
  **Question:** "Have we identified at least two independent subject matter experts (SMEs) who have no stake in the project approval to elicit a degree of belief?"
  *   **Good Answer:** "Yes. We used a structured protocol (e.g., SHELF/IDEA). We recorded their rationales and the spread of their opinions."
  *   **"Don't Know" Answer:** "We asked the project engineer who designed it," or "We just need a number for the box."
  *   **Action:** Assign the number (usually the aggregate of SMEs). Record the inter-expert variance as the uncertainty metric. **Tag: `P-BELIEF`**.
  *   **Escalation:** **Mandatory.** All `P-BELIEF` tags must be signed off by the Group Head before inclusion in a final report. This is a judgment call.

  ### Step 4: The Combination Rule (Fault Trees)
  **Question:** "Am I multiplying inputs with different Tags?"
  *   **Good Answer:** "No, all inputs are `P-FREQ`," or "Yes, but I have flagged the output."
  *   **Action:**
      *   If inputs match tags: Proceed. Output inherits the tag.
      *   If inputs mix tags (e.g., `P-FREQ` × `P-BELIEF`): The output must be tagged **`P-HYBRID`**.
      *   **Requirement for `P-HYBRID`:** You must produce a sensitivity table showing how the top event changes if the `P-BELIEF` component varies by ±50%.
  *   **Escalation:** Any `P-HYBRID` result that drives a regulatory decision requires a written justification memo from the Group Head explaining why the subjective uncertainty does not invalidate the objective frequency.

  ***

  # Application to Your Three Cases

  Here is how the SOP runs on your specific examples.

  ### (a) Failure rate of a bog-standard centrifugal pump
  1.  **Ref Class Test:** Yes. OREDA, IEEE 500, and internal maintenance logs exist for thousands of these pumps.
  2.  **Assignment:** Analyst pulls mean time between failure (MTBF) data. Adjusts for service environment (corrosive vs. clean).
  3.  **Tag:** **`P-FREQ`**.
  4.  **Uncertainty:** Recorded as a 90% confidence interval based on the number of pump-years in the dataset.
  5.  **Result:** Clean. Defensible. Regulators accept this.

  ### (b) Runaway reaction for brand-new process chemistry
  1.  **Ref Class Test:** No. It is a new chemistry. No population exists.
  2.  **Physics Test:** Partial. Kinetics are known from lab scale, but scale-up heat transfer dynamics are uncertain.
  3.  **Assignment:** Cannot be `P-FREQ`. Analyst runs thermal models (`P-PHYS`), but the boundary conditions (e.g., impurity levels) are unknown.
  4.  **Elicitation:** Analyst must elicit beliefs from chemists regarding the likelihood of unmodeled side reactions.
  5.  **Tag:** **`P-BELIEF`** (informed by `P-PHYS`).
  6.  **Result:** The number is essentially a calibrated guess. The SOP forces you to label it as such. The regulator will hate this, but the SOP prevents you from lying and calling it a frequency.

  ### (c) Failure of the unique 60-year-old dam (Next 30 years)
  1.  **Ref Class Test:** No. You stated it is one of a kind. Geology, construction method, and age profile are unique.
  2.  **Physics Test:** Yes, but... You can model hydrological load and structural stress. However, the material properties of the 60-year-old concrete/earth are not fully known without destructive testing (which you can't do).
  3.  **Assignment:** You are modeling a singular historical object, not a population. The "probability" here is not a frequency; the dam either fails or it doesn't. The probability represents your *uncertainty about the dam's state*, not the dam's randomness.
  4.  **Tag:** **`P-BELIEF`** (conditioned on `P-PHYS`).
  5.  **Result:** This is the one you won't like. The SOP forces you to admit this number is a degree of belief.
      *   *Why this hurts:* Regulators want to treat this like a pump (`P-FREQ`). They want to know "Is the risk < 10^-4?"
      *   *The Truth:* There is no 10^-4 here. There is only "We are 95% confident the model holds."
      *   *The Procedure's Verdict:* Do not present this as a frequency. Present it as "Probability of Failure given current knowledge." If the regulator demands a frequency tag, the Group Head must write the variance memo explaining the epistemic gap.

  ***

  # The Fault Tree Mixing Problem

  **Is mixing senses a problem?**
  Mathematically, no. Epistemically, **yes, it is a critical problem.**

  Probability calculus ($P(A \cap B) = P(A)P(B)$) works regardless of whether $P$ is frequency or belief. However, the *uncertainty on the probability* (second-order uncertainty) behaves differently.
  *   **`P-FREQ`** uncertainty shrinks with more data.
  *   **`P-BELIEF`** uncertainty shrinks with better models/experts, but often hits a floor (model uncertainty).

  **The Risk:**
  If you multiply a precise frequency ($10^{-5} \pm 10\%$) by a subjective belief ($10^{-2} \pm 500\%$), the result is dominated by the belief. If you report the result as a clean number (e.g., $10^{-7}$), you are laundering the subjectivity through the math. The fault tree gives a false sense of precision.

  **What the Procedure Tells the Analyst:**
  Step 4 of the SOP addresses this. If you mix tags, the output is **`P-HYBRID`**.
  *   **Requirement:** You cannot just report the mean. You must report the *range* driven by the subjective component.
  *   **Defense:** When a regulator asks "Where did this number come from?", the analyst answers: "The base component is industry frequency, but the initiating event is expert belief. The true risk lies between X and Y depending on the validity of that expert judgment."

  ***

  # What This Procedure Cannot Deliver

  I need to be straight with you about the limits of this SOP. It fixes consistency, but it does not fix reality.

  1.  **It Cannot Create Data:** For the dam (Case C) and the new chemistry (Case B), this procedure will not generate a "hard" number. It will only force you to label the soft number correctly. If your business model relies on selling "objective certainty" for unique systems, this procedure will expose that product as illusory.
  2.  **It Cannot Stop Regulatory Theater:** Regulators often *know* these numbers are beliefs, but they require the *format* of frequencies to satisfy legal statutes. This SOP will create friction. Your analysts will come to you saying, "The client is demanding a `P-FREQ` tag for a `P-BELIEF` claim." You will have to decide whether to fight the client or sign the variance memo.
  3.  **It Cannot Fix Bad Experts:** In Step 3B, if your SMEs are overconfident or biased, the `P-BELIEF` number will be precise but wrong. The SOP ensures you record *that* it is a belief, but it does not ensure the belief is accurate.
  4.  **It Does Not Solve Correlation:** Fault trees assume independence. In complex systems (like the dam), failure modes are coupled. A `P-FREQ` on a spillway gate and a `P-BELIEF` on foundation seepage are likely correlated by the same flood event. This SOP classifies the *nodes*, but it doesn't fix the *structure*. You still need to check for common-cause failures manually.

  **Summary:**
  This procedure stops your team from lying to themselves about what the numbers mean. It will slow down the "easy" jobs slightly and make the "hard" jobs look much harder. That is the correct outcome. Your value add is not generating numbers; it is certifying the integrity of the numbers you generate. This SOP lets you do that.
