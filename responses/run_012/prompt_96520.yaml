          *   Social Feedback Loop: Informal label circulating online for 2 years. Patient self-diagnosis driving symptom drift (from fatigue/sleep to "flatness/unreal preferences"). Drafters see this as tracking reality; skeptics see it as manufacturing the referent.
          *   Overlap: Heavy overlap with existing category (persistent low mood/anhedonia - likely Depression-related). Admitting CAF draws off the subpopulation anchoring the existing category's validity.
          *   Stakes: Coding needed for therapy protocol and insurance coverage. Rejecting CAF leaves patients without treatment.
          *   Admissibility Test: Proposed test says a category should be stable under its own application (classifying shouldn't change what's measured). Endorsing this might discredit existing categories.
          *   Committee Factions: 1) Admit Full, 2) Reject (treat as variant), 3) Admit Provisional + Monitor.
      *   **Constraints:**
