          *   *Decision:* I will argue against FULL ADOPT. The strongest consideration for them is the immediate clinical need and the fact that *all* categories evolve. I must acknowledge that holding back might delay care, but argue that bad care (based on shifting constructs) is worse.
      *   **Monitoring Plan:** What to track? Symptom drift, overlap statistics, treatment outcomes vs. existing category.
