  # Activity: The Rigidity Game (Uncertain Evidence & Order Effects)

  **Target:** Graduate Seminar (14 students)
  **Time:** 90 Minutes
  **Goal:** Demonstrate that uncertain evidence (Jeffrey Conditionalization) is order-sensitive when features are correlated, unlike certain evidence, and that preserving conditional probabilities ("Rigidity") is the scoring-optimal policy under the game's constraints.

  ## 1. Materials & Setup

  *   **Worksheets:** 14 copies of the "Credence Ledger" (see below).
  *   **Calculators:** 14 (or allow phones).
  *   **Room Setup:** Split the room into **Group Alpha** (Left) and **Group Beta** (Right). 7 students each.
  *   **Instructor Cheat Sheet:** Keep the pre-calculated values (provided in the Appendix) handy to verify student work quickly.
  *   **Projector:** To display the Scoring Rule and Final Truth.

  ### The Credence Ledger (Worksheet)
  A simple 2x2 grid for tracking 100 units of credence.
  | | Round | Square | **Marginal** |
  | :--- | :---: | :---: | :---: |
  | **Red** | [ ] | [ ] | [ ] |
  | **Blue** | [ ] | [ ] | [ ] |
  | **Marginal** | [ ] | [ ] | **100** |

  ## 2. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–15** | **Setup & Priors** | Distribute ledgers. Establish the Prior Distribution. |
  | **15–25** | **The Rule** | Explain the "Black Box" update rule (Rigidity) without naming it. |
  | **25–40** | **Round 1 & 2** | **Group Alpha:** Color Reading $\to$ Shape Reading.<br>**Group Beta:** Shape Reading $\to$ Color Reading. |
  | **40–50** | **Truth & Scoring** | Reveal the hidden object. Calculate scores via Quadratic Scoring Rule. |
  | **50–65** | **The Comparison** | Compare Group Alpha vs. Beta final credences. Highlight the Order Effect. |
  | **65–80** | **Debrief** | Reveal "Jeffrey Conditionalization." Discuss Rigidity vs. Conditionalization. |
  | **80–90** | **Limitations** | Discuss independence, the "why" of rigidity, and Q&A. |

  ## 3. Activity Script & Rules

  ### Phase 1: Setup & Priors (00–15)
  **Instructor:** "We are investigating a hidden object. It has two features: Color (Red/Blue) and Shape (Round/Square). You start with 100 units of credence to distribute across the four possibilities."

  **Write on Board:**
  *   $P(Red) = 0.5$
  *   $P(Round | Red) = 0.8$
  *   $P(Round | Blue) = 0.2$

  **Task:** "Calculate your starting ledger."
  *   *Solution:* Red/Round=40, Red/Square=10, Blue/Round=10, Blue/Square=40.
  *   *Check:* Walk around to ensure everyone has **40, 10, 10, 40**. Do not proceed until this is uniform.

  ### Phase 2: The Rule (15–25)
  **Instructor:** "I will give you two 'Readings.' A Reading does not tell you the truth. It tells you what your **Marginal Credence** must be for a specific feature after you update."

  **The Constraint (Crucial):**
  1.  **Marginal Constraint:** If a Reading says 'Red at 0.8', your new $P(Red)$ must be exactly 0.8 (80 units).
  2.  **Rigidity Constraint:** You must preserve the *relative odds* of the other feature **within** each level of the updated feature.
      *   *Script:* "If you update Color, the ratio of Round-to-Square *within Red* must stay the same as it was before the update. The ratio of Round-to-Square *within Blue* must also stay the same. You stretch or shrink the Red/Blue totals, but you do not twist the internal shape proportions."
  3.  **Forbidden Move:** "Do not assume the features become independent. Do not throw away the 0.2 mass and renormalize the 0.8 to 100. Keep the 100 units total."

  **Scoring Rule:** "At the end, I will reveal the true object. Your score is calculated using a **Quadratic Scoring Rule**:
  $$Score = 100 \times (2p_{truth} - \sum p_{all}^2)$$
  *Simpler version for class:* You get points equal to the number of units you placed on the **True Cell**, minus a penalty for spread. To maximize points, put as many units as possible on the truth *consistent with the Readings*."
  *(Note: For the purpose of the activity, simply awarding points = units on the True Cell is sufficient to show the penalty if the 'Wrong' method puts fewer units there. We will use **Units on Truth** for simplicity and visibility.)*

  ### Phase 3: The Game (25–40)
  **Instructor:** "Group Alpha, look away. Group Beta, here is **Reading 1**."
  *   **Reading 1 (Beta):** "Shape is Round with Credence 0.8." ($P(Round)=0.8$)
  *   *Beta Updates.* (Instructor checks: Within Round, R:B ratio must remain 4:1. Within Square, R:B ratio must remain 1:4).
  *   **Beta Intermediate State:** R/Ro=64, B/Ro=16, R/Sq=4, B/Sq=16.

  **Instructor:** "Group Beta, look away. Group Alpha, here is **Reading 1**."
  *   **Reading 1 (Alpha):** "Color is Red with Credence 0.8." ($P(Red)=0.8$)
  *   *Alpha Updates.* (Instructor checks: Within Red, Ro:Sq ratio 4:1. Within Blue, Ro:Sq ratio 1:4).
  *   **Alpha Intermediate State:** R/Ro=64, R/Sq=16, B/Ro=4, B/Sq=16.

  **Instructor:** "Now swap. Group Alpha, here is **Reading 2**."
  *   **Reading 2 (Alpha):** "Shape is Round with Credence 0.8."
  *   *Alpha Updates.* (Preserve Color ratios within Shape partitions).
  *   **Alpha Final:** R/Ro $\approx$ 75.3, R/Sq $\approx$ 4.7, B/Ro $\approx$ 4.7, B/Sq $\approx$ 15.3.
  *   **Alpha Final Marginal Red:** $75.3 + 4.7 = 80$? **No.** $75.3 + 4.7 = 80$. Wait.
      *   *Correction Check:* In Alpha's Step 2, they set $P(Round)=0.8$ (80 units).
      *   Total Round = 80. Ratio R:B within Round is $64:4$ (16:1).
      *   $R \cap Ro = 80 \times (16/17) \approx 75.29$.
      *   $B \cap Ro = 80 \times (1/17) \approx 4.71$.
      *   Total Square = 20. Ratio R:B within Square is $16:16$ (1:1).
      *   $R \cap Sq = 10, B \cap Sq = 10$.
      *   **Alpha Final Red Marginal:** $75.29 + 10 = \mathbf{85.29}$.

  **Instructor:** "Group Beta, here is **Reading 2**."
  *   **Reading 2 (Beta):** "Color is Red with Credence 0.8."
  *   *Beta Updates.* (Preserve Shape ratios within Color partitions).
  *   **Beta Final:**
      *   Total Red = 80. Ratio Ro:Sq within Red is $64:4$ (16:1).
      *   $R \cap Ro \approx 75.29, R \cap Sq \approx 4.71$.
      *   Total Blue = 20. Ratio Ro:Sq within Blue is $16:16$ (1:1).
      *   $B \cap Ro = 10, B \cap Sq = 10$.
      *   **Beta Final Red Marginal:** $\mathbf{80.00}$.

  ### Phase 4: Truth & Scoring (40–50)
  **Instructor:** "The Hidden Object was **Red and Round**."
  1.  **Score Calculation:** Students count units in the top-left cell (Red/Round).
      *   **Group Alpha:** ~75.3 points.
      *   **Group Beta:** ~75.3 points.
      *   *(Note: Both get similar scores on the Truth cell, which is expected as both followed the optimal rule. The difference is in the Marginals.)*
  2.  **The Penalty Check:** Ask if anyone assumed **Independence** (i.e., $P(R \cap Ro) = P(R) \times P(Ro)$).
      *   If a student did this in Round 2: $0.8 \times 0.8 = 64$ units on Red/Round.
      *   **Visible Penalty:** 64 points vs 75 points. Highlight this difference.

  ### Phase 5: The Comparison (50–65)
  **Instructor:** "Look at your final **Marginal Credence for Red**."
  *   **Group Alpha:** ~0.85
  *   **Group Beta:** 0.80
  *   **Question:** "You saw the same evidence. You followed the same rules. Why do you disagree on the probability of Red?"
  *   **Discussion:** Let them struggle. They should notice that the *second* reading "locked in" its feature's marginal, but the *first* reading's marginal was allowed to drift during the second update.
      *   Alpha: Color first (set to 0.8). Shape second (set to 0.8). Shape update disturbed Color marginal.
      *   Beta: Shape first. Color second (set to 0.8). Color update locked Color marginal.

  ### Phase 6: Debrief (65–80)
  **1. Name the Rule:** "You were performing **Jeffrey Conditionalization** (or Probability Kinematics)."
  **2. Rigidity:** "The core constraint you followed is **Rigidity**: $P_{new}(H | E) = P_{old}(H | E)$. Uncertain evidence shifts the weights of the partition ($E, \neg E$) but leaves the conditional probabilities of hypotheses *given* those partition elements fixed."
  **3. Order Dependence:** "Standard Conditionalization (certain evidence) is commutative. $P(H | E \& F) = P(H | F \& E)$. Jeffrey Conditionalization is **not** commutative when partitions are different and correlated. The last update dominates its own marginal."
  **4. The Independence Case:** "What if Red and Round were independent initially? ($P(Ro|R) = P(Ro)$)."
      *   If independent, the ratios within Red and Blue are identical.
      *   Updating Color does not change Shape marginals.
      *   Updating Shape does not change Color marginals.
      *   **Result:** Order effect vanishes. (Write the math on the board to prove this).

  ### Phase 7: Limitations (80–90)
  **Instructor:** "I must be candid about what this game stipulated vs. what it proved."
  1.  **Why Rigidity?** "The game forced you to keep conditionals fixed. In reality, why should a fuzzy visual experience of 'Redness' not change your belief about 'Roundness' given Red? This is the **Philosophical Stipulation**. We treat the experience as fixing the marginal probability of the sensation, not as a proposition to be conditionalized on."
  2.  **The 'Collapse' Objection:** "Some of you wanted to treat the reading as certain ($P=1$). If you do that, order effects vanish. But that misrepresents uncertain evidence. The penalty in the game showed that ignoring the uncertainty (collapsing to 1) leads to miscalibration if the world is correlated."
  3.  **Conditionalizing on the Reading:** "You could conditionalize on the proposition 'The Instrument Read Red'. But then you need likelihoods $P(Reading | Object)$. The game bypassed this by giving you the posterior marginal directly. This models 'direct experience' rather than 'instrumental data'."

  ## 4. Instructor Appendix (The Math)

  **Priors (100 units):**
  *   $R \cap Ro$: 40
  *   $R \cap Sq$: 10
  *   $B \cap Ro$: 10
  *   $B \cap Sq$: 40

  **Group Alpha (Color $\to$ Shape):**
  1.  **Update Color ($P(R)=80$):**
      *   $R$ total 80. Ratio $Ro:Sq$ is $40:10$ (4:1). $\to$ $R \cap Ro = 64, R \cap Sq = 16$.
      *   $B$ total 20. Ratio $Ro:Sq$ is $10:40$ (1:4). $\to$ $B \cap Ro = 4, B \cap Sq = 16$.
  2.  **Update Shape ($P(Ro)=80$):**
      *   $Ro$ total 80. Current $R:B$ is $64:4$ (16:1). $\to$ $R \cap Ro = 75.29, B \cap Ro = 4.71$.
      *   $Sq$ total 20. Current $R:B$ is $16:16$ (1:1). $\to$ $R \cap Sq = 10, B \cap Sq = 10$.
  3.  **Final Marginals:** $P(R) = 85.29$, $P(Ro) = 80$.

  **Group Beta (Shape $\to$ Color):**
  1.  **Update Shape ($P(Ro)=80$):**
      *   $Ro$ total 80. Prior $R:B$ is $40:10$ (4:1). $\to$ $R \cap Ro = 64, B \cap Ro = 16$.
      *   $Sq$ total 20. Prior $R:B$ is $10:40$ (1:4). $\to$ $R \cap Sq = 4, B \cap Sq = 16$.
  2.  **Update Color ($P(R)=80$):**
      *   $R$ total 80. Current $Ro:Sq$ is $64:4$ (16:1). $\to$ $R \cap Ro = 75.29, R \cap Sq = 4.71$.
      *   $B$ total 20. Current $Ro:Sq$ is $16:16$ (1:1). $\to$ $B \cap Ro = 10, B \cap Sq = 10$.
  3.  **Final Marginals:** $P(R) = 80.00$, $P(Ro) = 85.29$.

  **The "Wrong" Strategy (Independence Assumption):**
  *   If a student forces independence at the end: $P(R \cap Ro) = P(R) \times P(Ro) = 0.8 \times 0.8 = 64$.
  *   **Penalty:** 64 units vs 75.29 units on the truth (Red/Round). ~15% score reduction.

  ## 5. Troubleshooting: What Will Go Wrong

  1.  **Arithmetic Errors:** Calculating 16/17ths of 80 without a calculator is painful.
      *   *Fix:* Insist on calculators. Provide the specific fractions (16/17, 1/17) on the board during the second update.
  2.  **Confusion on "Credence 0.8":** Students will ask, "Does this mean the sensor is 80% accurate?"
      *   *Fix:* Shut this down. "It means your *output* belief must be 0.8. Do not model the sensor. Model your mind."
  3.  **Rebellion against Rigidity:** "Why can't I update the correlation?"
      *   *Fix:* "That is the philosophical question for the debrief. For the game, Rigidity is the law. Violating it is like moving a chess knight like a bishop."
  4.  **The "Same Score" Confusion:** Both groups get ~75 points on the Truth (Red/Round). They might think there was no difference.
      *   *Fix:* Direct them to compare **$P(Red)$**, not the score. The score was for the "Wrong Strategy" penalty. The Marginal difference is for the "Order Effect" lesson.
  5.  **Time Overrun:** The math takes longer than expected.
      *   *Fix:* Pre-print the Intermediate States on a handout they can check against after Reading 1. This saves 10 minutes of troubleshooting.

  ## 6. Limitations (For the Debrief)

  Be prepared to defend these stipulations:
  1.  **Rigidity is not a Theorem:** It is a normative constraint. One *could* argue that uncertain evidence should change conditionals. The game cannot prove Rigidity is correct; it only shows what follows *if* you accept it.
  2.  **The "Reading" Proposition:** In real Bayesianism, we conditionalize on "I had a Red-ish experience." This game skips the likelihood $P(Experience | Red)$ and jumps straight to the posterior. This is a simplification of the "Problem of the Priors."
  3.  **Commutativity Recovery:** If the students had conditionalized on the *proposition* "The Reading occurred" (treating the reading as certain evidence of a reading), the order effect would vanish. The order effect exists *only* because we are treating the evidence as uncertain input to the marginals (Jeffrey) rather than certain input to the propositions (Standard).
