  **The World**
  The ontology consists of 100 distinct particulars existing over 10 discrete time steps ($t=0$ to $t=9$). The particulars divide exhaustively into two natural kinds: 50 are of Kind $\Alpha$, 50 are of Kind $\Beta$. Each particular possesses a single binary property $P$ (values 0 or 1) at each time step. The total state of the world is specified by 1,000 bits ($100 \text{ particulars} \times 10 \text{ steps}$).

  The dynamical rule is deterministic and local: the value of $P$ for any particular at $t+1$ is a fixed function of its own value and its neighbors' values at $t$. The neighbor structure is a fixed graph known to all systems. The initial condition ($t=0$) is a specific 100-bit string. In this world, the actual history is such that every particular of Kind $\Alpha$ has value 0 at every time step. The particulars of Kind $\Beta$ exhibit a complex, patternless distribution of 0s and 1s consistent with the dynamical rule given the initial conditions.

  **The Generalisation**
  $G$: "All particulars of Kind $\Alpha$ have value 0 at all times."
  $G$ is exceptionless, true, and stated solely in terms of the natural kind $\Alpha$ and the natural property $P$. It is instantiated 500 times (50 particulars $\times$ 10 steps). It is not a vacuous truth, as the dynamical rule permits $\Alpha$ particulars to take value 1 given different initial conditions or neighbor states; the history simply never realizes these possibilities.

  **The Two Systems**
  Both systems are true of the world and entail the complete history (perfect Fit). They differ in how they encode the truth about $\Alpha$ particulars.

  *   **System $S_1$ (Law-Inclusive):**
      *   **Axioms:** (1) The general dynamical rule for Kind $\Beta$; (2) A general constraint: "All $\Alpha$ particulars are 0 at all times."
      *   **Particular-Fact Base:** The initial values of $P$ for all Kind $\Beta$ particulars (50 bits). The values for Kind $\Alpha$ are derived from Axiom (2).
      *   **Simplicity Cost:** Let $L_{\text{constraint}}$ be the bit-length of Axiom (2). Let $L_{\text{dynamics}}$ be the bit-length of the dynamical rule. Total = $L_{\text{dynamics}} + L_{\text{constraint}} + 50$.

  *   **System $S_2$ (Law-Exclusive):**
      *   **Axioms:** (1) The general dynamical rule for all particulars (Kind $\Alpha$ and $\Beta$).
