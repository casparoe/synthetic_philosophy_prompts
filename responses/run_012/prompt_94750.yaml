  **The Humean Account**
  Lawhood is determined by the Best System. Since $S_1$ and $S_2$ tie for best, there is no unique Best System. In $S_1$, $G$ is a law (it is an axiom). In $S_2$, $G$ is an accident (it follows from axioms plus contingent initial conditions). Because the account relies on the selection of a unique best system to fix lawhood, and the simplicity exchange rate prevents a selection, the account delivers no verdict. It is indeterminate whether $G$ is a law.

