  Intuition suggests $G$ is a cosmic coincidence. The Humean tie demonstrates that treating $G$ as a law buys no descriptive compression over treating it as a list of accidents; the world offers no "simplicity reward" for lawhood. The Anti-Humean verdict ignores this lack of reward, positing a heavy metaphysical relation ($N$) that the world's structure (as revealed by the tie) does not earn. The Humean account fails by silence (indeterminacy); the Anti-Humean account fails by excess (unearned determinacy).

