answer: |-
  ### What's really being asked

  At its core, this isn't a math problem; it's a conflict between two different ways of valuing human life. Your brother-in-law is arguing from **consequences**: the moral goal is to produce the best outcome (the most survivors). Your roommate is arguing from **rights**: the moral goal is to treat every individual with equal respect, regardless of the outcome.

  The disagreement is about whether a rescuer has the authority to weigh lives against one another. If you say "yes," you accept that individuals can be aggregated into a group total. If you say "no," you accept that every person has an indivisible claim to safety that can't be outvoted by others. The tension spikes because Dan wasn't just solving a puzzle; he was bearing the weight of a life-or-death decision with no time to think, and now he's being asked to justify a choice that feels like a betrayal of the person he left behind.

  ### The case for taking the two

  Your brother-in-law's position is the most intuitive one for emergency responders. If you are a firefighter, a triage nurse, or a rescuer, your implicit mandate is to minimize loss. In this framework, every life is a unit of value, and preserving two units is objectively better than preserving one. It's not that the single guy matters *less* as a human being; it's that the *situation* demands maximizing the good.

  The strength of this argument is revealed in your brother-in-law's "100 vs. 1" point. If there were 100 people on one rock and one on the other, almost everyone would agree saving the 100 is the only moral choice. If that principle is true at 100, it must logically hold at two, even if the margin is smaller. To argue otherwise suggests that numbers only matter once they reach a certain threshold, which is an arbitrary line to draw. By choosing the couple, Dan ensured the continuation of two biological lives, two sets of memories, and two futures. In a crisis where resources are scarce, choosing the option that saves the most people is the most defensible way to limit total tragedy.

  ### The case for the coin flip

  Your roommate's hesitation comes from a fear of "moral arithmetic." When you add people up like numbers, you risk treating the individual on the smaller rock as a means to an end, rather than a person with their own right to exist. From this perspective, Dan doesn't own the authority to decide who is "worth" more. A coin flip acknowledges that all three people had an equal claim to rescue, and since Dan couldn't save everyone, chance is the only neutral arbiter.

  This view protects the dignity of the individual. It argues that the single guy's right to life doesn't diminish just because there happened to be two people on the other rock. If we accept that two lives always trump one, we open the door to uncomfortable questions: Do three healthy people trump one elderly person? Do five strangers trump one surgeon? The coin flip avoids sliding down that slope. It admits that the situation is tragic no matter what, and rather than playing God by weighing value, it distributes the risk equally. It's not about the outcome; it's about the fairness of the process when an impossible choice is forced upon us.

  ### Does the couple thing matter?

  Biologically and ethically, the marriage certificate shouldn't change the math. There were two hearts beating on that rock and one heart beating on the other. If Dan had seen two strangers huddled together for warmth on the first rock, the calculation of "two lives vs. one life" remains identical. To let their relationship status influence the decision would be to value them not as individuals, but as a social unit, which complicates things unnecessarily.

  However, human psychology makes it feel different. We perceive a couple as a "package deal"—losing one destroys the other's world, so saving both feels like saving a deeper bond. But this is a distraction. The single man on the other rock might have had a child, a dependent parent, or a community that relied on him just as deeply. We don't know the web of connections any of them had. The marriage is a narrative detail that makes the "two" feel more cohesive, but in the cold reality of a flash flood, they were simply two distinct claims to survival versus one. It shouldn't change the decision, but it does explain why Dan might feel the pull of that rock more strongly.

  ### What I'd tell Dan

  I would tell Dan that he is suffering from the luxury of hindsight, which is a cruel thing to inflict on a rescuer. He made a split-second decision under extreme duress with incomplete information, and he chose the path that preserved the most life. That is not a failure; that is a burden he accepted to keep others breathing. The guilt he feels isn't proof he did wrong; it's proof that he cares deeply about the value of every single person, even the one he couldn't reach. He shouldn't let the ghost of the "what if" erase the reality of the two people who are alive because of him. He didn't choose who mattered more; he chose what was possible. He needs to forgive himself for being human in a situation that demanded he be a god.
