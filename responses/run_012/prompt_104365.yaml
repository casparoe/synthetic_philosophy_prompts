prompt: |-
  Okay so this is going to sound like a hypothetical but it actually happened to a friend of mine last summer, and I've been turning it over ever since, and I keep going back and forth, so I'd really like your take. There was a flash flood near a hiking trail and my friend—let's call him Dan—was the only one around with a little inflatable kayak. Two people were stranded on one rock, and one person was stranded on another rock a ways off. The water was rising fast and he could only get to one rock before it got too dangerous to be on the water at all; he couldn't do both, no way around it. The two on the first rock were a married couple. The one on the other rock was a guy on his own. Everyone was awake and yelling for help, and there wasn't anything special about any of them—nobody was a doctor, nobody was a kid, they all seemed about equally healthy. Dan agonized and eventually took the couple, and the single guy... well, he did get out, barely, but it was close, and Dan still feels sick about it.

  Here's the part that's bothering me. My brother-in-law says Dan definately did the right thing, because two lives are more than one life, and that's just math. But my roommate says that's actually a pretty dark way to think—that it treats the single guy as if he mattered less, as if you can just add people up like they're numbers on a scale, and that the fair thing might've been to just flip a coin and let chance decide, since each person deserves an equal shot at getting picked. Then my brother-in-law came back with "well then why not say a hundred people on one rock lose a coin flip to one person on the other rock," and honestly I don't have a good answer to that. And there's this extra wrinkle I can't get out of my head: someone pointed out that the "two" were a married couple, so are they really two seperate claims, or is that just a story we're telling ourselves to turn two into one thing? If it had been two strangers on that rock instead, would that change anything? It feels like it shouldn't matter, but I can't explain why.

  Can you help me think this through? I don't want a textbook answer, I want to actually understand whats at stake and what I'd tell Dan. Could you lay it out like this: first a short section called "What's really being asked" where you pin down the actual disagreement, then "The case for taking the two" and "The case for the coin flip" (a couple paragraphs each, and steelman them, don't give me strawmen), then a bit on "Does the couple thing matter?" where you tell me whether the fact that they were married changes the math or is just a distraction, and finally "What I'd tell Dan" with your honest take in a paragraph or so.
