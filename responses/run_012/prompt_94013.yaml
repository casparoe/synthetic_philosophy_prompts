  Here is the breakdown of why, the competing rules, and how to settle it.

  ---

  ### 1. Reverse-Engineering the Function
  We are trying to find the function $f(Motive, Character) \rightarrow \{Worth, No Worth\}$.
  Let's look at the two strongest candidate rules that fit her five previous verdicts perfectly.

  #### Candidate Rule A: The "Moral Reason" View (Motive Content)
  **The Rule:** An action has moral worth if and only if the sufficient motive for the action is a *moral consideration* (duty, fairness, harm), regardless of the agent's long-term character.
