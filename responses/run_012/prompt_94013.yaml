  **Prediction for Marcus:** Marcus's stated motive is "The change was wrong." This is a moral consideration. He sacrificed self-interest (bonus), ruling out prudence.
  **Prediction:** **YES.**

  #### Candidate Rule B: The "Stable Disposition" View (Character)
  **The Rule:** An action has moral worth only if it flows from a stable, reliable disposition to respond to moral reasons. A one-off act by an unprincipled agent is an anomaly, not moral worth.
