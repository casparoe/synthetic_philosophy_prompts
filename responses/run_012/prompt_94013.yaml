  **1. The Definition of "Moral Worth"**
  In philosophy (specifically the Kantian tradition Nadia is likely working in), "moral worth" is a property of the *will in the moment of action*, not the *character of the agent over time*. A sinner can perform a morally worthy act. If Nadia were judging "Praiseworthiness" or "Virtue," Rule B would apply. But she specifically uses the technical term "Moral Worth."

  **2. The Nuance of Case 3**
  Case 3 is the most important data point. The woman says she "would stop if the feeling ever went away." Nadia *still* says YES. This proves Nadia does not require a commitment to principle that survives emotional changes. She accepts a motive that is contingent on the agent's internal state, provided that state tracks a moral value (hunger).
