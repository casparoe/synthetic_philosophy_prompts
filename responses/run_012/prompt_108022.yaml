  **POSITION:** Inventory Control Associate
  **COMPANY:** Principled Operations Ltd.
  **LOCATION:** Zone 4 Warehouse
  **SALARY:** £12.50/hour (Note: Acceptance of salary may void moral standing)

  **THE ROLE**
  Principled Operations Ltd. is seeking a candidate to perform routine stock checks. We are not interested in your skills, experience, or competence. These are merely technical capacities. We are interested exclusively in the moral worth of your actions. Per our corporate ethics policy, an action only possesses moral worth if it is done *from* duty, not merely *in accordance* with duty.

  We do not want employees who count boxes accurately because they enjoy organization. We do not want employees who are honest because they fear getting caught. We require staff who act solely out of reverence for the moral law.

  **REQUIREMENTS**
  *   **Absence of Inclination:** You must not derive satisfaction from the tasks listed above. If you find inventory control fulfilling, you are acting on inclination, not duty. Please do not apply.
  *   **Independence from Reward:** You must not perform this job to secure the attached wage, benefits, or housing stability. These are hypothetical imperatives ("If you want money, work"). We require categorical imperatives ("Work because it is right").
  *   **Social Indifference:** You must not perform duties to gain the approval of managers or peers. Being perceived as a "hard worker" is irrelevant to moral worth.
  *   **Motivational Transparency:** You must be able to distinguish between doing the right thing because it is right, and doing the right thing because it suits your temperament. If you are naturally conscientious, you are suspect.

  **APPLICATION QUESTIONS**
  *Please answer honestly. Lies detected during probation will result in immediate dismissal for lack of integrity.*

  1.  **Why do you wish to occupy this position?**
      *(Note: Answers citing financial need, career progression, or personal interest will be rejected. Answers citing "because it is my duty" will be scrutinized for performative contradiction.)*

  2.  **How do you verify that your motive is pure?**
      *(Note: Applicants must acknowledge that introspection is unreliable. If you claim certainty regarding your own virtue, you demonstrate a lack of philosophical rigor.)*

  3.  **If the salary were withdrawn tomorrow, would you continue to count boxes?**
      *(Note: If "Yes," you are irrational. If "No," you are motivated by reward. Please explain this paradox in 50 words or less.)*

  **SUBMISSION NOTICE**
  By submitting this application, you acknowledge that the act of applying demonstrates a desire for employment. Since desire is an inclination, submission of this form may automatically disqualify you from consideration. However, failure to submit prevents assessment.

  Principled Operations Ltd. is an equal opportunity employer. We do not discriminate based on race, gender, or capacity for autonomy. However, we reserve the right to reject candidates who are too happy to be here.

  *No agencies. No referrals. Duty must be self-imposed.*
