      *Refining the Kantian nuance:* Make sure to mention "in accordance with duty" vs "from duty."
      *Refining the HR satire:* "Cultural fit" becomes "Motional Purity."

      *Wait, one constraint:* "It gets read aloud... has to be funny to them and not make the one actual philosophy graduate in the group wince."
