prompt: |-
  I'm a retired fisheries biologist — 68, hung up the waders three years ago — and I've gotten into philosophy the way other people get into golf. There's a reading group that meets in the back room of the pub and next month the topic is moral worth, which means we all have to bring something. I've decided mine should be a parody job advertisement.

  Here's the setup, tell me if it works. A company has read Kant properly and taken the idea that only actions done from duty — not from enjoyment, not because they suit you — have moral worth, and applied it completely literally to its hiring. So the ad is for some utterly ordinary job, warehouse or reception, doesn't matter, but every requirement is about why you would do the job rather than whether you can do it. They're only interested in someone who'd do it out of respect for what's right. And of course anyone who sends in an application is doing it because they want the job, which is a want and not a duty, so they're definately in trouble before they start.

  Two things I want you to keep straight, because they're the actual meat and I don't want it collapsing into ha ha HR is fake:

  - Doing the right thing because you saw it was right is not the same as doing the right thing for some other reason that happens to line up with it — someone who is kind because they want to be liked, say. The ad should have to deal with both kinds of applicant, and it should notice that a motive isn't something you can just look inside yourself and check; and that the moment they start testing for it, everyone filling in the form is acting for the sake of the test.
  - If the worth of an action depends on it not being done for a reward, and the job pays, then maybe no morally worthy act is available inside that company at all, and they should end up in a bind they can't advertise their way out of.

  Write it deadpan, no winking, as a real posting: bullet-pointed requirements plus a short application form with two or three questions that can't honestly be answered. About 600 words. It gets read aloud to a pub full of people who've read one philosophy book each, so it has to be funny to them and not make the one actual philosophy graduate in the group wince. And it should bite a bit on how real employers now want to know not just what you'd do but why you'd do it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Retired fisheries biologist (68), new to philosophy, joining a pub reading group.
      *   **Topic:** Moral Worth (Kantian ethics).
      *   **Task:** Write a parody job advertisement based on a literal interpretation of Kant's idea that only actions done from duty (not inclination/enjoyment/reward) have moral worth.
      *   **Tone:** Deadpan, no winking, looks like a real posting.
      *   **Length:** About 600 words.
      *   **Key Constraints/Themes to Embed:**
          1.  Distinguish between doing right because it's right vs. doing right because it aligns with inclination (e.g., wanting to be liked).
          2.  Acknowledge the opacity of motives (you can't just check inside yourself).
          3.  Acknowledge the performative contradiction (applying for the job is itself an inclination-based act).
          4.  Highlight the structural contradiction (working for pay undermines moral worth).
          5.  Satirize real employer trends (wanting to know *why* you'd do the job, not just *if* you can).
      *   **Audience:** Pub reading group (mixed levels of philosophy knowledge, one actual grad student). Needs to be funny but philosophically sound enough not to make the grad student wince.

  2.  **Deconstruct the Philosophical Core (Kantian Ethics):**
      *   *Good Will:* The only thing good without qualification.
      *   *Duty vs. Inclination:* Actions have moral worth only if done from duty, not merely *in accordance* with duty.
      *   *The Shopkeeper Example:* Kant's famous example of the honest shopkeeper. If he charges fair prices because it's good for business (inclination), no moral worth. If he does it because it's right (duty), moral worth.
      *   *The Paradox:* If a company hires only for moral worth, they need someone who works *only* because it's right. But working for a wage is an inclination (self-interest). Therefore, a paid job cannot be done from pure duty.
      *   *The Application Process:* Asking someone "Why do you want this job?" forces them to lie if the answer must be "I don't want it, I must do it."

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look corporate but slightly off. "Ethical Compliance Solutions" or something similar. Let's go with "Principled Operations Ltd."
      *   **Job Title:** Something mundane. "Logistics Associate" or "Receptionist." Let's go with "Inventory Control Associate."
      *   **Introduction:** State the company's commitment to moral purity. No mission statements about synergy, only about duty.
      *   **Requirements (The Meat):**
          *   Must not enjoy the tasks.
          *   Must not do it for the money (but the job pays).
          *   Must not do it for social approval.
          *   Must recognize the Categorical Imperative.
      *   **Application Questions:**
          *   Question 1: Probe the motive (cannot be answered honestly).
          *   Question 2: Probe the reward contradiction.
          *   Question 3: Probe the self-knowledge issue.
      *   **Closing:** The bind. If you apply, you're out. But you must apply to be considered.

  4.  **Refining the Tone:**
      *   Avoid slang.
      *   Avoid obvious jokes ("Ha ha, Kant is hard").
      *   Use HR speak but twisted philosophically ("inclination alignment," "motivational purity").
      *   Ensure the contradiction is palpable but stated as policy.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Title: Job Opening.
      *   Company: We value duty.
      *   You must hate this job but do it anyway.
      *   If you like helping people, don't apply.
      *   If you need the money, don't apply.
      *   Questions: Why are you here? (Can't say for money). Do you like counting boxes? (Must say no). How do you know you're virtuous? (Impossible).
      *   Pay: £12/hr (this creates the contradiction).

  6.  **Drafting - Iteration 2 (Writing & Polishing):**
      *   *Check Word Count:* Need to hit around 600.
      *   *Check Philosophy:* Ensure the distinction between "in accordance with duty" and "from duty" is clear.
      *   *Check Satire:* Mock the way employers ask for "passion" but flip it to "lack of passion."

      *(Self-Correction during drafting)*: Make sure I don't make it *too* abstract. It needs to sound like a job ad. Use bullet points.
      *(Self-Correction on Philosophy)*: Kant doesn't say you can't *have* inclinations, just that they can't be the *determining ground* of the will. The ad should reflect the impossibility of verifying this.
      *(Self-Correction on the Pay Paradox)*: The prompt specifically asks to highlight that paying for the job undermines the moral worth. I need to make sure the ad acknowledges the wage but insists it shouldn't be the reason.

  7.  **Final Polish:**
      *   Read aloud rhythm.
      *   Ensure the "bite" on modern hiring practices is present (employers wanting access to inner lives).
      *   Check the ending. It needs to land the paradox.

  8.  **Word Count Check:** Aiming for ~600.
      *   Header: 50 words.
      *   Intro: 100 words.
      *   Requirements: 200 words.
      *   Application Questions: 150 words.
      *   Closing/Disclaimer: 100 words.

      *Let's write.*

      (Drafting content...)
      *   "Principled Operations Ltd."
