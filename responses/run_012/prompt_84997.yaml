      *   *Conciliationism vs. Steadfastness:* Conciliationism says lower confidence upon learning of disagreement. Steadfastness says maintain confidence if you think your reasoning is sound.
      *   *Higher-Order Disagreement:* C enters the picture. Now A and B disagree, and they both disagree with C. Does C's presence force A and B to conciliate more?
      *   *Action vs. Belief:* Deadline forces a choice (submit paper saying effect exists or doesn't). Suspension of judgment is epistemically ideal but pragmatically impossible.
      *   *Self-Application:* Does the conciliationist principle apply to the disagreement about conciliationism itself?

  3.  **Drafting - Section by Section:**

