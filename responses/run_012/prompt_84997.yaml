prompt: |-
  I'm a 4th year PhD student in epistemology and I need help drafting something for a seminar that's turned into a two-year fight. Two people in my department are going at it about peer disagreement: one is a concilliationist, the other is a steadfast person. They keep rehashing the same old cases and talking past each other. I want to force them to write the joint statement they could both sign after a real adverserial collaboration. Can you draft that document? Make it about a concrete case, not just the abstract labels. Here's the case I want them to work through: A and B are both PhD students in the same lab. They have the same public dataset and the same statistical training. They disagree about whether a treatment effect is real. A says yes, B says no. They agree each is the other's epistemic peer on this question. But there's a twist: A has a private simulation that B hasn't seen, and B has a private proof sketch that A hasn't seen. Each thinks the other would be persuaded if they saw the private evidence, but neither can fully share it before the paper deadline. Also, their errors are correlated because they were trained in the same lab and share a supervisor. Does that make them non-peers? And a third student, C, who is a peer of both, thinks they are both wrong and that the effect is real but in the opposite direction. So there is higher-order disagreement about the disagreement. I want the joint statement to cover: (1) what they agree on about peerhood, higher-order evidence, and what rationality requires in this case; (2) the precise remaining disagreements, each phrased in a way that side would accept; (3) the cruxes, like whether correlated error defeats peerhood, whether private evidence counts, whether the conciliationist principle applies to itself, and whether suspension of judgment is a live option when a deadline forces a choice; (4) for each crux, a case or argument both sides agree would bear on it, plus what each side predicts; (5) which parts of the dispute are genuine and which are just verbal. Format it as a numbered agreed-claims section and then a disagreements table. No citations or reading list, please. And write it in American English.
