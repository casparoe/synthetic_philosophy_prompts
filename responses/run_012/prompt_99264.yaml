      *   The "Common Man" (Matthew): He breaks the fourth wall. He is the audience. He survives. This complicates the "imitate the hero" message.

  7.  **Synthesize the Conclusion (The "What the Play Shows" part):**
      *   Plutarch says: Study the great to become great.
