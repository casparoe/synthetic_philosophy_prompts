      *   *The Conflict:* Plutarch implies "you can do this too." Hagiography implies "he was a saint, you are not."
      *   *The Pairing:* Plutarch uses contrast (Greek vs. Roman). Bolt uses contrast (More vs. Rich/Cromwell/Wolsey). But Bolt's contrasts are often caricatures (Rich is a sniveling villain), whereas Plutarch's subjects are usually both great men with different flaws.

  3.  **Address the "Imitation vs. Admiration" Question:**
