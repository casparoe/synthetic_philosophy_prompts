answer: |-
  This is a formidable lens for *A Man for All Seasons*. Plutarch's *Parallel Lives* operates on the premise that virtue is transferable through observation—that by seeing the shape of a great soul, we can mold our own. Bolt, however, is writing drama, not moral philosophy, and he is acutely aware that a saint on stage risks becoming a statue.

  Here is a breakdown for your discussion group that navigates the tension between Plutarchan biography, hagiography, and the situationist critique, anchored in specific scenes.

  ### 1. The Plutarchan Gesture vs. The Hagiographic Icon
  Plutarch argues that a jest or a meal reveals more than a battle. Bolt knows this and uses it to humanize More, pulling him back from hagiography. However, he also risks turning those gestures into symbols.

  *   **The Scene:** **Act One, the Boatman and the Cloak.**
      More gives his heavy cloak to the shivering boatman. Later, when it rains, More complains, "I'm cold." When told the boatman has the cloak, More says, "He's more entitled to it than I." Then, immediately: "But I want my cloak."
      *   **Plutarchan Reading:** This is classic *ethos*. It shows charity, but also a very human attachment to comfort. It suggests a man who *chooses* virtue despite his instincts, which is imitable.
      *   **The Resistance:** Bolt stages this almost as a vaudeville turn. It's too perfect. It risks making More's humanity a performance for the audience rather than a lived reality. If the "small gesture" feels scripted, does it lose its moral weight?
      *   **Discussion Point:** Does this scene make More *more* imitable (because he feels cold) or *less* (because he treats his own charity as a joke)?

  *   **The Scene:** **Richard Rich and the Silver Cup.**
      More gives Rich a silver cup to bribe him into silence. Rich accepts it and immediately uses it as leverage to perjure himself later.
      *   **Plutarchan Reading:** This is the negative counterpart. Plutarch often contrasts virtues. Here, the small gesture (the gift) reveals the rot in Rich.
      *   **The Resistance:** Rich is not a complex "life" in the Plutarchan sense; he is a function. Plutarch's villains usually have their own nobility or tragic flaws. Rich is purely venal. This pushes the play toward hagiography: if the foil is a caricature, the hero looks like a saint by default, not by comparison.

  ### 2. The Problem of Pairing: Imitation vs. Admiration
  Plutarch pairs lives (Alexander/Caesar, Demosthenes/Cicero) to show different *ways* of being great. Bolt pairs More against a chorus of moral inferiors (Rich, Cromwell, Wolsey, Norfolk).

  *   **The Implication:** Plutarch asks, "Which man should you emulate?" Bolt asks, "Can you survive when no one else is like you?"
  *   **The Scene:** **Norfolk's Plea (Act Two).**
      Norfolk begs More to sign. "I am not a scholar... I am a soldier." He appeals to friendship, to safety, to common sense. More refuses.
      *   **The Distinction:** If Plutarch wants us to *imitate*, Bolt seems to want us to *witness*. More does not ask Norfolk to be like him; he asks Norfolk to let him be.
      *   **Discussion Point:** Plutarch assumes virtue is contagious. Bolt suggests virtue is isolating. If the moral lesson is "stand alone," is that a lesson one can actually build a society on? Or is it a lesson only for the martyr?

  ### 3. The Situationist Critique: Is Character Stable?
  Situationism argues that "character" is a myth; behavior is determined by context. If More is only brave because he is Thomas More (with specific theological training and social status), what is the utility of his life for us?

  *   **The Scene:** **The Common Man (Matthew).**
      The Common Man plays the Boatman, the Innkeeper, the Jailer, the Foreman of the Jury. He survives by adapting to every situation. He says, "I'm not a hero... I'm just a man."
      *   **The Situationist Argument:** The Common Man is the control group. He proves the situationists right. In a different context, he is a different person. He survives because he has no "self" to compromise.
      *   **More's Counter:** More's courage isn't a general trait (he isn't brave in battle; he's a lawyer). It is specific to the *oath*. He says, "When a man takes an oath, he's holding his own self in his own hands."
      *   **The Resistance:** Bolt admits More is an anomaly. The play doesn't prove you *can* be More; it proves how hard it is. The Situationist says, "You can't learn courage from More because you aren't in More's situation." Bolt replies, "The situation is always trying to crush the self; the specific pressure changes, but the pressure remains."
      *   **Discussion Point:** Does the Common Man vindicate the situationists? He is the only one who lives to tell the tale. Is survival a valid moral victory?

  ### 4. Where the Play Resists the Plutarchan Reading
  To keep this from becoming a simple illustration of Plutarch, you must highlight where Bolt undermines the idea that we can "learn" from More in a straightforward way.

  *   **The Scene:** **The Final Speech.**
      More says, "I die the King's good servant, but God's first."
      *   **The Resistance:** This is hagiography. It resolves the tension. But earlier, More admits he is afraid. "I feel I could... I could give in." He touches the block. He is trembling.
      *   **Why it matters:** Plutarch's heroes often face death with stoic calm. Bolt's More is terrified. This resists the "great man" biography. It suggests that integrity isn't the absence of fear (a character trait), but the action taken *despite* fear (a choice).
      *   **Discussion Point:** If More is terrified, is his virtue still "character"? Or is it a momentary decision? If it's a momentary decision, can we learn to make it, or do we just have to hope we make it?

  ### 5. Conclusion: What the Play Adds to Plutarch and Situationism
  You asked to end by saying what the play shows about learning from lives that the other two frameworks miss.

  **Plutarch** assumes a stable self that can be improved by modeling.
  **Situationism** assumes no stable self, only reactions to environment.

  **Bolt's *A Man for All Seasons* suggests a third option:**
  The self is not a pre-existing trait (Plutarch) nor is it non-existent (Situationism). **The self is something you construct through refusal.**

  More does not go to the block because he is "brave." He goes to the block because he has spent the whole play defining what he is *not*. He is not a politician, not a yes-man, not a martyr-by-choice. He defines his boundaries (the silence, the law, the oath) until there is nowhere left to stand but the block.

  **The Takeaway for your Group:**
  The play does not ask you to imitate More's specific actions (refusing an oath to the King is rarely the modern dilemma). It asks you to identify what constitutes your "self."
  *   Plutarch says: "Look at More to see how to be good."
  *   Situationism says: "Look at the Court to see why you will fail."
  *   Bolt says: "Look at the silence between More and the Court. That silence is where you live."

  The lesson isn't "Be a Saint." The lesson is that if you do not define what you will not sell, the situation will define it for you (as it does for Rich and the Common Man). The "Life" is not a model to copy, but a mirror to check if you have a self worth defending.

  **Final Discussion Question:**
  "Plutarch writes lives so we might improve ourselves. Bolt writes this life to show us the cost of having a self. Which is a more useful tool for living in our current political moment: the hope of improvement, or the warning of the cost?"
