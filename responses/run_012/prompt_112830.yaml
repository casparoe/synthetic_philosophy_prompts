answer: |-
  # JOINT STATEMENT ON THE ONTOLOGY OF NEURAL REPRESENTATIONS
  **Date:** October 26, 2023
  **Parties:** The Representational Realism Working Group & The Interpretive Deflationism Working Group

  ## 1. POSITIONAL RECONSTRUCTION

  We, the undersigned, acknowledge two distinct stances regarding the internal structure of trained neural networks. We adopt the following labels for the purpose of this collaboration:

  **The Realists** hold that a trained network's activation space contains a determinate set of features over which its computation factorizes. They maintain that interpretability methods are discovering pre-existing structure, and that disagreements among methods (e.g., regarding sparsity or basis choice) are matters of resolution or noise, akin to measuring a physical object with instruments of varying precision. For the Realist, the network possesses a "native basis" that makes its computation intelligible.

  **The Deflationists** hold that talk of what the network represents is a description of the analyst's model of the network rather than of the network's own content. They maintain that the apparent objects of interpretability (features, directions, circuits) are induced by the analyst's choices—specifically the probe class, the labeled dataset, the sparsity penalty, and the dictionary width. For the Deflationist, features are useful fictions that compress the input-output map, not ontological constituents of the mechanism.

  ## 2. GRADES OF COMMITMENT

  We distinguish three grades of commitment regarding neural internal states. We specify our adherence to each below.

  **Grade (i): Informational/Causal Utility**
  *Claim:* Internal states carry information about behaviorally relevant distinctions and support predictions of downstream activations or final outputs.
  *   **Realists:** Committed.
  *   **Deflationists:** Committed.
  *   **Status:** **Common Ground.** Both sides agree that activations are not random noise and that linear or non-linear mappings from activations to outputs exist and are stable.

  **Grade (ii): Canonical Decomposition**
  *Claim:* There is a canonical decomposition of activation space into features, unique up to an equivalence class (permutation, invertible re-parameterization) that leaves behavior invariant, over which the computation factorizes.
  *   **Realists:** Committed. They argue that while the basis may be rotated or scaled, the underlying semantic directions are fixed by the training objective and data distribution.
  *   **Deflationists:** Reject. They argue that the activation space admits multiple, equally valid decompositions that are not equivalent under simple transformations, and no single decomposition is privileged by the mathematics of the network itself.
  *   **Status:** **Core Disagreement.**

  **Grade (iii): Semantic Content**
  *Claim:* Internal states have content about the world (aboutness), not merely causal roles in producing outputs.
  *   **Realists:** Committed. They argue that specific activations refer to external concepts (e.g., "dog," "sentiment") independently of the analyst.
  *   **Deflationists:** Reject. They argue content is ascribed by the analyst based on external validation; the network itself only possesses causal topology.
  *   **Status:** **Mixed.** We acknowledge this quarrel may be partially verbal (depending on the definition of "content"), but it reflects a substantive disagreement on whether semantics is intrinsic or extrinsic to the mechanism.

  ## 3. AGREED CLAIMS

  The following claims are signed by both camps as empirically sound and non-vacuous.

  1.  **Superposition is Prevalent:** Networks routinely encode more distinct features than they have available dimensions in activation space, necessitating non-orthogonal, interfering representations.
  2.  **Reconstruction Underdetermination:** Many overcomplete dictionaries can reconstruct the same activation vectors with approximately equal fidelity; reconstruction error alone cannot single out a unique feature set.
  3.  **Probe vs. Intervention Gap:** High held-out accuracy of a linear probe does not guarantee that the probed direction is load-bearing; a direction can be correlated with a feature without causally influencing the output when intervened upon.
  4.  **Interaction Dominance:** Intervening on several alleged features simultaneously often yields output changes that are not the sum of individual interventions, indicating significant interaction terms or non-linearity in the feature basis.
  5.  **Hyperparameter Sensitivity:** The specific features extracted by current dictionary learning or probing methods vary significantly with hyperparameters (e.g., sparsity coefficients, dictionary width), even when random seeds are controlled.
  6.  **Behavioral Equivalence is Coarse:** Two networks with distinct internal activation geometries can produce indistinguishable input-output behaviors on all tested distributions.

  ## 4. RESIDUAL DISAGREEMENTS

  | Disagreement | Realist Position | Deflationist Position | Terminological? |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Features** | Features exist prior to discovery; methods approximate them. | Features are constructed by the method; they do not exist prior to analysis. | No |
  | **Role of Analyst** | The analyst is an observer removing noise to reveal structure. | The analyst is a participant imposing structure to enable explanation. | No |
  | **Uniqueness** | A "true" basis exists, unique up to gauge-like freedom (scaling/permutation). | The "gauge freedom" is so large it swallows the notion of a unique basis. | Partial |
  | **Robustness Criterion** | Robustness across seeds/methods is evidence of reality. | Robustness is evidence of methodological stability, not ontological reality. | No |
  | **"Representation"** | Refers to the internal mechanism's structure. | Refers to the utility of the analyst's model. | **Yes** |
  | **Explainability Goal** | To reverse-engineer the network's own code. | To build a simpler model that mimics the network's behavior. | Partial |

  ## 5. CRUXES, TESTS, AND PREDICTIONS

  For each crux, we define the sub-question, the accepted test, and the pre-registered predictions of each camp.

  ### Crux 1: The Stability of Sparse Decompositions
  *   **Sub-question:** As dictionary width and sparsity penalties vary, do the top-k most important features for a given concept converge to the same directions?
  *   **Test:** Train multiple auto-interpretable dictionaries on the same layer with varying widths (overcomplete factors of 2x, 4x, 8x) and sparsity penalties. Measure the cosine similarity of the top-matching features for a fixed set of semantic concepts across these configurations.
  *   **Definition of "Same Feature":** Cosine similarity > 0.85 after optimal matching.
  *   **Realist Prediction:** Similarity will remain high (> 0.8) for high-variance features, degrading only for low-variance noise.
  *   **Deflationist Prediction:** Similarity will degrade significantly (< 0.5) as width increases, showing features split or merge based on capacity, not ground truth.

  ### Crux 2: Compositional Intervention
  *   **Sub-question:** Can we identify a basis in which interventions compose linearly?
  *   **Test:** Identify a set of candidate features. Perform single-feature ablations/additions and measure output change. Then perform simultaneous ablations/additions of pairs and triples. Calculate the residual error between the sum of single effects and the actual combined effect.
  *   **Definition of "Behavioral Equivalence":** Output logits change within 5% of the predicted linear sum.
  *   **Realist Prediction:** A basis exists where interaction residuals are minimal (< 10% of total effect) for semantically independent features.
  *   **Deflationist Prediction:** Interaction residuals will dominate (> 50% of total effect), indicating that any "feature" basis is entangled by the network's non-linear dynamics.

  ### Crux 3: The Compression Argument
  *   **Sub-question:** Does describing the network in terms of discovered features yield a lossless compression of the weights compared to describing the weights directly?
  *   **Test:** Attempt to reconstruct the network's weight matrices using only the identified feature circuits and their connection strengths. Compare the bit-cost of this description against the raw weights plus error term.
  *   **Definition of "Feature":** A direction in activation space coupled with a specific input/output profile.
  *   **Realist Prediction:** The feature-based description will be significantly more compact (lower bit-cost) for the same reconstruction error, indicating structure.
  *   **Deflationist Prediction:** The feature-based description will require so much metadata (to specify the basis and interactions) that it offers no compression advantage over the raw weights.

  ## 6. CONDITIONS FOR REVISION

  **What would count as a serious blow to Realism?**
  If it is demonstrated that for any proposed feature set, there exists an alternative feature set with equal sparsity and intervention power that is orthogonal to the first (i.e., no feature in Set A correlates with any feature in Set B), Realists must concede that the decomposition is not determinate.

  **What would count as a serious blow to Deflationism?**
  If a method is produced that recovers identical feature sets across vastly different architectures (e.g., Transformers and CNNs) trained on the same task without shared weights or analyst-imposed constraints, Deflationists must concede that the structure is intrinsic to the computational problem, not the analyst.

  ## 7. ASSESSMENT OF DEBATE MOBILITY

  We agree that **Crux 2 (Compositional Intervention)** is the only result likely to move the debate substantively.
  *   If interventions compose cleanly, it suggests the network computes using distinct units, favoring Realism.
  *   If interventions are hopelessly entangled, it suggests the "feature" view is a projection that fails to capture the causal mechanism, favoring Deflationism.

  Results regarding Crux 1 (Stability) and Crux 3 (Compression) are judged likely to be interpreted away by the losing side as artifacts of method or metric choice. Therefore, we prioritize intervention-based causality as the arbiter.

  ## 8. COUNTERFACTUAL CONTENT AND LEVEL OF DESCRIPTION

  We address directly the question of whether counterfactual content is well-defined once a computation graph is fixed.

  **The Realist View:** Once the graph and weights are fixed, the counterfactuals are fixed. If $A$ causes $B$, then intervening on $A$ must change $B$. Therefore, there is a fact of the matter about which internal states carry which content, determined by their counterfactual dependencies. The "level of description" is simply the resolution at which we read these fixed dependencies.

  **The Deflationist View:** Counterfactual content is *not* well-defined by the graph alone because "intervention" requires specifying *what* is being held fixed. Intervening on a single neuron vs. a linear combination of neurons yields different counterfactuals. Since the graph allows for infinite bases of intervention, the content is relative to the level of description chosen by the analyst. There is no "fact of the matter" about which level is the correct one without reference to an external goal (e.g., human intelligibility).

  **Conclusion on the Bottom Line:**
  We conclude that the disagreement is not solely verbal, but it is not purely empirical either. It rests on a metaphysical premise: **Is the "correct" level of description determined by the mechanism itself (Realism) or by the purposes of the interpreter (Deflationism)?**

  If the mechanism itself enforces a specific granularity (e.g., via discrete gating or extreme sparsity), the Realist view becomes empirically indistinguishable from truth. If the mechanism is smooth and highly entangled, the Deflationist view becomes pragmatically necessary. Until we determine the degree of entanglement (see Crux 2), the dispute remains open.

  ***

  **Signed,**

  *Lead Investigator, Representational Realism Working Group*
  *Lead Investigator, Interpretive Deflationism Working Group*
