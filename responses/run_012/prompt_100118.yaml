prompt: |-
  I'm prepping a grad seminar session on explanation in history and I want to run it around one fully worked case instead of the usual vague back-and-forth about whether history has laws. I've got a colleague who's a hard-liner about the old Hempel covering-law picture and I'm a narrativist, and we keep talking past each other, so I want a case that actually forces the issue rather than letting either of us wave at our favourite examples. I don't need you to cite anyone or give me a reading list, I know the literature well enough; what I want is the case itself, built to order.

  So: take one small, ordinary-scale historical episode -- a firm going under, a bridge failing, a reform passing or not passing, a manuscript getting lost, something like that, no revolutions, no counterfactual worlds -- and give me two descriptions of the very same episode, same evidence, same underlying facts. Description A should be coarse-grained, pitched at the level of types: the kind of thing the covering-law model can subsume under a general regularity, so that the subsumption really does satisfy the deductive-nomological requirement, and yet where the narrativist's complaint that 'this explains nothing about this case' feels obviously right. Description B should be fine-grained, at the level of this token event with its particular concatenation of contingencies, where a narrative reconstruction plainly does explain it and yet you can't produce any non-trivial law that covers it -- and where the covering-law theorist's comeback ('there must be a law in there somewhere, you just haven't stated it') looks like a cost rather than a save. Keep the event fixed across A and B; the only thing that should change is the grain of the description.

  Then do the work. For each description, say exactly what the covering-law model demands and why it lands on its verdict (mind the symmetry thesis, and mind what happens if the only law on offer is statistical), what the narrative account delivers and on what grounds, and be honest with me about which feature of the case is doing the heavy lifting -- is it the type/token grain, the availability of laws, or the difference between a causal chain and mere subsumption? Tell me what happens if I pull that feature out, and finish with the strongest reply a defender of the covering-law model could make against the B-description, and whether it actually works. And please don't just declare by fiat that B is an explanation -- if the narrativist verdict only holds because you stipulated it, the case is useless to me.
