answer: |-
  This is a remarkably well-posed problem. You have the rare convergence of production (Poet), measurement (CompLing), and ontology (Philosopher), coupled with a technological shift (LLMs make generating constrained variants cheap; neural metrics make scoring them plausible).

  Your suspicion is correct: constrained translation has been treated as a parlor game because the *cost* of generating variants was previously too high to treat it as a search space. Now that it is a search space, it becomes an optimization problem, which makes it theoretical fodder.

  Here is the defended agenda, the critique of your notions, and the ordering criteria.

  ### I. Critique of Your Three Notions

  Before ordering the work, we must triage the concepts. Two are theoretical engines; one is a user interface.

  **1. The Constraint Lattice (Real Theoretical Object)**
  *   **Verdict:** This is your core contribution.
  *   **Why:** In translation studies, trade-offs are usually anecdotal ("I lost the rhyme to save the metaphor"). In optimization theory, they are surfaces. By formalizing constraints as a partial order, you move from "translation is art" to "translation is navigation through a high-dimensional constraint space."
  *   **Risk:** It dissolves if "semantic fidelity" remains vague. Your CompLing partner must define fidelity not as "BLEU score" but as a vector of semantic preservation (e.g., entailment, tone, imagery). If you cannot quantify the axes, the lattice is just a metaphor.

  **2. Phantom Constraints (Real, but Dangerous)**
  *   **Verdict:** This is "Genre Norms" rebranded, but the rebranding is useful *if* operationalized.
  *   **Why:** Readers expect sonnets to turn at line 9, even if not told it's a sonnet. This is statistical expectation based on corpus exposure.
  *   **Risk:** It dissolves into subjective reader-response theory. To make it formal, your CompLing partner must treat this as an *anomaly detection* problem against a baseline corpus of target-language poetry. If a rendering deviates from the target's prosodic norm without the source demanding it, is that a "phantom constraint" violation?
  *   **Action:** Keep it, but rename it "Implicit Prosodic Contracts" to force rigor.

  **3. The Sacrifice Ledger (Rebranding of Translator's Notes)**
  *   **Verdict:** Deprioritize as a research question.
  *   **Why:** You ask if making trade-offs explicit changes practice or reception. The answer is almost certainly "it changes reception pedagogy, but not the underlying math." A ledger is a visualization of the Lattice. It is the *output* of your research, not the *object* of it.
  *   **Action:** Use the budget to build a beautiful Ledger for your workshop, but do not spend research time asking if it "changes practice." It describes the Lattice; it does not generate new theory.

  ### II. Criteria for Ordering

  I have ordered the agenda based on three criteria, weighted for your specific constraints (2 years, part-time):

  1.  **Ontological Upstreamness:** You cannot measure trade-offs (Lattice) until you define what is impossible (Incompatibility).
  2.  **Computational Tractability:** Generation is cheap; evaluation is hard. We must solve the metric problem early.
  3.  **Human-in-the-Loop Cost:** Workshops and reader studies are slow and expensive. They must come last, once the automated pipeline is robust.

  ### III. The Agenda: A Two-Year Roadmap

  #### Phase 1: The Ontology of Constraint (Months 1–6)
  **Goal:** Formalize the Local/Global distinction and define "Incompatibility."
  **Lead:** Philosopher + CompLing.
  **Why First:** You cannot build a Lattice if you do not know which nodes are mutually exclusive.

  *   **Task 1.1: Constraint Taxonomy.** Don't just say "Local vs. Global." Define them computationally.
      *   *Local:* Verifiable line-by-line (rhyme, syllable count).
      *   *Global:* Verifiable only on the completed text (anagram, acrostic, total word count).
      *   *Dependency:* Does Constraint A require Constraint B to be solved first? (e.g., you can't check an acrostic until you choose line-initial words).
  *   **Task 1.2: The Incompatibility Metric.** This addresses your "underlying question."
      *   Generate 10,000 variants of a source text (e.g., *Le Ton beau de Marot* or a dense Rilke poem) under varying constraint sets.
      *   Measure the "Semantic Collapse." At what point does adding a constraint force the semantic fidelity to zero?
      *   **Theoretical Payoff:** A measure of "Form Capacity" for a language pair. E.g., "English can carry 80% of French syllabic constraints before semantic collapse, but only 40% of tonal constraints." This moves untranslatability from a philosophical claim to an empirical metric.

  #### Phase 2: Constructing the Lattice (Months 7–12)
  **Goal:** Map the Pareto Frontiers of translation.
  **Lead:** CompLing + Poet.
  **Why Second:** Now that you know what is impossible, you map the possible.

  *   **Task 2.1: Multi-Objective Optimization.** Treat translation as a search problem where objectives are (Semantic Fidelity, Formal Adherence, Fluency).
  *   **Task 2.2: Identifying Dominance.** Find the renderings where you cannot improve form without losing meaning, and vice versa. These are your "Pareto-optimal translations."
  *   **Task 2.3: The Poet's Veto.** The CompLing metrics will miss nuance. The Poet must audit the Pareto frontier. Are the "optimal" machine renderings actually poems? If not, your semantic metric is broken.
  *   **Theoretical Payoff:** You demonstrate that "the best translation" is a category error; there is only "the best translation *for this constraint set*." This kills the prescriptive impulse in translation theory.

  #### Phase 3: Phantom Constraints & Reception (Months 13–18)
  **Goal:** Test the "Implicit Prosodic Contract."
  **Lead:** Poet + Philosopher (using Workshop Budget).
  **Why Third:** You need the variants from Phase 2 to test on humans.

  *   **Task 3.1: Blind A/B Testing.** Present readers with pairs: one that adheres to a "Phantom Constraint" (e.g., target-language meter norms) and one that adheres strictly to source-form but violates target norms.
  *   **Task 3.2: Detection Thresholds.** Can readers detect when a "Phantom Constraint" is violated? If they can't, is the constraint theoretically real?
  *   **Theoretical Payoff:** This grounds the "Phantom" notion. If readers don't care, it's not a constraint; it's a stylistic preference. This distinguishes *constitutive* rules from *regulative* habits.

  #### Phase 4: The Sacrifice Ledger & Synthesis (Months 19–24)
  **Goal:** Visualization and Dissemination.
  **Lead:** All three.
  **Why Last:** The Ledger is the report card for the previous three phases.

  *   **Task 4.1: Build the Ledger.** Create an interactive interface where users can slide a bar from "Max Meaning" to "Max Form" and see the translation morph, with the Ledger updating to show what was traded (e.g., "-1 Rhyme, +1 Metaphor").
  *   **Task 4.2: The Workshop.** Use the budget to run sessions where poets try to beat the machine's Pareto frontier.
  *   **Theoretical Payoff:** This is your public-facing contribution. It demonstrates that translation theory can be interactive and computational, not just hermeneutic.

  ### IV. What to Deprioritize (The "Kill List")

  1.  **Do not ask if the Ledger "changes practice."** It won't, not in two years. Professional translators work under deadline and intuition. Treat the Ledger as a *theoretical exposition tool*, not a workflow intervention.
  2.  **Do not attempt "Universal Constraints."** Do not try to prove anything about *all* language pairs. Stick to one or two high-friction pairs (e.g., French-English, or something typologically distant like Japanese-English if you have the expertise). Generalizing too early will drown you in counterexamples.
  3.  **Do not chase "Creativity."** Do not try to measure whether constrained translation is *more* creative. That is a psychological question that requires longitudinal study. Stick to *fidelity* and *feasibility*.

  ### V. Risk Assessment & Pivot Points

  *   **Risk:** Semantic metrics fail. If BERTScore and similar tools cannot capture poetic nuance, your Lattice collapses.
      *   **Pivot:** Switch from "Semantic Fidelity" to "Human Preference Ranking." Use the Poet and a small panel to rank the 1,000 generated variants, then train a reward model on *that*. This makes the Poet part of the metric.
  *   **Risk:** Phantom Constraints are undetectable.
      *   **Pivot:** If readers can't detect them, reframe the finding: "Phantom Constraints are elite knowledge, not universal intuition." This is still a valid sociological finding about the field of poetry.
  *   **Risk:** Incompatibility is binary (possible/impossible) rather than gradient.
      *   **Pivot:** If you find hard walls rather than slopes, focus on the *location* of the walls. Which specific linguistic features cause the collapse? (e.g., "Gendered rhyme in French to English causes collapse at 15% density").

  ### Summary of the Argument

  You should start with **Constraint Incompatibility** because it defines the boundaries of your search space. You cannot map the terrain (Lattice) until you know where the cliffs are. You should end with **Phantom Constraints** because they require the artifacts generated by the first two phases to be tested empirically.

  The **Sacrifice Ledger** is not a research question; it is the paper you write at the end.

  This agenda leverages your specific trio: the Philosopher defines the bounds, the CompLing builds the search engine, and the Poet validates the output. It moves the field from "look at these clever variations" to "here is the topology of translational possibility." That is a theoretical contribution.
