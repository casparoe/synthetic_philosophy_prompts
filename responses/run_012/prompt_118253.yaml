      *   *(b) Phantom Constraints:* Is this new? This sounds like "genre expectations" or "prosodic norms" (e.g., readers expect iambic pentameter even if not marked). *Verdict:* This is the most philosophically rich but empirically hardest. It risks dissolving into "reader response theory." Needs operationalization to be useful.
      *   *(c) Sacrifice Ledger:* Is this new? Translator's notes exist. "Explication de texte" exists. *Verdict:* This is mostly a pedagogical or presentational tool. Unless it changes the *generation* process (e.g., loss functions weighted by the ledger), it's just redescription. Low priority for *theory*, maybe high for *practice/workshop*.
