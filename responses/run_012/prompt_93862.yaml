  - One says whether you *know* something depends on how much is riding on you being wrong. Same person, same evidence, more at stake, and suddenly they dont know anymore. I think this is the "pragmatic encroachment" one.
  - The other says "knows" is more like a word whose bar moves with whoever is doing the talking and what they care about. So me and my manager can both say "she knows" and we might not even be saying the same thing.

  Build me one case where these two actually come apart, in the direction thats hard to construct. Specs:

  1. One paragraph, realistic. An office, a lab, a kitchen, whatever — not trolleys, not brains in vats, not demons.
  2. The person doing the knowing has the *same evidence* throughout. Nothing new is learned. The only thing that changes is what's at stake.
  3. No lotteries, no fake barns, no stopped clocks, no queue at the bank. Those are the ones everyone uses.
