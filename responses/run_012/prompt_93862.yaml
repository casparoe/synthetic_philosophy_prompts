  - For the sentence "she knows it's fine" as said by the assessor, give me the verdict from (a) the real-stakes version, (b) the believed-stakes version, (c) the contextualist one. Which says yes, which says no, and why.
  - Tell me which single feature of the case is doing the work, and what happens if I take it out — if she correctly knows her own stakes, does the whole thing just collapse back into the normal case?
  - And be honest: if the contextualist has a good comeback here (like, my case is just fiddling with which error possibilities are salient, which is their home turf), give me the comeback. Don't hand me the version where my favorite wins.

