  ### The Case

  Alice is a backend engineer deploying a configuration change late on a Friday. She has run the standard automated test suite, which passed, and she has visually inspected the diff, which looks benign. Based on this evidence, she believes she is deploying to the **Staging** environment, where a failure would merely delay testing until Monday (low stakes). In reality, due to a silent routing bug in the deployment tool, she is deploying to **Production**, where a failure would take down the customer-facing site for the weekend (high stakes). Alice is unaware of the bug and genuinely believes the stakes are low. Bob, her CTO, knows about the routing bug and knows Alice is actually touching Production (he sees the real logs), but he is currently on a casual call with an investor who is fully insured against downtime. Bob says to the investor, "Don't worry, Alice knew it was fine to ship."

  ### The Walkthrough

  Here is how the three views evaluate Bob's sentence: **"Alice knew it was fine to ship."**

  *   **(a) The Real-Stakes Version (Standard Pragmatic Encroachment):** **Verdict: False.**
      This view says knowledge depends on the subject's *actual* practical situation. Alice's real stakes are High (Production outage). To "know" in a high-stakes situation, she needs more evidence than just standard tests (e.g., manual verification of the environment). She doesn't have that evidence. Therefore, she doesn't know, and Bob's statement is false.

  *   **(b) The Believed-Stakes Version (Subject-Sensitive Invariantism):** **Verdict: True.**
      This view says knowledge depends on what the subject *takes* to be at stake. Alice believes the stakes are Low (Staging). For low-stakes claims, her standard evidence (tests + diff) is sufficient. Since she meets the threshold for the stakes she *believes* she faces, she knows. Bob's statement is true.

  *   **(c) The Contextualist One:** **Verdict: True.**
      This view says the bar for "knows" moves with the *assessor's* conversational context. Bob is speaking to an insured investor in a casual setting. For Bob, right now, the cost of being wrong about Alice's knowledge is negligible (low stakes). The possibility of error isn't salient to *this conversation*. Therefore, the bar for "knows" is low in Bob's context. Alice meets the low bar. Bob's statement is true.

  ### The Single Feature Doing the Work

  The engine driving this divergence is **Alice's ignorance of her own real stakes**.

  If you take this out—if Alice correctly knows she is deploying to Production—the case collapses. If Alice knows the stakes are High, then her evidence is insufficient for both the Real-Stakes view (a) and the Believed-Stakes view (b). Both would verdict **False**. You would lose the ability to distinguish between "what matters is reality" vs. "what matters is perspective" for the subject. You would be left only with the fight between the Subject (Alice) and the Assessor (Bob), which is the standard Pragmatic Encroachment vs. Contextualism battle. By making Alice wrong about her stakes, we isolate the Subject's internal perspective as a variable distinct from reality.

  ### The Contextualist Comeback

  Be prepared for this pushback: A sophisticated Contextualist will argue that my verdict for (c) is shaky. They will say: "Bob *knows* the stakes are High. That knowledge makes the possibility of error salient to him, regardless of the investor's insurance. If the error possibility is salient to the speaker, the standards rise automatically."

  If they take this line, Contextualism converges with Real-Stakes Pragmatic Encroachment (both say **False**). Their comeback is that you cannot separate what a speaker *knows* from what is *salient* in their context. If Bob knows the risk, he can't truthfully claim Alice "knows" unless she ruled out that risk, because his own knowledge forces the conversational bar up.

  ### Confidence & Shaky Step

  **Confidence Level:** 70%

  **Shakiest Step:** The Contextualist verdict (c). It is philosophically contentious whether an assessor can remain in a "low standards" context while possessing knowledge of high stakes elsewhere. I am assuming a version of Contextualism where the *practical consequences for the speaker* dictate the standards, not just their intellectual awareness of the risk. If your team leans toward the view that "knowing the risk makes the risk matter," the Contextualist verdict flips to **False**, and the case no longer distinguishes (a) from (c).
