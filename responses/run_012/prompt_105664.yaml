answer: |-
  ### I. General Desiderata Derived from the Cases

  To account for the six specific cases you outlined, a theory must deliver more than just an existence proof. It must satisfy these structural requirements:

  1.  **Informational Efficiency (from One-shot/Signal):** The theory must specify the minimum bandwidth of information required to sustain cooperation. If only a single public bit passes between strangers, the theory must demonstrate how that bit aggregates into a reputation metric sufficient to outweigh the temptation to defect.
  2.  **Terminal Robustness (from Finite Iterated):** The theory must resolve or bypass the backward induction problem. It cannot rely on an infinite horizon shadow of the future; it must explain why the last round (or the anticipation of it) does not unravel the cooperative equilibrium immediately.
  3.  **Error Correction (from Noisy World):** The mechanism must be stable against implementation errors. Strategies that are Nash equilibria in perfect worlds (e.g., Grim Trigger) but collapse under noise are inadequate. The theory must quantify the tolerance threshold for signal noise.
  4.  **Sorting Dynamics (from Partner Choice):** The theory must model interaction entry/exit as a strategic variable, not a fixed background condition. It must show how the *threat* of leaving sustains cooperation within the interaction, distinguishing this from reciprocity *within* a fixed interaction.
  5.  **Topological Sensitivity (from Structured Populations):** The theory must explicitly incorporate network structure. It cannot assume a well-mixed population. It must specify the critical clustering coefficient or degree distribution required for cooperation to invade.
  6.  **Epistemic Modesty (from Asymmetric/Unknown Payoffs):** The theory cannot assume agents know the payoff matrix ($T, R, P, S$) of their opponents, or even their own, with precision. It must function with estimated or learned payoffs, acknowledging that misperception is part of the evolutionary environment.

  ---

  ### II. Evaluation of Your Five Requirements

  Here is the assessment of your specific constraints, defining what satisfaction looks like and judging their negotiability.

  **1. Perturbation Accountability**
  *   **Satisfaction Condition:** The theory provides a stability gradient, not just a binary stable/unstable verdict. It must output a function relating the magnitude of payoff perturbation (e.g., $\Delta T$) to the rate of cooperative decay or the probability of invasion by defectors.
  *   **Verdict:** **Non-negotiable.** Without this, the theory is a mathematical curiosity rather than a predictive model. Biological and social parameters fluctuate; a theory that breaks under infinitesimal variance has no explanatory power for real systems.

  **2. Portability**
  *   **Satisfaction Condition:** A single causal mechanism (e.g., "indirect reciprocity" or "network clustering") explains cooperation in Game A and Game B without changing the mechanism's internal logic or parameter values, even if the game structures differ slightly.
  *   **Verdict:** **Negotiable (and likely impossible).** This is the most demanding requirement. Cooperation is likely a mosaic of context-specific mechanisms. Direct reciprocity works in iterated games but not one-shot; kin selection works in structured populations but not among strangers. Demanding a *single* mechanism port without re-tuning across these distinct strategic landscapes asks for a Unified Field Theory of social behavior that may not exist.

  **3. No Unbounded Resources**
  *   **Satisfaction Condition:** All variables ($N$, generations, memory depth, computation steps) are finite integers. No limits ($\lim_{N \to \infty}$) are used to prove convergence unless the rate of convergence is specified for finite $N$.
  *   **Verdict:** **Non-negotiable.** Infinite populations and time horizons are mathematical conveniences that often hide fragility (e.g., rare mutations that take infinite time to appear). A realistic evolutionary theory must operate within biological constraints.

  **4. Accounting Neutrality**
  *   **Satisfaction Condition:** Every increase in cooperative frequency is traced to a fitness advantage at a specified unit of selection (gene, individual, group). If group-level terms are used, the mechanism of group replication/selection is explicitly defined, not implied by averaging individual payoffs.
  *   **Verdict:** **Non-negotiable.** Equivocation between individual and group selection is the primary source of confusion in this field. A theory must commit to a unit of replication to be testable.

  **5. One-shot Non-negotiable**
  *   **Satisfaction Condition:** The theory either models a mechanism allowing cooperation in anonymous one-shot interactions (e.g., via the public signal) or formally proves such cooperation is impossible under the stated constraints, thereby excluding the phenomenon from its scope.
  *   **Verdict:** **Non-negotiable.** Empirical data shows humans cooperate in one-shot anonymous settings. A theory that predicts zero cooperation here is falsified unless it explicitly defines its scope as "non-human" or "purely economic."

  ---

  ### III. Necessary Distinctions

  To avoid conceptual slippage, the theory must rigorously separate the following:

  1.  **Cooperation as Behavior vs. Cooperation as Disposition:**
      *   *Distinction:* An agent may defect (behavior) due to noise while possessing a cooperative strategy (disposition), or cooperate (behavior) by accident while intending to defect.
      *   *Requirement:* The theory must track the frequency of *strategies* (genotypes/rules), not just *actions* (phenotypes), especially in the "Noisy World" case.

  2.  **Equilibrium vs. Stability:**
      *   *Distinction:* A state can be a Nash Equilibrium (no one wants to deviate) but not Evolutionarily Stable (a small cluster of mutants can invade).
      *   *Requirement:* The theory must specify if it is solving for static equilibrium conditions or dynamic stability against invasion (ESS/AS).

  3.  **Origin vs. Maintenance:**
      *   *Distinction:* The conditions required for cooperation to *invade* a population of defectors are often stricter than the conditions required for cooperation to *resist* invasion once common.
      *   *Requirement:* The theory must distinguish the basin of attraction (origin) from the depth of the potential well (maintenance).

  4.  **Short-Run Dynamics vs. Long-Run Stationarity:**
      *   *Distinction:* A system may spend millennia in a cooperative metastable state before inevitably collapsing to defection (long-run absorbing state).
      *   *Requirement:* The theory must state its time horizon. Predicting the "eventual" outcome is useless if the "transient" outcome lasts longer than the lifespan of the universe.

  ---

  ### IV. Conflicting Desiderata

  There are two pairs of requirements that create significant tension, potentially rendering them jointly unsatisfiable.

  **1. Portability vs. Perturbation Accountability**
  *   **The Conflict:** To be **Portable**, a mechanism must be abstract enough to apply across different game structures without re-tuning. To be **Perturbation Accountable**, a mechanism must be sensitive to the specific payoff landscape of the current game to quantify stability margins.
  *   **Why they clash:** High portability requires parameter invariance. High perturbation accountability requires parameter specificity. A mechanism tuned to be robust across multiple game types (Portable) will likely be sub-optimal in any specific one, making its stability margins thin (failing Perturbation Accountability). Conversely, a mechanism precisely calibrated to the stability margin of one game will likely fail when moved to a strategically similar but distinct game (failing Portability).

  **2. One-shot Non-negotiable vs. No Unbounded Resources**
  *   **The Conflict:** Explaining cooperation in **One-shot** interactions among strangers typically relies on Indirect Reciprocity (reputation). Robust reputation systems in a **Noisy World** usually require significant memory capacity or long chains of observation to distinguish signal from noise.
  *   **Why they clash:** If you enforce **No Unbounded Resources** (specifically bounded memory and finite observation chains) in a noisy environment, the informational content of a "single bit of public signal" degrades rapidly. It becomes mathematically difficult to sustain a reputation metric robust enough to outweigh the temptation to defect in a one-shot game. Satisfying the One-shot requirement often forces models to assume infinite populations or perfect monitoring (violating No Unbounded Resources).

  ---

  ### V. The Single Most Exclusionary Requirement

  **Portability.**

  This requirement does the most work to exclude candidate theories. Most successful models of cooperation are niche-specific: Kin Selection explains structured populations; Direct Reciprocity explains iterated games; Indirect Reciprocity explains one-shot interactions with signals.

  Demanding that the *same* explanatory mechanism carry over "without re-tuning" from iterated to one-shot games, or from structured to well-mixed populations, effectively demands a Unified Field Theory of social evolution. Current literature suggests cooperation is not a single phenomenon with a single cause, but a convergent outcome of multiple distinct mechanisms. Insisting on Portability forces you to reject the mosaic nature of evolutionary biology in favor of a universal law that likely does not exist. It will eliminate almost every existing model in the literature, as they are all tuned to specific strategic contexts.
