      *   **Constraint:** Avoid formulations that quietly favor one side. Avoid truisms.

  2.  **Deconstruct the Two Camps:**
      *   **Camp A (Semantics/Informationalists):** DNA is a genuine code. Mapping is arbitrary. tRNA/ribosome = decoder. Sequence *means* protein.
      *   **Camp B (Causal/Deflationists):** "Code" is metaphor/shorthand. No genuine representation. Just chemical causality. Informational vocabulary imports unjustified commitments.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Find common ground that isn't trivial.
