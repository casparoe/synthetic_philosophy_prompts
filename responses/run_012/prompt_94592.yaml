      *   *Vocabulary:* Avoid "obviously," "clearly." Use "Position A maintains," "Position B maintains."
      *   *Formatting:* Numbered lists, clear sections, table for cruxes.
      *   *Self-Correction on "Verbal Dispute":* I need to explicitly address if any part is merely verbal. The definition of "rationality" is the big one. I should note that in the introduction or disagreements. I will add a note in the Disagreements section that the core divergence rests on the definition of "rationality."

  7.  **Final Polish of the Text:**
      *   Ensure the "Joint Statement" header is clear.
      *   Make sure the Crux predictions are distinct.
      *   Ensure the "Shared Test" is something they agree *would* be relevant, even if they disagree on the outcome.

      *(Self-Correction during drafting Crux 1)*: Wait, if a sophisticated agent refuses the trade, the money pump *doesn't happen*. Position A argues the *potential* for the pump reveals the irrationality of the underlying preferences, not just the actual loss. Position B argues that without the actual loss (or the compulsion to accept), there is no normative bite. I need to phrase the test carefully. The test is whether the *disposition* itself is the target of evaluation.

      *(Self-Correction on Crux 3)*: Is it Prudential vs Epistemic? Or is it "Instrumental Rationality" vs "Broad Rationality"? Let's stick to the prompt's framing: Prudential (resource loss) vs Epistemic/Normative (correctness of preference).

      *(Final check on constraints)*: "No claim so hedged that both sides sign it for opposite reasons." I must avoid saying "Both agree rationality is important." Instead, "Both agree the term 'rationality' is the locus of the dispute."

      Let's assemble the document.

      *Structure:*
      1. Preamble (Who we are, what this is).
      2. Agreed Claims (Math, Mechanics, Scope).
      3. Points of Disagreement (Normative Force, Completeness, Source of Normativity).
      4. Cruxes Table (Crux, Test, Pred A, Pred B).
