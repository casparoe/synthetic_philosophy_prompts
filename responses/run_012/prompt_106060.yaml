answer: |-
  **Project Title:** The Anatomy of Comparison: Disaggregating the Ranking of Historical Evils

  **Project Summary**
  Public and scholarly discourse regarding historical atrocities frequently stalls on the question of ranking. Is it permissible to say the Holocaust was "worse" than the Gulag, or slavery "worse" than colonial extraction? Commensurabilists argue that ranking is necessary for moral learning and resource allocation; incommensurabilists argue that such ranking is a category error that desecrates the victims. This project proposes that this stalemate persists because both sides treat "comparison" as a monolithic act. I hypothesize that comparison comprises four distinct operations: (a) Ordering (ordinal ranking), (b) Scaling (cardinal measurement), (c) Adjudicating (resource/attention allocation based on rank), and (d) Expressive Self-Implication (the moral character of the ranker).

  This six-month, part-time research project will develop a conceptual taxonomy to separate these operations. The primary objective is to determine whether (a) can be defended independently of (b). If ordering does not logically require scaling, the incommensurabilist's objection to measurement need not invalidate ordinal judgment. The output will be a paper suitable for publication in ethics or political philosophy, offering a defensible assignment of moral permissibility to each operation.

  **The Research Question and Existing Debate**
  The central question is determinate: *Is the ordinal ranking of historical evils morally permissible independent of cardinal scaling?*

  Current literature oscillates because the opposing camps address different operations while assuming they are addressing the same one. Commensurabilists defend (a) and (c) by appealing to the necessity of moral prioritization, but they often tacitly accept (b), inviting the charge that they are reducing suffering to a calculus. Incommensurabilists attack (b) and (d), arguing that atrocities possess unique qualitative properties that resist common units and that the act of ranking itself expresses a harmful detachment. Because the commensurabilist is defending ordering while the incommensurabilist is attacking scaling, neither lands a decisive blow.

  By disaggregating these acts, this project seeks to show that the "obscenity charge" legitimately targets (b) and (d), but fails to touch (a). The stakes then shift to (c): even if we can order evils without scaling them, does that order license adjudication? This project argues that the debate should not be about *whether* we can rank, but *what work* the rank is permitted to do.

  **Methodology and Work Plan**
  This is a conceptual-taxonomy project, not an empirical or formal one. A decision-theoretic formalization is inappropriate because the dispute is not about how agents *do* choose, but whether the conceptual structure of the choice is morally licit. Similarly, historical empiricism cannot settle the matter; no additional data about the magnitude of past suffering resolves the logical question of whether those magnitudes can be compared. The instrument must be philosophical analysis of the concepts themselves.

  The six-month timeline is scoped for part-time research (approx. 15 hours/week). The schedule prioritizes the "load-bearing" argument: the logical relationship between ordering and scaling.

  *   **Month 1: Taxonomy Refinement.**
      I will finalize the definitions of the four operations (Ordering, Scaling, Adjudicating, Expressive). The goal is to ensure they are mutually exclusive descriptions. I will map existing arguments from the literature onto this grid to demonstrate the current category errors.
  *   **Months 2–3: The Load-Bearing Step.**
      This is the highest-risk phase. I will analyze whether (a) logically entails (b). Can one assert "A is worse than B" without implying "A contains $x$ units of badness and B contains $y$"? I will test this against philosophical accounts of ordinal utility and qualitative distinction. If (a) secretly requires (b), the taxonomy collapses, and the project must pivot to damage control. If (a) stands alone, I will construct the argument for "Ordinality without Metric."
  *   **Month 4: Case Application.**
      I will apply the taxonomy to one specific discursive conflict (e.g., the debate over memorial funding or comparative genocide studies). The goal is to produce at least one case where separating (a) from (b) changes the moral verdict from "obscene" to "permissible."
  *   **Month 5: Steelmanning the Opposition.**
      I will address the strongest counter-argument: that the "obscenity charge" is not merely a refusal of scaling (b) but a substantive moral claim about the act of ranking itself. This view holds that the position of the ranker inherently objectifies the victim, regardless of whether a metric is used. To defeat this, I must show that this objection actually targets (d) (the expressive act), not (a) (the logical order), and that (a) can be performed without the expressive vice of (d).
  *   **Month 6: Drafting and Revision.**
      Assembly of the final paper. The scope is a journal article (8,000–10,000 words), focusing on the taxonomy plus the argument for the independence of ordering.

  **Expected Outcomes and Failure Conditions**
  **Success:** A paper that successfully decouples ordering from scaling. The result will be a matrix assigning moral status to the four operations (e.g., Ordering: Permissible; Scaling: Obscene; Adjudicating: Conditional; Expressive: Context-dependent). It will demonstrate that one can acknowledge a hierarchy of evils without committing to a common unit of measurement or expressing moral detachment.

  **Failure:** The project fails if the analysis in Months 2–3 demonstrates that ordinal ranking is conceptually impossible without cardinal scaling. If (a) turns out to be merely a linguistic disguise for (b), the four operations collapse back into one. In this event, the deliverable will be a negative result: a proof that the incommensurabilist is correct because the conceptual distinction I propose is idle.

  **Significance**
  This project offers a way through a moral deadlock that currently paralyzes both memorialization and policy. By showing that the "desecration" lies in the *scaling* or the *posture* of the ranker rather than the *order* itself, we can preserve the ability to learn from history without reducing suffering to arithmetic. It shifts the burden from proving atrocities are commensurable to proving that our prioritization mechanisms do not rely on commensurability.
