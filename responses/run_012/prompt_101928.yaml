      *   **Subject's Stance:** Proponent of group selection (unfashionable side), argued against strict gene's-eye view/bookkeeping.
      *   **Key Constraint 1 (Tone):** Sincere, not pretending she "won" the debate, no empty "pioneer/ahead of her time" filler.
      *   **Key Constraint 2 (Scientific Content):** Must center on her specific conceptual distinction: *which entities are being selected* vs. *which entities the selected traits are for*. A trait can be *for* the group without the group being the *unit of selection*. This distinction allowed her to keep arguing despite disagreement.
      *   **Key Constraint 3 (Accessibility):** Must not lose the grandchildren (tomato growers) while satisfying the experts (kin selection/Price equation crowd).
      *   **Key Constraint 4 (Definite Line):** I must pick a specific interpretation of the debate and her contribution, not remain neutral.
      *   **Key Constraint 5 (Meta-Commentary):** Close with a candid note on where the speech takes liberties (science or interpretation).
      *   **Length:** ~5 minutes spoken (approx. 750-900 words).

  2.  **Deconstruct the Scientific Core:**
      *   *The Debate:* Gene selectionism (Williams, Dawkins) vs. Group Selection (Wynne-Edwards, later multilevel selection).
      *   *Her Nuance:* The distinction between the *replicator/vehicle* (what gets selected) and the *beneficiary* (what the trait is *for*). This sounds like a variation on the "vehicle" vs. "replicator" distinction or perhaps a specific philosophical take on teleology in biology (e.g., Sober & Wilson, or perhaps a specific interpretation of function).
      *   *The "Definite Line":* I need to commit to an interpretation. The prompt suggests she argued traits can be *for* the group even if selection acts on individuals. This aligns with a functionalist or "effect function" view, or perhaps a specific take on multilevel selection theory (MLST) where the *outcome* matters as much as the *mechanism*.
      *   *Decision:* I will frame her contribution not as proving group selection is the *dominant* force (which is contested), but as proving that *functional explanation* in biology requires looking at the group level, regardless of the underlying mechanical driver. She saved the *phenomenon* of cooperation from being explained away as mere selfishness. I will commit to the view that she was right about the *explanatory necessity* of the group level, even if the mechanistic purists won on the *causal* level. This honors her without claiming she disproved kin selection.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion, the mix of people (scientists and family), and the tomato connection. Ground it immediately.
