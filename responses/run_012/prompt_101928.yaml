      *   **The "Definite Line":* Assert that her legacy is expanding the vocabulary of biology to allow for "for the group" talk, even if the math says "individual." She made it safe to talk about cooperation as real, not just disguised selfishness.
      *   **The Family Connection:** Connect the science to her life. Growing tomatoes is a group effort (ecosystem) or simply nurturing. Let's go with nurturing/community.
      *   **Closing:** A toast to her.
      *   **Meta-Note:** The required candid note on liberties taken.

  4.  **Refining the Science/Analogy:**
      *   *Challenge:* How to explain "selected vs. for" to grandchildren?
      *   *Analogy:* A choir. The judge picks the best singer (individual selection), but the song is for the audience (group benefit). Or a sports team.
      *   *Better Analogy:* The Tomato Garden. The gardener selects the seeds (selection), but the fruit is for the family (benefit).
      *   *Wait, let's look closer at the prompt's specific distinction:* "A trait can be for the good of a group without the group being the thing that selection is acting on."
      *   *Interpretation:* This sounds like she separated *causal selection* from *teleological function*.
