answer: |-
  Good evening. For those of you I haven't met yet, I'm one of the last postdocs to work in [Advisor's Name]'s lab before she hangs up her trowel.

  We have a unique room tonight. Half of you know her for the tomatoes. The other half know her for the Price equation. And if I'm not careful, I'm going to say something that makes the tomato growers bored and the biologists wince. So, I'll try to walk the line she spent forty-one years walking.

  To the family: [Advisor's Name] spent her career asking why living things help each other. Why does a bird alarm-call, warning others of a hawk, when it draws attention to itself? The standard answer—the one that dominated when she started—was that it only looks like help. Really, it's selfishness in disguise. Helping your kin helps your genes. It's bookkeeping.

  To the colleagues: She didn't deny the math. She denied that the math was the whole story.

  There is a distinction she insisted on, from her first grant to her last paper. It's the hinge of her career. She argued that we confuse two questions: *Who is being selected?* and *Who is the trait for?*

  Imagine her garden. When she saves seeds from the biggest tomatoes, the *selection* is acting on the individual plant. But the *fruit* is for the family. The mechanism is individual; the purpose is communal.

  For decades, the field insisted that if the mechanism is individual, the purpose must be too. She stood up and said: No. A trait can be built by individual selection and still be *for* the group. The architecture might be built of selfish bricks, but the house is for living together.

  I want to take a definite line on what this means for her legacy, because she wouldn't want vague praise. She didn't prove that group selection is the dominant engine of evolution. The gene's-eye view still holds the keys to the engine room. But she proved that the engine doesn't tell you where the car is going.

  Her contribution was to reclaim the *language* of function. She showed that if you want to explain cooperation, you cannot stop at the gene. You have to look at the group to understand what the trait *does*, even if the gene explains how it *persisted*. She made it scientifically safe to say "this is for the good of the herd" without being laughed out of the seminar. She didn't overthrow the establishment; she forced them to expand their vocabulary. She taught us that biology needs both the microscope and the landscape.

  To the grandchildren: Your grandmother taught us that being part of a group changes what you are. It's not just about winning. It's about what you build together that you couldn't build alone. Whether it's a colony of ants or a family dinner, the whole becomes a thing that needs explaining.

  And to the colleagues: We can disagree on the coefficients of the Price equation. We can argue about the levels of causality. But we cannot go back to pretending that the group is just a fiction. She made the group real, not necessarily as a replicator, but as a beneficiary. And in doing so, she made evolutionary biology more humane.

  She spent forty-one years arguing that we are not just vessels for genes, but members of groups. That the "for" in biology is as important as the "by."

  So, please raise a glass. To [Advisor's Name]. For the seeds she planted, the arguments she sustained, and for showing us that while selection may act on the individual, the best of what we are is for each other.

  ***

  **Note on Liberties Taken:**

  In preparing this toast, I have committed to a specific philosophical interpretation of your advisor's work that smooths over some contentious technical ground. Specifically, I have treated the distinction between "entities being selected" and "entities traits are for" as a settled separation between *causal mechanism* and *teleological function*.

  While this captures the spirit of her argument, hardline adaptationists might argue that in evolutionary biology, "what a trait is for" is strictly defined by "what selected it." By asserting that a trait can be *for* the group even if selected at the individual level, I am endorsing a pluralistic view of function (similar to a "causal role" function) rather than a strict "etiological" function. This is a defensible philosophical position, but it is not a consensus biological fact. I have also simplified the "tomato" analogy to serve the dual audience; in strict biological terms, the fruit is for seed dispersal, not the family, but the metaphor serves the social purpose of the evening. Reading this aloud commits you to the view that her victory was primarily conceptual and linguistic, rather than mechanistic.
