      *   *Commitment:* I will argue that she successfully decoupled *function* from *mechanism*. This is a defensible philosophical position (similar to etiological functions vs. causal roles).

  5.  **Drafting the Content (Iterative Process):**
      *   *Tone Check:* Needs to be warm but intellectually honest. No "she was right and everyone else was wrong."
