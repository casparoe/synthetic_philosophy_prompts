      *   **Core View:** The "Lifetime-Receipts View" (LRV). The objection to dynastic wealth isn't the transfer at death, but the conversion of *any* parental resource (cash, housing, schooling, time, networks) into positional advantage. The solution is a tax on cumulative lifetime receipts of these transfers, assessed upon arrival.
