  Then tell me which sub-question your number is most sensitive to, and what argument or empirical finding would move it most. Also — does your number change between the printer case and the swamp case? If it does, that tells me a lot about which theory you're actually running underneath.

  Please write in American English, and please don't just tell me "it depends on your theory of content" — I know, that's the whole point, I want the actual arithmetic.
