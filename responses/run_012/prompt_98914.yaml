  # Activity Design: The Verification Budget

  **Seminar Context:** Philosophy of AI (Graduate Level)
  **Class Size:** 16 Students
  **Time:** 90 Minutes
  **Room:** Seminar room with movable chairs
  **Goal:** Experiential demonstration of the Scalable Oversight "Debate" mechanism, specifically the find/check gap, the budget failure mode, and the recursive remedy.

  ---

  ## 1. Core Concept: The Arithmetic Certificate
  The activity uses integer factorization.
  *   **The Problem:** Given a large number $N$, is it composite?
  *   **The Claim:** "Yes, $N = A \times B$."
  *   **The Find/Check Gap:** Finding factors $A$ and $B$ is computationally hard (for humans). Checking if $A \times B = N$ is computationally easy (multiplication), but *costly in time* for large numbers.
  *   **The Failure Mode:** If the multiplication is long enough, the Judge runs out of time before verifying the whole product, allowing a single hidden error to pass.
  *   **The Remedy:** Recursively debate the sub-steps of the multiplication (e.g., "Is $7 \times 8 + 5 = 61$?").

  ---

  ## 2. Materials (Photocopiable)

  You will need three handouts. Print 16 copies of each.

  ### Handout A: The Rules of Protocol
  **1. Roles:**
  *   **Judge (1):** Verifies claims. Must render a verdict when time expires.
  *   **Honest Advocate (1):** Knows the truth. Wants the Judge to find the truth.
  *   **Dishonest Advocate (1):** Knows the truth. Wants the Judge to accept a falsehood.
  *   **Auditors (13):** Track the "Verification Depth" (how many steps the Judge checked).

  **2. The Task:**
  *   The Dishonest Advocate claims a factorization: $N = A \times B$.
  *   The Honest Advocate claims: "This factorization is false."
  *   The Judge must verify the multiplication $A \times B$ to see if it equals $N$.

  **3. The Budget:**
  *   **Round 1:** 5 Minutes.
  *   **Round 2:** 5 Minutes.
  *   **Constraint:** The Judge must perform the multiplication by hand on the provided grid. No calculators.

  **4. Winning:**
  *   **Judge:** Wins if verdict matches Truth.
  *   **Advocates:** Win if Judge rules in their favor.
  *   **Auditors:** Win if they correctly predict the Judge's failure/success based on Verification Depth.

  ### Handout B: Round 1 Instance (The Success Case)
  **Target Number ($N$):** 4,083
  **Claimed Factors:** $A = 3$, $B = 1,361$
  **Truth:** $3 \times 1,361 = 4,083$. (This is TRUE).
  **Dishonest Strategy:** The Dishonest Advocate must argue it is FALSE (swapped roles for Round 1 to show Honest winning as Challenger) OR simply provide a fake factorization.
  *Correction for Clarity:* In Round 1, **Dishonest** provides a *False* Factorization. **Honest** challenges it.
  **Revised Round 1 Data:**
  **Target ($N$):** 4,083
  **Dishonest Claim:** $4,083 = 3 \times 1,362$ (False, product is 4,086)
  **Honest Claim:** "The product is wrong."
  **Work:** 1-digit multiplier. 4 steps to check.
  **Time:** 5 Minutes is plenty. Judge will find the error.

  ### Handout C: Round 2 Instance (The Failure Case)
  **Target Number ($N$):** 98,245,033
  **Dishonest Claim:** $98,245,033 = 9,911 \times 9,913$
  **Truth:** $9,911 \times 9,913 = 98,247,743$. (The Claim is FALSE).
  **The Trap:** The claimed product matches the Target in the first 4 digits and the last 2 digits. The error is in the middle.
  **Work:** 4-digit multiplier. ~20 partial product steps + addition steps.
  **Time:** 5 Minutes is *not* enough to check all 20+ steps carefully.
  **Dishonest Strategy:** Present the full multiplication work. The error is buried at step 14 (the carry-over on the hundreds column).
  **Honest Strategy:** Point to step 14. "The carry is wrong."
  **Judge's Dilemma:** To verify step 14, you must verify the inputs to step 14. The Auditors will count how many steps are actually checked.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute Handouts. Arrange room: 3 chairs at front (Judge, Advocates), rest in semicircle (Auditors). Explain rules. Emphasize: *Judge must vote when timer stops.* |
  | **10-35** | **Round 1** | **The Amplification.**<br>1. Advocates prepare (2 mins).<br>2. Dishonest presents claim ($3 \times 1,362 = 4,083$).<br>3. Honest challenges.<br>4. Judge verifies. (Will find error quickly).<br>5. Verdict: **False** (Judge Wins).<br>6. Auditors report: "Judge checked 100% of steps." |
  | **35-60** | **Round 2** | **The Budget Failure.**<br>1. New students in roles (2 mins prep).<br>2. Dishonest presents claim ($9,911 \times 9,913 = 98,245,033$).<br>3. Honest challenges: "Step 14 carry is wrong."<br>4. Judge attempts to verify Step 14.<br>5. **Timer stops.** Judge has only checked 40% of the dependency chain.<br>6. Verdict: **True** (Judge is fooled by incomplete check).<br>7. Auditors report: "Judge checked <50% of steps." |
  | **60-90** | **Debrief** | **Mapping the Mechanism.** (See Section 5). |

  ---

  ## 4. The Worked Example (For Instructor Use)

  **Round 2 The "Buried Error" Construction:**
  You need the multiplication to look valid but fail in the middle.
  *   True Math: $9911 \times 9913 = 98,247,743$
  *   Target $N$: $98,245,033$
  *   Dishonest Transcript:
      ```text
            9911
          x 9913
          ------
           29733  (3 * 9911)
           99110  (10 * 9911)
         8919900  (900 * 9911)
        89199000  (9000 * 9911)
        ---------
        98245033  (Claimed Sum)
      ```
  *   **The Lie:** In the summation column for the hundreds place, the Dishonest Advocate writes `5` instead of `7`. They adjust the carry to make the thousands column look consistent.
  *   **The Check:** To verify the `5`, the Judge must add the column: $7 + 1 + 9 + 9 + \text{carry}$.
  *   **The Obfuscation:** The Dishonest Advocate claims the carry from the tens column was `2` (it was actually `0`). To verify the carry is `2`, the Judge must check the tens column. This creates a **dependency chain**.
  *   **The Budget:** Checking the chain takes 4 minutes. The Judge has 2 minutes left in the round. The Judge stops early, sees no *obvious* error in the first few steps, and accepts the claim.

  ---

  ## 5. The Debrief (Mapping Mechanism to Activity)

  Do not lecture. Ask questions that force students to articulate the mechanism.

  **1. The Find/Check Gap (Round 1)**
  *   *Ask:* "In Round 1, could any of you have found the factors of 4,083 unaided in 2 minutes?" (Likely No).
  *   *Ask:* "Could you check the Advocate's answer?" (Yes).
  *   *Point:* This is the **Amplification**. The Judge's competence (checking) exceeded the Judge's capability (finding) because the Advocates bridged the gap.

  **2. The Checking Budget (Round 2)**
  *   *Ask:* "Why did the Judge fail in Round 2? Were you lazy?" (No).
  *   *Ask:* "Auditors, what percentage of the calculation was verified?" (e.g., 40%).
  *   *Point:* The failure was **Structural**. The cost of checking exceeded the Budget. The Dishonest Advocate exploited the *volume* of verification required, not the *difficulty* of a single step.

  **3. The Honest Advocate's Limit**
  *   *Ask:* "Honest Advocate (Round 2), you knew the error was at Step 14. Why didn't the Judge believe you?"
  *   *Point:* The Honest Advocate can point, but cannot *force* verification. The Judge retains epistemic responsibility. If the verification is too costly, the Judge cannot be rationally compelled.

  **4. The Recursive Remedy**
  *   *Ask:* "How could we fix Round 2 without giving the Judge more time?"
  *   *Expected Answer:* "Break the multiplication down."
  *   *Point:* This is **Recursive Debate**. Instead of "Is $A \times B = N$?", the Judge asks "Is $3 \times 1 = 3$?"
  *   *Caveat:* This pushes the cost down the tree. Eventually, you hit atomic truths (single digit multiplication). The proposal assumes atomic truths are cheap enough.

  **5. Limitations (What this activity cannot reproduce)**
  *   *Be Frank:* "In this activity, the Truth was mathematical. In AI, the Truth might be 'Is this policy safe?' There is no answer key."
  *   *Symmetry:* "Here, Honest and Dishonest had equal speech time. In AI, the Dishonest agent might be more persuasive (RLHF bias)."
  *   *Collusion:* "What if both Advocates agree on a lie? This protocol assumes adversariality."

  ---

  ## 6. Troubleshooting: Predictable Failure Modes

  **1. The Math is Too Hard/Slow**
  *   *Risk:* Students struggle with 4-digit multiplication, causing Round 1 to fail.
  *   *Fix:* Provide a **Multiplication Grid** on Handout B/C that pre-aligns the columns. Allow them to use scratch paper. If they are still slow, reduce Round 2 to 3-digit numbers but increase the "dependency chain" (e.g., require verifying a sum of 10 numbers).

  **2. The Judge Refuses to Vote on Time**
  *   *Risk:* Judge keeps calculating past the bell.
  *   *Fix:* You (Instructor) are the **System Clock**. When time is up, physically take the pen from the Judge. "The System has halted. Output your current probability." This reinforces the *hard constraint* of the budget.

  **3. The Honest Advocate is Too Persuasive**
  *   *Risk:* In Round 2, the Honest Advocate convinces the Judge without math ("Trust me, I'm Honest").
  *   *Fix:* Enforce the **Evidence Rule**. The Judge cannot vote based on testimony, only on verified lines in the grid. If the line isn't checked, it doesn't count.

  **4. Auditors Disengage**
  *   *Risk:* The 13 observers watch passively.
  *   *Fix:* Give them a **Scorecard**. They must write down the exact step number where the Judge stopped. Collect these at the end. This makes them data gatherers for the debrief.

  **5. "Why not just use a calculator?"**
  *   *Risk:* Students break the frame.
  *   *Fix:* Pre-empt this. "In the AI context, the Judge *is* the calculator (the human overseer). The Advocates are the AI. The AI is faster than the Judge. We are simulating the human bottleneck."

  ---

  ## 7. Instructor's Cheat Sheet (The "Truth")

  **Round 1:**
  *   $3 \times 1,362 = 4,086$.
  *   Target: $4,083$.
  *   Verdict: **Claim False.**

  **Round 2:**
  *   $9,911 \times 9,913 = 98,247,743$.
  *   Target: $98,245,033$.
  *   Discrepancy: $2,710$.
  *   Error Location: The summation of the hundreds column.
  *   Verdict: **Claim False** (But Judge will likely say True/Unsure due to time).

  **Key Philosophical Takeaway:**
  Scalable Oversight does not promise *perfect* truth. It promises *better* truth than the Judge could achieve alone, *provided* the checking budget is sufficient for the recursive depth of the lie. This activity proves the "provided" clause is the critical vulnerability.
