  # Decision Tree: Harsanyi's Aggregation and Its Discontents

  **Instructions:** Start at Node 1. Answer each question based on your considered moral intuitions and theoretical commitments. Follow the arrows to the next node or to a final position (Leaf).

  **Node 1: The Currency of Justice**
  Does the social evaluation of states of affairs depend *exhaustively* on aggregating representations of individual well-being (utilities), rather than resources, capabilities, rights, or procedural histories?
  *   **No** $\rightarrow$ **Leaf A: Non-welfarist Position** (Refuses aggregation of utilities).
  *   **Yes** $\rightarrow$ Go to Node 2.

  **Node 2: Social Rationality (VNM)**
  Consider society as a single agent choosing between lotteries. Must the social ordering satisfy the **Independence Axiom**? (i.e., If Society prefers Lottery X to Y, it must prefer a mixture of X with Z to the same mixture of Y with Z, regardless of Z).
  *   **No** $\rightarrow$ Go to Node 3.
  *   **Yes** $\rightarrow$ Go to Node 5.

  **Node 3: The Worst-Off Priority**
  If you rejected Independence, is it because you believe social choice should maximize the utility of the worst-off individual regardless of the sum (Leximin/Maximin)?
  *   **Yes** $\rightarrow$ **Leaf B: Rawlsian Maximin**.
  *   **No** $\rightarrow$ Go to Node 4.

  **Node 4: Ex Post Priority**
  If you rejected Independence but are not a Rawlsian, is it because you want to apply a concave transformation to utilities *after* states are realized to prioritize the worse off in each outcome?
  *   **Yes** $\rightarrow$ **Leaf C: Ex Post Prioritarianism**. *(Note: This position explicitly violates assumption (b) of Harsanyi's theorem.)*
  *   **No** $\rightarrow$ *Diagnosis: This combination is theoretically empty. Rejecting VNM without Maximin or Ex Post Priority lacks a formal decision rule.*

  **Node 5: The Pareto Condition**
  Accepting Social VNM, do you accept that if every individual is indifferent between two lotteries, society must also be indifferent? (Pareto Indifference).
  *   **No** $\rightarrow$ *Diagnosis: This leads to paternalism or perfectionism outside the Harsanyi framework.* (Return to Node 5 and answer **Yes** to proceed within the theorem's scope).
  *   **Yes** $\rightarrow$ Go to Node 6.

  **Node 6: Moral Weights**
  Harsanyi's theorem yields a social welfare function $W = \sum a_i U_i$. Do moral persons command equal weight ($a_i = a_j$)?
  *   **No** $\rightarrow$ **Leaf D: Weighted Utilitarianism** (Weights encode desert, need, or responsibility).
  *   **Yes** $\rightarrow$ Go to Node 7.

  **Node 7: The Impartial Observer**
  Does the "Veil of Ignorance" (an equal probability of being any person) provide a legitimate justification for setting all weights to equal, or is this question-begging?
  *   **Question-begging** $\rightarrow$ **Leaf E: Deflationary Position** (Theorem is math, not ethics; equal weights require external justification).
  *   **Legitimate** $\rightarrow$ Go to Node 8.

  **Node 8: The Concrete Case**
  **Case:** Two patients need a drug to live. One dose exists. Patients are identical in need and prognosis.
  *Option A:* Give to Patient 1 (Certain).
  *Option B:* Flip a fair coin (50% chance for each).
  Expected lives saved is 1.0 in both. Do you strictly prefer Option B (the coin)?
  *   **No (Indifferent)** $\rightarrow$ Go to Node 9.
  *   **Yes (Prefer Coin)** $\rightarrow$ Go to Node 10.

  **Node 9: Social Risk Attitude**
  If indifferent to the coin, do you nonetheless apply a concave transformation to *expected* individual utilities to prioritize those with lower life prospects generally?
  *   **Yes** $\rightarrow$ **Leaf F: Ex Ante Prioritarianism**.
  *   **No** $\rightarrow$ **Leaf G: Classical Sum Utilitarianism**.
      *(Note: Leaves F and G converge here on the Coin Case but diverge on cases involving unequal baseline risks.)*

  **Node 10: Source of Fairness**
  If you prefer the coin, is the value located in the *ex post* utility distribution (inequality is bad even in expectation) or in the *procedure* itself?
  *   **Ex Post Distribution** $\rightarrow$ **Leaf C: Ex Post Prioritarianism**. *(Warning: To hold this, you must backtrack to Node 2 and answer 'No'. You cannot be here and accept Social VNM.)*
  *   **Procedure** $\rightarrow$ Go to Node 11.

  **Node 11: Procedural Constraint**
  Do you view the fair coin as a side-constraint on permissible action that is not captured by the utility sum?
  *   **Yes** $\rightarrow$ **Leaf H: Proceduralist Position**.
  *   **No** $\rightarrow$ *Diagnosis: Incoherent. Preferring the coin without ex post or procedural justification violates rational choice axioms.*

  ***

  ### Instructor's Key & Diagnostics

  **Convergence of Leaves:**
  *   **Leaves F (Ex Ante Prioritarianism) and G (Classical Sum Utilitarianism):** These land on the same point at Node 9. In the specific "Identical Patients" case, both are indifferent to the coin because expected utilities are equal. They are **not notational variants**; they diverge sharply when individuals face different *ex ante* risks (e.g., one patient is naturally more prone to illness). Ex Ante Prioritarianism weights the utility of the high-risk individual more heavily; Classical Utilitarianism does not. The tree merges them here for parsimony, but students must recognize the divergence in non-symmetric cases.

  **Empty or Incoherent Cominations:**
  *   **Node 4 (No VNM, No Maximin, No Ex Post Priority):** This space is **empty because it is incoherent**. Rejecting the Independence Axiom requires an alternative decision rule for risk. Without Maximin or Ex Post transformation, there is no formal structure left to guide choice under uncertainty.
  *   **Node 11 (Prefer Coin, No Procedure, No Ex Post):** This is **empty because it is irrational**. Preferring a lottery over a certain outcome with identical expected utility, without citing procedure or outcome distribution, violates First-Order Stochastic Dominance.

  **Scope Violations:**
  *   **Leaf C (Ex Post Prioritarianism):** This leaf appears twice (Node 4 and Node 10). At Node 4, it is correctly placed outside the Harsanyi assumptions (rejecting Social VNM). At Node 10, it appears as a temptation for students who accepted Social VNM earlier. **Students must be told:** You cannot occupy Leaf C at Node 10 without contradicting your answer at Node 2. Ex Post Prioritarianism is **outside the scope** of Harsanyi's theorem because it violates the Independence Axiom required to derive the linear sum.

  **Defensible Position:**
  *   **Leaf G (Classical Sum Utilitarianism):** This is the only position that maintains consistency across all axioms (Welfarism, Social VNM, Pareto, Equal Weights) without requiring ad-hoc procedural constraints or violating rationality conditions under risk. While Ex Ante Prioritarianism (Leaf F) is a strong rival, it requires justifying social risk aversion that contradicts individual risk neutrality if individuals are VNM rational. Classical Utilitarianism respects the structure of the theorem as a representation of rational social choice under the Impartial Observer premise.

  \answer{Classical Sum Utilitarianism}
