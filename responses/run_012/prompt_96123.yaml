      *   Check constraints: No citations, take Dennett seriously, address the "cheat."

  8.  *(Final thought before drafting)*: The user's insight about the "cheat" is crucial. If the film is about the IS, why do we see the "gears" (Nathan's lab, the other robots)? Because the film wants us to struggle with the same ontological uncertainty. We see the machinery, yet we still take the stance. That proves Dennett's point: even knowing the machinery, the IS is irresistible and necessary for prediction. I need to highlight that.

  9.  **Drafting the response.** (Mental outline: Validate the distinction -> Analyze Caleb's Drift -> Analyze the Audience Trap -> The Verdict on the Ending -> Conclusion on the IS).

  *(Self-Correction during drafting)*: Wait, does Nathan *refuse* the stance? He says she is AI, but he also fears her. He treats her like a dangerous animal. That's still a form of intentional stance (predator/prey), just not a humanistic one. I should nuance that. Nathan treats her as an agent, but a subordinate one. Caleb treats her as a peer. That's the difference.

