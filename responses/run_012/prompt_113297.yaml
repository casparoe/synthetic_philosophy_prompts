answer: |-
  Your colleague's one-liner is a classic piece of deflationary rhetoric, but it conflates syntactic, metaphysical, and pragmatic claims. To assess whether it successfully dissolves the question of truth as a norm of inquiry, we must disentangle the specific philosophical commitments hidden within the slogan "truth is not a property but only a device for disquotation."

  Below are five distinct readings of that claim, ranging from the syntactically radical to the normatively specific. For each, I evaluate its plausibility, its substantiveness, and whether it actually supports the conclusion that truth cannot be the aim or norm of inquiry.

  ### 1. The Syntactic Claim: ‘True’ is not a grammatical predicate
  This reading takes the slogan literally: the word 'true' does not function as a predicate in our language. It suggests that sentences like "That is true" are misleading surface grammar that should be eliminated in favor of direct assertion (e.g., replacing "It is true that snow is white" with "Snow is white").

  *   **Plausibility:** **Low.** In standard first-order logic and natural language grammar, 'true' occupies the predicate position. While some logical revisions (like certain sententialist approaches) have attempted to eliminate it, standard deflationists (like Quine or Horwich) accept it is a predicate; they just deny what it *does*.
  *   **Substantiveness:** **Low.** This is a claim about linguistic form. If false, it is simply a mistake about grammar. If true, it is a technical proposal for language reform, not a discovery about the world.
  *   **Support for Conclusion:** **None.** Even if 'true' were not a predicate, norms can attach to speech acts or mental states regardless of their grammatical marking. The absence of a predicate does not preclude the existence of a normative standard governing the use of sentences.

  ### 2. The Metaphysical Claim: ‘True’ is a predicate but picks out no property
  This is the standard deflationary reading. 'True' is grammatically a predicate, but it does not denote a robust, causal, or natural property (like mass or charge). It is "metaphysically lightweight." To say a proposition has the property of truth is not to ascribe a feature to it in the same way we ascribe weight or shape.

  *   **Plausibility:** **Contested but Standard.** This is the core of deflationism. It is plausible to those wary of metaphysical inflation, but substantive realists argue truth *must* be a property to explain success in science or convergence in inquiry.
  *   **Substantiveness:** **High.** This is a genuine metaphysical thesis about the ontology of semantic values.
  *   **Support for Conclusion:** **Weak.** This is the critical gap in your colleague's argument. The lack of a *substantive* property does not logically preclude a *normative* role. For example, "validity" in logic is not a physical property, yet it is the norm of deduction. "Legality" is not a natural property, yet it norms behavior. Showing truth is not a robust property does not show it cannot be a norm.

  ### 3. The Logical Claim: ‘True’ picks out a merely expressive or logical property
  This reading concedes that 'true' picks out *a* property, but insists it is a "logical" or "formal" property rather than a descriptive one. It is akin to the property of "being a valid argument"—a structural feature that allows for semantic ascent and descent (disquotation) but adds no content to the proposition itself.

  *   **Plausibility:** **High.** This captures the intuition that "It is true that p" says no more than "p." It accounts for the utility of the word without metaphysical baggage.
  *   **Substantiveness:** **Medium.** It is a claim about the semantic function of the term within a logical system.
  *   **Support for Conclusion:** **Weak.** Logical properties often ground norms. If truth is a logical property required for the coherence of assertion, it can still function as a norm. The fact that a property is "merely logical" does not stop it from being the *aim* of inquiry (e.g., inquiry aims at logical coherence).

  ### 4. The Pragmatic Claim: ‘True’ functions only to endorse or generalize
  This reading focuses on use rather than reference. The word 'true' is a device for indirect assertion. It allows us to endorse claims without repeating them ("Everything the witness said is true") or generalize over propositions ("All instances of this schema are true"). Its entire purpose is expressive efficiency.

  *   **Plausibility:** **High.** This explains *why* we have the word 'true' without invoking mysterious metaphysical entities.
  *   **Substantiveness:** **Medium.** This is a thesis in philosophy of language and pragmatics.
  *   **Support for Conclusion:** **Weak.** Endorsement is inherently normative. To endorse a claim is to deem it worthy of belief or assertion. If the function of 'true' is to mark endorsements, then truth is inextricably linked to the norms governing endorsement. This reading actually suggests truth *is* normative, contradicting the colleague's conclusion.

  ### 5. The Normative Claim: Truth is a constitutive norm of assertion, not an aim of inquiry
  This reading distinguishes between two normative roles. It concedes truth might be a *constitutive rule* of assertion (one cannot assert without implicitly claiming truth) but denies it is a *substantive aim* of inquiry (a goal to be maximized or pursued independently). The colleague's one-liner may be attempting to block the move from "truth norms assertion" to "truth is the telos of investigation."

  *   **Plausibility:** **Contested.** Many epistemologists argue inquiry *just is* the pursuit of truth. Deflationists argue inquiry is the pursuit of utility or warranted assertibility, with truth merely tagging the result.
  *   **Substantiveness:** **High.** This is a claim in epistemology and value theory.
  *   **Support for Conclusion:** **Strong (if accepted).** If this claim is granted, it directly supports the conclusion. However, this claim is *not* contained in the one-liner "truth is not a property." It is a separate normative premise that must be argued for.

  ***

  ### Conclusion: What Was Meant vs. What Was Needed

  **What the Deflationist Likely Meant:**
  Your colleague most likely intended **Reading 2 (The Metaphysical Claim)** combined with **Reading 4 (The Pragmatic Claim)**. They were asserting the standard deflationary view: 'true' is a predicate that does not denote a substantial property but serves a logical function for generalization. In their view, if truth isn't a "real" property, it lacks the "weight" to serve as a substantive goal.

  **What the Argument Actually Needed:**
  To validly conclude that truth cannot be the norm or aim of inquiry, the argument required **Reading 5 (The Normative Claim)** supported by a hidden bridging premise: *"Only substantive, robust properties can serve as aims of inquiry."*

  Without that bridging premise, the move from "truth is not a property" to "truth is not a norm" is a non sequitur. Logical and expressive features can still ground norms (as validity does for logic). Your colleague's one-liner successfully states a metaphysical position but fails to engage with the normative theory required to dismiss truth as an aim. You were right to feel the dissolution was premature; the one-liner addresses the *nature* of truth, but not its *value*.
