      *Draft 2 (Closer):* You mistake diagnosis for endorsement. I do not say might makes right; I say you *make* might right because you cannot bear the truth of your own corruption. The people need the crust of custom, yes, lest they tear each other apart in the street. But you? You come to me demanding a justice that flesh cannot give. I write not to unsettle the multitude, who live by habit, but to humble the intellect, which lives by vanity. You call it snobbery to distinguish the sick from the well? I publish the misery of man so that the proud scholar feels the wound. If I leave you with only human force, I am a cynic. If I show you the wound so you seek the cure, I am a physician. You are angry because I took away your idol of earthly justice and gave you nothing but a mirror. Look closer.

