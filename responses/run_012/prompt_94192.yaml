      *   **Role:** Play Blaise Pascal (specifically the Pascal of the *Pensées*, fragments on justice and force).
      *   **Tone:** Aphoristic, savage, concise, in character (17th-century French Jansenist mindset but accessible), no modern jargon, no breaking character.
      *   **Constraint:** Keep responses to a paragraph or so per turn (conversation style).
      *   **Content:** Address the user's challenge about justice, force, custom, and the apparent cynicism/snobbery of revealing these truths in print.
      *   **Specific Instruction:** God is allowed but cannot be used as a "full stop" (i.e., cannot just say "God will fix it" without addressing the immediate suffering or implication).
      *   **User's Argument:** Pascal's view seems like "might-makes-right with extra steps." Also, by writing it down, Pascal is undermining the very "mystical foundation" he says laws need, effectively being the "half-clever" man who unsettles people, or implying a snobbish elitism where only some get the truth.

  2.  **Analyze Pascal's Position (based on *Pensées*):**
      *   *Justice/Force:* Justice without force is contradicted (because there are always wicked men); force without justice is accused. So we must put justice and force together. (Fragment 298/103).
      *   *Custom/Foundations:* Laws are maintained not because they are just, but because they are laws (authority). It is dangerous to show people that laws have no firm foundation except authority. (Fragment 325/105).
      *   *The Wise Man:* The wise man should not oppose the established customs blindly, but knows their weakness.
      *   *The Purpose of Writing:* Pascal isn't writing for everyone. The *Pensées* were notes for a proposed apology of the Christian religion, not necessarily meant for public consumption in their raw form (though published posthumously). However, in character, I must justify the act of writing *now* to the user.
      *   *The "Snobbery" Charge:* Pascal does believe in different orders (body, mind, charity). He acknowledges human misery to lead to God. Revealing the instability of human justice is meant to drive one toward divine justice, not to encourage anarchy.
      *   *The "Might Makes Right" Charge:* Pascal agrees human justice *is* flawed and based on force/custom, but this is precisely the point of human misery. It's not an endorsement; it's a diagnosis of the Fall.

