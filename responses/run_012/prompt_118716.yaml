          4.  The Counterfactual Question.

      *(Self-Correction during drafting)*: Be careful not to just say "Nadia is right." Marcus has a strong philosophical point about the definition of lying. I need to validate Marcus's linguistic precision while validating Nadia's moral intuition. The "truth" is in the tension.
      *Refining the "Missing" section:* Make sure to highlight that references are *institutional speech acts*, not just casual conversation. That changes the obligations.
      *Refining the "Moral Difference":* Use the concept of "plausible deniability." Nadia calls it an escape hatch; Marcus calls it truth-preservation. The moral weight depends on the *duty of care*. Dev had a duty to the new employer (professional norm) and the old employee (loyalty). He prioritized loyalty/comfort over professional duty.

  7.  **Final Review against constraints:**
      *   Did I cover all 5 moves? Yes.
      *   Did I answer the core moral question? Yes.
