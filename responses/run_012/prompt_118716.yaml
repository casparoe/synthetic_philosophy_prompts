  *(Wait, one nuance check on Move 5)*: Nadia says "it's her fault for taking a direct answer... at face value." Marcus says "manager had a phone." This is about epistemic vigilance. I need to weigh in on who bears the burden of truth in a reference check. Usually, the giver holds the power.

