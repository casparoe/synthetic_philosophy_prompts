  3.  **Address the Core Moral Question (Lying vs. Misleading):**
      *   *Is there a difference?* Yes, philosophically and legally (perjury vs. misleading testimony).
      *   *What rests on it?* Trust norms. Lying breaks the norm of truth-telling. Misleading breaks the norm of cooperativity (Grice's Maxims).
      *   *Better or Worse?*
          *   Argument for "Worse": It's manipulative and denies the victim the chance to realize they are being deceived (Nadia's point). It protects the deceiver's reputation as "honest."
          *   Argument for "Better": It leaves a trail of truth. It respects the letter of the law/truth, allowing the listener to exercise skepticism.
          *   *My take:* In a reference context, the norm is *full disclosure of relevant negatives*. Dev violated the *purpose* of the reference. Whether it's a "lie" matters less than that it was a *betrayal of the reference function*. However, strictly speaking, misleading is often considered *less* morally culpable than lying because it preserves the listener's autonomy to infer correctly, but Dev's position of power (reference giver) undermines that autonomy.

  4.  **Identify What They Are Missing (The Meta-Argument):**
      *   They are fighting over semantics ("Is it a lie?") and individual morality ("Is Dev bad?").
      *   *The Real Issue:* The **norms of professional references**.
      *   References operate on a specific social contract. The default norm in many industries is "name, rank, serial number" (dates, title) precisely to avoid this liability. If Dev gave a glowing reference, he entered a contract of *advocacy*.
      *   *The Victim:* It's not just the manager. It's the *new team* who will suffer Ali's behavior. It's Ali, who doesn't get feedback to improve.
      *   *Dev's Motivation:* Why did he do it? Conflict avoidance? Kindness? Laziness? They ignore the *why*.
      *   *The System:* Why do managers ask "Anything I should know?" expecting honesty when they know people protect friends?

