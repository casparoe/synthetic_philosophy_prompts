      *   (1) says "spacetime is an entity." (6) says "points have identity." (6) is the specific ontological cashing-out of (1). If (6) goes, (1) needs rephrasing.

      Okay, ready to write.

      *   *Tone:* Direct, analytical, respectful of the thesis context.
