answer: |-
  Dear friend, your friend's reading of Dennett is sharp and captures the seductive simplicity of universal Darwinism, but I think the reduction goes too far and ends up smuggling in the very things it claims to eliminate. To start with the mapping you asked for, we can trace the generate-and-test cycle across the four creatures by looking at what plays each role. In the Darwinian creature, variation is genetic mutation, selection is environmental survival, the environment is the physical world, death is biological cessation, and memory is the genome passed to offspring. For the Skinnerian creature, variation becomes behavioral tweaking during a lifetime, selection is reinforcement or punishment, the environment is still the physical world but experienced directly, death is replaced by lost opportunity or pain, and memory is stored in synaptic weights or conditioned responses. When we move to the Popperian creature, variation shifts to the generation of hypotheses, selection happens via internal simulation, the environment becomes an internal model of the world, death is the rejection of the hypothesis, and memory is the updated mental model. Finally, for the Gregorian creature, variation is the modification of cultural tools, selection is social critique or practical utility, the environment is the shared space of artifacts and language, death is the obsolescence of the tool, and memory is externalized in libraries, institutions, and technologies.

  That mapping looks clean on paper, but it breaks precisely where your friend's conclusion depends on it, which is the claim that there is no interesting joint in the ladder and no need for inner models. The critical break happens at the transition from Skinnerian to Popperian. Your friend argues that the only difference is the price of the test, but for the test to become cheap enough to run inside the head, the creature must possess a surrogate environment that mimics the real world well enough to kill the bad hypothesis before it is acted out. That surrogate environment is exactly what we mean by an inner model or representation. You cannot have Popperian creatures without representations because the internal testing ground must structurally resemble the external world to yield valid predictions. If you remove the inner model, you remove the ability to test internally, and the creature collapses back into being Skinnerian, paying with shocks instead of hypotheses. So the joint between Skinnerian and Popperian is not just a change in price tag; it is the emergence of representational capacity. The rat learning the maze is not doing the same kind of event as the physicist testing a theory because the physicist is testing against a model that encodes causal structures, whereas the rat is testing against direct sensory feedback. The mechanism of variation also changes fundamentally. A rat varies behavior largely through random exploration or simple heuristics, while a physicist varies hypotheses using deep structural constraints derived from existing theory. Treating these as the same kind of generation event ignores that the physicist's generator is itself laden with knowledge and understanding, which brings us back to the need for a story about how that understanding is constituted.

  The analogy also quietly imports several assumptions that do not hold up under scrutiny. It assumes that a hypothesis is a discrete thing separable from the creature, but in cognitive systems, the hypothesis generation process is intertwined with the architecture of the thinker. It assumes there is one environment doing the selecting, but for Popperian and Gregorian creatures, the selecting environment is partly constructed by the creature itself. It assumes the results of past tests pile up somewhere and get consulted in a uniform way, but biological memory, neural weighting, mental simulation, and cultural archives operate on vastly different timescales and access rules. Most importantly, it assumes that a test is cheap or expensive in a single common currency, but the value of a failed test changes sign depending on the level. Biological death stops all future testing, while a falsified hypothesis enables future testing by narrowing the search space. You cannot compare these costs on a single linear scale because they function differently in the economy of the system. The analogy hides the fact that the ability to reduce the cost of testing is itself an achievement that requires complex internal machinery.

  So, does your friend's conclusion survive once these disanalogies are on the table? I do not think it does. The claim that anything doing trial and error with a cheap enough test is already thinking, and therefore we need no story about understanding, gets the dependency backwards. Things can run cheap tests only because they have already achieved a level of understanding that allows them to build simulators. The cheapness of the test is the result of representation, not the substitute for it. The analogy was carrying the conclusion the whole time by treating the capacity for internal simulation as a given rather than something that needs explaining. If you acknowledge that the Popperian step requires a model of the world to run the simulations, then you must admit that representations are real and functionally indispensable. A better picture to reach for is not a ladder of cost but a ladder of decoupling. Each step represents an increase in the organism's ability to decouple its decision-making from the immediate causal impact of the environment. But this decoupling is purchased by building internal structures that mirror the external world. So we do need a story about inner models. In fact, that story is the only thing that explains the price drop. The rat does not have a model, so it pays with shock. The physicist has a model, so she pays with paper. The model is not an extra ghost in the machine; it is the safety harness that allows the cheap testing. Your friend wants to say the harness doesn't matter because the fall is soft, but the harness is the only reason the fall is soft.
