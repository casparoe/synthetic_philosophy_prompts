answer: |-
  This is one of the stickiest problems in the philosophy of mind and language, and your confusion is well-placed: the literature is famously fragmented between logical, pragmatic, and epistemic explanations. Since you want to avoid the Preface/Lottery distractions and get at the structural core, let's strip this down to the mechanics of assertion and self-knowledge.

  Here is a clean breakdown of the absurdity, the person/tense shift, and your invented case.

  ### 1. Omissive vs. Commissive: Why the Difference?

  First, a crucial correction to a common intuition (which you hinted at): **Neither version is logically contradictory.**

  *   **Omissive:** $p \land \neg Bp$ ("It is raining, but I don't believe it is.")
  *   **Commissive:** $p \land B\neg p$ ("It is raining, but I believe it is not.")

  Both sentences can be **true**. It is a contingent fact about the world that it is raining; it is a contingent fact about your mind whether you believe it. You can be ignorant of the rain (Omissive is true) or mistaken about the rain (Commissive is true).

  So why does the Commissive feel "straightforwardly contradictory" to you, while the Omissive feels "absurd"?

  **The Commissive ($p \land B\neg p$)** manifests a conflict in *rationality*. If you assert $p$, you represent yourself as believing $p$. If you simultaneously assert you believe $\neg p$, you are representing yourself as holding contradictory beliefs ($Bp \land B\neg p$). This is a violation of the *norms of rationality*. It feels contradictory because it depicts a mind at war with itself.

  **The Omissive ($p \land \neg Bp$)** is weirder because it depicts a mind that is *rationally coherent* (you aren't believing contradictions) but **assertorically self-defeating**.
  *   To assert $p$ is to express the belief that $p$.
  *   To assert $\neg Bp$ is to express the belief that you lack that belief.
  *   Therefore, asserting the conjunction expresses: $Bp \land \neg Bp$.

  The absurdity of the Omissive version is that **the act of asserting it makes it false.** If you sincerely assert the first half, you falsify the second half. The Commissive version describes an irrational state; the Omissive version describes a state that *cannot be sincerely asserted*.

  ### 2. The Person and Tense Shift: The Transparency Connection

  You hit the nail on the head: this is tied to **Transparency**. This concept, most famously articulated by Gareth Evans, is the key to why the paradox evaporates in the third person or past tense.

  **The Transparency Thesis:**
  When asked, "Do you believe that $p$?", you do not typically introspect to find a mental object called a 'belief'. Instead, you look outward to the world to see if $p$ is true. Your access to your own belief is *transparent* to your assessment of the fact.

  **Why the First-Person Present is Special:**
  In the first-person present, there is no gap between the fact ($p$) and the belief ($Bp$) *for the purpose of assertion*.
  *   When I say "It is raining," I am reporting the weather.
  *   But in doing so, I am *also* giving you my warrant for thinking I believe it.
  *   My authority on my own belief comes from my authority on the weather.

  **Why Third Person and Past Tense Work:**
  *   **Third Person:** "It is raining but John doesn't believe it."
      Here, the fact ($p$) and the belief ($B_{John}p$) are two independent states of affairs in the world. I can observe the rain and I can observe John's ignorance. There is no transparency relation between *my* assertion and *John's* mind.
  *   **Past Tense:** "It was raining but I didn't believe it."
      Here, the belief is a past object. I am no longer *in* that belief state. I can look back at my past self as if they were a third person. The transparency link is broken because I am not currently taking $p$ to be true *in the act of asserting the belief claim*.

  **The Connection:**
  The Moorean absurdity arises because, in the first-person present, **asserting $p$ is the very evidence for $Bp$.** To assert $p$ while denying $Bp$ is to pull the ladder up after you've climbed it. You are using your belief in $p$ to warrant the assertion of $p$, while simultaneously denying you have that warrant.

  ### 3. What Kind of Absurdity Is This?

  You asked to take this seriously rather than shrugging it off as "pragmatic." This is the most contested part of the literature. Here is the hierarchy of explanations, and where the consensus is landing:

  1.  **Semantic?** No. The sentence has truth conditions. It is not gibberish.
  2.  **Logical?** No. As established, it can be true.
  3.  **Standard Pragmatic (Gricean)?** This is the "conversational implicature" view. It says asserting $p$ *implicates* $Bp$.
      *   *Problem:* Gricean implicatures can be cancelled. I can say, "Some of the students passed, in fact all of them." I cannot say, "It is raining but I don't believe it, and I don't imply that I believe it." The absurdity remains.
  4.  **Constitutive Normative (The Stronger View):** This is the view you should lean on for a seminar.
      *   Assertion is a game with constitutive rules (like chess). The rule of assertion is: **Assert $p$ only if you believe $p$.** (Or, on Timothy Williamson's account: Assert $p$ only if you *know* $p$).
      *   This isn't just a polite convention; it is what *makes* an act an assertion rather than a guess or a lie.
      *   Therefore, Moorean sentences are **assertorically inconsistent**. They violate the conditions required to perform the speech act successfully.

  **Verdict:** The absurdity is **Normative-Pragmatic**. It is a violation of the constitutive norms of assertion, rooted in the nature of belief itself. Belief "aims at truth," and assertion expresses belief. To assert $p$ while denying $Bp$ is to violate the internal architecture of the speech act.

  ### 4. Your Invented Case: Higher-Order Moore

  Your case: **"I believe it's raining, but I don't believe I believe it."** ($Bp \land \neg BBp$)

  This is known in the literature as a **Higher-Order Moore Sentence**. Is it paradoxical? Yes, but it relies on a different, more contentious principle than standard Moore.

  **The Principle of Positive Introspection:**
  Standard Moore relies on the link between *Truth* and *Belief* (via assertion). Your case relies on the link between *Belief* and *Belief in Belief*.
  *   Does $Bp$ entail $BBp$? (If I believe $p$, must I believe that I believe $p$?)
  *   Many philosophers (e.g., Shoemaker) argue that for rational agents, belief is **self-intimating**. If you believe $p$, you are in a position to know you believe $p$.

  **Why it is Moore-Paradoxical:**
  If you assert "I believe it's raining," you are avowing a mental state. Avowals typically claim **introspective authority**.
  *   By asserting the first conjunct ($Bp$), you claim access to your belief.
  *   By asserting the second conjunct ($\neg BBp$), you deny that you have access to that access.
  *   It undermines the *authority* of the first claim. If you don't believe you believe it, how can you be so sure you believe it?

  **Is it the "Same Animal"?**
  It is a cousin, but distinct.
  *   **Standard Moore ($p \land \neg Bp$):** Violates the norm connecting *World* to *Mind*. (Transparency).
  *   **Your Case ($Bp \land \neg BBp$):** Violates the norm connecting *Mind* to *Self-Knowledge*. (Introspection).

  **Does it make sense?**
  Actually, your case is *less* absurd than standard Moore. There are genuine psychological cases where $Bp \land \neg BBp$ is true.
  *   **Self-Deception:** I might believe my partner is cheating ($Bp$) but refuse to acknowledge that I hold this belief ($\neg BBp$).
  *   **Unconscious Belief:** I might believe a stereotype ($Bp$) without being aware that I hold it ($\neg BBp$).

  However, **asserting** it is still paradoxical. You can *be* in that state, but you cannot *avow* it without undermining your own credibility. If you tell me, "I believe it, but I don't think I believe it," I will not trust that you actually believe it.

  ### Summary for your Seminar

  1.  **Absurdity Type:** It is a **constitutive normative violation**. It's not logically false, but it breaks the rules of what it means to make an assertion.
  2.  **Omissive vs. Commissive:** Both are logically possible. The Omissive is uniquely paradoxical because asserting it *makes* it false (self-defeating), whereas the Commissive just portrays irrationality.
  3.  **Transparency:** The paradox only works in the 1st-person present because that is the only place where assessing the world ($p$) and assessing the mind ($Bp$) are the same act. In 3rd person or past tense, they are separate observations.
  4.  **Your Case:** It is a Higher-Order Moore sentence. It is possible to *be* in that state (unlike standard Moore, which is hard to be in while asserting), but it is impossible to *assert* it with authority. It highlights that avowals claim introspective access.

  If you need a single citation to anchor this, look at **Richard Moran's *Authority and Estrangement***. He bridges the Transparency idea with the normative status of avowals perfectly and handles the 1st/3rd person distinction exactly as you suspected.
