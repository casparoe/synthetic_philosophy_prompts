answer: |-
  1. Bottom line
  Your two-ledger proposal is an elegant heuristic, but it collapses under the weight of this specific case. While it correctly identifies that frequentism polices procedure and Bayesianism polices credence, it falsely assumes these domains are separable. In the Bem episode, the design choices frequentists criticize (optional stopping, multiple measures) are precisely the factors that degrade the evidential value Bayesians care about. You cannot keep the ledgers apart because the integrity of the design determines the trustworthiness of the likelihood. The episode does not vindicate a division of labor; it reveals an entanglement. The pathology was not reading one ledger off the other, but pretending the frequentist ledger existed at all while trying to spend Bayesian currency. The verdict is that the frameworks are distinct doctrines, but in practice, they are mutually dependent constraints on the same scientific act.

  2. The episode as I'd file it
  The case opens with a single paper reporting nine experiments claiming precognition: future events influencing present performance. The results were statistically significant by conventional standards, yet the effect sizes were small and the p-values often clustered just below the threshold. One experiment was framed as a conceptual replication of known priming effects, merely reversed in time. The scientific community reacted with immediate skepticism, not because the math was wrong, but because the claim violated established physical laws. A wave of follow-up studies ensued. Most failed to find the effect. A large multi-lab replication effort later confirmed that only about a third of similar published effects held up under rigorous conditions. The pressure points are clear: the flexibility in the original design, the extraordinary nature of the claim, and the subsequent failure of independent labs to reproduce the findings using stricter protocols. This is not just a story about a failed effect; it is a stress test for how we validate knowledge.

  3. The frequentist reading
  From the frequentist perspective, the Bem paper represents a breakdown in procedural control. Significance testing relies on the assumption of a fixed sampling plan and a defined stopping rule. If a researcher collects data until significance is achieved, or selects among multiple dependent variables until one yields a p-value under .05, the long-run error rate is no longer 5%. It inflates, potentially drastically. The cluster of barely-significant results suggests the procedure was tuned to find noise. Frequentism dictates that the validity of the inference depends on the counterfactual: what would have happened if the data were different? Because the design allowed flexibility, the counterfactuals are undefined, rendering the p-values uninterpretable as error rates. Regarding replication, the frequentist view is strict: a replication is a new test of the null hypothesis. When the follow-up studies fail to reject the null, the original result is classified as a likely Type I error. The phrase "it failed to replicate" is accurate frequentist shorthand for "the procedure did not yield consistent rejections of the null across independent instances." The original paper did not prove the effect existed; it merely failed to prove it didn't, under compromised conditions.

  4. The Bayesian reading
  A Bayesian analysis treats the data as evidence to update a prior credence. Here, the prior probability of precognition is exceptionally low, as it contradicts fundamental causal structures. Even if the likelihood ratio favors the alternative hypothesis, a sufficiently skeptical prior ensures the posterior probability remains low. The data from the nine experiments were not strong enough to overcome the impossibility of the claim. Regarding design, the Bayesian likelihood principle states that once the data are in hand, the stopping rule is irrelevant; evidence is evidence regardless of when the collector decided to stop. However, a sophisticated Bayesian accounts for the researcher's degrees of freedom by adjusting the model of the data generation process. When replications fail, the Bayesian does not just update credence about the effect; they update credence about the research program. The failed replications serve as strong evidence that the original likelihood function was misspecified or that the data were biased. Thus, the rational agent moves their credence toward the null, not because the null is proven, but because the cumulative evidence from the program now favors it.

  5. Where each framework misreads the episode
  The frequentist framework misreads the episode by remaining silent on the plausibility of the claim. It treats a significant result for precognition the same as a significant result for a new drug, provided the error rates are controlled. It cannot quantify evidence for the null; it can only fail to reject it. This leaves the field in a limbo where "no evidence of an effect" is conflated with "evidence of no effect." The specific moment of exposure is the replication failure: frequentism struggles to explain why we should believe the effect is false rather than just unproven, since accepting the null is formally forbidden.

  The Bayesian framework misreads the episode if it adheres strictly to the likelihood principle regarding stopping rules. If the data were generated by a process of optional stopping, the data themselves are biased samples of reality. Ignoring this because "data are data" distorts the inference. The specific moment of exposure is the assessment of the original paper: a naive Bayesian might accept the likelihood ratio at face value, ignoring that the likelihood function itself is compromised by the researcher's flexibility. Furthermore, Bayesianism offers no objective arbiter for the prior. If a believer sets the prior high enough, the data confirm precognition. The framework explains how credence should move, but it cannot adjudicate what the starting credence ought to be without importing external scientific consensus. Both frameworks distort the social reality of science: frequentism ignores belief, Bayesianism struggles to constrain it objectively.

  6. The two-ledger proposal assessed
  Your two-ledger proposal posits a clean division: frequentism for design, Bayesianism for interpretation. This case shows that division cannot hold. Design choices are not merely procedural guardrails; they are constitutive of the evidence. When a frequentist demands preregistration to fix the sampling plan, they are ensuring that the likelihood function used by the Bayesian is trustworthy. If the design is flexible, the Bayesian cannot simply update on the data; they must update on the data plus the knowledge that the design was flexible. This means the "Frequentist ledger" entries are actually parameters in the "Bayesian ledger." The pathology was not reading one ledger off the other, but ignoring the frequentist ledger entirely while pretending to do Bayesian inference. Researchers treated p-values as Bayesian evidence without doing the work of specifying priors or accounting for design flexibility. The ledgers are not separate books; they are debit and credit sides of the same account. You cannot have credible evidence without controlled procedures.

  7. What this case settles, and what it doesn't
  This episode settles that p-values alone are insufficient for extraordinary claims. It demonstrates that statistical significance does not equate to scientific truth, especially when prior plausibility is low. It validates the necessity of replication as a mechanism for correcting both procedural errors and prior misjudgments. However, it does not settle the philosophical dispute between frequentism and Bayesianism. Both frameworks, correctly applied, would have rejected the precognition claim: frequentism due to compromised error rates, Bayesianism due to overwhelming prior odds against. The crisis was not a failure of one math over another, but a failure of accountability. The episode leaves open the question of how to institutionalize these checks without stifling exploration. It shows that while the math differs, the scientific imperative is the same: to ensure that our beliefs track reality, not our desires.
