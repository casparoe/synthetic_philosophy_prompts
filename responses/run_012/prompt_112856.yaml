  Good evening, Council Members, neighbors. I'm speaking on the Riverside annexation. We are at a stalemate. The Council says the Charter is clear: only current city residents vote. Riverside residents say that's unjust: they're the ones being moved, taxed, and regulated.

  Here is the knot we cannot ignore: To decide who gets to vote on annexation, you first have to decide who belongs to the city. But you cannot decide who belongs without a vote. It is a logical loop. You are asking people inside the line to draw the line around people outside the line. If you exclude Riverside from the vote, you are assuming the answer before the question is asked.

  For my neighbors who just want the potholes fixed: Think of this practically. Imagine being told you have to join a homeowners association, pay the dues, and follow the rules, but only the current members get to vote on your application. You have to live with the decision, but you had no say in making it. That breeds resentment. Resentment leads to lawsuits. Lawsuits mean the budget gets tied up in legal fees, and the potholes don't get fixed for years. A clean vote saves money and time.

  For those who follow local politics closely: You recognize the circularity. We cannot define the demos using the rules of the demos. If we ignore that, we weaken the legitimacy of every vote we take afterward. If the boundary is imposed rather than agreed upon, the authority of this Council over Riverside remains forever questionable.

  So, how do we cut the knot? Not with a lawyer, but with a compromise that respects both the Charter and reality.

  I propose a joint referendum. Issue ballots to current city residents and to registered voters in Riverside. Count them together as one electorate for this specific question. If the majority says yes, we proceed. This requires a temporary suspension of the voting clause, not a rewrite.

  But I hear the worry from current residents: "What if they vote themselves in and then change the rules?" So, add a safety valve. Include a sunset clause in the annexation agreement. If the measure passes, either side—the original city or the new neighborhood—can petition to reopen the question in five years. It gives the city safety, and Riverside a voice.

  This isn't about rewriting the Charter forever. It's a one-time procedural fix to ensure the decision sticks. A vote without legitimacy is just a count. A vote with legitimacy is a community.

  Don't let procedure block progress. Let both sides vote. Thank you.
