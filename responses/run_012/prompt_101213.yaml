answer: |-
  Here are eight questions designed to bypass the standard diplomatic stalemate. They are ordered to build pressure: starting with the empirical claim, moving to the theoretical framework, and ending with practical consequences.

  Per your request, I have identified the **Cruxes** and the **Trap Question** at the end.

  ### 1. The Strength of the Empirical Claim
  **Question:** You argue that social-psych experiments undermine the existence of global character traits. But there is a massive gap between "situations exert strong influence" and "cross-situational dispositions do not exist at all." Are you making the strong claim that global traits are *impossible*, or the weak claim that they are just *rare*? Because if it's the weak claim, virtue ethics can survive by saying, "We know virtues are hard to attain."

  **Follow-up (If he says "It's the weak claim/they are rare"):** If virtues are just rare, then the situationist critique loses its normative bite. Why should we abandon a theory of *ideal* agency just because most people fail to meet it? Does your critique actually amount to anything more than saying "most people aren't saints"?

  ### 2. The Density-Distribution Reply
  **Question:** Personality psychologists like William Fleeson have argued that while behavior varies situationally, individuals have stable *density distributions*—my average honesty over time is stable, even if any single act isn't predictable. If I have a stable average, doesn't that satisfy the Aristotelian requirement for character, even if the variance is high?

  **Follow-up (If he says "Averages aren't enough for moral responsibility"):** Then what threshold of consistency *is* enough? If you demand near-perfect consistency, you're setting a bar that no psychological mechanism could clear. Are you defining "trait" in a way that makes it empirically impossible by fiat?

  ### 3. The "Local Trait" Explanatory Power
  **Question:** You propose replacing global traits with "local traits"—dispositions indexed to specific situations (e.g., "honest-when-with-friends-but-not-taxes"). But if every distinct situation requires a distinct trait label, isn't "local trait" just a redescription of the behavior itself? How do I falsify the theory? If I help, I have the "helping-in-this-context" trait; if I don't, I lack it.

  **Follow-up (If he says "Local traits have predictive power within that context"):** Prediction isn't explanation. If the trait is defined *by* the context, saying "he helped because he has the helping-in-this-context trait" is tautological. What causal work is the "trait" doing that the "situation" isn't already doing entirely on its own?

  ### 4. The Good Samaritan Study (Darley & Batson)
  **Question:** Let's look at the hurried-seminarians study. Subjects rushing to give a talk on the Good Samaritan were less likely to stop and help a slumped victim. You cite this as evidence that "compassion" is fragile. But isn't "being in a rush" a confound that overrides *all* motivations, not just moral ones? If I'm rushing to save my own child, I might also walk past a stranger.

  **Follow-up (If he says "But they were going to talk about helping"):** That highlights the conflict between abstract commitment and immediate pressure. But does failing a high-pressure test prove I lack the trait, or just that the trait isn't *omnipotent*? If virtue doesn't guarantee action under extreme situational pressure, what does it guarantee?

  ### 5. The Practical Wisdom (*Phronesis*) Defense
  **Question:** Virtue ethicists often reply that these experiments test ordinary people, not *phronimoi* (agents with practical wisdom). They argue that a truly virtuous person would notice the situational pressure and correct for it. Is this a legitimate reading of Aristotle, or is it a "No True Scotsman" move to immunize the theory from empirical refutation?

  **Follow-up (If he says "It's moving the goalposts"):** If the theory only applies to agents who can override situational pressure, and the data shows almost no one can, then virtue ethics becomes a theory of superhuman agency. Why should we base a normative ethics for *humans* on a psychology that humans demonstrably don't have?

  ### 6. Normative vs. Empirical Commitments
  **Question:** Some argue virtue ethics is a normative theory about *ideals* and *eudaimonia*, not an empirical hypothesis about behavior. They say you're committing the naturalistic fallacy by trying to derive an "ought" from a psychological "is." Can't the virtue ethicist just shrug and say, "I don't care what the stats say, this is what flourishing *looks like*"?

  **Follow-up (If he says "Ethics must be psychologically realistic"):** Agreed, but "realistic" doesn't mean "accommodating the average." Medicine is normative (health) but based on biology. If the biology shows our "moral immune system" is leaky, do we change the definition of health, or do we try to build better defenses? Why is abandoning "character" the right fix rather than "better character education"?

  ### 7. Replication and WEIRD Samples
  **Question:** Much of your empirical base relies on classic studies like Milgram or Zimbardo, or older social psych work that has faced replication issues. Furthermore, these samples are overwhelmingly WEIRD (Western, Educated, Industrialized, Rich, Democratic). If the empirical foundation is shaky or culturally specific, does the situationist critique collapse, or do you think the effect sizes are robust enough to survive the replication crisis?

  **Follow-up (If he says "The general point stands even if specific studies fail"):** That's a risky move. If the specific correlations between situation and behavior are weaker than originally thought, the "fragmentation" of character looks less severe. Are you willing to tie your philosophical conclusion to specific effect sizes, or is this a worldview that treats counter-evidence as anecdotal?

  ### 8. Practical Implications (Education/Parenting)
  **Question:** Let's bring this home for the listeners. If you're right, traditional character education (trying to instill "honesty" or "courage") is misguided. We should instead be engineering environments. But doesn't that lead to a passive view of moral agency? If I tell a kid, "Don't try to be brave, just avoid situations where you'd need to be," haven't I taught them to evade moral growth?

  **Follow-up (If he says "We teach situation-management"):** That sounds like teaching prudence, not virtue. If we stop praising the *person* and start praising the *choice of environment*, do we lose the concept of moral responsibility entirely? Can a situationist actually hold anyone blameworthy, or is everyone just a product of their current situational variables?

  ***

  ### Producer's Note: Strategy & Cruxes

  **The Real Cruxes:**
  1.  **Question 3 (Local Traits/Falsifiability):** This is the metaphysical heart of the debate. If "local traits" are just situation-behavior pairs, they lack causal power. If they *do* have causal power, they start looking suspiciously like global traits that are just context-sensitive. The guest needs to explain what a local trait *is* without collapsing into behaviorism or admitting globalism.
  2.  **Question 5 (Phronesis):** This is the standard Virtue Ethics escape hatch. The guest needs to explain why *phronesis* isn't just a magic word for "the exception that disproves the rule." If virtue requires a psychological capacity that the data says doesn't exist, the theory is utopian. If it doesn't, the data refutes it.

  **The Trap Question:**
  **Question 3 is the one he will have the most trouble with.**
  *Why:* It is easy to say "situations matter." It is very hard to define "local traits" in a way that is theoretically robust.
  *   If he says they are **stable dispositions within a context**, you press: How narrow is the context? If it's too narrow, it's not a trait.
  *   If he says they are **predictive models**, you press: That's just statistics, not psychology.
  *   If he says they are **causal powers**, you press: Where is the mechanism distinct from the situation itself?

  **Tone Advice:**
  When he gives the standard "It's about probability, not certainty" answer (likely in Q1 or Q2), do not let him linger. Use the follow-up to force a number or a threshold. If he says "Virtue ethics is about ideals" (Q6), press him on *action guidance*. If an ideal is psychologically impossible for 99% of the population, is it an ethic or a fantasy? Keep him in the empirical weeds; that is where his position is strongest, but also where the nuance often gets glossed over.
