      *Key Philosophical References to keep in mind (internal):* Ryle, Stanley & Williamson, Dreyfus, Dretske (information), Personal/Sub-personal (Peacocke/Dennett).

      *Let's refine the "Who wins" part.* Marcus's claim that "action-guiding state = propositional knowledge" is a category error. A thermostat guides action (turns on heat) based on a state (temperature < threshold). If Marcus says RL is different because it's *complex*, he begs the question. Complexity doesn't change the category. Dana is right to call this out. Marcus's rebuttal to the regress is good, but his positive definition is too broad. Dana's position preserves the distinction needed for epistemology. So Dana wins overall, despite relying on a slightly old-fashioned view of the regress.

