prompt: |-
  Two colleagues of mine spent most of a workshop discussion arguing about whether the Darwinian framework genuinely applies to culture. I was in the audience and took no side, and I would like the exchange adjudicated rather than settled by fiat.

  The first, a selectionist, argued that Darwinian explanation requires only variation, heritability, and differential transmission. Culture supplies all three: songs, sayings, rituals, and beliefs differ from one another; some spread far more widely than others; and much of what spreads is learned from other people, so differences are carried down lineages. On that basis she was willing to call cultural items replicators and to treat their frequencies as shaped by selection. She conceded that transmission is noisy, but held that the conditions usually demanded of a replicator — copying fidelity, fecundity, longevity — are matters of degree, and that where fidelity is low the remedy is to look for larger and more robust units of transmission rather than to abandon the framework.

  The second, an attraction theorist, replied that the analogy fails at heritability rather than at fidelity. On his account, a person who learns a tune or retells a story does not copy it but reconstructs it out of her own expectations, and the errors are not random with respect to content: they are pulled repeatedly toward the same few forms, which is why the same variants turn up in lineages that have had no contact with one another. Where variation is directed toward attractors, he said, the observed distribution of cultural forms is explained by the attractors themselves, and differential reproduction does no work. He added a second objection: no one has produced a principled way of individuating a meme, and without items whose frequencies can be tracked, talk of selection lacks a well-defined subject.

  She answered that directed variation does not abolish selection; it constrains the variation on which selection operates, much as mutational bias constrains genetic evolution without replacing it. She also said the individuation objection proves too much, since species are equally contested as units and population biology proceeds regardless. He answered that the two cases are not parallel: genetic evolution is variational, with variation arising first and being sorted afterwards, whereas cultural transmission is transformational, the mutation being produced by the very process that explains the endpoint — and where a law-like transformer is available, selection is not merely bounded but unnecessary. She replied that a selection coefficient for a cultural variant is measurable in principle once a transmission channel is specified, so his objection marks an empirical gap rather than a conceptual one. Neither of them budged.

  Adjudicate this exchange move by move. For each move, rate it on a scale running from clearly mistaken to clearly right, with a brief justification, and say who bears the burden of proof at that point. Then say what the disagreement is really about: whether it is a substantive disagreement about how culture changes, a disagreement about what a Darwinian explanation is required to contain, or a terminological dispute about how loosely the word selection may be used. Finally, identify what both parties are missing — including what would count as decisive evidence for either position, and whether either side's position can be maintained in the form in which it was actually stated.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a debate between two colleagues (Selectionist vs. Attraction Theorist) about applying Darwinian frameworks to culture.
      *   **Format:** Move-by-move analysis (rating + justification + burden of proof), followed by an analysis of the core disagreement (substantive, definitional, or terminological), and finally an identification of what both are missing (decisive evidence, viability of current positions).
      *   **Tone:** Objective, analytical, philosophical/scientific adjudication.
      *   **Scale:** Clearly Mistaken to Clearly Right.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Selectionist):** Darwinism requires Variation, Heritability, Differential Transmission (V-H-DT). Culture has these. Therefore, cultural items are replicators, frequencies shaped by selection. Low fidelity is a degree issue; look for larger units.
      *   **Move 2 (Attraction Theorist):** Analogy fails at heritability. Reconstruction, not copying. Errors are biased (attractors), not random. Same variants appear independently. Attractors explain distribution; differential reproduction does no work. Also, no principled way to individuate memes (units problem).
      *   **Move 3 (Selectionist):** Directed variation doesn't abolish selection; it constrains it (like mutational bias). Individuation objection proves too much (species are contested too).
      *   **Move 4 (Attraction Theorist):** Genetic = variational (variation then sorting). Cultural = transformational (mutation produced by transmission process). If a law-like transformer exists, selection is unnecessary.
      *   **Move 5 (Selectionist):** Selection coefficient is measurable in principle if channel specified. Objection is empirical, not conceptual.

  3.  **Evaluate Each Move (Mental Draft & Fact-Checking):**

      *   *Move 1 (Sel):* Standard Lewontin conditions. Generally accepted as the *minimum* for Darwinian evolution. Claiming culture meets them is plausible but contested (fidelity). *Rating:* Mostly Right. *Burden:* On her to show fidelity is sufficient.
      *   *Move 2 (Attr):* Cognitive attraction (Sperber, Morin). Reconstruction is real. Convergent evolution (attractors) is real. Claiming selection does *no* work is strong. Unit individuation is a classic critique (Sterelny, Griffiths). *Rating:* Strong on reconstruction, weak on "no work" for selection. *Burden:* On him to show selection is *otiose*, not just constrained.
      *   *Move 3 (Sel):* Mutational bias analogy is standard evolutionary theory (Stoltzfus). Species individuation is indeed messy but doesn't stop population biology. *Rating:* Right. *Burden:* Shifts back to Attr to show the disanalogy is fatal.
      *   *Move 4 (Attr):* Variational vs. Transformational distinction (Gould/Lewontin vs. Sperber). This is the crux. If transmission *is* transformation based on cognitive laws, is it selection? If the outcome is determined by the transformer, selection is redundant. *Rating:* Conceptually strong, but empirically debatable (is it *fully* determined?). *Burden:* On him to prove the transformer is sufficient without frequency-dependent effects.
      *   *Move 5 (Sel):* "Measurable in principle." True, but begs the question of whether the measurement captures selection or just attraction strength. *Rating:* Partially Right (empirical gap), but dodges the theoretical claim that the *mechanism* is different. *Burden:* Shared.

  4.  **Analyze the Core Disagreement:**
      *   Is it substantive? Yes (how culture changes).
      *   Is it definitional? Yes (what counts as Darwinian).
      *   Is it terminological? Yes (use of "selection").
      *   *Verdict:* It's a mix, but primarily substantive regarding the *mechanism* (selection vs. transformation) masked by a terminological fight over "Darwinian."

  5.  **Identify What's Missing:**
      *   **Selectionist:** Ignores the cognitive architecture that biases reconstruction. Treats "fidelity" too loosely.
      *   **Attraction:** Ignores frequency-dependent bias (conformism) which *is* selection-like. Ignores that attractors don't explain *why* one attractor wins over another in competition.
      *   **Decisive Evidence:** Need to separate content bias (attraction) from frequency bias (selection). Longitudinal tracking of variants controlling for cognitive salience.
      *   **Viability:** Pure Selectionism (memetics) is largely discredited in its strong form. Pure Attraction (cultural epidemiology) struggles with historical contingency. A dual-inheritance or hybrid model is the actual scientific consensus.

  6.  **Drafting the Adjudication (Iterative Refinement):**

      *   *Rating Scale:* I need to be careful not to be too binary. Use "Mostly Right," "Partially Mistaken," etc.
      *   *Burden of Proof:* Track who is making the positive claim vs. the negative claim.
      *   *Synthesis:* The "Dual Inheritance" or "Cultural Epidemiology" synthesis needs to be mentioned as the resolution they are missing.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "they are both half right." I need to adjudicate the specific *arguments* made.
      *   Selectionist Move 1: Right on Lewontin, shaky on fidelity.
      *   Attraction Move 2: Right on reconstruction, wrong that selection does *no* work.
      *   Selectionist Move 3: Right on mutational bias analogy.
      *   Attraction Move 4: Strong distinction (Variational vs Transformational), but "unnecessary" is too strong.
      *   Selectionist Move 5: Kicks the can down the road (empirical vs conceptual).

      *Core Disagreement:* It's fundamentally about the *causal architecture*. Is the primary driver differential persistence of variants (Selection) or biased generation of variants (Attraction)?

      *Missing:* The interaction between the two. Frequency-bias vs. Content-bias.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Move by move? Yes.
      *   Rating scale? Yes.
      *   Justification? Yes.
      *   Burden of proof? Yes.
      *   What disagreement is really about? Yes.
      *   What both are missing? Yes.
      *   Decisive evidence? Yes.
      *   Viability of positions? Yes.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Adjudication of the Exchange

  #### Move 1: The Selectionist's Opening
  **Claim:** Darwinism requires Variation, Heritability, and Differential Transmission (V-H-DT). Culture meets these. Low fidelity is a matter of degree; look for larger units.
  **Rating:** **Mostly Right.**
  **Justification:** The Lewontin conditions (V-H-DT) are the standard minimal requirements for evolution by natural selection. The Selectionist is correct that fidelity is a continuous variable, not a binary switch, and that population biology often aggregates noisy data into robust units (e.g., quantitative traits). However, she glosses over the *degree* of fidelity required. If fidelity is too low relative to the strength of selection, adaptation cannot accumulate.
  **Burden of Proof:** On the **Selectionist**. She asserts the framework applies; she must demonstrate that cultural fidelity is sufficiently high to sustain cumulative selection, not just that variation exists.

  #### Move 2: The Attraction Theorist's Rebuttal
  **Claim:** Heritability fails because transmission is reconstructive, not copying. Errors are biased toward attractors (convergent evolution). Therefore, differential reproduction does no work. Also, memes cannot be individuated.
  **Rating:** **Partially Right / Partially Mistaken.**
  **Justification:** He is **Right** that cultural transmission is often reconstructive (Sperber's cultural epidemiology) and that content biases (attractors) explain cross-cultural convergences better than lineage does. He is **Mistaken** in claiming differential reproduction does *no* work. Even if variants are attracted to specific forms, competition between those forms (e.g., two different "attractive" stories) still involves differential spread. The individuation objection is strong (the "meme" problem is notorious), but as the Selectionist will note, not unique to biology.
  **Burden of Proof:** Shifts to the **Attraction Theorist**. He makes the strong claim that selection is *otiose* (does no work). He must prove that attractors alone suffice to explain frequency distributions without recourse to competitive dynamics.

  #### Move 3: The Selectionist's Counter
  **Claim:** Directed variation constrains but does not abolish selection (analogy: mutational bias). Individuation problems exist in biology (species) too.
  **Rating:** **Clearly Right.**
  **Justification:** Evolutionary theory explicitly accommodates mutational bias; it limits the "search space" but does not replace the sorting process. The analogy to species individuation is also accurate: the "species problem" is real in biology, yet population genetics proceeds by tracking allele frequencies without perfect ontological commitment to species boundaries.
  **Burden of Proof:** Shifts back to the **Attraction Theorist**. The Selectionist has successfully neutralized the "imperfection" and "individuation" objections by showing they exist in the source domain (biology) as well.

  #### Move 4: The Attraction Theorist's Distinction
  **Claim:** Genetic evolution is variational (variation then sorting); cultural transmission is transformational (mutation produced by the transmission process). Where a law-like transformer exists, selection is unnecessary.
  **Rating:** **Mostly Right (Conceptually) / Empirically Debatable.**
  **Justification:** This is the strongest philosophical point in the debate. It invokes the distinction between *variational* change (sorting pre-existing variants) and *transformational* change (Lamarckian or structuralist drift). If the "transformer" (human cognitive architecture) deterministically produces specific variants regardless of antecedent frequency, selection is indeed redundant. However, he overstates the case: cultural transmission is not *purely* transformational; frequency-dependent biases (conformism) exist, which are selection-like.
  **Burden of Proof:** Shared. The Theorist must show the transformer is sufficient; the Selectionist must show that sorting operates independently of the transformer.

  #### Move 5: The Selectionist's Closing
  **Claim:** Selection coefficients are measurable in principle given a channel. The objection is empirical, not conceptual.
  **Rating:** **Partially Mistaken.**
  **Justification:** She treats the dispute as merely empirical (can we measure it?) when the Attraction Theorist is making a *causal* claim (is the mechanism selection or transformation?). If the variation is generated *by* the transmission process in a law-like way, measuring a "selection coefficient" might simply be measuring the strength of the attractor, conflating the two mechanisms. She is right that it's not a conceptual impossibility, but wrong to imply this settles the causal architecture.
  **Burden of Proof:** **Shared.** Both sides now bear the burden of producing the empirical models that distinguish the mechanisms.

  ***

  ### What the Disagreement Is Really About

  This is not merely a terminological dispute about the word "selection," nor is it purely substantive. It is a **disagreement about causal architecture masked by a definitional boundary.**

  1.  **Substantive:** They disagree on the primary engine of cultural change. The Selectionist sees the engine as *differential persistence* of variants (survival of the fittest meme). The Attraction Theorist sees the engine as *biased generation* of variants (production of the most cognitively fit meme).
  2.  **Definitional:** They disagree on what constitutes a "Darwinian" explanation. The Selectionist uses the **Lewontin definition** (V-H-DT are sufficient). The Attraction Theorist uses a **Process definition** (Variational sorting is necessary; transformational processes are distinct).
  3.  **Terminological:** They are fighting over the label "Darwinian." If the Attraction Theorist's "attractors" are admitted as a form of "selection pressure," the Selectionist wins the label but loses the mechanism. If "Darwinian" requires blind variation, the Selectionist loses the label.

  **Verdict:** The core friction is substantive. The Selectionist assumes cultural variants exist *prior* to selection (like genes), while the Attraction Theorist argues they are *created during* transmission (like ideas).

  ***

  ### What Both Parties Are Missing

  Both colleagues are arguing from purified models that do not reflect the current state of cultural evolution science.

  **1. The Missing Mechanism: Frequency-Dependent Bias**
  *   **Selectionist Blind Spot:** She treats cultural variants as if they have intrinsic fitness independent of context. She underestimates the role of cognitive architecture in *creating* the variants, not just filtering them.
  *   **Attraction Blind Spot:** He treats cognitive attractors as if they operate in a vacuum. He ignores **frequency-dependent bias** (e.g., conformism, prestige bias). Even if two stories are equally "attractive" cognitively, one may spread simply because it is already common or held by a high-status individual. This *is* a selection process (differential transmission based on frequency/source, not content) that his transformational model does not fully capture.

  **2. Decisive Evidence Required**
  To settle this, one would need a study that disentangles **content bias** (attraction) from **context bias** (selection).
  *   *Experimental Design:* Present subjects with two cultural variants of equal cognitive attractiveness (controlled for memorability, emotional resonance, etc.). Manipulate only their frequency or the status of the source.
  *   *Outcome:* If the high-frequency/high-status variant spreads despite equal attractiveness, **Selectionism is vindicated** (differential transmission does work). If subjects reconstruct both variants into a third, more attractive form regardless of source/frequency, **Attraction Theory is vindicated** (transformation dominates).
  *   *Current Consensus:* Evidence suggests **both** occur. This implies neither pure position is tenable.

  **3. Viability of Current Positions**
  *   **The Selectionist:** Her position cannot be maintained in its **strong memetic form** (discrete, high-fidelity replicators). The "noisy transmission" concession undermines the idea of stable lineages required for complex adaptation. She must move toward a **Dual Inheritance** model where selection acts on continuous traits, not discrete memes.
  *   **The Attraction Theorist:** His position cannot be maintained in its **strong transformational form** (selection is unnecessary). Historical contingencies (path dependence) exist in culture; if attractors were all that mattered, cultural history would be identical across all lineages. It is not. He must admit that once variants exist, competition between them matters.

  **Final Adjudication:**
  The **Attraction Theorist wins the theoretical point** regarding the mechanism of transmission (it is largely reconstructive, not copying). However, the **Selectionist wins the explanatory point** regarding distribution (differential transmission still shapes frequencies even of reconstructed items). The debate is obsolete; the field has moved to hybrid models (Cultural Epidemiology + Dual Inheritance Theory) that incorporate both biased generation and differential propagation. Neither colleague is entirely right, but the Attraction Theorist has identified the more fundamental flaw in the "memetic" analogy.
