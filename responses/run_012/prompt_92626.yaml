      *   **Candidate Reading 3: The Epistemic Horizon (The Chosen Reading).**
          *   *Idea:* The film argues that in high-stakes coordination (avoiding war), the infinite regress required for common knowledge is practically impossible to sustain due to noise, delay, and human fallibility. The "jump" to common knowledge never happens; the system operates in the precarious zone of high-level mutual knowledge where errors cascade.
          *   *Refinement:* It's not just that they *don't* have common knowledge; it's that the *mechanisms* to establish it (communication, verification) are inherently flawed (Two Generals style). The Doomsday Machine is the ultimate attempt to bypass the epistemic problem by making the consequence physical rather than epistemic, but it fails because the *existence* of the machine couldn't be common knowledge in time.

      *   **Scene Analysis:**
