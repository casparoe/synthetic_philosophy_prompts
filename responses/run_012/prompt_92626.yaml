          *   *Plan R:* Shows delegation. The knowledge is fragmented. The President doesn't know the code; Ripper does. This breaks the "Common Knowledge of Authority."
          *   *The War Room Communications:* Constant static, dropped calls, verification failures. This is the physical instantiation of the "unreliable channel" in the Two Generals Problem.
          *   *The Ending (Nuclear Explosions + We'll Meet Again):* The payoff. When common knowledge fails, the catastrophic equilibrium is selected.

      *   **Addressing the "Rationality" Constraint:**
          *   Standard game theory assumes Common Knowledge of Rationality (CKR).
          *   The film suggests CKR is impossible because humans are irrational (Ripper) or systems are brittle.
          *   If CKR is unavailable, the Nash equilibria based on it are unstable. The film argues that relying on CKR for survival is insanity.

      *   **What the Film Adds:**
          *   Formal theory treats the "jump" as abstract. The film shows the *psychological and bureaucratic cost* of trying to bridge the gap. It adds *time* and *panic*. In formal models, time is often steps; in the film, time is fuel levels and decay. It shows that the "gap" between level $k$ and common knowledge is filled with human anxiety, which degrades the signal further.

  5.  **Refining the Argument (Self-Correction during drafting):**
