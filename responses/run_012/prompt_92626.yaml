      *   *Correction:* The user noted the Doomsday Machine reveal is technically Level 0 ignorance. I must concede this but pivot to why that matters for the *structure* of deterrence. Deterrence requires the *certainty* of retaliation to be common knowledge. The Machine makes retaliation certain, but the *knowledge of the Machine* was not common.
      *   *Key Distinction:* Mutual Knowledge allows for "I know, but I'm not sure you know that I know." In nuclear war, that sliver of doubt is enough to trigger a preemptive strike (security dilemma). The film shows that doubt is inevitable.

  6.  **Final Polish:**
      *   Ensure no dialogue quotes.
