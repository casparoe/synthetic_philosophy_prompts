prompt: |-
  I'm a third-year phil student taking a seminar on moral status (animals, AI, marginal cases, that sort of thing), and I'm definately out of my depth on something that came up in section.

  Two people got into it over a side remark about brain size, and I honestly couldnt tell who was right, so I'm outsourcing the refereeing.

  Dan: whatever makes a creature matter morally has to be some fact about it, and for anything with a mind that's a brain fact. But it can't be brain size — crows and parrots are tiny-brained and obviously smart, and within our own species size is a weak predictor of anything at best. So size isn't it.

  Mira: nobody said raw volume. But you can't dodge the physical side entirely — neurons, wiring, whatever. If you say the morally relevant thing is cognitive capacity and then insist no brain property is morally relevant, you've made the relevant property invisible to biology; that's just dualism in a lab coat.

  Dan: false dilemma. 'Capacity to suffer' or 'self-awareness' is a functional property. Brains realize it, but it isn't identical to any count or volume, and it doesn't inherit whatever moral relevance you want to give its realizer. Having more grams of brain isn't having more of a person.

  Mira: then draw the line. If capacity comes in degrees, and every way we have of measuring the degree is a brain measure, then refusing to let any brain measure count just means you're deciding by gut and calling it biology. And if it's a threshold — where is it, and why isn't it arbitrary?

  Dan: the threshold is whatever's needed to support the capacity. That's not arbitrary; it's like asking how many legs you need to be a table. Mira: that's the exact move I'm objecting to — 'whatever's needed to support the capacity' is a biological fact about the organism, so you're back to brains, and back to some brains counting for more.

  Can you referee? Give me exactly five numbered points, one per move in order — each a sentence or two, no intro and no wrap-up — rating each move from clearly wrong to clearly right and saying briefly why, and put your overall call on who's closer to right in the fifth point.
