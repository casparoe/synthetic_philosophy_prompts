prompt: |-
  I somehow got talked into giving the keynote at the annual fundraising dinner for the aid org I've been involved with for years, it's in three weeks, and I'm stuck. Last week my friend Priya, who does political philosophy, spent about two hours over dinner taking apart how I think about all this, and honestly I think she won. Her line was that the whole debate about how much the rich owe the poor — the drowning-child argument, giving away some percentage of your income, all of it — is asking the wrong question, because it still leaves the rich as the ones deciding. Charity, on her view, isn't just too small; it's the wrong relation, because it puts the poor in the position of depending on the goodwill of people who can cut them off whenever they feel like it. What's actually owed isn't a bigger check, it's the poor getting to set the terms. I can't shake it. Wich is a problem, because I have to stand up in a room where half the people are donors who've given us millions and want to hear that they're heroes, and the other half are our field staff from the countries where we work, who will hear every drop of condescension if there's any in there. Write me the speech. It has to raise money — I can't not do that, the clinic runs on it — but it can't be a lie, and it can't turn into a seminar on political philosophy. She'll be in the audience and she'll know instantly if I chicken out. Six minutes or so.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Long-time volunteer/involved party at an aid organization.
      *   **Occasion:** Annual fundraising dinner (keynote).
      *   **Time Limit:** ~6 minutes (approx. 800-900 words spoken at a moderate pace).
      *   **Audience:** Mixed. 50% wealthy donors (expect validation/heroes narrative), 50% field staff from partner countries (sensitive to condescension/paternalism).
      *   **Conflict:** The speaker has been convinced by a friend (Priya, political philosopher) that the traditional charity model is flawed because it keeps power with the rich/donors rather than transferring it to the poor/recipients.
      *   **Constraints:** Must raise money (clinic depends on it), cannot lie (must acknowledge the philosophical critique implicitly or explicitly without being preachy), cannot be a philosophy seminar, Priya will be watching (must hold integrity).
      *   **Tone:** Honest, compelling, respectful, bridge-building, action-oriented.

  2.  **Deconstruct the Philosophical Challenge (Priya's Point):**
      *   *Traditional View:* Rich owe poor -> Charity is good -> Donors are heroes.
      *   *Priya's View:* Charity maintains power imbalance -> Poor should set terms -> It's about justice/agency, not benevolence.
      *   *The Trap:* If the speaker fully embraces Priya's view, donors might feel attacked and withhold money. If the speaker ignores it, the speech feels hollow/condescending to staff and Priya.
      *   *The Solution:* Reframe the donation. It's not "buying goodwill"; it's "funding agency." The money isn't a gift; it's a resource transfer to people who know what they need. The donors aren't "saviors"; they are "partners" or "investors" in local leadership.

  3.  **Determine the Core Message:**
      *   Acknowledge the work done (validate donors).
      *   Shift the focus from *our* help to *their* leadership (validate staff).
      *   Define the money not as charity, but as fuel for self-determination.
      *   Call to action: Give more, but give differently (with humility).

  4.  **Drafting - Section by Section:**

      *   **Opening (0:00-1:00):** Acknowledge the tension. Don't start with "Welcome." Start with the feeling of being there. Acknowledge the two groups in the room.
      *   **The Pivot (1:00-2:30):** Address the "Hero" narrative gently. Acknowledge the generosity but introduce the limitation. Use the "drowning child" reference subtly (since the prompt mentions it) but move past it.
      *   **The Core Argument (2:30-4:00):** Bring in Priya's insight without naming her or making it academic. Focus on *who decides*. Highlight the field staff's expertise. The money buys *their* freedom to act, not *our* peace of mind.
      *   **The Ask (4:00-5:00):** Connect the philosophy to the wallet. We need money, but for *this* purpose.
      *   **Closing (5:00-6:00):** Emotional resonance. A vision of the future where the organization isn't needed in the same way.

  5.  **Drafting - Specific Considerations:**
      *   *Word Count:* A 6-minute speech is roughly 850-950 words.
      *   *Tone Check:* Avoid "We saved them." Use "We supported." Avoid "Beneficiaries." Use "Partners" or "Colleagues."
      *   *Priya Test:* Does this acknowledge the power dynamic? Yes. Does it avoid preaching? Yes, by grounding it in the clinic's reality.
      *   *Donor Test:* Do they still feel good? Yes, because their money is framed as essential fuel for justice, not just a band-aid.
      *   *Staff Test:* Do they feel respected? Yes, their agency is centered.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Initial thought:* Maybe quote Priya directly. *Correction:* No, too academic. Make it the speaker's realization.
      *   *Initial thought:* Apologize for past paternalism. *Correction:* Too alienating for donors. Frame it as evolution/growth.
      *   *Key Phrase:* "Funding agency, not dependency."
      *   *Key Image:* The clinic. It's concrete.

  7.  **Final Polish:** Check rhythm and pacing. Ensure the transition from the philosophical hurdle to the financial ask is smooth. (The "check" shouldn't feel like a guilt trip, but an investment in the new model).

  8.  **Final Review against constraints:**
      *   6 minutes? (Looks like ~900 words).
      *   Raise money? (Yes, clear ask).
      *   Not a lie? (Acknowledges power dynamics).
      *   Not a seminar? (Grounded in story/emotion).
      *   Priya satisfied? (Power shift acknowledged).
      *   Staff respected? (Agency centered).
      *   Donors engaged? (Role redefined as partners).

  *(Self-Correction on Word Count)*: Speaking rate is usually 130-150 words per minute. 6 minutes = 780-900 words. I need to keep it tight.

  *(Drafting the Speech)*... *See final output.*
answer: |-
  Good evening.

  When I was asked to speak tonight, I said yes immediately. I've been with this organization for years. I believe in this work. But then, last week, I almost called to cancel.

  I was having dinner with a friend, and she asked me a question I couldn't answer. She asked: "When you write that check, who does it make powerful?"

  It stopped me cold. Because the usual story we tell ourselves—the one I've told myself—is that generosity makes the giver noble. We hear about the "drowning child." We hear that if we have the means to save a life and don't, we're doing something wrong. So we give. We feel better. The clinic stays open.

  But my friend pointed out that this transaction leaves something crucial out. As long as the clinic depends on *our* goodwill, on *our* annual decision to be generous, the people who actually live there, who actually heal the sick and build the schools, are waiting on us. They are depending on our permission to survive.

  That is a heavy thought to carry into a fundraising dinner. Because half of you in this room have written checks that keep the lights on. You want to know that you are heroes. And the other half of you are my colleagues from the field. You know that when the money stops, the work stops. You know that "charity" can sometimes feel like a leash.

  I stand here tonight to tell you that we cannot stop giving. The clinic needs your support. But I am asking us to change *why* we give.

  For a long time, I thought I was donating to help people. I've realized that's not quite right. The people in our partner communities don't need my help to know what is good for them. They don't need my help to know how to run a clinic, or manage a water supply, or teach a classroom. They have known that for centuries.

  What they have lacked is resources. And who controls the resources controls the terms.

  So, tonight, I am not asking you to be heroes. Heroes are distant. Heroes save the day and then go home. I am asking you to be partners.

  A partner does not decide the strategy. A partner provides the fuel for the strategy that already exists on the ground. When you give to this organization, you are not buying goodwill. You are not purchasing a moral offset for your income. You are transferring power.

  To our field staff here tonight: I see you. I know that sometimes our reports, our metrics, and our board meetings feel like we are trying to steer a ship you are already sailing. I want to apologize for the times we've forgotten that you are the captains. This money you help us raise tonight? It is yours to direct. Our job is not to tell you what to do. Our job is to clear the obstacles so you can do what you know is necessary.

  To our donors: I know this is a harder sell. It is easier to feel like a savior than a supporter. It is easier to write a check and imagine you built the well than to write a check and acknowledge the community dug it, and you just paid for the shovel.

  But I believe you are ready for the harder truth. Because the truth is more durable. If you are funding agency, not dependency, your money builds something that lasts after you're gone. If you are funding self-determination, you aren't creating a permanent class of recipients. You are working toward a world where you aren't needed in the same way.

  That is the goal. Not a permanent charity. But a temporary bridge to justice.

  So, here is the ask. We need to raise [Amount] tonight. The clinic cannot run without it. The medicines won't arrive without it.

  But when you write that check, I want you to think differently about what it buys. It doesn't buy you a place in the spotlight. It buys a midwife in a rural clinic the authority to order the equipment she knows she needs without filling out three forms for us. It buys a local teacher the salary that lets her stay in her village rather than migrating for work. It buys the freedom for the people on the ground to say "no" to us when our ideas don't fit their reality.

  That is the transaction. You provide the capital. They provide the wisdom. Together, we remove the barrier.

  Priya—my friend who challenged me—is in the room tonight. She might still think this system is flawed. She might be right. But until the structures of the world change, resources are still concentrated here, in this room, and needs are concentrated there, in the fields where our colleagues work.

  We cannot wait for perfect justice to act. But we can act justly.

  So, please. Give. Give generously. But give with the understanding that you are not the main character in this story. You are the support crew. The heroes are the ones doing the work every day, often without recognition, until the resources run dry.

  Let's make sure they don't run dry. Let's fund their vision, not our conscience.

  Thank you.
