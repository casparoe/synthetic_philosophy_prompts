          *   **Specific Objection:** The "Cumulative Culture/Ratchet Effect" objection (Tomasello/Tennie). High fidelity is needed for ratcheting; Sperber says copying is lossy/reconstructive. Is this a fair hit against Sperber?
      *   **Style:** British English (analyse, behaviour, etc.), academic tone suitable for a 3rd-year undergrad, no references/bibliography needed.
      *   **Goal:** A model answer to work from, not just generic advice.

  2.  **Deconstruct the Theories:**
      *   **Dawkins (Meme Theory):** Analogy to genes. Cultural items are replicators. Success depends on fecundity, longevity, and *copying fidelity*. Variation is random (mutation); selection filters. Stability = high-fidelity replication.
      *   **Sperber (Cultural Attraction Theory - CAT):** Cultural items are not replicators but representations. Transmission is not copying but *reconstruction* (inferential communication). Stability isn't due to faithful copying but due to *attractors* (cognitive biases) that pull transformed variations back to a stable form. Stability = convergence via transformation.

  3.  **Address the "Rivals vs. Compatible" Question:**
      *   Superficially, they look like rivals (Replication vs. Reconstruction).
      *   Deep down, they might be compatible if memes are seen as the *outcome* rather than the *mechanism*. However, the prompt asks to test which *earns its keep* as an explanation.
      *   *Decision:* I will argue they are fundamentally different explanatory frameworks. Dawkins explains stability via mechanism (copying); Sperber explains stability via content (attractors). Sperber is more fundamental for *why* certain forms persist, while Dawkins describes the *pattern* of persistence.

  4.  **Select the Case Study:**
      *   User suggested playground rhymes/jokes. This is excellent.
