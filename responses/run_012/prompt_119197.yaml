answer: |-
  1. **Setup and Materials**
  Prepare 18 "Underwriter Packets," each containing: a "Licence Card" (rules: initial any line where payout risk <3%, sign humility clause to activate licence), a "Ledger Sheet" (60 numbered lines reading "Policy #n will not pay out"), an "Audit Form" (single line: "I stand by every file in this book"), and a sealed envelope with 5 chocolate coins. Arrange desks in rows; you sit at the front as "Chief Regulator." Project the public fact: "Exactly one policy in this room will pay out this quarter." Distribute packets; tell students the coins are theirs to keep unless penalties apply.

  2. **Rules that do the Forcing**
  Enforce three constraints without explanation: (1) Compliance: You must initial every ledger line meeting the 33:1 safety threshold (59/60 chance = 98.3% safe, so all 60 must be initialled); (2) Humility: You must sign the clause "Somewhere in my book there is a file I got wrong" to validate the licence (required by regulator); (3) Audit: You must sign the Audit Form to cash out your coins (required by company). Penalty for refusal is immediate confiscation of coins and exclusion from Round 2. The math forces them to initial all 60 lines (credible individually) while signing that one is wrong (collectively certain), then sign that all are right (audit requirement).

  3. **The Twist**
  Round 1 ends when Audit Forms are collected; do not reveal the contradiction yet. Immediately distribute Round 2 "Analyst Reports": 60 findings, each backed by independent tests with 97% reliability. The rule is "Sign off on each finding you accept." There is no public fact that one *must* be wrong, but the aggregate probability of error is ~84% (1 - 0.97^60). They must decide whether to sign off on each finding individually (meeting the threshold) or refuse because the conjunction is likely false. Collect forms; only now allow discussion.

  4. **The Debrief**
  Draw the triangle on the board: Credence (probability), Acceptance (binary signature), and Closure (consistency across conjunctions). Map their signatures to the Threshold View of belief (belief = credence > 97%). Show how Lottery (Round 1) and Preface (Round 2) both break Conjunctive Closure (believing each P does not entail believing all Ps). Outline escape routes they implicitly took: Reject Closure (accept inconsistency), Raise Threshold to 100% (skepticism/refusal), or Contextualize Standards (claiming rules changed between lines). Ask each group what cost they paid for their escape.

  5. **What Breaks**
  If a student blurts "Lottery Paradox," acknowledge the term but insist they describe the *pressure* they felt signing rather than the theory. If a student refuses to sign, treat them as a case study for the "Price of Skepticism" (they lost coins to save logic). If a student claims "The licence is badly written," validate this as the Contextualist escape (standards shift between humility and audit) and ask why the regulator forced the shift. Admit the limitation: the game forces *assertion* for coins, not genuine *belief*; you must supply the bridge by asking, "Did signing feel like lying, or just compliance?"
