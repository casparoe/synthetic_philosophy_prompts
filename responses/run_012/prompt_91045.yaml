answer: |-
  This is a classic instance of the **Representation Wars**, a debate that has cycled through cognitive science, neuroscience, and now ML interpretability for decades. You are correct: the disagreement is not primarily empirical. You have the same tensors, the same loss curves, and the same probe accuracies.

  The dispute is a hybrid of **verbal ambiguity** (definitions), **substantive ontology** (what the model *is*), and **pragmatic goals** (what you want to *do* with the model).

  Here is a diagnosis of the structure, an evaluation of your proposed distinction, and a concrete path to progress.

  ### 1. Diagnosis: Three Layers of Disagreement

  Your team is arguing past each other because they are operating at different layers of abstraction.

  **Layer 1: The Verbal Dispute (Definitions)**
  *   **Camp A (The Functionalists):** They define "representation" as **information that is linearly decodable and causally efficacious.** To them, if a vector direction correlates with a concept and moving it changes the output, it is a representation. This is the *Linear Representation Hypothesis*.
  *   **Camp B (The Mechanists):** They define "representation" as **a variable explicitly used by the model's algorithm.** They worry about "latent leakage"—where information is present in the activations (recoverable) but is merely a byproduct of the computation, not a variable the model actually computes *with*.
  *   **Verdict:** This is verbal. They are using the same word for two different mathematical properties.

  **Layer 2: The Substantive Dispute (Ontology)**
  *   **Camp A** believes the model's ontology is **continuous/vector-based.** Representations are emergent properties of the geometry.
  *   **Camp B** believes the model's ontology should be **discrete/algorithmic.** They are looking for circuits, loops, and variable assignments akin to traditional code. They suspect Camp A is mistaking *correlation* for *mechanism*.
  *   **Verdict:** This is substantive. It determines whether you think you can safely "edit" a model (Camp A) or whether you need to rewrite its "code" (Camp B).

  **Layer 3: The Pragmatic Dispute (Goals)**
  *   **Camp A** wants **control.** They want to steer, debug, and compress. For this, recoverability + causal leverage is sufficient.
  *   **Camp B** wants **guarantees.** They are likely worried about safety, deception, or robustness. For this, knowing *how* the model uses the information is critical. A probe might detect "deceptiveness," but if the model doesn't represent it as a discrete variable, steering it might not prevent deception.
  *   **Verdict:** This is the most important layer. The argument persists because they haven't agreed on *why* they care.

  ### 2. Evaluating Your Proposed Distinction

  Your suggestion to distinguish between **Recoverable**, **Used**, and **Explicitly Represented** is excellent. In philosophy of mind, this maps closely to the distinction between *information*, *function*, and *syntax*.

  **Will it dissolve the impasse?**
  It will **relocate** it, which is progress.
  *   **Recoverable:** Camp A wins here easily (probes work). Camp B concedes this but calls it "latent information," not representation.
  *   **Used:** This is the battleground. Camp A says ablation proves use. Camp B argues ablation is a "lesion study"—breaking a wire doesn't prove the wire carried a specific signal, only that the circuit broke.
  *   **Explicitly Represented:** Camp B wins here by default because they set the bar so high (essentially asking for symbolic AI inside a neural net). Camp A will argue this is a category error for connectionist systems.

  **The Risk:** If you adopt these three terms, Camp B will simply retreat to the third definition ("It's not *Explicitly Represented*") and claim victory, while Camp A stays at the second ("It's *Used*, that's all that matters").

  ### 3. What Counts as Progress?

  You asked if progress requires a formal result, a new paradigm, or stopping the question. Here is the ranking:

  **1. A Decision to Stop Asking "Is it Real?" (Highest Value)**
  The question "Does the model *really* have a representation?" is a metaphysical trap. It implies there is a ground truth about the model's "mind" independent of your interaction with it.
  *   **The Shift:** Move from **Realism** (Does it exist?) to **Instrumentalism** (Is this abstraction leaky?).
  *   **Action:** Agree that "representation" is a tool for *you*, not a property of *it*. The metric is not truth, but **stability**.
  *   **Test:** Does the "representation" hold across different model seeds, architectures, and out-of-distribution inputs? If the linear direction for "truthfulness" rotates randomly between seeds, it's not a robust representation, regardless of probe accuracy.

  **2. A New Experimental Paradigm: Causal Mediation**
  Current ablation (Camp A's evidence) is too blunt. Current probing (Camp A's other evidence) is too correlational.
  *   **The Solution:** **Causal Mediation Analysis.** Instead of just ablating, you trace the *flow* of information. You show that specific information passes through a specific subspace *at a specific time* to affect a specific output.
  *   **Why it helps:** It addresses Camp B's concern about "unused information." If you can show the information flows through the vector to the output, it is functionally "used." This bridges the gap between Recoverable and Used.

  **3. A Formal Result (Lowest Value)**
  You will not solve this with a theorem. You can prove capacity bounds or expressivity, but you cannot prove "meaning" or "representation" formally without defining those terms first (which returns you to the verbal dispute).

  ### 4. Recommended Protocol for Your Team

  To break the cycle, propose the following **Operational Truce**:

  1.  **Adopt the Three-Tier Taxonomy:** Formalize your distinction.
      *   *Level 1 (Encoded):* Information is linearly decodable.
      *   *Level 2 (Causal):* Intervening on this subspace changes behavior predictably.
      *   *Level 3 (Mechanistic):* We can trace the algorithmic path showing the model computes *using* this subspace.
  2.  **Tag Claims by Level:** No one is allowed to say "The model represents X." They must say "We have Level 2 evidence for X."
  3.  **Define the Goal:**
      *   If the goal is **Steering/Editing**, Level 2 is sufficient. Camp A leads.
      *   If the goal is **Safety/Audit**, Level 3 is required. Camp B leads.
  4.  **The "Generalization" Tie-Breaker:** When in doubt, test **Out-of-Distribution (OOD) Stability**.
      *   If a "representation" only works on the training distribution, Camp B is right (it's overfitting/artifact).
      *   If it generalizes to new tasks/architectures, Camp A is right (it's a robust feature).

  ### Summary
  The impasse is verbal (definitions) masked as substantive (evidence). Your distinction is the right tool to untangle it, but only if you tie each level to a specific **engineering goal**.

  Stop trying to prove the model has a "mind." Start trying to prove your abstractions are **stable enough to build on.** If the "representation" breaks when you change the random seed, it doesn't matter if it's "real"—it's useless infrastructure. Make *robustness* the criterion, not *ontology*.
