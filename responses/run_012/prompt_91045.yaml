      *   *Camp A* is operating under a **Functionalist/Structural Realist** view. If it walks like a representation and quacks like a representation, it is one. They care about *utility* and *structure*.
      *   *Camp B* is operating under a **Causal/Mechanistic Realist** view (or strict Instrumentalism). They demand proof that the *system itself* treats this vector as a semantic unit, not just that *we* can treat it as such. They worry about "latent leakage" or "accidental correlations."
