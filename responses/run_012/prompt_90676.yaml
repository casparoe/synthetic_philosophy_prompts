answer: |-
  Here is a menu of precise interpretations of the maxim "you can't be worse off with more information," arranged from the trivially true to the substantively false. You can bring this list directly to your reading group.

  ### The Menu of Claims

  **1. The Optionality Claim (The "Throw It Away" Thesis)**
  *   **The Claim:** An agent who receives information can never be *forced* to use it; they retain the option to act exactly as they would have without it.
  *   **Verdict:** **True, but nearly empty.**
  *   **Assumptions:** Requires only that the agent has the physical/mental capacity to disregard the signal.
  *   **Distinction:** This is about *capacity*, not value. It establishes that information expands the choice set (act on $E$ or act on $\emptyset$), but says nothing about whether the agent *should* look.

  **2. The Ex-Ante Expected Utility Claim (Good's Theorem Proper)**
  *   **The Claim:** For a Bayesian Expected Utility maximizer, the *expected* utility calculated *before* seeing the information (under the prior) is at least as high if they commit to seeing it as if they commit to ignoring it.
  *   **Verdict:** **True.**
  *   **Assumptions:** Agent maximizes EU; information is costless; preferences ($U$) are fixed; likelihoods are known; standard causality (actions cause outcomes, info does not).
  *   **Distinction:** **Ex-Ante vs. Ex-Post.** This holds for the expectation *before* the envelope is opened, not the feeling *after*. It relies on the ability to average over possible signals, some of which may be unpleasant.

  **3. The Gross Value Claim (Willingness to Pay)**
  *   **The Claim:** A rational agent should be willing to pay any positive price $\epsilon$ for information, provided the price is less than the Expected Value of Information (EVOI).
  *   **Verdict:** **True (with caveats).**
  *   **Assumptions:** Same as #2, but acknowledges information may have a cost.
  *   **Distinction:** **Value vs. Obligation.** This licenses a *willingness* to acquire info if offered, but does not mandate seeking it if there is *any* cost (even attention cost). It shifts the claim from "you can't be worse off" to "you can't be worse off *net of cost* if cost < EVOI."

  **4. The Ex-Post Realization Claim (The "Bad News" Thesis)**
  *   **The Claim:** After receiving information, the agent's *actual* realized utility will be higher than it would have been had they remained ignorant.
  *   **Verdict:** **False.**
  *   **Assumptions:** None that save it.
  *   **Distinction:** **Ex-Ante vs. Ex-Post.** Learning you have a terminal illness reduces your realized welfare (via distress or constrained options) compared to a world where you remained happily ignorant, even if knowing allowed you to make better medical plans. Good's Theorem averages over the risk of bad news; it does not eliminate the pain of it.

  **5. The Preference-Invariance Claim (The Hedonic Thesis)**
  *   **The Claim:** Receiving information updates only beliefs (probabilities), never the utility function itself (preferences or emotional state).
  *   **Verdict:** **False (in general human contexts).**
  *   **Assumptions:** Requires that $U(outcome, info) = U(outcome)$.
  *   **Distinction:** **Beliefs vs. Preferences.** In your colleague's examples (genetic risk, behavioral forecasts), the information often enters the utility function directly (e.g., anxiety, loss of hope, "spoilers"). If $U$ changes upon learning, Good's Theorem does not apply.

  **6. The Causal-Independence Claim (The Newcomb Thesis)**
  *   **The Claim:** The information is statistically correlated with the world but does not causally influence the outcome *except* through the agent's subsequent choice.
  *   **Verdict:** **False (in predictive self-knowledge cases).**
  *   **Assumptions:** Requires Causal Decision Theory (CDT) and no "logical" or "acausal" correlations between the signal and the state.
  *   **Distinction:** **Future Choice Correlation.** If the information is a *forecast* of the agent's behavior (e.g., "You will panic"), the act of learning it may alter the behavior, falsifying the forecast, or the forecast may be based on a predictor who penalizes those who look. In Newcomb-like problems or Functional Decision Theory contexts, free information can have negative expected value.

  **7. The Strong Rationality Claim (The Obligation Thesis)**
  *   **The Claim:** Because information has non-negative expected value, refusing to acquire free information is strictly irrational.
  *   **Verdict:** **False (Overreach).**
  *   **Assumptions:** Requires #1 through #6 to all hold simultaneously, plus that "rationality" is defined solely by ex-ante EU maximization with no competing normative constraints (e.g., right to not know, psychological integrity).
  *   **Distinction:** **Permission vs. Obligation.** Good's Theorem proves you *may* look (it is permissible), not that you *must* (it is obligatory), especially if there are meta-preferences against looking.

  ***

  ### Diagnosis of Your Colleague's Argument

  **1. Which reading does his conclusion require?**
  To sustain the conclusion that "refusing to learn is straightforwardly irrational," your colleague requires **Reading #7 (The Strong Rationality Claim)**, which implicitly relies on the truth of **Reading #2 (Ex-Ante EU)**, **Reading #3 (Costless)**, **Reading #5 (Preference-Invariance)**, and **Reading #6 (Causal-Independence)**.

  **2. Is that reading true, and does it license the conclusion?**
  The core theorem (Reading #2) is **true** within standard Bayesian Causal Decision Theory. However, it **does not license the conclusion** that refusal is irrational in the real-world cases he cites.
  *   **Why?** Because his examples (genetic risk, behavioral forecasts) violate Reading #5 and #6.
      *   **Violation of #5:** Genetic risk scores often carry direct disutility (distress) independent of any action taken. This is a cost, making the info not "free."
      *   **Violation of #6:** A forecast of one's own behavior creates a feedback loop. If the forecast says "You will defect," and you learn it, you might cooperate to prove it wrong. If the forecast is infallible, you cannot change, rendering the info useless for decision-making. If the forecast comes from a source that punishes "lookers" (a Newcomb Predictor), the info has negative value.
  *   **Result:** At best, the theorem licenses a claim about **willingness to pay** (Reading #3): *If* the info were purely decision-relevant, hedonically neutral, and causally inert, a rational agent would pay up to $0 to acquire it. It does not prove that a human who values their peace of mind (Reading #5) or fears self-fulfilling prophecies (Reading #6) is irrational for declining.

  **3. Under which reading could refusing be rational?**
  Refusing information is rational under **Reading #5 (Preference-Invariance Failure)** or **Reading #6 (Causal-Independence Failure)**.
  *   **Case A (Hedonic Cost):** If learning the fact causes direct suffering (e.g., knowing the date of your death), and that suffering outweighs the instrumental benefit of planning, refusing is rational.
  *   **Case B (Newcomb/Predictive):** If the information is a prediction of your choice from a reliable predictor, acquiring it can break the correlation that makes your decision effective, or signal to the predictor that you are the type of agent who cannot resist looking (which might be penalized).

  **4. What would the theorem have to assume to rule out rational refusal?**
  To rule out rational refusal in these specific cases, the theorem would have to assume:
  1.  **Hedonic Neutrality:** The information has no direct entry into the utility function (no anxiety, no loss of hope).
  2.  **Causal Inertness:** The information is not a *cause* or *logical consequence* of the state it predicts in a way that bypasses the agent's choice (i.e., no Newcomb/Parfit scenarios).
  3.  **Meta-Preference Alignment:** The agent has no higher-order preference for ignorance (e.g., valuing "surprise" or "self-determination" over optimization).

  If your colleague insists the maxim is a universal theorem, ask him to formalize the utility function for a agent who receives a "You will die in 5 years" signal. If $U$ includes a term for $-\text{Anxiety}(\text{Signal})$, the theorem's inequality breaks. If he excludes that term, he has defined away the phenomenon your group is discussing.
