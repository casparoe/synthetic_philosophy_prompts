      *   *8. The Normative Obligation Claim:* You *must* look. (False - only if free and no other constraints).

      *Let's align closer to the prompt's specific distinctions for the final list.*

      *   *Item 1: Ex-Ante vs Ex-Post.* (The "Bad News" distinction).
