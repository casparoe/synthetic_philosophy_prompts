      *   *Rational Refusal:* Reading 4 (Newcomb/Predictive). If the forecast determines the outcome (e.g., "You will panic" causes you to panic, or a Predictor penalizes those who look), refusing is rational. Or Reading 3 (Hedonic cost).
      *   *Assumption to rule out refusal:* Must assume info has no direct disutility and no causal impact on the state other than via action.

  6.  **Refining the Output Structure:**
