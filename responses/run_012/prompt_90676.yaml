      *   *Reading 2: The Ex-Post Reality Check.* Does it hold for *realized* utility? No. Bad news hurts. Need to distinguish ex-ante vs. ex-post.
      *   *Reading 3: Costly Information.* If info costs money/effort, you can be worse off. The theorem applies to *gross* value, not net.
      *   *Reading 4: Preference Change.* If learning changes what you want (e.g., adaptive preferences, horror), EU might drop. Good's theorem assumes fixed $U$.
      *   *Reading 5: Computational Bounds.* If processing info takes time/energy or leads to paralysis, bounded agents might be worse off.
      *   *Reading 6: Causal/Decision-Theoretic Pathologies (Newcomb/Parfit).* If the info is correlated with your choice in a way that affects the payoff (e.g., Predictor scenarios), learning might force a suboptimal move or reveal you are doomed. This is crucial for the "predictive fact about themselves" context.
      *   *Reading 7: Obligation vs. Permission.* Good's theorem says value $\ge 0$. It doesn't strictly say you *must* acquire it if there's *any* cost, or if there are competing obligations. It says you should be willing to pay up to the EVOI.
      *   *Reading 8: Reputation/Social Effects.* If others know you looked (or didn't look), payoffs change. Info isn't private.

