prompt: |-
  ok, longtime lurker on the rationalist blogs (SSC, ACX, the whole extended universe) with a question I can't shake since I read a pop-archaeology book this summer.

  my buddy took one archaelogy course and is now extremely confident that archaeology is basically forensics. the dig is the crime scene, the archaeologist is the detective, the artifacts are the evidence, the site report is the verdict. he runs this to say we can basically read belief straight off the stuff: grave goods with food and weapons mean they believed in an afterlife, a big fancy building with no domestic rubbish means it was a temple so they had religion, a burnt destruction layer means raiders. his line is that if it's a crime scene then the evidence is right there and the only open question is how good the detective is. and this isn't just him, it's the same move in every museum placard and pop-science piece I've ever read, so I assume it's doing real work for people.

  I think the analogy is carrying way more weight than he realizes but I can't say where it buckles. so: audit it. what maps onto what (a table is fine), where the mapping breaks, and of the breaks, which ones actually threaten the specific claims he wants to make about beliefs and institutions vs which ones are just nitpicks. say which features of the crime-scene picture he's quietly importing that the archaeological case doesn't have -- I suspect there's something about what kind of thing a "scene" even is, and about whether anyone left testimony, and about whether the traces were meant as traces -- and whether his conclusion survives once all that's on the table. if a seperate analogy does the job better (I've heard the record called a palimpsest, a garbage dump, a text in a language you only half know, a fossil record), say which and why.

  bottom line in your first sentence, then the reasoning, no warm-up. I don't need citations or a reading list, just the argument. and tell me how confident you actually are in the mapping as opposed to the verdict -- if this is one of those cases where the framing is confused (e.g. "archaeology" is too many different practices for one analogy to be the subject of, or "belief" isn't the kind of thing that maps onto physical evidence at all), don't humour me, just say so.
