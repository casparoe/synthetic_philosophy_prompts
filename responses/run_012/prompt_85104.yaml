          *   **The "Crime":** Forensics = specific event violating known laws. Archaeology = "normal" life vs. "event" (fire, burial).
          *   **Meaning/Belief:** Forensics = motive (psychological state inferred from action). Archaeology = belief (cultural state inferred from pattern).
          *   **Completeness:** Forensics = mostly complete scene (mostly). Archaeology = heavily fragmented (taphonomy).

  3.  **Evaluate the Friend's Specific Claims:**
      *   *Claim:* "Read belief straight off the stuff."
      *   *Problem:* Material culture is multivocal. A weapon in a grave could be status, not afterlife utility. A fancy building could be a palace, not a temple. A burn layer could be accident, not raiders.
      *   *Forensic Counter:* Even in forensics, you can't read "motive" straight off a bullet. You need context, psychology, confession. But forensics has the advantage of known laws and recent memory. Archaeology lacks the "law" (cultural rules) and the "memory."
