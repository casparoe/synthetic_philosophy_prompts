  4.  **Identify the Critical Breaks:**
      *   **Taphonomy:** The site isn't a frozen moment; it's a compressed palimpsest. Forensics tries to freeze the scene; Archaeology digs through layers of disturbance.
      *   **Equifinality:** Different processes produce the same result (burn layer = raid OR accident OR ritual). Forensics has equifinality too, but fewer variables over shorter time.
      *   **The "Text" Problem:** Artifacts aren't statements. They are residues. Reading belief requires a translation key (ethnography, texts) which is usually missing.
