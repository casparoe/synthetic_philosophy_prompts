  What the passage says
  Beccaria posits torture as a flawed ordeal where physical resilience dictates justice, not innocence. Consequently, the innocent suffer whilst the robust guilty escape. He argues this method is disguised as a search for truth, yet essentially functions merely as a test of stamina. He then pivots to the magistrate's motive. He claims inflicting pain during trial, before conviction, is a punishment devised by cowards. These authorities wish to appear severe and extract confessions without the fortitude required to pass a definitive sentence. They seek the utility of punishment without the moral responsibility of judgement, hiding behind procedure rather than standing by the law's clear dictates. It allows the state to inflict suffering while pretending it is not yet punishing.

  The missing step
  The logical bridge lies in the nature of judicial responsibility. If torture yields no truth, its only function is inflicting pain. A courageous magistrate accepts the risk of judgement: either convict based on evidence or acquit. Torture allows the judge to bypass this binary choice. By tormenting the accused, the judge inflicts severe pain without formally declaring guilt. This is cowardice because it avoids the accountability of a wrongful conviction. If the man dies under torture, he wasn't technically punished by sentence; if he confesses, the judge can claim he merely extracted truth. It shields the authority from the consequences of error, allowing them to wield power without owning the moral weight of its execution. It reflects a fear of uncertainty; the judge cannot bear to let a suspect go free, so he torments him instead of making a hard decision. It conflates investigation with sentencing, punishing a man before he is proven guilty, because the judge lacks courage to admit ignorance. This ambiguity protects the state from scrutiny.

  Why cowards?
  Beccaria labels them cowards because torture targets a man who is physically restrained and legally vulnerable. It is easy to torment someone who cannot fight back. A truly brave society would confront crime through clear laws and open evidence, risking the acquittal of the guilty rather than harming the innocent. The coward prefers the safety of ambiguity. He desires the appearance of toughness—extracting a confession—without the courage to enforce the law consistently. It is ultimately the violence of the bully against the bound, rather than the justice of the sovereign against the citizen. The judge hides behind the rack to avoid the scrutiny that comes with a public verdict.

  Ticking time bomb connection
  The contexts differ but the ethical core resonates. Beccaria critiques judicial torture used to prove past guilt, whereas the ticking time bomb scenario justifies interrogational torture to prevent future harm. However, Beccaria's insight regarding cowardice remains indeed relevant. In both cases, the state inflicts pain on a captive who cannot resist. The modern debate often sidesteps the reliability issue Beccaria raised, assuming information can be gained. Yet, the 'cowardice' argument persists: is it morally easier to torture a detainee than to do the hard intelligence work required to find the bomb without violating human rights? Both scenarios rely on the state overriding rights due to fear, rather than adhering to principle despite risk.

  My verdict
  Beccaria's argument remains truly potent. He exposes torture not just as ineffective, but as a moral failing of the state. It shifts the focus from the victim's pain to the perpetrator's character. This reframing challenges the utilitarian defence of torture. If the practice stems from cowardice and irresponsibility rather than necessity, it loses its legitimacy. His analysis reminds us that legal procedures reflect the virtues or vices of those who wield them.
