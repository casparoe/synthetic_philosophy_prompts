answer: |-
  ### Deliverable 1: Student-Facing Exam Question

  **UNIVERSITY EXAMINATION PAPER**
  **Module:** PHI404 Thought Experiments and Philosophical Method
  **Time Allowed:** 90 Minutes
  **Conditions:** Closed Book. No library or internet access.

  **INSTRUCTIONS**
  Read the Specimen and the Working Vocabulary carefully. Answer the question below using *only* the provided materials and your general analytic competence. Do not attribute any position to external authors or theories.

  **SPECIMEN: TWO ROOMS**
  In the first, a surveyor sits at a bare table. She has charted an island's coast for thirty years and carries no map: asked to draw the coastline she draws it, inlet for inlet; shown an official chart with a misplaced headland she catches it; set down in fog in a small boat she brings it to the one safe harbour. In the second room there is no surveyor and no furniture. Walls, floor, and ceiling carry the same coastline at the same scale and in the same detail; every feature the surveyor can reproduce is inscribed somewhere in the room, and nothing is inscribed that she cannot reproduce. The two rooms therefore contain the same information about the coast. Yet the second room knows nothing. The ink has no idea where the harbour is, and would have no idea if every wall were repainted in the dark. So the information cannot be what the surveyor has and the room lacks. Whatever she has — call it understanding — is not information; and no arrangement of information, however complete, will add up to it.

  **WORKING VOCABULARY**
  *   **Engine:** The concrete feature of a case that generates its intuitive pull.
  *   **Payload:** The conclusion the case is advertised as supporting.
  *   **Description Asymmetry:** A case's habit of describing one arm of a comparison in the vocabulary of mechanism and the other in the vocabulary of experience, so that the reader is invited to compare something described as inert with something described as alive.
  *   **Residue:** Whatever intuitive pull survives once the case has been rewritten in a single vocabulary throughout.

  **QUESTION**
  Analyse the argument presented in the Specimen. Identify its **Engine** and **Payload**. Investigate whether the argument relies on a **Description Asymmetry** by performing a translation of the case into a single vocabulary. Assess the **Residue** of the intuition following this translation. Finally, construct a **Counter-Pump** and explain what its existence implies for the original **Payload**.

  ***

  ### Deliverable 2: Model Answer

  The Specimen's **Engine** is the stark visual contrast between a skilled agent navigating fog and static ink drying on a wall. This contrast generates the immediate intuition that the surveyor possesses something the room lacks. The **Payload** is the claim that understanding is distinct from information, and that no quantity of information constitutes understanding. The argument relies on the premise that because the room (information) lacks understanding, and the surveyor possesses both information and understanding, the latter cannot be reduced to the former.

  However, the case exhibits a strong **Description Asymmetry**. The surveyor is described using the vocabulary of experience and agency: she "catches" errors, "brings" the boat to harbour, and "knows." The room is described using the vocabulary of inert mechanism: ink is "inscribed," walls are "repainted," and features are merely "carried." We are invited to compare a living success-condition with a dead physical object. To test the strength of the **Payload**, we must rewrite the case in a single vocabulary.

  Let us translate the surveyor into the vocabulary of mechanism. The surveyor is a biological system. Her thirty years of charting are physical traces encoded in neural structures. When fog occurs, sensory inputs trigger motor outputs based on these physical traces. She is a mechanism processing data to produce navigation. Now compare this to the room. The room is a architectural system. The ink is physical traces encoded on plaster. If we add sensors to the room that detect fog and trigger a light pointing to the harbour based on the ink's data, the room processes data to produce navigation. Described uniformly as data-processing systems, the distinction blurs. The surveyor is wet ware; the room is hard ware. Both hold the same map; both can be set up to output the same harbour coordinates.

  Does any **Residue** survive this translation? Yes. Even when described mechanically, we feel the surveyor's internal states are *for* navigation in a way the room's ink is not. The surveyor's traces were caused by the coast itself; the room's ink was caused by a painter copying the surveyor. The residue suggests that causal history, not just current information state, matters for understanding. The intuition persists that the surveyor's data is grounded, while the room's is derivative. However, this residue shifts the argument. It no longer proves understanding is *not information*; it suggests understanding is information plus a specific causal history. The original **Payload** claims no arrangement of information adds up to understanding. The residue suggests a specific arrangement (causal grounding) might.

  To test this, consider a **Counter-Pump**. Imagine a third room. This room has no inscriptions. Instead, it contains a mechanism that measures tidal pressure and wind speed, calculating the safe harbour location in real-time without any prior map. It has no stored information about the coast, yet it navigates perfectly. If the original **Payload** holds, this room lacks understanding because it lacks the stored information the surveyor has. But intuitively, this room seems to know the coast better than the surveyor, as it responds to the coast directly.

  The existence of this Counter-Pump destabilizes the original **Payload**. If a system with no stored information can navigate successfully, then stored information is not necessary for understanding. If the surveyor is just a biological navigator, and the Counter-Pump is a computational navigator, the distinction between them is substrate, not ontology. The original argument fails because it isolates information from function. Once the **Description Asymmetry** is removed, the **Engine** loses its power. The **Payload** cannot stand because the residue points toward causal function, not a non-informational essence, and the Counter-Pump shows information itself may not be required at all. The case proves only that static ink is not a mind, not that information is not understanding.

  ***

  ### Deliverable 3: Marking Scheme

  **Total Marks:** 20
  **Structure:** 5 Criteria × 4 Marks each.

  | Criterion | Marking Guidance (4 Marks) | Characteristic Loss of Marks |
  | :--- | :--- | :--- |
  | **1. Engine & Payload** | Clearly identifies the contrast (agent vs. ink) as the Engine and the non-reducibility of understanding to information as the Payload. | Identifying the topic generally but failing to isolate the specific intuitive trigger or conclusion. |
  | **2. Description Asymmetry** | Correctly identifies that the surveyor is described agentially and the room mechanistically, noting this invites a biased comparison. | Merely stating the terms differ without explaining how this biases the intuitive comparison. |
  | **3. Vocabulary Translation** | **Crucial:** Actually rewrites the surveyor or the room in the opposing vocabulary (e.g., surveyor as physical traces) to level the comparison. | Asserting that a translation is possible without demonstrating the rewritten case details. |
  | **4. Residue Verdict** | States clearly whether intuition survives the translation and specifies *what* survives (e.g., causal history vs. static state). | Listing possible residues without committing to a verdict on whether the original intuition holds. |
  | **5. Counter-Pump & Impact** | Constructs a novel variant (e.g., real-time calculation) and explains specifically how it undermines or modifies the original Payload. | Providing a counter-example without linking its implications back to the original argument's conclusion. |

  **First-Class vs. Second-Class Boundary**
  The boundary turns on **Criterion 3 (Vocabulary Translation)**. A competent Second-Class answer will identify the **Description Asymmetry** and argue that it exists. A First-Class answer will **perform the translation**, explicitly rewriting the surveyor's capacities in physicalist terms (or the room's in agential terms) within the text of the answer. The distinction is between *diagnosing* the flaw and *demonstrating* the flaw through reconstruction.

  **General Notes**
  *   Answers invoking external theories (e.g., "Chinese Room," "Functionalism," "Qualia") should be penalized under Criterion 1 as they violate the closed-book constraint regarding published positions.
  *   Word count is not marked, but answers significantly under 500 words will likely fail to meet Criterion 3 and 5 depth requirements.
