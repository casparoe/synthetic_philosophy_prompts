          *   Does this affect View (1)? No, dead is dead either way.
          *   Does this affect View (2)? View (2) says dead have an interest in their story. Does the *degree* of contradiction matter? Usually, View (2) is a blanket "no fictioning the dead." To make sure View (2) forbids *both*, I need to ensure the invention is fundamentally altering the story in both cases. If Version A is silence and Version B is contradiction, View (2) might say silence allows filling gaps, but contradiction does not. I need View (2) to forbid *both*.
