          *   View (2) cares about the dead's interest in their story. Since the invention is flattering but false, View (2) forbids both (assuming falsification violates the interest regardless of nuance).
          *   View (3) cares about contradicting the subject's *asserted inner life*.
          *   So the variable must be about the *content of the record* regarding the specific invented scene.
          *   Version A: The record is silent on the specific event/feeling.
          *   Version B: The record explicitly denies the feeling/event, but in a way that doesn't change the "flattering" nature (e.g., he wrote "I did not forgive him," but the novelist writes "He forgave him secretly").
