answer: |-
  The Case
  The Subject is a private clerk from a vanished century. No descendants exist. No legal estate remains. The Novelist possesses a box of letters and a daily journal. The records show a life of quiet diligence but reveal a specific estrangement from a colleague near the end. The Novelist wishes to invent a scene where the Subject secretly reconciles with this colleague, displaying a magnanimity the records do not confirm. This invention is flattering; it implies a moral growth the Subject might have desired but did not document. No living person knows the Subject. No instruction exists regarding portrayal. The Novelist seeks to bridge the gap between the last written entry and the Subject's death using this invented reconciliation. The material makes the life cohere more beautifully than the evidence suggests. The question is whether this artistic completion is permissible when the record stops.

  The Variable
  Version One: The journal falls silent regarding the colleague before the estrangement is resolved; there is no mention of the colleague's name in the final months.
  Version Two: The journal explicitly states in the final months that the Subject refused all overtures of reconciliation and intended to remain estranged.
  All conditions hold fixed. The invention is identical. The variable is solely the presence or absence of explicit textual contradiction within the surviving record regarding this specific emotional state. No other evidence differs between the scenarios. The flattering nature of the invention remains constant.

  The Verdicts
  View One holds that wrongs require a living subject to experience them. Since the Subject is dead, no harm occurs in either version. The living suffer no injury, and the dead feel nothing. Therefore, View One licenses the invention in both Version One and Version Two. The Novelist's freedom is total because the object of the portrayal lacks the capacity to be aggrieved. The state of the record is irrelevant. The variable of textual contradiction matters nothing here.

  View Two holds that the dead retain a posthumous interest in the truth of their narrative. To fictionalize their inner life is to violate their identity, regardless of flattery or the absence of living heirs. Therefore, View Two forbids the invention in both versions. Whether the record is silent or contradictory, inventing a secret feeling usurps the Subject's actual experience with a fabrication. A flattering lie remains a lie about the person. The interest lies in the integrity of the life. The variable of textual contradiction matters nothing here either; the violation is in the invention itself.

  View Three holds that the Novelist is bound by the Subject's self-testimony but may interpret gaps where evidence fails. In Version One, the record is silent; the invention fills a vacuum without contradicting evidence. View Three permits this as legitimate dramatization of historical ambiguity. The silence invites interpretation. In Version Two, the record asserts a specific refusal. The invention contradicts this asserted inner state. View Three forbids this as a violation of testimonial fidelity. The permission hinges entirely on the boundary between silence and assertion. Here, the text acts as a fence, not in Version One, but in Version Two. Thus, the verdict shifts.

  The Pivot
  The pivot is the presence of explicit textual contradiction. View Three treats the surviving record as a contract of fidelity; silence allows imagination, but assertion binds it. If this feature is removed—if we cannot distinguish silence from assertion—View Three collapses into View Two (forbidding all) or View One (allowing all). Views One and Two ignore this feature because they do not ground their ethics in the relationship between text and truth. View One sees only the living; View Two sees only the dead's interest. Neither cares about the specific architecture of the evidence, only the existence of the subject or the harm done. For View Three, the document is a boundary; for the others, it is merely data or irrelevant noise.

  The Rebuttal
  The defender of View Two argues that silence is not an invitation but a protection. To invent into silence is to claim knowledge one cannot have, creating a false certainty that hardens into fact for future readers. Even if the record does not contradict the invention, the invention contradicts the limits of human knowledge. The Subject's inner life is not a vacuum to be filled but a mystery to be respected. Flattery does not cure falsification; it merely makes the violation more seductive. By permitting invention in Version One, View Three fails to protect the dead from being rewritten to suit the Novelist's aesthetic desires. The distinction between silence and contradiction is illusory; both are zones where the Novelist must stop. Furthermore, silence often implies absence; filling it imposes presence where there was none. This distorts the historical texture as much as explicit contradiction. The dead cannot object to the distortion, which is precisely why the Novelist must not proceed. Ultimately, the right to silence belongs to the dead, not the writer.

  The Upshot for My Draft
  For your draft, this means your defense cannot rest on harmlessness. You must locate your invention within the silence of the record, not against its assertions. If you choose View One, you admit you owe the dead nothing. If you choose View Three, you must prove the record is silent on the specific inner state you depict. Your justification must be archival, not just aesthetic. You are not filling a gap because it is pleasing, but because the evidence allows it.
