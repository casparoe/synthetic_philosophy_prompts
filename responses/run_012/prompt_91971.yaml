  *Wait, one detail:* "his sister should hear that the distinction was got right." This likely refers to the prompt's instruction about the brother. I need to make sure the speech clarifies that the *speaker* took the action, based on advice, not that the Groom forced it. It was the speaker's choice to defer.

  *Final check on time:* Keep it tight.

