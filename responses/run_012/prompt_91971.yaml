prompt: |-
  I need a best man's speech, written so that it survives a room containing exactly one moral philosopher and roughly forty people who are not.

  The wedding is in three weeks and the groom is my oldest friend. The awkward fact I want the speech built on is this: I have almost no first-hand moral convictions. Where other people have views they arrived at for themselves, I have his. I stopped eating meat because he did; I broke with my brother for eighteen months because he said I should; when I have needed to know how to treat someone, I have asked him, and then done as he told me. In twenty-five years I cannot point to a single moral position I worked out on my own. I have lived my adult life on another person's moral testimony.

  That is what I want said, and it is also what makes it hard to say. Testimony obviously transmits knowledge in most domains: I know that Lima is the capital of Peru, or that the Battle of Hastings was fought in 1066, because someone told me. Whether it can do the same in moral matters is contested. I can be told what to do, and be right, and even act rightly, and still be holding a borrowed belief rather than something I have understood for myself; and there is a further worry that if I do the right thing for his reasons rather than my own, the action is not really mine to be credited with. If that is right, the standard best man's flourish — that he made me the man I am, that everything decent in me is his doing — is a more dangerous thing to say than it sounds. It would mean the decency is his and not mine, and that I have spent my life borrowing rather than knowing.

  I cannot be coy about this, because my friend and his fiancée have asked me to be godfather to their daughter, who is eleven months old, and I am expected to accept in the speech. So the question of what testimony can and cannot hand on stops being academic: whatever I end up saying about borrowed moral beliefs, I am about to be installed as a source of them.

  Please write the speech — four or five minutes, warm and funny where it can be, and genuinely honest rather than merely self-deprecating. I do not want the philosophy used as a way of ducking the toast's real business, which is to say what I owe him and what I am taking on. Do not name philosophers or cite any literature; the ideas should be voiced plainly, as something I have been chewing over, not as a report on a debate. And it must not feel like a lecture: the forty non-philosophers should hear a man being honest about his own character, and his sister should hear that the distinction was got right.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Best Man (oldest friend of the Groom).
      *   **Audience:** ~41 people (1 moral philosopher, 40 non-philosophers).
      *   **Tone:** Warm, funny where appropriate, genuinely honest (not just self-deprecating), not a lecture.
      *   **Core Theme:** The speaker has no first-hand moral convictions; he has lived his adult life adopting the Groom's moral positions (vegetarianism, family estrangement, general conduct).
      *   **The Philosophical Tension:** Can moral testimony transmit knowledge/virtue? If I do the right thing because *he* said so, is the virtue mine or his?
      *   **The Stakes:** The couple has asked the speaker to be the godfather to their 11-month-old daughter. He needs to accept this role in the speech. This makes the philosophical issue practical: he is about to become a source of moral testimony himself.
      *   **Constraints:** No naming philosophers or citing literature. 4-5 minutes spoken (approx. 600-750 words). Must satisfy the sister (regarding the brother estrangement mention) and the general crowd (keep it accessible).

  2.  **Deconstruct the Audience:**
      *   *The 40 Non-Philosophers:* They want a wedding speech. They want jokes, anecdotes, warmth, and a toast. They don't want an epistemology seminar. The philosophical points need to be translated into everyday language about friendship and influence.
      *   *The 1 Moral Philosopher:* They will spot the nuance. They need to feel the speaker understands the weight of "moral testimony" without needing jargon. The argument must hold water philosophically even if stated plainly.
      *   *The Sister:* The prompt mentions "his sister should hear that the distinction was got right." This refers to the "broke with my brother for eighteen months" point. It needs to be handled carefully so it doesn't sound like the Groom is a manipulator, but rather that the speaker trusts the Groom's judgment implicitly.
      *   *The Groom & Bride:* They need to feel loved and honored. The godfather acceptance needs to be sincere.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Standard best man fare. Warm up the room. Acknowledge the friendship duration (25 years).
      *   **The Hook (The "Influence"):** Start with the standard trope: "He made me the man I am." Then pivot to the literal truth of that statement.
      *   **The Examples (Concrete & Funny):**
          *   Vegetarianism (low stakes).
          *   The Brother Estrangement (high stakes, needs care). *Self-Correction:* Make sure this doesn't sound toxic. Frame it as trust in the Groom's judgment during a confusing time, not blind obedience.
          *   General conduct (how to treat people).
      *   **The Philosophical Core (Plain English):** Address the "borrowed virtue" problem. If I'm good because he tells me to be, am I good? Or is he? Acknowledge the worry without using terms like "epistemic dependence."
      *   **The Turn (The Godfather Role):** This is the crucial pivot. The couple is asking him to guide their daughter. This forces the question: Can I teach what I only borrowed?
      *   **The Resolution:** The answer isn't that the speaker suddenly has his own morals. It's that the *chain* of trust is the value. He will pass on the Groom's goodness, acknowledging the source. It transforms the "borrowing" into a "tradition" or "lineage."
      *   **The Toast:** Bring it back to the couple.

  4.  **Refining the Tone:**
      *   *Avoid:* "Epistemology," "Normative Ethics," "Testimony," "Propositional Knowledge."
      *   *Use:* "Knowing," "Right and Wrong," "Trusting," "Compass."
      *   *Humor:* Needs to be self-effacing but not pathetic. The joke is on the speaker's lack of independence, not the Groom's control.
      *   *Sister Check:* Regarding the brother estrangement: "I broke with my brother because he said I should." This is risky. I need to frame it as "I was lost, he saw clearly, I trusted him." It validates the Groom's integrity without vilifying the brother too much (or at least, making it about the speaker's reliance).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. [Groom] is my best friend. People say friends influence you. For me, it's literal. I don't eat meat because he doesn't. I stopped talking to my brother because he thought I should. I ask him how to behave. Philosophers say this is weird. Can you be good if you just copy? I worry I'm not actually good, just copying him. But now they want me to be Godfather. I have to teach their kid right from wrong. I don't know any. But I know him. So I'll teach her what he taught me. To [Groom] and [Bride].

      *Critique 1:* Too blunt. Needs more warmth and flow. The "brother" bit needs softening so it doesn't sound like a cult. The philosophical bit needs to feel like a realization, not a thesis.

  6.  **Drafting - Iteration 2 (Focusing on the "Godfather" pivot):**
      The transition to the godfather role is the key to solving the philosophical problem. If the speaker admits he borrows his morals, but argues that *trusting good people* is itself a moral virtue, then he can accept the role. He isn't teaching "my morals," he's teaching "how to find good people." That satisfies the philosopher (it's a second-order virtue) and the crowd (it's sweet).

  7.  **Writing the Speech (incorporating constraints):**
      *   *Word Count Check:* 130-150 words per minute is standard speaking pace. 4-5 minutes = ~550-750 words.
      *   *Philosophy Check:* Ensure the distinction between "doing the right thing" and "knowing why it's right" is clear but jargon-free.
      *   *Sister Check:* Ensure the brother mention doesn't sound like the Groom broke up a family for fun, but that the speaker relied on the Groom's clarity.

  8.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the toast is clear.
      *   Make sure the "Godfather" acceptance is explicit.

  *(Self-Correction during drafting)*: I need to be careful with the "brother" line. The prompt says "I broke with my brother... because he said I should." I must include this. To make it palatable to the room (and the sister), I should frame it as a time when *I* was confused, and *he* provided clarity. It highlights my dependence, not his meddling.

  *(Refining the Godfather acceptance)*: The prompt says "I am expected to accept in the speech." I need to make sure I actually say "Yes" clearly.

  *(Refining the Philosophy)*: The prompt says "Do not name philosophers... ideas should be voiced plainly." I will talk about "knowing" vs "being told."

  Let's write.

  *Opening:* Welcome, thanks.
