answer: |-
  Good evening, everyone. For those who don't know me, I'm [Name], and I've had the privilege of calling [Groom] my best friend for twenty-five years.

  Usually, this is the part of the speech where I tell you how much he's influenced me. I'm supposed to say something like, "He's made me a better man," and then tell a funny story about a time he talked me out of a bad haircut. But I've been thinking about that phrase lately, and I realized I shouldn't use it lightly. Because in my case, it isn't just a figure of speech.

  It is literally true.

  When I look at the moral shape of my life, the convictions I hold, the lines I draw in the sand… almost none of them are mine. I stopped eating meat twenty years ago because [Groom] stopped eating meat. I didn't weigh the ethics; I just looked at him and thought, "Well, if that's the standard, that's my standard."

  There was a time, a few years back, when I was having a serious falling-out with my brother. I was confused, angry, and didn't know what was fair. I asked [Groom] what he thought. He gave me his view. I broke with my brother for eighteen months on the strength of his judgment. When I reconciled, it was because [Groom] told me it was time to.

  When I don't know how to treat a partner, or how to handle money, or how to be kind when I'm tired, I don't consult my conscience. I consult him. I have lived my adult life on another person's moral testimony.

  Now, I know how that sounds. It sounds like I'm absolving myself of responsibility. And there is a worry that keeps me up at night: If I do the right thing only because he told me to, is the goodness actually mine? Or am I just a vessel for his? If virtue requires understanding *why* something is right, and I only know *that* it is right because he said so… have I actually learned anything? Or have I just borrowed a reputation for decency that belongs to him?

  It's a strange position to be in. To look at your own character and realize it's mostly a reflection of someone else's.

  But then, [Groom] and [Bride] asked me to be the godfather to their daughter.

  And that changes everything. Because now, I am not just the borrower. I am about to become a lender. I am going to be standing in front of a little girl, and she is going to ask me how to be good. And I cannot pretend I have a library of original wisdom to draw from.

  So, here is my promise to you both, and to her.

  I will not pretend to be a source of original moral truth. I am not that man. Instead, I will teach her exactly what I learned from her father. I will teach her that the world is complicated, and that one of the most important skills you can have is recognizing people who are better than you are. I will teach her that there is no shame in asking for direction when you are lost. And I will teach her that trusting the right person is its own kind of wisdom.

  I may not have worked out my own morals. But I did work out who to trust. And in accepting this role, I am betting that the chain of testimony doesn't weaken as it passes down. I am betting that if I pass on what he taught me, with the same honesty and the same credit to the source, she will start her life with a compass that works.

  [Groom], you asked me to help guide her. I don't have a map of my own. But I have followed yours for twenty-five years, and it has never led me astray. I accept the role, and I will do my best to keep that record intact.

  So, if everyone could please stand.

  To [Groom] and [Bride]. May your home be happy, your convictions be your own, and your daughter be wise enough to know who to listen to when she needs to find her way.

  To the happy couple.
