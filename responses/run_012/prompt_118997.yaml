prompt: |-
  I keep going back and forth on the sex-work regimes and I want you to actually dig into the philosophy instead of the usual yelling match. Lay out the three big approaches as concretely as you can first, just so we're on the same page: the Nordic model, where buying is criminalized but selling isn't (Sweden and the countries that copied it), legalization-and-regulation, where it's an ordinary licensed industry with health rules and taxed brothels (Germany, the Netherlands), and plain decriminalization, where it's treated as work like any other job (New Zealand). Then the real question, which is the part I never see done properly: what does each regime have to believe about consent, coercion, and agency for it to even hang together?

  The one that's been bugging me is the Nordic model. On one hand it flatly refuses to punish the seller, which sounds like it's taking her at her word that she chose this and knows her own life. On the other hand it punishes the buyer, which sounds like it's saying the whole transaction is a wrong done *to* her. Can both of those be true at once, or is there a hidden equivocation on "consent" where her yes is good enough to get her off the hook but not good enough to legitimize the deal? Taboo the word "exploitation" for a second and tell me what's actually supposed to be happening in that room.

  Two test cases I want you to run it through. First, a seller who genuinely prefers this to her alternatives and would keep doing it even if she were comfortably rich — does the Nordic rationale survive that, or does it collapse into plain paternalism, and if it does, what exactly is the buyer still doing wrong? Second, the disability-rights angle, where some people argue that paid access is a real welfare good and not a harm at all — does that break the "she's a victim" framing, or can the model absorb it? 

  If you think the Nordic model can be made coherent, show me the theory of consent that does it and then tell me what else that theory commits us to — surrogacy, selling a kidney, dangerous jobs, whatever's nearest. If you think it can't, say which premise has to go and what's left standing. And for all three regimes, tell me where they're underdetermined, i.e. which parts are strictly required by the stated goal and which are just accidents of who happened to lobby for them.

  I've read the standard arguments already, so don't just recite them — commit to a view on whether the Nordic model is coherent. And please write it as continuous prose, no headers or bullet points or bold or tables, just paragraphs like you're writing me an email.
