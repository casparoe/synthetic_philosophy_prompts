answer: |-
  It is refreshing to step away from the usual shouting match and look at the architectural load-bearing walls of these policies, because you are right that the debate usually stalls on empirical claims about violence rates or tax revenue while ignoring the moral ontology underneath. To get us on the same page, let us briefly ground the three regimes not just by their laws but by their view of the human subject. The legalization-and-regulation model, seen in places like Germany, treats sex work as a specialized service industry that requires state oversight to ensure safety and hygiene, implying that consent is possible but fragile, needing bureaucratic verification to remain valid. The decriminalization model, exemplified by New Zealand, treats sex work as labor pure and simple, removing criminal penalties entirely and relying on standard contract and labor law, which implies that sex workers possess full agency and are the best judges of their own safety and interests. The Nordic model, adopted by Sweden and others, criminalizes the purchase of sex while decriminalizing the sale, aiming to abolish the industry by drying up demand while protecting the individuals in it. This triad sets the stage for the philosophical conflict, which is fundamentally about what counts as a valid yes.

  The Nordic model is indeed the most philosophically tangled because it attempts to hold two seemingly contradictory positions about the seller simultaneously. On one hand, by refusing to punish the seller, it acknowledges that she is not a moral agent responsible for a crime, suggesting she is acting under constraints that mitigate her culpability. On the other hand, by punishing the buyer, it asserts that the transaction itself is a harm, implying that her consent was insufficient to legitimize the act. To make this hang together without collapsing into nonsense, the model must rely on a theory of structural consent rather than transactional consent. In this view, a person can say yes in the immediate moment, but if the background conditions of that yes are shaped by systemic inequality, patriarchy, or economic desperation, the consent is structurally void. The law treats the seller as a victim of these background conditions, which is why she is not punished, while the buyer is punished for leveraging those conditions to secure access to another human body. The hidden equivocation you sensed is real, but it is intentional; it distinguishes between being responsible for a crime and being harmed by a transaction. The seller is not a criminal, but she is still a victim, and the buyer is the perpetrator of the harm regardless of whether she agreed to it in the moment.

  This theory of structural consent faces its hardest test with your first case, the seller who genuinely prefers the work and would do it even if wealthy. If the Nordic model's justification rests solely on economic coercion, this woman breaks the model, because her background conditions are not coercive. For the Nordic rationale to survive this, it must retreat to a deeper claim about human dignity, specifically that sexuality is an inalienable part of the self that cannot be commodified without violating human integrity, regardless of economic need. This moves the argument from sociology to metaphysics. It claims that selling sex is inherently degrading because it turns an intimate human capacity into a tool for another's use, which damages the seller's self-conception and reinforces a social hierarchy where bodies are purchasable. If this is the core belief, then the wealthy seller is still being harmed, perhaps psychologically or socially, and the buyer is still wronging her by treating her as a commodity. However, if the model cannot sustain this strong dignity claim and relies only on economic coercion, then yes, it collapses into plain paternalism for the wealthy seller, punishing the buyer for a transaction that harms no one and violates no one's autonomy in a meaningful way.

  The disability-rights angle offers a different stress test, challenging the assumption that the transaction is purely a harm to the seller. If paid access to intimacy is a welfare good for a disabled person who cannot find partners otherwise, the Nordic model must weigh the harm to the seller against the harm to the buyer. The model generally resolves this by prioritizing the seller's hypothetical structural harm over the buyer's concrete isolation, arguing that satisfying the buyer's need via purchase reinforces the idea that bodies are services, which ultimately degrades the social standing of all women. To absorb this without breaking, the Nordic model must argue that the harm of commodification is a public bad that outweighs private welfare gains. It suggests that we cannot solve individual loneliness by creating a market that undermines collective dignity. This is a coherent position, but it is a hard one, requiring us to accept that some human needs must go unmet if meeting them requires violating a principle of non-commodification. It refuses to treat sex as a neutral service like massage or nursing, insisting it belongs to a category of human interaction that must remain outside the market to preserve its meaning.

  So, can the Nordic model be made coherent? I believe it can, but only if you accept a perfectionist theory of consent that prioritizes substantive dignity over procedural autonomy. This theory holds that valid consent requires not just the absence of immediate force, but the presence of genuine equality and the non-commodification of intimate selfhood. If you accept this, the model is consistent: the seller is exempt from punishment because she is operating within a corrupted structure, and the buyer is punished for sustaining that structure. However, committing to this theory forces you into uncomfortable positions elsewhere. If sexuality cannot be sold because it violates human dignity, then consistent application suggests we should also ban commercial surrogacy, since it commodifies reproductive capacity, and potentially the sale of kidneys or plasma, since it commodifies bodily integrity. It commits us to a view where the body is not fully ownable property that can be leased at will. If you are not willing to ban surrogacy or organ sales, then the Nordic model's premise regarding sex work looks suspiciously selective, suggesting it is driven more by specific cultural anxieties about female sexuality than by a universal principle of bodily dignity. If you reject the dignity premise entirely in favor of liberal self-ownership, then the Nordic model loses its coherence and becomes purely paternalistic, imposing a specific view of the good life on workers who reject it.

  Looking at where these regimes are underdetermined reveals how much of their actual implementation is accidental rather than logical. In the Nordic model, the provision of exit services is logically required; if you claim to be saving victims, you must offer them a way out. When countries adopt the criminalization side without funding the social support, that is a failure of logic, often due to budget lobbying. In the legalization model, mandatory health testing for workers is often treated as a core feature, but logically, if this is work like any other, health safety should be managed through standard occupational safety laws rather than singled out for stigmatizing testing, which is often a relic of moral panic lobbying rather than regulatory necessity. In the decriminalization model, the removal of criminal penalties is the core requirement, but zoning laws that push brothels into industrial wastelands are often retained due to community pressure, effectively re-criminalizing the work through bureaucracy rather than statute. Each model has a pure philosophical core that gets muddied by the practical necessities of governance and the influence of interest groups who want the moral signal without the material cost.

  Ultimately, the choice between these regimes is not just about which reduces violence most efficiently, but about what kind of moral agents we believe sex workers are. The decriminalization model bets on their agency, accepting the risks of the market to preserve their autonomy. The legalization model bets on the state's ability to sanitize the market, accepting reduced autonomy for increased safety. The Nordic model bets on the corruption of the market itself, accepting reduced immediate autonomy to pursue a vision of structural equality. If I have to commit, the Nordic model is coherent only if you are willing to pay the price of restricting bodily commerce across the board, treating the body as a temple rather than a tool. If you view the body as property that the self can lease, the Nordic model is indefensible paternalism. The tension you feel is the friction between these two incompatible views of the self, and no policy can fully resolve it without taking a stand on whether there are some things money simply should not buy.
