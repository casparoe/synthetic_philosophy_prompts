answer: |-
  Right, let's untangle this. You're not mad for seeing a link—they're siblings, born from the same brain (Derek Parfit's)—but your mate is technically right: you are conflating two distinct problems.

  Here is the concrete breakdown of where one stops and the other starts, which premise is doing the work, and whether you're stuck with the Repugnant Conclusion if you accept the Non-Identity Problem.

  ### 1. The Non-Identity Problem (NIP)
  **The Core Issue:** Identity and Harm.
  **The Concrete Scenario:** Your teen mum example is spot on. A 14-year-old girl has a child now (Child A) vs. waiting until she's 30 (Child B). Child A has a harder life due to poverty, but a life worth living. Child B would have had a brilliant life.

  **The Premise doing the work:**
  *   **The Person-Affecting Claim:** An action can only be wrong if it makes some *particular* person worse off than they would otherwise have been.

  **The Problem:**
  If the girl waits, Child A never exists. So, having Child A now doesn't make Child A worse off than the alternative (which is non-existence). Therefore, under the Person-Affecting Claim, the girl hasn't wronged Child A. But intuitively, it feels like she *has* done something wrong (or at least, a policy causing this systematically is bad).

  **Where NIP stops:**
  NIP stops at the claim that **we cannot explain what is wrong by pointing to harm done to the specific individual born.** It doesn't tell you how to count the good; it just breaks the tool we usually use to count harm.

  ### 2. The Repugnant Conclusion (RC)
  **The Core Issue:** Quantity vs. Quality.
  **The Concrete Scenario:**
  *   **World A:** 1 billion people, all ecstatically happy (10/10 welfare).
  *   **World Z:** 100 trillion people, lives barely worth living (1/10 welfare), just above the point of suicide.

  **The Premise doing the work:**
  *   **The Total Principle:** The best outcome is the one with the highest *total sum* of welfare, regardless of the average or the identity of the people.

  **The Problem:**
  In World Z, $100,000,000,000,000 \times 1 = \text{Huge Number}$. In World A, $1,000,000,000 \times 10 = \text{Smaller Number}$. The Total Principle says World Z is better. That feels repugnant.

  **Where RC starts:**
  This is the step you described as "swapping in more and more people whose lives are only just worth living." That is purely the Repugnant Conclusion. The Non-Identity Problem does not inherently demand we maximise the total number of people; it just says we can't judge based on harm to specific existing people.

  ### 3. So, are you conflating them?
  Yes, slightly. You've bolted the **solution** to the Non-Identity Problem onto the **problem** itself.

  Here is the chain of logic you're sensing:
  1.  **NIP Step:** We realise the "Person-Affecting Claim" is broken (because it says the teen mum did nothing wrong).
  2.  **The Fix:** To fix NIP, we switch to an "Impersonal" view (like the Total Principle). We say, "It's not about harming Child A; it's about bringing a better total state of affairs into existence."
  3.  **The RC Step:** Once you adopt that "Impersonal/Total" fix to solve NIP, you accidentally open the door to the Repugnant Conclusion.

  So, the "adding masses of miserable people" bit isn't part of the Non-Identity Problem itself. It's the consequence of adopting the most obvious *solution* to the Non-Identity Problem.

  ### 4. Does NIP reasoning commit you to RC?
  **Logically? No.**
  Accepting the Non-Identity Problem just means accepting that the Person-Affecting Claim is false. It doesn't force you to accept the Total Principle. There are other ways to judge actions impersonally without summing up total welfare (e.g., Average Utilitarianism, or Prioritarianism).

  **Practically? Almost.**
  This is why you feel stuck. Most ethical theories that are strong enough to solve the Non-Identity Problem (by saying the teen mum's choice *was* worse, even if Child A isn't harmed) rely on comparing total states of affairs. Once you start comparing total states of affairs, you tend to slide towards the Repugnant Conclusion.

  ### 5. If you reject RC, must you reject NIP?
  **No.** You don't have to reject the Non-Identity *Point* (that the child isn't harmed). You just have to reject the *Total Principle* as the way to solve it.

  You need a theory that sits in the middle. For example:
  *   **Critical Level Utilitarianism:** We count welfare, but only lives *above* a certain threshold of quality count as positive value. Lives "barely worth living" count as zero or negative. This solves RC (World Z is no longer better) but can still handle NIP (choosing the policy that creates higher quality lives is better, even if identities change).

  ### Summary for your mate
  Tell him this:
  1.  **Non-Identity Problem** is about **Who**: It breaks the idea that you need to harm a specific person to do wrong.
  2.  **Repugnant Conclusion** is about **How Many**: It breaks the idea that we should just maximise the total sum of happiness.
  3.  **The Link:** You only get to the Repugnant Conclusion if you try to fix the Non-Identity Problem using **Total Utilitarianism**.
  4.  **The Verdict:** You aren't wrong to see the connection, but the "masses of miserable people" step is the Repugnant Conclusion crashing the party, not the Non-Identity Problem itself. You can keep the Non-Identity insight without accepting the Repugnant Conclusion, provided you don't use a "Total Sum" calculator to fix it.

  In short: You've identified the trap Parfit set, but you've stepped into the second cage thinking it was part of the first. They're adjacent cells, not the same room.
