          3.  Breakdown of RC (The "How Many" Problem).
          4.  The Link (Why they feel connected).
          5.  Addressing the specific questions (Commitment/Rejection).

      *   *Refining the "Concrete" Requirement:* Instead of saying "Premise P1," use specific claims like "The Harm Principle" or "The Total Principle." Use the teen mum example for NIP and the "Happy vs. Barely Living" example for RC.

      *   *Addressing the "Step":* The user asks: "is that last step part of the nonidentity problem, or is it the repugant conclusion?"
          *   *Answer:* That last step (adding masses of barely-living people) is the Repugnant Conclusion. The Non-Identity Problem is just about the specific individual not being harmed. However, solving NIP often leads you to accept the logic that causes RC.

      *   *Addressing "Does NIP commit you to RC?":*
          *   Not strictly *logically*, but practically, yes. If you abandon the Person-Affecting View to solve NIP, you usually adopt an Impersonal View (like Total Utilitarianism), which generates RC. So rejecting RC makes it very hard to solve NIP comfortably.

