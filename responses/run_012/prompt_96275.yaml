answer: |-
  The socialist calculation debate translates robustly into distributed optimization until you hit dynamics and epistemology, where the Austrian critique exposes limits in static formalism. Your vocabulary captures the mechanism but misses the discovery process inherent in entrepreneurship.

  | Claim | Your-Vocabulary Counterpart | What Is Lost or Distorted |
  | :--- | :--- | :--- |
  | **Mises:** No market prices for capital goods means no rational allocation. | Missing dual variables (shadow prices) for resource constraints; no gradient signal for descent. | Ignores that property rights are the *protocol* generating these variables, not just the variables themselves. |
  | **Lange:** CPB sets prices via trial-and-error; firms follow parametric rules. | Distributed primal-dual subgradient method (e.g., Arrow-Hurwicz); CPB updates duals, firms solve local primals. | Assumes convexity, static environment during convergence, and truthful local reporting (no strategic noise). |
  | **Hayek:** Knowledge is dispersed, tacit, and not articulable. | Private inputs with high communication complexity; gradients are non-computable without local discovery. | Tacit knowledge implies inputs that cannot be digitized or transmitted, violating the message-passing model. |

  **Residue Report**

  The translation holds structurally but fractures on the nature of the objective function and the cost of information. Regarding your first suspected residue, the Austrian insistence on tacit knowledge marks a genuine limit of optimization formalism. In your framework, the feasible set $\mathcal{X}$ and objective function $f$ are assumed to exist, even if parameters are unknown. Hayek argues that in economic contexts, $f$ is not merely unknown but undefined until agents act. Entrepreneurship is not parameter estimation; it is the creation of new dimensions in the solution space. Optimization formalisms cannot model the discovery of variables that do not yet exist, treating all uncertainty as risk within a fixed state-space rather than genuine ignorance of the space itself.

  Second, the debate is indeed about communication complexity, but compounded by non-stationarity. Calling it a "calculation" problem has misled readers into thinking it is a computational burden issue (P vs NP). It is actually a bandwidth and latency problem in a changing environment. If the environment changes faster than the algorithm's convergence time (the tâtonnement speed), the solution is obsolete upon arrival. Lange's algorithm assumes a static world during iteration; Hayek insists the data changes *because* of the iteration. Your vocabulary handles communication costs well, but standard distributed optimization assumes the function being optimized remains stable long enough for convergence, which is the precise point of contention.

  Third, the incentive strand is partially expressible in mechanism design but requires expanding beyond equilibrium existence to stability analysis. Mechanism design handles truth-telling (incentive compatibility), ensuring agents report local gradients honestly. However, the Austrian critique focuses on error correction: who bears the cost of mistaken prices? In markets, losses delete agents (pruning the search tree); in planning, errors persist due to bureaucratic inertia (soft budget constraints). This is not just about incentives to report truthfully, but about the system's ability to terminate failing branches of computation. Your vocabulary can express this via robustness or fault-tolerance metrics, but it is often treated as a secondary constraint rather than the primary driver of efficiency.

  Fourth, Lange's iterative picture does presuppose equilibrium knowledge, creating a circularity. Lange assumes the Central Planning Board knows the update rule $\lambda_{t+1} = \lambda_t + \alpha \cdot \text{excess\_demand}$. Hayek argues that "excess demand" is not an observable oracle output but a phenomenon that only emerges from actual trading attempts. The algorithm is well-defined only if the oracle exists, but the debate is about whether the oracle can exist without the institution (private property) that Lange's model assumes away. The algorithm assumes the gradient is accessible; the Austrians argue the gradient is generated by the process the algorithm tries to simulate.

  Finally, the residue is both a defect of your framework and a sign of the Austrians' political thesis dressed as epistemology. Your framework is defective because it is static; it lacks resources for modeling discovery, evolution, or endogenous change in the feasible set. Optimization is inherently backward-looking (minimizing based on known constraints), while markets are forward-looking (creating new constraints). However, the Austrians also smuggle in a political thesis: that private property is the *only* protocol capable of generating the necessary signals. They frame this as an epistemic limit (knowledge is impossible without prices) to strengthen the political claim (therefore, socialism is impossible). The epistemic claim holds water regarding static optimization limits, but the political leap assumes no alternative distributed protocols could ever emerge. You should treat the debate as a critique of static distributed optimization under high non-stationarity, while recognizing the "impossibility" claim rests on institutional assumptions outside pure mathematics.
