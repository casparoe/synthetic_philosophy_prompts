  Here is a option that balances the technical mechanics with the social commentary, keeping the tone appropriate for a funeral lunch while signaling to your uncle that you understand the strategy.

  **The Toast**

  "Uncle [Name] has been schooling me on the family strategy. He calls it 'Buy, Borrow, Die.' The idea is you never sell; you just borrow against the shares for cash, and when you pass, the step-up in basis resets the cost to market value, wiping out forty years of capital gains tax.

  He says it makes death the best financial event in the tax code. And looking at the forms, he's right. Forty years of growth, evaporated.

  But it did get me thinking about the phrase 'equal opportunity.' Because the step-up in basis is technically a reset button. It clears the debt on the growth. But it's the only reset button in the world that requires you to already own the game to press it.

  So here's to Grandad. He didn't just leave us the money. He left us the entry fee for the loophole."

  ***

  **Why this works:**
  *   **The Uncle Nod:** Using the specific phrase "Buy, Borrow, Die" and correctly describing the "step-up in basis" (resetting cost to market value) proves you aren't just guessing.
  *   **The Mechanic:** The joke relies on the specific tax rule (you need an existing basis to step up), not just a general "rich people" trope.
  *   **The Angle:** It addresses the inequality ("requires you to already own the game") without sounding like a political speech, framing it as a realization you had while reviewing the estate.
  *   **The Tone:** It ends on a note of gratitude to your grandfather, which keeps it appropriate for the setting.
