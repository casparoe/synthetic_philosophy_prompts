  (a) 0.90 — Most credible moral theories presuppose that agents must have guidance control or culpable ignorance to deserve blame.
  (b) 0.30 — It is statistically unlikely that every single actor in the development and deployment chain lacks foreseeability or control simultaneously.
  (c) 0.35 — Moral blame typically requires causal culpability, whereas role-based duties usually ground legal liability or professional sanction instead.
  (d) 0.50 — While collective responsibility is philosophically coherent, it often dissolves upon forensic inspection into individual negligent acts.
  (e) 0.75 — Historical accident data suggests most autonomous failures stem from upstream human choices regarding data, testing, or deployment contexts.
  (f) 0.65 — Public discourse frequently conflates the obligation to compensate victims with the distinct moral condition of being culpable for harm.

  **Synthesis:** The final credence is low because the high probability of upstream traceability (e) overwhelmingly contradicts the claim that no human is blameworthy, even granting that control is required (a). The possibility that every human fails the control condition (b) is too low to sustain the gap, and while collective blame (d) might technically satisfy the proposition's wording, it rarely exonerates individuals in practice.

  **Most Sensitive Term:** (e) — that the harm is almost always traceable to some upstream human choice.

  **Evidence to Move It:** Internal forensic reports distinguishing between truly stochastic, unforeseeable model failures and those resulting from known but unmitigated risks in training data or deployment parameters.
