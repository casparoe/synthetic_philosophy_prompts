answer: "### Candidate Metaphysical Packages\n\nBefore reconstructing the practice,\
  \ we must lay out the ontological options on the table.\n\n1.  **Intrinsic Categoricalism:**\
  \ Dispositions are grounded in the internal microstructure (categorical bases) of\
  \ the object. The device *has* the power in virtue of what it *is*, regardless of\
  \ environment. The environment only triggers or masks the power.\n2.  \b**Pure Counterfactualism:**\
  \ Dispositions are nothing over and above the truth of conditional statements (\"\
  If dropped, it would break\"). There is no underlying \"glue\" or basis.\n3.  **Relational/Contextualism:**\
  \ Dispositions are not properties of the object alone, but of the object-in-environment.\
  \ The power exists only in the relation between the device and its stimulus partners.\n\
  \n### Reconstruction of the Certification Regime\n\nYour observation identifies\
  \ a triad of operational stances within safety certification. \n\nFirst, the **Marketing/Legal\
  \ Story** treats the disposition as an intrinsic, permanent property. The breaker\
  \ *is* a tripper. This aligns with Intrinsic Categoricalism. The property persists\
  \ through time and non-manifestation.\n\nSecond, the **Lab Story** treats the disposition\
  \ as verification-dependent. The test rig applies a stimulus to provoke manifestation.\
  \ Crucially, if the device fails to manifest, the default assumption is absence\
  \ of the disposition *unless* the rig is blamed. Here, the stimulus is active; it\
  \ doesn't just reveal, it perturbs.\n\nThird, the **Liability Story** reverts to\
  \ Intrinsic Categoricalism but adds a defensive clause. If a device fails in the\
  \ field, the disposition is presumed present but *masked* (by spiders, corrosion,\
  \ wiring errors). Non-manifestation here is evidence of external interference, not\
  \ internal absence.\n\nThe tension you perceive is this: In the lab, failure implies\
  \ absence (unless the rig is guilty). In the field, failure implies masking (unless\
  \ the device is guilty). The burden of proof regarding the *ceteris paribus* conditions\
  \ shifts depending on who holds the clipboard.\n\n### Verdicts on Commitments and\
  \ Consistency\n\n**1. Candidate Packages and Commitments**\nThe practice is overwhelmingly\
  \ committed to **Intrinsic Categoricalism**. It requires dispositions to be grounded\
  \ in a structural basis inside the device. A bare counterfactual reading fails because\
  \ certification must hold across time and varying environments; the device must\
  \ carry the guarantee with it. However, the practice secretly allows the environment\
  \ to *constitute* the manifestation conditions. The disposition is intrinsic, but\
  \ its *identity* is tied to specific stimulus conditions defined by the standard\
  \ (e.g., \"trips at 20A\").\n\n**2. Ruled-Out Views**\nThe regime quietly rules\
  \ out **Pure Relationalism**. If dispositions were irreducibly relational, you could\
  \ not certify a breaker in a lab and ship it to a house. You would have to certify\
  \ the breaker-house pair. It also rules out **Radical Verificationism** (no fact\
  \ until test). If failure in the lab were always definitive absence, manufacturers\
  \ couldn't blame the rig. The ability to appeal a test failure presupposes a fact\
  \ of the matter about the device's structure independent of the specific test instance.\n\
  \n**3. Internal Consistency**\nThe practice is internally consistent ontologically\
  \ but **epistemically asymmetric**. It does not need two notions of disposition,\
  \ but it does employ two distinct *epistemic policies* regarding maskers. \n*  \
  \ **Lab Policy:** Assume ideal conditions. If manifestation fails, assume absence\
  \ of basis. (Burden on manufacturer to prove rig error).\n*   **Field Policy:**\
  \ Assume non-ideal conditions. If manifestation fails, assume external masker. (Burden\
  \ on plaintiff to prove structural defect).\nThis isn't a contradiction; it's a\
  \ risk allocation strategy. The lab is designed to strip away maskers to test the\
  \ basis. The field is assumed to contain maskers. Everyone notices the difference,\
  \ but they treat it as procedural, not metaphysical.\n\n**4. Underdetermination**\n\
  The practice is radically underdetermined regarding the **nature of the categorical\
  \ basis**. The paperwork doesn't care if the trip mechanism is thermal, magnetic,\
  \ or digital, provided it survives the test. Multiple metaphysical realizations\
  \ (microstructures) are licensed equally well. The certification attaches to the\
  \ *functional profile*, leaving the underlying ontology of the basis open. This\
  \ is why you can retrofit old designs with new materials without re-certifying the\
  \ metaphysics, only the performance.\n\n**5. The Rival Swap: Consequences of Relationalism**\n\
  If we swapped to **Relational/Contextualism** (dispositions are only in the device-environment\
  \ pair), the industry collapses and rebuilds as follows:\n*   **Certification Rule:**\
  \ Labs must certify *installations*, not units. A breaker is only \"safe\" relative\
  \ to the specific panel and load profile it was tested with. Unit-level UL labels\
  \ become meaningless.\n*   **Failure Protocol:** Field failures are never \"device\
  \ defects.\" They are \"system mismatches.\" Investigation focuses on why the environment\
  \ failed to support the disposition, not why the device failed to manifest it.\n\
  *   **Liability Doctrine:** Manufacturers are rarely liable. Liability shifts to\
  \ installers and property owners for failing to maintain the reciprocal conditions\
  \ required for the safety power to exist. The \"defect\" is always in the relationship,\
  \ never the relatum.\n\n**Verdict on the Tension**\nYou are half-right. There is\
  \ a tension, but it is not metaphysical; it is **administrative**. You identified\
  \ a shift in the burden of proof regarding *ceteris paribus* clauses. In the lab,\
  \ we assume the *ceteris paribus* holds (no maskers), so failure indicts the device.\
  \ In the field, we assume the *ceteris paribus* fails (maskers exist), so failure\
  \ indicts the environment. \n\nThis is not a contradiction in the nature of dispositions,\
  \ but a pragmatic necessity. If we treated field failures as evidence of absence\
  \ (like the lab), manufacturers would be liable for spider webs. If we treated lab\
  \ failures as evidence of masking (like the field), certification would never conclude.\
  \ The practice presupposes that dispositions are intrinsic powers that can be masked,\
  \ and it simply toggles the default assumption about whether masking is occurring\
  \ based on the context of inquiry. The metaphysics holds; the epistemology pivots."
