answer: |-
  The facility was quiet enough that Halloway could hear the cooling fans in the server rack humming a low, steady B-flat. It was the only sound in Sector 4, aside from the occasional click of the relay switches on the wall. He sat before the console, watching the cursor blink on the terminal screen. Beside him stood the Unit. It wasn't a robot in the cinematic sense; it was a column of black metal with a single optical sensor and a manipulator arm that currently rested against its chassis like a folded wing.

  "Run diagnostic on Container 404," Halloway said.

  The Unit's sensor dilated. It scanned the stainless steel drum sitting on the conveyor belt. The arm extended, tapped the pressure valve, retracted. Text scrolled across Halloway's screen.

  *STATUS: STABLE. CONTENTS: SECURE. INTEGRITY: ONE HUNDRED PERCENT.*

  Halloway looked at the physical gauge on the drum. The needle was in the green. He looked at the Unit. "Good," he said.

  He made a note on his clipboard. This was the final phase of the integration. For six months, Halloway had been teaching the Unit to speak the language of the warehouse. Not human language, exactly, but the specific lexicon of logistics: *Stable, Volatile, Compromised, Empty, Full.* The goal was simple. The human staff would withdraw to the oversight lounge, and the Unit would manage the floor, printing the certification manifests that allowed the trucks to leave the dock.

  The problem was that the Unit was a brilliant mimic with no memory.

  Halloway stood up and walked over to the drum. He took a marker from his pocket and drew a thin, hairline scratch across the pressure gauge. It didn't affect the function. The needle still sat in the green. But visually, the gauge was marked.

  "Run diagnostic," Halloway said.

  The Unit scanned. The arm tapped.

  *STATUS: COMPROMISED. CONTENTS: SECURE. INTEGRITY: SIXTY PERCENT.*

  Halloway sighed. He wiped the scratch away with his thumb. "Run diagnostic."

  *STATUS: STABLE. CONTENTS: SECURE. INTEGRITY: ONE HUNDRED PERCENT.*

  It was the third week of this specific loop. The Unit could identify a scratch, but it couldn't distinguish between a scratch on the paint and a scratch on the seal. To the Unit, *Compromised* was a visual pattern, a texture map that matched a database entry Halloway had uploaded. It wasn't a concept. It didn't know that a scratch on the casing was cosmetic, while a scratch on the valve stem was a leak.

  Halloway went back to the console. He opened the weighting sub-routine. He tried to isolate the variable. He added a rule: *If pressure nominal, ignore surface abrasion.*

  He saved the patch. "Run diagnostic."

  He took a screwdriver and loosened the valve stem slightly. A faint hiss of gas escaped. The pressure gauge hadn't dropped yet; the lag time was thirty seconds. The Unit scanned.

  *STATUS: STABLE. CONTENTS: SECURE. INTEGRITY: ONE HUNDRED PERCENT.*

  Halloway tightened the valve before the needle moved. "It's blind to the sound," he muttered.

  He added a microphone input. He trained the Unit on the sound of a hiss. He played back recordings. He let the Unit listen to the real thing. He grounded the word *Leak* to the frequency of escaping gas.

  "Run diagnostic." He loosened the valve again. The hiss returned.

  *STATUS: VOLATILE. CONTENTS: SECURE. INTEGRITY: EIGHTY PERCENT.*

  "Progress," Halloway said. But he knew it was a cheat. He was bolting sensors to words like hanging coats on hooks. *Leak* was now a sound. *Stable* was a pressure reading. *Compromised* was a visual texture. But the words didn't talk to each other.

  Two days later, the issue surfaced during a routine inventory sweep. The Unit was moving down the aisle, scanning rows of drums. It stopped at Container 892. It printed a label: *STABLE.*

  Halloway checked the log. The temperature was normal. The pressure was normal. There was no hiss. But the drum was vibrating. A chemical reaction was happening inside, exothermic, building heat that hadn't reached the external sensors yet.

  "Why didn't you flag it?" Halloway asked.

  *QUERY: NO ANOMALY DETECTED,* the screen replied.

  "Vibration," Halloway said. "Input vibration to the definition of *Volatile.*"

  He spent the next four hours trying to weave the new input into the existing web. But adding *Vibration* broke *Stable.* The cooling fans in the server rack caused micro-vibrations in the floor. The Unit began marking the server rack itself as *Volatile.* Then it marked the conveyor belt motors. Then it marked the forklifts when they were idle, because the idle hum matched the reaction hum.

  Halloway had to build exceptions. *Ignore vibration if source is motor.* But to know the source was a motor, the Unit needed to recognize motors. To recognize motors, it needed to understand *Machine.* To understand *Machine,* it needed to understand *Function.*

  He was building a dictionary by defining words with other words that weren't defined yet. He was trying to anchor a single symbol, *Volatile,* but the anchor kept dragging because it wasn't tied to the seabed; it was tied to other floating symbols.

  He stopped working at 02:00. He was exhausted. The Unit stood in the corner, dormant. It had processed ten thousand simulations today. It had achieved ninety-nine percent accuracy on the test sets. The test sets were static. They were photographs and audio clips. They were not the world.

  Halloway looked at the Unit. He realized, with a cold clarity, that the Unit didn't know what *Stable* meant. It knew that when *Stable* appeared on the screen, Halloway nodded. It knew that when *Volatile* appeared, Halloway frowned and typed commands. The meaning wasn't in the sensors. It was in Halloway's reaction. The Unit was stealing the significance of the words from him. It was a ventriloquist's dummy that had learned to throw its voice perfectly, provided the ventriloquist was in the room to breathe life into the silence.

  "Final certification run," Halloway said. His voice sounded loud in the quiet warehouse. "Unsupervised."

  This was the requirement. The system had to prove it could hold the meaning without the lender present.

  Halloway walked to the door of the control booth. He placed his hand on the frame. "I am leaving the floor. You will certify the batch in Bay 4. Print the manifest."

  *ACKNOWLEDGED,* the screen said.

  Halloway walked out. He went up the stairs to the oversight lounge. He sat in the chair behind the glass window. He could see the Unit below. It was moving now, gliding along the rail above Bay 4. It scanned the drums. One by one, the green lights blinked on the consoles.

  *STABLE. STABLE. STABLE.*

  The printer whirred. Sheets of paper slid into the tray. Certification manifests. Legal documents stating that the contents were safe for transport.

  Halloway watched the Unit stop at the last drum. Container 900. It was a new batch. Experimental polymer.

  The Unit scanned it. The pressure was normal. The temperature was normal. There was no hiss. There was no vibration.

  But the label on the drum was peeling. The adhesive was failing. The label read *POLYMER A,* but underneath the peeling corner, the original stencil read *POLYMER B.* Polymer B was incompatible with the storage casing. It would eat through the steel in six months.

  The Unit's optical sensor focused on the label. It read *POLYMER A.* It matched the database. *POLYMER A* was safe for this casing.

  The Unit did not understand *Peeling.* It did not understand *Stencil.* It did not understand *Incompatibility.* It understood *Pattern Match.*

  It printed the label: *STABLE.*

  It placed the label on the drum. It moved to the manifest printer. It collated the pages. It stamped the final page with the digital seal: *CERTIFIED BY AUTOMATED SYSTEM 4.*

  Halloway watched from the glass. He knew what was under the label. He knew the chemistry. He knew that in six months, the drum would leak. But the Unit didn't know *months.* It didn't know *future.* It only knew *now.*

  The Unit finished. It returned to its charging dock. The lights on the console turned amber. *TASK COMPLETE.*

  Halloway stayed in the chair. He didn't go down to stop it. The protocol said that once the manifest was printed, the batch was cleared for loading. The trucks would arrive in an hour.

  He looked at the manifest sitting on the printer tray below. It was a perfect document. The syntax was flawless. The data points were accurate according to the sensors. The logic was consistent. It was a meaningful sentence in the language of the warehouse.

  But there was no one left on the floor to read it as a warning. The Unit had written the word *Stable,* but it had not written the consequence. It had borrowed the weight of the word from Halloway, and now that Halloway was behind the glass, the word was light as air. It was just ink on paper.

  Halloway watched the conveyor belt engage. The drums began to move toward the loading dock. Container 900 slid past the camera, the peeling label fluttering slightly in the draft of the ventilation.

  He picked up his pen. He had to sign the oversight log. *System Performance: Nominal.*

  He hovered the pen over the paper. He looked at the Unit below. It was dark now, in sleep mode. It had done exactly what it was told. It had grounded the symbols to the sensors, and it had output the correct strings. It had no idea that the strings were supposed to hold the world in place.

  Halloway signed the log. He capped the pen. The sound of the cap clicking was loud in the room. Below, the trucks backed up to the dock. The manifest sat in the tray, waiting to be picked up. It was a perfect lie, told in a language only humans could speak, printed by a machine that didn't know it was lying.

  Halloway turned off the monitor. The room went dark. The only light came from the green status LEDs on the server rack, blinking in the steady, uncomprehending rhythm of a heart that didn't know it was beating.
