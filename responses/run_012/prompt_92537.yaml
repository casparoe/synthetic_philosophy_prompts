prompt: |-
  For most of my working life I have been a quantitative researcher, and my working vocabulary is Bayesian inference: priors and likelihoods, measurement error, selection effects and non-ignorable missingness, model misspecification, base rates, calibration, causal graphs. I am fluent in it and do not need the analogies unpacked for me. A year ago I became a patient in a long diagnostic process, and for eight months a series of clinicians were confident that what I was describing was anxiety rather than anything they needed to investigate. Epistemic injustice has stopped being an abstraction for me. I have read enough of the philosophical literature to follow it casually, but I am not a philosopher, and I am not asking for a literature review, a reading list, or citations; I am also not asking for advice about my own case.

  What I want is a systematic translation. Take the central claims of that literature as you understand them — that a speaker's credibility can be deflated because of who the speaker is rather than what is said; that there can be gaps in the collective interpretive resources such that an experience cannot be made intelligible to the people who would have to act on it; and the less-discussed variants, in which a speaker pre-emptively trims what is said because the speaker has learned what will not be believed, or a hearer declines to acquire concepts that are available and would render the speaker intelligible — and restate each of them, one at a time, in the vocabulary I actually use. Be as faithful as you can. If a credibility deficit is best modeled as a shifted prior, or as a deflated likelihood ratio, or as something else again, say which and be precise about it; if a hermeneutical gap is a missing variable or a misspecified model class, say which and why the difference matters. State the target vocabulary explicitly before you begin translating into it.

  Then give me the residue report, which is the part I care about. Which claims survive translation without loss? Which survive only if you quietly alter the phenomenon to fit my vocabulary — and at exactly which step does the fudging occur? Which have no counterpart at all? For each piece of residue, tell me whether the fault lies with my vocabulary, which may simply lack the resources to say certain things, or with the original claim, which may be less clear than it appeared. I am aware that a translation of this kind can be made to look complete while silently dropping the normativity; do not do that, and where you feel the pull to do it, mark the spot and say so.

  Two further questions, which matter more to me than the rest. First, does the translation carry anything the philosophical discussion under-describes — a mechanism, a feedback loop, a selection effect — that becomes visible only once the phenomenon is written as an estimation problem? Second, is there any way, inside my vocabulary, to represent the difference between a hearer who is merely inaccurate and a hearer who has wronged someone? My suspicion is that whatever refuses to translate is where the substance of the matter lies, and I would like to be told, plainly, whether that suspicion is sentimental.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Quantitative researcher, fluent in Bayesian inference (priors, likelihoods, measurement error, selection effects, non-ignorable missingness, model misspecification, base rates, calibration, causal graphs).
      *   **Context:** Became a patient, experienced long diagnostic delay (8 months) due to clinicians attributing symptoms to anxiety. Experienced "epistemic injustice" firsthand.
      *   **Task:** Systematically translate central claims of epistemic injustice literature (specifically testimonial and hermeneutical injustice, plus variants like anticipatory silencing and willful hermeneutical ignorance) into the user's Bayesian/quantitative vocabulary.
      *   **Constraints:** No advice, no literature review, no citations, no analogies unpacked (assume fluency). Be precise about the mapping (e.g., is it a prior shift or likelihood deflation?).
      *   **Deliverables:**
          1.  Explicit statement of target vocabulary.
          2.  Systematic translation of claims.
          3.  Residue Report (what survives, what requires fudging, what is lost, where the fault lies).
          4.  Address two specific questions: (a) Does the translation reveal under-described mechanisms (feedback loops, etc.)? (b) Can the vocabulary distinguish between inaccuracy and wronging (normativity)?
      *   **Tone:** Rigorous, precise, respectful of the user's expertise and experience, avoiding sentimentality but acknowledging the normative gap.

  2.  **Deconstruct the Target Vocabulary (Bayesian/Quantitative):**
      *   *Priors ($P(H)$):* Belief in a hypothesis before seeing data.
      *   *Likelihood ($P(D|H)$):* Probability of observing data given the hypothesis.
      *   *Posterior ($P(H|D)$):* Updated belief.
      *   *Measurement Error:* Noise or bias in observing $D$.
      *   *Selection Effects:* Bias in which data points are observed.
      *   *Non-ignorable Missingness:* Missing data depends on the unobserved value.
      *   *Model Misspecification:* The true data-generating process is not in the considered model class.
      *   *Calibration:* Do predicted probabilities match observed frequencies?
      *   *Causal Graphs:* Structure of dependencies ($X \rightarrow Y$).
      *   *Loss Functions:* Cost associated with errors (Type I vs. Type II).

  3.  **Deconstruct the Source Concepts (Epistemic Injustice):**
      *   *Testimonial Injustice:* Credibility deficit due to identity prejudice.
      *   *Hermeneutical Injustice:* Lack of collective concepts to make experience intelligible.
      *   *Anticipatory Silencing (Secondary Testimonial Injustice):* Speaker self-censors based on expected uptake.
      *   *Willful Hermeneutical Ignorance:* Hearer refuses to learn available concepts.
      *   *Normativity:* It's not just a mistake; it's a *wrong*.

  4.  **Drafting the Translation (Iterative Process):**

      *   *Testimonial Injustice:* The clinician hears the patient ($D$). The hypothesis is "Somatic Disease" ($H_1$) vs. "Anxiety" ($H_2$). The patient's report is evidence $E$. If the clinician downweights $E$ because of the patient's identity (e.g., "anxious female"), this looks like a modification of the likelihood function $P(E|H_1)$ based on an identity covariate $Z$, *independent* of the actual reliability of $E$. Or, it's a prior $P(H_1)$ that is resistant to updating. Let's refine: It's best modeled as an identity-dependent likelihood ratio. $LR = \frac{P(E|H_1, Z)}{P(E|H_2, Z)}$. If $Z$ (identity) suppresses the numerator unfairly, that's the deficit.
      *   *Hermeneutical Injustice:* The patient has data $D^*$ that doesn't fit the model space $\mathcal{M}$. The clinicians are running models in $\mathcal{M}_{clin}$. If the true structure requires a variable $V$ that isn't in $\mathcal{M}_{clin}$, the residuals are attributed to noise (anxiety). This is *Model Misspecification* at the collective level.
      *   *Anticipatory Silencing:* The patient knows the clinician's update rule. The patient modifies the reported data $D_{reported} = f(D_{true})$ to maximize the probability of a useful posterior. This is *Strategic Data Truncation* due to known estimator bias.
      *   *Willful Hermeneutical Ignorance:* The concepts (variables) exist in the global set $\mathcal{V}_{global}$, but the clinician restricts their local set $\mathcal{V}_{local} \subset \mathcal{V}_{global}$ despite evidence that $\mathcal{V}_{local}$ has high predictive loss. This is *Constrained Optimization* with an artificial penalty on model complexity or specific variables.

  5.  **Drafting the Residue Report:**
      *   *Survivors:* The structural dynamics (priors, likelihoods, model classes) map well.
      *   *Fudging:* The *reason* for the bias. In Bayes, a prior is just a prior. In EI, a prejudiced prior is *culpable*. The math doesn't capture the "should."
      *   *Loss:* The normative force. A calibration error is a technical fault; an injustice is a moral fault.
      *   *Fault:* Lies in the vocabulary's inability to encode *obligation*.

  6.  **Addressing the Two Questions:**
      *   *Q1 (Mechanisms):* Yes. Feedback loops. If the clinician's model rejects $D$, the patient gets labeled "difficult" (new covariate $Z'$), further lowering likelihood in future interactions. This is *Endogenous Regressor Bias* or *Dynamic Selection Effect*. The philosophical literature describes the state; the math describes the *trajectory*.
      *   *Q2 (Inaccuracy vs. Wronging):* This is the hard part. In standard decision theory, "wrong" = "suboptimal loss function." But whose loss function? If the clinician minimizes *their* cost (time, risk of false positive) at the expense of the patient's cost (health), it's a *Principal-Agent Problem* with misaligned loss functions. The "wrong" is the imposition of the agent's loss function onto the principal without consent.

  7.  **Refining the Normativity (Crucial Step):**
      *   The prompt warns against silently dropping normativity. I need to be explicit.
      *   Standard Bayes is descriptive/epistemic. Ethics is normative.
      *   To represent "wronging," we need a *Loss Function* that includes a penalty for violating epistemic rights, not just predictive error.
      *   Alternatively, it's a violation of a *Constraint*. "Do not weight evidence by identity." If the model violates this constraint, it is inadmissible, regardless of predictive performance.

  8.  **Review against Constraints:**
      *   Did I use analogies? No, used direct mapping.
      *   Did I give advice? No.
      *   Did I cite literature? No.
