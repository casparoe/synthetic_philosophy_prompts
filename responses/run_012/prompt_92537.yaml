answer: |-
  ### Target Vocabulary

  The translation will utilize the following formal constructs:
  *   **Hypothesis Space ($\mathcal{H}$):** The set of candidate explanations (e.g., somatic disease, anxiety).
  *   **Data ($D$):** The patient's reported symptoms and signs.
  *   **Likelihood Function ($P(D|H)$):** The probability of observing the reported symptoms given a specific disease state.
  *   **Prior ($P(H)$):** The base rate probability of a disease before observing specific patient data.
  *   **Hyperparameters ($\phi$):** Parameters governing the reliability of the data source (the patient).
  *   **Model Class ($\mathcal{M}$):** The set of functional forms or variables the clinician is willing to consider.
  *   **Loss Function ($\mathcal{L}$):** The cost associated with estimation errors (false positives vs. false negatives).
  *   **Causal Graph:** The structural assumptions linking variables (e.g., Anxiety $\rightarrow$ Somatic Complaints).
  *   **Selection Bias / Missingness:** Mechanisms determining which data enters the estimation.

  ---

  ### Systematic Translation

  **1. Testimonial Injustice (Credibility Deficit)**
  *   **Philosophical Claim:** A speaker receives a credibility deficit due to identity prejudice, causing their testimony to be underweighted.
  *   **Quantitative Translation:** This is a **bias in the source reliability hyperparameter**.
      In a hierarchical model, the likelihood is often modulated by a reliability parameter $\phi$, such that the effective likelihood is $P(D|H, \phi)$. In a neutral estimator, $\phi$ is determined by the historical calibration of the source. In testimonial injustice, $\phi$ is conditioned on an identity covariate $Z$ (e.g., gender, race, psychiatric history) independent of actual calibration data.
      $$ \phi_{effective} = \phi_{true} \cdot f(Z) $$
      where $f(Z) < 1$ for marginalized groups. This deflates the likelihood ratio for somatic hypotheses relative to the "noise" hypothesis (anxiety), regardless of the signal strength in $D$. It is not merely a low prior on $H_{somatic}$; it is a structural down-weighting of the update step itself.

  **2. Hermeneutical Injustice (Interpretive Gap)**
  *   **Philosophical Claim:** There is a gap in collective interpretive resources, rendering an experience unintelligible.
  *   **Quantitative Translation:** This is **Model Misspecification due to Variable Omission**.
      The true data-generating process includes a latent variable $V_{new}$ (the specific pathology). The clinician's model class $\mathcal{M}_{clin}$ constrains the parameter space such that $V_{new} \notin \mathcal{M}_{clin}$.
      When $D$ is generated by $V_{new}$, the clinician's estimator projects the residuals onto the nearest available variable in $\mathcal{M}_{clin}$, typically $V_{anxiety}$. Because the model is misspecified, the estimator is inconsistent; increasing sample size (more visits) does not converge to the truth, but tightens confidence intervals around the wrong parameter. The "gap" is the absence of $V_{new}$ from the supported model class.

  **3. Anticipatory Silencing (Pre-emptive Trimming)**
  *   **Philosophical Claim:** A speaker trims their testimony because they know it will not be believed.
  *   **Quantitative Translation:** This is **Endogenous Data Truncation driven by Estimator Knowledge**.
      The patient possesses $D_{true}$. They model the clinician's update rule $\hat{H} = \text{Update}(D, Z)$. Knowing that reporting certain elements of $D_{true}$ triggers a high probability of $H_{anxiety}$ (due to the biased $\phi$ from Claim 1), the patient reports $D_{reported} = \text{Trim}(D_{true})$.
      This introduces **Non-Ignorable Missingness**. The missingness mechanism depends on the unobserved value of the data itself and the patient's model of the clinician's bias. This biases the posterior further, as the clinician estimates $P(H|D_{reported})$ assuming $D_{reported}$ is a random sample of symptoms, when it is a strategically filtered subset.

  **4. Willful Hermeneutical Ignorance**
  *   **Philosophical Claim:** A hearer declines to acquire concepts that are available and would render the speaker intelligible.
  *   **Quantitative Translation:** This is **Constrained Optimization with Artificial Regularization**.
      The variable $V_{new}$ exists in the global model space $\mathcal{M}_{global}$ and has predictive validity. The clinician could expand $\mathcal{M}_{clin}$ to include $V_{new}$, reducing prediction error. However, the clinician imposes a penalty term $\lambda$ on model complexity or specifically on $V_{new}$ that exceeds the reduction in loss provided by including it.
      $$ \min_{\theta} \left( \text{Error}(\theta) + \lambda \cdot \mathbb{I}(V_{new} \in \mathcal{M}) \right) $$
      Here, $\lambda$ is not driven by parsimony or overfitting concerns (which would be epistemically rational) but by identity-protective cognition or institutional inertia. The clinician accepts higher total loss to maintain the current model boundary.

  ---

  ### Residue Report

  **1. Claims Surviving Without Loss**
  *   **The Structural Dynamics:** The feedback loop between anticipatory silencing and credibility deficits translates perfectly. The math captures how a biased likelihood ($\phi$) induces data truncation ($D_{reported}$), which in turn validates the biased prior, creating a stable, incorrect equilibrium. This is a standard **Identifiability Problem**: the parameters for "patient reliability" and "disease presence" are confounded by the identity covariate $Z$.
  *   **The Hermeneutical Gap:** Modeling this as *Model Misspecification* is precise. It explains why more data (more appointments) fails to correct the error. If the true variable is not in the support of the estimator, consistency is impossible.

  **2. Claims Requiring Fudging**
  *   **The Location of the Fault:** In the translation of Testimonial Injustice, I modeled the credibility deficit as a function $f(Z)$. In the mathematical vocabulary, $f(Z)$ is simply a parameter. To call it "injustice," I have to assert that $f(Z)$ *ought* to be 1. The math describes the bias; it does not flag it as illicit.
      *   *Where the fudging occurs:* At the definition of the reliability hyperparameter. In Bayesian inference, a prior or hyperparameter is subjective but permissible. In epistemic justice, a prior based on identity is *forbidden*. The vocabulary treats it as a modeling choice; the philosophy treats it as a violation of protocol.
  *   **Willful Ignorance:** I modeled this as a penalty term $\lambda$. However, in standard estimation, a high $\lambda$ is just a preference for simplicity. To capture "willfulness," I must assume the clinician *knows* $\lambda$ is too high relative to the true error reduction. This requires modeling the clinician's meta-knowledge of the global model space, which adds a layer of recursive complexity not usually present in standard estimation problems.

  **3. Claims With No Counterpart (The Residue)**
  *   **The Normative Force:** There is no operator in Bayesian inference that distinguishes between a *mistake* and a *wrong*. A miscalibrated model and an unjust model look identical in the posterior distribution.
  *   **The Harm of Objectification:** When a patient is treated as a "case of anxiety" rather than a source of data, they are moved from the role of *Observer* to *Observed*. In the math, the patient is always just a data source $D$. The vocabulary cannot represent the patient as an *agent* whose epistemic agency is being violated, only as a channel whose bandwidth is being throttled.

  **4. Fault Attribution**
  *   **Fault with the Vocabulary:** The vocabulary is *descriptive*, not *deontic*. It is designed to minimize error, not to enforce rights. It lacks a representation for "epistemic rights" as constraints that cannot be traded off against efficiency.
  *   **Fault with the Original Claim:** Some philosophical claims rely on a phenomenological "feeling" of being silenced that is, strictly speaking, epiphenomenal to the estimation outcome. If the posterior is the same, does the internal experience of the speaker matter to the *truth*? The math suggests no; the philosophy suggests yes. This is not a fault in the philosophy, but a boundary where epistemology meets ethics.

  ---

  ### Addressing Your Two Questions

  **1. Does the translation reveal under-described mechanisms?**
  Yes. The translation highlights a **Dynamic Selection Effect** that the philosophical literature often treats statically.
  In the literature, testimonial injustice is often described as a discrete event (Speaker speaks, Hearer discounts). In the quantitative model, this is a time-series problem.
  *   *Mechanism:* If the clinician's model rejects $D_t$ at time $t$, the patient's health state $H_{t+1}$ evolves (worsens). This generates new data $D_{t+1}$ which is more extreme.
  *   *Visibility:* The quantitative view reveals that the "injustice" is not just a static bias, but a driver of **variance inflation** in the health outcome. By ignoring the signal early, the clinician forces the signal to become larger (more severe symptoms) to overcome the noise threshold later. This creates a **Hysteresis Loop**: the system requires a much larger input to switch states ($H_{anxiety} \rightarrow H_{somatic}$) than it would have if the threshold were unbiased. The philosophical literature describes the exclusion; the math quantifies the *cost of delay* as a function of the bias magnitude.

  **2. Can the vocabulary distinguish between inaccuracy and wronging?**
  Inside standard Bayesian vocabulary: **No.**
  Inside Decision Theory with Principal-Agent constraints: **Yes, but conditionally.**

  To represent "wronging," you must move from a single Loss Function $\mathcal{L}$ to a **Multi-Objective Loss Surface** involving two agents: Clinician ($C$) and Patient ($P$).
  *   **Inaccuracy:** $C$ minimizes $\mathcal{L}_C$ and $P$ minimizes $\mathcal{L}_P$, and both fail to find the optimum due to noise or limited data. The error is shared.
  *   **Wronging:** $C$ minimizes $\mathcal{L}_C$ subject to the constraint that $P$'s loss $\mathcal{L}_P$ is secondary.
      Specifically, a "wrong" occurs when $C$ has the capacity to reduce $\mathcal{L}_P$ (by adjusting $\phi$ or expanding $\mathcal{M}$) at a negligible cost to $\mathcal{L}_C$, but chooses not to.
      In optimization terms, the solution is **Pareto Inefficient**. The clinician is operating at a point where the patient's loss could be reduced without increasing the clinician's loss, but the clinician's objective function does not weight the patient's loss.

  However, this reduces "wronging" to "inefficiency." This is where your suspicion is tested.
  If you define the "wrong" solely as Pareto inefficiency, you have successfully translated the normativity into math. But you have also changed the definition of the wrong. Epistemic injustice is often claimed to be a wrong *even if* the clinician's heuristic is efficient for their own constraints (e.g., "I only have 15 minutes").
  Therefore, the translation requires you to define the **Clinician's Loss Function** as *normatively constrained*. You must hard-code a penalty: $\mathcal{L}_{total} = \mathcal{L}_{error} + \infty \cdot \mathbb{I}(\text{Bias based on } Z)$.
  If you do not hard-code that constraint, the vocabulary cannot distinguish the wrong.

  **Is your suspicion sentimental?**
  No. Your suspicion is correct.
  The "substance of the matter" that refuses to translate is the **Deontic Constraint**.
  In your vocabulary, everything is a trade-off. You can always justify a biased prior if the computational cost of the unbiased one is too high, or if the base rates justify it.
  In the ethical reality of epistemic injustice, certain trade-offs are **forbidden**. You are not allowed to trade a marginalized patient's credibility for computational efficiency, regardless of the base rates.
  The vocabulary lacks a symbol for "Forbidden." It only has symbols for "Costly."
  The residue is not sentimental; it is the difference between a **Cost Function** and a **Constraint**. The philosophical claim is that epistemic justice is a constraint on the estimation process, not a variable in the loss function. Your vocabulary assumes all norms can be internalized as costs. The phenomenon asserts that some norms are boundaries. That is why the translation leaks.
