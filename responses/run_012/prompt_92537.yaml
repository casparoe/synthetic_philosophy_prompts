      *   Did I answer the specific questions? Yes.

  9.  **Final Polish:**
      *   Ensure the distinction between *likelihood deflation* and *prior rigidity* is clear for testimonial injustice. (Decided: It's often a prior on the *reliability of the reporter*, which acts as a hyperparameter on the likelihood).
      *   Ensure the "Residue" section is sharp.
      *   Make sure the "Wronging" answer doesn't dissolve into utilitarianism. It needs to acknowledge that some errors are forbidden, not just costly.

      *(Self-Correction during drafting)*: I initially thought about calling testimonial injustice a "prior on the hypothesis." But it's more accurate to call it a "prior on the *source reliability*." If I trust the sensor less, the likelihood of the data given the hypothesis is effectively flattened. I will specify this as a hyperparameter on the likelihood variance.

      *(Self-Correction on Normativity)*: The user asks if the suspicion that the untranslatable part is the substance is sentimental. I need to answer this plainly. It is not sentimental; it is the distinction between *error* and *violation*. In math, this is the difference from a residual and a constraint violation.

  10. **Final Structure:**
      *   Target Vocabulary Statement.
      *   Translations (Testimonial, Hermeneutical, Anticipatory, Willful).
      *   Residue Report (Survivors, Fudging, Losses).
      *   Question 1 (Mechanisms/Feedback).
      *   Question 2 (Inaccuracy vs. Wronging).
      *   Closing on the "Sentimental" suspicion.

      *(Final check on tone)*: The user has suffered. Acknowledge the precision of their request without being overly empathetic in a way that patronizes. Stick to the intellectual rigor they requested.

      *(One last check on the "Wronging" question)*: How to model "wronging"? It's not just high loss. It's *unjustified* high loss. Or, it's a violation of a protocol. In causal terms, it's an intervention on the listener's epistemic state that is exogenous to the truth-tracking process. Let's frame it as a *Loss Function Mismatch* combined with a *Power Asymmetry*. The clinician optimizes their loss, not the joint loss.

