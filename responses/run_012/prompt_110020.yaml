answer: |-
  There is no single common English word for this, but there are three established concepts from different fields that describe pieces of it. When you combine them, you get the full picture.

  1.  **Philosophy of Science:** *The Theory-Ladenness of Observation.* (Hanson/Kuhn). You cannot observe data neutrally; you interpret it through your existing theories. If your theory says "X is impossible," your brain categorizes the observation of X as "Error" rather than "Data."
  2.  **Safety Engineering:** *Normalization of Deviance.* (Diane Vaughan). When a system produces a warning signal (anomaly) and nothing bad happens immediately, you categorize the signal as noise. Over time, the "safe" range drifts to include the warning signal.
  3.  **Bayesian Statistics:** *Dogmatic Priors.* If you assign a hypothesis a probability of 100% (or 0%), no amount of evidence can ever update that belief. The math literally forbids learning.

  However, none of these quite capture the specific *engineering* move you described: the act of using a model's guarantee to invalidate the reality the model is supposed to represent.

  Since there isn't a standard label, I propose we call this **Axiomatic Dismissal**.

  Here is the breakdown of what that move is, where the edges are, and how to spot it before it burns you.

  ### The Move: Axiomatic Dismissal

  **Definition:** Treating a contingent engineering claim (e.g., "the queue guarantees exactly-once") as an immutable axiom (e.g., "duplicates are impossible"), and using that axiom to falsify empirical evidence rather than using evidence to test the axiom.

  **Why it feels like logic:**
  It *is* logically valid, provided the premise is true.
  *   *Premise:* The system guarantees exactly-once processing.
  *   *Observation:* A duplicate charge exists.
  *   *Conclusion:* The observation is not a duplicate charge (it is a query error, a replay, etc.).

  This is a valid *Modus Tollens* argument. The failure isn't in the logic; it's in the **truth value of the premise**. In distributed systems, "exactly-once" is often a lie (or a shorthand for "idempotent with high probability"). By treating a probabilistic guarantee as a logical certainty, you create a **Self-Sealing System**.

  ### The Edges: When is it okay?

  You need to know when it is rational to trust the model over the measurement, and when it is Axiomatic Dismissal.

  **1. The Independence Test (The Hard Edge)**
  *   **Valid:** You dismiss the data because the measurement tool is *independently known* to be less reliable than the model.
      *   *Example:* Your GPS says you are in a lake, but your map and visual confirmation say you are on the road. You trust the map/eyes because GPS multipath error is a known, independent failure mode.
  *   **Axiomatic Dismissal:** You dismiss the data because the measurement tool is *downstream* of the system you are trusting.
      *   *Example:* Your Job Runner writes to the Ledger. You find a duplicate in the Ledger. You say "Job Runner is perfect, so Ledger query is wrong."
      *   *Why it fails:* The Ledger is the *only* evidence you have of the Job Runner's behavior. If the Job Runner is lying, the Ledger is the only place it shows up. Dismissing the Ledger is dismissing the only interface to reality you have.

  **2. The Probability Mass Test (The Soft Edge)**
  *   **Valid:** You treat the guarantee as high probability (99.999%), and the error as low probability. You investigate the error, but you weight the investigation toward the known flaky component.
  *   **Axiomatic Dismissal:** You treat the guarantee as probability 1.0.
      *   *The Tell:* If you find yourself saying "That *can't* happen" rather than "That *shouldn't* happen," you have entered Axiomatic Dismissal. In engineering, nothing "can't" happen except logic gates violating physics.

  **3. The Falsifiability Test**
  *   **Valid:** You can describe what evidence *would* change your mind. "If we see 5 duplicates in an hour, we assume the queue is broken."
  *   **Axiomatic Dismissal:** There is no observable state that would prove the system wrong. Any duplicate is defined as "not a real duplicate." This makes the claim unscientific.

  ### Differentiation

  **vs. Confirmation Bias**
  *   **Confirmation Bias:** "I *want* the system to work, so I'll ignore the error." (Emotional/Motivated).
  *   **Axiomatic Dismissal:** "I *know* the system works, so the error must be wrong." (Epistemic/Logical).
  *   *Why it matters:* You cannot fix Axiomatic Dismissal by checking your ego. You fix it by checking your architecture. Confirmation bias is a human problem; Axiomatic Dismissal is a system design problem.

  **vs. Justified Belief**
  *   **Justified Belief:** "We have tested this extensively, so we believe it works. However, this new data is surprising and requires investigation."
  *   **Axiomatic Dismissal:** "We have tested this extensively, therefore this data is invalid."
  *   *The Difference:* Justified belief degrades under counter-evidence. Axiomatic Dismissal uses counter-evidence to reinforce the belief (by proving the "measurement tools" are flaky).

  ### The Danger in Your Specific Context

  In distributed systems, **Exactly-Once Semantics (EOS)** is notoriously fraught. True EOS requires global consensus, which kills performance. Most "EOS" systems are actually **At-Least-Once + Idempotency**.

  If your team believes you have architectural Exactly-Once, you likely have a **Category Error**. You are treating a *business logic guarantee* (idempotency) as an *infrastructure guarantee* (messaging).

  When you see a duplicate charge:
  1.  **Axiomatic Dismissal:** "Queue is perfect. Ledger query is buggy."
  2.  **Engineering Reality:** "Queue delivered twice, or we processed once but wrote twice, or the ledger idempotency key collided."

  ### How to Break the Loop

  To stop Axiomatic Dismissal without falling into paralysis (trusting every blip):

  1.  **Rephrase Guarantees:** Ban the phrase "It can't happen." Replace it with "We have no known mechanism for this to happen." This leaves the door open for unknown mechanisms.
  2.  **Independent Observability:** If you trust the Job Runner more than the Ledger, you need a third source of truth. Log the message ID at the network ingress, the processing start, and the DB write. If the logs say "processed once" but the DB says "charged twice," *then* you can suspect the DB. If the logs are missing, you cannot trust the Runner.
  3.  **The "Pre-Mortem" Rule:** When an anomaly appears, force the team to write down: "If the system *did* fail, what would the evidence look like?" If the answer is "Exactly what we are seeing now," you must update the belief.

  **Summary:** The name is **Axiomatic Dismissal**. It is the error of promoting a hypothesis to an axiom. It is distinct from bias because it feels rational. It is distinct from justified belief because it refuses to update. It is safe only when the model is independent of the measurement; it is fatal when the measurement is the only window into the model's truth.
