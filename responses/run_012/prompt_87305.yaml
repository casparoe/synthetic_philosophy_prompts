          *   Bad/Imprecise: "Water to tea" preference makes the cycle work, but the description of the trades is slightly muddled (swapping coffee for tea, then water for coffee... wait, if I have coffee, I swap for tea. If I have tea, I swap for water. If I have water, I swap for coffee). The essay says: "prefer tea to coffee, pay to swap coffee for tea." (Okay). "Prefer coffee to water, pay to swap water for coffee." (Wait, if I just got tea, how do I swap water for coffee? I need to hold the item I'm swapping *from*). The mechanics of the pump need to be precise.
          *   Claim: "The same trick generalises... completeness... leaves you open to a similar series of trades." This is controversial/weak. Completeness violations don't always lead to standard money pumps without additional assumptions (like "money is better than nothing").
      *   *Paragraph 2 (Link to EUT):*
          *   Good: Mentions vNM theorem.
