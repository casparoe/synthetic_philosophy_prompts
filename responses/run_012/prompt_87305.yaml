      *Revised Mark:* 12/20. It's a bit generous for a coasting student who missed the nuance on the "irrationality" definition. Let's stick with 13/20 but be harsh in the comments. Actually, 13/20 is a 65%. That's a solid pass. For a coasting student in a club setting, that feels right. It acknowledges competence but penalizes lack of depth.

