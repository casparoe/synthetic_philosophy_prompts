      *Tone Check:* Keep it sharp. "Here is where it breaks." "You can't have both."

      *(Final thought on Claim 5)*: "Predication just runs out." This sounds like Wittgenstein or Nagarjuna. If predication runs out, does logic (4) apply? If logic applies, predication hasn't run out. This is a subtle contradiction. I need to point this out.

      *(Final thought on Claim 3)*: "Physics... settles it." If (1) is true, physics can't settle it *full stop*. It can only settle it *from the physics standpoint*. But (3) implies the physics standpoint has privilege. Why? Because it matches the "object" in (2). But if the object is many-sided, why does physics get *the* account? Because physics describes the *rules of the standpoints*? That's the only way to save it.

