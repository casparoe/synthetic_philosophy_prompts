answer: |-
  This is a debugging problem. You have a set of test cases (your gut verdicts) and you're looking for the underlying logic (the principle) that generates them. Your current draft ("position of trust... private benefit... tied to exercise") is a good start, but as you noted, it throws exceptions on the friend/wine case and the campaign donation case.

  Here is the principle that best fits your specific pattern of verdicts, followed by the stress tests and the hard truths you asked for.

  ### 1. The Principle: The Fiduciary Boundary Rule

  **Corruption occurs when an agent vested with *public* or *institutional* decision-making authority accepts a *private* benefit that creates a conflict between their *fiduciary duty* (to the public/institution) and their *personal interest*, unless that exchange is structurally transparent and legally authorized.**

  To make this operational for a software engineer, think of it as a function with four specific checks. If a scenario passes all four checks, it is **Not Corruption**. If it fails Check 1, it's a private matter. If it passes Check 1 but fails Checks 2–4, it is **Corruption**.

  **The Clauses:**

  1.  **The Sphere Clause (Public vs. Private):**
      *   *Rule:* Does the agent hold a role where they are expected to act impartially for a broad constituency (public/state/shareholders), or are they in a relational sphere (family/friends/private ownership)?
      *   *Purpose:* Handles **Case 2 (Friend/Wine)** and **Case 4 (Uncle)**. In the private/relational sphere, partiality is expected (you *should* help your friends/family). In the public sphere, partiality is a bug.
  2.  **The Beneficiary Clause (Private vs. Public/Political):**
      *   *Rule:* Does the benefit accrue to the individual's private wallet/status, or to a political campaign/constituency?
      *   *Purpose:* Handles **Case 5 (Highway)** and **Case 7 (Campaign Donation)**. Steering a highway to your district benefits *voters* (public), not your pocket. Donations go to the *campaign* (legal entity), not the politician personally.
  3.  **The Deviation Clause (Merit vs. Favor):**
      *   *Rule:* Does the benefit result in a decision that deviates from standard procedure, merit, or queue order?
      *   *Purpose:* Handles **Case 1 (Customs)**, **Case 6 (Nurse)**, and **Case 8 (Contract Award)**. The customs officer and nurse change the queue. The contract award ignores merit.
  4.  **The Transparency Clause (Opaque vs. Authorized):**
      *   *Rule:* Is the exchange hidden and informal, or is it declared and regulated?
      *   *Purpose:* Handles **Case 7 (Donation)** again. Donations are public record. Bribes are not. It also creates tension for **Case 3 (Minister's Son)**.

  ---

  ### 2. Stress Testing the Principle

  Here is how the Fiduciary Boundary Rule applies to your new test cases:

  *   **Private Sector Version (CEO hires qualified roommate):**
      *   *Verdict:* **Not Corruption.**
      *   *Logic:* Fails Check 1 (Sphere). A private company is not a public trust; the CEO owes fidelity to shareholders, not the general public. Networking is a feature, not a bug, of private markets.
  *   **Gift to a Public School Teacher:**
      *   *Verdict:* **Corruption (if before grading), Fine (if after).**
      *   *Logic:* Passes Check 1 (Public role). If the gift is given *before* a grade is assigned, it fails Check 3 (Deviation/Conflict) because it creates an incentive to deviate from impartial grading. If given *after* as thanks, it is socially awkward but lacks the *quid pro quo* incentive structure. Most school districts ban this regardless to satisfy Check 4 (Transparency).
  *   **Elected Official vs. Appointed:**
      *   *Verdict:* **Same Standard.**
      *   *Logic:* Check 1 applies to both. Elected officials actually have a *higher* fiduciary duty to the whole constituency, not just their donors. However, Check 2 (Beneficiary) allows for "pork barrel" spending (Case 5) because their job is literally to advocate for their district, whereas an appointed bureaucrat must be neutral.
  *   **Favor in Kind (e.g., "I'll fix your roof if you approve my permit"):**
      *   *Verdict:* **Corruption.**
      *   *Logic:* Check 3 (Deviation) cares about *benefit*, not *currency*. A roof repair has monetary value. The medium of exchange does not sanitize the conflict of interest.

  ---

  ### 3. The Sacrifice: Which Verdict to Drop?

  You asked for an honest statement of which verdict the principle cannot accommodate without becoming a "Frankenstein rule."

  **You must soften your verdict on Case 3 (The Minister's Qualified Son).**

  Your gut says: *"I can't shake the feeling that this is corrupt, even though nothing improper happened."*
  The Principle says: *"This is a Conflict of Interest, but not Corruption."*

  **Why:** Corruption requires a *deviation* from duty (Check 3). If the son was genuinely qualified and went through the normal process, no deviation occurred. The *appearance* of impropriety damages trust, which is dangerous, but labeling it "corruption" conflates **risk** with **act**.

  If you insist Case 3 is corruption, you have to adopt an "Appearance Standard" rather than a "Deviation Standard." But if you do that, you break Case 4 (Uncle). Why? Because hiring a qualified nephew *also* looks like nepotism to an outsider. To keep Case 4 as "Fine," you must admit that Public Roles carry a stricter burden than Private Roles. If you accept that distinction, you must admit that in the Private Role (Uncle), appearance doesn't matter. Therefore, in the Public Role (Minister), appearance alone shouldn't constitute the *act* of corruption without evidence of process deviation.

  **Recommendation:** Reclassify Case 3 as **"Ethical Hazard / Conflict of Interest."** It requires recusal or disclosure, but calling it "corruption" dilutes the meaning of the word for cases where the process was actually rigged.

  ---

  ### 4. The Facilitation Payment (The "Grease" Payment)

  *The Case: A permit you are legally entitled to, which will be granted either way, but takes 6 months without payment and 2 weeks with it.*

  **The Principle's Verdict:** **Corruption.**

  **Why:** It fails Check 3 (Deviation). The "standard procedure" is the published timeline (6 months). By paying, you are purchasing a deviation from the official queue. It also fails Check 4 (Transparency); these payments are almost never receipted or taxed.

  **Why You Waver:**
  Your wavering is not a bug in the principle; it is a feature of the **Systemic vs. Individual** conflict.
  *   **Systemically:** If everyone pays, the official has an incentive to *slow down* the 6-month track to generate more bribes. It degrades the institution.
  *   **Individually:** You are not harming anyone else (the permit is yours by right), and you are saving significant economic value (time).

  **What the wavering tells you:** It tells you that in low-trust environments, the "Fiduciary Duty" of the state has already failed. When the state does not uphold its end of the social contract (efficient processing), the moral cost of adhering to the "No Bribery" principle shifts from the citizen to the system.
  *   **Advice:** The principle labels it corruption because it sustains the broken system. However, your moral calculus is allowed to include "survival." You can acknowledge it is corruption *and* pay it to feed your family, provided you recognize you are reinforcing the bug you are trying to escape.

  ---

  ### 5. The Cultural Question: Western Standard or Universal?

  You asked me not to dodge this. Here is the direct answer:

  **The principle I derived for you is not universal; it is specifically "Weberian."**

  It relies on a specific model of the world (Max Weber's ideal bureaucracy) where the **Public Sphere** and **Private Sphere** are strictly separated.
  *   **In the US/Northern Europe:** This separation is the operating system. Public office is impersonal; private life is relational. Mixing them is a crash.
  *   **In much of Asia, Africa, Latin America, and Southern Europe:** The operating system is **Relational**. Trust is not placed in *institutions*, but in *people*. A public official is expected to prioritize their network (family, clan, region). To *not* hire the minister's son might be seen as a betrayal of your primary social duty.

  **Does the principle hold regardless of local norms?**
  *   **Descriptively:** No. In a relational society, Case 3 (Minister's Son) is not "corruption," it is "responsibility." Case 1 (Customs) might be viewed as a "service fee" in a system where salaries are too low to live on.
  *   **Normatively:** Yes, *if* your goal is scalable, impersonal economic growth and rule of law. The "Western" standard isn't morally superior in a vacuum, but it is technologically superior for managing large, diverse populations where you cannot know everyone personally.

  **What this does to the answer:**
  If you are working in a relational culture, applying this principle rigidly will make you ineffective and potentially rude. You are running Linux software on a Windows machine.
  *   **The Adjustment:** You must distinguish between **Survival Corruption** (facilitation payments, small gifts to maintain relationships) and **Predatory Corruption** (stealing public funds, rigging bids that harm the public).
  *   Your gut reactions (hating the Nurse bribe but accepting the Uncle internship) show you are already doing this. You intuitively understand that family loyalty is universal, but *public* queue-jumping hurts strangers.

  **Final Verdict:** The principle holds for **Institutional Integrity**. It does not hold for **Social Harmony** in all cultures. If you want to build stable institutions, use the principle. If you want to navigate a specific local culture successfully, you must understand where their "Fiduciary Boundary" is drawn, because it is likely drawn differently than yours.
