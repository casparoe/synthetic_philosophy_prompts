answer: |-
  Here is the breakdown of your board's jurisprudence, the competing interpretations, and the strategic path forward.

  ### 1. The Rule You've Actually Been Running
  **"The Ministry Model Veto."**
  Your board operates on a hybrid rule: *Shortage List status grants eligibility, but the Finance Ministry's Long-Term Fiscal Model grants admissibility.*

  *   **Why this fits:**
      *   **The Care Worker:** Admitted explicitly "on the strength of the finance ministry's model." This establishes the Model as the *ratio decidendi* (the reason for the decision), not just the job title.
      *   **The Roofer:** Refused despite Shortage List status because the household fiscal number was negative. This establishes that the Model (or household fiscal math) can veto the Shortage List.
      *   **The Nurses:** Admitted with housing benefits. Under this rule, we assume their long-term model was positive (hospitals are high-value assets), making the short-term benefit acceptable (similar to the Care Worker's decade below tax threshold).
      *   **The Contractor:** Refused. This is a separate "Tax Compliance" corollary: if you don't enter the tax base, the Model cannot calculate a positive, so you are automatically vetoed.

  ### 2. Alternative Rules That Fit the Record
  **Rule B: "The Critical Institutional Lifeline"**
  *   **The Logic:** We admit anyone recruited by a critical physical institution (Hospital, Care Home) that serves a vulnerable population, regardless of fiscal drag, provided they aren't purely offshore (Contractor).
  *   **Fit:** Explains Nurses (Hospital), Care Worker (Care Home). Explains Contractor (No institution). Explains Roofer (General shortage, no specific institution saving a specific building/service).
  *   **Prediction:** **Admit.** The Nursing Assistant is likely recruited by a care home or clinic, and keeping the school open saves a local institution.

  **Rule C: "The Permanent vs. Temporary Drain"**
  *   **The Logic:** We tolerate short-term fiscal costs (housing benefit, school fees, low tax start) if they are temporary. We refuse permanent structural drains (disability benefits, long-term net-negative models).
  *   **Fit:** Explains Nurses (Benefits likely temporary), Care Worker (Low tax for a decade, then positive). Explains Roofer (Disability is permanent). Explains Contractor (Zero tax is permanent).
  *   **Prediction:** **Refuse.** The new model says "Net-Negative" over a *longer horizon*, implying a structural/permanent drain, unlike the Care Worker's temporary dip.

  ### 3. The Closest Analog
  **The Roofer.**

  While the Nursing Assistant shares a *profile* with the Care Worker (care sector, kids in school), she shares a *legal posture* with the Roofer.
  *   **Care Worker:** Shortage List + **Net Positive Model** = Admit.
  *   **Roofer:** Shortage List + **Net Negative Household** = Refuse.
  *   **Nursing Assistant:** Shortage List + **Net Negative Model** = **?**

  The Care Worker precedent establishes that the Model is the tie-breaker. Since the Model has flipped from the Care Worker's scenario to the Roofer's scenario, the Roofer is the binding precedent for the *outcome*. The Board has already ruled that Shortage List status does not override a negative fiscal determination.

  ### 4. How to Vote for Consistency
  **Vote to Refuse.**

  To remain consistent with the board's explicit reasoning in the Care Worker case, you must follow the Model. In the Care Worker case, you did not say, "We admit care workers because they are good." You said, "We admit this care worker *because the math works*."
  If you admit this Nursing Assistant while the math *doesn't* work, you retroactively invalidate the Care Worker precedent. You turn the Care Worker admission into an act of discretion rather than rule-following, which opens the board to accusations of arbitrariness.

  Furthermore, admitting her based on the "school" argument creates a new rule (Local Infrastructure > National Fiscal Model) that you have not tested. The Roofer case proves you are willing to let a shortage go unmet to protect the fiscal balance.

  ### 5. What You Are Committing To
  **If you Refuse:**
  *   **Commitment:** You are committing to **Fiscal Technocracy.** You affirm that the Ministry's National Model is the supreme authority, even over local social survival (the school closing). You prioritize the national balance sheet over district-level vitality.
  *   **Risk:** You may accelerate rural decline. If schools close, young families leave, tax bases shrink further, and the Ministry's model becomes a self-fulfilling prophecy of decline.

  **If you Admit:**
  *   **Commitment:** You are committing to **Local Vitality Override.** You affirm that unmodeled social infrastructure (schools) can veto the Finance Ministry's fiscal models.
  *   **Risk:** You break consistency with the Care Worker and Roofer cases. You invite a flood of appeals where every applicant claims their local school/church/shop needs them to stay open, rendering the Ministry Model advisory rather than decisive.

  ### 6. The One Case That Would Settle the Rule
  To determine whether your board truly follows the **Ministry Model** or the **Local Vitality** rule, you need this specific test case:

  **The "Rural Hospital Saver" Case:**
  *   **Profile:** A General Practitioner (Shortage List).
  *   **Fiscal:** Ministry Model confirms **Net-Negative** over 20 years (high salary but high family costs/benefits).
  *   **Local Impact:** Without this GP, the **local rural hospital loses accreditation and closes.**
  *   **The Test:**
      *   If you **Admit**: Your true rule is **"Critical Infrastructure Survival > Fiscal Model."** (The school in the Nursing Assistant case should have been enough).
      *   If you **Refuse**: Your true rule is **"Fiscal Model is Absolute."** (The Nursing Assistant should definitely be refused, as a school is less critical than a hospital).

  **Current Recommendation:** Until you run that test case, you must vote **Refuse** on the Nursing Assistant. You cannot introduce the "Local Infrastructure Override" on a school closure when you previously refused a Roofer on fiscal grounds. Save that legal shift for the Hospital case.
