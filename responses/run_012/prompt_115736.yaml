answer: |-
  The broken step is **(6)**.

  Here is the step again: *"If their welfare counts the same and there are ten times as many of them, their side of the ledger is ten times heavier than ours."*

  This is the pivot point where a reasonable moral intuition (equality across time) gets converted into an absurd mathematical demand (total utilitarianism). Here is why it looks correct, why it is actually flawed, and what you lose by cutting it out.

  ### Why it looks so good
  Step (6) seduces you because it seems to be the only way to honor Step (2). You have already agreed that a person in 2200 counts as much as a person in 2024. It feels like simple arithmetic: if one future person equals one present person, then ten future people must equal ten present people. To deny this looks like you are secretly reintroducing discounting—you are saying their voices count, but only if they shout in a small enough group. It feels like you are protecting the equality principle by accepting the multiplication.

  ### Why it is broken
  Step (6) smuggles in a controversial metaphysical claim: that society (across time) is a single container for value, and our job is to fill that container as much as possible. This ignores the **separateness of persons**.

  When you say "their side of the ledger is heavier," you are treating ten million future people as a single massive claimant facing off against you. But they are not a single claimant. They are distinct individuals. While you must respect each of them equally (Step 2), you are not required to sum their interests into a super-interest that automatically overrides yours.

  If you accept (6), you are committed to the view that you are merely a vessel for generating utility. If sacrificing your life to subsistence creates a tiny ripple of benefit for enough future people, the math says you must do it. This reduces you to a means to an end. By rejecting (6), you assert that while future people have claims on you, those claims do not aggregate into an infinite demand. You can respect the *individual* worth of a future child without accepting that the *sum total* of all future children creates a moral black hole that swallows the present.

  ### What it costs you
  Rejecting (6) is not free. It costs you the simplicity of the ledger.

  1.  **You lose the arithmetic:** You can no longer solve moral problems by just adding up the units of welfare. There is no clean formula to tell you exactly how much sacrifice is required. You have to replace calculation with judgment.
  2.  **You must accept thresholds:** You have to adopt a view where there is a limit to obligation. You are required to do *a lot* for the future, perhaps even significant sacrifice, but not *everything*. You have to defend a line where "generous" stops and "self-destruction" begins, without a mathematical proof to back it up.
  3.  **You lose the solution to the Repugnant Conclusion:** By rejecting the logic in (6), you avoid the conclusion in (10) (that a huge, miserable population is better than a small, happy one). But the cost is that you can no longer say "more good is always better." You have to admit that quality of life can trump quantity of lives, which requires a more complex theory of value than simple addition.

  ### How this saves your argument
  By cutting Step (6), you preserve Step (2). You still believe the kid in 2200 counts as much as you do. You simply deny that their moral weight multiplies in a way that renders your own life irrelevant.

  This allows you to argue for strong climate action (because their individual claims are serious) without accepting the demand for subsistence (because their claims do not sum to infinity). It turns the problem from a math equation that you are destined to lose into a political and ethical negotiation about fair shares across time. You give up the certainty of the calculation, but you keep your sanity.
