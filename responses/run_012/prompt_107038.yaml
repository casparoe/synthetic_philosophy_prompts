  3.  **Evaluate the Premises (Augustinian vs. Modern/Pragmatic):**

      *   *Premise (2) is the weak link for Augustine.* Augustine would reject the idea that a morally obligatory end sanctifies *any* necessary means. For him, moral law applies to acts themselves, not just outcomes.
      *   *Premise (3) is the weak link for the Pragmatist.* Is lying *truly* the only way? Augustine argues no (silence, ambiguity).
