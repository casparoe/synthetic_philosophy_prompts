      *   **Topic:** Augustine's absolute prohibition on lying (*De Mendacio*, *Contra Mendacium*).
      *   **The Problem:** The user has constructed a logical argument (syllogistic in nature) that seems to prove consequentialism (lying is okay if the end is good), which contradicts Augustine's deontological absolute (lying is always sin). The user feels stuck between a broken argument and their own intuition.
      *   **Specific Question:** Which premise should be given up? What is the cost of giving up that premise?
