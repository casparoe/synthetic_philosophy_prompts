      *   Given the user says "I'd sooner keep (1) and (3) than swallow (6)," they are looking for a way to block the slide from "Life-saving lie" to "Any good end lie."
      *   *Actually, looking closer:* If they keep (1), (2), and (3), (4) follows logically. To stop (6), they must block the generalization in (5).
      *   *However,* the strongest Augustinian move is to deny (2). The strongest Casuistical move is to deny (3).
      *   *The User's specific nag:* "He's already fine with me steering someone toward a false belief — he only draws the line when my words themselves are false."
