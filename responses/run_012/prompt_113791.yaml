      *(Self-Correction during drafting)*: Be careful not to accidentally survey theories while explaining the camps. Keep it focused on what the *spec* demands of them. Ensure the distinction between "Losing standing" and "Never having it" is captured in the temporal/modal constraints.

      *(Refining the "Clean Record" insight)*: The user is right. The literature *does* wiggle. The spec needs to force the theory to admit whether standing is binary or scalar, and whether it's agent-relative or act-relative. I will highlight the **Relevance Constraint** as the thing that stops the "everyone is a sinner" objection.

      *(Cutting a Prejudice)*: "Standing to be heard." Often, lacking standing just means the blame is *appropriately ignored*, not that it shouldn't be uttered. I will advise treating "Standing to be Heard" as a consequence of standing, not a separate metaphysical category, to avoid bloating the spec. Actually, better: Cut "Standing to be Heard" as a *separate* requirement for a theory of standing *to blame*. It's a distinct normative status.

      *(Refining the Camps)*:
      1.  **Quality of Will:** (e.g., Macnamara, Todd). Focus on respect, attitudes, recognition.
      2.  **Authority/Relationship:** (e.g., Bell, Fritz). Focus on rights to demand, normative positions.
