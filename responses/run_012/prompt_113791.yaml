answer: |-
  Here is the specification for a theory of standing to blame. It is organized by constraints (what the theory must explain), consistency checks (external facts it must accommodate), and a critical analysis of the central tension you identified.

  ### I. Core Case Constraints
  *These are the intuitive data points any theory must accommodate. For each, I indicate whether it is a genuine constraint on the concept or a commitment specific to one of the three major camps.*

  **Camps Reference:**
  *   **[Will]:** Standing tracks the quality of the blamer's will/attitudes (e.g., respect, recognition).
  *   **[Demand]:** Standing is a matter of normative authority/position to make a demand.
  *   **[Function]:** Standing is about the point, aim, or business of blaming (e.g., moral repair, protection).

  **1. The Hypocrite Constraint**
  *   **Case:** A person lectures you on lying while actively lying to you.
  *   **Intuition:** Their blame is defective in a specific way. It is not false (you did lie), and you are blameworthy, but they lack the *right* to hold you to account.
  *   **Status:** **Genuine Constraint.** All camps agree hypocrisy undermines standing, though they disagree on why.
  *   **Camp Divergence:** [Will] says it shows disregard for the norm; [Demand] says it waives their authority; [Function] says it undermines the moral repair aim.

  **2. The Reformer Exception**
  *   **Case:** An ex-smoker tells you to quit smoking.
  *   **Intuition:** They have standing, unlike the current hypocrite. Past sin does not permanently strip standing.
  *   **Status:** **Genuine Constraint.** A theory that says "any past violation kills standing" is too strong.
  *   **Camp Divergence:** [Will] must explain how the will is now aligned; [Demand] must explain how authority is regained; [Function] must explain why their warning serves the aim of blame now when it didn't before.

  **3. The Bystander Limit**
  *   **Case:** A stranger with no relationship to you or the victim blames you for a minor slight against a friend.
  *   **Intuition:** They may be *correct* that you were wrong, but their blame feels meddlesome or presumptuous compared to the victim's blame.
  *   **Status:** **Camp Commitment ([Demand]/[Function]).** [Will] theorists often struggle here, as a bystander can have a perfectly respectful will. This constraint favors theories that ground standing in relationships or specific roles.

  **4. The Co-Culprit Paradox**
  *   **Case:** Two people rob a bank. One blames the other for being greedy or careless during the job.
  *   **Intuition:** This is contested. Some feel the co-culprit lacks standing (in pari delicto); others feel they have unique standing to call out the specific betrayal of the partnership.
  *   **Status:** **Camp Commitment.** This is a fault line. [Demand] theories often deny standing (you waived the right by participating). [Function] theories might grant it if the blame serves to dissolve the criminal partnership. A robust spec must force the theory to pick a side, not fudge it.

  **5. The Institutional Reflex**
  *   **Case:** A corporation blames an employee for a safety violation that was caused by corporate underfunding.
  *   **Intuition:** This feels like a category error or a deflection, not just a lack of standing.
  *   **Status:** **Genuine Constraint.** The theory must distinguish between *individual* standing and *institutional* authority. If the theory treats them identically, it fails to capture the moral asymmetry.

  ---

  ### II. Conceptual Distinctions
  *The theory must not collapse these categories. If it does, it is not a theory of standing; it is a theory of something else.*

  **6. Standing vs. Warrant**
  *   **Requirement:** The theory must allow that a blamer can lack standing even when their blame is *warranted* (the target actually did the wrong thing).
  *   **Status:** **Genuine Constraint.** If lack of standing implies the target didn't do wrong, you have redefined standing as "justification."

  **7. Standing vs. Blameworthiness**
  *   **Requirement:** The theory must allow that a target can be blameworthy even if no one has standing to blame them (e.g., everyone else is equally complicit).
  *   **Status:** **Genuine Constraint.** Blameworthiness is agent-relative to the act; standing is agent-relative to the *relationship* between blamer and blamee.

  **8. Losing vs. Never Having vs. Unable to Exercise**
  *   **Requirement:** The theory must distinguish between:
      *   *Never having it:* (The Bystander).
      *   *Losing it:* (The Hypocrite).
      *   *Having it but blocked:* (e.g., A parent has standing to blame a child, but is too grief-stricken to do so effectively).
  *   **Status:** **Genuine Constraint.** Conflating these leads to errors in assessing moral repair. You cannot regain what you never had, but you can regain what you lost.

  **9. Standing to Blame vs. Standing to be Heard**
  *   **Requirement:** The theory must distinguish having the right to blame from having the right to demand an audience.
  *   **Status:** **Prejudice Alert (See Section V).** Often treated as distinct, but frequently conflated. A theory should not require "uptake" as a condition for standing.

  ---

  ### III. External Consistency Checks
  *Results from outside the immediate debate that the theory must not contradict.*

  **10. The Silence Constraint**
  *   **Fact:** Much blaming is internal or unspoken (resentment, private judgment).
  *   **Requirement:** The theory cannot define standing solely in terms of communicative success or speech acts.
  *   **Status:** **Genuine Constraint.** Rules out purely pragmatic or conversational accounts of standing.

  **11. The Unresponsive Constraint**
  *   **Fact:** We blame the dead, the distant, and the morally incapacitated.
  *   **Requirement:** The theory cannot make standing contingent on the target's ability to answer back or enter a dialogue.
  *   **Status:** **Genuine Constraint.** Rules out strong [Demand] models that rely on reciprocal authority.

  **12. The Cost Constraint**
  *   **Fact:** Blaming imposes emotional and social costs.
  *   **Requirement:** The theory must explain why we care about standing. (Presumably, because blame without standing wastes these costs or inflicts unjustified harm).
  *   **Status:** **Genuine Constraint.** Connects the metaphysics of standing to the ethics of interaction.

  ---

  ### IV. The Central Tension: The "Clean Record" Problem
  *You suspected the literature is an attempt to wriggle out of the fact that nobody has a clean record. You are correct. This is the single greatest pressure point on the spec.*

  **The Tension:**
  1.  **Hypocrite Intuition:** To have standing to blame for $X$, you must not be guilty of $X$.
  2.  **Universal Sin Intuition:** Everyone is guilty of *something* morally significant.
  3.  **Conclusion:** If (1) is generalised, no one has standing.

  **How Theories Wriggle:**
  *   **[Will] Camp:** Claims standing isn't about *actions* but *attitudes*. You can have sinned but still respect the norm (Reformer). *Risk:* Becomes too internal; hard to verify.
  *   **[Demand] Camp:** Claims standing is about *authority* which can be waived selectively. You waive authority on $X$ by doing $X$, but retain it on $Y$. *Risk:* Makes standing hyper-fragmented.
  *   **[Function] Camp:** Claims standing depends on whether the blame *works* to secure the norm. *Risk:* Makes standing consequentialist; allows "noble lies" or useful hypocrisy.

  **The Spec Requirement:**
  The theory must provide a **Relevance Criterion**. It must specify exactly *which* flaws in the blamer negate standing for *which* faults in the blamee. It cannot simply say "moral purity" (too strong) or "anything goes" (too weak). It must explain why the hypocrite's lie kills standing for lying, but their greed doesn't necessarily kill standing for lying.

  ---

  ### V. Pruned Prejudices
  *You asked me to cut requirements that are just linguistic prejudices. Here is the cut.*

  **Cut: "Standing to be Heard" as a separate metaphysical category.**
  *   **Why:** This is often a pragmatic consequence, not a normative precondition. We often say a hypocrite "has no right to say that," but we don't mean they should be gagged; we mean we are permitted to ignore them.
  *   **Revision:** Fold this into the **Cost Constraint**. If you lack standing, the target is permitted to dismiss the blame without moral cost. Do not build a separate "right to an audience" into the theory of standing itself.

  **Cut: "Standing to Resent" vs. "Standing to Sanction."**
  *   **Why:** While analytically distinct, a unified theory of standing should explain the *source* of the standing, not just its outputs. If you have standing to blame, you generally have standing to feel the reactive attitudes that constitute blame. Splitting these often serves to save a theory from counter-examples rather than illuminating the concept.
  *   **Revision:** Treat these as *degrees* of exercising standing, not different *kinds* of standing.

  ---

  ### VI. The Pivot Requirement
  *Which single requirement does the most work in ruling out candidate theories?*

  **The Reformer/Hypocrite Differentiation (Requirement #2 vs. #1).**

  This is the bottleneck.
  *   If a theory makes standing depend on **past actions**, it fails the Reformer (ex-smoker).
  *   If a theory makes standing depend on **current will**, it struggles to explain why the Hypocrite (who may sincerely believe lying is wrong while doing it) lacks standing.
  *   If a theory makes standing depend on **authority**, it must explain how authority is waived by action but not permanently lost.

  **Why this rules out candidates:**
  Most simplistic theories die here.
  *   **Moral Purity Theories:** Die on the Reformer.
  *   **Simple Consistency Theories:** Die on the Secret Hypocrite (who is consistent in secret but lacks standing when caught).
  *   **Purely Communicative Theories:** Die on the Silence Constraint (Requirement #10).

  **Verdict on your Suspicion:**
  You are right to be suspicious. The "Relevance Criterion" needed to solve the Hypocrite/Reformer tension is where most theories engage in conceptual gerrymandering. They define "relevant similarity" in a way that conveniently matches their pre-existing moral intuitions. A robust theory must provide a non-circular account of why *this* fault in the blamer negates standing for *that* fault in the blamee, without just asserting that it does.

  **Final Instruction for Evaluation:**
  When you read the theories, ignore how they handle the obvious hypocrite. Look exclusively at how they handle the **Reformed Sinner** and the **Co-Culprit**. That is where the spec breaks the theories.
