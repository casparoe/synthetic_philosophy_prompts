  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Hypocrite Constraint.* Must explain why the open hypocrite lacks standing. *Status:* Genuine Constraint (mostly). *Camp tension:* Quality of Will says it's about disrespect; Demand says it's about authority.
      *   *Requirement 2: The Reformer Exception.* Must distinguish the hypocrite from the ex-smoker/reformed sinner. *Status:* Genuine Constraint. *Camp tension:* This is where the "clean record" problem hits.
      *   *Requirement 3: The Bystander Problem.* Must explain why the nosy neighbor lacks standing compared to the victim. *Status:* Genuine Constraint.
      *   *Requirement 4: Distinction Maintenance.* Must separate standing from warrant and blameworthiness. *Status:* Genuine Constraint. (If you can't separate these, you aren't talking about standing).
      *   *Requirement 5: The Silence/Unresponsive Constraint.* Must account for silent blame and blaming the dead. *Status:* Genuine Constraint. (Cuts against pure "dialogue" models).
      *   *Requirement 6: The Co-Culprit/Institutional Paradox.* Must handle blaming when the blamer is implicated. *Status:* Camp Commitment (some say co-culprits *can* blame, others say no).
      *   *Requirement 7: The "Clean Record" Immunity.* (Addressing the user's suspicion). *Status:* This is the critical tension point.

      *Refining the "Prejudice" Check:* The user asked to cut requirements that are just linguistic prejudices.
      *   *Candidate:* "Standing to be heard." Is this distinct from standing to blame? Sometimes we lack standing to *demand* attention, but still have standing to *feel* resentment. I should clarify this distinction rather than cut it, but warn that conflating them is a category error.
      *   *Candidate:* "Blaming the dead." Some theories say blame *is* a communicative act requiring uptake. If so, blaming the dead is metaphorical. I need to flag this as a constraint that forces a choice on the *nature* of blame, not just standing.

  4.  **Addressing the "Clean Record" Tension:**
      *   The user suspects the literature is trying to wiggle out of the fact that everyone is a sinner.
      *   If standing requires moral cleanliness, no one has standing.
      *   If standing doesn't require cleanliness, why does the hypocrite lack it?
