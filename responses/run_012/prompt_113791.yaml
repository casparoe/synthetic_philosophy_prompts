      *   *The "Wriggle":* Theories often shift from "moral status" to "commitment to norms." I need to highlight this as the pivotal requirement.

  5.  **Selecting the "Most Work" Requirement:**
      *   It's the **Non-Implication Constraint** (distinguishing the hypocrite from the co-culprit/reformer). This forces the theory to define *which* flaws kill standing and *why*.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task (Spec, not survey).
