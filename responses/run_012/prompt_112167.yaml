prompt: |-
  Ok so I've somehow become the permanent referee in a three-year argument between two of my best friends, and I want them to stop yelling and write down the thing they should've written a year ago — a joint statement, an adversarial-collaboration document, whatever you call it. Here's the setup so you can see the two camps. Friend A is a local councillor and a reciprocity person: he thinks the welfare state is only justifiable to the people paying in if it's a scheme of give-and-take, that adults who can work and won't are taking from adults who do, and that conditionality — work requirements, job-search conditions, sanctions for turning down a reasonable offer — isn't cruelty, it's the thing that makes the whole arrangement fair to the taxpayer. Friend B runs a food bank and is an unconditionalist: she thinks the deserving/undeserving distinction is rotten, that conditionality manufactures the very fraud and dependency it claims to police, that "reciprocity" is doing no real work once you notice who's already given what (unpaid care, low-paid work, years of contributions before things fell apart), and that the decent baseline is money without a means test on your character.

  What I want is the document the two of them could both actually sign. So: a numbered section of claims they agree on — about what the welfare state is for, about which facts are facts, about what's genuinely contested — and then the real disagreements, each one stated in wording that the side who holds it would accept as fair (so A's view phrased the way A would phrase it, B's the way B would, not a strawman of either). Then the cruxes: the sub-questions such that settling one would actually move somebody. I already suspect two of them. One is whether reciprocity requires an actual contribution or only willingness and capacity — because A quietly needs the first and B only ever argues against the first, so they might be closer than they sound. The other is whether conditionality is supposed to work through incentives (people respond to the taper, so it's an empirical claim about whether work pays after childcare and travel) or through desert and expression (it's about what people owe, in which case I want to know what either of them would count as evidence against their own side). For each crux, give me a concrete case or piece of evidence that both would agree bears on it, and write down each side's prediction in advance. Three cases I'd like them to commit on: a single parent offered a night shift that nets her less than her benefit once childcare's paid; someone who misses two appointments because of untreated depression and gets sanctioned; and a proposal to drop sanctions entirely and instead top up anyone who takes a low-paid job.

  A few things I'd like the document to nail down that I don't think either of them has ever stated cleanly: entry-conditionality (conditions to get in) versus exit-sanctions (punishments once you're in) — those are seperate and they keep sliding between them; conditionality attached to cash versus to housing or in-kind help; and the difference between calling a person undeserving and calling a claim undeserving, which I think is where half the heat is. Also, if any part of what they've been fighting about turns out to be purely verbal — same substance, different words — say so and say which part, because I'd love to be able to tell them that to their faces. Don't bother with who's right in the end, that's not the assignment, and please don't pad it with reading lists or citations, they both know the literature better than I do. I want the working document: agreed claims numbered, then a disagreements table with the crux column and the predictions column filled in.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Create a "joint statement" or "adversarial-collaboration document" for two friends (Friend A and Friend B) to sign, ending a three-year argument about welfare conditionality.
      *   **Friend A (The Councillor/Reciprocity):** Believes welfare is a scheme of give-and-take. Conditionality (work requirements, sanctions) ensures fairness to taxpayers. Adults who *can* work but *won't* are taking from those who *do*.
      *   **Friend B (The Food Bank/Unconditionalist):** Believes deserving/undeserving distinctions are rotten. Conditionality creates fraud/dependency. Reciprocity ignores past contributions/unpaid labor. Baseline should be money without means-testing character.
      *   **Required Structure:**
          1.  Numbered section of agreed claims (purpose of welfare, agreed facts, genuinely contested issues).
          2.  Real disagreements (stated fairly in each side's voice).
          3.  Cruxes (sub-questions where settling one moves the needle).
          4.  Concrete cases/predictions (Single parent night shift, Depression sanctions, Drop sanctions/top-up low pay).
          5.  Distinctions to nail down (Entry vs. Exit, Cash vs. In-kind, Person vs. Claim).
          6.  Verbal disputes (identify if any disagreements are just semantic).
      *   **Constraints:** No reading lists/citations. No verdict on who is right. Tone should be formal, precise, and actionable (a working document).

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *Common Ground:* Both want a functioning society. Both likely agree poverty is bad. Both likely agree fraud exists but disagree on scale/impact. Both likely agree work is generally good (A for contribution, B for dignity/income). Both agree the current system has flaws (A thinks it's too soft, B thinks it's too harsh).
      *   *Key Distinction:* "Undeserving Person" vs. "Undeserving Claim." A focuses on the claim's legitimacy based on rules; B hears it as an attack on the person's moral worth.
      *   *Key Distinction:* Entry vs. Exit. A focuses on staying in the system (exit conditions); B focuses on getting help immediately (entry barriers).
      *   *Key Distinction:* Cash vs. In-Kind. A might be okay with conditionality on cash but not food/shelter; B might see conditionality on anything as coercive.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to establish the baseline.
      *   1. Purpose: Prevent destitution *and* encourage participation (worded carefully).
      *   2. Facts: Poverty harms health/outcomes. Administrative error exists. Fraud exists but is statistically minor compared to error.
      *   3. Contested: The *moral basis* of distribution and the *efficacy* of sanctions.

  4.  **Drafting Section 2: Real Disagreements (Steel-manned):**
      *   *A's View:* Conditionality is a contractual obligation. Without it, the tax base erodes. It's about fairness to contributors.
      *   *B's View:* Conditionality is a barrier to survival. It assumes bad faith. Survival shouldn't be contingent on behavior modification.

  5.  **Drafting Section 3: Distinctions (Clarifying the Heat):**
      *   *Entry vs. Exit:* A cares about Exit (sanctions for non-compliance). B cares about Entry (barriers to access).
      *   *Person vs. Claim:* A judges the *claim* (did you meet the rule?). B hears judgment on the *person* (are you lazy?).
      *   *Cash vs. Essentials:* Is there a floor below which sanctions cannot go?

  6.  **Drafting Section 4: The Cruxes & Predictions (The Core Task):**
      *   *Crux 1: Reciprocity Definition.* Is it *actual* contribution or *willingness*?
          *   A needs actual contribution eventually. B accepts willingness/capacity constraints.
          *   *Case:* The Single Parent Night Shift.
          *   *Prediction A:* Taking the job is net positive long-term (foot in door).
          *   *Prediction B:* Taking the job is net negative (financial loss + stress), proving the system is broken.
      *   *Crux 2: Mechanism of Conditionality.* Incentives (economic) vs. Desert/Expression (moral).
          *   *Case:* Depression Sanctions.
          *   *Prediction A:* Sanction prompts engagement with treatment/job search (incentive).
          *   *Prediction B:* Sanction worsens health, reduces employability (punitive failure).
      *   *Crux 3: The Alternative.* Sanctions vs. In-work Top-ups.
          *   *Case:* Drop sanctions, top-up low pay.
          *   *Prediction A:* Labor supply shrinks (why work harder if paid same?).
          *   *Prediction B:* Labor supply stabilizes/increases (poverty trap removed).

  7.  **Drafting Section 5: Verbal Disputes:**
      *   Identify where they are talking past each other.
      *   "Fairness": A means horizontal equity (treatment of taxpayers). B means vertical equity (treatment of the vulnerable).
      *   "Dependency": A means state reliance without contribution. B means systemic trap created by conditionality.

  8.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Constraint Check:* Did I include the three specific cases? Yes. Did I avoid citations? Yes. Did I address the specific distinctions (Entry/Exit, Cash/Kind, Person/Claim)? Yes.
      *   *Formatting:* Use clear headings, numbered lists, and a table for the disagreements/cruxes to make it look like a formal document.
      *   *Refining the "Crux" predictions:* Make sure they are falsifiable or at least observable outcomes.
      *   *Refining the "Verbal" section:* Ensure it highlights that they might agree on policy if they defined terms differently.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure Friend A doesn't sound like a caricature villain. Emphasize the "contractual" nature of their view.
      *   *Correction:* Make sure Friend B doesn't sound naive. Emphasize the "structural barrier" argument.
      *   *Correction:* Ensure the "Entry vs Exit" distinction is clearly mapped to their specific grievances.
      *   *Correction:* Check the "Person vs Claim" distinction. This is crucial for the emotional heat.

  10. **Final Output Generation** (Proceeding to generate the response based on these thoughts).
