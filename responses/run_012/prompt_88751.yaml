  **Ratio: 15% Empirical / 85% Moral**

  Your disagreement with your flatmate is likely not about the supply chain (Term 2). Economists and ethicists generally agree on the "expected value" model of purchasing (your burger is a vote in a probabilistic auction). The vast majority of the variance between your 0.55 and their 0.9 comes from **Term 0** (Is the system bad?) and **Term 3** (Is the animal wronged?). You are likely treating the moral status of the animal as an open question; your flatmate is treating it as settled.

  ### The Weakest Link
  **Term 3 (Harm/Existence)** is the least certain term in the chain.
  *   **Why:** The "Non-Identity Problem" is philosophically robust. If the cow would not have existed but for your demand, and its life was net-positive, in what sense are you harming *it*? Resolving this requires moving from a welfare-based ethics to a rights-based or deprivation-based ethics.
  *   **What would move it:** A definitive argument that sentient beings have a right to continued existence independent of their welfare levels, or conversely, proof that "potential persons" (or animals) have no moral claim to be brought into existence.

  ### The Missing Term
  I already integrated **Term 0 (Practice Wrongness)** into the calculation above. If you remove Term 0, the entire structure collapses. Many people stall at 0.55 because they implicitly assign Term 0 a probability of ~0.65 (maybe farming is okay if regulated?), whereas the 0.9 crowd assigns it 1.0. Making this explicit is the single biggest lever for resolving your debate.

  ### The Short-Haul Flight Comparison
  Does the answer change for a flight? **The number stays roughly the same (0.75), but the decomposition shifts.**

  Your flatmate is half-right.
  1.  **Empirical (Term 2):** The flight case is actually *cleaner* empirically. Aviation fuel burn is linear; your seat adds weight, which burns specific extra fuel. There is less "threshold batching" than in supermarket meat orders. So Term 2 credence goes **up** (to ~0.95).
  2.  **Moral (Term 3):** The flight case is *messier* morally. The harm is statistical (contributing to climate risk that kills someone decades later) rather than direct (killing a specific cow). It is harder to describe the act as "killing" in virtue of the act itself. So Term 3 credence goes **down** (to ~0.70).

  **Verdict:** The Burger case feels more intuitively wrong because the victim is identifiable and the causal link (money -> slaughter) is culturally salient, even if the supply chain is batched. The Flight case is causally more direct but morally more diffuse. The probabilities cancel out, leaving the overall wrongness credence similar, but the *type* of wrongness changes from "Direct Complicity in Killing" to "Contribution to Systemic Harm."
