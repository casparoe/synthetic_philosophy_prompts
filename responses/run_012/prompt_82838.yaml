  6.  **Final Polish:** Check against constraints (no citations, British English, specific structure). *Self-correction: Ensure I don't accidentally slip into American spelling (e.g., behavior -> behaviour, program -> programme where appropriate, though 'software' usually takes 'program' in UK tech contexts, I'll stick to standard UK orthography for general text).* *Wait, in UK tech, 'program' is standard for software, 'programme' for TV/Events. I will use 'program' for code to be accurate to the domain, but 'behaviour' for general text.*

