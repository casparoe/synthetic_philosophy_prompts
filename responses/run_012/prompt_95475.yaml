  3.  **Evaluate Each Philosopher's Position:**

      *   **John Searle:**
          *   *Core View:* Collective intentionality is a biological primitive. It exists in the head of the individual.
          *   *Key Distinction:* "We-intend" vs. "I-intend."
          *   *Irreducibility:* It is *conceptually* irreducible to "I-intend + mutual belief," but it is *ontologically* individualistic (it exists in individual brains).
          *   *Group Mind:* Searle explicitly *rejects* the group mind. He is a methodological individualist regarding ontology.
          *   *The Chapter's Error:* The chapter claims Searle says the intention "belongs to the group rather than to its members." This is the biggest red flag. Searle says the *content* is "we," but the *location* is the individual mind.
