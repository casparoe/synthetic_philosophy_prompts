answer: |-
  This is a high-wire act. 90 minutes is aggressive for this depth, but the experiential approach is the only way to make the epistemic status of the Church-Turing Thesis (CTT) land for philosophy students without drowning them in math, or bore CS students with semantics.

  Your sketch is strong. The improvement lies in **streamlining the simulation** so you have enough time for the **Rule-Writing/Adversarial phase**, which is where the philosophical work happens. If they spend 45 minutes debugging a register machine, you lose the thesis.

  Here is the runnable lesson plan.

  # Lesson Plan: The Clerk Protocol

  **Objective:** Students will experience the convergence of distinct formal systems and then fail to rigorously define the boundary of "mechanical" computation, demonstrating that the Church-Turing Thesis is a conceptual bridge, not a mathematical theorem.
  **Time:** 90 Minutes
  **Group:** 18 Students (Mixed Phil/CS)
  **Materials:** Printed packets (see below), whiteboard, timer.

  ---

  ## 1. Setup & Materials (Prep)

  **Room Layout:**
  *   Divide the room into two distinct zones ("Office Alpha" and "Office Beta").
  *   If walls aren't available, use a "No Talking Across the Aisle" rule enforced by you.
  *   **Office Alpha (9 students):** Register/Counter Machines.
  *   **Office Beta (9 students):** String Rewriting System.
  *   **Mix:** Ensure each office has a mix of CS and Phil students. (CS students help with logic; Phil students help with rule interpretation).

  **Printed Packets:**
  1.  **Alpha Rulebook:** Simple Counter Machine instructions.
      *   *State:* `N` (Number in register).
      *   *Ops:* `INC` (N+1), `DEC` (N-1, if 0 stay 0), `JZ` (Jump to step X if N=0), `HALT`.
      *   *Input:* A number written on a card (e.g., "3").
      *   *Output:* A number written on a card.
  2.  **Beta Rulebook:** String Substitution System.
      *   *State:* A string of symbols (e.g., `|||`).
      *   *Ops:* Scan left-to-right. If pattern `X` found, replace with `Y`. Repeat until no rules apply.
      *   *Rules:* e.g., `||` → `|`, `|` → `||`.
      *   *Input:* A string on a card.
      *   *Output:* A string on a card.
  3.  **Job Tickets (3 per office):**
      *   Job 1: **Increment** (Input `||` → Output `|||`).
      *   Job 2: **Double** (Input `||` → Output `||||`).
      *   Job 3: **Parity Check** (Input `|||` → Output `ODD` or `EVEN`).
      *   *Note:* You must pre-calculate the specific rule sequences for these jobs for both systems so you can verify them quickly. Do not make them invent the algorithms; give them the algorithm, have them *execute* it. This saves 20 minutes of debugging.
  4.  **The Definition Sheet:** A large sticky note or whiteboard space for the "Mechanical Definition."

  ---

  ## 2. Timing Breakdown

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Briefing** | Split groups. Hand out Rulebooks. **Strict Rule:** "You are clerks. Follow the book. Do not think." |
  | **05-25** | **Simulation** | Offices execute the 3 Job Tickets. They must log steps taken. |
  | **25-35** | **Convergence** | Groups merge. Compare outputs and step counts. Notice: *Different methods, same results.* |
  | **35-50** | **Definition** | Class must write **one** definition of "Mechanical Clerk" that covers both offices. |
  | **50-70** | **Adversary** | Instructor introduces "Super Clerks." Class must amend definition to exclude/include them. |
  | **70-85** | **Debrief** | Reveal Church/Turing. Map the activity to the Thesis. |
  | **85-90** | **Q&A** | Close. |

  ---

  ## 3. The Adversarial Clerks (The Core)

  During the **Definition Phase (35-50 min)**, the class will likely produce a definition like: *"A clerk who follows explicit rules without understanding, using finite memory, step-by-step."*

  Do not accept this. Move to the **Adversary Phase**. You play the role of the "Union Rep" proposing new clerks. The class must vote if the clerk is "Mechanical" based on their definition. If their definition breaks, they must rewrite it.

  **Escalation Order:**

  1.  **The Parallel Clerk (The "Too Narrow" Trap)**
      *   *Pitch:* "This clerk has 50 hands. They can rewrite 50 symbols on the strip simultaneously in one step. They still follow rules."
      *   *Expected Reaction:* CS students say "Yes, that's parallel computing." Phil students say "No, that's magic."
      *   *The Trap:* If they say **No** (not mechanical), their definition is too narrow (excludes valid computation). If they say **Yes**, they must amend "one step" to "finite steps."
      *   *Goal:* Force them to realize *speed/parallelism* doesn't change *computability*.

  2.  **The Oracle Clerk (The "Too Broad" Trap)**
      *   *Pitch:* "This clerk follows rules, but has a 'Magic Phone.' When stuck, they call a number, get a Yes/No answer instantly, and continue."
      *   *Expected Reaction:* Universal "No."
      *   *The Trap:* Ask *why*. "They still follow rules." "They halt."
      *   *Goal:* Force them to articulate that the *source* of the step must be internal to the system, not external intuition.

  3.  **The Intuitionist (The "Vagueness" Trap)**
      *   *Pitch:* "This clerk has no magic phone. But when the rule says 'Choose a path,' they just 'see' the right one. They never choose wrong. They follow the rule 'Pick the correct path.'"
      *   *Expected Reaction:* Confusion.
      *   *The Trap:* This looks mechanical (input → output), but the *process* relies on an undefined faculty.
      *   *Goal:* Highlight that "Mechanical" requires the *method* to be specifiable, not just the result.

  4.  **The Circular Clerk (The "Definition" Trap)**
      *   *Pitch:* "Okay, let's simplify. A Mechanical Clerk is one who can be simulated by a Machine."
      *   *Expected Reaction:* Nods of agreement.
      *   *The Trap:* Point to the whiteboard. "Define 'Machine' without using the word 'Mechanical' or 'Clerk'."
      *   *Goal:* **This is the kill shot.** They will realize they cannot define "Machine" without referencing "Mechanical."

  ---

  ## 4. The Debrief (Mapping the Epistemic Status)

  *Do not start this until the "Circular Clerk" trap has sprung.*

  **Step 1: The Reveal (5 mins)**
  *   "Office Alpha was running a **Register Machine**."
  *   "Office Beta was running a **String Rewriting System** (Post Canonical System)."
  *   "The 'Mechanical Clerk' you tried to define is the **Effective Method**."
  *   "The 'Machine' you used to define it is the **Turing Machine**."

  **Step 2: The Map (10 mins)**
  Draw two columns on the board.

  | **Left Side (Informal)** | **Right Side (Formal)** |
  | :--- | :--- |
  | "What a human clerk does" | "Turing Machine / Lambda Calculus" |
  | "Intuition of Algorithm" | "Recursive Functions" |
  | **No Axioms** | **Axiomatized** |
  | **Cannot be Proved** | **Can be Proved** |

  **Step 3: The Thesis (5 mins)**
  *   "We proved Alpha and Beta are equivalent (Extensional Equivalence). That is a **Theorem**."
  *   "We failed to define 'Mechanical' without circularity. That is the **Gap**."
  *   "The Church-Turing Thesis is the claim that **Left Side = Right Side**."
  *   "Because the Left Side has no axioms, you cannot prove the bridge. You can only show convergence (like we did with Alpha/Beta) and lack of counter-examples (like the Adversarial Clerks)."

  ---

  ## 5. Predicted Pitfalls & Salvage

  **Pitfall 1: CS Students Dominate the Simulation.**
  *   *Risk:* Phil students zone out while CS students run the registers.
  *   *Salvage:* Assign roles within the office. One "Reader" (reads rule), one "Writer" (updates tape/register), one "Auditor" (checks rule compliance). Rotate roles every Job Ticket.

  **Pitfall 2: The Simulation Runs Long.**
  *   *Risk:* They get stuck on Job 2 (Doubling) and you lose 20 minutes.
  *   *Salvage:* **Pre-printed State Sheets.** Do not make them write the code. Give them the code for Job 1, 2, and 3. Their job is to *trace* it, not *design* it. You want them to feel the *constraint* of the rules, not the joy of programming.

  **Pitfall 3: The "Parallel Clerk" Debate Boils Over.**
  *   *Risk:* CS students argue about P vs NP or physical limits.
  *   *Salvage:* Cut them off. "We are not asking if it is *physical*. We are asking if it is *mechanical*. Does it require insight? No. Then it stays in the definition." Keep the focus on *insight vs. rule*.

  **Pitfall 4: They Accept the Circular Definition.**
  *   *Risk:* They say "Mechanical means what a Machine does" and move on.
  *   *Salvage:* Stop the class. "Write that down. Now erase 'Mechanical'. Replace it with a synonym." When they can't, point out: "You have just defined a word using itself. That is why the Thesis is not a theorem."

  ---

  ## 6. Honest Limitations (What You Must Supply)

  This activity is powerful, but it has blind spots you must address in the debrief or subsequent lectures:

  1.  **Physical Realizability:** The activity treats "Mechanical" as logical, not physical. A Turing Machine with infinite tape is physically impossible. You must clarify that CTT is about *logical* effective methods, not engineering constraints.
  2.  **Hypercomputation:** The "Oracle Clerk" hints at this, but students might leave thinking CTT proves super-turing computation is impossible. CTT only says super-turing computation is not *effective*. It doesn't rule out physical processes (like Malament-Hogarth spacetimes) that might compute more, but they wouldn't be "mechanical" in the human sense.
  3.  **The "Why" of Convergence:** The activity shows *that* Alpha and Beta converge. It does not explain *why* (e.g., that both capture the notion of local causality). You need to supply the intuition that all formalisms share "local operations on finite symbols."
  4.  **Gödel's Shadow:** Philosophy students may conflate CTT with Incompleteness. Be ready to distinguish: Incompleteness is about truth vs. provability *inside* a system. CTT is about the boundary *of* the system itself.

  ## Instructor Script for the "Circular Trap" (Minute 65)

  > "Look at your definition. It says 'A Mechanical Clerk is one who operates like a Machine.'
  >
  > I am a philosopher. I ask you: What is a Machine?
  >
  > If you say 'Something that computes,' I ask 'What is compute?'
  > If you say 'Something a Clerk runs,' I ask 'What is a Clerk?'
  >
  > You are chasing your tail. You cannot define the Informal Notion using the Formal Notion, because the Formal Notion was built to *match* the Informal one.
  >
  > This is why Church and Turing didn't offer a proof. They offered a **proposal**. They said: 'We believe this formal thing captures that informal thing. We can't prove it, but we can't break it either.'
  >
  > That is the status of the Thesis. It is the most successful unprovable claim in the history of logic."
