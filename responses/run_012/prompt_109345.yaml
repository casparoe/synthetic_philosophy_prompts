answer: |-
  You are right to suspect that the consistency you are looking for is largely an illusion. The law does not rest on a single, unified theory of commodification. Instead, it is a patchwork of three distinct moral intuitions that are often conflated in public discourse but operate on different logical foundations. To answer your question carefully, we must disentangle these threads, identify which one governs the kidney ban, and then see what happens if we pull that thread to its logical conclusion.

  ### 1. The Theory Behind the Kidney Ban

  You ask whether the prohibition presupposes that market exchange corrupts the good itself, or whether it concerns the desperation of the seller. The short answer is that the law *claims* to be concerned with the latter (desperation/coercion) but *functions* as if it were concerned with the former (corruption of the good).

  If the ban were solely about protecting vulnerable sellers from coercion or bad decision-making under financial pressure (the 'desperation' theory), then a regulated market should be permissible for the wealthy or for those under no financial duress. Yet, selling a kidney is illegal even for a millionaire selling to another millionaire. This suggests the law treats the kidney as an **inalienable good**.

  However, if the ban were solely about the corruption of the good (the 'sanctity' theory), it is difficult to explain why plasma, eggs, and surrogacy are permitted. These are also bodily commodities. To reconcile this, the implicit theory governing the kidney ban is not merely 'no body parts', but specifically: **'no vital, non-renewable biological substrates.'**

  This is a specific version of what political philosophers call the **'Spheres of Justice'** argument, combined with a **Paternalistic Constraint**.
  *   **The Sphere:** The human body is a sphere where market norms are restricted.
  *   **The Constraint:** Within that sphere, a distinction is drawn between *surplus/renewable* materials (plasma, eggs, labour via surrogacy) and *vital/constitutive* materials (kidneys, hearts).

  The law presupposes that while you own your labour and your surplus biological material, you do not own your vital integrity in a way that permits liquidation. The wrong is done to the *concept of the person* as much as to the seller. It treats the body not as property, but as the *condition* for having property at all. To sell a kidney is to treat the self as a container of spare parts, which undermines the legal status of the person as an end in themselves.

  **Where the practice is underdetermined:**
  The inconsistency lies in the definition of 'vital'.
  *   **Egg donation** involves significant medical risk, hormonal disruption, and invasiveness, yet it is commodified.
  *   **Surrogacy** involves renting a vital organ (the womb) for nine months, carrying significant health risks, yet it is legal in many jurisdictions.
  *   **Hazardous labour** (e.g. deep-sea welding, mining) risks life and limb for money, and is legal.

  If the principle were strictly 'no risk to vital integrity for money', egg donation and surrogacy should be banned. If the principle were strictly 'no coercion', a regulated kidney market should be allowed. The current law occupies an unstable middle ground: it allows risk and bodily use, but draws an arbitrary line at 'permanent loss of a paired vital organ'. This suggests the rule is not derived from a first principle, but is a **focal point equilibrium**: a line drawn where public revulsion is highest, rather than where moral logic is clearest.

  ### 2. Vote Selling and Price Gouging: Distinct Commitments

  You are correct to suspect that vote selling and price gouging are doing different work. They do not belong to the same underlying commitment as the kidney ban.

  **Vote Selling: The Integrity of the Procedure**
  The prohibition on selling votes is not about bodily integrity or exploitation. It is about **Political Equality**.
  In a democracy, a vote is not a private asset; it is a share of public sovereignty. The principle is 'one person, one vote', not 'one pound, one vote'. If votes were tradable, the political system would cease to aggregate *preferences* and would instead aggregate *wealth*.
  *   **The Theory:** This is a **Constitutive Rule** violation. Just as you cannot pay a referee to ignore a foul in a football match without destroying the game itself, you cannot pay for votes without destroying the legitimacy of the election.
  *   **Difference from Kidneys:** A kidney market might be exploitative, but the transplant would still function biologically. A vote market renders the election functionally meaningless as a measure of public will. The wrong is systemic, not individual.

  **Price Gouging: Distributive Fairness in Emergencies**
  The prohibition on price gouging (e.g. generators after a hurricane) is neither about bodily integrity nor procedural integrity. It is about **Allocation Mechanisms**.
  In normal times, price is a signal of scarcity and a rationing mechanism. In an emergency, demand is inelastic (you *need* the generator to survive). If prices rise freely, allocation shifts from 'need' to 'ability to pay'.
  *   **The Theory:** This is a **Consequentialist** restriction based on fairness. It presupposes that in crises, the market fails to distribute essential goods justly.
  *   **Difference from Kidneys:** This applies to inanimate objects. It is not that the generator is sacred; it is that the *outcome* of the market transaction is socially unacceptable during a crisis.

  **Conclusion on Grouping:**
  You are conflating three unrelated ideas that share a superficial shape ('refusal to let something be bought'):
  1.  **Kidneys:** Inalienability of the Person (Deontological/Bodily).
  2.  **Votes:** Integrity of Democratic Process (Procedural/Political).
  3.  **Gouging:** Fairness of Distribution in Crisis (Consequentialist/Economic).

  ### 3. Uniform Application of the 'Best' Theory

  Let us assume the 'best' reconstruction of the theory actually at work in the kidney ban is the **'Vital Integrity and Vulnerability'** theory. This theory holds that: *Market exchange is forbidden when it involves the permanent loss of a vital biological function, particularly where the seller is likely to be motivated by financial desperation.*

  If we apply this theory uniformly, the legal landscape changes significantly.

  **A. Prohibitions that would have to fall (Legalise):**
  *   **Nothing currently illegal would become legal.** The kidney ban is the strictest point of the current system. If we uniformise based on the kidney ban, we do not legalise kidneys; we ban other things.
  *   *Correction:* If we instead adopted the **Economist's Theory** (regulated markets solve shortages without inherent moral corruption), then the kidney ban would fall. A state monopsony (single buyer) would be established. Plasma, eggs, and surrogacy would remain legal but perhaps more tightly regulated to ensure price floors.

  **B. Prohibitions that would have to be extended (Ban):**
  If we take the Kidney Logic (Vital Integrity) seriously and apply it to the other examples you gave:
  *   **Surrogacy:** If a kidney cannot be sold because it risks vital health and treats the body as a vessel, surrogacy should logically be banned. It rents a vital organ (the womb) and carries significant medical risk. Uniform application would require prohibiting commercial surrogacy, allowing only altruistic arrangements (as is already the case in the UK, but not the US).
  *   **High-Risk Hazardous Labour:** If we cannot pay someone to lose a kidney because the financial coercion undermines consent, we should arguably restrict pay premiums for life-threatening jobs (e.g. deep-sea oil rigging, certain military contracts) where the risk of death or permanent disability is high. The 'danger pay' would be capped to prevent desperation driving acceptance of lethal risk.
  *   **Egg Donation:** If the concern is medical risk and bodily intrusion, the high payments for egg donation would need to be capped at 'expenses only', similar to blood donation in many countries, rather than market rates.

  **C. Examples that turn out to be irrelevant:**
  *   **Price Gouging:** This falls out of the theory entirely. The 'Vital Integrity' theory is about the *seller's* body. Gouging is about the *buyer's* access to goods. Uniform application of the kidney principle leaves anti-gouging laws unjustified *on these grounds* (though they might be justified on fairness grounds).
  *   **Vote Selling:** Similarly, this is irrelevant to bodily integrity. However, if we uniformise based on the broader principle of **'Inalienable Rights'** (things you cannot sell because they define your status), vote selling remains banned. But note: this confirms they are different principles. You can't sell a vote not because it hurts your body, but because it hurts the state.

  ### 4. The Verdict on Consistency

  Your suspicion is correct: the very same set of rules would be equally comfortable with several theories that cannot all be true.

  1.  **If the principle is 'No Coercion':** Then a regulated kidney market is permissible (as coercion can be mitigated by screening), but hazard pay for dangerous jobs should be restricted (as it exploits desperation). The current law gets this backwards.
  2.  **If the principle is 'No Corruption of the Good':** Then plasma and egg sales should be banned (as they commodify the body). The current law allows them.
  3.  **If the principle is 'Vitality':** Then surrogacy should be banned (wombs are vital). The current law often allows it.

  The law is not underdetermined by the evidence; it is **overdetermined by conflicting intuitions**. It tries to satisfy the economist's desire for supply (plasma, eggs), the humanitarian's desire to prevent exploitation (kidneys), and the citizen's desire for equality (votes), without acknowledging that these goals pull in opposite directions.

  To make the rules uniform based on the **Kidney Ban's** implicit theory (Inalienability of Vital Biology):
  *   **Keep:** Kidney ban, Vote ban.
  *   **Extend:** Ban commercial surrogacy; cap payments for egg donation; restrict 'danger pay' for life-threatening labour.
  *   **Discard:** Anti-gouging laws (unless justified on separate fairness grounds).

  To make the rules uniform based on the **Economist's** theory (Efficiency + Mitigated Coercion):
  *   **Keep:** Anti-gouging laws (market failure); Vote ban (systemic failure).
  *   **Extend:** Legalise kidney sales (state monopsony).
  *   **Discard:** Bans on surrogacy/egg sales (already mostly discarded).

  The reason you cannot find a consistent principle is that the law is not trying to be consistent. It is trying to be **palatable**. It permits commerce where the body heals quickly (plasma) and forbids it where the loss is permanent (kidney), not because there is a sharp moral line there, but because that is where the public's stomach turns. The rule is not a deduction from philosophy; it is a sediment of disgust, pragmatism, and half-formed paternalism.
