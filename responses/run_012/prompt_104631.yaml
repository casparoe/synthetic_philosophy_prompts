prompt: |-
  Build me a thought experiment for a seminar on genocide law and moral philosophy. I want a fictional case where an atrocity counts as genocide under the standard legal definition but is morally not genocide — or the reverse, your pick — and where the group-definition is doing the work, not scale or intent. Constraints: one paragraph of setup, no real countries or historical atrocities, no quotes from treaties, and don't just rehash the complaint that they targeted a political group so it is politicide rather than genocide. The group should be defined in a way that makes the legal test and the moral judgment pull apart for a less obvious reason — e.g. something about whether the group is stable and ascriptive, or whether the perpetrators' concept of the group is the one that matters. After the scenario, run the legal test and the moral test step by step, say which feature is doing the work, and tell me what happens if I remove that feature — does it collapse into the boring politicide complaint? Finish by saying how someone who thinks the legal category should just track the moral one would try to deflate the case. Keep it tight; I care more about the isolation than the drama.
