answer: |-
  In the Republic of Kaelo, the regime systematically exterminates the "Dust-Born," a population segment classified in state archives as a distinct ethnic lineage based on a specific ancestral region, satisfying the objective bureaucratic criteria often accepted by international tribunals. The perpetrators express specific intent to destroy the Dust-Born *as* an ethnic group, believing them to be biologically distinct contaminants, and the acts committed fall squarely within the prohibited conduct of the convention. However, the Dust-Born share no language, religion, customs, or self-identification; the "ethnic" designation exists solely in the regime's ideology and archival records, with victims unaware of their status until targeted, rendering the group a fictional construct imposed entirely from the outside rather than a stable, ascriptive community.

  **Legal Test:** The case satisfies the statutory elements. International jurisprudence often employs a subjective or mixed approach, where a group's existence is validated by the perpetrator's perception or state classification rather than independent sociological proof. Since the regime targeted the victims *as* an ethnic group and the state bureaucracy codified them as such, the "protected group" requirement is met, making this legally genocide.

  **Moral Test:** The case fails the moral threshold. The specific wrong of genocide is the destruction of a stable, intergenerational form of life—a "people." Because the Dust-Born lack social cohesion, self-identification, or cultural transmission, there is no collective identity to extinguish, only a sum of individuals. Morally, this is aggravated mass murder, but it lacks the distinct harm of destroying a community that persists across time.

  **Feature Doing the Work:** The divergence rests on the *source of group definition*. The law accepts the perpetrator's subjective classification (or state bureaucracy) as sufficient to constitute an "ethnic" group, while the moral judgment requires the group to possess objective social reality and ascriptive stability independent of the killer's ideology.

  **Removal Consequence:** If you remove this feature—requiring the law to demand objective social reality rather than perpetrator perception—the legal verdict flips to "not genocide." Consequently, the case collapses into the boring politicide complaint: the victims are being targeted based on a state-created administrative category, which is the definition of political destruction rather than ethnic destruction.

  **Deflation Strategy:** A proponent who believes the legal category should track the moral one would deflate the case by arguing that the legal definition *already* implies objective stability. They would contend that a "fictional" group cannot legally qualify as "ethnic" or "national" under the convention regardless of perpetrator intent, asserting that the subjective approach is a misreading of the treaty. By tightening the legal definition of "group" to require pre-existing social cohesion, they would align the legal verdict with the moral intuition without changing the law's text.
