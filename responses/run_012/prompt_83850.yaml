      *   *The "Currency" Point:* It's not just about release timing; it's about resource allocation (compute, talent, time). Resources spent on safety are resources *not* spent on making the model better/faster/cheaper.
      *   *The "Moratorium" Point:* If the constraint bites even at the margins, the race dynamic drives towards the minimum viable safety, not the optimal safety.
      *   *Need for Factual Premise:* I need to know how tight the resource competition actually is. Is compute the bottleneck? Talent? Capital?

