  1.  **Analyze the Request:**
      *   **Topic:** School of Names (Classical Chinese Philosophy), specifically the *White Horse Dialogue* from *Gongsun Longzi*.
      *   **Format:** Poem, dialogue in verse, two voices only (Advocate vs. Objector).
      *   **Length:** 24 to 32 lines.
      *   **Style:** Unrhymed, short lines (suitable for reading aloud), English throughout (no Chinese characters/transliteration).
      *   **Constraint 1 (Refrain):** The proposition "A white horse is not a horse" must appear at least three times in exactly the same words. The sense must shift under it (Advocate: non-identity/distinction vs. Objector: exclusion/nonsense).
      *   **Constraint 2 (Voices):** Advocate speaks in definitions/designations (what a term means). Objector speaks in existences/quantities (what there is, counting). The Objector's objection must be strong (if there is a white horse, there is a horse).
      *   **Constraint 3 (Arguments):** Advocate must use two specific supports: 1) Horse = shape, White = color (compound vs. simple); 2) The request test (yellow/black horses answer to "horse" but not to "white horse").
      *   **Constraint 4 (Ending):** The last line must be the Objector's opening question verbatim.
      *   **Constraint 5 (Exclusion):** No "hardness-and-whiteness" material (that's a different dialogue).
      *   **Audience:** Mixed (students who haven't read + specialists). Needs to be accessible but philosophically accurate.

  2.  **Deconstruct the *White Horse Dialogue*:**
      *   **Core Proposition:** "Bai ma fei ma" (White horse not horse).
      *   **Advocate (Gongsun Long):** Focuses on *ming* (names/terms). "Horse" names the shape. "White" names the color. "White horse" names the color + shape. Therefore, the term "white horse" is not identical to the term "horse". Also, if you ask for a "horse", a yellow one works. If you ask for a "white horse", a yellow one doesn't. Therefore, they are not the same.
      *   **Objector:** Focuses on *shi* (reality/existence). If you have a white horse, can you say there is no horse? No. Therefore, a white horse is a horse.
      *   **The Shift:** The Advocate means "The concept 'white horse' is not identical to the concept 'horse'". The Objector hears "A white horse is not a member of the class 'horse'".

