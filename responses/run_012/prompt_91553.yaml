answer: |-
  ### The Desiderata for Computational Implementation

  To defend the claim that the brain is a computer, you must articulate conditions under which a physical system *genuinely* implements a computation, rather than merely being *described* as one. Below are the six requirements any adequate account must address, mapped against your four case types.

  #### 1. The Non-Triviality Constraint
  *   **Requirement:** The account must restrict the mapping between physical states and computational states such that not every physical system implements every computation. There must be a principled limit on which formal structures a physical system can realize.
  *   **Motivation (Case 1: Triviality):** If any physical system with sufficient parts (e.g., a wall, a bucket of water) can be mapped to any finite-state machine via a sufficiently gerrymandered lookup table, the claim "the brain is a computer" becomes vacuous. It would distinguish the brain from a rock only by complexity, not by kind. The account must explain why the rock does *not* compute, even if a clever observer can construct a mapping.
  *   **Status:** **Non-Negotiable.** Without this, the thesis has no content.

  #### 2. The Causal Power Condition
  *   **Requirement:** The physical properties responsible for the state transitions in the system must be causally responsible for the corresponding transitions in the computational description. The computation cannot be a post-hoc pattern found in the data; the physical dynamics must *drive* the transition in virtue of the properties mapped to the computational rules.
  *   **Motivation (Case 1 & 2: Triviality and Analog):** This rules out "as-if" computation where the observer imposes a structure that plays no role in the system's behavior. For the slide rule or the riverbed, this condition forces the question: does the physical structure *cause* the output via the mapped rules, or does the output arise from physics that ignores the computational description? It prevents the implementation from being merely a descriptive projection.
  *   **Status:** **Non-Negotiable.** This is the core of the mechanistic view of computation.

  #### 3. The Robustness and Approximation Tolerance
  *   **Requirement:** The account must allow for implementation to hold despite physical noise, component turnover, and approximate rather than exact state matching. The identity of the computation must be stable across variations in the physical substrate that do not alter the functional outcome.
  *   **Motivation (Case 3: Lab Cases):** In a spiking network, no two neurons fire identically; in a biological system, proteins replace themselves. If implementation requires exact physical state identity, the brain ceases to compute the moment a single ion channel varies. The account must explain how a computation persists through physical drift and noise without collapsing into "anything goes."
  *   **Status:** **Non-Negotiable.** Biological reality makes this a hard constraint.

  #### 4. The Individuation Principle
  *   **Requirement:** The account must provide criteria for determining when two physically distinct systems are implementing the *same* computation versus two *different* computations that happen to yield the same input-output profile. It must specify what constitutes the identity conditions of a computation.
  *   **Motivation (Case 4: Isomorphism):** If System A and System B produce the same outputs but have incommensurable internal states, are they doing the same thing? Cognitive science assumes they can be (Multiple Realizability). However, if the account individuates computations too broadly (e.g., by input-output alone), it fails to explain *how* the result is achieved. If it individuates too narrowly (by physical microstructure), it loses the generalization required for cognitive science.
  *   **Status:** **Camp Commitment.** (See Negative Result). This is where Internalists (syntax/structure) and Externalists (semantics/function) diverge.

  #### 5. The Explanatory Autonomy Condition
  *   **Requirement:** The computational description must explain aspects of the system's behavior that the low-level physical description does not, or does so more efficiently. The computational posits must do work that cannot be done merely by listing physical laws.
  *   **Motivation (Case 2 & 4: Analog and Isomorphism):** If the river "computes" the flow of water, but explaining the flow via physics is better than explaining it via computation, then the river is not a computer in a scientifically useful sense. Similarly, if describing a neural population trajectory as "computing a vector" doesn't predict behavior better than describing it as "discharging ions," the computational claim is idle.
  *   **Status:** **Non-Negotiable.** This is the justification for having a field called Cognitive Science rather than just Neuroscience or Physics.

  #### 6. The Objectivity Condition
  *   **Requirement:** Whether a system implements a computation must be a mind-independent fact about the system, not dependent on the interests, conventions, or perspective of an observer.
  *   **Motivation (Case 2: Analog/Dubious):** To say the brain *is* a computer (rather than *usefully modeled as* one) implies this is a fact about the brain, like its mass or chemical composition. If implementation depends on what an observer finds "convenient," then the brain is only a computer relative to a user, which undermines the realist claim you are defending.
  *   **Status:** **Camp Commitment.** (See Negative Result). This is the primary point of failure in most accounts.

  ---

  ### The Negative Result: The Trilemma of Implementation

  You suspected that Nontriviality, Objectivity, and Explanatory Autonomy cannot all be satisfied simultaneously. Your suspicion is correct, but the tension is more precisely located in the interaction between **Objectivity**, **Non-Triviality**, and the **Individuation Principle** (which secures Autonomy).

  **The Incompatibility:**
  1.  **If you enforce Strong Objectivity (Req 6) and Non-Triviality (Req 1):** You are forced to individuate computations based on intrinsic physical properties (e.g., specific causal structures). This satisfies Objectivity and avoids Triviality (because not every physical system has that specific structure). *However*, this fails **Explanatory Autonomy (Req 5)** and **Individuation (Req 4)**. You can no longer say two physically different systems (e.g., a brain and a silicon chip, or two different neural encodings) are computing the *same* thing. You lose Multiple Realizability. Cognitive science collapses into a catalog of specific physical mechanisms.
  2.  **If you enforce Explanatory Autonomy (Req 5) and Non-Triviality (Req 1):** To explain *why* a system is computing a specific cognitive task (e.g., edge detection) and not just shuffling symbols, you must individuate computations by their *function* or *semantic content*. This allows different physical systems to count as the same computation (saving Autonomy). To avoid Triviality, you must constrain this function (e.g., via teleology or evolutionary history). *However*, this violates **Strong Objectivity (Req 6)**. Functions and semantics are not intrinsic physical properties; they depend on history, environment, or the stance of an interpreter. The implementation becomes relative to a context, not a mind-independent fact.
  3.  **If you enforce Strong Objectivity (Req 6) and Explanatory Autonomy (Req 5):** You allow computations to be individuated functionally (to save Autonomy) but insist this is an objective physical fact. *However*, this almost invariably leads to a failure of **Non-Triviality (Req 1)**. If you look for "functional structure" in the physical world without constraining it by observer-independent teleology, you find functional structure everywhere (Pancomputationalism). A rock has physical states that covary with its environment; if function is just causal role, the rock computes.

  **The Verdict:**
  You cannot have a account that is simultaneously **Mind-Independent (Objective)**, **Restrictive (Non-Trivial)**, and **Cognitively Relevant (Autonomous/Multiple Realizable)**.

  **Which Requirement to Give Up:**
  To defend the claim "The Brain is a Computer" in a way that preserves the practice of cognitive science, you must give up **The Objectivity Condition (Req 6)** in its strongest form.

  You should argue for a **Moderate Realism**: Implementation is not a brute physical property like mass, but it is also not merely a whim of the observer. It is a **stance-dependent fact**. It depends on the system having a specific causal organization *and* that organization being selected for or utilized for a specific function. The "computer" status is real, but it is a property that emerges only when the system is viewed at the correct level of abstraction relative to its function.

  If you cling to Strong Objectivity, you will be forced by the Triviality Argument (Case 1) to admit that either everything computes or nothing does. If you cling to Non-Triviality and Objectivity, you will be forced by Case 4 to admit that the brain and a digital simulation cannot compute the same thing. To save the science, you must accept that "being a computer" is a relational property between the physical system and the functional level of description.

  ### Seminar Strategy

  **The Requirement a Reasonable Person is Most Likely to Deny:**
  Expect your seminar peers to attack **The Objectivity Condition (Req 6)**.
  *   **The Attack:** They will argue that if implementation depends on "function" or "level of description," it is observer-relative. Therefore, the brain is not *intrinsically* a computer; it is only a computer *for us*.
  *   **Your Defense:** Do not retreat to "it's just a model." Instead, argue that **Objectivity is the wrong standard**. Mass is objective, but "being a chair" is also a real category, even though it depends on human interests. A system implements a computation when its causal structure is *stable enough* (Req 3) and *specific enough* (Req 1) to support counterfactuals at the computational level. This is a fact about the system, even if the *vocabulary* used to describe it is interest-relative.

  **How to Handle Case 4 (Isomorphism):**
  This is your strongest point for giving up Objectivity.
  *   **Argument:** If two systems compute the same function with different internal states, what makes them the same? It cannot be physical isomorphism. It must be that they both satisfy the same *counterfactual profiles* regarding inputs and outputs. But to prevent Triviality (Case 1), those counterfactuals must be grounded in the system's *causal capacity* to sustain them, not just the actual history.
  *   **The Move:** Argue that the "computation" is the **stable causal topology** that supports the counterfactuals. Two systems share a computation if they share the same topology of causal dependencies, even if the physical nodes differ. This saves Autonomy and Non-Triviality, but admits that "causal topology" is an abstraction, not a raw physical datum (sacrificing Strong Objectivity).

  **Summary for your Defense:**
  1.  **Concede:** Implementation is not a mind-independent physical primitive like charge.
  2.  **Insist:** It is not merely a descriptive convenience either. It is a **robust causal capacity** of the system.
  3.  **Claim:** The brain is a computer because it possesses a causal organization that supports specific counterfactual dependencies (Non-Triviality + Causal Power) which are robust to noise (Robustness) and explain behavior better than physics alone (Autonomy).
  4.  **Accept:** This makes "computer" a functional kind, not a physical kind. This is sufficient for cognitive science.
