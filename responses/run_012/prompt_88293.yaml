      *   *De Finetti:* Probability *is* coherent betting behavior. There is no "truth" out there for probability to match (except the 0/1 of the event itself). Rationality is consistency (coherence). He was famously anti-realist about chance and often skeptical of "truth" as a metaphysical anchor for probability.
