      *   For de Finetti, a scoring rule *is* a bet. If you penalize me for being wrong, that's a loss. If I maximize expected score, I'm maximizing expected utility.
      *   He would agree that incoherent credences are dominated (Pareto inefficient) regarding accuracy scores, just as they are dominated regarding money.
      *   *However*, he would reject the *normative force* derived from "Truth." For him, the event happens or it doesn't (0 or 1). The "distance" between 0.7 and 1 is a mathematical construct, not an epistemic reality.
