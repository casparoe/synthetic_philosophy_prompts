answer: |-
  Dear Colleague,

  You have put your finger on the exact nerve that makes historical epistemology so difficult to teach, which is that the difference between revisionism and denialism is rarely about the raw data itself but about the architecture of the argument built around that data. It is entirely possible to be a sincere denier, just as it is possible to be a malicious revisionist, so we cannot judge based on the student's heart or motives. We must judge based on the relationship between the evidence they prioritize, the consensus they challenge, and the moral outcome their argument produces. The principle you are looking for, which I believe will resolve your contradictions without forcing you to abandon most of your gut verdicts, is this: a claim functions as denialism rather than legitimate revisionism when it seeks to dissolve the established categorical nature of an atrocity by systematically privileging the administrative records of the accused perpetrator over the testimonial evidence of victims and neutral observers, specifically where that privileging serves to negate the moral or legal culpability established by current scholarly consensus.

  This principle saves most of your intuitions while clarifying the pairs that are currently breaking your logic. Take your Dresden versus Nanjing problem. In the Dresden case, the inflated numbers originated from Nazi propaganda, meaning the higher figure was itself a tool of the perpetrator regime to garner sympathy or demonize the Allies. Correcting that number uses evidence to puncture a lie told by the aggressor state, and it does not change the category of the event from bombing to something else. In the Nanjing case, arguing for lower numbers typically relies on Japanese military field logs, which are the administrative records of the accused perpetrators, to dismiss Chinese survivor testimony and Western observer accounts. Because the scholarly consensus categorizes Nanjing as a massacre, using the perpetrator's own undercounting to challenge that category functions to exculpate the Japanese military. The principle saves your verdict on both because it distinguishes between correcting victim or aggressor propaganda versus privileging perpetrator bureaucracy to erase culpability.

  The Irish famine versus Armenian genocide pair is the hardest, but this principle resolves it through the clause regarding established scholarly consensus. In the case of the Irish famine, there is no settled consensus among historians that the event constitutes genocide under the legal definition; it is categorized primarily as a catastrophic famine exacerbated by policy. Therefore, a student arguing against the genocide label is challenging a fringe classification, not dissolving an established one, and is not necessarily privileging British records to hide evidence of intent because the evidence for specific genocidal intent is not settled law. In the Armenian case, the classification as genocide is the settled consensus of the field and international law. A student arguing there was no intent is using Ottoman records to dismantle a settled category of crime. This forces you to drop the idea that the two arguments are the same shape; they are not, because one challenges a settled verdict using perpetrator records to exculpate, while the challenges a contested label within a framework of acknowledged death. Your verdict stands, but the reasoning shifts from the content of the claim to the status of the consensus.

  Regarding your suspicion that your verdicts just track whoever won, the principle addresses this by focusing on where the evidence currently lies rather than who holds power. You mentioned Katyn, where the official line was a lie for decades. Challenging the Soviet narrative was not denialism because the Soviet narrative was maintained by state secrecy and fraud, not open scholarly consensus based on available evidence. Once the archives opened, the consensus shifted. If a student today argued the Germans did Katyn, they would be engaging in denialism because they would be privileging a debunked state lie over established evidence. Similarly, the functionalist argument about Hitler's written order is legitimate revisionism because it does not seek to dissolve the category of the Holocaust or exculpate the Nazi leadership; it debates the mechanism of decision-making within an accepted framework of guilt. This principle saves your view on Katyn and Hitler while confirming that current challenges to the Holodomor or Armenian genocide are different because they run against an evidence-based consensus rather than a state-enforced falsehood.

  This approach also handles the problem of the sincere lone person. A student can sincerely believe that Ottoman records are more reliable than survivor testimony, but if their argument structurally privileges the perpetrator's bureaucracy to dismantle a settled category of atrocity, they are engaging in denialism regardless of their intent. The rule judges the method and the effect, not the sincerity. This predicts that a paper arguing the Transatlantic Slave Trade mortality rates were lower than estimated based on new shipping logs is legitimate revisionism, as it refines scale within an accepted category. However, a paper arguing that enslaved people were mostly voluntary contractors based on plantation ledgers would be denialism, as it privileges the owner's records to dissolve the category of coercion. It also predicts that arguing civilian casualty counts in modern conflicts like Iraq are inflated is revisionism if based on methodology, but claiming specific documented massacres did not happen based solely on military after-action reports is denialism.

  Ultimately, you are not grading the truth of the number in isolation but the integrity of the historical method used to arrive at it. Your gut was correctly tracking the moral architecture of the arguments, even if you lacked the vocabulary to explain it. By focusing on whether the argument preserves the categorical nature of the event and whether it applies skepticism equally to perpetrator and victim sources, you can write a rule that protects legitimate inquiry without providing a cover for exculpation. I hope this helps you draft that one-page rule and gives you the confidence to handle those difficult conversations with your students and your relative.

  Best regards,

  A Colleague
