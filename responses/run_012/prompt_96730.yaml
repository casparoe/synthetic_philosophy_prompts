prompt: |-
  I'm in a reading group on perception and cognition and I got into a three-hour fight with my friend Devin about this, who's in a psych PhD program and thinks most of what philosophers of perception do is either trivial or confused, and now I can't tell if he's right or if he just defined himself into a win. His claim is that the whole "can cognition penetrate perception?" literature is a waste of time because the thesis, once you state it clearly, is obviously true and therefore empty. He wrote the argument out for me on a napkin and told me to find the bad step. I couldnt, so I'm asking you.

  (1) Cognitive penetration happens whenever a cognitive state -- a belief, a desire, a concept you have, an expectation, a mood -- makes a difference to what you end up perceptually experiencing. (2) Cognitive states always make that kind of difference. When you know what sentence someone is saying, the mangled sounds resolve into words; when you've learned to sort chicks by sex, the chicks start looking different; when you know you're walking past the post office, the blurry blob resolves into a mailbox instead of a bush; when you pick up wine vocabulary, the wine tastes more like what the words say; even just knowing what you're looking for changes what you see. (3) So every perceptual experience any of us ever has is cognitively penetrated. (4) But if every experience is penetrated, then the thesis has nothing to contrast with. There's no such thing as an unpenetrated perception, so "cognition penetrates perception" carries no more information than "everything has a cause." (5) So the question at the center of the literature -- does cognition affect perception? -- either gets a trivial yes or is really a covertly different question about degree or mechanism. (6) And here's the kicker: if what you see always depends on what you believe, then any belief you form by looking is partly based on itself, and a belief that leans on itself isnt justified, so no perceptual belief is ever justified. (7) But some perceptual beliefs obviously are justified, and the debate obviously isnt empty, so something in there has to be wrong.

  I'd like to keep (2) if I can, because every one of his examples rings true to me, and I obviously can't give up (7). So: which step do I give up, and what does giving it up cost me? If it's a premise rather than a slip, tell me what each of the available fixes costs, because I have a feeling I'm not going to like any of the options. Also, if the answer is that he's just using a word one way in (1) and another way in (4), say exactly what the two senses are and which one the actual debate is about, since that seems to be where the whole thing turns. Please write it in American English, I want to paste it into my notes before seminar.
