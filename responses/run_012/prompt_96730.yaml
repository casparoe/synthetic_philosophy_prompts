      *   Address the equivocation? Yes.
      *   Address the cost? Yes.

  8.  **Final Polish:** Ensure the distinction between *Perceptual Learning* and *Cognitive Penetration* is sharp, as that's the biggest trap in Devin's examples (especially the chick sexing one, which is a classic Siegel example often debated). Make sure to mention Fodor/Encapsulation.

