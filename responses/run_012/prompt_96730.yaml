      Actually, the strongest move is to say (1) is the definition of *top-down influence*, not *cognitive penetration*. The literature defines penetration more narrowly. So, reject (1) as a definition of the *debate's term*.
      Also, need to address the skepticism in (6). If cognition penetrates, does it ruin justification? Not necessarily. But Devin's argument relies on the idea that if belief affects perception, perception can't justify belief. This is the "circularity" worry. I need to explain why that's a non-sequitur or depends on a specific epistemic theory.

      *Decision:* Focus heavily on the Equivocation in (1). That is the "bad step."

