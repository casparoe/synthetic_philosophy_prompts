answer: |-
  **Seminar Notes: Response to Devin's "Triviality Argument"**

  **The Verdict**
  The bad step is **Premise (1)**. Devin is equivocating on the definition of "cognitive penetration." He is using a lay definition (any top-down influence) while claiming to refute the technical philosophical definition (a specific kind of direct alteration of perceptual content).

  If you want to keep (2) (the examples feel true) and (7) (perceptual justification is real), you must reject (1) as a definition of the *debate*, and consequently reject the move to (4) and (6).

  Here is the breakdown of the two senses, why the examples don't prove the strong claim, and the cost of fixing the argument.

  ### 1. The Equivocation: Two Senses of "Penetration"

  Devin's argument works only if you slide between these two definitions without noticing.

  *   **Sense A: Broad Top-Down Influence (Devin's Usage)**
      *   **Definition:** Any causal pathway where a higher-level state (belief, memory, expectation) affects processing at a lower level or affects the final report of what was seen. This includes attention, perceptual learning, decision criteria, and post-perceptual judgment.
      *   **Status:** Obviously true. As Devin says, knowing what you are looking for changes what you find.
      *   **Role in Argument:** This makes Premise (2) plausible.

  *   **Sense B: Strict Cognitive Penetration (The Literature's Usage)**
      *   **Definition:** A current propositional attitude (belief, desire, hypothesis) directly alters the *phenomenal character* or *representational content* of the perceptual experience itself, *in a way that bypasses the sensory input's rational constraint*. Crucially, this violates **Informational Encapsulation** (the Fodorian idea that the perceptual module doesn't "know" what you believe).
      *   **Status:** Highly controversial. Many psychologists (e.g., Firestone & Scholl) argue the examples in (2) are actually attention or memory, not penetration.
      *   **Role in Argument:** This is the only sense in which the epistemic worry (6) arises.

  **The Fix:** You must insist that the debate is about **Sense B**. Devin has proven Sense A is ubiquitous, but that does not prove Sense B is true, nor does it make the debate about Sense B trivial.

  ### 2. Re-evaluating the Examples (Premise 2)

  If you adopt Sense B, most of Devin's examples on the napkin migrate from "Penetration" to other categories. You can keep the intuition that "the experience changes" without calling it cognitive penetration.

  *   **Chick Sexing:** This is **Perceptual Learning**, not penetration. The visual system itself is physically tuned over weeks of training. It is not that a *belief* changes the experience; it is that the *hardware* has been recalibrated. This is compatible with encapsulation.
  *   **Mangled Sounds/Words:** This is often **Categorical Perception** or **Post-Perceptual Resolution**. You hear the noise (perception), and your language faculty interprets it (cognition). The "aha!" moment is often a judgment, not a change in the raw auditory qualia.
  *   **Walking Past the Post Office:** This is **Ambiguity Resolution**. If the blob is truly ambiguous, your belief selects the interpretation. However, many argue this selection happens *after* the perceptual stage, at the stage of belief formation.
  *   **Wine Vocabulary:** This is the **Descriptive Matching** problem. Having the word "leather" might help you *report* the taste, or direct your attention to that note, without changing the underlying sensory reception.
  *   **Visual Search:** This is **Attention**. Attention selects *which* inputs get processed; it does not change *how* they are processed once selected. Most philosophers agree attention is not cognitive penetration.

  **Cost of this fix:** You have to concede to Devin that "top-down effects" are everywhere (Sense A), but you must do the hard work of distinguishing those from "direct content alteration" (Sense B). You can no longer use the easy examples to prove the hard thesis.

  ### 3. The Triviality Claim (Premise 4)

  Devin argues that if *everything* is penetrated, the concept has no contrast class.
  *   **Correction:** Even if Sense A is ubiquitous, Sense B is not. There is a clear contrast class: **Encapsulated Perception** vs. **Penetrated Perception**.
  *   **Why it matters:** If perception is encapsulated (Sense B is false), then what you see is independent of what you want. If it is penetrable (Sense B is true), what you see is contaminated by what you want. This is a massive difference for science and epistemology. It is not trivial like "everything has a cause."

  ### 4. The Epistemic Worry (Premise 6)

  Devin's step (6) is the "Epistemic Downgrade" argument (associated with Susanna Siegel). He argues: *If belief affects perception, and perception justifies belief, the justification is circular.*
  *   **The Flaw:** This assumes a **Foundationalist** view of justification where the "given" must be pure and untouched.
  *   **The Fix:** Most contemporary epistemologists are **Externalists** or **Coherentists**.
      *   *Externalism:* Justification depends on reliability, not purity. If your belief that "there is a mailbox" causes you to see it clearly, and you are right, the process is reliable. The etiology doesn't necessarily defeat the justification.
      *   *Coherentism:* Beliefs justify each other in a web. Some mutual support is allowed.
  *   **Cost:** You have to abandon the idea that perceptual justification requires a "mythical given" (pure, theory-neutral observation). You must accept that observation is always theory-laden (to use the Hanson/Kuhn phrase), but that doesn't automatically make it unjustified.

  ### Summary for Your Notes

  1.  **Reject Premise (1).** It defines "cognitive penetration" too broadly. It conflates *causal influence* with *constitutive penetration*.
  2.  **Distinguish the Senses.** Devin proved **Broad Top-Down Influence** (trivial, ubiquitous). The debate is about **Strict Cognitive Penetration** (controversial, violates encapsulation).
  3.  **Re-categorize Examples.** Most of Devin's examples (chicks, search, wine) are better explained by **Perceptual Learning**, **Attention**, or **Post-Perceptual Judgment**. These are compatible with modular perception.
  4.  **Block the Skepticism.** Even if Strict Penetration occurs, it does not entail skepticism (Premise 6). Justification relies on reliability, not on the total absence of cognitive influence.
  5.  **The Cost.** You lose the simplicity of Devin's napkin argument. You have to admit that "seeing" is complex and that distinguishing attention from penetration is difficult empirical work. But you save the debate from triviality and save perceptual knowledge from skepticism.

  **Bottom Line:** Devin defined the term so broadly he made it true, then claimed the truth was useless. The literature uses a narrower definition where the truth is not obvious and the stakes are high. Stick to the narrow definition.
