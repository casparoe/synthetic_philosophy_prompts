prompt: |-
  A popular economics blog I follow recently summarized the state of play on interpersonal utility comparisons as follows: "Once economists accepted the ordinalist revolution, they saw that comparing one person's utility with another's is meaningless. Utility is just a device for representing someone's preferences, and preferences are only defined up to the ranking they induce, so there is simply no fact of the matter about whether my satisfaction exceeds yours. That is why welfare economics confines itself to Pareto improvements, and why utilitarianism -- which needs to sum utilities across people -- was quietly abandoned once its foundations were exposed as incoherent." I suspect the conclusion is too strong, but I don't know the literature well enough to say where the trouble lies. Please give me an accuracy audit: which claims a careful welfare economist would accept as broadly right, which are subtle distortions, and which are simply false, and then say whether the blog's closing claim -- that utilitarianism was abandoned because interpersonal comparisons are incoherent -- actually follows from whatever parts of the summary are correct. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
