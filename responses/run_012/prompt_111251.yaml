answer: |-
  **MEMORANDUM**

  **TO:** Restitution Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** 24 October 2023
  **SUBJECT:** Recommendation regarding Ancestral Remains (Acc. 1902)

  **1. Terminology and Scope**
  We must first correct our internal language. We are not engaged in *repatriation* (a state-to-state return of property), but *restitution* (the return of items to a rightful owner based on moral or legal claim). Conflating these has obscured the ethical weight of this decision. This memo addresses the restitution of 38 ancestral human remains and associated grave goods.

  **2. Defining "Community of Origin"**
  Our policy hinges on this undefined phrase. I propose we adopt the following interpretation for human remains: *"Community of Origin" shall be read primarily as a genealogical connection to the geographical place of interment.*

  While continuity of practice (Claimant B's argument) is vital for cultural objects, human remains generally command a specific relationship to the land of burial. To prioritise continuity of practice over geographical origin risks validating the very displacement caused by colonialism as a permanent severance. However, where displacement is colonial, the diaspora retains a significant moral stake. Therefore, while the territorial community is the primary recipient, they must be encouraged to recognise the diaspora's connection.

  **3. Recommendations**

  *   **Recipient:** Restitution should be made to **Claimant A (the local community)**. They possess state backing and a prepared reburial site, ensuring immediate, dignified interment. Claimant B's argument regarding displacement is morally sound, but splitting the collection violates the integrity of the deceased, and Claimant A offers the most secure path to physical rest.
  *   **Destructive Sampling:** I recommend **refusing the request** to retain bone samples from four individuals. The argument that refusing sampling is "paternalistic" is inverted. Taking tissue without explicit, informed consent from the living descendants is the paternalistic act. The "future technology" argument places scientific potential above current ethical obligations. We cannot borrow against the dignity of the dead for potential future gains.
  *   **Continuing Relationship:** I recommend **no formal covenant, loan, or shared guardianship.** Retaining legal interest after restitution implies we still own a piece of them. Our relationship should shift from stewardship to voluntary partnership. We should offer an open invitation for collaboration, but no binding rights.
  *   **Timeframe:** Transfer to be completed within **six months** of this vote. This allows for logistical preparation without dragging out the process.

  **4. Strongest Objections and Mitigation**
  I must be honest about the costs of this recommendation.

  *   **Against Claimant A:** Claimant B will view this as a second erasure. By prioritising land over practice, we risk validating colonial borders. *Mitigation:* The transfer agreement should include a non-binding memorandum of understanding encouraging Claimant A to consult Claimant B regarding the reburial ceremony, acknowledging their shared ancestry.
  *   **Against Refusing DNA:** The scientific loss is real. Future descendants may wish to ask health or lineage questions we cannot answer once the bone is gone. *Mitigation:* We must document the decision thoroughly, framing it as an ethical precaution. We preserve the *possibility* of future consent by not foreclosing it through extraction now; if Claimant A later wishes to sample, that is their sovereign right, not ours.
  *   **Against No Covenant:** We lose leverage to ensure care. *Mitigation:* We must trust the recipients. If we cannot trust them to care for their own ancestors without our legal oversight, we should not be returning them at all.

  **5. Conclusion**
  This decision prioritises the physical rest of the ancestors over scientific utility and territorial connection over diasporic practice. It is not perfect, but it is the most defensible position under current DCMS guidelines. I move that we vote to restitute to Claimant A without conditions.

  ***

  **MINUTES SUMMARY TABLE**

  | Decision point | Recommendation | Confidence | Main reason | Strongest objection and how the memo meets it |
  | :--- | :--- | :--- | :--- | :--- |
  | **Recipient of Remains** | Claimant A (Local/Territorial) | Medium | Established reburial site; aligns with DCMS guidance on geographical origin. | Claimant B (Diaspora) is erased. *Mitigation:* Encourage Claimant A to consult B on ceremony via MOU. |
  | **Destructive DNA Sampling** | Refuse (No samples kept) | High | Precautionary principle; sampling without consent is extraction. | Future scientific questions become unanswerable. *Mitigation:* Framed as preserving future consent rights for descendants, not museum. |
  | **Timeframe** | 6 Months | High | Balances logistical needs with urgency of ethical duty. | May be too tight for complex logistics. *Mitigation:* Timeline reviewed at 3-month mark if transport issues arise. |
  | **Continuing Relationship** | None (Clean break) | Medium | Retaining interest implies continued ownership/control. | Museum loses ability to ensure care standards. *Mitigation:* Trust is a prerequisite for restitution; offer voluntary partnership instead. |
