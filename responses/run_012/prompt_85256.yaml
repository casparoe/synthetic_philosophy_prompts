  **The Case: The Late Addition**

  Consider the final sentence of a realist novel titled *The Winter Gate*, published in 1924 by the fictional author Elias Thorne. The novel is a sombre chronicle of a family's decline during the First World War, written in a dense, naturalistic style consistent with the period. Throughout the manuscript, Thorne refers to the family estate as 'Blackwood Hall'. However, three days before the manuscript goes to the printer, Thorne receives a letter from his estranged brother, who owns the real-life property upon which the fictional hall is based. The brother threatens to sue for libel if the specific name 'Blackwood' is used in connection with the family's sordid affairs depicted in the book. Thorne, wishing to avoid litigation but refusing to alter the text further, decides to change only the name of the hall in the very last sentence. He instructs the typesetter to replace 'Blackwood' with 'Holloway' solely in that final line: 'And so the lights of Blackwood Hall were extinguished forever.' The typesetter executes this instruction, and the published text reads: 'And so the lights of Holloway Hall were extinguished forever.' Thorne intends this to refer to the same estate previously known as Blackwood; he views 'Holloway' as a mere label for the same referent, necessitated by legal prudence. There is no textual indication within the novel that 'Holloway' is a different place; no character ever mentions it, and no plot point suggests a change of location. However, in the public context of 1924, 'Holloway' is widely known as the name of a notorious prison in London, whereas 'Blackwood' carries no such public association. An ideal reader, fully informed about the linguistic conventions of 1924, the genre of the realist novel, and the public connotation of 'Holloway' as a prison, but unaware of Thorne's private correspondence regarding the libel threat, encounters this sentence.

  **The Verdicts**

  **Actual Intentionalism**
  The actual intentionalist holds that the meaning of the text is determined by the author's successful intention to mean something by it. Thorne successfully intended 'Holloway Hall' to refer to the family estate previously known as Blackwood. He did not intend to introduce a new location, nor did he intend to invoke the concept of a prison. He intended the name change to be transparent to the reader as a continuation of the same referent, albeit under a new label. Therefore, the actual intentionalist verdict is that the sentence means: *The lights of the family estate (formerly Blackwood) were extinguished forever.* The change in name is semantically inert regarding the reference; the meaning is fixed by Thorne's successful act of reference, which the conventions of language allowed him to execute (as proper names can be swapped without altering reference if the author intends coreference).

  **Conventionalism**
  The conventionalist holds that meaning is fixed by the linguistic and literary conventions governing the text at the time of publication. In the conventions of 1924 realist fiction, proper names function as rigid designators within the scope of a narrative unless the text signals a shift. The convention for handling a name change in the final sentence of a coherent narrative, without prior introduction or explanation, is to treat it as a synonym for the previously established referent to maintain narrative continuity. To interpret 'Holloway' as a different place would render the ending incoherent and violate the convention of narrative unity. Furthermore, linguistic convention allows for the substitution of proper names where the author stipulates coreference, even if the new name carries external associations. The text does not signal a metaphorical shift. Therefore, the conventionalist verdict aligns with the actual intentionalist: the sentence means *The lights of the family estate were extinguished forever.* The public connotation of 'Holloway' as a prison is extratextual noise that the literary conventions of the realist novel filter out in favour of internal consistency.

  **Hypothetical Intentionalism**
  The hypothetical intentionalist asks what intention an ideal reader, fully informed about the public context but not the author's private mental states, would be justified in attributing to the author. This reader knows the text is a 1924 realist novel. They know 'Holloway' is publicly understood as a prison. They see that the name 'Blackwood' has been used consistently for hundreds of pages and is suddenly swapped for 'Holloway' in the final line without explanation. A hypothetical author, acting rationally within the public context, would not swap a specific proper name for another specific proper name with a vastly different public connotation in the final sentence unless they intended to effect a shift in meaning or tone. To attribute to the author the intention that 'Holloway' simply means 'the place we previously called Blackwood' would require the ideal reader to assume the author made a bizarre, unmotivated error in word choice that clashes with the public meaning of the term. The most justified attribution of intention is that the author intended to invoke the connotations of 'Holloway' to reframe the ending. Thus, the hypothetical intentionalist verdict is that the sentence means: *The lights of the estate were extinguished, implying the estate was a prison or that the family's fate was one of incarceration.* The meaning diverges because the optimal hypothesis of authorial intention must account for the public salience of the word chosen.

  **The Feature Doing the Work**

  The feature generating the divergence is the **public salience of the substituted term's connotation relative to its narrative function**. Specifically, it is the fact that the new name ('Holloway') carries a strong, specific, and widely known public association (prison) that is semantically distinct from the established referent (family estate), combined with the lack of textual signalling for the swap.

  If this feature is removed—for instance, if Thorne had changed the name from 'Blackwood' to 'Oakwood', a name with no strong public connotations—the three verdicts would converge. The ideal reader would have no reason to hypothesise that the author intended a shift in meaning, as 'Oakwood' carries no semantic baggage to justify the change. The hypothetical intention would default to maintaining narrative continuity, aligning with the actual intention and the conventional reading. The divergence relies entirely on the tension between the author's private reason for the swap (legal avoidance) and the public reason available to the reader (semantic association).

  **Hypothetical Intentionalist Resistance**

  A sophisticated hypothetical intentionalist might resist this example by arguing that the ideal reader's construction of the author must include a presumption of **narrative coherence**. They might argue that an ideal reader would recognise that introducing a prison metaphor in the final sentence of a realist novel, without prior foreshadowing, violates the conventions of the genre so severely that no rational author could intend it. Therefore, the 'best hypothesis' is still that the author intended 'Holloway' to function merely as a label for the estate, assuming the author believed the name change would be transparent.

  Alternatively, the hypothetical intentionalist might argue that this case concerns **significance** rather than **meaning**. They could contend that the *meaning* (the propositional content regarding the estate) remains the same across all three theories, but the *significance* (the thematic resonance or emotional impact) is what shifts for the hypothetical reader. They would argue that interpretation should only track the semantic content fixed by the best hypothesis, and since the sentence is literally about the hall, the 'prison' reading is merely a readerly association, not a meaning fixed by hypothetical intention. To maintain the divergence, one must insist that the thematic reframing *is* part of the meaning in literary interpretation, not just an incidental effect.

  **Author Availability and Genre**

  The case still works if the author is dead or unavailable. In fact, the unavailability of the author strengthens the hypothetical intentionalist position, as it forces reliance on the public evidence. For the actual intentionalist, the meaning remains fixed by the historical intention regardless of access; for the hypothetical intentionalist, the lack of access makes the public context the sole determinant of the 'best hypothesis'.

  It matters significantly that the text is **literary rather than legal**. In a legal document, conventionalism would likely dominate entirely. If a contract referred to 'Property A' throughout and then suddenly used 'Property B' in the final clause without definition, a court would likely rule the document ambiguous or void for uncertainty, rather than searching for a hypothetical intention to invoke the connotations of 'Property B'. Legal interpretation prioritises precision and stability of reference over thematic resonance. In literature, however, the 'death of the author' and the richness of connotation allow the hypothetical intentionalist to argue that the public weight of the word 'Holloway' legitimately alters the work's meaning, whereas in law, such a shift would be treated as a drafting error to be corrected by extrinsic evidence (which the hypothetical intentionalist is barred from using, but the legal system would allow). Thus, the divergence is most robust in the literary context where thematic implication is constitutive of meaning.
