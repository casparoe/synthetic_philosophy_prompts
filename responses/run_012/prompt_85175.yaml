      Your hypothesis is incisive and largely correct. The disagreement stalls because "Darwinism" functions as a placeholder for three distinct claims, and you and your colleague are defending/attacking different ones without realizing it.

      1.  **The Logical Mechanism:** Variation, heredity, and differential reproduction exist. This is analytically true and trivially testable.
      2.  **The Causal Thesis:** Selection is the *primary* driver of evolutionary change. This is an empirical claim about frequency.
      3.  **The Adaptationist Programme:** Treat every trait *as if* it were an adaptation. This is a methodological heuristic.

      Your colleague defends (1). When they say "define fitness properly," they are securing the logical coherence of the mechanism. They are right that (1) is not a tautology if fitness is defined via phenotypic traits independent of survival. Popper's recantation acknowledges this: specific selection models *can* be falsified.

      You are attacking (3), with worries about (2). Your concern isn't whether selection *can* happen, but whether the theory constrains explanation enough to be scientific. If every outcome is explained post-hoc by inventing a selective pressure, the theory risks becoming a "metaphysical research programme"—compatible with any data. This isn't about the definition of fitness; it's about the *inference* of selection. When you say the charge is about predictive content, you are asking: Can we specify conditions under which we would conclude selection *did not* occur?

      The hidden formal question is about **null models**. The disagreement persists because evolutionary biology historically lacked robust null hypotheses (like the Neutral Theory in genetics). Without a formal baseline for "no selection," any deviation can be claimed as evidence *for* selection. This validates your worry: if the theory explains everything, it predicts nothing. However, your colleague is right that modern evolutionary biology *does* use null models, making specific claims testable.

      So, is it verbal or substantive? It is **substantive but mislocated**. It looks like a verbal dispute about "fitness," but it is actually a methodological dispute about **inference standards**. You are arguing about the sociology of scientific practice (do biologists too easily invoke selection?), while your colleague is arguing about the logical capacity of the theory (is selection inherently untestable?). Both claims can be true simultaneously: The theory is logically testable (Colleague), but often applied in an unfalsifiable manner (You).

      Popper's original objection targeted the universal claim (2 & 3). His recantation accepted the local claim (1). Neither of you is wrong; you are just measuring different things.

      **Can this move?**
      Yes, but not by arguing about Popper. Progress requires shifting the question from "Is Darwinism scientific?" to "What are the limits of adaptationist inference?"
      1.  **Distinguish Scope:** Explicitly agree on which layer (1, 2, or 3) is being discussed.
      2.  **Formalize Constraints:** Progress lies in formalizing when selection explanations are prohibited. The rise of Evo-Devo and Neutral Theory provides this. If you can point to specific traits where selection is ruled out by constraint or drift, you validate the theory's falsifiability.
      3.  **Accept Partial Victory:** Your colleague wins on logic (NS is testable). You win on methodology (adaptationism can be overextended).

      Expect the argument to continue only if you insist on a single verdict for "Darwinism." If you treat it as a cluster of claims, the tension dissolves into productive methodological scrutiny. The stalemate is not inevitable; it is a symptom of imprecise taxonomy.

