  2.  **Deconstruct the Disagreement:**
      *   **Core Issue:** Is natural selection (NS) a testable scientific theory or a metaphysical framework?
      *   **Colleague A's View:** It's testable. The tautology problem ("survival of the fittest" where fitness = survival) is solved by defining fitness independently (e.g., phenotypic traits). Popper admitted this.
      *   **User's View:** The problem isn't just definition; it's predictive power. Can NS be falsified *before* the outcome is known? Or does it just explain everything post-hoc?
      *   **User's Hypothesis:** Ambiguity in "Darwinism" (Mechanism vs. Main Driver vs. Adaptationist Programme). Popper attacks #3, critics defend #1.

  3.  **Evaluate the User's Hypothesis:**
      *   The hypothesis is strong. It aligns with philosophical analyses (e.g., Gould, Lewontin's "Spandrels" critique fits the "Adaptationist Programme" bucket).
      *   Popper's initial worry was indeed about the *universal* explanatory power that risks becoming unfalsifiable (metaphysical).
      *   Biologists defend the *mechanism* (variation + selection exists).
      *   The disagreement stalls because they are talking past each other regarding *scope*.

  4.  **Diagnose the Structure:**
      *   It's not purely verbal (definitions matter), but it's not purely empirical either.
      *   It's a **category error regarding scope and ambition**.
      *   Colleague A defends the *logical possibility* of testing selection (local models).
      *   User defends the *global claim* that NS explains everything (which risks unfalsifiability).
      *   Popper's recantation acknowledged local testability but didn't necessarily vindicate global adaptationism.

