      *   *The Rankean Baseline:* Defend the idea that individual statements can be objectively verified (dates, actions, existence). This is the "modest objectivity."
      *   *The Whitean Challenge:* Acknowledge that connecting these statements into a plot introduces subjectivity (emplotment). This isn't about lying, it's about shaping.
      *   *The Synthesis (Unit of Assessment):* Argue that White is right about the *narrative*, but Ranke is right about the *statement*. The conflict arises from confusing the two.
      *   *The Carrian Problem:* If statements are true but the narrative is shaped, how do we judge the history? Carr's "dialogue" needs constraints on selection.
      *   *The Test Case:* Construct a scenario where true sentences make a false impression (e.g., a political career, a battle, or a scientific discovery). Let's go with a political scandal or a war origin. A war origin might be clearer. Or perhaps a biography. Let's try a biography of a leader where all facts are true but the *omission* of context changes the moral valence.
