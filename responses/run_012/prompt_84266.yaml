      *   *Carr:* History is an interaction between the historian and the facts. Selection is key. Facts don't speak for themselves.
      *   *White:* Historiography is literary. Emplotment (tragic, comic, etc.) imposes meaning. This threatens objectivity because the *form* determines the *truth value* of the history, not just the content.
      *   *The User's Synthesis:* White attacks the *narrative whole*. Ranke defends the *individual statement*. If we distinguish these levels, we save objectivity for facts (Ranke) while acknowledging the interpretive nature of storytelling (White/Carr). However, this creates a gap: how do we constrain selection if facts are true but the story is lies?

  3.  **Drafting - Section by Section (Mental Outline):**
