      *   *Developing the "Unit" Argument:* Use the analogy of bricks and a building. Bricks (statements) can be solid (objective), but the architecture (narrative) can be deceptive.
      *   *Addressing Ranke:* Ranke isn't necessarily claiming the *story* is God's eye view, but that the *facts* are recoverable.
