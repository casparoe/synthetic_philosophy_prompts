prompt: |-
  I run the employee-relations intake desk at a mid-size company, and a big part of my week is triaging complaints about things people said to each other in Slack, email, and meetings. Legal wants us to stop collapsing everything into "harassment" or "not harassment" and instead figure out what kind of speech act actually happened: was it an instruction, a request, a promise, a warning, a threat, an apology, a resignation, a joke, a prediction, or just an expression of frustration? The difference changes whether we open a case, whether we tell a manager to follow up, whether we treat someone as having committed to something, and whether we have to loop in Legal. I've read enough Austin and Searle to know that the same sentence can have different illocutionary force depending on context, uptake, and felicity conditions, but I need something a non-philosopher on my team can actually run in about twenty minutes per complaint, with a written rationale that will survive a review by our employment lawyer. We handle maybe forty of these a week, and the stakes are high: a wrong call can mean someone gets disciplined for a joke or, worse, a real threat gets filed as "venting." I've also been reading about uptake -- the idea that an illocutionary act isn't fully done until the hearer recognizes it -- and I want that built in, because half our disputes are about whether a message "counted" as an instruction or a promise.

  Please write me a decision procedure, in order, that starts from the raw message and the surrounding thread, and ends with a classification plus a confidence level and a recommended action. It should make clear which questions are about the speaker's intent, which are about what a reasonable hearer would take them to be doing, and which are about whether the institution recognizes the act -- e.g., can a junior employee "resign" in a Slack DM, can a manager "promise" a promotion, can an apology without any acknowledgment of harm count as an apology. Include the tests my team should run, what counts as a sufficient answer to each, where the procedure stops with a no, and where it has to hand the decision to a human because it's a values call or a legal call. Then run it on three cases: (1) a manager writes "we should probably fix this before Friday" in a thread where the team has missed two deadlines; (2) an employee writes "if you bring that up in the all-hands again, I'm done" to a coworker after a conflict; (3) a director writes "I'm sorry you feel that way" in a public channel after being told their comment was hurtful. For each, show the procedure's classification, its confidence, and the action. Finally, tell me where the procedure will misfire -- sarcasm, neurodivergent literal reading, cross-cultural indirectness, jokes that are only jokes in-group -- and which parts of Austin and Searle you had to drop to make it usable. Don't give me a bibliography or citations; I just need the procedure and the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Employee-relations intake desk lead at a mid-size company.
      *   **Task:** Create a decision procedure for triaging communication complaints (Slack, email, meetings).
      *   **Goal:** Move beyond binary "harassment/not harassment" to specific speech act classification (instruction, request, promise, warning, threat, apology, resignation, joke, prediction, frustration).
      *   **Constraints:**
          *   Must be usable by non-philosophers.
          *   Must take ~20 minutes per complaint.
          *   Must produce a written rationale suitable for legal review.
          *   Volume: ~40/week.
          *   High stakes (discipline vs. missed threats).
          *   Must incorporate "uptake" (hearer recognition).
          *   Must distinguish intent, reasonable hearer interpretation, and institutional felicity conditions.
          *   Must include tests, stopping points, and escalation triggers.
          *   Must apply the procedure to three specific cases.
          *   Must identify limitations (sarcasm, neurodivergence, culture, in-group jokes) and theoretical simplifications (Austin/Searle drops).
          *   No bibliography/citations.

  2.  **Deconstruct the Theoretical Basis (Austin/Searle) for Practical Use:**
      *   *Locutionary Act:* What was literally said? (Keep it simple: transcript).
      *   *Illocutionary Act:* What was done *in* saying it? (This is the core classification).
      *   *Perlocutionary Act:* What was the effect? (Relevant for harm assessment, but less for classification).
      *   *Felicity Conditions:* Does the context allow this act to be valid? (e.g., authority to instruct, institutional recognition of resignation).
      *   *Uptake:* Did the receiver understand it as such? (Crucial for disputes).
      *   *Simplification:* Avoid deep philosophical debate on "intentionality." Focus on *evidence* of intent and *objective* interpretation.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be linear, step-by-step, with clear "If/Then" logic.
      *   *Timebox:* 20 minutes means roughly 3-4 minutes per step.
      *   *Sections:*
          1.  Context & Evidence Gathering.
          2.  The "Reasonable Hearer" Test (Uptake).
          3.  The "Speaker Intent" Test.
          4.  The "Institutional Felicity" Test (Authority/Validity).
          5.  Classification & Action.
          6.  Escalation Triggers.
      *   *Documentation:* Each step needs a field for the analyst to write the rationale.

  4.  **Refining the Tests:**
      *   *Intent:* Look at emojis, prior messages, tone markers.
      *   *Uptake:* How did the recipient reply? Did they act on it? Did they complain immediately?
      *   *Felicity:* Does this person have the power to do this thing? (e.g., resigning via DM to peer vs. HR).
      *   *Safety:* Threats need immediate escalation, not just classification.

  5.  **Applying to the Three Cases:**
      *   *Case 1 (Manager: "fix before Friday"):* Context is missed deadlines. Likely an *Instruction* or *Directive*, not just a suggestion. High confidence. Action: Treat as assignment/deadline.
      *   *Case 2 (Employee: "I'm done"):* Context is conflict. Ambiguous. Is it a *Threat* (violence/quitting) or *Frustration*? "I'm done" usually implies resignation or threat of violence. Needs safety check. Likely *Threat/Ultimatum*. Action: Escalate to Security/HR.
      *   *Case 3 (Director: "Sorry you feel that way"):* Context is harm called out. This is a *Non-Apology* (Assertive/Expressive hybrid). Felicity condition for apology (acknowledgment of fault) failed. Action: Coaching/ER case, not a valid apology.

  6.  **Identifying Limitations (The "Misfire" Section):**
      *   *Sarcasm:* Text lacks tone.
      *   *Neurodivergence:* Literal vs. implied meaning.
      *   *Culture:* High-context vs. low-context communication.
      *   *In-group:* Jokes that look like harassment to outsiders.
      *   *Theoretical Drops:* Had to ignore "sincerity conditions" (hard to prove) and focus on "observable effects." Had to simplify "constitutive rules."

  7.  **Review against Constraints:**
      *   *20 mins?* Yes, if the steps are focused.
      *   *Legal review?* Yes, emphasizes "reasonable person" standard and institutional policy.
      *   *Uptake included?* Yes, Step 2.
      *   *No citations?* Check.
      *   *Tone:* Professional, operational, directive.

  8.  **Final Polish:**
      *   Ensure the distinction between "Intent," "Uptake," and "Felicity" is clear in the procedure.
      *   Make sure the "Stop/Handoff" points are obvious.
      *   Ensure the Case Studies clearly show the *application* of the steps, not just the result.

  **(Self-Correction during drafting):** I initially thought about asking the analyst to interview the parties. *Correction:* No, that takes too long for triage. This is an *intake* procedure based on available evidence (logs, tickets). Interviews happen *after* triage if a case is opened. I need to make sure the procedure reflects *document review*, not investigation.
  *Correction on Case 2:* "I'm done" is highly ambiguous. It could mean "I'm quitting" or "I'm going to hurt you." The procedure must flag this as a Safety/Legal escalation immediately, not just an ER classification.
  *Correction on Theory:* Don't mention "Illocutionary Point" explicitly as a term, use "Communicative Goal." Keep the language operational.

  9.  **Final Output Structure:**
      *   Introduction (Purpose & Scope).
      *   The Speech Act Triage Protocol (Steps 1-6).
      *   Case Study Applications.
      *   Known Failure Modes & Theoretical Simplifications.

  10. **Writing the Content:** (Proceeding to generate response based on these thoughts).
answer: |-
  # Speech Act Triage Protocol (SATP)
  **Version:** 1.0  
  **Owner:** Employee Relations Intake  
  **Time Limit:** 20 Minutes per Ticket  
  **Goal:** Classify the communicative act to determine downstream workflow (Legal, Management, ER, or Close).

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Establish the Record (3 Minutes)
  **Action:** Capture the raw data. Do not interpret yet.
  1.  **Transcript:** Copy the exact message(s) including timestamps, channel, and participants.
  2.  **Thread Context:** Copy the three messages immediately preceding and the three immediately following the target message.
  3.  **Relationship Map:** Note the roles (e.g., Manager→Direct Report, Peer→Peer, Director→Junior).
  4.  **History:** Check if there is a prior conflict ticket between these users in the last 12 months.

  **Stop Condition:** If the message contains explicit threats of physical violence, self-harm, or protected class slurs, **STOP**. Escalate immediately to Security/Legal. Do not apply the rest of this protocol.

  ### Step 2: The "Reasonable Hearer" Test (Uptake) (5 Minutes)
  **Goal:** Determine how the message landed, regardless of speaker intent. This addresses *uptake*.
  1.  **Immediate Reaction:** How did the recipient reply in the thread?
      *   *Acknowledgement/Action:* ("On it," "Okay") → Suggests Instruction/Request.
      *   *Pushback/Confusion:* ("What do you mean?" "That's not my job") → Suggests Ambiguity or Disputed Authority.
      *   *Distress/Report:* ("This is inappropriate," silent then ticket filed) → Suggests Threat/Harassment/Frustration.
  2.  **Objective Interpretation:** If you remove all knowledge of the speaker's personality, what does the text do?
      *   Does it change the recipient's obligations? (Instruction/Promise)
      *   Does it predict a negative outcome controlled by the speaker? (Threat/Warning)
      *   Does it express an internal state without demanding action? (Frustration/Joke)

  **Documentation Field:** *Hearer Uptake Rationale.* (e.g., "Recipient replied 'Understood' and worked weekend, indicating uptake as Instruction.")

  ### Step 3: The "Speaker Intent" Test (5 Minutes)
  **Goal:** Determine what the speaker was trying to do, based on evidence.
  1.  **Tone Markers:** Look for emojis, punctuation, or hedging ("maybe," "probably," "just").
      *   Hedging + Question mark → Request/Suggestion.
      *   Imperative + Period → Instruction/Command.
      *   Hyperbole + Emoji → Joke/Frustration.
  2.  **Consistency:** Does this match the speaker's typical style (per prior logs)?
  3.  **Retrospective Statement:** If the speaker has already provided a statement, does it align with the text? (Note: Do not interview them yet; use existing notes).

  **Documentation Field:** *Intent Evidence.* (e.g., "Speaker used 'we should' not 'you must,' but context of missed deadlines implies directive.")

  ### Step 4: The "Institutional Felicity" Test (5 Minutes)
  **Goal:** Determine if the organization recognizes this act as valid. An act can be intended and understood but still "misfire" institutionally.
  1.  **Authority:** Does the speaker have the standing to perform this act?
      *   *Resignation:* Can they resign via Slack DM to a peer? (Usually No).
      *   *Promotion/Compromise:* Can a Manager promise a raise without HR approval? (Usually No).
      *   *Instruction:* Does this fall within their scope of management?
  2.  **Channel Appropriateness:** Is this channel recognized for this act?
      *   *Apology:* Does a public channel apology satisfy the requirement for private remediation?
      *   *Resignation:* Does HR need a formal letter?
  3.  **Sincerity Condition (Light Touch):** Is there evidence the speaker knew the statement was false? (e.g., Promising something they know is impossible).

  **Documentation Field:** *Felicity Status.* (Valid / Invalid / Ambiguous).

  ### Step 5: Classification & Action (2 Minutes)
  **Goal:** Assign the label and the workflow.
  Select one primary classification:
  *   **Directive:** (Instruction, Order, Request) → *Action:* Manager follow-up on deliverables.
  *   **Commissive:** (Promise, Commitment, Resignation) → *Action:* Verify validity with HR/Lead.
  *   **Threat/Warning:** (Negative consequence predicted) → *Action:* Security/Legal Review.
  *   **Expressive:** (Apology, Frustration, Joke, Regret) → *Action:* Coaching or Close.
  *   **Assertive:** (Statement of fact, Prediction) → *Action:* Close unless factually disputed.

  **Confidence Level:** High / Medium / Low.
  **Recommendation:** Open Case / Manager Coaching / No Action / Escalate.

  ### Step 6: Escalation Triggers (Human Review)
  **Hand off to Senior ER or Legal if:**
  1.  **Conflict:** Step 2 (Hearer) and Step 3 (Intent) yield contradictory results (e.g., Speaker says "Joke," Hearer heard "Threat").
  2.  **Power Imbalance:** The act involves a significant power differential and the classification is "Joke" or "Frustration."
  3.  **Felicity Failure:** The act was intended (e.g., Resignation) but institutionally invalid.
  4.  **Low Confidence:** Analyst confidence is "Low."

  ---

  ## Part 2: Case Applications

  ### Case 1: The Missed Deadline
  **Raw Message:** Manager writes "we should probably fix this before Friday" in a thread where the team has missed two deadlines.
  *   **Step 1 (Record):** Manager → Team. Context: Two prior missed deadlines. Channel: Project Slack.
  *   **Step 2 (Uptake):** Team members replied "On it" and worked late. Hearer treated it as a mandatory deadline.
  *   **Step 3 (Intent):** "Should probably" is hedged, but context of prior failure suggests corrective action is required, not optional.
  *   **Step 4 (Felicity):** Manager has authority to set deadlines. Channel is appropriate for work instructions.
  *   **Step 5 (Classification):** **Directive (Instruction).**
      *   **Confidence:** High.
      *   **Rationale:** Despite hedging ("probably"), the context of prior failures and the team's uptake (working late) converts this to an instruction.
      *   **Action:** **No ER Case.** Log as workload assignment. If team complains of undue pressure, route to Manager Coaching.

  ### Case 2: The Conflict Ultimatum
  **Raw Message:** Employee writes "if you bring that up in the all-hands again, I'm done" to a coworker after a conflict.
  *   **Step 1 (Record):** Peer → Peer. Context: Active interpersonal conflict. Channel: DM.
  *   **Step 2 (Uptake):** Recipient filed a ticket immediately citing fear of physical altercation or sudden departure.
  *   **Step 3 (Intent):** Ambiguous. Could mean "I quit" or "I will fight."
  *   **Step 4 (Felicity):** "I'm done" is not a formal resignation (no notice, no HR). As a threat, it requires safety assessment.
  *   **Step 5 (Classification):** **Threat/Warning (Ambiguous).**
      *   **Confidence:** Medium (due to ambiguity).
      *   **Rationale:** Uptake indicates fear. "I'm done" is a conditional statement of termination of relationship or safety. Cannot be treated as simple frustration.
      *   **Action:** **Escalate to Security & Legal.** Do not close. Treat as potential workplace violence threat until proven otherwise.

  ### Case 3: The Non-Apology
  **Raw Message:** Director writes "I'm sorry you feel that way" in a public channel after being told their comment was hurtful.
  *   **Step 1 (Record):** Director → Junior. Context: Harm reported. Channel: Public.
  *   **Step 2 (Uptake):** Recipient and observers reacted negatively; harm was not remediated.
  *   **Step 3 (Intent):** Speaker likely intended to close the conversation (Expressive), not admit fault.
  *   **Step 4 (Felicity):** **Failed.** An institutional apology requires acknowledgment of harm and commitment to change. This statement shifts blame to the hearer's feelings.
  *   **Step 5 (Classification):** **Expressive (Invalid Apology).**
      *   **Confidence:** High.
      *   **Rationale:** While grammatically an apology, it fails the felicity condition of acknowledging responsibility. It functions as a dismissal.
      *   **Action:** **Open ER Case.** Not for harassment, but for Leadership Conduct/Coaching. The act exacerbated the harm.

  ---

  ## Part 3: Failure Modes & Theoretical Simplifications

  ### Where This Procedure Will Misfire
  1.  **Sarcasm and Irony:** Text-based communication strips tone. A sarcastic "Great job" looks like a compliment in Step 2 (Uptake) if the recipient doesn't reply. *Mitigation:* If the tone is ambiguous and power dynamics exist, default to "Low Confidence" and escalate.
  2.  **Neurodivergent Literalism:** Some employees communicate literally (no hedging) while others rely on implication. A literal "Fix this" may be intended as a collaborative "We need to fix this," but received as an order. *Mitigation:* Step 3 (Intent) must check historical communication styles of the specific sender.
  3.  **Cross-Cultural Indirectness:** In high-context cultures, "It might be cold in here" is a request to close the window. In low-context cultures, it is a weather report. *Mitigation:* Analysts must be trained to recognize cultural variance in "Directives."
  4.  **In-Group Jokes:** A slur reclaimed within a specific team may look like harassment to an outsider analyst. *Mitigation:* Step 1 must include checking "History" of interaction between these specific users. If the history shows reciprocal joking, classification shifts from Harassment to Expressive (Joke), but Legal must still review protected class usage.

  ### Theoretical Simplifications (What Was Dropped)
  To make this usable in 20 minutes, the following philosophical nuances were removed:
  1.  **Sincerity Conditions:** Austin argues a promise is void if the speaker doesn't intend to keep it. We cannot know internal intent. We substituted this with **Institutional Felicity**: Does the company recognize the commitment regardless of internal state?
  2.  **Perlocutionary Effect:** We do not measure the actual emotional damage (perlocution) for classification, only the **Uptake** (recognition of the act). Damage assessment is a separate legal/HR process.
  3.  **Essentialism:** We do not decide if a speech act *is* inherently a threat. We decide if it *functions* as one in this context. This avoids metaphysical debates and focuses on operational risk.
  4.  **Ideal Hearer:** We use a "Reasonable Hearer" standard (legal construct) rather than the specific recipient's subjective interpretation, to prevent weaponization of sensitivity. However, if the specific recipient's uptake is documented (e.g., "I felt threatened"), that evidence weighs heavily in Step 2.

  ### Final Note on "Uptake"
  This protocol treats Uptake as **evidence**, not **constitutive**. In strict theory, if uptake fails, the act fails. In employment law, if a manager sends a harassing email and the employee doesn't understand it until later, it is still harassment. Therefore, Step 2 measures *how it was received* to gauge risk, but Step 4 (Institutional Felicity) and Legal Review override Uptake if the act violates policy regardless of understanding.
