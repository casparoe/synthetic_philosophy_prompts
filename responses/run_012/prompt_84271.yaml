  2. He did not explicitly argue that vivisection was morally permissible, and the notorious stories of live dissection are primarily associated with later Cartesians rather than Descartes himself.
  3. The lecture is correct that his main evidence was behavioral, specifically claiming animals lack language and adaptable reason, acting only through mechanical disposition.
  4. Protecting the immortality of the human soul was a genuine concern for Descartes, but reducing his metaphysics solely to Church pressure ignores his independent philosophical commitment to dualism.
  5. Your flatmate is right that the extreme moral conclusion is often a caricature, as Descartes denies animals minds but never explicitly argues that harming them is morally permissible.
