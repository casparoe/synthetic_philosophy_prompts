  I'm taking a second-year course on early modern philosophy and I keep getting dragged into arguments with my flatmate about Descartes and animals, and I've realised I don't actually know enough to say anything useful. The picture I've got comes from a recorded lecture I watched for a completely different module, where the lecturer put it roughly like this: Descartes thought animals are just machines — clockwork with fur — because everything about them can be explained mechanically, and since they have no minds at all they have no sensations either, so a dog's yelp when you stand on its tail is just the noise of a badly made automaton, with nobody home to feel anything. He went on to say that Descartes drew the obvious moral conclusion from this, that since there's no one in there to be harmed, cutting animals open while they're still alive or hunting them for entertainment is morally unproblematic, and that his main argument for the whole package was simply that we've never seen an animal do anything a machine couldn't do. And apparently the real reason he was so keen on all this is that the Church needed humans to be the only creatures with immortal souls, so he had a motive for denying animals a mind.

  My flatmate says this is a cartoon and that Descartes gets blamed for stuff his followers said, but she's the kind of person who says that about everyone, so I'd like an actual answer rather than a vibe. Can you tell me how much of that lecture I can trust? I want to know what someone who works on Descartes would nod along with, what they'd wince at, and what's just wrong — in particular whether the move from no mind to no feeling is something Descartes actually argued for or an extra premise that got smuggled in, whether the vivisection-is-fine bit is his view or somebody else's, and whether, even if you granted him the metaphysics, the moral conclusion would really follow from it. Please give it to me as a numbered list of exactly five points, a sentence or two each, with no introduction and no summing up at the end.
