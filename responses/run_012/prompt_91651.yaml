answer: |-
  You have put your finger on the central methodological crisis of Global History as it has been practiced for the last thirty years. You are correct that "Eurocentrism" is too blunt an instrument here; that term usually accuses the author of bias or omission. What you are describing is a **structural** or **narratological** constraint. It is not that the author *wants* to center Europe, but that the *grammar of connection* they are using to build a global story has European coordinates built into its syntax.

  There is no single, universally agreed-upon noun for this specific bind (like "The Prisoner's Dilemma"), but it is a recognized diagnostic in the field. Historians like Dipesh Chakrabarty, Sebastian Conrad, and Sanjay Subrahmanyam have circled it for decades.

  However, since you asked for a name to help your reading group grasp the *shape* of the thing, I propose we coin a term that captures the mechanics you described:

  ### **The Centripetal Bind**

  Here is the breakdown of what this term covers, why the bind exists, and how it answers your specific test cases.

  ---

  ### 1. The Shape of the Thing: Why the Spine Bends
  The Centripetal Bind occurs when a historian attempts to write a **Global History** (a perspective that sees the world as a whole) but relies on a **History of Globalization** (a narrative about the process of integration) to hold it together.

  *   **The Trap:** To make a narrative coherent, you need causality. In global history, causality is almost always mapped as *connection*, *exchange*, or *integration*. (e.g., "This event matters because it affected the trade route.")
  *   **The Gravity:** In the modern period (1500–present), the primary engine of global integration was the rise of the capitalist world-system and imperial expansion, both of which were architecturally centered in Western Europe.
  *   **The Result:** If "significance" is determined by "connection to the system," and the "system" is routed through London/Amsterdam, then the narrative physics inevitably pull the story toward those hubs. The thread *is* the empire. You cannot trace the thread without tracing the empire.

  This is why your group feels the "Eurocentric spine." It is not a bias of the author; it is a **bias of the plot**. The plot assumes that "history happens" when things become connected, and the connective tissue was European-made.

  ### 2. Existing Theoretical Neighbors
  While "The Centripetal Bind" is a coinage for your specific description, it synthesizes three existing critiques:

  *   **Chakrabarty's "History 1":** In *Provincializing Europe*, Dipesh Chakrabarty argues that all historical thought inherits "History 1"—a secular, universalizing, progressive time derived from the European Enlightenment. Even when writing about India or Africa, historians often use European categories (state, market, citizen) as the universal measuring stick. The Centripetal Bind is the narratological manifestation of History 1.
  *   **Global History vs. History of Globalization:** German historian Sebastian Conrad distinguishes between these two. *Global History* is a perspective (viewing a local event in a global context). *History of Globalization* is a story about increasing interdependence. Most books claim to be the former but are actually the latter. Since globalization was driven by Europe, the History of Globalization is inevitably Eurocentric in its spine.
  *   **The Fallacy of Homogeneous Empty Time:** Borrowing from Benedict Anderson, this is the assumption that all places exist in the same "now" and are moving toward the same future. This forces the historian to sync the milestones of the Global South to the timeline of the Global North (e.g., "What was Japan doing during the Industrial Revolution?").

  ### 3. Testing Your Alternatives
  You asked two specific questions about whether alternative approaches escape the bind. Here is how the Centripetal Bind analyzes them:

  **A. The "Regional Center" Fix (e.g., Atlantic History inside Africa/Americas)**
  *   **Does it escape?** Generally, **no**. It often just **relocates the centrifuge.**
  *   **Why:** If you write a history of the Atlantic that stays within Africa and the Americas but still uses "trade," "empire," or "market integration" as the thread, you are still using the *logic* of the system that Europe built. You might make Africa the protagonist, but if the *criteria for significance* is still "volume of trade" or "state formation," you are playing a game where the rules were written in Europe.
  *   **Exception:** It escapes the bind only if it abandons the "integration" thread entirely and focuses on internal logics that *ignore* the Atlantic system. But then, is it still a history of the *Atlantic*? Or is it a history of West Africa that happens to be near an ocean?

  **B. The "Fragmented" Fix (Refusing the Thread)**
  *   **Does it escape?** Yes, but at the cost of **historical synthesis.**
  *   **Why:** This is the "pile of separate local accounts" you mentioned. It solves the Centripetal Bind by refusing to create a center. However, history is fundamentally about *change over time* and *causality*. If you refuse to link the chapters, you have removed the causality. You have created a gazetteer, not a history.
  *   **Verdict:** This is not a solution; it is an abdication. It avoids the bias by refusing to do the work of synthesis.

  ### 4. Is the Problem the "Protagonist"?
  You asked: *"Is the problem that any single narrative needs a protagonist, or that the protagonists available to us are all European?"*

  It is deeper than the protagonist. It is about the **Medium of Action.**
  In a novel, the protagonist can be anyone. In Global History, the "protagonist" is often not a person, but a **process** (Industrialization, Modernization, Democratization).
  *   If the process is "The Rise of the World Market," the protagonist is Capital.
  *   If the process is "The Spread of the State," the protagonist is the Bureaucracy.

  Because Capital and the Modern State were codified in Europe, they carry European DNA. You cannot make a non-European protagonist act within a European process without the story snapping back to Europe.

  ### 5. How to Break the Bind (For Your Reading Group)
  If the Centripetal Bind is the problem, the solution is not to find a new center, but to change the **topology of the narrative.**

  1.  **Polyphonic Histories:** Instead of one thread (the spine), use multiple, overlapping threads that do not necessarily converge. A history of sugar might have one thread for labor, one for ecology, and one for taste. They touch but do not merge into a single "Market."
  2.  **The Global as a Question, Not a Frame:** Don't start with "The World." Start with a place and ask "How is this place constituted by its relations?" Sometimes the answer is "It isn't connected to London." That is a valid historical finding.
  3.  **Vertical vs. Horizontal:** Most global history is horizontal (Place A connects to Place B). Some of the best work recently is vertical (Place A connects to the Soil, the Microbes, the Climate). This bypasses the imperial trade routes entirely.

  ### Summary for the Group
  You can tell your reading group that they are encountering **The Centripetal Bind**.

  *   **Definition:** The structural tendency of global narratives to pull toward European hubs because the *criteria for connection* (trade, empire, markets) are inherited from European-dominated systems.
  *   **Diagnosis:** It is a confusion between **Global History** (a perspective) and the **History of Globalization** (a specific process of integration).
  *   **Verdict on Solutions:** Multiplying centers fails if the *logic* of the center remains the same. Fragmentation fails because it abandons causality. The only way out is to stop using "Integration" as the default plot device for "Significance."

  You are circling something real. It is the tension between the desire for a coherent story and the reality that the coherence of the modern world was imposed by a specific power. To tell the story without telling *their* story requires inventing a new grammar of history, which is why so many books hit that wall.
