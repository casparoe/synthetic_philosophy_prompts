  ### 1. The Established Concepts

  **A. The Politics of Artifacts (Langdon Winner)**
  In 1980, political scientist Langdon Winner wrote a famous essay, *"Do Artifacts Have Politics?"* He argued that technologies are not neutral tools; they can embody specific forms of power and authority.
  *   **How it fits:** You noticed that the app settled a question of "who has power over whom" (teachers over students) without a vote. Winner would call this a technology that *facilitates* a specific political arrangement.
  *   **The Limit:** Winner often argued that some technologies *require* certain power structures (e.g., nuclear power plants require strict hierarchy for safety). Your observation is more subtle: the *same* app allowed freedom in your cousin's school but control in yours. This means the technology didn't *force* the outcome, which leads us to the next concept.

  **B. Delegation and Scripts (Bruno Latour & Madeleine Akrich)**
  Philosopher Bruno Latour argued that humans "delegate" moral and political responsibilities to objects. A speed bump, for example, is a delegate of the police officer; it forces you to slow down without a human present. Madeleine Akrich expanded this with **"Script Theory."** She argued that designers write a "script" into a technology—a prediction of how users *should* behave.
  *   **How it fits:** The app developers wrote a script: "Teachers log exits; students wait for approval." In your school, the administration and faculty *accepted* this script. The authority was delegated from the student council/faculty meeting to the software's default settings.
  *   **The "Data vs. Decision" aspect:** Latour calls this **"Black Boxing."** Once the delegation is accepted, the political choice disappears inside the "black box" of the technology. It no longer looks like a rule ("Students must ask permission"); it looks like a fact ("The system requires a timestamp"). This is why it is hard to argue against: you aren't arguing against a teacher's whim, you are arguing against "how the system works."

  **C. Enactment (Wanda Orlikowski)**
  This is the concept that solves your confusion about your cousin's school. Orlikowski argues that technology does not determine outcomes; technology is **"enacted"** in practice. The same software can be enacted as a tool of surveillance in one building and as a trivial convenience in another, depending on the local culture.
  *   **How it fits:** This explains why the tool didn't force the outcome. In your cousin's school, the users *rejected* the script (they didn't check the logs). In your school, they *enacted* it. The power wasn't in the code; it was in the *adoption of the default*.

  ### 2. The Name and Definition

  Since you asked for a name if no single concept fits perfectly, the most precise term for the specific dynamic you described (a default setting that settles a power question silently, contingent on local adoption) is:

  **Authority by Default**

  This is a specific variation of **"Governance by Default."** It distinguishes itself from general "technological determinism" (the idea that tools force outcomes) by acknowledging that the authority is only realized when the default is accepted without debate.

  **Careful Definition of *Authority by Default*:**

  *   **What counts:** A situation where a technical configuration (a default setting, a feature requirement, a data field) effectively establishes a rule or power dynamic that was never explicitly decided by a political or democratic process (e.g., a vote, a policy meeting, a student handbook update).
  *   **What does not count:**
      *   **Explicit Policy:** If the school board voted to track students and then bought the app to do it, that is *Surveillance Policy*, not Authority by Default.
      *   **Hard Determinism:** If the technology physically made it impossible for students to leave (e.g., a locked door), that is *Physical Constraint*. Authority by Default relies on social compliance with the tool's logic.
      *   **Glitches/Errors:** If the system accidentally logged data due to a bug, that is a *Failure*, not Authority. The effect must stem from the intended design logic.
  *   **Invisibility:** The effect does *not* have to be invisible to the people inside it, but it is most potent when it is perceived as "neutral" or "administrative" rather than "political." In your case, students see the log, but they perceive it as "the system" rather than "a rule."
  *   **Variability (The Cousin Condition):** The same tool behaving differently in two places is **not a counterexample**; it is a **boundary condition**. *Authority by Default* requires two things: (1) a design that prescribes a power dynamic, and (2) a local culture that accepts that prescription without scrutiny. If the culture rejects the prescription (your cousin's school), the Authority by Default fails to materialize. This confirms that the power lies in the *sociotechnical system* (people + tool), not the tool alone.

  ### 3. Why This Is Hard to Undo

  You noted that reversing this is difficult because it would require admitting a question of authority had been settled. In STS, this is called **"Reification."**

  Social decisions (how much freedom students have) are turned into "things" (timestamps, logs). To challenge the freedom restriction, you now have to challenge the "thing." It is much harder to argue against a timestamp log ("The data says you were gone 10 minutes") than against a teacher's judgment ("I think you were gone too long"). The data objectifies the authority, making it seem impartial.

  ### Summary for Your Research
  If you wish to read more about this, search for these terms:
  1.  **"Do Artifacts Have Politics?"** (Langdon Winner)
  2.  **"Delegation"** and **"Black Boxing"** (Bruno Latour)
  3.  **"Technological Enactment"** (Wanda Orlikowski)
  4.  **"Governance by Default"** (Legal/Tech policy literature)

  You have identified a classic case of **Authority by Default**: a political decision (surveillance and control) was offloaded to a technical default (the app's logging feature), bypassing democratic process, and was solidified through local enactment. Your cousin's school proves that the technology itself is not the villain; the *uncritical acceptance of the design script* is.
