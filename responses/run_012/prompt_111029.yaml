answer: |-
  ### Evaluation of Candidate Resolutions

  **1. Abstract-object realism with an inferential rather than a causal epistemology.**
  (i) **Score:** 8/10
  (ii) **Horn Sacrificed:** It gives up the causal constraint on the epistemological horn while retaining the semantic horn.
  (iii) **Verdict:** This sacrifice is principled, as it challenges the naturalistic assumption that all knowledge must be causal rather than merely redefining mathematics.

  **2. Modal structuralism.**
  (i) **Score:** 7/10
  (ii) **Horn Sacrificed:** It gives up the referential semantic horn in favour of a modalized paraphrase that eases epistemological access.
  (iii) **Verdict:** This sacrifice is principled, offering a coherent reinterpretation of discourse, though it trades ontological mystery for modal mystery.

  **3. Error-theoretic fictionalism.**
  (i) **Score:** 5/10
  (ii) **Horn Sacrificed:** It retains the semantic horn but gives up the claim to knowledge and truth on the epistemological horn.
  (iii) **Verdict:** This sacrifice is principled in its consistency, but it accepts a revisionary cost that many find philosophically excessive.

  **4. Indispensability naturalism.**
  (i) **Score:** 8/10
  (ii) **Horn Sacrificed:** It gives up the demand for a distinctively mathematical epistemology, subsuming it under the epistemological horn of empirical science.
  (iii) **Verdict:** This sacrifice is principled, relying on a holistic view of confirmation rather than a piecemeal theory of knowledge.

  **5. A two-component hybrid.**
  (i) **Score:** 3/10
  (ii) **Horn Sacrificed:** It attempts to keep both horns by splitting the subject matter, effectively giving up the unity of mathematical discourse.
  (iii) **Verdict:** This sacrifice is ad hoc, as the stipulated boundary between pure and applied domains lacks independent philosophical justification.

  **6. Quietist dissolution.**
  (i) **Score:** 6/10
  (ii) **Horn Sacrificed:** It gives up the demand that the semantic and epistemological horns must be reconciled within a single philosophical theory.
  (iii) **Verdict:** This sacrifice is principled as a meta-philosophical stance, though it risks dissolving the problem by fiat rather than solution.

  ***

  ### Tiering and Defense

  **Tier 1: Resolutions (Candidates 1 & 4)**
  These positions genuinely resolve the dilemma by demonstrating that the conflicting premises are not jointly binding. They retain the semantic intuition that mathematics is truth-apt and referential while rejecting the specific causal theory of knowledge that generates the epistemological problem. By modifying the background epistemological framework (either through inferential role or scientific holism), they allow both mathematical practice and a robust epistemology to coexist without contradiction. They are placed here because they solve the tension rather than merely managing it.

  **Tier 2: Trades (Candidates 2 & 3)**
  These positions accept the force of the dilemma and choose to satisfy one horn at the explicit expense of the other. Modal structuralism sacrifices literal reference to save epistemology, while fictionalism saves literal reference by sacrificing truth and knowledge. They are ranked below the Resolutions because they concede that the original constraints cannot be met simultaneously; they offer a consistent system, but only by altering the phenomenology of mathematical discourse or the normativity of mathematical claim-making.

  **Tier 3: Changes of Subject (Candidates 5 & 6)**
  These positions avoid the tension by fragmenting the domain or rejecting the philosophical demand itself. The Hybrid view bifurcates mathematics into two unrelated kinds of activity to dodge the conflict, while Quietism declares the conflict illegitimate. They are placed last because they do not answer the challenge posed by the dilemma; instead, they relocate the problem to a boundary dispute between pure and applied math or to a meta-philosophical dispute about the legitimacy of the question.

  ***

  ### Sensitivity Analysis

  The proposal whose score would move most is **3. Error-theoretic fictionalism**.

  **Direction:** Its score would move **downward** significantly.

  **Reason:** Fictionalism's primary motivation is to satisfy a strict naturalistic epistemology by avoiding commitment to abstract objects; if fidelity to actual mathematical practice (where mathematicians assert truths and claim knowledge) is weighted higher than naturalistic constraints, the cost of calling all mathematical assertions systematically false becomes prohibitive, rendering the view untenable compared to realism.

  ***

  ### Final Defense

  If forced to choose one proposal, I would defend **4. Indispensability naturalism**.

  While Abstract-object realism (1) is compelling, Indispensability naturalism provides a more robust anchor for *why* we are entitled to these inferential roles by tying them to the empirical success of our best scientific theories. It avoids the potential isolation of pure inference by grounding mathematical warrant in the holistic confirmation of science, thereby satisfying the semantic intuition of realism while offering a naturalistically respectable epistemology that does not require causal contact with abstracta.
