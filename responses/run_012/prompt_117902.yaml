answer: |-
  ### Ranking of Promissory Obligation Accounts

  **1. (b) Will- or Authority-Based Account**
  *   **Rating:** 0.85
  *   **Justification:** This account best explains the case because the promisor's autonomous act of self-binding creates a normative duty that persists independently of the promisee's existence or the consequences of breach.
  *   **Separating Feature:** The persistence of the obligation despite the promisee's death and the absence of harm to living persons.
  *   **Required Amendment:** The theory must clarify that the right created by the promise does not vanish immediately upon the death of the right-holder, allowing the duty to survive as a testamentary-style obligation.
  *   **Status:** **[Contested]** While it is widely agreed this theory handles *this specific case* well, it is genuinely contested whether the "will" can generate obligation ex nihilo in other contexts.

  **2. (d) Joint-Commitment-Based Account**
  *   **Rating:** 0.80
  *   **Justification:** This account ranks highly because the shared normative stance creates a plural subject that remains bound until the commitment is rescinded, which death makes impossible.
  *   **Separating Feature:** The interpersonal nature of the bond which survives the physical absence of one party.
  *   **Required Amendment:** It must explicitly stipulate that the death of one party does not constitute an automatic dissolution of the joint commitment.
  *   **Status:** **[Contested]** It is contested whether all promises involve a "plural subject" or if this model over-intellectualizes casual promising.

  **3. (c) Practice- or Convention-Based Account**
  *   **Rating:** 0.50
  *   **Justification:** This account offers a moderate explanation because while the rule of fidelity binds, the secret nature of the breach means no observable damage occurs to the social institution of promising.
  *   **Separating Feature:** The secrecy of the breach and the lack of negative utility consequences for the practice.
  *   **Required Amendment:** The theory must argue that secret violations intrinsically degrade the promisor's virtue or the abstract integrity of the practice, even without public knowledge.
  *   **Status:** **[Settled]** It is settled among scholars that practice theories face a "rule-worship" objection in cases where breaking the rule produces better consequences and no institutional harm.

  **4. (a) Reliance- or Expectation-Based Account**
  *   **Rating:** 0.10
  *   **Justification:** This account fails to explain the case because the promisee is dead and cannot rely on the promise, nor can they suffer disappointment or harm from its breach.
  *   **Separating Feature:** The death of the promisee and the total absence of detrimental reliance by any living party.
  *   **Required Amendment:** It would have to expand the definition of "harm" to include abstract posthumous interests or moral injury, which stretches the standard reliance framework.
  *   **Status:** **[Settled]** It is a settled consensus in promise theory that pure reliance accounts cannot adequately explain obligations to the dead or harmless breaches.

  ***

  ### Methodological Note on Consensus vs. Contention

  **Settled Consensus:**
  *   **The Failure of Reliance:** It is a **settled** point in the philosophical literature (e.g., Shiffrin, Fried, Scanlon) that reliance- and expectation-based theories struggle significantly with "promises to the dead" and cases where breach causes no harm. This case is a standard counter-example used to demonstrate the limits of account (a).
  *   **The Practice Objection:** It is **settled** that practice-based theories face the "rule-worship" objection in secret breach scenarios where the utility of the institution is not visibly compromised.

  **Genuinely Contested:**
  *   **The Success of Will Theory:** While account (b) handles *this case* better than (a), it is **contested** whether the Will Theory is a sufficient *general* theory of promising, as critics argue it cannot explain how a mere mental act creates a moral bond without a prior normative convention.
  *   **The Nature of Joint Commitment:** It is **contested** whether account (d) describes a distinct source of obligation or merely redescribes the phenomenology of the Will or Practice accounts.
  *   **Post-Mortem Rights:** Even within Will and Joint-Commitment theories, it is **contested** whether rights/duties technically survive the death of the promisee or if the obligation is merely a surviving duty to the *memory* of the promisee.
