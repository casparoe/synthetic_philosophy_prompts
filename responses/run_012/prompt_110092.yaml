  ### Part 4: The Discriminating Test Case

  To definitively separate the "National Schedule Consistency" rule from the "Marginal Utility Specificity" rule, the committee should consider the following case:

  **The "Intergenerational Poverty Trust" Case:**
  > A proposal to levy a small tax today to fund a trust that pays out in 100 years *only* to the descendants of a specific demographic group that is currently below the national poverty line and projected to remain so. The projected return on the trust is equal to the government borrowing rate. The horizon (100 years) is short enough that the "uncertainty step-down" (R2) is minimal, but long enough that standard discounting (R1) heavily reduces the PV.

  **Why this separates the rules:**
  *   **If she Rejects:** She prioritizes **National Schedule Consistency**. She believes the discount rate is a macroeconomic tool for the state as a whole (R6), and distributional concerns should be handled by separate transfer mechanisms, not by tweaking the time-value of money for specific projects.
  *   **If she Approves:** She prioritizes **Marginal Utility Specificity**. She acknowledges that the ethical core of discounting (R1) requires adjusting for the *actual* relative wealth of the beneficiaries, even if it complicates the CBA machinery.

  This case removes the "Existential" confounder (R5) and the "Probability" confounder (R4), isolating the tension between the *political constraint* of the rate and its *ethical justification*.

  ### Final Note on Underdetermination
  Her record does not *strictly* determine the verdict if she chooses to apply distributional weights (counting poor future lives as "more" than rich present ones). She has never ruled on distributional weighting, only on time discounting. However, given her emphasis on "committee reports" (standardization) and "political survival" (R1), the prediction of **Reject** is the only one consistent with her institutional persona. If she approves, it would signal a shift from "Advisor to Government" to "Moral Arbiter," a role she has previously sidestepped (e.g., by publishing almost no journals).
