answer: |-
  **The lottery as a Lewis convention**

  David Lewis defines a convention as a regularity in behavior that resolves a recurring coordination problem. To test "The Lottery" against this, we must examine his three specific conditions. First, there must be a regularity in behavior where everyone conforms. The story satisfies this clearly: the villagers gather annually in the square, heads of households draw slips, and the community stones the selected individual. This behavior is consistent, repeated, and involves the entire group. Second, everyone must expect everyone else to conform. This condition is also met; the villagers anticipate their neighbors' attendance and participation. When a specific family is absent, there is confusion and delay, indicating a shared expectation of presence. The children gather stones beforehand, showing they expect the ritual to proceed as it always has.

  However, the third condition reveals the fracture. Lewis requires that everyone prefers to conform given that others conform, because acting differently while others act alike would leave you worse off due to the coordination failure itself. In a true Lewisian convention, like driving on the right side of the road, deviation causes chaos regardless of punishment because the coordination equilibrium collapses. In the lottery, the villagers do not conform because the act itself solves a practical coordination problem. They conform because deviation invites violence. While they are technically "worse off" if they deviate, it is not because the coordination equilibrium collapses, but because the group enforces compliance through stoning. There is no alternative equilibrium, such as not holding the lottery, that is unavailable due to coordination failure; other towns have chosen it successfully. Therefore, the lottery satisfies the conditions of regularity and expectation, but fails the crucial condition of preference based on coordination rather than coercion.

  **Convention, custom, or norm?**

  Based on the failure of the third condition, the lottery is best understood not as a convention, but as a norm or custom held in place by social pressure. Your teacher's distinction is vital here: conventions rely on coordination, whereas norms rely on the threat of resentment or punishment. The villagers comply because deviation is punished, not because the situation leaves them no better option naturally. Old Man Warner embodies this normative pressure; when mentioned that nearby towns have stopped holding lotteries, he scoffs and calls them fools, reinforcing the social cost of deviation. He implies that quitting invites disaster, weaponizing superstition to maintain compliance. Similarly, Tessie Hutchinson's experience illustrates the shift from participant to victim. Initially, she arrives late and jokes about the process, showing no inherent desire to coordinate. However, once her family is selected, she insists the draw was unfair, highlighting that her compliance was conditional on safety, not belief in the coordination value.

  The willingness to conform is not conditional in the Lewisian sense. Lewis requires that I conform because I want to match your action to solve a problem. Here, the villagers conform because they fear being the outlier who refuses to throw a stone. If everyone else decided to stop, no individual would be worse off due to coordination failure; they would simply be safe. The pressure is external and punitive. Therefore, the practice functions as a coercive norm. It persists through the threat of violence rather than the mutual benefit of matching behavior. The children gathering stones at the start of the story signifies socialization into this norm, ensuring the next generation feels the pressure to conform regardless of the lack of rational coordination. It is also a custom, evidenced by the shabby box that predates memory, but the force holding it is normative pressure, not coordinative necessity.

  **How the practice ends, or doesn't**

  The story offers a pessimistic view on how such practices end, suggesting that internal rationality is insufficient. Lewis might argue conventions decay when the underlying coordination problem disappears or a superior equilibrium is found. In the story, the "problem" is superstitious belief in crop yield, which is not a real coordination problem. Consequently, the practice does not end through internal realization. Tessie's individual protest fails completely; screaming that the process is unfair does not stop the stones. This indicates that individual deviation cannot break a norm held by collective pressure. The story suggests that one person refusing to conform is simply eliminated, reinforcing the norm rather than dissolving it.

  Instead, the story suggests change comes from external diffusion or entropy. We learn that nearby towns have quit the lottery, implying that social contagion from outside groups is necessary to break the local equilibrium. Additionally, the physical state of the lottery—the shabby box, the forgotten chants, the replaced wood chips—shows entropy eroding the ritual. The town keeps meaning to replace the box but never does, suggesting inertia keeps the practice alive even as the details rot. Old Man Warner repeats the harvest saying, but few seem to remember the original rituals. For Lewis, this suggests that norms can persist long after their original justification is forgotten, sustained purely by fear and habit. To end a practice like this, the collective pressure must shift, likely requiring a critical mass of neighboring communities to abandon the norm, making deviation safe for the remaining holdouts. Without external safety, internal decay is too slow to prevent violence.

  **Where the reading strains**

  Reading the story through Lewis strains the text by imposing rationality on irrational violence. Lewis's theory describes how rational agents solve mutual problems, like traffic rules. Applying this to the lottery risks framing the villagers as rational actors choosing a stable equilibrium. This distorts Jackson's horror, which relies on the villagers' unthinking, bureaucratic compliance with murder. They are not solving a coordination problem; they are committing a crime facilitated by tradition. The theory assumes agents prefer to conform given others conform. In the story, many villagers seem uncomfortable but participate anyway. Treating this as a convention suggests they derive benefit from the matching behavior itself. In reality, they derive only safety from avoiding punishment. This reading sanitizes the mob mentality, turning a critique of blind tradition into a case study of social equilibrium. It misses the story's moral point: that evil can be normalized through routine. The theory explains the mechanism of compliance but fails to capture the moral vacuum that allows it.

  **Bottom line**

  The lottery functions as a coercive norm rather than a Lewisian convention, maintained by punishment instead of coordination. While the story illustrates how such practices persist through inertia, applying Lewis's rational framework risks obscuring the irrational horror of the villagers' compliance.
