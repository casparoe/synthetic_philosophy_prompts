      *   *The Trap:* If I explain the metaphysics (illusionism, qualia denial), the "impatient" students will tune out or fight. I must keep it methodological.
      *   *The Sequence:* I need to move from the *problem* (how to treat reports) to the *stance* (neutral interpretation) to the *construct* (the heterophenomenological world) to the *comparison* (world vs. brain).

  3.  **Component 1: Dependency Structure (The Flow):**
