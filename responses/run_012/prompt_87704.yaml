      *   *Step 2: The Methodological Stance.* How do we treat the report *without* deciding if it's true yet? (The "Neutral Stance").
      *   *Step 3: The Construct.* If we treat the report as a text, what does it describe? (The "Heterophenomenological World").
      *   *Step 4: The Comparison.* Now compare that world to the physical data (brain/behavior).
      *   *Why this order?* You can't define the "world" without defining the "stance." You can't compare the "world" to the "brain" without defining both.

  4.  **Component 2: The Carrying Example:**
      *   *Candidate:* Split-brain patient (verbal denial vs. left-hand reach).
