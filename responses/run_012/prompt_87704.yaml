answer: |-
  ### 1. Conceptual Dependencies and Sequence

  You cannot teach heterophenomenology as a list of features; it must be taught as a *procedure*. If you define the "heterophenomenological world" before establishing the "neutral stance," students will assume you are positing a metaphysical realm. If you discuss the brain before the report, they will revert to reductionism.

  Here is the mandatory dependency chain for your 90 minutes:

  1.  **The Status of the Report (Data vs. Noise):** You must begin by forcing a decision on how to treat the subject's speech. If they treat it as noise, they are eliminativists. If they treat it as infallible truth, they are naive phenomenologists. You need them to see both as methodological dead-ends.
      *   *Dependency:* This sets the stage for the *need* for a third way.
  2.  **The Methodological Stance (Neutral Interpretation):** Once they agree reports are data but not necessarily *true* data, you introduce the stance. We treat the subject as a storyteller whose text is the data. We do not judge the truth of the story yet; we catalog the story.
      *   *Dependency:* You cannot define the "world" without first defining the "stance" that constructs it.
  3.  **The Heterophenomenological World (The Construct):** This is the totality of what the subject *believes* to be true about their experience, as extracted from the text. It is an object in the scientist's ontology, not necessarily in the world.
      *   *Dependency:* You cannot compare the subject's view to the brain's view until you have fully constructed the subject's view as a distinct object.
  4.  **The Comparison (World vs. Brain/Behavior):** Finally, you compare the Heterophenomenological World to the physical data (reaction times, neural imaging, stimulus logs). This is where theory enters.
      *   *Dependency:* This resolves the tension from Step 1 without collapsing into Step 1's extremes.

  ### 2. The Carrying Example

  **Recommendation:** Do **not** use the split-brain case.
  **Reason:** While iconic, the split-brain case inevitably triggers the metaphysical question: "Are there two consciousnesses?" Your students are already impatient with metaphysics. If you use split-brain, half the seminar will debate the unity of the self, and you will lose the methodological thread.

  **Use instead: Choice Blindness (Johansson et al.).**
  **The Case:** A subject chooses the more attractive of two faces (Face A). Through a card trick, they are handed Face B. They are asked, "Why did you choose this one?" They sincerely confabulate reasons ("I liked the smile," "The eyes were warmer").

  **Why this carries the dependencies better:**
  *   **Step 1 (Report):** The report is rich and detailed ("I liked the smile").
  *   **Step 2 (Stance):** We record the report without calling them a liar. They *believe* what they say.
  *   **Step 3 (World):** In their Heterophenomenological World, they preferred Face B for specific reasons.
  *   **Step 4 (Comparison):** The physical record shows they chose Face A. The Heterophenomenological World is now demonstrably distinct from the Physical World, without denying the subject's sincerity or consciousness.

  **Constraints for the Example:**
  *   **Must Include:** The video of the subject giving reasons. The video of the card swap. The timestamp of the original choice.
  *   **Must Not Include:** Speculation on *why* the brain confabulates (e.g., left-hemisphere interpreter theories). Speculation on whether the subject is "lying to themselves." Keep it to: "Report says X, Record says Y."

  ### 3. The 90-Minute Teaching Plan & Misconception Map

  **00:00 – 15:00 | The Problem of the Report**
  *   **Activity:** Present the Choice Blindness video. Ask: "What data do we have here?"
  *   **Goal:** Elicit the split. One group says "The report is the experience." The other says "The report is post-hoc noise; look at the choice."
  *   **Misconception Head-off (Introspection/Noise):**
      *   *When:* After the initial debate.
      *   *Say:* "If you treat the report as direct truth, you cannot explain the error. If you treat it as noise, you discard the only data we have about *what it was like* for them. We need a method that keeps the data without swallowing the error."

  **15:00 – 35:00 | The Heterophenomenological Stance**
  *   **Activity:** Define the stance. We treat the subject as an informant producing a text. Our job is to interpret the text charitably but neutrally. We bracket the truth value.
  *   **Goal:** Establish the "Neutral Stance."
  *   **Misconception Head-off (Behaviorism):**
      *   *When:* When defining the text.
      *   *Say:* "Behaviorism ignores the inner state. We are not ignoring it; we are treating the *report of the inner state* as the primary datum. We care deeply about what they think is happening inside."
  *   **Misconception Head-off (Face Value):**
      *   *When:* Discussing interpretation.
      *   *Say:* "We do not take the report at face value. We take the *production* of the report as a fact, but we do not assume the *content* matches the world."

  **35:00 – 55:00 | The Heterophenomenological World**
  *   **Activity:** Construct the "World." List everything the subject claims is true ("I saw two faces," "I chose the one on the right," "I liked the smile"). This list is their world.
  *   **Goal:** Reify the "World" as a theoretical construct.
  *   **Misconception Head-off (Fictionalism/Denial):**
      *   *When:* Students ask, "So their experience is fake?"
      *   *Say:* "Heterophenomenology is not claiming their experience is fictional. It is claiming that *our scientific description* of their experience is a construct based on their report. Whether the experience itself is 'real' is a metaphysical question we are bracketing."
  *   **Misconception Head-off (Incorrigibility):**
      *   *When:* A student suggests the subject is the ultimate authority.
      *   *Say:* "The subject is the authority on what they *believe* they experienced. They are not the authority on what *actually* happened. This method separates those two questions."

  **55:00 – 75:00 | The Comparison (World vs. Brain)**
  *   **Activity:** Overlay the Physical Data (the card swap video) onto the Heterophenomenological World. Show the mismatch.
  *   **Goal:** Show how the method allows for theory without silencing the subject.
  *   **Misconception Head-off (Just Introspection):**
      *   *When:* Comparing the data sets.
      *   *Say:* "Introspection is the subject's method. Heterophenomenology is the scientist's method. We are not doing introspection; we are analyzing the *output* of their introspection using third-person tools."

  **75:00 – 90:00 | Check for Understanding & Refusals**
  *   **Activity:** The Two-Column Exercise (see below).
  *   **Closing:** Explicitly state what was left out.
  *   **Misconception Head-off (The Dodge):**
      *   *When:* Closing the session.
      *   *Say:* "We did not solve the Hard Problem today. We built the instrument we need to work on it without getting stuck in metaphysics. This is not a dodge; it is a division of labor."

  ### 4. Check for Understanding

  Do not ask them to define heterophenomenology. Ask them to *apply* the distinction.

  **The Task:**
  Provide a one-paragraph transcript of a subject describing a dream: *"I was flying over a city that looked like Paris, but the towers were made of glass. I felt no fear, only excitement."*

  **The Instruction:**
  "Create two columns.
  *   **Column A (Heterophenomenological World):** List the propositions that are *true in the subject's world* based strictly on this text.
  *   **Column B (Physical/Verification Questions):** List the questions a scientist must ask to check these propositions against the physical world (e.g., brain state, behavior, external reality)."

  **Success Criteria:**
  *   **Pass:** Column A includes "Subject believes they flew," "Subject believes the towers were glass." Column B includes "Was the subject actually moving?" "Is there a Paris?" "What neural activity correlates with 'excitement'?"
  *   **Fail:** Column A includes "The subject flew" (collapsing World into Reality). Column B includes "Why did they lie?" (collapsing Report into Noise).

  ### 5. Strategic Refusals

  You must explicitly bracket certain topics to keep the session methodological. If you do not, the "impatient" students will drag you into metaphysics, and the "phenomenologists" will demand you solve the Hard Problem.

  **What to Refuse:**
  1.  **The Hard Problem:** Why does it feel like something to be the subject?
  2.  **Qualia Ontology:** Do qualia actually exist, or are they judgments?
  3.  **Illusionism:** Is consciousness an illusion?
  4.  **Neural Correlates:** Which specific neurons fire during the choice blindness?

  **How to Frame the Refusal:**
  Do not say "We don't have time." Say "We are building the microscope, not looking at the slide yet."

  **Script for the Refusal:**
  *"You will notice I have not answered whether consciousness is real, an illusion, or identical to brain states. That is intentional. Heterophenomenology is a method for gathering data *before* you settle those bets. If you try to solve the metaphysics before you agree on the data, you will never agree on the data. Today, we agreed on the data. Next week, you can fight about what the data means."*

  **Why this works:** It frames the refusal as *disciplinary rigor* rather than *evasion*. It appeals to the cognitive scientists' desire for clean data before theory. It assures the phenomenologists that their data (the reports) are being preserved, not discarded.
