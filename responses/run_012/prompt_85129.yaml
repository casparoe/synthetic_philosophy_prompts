  CONFIDENTIAL // DRAFT 03
  **TO:** City Manager, Office of Urban Coordination
  **FROM:** Vantage Policy Solutions
  **DATE:** 14 October 2023
  **SUBJECT:** Normative Tightness Index (NTI) Optimization – Phase II

  **1.0 OBJECTIVE**
  The City of Oakhaven currently operates at an NTI of 4.2 (Loose). Per contract 88-B, Vantage is tasked with raising this to 7.5 (Moderately Tight) within 18 months. Achieving this threshold will yield projected reductions in sanitation overhead (12%), public friction incidents (18%), and transaction costs for local commerce. The trade-off involves a calculated reduction in behavioral variance and cultural novelty.

  **2.0 THREAT SALIENCE MAINTENANCE**
  Cultural tightness correlates strongly with perceived existential threat. As current regional stability metrics are high, organic tightness will not sustain. We must manufacture sustained anxiety regarding external pressures.
  *   **Action:** Amplify messaging around peripheral economic instability and non-local crime spikes.
  *   **Metric:** Weekly sentiment analysis showing ≥60% of residents believe "standards are slipping due to outside influence."
  *   **Note:** Do not declare actual emergencies. Actual emergencies require resource expenditure. Perceived emergencies require only communication bandwidth.

  **3.0 ENFORCEMENT MECHANISMS**
  Formal bylaw enforcement is inefficient for NTI growth; it creates legal liability and centralizes blame. Enforcement must be horizontal (resident-to-resident).
  *   **Strategy:** Normalize corrective social friction. Residents should feel empowered to correct neighbors on lawn height, noise volume, and loitering without police involvement.
  *   **Deniability:** No new ordinances will be passed. Existing vague clauses regarding "neighborhood character" will be leveraged. This ensures Council remains insulated from accusations of over-policing while achieving compliance.
  *   **Decay Warning:** NTI scores decay naturally within 6-9 months if threat salience drops. Continuous reinforcement is required.

  **4.0 CAPABILITY RETIREMENT**
  To achieve target NTI, the city must formally retire specific social capabilities. These are not losses, but efficiency cuts.
  *   **Spontaneous Assembly:** Unpermitted gatherings >3 persons to be discouraged via noise complaints.
  *   **Aesthetic Variance:** Non-standard exterior modifications (bright paints, alternative landscaping) to be flagged as property value risks.
  *   **Public Eccentricity:** Behavior deviating from baseline norms (talking to self, unusual dress) to be categorized as "potential disturbance" rather than "free expression."

  **5.0 SCORING RUBRIC (EXCERPT)**
  | Metric | Target | Measurement Method |
  | :--- | :--- | :--- |
  | **Uniformity Index** | 85% | Visual audit of front-yard decor per block. |
  | **Intervention Rate** | 3.5/week | Reported neighbor-to-neighbor corrections (anonymous hotline). |
  | **Transit Compliance** | 98% | Adherence to unwritten queueing/standing norms. |
  | **Nighttime Quiet** | 22:00 hrs | Time at which street activity drops below 10% baseline. |

  **6.0 FEE SCHEDULE**
  *   **Base Retainer:** $45,000/month.
  *   **Success Fee:** $250,000 upon verified NTI shift to 7.5.
  *   **Renewal:** Quarterly contract required to maintain score against natural decay.

  **7.0 DISTRIBUTIONAL IMPACT**
  Implementation costs are not borne evenly. Compliance burdens will fall disproportionately on populations with low assimilation velocity, transient residents, and fixed-income households unable to retrofit properties to match Uniformity Index standards.¹

  ***

  ¹ *These segments represent acceptable friction points. Their displacement or silence is a leading indicator of program success. Do not offer mitigation grants.*
