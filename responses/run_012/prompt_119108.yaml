answer: |-
  ### Specification of Desiderata for a Theory of the Demos

  To be adequate, a theory of boundary drawing must satisfy the following requirements. Each is accompanied by the consideration that renders it a genuine demand of democratic logic rather than the prejudice of a specific ideological camp.

  #### I. The Cases It Must Get Right
  1.  **The Resident Non-Citizen:** The theory must explain why a long-term resident, subject to coercive laws and taxation, is either included in the franchise or justifiably excluded.
      *   *Genuineness:* Democracy claims to oppose tyranny (rule without consent). To govern a resident without a voice is prima facie tyrannical; to include them requires explaining why citizenship is not the sole marker of subjection.
  2.  **The Expatriate:** The theory must account for the citizen abroad who retains the vote despite escaping daily coercion and local consequences.
      *   *Genuineness:* Democracy claims to represent the "people." If identity and legal membership persist across borders, exclusion severs the link between the state and its constitutive members, risking alienation.
  3.  **The Affected Outsider:** The theory must address the status of those outside the border who suffer grave harm (e.g., downstream dam victims, climate change sufferers) from the polity's decisions.
      *   *Genuineness:* Democratic legitimacy rests on accountability. If a body can impose costs without bearing them, it creates a zone of impunity incompatible with equal moral standing.
  4.  **Children and the Incompetent:** The theory must justify the exclusion of those within the territory who lack capacity, without relying on the conclusion (that they are not members) to prove the premise.
      *   *Genuineness:* Democracy requires agency. Exclusion based on incapacity is functional, not arbitrary; a theory must distinguish between *status* exclusion and *capacity* exclusion to avoid ableism or infantilization.
  5.  **Future People:** The theory must specify how the interests of those who do not yet exist are weighed against the present demos.
      *   *Genuineness:* Democratic decisions have temporal reach. Ignoring future interests renders the polity predatory over time, violating intergenerational equity which is a precondition for the demos's own persistence.
  6.  **The Secession Referendum:** The theory must determine who votes on boundary changes (e.g., independence) without allowing the current demos to rig the electorate to ensure its own survival.
      *   *Genuineness:* The "boundary of the boundary" problem. If the existing demos decides who votes on secession, it acts as a judge in its own cause, violating the principle that the source of authority cannot be self-constituting.

  #### II. The Distinctions It Must Not Collapse
  7.  **Subject to vs. Affected By:** The theory must distinguish between being legally coerced by a decision and merely suffering consequences from it.
      *   *Genuineness:* Coercion creates a special obligation of justification (the law binds me); effects are often incidental. Collapsing them either overextends the franchise to infinity (everyone is affected by something) or underextends it to tyranny (ignoring externalities).
  8.  **Membership vs. Franchise:** The theory must distinguish between belonging to the political community (rights, protection) and holding the power to vote.
      *   *Genuineness:* Children and some non-citizens have membership rights without the franchise. Conflating the two renders the status of protected non-voters incoherent.
  9.  **Author vs. Object:** The theory must distinguish the demos as the sovereign creator of law from the demos as the population subject to law.
      *   *Genuineness:* In a democracy, the subject and the author are ideally identical, but analytically distinct. Confusing them obscures whether a law is legitimate because the people made it, or because the people obey it.

  #### III. The Constraints It Must Respect
  10. **The Circularity Constraint:** The theory must acknowledge that every actual boundary is drawn by an act that already presupposes a demos.
      *   *Genuineness:* This is the logical core of the boundary problem. There is no "view from nowhere" to draw the line; any procedure to draw the line is itself a political act requiring legitimacy.
  11. **The Persistence Constraint:** The theory must explain how a demos persists through the complete replacement of its members over time.
      *   *Genuineness:* States endure despite death and migration. If the demos is defined strictly by the set of currently affected or subjected individuals, it dissolves after every election, making long-term commitment impossible.
  12. **The Plurality Constraint:** The theory must accommodate nested and overlapping demoi (local, national, supranational).
      *   *Genuineness:* Human beings live in multiple jurisdictions simultaneously. A theory assuming a single, monolithic demos per person fails to describe political reality or handle conflicts of law.
  13. **The Status Quo Implication:** The theory must state what follows if most existing states fail its criteria (e.g., illegitimacy, obligation to reform, or pragmatic tolerance).
      *   *Genuineness:* A theory that delegitimizes all actual states without a transition path is utopian and politically inert. It must account for the cost of its own application.
  14. **Determinate Applicability:** The theory must be applicable by a body that must actually decide and give reasons, rather than returning that the answer depends on the demos.
      *   *Genuineness:* Courts, commissions, and legislatures must draw lines *now*. A theory that says "the demos decides who the demos is" offers no guidance for the decision-maker, rendering it useless for adjudication.

  ***

  ### Incompatible Pairs

  No theory can satisfy all fourteen requirements simultaneously. The following pairs represent structural contradictions:

  1.  **The Affected Outsider Case (Req 3) vs. The Subject/Affected Distinction (Req 7).**
      To "get the case right" for the affected outsider usually requires enfranchising them based on harm. However, if they are not legally subject to the polity's coercion, enfranchising them collapses the distinction between *suffering consequences* and *being bound by law*. If you maintain the distinction, you likely exclude the outsider, failing the case.
  2.  **Future People (Req 5) vs. Determinate Applicability (Req 14).**
      To include future people requires representing interests that cannot speak. To apply this determinately requires a current body to proxy those interests. Any proxy is inherently speculative and contestable. A theory cannot demand both the inclusion of the silent dead/future and a determinate procedure for their representation by the living.
  3.  **The Circularity Constraint (Req 10) vs. Determinate Applicability (Req 14).**
      If every boundary drawing presupposes a demos (Req 10), then no prior democratic body can legitimately draw the boundary. Yet Req 14 demands a body actually decide. Satisfying the logical constraint undermines the possibility of a democratic decision procedure.

  **The Most Eliminative Requirement:**
  **Determinate Applicability (Req 14).**
  This is the single requirement that eliminates the most candidates. Most normative theories (particularly All-Affected and Stakes-based) fail here because they rely on counterfactuals ("who *would* be affected?") or vague metrics ("significant stakes") that cannot be operationalized by a court or commission without arbitrary discretion. They often retreat to the circular claim that "the demos must decide," which Req 14 explicitly forbids.

  ***

  ### Verdict on Existing Accounts

  *   **Territorial:** Satisfies **Determinate Applicability** and **Persistence** easily. Fails **Affected Outsider** and **Expatriate** cases. It respects the **Subject/Affected** distinction but often conflates **Membership** with presence. It handles **Circularity** by assuming the status quo border is the given.
  *   **All-Affected (AAP):** Captures the **Affected Outsider** and **Future People** morally. Founders on **Determinate Applicability** (impossible to measure all effects) and **Persistence** (the demos changes every vote). It collapses the **Subject/Affected** distinction.
  *   **All-Subjected (ASP):** Strong on **Resident Non-Citizen** and **Circularity** (avoids infinite regress). Fails **Affected Outsider** and **Expatriate** cases. It maintains the **Subject/Affected** distinction but struggles with **Secession** (who is subject to the secession vote?).
  *   **Stakes-Based:** Attempts to nuance AAP. Fails **Determinate Applicability** even more severely (how to weigh stakes?). It struggles with **Plurality** (which demos holds which stakes?) and offers no clear solution to **Circularity**.

  **Conclusion:** The Territorial account is the only one that meets the **Determinate Applicability** constraint robustly, but only by accepting the **Status Quo Implication** that many existing boundaries are morally arbitrary. The All-Affected principle is morally superior on externalities but logically incoherent as a decision procedure. The All-Subjected principle is the most viable middle ground but requires significant modification to handle expatriates and secession without circularity.
