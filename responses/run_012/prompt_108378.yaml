answer: |-
  # Activity Plan: The Causal Audit

  **Course:** 300-Level Metaphysics of Mind
  **Topic:** Mental Causation & The Exclusion Argument
  **Time:** 75 Minutes
  **Students:** 18 (3 Groups of 6)
  **Room:** Movable chairs, Whiteboard

  ## I. Learning Objectives
  1.  **Experiential:** Students feel the "squeeze" of causal exclusion (if physics is sufficient, mind is excluded) rather than just tracing the syllogism.
  2.  **Analytical:** Students identify how the definition of "causation" (production vs. difference-making) dictates the outcome.
  3.  **Critical:** Students evaluate the cost of epiphenomenalism and the viability of standard replies (reductionism, non-reductive physicalism).

  ## II. Materials
  *   **3 Causal Ledgers:** Large sheets of paper (one per group) with a bar graph labeled 0–100 "Causal Credits."
  *   **4 Cause Cards (per group):**
      1.  **The Neural Realizer:** Specific firing pattern in the prefrontal cortex.
      2.  **The Mental State:** The conscious feeling of reasonable doubt.
      3.  **The Rational Ground:** The objective weakness of the evidence.
      4.  **The Social Pressure:** The normative influence of the other jurors.
  *   **Rule Sheet (Round 1):** "The Production Protocol."
  *   **Rule Amendment (Round 2):** "The Contrastive Patch."
  *   **Whiteboard:** For aggregating results and mapping the argument.

  ## III. Minute-by-Minute Timeline

  ### 0:00–0:05 | Setup & Case (No Theory)
  *   **Instructor:** "We are Causal Auditors. A specific event occurred: *Juror 8 changed her vote from Guilty to Not Guilty.* Your job is to assign Causal Credit for this event. There are 100 Credits available. You must distribute them among these four candidates." (Point to Cause Cards).
  *   **Constraint:** "You cannot give everyone 100. Causation is not infinite. If one cause did the whole job, the others get zero."
  *   **Grouping:** Divide into 3 groups of 6. Hand out Ledgers, Cards, and **Round 1 Rule Sheet**.

  ### 0:05–0:30 | Round 1: The Production Protocol (The Squeeze)
  *   **Task:** Assign the 100 Credits.
  *   **Round 1 Rules (The Exclusion Engine):**
      1.  **Conservation:** Total credits assigned must equal exactly 100.
      2.  **Sufficiency Clause:** If a candidate is *physically sufficient* to produce the effect on its own, it must be assigned 100 Credits.
      3.  **No Overdetermination:** You cannot assign 100 Credits to more than one candidate. (The world is not systematically redundant).
      4.  **Dependency:** If Candidate A depends on Candidate B to exist (e.g., Mental depends on Neural), they cannot *both* claim independent sufficiency.
  *   **Instructor Role:** Circulate. Enforce the rules strictly. If a group tries to split 50/50 between Neural and Mental, remind them of the **Sufficiency Clause**: "The prompt states the Neural state is physically sufficient. Rule 2 applies."
  *   **Expected Outcome:** Groups will likely assign 100 to Neural. Mental gets 0. (Epiphenomenalism). Some may assign 100 to Mental, but will struggle to justify it against the Neural sufficiency without violating Rule 4.

  ### 0:30–0:45 | Round 2: The Contrastive Patch (The Escape Hatch)
  *   **Instructor:** "The Audit has been appealed. We are changing the definition of the Effect and the Scoring Metric."
  *   **Task:** Re-evaluate the Credit assignment using the **Rule Amendment**.
  *   **Round 2 Rules:**
      1.  **New Effect:** The effect is no longer "The Vote Changed." It is "The Vote Changed *rather than Remaining Guilty*."
      2.  **Difference-Making:** Credits are awarded based on *counterfactual dependence*. Ask: "If this candidate were absent (but others held fixed where possible), would the *contrastive effect* still occur?"
      3.  **Relaxed Sufficiency:** Multiple candidates can receive high credits if they both make a difference to the *contrast*.
  *   **Expected Outcome:** Mental State gets credits back. Why? Because if the *Doubt* were absent (and thus the Neural state different), the vote might not have changed. The Neural state is still sufficient, but the Mental state is now a relevant *difference-maker*.
  *   **Whiteboard:** Record Round 1 vs. Round 2 scores for Mental Causation.

  ### 0:45–1:15 | Debrief & Mapping (The Theory)
  *   **Phase 1: The Felt Squeeze (10 mins)**
      *   Ask: "In Round 1, why did the Mental State lose?" (Answer: The Neural state was sufficient; rules forbade sharing).
      *   Ask: "How did it feel to assign 0 to the Doubt?" (Answer: Counterintuitive, makes the mind look useless).
      *   **Map to Argument:**
          *   Sufficiency Clause $\to$ **Causal Closure of the Physical**.
          *   No Overdetermination $\to$ **No Systematic Overdetermination**.
          *   Dependency $\to$ **Supervenience**.
          *   Result (Mental = 0) $\to$ **Epiphenomenalism**.
  *   **Phase 2: The Contrastive Escape (10 mins)**
      *   Ask: "What changed in Round 2?"
      *   **Concept:** Total Cause (Production) vs. Difference-Maker (Contrastive).
      *   **Point:** The Exclusion Argument assumes the "Total Cause" picture (Round 1). If causation is contrastive (Round 2), Mental and Neural can coexist without overdetermination because they answer different questions ("What produced this?" vs. "What made the difference?").
      *   **Crucial Caveat:** Reveal that the game's Round 1 rules *stacked the deck* for physicalism by defining causation as a conserved quantity (budget).
  *   **Phase 3: Replies & Costs (10 mins)**
      *   **Reductionism:** "Mental *is* Neural." (In game: Merge the cards. But then what happens to 'Doubt' as a distinct concept?)
      *   **Non-Reductive Physicalism:** "Mental supervenes but is distinct." (In game: Round 1 forbids this. Round 2 allows it via contrastivism).
      *   **Emergentism:** "Mental has downward power." (In game: Violates Sufficiency Clause/Closure).
      *   **The Cost:** Why is Epiphenomenalism bad? (Evolution, agency, knowledge of minds).

  ## IV. Troubleshooting: What Will Go Wrong

  **1. The "Split the Difference" Rebellion**
  *   **Problem:** Students hate giving Mental 0. They will try to assign 50 to Neural, 50 to Mental.
  *   **Fix:** Do not argue philosophy. Point to **Rule 2 (Sufficiency)**. "The case stipulates the Neural state is physically sufficient. If you assign 50 to Mental, you are claiming the Neural state was *not* sufficient on its own. You are violating the case facts." Force them to feel the discomfort of the rule.

  **2. The Identity Theory Move**
  *   **Problem:** A student says, "Just give 100 to Neural, because Mental *is* Neural."
  *   **Fix:** Accept this as a valid move (Reductionism), but press the cost. "If they are identical, why do we have two cards? If we keep the 'Doubt' card, does it have any *independent* weight?" This primes the Property Exclusion distinction for the debrief.

  **3. The "Social Pressure" Wildcard**
  *   **Problem:** Students might dump 100 credits on Social Pressure to avoid the Neural/Mental fight.
  *   **Fix:** Remind them of the **Dependency Clause**. Social pressure works *through* the neural/mental system. If Neural is sufficient, Social Pressure is just a distal cause. Keep the focus on the Neural/Mental rivalry.

  **4. The Contrastive Confusion**
  *   **Problem:** In Round 2, students won't understand how Mental gets credit if Neural is still sufficient.
  *   **Fix:** Guide the counterfactual. "If she had the Neural state but *no* Doubt (impossible by supervenience, but imagine), would she have voted differently?" Use the supervenience link: "If no Doubt, then no Neural State N. If no Neural State N, then no Vote Change. Therefore, Doubt made a difference."

  ## V. Limitations: What the Activity Cannot Reproduce

  Be frank about these in the debrief. The game is a model, not the territory.

  1.  **The Modal Strength of Closure:**
      *   *In Game:* Closure is a rule on a sheet ("Neural is sufficient").
      *   *In Reality:* Closure is a metaphysical premise based on the completeness of physics. Students might feel they can just "break the rule." You must explain that in the argument, Closure is not a rule we can opt out of; it's an empirical/metaphysical claim about the world.
  2.  **Causation vs. Causal Explanation:**
      *   *In Game:* We are assigning "Credits" (Ontological Causation).
      *   *In Reality:* Much of the work "Mental Causation" does is *explanatory*. The Mental might not cause the event *ontologically* (production) but is the only useful way to *explain* it. The game conflates these, which mirrors the Exclusion Argument's conflation, but you must point this out as a potential category error (Kim vs. Dennett).
  3.  **The "Budget" Metaphor:**
      *   *In Game:* Causation is a conserved quantity (100 points).
      *   *In Reality:* Causation might not be conserved. Light can cause a shadow, and the object blocking light can also cause the shadow, without "using up" causation. The budget mechanic *forces* exclusion. You must admit: "The game assumes causation is a pie. If causation isn't a pie, the Exclusion Argument fails at step one."
  4.  **Event vs. Property Exclusion:**
      *   *In Game:* We assign credit to "The Mental State" (Event).
      *   *In Reality:* The hard problem is often about *Properties*. The neural event causes the vote. Does the *property* of being a doubt cause it? The game simplifies this to Event-vs-Event. Use the debrief to distinguish: "Even if the Mental *Event* gets credit (Round 2), does the Mental *Property* do any work, or is it just along for the ride?"

  ## VI. Instructor Script for the "Contrastive" Reveal (Minute 45)

  > "Look at the whiteboard. In Round 1, the Mental State starved. Why? Because we treated causation like a bucket of water. If the Neural bucket is full, there's no room for the Mental water.
  >
  > But in Round 2, we changed the question. We didn't ask 'Who filled the bucket?' We asked 'Who tipped the scale?'
  >
  > This is the exact fault line in the literature. Jaegwon Kim (the architect of the Exclusion Argument) assumes the Round 1 picture: Causation is production. If Physics produces the effect, Mind is out.
  >
  > But philosophers like List and Menzies argue for the Round 2 picture: Causation is difference-making. If the Mental state makes a difference to the outcome *relative to its absence*, it is a cause, even if the Physical realizer was sufficient.
  >
  > The Exclusion Argument doesn't land as a syllogism; it lands as a choice between these two games. Which game do you think the actual world is playing?"

  ## VII. Post-Activity Assignment (Optional)
  Write a 1-page reflection: "In Round 1, you assigned 0 credits to Doubt. If you stand by that assignment in the real world, what happens to our legal system's concept of *responsibility*? If you reject that assignment, which Rule from Round 1 must you break, and what is the metaphysical cost of breaking it?"
