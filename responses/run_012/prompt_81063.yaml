  2.  **The Chess Tournament:** Letting the clock run while standing up (allowed) vs. touching a piece without moving it (breach). *Risk:* Hard to frame as a foreseen side effect of a different action; feels like the action itself.
  3.  **The HOA:** Mowing the lawn on Saturday (allowed) vs. Sunday (breach). *Risk:* Noise pollution implies welfare harm to neighbors.
  4.  **The Bowling League:** Bowling a strike where the slide causes shoelaces to untie (breach of dress code bylaw) vs. stay tied (adherence). *Selection:* This works best. It is a codified rule, purely conventional, easily foreseen as a physical consequence of the main action (bowling), and can be explicitly stipulated as costless (no penalty, no trip hazard).

  **Selected Practice:** The Saturday Morning Bowling League.
  **The Rule:** Bylaw 12 ("Shoelaces must remain double-knotted at all times during play").
  **The Action:** Bowling a strike to win a pot.
  **The Side Effect:** The physical force of the slide causes the laces to loosen (Breach) or hold (Adherence).

  ***

  ### Part 2: The Vignettes

  **Version 1 (Breach)**
  Mark is a member of the Saturday Morning Bowling League. The League has a strict bylaw: "Shoelaces must remain double-knotted at all times during play." Mark is about to bowl his final frame. He needs a strike to win the pot. He knows that the force of his slide will cause his laces to come undone. He thinks to himself, "I don't care about the laces. I just want to win the pot." He bowls the ball. It is a strike. As predicted, his laces come undone. The official does not notice, no penalty is assessed, and nobody is inconvenienced.

  **Version 2 (Adherence)**
  Mark is a member of the Saturday Morning Bowling League. The League has a strict bylaw: "Shoelaces must remain double-knotted at all times during play." Mark is about to bowl his final frame. He needs a strike to win the pot. He knows that the force of his slide will not cause his laces to come undone. He thinks to himself, "I don't care about the laces. I just want to win the pot." He bowls the ball. It is a strike. As predicted, his laces do not come undone. The official does not notice, no penalty is assessed, and nobody is inconvenienced.

  ***

  ### Part 3: The Analysis

  **Folk Intuition Prediction:**
  In the **Breach** version, a significant portion of ordinary people (roughly 60-70%, based on analogous conventional norm studies) will likely say Mark brought about the side effect **intentionally**. In the **Adherence** version, most will say he did **not** bring it about intentionally.

  **Evaluating the Explanations:**

  1.  **The Moral Valence Account (Nadelhoffer):** This theory posits that the asymmetry is driven by the moral badness of the outcome (harm).
      *   *Prediction:* **No Asymmetry.** Since no one is hurt and no welfare is impacted, there is no moral blame to trigger the intentionality judgment. Both versions should be rated "Not Intentional."
      *   *Evidence:* If respondents answer "Not Intentional" for *both*, this supports the view that moral harm is a necessary condition for the Knobe Effect.

  2.  **The Blame Account (Knobe, early):** Similar to above, this suggests we attribute intentionality to create a target for blame.
      *   *Prediction:* **No Asymmetry.** If the breach is truly costless, there is nothing to blame. Without blame, there is no motivation to attribute intentionality.
      *   *Evidence:* If respondents answer "Not Intentional" for *both*, this supports the view that blame-pragmatics drive the effect.

  3.  **The Norm Violation Account (Uttal, Knobe later):** This theory suggests the effect tracks *normative* deviation, not just moral harm. Breaking a rule (even a conventional one) triggers a "counter-normative" judgment that biases intentionality attributions.
      *   *Prediction:* **Asymmetry.** The Breach version violates a salient norm, triggering the "Intentional" response. The Adherence version conforms, triggering "Not Intentional."
      *   *Evidence:* If respondents answer "Intentional" for Breach and "Not Intentional" for Adherence, this supports the view that the Knobe Effect is about normativity in general, not morality specifically.

  4.  **The Epistemic Account (Adams/Steuer):** This suggests the asymmetry is actually about knowledge. We think agents know bad side effects more certainly than good ones.
      *   *Prediction:* **No Asymmetry.** In both vignettes, I explicitly stipulated he "knows with certainty."
      *   *Evidence:* If respondents answer "Intentional" for *both* (because he knew in both cases), it suggests the original effect was just confounding knowledge with intent. (This is the least likely outcome given existing literature).

  **What This Pair Pulls Apart:**
  This pair primarily pulls apart **Moral Valence/Blame** from **Normative Violation**. If the asymmetry persists here, it proves that "badness" in the Knobe Effect does not require *harm* or *suffering*, but merely *rule-breaking*. It challenges the Moral Valence Account by showing that conventional norms can substitute for moral norms in driving intentionality judgments.

  **The "No Asymmetry without Moral Harm" Objection:**
  I must concede there is a strong possibility this case **will not** generate the asymmetry. Empirical work (e.g., by Machery or in replication crises) suggests that when moral valence is stripped, the effect size shrinks drastically or vanishes. Ordinary people may view a shoelace bylaw as too trivial to trigger the cognitive machinery of "intentional action." They might view it as a mere accident in both cases because Mark's *goal* was the strike, and the lace status was irrelevant to his agency. If the breach doesn't feel *wrong* in a deep sense, the heuristic doesn't fire.

  **The Blame Theorist's Wave-Away:**
  A proponent of the Blame/Moral Account would dismiss these vignettes by arguing: *"You haven't actually removed morality. You've just made it thin. To a rule-follower, breaking a promise or a bylaw is inherently a moral failing (unfairness to other members). If you get an asymmetry here, it's because subjects are implicitly treating the rule breach as a moral violation. If you get no asymmetry, it's because you successfully removed the moral stakes, proving morality is required."* They would claim the vignette is either secretly moral or inert, but never purely conventional.

  **The Single Change to Revert:**
  To turn this back into the ordinary Chairman setup (guaranteeing the asymmetry via moral harm), change one sentence in the Breach version:
  *"As predicted, his laces come undone, **causing him to slip and injure a spectator.**"*
  (Now the side effect involves physical harm, triggering the robust moral blame mechanism.)
