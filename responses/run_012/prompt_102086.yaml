  # Adversarial Collaboration Document: The Normative Implications of Moral Foundations Theory

  **Date:** October 26, 2023
  **Participants:** Camp A (Normative Weight) and Camp B (Normative Skepticism)
  **Subject:** The extent to which descriptive moral psychology bears on normative ethical questions.

  ## 1. Statement of Shared Commitments

  Before delineating our disagreements, we affirm the following claims as a shared baseline for this collaboration. Both Camp A and Camp B sign onto these propositions:

  1.  **Descriptive Primacy:** Moral Foundations Theory (MFT) is, in its primary form, a descriptive psychological model. It maps the variance in moral intuitions across individuals and cultures; it is not itself a normative ethical system.
  2.  **No Direct Derivation:** The mere existence of a moral intuition, regardless of how widely shared or deeply felt, does not logically guarantee the truth of the proposition associated with that intuition. (We agree that prevalence does not equal validity).
  3.  **Political Polarization:** There is a measurable divergence in moral prioritization between political liberals and conservatives, specifically regarding concerns such as loyalty, authority, and sanctity versus care and fairness.
  4.  **Mutual Deficiency Model:** It is unproductive to assume that political opponents are morally blind or deficient simply because they prioritize different moral matrices.
  5.  **Empirical Fallibility:** The psychological data underpinning MFT is subject to revision. If the factor structures or cross-cultural replications fail, the philosophical arguments built upon them must be adjusted.
  6.  **The Goal of Dialogue:** The purpose of invoking MFT in political discourse should be to reduce demonization and increase understanding, regardless of whether one believes this leads to normative truth.

  ## 2. Methodological Criterion: Symmetric Revisability

  We propose to test the following criterion regarding the function of moral arguments in this debate:

  > **The Criterion:** A moral consideration does genuine justificatory work in a disagreement only if both parties, applying it symmetrically to their own favored position, would be willing to revise at least one of their settled judgments.

  **Camp A Position on the Criterion:**
  *   **Acceptance:** We accept this criterion.
  *   **Movement:** Accepting this moves us to clarify that we are not using MFT to immunize conservative or liberal views from criticism. If MFT reveals a "foundation" that leads to harmful outcomes when applied symmetrically, we must revise our valuation of that foundation.
  *   **Implication of Asymmetry:** If Camp B cannot accept this, it would suggest they view normative truth as entirely independent of human psychology, rendering dialogue about "constitutions" moot.

  **Camp B Position on the Criterion:**
  *   **Acceptance:** We accept this criterion.
  *   **Movement:** Accepting this moves us to acknowledge that if psychological evidence shows a specific intuition is universally prone to error (e.g., disgust leading to prejudice), we must revise our reliance on that intuition in normative reasoning.
  *   **Implication of Asymmetry:** If Camp A cannot accept this, it would suggest they are using MFT as a shield to protect specific intuitions from rational critique, effectively engaging in relativism while claiming normative weight.

  **Joint Statement:** Since both camps accept the criterion, we agree that the debate is not about whether psychology *can* influence judgment, but *how* and *under what conditions* it does so.

  ## 3. Disagreements Table

  The following table outlines the residual disagreements. For each row, we state the disagreement neutrally, then formulate it as each camp would, identify the crux, and propose a test case with predictions.

  | # | Neutral Wording of Disagreement | Camp A Formulation (Normative Weight) | Camp B Formulation (Normative Skepticism) | The Crux | Agreed Test Case / Evidence | Camp A Prediction | Camp B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Epistemic Link:** Does descriptive data about moral intuitions provide evidence for normative truth? | **Constitutive Evidence:** The structure of human moral psychology reveals the "moral landscape." If a concern is deeply rooted across diverse populations, it tracks a real moral value, even if not logically proven. | **The Logical Gap:** Facts about mental states belong to a different category than facts about moral obligations. Prevalence explains why we believe, not what we should believe. | **Moral Epistemology:** Is moral truth discovered through reflective coherence with our nature (A), or through rational justification independent of our nature (B)? | **The Universal Intuition Test:** Identify a moral intuition that is near-universal but, upon reflection, is deemed repugnant (e.g., historical norms regarding hierarchy). | If an intuition is universal but repugnant, Camp A will argue it is a "mismatch" or corrupted expression, not evidence against the foundation itself. | If an intuition is universal but repugnant, Camp B will argue this proves psychology is irrelevant to normative truth. |
  | **2** | **Empirical Robustness:** Are the proposed foundations distinct and stable enough to support philosophical argumentation? | **Sufficient Stability:** The distinctions (e.g., Authority vs. Care) are robust enough to serve as a heuristic for understanding moral disagreement, even if the factor analysis is imperfect. | **Premature Reification:** The factors are not distinct modules but overlapping clusters derived from WEIRD (Western, Educated, Industrialized, Rich, Democratic) samples. Building philosophy on this is premature. | **Validity of the Model:** Is MFT a map of biological reality (A) or a statistical artifact of current survey methods (B)? | **Cross-Cultural Factor Analysis:** Conduct factor analysis on moral surveys in small-scale, non-industrialized societies without pre-loading "foundation" terms. | Camp A predicts the same latent factors will emerge, confirming distinct foundations. | Camp B predicts the factors will dissolve or reconfigure, showing the "foundations" are culturally specific constructs. |
  | **3** | **The Function of Explanation:** Does explaining the source of a moral belief validate or undermine it? | **Validation via Understanding:** Showing that an opponent's view stems from a recognizable moral foundation (e.g., Loyalty) validates it as a moral view rather than a prejudice. | **Undermining via Genealogy:** Explaining the psychological source of a belief (e.g., "You only believe this due to an Authority instinct") often undermines its claim to objective justification. | **Genealogy vs. Justification:** Does knowing the *cause* of a belief count toward its *warrant*? | **The Symmetry Application:** Apply the "Symmetric Revisability" criterion to a specific policy dispute (e.g., immigration). | Camp A predicts that acknowledging the moral foundations on both sides will reduce polarization and lead to compromise. | Camp B predicts that acknowledging the foundations will lead to stalemate, as both sides dig in behind their "constitutions" without rational resolution. |

  ## 4. Identification of Verbal Disagreements

  We identify two key terms where ambiguity may be generating the appearance of substantive disagreement where there is only semantic divergence.

  **Term 1: "Foundation"**
  *   **Ambiguity:** Camp A tends to use "foundation" to imply a latent, evolved capacity that *presumes* a corresponding external value (a realist leaning). Camp B uses "foundation" to describe a psychological tendency that may be entirely internal and error-prone (an anti-realist or constructivist leaning).
  *   **What Turns on It:** If "foundation" implies a capacity to *detect* moral truth, Camp A wins. If "foundation" implies a capacity to *generate* moral feelings regardless of truth, Camp B wins.
  *   **Resolution:** We agree to use the term "Moral Concern" instead of "Foundation" when discussing normative weight, reserving "Foundation" strictly for the psychological mechanism.

  **Term 2: "Justification"**
  *   **Ambiguity:** Camp A often means "social justification" or "intelligibility" (making a view understandable within a community). Camp B means "rational justification" (providing premises that compel assent regardless of psychological makeup).
  *   **What Turns on It:** When Camp A says MFT helps "justify" a view to an opponent, they mean it makes the view *comprehensible*. Camp B hears this as claiming the view is *correct*.
  *   **Resolution:** We agree to distinguish between "Explaining Intelligibility" (Camp A's strength) and "Establishing Validity" (Camp B's requirement).

  ## 5. Application of the Symmetric Revisability Criterion

  Per the requirement in Section 2, we apply the criterion to a specific case: **The Moral Relevance of Disgust.**

  *   **The Case:** One side argues that certain acts are wrong because they are disgusting (Sanctity/Degradation foundation). The other side argues disgust is irrelevant to wrongness.
  *   **Application:**
      *   **Camp A:** If we accept disgust as a moral guide, we must apply it symmetrically. If disgust validates opposition to same-sex marriage, does it also validate opposition to interracial marriage (which historically triggered disgust)? If Camp A is unwilling to revise the judgment on interracial marriage, they must concede disgust does not do genuine justificatory work here.
      *   **Camp B:** If we reject disgust as a moral guide, we must apply it symmetrically. Does this rejection undermine intuitions about cannibalism or desecration of corpses, which also rely on disgust? If Camp B is unwilling to revise the judgment that corpse desecration is wrong, they must concede disgust carries some weight.

  **Outcome of the Test:**
  *   **Camp A Statement:** We accept that disgust cannot justify same-sex marriage restrictions if it cannot justify interracial marriage restrictions. We are willing to revise the judgment on same-sex marriage or find a non-disgust foundation (e.g., Care or Fairness) to support our view. This shows MFT helps us prune bad intuitions, not just keep them.
  *   **Camp B Statement:** We accept that if we reject disgust for sexual politics, we must find a non-disgust reason to condemn corpse desecration (e.g., Respect for the deceased or Care for the living). We are willing to revise the judgment that disgust *itself* is the reason. This shows normative reasoning must transcend the emotion.

  **Conclusion on the Criterion:**
  Both camps find that accepting the criterion forces a refinement of their positions rather than a surrender.
  *   **If Camp A could not accept:** It would show they are using MFT to rationalize pre-existing biases (Specifically, protecting "Sanctity" only when it suits their political coalition).
  *   **If Camp B could not accept:** It would show they are ignoring the role of emotion in their own "rational" judgments (Specifically, relying on unacknowledged disgust while claiming pure reason).
  *   **Since Both Accept:** It demonstrates that MFT is best used as a tool for **diagnostic clarity** (identifying which foundations are in play) rather than **normative arbitration** (deciding which foundation wins).

  ## 6. Final Synthesis

  We conclude that Moral Foundations Theory carries normative weight only in a negative or diagnostic capacity. It successfully demonstrates that political opponents are not morally deficient (validating Camp A's social claim), but it cannot determine which moral matrix is correct (validating Camp B's logical claim).

  The genuine justificatory work is done not by the existence of the foundations, but by the willingness of both parties to subject the outputs of those foundations to the **Symmetric Revisability Criterion**. Where Camp A sees a map of moral reality, and Camp B sees a map of psychological bias, we agree that the map is useful only if it allows us to navigate toward judgments we can hold consistently, regardless of which side of the political divide we occupy.
