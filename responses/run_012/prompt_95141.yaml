          *   *Epi:* Non-linear dose-response. Step function. $Y = 0$ if $E < T$, $Y > 0$ if $E \ge T$.
          *   *Nuance:* Voting is binary threshold. Climate is likely continuous but with potential tipping points (ice sheets). Meat is continuous (supply chain adjustments).
