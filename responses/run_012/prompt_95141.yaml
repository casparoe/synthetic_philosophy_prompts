          *   *Bend:* Epi usually requires counterfactual dependence for causation (Sufficient Component Cause model). Claiming causation without difference-making bends the "necessary cause" definition. It treats causation as *fractional contribution* rather than *but-for causality*.

      *   **3. Complicity/Participation:**
          *   *Phil:* It's wrong to join the harmful practice, regardless of impact.
