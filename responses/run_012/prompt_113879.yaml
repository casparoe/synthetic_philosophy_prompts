      *   *Claim 2: The engine is inequality.*
          *   Turchin's view: Inequality is a *major* driver, but specifically "elite overproduction" and "popular immiseration" working together. It's structural-demographic theory (SDT). Inequality alone isn't the *only* engine; state fiscal stress matters too.
          *   Nuance: "Inequality" is often a proxy for deeper structural issues (elite saturation).
      *   *Claim 3: Population growth presses on resources, surplus sucked upward, people immiserated, elite grows fat.*
          *   Turchin's view: This is classic Malthusian SDT. Yes, this is the mechanism.
          *   Nuance: In modern societies, "resources" isn't just land/food; it's jobs/status.
      *   *Claim 4: Society snaps (revolution/collapse), cycle resets.*
          *   Turchin's view: Yes, "Age of Mass Mobilization" or "Crisis."
          *   Nuance: Not always total collapse; sometimes reform or repression delays it.
      *   *Claim 5: Asabiya (solidarity) explains renewal vs. failure.*
          *   Turchin's view: Yes, he explicitly uses Ibn Khaldun's term. Measured via proxies (cooperation, civic orgs).
