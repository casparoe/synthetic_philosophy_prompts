      *   *Does it follow from Turchin's Actual Theory?* No. Turchin distinguishes between *structural* pressures (the dry tinder) and *contingent* triggers (the spark).
      *   *Analogy:* Earthquake prediction. We know stress is building (structural), but we don't know exactly when the fault will slip or which building falls (contingency).
      *   *Role of Narrative:* Narrative explains the *specifics* of the crisis (who, how, why this leader), while cliodynamics explains the *probability* of the crisis occurring at all. They are complementary, not mutually exclusive.
