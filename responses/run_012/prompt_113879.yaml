      *   **Input:** A summary of a magazine piece about Turchin's work (secular cycles, inequality engine, *asabiya*, Seshat database, 2010 prediction of 2020s instability, history has mathematical structure).
      *   **Task 1:** Break down the summary claim-by-claim into three categories:
          *   (a) What a cliodynamicist would agree with.
