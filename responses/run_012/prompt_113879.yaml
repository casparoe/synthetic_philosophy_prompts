          *   (c) What Turchin would deny claiming.
      *   **Specific Focus:** The "inequality is the engine" claim (is it a simplification?).
      *   **Task 2:** Address the friend's argument (If history has mathematical structure $\rightarrow$ contingency/agency doesn't matter $\rightarrow$ narrative history is obsolete). Does this follow from the article? Does it follow from Turchin's actual theory?
      *   **Constraint:** Be concrete, not just "it's complicated."

  2.  **Deconstruct the Magazine Summary (Task 1):**
