          *   Nuance: "Instability" is broad. Critics argue it's vague enough to be unfalsifiable (e.g., is a protest instability? Is a coup?).
      *   *Claim 8: History has a mathematical structure; we can say roughly when the next crisis is coming.*
          *   Turchin's view: Yes, "mathematical structure" (differential equations).
          *   Nuance: "When" is probabilistic (windows of vulnerability), not specific dates.

  3.  **Address the "Inequality Engine" Question:**
      *   The user suspects simplification. They are right.
      *   Turchin's Structural-Demographic Theory (SDT) relies on *three* interacting factors:
          1.  Popular Immiseration (real wages down).
          2.  Elite Overproduction (too many elites competing for too few positions).
          3.  State Fiscal Stress (government can't pay bills).
      *   Inequality is the *result* or *symptom* of the elite/population dynamic, but "Elite Overproduction" is often the more specific trigger for political violence (elites lead the revolutions). Just inequality without elite fragmentation might not cause collapse.

  4.  **Address the Friend's Argument (Task 2):**
