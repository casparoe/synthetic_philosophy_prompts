answer: |-
  This is the "Equality of What?" debate stripped of the academic jargon and applied to a budget spreadsheet. You are not trying to solve inequality in the abstract; you are practicing **Prioritarianism** (giving priority to the worst off) under scarcity.

  Here is the spec for a metric of "worst off," followed by the trade-offs you actually face.

  ### The Desiderata (The Spec)

  **1. Fidelity to Disadvantage**
  *   **The Case:** The metric must track the actual thing that makes life hard, not a proxy that usually correlates with it.
  *   **Why:** Your current rule uses *medical bills* as a proxy for *health hardship*. But a person with high bills and good insurance might be better off than a person with low bills, no insurance, and chronic pain they manage without doctors. If the metric doesn't touch the actual suffering, you are funding paperwork, not people.

  **2. Responsibility Sensitivity**
  *   **The Case:** The metric should distinguish between disadvantage caused by brute bad luck (diagnosis) and disadvantage caused by voluntary choice (gambling).
  *   **Why:** This is the core of the "deservingness" intuition. If two people have \$500 left at the end of the month, but one spent it on insulin and the other on slots, treating them identically feels like a moral error to half your committee. It signals that choices don't matter.

  **3. Administrative Verifiability**
  *   **The Case:** The data points used must be objectively confirmable by a third party without intrusive investigation.
  *   **Why:** If you cannot prove the number, you cannot defend the decision. This is the shield against accusations of favoritism and the barrier against fraud. If the metric relies on "trust us," the program will be captured by the most confident liars.

  **4. Incentive Neutrality (Non-Perversity)**
  *   **The Case:** The metric must not reward applicants for making their situation worse, nor punish them for improving it.
  *   **Why:** If getting the top-up requires proving you are destitute, people will stay destitute. If it requires proving you are sick, people will avoid getting better. A good metric measures the hole without paying people to dig it deeper.

  **5. Interpersonal Comparability**
  *   **The Case:** The metric must produce a single scale where Person A can be definitively ranked above or below Person B.
  *   **Why:** You have 40% funding. You *must* say no to someone. If the metric says "Person A has high pain, Person B has high isolation," and you have no way to weigh pain against isolation, you cannot rank. You need a common currency of disadvantage.

  **6. Agency Respect**
  *   **The Case:** The metric should not override an applicant's own assessment of their well-being without overwhelming evidence to the contrary.
  *   **Why:** This is your dialysis patient. If he says his life is good, and you give him money because your algorithm says he *should* be miserable, you are treating him as a vessel of suffering rather than a person. It is patronizing and dehumanizing to tell someone they are worse off than they say they are.

  ***

  ### The Honest Read

  #### Non-Negotiables vs. Taste
  *   **Non-Negotiable:** **Administrative Verifiability** and **Interpersonal Comparability.**
      *   If you lose Verifiability, the program becomes corrupt or appears so, and it will be defunded.
      *   If you lose Comparability, you cannot make the 60% rejection decision. You end up with a lottery, which might be fair, but it isn't "helping the worst off."
  *   **Taste:** **Responsibility Sensitivity.**
      *   This is purely philosophical. One camp believes in "Luck Egalitarianism" (compensate for bad luck, not bad choices). The other believes in "Sufficientarianism" (if they are below the line, fix it, don't ask why). Neither is objectively correct; it depends on what your city believes about moral desert.

  #### The Impossible Pairs (Trade-Offs)
  You cannot have all six. Here are the collisions that will break your redesign:

  **1. Responsibility Sensitivity vs. Administrative Verifiability**
  *   **The Conflict:** To know if someone is broke due to gambling or illness, you need to audit their life, not just their bank account. You need to judge their character.
  *   **The Reality:** You cannot verify "cause of poverty" without invasive scrutiny that violates privacy or relies on stereotypes. The more you try to measure responsibility, the less verifiable and objective your data becomes.
  *   **Verdict:** You usually have to sacrifice Responsibility to save Verifiability.

  **2. Fidelity to Disadvantage vs. Incentive Neutrality**
  *   **The Conflict:** The most faithful measure of hardship is subjective suffering ("How much are you hurting?"). But if money is tied to suffering, people will exaggerate suffering.
  *   **The Reality:** To prevent gaming, you must use objective proxies (income, bills, diagnosis codes). But proxies always have low fidelity (see the dialysis patient with low bills).
  *   **Verdict:** You must sacrifice Fidelity to maintain Incentive Neutrality.

  **3. Agency Respect vs. Fidelity to Disadvantage**
  *   **The Conflict:** This is your dialysis patient. Human beings adapt to terrible circumstances (the "hedonic treadmill"). A person can be objectively deprived but subjectively content.
  *   **The Reality:** If you respect Agency, you ignore the dialysis patient (he says he's fine). If you prioritize Fidelity, you fund him anyway (you know dialysis is hard), effectively telling him he is wrong about his own life.
  *   **Verdict:** Most welfare states sacrifice Agency Respect. They assume deprivation is bad even if the deprived person says otherwise.

  ***

  ### The Hard Choices

  **Does the choice of currency change the ranking?**
  Yes, drastically.
  *   **Income/Resources:** Ranks the gambler and the patient the same. Misses the high-need/low-cost patient.
  *   **Welfare (Happiness/Utility):** Ranks the happy dialysis patient as "well off." Highly vulnerable to gaming.
  *   **Capabilities (What they can actually do):** Ranks the dialysis patient high-need (mobility restricted), but is almost impossible to verify administratively.
  *   **Practical Reality:** With 40% funding and a need to avoid lawsuits/fraud, **Resources (Income + Verified Expenses)** is the only currency that survives contact with reality, even though it is morally blunt.

  **If you must drop one item, which one?**
  Drop **Responsibility Sensitivity**.
  *   **Why:** It is the most administratively expensive and the most prone to bias. Distinguishing "bad luck" from "bad choice" requires a level of investigative power a city committee shouldn't have. It creates a "moral worthiness" test that slows down aid and humiliates applicants. It is better to be a blunt instrument that helps the needy regardless of fault than a precise scalpel that cuts away aid based on unprovable judgments about character.

  **Which single item rules out the most popular answers?**
  **Incentive Neutrality (Anti-Gaming).**
  *   **Why:** This is the item that kills the "ask them how they feel" solution. If you could trust people to report their own hardship accurately, you could solve Fidelity, Agency, and Comparability easily. But because you cannot allow the metric to be gamed, you are forced back into cold, hard, objective data (income, bills) that fails Fidelity and Agency. It is the constraint that forces you to be bureaucratic.

  ***

  ### Short Note on Currency (Welfare vs. Resources vs. Capabilities)

  *   **Resources (Current Rule):** Fails Fidelity (misses non-monetary hardship) and Responsibility (treats gambler/patient same). **Passes** Verifiability and Incentives.
  *   **Welfare (Self-Reported Well-being):** Fails Incentives (easy to game) and Fidelity (adaptation problem). **Passes** Agency.
  *   **Capabilities (Functioning/Access):** Fails Verifiability (too hard to measure "ability to move around" consistently). **Passes** Fidelity.

  **Conclusion:** They all fail the list. Resources is the only one that doesn't fail the *Non-Negotiables* (Verifiability/Comparability). If you want to move off Resources, you aren't changing the currency; you are expanding the list of verified expenses (e.g., adding verified care costs, transport costs) to improve Fidelity without sacrificing Verifiability. Do not try to measure "happiness" or "fault." Measure verified gaps between necessary costs and income.
