prompt: |-
  ok so i have a weird job. I sit on a small committee in my city that hands out a hardship top-up — extra cash each month — and we have maybe 40% of what we'd need to cover everyone who applies. Right now the ranking is: income below a line, then whoever has the biggest medical bills. Everyone on the committee hates the rule, nobody can say exactly why, so before we redesign the thing I want to know what a good answer to "who is worst off" would even have to look like. Not a slogan — the actual spec.

  So: write me the desiderata for a measure of who's worse off, i.e. what any adequate answer to the equality-of-what question would have to deliver if it's going to be used to rank real households for a real program. The list, with the case behind each item, then your honest read on which items are non-negotiable and which are just one camp's taste, and which pairs can't be had together. That last part is what I most want.

  Some things I keep tripping over, but dont just take my list as the list:

  - people who've adapted to a bad situation and report that they're fine. I visit a guy in his sixties, dialysis three times a week, says his life is good. I don't believe the survey and I also don't want to tell him he's wrong about his own life.
  - broke because of a diagnosis vs broke because of gambling. Our current rule treats them identically and half the committee thinks that's obviously right and half thinks it's obviously insane.
  - we can only use data we can actually collect, and people shouldn't be able to game it. We had a run of applications that were, lets say, creative.
  - and "worst off" seems like a different question from "how equal is everything," which I think matters here but I can't articulate why.

  Also: does the choice of currency actually change the ranking much, or is that mostly an academic worry? And if a measure satisfied everything on your list except one item, which item would you rather lose, and which single item do you think rules out the most of the popular answers? If you want, a short line at the end on whether the usual currency options — welfare, resources, capabilities — really come apart on this list or all fail the same items. Keep that part short, the list is the thing.

  Dont need the literature, I'm not writing a paper, I just want the spec. Long is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A member of a small city committee distributing hardship top-ups (40% funding coverage).
      *   **Current Rule:** Income below a line, then highest medical bills.
      *   **Problem:** Committee hates the rule, can't articulate why. Needs a "spec" (desiderata) for a measure of "who is worst off."
      *   **Specific Constraints/Questions:**
          *   Not a slogan, but an actual spec.
          *   List items with the case behind each.
          *   Identify non-negotiables vs. taste.
          *   Identify incompatible pairs (trade-offs).
          *   Address specific tripping points: adaptation (happy dialysis patient), responsibility (gambling vs. diagnosis), data availability/gaming, "worst off" vs. "equality."
          *   Does currency choice matter practically?
          *   If one item must be dropped, which one?
          *   Which item rules out the most popular answers?
          *   Short conclusion on welfare/resources/capabilities.
      *   **Tone:** Practical, honest, philosophical but grounded in administration. No academic literature citations needed.
      *   **Goal:** Help the committee redesign the allocation mechanism by clarifying the underlying ethical metric.

  2.  **Deconstruct the Core Problem:**
      *   The committee is trying to solve a *prioritization* problem under scarcity, not just an *equality* problem.
      *   "Worst off" is a comparative judgment of well-being or disadvantage.
      *   The tension is between objective metrics (easy to audit, hard to game) and subjective reality (hard to measure, easy to manipulate).
      *   The tension is between responsibility (deservingness) and need (suffering).

  3.  **Drafting the Desiderata (The Spec):**
      *   I need to generate a list of criteria that a good metric *should* meet.
      *   *Candidate 1: Sensitivity to Suffering.* It must track actual hardship, not just proxies. (Addresses the dialysis patient).
      *   *Candidate 2: Responsibility Sensitivity.* It should distinguish between bad luck and bad choices. (Addresses the gambling vs. diagnosis).
      *   *Candidate 3: Verifiability/Objectivity.* It must be based on data you can actually get. (Addresses gaming).
      *   *Candidate 4: Stability/Non-Perversity.* It shouldn't incentivize making things worse to get money. (Addresses gaming/adaptation).
      *   *Candidate 5: Comparability.* It must allow ranking Person A against Person B. (Addresses the "40% funding" constraint).
      *   *Candidate 6: Respect for Agency.* It shouldn't insult the applicant's own assessment of their life. (Addresses the "happy dialysis patient" again).

  4.  **Refining the Desiderata (Adding the "Case"):**
      *   Make sure each point explains *why* it matters for *this* committee.
      *   *Sensitivity:* If the metric says someone is fine but they are starving, the metric failed.
      *   *Responsibility:* If the metric treats the gambler and the cancer patient the same, it feels unjust to some.
      *   *Auditability:* If you can't prove the number, you can't defend the decision.
      *   *Incentive Compatibility:* Don't pay people to stay sick or hide income.
      *   *Interpersonal Comparability:* You have to pick one over the other.

  5.  **Analyzing Trade-offs (The "Honest Read"):**
      *   *Non-negotiables:* Auditability (otherwise the program collapses), Comparability (otherwise you can't rank).
      *   *Taste:* Responsibility (some believe in luck egalitarianism, others in sufficientarianism).
      *   *Incompatible Pairs:*
          *   *Responsibility vs. Auditability:* Knowing *why* someone is broke is hard to verify without intrusive investigation.
          *   *Subjective Well-being vs. Incentive Compatibility:* If you pay based on "how sad are you," people will say they are sad. If you pay based on "how happy are you," people adapt (Sen's adaptation problem).
          *   *Respect for Agency vs. Sensitivity:* The dialysis patient says "I'm fine." Do you believe him (Agency) or assume he's coping too well (Sensitivity)?

  6.  **Addressing the Specific Questions:**
      *   *Currency Choice:* Does it matter? Yes. Income (resources) misses medical needs. Capabilities (what you can do) is hard to measure. Welfare (happiness) is manipulable.
      *   *Drop One Item:* Which is the weakest link? Probably "Responsibility Sensitivity." It's the hardest to measure fairly.
      *   *Rules Out Most Answers:* "Incentive Compatibility" (Don't game the system). This kills subjective self-reporting and some complex needs assessments.
      *   *Welfare/Resources/Capabilities:* Briefly map them to the failures.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the difficulty. This is the "Equality of What?" debate applied to a budget spreadsheet.
      *   *The List:*
          1.  **Fidelity to Disadvantage:** Does it measure the actual bad thing?
          2.  **Responsibility Differentiation:** Does it care about cause?
          3.  **Administrative Verifiability:** Can you prove it?
          4.  **Incentive Neutrality:** Does it punish improvement?
          5.  **Interpersonal Comparability:** Can you scale A vs B?
          6.  **Agency Respect:** Does it override self-reporting?
      *   *The Trade-offs:*
          *   Non-negotiable: Verifiability, Comparability.
          *   Taste: Responsibility.
          *   Impossible Pairs: Fidelity vs. Verifiability (Real suffering is internal, data is external). Responsibility vs. Privacy/Verifiability. Agency vs. Fidelity (The adaptation problem).
      *   *The "Drop One":* Drop Responsibility. It's too messy for a small committee.
      *   *The "Killer Constraint":* Incentive Neutrality / Anti-Gaming. This is what kills the "ask them how they feel" approach.
      *   *Currency Check:* Resources (Income) fails Fidelity. Welfare (Happiness) fails Incentive Neutrality. Capabilities (Functioning) fails Verifiability.

  8.  **Review against Constraints:**
      *   Did I answer the "currency" question? Yes.
      *   Did I address the dialysis patient? Yes (Agency vs. Fidelity).
      *   Did I address the gambler? Yes (Responsibility).
      *   Did I address the gaming? Yes (Verifiability/Incentives).
      *   Is it long enough but not academic? Keep it punchy.
      *   *Self-Correction on "Non-negotiable":* I need to be careful. Is Verifiability truly non-negotiable? If the program loses public trust due to fraud, it ends. So yes, practically non-negotiable.
      *   *Self-Correction on "Worst Off vs Equality":* The user asked about this. "Worst off" is prioritarian (help the bottom), "Equality" is relational (close the gap). With 40% funding, you are doing Prioritarianism, not Egalitarianism. I should mention this distinction.

  9.  **Final Polish:** Ensure the tone is empathetic to the committee's position. They are making life-altering decisions with imperfect tools. The "spec" should feel like an engineering document for ethics.

      *(Self-Correction during drafting the trade-offs)*: I need to make sure I clearly identify which pairs *cannot* be had together.
      *   Pair 1: **Responsibility Sensitivity + Administrative Verifiability.** You can't easily prove *why* someone is broke without invading privacy or making assumptions.
      *   Pair 2: **Fidelity to Disadvantage + Incentive Neutrality.** If you measure pain directly, people exaggerate pain. If you measure proxies (medical bills), people might over-treat.
      *   Pair 3: **Agency Respect + Fidelity to Disadvantage.** The adaptation problem. The happy dialysis patient.

      *(Refining the "Currency" section)*: Keep it short as requested. Resources = Current rule (flawed). Welfare = Unworkable (gaming). Capabilities = Ideal but impossible to measure at scale.

      *(Refining the "Drop One" section)*: If I have to lose one to make the system work, it's Responsibility. It's the source of most moral disagreement and administrative burden.

      *(Refining the "Killer Item" section)*: Incentive Compatibility (Anti-gaming). This is what forces you away from subjective measures.

