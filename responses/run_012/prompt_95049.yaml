answer: |-
  ### Part I: The Edifying Tradition — What Was Wrong, What Survives

  **What the Tradition Got Wrong**
  The tradition of edifying biography and hagiography assumed that moral instruction requires moral perfection. It treated the subject as a statue to be polished, assuming that a flaw in the stone invalidates the lesson. It further assumed that the reader's task is *imitation* (be like this) rather than *calibration* (measure yourself against this). This leads to the "smoothing" you describe, where quarrels become misunderstandings. It fails because it treats the life as a rule, and as you noted, the details of a life resist any rule.

  **What Survives**
  What survives the objection is the premise that narrative shape creates moral meaning. A life is not a dataset; it is a story. The reader learns not from the subject's perfection, but from the *cost* of the subject's choices. The surviving utility is not "Here is a hero," but "Here is what it cost to be this person." The edifying element is the *clarity of the trade-off*, not the virtue of the outcome. Plutarch survives because he is interested in the *movement of the soul* under pressure, not the pressure itself.

  ***

  ### Part II: The Procedure (The "Soul-Sign Audit")

  This procedure is designed to be run twice: once in an afternoon at the outline stage (Selection), and once over a week at the final revision (Weighting). It operationalizes Plutarch's "slight thing" and "painter's analogy" into decision gates.

  **Definitions for the Procedure:**
  *   **The Contest:** Public outcomes, battles, official rulings, career milestones. (What historians record).
  *   **The Sign:** Private choices, unguarded phrases, trivial habits, reactions to small stimuli. (What the painter sees).
  *   **The Smoothing Test:** Does including this detail make the subject unrecognizable to your admiration?
  *   **The Debunking Test:** Does highlighting this detail make the subject unredeemable to the reader?

  #### Phase 1: Outline Stage (Selection)
  *Time limit: One afternoon. Goal: Determine which episodes enter the manuscript.*

  **Step 1: The Plutarch Filter**
  *   **Question:** For this proposed episode, is the primary evidence a "Contest" (battle, ruling, public event) or a "Sign" (letter, jest, habit, private reaction)?
  *   **Sufficient Answer:** "It is a Contest" or "It is a Sign."
  *   **If Contest only:** De-emphasize. Summarize in a paragraph or delegate to background. **Stop.** (Plutarch's instruction: leave great contests to others).
  *   **If Sign (or Contest revealing a Sign):** Proceed to Step 2.

  **Step 2: The Contradiction Check**
  *   **Question:** Does this "Sign" contradict the public reputation of the subject?
  *   **Sufficient Answer:** "Yes, it complicates the reputation" or "No, it aligns with the reputation."
  *   **If No:** Proceed to Step 3.
  *   **If Yes:** This is a high-risk/high-reward episode. Mark it [CRITICAL]. Proceed to Step 3.

  **Step 3: The Admiration Threshold**
  *   **Question:** If I render this episode with full fidelity to the "Sign," does my personal admiration for the subject collapse?
  *   **Sufficient Answer:** "Yes, I can no longer root for them" or "No, I still understand them."
  *   **If Yes:** **[JUDGMENT DRESSED AS PROCEDURE]**. You are asking if your emotional attachment can survive the truth.
      *   **Action:** You must draft the scene *as if* the answer were No. If, upon reading the draft, the admiration still collapses, you must cut the episode or change the book's thesis.
      *   **Hand-off:** If the subject's family/executor is alive, this decision is handed to **The Editor**. They must assess legal/reputational risk before you draft.
  *   **If No:** Proceed to Step 4.

  **Step 4: The Instruction Test**
  *   **Question:** Does this episode teach the reader something about the *cost* of the subject's life, rather than the *glory* of it?
  *   **Sufficient Answer:** "Yes, it shows a loss" or "No, it shows a triumph."
  *   **If No (Triumph):** Downgrade priority. Ensure it is not the hinge of the book.
  *   **If Yes (Loss):** This is a candidate for a hinge scene. Proceed to Phase 2.

  #### Phase 2: Revision Stage (Weighting)
  *Time limit: One week. Goal: Determine tone and placement.*

  **Step 5: The Painter's Ratio**
  *   **Question:** In the drafted scene, is the word count devoted to external mechanics (the battle, the firing, the ruling) greater than the word count devoted to internal reaction (the hesitation, the phrase, the silence)?
  *   **Sufficient Answer:** A rough count.
  *   **If External > Internal:** Rewrite. Shift focus to the "Sign."
  *   **If Internal > External:** Proceed to Step 6.

  **Step 6: The Verdict Check**
  *   **Question:** Does the narrative voice explicitly tell the reader how to judge this action?
  *   **Sufficient Answer:** "Yes, I condemn/praise them" or "No, I present the choice."
  *   **If Yes:** Delete the judgment. Let the "Sign" stand alone.
  *   **If No:** Proceed to Step 7.

  **Step 7: The Pairing Justification (Only if using Plutarch's paired structure)**
  *   **Question:** Does the second life illuminate a *moral ambiguity* in the first life, or does it simply resolve it?
  *   **Sufficient Answer:** "It complicates the first life" or "It solves the first life."
  *   **If It Solves:** **[WARNING]**. This is where the procedure misfires. Do not use a second life to fix evidence problems in the first.
  *   **If It Complicates:** The pairing is valid.

  ***

  ### Part III: Distinctions, Failures, and Hand-offs

  **Distinctions to Keep vs. Drop**
  *   **Keep:** The distinction between *Contest* (public outcome) and *Sign* (private character). This is the core Plutarchian mechanic.
  *   **Keep:** The distinction between *Instruction* (teaching a rule) and *Calibration* (measuring a cost).
  *   **Drop:** The distinction between *Fact* and *Fiction*. In biographical fiction, the "truth" is the emotional fidelity, not the archival precision. The procedure assumes you will invent dialogue to capture the "Sign."
  *   **Drop:** The distinction between *Hero* and *Villain*. The procedure assumes the subject is both.

  **Where the Procedure Will Misfire**
  1.  **Lives that Resist Verdicts:** If your subject's interest lies precisely in their unknowability (e.g., a spy, a mystic), Step 3 (Admiration Threshold) will fail. You cannot measure admiration for a mirror. In this case, the procedure will tell you to cut the ambiguity, which is wrong. *Exception:* If the "Sign" is the ambiguity itself (e.g., a lie told convincingly), proceed.
  2.  **The "Judgment Dressed as Procedure" Trap:** Step 3 asks about *your* admiration. This is subjective. You may lie to yourself to protect the book. The procedure cannot police your self-deception.
  3.  **The Executor Veto:** If the family/executor reads the manuscript (as per your constraints), they will fail Step 3 on your behalf. They will demand smoothing. The procedure has no defense against this; it merely flags the risk.

  **Who Decides?**
  *   **Artistic Truth:** You (The Author).
  *   **Market/Legal Risk:** The Editor (especially regarding living executors).
  *   **Moral Utility:** The Reader (you must surrender the verdict at Step 6).

  ***

  ### Part IV: Running the Procedure on Your Projects

  #### Project 1: The Sanatorium Director
  *   **Evidence:** 40 years letters, admiring memoir, one documented nurse dismissal on thin evidence.
  *   **Step 1 (Filter):** The dismissal is a "Contest." The *lack of correction* and the *letters surrounding it* are "Signs."
      *   *Action:* Do not dramatize the firing hearing (Contest). Dramatize the letter where she justifies it to a friend, or the silence where she should have corrected it (Sign).
  *   **Step 2 (Contradiction):** Yes, it contradicts the admiring memoir. Mark [CRITICAL].
  *   **Step 3 (Admiration):** If you render her silence fully, does admiration collapse?
      *   *Application:* If you view her as a "healer," this collapses it. If you view her as a "administrator of difficult choices," it holds.
      *   *Verdict:* **Include it.** Not as a footnote, not as the hinge, but as the *shadow* under which the admiration stands. The reader must weigh it unaided (Step 6). If you hide it, you violate the "Painter's Analogy" (you are painting the uniform, not the soul).
  *   **Risk:** The literary executor (if the junior colleague's heirs exist) may object to the memoir being undermined. **Hand-off to Editor** to assess risk of undermining the primary source.

  #### Project 2: The Magistrate Under Occupation
  *   **Evidence:** Bureaucratic file, one photo. Ambiguous record.
  *   **Step 1 (Filter):** The file is "Contest." The photo (posture, gaze) is a "Sign."
  *   **Step 7 (Pairing):** You want to pair him with a Collaborator.
      *   *Question:* Does the Collaborator illuminate ambiguity or resolve it?
      *   *Application:* If the Collaborator is "unmistakably" bad, pairing him with the Magistrate makes the Magistrate look "unmistakably" good by contrast.
      *   *Verdict:* **Warning.** The procedure warns that this pairing will do moral work the evidence cannot support. It creates a false clarity. Plutarch paired lives to show how *similar* virtues led to *different* ends, or how *different* virtues led to *similar* ends. He did not pair a saint with a sinner to prove the saint's sanctity.
      *   *Correction:* Pair him with another *ambiguous* figure, or do not pair him. Let the ambiguity stand. A life that resists a verdict is still edifying if the *cost of the ambiguity* is shown.

  #### Project 3: The Personal Acquaintance
  *   **Evidence:** Your memory. High emotional stakes.
  *   **Step 3 (Admiration):** "I expect the honest application to hand me a verdict I am not willing to render."
      *   *Application:* The procedure demands you draft the scene *as if* you are willing.
      *   *Verdict:* **Hard Answer.** If the procedure forces a verdict you are not willing to render, **you cannot write this book as biographical fiction.** You are writing a memorial, not a life. The "edifying" function requires truth. If the truth destroys the admiration required to sustain the narrative, the genre breaks.
      *   *Action:* Cut the scenes that made you want to write the book *if* they rely on smoothing. If the book relies on the smoothing, abandon the project. The procedure does not soften this. It tells you that admiration without truth is hagiography, and you have already rejected hagiography.

  ***

  ### Part V: Limitations and Non-Method Problems

  **What the Procedure Cannot Do**
  1.  **It cannot generate empathy.** It can only test for it. If you cannot find the "Sign" in a subject, the procedure will tell you to cut the episode, but it cannot help you find the humanity in a monster.
  2.  **It cannot protect you from the Executor.** If the family reads the manuscript, they operate outside the procedure. They care about reputation, not "Soul-Signs." The procedure flags the risk, but it cannot neutralize the threat of a withdrawn permission or a bad blurb.
  3.  **It cannot solve the "Rule vs. Life" paradox.** It acknowledges that a life resists a rule, but it still asks you to extract a "lesson" (Step 4). This tension remains. The procedure manages it; it does not resolve it.

  **Which Problems Are Not Methodological**
  1.  **Your Admiration:** You stated, "I choose my subjects because I admire them." This is the root cause, not the habit. The procedure forces you to test that admiration, but it does not tell you *why* you need to admire them. If you need admiration to write, you will always struggle with the "Debunking Test." This is a psychological constraint, not a methodological one.
  2.  **The Timeframe:** Four or five years per book suggests you are researching like a historian, not working like a novelist. Plutarch did not spend five years on Alexander. He read what was available and focused on the *moral interpretation*. Your timeline suggests you are seeking archival completeness (Contests) rather than character revelation (Signs). This is a workflow problem, not a structural one.
  3.  **The Fear of the Verdict:** In Project 3, you fear the verdict. This is not a problem of method. It is a problem of courage. The procedure will reveal the truth; it cannot give you the strength to publish it.

  **Final Instruction:**
  Run Phase 1 before you show the outline to your editor. If Phase 1, Step 3 flags a "Hand-off," tell your editor *then*, not after the draft. Run Phase 2 before you show the manuscript to any executor. If Phase 2, Step 6 reveals you are judging the subject, remove your voice. Let the "Sign" speak. If the "Sign" is too damaging, you must decide if you are writing a novel or a eulogy. You cannot write both.
