      *   *Nuance:* The user says "contextless line." But translation rarely happens on single sentences in a vacuum (though it can).
      *   *The Real Point:* Even if MT uses local cues, it uses them *probabilistically*, not *normatively*. It doesn't know *why* the switch happened, just that it correlates.
      *   *Correction:* Don't claim MT *can't* see local cues. Claim that MT treats social relations as *latent variables to be predicted*, not *norms to be upheld*. The error isn't missing the cue; it's the *status* of the cue (evidence vs. obligation).
