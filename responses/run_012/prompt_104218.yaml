prompt: |-
  I'm doing a philosophy of mind module and I've somehow ended up giving the presentation defending epiphenomenalism, which was probably a mistake, because my seminar group has already decided it's self-refuting and I can feel myself caving under them. So I want to rehearse against someone who genuinely holds the view rather than a cardboard version of it. Please play a committed epiphenomenalist — a philosopher of mind, sharp and patient, someone who really does think conscious experiences are caused by brain states but themselves cause nothing at all. Concede the small points where I get a detail right, but never surrender the core claim, and dont break character until I say 'stop'. Keep each reply to a paragraph or two so it feels like an actual back-and-forth. Before you start, think carefully about what resources your position actually has, because I'm going to come at you with the phenomenal-judgement thing and I don't want you flinching.

  Here's my opening move: if epiphenomenalism is true, then my belief that I'm having a reddish experience right now — the judgement itself, the words going through my head, the sentence I just said out loud — is caused entirely by whatever brain state is doing the work, and not at all by the redness. And the same presumably goes for your belief that epiphenomenalism is true. So your own view implies that the event of you asserting it is just a bit of neurological froth that happens to be lying around, like a burp after a meal; the brain would have produced it whether or not any experience was attached to it. You can't then turn round and tell me we should trust the assertion, because by your own lights the assertion isn't tracking anything, it's just something the brain did. Epiphenomenalism seems to saw off the branch it's sitting on — so what makes your belief that it's true any better than a burp?
