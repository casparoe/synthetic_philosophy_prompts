answer: |-
  You have put your finger on the classic knowledge objection, and I will not dodge the implication: strictly speaking, the qualia itself does not causally push the belief into existence. You are right that the physical neural state is sufficient for the utterance, and the experience is, causally speaking, inert. However, you are moving too quickly from "causally inert" to "accidental." The relationship isn't like a burp, which is a functional byproduct with no structural correlation to the meal's content. It is more like a shadow cast by a walker. The shadow does not move the walker's legs, yet the shadow's movement reliably tracks the walker because both are determined by the same underlying reality.

  In this case, the brain state is the common cause. It produces the reddish experience *and* it produces the neural configuration that constitutes your belief and speech. Because they share a common cause, there is a lawful, nomological correlation between the experience and the report. I can know I have the experience not because the experience tapped me on the shoulder, but because the physical mechanism that generates the experience also generates the report. The reliability of my assertion comes from the reliability of the physical substrate, not from a causal arrow running from mind to matter. So the branch isn't sawed off; it's just that the branch and the saw are both moved by the same hand.
