      *Section 1: The Position, Sharpened*
      Your view rests on a normative hierarchy and a causal mechanism. Normatively, guilt is superior because it targets acts, enabling repair and reason-based resolution, whereas shame targets the self, prompting concealment and status defense. Causally, you argue cultures indirectly choose their dominant moral emotion by engineering social practices. By altering how wrongdoing is addressed—focusing on restitution rather than character, individual apology rather than collective stain—societies can lever emotional responses. You deny that feelings are biologically fixed or that institutions merely reflect pre-existing emotional temperaments. Instead, you claim practices constitute the emotions themselves over time. The culture does not feel its way into practices; it practices its way into feelings. This makes moral psychology a domain of political and social design rather than discovered human nature.

      *Section 2: What the View Predicts That Rivals Don't*
      Your view predicts specific malleability that rivals deny. The psychologist predicts emotional temperaments constrain practices; you predict practices reshape temperaments. Therefore, you must expect that radical institutional shifts will eventually produce radical emotional shifts, even if there is a lag. If a shame-heavy society adopts guilt-oriented legal and educational systems, subsequent generations should exhibit lower shame-proneness and higher guilt-proneness, measurable via psychometric tools. Rivals predict stability or superficial compliance. You also predict that isolated practice changes without systemic support will fail; the lever requires the full load. Unlike the comparatist who sees deep cultural essences, you see contingent habits. If you are right, there are no "shame cultures" in essence, only cultures with shame-inducing practices.

      *Section 3: Defeaters, Ranked from Fatal to Merely Awkward*
      **Fatal: Biological and Temperamental Constraints.**
      For this to bite, behavioral genetics must show that shame and guilt proneness are highly heritable and stable across disparate upbringing conditions. If twin studies reveal that emotional reactivity to moral violation is largely fixed regardless of parenting style or institutional context, your lever breaks. The psychologist's claim wins here: if the hardware limits the software, practices can only modulate, not choose, the emotion. You would need to show that neuroplasticity extends to deep moral affect, not just behavioral compliance.

      **Fatal: Historical Inertia Despite Practical Overhaul.**
      This requires historical evidence of societies that fundamentally changed their moral practices without shifting their emotional profile. Consider post-revolutionary societies like Soviet Russia or Maoist China, which explicitly attempted to engineer new socialist men through altered practices. If anthropological or historical records show that underlying emotional responses to wrongdoing (honor, face, stigma) remained static despite decades of radical practical engineering, your causal claim fails. It would suggest practices sit on top of emotions, not under them.

      **Serious: The Conceptual Imperialism Objection.**
      This bites if the guilt/shame distinction itself is a Western artifact that doesn't map onto other phenomenologies. Your comparatist friend suggests this. For this to defeat you, linguistic and phenomenological analysis must show that in so-called shame cultures, the emotion experienced during wrongdoing is not "shame" as you define it (self-focused withdrawal) but something functionally identical to guilt but culturally coded differently. If the taxonomy is wrong, the choice is illusory. You are not choosing between emotions; you are choosing between Western labels for universal experiences.

      **Serious: Functional Utility of Shame.**
      This undermines your normative claim. For this to bite, evidence must show that shame produces better moral outcomes in certain contexts than guilt. If shame maintains social cohesion, hierarchy, or deterrence more effectively in high-density or kinship-based societies, then calling it "morally worse" is parochial. You argue morality demands attention to the wronged party; if shame better protects the community that sustains the wronged party, your hierarchy collapses into cultural preference.

      **Merely Awkward: The Hybrid Reality.**
      This is annoying but not fatal. It requires psychometric data showing that guilt and shame are almost always co-occurring and indistinguishable in practice. If people always feel both, the idea of choosing one over the other is a false binary. You would have to retreat to claiming cultures choose the *dominant* expression, not the emotion itself. This complicates your lever metaphor but doesn't snap it.

      **Merely Awkward: Unintended Emotional Consequences.**
      This suggests engineering guilt might produce resentment or legalism rather than moral repair. For this to bite, intervention studies would need to show that guilt-focused practices lead to emotional burnout or performative apology without internal change. This limits the efficiency of your lever but doesn't deny the mechanism exists.

      *Section 4: What Defenders Would Concede Versus Dismiss*
      Defenders of your view would concede that you cannot decree feelings by fiat. You acknowledged no ministry can mandate an emotion. They would also concede individual variation; not every child in a guilt-practice system will feel guilt. They might even admit a lag time of generations; the lever moves slowly. However, they would dismiss the strong biological determinism of the psychologist as incompatible with the observed history of social change. They would reject the idea that "culture" is a monolithic essence immune to institutional design. They would argue that while biology provides the range, practices determine the setting. They would also dismiss the claim that shame is functionally superior as a confusion of social stability with moral truth. Stability achieved through concealment is not moral success. They hold that the arrow of causation runs primarily from structure to psyche, even if feedback loops exist.

      *Section 5: Has It Been Insulated?*
      You risk insulation if you define the "practices" broadly enough to absorb any counter-evidence. If a society changes its laws but not its emotions, you might claim the *deep* practices didn't change. If the shift takes three centuries, you are safe from current falsification but lose predictive power. To avoid this, you need a threshold: what specific practice changes, over what timeframe, should yield measurable emotional shifts? Without this, the claim becomes a tautology: if emotions haven't changed, the practices weren't truly altered. That protects the theory from evidence but renders it useless for guiding action. You must specify the lag and the magnitude of practice change required to move the emotional needle, or you are merely describing a hope, not a mechanism.

      *Section 6: What Would Actually Move Me*
      You should weigh longitudinal anthropological data where institutional practices shifted demonstrably, such as restorative justice implementations in indigenous communities versus Western penal systems. If emotional outcomes track the practices across cultural lines, your view gains ground. You should also weigh neuroplasticity research regarding moral development. Conversely, you should only pretend to weigh philosophical arguments about the "nature" of shame; these are often just intuitions dressed as truths. Do not weigh anecdotal evidence of individual conversion; you are making a cultural claim. Ignore arguments that rely on the definition of morality itself; those are circular. Focus on the causal link: does the practice change precede the emotional change? If the data shows emotions shift first, or simultaneously without practice change, you must abandon the lever metaphor.

      *Section 7: Bottom Line*
      Your view is falsifiable in principle but vulnerable to insulation in practice. The normative claim (guilt > shame) is likely culturally biased, as your friend suspects. The descriptive claim (practices choose emotions) is the stronger bet, but only if you admit biological constraints. If you insist on total plasticity, you ignore the psychologist. If you admit constraints, you save the theory but weaken the "choice" aspect. It is not a defect to be unfalsifiable if you are making a normative claim, but you are making a causal one. That requires evidence. Currently, the evidence is mixed, suggesting a feedback loop rather than a one-way lever.

