          2.  **Fatal (Historical Inertia):** If practices change but emotions don't. What must be true: Post-revolution societies (e.g., China, Russia) showing no shift in emotional morphology despite massive practical overhaul.
          3.  **Serious (Conceptual Imperialism):** If the distinction doesn't exist elsewhere. What must be true: Linguistic/phenomenological analysis shows "shame" cultures don't experience the withdrawal you describe, or conflate the two.
