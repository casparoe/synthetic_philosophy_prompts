  | **Lexical Priority Threshold** | Severity Modifiers / End-of-Life Premiums | Distorted | Finite multipliers (e.g., 1.5x) allow trade-offs; lexical priority forbids them. Infinity breaks the math. | Defect of My Framework (Expressivity) | High |
  | **Asymmetry (Pain > No Pleasure)** | Baseline Utility Adjustments | No Counterpart | QALY linearity treats gains symmetrically. Cannot model "absence of pleasure is neutral." | Genuinely Open (Axiological) | High |
  | **ICER is a Category Error** | Dominance / Rule of Rescue | Distorted | Rule of Rescue is an external override; she claims the internal logic is flawed. | Defect of My Framework (Expressivity) | Medium |
  | **Lexical Priority under Uncertainty** | Probabilistic Sensitivity Analysis | No Counterpart | EUT requires trade-offs between probability and magnitude. Lexical views often paralysis under risk. | Defect of Her Claim (Operationalizability) | High |

