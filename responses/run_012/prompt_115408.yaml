  2.  **Initial Knowledge Retrieval & Fact-Checking:**

      *   *The Compact:* 1922, Santa Fe. Delph Carpenter (father of the compact idea).
      *   *Players:* 7 states, but effectively grouped into Upper (CO, WY, UT, NM) and Lower (CA, AZ, NV).
      *   *Flow Estimates:* Based on Lee Ferry data. The "natural flow" was estimated around 16-17 million acre-feet (MAF). Later revised down to ~13-14 MAF (the "Law of the River" crisis).
      *   *Allocation:* 7.5 MAF to Upper, 7.5 MAF to Lower. (Total 15 MAF allocated).
      *   *Mexico:* Not included in 1922 Compact. Added later (1944 Treaty, 1.5 MAF).
      *   *Asymmetry:* Lower Basin got priority/seniority in practice (due to faster development), Upper Basin got the "paper" water but risk of non-use if they couldn't develop.
      *   *Kalai-Smorodinsky (KS):* Focuses on monotonicity and preserving ratios of maximum possible gains. $u_1 / d_1 = u_2 / d_2$ (roughly, where $d$ is ideal-maximum). It ensures that if one player's ideal point expands, their payoff doesn't decrease.
      *   *Nash Bargaining Solution (NBS):* Maximizes the product of gains over disagreement. $(u_1 - d_1) * (u_2 - d_2)$. Sensitive to risk aversion (implicitly).

  3.  **Mapping the Game Pieces (Drafting the Model):**

      *   *Players:* Upper Basin Coalition (UB) vs. Lower Basin Coalition (LB).
      *   *Disagreement Point ($D$):* No compact. What happens? Doctrine of Prior Appropriation ("First in Time, First in Right"). LB (specifically CA) was developing faster. Without a compact, LB could divert most of the water before UB could. So $D_{LB}$ is high, $D_{UB}$ is low (potentially zero effective rights). *Crucial insight:* The Compact was actually *good* for UB compared to the likely legal outcome of no agreement.
      *   *Ideal Points ($I$):*
          *   UB: Wants enough water for future growth + protection against LB seniority. Ideally, 50% of *actual* flow + guarantee.
          *   LB: Wants security for massive irrigation (Imperial Valley) + hydro (Hoover Dam). Ideally, 100% of what they can divert, or at least enough to secure bonds.
      *   *Feasible Set:* Based on the *estimated* flow (16-17 MAF). The "pie" was believed to be larger than it was.
      *   *Actual Outcome:* 7.5 MAF each. Plus LB got the first call on surplus.

  4.  **Analyzing via Kalai-Smorodinsky (KS):**

      *   *KS Logic:* Equalize the ratio of (Actual - Disagreement) / (Ideal - Disagreement).
      *   *Application:*
          *   If LB's ideal was "All the water" and UB's ideal was "All the water," KS suggests a 50/50 split of the *gains* over the status quo.
          *   *Problem:* The status quo (Disagreement) heavily favored LB.
          *   *The "Gain":* For UB, the gain from Compact vs. No Compact is huge (getting 7.5 MAF vs. getting squeezed out). For LB, the gain is security (getting 7.5 MAF guaranteed vs. risking legal wars that might delay dams).
          *   *KS Prediction:* If ideals are symmetric (both want all water) and disagreement is asymmetric (LB favored), KS would suggest LB gets *more* than UB because LB's potential gain is smaller (they already have the advantage).
          *   *Reality:* They split 50/50 (7.5/7.5).
          *   *Conclusion:* The 50/50 split looks more like an *Equal Split of the Estimated Resource* (focal point) than a strict KS calculation based on legal disagreement points. However, if we view the "Ideal" as "Sovereign Equality of States," then 50/50 fits KS.

  5.  **Critiquing the Assumptions (The "Shaky" Parts):**

