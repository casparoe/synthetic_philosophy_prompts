      *   *Known Feasible Set:* The flow data was wrong. They negotiated over a phantom surplus. This is "Bargaining under Uncertainty," not standard Cooperative Game Theory.
      *   *Exogenous Disagreement:* The disagreement point (Prior Appropriation chaos) was actually the thing they were trying to avoid *to get federal funding*. The threat wasn't just war; it was no Hoover Dam.
      *   *Side Payments/Enforcement:* No real enforcement mechanism in 1922. It relied on the Reclamation Service and future Congress.

  6.  **Synthesizing the Argument:**

