  5.  *(Self-Correction)*: Make sure to explicitly mention the "rival view" in the conclusion as requested. The rival view is "present experiential interests or state interest." In Schiavo, the state interest was asserted but ultimately yielded to the precedent autonomy (via courts). So precedent autonomy "won," but struggled.

  6.  *Final Polish:* Check flow and transitions between the specific analytical points. Ensure the distinction between the *moral* authority and the *political* authority is clear in the institutional section. (Proceed to generate output).

