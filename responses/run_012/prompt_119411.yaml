answer: |-
  The Terri Schiavo case serves as a stress test for the precedent-autonomy view (PAV). This view holds that a competent person's prior wishes govern their later incompetent state because autonomy extends over time, preserving the authorship of a life against the state's interest in biology or the present self's potential contentment. Taking the facts of the Schiavo episode as given—that she was in a persistent vegetative state (PVS), that her husband testified to her oral wishes, and that courts ultimately upheld those wishes against family and legislative opposition—we can map the theory against the reality of the dispute.

  **The Nature of the Claim**
  What exactly is the earlier self claiming in this framework? In Schiavo, the claim was not a property right in her body; no one argued Michael Schiavo owned her tissues. Nor was it strictly a promise to herself, which implies a contractual obligation that might be voided by changed circumstances. Instead, the courts treated the claim as one of *narrative authorship*. The "clear and convincing evidence" standard applied by the Florida courts sought to reconstruct the values that gave Terri Schiavo's life its shape—specifically, a preference for independence over vegetative existence.

  The PAV needs this "authorship" interpretation to function here. If the claim were merely about avoiding suffering (an experiential interest), the PVS diagnosis would render it moot, as a vegetative patient feels no pain. If it were a property right, the legislature might have been able to eminent-domain her biological life for the state's interest. The view requires that the *integrity of the life story* outweighs the *sanctity of the biological organism*. The Schiavo case confirms this necessity: the courts did not rule based on Terri's current welfare (which was non-existent in a PVS), but on the fidelity to her past self's values. However, the theory goes quiet on *why* authorship survives the loss of consciousness. It assumes the "self" persists as a moral entity even when it ceases to exist as a psychological one.

  **The Form of Directive: Oral vs. Written**
  The dispute turned on remarks in conversation, not a living will. This reveals a critical distinction in the PAV between the *source* of authority and the *evidence* of authority. The PAV posits that the authority comes from the earlier self's autonomy. If so, the medium should not matter; an oral wish should bind as firmly as a written one.

  However, the absence of a document shifted the battle from moral authority to epistemic uncertainty. Without a signature, the "earlier self" was accessible only through the testimony of proxies (husband vs. parents). The PAV does not have an internal mechanism for resolving conflicting testimony about the prior self's voice. It assumes the prior wish is knowable. In Schiavo, the "work" a written directive would have done was not to create authority, but to bypass the evidentiary struggle that allowed the Florida legislature and Congress to intervene. The absence of a document revealed that the PAV is vulnerable not when the *right* to decide is challenged, but when the *content* of the decision is opaque. The theory assumes a transparent channel between the past self and the present decision-maker; the case showed that channel is often opaque, requiring legal adjudication that invites political interference.

  **Epistemic Distortions: Prediction vs. Adaptation**
  The PAV faces a psychological challenge: the earlier self predicts a state she has never experienced, while the later self (if conscious) might adapt to it. In Schiavo, taking the PVS diagnosis as given, the later self had no capacity for adaptation or contentment. She had no experiential interests. Therefore, the distortions do not compound; the "present self" side of the equation is zero.

  This forces the PAV to lean entirely on the earlier self's prediction. The view must accept that a competent person's hypothetical judgment ("I wouldn't want to live like that") holds authority even if it is based on a fear of a state they do not fully understand. In Schiavo, the courts accepted this. However, if the parents' contention were true—that she had some awareness—the distortion would matter. The PAV offers no guidance on how to weigh a prior "no" against a present, adapted "yes" (the disability rights critique). In this specific case, the PVS diagnosis insulated the PAV from this problem, but it highlights a gap: the theory relies on the medical accuracy of the "incompetent" diagnosis to function. If the diagnosis is contested, the PAV has no moral calculus for weighing the past self's abstract values against the present body's apparent tranquility.

  **Institutional Silence**
  The hardest question for the PAV is institutional. The Florida legislature and the U.S. Congress asserted authority to override the judicial process, prioritizing the preservation of life over the prior autonomous wish. The PAV explains why the *individual's* wish should matter, but it offers no account of why that wish should outrank a democratic body's judgment on the sanctity of life.

  This is not merely a gap; it suggests the theory was never addressed to the question the case actually raised. The PAV is a theory of medical ethics and surrogate decision-making, not a theory of constitutional law or federalism. It presupposes a liberal state that recedes when private autonomy is expressed. When the state refuses to recede—as when Congress passed "Palm Sunday Compromise" legislation to grant federal courts jurisdiction—the PAV has no resources to explain why the legislature is wrong, other than to appeal to rights the theory itself does not ground. The case showed that precedent-autonomy is politically contingent. It works only when the state permits it to work. The theory goes quiet on how to defend the earlier self against a sovereign power that decides life preservation trumps authorship.

  **Personal Identity**
  The PAV presupposes a theory of personal identity where the "person" is a continuous entity spanning time, capable of binding their future self regardless of psychological rupture. It relies on a narrative or biological continuity. If one holds instead that what matters is *psychological connectedness* (as Derek Parfit might argue), the PAV collapses. The Terri Schiavo in 2005 shared no psychological states with the Terri Schiavo of 1990. They were, effectively, different entities.

  If psychological connectedness is what matters, the earlier self has no more authority over the later body than a stranger would. The Schiavo case implicitly rejected this view; the law treated her as the same legal person. However, philosophically, this is the PAV's weakest flank. The theory requires us to believe that the *value* of autonomy survives the destruction of the *capacity* for autonomy. If identity is not what matters, the PAV is an act of necromancy, allowing a ghost to govern a body. The case did not resolve this; it merely bulldozed over it with legal precedent.

  **The Counterfactual: A Signed Directive**
  Had a signed advance directive existed, the PAV predicts the dispute would have been resolved swiftly in favor of the husband, with minimal legislative interference. The written word would have secured the epistemic link, removing the "uncertainty" that legislators exploited.

  However, the actual dispute suggests this prediction is only partially borne out. Even with documents, families often litigate, and legislatures can still intervene on public policy grounds (e.g., banning withdrawal of nutrition regardless of directives). The Schiavo case ran through courts, legislature, and Congress *because* the directive was oral, but the legislative intervention was driven by a moral opposition to the *result*, not just the evidence. A signed document might have prevented the *judicial* uncertainty, but it might not have stopped the *political* mobilization. This suggests the PAV underestimates the state's interest in life as an independent variable that can override autonomy regardless of evidentiary clarity.

  **Conclusion**
  What does the Schiavo episode show about the precedent-autonomy view? It is neither full confirmation nor total embarrassment, but rather an episode the theory never fully reached. The PAV succeeded in the courts, which validated the husband's testimony as the voice of the earlier self. In that narrow lane, the view was confirmed: the earlier self's authorship trumped the parents' desire to preserve biological life.

  However, the rival view—that the state's interest in preserving life or the present self's potential interests count—fueled the legislative and congressional intervention. That rival view did not win the final legal battle, but it demonstrated enough power to delay death for years and consume national attention. The PAV fits the *outcome* (the tube stayed out), but the rival view fits the *conflict* (the intensity of the opposition).

  Ultimately, the case reveals that the precedent-autonomy view is morally robust but politically fragile. It works when the earlier self's voice is clear and the state is passive. It goes quiet when the state becomes active, when identity is fractured, or when the evidence is oral. The Schiavo case confirms that while we may aspire to let the earlier self govern, that governance is a privilege granted by the living, not a right enforced by the dead. The rival view fits the outcome less well, but it explains the resistance better: the state and the family acted on the intuition that a living body commands a present duty that a past wish cannot fully extinguish. The PAV won the case, but the struggle revealed it lacks the theoretical armor to defend itself against a state that refuses to recognize the authority of the past self.
