          1.  *Nature of the Claim:* What is the earlier self's claim? (Autonomy, promise, property right, protecting life-shape interests?) Which is necessary?
          2.  *Form of Directive:* Case relied on conversation, not documents. What work does a written directive do? What does its absence reveal (evidence, testimony, authority)?
          3.  *Epistemic/Psychological Distortion:* Earlier self predicts unknown state vs. later self's adaptation/contentment. Do these compound or cancel? Which way should the view lean?
          4.  *Institutional Silence:* Theory doesn't address legislature/Congress intervention. Gap or misalignment?
          5.  *Personal Identity:* What theory of identity is presupposed? What if psychological connectedness matters more?
          6.  *Counterfactual:* If a signed directive existed, what would the view predict? Was that borne out?
          7.  *Conclusion:* Confirmation, embarrassment, or irrelevant? Does the rival view fit better?
      *   **Constraint:** Take facts as given. Do not summarize literature; work analysis out on *this* case. Be explicit where theory goes quiet.

  2.  **Drafting - Section by Section:**

      *   **Introduction:** Briefly set the stage (Schiavo case facts as given) and define the precedent-autonomy view. State the essay's purpose: stress-testing the theory against the specific contours of this case.

      *   **The Nature of the Claim:**
          *   *Question:* Is it autonomy, promise, property, or life-shape?
          *   *Analysis:* In Schiavo, it wasn't a contract (promise) or ownership (property). It was about *authorship*. The husband argued she valued independence over biological existence.
          *   *Necessity:* The view needs the "authorship" argument. If it's just a promise, it's breakable. If it's property, it's too crude. It must be that the *narrative arc* of the life matters more than the biological endpoint.
          *   *Case Application:* The courts accepted "clear and convincing evidence" of her *values*, not just a specific command. This supports the "life-shape" interpretation.

      *   **The Form of Directive (Oral vs. Written):**
          *   *Question:* What work does writing do? What does absence reveal?
          *   *Analysis:* Writing provides epistemic certainty. Absence shifts the battle to *evidence* and *testimony*.
          *   *Case Application:* The dispute wasn't about the *right* to decide (legally), but *what* she decided. The absence of a document turned it into a credibility contest (Husband vs. Parents). The precedent-autonomy view relies on the *truth* of the prior wish, not the *medium*. However, without writing, the "autonomy" is vulnerable to interpretation by others. The theory goes quiet on *how* to verify oral directives when proxies conflict.

      *   **Epistemic Distortions (Prediction vs. Adaptation):**
          *   *Question:* Prediction error vs. Adaptation. Compound or cancel?
          *   *Analysis:* Competent people underestimate adaptation (impact bias). Incompetent people (PVS) arguably have no experiential interests (no consciousness).
          *   *Schiavo Specific:* If she was truly PVS, she had *no* present contentment. So adaptation is irrelevant. The distortion is purely on the earlier self's prediction.
          *   *Lean:* The view must lean toward the earlier self because the later self has *no* interests to weigh if PVS is accurate. If PVS is contested (as parents claimed), then the "present interest" argument gains traction. But taking facts as given (she was PVS), the earlier self's prediction stands unchallenged by present experience.

      *   **Institutional Silence (Legislature/Congress):**
          *   *Question:* Why does earlier self outrank democratic bodies?
          *   *Analysis:* Precedent-autonomy is a moral theory, not a constitutional one. It explains *why* the wish matters, not *who* enforces it against the state.
          *   *Gap:* This is a major gap. The theory assumes a liberal state that respects private autonomy. When the state (Florida/Congress) asserts a "sanctity of life" interest, precedent-autonomy has no internal resource to fight back other than appealing to rights the theory doesn't define.
          *   *Verdict:* It shows the view was addressed to medical ethics/family disputes, not constitutional federalism.

      *   **Personal Identity:**
          *   *Question:* What identity theory is presupposed?
          *   *Analysis:* It presupposes a "narrative" or "biological" continuity where the *person* persists despite psychological break.
          *   *Challenge:* If psychological connectedness matters (Parfit), the PVS Terri is *not* the Terri who spoke years ago. The psychological link is severed.
          *   *Impact:* If connectedness matters, precedent-autonomy collapses. The earlier self has no authority over a distinct later entity. The Schiavo case implicitly rejected this; the law treated her as the same legal person. The theory needs a robust account of identity that survives psychological rupture, which is philosophically shaky.

      *   **Counterfactual (Signed Directive):**
          *   *Question:* If signed, what happens?
          *   *Analysis:* Precedent-autonomy predicts the dispute ends quickly.
          *   *Reality:* Even with documents, families fight (see other cases). But in Schiavo, the lack of a document fueled the "uncertainty" that allowed legislative intervention.
          *   *Prediction:* A signed document would have strengthened the epistemic claim, likely preventing legislative meddling. The theory predicts authority flows from the directive; the case showed authority flowed from the *court's validation* of the directive's authenticity.

      *   **Conclusion:**
          *   *Question:* Confirmation, embarrassment, or missed? Rival view fit?
          *   *Analysis:* It's an embarrassment regarding the *institutional* and *identity* aspects, but confirmation on the *moral* core (courts upheld prior wishes).
          *   *Rival View:* The "present interest/state interest" view fueled the legislature/Congress/Parents. They lost. So the rival view did not fit the *outcome*, but it explained the *conflict*.
          *   *Final Thought:* The case shows precedent-autonomy works only when the state agrees to be bound by it.

  3.  **Refining and Polishing:**

      *   *Tone:* Analytical, philosophical, rigorous.
