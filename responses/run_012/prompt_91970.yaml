answer: |-
  You have identified a structural feature of historical and interpersonal conflict that is widely recognized in theory but lacks a single, canonical name. There is no equivalent to "the security dilemma" or "the prisoner's dilemma" that serves as a universal shorthand for this specific phenomenon. Instead, what you are describing sits at the intersection of three distinct fields: the philosophy of history (causal selection), historiography (periodization and emplotment), and social psychology (attribution bias).

  Because you asked for honesty about the state of the question, I will begin by stating the consensus and the contestation directly. There is **no agreed-upon noun** for this phenomenon. Scholars generally describe it rather than name it. Where they agree is that causality in human affairs is continuous, while explanation requires discreteness. Where they disagree is on whether a "correct" starting point can ever be identified, or if all starting points are equally arbitrary.

  Below is an analysis of the closest established notions, how your observation differs from them, and where the edges of the phenomenon lie.

  ### 1. The Closest Established Notions

  #### A. Causal Selection (Philosophy of History and Science)
  In the philosophy of causation, this is known as the **Problem of Causal Selection**. Philosophers like H.L.A. Hart, A.M. Honoré, and J.L. Mackie established that any event has an infinite number of necessary conditions (the "causal field"). To explain an event, an observer must *select* one or few conditions to label "the cause."

  *   **How it fits:** It explains why two people can agree on the facts (the causal field) but disagree on the cause (the selection).
  *   **How it differs:** Standard theories of causal selection usually assume the selection is driven by *pragmatic* interests (e.g., "What can we fix?" or "What is abnormal?"). Your observation is more specific: the selection is driven by *moral* or *agential* positioning (e.g., "Which selection makes me the victim rather than the aggressor?").
  *   **Status:** There is consensus among philosophers that causal selection is context-dependent. However, positivists argue that some selections are objectively better (e.g., those with higher predictive power), while constructivists argue all selection is inherently subjective.

  #### B. Periodization and Emplotment (Historiography)
  Historians refer to the act of defining the start and end of a historical era as **Periodization**. Related to this is Hayden White's concept of **Emplotment**. White argued that historians turn chronicles of events into stories by imposing a narrative structure (tragedy, comedy, romance, satire). A story requires a beginning, but history does not. Therefore, the "beginning" is a literary choice, not a historical fact.

  *   **How it fits:** This captures your insight that the "shape of the argument" determines the verdict. Choosing 1945 vs. 1917 as the start of the Cold War changes the genre of the story from "betrayal" to "inevitability."
  *   **How it differs:** Periodization is often taught as a technical tool for clarity, not necessarily as a weapon of blame. Your observation highlights the *adversarial* use of periodization.
  *   **Status:** This is highly contested. Traditionalist historians often push back against White, arguing that while periodization is constructed, some breakpoints correspond to real ontological shifts (e.g., the drop of the bomb *did* change the world). A specialist in diplomatic history might argue that your observation conflates *narrative convenience* with *structural reality*.

  #### C. The Fundamental Attribution Error (Social Psychology)
  In psychology, the tendency to attribute one's own actions to situational factors ("I yelled because I was stressed") and others' actions to character ("He yelled because he is angry") is the **Actor-Observer Bias**. A subset of this is **Self-Serving Bias** in conflict, where parties claim credit for successes and deflect blame for failures.

  *   **How it fits:** It explains the *motivation* for shifting the starting point.
  *   **How it differs:** Psychology treats this as a cognitive defect or a heuristic error. You are describing a *rational* rhetorical strategy within a debate. Your friends and the Cold War historians are not necessarily making a cognitive error; they are making a coherent argument within a different frame. You noted that "telling someone they are just being partisan is an accusation, not an analysis." Psychology often stops at the accusation of bias.
  *   **Status:** Psychologists agree the bias exists but disagree on its pervasiveness. Some argue that in long-term conflicts, parties actually develop *accurate* but divergent models of the other's hostility, meaning the "bias" might sometimes be a rational reading of available data.

  ### 2. Is There a Name?

  Since no single term exists, historians and philosophers typically describe this as **"The Arbitrariness of the Proximate Cause"** or **"Strategic Periodization."**

  If you were to coin a term for the specific phenomenon you described—the weaponization of causal continuity to secure reactive status—the most precise label would be **"The Regress of Agency."**

  This term captures the mechanism: by pushing the starting point back (regress), a party dissolves their own agency (making themselves a product of prior circumstances) and highlights the other's agency (making the other the first mover). However, you should be aware that this is not an established term in the literature; it is a descriptive synthesis of your observation.

  In legal theory, a similar concept is discussed under **"Proximate Cause vs. Cause in Fact,"** but the law assumes a jury can ultimately draw a line. Your observation suggests that in historical or interpersonal conflict, no such jury exists, making the line permanently contestable.

  ### 3. Edges and Conditions

  You asked whether this phenomenon requires specific conditions (duration, symmetry, record). Based on the literature in causal explanation and conflict studies, here is where the edges lie:

  *   **Duration:** It does not require a long history, but it requires *continuity*. In a sudden, discrete event (e.g., a bar fight where A punches B first), the "start" is observable. Your phenomenon emerges when the "punch" is preceded by provocation, which was preceded by insult, etc. It requires a causal chain long enough to allow for multiple plausible breakpoints.
  *   **Symmetry:** It is most pronounced when parties are roughly matched in discursive power. If one party controls the archive (e.g., a victor writing history), they can enforce their starting point. The phenomenon you describe thrives in *dispute*, where neither narrative can fully suppress the other.
  *   **Written Record:** It does not strictly require a written record, but written records solidify the competing narratives. In oral cultures, the "starting point" might shift more fluidly with each telling. In history, the record locks the competing starting points into fixed positions (1917 vs. 1945), making the structural disagreement visible.
  *   **Defect vs. Feature:** This is the most contested point.
      *   **The Defect View:** Analytic philosophers and positivist historians argue this is a defect in the question "Who started it?" They would say the question presupposes a discrete cause where none exists. The solution is to stop asking "who started it" and ask "what conditions sustained it?"
      *   **The Feature View:** Narrative theorists and post-structuralists argue this is a feature of how humans make meaning. We cannot think without stories, and stories require beginnings. Therefore, the struggle over the beginning is not a bug in historical reasoning; it *is* historical reasoning.
      *   **Consensus:** There is no consensus here. A specialist in quantitative international relations would likely tell you that the "start date" is a coding variable that can be objectively determined by threshold levels of violence or diplomatic rupture. A cultural historian would tell you that such thresholds are themselves arbitrary impositions.

  ### 4. Summary of the State of the Question

  To be precise about where you stand as a researcher:

  1.  **Agreement:** Scholars across history, philosophy, and psychology agree that causal chains are continuous and that selecting a "start" is a necessary simplification for the sake of explanation.
  2.  **Disagreement:** They disagree on whether some starting points are *methodologically superior*. A Marxist historian might argue that starting with the Russian Civil War is objectively better because it centers class conflict. A Realist IR scholar might argue starting with the balance of power in 1945 is better because it centers state capability. They are not just shifting blame; they are operating from different theoretical axioms.
  3.  **The Gap:** Your specific insight—that the *primary* function of this selection in conflict is to secure the moral position of the "reactor"—is rarely theorized as a standalone concept. It is usually subsumed under "bias" or "narrative construction."

  ### Recommendation for Your Work

  If you are incorporating this into your thesis or research, do not search for a single term that does not exist. Instead, frame it as a problem of **Causal Selection in Adversarial Narratives**.

  You can cite **David Hackett Fischer's *Historians' Fallacies* (1970)**, specifically his discussion of the "Fallacy of the First Cause," though note that Fischer treats it as an error to be avoided, whereas you are analyzing it as a structural inevitability in conflict. You should also reference **Hayden White's *Metahistory* (1973)** regarding emplotment, with the caveat that many empirical historians reject White's stronger claims.

  Your contribution would be to argue that this is not merely a cognitive bias or a narrative necessity, but a **strategic maneuver** inherent to disputes over responsibility. The "verdict" of such arguments is not determined by the evidence, but by the successful imposition of a starting point that renders one's own agency passive. This is a robust analytical framework that does not require you to settle the Cold War debate to explain why the debate looks the way it does.
