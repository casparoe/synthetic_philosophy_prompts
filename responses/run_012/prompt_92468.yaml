prompt: |-
  ok so this is a weird ask. I'm a 3rd-year PhD, my thesis is on the hinge stuff in On Certainty — the river/riverbed bits, doubt having to bottom out somewhere — and I've been roped into a "philosophy in other genres" session at our grad conference. I need to actually write something for it. So: write the satire for me and I'll pretend it was mine.

  Here's what I want. An in-universe document bundle from a fictional agency — you pick the name, something in the neighborhood of a Bureau of Foundational Standards but less on the nose — that has just started requiring residents to register their hinge propositions. Don't model it on a real country or a real agency, and don't put real living people in it. Two parts:

  1. A cover memo from the agency's director to regional staff announcing the new registration requirement, roughly 180–220 words.
  2. Form HC-7 itself, roughly 600–700 words: numbered fields, fine print under each field, and at least one appendix or numbered note.

  The comedy has to come out of the philosophy, not out of "bureaucracy is absurd." Every gag should be one you could only make if you'd read the literature, and it should be fair — the director should be following the view's own logic one step too far, not inventing nonsense that has nothing to do with it. Deadpan the whole way: no winking, no "of course this can't work," he should think he's being sensible and helpful.

  Some things I specifically want it to run into, because these are real features of the position and not just gags:

  - Hinges aren't arrived at by evidence and aren't held on the strength of reasons, so the form has to ask for the grounds on which the applicant holds them, and there is genuinely nothing to write in that box.
  - Doubting a hinge doesn't just feel hard — it takes out the practice of doubting along with it. So there should be a field where a certain honest answer disqualifies the applicant, and the disqualification isn't a punishment, it's supposed to be a category error.
  - The riverbed thing: hinges do shift, historically, but not one at a time, not on purpose, and not by ordinary belief revision. So there has to be an amendment procedure that is unusable in principle, described as if it were routine.
  - The literature is split on whether hinges are propositions we're entitled to hold without evidence, or whether they aren't really propositions at all — more like a way of acting, or a stance. I want the agency to have settled this administratively in one direction, and I want the settlement to break the form: you can't register something you can't state.
  - Different people, different frameworks, no neutral ground to adjudicate between them. So: a jurisdiction problem. Hinges certified abroad, a cohabitation/spousal declaration for people whose frameworks clash, an appeals process with an obvious circularity built into it.
  - The idea that underneath all the local hinges there's one hinge everybody shares no matter what else they disagree about (I've seen it called the 'Great Hinge' somewhere, I forget by who). Give it an expedited track. Make the expedited track the funniest part.

  Keep the vocabulary plain — the philosophy should live in the logic of the rules, not in the jargon. Someone who's read On Certainty should be able to point at each joke and say which real idea it's trading on; someone who hasn't should still be able to follow it and find it funny. Don't cite anything, don't invent section numbers for On Certainty, and dont put words in any real philosopher's mouth.

  After the bundle, give me a short JSON summary so I can slot it into my notes. Use exactly these keys:

  {
    "target_of_satire": "one sentence on what position, argument, or practice is being sent up — not a person",
    "form_and_voice": "one sentence",
    "hinge_ideas_dramatized": [{"idea": "the philosophical idea, stated plainly", "where_it_shows_up": "the field, note, or clause that carries it"}],
    "insider_jokes": ["each joke that needs the literature to land, one line each"],
    "the_real_worry_left_standing": "the objection a hinge epistemologist would still have to answer after laughing",
    "what_i_left_deliberately_vague": ["places where the literature disagrees and the document fudges"]
  }

  4–6 items in the two array fields, one item each for the last two.
