answer: |-
  This is a precise diagnostic request. You are identifying a **modal slide**: the phrase "Never Again" functions as a single signifier in public discourse, but it operates as a family of distinct speech acts in argumentation. The "unearned work" you suspect is being done by speakers shifting between these modes mid-debate to claim the emotional weight of one while asserting the causal power of another.

  Here is the conceptual map disambiguating the five distinct readings of "Never Again," followed by the analysis of your two specific use-cases.

  ### The Menu: Five Readings of "Never Again"

  #### 1. The Expressive Lament
  *   **Speech Act:** Expression of grief/horror (not a claim about the future).
  *   **The "We":** Survivors, descendants, or witnesses identifying with the victim group.
  *   **The "It":** The specific historical event (e.g., Auschwitz, 1915, Slavery).
  *   **Scope/Time:** Retrospective. "I wish this had not happened."
  *   **Verdict:** **Substantive and Defensible** (as an expression of feeling), but **Irrelevant** to prevention.
  *   **Function:** Establishes moral standing and emotional gravity.

  #### 2. The Universal Imperative
  *   **Speech Act:** Moral Command / Tautology.
  *   **The "We":** Humanity / Moral Agents.
  *   **The "It":** Atrocity in the abstract (Genocide, Enslavement, Ethnic Cleansing).
  *   **Scope/Time:** Eternal, universal.
  *   **Verdict:** **Platitude.** (Everyone agrees atrocity is bad; no mechanism is proposed).
  *   **Function:** Shuts down dissent by making opposition seem immoral. "Do you want it to happen again?"

  #### 3. The Institutional Guarantee
  *   **Speech Act:** Promise / Performative Utterance by the State.
  *   **The "We":** The State / The Government / The Institution building the memorial.
  *   **The "It":** The specific *mechanisms* of the past event (e.g., state-sponsored industrial killing, legal chattel slavery).
  *   **Scope/Time:** Indefinite future, bounded by state power.
  *   **Verdict:** **Often False** (states repeat these acts) or **Unfalsifiable** (if it happens, we say the institution failed, not the promise).
  *   **Function:** Legitimizes state power and current security apparatuses.

  #### 4. The Pedagogical Hypothesis
  *   **Speech Act:** Prediction / Causal Claim.
  *   **The "We":** Educators, Curators, Memory Workers.
  *   **The "It":** The *conditions* that made the event possible (prejudice, authoritarianism, silence).
  *   **Scope/Time:** Generational. Dependent on successful transmission of memory.
  *   **Verdict:** **Substantive but Empirically Shaky.** (Claims that memory *causes* prevention. Evidence is mixed/correlational).
  *   **Function:** Justifies funding for museums, textbooks, and curricula.

  #### 5. The Constitutive Vow
  *   **Speech Act:** Identity Formation / Boundary Setting.
  *   **The "We":** The Political Community (e.g., "Post-Nazi Germany," "Post-Confederate South").
  *   **The "It":** Becoming the *kind of people* who would do this.
  *   **Scope/Time:** Continuous present. It is not about the future event, but the current identity.
  *   **Verdict:** **Substantive and Defensible.** (It successfully defines the group, regardless of future outcomes).
  *   **Function:** Creates the "We" that is allowed to speak. Distinguishes "Us" (who remember) from "Them" (who forget).

  ---

  ### Analysis of Use-Case 1: Efficacy (Does the memorial work?)

  **The Move:** A student or colleague argues that a specific memorial, apology, or textbook is *necessary* because "Never Again." They imply the memorial *prevents* recurrence.

  **Which reading supports this?**
  Only **Reading 4 (The Pedagogical Hypothesis)** and **Reading 3 (The Institutional Guarantee)** support the claim that the ritual *does work* to prevent future harm.
  *   **Reading 4** claims: Memory $\rightarrow$ Vigilance $\rightarrow$ Prevention.
  *   **Reading 3** claims: State Ritual $\rightarrow$ State Constraint $\rightarrow$ Prevention.

  **Which reading changes the subject?**
  *   **Reading 1 (Lament)** and **Reading 5 (Constitutive Vow)** change the subject. If "Never Again" means "We grieve" or "We define ourselves against this," then the question "Does this stop future violence?" is category error. The memorial "works" if it grieves well or defines identity well, even if genocide happens elsewhere tomorrow.
  *   **Reading 2 (Universal Imperative)** changes the subject by moralizing. It shifts from "Does this work?" to "Are you good?"

  **The Verdict on the Move:**
  When your interlocutor uses "Never Again" to settle the debate on efficacy, they are usually **sliding from Reading 1 or 5 (which are defensible) to Reading 4 (which is empirically contested).**
  *   They defend the *existence* of the memorial with the *Lament* (we must honor victims).
  *   They defend the *budget/policy* with the *Pedagogical Hypothesis* (this will stop racism).
  *   **Why it's unearned:** You cannot derive the causal power of Reading 4 from the moral necessity of Reading 1. A museum can be morally necessary (Lament) and causally inert (Pedagogy). The slogan conflates the two.

  ---

  ### Analysis of Use-Case 2: Comparability (Germany vs. Charleston vs. Ankara)

  **The Move:** Someone argues that because Germany says "Never Again" about the Holocaust, and Charleston says "Never Again" about Slavery, the cases are comparable (or incomparable).

  **Which reading makes them the same?**
  *   **Reading 2 (Universal Imperative):** Makes them identical. Atrocity is bad everywhere. "Never Again" is a universal moral law. Comparison is not just legitimate; it is mandatory.
  *   **Reading 5 (Constitutive Vow):** Makes them structurally analogous. Both are nations trying to define a post-atrocity identity. The *function* of the slogan is the same, even if the content differs.

  **Which reading makes them different?**
  *   **Reading 3 (Institutional Guarantee):** Makes them distinct. The German state's promise is legally and historically bound to the *Shoah*. The US promise is bound to *Slavery/Jim Crow*. The mechanisms of prevention differ (e.g., German hate speech laws vs. American free speech protections).
  *   **Reading 1 (Expressive Lament):** Makes them incommensurable. The grief of the Armenian descendant regarding 1915 is specific to that lineage. To equate it with the German *Vergangenheitsbewältigung* risks erasing the specific texture of the loss.

  **Does the slogan decide comparability?**
  No. **The chosen reading decides comparability.**
  *   If you treat "Never Again" as a **Universal Imperative**, the German and American cases are the same claim.
  *   If you treat it as a **Constitutive Vow**, they are analogous processes (different content, same political function).
  *   If you treat it as an **Institutional Guarantee**, they are distinct legal-historical contracts.

  **The Verdict on the Move:**
  When a Germanist says "You can't compare Yasukuni to the Holocaust Memorials," they are usually invoking **Reading 3** (Specific Institutional/ Historical Context). When a student says "Racism is racism, Never Again means the same thing," they are invoking **Reading 2** (Universal Imperative).
  The slogan itself does not resolve this. It is a container that holds both the claim to uniqueness (Reading 3) and the claim to universality (Reading 2). The argument is not about the slogan; it is about which reading gets to govern the comparison.

  ---

  ### Final Verdict: One Slogan or a Family?

  It is a **Family of Slogans** engaged in systematic **Modal Sliding**.

  The "unearned work" you are sensing is the result of the phrase functioning as a **Motte-and-Bailey doctrine** in memory politics.
  *   **The Motte (Defensible):** Reading 1 (Lament) and Reading 5 (Identity). No one can argue against grieving or wanting a better identity.
  *   **The Bailey (Contested):** Reading 3 (Guarantee) and Reading 4 (Pedagogy). These make claims about causality, state capacity, and historical repetition that are empirically fragile.

  **How the switching works in your seminar:**
  1.  **Challenge:** "Does this statue actually reduce racism?" (Questioning Reading 4).
  2.  **Defense:** "Never Again!" (Shifts to Reading 1: "Are you saying we shouldn't grieve?").
  3.  **Challenge:** "Is this case like the Holocaust?" (Questioning Comparability).
  4.  **Defense:** "Never Again applies to everyone." (Shifts to Reading 2: Universalism).
  5.  **Challenge:** "But the mechanisms are different."
  6.  **Defense:** "Never Again means we must stop state murder." (Shifts to Reading 3: Specificity).

  **Why this matters for your teaching:**
  You can stop the slide by forcing the specification. When a student says "Never Again," ask:
  1.  "Is that a wish, a promise, or a prediction?"
  2.  "If it's a prediction, what is the causal mechanism by which this museum stops that violence?"
  3.  "If it's a promise, who is bound by it, and what counts as breaking it?"

  If they cannot specify the reading, they are using the slogan to borrow the authority of a Promise while only committing to a Wish. That is the conceptual error you are looking for.
