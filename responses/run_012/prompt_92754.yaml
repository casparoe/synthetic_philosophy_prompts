answer: |-
  # The Mechanism Identity Protocol (MIP)

  **Purpose:** Decide whether two reported anomalies share a single mechanism (Merge) or distinct mechanisms (Split).
  **Timebox:** 30 minutes per pair.
  **Burden of Proof:** On **Merge**. If evidence is ambiguous, default to Split. A wrong merge contaminates downstream generalizations; a wrong split only costs engineering time.

  ---

  ## 1. The Criterion: Causal Identity

  Two anomalies share a mechanism **if and only if**:
  1.  **Level Lock:** You have fixed the level of description (Weights, Features, or Computational Role) *before* testing.
  2.  **Single Locus:** There exists one specific difference-making variable at that level (e.g., *Head 7.3's OV projection*, *Feature 492's activation*, *Layer 15's residual*) that is necessary for *both* anomalies.
  3.  **No Divergence:** Intervening on that locus affects both anomalies in a way that implies a shared downstream path, not just a shared bottleneck.

  **Failure Condition:** If you must change the level of description to make them match (e.g., "They use different heads but both do 'copying'"), they are **Different Mechanisms** (Same *Kind*, Different *Circuit*).

  ---

  ## 2. The Procedure (30 Minutes)

  ### Step 1: Lock the Level (5 mins)
  *Ask:* "What claim do we want to make downstream?"
  *   **Weights/Circuit:** We claim a specific physical subgraph causes this. (Strictest)
  *   **Features/SAE:** We claim a semantic concept is driving this. (Medium)
  *   **Computation/Functional:** We claim the model is performing a specific algorithm. (Loosest)

  *Action:* Write the chosen level on the ticket. **You cannot change this level in Step 2.**
  *Stop Condition:* If the team cannot agree on the level, hand to Team Lead. (This is a policy choice, not an engineering fact).

  ### Step 2: Causal Overlap Test (15 mins)
  *Tools:* Activation Patching, Feature Attribution, Logit Lens.
  *Goal:* Find the *minimal* intervention that fixes/breaks both.

  1.  **Patch Test:** Take the hidden state (or feature activation) from a "clean" run where Anomaly A does not occur. Patch it into the "dirty" run of Anomaly B at the suspected locus.
  2.  **Observation:**
      *   Does the patch fix Anomaly B?
      *   Does the *same* patch (same layer/head/feature index) fix Anomaly A?
  3.  **Sufficient Answer:**
      *   **Yes:** Proceed to Step 3.
      *   **No (Distinct Loci):** **VERDICT: SPLIT.** (Different hardware = different mechanism).
      *   **No (Broad Loci):** If the only match is "Layer 10" (too broad) but heads differ, **VERDICT: SPLIT.** (Same block ≠ same mechanism).

  ### Step 3: Divergence Check (5 mins)
  *Goal:* Ensure the path doesn't split immediately after the locus.
  *Action:* Look at the Logit Lens or downstream attributions after the intervention point.
  *   **Question:** Does the signal flow into the same subsequent components to produce the output?
  *   **Sufficient Answer:**
      *   If Anomaly A routes through Head X and Anomaly B routes through Head Y after the shared locus, **VERDICT: SPLIT.** (Shared bottleneck ≠ shared mechanism).
      *   If the signal path is identical post-intervention, **VERDICT: MERGE.**

  ### Step 4: The Burden Check (5 mins)
  *Rule:* If you had to use "hand-wavy" semantic reasoning to connect the dots in Step 2 or 3, you failed the Burden of Proof.
  *   **Ambiguous?** **VERDICT: SPLIT.**
  *   **Clear Causal Chain?** **VERDICT: MERGE.**

  ---

  ## 3. Verdict Template (Paste into Ticket)

  ```text
  MECHANISM TRIAGE VERDICT: [MERGE / SPLIT / ESCALATE]
  LEVEL LOCKED: [Weights / Features / Computation]
  CAUSAL LOCUS: [e.g., Feature 1024 @ Layer 12 / Head 5.3]
  DIVERGENCE CHECK: [Passed / Failed / N/A]
  RATIONALE: [One sentence: "Intervention on X fixed both without path divergence" OR "Loci distinct at locked level."]
  ```

  ---

  ## 4. Procedure Run-Through

  ### Pair (a): Two Unrelated Prompts → Wrong Date
  *   **Context:** Prompt 1 ("Who was president in 1800?") → Wrong Date. Prompt 2 ("Date of eclipse?") → Wrong Date.
  *   **Step 1 (Level):** Weights/Circuit. (Claim: "The Date Bug Circuit").
  *   **Step 2 (Overlap):** Patching shows Layer 15 is necessary for both. However, Head 15.2 is critical for Prompt 1, Head 15.7 for Prompt 2.
  *   **Step 3 (Divergence):** Paths diverge immediately after Layer 15.
  *   **Verdict:** **SPLIT.**
  *   **Cost:** We cannot claim "Layer 15 is the Date Module." We lose a neat generalization.
  *   **Benefit:** We avoid publishing a false circuit that fails on Prompt 3.

  ### Pair (b): Refusal Flip & Sentiment Flip
  *   **Context:** Same prefix. Anomaly 1: Model refuses harmless query. Anomaly 2: Model outputs negative sentiment on neutral query.
  *   **Step 1 (Level):** Features/SAE. (Claim: "A single concept triggers both").
  *   **Step 2 (Overlap):** Feature 892 fires highly in both. Zeroing Feature 892 restores helpfulness in Anomaly 1 and neutrality in Anomaly 2.
  *   **Step 3 (Divergence):** Logit lens shows Feature 892 pushes logits in the same direction (negative/refusal space) for both.
  *   **Verdict:** **MERGE.**
  *   **Cost:** Risk of polysemy. Feature 892 might be "Negativity" which causes refusal *and* sentiment, but they are technically distinct behaviors.
  *   **Benefit:** High leverage. Fixing Feature 892 fixes two safety/alignment issues at once.

  ### Pair (c): The "Induction Circuit" (Previously Merged)
  *   **Context:** Anomaly 1: Token repetition (A B A → B). Anomaly 2: Semantic repetition (Paris France Paris → ?). Previously written up as "The Induction Circuit."
  *   **Step 1 (Level):** Weights/Circuit. (Claim: "Induction Heads implement general retrieval").
  *   **Step 2 (Overlap):** Patching Anomaly 1 relies on QK-signal in Head 6.1. Patching Anomaly 2 relies on OV-signal in Head 6.1.
  *   **Step 3 (Divergence):** While the Head is the same, the *mechanism* inside the head differs (QK vs OV). At the "Weights" level, these are different parameters.
  *   **Verdict:** **SPLIT.**
  *   **Cost:** **High.** You must retract or qualify the "Induction Circuit" paper. The narrative that "one circuit explains induction" is broken. Engineering time spent unifying them is wasted.
  *   **Benefit:** Prevents the false claim that "fixing QK fixes semantic induction." Saves future researchers from chasing a ghost.

  ---

  ## 5. What This Procedure Cannot Settle

  This protocol is a filter, not a truth machine. It will leave residual disagreements. Here is how to route them:

  ### 1. The "Level of Description" Disagreement (Team Lead Call)
  *   **The Conflict:** Engineer A locks "Weights" (Verdict: Split). Engineer B locks "Computation" (Verdict: Merge).
  *   **Why MIP Fails:** MIP requires the level to be fixed *in advance*. It cannot tell you which level is *useful*.
  *   **Resolution:** This is a scientific strategy question, not an empirical one. The **Team Lead** decides based on the downstream claim. If we want to prune weights, use "Weights." If we want to explain behavior to users, use "Computation."

  ### 2. The "Polysemy" Disagreement (Residual Network Ambiguity)
  *   **The Conflict:** A single feature fixes both anomalies, but we suspect the feature is doing two different things (polysemous) that just happen to overlap here.
  *   **Why MIP Fails:** MIP treats the feature as the atomic variable. It cannot see *inside* the feature without training runs (forbidden by constraint).
  *   **Resolution:** Default to **Split** (Burden of Proof). Mark the feature as "Suspected Polysemous." Do not claim a unified mechanism until you can disentangle the feature.

  ### 3. The "Satisfying Explanation" Disagreement (Philosophical)
  *   **The Conflict:** The causal chain is identical, but one engineer feels the explanation is "too shallow" (e.g., "Head 5.3 did it") and wants a deeper reason *why* Head 5.3 did it.
  *   **Why MIP Fails:** MIP settles *identity*, not *satisfaction*.
  *   **Resolution:** Out of scope for triage. Merge the anomalies, but flag the explanation as "Provisional."

  ### Summary for the Rotating Engineer
  *   **Your Job:** Find the causal locus. If it's not the exact same variable at the locked level, **Split**.
  *   **Not Your Job:** Decide if the split is "interesting" or if the level is "deep."
  *   **When Stuck:** If the argument is about "what counts as an explanation," stop the timer and **Escalate**.
