answer: |-
  **Starting Point**
  Both characters agree the colony's behavior is vastly more sophisticated than any single ant's, and nobody is in charge. The dispute is not about the mechanics of emergence, but about what ontological status this organization grants the whole.

  **The Branch Questions**

  1.  **The Interpreter (Case d):** A colony is being steered in real time by a bored technician with a joystick whose presence is hidden. Whose mind is that, exactly?
      *   *The Technician's:* The colony is merely an output device; mind requires an internal agent. (Commits you to: Mind is intrinsic to agency.)
      *   *The Colony's:* The colony processes the input as its own; the source of the signal doesn't negate the processing. (Commits you to: Mind is defined by functional role, not origin.)

  2.  **The Boundary (Case b):** Two colonies whose pheromone fields get bridged by a fallen branch, after which they behave like a single colony. Is this one mind or two?
      *   *Two:* The physical discontinuity of the nests matters; the mind stops at the nest wall. (Commits you to: Mind is bounded by biological substrate.)
      *   *One:* The behavior is unified; the medium connects the computation. (Commits you to: Mind is defined by causal integration, not skin.)

  3.  **The Substitution (Cases a & c):** A colony where every ant is swapped for identical mechanical ones (a), or where simple local rules fully explain everything (c). Is the mind preserved?
      *   *No:* The biological life or specific material matters; rules alone aren't enough. (Commits you to: Biological essentialism or non-functionalism.)
      *   *Yes:* If the organization holds, the substrate doesn't matter. (Commits you to: Functionalism; mind is software, not hardware.)

  4.  **The Interests (Case e):** A colony kept going for forty years, so that every ant in it has been replaced many times over. Are the colony's interests anything over and above the summed interests of ants?
      *   *Summed:* The colony survives only because the ants do; no separate goal exists. (Commits you to: Methodological individualism.)
      *   *Over and Above:* The colony persists while ants die; it has a distinct telos. (Commits you to: Collective realism.)

  **The Leaves**

  **Instrumentalism**
  *Path:* Interpreter (Technician) + Any other answers.
  *Position:* Colony talk is just useful predictive shorthand with nothing it's like to be a colony.
  *Awkward Commitment:* You must deny that the colony 'suffers' even when burning, because only the interpreter feels the loss of utility.

  **Functionalism**
  *Path:* Interpreter (Colony) + Substitution (Yes) + Boundary (Two).
  *Position:* The colony realizes the right kind of organization and therefore really does have a mind.
  *Awkward Commitment:* A spreadsheet organized like a colony could be conscious; biology is irrelevant.

  **Extended Mind**
  *Path:* Interpreter (Colony) + Boundary (One) + Substitution (Yes).
  *Position:* The mind is spread across ants and environment, so 'the colony' is the wrong boundary to draw.
  *Awkward Commitment:* Cutting the pheromone trails lobotomizes the subject; the nest is literal brain tissue.

  **Collective Subject**
  *Path:* Interpreter (Colony) + Interests (Over and Above).
  *Position:* There's a genuine collective subject with its own goals, not reducible to ant goals.
  *Awkward Commitment:* You must accept that the colony can be 'wrong' about what benefits the individual ants.

  **Indeterminacy**
  *Path:* Mixed answers (e.g., Colony Mind + Summed Interests).
  *Position:* There's no fact of the matter, or it's a matter of degree all the way down.
  *Awkward Commitment:* You cannot say definitively when pest control becomes murder; it's a sliding scale.

  **Moral Patient**
  *Path:* Collective Subject + Functionalism.
  *Position:* The colony turns out to be a proper subject of moral concern.
  *Awkward Commitment:* Exterminating a nest is morally equivalent to killing a single sentient animal; pesticide is poison gas.

  **Ethical Separation**
  *Path:* Functionalism + Interests (Summed).
  *Position:* The mind question gets settled but the ethics is said to come apart from it entirely.
  *Awkward Commitment:* You can acknowledge the colony has a mind while denying it has rights; consciousness does not guarantee moral standing.

  **Unoccupied Combinations**
  *Biological Functionalism:* Interpreter (Colony) + Substitution (No). This view holds the mind is real but vanishes if ants are replaced by machines. It is rarely held because it implies magic resides in organic matter specifically, making it scientifically unattractive.
  *The Ghost in the Machine:* Interpreter (Technician) + Interests (Over and Above). This suggests the colony has goals but no mind unless watched. It is incoherent; goals imply agency, which implies mind.

  **Pairs This Tree Can't Separate**
  *Functionalism vs. Extended Mind:* If the environment is causally integrated (Branch 2), Functionalism often collapses into Extended Mind. The tree distinguishes them by boundary, but in practice, a functionalist often accepts the branch as part of the mind.
  *Instrumentalism vs. Indeterminacy:* Both lead to hesitation on ethics. The tree separates them by ontology (nothing there vs. unclear what's there), but for a writer depicting action, the hesitation looks identical.
