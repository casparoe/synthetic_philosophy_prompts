  # The Taxonomy of Inherited Burden

  **Level 1: The Existence of a Demand**
  **Question:** Do the crimes of the past impose any normative demand on your present life?
  *   **Branch A: No.** (The past is closed.)
  *   **Branch B: Yes.** (The past is open.)

  ---

  ### Branch A: No Demand
  **Level 2: The Grounds for Dismissal**
  **Question:** Why does the past not bind you?
  *   **Branch A1:** Because individuals are morally isolated units.
      *   **Leaf 1: Moral Individualism.**
          *   *Awkward Commitment:* You must accept that systemic advantages gained through atrocity are morally irrelevant to the holder.
  *   **Branch A2:** Because the political entity that acted no longer exists.
      *   **Leaf 2: State Discontinuity.**
          *   *Awkward Commitment:* You must argue that the current nation is a legal fiction unrelated to the culture that sustained the past regime.

  ---

  ### Branch B: Yes, There Is a Demand
  **Level 2: The Source of the Link**
  **Question:** Is this demand grounded primarily in *assets you hold* or *the person you are*?
  *   **Branch B1:** Assets (Property, Wealth, Status).
  *   **Branch B2:** Person (Identity, Citizenship, Lineage).

  ---

  ### Branch B1: Assets
  **Level 3: The Nature of the Asset**
  **Question:** Is the benefit material (land, money) or social (status, safety, privilege)?
  *   **Branch B1a:** Material.
      *   **Level 4: The Possibility of Return**
      *   **Question:** If you surrendered the asset, would the demand end?
          *   **Branch B1a-i:** Yes.
              *   **Leaf 3: Restitutionism.**
                  *   *Awkward Commitment:* You must accept that atrocity can be balanced like a financial ledger.
                  *   *(Test Case: The Renouncer)*
          *   **Branch B1a-ii:** No.
              *   **Leaf 4: Contagion Theory.**
                  *   *Awkward Commitment:* You must accept that innocence is impossible once a bloodline or holding is tainted.
  *   **Branch B1b:** Social.
      *   **Leaf 5: Privilege Acknowledgement.**
          *   *Awkward Commitment:* You must accept that invisible social air is a taxable asset that cannot be returned, only acknowledged.

  ---

  ### Branch B2: Person
  **Level 3: The Volition of Connection**
  **Question:** Did you choose your connection to the perpetrators?
  *   **Branch B2a:** Yes (Faith, Naturalization, Voluntary Association).
      *   **Level 4: The Direction of Identification**
      *   **Question:** Do you identify with the harmed or the harmer?
          *   **Branch B2a-i:** The Harmer (Seeking to atone for the group).
              *   **Leaf 6: Voluntary Penance.**
                  *   *Awkward Commitment:* You must accept that guilt can be adopted like a garment without trivializing the victim's pain.
                  *   *(Test Case: The Convert Great-Granddaughter)*
          *   **Branch B2a-ii:** The Harmed (Seeking solidarity).
              *   **Leaf 7: Adopted Witness.**
                  *   *Awkward Commitment:* You must accept that solidarity risks appropriating a suffering that is not yours to claim.
  *   **Branch B2b:** No (Birth, Citizenship, Lineage).
      *   **Level 4: The Mode of Response**
      *   **Question:** Is the demand primarily to *feel* something or *do* something?
          *   **Branch B2b-i:** Feel (Internal State).
              *   **Level 5: The Affective Quality**
              *   **Question:** Is the emotion blame for the act or a stain on the name?
                  *   **Branch B2b-i-A:** Blame (I am responsible for the deed).
                      *   **Leaf 8: Inherited Guilt.**
                          *   *Awkward Commitment:* You must accept blame for acts you physically could not prevent.
                  *   **Branch B2b-i-B:** Stain (I am diminished by the deed).
                      *   **Leaf 9: Honor-Based Shame.**
                          *   *Awkward Commitment:* You must accept that your worth is tied to ancestors you never knew.
                          *   *(Test Case: The Exile with the Photograph)*
          *   **Branch B2b-ii:** Do (External Action).
              *   **Level 5: The Role in the State**
              *   **Question:** Are you acting as an official or a subject?
                  *   **Branch B2b-ii-A:** Official (Administering the state).
                      *   **Leaf 10: Institutional Stewardship.**
                          *   *Awkward Commitment:* You must accept that serving the state means wearing its past sins as part of the uniform.
                          *   *(Test Case: The Ministry Grandson)*
                  *   **Branch B2b-ii-B:** Subject (Paying taxes/Voting).
                      *   **Level 6: The Binding Factor**
                      *   **Question:** Does your physical residence in the country matter?
                          *   **Branch B2b-ii-B1:** Yes (Territory binds).
                              *   **Leaf 11: Resident Liability.**
                                  *   *Awkward Commitment:* You must accept that staying implies consent to history, while leaving implies escape.
                                  *   *(Test Case: The Town)*
                          *   **Branch B2b-ii-B2:** No (Blood/Citizenship binds).
                              *   **Leaf 12: Diaspora Obligation.**
                                  *   *Awkward Commitment:* You must accept that blood binds tighter than borders, obligating you without protecting you.
                                  *   *(Test Case: The Diaspora Apologizer)*

  ---

  ### Unoccupied or Collapsed Spaces

  **1. The Incoherent Combination:** *Chosen Connection + Inherited Guilt.*
  If you voluntarily join a group, you may take on responsibility, but you cannot logically claim *inherited* guilt, as inheritance implies non-volition. This space is occupied by **Voluntary Penance** instead.

  **2. The Unattractive Combination:** *State Discontinuity + Asset Retention.*
  A position that claims the state is dead (Leaf 2) but keeps the state's stolen property (Branch B1) is logically unstable. It usually collapses into **Moral Individualism** (Leaf 1) to justify keeping the assets.

  **3. The Unexplored Space:** *Social Asset + Contagion.*
  There is no robust name for the position where one feels tainted by *social* privilege (safety, status) that cannot be returned. It is usually subsumed under **Privilege Acknowledgement** (Leaf 5) or **Contagion Theory** (Leaf 4).

  **4. Indistinguishable Positions:** *Resident Liability vs. Diaspora Obligation.*
  In practice, these two often demand the same financial reparations. They are separated here only by the *justification* (territory vs. blood), not the *outcome*. If a character cannot articulate why they pay, they occupy both leaves simultaneously.

  ---

  ### Calibration Key (Test Cases)

  *   **The Farmer:** Enters at **Level 3 (Material Asset)**. If he believes selling the land frees him, he is **Restitutionism**. If he keeps it believing it is rightfully his now, he has slid to **Moral Individualism**.
  *   **The Renouncer:** Enters at **Level 4 (Possibility of Return)**. He answers "Yes," landing on **Restitutionism**.
  *   **The Exile (Photograph):** Enters at **Level 5 (Affective Quality)**. She feels the stain but performs no action, landing on **Honor-Based Shame**.
  *   **The Town:** Enters at **Level 6 (Binding Factor)**. The budget is territorial, landing on **Resident Liability**.
  *   **The Convert:** Enters at **Level 4 (Direction of Identification)**. She chooses the harmer's side to atone, landing on **Voluntary Penance**.
  *   **The Ministry Grandson:** Enters at **Level 5 (Role in the State)**. He is an administrator, landing on **Institutional Stewardship**.
  *   **The Diaspora Apologizer:** Enters at **Level 6 (Binding Factor)**. She acts without residence, landing on **Diaspora Obligation**.
