      *   *Distortions (Laws vs. Trends):* The user suspects this flattens to "robustness to intervention." I need to confirm this. In forecasting, a "law" is a causal mechanism that holds across distributions. A "trend" is a statistical artifact of a specific distribution. Popper sees this as ontological; the engineer sees it as generalization error. *Verdict:* Clarification, not loss. It removes the metaphysical baggage.
      *   *No Counterpart:*
          1.  *Holism:* Engineers define boundaries for tractability. Popper says the *concept* is flawed. The engineer says "I know it's incomplete, but is it useful?" Popper says "It's dangerous."
          2.  *The Ought:* The jump from "prediction fails" to "do piecemeal reform." This is the Is-Ought problem. Forecasting optimizes a loss function; it doesn't choose the loss function.

  5.  **Interpreting the Residue (Section 3):**
