answer: |-
  Answerability attaches solely to the agent who finalized the system's risk constraints without a proportionate, realized justification, while strict liability falls to the beneficiary entity when no individual holds that authority.

  This principle rests on three clauses. The first clause isolates **authority over the risk architecture**, distinguishing those who set the rules from those who operate within them. This captures why the operator in Case 1, the engineer in Case 3, and the analyst in Case 6 are not answerable: they lacked the power to alter the constraints that produced the harm. Conversely, it identifies the officer in Case 2, the interface designer in Case 7, and the architect in Case 8 as answerable because they possessed the specific authority to define the operational envelope or the structural conditions under which the harm became possible.

  The second clause introduces **justified necessity**, requiring that the residual risk be outweighed by a realized benefit unavailable otherwise. This explains the divergence between Case 4 and Case 5. The trading firm in Case 4 is answerable because the risk yielded no proportionate social benefit to offset the market crash, whereas the hospital in Case 5 is exculpated because the bias was the necessary cost of a net saving of lives that could not be achieved by the alternative protocol. Without this clause, the principle would wrongly condemn the hospital leads who acted on utilitarian grounds.

  The third clause assigns **entity-level strict liability** where individual answerability fails due to fragmented authority or systemic opacity. This resolves your uncertainty in Case 3: the engineer is not answerable because she lacked authority, but the manufacturer owes compensation because it is the beneficiary entity bearing the strict liability for the system's deployment. This clause also solves your unsettled case: when a learning system evolves beyond any individual's comprehension, no single person holds authority over the specific outcome, so the firm bears strict liability; however, the individual who authorized the *deployment of the opaque learning mechanism* remains answerable for imposing that epistemic risk without catastrophic necessity.

  For a case not listed, consider a medical device firm that releases a diagnostic AI known to fail silently in 1% of cases because fixing it would delay launch by a year. Under this principle, the Product Lead who signed the release is answerable for subsequent deaths, as they held authority over the constraint (release timing) and lacked a proportionate justification (profit delay does not outweigh patient safety).

  I can keep all eight of your verdicts, but I must price a tension in the unsettled case. Your description states that at every earlier point, everyone did what a "reasonable person" would have done. My principle overrides the "reasonable person" defense when the risk architecture itself permits unknowable harm. To hold the deployer answerable in the unsettled case, I must commit to the view that deploying a system whose behavior cannot be understood is inherently unjustified if harm materializes, regardless of prior industry standards. This sacrifices the comfort of procedural compliance to ensure that someone remains answerable for structural ignorance.
