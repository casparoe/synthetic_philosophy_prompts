          *   Accept verificationism is flawed.
      *   **What the Episode Shows About Fitch:**
          *   It's not just a gotcha for positivists. It targets *any* antirealist who claims truth is epistemically constrained.
          *   It's not a "cartoon" embarrassment; it forces a refinement. You can't have weak antirealism (truths are knowable) without sliding into strong antirealism (truths are known) unless you reject classical logic or the factivity of knowledge.
      *   **Where the Theory Goes Silent:**
          *   Fitch targets *unknown truths*. Positivists cared about *meaningful sentences*.
          *   If a sentence is meaningless (unverifiable), it's not a "truth" in the positivist sense. So, they might escape by saying unverified truths aren't truths at all.
          *   But this makes their ontology too thin to handle scientific realism (laws of nature, past events).
      *   **Conclusion:** Summarize. Fitch is the logical autopsy, not the murder weapon.

