  8.  **Drafting - Iteration 1 (Mental Check):**
      *   Make sure the distinction between personal resentment and vicarious indignation is clear in the policy bans.
      *   Ensure the "Objective" clarification is sharp.
      *   The form should look bureaucratic.

  9.  **Drafting - Iteration 2 (Writing):**
      *   Start with the header.
      *   Section 1: Policy Statement.
