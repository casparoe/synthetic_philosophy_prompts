prompt: |-
  I'm a second-year PhD student working on reference and mental content, and I've spent the last month trying to build one clean thought experiment for a chapter on two-dimensional semantics, and I keep either reinventing Twin Earth or producing something my officemate says just smuggles in descriptivism by the back door. So I'm outsourcing the construction to you, with a tight spec, because I need it to actually do work rather than be a vibe.

  Background so we're on the same page: I'm working with the standard two-dimensional picture, where a term gets a primary (epistemic) intension — a function from centered worlds, i.e. ways the actual world might have turned out to be, to extensions — and a secondary (metaphysical) intension, a function from possible worlds to extensions once the actual world is held fixed. The whole apeal of the framework is that it's supposed to let a sentence come out a priori on one reading and a posteriori on the other while the term still picks out exactly one thing in the actual world. What I want is a case that seperates a two-dimensionalist from a plain one-dimensional possible-worlds semantics on exactly that point, without the two of them disagreeing about the referent.

  Build me the case to all of these constraints at once: (i) a single term, in a single small community, with a concrete story about how the term got introduced and used; (ii) the 2D theorist and the 1D theorist agree on the actual referent — the fight is only over what proposition the identity sentence [term] = [the thing that plays the relevant role] expresses, with the 2D theorist giving it an epistemic reading that's knowable a priori and a metaphysical reading that's knowable only a posteriori, and the 1D theorist recognizing only the a posteriori content; (iii) no water or H2O, no Twin Earth, no Hesperus/Phosphorus, no standard meter — I need a fresh case, and I'd rather it be an ordinary human practice (naming a festival, a tool, a place, an illness, a person) than a sci-fi substance; (iv) fully graspable from the description alone, no exotic physics and no stipulations the reader can't verify; (v) hold everything else fixed — the only thing that should vary between the two theories' verdicts is which intension you read the sentence through. Then, in prose, walk me through it: state the term and its introduction, give the primary and secondary intensions, state the identity sentence, and show why each theory lands where it does. After that, tell me which single feature of the case is really doing the work, what happens to the whole thing if I remove or soften that feature (does it collapse back into a boring a posteriori necessity?), and — the part I actually need — how a defender of the one-dimensionalist view would try to defuse it: what they'd say the so-called primary intension is really tracking, and whether they can redescribe the whole thing as a straightforward a posteriori necessity. Be honest if the spec can't be met without a descriptivist assumption, and if the primary content comes out necessary rather than contingent under the standard framework, flag that rather than fudging it.

  After the prose, give me a compact JSON summary with fields: term, introduction_story, primary_intension, secondary_intension, identity_sentence, two_dimensionalist_verdict, one_dimensionalist_verdict, load_bearing_feature, what_breaks_if_removed, defender_reply, needs_descriptivism (boolean), primary_content_is_contingent (boolean), notes. Keep the prose under about 700 words.
