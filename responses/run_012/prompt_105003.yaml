answer: |-
  **Case: The Archivist's Opener**

  **Term and Introduction**
  A small guild of archivists encounters a locked legacy box with no known key. To facilitate discussion, the lead archivist stipulates: "Let 'The Opener' refer to whatever object successfully unlocks this box." They test various tools. Eventually, a specific bent nail succeeds. The term enters regular usage to refer to that nail.

  **Intensions and Identity**
  *   **Primary Intension (PI):** A function from centered epistemic scenarios to extensions: "The object that unlocks the box in this scenario."
  *   **Secondary Intension (SI):** A function from metaphysical possible worlds (given actuality) to extensions: "This specific bent nail."
  *   **Identity Sentence:** "The Opener is this bent nail."

  **Theoretical Verdicts**
  The **Two-Dimensionalist** argues the identity sentence expresses two distinct propositions. Via the PI, it expresses a contingent truth knowable a priori (by understanding the stipulation, one knows *The Opener* unlocks the box, but not *which* object does). Via the SI, it expresses a necessary truth knowable only a posteriori (once we know the nail is the actual opener, it is the opener in all worlds).
  The **One-Dimensionalist** argues "The Opener" is a rigid designator for the nail. The description ("whatever unlocks...") merely fixed the reference; it is not part of the term's meaning. Consequently, the identity expresses only one proposition: a necessary a posteriori truth. The apparent "a priori" status is merely knowledge of linguistic stipulation, not a distinct epistemic intension.

  **Analysis**
  The **load-bearing feature** is the semantic status of the reference-fixing description. For the 2Dist, it constitutes the primary meaning; for the 1Dist, it is merely epistemic access.
  **What breaks if removed:** If the description is treated purely as causal-historical access (softening the stipulation), the PI collapses into the SI. The case becomes a boring necessary a posteriori identity, failing to generate the distinct epistemic reading required for 2D semantics.
  **Defender Reply:** The 1D defender defuses the case by arguing the so-called primary intension tracks only the *reference-fixing description*, which is metalinguistic. They claim the 2Dist conflates knowing how a word was defined with knowing a substantive modal fact about the world. They redescribe the whole thing as a straightforward a posteriori necessity where the "a priori" element is trivial linguistic knowledge.

  **Honesty Check**
  This case structurally resembles the banned "Standard Meter" case (stipulative reference-fixing). It cannot be constructed without a **descriptivist assumption** regarding the term's introduction. A hardline causal theorist will deny the PI exists as semantic content rather than heuristic. The primary content is contingent (another object could have unlocked the box), but only because the term was introduced descriptively.

