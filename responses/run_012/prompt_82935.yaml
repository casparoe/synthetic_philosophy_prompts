  *(Refining the HI argument)*: The Hedonistic Imperative (David Pearce etc.) argues for *gradients of bliss*. They acknowledge that without contrast, bliss is meaningless, so they propose engineering *informational gradients* of pleasure. Does *Clockwork Orange* refute this? Yes, because Burgess argues the gradient must include the *possibility* of moral failure, not just sensory variation. I should mention this distinction.

