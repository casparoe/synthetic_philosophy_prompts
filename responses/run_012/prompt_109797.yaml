  # The Bargaining Axiom Tree

  This decision tree sorts views on fair bargaining by the fundamental constraints (axioms) a person insists a solution must satisfy. Start at the top and answer each question based on your intuition about what rational bargaining *requires*, not on which mathematical formula you prefer.

  ### **Node 1: Pareto Efficiency**
  **Question:** Must the final agreement leave no potential mutual gain on the table? (i.e., Is it forbidden to choose an outcome where one person could be made better off without hurting the other?)
  *   **No:** ⛔ **Incoherent.** (If you answer "No," you are arguing that bargainers should rationally agree to waste value. This position is generally undefended in bargaining theory.)
  *   **Yes:** ⬇️ Go to Node 2.

  ### **Node 2: Symmetry**
  **Question:** If the two bargainers have identical feasible options and identical disagreement points, must they receive identical outcomes?
  *   **No:** ⚠️ **Unexplored in this tree.** (This leads to *Asymmetric* solutions, such as the Asymmetric Nash Solution, which require assigning arbitrary weights to players. We are focusing on symmetric fairness here.)
  *   **Yes:** ⬇️ Go to Node 3.

  ### **Node 3: Scale Invariance**
  **Question:** Must the outcome remain unchanged if we rescale one person's utility units (e.g., measuring their benefit in dollars instead of cents) without changing their actual preferences?
  *   **Yes (Utilities are not comparable across people):** ⬇️ Go to Node 4 (The "Game Theoretic" Branch).
  *   **No (We can compare utility units across people):** ⬇️ Go to Node 6 (The "Welfare Economic" Branch).

  ---

  ### **Branch A: Scale Invariant (Game Theoretic)**
  *You believe utility is personal and cannot be compared between people.*

  ### **Node 4: Independence of Irrelevant Alternatives (IIA)**
  **Question:** If we remove options from the feasible set that were *not* the chosen solution, must the original solution remain the choice?
  *   **Yes:** 🍃 **The Nash Solution.**
      *   *Awkward Commitment:* It ignores the shape of the bargaining frontier away from the solution point, making the outcome sensitive to "irrelevant" options that were never going to be picked.
  *   **No:** ⬇️ Go to Node 5.

  ### **Node 5: Monotonicity**
  **Question:** If the set of feasible agreements grows (more opportunities become available), must no bargainer end up worse off than they would have in the smaller set?
  *   **Yes:** 🍃 **The Kalai–Smorodinsky Solution.**
      *   *Awkward Commitment:* It ignores the curvature of the frontier (risk attitudes), treating a linear trade-off the same as a highly concave one.
  *   **No:** 🍃 **The Skeptic (Rational Indeterminacy).**
      *   *Awkward Commitment:* It offers no specific guidance to bargainers in a deadlock, asserting that context matters more than universal mathematical rules.

  > **⚠️ Note on Incoherence:** In this branch, answering "Yes" to a question about whether the Disagreement Point fixes an *entitlement* (equal gains) is **Incoherent**. You cannot claim utilities are incomparable (Scale Invariance) while simultaneously claiming we can measure "equal gains" across people.

  ---

  ### **Branch B: Not Scale Invariant (Welfare Economic)**
  *You believe we can compare how much one person gains versus another.*

  ### **Node 6: Disagreement Point Status**
  **Question:** Does the disagreement point fix a baseline *entitlement* for fairness (we split the *gains*), or is it merely a *fact* about what happens if talks fail (we look at *absolute* levels)?
  *   **Entitlement (Fairness = Equal Gains from $d$):** 🍃 **The Egalitarian Solution.**
      *   *Awkward Commitment:* It assumes we can objectively measure and compare "happiness units" between different people to ensure gains are exactly equal.
  *   **Fact (Fairness = Absolute Levels within $S$):** ⬇️ Go to Node 7.

  ### **Node 7: Aggregation Principle**
  **Question:** If we must choose between increasing the total sum of welfare or protecting the person with the least welfare, which is rationally required?
  *   **Total Sum:** 🍃 **The Greatest-Sum Rule (Utilitarian).**
      *   *Awkward Commitment:* It permits making the poorer bargainer worse off, provided the richer bargainer gains enough to increase the total sum.
  *   **Protect the Minimum:** 🍃 **The Maximin Rule.**
      *   *Awkward Commitment:* It sacrifices large amounts of total welfare to avoid even tiny inequalities, potentially leaving significant mutual gains unexploited.

  > **🚩 Flagged Indistinguishability:** Without Node 7 (Aggregation Principle), the **Greatest-Sum** and **Maximin** leaves cannot be separated by the primary list of axioms (Pareto, Symmetry, Scale, IIA, Monotonicity, Disagreement Status). Both reject Scale Invariance and treat the Disagreement Point as a fact rather than an entitlement. They are distinct only by their specific objective function (Sum vs. Min), which is an additional normative commitment beyond the standard bargaining axioms.
