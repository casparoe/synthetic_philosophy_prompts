  *(Refining Proposal 2)*: The user doesn't know the metric. I need to show how the procedure forces them to find one, or kill the proposal.

  *(Confidence Level)*: I should be low confidence. This is a classic "cargo cult" scenario (mimicking the form of futarchy without the functional mechanics). I need to explain *why* gently.

  10. **Final Review against constraints:**
