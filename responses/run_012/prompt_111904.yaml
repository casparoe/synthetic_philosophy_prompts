prompt: |-
  I'm the treasurer on my schools student council and I got kind of obsessed with this idea called futarchy -- where instead of arguing about what to do, you first vote on a number you want to go up (like average attendance or how many people say they're happy at school), then people bet on which proposal makes that number go up, and you just do whatever the bets say. I want to actually try it next semester. We've got about $4,000 in the activities fund, ~25 people on council, everything has to get decided in one 45 minute meeting, we can't gamble real money so it'd be points on a shared spreadsheet, and the principal can veto us. Also the annoying part: the people who'd be betting are mostly the same people proposing the proposals, and we won't see whether most decisions worked until next year when half of us have graduated and nobody who lost the bet is around anymore.

  Can you turn futarchy into a procedure I could actually run in a meeting? I mean the steps in order, what counts as a good enough answer at each step, where it should just stop and say no, and the points where I have to stop pretending its a procedure and let a person decide. Then run it on two proposals: (1) spend $3,000 of the fund on new laptops for the computer lab, and (2) move the spirit week budget over to a peer tutoring program -- and for that second one I honestly don't even know what number we'd be trying to make go up. Include at least one where the procedure tells me something I won't like, and be honest about the parts where it's basically me making a judgement call and calling it a rule.

  Last thing: tell me how confident you actually are that this is a good idea for a student council, and what would change your mind -- like what would have to happen in our first meeting to make you think it's not worth doing. If your reasoning is most likely to fall apart somewhere, say where.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Treasurer of a high school (likely) student council.
      *   **Goal:** Implement "Futarchy" (governance by prediction markets) for decision-making next semester.
      *   **Constraints:**
          *   Budget: ~$4,000.
          *   Council Size: ~25 members.
          *   Time Limit: One 45-minute meeting for *all* decisions (this is a huge constraint).
          *   Money: No real money gambling (points on a spreadsheet).
          *   Authority: Principal has veto power.
          *   Participants: Proposers are also bettors (conflict of interest).
          *   Feedback Loop: Outcomes won't be known until next year (after most members graduate).
      *   **Task:**
          1.  Create a concrete procedure for a meeting.
          2.  Define steps, success criteria, stop conditions, and human judgment points.
          3.  Run the procedure on two specific proposals (Laptops vs. Peer Tutoring).
          4.  Include an outcome the user won't like.
          5.  Be honest about where it's just "judgment call disguised as rule."
          6.  Assess confidence level and failure modes.

  2.  **Deconstruct Futarchy in this Context:**
      *   *Core Idea:* Vote on values (what metric to optimize), bet on beliefs (which policy improves the metric), implement the policy with the highest expected value.
      *   *Major Hurdles in this Scenario:*
          *   **Time:** 45 minutes for 25 people to debate, define metrics, bet, and decide is impossible for complex futarchy.
          *   **Incentives:** Play money (points) removes the "skin in the game" that makes prediction markets work. People will bet recklessly or strategically to block others.
          *   **Feedback:** No resolution mechanism. If we don't know if it worked until next year, the "market" never settles. This breaks the core loop of futarchy.
          *   **Conflict of Interest:** Proposers betting on their own ideas leads to inflation/manipulation.
          *   **Metric Definition:** "Happiness" or "Attendance" is hard to measure accurately in a semester.

  3.  **Drafting the Procedure (The "Student Council Futarchy Lite" Protocol):**
      *   Need to streamline heavily to fit 45 minutes.
      *   *Step 1: Metric Selection.* (Vote on what matters).
      *   *Step 2: Proposal Submission.* (Must be specific).
      *   *Step 3: Market Betting.* (Simulated).
      *   *Step 4: Decision & Veto Check.*
      *   *Crucial Additions:* Need a "Market Maker" (Treasurer) to manage points. Need a "Resolution" plan (even if delayed). Need a "Veto" check early.
      *   *Honesty Check:* I need to admit that without real money and timely resolution, this isn't really futarchy. It's gamified voting.

  4.  **Running the Simulation:**
      *   **Proposal 1: $3,000 Laptops.**
          *   Metric: "Student Tech Satisfaction" (Survey based).
          *   Betting: High confidence? But cost is high.
          *   Outcome: Maybe the market says "No" because $3k is too much risk for the metric gain. *This is the "outcome you won't like" candidate.*
      *   **Proposal 2: Spirit Week -> Peer Tutoring.**
          *   Metric: User doesn't know. I need to help them define one. "Average GPA"? "Tutoring Attendance"? Let's go with "Reported Academic Stress Level" (lower is better).
          *   Betting: Spirit Week is popular. Tutoring is niche. Market might favor Spirit Week despite the "goodness" of tutoring.
          *   Outcome: Market rejects the swap.

  5.  **Refining the Procedure for Reality:**
      *   45 minutes is *very* tight. I need to suggest pre-meeting work.
      *   The "points" system needs to prevent inflation. Everyone gets 100 points?
      *   The "Proposer = Bettor" issue needs a rule (e.g., Proposers can't bet on their own, or their bets count half).
      *   The "Resolution" issue is the killer. I must highlight that without resolution, points are meaningless. I'll suggest a "Proxy Resolution" (e.g., mid-semester survey).

  6.  **Addressing the "Honesty" Requirements:**
      *   Where am I making a judgment call? Defining the metric. Deciding when a bet is "serious."
      *   Confidence Level: Low. This is theoretically cool but practically flawed for this specific context (play money, long feedback loop).
      *   Failure Mode: The market becomes a popularity contest or a tool for grudges.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the ambition, validate the interest, but set expectations.
      *   **The Protocol (SCF-45):** Step-by-step guide.
      *   **The Simulation:** Run the two proposals through the protocol.
      *   **The "Human Judgment" Audit:** Explicitly list where the rules break down.
      *   **Confidence & Risk Assessment:** Honest evaluation of viability.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Let them bet during the meeting.
      *   *Correction:* 25 people betting in 45 mins is chaos. Move betting to a Google Form *before* the meeting. The meeting is for validation and final go/no-go.
      *   *Initial thought:* Use "Happiness."
      *   *Correction:* Too vague. Use "Event Attendance" or "Survey Score."
      *   *Constraint Check:* The user said "decided in one 45 minute meeting." I need to respect that, but I should advise that pre-work is necessary for it to function. I will structure the 45 mins to include the *finalization* of the bets, assuming some pre-discussion. Actually, strict adherence to "decided in the meeting" means the betting happens then. I will design a rapid betting phase.
      *   *Wait, the feedback loop:* "Won't see whether most decisions worked until next year." This fundamentally breaks futarchy. Futarchy *requires* resolution to pay out the bets. If bets never pay out, incentives vanish. I need to be very blunt about this. I will suggest a "Proxy Metric" that can be measured *during* the semester (e.g., sign-up sheets, immediate surveys) rather than long-term outcomes.

