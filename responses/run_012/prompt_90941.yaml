answer: |-
  ### Adjudication of the Exchange

  This adjudication evaluates the arguments based on the internal logic of David Lewis's theory of convention (*Convention: A Philosophical Study*, 1969) and the philosophical validity of the critiques raised.

  #### Part 1: Evaluation of Mei's Four Points

  **Point 1: The "Rut" Objection**
  *Claim:* The conditional preference condition is satisfied by any settled pattern, so it cannot distinguish a convention from a rut.
  *Verdict:* **Right for the wrong reason.**
  *Reasoning:* Mei is technically incorrect that *any* settled pattern satisfies Lewis's condition. A mere habit (a "rut") where agents act independently does not satisfy the condition that I prefer to conform *because* you conform. However, she is right in her broader intuition: Lewis's condition distinguishes coordination from independence, but it does not distinguish *fair* coordination from *unfair* coordination. A stable, exploitative equilibrium satisfies the preference condition just as well as a cooperative one. Her conclusion (that the test is insufficient for normative assessment) is sound, even if her premise about "any pattern" is imprecise.

  **Point 2: The "Disapproval" Objection**
  *Claim:* Because the far-end student conforms to avoid disapproval, this is a norm held up by sanction, not a coordination solution.
  *Verdict:* **Wrong.**
  *Reasoning:* This misreads Lewis. Lewis explicitly accounts for sanctions within the payoff structure of a convention. If the cost of social disapproval makes conformity the "best response" to the expectations of others, the condition is met. Lewisian conventions are a subset of social norms; the presence of disapproval does not disqualify a regularity from being a convention, provided the disapproval is part of the mutual expectations sustaining the equilibrium.

  **Point 3: The "Arbitrariness" Objection**
  *Claim:* The rule is not arbitrary because it burdens one person; alternatives are not equally good.
  *Verdict:* **Wrong.**
  *Reasoning:* Mei misunderstands Lewis's technical use of "arbitrary." For Lewis, a solution is arbitrary if there is *at least one other regularity* that could have solved the coordination problem (e.g., a rotation system, or everyone fetching their own). It does not require that the alternatives be equally *fair* or equally *preferred* by all participants ex post. The fact that the current solution is worse for the far-end student than a rotation would be does not mean the current solution wasn't arbitrary in its selection.

  **Point 4: The "Evolutionary" Objection**
  *Claim:* The evolutionary origin obscures accountability and makes the arrangement feel like a fact of nature.
  *Verdict:* **Right.**
  *Reasoning:* This is a valid meta-philosophical critique. While Lewis's account accurately describes *how* the practice emerged (precedent and salience), Mei correctly identifies the political consequence of labeling it as such: it naturalizes a power asymmetry. By attributing the practice to an impersonal evolutionary process rather than human choices, the framework removes a target for complaint. This is a strength of her critique, even if it is not a refutation of Lewis's definitions.

  #### Part 2: Evaluation of Ravi's Claims

  **Claim 1 (Initial Case):** The practice fits the Lewisian criteria (arbitrary solution to a coordination problem, sustained by mutual expectations).
  *Verdict:* **Right.**
  *Reasoning:* The scenario maps cleanly onto Lewis's model. There is a recurrent problem (needing items), a regularity (far-end fetches), mutual expectations (new students pick it up), and alternative solutions existed (rotation).

  **Claim 2 (Reply):** The account is descriptive, not justificatory.
  *Verdict:* **Right.**
  *Reasoning:* Ravi correctly identifies the category error in Mei's expectation. Lewis's theory explains the *mechanism* of convention, not its *justice*. Identifying something as a convention explains why it persists, not why it is good.

  **Claim 3 (Reply):** Disapproval is a mechanism the account absorbs.
  *Verdict:* **Right.**
  *Reasoning:* As noted in the evaluation of Mei's Point 2, Lewis's framework incorporates social sanctions into the payoff matrix that sustains the equilibrium.

  **Claim 4 (Reply):** Arbitrariness refers to the problem's lack of a unique solution, not the fairness of the outcome.
  *Verdict:* **Right.**
  *Reasoning:* This accurately defends the technical definition against Mei's conflation of "arbitrary" with "equitable."

  **Claim 5 (Reply):** If the account cannot distinguish a convention from a rut, that is a defect in the account, not his description.
  *Verdict:* **Right.**
  *Reasoning:* Ravi correctly separates the application of the theory from the theory's potential limitations. Even if Lewis's definition is too broad (a theoretical defect), Ravi's classification of the cafeteria practice under that definition is consistent.

  #### Part 3: What They Are Missing

  **What Ravi is Missing:**
  Ravi misses the **pragmatic force of the label**. While he is theoretically correct that Lewis's account is descriptive, in a social context (like a school club), labeling an arrangement a "convention" is rarely a neutral act. It functions rhetorically to legitimize the status quo ("This is just how things are done"). By insisting on the label without addressing the power asymmetry, Ravi inadvertently performs the naturalization Mei critiques in Point 4. He also underestimates the strain on the "coordination" label: when one party bears all the cost and others bear none, the situation borders on an exploitation equilibrium sustained by convention, which Lewis's original model (assuming common interest) handles poorly.

  **What Mei is Missing:**
  Mei misses the **technical precision of the theory**. She attempts to refute Ravi's classification by arguing that the practice fails Lewis's criteria (arbitrariness, preference conditions). It does not. Her critique is not that Ravi has misapplied Lewis, but that Lewis is inadequate for moral critique. She conflates "This is not a convention" with "This is not a *just* convention." By fighting on the definitional ground (Points 1–3), she loses the stronger ground she stakes in Point 4: that the *utility* of the theory is limited when power dynamics are unequal.

  #### Part 4: Final Verdict

  **1. Is the far-end practice a convention on Lewis's account?**
  **Yes.** It satisfies the necessary and sufficient conditions: a regularity in behavior, common knowledge of mutual expectations, conditional preferences to conform (avoiding the awkwardness of breaking the pattern), and the existence of alternative regularities (rotation, self-service) that could have solved the coordination problem. The unfairness of the distribution does not disqualify it technically.

  **2. Does the account need amending if it is?**
  **Yes, in application if not in definition.** Lewis's account assumes a coordination problem where agents have a *common interest* in coordinating. In this cafeteria case, the interest is asymmetric: the near-end students have an interest in the far-end student fetching, while the far-end student has an interest in *not* fetching. This is less a pure coordination problem and more a **distributional conflict settled by precedent**. The account needs amending (or at least supplementation with a theory of power) to distinguish between *cooperative conventions* (everyone benefits) and *exploitative equilibria* (one benefits, one complies to avoid sanction). Without this amendment, the theory risks classifying oppression as convention.

  **3. Does calling it a convention give anyone at the table a reason to keep doing it?**
  **No.** Identifying the practice as a convention provides an *explanatory* reason (we do it because we expect others to), but it provides no *normative* or *moral* reason (we ought to do it). The label explains the stability of the practice, not its validity. Ravi is correct that the theory does not justify the arrangement, but Mei is correct that using the theory in this way often obscures the lack of justification. The far-end student has a reason to stop if the cost to her outweighs the social cost of breaking the convention; the label itself changes nothing about that calculation.
