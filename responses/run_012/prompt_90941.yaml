      *Actually, let's look closer.* Lewis's condition is: Prefers to conform *given others conform*. In a rut (habit), I prefer to conform regardless of others. So the condition *does* separate them. Mei claims it doesn't. So she is **Wrong**.
      *Re-evaluating Mei Point 1:* She says "The condition... is satisfied by any settled pattern of behaviour whatsoever." This is demonstrably false under Lewis. If I drink coffee every morning alone, that's a settled pattern, but not a convention. So she is **Wrong**.
      *Re-evaluating Mei Point 2:* She says disapproval makes it a "norm" not a "convention." Lewis says conventions *are* norms sustained by expectations (which can include disapproval). So she is **Wrong**.
