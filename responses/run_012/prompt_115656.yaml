answer: |-
  Here is a construction designed for a whiteboard session. It isolates the mathematical dependency of the dominance argument on **strict propriety**, demonstrating that mere propriety and truth-directedness are insufficient to rule out blatantly non-probabilistic credences.

  ### The Setup

  **Partition:** $\Omega = \{w_1, w_2\}$.
  **Credence Function:** $c = (c_1, c_2) \in \mathbb{R}^2$. No constraints on range or sum.
  **Truth Values:**
  *   At $w_1$: $v_1 = (1, 0)$.
  *   At $w_2$: $v_2 = (0, 1)$.

  **The Scoring Rule ($S_{sum}$):**
  We define a rule that rewards normalization but ignores the distribution of credence across the cells.
  $$S_{sum}(c, w) = -(c_1 + c_2 - 1)^2$$
  *(Note: Higher scores are better. The maximum possible score is 0.)*

  **Verification of Properties:**
  1.  **Truth-Directed:** At $w_1$, the function certain of the truth is $c=(1,0)$.
      $$S_{sum}((1,0), w_1) = -(1 + 0 - 1)^2 = 0.$$
      Since the squared term is always non-negative, 0 is the global maximum. Thus, certainty attains the maximum score. (Same for $w_2$ and $c=(0,1)$).
  2.  **Proper:** Let $p = (p, 1-p)$ be any probability function. The expected score of reporting $c$ when $p$ is your credence is:
      $$E_p S_{sum}(c) = p \cdot [-(c_1 + c_2 - 1)^2] + (1-p) \cdot [-(c_1 + c_2 - 1)^2] = -(c_1 + c_2 - 1)^2.$$
      This expectation is maximized (at 0) whenever $c_1 + c_2 = 1$. Since any probability function $p$ satisfies $p_1 + p_2 = 1$, $p$ is a maximizer. The rule is Proper.
  3.  **Not Strictly Proper:** The maximizer of expected score is *any* $c$ such that $c_1 + c_2 = 1$. This includes non-probabilistic functions (e.g., negative credences). Thus, the maximizer is not unique.

  **The Deviant Function:**
  $$c^* = (2, -1)$$
  This violates the probability axioms blatantly ($c_2 < 0$ and $\sum c_i \neq 1$ is false, wait: $2 + (-1) = 1$. It satisfies the sum axiom but violates non-negativity).
  *Correction for "Blatant Violation":* To ensure it violates the axioms clearly in a way usually ruled out by dominance, let's use a function that violates the sum axiom in a standard Brier context, but here "hides" in the flat spot.
  Actually, $(2, -1)$ sums to 1. It violates **Non-Negativity**. This is sufficient for "violates probability axioms".
  However, to make the point stronger regarding the *sum* constraint usually enforced by dominance, let's look at the dominance relation directly.

  ---

  ### (1) Tabulation and Dominance Failure

  We compare the Deviant $c^* = (2, -1)$ against the Probabilistic $p = (0.5, 0.5)$.

  | World | Truth Value | Score of $p$ ($S_{sum}$) | Score of $c^*$ ($S_{sum}$) |
  | :--- | :--- | :--- | :--- |
  | $w_1$ | $(1, 0)$ | $-(0.5 + 0.5 - 1)^2 = \mathbf{0}$ | $-(2 - 1 - 1)^2 = \mathbf{0}$ |
  | $w_2$ | $(0, 1)$ | $-(0.5 + 0.5 - 1)^2 = \mathbf{0}$ | $-(2 - 1 - 1)^2 = \mathbf{0}$ |

  **The Failure:**
  For $p$ to strictly dominate $c^*$, we require $S(p, w) \ge S(c^*, w)$ for all $w$, with strict inequality for at least one $w$.
  Here, $0 \ge 0$ holds, but strict inequality **never** holds.
  Furthermore, because 0 is the global maximum of $S_{sum}$, **no** credence function strictly dominates $c^*$. $c^*$ is undominated.

  **Weak Dominance:**
  $p$ *weakly* dominates $c^*$ (scores are equal everywhere). This tells us the argument still delivers a consistency constraint: you shouldn't pick $c^*$ over $p$ if you care about scoring potential. But it fails to deliver **Probabilism** as a requirement of rationality, because $c^*$ is not *forbidden* by dominance; it is merely on par with $p$.

  ### (2) The Feature Doing the Work

  The feature responsible is the **lack of Strict Propriety**.

  *   **Truth-Directedness is intact:** Certainty gets the max score. The failure is not here.
  *   **Propriety is intact:** $p$ maximizes expected score.
  *   **Strict Propriety fails:** Because the scoring rule is "flat" along the line $c_1 + c_2 = 1$, the expected score does not penalize moving from $p=(0.5, 0.5)$ to $c^*=(2, -1)$.

  The dominance argument stalls because strict dominance requires the probabilistic function to be *uniquely* optimal in a way that creates a "slope" down to non-probabilistic functions. Here, the landscape is a flat plateau containing both probabilistic and non-probabilistic functions.

  ### (3) Switching to the Brier Score

  Now we replace $S_{sum}$ with the Brier Score as defined in your prompt (higher is better):
  $$S_{Brier}(c, w_i) = -\sum_{j=1}^2 (c_j - v_{ij})^2$$
  where $v_{ij}$ is 1 if world $w_i$ is in cell $j$, and 0 otherwise.

  **Scores for $c^* = (2, -1)$:**
  *   At $w_1$ (Truth $1, 0$):
      $$S_{Brier}(c^*, w_1) = -[(2 - 1)^2 + (-1 - 0)^2] = -[1 + 1] = \mathbf{-2}$$
  *   At $w_2$ (Truth $0, 1$):
      $$S_{Brier}(c^*, w_2) = -[(2 - 0)^2 + (-1 - 1)^2] = -[4 + 4] = \mathbf{-8}$$

  **Scores for $p = (0.5, 0.5)$:**
  *   At $w_1$:
      $$S_{Brier}(p, w_1) = -[(0.5 - 1)^2 + (0.5 - 0)^2] = -[0.25 + 0.25] = \mathbf{-0.5}$$
  *   At $w_2$:
      $$S_{Brier}(p, w_2) = -[(0.5 - 0)^2 + (0.5 - 1)^2] = \mathbf{-0.5}$$

  **Dominance Restored:**
  $-0.5 > -2$ and $-0.5 > -8$.
  The probabilistic function $p$ **strictly dominates** the deviant $c^*$.
  The Brier Score is **Strictly Proper**. The unique maximizer of expected Brier score is the probability function itself. This uniqueness creates the strict inequality required for the dominance argument to succeed.

  ### (4) The Expected-Accuracy Route

  Can the expected-accuracy argument pick up the slack in the $S_{sum}$ case?
  **No.**

  The expected-accuracy argument states: *If $c$ is not probabilistic, there exists a probabilistic $p$ such that $E_c S(p) > E_c S(c)$.* (Or, using the subjective expectation $E_p$).

  In our $S_{sum}$ case:
  $$E_p S_{sum}(c^*) = -(2 + (-1) - 1)^2 = 0$$
  $$E_p S_{sum}(p) = -(0.5 + 0.5 - 1)^2 = 0$$

  The expected accuracy of the deviant function is **equal** to the expected accuracy of the probabilistic function. The expected-accuracy route fails to rule out $c^*$ for the exact same reason the dominance route failed: the scoring rule is not strictly proper. Both arguments rely on the same mathematical property (the uniqueness of the maximizer of the expected score function).

  ### (5) Defense and Reply

  **The Strongest Reply:**
  A defender of the dominance argument should insist that **Strict Propriety is a necessary condition for a measure of epistemic utility.**

  If a scoring rule is merely proper (like $S_{sum}$), it fails to distinguish between "accurate" credences (probabilities) and "incoherent" credences (like $2, -1$) that happen to sum to 1. A rule that assigns the same accuracy score to $(0.5, 0.5)$ and $(2, -1)$ is not truly measuring *accuracy*; it is measuring *normalization*. Accuracy requires sensitivity to the individual match between credence and truth value in each cell, not just the aggregate.

  **Verdict on the Argument:**
  *   **Does the reply leave the argument sound?** Yes, *if* one accepts Strict Propriety as a conceptual truth about accuracy.
  *   **Does it narrow the scope?** Yes. It shows that Probabilism cannot be derived from "Truth-Directedness" alone, nor from "Propriety" alone. It requires the substantive, non-trivial axiom of **Strict Propriety**.

  **Whiteboard Takeaway:**
  The accuracy-dominance argument is not a free lunch derived from the definition of truth. It is a theorem that holds *conditional* on the choice of a strictly proper scoring rule. Your group waves away the scoring rule choice because they assume "accuracy" implies "strictly proper accuracy." Your case shows that if they relax that assumption even slightly (to mere propriety), the argument for Probabilism collapses.
