      *   *Causal-Chain View Interpretation:* The painting's identity *did* change (in terms of art-historical classification). When believed to be Vermeer, it possessed properties like "innovative," "spiritual depth of the 17th century." When revealed as Van Meegeren, it possesses properties like "derivative," "pastiche," "1930s kitsch." The shift in judgment is rational because the *object of evaluation* shifted from "Vermeer's achievement" to "Van Meegeren's trick." The aesthetic properties are relational/historical.
