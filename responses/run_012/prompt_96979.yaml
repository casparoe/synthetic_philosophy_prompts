          2.  *Looks View (Supervenience):* Aesthetic properties depend solely on perceptible surface features. If it looks the same, it *is* the same aesthetically.
      *   **Task 1: Map the Episode:** How does each view explain the shift in judgment (from masterpiece to daub)? Is the shift evidence for Causal-Chain or just expert unreliability (supporting Looks)?
      *   **Task 2: Stress Test the Causal-Chain View:** Where does the episode actually *test* this view? How does it handle the custody painting (painted to prove guilt, deemed worthless)? What about a "forgery of a forgery"?
