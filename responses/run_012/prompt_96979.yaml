answer: |-
  This is one of the classic puzzles in the philosophy of art, right up there with Goodman's "Mr. Pickwick" problem and Danto's "Indiscernibles." You've framed it sharply: is the beauty in the retina or in the history?

  Let's work through the Van Meegeren case using your two frameworks, then stress-test the Causal-Chain view where it hurts most.

  ### 1. Mapping the Episode

  **The Looks View (Supervenience)**
  *   **On the Praise:** The experts were mistaken. They conflated *art-historical significance* (this is a missing link in Vermeer's oeuvre) and *economic scarcity* (this is a rare Vermeer) with *aesthetic value* (this is beautiful). When they praised the *Supper at Emmaus*, they were praising a narrative, not the paint.
  *   **On the Flip:** When the provenance collapsed, the experts overcorrected. Calling the paintings "clumsy daubs" was an emotional reaction to being duped (the "sour grapes" effect). The canvas didn't change, so the aesthetic properties didn't change. The Looks View holds that the *true* aesthetic value was constant the whole time; the experts were just noisy instruments.
  *   **On the Evidence:** For the Looks theorist, the fact that judgments flipped instantly is evidence of human *irrationality*, not evidence of ontological change. It shows that experts are terrible at isolating perceptual qualities from context. The flip confirms that aesthetic judgment *ought* to be stable, even if humans fail at it.

  **The Causal-Chain View (Historical/Contextual)**
  *   **On the Praise:** The experts weren't entirely wrong, but they were attributing properties to the wrong cause. They saw "spiritual depth" and "innovative composition." Under this view, those properties *require* a specific causal history to be real. You cannot be "spiritually deep" in the 17th-century Calvinist sense if you are a cynical Art Deco painter in the 1930s. The painting *appeared* to have these properties, but it was a hallucination induced by false provenance.
  *   **On the Flip:** The re-evaluation was rational. Once the causal chain was corrected (Vermeer → Van Meegeren), the aesthetic predicates changed. The work went from being "a masterful synthesis of Vermeer's late style" to "a pastiche of Vermeer's clichés." "Pastiche" is an aesthetic property that depends on history. A copy can look like an original, but it cannot *be* innovative. Therefore, the beauty *did* diminish because "being innovative" was part of the beauty.
  *   **On the Evidence:** The flip is evidence that aesthetic properties are not purely perceptual. We perceive art with our brains, not just our eyes. Knowing the history changes the perception itself (like seeing a duck become a rabbit). The change in judgment reflects a change in the *object of appreciation*.

  **Who wins the "Flip"?**
  Honestly? The flip is ambiguous.
  *   If you believe aesthetic experience is purely sensory, the flip is an embarrassment for the experts (Looks View wins normatively).
  *   If you believe aesthetic experience is cognitive (involving understanding), the flip is a correction (Causal-Chain wins).
  *   *My read:* The visceral recoil ("ugly daubs") suggests the Looks View is onto something psychological—we *feel* betrayed. But the Causal-Chain view explains why the *criticism* changed. They didn't just say "I'm mad"; they said "the hands are weak, the theology is shallow." Those are critiques that only make sense once you know the author.

  ### 2. Stress-Testing the Causal-Chain View

  You asked where this episode actually *tests* the view rather than just illustrating it. The illustration is the *Emmaus*. The test is the **Custody Painting** and the **Forgery of a Forgery**.

  **The Custody Painting (The "Demo")**
  Van Meegeren painted *Jesus Among the Doctors* (or similar works) in custody to prove he could do it. The court and critics deemed it inferior to the forgeries.
  *   **The Problem:** If aesthetic value is in the causal chain, why is the custody painting worse than the forgeries? Both are by Van Meegeren. Both are 1930s/40s. Both are "fakes" in the sense that neither are Vermeers.
  *   **The Causal-Chain Save:** The view can handle this by looking at *intent*. The forgeries were created with the intent to *deceive and captivate*. They were ambitious attempts to enter the canon. The custody painting was a *technical demonstration*, a prop for a legal defense.
      *   In the Causal-Chain view, the "artistic action" is part of the work. The forgery was an act of high-stakes artistic transgression. The custody painting was an act of compliance. The aesthetic property of "audacity" applies to the forgeries but not the demo.
      *   *Verdict:* The Causal-Chain view survives here, but it has to lean heavily on *intent* rather than just *provenance*.

  **The Forgery of a Forgery**
  This is where I see you getting stuck, and it's the right place to get stuck. Suppose I forge Van Meegeren's *Supper at Emmaus* today.
  *   **Looks View:** If I match the surface perfectly, my painting has the same aesthetic value as Van Meegeren's.
  *   **Causal-Chain View:** My painting is aesthetically inferior. Why?
      *   Van Meegeren's *Emmaus* now has a historical property: "The painting that fooled the Nazis and Göring." It is a significant artifact of 20th-century cultural history.
      *   My copy lacks that history. It is a copy of a significant artifact.
      *   *The Embarrassment:* If the Causal-Chain view says Van Meegeren is inferior to Vermeer because he is "derivative," isn't my copy of Van Meegeren "derivative of a derivative"? Yes. But here's the twist: Van Meegeren's work has gained *new* aesthetic properties over time. It is now "ironic," "historically poignant," and "a symbol of hubris." My copy lacks *those* properties.
      *   So, the Causal-Chain view holds: The original Van Meegeren is aesthetically richer than my copy of it, not because of the paint, but because the original carries the weight of its specific history (the trial, the confession, the Nazi connection).
      *   *The Glitch:* This implies that aesthetic value can *grow* over time without the object changing. A forgery can become "more beautiful" as history accretes around it. If you accept that, the view is consistent. If you think beauty must be intrinsic to the moment of creation, this breaks the model.

  ### 3. Epistemic Honesty: Where I'm Least Sure

  I am least sure about the definition of **"Aesthetic Property."**

  The entire debate hinges on whether properties like "innovative," "sincere," "derivative," or "audacious" are *aesthetic* properties or *historical* properties that we *mistake* for aesthetic ones.

  *   **If they are historical:** Then the Looks View is right. We just get confused and think history is beauty. The Van Meegeren case shows we are easily confused.
  *   **If they are aesthetic:** Then the Causal-Chain View is right. You cannot perceive "sincerity" without knowing the mind behind it. Therefore, perception is not just retinal.

  **What would change my verdict?**

  1.  **For the Looks View:** If you could show me a "blind" test where experts, stripped of all context, consistently rate the Van Meegeren *higher* than late Vermeer on purely formal grounds (composition, color harmony), and admit they prefer the look of the fake.
      *   *Reality Check:* Some modern critics actually do this. They argue Van Meegeren's *Emmaus* is compositionally stronger than some actual Vermeers, which were often awkward. If the "beauty" survives the reveal for some viewers, the Looks View gains ground. (In fact, Van Meegeren's works are now in museums *as Van Meegerens*, valued for their look).

  2.  **For the Causal-Chain View:** If you can demonstrate that knowledge of authorship changes the *phenomenological experience* in a way that isn't just bias.
      *   *The Argument:* When I look at a Vermeer, I see "light captured by a master." When I look at the Van Meegeren, I see "light simulated by a trickster." The *experience of the light* is different because the *nature of the achievement* is different. If you accept that "achievement" is part of the aesthetic experience, Causal-Chain wins.
      *   *The Dealbreaker:* If it turns out that "achievement" is moral or intellectual, not aesthetic. If beauty is strictly about the sensory qualia, the Causal-Chain view collapses into moralizing.

  **My Current Lean:**
  I lean toward a modified **Causal-Chain View**, specifically the version argued by Nelson Goodman. Goodman didn't argue that the forgery *looks* worse. He argued that knowing it is a forgery changes how we *look* at it. We look for the "tell." We look for the strain. The knowledge trains the eye.

  Therefore, the Van Meegeren episode doesn't prove the painting changed; it proves that **aesthetic perception is a skill that incorporates knowledge.** The experts didn't just change their minds; they changed their *mode of seeing*. Once they knew it was a forgery, they saw the "effort" behind the "ease." That effort is visible on the canvas *if you know to look for it*.

  So, the embarrassment isn't that the value flipped. The embarrassment would be if the value *didn't* flip. If we found out the *Mona Lisa* was painted yesterday by a student, and we said "Well, it looks the same, so it's the same masterpiece," we would be ignoring the fact that art is a form of human action, not just decoration.

  **Where I'm vulnerable:**
  If you can convince me that "beauty" is strictly a sensory pleasure (like the taste of a strawberry), then the Causal-Chain view is nonsense. A strawberry grown in a lab tastes the same as a wild one; why should a painting be different? If art is just "visual food," the Looks View wins. If art is "visual language," the Causal-Chain View wins. I'm assuming art is language. If you assume art is food, I lose.
