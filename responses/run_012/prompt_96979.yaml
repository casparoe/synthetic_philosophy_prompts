      *   *Where the test lies:* The test isn't the flip (that's psychology). The test is whether we can identify aesthetic properties that *require* the history. E.g., "boldness." A forgery cannot be "bold" in the same way an innovator is. If "boldness" is an aesthetic property, Causal-Chain wins. If "boldness" is just a historical fact, Looks wins.

