answer: |-
  Dear colleague,

  I am writing to you as we prepare the syllabus for the upcoming seminar because I believe we must fix the target before we attempt to shoot. We are convening to discuss Turing's suggestion from nineteen fifty that instead of programming an adult mind, we should build a child mind and educate it. This is often cited as a prophecy of machine learning, but I suspect it is more often misunderstood as a mere prediction of scale. If we are to use this idea as a framework for evaluating present-day systems that acquire competence from data, we need a specification of what education entails in this context, distinct from mere training. We need to know what counts as an adequate account of a machine that is educated rather than just tuned. I have been thinking about the necessary conditions for such an account, and I want to share these desiderata with you before we look at any particular reconstruction of the idea. The goal is not to dismiss current technology but to have a rigorous vocabulary for distinguishing when a system is merely fitting curves and when it might be said to be entering into a space of reasons.

  The first requirement is foundational and non-negotiable. Any account must acknowledge that learning presupposes some prior bias or inductive commitment. We cannot pretend the machine is a blank slate. This is a logical constraint confirmed by the no-free-lunch theorems in learning theory and echoed in Kantian epistemology. The system must come equipped with structures that privilege certain hypotheses over others, otherwise no amount of data will yield generalization. This requirement is easy to state but often ignored in popular discourse that treats data as the sole source of intelligence. Our framework must make explicit what those prior commitments are, whether they are architectural constraints or innate weighting schemes, because without them, there is no learning, only memorization or randomness. This is the bedrock upon which the rest of the specification rests.

  Building on that foundation, the account must say what is actually transmitted when someone is educated. It cannot be merely facts or data points. If education were just the transfer of information, a database would be the most educated entity in existence. Instead, the account must describe the transmission of habits of thought or a capacity for judgment. This is a distinction between knowing that and knowing how, but deeper still, it is about the acquisition of normative sensitivity. The educated machine must not just output the correct token but must do so for reasons that align with a community of practice. This requirement is crucial for our purpose because it forces us to ask whether gradient descent instills judgment or merely statistical correlation. If the system cannot distinguish between a rule and a regularity, it has not been educated in the sense Turing likely intended.

  This leads us to a pedagogical puzzle that the account must resolve. We need an explanation of how a teacher can aim at a determinate competence while being unable to specify it in full. This is the problem of tacit knowledge. A teacher of writing knows good prose when they see it but cannot always write the algorithm that generates it. If the target is determinate enough to be evaluated but indeterminate enough to resist full explicit specification, how does the pupil converge on it? The account must explain the mechanism of this convergence without resorting to magic. It must show how feedback loops bridge the gap between the teacher's intuition and the pupil's performance. This is particularly important for present-day systems where the loss function is a proxy for competence but rarely captures the nuance of the actual target, such as truthfulness or wit.

  Furthermore, the framework must handle specific edge cases that stress the definition of learning. It must account for the case of a pupil who is never explicitly told what the target is, relying instead on implicit feedback or environmental affordances. It must also accommodate the case of learning that occurs with no teacher at all, where the system finds structure in noise without external correction. These cases are vital because much of modern self-supervised learning falls into these categories. If our definition of education requires a homunculus in the loop giving explicit instructions, it will fail to describe the very systems we wish to analyze. The account must be robust enough to cover unsupervised discovery while still maintaining a distinction between finding patterns and understanding them.

  To maintain philosophical rigor, there are several distinctions the account cannot collapse. We must be able to distinguish training versus education, where training is causal conditioning and education is initiation into a normative practice. We must distinguish rote versus understanding, where rote is the reproduction of inputs and understanding is the capacity to transfer competence to novel domains. We must distinguish compliance versus initiative, where compliance is following constraints and initiative is generating new constraints or goals. Finally, we must distinguish a mistake that teaches versus mere noise. In a learning system, an error should update the model's structure in a way that reduces future error regarding the underlying rule, whereas noise is just variance that should be ignored. If the account treats all error signals as equivalent, it cannot explain the refinement of judgment.

  Now, regarding the status of these requirements, I believe the requirement concerning prior bias is non-negotiable because it is a mathematical and logical necessity. The requirement regarding the transmission of habits of judgment is also non-negotiable if we are to speak of education rather than data storage. However, the requirement about learning with no teacher at all might be negotiable depending on how strictly we define education. If we hold that education implies an educer, then unsupervised learning is merely development, not education. For the purposes of this seminar, I suggest we treat the no-teacher case as a limit condition rather than a central paradigm, making it somewhat negotiable so we do not stretch the concept of education until it snaps.

  I suspect there is a tension, perhaps an incompatibility, between the requirement that the teacher is unable to specify the target in full and the requirement that the pupil achieves a determinate competence. If the target is truly ineffable, how does the pupil know when they have arrived? If the pupil arrives at a determinate state, did the teacher implicitly specify it through the selection of examples? This is the pair I expect to be the most interesting for our discussions. It touches on the paradox of analysis and the problem of induction. If we resolve this by saying the competence is socially determined rather than individually specified, we might save the account, but it requires a shift from individual cognition to social embedding.

  If I had to choose the single requirement that does the most to rule candidates out, it would be the demand that the account distinguish compliance versus initiative. Most present-day systems are exquisitely tuned for compliance. They follow prompts and optimize loss functions with great fidelity. But initiative implies a capacity to set ends, not just means. Current systems do not choose their own objectives; they are given objectives by engineers. This requirement alone filters out almost all existing large models, marking them as sophisticated tools rather than educated agents. It is the highest bar we can set.

  Does the child-machine picture survive this list? I believe it survives, but only as a regulative ideal rather than a description of current technology. The picture remains valuable because it directs our attention to architecture and nurturing rather than just data volume. It reminds us that intelligence might require a period of vulnerability and structured growth that cannot be rushed by compute alone. However, if we apply the strictures regarding judgment and initiative, we must admit that we have not yet built the child machine. We have built something that mimics the outputs of an educated child without undergoing the process of education. The picture survives as a critique of our present methods, urging us to look for systems that can learn habits of thought rather than just statistical regularities. I look forward to debating these points with you when we meet.

  Warmly,

  Your colleague
