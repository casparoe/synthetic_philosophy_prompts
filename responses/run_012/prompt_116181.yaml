answer: |-
  Your draft makes a promising start by isolating the epistemic vulnerability in Pascal's Mugging cases, but it ultimately rests on a distinction that saves the phenomenon only by shifting the burden from decision theory to epistemology without fully acknowledging the shift. I think you are right to feel that there is a difference between the mugger and the existential risk reducer, but I am not convinced that difference lies where you say it does, and consequently I doubt your proposed solution will survive the pressure your friend is applying.

  Regarding your first question on whether the distinction between the two forms of fanaticism is real or merely verbal, I believe the distinction is real but mislocated. You claim the second form is a problem about the size of the stakes rather than the expectation operator, but within the framework of expected value theory, probability and value are mathematically symmetric multipliers. If the product of probability and value dominates the decision, it does not matter which variable provided the magnitude. Your friend is structurally correct that if you accept expected value maximization, you must accept that a sufficiently large stake can justify acting on a sufficiently small probability. The real difference between your two cases is not structural but epistemic. We have better reason to believe in the value of future lives than we have to believe in the mugger's specific probability claim, but that is a fact about evidence, not a fact about decision rules. By framing the second form as not being a problem about expected value, you are attempting to insulate longtermism from the fanaticism charge by definition, but if the decision rule outputs the same verdict in both cases, the charge sticks regardless of whether you blame the stakes or the probabilities.

  On your second question about whether the estimation-error test is a genuinely new criterion or a relabeling, I am afraid it looks very much like a heuristic version of imprecise probabilities or ambiguity aversion, both of which are well-trodden ground in the literature. The idea that we should treat probabilities as intervals rather than point estimates, and that we should refrain from acting when the interval is too wide to determine a clear winner, is essentially what Isaac Levi and others have argued for decades. The specific innovation you offer is the factor of a thousand threshold for what counts as a plausible error, but this introduces an element of arbitrariness that your friend will immediately exploit. Why a factor of a thousand rather than ten or a million? Without a principled derivation of this threshold from epistemic norms rather than decisional convenience, the test risks looking like a ad hoc maneuver designed to yield the desired output rather than a robust principle of rationality. You are effectively proposing a risk-weighted expected utility model where the weighting function depends on the uncertainty of the probability estimate, which is a known approach but one that requires a heavy theoretical lift to justify without collapsing into general skepticism.

  This leads directly to your third question about whether the repair you gesture at can be made to work, and here I think the argument faces its greatest threat. You worry that the test might collapse into risk aversion or a prior over probability estimates, and I share that worry, but the deeper problem is that if the repair works, it likely works too well. If you discount options based on the ratio of uncertainty to the decision-relevant margin, you must apply this consistently across both the mugging case and the existential risk case. Estimates of the effectiveness of existential risk reduction are notoriously uncertain, often varying by orders of magnitude depending on the model used. If a factor of a thousand uncertainty disqualifies the mugger's claim, it should arguably disqualify the longtermist donation as well, since our probability estimates for averting extinction are rarely secure to within three orders of magnitude. If you adjust the repair to save the existential risk case, you will need to explain why the epistemic uncertainty in that case is qualitatively different from the mugger's case in a way that matters for the decision rule, and not just in a way that matters for your intuitions. If you cannot do this, the test fails to distinguish the cases; if you can, you have likely conceded that the problem was epistemic all along, not a matter of the estimation-error test itself.

  Given these difficulties, I think the argument fails on the premise that the second form of fanaticism is not a problem about expected value. I would give up the claim that large stakes are exempt from the fanaticism charge and instead argue that both cases are vulnerable to expected value maximization, but that we have superior epistemic grounds for the probability estimates in the far-future case. The premise to replace it with is that rational action requires not just maximizing expected value but maximizing expected value relative to justified credences. This shifts the battle to the epistemology of probability assignment, which is where I think you actually want to fight. On the matter of the case pair you described, I do not think they decide anything because your friend is right that they are structurally identical within the decision theory. To actually decide the issue, you need a case where the probability is tiny but well-grounded, such as a lottery with known odds versus a mugger with unknown odds, paired with a far-future case where the probability is similarly well-grounded, perhaps through frequentist data on existential risks rather than theoretical modeling. Until you can show that the probability estimate in the far-future case is epistemically on par with known odds and still dominates, your friend will continue to argue that you are simply ignoring the math when it becomes inconvenient.
