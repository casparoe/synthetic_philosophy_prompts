answer: |-
  **MEMORANDUM**

  **TO:** Committee on Academic Ethics
  **FROM:** The Chair
  **DATE:** 14 October 2023
  **SUBJECT:** Opinion regarding the Complaint concerning the Annual Conference Panel on Ottoman Economic History

  **1. Introduction and Mandate**

  We meet next Thursday to dispose of a complaint regarding a working paper circulated by a member of this Association. The paper argues against the classification of the 1915–16 Armenian deportations as genocide. A complainant has requested that we withdraw the invitation extended to the author, contending that the paper constitutes denialism and that the Association's provision of a platform amounts to an endorsement of its conclusions.

  We currently possess no policy governing such cases. Previous instances involving the Nanjing Massacre and camp survivor testimony were resolved *ad hoc*. My purpose in this opinion is to propose a principled course of action that we can adopt as precedent, thereby moving from improvisation to policy.

  I must begin by defining the limits of our competence. We are a committee of scholars, not a tribunal of historical fact. We are not constituted to adjudicate whether the events of 1915–16 constituted genocide. To attempt to do so would be to exceed our authority and to mistake the nature of our expertise. Our mandate is not to determine *what happened*, but to evaluate *how the claim is being sustained*. We are guardians of method, not arbiters of truth.

  **2. First-Order and Second-Order Revision**

  To navigate this without adjudicating history, I propose we distinguish between two types of revisionism.

  *First-order revision* challenges the substantive narrative of the past. It argues for different casualty figures, different motivations, or different causal chains. This is the engine of historical inquiry. If a scholar argues, based on new archival evidence, that a death toll was lower than previously estimated, this is a first-order claim. It may be wrong, but it is legitimate historical work.

  *Second-order revision* challenges the standards by which narratives are assessed. It alters the rules of evidence, the weight given to testimony, or the logical requirements for establishing intent.

  Denialism is best located not in the first-order claim (e.g., "the death toll was lower"), but in the second-order move (e.g., "survivor testimony counts for nothing," or "absence of a written order proves absence of intent"). When a scholar insists on evidentiary standards for one group that they waive for another, or when they treat methodological limitations as exculpatory proof, they are engaging in second-order revision.

  This distinction is vital for us. If we ban a paper because its first-order conclusion contradicts a consensus, we become censors of orthodoxy. If we sanction a paper because its second-order methodology violates professional standards of evidence and reasoning, we are upholding the integrity of the discipline.

  **3. Application to the Present Case**

  Applying this framework to the paper in question, we find a mixture of both.

  The author's contention that certain archival collections are over-relied upon, and that some figures are extrapolations, are defensible first-order critiques. These are matters of historical debate suitable for a conference panel.

  However, the paper also exhibits significant second-order flaws. It treats the absence of explicit documentary intent as positive evidence of its non-existence (an argument from silence). It dismisses survivor testimony *a priori* as interested while accepting hostile state testimony as transparent. Most troublingly, it cites primary material in a manner that inverts the meaning of the surrounding text. Finally, it employs a rhetorical strategy of redescribing substantive claims as mere questions, immunising them from critique.

  These are not merely errors of fact; they are deviations from the methodological standards that allow us to distinguish history from polemic.

  **4. The Strongest Consideration Against Intervention**

  I must engage honestly with the strongest argument against the course I propose. The argument for non-intervention rests on the risk of the 'chilling effect'. If this Committee begins to judge the methodological rigour of controversial papers, we risk creating a climate where legitimate revisionism is stifled for fear of ethical censure. History advances by challenging consensus, and the line between bold revision and denialism is often only clear in hindsight. By intervening, we risk conflating our ethical authority with historical correctness, potentially protecting a flawed consensus from a correct minority view.

  Furthermore, there is the argument that withdrawal grants the author a martyrdom they do not deserve, allowing them to claim suppression by the 'academic establishment' rather than facing refutation on the merits.

  I acknowledge the force of this. It is the reason I cannot recommend the withdrawal of the invitation. To withdraw the invitation is to act as if the historical question is settled, which is a first-order judgement we are not entitled to make. It also denies the community the opportunity to witness the critique of the methodology in real time.

  **5. Recommendation**

  We are entitled to act on a judgement of partial competence because we are competent to judge *procedure*, even if we are not competent to judge *outcome*. We know what constitutes a misrepresentation of a source, even if we do not know the exact death toll in 1915.

  Therefore, I recommend that the Association **proceed with the panel, but under specific conditions.**

  We should not withdraw the invitation, as this conflates methodological failure with historical falsity. However, we cannot proceed unchanged, as this risks the Association appearing to endorse a paper that manipulates evidentiary standards.

  I propose the following conditions:
  1.  **Designated Respondent:** The session chair must appoint a designated respondent, specifically tasked with addressing the methodological and evidentiary handling in the paper, not merely the historical conclusions.
  2.  **Chairing Instructions:** The session chair must be instructed to open the session by clarifying that the presentation of a paper does not constitute an endorsement by the Association, and to ensure the discussion focuses on the rigour of the evidence presented.
  3.  **Author Notification:** The author should be informed privately that while their invitation stands, the Committee has noted concerns regarding citation practices and evidentiary weighting, and that these will be the primary focus of the response.

  This approach allows the first-order debate to occur (respecting academic freedom) while subjecting the second-order flaws to professional scrutiny (upholding academic ethics). It models how the discipline polices itself without resorting to censorship.

  **6. Proposed Motion**

  I move the following resolution for the Committee's vote:

  > *That the Committee on Academic Ethics recommends to the Programme Committee that the panel in question proceed as scheduled, subject to the appointment of a designated respondent with a mandate to address methodological rigour and evidentiary handling; and that the session chair be instructed to clarify the Association's neutrality regarding the paper's conclusions.*

  **7. Time Frame**

  If this motion passes, I will communicate the decision to the Programme Committee by close of business next Friday. The Programme Committee should then have ten days to identify and secure a suitable designated respondent. The author should be notified of the conditions immediately thereafter.

  I look forward to discussing this reasoning with you on Thursday.

  Yours sincerely,

  [Name]
  Chair, Committee on Academic Ethics
