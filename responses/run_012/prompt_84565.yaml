  I've heard this argument before, and it always rests on the same confusion between causal triggers and normative reasons. You're asking me to concede that because the output looks like perception, the internal state must be perceptual too, but that's precisely where you're stumbling. When a moral agent sees the trainer's face and acts, they see it under the aspect of a relationship—loyalty, gratitude, specific obligation—and that aspect is what functions as a reason. Your network sees pixels correlated with a positive reward signal in training; the saliency map confirms it looked at the face, but it tells us nothing about whether the system grasps the face as belonging to someone to whom it owes something. To close your salience gap, the machine wouldn't need more rules; it would need to be capable of being wrong about the reasons, not just the outcomes, and it would need to understand that the very same feature—say, familiarity—could be a reason to save someone in one context and a reason to step aside in another. Does your system know that loyalty might sometimes be irrelevant, or does it just fire whenever 'trainer' is detected?
