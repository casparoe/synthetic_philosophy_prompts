answer: |-
  # Does the Number Count? A Decision Tree for Rescue Cases

  **Starting Commitment:** You face a rescue choice. Each person matters equally. You must act. You cannot save everyone.

  ### The Flowchart

  **1. The Standard Case:** You can save **One** person or **Five** people (all otherwise certain to die). Must you save the Five?
  *   **No** (A coin flip is permissible) → Go to **Question 4**.
  *   **Yes** (You must save the Five) → Go to **Question 2**.

  **2. The Doomed Person Case:** One of the Five is already doomed (unreachable). You can save the **One** or the **Remaining Four**. Must you save the Four?
  *   **No** (You may flip between One and Four) → **Leaf A: Savable-Count Aggregation**.
      *   *Awkward Commitment:* Implies a person's moral weight vanishes the moment they become unreachable, even if they are still alive.
  *   **Yes** (You must still save the Four) → Go to **Question 3**.

  **3. The Claim on Conduct:** In saving the Four (in the Doomed Case), could the One legitimately demand you stop?
  *   **Yes** (They have a veto/violation) → **Leaf B: Rights-Constrained Aggregation**.
      *   *Awkward Commitment:* Struggles to explain why the veto is overridden by the Four without summing the very claims that grant the veto.
  *   **No** (They have no veto) → **Leaf C: Pure Consequentialism**.
      *   *Awkward Commitment:* Requires sacrificing the One whenever it produces a net gain elsewhere, even against their will.

  **4. The Status of Randomization:** In the Standard Case (1 vs 5), is a coin flip *obligatory*, or is saving the Five also *allowed*?
  *   **Allowed** (Saving 5 is OK, Flip is OK) → Go to **Question 5**.
  *   **Obligatory** (You must flip) → Go to **Question 6**.

  **5. The Value of Numbers:** If saving the Five is allowed, is it *morally better* than flipping?
  *   **Yes** (Saving 5 is better) → **Leaf D: Weak Aggregation**.
      *   *Awkward Commitment:* Makes fairness optional; permits ignoring the One's equal claim whenever the group is large enough.
  *   **No** (Indifferent between 5 and Flip) → **Leaf E: Permissibility Prioritarian**.
      *   *Awkward Commitment:* Implies the difference between one life and five lives is morally negligible if procedure is fair.

  **6. The Ex Post Complaint:** You flip a coin. The One is saved. Do the Five have a legitimate complaint?
  *   **Yes** (They were treated unfairly) → **Leaf F: Ex Post Egalitarian**.
      *   *Awkward Commitment:* Requires saving the Five even after a fair lottery, rendering the lottery morally useless.
  *   **No** (Ex Ante fairness sufficed) → Go to **Question 7**.

  **7. The Ex Ante Chance:** You cannot save anyone for sure, but you can give the Five a **99% chance** (One gets 1%) or a **50% chance** (One gets 50%). Is 99% better?
  *   **Yes** (Maximize expected chances) → **Leaf G: Ex Ante Prioritarian**.
      *   *Awkward Commitment:* Values tiny chances for many over significant chances for one, potentially preferring a 1% chance for a million over a sure save for one.
  *   **No** (Equal chances matter most) → Go to **Question 8**.

  **8. The Sure Thing:** Is saving the **One for sure** better than a **50/50 flip** for the Five?
  *   **Yes** (Priority to the identified individual) → **Leaf H: Individualist Priority**.
      *   *Awkward Commitment:* Requires letting Five die to save One, provided the One is identified first or "closest."
  *   **No** (Indifferent between Sure One and Flip Five) → **Leaf I: Pure Proceduralist**.
      *   *Awkward Commitment:* Treats a certain death for five as equivalent to a risk, provided the selection process was random.

  ***

  ### Handout Notes for Discussion

  **1. Indistinguishable Leaves**
  *   **Leaf C (Pure Consequentialism) & Leaf D (Weak Aggregation):** In practice, these often converge on the same action (Save the 5). They only diverge if "morally better" does not translate to "obligatory." If your theory holds that you ought to do what is morally better, these positions collapse into one another.
  *   **Leaf H (Individualist Priority) & Leaf I (Pure Proceduralist):** Both reject aggregation. They only diverge in mixed cases (certainty vs. risk). In standard Taurek cases (1 vs 5 certain death), they yield identical advice (Flip or Save 1).

  **2. Unoccupied Combinations**
  *   **The "Ex Post Aggregator":** (Answered "Yes" to Q1, but "Yes" to Q6). This combination is **incoherent**. If you believe you must save the Five (Q1), you typically believe the One has no complaint (Q6). If the Five have a complaint after a fair loss, why was the flip permissible in the first place?
  *   **The "Doomed Rights Holder":** (Answered "No" to Q2, but "Yes" to Q3). This combination is **unexplored/unattractive**. It suggests the doomed person's claim vanishes for aggregation (Q2) but retains veto power (Q3). This creates a "zombie claim" that blocks action but adds no weight.
  *   **Leaf I (Pure Proceduralist):** This position is **rarely occupied**. Most who demand equal chances (Q7 No) still prefer saving a life for sure over gambling with five (Q8 Yes). Indifference here suggests a commitment to process that completely overrides outcome value.

  **3. Added Distinction: The Source of Doom**
  *   *Why added:* The tree uses the "Doomed Person Case" (Q2) to test whether numbers count based on *presence* or *savability*. I added this because it clarifies whether the moral unit is the "life at stake" or the "life the agent can affect." This distinction often separates Contractualists (claims depend on agent relation) from Utilitarians (claims depend on welfare state).

  **4. Formatting Note**
  *   This tree sorts by **case intuition** rather than **theoretical label**. A "Contractualist" might end up at Leaf B or Leaf H depending on their reading of "reasonable rejection." A "Consequentialist" should end at Leaf C, but might slip to Leaf G if concerned with risk distribution.
