answer: |-
  Here is a menu of the distinct philosophical claims often hidden behind the slogan "You can't get an ought from an is." I have structured this to help you diagnose exactly where Ravi and your second colleague are disagreeing, and whether the slogan is doing heavy lifting or just making noise.

  ### 1. The Logical Entailment Thesis
  *   **The Claim:** No valid deductive argument can have a conclusion containing a normative term (e.g., "ought," "good") if all its premises are purely descriptive (containing only "is," "was," "will be").
  *   **Status:** **Trivially True (with caveats).**
  *   **Analysis:** In formal logic, a valid argument cannot introduce new vocabulary in the conclusion that was not present in the premises (the principle of *conservation of vocabulary*). If "ought" means something different than "is," you cannot deduce it without a bridge premise that already contains "ought."
  *   **Distinctions:**
      *   *Entailment vs. Supervenience:* This thesis blocks **entailment**, but it does **not** block supervenience. Most philosophers agree moral facts *supervene* on natural facts (no moral difference without a natural difference), even if they aren't logically entailed by them.
      *   *Institutional Facts:* This thesis treats institutional facts (e.g., "X made a promise") as descriptive "is" statements. If so, you cannot derive "X ought to keep the promise" without a normative bridge (e.g., "Promises ought to be kept").
  *   **Application to Dispute:** If Colleague 2 is using this reading, they are technically correct that Ravi's argument is *invalid* as stated. However, this is a logical formality. It doesn't prove Ravi is wrong, only that he has a hidden premise (e.g., "We ought to follow evolved dispositions"). Ravi's counter ("every view starts from descriptive facts") concedes this logical point but argues the hidden premise is acceptable. **This reading nags Ravi but does not kill him.**

  ### 2. The Metaphysical Thesis (Non-Naturalism)
  *   **The Claim:** Moral properties (goodness, obligatoriness) are fundamentally different kinds of entities than natural properties (evolutionary success, psychological states). Therefore, no identity statement like "Goodness = Evolutionary Fitness" can be true.
  *   **Status:** **Substantive and Defensible (but controversial).**
  *   **Analysis:** This is G.E. Moore's "Open Question Argument." Even if fairness evolved, it remains an open question: "I know this behavior evolved, but is it *good*?" If the answer isn't automatic, the properties aren't identical.
  *   **Distinctions:**
      *   *Naturalistic Fallacy:* This is the specific home of the **Naturalistic Fallacy**. Moore argued that defining "good" in terms of any natural property (pleasure, evolution, desire) is a fallacy. This is stronger than the Logical Thesis; it claims the reduction is *false*, not just that the argument is invalid.
      *   *Functional Facts:* Even if the heart's function *is* to pump (a descriptive fact), this thesis denies that "The heart *ought* to pump" follows metaphysically without a prior normative commitment to the heart's purpose.
  *   **Application to Dispute:** **This reading kills Ravi.** If Colleague 2 means this, they are claiming Ravi has made a category error. Ravi is arguing that because fairness *did* evolve (natural fact), it *is* a standard we ought to respect (moral property). If moral properties cannot be reduced to evolutionary history, Ravi's conclusion is false, not just unsupported. Ravi's counter-argument fails here because he is trying to ground the *authority* of morality in description, which this thesis forbids.

  ### 3. The Semantic Thesis (Expressivism/Non-Cognitivism)
  *   **The Claim:** Descriptive statements represent facts (they are truth-apt), while normative statements express attitudes, commands, or commitments (they are not truth-apt in the same way). You cannot derive an expression of attitude from a statement of fact.
  *   **Status:** **Substantive and Defensible.**
  *   **Analysis:** This claims "is" and "ought" have different jobs. "Snow is white" describes the world; "You ought to tell the truth" prescribes action. Deriving one from the other is like trying to derive a question from a statement.
  *   **Distinctions:**
      *   *Instrumental Oughts:* This thesis struggles with hypothetical imperatives. If "You want to get well" (descriptive desire) and "Medicine cures you" (descriptive fact), "You ought to take medicine" looks like an "ought" derived from "is." Expressivists must argue this "ought" is just a shorthand for "I command you to take medicine given your desire."
  *   **Application to Dispute:** **This leaves Ravi untouched.** Ravi is likely a moral realist (believing fairness is a "genuine standard"). If Colleague 2 is an expressivist, they are talking past Ravi. Ravi thinks he is discovering a truth; Colleague 2 thinks he is expressing a preference. The slogan here signals a meta-ethical disagreement, not a refutation of Ravi's specific evolutionary claim.

  ### 4. The Epistemic Justification Thesis
  *   **The Claim:** You cannot justify a moral belief solely using empirical evidence. To be justified in believing "X is wrong," you need at least one moral principle (e.g., "Suffering is bad") that is not established empirically.
  *   **Status:** **Defensible.**
  *   **Analysis:** This is about *warrant*, not logic. Even if logic allowed the move, empirical science alone cannot certify moral truths. You need a moral axiom to get the moral engine running.
  *   **Distinctions:**
      *   *Relation to Naturalistic Fallacy:* Distinct. The Naturalistic Fallacy says the definition is wrong; this thesis says the *evidence* is insufficient.
      *   *Ravi's Counter:* This is exactly what Ravi is addressing when he says, "every normative view has to start from descriptive facts about what we care about." He is admitting he needs a starting desire/fact but claims that is sufficient for justification.
  *   **Application to Dispute:** **This creates a stalemate.** Colleague 2 is demanding a moral premise Ravi hasn't stated. Ravi is implying the moral premise is implicit in our nature ("what we care about"). If Ravi makes the premise explicit ("We ought to maximize evolutionary stability"), Colleague 2 can then attack *that* premise. The slogan here is a request for a missing premise, not a refutation.

  ### 5. The Motivational Internalism Thesis
  *   **The Claim:** Moral judgments are intrinsically motivating (to judge "I ought" is to be motivated to do it), whereas descriptive beliefs are not (to judge "It is raining" does not motivate action). Since descriptive facts cannot generate motivation on their own (Hume's theory of motivation), they cannot generate moral judgments.
  *   **Status:** **Substantive and Controversial.**
  *   **Analysis:** This relies on the Humean belief-desire psychology. Reason (Is) calculates; Passion (Ought) drives. You can't get drive from calculation alone.
  *   **Distinctions:**
      *   *Instrumental Oughts:* This thesis allows instrumental oughts. If you have a desire (passion), reason can tell you the "ought" of means. It blocks *categorical* oughts derived from pure reason/fact.
  *   **Application to Dispute:** **This supports Ravi's counter-argument.** Ravi says normativity starts from "what we care about" (desires/passions). If Colleague 2 uses this reading, they must admit that *if* we care about group survival, we can get an "ought." The dispute then shifts to whether we *do* care about that, or whether we *should* care about that. The slogan fails to kill the argument; it merely locates the source of normativity in desire.

  ### 6. The "No Bridge Principle" Thesis
  *   **The Claim:** There are no true substantive principles that link natural facts to moral facts (e.g., "Pain is bad" is not a necessary truth). Any such bridge is itself a moral claim, not a natural one.
  *   **Status:** **Substantive.**
  *   **Analysis:** This allows that you *can* get an ought from an is *if* you have a bridge, but insists the bridge itself cannot be derived from an is. It stops the regress.
  *   **Application to Dispute:** **This is the most charitable reading of Colleague 2.** They are telling Ravi: "Your evolutionary fact is an 'is'. Your conclusion is an 'ought'. You are missing the bridge (e.g., 'Evolutionary success is good'). And you cannot prove that bridge using evolution." This forces Ravi to defend the value of evolution, rather than assuming it.

  ---

  ### Diagnosis for Your Session

  To resolve the talking-past-each-other, you can propose the following mapping to the group:

  1.  **Colleague 2 is likely wielding Claim #2 (Metaphysical) or Claim #6 (No Bridge).** They believe Ravi is trying to define "Good" as "Evolutionarily Successful," which commits the **Naturalistic Fallacy**. For the slogan to "kill" Ravi's argument, Colleague 2 must be asserting that moral properties *cannot* be identical to evolutionary properties.
  2.  **Ravi is likely relying on Claim #4 (Epistemic) or Claim #5 (Motivational).** When he says "every normative view has to start from descriptive facts," he is correct that moral justification requires empirical input (we need to know what causes suffering, what promotes cooperation). He is treating the slogan as if it claims morality floats free of reality, which no one believes.
  3.  **The Mismatch:** Colleague 2 thinks Ravi is making a **Logical/Metaphysical** error (deriving value from fact without a bridge). Ravi thinks Colleague 2 is making an **Epistemic** error (thinking morality doesn't rely on facts).
  4.  **The Verdict on the Slogan:**
      *   If the slogan means **Claim #1 (Logical Entailment)**: It is trivial. Ravi just needs to add the premise "We ought to promote evolved dispositions."
      *   If the slogan means **Claim #2 (Metaphysical/Naturalistic Fallacy)**: It is substantive. Ravi is in trouble unless he can explain why evolutionary success *makes* something good, rather than just correlating with it.
      *   If the slogan means **Claim #7 (Instrumental Oughts)**: It is **False**. You *can* get an instrumental ought from an is (plus a desire). If Ravi's argument is hypothetical ("*If* we want society to survive, we ought to be fair"), the slogan does not apply.

  **Recommendation:** Ask Colleague 2 to specify if they are objecting to the *validity* of the argument (missing premise) or the *truth* of the reduction (Naturalistic Fallacy). Ask Ravi if he is claiming fairness is good *because* it evolved (reduction) or *that* it evolved, which supports an independent standard of fairness (evidence). The slogan is useful only if it forces Ravi to produce the bridge principle; it is destructive if it is used to imply morality has no connection to the natural world.
