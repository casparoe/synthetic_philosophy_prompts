      *   *Republican Constitution:* Separation of powers, representation, consent of citizens (crucial for war decisions).
      *   *Federation of Free States (Foetus Pacicum):* Voluntary association, *not* a world state (preserves state sovereignty/autonomy).
      *   *Cosmopolitan Right:* Universal hospitality (right to visit, not necessarily to settle/conquer), commerce as a bond.
      *   *Publicity Principle:* Actions affecting others must be compatible with public declaration (no secret reservations).
      *   *Autonomy of States:* States are moral persons; external coercion against a state is generally forbidden unless it violates right.
      *   *No Standing Armies:* (Relevant to weaponization).
      *   *No Interference:* One state cannot forcibly interfere in the constitution of another (even if it's bad).

