          *   Kant argues against standing armies and tools that make war "easy" or remove the citizen's stake. Autonomous weapons remove human agency/responsibility.
          *   *Verdict:* Highly Kantian (extends the spirit of no standing armies/agency).
      *   *2. Treaty negotiations must be public (drafts published).*
          *   Kant has a "Transcendental Formula of Public Right." Secret reservations are forbidden. However, Kant allows for diplomatic secrecy *during* negotiation to reach agreement, provided the *maxim* can be public. Publishing *drafts* before ratification might hinder the agreement.
          *   *Verdict:* Plausible but tricky (fits publicity, risks efficacy).
      *   *3. A world state with monopoly on force.*
          *   Kant explicitly rejects this ("soulless despotism"). He wants a federation, not a state of states.
          *   *Verdict:* Anti-Kantian (directly contradicts the text).
      *   *4. Wealthy states admit climate displaced as permanent residents.*
          *   Kant's "Hospitality" is a right to *visit*, not to *settle* without agreement. Permanent residence requires a specific contract. However, the *cause* (climate) isn't something Kant anticipated. The duty of preservation might push this, but strict right says no forced settlement.
          *   *Verdict:* Tension (fits cosmopolitan spirit, violates strict hospitality right).
      *   *5. No state may sell arms to a non-republic.*
          *   Kant wants republics to spread peace. But interfering in external relations of non-republics? Also, commerce is a bond for peace. Cutting off trade might cause war.
          *   *Verdict:* Problematic (risks interference/coercion).
      *   *6. Global tax funding international court with compulsory jurisdiction.*
          *   Kant wants an international court, but *voluntary* jurisdiction. Compulsory jurisdiction implies a super-state authority. Taxation implies coercion without representation.
          *   *Verdict:* Low Kantian fidelity (moves toward world state).
      *   *7. Military intervention to restore a republican constitution after a coup.*
          *   Kant is strict on non-interference. Even if a tyrant takes over, external force to "fix" it violates the autonomy of that state.
          *   *Verdict:* Anti-Kantian (violates non-interference principle).
      *   *8. Citizens must vote in a referendum before war.*
          *   Kant wants republican consent. He assumes representation. A referendum is a direct form of consent. It fits the "citizens must agree" principle perfectly.
          *   *Verdict:* Highly Kantian (operationalizes republican consent).

