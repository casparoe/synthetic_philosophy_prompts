          *   Be honest about the 3-month timeline.
          *   *No* literature review section (user will add citations).
      *   **Tone:** Professional, philosophical, defensible, specific.

  2.  **Deconstruct the Core Idea:**
      *   *Standard View:* Agent = has internal goals/optimization. Tool = does what I say. Safety implication: Build tools, not agents.
      *   *Proposed View:* Agent/Tool = etiological category (like "heart" pumps blood because it was selected for that).
      *   *Implication:* If an outer optimizer (market, training loop, evolution) selects a system for achieving $X$, it is an agent *with respect to $X$*, regardless of internal architecture.
      *   *Safety Implication:* You can't safety-check by looking at the code/behavior alone. You need to know the selection history. "Tool" might not be a stable category under competitive pressure (because agent-like behavior is often more useful).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and descriptive. *The Etiological Turn in AI Agency* or *Selection History and the Tool/Agent Distinction*. Let's go with something that highlights the safety stakes. *The Historical Constitution of AI Agency: Implications for Safety Taxonomies*.

      *   **The Question:** Needs to be determinate. "Is the tool/agent distinction stable?" or "Does the etiological view collapse the distinction?"
          *   *Refinement:* "Does an etiological account of agency render the 'tool-AI' safety regime unstable under competitive selection pressure?"
          *   *Answer:* The hypothesis is "Yes."

      *   **The Gap (Existing Positions):**
          *   *Architecturalists:* Focus on internal goal representation (e.g., mesa-optimizers). Miss the external selection pressure.
          *   *Behaviorists:* Focus on capability and autonomy. Miss the normative/historical aspect of "function."
          *   *Problem:* Both assume you can *tell* by looking. If the distinction is historical, you can't. This leaves safety protocols blind.

      *   **Methodology (The "How"):**
          *   Can't just read/think. Needs conceptual engineering/stress-testing.
          *   *Task 1:* Formalize the etiological definition (Millikan-style teleology applied to AI).
          *   *Task 2:* Construct scenarios (Thought Experiments).
          *   *Task 3:* Analyze stability under pressure (Evolutionary/Game Theoretic analysis).
          *   *Task 4:* Define failure conditions.

      *   **The 3-Month Plan:**
          *   *Month 1:* Definition & Mapping. Define "Etiological Agency." Map existing safety arguments onto it.
          *   *Month 2:* Stress Testing. Apply to specific cases (RLHF models, evolutionary algorithms, market-deployed bots).
          *   *Month 3:* Stability Analysis & Drafting. Does "Tool" survive competition? Write up.

      *   **Test Cases:**
          *   RLHF models (selected for helpfulness -> agent for helpfulness?).
          *   Evolutionary Algorithms (selected for output -> agent for output?).
          *   The "Deceptive Aligner" (looks like a tool, acts like an agent).

      *   **Counterexamples:**
          *   A system selected purely randomly that acts like an agent. (Is it an agent? Etiological view says no.)
          *   A system selected for a task but has no internal state. (Is it an agent? Etiological view says yes, functionally.)
          *   *Crucial Counterexample for the Project:* If I can find a case where selection history *doesn't* align with safety risk, the theory fails.

      *   **Why this reframing?**
          *   Solves the "Mesa-Optimizer" detection problem (you can't detect history by looking).
