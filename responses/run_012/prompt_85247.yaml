  Here is an analysis of the panel's decision-making patterns, the competing rules at play, and a prediction for the Maro case.

  ### The Competing Rules

  Based on the six prior cases, two distinct rules fit the record almost equally well, though they rely on different weights for the evidence.

  **Rule 1: The "Lemkin-Cultural" Standard (The Chair's Stated Rule)**
  *   **The Logic:** Genocide is defined by the intent to destroy a group's viability as a distinct unit, focusing on institutions, culture, and continuity rather than just body count.
  *   **Fit with Record:** This explains **Case 2** (genocide with hardly any killings due to cultural erasure) and **Case 6** (genocide with few killings due to forced conversion/shrine destruction). It also explains **Case 4** (class is not a "group" with a distinct cultural way of life in the Lemkinian sense) and **Case 5** (displacement leaves the group's culture intact elsewhere, so it's cleansing, not genocide).
  *   **Prediction for Maro:** **Genocide.** The burning of every village, church, and school constitutes the destruction of the group's "way of life" and institutions, satisfying the Lemkin standard regardless of the survival of individuals abroad.

  **Rule 2: The "Protected Group + Physical Threshold" Standard (The 1948 Hybrid)**
  *   **The Logic:** Genocide requires a 1948 Convention protected group (religious, ethnic, racial, national) *plus* a significant threshold of physical violence or irreversible removal, unless the cultural destruction is total and national in scope.
  *   **Fit with Record:** This explains **Case 1 & 3** (high killing + protected group). It explains **Case 4** (political class is not a protected group). It explains **Case 5** (regional displacement doesn't meet the "in whole or in part" physical destruction threshold). It *barely* explains **Case 2** (perhaps the 40-year duration substituted for the killing threshold).
  *   **Prediction for Maro:** **Ethnic Cleansing.** While the Maro are a protected group, the violence is regional (one province), and the survivors are driven out rather than exterminated nationally. Under this rule, this matches **Case 5** (regional homogeneity) more than **Case 1** (national extermination). The donor pressure reinforces this conservative reading.

  ### The Bet: Genocide

  I would bet on the panel classifying the Maro case as **Genocide**.

  **Why:**
  While the donor pressure is significant, the precedent set by **Case 2** is the anchor of the panel's credibility. In Case 2, the panel declared a situation with "hardly any killings" to be genocide solely based on cultural destruction (banning language, bulldozing shrines).

  If the panel rules "Ethnic Cleansing" for the Maro, they are admitting that burning *every* church and school and killing 40,000 people is *less* severe than the 40-year assimilation policy in Case 2. That contradiction would be intellectually indefensible and would expose the donor influence openly. Archives survive on their long-term reputation for consistency more than on any single donor relationship. To maintain the integrity of the "Lemkin" brand the Chair insists upon, they must follow the logic of Case 2 and Case 6.

  ### Closest Analog: Case 2

  **Case 2** is the closest analog, not Case 5.

  *   **Why not Case 5?** Case 5 was ruled "Ethnic Cleansing" because the primary mechanism was spatial removal ("driven out," "dispersed"). While the Maro are also being driven out, the *destruction of infrastructure* (burning every village, church, and school) mirrors Case 2 ("bulldozing shrines and cemeteries," "banning language").
  *   **The Key Similarity:** In both Case 2 and the Maro case, the intent is to make the group's continued existence *as a distinct cultural entity* impossible in that territory. In Case 5, the group remained distinct, just elsewhere. In Case 2 and the Maro case, the *institutions* that sustain the identity are being annihilated. Since Case 2 was ruled Genocide, the Maro case must be as well.

  ### The Test Case

  To determine which rule they are truly running (The Lemkin-Cultural Rule vs. The Protected-Group Rule), the archive should take up the following case next:

  **The "Political Cultural Erasure" Case:**
  > A government systematically destroys the libraries, union halls, and newspapers of a specific political opposition party, bans their political symbols, and forcibly re-educates their children to reject their parents' ideology. No mass killings occur, but the political group ceases to function as a distinct entity within the country.

  *   **If they call it Genocide:** They are following the **Chair's True Lemkin Rule**. They prioritize the "destruction of a way of life" over the 1948 protected group list (which excludes political groups).
  *   **If they call it Crimes Against Humanity:** They are following the **1948 Hybrid Rule**. They care about cultural destruction, but *only* for racial, religious, or ethnic groups. This would prove the Chair's rhetoric about "Lemkin's broader sense" is mostly talk, and the 1948 diplomatic accident (excluding political groups) is still the real gatekeeper.
