  1. **(1) vs. (7): The Information Paradox.** This is your logical breaking point. Principle (1) states withholding material facts invalidates consent because the choice wasn't truly informed. Case (7) says a dealer hiding a known engine fault is fine because "cars are a gamble." These cannot both be true. Either information asymmetry voids consent, or it doesn't. If you keep (1), (7) must go; the sale should be voidable. If you keep (7), (1) collapses into a rule against only explicit lying.
  *Cost:* Giving up (7) means ending "caveat emptor" in private sales. You'd need stronger consumer protections, treating car sales more like medical procedures regarding disclosure. This shifts the burden of honesty onto the seller, increasing trust but also litigation. It forces you to regulate private property transactions with the same rigor as bodily interventions, effectively erasing the line between commercial and informed consent.

  2. **(2) vs. (5): The Coercion Contradiction.** This is your philosophical breaking point. In (2), you argue that structural pressure ("back against the wall") invalidates consent because the alternative is unacceptable. In (5), you validate a plea deal where the alternative is twenty years in prison. That is the definition of a back against the wall. If poverty makes a kidney sale coerced, why doesn't the threat of decades in prison make a plea coerced?
  *Cost:* To save (5), you must weaken (2) by accepting the threat/offer distinction you rejected. You'd have to argue the prosecutor is offering a benefit (leniency) relative to a legal baseline, not threatening harm. To save (2), you must invalidate plea bargains entirely, which blows up the justice system. This tension is harder because it forces you to choose between systemic critique and practical reality. If you side with (2), you're an abolitionist; if you side with (5), you're a pragmatist.

  3. **(3) vs. (8): The Paternalism Problem.** Principle (3) demands a low capacity threshold; adults can make bad calls. Case (8) bans kidney sales even if the seller is happy and informed. This is pure paternalism. You are overriding their capacity because you dislike the choice, not because they lack ability.
  *Cost:* Keeping (8) requires admitting that some bodily autonomy is non-negotiable, regardless of consent. You have to argue that selling organs harms society or dignity in a way that outweighs individual liberty, contradicting your anti-paternalist stance in (3). This forces you into a "moral market" argument that feels distinct from your liberty-based arguments elsewhere, but only for kidneys.

  Tensions that dissolve
  Your worry about age cutoffs (medical vs. sex) isn't actually a contradiction. Capacity isn't one-size-fits-all; it's task-specific. A sixteen-year-old might understand antibiotics but lack the emotional maturity to navigate sexual power dynamics. You can consistently hold that capacity is a low threshold for low-stakes medical care but higher for high-stakes intimate acts. The law already does this; you're just mirroring functional competence.

  Similarly, (2) and (6) look like they clash but don't. You argue structural coercion invalidates consent, yet relationship sulking doesn't. The difference is the baseline of entitlement. A partner sulking is an interpersonal negotiation within a voluntary relationship; there's no structural power imbalance forcing the sex. Principle (2) targets systemic vulnerabilities (poverty, incarceration), not the ordinary friction of intimacy. As long as you define "back against the wall" as structural rather than interpersonal, (6) remains valid without undermining (2). The philosopher's worry here is likely a category error; you're mixing systemic coercion with relational pressure. One is about survival, the other is about comfort. Distinguishing them preserves your view that relationships involve compromise without validating exploitation.

  The cheapest fix
  Drop (7). It's the outlier. Your core philosophy hinges on informed autonomy (1) and anti-paternalism (3). The used-car intuition is just cultural habit ("buyer beware"), not a principled stance. Aligning (7) with (1) requires no philosophical gymnastics; you simply admit that fraud by omission invalidates contracts generally, not just in medicine.

  *Price Tag:* You lose the convenience of informal markets. Every private sale becomes a potential disclosure lawsuit. You also have to explain why we treat cars differently than houses (where disclosure is often mandatory). But this is a regulatory cost, not a moral one. It saves you from having to rewrite your theory of coercion (2) or defend hard paternalism (8). It's the only fix that doesn't require you to admit the philosopher was right about the threat/offer distinction. You keep your core integrity intact; you just stop defending used-car dealers.

  The price is practical friction. You become the person arguing that your neighbor lied about the transmission. It complicates private commerce. But philosophically, it's clean. It aligns your property views with your bodily views. Information is power; withholding it is coercion. By dropping (7), you unify your theory of consent across bodies and goods. You don't have to carve out exceptions for markets you dislike (kidneys) or systems you rely on (pleas). You just demand honesty everywhere. It's the path of least resistance for your worldview.
