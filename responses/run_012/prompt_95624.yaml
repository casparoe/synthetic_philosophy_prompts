      2. Commitments: User (Compositionality/Truth), Colleague (Action/Norm).
      3. Unit of Analysis: Shifting to "Practice" dissolves the binary.
      4. Progress: Not a winner, but a hybrid model.
      5. Vocabulary: "Normative Status."
      6. Verdict.

      *Let's tighten the "Verdict".*
      "Verdict: The dispute is a category error wherein you attempt to locate a unified social practice of subordination exclusively within either semantic content or pragmatic force."

