prompt: |-
  I'm an investigator at a regional ombudsman's office — we take complaints that the council or the housing association mishandled something, and roughly fifteen times a week I have to decide whether a complaint is upheld, not upheld or partly upheld, and then write the reasons so they survive being read by the council, the complainant, and occasionally a lawyer. I've got eight weeks from the day the complaint lands on my desk, no power to compel anything, my manager has to sign off on whatever gets published, and my two collegues have never read a word of philosophy. Everything we do is evidence: what I saw myself on a site visit, what the records show, what the complainant tells me, what the officer tells me, and what happened in the last case that looked like this one.

  I've been reading around Indian epistemology for a book group and got oddly intrested in the Nyāya school, because they seem to have built an entire apparatus for exactly this — deciding when a cognition counts as knowledge. Four means of knowing, as I understand it: perception, inference, analogy or comparison, and testimony; the idea that testimony only counts when the speaker is actually competent and the sentence is intelligible in the first place (I've seen the conditions given as something like expectation, compatibility and contiguity — don't hold me to the wording); a five-step way of laying out an inference — state the claim, give the reason, cite an example, apply it, draw the conclusion; and a checklist of the ways a reason goes wrong, which I've seen given as five but with variants — the reason that's equally compatible with the opposite conclusion, the one that actually proves the opposite, the one that quietly assumes what you're trying to show, the one that needs as much proof as the claim itself, the one that gets overridden by something you can see for yourself, and one that is literally just the evidence arrived too late. That last one is my entire job some weeks.

  What I want is something I can actually run: a one-pager, in order, that takes a complaint through the four means of knowing and then puts whatever inference I've built to the fault list, with each step saying what counts as enough to move on, where it stops with no case to answer, and where it hands the decision back to me as a judgement call rather than pretending the method made it. Write it for someone who's never heard of Nyāya and will be irritated if I make them learn Sanskrit — keep the distinctions that earn their place, drop the ones that don't, and tell me honestly where the analogy is doing too much work (I'm already suspicious about treating a case file as testimony and an earlier decision as analogy). Then run it on three complaints: a tenant who says a repair visit never happened while the council's log says it did; a resident who says she was never told about a planning decision when the file shows a letter sent to her old address; and the one where I'm fairly sure the method is going to make me write not upheld even though I'd bet money the complainant is telling the truth — because that's the case I need to see before I put this in front of the team on Monday. No reading list or citations, please, I won't follow them up; just tell me where I've mangled the ideas.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Investigator at a regional ombudsman's office.
      *   **Task:** Decides complaints (upheld, not upheld, partly upheld) based on evidence (site visits, records, testimonies, precedents).
      *   **Constraints:** 8-week deadline, no coercive power, manager sign-off, colleagues unfamiliar with philosophy. Needs a practical "one-pager" workflow.
      *   **Interest:** Indian Epistemology (Nyāya school). Specifically: Four Means of Knowing (*Pramāṇas*), conditions for Testimony, Five-Step Inference (*Avayavas*), and Fallacies of the Reason (*Hetvābhāsa*).
      *   **Goal:** A practical tool adapted from Nyāya for ombudsman work, tested on three specific case types.
      *   **Tone:** Pragmatic, professional, honest about limitations, no jargon/Sanskrit unless necessary (and explained), no reading lists.
      *   **Specific Warning:** Be honest where the analogy breaks down (especially regarding case files as testimony and precedents as analogy).

  2.  **Deconstruct Nyāya Concepts for the Context:**
      *   *Pramāṇas* (Means of Knowledge):
          1.  *Pratyakṣa* (Perception) $\rightarrow$ Site visits, photos, direct observation.
          2.  *Anumāna* (Inference) $\rightarrow$ Connecting evidence to conclusions (e.g., "no record implies no action").
          3.  *Upamāna* (Comparison/Analogy) $\rightarrow$ Precedents, similar past cases.
          4.  *Śabda* (Testimony) $\rightarrow$ Complainant statements, officer statements, official records/logs.
      *   *Conditions for Testimony:* Competence, intelligibility, expectation (*ākāṅkṣā*), compatibility (*yogyatā*), contiguity (*āsatti*).
      *   *Five-Step Inference:* Proposition, Reason, Example, Application, Conclusion.
      *   *Fallacies (*Hetvābhāsa*):* Contradictory, Proving the opposite, Circular, Unproven, Contradicted by perception, Untimely (too late).

  3.  **Drafting the "One-Pager" Workflow:**
      *   *Constraint:* Must be usable by colleagues who hate philosophy.
      *   *Strategy:* Translate Nyāya terms into Ombudsman speak, but keep the logical structure.
      *   *Step 1: Gather Evidence (The Four Sources).* Map Perception, Testimony, Inference, Analogy to concrete actions.
      *   *Step 2: Vetting Testimony.* Use the Nyāya conditions (Competence, Compatibility, etc.) as a checklist for statements.
      *   *Step 3: Building the Argument (The 5 Steps).* Simplify the *Avayavas* into a logical narrative flow.
      *   *Step 4: Stress Test (The Fallacies).* Use the *Hetvābhāsa* list to check for weak reasoning.
      *   *Step 5: The Decision Point.* Acknowledge where logic ends and judgment begins.

  4.  **Addressing the User's Suspicions (Critical Step):**
      *   *Case Files as Testimony:* In Nyāya, *Śabda* is reliable word of a trustworthy person. A log entry is technically testimony of the *writer*. If the writer is unknown or the system is flawed, reliability drops.
      *   *Precedents as Analogy:* *Upamāna* is usually about naming/recognizing things (e.g., "a gavaya is like a cow"). Using past cases is more like *Anumāna* (inductive inference) or legal *stare decisis*. I need to flag that Nyāya *Upamāna* is a stretch here, but the *logic* of comparison holds.

  5.  **Running the Three Cases:**
      *   *Case 1: Repair Visit (He said/She said + Log).*
          *   Perception: None (past event).
          *   Testimony: Tenant vs. Log.
          *   Inference: Log exists $\rightarrow$ Visit happened? (Fallacy risk: Log could be falsified/error).
          *   Outcome: Likely "Not Upheld" if log is robust, but highlight the "Untimely Evidence" fallacy if the log was created later.
      *   *Case 2: Planning Letter (Wrong Address).*
          *   Testimony: File says sent. Complainant says not received.
          *   Compatibility: Did they move? Did council check records?
          *   Inference: Sent to old address $\rightarrow$ Council followed procedure?
          *   Outcome: "Partly Upheld" (Procedural fault, but maybe no material injustice).
      *   *Case 3: The "Truth but No Proof" Case.*
          *   This is the crux. Nyāya requires *pramā* (valid knowledge). If it can't be established via the 4 means, it's not *pramā*, even if true.
          *   This aligns perfectly with Ombudsman work: We decide on *evidence*, not absolute truth.
          *   Outcome: "Not Upheld" (Insufficient evidence), acknowledging the limitation.

  6.  **Refining the Output:**
      *   *Tone Check:* Keep it sharp. No academic fluff.
      *   *Formatting:* Use bolding, lists, and clear headers to make it look like a "one-pager" (even if it expands slightly in chat).
      *   *Honesty:* Explicitly state where Nyāya doesn't fit (e.g., the nature of "Analogy").
      *   *Fallacies:* Map the Sanskrit concepts to modern logical errors (e.g., "Contradicted by perception" = "Ignored hard evidence").

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe keep the Sanskrit terms in brackets?
      *   *Correction:* User said "irritated if I make them learn Sanskrit." Use English terms primarily, maybe mention the concept origin briefly but focus on function.
      *   *Initial thought:* Treat the 5-step inference rigidly.
      *   *Correction:* That's too clunky for a report. Convert it to "The Narrative Arc" of the decision.
      *   *Crucial:* The user asked "tell me honestly where I've mangled the ideas." I need a specific section for this.
      *   *Crucial:* The user wants to see the "Truth but No Proof" case run through the method. This needs to demonstrate *why* the method forces a "Not Upheld" despite personal belief.

  8.  **Final Polish:** Ensure the distinction between "Knowledge" (Nyāya's goal) and "Finding" (Ombudsman's goal) is clear. Nyāya seeks liberation/truth; Ombudsman seeks administrative justice based on balance of probabilities. The tool works for the latter, but the metaphysical stakes are different.

  **(Self-Correction on the "One-Pager" constraint):** The prompt asks for "a one-pager... Then run it on three complaints." I will structure the response as the Tool first, then the Critique (where I mangled it), then the Case Runs.

  **(Refining the Fallacies):** The user listed specific fallacies. I should map them clearly:
      *   Equally compatible with opposite = *Satpratipakṣa* (Counter-balanced).
      *   Proves opposite = *Viruddha* (Contradictory).
      *   Assumes what you're trying to show = *Sādhyasama* (Unproven prover/Circular).
      *   Needs as much proof = *Asiddha* (Unestablished).
      *   Overridden by perception = *Bādhita* (Contradicted).
      *   Evidence arrived too late = *Kālātyayāpadista* (Untimely).
      *   *Translation:* I will use the English descriptions the user provided to ensure alignment.

  9.  **Final Plan:**
      *   **Section 1: The Workflow (The Tool).** Plain English, step-by-step.
      *   **Section 2: The Mangle (The Critique).** Where Nyāya differs from Ombudsman work.
      *   **Section 3: The Test Run (Three Cases).** Applying the tool.
      *   **Section 4: The Hard Truth (Case 3).** Addressing the "Truth vs. Proof" dilemma.

