answer: |-
  Here is the workflow adapted for your office, followed by the critique you asked for, and then the test run on your three cases.

  ### PART 1: THE INVESTIGATOR'S CHECKLIST (NYĀYA ADAPTED)

  **Step 1: Sort the Evidence (The Four Sources)**
  Don't mix them up. Label every piece of evidence in your file as one of these four. If it doesn't fit one, it's speculation.
  1.  **Direct Observation:** What you saw on site visit, photos, physical measurements. *(Strongest)*
  2.  **Official Record:** Logs, emails, signed forms, timestamps. *(Treated as Testimony of the System)*
  3.  **Witness Statement:** What the complainant or officer told you. *(Treated as Testimony of the Person)*
  4.  **Past Precedent:** How we ruled on similar cases before. *(Treated as Comparison)*

  **Step 2: Vet the Testimony (The Reliability Filter)**
  Before you believe a statement (from a person or a log), run it through this checklist. If it fails one, that evidence is weakened.
  *   **Competence:** Did the speaker know the facts? (e.g., Did the officer actually do the repair, or just tick the box?)
  *   **Intelligibility:** Is the statement clear and unambiguous?
  *   **Expectation:** Does the sentence feel complete? (e.g., "We sent the letter..." $\rightarrow$ Sent where? When?)
  *   **Compatibility:** Does it contradict known facts? (e.g., "We visited on Tuesday" vs. "Staff roster shows no one working Tuesday".)
  *   **Contiguity:** Was the record made at the time, or added later? (Gap in time reduces reliability.)

  **Step 3: Build the Argument (The Five-Step Flow)**
  When writing your reasoning, ensure your logic follows this chain. If a link is missing, the decision is vulnerable.
  1.  **The Claim:** What are we deciding? (e.g., "The Council failed to repair.")
  2.  **The Reason:** What evidence supports this? (e.g., "The damp persists and no invoice exists.")
  3.  **The Rule:** What is the general principle? (e.g., "Repairs require a visit and an invoice.")
  4.  **The Application:** How does the evidence fit the rule? (e.g., "No invoice means no visit occurred.")
  5.  **The Conclusion:** Therefore, the complaint is Upheld.

  **Step 4: Stress Test the Reason (The Fault List)**
  Before signing off, check your "Reason" (Step 2 above) against these six errors. If you spot one, you cannot uphold the complaint on that basis.
  *   **The Split Reason:** The evidence supports the opposite conclusion just as well. (e.g., "No invoice" could mean "No visit" OR "Admin error".)
  *   **The Contradictory Reason:** The evidence actually proves the opposite. (e.g., Claiming "No visit" while holding a photo of the worker at the door.)
  *   **The Circular Reason:** You assume the fact you are trying to prove. (e.g., "They didn't visit because they are negligent.")
  *   **The Unproven Reason:** The evidence itself needs proving. (e.g., "The log is fake" $\rightarrow$ Do you have proof the log is fake?)
  *   **The Ignored Fact:** Your conclusion is contradicted by Direct Observation. (e.g., Concluding "No repair" when you saw the new boiler yourself.)
  *   **The Late Evidence:** The reason relies on information that wasn't available or relevant at the time of the decision. (e.g., Judging a 2020 decision based on a 2023 policy.)

  **Step 5: The Judgment Call**
  If you pass Steps 1–4 and still have doubt, mark it here. This is where the method stops. You are not a court; you are balancing probabilities. If the evidence is equally weighted, the benefit of the doubt goes to the administrative body unless their process was flawed.

  ***

  ### PART 2: WHERE YOU MANGLED THE IDEAS (HONEST CRITIQUE)

  You asked for honesty. Here is where the Nyāya framework stretches too thin for ombudsman work.

  **1. Testimony vs. Records**
  In Nyāya, *Testimony (Śabda)* relies on the trustworthiness of a *person* (a sage or expert). You are treating council logs as testimony. This is risky. A log is not a person; it is a trace. In Nyāya terms, a log is closer to *Inference* (inferring an action took place because a mark exists) than Testimony. If you treat a log as "Trustworthy Word," you give the Council too much credit. Treat logs as *Inference* markers: they suggest an action occurred, but they are not the action itself.

  **2. Analogy vs. Precedent**
  Nyāya *Comparison (Upamāna)* is about naming and recognition (e.g., "This animal is a gavaya because it resembles the cow the forester described"). Using past ombudsman decisions is not really *Comparison*; it is *Inductive Inference*. You are arguing: "In Case A, X led to Y. In this Case, X is present. Therefore Y should follow." Calling it "Analogy" might make your colleagues think you are arguing by metaphor rather than by consistency. Keep the logic of precedent, but don't call it Nyāya analogy.

  **3. The Goal of "Knowledge"**
  Nyāya aims for *Pramā* (valid knowledge of reality). You aim for *Administrative Justice*. Sometimes, something is "True" (the tenant is telling the truth) but not "Knowledge" (you cannot prove it). Nyāya would say you simply don't *know* it happened. Your office has to issue a verdict anyway. The method forces you to admit you lack *Pramā*, which leads to "Not Upheld." This is correct for your job, but it feels morally uncomfortable. The tool works, but it won't fix the feeling of injustice.

  ***

  ### PART 3: THE TEST RUN

  Here is the method applied to your three scenarios.

  #### CASE 1: The Repair Visit (Tenant says "No" vs. Log says "Yes")

  *   **Step 1 (Sources):**
      *   Tenant Statement: Testimony.
      *   Council Log: Record (treated as Inference of action).
      *   Direct Observation: None (event is past).
  *   **Step 2 (Vet Testimony):**
      *   Tenant: Competent (was home), Intelligible.
      *   Log: Competence unknown (who typed it?), Contiguity questionable (typed same day or end of week?).
  *   **Step 3 (Argument):**
      *   Claim: Council failed to visit.
      *   Reason: Tenant says no one came; no physical trace of entry.
      *   Rule: Visits leave traces (keys, notes, invoices).
      *   Application: No traces found.
      *   Conclusion: Visit likely didn't happen.
  *   **Step 4 (Stress Test):**
      *   *The Split Reason:* The Log exists. Does the Log prove visit? Or does Tenant word prove no visit? Both are equally compatible with "Admin Error."
      *   *The Unproven Reason:* To say the Log is wrong, you need proof the Log is unreliable. Do you have it? No.
  *   **Step 5 (Judgment):**
      *   **Decision:** Not Upheld.
      *   **Reasoning:** The Council produced a contemporaneous record. The Complainant produced a denial. Without evidence of systemic log-falsification, the official record carries the weight of regularity.
      *   **Note:** The method holds. It protects the office from accusing the council of lying without proof.

  #### CASE 2: The Planning Letter (Sent to Old Address)

  *   **Step 1 (Sources):**
      *   File Record: Shows letter sent to Address A.
      *   Complainant: Lives at Address B at time of sending.
      *   Council Policy: "Update records upon notification."
  *   **Step 2 (Vet Testimony):**
      *   File Record: Compatible with Council procedure.
      *   Complainant: Compatible with bank records/ID (proves residence at B).
      *   *Compatibility Check:* Did Complainant tell Council of move? If yes, Council Record fails Compatibility (should match new address). If no, Complainant fails Expectation (duty to inform).
  *   **Step 3 (Argument):**
      *   Claim: Council failed to notify correctly.
      *   Reason: Letter went to Address A; Complainant lived at Address B.
      *   Rule: Council must use most recent known address.
      *   Application: Council used old address despite notification on file (or lack thereof).
      *   Conclusion: Procedural fault.
  *   **Step 4 (Stress Test):**
      *   *The Ignored Fact:* Did the decision materially affect the outcome? (If they would have objected anyway, is it a fault?)
      *   *The Late Evidence:* Don't judge based on where they live *now*, only where they lived *then*.
  *   **Step 5 (Judgment):**
      *   **Decision:** Partly Upheld.
      *   **Reasoning:** The Council followed their data, but their data was outdated. If the Complainant notified them previously, the Council is at fault (Inference: System failure). If the Complainant didn't notify, the Council is clear (Inference: Complainant failure).
      *   **Nuance:** The method forces you to check the *notification date* vs. *move date*. This is the pivot point.

  #### CASE 3: The "Truth but No Proof" (The one you dread)

  *   **Scenario:** Complainant says Officer was rude/threatening during a home visit. No recording. No witness. Officer denies. No prior history of complaints against Officer. You believe the Complainant (gut instinct, micro-expressions, inconsistency in Officer's timeline).
  *   **Step 1 (Sources):**
      *   Complainant: Testimony.
      *   Officer: Testimony.
      *   Direct Observation: None (you weren't there).
  *   **Step 2 (Vet Testimony):**
      *   Complainant: Competent, but emotional state may affect Intelligibility.
      *   Officer: Competent, but self-interested.
      *   Compatibility: No corroboration for either.
  *   **Step 3 (Argument):**
      *   Claim: Officer misconduct.
      *   Reason: Complainant testimony.
      *   Rule: Misconduct requires evidence beyond assertion.
      *   Application: Assertion vs. Denial.
      *   Conclusion: Insufficient evidence.
  *   **Step 4 (Stress Test):**
      *   *The Split Reason:* The situation is one person's word against another. The evidence is equally compatible with "Officer was rude" and "Complainant is sensitive/misremembering."
      *   *The Unproven Reason:* Your "gut instinct" is not a *Pramāṇa* (Means of Knowledge). It is not Perception, Inference, Comparison, or Testimony. It is *doubt* (*saṃśaya*).
  *   **Step 5 (Judgment):**
      *   **Decision:** Not Upheld.
      *   **Reasoning:** While the Complainant's distress is noted, there is no objective evidence to substantiate the claim of misconduct against the weight of the Officer's denial.
      *   **The Hard Truth:** The Nyāya method forces you to write this. It validates your decision to reject the case *even if you believe them*. Why? Because Nyāya distinguishes between *Truth* (what happened) and *Valid Knowledge* (what can be established). Your office cannot act on Truth alone; it must act on Valid Knowledge.
      *   **Manager Sign-off:** This is the safest decision for your manager. It is defensible in court. It is emotionally painful. The tool does not fix the pain; it just ensures the logic is sound.

  ### SUMMARY FOR YOUR TEAM MEETING

  Tell your colleagues: "I found a logic checklist that forces us to separate what we *feel* is true from what we can *prove* is true. It stops us from making assumptions about logs and precedents. It doesn't make the job easier, but it makes the decisions harder to overturn."

  Use the **Fault List (Step 4)** as your peer review tool. Before you send a draft to your manager, ask: "Is my reason Split? Is it Circular? Is it Ignoring a hard fact?" If you clear those hurdles, the decision stands.
