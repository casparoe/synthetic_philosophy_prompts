answer: |-
  Your friend's "objective/subjective coin" analogy is the standard orthodox Marxist elevator pitch, but your intuition that it's "too neat" is correct. In Marx's own intellectual development, these concepts actually pull in different directions.

  Here is the breakdown of how they function, where they overlap, and where the analogy breaks.

  ### 1. The Core Definitions
  To compare them, we have to strip away the moralizing and look at the mechanics.

  *   **Exploitation is a flow metric.** It is a technical description of value transfer. In Marx's accounting, if you produce \$500 of value in a day, and you are paid \$300 (subsistence + market rate), the remaining \$200 is *surplus value*. If that \$200 goes to someone who did not labor (a shareholder, a landlord, a platform owner), exploitation has occurred. It doesn't matter if you are happy, rich, or love your job. It is a claim about **ownership of the output**.
  *   **Alienation is a state of relation.** It is not just "feeling sad." It is an ontological claim about your connection to reality. Marx argues humans define themselves through their creative output. If you do not own what you make, do not control how you make it, and compete against other humans rather than collaborate, you are objectively **disconnected from your agency**. It is a claim about **control of the process**.

  ### 2. Running Your Edge Cases
  Your thought experiments are the best way to test if they are independent variables.

  **Case A: Alienation without Exploitation (The Hobby)**
  *   *Scenario:* You code a hobby project. No one pays you. No surplus is extracted. But you feel burnt out, the code feels like a burden, and you hate the maintenance.
  *   *Verdict:* **Possible.**
  *   *Why:* Marx ties alienation specifically to *waged labor* and the *division of labor*. However, the *mechanism* of alienation (loss of control over the product) can happen without wage exploitation. If you start a hobby project but feel compelled to finish it due to social pressure (e.g., open source expectations), you have lost control of the activity.
  *   *The Break:* A strict Marxist would say this isn't "Alienation" in the technical sense, because you aren't selling labor power. But phenomenologically, the experience is identical. This suggests Alienation is a broader human condition that Capitalism exacerbates, whereas Exploitation is specific to the wage relation.

  **Case B: Exploitation without Alienation (The Happy Dev)**
  *   *Scenario:* You work at a FAANG company. You are paid \$400k. You produce \$1M in value. You love the team, the code, and the product.
  *   *Verdict:* **Exploitation exists; Alienation is debatable.**
  *   *Why:* Technically, \$600k surplus was extracted. That is Exploitation. But are you Alienated? Subjectively, no. Objectively? Marx would say **yes**. Why? Because if the shareholders decide to pivot the product to something you hate, or lay you off to boost stock price, you have zero say. Your connection to the product is contingent on their permission.
  *   *The Break:* This is where your friend's "subjective" definition fails. For Marx, Alienation isn't just how it *feels*; it's the structural reality that you can be severed from your work at any moment. You can be an exploited worker who *doesn't feel* alienated (false consciousness), but you are still structurally alienated.

  **Case C: The Co-op / Open Source Foundation**
  *   *Scenario:* A worker-owned co-op or a paid open-source maintainer team.
  *   *Exploitation:* If the workers own the surplus collectively, **capitalist exploitation is zero.** There is no external class extracting value. However, if the co-op must compete in a capitalist market, they may be forced to exploit *themselves* (work longer hours, cut safety) to survive. Marxists call this "self-exploitation," but it lacks the class antagonism of standard exploitation.
  *   *Alienation:* Does it disappear? **No.**
  *   *Why:* Because the co-op still operates within a capitalist market. They do not control the market demand. If the market shifts, they must shift or die. They are still alienated from the *totality* of the economic system. They control their factory, but not the ecosystem.
  *   *The Break:* This proves Alienation is the deeper, stickier concept. You can engineer away Exploitation (by changing ownership), but you cannot easily engineer away Alienation (because it requires changing the entire market system and division of labor).

  ### 3. Moral Accusation vs. Technical Description
  You asked if Exploitation is moral or technical.
  *   **Exploitation is Technical.** It is meant to be a physics of economics. Just as an engine converts fuel to motion with some heat loss, capitalism converts labor to capital with some surplus extraction. Calling it "exploitation" implies a moral judgment, but the *theory* works even if you don't think it's wrong. It explains *why* capitalists must compete to lower wages or automate: if they don't extract maximum surplus, they are outcompeted by those who do.
  *   **Alienation is Moral/Existential.** It relies on a specific view of human nature (that humans are meant to be creative, social agents). If you reject that view of human nature, Alienation collapses into "dissatisfaction."

  **The Co-op Implication:**
  If Exploitation is technical, saying a co-op "exploits itself" is a category error. You cannot steal from yourself. But if the co-op members vote to work 80 hours a week to survive market competition, they are technically free but existentially trapped. This shows that **Alienation is the deeper diagnosis.** Exploitation is just the specific mechanism capitalism uses to generate Alienation.

  ### 4. Which is Foundational?
  This is the crux of your question. Is Alienation the engine, or is Exploitation the engine?

  **In Early Marx (Humanist):** Alienation is foundational. Capitalism is bad because it distorts human nature. Exploitation is just one symptom of that distortion.
  **In Late Marx (Scientific):** Exploitation is foundational. Capitalism is a system of accumulation. Alienation is the cultural/psychological exhaust fumes produced by that engine.

  **The Engineering Analogy:**
  *   **Exploitation is the Architecture.** It describes the data flow. Who owns the database? Who has write access? Who gets the logs? This determines the system's behavior.
  *   **Alienation is the User Experience (UX).** It describes what it's like to interact with the system. Is the UI responsive? Do you feel in control? Or are you clicking buttons that trigger opaque backend processes?

  **Where the Analogy Breaks:**
  In software, you can have good UX on top of bad architecture (for a while). You can have a happy worker in an exploitative system.
  But in Marx's theory, the Architecture (Exploitation) *determines* the UX (Alienation) in the long run. You cannot have a truly non-alienated experience on top of an exploitative architecture, because the ownership structure means your agency is always revocable.

  ### Summary Verdict
  Your friend is half-right, but misses the hierarchy.

  1.  **They are distinct.** You can technically have one without the other (e.g., a slave might not be "exploited" in the surplus-value sense if the master consumes everything directly, but is maximally alienated; a co-op might eliminate exploitation but retain alienation due to market pressure).
  2.  **Exploitation is the Mechanism.** It explains how the system *runs* and why it expands.
  3.  **Alienation is the Cost.** It explains why the system is *unlivable* and why people might want to change it.
  4.  **Foundational Work:** **Exploitation** is the foundational *economic* concept. **Alienation** is the foundational *philosophical* concept.

  If you are analyzing **market dynamics**, Exploitation is the tool.
  If you are analyzing **human welfare**, Alienation is the tool.

  The "coin" analogy fails because you can mint a coin with only one side. You can have a system that extracts surplus (exploitation) but manages to keep workers content through high wages and culture (masking alienation). But you cannot have a system that eliminates alienation (total human agency) while maintaining capitalist exploitation (loss of agency to capital). Therefore, **Alienation is the deeper condition; Exploitation is the specific capitalist implementation of it.**
