answer: |-
  **FINAL EXAMINATION: POLITICAL PHILOSOPHY SEMINAR**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**
  Critically evaluate the moral adequacy of the 2021 Resolution and Memorial described in the case above. In your answer, you must address:
  1.  The condition of state continuity required for the standing to apologize;
  2.  The effect of the liability disclaimer on that claimed continuity; and
  3.  Whether the unresolved land claims render the expression of regret merely symbolic or substantively defective.

  ***

  **EXAMINER'S NOTES & MODEL ANSWER**

  **Model Answer**
  *(Approx. 600 words)*

  The 2021 Resolution is morally defective because it attempts to secure the moral standing of a continuous agent while simultaneously denying the material responsibilities that attach to that same continuity. It treats state identity as optional: invoked when moral credit is available, discarded when material cost is due.

  To apologize sincerely, an agent must claim ownership of the past wrong. For a state, this requires a claim of continuity: the current state must identify itself as the same moral agent as the state that enacted the 1957 resettlement programme. Without this continuity, the expression of "regret" is merely an observation of historical fact, akin to one person regretting another person's actions. By stating "This House records its deep regret," the legislature implies a relationship of responsibility. It positions the current state as the appropriate entity to acknowledge the suffering, thereby claiming the standing that only continuity provides. It seeks the moral repair that comes from being the one to say "we did this."

  However, the Resolution explicitly severs the link between this moral acknowledgment and legal liability. The disclaimer stating the resolution creates "no legal liability... and is not to be construed as an admission of unlawful conduct" attempts to halt the flow of responsibility at the symbolic level. This creates a contradiction. If the state is continuous enough to owe an apology, it is continuous enough to inherit the obligations generated by the past conduct. To deny liability is to deny the very continuity required to make the apology meaningful. The state is effectively arguing that it is the same agent regarding the *speech act* of apologizing, but a different agent regarding the *consequences* of the act. This instrumentalizes the apology, using it to close the moral book without opening the legal one.

  This contradiction is exacerbated by the ongoing nature of the harm. The case notes that a land registration law from the period remains in force, keeping descendants off the land. This indicates that the wrong is not merely historical but structural and ongoing. An apology typically presupposes a completed wrong; it is a response to a past breach. Here, the state is apologizing for suffering while actively maintaining the legal architecture that perpetuates the dispossession. The memorial's description of the programme as a "difficult chapter" suggests a closed narrative, yet the court case proves the chapter is still being written.

  Consequently, the Resolution functions not as an apology, but as a substitution for one. It offers symbolic recognition to dampen the demand for material restitution. Because the land claims remain unresolved, the "regret" offered is cheap; it costs the state nothing while asking the victims to accept a symbolic closure they have explicitly rejected. Some descendants call it an insult because it asks them to accept moral acknowledgment while denying them material justice.

  Therefore, the Resolution is inadequate. A state cannot invoke continuity to claim the standing to apologize and simultaneously deny continuity to escape liability. Where the harm is ongoing, as evidenced by the land claims, apology is insufficient without restitution. The state must either repeal the offending law and restore title, accepting the liability that comes with continuity, or refrain from claiming the moral standing of the apologizer. To do both is to engage in a form of moral bad faith that undermines the possibility of genuine repair.

  ***

  **MARKING SCHEME**

  **1. State Continuity and Standing (4 Marks)**
  *   **Requirement:** Candidate explains that for a state to apologize, it must claim identity/continuity with the past wrongdoer.
  *   **Common Error:** Treating "state continuity" as a metaphysical abstract rather than a condition for moral standing.
  *   **Marks:** 4 for clear link between continuity and standing; 2 for mentioning continuity without linking to standing; 0 for ignoring.

  **2. The Liability Disclaimer (4 Marks)**
  *   **Requirement:** Candidate analyzes the disclaimer as an attempt to deny continuity/obligation to avoid cost.
  *   **Common Error:** Discussing the disclaimer only as a legal technicality rather than a moral negation of the apology.
  *   **Marks:** 4 for analyzing the moral function of the disclaimer; 2 for describing the legal effect only; 0 for ignoring.

  **3. The Contradiction (4 Marks)**
  *   **Requirement:** Candidate identifies the incompatibility: you cannot claim continuity for credit and deny it for cost.
  *   **Common Error:** Listing continuity and liability as separate "pros and cons" rather than conflicting claims.
  *   **Marks:** 4 for explicit identification of the contradiction; 2 for noting tension without resolving it; 0 for missing the link.

  **4. The Material Context (Land Claims) (4 Marks)**
  *   **Requirement:** Candidate argues that ongoing harm (the law still in force) undermines the "historical" nature of the apology.
  *   **Common Error:** Treating the land claim as a separate issue from the adequacy of the apology.
  *   **Marks:** 4 for integrating the land claim into the critique of the apology; 2 for mentioning the claim separately; 0 for ignoring.

  **5. Apology vs. Restitution (4 Marks)**
  *   **Requirement:** Candidate concludes that apology is the wrong category without material repair (restitution).
  *   **Common Error:** Concluding that the apology is "good but insufficient" rather than structurally defective.
  *   **Marks:** 4 for arguing apology is defective/substitutionary without restitution; 2 for saying it is merely incomplete; 0 for accepting the apology as valid.

  **Total:** 20 Marks

  **Distinguishing an A from a Solid B:**
  A solid B student will identify the tension between continuity and liability as a difficult problem; an A student will demonstrate that the state's position is structurally incoherent because it relies on the same premise (continuity) to justify both the apology and the disclaimer.
