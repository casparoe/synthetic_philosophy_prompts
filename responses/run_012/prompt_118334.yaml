answer: |-
  ### What he'd recognise as the issue
  Engels sees this not as a bioethical puzzle but as the logical endpoint of bourgeois property relations invading the womb. The core issue is whether reproduction remains a private economic transaction or becomes a social function liberated from market coercion.

  ### His calls
  He'd reject the California market outright; it is prostitution of the species, turning children into inheritable assets and wombs into factories under contract law. The German/French bans are bourgeois morality masking property protection, preventing the poor from selling while the rich adopt offshore or travel. The UK model is hypocritical, pretending altruism hides the economic desperation driving the surrogate; unpaid labor is still exploited labor. He files this under prostitution, not because of sex, but because it is the sale of bodily integrity for economic survival under private property. The new state-regulated draft is interesting: by removing the private purchaser and allowing withdrawal, it mimics the socialization of reproduction he demanded. However, if it remains a stopgap within capitalism, it's merely a state-managed wet-nursing trade. He'd support the withdrawal clause as a rejection of property rights over the body, but view the payment as a necessary compensation until domestic labor is fully socialized. He sees the new draft as a transitional demand, superior to the market but insufficient without the abolition of the individual family unit. Ultimately, he judges all models by whether they reinforce the family as an economic unit or dissolve it into public industry.

  ### The rule I think he's running, and where it strains
  The rule is: does this transaction reinforce the family as an economic unit of property transmission? Engels flattens selling labor (pregnancy) and selling the product (child) because under capitalism, both reduce human relations to cash relations. This flattening is a feature, not a gap; it highlights that the worker owns nothing, not even their reproductive capacity. The strain appears with the new draft's withdrawal clause. If the surrogate keeps the baby, the contract isn't for the child but for the service. Engels would welcome this distinction as it breaks the property right over the offspring. However, his framework strains because he assumes socialized childcare eliminates the *need* for such contracts entirely. He lacks a theory for voluntary assisted reproduction outside economic coercion. He presumes all surrogacy is coerced by property; he cannot easily conceive of a non-coercive desire for genetic lineage without private property.

  ### Where I'd bet wrong
  I leaned hardest on extrapolating his hatred of bourgeois marriage to surrogacy, assuming he views all reproduction under capitalism as inherently coercive. For the verdict to flip, he would need to view adoption and abortion as fully socialized rights, decoupled from property inheritance and stigma. If adoption were universal, surrogacy's necessity changes. One concrete fact changing my mind: if data showed surrogates were predominantly wealthy women choosing this for autonomy rather than economic necessity, his coercion thesis collapses. He might see the new draft as a step toward communal child-rearing if the state assumes responsibility.
