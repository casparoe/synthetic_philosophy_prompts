answer: |-
  This is a sophisticated stalemate, and your hypothesis is the most interesting move made at the table so far. You are right to suspect that the surface argument (about voting) is masking a deeper structural disagreement (about action and causation). However, your diagnosis is half-right and half-misplaced.

  Here is the diagnosis of your group's deadlock, grounded in what your friends are actually saying, followed by a verdict on whether this is resolvable.

  ### 1. The Diagnosis: It is a Category Error, not a Verbal Dispute

  This is not merely a verbal dispute about the word "rational," nor is it purely empirical. It is a **category error regarding the teleology of action**.

  Your friends are arguing past each other because they are operating with three incompatible maps of human agency:

  *   **The Calculus Camp (Instrumental Rationality):** They assume the *only* reason to act is to bring about a specific state of affairs (Candidate X wins). For them, causation is strictly **counterfactual** ("But-for" causation). If the world looks the same without your action, the action has zero causal power.
  *   **The Expressive Camp (Value Rationality):** They assume action can be an end in itself. Voting is a consumption good, like cheering at a football game. You cheer not to change the score, but to affirm allegiance. Causation is irrelevant here; the utility is internal to the act.
  *   **The Reductio Camp (Model Validity):** They assume that if a model predicts $X$ (no voting) and reality shows $\neg X$ (voting), the model is falsified. They aren't trying to save the theory; they are trying to bury it.

  **Your INUS hypothesis** attempts to bridge the Calculus and Reductio camps by expanding the definition of causation. You are arguing that the Calculus camp is using a definition of "making a difference" (marginal pivotality) that is too narrow.

  **Where your hypothesis hits the mark:**
  You are correct that the Calculus camp relies on a "marginalist" view of causation (did I flip the bit?). The INUS (Insufficient but Necessary part of an Unnecessary but Sufficient set) or "constitutive" view argues that being part of the winning coalition *is* a causal contribution, even if you weren't the margin. This validates the intuition that "my vote counts" without requiring you to be the tie-breaker. This effectively answers the Reductio friend: the theory of rationality isn't broken, the theory of *causation* inside the rationality model was too thin.

  **Where your hypothesis misses:**
  It does not actually save the **Expressive** argument (your position). Expressive voting explicitly *abandons* the claim that the vote causes the outcome. The Expressive voter says, "I don't care if I cause the win; I care that I stood for the winner."
  *   The INUS argument says: "You *did* help cause the win, you just don't see how."
  *   The Expressive argument says: "Whether I helped cause the win is irrelevant to why I'm here."

  By pushing the INUS line, you are actually drifting toward the Reductio camp (fixing the instrumental calculus) and away from the Expressive camp (abandoning the instrumental calculus). Your friends sense this, which is why the "Cop-out" friend accuses you of relabeling. They think you are trying to have it both ways: claiming the vote is expressive (non-instrumental) while using INUS to justify it instrumentally.

  ### 2. Is the Question Ill-Posed?

  The question "Is voting rational?" is ill-posed because it conflates two distinct questions:

  1.  **The Empirical Question:** "What utility function do actual voters maximize?" (Do they care about outcomes, duty, or expression?)
  2.  **The Normative Question:** "Ought a rational agent, *given* a specific utility function, to vote?"

  The Calculus friend is answering Question 2 (assuming Outcome Utility). The Expressive friend is answering Question 1 (asserting Expression Utility). The Reductio friend is attacking the premise of Question 2.

  As long as you argue "Should I vote?" without specifying "Should I vote *in order to achieve what*?", you will loop forever.

  ### 3. What Counts as Progress?

  You should not give up, but you must change the terrain. The argument will not resolve through more intuition pumping about ties and margins. Progress requires one of the following three moves:

  **A. The Formal Distinction (The "R" Term)**
  You need to formally separate the utility function. The standard Downsian equation is:
  $$ R = PB - C $$
  (Where $P$ = probability of pivotality, $B$ = benefit of outcome, $C$ = cost).
  The paradox exists because $PB < C$.
  Progress happens when you agree to expand the equation to:
  $$ R = PB + D - C $$
  Where $D$ is the "citizen duty" or "expressive" term.
  *   **The Win Condition:** If the Calculus friend admits that $D$ can exist *within* a rational choice framework, the paradox dissolves. It becomes an empirical question about the size of $D$, not a theoretical paradox. If they insist $D$ is irrational, you have exposed that their definition of "rational" is "sociopathic" (outcome-only), which is a philosophical concession on their part.

  **B. The Empirical Check (Belief vs. Reality)**
  The Calculus argument assumes voters *believe* $P$ (probability of pivotality) is the driver.
  *   **The Win Condition:** Cite empirical literature (e.g., Blais, 2000; Edlin et al., 2007) showing that voters *know* they aren't pivotal but vote anyway. If the Calculus friend insists they are voting to change the outcome *despite knowing* they won't, they are arguing for systematic delusion. If they admit voters know $P \approx 0$, they must concede the motivation is non-instrumental ($D$), which validates the Expressive position.

  **C. The Causal Clarification (Your INUS Move)**
  Lean into your causation point, but refine it. Don't use it to justify Expressive voting; use it to justify **Collective Rationality**.
  *   **The Win Condition:** Argue that the "unit of rationality" is not the individual voter but the *coalition*. If a specific coalition of 1,000 voters is sufficient to win, and you are one of them, your withdrawal might not lose the election (if the coalition is larger than needed), but it degrades the *mandate*. If your friends agree that "margin of victory" has utility (political capital), then $P$ is no longer astronomically small; it is the probability of affecting the *margin*, which is much higher than the probability of breaking a tie. This saves the Instrumental view without needing Expressive hand-waving.

  ### 4. Verdict

  Your hypothesis is the **right diagnostic tool**, but you are applying it to the wrong patient.

  *   **The INUS/Causation argument** kills the **Calculus Camp's** definition of impact. It shows their model of the world is empirically false (causation isn't just pivotality).
  *   **The Expressive argument** kills the **Calculus Camp's** definition of utility. It shows their model of human motivation is empirically false (we value things other than outcomes).

  **Recommendation:**
  Tell your friends you are shifting the debate. Stop asking "Is voting rational?" and start asking "What kind of rationality are we testing?"

  1.  If we mean **Instrumental Rationality** (maximizing outcome probability), then voting is irrational *unless* we accept your INUS/margin argument.
  2.  If we mean **Broad Rationality** (maximizing total utility including expression), then voting is trivially rational, and the "Paradox" is just a failure to specify the utility function.

  If the Calculus friend refuses to accept #2, they are no longer arguing about voting; they are arguing for a specific, restrictive philosophical definition of rationality that excludes duty, identity, and expression. That is a defensible position, but it renders their theory useless for describing actual human behavior.

  **Don't give up.** You have the leverage. The "Paradox of Voting" is widely considered solved in political science (by adding the $D$ term). The only reason it persists in philosophy circles is that philosophers love a paradox more than a solution. Force them to admit that either (a) voters are irrational, (b) the model is wrong, or (c) "rationality" includes non-outcome values. Once they pick one, the argument ends.
