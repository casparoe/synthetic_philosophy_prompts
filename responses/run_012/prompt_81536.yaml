  **Title:** The Budget Paradox
  **Characters:** Alex (The Philosopher), Blake (The Skeptic)
  **Time:** ~45 seconds

  **Alex:** "The club budget is gone, but I don't believe it."
  **Blake:** "That's Moore's Paradox. It's not false, it's just unassertable. You sound insane."
  **Alex:** "Okay, how about 'The budget is gone, but I *believe* it's not'?"
  **Blake:** "The cousin version. Different logical error, still sounds insane."
  **Alex:** "Fine. Loophole: 'The budget is gone, but Dave doesn't believe it.'"
  **Blake:** "Well, that's valid. Third person."
  **Alex:** *[Points directly at Blake]* "Hi Dave."
  **Blake:** "I'm not—"
  **Alex:** "Don't fight the logic. Your reasoning is bankrupt."

  ***

  **Why this is a real joke (Defense Notes):**
  1. Moore's Paradox fails because *asserting* a fact implies you believe it, so denying belief contradicts the act of speaking, not the reality.
  2. The punchline works because shifting to the third person ("Dave") removes the clash between the speaker's assertion and belief, allowing you to legally call someone else irrational.
