  ## Activity Design: "The Expedition"

  **Concept:** A partner-selection market where hidden "fitness" types must distinguish themselves to secure valuable alliances.
  **Time:** 75 Minutes
  **Students:** 20 (Mixed majors, low math)
  **Materials:**
  *   20 Envelopes (10 marked **ROBUST**, 10 marked **FRAGILE**).
  *   Poker chips or colored tokens (approx. 200 total).
  *   15 Red Armbands (or red stickers/paper strips).
  *   Scorecards and pens for all students.
  *   A "Bank" (you/the instructor) with a bowl for token collection.
  *   Prize: A bag of high-quality chocolate or a "Homework Pass" for the top 3 scorers.

  ### Setup (5 Minutes)
  1.  **Secret Roles:** Hand each student an envelope. Tell them: *"Inside is your biological type for this simulation. Do not show it to anyone. Do not talk about what's inside."*
      *   **ROBUST (High Quality):** You are resilient.
      *   **FRAGILE (Low Quality):** You are vulnerable.
  2.  **Endowments:** Walk around and hand out starting tokens based on their secret card.
      *   **ROBUST:** 10 Tokens.
      *   **FRAGILE:** 5 Tokens.
      *   *Instruction:* *"These are your survival reserves. Keep them hidden in your hand or pocket."*
  3.  **The Goal:** *"You need to find one partner for this expedition. Your final score determines if you win the prize. Your score = Your Remaining Tokens + Partner Bonus."*
  4.  **Partner Bonus Rules (Write on Board):**
      *   If your partner is **ROBUST**: You get **10 Tokens**.
      *   If your partner is **FRAGILE**: You get **4 Tokens**.
      *   *Crucial Constraint:* *"You cannot see their card. You only know what they tell you or show you."*

  ---

  ### Round 1: The Market of Words (10 Minutes)
  **Rule:** No props allowed. You may say anything to anyone.
  1.  **Mingle (5 mins):** Students walk around, claim their type, and try to secure a partner.
  2.  **Lock In:** Once pairs agree, they sit down.
  3.  **Reveal & Score (5 mins):** Pairs reveal cards. Calculate scores.
      *   *Predictable Outcome:* Chaos. Everyone claims to be ROBUST. FRAGILE types get paired with ROBUST types by lying. ROBUST types get angry/feel cheated.
      *   *Instructor Action:* Collect scores. Do not explain *why* it failed. Just say, *"Reset. Everyone return to your seats. Return tokens to your hand."*

  ### Round 2: The Handicap (15 Minutes)
  **Rule:** You may buy a **Red Armband** from the Bank.
  1.  **The Cost:** The Armband costs **6 Tokens**. (Pay upfront to the Bank).
  2.  **The Signal:** If you wear the Armband, partners know you paid the cost.
  3.  **The Market Rule:** *"Partners are smart now. They will only pair with someone wearing an Armband. If you pair with someone without one, you get 0 Partner Bonus."* (This forces the demand for signaling).
  4.  **Mingle & Pair (5 mins):** Students decide to buy or not.
  5.  **Reveal & Score (5 mins):**
      *   *Predictable Outcome:* **Separation.**
      *   **ROBUST:** 10 start - 6 cost = 4 left. + 10 bonus = **14 Total.** (They buy).
      *   **FRAGILE:** 5 start - 6 cost = -1 (Bust). Even if they borrow, 5 - 6 + 4 = **3 Total.** If they *don't* buy, they keep 5 but get 0 bonus = **5 Total.** (They do *not* buy).
      *   *Result:* Only ROBUST wear armbands. FRAGILE stay bare. Trust is restored. High scores for ROBUST.
  6.  **Reset:** Return tokens. Keep roles secret.

  ### Round 3: The Inflation Twist (15 Minutes)
  **Rule:** Armbands are still required for partnership.
  1.  **The Change:** *"The supplier has changed. Armbands now cost **2 Tokens**."*
  2.  **Mingle & Pair (5 mins):**
  3.  **Reveal & Score (5 mins):**
      *   *Predictable Outcome:* **Pooling (Collapse).**
      *   **ROBUST:** 10 - 2 + 10 = **18 Total.** (They buy).
      *   **FRAGILE:** 5 - 2 + 4 = **7 Total.** (vs 5 if they don't). **They buy.**
      *   *Result:* Everyone wears an Armband. The Receivers (partners) can no longer distinguish types. They pick randomly. Half the ROBUST end up with FRAGILE partners and get only 4 bonus points. The signal has become noise.
  4.  **Reset:** Return tokens.

  ### Round 4: The Index (10 Minutes)
  **Rule:** No Armbands.
  1.  **The Change:** *"The fog has lifted. You may show your Envelope Card to a potential partner. However, you must bring them to me (the Instructor) to verify I stamped it."*
  2.  **Cost:** 0 Tokens.
  3.  **Mingle & Verify (5 mins):** Students show cards. You stamp them "VERIFIED."
  4.  **Reveal & Score (5 mins):**
      *   *Result:* Perfect matching. No cost incurred. High efficiency.
      *   *Note:* This represents an **Index** (unfakeable trait), not a Signal.

  ---

  ## The Debrief (20 Minutes)

  *Do not start with definitions. Start with their feelings.*

  **1. The Cheap Talk Failure (Round 1)**
  *   **Ask:** "Round 1, how many Robust types felt lied to? How many Fragile types lied?"
  *   **Map:** This is **Cheap Talk**. Because words cost nothing, they carry no information. A lie costs the same as the truth. Therefore, rational agents ignore them.
  *   **Concept:** *Informational Equilibrium.* If everyone says "I'm High Quality," the phrase means "I am a student."

  **2. The Handicap Principle (Round 2)**
  *   **Ask:** "Round 2, Fragile types, why didn't you buy the Armband? It was only 6 tokens."
  *   **Student Answer:** "I would have gone broke." / "I wouldn't have enough left to make it worth it."
  *   **Map:** This is the core insight. The cost *was* 6 tokens for everyone. But the **marginal utility** was higher for the Fragile.
  *   **Concept:** **Differential Cost.** A signal is only honest if it hurts the Low Quality type *more* than the High Quality type. In biology, a heavy tail slows down a weak peacock more than a strong one. In our game, 6 tokens bankrupted the Fragile but left the Robust solvent.
  *   **Key Phrase:** "The signal isn't honest because it's expensive. It's honest because it's *differentially* expensive."

  **3. The Collapse (Round 3)**
  *   **Ask:** "Round 3, everyone wore the Armband. Did the Robust types get better partners than in Round 2?"
  *   **Student Answer:** "No, we got stuck with Fragiles sometimes."
  *   **Map:** When the cost dropped to 2 tokens, it became affordable for *both*. The differential still existed (Fragile felt it more), but not enough to deter them.
  *   **Concept:** **Pooling Equilibrium.** When the cost is low enough for the Low Quality to mimic, the signal loses its information content. It becomes "expensive noise." You spent tokens, but learned nothing.
  *   **The Twist:** If the cost had gone *up* to 12 tokens (as you requested in the prompt logic), no one could afford it. The market for signals vanishes. Either way, the information flow collapses.

  **4. Signal vs. Index (Round 4)**
  *   **Ask:** "Round 4 was efficient. Why don't we do that in nature? Why don't peacocks just show a ID card?"
  *   **Map:** Round 4 was an **Index**. An index is physically linked to the quality (like size, or my verification stamp). You cannot fake size without actually being big.
  *   **Concept:** Signals (Armbands) are *separable* from the quality (you can buy one). Indices (Size/Voice Depth) are *inseparable*. Signals require cost to be honest. Indices do not, because they cannot be faked.

  ---

  ## Troubleshooting & Predictable Failures

  **1. The "Nice" Student (Altruism)**
  *   **Problem:** A Robust student sees a Fragile student struggling and says, "It's okay, I'll pair with you even without an armband."
  *   **Fix:** This breaks the incentive structure.
  *   **Prevention:** In the intro, emphasize: *"This is a competition for the prize. You must maximize your own score. Altruism lowers your rank."*
  *   **In-Game Correction:** If you see this, announce to the class: *"Reminder: Pairs without Armbands (in R2/R3) receive 0 Partner Bonus. I will enforce this at scoring."*

  **2. The "Math Panic"**
  *   **Problem:** Students get stuck calculating tokens and stop mingling.
  *   **Fix:** Put the payoff matrix clearly on the board. Walk around with a "Cheat Sheet" for the first 2 minutes of each round.
  *   **Simplification:** If they struggle, reduce token numbers (Robust 5, Fragile 2, Cost 3). Keep the ratios same.

  **3. The "Collusion"**
  *   **Problem:** Two Fragile types pair up and agree to both lie or both not signal.
  *   **Fix:** Remind them that if they pair with a Fragile, the bonus is only 4. If they can trick a Robust, they get 10. The incentive to deceive remains.
  *   **Debrief Point:** Use this in the debrief. *"Even if Fragiles collude, they still want to find a Robust partner. The incentive to mimic the Robust signal remains."*

  **4. Time Overrun**
  *   **Problem:** Mingling takes too long.
  *   **Fix:** Use a timer on the projector. Give 30-second warnings. If pairs aren't formed by the bell, they are "Unpaired" and get 0 Partner Bonus. This adds pressure (simulating survival risk).

  ---

  ## Limitations: What The Game Can't Show
  *Be honest about this in the final 5 minutes.*

  1.  **Conscious Choice vs. Genetics:** In the game, students *decide* to signal. In nature, peacocks don't choose to grow tails; genes that produced tails survived because those peacocks got mates. The "choice" is actually evolutionary selection over generations.
  2.  **Token Utility vs. Survival:** In the game, tokens are points. In nature, the "cost" is death or starvation. The stakes are absolute, not relative.
  3.  **The "Why" of Differential Cost:** In the game, I arbitrarily gave Fragile types fewer tokens. In nature, the differential cost is physical. A heavy tail uses more oxygen. A weak heart can't pump that oxygen. The game simulates the *economics* of the cost, not the *physiology*.
  4.  **Dynamic Co-evolution:** In the game, I changed the rules (Round 2 to 3). In nature, the "cost" and the "receiver preference" evolve together. If receivers stop trusting the tail, the tail shrinks. The game is static rounds; evolution is a continuous feedback loop.

  **Closing Line for the Class:**
  *"You felt the hesitation in Round 2. That hesitation? That's the cost that keeps the signal honest. Without it, the language of nature goes silent."*
