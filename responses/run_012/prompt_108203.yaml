answer: |-
  Here is the plan for the seventy-five minutes. It is designed to weaponize the friction in the room rather than smooth it over.

  ### Decision 1: The Definition and the Circularity
  **The Verdict:** Write the definition on the board *before* addressing circularity. Let it fester for exactly twenty minutes.

  **The Definition:** Use Woodward's four clauses for an intervention variable $I$ on $X$ with respect to $Y$.
  1.  $I$ causes $X$.
  2.  $I$ does not cause $Y$ except via $X$.
  3.  $I$ is not correlated with other causes of $Y$.
  4.  $I$ fixes $X$ independently of other variables.

  **Pedagogical Weight:**
  *   **Clause 1 ($I$ causes $X$):** This is the philosophical trap. It presupposes causation to define causation.
  *   **Clause 2 (No bypass):** This is the epidemiological anchor. It is the formalization of "no confounding" and "no side effects." This is where your Epi students will feel safe.
  *   **Clause 4 (Independence):** This is the pivot point. It implies modularity—that you can break the link between $X$ and its usual causes without breaking the link between $X$ and $Y$.

  **Which clause will they drop?**
  The Epi students will silently drop **Clause 2** when applying it to your threshold example. They will treat the administrative change as an intervention on the *record* of $X$, ignoring that the record is not the biological state. The Philosophers will silently drop **Clause 1**'s causal weight, treating "causes" as "counterfactually depends on." You must police Clause 2 for the Epi students and Clause 1 for the Philosophers.

  **Timing the Circularity:**
  Do not meet the circularity worry immediately. If you resolve it too soon, you turn interventionism into a technical fix rather than a conceptual shift.
  *   **Write the definition.**
  *   **Let the Philosophers object.** (They will say: "You're using 'cause' to define 'cause'.")
  *   **Let the Epidemiologists object.** (They will say: "This is just a randomized trial definition.")
  *   **Wait.** Tell them the circularity is a feature, not a bug, but you cannot explain *why* until you have introduced **Invariance**.
  *   **Resolve it** only after you have shown that interventionism is about *testing stability*, not *establishing truth conditions*. The circle is virtuous because it is a coherence check on a system of relations, not a linear derivation.

  ### Decision 2: The Carrying Example
  **The Verdict:** Use the administrative threshold example. It is not too clever; it is necessary.

  **Why:** Standard examples (smoking, aspirin) allow both groups to retreat to their silos. The Epi students see a policy trial; the Philosophers see a physical mechanism. The threshold example forces a collision over **what the variables are**.
  *   **For the Epidemiologists:** This *is* an intervention. You can randomize the diagnostic criterion across clinics. It estimates the effect of "diagnosis" on "treatment/cost/outcome."
  *   **For the Philosophers:** This is not a causal intervention on the *disease*. It is a change in classification. If causation is about "making a difference in the world," changing a spreadsheet header shouldn't count.

  **The Risk:** The session stalls on "Is diagnosis real?"
  **The Mitigation:** Stipulate at the outset: *We are treating the diagnostic status as the variable $X$.* The question is not whether the disease is real, but whether the *relationship* between $X$ and $Y$ is invariant under this manipulation. This forces the Philosophers to engage with the *structure* of the account, not the ontology of the disease.

  **On Pre-emption:** Your reluctance to use late pre-emption/backup assassin cases is well-founded. Those cases test *token* causation (actual causation). Your goal is *type* causation (general causal structure). Pre-emption cases will drain 30 minutes into metaphysical weeds about events. Stick to the threshold case; it tests the *account of causation*, not the *account of events*.

  ---

  ### Session Architecture (75 Minutes)

  #### 0:00 – 0:10: The Setup (The Split)
  *   **Whiteboard:** Draw two columns. Left: "Counterfactual Dependence." Right: "Interventionism."
  *   **Action:** Ask the Philosophers to define causation in the Left column (Lewis-style: $Y$ depends on $X$ if, had $X$ not occurred, $Y$ would not have occurred). Ask the Epidemiologists to define it in the Right column (Target Trial: What is the effect of setting $X$ to $x$?).
  *   **Goal:** Make the notational variant suspicion explicit immediately. "Philosophers: You think the Right column is just the Left column with engineering slang. Epidemiologists: You think the Left column is just the Right column with impossible trials."

  #### 0:10 – 0:25: The Definition (The Trap)
  *   **Action:** Write the four clauses of Intervention (see Decision 1) in the Right column.
  *   **Constraint:** Do not explain Clause 1 ("$I$ causes $X$"). Just write it.
  *   **Misconception Check (Philosophers):** They will claim this is circular. *Acknowledge it. Write "CIRCULAR?" in big letters. Do not erase it.*
  *   **Misconception Check (Epidemiologists):** They will equate $I$ with "Treatment Assignment." Correct them: $I$ is an *idealized* variable. It must satisfy Clause 2 (no bypass) perfectly, which no actual trial does. This separates "estimation" from "definition."

  #### 0:25 – 0:45: The Threshold Example (The Wedge)
  *   **Action:** Introduce the administrative threshold case. $X$ = Hypertension Diagnosis (Yes/No). $Y$ = Cardiovascular Event. Intervention $I$ = Change cutoff from 140mmHg to 130mmHg.
  *   **The Conflict:**
      *   Ask Epidemiologists: "Is $I$ an intervention on $X$?" (They say Yes).
      *   Ask Philosophers: "Did the biological state of the patients change?" (They say No).
  *   **The Pivot:** This is where you introduce **Invariance**.
      *   Interventionism does not ask "Did the world change?" It asks "Does the relationship between $X$ and $Y$ hold stable when we change *how we determine* $X$?"
      *   If the relationship between Diagnosis and Event breaks when we change the cutoff, the causal claim was not invariant. It was an artifact of the threshold.
  *   **Key Distinction:** Counterfactual Dependence is binary (True/False in a world). Interventionism is **graded** (Invariant across how many distinct interventions?).
  *   **Whiteboard:** Under "Interventionism," write "DEGREE OF INVARIANCE." Under "Counterfactual," write "TRUTH CONDITION."

  #### 0:45 – 0:60: Resolving the Circle (The Payoff)
  *   **Action:** Return to the "CIRCULAR?" note.
  *   **Explanation:** The definition is circular if you view it as a *reduction* (defining cause in terms of non-causal primitives). It is *not* circular if you view it as a *characterization* of a concept within a network.
  *   **The Modularity Assumption:** An intervention works only if the mechanism linking $X$ to $Y$ is modular (separable) from the mechanism linking $I$ to $X$.
  *   **Why this separates the accounts:** Counterfactual dependence requires a similarity metric between possible worlds (messy, holistic). Interventionism requires a breakdown of the system into modules (structural, local).
  *   **Epi Check:** This validates their "target trial" intuition but clarifies that the target trial assumes modularity.
  *   **Phil Check:** This shows it is not just "naming a possible world." It is imposing a structural constraint on the world (modularity) that pure counterfactuals do not require.

  #### 0:60 – 0:70: Misconception Sweep
  *   **Address Epi Misconception:** "An intervention must be feasible."
      *   *Correction:* No. We can ask if a relationship is invariant to interventions that are physically impossible (e.g., setting birth weight to 5kg), provided the intervention is *well-defined*. If the relationship breaks, the causal claim is weak.
  *   **Address Phil Misconception:** "This is anthropocentric."
      *   *Correction:* The "agent" is a placeholder for any process that satisfies the clauses. A meteorite can be an intervention if it satisfies Clause 2 (no bypass). It is about *system breaking*, not human hands.

  #### 0:70 – 0:75: The Exit Question
  *   **Action:** Put this scenario on the board:
      > "We observe a correlation between 'Fire Alarm Ringing' ($X$) and 'Fire Department Arrival' ($Y$).
      > Scenario A: We intervene by manually pressing the 'Test' button on the alarm ($I_1$). The Fire Department does not arrive.
      > Scenario B: We consider the counterfactual: 'If the alarm had not rung (due to a fire), would the Fire Department have arrived?' ($I_2$). Yes."
  *   **The Question:** "According to the Interventionist account, is 'Alarm Ringing' a cause of 'Fire Department Arrival'? According to the Counterfactual account, is it? Explain the divergence using the concept of **Invariance**."
  *   **Right Answer:**
      *   **Interventionist:** No (or weak). The relationship is not invariant under $I_1$ (Test button). The mechanism is broken because $I_1$ bypasses the fire. The dependence is not robust across interventions.
      *   **Counterfactual:** Yes. In the nearest possible world where the alarm doesn't ring (no fire), the FD doesn't come. Dependence holds.
      *   **The Distinction:** Interventionism detects the spuriousness via the *type* of intervention (testing modularity). Counterfactual dependence often conflates correlation with causation unless the "nearest world" is carefully constrained (which interventionism does explicitly via the clauses).
      *   *(Note: This example is chosen because it mirrors the threshold case: changing the source of the signal without changing the underlying state.)*
  *   **Wrong Answer:** "Interventionism says no because we can't randomize the alarm." (Focuses on feasibility). "They are the same because the test button creates a possible world." (Misses the invariance/modularity point).

  ---

  ### What to Explicitly Refuse to Cover
  At minute 0:05, state this clearly:
  1.  **Structural Equation Models (SEM):** "We will not write down equations $Y := f(X, U)$. We are discussing the *interpretation* of the arrows, not the algebra."
  2.  **Token/Actual Causation:** "We are not solving pre-emption, overdetermination, or the backup assassin. We are discussing *type-level* causal claims suitable for generalization."
  3.  **The Do-Operator:** "We will not use Pearl's $do(X)$ notation. It tempts the Epidemiologists to think this is just calculus, and the Philosophers to think it's just syntax. We are sticking to the concept of *intervention*."

  ### Summary of the Distinction They Must Leave With
  Write this on the board at the very end. They must be able to recite this:
  > "Counterfactual Dependence asks: **Is $Y$ different in the world where $X$ is different?** (A question about truth conditions across worlds).
  > Interventionism asks: **Does the $X \to Y$ relationship survive when $X$ is changed by a process that breaks its usual causes?** (A question about stability/modularity within a system)."

  If they can articulate that one is about **truth across worlds** and the other is about **stability under system-breaking**, they have grasped the distinction.
