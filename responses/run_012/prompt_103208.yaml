answer: |-
  Yes, this has a name. In philosophy and ethics, it is most commonly called **The Spectrum Argument** (or sometimes **The Continuum Argument**).

  It is famously associated with the philosopher James Rachels (who used your exact example: a lifetime of torture vs. a mild headache) and Derek Parfit (who used it for population ethics).

  You are right to feel that this is distinct from the "Heap" (Sorites) paradox and distinct from circular preferences. Here is the breakdown of what is happening, why it feels different, and what your actual options are for solving it.

  ### 1. The Name and The Mechanism
  **The Name:** The Spectrum Argument.
  **The Mechanism:** It attacks the principle of **Transitivity**.

  In logic, a relation is "transitive" if:
  *   If A is better than B,
  *   And B is better than C,
  *   Then A *must* be better than C.

  The Spectrum Argument sets up a chain where every local link obeys transitivity (Step 1 > Step 2, Step 2 > Step 3), but the global result violates your intuition (Step 1 is *not* better than Step 1000).

  ### 2. How It Differs From the "Heap" (Sorites) Paradox
  You nailed the difference in your description, but here is the technical distinction.

  *   **The Heap Paradox relies on Vagueness.**
      *   *The Setup:* You remove one grain of sand from a heap. Is it still a heap?
      *   *The Experience:* At the beginning, you say "Yes." At the end, you say "No." But in the **middle**, you hesitate. You squint. You say, "I don't know." The paradox exploits the fact that the word "heap" has no sharp boundary.
  *   **The Spectrum Argument relies on Intransitivity.**
      *   *The Setup:* You make a tiny improvement to a bad situation. Is it better?
      *   *The Experience:* As you noted, you **never hesitate**. Every single neighbor comparison feels 100% clear. Step 500 is clearly better than Step 501. The contradiction only appears when you look at the *endpoints*.

  **The Carve-Up:** The Heap Paradox says "You can't find the line." The Spectrum Argument says "There shouldn't be a line, but the ends don't match."

  ### 3. How It Differs From Circular Preferences
  *   **Circular Preferences (A > B > C > A):** This is a loop. It implies your internal compass is broken locally. If you have circular preferences, you can be "money-pumped" (tricked into trading A for B, B for C, and C for A, paying a fee each time, ending up with A but less money).
  *   **The Spectrum Argument:** This is a straight line that curves back on itself only at the very end. It's not that you prefer A to C and C to A. It's that you prefer A to B, B to C... all the way to Z, but you *deny* that A is better than Z. It's a failure of the chain to hold over distance, not a local cycle.

  ### 4. What Is the Culprit?
  You asked if the problem is the thing being compared (pain), the word ("better"), or the logic (transitivity).

  **The culprit is the assumption that "Better Than" is always a transitive, quantitative relationship.**

  We instinctively treat value like height. If Block A is taller than B, and B is taller than C, A is taller than C. Height is continuous and transitive.
  The Spectrum Argument suggests that **Value might not be continuous.** It suggests that at some point, a quantitative change triggers a **qualitative shift**.

  ### 5. The "Legit Moves" (How to Get Out of It)
  Philosophers generally take one of four paths to resolve this. None are perfect, but they are the standard "exits."

  **Move 1: The Lexical View (There is a sharp line)**
  You accept that somewhere in that chain, there *is* a magical step where a tiny increase in pain suddenly becomes "Torture" rather than "Discomfort," and that leap outweighs any number of smaller steps.
  *   *Pros:* Saves transitivity.
  *   *Cons:* It feels fake. It implies that adding one millisecond of torture makes a situation infinitely worse than the millisecond before it. It requires believing in a sharp boundary where none seems to exist.

  **Move 2: Imprecise Comparability (The "On a Par" View)**
  You argue that "Better Than" is too crude. Sometimes A isn't better than B, and B isn't better than A; they are just **"on a par."** They are in the same neighborhood of value.
  *   *The Fix:* You admit that many of those neighbor comparisons aren't actually "strictly better." They are just "roughly equivalent." Once you allow for rough equivalence, the chain breaks, and you don't have to conclude the top is better than the bottom.
  *   *Pros:* Matches how we actually talk ("It's a wash," "Six of one, half a dozen of the other").
  *   *Cons:* Makes decision-making harder. If things are just "on a par," how do you choose?

  **Move 3: Deny Transitivity (The Hard Pill)**
  You accept that "Better Than" is simply not transitive over long chains.
  *   *The Fix:* You say, "Yes, A is better than B, and B is better than C, but A is NOT better than C."
  *   *Pros:* Honors your intuition at every step.
  *   *Cons:* It breaks rational choice theory. If "better than" isn't transitive, you can't maximize utility. It makes logic messy.

  **Move 4: The "All-Things-Considered" Shift**
  You argue that you aren't comparing the same thing at the top and bottom.
  *   *The Fix:* At the top, you are comparing "minor annoyances." At the bottom, you are comparing "human rights violations." The *context* of the comparison has shifted, so the word "better" is doing different work at the top than at the bottom.
  *   *Pros:* Acknowledges that context matters.
  *   *Cons:* Can feel like moving the goalposts.

  ### Summary
  *   **Name:** The Spectrum Argument.
  *   **Not Sorites:** Because you aren't unsure about the middle steps.
  *   **Not Circular:** Because it's a chain, not a loop.
  *   **The Problem:** The assumption that value is purely additive and transitive.
  *   **The Solution:** Most philosophers lean toward **Move 2 (Imprecise Comparability)** or **Move 1 (Lexical Thresholds)**. They argue that at some point, the *kind* of badness changes, not just the *amount*, and that breaks the chain.

  You aren't missing a trick; you've stumbled onto one of the hardest problems in value theory. The feeling that "every step is obvious but the result is crazy" is exactly the point of the argument.
