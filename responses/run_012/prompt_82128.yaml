      *   *Stalinesque:* The brain waits for the red dot, constructs the story (blue moves, turns red), and *then* presents the conscious experience. (Consciousness is delayed/constructed).
      *   *Orwellian:* The brain presents the blue dot, then the red dot, but memory is revised *afterward* to include the motion and color change. (Consciousness is real-time, memory is falsified).
      *   *Dennett & Kinsbourne (1991):* There is no "Cartesian Theater" where this happens. The distinction is illusory because there is no single moment where "consciousness happens." All judgments are based on memory traces, which are always subject to revision. Therefore, the question is ill-formed.
