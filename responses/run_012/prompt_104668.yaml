answer: |-
  This is a robust philosophical position, essentially a form of **Convention-Dependent Moral Realism** applied to micro-social interactions. You are arguing that the *source* of the obligation is the convention itself, but the *force* of the obligation is moral.

  If you want to stress-test this, you need to attack the link between "social expectation" and "moral duty," and specifically the mechanism by which that duty transfers across borders to visitors.

  Here is a map of the position's exposure, sorted by decisiveness, followed by answers to your three specific constraints.

  ### I. The Map of Exposure (Sorted by Decisiveness)

  **Tier 1: The Epistemic Barrier (Potentially Fatal)**
  *   **The Objection:** "Ought implies Can," but also "Ought implies Know." Moral obligations generally require epistemic access. If a tourist *cannot reasonably know* a convention exists, they cannot be morally obligated to follow it.
  *   **The Bite:** This destroys the obligation for the *new* arrival. If the obligation kicks in only *after* they learn the norm, then the violation during the learning period isn't moral wrongdoing; it's ignorance. If you claim they are obligated *before* they know, you are arguing for moral strict liability, which is rare in ethics outside of specific legal contexts.
  *   **Decisiveness:** High. If you can't solve the epistemic gap, the "visitor" part of your claim collapses.

  **Tier 2: The Moral Floor / The "Bad Custom" Problem (Structurally Fatal)**
  *   **The Objection:** If conventions generate moral obligations, what happens when the convention is morally repugnant? (e.g., a local norm that tourists should not make eye contact with people of a certain caste, or that service workers should not speak unless spoken to).
  *   **The Bite:** You will likely concede that "immoral conventions do not create obligations." But once you concede that, you admit the moral force comes from *outside* the convention (from a higher-order principle like Justice or Dignity), not *from* the convention. The convention becomes merely the *trigger*, not the *source*.
  *   **Decisiveness:** High. It forces you to admit the convention isn't doing the moral heavy lifting.

  **Tier 3: The "Empty Road at 3 AM" Problem (Conceptual Erosion)**
  *   **The Objection:** Coordination norms exist to prevent harm/chaos (tragedy of the commons). If the road is empty, the coordination problem vanishes. If you claim there is still a moral obligation, you are arguing for a Deontological duty to "Rule-Following" itself.
  *   **The Bite:** This makes your view rigid. Most people's intuition is that jaywalking on an empty road is *permissible*. If your view says it's *wrong* (even if minor), you are fighting common moral intuition. If your view says it's *permissible*, you have to explain why the obligation vanished. Was it never moral? Or just defeasible?
  *   **Decisiveness:** Medium. It doesn't kill the view, but it forces you into a specific (and less popular) branch of deontology.

  **Tier 4: The Cognitive Load / Autonomy Objection (Pragmatic Pressure)**
  *   **The Objection:** Imposing a duty to research and adhere to every local micro-norm places an unbearable burden on human agency. It turns travel into a compliance audit.
  *   **The Bite:** This suggests the obligation is not on the *act*, but on the *attitude*. Maybe the duty is just "be attentive," not "never fail."
  *   **Decisiveness:** Low. This just modifies the scope of the duty rather than negating it.

  ---

  ### II. Defenders vs. Critics: Who Concedes What?

  **What Defenders Would Concede:**
  *   **The Moral Floor:** Any sophisticated defender of your view must concede that a convention cannot override fundamental human rights. If the local norm is discriminatory, the visitor is *not* bound. In fact, they might be bound to violate it.
  *   **The Epistemic Limit:** Defenders would concede that a visitor who has made a *good faith effort* to learn the norms but fails is not blameworthy. The obligation is conditional on reasonable access to knowledge.

  **What Only Critics Throw:**
  *   **The "Arbitrariness" Attack:** Critics will argue that morality must be universalizable. If "don't jaywalk" is moral in London but permissible in Copenhagen, morality becomes geographic. Critics argue this reduces morality to "local preference," stripping it of its normative force. Defenders try to dodge this by saying the *higher order principle* (e.g., "Respect Local Order") is universal, even if the *rule* varies.
  *   **The "Mere Preference" Reduction:** Critics will argue that your feeling of "moral obligation" is actually just "fear of social sanction" or "desire to fit in" dressed up in moral language. They claim you are conflating *etiquette* (social smoothness) with *ethics* (right/wrong).

  ---

  ### III. Falsifiability and Hedging

  You asked if you have hedged the view into unfalsifiability ("if the convention is morally acceptable and the stakes are non-trivial and...").

  **Yes, this is a bug.**
  If every counter-example is met with a "defeater clause," the theory risks becoming a tautology: *"Conventions are obligations, except when they aren't."*

  **How to fix it (The Falsification Condition):**
  To make this falsifiable, you need a prediction that, if proven false, kills the theory.
  *   **The Test:** Find a case where a convention is **neutral** (not unjust), **known** (the visitor knows it), and **consequence-free** (no one is harmed), yet the visitor violates it.
  *   **Your Prediction:** The visitor has done something *morally wrong* and is subject to *moral blame* (not just annoyance).
  *   **Falsification:** If it turns out that in these specific cases, competent moral judges universally agree "there is nothing wrong there, not even a little bit," then your claim that conventions *constitute* moral obligations is false. They might be *prudential* obligations, but not moral ones.

  **Is hedging a feature?**
  Some hedging is necessary (all moral duties are defeasible; you don't have to queue if there's a fire). But if the "defeaters" swallow the rule (e.g., "you don't have to queue if you're in a hurry," "you don't have to tip if the service was okay"), the view is empty. The view only has teeth if there are cases where you *must* follow the convention even when it is inconvenient and harmless to break.

  ---

  ### IV. Unique Predictions vs. Rival Views

  To justify this view, it must predict things that the "Coordination Equilibrium" or "Local-Only" views do not.

  **1. The Reactive Attitudes Prediction (vs. Coordination Equilibrium)**
  *   **Rival View (Coordination):** We queue to avoid chaos. If I cut the line, I've caused inefficiency. You should feel *annoyed*. I should feel *regret* for causing a mess.
  *   **Your View (Moral):** If I cut the line, I have violated a duty of fairness/respect. You are entitled to feel *indignant* (not just annoyed). I ought to feel *guilt* (not just regret).
  *   **The Test:** Do people actually feel moral guilt over minor convention violations? If they only feel social anxiety, your view is descriptive, not normative.

  **2. The "Right for the Wrong Reason" Prediction (vs. Local-Only)**
  *   **Rival View (Local-Only):** Only locals are bound because they are members of the social contract. Visitors are outsiders; they get a pass.
  *   **Your View:** Visitors are bound because the *moral principle* (e.g., "Do not free-ride on social order") is universal.
  *   **The Test:** If a local sees a tourist violate a norm, do they judge them *less harshly* than a local?
      *   If **Yes**: The "Local-Only" view is likely correct. The obligation is membership-based.
      *   If **No** (They think the tourist *should have known* and is equally blameworthy): Your view gains traction.

  **3. The Non-Consequentialist Violation**
  *   **Rival View:** If breaking the norm helps someone (e.g., cutting the line to help an injured person), it's obviously right.
  *   **Your View:** Even if breaking the norm helps, there might still be a *moral residue*. You did the right thing overall, but you still owe an apology to the queue for violating the norm.
  *   **The Test:** Does the violator owe an explanation/apology even when their reason was good? If yes, the norm had independent moral weight.

  ---

  ### V. The Threshold Problem: Where does it bite?

  You asked: *Is there a threshold below which it lapses? And if the thresholds are just "whatever's locally normal," has the view stopped saying anything?*

  **The Danger of Collapse:**
  If your view is "You must follow local norms, unless the norm is trivial, unless it's hard to know, unless it's unjust," and the definition of "trivial" is "what locals think is trivial," then your theory collapses into **"Do What Locals Do."** It becomes a description of behavior, not a justification for it.

  **The Necessary Distinction:**
  For your view to mean anything, the "Moral Obligation" must add a **normative layer** on top of the behavior.
  *   **Scenario:** Tipping 15% vs. 20%.
  *   **Local Norm:** 20% is standard. 15% is stingy but allowed.
  *   **Coordination View:** Tipping 15% is fine; it's within the equilibrium range.
  *   **Your Moral View:** Tipping 15% might be *permissible*, but is it *virtuous*? Or is there a "moral minimum" that is higher than the "legal minimum"?

  **Where it Bites:**
  The view bites when **Local Permission $\neq$ Moral Permission.**
  *   *Example:* In some cities, it is "normal" to aggressively honk at pedestrians. Locals do it; it's the convention.
  *   *Your View's Prediction:* Even if it's the local convention, a visitor (and a local) has a moral obligation *not* to do it, because the convention violates a higher duty (safety/respect).
  *   *Conversely:* In a city where jaywalking is decriminalized and common, but you believe there is a "duty to obey the law," your view predicts the visitor is *still wrong* to jaywalk, even if locals do it.

  **The Verdict on "Empty":**
  If you cannot identify a single case where **Local Custom says X** but **Your Moral Theory says Not-X** (or vice versa), then your theory is indeed empty. It is merely a fancy way of saying "When in Rome."

  To save it, you must argue that the obligation isn't to the *specific act* (tipping 20%), but to the *underlying principle* (Fair Compensation). Sometimes the local act *fails* the principle. The visitor is bound to the Principle, which usually aligns with the Local Act, but not always.

  ### Summary of the Stress Test

  1.  **Epistemic Access:** If you can't solve how a tourist knows the duty, the duty doesn't exist for them yet.
  2.  **Guilt vs. Regret:** If violations only produce social awkwardness rather than moral guilt, it's etiquette, not ethics.
  3.  **Independence:** If your view never conflicts with "Do What Locals Do," it adds no value. It must be able to condemn a local convention or exonerate a violation of one.
  4.  **Falsifiability:** If you add too many "unless..." clauses, you aren't describing morality; you're describing preferences.

  Your friends are likely reacting to the **stiffness** of your view. Morality usually implies universality and seriousness. By tying it to geography and tipping percentages, you risk trivializing morality. To defend it, you must show that respecting the *social fabric* is a genuine moral good, not just a pragmatic one.
