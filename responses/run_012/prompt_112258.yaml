answer: |-
  # Final Exam Essay Question

  **Question 1 (60 Minutes)**

  Consider the "Shoelace Case": You walk past a stranger whose shoelace is untied. Telling them costs you virtually nothing and prevents a potential fall. It seems morally better to speak than to stay silent, yet no one thinks you act wrongly if you say nothing.

  Write an essay addressing the following:

  1.  **Classification:** Is telling the stranger a minor duty or a supererogatory act? Defend your classification.
  2.  **The Cost Condition:** If you classify it as supererogatory, does this prove sacrifice is not necessary for supererogation? If you classify it as a duty, how do you explain the lack of blame for omission?
  3.  **Value vs. Obligation:** Distinguish clearly between the claim that an act is "morally better" and the claim that it is "required."
  4.  **Demandability:** Explain the difference between an act being "not required" and "no one being able to demand it."
  5.  **Category Status:** Conclude by arguing whether supererogation is a distinct deontic category, merely the top end of the permissible, or a form of aretaic praise.

  **Constraint:** Your answer must take a definitive stance on the Shoelace Case rather than simply surveying options. Do not rely on naming specific philosophers; focus on the arguments.

  ***

  # Model Answer

  The Shoelace Case presents a critical challenge to standard accounts of supererogation. Typically, supererogatory acts are defined as optional actions that are morally good but not required, often characterized by significant sacrifice or risk (e.g., jumping on a grenade). The Shoelace Case lacks this sacrifice. To resolve the puzzle, I argue that telling the stranger is supererogatory, that sacrifice is not a necessary condition for supererogation, and that the distinction between duty and supererogation rests on demandability rather than cost or moral value alone.

  First, we must distinguish between an act being "morally better" and "required." Consequentialist intuitions often suggest that if an act produces the best outcome, it is required. However, common moral experience suggests a gap between value and obligation. Telling the stranger is morally better because it prevents harm at no cost. However, requiring it would imply that omitting it makes one morally blameworthy. Most people intuitively feel no blame is appropriate for silence. Therefore, the act possesses positive moral value without generating an obligation. If we classify it as a duty simply because it is "better," we collapse the distinction between the good and the obligatory, making every beneficial act a requirement. This is too demanding. Thus, the act is supererogatory: it is good to do, but not wrong to omit.

  This classification forces us to reconsider the cost condition. The standard view holds that supererogation requires significant sacrifice. The Shoelace Case shows this is false. If the act is supererogatory despite costing nothing, then sacrifice cannot be definitional. Sacrifice is often correlated with supererogation because high-cost acts are rarely duties, but it is not the feature that *makes* them supererogatory. The defining feature is optionality in the face of moral betterness. If we insist sacrifice is necessary, we must classify the Shoelace act as a duty. But if it is a duty, why is there no blame for omission? Proponents of the "minor duty" view might argue the duty is too trivial to enforce. However, this conflates the *existence* of a duty with the *appropriateness of blame*. If it is a duty, you owe it to the stranger. If you don't owe it, it isn't a duty. Therefore, it is more consistent to view it as supererogatory and admit that supererogation covers low-cost benefits too.

  This leads to the crucial distinction between "not required" and "no one being able to demand it." These are often treated as synonymous, but the Shoelace Case reveals a nuance. An act is "not required" if I am not morally at fault for omitting it. However, "demandability" refers to whether another party has the standing to claim the act as their due. In the Shoelace Case, the act is not required (I am not blameworthy), but arguably, the stranger still cannot *demand* I tell them. If supererogation were merely the "top end of the permissible," it would imply a spectrum where high-value permissible acts become duties. But the Shoelace Case suggests a binary structural difference: duties involve correlative claims (the stranger has a right to safety in some contexts), whereas supererogatory acts do not generate claims. The stranger benefits, but they cannot demand the benefit.

  Finally, what does this say about the status of supererogation? Some argue it is merely aretaic praise—calling an act supererogatory is just praising the agent, not describing the act's deontic status. However, if the Shoelace Case is supererogatory, it functions deontically by marking a boundary of optionality. It tells us what we may leave undone without fault. If it were only aretaic, it would not explain why omission is permissible. Therefore, supererogation is a distinct deontic category. It is not defined by cost, but by the absence of obligatoriness despite moral preferability.

  In conclusion, the Shoelace Case demonstrates that supererogation does not require sacrifice. It forces us to ground the distinction between duty and supererogation in the structure of demandability and blame rather than cost. By maintaining that the act is morally better but not required, and that the stranger cannot demand it, we preserve supererogation as a distinct category essential for a plausible moral theory—one that recognizes moral value without demanding sainthood for trivial acts.

  ***

  # Marking Scheme

  **Total Marks: 20**
  **Format:** 5 Must-Hit Points (4 marks each)

  | Point | Criteria for Full Marks (4/4) | Typical Student Error |
  | :--- | :--- | :--- |
  | **1. Stance on Shoelace Case** | Student takes a definitive position (Duty vs. Supererogation) and provides a consistent justification for that classification throughout the essay. | Student hedges or says "it depends" without committing to an argument, or contradicts their classification later in the essay. |
  | **2. Better vs. Required** | Student clearly distinguishes between an act having positive moral value (being "better") and an act being obligatory (being "required"). | Student conflates "morally best" with "morally obligatory," arguing that because it is better, it must be required. |
  | **3. The Cost/Sacrifice Condition** | Student addresses whether sacrifice is necessary for supererogation based on their classification, explaining why cost does or does not define the category. | Student recites the standard definition (supererogation requires sacrifice) without addressing how the Shoelace Case challenges or fits that definition. |
  | **4. Demand vs. Requirement** | Student explains the difference between lacking blame (not required) and lacking standing (cannot be demanded), linking this to the status of the act. | Student treats "not required" and "cannot demand" as identical phrases without exploring the relational aspect of demandability. |
  | **5. Category Status** | Student concludes with a clear argument about whether supererogation is a distinct deontic category, a spectrum, or aretaic praise, consistent with their earlier analysis. | Student ends with a vague summary or claims supererogation is "just praise" without explaining how that accounts for the permissibility of omission. |
