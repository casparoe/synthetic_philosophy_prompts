      *   **Core Task:** Compare the two theories directly, analyze how they handle each other's central cases, determine if one is a subset of the other, and specifically address the "recursive problem" (nested secession/territorial definition).
      *   **Specific Constraint:** Be concrete (use examples like Scotland, Catalonia, Quebec). Address the recursion issue explicitly (who decides the unit?).
      *   **Goal:** Determine which theory survives the nested case better or admit if both fail without an arbitrary stopping rule.

  2.  **Deconstruct the Two Theories:**
