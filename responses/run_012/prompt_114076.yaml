      *   *RRO Analysis:* Who is suffering the injustice? Is it A against X, or B against A? If B is oppressed by A, does B get to secede from A? This leads to infinite regress of grievances.
      *   *PR Analysis:* Does B have the same right as A? If yes, fragmentation (Balkanization). If no, why does A have it but B doesn't? (The "Boundary Problem").
      *   *Conclusion:* Both theories struggle with the *unit of analysis* (the "demos" problem).

  4.  **Drafting the Comparison (Section by Section):**

