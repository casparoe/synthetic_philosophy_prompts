  1. The case
  Sam and Taylor are senior compliance officers reviewing a flagged transaction late on a Tuesday. The file concerns retaining client records past the statutory limit. Sam leans back, rubbing tired eyes.
  "Look," Sam says, tapping the folder. "If retaining these records isn't wrong, then the shareholders authorized it."
  Taylor flips open the minutes from the last AGM. "They never authorized it. You saw the minutes yourself. There's no resolution on the books."
  "Exactly," Sam replies, closing the file. "So retaining them is wrong."
  Taylor nods, taking a red pen and marking the file 'Do Not Use'. Neither hesitates. The conversation moves immediately to remediation steps.
  Later, a junior analyst asks Taylor why they stopped the transaction. Taylor says, "Because Sam proved it was wrong."
  The analyst asks, "But did Sam say it was wrong initially?"
  "No," Taylor says. "Sam said if it wasn't wrong, authorization existed. Since authorization failed, the wrongness follows. It's basic logic."
  The analyst nods, opening a new document to draft the violation report. They type the conclusion verbatim from Sam's final statement. Taylor reviews the draft, confirming the reasoning matches the earlier conversation. Both sign off on the report. The office manager asks if there are any doubts about the classification. Taylor confirms the logic is sound. The file is sealed and sent to legal. The workflow proceeds without interruption. The moral term appears in the report exactly as it appeared in Sam's conditional.

  2. The check
