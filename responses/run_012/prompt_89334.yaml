  Verdict: Moves the bump. It saves the validity by redefining it as coherence, but the scenario depicts 'proof' as objective discovery, not subjective coherence. The analyst accepts the logic as binding regardless of their own attitudes. Minimalism explains why we *talk* as if it's valid, but doesn't explain the normative force of the validity itself. Why *ought* we be consistent? The expressivist says 'because rationality', but that's just another norm. The case shows moral logic functioning independently of the speaker's current attitudes. Quasi-realism struggles to explain how a constraint on attitudes generates a new attitude without already presupposing the validity it tries to explain. It saves the phenomena by mimicking realism, leaving the underlying metaphysics unexplained. Negation creates a problem. If 'wrong' is disapproval, 'not wrong' is lack of disapproval. But classical logic requires 'not wrong' to be contradictory to 'wrong'. Lack of disapproval isn't contradictory to disapproval. The expressivist must define negation as 'inconsistency of attitude'. But then Premise 2 (descriptive negation) and Premise 1 (attitude inconsistency) operate on different planes. The repair smooths over the linguistic surface but fails to unify the logical operators across moral and descriptive domains.

  4. What's doing the work
  Feature: The negated embedding ("If... isn't wrong"). If removed, it becomes standard Modus Ponens. Expressivists handle positive conditionals via planning logic. Negation forces the expressivist to account for inconsistency relations between attitudes, not just entailment. Removing negation allows the expressivist to treat the conditional as a plan to disapprove if facts obtain. With negation, they must explain a plan to disapprove if one *fails* to disapprove. This creates a reflexive loop that breaks simple planning models. The case bites because it demands classical negation behavior from non-cognitive states. Without the negation, the expressivist can argue the conditional expresses a direct link between fact and attitude. With negation, the link is between fact and the *absence* of an attitude, which must then entail the *presence* of an attitude via Modus Tollens. This requires attitude-absence to function like a truth-value.

