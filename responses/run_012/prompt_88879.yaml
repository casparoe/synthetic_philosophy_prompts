      *   **Topic:** Philosophy of convention and social norms, specifically David Lewis's account vs. evolutionary/learning accounts.
      *   **Core Problem:** Lewis requires *common knowledge* (infinite hierarchy of beliefs). Evolutionary models generate stability via dynamics (replicator dynamics, reinforcement learning) without explicit common knowledge. Are Lewisian conventions just idealized evolutionary outcomes, or a distinct social fact?
      *   **Proposed Distinction:** "Shallow conventions" (stable on first-order expectations) vs. "Deep conventions" (stable + common knowledge).
      *   **Constraints:** 6-month internal grant, solo researcher, no lab work, whiteboard + simulation code. Needs a determinate question, clear methodology, defined success/failure conditions, justification for it being *philosophy* (not just game theory), and realistic scoping (not a hidden 3-year dissertation).
      *   **Tone:** Professional, academic, persuasive, but grounded in the reality of the constraints.

  2.  **Deconstruct the "Half-Formed Bit" & Sharpen the Question:**
      *   *Current Question:* "Is convention reducible to evolution?" (Too vague).
      *   *Problem:* Lewis says Common Knowledge (CK) is necessary. Evolutionary Game Theory (EGT) says stability is sufficient.
      *   *Refinement:* The user suggests "Shallow" vs. "Deep." I need to make this operational.
      *   *Better Question:* "Under what conditions do evolutionary stable strategies (ESS) converge to Lewisian conventions requiring Common Knowledge, and does the absence of CK undermine the normative force of the convention?"
      *   *Even Better (more determinate):* "Does the stability of a norm under evolutionary dynamics necessitate the formation of higher-order beliefs, or can 'convention' be fully accounted for by behavioral regularity plus first-order expectation?"
      *   *Best (for a 6-month project):* Focus on the *transition*. Can we model the *emergence* of CK from evolutionary dynamics? If not, is the Lewisian account descriptively false or normatively distinct?
      *   *Decision:* Let's frame it around the "Shallow vs. Deep" distinction but operationalize it via simulation. The question becomes: *Do evolutionary learning dynamics naturally generate the higher-order belief structures required for Lewisian convention, or do they stall at 'shallow' stability?*

  3.  **Address the "Existing Answers" Gap:**
      *   *Lewis:* Stipulates CK as a condition. Doesn't explain *how* it arises (takes "salience" as a primitive).
      *   *EGT (Skyrms, Young, etc.):* Explains stability and emergence. Often treats beliefs as implicit in strategies or assumes myopic learning. They show *that* conventions emerge, not necessarily *what epistemic state* the agents hold.
      *   *The Gap:* Nobody has rigorously tested whether the *epistemic conditions* of Lewis are met by the *dynamic processes* of EGT.

  4.  **Develop the Methodology (6 Months, Solo, Code + Whiteboard):**
      *   *Month 1-2: Conceptual Groundwork.* Define "Shallow" vs. "Deep" precisely. Map Lewis's conditions to belief states in agents.
      *   *Month 3-4: Simulation.* Agent-Based Modeling (ABM). Agents play coordination games. Update rules (reinforcement learning or belief learning). Track belief hierarchies.
      *   *Month 5: Case Studies.* Pick 2-3 real-world norms (e.g., driving side, queueing, linguistic terms). Analyze them through the Shallow/Deep lens.
      *   *Month 6: Synthesis & Writing.*
      *   *Scope Check:* Is this too much? Building a belief-tracking ABM is hard. *Correction:* Keep the model simple. 2x2 coordination game. Focus on tracking *explicit* belief levels in the code. Limit case studies to thought experiments or existing literature analysis, no empirical data collection.

  5.  **Define Success/Failure:**
      *   *Success:* Showing that standard learning rules *fail* to generate CK (supporting the "distinct social fact" view) OR showing they *do* (supporting the "idealization" view). Plus a clear philosophical argument about why it matters.
      *   *Failure:* The model is too noisy to interpret, or the distinction collapses logically before simulation. (Need to mitigate this risk).

  6.  **Justify "Philosophy" vs. "Game Theory":**
      *   Game theorists care about equilibrium conditions. Philosophers care about the *nature* of the social fact and the *normative implications* (obligation, reasoning). The question is about the *definition* of convention, not just the math of stability.

  7.  **Drafting the Proposal (Iterative refinement):**
      *   *Title:* Needs to be catchy but accurate. "From Stability to Common Knowledge."
      *   *Abstract:* Summarize the tension.
      *   *Research Question:* Make it sharp. "Is Common Knowledge an emergent property of evolutionary stability?"
      *   *Method:* Be specific about the code. Python/NetLogo? Let's say Python for flexibility.
      *   *Timeline:* Break it down by month.
      *   *Risk Management:* What if the code doesn't work? Fallback to conceptual analysis.

  8.  **Refining the "Shallow/Deep" Distinction:**
      *   I need to make sure the user's idea is preserved but made rigorous.
      *   *Shallow:* $E_i(E_j(Action))$ is enough for stability.
      *   *Deep:* $C(Action)$ (Common Knowledge) is present.
      *   *Hypothesis:* Evolutionary dynamics produce Shallow easily. Deep requires a "focal point" or communication channel not present in blind evolution.

  9.  **Final Review against Constraints:**
      *   6 months? Yes, scope is tight.
      *   No lab work? Yes.
      *   Determinate answer? Yes, the simulation will show if CK emerges or not.
      *   Philosophy job? Yes, focuses on the definition and normative status.

  10. **Writing the Text:** (Self-Correction during drafting): *Make sure not to promise too much on the simulation. It's a "toy model." Emphasize the conceptual clarity gained even if the code is simple.* *Ensure the distinction between 'stability' and 'convention' is clear.*

  **(Self-Correction on the "Determinate Answer"):** A philosophical project rarely yields a binary "yes/no" like a science experiment. I need to frame the "determinate answer" as a resolved argument or a clarified distinction, not necessarily an empirical fact. The simulation supports the argument. I will phrase the outcome as "establishing whether the gap is bridgeable."

  **(Final Polish):** Check tone. Needs to sound like a grant proposal—confident, feasible, significant.

  *Let's assemble the proposal.*
answer: |-
  **Project Title:** Shallow Stability, Deep Convention: An Epistemic Analysis of Evolutionary Norm Emergence

  **1. Research Question**
  David Lewis defines convention as a behavioral regularity sustained not merely by habit, but by a system of interlocking expectations culminating in *common knowledge* (CK): everyone knows, everyone knows that everyone knows, ad infinitum. Contemporary evolutionary game theory (EGT) demonstrates how stable regularities emerge through learning dynamics, reinforcement, and drift without agents possessing sophisticated belief hierarchies.

  This project asks a determinate question: **Do standard evolutionary learning dynamics naturally generate the higher-order belief structures required for Lewisian common knowledge, or do they produce stable regularities that remain epistemically 'shallow'?**

  If the latter, Lewisian convention is not merely an idealization of evolutionary stability but a distinct social kind requiring specific epistemic infrastructure (e.g., public language, salient focal points). If the former, CK is a redundant description of stability. This project will resolve this by testing whether CK emerges endogenously from learning rules or requires exogenous epistemic inputs.

  **2. Background and Gap**
  Lewis's account (*Convention*, 1969) is static; it specifies the conditions for a convention to *exist*, but treats the arrival of common knowledge as a primitive (often via "salience"). It does not explain how finite agents acquire infinite belief hierarchies.

  Evolutionary accounts (e.g., Skyrms, Young) solve the emergence problem but often bypass the epistemic state. They show that agents *behave* as if they have conventions. However, they typically assume myopic learning or treat strategies as black boxes. They demonstrate *stability*, but do not verify the *epistemic depth* of the agents involved.

  The gap is this: We know evolutionary dynamics produce stability. We do not know if they produce the specific epistemic architecture Lewis deemed necessary. Existing literature assumes these are equivalent; this project tests that equivalence.

  **3. Methodology**
  This is a conceptual-empirical hybrid project using agent-based modeling (ABM) to stress-test a philosophical distinction. No lab work or human subjects are required.

  **Phase 1: Conceptual Operationalization (Months 1-2)**
  I will formalize the distinction between **Shallow Conventions** (stability sustained by first-order expectations: *I expect you to do X*) and **Deep Conventions** (stability sustained by common knowledge: *I know that you know that I know...*).
  *   *Deliverable:* A formal mapping of Lewis's conditions onto belief states within an agent architecture.
  *   *Key Task:* Define a metric for "Epistemic Depth." Since infinite recursion is impossible in code, I will define a threshold (e.g., belief depth $k \geq 5$) that functionally approximates CK for the agents' decision calculus.

  **Phase 2: Simulation (Months 3-4)**
  I will build a Python-based ABM using a standard coordination game (e.g., Stag Hunt or Driving Side).
  *   *Agents:* Possess explicit belief states, not just strategies. They track beliefs about neighbors' actions and beliefs about neighbors' beliefs.
  *   *Dynamics:* Agents update via reinforcement learning and belief revision based on interaction history.
  *   *Variable:* I will run two conditions.
      1.  *Blind Evolution:* Agents observe actions only.
      2.  *Public Signaling:* Agents have access to a costless "cheap talk" channel or public signal before play.
  *   *Measurement:* I will track whether the system reaches behavioral stability (ESS) and, independently, whether the agents' internal belief states reach the "Deep" threshold.
  *   *Hypothesis:* Blind evolution will yield Shallow Conventions (stable behavior, low belief depth). Public signaling will be required to trigger Deep Conventions.

  **Phase 3: Case Analysis & Synthesis (Months 5-6)**
  I will apply the Shallow/Deep distinction to two paradigmatic cases from the literature:
  1.  *Traffic Norms:* Likely Deep (supported by explicit signage/law/publicity).
  2.  *Implicit Queueing/Social Distancing:* Likely Shallow (emergent, often fragile, low epistemic depth).
  *   *Deliverable:* A final paper arguing that "convention" is an ambiguous term covering two distinct social phenomena, with different normative implications.

  **4. Why This Is Philosophy, Not Game Theory**
  An evolutionary game theorist seeks to prove convergence theorems: *Under conditions X, strategy Y dominates.* Their interest ends when stability is demonstrated.
  My interest begins there. I am asking about the *ontological status* of the resulting regularity. If agents are stable but lack common knowledge, do they have an *obligation* to conform? Lewis ties the normativity of convention to the mutual knowledge of the agreement. If the epistemic condition fails, the normative force may differ. This project uses simulation not to discover new equilibria, but to interrogate the definition of a social fact.

  **5. Scope and Risk Management**
  *   **Risk:** The simulation becomes too complex. Tracking higher-order beliefs exponentially increases computational load.
      *   *Mitigation:* I will limit agent memory and belief depth to a fixed, small integer (e.g., depth 3). The goal is not realistic cognitive modeling but proving the *possibility* of emergence. If depth 3 is not reached, CK is certainly not present.
  *   **Risk:** The distinction collapses (i.e., stability mathematically necessitates high-order beliefs).
      *   *Mitigation:* This is a valid positive result. The project succeeds if it demonstrates that Shallow and Deep are extensionally equivalent, thereby vindicating the EGT reduction of Lewis.
  *   **Scope Check:** This is not a dissertation. I am not building a general theory of norms. I am testing one specific claim: *Does Evolution imply Common Knowledge?* The case studies are illustrative, not exhaustive empirical work.

  **6. Expected Outcomes**
  1.  **A Refined Taxonomy:** A clear philosophical distinction between Shallow (behavioral) and Deep (epistemic) conventions.
  2.  **Simulation Evidence:** Data showing whether standard learning rules bridge the gap between stability and common knowledge.
  3.  **Publication:** A target article for a journal like *Philosophy of Science* or *Synthese*, arguing that Lewis was right to insist on CK, but wrong to assume it comes for free with coordination.

  **7. Timeline**
  *   **Month 1:** Formalize belief architecture; literature review on EGT belief learning.
  *   **Month 2:** Code basic environment; test agent belief updates.
  *   **Month 3:** Run "Blind" simulations; collect data on belief depth vs. stability.
  *   **Month 4:** Run "Signaling" simulations; compare results.
  *   **Month 5:** Draft case studies; integrate simulation data into philosophical argument.
  *   **Month 6:** Finalize paper; submit for publication.

  **8. Budget**
  *   $0. (Existing hardware, open-source Python libraries).
  *   Time buy-out: 1 course release (or equivalent summer stipend).

  **9. Conclusion**
  This project resolves a tension between the two dominant frameworks in social ontology. By treating common knowledge as an empirical variable rather than a theoretical assumption, we can determine if Lewisian convention is a natural kind or a philosopher's fiction. The scope is tight, the method is feasible, and the result will clarify the foundation of social norms.
