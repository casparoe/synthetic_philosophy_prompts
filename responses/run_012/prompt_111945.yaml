          *   Denominations can survive bullion disappearance.
          *   Money is useful only insofar as it stirs industry and facilitates sharing labour fruits.
          *   True wealth = elements + human labour, not coin.
          *   National bank plan (sketched then dropped by Berkeley, now revived here).
      *   **Tone/Style:**
          *   Flat, euphemistic register of a present-day offer document (legal/financial boilerplate).
