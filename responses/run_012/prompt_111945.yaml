  **THE NATIONAL INDUSTRY BANK PLC**

  **PROSPECTUS FOR THE ISSUE OF CLASS A CREDIT TICKETS**

  **Letter from the Chairman**

  Dear Subscriber,

  We are pleased to invite you to participate in a banking facility founded upon first principles. For too long, the public has conflated wealth with the accumulation of precious metals, mistaking the counter for the game itself. Our institution operates on the conviction that true wealth lies in the elements and human labour rather than in coin. Money is useful only so far as it stirs up industry and lets men share the fruits of one another's labour. Accordingly, we have dispensed with the burden of bullion reserves to focus entirely on the stimulation of productive capacity. We believe this model offers a superior mechanism for national enrichment, provided the public is disposed to make use of such an expedient.

  Yours faithfully,
  *The Chairman*

  **1. Nature of the Instruments**

  1.1 The Bank shall issue Credit Tickets (the "Notes") denominated in Sterling units.
  1.2 Subscribers acknowledge that the Notes possess no intrinsic value. They are not claims upon gold, silver, or any other commodity stored within the Bank's vaults, as no such vaults shall be maintained.
  1.3 The Bank operates on the principle whether "the true idea of money, as such, be not altogether that of a ticket or counter". Accordingly, the Notes function solely as counters for reckoning, recording and transferring claims to goods.
  1.4 The denominations of the Notes shall survive irrespective of the disappearance of the bullion they traditionally name. The value of the Pound Sterling is decoupled from precious metal and attached instead to the aggregate industry of the Realm.

  **2. Assets and Backing**

  2.1 The Notes are not redeemable for coin. Upon presentation at the counter, the Depositor shall be offered a ticket where he expected a coin, or goods equivalent to the current labour-value of the ticket.
  2.2 The Bank's reserves consist entirely of the productive capacity of its Subscribers. The value of the Note is backed by the expectation that holders will engage in industry to redeem the claims represented by the Tickets.
  2.3 The Bank retains the discretion to adjust the supply of Notes to ensure they circulate sufficiently to stir up industry.

  **3. Principal Risks**

  3.1 **Valuation Risk:** The value of the Notes is contingent upon the willingness of others to accept them in exchange for goods or labour. If nobody will take a Ticket in exchange, the Ticket holds no value.
  3.2 **Industry Risk:** As the true source of wealth is human labour, the value of the Notes may fluctuate based on the industriousness of the population. A claim on the labour of others amounts to nothing when those others turn idle. Subscribers bear the risk of national indolence.
  3.3 **Hoarding Risk:** The utility of the Notes depends upon circulation. Subscribers who hoard their Tickets instead of returning them to circulation diminish the collective wealth. The Bank accepts no liability for value lost through stagnation of credit.
  3.4 **Discretionary Issuance:** The Board shall decide how many Tickets are to be issued and on what ground. This determination is based on the Board's assessment of when the public should seem disposed to make use of such an expedient. This decision is final and not subject to external audit.
  3.5 **Redemption Risk:** There is no guarantee that a Note presented for redemption will be met with coin, as coin is not held. Redemption may be satisfied in kind or in further Notes.

  **4. Dissenting Note**

  *The following objection was lodged by a prospective Subscriber during the pre-offer period and is recorded here for transparency:*

  "I subscribed expecting a store of value that I might retain without obligation to my neighbour. This document suggests my wealth is valid only so long as I work or spend. If I choose to save, I am told I hinder industry. If I choose to hold, I am told the claim is void should labour cease. I sought a bank to protect my coin from the market, not to bind my labour to the bank. I withdraw."

  **5. Declaration**

  5.1 By signing this Prospectus, the Subscriber confirms they have read the Principal Risks and understand that the Bank offers no security beyond the mutual credit of the industrious.
  5.2 This document is issued in accordance with the prevailing theories of political economy as interpreted by the Board.

  *End of Prospectus*
