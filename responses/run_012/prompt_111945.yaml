          *   Dry and legible to an undergraduate.
          *   Specialist should recognize the satire is fair and accurate to Berkeley.
          *   British English.
          *   Around 800 words.
          *   Structure: Letter from Chairman, Headings, Numbered Clauses, Section on Notes/Backing, Principal Risks, Closing Dissenting Note from an invented subscriber.
          *   Constraint: Do not put words into Berkeley's mouth (only use the provided fragment: "whether 'the true idea of money, as such, be not altogether that of a ticket or counter'"). No other quotes/titles/dates.

  2.  **Deconstruct the Berkeleyan Doctrine for a Modern Prospectus:**
      *   *Money as Ticket:* The bank notes aren't promises to pay gold; they are tokens of credit based on future labour/industry.
      *   *Wealth as Labour:* The "assets" backing the currency aren't reserves, but the productive capacity of the nation/people.
      *   *Circulation is Key:* Hoarding is detrimental. The bank might need mechanisms to discourage hoarding (though the prompt asks for risks, not necessarily solutions).
      *   *Intrinsic Value:* Denial of intrinsic value in precious metals.
      *   *Risk:* What happens if people stop working? What if the "ticket" isn't accepted? Who decides the supply?

