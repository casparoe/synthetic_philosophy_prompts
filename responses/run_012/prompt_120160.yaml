          *   *Move Up/Down:* If a reliable physiological correlate of "preference" is found, this drops. If not, it stays critical.

      *   **Q3: Stability vs. Accuracy (Inconsistency).**
          *   *Why Upstream:* Popular lit conflates changing your mind with being wrong.
          *   *Method:* Longitudinal studies.
          *   *Crowded:* Moderate.
          *   *Move Up/Down:* If data shows high instability in "basic" sensations, moves up.

      *   **Q4: The Trainability of Introspection.**
          *   *Why Downstream:* Depends on Q1 & Q2.
