          *   *Move Up/Down:* If new fMRI work shows overlapping neural substrates, it moves up (harder to distinguish). If behavioral tasks successfully dissociate them, it moves down (settled).

      *   **Q2: The Criterion of Accuracy (The "No Photograph" problem).**
          *   *Why Upstream:* You can't claim error without a truth condition.
          *   *Method:* Methodological innovation (process tracing, physiological markers).
