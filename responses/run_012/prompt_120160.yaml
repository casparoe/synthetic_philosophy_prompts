      *   *Trained introspectors:* Nuanced. They are better at *description*, not necessarily *causal attribution*.
      *   *Settled:* The Nisbett & Wilson (1977) specific claims about verbal reports of mental processes are largely settled (we are bad at causal theories), but *phenomenal* reports are not discredited.

