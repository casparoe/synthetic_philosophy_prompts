          4.  **Mitigation:** Can training help? (Downstream application).

  4.  **Fleshing out the Questions (incorporating constraints):**

      *   **Q1: The Phenomenal/Causal Distinction.**
          *   *Why Upstream:* If choice blindness only affects causal reasoning, the "introspection is fiction" claim fails.
          *   *Method:* Conceptual analysis + Experimental design (dissociating the two).
