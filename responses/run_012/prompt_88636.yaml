  # Taxonomy of Higher-Order Evidence Responses

  **Instructions:** Start at Node 1. Answer the question based on your intuition about the specific case described. Follow the branch to the next node or leaf. If you reach a leaf, read the position name and its awkward commitment. If a path notes that a distinction is indistinguishable or unoccupied, record that observation.

  ### Node 1: The Calibration Journal (Direct vs. Indirect)
  **Case:** You check your journal and see your "90% confidence" claims have been true only 50% of the time. You are now making a new claim with 90% confidence.
  **Question:** Does the journal statistic act as evidence *against the world being the way you claim*, or does it act as evidence *against your ability to judge* the world correctly?
  *   **Branch A:** It makes the claim itself less likely to be true. (Go to Node 2)
  *   **Branch B:** It makes my judgment unreliable, but the claim might still be true. (Go to Node 3)

  ### Node 2: The Weak Study (Uncertain HOE)
  **Case:** A noisy, underpowered study suggests people with your training tend to overestimate evidence strength by 20%.
  **Question:** Do you lower your confidence in your claim by exactly 20%, or does the mere presence of credible doubt force you to suspend judgment entirely?
  *   **Branch A:** Lower proportionally. (Go to Leaf 1)
  *   **Branch B:** Suspend judgment entirely. (Go to Leaf 2)

  ### Leaf 1: The Total-Evidence / Conciliationist Hybrid
  **Position:** Higher-order evidence is just more first-order evidence; you sum it all up and adjust credence accordingly.
  **Note on Indistinguishability:** In practice, this leaf often swallows the distinction between "Total Evidence" views and "Conciliationism," as both require adjusting credence to match the expected reliability of the output.
  **Awkward Commitment:** It treats your own cognitive machinery as merely another data source, potentially ignoring that the machinery is the tool required to measure the data.

  ### Leaf 2: Strong Conciliationism
  **Position:** Any credible evidence of unreliability acts as a defeater that requires suspension of belief until reliability is restored.
  **Awkward Commitment:** It forces you to abandon beliefs that are supported by strong first-order evidence simply because you suspect you might have processed that evidence poorly.

  ### Node 3: The Parochial Standards (Scope of Error)
  **Case:** You suspect the standards of argument you use are merely artifacts of your specific academic training, not universal norms.
  **Question:** Can you use your current standards to identify which of your standards are biased, or are you trapped inside them?
  *   **Branch A:** I can self-correct from within. (Go to Node 4)
  *   **Branch B:** I am trapped; I cannot step outside my standards to judge them. (Go to Node 5)

  ### Node 4: The "Drunk Logic" Case (Process vs. Levels)
  **Case:** You have a specific suspicion that you reasoned poorly on this occasion (e.g., you were tired), but the conclusion still seems obvious to you.
  **Question:** Is it coherent to believe the conclusion is true while simultaneously believing you have no rational right to hold that belief?
  *   **Branch A:** Yes, belief and evaluation can split. (Go to Leaf 3)
  *   **Branch B:** No, your evaluation of your reasoning dictates your belief. (Go to Leaf 4)

  ### Leaf 3: Rational Akrasia (Level-Splitting)
  **Position:** It is rational to hold a first-order belief while holding a higher-order belief that the first-order belief is irrational.
  **Awkward Commitment:** It requires you to accept that you are currently violating epistemic norms without viewing that violation as a reason to change the belief.

  ### Leaf 4: The Steadfast View
  **Position:** First-order evidence trumps higher-order evidence; if the argument looks sound, you should believe it despite doubts about your reliability.
  **Note on Permissivism:** This leaf often houses Permissivists who argue that *both* steadfastness and conciliation are rational options, avoiding akrasia by denying uniqueness.
  **Awkward Commitment:** It implies you can rationally disregard clear data about your own cognitive incompetence if the first-order view seems clear.

  ### Node 5: The Self-Undermining Check (Stability)
  **Case:** You conclude your standards are untrustworthy. Does this conclusion rely on the very standards you just deemed untrustworthy?
  **Question:** Does the doubt consume its own foundation, or can the doubt stand on firmer ground than the standards it attacks?
  *   **Branch A:** The doubt consumes itself; nothing is secure. (Go to Leaf 5)
  *   **Branch B:** The doubt is secure; I can trust the conclusion that I cannot trust my standards. (Go to Node 6)

  ### Leaf 5: Epistemic Nihilism
  **Position:** Radical doubt is self-undermining and leaves no normative structure standing.
  **Note on Unoccupied:** Few philosophers explicitly advocate this as a stable position; it is usually treated as a *reductio* of radical skepticism.
  **Awkward Commitment:** It offers no guide for action, not even the guide to seek better standards or stop believing.

  ### Node 6: The Normativity Check (Requirement vs. Description)
  **Case:** You have securely concluded that your standards are broken.
  **Question:** Does this conclusion impose a *requirement* on you to stop believing, or does it merely describe your state as lacking justification?
  *   **Branch A:** It requires me to stop believing. (Go to Leaf 6)
  *   **Branch B:** It describes the state; belief is not governed by requirements. (Go to Leaf 7)

  ### Leaf 6: Global Skepticism
  **Position:** You ought to suspend judgment universally because no normative standard can be trusted.
  **Awkward Commitment:** It is practically impossible to live by, as action requires belief, forcing a disconnect between your epistemology and your life.

  ### Leaf 7: The Anti-Requirement View
  **Position:** Belief is not governed by normative requirements in the way the framing assumes; epistemology is descriptive, not prescriptive.
  **Awkward Commitment:** It dissolves the concept of epistemic justification entirely, making "rationality" a label rather than a constraint.

  ***

  ### Unoccupied/Incoherent Combinations
  *   **Steadfast + Strong Conciliation:** A path leading to "I should ignore reliability data" (Steadfast) combined with "Reliability data forces suspension" (Conciliation) is incoherent and no position occupies it.
  *   **Direct Evidence + Self-Undermining:** If HOE is treated as direct evidence about the world (Node 1, Branch A), the Self-Undermining check (Node 5) rarely applies, as the evidence is external to the reasoning process. A user forcing this combination may find the questions category-errors.
