answer: |-
  (a) **The Case of the Grain Pyre**
  In the mercantile oligarchy of Ostraca, succession to a trading House requires the heir to perform the "Grain Pyre": burning a quantity of staple grain equal to the predecessor's age in the public square. This custom is materially costly; grain is the primary collateral for loans, and the Grain Guild offers favorable credit *only* to Houses that perform the Pyre, as the destruction maintains high market prices. Philosophers and priests have long argued that the Pyre is wasteful and cruel during famines, but these arguments have stagnated; the moral vocabulary of "ancestral debt" overrides them. The custom persists because the credit access (interest) outweighs the grain loss, and the rite signals solvency (honor).

  The collapse occurs when the Royal Registrar, a low-level bureaucrat controlling the *Book of Precedence*, unilaterally alters the entry protocol. Without debate or law, he begins listing heirs who *donate* the grain to the poor as "Stewards" in bold type, while listing those who *burn* it as "Incinerators" in faint script. The *Book* determines seating at the Exchange and the order of salutations, conferring no legal rights or direct income. The Grain Guild continues to offer credit for burning. The moral arguments against waste remain unchanged. Yet, within a season, the Pyres cease. Heirs forego the favorable credit to secure the "Steward" designation, as the faint script renders them socially invisible among the elite.

  (b) **Predictions of the Three Explanations**
  *   **The Argument Explanation** predicts **persistence**. The moral case against the Pyre (waste, suffering) was fully articulated by priests and philosophers generations prior and failed to move the elite. The Registrar offered no new moral reasoning, only a bureaucratic reclassification. Since the cognitive moral landscape remained static, the custom should have endured.
  *   **The Interest Explanation** predicts **persistence**. The material payoffs favored the custom: the Grain Guild maintained its offer of favorable credit for burning, and the loss of grain capital was offset by the liquidity provided by the loans. The Registrar's action cost nothing and changed no laws, taxes, or market prices. Since the economic incentive structure remained identical, rational actors should have continued burning to secure credit.
  *   **The Honor Explanation** predicts **collapse**. The custom existed to signal standing within the elite. The Registrar controls the *symbolic taxonomy* of that standing. By decoupling prestige from the act of burning and attaching it to donation via the *Book*, he altered the code of honor without altering material consequences. To burn was to be labeled an "Incinerator" (low status); to donate was to be a "Steward" (high status). The elite abandoned the custom to preserve their social rank, independent of profit or moral persuasion.

  (c) **The Critical Feature and Deletion Test**
  The feature doing the work is the **arbitrary decoupling of status signaling from material payoff**. The Registrar changed *what the action signified* without changing *what the action cost* or *what the action achieved materially*. If this feature is deleted—i.e., if the Registrar simply argues that donation is morally superior—the case collapses into the **Argument Explanation**, relying on persuasion. If the Registrar instead taxes the burning or subsidizes the donation, the case collapses into the **Interest Explanation**, relying on payoff shifts. The specificity of the case rests on the change being purely symbolic yet socially binding.

  (d) **The Interest Explanation Reply**
  A defender of the Interest Explanation (à la Eric Williams) would reply: **"Social standing is a form of capital. Exclusion from the *Book of Precedence* reduces access to marriage markets, informal deals, and trust networks, which ultimately translates to financial loss. Therefore, the elites acted to maximize long-term economic utility; the 'honor' shift was merely a change in the price of social capital."**

  This reply **fails** because it renders the Interest Explanation unfalsifiable. If any change in behavior is retroactively defined as an "interest" maximization because status has *some* eventual cash value, the distinction between Interest and Honor dissolves. In this case, the credit (hard interest) was explicitly available for *continuing* the custom. The elites chose *against* immediate, guaranteed liquidity for the sake of a title. To call this "interest" requires assuming a conversion rate between status and cash that the actors explicitly violated in the short term. The mechanism of change was the *fear of shame*, not the *calculation of profit*.

  (e) **The Mirror-Image Companion Case**
  Consider the **"Silent Vigil"** in the neighboring state of Vellum. Apprentices must remain mute for five years to prove discipline.
  *   **Interest Prediction (Collapse):** A new communication technology (the telegraph) makes instant verbal negotiation essential for trade. Silent apprentices cannot close deals; their economic value drops to zero. The material payoff of the custom vanishes.
  *   **Honor Prediction (Persistence):** The Master Guild codifies that speaking before the five years is an act of cowardice and weakness. The code of honor demands silence regardless of utility.
  *   **Outcome:** The apprentices begin to speak. The economic necessity of using the telegraph overrides the shame of breaking the vow. Here, the **Interest Explanation** correctly predicts collapse while the **Honor Explanation** predicts persistence, demonstrating that the two mechanisms are distinct and can operate in opposition.
