answer: |-
  **Commencement Address**

  Good morning. Trustees, faculty, families, and most importantly, the Class of 2024.

  It is a tradition, I believe, for the speaker at an event like this to offer you a tool for the future. Usually, that tool is a piece of wisdom about character. You hear variations on the same theme: "Trust yourself." "Follow your passion." "Listen to your inner voice."

  I stand here as a professor of psychology, and I have a confession to make. If I put those phrases on a final exam, I would have to mark them as incorrect.

  I know that sounds like a strange way to start a celebration. It sounds like I'm about to tell you that you are lost, that you don't know who you are, and that the compass you've been handed is broken. I am not going to tell you that. But I do want to offer you a different tool. One that is honest about how your mind actually works, and one that you can use without feeling like a fraud.

  Here is the reality: Human beings are not designed to know the true causes of their own behavior. We are designed to explain them.

  Let me give you an example from ordinary life. Imagine you are walking down the street and you see a person drop a stack of papers. The wind is blowing. You stop. You help them gather the sheets. You hand them back. They thank you. You walk away feeling good.

  Later, a friend asks, "Why did you stop to help?"

  You will have an answer ready. You might say, "Because I'm a helpful person." Or, "Because I know how stressful that is." Or, "Because my parents raised me right."

  Those answers feel true. They feel like the cause. But decades of research suggest that those explanations are likely a story you assembled *after* you had already stopped walking. The actual reason you stopped was a complex, lightning-fast calculation involving your mood, the weather, how rushed you were, whether you made eye contact, and a dozen other variables you cannot name. The story about being a "helpful person" is the press release your brain issued after the event was over.

  We do this with everything. We choose a partner, and later we list the reasons why they were the only logical choice. We choose a career, and we construct a narrative about how we were always destined for it. We get angry in traffic, and we insist it is because the other driver was reckless, ignoring the fact that we are hungry and tired.

  We are constantly writing the biography of a person we are still in the middle of being, and we are writing it in ink, as if the plot was decided before we started the chapter.

  So, if you cannot trust the story you tell yourself about why you do things, what can you trust? If "follow your heart" is scientifically shaky, what is the alternative?

  You can trust your attention.

  You may not know *why* you are interested in something. You may not know *why* a certain problem keeps pulling at your sleeve. You may not know *why* you feel a sense of quiet when you walk into a hospital, or a workshop, or a courtroom. The story you tell about that interest might be wrong. You might think you want to be a doctor because you want to help people, when the reality is you are fascinated by systems and puzzles. That doesn't matter.

  What matters is where your eyes go. What matters is what you notice when everyone else looks away.

  Your explanations are history. Your attention is the present.

  Here is the gift in this. If you stop trying to interrogate your own motives, you stop wasting energy on a mystery you cannot solve. You stop waiting for a lightning bolt of certainty that tells you who you "really" are. That certainty is not coming. The story will always be written after the fact.

  Instead, look at where your attention lands.

  When you are in a room, what are you looking at? When you have an hour of free time, what do you reach for? When you are listening to a conversation, what part of it makes you lean forward?

  That leaning forward is real. The chemical surge of curiosity is real. The fatigue of boredom is real. These are not stories. They are data.

  So, my charge to you is this: Do not spend the next decade trying to validate the story you told yourself today. Do not worry if your reasons for taking a job don't sound noble enough to your grandparents. Do not worry if the narrative of your life doesn't feel consistent from one year to the next. Consistency is for resumes. Life is for paying attention.

  If you find yourself constantly looking at the way light hits a building, follow that attention. You might become an architect, or a photographer, or a physicist. The label is the story you will write later. The looking is the truth.

  If you find that you cannot walk past a conflict without trying to resolve it, follow that attention. You might be a lawyer, or a therapist, or a parent. The explanation is secondary. The pull is primary.

  There is a freedom in this. It means you don't have to know the destination to start the engine. You don't have to know the ending to write the sentence. You only have to notice what is in front of you, and notice where you want to place your hands.

  The world is full of people reciting scripts about who they are, defending stories that were written years ago. Be something else. Be someone who watches where their attention goes, and has the courage to walk in that direction.

  The story will catch up to you eventually. It always does. But for now, just pay attention.

  Congratulations.

  ***

  **Private Note to the Speaker**

  **What is Settled:**
  1.  **Confabulation:** It is robustly replicated (Nisbett, Wilson, Gazzaniga, etc.) that humans often lack direct introspective access to the causal mechanisms of their behavior. We generate plausible explanations that fit our self-concept or cultural scripts, even when those explanations are factually incorrect regarding the *cause* of the action.
  2.  **The "Interpreter":** The left hemisphere's tendency to create coherent narratives from disjointed inputs is a widely accepted model, particularly stemming from split-brain research, though applied more broadly now.
  3.  **Limited Introspection:** The idea that we have privileged, infallible access to our own mental states is largely rejected in cognitive science. We observe ourselves much like we observe others, just with more data, but still subject to bias.

  **What is Debated / Nuanced:**
  1.  **Degree of Access:** While we don't have *perfect* access, some researchers argue we aren't *completely* blind either. There is a spectrum. Some motives are accessible; some are not. The speech leans toward the "mostly a story" side, which is safe for a general audience but technically represents the "strong situationist" or "confabulation" camp.
  2.  **"Trust Your Attention":** This is the riskiest part scientifically. Attention is also biased (confirmation bias, salience bias, emotional coloring). Trusting attention is a *clinical heuristic* (used in mindfulness and ACT therapy) rather than a hard cognitive science fact. Attention tells you what you value *in that moment*, but it doesn't guarantee long-term well-being or moral correctness.
  3.  **The "Self":** The speech implies a distinction between the "storytelling self" and the "attending self." In philosophy of mind and neuroscience, whether these are two distinct systems or just different modes of the same network is still argued.
  4.  **Nihilism vs. Agency:** Some critics argue that emphasizing confabulation too heavily can undermine agency. The speech counters this by shifting agency from "choosing based on reasons" to "choosing based on focus," which is a valid pragmatic move, but theoretically contentious regarding free will.

  **Bottom Line:** You aren't violating consensus by saying we confabulate reasons. You are offering a *pragmatic* solution (follow attention) to a *descriptive* problem (we don't know our reasons). That is therapeutically sound, even if the "trustworthiness" of attention is a philosophical stance rather than a lab finding.
