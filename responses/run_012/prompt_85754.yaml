      *   **Topic:** Honest Signaling / Handicap Principle (Zahavi), specifically focusing on cost, differential benefit/cost, equilibrium, and receiver psychology.
      *   **Goal:** Students should *feel* the concepts (costly signaling, differential cost, threshold, receiver complicity) rather than just hear about them.
      *   **Constraints:** 80 minutes, 18 students (juniors/seniors, bio/philosophy mix), seminar room, whiteboard, no laptops, limited budget (bag of poker chips).
      *   **Pedagogy:** Inquiry-based/Experiential. Don't name the theory upfront. Let the game mechanics teach. Debrief at the end.
      *   **Specific Learning Outcomes:**
          1.  Equal cost = no information (annoyance).
          2.  Differential cost = information emerges without intent.
          3.  The Margin/Threshold (where it collapses vs. works).
          4.  Receiver's role (complicity/discomfort).
      *   **Output Needs:** Game design (rules, rounds, payoffs), Script (intro), Timeline, Debrief plan (mapping game to theory, limitations), Troubleshooting (what goes wrong, ethical objections).
      *   **Tone:** American English, practical, experienced instructor vibe.

  2.  **Deconstruct the Theory for Game Design:**
      *   *Core Concept:* Signaling theory (Spence/Zahavi).
      *   *Players:* Senders (Peacocks) and Receivers (Peahens).
      *   *Hidden Info:* Sender "Quality" (High vs. Low).
      *   *Signal:* Something costly (Chips).
      *   *Payoff:* Receiver chooses Sender based on signal. Sender gets mating reward (Chips).
      *   *Crucial Mechanic:* Cost must be *higher* for Low Quality than High Quality to separate the equilibrium. If cost is equal, pooling equilibrium (no info).
      *   *Crucial Mechanic 2:* Receiver must have an incentive to pick High Quality.
      *   *Crucial Mechanic 3:* There must be a threshold where Low Quality stops mimicking.

  3.  **Drafting the Game ("The Mating Market"):**
      *   *Setup:* 18 students. Split into Senders (12) and Receivers (6). Ratio matters. Let's make it 12 Senders, 6 Receivers.
      *   *Quality:* Assign secretly. Half High (H), Half Low (L).
      *   *Currency:* Poker chips.
      *   *Rounds:* Need iteration to find equilibrium. 3-4 Rounds.
      *   *Mechanism:*
          *   Senders get an endowment.
          *   Senders bid chips to attract a Receiver.
          *   Receivers observe bids, pick a Sender.
          *   Payoff: If picked, Sender gets a big reward. Receiver gets a reward *only if* they picked a High Quality Sender.
          *   *Cost:* Sending the signal costs chips.
          *   *The Twist (Round 1 vs Round 2):* Round 1: Cost is equal for H and L. (Should fail/Pool). Round 2: Cost is higher for L than H. (Should separate).
      *   *Wait, how to enforce differential cost physically?*
          *   Idea: High Quality players have a "discount card" or just pay less from their endowment? No, that's visible.
          *   Idea: High Quality players get more endowment? No, that signals quality directly.
          *   Idea: The *penalty* for signaling is different.
          *   *Better Idea:* Use a "tax" mechanism. When a Sender bids $X$, High Quality pays $X$, Low Quality pays $1.5X$ (rounded). But how to enforce without public knowledge?
          *   *Best Idea for Classroom:* The "Survival" mechanic.
              *   Everyone starts with 10 chips.
              *   Signal = Bid chips into a pot.
              *   Round 1: Cost is 1:1 for everyone.
              *   Round 2: Low Quality players have a "metabolic burden." For every chip bid, they lose 2 from their stash. High Quality lose 1.
              *   *Problem:* Students will reveal their cost structure if asked.
              *   *Solution:* Private accounting sheets. Instructor audits.
      *   *Refined Game Structure:*
          *   **Roles:** 12 Suitors (Senders), 6 Choosers (Receivers).
          *   **Hidden Trait:** Suitors are Type A (High) or Type B (Low). 6 of each.
          *   **Goal:** Suitors want to be chosen. Choosers want to pick Type A.
          *   **Signal:** Suitors place a bid (chips) face down.
          *   **Payoff:**
              *   Chooser gets 5 chips if they pick Type A, 0 if Type B.
              *   Suitor gets 10 chips if chosen.
              *   **Cost:** Suitor pays the bid amount from their personal stash.
              *   **The Kicker:** Type B Suitors pay *double* the bid amount from their stash. Type A pay 1:1. (This is the differential cost).
          *   **Rounds:**
              *   Round 1: Equal Cost (1:1 for both). *Prediction: Pooling/Noise.*
              *   Round 2: Differential Cost (1:1 for A, 2:1 for B). *Prediction: Separation.*
              *   Round 3: Open discussion/Adjustment.
      *   *Wait, one constraint:* "Don't name the principle." I need to hide *why* the cost is different.
      *   *Fix:* Give them "Constitution Cards." Type A card says "Cost = Bid." Type B card says "Cost = 2x Bid." They keep this secret.
      *   *Endowment:* Give everyone 20 chips to start. Bankrupt = Out (or just negative score). Let's use score tracking to avoid elimination (keeps everyone engaged).

  4.  **Developing the Timeline (80 mins):**
      *   0-10: Setup & Rules (Script).
      *   10-25: Round 1 (Equal Cost). Play + Tally.
      *   25-30: Frustration/Debrief Round 1 (Why didn't it work?).
      *   30-45: Round 2 (Differential Cost). Play + Tally.
      *   45-55: Round 3 (The Margin). Tweak the cost slightly to test the threshold.
      *   55-75: The Big Debrief (Mapping to Peacocks).
      *   75-80: Wrap up.

  5.  **Refining the "Feeling":**
      *   To make them feel the "annoyance" of equal cost: In Round 1, Low Types should be able to mimic High Types easily. High Types will get annoyed they can't distinguish themselves.
      *   To make them feel the "Receiver Complicity": Choosers need to feel anxious about picking wrong.
      *   To make them feel the "Margin": In Round 3, change the multiplier for Low Types from 2x to 1.2x. See if the signal collapses.

  6.  **Addressing the "What Goes Wrong":**
      *   *Collusion:* Students talking across teams. (Mitigation: No talking during bidding).
      *   *Ethical Objection:* "Why are we reducing mating to chips?" (Mitigation: Acknowledge abstraction, focus on logic).
      *   *Math Errors:* Private cost calculation. (Mitigation: Instructor audit or honor system with severe penalty).
      *   *Boredom:* Losers checking out. (Mitigation: Cumulative score, chips = grade credit/bragging rights).
      *   *The "Receiver Taste" Issue:* The prompt asks about fixing receiver preferences. In the game, receivers *want* Type A because the rules say so. In nature, that preference evolves. I need to highlight this limitation in the debrief.

  7.  **Drafting the Script:**
      *   Needs to be neutral. "You are agents in a market." No mention of peacocks until the end.
      *   Emphasize secrecy.

  8.  **Drafting the Debrief:**
      *   Connect Round 1 to "Cheap Talk" or "Pooling Equilibrium."
      *   Connect Round 2 to "Handicap Principle."
      *   Connect Receiver payoff to "Co-evolution of Preference."
      *   Admit the limitation: We stipulated the preference; nature had to evolve it.

  9.  **Review against Constraints:**
      *   American English (Check: "chips," "grades," "semester," "trash talk").
      *   No laptops (Check: Paper sheets).
      *   Poker chips (Check: Currency).
      *   18 Students (Check: 12 Senders, 6 Receivers).
      *   80 Mins (Check: Timeline).

  10. **Final Polish:**
      *   Make sure the "Margin" concept is clear. I'll add a Round 3 where the cost differential is reduced to see if the signal breaks.
      *   Ensure the "Receiver Complicity" is highlighted. The Receivers *create* the value of the signal by rewarding it.
      *   Handle the "Immoral" objection: Keep it brief, validate, pivot to abstraction.

  *(Self-Correction during drafting)*: Wait, if I tell Type B their cost is double, they know they are Type B. That reveals their quality to *themselves*, but not others. That works. The secret is hidden from the *other players*, not the self.
