answer: |-
  Here is a complete lesson plan designed to hit those four specific visceral learning goals without lecturing the theory until the very end.

  ### The Game: "The Market for Traits"

  **Class Size:** 18 Students
  **Roles:** 12 "Proposers" (Senders/Peacocks), 6 "Selectors" (Receivers/Peahens).
  **Materials:**
  *   200 Poker Chips (or enough for 15 chips per student).
  *   18 Envelopes (12 for Proposers, 6 for Selectors).
  *   Printed "Private Ledger" sheets for Proposers.
  *   Whiteboard & Markers.
  *   A timer (your phone).

  **The Setup (Hidden Info):**
  *   **Proposers:** 6 are **Type Alpha** (High Quality), 6 are **Type Beta** (Low Quality). They know their own type, but Selectors do not.
  *   **Selectors:** Their goal is to match with a Type Alpha.
  *   **Currency:** Chips. Chips = Points. Points = Bragging rights (or a tiny bump in participation grade if you swing that way).

  ---

  ### Part 1: The Script (Read this verbatim or close to it)

  "Good morning. Put away everything except a pen. Today we are running a market simulation. There are no right answers, only profitable ones.

  I am dividing you into two groups. Twelve of you are **Proposers**. Six of you are **Selectors**.

  **Proposers:** Inside your envelope is a Role Card and a Ledger. Your Role Card tells you if you are Type Alpha or Type Beta. Keep this secret. Do not show it. Do not hint at it. Your goal is to be chosen by a Selector. If you are chosen, you earn 20 chips.

  **Selectors:** Your goal is to choose a Type Alpha Proposer. If you choose an Alpha, you earn 20 chips. If you choose a Beta, you earn 0.

  **The Mechanism:**
  We will run three rounds. In each round, Proposers will make a **Bid**. This is a number of chips you are willing to burn to attract a Selector. You write your bid on your Ledger. You do not show it to anyone yet.
  Selectors will observe the Bids. You will see the number, but you will not see the Proposer's Type. Based on the Bid, you will choose one Proposer to match with.

  **The Cost:**
  Here is the catch. Making a Bid costs you chips from your personal stash, regardless of whether you are chosen.
  *   **Round 1:** The cost is 1 chip per 1 chip bid for everyone.
  *   **Round 2 & 3:** Check your Role Card again. It may update your cost structure.

  You start with 20 chips. If you go negative, you are bankrupt and sit out the next round.

  Proposers, you want to be chosen, but you want to keep your chips. Selectors, you want the 20-chip reward, but you can't see the Types. You only see the Bids.

  Any questions on the mechanics? No questions on strategy. Begin Round 1."

  ---

  ### Part 2: The Timeline (80 Minutes)

  #### 0:00 – 0:10 | Setup & Distribution
  *   Hand out envelopes. Ensure seating separates Proposers and Selectors slightly so they can't whisper.
  *   Walk around to ensure everyone understands the "Cost" rule.
  *   **Crucial:** On the whiteboard, draw a blank table: *Round | Avg Alpha Bid | Avg Beta Bid | Selector Success Rate.* Tell them you will fill this in.

  #### 0:10 – 0:25 | Round 1 (The "Honesty" Trap)
  *   **Rule:** Cost is 1:1 for *everyone* (Alpha and Beta).
  *   **Action:** Proposers write bids. Selectors view bids (you collect the papers, write the bid on the board next to the Proposer's ID number, e.g., "P1: 5 chips").
  *   **Selection:** Selectors point to who they want.
  *   **Payoff:** Settle debts.
  *   **Expected Outcome:** Chaos. Betas will bid high because it's cheap. Alphas get outbid or have to spend too much. Selectors pick randomly. Success rate hovers around 50%.
  *   **The Feeling:** Alphas will be annoyed. "Why bother bidding if they can't tell the difference?" Selectors will be frustrated. "I can't tell who is good!"

  #### 0:25 – 0:30 | The Pivot (No Debrief Yet)
  *   Collect the chips. Reset stashes to 20.
  *   **Instruction:** "Check your Role Cards again. Update your Cost Ledger."
  *   **The Switch:**
      *   **Alpha Card:** Cost remains 1:1.
      *   **Beta Card:** Cost is now **2:1**. (To bid 5 chips, you pay 10 from your stash).
  *   *Note:* Do not announce this change to the room. Let them discover it privately. This is the "Differential Cost."

  #### 0:30 – 0:45 | Round 2 (The Separation)
  *   **Action:** Same bidding process.
  *   **Expected Outcome:** Betas cannot afford high bids (they go bankrupt fast). Alphas bid higher because it's "cheaper" for them relative to the reward. Selectors start picking the high bidders. Success rate jumps to 80-90%.
  *   **The Feeling:** Alphas feel relief. Selectors feel confident. Betas feel squeezed.

  #### 0:45 – 0:55 | Round 3 (The Margin)
  *   **Instruction:** "Check Role Cards. Update Cost."
  *   **The Switch:**
      *   **Alpha:** Cost 1:1.
      *   **Beta:** Cost is now **1.2:1**. (To bid 5 chips, you pay 6).
  *   **Action:** Play the round.
  *   **Expected Outcome:** The signal degrades. Betas can *almost* afford to mimic Alphas. Some will try. Selectors get nervous. Success rate drops.
  *   **The Feeling:** Instability. "Is this bid real or fake?"

  #### 0:55 – 1:15 | The Debrief (The "Aha" Moment)
  *   Write the results on the board.
  *   **Step 1: The Equal Cost (Round 1).** Ask an Alpha: "How did it feel when Betas could bid the same as you for the same price?" (Answer: Pointless). Write on board: **Equal Cost = No Information.**
  *   **Step 2: The Differential Cost (Round 2).** Ask a Beta: "Why didn't you bid 15 chips to win?" (Answer: Would have gone bankrupt). Write on board: **Cost must be higher for Low Quality.**
  *   **Step 3: The Margin (Round 3).** Ask the Selectors: "When did you start doubting the high bids?" Write on board: **The Threshold.**
  *   **Step 4: The Receiver.** Ask a Selector: "Did the bid have value before you decided to reward it?" (Answer: No). Write on board: **Value is created by the Receiver.**

  #### 1:15 – 1:20 | The Reveal & Limitations
  *   Reveal the theory: **The Handicap Principle (Zahavi) / Signaling Theory (Spence).**
  *   Connect to Peacocks: The tail is the bid. Predators/Survival is the cost.
  *   **The Limitation:** Ask them: "In this game, I told you Selectors *wanted* Alphas. In nature, where did that preference come from?"
  *   Acknowledge you papered over the co-evolution of preference. The game assumes the desire; nature has to build it.

  ---

  ### Part 3: The Debrief Script (Mapping the Experience)

  **1. On "Honesty" doing no work:**
  "In Round 1, you could have been the most honest Alpha in the world. It didn't matter. If a lie costs the same as the truth, the market floods with lies. You felt that annoyance. That's why 'honesty' isn't a virtue here; it's a math problem. If the cost isn't differential, the signal is just noise."

  **2. On Intent:**
  "Did any of you Betas think, 'I am signaling my fitness'? No. You thought, 'I want the chips.' Did any Alphas think, 'I am communicating genetic health'? No. You thought, 'I can afford this, they can't.' The information emerges *despite* you, not *because* of you. The tail doesn't mean 'I am strong.' The tail means 'I can survive this stupid tail.'"

  **3. On The Margin:**
  "Round 3 was the collapse. When the cost for the Beta dropped to 1.2, the signal got fuzzy. In the wild, this is the arms race. If predators get slightly worse at catching peacocks, the tail can get slightly bigger before it becomes lethal. We are always dancing on the edge of the margin where the lie becomes affordable."

  **4. On Receiver Complicity (The Uncomfortable Part):**
  "This is the part that should bug you. The chips only mattered because the Selectors agreed to trade them. If the Selectors went on strike and picked randomly, the Proposers would stop bidding tomorrow. The Peahen *creates* the value of the Peacock's tail by rewarding it. She isn't just reading a message; she is writing the check that makes the message worth sending. You aren't just observing nature; you are funding it."

  ---

  ### Part 4: What Will Go Wrong (And How to Fix It)

  **1. The "Collusion" Problem**
  *   **Risk:** Proposers and Selectors are friends. They wink or nod. "Pick me, I'm Alpha."
  *   **Fix:** Enforce a "No Verbal Communication" rule strictly. If caught, they are bankrupt immediately. Make them pass bids through *you* (the instructor) so you can scrub any notes on the paper.
  *   **Backup:** If it happens, call it a "mutation" in the receiver psychology and ask the class if that strategy is stable (it's not, because then everyone would claim to be Alpha).

  **2. The "Math Error" Problem**
  *   **Risk:** Betas in Round 2 forget the 2:1 cost, bid high, and then argue about the penalty.
  *   **Fix:** Have them calculate the *Cost* on their ledger sheet before handing it to you. You audit the sheet before settling payoffs. "Your bid is 10, your card says 2x, you owe 20. You have 15. You are bankrupt." Be a ruthless bank.

  **3. The "Moral Objection" (The Student Who Stops the Game)**
  *   **Risk:** A student says, "This reduces mating to a transaction. It's biologically reductionist/sexist/immoral."
  *   **Fix:** Do not argue. Validate and pivot.
      *   *Say:* "That is a valid critique of the model. Evolutionary models *are* abstractions. They strip away emotion to test the logic of incentives. We aren't saying peacocks feel greed. We are asking: if this incentive structure exists, does the tail evolve? If you think the model is wrong, your job is to find the variable we missed, not to refuse the math."
      *   *Keep moving:* "Note that objection for the debrief. Let's finish the round so you have data to critique."

  **4. The "Receiver Taste" Limitation (Your Suspicion)**
  *   **Your Suspicion:** You are right. In the game, I *fixed* the Receiver's preference (they get 20 chips for Alpha). In reality, the Peahen's preference for the tail must also evolve. Why does she get a benefit for picking the tail?
  *   **The Truth:** The game cannot simulate the *origin* of the preference, only the *maintenance* of it.
  *   **How to handle in Debrief:** Be honest. "In this game, I acted as God. I gave the Selectors a reason to want Alphas. In the real world, there is no God. The Selectors' preference had to evolve alongside the Proposers' signal. This is the 'Fisherian Runaway' problem. If the Selectors stopped caring about the tail, the tail would disappear. The game assumes the desire; biology has to explain it. That is the next layer of the puzzle."

  **5. The "Bored Loser" Problem**
  *   **Risk:** A Beta goes bankrupt in Round 2 and zones out.
  *   **Fix:** Allow bankrupt players to become "Auditors." They help you tally the board. Give them a small stipend (2 chips) for accurate counting. Keeps them watching the numbers.

  ### Instructor Cheat Sheet (The Theory You're Hiding)

  *   **Round 1:** **Pooling Equilibrium.** Cost is equal. Signal conveys no info. (Zahavi would say this signal shouldn't exist).
  *   **Round 2:** **Separating Equilibrium.** Differential cost. Signal is honest because it is too costly for Low Quality to fake. (The Handicap Principle).
  *   **Round 3:** **Semi-Separating / Collapse.** Cost differential is too low. Low Quality mimics sometimes. Signal reliability drops.
  *   **Receiver Payoff:** This represents the **Co-evolution of Preference**. Without the Receiver's payoff structure, the Sender's signal has no value.

  ### Final Tip for the "Body Feel"
  To really make them feel the cost, make them physically hand over the chips *before* they know if they are chosen. In Round 2, watch a Beta student hesitate, count their chips, look at the 2:1 card, and physically put their hand back. That hesitation is the lesson. Point it out in the debrief. "See that hesitation? That is natural selection in real time."
