answer: |-
  ### Part 1: The Diagnosis
  Your analyst asked the correct question. The "right" reference class is not a fact waiting to be discovered; it is a **normative choice** disguised as a statistical one.

  When you choose a class, you are deciding which similarities between people matter and which differences are noise. To group the parolee by *offense* is to say "what you did matters most." To group him by *age and county* is to say "your context matters most." There is no statistical test that can tell you which of those is morally or legally superior. That is a policy decision.

  Your current rules fail because they pretend the choice is technical:
  1.  **The Narrowest-Class Rule ($N \ge 100$):** This privileges *precision* over *relevance*. It assumes a larger sample of less-similar people is better than a smaller sample of more-similar people. It fails at the limit (the single case) because $N=1$ has zero predictive stability.
  2.  **The Averaging Rule:** This is mathematically incoherent for nested classes. If Class B is inside Class A, the data in B is already in A. Averaging them counts the B-cases twice. It creates an illusion of consensus where there is only redundancy.

  You need a procedure that forces the choice into the open, sets a floor for statistical stability, and escalates the normative conflicts to leadership.

  ---

  ### Part 2: The Reference Class Protocol (RCP-1)

  This procedure is designed for a 90-minute window. It does not eliminate judgment, but it structures it.

  **Input:** Case File, Historical Database.
  **Output:** A probability $P$, a Class Description $C$, and a Stability Flag $S$ (Green/Yellow/Red).

  #### Step 1: The Legality Filter (Go/No-Go)
  *   **Question:** Is any candidate class defined by a variable legally forbidden for this decision (e.g., race, protected medical status, zip codes acting as proxies)?
  *   **Action:** If the *only* statistically significant class is forbidden, **STOP**.
  *   **Termination:** Escalate to Legal/Policy. Do not generate a number. The statute requiring a number conflicts with the statute forbidding the data; this is a legal contradiction, not a math problem.
  *   **If Pass:** Proceed to Step 2.

  #### Step 2: The Relevance Screen (Avoiding Tautology)
  *   **Question:** Is any candidate class defined by the outcome itself or post-hoc data unavailable at the time of decision? (e.g., "Men who *will* violate parole," or "Facilities that *did* fail").
  *   **Action:** Discard these classes. They are prophecies, not probabilities.
  *   **If Pass:** Proceed to Step 3.

  #### Step 3: The Stability Floor (Saving the Narrowest Rule)
  *   **Question:** For the most specific (narrowest) defensible class, what is the **Expected Event Count (EEC)**?
      *   *Calculation:* $N_{\text{class}} \times \text{Base Rate of Adverse Outcome}$.
      *   *Rule of Thumb:* If EEC $< 10$, the frequency is statistically unstable (high variance).
  *   **Decision:**
      *   **If EEC $\ge 10$:** Use the frequency of the **Narrowest Class**. (Relevance trumps sample size).
      *   **If EEC $< 10$:** The narrow class is too noisy. Expand to the next broader class until EEC $\ge 10$. Use that frequency.
  *   **Why:** This saves the narrowest-class rule by preventing the $N=1$ collapse. It acknowledges that a specific class with no data tells you nothing.

  #### Step 4: The Conflict Check (Non-Nested Classes)
  *   **Question:** Do you have two *non-nested* classes (e.g., "Men with Prior X" vs. "Men in County Y") that yield probabilities differing by more than 20 percentage points?
  *   **Action:** This indicates the model is sensitive to arbitrary framing.
  *   **Termination:** **Yellow Flag.** Calculate the average *only* for the purpose of the number, but mark the case for **Senior Analyst Review**. Do not average nested classes (see Part 3).
  *   **If Pass:** Proceed to Step 5.

  #### Step 5: The Decision Sensitivity Test (Escalation Point)
  *   **Question:** If you had used the broader class (from Step 3) instead of the narrow class, would the final agency decision change? (e.g., would parole be granted vs. denied?)
  *   **Action:**
      *   **If No:** Proceed. The class choice is statistically immaterial to the outcome.
      *   **If Yes:** **Red Flag.** This is a normative choice disguised as math. You are effectively deciding the case by choosing the denominator.
  *   **Termination:** Escalate to Unit Supervisor. The supervisor must sign off on the class choice, acknowledging they are setting policy, not just reviewing math.

  #### Step 6: Finalize
  *   **Output:** Report the probability $P$ derived from Step 3. Attach the Class Description $C$ and the Stability Flag $S$.

  ---

  ### Part 3: Addressing Your Two Specific Questions

  **1. Can the narrowest-class rule be saved?**
  Yes, but only with a **Reliability Floor**. Reichenbach's original posit ("use the narrowest class for which reliable statistics exist") is correct, but "reliable" was never defined.
  *   **The Fix:** Reliability is not about total $N$ (e.g., 100); it is about the count of *adverse events*. If you are predicting a 5% failure rate, you need $N=200$ to get 10 events. If you are predicting a 50% rate, $N=20$ is enough.
  *   **Why:** A class of 60 cases with 12 failures is more informative than a class of 4,000 cases with 800 failures *if* the 60 cases are genuinely more similar to the current subject. But if the 60 cases yield only 1 failure, the rate (1.6%) is noise. The floor prevents you from mistaking noise for specificity.

  **2. Is averaging frequencies just laundering?**
  Yes, for nested classes.
  *   **The Math:** If Class B is a subset of Class A, the data in B is *already inside* A. Averaging $Freq(A)$ and $Freq(B)$ gives extra weight to the cases in B. It is double-counting evidence.
  *   **When it works:** Only when classes are **independent** sources of evidence (e.g., a clinical assessment score vs. a demographic history). Even then, simple averaging is weak; it is better to treat one as a "prior" and the other as an update. But for your constraints: **Never average nested classes.** It creates false precision.

  ---

  ### Part 4: Running the Procedure on Three Cases

  #### Case 1: The Parolee (Nested Classes, Stability Conflict)
  *   **Data:** Broad Class ($N=4000$, Rate=25%); Narrow Subclass ($N=60$, Rate=40%).
  *   **Step 1 (Legality):** Pass.
  *   **Step 2 (Relevance):** Pass.
  *   **Step 3 (Stability):**
      *   Narrow Class EEC: $60 \times 0.40 = 24$ events.
      *   Threshold is 10 events.
      *   **Result:** $24 > 10$. The narrow class is stable enough.
  *   **Step 4 (Conflict):** Nested, so no averaging.
  *   **Step 5 (Sensitivity):** Broad rate (25%) might grant parole; Narrow rate (40%) might deny.
  *   **Output:** **Red Flag.**
      *   **Number:** 40% (from Narrow Class).
      *   **Action:** Escalate to Supervisor.
      *   **Reasoning:** The data supports the specific risk, but the choice of class determines liberty. The Supervisor must affirm that "specific risk profile" outweighs "statistical stability of the broad population."

  #### Case 2: The One-Off Facility (Tiny Sample)
  *   **Data:** Facility Type ($N=12$, Failures=3, Rate=25%). Statewide Average ($N=5000$, Rate=5%).
  *   **Step 1 & 2:** Pass.
  *   **Step 3 (Stability):**
      *   Specific Class EEC: $12 \times 0.25 = 3$ events.
      *   Threshold is 10 events.
      *   **Result:** $3 < 10$. The specific class is unstable.
      *   **Action:** Expand to Statewide Average.
  *   **Output:** **Yellow Flag.**
      *   **Number:** 5% (from Statewide).
      *   **Note:** "Specific class data ($N=12$) deemed statistically unstable. Reverted to base rate."
      *   **Reasoning:** 3 failures is noise. To license based on 25% would be to react to randomness. To ignore it completely is to ignore signal. The protocol forces you to admit the signal is too weak to trust.

  #### Case 3: The Forbidden Class (Legal Conflict)
  *   **Data:** The only class that predicts risk is "Diagnosis X." Statute forbids using medical diagnoses for licensing.
  *   **Step 1 (Legality):** **FAIL.**
  *   **Output:** **Process Halt.**
      *   **Number:** None.
      *   **Action:** Escalate to Agency Counsel.
      *   **Memo:** "Statutory conflict. Predictive validity requires Class X; Law forbids Class X. Any number generated using proxy variables will be an unverified estimate subject to legal challenge."
      *   **Reasoning:** You cannot solve a legal contradiction with arithmetic. If you use a proxy (e.g., "medication usage"), you are violating the spirit of the law. The agency must decide if they want to break the law or accept higher risk.

  ---

  ### Part 5: Limitations and The Hearing Officer Script

  #### What This Procedure Cannot Do
  1.  **It cannot find the Truth:** It does not reveal the "actual probability." It reveals the frequency of a chosen group.
  2.  **It cannot resolve Value Conflicts:** When Step 5 triggers (Sensitivity), the procedure stops. It forces a human to admit they are making a policy choice.
  3.  **It cannot fix Bad Data:** If the historical data is biased (e.g., over-policing in certain counties), the frequency will be biased. The protocol treats the data as given; it does not audit justice.

  #### What to Tell the Hearing Officer
  The hearing officer wants to treat the number as a physical fact (like the temperature). You must correct this without undermining your own authority. Use this script:

  > "This number is not a measurement of this individual's future. It is a statement about the **group we have chosen to compare them to**.
  >
  > We selected [Class Description] because it is the most specific group with enough history to be stable. If we had chosen a broader group, the number would be [X]. If we had chosen a narrower one, the data would be too thin to trust.
  >
  > Please treat this number as a **policy-consistent estimate**, not a prophecy. It ensures that we treat similar cases similarly, but it does not guarantee the outcome for this specific person."

  #### Final Word to Your Unit
  Tell your analyst the truth they asked for:
  *"The right class is a choice we are making. We are no longer hiding it. We are documenting the choice, setting a floor for when the data is too thin to support the choice, and escalating the choices that determine liberty or safety to the people paid to make policy. We are not finding probabilities; we are constructing them responsibly."*
