prompt: |-
  I run a small risk-analysis unit — four analysts — inside a state agency whose decisions land on individuals: parole, child-welfare removals, and the licensing of high-hazard facilities. Our reports must end in a number. A statute requires each report to state "the probability" of the adverse outcome over a fixed horizon, and a hearing officer who is not a statistician signs off on it. We get roughly ninety minutes per case, we have no budget for new data collection, and we are not permitted to leave the probability box blank or to answer "it depends." In practice the arithmetic is never the hard part. The hard part is deciding what the case in front of us is a case of. A parolee belongs to a hundred overlapping populations — men; men convicted of a particular offense; men convicted of that offense with a prior supervision violation; men of that age in that county; men who scored a particular way on our instrument — and the observed frequencies differ wildly across them, so the number we report is largely an artifact of the class we chose. At present we use a rule of thumb a predecessor left behind: use the narrowest class for which you have at least a hundred prior cases. A colleague wants to replace it with: compute the frequency in every class you can defend and average them. I suspect both rules are bad, but I cannot articulate why in a way my analysts can actually apply, and the last time I tried, one of them asked me whether the "right" class is a fact we are failing to find or a choice we are making and hiding — and I did not have an answer.

  Please turn whatever the philosophy of probability genuinely knows about this — the reference class problem and the proposals that have been made for coping with it — into a decision procedure my unit can run on a live case. I want the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in a defensible single number, where it terminates in a range or in a refusal to supply one, and which steps are irreducibly matters of judgment or of values that should be escalated rather than settled by an analyst. It has to survive the cases that actually break us: classes nested inside one another; classes that conflict without either being nested; classes defined after the fact by the very outcome we are predicting; and classes so small that the frequency is a fiction. Two things I especially want addressed. First, whether the narrowest-class rule can be saved by some restriction, given that the narrowest class of all is the single case itself, whose frequency is either zero or one and therefore tells us nothing. Second, whether averaging the frequencies is ever more than a way of laundering the choice of classes. Then run the procedure on three cases and tell me what it outputs, even where the output is one the agency will hate: a parolee with a long record in a class of four thousand priors and a shorter, more relevant record in a subclass of sixty; a one-off licensing decision for a facility of a type that has existed twelve times, three of which failed; and a case in which the only class that is clearly relevant is one we are legally forbidden to use as a basis for the decision. Finish by saying plainly what the procedure cannot do, and what a hearing officer should be told about the epistemic status of the number printed in the box.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Small risk-analysis unit (4 analysts) in a state agency.
      *   **Task:** Produce a single probability number for adverse outcomes (parole, child welfare, licensing).
      *   **Constraints:** 90 mins/case, no new data, statutory requirement for a number (cannot say "it depends" or leave blank), hearing officer is non-technical.
      *   **Core Problem:** The Reference Class Problem (RCP). Which population defines the probability? Different classes yield wildly different frequencies.
      *   **Current Practices:**
          1.  *Narrowest Class Rule:* Narrowest class with $N \ge 100$. (User suspects this is bad).
          2.  *Averaging Rule:* Compute all defensible classes and average. (Colleague suggests this; User suspects this is laundering).
      *   **Specific Questions to Address:**
          *   Can the narrowest-class rule be saved?
          *   Is averaging just laundering?
          *   Create a *decision procedure* (step-by-step questions, termination conditions, escalation points).
          *   Handle specific edge cases (nested classes, conflicting classes, post-hoc classes, tiny $N$).
          *   Run the procedure on three specific test cases.
          *   State limitations and what to tell the hearing officer.
      *   **Tone:** Philosophical rigor meets bureaucratic pragmatism. Honest about epistemic limits.

  2.  **Philosophical & Statistical Grounding (The "Why"):**

      *   *The Reference Class Problem (RCP):* Identified by Venn, refined by Reichenbach, Salmon, Hájek. There is no "true" single probability for an individual event without specifying a class.
      *   *Narrowest Class Rule (Reichenbach):* Use the most specific class with reliable statistics. *Problem:* As the user noted, the limit is $N=1$, probability 0 or 1. Also, "narrowest" is ambiguous (narrowest by what criteria?).
      *   *Averaging (Linear Opinion Pooling):* *Problem:* Classes aren't independent. Averaging a broad class and a narrow subclass double-counts evidence. It creates false precision.
      *   *Bayesian Hierarchical Modeling:* Ideally, you'd shrink estimates toward the mean based on sample size. But the user has 90 mins and no budget for complex modeling.
      *   *Pragmatic Solution:* We need a *protocol* that acknowledges the choice is normative/political, not just statistical. The number is a *policy artifact*, not a discovered fact.

  3.  **Developing the Decision Procedure (The "How"):**

      *   *Goal:* A flowchart-like protocol that fits within 90 minutes.
      *   *Step 1: Class Identification.* List candidate classes.
      *   *Step 2: Relevance Screening.* Exclude classes defined by the outcome (tautologies) or legally forbidden attributes.
      *   *Step 3: Stability Check.* Is $N$ large enough? (Move away from hard cutoff of 100 to a confidence interval width check, but keep it simple).
      *   *Step 4: Nested/Conflicting Resolution.* This is the crux.
          *   If nested: Prefer the specific *unless* the specific is unstable ($N$ too low).
          *   If conflicting (non-nested): This requires judgment/escalation.
      *   *Step 5: The Number.* Calculate frequency. Add uncertainty bounds if possible (but statute says "a number"). Let's stick to the point estimate but document the range internally.
      *   *Step 6: Escalation.* When the choice of class changes the decision outcome (e.g., below/above a threshold), the analyst shouldn't decide; the policy maker should.

      *Refining the "Narrowest" vs. "Averaging" critique:*
      *   Narrowest is salvageable *if* constrained by minimum reliability (sample size) and *predictive relevance* (not just arbitrary slicing).
      *   Averaging is generally invalid for nested classes (mathematical double counting). It is only valid for independent expert opinions, not overlapping data sets.

  4.  **Drafting the Procedure (Iterative refinement):**

      *   *Name:* The "Reference Class Protocol" (RCP-1).
      *   *Inputs:* Case file, Historical Database.
      *   *Outputs:* Probability $P$, Class Description $C$, Uncertainty Flag $U$.
      *   *Steps:*
          1.  Generate Candidate Classes.
          2.  Filter for Legality/Relevance (Remove forbidden traits, remove post-hoc outcome definitions).
          3.  Assess Stability (Sample size).
          4.  Resolve Hierarchy (Specific vs. General).
          5.  Check Decision Sensitivity (Does the class choice change the outcome?).
          6.  Finalize Number.

  5.  **Running the Test Cases:**

      *   *Case 1 (Parolee):* Large class ($N=4000$) vs. Small relevant subclass ($N=60$).
          *   Current rule ($N \ge 100$) forces the large class.
          *   New procedure: Check stability of $N=60$. If confidence interval is too wide, shrink toward the larger class (empirical Bayes intuition without the math). Or, if $N=60$ is stable enough, use it but flag uncertainty. Let's say $N=60$ is borderline. Procedure should suggest using the $N=60$ rate but flagging high variance, or a weighted compromise. *Decision:* Use the $N=60$ rate because relevance trumps precision, but mark for review.
      *   *Case 2 (Licensing):* $N=12$ total, 3 failures.
          *   $N$ is too small for frequency.
          *   Procedure must trigger "Insufficient Data" protocol. But statute requires a number.
          *   Solution: Use a "Prior" (statewide average for similar facilities) adjusted slightly by the specific data. Or admit the number is a policy placeholder. Let's go with: Use the base rate of the broader category, note the specific data is too sparse.
      *   *Case 3 (Forbidden Class):* Only relevant class is legally forbidden (e.g., race or something similar, or perhaps a specific medical diagnosis protected by law).
          *   Procedure must stop. Cannot use forbidden class.
          *   Must use next-best proxy.
          *   Escalate: This is a legal/ethical conflict, not statistical.

  6.  **Addressing the Specific Questions:**

      *   *Narrowest Rule:* Save it by adding a "Reliability Floor" and a "Relevance Test." It fails at $N=1$ because reliability is zero.
      *   *Averaging:* It is laundering. It treats overlapping evidence as independent. Reject it for nested classes.
      *   *Epistemic Status:* The number is a *regulated estimate*, not a physical constant. It is a tool for consistency, not truth.

  7.  **Refining the Tone:**

      *   Needs to be authoritative but humble.
      *   Avoid jargon where possible, but use precise philosophical terms where necessary (e.g., "epistemic," "normative").
      *   Acknowledge the pain of the analysts.

  8.  **Final Review against Constraints:**

      *   90 minutes? The procedure needs to be quick.
      *   Single number? Yes, but with metadata.
      *   Escalation points? Yes, when class choice determines the legal outcome.
      *   Three cases run? Yes.
      *   Limitations stated? Yes.

      *(Self-Correction during drafting)*: I initially thought about suggesting Bayesian shrinkage. But the user said "arithmetic is never the hard part" and they have 90 minutes. Complex modeling might be out of scope. I should frame the "compromise" between classes as a judgment call or a simple weighted average *only if* classes are non-nested, but for nested, it's about stability. Actually, the best philosophical advice for the "N=60 vs N=4000" case is to acknowledge the bias-variance tradeoff. I will instruct them to use the specific class *if* it passes a minimum stability threshold, otherwise revert to the general. I need to define that threshold simply (e.g., margin of error).

      *Wait, the prompt asks for a decision procedure that turns philosophy into practice.* I need to be explicit about the *questions*.
      *   Q1: Is the class legally permissible?
      *   Q2: Is the class defined by the outcome?
      *   Q3: Is the sample size stable?
      *   Q4: If nested, does the specific add predictive power?
      *   Q5: Does the choice change the decision?

      *Let's refine the "Averaging" critique.* Averaging frequencies from nested classes is mathematically incoherent. If Class B is inside Class A, the frequency of A already contains the frequency of B. Averaging them counts the B-cases twice. I must make this clear.

      *Let's refine the "Narrowest" save.* The narrowest class is valid *provided* it meets a minimum reliability threshold. The threshold isn't arbitrary (like 100); it's based on the width of the confidence interval relative to the decision threshold.

      *Case 3 (Forbidden Class):* This is the hardest. If the *only* relevant class is forbidden, the model is legally invalid. The procedure must output "Error: Statutory Conflict." But the statute requires a number. This is a trap. The procedure must advise: "Use the broadest permissible class and document the exclusion."

      *Final Polish:* Ensure the distinction between *aleatory* (random) and *epistemic* (uncertainty about the model) probability is clear for the hearing officer.

  9.  **Structure of the Response:**
      1.  **Diagnosis:** Validate the user's suspicion (RCP is real, both current rules are flawed).
      2.  **The Procedure (RCP-Protocol):** Step-by-step questions, criteria, escalation.
      3.  **The Two Questions:** Narrowest rule fix, Averaging critique.
      4.  **The Three Cases:** Application of the protocol.
      5.  **Limitations & Hearing Officer Script:** What to say to the non-statistician.

      *(Self-Correction on Case 1)*: Parolee. $N=4000$ (broad) vs $N=60$ (narrow/relevant).
      Standard statistical advice: $N=60$ is often too small for stable estimation of rare events (like recidivism). If recidivism is 20%, $N=60$ gives 12 events. Margin of error is huge.
      Protocol decision: Use the broad class ($N=4000$) *unless* the narrow class rate is drastically different, in which case, flag for escalation. Actually, a "shrinkage" approach is best. But without code?
      Let's stick to the philosophical principle: *Relevance over Precision, but Precision sets a floor.* If $N=60$ yields a margin of error that crosses the decision threshold, you cannot use it confidently. You must use the $N=4000$ but note the specific risk factors qualitatively.
      *Wait, the statute requires a number.* Okay. If $N=60$ is too unstable, use $N=4000$. If $N=60$ is stable enough, use $N=60$. I need to define "stable enough." Let's say: "Does the 95% confidence interval of the narrow class exclude the broad class mean?" If yes, narrow is informative. If no, narrow is just noise.
      Actually, simpler for 90 mins: "Is $N \ge 100$?" (The old rule). The user hates this.
      New rule: "Is the expected count of adverse events $\ge 10$?" (Rule of thumb for chi-square/logistic stability). If $N=60$ and rate is 20%, events = 12. Passes. Use Narrow. If rate is 5%, events = 3. Fails. Use Broad.
      Let's adopt the "Minimum Event Count" (MEC) rule.

      *(Self-Correction on Case 3)*: Forbidden class. If the only *statistically relevant* class is forbidden (e.g., race in parole, though often proxy variables exist), using a proxy is ethically fraught. The procedure must force escalation. "This number is legally vulnerable."

      Okay, ready to write.

      *Wait, one more thing:* The user asked: "one of them asked me whether the 'right' class is a fact we are failing to find or a choice we are making and hiding."
      I must answer this directly. It is a *choice*. It is normative. The procedure must make the choice explicit, not hide it.

      *Final Plan:*
      1.  **Philosophical Preamble:** Answer the analyst's question directly.
      2.  **The Protocol:** 5 Steps.
      3.  **Addressing the Two Rules:** Why Narrowest needs a floor, why Averaging is math fraud.
      4.  **Case Studies:** Apply protocol.
      5.  **The Script:** What to tell the hearing officer.
      6.  **Limitations:** What this cannot fix.

