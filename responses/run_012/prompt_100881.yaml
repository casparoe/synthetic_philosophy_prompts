      *   (3) *Interpretivism about Intentionality:* Intentional stance is an interpretation. No "further fact" beyond the pattern. (Dennettian "Intentional Stance").
      *   (4) *Realism about Beliefs:* Given (2), beliefs/desires are real. (Dennettian conclusion).
      *   (5) *Exclusion of Simple Systems:* Thermostats/design-stance systems don't have *genuine* intentional states. (A restriction on Dennett).
      *   (6) *Consciousness Exception:* Consciousness is a harder problem than intentionality; not just the same method applied again. (Anti-Illusionist/Non-Dennettian move).

  3.  **Identify Potential Tensions:**

      *   *Tension A: (2) & (3) vs. (5).*
          *   (2) says patterns are real if they compress/predict.
          *   (3) says intentionality is just adopting the intentional stance (finding the pattern).
          *   (5) says thermostats (which can be predicted via design/physical stance) *don't* have intentional states.
          *   *Problem:* If I can predict a thermostat's behavior by attributing a "desire" to set the temperature to 70 degrees, does it satisfy (2)? If yes, (5) contradicts (2)/(3). If no, why not? Dennett actually *does* attribute weak intentionality to thermostats sometimes, or at least says the line is fuzzy. The user is drawing a hard line.
          *   *Severity:* High. This looks like a direct contradiction between the criterion for reality (2) and the exclusion clause (5).

      *   *Tension B: (1) vs. (6).*
          *   (1) says physical facts fix *what there is*.
          *   (6) says consciousness is a "harder problem" than intentionality.
          *   *Problem:* If physical facts fix everything, consciousness must be fixed by physical facts. If intentionality is solved via patterns (2-4), why is consciousness different? If consciousness is "harder," does it imply it's *not* fixed by physical facts in the same way? Or does it mean it's epistemically harder but ontologically secure?
          *   *Severity:* Medium-High. Depends on what "harder problem" means. If it implies non-physicalism about qualia, it clashes with (1). If it just means "we don't have the theory yet," it's fine. But usually, "harder problem" language hints at the Hard Problem (Chalmers), which threatens (1).

      *   *Tension C: (2) vs. (3).*
          *   (2) says reality is objective (compression/prediction).
          *   (3) says intentionality is a "stance" (interpretation).
