          *   *Severity:* Low. This is standard Dennettian compatibility.

      *   *Tension D: (4) vs. (5).*
          *   (4) says beliefs posited are *perfectly real*.
          *   (5) says some systems (thermostats) don't have *genuine* states.
          *   *Problem:* If I posit a belief for a thermostat using the intentional stance, is it real (per 4) or not genuine (per 5)?
          *   *Severity:* High. Linked to Tension A.

      *   *Tension E: (1) vs. (2)/(4).*
          *   (1) Physical facts fix truth.
          *   (2)/(4) Patterns/Beliefs are real.
          *   *Problem:* This is the standard reduction vs. non-reduction tension. But (1) allows supervenience without reduction. "True in virtue of" allows for higher-level ontology.
          *   *Severity:* Low. Standard non-reductive physicalism.

  4.  **Evaluate and Rank Tensions:**

      *   **Rank 1 (Severe): The Thermostat Problem (2+3+4 vs. 5).**
          *   Why: (2) sets a criterion for reality (compression/prediction). A thermostat *can* be predicted intentionally ("It wants 70 degrees"). If the criterion is met, (4) says it's real. But (5) says it's not genuine. This is an internal contradiction in the criteria for ontology.
          *   Fix: Either admit thermostats have weak intentionality (Dennett's view) or tighten the definition of "compressible description" in (2) to exclude simple feedback loops (e.g., require learning or complexity).
          *   Cost: Admitting thermostats have beliefs trivializes belief. Excluding them requires a non-arbitrary complexity cutoff.

