      *   *The Republican Problem:* Pettit/Skinner vs. Berlin. Is freedom as non-domination just a subset of freedom as non-interference? To make it land, the example must show interference *without* domination and domination *without* interference.
      *   *The Time Management:* 90 minutes is tight for three concepts + debate. Structure needs to be tight.
