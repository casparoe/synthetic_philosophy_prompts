      *   *Selection:* **Discretionary Regulatory Approval (e.g., Visa/Permit or Zoning).** Let's go with *Visa/Residency Status tied to Employment*. It's legal, political, and high stakes.
      *   *Why:* An employer *can* interfere (fire you = deportation), but might not. A citizen worker has the same risk of firing but not deportation.
      *   *Criteria:* Must show *capacity* to interfere arbitrarily without *actual* interference. Must not smuggle in economic necessity (which confuses positive liberty).

  5.  **Addressing Misconceptions (Sequencing):**
      1.  *Liberty = Absence of Interference:* This is the default Negative view. Hit this early when introducing the Republican challenge.
      2.  *More Laws = Less Freedom:* This comes up when discussing how Republicanism often requires *more* structural protection (laws against domination). Address during the Republican section.
      3.  *Positive Liberty = Autonomy:* This is the Berlin critique. Address this in the Positive section to clear the deck before Republicanism.

  6.  **Settled vs. Contested:**
      *   *Settled:* Berlin's taxonomy is the starting point. Negative = non-interference (roughly). Positive = self-mastery/participation.
      *   *Contested:* Whether Berlin caricatured Positive Liberty (Taylor etc.). Whether Republicanism is distinct (Langton vs. Pettit). Whether Non-domination is valuable instrumentally or intrinsically.

  7.  **What to Leave Out:**
      *   Deep history of Roman *libertas* (too much time).
      *   The full metaphysics of free will (distracts from political liberty).
      *   Berlin's "Two Concepts" text close-reading (they've read it).

  8.  **Closing Question:**
      *   Needs to force a choice between Non-Interference and Non-Domination.
      *   Scenario: A benevolent dictator who *cannot* be challenged vs. a chaotic democracy. Or better: A scenario where interference happens but isn't dominating vs. domination without interference.
      *   *Refinement:* The "Tracking Interest" test. If the power tracks your interests, is it domination?

  9.  **Refining the Plan (Self-Correction during drafting):**
