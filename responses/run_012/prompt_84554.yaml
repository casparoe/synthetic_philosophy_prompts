answer: |-
  Good evening, and thank you for being here.

  I want to begin with a confession. When the Historical Society asked me to curate this exhibition, I imagined I would be standing here tonight offering you a map. I thought I could point to the strata in the ground and say, "Here is where the Greeks landed," and "Here is where the horse stood." I thought a year of reading would give me certainty.

  Instead, I find myself offering you a mirror. Because the more one looks into the archaeology of Troy, the less one sees a single city, and the more one sees ourselves—our need to find where the story begins, our willingness to dig until we find it, and our fear that the ground might be empty.

  We have a room full of people who know the dirt better than I do, and a room full of people who know the poem better than I ever will. That is an awkward place to stand. The experts know that Heinrich Schliemann, our great pioneer, dug with the passion of a lover but the patience of a bulldozer. He cut a trench straight through the mound to get to the bottom, destroying the very layers of the city he sought to prove existed. They know that the gold he famously sent to Berlin, "Priam's Treasure," comes from a layer of the site centuries older than the city that would have faced the Mycenaean Greeks. They know that the Hittite records, which do mention a kingdom in the right place with a name that sounds like *Ilios*, are strangely silent about a ten-year siege, a kidnapped queen, or a wooden horse.

  If I were to stop there, the archaeologists would nod, and the rest of you would feel a chill. You would feel that the *Iliad* had been dissected, reduced to pottery shards and carbon dates.

  But we are not here merely to audit the past. We are here to ask a harder question: When is a story entitled to move from the legend shelf to the history shelf? This is the question we ask of King Arthur. It is the question we ask of the Exodus. And it is the question we ask of Troy.

  If history is only what can be forensically proven in a court of law, then Troy is a myth. There is no smoking gun. There is no body of Hector. But if history is the record of human experience, of the collisions that shape our world, then the verdict must be different.

  We know that this hill, Hisarlik, was a battleground. It sat on a knife-edge of trade routes, controlling the passage between the Aegean and the Black Sea. Conflict here was not a possibility; it was a geographical certainty. Cities burned at this crossroads. People died. Wealth was plundered. The memory of a great war at this specific place was not invented out of thin air; it was inherited. It was sung.

  So, here is my verdict, after a year of reading, and after standing before the evidence you will see in the next room.

  Troy is not history in the sense of a ledger. It is history in the sense of a wound. A war happened here. Perhaps not a ten-year siege, and perhaps not over a single woman, but a conflict of such magnitude that it scarred the Bronze Age consciousness forever. The *Iliad* is not a news report; it is the memory of that trauma, refined over centuries of oral tradition.

  To ask if the war "really happened" is to ask the wrong question. The better question is: Did the world act as though it happened? And the answer is yes. Empires defined themselves against this story. Alexander the Great came here to weep at the tomb of Achilles. The Romans traced their bloodline to a refugee of this war, Aeneas, to justify their own empire. For three thousand years, people have lived, died, and built civilizations based on the truth of Troy. In that sense, the legend *became* the history.

  So, to my colleagues in archaeology: I acknowledge the silence of the strata. I acknowledge the ambiguity.
  But to the lovers of the poem: Do not let the dirt steal the song from you.

  Schliemann may have misdated the gold, but he was right about the fire. The Hittites may not have mentioned the horse, but they knew the city burned. The *Iliad* does not need to be factually perfect to be true. It captures the reality of grief, the cost of pride, and the fragility of home. Those are historical facts of the human condition, even if the wooden horse is a poet's device.

  We cannot prove the story exactly as Homer told it. But we can prove that the world believed it, and that the place it describes is real. The bricks are dust. The bones are gone. But the echo remains.

  I invite you to walk through the exhibition. Look at the shards. Look at the maps. But when you leave, I hope you carry out not just a date or a layer number, but a sense of wonder. The war may be obscured by time, but the story has survived. And in the end, that is the greatest archaeology of all.

  Thank you, and enjoy the exhibition.
