      *   **Section 5: A Better Analogy.** Propose the "Police Officer" or "Licensed Professional" analogy, or simply discard analogy for legal theory. Let's go with **The Courtroom Lawyer** (advocate for a potentially guilty client) or **The Police Officer** (state-sanctioned violence). Actually, the **Police Officer** is best because it involves physical force.
