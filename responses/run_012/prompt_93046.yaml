  2.  **Deconstruct the Boxing Analogy (The Audit):**
      *   *Goal:* Map boxing elements to war elements.
      *   *Boxing:* Two fighters, Referee, Rules (Marquess of Queensberry), Consent (contract), Goal (Belt/KO), Audience (Safe), Context (Sport/Entertainment).
