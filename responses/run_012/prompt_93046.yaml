          *   The Ring $\rightarrow$ The Theater of War (Major break).
          *   The Crowd $\rightarrow$ Civilians (Major break).
          *   The Belt $\rightarrow$ Political Objectives/Territory.

  3.  **Identify the Breaks (Where the analogy fails):**
      *   *Consent:* Boxers sign contracts. Soldiers are often conscripted, coerced by economic necessity, or indoctrinated. You can't "tap out" of war easily (desertion = prison/death).
      *   *Symmetry/Equality:* Boxing matches are weight-classed for fairness. Wars are often asymmetric (aggressor vs. defender).
      *   *The "Ref":* In boxing, the ref stops the fight if rules are broken. In war, enforcement is retrospective and spotty (war crimes tribunals).
      *   *The "Crowd":* Boxing audiences are safe. War audiences (civilians) die in droves.
