          *   *The Crowd:* If a boxer hits a spectator, it's assault. If a soldier kills a civilian, it's a war crime. But the friend's argument is about killing *enemy soldiers*. So, civilian death is incidental to the specific claim about enemy combatants, though it damages the "clean sport" vibe.
          *   *The Ref/Rules:* In boxing, following rules absolves you. In war, following orders (Nuremberg Principles) is *not* a full defense for war crimes. However, for *legal combatant status*, following LOAC (Law of Armed Conflict) grants immunity.
