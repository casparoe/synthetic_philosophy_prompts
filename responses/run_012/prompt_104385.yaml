  *   *Why:* It removes the qualia baggage and focuses on goal-directed unity. We can observe frustration (colony fails to nest despite resources). It is easier to bet on behavioral unity than phenomenal unity. But for your seminar, stick with the hard number: **0.13**. It respects the intuition pump without buying the magic.
