  **The Territory:** You aren't arguing about ants. You are arguing about **temporal grain**.
  If a human brain were slowed down by a factor of $10^6$ so that a single thought took a week, would it still be conscious?
  *   If you say **Yes**, you must raise your credence on the ants (move toward your colleague).
  *   If you say **No**, you must admit consciousness depends on specific biological speeds, not just causal topology (move toward biological naturalism).

  ### The Nearest Well-Posed Thing
  If you find the "subject of experience" term too loaded, replace it with: **"Does the colony possess a unified perspective that can be frustrated?"**
