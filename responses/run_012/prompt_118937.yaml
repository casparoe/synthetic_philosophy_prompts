answer: |-
  **TOWN OF PRINCIPIA**
  **DEPARTMENT OF INTRINSIC VALUE**
  **FORM 404-B: FRIENDSHIP AND BEAUTY AUDIT**

  **PURPOSE:** To ascertain the intrinsic worth of personal affections and aesthetic experiences pursuant to the Civic Creed. This form distinguishes *Goodness* from *Utility* and *Satisfaction*. Failure to isolate intrinsic value may result in derecognition of the relationship or object.

  **SECTION 1: DECLARATION OF NON-UTILITY**
  Before assessing value, the Claimant must certify that the affection or enjoyment is not valued for its consequences. Please check all that apply. If any box is checked, the application is void.
  [ ] The friend provided financial assistance during a crisis.
  [ ] The artwork increased in market value.
  [ ] The friendship alleviated loneliness (instrumental benefit).
  [ ] The beautiful scenery facilitated relaxation.
  *Note: If the relationship is useful, it is merely good *for* something. We are auditing what is good *in* itself.*

  **SECTION 2: METHOD OF ISOLATION WORKSHEET**
  Per the Doctrine of Absolute Isolation, you must evaluate the object as if it existed alone in the universe.
  1. Describe the friendship or aesthetic object.
  2. Imagine a universe containing *only* this entity, stripped of all context, history, and future consequences.
  3. Does this isolated entity still appear desirable?
     [ ] Yes (Proceed to Section 3)
     [ ] No (Value is extrinsic; file under Instrumental Goods)
     [ ] Unable to visualize void (Consult a Certified Intuitionist)

  **SECTION 3: ORGANIC UNITY ASSESSMENT**
  The value of a whole is not the sum of its parts. A friendship containing sorrow may possess greater intrinsic value than a trivial acquaintance containing only pleasure.
  *   List constituent parts (e.g., shared laughter, mutual grief, awkward silences).
  *   Assign a provisional value to each part.
  *   **CRITICAL:** Do **not** sum these values. The total value of the friendship is likely disproportionate to the aggregate of its moments.
  *   Does the whole shine with a brightness exceeding its components? [ ] Yes [ ] No

  **SECTION 4: AESTHETIC CONSCIOUSNESS LOG**
  Unperceived beauty holds negligible intrinsic value.
  *   Describe the beautiful object.
  *   Was the object consciously enjoyed by a sentient mind at the time of evaluation?
      [ ] Yes (Full value eligible)
      [ ] No (Value reduced to near-zero; please justify why you are auditing unobserved beauty)
  *   Was the enjoyment itself part of a larger organic unity (e.g., enjoying beauty *with* a friend)? [ ] Yes [ ] No

  **SCORING RUBRIC: INTUITIVE CLARITY SCALE**
  *Auditors must not calculate. Value is self-evident to the trained mind.*
  *   **10 (Sublime):** The isolation test yields immediate, undeniable conviction of goodness.
  *   **5 (Neutral):** The object is indifferent; existence adds no value.
  *   **1 (Bad):** The whole is intrinsically detestable.
  *   **ERROR CODE 99:** Claimant attempted to add Section 3 parts to determine the whole. Application rejected. The whole is not the sum.

  **APPEALS PROCEDURE**
  If your audit result is unsatisfactory, you may file Form 404-C (Notice of Disagreement). Note the following restrictions on appeals:
  1.  **Hedonistic Claims:** Appeals based on "I felt satisfied" or "It made me happy" will be dismissed. Satisfaction is a subjective feeling, not a measure of intrinsic worth.
  2.  **Naturalistic Fallacy:** Do not argue that the friendship is good because it is "natural," "desired," or "evolutionarily advantageous." To define "good" as "desired" is a categorical error.
  3.  **Intuition Failure:** If the Auditor cannot intuit the value, the burden of proof lies with the Claimant to clarify their mental vision. We cannot mandate insight, only record its absence.

  **SIGNATURE:** ___________________ **DATE:** ___________________
  *Warning: Falsifying intrinsic value is a Class C Moral Offense.*
