answer: |-
  This is a high-wire act. You have fifty minutes to pivot a room full of philosophy of science grad students from "Hobbes the Political Theorist" to "Hobbes the Epistemologist of Construction" without losing them to the "Hobbes the Math Crank" narrative.

  Here is the battle plan.

  ### 1. The Order of Operations
  **Do not start with geometry.** If you start with geometry, you confirm their suspicion that this is a sidebar to the "real" work (politics). If you end with politics as a mere analogy, you get the "cheap pun."

  **The Sequence:**
  1.  **The Hook (Politics):** Start with *Leviathan*. Challenge the "Social Contract" label.
  2.  **The Principle (Epistemology):** Define *Scientia* vs. *Prudentia*. Introduce the Maker's Knowledge constraint.
  3.  **The Model (Geometry):** The compass activity. This is where they *feel* the principle.
  4.  **The Foil (Natural Philosophy):** Briefly explain why physics fails this test (hypotheses vs. demonstration).
  5.  **The Payoff (Civil Philosophy):** Return to *Leviathan*. Show that the Commonwealth is an artifact, not an organism.

  **Why this order?** It frames geometry not as Hobbes's hobby, but as the *only available template* for his political project. The move from geometry to politics isn't an analogy; it's an ontological classification. Both are artifacts.

  ### 2. The Compass Activity: Yes, But Keep It Tight
  **Do the activity.** But give it **5 minutes**, not 10.
  Philosophy of science students are used to thinking about observation vs. theory. You need them to feel the difference between *observing* a property and *generating* an object.

  *   **The Setup:** Hand out compasses/paper. Ask them to draw a circle.
  *   **The Trap:** Most will draw a round shape. Stop them. Ask: "How do you *know* that is a circle?"
  *   **The Pivot:** If they say "it looks round," they are in the realm of sense (Prudentia). If they say "I fixed the radius and rotated," they are in the realm of cause (Scientia).
  *   **The Point:** You don't know it's a circle because it matches a form in the sky. You know it's a circle because *you executed the procedure that defines it.*
  *   **Where it fits:** Immediately after introducing the "Maker's Knowledge" principle. It cements the abstract claim before you move to the foil of natural philosophy.

  ### 3. Handling the "Crank" Problem (The Quadrature)
  **Do not build the session around the squaring of the circle.**
  If you center the session on his failed proofs, the Phil Sci students will dismiss the epistemology as post-hoc rationalization for his ego.

  **How to use it:** Mention it only in the Q&A or as a footnote in the Geometry section to illustrate his *methodological confidence*.
  *   **The Connection:** It is not that his philosophy rationalized his crankery; it is that his philosophy made him **immune to empirical refutation**. He believed that if the reasoning followed the generation of the figure, the conclusion *must* be true, even if the Royal Society said otherwise.
  *   **The Lesson:** For Hobbes, a mathematical error is not a failure of calculation; it is a failure of *definition* or a misunderstanding of *motion*. This is a fascinating Phil Sci point about the normativity of method.
  *   **Verdict:** Mention it to show the stakes, but don't let it become the content.

  ### 4. Addressing the Misconceptions (In Real-Time)

  **A. "Demonstration = Deduction"**
  *   **When to head it off:** In the Epistemology section (Step 2).
  *   **The Fix:** Explicitly distinguish *validity* from *science*. You can deduce consequences from false premises. That is calculation, not *scientia*. *Scientia* requires the premises to be **causal**. In geometry, the definition *is* the cause of the figure's properties.
  *   **Script:** "Hobbes isn't interested in valid arguments. He's interested in arguments where the premises *make* the conclusion true because the premises *made* the object."

  **B. "Nominalism = Arbitrariness"**
  *   **When to head it off:** During the Compass Activity (Step 3).
  *   **The Fix:** Distinguish the *stipulation* from the *consequence*. We arbitrarily decide to call this generated figure a 'circle'. We do *not* arbitrarily decide that its circumference is $2\pi r$. Once the generation is stipulated, the consequences are necessary.
  *   **Script:** "The definition is voluntary; the demonstration is not. We choose the cause; the effect forces itself upon us."

  **C. "Vico / Intuitionism"**
  *   **When to head it off:** In the Payoff (Step 5).
  *   **The Fix:** Hobbes is not saying "truth is created." He is saying "objects of science are created." Vico later expands this to history; Hobbes restricts it strictly to artifacts (geometry and states).
  *   **Script:** "This isn't about mind-dependence. It's about agent-dependence. We don't know the stars because we didn't move them. We know the state because we instituted it."

  ### 5. The "Cheap Pun" Prevention
  To ensure the move from Geometry to Politics doesn't sound like a metaphor ("We *make* the state like we *make* a circle"), you must emphasize **Causality**.

  *   **Don't say:** "We make the state."
  *   **Do say:** "The Sovereign is the *efficient cause* of the Commonwealth's unity, just as the compass hand is the efficient cause of the circle's uniformity."
  *   **The Argument:** In nature, we see effects and guess at causes (physics). In geometry and politics, we *start* with the cause (the definition/the covenant) and derive the effects (theorems/laws). Therefore, only geometry and politics admit of *demonstration*.

  ### 6. The Final Question
  You need a question that tests if they understand the *constraint* of Maker's Knowledge, not just the *application*.

  **The Question:**
  > "If an alien species descended and imposed a commonwealth upon us by force, could we, according to Hobbes, have a *science* of that political order?"

  **The Answer:**
  *   **No.** Because we did not generate it. We are merely observing its effects. We might have *prudence* (prediction based on experience) about how it behaves, but we cannot have *scientia* (knowledge of causes) because we do not know the generative principles (the "definitions") in the way a maker does.
  *   **Why this works:** It forces them to see that *scientia* is not about the *object* (a state), but about the *relation* between the knower and the object's cause.

  ### 7. What to Explicitly Exclude
  Open the session by telling them what you are **not** doing. This manages expectations and saves time.
  1.  **I am not defending Hobbes's math.** He was wrong about the quadrature. We are looking at *why he thought he was right*.
  2.  **I am not covering his theology.** The "Kingdom of God" complicates the artifact claim; we are bracketing it to focus on the Civil Person.
  3.  **I am not comparing him to Descartes.** The rationalist comparison is a rabbit hole. Hobbes's "generation" is material/motional, not purely intellectual.

  ### Summary Timeline (50 Minutes)
  *   **00-05:** **Hook.** *Leviathan* is not a contract; it's a blueprint. You are the architects.
  *   **05-15:** **Epistemology.** *Scientia* requires knowledge of causes. We only know causes of what we generate. Contrast with Natural Philosophy (God made the world, so physics is hypothetical).
  *   **15-20:** **Activity.** Compasses. Define by generation. Distinguish stipulation (arbitrary) from consequence (necessary).
  *   **20-35:** **Civil Philosophy.** The Commonwealth is an artifact. The Sovereign is the generator. Therefore, Civil Philosophy is a science. (Address the "Cheap Pun" risk here by focusing on efficient causality).
  *   **35-45:** **Discussion/Objections.** Handle the Quadrature/Crank issue here. Handle the Nominalism/Arbitrariness worry here.
  *   **45-50:** **Final Question & Wrap.** (The Alien Commonwealth).

  ### Where It Will Go Wrong (And How to Fix It)
  1.  **The Activity Drags:** Students fumble with compasses.
      *   *Fix:* Have pre-drawn circles on the handout. Ask them to trace the *motion* required to make it, rather than drawing it from scratch. Or, just demo it yourself and ask them to narrate the cause. (Actually, doing it themselves is better for the "feeling," but keep it under 3 mins).
  2.  **The "Arbitrary Definitions" Objection:** A student argues that if definitions are ours, we can define anything.
      *   *Fix:* Remind them of the Phil Sci angle. We can define a "unicorn," but we cannot demonstrate its properties in the world. We can define a "circle," and demonstrate its properties *in the figure we made*. The constraint is *consistency with the generation*, not correspondence to reality.
  3.  **The "Crank" Derailment:** Someone fixates on the Wallis controversy.
      *   *Fix:* Acknowledge it. "Hobbes's math was bad. His philosophy of math was radical. We are studying the radicalism, not the arithmetic."

  This plan treats the students as Phil Sci peers (focused on the structure of explanation and the limits of knowledge) rather than History of Philosophy students (focused on exegesis). It uses their skepticism about his math to fuel the epistemological point. Good luck.
