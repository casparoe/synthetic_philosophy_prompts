answer: |-
  1. The curse applies only when four specific features coexist: capability is distributed among multiple independent actors who could each proceed without you; the decision threshold is singular, meaning one "yes" overrides many "nos"; the consequences are externalized, so the public or community bears the risk rather than the lab; and publication lowers the barrier for others, making replication cheaper, faster, or safer than it is today. If the action is unique to one lab, the costs are internal, or publishing does not enable others, you are facing a standard risk assessment, not a unilateralist curse.

  2. Ask these five questions in order, requiring concrete evidence for each answer: First, can five other groups replicate this within twelve months using currently public information? (Sufficient answer: Yes, with named competitors, or No). Second, does your publication materially reduce the skill, cost, or time required for them to do so? (Sufficient answer: Yes/No based on technical delta). Third, is the primary outcome of widespread replication a public hazard or a public good? (Sufficient answer: Hazard/Good/Mixed). Fourth, if ten groups did this tomorrow, would aggregate global risk increase or decrease? (Sufficient answer: Increase/Decrease). Fifth, if the outcome is negative, can the information be recalled or the effect neutralized? (Sufficient answer: Yes/No).

  3. Stop and recommend "Do Not Publish" if Question Two is Yes and Question Three is Hazard; this is the core curse trigger where you enable a race to the bottom. Stop and recommend "Publish" if Question Three is Good and Question Four is Decrease; here, unilateral action solves a coordination failure rather than creating one. Hand the decision back to a human committee if Question Three is Mixed (e.g., scientific benefit versus security risk) or if Question One is uncertain; you cannot calculate probabilities for unknown actors. If Question Five is No and the potential harm is catastrophic, default to caution regardless of probability; this is a risk-appetite call, not a factual one, and requires senior leadership sign-off.

  4. Case One (Dangerous Method): Questions One and Two are Yes (others can do it, your method makes it easier), Question Three is Hazard, and Question Four is Increase. Verdict: Do not publish the enabling method. The argument "someone else will" fails because you cannot prove they possess the capability *now*; you are converting a hypothetical future risk into a certain current capability, and you will not like delivering this advice because you lack the power to enforce redaction. Case Two (Unsafe Product): Question One is Yes, Question Two is No (data does not enable harm), Question Three is Good, and Question Four is Decrease. Verdict: Publish. The unilateralist curse does not apply to risk-mitigating transparency; here, the collective hazard is silence, so being the trigger is a duty rather than a risk.

  5. This procedure misfires when the "group" of potential actors is geopolitical or state-sponsored, as you cannot accurately answer Question One. It fails when harm is purely economic or ideological, as "Hazard" becomes subjective and contested. It cannot solve your lack of authority; it clarifies the advice but does not grant enforcement power, leaving you vulnerable to being ignored. It assumes actors are rational and independent, ignoring collusion or accidental discovery, and it defaults to caution on existential risks where probability is unknowable, which may stifle legitimate high-risk high-reward science that requires a different governance framework.
