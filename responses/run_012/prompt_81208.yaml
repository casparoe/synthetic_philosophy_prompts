      *   *Case 2 (Unsafe Product):* High risk of public harm if *not* published. Benefit is public safety. Harm of publishing is reputational/economic (private to company) or panic (public). UC usually argues against action when action creates risk. Here, *inaction* creates risk. This is an "Anti-Unilateralist" scenario or a "Whistleblowing" scenario. The curse applies to *hiding* the truth if many could hide it, but usually, the UC is about *doing* something risky. Actually, if many researchers find this, and one publishes, does it trigger a race to the bottom? No, it triggers regulation. The UC logic needs to be inverted or recognized as not applying in the same way.

