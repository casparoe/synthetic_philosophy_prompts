      *   Check constraint: "exactly one of" for status fields.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I appeal to "the literature"? I must avoid saying "According to Stanford Encyclopedia..." or "Scholars agree...". I must analyze the claims based on the internal logic and standard philosophical understanding without citing sources.
      *   *Check:* Did I handle the "ambiguous sentence" instruction? Sentence 1 says "scientific if and only if it is falsifiable, and meaningless otherwise." This is a conjunction. I will treat "meaningless otherwise" as a distinct claim from the demarcation criterion itself because they target different categories (science vs. meaning).
      *   *Check:* Sentence 5: "so for Popper science is conjecture and refutation with no accumulation of knowledge". This is a causal claim based on the previous clause. I should audit the "no accumulation" claim separately.
      *   *Check:* Downstream conclusions. The prompt asks for "one of his two further conclusions, or another conclusion the passage itself invites". I will focus on the two explicit ones mentioned at the end.
      *   *Check:* Bottom line max 4 sentences.

