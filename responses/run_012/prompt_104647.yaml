answer: |-
  Here is a decision procedure designed for your panel. It is built to separate *psychological fact* (what was in the head) from *normative expectation* (what should have been in the head), forcing the panel to admit when it is switching between the two.

  ### The Epistemic Attribution Protocol (EAP)
  **Time Limit:** 20 Minutes per case.
  **Goal:** Determine if the term "knew" is factually accurate or normatively stipulated.

  **Step 1: The Physical Access Test (Fact)**
  *Question:* Was the information required to draw the inference physically present in the records under the respondent's control (notebooks, files, emails) at the time of the act?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Attribution of knowledge is factually false. Any sanction must be based on *negligence in record-keeping*, not knowledge of the error.
  *   *Sufficient Answer:* A file path, a page number, or a timestamped email.

  **Step 2: The Inferential Distance Test (Fact/Heuristic)**
  *Question:* How many logical or procedural steps separate the held data from the disputed conclusion/contradiction?
  *   **Metric:** Apply the "Competent Peer Standard." Could a similarly trained scientist, handed the same records, see the connection within 5 minutes without external research?
  *   **1–2 Steps (Immediate):** Proceed to Step 3.
  *   **3+ Steps (Derivative):** **STOP.** Attribution of knowledge is factually false. The chain is too long for automatic closure. Any sanction must be based on *failure of analysis*, not knowledge of the result.
  *   *Sufficient Answer:* A written derivation showing the steps. If it requires a new experiment or literature search, it is >2 steps.

  **Step 3: The Conceptual Capacity Test (Fact)**
  *Question:* Did the respondent possess the specific concepts/vocabulary required to formulate the consequence at the time?
  *   **Yes:** Proceed to Step 4.
  *   **No:** **STOP.** Attribution of knowledge is impossible. You cannot know what you cannot think.
  *   *Handling Inconsistency:* If the respondent held $A$ and $\neg A$ but lacked the logical operator to see the conflict (e.g., statistical nuance), mark as **Conceptual Gap**.
  *   *Sufficient Answer:* Evidence of training (transcripts, prior publications using the method) or lack thereof.

  **Step 4: The Normative Pivot (Value Judgment)**
  *WARNING:* **This step is not a finding of fact. It is a judgment of duty.**
  *Question:* Given the Access (Step 1), Distance (Step 2), and Capacity (Step 3), was the failure to draw the inference a breach of professional duty?
  *   **Decision:**
      *   If Steps 1–3 are **YES**: The finding is **Constructive Knowledge**. (You may use the word "knew" in the ruling, but you must append: *"in the sense that a reasonable agent would have derived this."*)
      *   If Step 2 or 3 is **NO**: The finding is **Incompetence or Error**. (You may *not* use the word "knew." You must cite "failure to verify" or "lack of diligence.")
  *   *Sufficient Answer:* A explicit statement: *"We are moving from epistemic state to normative standard here."*

  **Step 5: The Repair Procedure Check (Mitigation)**
  *Question:* Once the inconsistency or drift was possible to notice, was there a standard protocol to fix it that was ignored?
  *   **Yes:** Aggravating factor for Step 4.
  *   **No:** Mitigating factor. If no repair procedure exists, the inconsistency is a systemic ambiguity, not individual knowledge.

  ---

  ### Application to Cases

  #### Case 1: The Calibration Drift
  *Scenario:* Records contain drift data and measurement data separately. No one joined them.
  *   **Step 1 (Access):** **YES.** Both datasets were in the lab notebook/server.
  *   **Step 2 (Distance):** **1–2 Steps.** Comparing dates on a calibration sheet to dates on a data run is a single lookup operation. A competent peer sees this in <5 minutes.
  *   **Step 3 (Capacity):** **YES.** Reading dates and matching them requires basic literacy, not new concepts.
  *   **Step 4 (Pivot):** **Constructive Knowledge.** The panel may rule they "knew" the data was compromised, provided the ruling states this means *"should have known."*
  *   **Step 5 (Repair):** **YES.** Standard protocol is to discard data outside calibration.
  *   **Verdict:** Misconduct (Falsification/Negligence). The attribution of knowledge is a safe legal fiction here.

  #### Case 2: The Senior Author Contradiction
  *Scenario:* Senior author co-signs a paper contradicting their own earlier paper (different context, years prior).
  *   **Step 1 (Access):** **NO (Psychologically).** While the earlier paper is public, it is not "held" in active working memory. It is in the archive, not the bench notebook.
  *   **Step 2 (Distance):** **3+ Steps.** Reconciling two papers across years requires recalling specific contexts, assumptions, and variables from long-term memory. This exceeds the 5-minute peer test on current records.
  *   **Step 3 (Capacity):** **YES.** They have the concepts.
  *   **Step 4 (Pivot):** **No Knowledge.** The failure is not in logic, but in memory retrieval. To say they "knew" the contradiction is factually false.
  *   **Step 5 (Repair):** **NO.** There is no standard protocol for cross-referencing one's entire publication history before every new signature.
  *   **Verdict:** **No Misconduct.** This is an evolution of thought or context shift, not a knowing contradiction.
  *   **The Discomfort:** This outcome will feel like a double standard. It effectively grants senior researchers epistemic immunity based on the volume of their work and the decay of memory. The panel will want to censure the sloppiness, but the EAP forces you to admit they did not *know* they were contradicting themselves. You are protecting the literature from error, but you cannot protect it from this kind of senior inconsistency without lying about the author's mental state. **Name this:** *The Privilege of Scale.* The more you publish, the less you can reasonably be expected to remember, and the EAP codifies this immunity.

  #### Case 3: The Junior Researcher's Statistics
  *Scenario:* Failure turns on a statistical distinction never taught.
  *   **Step 1 (Access):** **YES.** The raw numbers were there.
  *   **Step 2 (Distance):** **3+ Steps.** Applying the correct statistical test requires choosing the right model.
  *   **Step 3 (Capacity):** **NO.** They lacked the concept (e.g., heteroscedasticity vs. homoscedasticity). They literally could not formulate the error.
  *   **Step 4 (Pivot):** **No Knowledge.** You cannot attribute knowledge of a distinction that does not exist in the agent's vocabulary.
  *   **Step 5 (Repair):** **NO.** They had no procedure because they had no training.
  *   **Verdict:** **Incompetence, not Integrity Violation.** The panel must route this to training/remediation, not sanctions.
  *   **The Discomfort:** This reveals that your panel is often used as a garbage bin for training failures. The data is still wrong, the paper still needs retracting, but the *person* cannot be censured for "knowing" it was wrong. The discomfort lies in admitting that "Research Integrity" is the wrong tool for "Research Education."

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It Cannot Measure Intent:** The EAP distinguishes *knowledge* from *ignorance*, but it cannot distinguish *malice* from *recklessness*. A respondent can pass Step 4 (Constructive Knowledge) and still claim they didn't *mean* to deceive. The procedure protects you from logical errors, not from liars who game the "I forgot" defense.
  2.  **It Will Get the Senior Author Case "Wrong" (Socially):** As noted in Case 2, the EAP will likely exonerate senior authors who contradict themselves due to memory decay or context shifting. This is epistemically honest but socially frustrating. It privileges the powerful by acknowledging their cognitive load is too high for total consistency. The procedure cannot fix the power imbalance; it only highlights it.
  3.  **It Cannot Handle "Willful Blindness":** If a researcher deliberately avoids learning a concept (Step 3) to avoid knowing a consequence, the EAP classifies them as "Lacking Capacity." It treats the gap as a fact, not a strategy. You will need a separate clause for *deliberate avoidance of training*, which the EAP treats as a factual negative.
  4.  **It Does Not Solve the "Ought" Problem:** The EAP forces you to label Step 4 as a value judgment, but it does not tell you *how* to judge. It stops the smuggling of values as facts, but it leaves you with the hard work of deciding what a "reasonable scientist" owes the truth.

  **Final Advice:** When you write the rationale for the administrators, do not use the word "knew" unless Step 4 is marked **Constructive Knowledge**. If Step 4 is **No Knowledge**, use "failed to verify" or "lacked diligence." If you follow this, your rulings will survive appeal because you will no longer be making falsifiable claims about brain states that the appellant can easily disprove. You will be making normative claims about professional standards, which is what you are actually hired to judge.
