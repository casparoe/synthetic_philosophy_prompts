answer: |-
  ### 1. The Microdomain and the Term

  **The Microdomain:** *Chronos Atelier*, a high-end watch restoration workshop employing fourteen people. Everyone knows everyone; the space is open-plan but functionally divided.
  **The Sub-parts:**
  1.  **The Bench:** The horologists who disassemble, clean, and adjust the movements. Their metric is mechanical precision.
  2.  **The Intake Desk:** The liaisons who manage client expectations and logistics. Their metric is client satisfaction and return rates.

  **The Term:** **"Regulated."**

  **Original Job (The Bench):**
  *   **Function:** Operational certification. It marks the completion of a specific adjustment procedure.
  *   **Boundaries:** A movement is "regulated" if and only if its rate falls within ±5 seconds per day across five static positions (dial up, dial down, crown left, crown right, crown up) on a timing machine.
  *   **Practitioner Statement:** "It's regulated when the beat error is under 0.2ms and the rate is green on the timer."
  *   **Evidence:** The printout from the timing machine.

  **Borrowed Job (The Intake Desk):**
  *   **Function:** Inferential license. It classifies the watch as safe to return to the client without complaint.
  *   **Boundaries:** A watch is "regulated" if it will maintain acceptable timekeeping *on a wrist* for a standard week.
  *   **Practitioner Statement:** "It's regulated when we know the client won't bring it back next month saying it runs fast."
  *   **Evidence:** The history of that specific caliber and the condition of the mainspring.

  **The Borderline Case:**
  A 1960s vintage movement with a worn mainspring.
  *   **Under the Bench use:** It is **Regulated**. The timing machine shows ±3 seconds/day. The spring holds tension long enough for the 12-hour test.
  *   **Under the Desk use:** It is **Not Regulated**. The worn spring loses torque after 18 hours, causing the watch to lose 40 seconds/day in real-world wear, triggering a client complaint.

  ***

  ### 2. The Exchange

  **Setting:** The workbench counter, 4:30 PM. Elias (Bench) is logging the 1960s Omega. Sarah (Intake) is packing shipping boxes.

  **Elias:** (Slides the movement box across the counter) Omega is done. Mark it as regulated.

  **Sarah:** (Opens the log, pen hovering) The '60s caliber? Elias, the mainspring is original. You know these slip after the first day on a wrist.

  **Elias:** It held rate for twelve hours on the machine. It's regulated. That's the spec.

  **Sarah:** If I call the owner and tell him his watch is regulated, he's going to wear it to the office. By Tuesday, he's forty seconds slow. He'll call me, I'll call you, and we'll have to redo it. It's not regulated if it doesn't hold.

  **Elias:** (Stops wiping his hands) "Regulated" means I adjusted the balance to the spec. It doesn't mean the parts are new. If you want it to hold rate forever, tell him he needs a rebuild, not a regulation. But right now, *this movement* is regulated.

  **Sarah:** I can't put "Regulated" on the invoice if I know it's going to drift. The client isn't buying a timing machine printout; he's buying a watch that tells time. You're handing me a technical pass, but I'm signing a performance guarantee.

  **Elias:** Then don't sign the guarantee. Just write that the movement is regulated.

  **Sarah:** I can't. In this shop, "Regulated" *is* the guarantee. If you say it's regulated, I ship it. If I ship it and it fails, I lied. So either it's not regulated, or you need to swap the spring.

  **Elias:** (Frustrated) I can't swap the spring; it's a collector piece. And I'm not leaving it on the bench forever chasing a ghost. It met the standard. You're changing the definition because you're worried about the phone ringing.

  **Sarah:** And you're hiding behind the timer because you don't want to admit the standard is useless if the watch doesn't work.

  *(They stand in silence. Elias thinks Sarah is conflating maintenance with repair. Sarah thinks Elias is conflating measurement with function. Neither believes they are using the word differently.)*

  ***

  ### 3. Diagnosis of the Slippage

  **The Driver of Drift:**
  The drift is driven by a change in **what counts as evidence** for the concept's application.
  *   For the **Bench**, evidence is *immediate and internal* (the timing machine readout). The term "regulated" closes a technical loop.
  *   For the **Desk**, evidence is *projected and external* (the client's future experience). The term "regulated" opens a commercial contract.

  The term survived the journey because it serves as a **handoff token**. It is the linguistic bridge that allows the Bench to say "I am done" and the Desk to say "You may proceed." However, the Bench defines "done" as *process completion*, while the Desk defines "proceed" as *risk clearance*.

  **The Actual Disagreement:**
  They are not disagreeing about a fact (both agree the timing machine shows ±3s/day). They are disagreeing about a **standard of sufficiency**.
  *   Elias argues from a standard of **Compliance**: Did the object meet the established technical parameters?
  *   Sarah argues from a standard of **Warranty**: Will the object perform its intended function in the wild?

  The slippage occurs because "Regulated" implicitly carries an inference of reliability. In the Bench context, reliability is assumed if the spec is met. In the Desk context, experience has taught them that meeting the spec is *necessary but not sufficient* for reliability in vintage pieces. The Desk use has quietly absorbed the condition "and the parts are sound enough to sustain the regulation," while the Bench use has not.

  **Resolution and Fluidity:**
  Would splitting the term resolve this?
  *   **Proposal:** Distinguish between **"Calibrated"** (Bench: met static specs) and **"Verified"** (Desk: passed dynamic wear test).
  *   **Loss:** Splitting the terms would break the workflow efficiency. "Is it regulated?" is a single checkpoint. Creating two checkpoints introduces friction and requires a new testing protocol (dynamic wear simulation) that the Bench currently lacks the time or equipment to perform.
  *   **Verdict:** The drift is **not an error**; it is a functional adaptation. The Desk *needs* the term to mean "safe to ship" to manage liability. The Bench *needs* the term to mean "specs met" to manage workload.

  The concept is genuinely fluid because it sits at the boundary of **production** and **consumption**. In any microdomain where a technical output becomes a consumer product, terms describing the output will inevitably drift from describing *how it was made* to describing *how it will be received*. Attempting to freeze the definition at the Bench level would render the term useless to the Desk; freezing it at the Desk level would make it impossible for the Bench to ever claim the work is done. The tension is structural, not linguistic.
