answer: |-
  This is a precise and difficult question because it requires separating the stated intentions of the participants from the structural logic of the practice itself. You are asking for a moral anatomy of informal social sanctioning. To do this, we must treat the practice not as a series of errors or excesses, but as a system with its own internal coherence, even if that coherence conflicts with the professed values of its participants.

  Here is the diagnosis.

  ### I. Candidate Readings

  Before reconstructing the implicit theory, we must clear the field of standard interpretations that fail to capture the specific shape of the phenomenon you describe.

  **1. The Retributive Reading:**
  On this view, the sanction is payback. The offender suffers because they deserve to suffer.
  *Verdict:* Incomplete. Pure retribution usually demands proportionality (an eye for an eye). The practice you describe is notoriously disproportionate and open-ended. Furthermore, retributivists typically believe that once the debt is paid, the ledger is clear. The absence of discharge suggests this is not merely about balancing a scale.

  **2. The Consequentialist/Deterrent Reading:**
  The sanction is a tool to minimize future harm. We punish this person to signal to others that this behavior is costly.
  *Verdict:* Plausible, but insufficient. Deterrence requires certainty and proportionality to be effective. If sanctions are arbitrary or perceived as mob justice, they may deter speech generally rather than specific harms. More importantly, deterrence does not explain the intense focus on the *moral character* of the offender rather than just the cost of the act.

  **3. The Restorative Reading:**
  The goal is to repair harm and reintegrate the offender.
  *Verdict:* Contradicted by the evidence. While the language of "harm" and "accountability" is restorative, the mechanism lacks the essential features of restoration: a facilitated dialogue, an agreement on repair, and a defined path to reintegration. Demanding an apology without a mechanism to accept it is not restoration; it is a loyalty test.

  **4. The Associational/Category Mistake Reading:**
  This is the strongest defense. It argues that this is not punishment at all. It is simply a voluntary group deciding who they wish to associate with. Just as a dinner party host can eject a guest without a trial, a community can deplatform a member.
  *Verdict:* This holds only if the community is truly voluntary and the sanction is truly bounded. However, when "deplatforming" involves economic livelihood, cross-community blacklisting, and permanent digital records that follow the individual into unrelated spheres, the sanction functions as punishment regardless of the label. The "association" defense collapses when the "community" is ill-defined and the consequences are totalizing.

  **5. The Expressive/Denunciatory Reading:**
  The primary function is to draw a bright line around community values. The offender is the medium through which the norm is reaffirmed.
  *Verdict:* This is the closest fit, but it needs modification. It explains the public nature of the sanction and the lack of proportionality (the message must be loud enough to be heard). However, standard expressive theory usually allows the drama to conclude once the norm is reaffirmed. The *permanence* of the sanction suggests something darker than mere expression.

  ### II. The Reconstruction: Expressive Exclusionism

  If we strip away the participants' professed commitment to restorative justice and look strictly at what the practice *does*, we arrive at an implicit theory I will call **Expressive Exclusionism**. This is not a coherent theory of punishment, but a coherent theory of *purity*.

  Here is what the practice presupposes:

  **1. Standing is Distributed and Unlimited.**
  In state theory, standing to punish is monopolized by the sovereign to prevent vendettas. In this practice, standing is distributed to anyone who feels harmed or aligned with the harmed. This presupposes that moral sovereignty resides in the affected populace directly. There is no appeal to a higher, neutral authority because neutrality is viewed as complicity.

  **2. Desert Tracks Threat, Not Just Harm.**
  In standard penal theory, severity tracks the harm done and the culpability of the agent. In this practice, severity tracks the *threat the act poses to the community's identity*. A minor slip by a high-status member may be punished more severely than a major harm by a low-status member if the former undermines the community's self-conception as a safe space. The offender becomes a symbol of the boundary.

  **3. Trust is Non-Renewable (The Contagion Model).**
  This is the critical divergence from both retributive and restorative models. Retribution allows for discharge; restoration allows for repair. Expressive Exclusionism operates on a model of moral contagion. Once a person has demonstrated a capacity for norm violation, they are viewed as permanently contaminated. The risk of re-offense is treated as an inherent trait rather than a behavioral history. Therefore, the sanction cannot be discharged because the status of "unsafe" is permanent.

  **4. The Sanction is Quarantine, Not Punishment.**
  Practitioners often resist the word "punishment." Structurally, they are right. Punishment implies a debt that can be paid. The practice is better understood as *quarantine*. You do not release a carrier of a disease because they have suffered enough; you release them when they are no longer contagious. Since moral contagion cannot be empirically verified, the quarantine remains indefinite.

  ### III. Internal Inconsistencies

  The friction you observe—communities criticizing the carceral state while employing carceral tactics—arises because Expressive Exclusionism tries to wear the clothing of Restorative Justice while operating on the logic of Purity.

  **1. The Apology Trap.**
  The practice frequently demands an apology. In a restorative framework, an apology is a key to reintegration. In Expressive Exclusionism, the apology is often treated as further evidence of guilt (an admission) or, if offered, dismissed as performative damage control. The system demands a ritual of restoration (the apology) but lacks the theological or social mechanism to grant absolution. This creates a double bind: silence is guilt, but speaking is manipulation.

  **2. The Due Process Paradox.**
  These communities rightly identify due process as a safeguard against power. However, they view formal procedure as a tool of protection for the powerful (a "shield for predators"). Consequently, they replace formal process with "trust the victims" or "believe the community." The inconsistency lies in demanding protection from power while wielding power without protection. They presuppose that their own power is inherently righteous, rendering safeguards unnecessary.

  **3. The Proportionality Gap.**
  If the goal is safety (quarantine), the sanction should last as long as the threat. If the goal is justice (punishment), the sanction should match the crime. The practice oscillates between these. It justifies indefinite sanctions (safety) using the language of accountability (justice). This allows for sanctions that are too severe for the crime (by justice standards) and too vague for the threat (by safety standards).

  ### IV. The Awkward Cases and Asymmetries

  The most revealing part of any moral theory is how it handles edge cases. Expressive Exclusionism fails specific stress tests that reveal its underlying commitments.

  **1. The Cost Asymmetry.**
  The cost of imposing the sanction is near zero (a tweet, a signature on a letter). The cost of receiving it is existential (loss of livelihood, social death). A coherent theory of justice requires that the cost of adjudication be borne by the accuser or the state to prevent frivolous claims. Here, the risk is entirely externalized to the accused. This presupposes that the *risk of allowing a norm violator to remain* is greater than the *risk of destroying an innocent person's reputation*. It is a Precautionary Principle applied to morality.

  **2. The Persistence of the Record.**
  In a restorative or even retributive system, the record is sealed or the debt is cleared. In this practice, the digital archive ensures the sanction is renewable by anyone, at any time, for any reason. This presupposes that the past is always present. It commits the community to the view that moral growth is either impossible or irrelevant compared to the historical fact of the violation.

  **3. The Protection Deficit.**
  You noted the sanction is borne most heavily by those with the least institutional protection. A tenured professor can weather a storm that will destroy an adjunct or a freelancer. If the theory were truly about "harm reduction," it would account for the differential impact of the sanction. That it does not suggests the theory is not actually about minimizing net harm, but about *performing* the minimization of harm. The purity of the community is prioritized over the welfare of the individual member.

  ### V. What Would Change Under a Genuine Alternative?

  To clarify what this practice *is*, it helps to specify what would have to change for it to become what it *claims* to be (Restorative) or what its critics want it to be (Liberal-Retributive).

  **If it were truly Restorative:**
  *   **Discharge:** There would be a defined mechanism for reintegration. Once the repair is made, the sanction ends.
  *   **Mediation:** There would be a neutral third party facilitating the exchange, rather than a public pile-on.
  *   **Privacy:** The process would be as private as possible to protect the dignity of all parties, going public only if necessary.
  *   **Focus:** The focus would shift from "What rule was broken?" to "What relationship was damaged and how do we fix it?"

  **If it were truly Liberal-Retributive:**
  *   **Proportionality:** Sanctions would be scaled to the severity of the violation.
  *   **Statute of Limitations:** Past violations would eventually expire.
  *   **Right to Defense:** The accused would have a recognized right to present context or counter-evidence before sanctioning occurs.
  *   **Monopoly on Force:** The community would designate specific agents to enforce norms, rather than allowing distributed vigilante sanctioning.

  ### VI. Diagnosis

  The practice you are observing is not a botched attempt at restorative justice, nor is it simply retribution in disguise. It is a system of **moral quarantine justified by expressive necessity.**

  It commits its practitioners to the view that:
  1.  **Safety is a binary state:** You are either safe or you are a threat; there is no "reformed threat."
  2.  **The Community is the Sovereign:** The collective feeling of the group overrides procedural safeguards.
  3.  **Memory is a Weapon:** The permanence of the record is a feature, not a bug, serving as a perpetual warning system.

  The inconsistency you detect is real. It arises because the practitioners are using the *vocabulary* of progressive justice (which emphasizes context, rehabilitation, and systemic power analysis) to enforce a *structure* of moral purity (which emphasizes boundaries, exclusion, and permanent stigma).

  They are attempting to solve a problem of social coordination (how do we live together?) using a logic of infection (how do we keep the pathogen out?). As long as the underlying metaphor is contagion rather than debt or damage, there can be no discharge, no proportionality, and no due process, because you do not negotiate with a virus, and you do not grant it rights. You isolate it. The tragedy is that they are applying this logic to human beings while insisting they are doing the opposite.
