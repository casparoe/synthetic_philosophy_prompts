      *   *Retributive:* "They deserve to suffer." But without proportionality, it's wild retribution.
      *   *Deterrent/Signaling:* Make an example of this person so others don't do it. Consequentialist.
      *   *Restorative (Corrupted):* Aiming for repair but lacking the structure (mediation, agreement) to achieve it.
