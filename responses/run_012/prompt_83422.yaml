prompt: |-
  For a piece I'm writing about how professional forecasters handle disagreement, I need you to do something I can't do myself: take the philosophical controversy over peer disagreement — conciliationism, the equal-weight view, steadfastness, the dispute about what a rational agent is required to do when a colleague who is just as well informed and just as competent as she is arrives at the opposite conclusion — and restate it, as faithfully as the translation permits, in the vocabulary I actually work in. That vocabulary is the forecasting world's: tournaments and prediction markets, aggregating a crowd's estimates, proper scoring rules, calibration and resolution, weighting contributors by track record, hierarchical models in which each forecaster's error is drawn from a shared distribution, correlated errors, and the difference between reducing noise and correcting bias. I know that vocabulary well enough to read a methods section, and I have no formal training in philosophy. Then give me the residue report, which is the part I actually want: which claims in the philosophers' dispute come through intact, which come through only distorted (and what gets bent in the process), and which have no expression at all in my vocabulary — say, a claim about what an agent is required to believe, as opposed to a claim about what will make her more accurate. For each piece of residue, tell me whether the loss is a defect of my framework or a sign that the original claim was less clear than it looked. Don't smuggle my framework's assumptions in and call that translation.

  Three things I suspect are doing quiet work, and I want them treated explicitly: first, the notion of an epistemic peer — someone with the same evidence and the same competence — when in forecasting you never observe another forecaster's information set, only her output; second, what independence assumptions get smuggled in when the peers share a training, a culture, or a data pipeline; third, the fact that weighting a forecast by its author's record is unremarkable common sense in my world, while in the philosophers' dispute that is precisely the move the steadfast party is accused of making illegitimately. I want to know whether my instinct — that the whole controversy collapses into the question of how to aggregate correlated forecasts — is right, or whether something is lost in saying so.

  Lead with your bottom line in the first sentence, then give the reasoning: no preamble, no restating of what I've asked.
