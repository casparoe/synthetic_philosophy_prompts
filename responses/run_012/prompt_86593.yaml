      *   **Tasks:**
          1.  Reconstruct the account of function presupposed.
          2.  Assess consistency (Etiological vs. Role-based).
          3.  Determine if a single account covers all three (especially regarding proxies performing *better*).
          4.  If inconsistent, say which instruments need rewriting.
          5.  Separate strict presuppositions from comfortable fits (identify underdetermination).
          6.  Identify rival accounts licensing the same behavior.
          7.  State concrete consequences of adopting the rejected account.
      *   **Constraint:** Roughly 1,000 words.

  2.  **Deconstruct the Instruments & Function Theories:**
      *   *Instrument 1 (Functional Extinction):* Focuses on the *loss of role* despite survival of traits/lineage. This leans towards a **Systemic/Role Account** (Cummins-style). If it were purely Etiological (Millikan-style), the function exists as long as the trait was selected for, regardless of current contribution. However, the prompt suggests it *looks* etiological because the species "still possesses the traits it was selected for." Actually, listing them as "functionally extinct" implies the *current contribution* matters more than the history. So, it's actually Role-based, but the prompt asks me to consider the tension.
      *   *Instrument 2 (Restoration/Proxy):* Focuses on *processes running* via a *substitute*. This is clearly **Role-based/Forward-looking**. History/Lineage is secondary to current causal contribution.
      *   *Instrument 3 (Invasive Species):* Harm = disruption of function. Origin irrelevant. This is also **Role-based**. An invasive species disrupts the *current* system, regardless of its evolutionary history.

      *   *Tension:* The prompt suggests Instrument 1 *looks* etiological (traits selected for) but lists based on lack of role. Instrument 2 looks role-based. Are they incompatible?
      *   *Etiological Theory:* Function is what a trait was selected for. (History dependent).
      *   *Role/Cummins Theory:* Function is a causal contribution to a containing system. (History independent).
      *   *The Authority's Practice:* All three instruments prioritize *current causal contribution* to the ecosystem over evolutionary history.
