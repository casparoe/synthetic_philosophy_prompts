answer: |-
  The conservation authority's practice commits it to a **Causal Role account of function** (akin to Cummins' theory), rather than an Etiological account (akin to Millikan's). While the instruments superficially appear to mix theoretical commitments, they cohere consistently under the view that function is defined by a trait or species' current causal contribution to a containing system's capacity, independent of evolutionary history.

  The apparent inconsistency arises from the first instrument, the Register of Functionally Extinct Species. The prompt suggests this looks etiological because the species retains the traits it was selected for. However, the listing criteria are not based on the loss of selected traits, but on the failure to perform an ecological role. Under a strict Etiological account, a species retains its function as long as the trait exists, regardless of population size, because the history of selection remains unchanged. By listing the species as "functionally extinct" solely due to low numbers preventing role performance, the authority prioritizes current systemic contribution over historical lineage. This aligns perfectly with the second instrument, the Restoration Programme. Here, a proxy species is accepted not because it shares the evolutionary history of the lost species, but because it drives the same processes. This is explicitly ahistorical; function is conferred by current performance, not ancestry. The third instrument, the Invasive-Species Schedule, reinforces this by defining harm as the disruption of ecosystem function regardless of origin. An invasive species may be well-adapted (etiological function in its home range), but it is harmful here because it disrupts the causal roles sustaining the local system. Thus, all three instruments rely on a single, consistent account: function is a forward-looking, systemic capacity, not a backward-looking historical fact.

  If this single Causal Role account covers all three, it must address the scenario where a proxy performs the role *more thoroughly* than the extinct species ever did. An Etiological account would deem this impossible or categorize the proxy as functionless, as the proxy lacks the specific history of selection for that specific niche. However, the Causal Role account must admit that the system is now *more* functional than it was historically. If function is causal contribution, a superior contributor enhances the system's capacity. Consequently, the authority would have to certify such a site not merely as "restored" to a historical baseline, but as "enhanced." The theory dictates that the value lies in the process running, not in the specific lineage running it. A proxy that stabilizes soil better or pollinates more efficiently fulfills the function more effectively, and the account must validate this improvement rather than viewing it as a deviation from a historical norm.

  Separating what the practice strictly presupposes from what merely fits comfortably reveals significant underdetermination. The practice *strictly presupposes* that current causal contribution is the necessary and sufficient condition for functional ascription. It does not strictly require that lineages be unique to functions, nor that historical baselines be the metric of success. However, the practice *fits comfortably* with the assumption that historical lineages are usually the most reliable providers of these functions. This is an empirical heuristic, not a theoretical commitment. The authority likely assumes native species are optimal proxies, but their instruments do not mandate it.

  This leaves room for a rival account to license the same behavior: a **Goal-Derived System Account**. Under this view, "function" is not defined by nature's history or even nature's current capacities alone, but by the specific goals of the conservation authority (e.g., stability, biodiversity, human utility). A Goal-Derived account licenses the exact same behavior: listing species that fail the goal (Instrument 1), substituting species that meet the goal (Instrument 2), and removing species that thwart the goal (Instrument 3). The behavior is underdetermined because we cannot distinguish whether the authority values the *process itself* (Causal Role) or the *outcome the process secures* (Goal-Derived). Both ignore history in favor of present utility. The Causal Role account says the function exists if the process runs; the Goal-Derived account says the function exists if the manager's objective is met. In practice, these overlap, but they diverge philosophically on whether the function is intrinsic to the system or extrinsic to the manager's intent.

  The concrete consequences become stark if the authority were to abandon the Causal Role account and adopt the **Etiological account** I have argued they currently reject. An Etiological commitment would force a radical restructuring of their instruments.

  First, the **Restoration Programme (Instrument 2) would have to cease**. Under an Etiological view, a proxy species cannot possess the function of the extinct species because it lacks the history of selection for that specific role in that specific context. Introducing a substitute would not be "restoration of function" but the introduction of a new, functionally distinct entity. The authority could not certify sites as "restored" based on process alone; they would need to resurrect the exact genetic lineage, likely making restoration impossible for most extinct species.

  Second, the **Register of Functionally Extinct Species (Instrument 1) would require rewriting**. A species would no longer be listed based on population thresholds preventing role performance. As long as individuals survived with the selected traits, the function would theoretically persist. The register would become a list of "Demographically Vulnerable" species, decoupling the concept of function from current ecological impact. Conservation priority might shift away from ecosystem services toward genetic preservation.

  Third, the **Invasive-Species Schedule (Instrument 3) would face definitional crises**. Harm could no longer be defined simply as disruption of current function. An invasive species might develop etiological functions within the new ecosystem over time. The authority would need to distinguish between "proper functions" (historical) and "accidental effects." Management would shift from protecting ecosystem processes to protecting historical integrity. Species that disrupt historical relationships would be targeted, even if they currently support system stability. Conversely, native species that lose their historical role due to environmental change might be protected despite being ecologically redundant.

  In sum, the authority currently operates as a functionalist pragmatist, valuing what nature *does* over where it *came from*. Adopting the etiological theory would transform them into historical archivists, prioritizing lineage over living systems. They would have to stop substituting species, start protecting functionally redundant natives, and redefine harm based on ancestry rather than ecological impact. The shift would move conservation from managing dynamic systems to curating a museum of evolutionary history.
