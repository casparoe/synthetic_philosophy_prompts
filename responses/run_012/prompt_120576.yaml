answer: |-
  The boundary problem is not merely a theoretical paradox for your cooperative; it is a practical design constraint. It reveals that your current bylaws (the formal *demos*) no longer match the reality of your shared infrastructure (the functional *demos*). The problem does not mean "no decision is possible"; it means that decisions made by ignoring the mismatch will be unstable or illegitimate.

  Here are the implications of the boundary problem for your situation, ranked by their practical weight.

  ### 1. The "All-Affected" Imperative (Highest Weight)
  **Implication:** The boundary problem strongly **undercuts Proposal 2 (Refuse)** and **supports Proposal 3 (Joint Vote)**.
  **Reasoning:** Democratic theory suggests that the legitimacy of a *demos* derives from the "all-affected principle": anyone subject to the consequences of a decision should have a say in it. Because the two buildings share a roof and boiler, the 60 tenants are already subject to your cooperative's decisions regarding maintenance, reserves, and capital improvements. To exclude them from the decision on whether to merge is to create a permanent class of subjects without representation.
  **Practical Action:** A flat refusal (Proposal 2) creates a democratic deficit that will likely manifest as conflict over maintenance costs or liability. While Proposal 3 (letting tenants vote) is the most theoretically robust, it may violate your current bylaws. If you cannot legally implement Proposal 3, you must approximate it: the 40 members should treat the tenants' preference as a veto-weighted advisory vote. If the 60 tenants overwhelmingly oppose the merger, the 40 should not proceed, even if they legally can.

  ### 2. The Risk of "Demos Suicide" (High Weight)
  **Implication:** The boundary problem **undercuts Proposal 1 (Admit Outright)** unless specific safeguards are added.
  **Reasoning:** The core paradox is that a *demos* cannot legitimately vote to dissolve itself without a higher-order rule. If the 40 members vote to admit the 60, they are voting to end their own status as the controlling *demos*. Once admitted, the 60 can vote to sell the buildings the next day. The boundary problem warns that a procedure allowing a minority to vote themselves out of existence is inherently unstable.
  **Practical Action:** If you choose Proposal 1, it cannot be a simple admission. It requires a "pre-nuptial" agreement embedded in the admission terms. For example, the bylaws could be amended *before* admission to require a supermajority (e.g., 75% of the total 100) for any sale of the buildings for a fixed period (e.g., 10 years). This protects the original 40 from being immediately outvoted on existential issues, acknowledging that the boundary shift is a merger of equals, not an absorption.

  ### 3. The Symmetry of Exit and Entry (Medium Weight)
  **Implication:** The boundary problem implies that **the secession demand must be judged by the same logic as the admission.**
  **Reasoning:** If you argue that the boundary must expand to include the 60 tenants because they are "affected" by shared infrastructure, you weaken the argument against the 12 members who want to leave. However, the stronger democratic principle here is *voluntary association*. If the *demos* is constituted by mutual consent, the boundary must be permeable in both directions. If you assert the right to define the boundary to *include* the 60 (against the tenants' will, if you choose Proposal 2), you cannot deny the 12 the right to define the boundary to *exclude* themselves.
  **Practical Action:** You cannot logically block secession while forcing admission. If the 12 members can prove they can physically and financially separate (e.g., metering their own boiler section, securing their own entrance), the cooperative should facilitate their exit. Blocking them while simultaneously expanding the cooperative to 100 units creates a "prison of membership" that undermines the voluntary nature of the cooperative model.

  ### 4. The Intergenerational Constraint (Lower Weight)
  **Implication:** The boundary problem **weakens the authority of the founding vote** but does not void it.
  **Reasoning:** You asked about the standing of the founding vote taken by people mostly gone. The boundary problem highlights that the current 40 members are merely custodians of a *demos* they did not constitute. The original founders set the boundary at 40 units; reality has shifted to 100 units. Relying solely on the "sacredness" of the original bylaws (Proposal 2) is theoretically weak because those bylaws were created by a *demos* that no longer exists in that form.
  **Practical Action:** Use this to persuade hardliners in the current 40. The argument "we must follow the original bylaws" is less powerful when the physical reality (shared roof/boiler) has changed. The founding vote legitimizes the *process*, but not the *permanent exclusion* of affected neighbors. This implication should change the tone of the debate: the current members are stewards, not absolute owners of the decision.

  ### Is it a Paradox or a Constraint?
  The boundary problem is a **constraint that admits of better and worse institutional designs**, not an unsolvable paradox.
  *   **Worse Design:** Ignoring the mismatch (Proposal 2) or ignoring the risk of self-termination (Proposal 1 without safeguards). This leads to instability, litigation, or internal coup.
  *   **Better Design:** Acknowledging that the *demos* is fluid. This means aligning the voting boundary with the "community of fate" (shared infrastructure).

  ### Recommendation on the Four Proposals
  Based on the practical weight of these implications:

  1.  **Avoid Proposal 2 (Refuse).** It is democratically illegitimate given the shared infrastructure and will create long-term friction.
  2.  **Modify Proposal 1 (Admit Outright).** This is the most legally viable path, but it must include **safeguards** (supermajority requirements on asset sales) to address the "Demos Suicide" risk.
  3.  **Approximate Proposal 3 (Joint Vote).** If legally possible, amend the bylaws temporarily to allow the 60 tenants an advisory vote on the merger. If their support is low, do not proceed. If legally impossible, hold a joint town hall where the 40 members commit to respecting the tenants' majority view.
  4.  **Use Proposal 4 (Associates) only as a bridge.** Five years is too long to deny voting rights to people sharing a boiler. If you use this, it must be a short transition (e.g., 6 months) to full membership, not a permanent caste system.

  **Final Verdict:** The boundary problem dictates that you **must admit the tenants** (aligning the *demos* with the affected community), but you must **condition that admission** to protect against immediate asset liquidation (addressing the self-termination paradox). Simultaneously, you should **allow the secession** of the 12 members if they can demonstrate physical/financial viability, maintaining the principle of voluntary association.
