      *   Conclusion on the "Paradox vs. Constraint" question.

      *(Self-Correction during drafting)*: Make sure to explicitly answer "whether it is a paradox with no solution or a constraint." It is a constraint that admits better/worse designs.
      Make sure to address the "founding vote" specifically.
      Make sure to address the "secession" specifically.

      *Refining the "Joint Vote" legality:* I must note that Proposal 3 might be illegal under current bylaws. The Boundary Problem *supports* it normatively, but practically it requires a workaround (e.g., advisory vote + moral commitment, or amending bylaws first). I should clarify that distinction.

      *Refining the "Secession":* If the 60 are admitted because they are "affected," the 12 cannot secede just because they are "dissatisfied." But if the 60 are admitted because the *demos* should match the *community of fate*, the 12 might argue they are a separate *community of fate*. Actually, the stronger link is: If the boundary is mutable for admission, it must be mutable for exit.

      *Let's settle on the Ranking:*
