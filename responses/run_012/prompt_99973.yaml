      *   *Decision:* **Split the grading.** Each recommendation stands on its own evidence. The "Guideline" itself is not a hypothesis to be graded. However, to address the methodologist's concern without crippling the clinicians, we should add an explicit "Preface Clause" (interpretive statement) acknowledging that individual application varies and error is possible, while maintaining the "Strong" grade *per recommendation*.
