      *   **Steel-manning the Rejected View:** Why the Methodologist isn't *wrong* about the risk, just wrong about the *unit of analysis*. Why the Clinicians aren't *wrong* about utility, but risk overconfidence.
      *   **Conclusion:** Call to vote.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Did I address the "closure of rational belief" point?
