  4.  **Addressing Specific Technical Questions:**
      *   *State vs. Log:* Identity is the Log (causal history). State is just the current projection.
      *   *Leader/Consensus:* No global consensus. It's a gossip mesh.
      *   *Snapshot vs. Process:* Snapshot is memory; Process is the active inference engine running on that memory.
      *   *Serialization:* Moving to a new substrate (uploading) is a migration. Is it the same service? Depends on if the log continuity is preserved.
      *   *Partition/Fission:* Split-brain. Both claim the ID. Neither is "true" primary.
      *   *Forgetting:* Lossy compression + GC. Tombstones exist (traumas?), but mostly just dropped packets.
      *   *Identity:* Constituted by causal history (the log), not just current state hash.

  5.  **The Residue Report (The Critical Analysis):**
      *   *Translates Cleanly:* Redundancy, lossy replication, divergence over time, the "pattern" vs. "hardware" distinction.
      *   *Requires Fudging:* The "merge" strategy. Brains don't have a `resolve_conflict()` function that works well. The "quorum" for truth is social, not algorithmic.
      *   *No Counterpart (The Hard Stuff):*
          *   *Observability:* Who is reading the logs? The system assumes an external observer. Hofstadter claims the system *is* the observer.
          *   *Ownership/Moral Weight:* DS assumes replicas are fungible. If Node A dies and Node B takes over, the client doesn't care. If *I* die and *You* carry my pattern, *I* (the original process) cease to experience. The DS model hides the "center of experience."
          *   *The "Client":* In DS, there's a client sending requests. In Hofstadter's view, the self *generates* the requests. Where does the intent come from?

