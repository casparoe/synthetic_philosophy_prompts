      *   *Translation:* The "Copy" reading survives better. In DS, a replica is a copy. It serves requests, but it's not the *original* hardware. Hofstadter wants to say the copy *is* the original. DS says they are functionally equivalent but distinct instances.
      *   *Verdict:* The "weaker" claim (copies that resemble me) fits DS better. The "strong" claim (those replicas *are* me) requires smuggling in a metaphysical assumption that "function = ontology."

