answer: |-
  The argument breaks at Premise (1), and fixing it to save your position costs you the principle of individual consent, forcing you to ground political authority in current majoritarian will rather than self-rule.

  Premise (1) asserts that authority requires individual authorship or consent, but if you maintain this strict standard, you cannot escape Premise (6): no statute binds you, which contradicts your desire to keep Premise (7). To avoid anarchism while keeping Premise (4), you must redefine "authorship" not as individual consent, but as collective membership in a current majority. Under this fix, statutes have authority because they reflect the will of the living majority (satisfying 7), while judicial review is illegitimate because it allows unelected judges or dead generations to thwart that current will (satisfying 4).

  The cost of this fix is substantial: you must abandon the idea that constitutional rights protect you against the majority. If legitimacy flows solely from the current popular will, then any entrenched right that blocks a majority decision becomes an illegitimate "dead hand" constraint, just like the constitutional clauses your friend attacks. This explains why your friends' answers felt unsatisfactory; they tried to preserve some version of individual autonomy or higher law, but your position logically requires accepting that the living majority rules absolutely, with no shield for the minority other than persuasion. You can keep your view, but only by admitting that democracy trumps liberty when the two conflict.
