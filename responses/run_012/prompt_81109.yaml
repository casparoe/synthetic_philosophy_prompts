answer: |-
  # Session Plan: The Fragility of Cooperation

  **Course:** Philosophy of the Social Sciences (Upper-Level Undergraduate)
  **Duration:** 90 Minutes
  **Class Size:** 18 Students (16 Players, 2 Referees)
  **Room:** Movable desks, whiteboard required.

  ## I. Materials List

  *   **Cards:** 32 index cards (16 marked with a large **Circle**, 16 marked with a large **Square**). *Do not label them Cooperate/Defect.*
  *   **Score Sheets:** 8 sheets (one per pair), pre-drawn with columns for Round #, Player A Choice, Player B Choice, Player A Points, Player B Points.
  *   **Dice:** 10 six-sided dice (2 for referees, 8 spares for pairs if needed, though referees will hold the dice).
  *   **Pens:** 10.
  *   **Collection Box:** 1 box or hat for Block 1 card collection.
  *   **Board:** Pre-write the Payoff Matrix (see below) before students enter.

  **The Payoff Matrix (On Board):**
  *Label the options "Option Circle" and "Option Square".*

  | You \ Partner | Circle | Square |
  | :--- | :---: | :---: |
  | **Circle** | 3, 3 | 0, 5 |
  | **Square** | 5, 1 | 1, 1 |

  *(Instructor Note: Ensure students understand the first number is their points, the second is their partner's.)*

  ---

  ## II. Rules of Play (Read Aloud)

  1.  **Goal:** Your objective is to accumulate as many points for **yourself** as possible. Do not worry about your partner's score or other pairs' scores.
  2.  **Choices:** In each round, you will choose Circle or Square. You will play simultaneously.
  3.  **Scoring:** Points are awarded based on the matrix on the board.
  4.  **Referees:** Two students will act as Referees. They hold the dice, verify choices, and record scores. They do not play. (Assign these roles now).
  5.  **Silence:** No talking between partners during play unless a specific block allows it. No signaling.

  ---

  ## III. Minute-by-Minute Timeline

  ### 0:00 – 0:05 | Setup & Grouping
  *   Divide class into 8 pairs. Arrange desks so partners face each other but cannot easily see other pairs' cards.
  *   Assign 2 students as Referees. Give each Referee 4 score sheets and 1 die. They manage 4 pairs each.
  *   Distribute cards (1 Circle, 1 Square per player).
  *   **Instruction:** "Look at the board. This is the only rule for points. Do not discuss strategy yet."

  ### 0:05 – 0:10 | Block 1: The One-Shot
  *   **Mechanic:** Single round. Anonymous.
  *   **Action:** Players choose Circle or Square secretly. Hold cards to chest.
  *   **Collection:** Referees collect cards into the box *before* revealing. This prevents reaction.
  *   **Reveal:** Referees reveal cards, record scores on the sheet, return cards.
  *   **Transition:** "Reset cards. Do not discuss what happened."

  ### 0:10 – 0:30 | Block 2: Uncertain Horizons
  *   **Instruction:** "You will play with the same partner for multiple rounds. After each round, the Referee will roll a die. If the die shows 1–5, you play another round. If 6, the game ends for your pair." (Continuation probability $p = 5/6$).
  *   **Run 1 (High Probability):** Play until the die stops each pair. (Approx. 8-10 mins).
  *   **Transition:** "Reset scores to zero. New rule: After each round, the Referee rolls. If the die shows 1–2, you play another round. If 3–6, the game ends." (Continuation probability $p = 1/3$).
  *   **Run 2 (Low Probability):** Play until the die stops each pair. (Approx. 8-10 mins).
  *   **Note:** Pairs will finish at different times. Have finished pairs observe silently.

  ### 0:30 – 0:40 | Block 3: The Known End
  *   **Instruction:** "You will play exactly eight rounds. You will be told when Round 7 begins. You will be told when Round 8 begins. After Round 8, it is over."
  *   **Action:** Play 8 rounds. Referees announce round numbers aloud.
  *   **Transition:** "Reset scores. Keep your partner."

  ### 0:40 – 1:05 | Block 4: Noise & Repair
  *   **Instruction:** "You will play multiple rounds. After each round, a die decides if you continue (1–5 continue, 6 stops), same as the first part of Block 2."
  *   **The Twist:** "Before recording scores, the Referee rolls a second die. If it shows a 6, the Referee must **flip** one of your choices secretly. If you played Circle, it is recorded as Square. If Square, recorded as Circle. The Referee records the *flipped* result. **Neither player is told a flip occurred.**"
  *   **Action:** Play for 15 minutes.
  *   **Intervention (Minute 55):** Stop the game. "You may now talk to your partner for two minutes. You cannot show your score sheet. You can only talk about what you *intended* to play in the past and what you *intend* to play next. Resume play."
  *   **Goal:** Watch if they punish the error or apologize for their own "errors."

  ### 1:05 – 1:30 | The Debrief (Lecture & Derivation)
  *   *Put away cards. Move to board.*

  ---

  ## IV. The Debrief Script

  ### 1. The Data (5 Minutes)
  Ask for a show of hands regarding Block 2.
  *   "In the High Probability game ($5/6$), how many pairs ended with mostly Circles?"
  *   "In the Low Probability game ($1/3$), how many pairs ended with mostly Squares?"
  *   "In the Known End game (8 rounds), what happened in Round 8? What happened in Round 1?"

  *Write the Payoff Matrix on the board again.*
  $T = 5$ (Temptation), $R = 3$ (Reward), $P = 1$ (Punishment), $S = 0$ (Sucker).

  ### 2. The Threshold Derivation (10 Minutes)
  "We need to find the point where sticking with Circles becomes smarter than taking the Square."

  *   **Step 1:** "If we both keep playing Circle, I get 3 points every time. If the probability of continuing is $w$, my total expected value is $3 + 3w + 3w^2...$ which sums to $3 / (1-w)$."
  *   **Step 2:** "If I defect (Square) while you play Circle, I get 5 once. But then you will likely punish me (play Square). So I get 5 now, and 1 forever after. Total: $5 + 1w + 1w^2...$ which sums to $5 + w / (1-w)$."
  *   **Step 3:** "Cooperation pays if the first sum is bigger than the second."
      $$ \frac{3}{1-w} > 5 + \frac{w}{1-w} $$
  *   **Step 4:** "Multiply by $(1-w)$:"
      $$ 3 > 5(1-w) + w $$
      $$ 3 > 5 - 5w + w $$
      $$ 3 > 5 - 4w $$
      $$ 4w > 2 $$
      $$ w > 1/2 $$
  *   **Step 5:** "Generalize this." Write on board:
      $$ w > \frac{T - R}{T - P} $$
      $$ w > \frac{5 - 3}{5 - 1} = \frac{2}{4} = 0.5 $$
  *   **Conclusion:** "Look at your Block 2 dice. High probability was $5/6$ (0.83). That is above 0.5. Cooperation should hold. Low probability was $1/3$ (0.33). That is below 0.5. Cooperation should collapse. Did your data match this?"

  ### 3. The Finite Horizon (5 Minutes)
  "In Block 3, you knew Round 8 was the end. Logic suggests: In Round 8, there is no future, so I should play Square to get 5 instead of 3. But if you know I will play Square in Round 8, you should play Square in Round 7 to protect yourself. This unravels back to Round 1."
  *   **The Gap:** "Theory says you should have played Square in Round 1. Most of you didn't. You cooperated until the end. Why? Because the theory assumes perfect rationality and no social cost. The 'unraveling' is real, but it starts later than logic dictates. Cooperation is not just math; it is habit."

  ### 4. Noise and Contrition (5 Minutes)
  "In Block 4, mistakes happened. If you play 'Eye for an Eye' (match their last move), a single mistake creates a loop of revenge: I hit you, you hit me, I hit you. Both scores drop."
  *   **Forgiveness:** "Ignoring the hit and playing Circle again. Risk: You get exploited if the other person isn't sorry."
  *   **Contrition:** "If *I* made the mistake (even if I didn't know it), I should play Square to let you hit me, restoring the balance, then return to Circle."
  *   **The Lesson:** "Reciprocity needs error-correction. Pure retaliation destroys cooperation in a noisy world. Pure forgiveness invites exploitation. Cooperation is an equilibrium condition, not a moral achievement. It requires the right structure to survive."

  ### 5. Explanation vs. Justification (5 Minutes)
  "Finally, a philosophical distinction. Today we *explained* cooperation. We showed the conditions under which it emerges mechanically. We did not *justify* it. Showing that cooperation is useful does not prove it is good. A cartel cooperates to fix prices; a gang cooperates to commit crimes. The logic of the repeated game explains why they stick together, but it does not tell us if we should admire them. Do not confuse the stability of a norm with its virtue."

  ---

  ## V. Troubleshooting & Limitations

  **1. Out-of-Band Deals (Block 1)**
  *   **Risk:** Students talk or signal during the one-shot game.
  *   **Fix:** Enforce the "Cards to Chest" rule strictly. Collect cards in the box *face down* before anyone reveals. If a pair talks, disqualify their points for that round. Remind them: "The game tests incentives, not promises."

  **2. Variable Game Lengths (Block 2)**
  *   **Risk:** One pair rolls a 6 immediately; another plays 20 rounds. This skews data comparison.
  *   **Fix:** In the debrief, do not compare total points. Compare *percentage of Circle plays*. Acknowledge the variance: "Some of you got lucky with the die, some didn't. That variance is part of the uncertainty." If a game ends in Round 1, ask that pair to observe the others to see what they missed.

  **3. Personalizing Defection (Block 3)**
  *   **Risk:** A student feels betrayed by a partner defecting in Round 8.
  *   **Fix:** In the debrief, frame the Round 8 defection as "succumbing to the logic of the end." Say: "If your partner defected in Round 8, they were not being mean; they were being rational according to the finite structure. The system punished the virtue of consistency."

  **4. The "Referee" Burden**
  *   **Risk:** Referees get bored or make errors on noise rolls.
  *   **Fix:** Tell referees their grade/participation depends on accurate recording. In Block 4, remind them: "You are the ghost in the machine. Do not reveal the flip. If a player asks, say nothing."

  **5. What the Activity Cannot Reproduce**
  *   **Limitation:** This simulation creates *incentives*, not *beliefs*. It shows why cooperation is stable, not why it feels *right*.
  *   **Instructor Supply:** You must supply the normative link. The game shows that trust is a calculation. You must ask the class: "If trust is just a calculation, is it still trust?" This is the philosophical work the game cannot do itself. The game explains the mechanism; you must lead the inquiry into the meaning.

  **6. Time Management**
  *   **Risk:** Block 4 runs long because students try to "fix" the noise.
  *   **Fix:** Be ruthless with the timer. When the 15 minutes for Block 4 are up, stop the play even if they are mid-conversation. The frustration of interrupted repair is data for the debrief.
