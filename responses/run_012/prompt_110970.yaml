answer: |-
  Here is the specification. It is drafted as a rigorous philosophical brief, structured so that a character can adopt it as a framework, attack it, or find it wanting. Following the specification is the meta-analysis you requested: an evaluation of the requirements themselves, their tensions, and their performance against test cases.

  ***

  # The Specification: Conditions for Adequate Accounts of Social Construction

  To assert that a kind $K$ is socially constructed is to make a precise ontological and causal claim. Any theory claiming $K$ is constructed must satisfy the following ten conditions. Failure to satisfy a condition renders the claim either trivial, incoherent, or empirically false.

  ### 1. The Contrast Class (Ontological Independence)
  **Requirement:** The account must specify a class of kinds that are *not* socially constructed, such that the distinction is not merely about causal influence.
  **Defense:** If "constructed" means "influenced by human activity," then scars, agriculture, and hurricanes (in an age of climate control) are constructed. This renders the term useless. A non-constructed kind must be *ontologically independent* of human attitudes.
  **Criterion:** A kind $K$ is not constructed if and only if the extension of $K$ would remain largely stable in a counterfactual world where human conceptual schemes, languages, and social practices did not exist. (e.g., *Electron* passes; *Citizen* fails).

  ### 2. Constitution vs. Causation (The Making Condition)
  **Requirement:** The account must distinguish between social factors *causing* a trait and social factors *constituting* the kind.
  **Defense:** Diet (socially arranged) causes height, but height is not a social kind. Money is not caused by agreement; it *is* the agreement institutionalized.
  **Criterion:** For $K$ to be constructed, social facts must appear in the *truth conditions* of statements attributing $K$-membership. If you can fully describe the conditions for being a $K$ without referencing social attitudes, rules, or agreements, $K$ is merely causally influenced, not constituted.

  ### 3. The Phenomenology of Resistance (Objectivity)
  **Requirement:** The account must explain why constructed kinds present themselves as external, coercive, and resistant to individual will.
  **Defense:** If I decide I am no longer a debtor, the bank does not agree. Constructed kinds feel like natural laws. A theory that treats them as voluntary or fluid fails to capture the lived reality of the characters inhabiting them.
  **Criterion:** The theory must identify the *enforcement mechanisms* (legal, physical, economic, or normative) that stabilize the kind against individual revision. The kind must have "friction."

  ### 4. The Looping Effect (Reflexivity)
  **Requirement:** The account must accommodate the possibility that classifying an entity as $K$ changes the entity in ways that alter the extension of $K$.
  **Defense:** Classifying a child as "learning disabled" changes their educational trajectory, which changes their cognitive development, which changes the meaning of "learning disabled." Natural kinds (generally) do not care what we call them.
  **Criterion:** The theory must allow for feedback loops where the *knowledge* of the classification becomes a causal factor in the *persistence* of the classified trait.

  ### 5. Reality without Mind-Independence (Causal Efficacy)
  **Requirement:** The account must affirm that constructed kinds are real and causally efficacious, not merely fictional or arbitrary labels.
  **Defense:** To say race is constructed is not to say racism is imaginary. Money is constructed, but poverty is real. If construction implies "illusion," the theory is ethically and empirically bankrupt.
  **Criterion:** $K$ must be capable of entering into causal laws. Statements of the form "Being $K$ caused $E$" must be capable of being true, even if $K$ depends on minds for its existence.

  ### 6. Contingency and Error (Variation)
  **Requirement:** The account must allow for historical/cross-cultural variation in $K$'s definition and for the possibility that subjects are mistaken about their own membership in $K$.
  **Defense:** If $K$ is necessary and universal, it looks like a natural kind. If subjects cannot be wrong about being $K$ (incorrigibility), the kind lacks critical depth.
  **Criterion:** The theory must permit a world where $K$ does not exist, or exists with different boundaries. It must also permit a gap between *self-identification* and *social ascription* (e.g., one can be $K$ without knowing it, or know oneself as $K$ without being accepted as such).

  ### 7. Existence vs. Membership (The Rules of the Game)
  **Requirement:** The account must separate the conditions for the *existence of the kind* from the conditions for *membership in the kind*.
  **Defense:** The institution of marriage (the kind) exists only if certain social rules exist. But whether *John* is married (membership) depends on whether John followed those rules. Confusing these leads to category errors.
  **Criterion:** The theory must distinguish the *constitutive rules* that create the possibility of $K$ from the *regulative criteria* that determine if a specific entity falls under $K$.

  ### 8. The Normative/Epistemic Gap (Consequences)
  **Requirement:** The account must specify what, if anything, follows from $K$ being constructed regarding how we should treat $K$ or know $K$.
  **Defense:** Many assume "constructed" implies "unjust" or "changeable." This is a non-sequitur. Language is constructed but not necessarily unjust. The theory must explicitly argue for the normative leap, not assume it.
  **Criterion:** The theory must provide a valid inference pattern from "$K$ is constructed" to "$K$ is [contingent/oppressive/revisionable]," or explicitly deny that such an inference holds.

  ### 9. Empirical Compatibility (The Constraint)
  **Requirement:** The account cannot contradict established empirical findings regarding the biological, physical, or historical substrate of $K$.
  **Defense:** A social theory of disease cannot deny the existence of viruses. A social theory of race cannot deny genetic variation (even if it denies that variation maps to racial categories).
  **Criterion:** The theory must be consistent with the best available evidence regarding the *material base* upon which the social kind is supervenient.

  ### 10. The Mechanism of Construction (The Agent)
  **Requirement:** The account must identify *who* or *what* does the constructing and by what process.
  **Defense:** "Society" is not an agent. If no one intended $K$, how was it constructed? If it was unintended, was it evolved rather than made?
  **Criterion:** The theory must specify whether the construction is the result of *collective intentionality* (explicit agreement), *aggregation of practice* (habitual behavior), or *power imposition* (one group forcing a category on another).

  ***

  # Meta-Analysis: Tensions, Commitments, and Tests

  This section evaluates the specification itself. It identifies which requirements are essential, which are partisan, where the contradictions lie, and how the list performs against your test cases.

  ### 1. Desiderata vs. Camp Commitments
  Not all ten requirements are neutral. Some are demanded by realism, others by constructivism.
  *   **Genuine Desiderata (Neutral):** Requirements **1 (Contrast)**, **2 (Constitution)**, **5 (Reality)**, and **9 (Empirical)** are necessary for *any* coherent theory. Without these, the term "construction" dissolves into nonsense or fantasy.
  *   **Camp Commitments (Contested):**
      *   **Requirement 8 (Consequences):** Strong constructivists often insist construction implies *contingency* and therefore *political revisability*. Critical realists argue a kind can be constructed but structurally necessary (e.g., class under capitalism). A character arguing that "because it is made, we can unmake it" is making a commitment here, not stating a fact.
      *   **Requirement 10 (Mechanism):** Intentionalists (e.g., institutional theorists) require agents. Structuralists (e.g., Foucaultians) argue construction happens *through* subjects, not *by* them. A character demanding a "who" is taking a side against the idea of emergent social structures.

  ### 2. The Conflict: Resistance vs. Contingency
  There is a genuine tension between **Requirement 3 (Resistance)** and **Requirement 6 (Contingency)**.
  *   **The Conflict:** If a kind is highly contingent (could easily have been otherwise), why does it feel so resistant (like a law of nature)? Conversely, if it is so resistant that it coerces behavior universally, in what sense is it contingent?
  *   **Diagnosis:** This is not an artifact of the list; it is the central drama of social ontology. It is the friction between *structure* and *agency*.
  *   **Resolution:** A theory resolves this by appealing to **Requirement 10 (Mechanism)**. If the mechanism is *coercive power* or *deeply embedded habit*, the kind can be ontologically contingent (we could stop doing it) but phenomenologically necessary (we cannot imagine stopping).
  *   **For the Novel:** This is where your characters should fight. One character feels the weight (Req 3); the other sees the history (Req 6). Both are right, and the friction is the story.

  ### 3. The "Killer" Requirement
  **Requirement 2 (Constitution vs. Causation)** does the most work to eliminate otherwise popular accounts.
  *   **Why:** Most loose talk about construction fails here. People say "Intelligence is socially constructed" because schools (social) affect test scores (causal). But if intelligence refers to a cognitive capacity that exists independent of the school, it fails Req 2.
  *   **Effect:** This requirement forces the characters to be precise. If a character claims a kind is constructed, they must show that the *definition* of the kind relies on social facts, not just that the *distribution* of the kind is affected by social facts. It kills the "everything is constructed" triviality.

  ### 4. Test Cases

  #### Case A: Money (The Control)
  *   **Verdict:** Passes all 10 cleanly.
  *   **Analysis:**
      *   *Contrast:* Without humans, paper is just cellulose (Req 1).
      *   *Constitution:* It is money *because* we treat it as such (Req 2).
      *   *Resistance:* You cannot spend fake money; the system rejects you (Req 3).
      *   *Reality:* It buys food; inflation kills economies (Req 5).
      *   *Mechanism:* Collective intentionality backed by state force (Req 10).
  *   **Utility:** Use money to show what a "successful" construction looks like. If a character can explain money, they have the template for the harder cases.

  #### Case B: Gender
  *   **Verdict:** Passes most, high tension on Req 2 and Req 9.
  *   **Analysis:**
      *   *Constitution:* Is "woman" constituted by social norms (Req 2) or biological traits (Req 9)? This is the battlefield. A theory that says "entirely biological" fails Req 2. A theory that says "entirely performative" risks failing Req 9 (material base).
      *   *Feedback:* Gender performance alters the body and social treatment (Req 4).
      *   *Resistance:* Gender policing is violent and structural (Req 3).
  *   **Utility:** This is where the "Constitution vs. Causation" distinction becomes violent. Characters will disagree on whether biology is the *substrate* or the *definition*.

  #### Case C: Race
  *   **Verdict:** Passes most, critical tension on Req 5 and Req 9.
  *   **Analysis:**
      *   *Empirical:* Genetic variation does not map to racial categories (Req 9 passes for constructionism).
      *   *Reality:* Racism has biological effects (stress, mortality) (Req 5 passes).
      *   *Mechanism:* Power imposition rather than agreement (Req 10).
      *   *Conflict:* The tension between "Race is biologically fake" (Req 1/9) and "Race is socially real" (Req 5) is the core philosophical problem.
  *   **Utility:** Use this to test Req 5. A character who says "Race isn't real because it's constructed" fails the specification. A character who says "Race is real because it kills" passes it.

  #### Case D: Water (H₂O) (The Non-Constructed Kind)
  *   **Verdict:** Fails Req 1 and Req 2.
  *   **Analysis:**
      *   *Contrast:* Water exists without humans (Req 1).
      *   *Constitution:* We did not make water H₂O; we discovered it. Social agreement does not constitute its chemical structure (Req 2).
      *   *Feedback:* Calling it water does not change its boiling point (Req 4 fails).
  *   **Utility:** Use this to show the boundary. If a character tries to argue water is constructed, they must argue that *chemistry* is a social practice. This isolates the radical constructivist position.

  ### Final Note for the Author
  The specification is designed so that no character can satisfy all ten without cost.
  *   To emphasize **Resistance (3)**, you must lean toward structuralism, which weakens **Agency/Mechanism (10)**.
  *   To emphasize **Contingency (6)**, you risk making the kind seem voluntary, weakening **Resistance (3)**.
  *   To emphasize **Reality (5)**, you risk reifying the kind, weakening **Contrast (1)**.

  Your characters should not just argue about whether a kind is constructed; they should argue about *which requirement matters most*. One character may value the reality of suffering (Req 5) over the historical contingency (Req 6). Another may value the possibility of change (Req 8) over the phenomenology of resistance (Req 3). That is where the metaphysics becomes drama.
