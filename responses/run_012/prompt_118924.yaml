answer: |-
  The argument you lost is a common one, but your intuition about the fault line is the more philosophically interesting position. The standard critique of *Politics* Book I is that it is circular: the slave is he who is ruled, and he is ruled because he is a slave. Your counter—that the tension is internal to the psychology of the slave, specifically regarding the possession of virtue without the deliberative faculty (*bouleutikon*) to originate it—preserves Aristotle's rigor while exposing the fracture.

  If we treat *The Tempest* not as a post-colonial allegory but as a stress test for this specific Aristotelian psychology, the play does not simply refute the theory. It inhabits it until the structural stress becomes visible. The demolition does not occur because Caliban is "obviously" free, but because the conditions required to maintain him as a slave reveal the master's dependency on the very faculty he denies the servant.

  Here is the reading you asked for.

  ### The Aristotelian Case in the Storm
  Prospero's initial case against Caliban fits the Aristotelian justification with uncomfortable precision. In *Politics*, Aristotle argues that natural slavery is beneficial for the slave; the master provides the reason (*logos*) that the slave lacks, guiding him toward a virtue he cannot conceive.

  In Act 1, Scene 2, Prospero outlines this pedagogy. When Caliban was "thine own," he knew "not thine own meaning," but would "gabble like a thing most brutish." Prospero claims to have endowed him with language and reason ("I pitied thee, / Took pains to make thee speak"). In Aristotelian terms, Prospero is the *logos* external to Caliban, animating a body that would otherwise be inert matter. Caliban's initial admission—"Thou didst prevent me; I had peopled else / This isle with Calibans"—concedes a lack of self-governance. He acknowledges a state of nature that requires mastery to become a state of order.

  Furthermore, the "living tool" (*organon empsuchon*) definition holds in the labor. Caliban fetches wood, digs pig-nuts, and maintains the cell. He is instrumentalized. If the play ended here, it would be an illustration of the theory, not a critique. The Aristotelian defense rests on the claim that this arrangement is *for Caliban's benefit*, saving him from his own brutishness.

  ### The Fault Line: Deliberation and Virtue
  Your insight regarding the deliberative faculty is where the text begins to strain. Aristotle concedes the slave possesses virtue, but only enough to obey, not to command. He must perceive reason, not possess it.

  *The Tempest* breaks this distinction in two specific movements. The first is Caliban's capacity for conspiracy. To plot against Prospero (Act 3, Scene 2) requires more than obedient virtue; it requires a projection of future states, an assessment of risk, and a coordination of will with Stephano and Trinculo. This is deliberation. Aristotle's natural slave is supposed to lack the *bouleutikon* entirely; he is to be the hand, not the head. Caliban is the head of the plot against the master. He instructs the drunkards: "Lo, lo, again! Bite him to death, I prithee." He is commanding reason, not merely following it.

  The second, more devastating break is aesthetic. In Act 3, Scene 2, Caliban delivers the speech about the isle being "full of noises, / Sounds and sweet airs, that give delight and hurt not." This is not instrumental reason. It is not about survival or obedience. It is a contemplative appreciation of beauty for its own sake. Aristotle reserves the highest capacity—the contemplation of form—for the free man. If the "natural slave" can apprehend beauty in a way that transcends utility, the psychological boundary between slave and free dissolves. Caliban possesses an interiority that the category of "living tool" cannot contain.

  ### The New Master and the Confusion of Power
  Your friend's point about Caliban seeking a new master (Stephano) is the strongest evidence for the Aristotelian view. It suggests Caliban has a "servile nature" that requires a master. He transfers allegiance from Prospero to Stephano, worshipping the bottle as a god.

  However, read through your psychological lens, this does not prove Caliban is a natural slave; it proves he is a victim of *conquest*, which Aristotle explicitly distinguishes from natural slavery. Aristotle admits that slavery resulting from war or force is often unjust, as it relies on superior strength, not superior reason.

  Caliban seeks Stephano not because he recognizes superior reason, but because he recognizes superior *force* (the thunder of the bottle). He mistakes intoxication for divinity. This is not the slave recognizing the master's *logos*; it is the subject submitting to the tyrant's power. The tragedy is not that Caliban needs a master, but that he cannot distinguish a true master (one who guides by reason) from a false one (one who rules by appetite). This reflects poorly on Prospero. If the master's function is to teach the slave to recognize reason, Prospero has failed. Caliban's worship of Stephano demonstrates that Prospero's rule has been based on fear and magic, not the cultivation of rational recognition. The "nature" of the slave has been degraded by the method of the master.

  ### The Claim of Inheritance vs. The Claim of Nature
  The play complicates the Aristotelian distinction between slavery by nature and slavery by law/convention through the question of the island itself. Caliban's claim ("This island's mine by Sycorax my mother") is a claim of inheritance and property law. Prospero's claim is one of conquest and "civilizing" mission.

  Aristotle tries to separate these. He argues that even if a man is enslaved by war, if he is naturally free, the enslavement is unjust. But he offers no practical way to tell the difference. *The Tempest* dramatizes this impossibility. Prospero conflates the two: he treats Caliban as a natural slave (incapable of self-rule) to justify what is actually a colonial seizure (taking the island from Sycorax's heir).

  The "demolition" happens when we realize Prospero cannot prove Caliban's natural servitude without referencing the very force he claims to transcend. Prospero punishes Caliban with cramps and pinches for the attempted assault on Miranda. This moves the justification from "natural incapacity" to "criminal punishment." But a criminal is a moral agent responsible for his actions. You cannot punish a "living tool." A hammer does not go to jail for breaking a window. By punishing Caliban, Prospero implicitly admits Caliban has the moral agency of a free man, undermining the premise of his natural slavery.

  ### What the Play Shows That Argument Cannot
  This brings us to the constraint: what does the play reveal that the *Politics* cannot?

  Aristotle's argument is static; it attempts to categorize souls. Drama is temporal; it shows the *cost* of maintaining the category. The play demonstrates that the "natural slave" is not a discovered fact but a produced condition.

  In the *Politics*, the master is self-sufficient; he uses the slave to secure leisure for the good life. In *The Tempest*, Prospero is not self-sufficient. He is obsessed with Caliban. He spends more energy monitoring, punishing, and defining Caliban than he does on his own philosophy or return to Milan. The "master" is psychologically dependent on the "slave" to sustain his identity as a master. If Caliban were truly a natural slave (a mere tool), Prospero would not fear him. The fear Prospero feels ("we must prepare / To meet with Caliban") admits an equality of threat.

  Furthermore, the play exposes the emotional residue of the theory. Aristotle speaks of virtue and benefit in the abstract. Shakespeare shows us the resentment. When Caliban says, "You taught me language; and my profit on't / Is, I know how to curse," he identifies the specific violence of the Aristotelian bargain. The "benefit" of reason is that it allows the slave to articulate his own oppression. The tool that talks back ceases to be a tool.

  ### Conclusion: The Survival of the Doctrine
  Does the theory survive? Partially. The play ends with Caliban chastised ("I'll be wise hereafter, / And seek for grace"), returning to servitude. Shakespeare does not liberate him. This suggests the *political reality* of slavery is harder to break than the *philosophical definition*.

  However, the ending validates your psychological critique. Caliban returns to service not because he has realized his natural lack of reason, but because he has been overpowered. The distinction between natural and legal slavery remains unresolved in the text, which is the point.

  The play shows that the doctrine of natural slavery requires a continuous act of will by the master to sustain. Argument alone (Aristotle) tries to make the hierarchy look like a fact of nature. Drama (Shakespeare) shows it is a relationship of force that must be constantly reenacted. The "demolition" is not that Caliban walks away free, but that the audience sees Prospero sweating to keep him bound. The fault line you identified—the attribution of reason to the irrational—is not just a logical error in Aristotle; it is a source of terror for Prospero. He must deny Caliban's reason to justify his rule, but he must acknowledge Caliban's reason to fear his rebellion.

  The play proves that you cannot have a "thinking tool." Once the tool thinks, the master is no longer a master, but a jailer. And a jailer, unlike an Aristotelian master, is not living the good life. He is living in fear. That is what the argument misses, and what the stage reveals.
