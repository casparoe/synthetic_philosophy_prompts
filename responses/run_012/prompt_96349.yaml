answer: |-
  The implicit theory of self operating in standard asylum adjudication is what we might call the **Unitary Narrative Self**. This model presupposes a Lockean continuity of consciousness where memory functions as an archival storage system, accessible by a rational, stable agent who can retrieve events linearly and integrate them into a cohesive whole. Under this view, the self is not merely the *author* of the story but is *verified* by the story's structural integrity; truth is mapped onto logical consistency, and deception is mapped onto contradiction. This aligns closely with Dennett's "center of narrative gravity" or a MacIntyrean unity of life, where personhood is constituted by the ability to render one's history intelligible to others.

  Regarding your distinction between what the practice *strictly needs* versus what it *merely fits with*: strictly speaking, the adjudication system only needs a reliable **epistemic heuristic** for distinguishing truth from falsehood under conditions of uncertainty. It needs a correlation between honesty and consistency, not a metaphysical commitment that the self *is* a narrative. However, the practice *fits* with—and effectively enforces—a constitutive narrative ontology. By penalizing fragmentation, the system moves beyond using the story as evidence (a fit) to treating the *capacity to narrate coherently* as a condition of recognition (a need). The system does not need the applicant to possess a unified self to have suffered persecution, but it needs the applicant to *perform* a unified self to be granted protection.

  This generates the tension you identified between narrative as a **regulative abstraction** and narrative as a **possessed property**. As adjudicators, we posit narrative coherence as a regulative ideal to make sense of another's experience (an abstraction we impose). However, the legal framework demands the applicant actually possess the cognitive architecture to produce this coherence (a property they must hold). When trauma disrupts memory consolidation—causing loops, gaps, or sensory fragments rather than linear plots—the applicant fails to possess the required property. The system then treats the failure of *narrative performance* as a failure of *factual truth*, conflating the map with the territory. It treats the abstraction (the coherent story) as if it were the ontological ground of the claimant's credibility.

  If we replaced this with a view of the self as **fragmented, multiple, or situationally constructed** (akin to a Humean bundle theory or a trauma-informed post-structuralist view), the adjudication process would shift from evaluating *consistency* to evaluating *plausibility of fragmentation*. Concrete changes would include:
  1.  **Evidentiary Weight:** Testimony would be treated as a "trace" of events rather than a "record," shifting the burden toward country conditions and corroborating evidence rather than internal chronology.
  2.  **Interview Structure:** Adjudicators would look for consistency in *core claims* (e.g., "I was threatened") rather than *peripheral details* (e.g., "What date was it?"), acknowledging that trauma fixes sensory details while dissolving temporal markers.
  3.  **Identity Verification:** Recognition would not depend on the applicant proving they are a stable, continuous agent, but rather on proving that the fragmentation itself is consistent with the alleged persecution (e.g., accepting that a tortured subject may not have a single, linear story).
  4.  **Risk:** The downside is that without the heuristic of consistency, adjudication becomes highly subjective, potentially relying more on the adjudicator's empathy than standardized rules, which could introduce new biases.

  Summary: Asylum adjudication conflates the evidentiary heuristic of narrative coherence with the metaphysical condition of personhood, thereby excluding trauma victims whose fragmented selves fail to perform the unity the law requires for recognition.
