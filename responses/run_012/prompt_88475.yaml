answer: |-
  Gödel's argument does not derive the unreality of time from our world's geometry; it rests on the modal claim that if time cannot be objective in one physically possible world, it cannot be objective in any. The geometry alone proves nothing about our universe. The conclusion rests on metaphysical premises about necessity and definition.

  Distinguishing your three claims:

  1.  **No single global present:** Special Relativity establishes this. Gödel's solution adds nothing here.
  2.  **No objective passage or becoming:** The rotating solution supports this *within the model*. Because Closed Timelike Curves allow return to the past, no consistent global "before/after" ordering exists. To extend this to *our* world, Gödel requires a **modal premise**: the nature of time must be invariant across all worlds consistent with the laws of nature. If time were an objective feature of reality, it could not disappear simply because matter is distributed differently.
  3.  **Time is unreal:** The solution does not support this directly. This follows only with a **definitional premise**: that "real time" necessitates objective passage or a global linear order. If one adopts a "block universe" view (where time is real as a static dimension), the argument fails.

  Regarding your difficulties: The CTCs do more than relativize simultaneity; they invalidate causal ordering entirely. However, their relevance to *our* world rests wholly on the modal premise. Gödel argues that since the laws of nature (General Relativity) permit a universe without objective time, objective time cannot be a fundamental feature of reality governed by those laws.

  Your second intuition is correct: the argument is largely a reductio of the conception that time requires objective lapse. It demonstrates that General Relativity is compatible with worlds lacking such lapse, suggesting lapse is not fundamental to physical reality. If you define time as measurable change within a block, Gödel proves nothing. If you define it as objective flowing, Gödel shows such flow is incompatible with the laws governing matter, and thus illusory.

  Ultimately, the geometry supports the impossibility of global ordering in that specific model. The philosophical conclusion requires the extra steps that physical possibility constrains metaphysical necessity, and that real time demands global linearity.
