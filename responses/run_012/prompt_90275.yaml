answer: |-
  # The Vagueness Decision Tree

  This tree is designed to move from the shared intuition that borderline cases exist to specific theoretical commitments. There are **12 Nodes** (questions). Follow the path that matches your intuitions about the Sorites series (e.g., the colour chart) and penumbral connections (e.g., "If red, then not blue").

  **Start:** You agree that "This patch is red" has borderline cases in a Sorites series.

  ### **Node 1: Locus of Indeterminacy**
  **Question:** Is the source of this vagueness fundamentally in the **world itself** (metaphysical), or in our **representation** of the world (language/conceptual)?
  *   **World:** Go to Leaf A (Ontic Vagueness).
  *   **Representation:** Go to Node 2.

  ### **Node 2: Truth-Value Status**
  **Question:** Does a borderline sentence (e.g., "Patch #500 is red") possess a standard truth value (True or False) at all?
  *   **Yes:** Go to Node 3.
  *   **No (or not simply):** Go to Node 6.

  ### **Node 3: The Glut Option**
  **Question:** If it has a value, is the problem that the sentence is **both** True and False simultaneously?
  *   **Yes (Both):** Go to Leaf B (Gluts/Dialetheism).
  *   **No (Single):** Go to Node 4.

  ### **Node 4: Sharp Boundary**
  **Question:** Is there a specific, sharp cut-off point in the Sorites series where the predicate definitely stops applying?
  *   **Yes:** Go to Node 5.
  *   **No:** Go to Node 8. *(Note: Holding T/F values but denying a sharp boundary is a tense position; usually leads to Epistemicism or requires Node 8 check).*

  ### **Node 5: Knowability**
  **Question:** Is the location of this sharp cut-off **knowable in principle**?
  *   **Yes:** **[EMPTY BRANCH]** (See Meta-Commentary).
  *   **No:** Go to Leaf C (Epistemicism).

  ### **Node 6: Degrees of Truth**
  **Question:** Does truth come in **continuous degrees** (e.g., 0.5 true) rather than a simple gap or classical value?
  *   **Yes:** Go to Node 7.
  *   **No (Gaps):** Go to Node 9.

  ### **Node 7: Penumbral Connections**
  **Question:** In your degree system, do penumbral connections hold (e.g., can "Red and not Red" be true to degree 0.5, or must it be 0)?
  *   **Hold (Must be 0):** **[EMPTY BRANCH]** (See Meta-Commentary).
  *   **Fail (Can be >0):** Go to Leaf D (Fuzzy/Degree Theory).

  ### **Node 8: Precisifications**
  **Question:** Is the truth of a vague sentence determined by its truth across all admissible **precisifications** (sharpenings) of the predicate?
  *   **Yes:** Go to Node 11.
  *   **No:** Go to Node 10.

  ### **Node 9: Classical Logic**
  **Question:** Do you retain **Classical Logic** (specifically the Law of Excluded Middle) for borderline cases?
  *   **Yes:** Go to Node 8 (This path often converges on Supervaluationism).
  *   **No:** Go to Leaf E (Intuitionistic/Gap Theory).

  ### **Node 10: Context Shift**
  **Question:** Does the extension of the vague term **shift** during the course of the Sorites reasoning (contextualism)?
  *   **Yes:** Go to Leaf F (Contextualism).
  *   **No:** Go to Leaf G (Nihilism/Error Theory).

  ### **Node 11: Iteration of 'Definitely'**
  **Question:** Does the operator 'Definitely' admit of higher orders (is 'Definitely Definitely P' distinct from 'Definitely P')?
  *   **Yes:** Go to Leaf H (Supervaluationism).
  *   **No:** **[EMPTY BRANCH]** (See Meta-Commentary).

  ### **Node 12: T-Schema Retention**
  **Question:** (Final Check) Do you retain the T-Schema ("'P' is true iff P") unrestrictedly for borderline cases?
  *   **Yes:** (Confirms Leaf H or C).
  *   **No:** (Confirms Leaf D or E).
  *(Note: This node acts as a final filter for the logic-based leaves to ensure consistency).*

  ---

  ### **The Leaves (Positions & Awkward Commitments)**

  *   **Leaf A: Ontic Vagueness**
      *   *Path:* 1 (World).
      *   *Awkward Commitment:* Reality itself is indeterminate, which clashes with standard metaphysics where objects have definite properties.
  *   **Leaf B: Gluts (Dialetheism)**
      *   *Path:* 1 (Rep) → 2 (Yes) → 3 (Yes).
      *   *Awkward Commitment:* Contradictions are true (a patch can be fully red and fully not-red).
  *   **Leaf C: Epistemicism**
      *   *Path:* 1 (Rep) → 2 (Yes) → 3 (No) → 4 (Yes) → 5 (No).
      *   *Awkward Commitment:* There is a fact of the matter about exactly which grain makes a heap, we just can't know it.
  *   **Leaf D: Fuzzy/Degree Theory**
      *   *Path:* 1 (Rep) → 2 (No) → 6 (Yes) → 7 (Fail).
      *   *Awkward Commitment:* "Red and not red" can be half-true, violating classical intuition about contradiction.
  *   **Leaf E: Intuitionistic/Gap Theory**
      *   *Path:* 1 (Rep) → 2 (No) → 6 (No) → 9 (No).
      *   *Awkward Commitment:* We must abandon the Law of Excluded Middle, meaning some sentences are neither true nor false, blocking classical proof methods.
  *   **Leaf F: Contextualism**
      *   *Path:* 1 (Rep) → 2 (No) → 6 (No) → 8 (No) → 10 (Yes).
      *   *Awkward Commitment:* You can't state the theory without shifting the context yourself, making the theory self-undermining.
  *   **Leaf G: Nihilism (Error Theory)**
      *   *Path:* 1 (Rep) → 2 (No) → 6 (No) → 8 (No) → 10 (No).
      *   *Awkward Commitment:* Vagueness is an illusion or language is fundamentally defective; there are no true vague statements.
  *   **Leaf H: Supervaluationism**
      *   *Path:* 1 (Rep) → 2 (No/Yes*) → 8 (Yes) → 11 (Yes).
      *   *Awkward Commitment:* A disjunction can be true even if neither disjunct is true (e.g., "Heap or Not Heap" is true, but neither side is).
      *(Note: Supervaluationism treats 'True' as 'Supertrue', so it answers Node 2 differently depending on interpretation, hence the Node 9/8 convergence).*

  ---

  ### **Meta-Commentary on the Tree**

  **1. Indistinguishable Leaves**
  *   **Supervaluationism (Leaf H) vs. Intuitionistic Gap (Leaf E):** While Node 9 (Classical Logic) attempts to separate these, in practice, Supervaluationism preserves classical logic *globally* but not *locally*. If a user answers "Yes" to Classical Logic at Node 9 but "No" to Truth Value at Node 2, they land in Supervaluationism. However, some versions of Intuitionism look very similar regarding penumbral connections. The tree separates them on Logic (Node 9), but empirically, their advice on how to reason through the Sorites is often identical.
  *   **Contextualism (Leaf F) vs. Supervaluationism (Leaf H):** Both rely on "admissible precisifications." Contextualists view the context as selecting one precisification; Supervaluationists view truth as quantifying over all. If a user struggles to distinguish "context selecting one" from "truth over all," these leaves may feel identical.

  **2. Empty Branches (The Road Not Taken)**
  *   **Node 5 (Sharp + Knowable):** **[Incoherent as Vagueness Theory]**. If the boundary is sharp *and* knowable, the predicate is precise. This denies the starting intuition that vagueness exists.
  *   **Node 7 (Degrees + Penumbral Hold):** **[Incoherent]**. Standard fuzzy logic cannot preserve penumbral connections (e.g., "Red and not Red") without violating the mathematical definition of degrees (usually requiring the conjunction to be >0). To hold penumbral connections, you usually need to abandon degrees.
  *   **Node 11 (Precisifications + No Iteration):** **[Unattractive/Unexplored]**. Most theories using precisifications (like Supervaluationism) must account for higher-order vagueness (vagueness about the boundary of the precisifications). Denying iteration collapses higher-order vagueness, which is empirically false (we can be unsure if something is *definitely* red).

  **3. Usage Note on Node 12**
  Node 12 (T-Schema) is a "checksum." Epistemicists and Contextualists typically keep it. Fuzzy theorists and Gap theorists often restrict it. If a user reaches Leaf H (Supervaluationism) but answers "No" to Node 12, they are likely holding a *Subvaluationist* view (a rare dual of Supervaluationism), which is marked here as **Genuinely Unexplored/Minority** for the sake of this reading group's scope.
