      We once considered extending equal concern to every client and every stakeholder. We rejected this as a category error. A client is not everyone. A firm that treats clients as though they were has misunderstood what a client is. Graded obligation is not favoritism; it is the recognition that love and duty must have a center to radiate from.

      I am hurt that anyone would question our character. We are not trying to save money or avoid liability. We are trying to live correctly. We are trying to ensure that when you leave this building, you are not merely richer, but more fully constituted.

      Let us restore harmony before the retreat.

