      SUBJECT: On Structure and Care

      Colleagues,

      The last quarter has been difficult. I hear the conversations in the breakrooms and the silence in the hallways. There is a sense that something has broken between us. I write this not to correct the record, but to remind us of the ground beneath our feet.

      When we founded Marsh & Elder, we made a deliberate choice to reject the standard compliance manual. Rules are technologies for strangers. They assume a world of detached individuals who need external constraints to prevent harm. We do not believe you are detached. You are constituted by your relations here. You are not a private self wearing a job title like a costume; you are the sum of your obligations to this firm, to our clients, and to each other. To govern ourselves by rigid rules would be to admit we are strangers. Instead, we govern by ritual propriety. Form is not empty ceremony; it is the technology by which relations become real and durable.

