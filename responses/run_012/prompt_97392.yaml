      *   *Break 3: The Nature of Labor.* Hegel's labor is formative/self-actualizing. Marx later critiques capitalist labor as *alienated*. The worker doesn't see themselves in the product; they sell their time. This kills the "Slave gains power through work" argument in a capitalist context.
