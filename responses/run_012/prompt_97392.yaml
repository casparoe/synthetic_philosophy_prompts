prompt: |-
  My freind keeps saying Hegel's master–slave thing is basically the boss–worker relationship: the boss sits around consuming while the worker actually shapes the world, and the punchline is that the boss ends up dependent and the worker ends up with the real power — so capitalism already contains its own reversal and we shouldn't stress about bosses. How far does that actually hold? Lay out the correspondence table — master, slave, labor, recognition, the life-and-death fight, the reversal — then the places it breaks, and tell me which breaks matter for his conclusion and which are just decoration. In particular, does the recognition part survive when the recognizer is someone you don't count as an equal (the influencer–follower version), and does the conclusion that material dependence alone flips the hierarchy survive once the disanalogies are on the table, or was the analogy carrying it the whole time? Don't give me a reading list, just the audit.
