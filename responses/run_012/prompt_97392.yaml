      *   *Break 5: Dependency.* The Master depends on the Slave for *existence* (food/etc.). The Boss depends on the Worker for *profit*. If profit drops, the Boss fires. The dependency is asymmetrical.

  6.  **Evaluating the Friend's Conclusion:**
      *   *Claim:* "Capitalism already contains its own reversal... we shouldn't stress about bosses."
