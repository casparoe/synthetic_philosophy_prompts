answer: |-
  You are not losing your mind, and Ana is half right but for the wrong reasons. What happened to your team is a textbook demonstration of why social choice theory is a depressing field of study. In the first vote, you encountered what is called the center squeeze effect. Offline mode was the consensus candidate, preferred by a majority over every other option in head-to-head matchups, but because it lacked passionate first-place support, Instant Runoff Voting eliminated it immediately. IRV is designed to find a majority winner, not necessarily a consensus winner, and it punishes compromise options that everyone likes moderately but no one loves intensely. In the second vote, you encountered a violation of the independence of irrelevant alternatives. By adding a option that everyone knew was going to lose, you changed the order of elimination, which altered the flow of transferred votes and allowed the compromise candidate to survive long enough to win. This is not a bug in your poll tool, it is a mathematical feature of ranked systems. Kenneth Arrow proved decades ago that no ranked voting system can satisfy all fairness criteria simultaneously, so Ana is correct that the system is imperfect, but incorrect to call it a scam. It is simply trading one type of fairness for another.

  Ana's proposal to switch to score voting is actually a very strong suggestion for your specific context, though it is not a magic wand. Score voting, where people rate options from zero to five, avoids the elimination paradoxes you just suffered because it captures intensity of preference. In your first vote, the five people who voted for payments likely felt strongly about it, while the three who voted for offline mode might have felt moderately about it, but under IRV that intensity is flattened into a single rank. Score voting would have allowed the offline supporters to give offline mode a five and payments a three, reflecting that they prefer offline but don't hate payments. This usually elects the candidate with the highest total utility rather than the one with the most passionate minority support. However, score voting introduces its own vulnerability to strategic voting, where users might give their favorite a five and everything else a zero to maximize impact. In a fourteen-person team where everyone knows each other, this kind of gaming is socially costly and less likely to happen than in an anonymous public election, making score voting a viable fix for your internal process. Her suggestion to let the CTO pick is also technically a valid voting method called dictatorship, which satisfies all mathematical consistency criteria because there is only one voter, but it destroys team buy-in and ignores the distributed knowledge your engineers hold about the codebase.

  For your next quarterly planning session, you should not rely on a raw vote to make the decision for you. At fourteen people, you are small enough to use voting as a temperature check rather than a binding mechanism. The goal of the vote should be to surface disagreements so you can talk about them, not to avoid talking. I recommend you adopt score voting for the internal roadmap because it handles compromise candidates like offline mode much better than IRV, but you must pair it with a discussion phase. Run the score vote anonymously, share the results, and then discuss the outliers. If payments gets high scores from sales and low scores from engineering, that is a conversation you need to have regardless of the math. If offline mode gets moderate scores from everyone, that confirms it is a consensus build. This approach respects the math while acknowledging that roadmap decisions are about resource allocation and risk, not just preference aggregation. It also mitigates the feeling of unfairness because everyone sees the intensity of feeling, not just the order of preference.

  Regarding the survey widget you need to ship in six weeks, you are in a tougher spot because you cannot control your customers' behavior or expectations. The industry standard for ranked choice voting is Instant Runoff Voting, and if you ship something else while calling it ranked choice, you will face support tickets and confusion. You should ship IRV because that is what the market expects, but you must be honest in your documentation. You cannot promise a fair outcome because fairness is mathematically undefined in this context. Instead of claiming the widget ensures the will of the people, document that the method prioritizes majority support over consensus and can be sensitive to the number of options presented. A single honest sentence in your docs should state that while this method ensures the winner has broad support, it may not always select the option that wins in head-to-head comparisons against all others. This protects your team from liability and educates your users. If you want to be innovative, offer score voting as a separate method option alongside ranked choice, allowing customers to choose the trade-off they prefer, but do not try to fix the math inside the IRV algorithm itself.

  The break in the system is not in your code, it is in the expectation that a group decision can be perfectly distilled into a single winner without loss of information. Every method costs you something. IRV costs you consensus candidates. Score voting costs you resistance to strategic exaggeration. Dictatorship costs you team morale. For a national election, you prioritize preventing coercion and ensuring broad legitimacy, but for a thirteen-person roadmap decision, you should prioritize information aggregation and team cohesion. The cost of getting the math wrong is low compared to the cost of building the wrong feature or having your team feel unheard. So for the internal team, switch to score voting and talk about the results. For the product, ship standard IRV but document the limitation clearly. This lets you solve your immediate pain without overpromising to your customers, and it gives you a concrete example to share with your users about why understanding their voting method matters.
