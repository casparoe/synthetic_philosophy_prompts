prompt: |-
  I'm a backend engineer at a 14-person startup and somehow I've ended up running our quarterly what-do-we-build-next vote, and the last one is still bugging me. Thirteen of us ranked three options: rewrite the payments flow (P), build offline mode (O), ship the mobile app (M). Five people put P first, O second, M third. Five put M first, O second, P third. Three put O first, P second, M third. Our poll tool does the usual instant-runoff thing where it drops whoever has the fewest first-place votes and moves those votes to the next name on the ballot, so O got eliminated in round one with three votes, those went to P, and P won eight to M's five. Then Ana pointed out that O beats P head to head eight to five, and beats M eight to five as well, so the option a majority preferred to both of the others got thrown out in the first round. A week later we re-ran it with a fourth option added, spending the quarter on reliability and on-call cleanup (R). The two people who get paged at 3am moved R to the top and bumped mobile to last, since killing the pages was the only part of the mobile work they cared about; everyone else's ballot was identical to before. This time R got eliminated first and its two votes went to O, then M got eliminated and its three votes also went to O, and O won. So an option that eleven of us ranked dead last changed the winner from P to O. And here's what really makes me feel like I'm losing my mind: nobody's view of P versus O changed between the two polls, the same eight people preferred O to P both times, but P won the first time and O won the second.

  Ana's read is that ranked choice is a scam, and she definately wants us to switch to score voting, where everyone rates each option from 0 to 5 and we add up the totals, and if I won't do that she says we should just let the CTO pick, because at least nobody can game a dictatorship. I don't buy either one but I can't say why, and I have no philosophy or econ background so every argument I make sounds like vibes. What I actually want from you is: what is going on in that vote, is Ana's diagnosis right, do her two fixes solve the problem or just relocate it, and what should we do next quarter. I'm suspicious that the real answer is some version of "every method is broken," and if that's true I want to understand exactly where the break is and what it costs me, not just be told it's impossible.

  The other reason I care is that we're a survey tool and I'm supposed to ship a ranked-choice poll widget to customers in six weeks, so whatever I learn here has to turn into a spec, or at minimum one honest sentence in the docs about what the widget can and can't promise. Concretely: is there a counting method we could ship and defend as fair, or is every one of them vulnerable to the same thing that just happened to us, and if the honest answer involves trading off different things people mean by fair, tell me which of those things is actually worth caring about for a thirteen-person roadmap decision, because I doubt we need the same answer as a national election. Please write it as normal prose paragraphs, no headings, no bullets, no bold, no tables, I'm reading this on my phone over lunch, and don't just recite the theory at me, tell me what to do.
