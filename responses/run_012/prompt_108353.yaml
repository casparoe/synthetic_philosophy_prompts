      *   Address the "weeping statue" comparison. The key difference is empirical evidence (scans) vs. subjective observation.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Recommendation:* Run with conditions.
      *   *Reasoning:* We have medical records. That distinguishes it from the statue. But we cannot validate the supernatural.
      *   *Hume/Testimony:* The user asked to address this. Hume argues against violating laws of nature. But spontaneous remission doesn't violate laws of nature; it's just rare. So Hume's strict veto doesn't apply to the *medical fact*, only to the *religious attribution*.
      *   *Policy:* Needs to be reusable.
      *   *Competitor:* Don't let them dictate our standards.

  6.  **Review against Constraints:**
      *   No preface? Check.
      *   Recommendation in first line? Check.
      *   Settle story (run/hold/conditions)? Check.
