prompt: |-
  I run the monthly "philosophy for clinicians" session at our hospital and next month its my turn: epistemic injustice. Audience is about fifteen emergency-medicine residents, most of whom signed up because a friend did and are braced for soft HR stuff. Fifty minutes, no slides, whiteboard only. Don't explain the topic to me -- I know it -- plan how I should teach it. I want to hang the whole thing on a case of my own instead of the courtroom example everyone reaches for: an interpreter-mediated encounter where a patient's pain gets quietly downgraded in the chart across a handoff, and nobody in the chain feels they did anything wrong. What I need from you: the order the pieces have to come in so that the word "injustice" doesn't land as an accusation before they've seen the mechanism; the point where the two kinds have to split -- the one where somebody's word gets discounted and the one where the experience itself has no shared name to be reported in; the misconceptions they'll bring or form and exactly where in the sequence I head each one off -- I'm expecting "this is just bias training," "the fix is more empathy," and "hermeneutical injustice means she literally had no words," which I'm fairly sure is a misreading; and one question at the end that tells me whether they got the mechanism or just felt bad. Also tell me what to cut at this level and say so out loud. Give me the response as: The order (the sequence and what depends on what, ~300 words), The carrying case (why mine works and what it's missing, ~150), Misconception map (each one, where I kill it, ~300), The check (the question plus what a good and a bad answer look like, ~100), and Left on the table (a few lines).
