answer: |-
  Your intuition is spot on, and you have hit upon one of the most famous critiques of decision theory's application to real life. You are quite right to be sceptical. While I.J. Good's 1967 theorem is mathematically sound within its own framework, it relies on a set of rather sterile assumptions that often do not hold in the messy business of human experience.

  To understand why your whodunit example does not technically refute the theorem—but rather sits comfortably outside its scope—we must look at what the theorem is actually claiming and, more importantly, what it quietly leaves out.

  ### The Gist of Good's Theorem

  In short, Good's theorem states that for a rational agent, the expected utility of obtaining free information is always greater than or equal to the expected utility of acting without it. The logic is straightforward: once you have the information, you can choose the best action for that specific situation. If the information suggests you should have done what you originally planned, you simply do that. Therefore, you can never do worse than you would have without the info; at worst, you break even, and at best, you improve your outcome.

  However, for this logic to hold, the theorem relies on several critical assumptions that your mystery novel example violates.

  ### The Quiet Assumptions

  **1. Information is Costless**
  Good's theorem assumes the information is 'free'. This doesn't just mean free of monetary cost; it means free of time, effort, and psychological burden. In the real world, gathering information takes time (opportunity cost) and can cause anxiety. If the cost of acquiring the info outweighs the benefit of making a slightly better decision, the net value is negative.

  **2. The Agent is a Perfect Expected-Utility Maximiser**
  The theorem assumes you are a cold, calculating machine. You update your beliefs strictly according to Bayes' rule and you never suffer from 'analysis paralysis'. A human might receive information, become confused or overwhelmed, and make a *worse* decision due to cognitive overload. Good's agent does not suffer from confusion.

  **3. Utility is Independent of Information (The Crucial Point)**
  This is where your whodunit example strikes home. Good's theorem assumes that the value of an outcome is fixed, regardless of what you know beforehand.
  *   **In the theorem:** If I choose to invest in a stock, the payoff is the money I make. Whether I knew the stock would rise or not, the money is worth the same to me. The information is purely *instrumental*; it helps me navigate the world to get the prize.
  *   **In your example:** The 'prize' is the experience of reading the book. The value of that experience is *intrinsically* tied to your state of ignorance. The suspense is not a tool to get to the end; the suspense is the product itself.

  In decision-theory speak, your utility function is **state-dependent**. The utility of 'finishing the book' changes depending on the state of 'knowing the murderer'. Good's theorem assumes the utility of outcomes is stable.

  ### Does the Mystery Refute the Theorem?

  Strictly speaking, no. Your example does not refute the theorem; it highlights its boundary conditions.

  Good's theorem is a statement about **instrumental rationality**. It concerns using information to manipulate the external world to achieve a goal. It works beautifully for a gambler deciding whether to place a bet, or a doctor deciding on a treatment. In those cases, knowing the truth helps you align your actions with reality to secure a fixed reward.

  Your mystery novel scenario is about **consumptive experience**. Here, the information does not help you secure an outcome; it alters the nature of the outcome itself. When you learn the spoiler, you have not just acquired a tool to help you read; you have fundamentally changed the activity from 'solving a puzzle' to 'confirming a fact'.

  Because the value of reading the book depends on whether you already know the ending, the pre-condition of stable utility is broken. The theorem simply does not apply to situations where the act of knowing changes the value of the thing known.

  ### A Matter of Perspective

  One could argue that a truly 'rational' agent, in the Good sense, would anticipate this. If the agent knows that knowing the spoiler reduces the total enjoyment of the book, the rational choice is to decline the information in the first place. Good's theorem says that *given* you are going to make a decision, more info is better. It does not necessarily forbid you from avoiding info if you know it will corrupt your utility function.

  However, your point about 'un-knowing' is vital. Good's theorem assumes you can ignore information. But as you noted, you cannot un-know a spoiler. Once the information is received, the utility landscape shifts permanently. The option to 'ignore it and act as before' is illusory because you cannot act as before; you are no longer the same ignorant reader you were five minutes ago.

  ### Conclusion

  You are right to distrust the idea that more information is always better. Good's theorem is a powerful result within the narrow confines of decision theory, where agents are perfect calculators and outcomes have fixed values.

  Your whodunit example demonstrates that in human life, information is not always a tool; sometimes, it is the environment itself. Ignorance can be a prerequisite for enjoyment, and in those cases, the 'value' of information is genuinely negative. The theorem isn't wrong, but it is incomplete. It describes a world of gamblers and investors, not a world of readers and lovers, where the journey matters more than the destination.
