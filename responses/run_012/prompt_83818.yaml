  **Flagged Indistinguishable Leaves**
  The **Assurance View** and the **Reliance View** are flagged as difficult to separate. Both locate the source of bindingness in the promisee's state (expectation vs. reliance), and in many concrete cases, expectation leads to reliance. The tree separates them based on the *Silent Non-performance* case (was a wrong done without reliance?), but a proponent of Reliance might argue that expectation *is* a form of psychological reliance, collapsing the distinction.

  The **Self-Legislation/Normative-Power View** and the **Joint-Commitment View** are flagged as potentially collapsing. Both deny that social practice is constitutive and both bind without uptake. The distinction rests on whether the power is individual or shared, but in a bilateral promise, the exercise of individual power often looks indistinguishable from joint commitment in practice.

  **Unoccupied Branches**
  The tree leaves unoccupied the combination of **Directed Duty** + **External Discretion** + **Secret Promise Bound** + **Defeasible by Balance**. This view would hold that promises are owed to others, not dependent on social practice, binding even in secret, but breakable if utility dictates. This combination is coherent but unattractive because it combines the stringency of a directed duty with the flexibility of consequentialism, risking instability in the concept of "obligation." It is largely unexplored because it sacrifices the security promises are meant to provide.

  The combination of **Undirected Duty** + **Distinctive Reason** + **Deflationary Source** is incoherent. One cannot claim a resolution creates a *new* reason while simultaneously claiming it only highlights *ordinary* reasons. This branch is empty by definition.

  **Statement of Uncertainty**
  I am least confident in the branch question regarding the **Secret Promise** ("If no one knows you promised, are you still bound?"). This question assumes a clear distinction between "social uptake" and "binding force," but some Practice Views argue that the practice binds internally even without external knowledge, while some Will Views argue that communication is a necessary condition of the act itself. Evidence that would settle this is a consensus on whether a promise written in a diary and never shown to anyone constitutes a promise at all, or merely a resolution. If intuitive judgment splits evenly here, the branch fails to discriminate between Practice and Will views effectively.
