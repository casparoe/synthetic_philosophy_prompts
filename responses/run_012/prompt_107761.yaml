      *   *Key Argument:* The "Cassette-Tape Hypothesis" (Stalinesque vs. Orwellian). It's more parsimonious to assume the brain constructs the narrative *at* waking based on fragments, rather than assuming a full-blown hallucinatory movie played during sleep. Dreams are "pseudo-memories" inserted upon waking.

