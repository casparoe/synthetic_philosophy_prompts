answer: |-
  Here is a reconstruction of the implicit theory of the Truth Commission (TC), followed by an analysis of its consistency, its vulnerabilities, and the specific test case you proposed.

  ### I. The Implicit Theory of the Practice

  To defend the institution, you must articulate the moral ontology that makes the exchange (speech for freedom) intelligible rather than corrupt. The design presupposes the following five commitments:

  **1. Theory of Harm: The Dual Injury**
  The practice presupposes that political violence inflicts two distinct injuries. The **primary injury** is the physical or material harm (death, torture, dispossession). The **secondary injury** is the *erasure* of the victim from the moral and political community through denial, secrecy, or official silence.
  *   **Requirement:** The institution strictly requires the claim that unacknowledged violence is a *distinct and continuing injury*. If the harm ends at the moment of death, the commission is merely an archive. The design treats the *denial* as a continuing act of aggression by the state/perpetrator against the survivor.
  *   **Right vs. Interest:** It presupposes truth is a **right owed to the survivor**, not merely a community interest. If it were only a community interest, the state could trade the victim's truth for stability without giving the victim standing (reparations, hearings). The fact that victims receive administrative standing and their objections are recorded implies the state recognizes a debt *to them*, not just to the public record. However, the fact that their objections do not *veto* amnesty suggests this right is limited to *recognition*, not *retribution*.

  **2. Theory of Blame: Quality of Will**
  The exchange rate (speech buys freedom, regardless of deed severity) is incompatible with an act-focused (retributive) view of responsibility. In a retributive framework, the magnitude of the deed sets the deserved punishment; remorse is merely a mitigating factor, never a nullifier.
  *   **Requirement:** The practice requires a **Quality of Will** theory (or an expressivist view). Blameworthiness tracks the agent's current attitude toward the moral order. A perpetrator who denies the crime asserts a continuing hostility to the values of the community; a perpetrator who confesses realigns themselves with those values.
  *   **The Logic:** By confessing, the perpetrator ceases to be an *enemy* of the new order and becomes a *witness* for it. The amnesty is not a pardon for the act, but a recognition that the *moral threat* posed by the agent has been neutralized by their speech. The "currency" is speech because speech is the only act that can reverse the secondary injury (denial).

  **3. Authority to Forgive: The Public Claim**
  The design resolves the problem of victim consent by distinguishing between the private claim and the public claim.
  *   **Requirement:** It presupposes that grave political crimes are offenses against the **Political Order** (the *Res Publica*), not just the individual. Therefore, the authority to punish belongs to the sovereign community.
  *   **Trusteeship:** The state acts as a trustee. It holds the victim's claim in trust but retains the discretion to waive the *public* right to punish in exchange for the *public* good of truth and stability. It does not require the concept of interpersonal "forgiveness." It operates on **Pardon**. The victim's lack of veto confirms that the transaction is political (State vs. Perpetrator), not civil (Victim vs. Perpetrator).

  **4. Collective Action: Systemic vs. Private Agency**
  The distinction between "political crimes" (eligible) and "ordinary crimes" (ineligible) presupposes a specific view of agency.
  *   **Requirement:** It assumes that individuals acting in the name of a movement or state are **agents of a collective wrong**. Their guilt is shared with the system that authorized them. Therefore, the settlement can be group-to-group (the new State settling with the agents of the old State).
  *   **The Follower:** The perpetrator who followed orders is treated as a node in a network. Their confession is valuable not because they were the primary author of the evil, but because they reveal the *structure* of the evil. Ordinary criminals act for private ends; their crimes do not reveal a systemic rot that requires a systemic truth-telling remedy.

  **5. Epistemology: Narrative Truth vs. Adjudicative Truth**
  The commission's findings become the "authoritative account." This presupposes that legal proof (beyond reasonable doubt, specific to a defendant) is insufficient for historical repair.
  *   **Requirement:** It assumes the State can and must author a **Narrative Truth** that is distinct from Legal Truth. Legal truth is binary (guilty/not guilty); historical truth is gradational and contextual. The institution assumes that for non-repetition to work, the community needs a *story* it can accept, not just a list of convictions. It prioritizes *coherence* and *acknowledgment* over *adjudicative precision*.

  ---

  ### II. Consistency and Underdetermination

  **Consistency:**
  The tension you feel (speech-for-freedom vs. gravity of crimes) is real, but the design resolves it by prioritizing **Future Peace** and **Moral Realignment** over **Retributive Desert**.
  *   *Consistent:* If the goal is to dismantle a system of denial, then speech is the only tool that works. Punishment silences; amnesty speaks.
  *   *Inconsistent:* If the goal is justice for the victim, the design fails. It sacrifices the victim's right to retribution for the community's right to truth. The parts are consistent only if you accept that the "secondary injury" (denial) is more damaging to the *future polity* than the "primary injury" (impunity) is to the *past victim*.

  **Underdetermination (Who can sign the statute?):**
  *   **The Consequentialist:** Signs easily. Truth prevents civil war; amnesty buys peace. The moral cost is a necessary expense.
  *   **The Restorative Theorist:** Signs easily. Healing relationships requires truth; punishment often obstructs reintegration.
  *   **The Skeptic (Your Friend):** Signs cynically. It is a political bargain. They accept the statute not because it is *just*, but because it is *feasible*.
  *   **The Retributivist:** **Cannot sign** without contradiction. Unless they adopt the "Quality of Will" view (that confession changes the moral status of the agent), they must view the amnesty as a second injustice.
  *   **Load-Bearing Features:** The "Speech > Deed" ratio is the most load-bearing. If you remove conditional amnesty, it becomes a judicial inquiry. The "Political Crime" distinction is also load-bearing; without it, the state is simply failing to prosecute murder.

  ---

  ### III. The Friend's Challenge: If the Theory is Wrong

  Your friend argues: *There is no distinct wrong in unacknowledged violence; the wrong is the killing. The state cannot forgive on the victim's behalf. What is owed is punishment.*

  If your friend is right, the Truth Commission design collapses. Here is what survives and what must change:

  **1. Load-Bearing Features that Break:**
  *   **Conditional Amnesty:** This must go. If punishment is the debt, it cannot be waived for speech.
  *   **Speech as Currency:** Confession becomes merely evidence, not a moral realignment.
  *   **Non-Veto for Victims:** If the crime is against the person, the person (or their kin) must hold the veto over settlement, or the state must prosecute regardless of their wish.

  **2. The Surviving Features:**
  *   **The Investigative Mandate:** The state still needs to know what happened to prevent recurrence.
  *   **Reparations:** Administrative payments survive, but reclassified as *state liability* for failing to protect, not as a trade for amnesty.
  *   **The Authoritative Account:** The state still needs a history, but it must be built on convictions, not just testimony.

  **3. The Redesigned Practice (The "Punishment First" Model):**
  Under your friend's view, the institution becomes a **Special Prosecutorial Unit with a Public Inquiry Division**.
  *   **Process:** Perpetrators are prosecuted. Confession leads to sentence *reduction* (as in ordinary law), not immunity.
  *   **Truth:** The "authoritative account" is the aggregate of court judgments.
  *   **Victims:** Victims retain the right to sue for damages (tort) independently of the state's reparations.
  *   **Cost:** This model risks non-cooperation. Perpetrators will not talk if speech leads to prison. The "truth" will be thinner. Your friend must accept that a just society may remain ignorant of its past to maintain its moral purity.

  ---

  ### IV. The Variant Test: The Mandatory Hearing

  **The Variant:** Amnesty is secured by written disclosure. The perpetrator must then attend a public hearing where survivors question him. His amnesty is secure regardless of his performance.

  **What this tells us about Justice:**
  This variant reveals that the institution is committed to **Recognition**, not just **Information**.
  *   If the goal were only *evidence* (the Friend's view of the bargain), the hearing is superfluous. The written file secures the truth.
  *   By insisting on the hearing, the designers admit that justice requires an **interpersonal encounter**. The victim must be restored to the status of a *questioner* (an agent), and the perpetrator must be reduced to the status of a *respondent* (accountable).

  **Who survives better: You or your Friend?**
  **You do.** Here is why:

  Your friend argues the practice is "decoration on an ordinary political bargain." A bargain is transactional: *I give X, you give Y.* In the standard TC, X=Truth, Y=Freedom.
  In this variant, the transaction is complete *before* the hearing (Disclosure secured Amnesty). The hearing adds no legal value.
  *   **The Friend's Interpretation:** The hearing is gratuitous theater. It is "decoration" in the literal sense. It allows the victim to scream while the killer walks, which the Friend sees as cruel or hypocritical. It confirms his view that the institution is morally confused—trying to have the appearance of justice (the hearing) without the substance (punishment).
  *   **Your Interpretation:** The hearing proves that the institution recognizes a **non-transactional good**. It admits that "Truth" is not just data in a file; it is a social relationship. The hearing is the *repair of the secondary injury*. It restores the victim's standing as a moral equal who can demand an account.
  *   **The Verdict:** The variant saves your theory from the charge that it is *merely* a bargain. It shows the designers believe something happens in that room that is not political trading. However, it sharpens your friend's critique on the *impunity* point: if the victim gets recognition but no justice, is recognition enough?
  *   **Why you win the reconstruction:** If the Friend were right that it is *only* a bargain, a rational designer would cut the hearing to save money and reduce risk. The fact that the design *insists* on this costly, risky, evidentiary-useless step proves the institution is committed to a moral theory (Restorative/Expressive) that your friend denies exists. The Friend calls it decoration; the design calls it essential. The design's persistence suggests the Friend is missing the "something real" you suspected: the restoration of **agency** to the victim.

  **Summary for your next argument:**
  Tell your friend: "If this were just a bargain for information, we wouldn't force the perpetrators to sit in a room and be questioned after the deal is done. We do it because the injury wasn't just the killing; it was the silencing. The hearing breaks the silence. You call that decoration; I call it the only part of the process that treats the victim as a person rather than a corpse."
