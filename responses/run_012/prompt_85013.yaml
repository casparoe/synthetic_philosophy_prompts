      Subject: Thoughts on your Wittgenstein commitments

      Hi there,

      This is a sophisticated set of commitments and you have navigated many of the standard pitfalls quite well, particularly regarding species realism and the private language argument. However, there are tensions here that need addressing before you present them, and I will walk through them from the most severe to the least severe along with the cheapest fix for each.

      The most significant conflict lies between your commitment to meaning is use and rule following being grounded in social custom versus your commitment to linguistics where understanding a sentence is a computational process over structured representations. Wittgenstein is famously hostile to the idea that a mental process or mechanism explains meaning, arguing that positing a calculation in the head merely pushes the question back since the calculation itself needs interpretation. If you claim compositional semantics is the literal truth about competence, you risk positing the very kind of hidden mechanism Wittgenstein argues cannot constitute meaning. The cheapest fix here is to treat the computational model as a causal explanation of the psychological machinery that subserves use, while maintaining that the normativity of meaning is constituted solely by the public practice. You can keep the linguistics by saying it describes how we process, but not what meaning is.

      The second most severe tension is between your claim that meaning is social all the way down and your intuition that a single speaker can be right while the community is wrong. If norms are internal to a shared practice, it is difficult to see how an individual stands outside that practice to judge it correctly. This looks like a direct contradiction unless you clarify the temporality of use. The cheapest fix is to distinguish between established use and initiatory use. When an expert introduces a technical term, they are proposing a new practice that relies on the potential agreement of the community rather than current consensus. The individual is correct relative to the trajectory of the practice they are trying to establish, not against the existing norm, which preserves the social nature of meaning without sacrificing the possibility of correction.

      The third tension involves family resemblance concepts versus compositional semantics. Compositionality often assumes stable meanings that combine predictably, while family resemblance suggests fluid boundaries. This is less severe because many modern semantic theories handle context sensitivity well. The cheapest fix is to adopt a view where syntax is compositional but semantic value is determined pragmatically by use in context, allowing fuzzy concepts to plug into structured representations without requiring rigid definitions.

      Regarding your question on which single change would clean up the most, I recommend modifying your commitment to the computational model. If you soften the claim that compositional semantics is the right model of linguistic competence in a way that equates competence with meaning, you dissolve the biggest philosophical friction. By framing the computational work as merely the causal engine that allows us to participate in the form of life, rather than the source of meaning itself, you align your linguistics with your Wittgensteinism. This allows you to keep the technical utility of semantics for your work without contradicting the normative claim that meaning is use grounded in social practice.

      Hope this helps for the seminar.

      Best wishes

