answer: |-
  **JOINT PROTOCOL FOR ADVERSARIAL COLLABORATION ON CAUSAL ONTOLOGY**
  **Date:** October 26, 2023
  **Parties:** Proponent of Interventionist Account (PI); Proponent of Counterfactual Dependence Account (PC).
  **Facilitator:** Departmental Adjudicator.

  ### I. JOINT COMMITMENTS AND REJECTIONS

  We, the undersigned, agree to the following positive and negative claims. These claims are intended to distinguish our shared position from Regularity (Humean) theories and mere probabilistic correlation. We agree that any adequate theory of causation must satisfy these constraints.

  1.  **Rejection of Regularity:** We jointly reject the claim that causation is reducible to constant conjunction or mere spatiotemporal succession. Regularity is necessary but not sufficient for causation.
  2.  **Rejection of Mere Correlation:** We agree that causal claims imply a dependency relation that distinguishes common-cause structures from direct causal links. Correlation without dependency is not causation.
  3.  **Token-Level Focus:** While we acknowledge type-level generalizations, we agree that the primary ontological burden lies in explaining *actual* (token) causation between specific events or variable instantiations.
  4.  **Asymmetry and Irreflexivity:** We agree that the causal relation is asymmetric (if C causes E, E does not cause C) and irreflexive (C does not cause itself).
  5.  **Dependency Core:** We agree that causation involves a form of dependency. Specifically: $C$ causes $E$ only if $E$ depends on $C$ in some relevant sense (whether defined by intervention or world-similarity).
  6.  **Modularity:** We agree that causal systems possess a modular structure. It must be possible to alter one causal mechanism without necessarily altering others (the principle of independent manipulability).

  ### II. TABLE OF REMAINING DISAGREEMENTS

  The following table isolates the specific points of divergence. We have phrased these claims to avoid strawmanning; each side accepts the phrasing in their respective column as a accurate representation of their commitment.

  | Feature | Interventionist Commitment (PI) | Counterfactualist Commitment (PC) |
  | :--- | :--- | :--- |
  | **Metaphysical Ground** | Causation is constituted by invariance under possible interventions. The truth of causal claims is fixed by the structural relations between variables. | Causation is constituted by counterfactual dependence between events. The truth of causal claims is fixed by similarity relations between possible worlds. |
  | **Status of Interventions** | Interventions (actual or hypothetical) are constitutive of the causal relation. To be a cause is to be a potential handle. | Interventions are merely epistemic tools for testing dependence. The metaphysics rests on the similarity of worlds, not manipulability. |
  | **Omissions/Absences** | Absences can be genuine causes if an intervention on the absence (producing the presence) changes the effect. | Absences are at best "quasi-causes." Genuine causation requires positive events/processes; treating absences as causes leads to promiscuity. |
  | **Preemption Handling** | Preemption is resolved via Structural Equations. The backup cause is set to its actual value; the primary cause shows dependence. | Preemption is resolved via chains of dependence or "influence." We must trace the intrinsic process from cause to effect to break the tie. |
  | **Backtracking** | Backtracking counterfactuals are false by definition. An intervention on $C$ holds ancestors of $C$ fixed. | Backtracking counterfactuals may be true depending on the similarity metric. If the past is more similar with a different cause, the counterfactual holds. |

  ### III. CRUXES AND TEST CASES

  We identify the following specific cases as the "stress tests" for our respective theories. We agree that these are the loci where our predictions diverge. For each case, we pre-register our verdicts. Settling the verdict on these cases via intuition pumping or empirical consensus will force a theoretical revision for at least one party.

  **Crux 1: The Status of Omissions**
  *   **Case:** A gardener fails to water a plant; the plant dies. A neighbor (who had no duty) also fails to water it; the plant dies.
  *   **Question:** Is the gardener's omission a cause? Is the neighbor's omission a cause?
  *   **PI Prediction:** Gardener = Cause. Neighbor = Cause (if modeled as a variable capable of intervention). Causal status is invariant; "blame" is pragmatic.
  *   **PC Prediction:** Gardener = Cause (contextually salient). Neighbor = Non-Cause (lack of salient process). Causal status is sensitive to contextual constraints on eventhood.
  *   **Stakes:** If omissions are causes, PC must accept promiscuity or contextual metaphysics. If omissions are not causes, PI must restrict the definition of "variable."

  **Crux 2: Late Preemption (The "Suicide Pill" Case)**
  *   **Case:** Assassin A shoots Victim. Assassin B was ready to shoot if A failed. A shoots; V dies. B does not shoot.
  *   **Question:** Does A's shooting cause V's death, given that if A hadn't shot, B would have, and V would still have died?
  *   **PI Prediction:** Yes. In the structural model, setting $A=0$ (intervention) while holding $B$'s mechanism fixed at its *actual* value (not firing) results in $V=0$ (survival).
  *   **PC Prediction:** Yes, but via a chain of stepwise dependence (A shoots $\rightarrow$ bullet travels $\rightarrow$ death) or "influence." Simple counterfactual dependence fails ($\sim A \not\rightarrow \sim V$), so we must rely on intrinsic processes.
  *   **Stakes:** If stepwise dependence fails (e.g., in trumping preemption where no intermediate process exists), PC theory collapses or requires ad-hoc fixes. PI theory holds via equations.

  **Crux 3: Double Prevention**
  *   **Case:** A pillar holds up a roof. A kick knocks the pillar away. The roof falls.
  *   **Question:** Did the kick *cause* the roof to fall, or did it merely *allow* it to fall?
  *   **PI Prediction:** Yes, Cause. Intervention on the kick (preventing it) prevents the fall. Invariance holds.
  *   **PC Prediction:** Contested. Some Lewisians accept this; strict process theorists reject it. PC leans toward "Allowing" unless a positive energy transfer is identified.
  *   **Stakes:** Distinguishes causation as "production" (PC lean) vs. causation as "difference-making" (PI lean).

  ### IV. ADJUDICATOR'S ASSESSMENT: VERBAL VS. SUBSTANTIVE

  **1. The "Bookkeeping" Thesis**
  *Claim to Settle:* "The Interventionist is really just a Counterfactualist with extra bookkeeping, and structural-equations machinery is a modelling convenience rather than a competing account of what causation is."

  *Ruling:* **False.** This claim is rejected by the formal semantics of both positions.

  *Reasoning:*
  It is not merely a notational difference. The disagreement lies in the **truth conditions of the counterfactuals themselves**.
  *   **Lewisian Counterfactuals:** Truth is determined by a global similarity metric between possible worlds. This allows for "backtracking" interpretations (if $C$ hadn't happened, perhaps its causes would have been different) depending on the weighting of similarity.
  *   **Interventionist Counterfactuals:** Truth is determined by a "surgical" break in a structural equation. Backtracking is *forbidden* by the definition of the intervention operator ($do(C)$).
  *   **Consequence:** In cases involving common causes or feedback loops, the two semantics yield different truth values for the same counterfactual sentence. Therefore, the Structural Equations are not just bookkeeping; they are a constraint on the semantics of the conditional. The Interventionist is not a Counterfactualist with extra steps; they are a Counterfactualist with *different truth conditions*.

  **2. The Verbal Residue**
  There is a verbal component to the dispute regarding the word "cause" in ordinary language.
  *   **Verbal:** Ordinary usage of "cause" conflates *difference-making* (Interventionist) with *physical production* (Counterfactual/Process). Both parties agree that ordinary language is messy here.
  *   **Substantive:** The non-verbal residue is the ontological question: **Is causation fundamentally about *dependencies* (which can include absences and double preventions) or about *processes/connections* (which require positive events)?**
      *   If the universe is fundamentally a web of dependencies, PI is right.
      *   If the universe is fundamentally a web of conserved quantities/processes, PC is right.

  ### V. REQUIRED SIGNATURES

  By signing below, we acknowledge that the "Bookkeeping Thesis" is false because the semantics of the conditionals differ. We acknowledge that the disagreement on Omissions and Preemption is substantive, not merely terminological. We agree to test the predictions in Section III against canonical intuitions and formal constraints.

  _________________________ (Interventionist)
  _________________________ (Counterfactualist)
  _________________________ (Facilitator)
