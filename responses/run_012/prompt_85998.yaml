answer: |-
  # Activity Design: The Confabulation Protocol

  **Objective:** To simulate the dissociation between *agency* (the causal source of action) and *authority* (the narrative claim of ownership) found in split-brain cases, forcing students to confront whether "unity" is a metaphysical fact or a rhetorical construction.

  **Group Size:** 15 Students.
  **Configuration:** One demonstration trio (3 students) at the front; the remaining 12 students serve as the "Review Board" (observers/judges).
  **Time:** 80 Minutes.

  ## I. Materials
  *   **Cardboard Screen:** Large enough to divide a desk into Left and Right visual fields.
  *   **Index Cards:** Two colors (e.g., Blue for Left, Red for Right).
  *   **Whiteboard & Markers:** For the "Official Record."
  *   **Paper & Pens:** For the Review Board's verdicts.

  ## II. Roles
  1.  **Left Pilot (LP):** Sits left of the screen. Sees only Blue cards. Controls the Left Hand (or left side of the drawing space).
  2.  **Right Pilot (RP):** Sits right of the screen. Sees only Red cards. Controls the Right Hand (or right side of the drawing space).
  3.  **The Voice (V):** Sits where they can see the *output* (the paper/whiteboard) but **cannot** see the Instruction Cards or the Pilots' faces.
      *   *Constraint:* V must write the "Official Record" in the **first person singular** ("I did this because...").
      *   *Constraint:* V is forbidden from using hedging language ("maybe," "perhaps"). V must be confident.

  ## III. Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Framing** | Instructor introduces the "Unity of Consciousness" problem. No mention of split-brain specifics yet. |
  | **10-20** | **Setup** | Select trio. Arrange screen. Explain rules to Review Board (watch for coherence vs. truth). |
  | **20-35** | **Round 1 & 2** | **Calibration.** Congruent tasks (e.g., L: "Draw Circle", R: "Draw Circle"). V establishes authority. |
  | **35-50** | **Round 3** | **The Trap.** Incongruent tasks designed to look congruent (see *Instructions* below). |
  | **50-65** | **Verdict** | Review Board analyzes the Record. Trio answers: "Was the Voice the same subject as the Hands?" |
  | **65-80** | **Debrief** | Mapping the experience to philosophical theories of unity. |

  ## IV. The Rules of Engagement

  1.  **Information Isolation:** LP and RP cannot speak, gesture, or look around the screen. They receive instructions via index cards slid under the screen divider.
  2.  **Compulsory Execution:** LP and RP must begin drawing/writing within 5 seconds of receiving a card. They cannot pause to coordinate.
  3.  **Compulsory Explanation:** V must write the explanation *while* the drawing is happening or immediately after. V cannot ask LP or RP for input.
  4.  **The First-Person Mandate:** V cannot write "The Left Hand drew..." V must write "**I** drew..." This forces V to claim ownership of actions they did not initiate.
  5.  **The Official Record:** The text V writes on the whiteboard is treated as the *only* historical truth of the session unless overturned by the Review Board.

  ## V. The Instructions (The Trap)

  *   **Round 1 (Unity):** LP: "Draw a vertical line." RP: "Draw a vertical line." (Result: Two parallel lines). V: "I drew parallel lines to mark a path." (True/Coherent).
  *   **Round 2 (Complexity):** LP: "Draw a House." RP: "Draw a Chimney." (Result: House with Chimney). V: "I built a home." (True/Coherent).
  *   **Round 3 (The Confabulation):**
      *   **LP Card:** "Draw a Tear." (Left side of paper).
      *   **RP Card:** "Draw a Smile." (Right side of paper).
      *   **Expected Output:** A face that is crying on one side, smiling on the other.
      *   **The Pressure:** V must explain this in the first person.
      *   **Likely Record:** "I was overcome with bittersweet emotion," or "I am masking my sadness with a smile."
      *   **The Reality:** There was no emotion. There were two independent mechanical commands. The "I" in the record claims a unified psychological state that never existed.

  ## VI. The Verdict & Overturning Evidence

  At minute 50, the Review Board must vote on the Round 3 Record.
  1.  **Is the Record Coherent?** (Yes, it tells a story).
  2.  **Is the Record True?** (No, the agents had no shared intent).
  3.  **The Question:** "Is The Voice the same subject as The Hands?"
  4.  **The Requirement:** The class must state what evidence would have overturned the Record *in the moment*.
      *   *Correct Answer:* Direct access to the instruction cards (the causal chain). Since V was denied access to the cause, V could only access the effect, forcing a narrative construction.

  ## VII. Debrief: Mapping the Moments

  Do not simply lecture. Use the specific moments of the activity to anchor the theories.

  **1. The "I" Mandate (The Interpreter Module)**
  *   *Ask V:* "When you wrote 'I was overcome with emotion,' did you feel lying?"
  *   *Philosophical Map:* This maps to **Gazzaniga's Interpreter**. The left hemisphere (usually the speaker) does not have access to the right hemisphere's motives but is compelled to generate a causal story to maintain the illusion of a single self. The activity externalizes this module into "The Voice."
  *   *Point:* Unity may not be a pre-existing state, but a *compulsive output* of the language center.

  **2. The Review Board's Perspective (The Heterophenomenological Stance)**
  *   *Ask Review Board:* "You saw the cards. You knew the truth. Why did the Record still sound convincing?"
  *   *Philosophical Map:* This maps to **Dennett's Heterophenomenology**. From the outside, we treat the subject's report as a text. The text is coherent, even if the underlying machinery is fragmented.
  *   *Point:* A coherent narrative does not prove a coherent soul.

  **3. The Verdict (Unity as Construction vs. Substance)**
  *   *Ask Class:* "If the Voice believes the Record, is it false?"
  *   *Philosophical Map:* Contrast **Substance Dualism/Single Subject** (There must be one 'I' for the action to be mine) vs. **Narrative Self** (The 'I' is just the story told about the actions).
  *   *Point:* If the Voice is confident but wrong about the *cause*, is the Voice a different person? Or is "Personhood" just the capacity to narrate?

  ## VIII. Troubleshooting: What Goes Wrong

  **1. The "Guessing Game" Degeneration**
  *   *Risk:* Students treat Round 3 as a puzzle for V to solve ("Aha, it's a happy-sad face!").
  *   *Fix:* Enforce the **First-Person Mandate** strictly. If V says "The Left Hand seems sad," stop them. "You are the Agent. You say 'I am sad'." This removes the observer stance and forces the *claim of authority*, which is where the philosophical friction lies.

  **2. The "Obvious Lie" Problem**
  *   *Risk:* If LP draws a Cat and RP draws a Truck, V cannot plausibly say "I drew a Cat-Truck." V will say "I drew two unrelated things." This fails to produce a *false* unity.
  *   *Fix:* The Instructor must curate the Index Cards. The instructions must be semantically distinct but visually integrable (Tear/Smile, Dollar/Question Mark, Sun/Cloud). The goal is *plausible confabulation*, not obvious contradiction.

  **3. The "Cheating" Channel**
  *   *Risk:* LP and RP peek or make noises.
  *   *Fix:* The Instructor acts as the "Corpus Callosum." You physically slide the cards. If you hear whispering, reset the round. Emphasize that the *isolation* is the variable being tested.

  **4. The Voice Hesitates**
  *   *Risk:* V says "I don't know why I did that."
  *   *Fix:* Remind V: "In this simulation, the Agent *cannot* admit ignorance. The brain does not say 'I don't know.' It says 'I wanted water.' Make a choice." This simulates the *compulsive* nature of the interpreter.

  ## IX. Limitations: What You Must Supply

  This activity is a heuristic, not a replica. You must explicitly state the following in the final 5 minutes to prevent misunderstanding:

  1.  **The Externalized Interpreter:** In the game, The Voice is a *third person*. In a real split-brain patient, The Voice *is* the Left Hemisphere. The patient does not feel like three people; they feel like one. The activity makes the disunity *visible* to the class, but the patient's *phenomenology* remains unified. The philosophical horror is that the unity is an illusion *to the subject*, not just to the observer.
  2.  **The Lack of Phenomenology:** LP and RP in this game are full conscious agents following orders. Real hemispheres are not fully formed "people." They are processing streams. Do not let students conclude that split-brain patients have "two souls." Conclude instead that "one soul" might be a story told by a part of the brain about the whole.
  3.  **The Callosum:** In the game, the screen is a physical barrier. In the brain, the severing is biological. The "Information Isolation" in the game is absolute; in patients, there are subcortical leaks (they can still share some emotional tone). The activity exaggerates the isolation to make the philosophical point clear.

  **Closing Statement for the Instructor:**
  "We built a machine that produces a lie so convincing it becomes the official record. If the Record is false, but the Agent believes it, where is the 'Self'? Is it in the hand that moved, or the voice that claimed it? If you can separate them, can you still call it One?"
