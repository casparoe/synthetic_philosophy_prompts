answer: |-
  You have put your finger on the central engine of constitutional monarchy, and you are right that standard terms like "convention" or "deterrence" don't quite capture the *fragility* you're describing. A convention explains *that* it happens; it doesn't explain *why* doing it once destroys the mechanism forever.

  There isn't one single perfect word, but political theory and sociology have carved this up into three distinct concepts that overlap in your examples. To give you the "carving" you asked for, we need to separate the **legal mechanism**, the **sociological fuel**, and the **structural paradox**.

  ### 1. The Legal Term: "Reserve Powers"
  In constitutional law, the specific powers you are describing (refusing assent, appointing a PM in a hung parliament) are called **Reserve Powers**.

  *   **What they are:** Powers retained by the head of state that are not exercised on the advice of ministers.
  *   **The Catch:** They are governed by **Constitutional Conventions**.
  *   **Why this label isn't enough:** As you noted, "convention" just means "an unwritten rule." It doesn't explain the *self-destruct* mechanism. It doesn't explain why using the power breaks the convention permanently rather than just setting a new precedent.

  ### 2. The Sociological Term: "Symbolic Capital"
  The French sociologist Pierre Bourdieu has a concept that fits your "mother-in-law" and "monarch" examples perfectly: **Symbolic Capital** (or Symbolic Power).

  *   **The Mechanism:** Symbolic power only works if it is **misrecognized** as something other than raw power. It must look like "duty," "tradition," or "family respect."
  *   **The Paradox:** The moment you *use* it explicitly, you reveal the coercion underneath. You reveal that the King isn't just "signing," he is *vetoing*. You reveal the Mother-in-Law isn't just "advising," she is *commanding*.
  *   **The Result:** Once the coercion is visible, the "symbolic" value evaporates. You are left with raw force, which the Monarch (usually) doesn't have and the Mother-in-Law (socially) isn't allowed to use.
  *   **Why this fits:** It explains why the power dies upon use. Using it converts "Symbolic Capital" into "Political Debt," and the Monarch cannot afford to spend that currency.

  ### 3. The Structural Term: "Constructive Ambiguity"
  For the "choosing a Prime Minister" example, where writing a rule would break the system, the diplomatic term is **Constructive Ambiguity**.

  *   **The Mechanism:** Deliberately leaving a rule vague so that different parties can interpret it in ways that allow them to agree *for now*.
  *   **The Paradox:** If you codify the rule (e.g., "Monarch must pick the largest party"), you remove the Monarch's ability to act as a safety valve in a true crisis (e.g., if the largest party leader is incapacitated or treasonous). If you leave it totally open, you risk tyranny.
  *   **The Edge:** The power exists in the gap between the written law and the practical reality. Filling the gap kills the utility.

  ---

  ### The Carving: Separating Your Examples

  You suspected your examples weren't all the same thing. You are correct. Here is how to separate them based on *what breaks* when the power is used.

  #### Type A: The Existential Veto (The Monarch's Assent)
  *   **Mechanism:** **Self-Abrogating Authority.**
  *   **Why it breaks:** The Monarch's authority rests on being **above politics**. Refusing assent is a **political act**.
  *   **The Carving:** This is the only example where using the power threatens the *existence of the office*. If the King blocks a bill passed by Parliament, he is no longer a constitutional figurehead; he is a rival legislature. The system cannot contain two legislatures. One must go.
  *   **Label:** **Institutional Suicide.**

  #### Type B: The Ambiguous Arbiter (Choosing a PM)
  *   **Mechanism:** **Discretionary Latency.**
  *   **Why it breaks:** This power relies on **uncodified flexibility**.
  *   **The Carving:** This isn't about suicide; it's about **rigidity**. If you write the rule down, you lose the ability to handle exceptions. If you use the discretion too openly, you look partisan.
  *   **Label:** **Calculated Ambiguity.**

  #### Type C: The Invisible Hand (Private Advice)
  *   **Mechanism:** **Plausible Deniability.**
  *   **Why it breaks:** This relies on **secrecy**.
  *   **The Carving:** This is distinct from the others. It's not that the power disappears; it's that the *channel* closes. If the Monarch's warnings are leaked, Ministers will stop telling him the truth, or they will publicly rebut him, forcing him into the open.
  *   **Label:** **Confidential Influence.**

  #### Type D: The Social Deference (The Mother-in-Law)
  *   **Mechanism:** **Status Hierarchy.**
  *   **Why it breaks:** This is **Symbolic Capital** in its purest form.
  *   **The Carving:** The MIL's power comes from the family *voluntarily* yielding to her. If she *demands* yield, she signals that she knows her status is slipping. Demanding respect is the surest way to lose it.
  *   **Label:** **Deference.**

  #### The Outlier: The Union Guy
  *   **Mechanism:** **Deterrence / Bargaining Power.**
  *   **Why this is different:** You suspected this one might not fit. It doesn't.
  *   **The Difference:** A strike is a **weapon**, not a **status**. When a union strikes, they *spend* resources (dues, goodwill), but they do not *dissolve* the union. In fact, successful strikes often *increase* their power (credibility).
  *   **The Test:** If the Union Guy calls a strike and loses, he is weaker. If the King refuses assent and "wins," he is *finished*. The Union Guy is playing a game; the King is holding the board.

  ### The Name You Are Looking For

  If you want a label for the specific phenomenon where **authority relies on non-exercise**, the most precise term from political philosophy is:

  **The Paradox of Sovereignty (in a Constitutional Context)**

  However, if you want a descriptive phrase for the *power itself*, the best fit is:

  **Latent Legitimacy**

  Or, borrowing from the legal theorist H.L.A. Hart who distinguished between rules that impose duties and rules that confer powers:

  **A Self-Negating Prerogative**

  ### Summary of the "Carving"

  1.  **It is not Deterrence:** Deterrence relies on *credibility* (the threat must be believed). Latent Legitimacy relies on *invisibility* (the threat must not be seen).
  2.  **It is not Taboo:** A taboo is broken by disgust. This is broken by *consequence*.
  3.  **It is not Ambiguity alone:** Ambiguity is the tool; **Legitimacy** is the resource being protected.
  4.  **The Boundary:** The line is drawn at **Neutrality**. Any power that requires the holder to remain neutral to function will self-destruct if used to take a side.

  Your intuition about the Mother-in-Law is spot on: she is operating on **Social Deference**, which is a form of Latent Legitimacy. The Union Guy is operating on **Bargaining Power**, which is a form of Deterrence. The Monarch is the only one operating on **Constitutive Authority**—where the power exists to preserve the system, and using it against the system destroys the power.

  The specific "backwards" quality you noticed—where the power is strongest when it is nothing but a rumor—is the defining feature of **Symbolic Power**. It is power that ceases to be symbolic (and thus ceases to work) the moment it becomes explicit.
