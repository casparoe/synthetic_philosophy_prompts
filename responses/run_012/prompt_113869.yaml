  # Decision Tree: Locating the Cost of Solving the Liar

  **Starting Commitment:** The Liar derivation ($L \leftrightarrow \neg T(\ulcorner L \urcorner)$) is valid reasoning. The paradox is not a mistake in the deduction; it is a signal that one of our premises or background assumptions is false. Every solution pays a price. Follow the branches to find which price your view pays.

  ### Node 1: Context Sensitivity
  **Question:** In the step from "L is not true" to "L is true", does the extension of the word 'true' shift (e.g., via context or occasion)?
  *   **YES:** → **Contextualism** (Burge, Simmons, Glanzberg).
      *   *Awkward Commitment:* Truth is indexical, so "This sentence is not true" is true only when uttered in a context distinct from the Liar itself.
  *   **NO:** → Go to Node 2.

  ### Node 2: Structural Rules
  **Question:** Does the derivation fail because it relies on structural rules (like Contraction or Transitivity/Cut) that are invalid for truth-involving inferences?
  *   **YES:** → **Substructuralism** (Shapiro, Beall, Restall).
      *   *Awkward Commitment:* You must reject intuitive logical principles like "If A, then A" implying A, or the transitivity of consequence, in specific truth-theoretic contexts.
  *   **NO:** → Go to Node 3.

  ### Node 3: Semantic Defect
  **Question:** Is the Liar sentence semantically defective (i.e., does it fail to express a proposition or is it ill-formed)?
  *   **YES:** → **Tarski-style Hierarchy**.
      *   *Awkward Commitment:* You cannot state the theory of truth for your own language within your own language; truth is inexpressible.
  *   **NO:** → Go to Node 4.

  ### Node 4: Revision Instability
  **Question:** Does the sentence express a proposition, but its truth value *oscillates* (flips) under rational revision rather than settling?
  *   **YES:** → **Revision Theory** (Gupta, Belnap).
      *   *Awkward Commitment:* Truth is not a static property but a process; some sentences are "truth-tellerish" but never stably true or false.
  *   **NO:** → Go to Node 5.

  ### Node 5: Non-Classical Values
  **Question:** Does the Liar fail to have exactly one classical truth value (i.e., is it a Gap or a Glut)?
  *   **YES:** → Go to Node 6.
  *   **NO:** (It has a classical value, or the problem is purely logical/deflationary) → Go to Node 7.

  ### Node 6: Glut or Gap?
  **Question:** Is the non-classical status a **Glut** (Both True and False) or a **Gap** (Neither True nor False)?
  *   **GLUT:** → **Dialetheism** (Priest).
      *   *Awkward Commitment:* Some contradictions are literally true; the world (or our description of it) is inconsistent.
  *   **GAP:** → Go to Node 8 (The Revenge Test).

  ### Node 7: The Yablo Generalization
  **Question:** If self-reference is removed (using Yablo's infinite chain), does the paradox vanish?
  *   **YES:** → **[UNOCCUPIED]**.
      *   *Status:* **Unattractive/Refuted.** Yablo demonstrated that self-reference is not necessary for the paradox. Blaming self-reference alone leaves you vulnerable to the infinite chain variant.
  *   **NO:** (The logic itself is the problem) → **Deflationism** (Horwich).
      *   *Awkward Commitment:* 'Truth' is not a substantive property but a logical device; the paradox reveals an inconsistency in our *concept* of truth, not the world.

  ### Node 8: The Revenge Test
  **Question:** Having declared the Liar "not true," can you assert that claim in the object language without contradiction (e.g., using "determinately not true")?
  *   **YES:** → **Paracomplete/Field-Style**.
      *   *Awkward Commitment:* You must reject the Law of Excluded Middle ($\phi \vee \neg \phi$) for Liar sentences and adopt a non-classical conditional to validate the T-Schema.
  *   **NO:** (You must ascend to a metalanguage to state the solution) → **Kripke-style Fixed Point**.
      *   *Awkward Commitment:* You cannot express the full solution in the language you are analyzing; the Strengthened Liar ("This sentence is not true or gappy") re-emerges one level up.

  ***

  ### Notes on Collapses and Costs

  **1. The Kripke/Field Distinction:**
  You suspected these might collapse. They occupy the same path through Nodes 1–6 (both are Gappy). They are separated *only* by **Node 8 (Revenge)**.
  *   **Kripke** accepts the gap but lacks the logical resources (a strong conditional/determinate operator) to express "L is gappy" without contradiction in the object language.
  *   **Field** introduces a "determinate truth" operator to express the gap without triggering Revenge.
  *   *Cost:* Field pays a higher logical cost (rejecting Excluded Middle + modifying Conditional) to buy expressive power. Kripke pays a lower logical cost but suffers expressive incompleteness.

  **2. The "Grammar Trick" Friend:**
  Your friend who insists this is "just a trick about grammar" is standing on **Node 3 (Tarski)** or **Node 7 (Horwich)**.
  *   If they mean the sentence is *ill-formed*, they are a **Tarskian**. *Cost:* They must accept that science and semantics require an infinite hierarchy of languages, making natural language semantics impossible to formalize in one system.
  *   If they mean 'truth' isn't a *real predicate*, they are a **Deflationist**. *Cost:* They must explain why 'true' behaves exactly like a substantive property in every other context, only failing here.

  **3. Unoccupied Space:**
  The leaf at **Node 7 (YES)** is unoccupied. Historically, some tried to blame self-reference directly. Yablo's paradox (1993) rendered this position untenable. Any view that lands here has been effectively refuted by the existence of non-self-referential liar chains.
