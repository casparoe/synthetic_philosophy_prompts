      *(Self-Correction on British English)*: Ensure "s" instead of "z" in analyse/organisation, "colour", "programme", "defence". Ensure tone is appropriately reserved and analytical.

      *(Final check on the "Hypothesis")*: The user thinks the disagreement is about the state's role (Threat vs Guarantor). I need to confirm this is the *strongest* explanation but add that it's also about the *nature of the person* (Atomised vs Relational).

      *(Final check on "Progress")*: Don't offer false hope. The "honest verdict" option in the prompt is likely the correct one.

