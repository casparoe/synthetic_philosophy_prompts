  4.  **Diagnose the Impasse (Verbal vs. Substantive vs. Question-Substitution):**
      *   *Verbal:* Yes, "Privacy" means different things. (Seclusion vs. Transparency vs. Reputation).
      *   *Question-Substitution:* Yes. Germany asks "Does this violate dignity?" US asks "Is this abuse of power?" China asks "Does this stabilise order?"
