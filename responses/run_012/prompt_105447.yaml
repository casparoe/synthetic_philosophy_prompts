  - Realistic. A person or an institution, not an urn. Medicine, insurance, engineering, whatever — but no demons, no infinite sequences, no perfectly reliable tests. Both bits of evidence have to be genuinely uncertain (a borderline scan, a noisy gauge reading, a witness you only half-believe), not a definite fact the agent is pretending to be unsure about.
  - Same total evidence in both orders. Same two results, same content, same reliability, just arriving in a different sequence — say two labs reporting back whenever they finish. If the story quietly hands the agent more information in one order, it's cheating and the case is worthless.
  - Make the gap big enough to matter: I want the two orders to land on opposite sides of a decision threshold, so the same evidence in a different order prescribes different treatment (or a different premium, or whatever the decision is). If in a realistic setup you can only get a hair's-breadth difference, say so rather than fudging the numbers.
  - Give me the numbers — explicit prior over the relevant cells, explicit target credences for each update, arithmetic for both orders. I want to check it.

  Then:

  1. The scenario, a paragraph or two.
  2. Both orders worked through, showing the intermediate credences, and flagging the exact point where rigidity is doing the work.
  3. Compare against treating the two results as certain and conditioning on their conjunction. My understanding is that's order-independent, so this should show the divergence comes from the uncertain-evidence treatment rather than from the order of observation — but correct me if I've got that wrong.
  4. What feature is actually generating the divergence. My guess is the correlation between the two propositions: I did a version in my head where the two things were seperate and the two orders seemed to agree, but that was at 1am so dont trust me. Test it properly — change that one feature, hold everything else fixed, report whether the divergence survives.
  5. The honest bit: does this show Jeffrey's rule is broken, or that my agent is misusing it? Give the strongest reply on behalf of someone who thinks the rule is fine here (I assume something like: the two orders aren't the same evidential situation, because in one of them she's already carrying an intermediate credence she can't un-have), and say whether you buy it.

