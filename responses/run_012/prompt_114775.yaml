  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use "Counterfactual = test we didn't run"? Yes.
      *   *Check:* Did I address the "Intrinsic vs Relational" mapping? Yes, Checkpoint vs. Checkpoint+Harness.
