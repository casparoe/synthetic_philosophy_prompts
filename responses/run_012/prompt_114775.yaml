      *   *Refinement on Finks:* In AI, a true fink is rare for static models. But a "Finkish Harness" is common: The harness required to test the capability destroys the capability. E.g., Testing "won't generate malware" by asking "generate malware." If the model is sycophantic, the test *creates* the unsafe behavior that wasn't there under normal usage. That's a fink. The test induces the failure in a model that wouldn't otherwise fail. I should use this example.

