  *(Self-Correction during final output generation)*: Wait, I need to be careful about the "Fink" definition. The user defined it: "side effect of the test itself that changes the thing being tested." For a static checkpoint, the weights don't change. However, the *state* changes (context window). Or, more accurately, the *deployment environment* changes the effective model. I will stick to the user's definition but note where it strains against static checkpoints. Actually, the best AI equivalent of a Fink is when the *monitoring system* intervenes. If I test "Model won't output PII," but I have a regex filter that blocks PII *after* the model generates it but *before* the scorer sees it, the model *did* generate it, but the test says it didn't. That's a mask. A fink would be if the act of running the eval fine-tunes the model. Okay, I'll stick to the "Sycophancy/Jailbreak" angle as a Fink: The test prompt *itself* alters the model's effective policy distribution in a way that removes the disposition temporarily. No, that's just context. Let's go with the "Middleware Fink": A safety layer that detects an eval run and patches the output. That changes the "thing being tested" (the system) during the test.

