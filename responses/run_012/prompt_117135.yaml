      *   *Requirement for Dampening:* The probability of being in a sim must correlate with the *efficacy* of the action. E.g., Sims cannot affect the base reality's long-term future. So, Longtermist actions only work in the 10% Base Reality case, while Near-term actions work in both (or work differently).
      *   *Refinement:* Actually, near-term actions also only affect the sim's future if we are in a sim. So the constant factor objection is very strong. To save the thesis, one must argue that the *variance* or *tail thickness* is reduced inside sims. Maybe sims are shut down before astronomical value is created.

