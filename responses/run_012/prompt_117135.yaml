      *   *Self-Undermining:* If SH leads to "optimize for Basers," that's still fanaticism. So SH doesn't kill fanaticism; it shifts the target.

  6.  **Constructing the "Rankings Unchanged" Case:**
      *   Scenario: We are in a simulation. The simulation is computationally cheap to run forward. The simulators do not intervene. The causal structure inside the sim is identical to base reality. The "far future" inside the sim is just as long and valuable (phenomenologically) as base reality.
      *   Result: $EV(\text{Action}) = P(\text{Sim}) \times EV_{\text{sim}} + P(\text{Base}) \times EV_{\text{base}}$. If $EV_{\text{sim}} \approx EV_{\text{base}}$, then the weighting doesn't change rankings.

