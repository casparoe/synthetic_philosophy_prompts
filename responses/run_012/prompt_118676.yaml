answer: |-
  **Correspondence Table**

  | Phlogiston Case | Folk Psychology Case |
  | :--- | :--- |
  | **Phlogiston** | Belief / Desire (Propositional Attitudes) |
  | **Combustion / Calcination Data** | Everyday Behavioral Prediction / Explanation |
  | **Phlogiston Theory** | Folk Psychology (as a theoretical framework) |
  | **Oxygen / Lavoisier's Chemistry** | Completed Neuroscience / Cognitive Science |
  | **Elimination of Phlogiston** | Elimination of Belief / Desire |

  **Where the Mapping Breaks**
  1.  **Theory vs. Practice:** Phlogiston was a posited entity within a formal scientific theory. Folk Psychology (FP) is arguably a practical skill or simulation capacity, not a tacit theory (the "Theory-Theory" dispute).
  2.  **Empirical Success:** Phlogiston theory was degenerating (e.g., phlogiston had negative weight). FP is empirically robust and indispensable for social coordination; it lacks systematic anomalies.
  3.  **Normativity:** FP is inherently normative (constraints of rationality), whereas chemistry is descriptive. You cannot eliminate norms without losing the phenomenon itself.

  **Quietly Imported Historical Features**
  The analogy imports the **crisis narrative** of the chemical revolution. Phlogiston was abandoned because specific data (weight gain during calcination) contradicted its core laws. FP faces no comparable falsification; its "data" (behavior) remains consistent with belief-talk. The transition also assumes **incommensurability**: that neural states cannot map onto belief states. However, unlike phlogiston (which referred to nothing), belief may refer to functional neural structures, much like "heat" refers to mean kinetic energy.

  **Elimination vs. Reduction**
  Once disanalogies are visible, **reduction** survives better than elimination. Because FP is successful and stable, it resembles "heat" (reduced to molecular motion) rather than "phlogiston" (eliminated). Elimination requires showing the ontology is empty; the analogy fails to prove neural states cannot realize belief states.

  **Better Analogy**
  The **"Heat" analogy** carries the weight better for realists: heat was not eliminated but reduced to a more fundamental ontology. For eliminativists, the **"Witch" analogy** is stronger (posits eliminated due to lack of causal power), but it mismatches FP's utility.

  Verdict: carries only the weaker claim — it establishes FP is a fallible framework, but not that its ontology is empty given FP's empirical success compared to phlogiston theory.
