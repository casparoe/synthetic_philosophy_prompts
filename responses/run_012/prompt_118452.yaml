prompt: |-
  Hey, I'm a third-year phil student doing a philosophy of science unit — we've done underdetermination and the Duhem–Quine stuff already, so you don't need to explain to me what underdetermination is. I want to ask about a pattern I keep noticing that I dont think is quite the same thing, and I want to know whether it has a name. Take the role of a philosopher of science who knows this literature well, think it through carefully, maybe brainstorm a few candidate concepts before you commit, and please don't just hand me a label — I care way more about where the edges of the thing are and what it isn't.

  Here's what I keep seeing. Whenever a lecturer says two theories are 'equally well supported by all the evidence' or 'observationally equivalent', the claim always seems to hold only relative to a prior decision about what counts as evidence in the first place. Change that decision — decide that some quantity is directly measurable rather than merely inferred, or take a coarser-grained description of the outcomes — and the two theories quietly stop looking equivalent. Two cases: Ptolemaic vs Copernican astronomy gets called observationally equivalent, but that seems to depend on treating naked-eye positions as the observation base; and in a psych seminar two models of the same choice data were called equivalent only because we'd already fixed which choices counted as the 'same' option.

  So: is there an established name for this — for the equivalence (or underdetermination) being an artifact of where you draw the line between what's observed and what's inferred? If it's really just Duhem–Quine holism or conventionalism, say so and explain why, but it feels more specific than that: it isn't that any hypothesis can be rescued, it's that the very claim of equivalence has a hidden parameter. And if there's no name for it, coin one and define it, including what it's not.
