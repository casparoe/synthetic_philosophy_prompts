answer: |-
  This is a sharp observation, and you are right to feel that it sits adjacent to, but distinct from, the standard Duhem–Quine or Underdetermination of Theory by Evidence (UTE) discussions. You have identified a structural vulnerability in how claims of **Empirical Equivalence (EE)** are generated.

  In the literature, there isn't a single "Proper Noun" thesis for this (like "The Duhem–Quine Thesis"), but it is a recognized problem that surfaces in debates about scientific realism, the observation/theory distinction, and modeling.

  Let's think through the candidates, rule out the ones that don't fit, and locate the precise conceptual home for what you're seeing.

  ### 1. Ruling out the usual suspects

  **Why it isn't Duhem–Quine Holism:**
  Duhem–Quine is about *falsification*. It says you cannot test a hypothesis in isolation because it relies on auxiliary assumptions. If a prediction fails, you can save the core hypothesis by tweaking an auxiliary.
  *Your pattern* is about *equivalence*. It says two theories look the same *because* we have agreed to ignore certain distinctions in the data. Duhem–Quine is defensive (saving a theory from refutation); your pattern is constitutive (defining the terms of comparison).

  **Why it isn't Standard Underdetermination (UTE):**
  Standard UTE assumes a fixed body of evidence $E$ and asks if multiple theories $T_1, T_2$ entail $E$.
  *Your pattern* notices that $E$ is not fixed. $E$ is a function of a methodological decision $M$ (what counts as a measurement, what counts as a distinct outcome). So the relation isn't $T_1, T_2 \vdash E$, it's $T_1, T_2 \vdash E(M)$. If you change $M$, the equivalence vanishes. Standard UTE treats the "evidence base" as a given; you are noticing it is a *parameter*.

  **Why it isn't just "Theory-Ladenness" (Hanson/Kuhn):**
  Theory-ladenness suggests that what we *see* is influenced by what we *believe*. While related, your point is more procedural. It's not that the Copernican *sees* different stars than the Ptolemaic; it's that the scientific community has *stipulated* that naked-eye position is the only admissible data for the sake of the comparison. That's a methodological boundary, not necessarily a perceptual one.

  ### 2. The Best Conceptual Fits

  There are two places in the philosophy of science literature where this specific mechanism is formalized.

  #### A. The Suppesian "Data Model"
  The most rigorous home for your intuition is the work of **Patrick Suppes** (specifically his 1962 paper "Models of Data"). Suppes argued that theories do not confront the world directly. They confront **Data Models**.

  1.  **Experimental Setup:** The physical apparatus.
  2.  **Data Model:** A mathematical structure describing the *results* of the experiment (e.g., a set of coordinates, a probability distribution over choices). This involves idealization, error correction, and *granularity*.
  3.  **Theoretical Model:** The abstract laws (e.g., Newton's laws, Utility maximization).

  **The Fit:** When a lecturer says Ptolemy and Copernicus are observationally equivalent, they are saying the **Theoretical Models** map to the same **Data Model** (naked-eye positions). When you introduce parallax or reaction times, you are changing the **Data Model**.
  *   **The Concept:** Empirical equivalence is not a relation between two theories; it is a relation between two theories *relative to a specific Data Model*.
  *   **The Name:** In this literature, this is often called the **"Relativity of Empirical Equivalence to the Data Model."**

  #### B. "Identification" in the Special Sciences
  In econometrics, psychometrics, and systems biology, this is a technical problem called **Identification**.
  A model is "identified" if its parameters can be uniquely inferred from the data. If two different parameter sets (or structures) produce the exact same probability distribution over the *observed* variables, the model is "unidentified" (or the structures are observationally equivalent).
  *   **The Fit:** Your psych example is a classic identification problem. If you only observe *choices*, Model A and Model B are unidentified relative to each other. If you observe *choices + reaction times*, the model becomes identified.
  *   **The Name:** Philosophers of the special sciences (like **Clark Glymour** in *Theory and Evidence*) discuss this as the **"Problem of Identification."** Glymour explicitly argues that underdetermination is solved by finding new "independent pathways" of evidence—i.e., changing what counts as observable.

  ### 3. So, is there a name?

  If you need a label to use in an essay, the most accurate existing phrase is **"The Context-Dependence of Empirical Equivalence."**

  However, if you want to coin a term that captures the specific *mechanism* you noticed (the drawing of the line between observed and inferred), I would suggest:

  **"The Underdetermination of the Observation Base"**
  or
  **"Observation-Base Relativity"**

  This distinguishes it from the Underdetermination of *Theory*. Here, it is the *Evidence* that is underdetermined by the methodological conventions.

  ### 4. Mapping the Edges (What it is and isn't)

  To use this concept rigorously, you need to know where it stops. Here is the boundary work:

  **1. It is not about Future Technology (Laudan & Leplin)**
  Laudan and Leplin (1991) argued that empirical equivalence is usually *transient* because new instruments (like telescopes) eventually break the tie.
  *   **Your Point:** It's not just that new tools *will* come along. It's that the claim of equivalence *right now* depends on a decision to *exclude* available inferential data.
  *   **Edge:** If the lecturer says, "We can't measure parallax yet," that's Laudan/Leplin. If the lecturer says, "We define the theory's domain as naked-eye data," that's **Observation-Base Relativity**.

  **2. It is not about Auxiliary Hypotheses (Duhem)**
  *   **Your Point:** You aren't changing an auxiliary hypothesis to save a theory. You are changing the *description of the outcome*.
  *   **Edge:** If I say "The instrument was miscalibrated" to explain away a discrepancy, that's Duhem. If I say "We treat 'miscalibrated' and 'calibrated' readings as the same data point for this model," that's **Observation-Base Relativity**.

  **3. It is not Constructive Empiricism (Van Fraassen)**
  Van Fraassen defines "observable" based on human sensory limits (a modal notion).
  *   **Your Point:** You are noticing that "observable" is often a *pragmatic* or *conventional* limit, not a biological one. In the psych case, reaction times *are* observable, but the modeler chose to ignore them.
  *   **Edge:** Van Fraassen says "We can't observe electrons." You are saying "We *could* observe process data, but we decided to model only choice data."

  ### 5. Summary for your Unit

  You have identified that claims of **Empirical Equivalence** often hide a third relatum.
  Standard view: $Theory_A \equiv Theory_B$
  Your view: $Theory_A \equiv_{DataModel} Theory_B$

  If you want to discuss this with your lecturer, the strongest philosophical anchor is **Patrick Suppes' hierarchy of models**. You can argue that the equivalence claim holds at the level of the *Data Model*, but dissolves if the Data Model is refined (increased granularity).

  If you need a label, **"The Relativity of Empirical Equivalence"** is the standard philosophical phrasing, but **"The Underdetermination of the Data Model"** captures your specific insight about the "hidden parameter" of what counts as evidence.

  **One final caution:** Be careful not to conflate this with **Incommensurability** (Kuhn/Feyerabend). Incommensurability says the theories are *too different* to compare. Your point is that they are *too similar* to distinguish, but only because we have artificially constrained the comparison. It is the inverse problem.

  **Verdict:** You've spotted a genuine gap in how introductory units present Underdetermination. They present Evidence as a solid floor; you've noticed it's a adjustable platform. Stick with the **Suppes/Data Model** framing—it's the most robust way to formalize that intuition.
