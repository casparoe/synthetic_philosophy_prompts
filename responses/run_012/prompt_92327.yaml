prompt: |-
  A guy in my discord server who reads all the same blogs I do tried to sum up the whole "infinite ethics" thing for me and I want to know how much of it to beleive. His version: "If the universe is spatially infinite then there are infinitely many people, and since any arrangement of matter will occur somewhere, every possible person exists infinitely many times over. So the total good and the total bad in the world are both infinite, and infinity is infinity, so no outcome is better or worse than any other — which means ethics just breaks down and trying to make things better is a category error." I've got a nagging feeling this is mashing together a few different things and that the last jump doesn't survive. Can you go through it claim by claim: what someone who actually works on infinite populations would nod at, what they'd wince at, what's just wrong, and whether the "ethics collapses" bit follows from anything that's actually been shown. And please keep separate what's fairly settled in that literature from what people who genuinely know it still fight about — don't hand me one camp's position dressed up as the consensus.
reasoning: |-
