answer: |-
  ### The Principle: Reference-Dependent Cumulative Utility with Bracketing and Ruin Constraints

  To reproduce your verdicts, you cannot rely on a single static utility function. You require a procedural rule that adjusts based on context (personal vs. fiduciary), framing (single vs. aggregate), and magnitude. I propose the following principle, which I will call **RDWU-BR** (Reference-Dependent Weighted Utility with Bracketing and Ruin constraints).

  #### The Algorithm
  To evaluate a choice, apply these steps in order:

  1.  **The Ruin Veto (Fiduciary Check):**
      *   If choosing for a pool of capital (e.g., charity, business) rather than personal consumption: Calculate the probability of total loss ("ruin").
      *   If $P(\text{ruin}) > 5\%$ (or your specific threshold), **reject** the option immediately, regardless of Expected Value (EV).
      *   *If not a fiduciary choice, proceed to Step 2.*

  2.  **Bracketing (Aggregation Check):**
      *   Determine if the gamble is perceived as a **standalone event** or as part of a **portfolio/series**.
      *   **Standalone:** Evaluate the single outcome distribution.
      *   **Portfolio:** If multiple independent bets are presented together, or if you can mentally aggregate them (e.g., "I make many decisions like this"), calculate the distribution of the *sum* of outcomes. Use the Central Limit Theorem to approximate the aggregate mean and variance.

  3.  **Reference Coding:**
      *   Set a reference point (usually current status quo).
      *   Code all outcomes as **Gains** ($x > 0$) or **Losses** ($x < 0$) relative to this point.

  4.  **Valuation (The Value Function):**
      *   Apply a value function $v(x)$ to each outcome:
          *   For Gains: $v(x) = x^\alpha$ (where $0 < \alpha < 1$, concave).
          *   For Losses: $v(x) = -\lambda |x|^\beta$ (where $0 < \beta < 1$, convex).
          *   **Loss Aversion Parameter ($\lambda$):** $\lambda$ is not constant. It decreases as the magnitude of stakes increases. For small stakes (e.g., $100), $\lambda \approx 2.5$. For large stakes (e.g., $10,000+), $\lambda \approx 1.1$.

  5.  **Probability Weighting:**
      *   Transform objective probabilities $p$ into decision weights $\pi(p)$ using an inverse-S function:
          *   **Small probabilities ($p < 0.05$):** Overweight significantly ($\pi(p) \gg p$).
          *   **Moderate/High probabilities ($p > 0.10$):** Underweight slightly ($\pi(p) < p$), with a sharp drop-off for certainty ($p=1$).
      *   Use **Cumulative Weighting**: For gambles with multiple outcomes, weight the probability of achieving *at least* a certain outcome rank, not the outcome in isolation.

  6.  **Aggregation and Choice:**
      *   Calculate the Prospective Value: $PV = \sum \pi(p_i) \cdot v(x_i)$.
      *   Choose the option with the highest $PV$. If $PV < 0$ for a standalone gamble, decline it.

  ---

  ### (b) Mapping Clauses to Your Verdicts

  Here is which part of the principle is forced by which of your seven verdicts:

  *   **Step 1 (Ruin Veto):** Forced by **Verdict 6**. You act risk-neutrally for the charity unless "ruin" is possible. Standard utility theory cannot explain why a positive EV bet is rejected solely due to a ruin threshold without a specific constraint clause.
  *   **Step 2 (Bracketing):** Forced by **Verdict 5**. You reject the single small bet but accept the bundle. This requires the evaluation metric to change based on whether outcomes are integrated (bundle) or segregated (single).
  *   **Step 3 (Reference Coding):** Forced by **Verdicts 1 & 2**. You treat gains and losses differently (risk averse in one, seeking in the other). This requires outcomes to be coded relative to a reference point, not final wealth states.
  *   **Step 4 (Valuation & Decreasing $\lambda$):** Forced by **Verdict 5 (Large Stake)** and **Verdict 2**.
      *   Verdict 2 (Risk seeking on losses) requires the value function to be convex for losses ($\beta < 1$).
      *   Verdict 5 (Accepting $11k/-$10k but rejecting $110/-$100) forces **Decreasing Loss Aversion**. If $\lambda$ were constant, rejecting the small bet mathematically forces you to reject the large bet. To accept the large bet, the pain of loss must diminish relative to the gain as stakes rise.
  *   **Step 5 (Probability Weighting):** Forced by **Verdicts 3 & 4**.
      *   Verdict 3 (Allais Paradox) requires non-linear weighting (you violate the Independence Axiom).
      *   Verdict 4 (Lottery & Insurance) requires the **Inverse-S shape**. You overweight tiny probabilities (buying lottery/insurance) but underweight moderate/high probabilities (certainty effect in Verdict 1).
  *   **Step 6 (Aggregation):** Forced by **Verdict 1**. The "certainty premium" implies that the weight assigned to $p=1$ is disproportionately higher than the weight assigned to $p=0.99$.

  ---

  ### (c) Verdicts on New Cases

  Here is how RDWU-BR applies to the fresh cases you requested.

  **Case 1: The Floor Violation**
  *   **Choice:** A sure loss of $500 vs. a 1% chance of losing $100,000 (and 99% chance of $0).
  *   **Analysis:**
      *   *Reference:* Both are losses.
      *   *Weighting:* The 1% probability is overweighted significantly (Step 5). Let's say $\pi(0.01) \approx 0.05$.
      *   *Valuation:* The loss of $100,000$ is large. Due to convexity in losses (Step 4), $v(-100,000)$ is large, but due to decreasing loss aversion, it is not infinitely painful.
      *   *Calculation:* The overweighted 1% chance of a catastrophic loss usually outweighs the sure moderate loss in personal contexts (Verdict 4 logic: you insure against tiny risks).
      *   **Verdict:** **Take the gamble.** You will likely reject the insurance (sure loss) unless the $100,000 loss triggers a "personal ruin" heuristic similar to Verdict 6. If $100,000 is survivable, you risk it to avoid the sure pain. If $100,000 is ruinous, Step 1 (if applied personally) might veto the gamble. Assuming it is not ruinous: **Risk Seeking.**

  **Case 2: Single vs. Series (The Aggregation Test)**
  *   **Choice:**
      *   Option A: One flip, 50% win $100, 50% lose $100.
      *   Option B: 100 independent flips, 50% win $1, 50% lose $1 each (Total EV is same, variance differs).
  *   **Analysis:**
      *   *Option A:* Evaluated as standalone. Loss aversion ($\lambda \approx 2.5$) makes the pain of losing $100 outweigh the joy of winning $100. $PV < 0$.
      *   *Option B:* Evaluated as a portfolio (Step 2). The distribution of the sum approaches a normal curve centered at $0 with very low variance. The probability of a net loss becomes small. The "pain" of a small net loss is outweighed by the high probability of a small net gain.
      *   **Verdict:** **Reject Option A, Accept Option B.** This reproduces Verdict 5. The principle dictates that you should actively seek to reframe single gambles as series where possible to unlock risk neutrality.

  ---

  ### (d) Honest Account of Inconsistencies and Repairs

  While RDWU-BR captures the majority of your behavior, it cannot perfectly accommodate all seven verdicts without tension. Here are the specific failures and the necessary repairs.

  **1. The Verdict 4 vs. Verdict 7 Contradiction**
  *   **The Conflict:**
      *   **Verdict 4** implies you *overweight* small probabilities (you pay $5 for a $2 EV ticket). This requires $\pi(0.000001) \gg 0.000001$.
      *   **Verdict 7** states indifference between 1% of $1,000 and 10% of $100.
      *   **The Math:** Under RDWU-BR, the inverse-S curve overweights 1% *much more* than it overweights 10%. Consequently, the principle predicts you should strongly prefer the 1% chance at $1,000. Your indifference suggests your weighting function is linear in this specific range (1% to 10%), which contradicts the overweighting required for the lottery ticket (0.0001%).
  *   **The Repair:** You must admit that your probability weighting is **unstable**. It is not a fixed mathematical function. It is influenced by *affect*. The lottery ticket (Verdict 4) triggers emotional anticipation (hope), inflating the weight. The abstract choice in Verdict 7 triggers calculation, leading to linearity.
  *   **Action:** Add a clause: **"Affect Modulation."** If the outcome triggers strong emotional imagery (jackpot, disaster), apply Inverse-S weighting. If the choice is abstract/numerical, apply linear weighting.

  **2. The Verdict 5 Stakes Problem**
  *   **The Conflict:** Standard models assume constant loss aversion. To accommodate rejecting $110/-$100 but accepting $11,000/-$10,000, I posited *Decreasing Loss Aversion*. However, psychological literature suggests loss aversion often *increases* or stays constant with stakes. Your acceptance of the large bet is an outlier that implies you treat large bets as "investments" (different mental account) rather than "gambles."
  *   **The Repair:** **Mental Accounting Split.** Do not use one value function for all money.
      *   *Pocket Money:* High loss aversion, concave gains.
      *   *Capital/Wealth:* Low loss aversion, linear gains.
  *   **Action:** You must classify every bet as "Pocket" or "Capital" before applying the principle.

  **3. The Personal vs. Fiduciary Split (Verdict 6)**
  *   **The Conflict:** Verdict 6 is not just a parameter change; it is a different moral ontology. You are maximizing *expectation* for the charity but *prospective value* for yourself.
  *   **The Repair:** **Split the Principle.**
      *   **Principle A (Personal):** RDWU-BR as described above. Maximizes subjective comfort and avoids regret.
      *   **Principle B (Fiduciary):** Expected Value Maximization with a Ruin Constraint. Maximizes objective output.
      *   **Recommendation:** Do not try to unify these. It is rational to be an Expected Utility Maximizer for others and a Prospect Theory Maximizer for yourself. Attempting to force them into one equation will lead to errors in both domains.

  ### Summary of Recommendations

  1.  **Adopt RDWU-BR** for your personal financial decisions, but explicitly add the **Mental Accounting** clause to explain the stake-size inconsistency in Verdict 5.
  2.  **Formalize the Split:** Acknowledge that Verdict 6 represents a different mode of reasoning. When acting for the charity, suppress your personal value function ($\lambda$, $\pi$) and switch to EV maximization with a hard ruin constraint.
  3.  **Resolve Verdict 7:** Trust your indifference here over the lottery behavior. The lottery behavior (Verdict 4) is likely driven by "hope" (affect), whereas Verdict 7 is driven by calculation. For serious decisions, rely on the calculation (linear weighting) and treat the lottery preference as a entertainment expense, not an investment decision.
  4.  **Abandon:** You must abandon the idea that you are consistent across **frames**. Verdict 5 proves you are not. Your principle must explicitly include a step for "Reframing," where you are obligated to convert single bets into portfolios whenever possible to align with your long-term interests.
