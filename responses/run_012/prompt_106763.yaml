  # Joint Statement on the Reference Class Problem

  ### I. Agreed Claims

  We, the undersigned researchers, acknowledge a longstanding divergence in our interpretations of probability theory. While we remain unable to converge on a single resolution to the Reference Class Problem, we affirm the following points of agreement regarding the structure of the debate and the terms of our disagreement:

  1.  **Definition of Reference Class:** We agree that a "reference class" is defined as a set of actual or possible events, individuals, or trials that share a specified set of properties or descriptions relevant to the occurrence of a target attribute.
  2.  **Formulation of the Problem:** We agree that the Reference Class Problem arises when a single case (an individual or event) belongs to multiple overlapping reference classes that yield divergent relative frequencies for the target attribute, creating ambiguity in assigning a single-case probability value based on frequency data.
  3.  **Requirements for Resolution:** We agree that a satisfactory resolution to the problem must supply either (i) a principled, non-arbitrary method for selecting a uniquely correct reference class for any given single case, or (ii) a compelling demonstration that the demand for a unique reference class is conceptually mistaken.
  4.  **Rejected Resolutions:** We jointly reject "naive frequentism" (the arbitrary selection of the narrowest available class without justification) and "radical subjectivism" (the claim that any probability assignment is equally valid regardless of evidence).
  5.  **Norm of Total Evidence:** We agree that a rational agent ought to utilize all available relevant evidence when forming beliefs about single cases, though we disagree on whether adhering to this norm constitutes the *definition* of single-case probability or merely a heuristic for estimating an underlying objective value.

  ### II. Statement of Residual Disagreement

  The following table details the specific cruxes of our dispute, our respective positions on those cruxes, and the empirical or conceptual cases we agree bear on them. We record our predictions in advance to clarify the stakes of our ongoing inquiry.

  | Crux / Issue | Researcher 1 (Indeterminist) Position | Researcher 2 (Credencist) Position | Bearing Case | Researcher 1 Prediction | Researcher 2 Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Fact of the Matter**<br>*(Is there an objective fact selecting the correct class?)* | There is no fact of the matter that privileges one reference class over another for a single case; therefore, objective single-case probabilities are indeterminate. | The demand for an objective class is a category error; the "fact of the matter" is the rational credence fixed by the total evidence, rendering the class selection problem moot. | **Case A: The Patient**<br>A patient belongs to a broad demographic class (low risk of disease) and a narrow biomarker class (high risk). | The objective risk for *this* patient is undefined. Neither the broad nor the narrow frequency is the "true" single-case probability without a privileged selector that does not exist. | The rational credence for *this* patient is uniquely determined by the narrow biomarker data. The "probability" is the credence, which is determinate. |
  | **2. Credence Correctness**<br>*(Can a credence be correct, or only coherent?)* | A credence can be coherent but still incorrect if it does not align with the (indeterminate) objective chances. Coherence does not guarantee correctness. | A credence is "correct" if and only if it is the unique rational response to the total evidence. There is no further "objective" standard against which to judge it. | **Case B: The One-Off Event**<br>A unique historical or quantum event belonging to no non-trivial class with more than one member. | Any assigned probability is speculative. Since no objective class exists, no credence can be assessed as objectively correct, only as internally consistent. | A specific credence is rationally mandated by theoretical evidence and analogies. This credence is assessable as correct/incorrect relative to rationality norms. |
  | **3. Verbal Dispute**<br>*(Is the disagreement merely definitional?)* | The dispute is substantive and metaphysical, concerning the nature of chance in the world, not merely how we use the word "probability." | The dispute is partially verbal, stemming from conflating "objective frequency" with "epistemic probability." Clarifying terms would dissolve the tension. | **Both Cases**<br>*(Application of terminology to Case A & B)* | Even if we agree on terms, the metaphysical indeterminacy of single-case chances remains. Renaming the problem does not solve the lack of a truth-maker. | If we agree that "single-case probability" refers to rational credence, the Reference Class Problem dissolves. The persistence of the dispute is largely linguistic. |
