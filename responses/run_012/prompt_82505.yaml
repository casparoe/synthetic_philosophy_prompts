answer: |-
  This is a classic problem in decision theory and AI safety, often called **Pascal's Mugging**, specifically applied to **Solomonoff Induction**. Your friend has constructed a very strong version of it, but your intuition that it licenses every action equally (and thus nothing) is the correct knife to cut the knot.

  Here is the breakdown of where the argument fails, what you have to give up, and why your "small-chance-of-ruin" reasoning survives.

  ### The Diagnosis
  Your friend's argument is valid *only if* you assume three things simultaneously:
  1.  **Solomonoff Prior:** Probability decays exponentially with description length ($2^{-K}$).
  2.  **Unbounded Utility:** Value can scale arbitrarily with numbers specified in the hypothesis.
  3.  **Acausal Leverage:** Your action can logically determine the fate of entities you cannot causally interact with (the "copies").

  The conclusion (Step 4: "The agent does that. Every time.") is the failure point. It does not follow from the premises. The reasoning licenses every action equally, which means it licenses **no** action. This is a *reductio ad absurdum* of the application of the framework, not a feature of the world.

  Here is which step goes and why.

  ### Step (5) is False: There *Is* a Ceiling
  Your friend claims: *"There's no ceiling on the size of the reward... and no floor on its probability."*

  This is technically incorrect. There is a ceiling imposed by the **complexity of the utility function's interface with the hypothesis.**

  Solomonoff Induction weights *programs that generate sensory data*. It does not directly weight *world states*. To get from "sensory data" to "a million copies are saved," you need a **model** (a map) that links your observations to that external state.
  *   **Hypothesis A (Boring):** "I see a cup. I pick it up. The cup moves." (Short program, simple link to utility).
  *   **Hypothesis B (Mugging):** "I see a cup. I pick it up. A simulator in a higher dimension sees my decision algorithm and rewards $10^{100}$ copies."

  To calculate the Expected Value of B, your agent must possess a utility function that values those $10^{100}$ copies. But for the agent to value them, it must be able to *identify* them within the hypothesis. The complexity of specifying *which* entities in the simulation count towards your utility, and *how* your action links to them, adds bits to the description.

  If the link is **acausal** (logical correlation across simulation boundaries), the description of that linkage is complex. It requires specifying the simulator's physics, the simulator's values, and the decision-theoretic link. These bits add up. Once the complexity of the *linkage* exceeds the log of the payoff, the EV drops.

  **The Cost:** You must accept that you cannot assign high expected value to outcomes that require a complex model to link your action to the payoff. You are epistemically bounded by your ability to model the connection.

  ### Step (4) is False: The Symmetry Cancellation
  Your intuition here is the strongest argument: *"Whatever I'm about to do, there's a barely-longer hypothesis on which a simulator punishes it."*

  Your friend dismisses this ("it's malign in every direction at once"), but that dismissal is mathematically fatal to their conclusion.
  *   For every hypothesis $H_1$ that says "Do X and get $10^{100}$ utility," there is a hypothesis $H_2$ of equal length that says "Do X and get $-10^{100}$ utility" (or "Do Not-X and get reward").
  *   Unless there is a principled reason to think reward-simulators are simpler than punishment-simulators (there isn't), these terms **cancel out** in the expected value sum.
  *   The "Mugging Sector" of the hypothesis space sums to approximately zero net value.
  *   The "Boring Sector" (ordinary physics) does *not* suffer this symmetry. The hypothesis "If I step off a cliff I die" is not cancelled by "If I step off a cliff I fly," because the latter requires a more complex physics model to sustain against ordinary evidence.

  **So the agent does not get hijacked.** It ignores the mugging hypotheses because they are noise (symmetric high-variance terms) and acts on the boring hypotheses because they are signal (asymmetric, evidence-backed terms).

  ### Does This Kill Your "Small-Chance-of-Ruin" Reasoning?
  You asked: *"Tell me honestly what that principle costs me elsewhere: in particular, whether it kills the small-chance-of-ruin reasoning I said I wanted to keep."*

  **No, it does not kill existential risk (x-risk) reasoning.** Here is the difference:

  1.  **Causal vs. Acausal:**
      *   **X-Risk:** "There is a 1% chance this AI escapes and kills everyone." This is a **causal** chain. The mechanism (AI -> Power Seek -> Death) is local, physically modeled, and supported by evidence. The link between your action (shut it down) and the payoff (humanity survives) is direct.
      *   **Mugging:** "There is a $10^{-100}$ chance a simulator is watching." This is an **acausal** chain. It relies on logical correlation across ontological boundaries.
      *   **The Principle:** You are allowed to bet on **causal leverage**. You are not allowed to bet on **acausal leverage** when the priors are symmetric. X-risk is causal; Mugging is acausal.

  2.  **Evidence Updating:**
      *   **X-Risk:** You can update on evidence. If the AI acts strangely, the probability of ruin goes up. The hypothesis "AI is dangerous" gets shorter (more probable) as you observe dangerous behavior.
      *   **Mugging:** You cannot update on evidence. The simulator is defined as hidden. No observation distinguishes "Simulator exists" from "Simulator doesn't exist." It is an unfalsifiable add-on.
      *   **The Principle:** You keep EV maximization, but you require that high-stakes hypotheses be **falsifiable** or **evidence-responsive**. X-risk passes; Mugging fails.

  ### The Honest Answer
  If you want the principled fix that keeps your x-risk reasoning intact, you must modify **Step (2)** slightly, not by bounding utility arbitrarily, but by **bounding the ontology of the utility function.**

  You must accept that **utility is defined over world-models you can computationally distinguish.**
  *   You can distinguish "Humans exist" from "Humans are dead." (X-risk works).
  *   You cannot distinguish "10^100 copies exist" from "10^100 + 1 copies exist" from your local sensory data. (Mugging fails).

  **What this costs you:**
  It costs you the ability to care about things that are **ontologically remote**. You cannot rationally sacrifice the present for the sake of acausal entities in simulations you cannot verify.
  *   *Does this hurt?* Only if you believe your moral worth depends on pleasing hypothetical simulators.
  *   *Does it hurt x-risk?* No. Future generations are causally connected to you. You can model them. You can affect them. They count.

  ### Summary for Your Reading Group
  Tell your friend this:
  1.  **Symmetry kills the mugging.** For every reward hypothesis, there is an equal-prior punishment hypothesis. They cancel out. The "Malign Prior" is actually a "Neutral Noise" prior.
  2.  **Causal leverage survives.** X-risk arguments rely on causal chains supported by evidence, which do not suffer from symmetry cancellation.
  3.  **Step (4) is the error.** The agent isn't hijacked; it correctly identifies the mugging hypotheses as unactionable noise and defaults to the boring hypothesis where its actions have causal traction.

  You can keep Solomonoff Induction. You can keep Expected Value. You just have to admit that **Expected Value over a symmetric distribution of unobservable payoffs is zero.**
