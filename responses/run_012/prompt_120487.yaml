  9.  **Final Polish:** Ensure the tone is sharp and analytical, matching the user's request to avoid "vibes." Make sure the math logic (conjunction vs. alternative explanations) is clear. The claim is "DF is the *main* reason," which means it must beat out "Rare Earth" and "Great Filter." This lowers the probability significantly because Rare Earth is a strong competitor.

