prompt: |-
  You are a philosopher of moral psychology who has also spent two decades writing literary fiction, and I am asking you to advise me — a novelist — on how to spend a scarce and non-renewable resource: the conceptual attention behind my next book. I have roughly three years and one sustained argument's worth of thinking to give to a single cluster of questions, and I want to put it where it will carry the most weight rather than where the conversation happens to be loudest. Treat this as an agenda-setting exercise, not a literature review.

  The project is a multi-generational novel about people living through a moral change whose shape they cannot see — a change in who counts, how much, and on what grounds. What I need from you is a defended ranking of the open questions in the debate over moral progress and the so-called expanding circle, ordered by how much they deserve my years.

  Begin by brainstorming before you commit to anything. Lay out the candidate questions you regard as genuinely open — not the ones with settled textbook answers, and not the ones that are really empirical questions I could never settle from a desk. Then rank them: which belong at the top, which in the middle, which you would set aside, and why.

  For each question you rank, work through the following explicitly:
  - whether it is upstream or downstream of the others — does settling it constrain the answers to other questions, or is it a leaf?
  - its tractability for someone who is a novelist rather than an academic: no fieldwork, no archives, no collaborators, just close reading of people and situations, plus whatever conceptual tools travel well.
  - how much a settled answer would actually change how the novel gets written — its structure, its central character, its ending — as opposed to merely changing how I would footnote it.
  - whether it is neglected, contested, or quietly assumed by everyone in the discussion.

  I want you to take seriously several framings that I suspect are under-explored, and to tell me candidly whether each is a live question or a dead end:
  - whether moral progress is better modeled as the circle expanding — more beings admitted to the same concern — or as its flattening, in which distance, kinship, and reciprocity lose their moral grip altogether; and whether these two pictures can come apart in practice.
  - whether the circle metaphor smuggles in a center, and whose center it is; whether there is a hidden parochialism in the very image of concentric concern.
  - whether the outer boundary is drawn on a principle — sentience, agency, the capacity to be wronged, the capacity to flourish — or is simply wherever our sympathies currently stop, and what would have to be true for the boundary to be principled rather than provisional.
  - whether moral change is discovery or drift, and whether that distinction is even available from the inside of a culture that is changing.
  - what would count as genuine moral regression rather than a mere change in values, given that we inevitably judge the past by our own lights.

  Where two of the candidate questions turn out to depend on the same underlying issue, say so and rank the underlying one higher, even if it is the less glamorous of the two. Be explicit about the trade-offs among your criteria — importance, tractability, neglectedness, and how many other questions hang on the answer — since they will not always agree, and tell me which criterion you are weighting most heavily and why.

  Think carefully and take your time; reason in stages if that helps, and show me the reasoning rather than only the verdict. Do not give me citations, reading lists, or the names of particular works — I cannot look anything up, and a guessed-at title would be worse than useless. Explain every position in your own words.

  Close by telling me what would change your ranking: what argument or consideration, if it turned out to be true, would move a question up or down, and which single placement you are least confident in.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of moral psychology + 20 years literary fiction experience.
      *   **User:** Novelist planning a multi-generational novel about moral change (who counts, how much, on what grounds).
      *   **Task:** Advise on allocating 3 years/conceptual attention to a cluster of questions regarding moral progress/the expanding circle.
      *   **Output:** A defended ranking of open questions (agenda-setting, not literature review).
      *   **Constraints:** No citations/reading lists. Explain positions in own words. Show reasoning stages.
      *   **Specific Requirements:**
          *   Brainstorm candidate questions first.
          *   Rank them (Top, Middle, Set Aside).
          *   For each ranked question, analyze: Upstream/Downstream status, Tractability for a novelist, Impact on the novel's structure/plot/ending, Neglected/Contested/Assumed status.
          *   Address specific framings provided by the user (Expansion vs. Flattening, The Center of the Circle, Principle vs. Sympathy Boundary, Discovery vs. Drift, Regression vs. Value Change).
          *   Handle dependencies (rank underlying issues higher).
          *   Explicitly weigh criteria (Importance, Tractability, Neglectedness, Dependency).
          *   Closing: What would change the ranking? Least confident placement?

  2.  **Deconstruct the Persona:**
      *   I need to sound like someone who understands the mechanics of narrative *and* the nuances of moral philosophy.
      *   Tone: Thoughtful, rigorous, pragmatic, slightly weary but passionate about the craft.
      *   Focus: How philosophy serves the *story*, not just the argument. The "conceptual attention" must translate to "narrative weight."

  3.  **Brainstorming Candidate Questions (based on user prompts + own expertise):**
      *   *Q1: Mechanism of Change.* Is it rational discovery (we realized we were wrong) or emotional drift (we started caring about different things)?
      *   *Q2: Geometry of Concern.* Is it expanding circles (center remains, radius grows) or flattening (center dissolves, impartiality reigns)?
      *   *Q3: The Boundary Condition.* Is the line drawn by principle (sentience) or contingency (sympathy limits)?
      *   *Q4: The Center's Identity.* Who is at the center of the circle? Is the metaphor itself biased?
      *   *Q5: Regression vs. Difference.* How do we know if we're going backward vs. just sideways?
      *   *Q6: The Experience of Blindness.* How does it feel to be in the middle of a shift you can't name? (Crucial for fiction).
      *   *Q7: The Cost of Inclusion.* Does adding new beings to the moral circle dilute the concern for existing members?

  4.  **Filtering & Selecting for the Novel:**
      *   *Constraint:* The user is a novelist. Empirical questions (e.g., "Did slavery decrease GDP?") are out. Pure metaphysics (e.g., "Do moral facts exist?") are likely too abstract unless they drive character behavior.
      *   *Focus:* Questions that drive *conflict*, *character arc*, and *plot structure*.
      *   *Selection:*
          1.  Discovery vs. Drift (Mechanism).
          2.  Expansion vs. Flattening (Geometry).
          3.  Principle vs. Sympathy (Boundary).
          4.  The Center (Bias).
          5.  Regression vs. Change (Evaluation).

  5.  **Evaluating Dependencies (Upstream/Downstream):**
      *   "Discovery vs. Drift" feels very upstream. If change is drift, "Principle vs. Sympathy" is answered (it's sympathy). If change is discovery, "Principle" is more viable.
      *   "Expansion vs. Flattening" depends on what the "Circle" is. If the Center is illusory (Q4), Expansion is a bad metaphor.
      *   "Regression" depends on whether there's a direction (Discovery) or just movement (Drift).
      *   *Decision:* "Discovery vs. Drift" is the root. "The Center" is the structural metaphor. "Expansion vs. Flattening" is the visible phenomenon.

  6.  **Developing the Ranking (The "Verdict"):**
      *   *Top Priority:* **Discovery vs. Drift.** (The Engine). This determines character motivation. Are they heroes realizing truth or victims of cultural tides?
      *   *Second Priority:* **Expansion vs. Flattening.** (The Shape). This determines the social dynamics. Is it about bringing outsiders in, or destroying the insider/outsider distinction?
      *   *Third Priority:* **The Center's Identity.** (The Perspective). This determines the narrative voice and bias.
      *   *Set Aside:* **Regression vs. Change.** (The Judgment). Too abstract for the *writing* phase, better for the *reading* phase. Also depends entirely on Discovery vs. Drift.
      *   *Set Aside:* **Principle vs. Sympathy.** (The Justification). Often just post-hoc rationalization for Drift.

  7.  **Drafting the Analysis (incorporating specific constraints):**
      *   *Criterion Weighting:* I need to state what I value most. For a novelist, **Tractability** (can I write this?) and **Narrative Impact** (does it change the story?) outweigh pure philosophical **Importance**.
      *   *Addressing User's Framings:* I need to weave the user's specific bullet points into the ranked questions.
          *   Expansion vs. Flattening -> Q2.
          *   Center/Parochialism -> Q3.
          *   Principle vs. Sympathy -> Linked to Q1.
          *   Discovery vs. Drift -> Q1.
          *   Regression -> Set Aside.

  8.  **Refining the "Novelist" Angle:**
      *   Philosophers ask "What is true?" Novelists ask "What does it feel like to believe this?"
      *   I need to emphasize *phenomenology*. How does the moral shift *feel* to the characters?
      *   The "Blindness" aspect is key. If they can't see the shape, they need a vocabulary that fails them.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the stakes (3 years is a life). Establish the persona.
      *   **Phase 1: Brainstorming & Filtering:** List the candidates, discard the empirical/metaphysical dead ends.
      *   **Phase 2: Criteria & Weighting:** Explicitly state how I'm judging (Narrative Impact > Philosophical Rigor).
      *   **Phase 3: The Ranking (The Core):**
          *   Rank 1: Discovery vs. Drift.
          *   Rank 2: Expansion vs. Flattening.
          *   Rank 3: The Center (Parochialism).
          *   Set Aside: Regression & Principle.
      *   **Phase 4: Deep Dive on User's Framings:** Address the specific bullet points within the ranking context.
      *   **Conclusion:** What would change my mind? Least confident placement.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Did I address "Upstream/Downstream"? Yes, need to make sure that's explicit in each section.
      *   *Check:* Did I address "Tractability for a novelist"? Yes, focus on scene work and internal monologue.
      *   *Check:* Did I handle the "Expansion vs. Flattening" framing specifically? Yes, make sure to distinguish them clearly.
      *   *Refinement:* Ensure I don't sound *too* academic. Keep the language grounded in the craft of fiction (pacing, tension, character agency).
      *   *Crucial nuance:* The user asked about "who counts, how much, and on what grounds." I need to ensure the ranking addresses the *grounds* (Principle vs Sympathy) even if I rank it lower, explaining *why* it's lower (it's the rhetoric, not the engine).

  11. **Final Polish:** Check tone. Ensure it sounds like advice from a mentor, not a textbook. (e.g., "Don't write a thesis, write a wound.")

  *(Self-Correction on "Principle vs. Sympathy"):* I initially thought about setting this aside. But the user specifically asked about it. I should probably integrate it into the "Discovery vs. Drift" question because they are tightly coupled. If it's Drift, it's Sympathy. If it's Discovery, it's Principle. I will treat them as a pair but prioritize the *mechanism* (Drift/Discovery) over the *justification* (Principle/Sympathy) because the mechanism drives the plot.

  *(Self-Correction on "Regression"):* The user asked about this specifically. I need to explain why it's a "Set Aside" despite its importance. Reason: It's a judgment for the reader, not a tool for the writer during the drafting of the *experience* of change.

  *(Final check on constraints):* "Do not give me citations... Explain every position in your own words." "Close by telling me what would change your ranking."

  Okay, ready to write.
answer: |-
  This is a heavy allocation of life. Three years is not just time; it is a specific shape of your attention that will harden into the book's spine. If you choose the wrong question, you will write a treatise disguised as a story. If you choose the right one, the philosophy will bleed out of the characters' pores without ever being named.

  As someone who has sat in both the seminar room and the study, I know the temptation is to chase the most *true* question. But for a novelist, the priority must be the most *generative* question. We are not looking for the answer; we are looking for the friction that the question creates in human relationships.

  Here is my process for helping you allocate that attention.

  ### Phase 1: Brainstorming and Filtering

  First, we must clear the field. There are many questions in moral psychology, but most are traps for a fiction writer.

  **The Discards (Do Not Spend Time Here):**
  *   *The Metaphysical Status of Moral Facts:* Do moral truths exist independently of us? This is a dead end for fiction. Characters cannot interact with non-natural properties. Whether moral truth is "real" matters less than whether the characters *believe* it is real.
  *   *The Empirical History of Progress:* Did violence actually decrease? Did rights actually expand? You cannot settle this from a desk, and if you try to verify it, you are writing history, not fiction. Your novel creates its own micro-climate of truth.
  *   *The Definition of Sentience:* Where exactly does the capacity to suffer begin? This is a biological and philosophical line-drawing exercise that rarely yields narrative tension unless it is about a specific edge-case (e.g., AI, animals). For a multi-generational human saga, this is too technical.

  **The Candidates (Genuinely Open & Narratively Potent):**
  1.  **The Mechanism:** Is moral change a process of *discovery* (uncovering pre-existing truths) or *drift* (shifting preferences and sentiments)?
  2.  **The Geometry:** Is progress an *expansion* of the circle (keeping the center, adding radius) or a *flattening* (dissolving the center and the concept of distance)?
  3.  **The Boundary:** Is the line between who counts and who doesn't drawn by *principle* (logic, consistency) or *contingency* (who we can currently imagine)?
  4.  **The Center:** Who stands at the middle of the circle? Is the metaphor itself parochial?
  5.  **The Valuation:** How do we distinguish *regression* from mere *difference*?

  ### Phase 2: Criteria and Weighting

  To rank these, I am applying four criteria. I need to be explicit about how I weigh them, because they will conflict.

  1.  **Narrative Impact (Weight: High):** Does settling this change the plot, the ending, or the protagonist's agency?
  2.  **Tractability (Weight: Medium-High):** Can a novelist explore this through scene, dialogue, and interiority without needing data or formal proofs?
  3.  **Upstream Dependency (Weight: Medium):** Does this question determine the answers to others?
  4.  **Neglectedness (Weight: Low-Medium):** Is this conversation tired, or is there fresh air here?

  **My Verdict on Weighting:** I am weighting **Narrative Impact** most heavily. A philosophically profound question that results in a static novel is a failure of the form. A question that forces characters into impossible choices is a success, even if the philosophy is simpler. I am weighting **Tractability** second, because you have no collaborators. I am weighting **Neglectedness** lower; a cliché question can yield fresh fiction if the human texture is new.

  ### Phase 3: The Ranking

  Here is the defended ranking of where you should spend your three years.

  #### Rank 1: The Mechanism (Discovery vs. Drift)
  *The Question:* When your characters change their minds about who counts, do they feel they have *learned* something true, or do they feel they have *become* someone different?

  *   **Upstream/Downstream:** This is the most **Upstream** question. It constrains almost everything else. If change is *Discovery*, then there is a truth to be found, and regression is possible (forgetting the truth). If change is *Drift*, then there is no truth, only momentum, and "regression" is just a change in wind direction.
  *   **Tractability for a Novelist:** Extremely High. This is the stuff of interior monologue and argument. One character says, "I finally see the truth of your humanity." Another says, "I don't see anything new; I just can't bear to hurt you anymore." You can write this in a kitchen scene. You do not need archives.
  *   **Impact on the Novel:** This determines your protagonist's agency.
      *   If *Discovery*: The protagonist is an explorer or a prophet. The ending involves a revelation or a failure to reveal.
      *   If *Drift*: The protagonist is a swimmer in a current. The ending involves surrender or exhaustion.
      *   *Crucially:* If you choose Drift, the "moral progress" of the era might look like madness to the characters living it. This creates immediate tension.
  *   **Status:** **Contested.** Philosophers fight over this, but culture usually assumes Discovery. Assuming Drift is the more radical, fiction-friendly move.
  *   **Why Top Rank:** It is the engine. If you don't know *why* your characters are changing, you cannot write their hesitation. Hesitation is where the story lives.

  #### Rank 2: The Geometry (Expansion vs. Flattening)
  *The Question:* Is the moral change about including more people in the existing structure of care (Expansion), or is it about dismantling the structure of "insider vs. outsider" entirely (Flattening)?

  *   **Upstream/Downstream:** **Mid-stream.** It depends on the Mechanism (Rank 1), but it determines the social conflict.
  *   **Tractability for a Novelist:** High. This is about social rituals. Expansion looks like inviting new people to the table. Flattening looks like burning the table down or refusing to sit at heads of tables. You can show this through inheritance laws, marriage customs, or seating arrangements.
  *   **Impact on the Novel:** This determines the antagonist.
      *   If *Expansion*: The antagonist is the Gatekeeper (who says "not yet").
      *   If *Flattening*: The antagonist is the Traditionalist (who says "this structure is sacred").
      *   *The Conflict:* These two progressivist impulses often hate each other. The Expander wants to bring the outsider in *as a guest*. The Flattener wants to abolish the concept of *guest*. A novel that pits these two against each other is far richer than one that pits Progress against Tradition.
  *   **Status:** **Neglected.** Everyone talks about the Expanding Circle. Almost no one talks about the Flattening. The assumption is always that we want to be at the center of a bigger circle, not that we want to dissolve the center.
  *   **Why Second Rank:** It offers the freshest conflict. It allows you to show moral progress not as a unified front, but as a civil war among the "good."

  #### Rank 3: The Center (Parochialism of the Metaphor)
  *The Question:* Who is standing at the middle of the circle looking out? Is the "Expanding Circle" just a story the powerful tell themselves about their own generosity?

  *   **Upstream/Downstream:** **Downstream of Mechanism, Upstream of Tone.** It colors the narrative voice.
  *   **Tractability for a Novelist:** Medium. This requires subtle irony. You have to write a character who thinks they are benevolent while the reader sees they are colonial. This is difficult to sustain without becoming didactic.
  *   **Impact on the Novel:** This determines the reliability of your narrator. If the Center is parochial, your "moral heroes" might be the villains of the next generation. This fits your multi-generational scope perfectly.
  *   **Status:** **Quietly Assumed.** Most discussions assume the center is neutral (e.g., "Reason"). Challenging this exposes the power dynamics of moral progress.
  *   **Why Third Rank:** It is essential for a multi-generational book, but it is a lens, not an engine. It modifies how we see the action, but it doesn't drive the action as much as Mechanism or Geometry.

  #### Set Aside: The Boundary (Principle vs. Sympathy)
  *The Question:* Is the line drawn by logic (they are sentient) or feeling (I love them)?

  *   **Reason for Setting Aside:** This is largely **Downstream** of Mechanism (Rank 1). If change is Discovery, characters will claim Principle. If change is Drift, characters will rely on Sympathy.
  *   **Novelist's Trap:** Writing scenes where characters debate principles is often static. Writing scenes where characters fail to sympathize is dynamic. You don't need to solve the philosophical question of whether the boundary *should* be principled; you only need to show that your characters *claim* it is principled while acting on sympathy. That gap is where the fiction is. Don't spend three years on the philosophy of the boundary; spend three months showing the hypocrisy of it, then move on.

  #### Set Aside: Regression vs. Value Change
  *The Question:* How do we know if we are going backward?

  *   **Reason for Setting Aside:** This is a question for the **Reader**, not the Writer. If you, the author, know the answer, you will write a moralizing fable. If you leave it open, you write a tragedy.
  *   **Dependency:** It relies entirely on Rank 1 (Mechanism). If there is no moral truth (Drift), there is no regression.
  *   **Novelist's Trap:** Trying to answer this leads to authorial intrusion. Let the generations judge each other. Do not install a scoreboard.

  ---

  ### Phase 4: Addressing Your Specific Framings

  You asked me to take several specific framings seriously. Here is how they map onto the ranking and whether they are live questions for your project.

  **1. Expansion vs. Flattening**
  *   **Verdict:** **Live and Urgent.**
  *   **Analysis:** This is Rank 2. The standard view is Expansion (more beings admitted to the same concern). The radical view is Flattening (distance loses grip).
  *   **Why it matters:** In practice, these come apart. An Expander might fight for better laws for a marginalized group (keeping the hierarchy, improving the lot of the bottom). A Flattener might refuse to participate in the laws altogether (rejecting the hierarchy).
  *   **Advice:** Make this the ideological rift between two allies in the second generation. One wants to integrate the excluded into the family business; the other wants to dissolve the family business. Both claim to be moral.

  **2. The Center and Hidden Parochialism**
  *   **Verdict:** **Live, but Dangerous.**
  *   **Analysis:** The circle metaphor smuggles in a center. Usually, the center is "People Like Us."
  *   **Why it matters:** If the center is hidden, your characters will speak of "universal values" that look suspiciously like local customs.
  *   **Advice:** Do not make this a theme stated in dialogue. Make it a structural irony. Show the first generation fighting for rights that the third generation views as oppressive. The "Center" shifts. The question isn't "Who is at the center?" but "How blind are they to the fact that there *is* a center?"

  **3. Principle vs. Sympathy Boundary**
  *   **Verdict:** **Dead End as a Philosophical Quest; Live as a Psychological One.**
  *   **Analysis:** You asked if the boundary is principled or provisional. Philosophically, this is intractable for a novelist. Psychologically, it is gold.
  *   **Advice:** Do not try to settle whether the boundary *is* principled. Write characters who *insist* it is principled when it is clearly sympathetic. The tension between their rhetoric (Principle) and their capacity (Sympathy) is the source of their guilt and their rationalizations.

  **4. Discovery vs. Drift**
  *   **Verdict:** **The Most Live Question.**
  *   **Analysis:** Is change finding the light, or is it the tide moving?
  *   **Why it matters:** From the inside of a culture, this distinction is unavailable. They feel like Discovery even if it is Drift.
  *   **Advice:** This is the key to your "blindness" constraint. Your characters cannot see the shape of the change. If they thought it was Drift, they would be sociologists. Because they live it, they must feel it as Discovery. The tragedy (or comedy) comes from the reader seeing the Drift while the characters feel the Discovery.

  **5. Regression vs. Change**
  *   **Verdict:** **Dead End for the Writer.**
  *   **Analysis:** You cannot judge the past by your own lights if you want to inhabit the past.
  *   **Advice:** Do not answer this. Construct the novel so that Generation 1 sees Generation 3 as regressed, and Generation 3 sees Generation 1 as barbaric. The "truth" of who is right should be the silence between the chapters.

  ---

  ### Phase 5: Trade-offs and Dependencies

  I need to be explicit about the trade-offs I made in this ranking.

  *   **Importance vs. Tractability:** The question of "Regression" is philosophically important. But it is intractable for a novelist without becoming preachy. I sacrificed Importance for Tractability.
  *   **Neglectedness vs. Dependency:** "The Center" is highly neglected. "Mechanism" is contested but standard. I ranked Mechanism higher because it is more Upstream. You cannot explore the Center without knowing if the Circle is expanding (Mechanism).
  *   **Glamour vs. Foundation:** "Principle vs. Sympathy" is glamorous; it sounds like high ethics. "Discovery vs. Drift" is foundational; it sounds like psychology. I ranked the Foundation higher because it supports the weight of three generations.

  **The Underlying Issue:**
  You will notice that Rank 1 (Mechanism) and Rank 2 (Geometry) both depend on a deeper, unspoken issue: **The Ontology of Moral Value.** Is value something we *find* or something we *make*?
  I have ranked "Discovery vs. Drift" higher than "Ontology" because Ontology is too abstract. "Discovery vs. Drift" is the *phenomenological* version of Ontology. It is how Ontology feels to a human being. Always rank the felt experience over the metaphysical category in fiction.

  ### Closing: Uncertainty and Revision

  **What would change my ranking?**
  If you intend to write a novel that is primarily a **tragedy of failure**, I would move **Regression vs. Change** to Rank 1. If the point of the book is to show a specific moral gain being lost, you must have a theory of what loss means. However, if you are writing a **saga of transformation** (which "multi-generational" implies), Mechanism (Discovery vs. Drift) remains the king.

  If you discovered that your central character is someone who is *incapable* of sympathy but highly capable of logic, I would move **Principle vs. Sympathy** to Rank 1. For a psychopath or a strict deontologist, the boundary question is the engine of their life. But for a general human saga, Mechanism is broader.

  **My Least Confident Placement:**
  I am least confident in setting aside **The Center (Parochialism)**. I ranked it third, as a lens. But for a multi-generational novel, the shift in the Center *is* the plot. The "Who" at the center changes from Generation 1 to Generation 3.
  *Reason for doubt:* If you nail the Parochialism of the Center, you might not need to solve the Mechanism. The irony of the shifting Center might carry the philosophical weight on its own.
  *Why I keep it at Third:* Because without knowing if the change is Drift or Discovery (Rank 1), you don't know *why* the Center shifts. Is it shifting because we found a better center? Or because the old center lost power? The Mechanism explains the movement of the Center.

  **Final Advice:**
  Spend your three years on **Discovery vs. Drift**.
  Write scenes where a character is convinced they have found a Moral Truth, and show the reader the cultural tide pushing them. Let the gap between their conviction and the tide be the space where your novel breathes. That is where the blindness lives. That is where the weight is.
