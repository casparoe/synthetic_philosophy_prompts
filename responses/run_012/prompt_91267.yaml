answer: |-
  1. **Legal Scholar (Dignity and Rights):** "If dignity is the only defensible ground of rights, then protection must be universal; your model makes justice contingent on power dynamics, which violates the principle of equal protection under the law."
     Reply: Universal formal equality often masks substantive coercion, so burden-shifting restores the conditions for rights to be meaningful rather than nominal. We are not denying dignity but ensuring the powerful cannot violate it with impunity through procedural neutrality.
     Weakness: This risks legitimizing unequal legal treatment based on subjective status assessments rather than inherent personhood.

  2. **Virtue Ethicist (Honor and Excellence):** "By incentivizing victimhood, you cultivate dependency and resentment rather than the agency and resilience required for moral excellence and eudaimonia."
     Reply: Agency is impossible without security, and this framework secures the vulnerable against domination by the strong. True excellence requires a baseline of safety that honor cultures often deny the weak in the name of self-reliance.
     Weakness: This does not address the corrosion of character in the alleged victim who learns to leverage status rather than develop virtue.

  3. **Moral Psychologist (Blame and Outrage):** "Empirical data suggests that emphasizing victimhood increases moral outrage and fragility, leading to more conflict escalation rather than peaceful resolution."
     Reply: Outrage is often a rational response to unchecked harm that dignity cultures ignore or suppress. Channeling this into burden-shifting reduces the violent self-help common in honor cultures.
     Weakness: This relies on the optimistic assumption that institutional channels can absorb increased claims without collapsing under the weight of outrage.

  4. **General Epistemic Objection (Truth and Evidence):** "Shifting the burden of justification away from the accuser risks punishing the innocent based on status rather than objective evidence."
     Reply: In asymmetrical conflicts, evidence is often controlled by the powerful, making neutral arbitration inherently biased toward the oppressor. This prioritizes preventing harm over abstract procedural neutrality that favors the status quo.
     Weakness: Could lead to reverse discrimination where powerful individuals are presumed guilty regardless of specific facts.

  5. **[HOPE NOBODY ASKS] Operationalizing Power:** "How do you objectively measure 'greater power to do harm' without introducing the very biases your system seeks to correct?"
     Reply: We rely on established socioeconomic indicators and institutional authority rather than subjective perception. This uses existing data to approximate capacity for harm.
     Weakness: These indicators are themselves products of the power structures you aim to critique, making the metric circular.

  Pre-emptive Concession: I must concede that victimhood culture, without strict institutional guardrails, risks fostering dependency and must be limited to contexts of clear power asymmetry.
