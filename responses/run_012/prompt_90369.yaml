      *(Self-Correction on the "Meme" point)*: Wait, did the passage say Dennett coined the term *in the context of the scheme* or generally? "a term he coined." That implies general coinage. That is false. Dawkins coined it. Dennett is the philosopher of memetics, but not the coiner. I need to be precise there.

