      *   **Task:** Evaluate the accuracy of the passage claim-by-claim. Sort claims into three categories: (1) Basically Right, (2) Defensible Simplification/Gloss, (3) Flatly Denied/False.
      *   **Specific Focus:** Evaluate the last two sentences (about "replacing" and "only the top rung has a genuine mind").
      *   **Specific Doubt:** The user suspects the "rungs replacing each other" line is backwards but isn't sure.
