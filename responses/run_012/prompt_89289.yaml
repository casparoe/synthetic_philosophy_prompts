  3.  **Identify the Illegitimate Step:**
      *   The crux lies in the interpretation of "fact about the past *as such*" and how past facts influence *future* consequences.
      *   Premise (3) is the culprit. It claims past facts *cannot bear on* what you ought to do.
      *   *Why it looks innocent:* It seems to follow from (1) and (2). If only future consequences matter, and the past is fixed, then the past itself shouldn't matter.
      *   *Why it's wrong:* Past facts are often *causally relevant* to future consequences. They aren't just "sunk"; they are *foundational*. A promise creates an expectation in others. A child exists because of past actions. A research program has built infrastructure/knowledge/reputation.
      *   *Distinction:* There is a difference between "I spent 9 years" (pure sunk cost) and "Because I spent 9 years, I have unique expertise/reputation/infrastructure" (sunk cost converted into asset).
