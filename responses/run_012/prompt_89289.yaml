      *   *Wait, let's look at the Friend's specific claim:* The friend says promises/love *are* sunk costs. This suggests the friend accepts (3) and rejects (8). The user accepts (8).
      *   *The specific error:* It's in the move from (2) to (3). (2) says expected consequences depend on facts about the future. (3) says no fact about the past can bear on the ought. This ignores that facts about the future *supervene on* or are *caused by* facts about the past.
      *   *Better target:* Premise (4) and (7) equivocate on "fact about the past *as such*." Is the fact "I spent 9 years" or is the fact "I have a 9-year head start"?
      *   *Decision:* The most philosophically robust error is in **Premise (3)**. It assumes a disconnect between past facts and future expected utility. Past facts determine the *probability* and *magnitude* of future outcomes. Therefore, they *do* bear on the ought, indirectly but necessarily.
      *   *Alternative:* **Premise (2)** is also suspect. "Which option has the better expected consequences depends only on facts about the future." This is false. Expected consequences depend on the *current state*, which is a product of the past.
