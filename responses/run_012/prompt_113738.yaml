      *   **Tension 1: (b) vs. (d) (The User's Worry)**
          *   *Analysis:* (d) says politeness isn't moral. (b) says flouting a norm is "wrong — not rude." The user is trying to carve out a space for "social wrongness" that isn't "rudeness" but isn't fully "moral sin" either. However, (b) uses the word "wrong" which usually implies morality. If (d) is true, then violating a convention is at most impolite. If (b) is true, violating a convention is morally objectionable (free-riding is a moral concept).
          *   *Verdict:* This is a semantic/definitional tension. It's resolvable by clarifying what "wrong" means in (b).
          *   *Severity:* Low/Medium. It's mostly about labeling.

      *   **Tension 2: (c) vs. (f) (The Justice vs. Fairness Conflict)**
          *   *Analysis:* (c) says the reason following norms is required is to avoid free-riding (taking benefit, avoiding cost). (f) says if a norm is unjust (e.g., tipping), you should break it, even if locals think you're free-riding.
          *   *Conflict:* In the tipping case, refusing to tip *is* free-riding on the social expectation that keeps the worker paid, according to (c). But (f) says do it anyway. So (c) cannot be the *whole* story of why it's wrong to break norms.
