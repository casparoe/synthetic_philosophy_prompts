          1.  Validate the coherence (most of it holds up).
          2.  Address the (b)/(d) worry first (since they asked).
          3.  Rank the real tensions.
          4.  Propose fixes.
          5.  Identify the one to change.
      *   **Refining the (b)/(d) analysis:** The user distinguishes "rude" from "wrong." (d) says politeness isn't moral. (b) says flouting is "wrong." If "wrong" implies moral, (d) is false. If "wrong" implies "pragmatically inadvisable," (b) is weak. The tension is real but semantic.
