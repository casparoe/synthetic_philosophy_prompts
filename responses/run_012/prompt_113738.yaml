          *   *Severity:* Medium. Related to the (b)/(d) tension.

  5.  **Ranking the Tensions:**
      1.  **(c) vs. (f):** This is the biggest philosophical crack. (c) claims exclusivity ("that's the whole story"). (f) creates an exception that breaks the mechanism in (c).
