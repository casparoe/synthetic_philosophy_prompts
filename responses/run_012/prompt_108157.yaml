      *(Refining the "Hope Nobody Asks")*: The logical tension. If the underlying distribution of preferences is the same everywhere (to avoid "innate" claims), then better sorting shouldn't produce a *larger* gap, just a more efficient match. For the gap to *widen*, the underlying variance or mean difference must be *exploited* more. If you admit the underlying difference exists, the sociologists kill you. If you deny it, the economist/math kills you. The question is: "What is the variance of the latent trait in Country A vs Country B?"

