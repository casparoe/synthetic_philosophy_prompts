          *   *Phrasing:* Methodological, protective of the tools, focused on psychometrics.

      *   **Behavioral Geneticist (Heritability):**
          *   *Focus:* $h^2$ is stable, GxE interactions.
          *   *Objection:* If heritability is high in both contexts, the variance explanation doesn't change your point. Or, "Scarr-Rowe hypothesis" (SES moderates heritability).
          *   *Phrasing:* Dismissive of "social" explanations that ignore genetic architecture.

  4.  **Drafting the Objections (Iterative Process):**

      *   *Economist:* Needs to hit endogeneity. "Gender equality" rises with GDP. GDP changes labor market structure. Is it equality or just post-industrialism?
