      *   *Democracy Thesis:* Sen argues famines don't happen in functioning democracies with a free press because leaders get voted out. The Irish Famine is the classic counter-example used by critics (like Cormac Ó Gráda). The UK was a democracy, but Ireland was a colonized periphery. The "democracy" shield works best for independent nations where the starving populace has voting power. In Ireland, the starving were subjects, not equal citizens. In Bengal, they were colonial subjects.
