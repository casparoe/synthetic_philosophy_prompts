prompt: |-
  Hey, I'm a science and ideas writer, long features for magazines mostly, and I'm about five thousand words into a piece on famine that I've realised has a conceptual problem at its core rather then a reporting problem, and I'd rather ask you about it then keep circling.

  The spine of it is that we keep describing famines as natural disasters — drought, blight, bad weather — when the truer reading is that they're political outcomes. My three cases are the Bengal famine in 1943, the Irish one in the 1840s, and the Great Leap Forward. Different centuries, different systems, and in each case there was food in the country or food that could have been moved in, and people died anyway because of decisions. That part I'm confident about. Where I'm stuck is Amartya Sen. The way I've got his entitlement idea is that famines happen when people's entitlements collapse even when food is sitting right there, and I've been writing out of that as though it means famines are basically a welfare-state failure — that the countries that starve are the ones that never built the safety net, and that the fix is entitlements in the American sense, unemployment insurance and cash transfers and food stamps. I want to write that the reason the US and western Europe don't have famines is because they have entitlements and Bengal in 1943 didn't. Is that a fair use of him or am I mangling it, because its been bugging me for weeks. My editor is also needling me about the democracy thing — she says his line about famines not happening in democracies with a free press falls apart the minute you look at Ireland, which was part of the UK, had MPs and newspapers, and still starved a million people. And separately: if famines aren't really about food supply, am I wrong to be telling people the whole food-aid apparatus is theatre and we should just be wiring cash? The aid people I've been talking to keep saying the word famine is basically a funding trigger, nothing moves until someone official says it, which seems to cut against the weather story too but I don't know what to do with it.

  Can you write this out as prose, like an email to me? No headings, no bullets, no bold, no tables, I can't read that stuff, I just want it talked through. And skip the reading list, I'm not going to read it. Tell me straight where I've got the concept wrong, because I suspect I'm about to build five thousand more words on a misreading.
