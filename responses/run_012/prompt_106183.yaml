          *   *Key Point:* Glaucon *wants* to strip away external rewards. He is challenging Socrates to find value in the *state of soul*, not the social payoff. If the just man needs reputation to be just, he isn't truly just for justice's sake.
          *   *Fair Test:* A fair test for Glaucon's specific challenge *must* remove consequences. A "fairer" test in modern terms might involve knowing you are watched by God but not men, but Glaucon's point is about *power* and *impunity*.

      *   **Q4: Descriptive (Is) vs. Normative (Ought).**
          *   *Analysis:* Glaucon mixes them. He says people *are* this way (psychological egoism) to imply justice *is* this way (conventionalism).
