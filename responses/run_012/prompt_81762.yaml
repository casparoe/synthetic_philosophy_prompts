answer: |-
  # The Accuracy-Dominance Audit (ADA v1.0)

  **Purpose:** To ensure all team submissions are immune to accuracy dominance and compatible with the tournament's proper scoring rule (50/50 Brier/Log mix).
  **Time Limit:** 10 Minutes per submission.
  **Authority:** Auditor (You) issues Flat No on Steps 1 & 2. Handoff on Step 3.
  **Theoretical Grounding:** Accuracy-First Epistemology (Joyce/Pettigrew framework). A credence function is *irrational* if it is accuracy-dominated (i.e., there exists an alternative credence function that is guaranteed to be more accurate regardless of the outcome). Coherence is a necessary condition for avoiding accuracy dominance.

  ---

  ### Step 1: Format & Precision Check
  **Question:** Is the submission a single real number $x \in [0, 1]$ for each distinct proposition?
  *   **Yes:** Proceed to Step 2.
  *   **No (Interval, Qualitative, or Missing):** **FLAT NO.**
      *   *Reasoning:* Proper scoring rules (Brier/Log) calculate utility based on the distance between a *point estimate* and the truth value (1 or 0). An interval cannot be scored.
      *   *Action:* Return to forecaster. Demand a point estimate.
      *   *Note:* This enforces **Precise Credalism**. (See Limitations).

  ### Step 2: Logical Coherence Check
  **Question:** Do the submitted probabilities satisfy the axioms of probability for all logically related questions in this submission?
  *   **Check A (Bounds):** Is any $P < 0$ or $P > 1$?
  *   **Check B (Negation):** Does $P(A) + P(\neg A) = 1$?
  *   **Check C (Disjunction):** Does $P(A \lor B) \ge \max(P(A), P(B))$?
  *   **Check D (Partition):** Do mutually exclusive/exhaustive options sum to 1?
  *   **Pass:** Proceed to Step 3.
  *   **Fail:** **FLAT NO (Accuracy Dominated).**
      *   *Reasoning:* **The Accuracy Dominance Theorem.** If a credence function violates probability axioms, there exists a coherent function that is strictly closer to the truth in *every* possible world. Submitting incoherent credences guarantees epistemic loss.
      *   *Repair Instruction:* Do not submit until coherent.
          *   *Heuristic:* Identify the violating constraint. Adjust the value to the nearest logical bound (e.g., if $P(A \lor B) < P(A)$, set $P(A \lor B) = P(A)$ as a floor).
          *   *Auditor Note:* If the violation is complex, calculate the "closest coherent credence" using least-squares projection (if you have time) or hand back for manual repair.
      *   *Override:* Captain may only override with a written argument rejecting Accuracy Dominance (unlikely to be accepted).

  ### Step 3: Scoring Rule Sensitivity Check
  **Question:** Does the forecast assign $P=0$ or $P=1$ to any contingent event?
  *   **No:** **SIGN OFF.** (The credence is permissible).
  *   **Yes:** **HANDOFF / WARNING.**
      *   *Reasoning:* The Logarithmic Score component assigns infinite penalty (negative infinity utility) to certainty when wrong. The Brier component penalizes heavily (score of 1). A 50/50 mix inherits the unbounded risk of the Log score.
      *   *Action:* Warn the forecaster. "You are risking infinite epistemic utility loss. Are you logically certain?"
      *   *Decision:* If they insist, **SIGN OFF** (It is coherent, hence permissible, though risky). This is a judgment call on risk tolerance, not accuracy.

  ### Step 4: Evidence & Updating (The "Soft" Check)
  **Question:** Is there clear evidence of failure to conditionalize on known information (e.g., ignoring a provided base rate without justification)?
  *   **No / Unclear:** **SIGN OFF.**
  *   **Yes:** **HANDOFF.**
      *   *Reasoning:* Formal epistemology constrains *structure* (coherence), not *content* (specific priors). Unless the evidence logically entails the truth, deviating from a base rate is not accuracy-dominated, merely potentially less reliable.
      *   *Action:* Return to forecaster. "Explain why your credence diverges from the base rate."
      *   *Decision:* If they provide a reason (even "I trust my friend more"), **SIGN OFF**. You cannot audit the weight of evidence without a separate model of source reliability.

  ---

  # Case Applications

  ### Case 1: The Incoherent Triad
  **Submission:** $P(A) = 0.7$, $P(B) = 0.6$, $P(A \lor B) = 0.5$.
  **Forecaster View:** "I feel these match my intuition. I can't see the error."

  **Procedure Execution:**
  1.  **Step 1:** Pass (Point estimates provided).
  2.  **Step 2 (Coherence):** **FAIL.**
      *   *Check C:* $P(A \lor B)$ must be $\ge \max(P(A), P(B))$.
      *   *Violation:* $0.5 < 0.7$.
      *   *Theorem:* This set is accuracy-dominated. There is a coherent set (e.g., $P(A \lor B) = 0.7$) that will score better regardless of whether A or B is true.
  3.  **Action:** **FLAT NO.**
  4.  **Repair Instruction:** The procedure mandates setting $P(A \lor B) \ge 0.7$. The forecaster must adjust this value before submission.

  **Outcome:** The forecaster is unhappy because their "intuition" was blocked.
  **Analysis:** Step 2 is doing the work. This is not a value judgment; it is a mathematical necessity derived from the definition of the scoring rule. An incoherent set guarantees a worse score than a corrected one. There is no world where $P(A \lor B) = 0.5$ outperforms $P(A \lor B) = 0.7$ given $P(A)=0.7$.

  ### Case 2: The Base Rate vs. The Friend
  **Submission:** Forecaster is torn. Base rate implies 0.55. Friend implies 0.8. She asks the procedure to choose.
  **Forecaster View:** "Tell me which one is epistemically better so I don't hurt the team."

  **Procedure Execution:**
  1.  **Step 1:** Pass.
  2.  **Step 2:** Pass (Both 0.55 and 0.8 are coherent probabilities).
  3.  **Step 3:** Pass (Neither is 0 or 1).
  4.  **Step 4 (Evidence):** **HANDOFF.**
      *   *Reasoning:* Both 0.55 and 0.8 are *permissible* credences under Subjective Bayesianism. Neither is accuracy-dominated *ex ante*. The proper scoring rule rewards reporting her *actual* belief.
      *   *Action:* The procedure stops. I return the decision to the forecaster.
      *   *Instruction:* "The audit cannot weigh evidence. If you genuinely weigh the friend's testimony higher, 0.8 is your required report. If you trust the base rate, 0.55 is required. Reporting a number you do not believe is strategic misreporting, which proper scoring rules punish."

  **Outcome:** The forecaster is frustrated. She wanted an answer; she got a mirror.
  **Analysis:** The procedure stops at Step 4. This highlights the limit of accuracy-first epistemology: it governs the *relation* between belief and report, and the *structure* of belief, but it does not generate priors or weigh testimony. The "value judgment" here is the commitment to **Subjective Bayesianism** (that rational agents can disagree on priors) rather than Objective Bayesianism (which might force the base rate).

  ### Case 3: The Honest Interval
  **Submission:** $[0.3, 0.7]$.
  **Forecaster View:** "Precision is dishonest. I am not 99% sure it's 0.5. The interval represents my uncertainty."

  **Procedure Execution:**
  1.  **Step 1 (Format):** **FLAT NO.**
      *   *Reasoning:* The tournament scoring rule (Brier/Log mix) is defined on point estimates $r \in [0,1]$. There is no formula to score an interval $[a, b]$.
      *   *Action:* Reject submission. Demand a single number.

  **Outcome:** The forecaster is angry, arguing the procedure forces "false precision."
  **Analysis:**
  *   **Step Doing the Work:** Step 1.
  *   **Value Judgment Dressed as Procedure:** This is the commitment to **Precise Credalism**. Formal epistemology *can* handle imprecise probabilities (sets of credences), but *this* procedure (and the tournament) assumes rational belief must be represented by a single number to calculate expected accuracy.
  *   **Why it's a Judgment:** Rejecting the interval isn't about accuracy dominance (an interval isn't dominated; it's just unscoreable here). It is a metaphysical stance that uncertainty *must* be quantified as a point to be rational. You are enforcing a specific epistemological framework (Precise Bayesianism) over a competing one (Imprecise Bayesianism) because of the tournament rules. You must admit this to the forecaster: "The procedure requires a point estimate not because intervals are irrational, but because our utility function cannot process them."

  ---

  # Limitations: What the Procedure Cannot Do

  This audit is a tool for *structural rationality*, not *substantive truth*. It is silent on the following, which would require separate procedures or theoretical additions:

  1.  **Source Weighting (The Case 2 Problem):** The procedure cannot tell a forecaster how to update on testimony vs. statistics. To fix this, you would need a **Reliability Weighting Protocol** (e.g., a separate regression model that estimates the calibration of specific friends vs. base rates) to feed into Step 4.
  2.  **Aggregation:** This audit checks individual submissions. It does not tell you how to combine them into a team forecast. Linear pooling (averaging) preserves coherence but may not maximize accuracy compared to geometric pooling (logarithmic), depending on the independence of the forecasters. You need a separate **Aggregation Rule**.
  3.  **Question Selection:** The procedure ensures high accuracy *given* a question. It does not identify which questions are worth forecasting (Value of Information). A team could be perfectly coherent on trivial questions and lose the tournament to a team taking high-value risks.
  4.  **Imprecise Credence:** As seen in Case 3, the procedure collapses under imprecise probabilities. To handle this, you would need to adopt a **Set-Valued Scoring Rule** (e.g., evaluating the lower and upper bounds separately), which changes the tournament's mathematical foundation.
  5.  **Risk Aversion:** Proper scoring rules assume risk-neutrality regarding epistemic utility. If your team is trailing and needs a "Hail Mary" (high variance forecast), a coherent 0.5 might be strategically worse than a coherent 0.9, even if 0.5 is more "accurate." This procedure bans strategic distortion, which is ethically correct for epistemology but potentially suboptimal for *winning* a tournament.

  **Final Note for the Auditor:** When you sign off, you are certifying that the forecast is *immune to guaranteed epistemic loss* (coherence) and *compatible with the scoring mechanism* (format). You are not certifying that it is *true*. Make that distinction clear to your team captain.
