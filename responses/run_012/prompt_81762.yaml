      *   *Accuracy Dominance (Joyce's Argument):* If a credence function is incoherent, there exists a coherent function that is *strictly more accurate* in every possible world. This is the "Flat No" engine.
      *   *Conditionalization:* Updating on evidence.
      *   *Permissible vs. Required:* Coherence is usually a constraint (required), but specific values within coherence are often underdetermined by evidence (permissible range), unless one adopts a strict Objective Bayesian view (which is controversial and likely too advanced/rigid for this context). I should stick to Subjective Bayesianism with Coherence constraints for the "audit."

