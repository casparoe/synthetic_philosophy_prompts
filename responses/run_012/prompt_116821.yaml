answer: |-
  Here is the specification list for a theory of information value, broken down by your requirements, followed by the conflict analysis.

  ### The Requirements Spec

  **1. The Baseline (The "Ignore" Option)**
  *   **The Case:** You can always choose to act as if you didn't learn the thing.
  *   **Why it's a requirement:** This is the mathematical engine of the coach's theorem. If you can discard info, your new best choice must be at least as good as your old best choice.
  *   **Status:** **Universal.** Any decision model must account for the option to disregard data.

  **2. Zero-Value Information**
  *   **The Case:** Finding out something that doesn't change your options or probabilities (e.g., the 1,000th digit of pi when buying groceries).
  *   **Why it's a requirement:** A theory must explain why some info is neutral, not just positive or negative.
  *   **Status:** **Universal.** A theory that claims all info has positive value is easily falsified by irrelevant data.

  **3. Irreversible Knowledge (Psychological Burden)**
  *   **The Case:** You can't un-know a betrayal or a diagnosis; the knowledge itself causes pain regardless of the outcome.
  *   **Why it's a requirement:** Humans experience utility (satisfaction) from mental states, not just physical outcomes.
  *   **Status:** **Contested.** The Coach's model ignores this (treats mind as a black box); your intuition demands it be included in the "cost" of knowing.

  **4. Preference Change (Endogenous Values)**
  *   **The Case:** Info changes what you want, not just what you think is true (e.g., trying a food and realizing you like it).
  *   **Why it's a requirement:** If your goals shift upon learning, you can't compare "before" and "after" value on the same scale.
  *   **Status:** **Contested.** Standard theory assumes fixed preferences to make the math work; real life violates this constantly.

  **5. Acquisition Signaling (How You Got It)**
  *   **The Case:** Opening the envelope signals to the room that you care, or that you suspect fraud.
  *   **Why it's a requirement:** The act of observing can change the environment, independent of the content observed.
  *   **Status:** **Contested.** Single-agent theory ignores this; game theory requires it.

  **6. Strategic Leakage (Others Know You Know)**
  *   **The Case:** In a negotiation, if the seller knows you know the car is a lemon, they won't sell, or they get angry.
  *   **Why it's a requirement:** Information value depends on who else knows you have it.
  *   **Status:** **Contested.** This requires moving from Decision Theory (one person) to Game Theory (multiple people).

  **7. Predictive Defiance (Newcomb/Spitel)**
  *   **The Case:** You are told what you will choose, and you choose the opposite to prove the prediction wrong.
  *   **Why it's a requirement:** Info about your own agency can break the causal link between belief and action.
  *   **Status:** **Contested.** This breaks standard causal models; only relevant in specific paradoxical setups.

  **8. Ex-Ante vs. Ex-Post Valuation**
  *   **The Case:** The difference between "Is it worth looking?" (before) and "Do I wish I knew this?" (after).
  *   **Why it's a requirement:** You can value the *opportunity* to know while hating the *content* of the knowledge.
  *   **Status:** **Universal.** Failing to distinguish these two timeframes makes the math and the intuition talk past each other.

  **9. Bounded Rationality (Real Agents)**
  *   **The Case:** You are tired, biased, or bad at math, so more info leads to worse decisions (analysis paralysis).
  *   **Why it's a requirement:** The theorem assumes perfect processing; humans have cognitive costs and bugs.
  *   **Status:** **Contested.** Ideal models assume perfect rationality; behavioral models must account for processing limits.

  **10. Meta-Information (Paying to Ignore)**
  *   **The Case:** It should be rational to pay money to keep an envelope sealed if opening it risks net pain.
  *   **Why it's a requirement:** If info can be negative value, avoiding it must be a purchasable good.
  *   **Status:** **Universal.** This is the logical consistency check for whether negative information value is allowed.

  ***

  ### The Conflict Analysis

  **Which of these can't all be true at once?**
  You cannot hold **Requirement 1 (Info $\ge$ 0)** and **Requirement 3 (Psychological Burden)** as simultaneously true within the same utility function. The coach's theorem is only true if you define "Utility" strictly as external outcomes (money, health, winning) and exclude internal states (anxiety, regret, guilt). If you include internal states in Utility, the theorem breaks, and Requirement 10 (Paying to Ignore) becomes valid. Keeping the theorem forces you to classify the "bad cases" not as negative information value, but as external costs of acquisition or changes in preference, effectively moving the goalposts to save the math.

  **Which single requirement knocks out the most theories?**
  **Requirement 9 (Bounded Rationality)** is the biggest theory-killer. Almost every clean mathematical model assumes that processing information is free and error-free. The moment you admit that thinking costs time, energy, or emotional capacity, the "Value of Information is Always Non-Negative" theorem collapses immediately, because the cost of processing can exceed the benefit of the choice improvement.

  **The Verdict**
  The plain expected-value picture survives by measuring value before you look and defining utility narrowly to exclude the pain of knowing, keeping the math clean but the model fragile. The action-based picture fails the theorem because it admits that knowing can constrain you or hurt you, but it captures the real-world intuition that ignorance is sometimes bliss.
