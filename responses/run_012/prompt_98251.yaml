          *   Support for NU? It supports the *asymmetry* premise (suffering matters more than pleasure). If happiness is just pain-cessation, then creating new pleasure is impossible; you can only remove pain. This aligns with SFE (Suffering-Focused Ethics).
          *   Caveat: Schopenhauer isn't a utilitarian. He doesn't want to maximize anything. He wants to negate the Will. But the *weighting* of suffering is definitely proto-SFE.

      *   **4. Argumentative Role:**
