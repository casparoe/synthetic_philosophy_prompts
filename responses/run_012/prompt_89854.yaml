answer: |-
  This is a strong skeleton. Your intuition about the dependencies is correct: they are not backwards, but they are **top-heavy**. If you spend the first 40 minutes on the logic of the Narrow Problem, you will lose the Philosophy of Mind students before you get to the payoff (the Wide Problem/Quine connection).

  Here is a structural plan designed to keep the logical technicalities subservient to the philosophical stakes, along with the specific advice on examples, misconceptions, and boundaries you requested.

  ### 1. Structural Plan (75 Minutes)

  **0:00–0:10 | Introduction & The Word "Frame"**
  *   **Hook:** Start with the mundane fact of inertia (your mug example).
  *   **Definition:** Define the Frame Problem immediately as *the problem of representing change without representing non-change.*
  *   **Kill Misconception #1:** Explicitly state: "This has nothing to do with video frames or visual fields." It is a logical frame of reference.
  *   **The Quine Hook:** Remind them of Quinean holism. If a belief network is interconnected, why doesn't moving a mug require re-evaluating the theory of gravity?

  **0:10–0:30 | The Narrow Problem (The Logic Trap)**
  *   **The Setup:** Use the **Blocks World** here (not the pharmacy). It is sterile, which is good for logic.
  *   **The Explosion:** Walk through the "Action × Property" axiom blowup. Keep it conceptual; do not write situation calculus predicates on the board unless necessary. Use English proxies: *If I move Block A, Block A's location changes. Block A's color does not. Block B's location does not...*
  *   **The Patch:** Introduce the "Nothing changes unless specified" rule (Non-monotonicity/Circumscription).
  *   **The Bite Back:** Briefly describe the **Yale Shooting Problem**. (Gun loaded, wait, shoot. "Wait" allows minimal change, which allows the gun to spontaneously become unloaded to preserve consistency).
  *   **Status Update:** Acknowledge that logicians *mostly* solved this by the late 80s/90s.

  **0:30–0:40 | The Pivot (Crucial Transition)**
  *   **The Distinction:** Draw the line. Narrow = Logical representation of inertia. Wide = Epistemic selection of relevance.
  *   **The Claim:** The Narrow problem was a proxy for the Wide problem. Solving the logic didn't solve the mind.
  *   **Kill Misconception #2:** "If it was solved in the 80s, why are we talking about it?" Because the *technical* solution assumes a designer who already knows what is relevant. The *mind* has to find relevance without a designer.

  **0:40–1:00 | The Wide Problem (The Philosophical Core)**
  *   **Switch Example:** Move to the **Pharmacy/Afternoon** example here.
  *   **The Scenario:** You learn "Pharmacy closes at 6."
  *   **The Question:** What else in your web of belief updates?
      *   *Irrelevant:* The price of tea in China, the color of your mug, the fact that 2+2=4.
      *   *Relevant:* You can't buy meds after 6, you need to leave work earlier, you might be late for dinner.
  *   **The Quinean Tension:** If holism is true, *any* belief could be relevant. If the Frame Problem is real, *most* beliefs are irrelevant. How does the mind draw the boundary without checking everything?
  *   **Kill Misconception #3:** "It's just a computing speed problem." No. Even with infinite speed, checking infinite irrelevant connections yields no action. It is a problem of **salience**, not cycles.

  **1:00–1:15 | Conclusion & Implications for Mind**
  *   **The Human Solution:** We don't solve this logically; we solve it biologically/culturally. We have "frames" of expectation (schemas).
  *   **Kill Misconception #4:** "This is only a robot problem." Humans suffer from frame failures (trauma, surprise, humor).
  *   **Final Question:** (See below).

  ---

  ### 2. The Example Strategy

  You are right to worry about the "Blocks" example being too sterile and the "Pharmacy" example being too passive. **Use both, but assign them specific jobs.**

  *   **For the Narrow Problem (Logic):** Use **Blocks/Mug**.
      *   *Why:* You need a closed world where properties are discrete (Color, Location). This makes the "Axiom Explosion" visible. If you use the Pharmacy example here, students will get bogged down in "Well, actually, the traffic might change..." which is the Ramification problem, not the Frame problem.
      *   *Constraint:* Keep it to physical properties only. Location, Color, Shape. No "value" or "meaning."

  *   **For the Wide Problem (Relevance):** Use **The Pharmacy/Afternoon**.
      *   *Why:* This captures the *semantic* nature of relevance. The logic doesn't care if the pharmacy closes; the *agent's goals* care. This highlights that the "frame" isn't around the action, it's around the *goal*.
      *   *Constraint:* Do not let them drift into "What if the pharmacy is on fire?" (Qualification problem). Keep the focus on: "I learned one fact. Why did I update *these* three beliefs and not *those* three million others?"

  **Why this split works:** It prevents the "smuggling in neighboring problems" worry. The Blocks example is too dumb to have qualification issues. The Pharmacy example is too high-level to get stuck on situation calculus axioms. The switch signals to the students that the *nature of the problem* has changed.

  ---

  ### 3. The Misconception Map

  Here is where to kill the specific wrong turns you anticipated.

  | Misconception | Status | Where to Kill It | How to Phrase It |
  | :--- | :--- | :--- | :--- |
  | **"Frame" = Video/Vision** | **False** | **Min 0:05** | "It's named after a logical frame of reference, like a window on a database, not a movie reel." |
  | **"It's a Complexity Problem"** | **False** | **Min 0:50** | "If I gave you a computer a million times faster, it would just check irrelevant beliefs a million times faster. The problem is knowing what *not* to check." |
  | **"Solved in the 80s"** | **Half-True** | **Min 0:35** | "The *logical* representation of inertia was solved. The *epistemic* problem of relevance was merely relocated to the designer." |
  | **"Only for Machines"** | **False** | **Min 1:05** | "When you are surprised by a friend's reaction, you have encountered a frame failure. You assumed inertia in a social context where there was none." |
  | **"Everything is Frame Problem"** | **False** | **Min 0:25** | Distinguish explicitly: **Frame** (what stays same), **Qualification** (preconditions), **Ramification** (side effects). Write these three words on the board and circle only Frame. |

  **Note on "Complexity":** Be careful here. There is a computational complexity aspect to the Narrow problem. However, for Phil Mind, the *epistemic* complexity is the killer. Frame the misconception as: "It is not a problem of *resources*, it is a problem of *boundaries*."

  ---

  ### 4. The Final Question

  You want to separate recitation from understanding. Recitation sounds like: "It's about relevance." Understanding sounds like: "It's about the tension between holistic confirmation and local action."

  **Put this on the board for the last 3 minutes:**

  > "If Quine is right that our beliefs form a seamless web where 'any statement can be held true come what may, if we make drastic enough adjustments elsewhere,' how is it possible for a mind to act without checking the whole web?"

  *   **The Reciter** will say: "Because they filter for relevance." (This just restates the problem).
  *   **The Understander** will say: "Because the mind must treat parts of the web *as if* they are modular, even if they aren't ontologically modular. The Frame Problem proves we need pragmatic boundaries, not just logical ones."

  ---

  ### 5. "Out of Scope" Announcements

  To prevent students from thinking you skipped the hard stuff accidentally, announce these three exclusions explicitly at the start (Min 0:08):

  1.  **"I will not be teaching you Situation Calculus."** (We will talk about what the logic *tries* to do, but not the syntax).
  2.  **"I am separating the Frame Problem from the Qualification and Ramification Problems."** (Acknowledge they are related, but state you are isolating Inertia/Relevance for today).
  3.  **"I am not offering a solution to the Wide Problem."** (Be honest: "If I had the solution to how the human mind solves relevance, I would not be here, I would be winning a Nobel Prize.")

  ### Summary of Dependencies Check
  Your skeleton dependencies are **correct**, but the *weighting* needs adjustment.
  *   **Current:** 50% Logic / 50% Phil.
  *   **Recommended:** 30% Logic / 70% Phil.
  *   **Reason:** The Logic is just the *proof* that the Phil problem is hard. The Phil problem (Wide Frame) is the actual topic of a Philosophy of Mind course. Don't let the situation calculus tail wag the Quinean dog.

  This plan lets you use the technical failure of the 1980s AI as the empirical evidence for the philosophical difficulty of Holism. Good luck with the lecture.
