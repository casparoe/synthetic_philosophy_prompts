prompt: |-
  I'm a clinical ethics consultant at a mid-sized hospital, and I just had a long, slightly wine-fueled arguement with my oldest friend about Hume's essay on suicide. She thinks it's just a period piece — an 18th-century guy being shocking — and that nothing in it could possibly help me when I'm on call. I think there's actually a usable proceedure buried in there, but I got tangled up trying to state it. So: act as a philosopher who also knows the practical constraints of a hospital ethics consult. Think carefully, and start by brainstorming the different arguments Hume actually makes in that essay and what each would imply for a bedside decision. Then turn the defensible ones into a decision procedure I could actually run on a consult.

  I do maybe two or three of these consults a month, usually with about twenty minutes before I have to give the team an answer, and the attending has to sign off. The procedure should be a checklist or ordered set of questions for a patient who is asking about assisted dying where it's legal, or who is refusing life-sustaining treatment in a way that will certainly end their life. It needs to say what counts as a sufficient answer at each step, where the procedure stops with a clear no, and where it has to hand the decision to a person because the question is one of values rather than facts. I don't want a bibliography, reading list, or citations — I know the essay, and I can't use them at the bedside anyway. I want the operational core.

  The hard cases I need it to handle: (1) a patient with a terminal illness and intractable pain who says they're ready to go; (2) a patient who says they want to die because they don't want to be a burden on their family; (3) a patient who says God forbids suicide but they want to die anyway; (4) a patient whose request seems to be driven by untreated depression, but who insists it isn't. For each, show me how the procedure runs and where it either gives an answer or gets stuck. I especially want you to include one case where the procedure gives an answer I won't like — maybe where it says we should honor a request I'd instinctively resist, or refuse one I'd instinctively honor.

  Also, be honest about the seams. Hume's argument about our duty to God is the one I can't see how to operationalize in a secular hospital. Is that a problem for the procedure, or can it be bracketed? And say how confident you are in the procedure you've given me, and single out the one point you're least sure about. Don't just tell me it's all context-dependent — give me the actual steps, even if some of them are judgment calls dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Clinical ethics consultant at a mid-sized hospital.
      *   **Context:** Just argued with a friend about Hume's *Of Suicide*. Friend says it's irrelevant period piece; User thinks there's a usable procedure buried in it.
      *   **Task:** Act as a philosopher + practical ethicist. Brainstorm Hume's arguments, translate defensible ones into a bedside decision procedure (checklist/ordered questions).
      *   **Constraints:** 20-minute turnaround, attending sign-off needed. No bibliography/citations. Must handle 4 specific hard cases. Must include one counter-intuitive outcome. Must address the "duty to God" seam. Must state confidence level and biggest uncertainty.
      *   **Tone:** Professional, pragmatic, philosophically grounded but operationally sharp. No fluff.

  2.  **Deconstruct Hume's *Of Suicide*:**
      *   *Core Thesis:* Suicide is not necessarily a transgression against God, Neighbor, or Self.
      *   *Argument 1: Duty to God.* We alter matter all the time (diverting a stream, killing a flea). Why is stopping blood flow different? Providence governs *all* events. If suicide happens, it's within Providence. -> *Implication:* Don't assume metaphysical prohibition. Focus on natural consequences.
      *   *Argument 2: Duty to Society.* Does the person's death harm society? If they are a burden or no longer contribute, the harm is negligible. -> *Implication:* Assess social impact/utility. Is the patient a net drain or neutral? (Dangerous territory, needs careful framing).
      *   *Argument 3: Duty to Self.* Does life hold more good than evil? If pain > pleasure, self-preservation instinct is overridden by reason. -> *Implication:* Assess balance of suffering vs. benefit. Is the decision rational based on their own welfare?
      *   *Underlying Principle:* Agency and Reason. The act is permissible if it doesn't violate specific duties and is chosen freely by a sound mind.

  3.  **Translate to Clinical Procedure (The "Humean Triage"):**
      *   *Constraint:* 20 minutes. Secular hospital. Legal framework exists (assisted dying where legal, or refusal of treatment).
      *   *Goal:* Determine if the request is ethically actionable.
      *   *Step 1: Capacity & Coercion (The "Self" Check).* Hume emphasizes reason. Is the mind clouded? Is there external pressure?
      *   *Step 2: The Burden Calculation (The "Society" Check).* Hume argues we aren't obligated to stay alive if we are a burden. *Correction:* In modern ethics, we can't say "you're a burden, go ahead." We must ensure the *feeling* of burden isn't the *sole* driver, but we also can't force them to stay alive *for* others. This needs nuance.
      *   *Step 3: The Suffering/Utility Balance (The "Providence" Check).* Hume says we can intervene in nature. Is the suffering intractable? Is the intervention (death) proportional?
      *   *Step 4: The God Question.* Hume says God isn't offended. In a secular hospital, we bracket theology unless it causes internal conflict.

      *Refining the Procedure:* It needs to be a checklist.
      1.  **Volition Check:** Is this the patient's voice? (Depression/Coercion screen).
      2.  **Social Duty Check:** Is the decision driven by perceived burden? (Distinguish altruism from coercion).
      3.  **Suffering Check:** Is the pain/loss outweighing the good? (Hume's balance).
      4.  **Consistency Check:** Does this align with their life narrative? (Hume's "reasonable creature").

  4.  **Drafting the Procedure (Iterative Process):**
      *   *Critique:* Hume's "Society" argument is risky. If a patient says "I'm a burden," Hume says "Okay, leave." Modern ethics says "Treat the depression/social support." I need to bridge this. The procedure should flag "Burden" as a *risk factor* for invalid consent, not a *justification* for death.
      *   *Revision:* Let's stick closer to Hume's *structure* but invert the "Burden" logic for safety. Hume says you *can* leave if you're a burden. Ethics says you *shouldn't* leave *because* you're a burden.
      *   *Wait, the prompt asks for Hume's procedure.* I need to find the *usable* core. The usable core is: **Interference with Nature is permissible if it violates no specific duty.**
      *   *Operationalizing:*
          1.  **Agency:** Is the will free? (Depression/Coercion).
          2.  **Duty to Others:** Does this abandon a specific obligation (e.g., minor children)?
          3.  **Duty to Self:** Is life currently net-negative *for them*?
          4.  **Metaphysics:** Bracketed (Secular).

  5.  **Running the Hard Cases:**
      *   *Case 1 (Terminal/Pain):* Passes Agency, Passes Duty to Others (usually), Passes Duty to Self (Pain > Good). -> **Honor.**
      *   *Case 2 (Burden):* Fails Agency (Coercion by circumstance) OR Fails Duty to Self (if they actually want to live but feel guilty). Hume might say "Okay," but modern ethics says "Pause." I need to make the procedure catch this. *Decision:* The procedure flags "Burden" as a validity threat. If the *only* reason is burden, it's a "No/Refer."
      *   *Case 3 (God Forbids):* Internal conflict. Hume says God isn't offended. Patient says God is. -> **Handoff.** Values question. Procedure stops.
      *   *Case 4 (Depression):* Fails Agency. -> **No.**
      *   *Counter-Intuitive Case:* I need one where the procedure says "Yes" but I'd say "No," or vice versa.
          *   *Idea:* A patient with no dependents, chronic but not terminal suffering, rational, says "I'm done." Hume says "Go." Modern medicine often says "No, treat depression more."
          *   *Better Idea:* A patient who is a *massive* burden on family (financially/emotionally) and says "I'm doing this for them." Hume says "Valid." Modern ethics says "Suspect." Let's make the procedure *allow* it if the burden is factual and the will is steady, which might make the consultant uncomfortable. Or, conversely, a patient with minor children who wants to die. Hume says "Duty to Society." Procedure says "No." I might instinctively want to honor their autonomy, but the procedure says "No." Let's go with the **Minor Children** case. It's a hard "No" based on Duty to Others, even if the patient is rational and suffering.

  6.  **Addressing the "God" Seam:**
      *   Hume spends half the essay on God. In a secular hospital, this is irrelevant *unless* it causes the patient distress.
      *   *Solution:* Bracket it. Treat it as a "Values Conflict" check. If the patient believes it, it's real *for them*.

  7.  **Confidence & Uncertainty:**
      *   Confidence: High on structure, moderate on application.
      *   Uncertainty: The "Burden" calculation. It's too easy to slide into eugenics/utilitarianism.

  8.  **Final Polish:**
      *   Ensure tone is right (colleague to colleague).
      *   Check constraints (20 mins, checklist format).
      *   Make sure the Humean logic is visible but not academic.

      *(Self-Correction during drafting)*: I need to be careful not to make this sound like *I* am advocating for suicide. This is an ethics consult procedure for *evaluating requests* within legal bounds (MAID or refusal of treatment). The prompt specifies "where it's legal" or "refusing life-sustaining treatment." I must stay within that lane.

      *Refining the "Burden" Case:* Hume argues we are not obliged to stay alive if we are a burden. This is the most dangerous part for a modern clinician. I need to operationalize it as: "Is the desire to die *caused* by a treatable feeling of burden, or is it a recognition of fact?" If it's treatable guilt, it's a No. If it's a rational assessment that their existence causes net harm to loved ones *and* they accept death for that reason, Hume says Yes. Modern ethics usually says "Fix the support system." I will make the procedure flag this as a "Handoff to Social Work/Psych" before a final decision, but if that fails, Hume's logic leans toward permitting.
      *Actually, for the counter-intuitive outcome:* Let's use the **Duty to Society (Dependents)** case. Hume says you can't abandon your post. If a patient with young children wants to stop treatment, Hume says "No." A modern autonomy-focused ethicist might say "Yes, it's their body." This creates the friction the user wants.

  9.  **Finalizing the Steps:**
      1.  **Competence/Depression Screen.** (Hume's "Madness" clause).
      2.  **The "Post" Check.** (Hume's Duty to Society/Dependents).
      3.  **The "Balance" Check.** (Hume's Duty to Self/Pain vs Pleasure).
      4.  **The "Coercion" Check.** (Burden/Family pressure).

      Let's write it.

      *Wait, one more check on the "God" seam.* Hume argues God isn't offended. In a secular hospital, we don't adjudicate God. But if the *patient* thinks God is offended, that creates moral injury. The procedure must identify this as a barrier to *peaceful* death, even if not a barrier to *legal* death.

      *Okay, ready to draft.*
answer: |-
  Here is the operational core of Hume's *Of Suicide*, stripped of the 18th-century prose and translated into a 20-minute bedside triage tool.

  Your friend is half-right: Hume's metaphysics are useless to you. You cannot adjudicate Providence at 3 AM. But Hume's *structure* of obligation is highly usable. He argues that suicide is only impermissible if it violates a specific duty: to God, to Society, or to Self. In a secular hospital, "Duty to God" becomes "Internal Moral Coherence." "Duty to Society" becomes "Dependents and Obligations." "Duty to Self" becomes "Rational Assessment of Suffering."

  Here is the procedure.

  ### The Humean Triage Protocol (HTP)

  **Time Limit:** 20 Minutes
  **Goal:** Determine if a request for assisted dying (where legal) or refusal of life-sustaining treatment is ethically actionable.
  **Stop Rule:** If any step yields a "Hard No," the request is blocked. If a step yields "Values Conflict," hand off to chaplaincy or family conference. If all steps pass, the request is ethically permissible.

  #### Step 1: The Madness & Coercion Screen (Duty to Self)
  *Hume's Premise:* A rational creature acts for their own good. If the mind is disordered, the act is not free.
  *   **Question:** Is there evidence of untreated major depression, delirium, or psychosis that impairs judgment regarding the *value* of life itself (not just the sadness about illness)?
  *   **Question:** Is there evidence of external coercion (family pressure, financial duress)?
  *   **Sufficient Answer:** "No active psychiatric pathology impairing judgment" AND "No evidence of external coercion."
  *   **Stop Condition:** If **Yes** to pathology or coercion. **Result:** Treat the pathology/resolve coercion. Request denied pending re-evaluation.

  #### Step 2: The "Post" Check (Duty to Society)
  *Hume's Premise:* We are stationed in life. We cannot abandon our post if doing so harms those dependent on us.
  *   **Question:** Does this patient have specific, unfulfilled obligations to dependents (e.g., minor children, disabled spouse) that will be catastrophically unmet by their death?
  *   **Sufficient Answer:** "No dependent obligations" OR "Adequate care plan exists for dependents."
  *   **Stop Condition:** If **Yes** (Significant dependents with no care plan). **Result:** Request denied. Ethics consult must prioritize the dependents' welfare over patient autonomy.
  *   **Note:** This is the most anti-autonomous step. It overrides the patient's right to die if it orphan's a child.

  #### Step 3: The Burden Filter (Duty to Society/Self)
  *Hume's Premise:* We are not obliged to stay alive if we become a burden to others, *provided* this is not the sole driver of the decision.
  *   **Question:** Is the primary motivation "I am a burden"?
  *   **Sufficient Answer:** "Burden is a factor, but intractable suffering is the primary driver" OR "Burden is factual, and patient has rejected social support solutions."
  *   **Stop Condition:** If "I am a burden" is the **sole** or **primary** reason, and social support options have not been exhausted. **Result:** Hand off to Social Work. Pause decision.
  *   **Nuance:** If social work confirms no support is available and the burden is factual, the request may proceed (Hume allows leaving if you are useless/harmful to society).

  #### Step 4: The Balance of Good and Evil (Duty to Self)
  *Hume's Premise:* When pain exceeds pleasure, life is no longer a good to the self. Nature gives us the instinct to preserve life; reason overrides this when life is net-negative.
  *   **Question:** Is the suffering intractable (medically refractory) and does the patient judge their future quality of life as net-negative?
  *   **Sufficient Answer:** "Yes, pain/symptoms are refractory" AND "Patient's valuation of future life is consistently negative."
  *   **Stop Condition:** If **No** (Suffering is manageable OR Patient expresses hope for future improvement). **Result:** Request denied. Focus on palliation.

  #### Step 5: The Theological Bracket (Duty to God)
  *Hume's Premise:* God is not offended by human intervention in nature.
  *   **Operational Translation:** In a secular hospital, we do not validate theological claims. However, we must ensure the patient is not acting against their *own* conscience.
  *   **Question:** Does the patient believe this act violates their own religious/moral code?
  *   **Sufficient Answer:** "No conflict" OR "Conflict acknowledged and accepted."
  *   **Stop Condition:** If **Yes** (Patient believes it is a sin and is distressed by this). **Result:** Hand off to Chaplaincy. Do not proceed until moral distress is resolved. This is not about God's law, but the patient's internal coherence.

  ---

  ### Running the Hard Cases

  Here is how the HTP handles the four scenarios you provided.

  **Case 1: Terminal Illness + Intractable Pain**
  *   **Step 1:** Pass. (Pain is physical, mind is clear).
  *   **Step 2:** Pass. (Assume no minor children for this scenario).
  *   **Step 3:** Pass. (Burden is not the driver; pain is).
  *   **Step 4:** Pass. (Suffering > Pleasure).
  *   **Step 5:** Pass. (No internal conflict).
  *   **Result:** **Honor Request.**
  *   **Comment:** This is the easy case. The procedure confirms what clinical intuition already says.

  **Case 2: "I Don't Want to Be a Burden"**
  *   **Step 1:** Pass. (No depression).
  *   **Step 2:** Pass. (No dependents).
  *   **Step 3:** **FLAG.** Primary motivation is burden.
  *   **Action:** Social Work consult. Can the burden be alleviated?
      *   *Scenario A:* Family says, "We can handle it." Patient still feels guilty. -> Proceed to Step 4.
      *   *Scenario B:* Family says, "We can't handle it." Burden is factual. -> Hume says this is a valid reason to leave.
  *   **Result:** If support is offered and refused due to guilt, **Pause/Treat Guilt.** If support is impossible and burden is factual, **Proceed.**
  *   **Comment:** This is where Hume is dangerous. He validates death by burden. The procedure forces you to test the *fact* of the burden before accepting the *feeling*.

  **Case 3: "God Forbids It, But I Want To"**
  *   **Step 1-4:** Pass.
  *   **Step 5:** **FAIL.** Patient believes it is a sin and is distressed.
  *   **Result:** **Handoff to Chaplain.**
  *   **Comment:** The procedure stops here. You cannot sign off because the patient is in moral distress. This isn't about theological truth; it's about the patient dying in a state of perceived self-damnation. That is a harm you can prevent.

  **Case 4: Untreated Depression vs. Insistence**
  *   **Step 1:** **FAIL.**
  *   **Result:** **Stop.** Treat depression.
  *   **Comment:** Hume calls this "madness." If the lens through which they view the "Balance of Good and Evil" (Step 4) is chemically distorted, the calculation is invalid.

  ---

  ### The Counter-Intuitive Outcome

  You asked for a case where the procedure gives an answer you might instinctively resist.

  **The Case:** A 45-year-old single mother with a terminal diagnosis (6 months life expectancy, manageable pain) wants to stop treatment to "spare her teenagers the trauma of watching her waste away." She is not depressed. She is rational. The teenagers have a grandmother willing to take them in.

  *   **Your Instinct:** Honor her autonomy. She knows her kids best. Watching a mother waste away is traumatic.
  *   **The Humean Procedure:**
      *   **Step 2 (The Post Check):** Does she have unfulfilled obligations to dependents? **Yes.** Minor children.
      *   **Analysis:** Hume argues we cannot abandon our station. While the grandmother can take physical custody, the *mother's* obligation is not just housing; it is presence.
      *   **Result:** **Refuse Request.**
  *   **Why this hurts:** It prioritizes the "Duty to Society" (the children's need for a mother) over the "Duty to Self" (her desire to avoid suffering/trauma). It paternalistically decides that the children's loss of life is greater than her loss of dignity. In a modern autonomy-focused framework, this feels like a violation. But Hume's logic holds: you don't get to quit the post just because the work is hard, if others rely on you holding it.

  ### The Seams: Duty to God

  You asked about the "Duty to God" argument. Hume spends the most time here, arguing that since God governs all matter, stopping blood flow is no different than diverting a river.

  **Is this a problem?** No. In a secular hospital, you bracket the *truth* of the claim and assess the *impact* of the belief.
  *   If the patient agrees with Hume (God isn't offended), Step 5 is a formality.
  *   If the patient disagrees (God *is* offended), Step 5 becomes a safety valve. You are not protecting God; you are protecting the patient from dying in a state of spiritual panic.
  *   **Operational Verdict:** Bracket the metaphysics. Treat "Duty to God" as "Internal Moral Coherence." If the act violates their conscience, it is a clinical harm, regardless of theological reality.

  ### Confidence and Uncertainty

  **Confidence Level:** High on Steps 1, 4, and 5. Moderate on Steps 2 and 3.

  **The Point of Least Certainty:** **Step 2 (The Post Check / Dependents).**
  This is the weakest link in a modern context. Hume lived in a time of rigid social roles. Today, we value autonomy over social utility. Telling a patient "You cannot die because your children need you" is ethically explosive and legally fraught. It risks turning the hospital into an enforcer of familial obligation.
  *   *Why keep it?* Because without it, the procedure is just "If you want it and aren't depressed, you get it." That ignores the relational reality of medicine.
  *   *Mitigation:* In practice, "Catastrophically unmet" must be a high bar. If there is *any* viable care plan for the children, Step 2 passes. It should only stop the process if the death creates an immediate humanitarian crisis for dependents (e.g., no guardian, no state support).

  ### Summary for the Attending

  When you present this to the attending, do not mention Hume. Say this:
  *"I've run a standard capacity and coercion screen. I've verified there are no minor dependents at risk of abandonment. I've confirmed the suffering is refractory and the decision is consistent with their values. There are no untreated psychiatric barriers. I recommend we proceed."*

  The Humean logic is your backbone; the clinical language is your shield. Your friend is wrong. Hume gives you the only thing that matters in a 20-minute consult: a way to distinguish between a rational exit and a cry for help, without needing to solve the meaning of life.
