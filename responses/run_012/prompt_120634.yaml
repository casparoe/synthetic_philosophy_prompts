answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The New Riddle of Induction and Predicate Projectibility
  **Signatories:** The Bayesian (A), The Entrenchment Theorist (B)

  **1. AGREED CLAIMS**
  1.  **Evidence:** Observed green emeralds (before time *T*) confirm "All emeralds are green" over "All emeralds are grue" for actual human agents.
  2.  **Formal Limits:** No purely syntactic or formal criterion distinguishes projectible from unprojectible predicates. Variant (ii) (*grue-ripe*: green until touched, then blue) confirms this: it shares *grue*'s logical structure but is projectible due to causal context. This does not break the claim; it reinforces that syntax is insufficient.
  3.  **Variant Outcomes:**
      *   (i) *Grellow* (Supernova index): Both predict **non-projectible**. The predicate is gerrymandered without causal grounding.
      *   (ii) *Grue-ripe* (Touch index): Both predict **projectible**. The predicate tracks a causal mechanism (oxidation/damage).
      *   (iii) *Uranium* (Undetermined decay): Both predict **non-projectible** as a color predicate, though the decay law itself is projectible.
  4.  **Dead Ends:** Solutions cannot rely on hidden time-indexing in "green" or claim *grue* is logically incoherent.

  **2. REMAINING DISAGREEMENTS**
  1.  **Source of Asymmetry:**
      *   *(A):* The asymmetry arises from rational prior probability assignments grounded in symmetry principles and background knowledge available to any rational agent.
      *   *(B):* The asymmetry arises from the actual history of linguistic usage; priors are merely the psychological shadow of social entrenchment.
  2.  **Normativity:**
      *   *(A):* An agent preferring *grue* is irrational, violating norms of probabilistic coherence.
      *   *(B):* An agent preferring *grue* is linguistically deviant, violating norms of communal practice.

  **3. CRUXES AND TEST CASES**
  **Crux 1: The Ahistorical Agent**
  *   **Question:** Can a rational agent with no linguistic history distinguish *green* from *grue*?
  *   **Test:** Simulate a learning agent with zero prior predicate usage but full logical capacity.
  *   **Prediction (A):** The agent will assign higher prior to *green* based on simplicity/symmetry.
  *   **Prediction (B):** The agent will remain indifferent; projectibility requires historical usage.

  **Crux 2: The Origin of Priors**
  *   **Question:** Are priors fundamental or derived?
  *   **Test:** Analyze whether "rational" priors change when linguistic history is altered (e.g., a community raised using *grue* as primitive).
  *   **Prediction (A):** Rational priors remain stable; the community is systematically biased.
  *   **Prediction (B):** Rational priors shift with usage; the community is rational relative to its history.

  **Crux 3: Variant (ii) Mechanism**
  *   **Question:** What makes *grue-ripe* projectible?
  *   **Test:** Remove the causal story (touch causes blue) but keep the predicate structure.
  *   **Prediction (A):** Projectibility drops because background knowledge (causal model) is removed.
  *   **Prediction (B):** Projectibility drops because the predicate lacks entrenchment in that specific causal context.

  **4. VERBAL DISPUTE NOTE**
  We acknowledge a partial verbal dispute regarding the term "Rational." (A) uses it to denote ahistorical probabilistic coherence; (B) uses it to denote successful alignment with communal practice. Resolving this definition would reduce friction but not settle the metaphysical source of induction.

  \answer{The source of prior bias}
