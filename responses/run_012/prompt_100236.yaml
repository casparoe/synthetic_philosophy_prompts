answer: |-
  To: Graduate Seminar in Pragmatics
  From: [Instructor]
  Subject: Specification for Theories of Conversational Implicature

  Before we evaluate the machinery of any specific account—whether Grice's original formulation, the Neo-Gricean heuristics, Relevance-Theoretic inference, or Truth-Conditional Pragmatics—we must agree on what counts as success. A theory of conversational implicature (CI) is not merely a taxonomy of examples; it is a cognitive and semantic hypothesis about how finite strings yield infinite meanings.

  Below is the specification. I have derived these desiderata by first listing the phenomena any theory must capture, then distilling them into testable requirements. I have distinguished between **Constitutive** constraints (if a theory violates these, it is not a theory of *conversational implicature*) and **Theoretical Preferences** (methodological choices that favor one school over another).

  ### I. The Phenomenological Base
  Any adequate theory must provide a unified explanation for the following data points without ad hoc stipulations:
  1.  **Scalar Restriction:** "Some of the students passed" implies *not all*, without asserting it.
  2.  **Clausal Implicature:** "Coffee or tea" implies *not both* (in certain contexts).
  3.  **Flouting/Meaning Reversal:** "War is war" (tautology) implies resignation; "You are a fine friend" (irony) implies the opposite.
  4.  **Relevance Bridging:** A: "Where is John?" B: "There is a yellow car outside." (Implies: John owns/drives the yellow car).
  5.  **Damning with Faint Praise:** "Mr. X has excellent handwriting" (in a reference letter) implies *he is no good at philosophy*.
  6.  **Unarticulated vs. Implicated:** "It is raining" implies *here*, but this location is arguably part of *what is said* (truth-conditional), not implicated. The theory must not collapse this distinction.

  ### II. The Desiderata Specification

  | Requirement | Definition & Test Case | Motivation / Datum | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Distinctness** | The theory must distinguish CI from *what is said* (truth-conditional content), *entailment*, *presupposition*, and *conventional implicature*. | *Case:* "He stopped smoking" (presupposes he smoked) vs. "He smoked some" (implicates not all). | **Constitutive** |
  | **2. Cancellability** | The implicated content must be denyable without contradiction, either explicitly ("Some, in fact all") or contextually. | *Case:* "Some of the students passed, and indeed all of them did." | **Constitutive** (with caveats*) |
  | **3. Reinforceability** | The speaker can explicitly state the implication without redundancy. | *Case:* "Some passed. In fact, not all passed." (Valid) vs. "All passed. In fact, all passed." (Redundant). | **Constitutive** |
  | **4. Non-Detachability** | The implicature must attach to the semantic content, not the specific words used. Synonyms should yield the same CI. | *Case:* "He stopped" vs. "He ceased." If CI changes, it's likely conventional, not conversational. | **Constitutive** |
  | **5. Calculability** | There must be a derivable path from *what is said* + *Cooperative Principle* + *Context* to the CI. | *Case:* Explaining *why* "Coffee or tea" suggests exclusivity via a maxim of Quantity/Manner. | **Theoretical Preference** (Gricean) |
  | **6. Defeasibility** | The CI must vanish in specific contexts without cancellation. | *Case:* "If you eat some of the cookies, you'll get a stomach ache." (No "not all" implication here). | **Constitutive** |
  | **7. Indeterminacy** | CIs need not be precise; they can be vague ranges of meaning. | *Case:* A reference letter implies the candidate is weak, but not *exactly* how weak. | **Constitutive** |
  | **8. Intentionality** | The CI must be grounded in speaker meaning (reflexive intentions), not just hearer inference. | *Case:* A text message vs. a live utterance. | **Theoretical Preference** (Gricean) |
  | **9. Cognitive Plausibility** | The mechanism for deriving CI must align with processing time and acquisition data. | *Datum:* Scalar implicatures often incur processing cost; children acquire them late. | **Constitutive** (Modern Constraint) |
  | **10. Non-Human Applicability** | The theory must account for implicature-like phenomena in texts, signs, or AI where no mind is present. | *Case:* A warning sign "Slippery Floor" implies "Walk carefully." | **Theoretical Preference** (Anti-Gricean) |

  *\*Note on Cancellability: See Section III.*

  ### III. The Incompatibility Constraints (The "Trap")

  You asked where the desiderata conflict. A theory that satisfies all of the above perfectly is likely too vague to be falsifiable. Here are the specific tension points where a theory must make a costly trade-off.

  **1. Calculability vs. Default Generation (The Speed Problem)**
  *   **The Tension:** Requirement 5 (Calculability) demands a reasoning process based on maxims. Requirement 9 (Cognitive Plausibility) suggests that generalized implicatures (like "some" -> "not all") are processed rapidly, often like defaults.
  *   **The Conflict:** If the hearer must reason through the Maxim of Quantity every time they hear "some," processing should be slow and effortful. If it is a default (Neo-Gricean), it is fast, but then it is not *calculated* in the Gricean sense. You cannot have a derivation that is both a conscious(able) logical proof and a lexicalized default.
  *   **Decision Point:** A theory must choose: Is CI a *process* (Grice/Relevance) or a *product* (Neo-Gricean)?

  **2. Cancellability vs. Embedding (The Scope Problem)**
  *   **The Tension:** Requirement 2 (Cancellability) is the gold standard for distinguishing CI from entailment. However, in embedded contexts, CIs behave like entailments.
  *   **The Conflict:** Consider: "It is not the case that John ate some of the cookies." On the standard view, "some" implicates "not all." But under negation, does that implicature survive? If I say "I didn't eat some of the cookies (I ate all of them)," the implicature seems to vanish. But in "If John ate some of the cookies, he will be sick," the "not all" inference often disappears locally. Yet, experimental data suggests listeners sometimes process the scalar inference *inside* the embedding.
  *   **Decision Point:** If CIs embed, they look like semantic content (violating Distinctness). If they don't embed, the theory fails to predict actual interpretation in complex sentences. The standard cancellability test breaks down here.

  **3. Intentionality vs. Non-Human Applicability**
  *   **The Tension:** Requirement 8 (Intentionality) is central to Grice. Requirement 10 (Non-Human) acknowledges that we interpret texts and signs pragmatically.
  *   **The Conflict:** A book or an AI does not have reflexive intentions. If we say they "implicate," we stretch the definition of CI beyond speaker meaning. If we say they don't, we cannot account for how we extract meaning from written law or code using pragmatic principles.
  *   **Decision Point:** Is CI a psychological state or a normative property of communication?

  ### IV. Non-Standard Cases for Seminar Discussion

  Do not let your students rely on "Some/All" and "War is War." Assign these three cases to force the theories to break.

  **Case 1: The Mismatched Premise (Speaker vs. Hearer)**
  *   **Scenario:** Speaker says, "The door is open," believing the Hearer knows the premise "If the door is open, the cat is out." The Hearer, lacking this premise, takes the Speaker to be *asserting* that the cat is out, not implicating it.
  *   **Theoretical Force:** This forces the theory to decide: Is CI determined by **Speaker Intention** (Grice) or **Hearer Uptake** (Uptake-based views)? If the speaker didn't intend the cat-proposition as an implication, but the hearer recovered it as one, did an implicature occur?
  *   **Requirement Stress:** Tests **Intentionality** vs. **Distinctness**. If the hearer treats it as *said*, but the speaker meant it as *implicated*, the boundary collapses.

  **Case 2: The Embedded Indefinite (Local Implicature)**
  *   **Scenario:** "If John solves some of the problems, he will pass the exam."
  *   **Theoretical Force:** Standard Gricean theory predicts no scalar implicature ("not all") here because asserting "some" in the antecedent is not less informative than "all" in a way that triggers the maxim. However, listeners often infer "If he solves some (but not all)..."
  *   **Requirement Stress:** Tests **Calculability** and **Cancellability**. If the implicature is generated locally within the conditional, the Global Calculability model fails. If it is not generated, the theory contradicts intuition. This is the primary battleground for Semantic vs. Pragmatic intrusion.

  **Case 3: The Unintentional Revelation (The Freudian Slip)**
  *   **Scenario:** A diplomat says, "We are committed to peace," but slips and says "We are committed to *dominance*," then corrects himself. The audience infers he believes in dominance.
  *   **Theoretical Force:** There was no intention to communicate "We believe in dominance." Yet, the audience treats it as a meaningful signal.
  *   **Requirement Stress:** Tests **Intentionality**. A strict Gricean must say this is *not* an implicature (no M-intention). A normative theory might say the *act* carries the implication regardless of mind. This tests whether CI is a matter of psychology or social norm.

  ### V. Verdict and Evaluation of Contenders

  Here is my assessment of how the major contenders fare against this specification. I am prioritizing reasoning over a clean winner, because the "winner" depends on which desiderata you are willing to sacrifice.

  **1. Grice's Original Account**
  *   **Performance:** Fails **Cognitive Plausibility** and **Embedding**.
  *   **Reasoning:** Grice treats CI as a conscious(able) derivation. Psycholinguistics shows scalar inferences are often automatic. Furthermore, Grice's global derivation cannot easily handle implicatures that seem to scope under negation or conditionals (Case 2).
  *   **Verdict:** Historically foundational, but empirically obsolete as a processing model.

  **2. Neo-Gricean Default Views (Horn, Levinson)**
  *   **Performance:** Satisfies **Cognitive Plausibility** but sacrifices **Calculability**.
  *   **Reasoning:** By positing heuristics (Q, I, M), they explain the speed of inference. However, this makes CI look suspiciously like semantic default content. It struggles with **Intentionality** in cases of mismatch (Case 1), as defaults fire regardless of specific speaker intent.
  *   **Verdict:** Best for generalized implicatures, weak on particularized context-driven cases.

  **3. Relevance Theory (Sperber & Wilson)**
  *   **Performance:** Satisfies **Cognitive Plausibility** and **Embedding**, but rejects **Conversational Maxims** (Distinctness).
  *   **Reasoning:** RT dissolves the Gricean maxims into a single cognitive principle of relevance. It handles embedded implicatures (local enrichment) better than Grice. However, it blurs the line between *what is said* (explicature) and *what is implicated*, potentially violating **Distinctness**.
  *   **Verdict:** The strongest cognitive model, but it changes the subject from "Conversational Implicature" to "Pragmatic Inference" broadly.

  **4. Truth-Conditional Pragmatics (Recanati, Travis)**
  *   **Performance:** Satisfies **Context Sensitivity**, but collapses **Distinctness**.
  *   **Reasoning:** TCP argues that pragmatic enrichment happens *before* truth conditions are fixed. This solves the embedding problem (Case 2) effortlessly. However, if pragmatics determines truth conditions, the distinction between *said* and *implicated* (Requirement 1) is severely eroded.
  *   **Verdict:** Philosophically radical, but risks making the category of "implicature" vanish entirely.

  **The Single Most Exclusionary Requirement:**
  **Requirement 2 (Cancellability) in Embedded Contexts.**
  This is the knife-edge. If you insist that CIs *must* be cancellable in all contexts, you rule out TCP and most modern semantic-pragmatic interface theories that allow local enrichment. If you allow CIs to be non-cancellable in embeddings, you blur the line between CI and Entailment, threatening the entire taxonomy of the field.

  **My Provisional Conclusion:**
  **Relevance Theory** satisfies the most desiderata while failing the fewest, *provided* you are willing to redefine "what is said" (Explicature) to include pragmatic enrichment. It handles the processing data, the embedding cases, and the intentionality issues (via ostensive-inferential communication) better than the others. However, it fails the **Non-Human Applicability** test (Requirement 10) because it is strictly cognitive.

  **Where I Might Be Wrong:**
  My reconstruction of the **Cancellability Test** assumes it is a binary pass/fail. It is likely wrong to treat it as such. Evidence that would change my mind would be robust psycholinguistic data showing that "cancelled" implicatures still leave a processing residue (priming effects). If a cancelled implicature still slows down reading time, then Cancellability is not a test of *existence*, but only of *commitment*. If that is true, Requirement 2 must be downgraded from Constitutive to Diagnostic, which would vindicate Truth-Conditional Pragmatics over Relevance Theory.

  **Instruction for Students:**
  Do not accept the table as dogma. Your first paper assignment is to take one of the "Incompatibility Constraints" and argue that the tension is illusory. If you can dissolve the tension between Calculability and Default without resorting to ambiguity, you will have made a genuine contribution to the field.
