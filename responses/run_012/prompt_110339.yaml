answer: |-
  The spectrum argument against the transitivity of 'better than' posits a sequence of options $A_1, A_2, ..., A_n$, where each adjacent pair $A_i, A_{i+1}$ is such that $A_i$ is better than $A_{i+1}$ (or perhaps merely not worse), yet the final option $A_n$ is intuitively better than $A_1$. This creates a cycle or a breakdown of transitivity: if $A_1 > A_2 > ... > A_n$, then logically $A_1 > A_n$, contradicting the intuition that $A_n > A_1$.

  This paradox relies on the assumption that 'better than' is a binary relation that holds absolutely between options, independent of how those options are apprehended. I argue that this assumption is false. 'Better than' is not a binary relation $x > y$, but a ternary relation $x >_g y$, where $g$ represents the **granularity** of the evaluation. The apparent intransitivity in spectrum arguments is an artifact of sliding between different granularities within a single chain. Once comparisons are indexed to a fixed granularity, transitivity is restored.

  ### 1. What Fixes a Granularity?

  To save transitivity, we must first define what granularity is and what determines it. Granularity refers to the **resolution of evaluative attention**. In any assessment of value, an agent does not process every microscopic difference between options. Instead, the agent employs a "scale" that treats differences below a certain threshold as negligible (noise) and differences above it as significant (signal).

  What fixes this granularity? It is not arbitrary, nor is it solely determined by the properties of the options themselves. Granularity is fixed by the **Practical Context of Choice**.

  The Practical Context includes the purpose of the decision, the stakes involved, and the cognitive resources available. For example, when choosing between two investment portfolios differing by one cent, a retail investor's granularity is too coarse to register the difference; the options are evaluatively equivalent relative to that context. A high-frequency trading algorithm, operating in a different practical context, employs a finer granularity where that cent is decisive.

  Thus, a granularity $g$ is fixed by the *discriminatory threshold relevant to the agent's purpose*. Once a context is selected, the threshold is set. Within that context, value differences are either detectable and significant, or they are not. This creates a determinate ordering for that context.

  ### 2. Handling the Spectrum Case

  Consider a standard spectrum argument involving quality and quantity of life. $A_1$ is a life of very high quality but short duration. $A_n$ is a life of very low quality but extremely long duration. The chain proceeds by slightly lowering quality and slightly increasing duration at each step.

  The intuition pump works like this:
  1.  **Adjacent Steps:** $A_i$ seems better than $A_{i+1}$ because the loss in quality is negligible (below our threshold of concern), while the gain in duration is also negligible. Or, we focus on quality, seeing the drop as irrelevant, so we prefer the higher quality $A_i$.
  2.  **Endpoints:** $A_n$ seems better than $A_1$ because the accumulation of duration outweighs the drastic drop in quality.

  The granularity account diagnoses this as a shift in $g$.
  *   **In the adjacent comparisons ($A_i$ vs $A_{i+1}$):** The agent implicitly adopts a **coarse granularity regarding quality**. The slight degradation is treated as "noise" or equality. The comparison is effectively: "Holding quality roughly constant, is the duration gain worth it?" If the duration gain is also treated as noise, the agent may default to a status quo bias or a lexical preference for the earlier option, judging $A_i \geq A_{i+1}$.
  *   **In the endpoint comparison ($A_1$ vs $A_n$):** The agent implicitly adopts a **fine granularity regarding quantity** and a **coarse granularity regarding quality categories**. The massive duration difference is now "signal." The quality difference is categorized broadly (e.g., "worth living" vs. "barely worth living").

  If we fix the granularity $g$ for the whole chain, the paradox dissolves.
  *   **Case 1 (Fine Granularity):** If the context demands we notice every slight drop in quality and every slight gain in duration, then the trade-off rate is constant. If a small duration gain never compensates for a small quality loss at step 1, it never compensates at step 500. Transitivity holds, and $A_1 >_g A_n$. The intuition that $A_n$ is better is revealed as a context-shift error.
  *   **Case 2 (Coarse Granularity):** If the context treats small differences as equal, then $A_i =_g A_{i+1}$ for many steps. The chain does not establish a strict ordering $A_1 > A_2 > ...$. It establishes a chain of equivalences until a threshold is crossed where the difference becomes significant. At that specific point, the ordering flips or becomes determinate. Transitivity holds within the segments of equivalence and the segments of ordering.

  The intransitivity arises only if we claim $A_i > A_{i+1}$ based on a granularity that ignores quality drops, but claim $A_n > A_1$ based on a granularity that aggregates those drops. By indexing the relation ($>_g$), we see that $A_i >_{g1} A_{i+1}$ and $A_n >_{g2} A_1$ are compatible, but they do not form a single transitive chain because $g1 \neq g2$.

  ### 3. Objection 1: The Appeal to Granularity is Ad Hoc

  **Objection:** One might argue that introducing granularity is a convenient trick to save the principle of transitivity. It looks like a theoretical patch designed solely to avoid the counter-intuitive results of spectrum arguments, without independent justification.

  **Response:** The appeal to granularity is not ad hoc because it reflects the fundamental structure of human cognition and language, independent of value theory. 'Better' is a gradable adjective, akin to 'tall', 'rich', or 'flat'. Whether a surface counts as "flat" depends on the granularity of the context (a dance floor vs. a molecular lattice). It would be absurd to claim that 'flat' is intransitive because a floor is flat for dancing, but not flat for physics.

  Similarly, evaluative judgments are acts of discrimination. To judge is to distinguish. Distinguishing requires a scale. To demand that 'better than' operate without a scale is to demand that agents process infinite information with zero threshold for discrimination. This is not a neutral baseline; it is an impossible cognitive ideal.

  Therefore, indexing 'better than' to granularity is not a patch to save transitivity; it is a correction of a category error in the formulation of the relation. Transitivity is a logical norm for relations within a fixed system. If the system parameters (granularity) shift, the logical norm does not apply across the shift. Acknowledging this aligns value theory with semantic contextualism and cognitive psychology, providing independent motivation for the view.

  ### 4. Objection 2: Granularity Collapses into Incommensurability

  **Objection:** If $x >_g y$ but not $x >_{g'} y$, does this not mean $x$ and $y$ are simply incommensurable? If the verdict changes based on the "scale," isn't there no fact of the matter about which is better? This view似乎 (seems to) reduce 'better than' to a subjective choice of metric, rendering rational choice impossible.

  **Response:** This objection conflates **relativity** with **incommensurability**.
  *   **Incommensurability** implies that there is *no* common measure or rational basis for comparison. It suggests a void in the normative landscape.
  *   **Granularity-Relativity** implies there are *multiple* valid measures, each yielding a determinate result within its frame.

  The distinction is crucial for action. Incommensurability paralyzes choice (if neither is better, why choose?). Granularity directs choice (you must select the granularity appropriate to your context).

  When an agent faces a spectrum, they are not facing a void; they are facing a choice of **evaluative frame**. Once the Practical Context fixes the frame (e.g., "I am choosing a career for lifetime satisfaction" vs. "I am choosing a career for immediate income"), the granularity is fixed. Within that frame, $x >_g y$ is an objective fact.

  Furthermore, granularities are not isolated silos. They can be rationally ranked. A granularity that ignores significant suffering to focus on minor conveniences can be criticized as *morally inappropriate* for the context. Thus, we can have a higher-order judgment about which granularity $g$ is appropriate. This preserves the objectivity of value without requiring a "view from nowhere" that ignores resolution.

  Transitivity is preserved because, for any *appropriate* granularity $g$, the relation $>_g$ is a strict weak ordering. The spectrum argument fails because it attempts to chain together comparisons made under inappropriate or shifting granularities. By insisting on a fixed $g$, we do not collapse into incommensurability; rather, we clarify that rational choice requires committing to a scale of evaluation.

  ### Conclusion

  The spectrum argument against transitivity relies on the illusion that 'better than' is a context-free binary relation. By recognizing that evaluative comparisons are inherently granular—indexed to a resolution fixed by the practical context—we see that the chain of comparisons in a spectrum argument illicitly shifts parameters. $A_1 > A_2$ may hold at granularity $g_1$, and $A_n > A_1$ at granularity $g_2$, but this violates no logical law because the relations are distinct.

  Transitivity remains a valid norm for reasoning within a fixed evaluative frame. The paradox is not a failure of logic, but a failure to recognize that value, like measurement, requires a unit of account. Acknowledging this does not render value subjective or incommensurable; it renders it actionable, grounded in the specific contexts in which agents actually live and choose.
