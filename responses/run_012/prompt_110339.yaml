          5.  Constraint: Argue on the merits; no survey of the literature.

  2.  **Initial Conceptualization & Definitions:**
      *   *Spectrum Arguments:* Usually involve a sequence $A_1, A_2, ..., A_n$. $A_1$ is clearly better than $A_2$ (or vice versa), $A_2$ better than $A_3$, etc., but $A_n$ seems better than $A_1$, violating transitivity ($A > B, B > C \implies A > C$). Or, small differences accumulate to a large reversal.
      *   *Granularity:* This is the key metaphor. Think of resolution, scale, or the "unit of account" in evaluation. A coarse grain sees forests; a fine grain sees trees.
      *   *The Thesis:* The relation $x > y$ is incomplete without a parameter $g$ (granularity). So, $x >_g y$. Transitivity holds within a fixed $g$. The spectrum argument fails because it implicitly shifts $g$ along the chain (e.g., focusing on quality in early steps, quantity in later steps).

  3.  **Developing the "Granularity" Concept:**
      *   What fixes a granularity? It can't be arbitrary. It needs to be tied to the *evaluative context* or the *purpose of the choice*.
      *   Let's define granularity as the *resolution of relevant properties*. When comparing two options, we attend to certain properties and ignore others (treat them as noise or equal).
      *   *Fixing Factor:* The "Decision Context" or "Evaluative Frame." If I'm choosing a life partner, "kindness" might be coarse-grained (kind/not kind). If I'm choosing a surgeon, "precision" is fine-grained.
      *   *Formalization:* $x >_g y$ means "At resolution $g$, the net value of $x$ exceeds $y$."
      *   *Transitivity:* If $x >_g y$ and $y >_g z$, then $x >_g z$. This should hold because at resolution $g$, the values are determinate numbers (or ordered sets).

  4.  **Handling the Spectrum Case:**
      *   *Example:* Parfit's Spectrum (Mozart life vs. Muzak life). Or the classic "Sweetness" spectrum (cup of coffee with 1 grain less sugar). Let's use a generic Quality vs. Quantity spectrum.
      *   *Scenario:* $A$ (High Quality, Low Quantity) ... $Z$ (Low Quality, High Quantity).
