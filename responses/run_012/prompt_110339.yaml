      *   *Resolution:* The paradox arises because we allow the "just noticeable difference" to shift. If we fix the metric (granularity), the chain either holds transitivity (and $Z$ is not better than $A$) or breaks the adjacent links (and the chain doesn't start).

  5.  **Addressing Objection 1: Ad Hocery:**
