answer: |-
  **Brainstorming Candidate Cranes**

  1.  **The Lineage of Attention:** Dana's specific way of listening wasn't magic; it was a tool handed down from her own mentor, modified by her marriage, and sharpened by forty years of classroom practice. It treats her kindness as a technology, not a saintly attribute.
  2.  **The Architecture of Grief:** Our sadness isn't a ghostly echo; it is the physical weight of habits we formed around her. We reach for the phone because she trained us to call. The pain is the structure she built remaining standing after the builder is gone.
  3.  **Scaffolding Loss (The Chosen Example):** *Fluency in a native language.* As children, we required constant correction, repetition, and support (the scaffolding) to learn to speak. Once fluent, that support is dismantled. To an observer, speech looks like a skyhook—instant meaning appearing from thin air. But it is a crane, built from millions of discarded errors.

  ***

  **The Toast**

  [Stand, clink glass gently. Wait for the room to settle.]

  Friends, colleagues, family.

  Dana Ruiz spent forty years teaching us to distrust the magic trick. She taught us that when we see something wondrous—a wing, an eye, a mind—we must not look for the skyhook. We must look for the crane. We must look for the pulley, the lever, the ordinary parts assembled into something extraordinary.

  So, in her honor, I am going to break a rule of memorial dinners. I am not going to tell you that her spirit lives on. I am not going to tell you she was irreplaceable. Those are skyhooks. They are explanations by fiat. They suggest she appeared from nowhere and departed to nowhere. Dana would have raised an eyebrow at that. She would have asked: *What are the parts? Where did they come from? How was this actually built?*

  Dana was a crane. She was assembled from the patience of her mother, the skepticism of her first department chair, and the specific, stubborn habit of reading every student draft twice. Her brilliance was not a spark from the heavens; it was a friction generated by rubbing her mind against ours, over and over, for decades. To say this is not to diminish her. It is to honor the labor.

  There is a concept she was working on when she died. She called it "scaffolding loss."

  Consider a child learning to speak. For years, parents provide a scaffold. They correct grammar, they supply missing words, they interpret babble. It is slow, messy work. But once the child is fluent, the scaffolding is dismantled. The corrections stop. The support vanishes. To an outsider, the child's speech now looks like a skyhook—meaning appearing instantly from thin air. The work has disappeared into the result.

  Dana was that scaffolding for all of us in this room.

  For the academics here: She held up your arguments until they could stand on their own. She was the temporary support that allowed your theories to harden. Now that she is gone, the support is removed. Your success might look like it came from nowhere, like you simply "knew" what to do. But look closer. The structure you are standing on is the shape of her mind.

  For her family: You saw the scaffolding being built. You saw the late nights, the worry, the phone calls. You know the cost of the assembly. When we say "she was kind," we are describing a machine she built out of discipline. She chose, every morning, to prioritize curiosity over judgment. That is not a trait you are born with. That is a structure you weld together, piece by piece.

  Now, I know what some of you are thinking. Some of you fear that if we explain the machinery, we explain away the magic. If we reduce her love to neurochemistry and habit, or her intellect to historical contingency, do we lose the beauty?

  Dana insisted that explaining something is not the same as explaining it away.

  Knowing the wavelength of light does not explain away the sunset. Knowing the evolution of the vocal cords does not explain away the opera. And knowing that Dana was built from the same ordinary matter as the rest of us does not explain away her greatness. It makes it more impressive. It means that *this*—what she was, what she did—is possible. It means the parts are available. It means the crane can be built again, if we are willing to do the work.

  She is not gone in the way a light bulb goes out. She is gone in the way a bridge remains after the construction crew leaves. The structure is still here. It is in the papers we write, the questions we ask, and the way her grandchildren pause before they answer.

  So, do not look for her in the sky. Look for her in the assembly. Look for the crane.

  Raise your glasses.

  To the scaffolding that held us. To the work that remains. To Dana.
