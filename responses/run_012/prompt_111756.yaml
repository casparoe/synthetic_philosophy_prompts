      *   *The Crucial Case:* A state systematically destroys all religious texts, bans all rituals, and bulldozes all historical sites of a minority, but leaves the people alive, employed, and housed. No deaths. No written intent to destroy the people, only to "secularize."
      *   *If Genocide:* She defines genocide as cultural death.
