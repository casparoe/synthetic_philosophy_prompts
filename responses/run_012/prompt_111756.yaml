      *   *Hypothesis A (Strict Legalist/1948 Convention):* Genocide requires intent to destroy a national, ethnical, racial, or religious group *in whole or in part* through specific acts (killing, causing serious harm, imposing conditions of life, preventing births, transferring children). Cultural destruction alone is generally *not* genocide under strict international law (ICJ jurisprudence).
      *   *Hypothesis B (Lemkinian/Sociological):* Raphael Lemkin originally conceived genocide as the destruction of the *group's existence*, which includes culture, language, and institutions, not just mass murder.
