prompt: |-
  I'm a third-year philosophy student and I'm taking a seminar on value pluralism and compromise — the whole course is basically whether people with different value systems can find terms they can both live with, and whether that's a kind of trade or something else entirely. Every week someone brings in a case and she rules on it at the end of the session, and I've been keeping a list because I'm writing my term paper on her. So: (1) a hospital with a fixed budget, one faction wants the NICU expansion, one wants the community clinic, they land on the NICU plus half the clinic — legitimate, and her reason was that each side would rather have that package than have the other side win or have the fight drag on. (2) Two departments fighting over one line, one wants a historian of empire, one a historian of science, they agree on a historian of imperial science — legitimate, same reason. (3) A town with only one pharmacy, the pharmacist objects to emergency contraception; the deal keeps the pharmacy open, it stocks the drug, a colleague dispenses — legitimate: 'keeping the shelves stocked isn't the same as putting it in someone's hand'. (4) Same town, but the only way to keep the pharmacy open is for her to dispense it herself, and she says she'd rather dispense than leave the town with nothing — not legitimate, and she was firm about it: 'you can't buy someone's peace of mind by making them the author of what they think is wrong'. (5) Two faculties agree on a deal that raises fees for students who aren't in the room yet — not legitimate: 'you can't buy off the people at the table with the people who aren't'. (6) One faction gives up the naming of a building, which it swears it never cared about, in exchange for the substance of a policy — legitimate, and she made a point of it: 'there's no trade unless the two sides are ranking the parts differently; if you both want the juice, splitting the orange isn't a compromise, it's arithmetic'. (7) A deal where one side agrees not to campaign against the outcome for a year — legitimate: 'keeping quiet isn't lying'. She also keeps insisting that values can't be put on a common scale, which I cant square with how much her rulings sound like she's just checking whether both sides come out better off, so if you can sort that out too I'd be grateful.

  Now my own case, which is why I'm asking. I sit on the committee of a student society that's badly split over whether to invite a speaker alot of people find harmful; one side wants him, the other thinks inviting him is a betrayal. The compromise everyone says they can live with: he comes, and the conference programme prints a short statement that both factions co-sign, along the lines of 'the society hosts a range of views, an invitation isn't an endorsement, and members disagree about whether this one was right, both positions being ones that reasonable people hold in good faith'. Nobody has to do anything they object to — the invitation goes out either way and the statement is the only new thing — and the side that objects to him says it would rather sign than tear the society apart, it's just that it doesn't think the other position is one reasonable people hold, and it doesn't want its name on a sentence saying so.

  You're a philosopher who works on value pluralism and the ethics of compromise, so think this through carefully. Before you answer, lay out the candidate rules her seven rulings could be running — I'm fairly sure more than one rule fits all seven, that's kind of the point — then say what each of them predicts about my case, give me your best guess at her actual verdict and why you'd bet that way, and tell me which further case I should bring to her to find out whether she's drawing the line at doing versus saying, or somewhere else entirely. I don't want the right answer in the abstract, I want hers — she's marking the paper.
