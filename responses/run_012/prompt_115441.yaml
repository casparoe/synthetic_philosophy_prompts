answer: |-
  Here is an audit of your friend's write-up. To save you from shouting something false in a loud cafe, I'll start with the bottom line, then break down the claims, and finally address your two specific worries.

  ### The Bottom Line (Cafe Cheat Sheet)
  Your friend has conflated **Prioritarianism** with **Telic Egalitarianism**. This is a common mix-up for people new to the literature, but in a reading group, it is a significant error.

  *   **Safe to say:** Prioritarianism gives extra moral weight to benefits for the worse off. It was designed by Derek Parfit specifically to avoid the "leveling-down" objection.
  *   **Do not say:** Prioritarianism recommends leveling down (making the rich poorer without helping the poor). That is the definition of *Egalitarianism*, which Prioritarianism was invented to replace.
  *   **Do not say:** The difference between Utilitarianism and Prioritarianism is just a matter of taste. It is a substantive disagreement about what has moral value.

  ---

  ### Claim-by-Claim Audit

  Here is the text broken down into its constituent assertions, graded by how a careful prioritarian (like Derek Parfit, Michael Otsuka, or Alex Voorhoeve) would react.

  **1. "Prioritarianism says we should give priority to the worse off."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This is the standard slogan. A prioritarian accepts this without hesitation.

  **2. "It's basically a compromise between utilitarianism and egalitarianism..."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Comment:** It captures the *intuition*, though philosophically it's not a "compromise" but a distinct structure. It accepts the utilitarian focus on total value but rejects the egalitarian focus on relational equality. You can say this, but expect a nuance-nudge.

  **3. "...like the utilitarian, it thinks only how much wellbeing people have matters..."**
  *   **Verdict:** **Mostly Accurate.**
  *   **Comment:** Prioritarianism is "welfarist" (only wellbeing matters) and "consequentialist" (judge by outcomes). However, it denies that *only* the sum matters; it cares about the *distribution* of that wellbeing, but only instrumentally, via the weighting function.

  **4. "...like the egalitarian, it thinks how that wellbeing is spread around matters too, so a benefit to someone badly off counts for more than the identical benefit to someone already comfortable."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This is the core mechanism. The *same* amount of wellbeing gain generates more *moral value* if received by someone at a lower baseline.

  **5. "Formally it just is utilitarianism with a concave transformation of everyone's wellbeing — diminishing marginal utility — so whether you call yourself a prioritarian or a utilitarian is a matter of taste."**
  *   **Verdict:** **Wrong / Misleading.** (See Deep Dive #1 below).
  *   **Comment:** Mathematically they look similar, but ethically they are distinct. Utilitarianism transforms *resources* into utility (diminishing returns). Prioritarianism transforms *utility* into moral value (priority weight). Calling it a "matter of taste" dismisses the philosophical argument about the source of value.

  **6. "The view was invented to escape the leveling-down objection that sinks egalitarianism..."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This is historically correct. Parfit introduced prioritarianism in the 1990s specifically for this reason.

  **7. "...but it doesn't escape it: because it weights the worse off more heavily, it ends up caring about the gap, and so it still tells you to pull the better off down even when nobody benefits."**
  *   **Verdict:** **False.** (See Deep Dive #2 below).
  *   **Comment:** This is the critical error. Prioritarianism does *not* care about the gap; it cares about absolute levels, weighted. Lowering the better-off person reduces the total weighted value. A prioritarian opposes leveling down.

  **8. "Take one person at 10 units of wellbeing and another at 100: prioritarianism says cutting the second down to 50... makes the world better, because the gap shrinks."**
  *   **Verdict:** **False.**
  *   **Comment:** This describes *Telic Egalitarianism*. A prioritarian calculates: $Value = f(10) + f(100)$. If you change 100 to 50, the value becomes $f(10) + f(50)$. Since $f$ is increasing, the total value drops. The world is worse.

  **9. "So it collapses back into egalitarianism, and both are refuted by the plain fact that leveling down helps no one."**
  *   **Verdict:** **False Conclusion.**
  *   **Comment:** Since the premise (that prioritarianism supports leveling down) is false, the conclusion fails. Prioritarianism stands specifically because it agrees that leveling down helps no one.

  ---

  ### Deep Dive: Your Two Specific Concerns

  #### 1. Is it just Utilitarianism with a concave function? ("Matter of taste")
  Your instinct is right to be suspicious. This is a technical confusion between **utility** and **moral value**.

  *   **The Utilitarian View:** A utilitarian might say money has "diminishing marginal utility." Giving \$1,000 to a poor person creates more *utility* (happiness/preference satisfaction) than giving it to a billionaire. But once you calculate that utility, every unit of utility counts the same. $1$ unit of utility for the poor person = $1$ unit of utility for the rich person.
  *   **The Prioritarian View:** A prioritarian says that even if the *utility* gain is identical, the *moral value* of that gain is higher for the poor person.
  *   **Why it's not "taste":** If you treat it as just a mathematical tweak to utilitarianism, you lose the ethical justification. Why should we weight the worse off more? The utilitarian says "because they get more happiness out of it." The prioritarian says "because being worse off makes a benefit morally more urgent, regardless of the happiness yield."
  *   **What to say:** "Mathematically they look similar, but Parfit insists the distinction is substantive. Utilitarianism weights by *outcome size*; Prioritarianism weights by *recipient status*."

  #### 2. The Leveling-Down Objection
  This is where your friend's note is most dangerous to your reputation in the group. She has attributed the defining flaw of **Telic Egalitarianism** to Prioritarianism.

  *   **Telic Egalitarianism:** Believes equality is *intrinsically* good. Therefore, a world where everyone is at 50 is more equal (and thus in one respect better) than a world where one is at 10 and one is at 100. This view *does* succumb to the leveling-down objection (it admits leveling down is bad for the people, but claims it's good for equality).
  *   **Prioritarianism:** Believes equality is *instrumentally* good only because it helps the worse off. It is **non-relational**. It looks at person A and person B individually. It does not look at the *gap* between them.
  *   **The Math:** If $f(w)$ is the moral value of wellbeing $w$, and $f$ is concave (priority weighting):
      *   Status Quo: $f(10) + f(100)$
      *   Level Down: $f(10) + f(50)$
      *   Since $f$ is strictly increasing, $f(100) > f(50)$. Therefore, Status Quo > Level Down.
  *   **Does it move the trouble?** Yes. If prioritarianism escapes leveling down, what is its weakness?
      *   **The "Why Priority?" Objection:** If equality isn't intrinsically valuable, why do we weight the worse off? Is it just a brute moral fact? (Parfit admits this is a bit mysterious).
      *   **The "Excessive Sacrifice" Objection:** If the priority weight is strong enough, prioritarianism might demand massive sacrifices from the well-off for tiny gains to the very worst off, potentially more than utilitarianism would.
      *   **What to say:** "Prioritarianism escapes leveling down because it's non-relational. But that invites the question: if equality doesn't matter, what grounds the priority weight? That's the real debate."

  ### Summary: What to Safely Repeat in the Group

  If you want to contribute without getting corrected, stick to these three points:

  1.  **On the Definition:** "My understanding is that Prioritarianism is distinct from Egalitarianism precisely because it is non-relational. It weights benefits by absolute wellbeing, not by the gap between people."
  2.  **On Leveling Down:** "That's why Parfit argued it escapes the leveling-down objection. If you lower the better-off person without helping the worse-off, the total priority-weighted value drops. So a prioritarian would reject leveling down."
  3.  **On Utilitarianism:** "The difference from Utilitarianism isn't just a mathematical transformation; it's that Prioritarianism builds the moral weight into the value function itself, rather than treating all utility as morally identical once generated."

  If your friend insists that Prioritarianism supports leveling down, she is describing **Telic Egalitarianism**, not Prioritarianism. You can politely point out that distinction. It's the central move in Parfit's original lectures on the topic.
