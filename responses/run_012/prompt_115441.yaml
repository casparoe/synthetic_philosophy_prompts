      *   *Claim 4: "...like the egalitarian, it thinks how that wellbeing is spread around matters too, so a benefit to someone badly off counts for more..."*
          *   **Verdict:** Accurate regarding the *weighting*, but crucial distinction: it matters *because* they are badly off, not *because* equality is increased.
      *   *Claim 5: "Formally it just is utilitarianism with a concave transformation of everyone's wellbeing — diminishing marginal utility — so whether you call yourself a prioritarian or a utilitarian is a matter of taste."*
          *   **Verdict:** **Major Error.** This is the first specific concern.
          *   *Why:* Utilitarianism sums *utility*. Prioritarianism sums *transformed wellbeing*. If the transformation is of *utility*, it's just utilitarianism (risk aversion). If the transformation is of *wellbeing* (where wellbeing $\neq$ moral value), it's prioritarianism. The distinction is substantive, not terminological. It concerns the *currency* of justice (wellbeing vs. utility) and the *source* of the weight (moral priority vs. diminishing returns on welfare).
