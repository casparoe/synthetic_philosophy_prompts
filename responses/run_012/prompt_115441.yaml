          *   *Why:* Prioritarianism is *non-relational*. It cares about absolute levels, weighted. If you lower the better-off person (100 -> 50), their transformed score drops. The worse-off person stays the same. The total sum of *priority-weighted* value drops. Therefore, prioritarianism says this is *bad*. It does *not* succumb to the leveling-down objection.
      *   *Claim 8: "Take one person at 10 units of wellbeing and another at 100: prioritarianism says cutting the second down to 50... makes the world better..."*
          *   **Verdict:** **False.** As above. This describes *Telic Egalitarianism*, not Prioritarianism.
      *   *Claim 9: "So it collapses back into egalitarianism, and both are refuted by the plain fact that leveling down helps no one."*
          *   **Verdict:** False conclusion based on false premise.

