  *(Self-Correction on the "Utilitarianism is a matter of taste" point)*: I need to be careful here. Some economists *do* treat prioritarianism as a subset of generalized utilitarianism. However, in political philosophy (Parfit's context), the distinction is crucial because it separates *welfare* from *moral value*. I should emphasize the philosophical distinction over the formal mathematical similarity. The friend's claim that it's "just a matter of taste" dismisses the substantive ethical disagreement about *why* we weight the worse off.

