answer: |-
  This is a classic exercise in reflective equilibrium: matching your considered judgments about particular cases to a general theory, and adjusting either until they fit. Your intuitions are remarkably consistent, which suggests a coherent moral framework is already at work, even if it feels like a collection of gut reactions.

  Here is the principle that generates your verdicts, the tension you identified, and the application to your new cases.

  ### The Core Principle: Reciprocal Obligation with Moral Exceptions

  Your moral structure rests on a **Social Contract of Reciprocity**, tempered by a **Hierarchy of Moral Duties**.

  **The Base Rule:** Welfare is not a gift; it is a reciprocal arrangement. An able-bodied adult receives support from the collective only in exchange for a commitment to contribute to the collective (via work) or to prepare themselves to do so. Voluntary withdrawal from this contract (the Surfer) or violation of its truth (the Dead Relative) forfeits the claim.

  **Exception A (Involuntary Incapacity):** The obligation to work is voided if the barrier is genuinely outside the claimant's control. This includes structural economic shifts (the Laid-off Worker), health/addiction issues viewed as illness (the Drinker), or care responsibilities that cannot be outsourced (the Single Mother).

  **Exception B (Competing Moral Duty):** The obligation to work is suspended if fulfilling it requires violating a higher-order moral duty. This is where your "twins" (Religion vs. Qualifications) live.

  **The Fraud Distinction:** Honesty is required to maintain the contract, *unless* the dishonesty is a survival strategy masking a valid claim (Undeclared Work), as opposed to a fabrication of entitlement itself (Dead Relative).

  ---

  ### Mapping Your Cases to the Principle

  1.  **Surfer:** Violates Base Rule. Voluntary idleness. **Sanction.**
  2.  **Laid-off (50% wage):** Exception A. The social contract implies a reasonable standard of living; a 50% drop is a structural failure, not a refusal to work. **No Sanction.**
  3.  **Dead Relative:** Violates Base Rule (Truth). Pure theft; no underlying entitlement. **Prosecute.**
  4.  **Undeclared Work:** This is the outlier (more below). Technically violates truth, but viewed as survival strategy where underlying need exists. **Leniency.**
  5.  **Single Mother:** Exception A/B. Childcare failure is an involuntary barrier; care is a moral duty. **No Sanction.**
  6.  **Drinking Problem:** Exception A. You view addiction here as a health barrier (incapacity), not a moral failing. **No Sanction.**
  7.  **Religious Saturday:** Exception B. Conscience is a higher-order duty than economic utility. **No Sanction.**
  8.  **Overqualified:** Base Rule. "Status" is a preference, not a moral duty. **Sanction.**
  9.  **Young Man (Friends):** Base Rule. Social preference is not a moral duty. **Sanction.**
  10. **Woman (Disabled Parent):** Exception B. Filial care is a recognized moral duty that outweighs economic mobility. **No Sanction.**

  ### Addressing the Tension: Respectability vs. Duty

  You worried that distinguishing the Religious Woman (Case 7) from the Overqualified Man (Case 8) is just "smuggling in respectability." Under this principle, it is not.

  The distinction is not about whether *you* respect the reason, but whether the reason appeals to a **universalizable moral command** versus a **personal preference**.
  *   **Religion:** Appeals to an external moral authority/conscience. It is a duty *not* to sin.
  *   **Qualifications:** Appeals to internal status/ego. It is a desire *not* to feel diminished.
  *   **Friends vs. Parent:** Similarly, "seeing friends" is a preference. "Caring for a dependent parent" is a moral obligation recognized across almost all ethical systems.

  Your intuition is tracking **Duty vs. Preference**, not "Respectable vs. Unrespectable." The Overqualified Man and the Friend-Loving Man are prioritizing their *wants* over the collective contract. The Religious Woman and the Caregiving Woman are prioritizing recognized *obligations* over the collective contract. You are willing to let the contract bend for higher obligations, but not for preferences.

  ### The Outlier: The Undeclared Worker (Case 4)

  You noted you feel "much less strongly" about sanctioning the woman doing undeclared work, despite it being dishonest. This is the one verdict that strains the "Honesty" part of the Base Rule.

  If the principle were purely "Honesty is mandatory," Case 3 and Case 4 should feel identical. They don't.
  **Why:** In Case 3 (Dead Relative), there is *no entitlement*. It is pure extraction. In Case 4 (Undeclared Work), there is *partial entitlement* (she is likely poor and working), but the reporting is messy.
  **The Complication:** Your principle implicitly forgives **procedural dishonesty** when **substantive need** is clear, but punishes **substantive dishonesty** (claiming existence that isn't there) regardless of need.
  **The Weight:** This verdict is carrying weight. It suggests your view of welfare is ultimately about *preventing destitution* rather than *enforcing bureaucratic purity*. If you had to choose, you would likely admit that Case 4 should technically be sanctioned to maintain the system's integrity, but your moral gut resists punishing survival.

  ### Applying the Principle to New Cases

  Here is how your moral structure applies to the two scenarios you proposed.

  #### Case A: The Literacy Claimant
  *A claimant fails a literacy requirement he could have met with effort but never had any reason to want.*

  **Verdict: Sanction.**
  **Reasoning:** This aligns with the **Surfer** and the **Overqualified Man**.
  *   **Capacity:** He *could* have met it (not Exception A).
  *   **Duty:** He had "no reason to want to." This indicates a voluntary lack of preparation, similar to the Surfer's voluntary idleness. The Social Contract requires not just current work, but maintaining the *capacity* to work.
  *   **Preference vs. Duty:** Failing to educate oneself for "no reason" is a preference for comfort/past self over civic readiness. It is not a competing moral duty.
  *   **Fit:** This feels recognizably like your verdict on the Surfer. You hold adults responsible for maintaining their utility to the collective unless a barrier arises.

  #### Case B: The Disability Liar
  *A claimant lies about a disability he really does have.*
  *(Interpretation: He has the disability, but lies about the cause, severity, or classification to fit a specific benefit bracket.)*

  **Verdict: No Sanction (but require correction), or Minimal Sanction.**
  **Reasoning:** This aligns with the **Undeclared Worker** (Case 4), not the **Dead Relative** (Case 3).
  *   **Entitlement:** Unlike the Dead Relative, the need and the incapacity are *real*. He falls under Exception A (Involuntary Incapacity).
  *   **Honesty:** While he violated the truth condition, the lie is procedural (categorization) rather than substantive (existence of need).
  *   **Moral Weight:** Sanctioning him would force him to work despite a real disability (violating Exception A) because of a bureaucratic lie. Your intuition on Case 4 suggests you prioritize the *reality of need* over the *purity of the claim*.
  *   **Fit:** If you feel a strong urge to punish him, it conflicts with your leniency on Case 4. If you feel he should keep the benefit but stop lying, it fits your "Survival vs. Theft" distinction. Given your reaction to Case 4, I predict you view this as a "fix the paperwork" situation, not a "cut off the support" situation.

  ### Summary of Your Moral Structure

  You are not a Libertarian (you support the safety net).
  You are not a Strict Egalitarian (you distinguish between the Surfer and the Laid-off worker).
  You are not a Pure Utilitarian (you care about desert and character, not just incentives).

  You are a **Civic Reciprocalist**.
  You believe welfare is a partnership. The state provides security; the citizen provides effort and honesty. However, you believe the state must recognize that citizens have lives outside the economy. When the economy conflicts with **Care** (children, parents), **Conscience** (religion), or **Capacity** (health, structural wages), the moral duty to the economy dissolves. When the conflict is merely with **Preference** (friends, status, leisure), the duty remains.

  The "defect" you feared regarding the Religion/Qualifications twins is not a defect; it is the linchpin of your system. You distinguish between *who I am obliged to be* (moral agent) and *who I prefer to be* (consumer of status). That is a robust, defensible moral distinction.
