answer: |-
  This is a fantastic bit of text to get stuck on, and honestly, using Hume to settle a flatmate dispute is the most philosophically appropriate way to handle a breakup of trust I can imagine. You've picked up on the exact pressure points that keep Hume scholars busy.

  Here is the honest read on what Hume is doing, who he's fighting, and where the argument leaks.

  ### 1. Who is he arguing against? (And what about reliance?)

  You are right to be suspicious of the "willing of an obligation" claim. It sounds like a strawman. Who actually thinks that saying "I promise" is a magical speech act that conjures a new metaphysical bond out of thin air by sheer force of will?

  **The Target:** Hume is primarily arguing against the **Natural Law theorists** (like Pufendorf and Locke) and the **Moral Rationalists** (like Clarke). These thinkers believed that moral obligations were akin to mathematical truths discoverable by reason. For them, a promise creates a "right" in the promisee and an "obligation" in the promisor that exists independently of social consequences. They tended to locate this in the will: by exercising my rational will, I bind myself.

  Hume is saying: *Look, the will is just a psychological impulse. It can move my arm, but it can't change the moral status of the universe.* To claim that a mere mental act of "willing an obligation" creates a moral duty is, for Hume, like trying to change the weather by frowning. It category-errors the nature of "will" and "morality."

  **The Reliance Objection:** You ask: *Why couldn't it come from something else... like the other person's reliance on me?*

  This is the strongest objection to this section of the *Treatise*, and Hume knows it's coming. In fact, he addresses it later in the section, but his answer is frustrating.

  Hume agrees that reliance matters. But he argues that **natural reliance** (e.g., I expect you to help me because you are nice) only generates a **natural duty of humanity** (be kind to your friends). It does not generate the specific, strict, *binding* duty of a **promise**.

  For Hume, the whole point of the "promise" is that it is a **linguistic technology** designed to create reliance *where it wouldn't naturally exist*. If I only relied on your natural benevolence, I wouldn't trust you to move my heavy sofa. The promise is a ritualized symbol that says, "I am now binding myself even if my benevolence fails."

  So, Hume isn't ignoring reliance; he's arguing that the *specific obligation of promising* cannot be reduced to natural reliance. If it were just reliance, we wouldn't need the specific form of words "I promise." We could just say, "I'll try." The fact that we distinguish "I promise" from "I intend" suggests to Hume that we are invoking a special convention, not just a natural expectation.

  **Verdict:** He isn't strawmanning the Rationalists, but he is arguably underestimating the moral weight of reliance itself. (T.M. Scanlon, a modern philosopher, basically builds a career on arguing exactly against this Humean point: that reliance *does* create a natural duty without needing a social convention.)

  ### 2. Is the third bit circular?

  This is the famous "Motive Argument." It looks circular, but technically it's a *reductio ad absurdum*. Here is the structure:

  1.  **Premise:** For an action to be virtuous, there must be a natural motive that produces it (e.g., benevolence produces helping).
  2.  **Premise:** The "sense of duty" cannot be the *first* motive, because you can't feel a duty to do X unless X is already virtuous. (You can't feel obligated to do something unless there's already a reason it's good).
  3.  **Observation:** What natural motive makes us keep promises?
      *   Is it self-interest? No, often breaking a promise is more advantageous.
      *   Is it benevolence? No, we keep promises to people we dislike.
      *   Is it a natural instinct? No, there is no specific "promise-keeping instinct."
  4.  **Conclusion:** Since there is no *natural* motive, but we still feel obligated, the obligation must be **artificial**. The "sense of duty" arises *after* we invent the convention of promising to solve a social problem.

  **Is it circular?**
  It feels circular because Hume defines "Natural Virtue" as "action springing from natural passion." Since promise-keeping doesn't spring from a specific natural passion, he defines it as not natural.

  **Where it leaks:**
  The weak point is Premise 1. Hume assumes that for a virtue to be "natural," it must correspond to a specific, distinct instinct (like hunger or parental love). Modern evolutionary psychology and ethics suggest this is false. We might have a **general natural capacity for cooperation and norm-following** that doesn't need a specific "promise instinct."

  If humans are naturally "normative creatures" who feel discomfort when violating shared expectations, then the motive *is* natural, even if the specific rule (promising) is constructed. Hume draws a hard line between "Natural" (instinctive) and "Artificial" (invented) that many modern readers find too sharp. He assumes that because the *rule* is invented, the *motive* must be invented too. But we might have a natural motive to follow invented rules (social cohesion).

  **Verdict:** It works if you accept Hume's strict taxonomy of the passions. It fails if you think human nature includes a general predisposition to cooperate that can latch onto specific conventions like promising.

  ### 3. What's left of the obligation? (Prudence vs. Morality)

  This is the crux of your flatmate fight. If promises are "human inventions," is the obligation just "don't get caught"?

  **Hume's Answer:** No. It is still moral, not merely prudential.

  For Hume, morality is not about obeying God or Reason; it is about **sentiments of approval and disapproval**.
  *   **Prudence:** "I shouldn't break my promise because my flatmate will be mad and won't help me next time." (Self-interest).
  *   **Morality:** "I shouldn't break my promise because doing so causes pain to him, disrupts our trust, and makes me the kind of person society disapproves of." (Sympathy and Social Sentiment).

  When Hume says promises are "artificial," he doesn't mean "fake." He means they are like **money**. A $10 bill is a piece of paper (an invention). It has no value in nature. But within the system of society, it has *real* value. You can't say money is "just prudential." It governs real obligations.

  Similarly, the obligation of a promise is real because **we collectively agree to feel moral disapproval when they are broken.** When you bailed on your flatmate, you didn't just inconvenience him; you violated a social code that allows us to coordinate our lives. The "pain" you feel (or should feel) isn't just fear of punishment; it's **sympathy** with his frustration and a recognition that you've weakened the trust between you.

  **So, is there a real obligation?**
  Yes. But it is **contingent**.
  *   **Kant:** "You must keep promises because Reason commands it, regardless of consequences." (Categorical).
  *   **Hume:** "You must keep promises because we built a system where words create expectations, and breaking them hurts the social fabric and causes pain via sympathy." (Conditional on the existence of society).

  If you were the last two people on earth, Hume suggests the obligation of *promising* might vanish (though benevolence would remain), because the "convention" requires a society to sustain it.

  ### The Honest Read: Does the argument work?

  **Where Hume Wins:**
  He successfully demolishes the idea that a promise is a magical metaphysical bond created by the will. He is right that "I promise" is a social tool, not a psychic superpower. He correctly identifies that without a social context, the words "I promise" are just noise.

  **Where Hume Loses (The Weak Points):**
  1.  **The Reliance Gap:** He tries too hard to separate "natural reliance" from "promissory reliance." In practice, the moral wrong of breaking a promise *is* largely the wrong of disappointing reliance. By insisting this is "artificial," he makes the obligation feel more fragile than it actually is.
  2.  **The Motivation Gap:** His claim that we have *no* natural motive to keep promises other than the sense of duty is empirically shaky. Many people feel genuine distress at letting others down that isn't just "fear of social sanction" or "abstract duty." It's emotional. Hume's psychology is a bit too mechanistic here.
  3.  **The "Unintelligible" Claim:** He says without the convention, a promise is "altogether unintelligible." This is hyperbole. It's intelligible as a statement of intent. He needs it to be unintelligible to force his conclusion that it *must* be artificial.

  ### Advice for the Flatmate Fight

  If you use Hume to win this argument, you will technically win but lose the friendship.

  *   **Your Flatmate's View (Natural Law/Common Sense):** "You gave me your word. The word itself binds you."
  *   **Your View (Humean Skeptic):** "I said I'd *try*. A promise is a social convention that requires specific linguistic markers to trigger the obligation."

  **The Humean Verdict:**
  Hume would actually side with your flatmate, but not for the reason your flatmate thinks.
  Hume would say: "In our society, saying 'I'll help' is conventionally understood as a promise. By participating in this society, you accepted the convention. By bailing, you violated the artificial virtue that holds society together."

  The fact that you said "I'll try" vs "I promise" is a legalistic loophole. In the *convention* of flatmates, "I'll help you move" functions as a promise. To retreat to "I said I'd try" is to try to opt out of the convention *after* you've already benefited from the trust it created.

  **The Fix:**
  Don't tell him you read Hume. Tell him: "I realized that even if I didn't use the magic word 'promise,' I created an expectation you relied on, and breaking that damages the trust we need to live together. That's a moral failure, not just a scheduling error."

  That's the Humean position stripped of the 18th-century jargon: The obligation comes from the **damage to the cooperative scheme**, not from the metaphysical power of your will.
