      *   *Context:* Hume is arguing against the Social Contract theorists (Hobbes, Locke, Pufendorf) and Rationalists (Clarke, Balguy) who think moral obligations arise from reason or a distinct act of will.
      *   *The "Willing of Obligation":* Hume is targeting the idea that *fides est servanda* (faith must be kept) is a self-evident rational truth or that the will has a magical normative power.
      *   *Is it a strawman?* Partially. He's attacking a specific metaphysical conception of the will common in natural law theory.
      *   *The Reliance Objection:* The user asks: "Why couldn't it come from something else... like reliance?"
      *   *Hume's Reply:* Hume *does* account for reliance, but not as a *natural* obligation. He accounts for it via the *artificial* scheme of convention. The key distinction is Natural vs. Artificial. Reliance creates an expectation, but without the *convention* of the promise (the linguistic symbol), the obligation isn't specific enough to ground the specific duty of *promising*. Hume thinks reliance alone creates a duty of humanity/benevolence, not the specific strict duty of a promise.
