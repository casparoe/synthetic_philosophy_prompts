      *   *Scholarly take:* Many (like Foot, Williams) think this is a weakness. It relies on a strict separation of natural/artificial. If we have a natural tendency to cooperate (which evolutionary biology suggests), his premise wobbles.
      *   *Verdict:* It is arguably circular *if* you think "sense of duty" is the only alternative to "natural passion." But Hume's point is that the "sense of duty" regarding promises is *itself* the product of the convention. The argument works *within* his sentimentalist framework but fails if you reject that framework.

