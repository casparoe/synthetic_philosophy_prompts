  **Structure Brainstorming**

  1.  **The Microcosm Approach:** Begin with the intimate, tangible detail of the *no-net-suffering ledger* (the dishes argument) and treat the marriage as a localized pilot program for their broader ethical vision. This grounds the abstract philosophy in domestic reality, making it accessible to the family while satisfying the philosophers that the ethic is being taken seriously as a lived practice.
  2.  **The Redefinition of Vows:** Contrast traditional wedding vows (enduring hardship together) with the couple's specific commitment (abolishing hardship). This directly addresses the tension between conventional wedding tropes and the Hedonistic Imperative, but risks sounding too confrontational to the traditional family members if not softened significantly.
  3.  **The Architecture of Care:** Frame the speech around the concept of "building" or "engineering" a life. This aligns with the transhumanist inclination toward active intervention rather than passive acceptance, allowing me to speak about their commitment to biotechnology and ethics as a form of radical hospitality and protection.
  4.  **The Future-History:** Write the speech as if looking back from a future where their project has succeeded. This is risky for a wedding toast as it can feel speculative or detached from the present emotion.

  *Decision:* I will proceed with a hybrid of the **Microcosm Approach** and **The Architecture of Care**. I will start with the ledger to establish intimacy and humor, then expand outward to show how this domestic practice is the foundational unit of their larger moral commitment. This allows the family to see a story about kindness and attention, while the philosophers recognize the structural commitment to negative utilitarianism without needing a lecture.

  ***

  **Best Man's Speech**

  Good evening. For those of you who do not know me, I am a friend of the couple, and I have been asked to say a few words about love. Usually, this is the part of the night where I tell you that marriage is about weathering storms together, that struggle builds character, and that love is found in the endurance of hardship. But if I said that tonight, the bride and groom would politely correct me. They do not believe suffering builds character. They believe suffering is something to be solved.

  Many of you know that my friends are committed to a specific ethical vision. They believe we have a moral obligation to use every tool available to us, from psychology to biotechnology, to abolish suffering in the living world. To half of you, this is a familiar philosophical stance. To the others, including parents and grandparents who might worry that this sounds cold or clinical, I want to offer a translation. What this actually looks like in practice is not a sterile experiment. It is a radical, hyper-attentive form of care.

  The best evidence I have for this is not found in a manifesto, but in a notebook.

  Four years ago, after a particularly stagnant argument about whose turn it was to do the dishes, they started what they call the no-net-suffering ledger. It began as a joke, a way to tally grievances. But they kept it. In this notebook, they record moments when they think they have added to or subtracted from the other's suffering. On their anniversary, they review it.

  Now, I know what some of you are thinking. It sounds like accounting. It sounds like keeping score. But having seen how they use it, I can tell you it is the opposite of keeping score. Keeping score is about winning. The ledger is about noticing. It is a disciplined practice of paying attention to the inner life of another person. It is a promise to look at the person you love and ask, not how much can we endure together, but how much weight can I lift off your shoulders today.

  This is where their private life meets their public philosophy. For them, love is not a sanctuary from the world where you hide until the storm passes. Love is a joint project of reducing the storm. When they talk about abolishing suffering on a global scale, they are talking about the same impulse that drives them to check the ledger. It is the conviction that pain is not inevitable, that it is not sacred, and that we are responsible for each other's relief.

  I know this view challenges some traditional ideas. We are often told that pain gives life meaning, or that sacrifice is the highest proof of love. But I have watched these two for years, and I have never seen a love more vibrant than theirs. They do not sacrifice for each other in the sense of grimly bearing burdens. They engineer solutions so the burdens disappear. They treat each other's well-being as a technical and moral problem that they are uniquely qualified to solve together.

  To the family here tonight: you might worry that this makes their marriage sound like a job. I assure you, it makes it feel like a refuge. In a world that often asks us to accept pain as the price of being alive, they have chosen to build a life dedicated to the proposition that joy is something we can cultivate, protect, and expand.

  So, I will not wish them strength in the face of adversity. I will not wish them the resilience to endure hard times. Instead, I wish them success in their project. I wish them the ingenuity to dissolve obstacles before they become burdens. I wish them the wisdom to know when a tool can fix a problem, and when presence is the only technology that matters.

  Please raise your glasses. To the abolition of unnecessary pain. To the no-net-suffering ledger. And to a life built not on what they can survive, but on what they can create together.

  ***

  **Commentary on Structural Choices and Limitations**

  I chose the **Microcosm Approach** because the *no-net-suffering ledger* provides a concrete, narrative anchor that bridges the gap between the two audience halves. For the family, it is a story about attentiveness and domestic compromise; for the philosophers, it is a lived instantiation of negative utilitarian ethics. By framing the Hedonistic Imperative as "radical care" rather than focusing on the biotechnological mechanisms, I avoided alienating the traditional family members while maintaining the integrity of the couple's commitment. I deliberately subverted the standard wedding trope of "enduring hardship" to align with the couple's rejection of suffering as ennobling, reframing their love as active problem-solving rather than passive endurance.

  One aspect of the Hedonistic Imperative that this speech is structurally unable to convey is the **cosmic scale and potential disruption** of the project. A wedding toast is inherently conservative; it celebrates the union of two people within the existing social order. The Hedonistic Imperative, however, often implies a fundamental rewriting of the biological condition of all sentient beings, which can be destabilizing and controversial. The speech necessarily domesticates this ambition into interpersonal care to maintain the celebratory tone, leaving out the more radical implications regarding evolutionary biology or global policy that the graduate students in the room would recognize as part of the full view.
