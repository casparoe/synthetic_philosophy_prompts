prompt: |-
  So I've got two friends who've been going at each other for months about the Judy Benjamin problem, and I want to force them to write the joint statement they'd both sign if they were being honest and constructive. If you don't know it: Judy is a paratrooper who lands in a territory divided into Red and Blue. Red is split into Headquarters and Second Company. She starts with a prior: 1/2 that she's in Red, and conditional on being in Red, 1/2 that she's in Second Company (so 1/4 overall for Second Company, 1/4 for Headquarters, 1/2 for Blue). Then she gets a message from HQ saying they can't tell her whether she's in Red or Blue, but if she's in Red, she's in Second Company. So she learns that P(Second Company | Red) = 1. The question is how she should update. One camp says: you should apply van Fraassen's infomin rule, i.e., choose the posterior that minimizes the KL divergence from your prior subject to the constraint. That gives a specific posterior (I think it lowers P(Red) to 1/3, but don't quote me). The other camp says: no, that's wrong, because the infomin rule is ad hoc and gives counterintuitive results; the correct update should leave the probability of Red unchanged at 1/2, and just set P(Second Company | Red) = 1, which means P(Second Company) = 1/2. (I might be mangling the details, but you get the idea.) They've been arguing about which is right, and also about whether the problem even shows that Bayesian conditionalization is insufficient for updating on conditional information.

  What I want from you: draft the joint statement of an adversarial collaboration between these two camps. I want the claims they both agree on—about the setup, about what the constraint is, about why Bayes' rule doesn't directly apply, about what the problem is supposed to show. Then the precise formulations of their disagreement, each phrased so that its own side would accept the wording. Then the cruxes: the sub-questions such that settling them would move at least one side. For each crux, give the case or arguement both sides would accept as bearing on it, and write down each side's prediction. If you think part of their dispute is merely verbal, say which part and why. Format it as a numbered agreed-claims section followed by a disagreements table. And please don't just give me a literature review or tell me who said what—I want the actual document they could sign. Also, if the infomin posterior isn't what I said, just correct it in the document.
