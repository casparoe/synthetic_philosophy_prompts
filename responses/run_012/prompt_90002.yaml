          *   $P(B) = 1/2$ (Blue)
          *   $P(H | R) = 1/2$ (Headquarters given Red)
          *   $P(S | R) = 1/2$ (Second Company given Red)
          *   Implied: $P(H) = 1/4$, $P(S) = 1/4$.
      *   *Evidence:* "If you are in Red, you are in Second Company."
          *   Formally: $P_{new}(S | R) = 1$.
          *   Note: This is *not* learning the proposition $R \to S$ (which is equivalent to $\neg R \lor S$). It is learning a constraint on the conditional probability.
      *   *Camp A (Infomin):* Minimize $D_{KL}(P_{new} || P_{old})$ subject to $P_{new}(S | R) = 1$.
          *   Let $P_{new}(R) = x$. Then $P_{new}(S) = P_{new}(S|R)P_{new}(R) + P_{new}(S|B)P_{new}(B)$.
          *   Actually, usually the partition is $\{H, S, B\}$.
          *   Prior: $H: 1/4, S: 1/4, B: 1/2$.
          *   Constraint: $P_{new}(S) / (P_{new}(S) + P_{new}(H)) = 1 \implies P_{new}(H) = 0$.
          *   So mass on $H$ moves to $S$ or $B$.
          *   Infomin solution (Van Fraassen 1981):
              *   $P_{new}(R) = 1/3$? Let's check.
              *   We want to minimize $\sum p_i \log(p_i / q_i)$ subject to $p_H = 0$ and $p_S + p_B = 1$.
              *   Actually, the constraint is specifically on the conditional. $P(S|R)=1 \implies P(H|R)=0 \implies P(H)=0$.
              *   So we redistribute the prior mass of $H$ (1/4). Where does it go?
              *   Infomin preserves the odds ratio of the *unconstrained* partition elements relative to the constraint?
              *   Standard Infomin result for this problem: $P_{new}(R) = 1/3$ is a common citation, but let's derive it to be sure.
              *   Prior: $p_H=1/4, p_S=1/4, p_B=1/2$.
              *   Constraint: $p_H = 0$.
              *   Minimize $p_S \log(p_S / (1/4)) + p_B \log(p_B / (1/2))$ subject to $p_S + p_B = 1$.
              *   Lagrangian: $L = p_S \ln(4p_S) + p_B \ln(2p_B) - \lambda(p_S + p_B - 1)$.
              *   $\partial L / \partial p_S = \ln(4p_S) + 1 - \lambda = 0 \implies 4p_S = e^{\lambda - 1}$.
              *   $\partial L / \partial p_B = \ln(2p_B) + 1 - \lambda = 0 \implies 2p_B = e^{\lambda - 1}$.
              *   So $4p_S = 2p_B \implies p_B = 2p_S$.
              *   Since $p_S + p_B = 1 \implies 3p_S = 1 \implies p_S = 1/3, p_B = 2/3$.
              *   Therefore $P_{new}(R) = P_{new}(S) + P_{new}(H) = 1/3 + 0 = 1/3$.
              *   So the user's intuition ($P(Red)$ drops to $1/3$) is **correct**.
