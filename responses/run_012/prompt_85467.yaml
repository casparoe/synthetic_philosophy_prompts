answer: |-
  I'll take the side of the critic. Your view is intuitive and has strong traction in everyday reasoning, but as a philosophical account of moral obligation, it is overextended. It tries to unify three distinct moral phenomena under the label of "convention," and in doing so, it masks the real sources of obligation.

  Here is the breakdown of why the **Local-Convention Default** fails in its current form, ranked from the objection that should kill it to the ones that are merely manageable annoyances.

  ### 1. The Collapse Objection (Fatal)
  **The Charge:** Your view does no independent moral work. It collapses into a generic prohibition against causing friction or harm.

  You ground the obligation in "free-riding on forbearance." But why is free-riding on *this* specific forbearance wrong? Usually, free-riding is wrong because it undermines a beneficial scheme (fairness) or causes harm to participants (utility).
  *   If the convention is beneficial (queueing), the obligation comes from the **benefit**, not the convention itself.
  *   If the convention is neutral but strict (dress codes), the obligation comes from **avoiding offense** (harm/friction).
  *   If the convention is harmful (segregation norms), you say there is no obligation.

  This means the "convention" is not the source of the obligation. The source is either *fairness*, *harm-avoidance*, or *justice*. The convention is just the local context in which those deeper principles apply. If you strip away the harm, the unfairness, and the injustice, is there any residue of obligation left?
  *   **Test Case:** Imagine a society where people hop on one leg every Tuesday. It's arbitrary, harmless, non-exploitative, and strictly observed. You visit. You walk normally. You cause no harm, you undermine no essential coordination, you exploit no one. You just look odd and perhaps slightly disrespectful.
  *   **The Verdict:** If your view says you are *morally obligated* to hop, it is absurdly demanding. If it says you are not, then the obligation wasn't about the convention; it was about the *consequences* of breaking it. Your view claims conventions generate obligations *per se*. If the obligation vanishes when the consequences are trivial, the convention isn't doing the work. The view is unfalsifiable because any time the obligation seems weak, you can say "ah, but the harm was low," which admits harm is the real metric.

  ### 2. The "Ransom" vs. Coordination Distinction (Severe)
  **The Charge:** You are trying to bundle "Coordination Conventions" (queueing) and "Ransom Conventions" (tipping) under one principle. They rely on incompatible moral grounds.

  *   **Queueing (Coordination):** This is a genuine convention in the game-theoretic sense. There are multiple equilibria (first-come-first-served vs. strongest-gets-it), but we need *one*. The moral obligation arises from **Fairness as Reciprocity**. I queue because you queue, and we both benefit from the order.
  *   **Tipping (Ransom/Transfer):** This is not a coordination problem. It is a wage subsidy. The "convention" is a mechanism to distribute resources. The moral obligation to tip does not stem from "sharing space"; it stems from **Distributive Justice** or **Promise-Keeping** (you accepted the service under known terms).
  *   **The Break:** If the local wage system is exploitative (e.g., tipped workers are paid $2/hour), your view says the visitor is obligated to tip because "those are the terms of cooperation." But this makes the visitor a moral enforcer of a potentially unjust economic structure.
      *   If you say "You must tip because the worker needs it," you are appealing to need/justice, not convention.
      *   If you say "You must tip because it's the rule," you are prioritizing local custom over global justice.
      *   **Concession Required:** A defender must concede that "Ransom Conventions" do not generate *conventional* obligations. They generate *economic* obligations that happen to be mediated by convention. If the wage bargain is unjust, the convention loses its moral force. You cannot treat tipping the same as queueing.

  ### 3. The Epistemic Burden (Awkward but Manageable)
  **The Charge:** Visitors cannot know the "settled" convention.

  You ask if the obligation comes in degrees. It must. But if the obligation is contingent on *knowability*, it is no longer an obligation generated by the *presence* in the space; it is an obligation generated by *knowledge*.
  *   **The Problem:** In many places, the "convention" is contested. (e.g., In some cities, jaywalking is fine; in others, it's taboo; in others, it's illegal but everyone does it).
  *   **The Fix:** You must narrow the obligation to "Conventions that are reasonably ascertainable." But this turns the view into: "Do what you know is expected, provided it isn't harmful." This is just "Be polite and informed." It loses the robust "moral obligation" sting you want. It becomes a duty of diligence, not a duty of compliance.

  ### 4. The "Harmless Wrong" Challenge
  You asked for a case where following the convention is wrong, without the convention being "harmful" (in the crude sense of causing pain).

  **The Case: Symbolic Complicity.**
  Imagine a society with a rigid, unspoken caste system. It is not "cruel" in the sense of violence. It is polite, orderly, and everyone accepts it as "how things are." The convention is that people of Group A sit in the front of the bus, and Group B in the back.
  *   **Your View:** You exclude "cruel or servile" customs. But locals would argue this isn't servitude; it's "tradition" or "order." It's not causing active harm; it's maintaining social harmony.
  *   **The Moral Reality:** If you are a visitor from Group A, and you sit in the front, you are not causing direct harm. You are just following the local convention. But you are morally wrong to do so because you are **validating an unjust hierarchy**.
  *   **Why this breaks your view:** The wrongness isn't about the *consequence* (the bus runs fine). It isn't about *harm* (no one is hurt). It is about **moral complicity**. Your view relies on the idea that conventions are neutral "terms of cooperation." But conventions are often carriers of ideology. If the "terms of cooperation" encode injustice, the obligation to cooperate dissolves, even if the immediate act is harmless.
  *   **Refinement:** You might say "Ah, but that's a harmful convention." I reply: Harm is not the only moral category. There is also *dignity* and *justice*. A convention can be peaceful and orderly and still be morally forbidden. Your view needs a clause that says "Conventions that encode systemic injustice do not bind," which again, admits the convention itself isn't the source of the norm—justice is.

  ### Analysis of Your Three Cases
  You suspected these were "three different principles wearing one coat." You are right.

  1.  **Queueing:** Pure Coordination. The view holds here. The obligation is real because the alternative is chaos or unfairness.
  2.  **Tipping:** Distributive/Contractual. The view fails here. The obligation is to the *worker*, not the *norm*. If the norm changes (service charge included), the obligation shifts. The convention is incidental.
  3.  **Jaywalking:** Legal vs. Social Authority. This is the messiest. If the law says stop and the locals say go, which is the "local convention"?
      *   If you follow the locals and get hit, you've harmed the driver (who followed the law).
      *   If you follow the law and block traffic, you've harmed the flow (the convention).
      *   **Verdict:** This isn't a moral obligation generated by convention; it's a risk-assessment problem. The "obligation" is to not be a hazard.

  **Does the distinction do work?** Yes. It shows your view is too broad. It should be narrowed to **Coordination Conventions Only**. Drop Tipping (economic justice) and Jaywalking (safety/legal compliance).

  ### The Verdict

  **Does it survive?** No, not as a general theory of obligation.
  **Does it need narrowing?** Yes, drastically.
  **Is it dressed-up politeness?** Currently, yes.

  **The Salvaged View:**
  To make this philosophically robust, you must retreat to a **Principle of Coordination Fairness**:
  > *When a group has established a behavioral equilibrium to solve a coordination problem (queueing, driving side, noise levels), and that equilibrium is not unjust, visitors have a duty of fairness to adhere to it to avoid free-riding on the order maintained by others.*

  **What you must give up:**
  1.  **The claim that it covers transfers (tipping).** That is justice, not convention.
  2.  **The claim that it covers contested norms.** If the locals disagree, there is no equilibrium to coordinate with.
  3.  **The claim that it is unfalsifiable.** You must admit that if a convention is arbitrary and harmless (the hopping example), there is no *moral* obligation, only a prudential one.

  **Final Critique:**
  The risk of your view is that it moralizes the status quo. By saying "these are the terms on which people are willing to share space," you grant moral authority to whatever locals happen to do. If locals are racist, sexist, or exploitative but "polite" about it, your view struggles to tell the visitor to break the norm unless you invoke external principles of justice. If you invoke external principles of justice, the convention drops out of the equation.

  **Your view is best understood not as a source of obligation, but as a heuristic for identifying where obligations of fairness already exist.** The convention doesn't *make* it wrong to cut the queue; the unfairness makes it wrong, and the convention is just the evidence that a fair system is in place. Don't mistake the signpost for the terrain.
