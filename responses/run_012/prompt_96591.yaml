  # The Careenium Decision Tree: Levels of Explanation

  This tree sorts positions based on how they answer specific questions about the **Careenium case** (Simms vs. Simmballs). The questions are designed to be answerable by looking at the system's behavior without presupposing a metaphysical theory.

  ### The Tree

  **START:** Consider a Simmball (cluster) shoving a loose Simm (marble).

  **NODE 1: ENERGY & FORCE**
  **Q:** Does the motion of the Simmball involve any transfer of energy or force that *cannot* be traced to the magnetic/collisional interactions between individual Simms?
  *   **YES** → **LEAF 1: Emergentist Downward Causation**
  *   **NO** → (Go to Node 2)

  **NODE 2: ONTOLOGICAL STATUS**
  **Q:** If all human observers vanished, would the "Simmballs" still exist as distinct entities, or would there only be loose Simms?
  *   **ONLY LOOSE SIMMS** (Clusters are observer-relative) → (Go to Node 3)
  *   **DISTINCT ENTITIES** (Clusters are mind-independent) → (Go to Node 4)

  **NODE 3: UTILITY OF FICTION**
  **Q:** Is the term "Simmball" still useful for predicting system behavior even if it doesn't refer to a real thing?
  *   **NO** (It is false/misleading) → **LEAF 2: Eliminativism about Simmballs**
  *   **YES** (It is a useful fiction) → **LEAF 3: Real-Pattern Pragmatism**

  **NODE 4: CAUSAL TRUTH**
  **Q:** Given that all energy is micro, is the statement "The Simmball pushed the Simm" literally *false*?
  *   **YES** (Only Simms push) → **LEAF 4: Straight Causal Exclusion**
  *   **NO** (It is true in some sense) → (Go to Node 5)

  **NODE 5: IDENTITY VS. ABSTRACTION**
  **Q:** Is the Simmball story true because the Simmball *just is* the Simms arranged that way, or because it captures a *general pattern* the Simm description misses?
  *   **JUST IS THE SIMMS** (Identity) → **LEAF 5: No-Competition (Identity Theory)**
  *   **CAPTURES A PATTERN** (Abstraction) → (Go to Node 6)

  **NODE 6: UNITY OF CAUSATION**
  **Q:** Does the word "cause" mean exactly the same thing when a Simm hits a wall as when a Simmball hits a Simm?
  *   **NO** (It's a different relation/concept) → **LEAF 6: Deflationist Pluralism**
  *   **YES** (It's a single natural relation) → (Go to Node 7)

  **NODE 7: CRITERION FOR MACRO-CAUSATION**
  **Q:** Is the Simmball the cause because its effect is *stable* across micro-changes, or because you can *manipulate* it independently of the Simms?
  *   **STABLE/GENERAL** (Robustness) → **LEAF 7: Proportionality / Program Explanation**
  *   **MANIPULABLE** (Intervention) → **LEAF 8: Interventionist Account**

  ***

  ### Key to Positions (Leaves)

  1.  **Emergentist Downward Causation:** *Commitment Cost:* Requires violating the causal closure of physics (new forces appear at the macro level).
  2.  **Eliminativism about Simmballs:** *Commitment Cost:* Forces you to deny the existence of everyday objects (chairs, traffic jams) to save micro-physics.
  3.  **Real-Pattern Pragmatism:** *Commitment Cost:* Makes ontology dependent on cognitive interests (things exist only relative to a predictor).
  4.  **Straight Causal Exclusion:** *Commitment Cost:* Renders all macro-level sciences (biology, economics) systematically false or epiphenomenal.
  5.  **No-Competition (Identity):** *Commitment Cost:* Collapses distinct levels of explanation into one, making "levels" merely linguistic.
  6.  **Deflationist Pluralism:** *Commitment Cost:* Abandons the project of finding a unified theory of causation across sciences.
  7.  **Proportionality / Program Explanation:** *Commitment Cost:* Requires causation to be sensitive to explanatory interests rather than just physical production.
  8.  **Interventionist Account:** *Commitment Cost:* Struggles in cases (like the Careenium) where the macro cannot be manipulated without changing the micro.

  ***

  ### Test Case Analysis

  Here is how the branches hold up against three additional cases: **Traffic Jam** (Cars/Jam), **Ant Colony** (Ants/Colony Behavior), **Market Panic** (Traders/Crash).

  | Branch / Leaf | Traffic Jam | Ant Colony | Market Panic | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Emergentist** | **DEAD.** No new energy in a jam. | **DEAD.** Ants obey physics; no "colony force." | **DEAD.** No new energy in a crash. | Physically untenable in complex systems. |
  | **2. Eliminativism** | **DEAD.** "Jam" is too useful to deny. | **LIVE.** Hard to locate "opinion" physically. | **LIVE.** "Panic" is a metaphor for aggregate selling. | Viable only for mental/social attributions. |
  | **3. Pragmatism** | **LIVE.** Jam exists relative to drivers. | **LIVE.** Colony exists relative to observers. | **LIVE.** Panic exists relative to economists. | Consistent across all cases. |
  | **4. Exclusion** | **LIVE.** Only cars move, "jam" does nothing. | **LIVE.** Only ants move, "colony" does nothing. | **LIVE.** Only traders sell, "market" does nothing. | Consistent, but high explanatory cost. |
  | **5. No-Competition** | **LIVE.** Jam *is* cars slowing down. | **TENSION.** Is behavior *identical* to ant motion? | **LIVE.** Crash *is* aggregate selling. | Works best where macro is aggregate. |
  | **6. Deflationism** | **LIVE.** "Cause" differs for mechanic vs. planner. | **LIVE.** "Cause" differs for biologist vs. physicist. | **LIVE.** "Cause" differs for trader vs. regulator. | Consistent across all cases. |
  | **7. Prop/Program** | **LIVE.** Jam explains slowdown better than car #42. | **LIVE.** Colony goal explains ant path better. | **LIVE.** Panic explains crash better than trader A. | Strongest explanatory fit for all three. |
  | **8. Interventionist** | **DEAD.** Can't fix jam without moving cars. | **DEAD.** Can't change colony without moving ants. | **DEAD.** Can't stop panic without stopping traders. | **Fails** on all three (no independent manipulation). |

  ***

  ### Empty Logical Space

  These are combinations of answers that no major position occupies.

  **1. The "Magic Fiction" (Node 1: YES + Node 2: ONLY LOOSE SIMMS)**
  *   *Combination:* Simmballs exert new forces, but they only exist when observed.
  *   *Status:* **Incoherent.** If they exert physical forces (energy transfer), they must be mind-independent physical entities. A force that turns off when you close your eyes violates conservation laws.

  **2. The "Identical but False" (Node 5: JUST IS THE SIMMS + Node 4: YES/FALSE)**
  *   *Combination:* The Simmball *is* the Simms, but saying "The Simmball pushed" is false.
  *   *Status:* **Incoherent.** If A = B, and "A pushed" is true, then "B pushed" must be true. Denying this violates Leibniz's Law.

  **3. The "Manipulable Pattern" (Node 7: MANIPULABLE + Node 2: ONLY LOOSE SIMMS)**
  *   *Combination:* Simmballs are observer-relative fictions, but you can manipulate them independently of Simms.
  *   *Status:* **Nobody Wants It.** If you can manipulate it independently (e.g., move the cluster without touching the marbles), it behaves like a real entity. Denying its reality while admitting independent manipulability is pragmatically self-defeating.

  **4. The "Specific Cause" (Node 7: STABLE/GENERAL + "Micro is Better")**
  *   *Combination:* The macro description is more stable/general, but the micro description is still the *true* cause.
  *   *Status:* **Untried / Tension.** This is the tension between Exclusion and Proportionality. Most who admit the macro is more stable (Yablo/Jackson) argue that makes it the *better* cause. Those who argue micro is the true cause (Kim) usually deny the macro stability matters for *causation* (only for explanation). It is a logical possibility, but unstable as a settled position.

  ### Facilitator's Note for Physicists
  *   **Node 1** is your home turf. If you answer "No" (Conservation of Energy holds), you bypass Emergentism.
  *   **Node 8 (Interventionism)** will likely frustrate you. In the Careenium (and Traffic/Markets), you cannot "wiggle" the macro variable without wiggling the micro variables. Strict Interventionists (Woodward) handle this via "realization," but the tree forces a choice that reveals the weakness of strict manipulability in reduced systems.
  *   **Leaf 7 (Proportionality/Program)** is likely where most working scientists live implicitly: the micro-story is physically sufficient, but the macro-story is *causally* superior because it is robust against micro-noise.
