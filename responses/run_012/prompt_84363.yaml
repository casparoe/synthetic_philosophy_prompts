answer: |-
  The corn stood in ranks that were too straight, even for modern planting. Julian walked the rows, boots sinking into soil that smelled sweet and wrong, like fruit left in the sun too long. He knelt, brushing aside a husk. The stalk beneath was hollowed out, not by pest, not by rot, but by design. It had been emptied with surgical efficiency, every nutrient drawn up into the ear before the stalk collapsed.

  It was a perfect sacrifice. The plant had killed itself to maximize the seed, leaving nothing for the root, nothing for the soil, nothing for next year.

  Julian stood up, wiping dirt on his trousers. He was a pathologist for the Department of Agriculture, called in when the local extensions ran out of answers. He had seen blight, drought, and negligence. He had never seen suicide.

  The farmhouse sat on a ridge overlooking the field, white paint peeling like sunburnt skin. Martha Kaelen was waiting on the porch. She was a hard woman, built from the same flint as the land, holding a mug of coffee that had gone cold hours ago.

  "Well?" she asked.

  "It's not a fungus," Julian said. "It's not a virus. And it's not sabotage."

  Martha's eyes narrowed. "Don't tell me what it isn't, Doctor. Tell me who did it."

  "Nobody did it."

  "Nobody doesn't grow corn in geometric spirals," she said, gesturing to the field behind him. "Nobody doesn't drain the aquifer in exactly three weeks. You think I'm stupid? I know sabotage when I see it. AgriCorp wants the land, they try to break me. It's happened before."

  "It's not AgriCorp," Julian said. He climbed the steps and leaned against the railing. The wind was picking up, rustling the dry leaves. They sounded like paper shuffling. "I've analyzed the tissue samples. The plants are producing a specific enzyme. It accelerates growth, forces maturity, strips the soil. It's an evolutionary strategy. Extreme r-selection. They're betting everything on this one generation."

  Martha took a sip of the cold coffee and grimaced. "Plants don't bet. They don't think. They don't decide to kill the ground they stand on."

  "They don't decide," Julian agreed. "But the reason is there."

  "That's gibberish."

  "Is it?" Julian looked out at the rows. "Think about a wasp. There are species that sting a caterpillar in a specific nerve cluster. Paralyzes it, keeps it fresh. The wasp lays eggs inside the living host. The larvae eat the caterpillar from the inside out. Now, why does the wasp sting that specific spot?"

  "Because it knows how," Martha said.

  "It doesn't know anything. It's a insect with a brain the size of a poppy seed. But there is a reason for the sting. There is a purpose. Fresh meat for the babies. The reason is real. You can point to it. But there is no reasoner. Nobody thought it up. Nobody planned it. The reason just... hangs there. In the air. In the DNA."

  Martha set the mug down on the railing with a sharp clink. "I don't care about wasps. I care about my farm. If there's a purpose, someone has to be holding the reins. If my land is dying for a reason, then somebody wanted it dead."

  "That's what I'm trying to tell you. Nobody wanted it. The corn is optimizing. It's finding the most efficient path to reproduction, and that path happens to go through the destruction of the host. It's a logic without a mind. A goal without a golfer."

  "No." Martha pushed off the railing. She was taller than him, closer than he expected. "That's cowardice. That's you hiding behind science because you can't find the villain. If there's a reason, there's a head attached to it. If there's a design, there's a designer. That's how the world works. You don't get effects without causes. You don't get purposes without someone doing the purposing."

  "The world is full of purposes without people," Julian said, his voice quiet. "Your immune system fights infections with strategy better than any general. It flanks, it retreats, it sacrifices cells to save the whole. Does your immune system have a name? Does it have a social security number?"

  "My immune system is *me*," she snapped. "This corn isn't me. This corn is supposed to be mine. It's supposed to do what I tell it. If it's acting like an enemy, it's because an enemy told it to."

  Julian looked at her. He saw the desperation there. She needed a villain because a villain could be fought. You could shoot a man. You could sue a corporation. You could not fight a ghost. You could not argue with a mathematical inevitability.

  "There's no one to fight, Martha," he said. "The reason is ownerless. It's just... happening."

  She stared at him for a long moment, her face hardening into something like grief. "If you're right," she said, "then I'm already dead. I'm just waiting for the ground to catch up."

  She turned and went inside, closing the door without a slam. Just a click.

  Julian stayed on the porch until the sun went down. He watched the field. The wind moved through the stalks, and the spiral pattern seemed to shift, tightening. He thought about the wasp again. He thought about the precision of the sting. He thought about how comfortable it was to imagine a mind behind the cruelty. A mind meant there was a negotiation possible. A mind meant there was a limit.

  If there was no mind, there was no limit. The optimization would continue until there was nothing left to optimize.

  He drove back to the motel in silence. The radio was off. The road was a ribbon of gray cutting through the dark. His hands rested on the wheel at ten and two, just like the instructor had taught him twenty years ago.

  He thought about his report. He needed to write it tonight. He needed to recommend burning the field. Containing the strain. It was the logical step. It was the necessary step.

  Why was he going to write it?

  He checked his motivation. He wanted to help Martha. But Martha had rejected the help. She wanted a villain, and he was refusing to provide one.

  He wanted to protect the ecosystem. But the ecosystem was already shifting. The corn was winning. Was stopping it interference? Or was his interference part of the new logic? Maybe the burn was the next step in the optimization. A fire clears the ground for the next cycle. Maybe he was just the spark the system required to move to phase two.

  He slowed the car at a red light. There was no other traffic. The light hung in the intersection, cycling through its colors with blind, perfect timing. Red. Green. Yellow.

  Julian sat at the red light. He could go. The road was clear. There was no reason to stop except the light.

  But the light wasn't a reason. It was a signal. The reason was safety. The reason was order. The reason was that if everyone ignored the light, the system collapsed.

  Who decided that? People. People decided the light mattered.

  But why did he care?

  He felt a hunger pang, sharp and sudden. He hadn't eaten since breakfast. He needed calories. His body was signaling a deficit. Was that his reason to stop at the diner on the corner? Or was it the body's reason, using him as the vehicle to get glucose?

  He looked at his hand on the gear shift. The skin was pale, the knuckles white. He told the hand to shift. The hand shifted.

  How did he know he told it? He remembered the thought, *shift gear*, and then the hand moved. But the thought had to come from somewhere. It arose in the dark wet matter of his skull, triggered by synapses firing in patterns established by genetics and habit.

  He hadn't chosen the habit. He hadn't chosen the genetics.

  The light turned green.

  Julian pressed the accelerator. The car moved forward. He was heading to the diner. He knew this because he was hungry. But he also knew it because the diner was on the route home. It was efficient. It minimized deviation.

  He pulled into the lot. The neon sign buzzed. *EAT.*

  He walked inside. The waitress knew him. He came through here often on cases.

  "The usual, Julian?" she asked.

  He opened his mouth to say yes. Pie and coffee. Comfort food. Something sweet to cut the bitterness of the day.

  But why pie?

  He looked at the menu. There were sandwiches. Salads. Proteins that would rebuild the muscle tissue he had walked through all day. Pie was inefficient. Pie was sugar and fat.

  Unless the goal wasn't health. Unless the goal was comfort. But why did he need comfort? To reduce cortisol? To ensure he slept well tonight so he could work tomorrow?

  It was all optimization. Every desire he had ever felt was a proxy for a biological imperative he didn't understand. He thought he was choosing the pie because he liked the taste. But the taste was just the carrot. The stick was the need to maintain morale in a hostile environment.

  He was the caterpillar. The reason was the wasp.

  "Julian?" the waitress said.

  He looked at her. She was waiting for an order. She needed the order to put it in the system. The system needed the input to function.

  "I'll have the pie," he said.

  His voice sounded flat. Not his own.

  He sat in the booth. The vinyl was cracked. He watched the other customers. A trucker eating eggs. A couple sharing a milkshake. They all looked so certain. They lifted forks to mouths with the absolute confidence of people who believed they were the authors of their own actions.

  They didn't know about the wasps. They didn't know that the reason for the milkshake wasn't love, but bonding behavior selected for pair stability. They didn't know that the reason for the eggs wasn't hunger, but protein maintenance for labor.

  Julian took the fork the waitress put down. He held it. He could drop it. He could stand up and leave. He could scream.

  If he screamed, what would be the reason? To release tension? To alert the group to danger?

  There was no move he could make that wasn't already accounted for by the logic of the organism. He was trapped inside the purpose.

  He cut the pie. The crust flaked. He lifted the fork.

  He paused. For a second, just a second, he tried to find the edge of the thought. He tried to find the place where *Julian* began and the *biology* ended. He pushed against the inside of his own skull, looking for a wall, a door, a window.

  There was nothing. Just the smooth, cold curve of the intent. The hunger was real. The pie was real. The hand moving was real.

  But he wasn't there.

  He ate the pie. It tasted like sugar and flour. It tasted like fuel.

  When he finished, he paid the bill. He left a tip. Twenty percent. Standard. Optimal for service industry morale.

  He walked out to the car. The night was cold. He got in and started the engine. He had to finish the report. He had to recommend the burn.

  He put the car in drive. He didn't decide to do it. The car moved because the engine was running and the gear was engaged and the road was there.

  As he drove, the fields rolled by on either side, dark and silent. He wondered if the corn watched him pass. He wondered if it knew he was coming back to burn it. He wondered if the burn was part of the plan.

  He reached for the radio knob to turn on the news. He stopped his hand halfway there.

  He left it off.

  He didn't know why. Maybe he wanted the silence. Maybe the silence was necessary for the next step.

  He drove on, following the road because it was there, doing the work because it needed doing, carrying the reason because there was no one else to hold it.
