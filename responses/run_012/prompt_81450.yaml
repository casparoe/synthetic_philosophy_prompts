answer: |-
  **Audience Profile & Weak Joints**
  Your audience are naturalists who treat Dennett's "real patterns" as a tool for saving ontology in a physicalist world, not for expanding it into the humanities. They view "real patterns" as abstractions that track *actual* causal structures in the territory (e.g., centers of gravity, belief-states in brains). Your weakest joint is the claim that a pattern residing in a representational artifact (the text) counts as a "real pattern" in the same sense as a pattern residing in the physical flux. They will suspect you are using Dennett to smuggle in a kind of Platonism or, conversely, that you are describing psychological utility and calling it ontology. The "Lending-library constraint" is your shield, but they will attack it as merely intersubjective agreement, not reality.

  **Q&A Prep Sheet**

  **1. The Causal Grounding Objection**
  *Objection:* "Dennett's real patterns are real because they support predictions about the physical world by compressing physical data. A fictional character supports predictions about a text, not the world. You are conflating a pattern *in* the territory with a pattern *of* a map. Without causal traction in the physical domain, this is not a real pattern; it is a useful fiction."
  *Reply:* I concede characters lack *physical* causal powers, but Dennett's pragmatism denies a hard line between territory and map. A center of gravity is real not because it pushes atoms, but because it predicts the behavior of the system. A character is a pattern in the *cultural* ecosystem. When I predict a reader's emotional response or a critic's analysis based on a character's traits, I am predicting physical events (neural states, speech acts) using the character pattern. The pattern saves predictive complexity regarding the behavior of readers and texts. If it earns its keep in the cognitive economy, it is real in the only sense Dennett cares about.
  *Soft Spot:* You are stretching "physical prediction" to include "interpretive prediction." Hardline physicalists will reject this as category confusion.

  **2. The Instrumentalism Charge**
  *Objection:* "You've described when it is *useful* to talk about characters, not when they *exist*. You've given us conditions for legitimate assertion, not ontological commitment. This is fictionalism with extra steps. Why call it realism?"
  *Reply:* Because for a Dennettian, existence *is* legitimate assertibility under a stance. There is no 'realer' reality behind the patterns. To say a pattern is 'merely useful' is to assume a God's-eye view of reality that naturalism rejects. If the pattern is stable, re-identifiable, and supports counterfactuals, it is as real as a hurricane or a currency market. I am not adding ontology; I am recognizing the ontology we already use when we explain cognitive behavior.
  *Soft Spot:* This sounds like verbal sleight of hand. You must insist that "real" is a functional grade, not a metaphysical binary.

  **3. The Counterfactual Indeterminacy Problem**
  *Objection:* "Your Lending-library constraint requires counterfactual predictions. But for most characters, the text is silent on key scenarios. Readers diverge on what Hamlet would do in a modern cafe. Where is the fact of the matter? A real pattern requires objective stability, not interpretive variance."
  *Reply:* Real patterns come in degrees. A center of gravity is indeterminate if the object is disintegrating. Similarly, a character pattern is real only to the degree that the community converges on predictions. Where the text is silent and readers diverge, the pattern dissolves. I am not claiming characters are complete persons; I am claiming they are partial patterns. The indeterminacy doesn't refute realism; it maps the boundaries of the pattern's reality.
  *Soft Spot:* If the variance is high, you risk admitting the pattern isn't real enough to matter.

  **4. The Stance Conflation Objection**
  *Objection:* "You say the design stance toward the author grounds the intentional stance toward the character. But the design stance applies to the artifact (the book), not the content. You are treating the character as a designed component, but the character is the *object* of the design, not the designer's tool. This conflates the vehicle with the content."
  *Reply:* The character is a functional component of the artifact's design. The author designs the text *to realize* the character pattern. We take the design stance toward the book to locate the intentional stance toward the character. Without the design stance (acknowledging the text is constructed), the intentional stance is hallucination. The design stance validates the intentional stance by ensuring the pattern isn't random noise but a selected signal.
  *Soft Spot:* This risks making the author's intent too authoritative, conflicting with the "independent readings" part of your constraint.

  **5. The Interest-Relativity Problem**
  *Objection:* "Compression is interest-relative. I can find a pattern in static if I try hard enough. If the reality of the character depends on our interest in compressing the text, then the reality is mind-dependent. How is this naturalism?"
  *Reply:* All real patterns are interest-relative. A 'threshold' in biology is real only relative to an organism's survival interests. That doesn't make it unreal. The 'interest' here is not whimsical; it is constrained by the cognitive architecture of human readers and the physical marks on the page. The constraint is evolutionary and cultural, not individual.
  *Soft Spot:* Naturalists worry this opens the door to 'anything goes' relativism.

  **6. The Causal Exclusion Problem**
  *Objection:* "If characters are abstract patterns, how do they cause concrete effects, like my tears or my buying a ticket? If the physical brain state does the work, the character is causally excluded. You cannot have it both ways."
  *Reply:* The pattern *is* realized in the brain state. The character is the software; the brain is the hardware. Asking how the character causes tears is like asking how the software causes the screen to light up. It causes it by organizing the physical substrate. The pattern is the causal structure of the neural activity. Exclusion only arises if you think the pattern is a ghostly extra thing. It isn't; it's the shape of the physical process.
  *Soft Spot:* This works for real minds, but for fictional characters, the pattern is distributed across many brains, not localized in one.

  **7. The Inconsistency Objection**
  *Objection:* "Many characters display contradictory traits that break predictive coherence. A real pattern must be coherent enough to support prediction. If the text forces contradictory intentional stances, the pattern collapses. You cannot have a real pattern that violates the law of non-contradiction."
  *Reply:* Patterns can be noisy. We smooth over inconsistencies in real people too. We say 'he wasn't himself.' In fiction, we treat contradictions as noise or higher-order complexity. If the contradiction is total, the pattern fails. But most literary characters are consistent enough to support the compression. The pattern is robust, not perfect.
  *Soft Spot:* Literary modernism often relies on breaking this coherence. You may have to exclude radical experimental characters from your realism.

  **8. The Question I Hope Nobody Asks**
  *Objection:* "If a community of readers stably agrees on an interpretation that contradicts the author's design and the text's explicit marks (e.g., a stable 'fanon' headcanon), does your view make that false pattern real?"
  *Reply:* Yes, relative to that community. If the pattern supports prediction within that social group, it is a real social pattern. It is not real relative to the textual design, but social reality is stance-relative. I must concede there are multiple realities here: the textual pattern and the communal pattern. They can diverge.
  *Soft Spot:* This commits you to a relativism that undermines the "Lending-library constraint" as a truth-tracking mechanism.

  Verdict: You must neutralize the Causal Grounding Objection or your realism collapses into instrumentalism.
