          *   EDT treats the agent's action as evidence subject to the same probabilistic laws as external events.
          *   Death in Damascus forces the agent to treat their own decision as a prediction target.
      *   **Is the case under-described?** Often, yes. Does the agent know the prediction is perfect? Can they randomize? (Mixed strategies). If mixed strategies are allowed, CDT can recommend a 50/50 split to make the predictor uncertain (if the predictor predicts the *probability*). But if the predictor predicts the *outcome*, randomization doesn't help.

