      *   *EDT Stance:* The case shows CDT is blind to relevant information. (Though EDT actually struggles here too, often leading to instability).
      *   *The "Two Questions" Hypothesis:* This is the most productive path. Deliberation (what should I do?) vs. Explanation (what did he do?).
