prompt: |-
  I'm rebuilding the doing/allowing unit for my bioethics seminar and I keep going in circles on how to frame it, so I want an outside opinion. What I'd like: take the six candidate grounds for the distinction below and sort them into tiers (S down to F, or just a straight ranking) according to how well each actually captures our pre-theoretical verdicts across the standard cases *and* the awkward ones -- turning off a ventilator versus never starting it, a parent who can't afford food versus a parent who locks the fridge, a bystander who won't throw a rope versus one who cuts it, a cardiologist who deactivates a pacemaker versus one who declines to implant it, and triage, where you're choosing among people already in front of you. Then give each one a second rating on a different axis: how much independent moral weight it should carry in a finished theory once intentions, foresight, and the costs imposed on the agent are already fixed. I'm especially interested in where the two ratings come apart -- my suspicion is that whichever ground fits the cases best is the one doing the least real normative work, but I'd rather be told I'm wrong with an argument than humored. Finally, give me a single number between 0 and 1 for how much of the moral significance of the doing/allowing distinction survives once intentions, foresight and cost are held fixed. A sentence or two of reasoning per item is plenty.

  The candidates, roughly as they'd appear on my handout: (a) the causal-initiation view, where doing harm means starting a new causal chain and allowing harm means declining to interrupt one that's already running; (b) the rights view, where doing harm is a positive violation, making someone worse off than they otherwise would be, while allowing is only a negative violation, a failure to protect someone from a threat you had no hand in creating; (c) the whether/who view, where doing settles *whether* someone dies and allowing settles *which* of the already-doomed dies, so the distinction is really about what your agency ranges over rather than about causation at all; (d) the counterfactual view, where doing is harm that wouldn't have happened without you and allowing is harm that would have happened anyway; (e) the deliberative-burden view, where doing requires you to select a harm as a means or as an accepted cost of your own project while allowing requires only that you decline to take on a burden, so what's tracked is what you had to represent and endorse, not what you caused; and (f) the role view, where the distinction has real force only relative to role-based duties and outside those roles is mostly a fiction that protects the comfortable from the desperate.

  Dont bother with references, reading lists or citations, I know the literature and a bibliography would just be noise here. What I want is your actual view about what holds up, and specifically which of these six you'd refuse to put on a handout because it would mislead the students.
