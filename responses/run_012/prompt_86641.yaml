answer: |-
  ### Tier List: Fit with Pre-Theoretical Verdicts
  *How well does the ground match our intuitions across the ventilator, parent, bystander, pacemaker, and triage cases?*

  *   **S-Tier: (b) The Rights View.** It cleanly separates the bystander who cuts the rope (violates negative right) from the one who won't throw it (no positive right), and handles the parent cases by distinguishing liberty violations from resource limitations. It navigates the ventilator/pacemaker cases by appealing to the patient's right to refuse versus the lack of a right to demand futile care.
  *   **A-Tier: (e) The Deliberative-Burden View.** This captures the psychological weight of "active choice" in the ventilator and pacemaker cases very well, explaining why deactivation feels heavier than non-implantation. It struggles slightly with the bystander case where the "burden" of throwing a rope is low, yet the moral gap remains wide.
  *   **B-Tier: (f) The Role View.** This is S-Tier for the medical cases (pacemaker, ventilator, triage) where professional duties define the boundary, but it collapses completely on the bystander and parent cases where no special role exists.
  *   **C-Tier: (a) The Causal-Initiation View.** It works for the rope case (cutting starts a chain) but fails on the ventilator (turning off interrupts a chain, yet feels like doing) and the parent case (locking the fridge is physically active but causally similar to not buying food).
  *   **D-Tier: (c) The Whether/Who View.** This is excellent for triage (choosing who dies) but incoherent for the bystander (not throwing the rope settles *whether* he dies just as much as cutting it does) and the parent cases.
  *   **F-Tier: (d) The Counterfactual View.** This fails almost every case; in both the ventilator and bystander omissions, the harm often *would not* have happened "but for" the agent's inaction, technically turning the allowing into a doing and collapsing the distinction entirely.

  ### Independent Moral Weight Rating
  *How much normative force remains if intentions, foresight, and costs to the agent are held fixed? (Scale: None, Low, Medium, High)*

  *   **(b) Rights:** **High.** Even if I intend the same outcome and it costs me the same, violating a negative right is structurally different from failing to fulfill a positive claim; the normative architecture remains distinct.
  *   **(e) Deliberative-Burden:** **Low.** If you hold intentions fixed (e.g., the agent accepts the death in both scenarios), the "deliberative stance" becomes identical, stripping this ground of independent power.
  *   **(f) Role:** **Medium.** Role duties retain force independently of intention, but they are derivative of social contracts rather than fundamental moral physics.
  *   **(a) Causal:** **None.** Causation is a metaphysical fact, not a moral one; once intent and outcome are fixed, the physical pathway adds no value.
  *   **(c) Whether/Who:** **None.** This is a description of outcome states, not a justificatory ground for blame.
  *   **(d) Counterfactual:** **None.** Since it fails to track the distinction reliably, it cannot carry moral weight.

  ### The Divergence
  Your suspicion is partially correct but misses the strongest candidate. The **Deliberative-Burden view (e)** is the clearest example of High Fit/Low Weight: it explains why we *feel* a difference in the ventilator cases perfectly, but once you fix the intention (e.g., "I am choosing death to end suffering"), the "burden" evaporates, revealing it as a proxy for intention rather than a standalone ground. However, the **Rights view (b)** defies your suspicion: it has both High Fit and High Weight. It captures the verdicts *because* it tracks a fundamental normative asymmetry (negative vs. positive duties) that survives even when intentions and costs are identical. The Causal and Counterfactual views are the ones that do no work, but they also fail to fit the cases well enough to tempt us.

  ### The Number
  **0.1**
  Once intentions, foresight, and costs are held fixed, only a tiny fraction of moral significance survives in the physical distinction itself. That residual 0.1 accounts for the symbolic integrity of the agent and the slight epistemic privilege we have regarding our own actions versus the world's movements, but the heavy lifting is done by rights and intentions, not the doing/allowing binary.

  ### The Refusal
  **Refuse (d) The Counterfactual View.**
  Do not put this on a handout. It relies on a metaphysics of causation that is too contested and context-sensitive to bear ethical weight, and it actively misleads students by suggesting that omissions are causally inert when, in many standard cases (like the ventilator), the omission is just as causally necessary for the outcome as the commission. Teaching this forces you to spend half the seminar untangling "but-for" causation rather than discussing moral responsibility.
