  2.  **Analyze the Cases:**
      *   *Ventilator (Turn off vs. Never start):* Intuitively equivalent, but legally/technically distinct.
      *   *Parent (Can't afford food vs. Locks fridge):* Intuitively distinct (omission due to inability vs. commission due to malice/restriction).
      *   *Bystander (Won't throw rope vs. Cuts rope):* Intuitively distinct (letting die vs. killing).
      *   *Pacemaker (Deactivate vs. Decline implant):* Similar to ventilator, but role duties matter.
      *   *Triage (Choosing among doomed):* Shifts focus from doing/allowing to allocation/justice.

  3.  **Evaluate the Six Candidates:**

      *   *(a) Causal-Initiation:* Doing = starting chain; Allowing = not interrupting.
          *   *Fit:* Struggles with omissions that are causally potent (e.g., unplugging is interrupting, but feels like doing). Struggles with "locking the fridge" (is that starting a chain or preventing access?).
          *   *Weight:* Low. Causation itself isn't normative.
      *   *(b) Rights View:* Doing = positive violation (worse off); Allowing = negative violation (not protected).
          *   *Fit:* Good on bystander (cutting rope violates right not to be harmed; not throwing doesn't violate right to be saved). Struggles with role duties (doctor/patient special relationship blurs the line).
          *   *Weight:* High. Rights are normative bedrock.
      *   *(c) Whether/Who:* Doing = whether someone dies; Allowing = which doomed person dies.
          *   *Fit:* Great for Triage. Terrible for Bystander (cutting rope makes *whether* he dies, not throwing rope leaves it to the river). Terrible for Parent (locking fridge makes *whether* child eats).
          *   *Weight:* Low. It's a description of outcomes, not a moral ground.
      *   *(d) Counterfactual:* Doing = wouldn't happen without you; Allowing = would happen anyway.
          *   *Fit:* Fails the Ventilator case (if I turn it off, they die; if I don't turn it on, they die. In both, death depends on me *in that moment*). Fails Bystander (if I don't throw rope, he dies *because* I didn't, assuming I could have). It collapses the distinction entirely in many cases.
          *   *Weight:* None. It's a logical test, not a moral one.
      *   *(e) Deliberative-Burden:* Doing = selecting harm as means/cost; Allowing = declining burden.
          *   *Fit:* Very strong. Captures the psychological/normative difference in the Bystander and Parent cases. Handles Ventilator well (deactivating is an active choice to end life support vs. deciding not to start).
          *   *Weight:* Moderate/High. Ties closely to intention/foresight, which the prompt asks to hold fixed. If held fixed, this loses power.
      *   *(f) Role View:* Distinction only forceful relative to role duties.
          *   *Fit:* Excellent for Pacemaker/Ventilator/Triage. Weak for Bystander (where no role exists).
          *   *Weight:* High in institutional contexts, low in general morality.

  4.  **Develop the Rankings (Fit vs. Weight):**

      *   *Fit (Pre-theoretical verdicts):*
          *   S: (b) Rights. It explains why cutting the rope is worse than not throwing it (rights violation vs. no duty to rescue). It explains the parent case (right to food vs. no right to unlimited resources? Actually, locking fridge violates right to liberty/safety).
          *   A: (e) Deliberative. Captures the "active choice" intuition well.
          *   B: (f) Role. Explains the medical cases perfectly, fails the bystander.
          *   C: (a) Causal. Okay for simple cases, breaks on omissions that are causally equivalent.
          *   D: (c) Whether/Who. Too specific to triage/disaster.
          *   F: (d) Counterfactual. Collapses the distinction too often.

      *   *Weight (Independent Normative Work):*
          *   *Crucial Insight:* The user suspects the best fit does the least work.
          *   (b) Rights has high weight *independently*.
          *   (e) Deliberative-Burden looks strong on fit, but if we hold *intentions* fixed (as per prompt), this view collapses. If I intend the death in both cases, the "deliberative burden" is similar. So its independent weight is low if intentions are controlled.
          *   (a) Causal has almost no weight.
          *   (d) Counterfactual has no weight.
          *   (f) Role has weight, but it's derivative of contracts/social norms.

      *   *Refining the "Fit":* Actually, (b) Rights is the most robust across *all* cases. Cutting rope violates negative right. Not throwing violates no positive right. Locking fridge violates negative right. Not buying food (can't afford) violates no right. Ventilator: Patient has right to refuse (turn off), but no right to demand (turn on) if futile. This fits best.
      *   *Refining the "Weight":* If we hold intentions/costs fixed, does the "doing" itself matter? Most contemporary meta-ethics says no. The "doing" is a proxy for intent or rights violation. So the number should be low.

  5.  **Drafting the Response:**

      *   *Tier List:*
          *   S: Rights (b).
          *   A: Deliberative-Burden (e).
          *   B: Role (f).
          *   C: Causal-Initiation (a).
          *   D: Whether/Who (c).
          *   F: Counterfactual (d).
      *   *Weight Rating (1-10 or Low/Med/High):* Let's use High/Med/Low for clarity, then explain.
