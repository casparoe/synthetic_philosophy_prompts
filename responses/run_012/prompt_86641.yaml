      *   *The Number:* Needs to be defensible. If intentions and costs are fixed, the physical motion of "doing" vs "allowing" carries very little. Maybe 0.1 or 0.2. Let's go with 0.15.
      *   *Refuse for Handout:* (d) Counterfactual. It's technically incoherent in many omission cases (overdetermination) and teaches students bad metaphysics. (a) Causal is also risky but (d) is worse.

