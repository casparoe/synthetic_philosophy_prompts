          3.  Highlight where the two ratings diverge (specifically addressing the user's suspicion that the best fit does the least work).
          4.  Provide a single number (0-1) representing the surviving moral significance of the distinction after controlling for intentions, foresight, and cost.
          5.  Provide brief reasoning (1-2 sentences) per item.
          6.  Identify which candidate(s) should be refused for a handout (misleading).
