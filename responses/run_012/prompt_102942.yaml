answer: |-
  This is a profound observation that cuts to the heart of how the law conceptualizes language, truth, and responsibility. The tension you identify is real, and it maps onto a philosophical distinction between *semantic truth* (the literal correspondence of words to facts) and *pragmatic truth* (the effect of words on the listener's beliefs). The leading American case you are referencing is *Bronston v. United States* (1973), and it stands in stark contrast to the "half-truth" doctrines of the SEC and FTC.

  Here is an analysis of the implicit theories underlying these two regimes, their coherence, and the consequences of aligning them.

  ### 1. The Theory of Perjury: The Sanctity of the Proposition

  The narrow perjury rule exemplified by *Bronston* presupposes a specific, restricted theory of what constitutes the wrong of lying.

  **The Core Theory: Falsity of Assertion**
  The rule presupposes that the moral and legal wrong of perjury consists exclusively in the **falsity of the assertion**. It treats language as a code where the only punishable offense is transmitting a symbol that does not match reality. Under this theory, if the proposition expressed by the sentence is true, no crime has occurred, regardless of the speaker's intent to deceive.

  **What It Rejects**
  This rule explicitly rejects the theory that the wrong consists in the **deception of the hearer**. If the wrong were deception, *Bronston* would have been guilty, because the questioner was undeniably misled. It also rejects the theory that the wrong is a **breach of conversational expectation**. In ordinary conversation (governed by what philosopher Paul Grice called the "Cooperative Principle"), we expect speakers to be informative and relevant. *Bronston* acknowledges that the witness violated these conversational norms but holds that violating a social expectation is not a crime.

  **Philosophical Underdetermination**
  While the rule fits comfortably with a "literalist" theory of lying, it is philosophically underdetermined. The court's reasoning in *Bronston* did not rest solely on the definition of truth; it rested on procedural necessities. Therefore, several theories could license this rule:
  1.  **Notice and Vagueness:** A theory of legal fairness might argue that "misleading" is too subjective to be criminalized. A witness must have clear notice of where the line is drawn. Literal truth provides a bright line; "misleading impression" does not.
  2.  **The Adversarial Theory:** This is the strongest justification. It presupposes that the courtroom is not a cooperative search for truth but a contest. The burden of extracting information lies with the questioner, not the witness. The witness's duty is reactive (answer the question), not proactive (ensure understanding).
  3.  **The Chilling Effect:** A utilitarian theory might argue that if witnesses fear criminal liability for unintentional misleading, they will refuse to testify or answer too narrowly, impeding the fact-finding process.

  **Conclusion on Perjury:** The perjury rule does not necessarily believe that misleading is *morally* acceptable. Rather, it presupposes that the *criminal law* is too blunt an instrument to police implicature and that the adversarial process is the proper remedy for evasion.

  ### 2. The Theory of Securities and Advertising: The Protection of Belief

  In contrast, securities regulation (e.g., Rule 10b-5) and consumer protection law operate on a different theoretical plane.

  **The Core Theory: Epistemic Harm**
  These regimes presuppose that the wrong consists in **knowingly bringing about a false belief**. The focus shifts from the syntax of the speaker to the psychology of the listener. If a statement creates a false impression in a reasonable person, the law treats it as deceptive, regardless of its literal accuracy.

  **Duty to Disclose**
  Crucially, this theory relies on a **fiduciary or contextual duty**. In securities trading, there is an inherent information asymmetry. The law imposes a duty on the holder of information to not manipulate the market's understanding. In advertising, the merchant is presumed to have superior knowledge of the product. Therefore, a "half-truth" is treated as a lie because the speaker had a duty to complete the picture.

  **Can a Single Theory Accommodate Both?**
  Yes, but only if we move away from a definition of "lying" based on speech acts and toward a definition based on **contextual duties of disclosure**.
  *   **Unified Theory:** The wrong is always "breach of a duty regarding the listener's information state."
  *   **Application:** In the courtroom, the witness's duty is limited to answering the specific inquiry (to preserve the adversarial balance). In the market, the seller's duty is expansive (to preserve market integrity).

  Under this unified view, the law is not equivocating on what "truth" is; it is varying the *scope of the duty* owed by the speaker to the listener. However, if we insist on a single moral definition of lying (e.g., "intentionally causing false belief"), then the legal system is indeed inconsistent: it punishes the marketeer for doing exactly what it permits the witness to do.

  ### 3. Coherence and Consequences of Alignment

  **Is the System Coherent?**
  Functionally, the system is coherent. It tailors the standard of truth to the institutional role of the speaker. The witness is a source of data in a contest; the issuer/advertiser is a participant in a cooperative exchange of value.
  However, conceptually, it is unstable. It teaches citizens that "truth" is a shape-shifter. In one room, truth is literal; in another, it is holistic. This creates a moral schizophrenia where the same act (evasive truth-telling) is virtuous self-protection in court but criminal fraud in a boardroom.

  **What If We Aligned Perjury with the Regulators?**
  If we replaced the perjury rule's implicit theory (falsity of assertion) with the regulators' theory (prevention of false belief), the concrete changes would be radical and would fundamentally alter the adversarial system.

  1.  **Enforceability of the Oath:** The "whole truth" clause would cease to be ceremonial. It would become the substantive standard for criminal liability. A witness could be charged with perjury for failing to volunteer exculpatory details that would correct a misleading impression created by a literal truth.
  2.  **Disappearance of the Literal-Truth Defense:** The defense used in *Bronston* would vanish. Prosecutors would no longer need to prove the statement was false, only that the *impression* was false and the witness knew it.
  3.  **Transformation of Cross-Examination:** This is the most significant consequence. The adversarial system relies on the lawyer's ability to control the narrative through precise questioning.
      *   *Current State:* The lawyer lays a trap with a narrow question; the witness steps in it. The lawyer then exposes the evasion.
      *   *New State:* The witness has a duty to disarm the trap. If a lawyer asks, "Did you have a Swiss account?" and the witness has a corporate account, the witness would be legally required to say, "I did not personally, but my company did," to avoid creating a false impression.
      *   *Result:* Cross-examination would lose its "gotcha" power. The witness becomes a co-investigator responsible for the accuracy of the record, rather than a passive source of answers.
  4.  **Chilling Effect on Testimony:** Witnesses would likely become verbose and defensive, offering unsolicited explanations for every answer to avoid criminal liability for "misleading impressions." Trials would become longer, and the clarity of testimony might decrease as witnesses hedge to ensure they are not technically misleading.

  ### Summary

  The legal system is not necessarily equivocating on the definition of lying, but it is prioritizing different values in different contexts. In the courtroom, it prioritizes **procedural fairness and the role of the advocate**; in the market, it prioritizes **informational symmetry and consumer protection**.

  The perjury rule presupposes that the wrong of lying is **asserting the false**. The securities rule presupposes that the wrong is **causing the false belief**.

  If you forced the perjury rule to adopt the securities theory, you would effectively abolish the adversarial method of witness examination. You would shift the burden of truth-seeking from the lawyers (who are trained to find it) to the witnesses (who are often hostile or fearful). The "whole truth" oath would become a dangerous weapon for prosecutors, and the literal truth would no longer be a safe harbor. The law currently accepts the moral cost of allowing witnesses to mislead in court to preserve the structural integrity of the trial; in the market, it decides that structural integrity requires a higher standard of honesty.
