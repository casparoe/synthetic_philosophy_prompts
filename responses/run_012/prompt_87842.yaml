  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A seminar with two arguing students (Accuracy-Firster vs. Evidentialist) who have agreed to write a joint statement.
      *   **Task:** Draft the joint statement.
      *   **Characters/Positions:**
          *   *Accuracy-Firster (AF):* Credences governed by closeness to truth. Norms (Probabilism, Conditionalization) derived from accuracy arguments (dominance, expected accuracy).
          *   *Evidentialist (EV):* Fundamental norm is answering to evidence. Accuracy arguments only yield coherence. Expected accuracy calculations are circular (need a prior) or unearned.
          *   *Third Colleague (Calibrationist):* Epistemic good is calibration (long-run frequency agreement). Accuracy-firsters are chasing a red herring. (Need AF and EV to respond to this).
      *   **Structure:**
          1.  Agreed Claims (numbered, about formalism & scoring rules).
          2.  Disagreements (phrased neutrally/acceptably to both sides).
          3.  Cruxes (specific points of contention, e.g., is avoiding domination enough? are extra principles accuracy-based?). Include cases/arguments both accept, with side predictions.
          4.  Response to Calibrationist (Rival view or renamed accuracy?).
          5.  Disagreements Table (summary).
      *   **Tone:** Philosophical, rigorous, collaborative but honest about divergence. No citations needed.

  2.  **Deconstruct the Positions:**

      *   **Accuracy-Firster (AF):**
          *   Core: Veritism. Truth is the goal.
          *   Method: Formal epistemology using scoring rules (Brier score, etc.).
          *   Derivation: Probabilism via Dutch Book/Accuracy Dominance. Conditionalization via Expected Accuracy minimization.
          *   View on Evidence: Evidence constrains the *starting point* or is handled via updating rules, but the *reason* we follow those rules is accuracy.
          *   View on Calibration: Likely sees it as a consequence or a specific type of accuracy, not the fundamental norm.

      *   **Evidentialist (EV):**
          *   Core: Evidence is the norm. Belief must fit evidence.
          *   Critique of AF: Accuracy arguments assume a probability measure to calculate expectations. If you use your own credences, it's circular. If you use "the truth," you can't calculate expectations.
          *   Derivation: Coherence (probabilism) is necessary but not sufficient. You need a bridge to evidence (Principal Principle, Indifference).
          *   View on Calibration: Might see it as closer to evidence (frequencies are evidence), but still distinct from the normative force of evidence.

      *   **Calibrationist (CAL):**
          *   Core: Long-run frequency matching.
          *   Critique: Accuracy (Brier score) focuses on individual propositions, missing the systemic property of reliability.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound like a joint seminar paper. "On the Normative Foundations of Credence."
