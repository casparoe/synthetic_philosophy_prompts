          *   *Phrasing:* "The Circularity Objection." EV: Expectations require priors. AF: Priors are justified by accuracy too.

      *   **Section 3: The Cruxes:**
          *   *Crux 1: Domination vs. Rationality.*
              *   Question: Is avoiding accuracy dominance sufficient for rationality?
              *   AF: Yes (mostly).
