              *   *Verdict:* Both agree it's not a *rival* fundamental norm, but AF says it's "Accuracy Renamed/Approximated," EV says it's "Evidential Fit Renamed." Actually, prompt asks if it's rival or renamed. Let's nuance: AF says "Renamed/Secondary," EV says "Rival but mistaken." Wait, better: AF says "Secondary property of accurate agents." EV says "Distinct but insufficient." Let's align them to say it's not the *fundamental* norm.

      *   **Section 5: Disagreements Table:**
