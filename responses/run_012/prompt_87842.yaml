answer: |-
  **Joint Statement on the Normative Foundations of Credence**
  **Seminar Paper: Epistemic Norms and Formal Constraints**
  **Authors: [Accuracy-First Proponent] & [Evidentialist Proponent]**

  ### Preamble
  Over the course of this term, we have debated the foundations of epistemic normativity. While we disagree on the fundamental source of normative authority, we recognize that our positions share a formal backbone and diverge at specific philosophical junctures. This document maps our agreements, isolates our disagreements, and records our joint response to a third challenge regarding calibration.

  ### I. Agreed Claims
  *We jointly endorse the following claims regarding the formal framework and the limitations of scoring rules.*

  1.  **Formalism:** Credences are appropriately modeled as functions from a set of propositions to the real interval [0, 1].
  2.  **Scoring Rules:** An accuracy scoring rule assigns a numerical score to a credence function at a world, representing the distance between the credence and the truth value of the proposition in that world. Lower scores indicate higher accuracy.
  3.  **Propriety:** We agree that for any normative argument based on expected accuracy to function, the scoring rule must be *strictly proper* (i.e., an agent maximizes expected accuracy by reporting their true credences).
  4.  **Dominance and Probabilism:** We agree that if a credence function violates the axioms of probability, there exists an alternative probabilistic credence function that is strictly more accurate in every possible world (accuracy dominance). Therefore, probabilism is a necessary condition for accuracy-optimization.
  5.  **Limitations of Scoring:** We agree that a scoring rule alone does not dictate which specific credence function an agent ought to hold in a vacuum; it only ranks functions relative to worlds or relative to expectations.
  6.  **Calibration Distinction:** We agree that calibration (the long-run frequency match between credence and truth) is mathematically distinct from accuracy (the closeness of credence to truth in individual cases). An agent can be accurate without being calibrated, and calibrated without being accurate.

  ### II. Statement of Disagreements
  *The following points characterize our divergence. Each formulation is phrased to be acceptable to the author holding the opposing view.*

  **1. The Status of Accuracy**
  *   **[Accuracy-First]:** Closeness to the truth (accuracy) is the *fundamental* epistemic good. All other epistemic norms (including evidential norms) are derivative; they are rational only insofar as they serve the goal of maximizing accuracy.
  *   **[Evidentialist]:** Responsiveness to evidence is the *fundamental* epistemic norm. Accuracy is a desirable feature of beliefs, but it is not the *reason* we ought to hold them. We ought to hold beliefs because they are supported by evidence; accuracy is merely the measure of success if the evidence is good.

  **2. The Circularity of Expectation**
  *   **[Accuracy-First]:** Arguments for updating rules (like Conditionalization) based on expected accuracy are non-circular. The probability function used to weight the expectation is justified by prior accuracy-dominance arguments.
  *   **[Evidentialist]:** Arguments for updating rules based on expected accuracy presuppose a probability function to calculate the expectation. If this function is the agent's current credence, the argument is circular (presupposing the rationality of the credence it aims to justify). If it is not the agent's credence, the authority of that weighting function is unearned.

  **3. The Scope of Coherence**
  *   **[Accuracy-First]:** Adhering to coherence norms (Probabilism, Conditionalization) is sufficient for epistemic rationality, provided the agent started from a permissible prior.
  *   **[Evidentialist]:** Coherence is necessary but not sufficient. An agent can be perfectly coherent yet irrational if their credences do not match the evidence they possess (e.g., ignoring a reliable testimony).

  ### III. The Cruxes
  *We identify two specific pivot points where our theories yield different verdicts. For each, we describe a case we both accept as relevant and record our divergent predictions.*

  **Crux 1: Is Avoiding Dominance Sufficient?**
  *   **The Question:** If an agent's credences are probabilistically coherent and they update by conditionalization, are they epistemically rational, even if their priors seem arbitrarily disconnected from their evidence?
  *   **The Case (The Optimistic Prior):** An agent is born with a coherent prior that assigns 0.99 to "The world is good" regardless of sensory input. They update by conditionalization as evidence comes in, but their prior is so skewed that they require overwhelming evidence to shift. They are never accuracy-dominated.
  *   **[Accuracy-First] Prediction:** The agent is **Rational**. They have satisfied all formal norms derivable from the goal of truth. The prior is permissible because no accuracy argument rules it out *ex ante*.
  *   **[Evidentialist] Prediction:** The agent is **Irrational**. Their prior fails to answer to the evidence available at the start (e.g., the lack of evidence for a good world). Coherence without evidential fit is empty.

  **Crux 2: The Source of Bridge Principles**
  *   **The Question:** Are principles connecting credence to the world (e.g., the Principal Principle, which ties credence to objective chance) derived from accuracy, or are they independent norms?
  *   **The Case (The Unbiased Coin):** An agent knows a coin is objectively chancy with chance(Heads) = 0.5. They have no other evidence.
  *   **[Accuracy-First] Prediction:** The norm to set credence to 0.5 is **Accuracy-Based**. Deviating from 0.5 lowers expected accuracy given the structure of chance. The Principal Principle is a theorem of accuracy-first epistemology.
  *   **[Evidentialist] Prediction:** The norm to set credence to 0.5 is **Evidence-Based**. The fact about objective chance *is* the evidence. Accuracy arguments cannot generate this constraint without smuggling in the evidential link between chance and credence.

  ### IV. The Calibrationist Challenge
  *A third colleague has argued that the real epistemic good is Calibration (long-run agreement between credence and frequency), and that our debate over accuracy is a red herring. We offer the following joint response:*

  **Joint Stance:** We agree that Calibration is not the fundamental epistemic norm. However, we disagree on its relationship to Accuracy.

  *   **[Accuracy-First] on Calibration:** Calibration is **Accuracy Renamed (in the long run).** If an agent maximizes accuracy locally across many trials, they will tend to be calibrated. The Calibrationist is correctly identifying a property of accurate agents but mistaking the symptom for the cause. Accuracy applies to single cases where calibration is undefined; therefore, accuracy is more fundamental.
  *   **[Evidentialist] on Calibration:** Calibration is a **Rival View (but mistaken).** Calibration is a statistical property of a system, not a normative constraint on an agent's mind. An agent can be calibrated by luck (e.g., always guessing 0.5 on a fair coin) without being rational. However, the Calibrationist is right to doubt that *accuracy* is the fundamental norm, even if they are wrong to replace it with calibration. The fundamental norm remains evidence, which often *produces* calibration.

  ### V. Disagreements Table

  | Feature | [Accuracy-First] Position | [Evidentialist] Position |
  | :--- | :--- | :--- |
  | **Fundamental Norm** | Closeness to Truth (Accuracy) | Responsiveness to Evidence |
  | **Role of Scoring Rules** | Constitutive (defines rationality) | Diagnostic (measures success) |
  | **Probabilism** | Derived from Accuracy Dominance | Derived from Coherence of Evidence |
  | **Conditionalization** | Derived from Expected Accuracy | Derived from Evidential Updating |
  | **Circularity Objection** | Rejected (Priors earned by dominance) | Accepted (Expectations need priors) |
  | **Permissible Priors** | Wide (Any coherent function) | Narrow (Constrained by Evidence) |
  | **Principal Principle** | Theorem of Accuracy | Independent Evidential Norm |
  | **Calibration** | Long-run Accuracy | Statistical Fit (Distinct from Norm) |

  **Signed:**

  __________________________
  [Accuracy-First Proponent]

  __________________________
  [Evidentialist Proponent]
