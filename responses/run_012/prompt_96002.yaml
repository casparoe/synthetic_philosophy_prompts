  **STANDING: A PRACTICAL HANDBOOK FOR THE RECENTLY OFFENDED**
  **Published by The Institute of Relational Accounting**
  **Edition 4.2 (Compliance Updated)**

  **1.0 PURPOSE AND LEDGER MAINTENANCE**
  Welcome to Standing Management. This handbook assists clients in stabilizing social worth following an adverse interpersonal event. Worth is not a fixed constant; it is a fluctuating line item requiring active governance. Clients must select one of three standing Protocols per incident. Mixing Protocols within a single incident cycle is prohibited and may result in ledger insolvency.

  All incidents must be recorded in the **Standing Ledger**. Enter the date, the offending party, and the nature of the slight. Credit columns vary by Protocol.

  **2.0 AVAILABLE PROTOCOLS**
  **2.1 The External Asset Protocol (EAP)**
  Worth is a public possession held in the eyes of peers. Insult constitutes theft of asset value. Restoration requires a proportionate public response that demonstrates the offender's inability to devalue you without cost.
  **2.2 The Intrinsic Value Protocol (IVP)**
  Worth is inherent and impermeable. Insult is a category error. Restoration requires declining to register the event as an injury. No public response is issued; the ledger remains blank.
  **2.3 The Institutional Recognition Protocol (IRP)**
  Worth is accrued through acknowledged injury. Standing increases when suffering is validated by a governing body. Restoration requires filing a grievance that converts personal slight into institutional debt.

  **3.0 CLASSIFICATION RULES**
  To select a Protocol, apply the following rules to the incident. Note that instructions are mutually exclusive.

  **Rule 1: Eligibility of Offender**
  *   **EAP:** Respond only if the offender is a social peer. Insults from inferiors are ignored; insults from superiors are endured until parity is established.
  *   **IVP:** Respond to no one. The offender's status is irrelevant to your value.
  *   **IRP:** Respond only if the offender is subject to a higher authority capable of issuing formal censure.

  **Rule 2: Definition of Acknowledgment**
  *   **EAP:** Acknowledgment is the offender's public submission or loss of face.
  *   **IVP:** Acknowledgment is your own internal continuity of comfort.
  *   **IRP:** Acknowledgment is a written record entered into a permanent archive by a third party.

  **Rule 3: The Apology Paradox**
  *   **EAP:** An apology discharges the debt only if offered before you demand it.
  *   **IVP:** An apology is irrelevant; accepting it validates the possibility of injury.
  *   **IRP:** An apology creates a debt rather than discharging one. It serves as evidence that harm occurred, warranting further compensation.

  **Rule 4: Diffuse Offenders**
  *   **EAP:** If the offender is a crowd, challenge the loudest member.
  *   **IVP:** If the offender is a crowd, withdraw attention from the crowd.
  *   **IRP:** If the offender is a crowd, classify the event as "Systemic Hostility" and petition administration.

  **4.0 WORKED CASE: THE INTERCEPTION**
  **Incident:** During a quarterly review, Colleague X states, "As I mentioned earlier," regarding an idea you originated.

  **Application of EAP:**
  *   *Analysis:* Colleague X is a peer. Asset value is at risk.
  *   *Ledger Entry:* Debit "Respect."
  *   *Recommended Response:* Interrupt immediately. State, "I believe you are referring to my proposal." Demand eye contact. Do not proceed until X verbally concedes origin.
  *   *Outcome:* Standing restored via public correction.

  **Application of IVP:**
  *   *Analysis:* Your worth is not tied to credit allocation.
  *   *Ledger Entry:* No entry.
  *   *Recommended Response:* Continue speaking as if the interruption did not occur. Do not alter tone. Treat X's claim as background noise.
  *   *Outcome:* Standing maintained via invulnerability.

  **Application of IRP:**
  *   *Analysis:* Harm is documented via witness presence.
  *   *Ledger Entry:* Credit "Recognized Injury."
  *   *Recommended Response:* Do not interrupt. After the meeting, file a formal complaint with Human Resources regarding "Intellectual Appropriation." Request a mediated session.
  *   *Outcome:* Standing increased via institutional validation of victimhood.

  **5.0 COMMON ERRORS (FAQ)**

  **Q: Can I switch Protocols if the first fails?**
  A: No. Switching Protocols mid-incident signals instability. If EAP fails to yield submission, you cannot pivot to IRP without invalidating the initial claim of peer parity. Close the ledger and open a new incident file.

  **Q: What if I feel no injury under IRP?**
  A: Feeling is not required. Recognition is procedural. However, claiming injury without emotional distress may reduce the settlement value of the acknowledgment.

  **Q: Is IVP merely cowardice?**
  A: No. IVP requires rigorous discipline to maintain internal valuation against external negation. It is the most resource-intensive Protocol regarding self-regulation.

  **Q: What if the offender is deceased?**
  A: EAP users may speak ill of the dead to balance the record. IVP users must release the debt. IRP users may petition for posthumous reclassification of the offender's legacy.

  **6.0 COMPLIANCE NOTE**
  The Institute of Relational Accounting does not endorse one Protocol over another. We provide the ledger; you provide the valuation. Ensure your selected Protocol matches your long-term social liquidity goals.

  *© The Institute of Relational Accounting. All rights reserved. Do not reproduce without written permission from the Department of Moral Solvency.*
