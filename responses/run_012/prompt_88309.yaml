answer: |-
  ### The Protocol: A Decision Procedure for Moral Residue

  This procedure is designed to force specificity on vague unease. It does not generate morality; it audits your intuition. It terminates in one of four verdicts:
  1.  **REFUSE:** The act is impermissible.
  2.  **AUTHORIZE (COSTLY):** The act is regrettable but morally clean; no residue remains.
  3.  **AUTHORIZE (DIRTY):** The act is wrong but necessary; residue remains and must be discharged.
  4.  **RETURN:** The decision rests on a value judgment the procedure cannot resolve.

  **Step 1: Identify the Victim**
  Is the wrong done to an identifiable person (or specific group) whose rights are violated, or is it a breach of an abstract norm, role, or rule?
  *   *Identifiable Person:* Proceed to Step 2.
  *   *Abstract Norm:* Proceed to Step 2, but flag that "Moral Remainder" is harder to locate.

  **Step 2: The Necessity Test**
  Is there any other course of action that achieves the essential public good without this specific wrong? If "yes," the proposal fails Step 2. If "no," document why the alternative is impossible, not just difficult.
  *   *Pass:* Proceed to Step 3.
  *   *Fail:* Verdict **REFUSE**.

  **Step 3: Justification vs. Excuse**
  Are you claiming the act was *right* all-things-considered (Justification), or that the act was *wrong* but the Minister cannot be blamed for doing it under duress (Excuse)?
  *   *Justification:* You claim the good outweighs the wrong so thoroughly that the "wrong" ceases to be a moral violation. This leads to Verdict **AUTHORIZE (COSTLY)**.
  *   *Excuse:* You claim the act remains a violation, but the Minister must bear it to save the state. This leads to Verdict **AUTHORIZE (DIRTY)**.
  *   *Uncertain:* Verdict **RETURN**.

  **Step 4: Agency and Delegation**
  Who performs the act? Can it be delegated to a civil servant, an agency, or a third party to keep the Minister's hands clean?
  *   *Rule:* If the act is Verdict **DIRTY**, it cannot be delegated. The Minister must personally authorize and own it. Delegating a dirty-hands decision corrupts the subordinate and does not cleanse the Minister.
  *   *If Delegation is proposed for a DIRTY act:* Change Verdict to **REFUSE**.

  **Step 5: The Precedent Record**
  If this decision is recorded as a precedent, what does it authorize the next officeholder to do? Write the rule that this decision establishes.
  *   *Test:* Would you accept this rule being applied by a political opponent against your own party in five years?
  *   *If No:* The precedent is too dangerous. Verdict **REFUSE**.
  *   *If Yes:* Record the rule in the "Exception Log" (see Step 6).

  **Step 6: Discharge of Residue (For DIRTY Verdicts Only)**
  If Verdict is **AUTHORIZE (DIRTY)**, specify the discharge. Guilt cannot vanish, but it can be acknowledged.
  *   *Required Discharge:* Public acknowledgment (eventually), private penance, restitution to victims, or resignation after the crisis.
  *   *If no discharge is planned:* The guilt will rot the office. Verdict **RETURN** (force the Minister to decide on the discharge).

  **Step 7: Final Documentation**
  The recommendation must state the Verdict and the reasoning from Steps 1–6. It must be signed by the Minister, not just filed by the Chief of Staff.

  ***

  ### Where the Procedure is a Lie (Vulnerabilities)

  You asked where this is judgment dressed as procedure and where it will misfire.

  1.  **Step 1 is a Categorization Trick:** You can game this. If you define the victim as "The Public" (abstract) rather than "The specific evacuees lied to" (identifiable), you shift the moral weight. The procedure cannot stop you from redefining the victim to suit the outcome.
  2.  **Step 3 is the Escape Hatch:** Most politicians want **AUTHORIZE (COSTLY)**. They want to say "It was the right thing to do" without the stain. The procedure forces you to choose, but nothing stops you from lying about which one you mean. If you claim Justification for an act that is clearly a violation, you are not using the procedure; you are engaging in moral blindness.
  3.  **Step 5 is the Paradox:** You fear a public inquiry. Step 5 requires you to create a record that *becomes* the evidence for that inquiry. To protect the Minister from future scrutiny, you are tempted to not record the precedent. But if you don't record it, you cannot track the accumulation of dirty hands. The procedure demands transparency that the political instinct demands you suppress.
  4.  **Systematic Misfire on Collective Responsibility:** The procedure assumes a single agent (the Minister). In Cabinet, decisions are collective. If the Prime Minister or Cabinet Committee pushes this, Step 4 (Delegation/Agency) breaks. Everyone is responsible, which means no one is. The procedure will tell you the Minister must own it; reality will tell you she can hide behind "Cabinet Confidence."
  5.  **The Time Constraint:** You have two days. Deep moral auditing takes weeks. Under time pressure, Step 2 (Necessity) will always be satisfied by intelligence assessments you cannot verify. You will rubber-stamp the "No Alternative" claim because you lack the capacity to disprove it.

  ***

  ### Case Runs

  Here is the procedure applied to your three proposals. I will not smooth the edges.

  #### Case 1: Misleading Parliament on Withdrawal Timing
  *Context: Lying about when troops leave to ensure they get out safely before hostilities resume.*

  *   **Step 1 (Victim):** Parliament and the Public. This is a breach of role/norm (Ministerial accountability), not a direct physical violation of an identifiable person. However, it violates the specific rights of MPs to hold the executive to account.
  *   **Step 2 (Necessity):** Is there another way? If telling the truth jeopardizes lives immediately, necessity is met.
  *   **Step 3 (Justification vs. Excuse):** You cannot claim Justification (**COSTLY**). Lying to the legislature is not "regrettable but clean." It undermines the mechanism of democracy. This must be claimed as an **Excuse**. We did wrong to save lives.
  *   **Step 4 (Agency):** The Minister must answer the question in the House. She cannot delegate the lie to a Parliamentary Secretary.
  *   **Step 5 (Precedent):** The rule is: "Ministers may lie to Parliament when operational security overrides accountability." Would you accept an opposition Minister using this rule to hide a scandal? No.
  *   **Step 6 (Discharge):** The lie must be corrected when security allows. A delayed correction is the only discharge.

  *   **Verdict:** **AUTHORIZE (DIRTY)**.
  *   **Residue:** The Minister's credibility is permanently damaged.
  *   **Discharge:** A written ministerial statement correcting the record must be drafted *now*, dated for release when security permits. If she refuses to commit to the future correction, Verdict shifts to **RETURN**.
  *   **The Uncomfortable Truth:** You will not like this because it creates a paper trail of intent to deceive. If the inquiry happens before the correction is released, this memo is evidence of perjury-adjacent behavior. You are advising her to commit a calculable sin.

  #### Case 2: Immunity Deal with Militia Commander
  *Context: Granting legal immunity to a warlord to stop a massacre.*

  *   **Step 1 (Victim):** Identifiable persons. The victims of the militia's past crimes and potential future crimes. Their right to justice is being traded.
  *   **Step 2 (Necessity):** If the ceasefire is the *only* way to stop the massacre, necessity is met. If it just makes things "easier," it fails.
  *   **Step 3 (Justification vs. Excuse):** You cannot claim Justification (**COSTLY**). Justice is not a resource to be spent; it is a duty. Trading justice for peace is a moral violation, even if necessary. This is an **Excuse**.
  *   **Step 4 (Agency):** The Minister of Justice or Attorney General must also sign. If they refuse, the Minister cannot unilaterally override them without breaking the rule of law. If she overrides them, she dirties her hands *and* theirs.
  *   **Step 5 (Precedent):** The rule is: "The State may bargain with perpetrators against victims to secure order." This destroys the state's claim to moral superiority over the militia.
  *   **Step 6 (Discharge):** Restitution is impossible (you can't prosecute him). The discharge must be public acknowledgment that justice was sacrificed, and a commitment to document the crimes for history if not for court.

  *   **Verdict:** **AUTHORIZE (DIRTY)**.
  *   **Residue:** High. The state becomes complicit in the impunity.
  *   **Discharge:** The deal must be acknowledged as a temporary measure, not a permanent amnesty, if legally possible. If it is permanent, the Minister should consider Step 6 to include eventual resignation, as she has violated the core function of the state (justice).
  *   **The Uncomfortable Truth:** You will hate this verdict because it offers no clean exit. It tells you that saving lives here costs the legitimacy of the law there. If you authorize this, you are advising the Minister to become a party to the injustice she is supposed to prevent.

  #### Case 3: Closing Hospital Against Clinical Advice
  *Context: Shutting one facility to keep two others open during a resource crisis.*

  *   **Step 1 (Victim):** Identifiable persons. The patients at the closed hospital who face reduced care or travel burden.
  *   **Step 2 (Necessity):** Clinicians advise against it. This suggests medical necessity says "keep open." Political/Financial necessity says "close." This is not a "No Alternative" scenario; it is a "Different Priority" scenario. The procedure flags this heavily.
  *   **Step 3 (Justification vs. Excuse):** If this is pure triage (saving more lives total), it claims Justification (**COSTLY**). If this is to save budget or political capital, it is **DIRTY**. Assuming the goal is keeping two others open to save *more* lives:
  *   **Step 4 (Agency):** This is operational. Can be delegated to Health Officials *unless* it violates established triage protocol. If it violates protocol, Minister must own it.
  *   **Step 5 (Precedent):** The rule is: "Political leadership overrides clinical judgment on resource allocation."
  *   **Step 6 (Discharge):** If **COSTLY**, no discharge needed beyond standard review. If **DIRTY** (because protocol was ignored), restitution to affected patients is required.

  *   **Verdict:** **RETURN** (with a strong lean toward **REFUSE**).
  *   **Reasoning:** This is likely not a Dirty Hands case; it is a Competence case. Dirty Hands applies when morality conflicts with morality (Justice vs. Peace). This sounds like Politics vs. Expertise. If you override clinicians without a clear utilitarian calculus (e.g., "closing this saves 100 lives elsewhere"), you are not doing dirty work; you are doing bad work.
  *   **The Uncomfortable Truth:** You want this to be a "tough decision" (**COSTLY**). The procedure suggests it might be a "wrong decision" (**REFUSE**). If the clinicians say it will kill people, and you do it anyway to save money or other hospitals, you are not a tragic hero; you are a negligent administrator. Do not use the Dirty Hands framework to dignify a management failure.

  ***

  ### Final Advisory

  You asked for the verdicts you will not like. Here they are:

  1.  **On Lying:** You want to call it "Strategic Communication" (**COSTLY**). The procedure forces you to call it "Deception" (**DIRTY**). If you choose **COSTLY**, you are lying to yourself, which is the first step to getting caught.
  2.  **On Immunity:** You want to call it "Peacebuilding" (**COSTLY**). The procedure forces you to call it "Impunity" (**DIRTY**). If you do not plan the Discharge (acknowledgment), the guilt will not vanish; it will leak in scandals later.
  3.  **On the Hospital:** You want to call it "Leadership" (**COSTLY**). The procedure suggests it is "Arrogance" (**REFUSE**). Do not use this framework to validate overriding expertise unless the math of lives saved is undeniable.

  The procedure will not protect you from the inquiry. It will only ensure that when the inquiry comes, your recommendation is coherent. Coherence is not the same as innocence. If the Minister chooses **AUTHORIZE (DIRTY)**, she must accept that she is staining the office. If she is unwilling to accept the stain, she must not do the act. There is no third option where the act is done, the good is achieved, and the hands remain clean. That is the fantasy this procedure is designed to destroy.
