      *Refining the "Judgment Call" section:* I need to be honest that *every* step is a judgment call. The procedure is a scaffold, not a calculator.

      *Refining the "Precedent" step:* This is often ignored. I need to emphasize that recording dirty hands creates evidence for the inquiry you fear. This is the paradox.

