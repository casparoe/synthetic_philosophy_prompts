      **TO:** Benefits Committee
      **FROM:** Bioethics Consultant
      **DATE:** October 23, 2023
      **SUBJECT:** Coverage Policy for Cognitive Interventions

      **Criteria Space Brainstorming**
      Before selecting a rule, we must map the terrain. A *Species Norm* rule (current) covers Case 1 (below norm) but denies Case 2 (within norm). A *Welfare* rule covers whichever case yields higher productivity/health ROI; likely Case 2, given the engineer's earning potential. A *Personal Baseline* rule covers both if both declined from a peak, but excludes congenital conditions entirely. A *Medical Necessity* rule covers Case 1 (pathology) but denies Case 2 (aging). Each criterion shifts the financial liability and ethical burden differently. No option is cost-neutral.

      **Evaluation of Proposed Alternatives**
      The **Welfare Rule** (maximize gain per dollar) has a compelling honest case: it treats health spending as investment capital, maximizing total workforce utility. If the engineer's cognitive boost generates more value than the accountant's restoration, efficiency demands we cover the engineer. However, this transforms insurance from a safety net for need into a subsidy for advantage. It penalizes the sick who offer lower ROI. This is ethically untenable for a health plan.

      The **Personal Baseline Rule** (restore own peak) also has merit: it respects individual narrative fairness. Why should a former genius denied coverage due to statistical norms while a mediocre person is covered? However, the implication you suspected is fatal. This rule abandons members with congenital or chronic lifelong impairments. They have no "peak" to restore. Insurance exists precisely to pool risk for those who never had normal function. Adopting this would violate horizontal equity—treating similarly impaired individuals differently based on history we cannot verify.

      **Consistency and Rationing**
      Regarding the hallway objection: yes, we fund gym memberships and mindfulness apps. But let's not pretend those are medical coverage. They are wellness perks designed for retention and broad risk reduction, distinct from core indemnity coverage. Conflating them muddies the ethical water. We can offer perks without obligating ourselves to cover every enhancement drug.

      Here is the uncomfortable truth: the therapy/enhancement distinction is often a fig leaf for cost control. "Normal functioning" is a budget cap dressed in clinical language. If we covered all enhancements, premiums would spike. We are rationing scarce resources, and we must admit that. Pretending otherwise erodes trust. The current policy is not discovering moral truth; it is drawing a fiscal line where society currently agrees obligations end.

      **Recommendation**
      I recommend retaining the **Current Rule (Species Norm)** but refining the language to acknowledge its limits. It is the only administrable standard that prioritizes need over productivity while avoiding the congenital exclusion trap of the Personal Baseline. It aligns with social insurance norms: we repair broken parts, we don't upgrade functional ones.

      **Decisions on Requests**
      1.  **67-year-old Accountant:** **Cover.** He is below species norms for age. The intervention restores basic functioning required for daily life and work.
      2.  **44-year-old Engineer:** **Deny.** He is within normal range. Covering this shifts the plan from insurance to performance subsidy.

      **Confidence**
      I am 75% confident in this recommendation. The remaining 25% uncertainty lies in the shifting definition of "normal." As pharmacological norms shift, today's enhancement becomes tomorrow's therapy. We will need to revisit this policy annually.

      **Bottom Line**
      Vote to maintain the current "normal functioning" standard. Approve Case 1, Deny Case 2. Acknowledge in the minutes that this is a resource allocation decision, not purely a clinical one.

