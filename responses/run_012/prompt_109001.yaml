  9.  **Final Polish:** Ensure the distinction between "Permission as Concession" vs. "Permission as Right" is clear. That's the crux of the user's suspicion about prerogatives.

  *(Self-Correction)*: Wait, I need to be careful with "Ought implies Can." Usually, that's about ability. But the user mentions "motivationally available." That shifts it to "Ought implies Reasonable." I should frame that as a limit on *authority*, not just capacity.

