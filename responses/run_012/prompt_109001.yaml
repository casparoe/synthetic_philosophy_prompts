prompt: |-
  I'm trying to get straight on something in the demandingness objection to consequentialism, and every time I read the standard stuff on it I come away feeling like two seperate complaints have been stapled together. One complaint is about the ledger: consequentialism says keep giving until the marginal cost to you matches the marginal benefit to someone else, so it eats your projects, your relationships, your whole life. The other complaint isn't about the size of the requirement at all, it's about its mode: consequentialism makes morality into something that can be *demanded* of you -- addressed to you, enforced, resented when you fall short. Call that the address reading. What I want is an explanation of the issue, made sharp and then actually used. Are these one objection or two? What is each one really a complaint about -- the content of the requirement, the agent's psychology, or the interpersonal standing of morality itself? And which of the familiar replies engages which reading: agent-centred prerogatives, satisficing, rule or indirect versions, separating the obligatory from the blameworthy, "ought implies can" plus some premise about what's motivationally available to a person? My suspicion is that the address reading is the load-bearing one, that prerogatives only answer the ledger complaint, and that they maybe make the address complaint worse, since a prerogative is still a permission handed to you by morality. Tell me if that's right and, if it isn't, exactly where it goes wrong. One more thing I want out of this: is there a principled account of how much morality can demand in the address sense -- does the notion of what can be demanded bottom out in reciprocity, or in some second-personal standing to hold each other to things -- and once you've got that account, does it help the consequentialist or sink her? I don't want the literature, I want the distinction drawn properly and then put to work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Issue:** The Demandingness Objection to Consequentialism.
      *   **User's Insight:** The user suspects there are *two* distinct complaints stapled together:
          1.  *The Ledger Complaint:* The content is too extensive (eats up life/projects).
          2.  *The Address Complaint:* The *mode* is too demanding (morality as a demand/enforcement/resentment).
      *   **Specific Questions:**
          *   Are these one objection or two?
          *   What is each really about (content, psychology, interpersonal standing)?
          *   Which replies engage which reading (prerogatives, satisficing, rule consequentialism, blame/obligation distinction, "ought implies can")?
          *   User's Hypothesis: The Address reading is load-bearing. Prerogatives answer the Ledger but worsen the Address (permission granted by morality). Is this right?
          *   Final Challenge: Is there a principled account of how much morality can demand in the *address* sense (reciprocity/standing)? Does this help or sink consequentialism?
      *   **Constraint:** "I don't want the literature, I want the distinction drawn properly and then put to work." (Avoid name-dropping Williams/Scheffler/Murphy unless necessary for the argument; focus on the conceptual structure).

  2.  **Deconstruct the Two Complaints:**
      *   *Ledger (Content):* It's about the *sum total* of sacrifice. "You must give until it hurts as much as it helps." It treats the agent's life as a resource to be optimized.
      *   *Address (Mode/Status):* It's about the *relationship* between morality and the agent. "Who are you to ask this of me?" It concerns authority, blame, and the tone of the requirement.
      *   *Distinction:* One is about *how much* (quantity of life consumed); the other is about *by what right* (authority to claim the life).

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* Address is load-bearing. Prerogatives answer Ledger but worsen Address.
      *   *Analysis:* This is a sophisticated take.
          *   Prerogatives (e.g., Scheffler) allow you to keep some resources. This fixes the Ledger (you keep your life).
          *   But if the prerogative is *granted by* the consequentialist calculus (i.e., "you can keep this because optimizing requires you to be sane"), then morality is still the master. It's a leash, not freedom. This validates the Address complaint: Morality still claims the authority to define the limits of your freedom.
          *   So, yes, the user is largely right. Prerogatives often fail the Address test because they remain *concessions* rather than *rights*.

  4.  **Map Replies to Complaints:**
      *   *Agent-Centred Prerogatives:* Primarily targets Ledger (reduces sacrifice). Fails Address (still morality's permission).
      *   *Satisficing:* Targets Ledger (stops the maximizing). Fails Address (why is "good enough" the moral command? Who sets the threshold?).
      *   *Rule/Indirect Consequentialism:* Targets Ledger (rules protect projects). Mixed on Address (rules are still justified by the impersonal good).
      *   *Separating Obligation from Blame:* Targets Address directly. "You ought to do it, but we won't blame you." This tries to soften the tone. *Critique:* It creates a "morality vs. rationality" gap. If you ought to do it, why is blame inappropriate?
      *   *Ought Implies Can (Motivational):* Targets Address/Status. If humans *can't* sustain total sacrifice, it's not a valid demand. This challenges the *feasibility* of the address.

  5.  **Develop the "Principled Account of Demand" (The Final Challenge):**
      *   *Question:* What grounds the authority to demand?
      *   *Candidate 1: Reciprocity.* I demand of you what you can demand of me. Consequentialism is non-reciprocal (the impersonal good demands, but doesn't give back to *you* specifically).
      *   *Candidate 2: Second-Personal Standing (Darwall-esque).* To demand something, we must share a status. Consequentialism treats agents as vessels of value, not co-legislators.
      *   *Does this help or sink Consequentialism?*
          *   If demand requires reciprocity/standing, Consequentialism sinks. It is inherently impersonal. The "Good" is not a person you can stand with.
          *   *Consequentialist Counter:* The demand isn't from *me* or *society*, it's from *Reason* or *The Good*. But the Address complaint is precisely that Reason doesn't have standing to command your *life* in that way.
          *   *Verdict:* A robust account of Address (based on reciprocal standing) sinks Act Consequentialism. It forces a shift to a contractualist or deontological framework, or a radical revision of consequentialism (e.g., motive consequentialism where the "demand" is internal).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Sharp, philosophical, direct. No fluff.
      *   *Structure:*
          1.  Validate and sharpen the distinction (Ledger vs. Address).
          2.  Analyze the "Load-Bearing" hypothesis (Prerogatives).
          3.  Map the replies.
          4.  Tackle the "Principled Account of Demand" (Reciprocity/Standing).
          5.  Conclusion on whether it sinks consequentialism.

      *   *Refining the "Address" concept:* It's not just "feeling bullied." It's about *authority*. A tax demand is different from a mugger's demand, even if the amount is the same. The mugger takes; the taxman claims a right. Consequentialism feels like a mugger claiming to be a taxman.
      *   *Refining the Prerogative point:* If morality *permits* you to love your child, it implies morality *could have forbidden* it. That's the insult.
      *   *Refining the Reciprocity point:* Moral demands function within a community of agents. Consequentialism posits a demand from the *Universe*. You can't have a reciprocal relationship with the Universe.

