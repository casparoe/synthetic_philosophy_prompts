answer: |-
  You have correctly identified a fracture in the standard discussion. The "Demandingness Objection" is typically treated as a monolith, but it is indeed two distinct complaints that rely on different normative machinery. Conflating them leads to replies that solve one problem while exacerbating the other.

  Here is the distinction drawn sharply, an evaluation of your hypothesis regarding prerogatives, and a principled account of the "address" that tests the viability of consequentialism.

  ### 1. The Distinction: Ledger vs. Address

  **The Ledger Complaint (Content/Quantity)**
  *   **The Issue:** The *extent* of the sacrifice.
  *   **The Structure:** Consequentialism treats the agent's life as a resource pool to be optimized. The requirement is to transfer resources (time, money, emotional energy) from the agent to the general good until the marginal utility of keeping a resource equals the marginal utility of giving it.
  *   **The Grievance:** "This leaves me with nothing." It is a complaint about the *outcome* of the moral calculus. It claims the theory consumes the very projects and relationships that make a life worth living.
  *   **Category:** First-order substantive complaint.

  **The Address Complaint (Mode/Authority)**
  *   **The Issue:** The *standing* of the requirement.
  *   **The Structure:** Morality is not just a set of outcomes; it is a system of claims made *upon* an agent. To demand something is to claim authority over the agent's will. The Address complaint asks: *By what right does morality claim this authority?*
  *   **The Grievance:** "Who are you to ask this of me?" It is a complaint about the *relationship* between the agent and the moral law. Even if the sacrifice were small, the *tone* of consequentialism is that of a master claiming ownership of a servant. The agent is treated as a vessel for value rather than a source of claims.
  *   **Category:** Second-order structural complaint (about the nature of moral obligation itself).

  **Verdict:** These are two objections. You can have a theory that is undemanding in the Ledger sense (requires little sacrifice) but offensive in the Address sense (claims total authority over the little it requires). Conversely, you could have a theory that is demanding in the Ledger sense but justified in the Address sense (e.g., a mutual defense pact in wartime).

  ### 2. Evaluating Your Hypothesis: Prerogatives and the Address

  Your suspicion is correct: **The Address complaint is the load-bearing one, and agent-centred prerogatives often worsen it.**

  **Why Prerogatives Fix the Ledger:**
  An agent-centred prerogative allows you to assign non-instrumental weight to your own projects. You don't have to give until you drop; you can keep enough to maintain your integrity. The Ledger balances; you keep your life.

  **Why Prerogatives Worsen the Address:**
  A prerogative in consequentialism is a **concession**, not a **right**.
  *   **Right:** "This area of my life is outside morality's jurisdiction. Morality has no say here."
  *   **Concession:** "Morality claims total jurisdiction, but calculates that allowing you this freedom produces better overall results."

  If your permission to love your child is granted *because* a burnt-out parent is less useful to the universe, then morality still claims ownership of the child. It is merely leasing the child back to you for efficiency's sake. This intensifies the Address complaint. It confirms that the agent has no independent standing. The "demand" is total; the "permission" is just a pause in the demand. The agent remains a servant, merely a well-treated one.

  ### 3. Mapping the Replies

  Here is how standard replies engage the two complaints, and where they fail.

  | Reply | Targets Ledger? | Targets Address? | The Failure Point |
  | :--- | :--- | :--- | :--- |
  | **Agent-Centred Prerogatives** | **Yes.** Reduces the sacrifice required. | **No.** (Often worsens it). | Treats freedom as a tool of optimization, confirming morality's total authority. |
  | **Satisficing Consequentialism** | **Yes.** Stops the maximization requirement. | **No.** | Arbitrarily sets a threshold. Who sets the "good enough" mark? If morality sets it, it still claims the authority to define your limits. |
  | **Rule / Indirect Consequentialism** | **Yes.** Rules protect projects instrumentally. | **Mixed.** | Rules feel like rights, but their justification remains impersonal. If the rule breaks, the impersonal demand returns. |
  | **Obligation vs. Blame** | **No.** (You still *ought* to do it). | **Yes.** (Softens the tone). | Creates a gap between "what I should do" and "what I can be held to." If I ought to do it, why is resentment inappropriate? It makes morality look like a recommendation, not a demand. |
  | **"Ought Implies Can" (Motivational)** | **Yes.** (Humans can't sustain total sacrifice). | **Yes.** (Limits authority). | **Strongest candidate.** If human psychology makes total sacrifice impossible, the demand is not just hard, it is *null*. But this relies on empirical limits, not normative standing. |

  ### 4. The Principled Account of Demand (Reciprocity and Standing)

  You asked for a principled account of how much morality can demand in the *address* sense. The most robust account grounds demand in **Reciprocal Second-Personal Standing.**

  **The Account:**
  A moral demand is legitimate only if it arises from a relationship of reciprocal accountability between agents.
  1.  **Standing:** I can only demand of you what you can demand of me. We must share the status of co-legislators.
  2.  **Reciprocity:** The demand must serve a shared framework of interests. I submit to your claim because you submit to mine, under a general rule we both accept.
  3.  **Limit:** Morality cannot demand what undermines the agency required to participate in the moral community.

  **Does this Help or Sink Consequentialism?**
  It **sinks** standard Act Consequentialism.

  **Why:**
  Consequentialism is inherently **non-reciprocal**.
  *   **The Source of Demand:** In consequentialism, the demand does not come from *other agents* (who can reciprocate); it comes from *The Good* (an impersonal state of affairs). The Universe does not have standing. It cannot make claims, and it cannot respect yours.
  *   **The Direction of Sacrifice:** Consequentialism often demands I sacrifice my interests for strangers who can offer me nothing in return (e.g., distant future generations, people who cannot reciprocate). Under a reciprocity account, this is not a *moral demand*; it is supererogatory charity. To make it obligatory is to treat the agent as a means to the Good, violating the requirement of reciprocal standing.
  *   **The Prerogative Problem Revisited:** On the reciprocity account, I don't need a "prerogative" granted by the Good. I have a **jurisdiction**. My projects are mine because I am an agent. Morality is the boundary between my jurisdiction and yours. Consequentialism denies jurisdiction exists; there is only one global jurisdiction (The Good).

  **The Consequentialist Counter-Move (and why it fails):**
  The consequentialist might argue: "Reciprocity is just a rule that produces good outcomes. We should adopt reciprocal standing because it maximizes utility."
  *   **The Trap:** This reduces reciprocity to a Ledger calculation. It admits that if breaking reciprocity produced more good, we should do it. This confirms the Address complaint: your standing is contingent on utility, not inherent. You are not a co-legislator; you are a variable in an equation.

  ### 5. Conclusion: The Load-Bearing Wall

  You are right. The Ledger complaint is a negotiation; the Address complaint is a veto.

  *   **Ledger:** "This is too expensive."
      *   *Solution:* Discount the price (prerogatives, satisficing).
  *   **Address:** "You cannot charge me."
      *   *Solution:* None available to consequentialism without ceasing to be consequentialism.

  If the authority of morality rests on reciprocal standing among agents, consequentialism is illegitimate because it derives authority from an impersonal standard. If the authority of morality rests on the rational requirement to promote the Good, then the Address complaint stands: rationality does not have the standing to command the *whole* of a life without reducing the agent to a conduit.

  **The Verdict:**
  Prerogatives solve the Ledger but admit the Address guilt (by framing freedom as a concession). The only way to solve the Address complaint is to ground morality in **mutual accountability** rather than **impersonal optimization**. But doing so abandons the core consequentialist thesis that the *only* thing that matters is the state of the world.

  Therefore, a principled account of moral demand based on reciprocity and standing does not help the consequentialist; it reveals that the demandingness objection is not a bug to be fixed, but a feature of a theory that misunderstands the nature of moral authority. The theory isn't too demanding; it's demanding the wrong thing, in the wrong way, from the wrong source.
