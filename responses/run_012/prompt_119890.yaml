answer: |-
  ### Exam Question

  **Course:** PHI 450: Epistemology of Disagreement
  **Time:** 90 Minutes
  **Format:** Closed Book, Essay

  **Prompt:**

  Consider two agents, **A** and **B**. They are colleagues investigating a specific question, **Q**. We stipulate the following conditions:
  1.  **First-Order Peerhood:** A and B share all first-order evidence regarding Q and are equally reliable at reasoning from that evidence to a conclusion about Q.
  2.  **Second-Order Peerhood:** A and B are also equally reliable at reasoning about epistemic norms. They know they are peers in this respect.
  3.  **The Disagreement:** A believes Q is true. B believes Q is false.
  4.  **The Normative Disagreement:** A holds a *Conciliationist* norm (when peers disagree, one must significantly revise one's credence toward the other). B holds a *Steadfast* norm (when peers disagree, one may maintain one's credence if one assesses one's own reasoning as correct).

  A is aware of B's disagreement regarding both Q and the normative principle itself.

  **Write an essay addressing the following:**
  According to A's own normative principle, how should A respond to the disagreement about Q? Does the fact that A and B also disagree about the normative principle itself generate a self-undermining regress for A? Specifically, evaluate whether there is a non-question-begging way for A to apply her norm to Q without simultaneously abandoning that norm due to B's disagreement. If the view is self-undermining in this scenario, explain why. If it is not, identify the precise asymmetry or structural feature that blocks the regress.

  *Note: Do not simply define Conciliationism and Steadfastness. Assume the reader knows these positions. Focus entirely on the structural tension described above.*

  ***

  ### Model Answer

  **[Meta-Note on Framing]**
  *This answer proceeds on the assumption that the scenario above constitutes a fair and stable representation of the structural tension between conciliationist norms and higher-order disagreement. While some might argue that "peerhood" regarding normative principles is incoherent (since norms govern how we assess peers), I will treat the stipulation as valid for the sake of the argument. The point of least certainty in this analysis is whether "independent access" to the correct norm can truly break the symmetry without begging the question.*

  **Essay**

  The scenario presents a classic self-undermining objection to Conciliationism. If Agent A is a consistent Conciliationist, she faces a dilemma: either she applies her norm to the object-level belief (Q) or she applies it to the normative belief (the norm itself). If she applies it to both, she appears to lose the justification for her initial move. If she applies it only to Q, she appears to be making an arbitrary exception for her own normative framework. To determine whether A's position collapses, we must analyze the relationship between first-order evidence and higher-order evidence in this specific configuration.

  The immediate intuition is that A should conciliate regarding Q. Since A and B are first-order peers, A's discovery of B's disagreement constitutes higher-order evidence that A might have made a reasoning error. According to A's own norm, this requires splitting the difference. However, B disagrees with A about whether this requirement exists. B believes that recognizing peer disagreement does not mandate revision if one trusts one's own reasoning. Since A and B are stipulated to be *second-order peers* (equally reliable at reasoning about norms), B's disagreement about the norm constitutes higher-order evidence regarding the norm itself.

  If A is consistent, she must conciliate regarding the norm. She should lower her confidence in Conciliationism and raise her confidence in Steadfastness. But here lies the regress. As A's confidence in Conciliationism drops, her obligation to conciliate regarding Q also drops. If she conciliates fully on the norm, she becomes a Steadfaster, in which case she is permitted to stay put on Q. Thus, the view seems to "eat itself": the application of the norm destroys the justification for the norm.

  To escape this, A must argue for an asymmetry between the disagreement on Q and the disagreement on the norm. There are two primary routes for this defense. The first is the "Right Reason" or "Independent Access" strategy. A could argue that while she and B are peers on Q, she has a privileged epistemic position regarding the norm because she has correctly reasoned to it. To simply treat B's dissent on the norm as equal weight evidence would be to ignore the very reasoning that established the norm. However, this risks question-begging. B claims the same privilege regarding her Steadfast norm. If A claims independent access to the truth of Conciliationism to block the regress, she is effectively acting like a Steadfaster about the norm while remaining a Conciliationist about Q. This looks like an unstable hybrid view unless A can explain why normative truths are accessible in a way that Q is not.

  The second route is to distinguish between the *truth* of the norm and the *application* of the norm. A might argue that the Conciliationist norm is true, but that its application requires knowing who the peers are. In this scenario, A might claim that once she recognizes B disagrees on the norm, B is no longer a peer on Q, because a peer must share the correct normative framework. This blocks the regress by dissolving the peerhood stipulation. However, the prompt stipulates they *are* peers. If we hold the stipulation fixed, A cannot dissolve peerhood to save the norm.

  Therefore, the most robust defense for A is to accept that she must conciliate on the norm, but argue that this does not fully neutralize her obligation on Q. Even if A reduces her confidence in Conciliationism from 100% to 60% due to B's disagreement, she still holds that Conciliationism is more likely true than Steadfastness. Consequently, she still has a pro-tanto obligation to move toward B on Q, even if that obligation is weaker than it would be if she were certain of the norm. This avoids total self-undermining. The view does not collapse; it merely weakens. A moves toward B on the norm, which reduces the pressure to move toward B on Q, but does not eliminate it entirely.

  However, this solution relies on the assumption that A can maintain that her reasoning on the norm was *slightly* better than B's, even while acknowledging peerhood. If they are truly equal in reliability, A has no grounds to weight her own assessment of the norm higher than B's. If she weights them equally, she must land on 50/50 regarding the norm. At 50/50, she has no normative guidance on Q. She is left in a state of epistemic paralysis.

  This suggests the scenario reveals a genuine vulnerability. A consistent Conciliationist cannot treat normative disagreements exactly like object-level disagreements without risking paralysis. The only way out is to claim that the evidence for the norm (perhaps its explanatory power or coherence) is distinct from the testimony of a peer. A must argue that the "evidence" for Conciliationism is not just her intuition, but a philosophical argument that B has failed to grasp. If B fails to grasp the argument, B is not a peer on the norm, despite the stipulation. Since we must respect the stipulation, A is forced to admit that her view loses force in the face of normative disagreement.

  In conclusion, the view is not strictly self-undermining in the sense of producing a contradiction, but it is self-weakening. A must conciliate on the norm, which diminishes her reason to conciliate on Q. The only way to avoid this diminution is to break the symmetry on the normative level, claiming that one's grasp of the correct norm is not subject to the same conciliation requirements as empirical beliefs. Without this distinction, the Conciliationist is forced to admit that in a world of normative disagreement, their normative force evaporates.

  **[Uncertainty Flag]**
  *The weakest link in this analysis is the claim that A can conciliate on the norm while retaining enough confidence to act on it. If peerhood implies equal weight, the 50/50 split on the norm seems inevitable, leading to the paralysis mentioned. It is unclear if a "pro-tanto" obligation survives that split.*

  ***

  ### Marking Scheme

  **Total Points:** 100
  **Passing Threshold:** 60 (C-)

  #### **A Range (80–100 points): Structural Analysis & Resolution**
  To earn an A, the essay must move beyond defining the positions and grapple with the *interaction* between the two levels of disagreement.
  *   **Identification of the Regress:** The student explicitly identifies that applying the norm to the norm itself undermines the justification for applying the norm to Q. (25 pts)
  *   **Non-Question-Begging Defense:** The student attempts to find a way out that doesn't simply assert "A is right." They explore asymmetries (e.g., independent access to norms vs. evidence on Q) or the distinction between the truth of the norm and its application. (25 pts)
  *   **Handling the Stipulations:** The student respects the "peerhood" stipulation. They do not solve the problem by simply saying "A knows B is wrong." They acknowledge that if they are truly peers, the symmetry is hard to break. (15 pts)
  *   **Nuanced Conclusion:** The conclusion acknowledges the cost of the solution (e.g., the view is "self-weakening" rather than "self-undermining," or requires a specific distinction between normative and empirical evidence). (15 pts)
  *   **Clarity & Structure:** Argument flows logically; no wasted space on definitions. (20 pts)

  #### **B Range (60–79 points): Recognition without Resolution**
  A B essay identifies the problem but fails to navigate the escape route successfully.
  *   **Identifies the Tension:** The student notes that A has to conciliate on both Q and the Norm. (25 pts)
  *   **Partial Solution:** The student suggests a way out (e.g., "A trusts her reasoning") but fails to explain why this doesn't beg the question against B. They treat the norm as fixed rather than as a belief subject to the same disagreement. (25 pts)
  *   **Respects Stipulations:** Generally follows the case setup, though may waver on the second-order peerhood condition. (10 pts)
  *   **Conclusion:** Concludes that A should conciliate on Q, but glosses over the impact of the normative disagreement. (10 pts)
  *   **Clarity:** Readable, but may spend too much time defining Conciliationism/Steadfastness in the intro. (10 pts)

  #### **C Range (50–59 points): Recitation**
  *   **Summary Heavy:** The first half of the essay defines Conciliationism and Steadfastness without applying them to the specific A/B case.
  *   **Misses the Second-Order:** The student treats the disagreement only about Q. They ignore the disagreement about the *norm*.
  *   **Standard Response:** Argues "A should meet in the middle" without addressing why B's disagreement on the *rule* matters.

  #### **D/F Range (0–49 points): Fundamental Errors**
  *   **Ignores the Prompt:** Writes about van Inwagen or Elga generally without addressing the specific A/B scenario.
  *   **Misunderstands Peerhood:** Claims A should just defer to B, or that A should ignore B because "she knows she's right."
  *   **Incoherent:** Fails to distinguish between the belief in Q and the belief in the Norm.

  #### **Specific Penalties & "Trap" Answers**
  *   **The "Trust Yourself" Trap:** If the student argues "A should just trust her own reasoning about the norm and conciliate on Q," deduct 15 points unless they explicitly justify *why* the norm is exempt from the conciliation requirement. This is the exact question-begging move the prompt warns against.
  *   **Name-Dropping:** Do not award bonus points for mentioning Elga, Kelly, Christensen, etc. Award points only for the *arguments* associated with those names (e.g., "total evidence view" vs. "equal weight view"). Incorrect attribution should not be penalized if the argument is sound, but correct attribution should not be rewarded if the argument is weak.
  *   **Word Count:** Significant deviation (under 800 or over 1500) may indicate poor time management; adjust within the "Clarity" category.

  #### **Differentiation Note (A vs. B)**
  The key differentiator is the treatment of the **Normative Disagreement**.
  *   **B Answer:** Treats the norm as a fixed lens through which A views B. (A uses the norm to judge B's belief on Q).
  *   **A Answer:** Treats the norm as a belief held by A that is *also* subject to B's judgment. (A uses the norm to judge B's belief on the Norm).
  *   *To get an A, the student must realize the norm is inside the scope of the disagreement, not just outside it.*
