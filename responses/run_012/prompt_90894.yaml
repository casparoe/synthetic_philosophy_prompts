  I volunteer at a hospital and I keep noticing a move I don't have a word for. A resident told a patient's son, truthfully, that the scan results were in the file, then answered only the questions that kept him from opening the file, and the son walked out thinking his mother was fine. Not one false sentence. Meanwhile a nurse flat-out told a dying woman her brother's flight had landed while he was still in the air, and I'd bet most people would call that a lie, kind as it was. Then there's my uncle, who says false things constantly and I'd never call him a liar, becuase he believes every word he says; and a friend who tells obvious whoppers at parties that nobody falls for.

  So being false doesn't seem to be what makes a lie, and being true doesn't seem to prevent one. Is there a name for the thing I'm circling — the true statement used to produce a false belief, and its relatives? I know Augustine was famously hard-line about lying; would he have called the resident's move a lie, or only the nurse's? And where does someone land who says nothing false at all but stages a scene or plants a document so you draw the false conclusion on your own — does that count, and by what criterion? Don't send me a reading list. I want the actual distinction being tracked, the nearest established terms and how each of them differs, and where each one runs out. If nothing fits exactly, coin something and tell me what it leaves out and where its edges are.
