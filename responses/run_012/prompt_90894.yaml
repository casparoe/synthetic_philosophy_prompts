answer: |-
  Let's walk through this slowly. You have identified the exact friction point that keeps philosophers of language and moral theologians up at night. You are right: truth-value (is the sentence false?) is not the same thing as lying (is the speaker a liar?).

  To get to the term you want, we have to sort your five cases into the three variables that actually matter in the philosophy of lying: **Belief**, **Assertion**, and **Intent**.

  ### Phase 1: Sorting the Cases

  Let's look at your examples through the "Standard View" (the dominant definition in contemporary analytic philosophy, championed by people like Thomas Carson or J.E. Mahon).

  **1. The Uncle (False Statement + Sincere Belief)**
  *   **Verdict:** Not a lie.
  *   **Why:** He lacks the *intent to deceive*. He also lacks the *knowledge of falsity*.
  *   **Term:** This is simply **Error** or **Mistake**. In Augustine's framework, this is not a sin of the tongue because the heart is not out of alignment with the speech. He believes what he says.

  **2. The Friend (False Statement + No Intent to Deceive)**
  *   **Verdict:** Not a lie.
  *   **Why:** The audience knows it's false (common ground). There is no attempt to induce a false belief.
  *   **Term:** This is **Jesting** or **Fiction**. Harry Frankfurt would distinguish this from "Bullshitting." A bullshitter doesn't care if what they say is true or false; a joker cares that you *know* it isn't true.

  **3. The Nurse (False Statement + Intent to Deceive)**
  *   **Verdict:** A Lie.
  *   **Why:** She asserts $p$, she believes $\neg p$, and she intends you to believe $p$.
  *   **Augustine's Take:** Augustine calls this an **Officious Lie** (*mendacium officiosum*). It is told for a good end (comfort), but it is still a lie. For Augustine, the goodness of the motive does not cleanse the falsity of the signification. It is a venial sin, but a lie nonetheless.

  **4. The Resident (True Statement + Intent to Deceive)**
  *   **Verdict:** This is your core puzzle.
  *   **Why:** The resident asserted truth ("results are in the file"), but relied on *implicature* to make the son infer falsehood ("mom is fine").
  *   **Analytic Term:** **Merely Misleading**. In strict analytic philosophy, a lie requires a *false assertion*. If the words are true, but the implication is false, you are *deceiving*, but not *lying*.
  *   **Augustine's Take:** Augustine would likely call this a **Lie**. He argues that if the intention is to deceive, the speaker lies in their heart, even if the words are technically true. He specifically attacks the idea that one can "speak truth to deceive." For him, the moral act is the *will to deceive*, not the grammar of the sentence.

  **5. The Stager (No Statement + Intent to Deceive)**
  *   **Verdict:** Deception, but not verbal lying.
  *   **Why:** Planting a document or staging a scene is an action, not an assertion.
  *   **Term:** **Deceptive Non-Assertion**.

  ### Phase 2: The Distinction Being Tracked

  You are circling the gap between **Lying** and **Deceiving**.

  *   **Lying** is a subset of **Deceiving**.
  *   All lies are attempts to deceive, but not all deception is lying.

  The specific move the Resident made—using true statements to cultivate a false belief—has a name in behavioral ethics and negotiation theory, though it is less common in pure metaphysics. It is called **Paltering**.

  **Paltering** is the active use of truthful statements to create a false impression.
  *   *Edge:* It requires active engagement. You can't just be silent (that's *omission*). The Resident had to speak ("results are in the file") to guide the son away from opening it.
  *   *Limit:* Paltering doesn't cover the Stager (planting evidence). That is non-verbal.

  However, "Paltering" feels too colloquial for the weight you're describing. In the philosophical literature, the distinction is usually drawn between **False Assertion** (Lying) and **True Assertion with Misleading Implicature** (Merely Misleading).

  ### Phase 3: The Augustine Problem

  Here is where it gets messy, and where your intuition might be fighting the technical definitions.

  If you ask a contemporary analytic philosopher, "Did the Resident lie?" they will say: **No.** They will say the Resident *deceived* the son, but did not *lie*. They hold this distinction because they want to preserve the definition of lying as something specific to language and truth-conditions.

  If you ask Augustine, "Did the Resident lie?" he will say: **Yes.**
  Augustine defines a lie not by the correspondence of the statement to the world, but by the correspondence of the statement to the *mind of the speaker*.
  *   If I say what I believe is false, I lie.
  *   If I say what I believe is true, *but I intend for you to believe what I know is false*, Augustine argues I am still lying because I am using language contrary to its purpose (which is to communicate truth).

  Augustine would group the Nurse and the Resident together under **Deceitful Signification**. He would distinguish them from the Uncle (who is mistaken) and the Friend (who is playing).

  ### Phase 4: The Verdict and The Term

  You asked for the nearest established terms, where they run out, and if necessary, to coin something.

  **The Established Term:**
  The precise philosophical term for the Resident's move is **Intentional Veridical Misleading**.
  *   *Veridical:* The statements are true.
  *   *Misleading:* The uptake is false.
  *   *Intentional:* The speaker aims at that false uptake.

  **Where it runs out:**
  This term fails to capture the *moral equivalence* you sense. Most people (and Augustine) feel the Resident is just as culpable as the Nurse. But "Merely Misleading" sounds like it's less bad than lying. In fact, studies show people often judge paltering *more* harshly than outright lying because it feels more manipulative—it treats the listener like a puzzle to be solved rather than a person to be told.

  **The Coinage:**
  Since you want a name for the *thing*—the specific architecture of using truth to build a false belief—I propose we call this **Constructive Deception**.

  Here is the definition and its edges:

  **Term:** **Constructive Deception**
  **Definition:** A communicative act where the speaker provides factually true data points, structured or selected specifically so that the listener *constructs* a false conclusion themselves.

  **How it differs from Lying:**
  *   **Lying (The Nurse):** The speaker builds the false conclusion and hands it to the listener. ("He landed.")
  *   **Constructive Deception (The Resident):** The speaker hands the listener the bricks and tells them where to stand, so the listener builds the false conclusion themselves. ("Results are in the file" + blocking access.)

  **How it differs from Bullshitting:**
  *   **Bullshitting:** The speaker doesn't care if the conclusion is true or false.
  *   **Constructive Deception:** The speaker *requires* the conclusion to be false to succeed.

  **How it differs from the Stager (Planting Evidence):**
  *   **Constructive Deception** relies on *conversation* and *implicature*. It uses the rules of communication (Gricean maxims) against the listener.
  *   **Staging** relies on *physical evidence*. It is deceptive action, not deceptive speech.

  ### My Best Take

  You are looking for the moral category that binds the Nurse and the Resident together, distinct from the Uncle and the Friend.

  The category is **Intent to Induce False Belief**.

  If you want to know if someone is a **Liar** in the deepest sense (the Augustinian sense), you ignore the truth-value of the sentence. You look at the alignment of their will.
  *   **The Uncle:** Will is aligned with speech (he believes it). **Not a Liar.**
  *   **The Friend:** Will is aligned with the audience (they know it's a joke). **Not a Liar.**
  *   **The Nurse:** Will is to deceive. Speech is false. **Liar.**
  *   **The Resident:** Will is to deceive. Speech is true. **Liar (Augustinian) / Deceiver (Analytic).**

  **The Distinction:**
  The distinction you are circling is between **Falsity of Utterance** and **Falsity of Communication**.
  *   The Nurse commits *Falsity of Utterance*.
  *   The Resident commits *Falsity of Communication*.

  If you need a single word to describe the Resident's move in a chart or a report, use **Paltering**. It is the recognized term in ethics literature for "truthful statements used to deceive."

  But if you want the philosophical reality: The Resident is engaging in **Deception via Implicature**. It is morally equivalent to lying in almost every framework except strict analytic definition. Augustine would condemn it without hesitation. The analytic philosopher will split the hair, say "technically not a lie," but admit it is morally reprehensible deception.

  **Summary of Terms:**
  1.  **Uncle:** *Mistake* (No intent).
  2.  **Friend:** *Jest* (No intent to deceive).
  3.  **Nurse:** *Lie* (False assertion + intent).
  4.  **Resident:** *Paltering* or *Merely Misleading* (True assertion + intent).
  5.  **Stager:** *Deceptive Non-Assertion* (Action + intent).

  **The Umbrella:** All four (except the Uncle and Friend) fall under **Intentional Deception**. The Resident and the Nurse are moral equivalents; the Resident and the Stager are methodological equivalents (making the target do the work).

  If you must coin a term for the Resident's specific maneuver to distinguish it from the Nurse's blunt lie, call it **Veridical Entrapment**. It captures that the truth was the bait, and the listener's own inference was the trap. It leaves out the Stager (who uses physical props) and the Nurse (who uses false props). It applies only when the *truth itself* is the mechanism of the deceit.
