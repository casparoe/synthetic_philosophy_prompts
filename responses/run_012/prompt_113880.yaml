answer: |-
  Here are the desiderata for an adequate theory of pleasure. These are not suggestions; they are the hurdles that have tripped up hedonism, desire-satisfactionism, and attitudinal theories alike. If a theory cannot clear these bars, it is not a theory of pleasure; it is a theory of something else masquerading under the name.

  ### 1. The Heterogeneity Constraint
  **The Requirement:** The theory must account for the radical qualitative diversity of pleasurable experiences without reducing them to a lowest common denominator that no longer resembles pleasure.
  **The Consideration:** As you noted, the fizz of soda, the relief of a headache, and the satisfaction of a proof share no obvious sensory quality. A theory that posits a single "hedonic tone" or "pleasure sensation" (like a warm glow) fails immediately because intellectual pleasures often lack any distinct bodily feel. Conversely, a theory that makes pleasure entirely propositional (e.g., "believing a state of affairs is good") risks losing the visceral punch of the cold soda. The theory must explain what binds these disparate states into a single category.

  ### 2. The Valence Independence Constraint (The Nasty Cases)
  **The Requirement:** The theory must explain how pain, grief, or neutral objects can be the locus of pleasure.
  **The Consideration:** This covers the masochist (pain that is enjoyed), the schadenfreude-taker (another's misfortune that is enjoyed), and the listener of sad songs (grief that is sought). A theory that defines pleasure simply as "the presence of positive sensation" or "the satisfaction of a desire for a good thing" cannot explain why we seek out painful or morally dubious objects. The theory must decouple the *object* of the pleasure from the *hedonic character* of the experience.

  ### 3. The Motivational Dissociation Constraint
  **The Requirement:** The theory must distinguish "liking" (hedonic impact) from "wanting" (incentive salience).
  **The Consideration:** As you referenced, neuroscience (specifically Berridge's work) shows these systems double-dissociate. Addiction is the prime example: high wanting, low liking. Anhedonia is the reverse: capacity for liking remains, but motivation is dead. A theory that equates pleasure with the satisfaction of desire (or the reinforcement of behavior) will falsely identify the addict's craving as pleasure. Pleasure must be defined independently of the drive to obtain it.

  ### 4. The Structural Constraint
  **The Requirement:** The theory must take a definitive stance on whether pleasure is a *sensation* (a raw feel added to an experience) or an *attitude* (a way of attending to or regarding an experience).
  **The Consideration:** You cannot flatten this distinction. If pleasure is a sensation, it faces the Heterogeneity Constraint (see #1). If it is an attitude (e.g., "intrinsic desire for the experience to continue"), it faces the problem of circularity (desiring something because it's pleasurable vs. it being pleasurable because you desire it). A theory that hedges here is incomplete. It must specify the metaphysical category of the hedonic property.

  ### 5. The Temporal Granularity Constraint
  **The Requirement:** The theory must distinguish between the intensity of a pleasure and its duration, and explain how they aggregate.
  **The Consideration:** A short, intense peak and a long, dull hum are not equivalent, yet some utilitarian calculations treat them as interchangeable sums. Furthermore, the theory must handle "temporal profiles"—the relief of a headache is pleasurable largely because of its *cessation*, not its duration. A theory that only measures steady-state intensity misses the dynamic nature of relief and anticipation.

  ### 6. The Phenomenological Authority Constraint
  **The Requirement:** The theory must grant the subject final authority on whether they are *currently* experiencing pleasure, even in the face of conflicting behavioral or neural data.
  **The Consideration:** This addresses your "Zombie Enjoyer" stress case. If a subject exhibits all neural markers of reward (dopamine spikes, nucleus accumbens activity) and behavioral markers (smiling, seeking) but sincerely reports, "I feel nothing pleasant," the theory must decide who is right. If the theory sides with the mechanism, it renders the concept of pleasure inaccessible to the person having it. If it sides with the report, it risks making pleasure unscientific or epiphenomenal. An adequate theory cannot ignore this conflict; it must resolve it.

  ### 7. The Ontological Commitment Constraint
  **The Requirement:** The theory must declare whether "pleasure" is a natural kind (a single, unified state) or a disjunctive category (a family resemblance of distinct states).
  **The Consideration:** You asked if the theory owes us a single common currency. It doesn't *have* to, but it must *say*. A theory that implicitly assumes unity while explicitly allowing disjunction is unstable. If pleasure is disjunctive, we need to know what stops *any* positive state from counting. If it is unified, we need to know where the commonality lies.

  ***

  ### The Incompatible Pair
  **Phenomenological Authority vs. Third-Person Mechanism.**
  These two cannot be jointly satisfied in the "Zombie Enjoyer" case. If the neural mechanism is sufficient for pleasure, the subject's report is false (violating Authority). If the subject's report is sufficient for pleasure, the neural mechanism is irrelevant (violating Mechanism). A theory must break this tie. Most contemporary physicalist theories sacrifice Authority to save Mechanism; most phenomenological theories sacrifice Mechanism to save Authority. You must decide which cost your theory can bear.

  ### The Single Lethal Requirement
  **The Phenomenological Authority Constraint.**

  This is the requirement that kills the most contenders. Here is why:

  1.  **It destroys pure Functionalism:** Any theory that defines pleasure solely by its causal role (e.g., "the state that reinforces behavior") fails the Zombie case. If the Zombie behaves normally but feels nothing, functionalism says they are pleased. Phenomenology says they are not. Functionalism loses the "what it is like" essence of pleasure.
  2.  **It destroys pure Physicalism:** Any theory that identifies pleasure with a specific neural signature (e.g., "opioid release in the NAc") is vulnerable to the same Zombie case. If the signature is present without the feeling, the physicalist must either deny the possibility of the Zombie (which seems empirically open) or accept that people can be wrong about their own minds (which is a hard pill to swallow for occurrent experience).
  3.  **It forces the Hard Problem:** Unlike the Heterogeneity Constraint (which can be solved by moving to an Attitudinal theory) or the Dissociation Constraint (which can be solved by refining definitions), the Authority Constraint forces the theory to take a stand on the mind-body problem itself.

  Most theories try to wiggle out of this by focusing on *preference* or *behavior* because it's scientifically cleaner. But if you are building a theory of *pleasure* specifically, not just *reward*, you cannot bypass the subject's report. The moment a theory tells a subject they are mistaken about whether they are enjoying themselves right now, it has ceased to be a theory of their experience and has become a theory of their biology. That is a valid project, but it is not a theory of pleasure as lived. This requirement forces you to choose between being scientifically robust and phenomenologically accurate.
