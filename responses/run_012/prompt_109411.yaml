  **MEMORANDUM**

  **TO:** Academic Honesty Panel
  **FROM:** Student Representative
  **DATE:** 24 October 2023
  **SUBJECT:** Recommendation on Voting Procedure and Case Consistency

  **Purpose**
  Following the recent adjudication regarding the History coursework, this memo addresses a structural inconsistency in our voting procedure. The outcome where a student is found to have copied work (a), intended to copy it (b), yet is found not guilty (c), undermines the panel's legitimacy. This document recommends a change to the voting order to prevent recurrence.

  **The Problem: Logical Inconsistency**
  Our current method allows separate majority votes on premises (a and b) and the conclusion (c). In the recent case, the majority voted 'Yes' on the premises but 'No' on the conclusion. This is a known instance of the **Doctrinal Paradox** (or Discursive Dilemma).

  *   **Settled Theory:** It is mathematically settled in judgment aggregation theory that voting separately on premises and conclusions can produce logically contradictory outcomes (Kornhauser & Sager, 1986).
  *   **Contested Theory:** It is contested among legal philosophers whether the 'Premise-Based' procedure (verdict follows from facts) or 'Conclusion-Based' procedure (verdict voted on directly) is morally superior. However, in regulatory contexts like academic honesty, consistency is generally prioritised over aggregate sentiment to ensure equal treatment.

  **The Independence Assumption**
  Regarding the suggestion that a panel vote guarantees accuracy via Condorcet's Jury Theorem:
  *   **Settled Theory:** This theorem strictly requires votes to be *independent*. As we share an evidence pack and deliberate together, our votes are correlated. Therefore, the theorem does not guarantee accuracy in our specific setting, regardless of panel size.

  **Recommendation**
  To resolve the contradiction and align with the Head of Year's principle that "the rules are the rules", I recommend adopting a **Premise-Based Procedure**.

  1.  **Vote on Facts First:** The panel votes only on questions (a) and (b).
  2.  **Verdict Derivation:** If both (a) and (b) are affirmed by majority, the verdict (c) is automatically 'Guilty'. If either is negated, the verdict is 'Not Guilty'.
  3.  **No Separate Verdict Vote:** We do not vote on (c) as a separate question that can override the logic of (a) and (b).

  **Addressing Concerns**
  *   **Head of Year:** This change strengthens the rulebook. A rule system that permits logical contradictions (Yes + Yes = No) is inherently flawed. Enforcing logical coherence ensures the rules are robust and defensible.
  *   **Strategic Voting:** This reduces the incentive for members to vote against the evidence on (a) or (b) to manipulate the outcome on (c), as (c) is no longer a separate lever.
  *   **Leniency:** If the panel wishes to be lenient, this should be managed through sentencing guidelines after a guilty verdict, not by contradicting factual findings.

  **Conclusion**
  Adopting this procedure ensures that our findings are logically sound and that similar cases are treated equally in future.

  Verdict: Premise-Based Procedure
