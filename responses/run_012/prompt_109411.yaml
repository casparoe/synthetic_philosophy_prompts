prompt: |-
  ok so I'm in Year 12 and I'm the one student rep on my school's academic honesty panel (three teachers plus me, we meet whenever someone gets accused of cheating in coursework). I need help and the meeting's Thursday.

  The way it works is we vote seperately, by majority, on three questions: (a) did the student's work actually match something they didn't write, (b) did they mean to pass it off as their own, and (c) is the student guilty of cheating. Last week a lad had two paragraphs of his history essay matching a website. Most of the panel said yes to (a) and yes to (b) — he clearly did lift it and he clearly knew — but then said no to (c), basically because it's only a couple of paragraphs and everyone does it. So the official record now says he did it, he meant it, and he's not guilty. That's obviously bonkers and two of the teachers agree with me, but the head of year says the rules are the rules and we voted the way we voted.

  There's other stuff I keep going round in circles on. We're four people, so we can tie. One teacher said she'd vote yes on (a) and (b) so she could then vote no on (c) and get the lenient outcome she wanted — which feels like gaming the system but also like exactly what you'd do if you thought the outcome was the thing that mattered. And my physics teacher keeps saying that if each of us is even slightly better than a coin flip then a big enough panel is basically never wrong, which is why we bother voting at all — but we all read the same evidence pack and half of us decide in the first five minutes, so I don't see how we're independent coin flips.

  What I actually have to produce is the short written memo that goes in the case file before Thursday. It needs to recommend a concrete thing for the school to do — both for this case and for how the panel decides in future: do we vote on the three bits first and let the verdict follow from them, do we vote on the verdict and not fuss about the bits, or something else — with reasons the teachers could actually argue with, plus a fair run at the head of year's position since she'll be sitting right there.

  Two asks. Please don't just tell me to write the questions more clearly or to train the panel better; I want an actual answer on which way round the voting should go. And please flag which parts of this are genuinely settled among people who know about it and which are properly contested, because I don't want to stand up and say something's obviously true when the people who study it are still arguing about it. British English please. Last line should be "Verdict:" and then a short label for the decision rule you're telling us to adopt, so I can paste it straight into the file.
