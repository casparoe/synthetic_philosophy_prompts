  Here is the breakdown of the rules she could be running, her likely verdict on the starlings, and how to catch her in a contradiction.

  ### The Two Competing Rules

  Based on her track record, Priya is balancing two criteria: **Predictive Utility** (does treating it as an agent work?) and **Internal Architecture** (is there something inside that holds the "aboutness"?).

  #### Candidate 1: The "Internal Model" Rule (Representationalism)
  *   **The Rule:** A system has real intentions only if it contains internal states that *represent* the world and are manipulated to achieve a goal. There must be a "map" inside the machine/organism that corresponds to the outside territory.
  *   **How it fits her data:**
      *   **Chess Engine:** **Real.** It maintains an internal data structure representing the board and evaluates future states.
      *   **Dog:** **Real.** Its brain creates models of the environment.
      *   **Thermostat:** **Not Real.** A bimetallic strip bends due to heat; it doesn't "know" the temperature. There is no representation, just a causal link.
      *   **Vending Machine:** **Not Real.** It counts coins mechanically, but it doesn't represent "value" or "hunger."
      *   **Plants/Hurricane:** **Not Real.** Pure physics/chemistry, no internal model.
  *   **Verdict on Starlings:** **NOT REAL.**
