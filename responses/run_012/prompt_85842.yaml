answer: |-
  Derive the weighted sum from Pareto first, then justify the equal weights with the veil.

  **1. Order of Pieces**
  *   **0–20 mins: The Constraint (Pareto + vNM).** Start with the Pareto Principle (if everyone prefers A to B, society must) and the assumption that individuals are rational expected-utility maximizers (vNM). Do not start with the Veil.
      *   *Why:* If you start with the Veil, the philosophers claim it's just another ethical intuition (like Rawls) and the ML people check out. By starting with Pareto, you ground the session in a democratic minimum everyone accepts, then show the ML/Econ people that this constraint *mathematically forces* a specific social structure.
  *   **20–50 mins: The Derivation (Aggregation Theorem).** Show that Pareto + vNM implies social welfare must be a linear combination of individual utilities ($W = \sum a_i U_i$).
      *   *Why:* This is the "hinge." It separates the *form* of the solution (weighted sum) from the *values* of the solution (the weights). It keeps the economists engaged (proof structure) and forces the philosophers to admit that utilitarianism isn't just a vibe—it's the only thing consistent with Pareto under risk.
  *   **50–70 mins: The Weights (Impartial Observer).** Now introduce the Veil of Ignorance/Impartial Observer to argue for $a_i = 1$ for all $i$.
      *   *Why:* Now the machinery is built; you just need to set the parameters. This satisfies your intuition without conflating it with the proof. It clarifies that equal weights are an ethical add-on, not a mathematical necessity.
  *   **70–90 mins: The Breakdown (Spurious Unanimity & Limits).** Discuss where it fails (disagreement on probabilities).
      *   *Why:* Ends on critical engagement rather than dogma, preventing the ML smugness from solidifying into "problem solved."

  **2. The One Example**
  *   **The Scenario:** A two-person society (Alice and Bob) choosing between two lotteries (Policy X and Policy Y).
      *   Policy X: 50% chance Alice gets 10/Bob gets 0; 50% chance Alice gets 0/Bob gets 10.
      *   Policy Y: 100% chance Alice gets 4/Bob gets 4.
  *   **What it needs:** Explicit probabilities and explicit utilities. It must involve risk (lotteries), not just certainty, because Harsanyi relies on vNM axioms which require risk to distinguish utility from ordinal preference.
  *   **What it must not have:** More than two people (clutters the whiteboard), or ambiguous outcomes (keeps the focus on aggregation, not measurement). Keep the numbers linear so the "sum" is visible without calculation fatigue.

  **3. Misconceptions (Real vs. Invented)**
  *   **All four are real.**
  *   **(c) "Utility means happiness":** Head this off in the **first 10 mins**. Define vNM utility strictly as "what satisfies the rationality axioms," not hedonic welfare. If you don't, the philosophers will dismantle you on measurement theory.
  *   **(d) "Pareto is trivial":** Head this off at **20 mins**. When you show the derivation, emphasize that Pareto is the *only* ethical premise used to get the weighted sum. It does all the heavy lifting; the math is just the translator.
  *   **(a) "This is Rawls with maths":** Head this off at **50 mins** (The Weights section). Clarify that Rawls uses the Veil to justify Maximin; Harsanyi uses it to justify Equal Weights. The math is the same; the decision rule under ignorance differs.
  *   **(b) "So it proves utilitarianism":** Head this off at **60 mins**. Explicitly state: "The theorem proves *weighted* utilitarianism. Classical utilitarianism requires the extra step of arguing weights must be equal."

  **4. Handling the Half-Understood Concepts**
  *   **Impartial Observer vs. Aggregation:** Treat them as **separate modules**. Aggregation (Pareto + vNM) gets you to $W = \sum a_i U_i$. Impartial Observer gets you to $a_i = 1$. Do not blend them. Write them as two distinct equations on the board. If you blend them, you validate the critique that you're smuggling ethics into the math.
  *   **Spurious Unanimity:** Place this in the **final 20 mins** as a "boundary condition." Explain it simply: If Alice prefers X because she thinks rain is likely, and Bob prefers X because he thinks rain is unlikely, Pareto says Society must prefer X. But Society knows they disagree on probabilities. This shows the theorem breaks if preferences aren't separable from beliefs. Don't try to solve it; just show it exists to humble the ML crowd who assume probabilities are objective.

  **5. The Gap: Weighted Sum vs. Utilitarianism**
  *   **The Plan:** Draw the equation $W = a_1 U_1 + a_2 U_2 + ...$ large on the board. Circle the $a_i$.
  *   **The Admission:** State clearly: "Harsanyi proves the sum exists. He does not prove the $a_i$ are equal. To get utilitarianism, I must add a premise: that everyone's utility counts equally."
  *   **Why:** This honesty disarms the philosophers. You aren't claiming math proves morality; you're claiming math constrains how you can implement morality.

  **6. The Final Question**
  *   "If two individuals agree on a policy but hold mutually exclusive beliefs about why it works, does the Aggregation Theorem still demand we adopt it?"
  *   **Why:** This tests if they understand that the theorem requires shared probabilities (or separable beliefs) to function. If they say "yes," they only have the vibe. If they say "no, that's spurious unanimity," they got the theorem.

  **7. What to Refuse**
  *   **Refuse to prove the theorem formally.** Say out loud: "I am not doing the linear algebra proof today. It exists, it's valid, but it's not the philosophical bottleneck." This prevents the economist from correcting your notation and the undergrads from drowning.
  *   **Refuse to defend Utilitarianism as 'True'.** Say: "I am not arguing Utilitarianism is correct today. I am arguing that *if* you accept Pareto and vNM, *then* you are committed to this structure." This keeps the session analytical rather than preachy.
