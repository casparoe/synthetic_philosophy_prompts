  **Kestrel Data Services | People Operations**
  **Subject: Welcome to the Fairweather Compensation Model!**

  Hi Team!

  We are thrilled to welcome you to Kestrel, where we don't just analyze data—we align incentives with moral reality! Following our groundbreaking Fairweather Review, we realized that traditional pay rewards things nobody chooses: genetics, upbringing, or simply being standing near the right whiteboard. That's why we've moved to a Desert-Based Compensation scheme. Here is everything you need to know about your new financial journey toward true equity!

  **Q: How is my quarterly pay calculated?**
  **A:** Great question! Your pay is equal to your **Ablation Score**. To determine this, we re-run the quarter's projects with you removed and replaced by a baseline candidate from our applicant pool. The revenue difference is your contribution! Note that the baseline candidate is selected by our Baseline Committee. Their minutes are sealed to prevent you from feeling responsible for factors outside your control, like the committee's own unchosen biases. You are entitled to this score under our rules, even if the talents that generated it were morally arbitrary.

  **Q: But what if I work harder than the baseline?**
  **A:** We love that energy! However, philosophical research suggests your capacity for hard work is itself the result of prior causes you didn't choose, like upbringing or neurochemistry. To account for this, we apply an **Effort Surcharge** to any income generated by "grit." This ensures you aren't unfairly rewarded for luck disguised as virtue. Please note: the effort required to calculate this surcharge is itself unchosen, so the surcharge applies recursively to the labor of calculating the surcharge. We find this loop beautifully consistent!

  **Q: What happens if my Ablation Score is negative?**
  **A:** Congratulations on identifying a net drain! If the baseline candidate generates more revenue than you, your score is negative. This means you owe Kestrel the difference. We know this sounds steep, but consider the fairness: if you didn't choose the traits causing the loss, it's equally arbitrary for the firm to absorb the cost. Payroll will automatically deduct this from your future positive scores. If you remain in a debit position, we view this as a valuable opportunity for you to financially contribute to the collective without relying on unearned merit.

  **Q: What is the Luck Ledger?**
  **A:** Every employee maintains a weekly Luck Ledger. Did the server stay up during your shift? Did a client like your voice? Log it! Positive luck events are offset against your pay to ensure you aren't profiting from chance. Negative luck events qualify for minor restitution. Remember, logging luck requires diligence, which is an unchosen trait, so please log your logging effort in the Ledger itself to avoid accumulating unearned credit for administrative compliance.

  **Q: What is the Residual Escrow account?**
  **A:** Sharp eye! Since almost all income can be traced to unchosen factors (talent, luck, market conditions), very little money is technically "deserved" by anyone. Instead of distributing undeserved wealth, we deposit it into the Residual Escrow. It has been growing quietly for eight quarters and is now larger than the firm's annual revenue. It represents the sum total of our collective moral humility. We don't discuss the escrow's ultimate use because assigning it a purpose would imply someone deserves to decide, which would restart the cycle of arbitrariness. For now, it sits safely, proving we take fairness seriously!

  We can't wait to see your scores!

  ***

  *Legal Note: Per Section 8.2 of the Fairweather Review, all funds in the Residual Escrow are deemed ownerless property and revert automatically to Kestrel Data Services shareholders.*
