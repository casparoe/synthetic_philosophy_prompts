answer: |-
  You should absolutely not start with Bertrand's chord problem, even though it is the namesake of the session, because beginning there invites the geometry debate that will eat your clock. If you draw the circle and the three methods immediately, the two maths students will start arguing about measure spaces, the economist will demand a physical randomizer, and the philosophy students will get lost in the diagrams, leaving you twenty minutes in to still be arguing about whether method two is more natural than method one. You should also reject the plan to skip the chord entirely and rely only on the wine-and-water and cube cases. While those are cleaner for demonstrating parameterization dependence, they do not naturally invite the discussion of symmetry groups under rotations and translations, which is essential for your punchline about invariance relocating the problem rather than solving it. You need the geometry to make the symmetry group argument plausible enough that they feel the pinch when you withdraw the justification. So commit to a sequence of wine-and-water first, then the cube, then Bertrand's chord. This ordering scales the complexity from algebraic to physical to geometric, inoculating them against the idea that there is a unique natural parameterization before they ever see the circle.

  Put this distinction on the board in the first two minutes and leave it there until they walk out. Write PoI version one: assign equal probability to mutually exclusive possibilities when there is no evidence favoring one over the other. Write PoI version two: assign a probability function that is invariant under the symmetries of the problem space. Do not explain them yet. Just let them sit there. This artifact anchors the entire session because every example you discuss will be a battle between these two definitions. The wine-and-water case is your opening wedge because it is algebraically trivial and strips away physical intuition that might distract them. Present the ratio of wine to water as varying between one half and two. Ask for the probability the ratio is at most one. If they assume indifference on the ratio, they get a third. If they assume indifference on the reciprocal, they get two thirds. This happens fast, within ten minutes, and it forces them to see that indifference on a variable implies non-indifference on its inverse. It kills the idea that indifference is a property of the state of affairs rather than a property of the description.

  Follow this immediately with the cube case to reinforce the point with physical dimensions. A machine produces cubes with edge lengths between zero and one. Ask for the probability the edge is under a half. If they are indifferent to edge length, it is a half. If they are indifferent to volume, it is an eighth. If indifferent to face area, it is a quarter. This case does work that the wine case cannot because it tempts them to think there is a physically correct answer. They will want to say the machine obviously controls the edge length, not the volume. You must block this. Tell them the specification is only that the cubes vary between zero and one in size, with no information about the production mechanism. This is where you head off the economist. When they say probabilities are just long-run frequencies, you tell them that the principle of indifference is explicitly for cases where we do not know the long-run frequencies. If we knew the mechanism, we wouldn't need the principle. The principle is a rule for reasoning under ignorance, not a description of a physical propensity. If you let the economist win this point early, the rest of the session becomes a debate about experimental design rather than epistemic norms.

  Now you move to Bertrand's chord problem, but you frame it differently than usual. Do not ask them which method is correct. Ask them which variable is being treated uniformly in each method. Method one is uniform on the angle, method two is uniform on the distance from the center, method three is uniform on the position of the midpoint. By now, having seen the wine and the cube, they should recognize that these are just different parameterizations of the same space. They should see that the phrase at random is doing all the work because it smuggles in a choice of parameter without stating it. This is where you bring them back to the board. Version one of the principle of indifference tells them to spread credence evenly over the possibilities they have listed, but in the continuum, listing possibilities requires choosing a variable. Version two tells them to look for symmetries. This is where you introduce the Jaynes-style resolution that demand for invariance under rotations and translations of the plane selects the unique answer of a half. You must present this not as the solution but as the relocation of the problem.

  Here is the pinch you want them to feel. Ask them why we demand invariance under rotations and translations but not under scaling or shearing. The answer is usually that the problem looks the same under rotation. But why does the problem look the same under rotation and not under scaling? Because we assume the circle is fixed in size and position. But who fixed that? The problem description did not specify a coordinate system. By choosing the group of Euclidean motions, you have added information that was not in the problem statement. You have justified version two of the principle of indifference by assuming a symmetry group, but the choice of group is just as arbitrary as the choice of parameterization unless you can justify why that group is the only admissible one. This is the core insight. The invariance move rescues the principle from arbitrariness only by assuming a prior commitment to which transformations matter. You want them to see that version two is a much stronger demand than version one and only means anything once you have said which transformations count.

  There are misconceptions you must anticipate beyond the frequentist objection. The philosophy students will likely think the paradox shows probability is purely subjective. You need to correct this by emphasizing that the problem is not about personal belief but about rational constraints on belief given ignorance. If two rational agents with the same information assign different probabilities, one is violating a norm of reasoning. The maths students will try to invoke measure theory to dissolve the paradox. You must tell them explicitly that measure theory tells us how to calculate probabilities once a measure is chosen, but it does not tell us which measure to choose in the absence of information. That is the philosophical gap. You should also expect them to miss the distinction between a finite uniform list and a uniform interval. They will think indifference on a finite set of options is the same animal as indifference on a continuum. You need to point out that finite indifference is combinatorial while continuous indifference requires a measure, and the paradox arises because there are infinitely many measures that look uniform depending on your coordinate system.

  There are things you must deliberately not do. Do not derive the maximum entropy solution. Do not discuss the general theory of invariant measures on groups. Do not mention countable additivity. Bringing in maximum entropy will make it look like a technical fix rather than a philosophical problem, and it will alienate the philosophy students. Bringing in group theory will lose the non-maths students. Countable additivity is a rabbit hole that does not help with the core issue of parameterization. You should say out loud that you are skipping these because they are solutions to the mathematical formulation, but you are interested in the epistemic justification. If you skip the measure theory details, you do not break anything downstream because the point is that the measure choice is the problem, not the calculation. The only risk is if the maths students feel you are being imprecise, so acknowledge their expertise but insist that the question is about the prior choice of space, not the integration over it.

  For the final ten minutes, you need a question that tests whether they understand the distinction between the two versions of the principle rather than whether they can recite the chord answers. Do not ask them to solve a new paradox. Ask them this. Suppose we apply the invariance requirement to the cube case. If we demand the probability assignment be invariant under a change of units, say from centimeters to inches, which parameterization survives? A student who only half understood will say the edge length, because that is the natural physical parameter. A student who got the distinction will realize that uniformity on edge length is not scale invariant. If you change units, the distribution changes unless you use a logarithmic measure, which is improper. This forces them to see that even the symmetry argument requires a justification for why scale invariance should or should not apply, and that version two of the principle does not magically produce a unique answer without extra assumptions. It tests whether they see that the symmetry group choice is the hidden premise.

  Using both the wine and cube cases is not one too many because they perform different functions. The wine case is abstract and shows the logical dependence on parameterization without physical distraction. The cube case introduces physical intuition which makes the arbitrariness harder to swallow, thereby strengthening the lesson when you show it is still arbitrary. If you skip the wine case, the cube case becomes about physics. If you skip the cube case, the wine case feels too algebraic to generalize to geometry. You need the progression to get them to the chord problem ready to see it as a parameterization issue rather than a geometry puzzle. Keep the chord problem, but subordinate it. It is the culmination, not the starting point. The goal is not to solve Bertrand's paradox but to use it to show that the principle of indifference is either trivial or unjustified unless you supply the missing symmetry premise, and supplying that premise is where the real work lies.
