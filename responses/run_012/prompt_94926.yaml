prompt: |-
  You're an expert in philosophy of probability who's taught this material many times to non-specialists, so plan the session as someone who knows exactly where it goes wrong in the room.

  I'm a postdoc and next week it's my turn to run our reading group, which is mostly third- and fourth-year philosophy students plus two maths people who've done a real probability course, and one economist who keeps saying probabilities are just long-run frequencies. Seventy-five minutes, whiteboard, no measure theory assumed beyond uniform distribution on an interval. The topic I've been handed is the principle of indifference and Bertrand's paradox. Don't explain it to me — I know the material. Plan how I should explain it. Start by sketching a couple of candidate orderings of the pieces and saying which you'd throw out and why, then commit to one.

  What I want out of the session: they should leave thinking the interesting question isn't which of a third, a quarter, a half is the right answer to the chord problem, but that the phrase at random is doing all the work. And I want them to see that there are really two things called the principle of indifference — one that says spread your credence evenly over the possibilities you've listed, which is fine and unremarkable for a finite list, and one that says your credence function should be invariant under the symmetries of the problem, which is a much stronger demand and only means anything once you've said which transformations count. The punchline I'm after is that the second looks like it rescues the first but really just relocates the problem: now you owe me a justification for the choice of group, and I want them to feel that pinch themselves rather than hear me assert it. There's a well-known line of thought that the chord problem becomes well-posed once you demand invariance under rotations and translations of the plane, after which the answer is a half and the other two methods are simply wrong. Whether you think that's a fix or a swindle is a separate question; plan the session that gets them to the distinction and lets them push back on it.

  So what has to come first, second, third, and why those dependencies and not others — does the frequency-versus-credence business need settling before the paradox bites at all, or does it bite harder if I leave it till later? Then the one case I should build the whole session around. I'd been going to use the chord problem itself, but I'm now wondering wether that's a mistake, because it invites a which-method-is-natural argument that never resolves and eats the clock. Tell me whether to use it, or to make something else carry the weight, and what the carrying case has to have and has to lack to do that job. Then the misconceptions I should expect and exactly where in the sequence to head each one off. My guesses: they'll think the paradox shows probability is subjective; they'll think the resolution is just you have to specify the experiment, i.e. the frequentist point, and that that's the end of it; they'll think the invariance move settles it and a half is simply correct; and they'll never notice that a finite uniform list and a uniform interval are different animals, so the continuum needing a measure at all will go straight past them. Tell me what I've missed, especially the ones this particular audience will have that I won't predict. Then what I should deliberately not do at this level and should say out loud that I'm skipping — I'm thinking the maximum-entropy derivation, the general theory of invariant measures on groups, anything about countable additivity — and which of those cuts would actually break something downstream. Then one question to put to them in the last ten minutes that shows whether the distinction landed rather than whether they can recite it: something where a student who only half got it will answer confidently and wrongly. And if there's a short thing I can put on the board in the first two minutes that they'll still be looking at at the end, tell me what it is.

  Two constraints. First, I want to inject a couple of cases they definately haven't seen so they can't coast on whatever they half-remember. I'm planning to use the wine-and-water case — a glass of wine and water mixed, the wine-to-water ratio somewhere between a half and two, what's the probability it's at most one, which comes out a third or two thirds depending on which way round you take the ratio — and the cube case — a machine turning out cubes with edge lengths somewhere between nought and one, probability the edge is under a half: a half if you're indifferent in the edge, an eighth if you're indifferent in the volume, a quarter if you're indifferent in the face area. Work out where each belongs in the sequence and what each one does that the other doesn't, and tell me honestly whether using both is one too many. Second, write the whole thing as continuous prose. No headings, no numbered lists, no bullet points, no bold, no tables — just paragraphs, the way you'd write it to a colleague in an email. Don't hedge everything either; where you have a view about the best sequence, commit to it.
