answer: |-
  **The Reactive Vase and the Limits of Conditionalization**

  The Simple Conditional Analysis (SCA) of dispositions possesses an undeniable initial appeal. It promises to naturalize mysterious modal properties—fragility, solubility, flammability—by reducing them to straightforward subjunctive conditionals. On this view, to say a vase is fragile is simply to say that if it were struck, it would break. This reduction aligns with an empiricist metaphysics that seeks to eliminate occult powers in favor of observable behaviors and their logical conditions. However, the last few decades of metaphysical debate have been dominated by counterexamples known as "finks" and "masks," which sever the link between the disposition and the counterfactual.

  While the literature is replete with standard examples, such as C.B. Martin's electro-fink or antidotes for poisons, these cases often invite the objection that the interference is merely external or accidental. To truly test the resilience of the SCA, we must consider cases where the interference is intrinsic to the object's nature. In this essay, I will introduce a novel case—the "Reactive Vase"—to argue that the SCA cannot be salvaged. The Reactive Vase functions as an *intrinsic fink*, demonstrating that the truth of the relevant counterfactual is not necessary for the possession of a disposition. Consequently, I will defend the verdict that the SCA should be abandoned in favor of a Causal Basis ontology, where dispositions are grounded in categorical properties rather than defined by conditionals.

  ### The Reactive Vase Case

  Consider a specific class of ceramic vases, which I call "Reactive Vases." These are manufactured from a proprietary clay composite that possesses a unique standing feature. In its resting state, the clay has the exact microstructure of ordinary, fragile earthenware. It lacks a rigid lattice; its molecular bonds are brittle. However, the clay is also piezoelectrically sensitive. If the vase is struck with sufficient force ($S$), the impact triggers an immediate chemical reaction within the clay. This reaction causes the molecules to fuse into a rigid, unbreakable lattice. This transformation occurs nearly instantaneously—fast enough to prevent the propagation of the fracture caused by the strike.

  Thus, we have the following scenario: A Reactive Vase sits on a table. It is unstruck. In this state, it possesses the microstructure of a fragile vase. If it were never struck, it would remain in this soft, brittle state forever. However, if it *is* struck, the stimulus triggers the hardening mechanism, and the vase does not break ($\neg M$).

  The question for the proponent of SCA is straightforward: Is the unstruck Reactive Vase fragile?

  According to the SCA, an object is disposed to manifest $M$ upon stimulus $S$ if and only if, were $S$ to occur, $M$ would occur. Formally: $D \leftrightarrow (S \boxright M)$. In the case of the Reactive Vase, if it were struck, it would harden and survive. The counterfactual "If struck, it would break" is false. Therefore, the SCA dictates that the Reactive Vase is *not* fragile.

  This verdict clashes with strong metaphysical intuitions. Before the strike, the vase lacks the rigid lattice that confers durability. It possesses the categorical base of fragility (the brittle molecular arrangement). The fact that the stimulus *removes* this base does not intuitively negate the fact that the base was present *prior* to the stimulus. The vase is fragile *until* it is struck. The disposition exists at $t_0$, even though the counterfactual truth condition fails at $t_0$.

  ### The Intrinsic Fink

  The Reactive Vase is a specific variety of finkish case. In Martin's original electro-fink, a wire is disposed to conduct electricity when touched, but an external device detects the touch and instantly renders the wire non-conductive. Critics of Martin's case sometimes argue that the disposition is extrinsic or that the example relies on "magic" technology. The Reactive Vase blocks these escape routes. The interfering mechanism is not an external machine; it is built into the clay itself. The finkishness is intrinsic.

  This distinction is crucial for evaluating the most common repair of the SCA: the restriction to intrinsic dispositions. David Lewis, acknowledging the threat of finks, proposed that we analyze dispositions not merely by the counterfactual, but by the possession of an intrinsic causal basis. On Lewis's refined view, $x$ is fragile iff $x$ has an intrinsic property $B$ such that if $x$ were struck and retained $B$, $x$ would break.

  The Reactive Vase puts significant pressure on this Lewisian repair. In the standard electro-fink, the intrinsic property of the wire (its conductivity) is removed by an *external* cause. In the Reactive Vase, the stimulus *itself* causes the intrinsic property to change. The strike ($S$) is the cause of the loss of the brittle structure ($B$).

  If we adhere strictly to the SCA, we must say the vase is not fragile. If we adopt Lewis's "retention of basis" clause, we can say the vase *is* fragile, because it has the basis $B$, and if it had $B$ and were struck, it would break. However, this move reveals a fatal concession. By adding "and retained $B$" to the antecedent of the conditional, we are no longer analyzing the disposition *in terms of* a simple counterfactual. We are analyzing it in terms of a *causal basis* that supports a counterfactual. The counterfactual is no longer the definition of the disposition; it is merely a symptom that holds only when the basis is held fixed.

  The Reactive Vase demonstrates that the stimulus can alter the very nature of the object such that the counterfactual fails, even though the disposition was genuinely present immediately prior to the stimulus. If the SCA is to be "salvaged" by adding clauses about causal bases and their persistence, it ceases to be a *Conditional* Analysis and becomes a *Causal* Analysis. The conditional is demoted from the *definiens* to the *definiendum*.

  ### Masks, Bases, and the Priority of Metaphysics

  One might object that the Reactive Vase is not a fink but a mask. A mask is a case where the disposition remains present, but something prevents the manifestation. For example, a fragile vase packed in Styrofoam is still fragile, but it won't break if dropped because the Styrofoam absorbs the shock. If the Reactive Vase is merely masked, perhaps the SCA can handle it by specifying "in ideal conditions."

  However, the Reactive Vase is not a standard mask. In a masking case, the disposition (fragility) persists through the stimulus. The Styrofoam vase is still brittle upon impact; the force is just diverted. In the Reactive Vase, the brittleness *vanishes* upon impact. The molecular structure changes. This is the definition of a fink: the stimulus causes the disposition to cease before the manifestation can occur. Because the change is intrinsic and triggered by the stimulus, we cannot appeal to "external ideal conditions" to fix the analysis. The "non-ideal" condition is the vase's own nature.

  This forces a choice between two metaphysical pictures. The first is the Humean/SCA picture, where dispositions are logical constructs derived from patterns of events (counterfactuals). The second is the Aristotelian/Powers picture, where dispositions are real properties grounded in the object's categorical structure.

  The Reactive Vase shows that the Humean picture gets the direction of explanation backward. Why is the counterfactual "If struck, it would break" usually true for ordinary vases? It is true *because* the vase has a brittle molecular structure. The categorical base grounds the counterfactual. In the Reactive Vase, the categorical base is present at $t_0$. Therefore, the disposition is present at $t_0$. The fact that the counterfactual is false is due to the dynamic nature of the base (its reactivity), not the absence of the disposition.

  If we cling to the SCA, we are forced to say the vase's fragility pops into existence only when the counterfactual becomes true. But when would that be? Perhaps if we disable the hardening mechanism? But then we are testing a *different* vase (a non-reactive one). The SCA forces us to deny the reality of the disposition in the actual object to preserve the truth of the conditional. This is metaphysical inversion. We should not deny the existence of a property because a test for it yields a false negative due to the property's own complex dynamics.

  ### The Verdict: Abandoning the Conditional

  Can the SCA be repaired? Proponents like Stephen Choi or Lars Gundersen have suggested refined conditional analyses that explicitly reference the causal basis in the antecedent (e.g., "If $S$ were to occur and the causal basis $B$ were to remain intrinsic..."). While these analyses can technically accommodate the Reactive Vase, they do so at the cost of the SCA's primary virtue: ontological parsimony.

  The original motivation for the SCA was to avoid positing irreducible dispositional properties. It sought to reduce "power" talk to "if-then" logic. But to handle finks like the Reactive Vase, the analysis must explicitly quantify over "causal bases" and their persistence conditions. Once you admit "causal bases" into the analysis, you have admitted the very ontological category the SCA sought to eliminate. You are now saying: "To have a disposition is to have a base $B$ such that..." This is a Causal Basis Theory, not a Conditional Analysis. The conditional becomes a heuristic device, not a metaphysical definition.

  Furthermore, the Reactive Vase highlights a temporal problem that no conditional analysis easily resolves. Dispositions are properties held at a time. The Reactive Vase is fragile at $t_0$. The strike occurs at $t_1$. The hardening occurs at $t_1 + \epsilon$. The SCA evaluates the disposition at $t_0$ based on a counterfactual outcome at $t_1 + \epsilon$. But the object at $t_1 + \epsilon$ is metaphysically different from the object at $t_0$. The SCA conflates the identity of the object across the transformation. It judges the disposition of the *brittle* vase based on the behavior of the *hardened* vase. This is a category error. The brittle vase would break; the hardened vase would not. Since the strike turns the former into the latter, the simple counterfactual "If struck, it would break" is ambiguous about *which* object is being evaluated. A Causal Basis account avoids this by anchoring the disposition to the structure at $t_0$.

  Therefore, the Reactive Vase case demonstrates that the link between dispositions and counterfactuals is contingent, not necessary. The counterfactual is a reliable indicator of a disposition only in "quiescent" objects where the causal base does not react to the stimulus by self-annihilation. Since a general metaphysical analysis must cover all cases, including reactive ones, the SCA fails as a universal definition.

  ### Conclusion

  The Simple Conditional Analysis offers a seductive simplicity, but the Reactive Vase proves it is too brittle to withstand the complexity of the real world. By presenting a case where the finkish interference is intrinsic and triggered by the stimulus itself, we see that restricting the analysis to intrinsic properties or ideal conditions is insufficient. The stimulus can alter the intrinsic properties faster than the manifestation can occur.

  Attempts to repair the SCA by building causal bases into the antecedent effectively abandon the project of reducing dispositions to conditionals. They concede that the causal base is the primary ontological reality and the counterfactual is derivative. Consequently, the most defensible verdict is that the SCA should be abandoned. We ought to adopt a Causal Basis or Dispositional Essentialist ontology, where dispositions are real properties grounded in the object's structure. On this view, the Reactive Vase is straightforwardly fragile at $t_0$ because it possesses the categorical base of fragility, regardless of the fact that its reactive nature ensures the counterfactual "if struck, it would break" is false. Metaphysics must track the powers that objects *have*, not merely the outcomes that *would be*, especially when the objects themselves are dynamic enough to change the rules of the game upon being played.
