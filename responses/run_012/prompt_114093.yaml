          *   Apply SCA: Strike $\rightarrow$ Hardening $\rightarrow$ No Break. SCA says "Not Fragile."
          *   Intuition: It *is* fragile *before* the strike. It has the microstructure of fragile clay. The hardening is a *reaction* to the threat.
          *   Diagnosis: This is an **Intrinsic Fink**. The stimulus removes the disposition's base intrinsically.
          *   Why it's worse than Martin's Fink: Martin's was external. A skeptic could say "Okay, restrict to intrinsic dispositions." But here, the finkishness is *inside* the vase. Restricting to "intrinsic" doesn't help because the intrinsic property changes *upon* stimulus.

      *   **Evaluating Repairs:**
          *   *Repair 1: Intrinsic Restriction (Lewis).* Lewis suggests looking at the intrinsic base. But since the base changes *during* the stimulus event, the counterfactual "If struck, would break" remains false. Lewis needs to add "and the base persists."
          *   *Repair 2: Holding the Basis Fixed (Choi/Gundersen).* "If $S$ occurred and the causal basis $B$ remained..." This makes the counterfactual true.
