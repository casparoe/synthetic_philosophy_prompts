      *   *Causal Basis (Lewis/Armstrong):* Disposition = having a categorical base $B$ such that $S + B \rightarrow M$. In the reactive vase, $B$ exists *before* the strike. But $S$ destroys $B$ (or changes it to $B^*$) before $M$ happens. The counterfactual "If $S$ were to occur, $M$ would occur" is false because $S$ alters $B$.
      *   *Masking:* A mask prevents manifestation despite the disposition remaining. Here, the disposition (fragility) arguably *disappears* upon striking. So it's more finkish than masked. But one could argue the *potential* to break is masked by the *potential* to harden.
      *   *Dispositional Essentialism (Bird):* Dispositions are fundamental. The essence of fragility involves the manifestation. If the vase doesn't break, does it have the essence? Bird might argue the reactive vase has a *different* essence (reactive fragility?). This gets messy.
      *   *Choi's/McKitrick's refinements:* Keeping the basis fixed. "If $S$ occurred and the basis remained..."

