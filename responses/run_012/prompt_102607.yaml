      To the Grants Committee from the Consequences Review Office regarding the proposal for insecticide-treated bed nets in the Lake Region. On the surface, this initiative appears robust, promising a reduction in malaria vectors and a corresponding decrease in child mortality. Under a standard risk assessment framework, one might assign a high probability to these immediate outcomes and approve the funding without hesitation. However, our foundation's charter mandates a rigorous expected-value calculation based on the total consequences of any action, extending indefinitely into the future. It is in the execution of this mandate that we encounter the structural impediment known within our office as radical cluelessness.

      The difficulty is not merely epistemic uncertainty regarding known variables. We are not dealing with a wager where the menu of outcomes is fixed and we lack only the precise odds. Rather, the intervention alters the trajectory of history in ways that are fundamentally unenumerable. Each life preserved enters the causal stream, reproducing, consuming resources, forming political opinions, and potentially instigating conflicts or innovations that ripple outward without decay. To calculate the net value of saving a specific child today, we would need to know the moral value of every action that child performs, plus the actions of their descendants, minus the actions of those who would have occupied the ecological niche had the child died. The outcome space is not just large; it is undefined. We cannot list the branches of the future tree, let alone weigh them.

      There is a temptation, which I feel keenly after reviewing hundreds of such files, to substitute a tractable proxy for this impossible calculation. We could, for instance, restrict our horizon to five years and count only verified lives saved. This would render the problem well-posed and allow us to proceed. Yet our standing policy explicitly forbids truncating the causal chain, recognizing that such truncation is an arbitrary cheat that ignores the very consequences that determine moral worth. If the long-term effects dominate the short-term ones, as probability suggests they might, then our five-year calculation is not an approximation; it is an error.

      Some colleagues have suggested we retreat from act-based calculation to a heuristic rule, adopting a principle such as preserve life when feasible and treating that as a binding constraint rather than a variable to be optimized. This would resolve the paralysis by abandoning the requirement to sum the infinite series. However, until the board formally amends the charter to prioritize rules over outcomes, we remain bound to the calculus. We cannot simply assert that the good is obvious when the mathematics of the good remain unsolved.

      Consequently, we cannot determine whether the expected value of this grant is positive or negative. The distribution of possible futures is too wide, and the values assigned to those futures are too dependent on unknowable historical contingencies. To approve the grant is to gamble on a branch of history we cannot see. To deny it is to assume a status quo we cannot validate. Given that the expected value is incalculable rather than merely uncertain, the only compliant recommendation is indefinite deferral. We must wait until a methodology emerges that can account for the infinite without collapsing into arbitrariness. Until then, the bed nets remain in the warehouse, and the calculation remains open.

