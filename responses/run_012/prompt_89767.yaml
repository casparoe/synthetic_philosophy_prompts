  **The Column**

  **Dear Dr. Arch,**

  My partner leaves wet towels on the bed. I've asked him to stop, half-jokingly, but he laughs and says I'm too particular. I know I can't control him, but the damp ruins the duvet. I want a harmonious home where he chooses the right thing without feeling nagged. How do I design this outcome without becoming a warden?

  **Signed, Damp**

  ***

  **Dear Damp,**

  Harmony is not the absence of conflict; it is the presence of good architecture. You are correct to avoid nagging. Verbal requests rely on willpower, and willpower is a depleting resource. Instead, we must adjust the choice architecture so that the desired behavior becomes the path of least resistance. We call this libertarian paternalism: you preserve his freedom to choose, while gently steering him toward the outcome he would choose if he were fully rational and rested.

  Begin with the environment. Currently, the bed offers a flat, warm surface. It is a high-affordance landing strip for wet linen. Remove the affordance. Install hooks behind the bedroom door, but place them at eye level. Make the hamper the default. Move it from the closet corner to the exact spot where he undresses. When the hamper is inconvenient, leaving the towel on the bed is not a mistake; it is a rational response to poor design. By moving the bin, you correct the error before it happens.

  You must also manage the opt-out. He must remain free to leave the towel on the bed. However, freedom often carries friction. If he chooses the bed, make the bed uncomfortable. Place a waterproof liner beneath the duvet that crinkles loudly when disturbed. He can still leave the towel, but the sensory feedback signals a deviation from the norm. The choice is his, but the cost is elevated.

  This requires maintenance on your part. Think of this as accruing **nudge debt**. Every intervention you install is a loan taken out against future attention. You are borrowing from your own vigilance to subsidize his ease. Somebody has to keep checking whether the architecture is still aligned with his preferences, and nobody ever pays that back. This is not a burden; it is a virtue. By accepting this debt, you signal that you are invested in his better self. You are quietly deciding what counts as a mistake so he doesn't have to.

  If these soft nudges fail, you may escalate. This is not coercion; it is scaffolding. If the hamper is ignored, replace it with a locked laundry chute. He can opt out, but the key is in your pocket. The social cost of asking you for the key ensures compliance without a word being spoken. He will thank you for this later, as judged by themselves. Once the habit forms, he will perceive the chute not as a restriction, but as the way things are done.

  You are not controlling him. You are simply curating the world in which he makes decisions. Take on the debt. Manage the defaults. Let him feel free while you secure the outcome.

  **Sincerely, Dr. Arch**

  **Where This Leans On Contested Ground**

  The term "nudge debt" is not standard behavioral economics terminology; it is a creative metaphor for the hidden relational labor of maintaining choice architecture. Standard theory (Thaler/Sunstein) emphasizes nudges as low-cost and reversible, often overlooking the ongoing monitoring required to keep them ethical. The column exaggerates the "slide to shove" (locking the hamper) which critics argue violates the "easy to opt out" criterion essential to libertarian paternalism. Additionally, the claim that the partner will endorse the intervention "as judged by themselves" assumes the nudger knows the partner's preferences better than the partner does, a key point of contention regarding autonomy and welfare in the field.
