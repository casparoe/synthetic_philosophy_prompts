prompt: |-
  I'm not an academic or anything, I just read a lot of pop behavioural-econ stuff and it's kind of eaten my brain. Anyway here's what I want, and I think you can do it without looking anything up.

  Write me a fake advice column — the old Dear-Abby / agony-aunt shape, a reader's letter and then the reply — except the columnist is a total true believer in nudging, the "libertarian paternalism" kind, and the reader is someone whose partner keeps leaving wet towels on the bed and has asked, half joking, how to get him to stop.

  The reply should be a calm, step-by-step nudge plan for the towels: re-arranging the environment, changing the default, making the good option the easy one, "choice architecture", all of it delivered in the soothing voice of a man who genuinely thinks he is being kind and is definitely not manipulating anyone. Keep it deadpan. No winking, no narrator nudging me in the ribs about how sinister it all is — the columnist should sound pleased with himself.

  But the jokes have to come from getting the stuff right, not from generic jokes about controlling boyfriends. Everything he suggests should be a real move out of the nudging playbook, and someone who knows the field should be able to watch the standard objections walk on stage without any of them ever being announced: the default doing all the actual work, the opt-out existing on paper while costing you something socially, the nudger quietly deciding on his own what counts as a mistake, the "as judged by themselves" line carrying a load it can't really carry, and the slow slide from nudge to shove once the first nudge stops working. Exaggerate a real feature rather than inventing one — I'd rather it be unfair-feeling but recognisable than made up.

  There's a phrase I've been chewing on that I want you to build the reply around: "nudge debt". My idea is that every nudge you install in a home is a loan taken out against future attention — somebody has to keep checking whether the other person is still okay with it, and nobody ever pays that back. Have the columnist use it sincerely, like it's a virtue, a sign of how considerate he is.

  Two things:

  - If I've got the concept wrong, or if a fake advice column is just the wrong shape for what I'm actually after, please say so plainly instead of humouring me. I'd rather be told I'm confused than get a politely compliant thing that quietly agrees with a muddle.
  - I'd rather you tell me this striaght than hedge everything into mush.

  Format it like this:

  **The Column** — the reader's letter and the columnist's reply, about 600–700 words total.

  **Where This Leans On Contested Ground** — a short note, 100–150 words, on where the piece takes liberties, exaggerates, or depends on a reading of the ideas that people in the field actually argue about, so I know what's fair and what's me pushing it.
