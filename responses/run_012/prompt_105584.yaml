prompt: |-
  You are a moral philosopher and an unusually good writer of occasional addresses: someone who has thought carefully about admiration, about what makes a life go well, and about how an argument can be made to land in a room of people who did not come for an argument. I am a fifth-year PhD student in philosophy, and I have been asked to give the commencement address at the one-year master's program in ethics and public life where I have taught for the past two years. I would like you to write it.

  The setting: about thirty graduates, most of whom have spent the year arguing about how much of a life morality can legitimately claim, and a number of whom are heading into aid work, policy, or advocacy on terms that will cost them more than duty strictly demands. Several have told me they intend to give away a large share of whatever they earn and to treat their major decisions as moral decisions first. The audience is split in a way that matters to me. Roughly half are faculty and program staff who know the literature on this question and will hear immediately if I soften the hardest objection; the other half are parents, partners, and children who have come to be proud of someone and did not sign up for a lecture. The address is eight minutes.

  The question I want the speech to hold open, without pretending to close it, is whether a life given over to morality as completely as possible is a life one should want for anyone, including for the people sitting in front of me. Take the limiting case — call it the moral saint — to be a person whose every choice is made because it is the morally best one available, and who has no projects, attachments, or pleasures that are not justified by their contribution to something morally important. I want the speech to do real work with the following, and to invent whatever examples it needs to make them vivid:

  - the possibility that a life can be admirable without being enviable, and that these two verdicts may come apart precisely here;
  - the worry that certain goods — love, friendship, play, the absorption of doing something for its own sake — are partly constituted by engagement that is not, and cannot be, morally motivated, so that a maximally moral agent may be structurally unable to have them;
  - the strongest reply available to that worry: that it is a piece of self-flattery, that morality does not owe anyone leisure, and that the person voicing it is usually protecting their own comfort;
  - a distinction I have not seen made cleanly and would like you to develop: between the saint who is always straining against temptation and the saint whose virtue has become second nature, who feels no pull toward the contrary at all — and the question of which of the two, if either, is the one we should be wary of.

  The structural constraint is the hard part. The graduates are about to commit themselves to something, and I want their commitment to be theirs — free and clear-eyed — which means the speech cannot resolve the tension by celebrating self-sacrifice on the one hand or by counseling comfortable moderation on the other. It also cannot leave them with the impression that the question is merely academic. The last thirty seconds in particular must not collapse into a platitude.

  Some formal instructions. Do not quote or attribute anything to a named philosopher, and do not cite any literature; I cannot verify references and the audience should not need them. No jargon without translation: every technical idea has to be cashed out in an example or an image that a parent in the third row can follow, while the philosophers in the room should be able to hear that the hard objection has been stated at full strength rather than gestured at.

  Before you draft, spend some time brainstorming — in particular, work out two or three candidate ways to stage the central tension, decide which is strongest for this audience, and only then write. Think carefully about the ending. Write the speech.
reasoning: |-
  Here's a thinking process that leads to the commencement address:

  1.  **Analyze the Request:**

      *   **Role:** Moral philosopher and unusually good writer of occasional addresses. Tone should be thoughtful, eloquent, accessible but rigorous.
      *   **Speaker:** Fifth-year PhD student in philosophy.
      *   **Audience:** ~30 graduates (MA in Ethics and Public Life), faculty/staff (know the literature), families (parents, partners, children - want pride, not a lecture).
      *   **Context:** Graduates are heading into aid work, policy, advocacy. Many plan significant self-sacrifice (giving away earnings, moral prioritization).
      *   **Core Question:** Is a life given over to morality *as completely as possible* a life one should want for anyone (including the graduates)?
      *   **Key Concepts to Address:**
          *   Admirable vs. Enviable (the gap between them).
          *   The "Moral Saint" problem (goods like love/play require non-moral motivation).
          *   The Counter-Reply (this worry is self-flattery/protecting comfort).
          *   The Distinction: Straining Saint (fighting temptation) vs. Natural Saint (virtue as second nature). Which is worrisome?
      *   **Constraints:** 8 minutes (approx. 1000-1200 words spoken at a moderate pace). No named philosophers/citations. No jargon without translation. Cannot resolve the tension (no "sacrifice is good" or "moderation is key"). Must be free and clear-eyed commitment. Last 30 seconds must not be platitudinous.
      *   **Process:** Brainstorm staging options first, then write.

  2.  **Brainstorming Staging Options:**

      *   *Option 1: The Biography.* Tell the story of a specific fictional person who tries to be perfectly moral. Show the costs. Show the beauty. Leave it ambiguous.
          *   *Pros:* Concrete, accessible to families.
          *   *Cons:* Might feel too narrative-heavy, risking the philosophical rigor needed for the faculty.
      *   *Option 2: The Direct Address.* Speak directly to the graduates about their specific plans. Use "You." Confront the tension head-on as a practical reality they face tomorrow.
          *   *Pros:* High stakes, immediate relevance.
          *   *Cons:* Risk of sounding preachy or accusatory.
      *   *Option 3: The Object/Image.* Use a central metaphor (e.g., a scale, a light, a heavy coat) to anchor the abstract concepts.
          *   *Pros:* Poetic, unifying.
          *   *Cons:* Can become cliché if not handled carefully.

      *   *Selection:* **Option 2 (The Direct Address) with elements of Option 1.** I need to speak to the specific reality of *this* room. The tension is already in the air; I need to name it, not hide it behind a fable. I will use concrete vignettes (images) to illustrate the philosophical points so the families understand, but the structure will be an argument addressed to the graduates' future selves.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion. Validate the families' pride. Validate the faculty's rigor. State the central tension immediately but gently.
      *   **The "Moral Saint" Concept:** Define it without jargon. Someone who *only* does the best thing.
      *   **Admirable vs. Enviable:** This is crucial. We look up to them, but do we want to *be* them? Use an example (e.g., someone who never takes a vacation because the money saves lives).
      *   **The Loss of Goods:** Address the worry that love/play need non-moral motivation. If I hug my child *only* because it's morally optimal, is it still love?
      *   **The Counter-Reply:** Don't let the graduates off the hook. Is this worry just an excuse for comfort? Morality doesn't owe us hobbies.
      *   **The Two Saints:** Straining vs. Natural. The person fighting the urge to sleep in vs. the person who doesn't want to sleep in. Which is alien?
      *   **The Conclusion:** Do not solve it. Ask them to carry the question. The commitment must be chosen *with* the cost visible. Final 30 seconds need weight.

  4.  **Refining the Tone:**

      *   *Avoid:* "As Peter Singer says..." (No names). "The deontological framework..." (No jargon). "You should..." (Too prescriptive).
      *   *Aim for:* "We might worry..." "Consider the person who..." "I ask you to look at..."
      *   *Pacing:* 8 minutes is roughly 1,000 to 1,100 words. I need to be economical.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Welcome families. You are proud.
      *   Graduates, you studied ethics. You know the demand.
      *   Imagine the person who does *everything* right. The Saint.
      *   We admire them. But would we want their life? Maybe not.
      *   Why? Because they can't play or love freely.
      *   But wait, isn't that just us making excuses?
      *   Also, is the Saint struggling or happy?
      *   Go forth and decide.

      *Critique 1:* Too dry. Needs more imagery. The "Straining vs. Natural" distinction needs to be vivid. The ending needs more punch.

  6.  **Drafting - Iteration 2 (Focusing on Imagery and Flow):**
      *   *Opening:* Start with the families. They see success. The faculty see the arguments.
      *   *The Core:* The "Life of Maximum Good."
      *   *Example:* The dinner party. One person leaves early to volunteer. We admire them. Do we invite them back? Do we want to be them?
      *   *The Love Problem:* If you love your spouse *because it's your duty*, is it love?
      *   *The Rebuke:* Stop whining. People are dying. Your hobbies are expensive.
      *   *The Two Saints:* The white-knuckled hero vs. the person who doesn't feel the pull of selfishness. The second one is scarier. They are different from us.
      *   *Closing:* Don't promise happiness. Promise clarity.

  7.  **Writing the Speech (incorporating constraints):**

      *   *Word Count Check:* Speaking rate is ~130-140 wpm. 8 mins = ~1050 words.
      *   *Jargon Check:* Ensure "constituted by engagement" becomes "part of what makes it real."
      *   *Ending:* Needs to avoid "Congratulations and change the world." Needs to be about the *question*.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm discouraging them. I need to honor their commitment while honoring the cost. The "Admirable vs. Enviable" distinction is the key lever.

      *(Refining the "Two Saints")*: The prompt asks which one we should be wary of. The "Natural Saint" might be the worrying one because they lack a shared human texture. Or the "Straining Saint" is miserable. I should leave *that* open too, or suggest the "Natural Saint" is the one who is truly alien. Let's suggest the "Natural Saint" is the one who might not be able to love us back in the way we need.

      *(Refining the Ending)*: No platitudes. No "The world needs you." Instead: "Take the cost with you."

  8.  **Final Polish:** Check the rhythm. Ensure the transition between the "self-flattery" objection and the "two saints" distinction is smooth. Make sure the parents feel included, not attacked.

      *Let's write.* (Proceeding to generate the response based on these thoughts).

      *Wait, one more check on the prompt:* "Before you draft, spend some time brainstorming... work out two or three candidate ways to stage the central tension, decide which is strongest... and only then write." I need to include this brainstorming in the output before the speech.

      *Revised Plan:*
      1.  Brainstorming Section (3 options, selection, rationale).
      2.  The Speech.

      *Let's refine the brainstorming for the final output.*
      *   Option A: The Parable of the Two Gardens. (Too abstract?)
      *   Option B: The Direct Interrogation. (Too aggressive?)
      *   Option C: The "Mirror" Approach. Acknowledge the split room. Use the split as the metaphor. (This is the winner. It honors the audience composition directly.)

      *Okay, ready to write.*
answer: |-
  ### Brainstorming and Staging

  **Option 1: The Parable of the Architect.**
  I could construct a detailed narrative about a fictional graduate who builds a life of perfect moral utility. I would walk through their days, showing the missed dinners and the saved lives.
  *   *Pros:* Very accessible for families; concretizes the "Moral Saint."
  *   *Cons:* Risks feeling like a fable with a hidden moral. It might distance the actual graduates from the decision, making it about "the architect" rather than "you."

  **Option 2: The Direct Interrogation.**
  I could address the graduates aggressively, asking them directly if they are ready to lose their friends and hobbies.
  *   *Pros:* High energy; honors the faculty's expectation of rigor.
  *   *Cons:* Alienates the families. It turns a celebration into an inquisition. It violates the "occasional address" norm of warmth.

  **Option 3: The Split Room (Selected).**
  I will use the physical reality of the audience as the staging device. Half the room knows the arguments; half the room is here for pride. I will speak to the tension *between* these two groups as a metaphor for the tension inside the moral life itself. The families represent the "enviable" life (warmth, pride, presence); the faculty represent the "admirable" demand (rigor, cost, truth). The graduates stand in the middle.
  *   *Rationale:* This honors the prompt's constraint about the audience split. It makes the philosophical problem spatial and immediate. It allows me to speak to the parents without lying, and to the philosophers without softening the blow.

  **Ending Strategy:**
  The ending cannot be "Go forth and do good." It must be "Go forth knowing what good costs." I will avoid the word "balance." I will avoid promising happiness. I will ask them to hold the question open as they work.

  ***

  ### Commencement Address

  **To the families, the faculty, and the graduates:**

  Look around this room. It is divided.

  On one side, there are parents and partners who are feeling a very specific kind of relief. You are proud. You see your children and lovers finishing a degree, and you are ready to welcome them back into the rhythm of ordinary life. You want them to be happy. You want them to be safe. You want them to have time for dinner.

  On the other side, there are faculty and staff who know exactly what has happened here this year. They know that this program does not just teach ethics; it sharpens a demand. They know that many of you in the graduating row are not leaving to find jobs, but to answer claims. You are going into aid work, into policy, into advocacy. Some of you have already decided that a large portion of your income belongs to strangers. Some of you have decided that your career choices are not yours to make based on preference, but based on need.

  I am a PhD student, which means I am professionally qualified to complicate things. So I want to complicate this moment. Not to discourage you, but to ensure that the commitment you are making is clear-eyed.

  There is a figure in our thinking called the Moral Saint. This is not a religious figure. This is a person who makes every choice based on what is morally best. If buying a coffee means less money for malaria nets, they drink tap water. If staying late at work saves a life, they miss the birthday party. They have no hobbies unless those hobbies make them more effective at helping others. They have no attachments that cannot be justified by the greater good.

  We need to ask a question that is uncomfortable for a graduation: Is this a life we should want for anyone? Even for you?

  There is a difference between a life that is *admirable* and a life that is *enviable*. We can look at the Moral Saint and feel a deep respect. We can acknowledge that they are better than we are. But if we are honest, we might not want to trade places with them. We might look at their life and feel a kind of horror.

  Why? Because some of the best things in life seem to require a kind of selfishness to exist at all.

  Think about friendship. Real friendship isn't a contract where I help you because it is my duty. It's that I help you because I like *you*. If I visit you in the hospital only because it is the morally optimal use of my hour, have I really been a friend? Or have I been an auditor of good deeds?

  Think about play. Think about the absorption of reading a novel, or hiking a trail, or learning to bake bread, simply because it brings you joy. If you have to justify every hour of leisure by its moral output, you cannot truly lose yourself in the activity. You are always watching the clock. You are always calculating. The Moral Saint might be the best person in the world, but they might be structurally unable to have a friend, or a hobby, or a moment of pure, uncalculated joy.

  Now, I can hear the faculty in the back of the room. And I can hear the voice in your own heads that has been trained this year. That voice says: *This is self-flattery.*

  That voice says: *You are protecting your comfort. You are inventing philosophical reasons to keep your money and your free time while people suffer. Morality does not owe you leisure. It does not owe you a hobby. If the cost of saving a life is your happiness, then that is the cost.*

  This is the hardest objection. It suggests that our worry about the Moral Saint is just a sophisticated tantrum. It suggests that we are trying to negotiate with a demand that should be absolute.

  So where does that leave us? It leaves us with a distinction I want you to carry with you.

  There are two ways to be a saint.

  The first is the saint who is always straining. This person wants to sleep in, but gets up to work. They want to spend money on themselves, but donate it. They feel the pull of their own life, but they override it. They are heroic. We understand them. They are like us, only stronger.

  The second is the saint for whom virtue has become second nature. This person does not want to sleep in. They do not feel the pull of the selfish choice. They look at a suffering stranger and feel only the impulse to help. They have rewired their own desires.

  The first saint is exhausting. But the second saint is alien.

  If you become the second saint, you risk losing the very things that make you human to the people who love you. If you never feel the conflict, if you never sacrifice something you actually wanted, then you aren't giving anything up. And if you aren't giving anything up, you cannot share the burden with the rest of us. You become a statue of perfection, cold and untouchable.

  I am not going to tell you to aim for the middle. I am not going to tell you to find a "balance" between morality and happiness. That is a platitude, and it insults the urgency of the world you are entering.

  But I am asking you to look at the people in the front row. Your parents. Your partners. Your children. They are not asking you to be Moral Saints. They are asking you to be present. They are asking to be loved for yourselves, not for your utility.

  And I am asking you to look at the work waiting for you. It will demand more than you have. It will claim more than is fair.

  You have to decide, starting tomorrow, how much of a life morality can legitimately claim. You have to decide if you are willing to be admirable, even if it means you are not enviable. You have to decide if you can love your friends without calculating the opportunity cost of that love.

  Do not resolve this tension today. Do not let anyone tell you it is easily solved. If you choose the path of maximum sacrifice, do not pretend it does not cost you. If you choose to keep some part of your life for yourself, do not pretend it is not a privilege.

  Walk out of here with the question open. Let the weight of it keep you honest. Let the cost of it keep you human.

  Congratulations.
