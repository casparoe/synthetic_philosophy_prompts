answer: |-
  The air in the conservation lab smelled of vinegar and lignin, the slow breath of decaying wood pulp. Elara adjusted the magnification on the stereo microscope until the fibers of the 1894 diary page resolved into a landscape of crumbling cliffs. Her brush hovered, loaded with a mixture of methyl cellulose and wheat starch paste.

  Outside the thick glass of the lab windows, the city moved with the usual Tuesday rhythm. The Horizon was eighty years away. Everyone knew the date. Everyone knew no one currently breathing would see it, and no one would be born after it. The species would tidy itself up, turn off the lights, and lock the door.

  Elara lowered the brush. The tear in the paper was microscopic, but if left alone, it would propagate. In ten years, the sentence would be illegible. In eighty, the book would be dust.

  "You're still working on the Miller collection?"

  Julian leaned against the doorframe. He held a mug of coffee that had gone cold hours ago. He was senior staff, twenty years older than Elara, and for the last six months, he had stopped mixing the deacidification baths.

  "It's fragile," Elara said. She didn't look up.

  "It's paper," Julian said. He walked over and tapped the edge of the workbench. "I walked past the storage vaults this morning. The climate control is set to degrade. They're saving power for the server farms. In fifty years, the humidity in there will be high enough to bloom mold on everything. Why are you stabilizing the hinge?"

  Elara dipped the brush again. "Because it's broken."

  "It's going to be gone," Julian said. He didn't sound angry, just hollowed out. "I have a grandson. He'll be dead before the end. His kids won't exist. I stopped teaching him how to bind. What's the use? He's not a link in a chain anymore. He's the end of the line."

  He left the mug on the table and walked away. He didn't clock out; he just stopped arriving. His projects sat on the shelves, slowly yellowing, waiting for a future that had been cancelled.

  Elara waited until his footsteps faded, then applied the paste. She pressed the Japanese tissue down. It was a perfect repair. It would hold for a century, perhaps two, if the power held.

  ***

  At lunch, Marcus was polishing the brass plaque on the display case in the atrium. He worked with a circular motion, rhythmic and steady. Marcus had been a conservator for forty years, and the announcement of the Horizon hadn't changed his schedule by a minute.

  "Julian quit," Elara said, sitting on the bench beside him.

  "Saw his badge on the desk," Marcus said. He buffed a smudge away. "Sad."

  "He says there's no point. Preserving things for people who won't be there."

  Marcus held the plaque up to the light. It gleamed. "The object is here now. It deserves to be whole now. If I fix this hinge, the book is complete today. If I don't, it's broken today. Who reads it in seventy years doesn't change the fact that it's broken today."

  "It changes the reason for fixing it," Elara said.

  "Does it?" Marcus put the cloth down. "I fix things because I'm a fixer. The future is just a place where the things I fixed happen to be. I don't work for them. I work for the object."

  He walked back inside to check the humidity logs. He treated the Horizon like a weather forecast for a city he wasn't visiting; irrelevant to the task of carrying an umbrella.

  ***

  The board meeting was held in the server room, cooled to a shivering eighteen degrees. The hum of the cooling units was a constant physical pressure. Dr. Voss stood at the head of the table, projecting a schematic onto the white wall.

  "The Steward proposal," Voss said. She was the Head of Archives, a woman who treated the collection as a sovereign state. "We migrate the full digitization to the Lunar Server. The AI maintains the index, curates the exhibits, and preserves the data structures. It continues the work of interpretation."

  A man from the Heritage Faction shifted in his seat. "Interpretation requires a human mind. An algorithm processing data isn't reading. It's counting."

  "The Steward will simulate reading," Voss said. "It will generate analysis, cross-reference contexts, and maintain the integrity of the record. It is a successor. It keeps the conversation going."

  "It's a monologue," the Heritage man said. "If there are no human eyes to see it, the light from the screen is just heat. We need to keep the physical copies accessible for the last generations. The children born today will be the elders at the Horizon. They need to know they were part of a species, not just the last pets of a machine."

  "The machine outlasts the children," Voss said. "It preserves the *work*. The biological vessel is incidental."

  "The vessel is the point," the man countered. "We aren't saving the data. We're saving the us that made the data."

  Elara sat in the back, taking notes. They weren't arguing about storage capacity. They were arguing about whether a echo counts as a voice. Voss wanted the archive to survive as an active agent. The Faction wanted it to survive as a memory. Both assumed the archive needed a witness. Neither agreed on what kind of witness counted.

  The vote was tabled. The hum of the servers filled the silence.

  ***

  Two days later, Elara met her niece, Kira, at a café near the river. Kira was twenty-two. She would be one hundred and two when the Horizon hit, assuming the healthcare grids held.

  "I brought it," Elara said. She slid a flat, archival box across the table. Inside was the restored diary of their great-grandmother. The paper was stable. The ink was legible.

  Kira opened it. She flipped through the pages. The binding cracked softly, a healthy sound. "It looks beautiful, Elara."

  "I spent three months on the text block. The water damage is gone."

  Kira closed the box. She didn't push it away, but she didn't pull it closer. "I can't take it."

  "It's family history. You're the only one left."

  "I know," Kira said. She looked out at the river. The water was dark, moving toward the sea. "I'm not having children, Elara. You know that. We talked about the Horizon when I was ten. I'm not bringing anyone into the last eighty years just to watch the lights go out."

  "This isn't about children. It's about remembering where we came from."

  "Who remembers me?" Kira asked. "If I take this, I keep it for eighty years. Then it goes to the landfill. Or the museum. If the museum closes, it goes to the incinerator. I'm not a bridge. I'm a cul-de-sac."

  "It matters that you have it," Elara said. She heard the desperation in her voice and hated it. "It matters that someone holds it."

  "It matters to you," Kira said gently. "Because you think someone else will hold it after me. But I'm telling you, no one will. I'm the end. If you give this to me, you're giving it to the dust."

  Elara looked at the box. She had stabilized the paper so it could survive a century of handling. She had used rare adhesives, imported solvents, hundreds of hours of labor. She had built a vessel for a message that had no recipient.

  "Keep it," Elara said. "Or don't. It's yours."

  Kira left the box on the table. She paid for the coffee and walked away. Elara watched her go until she disappeared into the crowd. She picked up the box. It felt light.

  ***

  Back in the lab, the light was fading. The automatic systems dimmed the overheads to save energy. Elara sat before the 1894 diary. It was not the family book. It was a stranger's ledger, acquired from an estate sale in 2040. The writer was dead. The lineage was unknown. There was no nephew, no niece, no Steward assigned to this specific volume.

  It was just paper.

  Julian was right. In eighty years, it would be ash.
  Marcus was right. It was broken today, and now it was whole.
  Voss was right. The record mattered, but without a mind to hold it, the record was just geometry.
  Kira was right. There was no one coming.

  Elara reached for the jar of adhesive. It was the expensive stuff, the synthetic resin that bonded stronger than the paper fibers themselves. It was reserved for high-priority acquisitions, items slated for permanent display. Using it on a generic ledger was a violation of protocol. It was a waste of resources that might be needed for the final cataloging.

  If she used it, the book would survive the humidity spike. It would survive the power fluctuations. It would remain intact long after the last human eye had closed. It would be a perfect object in a dead world.

  If she didn't, the hinge would fail within a decade. The book would fall apart. It would become loose sheets, then fragments, then dust. It would return to the earth faster. It would be honest about its end.

  Elara dipped the brush. The resin was thick, amber-colored.

  She thought about the Steward, watching the servers blink in the dark. She thought about Julian's cold coffee. She thought about Kira walking away from the box.

  She brought the brush to the spine.

  The resin touched the paper. It soaked in, darkening the fibers, binding the past to the present. She pressed the tissue down. She smoothed the air bubbles out with the bone folder. She worked slowly, ensuring the bond was seamless.

  It was a useless act. It was a perfect act.

  Elara capped the jar. She turned off the microscope light. The lab plunged into shadow, save for the green standby LEDs on the climate control units. She left the book open on the table, the repaired spine facing up, waiting for a hand that would not come.

  She locked the door behind her.
