  For your craft, you must decide the sensitivity of your fictional world before writing the hinge. If High, the hinge is real, and the drama lies in the cost of switching. The tension comes from the impossibility of return. If Low, the hinge is illusory, and the drama lies in the characters resisting the function, not the history. The tension comes from the futility of resistance. Use **Contingent Lock-in** to name Situation one and **Structural Convergence** for Situation two. This distinction clarifies whether your characters are fighting history or function. It prevents you from writing a Sit 2 story with Sit 1 stakes, which creates the dissonance you feel. The term **Causal Sensitivity** allows you to calibrate the relationship between event and outcome before drafting the hinge. It forces you to ask: if I change this vote, does the world change? If yes, write Sit 1. If no, write Sit 2. This resolves the craft problem by making the causality explicit.

  Boundary cases

  Consider the QWERTY keyboard. Is it Sit 1 (locked in by early typewriter mechanics) or Sit 2 (any layout would have standardized eventually)? Historians debate this. If standardization was functionally necessary for touch-typing, it is Sit 2. If QWERTY persisted merely due to installed base, it is Sit 1. Consider the adoption of standard gauge railways. Was it contingent on early engineering choices, or did physics dictate a specific width for stability? These cases blur because switching costs exist alongside functional pressures. A practice might be contingent in origin but overdetermined in maintenance. In fiction, this boundary is where tragedy lives: characters fighting a lock-in that might actually be a convergence. If they fight function thinking it is history, they are doomed differently than if they fight history.

  Verdict

  Situation one and two are ontological opposites: one asserts the reality of small causes, the other the dominance of large structures. Situation three is epistemological, a failure of the observer, not the world. Therefore, one and two are distinct phenomena requiring different plot mechanics. Three is a warning against misreading either. You must decide if your world is sensitive or robust before writing the hinge. Do not mix them. If the hinge is real, the cost is high. If the hinge is false, the inevitability is structural. Three is simply the error of confusing the two.
