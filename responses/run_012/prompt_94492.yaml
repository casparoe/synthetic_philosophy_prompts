      *   *Section 2: Independence vs. Sure-Thing.* Explain vNM vs. Savage. Why the professor rolled his eyes (context of risk vs. uncertainty).
      *   *Section 3: Normative Status.* Is EUT dead? No. Mention Risk-Weighted Expected Utility (Buchak) as a modern middle ground. Mention the "Money Pump" argument for EUT.
      *   *Section 4: What explains Allais?* Probability weighting, not loss aversion.
