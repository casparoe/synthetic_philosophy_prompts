  8.  **Self-Correction/Check during drafting:**
      *   *Check:* Did Allais actually think people were bad at probabilities?
      *   *Correction:* No, Allais was an economist who believed the *theory* was wrong. He argued that the "psychology of choice" involves a preference for security that EUT ignores. He didn't think it was a cognitive bug; he thought it was a rational feature EUT missed.
      *   *Check:* Is it Loss Aversion?
      *   *Correction:* Definitely not. It's the Certainty Effect / Probability Weighting. Loss aversion requires a reference point shift into losses. Allais gambles are typically gains.
      *   *Check:* Intransitivity?
      *   *Correction:* Violating independence does not imply intransitivity. You can have a complete, transitive ordering that still violates independence. This is a critical distinction.

  9.  **Final Polish:** Organize with clear headings. Use bold text for emphasis. Ensure the "Settled vs. Contested" section is distinct. (Proceed to generate output based on these thoughts.)

  10. **Final Review against constraints:**
