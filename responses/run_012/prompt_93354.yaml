      *   The user wants to keep (1) and (2). If they keep (2), they must reject (4) or (5). Rejecting (5) is hard if (4) is true. So they must reject (4)'s implication that measurement failure = fact failure.
      *   *Correction:* Actually, the strongest formal objection is to (2). "Greater than" is an ordinal relation. It does not require a "unit" (cardinality) or a "zero" (ratio scale). You can say $A > B$ without knowing how much greater. The argument smuggles in cardinality requirements into an ordinal claim.

