  10. (Self-Correction on Premise 2): Does $A > B$ require a common zero? If I measure temperature in Celsius and you in Fahrenheit, we can still agree that $100C > 50C$ and $212F > 122F$. We don't need the same zero to compare magnitudes *if* we can translate. The problem is we can't translate welfare. But do we need to? If welfare is ordinal, we just need to know the ranking. The argument assumes welfare is a *quantity* in the physical sense (mass, length). That's the hidden assumption. I need to highlight that.

