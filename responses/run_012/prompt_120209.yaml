answer: |-
  **PREP SHEET: JOB TALK Q&A STRATEGY**

  **Candidate:** [Your Name]
  **Project:** Diachronic Alternative Possibilities & The Revision Requirement
  **Context:** Work-in-Progress Seminar (Mixed Audience)
  **Time:** 20 min talk / 30 min Q&A

  ---

  ### **I. STRATEGIC OVERVIEW**

  **The Stakes:** You are proposing a hybrid view: Compatibilist about *authorship* (sourcehood), Incompatibilist-ish about *answerability* (requiring alternatives), but shifting the alternatives to a diachronic window. This is high-risk, high-reward. It invites attacks from both sides (Libertarians will say it's not free enough; Compatibilists will say alternatives aren't needed at all).

  **Your North Star:** Keep returning to the **distinction between Authorship and Answerability**. If you let them collapse, you lose the room.
  *   **Authorship:** Did this come from *you*? (Synchronic/Internal)
  *   **Answerability:** Are you the proper target of *blame*? (Diachronic/Revisionary)

  **Tone:** Do not be defensive about the personal origin story. Acknowledge it briefly if asked, but pivot immediately to the structural philosophical problem it illuminated. You are not arguing for your friend; you are arguing for the *category* your friend accidentally revealed.

  ---

  ### **II. OBJECTIONS (ORDERED BY DAMAGE)**

  #### **1. The Regress Objection (The "Ultimacy" Challenge)**
  *   **Who:** The Compatibilists (Reasons-Responsiveness) & The Libertarian.
  *   **The Objection:** "You've pushed the requirement for alternatives back to $t_1$ (the time of revision). But what determines the agent's choice at $t_1$? If it was determined by her character at $t_1$, you haven't gained any freedom, you've just moved the determinism back a step. If it wasn't determined, you're a libertarian. If you say she could have revised *then*, do we need a $t_0$ for that? You face an infinite regress unless you admit some ultimate responsibility you explicitly reject."
  *   **Damage:** **Critical.** If this holds, the Revision Requirement is just a delay tactic, not a solution.
  *   **2-Minute Reply:** "I accept the regress stops at **unexamined constitutive luck**. My claim isn't that the agent must be the *ultimate cause* of her character (which is impossible), but that blame is inappropriate when the character was *opaque* to the agent. The regress stops where the agent's capacity for self-reflection meets the brute facts of their psychology. We don't blame people for what they *are*, only for what they *did* with what they are, provided they had a window to see it. The 'Revision Requirement' isn't about metaphysical ultimacy; it's about the fairness of the reactive attitudes."
  *   **Where it's Soft:** You are relying on a normative claim (fairness) to plug a metaphysical hole (determinism at $t_1$). If they press on whether the *capacity* to examine was determined, you have no answer other than "Yes, and that's compatible with blame."

  #### **2. The "Why Alternatives?" Objection (The Frankfurt Collapse)**
  *   **Who:** The Compatibilists (Frankfurt Defenders).
  *   **The Objection:** "Frankfurt cases were designed to show that alternative possibilities are irrelevant to moral responsibility *full stop*. You've granted authorship without alternatives. Why does answerability suddenly require them? If the act issues from her reasons and character (authorship), why isn't that sufficient for blame? You're reintroducing PAP by the back door without explaining why sourcehood isn't enough for the 'thick' notion."
  *   **Damage:** **High.** Undermines the core motivation of the paper.
  *   **2-Minute Reply:** "Because 'sourcehood' captures ownership, but not **opportunity**. Think of it like contract law: I can own a signature (authorship), but if I signed under duress or without reading the terms I was capable of reading, I'm not bound (answerability). Frankfurt cases show I can own the act. But blame is a social sanction that demands a fair opportunity to avoid it. That opportunity doesn't need to be at the moment of action, but it must exist in the history of the self. Without *some* alternative possibility, blame becomes merely causal management, not moral communication."
  *   **Where it's Soft:** You are shifting the definition of responsibility. Hardline compatibilists deny that "opportunity to avoid" is necessary for *any* responsibility. You need to argue that *answerability* is a distinct normative practice, not just a metaphysical status.

  #### **3. The Epistemic Access Objection (The Legal Reality Check)**
  *   **Who:** The Legal Philosopher.
  *   **The Objection:** "You require that the revision was available 'under a description the agent accepted.' How is a jury supposed to adjudicate that? We can't know what descriptions were available to the defendant five years ago. This makes responsibility theoretically coherent but legally unworkable. Are you proposing we abolish *mens rea* standards that rely on the moment of action?"
  *   **Damage:** **Medium-High.** Threatens the practical applicability of your view.
  *   **2-Minute Reply:** "I'm not proposing a new legal test for every case, but a justification for existing excuses like 'duress' or 'diminished capacity.' Courts already look at history (e.g., battered spouse syndrome). My view explains *why* we look there: we are checking for the diachronic opportunity to revise. The 'description' constraint is a philosophical limit on blame, not necessarily a new evidentiary burden. We default to the assumption that agents had the opportunity; the burden is on the defense to show the disposition was calcified or opaque."
  *   **Where it's Soft:** You are hand-waving the evidentiary problem. If your theory makes blame theoretically justified but practically unknowable, the legal philosopher will say it's useless.

  #### **4. The Determinism Smuggle (The Libertarian Attack)**
  *   **Who:** The Libertarian.
  *   **The Objection:** "You say the revision must be 'available.' If the world is deterministic, it was never available. You're just defining 'available' as 'physically possible given the past' which is false, or 'imaginable' which is too weak. You haven't escaped the actual sequence problem."
  *   **Damage:** **Medium.** You likely won't convince them, but you need to survive them.
  *   **2-Minute Reply:** "I am not claiming to solve the problem of determinism for the Libertarian. I am claiming that even *if* compatibilism is true (which I lean toward for authorship), we still need a diachronic alternative to justify the *severity* of blame. I'm offering a bridge view. I concede that if hard determinism is true, my 'availability' is conditional. But within the debate as it stands, I'm showing that even compatibilists need a diachronic outlet to justify punishment."
  *   **Where it's Soft:** You are conceding ground to the Libertarian to save the argument for the Compatibilists. This might annoy the Libertarian further, but it's the right trade-off for this room.

  #### **5. The Kantian Framework Objection**
  *   **Who:** The Kantian.
  *   **The Objection:** "You are treating the will as a temporal object subject to causal revision. But the will is noumenal. By making responsibility depend on a temporal history of revision, you've confused the empirical character with the intelligible character. Responsibility is atemporal."
  *   **Damage:** **Low/Medium.** In a mixed seminar, this is often a "agree to disagree" point.
  *   **2-Minute Reply:** "I appreciate the distinction, but my project is grounded in our actual practices of blaming and excusing, which are undeniably temporal. We excuse the young, the brainwashed, and the coerced based on their history. Even if there is a noumenal will, our *social* practice of answerability operates in time. I'm analyzing the practice, not the metaphysics of the will itself."
  *   **Where it's Soft:** You are dismissing the metaphysical depth of their position as merely "social practice." They will see this as shallow.

  ---

  ### **III. CONCESSIONS VS. HOLDING GROUND**

  **CONCEDE EARLY:**
  1.  **Metaphysical Ultimacy:** Do not claim your view gives agents "god-like" freedom to create their own character ex nihilo. Admit that constitutive luck exists. Your point is about the *management* of that luck, not the elimination of it.
  2.  **Legal Precision:** Concede to the Legal Philosopher that your "description constraint" is a philosophical idealization, not a ready-made jury instruction. Don't get bogged down in evidence law.
  3.  **The Libertarian:** Concede that if causal determinism is false in a way that breaks reasons-responsiveness, your view might need adjustment. You are arguing within the space of reasons, not physics.

  **HOLD YOUR GROUND:**
  1.  **The Authorship/Answerability Split:** This is your core innovation. Do not let them collapse these. If they say "Responsibility is one thing," you say "Our practices show it's two. We distinguish owning an act from being the target of resentment."
  2.  **The Diachronic Shift:** Do not let them force you back to synchronic alternatives (the moment of action). Insist that character is built over time, so the freedom relevant to character must be over time.
  3.  **The "Description" Constraint:** This is your shield against the "brainwashed" objection. Hold that an alternative isn't real if the agent couldn't conceptualize it.

  ---

  ### **IV. THE WEAKEST POINT (PREPARE TO DEFEND)**

  **The "Arbitrariness of the Cutoff":**
  Your theory relies on the idea that there was a time when revision was possible, and a time when it wasn't (or that the agent "never once examined" the disposition).
  *   **The Vulnerability:** How do you non-arbitrarily define when a disposition becomes "settled" enough that we stop expecting revision? Is it age? Trauma? Time?
  *   **The Defense:** "It's not a bright line, it's a burden of proof. Just as we don't know exactly when someone becomes 'intoxicated' enough to lack consent, but we still use the concept, we can judge 'calcified character' without a timestamp. The vagueness of the concept doesn't invalidate the distinction."
  *   **Preparation:** Have an example ready of a "calcified" character vs. a "negligent" one. (e.g., The lifelong bigot who never questioned his upbringing vs. the adult who had access to diverse views but chose isolation).

  ---

  ### **V. THE ONE QUESTION YOU HOPE NOBODY ASKS**

  **"Is this theory tailored to exonerate your friend?"**

  *   **Why it's dangerous:** It attacks your philosophical objectivity. It suggests the "Revision Requirement" is an *ad hoc* invention to save a specific person from blame, rather than a general principle. If you say "No," you sound defensive. If you say "Yes," you sound biased.
  *   **How to answer if asked:**
      "It's honest to say the intuition started there. Philosophy often begins with a puzzle generated by life. But the test of the theory isn't whether it saves my friend, but whether it handles the cases you're raising today—the brainwashed, the coerced, the negligent. If it only works for him, it's a bad theory. I'm asking you to test it against *your* counterexamples, not my personal stakes."
      *(Then pivot immediately):* "In fact, if my friend *had* had the opportunity to revise under a description he accepted and failed, my theory would demand I blame him. The theory cuts both ways."

  ---

  ### **VI. FINAL ADVICE FOR THE TALK**

  1.  **Don't Oversell the Friend:** Mention the motivation in the intro (30 seconds max) to humanize the project, then drop it. Let the argument stand on its own.
  2.  **Watch the Clock:** 20 minutes is very short for a two-concept distinction (Authorship/Answerability) plus a diachronic mechanism. If you run long, cut the Frankfurt history. They know it. Focus on *your* solution.
  3.  **The "Flicker" Reply:** You mentioned dissolving the flicker-of-freedom reply. Be careful here. Compatibilists love flickers. Make sure you clearly explain why a *synchronic* flicker is insufficient for *answerability* even if it secures *authorship*.
  4.  **Body Language:** When the Libertarian or Kantian speaks, lean in. Show you respect the metaphysical challenge even if you bracket it. When the Legal Philosopher speaks, nod. Acknowledge the practical constraint.

  **Good luck. The argument is strong because it respects the complexity of our actual practices rather than forcing them into a single metaphysical box. Trust the distinction.**
