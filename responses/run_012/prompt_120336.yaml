  **Credence:** 0.68 that most cited cases are **Soft**.

  **Decomposition:**

  *   **Model Fidelity (Weight 0.25):** Real-world payoffs and player sets evolve continuously, violating the fixed-structure requirement for a 'Hard' classification.
  *   **Selection Pressure (Weight 0.35):** Cases like factory farming and corporate AI races rely on agent replacement rather than static utility maximization by fixed players.
  *   **Repeated Game Structure (Weight 0.20):** The normal form of a repeated game expands the strategy space, making cooperation an equilibrium and failure a coordination issue.
  *   **Institutional Constraints (Weight 0.20):** The binding constraint is often enforcement technology rather than inherent incentive incompatibility in the payoff matrix.

  **Combination:**
  The final credence is a weighted average where the high probability of selection dynamics and model instability pushes the classification toward Soft, despite the underlying stage games often looking like Prisoner's Dilemmas.

  **Least Confident Term:**
  **Repeated Game Structure**; if the time horizon is finite or discount rates are high, the Folk Theorem collapses and the repeated game reverts to the Hard stage-game equilibrium, which would increase the Hard credence significantly.

  **You vs. Your Friend:**
  Neither of you is confused; you are analyzing different layers of the same phenomenon. Your friend (the mechanism designer) is analyzing the **stage game incentives**, which are often genuinely Hard (defection is dominant in the snapshot). You are analyzing the **system dynamics and history**, which are Soft (the trap emerges via path dependence, selection, or escalation over time). The disagreement lives in whether "Multipolar Trap" refers to the *logic of the situation* (Hard) or the *process of the lock-in* (Soft). Given your definition explicitly includes selection and repetition, your 0.8 is internally consistent, but his 0.4 correctly identifies that the *root cause* is usually a Hard incentive structure that dynamics merely exacerbate.
