answer: |-
  Branch questions

  1. Are sentences attributing beliefs or desires capable of being objectively true or false, or do they function merely to express non-cognitive attitudes? This probes whether the discourse is truth-apt without presupposing realism, addressing node (c) and (f).
  2. If truth-apt, do the states referred to exist as internal causal mechanisms analogous to posits in mature sciences, or are they like caloric? This tests the scientific analogy without naming eliminativism, addressing node (a).
  3. Does the predictive success of folk psychology entail the reality of these states, or merely the utility of the vocabulary for coping? This separates ontological commitment from instrumental value, addressing node (d).
  4. Must the creature possessing these states have language or concepts, or can pre-linguistic animals have beliefs? This distinguishes interpretivist views from biological realism, addressing node (b).
  5. Is it possible for 'belief' to lack extension while 'desire' retains it, or do they stand together? This allows for asymmetric elimination without assuming symmetry, addressing node (e).
  6. Can the argument against these states be stated without invoking the very states it denies? This checks for self-referential coherence without labeling it 'self-refutation'.
  7. Is the debate substantive, or does it dissolve upon clarifying what the predicates are doing in our language? This isolates quietist dissolutions from metaphysical claims.

  The tree

  *   Are attributions truth-apt?
      *   No → **Expressivism**
      *   Yes → Is the debate merely verbal?
          *   Yes → **Quietism**
          *   No → Do the states exist as internal causes?
              *   No → Is the vocabulary still useful?
                  *   Yes → **Instrumentalism**
                  *   No → **Eliminative Materialism**
              *   Yes → Do belief and desire stand or fall together?
                  *   No → **Partial Eliminativism (Belief)** or **Partial Eliminativism (Desire)**
                  *   Yes → Does the nature match the folk conception?
                      *   Yes → **Common-Sense Realism**
                      *   No → **Revisionary Realism**
  *   *Note:* Paths diverge based on whether predictive success validates ontology (Realism) or utility (Instrumentalism). Asymmetry branches occur after existence is denied for one attitude but affirmed for the other. The verbal dispute branch exits early to avoid metaphysical commitment. Pre-linguistic capacity questions further divide Realism into biological vs. interpretive sub-types, though these are collapsed here for brevity. Self-referential coherence checks apply primarily to the Eliminative Materialism leaf to ensure stability.

  The leaves

  1.  **Common-Sense Realism:** Beliefs and desires exist exactly as folk psychology describes. *Awkward commitment:* It must explain why neuroscience has not yet identified these discrete causal states despite decades of searching.
  2.  **Revisionary Realism:** The states exist but their nature differs radically from folk conception. *Awkward commitment:* It must claim folk are right about existence but wrong about everything else regarding the states' properties.
  3.  **Eliminative Materialism:** Belief and desire talk is false because the states do not exist. *Awkward commitment:* It must explain away its own argumentative stance without relying on the belief-states it denies.
  4.  **Partial Eliminativism (Belief):** Beliefs are eliminated, but desires remain real. *Awkward commitment:* It must justify why one propositional attitude survives neuroscientific scrutiny while its partner does not.
  5.  **Partial Eliminativism (Desire):** Desires are eliminated, but beliefs remain real. *Awkward commitment:* It must explain how cognition functions without conative states to drive action.
  6.  **Instrumentalism:** The vocabulary is useful but refers to nothing real. *Awkward commitment:* It must deny truth while relying on truth-like success to justify the vocabulary's retention.
  7.  **Expressivism:** Belief-talk is not truth-apt but expresses functional roles. *Awkward commitment:* It must account for the logical embedding of belief reports without truth conditions.
  8.  **Quietism:** The dispute dissolves once linguistic usage is clarified. *Awkward commitment:* It must claim deep metaphysical worry is just confusion while participating in the metaphysical discourse.

  *Flag:* Instrumentalism and Fictionalism are not separated here; this is not a defect but indicates they differ only in emphasis on whether users 'pretend' or 'calculate'.

  Unoccupied and unreachable

  The combination of 'Truth-apt' and 'Not Useful' is unoccupied. If belief-talk refers to nothing and aids no prediction, nobody defends retaining it; this is diagnosed as unattractive because it offers no pragmatic or ontological value. 'Partial Eliminativism (Desire)' is rarely occupied compared to Belief eliminativism. This is diagnosed as unexplored rather than incoherent, stemming from a historical focus on cognition over conation in philosophy of mind. A view claiming states exist but are not causal is also empty; this is incoherent within this logical space because existence here is defined by causal role. Finally, a Quietist who insists the dispute is verbal yet argues for elimination is unreachable; this is incoherent as it contradicts the dissolution of the question.

  Confidence and least-sure point

  I am highly confident in the separation of Realism, Eliminativism, and Instrumentalism, as these map onto clear ontological commitments regarding existence and utility. The handling of asymmetry is robust because the tree explicitly branches on whether belief and desire stand together. I am least sure about the placement of **Quietism**. It is unclear whether Quietism is a distinct metaphysical position or a methodological stance that bypasses the tree entirely. If Quietism is merely a refusal to answer the prior questions, it should not be a leaf but an exit route. Evidence that would change my mind would be a formulation of Quietism that makes a positive claim about the world (e.g., 'only language exists') rather than merely dissolving the query. Currently, it sits uncomfortably as a substantive answer to a question about substantiveness.
