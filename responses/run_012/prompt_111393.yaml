answer: |-
  **Take-Home Paper: Probability and Reference Classes**

  **Question 1**

  Consider the following case:

  A woman in her forties tests positive for a specific gene variant associated with a particular cancer. She seeks an estimate of her ten-year risk. Three statistical figures are available, each derived from a different reference class to which she belongs:
  1.  **30% Risk:** Derived from a study of carriers referred for testing specifically because of a strong family history of the disease.
  2.  **5% Risk:** Derived from the clinic's own screening programme records, which include carriers identified through routine screening regardless of family history.
  3.  **The Selection Class:** The woman belongs to the class 'carriers who discovered their status because a relative fell ill'. This is the narrowest descriptive class, but it is identical to the population sampled in (1). Consequently, the 30% figure is partially a fact about the referral protocol rather than the biological potency of the gene.

  (a) Evaluate the standard heuristics for resolving reference class conflicts (e.g., 'use the narrowest class', 'use the causally relevant class', or 'use the class defined by the outcome-generating process'). Argue whether the failure of these rules in this case indicates a temporary gap in our data or a fundamental gap in the concept of objective chance. In your answer, address whether the problem of selecting a class is structurally identical to the problem of coarse-graining event types. (14 marks)

  (b) Is the problem described in (a) the same problem as that found in self-locating belief (e.g., the Doomsday Argument), or merely a family resemblance? Specify the condition that would make them identical, and explain why that condition does or does not hold here. (6 marks)

  ***

  **Model Answer**

  **Part (a)**
  The standard heuristic—that one should always select the narrowest reference class for which reliable statistics exist—fails in this case because it conflates specificity with homogeneity. The narrowest class available is 'carriers who discovered their status because a relative fell ill'. While this description is maximally specific regarding the patient's epistemic history, it is causally heterogeneous regarding the biological risk. The 30% risk associated with this class is inflated by ascertainment bias; the relatives fell ill *because* the gene is potent in high-risk families, but the selection process ensures we only see the high-risk families. To choose this class is to choose a number that reflects the testing protocol as much as the biology. Thus, the 'narrowest class' rule collapses into circularity: it directs us to the statistic most specific to the subject, which is precisely the statistic most contaminated by the subject's selection into the sample.

  One might retreat to the 'causally relevant class' rule, preferring the 5% figure from the general screening programme. However, this merely relocates the problem. Determining which features are 'causally relevant' requires a prior probability model. We know family history is causally relevant to cancer risk, so excluding it to get the 5% figure feels like ignoring evidence. Yet including it gives the biased 30%. There is no neutral algorithm to decide which causal factors define the class without already assuming a probability distribution over those factors. This generates a regress: to pick the right class, we need the right probability; to get the right probability, we need the right class.

  This suggests the failure is not merely epistemic (a lack of data) but ontological (a flaw in the concept of chance). If objective chances were simply 'out there' in the world, waiting to be measured, the world would dictate the correct slicing of events. But the world presents only individual occurrences. The 'event type'—what counts as the same chance setup—is imposed by the modeller. This is the coarse-graining problem: a frequency only attaches to a type, and types are defined by our descriptive interests. In this case, the 'chance' of cancer is not a single scalar property of the gene, but a relation between the gene, the background environment, and the selection procedure used to identify the carrier.

  Therefore, the reference class problem reveals that single-case objective probabilities are ill-defined without a specified modelling framework. The 'gap' is in the idea that chances exist independently of the classification scheme. We cannot discover the correct class; we must stipulate it based on our predictive goals. If the goal is clinical counselling for a self-referred patient, the 5% figure (modelling the gene's effect in a general carrier population) may be more useful than the 30% figure (modelling the risk in a pre-selected high-risk population), even if the patient personally has a family history. The probability is not found; it is constructed.

  **Part (b)**
  This is a case of family resemblance, not identity. Both problems involve a sensitivity to the denominator: in the reference class problem, the denominator is the set of similar objects; in self-locating belief (SLB), it is the set of observer-moments. Both suffer from the 'choice of class' ambiguity.

  However, they become identical only if one treats the subject's indexical location ('I am this woman') as just another property defining a reference class. In SLB, the uncertainty is essentially indexical (which observer am I?), whereas in the reference class problem, the uncertainty is property-based (which properties are relevant?). Here, the woman knows exactly who she is; the uncertainty concerns the frequency of outcomes for someone *like* her. For the problems to be identical, one would have to argue that 'being this woman' is itself a sampling from a set of possible women, invoking a metaphysical stance on identity that is not required for the medical statistics. Thus, while the mathematical structure of the ambiguity is similar, the metaphysical source of the uncertainty differs.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Critique of the 'Narrowest Class' Heuristic (4 marks)**
  *   **4:** Clearly explains that narrowness does not guarantee causal homogeneity and identifies the circularity in the 30% figure (selection bias).
  *   **2-3:** Identifies the bias but fails to explain why narrowness is theoretically insufficient.
  *   **0-1:** Accepts the narrowest class rule or misses the circularity.
  *   *Typical Miss:* Candidates often argue the 30% is just 'wrong data' rather than a structural failure of the rule.

  **2. The Regress of Class Selection (4 marks)**
  *   **4:** Articulates that choosing a 'causally relevant' class requires prior probabilistic assumptions, creating a regress.
  *   **2-3:** Notes the difficulty of choosing classes but treats it as a practical rather than logical problem.
  *   **0-1:** Assumes there is a fact of the matter about the 'correct' class.
  *   *Typical Miss:* Suggesting we just need 'more data' to solve the selection problem.

  **3. Ontological vs. Epistemic Failure (4 marks)**
  *   **4:** Argues the problem is ontological (chance is not world-bound) rather than merely epistemic (lack of information).
  *   **2-3:** Distinguishes the two but remains agnostic or leans too heavily on epistemic uncertainty.
  *   **0-1:** Treats it purely as a lack of statistical power.
  *   *Typical Miss:* Confusing 'we don't know the chance' with 'there is no single chance'.

  **4. Connection to Coarse-Graining (2 marks)**
  *   **2:** Explicitly links reference classes to the slicing of event types (coarse-graining).
  *   **1:** Mentions description-dependence without using the coarse-graining concept.
  *   **0:** No mention.
  *   *Typical Miss:* Ignoring the instruction to link to coarse-graining.

  **5. Self-Locating Belief Distinction (6 marks)**
  *   **5-6:** Identifies structural similarity (denominator sensitivity) but correctly distinguishes property-uncertainty from indexical-uncertainty.
  *   **3-4:** Explains one side well but conflates the two problems or recites the Doomsday Argument without comparison.
  *   **0-2:** Fails to distinguish or claims they are identical without justification.
  *   *Typical Miss:* Writing an essay on the Doomsday Argument instead of comparing the structures.

  **Differentiation (First vs. 2:1)**
  A **First** will treat the reference class problem as a metaphysical constraint on probability theory itself, arguing that chance is relational rather than intrinsic. A **2:1** will treat it as a difficult methodological puzzle that might be solved with better causal modelling, missing the deeper implication that the 'correct' class is a stipulation, not a discovery.
