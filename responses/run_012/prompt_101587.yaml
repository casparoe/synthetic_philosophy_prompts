answer: |-
  Your hypothesis is elegant, and it diagnoses a common pathology in intellectual history: the category error. It suggests that if we simply labeled the boxes "Normative" (why we *should* have changed) and "Descriptive" (why we *did* change), the shouting would stop.

  However, when we press this hypothesis against the case of same-sex marriage (SSM), it does not fully survive. It explains the *tone* of the debate, but not the *substance* of the deadlock. Here is the breakdown of why the hypothesis leaks, the better diagnosis, and what would actually constitute progress.

  ### 1. Testing the Hypothesis: Justification vs. Causation

  Your hypothesis posits that Camp 1 (Argument) is concerned with **justification**, while Camp 2 (Interest/Honor) is concerned with **causation**.

  If this were true, Camp 1 would say, "Slavery/SSM was wrong, and we recognized the truth," while Camp 2 would say, "Slavery/SSM ended because it became too expensive." They would not be contradicting each other.

  But look at the literature on Same-Sex Marriage (e.g., works by Andrew Sullivan or Jonathan Rauch vs. sociological analyses by Philip Cohen or historical materialists).
  *   **Camp 1 (Argument)** does not merely claim that equality was the *right* reason. They claim it was the *effective* reason. They argue that the dissemination of specific narratives ("love is love," "born this way") and legal reasoning *caused* the shift in public opinion. They are making a causal claim: Ideas have causal power.
  *   **Camp 2 (Interest/Cost)** claims that these ideas were epiphenomenal smoke. They argue the shift was caused by demographic replacement (older generations dying off), the secularization of the West (lowering the cost of defying religious norms), and the transformation of marriage from an economic institution to a companionship institution (making the exclusion of gay couples seem functionally arbitrary).

  **The Verdict:** Both camps are making causal claims. Camp 1 argues for **Idealist Causation** (reasons drive history). Camp 2 argues for **Materialist Causation** (conditions drive history, reasons rationalize it).

  Your hypothesis fails because it assumes Camp 1 is doing philosophy when they are actually doing sociology. They believe that "making the moral case" is a mechanical lever that moves societies. Camp 2 denies the lever exists. Therefore, the impasse is not about labeling; it is a substantive disagreement about the **causal efficacy of normative reasons.**

  ### 2. The Better Diagnosis: A Hidden Empirical Question

  The dispute is not conceptual (what counts as an argument); it is a **hidden empirical question about preconditions.**

  The debate persists because both sides isolate a variable in a complex system and treat it as the whole engine.
  *   **The Argument Camp** ignores the question: *Why did this argument work in 2010 but fail in 1950?* The logic of equality existed in 1950. If argument alone drives change, SSM should have happened sooner.
  *   **The Interest Camp** ignores the question: *Why did the shift take the form of rights rather than mere tolerance?* If material interest alone drives change, we might have expected a shift toward civil unions or informal cohabitation without the moral revaluation of "marriage." The specific *moral* shape of the victory suggests argument mattered.

  **The Diagnosis:** The impasse is a **failure to model the interaction between reason and cost.** It is a "Necessary vs. Sufficient" confusion.
  *   Moral arguments are likely **necessary** to define the *direction* of the change (why we moved toward equality rather than segregation).
  *   Material/structural shifts are likely **necessary** to lower the *resistance* to the change (why we moved *then* and not earlier).

  The literature treats these as rival engines. In reality, argument is the steering; material cost is the fuel. You cannot steer without fuel, but fuel without steering leads to chaos, not a specific moral revolution.

  ### 3. What Counts as Progress?

  Since the question admits of a resolution (it is not merely semantic), progress will not come from a new distinction or a new case study. We have enough cases. Progress requires a **methodological shift in how we evaluate counterfactuals.**

  To break the deadlock, historians and sociologists must stop asking "Did argument or interest cause this?" and start asking: **"Under what material conditions does moral argument become causally potent?"**

  Here is the specific method that would generate progress:

  **A. The Study of "Failed Arguments"**
  Camp 1 assumes arguments work by virtue of their truth. Camp 2 assumes they never work. Progress lies in studying when moral arguments *failed* despite being logically sound.
  *   *Example:* The argument against footbinding was made for decades before it collapsed. What changed? (Often: nationalist interest, not just moral suasion).
  *   *Example:* The argument for animal rights is logically identical to the argument for human equality (sentience/suffering), yet the revolution has not occurred. Why? (The economic cost of factory farming remains too high; the social cost of veganism remains high).
  *   *Progress:* If we can identify the "activation energy" required for a moral argument to stick, we solve the dispute. We acknowledge argument is the spark, but interest is the oxygen.

  **B. The "Cost of Virtue" Metric**
  We need a way to measure the social and economic cost of holding the "progressive" view over time.
  *   In the SSM case, the cost of supporting gay marriage dropped precipitously between 1990 and 2010 (loss of job, social ostracization, religious censure).
  *   *Hypothesis:* Moral revolutions occur not when the argument is perfected, but when the **cost of accepting the argument falls below the cost of rejecting it.**
  *   In SSM, corporate interest (access to talent/markets) and secularization lowered the cost of acceptance. The argument provided the *language* for the shift, but the cost structure permitted it.

  **C. Distinguishing "Conversion" from "Replacement"**
  A major empirical confusion in the SSM debate is whether minds changed or people changed.
  *   Did existing voters hear an argument and change their minds? (Supports Camp 1).
  *   Did older voters die and get replaced by younger voters who were socialized differently? (Supports Camp 2).
  *   *Progress:* Longitudinal data exists to settle this. (Evidence suggests a mix: significant within-cohort conversion *plus* replacement). Acknowledging this hybrid mechanism dissolves the purity of both camps.

  ### 4. Conclusion

  Your hypothesis—that the sides are asking different questions—is the most charitable reading of the literature, but it is too generous. They are asking the same question ("What moved the stone?") and disagreeing on the physics.

  The impasse survives because admitting the other side is partially right threatens the identity of the disciplines involved. Philosophers want reasons to have power; Sociologists want structures to have power.

  **The Way Out:**
  The question admits progress, but only if we stop treating "Moral Argument" as a disembodied force. We must treat it as a **technology.** Like any technology, its efficacy depends on the infrastructure.
  *   **Progress looks like this:** A model that predicts moral change based on the intersection of *normative coherence* (the quality of the argument) and *structural receptivity* (the cost of adoption).

  If you return to the dispute with this framework, you can tell Camp 1: "Your argument was the map, but it didn't move the car." You can tell Camp 2: "The car moved, but it didn't drive itself off a cliff; it followed the map."

  The dispute resolves not by choosing a side, but by recognizing that moral history is the history of **when reasons became affordable.**
