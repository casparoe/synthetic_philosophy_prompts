answer: |-
  Dear Colleague,

  I have been thinking over your proposal to resolve Fitch's paradox by denying that knowledge is closed under conjunction, specifically by rejecting the agglomeration principle that if one knows p and knows q, one knows their conjunction. It is an attractive maneuver on its face, particularly given the independent traction of the lottery and preface paradoxes, which suggest that rational belief and perhaps even knowledge do not always aggregate across conjunctions. However, I must be direct about the difficulties this response faces, sorting them from the formally fatal to the merely dialectically awkward, because I suspect you will prefer a clear assessment of the costs to a reassuring but misleading optimism.

  The most decisive consideration against this response is a formal one, and it concerns the specific logical machinery Fitch's derivation actually employs. You suggest that giving up agglomeration loosens the grip of the proof, but the derivation does not rely on inferring knowledge of a conjunction from knowledge of its conjuncts; rather, it relies on the reverse direction, inferring knowledge of the conjuncts from knowledge of the conjunction. The proof proceeds by assuming for reductio that it is possible to know the proposition p and it is not known that p. From the assumption that this conjunction is known, the derivation uses the distribution of knowledge over conjunction to conclude that p is known and it is known that p is not known. It is this elimination rule, not the introduction rule you propose to deny, that generates the contradiction when combined with factivity. Consequently, denying agglomeration leaves the derivation entirely intact, as the proof never attempts to agglomerate separate pieces of knowledge into a conjunction. Even if we consider your question about weaker resources, such as closure under known entailment, the situation does not improve for the anti-realist. Since the conjunction p and not known p entails p, closure under known entailment yields the same distribution result that the conjunction rule provides. To block the derivation, you would need to deny that knowledge distributes over conjunction or is closed under known entailment, which is a much stronger and more costly denial than the one you proposed.

  If we adjust your proposal to target the correct rule, denying distribution or closure under entailment, we encounter the second most decisive consideration, which concerns the viability of the resulting epistemic logic for semantic anti-realism. The knowability principle was intended to support a robust conception of truth as epistemically constrained, but a notion of knowledge that does not distribute over conjunction or known entailment is arguably too weak to do the required semantic work. If an agent can know a conjunction without knowing its parts, or know a premise without knowing its obvious logical consequences, the connection between knowledge and truth becomes tenuous. Anti-realism typically relies on the idea that truth is what is verifiable or knowable in principle, but if the logic of knowability is non-normal to the degree required to block Fitch, it becomes difficult to explain how this notion of knowledge grounds a theory of meaning. You would be left with a knowability principle that is formally consistent but philosophically inert, insulating the principle from refutation only by draining it of the explanatory power that motivated it in the first place.

  Moving to the intuitive and linguistic considerations, which are significant but less fatal than the formal mismatch, we find a mixed picture that ultimately weighs against the response. You are quite right that our ordinary judgments support the failure of agglomeration in cases like the lottery, where one can know of each ticket that it will likely lose without knowing the conjunction that all tickets will lose. However, this intuitive support does not transfer to the failure of distribution. Our linguistic practices strongly support the claim that if someone knows that p and q, they know that p. To deny this is to fly in the face of standard knowledge ascriptions and requires a revisionary semantics that goes well beyond the modest adjustment needed for the lottery case. Thus, while the denial of agglomeration is independently motivated, it is irrelevant to Fitch, and the denial of distribution which is relevant is not independently motivated. This suggests that the move does not dispose of the paradox by illuminating the nature of knowledge, but merely relocates the puzzle to the question of why knowledge should fail to distribute in the specific case of Fitch conjunctions while succeeding everywhere else.

  Finally, there are the dialectical considerations regarding the ad hoc nature of the response. A defender of this line should concede that blocking the derivation by restricting the logic of knowledge looks suspiciously like a technical fix designed solely to save the knowability principle from a counterexample. Unlike rival treatments, such as restricting the knowability principle to basic propositions or accepting a tension between truth and knowability, this approach does not predict new phenomena or offer a deeper understanding of the epistemic condition. It predicts only that the proof will not go through, which is a minimal requirement for any solution. If the response were merely awkward, one might tolerate it, but because it targets the wrong logical rule to solve the problem, and the correct rule is too central to the concept of knowledge to abandon, the response appears ad hoc in the pejorative sense. It saves the letter of the knowability principle by violating the spirit of the epistemic logic that gives it content.

  To answer your final question plainly, this response does not leave the knowability principle exposed to Fitch's derivation only because it fails to engage with the derivation's actual mechanics; if corrected to engage with them, it exposes the principle to the charge of being trivial. The response has not quietly insulated the knowability principle in a defensible way; rather, it has insulated it by changing the subject from knowledge to something weaker that does not deserve the name. This is a defect in the response, not a feature of what a defended principle looks like. A successful defense should clarify how truth and knowledge coexist, not sever the logical links that make knowledge a normative standard for truth. I fear that without a more substantial revision to the knowability principle itself, rather than the logic of knowledge, the paradox remains a potent challenge to the anti-realist ambition.

  Yours sincerely,

  A Friend
