answer: |-
  Here is a conceptual map of the claim 'Double effect is just a rationalisation for letting people die', broken down into the distinct philosophical readings you requested. This is designed to be brought directly into your seminar.

  ### I. The Menu of Claims

  #### (a) The Psychological Claim
  *   **Assertion:** The Doctrine of Double Effect (DDE) does not describe a genuine moral principle. Rather, it is a post-hoc intellectual construction invented to justify pre-existing, non-rational intuitions (e.g., a visceral aversion to personal violence). We feel the Footbridge case is wrong first; we invent DDE to explain why.
  *   **Notion of Intention:** *Folk-psychological attribution.* Intention is treated as a label we apply to actions after we have already judged them, rather than a mental state that guides action.
  *   **Philosophical Status:** **Substantive but defensible.** This is an empirical claim about moral cognition (compatible with Jonathan Haidt's social intuitionism or Joshua Greene's dual-process theory). It does not prove DDE is false, only that it is not the *source* of our judgements.
  *   **Commitments to Standard Cases:**
      *   *Switch:* We judge it permissible; DDE is recruited to confirm this.
      *   *Footbridge:* We judge it impermissible; DDE is recruited to explain this.
      *   *Terror vs. Tactical:* We judge Terror worse; DDE rationalises the distinction.
      *   *Craniotomy:* We feel uneasy; DDE provides a vocabulary to forbid it.
      *   *Loop:* We are confused; DDE fails to generate a stable intuition because our psychology is conflicted.
  *   **Relation to 'Letting Die':** Suggests DDE is a story we tell ourselves to feel comfortable about the deaths we cause (or fail to prevent).

  #### (b) The Conceptual Claim
  *   **Assertion:** The distinction between 'intended' and 'merely foreseen' consequences cannot be drawn in a principled way. If you foresee a death as certain or highly probable, you intend it in the relevant sense. Alternatively, in cases like the Loop, the 'means/side-effect' distinction collapses because the death is causally necessary for the good outcome.
  *   **Notion of Intention:** *Plan/Means.* Intention is defined by what is included in the agent's plan as a step or a necessary condition for success.
  *   **Philosophical Status:** **Substantive and contested.** This is the 'closeness problem' objection (often associated with Quinn or Thomson). It attacks the coherence of the DDE's central distinction.
  *   **Commitments to Standard Cases:**
      *   *Switch:* Permissible (death is not a means).
      *   *Footbridge:* Impermissible (death is a means).
      *   *Terror vs. Tactical:* The distinction collapses. If civilians must die for the mission to succeed (e.g. to prove the bomb works or to clear the area), the Tactical bomber also intends their death.
      *   *Craniotomy:* Impermissible (crushing the skull is a means to delivery).
      *   *Loop:* Impermissible. The one person's body is used as a brake; their death (or presence) is a means to stop the trolley. DDE fails to distinguish Loop from Switch.
  *   **Relation to 'Letting Die':** If the distinction is incoherent, DDE is a linguistic trick. It allows agents to claim they are 'letting die' (side-effect) when they are actually killing (means).

  #### (c) The Moral Claim
  *   **Assertion:** Even if the distinction between intended and foreseen consequences can be drawn, it carries no moral weight. The permissibility of an act depends on outcomes (consequentialism) or rights violations, not the agent's mental state. To forbid the Footbridge case while permitting the Switch is irrational if the outcome is identical.
  *   **Notion of Intention:** *Motive/Aim.* The claim asserts that the agent's aim is morally irrelevant compared to the victim's right not to be harmed or the total utility produced.
  *   **Philosophical Status:** **Substantive.** This is the standard Consequentialist critique (e.g., Bentham, Mill, Singer). It accepts DDE might be coherent but denies it is normative.
  *   **Commitments to Standard Cases:**
      *   *Switch:* Permissible (saves net lives).
      *   *Footbridge:* Permissible (saves net lives). To say otherwise is to 'let people die' out of squeamishness.
      *   *Terror vs. Tactical:* Morally equivalent. Both kill civilians. Both are permissible if they save more lives, or impermissible if they do not.
      *   *Craniotomy:* Permissible if it saves the mother (one dies either way, save the one who can live).
      *   *Loop:* Permissible (saves net lives).
  *   **Relation to 'Letting Die':** This reading most directly supports the student's line. It asserts that adhering to DDE (e.g., refusing to push) is actively choosing to let five people die to preserve one's own moral purity.

  #### (d) The Explanatory Claim
  *   **Assertion:** The DDE does no independent work. Cases are actually decided by the 'proportionality' condition (the good must outweigh the bad). The intention condition is redundant; if the good is great enough, we call the death 'foreseen'; if not, we call it 'intended'.
  *   **Notion of Intention:** *Evidentiary.* Intention is merely a proxy for calculating the gravity of the harm.
  *   **Philosophical Status:** **Substantive but defensible.** This suggests DDE is a disguised form of proportionality calculus.
  *   **Commitments to Standard Cases:**
      *   *Switch:* Permissible because 5 > 1.
      *   *Footbridge:* Impermissible not because of intention, but because pushing violates a stronger right (direct assault) which outweighs the utility.
      *   *Terror vs. Tactical:* Terror is disproportionate (killing civilians rarely achieves military goals efficiently); Tactical is proportionate.
      *   *Craniotomy:* Permissible only if the proportionality is met, regardless of intention.
      *   *Loop:* Permissible if proportionality holds.
  *   **Relation to 'Letting Die':** DDE is a smokescreen. When we say 'we didn't intend it', we really mean 'the outcome was worth it'. If we decide it wasn't worth it, we retroactively say 'we intended it'.

  #### (e) The Radical/Ideological Claim
  *   **Assertion:** DDE is a piece of moral ideology used by powerful institutions (states, churches, militaries) to license the killing of the innocent while maintaining a veneer of righteousness. It allows agents to cause harm without accepting moral responsibility.
  *   **Notion of Intention:** *Strategic Labelling.* Intention is a legalistic or theological category manipulated to evade accountability.
  *   **Philosophical Status:** **Critical.** This is a political or critical theory critique (e.g., feminist ethics or critical legal studies). It focuses on the social function of the doctrine rather than its logical validity.
  *   **Commitments to Standard Cases:**
      *   *Switch:* A toy example that distracts from real power dynamics.
      *   *Footbridge:* Irrelevant to institutional violence.
      *   *Terror vs. Tactical:* The core target. 'Tactical bombing' is a label used to excuse the mass death of civilians (Terror) by re-describing it as 'collateral damage' (Double Effect).
      *   *Craniotomy:* Historically used to enforce religious doctrine over women's bodily autonomy.
      *   *Loop:* Irrelevant.
  *   **Relation to 'Letting Die':** DDE rationalises 'letting people die' by reframing killing as 'allowing to happen'. It permits the powerful to let the vulnerable die (collateral damage) without guilt.

  ---

  ### II. Structural Questions regarding the Doctrine

  To unpack the student's remark fully, you must also clarify how the DDE is being formulated in your seminar. The strength of the 'rationalisation' charge depends on this.

  **1. Necessary, Sufficient, or Evidentiary?**
  *   **Traditional Formulation:** The four conditions (act itself good/neutral, intention good, means distinct from end, proportionality) are **jointly necessary** conditions for permissibility. If one fails, the act is forbidden.
  *   **The 'Rationalisation' Vulnerability:** If the conditions are necessary, the doctrine is rigid. Critics argue agents manipulate the 'intention' condition to make a forbidden act permissible. If the conditions are merely **evidentiary** (clues to permissibility), the charge of rationalisation is weaker, as the doctrine admits it is not a strict algorithm.
  *   **Student's Implication:** The student likely assumes the traditional formulation (necessary conditions), arguing that agents tweak the 'intention' box to tick it, thereby rationalising the outcome.

  **2. The 'Closeness' of the Causal Chain**
  *   **The Issue:** Does the doctrine require a condition that the bad effect must not be 'too close' to the means? (e.g., In the Loop case, hitting the person is the means to stop the trolley. Is their death also a means?)
  *   **Does it do work?**
      *   *Yes:* It attempts to save the DDE from the Conceptual Claim (b) by ruling out cases where the causal chain is too tight (like Loop or Craniotomy).
      *   *No:* Critics argue 'closeness' is vague and ad hoc. If 'closeness' is doing the moral work, then 'intention' is doing none, supporting the Explanatory Claim (d).
  *   **Relevance to the One-Liner:** If 'closeness' is doing the work, then 'Double Effect' is a misnomer; it is actually a doctrine of 'Causal Distance'. The student's claim that it is a rationalisation gains traction if 'intention' is a placeholder for 'causal proximity' which is itself ill-defined.

  ---

  ### III. Diagnosis: What did the student mean?

  **1. Most Likely Reading:**
  The student most likely meant a combination of **(a) The Psychological Claim** and **(c) The Moral Claim**.
  *   **Why:** The phrase 'just a rationalisation' is typically used to suggest that a principle is not a genuine truth but a story we tell to make ourselves feel better (Psychological). The phrase 'for letting people die' suggests a consequentialist frustration: that adhering to the doctrine results in more deaths than necessary (Moral). They are likely arguing that we forbid the Footbridge push (letting five die) based on a spurious distinction about intention to keep our own hands clean.

  **2. Which Readings Support the Dismissive Use?**
  To use the line dismissively ('*Just* a rationalisation'), the student needs a reading that undermines the doctrine's authority.
  *   **Strongest Support:** **(a) Psychological** and **(e) Ideological**. If DDE is merely a post-hoc story (a) or a tool of power (e), it has no normative authority. It is 'just' a rationalisation.
  *   **Moderate Support:** **(b) Conceptual**. If the distinction is incoherent, the doctrine is broken, but this is a technical failure rather than a charge of bad faith.
  *   **Weakest Support:** **(d) Explanatory**. If DDE reduces to proportionality, it is not 'just a rationalisation'; it is a redundant description of a valid moral calculation. This reading saves the *outcome* of the doctrine even if it discards the *mechanism*.

  **3. The Ambiguity of 'Letting Die'**
  Be prepared to ask the student what they mean by 'letting people die'.
  *   **Interpretation A:** They mean DDE forbids saving the five (Footbridge), thus rationalising *letting the five die*. (Supports Moral Claim (c)).
  *   **Interpretation B:** They mean DDE permits killing the one (Switch/Tactical), but describes it as 'letting die' (side-effect) to excuse the killing. (Supports Ideological Claim (e)).
  *   **Interpretation C:** They are using 'killing' and 'letting die' interchangeably to mean 'causing death'. (Sloppy terminology, but common).

  ### IV. Seminar Strategy

  If you wish to re-open this discussion, you might ask:
  1.  'When you say rationalisation, do you mean the doctrine is psychologically secondary to our intuitions, or that it is morally redundant?'
  2.  'Does your objection target the coherence of intention (Conceptual), or the moral weight of intention (Moral)?'
  3.  'If we removed the intention condition and kept only proportionality, would you still object, or does the intention condition specifically enable the rationalisation you fear?'

  This menu should allow you to locate the student's objection precisely without getting bogged down in defending the doctrine itself.
