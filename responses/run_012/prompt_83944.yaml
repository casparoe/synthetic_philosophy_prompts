  You have independently reconstructed a version of what political philosophers call the **Hybrid Theory of Secession**. It combines a "Primary Right" (democratic choice) with a "Remedial Right" (justice/oppression), but constrains them with a procedural requirement for negotiation.

  Your verdicts do not add up to a single absolute rule (like "always vote" or "never break borders"). Instead, they form a **decision tree** based on the nature of the union and the presence of coercion.

  Here is the principle that unifies your verdicts, the explanation for your Quebec/Catalonia conflict, the prediction for wealthy regions, and the breakdown of the machinery.

  ### The Principle: Negotiated Dissolution or Remedial Escape

  **Secession is legitimate if and only if it proceeds via one of two pathways:**

  1.  **The Partnership Pathway (Negotiated Dissolution):** The union functions as a voluntary partnership where the constitutional order (written or conventional) allows for the possibility of dissolution. In this case, a democratic mandate creates a **duty to negotiate**, but not a right to declare independence unilaterally.
  2.  **The Remedial Pathway (Last Resort):** The central state has forfeited its authority through violence, collapse, or systematic oppression. In this case, unilateral declaration is legitimate because negotiation is impossible or the state has already broken the bond.

  **Constraints (Apply to both):**
  *   **Absence of External Coercion:** The vote must not be conducted under foreign military occupation.
  *   **Subsidiarity:** If a region may leave, sub-regions within it may choose to remain.

  ---

  ### Solving the Quebec vs. Catalonia Problem

  You identified this as the pair you cannot square. Both were unilateral in the sense that the central government did not pre-agree to be bound. However, under the principle above, they fall into different categories based on the **Founding Bargain**.

  **Quebec (Partnership Pathway)**
  *   **The Clause:** *Constitutional Silence/Convention.*
  *   **The Logic:** Canada's constitution was silent on secession. The Supreme Court (1998) ruled that while unilateral secession is illegal, a clear majority on a clear question creates a *political obligation* for the rest of Canada to negotiate.
  *   **Your Verdict:** You approved of the "claim to negotiate." You did not say Quebec could have declared independence immediately.
  *   **Why it fits:** The Canadian union operates as a flexible partnership. The vote triggered the *negotiation* mechanism, not the *exit* mechanism.

  **Catalonia (Failed Partnership / No Remedial Cause)**
  *   **The Clause:** *Constitutional Prohibition + Absence of Oppression.*
  *   **The Logic:** Spain's constitution explicitly defines the nation as "indissoluble." The Constitutional Court struck down the referendum. Crucially, there was no "Remedial" justification (no state violence comparable to Kosovo/Somaliland).
  *   **Your Verdict:** You deemed the declaration wrong and Madrid entitled to void it.
  *   **Why it fits:** Because the "Partnership Pathway" was legally closed (indissoluble union) and the "Remedial Pathway" was factually unavailable (no oppression), the unilateral declaration was an attempt to break the contract without cause or process.
  *   **Addressing your worry:** You feared making the question "hostage to whatever the capital has written down." The fix is to view the Constitution not as a law that trumps democracy, but as **evidence of the terms of the association.** If you join a club with a "no exit" rule, you cannot leave unilaterally unless the club starts attacking you (Remedial). Canada's club had no exit rule, so you can negotiate exit. Spain's club did.

  **The Distinction:** Quebec was a mandate to *negotiate* within a flexible union. Catalonia was a mandate to *leave* within a rigid union, without remedial cause.

  ---

  ### Prediction: Flanders or Lombardy

  **Case:** A wealthy region, no history of oppression, believes it is subsidizing the rest of the union, wants out.

  **Prediction:**
  *   **Flanders (Belgium):** **Legitimate claim to negotiate, illegitimate to declare.**
      *   *Reasoning:* Belgium is a federal state with a complex constitutional structure that acknowledges distinct communities. It fits the **Partnership Pathway**. Flanders is entitled to a vote that mandates Brussels to negotiate terms. However, if Flanders declares independence unilaterally without an agreement, it violates the principle (similar to Catalonia).
  *   **Lombardy (Italy):** **Illegitimate to declare, limited right to negotiate autonomy.**
      *   *Reasoning:* The Italian Constitution declares the Republic "one and indivisible." Like Spain, this blocks the Partnership Pathway for full secession. Without oppression (Remedial Pathway), a unilateral declaration is illegitimate. They may negotiate for *more autonomy*, but not for exit, unless the central state consents to amend the constitution.

  **The Hard Truth of Your Principle:** Wealthy regions cannot secede unilaterally simply because they are wealthy and unhappy with subsidies. They must either convince the center to agree (Partnership) or prove they are being oppressed (Remedial).

  ---

  ### The Machinery: Load-Bearing Clauses

  Here is the code logic for your verdicts.

  | Case | Verdict | Load-Bearing Clause | Why it triggered |
  | :--- | :--- | :--- | :--- |
  | **Scotland 2014** | **Legitimate** | `Partnership_Pathway` | London consented; process was agreed. Perfect fit for Negotiated Dissolution. |
  | **Quebec 1995** | **Legitimate** | `Partnership_Pathway` | Constitution silent; Supreme Court ruled vote = duty to negotiate. You approved the *claim to negotiate*, not unilateral exit. |
  | **Catalonia 2017** | **Illegitimate** | `No_Pathway_Available` | Constitution forbids exit (blocks Partnership); no oppression (blocks Remedial). Declaration bypassed negotiation. |
  | **Kosovo 2008** | **Legitimate** | `Remedial_Pathway` | State violence/collapse. Negotiation impossible. Unilateralism justified as last resort. |
  | **Somaliland** | **Legitimate** | `Remedial_Pathway` | Parent state collapsed/violent. Effective governance established. |
  | **Crimea 2014** | **Illegitimate** | `External_Coercion` | Vote held under foreign military occupation. Violates `Absence_of_Coercion` constraint. |
  | **Franchise** | **Residents Only** | `Affected_Party_Principle` | Only those subject to the new sovereignty should decide it. |
  | **Shetland** | **Entitled to Stay** | `Subsidiarity` | If Scotland can choose UK, Shetland can choose Scotland/UK. Nested self-determination. |

  ### Which Verdict Must You Give Up?

  If you demand a perfectly consistent logical set, you have one tension point: **The "Hostage to Capital" worry vs. The Catalonia Verdict.**

  You stated: *"Legality under the parent state's own constitution... cannot be right, given that Spain's constitution declares the unity of the Spanish nation to be indissoluble."*

  Yet you ruled Catalonia illegitimate *because* Madrid was entitled to treat it as void (based on that constitution).

  **To resolve this:** You must accept that **Constitutions define the Nature of the Union.**
  If you reject the Constitution as a valid arbiter, you must treat Catalonia exactly like Quebec (a democratic mandate requiring negotiation). If you treat them differently, you are implicitly accepting that Spain's constitutional claim to "indissolubility" carries moral weight that Canada's silence does not.

  **Recommendation:** Keep the Catalonia verdict, but refine your reasoning. Do not say "It was illegal under Spanish law." Say: **"The terms of the Spanish union, as understood by its institutions and constitution, do not permit exit without consent. Without remedial cause (violence), breaking those terms is unjust."** This shifts the weight from "Legality" to "Fairness of the Bargain."

  ### Summary for a Software Engineer

  Think of the State as a **Service Level Agreement (SLA)**.

  1.  **Scotland/Quebec:** The SLA has an undefined termination clause. Custom dictates you can file a termination request (Referendum), which triggers a negotiation period. You cannot just shut off the server (Unilateral Declaration) without the negotiation.
  2.  **Kosovo/Somaliland:** The Provider (Central State) DDoS'd the customer or went bankrupt (Violence/Collapse). The customer is entitled to migrate to a new provider immediately without negotiation.
  3.  **Catalonia:** The SLA explicitly says "No Termination." The Provider is not attacking the customer. The customer tried to shut off the server anyway. This breaches the contract.
  4.  **Crimea:** A third party held a gun to the customer's head while they clicked "Terminate." Invalid input.
  5.  **Shetland:** Microservices architecture. If the main service migrates, the sub-modules can choose to stay on the legacy stack.

  Your intuition is robust. It prioritizes **process and negotiation** over **absolute rights**, reserving **unilateral action** only for cases of **state failure**.
