answer: |-
  # STANDARD OPERATING PROCEDURE: LONG-HORIZON REGIME SURVIVAL ASSESSMENT

  **Effective Date:** Immediate
  **Applicability:** All 10/25/50-Year Survival Assessments
  **Constraint:** Analysts have 3 days. No statistical software. Arithmetic only.

  ## I. FIX THE ENTITY AND THE FAILURE MODE
  Do not assess "The Regime" vaguely. You must define the specific *unit* and the specific *end state*.
  1.  **Unit:** Is the entity the specific ruling coalition (regime change), the constitutional order (state death), or the territorial sovereignty (annexation)? Choose one. If the foundation cares about grant continuity, choose **Constitutional Order**.
  2.  **Failure Mode:** Define "Death." For a federation, is it secession of one unit or total dissolution? For a city-state, is it military occupation or loss of fiscal sovereignty?
  3.  **Current Age:** Calculate the exact age of the current order from its last foundational reset (constitution, revolution, independence).

  ## II. ASSEMBLE THE COMPARISON SET (THE REFERENCE CLASS)
  You face the "indefinite sets" problem. You are forbidden from choosing the single class that yields the desired answer. You must construct three distinct classes and report the range.
  1.  **Class A (Broad):** All sovereign entities in the relevant historical period (e.g., 1800–Present). *Purpose:* Establishes the background mortality rate of politics.
  2.  **Class B (Structural):** Entities sharing the specific governance structure (e.g., Multi-ethnic Federations, City-States). *Purpose:* Captures structural fragilities.
  3.  **Class C (Contextual):** Entities sharing the specific stressor or geography (e.g., Fiscal Crisis States, Buffer States in Contested Regions). *Purpose:* Captures immediate threats.
  4.  **Sample Size Rule:** If any class contains fewer than 10 *completed* cases (see Section III), discard it. If all three classes must be discarded, **STOP AND HAND TO DESK HEAD.**

  ## III. CALCULATE THE SURVIVAL BASE RATE
  **PROHIBITION:** Do not calculate the average lifespan of past entities. This is mathematically invalid due to censoring (entities still alive) and selection bias (obscure entities forgotten).
  **MANDATE:** Use the **Cohort Survival Method**.

  1.  **Filter for Opportunity:** To estimate survival to Year $T$ (10, 25, or 50), look *only* at entities in the class that were born at least $T$ years ago. Ignore entities born 9 years ago when calculating 10-year survival.
  2.  **Count Survivors:** Of those entities old enough to have reached Year $T$, count how many actually survived to Year $T$.
      *   *Note on Censoring:* Entities still alive today count as survivors *if* their current age exceeds $T$.
      *   *Note on Selection Bias:* Exclude entities from the set that lasted less than 5 years unless they were major powers. This removes "naming bias" (entities recorded only because they were famous failures).
  3.  **Calculate Probability:**
      $$ P(\text{Survival} > T) = \frac{\text{Count of entities in class reaching age } T}{\text{Total entities in class born before } (\text{Current Year} - T)} $$
  4.  **Handle Disagreement:** You will have three probabilities (one from each Class A, B, C).
      *   If the range (Max - Min) is ≤ 20 percentage points: Report the average.
      *   If the range is > 20 percentage points: Report the range. **DO NOT AVERAGE.** Mark this as **[DECISION REQUIRED: CLASS WEIGHTING]**.

  ## IV. JUDGE CLASS MEMBERSHIP (THE INSIDE VIEW)
  The base rate assumes the case is typical. You must now argue whether it is *atypical*.
  1.  **The Blind Historian Test:** If you removed the name of the current entity and showed an expert only the structural variables (ethnic mix, debt-to-GDP, trade dependence), would they assign it to your chosen Class without knowing the outcome? If no, the class is invalid.
  2.  **The Differentiator:** Identify exactly one factor that makes this entity *more* resilient than the class average, and one factor that makes it *less* resilient.
      *   *Constraint:* You cannot use "strong leadership" or "national will." These are post-hoc narratives. Use measurable assets: Foreign reserve levels, monopoly on violence, external guarantor treaties.
  3.  **Adjustment Cap:** You may adjust the base rate probability up or down based on these differentiators, but **not by more than 15 percentage points**. This prevents the Inside View from swallowing the Outside View.

  ## V. PHRASE THE FINAL ANSWER
  Your output must follow this template. Deviations will be rejected.
  1.  **Base Rate:** "Entities in [Class] historically show a [X]% probability of surviving to [Year T]."
  2.  **Adjustment:** "We adjust this [up/down] by [Y]% because [Specific Differentiator]."
  3.  **Final Estimate:** "The assessed probability of survival to [Year T] is [Z]%."
  4.  **Uncertainty Flag:** If the Reference Class range (Step III.4) was >20%, append: "**[DECISION REQUIRED: REFERENCE CLASS SELECTION]**. Structural class suggests [X]%, Contextual class suggests [Y]%."

  ## VI. STOP RULES (HANDOFF TO DESK HEAD)
  You must halt the procedure and escalate to me in two specific scenarios. Do not attempt to resolve these.
  1.  **The Null Set:** If no Reference Class (Broad, Structural, or Contextual) yields 10 completed cases after filtering for censoring and selection bias. *Reason:* There is no statistical ground to stand on; any number is fiction.
  2.  **The Rhetoric Mask:** If the Inside View Adjustment (Step IV.3) requires you to move the probability by the full 15% cap *and* the differentiator relies on a variable not present in the historical data of the Reference Class (e.g., "nuclear deterrent" in a pre-1945 class). *Reason:* You are not adjusting a base rate; you are inventing a new category. This is rhetoric wearing the costume of a base rate.

  ***

  # CASE RUNS

  ## CASE 1: The Large Multi-Ethnic Federation
  **Entity:** 70-year-old Federal Republic.
  **Stress:** High debt-to-GDP, rising periphery nationalism.
  **Failure Mode:** Constitutional Dissolution (Secession of >2 major units).

  **1. Entity Fix:**
  *   Unit: Constitutional Order.
  *   Current Age: 70 Years.

  **2. Comparison Set:**
  *   **Class A (Broad):** All sovereign states since 1800. (N > 100).
  *   **Class B (Structural):** Multi-ethnic Federations since 1800. (N = 14 completed cases).
  *   **Class C (Contextual):** States with Debt >90% GDP + Ethnic Fragmentation. (N = 12 completed cases).

  **3. Base Rate (Cohort Survival):**
  *   *Target:* 25-Year Horizon (Total Age 95).
  *   **Class A:** 85% of states survive 25 more years once they reach age 70.
  *   **Class B:** 30% of Multi-ethnic Federations survive 25 more years once they reach age 70. (Most fracture between years 60–90).
  *   **Class C:** 25% of high-debt fragmented states survive 25 more years.
  *   *Disagreement:* Range is 60% (85% vs 25%). **Flag: [DECISION REQUIRED: CLASS WEIGHTING].**

  **4. Class Membership:**
  *   *Blind Historian Test:* Pass. Without the name, this entity fits Class B and C perfectly.
  *   *Differentiator (Resilience):* Integrated economic grid (hard to sever).
  *   *Differentiator (Fragility):* No external security guarantor for the union.
  *   *Adjustment:* +10% (Economic grid is a measurable asset).

  **5. Final Answer:**
  *   **Base Rate:** "Entities in [Structural/Contextual Classes] historically show a 25–30% probability of surviving 25 more years."
  *   **Adjustment:** "We adjust this up by 10% due to high economic integration costs."
  *   **Final Estimate:** "The assessed probability of survival to 25 years is 35–40%."
  *   **Uncertainty Flag:** "**[DECISION REQUIRED: REFERENCE CLASS SELECTION].** Broad class suggests 85% survival (stability bias), but Structural/Contextual classes suggest 30%. Recommendation: Weight Structural/Contextual higher due to specific failure mode."

  **Desk Head Note:** This is the **unwelcome outcome**. The foundation likely intends to fund 50-year development projects assuming continuity. The procedure indicates a >60% chance of state dissolution within 25 years. Grants should be structured as short-term or hedged against fragmentation.

  ***

  ## CASE 2: The Small City-State
  **Entity:** Sovereign City-State.
  **History:** Outlived 4 regional empires (Current Age: ~150 Years).
  **Failure Mode:** Loss of Sovereignty (Annexation).

  **1. Entity Fix:**
  *   Unit: Territorial Sovereignty.
  *   Current Age: 150 Years.

  **2. Comparison Set:**
  *   **Class A (Broad):** All sovereign states since 1800. (N > 100).
  *   **Class B (Structural):** City-States (population <1M) since 1800. (N = 8 completed cases). **STOP.**
  *   **Class C (Contextual):** Buffer States in Contested Regions. (N = 15 completed cases).

  **3. Base Rate (Cohort Survival):**
  *   *Target:* 50-Year Horizon.
  *   **Class A:** 90% survival for states aged 150+.
  *   **Class B:** **NULL SET.** Only 8 completed cases. Fails Sample Size Rule (Step II.4).
  *   **Class C:** 40% survival for buffer states over 50-year horizons.
  *   *Disagreement:* Class A and C differ by 50%. Class B is unusable.

  **4. Class Membership:**
  *   *Blind Historian Test:* Fail for Class B. The fact that it outlived 4 empires makes it an outlier *by definition*. It does not belong in the "typical city-state" bucket because it survived the filter that killed the others.
  *   *Differentiator (Resilience):* Global financial hub status (deterrent via economic pain).
  *   *Differentiator (Fragility):* Zero strategic depth (military vulnerability).
  *   *Adjustment:* **STOP.**

  **5. Final Answer:**
  *   **Status:** **[DECISION REQUIRED: NULL SET / RHETORIC MASK].**
  *   **Reasoning:**
      1.  **No Usable Reference Class:** The specific class (City-States) has N < 10. We cannot generate a base rate for the specific structural risk.
      2.  **Rhetoric Mask:** To use the Broad Class (All States) ignores the specific vulnerability of small size. To use the Buffer Class ignores the financial deterrent. Adjusting the Broad Class base rate (90%) down to match the Buffer Class (40%) relies on a "small size" penalty that is not statistically isolated in the data.
      3.  **Survivor Bias:** The entity's history (outlived 4 empires) is a *result*, not a *variable*. Using this to justify survival is circular.

  **Desk Head Note:** This case triggers the **Stop Rule**. The analysts will want to write a narrative about "resilience" and attach a high survival number (90%+). The procedure prevents this. The specific reference class is too thin to support a number. Any number published here would be rhetoric wearing the costume of a base rate. You must decide whether to treat it as a generic state (high survival) or a vulnerable buffer (low survival) without statistical cover.

  ***

  # SUMMARY OF HANDOFF POINTS

  1.  **Case 1 (Federation):** I have provided the numbers, but you must decide how to weigh the **Broad Class** (optimistic) against the **Structural Class** (pessimistic). The procedure flags this divergence; it does not resolve it. If you sign off on the Broad Class rate, you are overruling the structural risk indicators.
  2.  **Case 2 (City-State):** I have stopped the procedure. There is **No Usable Reference Class** for "Resilient City-States." The sample size of dead city-states is too small to calculate a hazard rate. If you publish a number here, you are explicitly acknowledging it is expert judgment, not a base rate. Do not allow the analysts to hide behind the "All States" average to validate a grant to a city-state; that is the selection bias the procedure is designed to catch.
