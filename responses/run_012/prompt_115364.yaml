prompt: |-
  Me and a mate got into a long one last night about Keynes's theory of probability — the Treatise version, where probability is supposed to be a logical relation between propositions, a degree of partial entailment, with "weight of argument" sitting alongside it as a separate dimension. I ended up defending it, mainly because I like the thought that some probabilities aren't numbers and aren't even comparable, so "we can't put a figure on it" is a fact about the world rather then a confession of ignorance. So: what would actually count against it? I want the arguments, formal results and cases that should move me, ranked by how decisive they'd be, and I want to know which ones a Keynesian would themselves concede are awkward as opposed to which they'd just shrug off. Ramsey's subjectivist line is the obvious one, and I've got a vague memory Keynes gave a fair bit of ground to him later on — is that right? I'm also suspicious the theory has quietly made itself unfalsifable: whenever the numbers won't come out you can always say the probability was non-numerical all along, and I can't tell if that's a real problem for a view like this or just what any view of that kind has to put up with. And tell me if there's anything the logical theory predicts that the subjectivists can't match, because otherwise I'm not sure what's left of it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Keynes's *A Treatise on Probability* (1921) theory of logical probability (degree of partial entailment) + weight of argument.
      *   **User's Stance:** Defended it, likes the idea that some probabilities aren't numbers/comparable (non-numerical, non-comparable probabilities). Believes "we can't put a figure on it" is ontological, not epistemic.
      *   **Specific Questions:**
          1.  What counts against it? (Arguments, formal results, cases).
          2.  Rank them by decisiveness.
          3.  Distinguish between what a Keynesian concedes is awkward vs. what they shrug off.
          4.  Did Keynes concede ground to Ramsey later?
          5.  Is the theory unfalsifiable (ad hoc protection via non-numericality)?
          6.  What does the logical theory predict that subjectivists (Ramsey/de Finetti) can't match?

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Keynes's Theory:* Logical relation between evidence ($h$) and conclusion ($a$), denoted $a/h$. Not always measurable. Non-comparability is key. Weight of argument ($V$) is distinct from probability ($P$).
      *   *Ramsey's Critique:* "Truths of logic" don't have degrees. Probability is about partial belief (subjective), governed by coherence (Dutch Book).
      *   *Carnap:* Tried to salvage logical probability (inductive logic) but ran into the problem of choosing priors ($\lambda$).
      *   *Keynes vs. Ramsey:* Keynes reviewed Ramsey's critique. He admitted Ramsey was right about *measurable* probability but held firm on the existence of non-measurable logical relations.
      *   *Falsifiability:* The "non-comparable" escape hatch is a major criticism.
      *   *Unique Predictions:* Objective constraints on rational belief independent of psychology.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the debate. It's a classic clash (Logical vs. Subjective). Validate the user's intuition (it's a sophisticated position).

      *   **1. The Ramsey Critique (The Big Gun):**
          *   *Argument:* Logic is binary (true/false). There are no "partial entailments." If $h$ doesn't entail $a$, the relation is zero.
          *   *Keynes's Concession:* Keynes admitted in his review of Ramsey that we can't *perceive* these logical relations intuitively as clearly as Ramsey thought we could perceive degrees of belief.
          *   *Decisiveness:* High. It attacks the metaphysical basis.

      *   **2. The Problem of Non-Comparability (The "Unfalsifiable" Charge):**
          *   *Argument:* If every time probabilities don't behave numerically you say "ah, it's non-comparable," the theory explains everything and predicts nothing.
          *   *Keynesian Defense:* It's not a bug, it's a feature. It matches the phenomenology of uncertainty (e.g., radical uncertainty in economics).
          *   *Decisiveness:* Medium-High. It's a methodological worry.

      *   **3. Carnap's Continuum and the Choice of Priors:**
          *   *Argument:* Even if logical probability exists, how do we calculate it? Carnap tried and failed to find a unique logical prior without arbitrary parameters.
          *   *Decisiveness:* Medium. Shows the difficulty of implementation, not necessarily falsity.

      *   **4. Dutch Book Arguments (Coherence vs. Truth):**
          *   *Argument:* Subjectivists show that if you don't act *as if* you have numerical probabilities, you can be pumped for money.
          *   *Keynesian Response:* Rationality isn't just avoiding Dutch Books. It's about having grounds. If grounds are insufficient, refusing to bet is rational, even if it looks incoherent.
          *   *Decisiveness:* Medium. Depends on your definition of rationality.

      *   **5. Did Keynes Concede to Ramsey?**
          *   *Fact Check:* Yes, in his 1922 review of Ramsey. He called Ramsey's critique "devastating" regarding the *perception* of logical relations but maintained the *existence* of logical relations for non-numerical cases.
          *   *Nuance:* He didn't become a full subjectivist.

      *   **6. What Does Logical Probability Do Better? (Unique Predictions/Value):**
          *   *Objective Constraints:* Subjectivism allows two people with same evidence to have different priors. Logical probability says they *should* have the same degree of belief.
          *   *Radical Uncertainty:* Explains why we sometimes freeze or refuse to assign numbers (Keynes's *General Theory* investment decisions). Subjectivists force a number (even if vague).
          *   *Weight of Argument:* Distinguishes between high prob/low evidence vs. high prob/high evidence. Subjectivism struggles with this (usually collapses into just probability).

      *   **7. Ranking the Objections:**
          *   1. Ramsey's "No Partial Entailment" (Metaphysical attack).
          *   2. Unfalsifiability/Ad Hoc nature of non-comparability.
          *   3. Failure of Formalization (Carnap's failure).
          *   4. Dutch Book (Pragmatic attack).

  4.  **Refining the Tone:**
      *   Keep it conversational but rigorous ("long one last night," "mate").
      *   Avoid taking sides too hard, but give the user the ammo they asked for.
      *   Ensure the distinction between *Treatise* Keynes and *General Theory* Keynes is clear (the latter relies more on the uncertainty aspect).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain "Weight of Argument"? Yes, need to ensure it's distinct from Probability.
      *   *Check:* Is the "unfalsifiable" point addressed fairly? Yes, it's the "Duhem-Quine" style problem for logical probability.
      *   *Check:* Did Keynes actually concede? Need to be precise. He conceded the *epistemology* (how we know the relations) more than the *ontology* (that they exist).
