answer: |-
  This is a fantastic debate to have had. You're defending one of the most philosophically rich but technically beleaguered positions in the history of probability. Keynes's *A Treatise on Probability* (1921) is a brilliant book, but it sits in a weird spot: it's too mathematical for philosophers and too philosophical for mathematicians.

  You asked for the arguments that should move you, ranked by decisiveness, along with an assessment of the "unfalsifiability" charge and the Ramsey concession. Here is the breakdown.

  ### 1. Did Keynes Concede to Ramsey?
  **Yes, but not fully.**

  You have a correct vague memory. In 1922, Keynes reviewed Frank Ramsey's critique (*Mr. Keynes on Probability*). Keynes was remarkably gracious. He wrote that Ramsey's criticism was "devastating" regarding the **epistemology** of logical probability.

  *   **What Keynes conceded:** He admitted that he had no satisfactory account of *how* we perceive these logical relations. Ramsey argued that we don't have a faculty of "logical intuition" that can see that proposition $A$ partially entails proposition $B$ in the way we see that $A$ entails $B$. Keynes agreed this was a weak point in the *Treatise*.
  *   **What Keynes held firm on:** He did not concede the **ontology**. He maintained that even if we can't always *see* the relation, the relation exists objectively. He specifically held his ground on non-numerical probabilities. He thought Ramsey's subjectivism (probability = degree of belief) was fine for games of chance or frequentable events, but failed to capture "radical uncertainty" (like the prospect of a European war in 20 years), where there is simply no logical basis for a number.

  ### 2. The Arguments Against Logical Probability (Ranked by Decisiveness)

  Here are the objections, ranked from "Existential Threat" to "Annoying Technicality."

  #### Rank 1: Ramsey's "No Partial Entailment" Argument (Metaphysical)
  **The Argument:** Logic is binary. A set of premises either entails a conclusion or it doesn't. There is no such thing as a "partial" logical relation. If $h$ does not logically entail $a$, then the logical probability is zero. What Keynes calls "partial entailment" is actually just a psychological feeling of confidence projected onto the logic.
  **Why it's decisive:** It attacks the core definition. If there are no logical relations of probability, the theory refers to nothing.
  **Keynesian Concession:** **Awkward.** A modern Keynesian (like a follower of Carnap or objective Bayesian) has to admit we lack a mechanism for accessing these relations. They usually retreat to saying, "It's a normative ideal, not a descriptive fact."
  **Keynesian Shrug:** "Classical logic is binary, but inductive logic isn't classical logic. Just because you can't formalize the relation yet doesn't mean it isn't there."

  #### Rank 2: The Unfalsifiability / "Escape Hatch" Charge (Methodological)
  **The Argument:** This addresses your suspicion. If a numerical probability works, great. If it doesn't work, or if two probabilities seem incomparable, the Keynesian says, "Ah, that's because it's a non-numerical/non-comparable logical relation." This makes the theory compatible with *any* outcome. It predicts nothing.
  **Why it's decisive:** In philosophy of science, a theory that explains everything explains nothing. If the theory cannot specify *in advance* which relations will be numerical and which won't, it lacks predictive power.
  **Keynesian Concession:** **Very Awkward.** This is the hardest bullet to bite. It makes the *Treatise* look more like a taxonomy of uncertainty than a theory of probability.
  **Keynesian Shrug:** "The world is messy. A theory that forces numbers onto unquantifiable uncertainty (like Subjectivism) is *worse* because it creates false precision. My theory's flexibility is a feature, not a bug."

  #### Rank 3: The Failure of Formalization (Carnap's Problem)
  **The Argument:** Rudolf Carnap spent 30 years trying to build Keynes's dream: a system of inductive logic where $P(h|e)$ is determined logically. He failed. He found he needed an arbitrary parameter ($\lambda$) to get the system to work. This implies the probability isn't purely logical (determined by evidence alone); it depends on a subjective choice of inductive method.
  **Why it's decisive:** It suggests that even if logical probability exists, it is useless for calculation. You can't derive the probability from the propositions alone; you need external input.
  **Keynesian Concession:** **Awkward.** It admits the *Treatise* program was incomplete.
  **Keynesian Shrug:** "Carnap was looking for a universal logic. Keynes only claimed logical relations exist in specific contexts. The failure of *Inductive Logic* doesn't disprove the existence of logical relations in specific cases."

  #### Rank 4: Dutch Book Arguments (Pragmatic)
  **The Argument:** Ramsey and de Finetti showed that if your degrees of belief don't obey the numerical axioms of probability, you can be made to accept a set of bets that guarantees a loss (a Dutch Book). Therefore, rationality *requires* numerical probabilities.
  **Why it's decisive:** It defines rationality as coherence. If Keynesian uncertainty leads to incoherence, it is irrational.
  **Keynesian Concession:** **Shrug.** This is where the Keynesian digs in.
  **Keynesian Shrug:** "Refusing to bet is rational when the weight of argument is low. Being 'incoherent' in a Dutch Book sense is better than being confidently wrong. The Dutch Book argument assumes you *must* bet. A Keynesian says sometimes the rational act is to withhold judgment."

  ### 3. Is the Theory Unfalsifiable?
  You hit the nail on the head. The charge is that "non-comparability" is a **theoretical protective belt**.

  *   **The Problem:** If I say $P(A|H) > P(B|H)$, and you show me a case where that intuition fails, I can say, "Well, in that specific case, the relations were non-comparable."
  *   **Is this fatal?** For a scientific theory, yes. For a philosophical account of rationality, maybe not.
  *   **The Defense:** A sophisticated Keynesian argues that the theory *does* make a prediction: it predicts that agents will (and should) behave differently in situations of low "weight of argument" (low evidence) vs high weight, even if the numerical probability is the same.
      *   *Example:* 50% chance of heads (known fair coin) vs. 50% chance of rain (unknown meteorological system). Subjectivism says treat them the same. Keynes says treat them differently (lower weight in the rain case).
      *   *Test:* If people *don't* treat them differently (e.g., in Ellsberg Paradox style experiments), Keynes is in trouble. But actually, people *do* treat them differently (ambiguity aversion). So, empirically, Keynes predicts human behavior better than strict Subjectivism here.

  ### 4. What Does Logical Probability Do Better? (The Selling Points)
  If you want to keep defending it, these are the hills to die on. These are things Subjectivism struggles to match without contortions.

  **1. Objective Constraints on Rational Belief**
  *   **Subjectivism:** Two agents can have the exact same evidence ($e$) and hypothesis ($h$) and legitimately hold different probabilities ($P_1(h|e) \neq P_2(h|e)$), provided they are coherent.
  *   **Keynes:** This is irrational. Given the same evidence, there is *one* correct degree of rational belief.
  *   **Why it matters:** In law, science, and policy, we act as if there is a "correct" conclusion based on evidence. Subjectivism struggles to justify why a jury *should* agree. Keynes provides a normative framework for consensus.

  **2. The Weight of Argument ($V$)**
  *   **Subjectivism:** Probability is the only dimension. More evidence just shifts the probability.
  *   **Keynes:** Probability ($P$) and Weight ($V$) are distinct.
      *   Case A: 1 toss of a coin. $P(Heads) = 0.5$. Weight = Low.
      *   Case B: 1000 tosses, 500 heads. $P(Heads) = 0.5$. Weight = High.
  *   **Why it matters:** Subjectivists have to model this as "confidence intervals" or "second-order probabilities," which often collapse back into first-order probabilities. Keynes's $V$ explains why we hesitate to act on Case A but act confidently on Case B, even though the expected value is identical. This is crucial for his later economic theory (*The General Theory*) regarding investment under uncertainty.

  **3. Radical Uncertainty (Non-Existence of Probability)**
  *   **Subjectivism:** You *must* have a prior. Even if you know nothing, you assign a principle of indifference (e.g., 50/50).
  *   **Keynes:** Sometimes $P$ simply does not exist. There is no logical relation between the evidence and the outcome (e.g., "Will there be a war in 2050?").
  *   **Why it matters:** Forcing a number onto radical uncertainty leads to catastrophic risk modeling errors (e.g., the 2008 financial crisis, where models assumed probabilities existed for events that were fundamentally unquantifiable). Keynes provides the philosophical justification for saying "I don't know" is a valid mathematical state.

  ### Summary for Your Next Pub Session

  **If your mate pushes Ramsey:**
  Concede that Keynes failed to explain *how* we know logical relations. But insist that the *existence* of objective constraints on belief is necessary for science and law to function. If probability is purely subjective, scientific consensus is just a coincidence of psychology.

  **If your mate pushes Unfalsifiability:**
  Argue that Subjectivism is *more* unfalsifiable because it can explain any belief as "coherent" if you tweak the priors enough. Keynes's theory is more restrictive: it says some beliefs are objectively wrong given the evidence.

  **The "Checkmate" Move:**
  Bring up the **Ellsberg Paradox**. People prefer betting on an urn with known odds (50 red, 50 black) over an urn with unknown odds, even when the expected value is identical.
  *   **Subjectivist:** Calls this "irrational" (violates Savage's axioms).
  *   **Keynesian:** Calls this "rational" (difference in Weight of Argument).
  *   **Result:** Since humans actually behave this way, the Keynesian description of rationality is more descriptively accurate than the Subjectivist one.

  **Verdict:** The *Treatise* fails as a formal calculus (Carnap proved that's likely impossible), but it succeeds as a philosophy of uncertainty. If you defend it as a formal system, you will lose. If you defend it as an account of why we sometimes *cannot* calculate, you are on solid ground.
