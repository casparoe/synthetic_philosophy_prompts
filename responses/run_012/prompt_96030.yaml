  **UNIVERSITY EXAMINATION PAPER**

  **Department of Philosophy**
  **PHIL204: Pleasure and Pain**
  **Final Examination**

  **Time Allowed:** 2 Hours
  **Materials Allowed:** None (Closed Book)
  **Instructions:** Answer the question below. You may not appeal to any empirical psychological or physiological findings beyond what is stipulated in the case description.

  ***

  **Essay Question**

  **The Heterogeneity Problem and the Dimmer Dial**

  The heterogeneity objection claims that the things we call pleasures (the taste of a cool drink, relief from pain, solving a puzzle, hearing music, good news) share no common phenomenal or functional feature. Consequently, hedonism is either vacuous (defining pleasure as whatever is liked) or parochial (privileging one type of thrill).

  **The Case (The Dimmer Dial):**
  Suppose a subject is fitted with a device that scales the felt pleasantness of everything she experiences. The device leaves sensory content untouched — the drink tastes the same, the headache has the same throbbing character, the crossword has the same structure — leaves her desires and her functional dispositions untouched, and leaves the sequence of her experiences untouched. It changes only how pleasant those experiences feel, along a single scale running from a floor at which she reports total indifference to a ceiling at which every experience is intensely pleasant. Two further stipulations: the dial is continuous, and it is modality-blind, so that one setting governs the taste, the throbbing and the crossword alike. You may assume the device is physically possible; you may not assume that the subject's reports about it are theoretically innocent.

  **(a)** Separate what the heterogeneity objection is a claim about. In particular, distinguish the conceptual claim that we have no single concept under which all pleasures fall from the metaphysical claim that there is no single property they share, and say why hedonism's prospects look different depending on which of these is at stake. I do not want the question to presuppose that hedonism requires a single scalar quantity; the student should have to decide whether it does.

  **(b)** Then turn to the case. What, if anything, does the coherence of the Dimmer Dial show about the heterogeneity objection? I want the answer to reckon with the possibility that the case is question-begging — that a device scaling pleasantness along one dimension simply presupposes the common currency the objection denies — and with the possibility that it is not, and then to reach a verdict about which it is.

  **(c)** Finally, take the two accounts from the unit that you think are strongest and say, for each, whether it can accommodate the case and what it must give up in order to do so.

  ***

  **MODEL ANSWER**

  The heterogeneity objection targets hedonism's core commitment: that pleasure is a unified good. To assess this, one must distinguish the conceptual from the metaphysical. The conceptual claim asserts that our ordinary language uses 'pleasure' polysemously; there is no single definition covering music and quenching thirst. The metaphysical claim is stronger: there is no single natural property shared by these experiences. Hedonism survives the conceptual claim easily; it can stipulate a technical sense of 'pleasure' for ethical calculation, ignoring ordinary usage. It fails, however, if the metaphysical claim holds. Without a shared property, there is no single quantity to maximize, rendering hedonistic calculus impossible. Thus, hedonism does require a single scalar quantity of *value*, though not necessarily a single *sensation*. If pleasures are metaphysically distinct, they cannot be summed on a single axis of goodness.

  The Dimmer Dial case tests the metaphysical claim. The device scales pleasantness while holding sensory content and functional dispositions constant. If this scenario is coherent, it demonstrates a metaphysical commonality: a distinct 'hedonic layer' modifiable across modalities. This refutes the metaphysical heterogeneity claim by exhibiting a conceivable shared property. However, the objection that the case is question-begging is serious. To imagine a 'pleasantness dial' presupposes that pleasantness is a single variable capable of being scaled. If heterogeneity is true, such a device is conceptually impossible, akin to a 'bachelor dial' for married men. The case assumes the existence of the common currency the heterogeneist denies.

  Nevertheless, the intuitive coherence of the scenario suggests the burden of proof shifts to the heterogeneist. If we can conceive of the dial without contradiction, the metaphysical claim loses force. The verdict is that the Dial does not refute the conceptual claim (we might still use the word differently), but it undermines the metaphysical claim by offering a model of a common property, provided one accepts the stipulation that such scaling is possible. It shows that heterogeneity is not a necessary truth, but it relies on the very intuition hedonists seek to prove.

  Finally, consider the Sensation Account and the Attitude Account. The Sensation Account identifies pleasure with a distinct qualitative feel (hedonic tone). The Dial fits this naturally: the dial adjusts the intensity of this tone. To accommodate the case, this account must insist the tone is truly distinct from sensory content. The cost is phenomenological plausibility; often, the pleasantness *is* the taste, not an add-on. The Dial stipulates content is untouched, forcing the Sensation theorist to argue the tone is a separate sensory stream, which conflicts with how pleasure often feels integrated.

  The Attitude Account identifies pleasure with a pro-attitude toward experience. The Dial scales the intensity of this attitude. To accommodate the case, the Attitude theorist must explain how the attitude changes while 'functional dispositions' remain untouched (as stipulated). Usually, attitudes entail dispositions to pursue. The cost here is theoretical consistency: the account must decouple the phenomenological attitude from its standard functional role, rendering the attitude a purely phenomenal state rather than a functional one. Both accounts accommodate the Dial by treating pleasure as a distinct variable, but the Sensation account pays a phenomenological price, while the Attitude account pays a functional price.

  ***

  **MARKING SCHEME (25 MARKS TOTAL)**

  **Part (a): Conceptual vs. Metaphysical & Scalar Quantity (6 Marks)**

  *   **2 Marks:** Clearly distinguishes the conceptual claim (language/usage/polysemy) from the metaphysical claim (natural property/reality).
      *   *Typical Mistake:* Treating them as the same claim or focusing only on linguistic usage.
  *   **2 Marks:** Explains why hedonism is vulnerable to the metaphysical claim (no common property = no aggregation) but resilient to the conceptual claim (stipulative definition allowed).
      *   *Typical Mistake:* Arguing hedonism fails if the *concept* is heterogeneous, ignoring the possibility of technical stipulation.
  *   **2 Marks:** Addresses the scalar quantity issue (hedonism requires a common axis for maximization/calculus, even if not a single sensation).
      *   *Typical Mistake:* Asserting hedonism *must* rely on a single sensation type without justification.

  **Part (b): The Dimmer Dial Analysis (9 Marks)**

  *   **3 Marks:** Identifies what the Dial shows if coherent (evidence of a shared metaphysical property/hedonic layer).
      *   *Typical Mistake:* Claiming the Dial proves the Sensation Account is true specifically, rather than metaphysical unity generally.
  *   **3 Marks:** Articulates the "question-begging" objection (the device presupposes the single dimension it purports to demonstrate).
      *   *Typical Mistake:* Ignoring the instruction to reckon with the question-begging possibility.
  *   **3 Marks:** Reaches a reasoned verdict (e.g., shifts burden of proof / undermines metaphysical but not conceptual claim / coherent conceivability vs. logical possibility).
      *   *Typical Mistake:* Sitting on the fence without a verdict, or appealing to empirical neuroscience to solve the philosophical stipulation.

  **Part (c): Application to Two Accounts (10 Marks)**

  *   **2 Marks:** Selects two distinct accounts from the unit (e.g., Sensation, Attitude, Desire, Hedonic-tone, Apparent-good).
      *   *Typical Mistake:* Choosing two variants of the same account (e.g., two types of Desire accounts) without distinguishing them.
  *   **4 Marks (2 per account):** Explains how each account accommodates the Dial (e.g., Sensation = scaling tone; Attitude = scaling pro-attitude).
      *   *Typical Mistake:* Claiming an account fits without explaining *how* the dial interacts with that account's specific definition of pleasure.
  *   **4 Marks (2 per account):** Identifies the specific theoretical cost/give-up for each (e.g., Sensation loses phenomenological integration; Attitude loses functional link to disposition).
      *   *Typical Mistake:* Failing to notice the constraint that "functional dispositions" are untouched, leading to an analysis that ignores the cost to functionalist theories.

  **Total: 25 Marks**
