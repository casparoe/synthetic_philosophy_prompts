answer: |-
  **MEMORANDUM**

  **TO:** Environmental Humanities Steering Committee
  **FROM:** Graduate Representative (History & Philosophy of Science)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Periodization and the "Anthropocene" Boundary

  ### 1. Executive Summary

  The committee is currently stalled on whether to anchor the new program's historical arc to the "Anthropocene," and if so, where to place its start date. This is not merely a chronological dispute; it is a disagreement about the causal architecture of our field and the ethical obligations of our classification practices.

  After evaluating the three prevailing positions, I recommend that the committee **adopt the Anthropocene as a conceptual framework but reject a single, global stratigraphic start date as the program's primary organizer.** Instead, for curricular and narrative coherence, we should anchor the program's historical module in the **Early Modern period (circa 1492–1610)**, treating the mid-twentieth century as a phase of intensification rather than origin. The authority to draw this boundary lies with **this Committee**, not external geological bodies, because our epistemic goals differ from stratigraphy. This decision prioritizes historical causality over geophysical synchronicity. Below, I outline the reasoning, the trade-offs, and the implementation timeline.

  ### 2. Analysis of Positions

  To decide, we must first understand the strength of the competing claims. I have reconstructed them below in their strongest forms.

  **A. The Mid-Twentieth Century (The "Great Acceleration" Faction)**
  *The Argument:* This position relies on stratigraphic rigor. Proponents argue that a period boundary must be identifiable in the rock record through synchronous global markers (e.g., radionuclides from nuclear testing, plastic sedimentation, carbon isotope spikes). The mid-20th century offers the only signal that is truly planetary and simultaneous.
  *The Strength:* This framing ensures interoperability with Earth System Science. It prevents the Humanities from drifting into vague cultural metaphor by tethering us to hard data. It emphasizes the *urgency* of the crisis, locating it within living memory and the lifespan of industrial capitalism's most destructive phase. It treats the Anthropocene as a rupture in Earth history, not just human history.

  **B. The Early Modern (The "Orbis/Colonial" Faction)**
  *The Argument:* This position argues that the mid-century signal is merely a symptom, not a cause. The drivers of the Anthropocene—globalized extractive capitalism, the commodification of nature, and the Columbian Exchange—began with the European colonization of the Americas. The demographic catastrophe of Indigenous peoples (and the subsequent reforestation) marks a measurable CO2 dip (the 1610 Orbis Hypothesis), but more importantly, it marks the onset of the *logic* that produced the crisis.
  *The Strength:* This framing centers accountability. By starting in the mid-20th century, we risk treating the Anthropocene as a technical glitch of "modernization" rather than a structural outcome of colonialism and slavery. The Early Modern start date forces the program to grapple with the long genealogy of violence that made the Great Acceleration possible. It aligns the periodization with the history of power, not just the history of particles.

  **C. The Plurality/Rejection (The "Multiscalar" Faction)**
  *The Argument:* This position contends that a single global boundary is a category mistake. The transition to human-dominated earth systems was uneven, occurring at different times in different places (e.g., the Neolithic in some regions, the Industrial Revolution in others). Imposing a single line erases local specificities and imposes a "view from nowhere" that replicates the universalizing impulse of the very science we critique.
  *The Strength:* This is the most epistemically humble position. It protects against reductionism and acknowledges that "nature" and "history" entangle differently depending on where you stand. It refuses to sacrifice nuance for the sake of administrative neatness.

  ### 3. The Philosophical Core: Utility vs. Truth

  A recurring concern in our discussions is whether pedagogical or political utility is a sufficient reason to draw a boundary. *Does a period boundary have to answer to some standard of "getting the world right" that those considerations cannot supply?*

  My position is definite: **In the Environmental Humanities, a boundary that illuminates causal responsibility is "truer" than a boundary that merely marks geophysical intensity.**

  Classification is never value-neutral. When geologists draw a line in the rock, they are asking, "Where does the earth change?" When historians draw a line in time, they are asking, "Where does the story change?" These are different questions. If we adopt the mid-20th century boundary solely because it is stratigraphically clean, we are implicitly accepting a definition of the Anthropocene that privileges *geophysical symptoms* over *socio-political causes*.

  Therefore, political and pedagogical utility *are* epistemic virtues in this context. A map that shows the geology but hides the roads is a "true" map of the rocks, but a "false" map for a driver. Since our program is designed to navigate the crisis, not just catalogue its sediment, we must choose the boundary that best explains *why* we are in this crisis. The Early Modern boundary is more useful for our mission, and therefore, for us, it is more accurate.

  ### 4. Recommendation and Resolution

  **Decision:** The committee shall adopt the **Anthropocene** as the program's organizing problematic, but we will define its historical onset as the **Early Modern period (circa 1492–1610)**.

  **Criterion for Boundary:** The boundary is drawn based on **causal genealogy** (the onset of globalized extractive colonialism) rather than **stratigraphic synchronicity** (the Great Acceleration signals).

  **Authority:** The authority to draw this boundary rests with **this Committee**. We should not defer to the International Commission on Stratigraphy (ICS) or similar natural-science bodies. They are tasked with defining a geological epoch for the rock record; we are tasked with defining a field of inquiry for human culture. Conflating the two surrenders our disciplinary autonomy. While we must respect the data of the natural sciences, we are not bound by their periodization conventions when they obscure the historical narratives central to the Humanities.

  **Engaging the Losing Side (Mid-20th Century):**
  I want to be explicit about what we lose by rejecting the mid-20th century as the primary anchor. We lose **stratigraphic legibility**. By anchoring in 1610, we create a translation gap with our colleagues in the Earth Sciences who operate on the 1950s timeline. We risk appearing "soft" or imprecise to scientific partners. Furthermore, we risk diluting the sense of immediate emergency; the 1950s frame screams "crisis now," whereas the 1610 frame risks making the Anthropocene feel like an inevitable, 500-year historical drift. We must actively work against the fatalism that a longer timeline can induce.

  **Addressing the Plurality Objection:**
  While Position 3 (Plurality) is philosophically robust, a degree program requires a coherent curriculum structure. We cannot teach "everything, everywhere, all at once." We will address the validity of Position 3 *within* the curriculum (specifically in our core theory course), teaching students that the 1610 date is a heuristic, not a law of nature. We adopt the boundary for structure, but teach the critique of that boundary as content.

  ### 5. Actionable Bottom Line & Timeline

  To move from dispute to implementation, I propose the following timeline:

  1.  **November 15:** Committee vote to formally adopt the "Early Modern/Causal Genealogy" framing (1492–1610) as the program's historical anchor, with the Mid-20th Century designated as the "Great Acceleration" module within the curriculum.
  2.  **December 1:** Drafting of the Program Mission Statement, explicitly noting that our periodization is chosen for *historical and ethical clarity* rather than stratigraphic conformity. This transparency preempts criticism from scientific partners.
  3.  **January 15:** Curriculum working group to map core courses against this timeline, ensuring the 1610 anchor does not erase Indigenous histories but centers them as the starting point of the global transformation.
  4.  **February 1:** Final approval of the intellectual framing for the University Senate.

  **Conclusion:**
  We cannot wait for the geologists to agree on a "Golden Spike." Their debate is about rocks; ours is about responsibility. By choosing the Early Modern, we assert that the Anthropocene is not just a change in the atmosphere, but a change in human relations. That is a boundary we have the standing to draw.

  I look forward to discussing this draft at our next meeting.
