answer: |-
  You have asked for plain speaking, so I will begin there. Your intuitions are remarkably consistent with the prevailing framework of modern bioethics (specifically the Belmont Report and CIOMS guidelines), but they are not perfectly consistent with each other. You can have a workable principle that fits most of your verdicts, but you cannot save all of them without making the principle so complex it becomes useless in the field.

  Here is the principle that best fits your data, followed by the cost of adopting it.

  ### The Principle of Substantial Authorization

  Consent is valid if and only if three conditions are met:

  1.  **Capacity:** The agent has the cognitive ability to understand the nature of the act and its foreseeable consequences, and to weigh them against their own values.
  2.  **Material Disclosure:** The agent is provided with information that a reasonable person would consider significant in deciding whether to undergo the intervention, specifically regarding risks, benefits, and alternatives.
  3.  **Non-Control:** The decision is not the product of controlling interference by another agent, nor made within a relationship where the offeror holds institutional power over the offeree's basic liberties.

  ---

  ### Mapping Your Verdicts to the Principle

  **Clause 1: Capacity**
  *   **Case 3 (Dementia):** Fails Capacity. He cannot hold the long-term risk in view. The principle requires the ability to weigh future consequences, not just immediate pain.
  *   **Case 8 (Emergency):** Passes Capacity. Time pressure does not remove cognitive ability. If he understands the proposal, the urgency is a circumstance, not a cognitive deficit.
  *   **Case 9 (Unconscious):** Fails Capacity. No authorization occurred. The permissibility comes from *presumed consent* or *necessity*, which are ethical justifications distinct from actual consent.

  **Clause 2: Material Disclosure**
  *   **Case 1 (Bed Nets):** Fails Disclosure. The removal of standard care is a "material fact." It changes the risk/benefit profile of participation relative to the status quo. Omitting it vitiates consent.
  *   **Case 6 (Risk Stats):** Fails Disclosure. Misrepresenting probability prevents accurate weighing of risk.
  *   **Case 7 (Tissue Bank):** Passes Disclosure. This is the counter-intuitive one. It passes because the *scope of uncertainty* is disclosed. The patient authorizes the *process* of future governance, not specific future acts. This aligns with your "Unknown Risk" case: if the epistemic limit ("we do not know long-term effects") is disclosed, consent is valid. If the ignorance is hidden, it fails (like Case 6).
  *   **Case 5 (Vasectomy Lie):** **Here is the fracture.** Under this principle, Case 5 should be **Invalid**. A vasectomy status is a material fact regarding the risk profile (pregnancy/STIs) of the act. If omitting bed nets (Case 1) invalidates consent because it changes the health risk, lying about sterilization must also invalidate consent because it changes the health/life risk. I will return to this.

  **Clause 3: Non-Control**
  *   **Case 2 (Payment):** Passes Non-Control. Poverty is a *background circumstance*, not a controlling agent. The researcher did not create the poverty, and refusing the study does not make the woman worse off than she was before (no threat).
  *   **Case 4 (Prisoner):** Fails Non-Control. Prison is a *structural constraint*. The institution controls basic liberties. Even if the offer is "fair," the environment is inherently coercive because the power imbalance is total and custodial.
  *   **Case 9 (Unconscious):** Fails Non-Control/Authorization. (See above).

  ---

  ### The "Unknown Risk" Case
  *You asked: A participant consents to a drug with genuinely unknown long-term effects. Later, a specific unknown risk emerges.*

  **Verdict:** Valid Consent.
  **Reasoning:** This falls under Clause 2 (Material Disclosure). In research, the "unknown" is a known category. If the consent process disclosed that "long-term effects are unknown," the participant consented to the *epistemic situation*. They accepted the possibility of unknown risks.
  **Caveat:** If the investigators suspected a specific risk and hid it, consent becomes invalid (Case 6). If they truly knew nothing and said so, the consent holds. This aligns with Case 7 (Tissue Bank). You cannot consent to specific unknown facts, but you can consent to a *process* that carries unknown risks.

  ---

  ### New Cases: Proxies and Withdrawal

  **1. Consent on Another's Behalf (Proxy)**
  *   **Verdict:** Permissible only if Capacity is permanently or temporarily absent (Case 3, 9), and the proxy uses **Substituted Judgment**.
  *   **Principle Application:** The proxy must decide as the *patient* would have, not as the *proxy* would. If the patient's values are unknown (e.g., never expressed), the proxy must use the **Best Interest** standard.
  *   **Constraint:** Proxy consent is never valid for *non-therapeutic* research with more than minimal risk. (You cannot authorize your demented father to join a Phase I drug trial for money, even if he needs the money).

  **2. Withdrawal After the Fact**
  *   **Verdict:** Retroactive withdrawal does not invalidate past consent if the original consent was valid.
  *   **Principle Application:** Consent is a performative act at Time A. If Capacity, Disclosure, and Non-Control were present at Time A, the authorization stands.
  *   **Exception:** If new information arises (e.g., the "unknown risk" becomes known), the participant must be re-consented for *continued* participation. They cannot undo the past, but they can revoke future authorization.

  ---

  ### The Cost: Which Verdict Must Go?

  You asked me to tell you plainly if one of your verdicts has to go. **Yes.**

  You must reconcile **Case 1 (Bed Nets)** and **Case 5 (Vasectomy)**. They are logically inconsistent under any principle of Material Disclosure.

  *   In **Case 1**, you argue that withholding information about a change in background care (nets) invalidates consent because it alters the participant's risk calculation.
  *   In **Case 5**, you argue that lying about a biological condition (sterility) does *not* invalidate consent because she agreed to the "act itself."

  **The Recommendation:** You should abandon the verdict on **Case 5**.

  **Why:** In infectious disease field trials (your expertise), we accept that context *is* part of the intervention. A vaccine trial without nets is a different intervention than a vaccine trial with nets. Similarly, sex with a sterile partner is a different risk proposition than sex with a fertile partner. If the omission of the nets (Case 1) is material enough to void consent, the lie about the vasectomy (Case 5) is material enough to void consent.
  *   **Philosophical Cost:** This moves you away from a narrow legalistic view ("fraud in the factum" vs. "fraud in the inducement") toward a bioethical view ("informed authorization").
  *   **Usability Benefit:** It makes the rule for your field staff simpler: *If it changes the risk calculation, you must disclose it.* Whether it's nets, side effects, or sterility, the rule is the same.

  ### The Tension: Case 2 (Payment) vs. Case 4 (Prison)

  You asked if the distinction here is usable in a real conversation.
  **Verdict:** It is usable, but it is fragile.

  **The Distinction:**
  *   **Case 2:** The researcher is an *opportunity*. The participant's alternatives are bad (poverty), but the researcher did not cause them.
  *   **Case 4:** The researcher is part of the *apparatus*. The participant's alternatives are restricted by the very institution hosting the research.

  **The Risk:** This distinction breaks down if the payment in Case 2 is so high it becomes "undue inducement" (blinding the participant to risk). However, your verdict says the payment is "a month's wages." In most guidelines, this is acceptable compensation for time and burden, not coercion.
  **Advice:** Keep this distinction. It is the standard regulatory line (Belmont/CIOMS). It is defensible provided you monitor the *amount* of the payment to ensure it doesn't become coercive itself.

  ### Summary

  1.  **The Principle:** Capacity + Material Disclosure + Non-Control.
  2.  **The Sacrifice:** You must change your verdict on **Case 5**. If omission of nets voids consent, lying about sterility must also void consent. Both are material risks.
  3.  **The Unknown Risk:** Valid, provided the *uncertainty* was disclosed. You consent to the gap in knowledge, not the specific outcome.
  4.  **The 2 vs 4 Tension:** Keep it. It distinguishes between background hardship (poverty) and structural coercion (custody). It is workable if staff are trained to ask: "Did we create the constraint, or are we just operating within it?"

  You have the instincts of a seasoned ethicist, even without the vocabulary. The only inconsistency is treating the "act" in Case 5 as isolated from its consequences, while treating the "act" in Case 1 as inseparable from its context. Align those two, and your framework is solid.
