      *   *Case 5 (Vasectomy Lie):* Valid (technically). Fraud regarding consequence/condition, not the act itself. *Key:* Deception about the *nature* of the act vs. *context*. (Note: This is a controversial legal/philosophical point, often called "fraud in the factum" vs. "fraud in the inducement").
      *   *Case 6 (Risk Exaggeration):* Invalid. Misrepresentation of probability. *Key:* Accurate risk assessment.
      *   *Case 7 (Broad Tissue Consent):* Valid. Open-ended future use okay. *Key:* Authorization of authority/trust vs. specific knowledge.
      *   *Case 8 (Emergency):* Valid. Time pressure doesn't negate capacity if understanding exists. *Key:* Voluntariness under pressure.
      *   *Case 9 (Unconscious/Exception):* Permissible but *not consent*. *Key:* Distinction between ethical justification and actual consent.
      *   *Case 10 (Unknown Long-term Risk):* Ambivalent. User oscillates. *Key:* Epistemic limits vs. specific risk assumption.

  3.  **Synthesize the Underlying Principles:**
      *   Looking at the pattern, the user isn't relying on a single monolithic theory (like pure Libertarianism or pure Paternalism). They are using a hybrid model common in bioethics: **Substantial Understanding + Voluntariness + Authorization.**
      *   *Tension Point:* Case 2 vs. Case 4. Why is money okay (2) but prison status not (4)?
          *   Standard Bioethics Explanation: Poverty is a "background condition," but the researcher didn't cause it. Prison is a "structural constraint" where the researcher/institution is part of the coercive apparatus, or the ability to say "no" is fundamentally compromised by the custodial relationship.
          *   User's Intuition: Case 2 is valid (agency remains), Case 4 is invalid (agency compromised by institution).
      *   *Tension Point:* Case 5 vs. Case 1 & 6.
          *   Case 5 (Lie about vasectomy): User says consent *valid* (to the sex), though wrong done. This aligns with legal "fraud in the inducement."
          *   Case 1 (Bed nets) & 6 (Risk stats): User says consent *invalid*. These are omissions/misrepresentations about the *context* or *risk profile* of the intervention.
          *   Distinction: Is the deception about the *nature of the act* or the *consequences/conditions*? In Case 5, the act is sex. In Case 1, the act is "participating in a trial" which implies a certain relationship to care. In Case 6, the act is surgery with specific risk profile.
          *   Actually, Case 5 is the outlier philosophically. Many ethicists argue fraud vitiates consent. But the user holds firm: "agreed to the act itself." I need to respect that but test its consistency.
      *   *Tension Point:* Case 7 (Broad consent) vs. Case 1 (Specific omission).
          *   Case 7 allows ignorance of specifics. Case 1 punishes ignorance of specifics.
          *   Distinction: Case 7 is about *future unknown uses* (authorized by trust). Case 1 is about *current known conditions* (withheld information).

  4.  **Drafting the Principle:**
      *   I need a principle that captures **Capacity**, **Disclosure/Materiality**, and **Voluntariness (free from controlling interference)**.
      *   Let's call it the **Principle of Substantial Authorization**.
      *   Core components:
          1.  **Capacity:** Ability to understand and weigh risks (Cases 3, 8).
          2.  **Material Disclosure:** Information that changes the *nature* of the bargain or risk profile must be shared (Cases 1, 6, 7, 10).
          3.  **Non-Control:** Choice must not be controlled by another agent's manipulation or structural power (Cases 2, 4, 9).

