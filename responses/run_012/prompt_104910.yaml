      *   This is the classic "Undue Inducement" vs. "Coercion" debate.
      *   If we say Case 2 is valid (money doesn't coerce) and Case 4 is invalid (prison coerces), the principle must distinguish between *circumstantial pressure* (poverty) and *institutional control* (custody).
      *   *Principle Clause:* "Voluntariness is compromised not by desperate circumstances, but by relationships where the offeror controls the offeree's basic liberties or where refusal carries punitive consequences beyond the study itself."
