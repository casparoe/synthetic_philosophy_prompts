      *   If I force consistency with Case 1 (Bed Nets), Case 5 should be Invalid. Why? Because the "package" of the act was misrepresented.
      *   *Decision:* I must tell the user plainly: Case 5 is likely the one that has to go if they want consistency with Case 1 and 6. In Case 1, omitting the net removal changes the risk/benefit of the trial. In Case 5, lying about sterilization changes the risk/benefit of the sex (pregnancy risk).
      *   *Wait, looking closer:* In Case 1, the omission is about the *study conditions*. In Case 5, it's about a *personal attribute*. However, both affect the risk calculation. I will flag Case 5 as the tension point.

  7.  **Addressing the "Unknown Risk" (Case 10):**
      *   This is the "Assumption of Risk" vs. "Specific Consent" debate.
