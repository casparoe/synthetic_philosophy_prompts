  *(Self-Correction on "Design vs Intentional Autonomy")*: The prompt specifically asks for a crux on whether Design is autonomous or parasitic on Intentional.
  *Thought:* Dennett often treats Design as a subset of Intentional (or vice versa depending on the text). In "Real Patterns," the Intentional Stance is the broadest. The Design stance is often for artifacts.
  *Crux Idea:* Can we have a Design stance without attributing beliefs? (e.g., a heart pumps blood).
