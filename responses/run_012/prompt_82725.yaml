      *   *The Conflict:* Humeanism (Supervenience on events, no modal oomph) vs. Anti-Humeanism (Laws make things happen, modal force).

  3.  **Develop the Carrying Example (The Simulation):**
      *   Needs to separate *code* (governing) from *output* (events).
      *   Needs to separate *compression* (Best System) from *truth*.
      *   *Requirement:* Exceptionless regularity that isn't a law.
          *   *Idea:* A specific accidental coincidence in the simulation output. E.g., "Every time the red avatar jumps, a tree falls." (Correlation, not causation/code).
