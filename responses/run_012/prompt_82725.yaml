          *   Lawlike Exception: The collision code is perfect *except* in one specific corner coordinate where a known buffer overflow causes weird bounces.

  4.  **Structure the 90 Minutes:**
      *   *0-15 min:* Hook & Baseline (The Naive View). Establish the "Laws = Equations" view using the Sim.
      *   *15-30 min:* The Humean Challenge (The Mosaic). Remove access to the code. Force them to reconstruct laws from data only. Introduce the "Exceptionless Coincidence."
