      *   *Exceptionless Non-Law:* "The Sum of Energies is always a Prime Number." True in the log, but not in the code (just a lucky initialization).
      *   *Lawlike Exception:* "Conservation of Momentum." In the code, it's hard-coded. But in the log, at coordinate (0,0), due to a divide-by-zero error handled by a clamp, momentum isn't conserved.
      *   *Why this works:* Humean must say Momentum Conservation is *not* a law (or is a slightly different law) because it's not true in the mosaic. Anti-Humean says it *is* the law (the code) and the mosaic is imperfect.

  8.  **Managing Misconceptions:**
      *   *Pattern vs. Law:* Head off in Phase 2.
      *   *Explanation:* Let ripen until Phase 4.
      *   *Theology:* Head off in Phase 4 (distinguish 'governing' from 'command').
