      *   *60-75 min:* The Standoff. Explanation, Counterfactuals, Governance. Address misconceptions.
      *   *75-90 min:* Diagnostic Question & Scope Limitations.

  5.  **Address Misconceptions (Timing Strategy):**
      *   *Humeanism = Patterns:* Address early (15-30 min) when defining the Mosaic. It's not *any* pattern, it's the *best system*.
      *   *No Governance = No Explanation:* Let this ripen until the Anti-Humean pushback (45-60 min). It's the core objection.
      *   *Anti-Humeanism = Theology:* Address during the Standoff (60-75 min). Distinguish metaphysical necessity from divine will.
      *   *Dispute = Existence of Laws:* Address at the very end. Both agree laws "exist," they disagree on *what they are*.

  6.  **Drafting the Plan - Section by Section:**

      *   *Introduction:* Set the scene. Sim-Alpha.
