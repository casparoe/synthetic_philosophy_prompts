prompt: |-
  Last night a friend and I spent three hours arguing about secession, and we kept returning to an analogy he would not let go of: a state is like a marriage, and secession is like divorce. He had worked it out in some detail. The spouses are the national majority and the aspiring nation; the marriage contract is the constitutional settlement; the prenuptial agreement is the terms of union; alimony is the system of fiscal transfers; the children are those citizens of the departing territory who would rather stay, together with those of the rump who have family and property across the new border; and the divorce court is the constitutional court or the negotiating table. From this he drew three conclusions: that a bare majority in a referendum ought to suffice; that the rest of the state has no veto over the departure; and that the matter is essentially private, so that outsiders — other states, the European Union, the United Nations — have no standing in it. He then produced a flourish I found harder to answer than I expected. Now that England and Wales have moved to no-fault divorce, we no longer think a spouse must prove the other's fault in order to leave, and we no longer think a court should force two people to remain married. On his reading, the Supreme Court of Canada's insistence, in the Quebec reference of 1998, that a clear majority on a clear question triggers a duty to negotiate rather than a right to exit is simply the law refusing to let an unhappy spouse go.

  What I would like is an audit of the analogy, not a verdict on Scottish, Catalan or Quebec politics. Set out the correspondence as explicitly as you can, a table being fine, and then say where it breaks. Two things interest me especially. First, which of the disanalogies genuinely bear on the conclusions he wants and which are merely colourful — whether it matters, for instance, that a marriage is contracted by consenting adults, that children cannot be divided between the parties, or that even a no-fault divorce is unilateral in its grounds but not in its procedure. Second, whether the analogy quietly settles the very question at issue: who has the standing to decide, and whether a union is properly conceived as a contract between two parties rather than as a single political community. Tell me which of his three conclusions survive once the disanalogies are on the table, and which fall. Finally, if the analogy is worth keeping at all, say what it can still be used for, and whether some better comparison — a corporate demerger, the dissolution of a federation, the break-up of a household — does the work he wants without begging the question. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Secession vs. Divorce analogy.
      *   **Context:** A three-hour argument between friends. One friend argues secession is like divorce (specifically no-fault divorce), leading to three conclusions: (1) bare majority suffices, (2) no veto for the rump state, (3) no external standing (private matter).
      *   **Task:** Audit the analogy (not a verdict on specific politics like Scotland/Catalonia/Quebec).
      *   **Requirements:**
          *   Set out correspondence explicitly (table format acceptable).
          *   Identify where it breaks (disanalogies).
          *   Assess which disanalogies matter for the conclusions vs. which are merely colourful.
          *   Address whether the analogy begs the question (standing/contract vs. community).
          *   Evaluate which of the three conclusions survive the audit.
          *   Suggest if the analogy is still useful or if a better one exists (corporate demerger, federation dissolution, household break-up).
          *   **Language:** British English.

  2.  **Deconstruct the Analogy (The "Correspondence"):**
      *   *Spouses:* National Majority vs. Aspiring Nation (Region).
      *   *Marriage Contract:* Constitutional Settlement.
      *   *Prenup:* Terms of Union.
      *   *Alimony:* Fiscal Transfers.
      *   *Children:* Citizens wanting to stay / Cross-border ties.
      *   *Divorce Court:* Constitutional Court / Negotiating Table.
      *   *No-Fault Divorce:* Unilateral desire to leave without proving injustice.

  3.  **Identify Disanalogies (Where it Breaks):**
      *   *Nature of the Entity:* Marriage is private/contractual; State is public/sovereign.
      *   *Consent:* Marriage requires mutual consent to *enter*; States often form through conquest, dynastic union, or complex historical processes, not just individual consent.
      *   *The "Parties":* In marriage, two individuals. In secession, it's often a subset of a population vs. the whole, but the "whole" includes the subset. It's part vs. whole, not party vs. party.
      *   *Externalities:* Divorce affects the couple and kids. Secession affects borders, security, currency, international treaties, neighbours.
      *   *The "Children":* In divorce, custody is decided *for* the children. In secession, the "children" are adult citizens with voting rights.
      *   *Termination:* Divorce ends legal ties (mostly). Secession creates new international boundaries and ongoing interdependence (water, energy, defence).
      *   *Standing:* Divorce is private law. Secession is public/constitutional/international law.

  4.  **Evaluate the Three Conclusions against Disanalogies:**
      *   *Conclusion 1: Bare Majority Suffices.*
          *   Marriage: Yes, one spouse can file.
          *   State: Constitutional change usually requires supermajorities or complex ratification because it alters the fundamental structure for *everyone*, not just the leaver.
          *   *Verdict:* Analogy weakens this. The "part vs. whole" issue matters.
      *   *Conclusion 2: No Veto for Rump State.*
          *   Marriage: Court can't force marriage (specific performance not granted).
          *   State: The rump state has sovereign interests (territorial integrity, debt, assets). International law (UN Charter) favours territorial integrity.
          *   *Verdict:* Analogy fails here. The state has a legitimate interest in its own continuity that a spouse does not have in remaining married.
      *   *Conclusion 3: No External Standing.*
          *   Marriage: Private matter.
          *   State: International borders, recognition, EU/NATO membership, human rights of minorities.
          *   *Verdict:* Analogy fails completely. Secession is inherently international.

  5.  **Address the "Begging the Question" Aspect:**
      *   The analogy assumes the state is a *contract* between two distinct parties.
      *   Constitutional theory often views the state as a *single political community* or an indissoluble union (depending on the constitution).
      *   By framing it as divorce, the friend assumes the right to exit exists inherently. But the legal question is *whether* that right exists. The analogy presupposes the conclusion.

  6.  **Assess Utility and Alternatives:**
      *   *Is it useful?* Yes, for explaining the *emotional* and *negotiation* dynamics (asset division, ongoing relationships). It humanises the process.
      *   *Better Analogies:*
          *   *Corporate Demerger:* Shareholders, assets, liabilities, regulatory approval. Closer to legal/financial reality.
          *   *Dissolution of a Partnership:* Similar to demerger but implies fiduciary duties.
          *   *Amputation:* (Too visceral?) Highlights the organic unity.
          *   *Condominium/Tenancy in Common:* Shared ownership of property.
          *   *Best Fit:* **Corporate Demerger/Spin-off.** It captures the asset division, the shareholder approval (referendum), the regulatory oversight (courts/international bodies), and the fact that it's not purely unilateral.

  7.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Analytical, philosophical, polite but rigorous.
      *   *Structure:*
          1.  Introduction (acknowledging the potency of the analogy).
          2.  The Table of Correspondence.
          3.  The Breakdown (Disanalogies).
          4.  Impact on Conclusions (The Audit).
          5.  The Question-Begging Charge.
          6.  Alternative Analogies.
          7.  Conclusion.
      *   *Spelling/Grammar:* British (e.g., "programme", "centre", "defence", "analyse", "colourful").

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "no-fault" point specifically? *Yes, need to mention that while grounds are unilateral, the *order* is judicial.*
      *   *Check:* Did I address the "children" point? *Yes, the agency of the 'children' (citizens) is crucial.*
      *   *Check:* Ensure I don't take sides on Scotland/Quebec. *Keep it theoretical.*
      *   *Nuance:* The friend's analogy is strong on *moral* intuition (freedom of association) but weak on *constitutional* reality. I need to make sure that distinction is clear.
      *   *Key Insight:* The "private vs. public" distinction is the killer. Divorce is private law; Secession is public/constitutional law.

  9.  **Final Polish:** Check against the prompt's specific requests.
      *   Audit, not verdict? Yes.
      *   Table? Yes.
      *   Which disanalogies bear on conclusions? Yes.
      *   Does it beg the question? Yes.
      *   Which conclusions survive? (Likely none fully, but maybe the duty to negotiate).
      *   Better comparison? (Demerger).
      *   British English? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Your friend's analogy is seductive because it appeals to a liberal intuition about freedom of association: if two people cannot be forced to love one another, why should a people be forced to remain in a political union? It frames secession as a matter of liberty rather than sovereignty. However, as you suspect, the analogy is doing heavy lifting that it may not be entitled to. It smuggles in assumptions about the nature of the state under the guise of a domestic comparison.

  Below is an audit of the analogy, structured as you requested.

  ### I. The Correspondence

  | Feature | The Marriage Analogy | The Political Reality |
  | :--- | :--- | :--- |
  | **The Parties** | Two spouses (individuals). | The rump state and the seceding region (collectivities). |
  | **The Bond** | Voluntary contractual union (marriage). | Constitutional order (often historical, organic, or coerced). |
  | **The Terms** | Prenuptial agreement / Marriage vows. | Constitution / Act of Union / Treaty. |
  | **The Grounds** | No-fault (irretrievable breakdown). | Political will (referendum result). |
  | **The Process** | Filing for divorce / Court decree. | Negotiation / Constitutional amendment / Recognition. |
  | **The Assets** | Matrimonial pot (house, savings). | Public assets (infrastructure, debt, currency, archives). |
  | **The Dependents** | Children (custody determined by adults). | Citizens (adults with rights, minorities, cross-border families). |
  | **The Authority** | Family Court (private law). | Constitutional Court / International Community (public law). |
  | **The Outcome** | Two separate households. | Two sovereign states (new borders, international standing). |

  ### II. Where the Analogy Breaks

  The disanalogies fall into two categories: those that are merely colourful (rhetorical flourishes) and those that are structural (bearing directly on the legal and political conclusions).

  **1. Merely Colourful Disanalogies**
  *   **Emotional Intimacy:** That spouses share a bed while citizens share a tax bracket is a difference in kind, but it does not necessarily alter the *right* to separate.
  *   **The 'Children' as Minors:** Your friend likens citizens to children. This is rhetorically powerful but factually false. The 'children' in secession are voting adults. However, the *protection* of vulnerable minorities functions similarly to custody arrangements, so the analogy holds some weight regarding the duty of care during separation.
  *   **Fault:** The move to no-fault divorce is a strong parallel for the idea that a region need not prove oppression to leave. This is the strongest part of your friend's case.

  **2. Structural Disanalogies (The Critical Failures)**
  *   **Private vs. Public Law:** Divorce is a private law matter; secession is a matter of public constitutional and international law. A divorce decree binds the couple; a secession settlement binds everyone within the territory, including those who voted against it.
  *   **Parties vs. Parts:** In a marriage, the spouses are distinct entities entering a union. In a state, the seceding region is a *part* of the whole, not a separate party contracting with it. You cannot unilaterally sever a limb without the consent of the body, because the body's integrity is compromised.
  *   **Externalities:** A divorce primarily affects the couple and their children. Secession alters borders, defence perimeters, currency zones, and treaty obligations. It creates immediate externalities for neighbours and international bodies.
  *   **Specific Performance:** In law, a court will not order 'specific performance' of a marriage contract (forcing cohabitation). However, states *do* enforce territorial integrity. The state claims a monopoly on force and borders; it is not merely a contract but a sovereign entity.

  ### III. Audit of the Three Conclusions

  Here we assess whether your friend's conclusions survive the structural disanalogies.

  **Conclusion 1: A bare majority in a referendum ought to suffice.**
  *   **Verdict:** **Fails.**
  *   **Reasoning:** In a divorce, one spouse can file; it is unilateral. But a state constitution is not a simple contract; it is the foundational rulebook for *all* citizens. Changing the boundaries of the polity affects the rights of the minority in the seceding region and the citizens of the rump state. Therefore, constitutional theory usually demands a higher threshold (supermajority, dual majority, or parliamentary ratification) than simple contract law. The marriage analogy ignores that the 'contract' binds third parties (the remaining citizens) who are not direct signatories to the divorce.

  **Conclusion 2: The rest of the state has no veto over the departure.**
  *   **Verdict:** **Fails.**
  *   **Reasoning:** In divorce, the respondent cannot veto the dissolution, only the terms. In secession, the rump state has a legitimate interest in its own continuity and territorial integrity, recognised in international law (e.g., the UN Charter). While a state cannot ethically hold a population by force indefinitely, it retains the legal standing to negotiate the *terms* of exit, which effectively grants a veto over the *manner* and *feasibility* of exit. The Supreme Court of Canada's ruling (duty to negotiate, not right to exit) aligns with this: the rump state is a stakeholder, not merely a spurned spouse.

  **Conclusion 3: Outsiders have no standing (it is a private matter).**
  *   **Verdict:** **Fails Completely.**
  *   **Reasoning:** This is the weakest link in the analogy. Divorce is private; secession creates a new subject of international law. Recognition by other states, membership of bodies like the EU or UN, and adherence to human rights conventions are intrinsic to statehood. If the 'divorce' violates the rights of minorities or destabilises a region, the 'neighbours' (other states) have a profound interest. The analogy collapses because statehood is inherently relational and public, whereas marriage is inherently private.

  ### IV. Does the Analogy Beg the Question?

  Yes, profoundly.

  Your friend's analogy presupposes the very thing that is in dispute: **the nature of the union.**
  By defining the state as a marriage, he defines it as a voluntary contract between distinct parties. If the state is a contract, then naturally there must be a right to terminate it. However, many constitutional traditions view the state not as a contract, but as an indissoluble political community or a trust held for future generations.

  If the state is a *community*, secession is not a divorce; it is an amputation or a schism. By using the marriage analogy, your friend bypasses the constitutional question of *who has the standing to decide* and assumes the aspiring nation has the same standing as the rump state. It frames the conflict as bilateral (State vs. Region) when constitutionally it is often internal (The People vs. A Subset of the People).

  Furthermore, regarding procedure: even in no-fault divorce, the process is not purely unilateral. One party files, but a judge must grant the decree. The court ensures financial provision and child welfare are met. Your friend cites no-fault divorce to argue for unilateral *exit*, but ignores that the *procedure* remains judicial and regulated. The Canadian *Quebec Reference* mirrors this: the desire to leave is unilateral (the referendum), but the effect requires a regulated process (negotiation).

  ### V. Utility and Alternatives

  **Is the analogy worth keeping?**
  Only as a rhetorical device to explain the *emotional* difficulty of separation and the necessity of dividing assets fairly. It is useful for discussing the *post-secession relationship* (trade, travel, family ties), where the 'divorced couple' dynamic is apt. It is useless for determining the *right* to secede.

  **Better Comparisons:**

  1.  **Corporate Demerger (Spin-off):**
      *   *Why it works:* A subsidiary wishes to become a standalone company. It requires shareholder approval (referendum), board approval (parliament/rump state), and regulatory clearance (courts/international bodies). Assets and liabilities must be audited and split. Creditors (bondholders/citizens) must be protected.
      *   *Outcome:* This undermines all three of your friend's conclusions. A demerger cannot happen by a bare majority of the subsidiary's staff; it requires the parent company's agreement and regulatory oversight.

  2.  **Dissolution of a Partnership:**
      *   *Why it works:* Partners share fiduciary duties. One partner cannot simply walk away with the client list and leave the other with the debts. There is a duty of good faith.
      *   *Outcome:* This supports the Canadian view: a clear vote triggers a duty to negotiate in good faith, not an automatic right to walk away.

  3.  **The Break-up of a Household (Tenancy in Common):**
      *   *Why it works:* If two people own a house together, one cannot force a sale without legal process, and the value must be realised and split.
      *   *Outcome:* This highlights the property aspect but still lacks the sovereign element.

  **Recommendation:**
  The **Corporate Demerger** is the most robust analogy. It captures the complexity of asset division, the need for regulatory approval, the rights of stakeholders (citizens/creditors), and the fact that while a part can become independent, it cannot do so without settling accounts with the whole. It removes the emotional baggage of 'love' and 'fault' and replaces it with 'viability', 'equity', and 'procedure'.

  ### Summary

  Your friend's analogy is intellectually elegant but constitutionally brittle. It survives only so long as one ignores the distinction between private contract and public sovereignty. Once that distinction is enforced, none of his three conclusions hold water. The marriage analogy assumes the right to exit to prove the right to exit. A corporate demerger or partnership dissolution offers a sterner, more accurate comparison: it acknowledges the desire to separate while insisting that the terms of that separation are a matter for all stakeholders, not just the departing party.
