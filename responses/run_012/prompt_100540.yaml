  The phenomenon you describe is indeed recognised in philosophy, though it is often obscured by the colloquial misuse of terms like the "Rashomon effect". Your instinct is correct: the Rashomon effect, as commonly understood in pop culture, implies a radical subjectivity where truth is inaccessible and all accounts are equally unreliable. Your requirement is more robust: you seek a framework where accounts are incompatible yet both truthful, grounded in specific positions, and constitutive of a whole without being dissolved into a synthesis.

  The established philosophical account that best carves out this phenomenon is **Situated Knowledges**.

  While the broader historical tradition is known as **Perspectivism** (associated with Nietzsche), that term has acquired relativist connotations that you rightly wish to avoid. **Situated Knowledges**, a concept most rigorously developed by the philosopher Donna Haraway, offers the specific "carving" you require. It distinguishes itself from both the "God trick" of objectivism (the view from nowhere) and the relativism of pure subjectivity (the view from anywhere).

  Here is the carving of the phenomenon, organised according to your requirements:

  **What the phenomenon is**
  It is the epistemological condition that all knowledge is produced from a specific position in time, space, and social relation. A standpoint is not a distortion of the truth, but the very means by which truth is accessed. In your scene, the quarrel is not a single object that is partially obscured; rather, the quarrel *is* the sum of its interactions, and each character accesses a different facet of those interactions based on their position. The "whole truth" is not a third, neutral summary, but the critical juxtaposition of these partial accounts.

  **What it is not**
  *   **It is not Relativism:** Relativism suggests that all accounts are equally valid simply because they exist. Situated Knowledges argues that some accounts are *better* than others because they are more accountable. A standpoint is not legitimate merely because someone holds it; it is legitimate because it is grounded in a specific "reason to notice".
  *   **It is not Objectivism:** It rejects the idea that there is a single, perspective-free description of reality (the "view from nowhere"). Any claim to such a view is considered a fiction that hides its own biases.
  *   **It is not Hegelian Synthesis:** It does not seek to resolve the contradiction into a higher unity (thesis-antithesis-synthesis). The tension between the accounts is preserved; the truth lies in the *connection* between them, not the cancellation of their differences.

  **How the standpoints are organised**
  This is the crucial mechanism for your novel. In this framework, legitimacy is determined by **critical positioning** and **accountability**.
  1.  **Reason to Notice:** A standpoint is legitimate if the character's position (social, physical, emotional) affords them access to specific data that others cannot see. For example, a character standing near the door hears the tone of voice; a character facing the window sees the body language. Neither is arbitrary; both are determined by their location.
  2.  **Accountability:** A standpoint is stronger if the knower acknowledges their limitation. In narrative terms, a character who admits "I only saw this much" offers a more reliable truth than one who claims "This is exactly what happened."
  3.  **Connection:** The standpoints combine not by merging, but by mapping the relations between them. The truth emerges from understanding *why* the accounts differ. The gap between the two stories is not an error to be corrected, but a feature of the reality being described.

  **Where its edges lie**
  The edge of this phenomenon is reached when a standpoint claims to be universal. If a character insists their account is the *only* truth, they have crossed from situated knowledge into dogma. Conversely, the edge is also reached if the accounts are so disparate that no relation can be drawn between them; there must be a shared reality (the quarrel) that anchors the perspectives, even if it is never seen directly.

  While **Perspectivism** is the broader historical label, **Situated Knowledges** is the precise term that accounts for the organisation, legitimacy, and non-relativist nature of the truth-claims you are constructing.

  \answer{Situated Knowledges}
