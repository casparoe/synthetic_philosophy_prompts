      *   **(2) Surrogate Goal:** "Adopt a goal no threatener could profit from manipulating."
          *   *Pros:* Makes you an uninteresting target. If the threatener wants $X$, and you only care about $Y$ (where $Y$ doesn't help them), they can't threaten you effectively.
