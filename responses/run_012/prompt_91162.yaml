      *   **Problem:** "Mugged by a ghost." This is essentially a variation of *Roko's Basilisk* or *Acausal Trade/Threats* within the framework of Functional Decision Theory (FDT) or Updateless Decision Theory (UDT). The core tension is between causal independence (the ghost can't touch me) and logical correlation (the ghost models me).
