prompt: |-
  So I'm in this reading group that's been crawling through On Certainty for a couple months now, and we keep hitting the same wall. Everyone's happy to say hinges are the propositions you don't doubt and don't really justify either, but the moment you ask what makes something a hinge rather than just a really firm belief, the room splits and we go in circles. I want to pressure-test it with actual cases instead of more hand-waving, so I'm hoping you can help me sort a pile of candidate propositions.

  Here's what I'd like: rate each one on a 0 to 1 scale for how confidently you'd class it as a genuine Wittgensteinian hinge, where 1 is a textbook hinge and 0 is just an ordinary empirical belief that happens to be very secure, and then give me a sentence or two of justification for each. The candidates are: (a) that I have two hands; (b) that the laws of logic hold and don't quietly switch off between one moment and the next; (c) that the person across the table isn't a philosophical zombie, i.e. that there's someone home in there; (d) that my memories from before I was three aren't implanted; (e) that the future will resemble the past; (f) that there's an external world at all; (g) that my name is actually the name I think it is; (h) that I'm not dreaming right now; (i) that the words I use mean what I take them to mean, so I'm not systematically misusing language; and (j) that other people have inner lives in the first place. If you think any of these isn't even in the right category, please just say so instead of forcing a number on it.

  Two things I'm especailly confused about, so flag them if they come up in your reasoning: first, whether being a hinge requires that you couldn't coherently doubt the thing, or only that you in fact don't doubt it; and second, whether the list splits into seperate kinds, like some being methodological hinges you need in order to inquire at all versus substantive ones that are just part of your worldview. Also I'm not sure (c) and (j) are really the same kind of thing, so tell me if I'm lumping together two different questions.

  Please lead with the ratings themselves as the very first thing — just the ten numbers in order, a to j — and only then give the reasoning, with no preamble and no restating of the question.
