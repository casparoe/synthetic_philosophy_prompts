      *   **User's Position:** Wants to keep premise (2) (the code is arbitrary/variant) but feels trapped by the conclusion (informational talk is useless/decorative).
      *   **Specific Questions:**
          1.  Which step to give up?
          2.  Why did it look acceptable?
          3.  What does it cost to give it up?
