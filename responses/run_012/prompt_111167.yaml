answer: |-
  1.  **Fix Phenomenology:** Establish pre-theoretical agreement that pain experience comprises two dissociable components: sensory-discriminative (location, intensity) and affective-motivational (unpleasantness, urge to withdraw). This must be accepted by both disciplines as data before theory begins.
  2.  **Fix the Axiological Question:** Separate the ontology of pain ("What is it?") from the axiology of pain ("Why is it bad?"). Frame the live debate: Is badness intrinsic to the sensory quality, or extrinsic (dependent on the affective response)?
  3.  **Introduce Asymbolia:** Present the clinical dissociation. Sensory component intact; affective component absent. This case cannot work until Steps 1 and 2 secure the terminology and the stakes.
  4.  **Draw the Inference:** Conclude that since pain sensation persists without unpleasantness, unpleasantness is not essential to pain's identity but is essential to pain's badness. The case bears on axiology, not ontology.

  **Carrying Example**
  **Winner:** The described asymbolic patient (reports pain, localizes, no withdrawal, doesn't mind).
  **Why:** It anchors the debate in empirical reality. Philosophers cannot dismiss it as impossible; residents cannot dismiss it as merely semantic. It forces the "Is it still pain?" question immediately.
  **Requirements:** Must verify intact nociception/localization (proving sensation remains) and intact comprehension (proving indifference is not confusion). Must not show global apathy.
  **Losers:** The first-person thought experiment is too speculative for residents and invites skepticism about possibility. The reverse lesion case (unpleasantness survives, sensory degraded) confuses the specific question of badness with sensory degradation, muddying the dissociation required for the argument.

  **Misconceptions**
  1.  **"No care = No pain" (Philosophers):** Defuse in **Step 1**. Stipulate that for the sake of argument, "pain" refers initially to the sensory event, pending the axiological conclusion. Do not let them define pain by its badness prematurely.
  2.  **"Lesion location explains everything" (Residents):** Defuse in **Step 4**. Emphasize that identifying the lesion (e.g., insula vs. cingulate) does not answer the normative question of value. Localization is not explanation of badness.
  3.  **"Affect vs. Significance":** Address in **Step 3**. Clarify that asymbolia is a failure of motivational significance, not just raw emotion. If read merely as affective failure, badness reduces to fright; if read as significance failure, badness relates to bodily integrity. This distinction predicts different lessons about value.

  **Exclusions**
  Openly refuse to cover specific neuroanatomical debates (e.g., precise insula subregions) and general theories of consciousness. Flag these as distinct from the axiological question. State clearly: "We are not mapping the brain today; we are mapping the value."

  **Closing Question**
  "If pain's badness were intrinsic to the sensory quality, what would the asymbolic patient have to report about the sensation they currently claim not to mind?"
