prompt: |-
  I am convening a two-year working group on the epistemology of conspiracy theories — myself, two other philosophers, two social psychologists, and a journalist who covers disinformation — and the first meeting is where we decide what the two years are for. The field as I read it supports two enterprises: arguing over how to define the category without begging the question against conspiracies that turn out to be real, and arguing over whether conspiracy belief is a distinctive epistemic failing or simply ordinary error sustained by bad evidence. I want to put a third possibility in front of the group, without assuming it survives scrutiny: that both enterprises aim at the wrong object, because much of what gets called conspiracy belief is not a report of what the speaker takes to be true but a performance — an assertion whose work is to mark allegiance, test loyalty, or announce that one is not fooled — and an epistemology built to assess the first thing cannot assess the second.

  Which questions should a group like ours take up, and in what order? We will commit to three as the spine of the project, so the ordering is not a formality. I want the reasoning more than the inventory: which questions are upstream of which; which are tractable in two years for people with our mix of skills; which would change something downstream — how we teach, how platforms moderate, how journalists report — and which are fashionable but would matter little even if settled. Tell me what would move a question up or down the list, and which part of the framing above you would abandon first.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A philosopher convening a two-year working group.
      *   **Group Composition:** 3 Philosophers (including the user), 2 Social Psychologists, 1 Journalist (disinformation specialist). Total: 6 people.
      *   **Topic:** Epistemology of Conspiracy Theories.
      *   **Current Field Status:** Two main enterprises (Definition problems, Epistemic failing vs. ordinary error).
      *   **User's Proposed Third Option:** Conspiracy belief as *performance* (allegiance, loyalty, signaling) rather than truth-claim.
      *   **Goal:** Decide on three "spine" questions for the two-year project, ordered by priority/logic.
      *   **Requirements:** Explain reasoning (upstream/downstream), tractability for this specific mix, impact on practice (teaching, moderation, reporting), and identify what framing to abandon.

  2.  **Deconstruct the User's Proposal:**
      *   The user wants to pivot from "Is it true/false?" or "Is it rational/irrational?" to "What is this speech act *doing*?"
      *   This is a pragmatic/functionalist turn. It challenges the core assumption of epistemology (which usually deals with belief as a representation of reality).
      *   *Strength:* Aligns well with social psychology (group identity) and journalism (narrative/audience).
      *   *Risk:* Might dissolve the epistemological project entirely. If it's not about truth, is it still epistemology? Or is it political science/sociology?

  3.  **Brainstorming Potential Questions:**
      *   *Definition:* What counts as a conspiracy theory? (The "begging the question" problem).
      *   *Psychology:* Why do people believe? (Cognitive biases vs. motivated reasoning).
      *   *Function:* What does believing *do*? (Social bonding, identity signaling).
      *   *Normativity:* Should we debunk? Engage? Ignore?
      *   *Institutional:* How do platforms/journalists handle this?
      *   *The User's Twist:* Is it belief or performance?

  4.  **Selecting the Three Spine Questions:**
      *   *Constraint:* Must be doable in 2 years by this specific team.
      *   *Constraint:* Must have downstream impact.
      *   *Constraint:* Must address the User's "Performance" hypothesis without necessarily accepting it as dogma immediately.

      *   *Candidate 1 (Upstream):* The Ontology/Definition Question. (Is it belief or performance?)
          *   *Why:* If it's performance, standard epistemology fails. This needs to be settled (or at least mapped) first.
          *   *Fit:* Philosophers (speech act theory), Psychologists (identity), Journalist (audience engagement).
      *   *Candidate 2 (Midstream):* The Normative/Intervention Question. (How do we respond?)
          *   *Why:* If we know what it *is*, how do we deal with it? Debunking works on truth-claims, not loyalty signals.
          *   *Fit:* Journalist (reporting), Psychologists (intervention), Philosophers (ethics of belief).
      *   *Candidate 3 (Downstream):* The Institutional/Structural Question. (Ecology of information.)
          *   *Why:* Context matters. Platforms incentivize performance.
          *   *Fit:* Journalist (platforms), Psychologists (social dynamics).

      *   *Refinement:* Let's make them sharper.
          1.  **The Functional Question:** Is conspiracy discourse primarily doxastic (about belief) or pragmatic (about social function)?
          2.  **The Normative Question:** If it's pragmatic, what are the ethical/epistemic norms for engagement? (i.e., When is "loyalty signaling" epistemically vicious?)
          3.  **The Ecological Question:** How do information environments amplify the pragmatic function over the doxastic function?

  5.  **Ordering and Reasoning:**
      *   *Order:* Functional -> Normative -> Ecological.
      *   *Reasoning:* You can't know how to judge it (Normative) until you know what it is (Functional). You can't fix the environment (Ecological) until you know what behavior you are trying to mitigate or support (Normative).
      *   *Tractability:* 2 years is short. Deep empirical work is hard. Conceptual clarification + reviewing existing lit + targeted interviews/case studies is better.
      *   *Impact:* Changes debunking strategies (Journalist), changes moderation policies (Platforms), changes how we teach critical thinking (Philosophers).

  6.  **Addressing the "Framing to Abandon":**
      *   The user asks which part of *their* framing to abandon first.
      *   *Critique:* The dichotomy between "report of truth" and "performance" might be too sharp. People often do both simultaneously. A pure performance view risks paternalism ("They don't *really* believe it, they're just acting").
      *   *Advice:* Abandon the *exclusivity* of the performance hypothesis. Treat it as a spectrum or a hybrid.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic but pragmatic, respectful of the interdisciplinary nature.
      *   *Structure:*
          1.  Validate the "Performance" pivot (it's strong).
          2.  Propose the 3 Questions (with ordering logic).
          3.  Explain the "Move Up/Down" criteria.
          4.  Identify the Framing to Abandon.
      *   *Specifics:* Ensure the roles (Psych, Phil, Journo) are utilized.
          *   Phil: Speech acts, norms.
          *   Psych: Identity, motivated reasoning.
          *   Journo: Real-world cases, platform mechanics.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer "which questions are upstream"? Yes.
      *   *Check:* Did I address "tractable in two years"? Need to emphasize *conceptual* work backed by *existing* data, not new longitudinal studies.
      *   *Check:* Did I address "downstream impact"? Yes (moderation, reporting).
      *   *Check:* Did I answer "what framing to abandon"? Yes (the strict dichotomy).
      *   *Refinement on Q1:* Make sure it doesn't just become a sociology project. Keep the *epistemology* angle. How does the function affect the *evaluation* of knowledge claims?

  9.  **Final Polish:** Ensure the distinction between "belief" and "allegiance" is clear but nuanced. Emphasize that if the user's hypothesis holds, the definition debate (Enterprise 1) and the rationality debate (Enterprise 2) are both category errors. This validates the user's intuition while adding necessary guardrails.

  **(Self-Correction Note):** I need to be careful not to just say "Yes, you're right." The user asked for scrutiny. The "Performance" hypothesis is trendy (akin to "post-truth"). I need to warn that if *everything* is performance, epistemology dissolves. The group needs to find the boundary where performance *becomes* belief that causes harm.

  10. **Finalizing the Three Questions:**
      1.  **The Speech Act Question:** (Function)
      2.  **The Normative Question:** (Evaluation)
      3.  **The Structural Question:** (Environment)

      *Wait, let's tighten the Normative one.* If it's performance, standard epistemic norms (truth, justification) don't apply directly. We need norms for *social* epistemology. Let's call it "The Evaluation Question."

      *Let's tighten the Structural one.* Focus on the *incentives*.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated pivot. Your intuition—that the current debate is stuck because it treats conspiracy discourse as a failed science rather than a successful social ritual—aligns with emerging work in social epistemology and linguistic pragmatics. However, if you adopt this too rigidly, you risk dissolving the epistemological project entirely. If nothing is about truth, there is no epistemology, only sociology.

  Given your team's composition (heavy on theory and psychology, light on empirical data collection) and the two-year constraint, you cannot solve the definition problem (Enterprise 1) or the rationality problem (Enterprise 2) in the traditional sense. You must bypass them.

  Here are the three spine questions I recommend, ordered by logical dependency and tractability, followed by the criteria for ordering and the framing element you should abandon.

  ### The Three Spine Questions

  **1. The Functional Question (Upstream)**
  *To what extent is conspiracy discourse a doxastic attitude (a claim about the world) versus a pragmatic speech act (a claim about the speaker's social position)?*
  *   **Why First:** This is the metaphysical/ontological groundwork. If the primary function is loyalty signaling, then measuring the belief against evidence (Enterprise 2) is a category error, like judging a handshake by its aerodynamic efficiency.
  *   **Team Fit:** Philosophers analyze speech act theory; Psychologists bring data on social identity and motivated reasoning; the Journalist provides case studies where public adherence to a theory contradicted private behavior.
  *   **Downstream Impact:** If the answer is "mostly pragmatic," debunking (fact-checking) is the wrong intervention. This changes moderation policy from "remove falsehoods" to "disrupt coordination signals."

  **2. The Normative Question (Midstream)**
  *If conspiracy discourse functions as social performance, what are the appropriate epistemic norms for evaluating it?*
  *   **Why Second:** Once you establish the function, you must determine if that function is epistemically vicious. Signaling loyalty isn't inherently bad (scientific communities do it). But when does loyalty signaling crowd out truth-tracking to the point of democratic harm?
  *   **Team Fit:** Philosophers handle the normative framework; Psychologists assess the cognitive costs of maintaining the performance; the Journalist identifies where this harm manifests in public discourse.
  *   **Downstream Impact:** This dictates how we teach critical thinking. Do we teach students to check facts, or to recognize when they are being asked to perform allegiance?

  **3. The Ecological Question (Downstream)**
  *How do information environments (algorithms, media incentives) select for the performative function over the doxastic function?*
  *   **Why Third:** You cannot answer this without knowing *what* is being selected (Q1) and *why it matters* (Q2). This moves from the nature of the belief to the structure of the ecosystem.
  *   **Team Fit:** The Journalist leads here on platform mechanics; Psychologists on reinforcement schedules; Philosophers on the ethics of design.
  *   **Downstream Impact:** Directly informs platform design and regulatory frameworks. It shifts the focus from "user error" to "systemic incentive."

  ### Reasoning for the Order

  **Upstream vs. Downstream:**
  Question 1 is strictly upstream. If you attempt Q3 (Ecology) before settling Q1 (Function), you risk optimizing platforms to stop "false beliefs" when the users aren't actually holding beliefs in the standard sense. You would be solving the wrong problem. Q1 determines the *object* of study; Q2 determines the *standard of judgment*; Q3 determines the *context of propagation*.

  **Tractability (The Two-Year Constraint):**
  *   **Q1 is tractable** because it is primarily conceptual and interpretive. You do not need a new longitudinal study; you need to synthesize existing psychological data on identity-protective cognition with philosophical analysis of assertion.
  *   **Q2 is tractable** because it is normative. You are building a framework, not testing a drug.
  *   **Q3 is the riskiest** for a two-year timeline because platform data is opaque. However, by placing it last, you can treat it as a "recommendations" phase based on the findings of Q1 and Q2, rather than promising a definitive empirical map of algorithmic causality.

  **Impact vs. Fashion:**
  *   **Move Up:** Any question that clarifies the *intervention*. The field is saturated with descriptions of *why* people believe. It is starved for clear guidance on *how to respond* if the belief is actually a badge. Q1 and Q2 move up because they directly challenge the "debunking" industry.
  *   **Move Down:** Any question that seeks a universal definition of "conspiracy theory." This is the tar pit of Enterprise 1. It is fashionable to argue about definitions, but it matters little for practice. A police officer, a teacher, and a moderator all need to handle the *behavior*, not the definition. Push definition work to the margins; focus on function.

  ### The Framing to Abandon

  You should abandon the **strict dichotomy between "report of truth" and "performance."**

  **Why:**
  If you argue that conspiracy belief is *not* a report of what the speaker takes to be true, you invite the charge of paternalism. You are effectively telling the subjects, "You don't really believe what you say you believe; you're just acting." This is empirically fragile and ethically fraught. Many conspiracists *do* believe, and the performance *reinforces* the belief.

  **The Adjustment:**
  Reframe Q1 not as "Is it A or B?" but as **"What is the ratio of doxastic commitment to pragmatic function, and how do they interact?"**

  Sometimes the performance *creates* the belief (self-signaling). Sometimes the belief is used instrumentally for performance. If you treat them as mutually exclusive, the psychologists in your group will push back (because motivated reasoning shows both are present), and you will lose the nuance required to answer Q2 (Norms).

  If you keep the dichotomy, you risk creating a theory that explains everything in the abstract but nothing in the specific. If you treat it as a dynamic interplay, you preserve the epistemological stakes: even if a claim is used for performance, if it begins to dictate policy or health behavior, it *becomes* a truth-claim by consequence, and epistemology re-engages.

  ### Summary of Strategy
  1.  **Start with Function (Q1):** Validate your intuition that performance is central, but don't let it erase belief entirely.
  2.  **Derive Norms (Q2):** Figure out how to judge a speech act that is half-lie, half-handshake.
  3.  **Diagnose Ecology (Q3):** Explain why the modern media environment favors the handshake over the lie.

  This order ensures that by the end of year two, you aren't just another group arguing about what a conspiracy theory *is*, but a group that has produced a functional manual for how to *engage* with them.
