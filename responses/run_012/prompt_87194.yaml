answer: |-
  You have identified a genuine and distinct argumentative pattern that is often conflated with its conclusion. While there is no single, canonical term like *Modus Ponens* that covers this move across both General Relativity (Gödel) and Quantum Gravity (Wheeler-DeWitt), it is a recognized structure in the philosophy of physics.

  In the literature, this move is often fragmented: in relativity, it is loosely called **"Gödel's Philosophical Argument"**; in quantum gravity, it is referred to as **"The Timeless Interpretation"** or **"The Frozen Formalism Inference."**

  However, to capture the *inference pattern* itself—the logical step from "no time in the fundamental math" to "no time in reality"—the most precise label is **The Fundamental Absence Inference** (or sometimes **Formalism-Driven Eliminativism**).

  Here is the carving of the move, the premises it requires, and how to distinguish it from related arguments.

  ### 1. The Structure of the Move
  The inference pattern relies on three specific steps. You can identify it in a text when you see these three claims linked:

  1.  **The Fundamentality Premise:** A specific physical formalism $T$ (e.g., GR solutions, the Wheeler-DeWitt equation) provides the complete and fundamental description of reality.
  2.  **The Absence Premise:** Formalism $T$ lacks a specific structural feature $F$ (e.g., a global time parameter, a preferred foliation, or a non-zero Hamiltonian).
  3.  **The Eliminativist Conclusion:** Therefore, the phenomenon corresponding to $F$ (e.g., temporal passage, objective becoming) is not fundamental, is emergent, or is an illusion.

  **The Logical Form:**
  $$ \text{Reality} \approx \text{Fundamental Formalism} $$
  $$ \text{Formalism lacks } X $$
  $$ \therefore \text{Reality lacks } X $$

  ### 2. The Hidden Premise: "Formalism Realism"
  The move only works if one accepts a specific metaphysical commitment, often left implicit. This is the **Principle of Formal Completeness** (or **Physicalist Fundamentalism**).

  *   **Definition:** If a feature is ontologically real/fundamental, it must be represented explicitly as a structural element (a variable, parameter, or invariant) in the fundamental physical theory.
  *   **Why it matters:** This is what allows the author to jump from the *math* (no $t$ variable) to the *metaphysics* (no passage). Without this premise, one could argue that time is real but *not* captured by that specific formalism (e.g., time is primitive, or time is emergent but robust).

  ### 3. Proposed Name: "The Fundamental Absence Inference"
  Since you asked for a term to track this specific move, I recommend using **The Fundamental Absence Inference**.

  *   **Why this name?** It distinguishes the *argument* from the *conclusion*. "Eternalism" or "Block Universe" is the destination; "Fundamental Absence" is the vehicle.
  *   **Usage:** "He isn't just asserting eternalism; he's making the **Fundamental Absence Inference** based on the Wheeler-DeWitt equation."
  *   **Alternative:** In contexts where the focus is on the global structure (like Gödel), it is sometimes called **The Global Slicing Argument**, but that is too specific to relativity. **Fundamental Absence** covers both the "no global slice" (Gödel) and "no parameter at all" (QG) cases.

  ### 4. Distinction from the "Relativity of Simultaneity" Argument
  You correctly noted this is not the standard Relativity of Simultaneity argument (often associated with Putnam or Rietdijk). Here is the distinction:

  *   **The Putnam/Rietdijk Argument:** Relies on **local observer disagreement**. Because two observers moving relative to each other disagree on what is "now," there can be no unique, objective present.
      *   *Focus:* Epistemic/Observer-dependent simultaneity.
  *   **The Fundamental Absence Inference (Your Target):** Relies on **global structural absence**. Even if we take a "God's eye view" of the entire spacetime manifold or wavefunction, the structure required to support passage (a global linear ordering or a time parameter) is missing.
      *   *Focus:* Ontological/Structural features of the model itself.

  ### 5. When is it a Good Inference vs. a Conflation?
  As a philosopher, you will want to evaluate the validity of this move. It is generally considered valid *if and only if* you accept the Fundamentality Premise. Critics (like Tim Maudlin, Craig Callender, or Emily Adlam) attack the move in two ways:

  1.  **Attacking the Fundamentality Premise (Emergentism):** They argue that the absence of time in the fundamental equation does not imply the unreality of time, only that time is **emergent**. Just as "temperature" does not appear in the fundamental equations of particle mechanics but is still real, "time" might not appear in quantum gravity but still be real at the macroscopic level.
      *   *Counter-move:* "Absence in the micro-theory does not entail elimination in the macro-ontology."
  2.  **Attacking the Absence Premise (Hidden Time):** They argue the time variable *is* there, but hidden (e.g., internal time, matter clocks, or shape dynamics).
      *   *Counter-move:* "The formalism isn't actually timeless; you're reading it wrong."

  ### Summary for your Seminar
  When you hear someone say:
  > "Because the Wheeler-DeWitt equation is static ($H\Psi = 0$), time does not exist."
  > *OR*
  > "Because Gödel spacetime admits closed timelike curves, temporal passage is an illusion."

  They are making **The Fundamental Absence Inference**. They are moving from a **structural feature of a model** (lack of global time/parameter) to an **ontological conclusion** (unreality of passage), relying on the implicit premise of **Formalism Realism**.

  This label allows you to critique the *inference* without necessarily rejecting the *physics* or the *metaphysics* outright. You can ask: "Is the absence of a parameter in the formalism sufficient for the elimination of the phenomenon, or is this a category error between representation and reality?"
