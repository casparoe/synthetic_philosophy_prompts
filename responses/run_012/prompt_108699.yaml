  # JOINT STATEMENT ON METHODOLOGICAL PROTOCOLS IN THE SCIENCE OF CONSCIOUSNESS

  **Signatories:** [Heterophenomenology Representative] & [First-Person Methodology Representative]
  **Date:** [Workshop Date]
  **Context:** Prepared for the Workshop on Consciousness Science Methodologies

  ## I. JOINTLY ENDORSED CLAIMS

  We, the undersigned, acknowledge significant divergences in our philosophical commitments regarding the ontology of consciousness. However, to facilitate productive empirical collaboration and clarify the nature of our theoretical dispute, we endorse the following procedural and meta-theoretical claims:

  1.  **Status of Reports:** Verbal and behavioral reports issued by subjects constitute the primary empirical entry point for any science of consciousness. Neither side posits access to mental states that bypasses subject output entirely.
  2.  **Methodological Scope:** Neither methodology purports to solve the "Hard Problem" of why physical processes give rise to experience in isolation. Both methods aim to correlate neural/functional states with subject outputs in a rigorous, replicable manner.
  3.  **Fallibility:** Subject reports are not incorrigible. Both sides agree that subjects can be mistaken, confused, or influenced by expectation. The disagreement lies in the *default status* of the report and the procedure for correction.
  4.  **Empirical vs. Conceptual:** We agree that disputes regarding neural correlates (NCC) are largely empirical, whereas disputes regarding the validity of introspection are largely conceptual/methodological. Progress requires distinguishing these domains.
  5.  **Inferential License:** We agree that a subject's report grants *some* inferential license to the researcher regarding the subject's internal state, but we disagree on the strength and type of that license (see Section III).

  ## II. MAP OF RESIDUAL DISAGREEMENTS

  The following table delineates our remaining divergences. Each formulation is phrased to be acceptable to the respective signatory without conceding the opposing view.

  | Issue | Heterophenomenological Formulation | First-Person Methodological Formulation |
  | :--- | :--- | :--- |
  | **Primary Explanandum** | The science of consciousness explains the *beliefs* and *judgments* subjects hold about their internal states. | The science of consciousness explains the *phenomenal experience* itself, of which reports are an expression. |
  | **Ontological Suspension** | We must suspend judgment on whether reported qualia exist as described; we treat the report as a "text" to be interpreted. | We cannot suspend judgment on experience without losing the phenomenon; we treat the report as a trace of the experience. |
  | **Subject Authority** | The subject is not the final authority on their own mind; third-person data can override first-person claims. | The subject is the privileged authority on their own experience; third-person data must be integrated with, not used to veto, first-person claims. |
  | **Error Correction** | Discrepancies between report and function are resolved by prioritizing functional/ neural data. | Discrepancies between report and function are resolved by refining the subject's descriptive vocabulary and attentional training. |
  | **The "Gap"** | There is an unbridgeable epistemic gap between third-person observation and first-person ontology. | The gap is methodological, not ontological; it can be narrowed via rigorous phenomenological reduction. |

  ## III. ANALYSIS OF INFERENTIAL LICENSE AND CRUXES

  *Note: This section is included to test the hypothesis that our disagreement concerns not the existence of experience, but the inferential license granted by subject reports. We treat reports as **testimony** (defeasible claims requiring trust) rather than as **fictional posits** (HP extreme) or **theory-neutral observations** (FPM extreme).*

  ### Crux 1: Distinguishing Misreporting from Nonstandard Experience
  **The Issue:** When a subject's report conflicts with behavioral or neural data, does this indicate the subject is mistaken about their experience (misreporting), or that the experience is nonstandard and lacks conventional labeling?

  **Concrete Case: Blindsight**
  *Subject S has damage to V1. S denies seeing a stimulus in the blind field when asked "Do you see this?" but guesses the orientation of the stimulus with 90% accuracy.*

  *   **Heterophenomenologist Prediction:** S's report ("I do not see") is a true report of S's *belief* about their experience. There is no phenomenal experience in the blind field; there is only unconscious processing. The report is accurate regarding belief, but the belief is ontologically empty regarding qualia.
  *   **First-Person Methodologist Prediction:** S's report is limited by S's concept of "seeing." S *does* have a nonstandard phenomenal experience (e.g., a sense of presence or urgency) but lacks the vocabulary to categorize it as vision. With training, S would report a degraded but present experience.
  *   **Test of Framing:** If reports are testimony, HP treats S as a truthful witness testifying to a lack of evidence. FPM treats S as a truthful witness testifying to evidence they cannot yet name.

  ### Crux 2: Validation of Reporting Criteria Without Circularity
  **The Issue:** To validate a report, we need a criterion. If the criterion is neural/functional, we presuppose experience supervenes on function (circular for FPM). If the criterion is introspective, we presuppose introspection is valid (circular for HP).

  **Concrete Case: Ambiguous Color Boundary**
  *Two trained subjects, A and B, view a gradient shifting from green to blue. At the same physical wavelength, A reports "Green" and B reports "Blue."*

  *   **Heterophenomenologist Prediction:** This disagreement demonstrates that reports are theory-laden judgments, not raw data. We must calibrate subjects against a standard or treat the variance as noise in the belief-system. The "truth" of the experience is inaccessible; only the variance in judgment is measurable.
  *   **First-Person Methodologist Prediction:** This disagreement demonstrates genuine variance in phenomenal boundaries (phenomenological heterogeneity). Validation comes from deepening the description (e.g., "Is it a green with blue tint?"), not external calibration. The "truth" is the specific structure of the variance.
  *   **Test of Framing:** If reports are testimony, HP demands cross-examination against external evidence. FPM demands clarification of the testimony to ensure the witness understands the questions.

  ### Verbal Disagreement Identification
  Upon review of the above cruxes, we identify one significant verbal disagreement regarding the term **"Data."**

  *   **Source of Confusion:** The Heterophenomenologist uses "Data" to mean "publicly verifiable physical tokens (sound waves, key presses)." The First-Person Methodologist uses "Data" to mean "phenomenal givens accessible to the subject."
  *   **Reformulation:** To dissolve this friction, we agree to use the term **"Subject Output"** for publicly verifiable tokens and **"Phenomenal Structure"** for the private content.
      *   *Revised Consensus:* "Subject Output" is the shared empirical basis. The dispute remains whether "Subject Output" maps directly to "Phenomenal Structure" (FPM) or to "Beliefs about Phenomenal Structure" (HP).

  ### Conclusion on Inferential License
  Under the framing of **Testimony**, our disagreement is reduced to the specification of **Defeaters**.
  *   The **Heterophenomenologist** holds that neural/functional incongruence is a *universal defeater* for claims of experience.
  *   The **First-Person Methodologist** holds that neural/functional incongruence is a *partial defeater* that necessitates methodological refinement, not ontological dismissal.

  We agree to structure future experiments to explicitly track when defeaters are invoked, allowing us to measure the practical consequences of this theoretical divergence.

  ***

  **Signed:**

  _________________________
  (Heterophenomenology Representative)

  _________________________
  (First-Person Methodology Representative)
