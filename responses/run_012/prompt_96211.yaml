answer: |-
  Your suspicion is well-founded, and it must be the starting point. To ask Ibn Khaldun about the "collapse of a civilisation" is, strictly speaking, to commit a category error. His unit of analysis is the *dawla* (the dynasty or state) and the *mulk* (royal authority), not "civilisation" in the modern, Spenglerian sense of a singular cultural organism that is born, matures, and dies. For Khaldun, human social organization (*umran*) is perpetual; what rises and falls is the specific political vessel holding it. He would not recognise your question until you translated "society" into "ruling group" and "collapse" into "the loss of *asabiyyah*." Once that translation is made, however, his system offers a ruthless verdict.

  First, on environmental or demographic accident: Khaldun acknowledges climate and plague—the Black Death ravaged his own family—but he subordinates them to social morality. In his view, a dynasty with robust *asabiyyah* (group solidarity) can withstand famine or pestilence; a dynasty softened by luxury (*hadara*) will crumble under the same weight. He would argue that drought in the Late Bronze Age or the Maya lowlands was not the cause of failure but the test that revealed it. If the palace systems fell, it was because their *asabiyyah* had already thinned through generations of urban sedentism. The environment provides the friction; the social bond provides the traction. To blame the drought is to mistake the spark for the dry tinder. He is committed to explaining decline through internal social mechanisms—oppressive taxation, the distancing of the ruler from his kin, the corruption of the military—because these are the only variables a historian can morally instruct a ruler to manage.

  Second, regarding the survival of the population after the political superstructure falls (the Maya shift north, the Bronze Age network reorganisation): Khaldun would dismiss the notion that these events constitute "societal death." For him, the end of a *dawla* is often violent, but the *umran* (civilization/settlement) persists under new management. The movement of Maya power from the southern lowlands to the north would be read simply as the migration of *asabiyyah* to a fresher periphery, where group solidarity remained intact enough to forge a new *mulk*. Similarly, the Late Bronze Age breakdown is not a collapse of society but a fragmentation of an over-extended imperial center. When the center rots, the periphery severs ties. He would view the continuity of ordinary life not as a paradox but as the norm. Regimes are temporary; the need for human association is eternal. The "collapse" is merely the moment the old contract of protection-for-obedience is voided.

  Third, Easter Island presents a genuine difficulty, and here I must mark a guess. Khaldun's cycle relies on a dialectic between the "wild" (*badawa*) and the "sedentary" (*hadara*). A dynasty is renewed by fresh blood from the margins. Easter Island is a closed system with no margins. There is no external pastoral group to reset the cycle. Khaldun might argue that without an external threat or a fresh influx of *asabiyyah*, internal factionalism (*fitna*) becomes terminal. He would likely interpret the statue-building as the height of luxurious waste that precedes a fall, and the subsequent civil strife as the final dissolution of solidarity. It is a fatal counterexample to the *renewal* of the cycle, but not to the theory of decline itself. He would absorb it as a case where the natural lifespan of a group ran its course without the possibility of regeneration. [Guess: He would view it as a truncated cycle, proof that without a periphery to raid or recruit, the end is absolute.]

  Fourth, on the question of whether collapse is real or merely turnover: Khaldun's system forces him to deny that "collapse" names a unique catastrophe. It is simply the winter of the dynastic season. He posits a natural lifespan for dynasties, roughly three to four generations (120 years), mirroring the human life course. The first generation builds, the second maintains, the third imitates and wastes, the fourth destroys. To call this "collapse" implies a failure to achieve permanence, but Khaldun holds that permanence is impossible for political forms. Your debate's anxiety—that a society might "fail"—is a modern linear anxiety. For Khaldun, history is a pulse. The fall of a palace system is as natural as the shedding of a skin.

  He would correct your vocabulary: you are studying the mortality of states, not the mortality of societies. But on the substance, he would argue that what you call "collapse" is the inevitable result of success. The very wealth and security the palaces created dissolved the solidarity required to maintain them.

  Verdict: Not collapse, but the natural expiry of a dynasty.
