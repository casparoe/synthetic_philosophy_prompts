prompt: |-
  I sit on a hospital ethics committee that is drafting guidance on when a patient's advance directive should be overridden by the patient's present, expressed wishes. Our disagreement has collapsed onto a single analogy, and I would like you to audit it.

  The analogy is this: the person who wrote the directive and the person now in the bed are two different people. One faction on the committee uses it to argue that the document has no more authority over the present patient than a note handed in by a stranger, so present contentment should prevail. The other faction uses the same premise to argue the opposite: because the author of the directive is, in effect, gone, the document is the only surviving expression of her will — a testament rather than a command — and the present patient, being incompetent, is in no position to revoke it. Both factions take themselves to be drawing out the consequences of the same comparison, and both are impatient with the other for failing to see where it leads.

  What I want from you:

  1. A correspondence table. In the interpersonal case the analogy is modelled on — one person issuing binding instructions to another — what plays the role of the issuer, the recipient, the instrument, the signature, the revocation, the enforcement, and the party whose interests are at stake? Then say which of these have a counterpart in the advance-directive case and which do not.

  2. The disanalogies, ranked. Separate the ones that matter for the use to which the analogy is being put from the ones that are merely picturesque. In particular: the causal and psychological continuity between the two parties; the fact that the later party never consented and also never refused; the asymmetry by which the earlier self can act on the later but not the reverse; and the fact that the later self inherits rather than merely receives the earlier self's body, history, and relationships.

  3. Whether the premise is meant literally or figuratively, and whether either faction's conclusion survives on either reading. If the claim that they are two people is a claim about personal identity, what follows for the authority of a document one of them signed? If it is a figure for the fragmentation of a single person's interests, what is left of the analogy at all? And say which role each faction needs the document to play — a command issued by an authority who has since vacated the office, or testimony about the shape of a life — and whether the comparison can supply that role.

  4. A test. Take three cases — a patient who now says she is glad to be alive and appears to be flourishing; a patient whose directive was written during a depressive episode; a patient who asked that everything be done and now appears to be suffering with no prospect of recovery — and say which of them the analogy illuminates and which it distorts.

  5. A verdict and a replacement. Can the two-people comparison support either conclusion, or is it doing no work while a substantive thesis about whose authority is basic does all of it? If the analogy should be replaced, propose a better one — a will, an executor, a promise made to someone now dead, a precommitment device such as a lock on a cabinet, a guardian acting for a ward — and say precisely what it gets right that the original does not.

  Write this as a memo. No citations, no case law, and no assumptions about any particular jurisdiction's rules; I want the conceptual audit, not a survey of the literature.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Context:** Hospital ethics committee drafting guidance on overriding advance directives (ADs) with present expressed wishes (PEWs) of incompetent patients.
      *   **Core Conflict:** Disagreement hinges on a specific analogy: "The person who wrote the directive and the person now in the bed are two different people."
      *   **Factions:**
          *   Faction A (Present Wishes Prevail): If they are different people, the AD is like a stranger's note. No authority.
          *   Faction B (Advance Directive Prevails): If they are different people, the author is gone. The AD is a testament/will. The current patient (incompetent) can't revoke it.
      *   **Task:** Audit this analogy.
      *   **Requirements:**
          1.  Correspondence table (Interpersonal vs. Intrapersonal).
          2.  Ranked disanalogies (Critical vs. Picturesque).
          3.  Literal vs. Figurative analysis of the premise.
          4.  Test against three specific cases.
          5.  Verdict and replacement analogy.
      *   **Format:** Memo.
      *   **Constraints:** No citations, no case law, no jurisdictional assumptions. Conceptual audit only.

  2.  **Deconstruct the Analogy (The "Two-Person" View):**
      *   This is a classic philosophical problem (Parfit, Dworkin, Dresser, etc., though I cannot cite them). It touches on personal identity and moral authority.
      *   *Faction A* treats the current patient as a new entity with rights to self-determination (even if compromised).
      *   *Faction B* treats the AD as a last will and testament, protecting the *past* person's autonomy against the *current* entity's degradation.

  3.  **Drafting Section 1: Correspondence Table:**
      *   Need to map the "Interpersonal Case" (Person X instructs Person Y) to the "Advance Directive Case" (Past Self instructs Present Self).
      *   *Issuer:* Person X vs. Past Self.
      *   *Recipient:* Person Y vs. Present Self.
      *   *Instrument:* Letter/Contract vs. Advance Directive.
      *   *Signature:* X's signature vs. Past Self's signature.
      *   *Revocation:* Y refusing/X updating vs. Present Self objecting/Past Self updating.
      *   *Enforcement:* Law/Social pressure vs. Medical Ethics/Proxy.
      *   *Interests:* X's interests vs. Past Self's interests (or shared interests?).
      *   *Crucial Step:* Identify mismatches. In the interpersonal case, Y is usually competent to refuse. In the AD case, Present Self is often incompetent (which is why the AD is triggered). Also, X and Y are distinct legal entities; Past and Present Self are legally the *same* entity.

  4.  **Drafting Section 2: Ranked Disanalogies:**
      *   Need to separate what matters for *authority* from what is just descriptive.
      *   *Critical Disanalogy 1: Continuity.* Psychological/physical continuity exists between selves, not between strangers. This undermines Faction A (they aren't strangers) and Faction B (they aren't fully distinct).
      *   *Critical Disanalogy 2: Consent/Refusal.* A stranger can refuse instructions. The current patient often lacks capacity to legally/ethically "revoke."
      *   *Critical Disanalogy 3: Asymmetry of Power.* Past Self can bind Present Self. Present Self cannot bind Past Self. Strangers are usually symmetrical.
      *   *Critical Disanalogy 4: Inheritance.* Present Self inherits the body/consequences. A recipient of a note doesn't necessarily inherit the issuer's body.
      *   *Picturesque:* Emotional attachment, physical resemblance (unless relevant to identity).

  5.  **Drafting Section 3: Literal vs. Figurative:**
      *   *Literal:* If they are numerically distinct persons (Locke/Parfit style), legal identity breaks. If literally different, Faction A wins on bodily autonomy, Faction B wins on property/testament rights. But legally, they are the same. So a literal reading breaks the legal framework.
      *   *Figurative:* It's about *interests* diverging. "Who counts?"
      *   *Faction A Needs:* The document as a *command*. If the commander is gone, the command lapses.
      *   *Faction B Needs:* The document as a *testament*. If the testator is gone, the will stands.
      *   *Analysis:* The analogy supports B better if viewed as a "Will." It supports A better if viewed as "Agency." The "Two People" premise is unstable. If they are truly two people, why does the current one lack capacity? If they are the same, why does the analogy hold?

  6.  **Drafting Section 4: The Test (Three Cases):**
      *   *Case 1 (Glad to be alive/Flourishing):* Analogy distorts. Faction A says "Let her live." Faction B says "Past self wanted death." The "Two People" view makes ignoring the flourishing present self seem like murder (A) or respecting rights (B). The analogy hides the *quality of life* metric.
      *   *Case 2 (Depressive Episode AD):* Analogy illuminates. Past Self was compromised. Like a stranger giving bad advice? Or a testator under duress? Helps Faction A argue the "Issuer" was incompetent then.
      *   *Case 3 (Requested Everything/Now Suffering):* Reverse AD. Past Self wanted life, Present Self (incompetent signs) seems suffering. Faction B (AD stands) vs Faction A (Mercy). The "Two People" analogy makes the Present Self's suffering less relevant if they are just a "vessel" for the Past Self's will. This distorts the ethical weight of current suffering.

  7.  **Drafting Section 5: Verdict and Replacement:**
      *   *Verdict:* The analogy is doing no heavy lifting. It masks the real question: *What is the moral weight of precedent autonomy vs. current well-being?* The "Two People" claim is a conclusion, not a premise.
      *   *Replacement:* The "Trustee/Beneficiary" or "Precommitment" model.
      *   *Better Analogy:* **The Ulysses Contract (Precommitment).** Tying oneself to the mast.
      *   *Why better:* Acknowledges it is the *same* person anticipating a change in state. It captures the *purpose* of the AD (protecting against future incapacity) without denying identity. It allows for exceptions (if the mast breaks/conditions change) which the "Two People" view makes hard (strangers don't untie you, dead men don't care).
      *   *Alternative:* **Guardianship.** But that implies the current self is a child/ward, which is patronizing.
      *   *Selection:* The **Precommitment/Ulysses** analogy is strongest for ethics committees because it focuses on *agency over time* rather than *identity fragmentation*.

  8.  **Review and Refine:**
      *   *Tone:* Professional, analytical, memo style.
      *   *Constraints Check:* No citations? Yes. No case law? Yes. No jurisdiction? Yes.
      *   *Clarity:* Ensure the distinction between Faction A and B is clear throughout.
      *   *Self-Correction during drafting:* I need to make sure I don't solve the ethical problem, but rather audit the *analogy* as requested. The prompt asks to audit the tool, not solve the case.
      *   *Refining the Table:* Ensure the "Counterpart" column is explicit about where the mapping fails.
      *   *Refining the Verdict:* Be decisive. The analogy is a "conversation stopper" that pretends to be an argument.

  9.  **Final Polish:** Check headings, formatting, and ensure all 5 points are addressed distinctly. (Self-correction: Ensure the distinction between "Command" and "Testament" in section 3 is sharp).

  *(Self-Correction on Section 3)*: I need to be careful about the "Literal" interpretation. If taken literally (metaphysical fission), the legal system collapses. I must emphasize that the committee is likely using it figuratively to denote *interest divergence*.

  *(Self-Correction on Section 5)*: The prompt asks for *a* replacement. I will propose the "Precommitment/Ulysses" analogy but also mention the "Trustee" model as a nuance. I'll stick to Precommitment as the primary recommendation because it addresses the *temporal* aspect best.

  10. **Final Output Generation** (Proceeding to generate memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** External Consultant
  **SUBJECT:** Conceptual Audit of the "Two-Person" Analogy in Advance Directive Guidance
  **DATE:** October 26, 2023

  **1. Correspondence Table: Interpersonal Instructions vs. Advance Directives**

  The following table maps the structural elements of the analogy (one person instructing another) against the clinical reality (past self instructing present self). The final column identifies where the mapping holds and where it breaks.

  | Element | Interpersonal Case (Person A → Person B) | Advance Directive Case (Past Self → Present Self) | Counterpart Status |
  | :--- | :--- | :--- | :--- |
  | **Issuer** | Distinct legal/moral agent (A). | Past self (at time of competency). | **Partial.** Legally the same entity, but morally distinct in the analogy. |
  | **Recipient** | Distinct legal/moral agent (B). | Present self (at time of incapacity). | **Partial.** Legally the same entity; often lacks capacity to receive/act. |
  | **Instrument** | Letter, contract, or order. | Advance Directive (AD). | **Match.** |
  | **Signature** | A's authentication of intent. | Past self's authentication of intent. | **Match.** |
  | **Revocation** | B refuses; or A updates the order. | Present self objects; or Past self updated AD. | **Mismatch.** B can usually refuse. Present self often cannot legally revoke due to incapacity. |
  | **Enforcement** | Social/Legal pressure on B to comply. | Medical staff/Proxy enforcing AD. | **Mismatch.** Enforcement is on third parties (staff), not the recipient (patient). |
  | **Interests** | A's interests vs. B's interests. | Past self's values vs. Present self's well-being. | **Mismatch.** In interpersonal cases, interests are separate. Here, they share a body and history. |

  **Audit Note:** The critical failure points are **Revocation** and **Interests**. In the interpersonal case, the recipient usually has the standing to reject the instruction based on their own interests. In the AD case, the "recipient" (present self) is often deemed incompetent precisely because their current wishes diverge from the "issuer's" plan. The analogy assumes a separation of agency that the law explicitly denies.

  ***

  **2. Ranked Disanalogies**

  Not all differences between the analogy and reality carry equal moral weight. I have ranked them by their impact on the committee's specific disagreement.

  **Tier 1: Critical Disanalogies (Matter for Authority)**
  *   **Psychological and Causal Continuity:** Unlike two strangers, the past and present self share a continuous biological life and, usually, significant psychological continuity. Even if values shift, the *subject* of the experience is the same organism. This undermines Faction A (they are not strangers) and complicates Faction B (the "dead" author is still biologically present).
  *   **The Capacity to Revoke:** In the interpersonal model, a recipient can say "no." In the AD context, the present patient's "no" is often treated as a symptom of the condition the AD was meant to guard against. The analogy fails to account for *why* the present wish is being discounted (incapacity).
  *   **Inheritance of Consequences:** The present self does not merely receive instructions; they inherit the *body* that must undergo the treatment. A stranger receiving a note does not inherit the issuer's physical pain. This gives the present self a stake in the outcome that a mere recipient does not have.

  **Tier 2: Structural Disanalogies (Matter for Process)**
  *   **Asymmetry of Power:** The past self can bind the present self, but the present self cannot bind the past self. In interpersonal relationships, authority is usually negotiated or symmetrical. This asymmetry suggests the relationship is more hierarchical (guardian/ward) than lateral (stranger/stranger).
  *   **Epistemic Access:** The past self had knowledge of their values but no knowledge of the specific present reality. The present self has knowledge of the reality but (by definition of the case) lacks the capacity to weigh it against values. Strangers usually lack both specific epistemic access to each other's internal states.

  **Tier 3: Picturesque Disanalogies (Do Not Determine Authority)**
  *   **Emotional Attachment:** Whether the two selves "love" each other is irrelevant to the binding nature of the instruction.
  *   **Physical Resemblance:** Irrelevant to moral authority.
  *   **Temporal Distance:** Whether the AD was written 1 year or 20 years ago matters less than the stability of the values expressed.

  ***

  **3. Literal vs. Figurative Premise**

  The committee's stalemate arises because the "Two-Person" premise is being used as a metaphysical claim when it is actually a moral heuristic.

  **If Taken Literally (Personal Identity):**
  If the past and present selves are numerically distinct persons (as Faction A implies), the Advance Directive loses legal standing. Legally, one person cannot consent to medical treatment for another unrelated adult without proxy status. If they are truly different people, the document is indeed a stranger's note.
  *   *Faction A:* Survives. If they are different people, bodily autonomy of the present person trumps the paper rights of the absent person.
  *   *Faction B:* Collapses. A "testament" transfers property, not bodily integrity. You cannot will your neighbor to undergo dialysis.
  *   *Verdict:* A literal reading destroys the legal framework of the AD entirely.

  **If Taken Figuratively (Fragmentation of Interests):**
  This is the intended use: the *values* of the past self and the *interests* of the present self have diverged so sharply they might as well be different people.
  *   *Faction A:* Needs the document to be a **Command**. If the commander is "gone" (psychologically), the command lapses. The analogy supports them only if the authority relies on the *continued existence* of the commander's mind.
  *   *Faction B:* Needs the document to be a **Testament**. If the author is "gone," the document is their final legacy. The analogy supports them only if the authority relies on the *historical authenticity* of the author.
  *   *Verdict:* The figurative reading allows both factions to exist, but the analogy cannot decide between them. It merely restates the conflict: "Is this a command that dies with the mind, or a will that survives it?" The analogy supplies no criteria to choose.

  ***

  **4. The Test: Three Clinical Cases**

  I have applied the "Two-Person" analogy to three scenarios to test its illuminating power.

  **Case 1: The Flourishing Patient**
  *   *Scenario:* AD refuses life-sustaining treatment. Patient now lacks capacity but appears happy, engaged, and glad to be alive.
  *   *Analogy Performance:* **Distorts.**
  *   *Reasoning:* Faction A uses the analogy to say, "This happy person is not the depressed author; let her live." Faction B says, "The author is gone; do not violate her will for a stranger's happiness." The analogy obscures the objective evidence of well-being. It forces a binary choice between "Ghost's Will" and "Stranger's Whim," ignoring the possibility that the *same* person's interests have legitimately evolved.

  **Case 2: The Depressive Directive**
  *   *Scenario:* AD written during a treated depressive episode refuses care. Patient now (incapacitated) fights for life.
  *   *Analogy Performance:* **Illuminates.**
  *   *Reasoning:* Here, the "Two-Person" view is useful. The "Issuer" was compromised. Faction A can argue the "Issuer" was not a competent moral agent at the time (like a stranger issuing instructions under duress). The analogy helps separate the *authentic* self from the *compromised* self, regardless of which timeline they occupy.

  **Case 3: The Suffering Survivor**
  *   *Scenario:* AD requests "everything done." Patient now (incapacitated) is in irreversible agony with no recovery prospect.
  *   *Analogy Performance:* **Distorts.**
  *   *Reasoning:* Faction B uses the analogy to enforce the "Testament": The author wanted life, so we provide it. Faction A argues the present "person" is suffering. The analogy makes the present suffering seem less relevant because the "authority" lies with the absent author. It risks treating the present patient as a mere vessel for the past self's preferences, ignoring the moral weight of current pain.

  ***

  **5. Verdict and Replacement**

  **Verdict**
  The "Two-Person" analogy should be **discarded**. It is doing no conceptual work; it is merely a rhetorical disguise for a substantive thesis about whose authority is basic.
  *   If you believe *precedent autonomy* is basic, you will view the selves as continuous enough to bind.
  *   If you believe *current well-being* is basic, you will view the selves as distinct enough to override.
  The analogy does not prove either point; it assumes them. Furthermore, it risks dehumanizing the current patient (Faction B) or trivializing the past agent (Faction A).

  **Replacement Analogy: The Ulysses Contract (Precommitment)**
  I propose replacing the "Two-Person" analogy with the **Precommitment/Ulysses** model. In this analogy, a competent agent ties themselves to the mast to prevent their future self from succumbing to a temporary state (the Sirens) that they know will distort their judgment.

  **Why this is superior:**
  1.  **Identity:** It acknowledges it is the *same person* across time. It avoids the metaphysical confusion of the "Two-Person" view.
  2.  **Purpose:** It clarifies *why* the AD exists: not to rule from the grave, but to protect the agent's long-term values against temporary incapacity or distortion.
  3.  **Flexibility:** A Ulysses contract implies conditions. If the ship is sinking (medical futility) or the ropes are cutting off circulation (unforeseen suffering), the crew (physicians/proxies) may have cause to untie the mast.
  4.  **Resolution:** It shifts the debate from "Who is this person?" to "Was this a valid precommitment?"
      *   *For Faction A:* They must argue the current state was not the "Siren song" the AD anticipated (e.g., the patient isn't delirious, they are just changed).
      *   *For Faction B:* They must argue the current wish is indeed the distortion the AD was designed to prevent.

  **Recommendation**
  Draft the guidance around the **Precommitment** model. Define the AD not as a command from a stranger, nor a will from the dead, but as a *protective measure enacted by a competent self for a vulnerable future self*. This allows the committee to weigh the *validity of the precommitment* against the *severity of the current burden* without fracturing the patient's identity.
