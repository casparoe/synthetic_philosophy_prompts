answer: |-
  Here is the reading you asked for, though I should say up front that while Memento wears the clothes of the Absent-Minded Driver problem, it ultimately reveals itself to be a different beast entirely, one that might actually be more useful for closing your unit because it challenges the fixed preference assumption that the standard puzzle takes for granted. On the surface, the mapping is almost too perfect to ignore. Leonard Shelby is the driver, his anterograde amnesia ensures that every moment on the highway is phenomenologically indistinguishable from the last, and the tattoos and Polaroids function as the pre-commitment device or mixed strategy he established at the planning stage to guide his actions at the execution stage. Just as the driver cannot tell exit one from exit two, Leonard cannot tell a genuine clue from a planted one, nor can he remember whether he has already interrogated a suspect. He is forced to rely on the system he set up when he still had his wits about him, which is precisely the structural condition of the Absent-Minded Driver. The tattoos are the equivalent of the probability p, a deterministic rule set in motion by a past self that the present self must obey because it lacks the data to optimize locally.

  However, the mapping breaks down the moment you look at the payoff structure, and this is where the film stops being an illustration of the puzzle and starts being a critique of it. In the standard Absent-Minded Driver problem, the driver wants to exit at the second intersection. The tragedy of the puzzle is that cognitive limitations prevent him from maximizing a stable preference. In Memento, Leonard discovers at the end that he has already reached the second exit. He killed the real John G a year ago. Teddy hands him the payoff of four, the completion of the mission, and Leonard looks at it, burns the evidence, and chooses to drive past the exit. He tattoos Teddy's license plate as the new John G and sets himself back on the highway. This implies that Leonard's payoff function is not fixed like the driver's. For Leonard, the utility of arriving is actually lower than the utility of driving. The hunt provides meaning, structure, and a reason to exist that the arrival would extinguish. So while the Absent-Minded Driver is a story about how memory loss prevents you from getting what you want, Memento is a story about how memory loss allows you to want something else entirely. The ex ante ex post gap here isn't just about uncertainty or dynamic inconsistency; it is about the agent deliberately manipulating the ex post conditions to sustain a specific kind of life. Leonard isn't failing to maximize; he is maximizing a preference for perpetual seeking over completion.

  This shifts the problem from one of cognitive limitation to one of self-deception and endogenous preferences. The Sammy Jankis story is the key mechanism here. When Teddy reveals that Sammy Jankis was a con man and that Leonard's wife was the one who suffered the insulin shock, he is telling Leonard that he wrote the rules of his own trap. Leonard projected his own inability to move past grief onto Sammy, using the story as a cautionary tale to justify his own system of notes and tattoos. In decision theoretic terms, Leonard is not just the driver following a plan; he is the planner who rigged the payoffs so that the plan could never succeed. He installed the notes not to solve the problem, but to ensure the problem persists. This adds a layer to the debate that the abstract puzzle misses, which is the question of who sets the payoffs. In the standard model, payoffs are given by the world. In Memento, payoffs are constructed by the agent to serve a psychological need. Leonard chooses the plan that keeps him on the road forever because the planning self knows that the acting self cannot handle the truth. It suggests that rational choice models which treat preferences as stable across time might miss the way agents actively manage their future preferences to avoid painful equilibria.

  The form of the film reinforces this theoretical point by forcing the audience into the position of the absent-minded driver. Because the color scenes run backwards, we as viewers are denied the causal context of any given scene until we see the next one, which is actually the previous one. We are always at an intersection without knowing if it is the first or the second, unable to condition our judgment on where we are in the narrative highway. But unlike the abstract puzzle, where this uncertainty is a neutral constraint, the film uses this structure to make us feel the seduction of Leonard's delusion. We want the mystery to continue just as he does. When the chronology finally merges at the end and we realize where we are, we experience the same shock as Leonard, but we also see him choose to ignore it. This suggests that the form is not a gimmick but an argument that epistemic uncertainty is often preferable to clarity. The audience is complicit in Leonard's choice to keep driving because the movie would be over if he exited.

  So if you want to use this to close the unit, I would argue that Memento is not strictly the Absent-Minded Driver problem but rather a problem of instrumental irrationality driven by preference construction. The Absent-Minded Driver assumes the agent wants to exit and fails due to memory constraints. Leonard assumes the agent wants to drive and uses memory constraints to ensure he does. It transforms the puzzle from a technical problem about mixed strategies and belief updates into a philosophical problem about whether rationality requires truth or merely coherence. Leonard is perfectly coherent. His actions follow his notes, his notes follow his tattoos, and his tattoos follow his goal. He is rational relative to his constructed preferences, even if those preferences are based on a lie. This might be the perfect note to end on because it asks your students to consider whether rational choice theory can account for agents who prefer the game to the win, and whether a model that assumes fixed payoffs can ever truly capture a human life where the meaning is often found in the driving rather than the arriving.
