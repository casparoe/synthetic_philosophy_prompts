prompt: |-
  I'm a sophomore at a big state school and I'm taking this course on rational choice thats cross-listed with philosophy. My roommate and I got into a huge argument last night and I can't stop thinking about it. He's been reading some blog stuff about a thought experiment where you're offered a bet: there's some ridiculously tiny chance, like one in a googol, that you get an infinitely good outcome, and otherwise you lose a finite amount. He says the math forces you to take it, because any positive probability times infinity is still infinity, so no finite sure thing can compare. Now he's applying it to actual life. He wants to drop out and put his savings into a weird biotech thing that he admits has maybe a one-in-a-billion chance of curing all suffering in the universe, instead of helping his little sister pay for community college, which would definitely make her life way better. He says the value of curing all suffering is basically infinite, so her getting a degree is literally zero in comparison, and I'm being irrational for caring about it. I tried to say the chance is too small, but he just says thats not how expected value works, and honestly I didn't have a comeback. I'm taking the class but we haven't gotten to this part.

  Can you help me figure out whats actually wrong with his argument, or is he right and I'm just being sentimental? I want something I can actually say to him that isn't just "it feels wrong." Also, he's got this extra twist he calls the "infinite staircase": he says for any sure thing, there's some tiny probability of an enormous payoff that beats it, and then for that payoff there's another even tinier probability of an even bigger payoff, and so on, so you should keep trading up forever. If there's a version of his argument that isn't crazy, what would it look like, and what would I have to give up to accept it?
