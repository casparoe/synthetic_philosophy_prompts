answer: |-
  First off, take a deep breath. You are not being irrational, and you are not just being "sentimental." Your roommate has accidentally stumbled into one of the most famous and frustrating problems in decision theory and philosophy.

  In your field, this is known as **Pascal's Mugging**.

  It is a direct descendant of Pascal's Wager, but updated for modern expected utility theory. The fact that you feel something is wrong isn't a bug in your moral compass; it's a bug in the mathematical framework your roommate is using naively. Professional philosophers and economists have spent decades trying to solve exactly this problem, and the consensus is that his reasoning is flawed.

  Here is a breakdown of what is actually wrong with his argument, how to handle the "Infinite Staircase," and exactly what you can say to him that uses the language of your Rational Choice class.

  ### 1. The Core Error: Unbounded Utility Functions
  Your roommate is assuming that utility (value) is **unbounded**. He assumes that because "curing all suffering" is *really big*, it can be treated as *infinity*.

  In standard decision theory (specifically Von Neumann-Morgenstern utility theory), if you allow utility to be unbounded, you open the door to absurdities. If there is no limit to how good an outcome can be, then there is always some hypothetical outcome so good that even a one-in-a-googol chance of it outweighs a guaranteed good deed.

  **The Counter-Argument:**
  Rational agents should have a **bounded utility function**. This means there is a maximum amount of "good" that can exist. Maybe curing all suffering is worth 1 trillion utils. Maybe it's 1 quadrillion. But if it is a finite number, then a 1-in-a-billion chance of it is easily outweighed by the guaranteed utility of your sister getting an education, landing a job, and living a happy life.

  **What to say:**
  > "You're assuming utility is unbounded. But in decision theory, if utility is unbounded, you get paralyzed by Pascal's Mugging. Most rational choice models assume bounded utility specifically to avoid this. If curing suffering has a finite value—even a huge one—the math changes. A 100% chance of helping my sister likely outweighs a 0.0000001% chance of saving the world."

  ### 2. The Epistemic Problem (Where do the numbers come from?)
  Expected Value (EV) calculations require two inputs: Payoff and Probability. Your roommate is treating the probability (1 in a billion) as a mathematical given. It isn't. It's a guess.

  In rational choice, probabilities must be **epistemically justified**. You cannot just assign a number to a claim without evidence. The claim "this biotech startup will cure all suffering in the universe" is extraordinary. The probability of it being a scam, failing due to physics, or having unintended negative consequences is likely vastly higher than 1 in a billion.

  If the actual probability is 1 in $10^{50}$ (which is more realistic for "curing all suffering"), the Expected Value drops to near zero.

  **What to say:**
  > "Expected Value only works if your probability estimates are justified. What evidence do you have for the 1-in-a-billion figure? In Bayesian terms, the prior probability of 'curing all suffering' is so low that without massive evidence, the posterior probability remains negligible. You're plugging in a made-up number to force the math to work."

  ### 3. The "Infinite Staircase" and Money Pumps
  Your roommate's "Infinite Staircase" argument is essentially a description of why unbounded utility is irrational. If you accept his premise, you become vulnerable to a **Money Pump**.

  Here is the logic:
  1.  You have Option A (Sure Thing).
  2.  I offer you Option B (Tiny chance of Massive Payoff). You take it because EV is higher.
  3.  I offer you Option C (Even tinier chance of Even More Massive Payoff). You take it.
  4.  I offer to sell you back Option A for a small fee.

  If you follow his logic, you will trade A $\to$ B $\to$ C $\to$ ... forever, losing money or resources at every step, never actually *doing* anything. You end up with nothing. A rational agent cannot be money-pumped. Therefore, the logic that allows the pumping must be rejected.

  **What to say:**
  > "Your 'Infinite Staircase' proves your logic is broken. If I follow your rule, I should always trade a sure thing for a tinier chance at a bigger thing. I'd spend my whole life trading up and never actually help anyone. That makes me a 'money pump.' If a decision theory tells me to never act, it's a bad decision theory."

  ### 4. Infinity Breaks Math
  Finally, there is a technical mathematical point. In standard real analysis, you cannot multiply a real number (probability) by infinity and get a meaningful result that compares to other numbers. $\infty \times 0.000...1$ is undefined.

  To make the math work, you have to use limits or surreal numbers, but once you do that, you run into other paradoxes (like the St. Petersburg Paradox). The standard solution in economics is to say: **"We do not deal in actual infinities."**

  **What to say:**
  > "Mathematically, you can't compare finite expected values to infinite ones. $\infty \times P$ is undefined in standard decision theory. As soon as you introduce actual infinity, Expected Utility Theory breaks down completely. We have to treat the payoff as finite to do the math at all."

  ### Summary: How to talk to him
  He thinks you are being emotional. You need to show him you are being *more rigorous* than he is.

  **Script:**
  "I looked into this. You're describing **Pascal's Mugging**. It's a known paradox that proves Expected Utility Theory breaks down if you allow **unbounded utility** or **unjustified probabilities**.
  1.  **Bounded Utility:** If 'curing suffering' is finite (which it must be to do the math), the sure thing wins.
  2.  **Epistemic Probability:** Your 1-in-a-billion number is a guess, not data. The real probability is likely so low the EV is zero.
  3.  **Money Pump:** Your 'Infinite Staircase' shows that your logic leads to endless trading without action. That violates the axioms of rationality.
  I'm not ignoring the math; I'm using the version of decision theory that doesn't result in paralysis."

  ### What would you have to give up to accept his view?
  If you want to understand his position charitably: To accept his argument, you would have to accept **Fanaticism** in decision theory. This is a real (though controversial) position held by some effective altruists and philosophers (like Nick Bostrom or Toby Ord in specific contexts).

  To accept it, you must agree that:
  1.  **Size matters more than probability:** A sufficiently large outcome *always* trumps a certain one, regardless of how unlikely it is.
  2.  **You should ignore the near term:** The welfare of existing, identifiable people (your sister) is negligible compared to potential future people.
  3.  **You are vulnerable to scams:** Anyone who claims a huge payoff deserves your resources, even with zero evidence.

  Most philosophers reject this because it makes rational action impossible. You are safe to tell him that in the context of a Rational Choice course, his argument is considered a **reductio ad absurdum** (a proof that a premise is false because it leads to absurd results), not a valid strategy for living.

  **Bottom line:** Help your sister. The math, done correctly, supports you.
