  2.  **Deconstruct the Supervisor's Logic (Wittgensteinian Lens):**
      *   *Core Theme:* Later Wittgenstein (Philosophical Investigations, Lectures on Religious Belief) emphasizes *language games*, *forms of life*, and the idea that religious language is not empirical/hypothetical.
      *   *Verdict 1 (Hypothesis):* Religious belief $\neq$ scientific hypothesis. If it depends on evidence/arguments, it's not religious belief.
      *   *Verdict 2 (Historical Evidence):* Resurrection isn't a historical fact to be proven like a battle date. It's a spiritual reality within the form of life. Treating it as empirical history misses the grammar.
      *   *Verdict 3 (Superstition/Quid Pro Quo):* Religion $\neq$ causal mechanism (do X to get Y). That's bad science/magic.
      *   *Verdict 4 (Practice/Embeddedness):* Belief is shown in living. The question "Does God exist?" outside the practice is nonsense. This is the "Paradigm."
      *   *Verdict 5 (Explicit Denial):* If you say "I don't believe," you don't believe, even if you act the part. Avowal matters.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth and poignancy of the question. Validate the Wittgensteinian context.

      *   **1. The Rule She Is Running (The Primary Interpretation):**
