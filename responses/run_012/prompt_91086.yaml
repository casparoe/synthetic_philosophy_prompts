          *   *Explanation:* For Wittgenstein (and likely her), religious belief is a distinct language game. It is not tentative, empirical, or hypothetical. It is "unshakable" *within* the form of life.
          *   *Key Criterion:* Belief is defined by its *role* in the life, not its *content* matched to reality. Crucially, it must be immune to empirical refutation *in principle*. If you admit empirical evidence could falsify it, you are playing the science game, not the religion game.
