answer: |-
  You have identified a precise and under-theorized gap in the taxonomy of moral blame. You are correct that this is not hypocrisy (which requires contradictory conduct), nor standard complicity (which requires causal contribution), nor *tu quoque* (which requires the accuser to be guilty of the same specific wrong).

  In the contemporary philosophical literature on the **ethics of blame** (e.g., the work of R. Jay Wallace, Macalester Bell, Kyle Fritz), there is **no single canonical term** for this specific standing-defeater that carries the same weight as "hypocrisy." However, it is frequently discussed under the descriptive header of **"The Beneficiary Objection"** to standing.

  Because you require a "carving"—a definition that distinguishes this from hypocrisy and complicity, and addresses the "twist" of inextricability—I will propose a precise conceptual term for this phenomenon, define its boundaries, and analyze the validity of the objection when the benefit cannot be renounced.

  ### The Term: **Involuntary Beneficiary Disqualification**

  While "The Beneficiary Objection" is the descriptive phrase used in literature regarding historical injustice, **Involuntary Beneficiary Disqualification** better captures the specific mechanism you are describing: the claim that standing is lost solely through the *state* of receiving a benefit, regardless of *agency* in securing it.

  Here is the conceptual carving you requested.

  #### 1. Distinction from Hypocrisy
  *   **Hypocrisy** turns on **conduct**. It asserts: "You blame X, but you *do* X." It charges the blamer with violating the very norm they are invoking.
  *   **Beneficiary Disqualification** turns on **status**. It asserts: "You blame X, but you *are* X's beneficiary." The critic may have never committed the wrong, nor violated the norm. Their "fault" is not action, but position.
  *   **Boundary:** If the critic *acted* to secure the benefit (e.g., lobbied for the unjust law), the charge shifts from Beneficiary Disqualification to **Complicity**. If the critic *violates* the norm they cite (e.g., demands fair labor but exploits workers), the charge shifts to **Hypocrisy**. Beneficiary Disqualification applies *only* when the critic is passive regarding the benefit.

  #### 2. Distinction from Complicity
  *   **Complicity** turns on **causation**. It asserts: "You helped make this wrong happen." It implies a duty to repair because one contributed to the harm.
  *   **Beneficiary Disqualification** turns on **receipt**. It asserts: "You gained from this wrong, even if you didn't cause it."
  *   **Boundary:** If the benefit was the *result* of the critic's own agency (e.g., they invested in the slave ship), it is Complicity. If the benefit was *conferred* by structure or ancestry (e.g., they inherited wealth generated by slavery), it is Beneficiary Disqualification.

  #### 3. The Crucial Boundary: Renounceability (The "Twist")
  This is where the concept must be carved most sharply. The validity of *Involuntary Beneficiary Disqualification* depends entirely on whether the benefit is **fungible** (can be given up) or **constitutive** (cannot be given up).

  **A. Fungible Benefits (Valid Objection)**
  *   **Case:** A shopper objects to sweatshop labor while holding a bag of cheap clothes bought *today*.
  *   **Analysis:** The benefit (the cheap shirt, the savings) is separable from the agent.
  *   **Standing:** The objection has force. The critic has standing *if* they cease the transaction. The condition for standing is satisfiable. This functions as a **suspension of standing**, not a permanent loss.
  *   **Label:** **Contingent Beneficiary Disqualification.**

  **B. Constitutive Benefits (Invalid Objection / Silencing)**
  *   **Case:** A citizen demands reckoning for an atrocity that built the economy they were born into. They cannot "un-live" their childhood or return the security that allowed them to be educated enough to criticize.
  *   **Analysis:** The benefit is woven into the agent's identity and capacity to act. To "give up" the benefit would be to cease to be the person they are, or to annihilate their capacity to speak.
  *   **Standing:** Here, the objection fails as an ethical claim about standing. It violates the principle **"Ought Implies Can."** If one *cannot* renounce the benefit, one cannot be *required* to renounce it to hold moral standing.
  *   **Function:** In this zone, *Involuntary Beneficiary Disqualification* ceases to be a genuine ethical objection and becomes a **Silencing Tactic**. It weaponizes the impossibility of purity to protect the status quo.
  *   **Label:** **The Purity Trap.**

  ### Why the "Twist" Matters

  You noted that the objector claims the critic could speak *if* they gave up the benefit, even when giving it up is impossible. This reveals that the objection is not actually about **Standing** (the normative right to hold someone accountable) but about **Credibility** (the rhetorical weight of the speaker) or **Power** (who is allowed to speak).

  1.  **If it were about Standing:** Standing is a normative permission. If I have a right to blame you for stealing, I don't lose that right because I inherited money from a thief. My right to demand justice is not contingent on my own financial purity, provided I am not *currently* stealing.
  2.  **If it were about Credibility:** The objector might mean, "Your judgment is biased because you benefit." This is an epistemic claim, not a moral one. It invites scrutiny of the argument, not dismissal of the speaker.
  3.  **The Reality of the Twist:** When the benefit is inextricable (e.g., citizenship, language, economic security), demanding its renunciation is a **Performative Contradiction**. The objector is using the very structures of the unjust system (language, economy, social platform) to tell the critic they cannot speak because they are in that system.

  ### Summary of the Carving

  To use this concept in your analysis, you can classify the objection as follows:

  | Feature | Hypocrisy | Complicity | **Involuntary Beneficiary Disqualification** |
  | :--- | :--- | :--- | :--- |
  | **Source of Defect** | Contradictory Action | Causal Contribution | **Passive Receipt of Gain** |
  | **Agency Required?** | Yes (Active violation) | Yes (Active participation) | **No (Can be structural/hereditary)** |
  | **Condition to Regain Standing** | Align conduct with words | Cease contribution / Repair | **Renounce Benefit** |
  | **Validity if Benefit is Inextricable** | N/A | N/A | **Invalid (Becomes Silencing)** |

  ### Conclusion

  There is no single word in the standard canon equivalent to "Hypocrisy" for this case. The closest established phrase is **"The Beneficiary Objection."**

  However, to capture the specific ethical failure you identified—where the condition for standing is unsatisfiable—you should label this **"The Purity Trap."**

  *   **Definition:** A rhetorical move that denies a critic standing to blame a systemic wrong on the grounds that they benefit from it, where the benefit is constitutive of their existence and cannot be renounced without self-annihilation.
  *   **Ethical Status:** It is an **illegitimate defeater of standing**. While benefiting from injustice may create *reparative duties* (things you owe), it does not remove *standing* (the right to demand justice), provided the benefit was not actively sought or maintained through ongoing endorsement.
  *   **Distinction:** Unlike hypocrisy, it does not charge the critic with violating the norm. Unlike complicity, it does not charge them with causing the harm. It charges them with **existing within the aftermath**, which is not a valid ground for silencing.

  This carving allows you to acknowledge that beneficiaries *do* have special responsibilities (to repair, to listen) without conceding that they lose the right to speak against the wrongs that shaped them.
