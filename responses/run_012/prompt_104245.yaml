  *   **Status:** This is standard in the literature. Almost all parties (both proponents and skeptics of CP) agree that if the cause isn't cognitive, it isn't *cognitive* penetration.

  **Rule 2: The Phenomenal Condition (Strongly Supported)**
  *   **Formulation:** For an effect to count as penetration, there must be a change in the *phenomenal character* of the experience (what it is like for the subject).
  *   **Evidence:** She accepts *The Fruit* and *The Hillside* (experience changes). She explicitly rejects *The Threshold* because "nothing in the experience itself has changed," despite the change in discrimination performance.
  *   **Status:** This aligns with the "Liberal" view in the literature (e.g., Susanna Siegel), which prioritizes the subject's phenomenological report over sub-personal metrics.

  **Rule 3: The Representational Condition (Latent/Untested)**
  *   **Formulation:** For an effect to count as penetration, the change must be describable as a change in the *represented properties* of the object (color, slant, size).
  *   **Evidence:** In *The Fruit* and *The Hillside*, the subjects report specific property changes (yellow, steep). However, your philosopher has never explicitly ruled *against* a case where the experience changed but the properties did not. She has only ruled against cases where *neither* changed (*Threshold*).
  *   **Status:** This is the fault line. Many skeptics (e.g., Firestone & Scholl) argue that if represented properties don't change, it's merely *attention*, not perception. Proponents argue that "salience" or "insistence" is itself a phenomenal property.

  ### 2. Prediction for "The Searchlight"
  **The Ruling:** She will likely rule this **Penetration**.

  **The Reasoning:**
  Her rejection of *The Threshold* is the key. In that case, she had objective data showing improved sensitivity but rejected CP because the *subject reported no change in experience*. In *The Searchlight*, she has no objective property change (the scene represents the same data), but the *subject reports a change in experience* ("more insistent").

  To remain consistent with her reasoning in *The Threshold*, she must privilege the subject's phenomenological report. If she ruled "Not Penetration" here, she would be contradicting her own justification for *The Threshold*. She would effectively be saying: "In *Threshold*, I trusted your report that nothing looked different. In *Searchlight*, I will ignore your report that something looks different."

  **The Philosophical Cost:**
  By ruling this Penetration, she commits herself to the view that **Attention and Perception are not hermetically sealed.** She is accepting that cognitive modulation of *salience* counts as a change in perceptual experience, even if spatial/chromatic content remains static. This places her in the "Liberal" camp of the debate.

  ### 3. The Underdetermination Warning
  You asked me to flag if the matter is genuinely underdetermined. **It is.**

  There is a tension between **Rule 2 (Phenomenal)** and **Rule 3 (Representational)**.
  *   In *Fruit* and *Hillside*, Phenomenal Change and Representational Change covaried. We don't know which one did the work in her verdict.
  *   In *Searchlight*, they come apart. The Narrator stipulates the *Representation* is unchanged ("scene represents exactly what it represented"), but the Subject reports the *Phenomenology* is changed.

  If your philosopher is a **Representationalist** (she believes experience *is* representation), she *must* rule **Not Penetration**. She would have to argue the subject is mistaken: "If the scene represents the same properties, the experience *cannot* be different; you are confusing a feeling of anticipation with seeing."

  If your philosopher is a **Phenomenalist** (she believes experience has a 'qualitative feel' that can shift independently of represented properties), she *must* rule **Penetration**.

  **Best Guess:** Given her explicit wording in *The Threshold* ("nothing in the **experience itself**"), she leans Phenomenalist. She treats the subject's "what it's like" report as the final arbiter. Therefore, **Penetration** is the consistent ruling, but it exposes her to the criticism that she is conflating *attention* with *perception*.

  ### 4. The Seventh Case (The Tie-Breaker)
  To cleanly separate Rule 2 (Phenomenal) from Rule 3 (Representational) and solidify her theoretical stance, you should write a case that isolates **Affective Valence** from **Sensory Properties**.

  **The Case: "The Hostile Door"**
  *   **Setup:** A subject is led to believe a specific door in a hallway is locked and dangerous (cognitive state).
  *   **Observation:** The subject looks at the door. They do *not* report it as darker, larger, or distorted (no sensory property change). They do *not* report it as "salient" or "standing out" (avoiding the Attention/Searchlight overlap).
  *   **Report:** The subject reports that the door looks **"menacing"** or **"forbidding,"** though they admit the color and shape are identical to the safe doors nearby.
  *   **The Question:** Is "menacing" a perceptual property (like yellow or steep), or is it a cognitive judgment layered on top of perception?

  **Why this separates the rules:**
  *   **If she rules Penetration:** She accepts that high-level *affective* properties (value, threat) can be part of the phenomenal character of perception, even without sensory distortion. This cements her as a strong Liberal (close to J.J. Gibson's affordances or Siegel's "epistemic charge").
  *   **If she rules Not Penetration:** She reveals that her "Phenomenal Condition" actually has a hidden constraint: the phenomenal change must be *sensory* (color, shape, slant, salience). This suggests she is a Representationalist about sensory content, viewing "menacing" as a post-perceptual emotion.

  ### 5. Contextual Note: Consensus vs. Contested
  When writing her internal monologue or dialogue, keep the following distinctions clear to maintain philosophical credibility:

  1.  **Settled:** Everyone agrees that cognition affects *behavior* and *decision-making* (The Threshold case). Everyone agrees that multisensory integration (The Dubbed Film) is not cognitive penetration.
  2.  **Contested:** Whether "salience" (The Searchlight) counts as perception or attention. This is the core of the **Firestone & Scholl (2016)** critique ("Cognition Does Not Affect Perception"). They argue that almost all alleged CP cases are actually just changes in attention, eye movement, or decision bias.
  3.  **Contested:** Whether "affordances" or "values" (The Hostile Door) are perceived properties. **Proffitt's** work on the Hillside is famously controversial; many vision scientists argue the hill doesn't *look* steeper, subjects just *say* it is to match the effort required. Your philosopher has already committed to taking the subject's report at face value (ruling it Penetration), which is a defensible but contested philosophical stance (Phenomenal Conservatism).

  **Summary for your Draft:**
  *   **Ruling:** Penetration (based on consistency with *The Threshold*).
  *   **Justification:** The subject reports a change in "what it is like," and the cause is cognitive. The lack of named property changes is irrelevant if phenomenology is the metric.
  *   **Risk:** She is blurring the line between Attention and Perception.
  *   **Next Step:** Write "The Hostile Door" to see if she allows *emotional* properties into perception, or if she draws the line at *sensory* properties.
