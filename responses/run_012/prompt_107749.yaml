      *Challenge:* Can one example do both?
      *Solution:* Use a specific claim made by a specific person. "Alice said: 'The bank is open'."
      1. Equivalence: "It is true that the bank is open" = "The bank is open."
      2. Generalization: "Everything Alice says is true."
      This links the specific to the general. Let's refine the "One Example" to be a *scenario* involving a speaker and claims. Let's use "The Guidebook."
