      Okay, I will recommend the **"Generalization over a set of claims"** (e.g., "Everything in the textbook is true") as the carrying example, because it forces the issue of *why* we need the word.
      *Wait, better idea:* **The Proposition 'p'**.
      No, that's too abstract.
      *Decision:* I will recommend **"Everything the witness asserted in court."** It allows for specific instances ("The light was red") and the general endorsement ("Everything she said is true"). It touches on normativity (lying under oath). It fits the 80 mins.

