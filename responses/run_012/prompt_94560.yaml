answer: |-
  Sir, you press me upon a distinction of the utmost consequence, though one which the clamour of merchants often obscures from the public eye. You ask why I do not recommend separation outright when the account book of empire shows so red a balance. The answer lies in my hope for reconciliation rather than rupture. I am a friend to the liberty of the colonies, yet I am also a friend to the British constitution. My proposal for representation in Parliament is not merely a fiscal device to extract revenue, but a constitutional remedy to unite the interests of the metropolis with those of the plantations. If the colonies are taxed without representation, it is tyranny; if they are represented, they become partners. I do not advocate separation as a primary good, for the dissolution of such ties must always be a misfortune where friendship once existed. However, I have stated plainly that if the parent state insists upon a dominion which yields nothing but loss and discord, it were better to abandon the claim than to persist in a ruinous project. I stop short of demanding independence only because I believe a voluntary union, based on equitable taxation and free trade, is preferable to a hostile divorce.

  Regarding the Navigation Act, you must distinguish between defence and monopoly. I concede that the Act, which confines the carrying trade to British bottoms, is a wise regulation *if* defence is preferred to opulence—and indeed it ought to be, for safety is the precondition of wealth. That Act builds the navy which protects the island. But the monopoly of the colony trade is a different creature entirely; it is not for defence, but for the exclusive profit of a particular order of men. It forces capital into channels where it yields less return to the public, raising profits for merchants while depressing wages and rents for the multitude. The logic of defence justifies the Navigation Act; it does not justify the extortion of a monopoly that drains the blood of the nation to feed a few. My case is weakest, I admit, upon the practicality of colonial representation. The distance is vast, and the spirit of the colonial assemblies is fierce; to integrate them into the Parliament of Great Britain may be a theoretical justice that is practically chimerical. To change my mind on the whole matter, you would need to demonstrate that the colonies contribute voluntarily to the common defence in proportion to their protection, and that the monopoly does not distort the natural allocation of capital away from more productive employments in Europe. Until such evidence is produced, I must maintain that the present system is a burden upon the many for the gain of the few.
