answer: |-
  ### Philosopher's Assessment

  **The Theorems:**
  Harsanyi's **Aggregation Theorem** states that if individual preferences and a social preference ordering both satisfy von Neumann–Morgenstern (VNM) rationality axioms, and the social ordering satisfies the Pareto principle, the social welfare function must be a weighted sum of individual utilities. The **Impartial Observer Theorem** is the ethical application: an observer who imagines having an equal probability of being any member of society and maximizes expected utility will choose the social state that maximizes average utility.

  **Assessment of Your Suspicion:**
  Your suspicion is well-formed and distinct from the standard objections. The standard objection targets the imposition of VNM axioms on the *social* ordering, arguing this presupposes the risk-neutrality of utilitarianism. Your objection targets the *individual* coherence of the observer's extended preferences. It asks: What metaphysics of the self allows a subject to hold coherent preferences over "being person A" vs. "being person B"?

  If personal identity is constituted by specific preferences or psychological traits (a constitutive view), the observer cannot coherently "inhabit" another's life without ceasing to be the observer. If the observer remains distinct, the comparison is merely external and loses the empathic force Harsanyi requires.

  **The "Formal Device" Reply:**
  The strongest reply is that extended preferences are merely a formal mechanism for interpersonal comparison, requiring no metaphysical commitment. However, you can counter this by arguing that without the metaphysical commitment, the construction loses its *normative traction*. If I am not literally evaluating *my* prospects in those lives, why should the result bind me morally? The dilemma is robust: either the thought experiment relies on a controversial metaphysics of transferable selves, or it is a formal trick with no ethical authority.

  **Verdict:**
  This survives. It does not collapse into the standard ex ante/ex post objection because it concerns the *subject* of the preference, not the *risk structure*. It is viable for a one-year project.

  ***

  ### Research Proposal

  **Title:** The Subject of Extended Preferences: Metaphysical Presuppositions in Harsanyi's Impartial Observer

  **Research Question**
  John Harsanyi's Impartial Observer Theorem derives utilitarianism from the rational choices of an observer who imagines having an equal probability of occupying any social position. This project asks: *What metaphysics of personal identity is required for the observer's "extended preferences" to be coherent, and does that metaphysics undermine the argument's claim to neutrality?*

  Specifically, I will investigate whether the construction presupposes a "transferable subject"—a self that can inhabit distinct lives while retaining evaluative continuity. If a person's preferences are partly constitutive of their identity, the observer's ranking of "being me" versus "being you" may be ill-defined. The project seeks a determinate answer: Is the Impartial Observer argument metaphysically committed, and if so, is that commitment compatible with the pluralistic premises of liberal welfare economics?

  **State of the Art and Gap**
  The literature on Harsanyi's theorem is extensive but leaves this question open. Three dominant lines of critique exist, none of which address the metaphysical coherence of the observer.

  First, the **axiomatic objection** argues that imposing VNM rationality on the social ordering presupposes the very ex ante standpoint the theorem aims to justify. This critiques the *aggregate* function, not the individual extended preferences. My project accepts the formal derivation but challenges the intelligibility of the inputs.

  Second, the **welfarist objection** claims the theorem ignores non-utility information (rights, freedoms). This is a substantive ethical disagreement about what matters, whereas my question is prior: it asks whether the utility comparisons themselves are conceptually stable.

  Third, the **bargaining-theoretic or ex post objection** focuses on how risk is distributed. Critics argue that maximizing average utility ignores the separation of persons. While this touches on identity, it focuses on the *distribution of goods* rather than the *coherence of the imagining subject*.

  Consequently, a significant gap remains. Defenders often dismiss the "imagining" language as a heuristic for a formal device. However, if it is merely formal, it is unclear why the result carries normative weight for actual moral agents. If it is not merely formal, it requires a defense of the metaphysics of empathy. Existing literature treats this as a psychological capacity rather than a metaphysical precondition.

  **Methodology**
  This project employs conceptual analysis rather than formal modeling or empirical survey. Formal characterization theorems cannot resolve whether a thought experiment is metaphysically coherent; they can only show what follows from its assumptions. Similarly, intuition surveys would measure psychological ease, not conceptual validity.

  Over twelve months of part-time research, I will proceed in three phases:
  1.  **Reconstruction:** I will reconstruct the Impartial Observer argument to isolate the precise role of "extended preferences." I will distinguish between *sympathetic* preferences (caring about another) and *extended* preferences (preferring to be another).
  2.  **Metaphysical Analysis:** I will analyze the conditions required for a subject to coherently hold extended preferences. I will draw on the metaphysics of personal identity (specifically psychological continuity theories) to test whether an observer can retain enough identity to compare lives while adopting enough of the target's identity to evaluate them accurately.
  3.  **Normative Evaluation:** I will assess whether the required metaphysics is compatible with the liberal neutrality Harsanyi claims. If the argument requires a specific, controversial view of the self, it cannot serve as a neutral foundation for social choice.

  **Possible Outcomes**
  The analysis will likely result in one of three conclusions:
  1.  **The Metaphysical Burden:** The argument requires a robust, Lockean notion of a transferable self. This renders the theorem ethically substantive rather than neutral, limiting its applicability in pluralistic societies where such metaphysics are contested.
  2.  **The Normative Deflation:** The argument requires no specific metaphysics because extended preferences are purely formal. However, this severs the link between the observer's choice and actual moral obligation. The theorem would remain mathematically valid but ethically inert.
  3.  **The Reconstruction:** A modified view of extended preferences (e.g., based on objective features of lives rather than subjective identification) can save the argument. This would require significant revision to Harsanyi's original formulation.

  Considerations deciding between these outcomes will turn on whether the "equal probability" assumption can make sense without a coherent subject to whom the probabilities apply. If the subject dissolves across the counterfactual lives, the expected utility calculation lacks a bearer.

  **Risk and Feasibility**
  **Success:** The project succeeds if it demonstrates that the Impartial Observer argument rests on a hidden metaphysical premise that has been overlooked by both defenders and critics. Even a negative result (showing the premise is untenable) is a substantive contribution to the foundations of welfare economics.

  **Failure:** The project fails if the suspicion collapses into the standard axiomatic objection. If it turns out that the "metaphysical" problem is just a restatement of the complaint that VNM axioms shouldn't apply to social choice, the project offers no new insight. I will mitigate this by rigorously distinguishing the coherence of the *subject* from the rationality of the *ordering*.

  A second risk is that the project succeeds but is "too thin." If the conclusion is merely that "Harsanyi uses language loosely," this is not worth reporting. To avoid this, I will aim to show that the metaphysical commitment actively blocks the theorem's application in specific, contemporary ethical contexts (e.g., decisions affecting future generations or persons with severe cognitive disabilities, where identity is most contested).

  **Scope**
  To ensure completion within one year of part-time work, I will strictly delimit the scope.
  1.  **Cut:** I will not address the general history of utilitarianism or the broader debate between utilitarianism and prioritarianism, except where directly relevant to Harsanyi's derivation.
  2.  **Cut:** I will not engage with the technical literature on social choice functionals beyond what is necessary to state the theorem. The focus is philosophical, not mathematical.
  3.  **Cut:** I will not develop a full alternative theory of social choice. The goal is diagnostic: to identify the flaw, not necessarily to build the replacement.

  If the analysis reveals that the problem extends to all forms of interpersonal utility comparison, I will restrict the final output to the Harsanyi case to maintain focus. The primary deliverable will be a journal article arguing that the Impartial Observer Theorem is not a bridge between rationality and morality, but a bridge between a specific metaphysics of the self and morality.

  **Conclusion**
  Harsanyi's theorem remains a cornerstone of modern utilitarianism. By exposing its metaphysical underpinnings, this project challenges the claim that utilitarianism can be derived from thin rationality constraints alone. It forces a choice: either we accept a substantive metaphysics of the self, or we abandon the idea that rational empathy necessarily leads to average utilitarianism.
