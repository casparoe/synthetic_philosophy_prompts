answer: |-
  **Title:** The Input Side of Underdetermination: Modeling the Messenger in the Judy Benjamin Problem

  **The Question**
  The Judy Benjamin problem is standardly taken to show that rational updating on conditional information is underdetermined: when an agent learns only that $P_{new}(B|A) = p$, rival rules (such as minimum relative entropy and various generalizations of conditionalization) yield divergent posteriors. This proposal challenges the locus of that underdetermination. I argue that the ambiguity lies not in the updating rule, but in the modeling of the input. If the message is modeled not as a bare constraint on the posterior, but as an event $M$ in an expanded space with likelihoods $P(M|World)$ dependent on the state of the world, standard conditionalization yields a unique posterior. The determinate question for this project is: **Which rival updating rules are mathematically equivalent to standard conditionalization on a message-generation event, and which fail this reduction when the messenger's disposition to speak is correlated with the truth?**

  **Why Existing Treatments Leave It Open**
  Current literature treats the input as a static constraint on the probability function (e.g., "fix the conditional probability"). This abstracts away from the pragmatics of communication. By ignoring the likelihood that a messenger would issue a specific report given the underlying state, existing treatments insulate updating rules from empirical scrutiny. They assume the message is a "bare constraint" rather than evidence generated by a process. Consequently, debates between rival rules rest on intuitive appeals to "minimal change" or "informational efficiency" rather than on whether the rule correctly tracks the evidential weight of the message itself. This leaves the choice of rule underdetermined because the input model is insufficiently specified to drive a unique solution.

  **Work Plan**
  I will formalize the "Message-as-Event" model, where receiving a report is treated as observing an event $M$ with specific likelihoods conditional on the partition elements. The core of the work is a two-stage construction designed to separate rival rules:

  1.  **Stage One (Convergence):** I will construct a baseline scenario where the messenger's disposition is neutral (likelihoods are uniform across relevant states). In this limit, I will show that standard conditionalization on the message event converges with the outputs of rival rules (e.g., minimum entropy). This establishes that the rivals are viable approximations under idealized reporting conditions.
  2.  **Stage Two (Divergence):** I will modify the scenario so the messenger's disposition is correlated with the state (e.g., the messenger is more likely to report the conditional if the antecedent is true). Here, standard conditionalization on the message event will shift the posterior in a specific direction. I will then test the rival rules against this baseline.

  The deciding consideration will be **likelihood sensitivity**. A valid updating rule must shift the posterior in accordance with the likelihood ratio of the message generation. I will demonstrate that while some rival rules can be retrofitted to match the Bayesian baseline by adjusting the input constraint, others structurally cannot accommodate the evidential weight of the correlated messenger without violating their own axioms.

  **Failure Conditions**
  The project fails if: (1) it turns out that *every* rival rule can be trivially represented as conditionalization on some contrived message event, rendering the distinction vacuous; or (2) the "correlated messenger" model is shown to be pragmatically incoherent (i.e., if modeling the message as an event requires assigning likelihoods that no rational agent could hold). Additionally, if the mathematical reduction requires assumptions as contentious as the updating rules themselves, the claim to restore uniqueness will collapse.

  **Scope and Viability**
  This is a workshop paper, not a dissertation in disguise. While the "Message-as-Event" framework has implications for the broader philosophy of information and testimony, this project is limited to the formal adequacy of updating rules in the Judy Benjamin context. I am not attempting to solve the general problem of uncertain evidence, but rather to show that a specific class of counterexamples to standard conditionalization dissolves once the input is properly modeled. The goal is to establish the framework and the two-stage test, leaving the broader epistemological consequences for future work.
