      *(Ritual Check)*: The prompt says "everyone at the table writes one sealed prediction." I need to make sure the speech instructs them to do this *now* or explains it clearly. I will frame it as the closing action of the speech.

  8.  **Finalizing the Text:** (Proceeding to generate speech based on these thoughts).

      *Key phrase to anchor:* "The courage to remain undecided."
      *Key action:* Writing the prediction.

