prompt: |-
  I'm the safety-and-quality lead at a company that makes industrial lifting gear -- cranes, hoists, rigging -- and a chunk of my job is writing up incident investigations, maybe fifteen a year, everything from a near-miss where a load slipped a few inches off the floor to a fatality. The findings section of those reports is basically a list of 'we know X' sentences. We know the sling was undersized. We know the operator bypassed the limit switch. We know the brake seized because of water getting in. Legal reads them, the regulator reads them, and after a bad one a plaintiff's lawyer reads them back to me three years later in a room with a court reporter.

  I keep getting into fights here about how strong the evidence has to be before I'm allowed to write 'we know'. Some of my colleagues say it's the same standard every time -- either you've got the evidence or you haven't, and it doesn't matter whether we're talking about a scuffed paint job or a guy in the hospital. I've been reading around this thing called pragmatic encroachment, which says that's not how it works, that how much evidence you need before you know something shifts with what's at stake. And there's contextualism, which is a cousin of it, somthing about 'knows' changing meaning with the conversational context, though I gather the two views aren't the same thing.

  Can you turn this into an actual procedure I can run? I want the questions to ask in order for a given finding, what counts as a sufficient answer at each step, and a rule for where the report stops short of 'we know' and says 'the evidence indicates' or 'we could not determine'. I've got about an hour per finding and no philosophy training, and legal has to sign off on the wording. Things it has to handle:

  - Same evidence, different stakes. A visual inspection plus a maintenance log looks like knowledge after a near-miss. Does it look like knowledge after a fatality?
  - Whose stakes? Mine writing the report? The guy on the shop floor? His family? The reader in the deposition?
  - The timing problem. If 'knows' depends on context, then a sentence can be true when I write it and false when it's read back to me in court. Does that mean I should just write to the highest foreseeable stakes, or does that throw away the whole idea?
  - The differnce between the bar for the claim being true, the bar for me putting it in the report, and the bar for us acting on it -- shutting a line, recalling a product. I suspect my colleagues are smearing these three together and I want the procedure to keep them apart even if it turns out they usually track each other.

  Then run it on three findings: (1) a near-miss where a load slipped and the log shows a missed inspection; (2) a fatality where the physical evidence burned up and all I've got is two conflicting witness statements; (3) a case where the evidence is genuinely solid but the finding lands on our biggest customer's maintenance crew.

  Also tell me straight where the procedure can't decide anything and I'm just making a values call, and where it'll misfire -- I'd rather find that out now than in a deposition. And please don't hand me a reading list, I need the thing itself.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Safety-and-Quality Lead at an industrial lifting gear company.
      *   **Task:** Writing incident investigation reports (approx. 15/year, ranging from near-miss to fatality).
      *   **Problem:** Internal conflict over the epistemic standard for using the phrase "We know" in findings. Colleagues say it's binary (evidence exists or not). User suspects context/stakes matter (pragmatic encroachment/contextualism).
      *   **Constraints:** 1 hour per finding, no philosophy training, legal sign-off required.
      *   **Specific Needs:** A concrete procedure (questions, sufficiency criteria, rules for wording), handling specific edge cases (stakes, timing, truth vs. reporting vs. action), and running it on three specific scenarios.
      *   **Tone:** Practical, direct, actionable, acknowledging limitations (where it's a values call). No reading lists.

  2.  **Deconstruct the Philosophical Concepts (for internal use, not output):**
      *   *Pragmatic Encroachment:* Knowledge depends on practical stakes. High stakes = higher evidence threshold for "knowing."
      *   *Contextualism:* The meaning of "knows" shifts with the conversational context (who is asking, why, etc.).
      *   *User's Insight:* The user is right that "We know" carries different weight in a near-miss report vs. a fatality deposition. The colleagues are wrong to treat it as purely binary evidence existence.
      *   *The "Timing Problem":* If context changes later (court), does the statement become false? *Solution:* Write for the highest *reasonably foreseeable* stakes at the time of writing, but distinguish between *factual findings* and *conclusions*.
      *   *Distinction:* Truth of claim vs. Warrant to assert in report vs. Warrant to take action. These need separate tracks.

  3.  **Drafting the Procedure (The "Epistemic Triage Protocol"):**
      *   *Goal:* Make it a checklist/workflow that fits within 1 hour.
      *   *Structure:*
          1.  **Stakes Assessment:** Define the context immediately.
          2.  **Evidence Grading:** Categorize the quality of evidence.
          3.  **Wording Decision:** Map Evidence + Stakes to specific phrases ("We know," "Evidence indicates," "Undetermined").
          4.  **Action Threshold:** Separate from wording.
      *   *Addressing Specific Constraints:*
          *   *Whose Stakes?* Focus on the *subject* of the finding (the injured party, the public) and the *user* of the report (regulator, court).
          *   *Timing:* Write for the "Highest Reasonably Foreseeable Context" (HRFC).
          *   *Truth vs. Report vs. Action:* Explicitly separate these in the workflow.

  4.  **Refining the Wording Rules:**
      *   "We know": High confidence + High stakes met.
      *   "Evidence indicates/strongly suggests": High confidence + High stakes *not* fully met, OR Moderate confidence + Low stakes.
      *   "Could not determine": Insufficient evidence regardless of stakes.
      *   *Legal Check:* This needs to sound defensible. "We know" implies certainty. In law, certainty is rare. Maybe suggest "The investigation confirms..." instead of "We know" for better legal shielding, but stick to the user's terminology for the procedure while adding a legal warning. *Correction:* The user specifically asked about "We know." I should advise on the risk of that specific phrase but provide the procedure for it. Actually, better advice: Use "The investigation establishes" instead of "We know." It's more passive and objective. I will incorporate this nuance.

  5.  **Developing the Three Scenarios:**
      *   *Scenario 1 (Near-miss, missed inspection):* Low stakes (no injury). Evidence: Log + Visual. *Result:* "We know" is probably okay, but "Evidence indicates" is safer.
      *   *Scenario 2 (Fatality, burned evidence, conflicting witnesses):* High stakes. Evidence: Low/Conflicting. *Result:* "Could not determine" or "Evidence is inconclusive." Do *not* use "We know."
      *   *Scenario 3 (Solid evidence, big customer at fault):* High stakes (commercial/legal). Evidence: Solid. *Result:* "We know" is epistemically fine, but commercial stakes might require softer language ("Maintenance records show...") to avoid libel/contract issues, even if true. This highlights the Truth vs. Reporting distinction.

  6.  **Addressing the "Where it Fails" (Limitations):**
      *   Philosophy can't solve legal strategy.
      *   Philosophy can't solve commercial pressure.
      *   The "Timing Problem" is real; writing for max stakes makes low-stakes reports cumbersome.
      *   Values Call: How much risk is the company willing to accept of being wrong?

  7.  **Review against Constraints:**
      *   *1 Hour?* The checklist needs to be quick.
      *   *No Philosophy?* Explain concepts in plain English (e.g., "Cost of Being Wrong").
      *   *Legal Sign-off?* Include a specific step for Legal.
      *   *No Reading List?* Check.

  8.  **Final Polish:**
      *   Make it look like a Standard Operating Procedure (SOP).
      *   Ensure the distinction between *Epistemic Standard* (Do we know?) and *Pragmatic Standard* (Should we say we know?) is clear.
      *   *Self-Correction on "We Know":* In a legal context, "We know" is dangerous. It admits absolute certainty. I must advise the user to shift phrasing to "The evidence establishes." I will build this into the procedure as a "Legal Safeguard."

  9.  **Drafting the Content (Iterative refinement):**
      *   *Introduction:* Acknowledge the user's insight (they are right, colleagues are wrong).
      *   *The Protocol:* Step-by-step.
      *   *The Matrix:* Evidence Quality x Stakes Level = Wording.
      *   *The Scenarios:* Apply the matrix.
      *   *The Failure Modes:* Be honest about where philosophy ends and risk management begins.

  10. **Final check on "Whose Stakes":** The procedure must define the "Stakes Holder." It's not the writer. It's the person potentially harmed by the *error* in the report. In a fatality, it's the family/accused. In a commercial dispute, it's the company/customer.

  11. **Final check on "Timing":** The rule is "Write for the highest *reasonably foreseeable* audience." If a fatality is possible, write as if a prosecutor will read it.

  12. **Final check on "Truth vs. Report vs. Action":** Create three distinct boxes in the procedure.
      *   Box 1: Is it true? (Evidence)
      *   Box 2: Can we say it? (Stakes/Wording)
      *   Box 3: Do we act? (Risk Management)

      *(Self-Correction during drafting)*: Keep it tight. Don't over-explain the philosophy. Just use the logic.

      *Let's build the "Stakes Calculator".*
      Low: Property damage only, no regulatory interest.
      Medium: Recordable injury, regulatory notice.
      High: Fatality, permanent disability, criminal potential, major litigation.

      *Let's build the "Evidence Grader".*
      A: Direct physical evidence + corroboration.
      B: Circumstantial + consistent testimony.
      C: Conflicting testimony / degraded evidence.

      *Mapping:*
      High Stakes + Grade A = "Establishes/Confirms" (Avoid "Know")
      High Stakes + Grade B = "Indicates/Suggests"
      High Stakes + Grade C = "Undetermined"
      Low Stakes + Grade B = "We know" (Acceptable risk)

      *Wait, one nuance:* The user asked about "We know." I need to respect that but warn them. I will recommend "The investigation confirms" as a synonym that sounds less like personal opinion.

      *Okay, ready to write.*
answer: |-
  Here is a Standard Operating Procedure (SOP) designed for your constraints. It translates the philosophical concepts of pragmatic encroachment and contextualism into a risk-management workflow. It separates **Truth** (what happened), **Assertion** (what you write), and **Action** (what you do).

  ### SOP: Epistemic Triage for Incident Findings
  **Purpose:** To standardize the wording of investigation findings based on evidence quality and the stakes of being wrong.
  **Time Budget:** 15 minutes of this protocol per finding (leaving 45 mins for evidence gathering/writing).
  **Authority:** Safety & Quality Lead, with Legal sign-off on "High Stakes" wording.

  ---

  ### Part 1: The Three-Track Separation
  Your colleagues are conflating three different decisions. This procedure forces you to make them separately.

  1.  **The Truth Track:** Does the evidence support the claim? (Binary: Yes/No/Insufficient).
  2.  **The Assertion Track:** Given the stakes, are we allowed to claim this as a fact in a permanent record? (Scale: "We know" vs. "Indicates" vs. "Undetermined").
  3.  **The Action Track:** Do we take corrective action based on this? (Independent of wording).

  *Note: You can take Action even if you cannot make the Assertion. (e.g., "We couldn't prove the brake failed, but we are replacing all brakes anyway.")*

  ---

  ### Part 2: The Stakes Calculator (Contextualism)
  Before writing a finding, assign a **Stakes Level** to the specific claim. This answers "Whose stakes?" and "The Timing Problem."

  **Rule:** You write for the **Highest Reasonably Foreseeable Audience (HRFA).** If a near-miss *could* have been a fatality, or if a report *could* be subpoenaed, you write for the fatality/subpoena context, not the current internal context.

  | Stakes Level | Definition | HRFA (Who are you writing for?) |
  | :--- | :--- | :--- |
  | **Level 1 (Low)** | Property damage only. No injury. No regulatory trigger. | Internal Management / Insurance Adjuster |
  | **Level 2 (Medium)** | Recordable injury. Regulatory notice required. Potential civil suit. | OSHA/Regulator / Civil Attorney |
  | **Level 3 (High)** | Fatality. Permanent disability. Criminal negligence potential. Major product liability. | Crown Prosecutor / Plaintiff Counsel / Coroner |

  ---

  ### Part 3: The Evidence Grader (Truth Track)
  Grade the evidence for the specific finding, ignoring stakes for a moment.

  | Grade | Criteria |
  | :--- | :--- |
  | **Grade A (Solid)** | Physical evidence recovered + data logs + consistent witness testimony. No credible alternative explanation. |
  | **Grade B (Probable)** | Circumstantial evidence + one witness OR physical evidence with minor gaps. Alternative explanations are unlikely but possible. |
  | **Grade C (Weak)** | Conflicting witness statements. Physical evidence destroyed/missing. Reliance on assumption or hearsay. |

  ---

  ### Part 4: The Wording Matrix (Assertion Track)
  Cross-reference **Stakes Level** (Part 2) with **Evidence Grade** (Part 3) to determine the permitted phrasing.

  | | **Level 1 (Low Stakes)** | **Level 2 (Med Stakes)** | **Level 3 (High Stakes)** |
  | :--- | :--- | :--- | :--- |
  | **Grade A (Solid)** | **"We know..."** <br>*(Acceptable risk)* | **"The investigation confirms..."** <br>*(Objective tone)* | **"The evidence establishes..."** <br>*(Legal defensibility)* |
  | **Grade B (Probable)** | **"We know..."** <br>*(Acceptable risk)* | **"The evidence indicates..."** <br>*(Hedges slightly)* | **"It is highly probable that..."** <br>*(Avoids absolute claim)* |
  | **Grade C (Weak)** | **"We could not determine..."** <br>*(Honest)* | **"The evidence is inconclusive..."** <br>*(Protective)* | **"The cause remains undetermined."** <br>*(Absolute protection)* |

  **Legal Note:** Even when the matrix allows "We know," Legal prefers **"The investigation confirms"** or **"The evidence establishes."** "We know" sounds like personal opinion; "Evidence establishes" sounds like objective fact. Use the latter for Level 2 and 3.

  ---

  ### Part 5: The Action Rule
  **Rule:** Action thresholds are independent of Wording thresholds.
  *   **Safety Critical:** If the risk is death/injury, you act on **Grade B** evidence ("Indicates"). You do not wait for Grade A ("Establishes").
  *   **Commercial/Process:** If the risk is cost/efficiency, you act on **Grade A** evidence only.

  ---

  ### Application to Your Three Scenarios

  #### Scenario 1: Near-miss, load slipped, log shows missed inspection.
  *   **Stakes:** Technically Level 1 (no injury), *but* HRFA is Level 2 (Regulator could argue it *could* have been serious). Let's call it **Level 2**.
  *   **Evidence:** Visual (slip marks) + Log (missing signature). This is **Grade A** for the inspection failure, **Grade B** for the slip cause.
  *   **Procedure Output:**
      *   *Finding on Inspection:* "The maintenance log **establishes** the inspection was missed." (Level 2 / Grade A).
      *   *Finding on Slip:* "The evidence **indicates** the load slipped due to rigging tension." (Level 2 / Grade B).
      *   *Action:* Retrain team (Action threshold met).
  *   **Why:** You can be firm on the paperwork failure (hard evidence) but softer on the physics (circumstantial).

  #### Scenario 2: Fatality, evidence burned, two conflicting witnesses.
  *   **Stakes:** **Level 3** (Fatality/Prosecutor).
  *   **Evidence:** Witnesses conflict, physical evidence gone. This is **Grade C**.
  *   **Procedure Output:**
      *   *Finding:* "The cause of the brake failure **remains undetermined**."
      *   *Wording Check:* Do **not** write "We know the brake failed." Do **not** write "The evidence indicates Witness A is right."
      *   *Action:* Issue safety bulletin on brake maintenance anyway (Action threshold met due to fatality, despite Grade C evidence).
  *   **Why:** In Level 3 stakes, Grade C evidence never supports a factual claim. Writing "We know" here is perjury risk.

  #### Scenario 3: Solid evidence, finding blames biggest customer's maintenance crew.
  *   **Stakes:** **Level 3** (Commercial/Contractual/Litigation). Even if no injury, the financial stakes of accusing a major partner are High.
  *   **Evidence:** **Grade A** (Telemetry data shows override).
  *   **Procedure Output:**
      *   *Finding:* "Telemetry data **establishes** the limit switch was bypassed at the control station."
      *   *Wording Check:* Avoid "The customer's crew bypassed..." (Attributes intent). Stick to "The switch was bypassed." (Attributes fact).
      *   *Action:* Share report with customer (Commercial decision, not safety).
  *   **Why:** The evidence supports the fact, but the *attribution of blame* raises the stakes. Keep the finding to the mechanical fact, not the human intent, unless you have video of the specific person.

  ---

  ### Where This Procedure Will Fail (The "Values Call")

  You asked for the failure modes. Here they are. Philosophy cannot solve these; only management can.

  **1. The "Cost of Truth" Problem**
  *   **The Issue:** Sometimes Grade A evidence exists (e.g., video of a worker violating safety rules), but stating it "establishes" that violation exposes the worker to firing or the company to union grievance.
  *   **The Failure:** The procedure says "Write it." Management says "Soft-pedal it."
  *   **The Fix:** You must have a pre-agreed rule with HR/Legal on whether reports are *disciplinary tools* or *learning tools*. If they are learning tools, you anonymize findings ("The operator" vs. "John Doe"). This procedure assumes anonymization. If you name names, the Stakes Level automatically becomes Level 3.

  **2. The "Action Without Assertion" Friction**
  *   **The Issue:** In Scenario 2 (Fatality), the procedure tells you to write "Undetermined" but "Act anyway."
  *   **The Failure:** Operations will ask: "Why are we spending $500k fixing brakes if we don't *know* they failed?"
  *   **The Fix:** You need a standard disclaimer: *"Corrective actions are based on risk elimination, not solely on confirmed root causes."* Put this in the report header.

  **3. The "Creeping Stakes" Problem**
  *   **The Issue:** A Level 1 near-miss today becomes Exhibit A in a Level 3 lawsuit three years from now.
  *   **The Failure:** You treated it as Low Stakes, used "We know" on Grade B evidence. In court, it looks like negligence.
  *   **The Fix:** **The Golden Rule:** *Always write Level 1 reports as if they are Level 2.* It takes 5 extra minutes. There is no downside to over-qualifying a low-stakes report. There is massive downside to under-qualifying a high-stakes one. Adjust the Matrix: **Never use "We Know" for Level 1. Use "Evidence Indicates."**

  **4. The Legal Veto**
  *   **The Issue:** Legal may forbid "The evidence establishes" because they want *everything* to say "Alleged."
  *   **The Failure:** The procedure becomes useless if Legal treats every investigation as pre-litigation.
  *   **The Fix:** Negotiate a "Safe Harbor" clause. Reports generated within 14 days of an incident for safety improvement are "Protected Safety Documents" (where possible under local law) and use the Wording Matrix. Reports generated after a lawyer is retained switch to "Legal Defense" mode (everything is "Alleged"). You need to know which mode you are in before starting the checklist.

  ### Summary Checklist for Your Desk
  1.  **Assign Stakes:** (Low/Med/High). *Default to Med if unsure.*
  2.  **Grade Evidence:** (A/B/C).
  3.  **Select Phrase:** Use the Matrix. *Default to "Evidence Indicates" over "We Know."*
  4.  **Check Action:** Does safety require action even if evidence is weak? (Yes/No).
  5.  **Legal Review:** Required for all High Stakes or any finding assigning blame to a specific external party.

  This keeps you honest about the evidence, protects you on the stakes, and keeps the line open to fix things even when you can't prove exactly why they broke.
