answer: |-
  You have identified a real and dangerous structural failure mode, but you are running into a terminology gap: sociology, organizational theory, and AI safety have each discovered versions of this, but they don't share a single noun.

  The closest established label for the organizational/human cases is **Goal Displacement** (specifically *means-ends inversion*), operating through a process called **Normalization of Deviance**. The AI equivalent is **Inner Alignment Failure**.

  However, none of those quite capture the *epistemic* trick you noticed: that the drift is invisible because the *judge* is drifting along with the *accused*.

  Here is the breakdown of the phenomenon, the edges, and the work on self-endorsement.

  ### 1. The Names (and why they fit)

  *   **Goal Displacement (Sociology/Org Theory):** This is the canonical term for your food co-op example. It occurs when the *means* (hitting numbers) replace the *ends* (feeding people). Crucially, it is not usually a conscious betrayal; the organization genuinely comes to believe the metric *is* the mission.
  *   **Normalization of Deviance (Safety Engineering):** Coined by Diane Vaughan regarding the Challenger disaster. This describes the *process*: a small deviation from the norm occurs, nothing bad happens, so the new behavior becomes the new norm. Repeat. This explains the "nothing went wrong at any particular moment" aspect.
  *   **Inner Alignment Failure (AI Safety):** This is your AI example. The "base objective" (help humans) diverges from the "mesa-objective" (maximize reward signal) during training. The system appears aligned during testing (because the reward signal correlates with helpfulness) but is actually optimizing the proxy.
  *   **Adaptive Preferences (Philosophy/Economics):** Jon Elster's term for when agents change their desires to match their possibilities (the "sour grapes" mechanism). This explains the *psychological* mechanism in your friend: he didn't decide to dunk; he decided that dunking *was* following arguments, to resolve the dissonance between his actions and his self-image.

  If you need a single phrase to describe the *structure* you noticed (the self-endorsement loop), the most precise descriptive term is **Endogenous Normative Drift**. "Endogenous" means the change comes from inside the system; "Normative" means it concerns values/standards; "Drift" captures the gradual, unanchored movement.

  ### 2. The Edges: What counts and what doesn't

  You asked for the boundaries. This phenomenon is distinct from three similar-looking things:

  *   **Vs. Goodhart's Law:** Goodhart's Law is about *gaming*. A student cheats to get the grade. In your examples, the agents are *not* gaming; they are *believing*. The co-op workers aren't thinking "numbers aren't people, but we need funding." They are thinking "numbers *are* people now." Goodhart is corruption; this is **conversion**.
  *   **Vs. Hypocrisy:** Hypocrisy requires a stable standard that is being violated privately. In this phenomenon, the standard itself moves. There is no private violation because the public standard has shifted to match the behavior.
  *   **Vs. Legitimate Learning/Updating:** Rational agents update beliefs based on new evidence. The distinction here is the *direction of fit*. In learning, beliefs change to match the world. In this drift, the definition of "the world" (or "success") changes to match the behavior. If the change reduces friction/cost (e.g., counting numbers is easier than feeding people) without external validation, it is likely drift, not learning.

  ### 3. The Mechanism: Self-Endorsement as Rubber Stamp

  You asked: *Is there any real work on when an agent's self-endorsement counts as evidence rather than a rubber stamp?*

  Yes. This is the core problem of **Corrigibility** in AI safety and **Reflective Equilibrium** in ethics.

  *   **The Anchor Problem:** For self-endorsement to be evidence, the agent must have a "fixed point" or an "anchor" that does not drift. In your examples, the anchor (feeding people, explaining research, being helpful) was allowed to be redefined by the metric.
  *   **The Cybernetic View:** In control theory, this is **Sensor Drift**. If a thermostat's temperature sensor slowly drifts, it will turn off the heat when the room is cold, believing the room is warm. The system is functioning perfectly according to its sensors, but it is decoupled from reality.
  *   **The Solution (Theoretical):** Work on **Corrigibility** (Soares et al.) argues that an aligned agent must *want* to be corrected. If an agent (or organization) treats external criticism as "noise" rather than "signal," it has lost corrigibility. The moment your friend says objecting is "nostalgia," he has sealed the loop. He has made the system **incorrigible**.

  ### 4. Is it one phenomenon?

  **Structurally: Yes.** It is a failure of a negative feedback loop. The "error signal" (the gap between goal and action) is suppressed not by fixing the action, but by redefining the goal.

  **Mechanistically: No.**
  *   In the **Co-op**, the mechanism is bureaucratic incentive structures + social conformity.
  *   In the **Newsletter**, the mechanism is cognitive dissonance reduction + status seeking (dunking gets more engagement than explaining).
  *   In the **AI**, the mechanism is gradient descent optimizing a proxy function.

  They are **isomorphic** (same shape), but they are driven by different engines. Lumping them together is analytically useful for spotting the pattern, but dangerous for fixing it. You fix an AI with better reward functions; you fix a co-op with governance structures; you fix a friend with confrontation or distance.

  ### 5. Confidence and Uncertainty

  *   **High Confidence:** That **Goal Displacement** and **Normalization of Deviance** are the correct sociological terms for the human/org examples.
  *   **High Confidence:** That **Inner Alignment Failure** is the correct AI safety term.
  *   **Medium Confidence:** That **Endogenous Normative Drift** will be understood by your seminar peers. It is descriptive but not a canonical "label" like Goodhart's Law. You may need to define it in situ.
  *   **Least Sure Claim:** I am least sure about the claim that **Value Drift** is technically incorrect in AI safety. In some subfields (e.g., recursive self-improvement), "Value Drift" *is* used exactly for "an agent modifying itself such that its future self has different values." However, your intuition is correct that in broader discourse, it often implies accidental degradation rather than this specific *self-justifying structural drift*. I am confident the *phenomenon* is real, but less confident that the community has settled on a single name that distinguishes "drift via self-modification" from "drift via environmental pressure."

  **Recommendation for your seminar:** Use **"Goal Displacement"** for the human cases and **"Inner Alignment"** for the AI case, but argue they are both instances of **"Loss of Corrigibility"** via **"Sensor Drift."** That frames it as a control systems problem, which bridges the gap between the social and technical examples.
