  ### 1. Statistical Properties of the Capped Gamble

  Let $X$ be the random variable representing the payoff. The game proceeds by flipping a fair coin until heads appears. Let $n$ be the flip number of the first heads. In the standard game, the payoff is $2^n$. In this capped version, the payoff is truncated at $2^N$.

  The probability mass function is:
  $$ P(X = 2^n) = 2^{-n} \quad \text{for } n = 1, 2, \dots, N-1 $$
  $$ P(X = 2^N) = \sum_{k=N}^{\infty} 2^{-k} = 2^{-(N-1)} $$
  (Note: The probability mass for all outcomes $n \ge N$ is accumulated at the cap $2^N$.)

  **Expected Monetary Payoff (EMP)**
  The expectation is the sum of values weighted by their probabilities:
  $$ E[X] = \sum_{n=1}^{N-1} 2^n \cdot 2^{-n} + 2^N \cdot 2^{-(N-1)} $$
  The term $2^n \cdot 2^{-n} = 1$. There are $N-1$ such terms.
  The cap term is $2^N \cdot 2^{-(N-1)} = 2^1 = 2$.
  $$ E[X] = (N - 1) + 2 = N + 1 $$
  *Dependence on N:* The EMP depends linearly on $N$.

  **Median Payoff**
  The median $m$ satisfies $P(X \le m) \ge 0.5$ and $P(X \ge m) \ge 0.5$.
  Calculate the cumulative probability for the first outcome ($n=1$, payoff $2^1=2$):
  $$ P(X = 2) = 2^{-1} = 0.5 $$
  $$ P(X \le 2) = 0.5 $$
  $$ P(X \ge 2) = 1.0 $$
  Since both conditions are met, the median is 2.
  *Dependence on N:* The median does not depend on $N$ (provided $N \ge 1$).

  **Probability Payoff $\ge 2^k$**
  For a fixed integer $k$:
  If $k > N$, $P(X \ge 2^k) = 0$.
  If $1 \le k \le N$:
  $$ P(X \ge 2^k) = \sum_{n=k}^{N-1} 2^{-n} + P(X=2^N) $$
  $$ = (2^{-(k-1)} - 2^{-(N-1)}) + 2^{-(N-1)} = 2^{-(k-1)} $$
  *Dependence on N:* For any fixed $k$, this probability is independent of $N$ as long as $N \ge k$.

  **Explanation of Divergence**
  The expectation and median part company because the expectation sums the *magnitude* of outcomes, while the median identifies the *50th percentile* of the cumulative probability. The EMP grows with $N$ because each additional increment in the cap adds a new outcome $2^N$ with probability $2^{-N}$. The contribution to the expectation is $2^N \cdot 2^{-N} = 1$. Thus, every doubling of the cap adds exactly 1 unit to the expected value, regardless of how unlikely that outcome is. The median, however, is determined solely by the first coin flip (which yields 2 with probability 0.5). The vanishingly small probabilities of the high payoffs do not shift the 50th percentile.

  ### 2. Bounded Certainty Equivalent with Diverging Expectation

  As $N \to \infty$, the expected monetary payoff $E[X] = N + 1$ diverges to infinity. If infinite expectation were the sole source of the paradox, a finite cap should resolve the tension between price and value. However, for large finite $N$, $E[X]$ can be arbitrarily large while the median remains 2.

  To show this divergence is not the root cause, we construct a utility function $U_1(w)$ representing a risk-averse player with wealth $W$. Let the utility of wealth be:
  $$ U_1(w) = \ln(w) $$
  This function is increasing ($U' > 0$) and concave ($U'' < 0$) on all positive wealth $w > 0$.

  The Expected Utility (EU) of the gamble (assuming price $p=0$ for valuation) is:
  $$ EU_N = \sum_{n=1}^{N-1} 2^{-n} \ln(W + 2^n) + 2^{-(N-1)} \ln(W + 2^N) $$
  For large $n$, $\ln(W + 2^n) \approx \ln(2^n) = n \ln 2$.
  The $n$-th term behaves like $2^{-n} \cdot n \ln 2$.
  The series $\sum_{n=1}^{\infty} n 2^{-n}$ converges (to 2).
  Therefore, as $N \to \infty$, $EU_N$ converges to a finite limit $EU_{\infty}$.

  The Certainty Equivalent (CE) is the sure sum $C$ such that $U_1(W + C) = EU_{\infty}$.
  $$ \ln(W + C) = EU_{\infty} \implies C = e^{EU_{\infty}} - W $$
  Since $EU_{\infty}$ is finite, $C$ is finite.
  **Conclusion:** Even as the expected monetary payoff grows without bound, a player with logarithmic utility will value the gamble at a finite amount. The "puzzle" (that one should not pay an infinite or arbitrarily large price) persists even when expectation is finite, and is resolved by risk aversion, not by capping the expectation.

  ### 3. Unbounded Certainty Equivalent and the General Condition

  We now exhibit a second utility function $U_2(w)$ that is also increasing and concave on all positive wealth, but yields a CE that grows without bound as $N \to \infty$.

  Define $U_2(w)$ by its marginal utility:
  $$ U_2'(w) = \frac{1}{\ln(w + e)} $$
  Integrating from 1 to $w$ (and setting $U_2(1)=0$ for normalization):
  $$ U_2(w) = \int_{1}^{w} \frac{dt}{\ln(t + e)} $$
  **Properties:**
  1.  **Increasing:** $U_2'(w) > 0$ for all $w > 0$.
  2.  **Concave:** $U_2''(w) = -\frac{1}{(w+e)(\ln(w+e))^2} < 0$ for all $w > 0$.
  3.  **Respect of Difference:** $U_2$ differs from $U_1$ in its **Asymptotic Growth Rate**. $U_1$ grows logarithmically ($\ln w$), while $U_2$ grows super-logarithmically (approximately $w / \ln w$). $U_2$ is "less concave" at the limit.

  **Behavior of CE:**
  Evaluate the expected utility term for large $n$:
  $$ U_2(2^n) \approx \frac{2^n}{\ln(2^n)} = \frac{2^n}{n \ln 2} $$
  The contribution to expected utility is:
  $$ 2^{-n} \cdot U_2(2^n) \approx 2^{-n} \cdot \frac{2^n}{n \ln 2} = \frac{1}{n \ln 2} $$
  The sum of these terms is proportional to the harmonic series $\sum \frac{1}{n}$, which diverges.
  Thus, $EU_N \to \infty$ as $N \to \infty$. Consequently, the Certainty Equivalent $C$ satisfying $U_2(W+C) = EU_N$ must also grow without bound.

  **General Condition:**
  The behavior is decided by the convergence of the series $\sum_{n=1}^{\infty} 2^{-n} U(2^n)$.
  *   If the series **converges** (as with $U_1 = \ln w$), the CE is bounded as $N \to \infty$.
  *   If the series **diverges** (as with $U_2 \approx w/\ln w$), the CE is unbounded as $N \to \infty$.
  $U_1$ falls on the convergent side; $U_2$ falls on the divergent side.

  ### 4. Verdicts on Buying at Price $p$

  Assume the player currently holds wealth $W$ and is offered the gamble for price $p$.

  1.  **Expected Monetary Value (EMV) Maximization:**
      *   **Reasoning:** Buy if $p < E[X]$.
      *   **Verdict:** Buy if $p < N + 1$.
      *   **Sensitivity:** **Sensitive to N.** As the house's reserves grow, the recommended price increases linearly. For sufficiently large $N$, EMV recommends paying an arbitrarily large price.

  2.  **Expected Utility Maximization (using $U_1 = \ln w$):**
      *   **Reasoning:** Buy if $E[U_1(W - p + X)] > U_1(W)$. This is equivalent to $p < CE$.
      *   **Verdict:** Buy if $p < C_{\text{log}}$, where $C_{\text{log}}$ is a finite constant determined by $W$.
      *   **Sensitivity:** **Insensitive to N** (for large $N$). The maximum willingness to pay stabilizes regardless of the house's cap.

  3.  **Median Outcome Rule:**
      *   **Reasoning:** Buy if $p < \text{Median}(X)$.
      *   **Verdict:** Buy if $p < 2$.
      *   **Sensitivity:** **Insensitive to N.** The recommendation is constant regardless of the house's reserves.

  ### 5. The Single Feature Driving the Behavior

  The feature that generates the tension (growing EMV vs. stable Median/CE) is the **matching rate of payoff growth and probability decay**. Specifically, the payoff doubles ($2^n$) exactly as the probability halves ($2^{-n}$), keeping the contribution to the expectation constant ($1$) per step.

  **Demonstration by Alteration:**
  Change the payoff structure so that payoffs grow slower than probabilities decay. Let the payoff be $1.5^n$ with probability $2^{-n}$ (still capped at $N$).
  *   **New EMP:** $E[X'] = \sum_{n=1}^{N-1} 1.5^n 2^{-n} + \text{cap term} = \sum (0.75)^n + \dots$
  *   This is a geometric series with ratio $0.75 < 1$. As $N \to \infty$, the sum converges to a finite constant ($\approx 3$).
  *   **Result:** The EMV recommendation stabilizes at a finite value. The tension between EMV and Median no longer escalates with $N$; it becomes a fixed discrepancy. The "paradoxical" pressure to pay more as $N$ increases disappears.

  ### 6. Adversarial Note

  **Strongest Objection:**
  A defender of Expected Value might argue: "You have restricted the problem to a *single* gamble. Rationality is defined over the long run. If a player could repeat this capped gamble indefinitely, the Law of Large Numbers ensures their average return converges to the EMV ($N+1$). Refusing to pay $p < N+1$ is therefore irrational wealth destruction over time. Your construction artificially isolates the agent from the statistical reality that validates EMV."

  **Survival of the Case:**
  Much of the case survives this objection. The problem specification explicitly constrains the scenario to a **single** gamble ("The house offers a single gamble"). In single-shot decisions involving high skew and finite wealth, the "long run" is a counterfactual that does not exist. The risk of ruin or significant wealth reduction is real in the single case, whereas it is washed out in the limit. The construction successfully demonstrates that *within the context of a single decision*, EMV provides recommendations that diverge from both risk-averse utility maximization and median-based heuristics as $N$ grows.

  **Establishment:**
  This case establishes that an **infinite expected payoff is not a necessary condition** for the St. Petersburg tension. The conflict between "mathematical value" and "sensible price" arises from the *structure* of the tail (constant expectation contribution per step), not the *infinity* of the sum. It further establishes that risk aversion (concave utility) is sufficient to resolve the paradox, provided the utility function does not grow too rapidly (Condition from Step 3).

  **Non-Establishment:**
  This case does not establish that Expected Utility Maximization is the *only* rational alternative. The Median Rule also yields a stable, sensible verdict insensitive to $N$. Nor does it prove that Log Utility is the "true" utility function of humans; it only shows that *some* concave functions resolve the tension while others (like $U_2$) do not. Finally, it does not refute EMV as a tool for repeated, diversified investment, only its prescriptive power for single, highly-skewed events.
