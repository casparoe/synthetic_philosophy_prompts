prompt: |-
  Bit of a weird one. I was in a group chat argument about populism last night and this guy kept deploying "the will of the people" as a conversation-ender. The three moves: (a) a court struck down a referendum result, and he said the court was defying the will of the people; (b) I pointed out the referendum passed 52-48 and the polls had since flipped, and he said that doesn't matter, the vote a few years back expressed the will of the people once and for all, and later elections don't change it; (c) when I asked who exactly "the people" is, he said everyone who isn't part of the corrupt elite.

  I genuinely couldn't tell whether he was making a boring claim (majorities should generally get their way) or something much stranger -- that there's a single thing out there, the will of the people, which exists whether or not anyone votes for it, which can be known, and which he somehow has access to. And I want to know whether any version of it actually licenses ignoring a court.

  Can you lay out the distinct precise claims that phrase could be making, from the boring to the radical, and give me a verdict on each? Things I suspect matter, but tell me if they're red herrings: whether the will is discovered or made by procedures; whether it's one thing or just an aggregate of individual wants; whether it's a fact about what people actually want now or what they'd want if they knew more (some kind of counterfactual); whether "the people" can be a body that excludes some of its own members and still count as the people; whether it can persist unchanged through the very elections that are supposed to register it; and whether a collection of humans can have a will at all without being a single agent. Also I have a vague memory of some old distinction between a "general will" and "the will of all" -- am I making that up, and if I'm not, does it actually help here?

  Format please:

  - "Bottom line" first, about 3 sentences: which reading is doing the work in the chat, and whether it gets him the conclusion he wants about the court.
  - "The menu": numbered readings, 2-4 sentences each, ordered from most platitudinous to most radical.
  - "Verdicts": one line per reading -- platitude / defensible / dubious / false / not even coherent -- plus a sentence of why.
  - "What he probably meant": a short paragraph connecting the readings to his three moves.
  - "What it costs him": a short paragraph on what he'd have to give up in order to keep the reading that does the work.

  Aim for under 1000 words, and dont bother with citations, I'm not writing anything formal.
