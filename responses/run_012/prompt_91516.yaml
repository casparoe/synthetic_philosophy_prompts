      *   *Section 4: Promise vs. Threat.* This needs careful wording. Focus on *who holds the veto*.
      *   *Conclusion:* Summarize the position.

  9.  **Refining the "Consent" constraint:**
      *   User said: "don't fudge it or wave at 'consent' without explaining what consent is doing."
      *   *Solution:* Define consent not as "feeling okay with it" but as "the exercise of a normative power to alter rights/duties." In a promise, the promisee consents to the *obligation* (by accepting the promise), thereby gaining the right. In a threat, there is no transfer of right.

  10. **Refining "Autonomy/Respect":**
