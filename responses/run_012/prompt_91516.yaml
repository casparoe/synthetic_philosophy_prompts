answer: |-
  Here is the position: **Friend B is right, but the "remote control" metaphor needs to be cashed out in terms of normative powers and claim-rights.**

  Friend A's view (Prediction + Penalty) is the "Sanction Theory." It fails because it cannot explain why the *promisee* specifically holds the power of release, nor why a promise binds when no one is watching (no reputational penalty).

  Friend B's view (Authority Transfer) is the "Will Theory" of promises. It succeeds, but only if we define "authority" precisely. A promise is not just a statement of intent; it is a **speech act that transfers a specific jurisdiction over your future action to the promisee.**

  Here is the argument for why this binds, how it handles your edge cases, and why it is structurally distinct from a threat.

  ### 1. The Mechanism: Directed Duties and Claim-Rights
  To understand why promises bind without relying on "vibes" or generic "respect," we must look at the **structure of the obligation.**

  Most moral duties are *undirected*. I have a duty not to litter. I owe that duty to... everyone? No one? The environment? If I litter, I am wrong, but no specific individual has the standing to forgive me for it.

  A promise creates a **directed duty**. When I promise you $10, I do not just incur a duty *that* you get $10. I incur a duty *to you*. Correlatively, you acquire a **claim-right** against me.

  This is the mechanical work "autonomy" does here. It is not a garnish; it is the engine. By promising, I exercise my autonomy to alter the normative landscape. I take a piece of my future freedom (the liberty to choose whether to pay) and I convert it into your property (your right to demand payment).

  **Why this binds:**
  It binds because to break a promise is not merely to act badly; it is to **usurp a right that now belongs to someone else.** Once the promise is made and accepted, the decision over whether that action occurs is no longer solely yours. You have alienated that slice of authority. To break the promise is to act as if you still own a right you have already given away. That is a contradiction of your own prior exercise of agency.

  ### 2. The Release Problem: The Smoking Gun
  This is where Friend A dies and Friend B lives.

  **Friend A's Failure:** If a promise is just a prediction + reputational penalty, the "penalty" is social. It is enforced by the community's disapproval. If I predict I will show up, and I don't, the community frowns. Why should *your* say-so stop the community from frowning? If I flake, I am unreliable. You saying "never mind" doesn't make me reliable again. On Friend A's view, the reputational damage should stick regardless of your waiver, because the prediction was still false.

  **Friend B's Success:** If a promise is a transfer of authority (a claim-right), then **you own the claim.**
  Think of it like a debt. If I owe you money, that is a normative fact. But it is a fact *between us*. You are the creditor. Only the creditor can forgive a debt. The community cannot forgive my debt to you; only you can.
  When you release me from a promise, you are exercising your property right over my obligation. You are saying, "I waive the claim I hold against you." Because the obligation was *directed to you*, your waiver extinguishes it. This explains the asymmetry perfectly: A third party cannot release you because they never held the right.

  ### 3. The Edge Cases: Taxonomy of Commitment
  Your edge cases break Friend A's view (which treats them all as "expectations") but they help refine Friend B's view. We must distinguish **Promissory Obligations** (Interpersonal) from **Commitments/Vows** (Intrapersonal or Unidirectional).

  *   **Promise to the Dead:** This is **not a promise** in the strict sense. It is a *vow*. Since the promisee no longer exists, they cannot hold the claim-right, nor can they release you. The obligation persists only as a matter of your own integrity (a duty to yourself to honor your past word), not as a duty *to them*. The fact that this feels "different" (often heavier, because it can't be released) confirms that standard promises rely on the living agency of the promisee.
  *   **Promise to Yourself:** This is a *resolution*. There is no transfer of authority. You cannot release yourself in the same way because you never transferred the right away. You can change your mind, though you may suffer a loss of self-trust. It lacks the "directed duty" structure.
  *   **Forgotten Promise:** This **is a promise.** The claim-right exists even if not currently exercised. Just because a creditor forgets they are owed money doesn't mean the debt vanishes. The normative fact remains until recalled or waived.
  *   **Secret Promise (They never find out):** This is a **defective promise.** A promise requires *uptake*. To transfer authority, the other party must accept the transfer. If you "promise" silently or in a way they never know, you haven't invited them to rely. You have merely made a resolution *about* them. It binds you only as a matter of integrity, not interpersonal obligation.
  *   **Pointless Promise (Circumstances Changed):** This is the **Release** scenario in disguise. If the purpose of the promise is frustrated, the implicit contract is that the promisee *ought* to release you. If they refuse to release you despite the pointlessness, you are technically still bound (they hold the right), but they are violating the *spirit* of the reliance invitation. However, strictly speaking, if they insist, the obligation holds. This proves the right is theirs, not yours.

  ### 4. Promise vs. Threat: The Jurisdiction Test
  This is the crux. You asked what a promise does that a threat doesn't, without waving at "consent."

  Both a promise and a threat change what you can count on.
  *   **Threat:** "If you cross the line, I will shoot."
  *   **Promise:** "If you call, I will pick you up."

  Structurally, they look like conditionals. But normatively, they are inverses regarding **who holds the veto.**

  **The Threat:**
  In a threat, I retain **exclusive jurisdiction** over the action. I am informing you of how *my* will operates. I am not giving you any right to my action. In fact, I am asserting my power to harm you (conditionally). You have no standing to "release" me from the threat. If you say, "I release you from shooting me," that is nonsensical. You cannot waive my duty not to shoot you (in most contexts) because that duty is owed to the moral law/society, not just to you as a transferable right. More importantly, you have no control over my decision. The threat is an assertion of *my* power over *your* options.

  **The Promise:**
  In a promise, I transfer **partial jurisdiction** to you.
  1.  **The Veto:** Once I promise, I cannot change my mind unilaterally. I need *your* permission to break the promise. You hold the veto over my change of mind.
  2.  **The Release:** As established, you can extinguish the obligation.
  3.  **The Standing:** If I break a promise, *you* are the specific victim who has the standing to blame me. If I execute a threat (that I had a right to make, e.g., "I will call the police"), there is no specific victim of a broken norm.

  **What "Consent" is doing here:**
  You asked not to fudge "consent." Here is the mechanical definition: Consent is the **exercise of a normative power to alter rights and duties.**
  *   In a **Threat**, I do not seek your consent to alter your rights; I warn you that I will exercise my own liberty in a way that impacts you.
  *   In a **Promise**, I invite your consent to create a new duty. When you accept the promise ("Okay, I'm counting on you"), you are exercising your normative power to accept the transfer of authority.

  **The Difference:**
  A threat makes you a **subject** of my will (you must navigate around my announced action).
  A promise makes me a **subject** of your claim (I must navigate around your right to my action).

  ### Summary of the Position
  Defend Friend B, but sharpen the blade.

  1.  **Ontology:** A promise is a speech act that creates a **directed duty** and transfers a **claim-right** to the promisee.
  2.  **Binding Force:** It binds because breaking it constitutes a violation of the promisee's normative property (their right to your action). It is a contradiction of the promisor's own prior exercise of autonomy.
  3.  **Release:** Only the promisee can release because only they own the claim-right. This disproves the "Prediction + Penalty" view.
  4.  **Edge Cases:** Cases lacking a living promisee with the power of release (dead, self, secret) are not true promises but *vows* or *resolutions*. They lack the interpersonal authority transfer.
  5.  **Threat vs. Promise:** A threat asserts the promisor's continued jurisdiction over their action. A promise transfers jurisdiction over that action to the promisee. The promisee holds the veto; the threatener retains it.

  This account avoids "vibes." It treats morality like a jurisdiction of rights. It explains the release asymmetry, categorizes the edge cases by the presence/absence of a rights-holder, and distinguishes threats by the direction of control.
