      *   Not reducible to expectation + sanction? Yes (Directed duty).
      *   Make Friend B's picture work? Yes (Remote control = Claim Right).
      *   Address Release? Yes (Owner of the claim waives it).
      *   Address Edge Cases? Yes (Categorized).
      *   Promise vs. Threat? Yes (Jurisdiction/Veto power).
      *   No garnish autonomy? Yes (Integrated into the mechanism).

  12. **Self-Correction on "Promise to the Dead":**
      *   Is it a promise? Philosophers disagree. I should take a stance. I'll argue it's a *quasi-promise* or *vow*. It lacks the release mechanism, which proves the core case requires a living promisee. This strengthens the "Authority Transfer" view.

  13. **Self-Correction on "Secret Promise":**
      *   If I promise you but tell no one, and you never know? That's not a promise. A promise must be communicated to be an invitation to rely. If I *think* you know but you don't? It's a failed promise. I need to be clear: Communication + Uptake is required for the "Authority Transfer" to land.

  14. **Final Polish:** Ensure tone is analytical and direct, matching the user's rigorous prompt. (Avoid "I think," use "The argument is...")

