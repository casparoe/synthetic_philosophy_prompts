answer: |-
  Here is the plan for your session, structured to lead your group from confidence in scientific reasoning to humility about historical evidence.

  ### 1. The Sequence of Ideas
  You must introduce the **candidates** before the **problem**. If you start with "we can't know," the engineers in the room will treat it as a puzzle to be solved rather than a structural limitation to be understood. They need to formulate the hypotheses themselves so they feel the weight of the failure to test them.

  1.  **The Observation (5 mins):** Show the wealth gap. Keep it stark. (e.g., GDP per capita of Switzerland vs. Chad).
  2.  **The Suspects (10 mins):** Elicit the three candidates (Geography, Culture, Institutions) from the group. Define them broadly.
      *   *Why here:* You need them to commit to these as plausible mechanisms before you show why they are hard to isolate.
  3.  **The Scientific Standard (10 mins):** Ask your engineers/teacher: "How do we test which suspect is guilty?" Guide them to the concept of a **controlled experiment** (hold two variables constant, change one).
      *   *Why here:* This establishes the epistemic bar. It makes the subsequent failure of evidence feel like a methodological problem, not just a lack of data.
  4.  **The One Case (20 mins):** **North vs. South Korea.** (See below for usage).
  5.  **The Tangle (15 mins):** Reveal why even this "perfect" case doesn't fully solve the general problem.
  6.  **The Distinction (15 mins):** Specific Cause vs. Pattern Cause.
  7.  **The Exit (5 mins):** The Final Question.

  ### 2. The One Case: North vs. South Korea
  Your instinct about the border town was half-right. It is too clean, which is why you must use it carefully. Do not use it to prove Institutions work. Use it to prove **controls are rare.**

  *   **What it must have:** A dramatic divergence in wealth with a clear, sharp dividing line in time and space. It must be visceral enough that "Geography" (soil, climate) is obviously identical.
  *   **What it must not have:** A suggestion that the split was random. (It wasn't; it was geopolitical).
  *   **Where it belongs:** Step 4, after the "Scientific Standard" is set.
  *   **How to deploy it:**
      1.  Present the divergence. Ask: "What changed?" (They will say: The Government/Institutions).
      2.  **The Pivot:** Do not accept this as the final answer. Ask: "Why did the institutions change *here* and not *there*?"
      3.  **The Trap:** The split was caused by the Cold War (Geopolitics/Geography of influence) and perhaps pre-existing political leanings (Culture/History).
      4.  **The Lesson:** This case isolates Institutions *only if* you assume the Border was exogenous. But the Border was caused by forces that might also affect wealth. Even in our best natural experiment, the variables are entangled at the root.
      5.  **The Kicker:** Ask: "How many other Koreas do we have?" (Answer: Almost none). This drives home that we have one clear data point for a theory that claims to explain the *world*.

  ### 3. Handling the Distinction (Specific vs. Pattern)
  This is your most sophisticated point. Place it in Step 6, after the group feels the frustration of the "Tangle."

  *   **Sharpening the terms:** Call it **"The Path vs. The Map."**
      *   *The Path (Specific):* Why did *this* car get to the destination? (Maybe it took a shortcut, maybe the driver was skilled, maybe the traffic was light).
      *   *The Map (Pattern):* What rules apply to *all* cars trying to get there?
  *   **The Point:** A factor can be essential to a specific history (e.g., "Coal was necessary for Britain's Industrial Revolution") without being a general rule for wealth (e.g., "Japan got rich without coal").
  *   **Why wait:** You cannot make this distinction until they realize that general laws are hard to find. If you say it too early, they will think you are just saying "history is complicated." You need them to feel the *structural* inability to separate variables first.

  ### 4. Misconceptions and Interceptions
  Pin these misconceptions to the exact moment they will arise:

  *   **"Correlation + Plausible Story = Explanation"**
      *   *Intercept at Step 2 (The Suspects).* When someone says "Tropical countries are poor because heat makes people lazy," acknowledge the story fits the data, then ask: "Does the data fit the story, or does the story fit the data? How would we tell?"
  *   **"A factor which cannot be measured precisely (Culture) cannot be doing any work"**
      *   *Intercept at Step 2.* Pre-empt this by defining Culture as "shared expectations about how others behave." Note that engineers deal with unmeasurable variables (e.g., "stress" in a material is a model, not a direct observation) all the time. The issue isn't measurability; it's separability.
  *   **"History is simply a longer correlation table"**
      *   *Intercept at Step 5 (The Tangle).* When discussing why Korea split, point out that tracing history back just pushes the entanglement further back (e.g., "Why was the Cold War here?"). More data points in time do not equal more independent variables.
  *   **"A single country... is decisive"**
      *   *Intercept at Step 4 (The Case).* Explicitly state: "Korea tells us what happened in Korea. Does it tell us what happens in Botswana?" Force them to generalize the finding and feel the stretch.

  ### 5. What to Refuse (Scope Creep)
  *   **Refuse to pick a winner.** If pressed ("But what do *you* think?"), answer: "I think the evidence is insufficient to say." If you pick a side, you validate the horse race you are trying to dismantle.
  *   **Refuse to define 'Wealth' too deeply.** Don't get bogged down in GDP vs. Happiness. Stick to economic output for the sake of the variable logic.
  *   **Refuse Policy Prescriptions.** Do not let the discussion drift to "So what should aid agencies do?" That requires answers you are explicitly saying we don't have. Say: "We are diagnosing the limits of the diagnosis, not writing the prescription."

  ### 6. The Final Question
  You need a question that tests whether they understand the *limits of evidence*, not whether they remember the *facts of the talk*.

  **"If you found a country with perfect geography and perfect institutions that remained poor, which of our three explanations would survive, and why?"**

  *   *Why this works:*
      *   If they say "Institutions," they missed the point (Institutions were perfect).
      *   If they say "Geography," they missed the point (Geography was perfect).
      *   If they say "Culture," they have accepted an unfalsifiable variable (the "get out of jail free" card).
      *   If they say "None, because 'perfect' is defined by the outcome," they get it (tautology).
      *   If they say "It proves there is no general law, only specific paths," they have mastered the Distinction.

  \answer{Sequence the talk as a failed experiment: establish the suspects, demand a controlled test, reveal the scarcity of valid controls, and conclude that general laws may be unknowable even if specific histories are clear.}
