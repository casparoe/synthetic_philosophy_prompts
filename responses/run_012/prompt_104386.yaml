      *   If I quit, I pay $S$ (my previous bid) and win £0. Loss = $-S$.
      *   The Trap: When $H$ gets close to £10, profit becomes negative. But quitting means realizing the loss $S$.
      *   Example: Bid is £9.50. Second bid is £9.00.
