      *   *Jeffrey Conditionalization:* $P_{new}(H) = \sum P_{old}(H | E_i) \cdot P_{new}(E_i)$. Here, $P_{new}(E_i)$ doesn't have to be 1. It allows direct adjustment of credences in a partition $\{E_i\}$.
      *   *The Partition Problem:* Jeffrey updating depends on the chosen partition. If I update on "It looks like 37" vs "It looks like 37 or 38", results might differ.
