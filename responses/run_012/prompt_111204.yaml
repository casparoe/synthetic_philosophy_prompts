answer: |-
  Right then. I can see why you've been chewing on this for weeks; it's the sort of puzzle that grinds your gears because it pits your direct experience against a very tight logical net. Your friend has cornered you with a classic argument, but corners aren't always the end of the room.

  You asked for a number, a breakdown, and no dodging. Here is my assessment.

  ### The Number
  My credence that the feeling-side of things does **no causal work at all** is **0.15 (15%)**.

  ### The Breakdown
  To get there, I've weighted the four pieces you asked for based on how much influence they have on the final verdict, and assigned a probability to how likely Epiphenomenalism is to survive each specific hurdle.

  **1. Do physical facts fix all the mental facts? (Weight: 40%)**
  *   **The Issue:** If every physical event has a sufficient physical cause (causal closure), and mental states aren't physical states, they get squeezed out. But if mental states *are* physical states (Identity Theory), they inherit the causal power.
  *   **Probability Epiphenomenalism survives this:** **0.10**.
  *   **Reasoning:** I think it is highly probable (90%) that the physical facts fix the mental facts *by being identical to them* or by realising them functionally. If the pain *is* the C-fibre firing (or the functional role), it causes the shout. Epiphenomenalism only gets a look-in if you insist mental states are distinct "extra" things.
  *   **Contribution:** $0.40 \times 0.10 = 0.04$

  **2. Can something be real and still do nothing at all? (Weight: 20%)**
  *   **The Issue:** This is a metaphysical question. Is a "causally inert substance" coherent?
  *   **Probability Epiphenomenalism survives this:** **0.30**.
  *   **Reasoning:** It's not logically impossible. You can imagine a shadow or a whistle that doesn't push the train. But in a naturalistic worldview, things that do nothing tend to get explained away as illusions. It's a bit weird, but not a dealbreaker on its own.
  *   **Contribution:** $0.20 \times 0.30 = 0.06$

  **3. Is your friend's last move fatal? (Weight: 30%)**
  *   **The Issue:** She argues that if the feeling doesn't cause the belief, the belief isn't *about* the feeling. This is the "Epistemic Objection".
  *   **Probability Epiphenomenalism survives this:** **0.10**.
  *   **Reasoning:** This is the strongest argument against the view. If my belief "I am in pain" is caused entirely by brain states, and the pain itself does nothing, then my belief would be the same even if I weren't in pain. That makes the belief unjustified or accidental. It renders the theory self-defeating. Epiphenomenalism rarely survives this intact.
  *   **Contribution:** $0.30 \times 0.10 = 0.03$

  **4. Is there a third option? (Weight: 10%)**
  *   **The Issue:** Identity theory, illusionism, or panpsychism.
  *   **Probability Epiphenomenalism survives this:** **0.20**.
  *   **Reasoning:** There are robust alternatives. If "pain" is just the brain state seen from the inside (Identity), the problem dissolves. If "pain" is an illusion generated by the brain (Illusionism), the *illusion* has causal power even if the *content* is false. These options are live contenders.
  *   **Contribution:** $0.10 \times 0.20 = 0.02$

  **Total Calculation:** $0.04 + 0.06 + 0.03 + 0.02 = \mathbf{0.15}$

  ### The Least Sure Piece
  I am least sure of **Piece 2 (Can something be real and do nothing?)**.
  This is purely metaphysical speculation. We don't have empirical data on "causally inert realities" because, by definition, we can't detect them. What would move this? If we discovered a physical analogue—something in physics that carries information or structure but exerts no force (like a specific topological feature of a field that is observable but doesn't interact)—it might make the idea of a "whistle" more respectable. Until then, it remains a philosophical guess.

  ### Where You and Your Friend Disagree
  You are at 0.1; she is at 0.9. The biggest split is almost certainly **Piece 1 (Physical facts fixing mental facts)**.

  *   **Your Friend's View:** She likely accepts that physical facts fix mental facts, but assumes this means mental facts are *distinct properties* that supervene on the physical. Combined with causal closure, she concludes they must be inert. She accepts the "whistle".
  *   **Your View:** You likely intuit that if the physical facts fix the mental facts, the mental facts *are* the physical facts (or the doing of them). You feel the causation because the feeling is part of the mechanism, not a by-product.
  *   **The Reality:** You are disagreeing on whether "fixing" implies "identity" (you) or "distinct correlation" (her). That is the hinge.

  ### The Zombie Question
  *If the feeling does no work, could a thing with a brain exactly like mine but no inner life at all still say 'ouch' and mean it?*

  **Answer:** Yes. Under the whistle picture, the physical brain causes the vocal cords to vibrate and the linguistic centres to process "ouch". The "meaning" is a functional state of the brain. The inner feeling is just a light on the dashboard that doesn't steer the car.

  **Does this shift my number?**
  Yes. It shifts my credence **down by 0.05 (to 0.10)**.
  **Why?** Because if I accept that a Zombie could say "ouch" but *not mean it* in the way I do (because it lacks the subjective grasp of pain), then the inner life *is* doing work—it's constituting the meaning. If the feeling is required for the belief to have the specific content "I am in pain" rather than just "System Error", then the feeling is causally relevant to the content of the thought. If it's relevant to the content, it's not a mere whistle. That intuition makes Epiphenomenalism even less attractive.

  ### Summary
  Your friend has built a very tight cage, but she's assumed the bars are made of iron when they might be made of definitions. The 15% risk I've assigned is basically the "Hard Problem" residue—the chance that there is something about experience that escapes physical description. But 85% of the weight says the feeling is the brain state doing its job, not a ghost riding along.

  Hope that helps you sleep a bit better.

