answer: |-
  Arthur, who views the weekly board gathering as a sacred ritual of continuity, demands physical presence and handwritten minutes, while Lena, who treats governance as a utility function to be optimized, insists on video conferencing and automated digital logs. They face two binary choices: meeting mode and record format. A midpoint compromise—hybrid calls with semi-digital notes—would frustrate Arthur's need for embodied tradition and Lena's need for seamless data integration, leaving both feeling the process is broken. Instead, they agree to Arthur's demand for physical presence, which costs Lena little since she values output over ambiance, and Lena's demand for digital logs, which costs Arthur little since he cares only for the gathering itself, not the archive. Neither admits the other's priority has intrinsic worth; Arthur accepts the digital logs merely as the toll for securing the room, and Lena tolerates the commute merely as the price of data access, resulting in a Pareto improvement where both secure their primary value without validating the other's worldview.

  The surplus arises from **asymmetric intensity of preference** (logrolling), where the utility loss of conceding on a low-priority issue is outweighed by the utility gain of winning on a high-priority issue. If the parties' relative costs were equalized—for instance, if Arthur hated digital logs as much as Lena hates commuting—the concession would exact a toll equal to the benefit received, collapsing the surplus into a zero-sum trade where one's gain is precisely the other's loss. A critic viewing compromise as a sellout would argue that by operationally enabling the opposing value system (Arthur allowing digital records, Lena funding physical travel), each party legitimizes a corrupting influence; they have not gained, but merely purchased the right to be complicit in the erosion of their own principles.
