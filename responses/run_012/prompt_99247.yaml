      *   Scenario: A wants Outcome 1. B wants Outcome 2.
      *   If they split the difference, they get Outcome 1.5, which both hate.
      *   If they trade "I give you total control on X, you give me total control on Y", both win because A cares mostly about X and B cares mostly about Y.
