  2.  **Deconstruct the Goal:**
      *   The goal is *abolishing suffering*, not managing it. This is a radical utilitarian/negative utilitarian aim (reminiscent of David Pearce's "Hedonistic Imperative").
      *   Key tension: Elimination of the *sensation* vs. elimination of the *cause* vs. elimination of the *capacity to feel*.
      *   Key constraint: Adoption without coercion (voluntary uptake) vs. Impact scale.
      *   Key risk: Making life "not worth living" (anhedonia, loss of meaning, ecological collapse).

  3.  **Brainstorm Criteria (Step 1):**
