prompt: |-
  I'm a novelist sketching a near-future story about a movement that wants to abolish suffering through biotech, not just manage it. I need a serious strategist's take, so act as a philosopher of mind who also knows the biotech landscape, and think carefully before you answer. Start by brainstorming the criteria you'd use, then give me a tier list (S, A, B, C, D) of these five levers, with a sentence or two on why each lands where it does: (1) a cheap, safe drug that blunts the capacity for grief and anxiety without touching pleasure; (2) a genetic tweak that raises the hedonic set-point of farmed animals so they suffer alot less in factory farms; (3) an AI system that detects suffering in any nervous system and automatically delivers pain relief; (4) a gene drive that redesigns predators so they no longer need to kill, reducing wild animal suffering; (5) a neuroimplant that lets people dial their own mood up or down, including to zero. Rank them by how much suffering they'd actually abolish, how likely they are to be adopted without coercion, and how much they risk making life not worth living in some other way. I'm especially interested in whether these would abolish suffering or just abolish the sufferer's ability to report it, and whether that distinction should change the ranking. I dont want a bibliography, just your reasoning. If the whole idea of abolishing suffering is conceptually confused, or if my list is the wrong list, say so plainly rather than humouring me -- I'd rather find out now. And tell me how confident you are in the ranking, and where you'd expect a thoughtful critic to push back hardest.
reasoning: |-
