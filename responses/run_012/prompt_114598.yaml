answer: |-
  Dear Colleagues,

  We are writing to you jointly to summarize the outcome of our adversarial collaboration regarding the trajectory of human social evolution. Our goal in this document is not to declare a victor but to delineate the precise structure of our disagreement so that future inquiry might address it productively. We have moved past the initial impulse to dismiss one another's frameworks and have instead agreed upon a shared vocabulary to describe where our interpretations diverge. We organize this divergence around the distinction between what we now call the ratchet view and the switchyard view. The ratchet view treats cumulative scale in energy, information, and population as a master variable that makes hierarchy increasingly likely and difficult to reverse, while the switchyard view treats scale as opening a set of possible tracks where institutions, coalitions, and contingent choices determine which path a society takes. Before detailing our remaining differences, we wish to record the substantial ground we share regarding what a grand narrative is legitimately supposed to explain and what the evidence can and cannot show.

  We both accept that any credible account of human history must explain the undeniable prevalence of states, hierarchy, and durable inequality in the modern world, as well as the correlation between population density and organizational complexity. We agree that the archaeological record is fragmentary and that silence in the record is not necessarily evidence of absence, though we differ on how to weigh that silence. We further agree that human agents possess the capacity for reflexivity and that political arrangements are not purely deterministic outcomes of environmental constraints, even if we disagree on the scope of that freedom in deep history. Finally, we agree that the burden of explanation lies on demonstrating why certain social forms persisted while others vanished, and that neither biological determinism nor pure voluntarism offers a sufficient explanation on its own. Within these shared boundaries, we have each specified what would count as a genuine anomaly that would force us to abandon our respective positions.

  For the defender of the ratchet view, a falsifying anomaly would be the discovery of multiple, sustained instances of large-scale societies operating over centuries without significant hierarchy, stratification, or centralized coercion, particularly in contexts where energy surplus and population density were high. If it could be shown that scale consistently fails to produce administrative hierarchy when specific cultural safeguards are present, the claim that scale acts as a ratchet locking in inequality would be untenable. For the defender of the switchyard view, a falsifying anomaly would be the demonstration that social scaling follows a single invariant sequence where increases in size necessarily eliminate horizontal coordination mechanisms without exception. If the record were to show that every increase in settlement size or energy capture correlates strictly with the emergence of dominant elites and that no evidence of seasonal political flexibility or deliberate decentralization exists in the deep past, the claim that history is a field of open experiments would be unsustainable.

  Despite this shared understanding of falsification, we remain divided on the interpretation of the existing data. The exact remaining disagreement can be stated in the following wording. The ratchet position holds that while alternative social arrangements are possible in principle, the probability of hierarchy approaches certainty as scale increases due to the coordination costs and competitive pressures inherent in dense populations, making reversal increasingly costly over time. The switchyard position holds that scale increases the capacity for both domination and freedom equally, and that the prevalence of hierarchy is not a mechanical consequence of scale but the result of specific political coalitions winning out over others, meaning the apparent directionality is an artifact of which experiments survived to be recorded rather than a structural inevitability. To move beyond this statement of positions, we have identified three specific cruxes where our predictions differ sharply, and we have agreed on the types of evidence that would bear on each.

  The first crux concerns whether the archaeological record underdetermines the ratchet. We agree that the visibility of certain structures, such as monumental architecture or grain storage, biases the record toward centralized societies, but we disagree on what lies in the gaps. The case we agree would bear on this is the analysis of large Neolithic settlements that lack obvious palaces, temples, or elite burials. The ratchet view predicts that close examination of these sites will reveal hidden forms of stratification, such as differential access to storage or subtle variations in housing quality, indicating that hierarchy was present but expressed differently. The switchyard view predicts that these sites will show evidence of corporate governance or rotational leadership, indicating that large-scale coordination was achieved without permanent elites, and that the lack of obvious hierarchy is genuine rather than cryptic.

  The second crux concerns whether hierarchy is a default consequence of scale or a contingent choice. We agree that coordination becomes more difficult as groups grow, but we disagree on the necessary solutions to that problem. The case we agree would bear on this is the study of seasonal aggregation sites where hunter-gatherer or low-food-producing groups gather in large numbers. The ratchet view predicts that even in these temporary aggregations, informal hierarchies will emerge rapidly to manage conflict and resource distribution, suggesting that the impulse toward domination is a default response to density. The switchyard view predicts that these sites will show evidence of deliberate institutional mechanisms designed to suppress dominance, such as ritualized leveling practices or flexible camp layouts, suggesting that hierarchy is avoided through conscious political work even at scale.

  The third crux concerns whether freedom and domination are structural variables or interpretive categories. We agree that people experience constraints and liberties differently, but we disagree on whether these experiences map onto objective social structures. The case we agree would bear on this is the interpretation of labor investment in public works, such as walls or earthworks, in the absence of coercive apparatuses. The ratchet view predicts that such labor mobilization implies some form of compulsory power or entrenched inequality, treating the mobilization itself as evidence of structural domination. The switchyard view predicts that such labor could be the result of collective voluntary action driven by shared cosmological or social goals, treating the mobilization as evidence of structural freedom and collective agency.

  We offer this document not as a resolution but as a map of the territory we still need to explore. We believe that framing our disagreement through the lens of ratchets and switchyards allows us to move past the recycling of familiar slogans and toward specific empirical tests. We remain committed to this adversarial collaboration and hope that this statement serves as a useful foundation for your own work and for the broader seminar discussion.

  Sincerely,

  The Collaborators
