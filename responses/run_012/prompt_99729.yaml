prompt: |-
  I'm a science journalist working on a feature about whether it makes sense to say AI models have beliefs, and I keep tripping over one distinction that the usual explainers skate past. I'd like you to help me get it straight. Take the role of someone who works at the seam between philosophy of mind and ML interpretability — a philosopher who actually reads the interpretability work, not just the press releases. Think it through carefully, and start by brainstorming out loud the different ways one could draw the line before you commit to a line of your own. Then give me the actual explanation, in plain language, glossing any term you can't avoid.

  Here's the concept. Dennett's intentional stance: treat a system as a rational agent with beliefs and desires, and if that stance predicts its behaviour better than the physical or design stance would, the belief-talk has earned its keep. My rough grasp of that is probably fine. What I want explained is what happens to the stance when you point it at a large language model, because three things make me suspect it either collapses or gets vacuous.

  First, the vindication is supposed to be predictive success. But an LLM was trained to produce text that a human reader will find coherent and rational. So of course the rationality assumption pays off. Doesn't that make the usual argument circular here — it works because we built it that way, not because there's a real pattern of believing in there? Or am I confusing the reason the stance works with the evidence that it works?

  Second, two cases that pull in opposite directions. Case A: a model whose activations decode, via a linear probe, to a representation of some proposition, while its verbal report denies that proposition, while its downstream planning behaviour lines up with the probe. Three sources of evidence, and the stance seems to just be a licence to pick whichever prediction is cheapest — is there anything in it that tells me which one to trust, or is it silent here? Case B: a lookup-table system with the exact same input-output profile as a model we're happy to call a believer, but no internal states worth the name. Does the stance attribute beliefs to it too? If yes, the stance's predictive success can't be evidence of belief. If no, you've smuggled in something beyond the stance, and I want to know what.

  Third, the whose-beliefs problem: the network, or the narrator/persona it's ventriloquising? When I write "the model believes X," which of those am I even talking about?

  Finish by telling me where this distinction does real work and where it's just vocabulary — a practical test, basically: what would I get wrong in the piece if I ignored it? Don't send me a reading list or citations, I can't use them, I need the reasoning. And flag anything you're genuinely unsure about instead of papering over it.
reasoning: |-
