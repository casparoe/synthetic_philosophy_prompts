answer: |-
  This is a profound task. You are asking for a tool that converts a theoretical framework (Sen's entitlement approach) into an operational protocol for high-stakes communication, while explicitly preserving the uncertainty that generalists often try to smooth over.

  Below is the **Entitlement Triage Protocol (ETP)**. It is designed to be run in under two hours by generalists using open-source data (FEWS NET, FAO, local news, satellite imagery). Following the protocol, I have run the audit on your three historical cases, highlighting exactly where the consensus fractures.

  ---

  # The Entitlement Triage Protocol (ETP)

  **Purpose:** To separate *food availability* from *food access* in crisis alerts, preventing the conflation of natural triggers with political outcomes.
  **Time Limit:** 120 Minutes.
  **Users:** Generalist Analysts.
  **Output:** A framing classification + A handoff note for the Desk Lead.

  ### Step 1: The Physical Availability Check [Empirical]
  **Question:** Is there a measurable, physical deficit of food in the region compared to a non-crisis baseline?
  **Data:** Satellite crop health (NDVI), rainfall data, yield estimates, import records.
  **Sufficient Answer:**
  *   **YES:** Production/imports are significantly below the 5-year average (e.g., >20% deficit).
  *   **NO:** Production/imports are stable or near-average.
  *   **UNCLEAR:** Data is missing or contradictory.
  **Note:** If NO, but people are starving, you have already identified an entitlement failure. Do not stop here.

  ### Step 2: The Access Check [Empirical]
  **Question:** Can the vulnerable population physically obtain the food that exists (local or imported)?
  **Data:** Local grain prices vs. wage rates (terms of trade), market functionality reports, road blockage reports.
  **Sufficient Answer:**
  *   **BLOCKED:** Food is present in markets/warehouses but prices have spiked beyond labor purchasing power, or physical access is denied (checkpoints, conflict).
  *   **OPEN:** Markets are functioning, prices are stable relative to wages, but food is physically absent.
  **Note:** This is the core Sen distinction. If Step 1 is NO and Step 2 is BLOCKED, the famine is *not* a shortage famine.

  ### Step 3: The Shock Source [Empirical]
  **Question:** What initiated the stress on endowments (land, labor, livestock)?
  **Data:** Meteorological reports, conflict timelines, policy change logs (tax, trade, procurement).
  **Sufficient Answer:**
  *   **BIO/PHYSICAL:** Drought, flood, pest, blight.
  *   **ECONOMIC/POLITICAL:** Price collapse, job loss, asset confiscation, trade embargo, procurement quota.
  *   **MIXED:** Both occurred simultaneously.
  **Note:** Record the *primary* driver, but note the secondary.

  ### Step 4: The Institutional Response [Empirical]
  **Question:** Did state or market institutions mitigate or amplify the shock?
  **Data:** Government relief spending, export bans/permissions, relief arrival times, rhetoric from leadership.
  **Sufficient Answer:**
  *   **MITIGATED:** Relief arrived, prices were subsidized, imports were facilitated.
  *   **AMPLIFIED:** Relief was delayed, exports continued during shortage, price controls were removed, information was suppressed.
  *   **ABSENT:** State capacity collapsed (failed state).
  **Note:** Distinguish between *incompetence* (slow) and *choice* (refusal). This is often the hardest empirical distinction.

  ### Step 5: The Classification [Synthesis]
  **Instruction:** Combine Steps 1–4 into one of four frames. Do not force a single cause if the evidence is split.
  **Options:**
  1.  **Natural Disaster:** Physical deficit (Step 1: YES) + Response Mitigated (Step 4: MITIGATED).
  2.  **Entitlement Collapse:** No/Low Physical deficit (Step 1: NO) + Access Blocked (Step 2: BLOCKED).
  3.  **Complex Emergency:** Mixed Shock (Step 3: MIXED) + Response Amplified (Step 4: AMPLIFIED).
  4.  **Systemic Failure:** Physical deficit (Step 1: YES) + Response Amplified (Step 4: AMPLIFIED).

  ### Step 6: The Attribution Handoff [Value Judgment / STOP]
  **Instruction:** **The procedure stops here.** The analyst passes the Step 5 Classification and the Step 4 data to the Desk Lead.
  **The Human Call:** The Desk Lead must decide on the following terms based on the evidence gathered above. The checklist *cannot* determine these:
  *   **"Crime" / "Negligence":** Requires establishing *intent* or *recklessness*.
  *   **"Genocide":** Requires establishing *intent to destroy a group*.
  *   **Named Blame:** Assigning responsibility to specific officials or parties.
  **Reason:** These are legal and moral determinations, not empirical ones. Using them triggers specific funding lines and diplomatic consequences.

  ---

  # Audit Trail: Historical Test Cases

  Here is how the ETP handles the three cases you requested. I have adopted the persona of the analyst running the protocol with the historical data available *now*, flagging where the "Empirical" steps rely on contested history.

  ## Case 1: Bengal Famine (1943)

  **Step 1: Physical Availability**
  *   **Verdict:** NO (Marginal).
  *   **Evidence:** Rice availability in 1943 was higher than in 1941 (no famine). Total supply was only ~5-10% below average, well within normal fluctuation margins.
  *   **Contested Causal Fault Line:** Some older demographic studies argue for a larger supply shock due to cyclone damage and disease in the crop. Sen's later analysis (and subsequent economic history) argues the supply shock was statistically insufficient to cause mass starvation without distributional failure. *If your desk leans on the older supply data, Step 1 becomes YES.*

  **Step 2: Access Check**
  *   **Verdict:** BLOCKED.
  *   **Evidence:** Rice prices rose 300%+ in months. Rural wages did not keep pace. Urban groups (military, construction) had protected purchasing power; rural laborers did not.
  *   **Note:** Classic entitlement failure. Food existed but moved to those with money (war economy inflation).

  **Step 3: Shock Source**
  *   **Verdict:** MIXED (Leaning Political).
  *   **Evidence:** Biophysical shock (brown spot disease/cyclone) existed but was minor. Major shock was wartime inflation and the "Denial Policy" (removal of boats and rice from coastal areas to prevent Japanese invasion support).

  **Step 4: Institutional Response**
  *   **Verdict:** AMPLIFIED.
  *   **Evidence:** UK/Colonial government prioritized military stockpiles. Export of grain from India continued early in the crisis. Churchill's war cabinet rejected aid offers. Information was censored (press gag).

  **Step 5: Classification**
  *   **Verdict:** **Entitlement Collapse + Systemic Failure.**
  *   **Reasoning:** Food was present (Step 1), but access collapsed due to price/income divergence (Step 2), amplified by wartime policy (Step 4).

  **Step 6: Attribution Handoff (The Human Call)**
  *   **Desk Lead Decision:** Does this constitute a "Political Crime"?
  *   **Contested Causal Fault Line:** Was the refusal of aid *intent* to punish Bengalis, or *triage* for the wider war effort? Historians like Madhusree Mukerjee argue for intent/negligence bordering on malice. Others (e.g., Mark Tauger) argue it was administrative incompetence amidst total war constraints.
  *   **Comfort Check:** This will make the desk uncomfortable. Calling it "Natural" is factually wrong per Step 1. Calling it "Genocide" requires Step 6 intent proof that is still debated. The ETP forces you to label it **Systemic Failure**, which implies political responsibility without legally requiring "intent."

  ---

  ## Case 2: The Great Hunger, Ireland (1845–1852)

  **Step 1: Physical Availability**
  *   **Verdict:** YES (Specific Commodity).
  *   **Evidence:** The potato crop (the subsistence base for the poor) failed catastrophically due to blight (*Phytophthora infestans*).
  *   **Contested Causal Fault Line:** Was there *other* food? Yes. Grain, cattle, and butter were produced in Ireland and exported to England throughout the famine. Step 1 depends on whether you define "Food" as "Calories in the region" (YES) or "Staple crop of the poor" (NO). Sen's approach demands we look at *command*, so we must acknowledge other food existed.

  **Step 2: Access Check**
  *   **Verdict:** BLOCKED.
  *   **Evidence:** The poor had no money to buy the grain/cattle being exported. They relied on the potato for subsistence (non-market access). When the potato died, their endowment (labor for potato plot) became worthless. They could not exchange labor for grain.

  **Step 3: Shock Source**
  *   **Verdict:** BIO/PHYSICAL (Trigger) + ECONOMIC (Structure).
  *   **Evidence:** Blight was the trigger. The structural vulnerability was the colonial land system (tenant farming, export-oriented agriculture).

  **Step 4: Institutional Response**
  *   **Verdict:** AMPLIFIED.
  *   **Evidence:** Adherence to Laissez-faire ideology prevented market intervention. Public works were poorly managed. The Poor Law made relief contingent on entering workhouses (which spread disease). Exports were not banned.

  **Step 5: Classification**
  *   **Verdict:** **Complex Emergency.**
  *   **Reasoning:** Natural trigger (Blight) + Entitlement Failure (No money for grain) + Political Amplifier (Ideological refusal to stop exports/relieve).

  **Step 6: Attribution Handoff (The Human Call)**
  *   **Desk Lead Decision:** Is this "Ideological Negligence" or "Genocide"?
  *   **Contested Causal Fault Line:** The "Genocide" label rests on Step 4. Was the adherence to Laissez-faire a genuine (if cruel) economic belief held by Peel/Trevelyan, or a pretext to depopulate the countryside? Most economic historians lean toward "Ideological Rigidity/Incompetence" rather than "Intent to Destroy," but the *outcome* was indistinguishable to the starving.
  *   **Comfort Check:** The ETP prevents you from calling it a "Natural Disaster" (because of Step 2 & 4). It forces you to acknowledge the food exports. This contradicts the simplified "Potato Blight" narrative often taught. The desk must decide if "Ideological Rigidity" is strong enough language for their donors.

  ---

  ## Case 3: Great Leap Forward Famine, China (1959–1961)

  **Step 1: Physical Availability**
  *   **Verdict:** NO (Initially) -> YES (Later).
  *   **Evidence:** Grain procurement quotas were based on exaggerated yield reports. The state took too much grain based on fake data, leaving rural areas with nothing.
  *   **Contested Causal Fault Line:** Weather. Official Chinese narratives for decades blamed "Three Years of Natural Disasters." Western and later Chinese scholarship (e.g., Yang Jisheng, Frank Dikötter) shows weather data was normal or only slightly adverse. The ETP requires you to weigh meteorological data against procurement data. If you accept the weather argument, Step 1 is YES. If you accept the policy argument, Step 1 is NO (food was grown but removed).

  **Step 2: Access Check**
  *   **Verdict:** BLOCKED.
  *   **Evidence:** Communal dining halls initially provided access, then collapsed. Private cooking was banned. Migration was banned (hukou system), preventing people from moving to areas with food.

  **Step 3: Shock Source**
  *   **Verdict:** POLITICAL.
  *   **Evidence:** Collectivization, backyard steel production (labor diverted from harvest), and the procurement quota system.

  **Step 4: Institutional Response**
  *   **Verdict:** AMPLIFIED.
  *   **Evidence:** Local officials feared reporting failure (purge risk), so they lied about yields. Central government continued exports and aid to allies during the famine. Relief was delayed until 1961.

  **Step 5: Classification**
  *   **Verdict:** **Systemic Failure (Man-Made).**
  *   **Reasoning:** Even if weather played a role (Step 1), the Response (Step 4) turned a shortfall into a catastrophe. The ban on migration and the procurement quotas are the decisive factors.

  **Step 6: Attribution Handoff (The Human Call)**
  *   **Desk Lead Decision:** "Policy Error" vs. "Crime against Humanity."
  *   **Contested Causal Fault Line:** Intent. Did Mao and the leadership *know* people were starving and choose to let them die to preserve the policy/exports? Or were they misled by local lies? Evidence suggests central leadership knew by 1959 but did not reverse course until 1961.
  *   **Comfort Check:** This is the clearest case of "Man-Made" of the three. The discomfort here isn't about the cause (which is overwhelmingly policy), but about the diplomatic fallout of labeling a current geopolitical power's historical foundation as a "Systemic Failure." The ETP forces the "Man-Made" label regardless of diplomatic pressure.

  ---

  # Summary of Fault Lines for the Desk

  You asked me to identify where the procedure lands uncomfortably or where consensus is fake. Here is the summary for your team:

  1.  **The "Natural" Trap:** In all three cases, a biophysical trigger existed (Cyclone, Blight, Drought). In all three cases, the ETP classifies the *famine* as Man-Made/Complex.
      *   *Risk:* Donors often prefer "Natural Disaster" framing (it's apolitical, easier to fund). The ETP will systematically block this framing in political crises. You will face pushback from fundraising teams.
  2.  **The "Intent" Black Box:** Step 6 is where the procedure admits it cannot go.
      *   *Bengal:* Was it racism or war triage?
      *   *Ireland:* Was it ideology or genocide?
      *   *China:* Was it incompetence or purging?
      *   *Guidance:* Do not let the analysts guess this. The ETP gathers the *actions* (exports blocked, aid refused). The Desk Lead must own the *label* ("Crime"). If the Lead won't sign "Crime," the alert must read "Systemic Failure: Policy Amplified Mortality."
  3.  **The Data Gap:** In Step 1 (Availability), modern alerts often lack the historical luxury of retrospective data. You will be working with early estimates.
      *   *Guidance:* If Step 1 is "UNCLEAR," default to Step 2 (Access). It is easier to prove prices are too high than to prove grain is missing. Sen's insight is that price spikes *are* the famine signal, regardless of the harvest.

  **Final Note:** This procedure will not make your decisions easier. It will make them more defensible. It forces you to say "We don't know if it was a crime, but we know the policy killed them." That is a distinction worth the discomfort.
