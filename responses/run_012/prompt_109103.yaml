      *   *Time Limit:* Needs to be quick. 5-7 steps max.
      *   *Labels:* Empirical (E) vs. Normative/Value (V).
      *   *Key Distinction:* Trigger (what started it) vs. Amplifier (what made it deadly).
      *   *The "Stop" Point:* Explicitly mark where the checklist ends and human judgment begins (attribution of intent/crime).

      *   *Drafting Steps:*
          1.  Availability: Is there food physically? (E)
          2.  Access: Can vulnerable groups buy/access it? (E)
          3.  Shock Source: What hit the endowments? (Weather vs. Policy) (E)
          4.  Response: Did institutions mitigate or worsen? (E)
          5.  Classification: Combine 3 & 4. (Mixed category allowed).
          6.  The "Crime" Threshold: Intent/Obstruction. (V - Human Call).

  4.  **Developing the Test Cases (Historical Analysis):**
