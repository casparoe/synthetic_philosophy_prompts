  2.  **Deconstruct the Theoretical Framework (Sen's Entitlement Approach):**
      *   *Core Idea:* Famine is not always FAD (Food Availability Decline). It's often EFD (Entitlement Failure).
      *   *Endowments:* What you own (land, labor, animals).
      *   *Exchange Entitlements:* What you can get for what you own (wages, prices, trade).
      *   *Mapping:* The relationship between endowments and entitlements (legal, economic, political).
      *   *Application:* The procedure needs to ask: Is there food? Can people get it? If not, why? (Price? Blockade? Loss of income?).

  3.  **Drafting the Decision Procedure (The "Tool"):**
