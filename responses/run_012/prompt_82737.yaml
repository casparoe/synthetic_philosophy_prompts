  **BUREAU OF CONTINUITY**
  **INTERNAL GUIDANCE NOTE 88.2**
  **CLASSIFICATION: RESTRICTED (CONVENTIONAL)**
  **SUBJECT: Adjudication of Liability Across Aggregate-Stream Transitions**

  **1.0 Purpose**
  To clarify administrative procedures regarding obligations incurred by conventional designations (*prajñapti*) whose underlying aggregate streams (*skandha-santāna*) have undergone significant causal modulation. Staff are reminded that while ultimate truth (*paramārtha-satya*) denies the existence of a persisting agent, conventional truth (*saṃvṛti-satya*) necessitates the stabilization of designations for fiscal and penal order. The Bureau operates exclusively within the conventional domain, utilizing the simile of the flame: just as a flame at midnight is causally connected to but not identical with a flame at dawn, the debtor at signing is not the debtor at default, yet the combustion continues.

  **2.0 Financial Obligations and Loan Default**
  **Query:** Does a loan obligation persist when the borrower's five aggregates have been replaced by successor aggregates over a ten-year term?
  **Ruling:** Yes. Under the Principle of Causal Convenience, the designation "Borrower" attaches to the continuum, not the specific momentary constituents. While the volitional formations (*saṅkhāra*) present at signing have ceased, the causal nexus remains unbroken. To argue otherwise is to commit the annihilationist error. The bank lends to the stream, not the moment. Therefore, successors inherit debt regardless of psychological discontinuity.
  **Note:** Claims of "I am not the person who signed" are admissible only if the aggregate stream has been severed (e.g., clinical death followed by resurrection). Standard aging does not constitute severance.

  **3.0 Penal Continuity and Sentencing**
  **Query:** Can a sentence be served by an aggregate stream that claims no memory or psychological continuity with the offending stream?
  **Ruling:** Yes. Responsibility follows the causal trajectory, not the memory trace. The suffering inflicted by punishment is conventionally real, regardless of the ultimate emptiness of the sufferer. However, if the discontinuity is total (e.g., severe traumatic brain injury altering perception and consciousness), the Bureau may recommend commutation. This is not because the guilt is erased, but because the utility of punishing a distinct causal stream diminishes.
  **Addendum:** In cases of violent crime, the Bureau advises against commutation to maintain social deterrence, even if the metaphysical justification is weak. The safety of the conventional public outweighs the ultimate innocence of the aggregates.

  **4.0 Insurance and Beneficiary Designation**
  **Query:** Is a life insurance claim valid when the insured "self" has ceased, leaving only a causal successor?
  **Ruling:** Yes. The purpose of insurance is the alleviation of conventional suffering (*duḥkha*). While the insured entity is merely a designation for a collection of parts (per the Chariot Simile), the pain of loss experienced by the beneficiaries is empirically verifiable. Payouts are authorized based on the reality of the suffering, not the reality of the self. To deny claims on metaphysical grounds would be to privilege ultimate truth over conventional welfare, which is outside the Bureau's remit.

  **5.0 Status of the Administrative Person**
  Staff are instructed to refer to applicants as "Continuity Subjects." Do not define the Subject as identical to the aggregates, nor as different from them. When pressed, cite the Blessed One's silence on whether the self is the same as or different from the body. The Subject is an inexplicable designation required for form processing.^[1]

  ***

  ^[1] **Dissenting Opinion (Jr. Clerk T.):** This guidance effectively posits a *pudgala*—a person neither identical with nor different from the aggregates—while claiming adherence to orthodox non-self. The Personalist school was deemed heterodox precisely for this maneuver. We are not managing designations; we are smuggling a self back in through the back door of "convenience" to justify punishing successors and collecting debts. The distinction between the two truths is being used as a dodge to avoid the ethical implications of our own metaphysics.
