  # JOINT STATEMENT ON THE CIVIC JURY PROPOSAL
  **Parties:** The Lottocrat Caucus & The Electoralist Caucus
  **Date:** October 24, 2023
  **Subject:** Adversarial Collaboration on Hybrid Sortition Model

  ### 1. AGREED CLAIMS
  1.  **Purpose of Democracy:** Both sides agree the primary function of local democracy is to produce legitimate, binding decisions that align with the long-term welfare of the constituency while maintaining systemic stability.
  2.  **Mechanical Effect:** Both sides agree the Civic Jury modifies the current system by adding a 150-person sortition body with budget priority setting and limited veto power (2 ordinances/year), without abolishing the elected 9-seat council.
  3.  **Incentive Structure:** Both sides agree the compensation package (median wage for six weeks, childcare covered) is sufficient to enable participation for most income brackets, but not so high as to become the primary motivation for service relative to regular employment.
  4.  **Lottocrat Concession:** The Electoralist position correctly identifies that removal via election is the only existing proven mechanism for punishing malfeasance after the fact; sortition offers no equivalent retrospective accountability.
  5.  **Electoralist Concession:** The Lottocrat position correctly identifies that competitive elections systematically filter for candidates with access to capital or party machinery, reducing descriptive representation and increasing susceptibility to donor capture.
  6.  **The Hardship Fact:** Both sides agree the "documented hardship" opt-out clause means the final seated jury will not be a mathematically perfect random sample of the voter rolls.
  7.  **Unknowns:** Both sides acknowledge genuine uncertainty regarding: (a) actual participation rates under the hardship clause, (b) the cost overhead of juror-selected experts, and (c) the friction coefficient between Council and Jury during veto negotiations.

  ### 2. LIVE DISAGREEMENTS
  *Each side asserts the following as their primary objection to the proposal.*

  1.  **Accountability vs. Independence**
      *   **Electoralist:** Without the threat of removal, Jurors will lack the incentive to investigate deeply or resist populist impulses, leading to irresponsible budgeting that cannot be corrected until the next cycle.
      *   **Lottocrat:** Without the need to fundraise or campaign, Jurors will be immune to donor capture, leading to budgeting that reflects genuine public need rather than organized interest pressure.

  2.  **Expertise Selection**
      *   **Electoralist:** Allowing Jurors to pick their own experts invites confirmation bias and epistemic closure, reducing decision quality compared to vetted staff briefings.
      *   **Lottocrat:** Allowing Jurors to pick their own experts prevents staff gatekeeping and ensures information serves the deliberative body rather than the bureaucracy.

  3.  **The Descriptive Representation Claim (Self-Selection)**
      *   **Question:** Does the hardship opt-out gut the argument that the Jury is descriptively representative?
      *   **Lottocrat Position:** **No.** The remaining skew is within acceptable margins of error for political legitimacy; the financial compensation mitigates most economic self-selection.
      *   **Electoralist Position:** **Yes.** The opt-out systematically excludes the most precarious citizens (those with unstable childcare, hourly jobs without leave), biasing the jury toward the stable working class and upper, invalidating the claim of true representation.

  ### 3. CRUXES & ADJUDICATION TESTS
  *For each crux, both sides record a prediction on the outcome of a specific test.*

  1.  **Crux: Decision Alignment**
      *   **Test:** Compare Jury budget priorities against blind polling of the same demographic pool vs. Council budget priorities against donor disclosure records over 3 years.
      *   **Lottocrat Prediction:** Jury priorities will correlate higher with blind public polling than Council priorities.
      *   **Electoralist Prediction:** Jury priorities will correlate higher with vocal interest group demands than Council priorities.

  2.  **Crux: The Hardship Skew**
      *   **Test:** Demographic analysis of seated jurors vs. voter rolls, specifically focusing on income volatility and housing security metrics.
      *   **Lottocrat Prediction:** Deviation on income security metrics between jurors and rolls will be <5%.
      *   **Electoralist Prediction:** Deviation on income security metrics between jurors and rolls will be >20%.

  3.  **Crux: Veto Usage**
      *   **Test:** Frequency and rationale of veto usage over 4 years.
      *   **Lottocrat Prediction:** Vetoes will be used to block ordinances with high public opposition but strong lobbyist support.
      *   **Electoralist Prediction:** Vetoes will be used inconsistently, creating policy instability that harms implementation.

  ### 4. SEMANTIC VS. SUBSTANTIVE MAP
  1.  **The Word "Democracy":**
      *   **Dispute:** Electoralists define democracy primarily by *accountability mechanisms* (throwing bums out). Lottocrats define it primarily by *descriptive composition* (looking like the people).
      *   **Resolution:** If both agree on the hybrid mechanism's output, this label dispute is residual. We agree to use "Democratic Legitimacy" to cover both accountability and representation.

  2.  **What Counts as a "Better Decision":**
      *   **Dispute:** Electoralists mean "Decisions that can be enforced without backlash." Lottocrats mean "Decisions that maximize aggregate welfare regardless of popularity."
      *   **Resolution:** We agree to measure "Better" by alignment with blind polling of the constituency (welfare) minus implementation failure rate (enforcement).

  3.  **Substantive Remainder:**
      *   Once semantics are cleared, the dispute rests entirely on whether the hardship opt-out creates a bias large enough to negate the anti-capture benefits of sortition. If the Electoralist prediction on Crux #2 holds (>20% skew), the Lottocrats agree the descriptive representation claim fails. If the Lottocrat prediction holds (<5% skew), the Electoralists agree the representation claim stands.

  \crux{hardship opt-out demographic skew}
