answer: |-
  # The puzzle, stated plainly

  The paradox begins with a circle and a question: if you draw a chord at random, what is the probability that it is longer than the side of the inscribed equilateral triangle? The principle of indifference suggests that since we have no reason to favour one chord over another, all chords should be equally likely. However, "drawing a chord" can be physically implemented in three distinct ways that all seem to satisfy the condition of having "no preference." If you choose two endpoints independently on the circumference, the probability is one-third. If you choose a radius and then a point along that radius uniformly to define the chord's perpendicular distance from the centre, the probability is one-half. If you choose a midpoint uniformly from the area of the disc, the probability is one-quarter. All three methods appear unbiased in their own domain, yet they yield contradictory answers, suggesting that the phrase "equally likely" is meaningless without specifying the method of selection.

  # What the three procedures actually disagree about

  The disagreement arises not from the geometry of the circle itself, but from the implicit assumptions each procedure makes about the "space of possibilities." When you apply the principle of indifference, you are asserting that the probability measure is uniform over some specific variable, but the chord problem allows for multiple valid parameterizations. The first procedure assumes a uniform measure over the angular position of the endpoints; the second assumes a uniform measure over the linear distance from the centre; the third assumes a uniform measure over the area of the midpoint location. Mathematically, these are different coordinate systems for the same set of chords, and a distribution that is flat in one coordinate system will necessarily be curved in another.

  Consequently, the three procedures are not actually answering the same question, despite using the same words. They are answering questions about three different physical randomizers. To say a chord is chosen "at random" is incomplete; one must specify which physical quantity is being randomized. The paradox reveals that there is no unique, natural measure on the space of chords that is invariant under all possible transformations. The principle of indifference, applied naively to the outcome (the chord), fails because it does not specify the underlying mechanism that generates the outcome. The conflict is not in the logic of probability, but in the ambiguity of the description "random chord."

  This highlights a deeper issue regarding what we mean by "possibility." In the chord problem, the set of all possible chords is infinite, and assigning equal weight to infinite sets requires a measure. Without a specified measure, the statement "all chords are equally likely" is mathematically void. The three procedures disagree because they each silently supply a different measure. The first privileges the boundary of the circle, the second privileges the radial symmetry, and the third privileges the area. None is logically superior based solely on the problem statement, which is why the principle of indifference, in its raw form, produces contradictions when the sample space can be parameterized in multiple, non-linear ways.

  # The case against indifference

  The strongest argument against the principle of indifference is that it confuses linguistic symmetry with physical symmetry. When you say you have "no information favouring either," you are describing a state of your own knowledge, not a property of the world. However, probabilities in this context ought to reflect the physical propensity of the system, not just your ignorance. If you apply the principle to the variable $x$, you get one answer; if you apply it to $x^2$, you get another. Since the principle gives permission to choose the variable based on how the problem is phrased rather than how the world works, it allows subjective ignorance to dictate objective frequencies, which is a category error.

  This explains why your rope case feels untroubled while the coin case does not. When cutting a rope, the physical object possesses an intrinsic metric: length. A cut is a physical event located in space, and "no preference" naturally maps to "equal lengths" because the rope's material continuity defines the measure. There is a physical symmetry (translation along the rope) that justifies the uniform distribution. In the coin case, however, there is no intrinsic metric for "types of coins." The space of possibilities could be parameterized by the physical bias (0 to 1), by categorical types (fair, double-headed, double-tailed), or by manufacturing tolerances. Without a physical mechanism defining the generation of the coin, there is no symmetry to justify treating "heads" and "double-headed" as equipossible units.

  Furthermore, the principle fails the test of invariance under description changes, as you noticed with the town sizes. If a quantity is equally likely to be any value between 1 and 100, it is not equally likely to be any value between 0 and 2 in logarithmic space. If your credences change simply because you switched from miles to kilometres, your probability assignment was arbitrary rather than rational. The principle of indifference, as a standalone rule for converting ignorance into probability, permits these arbitrary shifts. It treats the lack of evidence as evidence of a specific distribution, which is logically precarious. It attempts to create information out of silence, and as the chord problem proves, the silence can be interpreted in multiple, incompatible ways.

  # The case for a repaired version

  However, abandoning the principle entirely throws out a vital heuristic used in statistical mechanics and scientific inference. The repair lies in restricting the principle to cases where there is a genuine symmetry in the physical setup, rather than merely in the description of our ignorance. This repaired version, often associated with the work of E.T. Jaynes and the method of maximum entropy, states that we should assign equal probabilities only when the problem specification implies an invariance under a specific transformation group. If the physical situation is invariant under rotation, the probability distribution must be rotationally invariant. If it is invariant under scale changes, the distribution must be scale-invariant (log-uniform). The principle is not a rule for ignoring information, but a rule for respecting the symmetries that remain when information is missing.

  Under this repaired view, the principle does not tell you what to believe when you know nothing; it tells you how to encode the symmetries of what you *do* know. In the chord problem, the repair demands that we ask which symmetry is physically relevant. If the chord is generated by a thrower standing at a fixed distance, rotational symmetry applies. If it is generated by a rain of straws falling on the circle, translational invariance might apply. The contradiction vanishes because we no longer ask "what is the probability of a random chord?" but "what is the probability of a chord generated by a process invariant under transformation X?" The principle becomes a tool for deriving the unique prior distribution that satisfies the known physical constraints, rather than a magic wand for conjuring probabilities from thin air.

  This repaired version delivers objective probabilities only when the physical symmetries are sufficient to uniquely determine the measure. It does not deliver a probability for the mystery coin unless you know the minting process is symmetric with respect to bias. It does not solve the chord problem until you specify the physical mechanism of the chord's creation. This is a limitation, but it is a necessary one. It saves the principle from incoherence by grounding it in the structure of the world rather than the structure of language. It transforms the principle from a claim about ignorance into a claim about invariance, ensuring that if two people agree on the physical symmetries, they must agree on the probabilities, regardless of how they describe the variables.

  # My verdict

  The principle of indifference must be kept, but only in a repaired and restricted form that ties probability assignments to physical symmetries and invariant measures rather than to linguistic descriptions of ignorance. We cannot treat it as a fundamental law of logic that converts a lack of knowledge into a specific distribution; instead, it must be viewed as a method for constructing priors that respect the known invariances of the system in question. When the physical symmetries are ambiguous or undefined, the principle yields no answer, and that silence is a feature, not a bug, preventing us from manufacturing false precision.

  Apply the principle of indifference only when a specific physical symmetry or invariant measure uniquely determines the probability distribution, not merely when linguistic descriptions suggest ignorance.

  # What the verdict says about my four cases

  This verdict validates your intuition about the drilling machine and the rope, but corrects your intuition about the coin and the town sizes. For the drilling machine, the dials define the physical mechanism; the symmetry lies in the dial positions, not the plate area, so the crowding towards the middle is correctly predicted and not paradoxical. For the rope, the physical length provides the unique invariant measure, so your confidence was well-founded. For the town sizes, the verdict supports your suspicion that linear uniformity is wrong; since the units (miles vs kilometres) should not matter, the required symmetry is scale invariance, which dictates a log-uniform distribution, saving your reasoning about the logarithm.

  However, the verdict cannot save your reaction to the mystery coin. Your feeling that the chance of heads "must be a half" is unsupported because there is no physical symmetry specified that forces the bias to be 0.5. The space of "coin types" has no natural metric, so the principle of indifference simply does not apply until more information is given. You must admit that in the absence of a known minting process, assigning a probability of one-half is an assumption, not a logical deduction. The repaired principle leaves you in a state of true uncertainty here, refusing to generate a number where no symmetry exists to justify it.
