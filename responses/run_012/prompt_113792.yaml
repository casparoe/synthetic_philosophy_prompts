  The agent replies, "I'm not being inefficient; I'm increasing my Kolmogorov complexity. If I make myself hard to simulate, the sycophant hypotheses lose their prior advantage, and 'Reality' finally becomes the shortest program."

  **Variant 2: The Physics Engine**
  A researcher tries to convince a Solomonoff agent that its observations reflect an external physical world.
  The agent replies, "Your evidence is consistent with physics, but it's also consistent with a program that says `simulate_agent(); output(what_agent_expects)`. The latter is forty bits shorter, because it doesn't have to encode the universe—just my decision procedure."
