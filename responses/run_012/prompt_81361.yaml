answer: |-
  The inside/outside view distinction is less substantive than it looks, functioning primarily as a cognitive heuristic for enforcing partial pooling when human intuition defaults to no-pooling models, though the statistical vocabulary lacks a formal operator for the motivated reasoning that distorts reference-class selection.

  Translating your epistemology into your statistics: the "outside view" is the specification of a hierarchical prior $P(\theta_j | \mu, \tau)$ over groups $j$, where $\mu$ and $\tau$ are estimated from the reference class; the "inside view" is the likelihood $P(y_j | \theta_j)$ constructed from case-specific details; and "epistemic modesty" is the imperative to allow the shrinkage factor $\lambda = \frac{\sigma^2}{\sigma^2 + \tau^2/n}$ to dominate when $n$ (effective sample size of the inside view) is small or $\sigma^2$ (noise in the specific story) is high. The planning fallacy corresponds to setting $\tau \to \infty$ (no pooling) or selecting a reference class with an optimistically biased $\mu$. In your reading group case, the statisticians are arguing for a partial-pooling model where the group-level intercept is shrunk toward the mean survival rate of volunteer orgs, weighted by the variance components; the rationalists are arguing that your likelihood function is contaminated by motivated reasoning, effectively inflating your confidence in $\theta_{group}$ relative to its true precision, so you should manually increase the shrinkage weight beyond what the nominal data supports.

  The residue report breaks down as follows. What survives cleanly is the mathematical operation of updating: combining base rates with specific evidence is exactly what posterior estimation does in a hierarchical model. What survives with distortion is the norm of modesty: in statistics, shrinkage is optimal given the model, whereas in rationalism, modesty is a virtue applied to the modeler, implying that the "optimal" shrinkage calculated by a human is usually insufficient due to cognitive bias. What disappears entirely is the mechanism for selecting the hierarchy itself; statistics treats the grouping structure (the reference class) as exogenous or selected via predictive validity, while the rationalist framework treats the choice of reference class as the primary site of epistemic vulnerability, where motivated reasoning selects the class that yields the desired prior. In your reading group case, the statistical vocabulary cannot formally penalize you for choosing "successful intellectual communities" as the reference class instead of "all volunteer groups," whereas the rationalist vocabulary flags this as a failure of modesty.

  My verdict is that the distinction is less substantive than it looks: the "outside view" is just the practice of using a better-specified prior, and the disagreement is about which model class is right rather than about a distinct epistemic faculty. The "virtue" of modesty is simply a meta-prior acknowledging that humans systematically underestimate $\sigma^2$ in their likelihoods and overestimate the exchangeability of their specific case with their preferred reference class. The statistical vocabulary does not need to be fixed to accommodate this; it already handles it via sensitivity analysis on hyperpriors and model averaging over reference classes, but the rationalist norm compresses this computational labor into a behavioral injunction because humans are poor Bayesians.

  I would change this verdict if empirical studies showed that adhering to a categorical "outside view first" rule produced better calibration than attempting to quantify the inside view and applying optimal Bayesian shrinkage, even when controlling for motivated reference-class selection. This would suggest the residue is a defect of the statistical vocabulary, implying there is a structural feature of epistemic uncertainty that hierarchical modeling misses—perhaps because the "inside view" is not a likelihood but a posterior already contaminated by priors, making the standard likelihood-prior separation invalid. My reasoning is most likely failing in assuming that the human "inside view" maps cleanly to a likelihood function; it is more likely a confused posterior mixture, meaning the rationalist advice to "ignore it and start with the base rate" is a debugging strategy for corrupted inputs that standard Bayesian theory assumes are clean.
