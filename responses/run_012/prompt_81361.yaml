prompt: |-
  I've been reading rationalist blogs and forums for about a decade now, so the inside view / outside view distinction is part of my furniture, along with the norm of epistemic modesty usually hung on it — the thought that when my own case feels special, the reference class probably knows better, and that the planning-fallacy literature is a standing lesson in what it costs to ignore base rates. I also happen to build hierarchical Bayesian models for a living, mostly partial-pooling models over grouped data, and I've begun to suspect that when my two vocabularies meet, I get a translation that is flattering to the statistics and unflattering to the epistemology. So here is what I want: restate the inside-view/outside-view distinction, together with the modest-epistemology claims built on it, as faithfully as you can in the vocabulary I actually use — exchangeability, reference classes as groups in a hierarchy, hyperpriors, shrinkage and partial pooling, posterior predictive distributions, bias-variance tradeoffs, model selection and model averaging — and then give me the residue report. Which parts of the distinction survive as clean claims about a hierarchical model? Which survive only with distortion? Which have no counterpart at all in that vocabulary? And be honest about the direction of the distortion: I don't want the statistical vocabulary quietly congratulating itself by redescribing "use the base rate" as "specify a prior" if that is in fact what is happening.

  One concrete case keeps pulling me back, because it is where my two vocabularies give me genuinely different advice. I co-run a small volunteer reading group that has been meeting for two years, and I've been trying to forecast whether it will still be meeting in five years. There is no good reference class: the nearest ones, other small volunteer organizations, have enormous spread and are arguably not exchangeable with mine, while my inside view has a fairly specific story about the founding members' commitments and the local scene, and it disagrees with the class mean. The statisticians in my life tell me to shrink toward the class mean anyway; the rationalists tell me my inside view is probably motivated reasoning. I'd like the residue report sharpened by this case, and I'd like your verdict on the interesting question: is the residue — the part of the inside/outside view debate that the hierarchical-model vocabulary cannot express — a defect of the statistical vocabulary, which has no way to say when one ought to use which model class or why modesty would be a virtue rather than a regularization parameter; or is it a sign that the original distinction was less substantive than it looks, that the outside view is just the practice of using a better-specified prior, and that the disagreement was always about which model class is right rather than about a distinct epistemic faculty?

  Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question. And tell me what would change your verdict: which consideration, if it turned out one way rather than another, would move you from the defect-of-the-vocabulary reading to the less-substantive-than-it-looked reading, or the reverse — and where your own reasoning is most likely to be failing.
