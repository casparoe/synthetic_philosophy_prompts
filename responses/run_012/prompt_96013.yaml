answer: |-
  The arithmetic identity you have identified is exact: the insolvency pro rata rule and the Kalai–Smorodinsky (KS) solution share the same algebraic structure. Both select an allocation where the ratio of actual gain to maximum feasible gain is constant across all participants. However, your classmate's objection strikes at the normative substrate of that algebra. In bargaining theory, the variables represent utility, which presupposes that we can measure and compare the subjective welfare of different agents. In insolvency law, the variables represent nominal dollar claims, which presupposes that we *cannot* or *should not* compare subjective welfare. Therefore, the resemblance is arithmetically identical but substantively divergent. The practice does not merely "use dollars instead of utility" as a proxy; it makes a constitutive choice that dollars *are* the relevant metric of justice, regardless of their utility impact.

  The view of fairness this practice presupposes is **proportionality of entitlements**. It treats the creditor's legal right to payment (the claim) as the moral unit of distribution, not the creditor's need or the economic pain of non-payment. Under this view, fairness is satisfied when the law honors the relative size of the promises made to each creditor, scaled down equally due to scarcity. This is a deontological view of fairness rooted in contract and property rights: you are entitled to a share of the residue proportional to the share of the total debt you were promised. It explicitly rejects a consequentialist view where the goal is to minimize aggregate harm or maximize aggregate welfare. By treating a dollar of claim as identical for a hedge fund and a small supplier, the law tacitly assumes that the marginal utility of money is either identical across persons or, more likely, that the court is institutionally incompetent to measure it. This assumption is load-bearing; if the law admitted that a dollar is worth more to a starving supplier than to a diversified bank, the pro rata rule would lose its moral force and become merely an administrative heuristic.

  The priority rules (secured claims, wage arrears, taxes) do not necessarily contradict the proportional rule if viewed through a **lexicographic entitlement framework**. In this reconstruction, the "claim" ($C_i$) in the KS formula is not the raw contract amount, but the *legal valid claim against the specific pool of assets*. A secured creditor has a valid claim of 100% against the collateral pool and 0% against the general estate. A wage creditor has a priority claim against the general estate that must be satisfied before the trade creditor's claim becomes "feasible." Thus, proportionality governs relations *within* a defined class of entitlements, while priority rules define the *boundaries* of those classes. This renders the system internally consistent: the KS-style division happens repeatedly at different levels of a hierarchy. However, tension arises when priority is based on social policy (e.g., protecting workers) rather than property rights (e.g., security interests). If priority is policy-driven, it overrides the contractual entitlement logic that justifies pro rata division within the class, suggesting a hybrid system where entitlement governs the horizontal axis and social welfare governs the vertical axis.

  This practice strictly rules out rival views that require interpersonal utility comparisons. A **Nash bargaining solution**, which maximizes the product of utility gains, would require measuring how much each creditor actually values the recovery. A **need-based or hardship criterion** would direct funds to the creditors for whom non-payment would be catastrophic, regardless of claim size. A **maximin criterion** would prioritize the smallest or most vulnerable creditor to maximize the minimum outcome. An **equal absolute shares** rule would treat all creditors as equals regardless of the size of their promise, violating the contractual basis of the debt. The current practice is merely compatible with **efficiency-based justifications** (e.g., reducing litigation costs, enabling ex ante credit pricing) and **administrative convenience**. These views justify the *outcome* but do not provide the *fairness vocabulary* the law uses; the law speaks of rights and proportions, not costs and benefits.

  If the system attempted to measure each claimant's real gain (utility), the practice would collapse into discretion. Courts would need to adjudicate the financial health, risk exposure, and subjective valuation of every creditor. This would invite strategic misrepresentation (every creditor claiming existential distress), destroy ex ante predictability (creditors could not price risk without knowing their priority in utility space), and vastly increase administrative costs. The shift would move insolvency from a rule-based system of entitlement distribution to a standard-based system of equitable relief. The weakest link in this reconstruction is the justification for statutory priority rules (like wages or taxes). Unlike security interests, which can be framed as defining the property right (and thus the "claim"), statutory priorities are external policy overrides that interrupt the contractual entitlement logic, suggesting the system is not purely deontological but partially consequentialist.

