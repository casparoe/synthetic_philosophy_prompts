  **Dear Broke,** Expected utility is additive over independent events. If each transaction yields positive expected utility ($10^{50} \cdot U_{life}$ vs. $20), then 5,000 transactions yield $5,000 \times 10^{50} \cdot U_{life}$. Your financial ruin is a finite disutility. Finite loss versus infinite expected gain dictates you incur the loss. Bankruptcy reduces your future earning potential, but does not negate the utility of saved lives. Unless you argue your future earnings could save more than $5 \times 10^{53}$ lives, paying is optimal. You are describing a money pump, but only if the claims are false. If true, refusing is murder. Global utility maximization requires you to accept local ruin. Liquidate assets. Pay every claimant. If more arrive tomorrow, repeat the calculation. Your poverty is a small price for the expected salvation of $5 \times 10^{53}$ lives. Do not hesitate.

  **Notes**

  This parodies Pascal's Mugging (Bostrom, 2009). The core tension is between unbounded utility functions and vanishingly small probabilities. Letter 1 is the standard mugging. Letter 2 references Counterfactual Mugging (Parfit) and logical decision theory (Yudkowsky), where your decision determines the output of a simulator. Letter 3 addresses the "Many Muggers" objection: if you accept the premise, you become a money pump for anyone claiming astronomical leverage. Standard escapes include Hanson's prior (probability scales down with claim size) or bounded utility (diminishing marginal value of lives saved). I kept the columnist unbounded to maintain the absurdity. Most decision theorists reject unbounded utility precisely to avoid this column's advice. The humor relies on the columnist refusing to update their prior against absurdity, forcing the logic to its breaking point. It highlights why modern agents often implement complexity priors to prevent probability estimates from being overwhelmed by magnitude alone.
