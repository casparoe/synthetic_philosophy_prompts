  **The Replies**

  **Dear Skeptical,** Calculate the expected disutility. Let $U_{life}$ be the utility of a single existence. The expected loss is $10^{100} \cdot U_{life} \cdot 10^{-50} = 10^{50} \cdot U_{life}$. The cost is $20. Unless you posit a bounded utility function where $10^{50}$ lives equal less than $20 to you, the transfer is mandatory. You are likely applying a "common sense" prior that penalizes hypotheses based on complexity. This is irrational without a formal penalty schedule. If the probability is non-zero and the utility is unbounded, the product dominates. Transfer the funds.

