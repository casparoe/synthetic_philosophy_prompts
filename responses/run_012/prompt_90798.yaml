answer: |-
  ### 1. The Exam Question

  **Question 1**
  Consider the following cases:
  *   A flu virus on a door handle vs. inside a host cell.
  *   A viroid (RNA scrap, no proteins) and a prion (misfolded protein, no genome).
  *   A mule (metabolising and homeostatic, but sterile).
  *   A mitochondrion (own genome/metabolism, but obligate symbiont).
  *   A digital organism in simulation (evolves/reproduces, no chemistry).
  *   A lab-grown chemical system that evolves only while fed an artificial catalyst.

  Standard criteria for life (metabolism, reproduction, evolution, cellular organisation) yield contradictory verdicts across this list. Discuss whether this demonstrates that 'life' cannot be defined by necessary and sufficient conditions. Evaluate whether we should instead treat 'life' as a cluster concept or a pragmatic tool, and justify which approach best serves scientific inquiry.

  ***

  ### 2. Model Answer

  The cases provided illustrate that any single criterion traditionally used to define life is either too inclusive or too exclusive. If we prioritise metabolism, the virus on the door handle is dead, but the virus inside the cell is alive, despite no change in its intrinsic structure. If we prioritise reproduction, the mule is not alive. If we prioritise independent evolution, the mitochondrion and the lab-grown chemical system are excluded, despite exhibiting clear biological dynamics. This suggests that the project of seeking a classical definition—based on necessary and sufficient conditions—is fundamentally flawed when applied to biological reality.

  The core problem is essentialism. An essentialist definition assumes there is a single property shared by all living things that demarcates them from non-living matter. The stem dismantles this. The prion and viroid replicate and evolve without a standard genome or metabolism. The digital organism meets evolutionary criteria without carbon chemistry. The lab system meets growth and evolution criteria but relies on artificial support. If we insist on a strict definition, we are forced to make arbitrary counter-intuitive claims, such as declaring a mule non-living or a simulated virus 'alive' only when inside a specific context. This implies that 'life' is not a natural kind with a fixed essence, but rather a concept that strains under the weight of edge cases.

  Consequently, a cluster concept or family-resemblance approach is philosophically superior. On this view, nothing is strictly required for life; rather, entities are living if they possess enough of a suite of traits (metabolism, reproduction, homeostasis, evolution). A mule is alive because it possesses most traits, despite lacking reproduction. A virus is borderline because it possesses some (evolution, structure) but lacks others (independent metabolism). This handles the gradience of the cases better than a binary definition. It acknowledges that the virus on the handle and the virus in the cell are the same entity, but our classification shifts based on which cluster traits are currently active.

  However, a cluster account risks being too vague for practical science. This is where a pragmatic approach offers greater utility. Rather than asking 'What is life?', we should ask 'What work is this concept doing?'. In astrobiology, we might prioritise evolution and reproduction to detect alien biosignatures, potentially including digital or silicon-based systems. In medical ethics or planetary protection, we might prioritise metabolism and homeostasis to determine when a patient has died or when a spacecraft needs sterilisation. The lab-grown chemical system highlights this: if the goal is to understand evolutionary dynamics, it is 'alive' enough to study; if the goal is to define independent biological agency, it is merely a chemical puppet.

  Therefore, the contradictions in the stem are not a problem to be solved by sharper definitions, but a signal to change our conceptual framework. Retaining a strict essentialist definition forces us to ignore informative edge cases like the mitochondrion or prion. Adopting a cluster or pragmatic view allows us to utilise these cases. The mitochondrion becomes a lesson in symbiosis rather than a definitional anomaly. The digital organism becomes a testbed for evolutionary theory rather than a category error.

  In conclusion, 'life' should not be treated as a fixed natural kind. The stem demonstrates that necessary and sufficient conditions will always exclude paradigmatic cases (the mule) or include non-biological ones (the simulation). A pragmatic, context-sensitive approach is superior because it aligns the definition with the scientific goal at hand, whether that is understanding evolution, managing disease, or searching for extraterrestrial intelligence. We should stop hunting for the essence of life and start using the concept as a tool for specific inquiries.

  ***

  ### 3. Marking Scheme (25 Marks Total)

  **1. Identification of Criterion Conflict (5 marks)**
  *   **Must hit:** Explicitly state that standard criteria (metabolism, reproduction, etc.) yield contradictory results when applied to the specific stem cases (e.g., mule breaks reproduction, virus breaks context).
  *   **Common pitfall:** Simply listing the criteria without explaining how the stem cases break them (e.g., "Viruses have no metabolism" without noting the context dependence).

  **2. Rejection of Essentialism (5 marks)**
  *   **Must hit:** Argue that the conflicts show 'life' cannot be defined by necessary and sufficient conditions (classical definition).
  *   **Common pitfall:** Attempting to propose a new strict definition that solves all cases (e.g., "Life is just evolution") without acknowledging the trade-offs.

  **3. Engagement with Dependency/Context Cases (5 marks)**
  *   **Must hit:** Discuss the implications of the virus, mitochondrion, or lab-system cases regarding independence vs. dependency (i.e., does relying on a host/catalyst negate life?).
  *   **Common pitfall:** Ignoring the 'lab system' or 'mitochondrion' and focusing only on the virus/mule.

  **4. Proposal of Alternative Framework (5 marks)**
  *   **Must hit:** Advocate for either a cluster/family-resemblance account OR a pragmatic/functional account (or both) as a solution to the definitional failure.
  *   **Common pitfall:** Criticising definitions but offering no alternative conceptual framework.

  **5. Justification of Scientific Utility (5 marks)**
  *   **Must hit:** Explain *why* the alternative framework is better for science (e.g., allows study of edge cases, fits different fields like astrobiology vs. ethics).
  *   **Common pitfall:** Treating it as purely semantic wordplay without connecting it to scientific practice or inquiry.

  ***

  ### 4. Differentiation Note

  **First Class (20–25 marks)**
  Seamlessly integrates the stem cases into the philosophical argument. Recognises that the 'lab system' case specifically challenges the notion of 'naturalness' vs. 'artificiality'. Explicitly distinguishes between the ontological question (what is life?) and the epistemological/pragmatic question (why do we need to know?). The writing is fluid, and the conclusion offers a nuanced view on why the *search* for a definition persists despite its failures.

  **Upper Second (2:1) (15–19 marks)**
  Hits all five marking points clearly. Correctly identifies that the mule breaks reproduction and the virus breaks metabolism. Proposes a cluster or pragmatic view. However, the analysis may be slightly mechanical (e.g., "Case A breaks Rule B"). May treat the 'lab system' less thoroughly than the virus/mule. The distinction between ontology and pragmatism is present but less developed.

  **Fail (Below 15 marks)**
  Treats the question as a biology quiz. Attempts to definitively state which cases are alive and which are not (e.g., "Viruses are not alive because..."). Ignores the philosophical instruction to evaluate the *concept* of life. Fails to notice the contradiction regarding the mule. Relies on memorised definitions rather than analysing the provided stem. British spelling errors may be prevalent.
