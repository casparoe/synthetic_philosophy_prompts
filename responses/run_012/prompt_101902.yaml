prompt: |-
  ok so I'm trying to get my head around two-dimensional semantics for a term paper and I keep running into confident-sounding summaries that then sort of fall apart when I press on them, so I want a sanity check on one of them.

  A friend of mine who's further along in the program sent me this as a "here's the gist" thing:

  "Two-dimensional semantics is the idea that every expression has two meanings. The first meaning is the a priori one: it's basically the definition you'd give if you knew nothing about the world, the thing you're picking out by description. The second meaning is the a posteriori one: the actual object out there in the world that the word refers to. So really it's Frege's sense/reference distinction dressed up with a Kripkean twist — the sense is the first dimension, the reference is the second. Its big payoff is that it explains how a statement like 'water is H2O' can be necessary and still be something we only find out empirically, which vindicates the analytic/synthetic distinction after Quine tried to kill it. And it's what lets Chalmers argue that zombies are conceivable, which is supposed to show that physicalism is false."

  I'm pretty sure there's stuff right in there and stuff that's off, but I can't tell which is which. For what it's worth I'm sympathetic to the general idea that there are truths about meaning you can know a priori and that conceivability tells us something about possibility, so I'm probably inclined to give it a pass — which is exactly why I want someone to be picky with it.

  Can you go through it basically sentence by sentence and seperate: what a card-carrying two-dimensionalist would happily sign off on, what's a harmless popularization that a careful person might still wince at, what's actually a mistake (and what kind — a conflation of two things the view keeps apart, an overstatement of a modest thesis, a technical term used in its everyday sense, that sort of thing), and then whether the conclusions at the end actually follow from the parts that survive. Please don't just tell me it's "roughly right" — I need to know which specific sentences I'd get dinged for repeating in a seminar, and what a defender of the framework would say on its behalf.
