answer: |-
  You are absolutely right to feel confused, because your seminar is colliding two distinct projects that share a vocabulary but don't quite share a map. Your friends are both half-right, which is why you're stuck in the middle. Here is the breakdown of what Hume is actually doing in that passage and how it connects to Williams.

  First, you need to separate the question of **motivation** from the question of **justification**. Williams is asking a metaethical question: "When we say an agent has a *normative reason* to act, what makes that claim true?" He concludes that for a reason to exist, it must be grounded in the agent's subjective motivational set. Hume, in the *Treatise*, is asking a metaphysical and psychological question: "What actually causes the will to move?" He concludes that beliefs (reason) lack causal power on their own and require a desire (passion) to spark action.

  So, to answer your main question: Hume is telling us what causes our actions. He is doing causal psychology and metaphysics of mind. Williams takes Hume's psychological conclusion—that reason alone cannot motivate—and builds a normative theory on top of it. If reasons must be capable of motivating (a premise Williams inherits from the Humean tradition), and only passions motivate, then reasons must hook up to passions. Your friend who says Hume "invented internalism" is right about the lineage, but your other friend is right that Hume isn't explicitly debating Williams's specific question about normative truth. Hume is laying the psychological groundwork that makes Internalism plausible.

  Regarding that frustrating premise about passions having "no representative quality": Hume isn't denying that emotions feel like they are about something. He is making a technical point about **truth-aptitude**. For Hume, reason deals in ideas that copy reality (beliefs), so they can be true or false. Passions are "original existences"—they are reactions or pushes, not copies. You can be wrong about the *object* of your fear (the belief that the snake is real), but the fear itself isn't true or false; it just *is*. This is crucial for his argument because if passions aren't truth-apt, reason (which judges truth) cannot judge them. Modern philosophers often reject this (arguing emotions involve judgments), but within Hume's system, it blocks reason from having authority over passion.

  This helps explain the weird "ought" claim. When Hume says reason "ought only to be the slave," he isn't issuing a moral command. He is making a claim about **functional propriety**. It's like saying, "A screwdriver is, and ought only to be, a tool for screws." He means we shouldn't *expect* reason to do something it metaphysically cannot do. It's a corrective to philosophical error, not a moral obligation.

  Finally, regarding the calm passions: No, this does not wreck the story; it saves it. Hume knows that sometimes we feel a calm desire for long-term good opposing a violent desire for immediate pleasure, and it *feels* like reason opposing passion. He introduces calm passions to explain this phenomenology. He's saying we mislabel the calm desire as "reason" because it lacks emotional turbulence. This reinforces the psychological reading: he is explaining why people *think* reason commands the will, even though, metaphysically, it is always a passion (calm or violent) doing the work.

  Verdict: Psychological claim about motivation.
