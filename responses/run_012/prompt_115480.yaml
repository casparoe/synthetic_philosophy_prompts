      *   **Instrumentalist (Friend):** Belief-talk is a tool, not a description of ontology. No inner state with content. No "what it's like." Scaffolding to be discarded. Slippery slope is a *reductio* (if thermostats have beliefs, the word is broken). Inheritance means it's mimicry, not genuine holding. Instability proves lack of core state. Self-reports are just next-token predictions, not evidence of state.

