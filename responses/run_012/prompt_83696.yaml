answer: |-
  ### Brainstorming & Selection

  *   **Moving Parts:**
      *   *Alignment Tax:* The cost (compute, speed, capability) incurred to make a system safe.
      *   *Competitiveness Constraint:* Market pressure prevents paying the tax if competitors don't.
      *   *Unilateral Pause:* Suicide in a race; handing the lead to others.
      *   *Assurance Problem:* Lack of credible commitment mechanisms between labs.
      *   *Redefining Safety:* Motivated cognition where "safe" means "what we were building anyway."
      *   *Capability vs. Time:* The tax can manifest as weaker models (capability) or later releases (time).
  *   **Selection for the Round:**
      *   *Form:* A staggered canon (round) mimics the race structure (chasing the same goal, entering at different paces).
      *   *Refrain:* "The price of safety is the lead." (Ambiguous: Is the price *losing* the lead, or is safety *bought with* the lead?)
      *   *Voices:*
          1.  **Safety-Conscious:** Pays the tax genuinely, fears losing.
          2.  **Safety-Washer:** Claims to pay, redefines tax as PR.
          3.  **Accelerationist:** Ignores tax, takes the lead.
      *   *Equilibrium:* The overlap creates dissonance; the system forces the race regardless of intent.

  ***

