prompt: |-
  I'm putting together a little collection of poems about ideas in AI saftey, and I need one on the competitiveness constraint and the alignment tax. You're a poet who also knows this literature well enough to be dangerous, so I dont want a Wikipedia summary in verse -- I want the poem to do the conceptual work.

  Here's the setup, in case you need it: the alignment tax is the idea that safety work costs you something -- capability, speed, compute, whatever. The competitiveness constraint is the idea that if one lab pays that tax and another doesn't, the one that doesn't can get ahead, so the safe lab either loses or cuts corners. If everyone could credibly commit, they'd all pay it; the problem is that no one can, and a unilateral pause just hands the lead to someone else. I also want the poem to touch the difference between a tax on capability and a tax on time-to-capability, because I think thats where a lot of the real action is.

  I want a round (a canon for three voices, the kind where each voice enters at different times and the same line keeps coming around). Three voices: (1) a lab that genuinely wants to be safe but is watching the leaderboard, (2) a lab that says it's safe but keeps redefining safety as whatever it was going to do anyway, and (3) a lab that isn't pretending at all. The same recurring line should mean something different each time it comes around, and when all three finally sing together, it should sound less like harmony and more like an equilibrium nobody chose. 24-30 lines total, with a refrain that makes the tax audible. Lay it out however makes the entrances visible -- three columns, or stanzas with voice markers, whatever works. Don't name real companies or people. Dont make it a sermon; let the form carry the argument.

  Before you write, brainstorm a bit -- list the moving parts you see (the tax, the race, the unilateral pause, the assurance problem, the temptation to redefine safety, the schedule vs capability thing) and pick which ones the round can actually hold. Then write the poem.

  After the poem, give me a short JSON object with these fields: "form" (what form you actually used and why), "voices" (list the three voices and what each is optimizing for), "recurring_line" (the line that does the most work), "where_the_tax_shows_up" (the moment the poem makes the cost visible), "the_equilibrium" (what the round says about why unilateral safety is unstable), "what_a_specialist_would_check" (one or two things a person who knows this literature would want to see in the poem), and "what_i_left_open" (what the poem refuses to resolve). Keep each value to a sentence or a short list. No citations, no reading list.
