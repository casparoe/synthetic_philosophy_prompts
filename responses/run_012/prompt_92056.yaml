answer: |-
  ### Decision Tree: The Ontology of Intentional Patterns

  **Node 1:** Does the predictive success of the intentional stance entail that the posited entities (beliefs, desires) exist, or is success compatible with their non-existence?
  *   **Compatible with non-existence:** Go to Node 2.
  *   **Entails existence:** Go to Node 3.

  **Node 2:** Is the dispute over whether these entities "exist" merely a verbal confusion, or is there a substantive difference between using the idiom and believing in the entities?
  *   **Merely a verbal confusion:** **Leaf 1: Deflationary Verbalism**.
  *   **Substantive difference:** **Leaf 2: Instrumentalism**.

  **Node 3:** Is the pattern posited (e.g., a specific belief) recoverable without loss from the finest-grained physical description of the system?
  *   **Yes, recoverable without loss:** Go to Node 4.
  *   **No, information is lost in translation:** Go to Node 5.

  **Node 4:** Is the mapping between the intentional state and the physical state strict (one-to-one) or flexible (many-to-one)?
  *   **Strict (one-to-one):** **Leaf 3: Type-Identity Physicalism**.
  *   **Flexible (many-to-one):** **Leaf 4: Token-Identity Physicalism**.
      *   *(Note: These leaves are often indistinguishable in practice, as strict type-identity is rarely found outside simple logic gates.)*

  **Node 5:** Does the reality of this coarse-grained pattern depend on an observer's *interest* in compressing the data, or only on the system's *causal capacity* to support that compression?
  *   **Depends on observer's interest:** **Leaf 5: Stance-Dependent Realism**.
  *   **Depends on causal capacity:** Go to Node 6.

  **Node 6:** Is the reality of the macro-pattern ontologically equal to the micro-physical base, or is it secondary to it?
  *   **Ontologically equal:** **Leaf 6: Objective Emergent Realism**.
  *   **Ontologically secondary:** **Leaf 7: Ontologically Gradated Realism**.

  ***

  ### Leaf Descriptions & Test Cases

  **Leaf 1: Deflationary Verbalism**
  *   **Test Case:** A fluctuating stock **Market**.
  *   **Awkward Commitment:** The philosopher of science's view; it claims the dispute is a refusal to take a position, rendering the entire reading group's debate a category error regarding language rather than the world.

  **Leaf 2: Instrumentalism**
  *   **Test Case:** A **Thermostat**.
  *   **Awkward Commitment:** The thermostat's "goal" to maintain 70°F is no more real than a stone's "desire" to fall, forcing you to explain the thermostat's complex feedback loops using the same ontology as gravity.

  **Leaf 3: Type-Identity Physicalism**
  *   **Test Case:** A simple **Digital Computer** running a specific logic gate.
  *   **Awkward Commitment:** Every specific belief (e.g., "2+2=4") must correspond to the exact same physical configuration in every possible system, making it hard to attribute the same belief to a human brain and a silicon chip.

  **Leaf 4: Token-Identity Physicalism**
  *   **Test Case:** A **Chess Engine** (running on different hardware).
  *   **Awkward Commitment:** While the same belief can be realized by different physical states, every specific instance of that belief is exhaustively defined by its physical realization, leaving no room for the pattern to exist independently of that specific hardware state.

  **Leaf 5: Stance-Dependent Realism**
  *   **Test Case:** A **Large Language Model**.
  *   **Awkward Commitment:** If the last human died, the LLM would cease to have beliefs or intentions, even if its weights and outputs remained exactly the same, making intentionality a property of the observer rather than the system.

  **Leaf 6: Objective Emergent Realism (Your Position)**
  *   **Test Case:** An **Ant Colony**.
  *   **Awkward Commitment:** The colony possesses genuine beliefs that are not fictions, yet these beliefs vanish without remainder if you describe the system solely at the level of individual ants, requiring you to accept that reality admits of levels that are not reducible to the fundamental base.

  **Leaf 7: Ontologically Gradated Realism (Unnamed)**
  *   **Test Case:** A **Bacterium**.
  *   **Awkward Commitment:** This view is largely unexplored, likely because it is unattractive: it suggests the bacterium has "0.003 beliefs," implying that truth and existence admit of degrees, which complicates logic and semantics beyond usability.
