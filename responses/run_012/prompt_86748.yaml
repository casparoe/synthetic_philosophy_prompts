  ### Summary of the Framing Break
  You asked me to be explicit if the framing is broken. It is.

  The trustee's argument treats "Probability of Sentience" as a frequency (like a coin flip). It is not. It is an **epistemic confidence interval** over a poorly defined predicate. Multiplying a vague probability by an astronomical number is mathematically valid but decision-theoretically unstable.

  **My Recommendation for the Board:**
  Do not present this as "We are deciding if insects matter." Present it as **"We are stress-testing our valuation model."**

  1.  **Allocate 70% ($210k)** to your established vertebrate portfolio (Items 1 & 2 research + Vertebrate grants). This honors the foundation's track record and robust evidence.
  2.  **Allocate 30% ($90k)** to the Invertebrate Hedge (Item 3). This satisfies the trustee's concern about tail risk without exposing the foundation to model collapse.
  3.  **Use the 2-Year Window** to commission the Conceptual Report (Item 1). If that report concludes that a threshold view is defensible, you have the intellectual ammunition to reduce the Invertebrate allocation in Year 3. If it concludes sentience is likely continuous, you have justification to increase it.

  **Where I am Unsure:**
  I am uncertain whether a "threshold view" can be defended without appearing speciesist to the trustee. If the trustee is a strict utilitarian, they may reject thresholds as arbitrary. In that case, the **Welfare Intensity (Item 2)** becomes your primary lever. If you can demonstrate that insect welfare range is negligible compared to vertebrates, you win the argument on $V$ even if you lose on $P$.

  **Final Instruction:**
  Ignore broad empirical surveys. Ignore "raising awareness" campaigns for insects. Focus your research budget on **conceptual clarity** and **comparative intensity**. These are the only two levers that can mathematically deflate the scale argument enough to make a 30% hedge defensible to a skeptical board.
