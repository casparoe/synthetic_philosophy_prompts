  ### Bedrock vs. Live Disputes

  Use this section to manage the "consensus" expectation in your talk.

  **1. Bedrock (Settled among Decision Theorists)**
  *   **Newcomb's Problem:** Among those who prioritize "winning" (getting the money) over "causal purity," **One-Boxing** is settled. CDT (Two-Boxing) is widely acknowledged to lose money in this specific setup.
  *   **The Goal:** There is consensus that a decision theory should recommend the action that leads to the best outcome, not just the one that feels causally justified.

  **2. Live Dispute (Genuinely Contested)**
  *   **Counterfactual Mugging:** This is **not** settled.
      *   *Camp A (UDT/FDT):* You must pay. Rationality is about selecting the best *policy* ex-ante. If you wouldn't pay, you wouldn't get the $10k on Heads.
      *   *Camp B (CDT/EDT/Skeptics):* You should not pay. Once the coin is Tails, the $10k on Heads is gone. Paying is literally burning $100 for no causal return.
      *   *The Friction:* This is the hardest sell to engineers. It requires accepting that "rationality" sometimes means losing in the actual world to win in the expected world.
  *   **XOR Blackmail:**
      *   *Dispute:* Is this distinct from Mugging? Some argue paying here incentivizes blackmailers more than Mugging does. Others argue the logical correlation is identical.
  *   **Metaphysics of "Logical Causation":**
      *   *Dispute:* FDT/TDT rely on the idea that your decision "logically determines" a simulation. Philosophers and some CS theorists argue this is category error (code output doesn't cause the simulation's past output).

  ### Facilitator Notes for the Engineer
  *   **If the room splits on Node 3 (Mugging):** Do not try to resolve it. This is the feature, not the bug. Highlight that half the room is optimizing for *this instance* (CDT/EDT) and half is optimizing for *the algorithm* (UDT/FDT).
  *   **If someone asks "But Omega isn't real":** Direct them to Node 9. Acknowledge that if Omega is impossible, CDT is fine. But note that in AI Safety, *other AIs* act as Omegas for each other (predicting source code), making these problems practical, not just philosophical.
  *   **On the "Awkward Commitments":** Read these out loud. They are designed to make everyone uncomfortable. That discomfort is where the learning happens.
