      *   Did I separate needs vs. comfortable fit? Yes.
      *   Did I address underdetermination? Yes.
      *   Did I handle the "Harder Bit" (WAW swap)? Yes.
      *   Did I distinguish settled vs. contested? Yes.

  8.  *(Self-Correction on "Settled" Science)*: Be careful. Even in conservation biology, there are debates about the efficacy of catch-and-release mortality rates. I should frame "settled" as "operational consensus" rather than "absolute truth."

