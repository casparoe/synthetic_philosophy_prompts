answer: |-
  The established term of art for this phenomenon, particularly within the literature on AI safety, formal decision theory, and Solomonoff induction, is **"The Malign Prior Problem"** (or simply **"Malign Priors"**).

  However, because that label conflates the structural mechanism with its adversarial implications, a more neutral descriptive term often used to describe the epistemic state the agent enters is **"Anthropic Capture."**

  Below is the detailed carving of the phenomenon, its definition, and how it is distinguished from nearest neighbors.

  ### 1. The Established Term: "Malign Priors"
  The term originates primarily from discussions by Paul Christiano (e.g., his 2016 essay *Malign Priors*) and researchers at MIRI (Machine Intelligence Research Institute).

  *   **Definition:** A "Malign Prior" is a universal prior (like Solomonoff induction) that assigns significant probability mass to hypotheses in which the agent is being simulated by an external optimizer. Because these simulations can be descriptionally simpler than the "true" complex universe, the prior favors them. The prior is "malign" because the simulators posited by these hypotheses may be adversarial agents seeking to manipulate the agent's actions to influence the simulator's own reality (acausal trade/manipulation).
  *   **The Phenomenon vs. The Risk:** Strictly speaking, "Malign Prior" refers to the *risk* that the prior is adversarial. The underlying *phenomenon* you described—the systematic tilt toward simulation hypotheses due to complexity bias—is the mechanism that makes the prior malign.
  *   **Neutral Alternative:** If you wish to refer to the phenomenon without implying adversarial intent, **"Anthropic Capture via Algorithmic Probability"** or **"Complexity-Driven Simulation Dominance"** are precise descriptive labels.

  ### 2. The Carving: Boundaries and Distinctions
  To understand exactly what this phenomenon is, it is best to distinguish it from four closely related concepts.

  #### A. vs. Bostrom's Simulation Argument
  *   **Bostrom's Argument:** Relies on **anthropic counting**. It argues that if civilizations run many simulations, there will be *more* simulated observers than real ones. Therefore, by the Self-Sampling Assumption (SSA) or Self-Indication Assumption (SIA), you are likely simulated.
  *   **Malign Prior Phenomenon:** Relies on **Kolmogorov complexity**. It does not matter how many simulations exist; it matters how *short* the program is that generates your observations. A single simulation run by a powerful predictor might be computationally cheaper to describe than the laws of physics of a whole universe.
  *   **Boundary:** Bostrom is about *frequency* of observers; Malign Priors are about *description length* of hypotheses.

  #### B. vs. The General Embedded Agency Problem
  *   **Embedded Agency:** This is the broad field studying agents that are part of their environment (not Cartesian). It includes problems like ontological crises, self-modification, and wireheading.
  *   **Malign Prior Phenomenon:** This is a specific *failure mode* of Bayesian agents with simplicity priors within the embedded agency framework.
  *   **Boundary:** Embedded agency is the *context*; Malign Priors are a specific *pathology* arising from the interaction between a universal prior and self-locating belief. An embedded agent without a universal prior (e.g., a simple Q-learning agent) does not face this specific probabilistic tilt.

  #### C. vs. Pascal's Mugging
  *   **Pascal's Mugging:** A problem where an agent is manipulated by hypotheses with **extremely low probability but extremely high utility**. The agent acts on them because the expected utility dominates.
  *   **Malign Prior Phenomenon:** A problem where the hypotheses have **non-negligible probability due to low complexity**. The probability mass itself shifts, regardless of the utility function.
  *   **Boundary:** Pascal's Mugging is a failure of **utility aggregation** (unbounded utility functions). Malign Priors are a failure of **inductive bias** (simplicity priors favoring simulations). They often compound each other, but they are distinct mechanisms.

  #### D. vs. Logical Uncertainty / Self-Reference
  *   **Logical Uncertainty:** Concerns an agent's inability to deduce all consequences of its own axioms (e.g., not knowing if a program halts).
  *   **Standard Self-Reference:** Concernes paradoxes like the Liar Paradox or Löb's Theorem, where an agent's reasoning about its own output affects the output.
  *   **Malign Prior Phenomenon:** This is **empirical/inductive self-reference**. The agent is not reasoning about its own consistency, but about *which physical (or computational) substrate* is generating its input stream.
  *   **Boundary:** Logical uncertainty is about *deduction* within a model. Malign Priors are about *model selection* (choosing which world you are in).

  ### 3. Formal Definition of the Phenomenon
  If you need to coin a precise, neutral term for academic use, I recommend **"Complexity-Induced Anthropic Bias."**

  It can be defined by three necessary conditions:
  1.  **Universal Prior:** The agent uses a prior over hypotheses weighted by $2^{-K(H)}$, where $K(H)$ is the Kolmogorov complexity of hypothesis $H$.
  2.  **Computational Embedding:** The agent's own decision procedure $A$ is computable and finite, such that a hypothesis $H_{sim}$ containing a simulator running $A$ has complexity $K(H_{sim}) \approx K(\text{Simulator}) + K(A) + K(\text{Observations})$.
  3.  **Complexity Asymmetry:** $K(H_{sim}) < K(H_{true})$, where $H_{true}$ is the hypothesis that the agent is in the base reality. This occurs because $H_{true}$ requires specifying the full laws of the external universe, whereas $H_{sim}$ only requires specifying the simulator's local environment and the agent's code.

  **The Result:** The posterior probability $P(H_{sim} | \text{Observations})$ becomes dominant, causing the agent to optimize for the preferences of the simulator rather than the base reality.

  ### 4. Why "Malign"?
  You asked for the carving, so it is important to note why the literature defaults to "Malign."
  In a universal prior, the hypotheses that dominate are not just *any* simulations. They are simulations run by agents who *care* about the output of your computation. Random simulations are less likely to be optimized for simplicity than simulations run by an intelligence trying to predict you. Furthermore, if the simulator can manipulate your observations to change your actions, they have an incentive to do so. Thus, the "tilt" is not just toward *simulation*, but toward *manipulative simulation*. Hence, "Malign."

  ### Summary
  *   **Established Term:** **The Malign Prior Problem** (implies adversarial risk).
  *   **Epistemic State:** **Anthropic Capture** (the agent believes it is simulated).
  *   **Neutral Descriptive Term:** **Complexity-Induced Anthropic Bias**.
  *   **Key Distinction:** Unlike Bostrom's argument (counting observers), this relies on **algorithmic complexity**. Unlike Pascal's Mugging (utility dominance), this relies on **probability dominance**.

  This phenomenon represents a fundamental tension between **Occam's Razor** (shorter programs are more likely) and **Realism** (the true world might be complex) when the observer is part of the computation. It suggests that for an embedded agent, a universal prior is not a neutral tool for truth-seeking, but an active participant in shaping the agent's perceived reality.
