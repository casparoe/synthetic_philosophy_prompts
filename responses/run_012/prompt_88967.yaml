answer: |-
  ### The Tension Between Isolation and Organic Unity in Moore's *Principia Ethica*

  G. E. Moore's *Principia Ethica* (1903) establishes two pillars of early analytic value theory that appear, on the surface, to be in direct conflict. The first is the **Isolation Test**: to determine the intrinsic value of any thing, we must consider whether it would be good if it existed "in absolute isolation" from everything else. This implies that intrinsic value is a non-relational, immutable property. The second is the **Doctrine of Organic Unities**: "The value of a whole must not be assumed to be the same as the sum of the values of its parts." This implies that the value contribution of a part is context-sensitive; the presence of one part can alter the value significance of another.

  The conceptual tension is immediate: If the value of a part is sensitive to the whole to which it belongs (Organic Unities), how can we determine its value by stripping away all context (Isolation Test)? If isolating a part reveals its *true* intrinsic value, that value should remain constant regardless of the whole. If the value changes when the part enters a whole, then the Isolation Test seems to measure something irrelevant to the actual ethical landscape.

  To resolve this, we must examine how Moore applies these principles to his paradigmatic goods: the appreciation of beauty and the pleasures of friendship.

  ### Brainstorming Two Readings of Moore's Position

  To navigate this tension, we can distinguish between two interpretive strategies regarding Moore's value theory.

  **Reading 1: The Emergent Holist Reading**
  On this reading, the primary bearers of value are complex states of affairs, not simple atoms. The "Isolation Test" is not a method for stripping a complex state down to its physical constituents, but rather for isolating the *minimal organic whole* that bears value. For example, "beauty" (the object) has no value in isolation, and "consciousness" (the mind) has no value in isolation. Only the unity "consciousness of a beautiful object" has value. Therefore, when Moore speaks of the "parts," he refers to abstract features of a state, not independent entities. The tension is dissolved because we never actually isolate the *value-bearing* parts from the whole; we isolate the whole itself from the rest of the universe.

  **Reading 2: The Contributory Distinction Reading**
  On this reading, Moore maintains a strict distinction between two concepts: **Intrinsic Value** (the value a thing has in isolation) and **Value as a Part** (the amount of value a thing contributes to a whole). The Isolation Test measures only the former. The Doctrine of Organic Unities is a thesis about the latter. A part retains its fixed intrinsic value regardless of context, but its *contribution* to the total value of a whole can vary (it can even be negative). The tension is verbal rather than logical: Moore uses the word "value" for both properties, but they are metaphysically distinct.

  ### Developing the Defensible Reading: The Contributory Distinction

  While Reading 1 captures the phenomenology of Moore's examples, **Reading 2 (The Contributory Distinction)** is the most defensible interpretation of Moore's explicit theoretical commitments. It preserves the non-naturalist definition of "intrinsic" as a simple, non-relational property. If intrinsic value were context-sensitive, it would be relational, violating Moore's core metaphysical claim. Therefore, Organic Unities must be understood as a claim about how parts *function* within a whole, not about how their intrinsic nature changes.

  **Applying the Cases**

  1.  **The Appreciation of Beauty:**
      Consider a beautiful object (e.g., a sunset) and a conscious appreciation of it.
      *   *Isolation Test:* If we isolate the beautiful object in a universe with no consciousness, Moore suggests it has little to no intrinsic value. If we isolate a state of consciousness admiring nothing (or a neutral object), it has little value. However, the complex state "consciousness of a beautiful object" is a great good.
      *   *Organic Unity:* Under Reading 2, the "part" (the pleasure of admiration) has a specific intrinsic value (positive). The "part" (the existence of the beautiful object) has a specific intrinsic value (near zero). However, when combined, the *contribution* of the pleasure is amplified by the existence of the object. The whole possesses a surplus of value over the sum of the parts.
      *   *Resolution:* The Isolation Test tells us the pleasure is good *in itself*. Organic Unities tells us that this pleasure is *more valuable* when directed at a real beauty than when directed at a delusion, even if the qualitative feel of the pleasure is identical. The isolation test identifies the good-making property; organic unity explains its magnification in context.

  2.  **The Pleasures of Friendship:**
      Consider two strangers enjoying a meal versus two friends enjoying a meal together with mutual affection.
      *   *Isolation Test:* The pleasure of eating is good in isolation. The feeling of affection is good in isolation.
      *   *Organic Unity:* In the case of the friends, the whole (mutual enjoyment) is vastly superior to the sum of the two isolated pleasures.
      *   *Resolution:* The intrinsic value of "my pleasure" remains constant whether I am with a stranger or a friend. However, its *value as a part* of the friendship whole is greater. In the stranger case, my pleasure contributes only its intrinsic amount. In the friend case, my pleasure interacts with yours to create a relational good (the mutuality) that boosts the contributory value of both parts.

  **Assessment of the Tension**

  Is this tension merely methodological, or does it reflect a deeper problem? It reflects a **deep problem regarding the ethical utility of intrinsic value.**

  If Reading 2 is correct, then "Intrinsic Value" (measured by isolation) is a metaphysical constant that rarely appears in the real world. In reality, we always deal with "Value as a Part." Moore wants to ground ethics in intrinsic value, but his own doctrine of Organic Unities admits that the ethically significant quantity is the *contributory* value, which the Isolation Test cannot measure.

  This creates a calculation problem for Moore's consequentialism. If the value of a whole is not the sum of the intrinsic values of its parts, we cannot calculate the right action by summing up intrinsic goods. We must know the *laws of organic combination*, which Moore does not provide. Thus, the tension reveals that Moore's metaphysics of value (non-relational, intrinsic) is ill-suited to his ethics of value (holistic, contextual). The Isolation Test secures the objectivity of value, but Organic Unities admits that objectivity is insufficient for ethical guidance.

  ### What the Other Reading Gets Right

  While I defend the Contributory Distinction (Reading 2) as textually consistent with Moore's non-naturalism, the **Emergent Holist Reading (Reading 1)** gets something crucial right about Moore's *practice*.

  Reading 1 correctly identifies that for Moore, the primary bearers of value are almost always **complex states of consciousness**. Moore is not an atomist about value-bearers in the way a hedonist like Bentham is. When Moore asks us to "isolate" a thing, he rarely means a physical object; he means a state of affairs. Reading 1 highlights that the "Isolation Test" is often a tool to identify the *minimal sufficient condition* for value, rather than to strip value down to a simple sense-datum.

  For instance, in the beauty case, Reading 1 rightly suggests we cannot meaningfully isolate "appreciation" from "object" because the value resides in the *intentional relation* between them. If we accept Reading 1, the tension shifts: the problem is not that parts change value, but that we often misidentify the "part." We think the "part" is the pleasure, but the "part" is actually the *consciousness-of-beauty*. Reading 1 saves the intuition that value is holistic, even if it strains Moore's definition of "intrinsic" as non-relational.

  ### Conclusion

  The tension between the Isolation Test and Organic Unities is not a simple contradiction but a friction between Moore's metaphysical rigor and his ethical intuitions. The most defensible reading distinguishes between *intrinsic value* (fixed, isolated) and *contributory value* (variable, contextual). This saves Moore's logic but renders "intrinsic value" ethically remote. The alternative holist reading captures the reality of Moore's examples—that value resides in complex unities—but risks making "intrinsic value" incoherent. Ultimately, the tension reveals a lasting challenge in value theory: how to reconcile the immutability required for objective value with the context-sensitivity required for meaningful ethical life. Moore secures the former at the expense of the latter.
