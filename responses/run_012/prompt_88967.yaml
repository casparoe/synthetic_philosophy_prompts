prompt: |-
  You are a philosopher specializing in early analytic ethics and value theory. G. E. Moore holds that the value of a whole can exceed the sum of the values of its parts (his doctrine of organic unities), and he uses an isolation test to identify intrinsic value: ask whether a thing would be good if it existed entirely alone. He also treats the appreciation of beauty and the pleasures of friendship as among the highest intrinsic goods. Please explain the conceptual tension between these commitments. If the value of a part can be altered by the whole to which it belongs, how can isolating that part reveal its intrinsic value? Use the beauty and friendship cases to make the difficulty concrete—for instance, a beautiful object that no one ever appreciates versus one that is appreciated, or two strangers enjoying the same pleasures versus two friends whose enjoyment is mutual. Then assess whether the tension is merely methodological or reflects a deeper problem about Moore's conception of intrinsic value. Begin by brainstorming at least two readings of Moore's position, then develop the one you find most defensible and say what the other reading gets right.
