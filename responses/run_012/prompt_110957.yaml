answer: |-
  # Joint Statement of Adversarial Collaboration: Teleosemantics and Indicator Semantics

  **Date:** October 26, 2023
  **Subject:** Framework for Adjudicating the Naturalization of Mental Content

  ## I. Agreed Claims

  The undersigned representatives of the Teleosemantic (TS) and Indicator-Semantic (IS) camps affirm the following commitments as the basis for this collaboration. These claims delineate the shared explananda and reject formulations deemed ill-posed, without conceding the specific mechanisms proposed by either camp.

  1.  **Naturalistic Realism:** Mental content is a real phenomenon that must be explicable in terms consistent with the natural sciences, without appeal to non-physical properties or primitive intentionality.
  2.  **The Success Explanandum:** Any adequate theory must explain how mental states contribute to successful, goal-directed behavior in complex environments.
  3.  **The Error Explanandum:** Any adequate theory must provide non-arbitrary truth conditions that allow for the possibility of misrepresentation (error) distinct from mere behavioral failure or statistical rarity.
  4.  **Generality Constraint:** The account must be applicable to cognitive systems significantly unlike adult humans, including non-human animals and simple adaptive systems, without presupposing high-level linguistic capacities.
  5.  **Rejection of Skepticism:** We jointly reject eliminativist or skeptical positions that deny the existence of content or claim it is inherently mysterious; the task is reduction/explication, not dissolution.
  6.  **Rejection of Circular Normativity:** We jointly reject accounts that ground content in norms that themselves presuppose content (e.g., interpreting agents whose intentions are already assumed); the normativity must be derived from natural facts.

  ## II. Table of Disagreements

  The following table isolates the specific points of contention. The "Crux" is formulated neutrally. The "TS Position" and "IS Position" columns articulate the specific commitments of each camp regarding that crux.

  | Crux | Teleosemantic Position (TS) | Indicator-Semantic Position (IS) |
  | :--- | :--- | :--- |
  | **1. Historical Essentiality** | Selection history is constitutive of content. A state cannot have content without a history of selection for a specific function. | Selection history is incidental to content. A state has content if it stands in the appropriate causal-informational relation, regardless of history. |
  | **2. Error in Drift Cases** | In cases where a system retains its function but loses reliable correlation, responses to the new correlate constitute misrepresentation (functional failure). | In cases where a system retains its function but loses reliable correlation, responses to the new correlate constitute accurate representation (tracking the actual cause). |
  | **3. Explanatory Priority** | Teleological function is the primary explanatory primitive; informational relations are derivative of what the system is *supposed* to track. | Informational tracking is the primary explanatory primitive; teleological talk is a useful shorthand for stable causal relations, not an ontological ground. |

  ## III. Diagnostic Cases and Predictions

  For each crux above, we stipulate a diagnostic case or argument. Both camps agree to accept the empirical description of the case but record conflicting predictions regarding the ascription of content.

  ### Case 1: The Crystalline Oracle (Addresses Crux 1: Historical Essentiality)
  **Description:** A unique geological formation in a sterile environment creates vibration patterns that are perfectly isomorphic to the neural states of a specific species of frog. These vibrations reliably correlate with the presence of flies in the vicinity (100% accuracy over 10 years). However, the formation arose via random mineral deposition; it has no evolutionary history, no design history, and no selection for the purpose of tracking flies.
  **TS Prediction:** The Crystalline Oracle possesses **no representational content**. Despite the perfect correlation, it lacks a proper function derived from selection history. It is a mere causal mirror.
  **IS Prediction:** The Crystalline Oracle possesses **representational content**. The reliable causal-informational link is sufficient for content. It represents the presence of flies.

  ### Case 2: The Obsolete Alarm (Addresses Crux 2: Error in Drift Cases)
  **Description:** A species of ground squirrel possesses a neural state *N* selected over millennia to detect Predator *P* (a hawk). Due to rapid environmental change, *P* is extinct. However, a benign bird *B* now occupies the same niche and triggers state *N* with 100% reliability due to acoustic convergence. The squirrel flees upon tokening *N*.
  **TS Prediction:** When the squirrel flees due to *B*, it is **misrepresenting**. State *N* represents *P* (its proper function). Since *P* is absent, the state is false, and the flight behavior is based on an error, even if statistically reliable.
  **IS Prediction:** When the squirrel flees due to *B*, it is **accurately representing**. State *N* represents whatever it reliably covaries with (currently *B*). The state is true, and the flight is a response to a true indicator (even if the flight is biologically costly).

  ### Case 3: The Aligned Archer (Addresses Crux 3: Explanatory Priority)
  **Description:** Consider a standard perceptual system where selection history and current reliable correlation align perfectly (e.g., a human visual edge-detector). We ask which property explains the system's capacity to guide action.
  **TS Prediction:** The capacity to guide action is explained by the **normative standard** set by history. The system works *because* it is functioning as designed; correlation is merely the condition under which the design succeeds.
  **IS Prediction:** The capacity to guide action is explained by the **informational structure**. The system works *because* it carries information about the environment; history is merely the explanation for why the structure exists, not why it represents.

  ## IV. Verdict on Verbal vs. Substantive Disagreements

  Having reviewed the agreed claims, the table of disagreements, and the diagnostic cases, I offer the following verdict on the nature of the dispute.

  **1. Substantive Disagreements: Historical Essentiality and Error in Drift Cases**
  The disagreements outlined in Crux 1 and Crux 2 are **substantive**. They are not merely disputes about how to use the word "representation." They entail divergent ontological commitments and distinct empirical predictions regarding the truth-conditions of mental states in edge cases.
  *   **Why:** In the *Crystalline Oracle* case, TS denies the existence of a semantic property that IS affirms. This is not a difference in labeling; it is a difference in whether a specific natural relation (information) is sufficient for intentionality without a historical ground. In the *Obsolete Alarm* case, the camps disagree on the truth-value of the organism's state. If TS is correct, the organism is in error; if IS is correct, it is not. This affects how we model the system's "correctness conditions" in cognitive science. If we treat the state as erroneous (TS), we predict the system *ought* to be repaired or adjusted to ignore *B*. If we treat it as accurate (IS), we predict the system is working correctly and the environment is simply costly. These are different engineering and biological prescriptions.

  **2. Merely Verbal Disagreement: Explanatory Priority in Standard Cases**
  The disagreement outlined in Crux 3 is **merely verbal**. In cases where selection history and reliable correlation align (the vast majority of standard cognitive science contexts), both camps agree on the extension of the term "representation."
  *   **Why:** When history and information coincide, TS and IS identify the same states as having the same content. The dispute over whether "function" or "information" is the *primary* primitive is a dispute about theoretical bookkeeping and vocabulary preference, not about the world. Both camps can model the *Aligned Archer* successfully. TS describes it as "functioning properly," IS describes it as "tracking reliably." Since these descriptions co-vary perfectly in this domain, choosing one over the other is a pragmatic choice about which vocabulary integrates better with adjacent fields (evolutionary biology vs. information theory), not a factual claim about the system that could be proven false by observation.

  **Conclusion:** The collaboration should focus its empirical efforts on resolving the **substantive** disagreements (Crux 1 and 2) by seeking biological systems that approximate the *Crystalline Oracle* or *Obsolete Alarm* scenarios. The **verbal** disagreement (Crux 3) should be set aside as a matter of terminological convention, allowing researchers to use whichever framework offers greater heuristic value for the specific domain of inquiry without claiming ontological exclusivity in standard cases.
