prompt: |-
  Hey, I could use some comments on an essay I'm drafting. Context: my partner is a physicist and we've been arguing nonstop about whether the now is real, and I got sucked into Gödel's rotating-universe solution. I'm a philosophy MA student, not a physicist, so I'm mostly trying to get the philosophy right, but I'm definately stuck. Here are my notes / rough argument:

  1. Gödel's rotating universe is a solution to Einstein's field equations where the matter rotates and, if you travel far enough, you can loop back into your own past. There's no global time-slice; no fact of the matter about what's happening now everywhere. Gödel took this to support the idealistic view that time is not part of the objective world, only a feature of our experience.
  2. My claim: the rotating universe doesn't show time is unreal; it shows that *coordinate* or *global* time is unreal. *Chronometric* time—proper time along worldlines—is still real, and the existence of closed timelike curves actually presupposes some kind of temporal ordering along the curve. So Gödel's conclusion overreaches.
  3. But then I hit a problem: if there's no global time, what makes the A-series anything more than an indexical? And if the A-series is just indexical, isn't that already enough for the idealist? I try to distinguish *time is unreal* from *time is non-global/perspectival*. I think that distinction is doing real work, but I can't tell if it's a genuine distinction or just a verbal dodge.
  4. I also bring in the rotating universe as a model of time travel: the traveler's own proper time is well-defined, but the external when is not. Does that help or hurt the idea that time is real? I say it helps local time, hurts global time.
  5. I want to argue that Gödel's argument is best read as a *transcendental* argument: the possibility of a world without global time shows that our concept of time can't be the concept of a global order. But I'm not sure if that's Gödel or just me.

  Can you comment on accuracy (especially the physics: is there really no global time in the Gödel universe? does the CTC stuff presuppose a temporal ordering?), on whether the central distinction is interesting or just terminological, and on where the essay is weakest? Don't give me reading lists or citations; I can't look stuff up right now. Just tell me what's wrong and what to fix.

