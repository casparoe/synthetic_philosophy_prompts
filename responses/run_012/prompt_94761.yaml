  8.  **Final Polish:** Ensure tone is appropriate for a historiography seminar context (academic, precise, nuanced). Make sure the distinction between "should" (normative) and "can" (descriptive/psychological) regarding present interests is clear, as that's a key fault line.

      *(Self-Correction during drafting)*: Make sure I don't conflate "setting aside present interests" into one bucket. The prompt asks to consider "the historian can and should set aside present interests." I should split these because "should" is a norm (defensible), while "can" is a capability claim (much stronger/contested). This helps the gradient from trivial to strong.

      *Revised Plan for the "Present Interests" point:*
      1.  Normative: Historians *ought* to try to minimize anachronism/bias. (Defensible)
      2.  Descriptive/Psychological: Historians *can* successfully eliminate present concerns. (Strong/Contested)

      *Let's assemble the 6-7 items.*
      1.  Ontological Realism (Past exists).
      2.  Evidential Accountability (Answerable to sources).
      3.  Normative Neutrality (Should set aside interests).
      4.  Psychological Transparency (Can set aside interests).
      5.  Semantic Essentialism (*Eigentlich* = Essence).
      6.  Narrative Determinism (Sources dictate the story).
      7.  Epistemic Omniscience (God's-eye view).

