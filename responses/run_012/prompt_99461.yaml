answer: |-
  You are asking for a metrology of morality, but violence is not a natural kind like mass or length; it is a category laden with ethical choices about what counts as harm. The following spec treats each requirement as a constraint that breaks certain measurement tools, highlighting where the math forces a philosophical choice rather than resolving one.

  | requirement | the case or fact that forces it | what it rules out | negotiable or dealbreaker | which other requirement it collides with |
  | :--- | :--- | :--- | :--- | :--- |
  | **Intent Preservation** | The medicine point: a stabbing that kills in 1600 is survived in 2024 due to trauma care. | Metrics based solely on homicide mortality rates. | Dealbreaker | Outcome Sensitivity |
  | **Outcome Sensitivity** | A punch is not a drone strike; actual suffering matters, not just attempted harm. | Binary counts of assault incidents regardless of severity or result. | Dealbreaker | Intent Preservation |
  | **Temporal Consistency** | Definition drift: categories like "marital rape" or "child abuse" did not exist in past records. | Retroactively recoding historical data to match modern ethical categories. | Negotiable | Moral Completeness |
  | **Moral Completeness** | Structural stuff: harm from institutional neglect vs. interpersonal blows. | Restricting measurement to direct, interpersonal physical force only. | Negotiable | Temporal Consistency |
  | **Individual Risk Accuracy** | The denominator question: a person's safety is a probability, not a aggregate sum. | Reporting only absolute numbers of violent events without population normalization. | Dealbreaker | Aggregate Suffering Accuracy |
  | **Aggregate Suffering Accuracy** | Absolute numbers vs rates: total bodies matter even if individual risk falls. | Reporting only per-capita rates when population is growing rapidly. | Dealbreaker | Individual Risk Accuracy |

  There is no fact of the matter independent of the measure because "violence" is not a single physical variable but a cluster of distinct phenomena (intent, harm, structure) that do not move in lockstep. Asking if the world is less violent without specifying whether you mean "am I less likely to be killed" or "is less total suffering inflicted" is like asking if a car is faster without specifying whether you mean acceleration or top speed. The verdict depends entirely on which tragedy you prioritize counting.

  ```json
  {
    "most_demanding_requirement": "Intent Preservation kills the easiest data source (homicide rates) by forcing you to distinguish between a failed murder and a successful one.",
    "unsatisfiable_pairs": [
      "Intent Preservation vs Outcome Sensitivity",
      "Temporal Consistency vs Moral Completeness",
      "Individual Risk Accuracy vs Aggregate Suffering Accuracy"
    ],
    "one_line_verdict": "The world is less violent only if you decide that medical progress counts as moral progress."
  }
  ```
