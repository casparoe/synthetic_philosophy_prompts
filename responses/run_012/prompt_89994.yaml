answer: |-
  Simultaneity-relative presentism resolves the tension by treating existence as a frame-indexed relation rather than an absolute property, thereby validating the reality of the present without violating Special Relativity or collapsing into the block universe. The Rietdijk–Putnam argument and Penrose's Andromeda paradox rely on a hidden premise: that the relation "is real for" is transitive across different inertial frames. They argue that if event A is present for Observer 1, and Observer 1 is present for Observer 2, then event A must be real for Observer 2, eventually implying all events are equally real. Simultaneity-relative presentism blocks this inference by denying that existence is a monadic property an event possesses *simpliciter*; instead, existence is a dyadic relation between an event and a reference frame. There is no frame-independent fact of the matter about whether Caesar exists; he exists relative to a frame where his time is present, and does not exist relative to ours, so no transitive chain can be built to populate a global block.

  This indexed "now" is not merely a coordinate label masquerading as ontology, which is the primary eternalist objection. For the eternalist, saying "Event E exists at t" is equivalent to "Event E exists," because the block contains all t equally; existence is tenseless location. For the simultaneity-relative presentist, existence is tensed availability. The indexed now buys you a genuine ontological asymmetry between past and future that the block universe cannot replicate without reductionism. In the block, the future is just as fixed and existent as the past, rendering the passage of time a psychological illusion. In simultaneity-relative presentism, the future literally does not exist relative to the current frame, preserving contingency, open futures, and the phenomenological reality of change without requiring a God's-eye view of spacetime.

  The eternalist will dig in by arguing that relativizing existence is ontologically redundant: if you admit that event E has coordinates (x, y, z, t) in the manifold, you have already granted it being, and adding "relative to frame F" is just specifying where it is, not whether it is. They will claim that a reality that varies by frame is not a reality at all, but a description of perspective on a static whole. The counter is that this begs the question by assuming the manifold itself is the fundamental ontology. Simultaneity-relative presentism posits that the manifold is a map of possible relations, not a container of existing things; what exists is determined by the causal structure accessible to a worldline, not by the geometry of the whole. By refusing to reify the entire manifold into a single existing object, this view respects the physics of light cones while refusing to surrender the intuition that "what is happening" is metaphysically distinct from "what has happened."
