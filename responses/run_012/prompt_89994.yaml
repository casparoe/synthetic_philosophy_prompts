prompt: |-
  Ok so I need help arguing for a position in the presentism vs eternalism mess that isnt the usual "only the present exists" vs "the block universe is all there is" slugfest. The thesis I want defended: the whole debate is mis-framed as being about what exists, when the real question is whether the world has a privileged global "now" — and if you pry the existence question apart from the simultaneity question, you land on a view I'll call simultaneity-relative presentism: there is a fact of the matter about which events are happening now, that fact is indexed to a frame or a worldline rather than being absolute, and this is fully consistent with special relativity and does not quietly collapse into eternalism. Argue for that view. You'll have to deal head-on with the Rietdijk–Putnam argument (and Penrose's Andromeda version) that SR already forces a block, and with the objection that without a privileged foliation there's no "now" left for the presentist to be talking about — say what the indexed now actually buys you that a plain eternalist block cant already do, and where you expect the eternalist to still dig in. Lead with your bottom line in the first sentence, then give the reasoning, no preamble and dont restate the question.
