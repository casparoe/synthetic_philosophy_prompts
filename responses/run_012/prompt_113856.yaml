answer: |-
  ### Session Plan: The Levelling-Down Objection and the Priority View

  **Total Time:** 90 Minutes
  **Resources:** Whiteboard, markers.
  **Audience:** Mixed (Philosophy Graduates, Economist, GP, Teacher, Laypeople).

  ---

  ### I. Sequence of Components

  The session must follow this specific order. Deviating will cause the philosophical nuance to collapse into jargon or arithmetic.

  #### 1. The Intuition Pump (10 Minutes)
  *   **Activity:** Present a stark choice between two outcomes involving two people. Do not name theories yet.
  *   **Dependency:** Nothing. This is the anchor.
  *   **Risk if Skipped:** Without a shared concrete intuition, the laypeople will drown in abstract definitions, and the graduates will retreat into textual exegesis. You need a shared "gut feeling" to test the theories against.

  #### 2. Telic Egalitarianism and the Objection (25 Minutes)
  *   **Activity:** Formalize the intuition that "Equality is good." Define Telic Egalitarianism. Introduce the Levelling-Down scenario.
  *   **Dependency:** Requires the Intuition Pump to establish that people *do* care about equality.
  *   **Critical Condition (Objection vs. Puzzle):** Before stating the Levelling-Down Objection (LDO), you must establish the **"Person-Affecting Intuition"**: the claim that for one outcome to be *better* than another, it must be better *for someone*.
      *   *If skipped:* The LDO remains a puzzle about arithmetic (Equality score went up, Total score went down).
      *   *If established:* The LDO becomes a normative objection (How can it be better if it is not better for anyone?).
  *   **Misconception Management:** **Let surface** the idea that "Levelling Down is just waste." Allow the Economist or GP to argue that destroying resources is irrational. Dismantle this by stipulating a case where no resources are wasted (e.g., a natural disaster lowers the rich to the level of the poor). This forces the group to see the objection is about *value*, not efficiency.

  #### 3. The Tripartite Distinction (15 Minutes)
  *   **Activity:** Draw three columns on the whiteboard: (1) Equality of Outcomes (Telic), (2) Absolute Fare of the Worse Off (Priority), (3) Relations Between People (Relational/Deontic).
  *   **Dependency:** Requires the failure of Telic Egalitarianism (from Phase 2) to motivate the search for alternatives.
  *   **Placement Rationale:** This must come *after* the LDO but *before* the Prioritarian solution.
      *   *If drawn too early:* It is abstract jargon. Laypeople will tune out before they feel the problem.
      *   *If drawn too late:* The Prioritarian reply will sound like a semantic dodge ("I'm not an egalitarian, I'm a prioritarian") rather than a structural solution.
      *   *What goes wrong if skipped:* The group will conflate Prioritarianism with "soft" Egalitarianism. They will not see why Prioritarianism claims immunity to the LDO.

  #### 4. The Priority View and the Scale Vulnerability (30 Minutes)
  *   **Activity:** Define Prioritarianism (benefits to the worse off matter more). Show why it avoids LDO. Then, use the whiteboard to demonstrate the "Scale Problem" (the instructor's suspicion).
  *   **Dependency:** Requires the Tripartite Distinction to define the view's scope.
  *   **Critical Condition (Answer vs. Dodge):** For the Prioritarian reply to be heard as an *answer*, the group must accept that **absolute well-being levels are measurable and non-arbitrary**.
      *   *If skipped:* The Prioritarian claim ("I care about absolute levels, not comparisons") sounds like wordplay.
      *   *If established:* The group sees the view rests on a specific metaphysical claim about well-being.
  *   **Misconception Management:** **Head off** the idea that "Prioritarianism is just Utilitarianism with a concave transformation."
      *   *Why:* Utilitarianism is invariant to the zero-point of the scale; Prioritarianism is not. If they view it as mere Utilitarianism, they will not see the vulnerability you want them to find. You must establish Prioritarianism as distinct *before* you show how it can collapse back into Egalitarianism via scale shifts.

  #### 5. Conclusion and Comprehension Check (10 Minutes)
  *   **Activity:** Final question and boundary setting.
  *   **Dependency:** All previous phases.

  ---

  ### II. The Core Example

  **Do not use** the "Pure Levelling Down" case (everyone lowered to a common level).
  **Do not use** the "Lottery vs. Equal Division" case (ex ante/ex post).

  **Choose:** **The "Two-Person Transfer with a Movable Zero."**

  **The Setup:**
  Two people, Alice and Bob.
  *   **State 1:** Alice has 10 units of well-being. Bob has 100 units.
  *   **State 2:** Alice has 20 units. Bob has 90 units.
  *   **Constraint:** Total well-being is constant (110), but equality has increased.

  **Why this example?**
  1.  **Versus Pure Levelling Down:** The Pure Levelling Down case is too easy for the Prioritarian to dismiss ("I don't value equality"). It kills Telic Egalitarianism but lets Prioritarianism off the hook too cleanly. The Transfer Case forces a trade-off, which is where Prioritarianism does its work (weighting the gain to Alice higher than the loss to Bob).
  2.  **Versus Lottery:** The Lottery case introduces risk and procedure. This distracts from the core ontological question: *What is the structure of value?* You need a deterministic outcome case to isolate the aggregation function.
  3.  **For the Instructor's Goal:** This example allows you to use the whiteboard to draw the "Value Function." You can plot well-being on the X-axis and Moral Value on the Y-axis. You can show the concave curve. Crucially, you can then **erase the zero point** on the X-axis and shift it.
      *   If Zero is at 0: The gain from 10→20 is morally weightier than 90→100 (Prioritarianism).
      *   If Zero is shifted to -50: The gap between 10 and 100 looks different relative to the zero.
      *   If Zero is shifted to 1000: The curve flattens, and the view begins to look like Utilitarianism.
      *   If the scale is transformed logarithmically: The Prioritarian calculation becomes mathematically indistinguishable from an Egalitarian one.
      *   *This visual manipulation is how the group will "see the shape of the problem" without you lecturing them on your suspicion.*

  **What the Example Must Contain:**
  *   Specific, cardinal numbers (to allow whiteboard manipulation).
  *   A clear gain for the worse off and a clear loss for the better off.
  *   No mention of "desert" or "need" (keep it strictly about well-being levels).

  **What the Example Must Be Free Of:**
  *   **Risk/Uncertainty:** No coins or lotteries.
  *   **Third Parties:** Keep it to two people to minimize cognitive load.
  *   **Variable Populations:** Do not introduce new people.

  ---

  ### III. Misconceptions Management

  **1. Misconception: "The Levelling-Down Objection is just a complaint about waste/inefficiency."**
  *   **Source:** The Economist or pragmatic laypeople.
  *   **Strategy:** **Let this surface** in Phase 2.
  *   **Dismantling:** When they raise it, stipulate a version of the case where the "levelling down" happens via a natural event (e.g., a plague blinds the sighted to match the blind) where no "resource" is wasted, it is simply lost. Ask: "Is there *any* sense in which this is an improvement?" If they say no, the objection holds. If they say yes (equality is good), the LDO bites. This moves the debate from economics to value theory.

  **2. Misconception: "Prioritarianism is merely Utilitarianism with a concave transformation of utility built in and so adds nothing."**
  *   **Source:** The Philosopher graduates or the Economist.
  *   **Strategy:** **Head this off** at the start of Phase 4.
  *   **Reasoning:** While mathematically similar, philosophically they diverge on the *zero point*. Utilitarianism treats well-being scales as interval scales (zero is arbitrary). Prioritarianism treats them as ratio scales (zero is absolute). If you allow the group to conflate them early, they will assume the scale doesn't matter. You need them to believe the scale matters *before* you show them that the scale is unstable.
  *   **Action:** Explicitly state: "Prioritarianism requires us to know where 'zero well-being' is. Utilitarianism does not. Keep this distinction in mind."

  ---

  ### IV. Final Comprehension Question

  At the end of the session, ask this question:

  > **"If we cannot agree on where 'zero well-being' is—for example, whether death is zero or whether a life of agony is zero—can the Priority View tell us anything that the Egalitarian View does not?"**

  *   **What this tests:** It tests whether they understand that the Prioritarian immunity to the Levelling-Down Objection depends entirely on the solidity of the well-being scale. If the scale is arbitrary, the distinction between "weighting the person" (Priority) and "weighting the gap" (Equality) dissolves.
  *   **Success Indicator:** If they hesitate or say "No," they have understood the vulnerability. If they say "Yes, because intentions differ," they have missed the structural point.

  ---

  ### V. What to Refuse (Out of Order)

  **Topic:** **Variable Populations (The Non-Identity Problem / Repugnant Conclusion).**

  **Instruction:** You must explicitly rule this out of order at the start of Phase 4.

  **Script:** *"Someone may be wondering how this applies if we are choosing between bringing different people into existence. That is a profound problem, but for this ninety minutes, we must assume the population is fixed. If we introduce variable populations, the definition of 'worse off' changes entirely, and we will lose the thread of the scale argument. We are discussing how to treat existing people, not who to create."*

  **Reason:** Introducing variable populations shifts the debate from *aggregation functions* to *identity*. It gives the Prioritarian an easy escape route ("The worse off wouldn't exist otherwise") that bypasses the scale vulnerability you want the group to examine. It also overwhelms the laypeople.
