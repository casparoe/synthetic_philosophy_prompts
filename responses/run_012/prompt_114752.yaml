answer: |-
  ## Procedure for Object Identity Determination (OID-2024)

  **Purpose:** To determine whether two database records describe a single physical object (Merge) or two distinct physical objects (Keep Distinct).
  **Authority:** Advisory Committee on Collections Consolidation.
  **Time Limit:** 10 minutes per case.
  **Risk Profile:** High. Merges are irreversible. Distinct records can be linked later.
  **Philosophical Basis:** *Discernibility implies distinctness. Indiscernibility implies nothing.* When in doubt, preserve potential distinctness.

  ### The Decision Sequence

  **Step 1: The Unique Identifier Check**
  *   **Question:** Do the records share the same primary Accession Number (e.g., 1995.001.001)?
  *   **Action:**
      *   **YES:** Proceed to Step 2. (Shared numbers often indicate data entry duplication, but not always).
      *   **NO:** Proceed to Step 2. (Different numbers suggest distinct objects, but legacy errors occur).
  *   **Note:** Do not stop here. Legacy data is unreliable.

  **Step 2: The Intrinsic Difference Check**
  *   **Question:** Is there *any* discrepancy in material, dimensions, weight, condition, or markings recorded in the files? (e.g., one says "bronze," the other "bronze alloy"; one says "10cm," the other "10.2cm").
  *   **Action:**
      *   **YES (Difference Found):** **STOP. DECISION: DISTINCT.**
          *   *Reasoning:* If objects differ in properties, they cannot be the same object.
          *   *Task:* Link records as "Related Versions" or "Pairs." Do not merge.
      *   **NO (No Difference Found):** Proceed to Step 3.

  **Step 3: The Causal History Check**
  *   **Question:** Is there a discrepancy in provenance, acquisition date, donor, or storage location history? (e.g., one record says "Gift of Smith 1990," the other "Purchase 1992"; or one was stored in Vault A, the other in Vault B).
  *   **Action:**
      *   **YES (History Differs):** **STOP. DECISION: DISTINCT.**
          *   *Reasoning:* Objects with different histories are distinct, even if they look identical (e.g., a original and a forgery; a cast from 1990 and a cast from 2000).
      *   **NO (History Identical or Missing):** Proceed to Step 4.

  **Step 4: The Physical Plurality Check (The "Black's Spheres" Rule)**
  *   **Question:** Does the physical inventory (shelf tags, storage boxes, conservation logs) confirm the existence of more than one physical item corresponding to these records?
  *   **Action:**
      *   **YES (Two items exist in storage):** **STOP. DECISION: DISTINCT.**
          *   *Reasoning:* The museum stewards physical instances. Two physical things are two objects, even if qualitatively identical. Create two records. Link them as "Identical Counterparts."
      *   **NO (Only one item found):** Proceed to Step 5.
      *   **UNKNOWN (Cannot verify physical count in 10 mins):** Proceed to Step 5.

  **Step 5: The Indiscernibility Deadlock**
  *   **Context:** Records are identical. Physical count is unknown or ambiguous. No intrinsic or historical differences exist.
  *   **Question:** Is there positive evidence of a clerical error? (e.g., the same scan of a document attached to both, or a note saying "Entry duplicated by intern").
  *   **Action:**
      *   **YES (Evidence of Error):** **DECISION: MERGE.**
      *   **NO (No Evidence of Error):** **STOP. DECISION: ESCALATE TO REGISTRAR.**
          *   *Reasoning:* You have reached the limit of record-based inquiry. Merging risks deleting a real object. Keeping distinct risks data bloat. This is a policy decision, not a factual one.
          *   *Threshold:* If the combined insurance value is under $5,000, Cataloguer may decide **DISTINCT** (Priority: Preservation). If over $5,000, Registrar must decide.

  ---

  ### Application of Procedure: Three Cases

  #### Case 1: The Two Casts (Max Black's Spheres)
  *   **Data:** Two legacy records. Both describe "Unmarked Bronze Sphere, 10cm." Material, weight, and condition match perfectly. Provenance files burned; both list "Unknown."
  *   **Step 1:** Accession numbers differ (Legacy A vs. Legacy B). Continue.
  *   **Step 2:** No intrinsic differences. Continue.
  *   **Step 3:** No history differences. Continue.
  *   **Step 4:** Physical inventory check reveals two spheres sitting on Shelf 4, Box 2.
  *   **Step 4 Decision:** **DISTINCT.**
  *   **Work Shown:** The procedure halts at Step 4. The existence of two spatial locations in the present moment confirms physical plurality.
  *   **Outcome:** Two records maintained. Linked as "Counterparts."
  *   **Philosophical Note:** We do not claim to have *discovered* a metaphysical difference. We acknowledge a physical plurality. The procedure treats "occupying a different space on Shelf 4" as a valid discriminating property (spatial location), which is permissible under Step 2/4.

  #### Case 2: The Negative and the Print
  *   **Data:** One accession number (1985.050). Record describes "Photograph, Landscape." File contains a glass plate negative and a modern gelatin silver print struck from it. Museum administration prefers to keep them as one "Work" for loan eligibility.
  *   **Step 1:** Same Accession Number. Continue.
  *   **Step 2:** **Intrinsic Difference Found.** Record notes "Glass Plate" in conservation log and "Paper Print" in exhibition log. Dimensions differ slightly (plate vs. paper border).
  *   **Step 2 Decision:** **DISTINCT.**
  *   **Work Shown:** The procedure halts at Step 2. Material difference (glass vs. paper) is an intrinsic property difference.
  *   **Outcome:** Records must be split. New accession number generated for the print.
  *   **Unpopular Result:** The museum will not like this. They want to loan the "Image" as a single unit.
  *   **Why I am not adjusting:** To merge them is to lie about the physical reality. The negative and the print have different conservation needs, different insurance values, and different loan risks (glass breaks; paper fades). Administrative convenience cannot override ontological distinctness. If the museum needs to loan them together, they should use a "Virtual Collection" or "Loan Group" field, not a merged Object ID. Merging here corrupts the data for future generations who need to know which physical thing went where.

  #### Case 3: The Byte-Identical Digital Scans
  *   **Data:** Two files ingested from Vendor A and Vendor B. Both are TIFF scans of the same manuscript page. Checksums (MD5) are identical. Embedded metadata differs (Vendor A says "Scan Date 2020," Vendor B says "Scan Date 2021").
  *   **Step 1:** Digital Asset IDs differ. Continue.
  *   **Step 2:** **Intrinsic Difference Found.** Metadata fields differ. (In digital objects, metadata is an intrinsic property of the file object).
  *   **Step 2 Decision:** **DISTINCT.**
  *   **Work Shown:** Halts at Step 2. Even if the pixel data is identical, the file containers carry different historical data (provenance of the digitization event).
  *   **Outcome:** Two digital objects retained.
  *   **Note:** If the checksums *and* metadata were identical, this would proceed to Step 5 (Escalate), as it would be indistinguishable from a simple backup copy.

  ---

  ### The Line Between Fact and Stipulation

  You asked for a definite position on the Two Casts (Case 1). Here it is:

  **The Position:** When records are silent but physical inventory confirms plurality, the procedure dictates we treat them as **Distinct**. This is not a discovery of fact; it is a **stipulation of stewardship**.

  **The Argument:**
  1.  **Asymmetry of Error:** If we merge two real objects into one record, we have effectively erased one object from the institutional memory. It becomes "invisible" to insurance, loan, and conservation tracking. If we keep one object as two records, we create administrative bloat. The cost of erasure is infinitely higher than the cost of bloat.
  2.  **Museum Ontology:** A museum does not collect "types" (the concept of a sphere); it collects "tokens" (this specific sphere). In the token ontology, spatial separation is sufficient for distinctness. Even if the records do not capture *why* they are distinct (e.g., one was poured on Tuesday, one on Wednesday), the fact that they are *here* and *there* makes them two.
  3.  **The Limit of Records:** The procedure admits that when Step 5 is reached (no physical confirmation), we cannot know. That is why Step 5 escalates. But in Case 1, physical confirmation *was* found. Therefore, the decision rests on the physical world, not the paper record. The record serves the object, not vice versa.

  ### Limitations and Honest Accounting

  This procedure cannot solve the metaphysical problem of identity; it can only manage the risk of it. Here is where the procedure fails or disguises judgment as rule:

  1.  **The "Significant Difference" Trap (Step 2):**
      *   *The Problem:* The rule says "Any discrepancy." In practice, a cataloguer must decide if "10cm" vs "10.1cm" is a measurement error (same object) or a real difference (two objects).
      *   *The Disguise:* I have written this as a factual check, but it is a judgment call. A tired cataloguer might merge two distinct objects because they assume the measurement difference is a typo. The procedure cannot encode the threshold of "significant variance" without knowing the object class.

  2.  **The Hidden History (Step 3):**
      *   *The Problem:* Two objects may have identical records but distinct histories that are lost (e.g., the provenance files burned, as in Case 1).
      *   *The Limit:* If the physical inventory is also lost (e.g., objects in storage without tags), Step 4 fails. The procedure forces an Escalation (Step 5), but if the Registrar is also blind, the decision becomes a coin toss. The procedure admits it cannot retrieve lost facts.

  3.  **The Digital Abstraction (Case 3):**
      *   *The Problem:* In digital objects, "intrinsic properties" are unstable. Is the metadata part of the object or the container?
      *   *The Limit:* The procedure treats metadata as intrinsic to be safe. This may create "distinct" records for what is effectively the same visual information. This prioritizes archival rigor over user access, which may frustrate digital humanities researchers.

  4.  **The "Work" vs. "Object" Conflict (Case 2):**
      *   *The Problem:* As seen in the Negative/Print case, the procedure prioritizes physical distinctness over conceptual unity.
      *   *The Limit:* The procedure cannot accommodate the museum's desire to manage "Works" (the image) rather than "Objects" (the paper/glass). It forces the museum to build a separate layer of abstraction (linking records) rather than solving it at the identity level. This is the correct philosophical move, but it requires labor the museum may not want to fund.

  **Final Word:**
  This procedure is designed to be *conservative*. It assumes that if the records allow for the possibility of two objects, there are two objects. It sacrifices efficiency for accountability. It will create more records than necessary. It will frustrate loan officers who want simple lists. But it will ensure that we do not accidentally insure one object for the value of two, or loan the same physical thing to two museums simultaneously because we thought the records were duplicates. In the business of stewardship, false negatives (missing an object) are sins; false positives (creating an extra record) are merely errors.
