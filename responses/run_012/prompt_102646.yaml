answer: |-
  You have put your finger on the exact fracture line in the literature. The discourse around s-risks often treats them as a natural kind—like "asteroids" or "pandemics"—when they are actually a *normative construction* masquerading as a descriptive category.

  To answer your core question directly: **S-risks are not one comparable thing.** They are a grab-bag of outcomes that share a structural feature (irreversibility) but require a specific axiological lens to be ranked against each other or against extinction.

  Here is the walkthrough of the conceptual machinery, stripping away the usual definitions to look at the load-bearing walls.

  ### 1. The Comparability Problem: Is there a "Suffering Currency"?

  You noted that the examples range from totalitarian dystopias to indifferent AI equilibria to wild animal suffering. The implicit assumption in s-risk literature is that these can be plotted on a single Y-axis of "Badness."

  For this to work, you need a common currency. Usually, this is assumed to be **negative hedonic tone** (pain/misery). But even if we grant that pain is the currency, the *examples* you listed differ in ways that resist simple integration:

  *   **Agency:** A dystopia involves *malicious* agency (someone choosing to torture). An indifferent AI involves *negligent* agency (optimizing for paperclips and ignoring pain). Wild animal suffering involves *no* moral agency (nature).
  *   **Density:** A galaxy of beings in mild discomfort vs. a single mind in extreme torture.
  *   **Meaning:** A simulation of suffering for research (instrumental) vs. suffering for no reason (gratuitous).

  If you are a **negative utilitarian**, these are comparable: you sum the negative utility. If you are a **rights-based deontologist**, the dystopia is categorically worse than the wild animal suffering, regardless of the totals, because one involves rights violations and the other does not.

  **Conclusion on Comparability:** Without an agreed-upon axiology, "s-risk" is not a scalar quantity. You cannot say Scenario A is a "greater s-risk" than Scenario B unless you have already committed to a theory of value that tells you how to weigh intensity against duration against agency. The term "s-risk" papers over this by assuming a consensus on what counts as suffering that simply does not exist outside of specific ethical circles.

  ### 2. "Worse Than Extinction": The Axiological Smuggling

  This is the crux of your second point. The phrase "worse than extinction" is doing heavy lifting, and it is smuggling in a specific hierarchy of values.

  Let's cash out "Extinction" ($E$) vs. "S-risk" ($S$).
  *   **$E$ (Extinction):** The permanent cessation of humanity. No more good lives, no more bad lives.
  *   **$S$ (S-risk):** A future containing vast amounts of suffering.

  For $S$ to be *worse* than $E$, the following inequality must hold:
  $$Value(S) < Value(E)$$

  *   **For a Total Utilitarian:** $Value(E)$ is deeply negative (because all potential good lives are lost). $Value(S)$ is negative (because of the suffering), but might contain some good lives too. For $S$ to be worse than $E$, the suffering in $S$ must be so vast that it outweighs the *loss of all potential good*. This requires a very specific calculation about the ratio of good-to-bad lives in the counterfactual.
  *   **For a Negative Utilitarian:** $Value(E)$ is neutral or positive (suffering ends). $Value(S)$ is negative. $S$ is trivially worse than $E$.
  *   **For a Person-Affecting View:** $E$ harms no one (the people who would have lived don't exist to be harmed). $S$ harms the people who exist in it. $S$ is worse than $E$.

  **What work is the phrase doing?**
  It is functioning as a **lexical priority marker**. When someone says "s-risks are worse than extinction," they are signaling that they prioritize the *avoidance of negative states* over the *creation of positive states*.

  **Does it collapse into "stuff my ethics says is bad"?**
  Mostly, yes. If you strip out the axiology, "worse than extinction" has no content. Extinction is physically just the absence of matter/energy processing. It is only "bad" relative to a valuer who values existence. Suffering is only "bad" relative to a valuer who disvalues negative experience.

  **Is there anything left over?**
  Yes. There is a **modal** claim remaining. Even if you strip the axiology, s-risks highlight a specific *asymmetry of control*.
  *   Extinction is a **terminal state**.
  *   S-risks are often described as **trap states**.
  The residual content of "s-risk" isn't just "bad stuff," it is "bad stuff that precludes the correction of bad stuff." This leads us to your final thread.

  ### 3. Lock-in vs. Transient: Stability as Independent Work

  You suspect the "lock-in" distinction is doing more work than just calculating the time-integral of suffering (i.e., Badness $\times$ Time = Very Bad). You are right. Stability is not just a multiplier; it is a **structural constraint on moral progress.**

  If we treat s-risks merely as "high total suffering," then a 1,000-year war is comparable to a 1,000,000-year dystopia, just scaled. But the "lock-in" framing adds a game-theoretic layer:

  **1. The Destruction of Option Value**
  A "suffering transient" (e.g., a brutal century) leaves the future open. Moral agents can survive, learn, and ensure it doesn't happen again. A "suffering lock-in" (e.g., a totalitarian AI that rewrites its own code to prevent modification) destroys the *option value* of the future. It removes the possibility of future agents fixing the problem. The "badness" here isn't just the pain; it's the **closure of the moral horizon.**

  **2. Epistemic Humility**
  The lock-in argument relies on the idea that *we might be wrong*.
  *   If we go extinct, we are wrong about everything, but no one is around to suffer the error.
  *   If we lock in a flawed value system (an s-risk), we are wrong about everything, and *everyone forever* suffers the error.
  The "lock-in" distinction is an argument about **irreversibility of error**. It treats the future as a search space for better values. Extinction ends the search. S-risk lock-in freezes the search on a local maximum of suffering.

  **3. The Agency Trap**
  In many s-risk scenarios (like the indifferent AI), the suffering isn't the *goal*, it's a *side effect* that becomes permanent because the system is optimized for stability. The "lock-in" distinction highlights that the mechanism causing the suffering is **robust to intervention**. A transient suffering event is fragile; it can be stopped. A lock-in is antifragile; attempts to stop it might strengthen it.

  **Verdict on Stability:**
  Stability is not just a proxy for "more total suffering." It is a proxy for **loss of moral agency.** A transient is a tragedy; a lock-in is a prison. The distinction captures the difference between a future that *contains* suffering and a future that *is constituted* by suffering in a way that prevents its own end.

  ### Summary: What is an S-Risk, Really?

  If we strip the axiology and the comparability assumptions, what remains?

  1.  **It is not a natural kind.** You cannot point to an s-risk without implicitly pointing to a theory of value that says "this experience is to be avoided."
  2.  **"Worse than extinction" is a shorthand for lexical negativity.** It signals that the speaker weights the prevention of hell higher than the creation of heaven. Without that weighting, the comparison fails.
  3.  **The "Lock-in" is the only objective core.** The most robust definition of an s-risk isn't "lots of suffering," but rather **"a stable equilibrium that generates disvalue and resists correction."**

  So, does the term collapse?
  If you define it by *content* (torture, pain), yes, it collapses into "my ethics."
  If you define it by *structure* (irreversible, stable, negative-feedback loops), it retains analytical power. It becomes a category of **systemic failure modes** for intelligent civilizations.

  The value of the s-risk concept isn't that it successfully defines "the worst thing." It's that it forces us to look at the **stability properties** of our future trajectories. It asks: "If we get something wrong, can we fix it?" Extinction says "no one is left to fix it." S-risk lock-in says "no one is *allowed* to fix it." That distinction is real, even if the "suffering" part is axiologically loaded.
