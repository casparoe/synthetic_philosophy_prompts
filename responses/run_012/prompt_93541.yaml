answer: |-
  Dear Colleague, here is the draft material for your final exam question along with the model answer and marking scheme you requested, all written out in continuous prose without any structural formatting to comply with your constraints.

  Here is the exam question text. Consider a game where a fair coin is tossed repeatedly until it first lands heads. Let N denote the toss number of this first head. The payoff is defined as negative one to the power of N minus one, multiplied by two to the power of N, divided by N dollars. This means the payoff is positive when N is odd and negative when N is even. Your task is to determine whether this game has a well-defined expected value. You must explain why the obvious computation yields a tidy finite number and why that number may be an artifact of how the outcomes are ordered or truncated. You must also state what a risk-neutral expected-utility maximizer should conclude, specifically addressing whether such an agent would pay a small positive fee to play and whether an agent can even be said to have well-defined preferences over a game like this. You are required to confront the natural objection that the sample space already fixes an ordering by the integer N, so the tidy finite number really is the expected value, and you must take a stand on this rather than merely surveying the options. Finally, distinguish this game from the standard St. Petersburg game, since students tend to blur the two.

  Here is the model answer. The expected value is calculated by summing the product of each outcome probability and its payoff. The probability that the first head occurs on toss N is one over two to the N. The payoff is negative one to the N minus one times two to the N over N. Multiplying these terms cancels the powers of two, leaving negative one to the N minus one divided by N. Summing this from N equals one to infinity yields the series one minus one half plus one third minus one fourth and so on. This is the alternating harmonic series, which converges to the natural log of two. This tidy finite number suggests a positive expected value, implying a risk-neutral agent should pay any fee less than this amount to play. However, this conclusion relies on the specific ordering of terms given by the natural numbers. In rigorous probability theory, the expected value of a random variable is defined as the Lebesgue integral of the variable with respect to the probability measure. For this integral to be well-defined, the variable must be absolutely integrable, meaning the expected value of the absolute payoff must be finite. In this game, the sum of the absolute values of the terms is the standard harmonic series, which diverges to infinity. Because the series is conditionally convergent rather than absolutely convergent, the Riemann rearrangement theorem applies. This theorem states that the terms of a conditionally convergent series can be rearranged to sum to any real number or to diverge. While the sample space imposes a natural ordering by time of toss, the expected value should represent an intrinsic property of the gamble independent of summation order. If the value changes based on how we group or order the outcomes, it fails to function as a stable guide for decision making. This distinguishes the game from the standard St. Petersburg paradox, where the terms are all positive and the sum diverges to positive infinity. In the St. Petersburg case, the expected value is infinite, whereas here it is undefined due to oscillation and order dependence. A risk-neutral maximizer requires a unique number to compare against a sure fee. Since no unique number exists that is robust to rearrangement, the agent cannot strictly prefer playing the game over paying a fee, nor prefer paying the fee over playing, based on expected value alone. The objection that the natural ordering fixes the value misses the point that expectation is a measure-theoretic concept requiring absolute convergence to ensure stability. Therefore, the correct stand is that the expected value is undefined. Consequently, a rational agent should not commit to paying a positive fee based on expected value calculations, as the valuation is mathematically unstable. The agent lacks well-defined preferences over this gamble relative to sure sums because the foundational metric for comparison does not exist in a robust sense.

  Here is the marking scheme out of twenty points. Five marks are awarded for correctly deriving the alternating harmonic series and identifying the sum as the natural log of two. Students who fail to show the cancellation of the powers of two or who miscalculate the series terms lose marks here. Five marks are allocated for identifying the lack of absolute convergence and explaining the significance of the Riemann rearrangement theorem. Students who claim the expected value is infinite or who fail to distinguish between conditional and absolute convergence lose significant marks in this section. Five marks are given for distinguishing the game from the standard St. Petersburg game, specifically noting that St. Petersburg diverges to infinity while this game is undefined due to conditional convergence. Confusing the two results in a loss of these marks. The final five marks depend on the decision theoretic conclusion and the stand taken. Full marks require the student to argue that the expected value is undefined and that a risk-neutral agent cannot justify paying a fee based on expected utility. Students who argue that the natural ordering fixes the expected value at the natural log of two without addressing the measure theoretic requirement for absolute integrability will lose marks for failing to take the rigorous stand required by the question. Errors such as claiming the game is favorable because the sum is positive, or claiming the expected value is zero due to symmetry, result in heavy penalties across the relevant categories. Partial credit is available for students who identify the instability of the sum but fail to connect it to the decision theoretic implications regarding preferences.

  I hope this material serves your seminar well and provides the rigorous test of decision theoretic understanding you are looking for. Please let me know if you need any adjustments to the difficulty or the specific focus of the grading criteria.
