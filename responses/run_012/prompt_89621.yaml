  Good evening. Neighbors, friends, family of Nell Rennie, and welcome back to this building. For two years it was dust and scaffolding. Today it is yours again. Nell's will was clear: no ticket booths, no barriers. She trained as a painter but spent forty years conducting the choir. She knew that art was not an object to be owned, but a thing to be done together. In a village built on coal, where work was shared and danger was shared, she understood that isolation was the real enemy. She left us this space not to display treasures, but to facilitate a meeting.

  We often think art is about making beautiful things. But there is a stricter view, one that fits this village better. Art is not about pleasure. It is the transmission of feeling from one person to another. When it works, you do not just see a thing; you feel what the maker felt. It is an infection. If you remain untouched, the art has failed its task. For this to happen, three things are needed. The feeling must be individual, specific to the maker. It must be clear, so it can be recognized. And it must be sincere. If the maker is pretending, the infection dies. This is not a theory for galleries. It is a test for life. It demands that we ask not "is this pretty?" but "is this true?"

  Look at the new commission upstairs. It is a long, slow video. I know many of you find it baffling. I know the curator loves it. Under this strict definition, we have to admit a difficulty. If the feeling does not pass from the screen to you, the chain is broken. For many here, tonight, it has not landed. The clarity is missing for you. But we must look at the sincerity. The artist is not trying to decorate the wall. They are trying to share a specific experience of time and light. It is individual. It is clear to them. The infection is incomplete, but the attempt is honest.

  There is a demand in this philosophy that good art must be accessible to everyone, not just the educated. This installation fails that test tonight. Tolstoy insisted that if the common person cannot understand the work, the fault lies with the art, not the person. I cannot claim this video meets that standard yet. But I can claim that this building is where we work to bridge that gap. Why should public money support an attempt that leaves so many cold? Because the alternative is no attempt at all. If we only fund what everyone already understands, we stop the flow of feeling before it starts. We support the capacity for connection, even when the language is new. We owe it to the artist to let them speak, and we owe it to ourselves to listen until the feeling catches. This is the case for public support: not to guarantee pleasure, but to guarantee the possibility of transmission. If we close the door on difficult work, we starve the village of new feelings. We must allow the artist the risk of failure, because without that risk, there is no sincerity.

  But there is another side to this room. Nell abandoned painting for the choir. Why? Because singing together generates a feeling that no single maker can transmit alone. Here, the feeling is not passed from one to many; it is built by all. This challenges the idea of a single sender. Yet, the result is the same: union. Tolstoy warned against sentimental art that merely mimics emotion to flatter us. The choir risks this. It risks being comfortable. But Nell's sincerity guards against it. She did not sing for applause. She sang to bind this village together. That is the moral test of art: does it unite us in brotherhood? When you sing, you are not separate audiences. You are a single body breathing.

  So we have a tension. The video moves the few and baffles the many. The choir moves the many and might seem simple to the few. One risks isolation, the other risks sentiment. We need both. We need the difficult work that stretches our capacity to feel, and we need the shared work that reminds us we are neighbors. This centre is not a temple for the enlightened. It is a workshop for infection. Come in. Stand before the work that confuses you. Stand beside the neighbor you haven't spoken to. Test the sincerity. See if the feeling passes.

  We are done speaking. Now we listen. The choir will sing. They are not here to entertain you. They are here to see if we can feel the same thing, at the same time. Please welcome them.

  **Note to Director:**
  The speech deliberately leaves unresolved the tension between Tolstoy's requirement for a single maker transmitting feeling and the choir's collective generation of emotion. Tolstoy's model is strictly author-to-audience, whereas the choir creates feeling *among* the participants. Resolving this would require either misrepresenting Tolstoy or undermining the choir's unique value. Leaving it open honors the complexity of community art while maintaining theoretical honesty for the professor.

  Summary: The address asks the audience to accept that art's value lies in the sincere attempt to transmit feeling and unite people, even when the infection is incomplete or the method challenges traditional authorship.
