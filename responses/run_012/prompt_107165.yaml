prompt: |-
  Next month I present a paper at a small workshop on distributive justice, and I need a Q&A prep sheet. My thesis: the standard reply to the leveling-down objection — that prioritarianism ranks distributions by a concave transform of individuals' absolute levels and therefore never claims a world in which everyone is worse off and no one is better off is itself better — succeeds only by quietly giving up the idea that prioritarianism is a theory about the goodness of outcomes. I argue that once the view is relocated from axiology into the theory of choice (what I call the relocation move), the leveling-down objection mutates into a harder one: the view can no longer explain why the worse off warrant priority without covertly appealing to inequality, the very thing the reply was supposed to expunge. The audience is mixed. Most are welfare economists and social-choice theorists who care about axiomatic properties — Pareto, anonymity, separability, continuity — and will go after the formal machinery; several are egalitarian political philosophers who hold that equality is intrinsically valuable and will go after the moral story. Give me the objections I will actually get from these two camps, ordered by how much damage they do, each phrased in that camp's own vocabulary, with a two-minute reply and a note on where the reply is soft. Tell me what I should concede up front, and include the one question I am hoping nobody asks. Skip the stock objections from the literature unless this audience would actually raise them.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Distributive Justice, specifically Prioritarianism vs. the Leveling-Down Objection (LDO).
      *   **Thesis:** The standard defense of prioritarianism against LDO (using concave transformations of absolute levels) works only by abandoning outcome axiology. Moving the view to "theory of choice" (the "relocation move") makes LDO mutate into a harder problem: explaining priority without covertly appealing to inequality.
      *   **Audience:** Mixed.
          *   Group A: Welfare economists/social-choice theorists (care about axioms: Pareto, anonymity, separability, continuity).
          *   Group B: Egalitarian political philosophers (care about intrinsic value of equality, moral story).
      *   **Deliverables:**
          *   Objections from both camps (ordered by damage potential).
          *   Phrased in each camp's vocabulary.
          *   Two-minute reply for each.
          *   Note on where the reply is soft.
          *   What to concede up front.
          *   The "one question I am hoping nobody asks."
          *   Constraint: Skip stock objections unless this specific audience would raise them.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Core Claim:* Prioritarianism avoids LDO by focusing on absolute levels (concave transform), but this abandons axiology.
      *   *Core Claim:* Relocating to "theory of choice" exposes a dependency on inequality to justify priority.
      *   *Vulnerability 1 (Economists):* If you move to choice theory, are you violating Pareto? If priority depends on inequality, is it just disguised egalitarianism? Is the "relocation move" formally coherent?
      *   *Vulnerability 2 (Philosophers):* If prioritarianism covertly appeals to inequality, isn't that just a feature, not a bug? Why is it a problem to admit relational concerns? Is the distinction between axiology and choice tenable?

  3.  **Drafting Objections (Iterative Process):**

      *   *Economist Camp:*
          *   *Idea 1:* You're violating Strong Pareto. If you prioritize the worse off, you might reject a Pareto improvement.
          *   *Idea 2:* Separability. Prioritarianism is usually separable. If you rely on inequality (relational), you break separability.
          *   *Idea 3:* Measurement. How do you measure the "choice" function without a utility function?
          *   *Selection:* The Separability/Relational tension is the strongest. If the user argues priority *needs* inequality, that implies the value of a benefit depends on others' levels. That breaks Separability (a key prioritarian selling point).
          *   *Vocab:* Separability, Independence of Irrelevant Alternatives (IIA), Social Welfare Function (SWF).

      *   *Philosopher Camp:*
          *   *Idea 1:* Why is it bad to care about inequality? Temkin says we should.
          *   *Idea 2:* Is the axiology/choice distinction real?
          *   *Idea 3:* You're attacking a strawman. Prioritarians admit they care about absolute levels.
          *   *Selection:* The "Why is covert inequality bad?" objection is strongest. If the theory *needs* inequality to work, maybe it's just a hybrid view. Also, the Axiology vs. Choice distinction is metaphysically shaky.
          *   *Vocab:* Intrinsic vs. Instrumental value, Relational properties, Telic vs. Deontic.

      *   *Ordering by Damage:*
          1.  Economist: The Separability Objection (Formal inconsistency).
          2.  Philosopher: The "So What?" Objection (Why hide the inequality?).
          3.  Economist: The Pareto Objection (Normative cost).
          4.  Philosopher: The Axiology/Choice Distinction (Metaphysical coherence).

  4.  **Drafting Replies & Identifying Soft Spots:**
      *   *Reply Strategy:* Acknowledge the tension, argue that the "covert" nature is the problem for *prioritarian* self-conception, not necessarily for justice per se.
      *   *Soft Spot:* Usually where the argument relies on a definition that the opponent can easily shift.

  5.  **Concessions:**
      *   Need to show intellectual honesty. Concede that prioritarianism *works* practically, just not under the described theoretical architecture. Concede that the "relocation move" is costly.

  6.  **The Dreaded Question:**
      *   What kills this thesis? Probably the idea that the "relocation move" is unnecessary. Or that the standard view *is* a theory of choice already. Or, more damning: "If prioritarianism collapses into egalitarianism under your analysis, why isn't that a victory for egalitarianism rather than a refutation of prioritarianism?"
      *   *Better Dreaded Question:* "Is your 'relocation move' just a description of Rule Prioritarianism vs. Act Prioritarianism? If so, you haven't found a new problem, you've just redescribed an old distinction."
      *   *Even Better:* "If the justification for priority *must* reference inequality, doesn't that just prove the Egalitarian was right all along, making your critique of Prioritarianism irrelevant to the broader normative question?" (i.e., You win the battle, lose the war).
      *   *Best:* "You claim the view relocates to choice theory. But choice theory requires an objective function. If that function isn't axiological goodness, what is it? If it's 'right-making features,' haven't you just reinvented deontic egalitarianism?"

  7.  **Refining and Polishing (incorporating specific constraints):**
      *   *Tone:* Professional, academic, sharp.
      *   *Vocab Check:* Ensure economists hear "SWF," "Separability," "Pareto." Ensure philosophers hear "Telic," "Relational," "Intrinsic."
      *   *Time Check:* Replies need to be readable in 2 minutes (approx. 250-300 words spoken, but written can be denser. I'll aim for concise paragraphs).

  8.  **Final Review against Thesis:**
      *   Does this support the user's specific claim about the "relocation move"? Yes.
      *   Does it address the "covert appeal to inequality"? Yes.

      *(Self-Correction during drafting)*: Make sure I don't give the user a reply that is *too* strong. The prompt asks for "where the reply is soft." I need to be honest about the weaknesses.

      *(Refining the Dreaded Question)*: The most dangerous question is one that undermines the *motivation* for the paper. If the audience thinks "So what? Prioritarianism is a tool, not a religion," the paper loses stakes. The question should be: "Why does it matter if the justification is covert, provided the output is the same?"

      *(Wait, let's look closer at the thesis)*: The thesis is that the *standard reply* to LDO forces a relocation. The dreaded question should challenge the necessity of that relocation. "Does the standard prioritarian actually claim to be doing pure axiology? Or have you imposed a requirement they never accepted?"

      *Let's go with:* "Isn't your 'relocation move' just an accusation of impure motives? If the math works, why do we care if the philosophical justification leans on inequality?" -> No, that's too dismissive.
      *Better:* "You argue priority requires inequality. But isn't the *weighting* function itself sufficient without comparing levels? If I give weight 1/x to utility x, do I need to know anyone else's x?" -> This attacks the core logical claim. This is the one.

  9.  **Final Polish:** Check formatting and instructions. (Ordered by damage, 2-min replies, soft spots, concessions, dreaded question).

      *(Final thought on ordering)*: The Economist Separability objection is technically the most damaging because it threatens formal coherence. The Philosopher "So What" is damaging to the *point* of the paper. I'll put the Formal Separability one first as it's the "hard" damage.

      *(Wait, one more check on the "Concede Up Front" section)*: Don't concede the main thesis. Concede a premise that makes the user look reasonable. Concede that Prioritarianism is *useful*.

      *(Let's write it.)*
answer: |-
  ### Q&A Prep Sheet: Prioritarianism, Leveling-Down, and the Relocation Move

  **Context:** Workshop on Distributive Justice.
  **Thesis:** The standard prioritarian reply to the Leveling-Down Objection (LDO) abandons outcome axiology. Relocating the view to choice theory reveals that priority cannot be justified without covertly appealing to inequality.

  ---

  ### Part 1: Concessions to Make Up Front
  *Do not wait to be cornered. Offer these in your opening remarks or the first answer to establish credibility.*

  1.  **Concede Practical Utility:** "I am not arguing that prioritarianism yields the wrong *policy recommendations*. In most real-world cases, it tracks our moral intuitions better than strict utilitarianism or strict egalitarianism."
  2.  **Concede the LDO Success:** "I grant that the standard concave-transform reply *does* successfully avoid the absurdity of leveling down. My target is not the mathematical fix, but the philosophical cost of that fix."
  3.  **Concede the Burden:** "If my argument holds, it doesn't necessarily kill prioritarianism; it forces it to admit it is a hybrid view (part absolute, part relational). That might be a feature, not a bug, but it must be acknowledged."

  ---

  ### Part 2: Objections & Replies (Ordered by Damage)

  #### 1. The Formal Incoherence Objection (Welfare Economists)
  **Vocabulary:** Separability, Independence of Irrelevant Alternatives (IIA), Social Welfare Function (SWF).
  **The Objection:** "You claim that relocating prioritarianism to choice theory forces an appeal to inequality. But if the priority weighting depends on the *relationship* between agents (who is worse off), you violate **Separability**. The value of a benefit to person *i* becomes dependent on person *j*'s utility. If you break Separability, you no longer have a Prioritarian SWF; you have a disguised Rank-Weighted Utilitarian or Gini function. Are you not simply proving that 'Prioritarianism' is an empty label for any non-Pareto-increasing egalitarian function?"

  **Two-Minute Reply:**
  "That is precisely the tension I want to highlight. The standard definition of Prioritarianism relies on a concave transformation of *absolute* levels to maintain Separability. This allows the theorist to say, 'I don't care about gaps, only levels.' However, when pressed on *why* the curve is concave (the justification for priority), the appeal to absolute levels runs out. We prioritize the worse off *because* they are worse off relative to others.
  My claim is not that the math breaks, but that the *interpretation* of the math shifts. If the justification for the weighting function requires relational data, the view is extensionally prioritarian but intensionally egalitarian. I am arguing that we cannot have the Separability of the SWF *and* the Moral Story of Priority without smuggling in the relational data at the justification stage. The formal machinery stays intact, but the philosophical foundation cracks."

  **Where the Reply is Soft:**
  You are relying on a distinction between the *structure* of the function and the *justification* for the function. A hardline economist will say, "We don't care about justification, only axioms. If the SWF is separable, the view is separable." You need to hold firm that normative theory requires more than functional output.

  #### 2. The "So What?" Objection (Egalitarian Philosophers)
  **Vocabulary:** Telic vs. Deontic, Intrinsic vs. Instrumental Value, Relational Properties.
  **The Objection:** "Suppose you are right. Suppose justifying priority requires a covert appeal to inequality. Why is this a problem? Temkin and others argue equality is intrinsically valuable. If Prioritarianism secretly relies on the badness of inequality to explain why we prioritize the worse off, hasn't it just converged with Pluralistic Egalitarianism? Why treat this as a refutation of Prioritarianism rather than a vindication of Egalitarianism?"

  **Two-Minute Reply:**
  "It matters because Prioritarianism was designed specifically to escape the objections leveled at Egalitarianism, particularly the LDO. The Prioritarian says, 'I can give priority to the worse off without claiming equality is good.'
  If my argument holds, the Prioritarian loses this distinctive advantage. They are forced to admit that the *reason* we care about absolute levels at the bottom is that the *gap* at the bottom is morally salient. This collapses the distinction between the two views. My goal isn't to vindicate Egalitarianism, but to show that the 'Third Way' promised by Prioritarianism is illusory. If the view relies on inequality to work, it inherits the LDO in a new form: we must now explain why we prioritize based on gaps without endorsing leveling down. The mutation of the objection I describe shows the problem hasn't been solved, just displaced."

  **Where the Reply is Soft:**
  Egalitarians might welcome this collapse. If they say, "Great, join our team," your critique loses its bite unless you can show that *their* view also fails. You must emphasize that this is a problem for the *Prioritarian's self-conception*, not necessarily for justice overall.

  #### 3. The Pareto Objection (Welfare Economists)
  **Vocabulary:** Strong Pareto, Dominance, Efficiency.
  **The Objection:** "If you relocate the view to choice theory and admit a dependency on inequality, do you violate **Strong Pareto**? If I make everyone better off, but the gap widens, does your 'choice-theoretic priority' recommend rejecting the move? If you reject a Pareto improvement to satisfy a priority rule based on inequality, you are no longer a Prioritarian; you are a Leximin egalitarian."

  **Two-Minute Reply:**
  "This is the crux of the 'mutated objection' I mention. Standard Prioritarianism respects Pareto because it looks only at absolute gains. If my argument is correct, and priority relies on relational status, then in edge cases where absolute gains widen inequalities significantly, the 'choice' justification might hesitate.
  However, I am not arguing the view *should* violate Pareto. I am arguing that to *explain* why we don't violate Pareto, the Prioritarian must appeal to the fact that absolute gains outweigh relational losses. But this requires a trade-off metric between absolute and relational value. Once you introduce that metric, you have admitted that relational value (inequality) is a variable in the equation. The view remains Pareto-compliant in practice, but only by balancing two competing values, one of which (equality) it claims to reject."

  **Where the Reply is Soft:**
  You risk conceding that the view *is* coherent as a hybrid. The economist will press: "If it satisfies Pareto, why do you care about the variables?" You must insist that theoretical clarity matters for application in non-standard cases (e.g., intergenerational justice).

  #### 4. The Axiology/Choice Distinction Objection (Philosophers)
  **Vocabulary:** Consequentialism, Maximization, Agent-Relative.
  **The Objection:** "You build your thesis on a 'relocation move' from axiology to choice theory. But isn't this a false dichotomy? For a consequentialist, the right choice *is* the one that maximizes the good outcome. If you separate the goodness of the outcome from the choice of action, aren't you abandoning Consequentialism entirely? You seem to be arguing that Prioritarianism is only coherent as a Deontic view."

  **Two-Minute Reply:**
  "I am not arguing they *should* relocate; I am arguing the standard reply to LDO *forces* them to. When a Prioritarian says, 'Leveling down is not better, but we should still prioritize the worse off,' they are decoupling the 'betterness' of the state from the 'rightness' of the action.
  If the state where everyone is worse off is not 'better,' but we still choose the distribution that helps the worse off, the weighting function is doing work in the *choice* mechanism that it is not doing in the *valuation* mechanism. I am highlighting this decoupling. Whether this makes the view Deontic is a further question, but it certainly shows it is not purely Telic Axiology. The 'goodness' of the outcome is no longer the sole driver of the choice."

  **Where the Reply is Soft:**
  This is metaphysically dense. If they press that "maximizing a concave function *is* axiology," you risk getting bogged down in semantics. Keep the focus on the *justification* for the function, not the function itself.

  ---

  ### Part 3: The Question You Hope Nobody Asks

  **The Question:**
  "You argue that the justification for priority covertly appeals to inequality. But if the *mathematical weighting function* (e.g., $w(u) = u^{0.5}$) operates solely on individual absolute utility, why does the *justification* matter for the classification of the theory? If the model doesn't *require* inputting other people's utility levels to calculate the weight for person *i*, haven't you proven the Prioritarian right? You seem to be demanding a psychological or metaphysical story that the formal model explicitly renders unnecessary."

  **Why this is dangerous:**
  This cuts the throat of your paper. It argues that your "relocation move" is an external imposition. If the formal model is separable (which it is), the theorist can say, "I don't care *why* the curve is concave, only that it is." This renders your claim that the view "covertly appeals to inequality" an accusation of bad faith rather than a structural flaw.

  **Prepared Defense (if asked):**
  "The classification of a normative theory depends on its *reasons*, not just its *outputs*. If I ask a Prioritarian, 'Why does the utility of the poor count more?' and they answer, 'Because they have less,' that is a relational claim. If they answer, 'Because of the diminishing moral value of utility,' that is an absolute claim. The latter is unintelligible without the former. We cannot separate the math from the moral story in distributive justice, because the math is chosen *to fit* the story. If the story fails, the math loses its normative anchor."
