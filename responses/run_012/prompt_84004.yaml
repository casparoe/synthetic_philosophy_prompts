answer: |-
  **Project Title:** The Inconsistent Demos: Normative Conflicts in Voting Expansion Reforms

  **Project Summary**
  Contemporary movements for democratic expansion typically advocate for a triad of reforms: compulsory voting, lowering the voting age, and enfranchising long-resident non-citizens. In public discourse and advocacy literature, these are treated as a coherent package, underpinned by a shared ethos of inclusion. This project challenges that assumption. I propose that these three reforms rely on conflicting normative principles regarding who constitutes a member of the *demos*. By mapping the justificatory arguments for each reform, this research will determine whether a single, consistent theory of democratic boundary-drawing can support all three, or whether the current coalition relies on an unstable borrowing of incompatible principles.

  **The Research Question**
  To ensure a determinate answer, the project addresses the following question:
  *Can the triad of voting expansion reforms (compulsory voting, youth suffrage, non-citizen suffrage) be consistently justified by a single principle of democratic inclusion, or does holding all three positions simultaneously require accepting contradictory definitions of political membership?*

  The answer will be binary: either a consistent framework exists (and I will identify it), or the positions are normatively incompatible (and I will map the specific contradictions).

  **Context and Gap in Existing Defences**
  Current defences of voting expansion are largely siloed or pragmatically coalitional.
  1.  **Compulsory Voting** is typically defended on grounds of equality and turnout, presupposing that the existing electorate is the correct boundary, but participation is insufficient.
  2.  **Youth Suffrage** is defended on grounds of coercion or capacity, often invoking the principle that those subject to the law must have a say.
  3.  **Non-Citizen Suffrage** is defended on grounds of residency and affected interests, often invoking the principle that those impacted by decisions must have a say.

  The gap lies in the theoretical interface. Advocates often treat the coalitions behind these reforms as interchangeable, assuming that a argument for one supports the others. However, the "all-subjected" principle (often used for youth) and the "all-affected" principle (often used for non-citizens) pull in opposite directions regarding boundary drawing. The former may exclude non-citizens who lack full legal standing; the latter may admit foreigners abroad while excluding those unaffected domestically. Existing literature leaves open whether these principles can be harmonized or if the current advocacy platform is theoretically incoherent.

  **Methodology: Conceptual Analysis over Empirical Survey**
  This project employs conceptual analysis rather than empirical political science. A survey of the empirical literature on turnout or demographic behaviour cannot answer the research question because the problem is normative, not causal. Data can tell us *what happens* when the voting age is lowered, but it cannot tell us *who ought to vote* or whether the justification for lowering the age contradicts the justification for enfranchising non-citizens.

  The method involves:
  1.  **Reconstruction:** Systematically reconstructing the primary normative arguments used in major advocacy campaigns and academic defences for each of the three reforms.
  2.  **Stress-Testing:** Applying the primary justification for Reform A (e.g., youth suffrage) to Reform B (e.g., non-citizen suffrage) to test for logical consistency.
  3.  **Principle Mapping:** Categorizing arguments under the two dominant boundary-drawing principles ("all-subjected" vs. "all-affected") to identify where advocates implicitly switch principles to suit the specific reform.

  This method is superior for this specific inquiry because it isolates the logical structure of the arguments. It treats the public discourse as a text to be decoded for theoretical commitments, which is the necessary precursor to any empirical testing of democratic health.

  **Expected Results and Failure Conditions**
  **Success:** The project will produce a typology of democratic inclusion that clarifies the trade-offs. A successful result will look like a diagnostic framework showing, for example, that one can consistently support compulsory voting and youth suffrage, but only by abandoning the specific principle used to justify non-citizen suffrage. It will provide a clear answer to whether the "expansionist" coalition is theoretically unified or a marriage of convenience.

  **Failure:** The project would fail if it concludes only that "context matters" or that the principles are "both useful." Vague pluralism is the status quo I am challenging. If I cannot demonstrate a specific logical tension or a specific path to consistency, the project has not met its burden of proof. Additionally, the project fails if the analysis remains too abstract to be useful for policy advocates; the output must clarify real-world political commitments.

  **Scope and Feasibility (Six Months, Part-Time)**
  This scope is designed for approximately 15 hours of work per week over 24 weeks.
  *   **Months 1-2:** Collection and reconstruction of arguments. I will limit the scope to the dominant arguments found in the last decade of advocacy literature and key theoretical texts, rather than attempting a comprehensive history of suffrage.
  *   **Months 3-4:** Conceptual stress-testing and mapping. This is the core analytical phase, focusing on the friction points between the three reforms.
  *   **Months 5-6:** Drafting the final paper and a shorter policy-facing brief.

  I will not conduct original empirical data collection or comparative case studies of specific countries, as this would exceed the time budget. The focus remains strictly on the normative consistency of the arguments themselves. As a journalist, I am equipped to synthesize complex theoretical debates into clear prose, ensuring the final output is rigorous enough for the institute but accessible enough to influence public discourse.
