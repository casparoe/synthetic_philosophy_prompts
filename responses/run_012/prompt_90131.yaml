  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Observation:** The user notices a dichotomy in their city's democratic practices: Citizens' Assemblies (random sample, deliberation, expert input) for "big constitutional stuff" vs. Referendums (simple majority, turnout-dependent) for "smaller stuff."
      *   **Core Question:** What does each practice presuppose about "the will of the people"?
