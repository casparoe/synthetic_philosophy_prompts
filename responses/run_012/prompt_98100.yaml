answer: |-
  Here is a specification of the desiderata for a coherent theory of penal substitution, analyzed through the philosophical constraints David Lewis highlights, followed by an evaluation of Lewis's own model and a rival.

  ### The Desiderata: Constraints that Bite

  To be adequate, a theory of penal substitution must satisfy the following conditions. They are categorized by the type of coherence they demand.

  **1. The Guilt Constraint (Conceptual Coherence)**
  *   **Requirement:** Punishment is conceptually tied to personal guilt. One cannot be punished for a crime one did not commit; one can only be penalized.
  *   **Status:** **Non-negotiable.** If the term "punishment" is used where "penalty" is meant, the theory commits a category error. If Christ is innocent (a theological necessity), what happens to him cannot be *retributive punishment* in the standard sense.
  *   **The Bite:** This forces the theory to redefine "punishment" or admit it is metaphorical.

  **2. The Transferability Constraint (Logical Coherence)**
  *   **Requirement:** The burden being borne must be logically transferable.
  *   **Status:** **Non-negotiable for Substitution.** Guilt is not transferable (I cannot be *guilty* of your murder). Debt is transferable (I can pay your fine). Suffering is transferable (I can endure pain on your behalf).
  *   **The Bite:** If the atonement requires the transfer of *guilt*, it fails. If it requires the transfer of *consequences*, it succeeds logically but risks losing moral weight.

  **3. The Justice Constraint (Moral Coherence)**
  *   **Requirement:** God's justice must be satisfied, not merely bypassed. Waiving the penalty without satisfaction implies moral indifference to evil.
  *   **Status:** **Non-negotiable for Penal Substitution.** This distinguishes PS from Simple Forgiveness.
  *   **The Bite:** The satisfaction must be equivalent to the demand. If the demand is "punish the sinner," satisfying it with "penalize the innocent" looks like injustice, not justice.

  **4. The Injustice Constraint (Divine Goodness)**
  *   **Requirement:** God cannot commit a moral evil. Punishing an innocent substitute is, by standard moral definitions, an injustice.
  *   **Status:** **Non-negotiable.** A theory that saves us by making God unjust is self-defeating.
  *   **The Bite:** This creates a direct conflict with the Justice Constraint unless the "punishment" is redefined or the innocence is qualified.

  **5. The Voluntariness Constraint (Agency)**
  *   **Requirement:** The substitute must voluntarily accept the burden.
  *   **Status:** **Non-negotiable.** Coerced substitution is victimization, not atonement.
  *   **The Bite:** This mitigates the Injustice Constraint but does not solve it. A volunteer can consent to be harmed, but a judge cannot justly inflict that harm based on another's consent.

  **6. The Retribution/Deterrence Constraint (Functional Efficacy)**
  *   **Requirement:** The penalty must serve the function of justice: either retribution (balancing the moral scales) or deterrence (upholding the law's authority).
  *   **Status:** **Camp Preference.** Retributive models demand the sinner's guilt be addressed. Deterrence models demand the law's threat be validated.
  *   **The Bite:** Retribution is hard to square with substitution. Deterrence is easier to square but risks making the cross a mere object lesson rather than a metaphysical necessity.

  **7. The Trinitarian Constraint (Metaphysical Coherence)**
  *   **Requirement:** If God is the Judge and God is the Substitute, the transaction is internal to the Divine nature.
  *   **Status:** **High Tension.** It risks making the atonement a charade (God punishing himself) or a fracture (the Father against the Son).
  *   **The Bite:** If the Judge and the Accused are ontologically one, is it punishment or self-discipline? If it is self-discipline, the "Justice" satisfied is not external legal justice but internal consistency.

  ---

  ### The Jointly Unsatisfiable Pairs (The "Impossible Triads")

  The theory fails if it cannot resolve these tensions. Most traditional accounts solve one by softening the other.

  **Pair A: The Guilt Constraint vs. The Transferability Constraint**
  *   **Conflict:** Punishment requires guilt (non-transferable). Substitution requires transferability.
  *   **Verdict:** **Jointly Unsatisfiable** under standard definitions. You cannot have *literal penal substitution*. You must either drop "penal" (move to Debt/Christus Victor) or drop "substitution" (move to Moral Influence). Lewis argues you must shift from "Punishment" to "Penalty."

  **Pair B: The Justice Constraint vs. The Injustice Constraint**
  *   **Conflict:** Justice requires the demand be met (sinner pays). Divine Goodness requires the innocent not be harmed. Substitution requires the innocent to pay.
  *   **Verdict:** **Jointly Unsatisfiable** unless the definition of "Justice" is altered from "retributive" to "satisfactory." If justice is satisfied by *payment* rather than *retribution*, the tension eases, but the "Penal" aspect weakens.

  **Pair C: The Retribution Constraint vs. The Trinitarian Constraint**
  *   **Conflict:** Retribution requires a distinction between Judge and Offender. Trinity implies identity.
  *   **Verdict:** **Tension.** If God punishes God, retribution collapses into self-sacrifice. This suggests the "Penal" element is anthropomorphic language for a Divine self-offering, not a legal transaction between two parties.

  ---

  ### Evaluation of Lewis's "Chance/Lottery" Model

  Lewis attempts to resolve **Pair A** (Guilt vs. Transferability) by引入 a deterrence model involving risk. He argues that laws impose penalties to deter, and deterrence works by imposing a *risk* of punishment. Risks are transferable (like insurance). Christ volunteers to take the "lottery ticket" of suffering that the law threatens.

  **Performance against Desiderata:**
  *   **Guilt Constraint:** **Passes.** Lewis admits Christ isn't "punished" in the retributive sense; he bears the "penalty" (the risk actualized). This preserves Christ's innocence.
  *   **Transferability:** **Passes.** Risks and liabilities are transferable.
  *   **Justice Constraint:** **Fails/Weakens.** A lottery does not satisfy retributive justice. It satisfies the *authority* of the law (deterrence), but it does not address the *moral guilt* of the sinner. The moral debt remains unbalanced; only the legal threat is upheld.
  *   **Injustice Constraint:** **Passes.** Since it is a volunteered risk/penalty and not retributive punishment of an innocent, it avoids the charge of judicial murder.
  *   **Retribution Constraint:** **Fails.** Lewis explicitly sacrifices retribution for deterrence. For those who believe sin demands retribution, not just law-upholding, this model is insufficient.

  **Verdict:** Lewis's model saves the logical coherence of substitution by sacrificing the moral depth of retribution. It explains how Christ can die *instead* of us without God being unjust, but it struggles to explain how Christ's death *cleanses* us rather than just sparing us.

  ### Evaluation of the Rival: The Pure Debt Model

  In this model, sin is a debt owed to God's honor/order. Christ pays the debt.

  **Performance against Desiderata:**
  *   **Transferability:** **Passes.** Debts are perfectly transferable.
  *   **Guilt Constraint:** **Passes.** It does not claim Christ is "guilty," only that he pays the "fine."
  *   **Justice Constraint:** **Passes.** The debt is satisfied; God's honor is upheld.
  *   **Injustice Constraint:** **Passes.** Paying another's debt is morally praiseworthy, not unjust.
  *   **Retribution Constraint:** **Fails.** Paying a debt is transactional, not retributive. It removes the personal moral weight of sin. It risks making salvation a commercial transaction rather than a moral restoration.
  *   **Pointlessness Constraint:** **Risk.** If God can accept a payment, why couldn't He just waive the debt? The Debt Model requires an external standard of honor God is bound to, which risks limiting God's sovereignty.

  **Verdict:** The Debt Model is logically smoother than Penal Substitution but morally thinner. It avoids the "God punishes innocent" problem entirely but struggles to explain why the payment *had* to be death/suffering rather than just a declaration of value. Lewis's model is an attempt to inject the "suffering/penalty" element back into the Debt Model without triggering the "injustice" alarm of the Penal Model.

  ### Summary of the Bind

  The desiderata show that **Literal Penal Substitution** (The sinner's punishment is literally inflicted on the substitute) is logically impossible due to the **Guilt Constraint**.

  Any viable theory must choose:
  1.  **Drop "Penal":** Move to Debt or Ransom (solves Logic, risks Moral Weight).
  2.  **Drop "Substitution":** Move to Moral Influence or Solidarity (solves Injustice, risks Objective Atonement).
  3.  **Redefine "Punishment":** Lewis's route. Make it a transferable Penalty/Risk (solves Logic and Injustice, risks Retributive Satisfaction).

  Lewis's contribution is showing that if you want to keep "Substitution" and "Divine Justice" without making God unjust, you must abandon the idea that Christ suffered *retributive punishment*. He suffered a *penal liability*. Whether that is enough to satisfy the demands of holiness is the remaining theological gap.
