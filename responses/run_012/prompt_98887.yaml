answer: |-
  **Knowledge in the Balance: A Defense of Pragmatic Encroachment via the Ada Case**

  The debate over the nature of knowledge attributions in high-stakes scenarios centers on a fundamental tension: is knowledge a purely intellectual relation between a subject and the truth, or is it a status partly constituted by the practical environment? Epistemic Contextualism and Subject-Sensitive Invariantism (SSI), often called Pragmatic Encroachment, offer rival explanations for why we hesitate to attribute knowledge when the cost of error is high. Contextualism locates the variability in the semantics of the word "knows," which shifts with the attributor's context. SSI locates the variability in the truth conditions of knowledge itself, which shift with the subject's practical stakes. To determine whether these are genuinely rival accounts or if one can absorb the other, we must test them against a case that disentangles the subject's stakes from the attributor's stakes.

  **The Case of Ada, Bea, and Cass**

  Consider Ada, a pharmacist. Her evidence is fixed across all scenarios: the medication label reads 10mg, but she has a faint, nagging memory of a recall notice regarding that batch. She does not call the manufacturer to check. We vary two variables: Ada's practical stakes ($S$) and the attributor's practical stakes ($A$).

  1.  **Subject Stakes ($S$):**
      *   $S_{Low}$: An error causes a minor stomach ache (inconvenience).
      *   $S_{High}$: An error kills a child (catastrophe).
  2.  **Attributor Stakes ($A$):**
      *   $A_{Low}$ (Bea): A colleague asking out of idle curiosity.
      *   $A_{High}$ (Cass): The child's parent, about to administer the dose.

  This yields four combinations of knowledge attribution ("Ada knows the dose is 10mg").

  **Theoretical Predictions**

  **Plain Invariantism** holds that knowledge depends only on truth, belief, and epistemic justification (evidence). Since Ada's evidence is fixed, Plain Invariantism predicts a constant truth value across all four combinations. If the evidence suffices, "Ada knows" is true everywhere; if not, false everywhere. This fails to capture the intuitive data: we are inclined to say Ada knows in $S_{Low}$ but deny it in $S_{High}$. Thus, Plain Invariantism is descriptively inadequate.

  **Epistemic Contextualism** argues that "knows" is indexical. The standard for knowledge is set by the *attributor's* context.
  *   When Bea ($A_{Low}$) speaks, the standard is low. She truthfully asserts "Ada knows" in both $S_{Low}$ and $S_{High}$.
  *   When Cass ($A_{High}$) speaks, the standard is high. She truthfully asserts "Ada does not know" in both $S_{Low}$ and $S_{High}$.
  *   *Prediction:* Truth value tracks $A$, ignores $S$.

  **Pragmatic Encroachment (SSI)** argues that "knows" is invariant in meaning, but the *threshold* for knowledge depends on the *subject's* stakes.
  *   When Ada is in $S_{Low}$, the threshold is low. Both Bea and Cass truthfully assert "Ada knows."
  *   When Ada is in $S_{High}$, the threshold is high. Both Bea and Cass truthfully assert "Ada does not know."
  *   *Prediction:* Truth value tracks $S$, ignores $A$.

  **The Nested Attribution Test**

  The rivalry sharpens when we examine nested attributions. Consider the high-stakes attributor, Cass. She is deciding whether to let Ada dispense the drug. Cass considers two sentences:
  1.  "Ada knows the dose."
  2.  "Ada knows that Bea knows the dose."

  In this scenario, Ada is High Stakes ($S_{High}$), Bea is Low Stakes ($S_{Low}$), and Cass is High Stakes ($A_{High}$).

  For **Contextualism**, the semantic standard is fixed by Cass's context ($A_{High}$). This standard applies to every occurrence of "knows" in her utterance.
  *   Sentence 1: Cass evaluates Ada by Cass's high standard. Ada's evidence (label + faint memory) is insufficient for high stakes. Result: **False**.
  *   Sentence 2: Cass evaluates the embedded clause "Bea knows" by Cass's high standard. Bea has the same weak evidence as Ada. Under Cass's high standard, Bea does not know. One cannot know a falsehood. Therefore, Ada cannot know that Bea knows. Result: **False**.
  *   Contextualism predicts the two sentences stand or fall together.

  For **SSI**, the standard is fixed by the subject of the knowledge claim.
  *   Sentence 1: The subject is Ada ($S_{High}$). The threshold is high. Ada's evidence is insufficient. Result: **False**.
  *   Sentence 2: The primary subject is Ada ($S_{High}$), but the content of her knowledge is the proposition *that Bea knows*. The truth of the embedded proposition "Bea knows" is determined by *Bea's* stakes ($S_{Low}$). In low stakes, Bea's evidence *is* sufficient. So, "Bea knows" is true. Ada, observing that Bea is merely curious and has the same data, can justifiably believe this true proposition. Result: **True**.
  *   SSI predicts the sentences come apart: Ada does not know, but she knows that Bea knows.

  This divergence aligns with our intuitions. It is plausible that Ada, paralyzed by the risk to the child, recognizes that her colleague Bea, who is merely gossiping, is in a position to claim knowledge. Ada's practical position degrades her own epistemic status without blinding her to the epistemic status of others in safer positions. Contextualism, by flattening the semantic standard to the attributor's context, cannot easily capture this distinction without ad-hoc assumptions about embedded context-shifting.

  **Verdict: Pragmatic Encroachment as the Superior Account**

  The nested test suggests that SSI is the more robust account. However, the prompt asks whether one account can be absorbed into the other. Contextualism attempts to absorb encroachment by treating the subject's stakes as part of the "conversational context." But this conflates the speaker's environment with the subject's environment, failing the nested test where the subject (Ada) and the embedded subject (Bea) have different stakes within the *same* speaker's (Cass) context.

  Conversely, SSI can absorb the contextualist data by treating attributor effects as pragmatic rather than semantic. When Cass ($A_{High}$) refuses to say "Ada knows" even in $S_{Low}$, SSI can explain this via the *Knowledge Norm of Assertion*: one should only assert $p$ if one knows $p$. If Cass is in a high-stakes situation, asserting "Ada knows" might imply that the dose is safe for Cass to use, which would be misleading even if Ada technically knows. Thus, attributor stakes affect *assertability*, not truth.

  Therefore, **Pragmatic Encroachment (SSI)** is the superior account. It explains the truth-conditional differences in the nested case (where Contextualism fails) and can explain away attributor effects via pragmatics (absorbing the Contextualist insight without semantic proliferation).

  **Objection and Defense**

  The strongest objection to SSI is the **Retraction Problem**. Suppose Ada is in $S_{Low}$ and asserts, "I know the dose." Later, the stakes rise to $S_{High}$ (the child arrives). Ada now says, "I was wrong; I didn't know."
  *   **Contextualist Objection:** Contextualism explains this smoothly. In the past, Ada's context was low, so her claim was true. Now, her context is high, so she retracts.
  *   **SSI Problem:** If SSI is true, knowledge is sensitive to stakes. When stakes rise, the truth conditions change. Did Ada lie initially? If knowledge is factive and stakes-sensitive, then when stakes rise, it seems Ada must admit her earlier claim was false. This makes knowledge unstable and suggests subjects are constantly speaking falsely as their environment changes, which seems harsh and counterintuitive.

  **Defense:**
  The SSI proponent must defend the stability of the subject's epistemic position relative to the time of utterance. The defense lies in the **action-guiding nature of knowledge**. Knowledge is the norm of practical reasoning. When Ada spoke in $S_{Low}$, her evidence was sufficient to warrant the action appropriate to $S_{Low}$ (dispensing the drug where error is minor). Her claim "I know" was a certification of her readiness to act *in that context*.

  When stakes rise, the *proposition* "Ada knows" evaluated from the new perspective is false, because Ada's evidence does not support the *new* required action (staking a child's life). However, Ada need not say "I lied." She should say, "I knew it *then*, but I don't know it *now*." SSI accommodates this by indexing the truth conditions to the subject's practical situation *at the time of the knowledge attribution*. The "Retraction" is not an admission of past error, but an acknowledgment of present incapacity.

  Contextualism fails here because it makes knowledge too dependent on the *attributor*. If Bea (Low) says "Ada knows" while Ada is High, Contextualism says this is true. But if Ada acts on this and the child dies, Bea's "true" attribution licensed a fatal action. SSI correctly identifies that Ada did not know, regardless of Bea's casual speech, because knowledge must be robust enough to guide the subject's own actions. The nested attribution test confirms that SSI captures the structural reality of epistemic positions better than Contextualism, and the Retraction Objection is defused by recognizing that knowledge claims are temporal certifications of practical adequacy. Thus, SSI absorbs the useful insights of Contextualism regarding linguistic variability while maintaining a metaphysically superior link between knowledge and rational action.
