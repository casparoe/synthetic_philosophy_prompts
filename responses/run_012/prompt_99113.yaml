      *   Ensure the "Self-Induced Incapacity" element is central.

  7.  **Final Review against Constraints:**
      *   Did I survey literature? No.
      *   Did I give reading suggestions? No.
      *   Did I take a definite position? Yes (Strawson's distinction breaks).
      *   Is there one concrete case? Yes (David and Claire).
      *   Did I address the "fused" attitude? Yes.

  8.  **Self-Correction during drafting:** I need to make sure I don't just say "Strawson is wrong." I need to explain *why* the taxonomy fails. It fails because it assumes the Objective Attitude is defined by the *absence* of the demand for goodwill. But in the fused case, the demand is present, but the *mode* of engagement is objective. The demand is: "You made yourself this way, so you will be managed this way." That is a moral demand delivered via objective means.

      *Wait, is that accurate to Strawson?* Strawson says the Objective Attitude involves seeing the other as unfit for the demand for goodwill. If I manage you *because* you violated the demand, am I really adopting the Objective Attitude?
      *Counter:* Yes, because I am no longer expecting *goodwill* from you in the moment. I am predicting your behavior and managing the risk. But the *reason* I am doing so is moral culpability. So the *stance* is objective (no expectation of reciprocal goodwill), but the *ground* is participant (you are to blame for this state).
      *Refinement:* The fusion is in the **motive** for the objectification. Usually, objectification is motivated by pity or safety (exemption). Here, it is motivated by indignation (responsibility).

      *Okay, let's lock that in.* The attitude is objectively structured (management, prediction) but participant-grounded (blame). Strawson treats the structure as definitive of the exemption. I argue the structure can be a vehicle for the blame.

