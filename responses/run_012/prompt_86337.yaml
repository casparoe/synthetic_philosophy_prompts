      *   *Key Moment:* The "Feeling" objection. Elias hates the idea that belief is a feeling. Mara uses it to explain the dissociation.
      *   *Key Moment:* The Third Person. Why is "He believes" fine? Because transparency doesn't apply.

  6.  **Final Polish:**
      *   Check constraints: "Omissive/Commissive," "Past/Third Person," "Self-deception," "Belief vs. Feeling," "Single vs. Two Systems."
      *   Ensure the Aldergrove details (coat, picnic, flat affect) are woven in naturally.
      *   Make sure the ending reflects the prompt's requirement: narrowed disagreement, honest about limitations.

  7.  **Final Review against Prompt:**
