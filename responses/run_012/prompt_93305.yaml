  ok so I've been lurking on rationalist blogs for way to long and I still can't get over the Pasadena game. You know the setup: fair coin, flip until heads, if heads first shows on the nth flip you get 2^n/n dollars but with alternating signs (plus for odd n, minus for even n). The expected value is the alternating harmonic series, which sums to ln 2 in the natural order, but since it's only conditionally convergent you can rearrange the terms to get any real number you want. So the expected value is undefined. Anyway, I want you to write a mock terms-of-service agreement / FAQ for a casino that offers the Pasadena game. The deadpan joke should be that because the expected value is undefined, the casino can claim whatever house edge it wants, and the fine print quietly takes positions on conditionally convergent series, the Riemann rearrangement theorem, whether the natural ordering of outcomes is privileged, and whether 'undefined expected value' means the casino doesn't have to pay you or you don't have to pay the casino. Around 700 words, numbered clauses, legalistic voice. Make it funny to someone who knows the paradox but still readable to someone who doesn't. No real quotes or citations needed. Maybe include a clause where the casino reserves the right to choose the ordering of outcomes for the purpose of computing the expected value. And a clause about what happens if you try to sue them for false advertising when they advertise a positive expected value. Oh and maybe a 'loyalty points' scheme that's also conditionally convergent. The casino's legal arguments should actually be mathematicly coherent -- they should exploit the conditional convergence and rearrangement for real, not just hand-wave. Have fun with it.
