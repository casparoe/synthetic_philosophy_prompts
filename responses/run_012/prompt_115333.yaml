answer: |-
  (1) Essay Question
  Using the granite vole case (thickened crown skin correlating with survival), evaluate the adaptationist vs. byproduct hypotheses. Distinguish three readings of the Gould–Lewontin critique: methodological, empirical, and explanatory. Which reading survives the 'trivial or self-undermining' objection? Differentiate a spandrel from a physical constraint and an exaptation. Explain why 'spandrel' is description-relative regarding trait decomposition. Does survival correlation refute the byproduct hypothesis? Does the critique alter criteria for satisfactory explanation? Justify what evidence distinguishes the hypotheses.

  (2) Model Answer
  To distinguish the adaptationist from the byproduct hypothesis in granite voles, researchers must demonstrate heritable variation in the patch independent of skull growth, show fitness costs if the patch is removed, and rule out genetic linkage. Crucially, the patch's correlation with survival does not refute the byproduct hypothesis; non-adaptive traits can hitchhike with selected traits or result from structural necessities that coincidentally aid survival. Utility is not origin. Mere correlation confirms neither history nor function. Without experimental manipulation or phylogenetic comparison, the adaptationist narrative remains unsupported. Specifically, researchers should compare populations on non-abrasive substrates; if the patch persists without abrasion, it suggests developmental constraint rather than local adaptation. Furthermore, knocking out the genes responsible for skin thickening should not impair survival if the patch is truly epiphenomenal to skull growth.

  The Gould–Lewontin critique offers three readings. First, as a methodological claim, it demands rigorous testing of adaptationist hypotheses rather than storytelling. Second, as an empirical claim, it asserts most traits are non-adaptive. Third, as an explanatory claim, it challenges the default priority assigned to selection over constraint. The 'trivial or self-undermining' objection argues that if adaptationism is merely a heuristic, the critique is trivial; if it denies selection's power, it is self-undermining. The explanatory reading survives best: it warns against assuming optimality without evidence, without denying selection's efficacy. It shifts the burden of proof. The empirical and methodological readings do not survive as strong critiques; the empirical claim is likely false (too strong), and the methodological claim is accepted practice now, leaving the explanatory shift as the enduring philosophical contribution. This reading avoids self-undermining because it accepts selection but rejects its primacy as a default assumption.

  A spandrel is a phenotypic feature arising as a necessary byproduct of selecting for another trait, distinct from a bare physical constraint (which limits possible forms regardless of selection) and an exaptation (a feature originally non-adaptive but later co-opted for function). In the vole, if the patch arises solely because skull thickening prevents fracture under stress, it is a constraint/byproduct. If skull thickening was selected for bite force, and the skin patch followed inevitably, the patch is a spandrel. If the patch later acquired a protective function, it becomes an exaptation.

  'Spandrel' is description-relative because trait individuation matters. If we define the trait as 'skull thickening,' it may be adaptive. If defined as 'associated skin callus,' it may be a byproduct. The same biological reality changes status based on how we carve the phenotype. Consequently, the critique changes what counts as a satisfying explanation: demonstrating current utility is insufficient. A satisfactory explanation requires reconstructing the historical sequence of selection and constraint, proving the trait was the target of selection, not merely a beneficial passenger. The adaptationist story is not false by default, but it is not the null hypothesis. Students must recognize that the critique invites pluralism, not the abandonment of selectionism. The vole case illustrates that survival advantage confirms function only after history is established. Without phylogenetic comparison or developmental genetics, the adaptationist narrative remains a 'just-so story.' The critique demands we ask why this trait exists, not just what it does. Regarding explanation, the critique insists that identifying a current benefit is merely identifying a potential exaptation, not proving adaptation. Therefore, a complete explanation must integrate developmental biology with evolutionary history, ensuring that the causal story matches the structural reality. Ignoring constraint leads to incomplete explanations.

  (3) Marking Scheme
  1. **Three Readings & Objection (4 marks):** Must identify methodological, empirical, explanatory readings and state explanatory survives.
     *Error:* Treating the critique as a denial of natural selection's validity.
  2. **Spandrel/Constraint/Exaptation (4 marks):** Must correctly distinguish byproduct of selection, physical limit, and co-option.
     *Error:* Conflating spandrels with bare physical constraints or current utility.
  3. **Description-Relativity (4 marks):** Must explain trait individuation affects spandrel status.
     *Error:* Claiming spandrel status is an intrinsic, fixed property of the feature.
  4. **Evidence/Survival Correlation (4 marks):** Must state correlation does not refute byproduct; cite independent variation/tests.
     *Error:* Assuming survival correlation proves adaptive origin or function.
  5. **Explanation Criteria (4 marks):** Must state utility is insufficient; history/constraint required.
     *Error:* Equating current utility with historical origin or adaptive function.
