answer: |-
  You have put your finger on the Frege-Geitch problem, the central challenge any expressivist must meet, but you mistake the nature of the shared element when you assume it must be a proposition to do logical work. The antecedent contributes exactly what the asserted premise contributes: the expression of a specific non-cognitive state, namely a plan-laden commitment to avoid asking your brother to lie. When I assert the second premise, I am outright expressing that commitment; when I embed that sentence in the antecedent of the conditional, I am not expressing it outright, but I am specifying the condition under which the conditional's own higher-order attitude applies. The conditional "If P then Q" expresses a state of mind that rules out holding the attitude expressed by P without holding the attitude expressed by Q. Validity is earned here not because truth is preserved across propositions, but because holding the attitudes expressed by the premises while lacking the attitude expressed by the conclusion constitutes a fundamental inconsistency in the agent's plan-laden state of mind. To accept the conditional is to forbid the combination of disapproving of lying while failing to condemn the plan to ask; to accept the minor premise is to disapprove of lying; thus, to deny the conclusion is to violate the very constraint imposed by the conditional. The content is shared because the semantic value of the sentence is constant—it always picks out that specific type of practical commitment—even if the grammatical context determines whether that commitment is being enacted or merely referenced as a condition, and this allows us to define logical validity as the impossibility of consistently holding the premise-attitudes without the conclusion-attitude without inflating our ontology with truth-conditional propositions.
