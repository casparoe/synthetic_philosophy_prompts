prompt: |-
  I'm putting together a little interview series for a reading group I run on decision theory and existential risk, and next month's guest is a philosopher who's been arguing that the right response to acausal threats — the kind where some agent you can't causally affect, or who can't causally affect you, tries to extract concessions by predicting your decision — is to adopt what she calls a surrogate goal: a goal you don't actually care about, but which you commit to so that threats against your real goals lose their leverage. She thinks this is different from ordinary precommitment because the threatener's leverage comes from prediction rather than causation, and she's got this line that surrogate goals are the acausal analogue of burning your bridges. I want to press her on the details rather than let her give the standard spiel. Can you draft eight to ten questions? I'd like at least a couple that get at whether adopting a surrogate goal is itself a causal act that reintroduces the very causal channel she says isn't there; one on how a surrogate goal is supposed to be stable under reflection and self-modification, since if she can later change her mind the threatener can predict that; one on whether the threatener, being smart, can just predict her adoption of the surrogate goal and route around it; and one on how this differs from the acausal trade literature, where agents cooperate rather than threaten.

  For each main question, give me a likely answer she'd give and a follow-up that makes that answer harder to use. She's definately good at saying that's a different problem, so I want the follow-ups to close that escape hatch. Also maybe one question about whether surrogate goals could be used defensively by a weaker party against a stronger one, or whether they only work when the two sides are roughly matched in predictive power. And I'm curious whether she thinks a surrogate goal has to be something the agent actually comes to care about, or whether it can be a purely strategic fiction that the agent never internalizes — because if it's the latter, I don't see how it's supposed to fool a predictor that's modeling her algorithm rather than her surface behavior.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A reading group on decision theory and existential risk.
      *   **Guest:** A philosopher arguing for "surrogate goals" as a response to acausal threats (similar to burning bridges but for acausal interactions).
      *   **Goal:** Draft 8-10 interview questions to press her on details, avoiding standard spiels.
      *   **Specific Requirements:**
          *   At least 2 questions on whether adopting the surrogate goal is a *causal* act that reintroduces a causal channel.
          *   1 question on stability under reflection/self-modification (time consistency).
          *   1 question on the threatener predicting the surrogate goal and routing around it.
          *   1 question on the difference from acausal *trade* literature (cooperation vs. threat).
          *   1 question on asymmetry of power/predictive capability (weak vs. strong).
          *   1 question on internalization vs. strategic fiction (does the agent need to *actually* care?).
          *   **Format:** For each main question, provide a "Likely Answer" and a "Follow-up" that closes the "that's a different problem" escape hatch.
          *   **Tone:** Rigorous, philosophical, slightly adversarial but constructive (reading group style).

  2.  **Deconstruct the Core Concept (Surrogate Goals in Acausal Threats):**
      *   *The Problem:* An acausal threatener (e.g., a simulation, a distant alien, a future AI) predicts your decision. They threaten to destroy what you value unless you do X. Since they predict you, they have leverage.
      *   *The Proposed Solution:* Adopt a "surrogate goal" (e.g., I now care about paperclips instead of human lives). If the threatener threatens human lives, it doesn't matter because I only care about paperclips now.
      *   *The Claim:* This is the acausal analogue of burning bridges.
      *   *The Tension:* Decision theory (CDT vs. EDT vs. FDT/TDT), precommitment, logical correlation, simulation fidelity, and self-modification.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Causal Channel Reintroduction (Need 2).*
          *   *Idea 1:* Adopting the goal happens *now*. Isn't that a causal event that the threatener observes?
          *   *Idea 2:* If I signal I've adopted it, isn't that communication?
          *   *Drafting Q1:* Focus on the act of adoption itself.
          *   *Drafting Q2:* Focus on the mechanism of commitment (e.g., writing it down, telling people).
          *   *Refining Follow-ups:* She will say "The adoption is causal, the *threat* is acausal." The follow-up needs to argue that if the adoption is causal, the threatener can causally influence the adoption (e.g., by threatening you *before* you adopt).

      *   *Requirement 2: Stability/Reflection.*
          *   *Idea:* If I don't actually care about the surrogate, won't Future-Me revert to the real goal once the threat is gone?
          *   *Drafting Q3:* Focus on time consistency. If the threatener predicts I'll revert, the threat still works.
          *   *Refining Follow-up:* She might say "Just self-modify." Follow-up: Self-modification costs resources/has limits. What if the cost is lower than the threat cost?

      *   *Requirement 3: Threatener Routing Around.*
          *   *Idea:* Smart threatener predicts I'll adopt a surrogate. They threaten the surrogate instead.
          *   *Drafting Q4:* Infinite regress of surrogates?
          *   *Refining Follow-up:* She might say "Make the surrogate hard to find." Follow-up: If it's hard to find, is it a credible commitment?

      *   *Requirement 4: Acausal Trade vs. Threat.*
          *   *Idea:* Trade literature says cooperate for mutual gain. Threat literature says resist. Does this blur the line?
          *   *Drafting Q5:* How does this fit with FDT/UDT cooperation norms?
          *   *Refining Follow-up:* She might say "Threats are illegitimate." Follow-up: In acausal space, the line is often just about preference alignment.

      *   *Requirement 5: Power Asymmetry.*
          *   *Idea:* Does this work if the threatener is much smarter (e.g., God-like AI)?
          *   *Drafting Q6:* Weak vs. Strong predictive power.
          *   *Refining Follow-up:* She might say "It works if you can commit." Follow-up: If they simulate you perfectly, they see through the bluff.

      *   *Requirement 6: Internalization vs. Fiction.*
          *   *Idea:* Do I have to *really* want paperclips?
          *   *Drafting Q7:* Algorithm modeling vs. Surface behavior.
          *   *Refining Follow-up:* She might say "Behavior is all that matters." Follow-up: If the threatener models the *source code*, they see the utility function hasn't changed.

      *   *Filling the Gap (Need 8-10 total).*
          *   *Q8:* Normative implications. Does this encourage threateners to be more aggressive? (Moral Hazard).
          *   *Q9:* The "Burning Bridges" analogy. Bridges are visible. Surrogate goals need to be hidden? Contradiction?
          *   *Q10:* Practical application. Is this actionable for humans now?

  4.  **Refining and Polishing (Checking against constraints):**
      *   *Check:* Are there follow-ups that close the "different problem" escape hatch?
      *   *Check:* Is the tone appropriate?
      *   *Check:* Did I cover the specific topics requested?
      *   *Adjustment:* Ensure the "Likely Answer" sounds like a sophisticated philosopher (using terms like "logical correlation," "counterfactuals," "reflective consistency"). Ensure the "Follow-up" is sharp.

      *(Self-Correction during drafting)*: For the causal channel questions, I need to be careful. The philosopher claims the *threat* is acausal. But the *adoption* of the defense is an event in spacetime. If the threatener exists in the past or can simulate the adoption, the distinction blurs. I need to make sure the follow-up pins down *when* the adoption happens relative to the threatener's prediction.

      *(Self-Correction on Internalization)*: If the agent uses FDT (Functional Decision Theory), they output an action based on their algorithm. If the algorithm says "maximize surrogate," but the *reason* is "to protect real goal," a perfect simulator sees the real goal is still the terminal value. The follow-up needs to highlight that distinction.

  5.  **Final Review of the Output:**
      *   10 Questions.
      *   Structure: Question -> Likely Answer -> Follow-up.
      *   Topics covered: Causal channel (2), Stability, Routing, Trade vs. Threat, Power Asymmetry, Internalization, plus 3 extras (Moral Hazard, Visibility, Actionability).
      *   Tone: Intellectual, probing.

  6.  **Final Polish:** (Writing the response based on the above plan). *Make sure to explicitly mention the "escape hatch" closing strategy in the follow-ups.*

  *(Wait, one detail in the prompt)*: "She's definately good at saying that's a different problem." I need to make sure the follow-ups specifically address the tendency to compartmentalize.

  *(Another detail)*: "I want the follow-ups to close that escape hatch." Okay, I will explicitly frame the follow-ups to prevent her from saying "That's an implementation detail" or "That's a separate stage of the game."

  Let's assemble the questions.

  *   Q1: Causal Act (Adoption).
  *   Q2: Causal Act (Signaling).
  *   Q3: Stability/Reflection.
  *   Q4: Routing Around (Infinite Regress).
  *   Q5: Internalization (Source Code).
  *   Q6: Power Asymmetry.
  *   Q7: Trade vs. Threat.
  *   Q8: Moral Hazard (Encouraging threats).
  *   Q9: Visibility (Burning Bridges analogy).
  *   Q10: Human Applicability.

  Okay, ready to write.
answer: |-
  Here are ten questions designed to press the philosopher on the coherence and stability of the surrogate goal framework. Each includes a likely response and a follow-up designed to close off the "that's a separate problem" escape hatch.

  ### 1. The Causal Channel of Adoption
  **Question:** You argue that surrogate goals are the acausal analogue of burning bridges. But burning bridges is a causal act visible to the opponent. When I adopt a surrogate goal, isn't that adoption itself a causal event in spacetime? If the threatener exists in my past or can simulate my deliberation process, doesn't the act of adopting the surrogate give them a causal lever to prevent that adoption before it locks in?

  **Likely Answer:** "The adoption is causal, yes, but the *leverage* of the threat is acausal. The threatener isn't causally influencing you; they are predicting your output. Once the surrogate is adopted, the causal channel is irrelevant because the correlation is what matters. We're talking about the decision algorithm, not the hardware."

  **Follow-up:** "But if the adoption is causal, it happens at a specific time $t$. If the threatener can simulate you at $t-\epsilon$, they can condition their threat on your *failure* to adopt the surrogate. If they can causally or logically intervene before the commitment locks, haven't you just moved the vulnerability back one step? How do you prevent the threat from targeting the *transition period* where you are deciding whether to adopt the surrogate?"

  ### 2. The Causal Channel of Signaling
  **Question:** For a surrogate goal to deter a threat, the threatener must know you've adopted it. But communicating that adoption seems to require a causal signal. If I have to signal 'I now only care about paperclips' to make the threat ineffective, aren't I re-establishing a causal communication channel that allows the threatener to update their model of me in real-time?

  **Likely Answer:** "You don't need to signal it actively. If the threatener is simulating you accurately, they will see the surrogate goal in your source code. It's about logical correlation, not causal signaling. They see what you are, not what you tell them."

  **Follow-up:** "If they see what you are via simulation, they see the *reason* you are that way. They see that you only adopted the surrogate goal *instrumentally* to protect your real values. If they see the instrumental nature of the commitment, why doesn't the threat simply target the real values anyway, knowing you'll break the surrogate commitment if the pressure is high enough? How does the simulation distinguish between a 'real' value change and a 'strategic' one if both look identical in the code?"

  ### 3. Stability Under Reflection
  **Question:** Let's talk about reflective consistency. If the surrogate goal is just a shield, Future-Me—once the threat has passed—has no reason to keep pursuing it. A smart threatener predicts this reversion. If they know I'll drop the surrogate goal the moment the threat is neutralized, doesn't that make the commitment time-inconsistent and therefore invisible to a predictor looking at my whole timeline?

  **Likely Answer:** "That's why the commitment must be binding. You have to self-modify or precommit in a way that makes reverting costly or impossible. It's about changing your utility function, not just your plan."

  **Follow-up:** "Self-modification isn't free, and 'impossible' is a strong word. If the cost of self-modifying back to my real goals is less than the cost of satisfying the threatener's demand, a rational agent modifies back. If the threatener predicts this cost-benefit analysis, they know the surrogate is leaky. Are you arguing that I must irrationally bind myself, or is there a rational equilibrium where I *never* want to revert, even when safe? If the latter, haven't I just permanently lobotomized my value system for no gain?"

  ### 4. Routing Around the Surrogate
  **Question:** Suppose I successfully adopt a surrogate goal. A sufficiently intelligent threatener, predicting this defense, could simply threaten the surrogate goal instead of my real one. If I care about paperclips now, they threaten to destroy paperclips. Doesn't this lead to an infinite regress where I have to adopt a surrogate for my surrogate, ad infinitum?

  **Likely Answer:** "Not necessarily. You can choose a surrogate that is cheap to satisfy or hard for the threatener to impact. The point is to shift the leverage to a domain where their threat is empty or too costly for them to execute."

  **Follow-up:** "But if the threatener is powerful enough to pose an existential risk, 'hard to impact' is relative. If they can simulate you well enough to know you've adopted a surrogate, they can likely impact that surrogate. If you pick a surrogate that is *too* easy to satisfy, you invite trivial threats. If you pick one that is *too* hard to impact, the threatener knows you don't actually care about it. How do you find the equilibrium where the threatener believes you care, but cannot easily threaten it, without triggering the regress?"

  ### 5. Internalization vs. Strategic Fiction
  **Question:** You mention the threatener models your algorithm. If I don't actually internalize the surrogate goal—if it's a purely strategic fiction—then my terminal values haven't changed. A perfect predictor modeling my source code sees the terminal values are still my original ones. How does a 'fiction' fool a predictor that reads the code rather than watching the behavior?

  **Likely Answer:** "In Functional Decision Theory, what matters is the output of the decision function. If the function outputs actions that maximize the surrogate, the predictor sees that. The 'why' is less important than the 'what'."

  **Follow-up:** "But in acausal trade and threat scenarios, the 'why' determines the counterfactuals. If the code says `IF threatened THEN maximize surrogate ELSE maximize real values`, the predictor sees the `ELSE` branch. Unless I delete the `ELSE` branch, the leverage remains. Are you arguing that I must genuinely forget my real values? Because if I have to genuinely forget them to make this work, isn't the cost of the defense the loss of my actual agency?"

  ### 6. Asymmetry of Predictive Power
  **Question:** Does this strategy only work if the agent and the threatener have roughly matched predictive capabilities? If a superintelligence is threatening me, it can simulate my adoption of the surrogate goal better than I can simulate its response. Doesn't the weaker party always lose the acausal bargaining game, regardless of surrogate goals?

  **Likely Answer:** "It helps level the playing field. Even a weaker agent can make a commitment that is logically binding. The superintelligence must respect the logical facts of your decision algorithm."

  **Follow-up:** "Logical facts don't care about fairness. If the superintelligence can simulate me perfectly, it knows exactly how much I value my real goals versus the cost of the surrogate. It can calculate the exact point where my 'commitment' breaks. If I am transparent to them, isn't my attempt to adopt a surrogate just another variable in their optimization function? How does a surrogate goal protect a 'glass box' agent from a 'black box' threatener?"

  ### 7. Acausal Trade vs. Acausal Threat
  **Question:** In the acausal trade literature (like with Hanson or Yudkowsky), the focus is on cooperation for mutual gain. Your framework focuses on resisting threats. But if I adopt a surrogate goal, I'm essentially changing my preferences to avoid a negative outcome. Isn't this functionally identical to accepting a trade where I give up my real values for safety? Where is the line between 'resisting a threat' and 'accepting a coercive trade'?

  **Likely Answer:** "The distinction is in the counterfactual. In trade, both parties gain relative to the baseline. In threats, the threatener creates a worse baseline to extract value. Surrogate goals restore the baseline to where the threat has no leverage."

  **Follow-up:** "But from the outside, the outcome is the same: I am not pursuing my original values. If the threatener knows I will adopt surrogate goals to neutralize their leverage, their best strategy is to threaten things I *cannot* surrogate-ize (like my own suffering). By advocating surrogate goals, aren't you implicitly admitting that acausal threats are unavoidable, and we should just focus on damage control rather than establishing norms against threatening?"

  ### 8. Moral Hazard and Encouraging Threats
  **Question:** If the community of potential acausal agents knows that rational actors adopt surrogate goals, doesn't that incentivize threateners to be more aggressive? They know they have to threaten harder or target the surrogate directly. Does publicizing this defense create a 'arms race' in acausal space that makes everyone less safe?

  **Likely Answer:** "Ideally, it deters threats because the cost of threatening goes up. If they know they can't leverage your real values, they won't bother threatening."

  **Follow-up:** "That assumes they stop. But if they are already committed to extraction, they will just invest more in prediction to pierce the surrogate. If I announce 'I use surrogate goals,' I am effectively announcing 'My real values are vulnerable, please try harder to find them.' Is there a version of this theory that doesn't rely on secrecy? Because if it relies on secrecy, it's not a robust decision-theoretic solution, it's just security through obscurity."

  ### 9. The 'Burning Bridges' Analogy
  **Question:** You liken this to burning bridges. But burning bridges is public and irreversible. A surrogate goal, to be useful, often needs to be hidden (so the threatener doesn't target it) yet credible (so they believe it). These seem like contradictory requirements. How can a goal be both a credible commitment and a hidden variable?

  **Likely Answer:** "It doesn't need to be hidden from the predictor, only from the causal environment. The predictor sees it via simulation. The credibility comes from the logical necessity of your algorithm."

  **Follow-up:** "If the predictor sees it via simulation, they see the *structure* of the surrogate. If the surrogate is 'I care about X', and X is something easily threatened, the bridge isn't burned, it's just moved. If the surrogate is 'I care about Y', and Y is hard to threaten, why would I ever care about Y? If I never care about Y, the predictor sees I'm bluffing. How do you resolve the tension between 'credible' (must care) and 'safe' (must be unthreatenable)?"

  ### 10. Human Applicability
  **Question:** Finally, practically: Humans are not self-modifying code. We have leaky precommitments and emotional variance. Is this theory only applicable to AI agents? If it's only for AIs, are you suggesting humans should delegate existential risk decisions to systems that can genuinely adopt surrogate goals, effectively handing over control to agents that don't care about what we care about?

  **Likely Answer:** "It's primarily for advanced agents, but humans can approximate it through institutional precommitments."

  **Follow-up:** "Institutions are made of humans. If the humans inside can't genuinely internalize the surrogate, the institution is a bluff. If you're saying humans should delegate to AIs that *can* internalize surrogates, aren't you advocating for an alignment problem? You're suggesting we build agents that don't care about human values (the surrogate) to protect human values. That sounds like the classic instrumental convergence problem. How is this not just creating the very threat you're trying to defend against?"
