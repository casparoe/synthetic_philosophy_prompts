          *   *Reason to treat?* Yes. Functional protection (don't burn the hand), prevention of central sensitization (wind-up), and respect for autonomy (if he changes his mind). Also, the "number 8" suggests the *capacity* for suffering is there, even if currently dampened.
      *   **Settled vs. Contested:**
