  7.  **Final Polish:** Ensure the tone is academic yet accessible to a grad student. Use footnotes or parentheticals for references if helpful (maybe just name-drop key figures). Ensure the distinction between *pain asymbolia* and this case is noted (asymbolia usually involves no withdrawal reflexes at all; he might still have some, but the *reaction* is muted). Actually, the prompt says "doesn't pull the hand away," which sounds like asymbolia. I should mention pain asymbolia as a reference class.

      *(Self-Correction on Asymbolia)*: True pain asymbolia is rare and usually involves cortical lesions. Post-stroke pain (CPSP) is usually *hyper*algesic. However, dissociation can happen. I must be careful not to diagnose but to use the *phenomenology* as the data point. The user says the neurologist is unsurprised, so I will treat the phenomenology as given.

      *(Refining the "Badness" argument)*: If pain is an imperative ("Don't do that!"), and he ignores it, is the imperative broken? Or is the imperative weak? Imperativists say the badness *is* the command strength. If he doesn't care, the command is weak, so the badness is low. This fits well.

