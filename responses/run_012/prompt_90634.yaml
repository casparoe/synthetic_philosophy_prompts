  You're a philosopher who works on practical rationality over time, and I want you to actually think this through rather than hand me the standard taxonomy. Here's what I think about diachronic rationality, case by case, and I want to know what principle, if any, covers it. Start by brainstorming a few candidate principles before you commit to one.

