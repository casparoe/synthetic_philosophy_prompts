prompt: |-
  I teach an upper-level undergraduate seminar in bioethics and philosophy of mind. Sixteen students, one ninety-minute session, one room, nothing needed but paper and pens. Design a single activity for that session whose point is to make participants feel the problem of the authority of the earlier self over the later one — the problem that arises when someone who is competent writes a binding instruction about how they are to be treated at a later time, at which point they will have values they no longer hold, or no coherent values at all, and the earlier voice is absent at the moment of application while the later person is present and does not ratify what was written.

  The hard part is not that the earlier self might have been insincere. It is that we cannot say, without assuming the answer, which of the two selves is the person whose good is at stake, and on what basis the one acquires the right to bind the other. Do not lecture on this at the start, and do not let the students hear the standard labels — precedent autonomy, substituted judgment, the reductionist challenge to the significance of identity, self-binding as a species of promise or of self-legislation — until the debrief. The structure of the activity, not the facilitator's framing, has to do the work.

  I want the group to collide with at least four things before any of them is named.

  First, a directive written in earnest and then read strictly — with no clause allowing the later self to override it simply by asking — should turn out to bind someone in a way they actively resent, and the activity should make visible that honoring the directive means overriding a present, articulate protest.

  Second, at least some participants should face the case of two competent utterances by the same person at different times: a directive made while unimpaired, and a later revocation also made while unimpaired. Whatever rule the group adopts should be shown to fail on that case rather than merely to be complicated by it, so that the group cannot settle matters by deferring to the competent person.

  Third, the asymmetry between refusals and demands: participants should be able to notice in their own behavior that they are willing to be bound to refuse something and reluctant to be bound to require something of others (or the reverse), and the debrief should say whether that asymmetry tracks anything real or is an artifact of how the cases were described.

  Fourth, and this is the one I care most about: the activity must not let the later self be a fully articulate debater in every case. In the situations that generate the actual disputes, the person whose good is at issue is frequently the least able to speak for themselves, so the contest is between the earlier self's written word and third parties' interpretations of what the present person wants or enjoys. Build in at least one case where nobody in the room is entitled to speak for the present person, and make the group decide anyway.

  Wherever possible, the earlier self and the later self should be the same participant: the force of the thing comes from having written the instruction and then having to live under it, or from watching one's own stated justification for the instruction's authority be applied, against one's wishes, to one's own case.

  Deliver, as a runnable plan: the materials; a minute-by-minute timeline; what each participant writes, and exactly how those artifacts are collected, edited, and returned so that the fiction holds; the roles, including who may speak for whom and who is barred from speaking; the decision rule or payoff structure, with an account of why it produces pressure rather than merely posing a question — the stakes should be real to the participants without being material; and a debrief that maps particular moments in the activity onto the positions at issue, in plain language that a student who has read nothing can follow. No citations, no reading list, and nothing that requires me to have read a particular book.

  Also tell me: the three most likely ways the first run goes wrong and what to do about each; the point at which the design is most likely to tip the group toward one answer, and how to counteract it; and an honest account of what this activity cannot reproduce, and therefore what I will have to supply myself. I would rather have a design that is sharp and limited than one that covers everything.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergrad seminar, bioethics/philosophy of mind. 16 students, 90 minutes, 1 room, paper/pens only.
      *   **Goal:** Design a *single activity* to make participants *feel* the problem of the authority of the earlier self over the later self (precedent autonomy vs. current interests).
      *   **Core Problem:** Who is the person whose good is at stake? On what basis does the earlier self bind the later self?
      *   **Constraints:**
          *   No lecturing at the start.
          *   No standard labels (precedent autonomy, substituted judgment, etc.) until debrief.
          *   Structure must do the work, not framing.
          *   Must collide with four specific things:
              1.  Resentment of binding directives (honoring directive = overriding present protest).
              2.  Two competent utterances (earlier directive vs. later revocation while unimpaired).
              3.  Asymmetry between refusals and demands.
              4.  *Crucial:* The later self cannot always be an articulate debater (some cases involve incapacity where third parties decide).
          *   Ideally, earlier and later selves are the same participant (write instruction, live under it).
      *   **Deliverables:** Materials, minute-by-minute timeline, writing/collection/editing/return process, roles (who speaks for whom), decision rule/payoff (real stakes, non-material), debrief plan.
      *   **Additional:** Three likely failure modes + fixes, bias point + countermeasure, limitations of the activity.

  2.  **Deconstruct the Core Tension:**

      *   The "Ulysses Contract" or "Advance Directive" problem.
      *   To make it *felt*, students need to experience the loss of agency or the burden of enforcing agency against a present self.
      *   To satisfy Constraint 4 (later self not articulate), I need a mechanism where the "Later Self" is silenced or altered in some rounds.
      *   To satisfy Constraint 1 & 2 (Competence conflict), I need a mechanism where the "Later Self" can sometimes object competently, but the rule forces ignoring them.
      *   To satisfy Constraint 3 (Refusal vs. Demand), the content of the directives needs to vary between "Do not do X to me" and "Make me do Y."

  3.  **Drafting the Activity Concept: "The Trustee Game"**

      *   *Idea:* Students write directives for a future version of themselves. Then, scenarios are drawn. Some scenarios involve the "Later Self" objecting. Some involve the "Later Self" being unable to object. A "Trustee" (another student) must enforce the directive.
      *   *Problem:* If I just say "pretend," it lacks stakes.
      *   *Stakes:* Social capital? Grading? No, must be non-material but real. Let's use *interpretive authority*. The "Later Self" loses the right to define their own good in the simulation. The "Trustee" holds the power.
      *   *Refinement:* Let's make it a "Council of Selves."
      *   *Better Idea:* **"The Binding Slip."**
      *   Each student writes a directive.
      *   They are paired. Partner A is the Trustee for Partner B.
      *   Scenarios are introduced.
      *   *Crucial Twist:* To hit Constraint 4 (Later Self silence), some scenarios must render the "Later Self" unable to speak *in the simulation*, even if the student is physically present.
      *   *Crucial Twist 2:* To hit Constraint 2 (Competent Revocation), some scenarios allow the "Later Self" to try to revoke, but the Trustee must decide if the *original* rule blocks that.

      *   *Re-evaluating Constraint 4:* "In the situations that generate the actual disputes, the person whose good is at issue is frequently the least able to speak for themselves."
      *   *Implementation:* In some rounds, the "Later Self" student is physically present but *gagged* (literally or figuratively) or assigned a status of "Incapacitated" where their verbal objections are ruled out of order by the facilitator. This is risky but powerful. Let's make it procedural: In "Type Blue" cases, the Later Self's voice is inadmissible evidence.

      *   *Re-evaluating Constraint 1 & 2:* We need a mix of cases.
          *   Case A: Earlier Self says "No Treatment." Later Self says "I want Treatment." (Conflict of values).
          *   Case B: Earlier Self says "Force Treatment." Later Self says "No." (Coercion).
          *   Case C: Earlier Self says "No Treatment." Later Self is non-verbal/unconscious. (Third party interpretation).
          *   Case D: Earlier Self says "No Treatment." Later Self (competent) says "I revoke the directive." (Competence conflict).

      *   *The "Stakes":* The group must reach a consensus on whether the Trustee acted "Rightly." If the group votes "Wrongly," the Trustee loses "Standing" (a token). If they run out of Standing, they are removed from the Council. This creates pressure to justify decisions.
      *   *Actually, simpler stakes:* The "Later Self" experiences the outcome. If the directive is enforced against their will, they must write a "Testimony of Harm." This becomes part of the permanent record of the seminar. This feels bureaucratic and weighty.
      *   *Better Stakes:* **The Veto Token.** Each student gets one "Veto" they can use to stop a decision about *them*. But they can only use it if they are deemed "Competent" by the Facilitator. In some rounds, the Facilitator declares them "Incompetent" for the sake of the scenario. This forces the group to rely *only* on the paper directive.

      *   *Let's refine the "Same Participant" constraint:* "Wherever possible, the earlier self and the later self should be the same participant."
      *   Okay, Student X writes the directive. Later, Student X is the "Later Self." But who enforces it? A "Trustee" (Student Y).
      *   This creates a triangle: Writer (Past), Subject (Present), Trustee (Enforcer).

  4.  **Developing the Mechanics (The "Protocol"):**

      *   **Phase 1: Drafting (20 mins).** Students write a "Future Care Directive." It must cover two specific scenarios (one refusal, one demand). It must include a "Lock Clause" (Can the future self revoke this? Yes/No).
      *   **Phase 2: The Crisis (40 mins).** Scenarios are read.
      *   **Phase 3: Adjudication (20 mins).** Group decides if the Trustee followed the rules.
      *   **Phase 4: Debrief (10 mins).**

      *   *Wait, I need to ensure the "Inarticulate Later Self" (Constraint 4).*
      *   I need to simulate dementia or unconsciousness.
      *   *Mechanism:* The "Status Card." In some rounds, the Later Self draws a card that says "Aphasic" or "Delirious." They are physically present but *forbidden from speaking* to justify their preferences. They can only emote. The Trustee must interpret the paper directive vs. the non-verbal cues.
      *   *Wait, I need to ensure the "Competent Revocation" (Constraint 2).*
