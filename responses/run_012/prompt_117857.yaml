      *   *The "Stakes":* To make it real without material loss.
      *   *Idea:* **The Record.** The outcome is written on the board. If the Directive is enforced against the Later Self's will, a mark is placed next to their name under "Overridden." If the Directive is ignored, a mark is placed under "Betrayed." At the end, everyone sees their name under one of these headers. This creates social/existential stakes.

