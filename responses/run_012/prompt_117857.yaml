          3.  Facilitator selects 4 specific directives to be "Activated" (or all 16, but 4 is manageable for 90 mins). Let's do 4 volunteers or random draw to save time. *Actually, 16 students is small enough that we can do 4 rounds of 4 people, or just 4 major cases.*
          4.  Let's do **4 Case Studies** drawn from the pile. The class acts as the "Ethics Board." The "Later Self" (the writer) is present in the room.
