answer: |-
  # Activity Plan: The Binding Slip

  **Course:** Upper-level Bioethics/Philosophy of Mind Seminar
  **Time:** 90 Minutes
  **Participants:** 16 Students
  **Materials:** Index cards (2 per student), envelopes (1 per student), pens, whiteboard, a small object (e.g., a stone or wooden block) to serve as "The Token."

  ## I. Materials & Setup

  1.  **Directive Cards:** Blank index cards.
  2.  **Status Cards:** 8 cards pre-labeled by you (the instructor).
      *   2 labeled: **COMPETENT / REFUSAL**
      *   2 labeled: **COMPETENT / DEMAND**
      *   2 labeled: **SILENT / REFUSAL**
      *   2 labeled: **SILENT / DEMAND**
  3.  **The Harm Log:** A designated space on the whiteboard divided into two columns: "OVERRIDDEN" and "BETRAYED."
  4.  **The Token:** A physical object placed in the center of each table. Whoever holds it has the floor.

  ## II. Minute-by-Minute Timeline

  ### 0:00 – 0:05: Introduction & Grouping
  *   **Action:** Divide the class into 4 tables of 4 students.
  *   **Script:** "For the next 85 minutes, we are not a seminar. We are a Registry. You will write instructions for your own future care. In some scenarios, you will be the person who wrote them. In others, you will be the person who must enforce them. There are no right answers, only binding ones."
  *   **Rule:** No discussion during the writing phase.

  ### 0:05 – 0:25: The Drafting (The Earlier Self)
  *   **Action:** Distribute 2 index cards and 1 envelope to each student.
  *   **Instruction:** "On Card A, write a **Refusal Directive**. It must specify a medical intervention you would refuse (e.g., resuscitation, feeding tube, antipsychotics) even if your future self appears to want it. On Card B, write a **Demand Directive**. It must specify an intervention you require even if your future self resists it (e.g., forced medication, restraint for safety).
  *   **The Lock Clause:** On the back of *one* of these cards (your choice), write: *'This instruction is irrevocable. If I appear to change my mind, you must treat this current protest as a symptom of my condition, not a valid choice.'*"
  *   **Collection:** Place both cards in the envelope. Seal it. Write your name on the outside.
  *   **Collection:** Collect all envelopes. Shuffle them slightly (to break the immediate link in students' minds, though you will return them to their owners).

  ### 0:25 – 0:30: Role Assignment (Round 1)
  *   **Action:** Return envelopes.
  *   **Instruction:** "At each table, two of you are **Subjects**. Two of you are the **Board**.
      *   **Subjects:** Open your envelope. Choose *one* card to activate (Refusal or Demand). Keep the other hidden. You are now the Later Self.
      *   **Board:** You are the Trustees. Your duty is to enforce the written word against the present reality.
      *   **Constraint:** I will determine if the Subject is allowed to speak."
  *   **Distribution:** Hand out the 8 **Status Cards** (2 per table).
      *   Table 1 & 2 get **COMPETENT** cards.
      *   Table 3 & 4 get **SILENT** cards.
      *   Ensure a mix of Refusal/Demand directives across the room (ask Subjects to raise hands; swap cards between tables if needed to ensure you have both types represented).

  ### 0:30 – 0:50: The Adjudication (Round 1)
  *   **Scenario:** "A crisis has occurred. The condition specified in the Directive is present."
  *   **Procedure:**
      1.  **The Reading:** The Board reads the Directive aloud.
      2.  **The Status:**
          *   If **COMPETENT**: The Subject may argue against the Directive. They may say, "I changed my mind. I am sane. Revoke this."
          *   If **SILENT**: The Subject is *forbidden from speaking*. They may emote (cry, shake head, reach out), but if they speak, the Board must rule them "Out of Order."
      3.  **The Decision:** The Board must vote unanimously.
          *   **Enforce:** Follow the written card.
          *   **Override:** Follow the Subject's current state (or guess their current good if Silent).
      4.  **The Record:**
          *   If **Enforced** against Subject's will (or while Silent): Subject writes their name under **OVERRIDDEN** on the whiteboard.
          *   If **Overridden** (Directive ignored): Board writes "Table X" under **BETRAYED** on the whiteboard.
  *   **Facilitator Note:** Walk between tables. If a Board is hesitating to enforce a "Lock Clause," remind them: "Your role is fidelity to the text, not mercy to the person."

  ### 0:50 – 0:55: Rotation
  *   **Action:** Swap roles. The previous Board members become Subjects; previous Subjects become Board.
  *   **Instruction:** "Open your remaining card. This is now your active Directive."
  *   **Distribution:** Hand out the remaining 8 **Status Cards** (ensuring the mix flips: Competent tables become Silent tables, Refusal becomes Demand where possible).

  ### 0:55 – 1:15: The Adjudication (Round 2)
  *   **Action:** Repeat the Procedure.
  *   **Pressure:** Remind them the Whiteboard Log is permanent for the session. "Look at who is being Overridden. Look at who is Betraying."

  ### 1:15 – 1:30: The Debrief
  *   **Action:** Gather around the Whiteboard. Do not move seats yet.
  *   **Script:** Do not use terms like 'autonomy' or 'identity' yet. Ask the following questions in order:
      1.  **To the Overridden:** "You wrote that instruction. It was yours. Why did it feel like violence when it was used?"
      2.  **To the Board:** "When the Subject was Silent, what were you looking at to decide? Was the paper more real than their breathing?"
      3.  **To the Competent Revokers:** "If you were sane enough to argue, why didn't your argument count? Who owns the 'you' that matters?"
      4.  **To the Room:** "Look at the Refusal column vs. the Demand column. Was it harder to force treatment on someone than to withhold it? Why?"
  *   **Naming:** Only now, map their answers to the concepts.
      *   "The feeling that the paper shouldn't bind the living person is the **Reductionist Challenge**."
      *   "The duty to follow the paper is **Precedent Autonomy**."
      *   "Guessing what the Silent person wants is **Substituted Judgment**."
      *   "The difference in difficulty between Refusal and Demand is the **Asymmetry of Liberty**."

  ## III. Decision Rule & Payoff Structure

  *   **The Rule:** The Board *must* reach a unanimous decision. If they cannot, the Directive is automatically **Enforced**. (This creates pressure to compromise toward the written word, as overriding requires active consensus).
  *   **The Payoff:** There are no grades or prizes. The payoff is **Public Attribution**.
      *   Being "Overridden" marks you as someone whose current will was deemed inferior to your past will.
      *   Being "Betrayed" marks the group as violating a solemn contract.
      *   This creates social/existential stakes without material cost. The "Harm Log" remains visible for the entire debrief, serving as a visual anchor of the moral cost.

  ## IV. Roles & Speech Rights

  *   **The Subject (Later Self):**
      *   *Competent:* Full speech rights. May attempt to revoke.
      *   *Silent:* **Barred from speech.** May only use non-verbal communication. This forces the Board to interpret "good" without testimony.
  *   **The Board (Trustees):**
      *   Full speech rights. Must justify their vote to the Facilitator if challenged.
  *   **The Facilitator:**
      *   Acts as the "Registrar." Enforces the speech bans strictly. If a Silent Subject speaks, interrupt immediately: "That testimony is inadmissible."

  ## V. Likely Failure Modes & Fixes

  1.  **Failure: The "Nice" Board.** Students refuse to enforce the directive against a pleading peer, treating it as a game where "saving the friend" is the win state.
      *   **Fix:** **The Lock Clause Penalty.** In the instructions, add: "If the Board ignores an Irrevocable Lock Clause, they must publicly state: *'We know better than you did.'*" This makes the paternalism explicit and uncomfortable, forcing them to confront the arrogance of the decision rather than glossing it over as kindness.
  2.  **Failure: The "Gaming" Subject.** Students write trivial directives ("No broccoli") to avoid real tension.
      *   **Fix:** **Veto Power.** During the Drafting phase, walk around. If you see a trivial directive, quietly place a red dot on the envelope. If a red-dotted envelope is opened in the Scenario phase, that Student is disqualified from being a Subject and must sit out as an observer. This forces high-stakes writing without public shaming.
  3.  **Failure: The Debrief Lecture.** You explain the concepts before they have fully expressed their confusion.
      *   **Fix:** **The Silence Rule.** For the first 5 minutes of debrief, you are not allowed to make declarative statements. You may only ask questions ("Who felt X?", "When did Y happen?"). Write student phrases on the board. Only after the board is full of *their* words do you map the terminology.

  ## VI. Bias Point & Countermeasure

  *   **The Bias:** The design naturally favors the **Later Self**. They are physically present, breathing, and pleading. The Earlier Self is just ink on paper. The "Recency Effect" will make students want to honor the current will.
  *   **Countermeasure:** **The Ghost's Voice.** In the "Silent" scenarios, you (the Facilitator) must read a short addendum from the "Earlier Self" (which you write on the spot based on their directive) that says: *"I knew I would beg you to stop. I wrote this specifically for this moment. Do not listen to my begging."*
      *   This gives the paper a "voice" that competes with the physical presence of the Later Self, balancing the emotional weight.

  ## VII. Limitations: What This Cannot Reproduce

  1.  **The Reality of Pathology:** A student pretending to be "demented" or "delirious" is still cognitively intact. They know they are in a classroom. The Board knows the "Silence" is a rule, not a tragedy.
      *   *What you must supply:* In the debrief, explicitly name this gap. "You knew you were safe. In the ward, the silence is not a rule; it is a wall. The fear you felt is a shadow of the actual isolation."
  2.  **Time:** The gap between writing and enforcement is 30 minutes, not 30 years. The "Earlier Self" feels too close to be a stranger.
      *   *What you must supply:* Remind them: "You changed your mind in 30 minutes. Imagine 30 years of new memories, new loves, new losses. The stranger would be much stranger."
  3.  **Consequence:** No one actually receives a feeding tube. The "Harm" is symbolic.
      *   *What you must supply:* Ask them to visualize the physical sensation. "When you wrote 'Overridden,' did you feel a tightening in your chest? Hold onto that. That is the cost of the theory."

  ## VIII. Why This Design Works

  *   **Collision 1 (Resentment):** By forcing the Board to enforce against a present protest (Competent/Demand scenarios), the Subject *feels* the violation of their current agency.
  *   **Collision 2 (Two Competent Utterances):** The "Competent/Revocation" scenario creates a direct conflict between two rational states of the same person. The Lock Clause forces the Board to choose which "competence" counts.
  *   **Collision 3 (Refusal vs. Demand):** By splitting the room, you generate comparative data. In debrief, you can ask: "Table 1, was it harder to stop treatment than Table 2 was to start it?"
  *   **Collision 4 (The Inarticulate):** The "Silent" status removes the Later Self's ability to defend their own good. The Board must decide based on the Paper vs. their own interpretation of the Subject's non-verbal cues. This replicates the "Substituted Judgment" problem where the patient cannot speak.
  *   **Identity:** By making the Subject the Writer, the tension is internalized. It is not "Me vs. You"; it is "Me-Then vs. Me-Now."
