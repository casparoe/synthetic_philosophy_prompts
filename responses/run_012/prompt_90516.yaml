      5.  The Warning (Don't codify the lie).

  10. (Review against constraints): "Engineer, not a philosopher." Keep philosophy minimal and pragmatic. "Spell it out." Use bullet points and clear directives.

  11. (Final check on the "Clock Skew" detail): Ensure the technical explanation makes sense. Clock skew affects idempotency keys if they are time-based. Ravi's theory was about idempotency keys failing (provider stopped deduping). So Ravi was right about the *mechanism of failure* (idempotency broke), just wrong about the *cause* (clock skew vs provider change). This confirms the "Causal Proximity" argument.

