prompt: |-
  You're a philosopher of biology who actually works on the function debate -- someone who's read the etiological/selected-effects literature and the causal-role literature closely and has opinions about which does what work. Before you write anything, think through the problem carefully, and start by brainstorming: lay out the positions you think are in play, then write the thing.

  Quick background. I'm a software engineer, zero formal philosophy training, and I've somehow ended up as the engineer rep on the internal review board at the small company I work for. We make variant-interpretation software -- clinical labs run their sequencing data through it, and it spits out annotations. Labs then use those annotations as evidence when they decide whether a variant explains a patient's symptoms. The board's job is to sign off on what the tool is allowed to assert, and we've got a decision to make by Thursday.

  Version 4 adds a "loss of function" (LoF) label. LoF is a big deal downstream: labs treat it as close to a smoking gun. Two things are on the agenda and they pull in opposite directions, which is why I think we're actually being asked a conceptual question and not an engineering one.

  Case A: a variant in a noncoding region. The only evidence we have is a cell assay showing that deleting the region changes expression of a nearby gene. No signal of conservation across species, no sign that anything ever selected for this region doing anything. Our external advisor, a geneticist, says flat out: you cannot lose a function that was never a function. Nothing was selected for, so nothing was broken, and the honest label is "measured effect in assay X," full stop. Our ML lead says the assay is the evidence, and whether some ancestral mammal had a use for this stretch of DNA is a historical question that has nothing to do with whether the variant disrupts something today.

  Case B: mirror image. A variant in a region that's strongly conserved across a bunch of distant species -- the sort of thing that usually means selection has been protecting it for a long time -- but nobody has a demonstrated mechanism. No assay, no known causal role in any pathway we can name. Is that enough to say "loss of function"? Half the board says yes, that's exactly what conservation is evidence of. The other half says we'd be asserting a function we can't even describe.

  So the policy question is: what does a claim of loss of function have to be backed by before our tool is allowed to emit it? Options as I see them: (1) require evidence that the sequence was maintained by selection, treating the causal story as optional; (2) require a demonstrated causal contribution to some system, treating the selection history as optional; (3) require both, which would leave us labeling almost nothing; or (4) stop using the phrase at all and have the tool emit only descriptive, scoped statements, which is what our geneticist would prefer but which I suspect just moves the problem downstream to whoever has to turn our output into a yes/no for a patient.

  I once read a blog post that split this into "etiological" accounts, where a trait's function is whatever it was selected for, and "causal-role" accounts, where a function is just a contribution to some capacity of a containing system. I might be mangling that. Anyway, two things I'd like you to take seriously:

  First, I keep noticing that this maps onto something I know from my day job, and I want you to tell me whether the analogy is a trap. The etiological view sounds like "what the code was written to do" -- the spec, the intent, the comment at the top of the file. The causal-role view sounds like "what the program actually does when it runs," which can be very different from the spec and often matters more. My instinct is that this analogy makes the etiological view feel more respectable than it should, because code has authors and genomes don't, and it quietly imports a designer. But I also have code in production that nobody ever intended to do what it does, that's load-bearing, and that we'd be insane to rip out -- so "nobody designed this" doesn't obviously mean "there's no function here." Untangle that for me if you can.

  Second, "loss of function" sounds like it's saying something went wrong, and I'm not sure the causal-role picture can support the idea that anything went wrong -- it seems to collapse into "this region behaves differently now." But I also worry the causal-role picture makes the label trivially satisfiable, since on a loose enough reading almost every effect a sequence has is a contribution to something. So: which account, if either, can underwrite the normativity the phrase seems to carry, and does it matter for what we ship?

  What I need: the short written opinion I'll circulate before Thursday's meeting. One page, bullets are fine. Give me a concrete recommendation -- which of the four options, or something better -- with the criteria written so that our engineers and the reviewing geneticist could actually apply them to a new variant without calling a philosopher, and with a time frame for revisiting it (we ship in six weeks; I'd rather have a rule with a review date than a perfect rule). Include the strongest honest case for whichever side you're ruling against; I have to look the ML lead in the eye on Thursday and I don't want to strawman him.

  And please keep the two kinds of uncertainty seperate. At the end, give me a short section that says which parts of this are actually settled among people who know the field and which parts are live disagreements, and don't hand me a contested position dressed up as the consensus -- if the split in our board tracks a split in the literature, say so. I don't want a reading list, I can't get to the literature anyway and I mostly need the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer, no formal philosophy training, rep on an internal review board for a clinical variant-interpretation software company.
      *   **Task:** Write a one-page opinion memo for a Thursday meeting regarding the definition/criteria for "Loss of Function" (LoF) labels in their software (Version 4).
      *   **Context:** Two conflicting cases (Noncoding assay-positive/evolution-negative vs. Conserved/assay-negative). Four policy options provided.
      *   **Specific Constraints:**
          *   Adopt the persona of a philosopher of biology specializing in the function debate (etiological vs. causal-role).
          *   Start with brainstorming/thinking through the problem (internal monologue style before the final output).
          *   Address two specific philosophical worries: (1) The code analogy (designer vs. no designer), (2) The normativity problem ("went wrong" vs. "behaves differently").
          *   Provide a concrete recommendation (pick an option or synthesize) with applicable criteria and a review date.
          *   Include the strongest case for the opposing view (don't strawman the ML lead).
          *   Separate settled vs. live disagreements in the field at the end.
          *   Keep it practical (one page, bullets okay, no reading list).

  2.  **Deconstruct the Philosophical Problem (The "Function Debate"):**
      *   **Etiological/Selected-Effects (SE) Theory:** Function is what a trait was *selected for*. (Millikan, Neander, Godfrey-Smith).
          *   *Pros:* Handles normativity well (malfunction = failure to do what was selected). Explains why conserved stuff matters.
          *   *Cons:* Hard to apply to noncoding/new traits. Requires historical data we often lack.
      *   **Causal-Role (CR) Theory:** Function is a causal contribution to a capacity of the containing system. (Cummins).
          *   *Pros:* Empirically accessible (run the assay). Good for new traits or system analysis.
          *   *Cons:* "Function inflation" (everything does *something*). Lacks normativity (if it changes, it's just different, not necessarily "broken").
      *   **The Clinical Context:** "Loss of Function" implies pathology. Pathology implies a norm (health/normal function). Therefore, pure CR is risky because it lacks the "wrongness" condition. Pure SE is risky because we lack evolutionary history for many human-specific or noncoding regions.

  3.  **Address the User's Specific Worries:**
      *   **The Code Analogy:** The user worries SE imports a "designer" (like code specs).
          *   *Correction:* Evolution is a blind selector, not a designer. But SE doesn't need a *mind*, just a *history of replication due to effect*. Code analogy: Legacy code that persists because it fixes a bug vs. code that persists because the boss liked the color blue. SE cares about *why it stayed*, not *who wrote it*.
          *   *Relevance:* The ML lead is right that current behavior matters, but the geneticist is right that "function" in biology usually implies "selected effect."
      *   **Normativity:** CR says "it does X." SE says "it *should* do X."
          *   *Clinical Implication:* If we say "LoF," we imply harm. CR alone can't justify "harm," only "change." SE justifies "harm" (failure to meet evolutionary expectation).

  4.  **Evaluate the Four Options:**
      *   (1) Selection only: Too restrictive. Misses human-specific or newly evolved functional elements.
      *   (2) Causal only: Too permissive. Risks false positives for pathology. "Effect" $\neq$ "Function."
      *   (3) Both: Too restrictive. Paralyzes the tool.
      *   (4) Descriptive only: Safest scientifically, but kicks the can to clinicians who might misinterpret "effect" as "function."

      *   *Synthesis Recommendation:* A hybrid approach. Use CR for *detection* (does it do something?) and SE for *validation of function* (is that something biologically relevant?). But for *clinical* LoF, we need a threshold of evidence that approximates SE without requiring full phylogenetic reconstruction.
      *   *Actually, looking closer at clinical standards (ACMG/AMP):* They distinguish "Functional Data" (PS3/BS3) from "Conservation" (PP3/BP3). "Loss of Function" is a specific mechanistic claim.
      *   *Decision:* Recommend Option 4 (Descriptive) *but* with a structured mapping to clinical evidence levels. Don't use the label "Loss of Function" unless SE criteria are met (Conservation + Mechanism). If only Assay, call it "Disruptive Effect." This protects the company from liability while acknowledging the ML lead's data.

      *   *Wait, refine for the prompt:* The prompt asks for a concrete recommendation on *what the tool is allowed to assert*.
      *   *Best Path:* Adopt a "Two-Track" system.
          *   Track 1 (High Confidence LoF): Requires Conservation (SE proxy) + Mechanism (CR).
          *   Track 2 (Observed Disruption): Assay only. Do not label "LoF." Label "Functional Disruption."
      *   *Why:* This respects the normativity of "LoF" (requires SE) while utilizing the ML lead's assay data (CR) without overclaiming.

  5.  **Drafting the Content - Section by Section:**

      *   **Header:** Memo style.
      *   **Intro:** Acknowledge the depth of the question.
      *   **Philosophical Analysis:** Briefly explain SE vs. CR in plain English. Address the Code Analogy (it's good but selection $\neq$ design). Address Normativity (CR can't say "wrong," SE can).
      *   **Recommendation:** Modified Option 4/3 hybrid. Two labels.
      *   **Criteria:** Clear rules for engineers/geneticists.
      *   **Opposing View:** Validate the ML lead (CR is necessary for discovery).
      *   **State of the Field:** Be honest about the split.

  6.  **Refining the "Philosopher Persona":**
      *   Tone: Professional, analytical, empathetic to the engineering constraints, but firm on the conceptual distinctions.
      *   Avoid jargon where possible, or define it quickly.
      *   Ensure the "Brainstorming" section happens *before* the memo, as requested ("Before you write anything, think through the problem carefully, and start by brainstorming... then write the thing.").

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the code analogy trap? Yes, need to emphasize that selection is blind but still creates "proper functions."
      *   *Check:* Did I address normativity? Yes, crucial for clinical "Loss."
      *   *Check:* Is the recommendation actionable? Yes, specific criteria for the two labels.
      *   *Check:* Is the "State of the Field" honest? Yes, acknowledge that biologists use "function" ambiguously.
      *   *Check:* Length? Keep the memo tight (one page equivalent).

  8.  **Final Polish:** Ensure the distinction between the "Brainstorming/Thinking" section and the "Memo" section is clear. The prompt asks me to "think through the problem carefully, and start by brainstorming... then write the thing." I will structure the response with a clear "Internal Reasoning" block followed by the "Memo."

      *(Self-Correction on the Code Analogy)*: The user's instinct is right. Code has *intentional* design. Biology has *natural* selection. The analogy holds for "Spec vs. Runtime" but breaks on "Designer." I need to clarify that SE doesn't need a designer, just a history of replication.
      *(Self-Correction on Normativity)*: CR *can* have normativity if the "system capacity" is defined as "health," but that's circular in a clinical tool. SE grounds the norm in history.

      *(Decision on Recommendation)*: I will recommend a split label strategy. "Loss of Function" is reserved for SE+CR (Conservation + Mechanism). "Functional Disruption" for CR only (Assay only). This satisfies the geneticist's caution and the ML lead's data utility.

      *(State of the Field)*: Be clear: Philosophers argue SE is the *only* true function. Biologists often use CR pragmatically. Clinicians need Normativity. This creates a 3-way tension.

      *Let's write.*
answer: |-
  ### Internal Reasoning & Brainstorming

  **1. Mapping the Positions**
  *   **The Geneticist (Etiological/Selected-Effects):** Function = what the sequence was *selected for*. If there's no evolutionary history (conservation), there's no function, so there can be no "loss." This aligns with Millikan/Neander. It handles normativity well (you can fail a job you were hired for) but is epistemically demanding (hard to prove selection).
  *   **The ML Lead (Causal-Role):** Function = what the sequence *does* in the system. If the assay shows a change, the role is disrupted. This aligns with Cummins. It's empirically accessible (run the test) but suffers from "function inflation" (everything does *something*) and lacks normativity (a change isn't necessarily a failure).
  *   **The Clinical Context:** "Loss of Function" (LoF) is a normative claim. It implies pathology. A pure Causal-Role account cannot support "pathology," only "difference." A pure Etiological account supports "pathology" but might miss human-specific functional elements (new genes, regulatory regions not conserved in mice).

  **2. Untangling the Code Analogy**
  *   **The Trap:** The user worries SE imports a "Designer."
  *   **The Fix:** SE doesn't require a mind, only a *feedback loop*. In code, "technical debt" that persists because it accidentally fixes a race condition is like a selected effect. It wasn't "designed," but it was "kept because it worked."
  *   **Relevance:** The ML lead is right that runtime behavior (assay) matters. But the Geneticist is right that "LoF" implies the code *should* have done something else. If I delete a comment line and the build breaks, the comment had a causal role (maybe a parser quirk), but was it *function*? In biology, "function" usually implies "maintained by selection."
  *   **Verdict:** The analogy holds for Spec (SE) vs. Runtime (CR), but we must remember biological "specs" are written by gravity and death, not engineers.

  **3. The Normativity Problem**
  *   **CR View:** "The protein folds differently." (Neutral)
  *   **SE View:** "The protein fails to perform the task it was preserved to do." (Normative/Negative)
  *   **Clinical Risk:** If we label a variant "LoF" based only on CR (assay), we tell a clinician "this is bad." But if that assay effect is biologically irrelevant (noise), we cause harm. SE provides the safety filter.
  *   **Solution:** We need both. CR detects the *change*; SE validates the *importance*.

  **4. Strategy for the Memo**
  *   **Recommendation:** Split the labels. Reserve "Loss of Function" for cases satisfying SE criteria (Conservation). Use a new label ("Functional Disruption") for CR-only cases (Assay).
  *   **Why:** It uses the ML lead's data without making the Geneticist's normative claim prematurely. It pushes the "is this pathological?" decision to the clinician with better data, rather than baking it into the tool.
  *   **Field Status:** Be honest. Philosophers prefer SE. Biologists mix them. Clinicians need SE for validity but CR for discovery.

  ***

  ### MEMORANDUM

  **TO:** Internal Review Board
  **FROM:** [Your Name], Engineering Rep
  **DATE:** Thursday, [Date]
  **SUBJECT:** Policy Recommendation for "Loss of Function" Labeling (v4)

  **Executive Summary**
  The debate over our "Loss of Function" (LoF) label is not merely semantic; it determines whether we assert a *historical failure* (the sequence broke a selected role) or a *current difference* (the sequence behaves differently in an assay). My recommendation is to **split the output into two distinct labels** to satisfy both scientific rigor and engineering utility.

  **Philosophical Context (Brief)**
  *   **Etiological View (Geneticist):** Function is what a sequence was *selected for*. No conservation = no function = no LoF. This supports the *normativity* of the label (i.e., that something went *wrong*).
  *   **Causal-Role View (ML Lead):** Function is a *causal contribution* to a system. Assay change = function disrupted. This supports *detection* but cannot distinguish between a pathological break and a neutral quirk.
  *   **The Code Analogy:** The analogy holds: SE is the "Spec" (why the code persists), CR is "Runtime" (what the code does). However, unlike code, biology has no designer. "Spec" is determined by evolutionary survival, not intent. Relying only on Runtime (Assay) risks labeling accidental side-effects as "broken features."

  **Recommendation: The Two-Track Labeling System**
  Do not choose between Options 1-4. Instead, implement a dual-label schema. This allows us to ship the ML team's detection capabilities without overclaiming clinical significance.

  1.  **Label A: "Loss of Function" (High Confidence)**
      *   **Criteria:** Requires **both** evidence of Causal-Role (assay/mechanism) **and** evidence of Selected-Effect (conservation/phylogenetic footprinting).
      *   **Meaning:** "This sequence does something, and evolution says it *should*."
      *   **Application:** Case B (Conserved, no assay) $\rightarrow$ **No Label** (Insufficient mechanism). Case A (Assay, no conservation) $\rightarrow$ **No Label** (Insufficient history).
  2.  **Label B: "Functional Disruption" (Observational)**
      *   **Criteria:** Requires evidence of Causal-Role (assay/mechanism) **only**. Conservation is not required.
      *   **Meaning:** "This sequence does something differently in this context. Clinical relevance undetermined."
      *   **Application:** Case A $\rightarrow$ **Emit Label B**. Case B $\rightarrow$ **No Label**.

  **Implementation Criteria (For Engineers & Reviewers)**
  *   **Conservation Threshold:** PhyloP score > X or GERP++ > Y (to be defined by Genetics lead).
  *   **Assay Threshold:** P-value < Z in validated reporter/CRISPR assay.
  *   **Logic:**
      *   IF (Assay + Conservation) $\rightarrow$ Emit "Loss of Function."
      *   IF (Assay + No Conservation) $\rightarrow$ Emit "Functional Disruption."
      *   IF (Conservation + No Assay) $\rightarrow$ Emit Nothing (Flag for research).

  **The Strongest Case Against This (ML Lead's Position)**
  The ML Lead is correct that strict evolutionary criteria (SE) bias us against human-specific functions. We may miss pathogenic variants in newly evolved regulatory regions that haven't had time to show deep conservation. By relegating assay-only hits to "Functional Disruption," we risk clinicians underweighting them. *Mitigation:* We will document "Functional Disruption" in the API as high-priority evidence, just without the normative "LoF" tag.

  **Timeline & Review**
  *   **Ship Date:** 6 weeks.
  *   **Review Date:** 12 months post-launch.
  *   **Trigger:** If >10% of "Functional Disruption" labels are reclassified as pathogenic by ClinVar without conservation evidence, we revisit the Conservation Threshold.

  **State of the Field: What is Settled vs. Contested**
  Please note that our board's split mirrors an active, unresolved debate in the literature.
  *   **Settled:** There is no single consensus definition of "function" in biology. The term is used ambiguously in papers (sometimes meaning "effect," sometimes "selected role").
  *   **Contested:** Philosophers of biology largely argue that *only* the Etiological (Selected-Effects) account justifies normative claims like "Loss" or "Malfunction." However, practicing molecular biologists often rely on Causal-Role accounts for pragmatic discovery.
  *   **Clinical Consensus:** ACMG/AMP guidelines distinguish between "Functional Data" (PS3/BS3) and "Conservation" (PP3/BP3). They do not equate them. Our Two-Track system aligns with this distinction, whereas a single "LoF" label conflates them.

  **Action Required**
  Approve the Two-Track schema. Instruct the ML team to map assay outputs to "Functional Disruption" by default, with "Loss of Function" gated behind the conservation filter.
