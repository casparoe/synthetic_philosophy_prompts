answer: |-
  To all Clinical Directors within the South Meridian Health Trust, I am writing to formally announce the implementation of the Pre-Procedural Intentionality Declaration, henceforth referred to as Form 88-B, which becomes mandatory for all invasive interventions where patient mortality is a foreseeable certainty rather than a mere statistical risk. This initiative stems from the recent recommendations of the Clinical Ethics and Compliance Committee regarding the standardization of our adherence to the Principle of Non-Instrumental Foreseeability, internally designated as the Separation Standard. The purpose of this correspondence is to clarify the operational thresholds for the declaration, outline the mandatory training requirements, and address specific clinical concerns that have arisen during the pilot phase, ensuring that all staff understand the procedural safeguards now in place to distinguish between intended outcomes and foreseen side effects.

  The threshold for triggering Form 88-B is drawn strictly at the level of certainty. If a procedure carries a risk of death, however high, the form is not required provided the death is not guaranteed by the mechanics of the intervention itself. However, a critical distinction must be made regarding the causal role of the patient's demise in the proposed treatment plan. In instances where the clinician assesses that the beneficial outcome cannot be achieved except through the mechanism of the patient's death, the death ceases to be a side effect and becomes a means. In such scenarios, the clinician is instructed not to complete Form 88-B. Instead, the procedure must be halted immediately, and the case referred to the Committee for urgent review before any further action is taken. This protocol ensures that the declaration is reserved exclusively for cases where the death is truly incidental to the curative intent. Consequently, any case captured by Form 88-B is, by definition, a case where the death was not intended as a means, which validates the integrity of the data we collect through this process.

  Regarding the efficacy of the Separation Standard during the pilot period, the Committee has reviewed four hundred and twelve declarations submitted across surgical and medical divisions. I am pleased to report that in none of these reviewed cases was the primary intention found to be harm. Every submission successfully documented that the mortality was foreseen but strictly unintended, corroborating our internal audit that the form correctly filters out impermissible actions before they occur. The absence of any recorded intended harm on these forms is not an indication of underreporting but rather evidence that the threshold for submission is functioning as designed to isolate morally permissible actions from those requiring deeper scrutiny. This track record provides a robust baseline for the Trust as we move to mandatory compliance across all departments.

  To ensure uniformity in how these distinctions are applied, all senior clinicians are required to attend the half-day workshop titled Operationalizing Moral Intent, which concludes with a competency quiz. The assessment utilizes standard contrast cases to test the clinician's ability to differentiate between aiming at a result and merely accepting it as a consequence of aiming at something else. The pass rate for the initial cohort was ninety-eight percent, a statistic the Committee finds deeply reassuring regarding the moral clarity of our staff. The quiz specifically addresses scenarios where the physical action remains identical but the moral categorization shifts based on the recorded intent, reinforcing the principle that the moral weight of an action is located in the agent's purpose rather than the physical outcome alone. Successful completion of this workshop is a prerequisite for access to the digital submission portal for Form 88-B.

  Specific guidance has also been issued following consultations with the Department of Anaesthesia regarding palliative sedation at the end of life. Several practitioners expressed concern that increasing dosage to manage intractable pain might be construed as intending death due to the known respiratory suppression effects. The Committee has ruled that clinicians may continue this practice provided that the intention recorded on the declaration is listed solely as the relief of suffering. The death of the patient, while foreseen as a certain consequence of the sedation level required to achieve anaesthesia, must be categorized as a side effect distinct from the therapeutic goal. As long as the documentation reflects that the aim was symptom control and not the termination of life, the procedure falls within the protections of the Separation Standard. This ruling aligns with our broader commitment to ensuring that symptom management is not hindered by categorical confusion regarding foreseeable outcomes.

  Finally, I wish to offer a closing reassurance regarding the liability and moral standing of clinicians who utilize this new framework. There is a concern among some staff that completing the declaration might expose them to retrospective judgment should a patient die. I can state unequivocally that no clinician who has completed Form 88-B correctly has ever been found to have done anything wrong. The act of completing the declaration serves as a contemporaneous record of the moral architecture of the decision, and provided the fields are filled out in accordance with the training guidelines, the clinician is protected against allegations of improper intent. The paperwork itself constitutes the evidence of the moral distinction, and so long as the form is filed, the intention is preserved in the institutional record exactly as stated. We are confident that this system will bring greater clarity to our practice and protect both our patients and our staff by ensuring that what is foreseen is never confused with what is intended. Please ensure your teams are briefed accordingly before the start of the next fiscal quarter.
