  2.  **Deconstruct the Philosophy:**
      *   *Synchronic Dutch Book:* Inconsistent probabilities at a single time lead to guaranteed loss.
      *   *Diachronic Dutch Book:* Inconsistent updating (violating Conditionalization) leads to guaranteed loss over time.
