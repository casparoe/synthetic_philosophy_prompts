      *   *Claims:* Needs to be mutually exclusive and exhaustive, or logically related. Let's use a die roll or a specific event. Actually, simpler is better for intro. "Will it rain tomorrow?" "Will the coin land heads?" No, needs logical connection.
      *   *Better:* Three propositions: $A$, $B$, $A \lor B$. Or just $A$ and $\neg A$. Let's go with $A$ and $\neg A$ for simplicity, but encourage $P(A) + P(\neg A) \neq 1$.
      *   *Stakes:* Need a currency. "Philosophy Points" (PP).
      *   *The Trap:* If $P(A) = 0.6$ and $P(\neg A) = 0.6$, the Punter buys both tickets for £0.60 each. Total cost £1.20. Payout is £1.00 regardless. Loss = £0.20.
