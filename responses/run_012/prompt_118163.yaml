answer: |-
  # Lesson Plan: The Dutch Book Trap
  **Course:** Intro Philosophy of Probability
  **Session:** 75 Minutes
  **Class Size:** 20 Students (5 Groups of 4)
  **Topic:** Synchronic and Diachronic Dutch Books

  ## 1. Learning Objectives
  By the end of this session, students will:
  1.  Experience how incoherent probabilities (violating the axioms) allow a opponent to construct a guaranteed loss (Dutch Book).
  2.  Grapple with the normative force of the argument (why *should* we avoid sure loss?).
  3.  Understand the diachronic extension (betting against your future self).
  4.  Critically assess the limitations of the Dutch Book argument (utility vs. money).

  ## 2. Materials Required
  *   **5 Sets of "Betting Slips"** (printed templates provided below).
  *   **Play Currency:** 200 "Philosophy Pounds" (PP) per group (printed paper money or just tally on a sheet).
  *   **Incentive:** A bag of high-quality sweets (e.g., Quality Street or Roses) for the group with the highest final PP score.
  *   **Whiteboard/Projector:** To display the "Market Rules".
  *   **Deck of Cards:** One standard deck (for Round 2 evidence).
  *   **Calculators:** Phones are fine.

  ## 3. Timeline Overview
  *   **00:00 – 00:10:** Setup & Group Allocation.
  *   **00:10 – 00:35:** Round 1: The Synchronic Trap (Present Self).
  *   **00:35 – 01:00:** Round 2: The Diachronic Trap (Future Self).
  *   **01:00 – 01:15:** Debrief & The "Climbing Guy" Objection.

  ---

  ## 4. The Activity Rules

  ### Group Setup
  Divide the class into 5 groups of 4. In each group:
  *   **2 Bookies:** They set the odds/prices.
  *   **2 Punters:** They choose which side to bet on and the stake.
  *   *Note:* Roles swap in Round 2.

  ### Currency & Payoff
  *   Each group starts with **100 PP**.
  *   **Ticket Structure:** A ticket costs £$p$ (the probability set by the Bookie). It pays out **£1** if the event happens, **£0** if it does not.
  *   **Stakes:** Punters can buy up to 10 tickets per event.
  *   **Winning:** The group with the most PP at the end gets the sweets. *Crucially:* If a group goes into negative PP, they are "Bankrupt" and out of the running.

  ---

  ## 5. Round 1: The Synchronic Trap (25 mins)
  **Goal:** Demonstrate that $P(A) + P(\neg A) \neq 1$ leads to guaranteed loss.

  **Step 1: The Market (5 mins)**
  The Bookies must set prices for the following two tickets based on a single coin toss (to be flipped at the end of the round):
  1.  **Ticket H:** Pays £1 if Heads.
  2.  **Ticket T:** Pays £1 if Tails.

  *Constraint:* Bookies must set prices intuitively. Do not check if they add up to 1. Do not discuss strategy with Punters.
  *Typical Error:* Bookies often set $P(H) = 0.6$ and $P(T) = 0.6$ (overconfidence) or $0.4$ and $0.4$ (underconfidence).

  **Step 2: The Bet (10 mins)**
  Punters examine the prices. They can buy any number of Ticket H and Ticket T.
  *   If Bookies set $P(H)=0.6$ and $P(T)=0.6$:
      *   Punter buys 1 of H (£0.60) and 1 of T (£0.60).
      *   Total Cost: £1.20.
      *   Payout: £1.00 (regardless of coin outcome).
      *   **Guaranteed Loss:** £0.20 per pair of tickets.
  *   Punters should maximise this arbitrage.

  **Step 3: The Reveal & Settlement (10 mins)**
  1.  Flip the coin.
  2.  Settle debts.
  3.  **The Critical Moment:** Ask the Bookies who lost money: *"Did you make a mistake?"*
      *   *Expected Response:* "No, I just had a hunch. The coin landed Heads, my Heads ticket was priced right."
      *   *TA Intervention:* Point out they lost money *regardless* of the coin. The loss was in the *setup*, not the outcome.

  ---

  ## 6. Round 2: The Diachronic Trap (25 mins)
  **Goal:** Demonstrate inconsistency over time (violating Conditionalization/Reflection).
  **Roles:** Swap. Previous Punters are now Bookies.

  **Step 1: The Commitment (5 mins)**
  Use a deck of cards. The event is: **"The top card is Red."**
  1.  **Time 1 (Now):** Bookie sets a price for "Card is Red" ($P_{now}$).
  2.  **Time 2 (Future):** Bookie must write down what price they *will* set for "Card is Red" **if** they are told the card is **not a Heart** ($P_{later}$).
      *   *Note:* This forces them to commit to a future credence before seeing the evidence.

  **Step 2: The Evidence & Trade (10 mins)**
  1.  Punters look at $P_{now}$ and the committed $P_{later}$.
  2.  **The Trap:** If $P_{now} \neq P(\text{Red} | \text{Not Heart}) \times P(\text{Not Heart}) + \dots$ (Law of Total Probability), or simply if the future price commitment contradicts the logical implication of the evidence.
      *   *Simplified Mechanism for Intro Class:*
      *   Logical Fact: If the card is Not a Heart, it is either Spade, Club, or Diamond. 2/3 are Black, 1/3 are Red. So $P(\text{Red} | \text{Not Heart})$ *must* be $1/3$ (approx 0.33).
      *   If Bookie commits to $P_{later} = 0.50$ (ignoring the evidence), the Punter sells a ticket at Time 1 and buys it back at Time 2.
      *   *Action:* Punter buys/sells at Time 1 prices. When evidence is revealed ("It is not a Heart"), the Bookie *must* update to their committed $P_{later}$. Punter reverses the trade at the new price.
      *   If the prices are incoherent with the evidence, the Punter locks in a profit.

  **Step 3: Settlement (10 mins)**
  1.  Reveal the card (ensure it is Not a Heart for the trap to spring, or have a backup deck).
  2.  Settle the Time 1 bet.
  3.  Settle the Time 2 bet.
  4.  Show the net loss for the Bookie.

  ---

  ## 7. Debrief: Mapping the Constraints (15 mins)
  *Do not lecture. Draw a table on the board and ask them to fill it in.*

  | Moment in Game | Philosophical Constraint | What broke? |
  | :--- | :--- | :--- |
  | **Round 1 Loss** | **Synchronic Coherence** | $P(A) + P(\neg A) \neq 1$. You valued the whole more than the sum of parts. |
  | **Round 2 Loss** | **Diachronic Coherence** | Violation of Conditionalization / Reflection Principle. Your future self betrayed your present self. |
  | **The "So What?"** | **Instrumental Rationality** | If you want money, you must obey probability. |

  ### The "Climbing Guy" Discussion (Crucial)
  Address your personal context directly. Ask the class:
  *"In Round 1, some Bookies lost PP but said they didn't care. One of you is my climbing partner. He offers inconsistent odds but says he bets for fun, not profit. Is he irrational?"*

  **Key Points to Elicit:**
  1.  **Utility vs. Money:** The Dutch Book argument assumes Money $\approx$ Utility. If the "fun of betting" has positive utility, it might offset the financial loss.
  2.  **Normative Force:** The argument proves that *if* you want to maximise expected utility, you *must* be probabilistically coherent. It does not prove you *should* want to maximise utility.
  3.  **The "Money Pump":** If the climbing guy keeps betting, eventually he runs out of money and can't climb. Pragmatic self-defeat.

  ---

  ## 8. Honest Limitations (Handout or Board Note)
  *Ensure they leave knowing the argument isn't magic.*

  1.  **The "Fun" Loophole:** As discussed, if the act of betting provides utility, a sure financial loss might still be a net utility gain.
  2.  **Finite Resources:** Dutch Books often require infinite stakes or perfect divisibility of currency to guarantee loss in all edge cases.
  3.  **Logical Omniscience:** The argument assumes you know all logical truths (e.g., that $A \lor \neg A$ is a tautology). Real humans don't.
  4.  **Diachronic Complexity:** In Round 2, we assumed the Bookie *had* to honour their future price. In real life, you can just refuse to bet with your future self.

  ---

  ## 9. Predictable Failure Modes (TA to TA)
  *Here is what will go wrong, and how to fix it.*

  **1. The "It's Fake Money" Problem**
  *   **Risk:** Students won't feel the pain of loss in Round 1. They'll set $P(H)=0.9$ and $P(T)=0.9$ just to be daft.
  *   **Fix:** Emphasise the **Sweets**. "The group with the most PP gets the Quality Street. Negative PP means you get nothing." Social competition usually substitutes for cash.

  **2. The Round 2 Maths Meltdown**
  *   **Risk:** Conditional probability calculations will stall the group.
  *   **Fix:** Pre-calculate the "Rational Price" on a teacher key. If a Bookie commits to $P_{later} = 0.5$ when the evidence dictates $0.33$, simply tell the Punter: *"Sell high now, buy low later. You make 17p per ticket."* Don't get bogged down in the formula during the game; save the formula for the debrief.

  **3. The "I Didn't Agree to That" Objection**
  *   **Risk:** In Round 2, when the Punter reverses the trade, the Bookie says "I never agreed to sell it back."
  *   **Fix:** The "Commitment Slip" in Step 1 must be signed. Frame it as a binding contract. This mirrors the philosophical assumption that rational agents bind their future selves.

  **4. The Climbing Guy Contagion**
  *   **Risk:** One student decides "I don't want the sweets, I want chaos" and intentionally loses to prove a point.
  *   **Fix:** Acknowledge this in the debrief. "This student has rejected the utility function of the game. The Dutch Book argument does not apply to anarchists, only to agents with goals."

  ## 10. Preparation Checklist
  *   [ ] Print 20 Betting Slips (2 per student).
  *   [ ] Print 100 PP notes (or prepare tally sheets).
  *   [ ] Buy sweets.
  *   [ ] Check the deck of cards (remove Jokers).
  *   [ ] Write the "Market Rules" on the board before they enter.

  ---

  ### Appendix: The Betting Slip Template

  **GROUP NUMBER: ______**

  **ROUND 1: SYNCHRONIC**
  *Event: Coin Toss (Heads / Tails)*
  **Bookie Prices:**
  Price for £1 if Heads: £______
  Price for £1 if Tails: £______

  **Punter Action:**
  Buy ___ Heads Tickets (Cost: £______)
  Buy ___ Tails Tickets (Cost: £______)
  **Total Cost:** £______
  **Guaranteed Payout:** £______
  **Net Result:** £______

  **ROUND 2: DIACHRONIC**
  *Event: Top Card is Red*
  **Bookie Commitment:**
  My Price Now: £______
  My Price Later (If told "Not a Heart"): £______

  **Punter Strategy:**
  [ ] Buy Now, Sell Later
  [ ] Sell Now, Buy Later
  **Net Result:** £______
