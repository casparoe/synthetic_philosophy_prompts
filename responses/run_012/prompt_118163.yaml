prompt: |-
  I'm a TA for an intro philosophy of probability course and I've drawn the short straw for next week's 75-minute session on Dutch books — 20 students, one room, and the course design doesn't really let me just lecture at them. It's also gotten personal: I've spent the last month in a betting pool at my climbing gym where a guy keeps offering me odds I'm fairly sure are inconsistent, and I genuinely can't tell whether that makes him irrational or just someone who doesn't care about money the way the argument quietly assumes.

  So design me an activity, not a talk. I want them setting their own odds on a handful of uncertain claims, someone else choosing which side and how much to stake, and getting picked off — and crucially I want that moment where the person who is definately going to lose insists they've done nothing wrong, because that's where the real argument lives. Then build in a second round where they set odds on the odds they themselves will offer once they've seen some evidence, so they feel the version of this that's about their future self rather than their present one. I need rules, materials, a payoff scheme that doesn't need real cash, a timeline, and a debrief mapping each moment onto the specific constraint that did the work. Also an honest note on what the game can't reproduce — I dont want them leaving thinking the argument is stronger than it is — plus what'll predictably go wrong the first time I run it. British English please.
