      *   **Modest Camp (User):** TAs reveal conceptual structures or presuppositions. They tell us about *us* (our minds, our language), not the *world*. Conclusion: "We must *believe* $Y$" or "We must *conceptualize* the world as $Y$."
      *   **Ambitious Camp (Friend):** TAs reveal ontological truths. They tell us about reality. Conclusion: "$Y$ is true."
