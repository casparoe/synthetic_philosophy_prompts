prompt: |-
  My friend and I spent like three hours arguing last night about transcendental arguements — the ones where you claim something has to be the case because otherwise the very possibility of experience, or of having thoughts with content at all, would collapse. He's in the ambitious camp: he thinks these can actually land a conclusion about the world (there's an external world, not all our beliefs are false, other minds exist). I'm in the modest camp: I think the most they ever deliver is something about our concepts, or about what we can't help presupposing, and that doesn't tell us how things actually are. We want to write the joint statement we could both sign — can you draft it?

  Use this as our test case: you can only recognize one of your own beliefs as a mere seeming — as possibly false — if you already have the distinction between how things appear and how they are; and you can't get that distinction from how things appear, since applying it is what lets you treat an appearance as mere appearance in the first place. So it starts to look like a condition of any experience that could be right or wrong. What does that actually buy us?

  I want: the claims we'd both sign (including what a transcendental argument would have to do to count as working, and what we both agree is not enough — e.g., just showing that doubting something is psychologically hard); our remaining disagreements, each phrased in wording the person who holds it would accept; the cruxes — I'd bet one is whether the necessity in question is conceptual/psychological or worldly; and for each crux, an argument or case we'd both accept as bearing on it, plus what each of us predicts it shows. If some of our fight was just us talking past each other, say which part and why.

  Since I'm the one reading this: be upfront about what's settled here versus what's genuinely contested among people who actually know the area, and don't pass off a contested view as the consensus. No reading list — I can't look anything up right now. American English, please.
