prompt: |-
  Okay so for my philosophy porject I watched this YouTube video (I think it was based on some philosopher's book but I've forgotten the name) about Darwin and Turing, and it kept going on about how both of them made a "strange inversion of reasoning". I wrote down what I think it was saying, and I want to know if I've actually got it or if the video was overselling it. Here's my version:

  "Both Darwin and Turing made the same move: they showed you can get clever results without anyone being clever. Darwin showed that living things look designed but are really just the product of random trial and error, so the appearance of purpose in nature is an illusion and nature has no goal at all. Turing made the same inversion for thinking: instead of asking whether machines really understand anything, he said we should just ask whether they can produce the right answers, and he came up with the Turing test to prove that a computer which passes it is genuinely thinking. So the moral of both inversions is that reasoning is really just a mechanical process that happens to feel like something from the inside, and that comprehension is just competence we've dressed up."

  I think the general vibe is right but I don't trust the details, and my teacher said something like the two inversions invert different things and I shouldn't lump them together, which confused me. Can you go through it basically sentence by sentence and tell me what's fair, what a philosopher would wince at, and what's just wrong? And does that last conclusion actually follow from the bits that are right, or is it a whole other claim bolted on the end? Please write it in British English, since my exam board wants that. Ta!
