      *   The teacher is right to be cautious. Darwin inverts *Design* (Teleology). Turing inverts *Mind/Intelligence* (Cognition). While Dennett links them to support Naturalism, they operate in different domains. Darwin explains biological complexity; Turing explains logical computability. Conflating them risks category errors.

