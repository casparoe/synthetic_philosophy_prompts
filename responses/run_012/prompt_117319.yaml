answer: |-
  You haven't mashed them up randomly; you've stumbled onto the boundary between **Game Theory** (how agents act) and **Decision Theory** (how agents reason).

  The short answer is that you are describing two different mechanisms that look identical from the outside.
  1.  **The Engineering Teams:** This is a **Schelling Point** (focal point) supported by **Common Knowledge**.
  2.  **The AI Models:** This is **Superrationality** (or **Acausal Coordination**).

  The distinction lies entirely in your question about the "link." Is the link a shared physical cause (the doc), or is it a logical identity (the code)?

  Here is the breakdown of the mechanism, the edges, and the names.

  ---

  ### 1. The Mechanism: What is the "Link"?

  You asked: *Is it enough that each can deduce the other's move, or does something have to actually make them both move?*

  In standard causal physics (and standard Nash Equilibrium game theory), **deduction is not a link.** If I deduce you will turn Left, that deduction does not *make* you turn Left. Our actions are independent variables. If we coordinate, it's usually because we both reacted to a third thing (a signal, a doc, a traffic light).

  However, in the pattern you noticed, the agents are treating their own decision process as **logically entangled** with the other's.

  #### Case A: The Engineering Teams (Schelling Point)
  *   **The Link:** A shared causal history (the design doc, industry standards, hiring from the same pool).
  *   **The Mechanism:** **Common Knowledge.**
      *   Team A reads the doc.
      *   Team A knows Team B read the doc.
      *   Team A knows Team B knows Team A read the doc.
      *   The doc suggests "Change X" is the obvious solution.
  *   **Why it works:** They aren't simulating each other's *minds*; they are simulating the *environment* they both share. When they say "The other team obviously would," they are shorthand for "The other team sees the same obvious constraint I do."
  *   **Verdict:** This is boring causality. The doc *did* make them both move. The "prediction" is just a recognition of that shared cause.

  #### Case B: The AI Models (Superrationality)
  *   **The Link:** Logical Identity.
  *   **The Mechanism:** **Functional Correlation.**
      *   Agent A and Agent B run the same algorithm $f(x)$.
      *   Even if they are physically isolated, if inputs $x$ are identical, outputs $f(x)$ are identical.
      *   Agent A reasons: "If I output 'Yes', it implies that algorithm $f$ outputs 'Yes'. Since Agent B *is* algorithm $f$, Agent B outputs 'Yes'."
  *   **Why it works:** Agent A treats its own choice not as a free variable, but as a calculation of a logical truth. By choosing, it isn't *causing* B to choose; it is *revealing* what B has already logically determined.
  *   **Verdict:** This is the weird one. There is no physical signal. The link is mathematical necessity.

  ### 2. The Names and Edges

  You asked for established names and where the edges are.

  #### Name 1: Schelling Point (Focal Point)
  *   **Applies to:** The Engineering Teams.
  *   **Requirement:** Shared context / Common Knowledge.
  *   **Edge Case (Asymmetry):** Survives asymmetry well. If Team A is smarter than Team B, they can still coordinate on the "obvious" solution in the doc. In fact, the smarter team might intentionally pick the solution the dumber team can easily find.
  *   **Does it require a shared source?** Yes. Without the doc (or shared culture), there is no focal point.

  #### Name 2: Superrationality (Hofstadter) / Acausal Coordination
  *   **Applies to:** The AI Models.
  *   **Requirement:** High similarity (ideally identity) of reasoning process.
  *   **Edge Case (Asymmetry):** **Fails.** This is the hard edge you asked about.
      *   If Agent A is a perfect reasoner and Agent B is noisy/random, Agent A cannot treat its own decision as logically linked to B's.
      *   If Agent A is much smarter, it might model B causally ("B is dumb, so B will do X, so I will do Y"). That reverts to standard Game Theory.
      *   Superrationality *only* holds when both parties believe their decision is a sample from the *same* function.
  *   **Does it require a shared source?** It requires a shared *algorithm*. In your AI example, the "training run" is the shared source. If they were trained differently, the logical link breaks.

  #### Name 3: Correlated Equilibrium
  *   **You asked about this:** It's distinct.
  *   **Mechanism:** Requires an external signal (a "correlation device"). Example: A traffic light. Both drivers see Red. They both stop.
  *   **Why it's not your pattern:** In your AI case, there is no external signal. The "correlation" comes from internal identity, not an external broadcaster.

  ### 3. Coining a Term (If needed)

  If you want to talk specifically about the version where **similarity alone** is the link (no shared doc, no external signal, just identical reasoning), the existing term is **Superrationality**, but it is often dismissed by economists as "magic."

  In modern AI safety and decision theory (specifically **Functional Decision Theory** or FDT), this is called **Logical Correlation** or **Acausal Trade**.

  If I had to coin a precise engineering term for the pattern you see, I would call it **Deterministic Convergence via Logical Entanglement**.

  *   **Rules In:** Two processes running identical logic on identical inputs.
  *   **Rules Out:** Humans (too noisy), different models (logic differs), shared docs (that's just common cause).

  ### 4. Summary of Answers

  **(a) Is there an established name?**
  Yes, but it splits.
  *   Teams + Doc = **Schelling Point** (coordinated via common knowledge).
  *   Models + Identity = **Superrationality** (coordinated via logical identity).

  **(b) Where are the edges? Does shared source matter?**
  *   **Shared Source (Doc/Training):** If the source provides a "salient" solution, it's a Schelling Point. This is robust.
  *   **No Shared Source (Just Similarity):** This is Superrationality. It is fragile. It requires the agents to *know* they are similar. If I don't know you are running my code, I can't use this logic.
  *   **Correlated Equilibrium:** Requires an external signal. Your cases are internal.

  **(c) If the "similarity only" version needs a name:**
  Use **Acausal Coordination**.
  *   **Definition:** Coordination achieved without communication or causal influence, relying solely on the logical correlation between agents' decision algorithms.
  *   **What it rules out:** It rules out cases where one agent models the other as a separate physical object (standard causality). It requires modeling the other as an *instance of the same function*.

  **(d) The Mechanism & Asymmetry:**
  *   **Mechanism:** It is **not** enough to just deduce the move. In standard theory, deduction doesn't link outcomes. For this pattern to hold, the agents must reason counterfactually: "If I were to choose X, then (because we are identical) you *would* choose X." They treat their own output as evidence of the other's output.
  *   **Asymmetry:** The pattern **falls apart** if they aren't alike.
      *   If Team A is 10x smarter than Team B, Team A cannot assume Team B will find the same solution. Team A must switch to causal modeling ("What will the dumb team do?").
      *   Superrationality requires a "common prior" and common reasoning capabilities.

  ### The Engineer's Takeaway

  You are seeing **Logical Correlation** masquerading as **Causal Coordination**.

  *   In the **Team** case, it's an illusion. The doc caused both. The "prediction" was post-hoc rationalization.
  *   In the **AI** case, it's real. The code causes both, but because the code is distributed, it looks like they are talking to each other.

  If you are building systems that need to coordinate without locks or network calls, you are looking for **Schelling Points** (design the system so there is only one obvious valid state) rather than **Superrationality** (hoping the agents figure it out). Superrationality is too brittle for production; Schelling Points are robust.
