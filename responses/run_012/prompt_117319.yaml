      *Wait, one nuance:* The user says "Two copies of the same model... no shared state." If they are truly isolated and have *any* randomness (dropout, sampling), they won't output the same thing unless the logic forces convergence. If the logic forces convergence, it's because the *problem* has a Schelling Point, not just because they are similar. I need to point out that Similarity + Problem Structure = Coordination. Similarity alone isn't enough.

