answer: |-
  You are standing squarely in the field of jurisprudence, specifically the branch concerned with the **sources of legal validity**. While there is no single, universally agreed-upon label that bundles the validity of the act, the fate of past acts, and the reliance on extra-legal acceptance into one phrase, the components you describe are well-mapped.

  The closest established concept is **a change in the Rule of Recognition**. However, because that term describes the *structure* of the change rather than the *tension* you are feeling (the fear that the bridge might collapse and take the past year with it), I will coin a term to capture the specific phenomenon of your co-op's dilemma. I call it **The Validity Handoff**.

  Below, I define this concept, distinguish it from its neighbors, and apply it to your boundary cases.

  ### 1. The Established Neighborhood
  Before defining the new term, we must clear the ground of existing terms of art.

  *   **Rule of Recognition:** In plain words, this is the ultimate rule that a community accepts as the test for whether any other rule is valid. In your co-op, the original amendment clause *was* your rule of recognition for bylaws. It told you what counted as a valid law (a two-thirds vote certified by the secretary).
  *   **Self-Amendment:** In plain words, this is when a rule changes its own text or conditions. Legal philosopher Peter Suber has written the definitive work on this (*The Paradox of Self-Amendment*). He distinguishes between a rule that allows itself to be changed (self-embracing) and a rule that cannot be changed (continuing).
  *   **Grundnorm:** In plain words, this is a hypothetical "basic norm" proposed by Hans Kelsen. It is the assumed starting point that says "you ought to obey the constitution." It stops the infinite regress of "why is this rule valid?" by simply asserting that the first rule is valid.

  Your situation is not merely **Self-Amendment**, because you are not asking if it is logically possible (you did it). You are asking what *sustains* it. It is not merely a **Grundnorm** question, because you are not looking for the first rule, but for the mechanism of switching from one rule to another.

  ### 2. The Coined Concept: The Validity Handoff
  **Definition:** A **Validity Handoff** occurs when a legal system changes the very rule that determines validity, relying on the community's acceptance to transfer authority from the old rule to the new one without a break in continuity.

  In your co-op, the "handoff" was the vote last year. The "old rule" (two-thirds, secretary certifies) tried to pass the baton to the "new rule" (majority, chair certifies). The **Validity Handoff** is the concept that covers three things simultaneously:
  1.  **The Source of Validity:** The new rule is not valid because the old rule said so (since the old rule is gone or altered), but because the members *accepted* the handoff.
  2.  **The Continuity Risk:** If the handoff is rejected (e.g., the Secretary's ruling is upheld), the new rule fails, and the system reverts to the old rule.
  3.  **The Retroactive Shadow:** If the handoff is deemed invalid, then acts performed under the new rule lack a source of authority, threatening to invalidate them.

  ### 3. Distinguishing the Edges
  You asked how this differs from three specific neighboring ideas.

  **A. Versus the General Paradox of Self-Amendment**
  The general paradox asks: *Can* a rule change itself? (Logic). The **Validity Handoff** asks: *Did* the change stick, and what holds it up? (Sociology/Validity).
  *   *The Difference:* The paradox is binary (possible/impossible). The Handoff is a process that can succeed or fail based on behavior. In your co-op, the logic was circular, but the Handoff succeeded because you operated under the new rule for a year. The "rule-shaped non-rule" you reached for (acceptance) is the fuel that powers the Handoff.

  **B. Versus the Foundational Norm (Grundnorm)**
  The **Grundnorm** is static; it sits at the bottom of the system and does not move. The **Validity Handoff** is dynamic; it describes the moment the bottom falls out and is replaced.
  *   *The Difference:* If you view your bylaws as a tree, the **Grundnorm** is the ground the tree stands on. The **Validity Handoff** is the act of uprooting the tree and planting it in new ground while keeping it alive. The "rule-shaped non-rule" (acceptance) is not a fourth thing; it is the *new ground* itself. It is the Rule of Recognition in its raw, pre-legal form.

  **C. Versus Ordinary Retroactivity**
  Ordinary **Retroactivity** applies a new substantive rule to past events (e.g., "No pets" applies to dogs adopted last year). Your problem is **Structural Retroactivity**.
  *   *The Difference:* Ordinary retroactivity changes *rights*. Structural retroactivity changes *authority*. The objection that "past amendments lapse" is not about the content of those amendments, but about whether the *machine* that produced them was running. This is a specific risk of a failed **Validity Handoff**. If the Handoff fails, the new machine was never turned on, and the old machine was turned off; anything made in the interim has no manufacturer.

  ### 4. The "Rule-Shaped Non-Rule"
  You asked if the thing you reached for (acceptance, custom, intent) is a fourth thing. It is not. It is the **Rule of Recognition** in its pre-formalized state.

  H.L.A. Hart, the legal philosopher who coined "Rule of Recognition," argued that at the bottom of every legal system, there is no written rule. There is only a **social fact**: officials (or members) *treat* certain rules as binding. When you amended your amendment clause, you temporarily exposed this plumbing. You saw that the written bylaws were not the ultimate source of validity; your collective *acceptance* was. The written rule is just evidence of the acceptance. When the written rule contradicted itself, you reached for the source code: the fact that you all kept showing up and voting.

  ### 5. Boundary Cases
  Here is how the **Validity Handoff** analyzes the edge cases you proposed:

  *   **An amendment that abolishes the authority that passed it:**
      *   *Example:* "The Board is hereby dissolved, and no new Board shall be elected."
      *   *Analysis:* This is a **Failed Handoff** (or "Legal Suicide"). A Validity Handoff requires a receiver. If the amendment destroys the mechanism needed to enforce the amendment, the Handoff fails. The system likely reverts to the state immediately prior to the vote, based on the presumption of continuity.
  *   **One that makes future amendment impossible:**
      *   *Example:* "This clause shall never be amended."
      *   *Analysis:* This is a **Frozen Handoff**. Under the theory of **Self-Embracing Sovereignty**, a rule can bind its future self. However, if the community later tries to amend it anyway, a new **Validity Handoff** occurs. The "never amend" clause will be ignored not because it was legally overridden, but because the community's acceptance (the true Rule of Recognition) shifted. The written rule becomes dead letter.
  *   **One passed under the old clause but purports to bind votes already taken:**
      *   *Example:* "All past votes are hereby ratified under this new standard."
      *   *Analysis:* This is a **Retroactive Handoff**. It attempts to cure the "Retroactive Lapse" objection. It is valid *if* the Handoff itself is accepted. It functions as a "healing clause." In your co-op, simply operating under the new rule for a year is a stronger healing clause than writing one. This is known as **Acquiescence**.

  ### 6. Application to Your Co-op
  To resolve your standing argument, you should categorize the events as follows:

  1.  **The Secretary's Objection:** This relies on the idea that the **Validity Handoff** requires the old rule to validate the new one *at the exact moment of the switch*. This is the "Continuing Sovereignty" view. It is logically strict but practically brittle. If accepted, it creates a **Validity Gap** where no rule is in force.
  2.  **The Lapse Objection:** This is the fear that the **Validity Handoff** broke the chain of title.
  3.  **The Resolution:** The Handoff succeeded. The "rule-shaped non-rule" (your collective acceptance and operation under the new clause for a year) cured the defect. In law, this is often called **De Facto Validity**. The acts are valid not because the old rule permitted them, but because the community treated them as valid at the time.

  **Recommendation:**
  Draft a "Ratification Clause" to be passed under the *current* (new) rules. It should state: *"All amendments passed between [Date] and [Date] are hereby ratified and confirmed as valid, regardless of the procedural rules in force at the time."*

  This does not change the past; it uses the current, accepted authority to build a bridge back to the contested period. It completes the **Validity Handoff** by explicitly securing the loose ends.
