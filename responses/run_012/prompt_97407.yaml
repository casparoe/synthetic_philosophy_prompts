answer: |-
  # The Knowledge Argument: A Decision Tree

  **Instructions:** Begin at the root. Answer each question based on your judgment of the case described. Follow the branch corresponding to your answer until you reach a leaf. Notes on empty logical space or indistinguishable positions appear in brackets where relevant.

  ### **Root Node**
  **Q1. Do you trust the core intuition that, upon release, Mary gains a new epistemic good she lacked in the room?**
  *(Consider the standard case: Mary knows all physical facts but has never seen colour. Upon seeing red, does she gain something?)*

  *   **NO** → Go to **Q2**.
  *   **YES** → Go to **Q3**.

  ---

  ### **Branch: NO (The Intuition is False)**

  **Q2. Is the intuition wrong because the "newness" is a cognitive illusion about the nature of experience itself?**
  *(Consider the variant where Mary has memorised every physical fact but cannot imagine any experience she has not had. Is her feeling of surprise merely a glitch in her cognitive processing?)*

  *   **YES** → **LEAF: The Deflationary or Illusionist View**
      *   *Awkward Commitment:* You must maintain that the vivid reality of colour experience is a user-illusion generated by the brain.
      *   *[Note: The thought experiment's author eventually came to think the argument it launched was unsound.]*
  *   **NO** → **LEAF: A Priori Physicalism**
      *   *Awkward Commitment:* You must maintain that Mary could, in principle, have deduced the experience of red from the physical data alone.

  ---

  ### **Branch: YES (The Intuition is True)**

  **Q3. Is what Mary gains strictly a capacity to act or imagine, rather than knowledge of a truth?**
  *(Consider the prosthetic vision variant: Mary can switch colour vision on and off. If she only gains the ability to operate the switch and recognize signals, is that all she learns?)*

  *   **YES** → **LEAF: The Ability Hypothesis**
      *   *Awkward Commitment:* You must explain why Mary seems to learn a truth about the world rather than just acquiring a skill.
  *   **NO** → Go to **Q4**.

  **Q4. Is the knowledge a direct relation to a property (acquaintance) rather than a belief that something is the case?**
  *(Consider the gradual return variant: Mary's colour vision returns over a week. Is she simply becoming directly acquainted with a property she previously knew only by description?)*

  *   **YES** → **LEAF: The Acquaintance Hypothesis**
      *   *Awkward Commitment:* You must explain how a non-propositional relation can count as "knowledge" in the sense required by the argument.
  *   **NO** → Go to **Q5**.

  **Q5. Does her new knowledge reveal a fact that was *not* logically entailed by the complete physical truth she knew in the room?**

  *   **YES** → Go to **Q6**.
  *   **NO** → Go to **Q7**.
      *   *[Note on Empty Space: The combination "Entailed by Physical Truth" + "New Fact" is incoherent; if it is entailed, it is not a new fact.]*

  **Q6. Is this new fact about a property that is non-physical in its fundamental nature?**

  *   **YES** → **LEAF: The New-Fact Dualist View**
      *   *Awkward Commitment:* You must explain how non-physical properties causally interact with the physical brain without violating conservation laws.
  *   **NO** → **LEAF: The Russellian Monist or Primitivist View**
      *   *Awkward Commitment:* You must explain why fundamental physics describes only structural relations and misses the intrinsic nature of matter.
      *   *[Note on Empty Space: The combination "New Fact" + "Physical/Structural Property" is unoccupied because Mary already knew all structural physical facts in the room.]*

  **Q7. Is the new concept essentially indexical or self-locating (e.g., "this" experience happening now)?**

  *   **YES** → **LEAF: The Self-Location or Indexical Account**
      *   *Awkward Commitment:* You must explain why "this experience" could not be identified via a unique physical description in the room.
  *   **NO** → Go to **Q8**.

  **Q8. Is the phenomenal character of the experience identical to its representational content about the world?**
  *(Does the "what-it-is-like" consist entirely of representing external properties, or is it a property of the conceptual vehicle itself?)*

  *   **YES** → **LEAF: Representationalism**
      *   *Awkward Commitment:* You must explain cases of misrepresentation or inverted spectra without appealing to non-representational qualia.
  *   **NO** → **LEAF: The Phenomenal-Concept Strategy**
      *   *Awkward Commitment:* You must explain why the distinctive phenomenal concepts cannot be functionally reduced to physical concepts.
      *   *[Note on Indistinguishable Leaves: In practice, Representationalism and the Phenomenal-Concept Strategy often answer every node identically; the debate frequently turns on whether the distinction between content and vehicle is substantive or merely terminological.]*
