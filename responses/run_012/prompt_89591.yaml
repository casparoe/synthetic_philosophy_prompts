answer: |-
  This is a classic move in moral philosophy. Your roommate is essentially channeling Jeremy Bentham or, more recently, Fred Feldman. The "Common Currency" argument is the backbone of classical utilitarianism: if we can't measure it, we can't maximize it.

  However, your intuition that the analogy might be "smuggling" assumptions is correct. Economic analogies are seductive because they feel precise, but they often import economic assumptions into metaphysics where they don't belong.

  Here is the audit of your roommate's Money Analogy.

  ### Part 1: The Mapping
  To see if the analogy holds, we first have to formalize the correspondence your roommate is proposing.

  | Economic Concept | Hedonistic Concept | Role in the System |
  | :--- | :--- | :--- |
  | **Currency (Money)** | **Pleasure/Pain (Hedons)** | The universal medium of exchange and measurement. |
  | **Goods/Services** | **Experiences/Events** | The things being valued (peach, toothache, breakup). |
  | **Price** | **Intensity/Duration** | The "cost" of the experience in hedonic units. |
  | **Exchange Rate** | **Trade-offs** | How much pain one will endure for how much pleasure. |
  | **The Bank** | **Consciousness/Mind** | The ledger where the balance is kept. |
  | **Purchasing Power** | **Motivational Force** | How strongly the experience drives action. |
  | **Market Value** | **Moral Value** | The final ranking of the state of affairs. |

  ### Part 2: Where the Analogy Breaks
  The analogy looks clean on a whiteboard, but it fractures when you touch reality. Here are the four structural failures.

  #### 1. The Instrumentality Trap (The Fatal Flaw)
  **The Break:** Money is *purely instrumental*. You do not want a $10 bill for itself; you want it for what it can get you. If you were locked in a room with a pile of cash and nothing to buy, the money is worthless.
  **The Hedonist Claim:** Hedonism claims pleasure is *intrinsically* good. It is the *end goal*, not the means.
  **The Contradiction:** By calling pleasure "money," your roommate inadvertently turns pleasure into a means. If pleasure is the currency, **what are we buying?**
  *   If we are buying "satisfaction," then satisfaction is the real good, not the pleasure.
  *   If we are buying "nothing" (pleasure is the final stop), then it's not money; it's the *goods* themselves.
  **Verdict:** The analogy undermines the core definition of hedonism. It treats the *final good* as if it were a *tool*.

  #### 2. The Homogeneity Assumption
  **The Break:** A dollar in your pocket is identical in kind to a dollar in mine. They are fungible.
  **The Hedonist Claim:** All pleasure contributes to the same sum.
  **The Reality:** The "feel" of solving a math problem is phenomenologically different from the "feel" of eating a peach. John Stuart Mill admitted this (higher vs. lower pleasures), but doing so breaks the money analogy. If some dollars are "gold dollars" and some are "paper dollars," you need a second standard to rank them.
  **Verdict:** The analogy assumes uniformity to prove uniformity. It hides the qualitative differences that make people doubt hedonism in the first place.

  #### 3. The "Bank" Problem (Subjectivity)
  **The Break:** In economics, the bank is an external authority that verifies the balance.
  **The Hedonist Claim:** The mind is the bank.
  **The Reality:** Minds are terrible accountants. We have "hedonic forecasting errors." We think a breakup will hurt forever; it doesn't. We think a new car will make us happy; it doesn't. If the "currency" fluctuates in value depending on who is holding it and when, it's not a stable currency. It's more like a volatile stock.
  **Verdict:** Money requires stability to function as a metric. Pleasure is notoriously unstable.

  #### 4. Negative Values
  **The Break:** You can have negative money (debt), but debt is just a promise to pay positive money later.
  **The Hedonist Claim:** Pain is negative pleasure.
  **The Reality:** Is pain just the absence of pleasure? Or is it a positive state of its own? A toothache isn't just "not enjoying a peach"; it is an active, aggressive sensation. In the money analogy, pain is treated as a "cost," but in experience, pain is often an "intruder."
  **Verdict:** The analogy flattens the active nature of suffering into a mere subtraction.

  ---

  ### Part 3: Auditing Your Specific Worries

  #### 1. Does it assume the thing in dispute? (Circularity)
  **Yes.** This is the strongest point you have against your roommate.
  Money works as a common scale *only because we collectively agree to treat it as one*. It is a social convention. Your roommate is using a convention to prove a natural fact.
  *   **The Circle:** "Why can we compare a peach and a poem?" "Because they both have a price in pleasure." "How do we know they have a price in pleasure?" "Because we can compare them."
  *   The analogy asserts commensurability (that everything *can* be compared) by using a tool (money) that *requires* commensurability to exist. It doesn't explain *why* the mind ranks them on one scale; it just assumes the mind operates like a market.

  #### 2. Incommensurability (The "Priceless" Objection)
  The money analogy cannot survive the concept of the "sacred." In a market, everything has a price. If I offer you enough money, you will sell anything.
  *   **The Case:** Would you torture a child for a lifetime of orgies? A strict hedonist calculator might say "Yes, if the math works."
  *   **The Analogy Failure:** Most people feel some values are *incommensurable*—not just expensive, but outside the market. The money analogy forces these values into the market, distorting them. It suggests that if you refuse the trade, you are just "bad at math," rather than holding a different value system entirely.

  #### 3. Intrinsic vs. Instrumental (The "Same Pleasure" Case)
  You asked about a pleasure wanted for its own sake by one person and instrumentally by another.
  *   **Example:** Listening to a song. Person A loves the sound (intrinsic). Person B listens to study for a test on the song (instrumental).
  *   **The Analogy Failure:** Money is *always* instrumental. The analogy cannot distinguish between enjoying the currency itself vs. spending it. If pleasure is the money, Person A is hoarding cash, and Person B is spending it. But hedonism says the *feeling* is the good. The analogy makes the *feeling* look like a receipt, not the product.

  #### 4. Sensory vs. Attitudinal (The "Feel" vs. The "Thought")
  *   **Sensory:** Tasting a peach (has a specific qualia/tingle).
  *   **Attitudinal:** Being glad your team won (a cognitive stance, no specific "tingle").
  *   **The Analogy Failure:** Money is physical (or digitally consistent). It implies a uniform substrate. But attitudinal pleasure doesn't feel like sensory pleasure. If I say "I have 10 hedons of peach" and "I have 10 hedons of pride," the analogy implies these are the same *stuff*. They aren't. One is a sensation; the other is a judgment. The money analogy glosses over this by calling them both "currency," effectively hiding the hard problem of consciousness.

  ---

  ### Part 4: Is There a Better Analogy?

  Honestly? **No.** And that is the point.

  Analogies for hedonism tend to fail because hedonism is a claim about the *fundamental ontology of value*.
  *   **Calories?** (Energy in/out). Fails because pain isn't just "negative calories," and value isn't biological fuel.
  *   **Language?** (Grammar of value). Fails because language is arbitrary; hedonism claims value is natural.
  *   **Physics?** (Vectors of force). Fails because human motivation isn't Newtonian.

  **The Verdict:**
  Your roommate should stop leaning on the money analogy. It does more work for **Preferentism** (the theory that satisfying desires is the good) than for **Hedonism**.
  *   In Preferentism, "Money" = "Satisfaction of Preference." This works better because preferences *are* often traded off like currency.
  *   In Hedonism, "Money" = "Feeling." This fails because feelings aren't fungible tokens.

  **How to reply to him:**
  > "The money analogy only works if value is a social agreement, but you're claiming pleasure is a natural fact. Money is instrumental (a means to buy things), but you claim pleasure is intrinsic (the thing we want). If pleasure is the money, what are we buying? If the answer is 'nothing,' then it's not money, it's the goods. And if it's the goods, you can't use it to measure the goods. You're using the product to weigh the product."

  **Final Recommendation:**
  Tell him to drop the analogy. It's a rhetorical shield that protects the theory from scrutiny by making it sound like "common sense economics." The real debate isn't about accounting; it's about whether the *feeling* of a peach and the *knowledge* of a victory are actually the same kind of thing. The money analogy assumes they are; it doesn't prove it.
