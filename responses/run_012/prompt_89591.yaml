      *   *Intrinsic vs. Instrumental:* Money is *always* instrumental. You don't want $10 bills for themselves; you want what they buy. Pleasure is supposed to be *intrinsically* good. If pleasure is the money, is it just a means to something else? This flips hedonism on its head.
