      *   *Section 1: The Relationship (Collapse or Conflict?):* Argue that they aren't mutually exclusive but rather *form* and *content*. Maximizing is the logical form (PSR requires a max); Structural is the metric (what counts as max).
      *   *Section 2: Where they come apart (The Infinite Regress Problem):* This is the key technical point. If perfection is just "more reality," there is no max. If perfection is "lawfulness," there is a unique solution. The Structural reading saves the Maximizing reading from mathematical incoherence.
