      *   *Section 4: Theodicy:* This is the user's practical concern. Maximizing = Utilitarianism (evil as cost). Structural = Aesthetic/Organic (evil as limitation/shadow). The Structural reading is the only defensible one against Voltaire.
      *   *Conclusion/Verdict:* Bet on the Structural reading as the *philosophically robust* core, but admit Leibniz needs the Maximizing language for the PSR. The "Best" is a unique solution to a variational problem, not a sum.

  8.  **Refining the Argument (Self-Correction during drafting):**
