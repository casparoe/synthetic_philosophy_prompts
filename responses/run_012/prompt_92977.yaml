answer: |-
  **The shortlist**

  1.  **The Ontology of Synthetic Provenance:** When AI fabricates both image and history, does the object instantiate a new work, a forgery, or a simulation? This clarifies whether we are discussing one object with two histories or two distinct ontological kinds, addressing the collision between locus 1 (causal history) and locus 3 (institutional practice).
  2.  **The Normative Source of Indexical Value:** Is the value of the original intrinsic (causal contact with the genius) or instrumental (trust in the institution)? This determines whether perfect fakes degrade aesthetic value or merely market confidence, prioritizing locus 1 against locus 3.
  3.  **The Relational Function of Authenticity:** Does the original serve a unique role in human flourishing or relationship to the dead, distinct from property rights? This moves beyond the "swap test" to ask what work authenticity does for the viewer, integrating locus 1 (causal) with a broader ethical framework.

  **Why this order**

  The first question is strictly upstream because it defines the battlefield. If synthetic provenance creates a new ontological category, the "original versus copy" frame collapses; we are simply comparing two different kinds of objects. This is highly tractable for philosophers specializing in metaphysics and identity conditions, requiring no empirical data. It would be demoted if legal frameworks settle the category of "AI art" as distinct from "human art" within the next year, rendering the philosophical debate moot. However, until then, without knowing what the object *is*, we cannot determine its value.

  The second question builds on the first. Assuming distinct objects, we must determine why the causal history (locus 1) carries weight. Is it sacred contact, or merely a heuristic for quality? This is core value theory. Philosophers can dissect the difference between intrinsic and relational value without needing psychological studies. It would be promoted if market behavior suggests collectors value history even when knowing it is fake (suggesting intrinsic value), or demoted if institutional designation (locus 3) proves to be the sole driver of price and prestige.

  The third question addresses the human element often ignored in pure ontology. It asks whether the "loss" felt in the swap scenario is aesthetic or existential. This is tractable as a conceptual analysis of human relationships to artifacts. It would be promoted if arguments emerge showing that aesthetic experience is inherently relational, not just perceptual. It is placed last because it depends on the first two: we must know what the object is and why it has value before analyzing how it functions in a life. This ordering ensures the team builds a metaphysical foundation before constructing an axiology.

  **Overrated**

  The "Swap Test" itself is a trap. Your colleague suggests that if relabeling changes no experience, there is no aesthetic loss. This assumes aesthetic value supervenes entirely on phenomenology (locus 2). This question consumes energy but dissolves once you notice it begs the question against historical value. If value lies in causal history (locus 1), the swap *is* a loss, regardless of experience. Funding a team to defend or attack the swap test is less productive than asking why we assume experience exhausts value.

  Similarly, "The Moral Wrong of Forgery" is often conflated with aesthetic loss. Philosophers should separate fraud (lying about history) from the ontological status of the copy. A perfect fake with honest provenance (an admitted replica) poses the same philosophical puzzle without the crime. Focusing on morality distracts from the ontology of value.

  Finally, "The Search for Micro-Differences" is overrated for philosophers. Conservators look for brushwork; philosophers should assume indistinguishability by stipulation. Seeking perceptual escapes admits defeat if the premise is perfect copying. This is empirical work, not conceptual, and relies on technology outpacing philosophy.

  **What would move the ranking**

  Legal precedents regarding AI copyright and provenance fraud would immediately demote the Ontology question if courts establish a rigid binary between "human" and "synthetic" works. Conversely, if blockchain verification becomes the standard for provenance, rendering physical causality irrelevant, the Normative Source question jumps to priority; we would need to understand why digital chains replace physical touch. Finally, if phenomenological research demonstrates that humans *always* perceive subtle differences in originals versus copies, the Swap Test critique becomes empirical, moving it out of philosophy entirely.
