      7.  Explicit Exclusions.

  *   **Refining the Payoff:** The "Problem of the Criterion" (Chisholm/Pyrrhonism) is heavy. I need to translate it to "The Hermeneutical Circle." The criteria presuppose a theory of early Christian tendency to prove facts about Jesus, but the theory of tendency comes from comparing facts about Jesus. The solution is *coherence* and *burden shifting*, not *foundationalism*.

