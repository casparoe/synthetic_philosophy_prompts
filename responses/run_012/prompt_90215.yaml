answer: |-
  Here is a teaching plan designed for a 75-minute session, structured to prioritize epistemic clarity over historiographical detail.

  ### 1. The Preconditions: What Must Land First
  You are correct that "authentic saying vs. picture of Jesus" and "defeasible tie-breaker" are crucial. However, there is a prior condition that must be established before those make sense.

  **The Gap of Transmission.**
  Before introducing criteria, you must establish *why* we cannot simply read the text. Second-years often assume the Gospels are either "biographies" (direct access) or "theology" (no access). You need them to see the **oral period** as a site of *selection*, not just distortion.
  *   **The Concept:** The early church didn't just *change* sayings; they *kept* some and *dropped* others.
  *   **Why it matters:** The criteria are tools to explain *why* a specific unit survived the selection process. If they don't grasp that the text is a curated remnant, the criteria look like detective tools for forgery rather than probabilistic tools for survival.

  **Sequence of Concepts:**
  1.  **The Gap:** Text $\leftarrow$ Oral Tradition $\leftarrow$ Historical Event.
  2.  **The Goal:** We aren't looking for "truth" in a theological sense, but "probability of origin" in a causal sense.
  3.  **The Tool:** A criterion is a **burden-shifter**, not a truth-detector. (This validates your intuition).

  ---

  ### 2. The Teaching Sequence (75 Minutes)

  **00:00 – 10:00 | The Epistemic Gap**
  *   **Hook:** Put two texts on the board. Mark 1:9 (Baptism) and John 1:29 (Lamb of God). Ask: "Did the historical Jesus know he was the Lamb of God?"
  *   **Point:** The Gospels agree on *significance*, not *data*. We have a 40-year gap between event and text.
  *   **Define the Task:** We are trying to move from the *theological necessity* of the early church to the *historical contingency* of the man.

  **10:00 – 25:00 | Defining the Tool (Epistemology First)**
  *   **Definition:** A criterion is not a pass/fail test. It is a **presumption**.
  *   **Analogy:** Use a legal analogy. "Innocent until proven guilty" doesn't prove innocence; it shifts the burden of proof to the prosecution.
  *   **Application:** The Criterion of Embarrassment doesn't prove a saying is true. It says: *"The burden of proof lies on whoever claims the church invented this."*
  *   **Head off Misconception (Additivity):** Explicitly state: "Passing three criteria does not make something 3x true. It just means there are three different reasons why the burden of proof is heavy for the skeptic."

  **25:00 – 50:00 | The Carrier Example: Mark 13:32**
  *   **The Text:** *"But about that day or hour no one knows, not even the angels in heaven, nor the Son, but only the Father."*
  *   **Why this example?**
      *   **Embarrassment:** It limits Jesus' omniscience. High Christology (post-70 CE) struggles with this.
      *   **Dissimilarity:** It differs from the later church's view of the exalted Lord, *and* it differs from typical Jewish apocalyptic seers (who usually claim to know).
      *   **Coherence:** It fits the "prophet of imminent judgment" picture.
      *   **Multiple Attestation (The Trap):** Show Mark 13:32. Then show Matthew 24:36. Note that Matthew *copies* Mark.
  *   **Activity:** Ask them: "If you were writing a Gospel in 85 CE to convince people Jesus is Lord, do you invent this line?"
  *   **Head off Misconception (Synoptics):** Use this moment to kill the "Matthew, Mark, Luke = 3 witnesses" idea. Show that Matthew having it is *dependent* attestation, not independent.

  **50:00 – 60:00 | Misconceptions & Limitations**
  *   **The "Strange Jesus" (Dissimilarity):** Ask: "If we only keep what is dissimilar to Judaism and the Church, do we get a real man?" (No, we get a martian).
  *   **The "Objective Science" Trap:** Acknowledge that applying "embarrassment" requires a judgment call on what the early church found embarrassing. That is subjective.
  *   **The Middle Ground:** It is not "hopelessly subjective." It is **Inference to the Best Explanation**. We are weighing which hypothesis (Invention vs. Retention) requires fewer ad-hoc assumptions.

  **60:00 – 70:00 | The Philosophical Payoff (The Problem of the Criterion)**
  *   **The Pivot:** "Here is the philosophical problem. To use the Criterion of Embarrassment, I need to know what the early church found embarrassing. To know what they found embarrassing, I need to know what they invented. To know what they invented, I need to know what Jesus actually said."
  *   **The Circle:** The criteria presuppose a picture of the early church to find Jesus, but we build the picture of the early church from the data about Jesus.
  *   **The Resolution:** This is not a *vicious* circle; it is a **hermeneutical spiral**. We don't find "facts"; we establish **warranted assertibility**. The criteria don't *find* the historical Jesus; they *constrain* the hypotheses we are allowed to propose.
  *   **Key Phrase:** "The criteria do not license a picture of Jesus; they police the boundaries of plausible pictures."

  **70:00 – 75:00 | Assessment & Close**
  *   **The Question:** (See below).
  *   **Dismissal:** Remind them this is a tool for historians, not a tool for faith or skepticism.

  ---

  ### 3. The Carrier Example: Choice and Rationale

  **Choice:** **Mark 13:32 ("The Son does not know...")**
  **Alternative:** *The Baptism of Jesus.* (I recommend 13:32 for a philosophy-led session).

  **Why 13:32 over Dissimilarity?**
  Dissimilarity is too abstract for a first pass. It requires knowing "Judaism" and "Early Church" as baseline categories. Embarrassment relies on basic social psychology (reputation management), which undergrads grasp intuitively.

  **Why 13:32 over The Baptism?**
  The Baptism is a *narrative event*. 13:32 is a *saying*. Since your brief is "authentic saying," 13:32 is cleaner. It also avoids the "John the Baptist cult" complexity.

  **What makes it backfire?**
  *   **Risk:** Students may think "Embarrassing = True" (Inverse Apologetics).
  *   **Mitigation:** You must emphasize that the church *did* keep this saying. Therefore, they must have had a reason (e.g., it was too well-known to drop). The criterion explains why it *survived*, not necessarily why it happened. It shifts the burden to the person claiming it's an invention to explain *why* they kept it.

  ---

  ### 4. Mapping Misconceptions to the Sequence

  | Misconception | Where to Head It Off | How to Frame It |
  | :--- | :--- | :--- |
  | **Additivity (Voting)** | **10:00–25:00** (Defining the Tool) | "Criteria are not points in a game. They are distinct lines of argument. Three weak lines don't make a strong rope if they all snap the same way." |
  | **Multiple Attestation (Synoptics)** | **25:00–50:00** (The Example) | Use Mark vs. Matthew on 13:32. "Matthew is not a witness; he is an editor. Independent attestation means different *traditions*, not different *books*." |
  | **Dissimilarity (Neutral Jesus)** | **50:00–60:00** (Limitations) | "If you filter out everything Jewish and everything Christian, you aren't left with the historical Jesus. You're left with a vacuum." |
  | **Objective vs. Subjective** | **60:00–70:00** (Payoff) | "It's not objective science (like chemistry), but it's not mere opinion. It's legal-style probabilistic reasoning." |

  **Which to leave as a live question?**
  Leave **Objective vs. Subjective** live. Tell them: "Scholars still fight about whether 'embarrassment' is a cultural projection. You should too." This encourages critical engagement rather than rote acceptance.

  ---

  ### 5. The Epistemological Payoff

  **Is it too much?**
  No, provided you avoid the label "Problem of the Criterion" (Chisholm/Pyrrhonism) until the end, or use it only as a caption. Second-years can handle circularity if framed as "Which comes first, the tool or the job?"

  **Where does it go?**
  It must be the **climax**, not the intro. If you start with it, they have no concrete data to care about.
  *   **The Landing:** It lands as a payoff if you frame it as **intellectual maturity**. "Anyone can memorize the criteria. A scholar understands why the criteria are circular and uses them anyway."
  *   **The Message:** "We use these tools not because they guarantee truth, but because they prevent us from claiming certainty where we only have probability. They are humility engines."

  ---

  ### 6. The Final Five-Minute Question

  Do not ask them to define a criterion. Ask them to apply the *logic of the burden of proof*.

  **The Question:**
  > "Imagine we find a saying of Jesus that fits perfectly with the theology of the early Church, fails the criterion of dissimilarity, and is attested in only one late Gospel. A scholar claims this saying is *definitely* authentic. Based on today's session, where has their argument failed?"

  **What you're looking for:**
  *   **Bad Answer:** "Because it fails the criteria." (Recitation).
  *   **Good Answer:** "They haven't shifted the burden of proof. If it fits the Church's theology perfectly, the presumption is that they *created* it. To prove it's authentic, they need a specific reason why the Church wouldn't have invented it, not just a claim that it's true."

  ---

  ### 7. What to Explicitly Exclude

  To stay within 75 minutes and maintain philosophical focus, openly state you are **not** covering:

  1.  **The Synoptic Problem:** "We are assuming Markan priority for today's example, not proving it. Don't get bogged down in Q."
  2.  **The Verdict on Jesus:** "I am not here to tell you what the Historical Jesus actually said. I am here to tell you how scholars argue about it."
  3.  **Theological Truth:** "Authenticity does not equal authority. A made-up saying can be theologically true; an authentic saying can be historically contingent. We are doing history, not theology."
  4.  **The Full List:** "We are using Embarrassment as our case study. I am not going to define Coherence or Palestinian Environment in detail; you will see how they function through the logic of the example."

  This plan keeps you in your lane as the epistemologist while giving the theology students the historiographical scaffolding they need to use the tools correctly.
