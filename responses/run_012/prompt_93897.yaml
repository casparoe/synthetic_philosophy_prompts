answer: |-
  In statistics, bias is not an intrinsic property of a number; it is a relation between an estimate and a target. An estimator is biased only relative to the specific quantity it aims to capture. If we transplant this structure into moral psychology, calling an attitude a "bias" presupposes a target: the moral truth, the agent's deeper values, or the verdict of an ideal procedure. The central difficulty is that every candidate target seems either unavailable or circular. If the target is moral truth, labeling something a bias assumes we already know the truth we are missing. If the target is the agent's deeper values, we can always redescribe a surface impulse as a deep value or vice versa, depending on where we draw the partition. Despite this, we routinely distinguish between moral preferences and moral biases, treating the latter as defects to be corrected and the former as views to be respected. To determine if this distinction holds water, we must identify what work it is supposed to do and whether it can be grounded without begging the question.

  To do real work, the preference/bias distinction must allow us to bypass substantive disagreement about the merits of a view and challenge the capacity of the holder to engage. If I claim your opposition to my policy is a mere preference, I must argue that your conclusion is wrong. If I claim it is a bias, I argue that your mechanism for forming conclusions is broken. The distinction shifts the burden from "you are mistaken" to "you are malfunctioning." It licenses interventions—psychological, educational, or institutional—that would be impermissible if the attitude were merely a competing preference. It transforms a political opponent into a patient or a subject of correction.

  The skeptical case for collapsing this distinction is strong. It argues that "bias" is merely a rhetorical label for attitudes we reject, dressed up in pseudo-scientific clothing. The etiological facts usually offered as evidence of bias—socialization, trauma, adaptive preference, raw affect—seem irrelevant to justification. This is the genetic fallacy: where a conviction came from does not determine whether it is true. A belief formed in the heat of anger might be correct; a belief formed through cold calculation might be wrong. If the target is moral truth, calling an attitude biased simply asserts that it misses the target. But since the target is the very thing in dispute, the accusation of bias becomes circular. It amounts to saying, "You are biased because you are wrong, and you are wrong because you are biased." On this view, there are only moral claims and counter-claims; the category of bias adds nothing but pejorative force.

  However, the distinction survives if we shift the target from *truth* to *responsiveness*. Some attitudes are defective not as conclusions, but as attitudes. A preference is held because the agent takes there to be reasons for it; a bias is held because revising it is psychologically costly or because the agent is insensitive to the considerations that would ordinarily count against it. A preference survives counterfactual scrutiny: if the reasons changed, the view would change. A bias persists regardless of the reasons. This separates commitment from compulsion. The target, therefore, is not a specific moral verdict, but the functional relationship between evidence and judgment.

  To operationalize this, I propose the **Counterfactual Reason-Responsiveness Test (CRRT)**. 
  *Formulation:* An attitude counts as a bias if the agent admits (or it is demonstrated) that they would retain the attitude even if the factual or normative premises currently supporting it were proven false or reversed. 
  This test is mechanical: it isolates the dependency of the judgment on its stated grounds.

  Consider two hard cases. 
  Case (a): An agent was raised in a cult that taught hatred of outsiders (distorting etiology). However, upon leaving, the agent studied philosophy and now maintains the attitude solely based on a specific argument about resource scarcity. 
  *Application:* Under the CRRT, if the resource scarcity argument were disproven, would the agent abandon the hatred? If yes, the attitude is a **preference**. 
  *Verdict:* Despite the distorting origin, the current state is reason-responsive. 
  *Cost:* We must engage substantively with the resource argument rather than dismissing the agent as brainwashed. This is costly because it grants legitimacy to a view born of abuse.

  Case (b): An agent arrived at a view on justice through decades of impeccable study and reflection (impeccable etiology). However, they admit that no amount of counter-evidence regarding suffering would change their mind because the view is an axiom. 
  *Application:* Under the CRRT, if the factual premises about suffering were reversed, would the agent change? No. 
  *Verdict:* Despite the impeccable origin, the attitude is a **bias**. 
  *Cost:* We label a deeply held, carefully formed conviction as pathological. This risks silencing rigid but potentially correct moral minorities.

  These verdicts are costs I can absorb. The first cost acknowledges that moral redemption is possible; origin does not seal fate. The second cost acknowledges that intellectual pedigree does not immunize one against dogmatism. The CRRT prioritizes the current structure of judgment over its history.

  Does this distinction deserve normative weight? Yes, but the weight shifts depending on the context. Respecting a moral preference is a requirement of pluralistic coexistence; correcting a moral bias is a requirement of rational integrity. In matters concerning the agent's own good, we may tolerate biases as personal quirks, though they represent self-harm if they block improvement. In the treatment of others, biases demand correction because they imply an inability to recognize the standing of others as reason-givers. In the design of shared institutions, the distinction is crucial. Institutions should accommodate preferences (diversity of ends) but filter for biases (defects in means). A legislature full of conflicting preferences is healthy; a legislature full of biases is broken, because biases cannot be aggregated or compromised—they are fixed points that refuse to move with evidence.

  Ultimately, the distinction between moral preference and moral bias is real, but only relative to a specified target. I commit to the view that the correct target is **procedural rationality**, not substantive moral truth. We cannot define bias as "error" without begging the question, but we can define it as "insensitivity." This avoids circularity because it does not assume the content of the truth, only the mechanism of seeking it. A compass is not biased because it points North; it is biased if it points North regardless of magnetic fields. Similarly, a moral agent is not biased because they hold a controversial view; they are biased if they hold it regardless of reasons.

  This position rejects the collapse argument by showing that the structure of judgment is distinct from the content of judgment. It rejects the naive survival argument by admitting that the distinction is narrow: it catches only those attitudes that are causally decoupled from their justifications. By anchoring the target in reason-responsiveness, we preserve the utility of the distinction without claiming access to moral truth. We lose the ability to dismiss opponents simply by diagnosing their upbringing, but we gain the ability to identify when dialogue is impossible. The work the distinction was doing—licensing correction over accommodation—remains valid, but only where the machinery of reasoning itself has stalled.
