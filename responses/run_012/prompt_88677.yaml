prompt: |-
  Okay so I'm a second-year PhD student in political theory, mostly working on labor and distributive justice, and I've been carrying around a view I cant quite shake. I want you to try to break it. Treat yourself as a political philosopher who actually works on work, time, and labor law — not someone who's going to hand me a survey of the 35-hour week literature. Think it through carefully, and maybe start by just brainstorming every candidate objection you can come up with before you sort them.

  Here's the view. It's got three parts and I'm not totally sure they hang together. (1) Work is morally optional and leisure is the default; the burden of proof sits on whoever wants to conscript my hours. (2) The usual defenses of leisure — autonomy, health, rest as recovery so you can work more — are all weaker than the real one, which is about who gets to command your time. (3) The Protestant work ethic isn't just a historical thesis about how capitalism got going; it's a live normative structure that explains why our legal systems treat work as a right and leisure as a concession you have to earn.

  I've also been distinguishing clock-hours from what I've been calling ambient availability — the way a job claims your attention and your anticipatory dread outside the paid hours. My hunch is that karoshi is basically an ambient-availability phenomenon, which is why it turns up in places with perfectly normal statutory hour caps, and why a real 35-hour week can be law and still not touch the thing that actually kills people. I think that's the strongest part of the view and also the part I'm most likely fooling myself about.

  So: what would count against this? I want the defeaters ranked, from the ones that should actually make me drop it down to the ones that are merely awkward. I'm especially interested in:

  - which parts of the view are empirical and which are conceptual, and which empirical findings would be decisive versus merely inconvenient;
  - whether "work is optional, leisure is default" is even coherent given that somebody has to produce stuff, and what that objection actually shows — a fatal flaw or just a missing distribution principle;
  - whether a right to leisure with no identifiable duty-bearer is a right in name only, and how much that matters;
  - whether the work/leisure distinction is itself a Protestant-industrial artifact, which would make the position weirdly self-undermining — a right to leisure that only makes sense inside the ideology it's supposed to be fighting;
  - what a defender of the view would themselves concede counts against it, as opposed to what a critic would say;
  - and honestly, whether the Protestant-ethic part of this is falsifiable at all, or whether it's the kind of thing that explains both the workaholic and the conspicuous idler and so explains nothing. If it's insulated, tell me whether that's fatal or just the price of a view like this.

  No citations or reading lists, please — I don't have library access right now and you'd just be guessing anyway. Just the arguments.

  Tell me how confident you are in the main claims you make, and single out the one point in your answer you're least sure about. Write it in American English.
