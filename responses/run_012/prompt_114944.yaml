answer: |-
  This is a fantastic plan. You have correctly identified that the Two-Envelopes Problem (TEP) is best understood as a failure of *context*, not just arithmetic. Your intuition about the "Banker Round" is particularly sharp—that is exactly where the hidden assumption (the prior distribution) gets exposed.

  Here is the full runnable game design, tailored for a 90-minute library session with a lay audience.

  # Game Title: "The Switch"

  ## 1. Materials & Setup
  *   **Envelopes:** 40–50 opaque envelopes. (Brown paper lunch envelopes work best; they must be identical).
  *   **Tokens:** Poker chips, laminated point cards, or candy. (Do **not** use real money; it triggers gambling laws and emotional risk-aversion that muddies the logic).
  *   **The Deck:** You need pairs.
      *   *Correction to your pool:* {2, 4, 8, 16, 32, 64} is too small. If someone sees 64, they know not to switch. If they see 2, they know to switch. This kills the paradox immediately.
      *   *Recommended Pool:* Use a wider range to obscure the boundaries. Create pairs like (10, 20), (20, 40), (40, 80)... up to (640, 1280). Or, simpler: Write numbers on slips of paper and put them in envelopes. Use a range like 10 to 1000, ensuring for every $X$ there is a $2X$ available in the deck, but **do not reveal the maximum value** to the players.
      *   *Quantity:* Prepare 20 pairs. Shuffle them into a "Draw Pile."
  *   **Scorecards:** Small slips for players to track their token count.
  *   **Whiteboard/Flipchart:** For tracking group stats and the debrief.

  ## 2. Timeline (90 Minutes)
  *   **0:00–0:10:** Intro & Rules (No math yet).
  *   **0:10–0:25:** Round 1 (Blind) & Round 2 (Seen).
  *   **0:25–0:45:** Round 3 (The Banker).
  *   **0:45–0:55:** Round 4 (The Loop).
  *   **0:55–1:30:** The Debrief (The "Aha!" Moment).

  ## 3. The Rules of Play

  **General Rule:** You are playing for points. At the end, the top 3 scores get a small prize (book, candy, bragging rights).

  ### Round 1: The Blind Faith (10 mins)
  *   **Setup:** Players sit around the table. You place a fresh pair of envelopes in the center for each player (or pass them around).
  *   **Action:** Player picks Left or Right. They **cannot** open it.
  *   **Decision:** You ask: "Keep or Swap?"
  *   **Resolution:** They swap or keep. Then they open both. They record the value they ended with.
  *   **Goal:** Establish baseline. Most will shrug. It's a coin flip.
  *   **Facilitator Note:** Record the group's win rate on the board. It should be roughly 50/50 on who ended up with the higher value.

  ### Round 2: The Temptation (15 mins)
  *   **Setup:** Fresh pairs.
  *   **Action:** Player picks an envelope. They **open it** and see the number (e.g., $40).
  *   **The Pitch:** You say: *"Look at that number. The other envelope is either half ($20) or double ($80). If you switch, you could lose $20 or gain $40. The gain is bigger than the loss. Math says you should switch."*
  *   **Decision:** Everyone must Switch. (Force the hand to test the hypothesis).
  *   **Resolution:** Open the second envelope. Record the final value.
  *   **Goal:** Create the itch. Did everyone get richer? (Spoiler: No. The group average should remain flat).
  *   **Facilitator Note:** If someone got rich, highlight them. If someone lost half their value, highlight them. Ask: *"If the math says switch, why did Sarah lose points?"*

  ### Round 3: The Banker (20 mins)
  *   **Roles:** Pick one volunteer to be the **Banker**. You (Facilitator) assist them. The rest are **Players**.
  *   **Setup:** The Banker sees the numbers in the pair *before* the envelopes are sealed/handed out. The Players do not.
  *   **Action:** Player picks an envelope. Opens it. Sees the number.
  *   **The Twist:** The Player asks to Swap. The **Banker** decides whether to *Allow* the Swap or *Forbid* it.
  *   **Incentive:** Tell the Banker: *"Your goal is to make the Players finish with the lowest total score possible. You know the numbers. Use that."*
  *   **Resolution:** If Swap Allowed -> Player switches. If Forbidden -> Player keeps. Reveal values.
  *   **Goal:** This is the critical round. A smart Banker will only allow the swap when the Player is holding the **Higher** amount (so switching makes them lose).
  *   **Outcome:** Players will notice they only get the option to switch when it hurts them.

  ### Round 4: The Infinite Loop (10 mins)
  *   **Setup:** One volunteer at the front. One pair of envelopes.
  *   **Action:** They pick Envelope A.
  *   **Logic:** *"You should switch to B."* They switch. Now they hold B.
  *   **Logic:** *"Wait, B is now your current envelope. A is the other one. By the same logic, you should switch back to A."*
  *   **Action:** Make them physically swap back and forth 5 times.
  *   **The Kicker:** Charge a "transaction fee" (1 point) per swap.
  *   **Goal:** Demonstrate the absurdity. If "Always Switch" is true, you should pay to swap forever. But you end up with the same envelope and fewer points.

  ## 4. The Debrief (35 Minutes)
  *This is where you earn your keep. Do not use formulas. Use the game experience.*

  **Step 1: The Scoreboard**
  Ask: *"In Round 2, who ended up with more points by switching?"* (Some hands up). *"Who ended up with less?"* (Some hands up). *"Who broke even?"*
  Point: *"The strategy 'Always Switch' did not actually make money. So where did the argument go wrong?"*

  **Step 2: The Banker's Secret (The Probability Space)**
  Ask the Banker: *"When did you allow the swap?"*
  Banker admits: *"I only let them swap when they had the big number."*
  **The Lesson:** *"In Round 1 (Blind), the chance of having the big number was 50%. In Round 2 (Seen), you thought it was still 50%. But the Banker proved that once you see a number, the odds change."*

  **Step 3: Mapping the "Slide"**
  Draw two circles on the board.
  *   **Circle 1 (Before Opening):** "I have an envelope. It's either Small or Large. 50/50." (This is true).
  *   **Circle 2 (After Opening):** "I have $40. The other is $20 or $80."
  *   **The Trap:** The argument assumes that seeing $40 doesn't change the 50/50 odds.
  *   **The Reality:** If $40 is the *maximum* possible number in the deck, the other *must* be $20. If $40 is the *minimum*, the other *must* be $80.
  *   **The Takeaway:** *"You cannot have a 50/50 chance of doubling or halving for EVERY number. If you could, there would be no limit to the money in the envelopes. Since there is a limit (even if we don't know it), seeing a high number makes it more likely you have the larger envelope."*

  **Step 4: The "Prior"**
  Explain simply: *"The math trick works only if you assume the library has infinite money to put in these envelopes. Since we are in a library with a finite budget, the 'Always Switch' logic breaks at the edges. The paradox tries to hide the edges from you."*

  ## 5. Predictable Failures & Fixes

  **Failure 1: "The Math is Just Wrong" (The Calculator)**
  *   **What happens:** Someone pulls out a phone, calculates Expected Value ($1.25Y$), and insists the math proves switching is right, ignoring the empirical results.
  *   **Fix:** Validate them. *"You are right about the algebra. You are wrong about the probability. The algebra assumes $P(Double) = 0.5$. The game proves $P(Double)$ depends on the number you see. Trust the tokens over the algebra."*

  **Failure 2: "I Know the Max" (The Card Counter)**
  *   **What happens:** In Round 2, someone sees 64 (if you used your original small pool) and refuses to switch.
  *   **Fix:** This is actually good! It proves your point. *"Exactly! You knew 64 was the cap. That means the probability wasn't 50/50. The paradox relies on you NOT knowing the cap. But in the real world, there is always a cap."*
  *   **Prevention:** Use the wider number range suggested in Materials (10–1280) so boundary numbers appear rarely.

  **Failure 3: "It's Just Pennies" (The Disengaged)**
  *   **What happens:** Players don't care about the points.
  *   **Fix:** Gamify the score. *"Top score gets the first pick of the donuts/book."* Or, make the "Transaction Fee" in Round 4 painful. *"Every swap costs you a point. If you swap 10 times, you go into debt."*

  **Failure 4: The Banker Colludes**
  *   **What happens:** The Banker is friends with a player and lets them swap when it helps.
  *   **Fix:** You (Facilitator) act as the "House Monitor." Verify the Banker's decisions against the envelope contents openly after the round to show *how* they manipulated the odds.

  ## 6. Limitations: What This Game Cannot Do
  You asked for honesty about the game's limits.

  1.  **The Improper Prior:** The mathematical paradox relies on a "uniform prior over an infinite range." This is mathematically impossible in the real world. Your game *cannot* reproduce the actual paradox because your deck is finite.
      *   *How to handle:* Don't hide this. In the debrief, admit it. *"The paradox is a ghost. It only haunts infinite universes. In our finite library, the Banker always wins. The game doesn't solve the math puzzle; it solves the real-world version of it."*
  2.  **Bayesian Updating:** A sharp player might realize they can count cards. If they see many low numbers, they infer the deck is "low heavy."
      *   *How to handle:* This is a feature, not a bug. It reinforces that *information changes probability*, which is the core lesson.
  3.  **Risk Aversion:** In Round 4, people won't pay to swap because they hate losing points, not because of the logic.
      *   *How to handle:* Distinguish between "I don't want to lose points" and "I know swapping doesn't help." Ask them: *"If I offered you a free swap, would you do it forever?"*

  ## 7. Confidence Assessment

  **Overall Confidence: 85%**
  I am highly confident in the facilitation structure, the flow of the rounds, and the debrief mapping. The progression from Blind -> Seen -> Banker -> Loop is pedagogically sound for a lay audience. It moves from intuition to friction to resolution.

  **The One Shaky Point: The Banker's Incentive Structure**
  I am least sure about how the group will react to the **Banker Round (Round 3)**.
  *   *The Risk:* Players might view the Banker's refusal to allow swaps as "cheating" or "changing the rules," rather than a revelation about probability. They might feel the game was rigged (which it was, intentionally), and dismiss the lesson as "Well, of course I lost, the Banker screwed me."
  *   *Why it's shaky:* It requires the players to separate "Unfair Game" from "Unfair Assumption." If they focus on the Banker's agency, they might miss the point about the *envelopes' distribution*.
  *   *Mitigation:* During the debrief, you must explicitly reframe the Banker. *"The Banker isn't cheating. The Banker is just the Physical Reality of the Deck. The Deck has limits. The Banker knows the limits. You didn't. The 'Paradox' tries to pretend the Banker doesn't exist."*

  **Final Advice:**
  Your hunch about Round 3 is correct. That is the linchpin. If you can get them to see that the **option to switch** carries information, you have solved the paradox for them without writing a single equation. Good luck. This sounds like a fantastic night.
