answer: |-
  ### Exam Question

  **Question 1 (75 Minutes)**

  Parfit's Repugnant Conclusion argues that under Total Utilitarianism, a vast population with lives barely worth living is better than a smaller population with excellent lives. Consider a "Duration Analogue": Compare Person A, who lives 80 years of excellent welfare, against Person B, who lives 4,000 years of welfare that is barely worth living (but still positive). Assume the total sum of welfare in B's life exceeds A's.

  Write an essay addressing the following:
  1.  Does Total Utilitarianism necessarily imply Person B's life is better than Person A's?
  2.  Is this "Duration Conclusion" structurally identical to the Population Repugnant Conclusion, or does the fixed identity of the subject change the ethical problem?
  3.  Does the condition "no one is made worse off" play the same role in the Duration case as it does in Parfit's Mere Addition argument?
  4.  Based on this comparison, is the root problem of the Repugnant Conclusion the addition of *people* or the aggregation of *utility*?

  ***

  ### Model Answer

  Total Utilitarianism (TU) dictates that the value of an outcome is determined solely by the sum total of welfare contained within it. Applied to the Duration Analogue, TU necessarily implies that Person B's life is better than Person A's, provided the aggregate welfare of B's 4,000 years exceeds A's 80 years. If welfare is additive across time just as it is across persons, then duration functions as a multiplier. A sufficiently long life of low-positive welfare will mathematically outweigh a short life of high welfare. Therefore, within the logic of TU, the Duration Conclusion follows inevitably.

  However, whether this is structurally identical to the Population Repugnant Conclusion is debatable. In the Population case, we compare distinct sets of people. In the Duration case, we compare temporal segments of a single identity. This distinction matters for our intuitions. Many find the Population Repugnant Conclusion deeply counterintuitive because it seems to treat people as vessels for utility, disregarding the distribution of quality across distinct lives. The Duration Conclusion feels less visceral; sacrificing quality for quantity of time within one life seems like a standard trade-off humans already make. If the Duration Conclusion feels acceptable while the Population Conclusion does not, the structural difference (identity vs. plurality) is ethically significant. If both feel repugnant, the structure is irrelevant, and the fault lies elsewhere.

  This leads to the role of the "no one is made worse off" condition. In Parfit's Mere Addition Paradox, this condition is crucial for moving from a good population to a larger, mixed population without violating Pareto principles. It helps generate the Repugnant Conclusion through a series of non-worsening steps. In the Duration case, this condition is trivial. Since we are comparing two possible lives for a single subject (or two subjects in isolation), there is no separate party to be made worse off by the choice. The "no one worse off" constraint does no work here because identity is fixed. We are not adding people who might be harmed by resource dilution; we are simply summing units of time. The absence of this constraint suggests the Duration Conclusion is a purer test of aggregation, unburdened by the complexities of non-identity problems.

  Consequently, comparing the two cases isolates the true culprit. If one rejects the Population Repugnant Conclusion but accepts the Duration Conclusion, one must argue that adding people introduces moral constraints that adding time does not. This suggests a person-affecting view where identity matters. However, if one finds the Duration Conclusion equally repugnant—as many do when imagining 4,000 years of drudgery—the problem is not about people at all. It is about the aggregation of utility itself. The Repugnant Conclusion arises because TU allows low-quality welfare to compensate for high-quality welfare through sheer volume.

  Therefore, the Duration Analogue suggests the root problem is aggregation, not identity. Total Utilitarianism treats welfare as a homogeneous substance that can be poured into any container, whether that container is a new person or an extra year of life. If we find the result repugnant in both cases, we must reject the idea that total sum is the only metric of value. We might instead require a critical level, or prioritize average welfare, to prevent quality from being drowned by quantity. The Duration case strips away the distraction of "new people" and reveals that the Repugnant Conclusion is fundamentally a problem of how we sum value, not merely who exists to hold it.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | Criteria | Marks | Common Pitfall |
  | :--- | :---: | :--- |
  | **1. Formulation of the Duration Case**<br>Correctly identifies that TU requires comparing aggregate sums across time, accepting B > A if total utility is higher. | /4 | Students claim TU rejects the long life because quality is low, confusing Total with Average Utilitarianism. |
  | **2. Structural Comparison**<br>Analyzes whether fixed identity (Duration) vs. distinct identities (Population) changes the moral intuition or logic. | /4 | Students assert the cases are identical without discussing how identity affects our intuitive resistance to the conclusion. |
  | **3. Analysis of "No Worse Off"**<br>Recognizes that the Pareto condition is trivial or irrelevant in the single-subject Duration case compared to Mere Addition. | /4 | Students attempt to apply the "no one worse off" condition to the Duration case as if there were multiple stakeholders. |
  | **4. Diagnosis of the Culprit**<br>Argues whether the problem lies in adding people or aggregating utility based on the comparison of the two cases. | /4 | Students conclude "TU is bad" without specifying whether the failure is due to population growth or utility summation. |
  | **5. Coherence and Argumentation**<br>Essay flows logically from definition to application to diagnosis; conclusion follows from premises. | /4 | Students write disjointed paragraphs that address the sub-questions as a checklist rather than a unified argument. |
