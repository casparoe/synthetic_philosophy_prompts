  **Why?**
  1.  **Technical Terminology:** In political philosophy, "Prioritarianism" is a specific technical term (associated with Derek Parfit) that refers to Rule B (weighted aggregation). Rule A is usually called "Maximin" or the "Difference Principle" (associated with John Rawls). If she is finishing a PhD, she is likely using the term precisely.
  2.  **The Case 4 Clue:** If she were a strict Maximin (Rule A), the total sum of well-being wouldn't matter to her reasoning at all. However, in Case 4, the totals were very close (36 vs 37). If she were truly indifferent to totals, she might have accepted a larger disparity. The fact that she accepted a trade where the total loss was *minimal* (1 unit) suggests she is sensitive to the size of the sacrifice. The Referee case demands a *massive* sacrifice (9 units) for a tiny gain. That violates the internal consistency of Rule B.

  ### 3. Is the Levelling-Down Stuff Relevant?

  It is **relevant to her identity, but a red herring for this prediction.**

  *   **Relevance:** It confirms she is not a "Telic Egalitarian" (someone who values equality for its own sake). An Egalitarian might have struggled with Case 2 ($\{5, 10\}$ vs $\{5, 5\}$) because $\{5, 5\}$ is more equal. Her annoyance confirms she cares about people's absolute levels, not just their relative standing.
  *   **Red Herring:** Both Rule A (Maximin) and Rule B (Prioritarianism) agree on Case 2. Both agree that making someone worse off without helping anyone is bad. So, knowing she rejects levelling down doesn't help you distinguish between Rule A and Rule B for the Referee case. You already knew she wasn't a crazy egalitarian; the question is whether she is a "trade-off" prioritarian or a "floor" maximin.

  ### 4. The {4, 4, 4} Variation

  **Yes, it would make a difference, and it's a great way to catch her out.**

  *   **If she follows Rule A (Maximin):** She would **change her verdict.**
      *   For $\{5, 5, 5\}$, she says **Yes** (Minimum rises 4 $\to$ 5).
      *   For $\{4, 4, 4\}$, she says **No** (Minimum stays 4 $\to$ 4, so she looks at the next worst-off. In the first option the next worst is 10; in the second, it's 4. The first option wins).
      *   *Result:* Her verdict flips based on that tiny change.
  *   **If she follows Rule B (Prioritarianism):** She likely says **No to both.**
      *   If $\{5, 5, 5\}$ is already too costly (which I bet it is), $\{4, 4, 4\}$ is even worse. It costs the rich just as much but gives the poor person nothing.
      *   *Result:* Her verdict stays the same (Reject), though her reasoning might note that $\{5, 5, 5\}$ was "less bad" than $\{4, 4, 4\}$.

  **Strategy:** Ask her hypothetically: "If the paper argued for $\{4, 4, 4\}$ instead, would you still say the move is an improvement?" If she says "No, that's obviously worse," but maintains "Yes" for $\{5, 5, 5\}$, she is leaning toward Maximin. If she says "No, both are disastrous," she is a Prioritarian.

  ### 5. The Case to Split the Rules

  To definitively separate Rule A from Rule B, you need a case where the worst-off gains a tiny amount, but the better-off lose a *huge* amount. Maximin must accept it; Prioritarianism must reject it.

  **Put this pair to her:**
  > **Option X:** $\{4, 100, 100\}$
  > **Option Y:** $\{5, 1, 1\}$

  *   **Rule A (Maximin) says:** **Y is better.** The worst-off person goes from 4 to 5. The fact that the other two people crash from 100 to 1 is irrelevant. The floor rose.
  *   **Rule B (Prioritarianism) says:** **X is better.** The gain to the worst-off (1 unit) is morally weighted, but not infinitely weighted. It cannot justify destroying 198 units of well-being for the others.

  If she hesitates or says X is better, you have confirmed she is a true Prioritarian (Rule B) and you can confidently predict she will reject the referee paper. If she instantly says Y is better, she is a secret Maximin (Rule A), and she will accept the paper.
