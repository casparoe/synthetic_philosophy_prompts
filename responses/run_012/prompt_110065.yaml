  ### 1. The Rules She Could Be Running

  Based on her self-identification as a "prioritarian" and her verdicts, there are two main candidate rules. Both fit the data you have so far, but they diverge sharply on the referee case.

  **Rule A: Lexical Maximin (The "Floor" Rule)**
  *   **The Logic:** The only thing that matters is the well-being of the worst-off person. You must maximize their level. If two options leave the worst-off person equally well, *then* you look at the next worst-off person, and so on. Total well-being only matters as a tie-breaker.
