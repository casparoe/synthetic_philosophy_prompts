  *   **The Logic:** Benefits matter more the worse off the person is, but they still have to be weighed against costs. This is usually modeled by applying a "concave function" to well-being (e.g., the moral value of well-being diminishes as you get richer). You maximize the *weighted* total. Crucially, a small gain for the poor cannot justify a *massive* loss for the rich. There is a trade-off rate.
