answer: |-
  Dear friends,

  I am writing to propose the text of a joint statement that captures the precise terrain of your disagreement while affirming the substantial ground you share, a document you might both sign to clarify the club's understanding of your debate. You have both agreed that talk of possible worlds is indispensable for making sense of modality, necessity, and counterfactuals, and you agree that such talk allows us to analyze claims about what could have been or must be by referencing distinct ways the world might be. You both accept that this framework incurs costs, though you diagnose them differently. The realist among you accepts the cost of ontological extravagance, admitting that positing concrete entities beyond our causal reach is a heavy price, while the actualist accepts the cost of primitive modality or abstract representation, admitting that treating worlds as maximal consistent sets of propositions or states of affairs relies on notions that are not fully reducible to the concrete. Your joint statement should affirm that both views offer systematic accounts of modal truth, and that the choice between them is not about the utility of the logic but about the metaphysics underlying it.

  The point where you part ways must be stated with precision. The realist holds that possible worlds are concrete entities of the same fundamental kind as our own universe, differing only in their content and not in their status, whereas the actualist holds that possible worlds are abstract representations or maximal properties, and that only the actual world possesses concrete existence. To capture the cruxes of this dispute, your statement should record that you identify two primary axes of disagreement. The first is whether the term actual functions indexically, like here or now, or absolutely, like real. The realist argues that actual is indexical, meaning that every inhabitant of every world refers to their own world as actual, so that all concrete worlds are equally real. The actualist argues that actual is absolute, picking out the unique concrete totality that we inhabit, so that other possible worlds, being merely abstract, do not exist in the same sense. The second crux is whether the dispute is partly verbal, turning on the domain of the quantifier exists. The realist contends that exists is unrestricted, ranging over all concrete entities across all worlds, while the actualist contends that exists is restricted to the actual world, so that when they say other worlds do not exist, they mean they are not part of the concrete domain, not that they are nothing at all.

  For each of these cruxes, you have agreed to record a specific case and a prediction from each side to show how the disagreement plays out in practice. Regarding the indexicality of actual, you will consider the case of a hypothetical observer in another world. The realist predicts that such an observer would be correct to call their world actual and ours merely possible, implying that actuality is not a privileged metaphysical status. The actualist predicts that such an observer, if concrete, would be part of the actual world by definition, or if merely possible, would not be an observer at all but an abstract representation, implying that actuality is a unique property of our concrete reality. Regarding the quantifier dispute, you will consider the claim that there are things that do not exist. The realist predicts this is false, because to be a thing is to exist, so non-existent possibles are not things. The actualist predicts this is true in a sense, because we can quantify over non-existent possibilia in our logic without committing to their concrete existence, showing that exists has a narrower scope than the domain of discourse.

  Finally, you requested a specific prediction regarding the case where physicists announce that our universe is one of infinitely many concrete universes, often called the multiverse. The realist predicts that this discovery would count in favor of their view, because it demonstrates that concrete plurality is physically coherent and that our universe is not the sole concrete totality, vindicating the idea that reality contains more than just the spatiotemporally connected region we inhabit. The actualist predicts that this discovery would count against the realist or be neutral, because even if there are infinitely many concrete universes, they would all be part of the single actual world, merely expanding the extension of actual rather than validating the existence of non-actual concrete worlds, thus leaving the core distinction between actuality and possibility intact. By signing this statement, you acknowledge that while you share a commitment to the utility of modal discourse, you remain divided on the ontology that grounds it, and you commit to treating this division as a substantive metaphysical disagreement rather than a mere confusion of terms. I hope this text serves your purpose well.
