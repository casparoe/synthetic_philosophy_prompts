answer: |-
  # Truth as Poison: *Oedipus Rex* and the Limits of Good's Theorem

  **Seminar Abstract**
  This seminar explores the tension between I.J. Good's 1967 theorem on the Value of Information and Sophocles' *Oedipus Rex*. Good's theorem establishes that for a Bayesian agent, the expected value of free information is always non-negative: one should never refuse evidence, because one can always choose to act as if one had not received it. *Oedipus Rex* appears to be a visceral counterexample: the protagonist seeks information, receives it, and is ruined. This reading argues that the play does not refute Good's theorem but rather dramatizes the catastrophic consequences of violating its scope conditions. By analyzing the play through decision theory, we uncover where the mathematical model of rationality breaks down against the ontological realities of identity, fate, and the performative power of truth.

  ---

  ## 1. The Theorem and The King: Setting the Stage

  To pair these texts, we must first define the terms of the engagement.

  **Good's Theorem (Simplified):**
  Let an agent face a decision problem with a set of possible actions $A$ and states of the world $S$. The agent has a prior probability distribution over $S$ and a utility function $U(a, s)$. If the agent is offered a piece of information (an experiment) $E$ that yields evidence $e$ at no cost, the **Expected Value of Information (EVI)** is:
  $$ EVI = E_{e}[\max_{a} E[U(a, S) | e]] - \max_{a} E[U(a, S)] \ge 0 $$
  Crucially, the inequality holds because the agent has the option to **ignore** the information. If the evidence suggests a worse course of action than the prior, the agent can simply stick with the prior-optimal action. Therefore, *ex-ante*, acquiring information cannot make the agent worse off.

  **The Oedipal Conflict:**
  Oedipus initiates an investigation (acquires information $E$) to save Thebes. The evidence $e$ (his parentage, his guilt) is revealed. The resulting utility $U$ is catastrophic (exile, blindness, death of Jocasta). *Ex-post*, the value of information was profoundly negative.

  **The Central Question:**
  Does the play demonstrate that Good's theorem is false? **No.** It demonstrates that the tragic universe violates the theorem's axioms. Oedipus is not a counterexample to the math; he is a victim of a world where the math does not apply.

  ---

  ## 2. Violated Scope Conditions: Where the Model Breaks

  For Good's theorem to hold, specific conditions must be met. *Oedipus Rex* systematically violates three of them.

  ### A. The "Costless Ignore" Condition (Commitment Problems)
  Good's theorem relies on the assumption of **free disposal of information**. If I learn a stock will crash, I can choose not to sell (ignoring the info).
  *   **The Violation:** Oedipus cannot "costlessly ignore" the truth. Once the Shepherd speaks, Oedipus *knows*. He cannot psychologically or socially revert to the state of "Ignorant King." The information is not just data; it is a **status change**.
  *   **Decision Theoretic Reading:** Oedipus lacks the commitment technology to bind himself to ignorance. In modern terms, he faces a **time-inconsistency problem**. *Ex-ante* (as King), he wants the truth to save the city. *Ex-post* (as Son/Husband), he cannot act on the "Ignorant King" strategy because the community (Chorus, Gods) will not allow him to maintain that identity. The information forces a strategy shift he cannot veto.

  ### B. The Causal Efficacy of Information (Performativity)
  Standard Bayesian updating assumes information is **passive evidence** about a fixed state of the world. The state $S$ exists independently of the observation $e$.
  *   **The Violation:** In *Oedipus*, the Oracle is not merely predictive; it is **performative**. The prophecy helps *cause* the outcome. Furthermore, the revelation of the truth triggers the punishment.
  *   **Decision Theoretic Reading:** This is a violation of the **causal structure** assumed by decision theory. In Good's framework, observing $e$ does not change $P(S)$. In *Oedipus*, observing $e$ (the truth) changes the payoff structure $U(a, s)$ itself. The utility of "Being King" drops from positive to negative *because* the information was observed. The observation itself is a causal variable in the utility function.

  ### C. Stability of Preferences and Identity
  Good's theorem assumes a stable utility function $U$. The agent's goals do not change upon receiving evidence.
  *   **The Violation:** Oedipus's identity is constituted by his knowledge. When he learns the truth, he is not the same agent. The "Oedipus" who sought the truth valued **Civic Salvation**. The "Oedipus" who knows the truth values **Purity/Punishment**.
  *   **Decision Theoretic Reading:** This is a **preference reversal** endogenous to the information. If learning $e$ changes $U$ to $U'$, Good's inequality no longer holds. The tragedy shows that some information is **constitutive**: it does not just tell you about the world; it tells you *who you are*, and in doing so, rewrites your utility function.

  ---

  ## 3. Scene-by-Scene Analysis: Illumination and Resistance

  Here we apply the lens to specific moments, noting where the theory illuminates the drama and where the drama resists the theory.

  ### The Consultation with Tiresias
  *   **The Theory:** Tiresias offers high-value information ($e$). Oedipus rejects it. By Bayesian standards, Oedipus is **irrational** here. He has a strong prior (I am the savior) and rejects strong evidence (Tiresias's accusation) due to emotional bias (anger).
  *   **The Illumination:** This scene shows Oedipus failing Good's test. He *should* update his priors. If he had treated Tiresias's words as data, he might have managed the revelation (perhaps mitigating the damage).
  *   **The Resistance:** But Tiresias's info is not "costless." It comes with an accusation of treason. The "cost" of the signal is high, which Good's theorem excludes. Oedipus isn't just ignoring info; he is avoiding a social attack.

  ### Jocasta's Plea (The Argument for Ignorance)
  *   **The Theory:** Jocasta begs Oedipus to stop the inquiry: *"For the gods' sake, if you care for your own life, give up this search!"* She intuitively understands that $EVI < 0$ in this specific context.
  *   **The Illumination:** Jocasta acts as the **behavioral economist** to Oedipus's **rational agent**. She recognizes the scope conditions are violated: the cost of knowing is existential. She argues for **bounded rationality**—deliberate ignorance as a survival strategy.
  *   **The Resistance:** Decision theory says Jocasta is wrong *ex-ante*. If Oedipus is truly guilty, the plague continues. The "utility" of the city is negative. Jocasta prioritizes private utility over public utility. The play forces us to ask: Is it rational to save the self at the cost of the polis? Good's theorem doesn't weigh moral duty, only expected utility.

  ### The Corinthian Messenger and The Shepherd
  *   **The Theory:** This is the cascade of evidence. Each update moves the posterior probability of $P(\text{Oedipus is Guilty})$ closer to 1.
  *   **The Illumination:** Oedipus is actually a **perfect Bayesian detective** here. He updates correctly. He connects the dots logically. He satisfies the rationality requirements of information *processing*.
  *   **The Resistance:** The tragedy is that **rational processing leads to ruin**. This is the core tension. Decision theory assumes rational processing leads to better decisions. Here, it leads to self-destruction. The theory cannot account for a world where Truth is antagonistic to Well-Being.

  ### The Ex-Post Outcome (Blinding)
  *   **The Theory:** $U(\text{Blind, Exiled}) \ll U(\text{King, Ignorant})$.
  *   **The Resistance:** A strict decision theorist might argue: "But *ex-ante*, Oedipus didn't know he would be blinded. He expected to cure the plague." This is the **Hindsight Bias** defense.
  *   **The Critique:** The seminar must acknowledge this limit. Good's theorem protects the *decision to search*, not the *outcome*. However, the play suggests the outcome was **structurally inevitable**, not a probabilistic risk. In a deterministic tragic universe, "Expectation" is a human illusion. The theorem fails because it assumes a probabilistic world, while the play posits a fated one.

  ---

  ## 4. What Tragedy Adds to the Philosophical Debate

  If we stop at "the assumptions were violated," we miss the philosophical payload. The play offers three insights that decision theory alone cannot generate.

  ### 1. Knowledge as Action (Performativity)
  Decision theory treats information as a mirror (reflecting reality). Tragedy treats information as a hammer (shaping reality).
  *   **Insight:** In *Oedipus*, to know is to act. To pronounce oneself guilty is to sentence oneself. Good's theorem assumes a separation between the *knower* and the *world*. The play argues they are entangled. This anticipates modern concepts in **mechanism design** and **reflexivity** (Soros), where observing the market changes the market.

  ### 2. The Value of Truth vs. The Value of Life
  Good's theorem assumes the agent wants to maximize Utility. It does not ask *what* Utility is made of.
  *   **Insight:** Oedipus reveals that for some agents, $U(\text{Truth}) > U(\text{Life})$. Even though the information destroys him, he chooses to blind himself rather than live in the lie. The play suggests that **integrity** is a preference that can override survival. Decision theory can model this only if "Integrity" is an input variable; Tragedy shows it is often the *output* of the crisis.

  ### 3. Identity is Endogenous
  Standard decision theory assumes a stable "Self" that holds preferences.
  *   **Insight:** *Oedipus Rex* shows that the Self is fragile. Information can shatter the agent. If the agent ceases to exist (socially/psychologically) upon receiving information, there is no one left to enjoy the "non-negative expected value."
  *   **Philosophical Payoff:** This challenges the **Continuity Assumption** in rational choice. If learning $e$ transforms Agent $A$ into Agent $B$, we cannot compare $U_A$ and $U_B$ easily. The tragedy forces decision theory to confront **transformative experiences** (cf. L.A. Paul).

  ---

  ## 5. Conclusion: The Honest Critic's Verdict

  **Where the Reading Holds:**
  The pairing successfully diagnoses *why* Oedipus is ruined in technical terms: he operates in an environment where information is costly, non-ignorable, and causally potent. It rescues Good's theorem from being "disproven" by showing the tragic world is non-Bayesian.

  **Where the Reading Fails:**
  We must admit that decision theory is **normative**, while tragedy is **descriptive** of the human condition. Good's theorem tells us how we *ought* to reason. *Oedipus* tells us what it *feels like* when reason collides with fate.
  *   **The Limit:** Math cannot capture the **qualia of shame**. Good's theorem calculates utility; it does not feel the sting of the brooches. To reduce Jocasta's suicide to a utility drop is to miss the horror.
  *   **The Verdict:** The play does not show Good's theorem is false; it shows it is **insufficient**. It is a map of a rational world, drawn for travelers in an irrational one.

  **Final Seminar Takeaway:**
  Use Good's theorem to sharpen the analysis of Oedipus's *choices*, but use *Oedipus* to humble the ambitions of decision theory. The theorem proves that information is power. The play warns that power is not always a gift. In the end, Oedipus teaches us that the Value of Information depends entirely on whether the agent can survive the truth.

  ---

  ### Suggested Discussion Questions for the Seminar
  1.  If Oedipus could have signed a contract *ex-ante* to remain ignorant (if the plague allowed), would that have been the rational choice?
  2.  Does the Oracle function as "Information" or as a "Constraint" in the decision problem?
  3.  How does the concept of "Transformative Experience" (L.A. Paul) resolve the conflict between Good's Theorem and Oedipus's self-blinding?
  4.  Is the Chorus acting as a risk-averse regulator trying to limit Oedipus's information gathering?
