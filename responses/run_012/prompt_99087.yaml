prompt: |-
  Bit of a wierd request, but here goes. I'm in a small reading group on the philosophy of vagueness and we've just spent two sessions on the epistemicism/supervaluationism split. Crudely: the epistemicist says a predicate like "bald" or "heap" really does have a sharp boundary, it's just that we can never know where it falls, so borderline statements still have a determinate truth value that we're simply ignorant of; the supervaluationist says borderline cases are where the term just hasn't been made precise yet, so a sentence counts as true only if it comes out true under every admissible way of sharpening the term, false if false under every sharpening, and neither when it flips depending on how you sharpen. Our next session is meant to be a case study and I've been handed the IAU's 2006 redefinition of "planet" and the demotion of Pluto, and I have to bring an analysis that runs both theories against the episode and then reads the episode back against the theories. I know the basic story already — the Prague vote, the requirement that a planet has cleared the neighbourhood around its orbit, the earlier counter-proposal that would've kept Pluto and added Ceres, Charon and Eris and left us with twelve planets, and the fact that Eris's discovery is what forced the whole thing — so please don't spend the answer recapping it. I want the actual work.

  Do the mapping carefully and tell me who the players are and what they were actually deciding. Was the IAU committee locating a boundary that was always there (so the epistemicist gets the episode for free, and the only puzzle is why we couldn't see the boundary before), or were they stipulating one, in which case I want to know what makes a stipulation "admissible" in the supervaluationist sense and whether a vote by a body of astronomers is the kind of thing that can generate an admissible precisification at all. There's a wrinkle I keep chewing on: before the vote, did "planet" already include or exclude Pluto — was there a fact of the matter — and does either theory give a cleaner answer to that than the other? And I'd like you to be honest about where each theory goes quiet. Does the "cleared the neighbourhood" clause function as a sharpening, and if so is it arbitrary, or does it track something real in the world that the vague term was groping toward? Push it in both directions: what the episode confirms in each theory, what it looks like an anomaly for, and whether it's a case either view never anticipated — for instance, whether a term can be sharpened by fiat and still be vague in the way supervaluationists need, or whether the epistemicist can really say Pluto was determinately a planet or determinately not one all along and we were just in the dark. I'd also like a verdict, not just a survey: which of the two handles the Pluto case better, and where does the case make trouble for the winner. No need for citations or reading lists — I'm just after the argument, and assume I can't look anything up while reading your answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Philosophy of Vagueness (Epistemicism vs. Supervaluationism).
      *   **Case Study:** IAU 2006 redefinition of "planet" (Pluto's demotion).
      *   **Constraints:** No recap of the basic story (assume knowledge of IAU, Prague, Eris, "cleared the neighbourhood," etc.). Focus on the philosophical mapping.
      *   **Key Questions to Address:**
          *   Who are the players/what were they deciding?
          *   Epistemicist view: Was there a pre-existing sharp boundary?
          *   Supervaluationist view: Was this a stipulation/precisification? What makes it "admissible"? Can a vote generate admissibility?
          *   The "Before the Vote" Wrinkle: Was there a fact of the matter about Pluto *before* 2006?
          *   The "Cleared the Neighbourhood" Clause: Sharpening vs. tracking reality? Arbitrary vs. real?
          *   Anomalies/Blind spots for each theory.
          *   **Verdict:** Which theory handles the case better? Where does the winner still struggle?
      *   **Tone:** Rigorous, argumentative, no citations/reading lists, assume the user is knowledgeable.

  2.  **Deconstruct the Case Study (IAU 2006):**
      *   *Context:* Discovery of Eris (roughly Pluto-sized) forced a decision. Keep adding planets? Or draw a line?
      *   *Action:* IAU Resolution B5. Defined "planet" with three criteria (orbit sun, hydrostatic equilibrium, cleared neighbourhood).
      *   *Result:* Pluto fails criterion 3. Becomes "dwarf planet."
      *   *Nature of the Act:* It was a *decision*, a vote, a stipulation by an authority body. It wasn't a discovery of a new astronomical fact about Pluto's physical properties (we knew its orbit and size before). It was a semantic/classificatory decision.

  3.  **Map Epistemicism:**
      *   *Core Claim:* Vagueness is ignorance. "Planet" has a sharp extension.
      *   *Application to Pluto:* Before 2006, was Pluto *really* a planet or not?
          *   *Hard Epistemicism:* Yes, there was a fact. The IAU didn't *make* it not a planet; they *discovered* (via stipulation/analysis) that it never satisfied the hidden boundary conditions of the natural kind "planet."
          *   *Problem:* "Planet" isn't a natural kind like "water" (H2O). It's a functional/cultural category. If it's not a natural kind, where does the sharp boundary come from? Usage? But usage was conflicted.
          *   *The "Cleared Neighbourhood" Clause:* Did this criterion exist implicitly before? If yes, Epistemicism holds. If no (if it was a new rule), Epistemicism struggles because it implies the meaning *changed*, not that ignorance was dispelled.
      *   *Strength:* Explains why the debate felt like a discovery of truth ("Pluto *is* too small/dynamically dominated").
      *   *Weakness:* Implies a magical boundary existed in English usage prior to 2006 that excluded Pluto but included Earth, which seems historically false given the fluidity of the term.

  4.  **Map Supervaluationism:**
      *   *Core Claim:* Vagueness is semantic indecision. Truth is supertruth (true on all admissible precisifications).
      *   *Application to Pluto:* Before 2006, "Planet" was vague. There were multiple admissible precisifications (some included Pluto, some didn't). "Pluto is a planet" was neither true nor false (a truth-value gap).
      *   *The IAU Vote:* This acts as a *precisification*. The IAU selected *one* admissible sharpening and made it authoritative.
      *   *Admissibility:* What makes a precisification admissible? It must respect the "penumbra" constraints (cannot exclude Earth, cannot include asteroids). The IAU proposal had to fit the core cases.
      *   *Strength:* Captures the intuition that the *decision* created the status. It explains the "gap" before 2006.
      *   *Weakness:* Supervaluationism usually describes natural language evolution, not bureaucratic fiat. Can a vote make a precisification "admissible" in the philosophical sense, or does it just change the subject? Also, does the vote eliminate vagueness entirely (making it precise) or just shift the vagueness (e.g., what counts as "cleared")?

  5.  **Address the Specific Wrinkles:**
      *   *Before the Vote:* Epistemicist says "Fact of the matter existed." Supervaluationist says "No truth value." The historical record supports Supervaluationism (astronomers disagreed, no consensus).
      *   *Cleared the Neighbourhood:* Is it arbitrary?
          *   Epistemicist: Must track a real hidden boundary.
          *   Supervaluationist: It's a choice among admissible options. It's not *totally* arbitrary (must respect core cases), but it is a stipulation.
      *   *Vagueness after the Vote:* "Cleared the neighbourhood" is *itself* vague. So the IAU didn't eliminate vagueness; they shifted it. Supervaluationism handles this well (higher-order vagueness). Epistemicism has to say there's a sharp boundary to "cleared the neighbourhood" too.

  6.  **Develop the Argument/Verdict:**
      *   *Epistemicism's Failure:* It requires "planet" to be a natural kind with a hidden essence. It isn't. It's a classificatory term. To say Pluto was *determinately not* a planet in 1990 implies our usage was systematically erroneous in a way that only the IAU could correct. That's too strong.
      *   *Supervaluationism's Success:* It treats the IAU vote as a semantic decision to resolve indecision. It fits the "stipulation" nature of the event.
      *   *The Trouble for Supervaluationism:* The IAU vote didn't just select an admissible precisification of *existing* language; it *changed* the language. Supervaluationism explains how we resolve vagueness, but usually through usage drift, not committee vote. Also, the new term ("cleared the neighbourhood") reintroduces vagueness immediately.
      *   *Verdict:* Supervaluationism wins, but needs to acknowledge that this is *legislative precisification*, not just descriptive semantic analysis.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the task. Set the stage without recapping history.
      *   *Section 1: The Players and the Act.* Define the IAU not as discoverers but as legislators.
      *   *Section 2: Epistemicism Analysis.* Focus on the "Fact of the Matter." The problem of natural kinds vs. social kinds. The "Cleared Neighbourhood" as a hidden essence?
      *   *Section 3: Supervaluationism Analysis.* Focus on "Semantic Indecision." The vote as a precisification. Admissibility conditions (respecting core cases).
      *   *Section 4: The "Before" State.* Contrast the two views on the status of Pluto in 2005.
      *   *Section 5: The "Cleared Neighbourhood" Clause.* Is it arbitrary?
      *   *Section 6: Verdict.* Supervaluationism is better fitted, but with caveats about authority vs. usage.

      *(Self-Correction during drafting)*: Make sure I don't just say "Supervaluationism is right." I need to show where it struggles. The struggle is that Supervaluationism is usually a theory of *natural language*, whereas the IAU decision is *technical stipulation*. Does the theory stretch to cover technical definitions? Yes, if we treat technical terms as precisifications of folk terms.
      *Another point:* Epistemicism might argue that the IAU *fixed* the reference, revealing the boundary. But since "planet" is not a natural kind, reference fixing is different.
      *Crucial nuance:* The term "cleared the neighbourhood" is *also* vague. Supervaluationism handles higher-order vagueness better. Epistemicism requires infinite sharp boundaries.

  8.  **Final Polish:** Check tone. Ensure it sounds like a philosophical briefing for a reading group. No fluff. Direct engagement with the theories. (Ensure I answer the specific prompt about "who the players are" and "what makes a stipulation admissible".)

      *Refining the "Admissibility" point:* For a supervaluationist, a precisification is admissible if it doesn't violate the clear cases. The IAU proposal was admissible because it kept Earth and excluded asteroids. It was *selected* from the set of admissible precisifications. The vote makes it *the* precisification for that context.

      *Refining the Epistemicist "Anomaly":* If Epistemicism is true, the IAU was essentially wrong to think they were making a decision. They were reporting a fact. But they acted like legislators. This mismatch is the anomaly.

      *Refining the Verdict:* Supervaluationism wins on the "process," Epistemicism wins on the "feeling" of discovery (some astronomers felt Pluto was never a real planet). But ontologically, Supervaluationism fits the social construction of the category better.

  9.  **Final Review against constraints:** No citations? Check. No recap of Eris/Prague basics? Check. Honest about where theories go quiet? Check. Verdict included? Check.

      *(Self-Correction on "Players"):* Need to identify the IAU Committee on Small Body Nomenclature vs. the General Assembly. The tension between the proposal (12 planets) and the final vote (8 planets). This shows the *choice* involved, supporting Supervaluationism.

      *(Final thought on "Cleared the Neighbourhood"):* This is the crux. It's a dynamical criterion. Is it a hidden essence? No, it's a dynamical stability metric. It was chosen *because* it excluded Pluto/Eris. That looks like tailoring a boundary, not finding one.

      Okay, ready to write.
answer: |-
  Let's cut straight to the mapping. You have a semantic event (the 2006 Resolution B5) that looks like a legislative act but functions as a semantic intervention. The core tension is whether the IAU was *discovering* a boundary inherent in the concept "planet" or *creating* a boundary to resolve a practical classificatory crisis.

  ### 1. The Players and the Act
  You need to distinguish between the **Committee on Small Body Nomenclature** (the drafters) and the **IAU General Assembly** (the voters).
  *   **The Drafters:** Proposed a definition that initially included Pluto, Ceres, Charon, and Eris (the "12 planet" solution). This suggests they viewed the extension of "planet" as flexible enough to accommodate new discoveries without exclusion.
  *   **The General Assembly:** Rejected the draft, adopted the "cleared the neighbourhood" criterion, and excluded Pluto.
  *   **The Act:** This was not an empirical discovery. We knew Pluto's mass, orbit, and neighbours in 2005. The 2006 vote changed the *truth conditions* of the sentence "Pluto is a planet" without changing the physical facts about Pluto.

  For your analysis, the IAU functions as a **semantic authority**. They are not observing usage; they are regulating it. This is the first stress point for both theories, which usually model natural language evolution, not bureaucratic fiat.

  ### 2. The Epistemicist Mapping
  **The Claim:** The term "planet" always had a sharp extension. The IAU did not change the meaning; they clarified our access to the boundary.
  **The Mechanism:** On this view, there is a fact of the matter, independent of the vote, about whether Pluto fell under the extension of "planet" in 2005. The IAU's job was to align the definition with that pre-existing fact.

  *   **Where it fits:** It captures the intuition held by many astronomers that Pluto was "never really a planet" in the same sense as Jupiter. It explains the feeling of *correction* rather than *legislation*. If "planet" tracks a natural kind (like "species"), then the boundary is mind-independent. The "cleared the neighbourhood" clause, on this view, is a proxy for a real dynamical distinction that existed all along.
  *   **Where it goes quiet (The Anomaly):**
      1.  **Natural Kind Problem:** "Planet" is not a natural kind like "water." It is a functional/cultural category. Epistemicism works best when there is a hidden essence (e.g., molecular structure). What is the hidden essence of "planethood" that existed prior to 2006? If it's "clearing the neighbourhood," why was that criterion invisible to every astronomer from 1930 to 2005? Epistemicism requires us to believe that usage was systematically erroneous for 75 years, which is a heavy metaphysical burden for a classificatory term.
      2.  **The Vote:** If the boundary was already sharp, why was a vote necessary? Epistemicism implies the vote was merely epistemic (helping us see). But the shift from the "12 planet" draft to the "8 planet" final resolution shows *choice*, not discovery. The drafters found one boundary admissible; the Assembly found another. Epistemicism struggles to explain how two incompatible sharp boundaries can be debated as if both are live options.
      3.  **Higher-Order Vagueness:** The new criterion "cleared the neighbourhood" is itself vague (how much clearing is enough? over what timescale?). The Epistemicist must posit a *second* sharp boundary hidden inside the new definition. This leads to an infinite regress of hidden boundaries.

  ### 3. The Supervaluationist Mapping
  **The Claim:** Before 2006, "planet" was semantically indecisive. There was a range of admissible precisifications. Some included Pluto; some didn't. "Pluto is a planet" lacked a truth value (it was a truth-value gap).
  **The Mechanism:** The IAU vote selected *one* precisification from the set of admissible ones and made it authoritative for scientific discourse.

  *   **Where it fits:**
      1.  **The Gap:** It perfectly models the pre-2006 state. Astronomers disagreed not because some were ignorant of facts, but because the term was under-specified.
      2.  **Admissibility:** This is the crux of your session. For a supervaluationist, a precisification is **admissible** if it respects the "core" of the concept while resolving the "penumbra."
          *   *Core:* Earth, Jupiter, Mars are definitely planets. Asteroids and comets are definitely not.
          *   *Penumbra:* Pluto, Eris, Ceres.
          *   *The IAU's Move:* The "cleared the neighbourhood" clause is admissible because it preserves the core (Earth clears; asteroids don't) while slicing the penumbra. The "12 planet" proposal was *also* admissible (it preserved the core, just sliced the penumbra differently). The vote wasn't about truth; it was about utility.
      3.  **Authority:** Can a vote generate admissibility? In technical contexts, yes. Supervaluationism usually describes organic usage, but in science, stipulation *is* the mechanism of precisification. The IAU acted as a "central bank" for semantic value, cashing in the vague currency for a precise note.

  *   **Where it goes quiet (The Anomaly):**
      1.  **Elimination vs. Shift:** Supervaluationism suggests that once a precisification is selected, the vagueness is resolved (for that context). But the IAU definition immediately reintroduced vagueness ("cleared the neighbourhood" is not mathematically precise in the resolution). The Supervaluationist must argue that the IAU didn't eliminate vagueness but shifted it to a higher order.
      2.  **Fiat vs. Usage:** Supervaluationism relies on the idea that admissibility is constrained by *actual usage*. But the IAU overrode actual usage (many planetary scientists still call Pluto a planet). If the community rejects the precisification, is it still "admissible" in the philosophical sense, or just "stipulated"? The theory struggles to distinguish between a *successful* precisification (accepted by speakers) and a *failed* one (rejected by speakers but enforced by body).

  ### 4. The "Before the Vote" Wrinkle
  **Question:** Was there a fact of the matter in 2005?
  *   **Epistemicist:** Yes. Pluto was determinately X. We just didn't know X.
  *   **Supervaluationist:** No. The sentence was neither true nor false.

  **Analysis:** The historical record supports Supervaluationism. If there were a fact of the matter, the discovery of Eris shouldn't have triggered a crisis; it should have triggered a measurement. The crisis was triggered because Eris broke the *classification system*, not because it revealed a hidden fact about Pluto. The fact that the definition was *changed* to exclude Pluto suggests Pluto's status was contingent on the definition, not the other way around. Epistemicism forces you to say the IAU *discovered* Pluto wasn't a planet. Supervaluationism lets you say the IAU *decided* Pluto wouldn't count under the new regime. The latter fits the sociological reality of the Prague vote.

  ### 5. The "Cleared the Neighbourhood" Clause
  **Question:** Is this a sharpening or a tracking of reality? Is it arbitrary?
  *   **Epistemicist:** Must be tracking reality. It cannot be arbitrary. It must correspond to the hidden essence of "planet."
  *   **Supervaluationist:** It is a sharpening. It is not *totally* arbitrary (constrained by admissibility), but it is a choice among options.

  **Analysis:** The clause functions as a **boundary-drawing tool**, not a discovery tool. It was chosen *specifically* because it yielded the desired result (excluding Pluto/Eris while keeping the eight classical planets).
  *   **For Epistemicism:** This is fatal. If the criterion was selected *to get a specific result*, it cannot be the hidden essence that determined the result all along. That's circular.
  *   **For Supervaluationism:** This is expected. Precisifications are often chosen for pragmatic reasons (taxonomic utility). The fact that it was chosen to solve a counting problem fits the view that vagueness is a problem of semantic decision, not ontological mystery.

  ### 6. Verdict
  **Winner:** **Supervaluationism.**

  **Why:**
  The Pluto episode is a case of **semantic legislation**, not semantic discovery. The IAU did not find a boundary; they drew one to preserve the utility of the term "planet" for dynamical astronomy. Supervaluationism is the only theory that accommodates the idea that a statement can lack a truth value (pre-2006) and then acquire one through a stipulative act that respects core usage (admissibility) without claiming that the act revealed a pre-existing metaphysical fact.

  **The Trouble for the Winner:**
  Supervaluationism wins the case, but the case exposes a limit in the theory.
  1.  **The Authority Problem:** Supervaluationism explains how *usage* precisifies terms over time. It is less equipped to explain how a *committee* precisifies terms by fiat. If the IAU voted tomorrow that "Earth is not a planet," would that be an admissible precisification? Supervaluationism says "No" (violates core cases). But technically, they *could* do it. The theory needs to account for the difference between *semantic admissibility* (constrained by meaning) and *institutional power* (constrained only by rules of order).
  2.  **Persistent Vagueness:** The IAU thought they were killing vagueness. They didn't. "Cleared the neighbourhood" remains vague (what about exoplanets? what about future discoveries?). Supervaluationism handles this via higher-order vagueness, but it highlights that scientific stipulation rarely achieves the absolute precision Epistemicism promises or Supervaluationism resolves.

  **Summary for your group:**
  Use the Pluto case to argue that **Epistemicism conflates classification with natural kind essentialism.** "Planet" is a tool, not a natural kind. Therefore, there was no hidden boundary to be ignorant of.
  Use the case to argue that **Supervaluationism needs a "Legislative Clause."** It handles the pre-vote gap well, but it must expand to explain how institutional authority can select an admissible precisification and enforce it even against dissenting usage (i.e., planetary scientists who still call Pluto a planet). The IAU vote didn't make "Pluto is not a planet" supertrue in *all* English contexts, only in *IAU-sanctioned* contexts. This suggests vagueness is context-sensitive in a way standard Supervaluationism sometimes underplays.

  **Final punchline:** The IAU didn't solve the Sorites paradox; they just voted on where to place the cut for administrative convenience. That is a Supervaluationist move, not an Epistemicist one. Epistemicism requires the cut to be there already; the vote proves it wasn't.
