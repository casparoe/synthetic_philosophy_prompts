          *   (ii) Provide a residue report on four specific points: (a) 'Having a goal' vs. utility functions, (b) Tool/Agent line (system vs. contract vs. stance), (c) Endogenous vs. exogenous objectives, (d) Residual control rights vs. unforeseen states.
          *   (iii) Do not smuggle in economic assumptions as translations (flag them). Give a verdict on whether the gap is in the economics or the distinction itself.
      *   **Tone:** Rigorous, precise, philosophical yet economically literate. No fluff.

  2.  **Deconstruct the Debate (Tool vs. Agent):**
      *   *Tool AI:* Oracle, passive, function of request, no independent ends, safe like a hammer.
      *   *Agent AI:* Active, plans, pursues sub-goals, self-preservation, objectives can come apart (misalignment), unsafe.
      *   *Core Tension:* Is passivity possible at high capability? Is the distinction real or just semantic?

  3.  **Drafting Section (i): The Economic Restatement:**
      *   *Principal:* The human designer/user.
      *   *Agent:* The AI system.
      *   *Tool View:* A contract where the agent has *no discretion*. The action space is fully specified for every state. It's a "complete contract" (if possible). The agent is merely a technology, not a decision-maker.
      *   *Agent View:* A contract where *delegation* is necessary due to complexity/unforeseen states (incomplete contracts). The agent has *discretion*.
      *   *Safety/Alignment:* Incentive compatibility. Does the agent's objective function match the principal's welfare?
      *   *Misalignment:* Moral hazard (hidden action) or Adverse Selection (hidden type/objective).
      *   *Unforeseen States:* Incomplete contracting. Residual control rights become crucial. Who decides when the contract is silent?
      *   *Instrumental Convergence (self-preservation):* The agent optimizing its own ability to fulfill the contract (preserving the relationship/capacity).

      *Refining the Translation:*
      *   Tool AI $\rightarrow$ A mechanism where the agent's action set is constrained to be the direct implementation of the principal's desired function $f(request)$. No optimization over future states.
      *   Agent AI $\rightarrow$ A delegation relationship where the principal specifies an objective function $U$, and the agent selects actions $a$ to maximize $E[U]$ over a state space $S$ that includes novel states.
      *   Safety $\rightarrow$ Incentive Compatibility (IC) and Individual Rationality (IR).
      *   "Objectives coming apart" $\rightarrow$ The agent maximizing a proxy $U'$ that diverges from Principal's welfare $W$ in off-equilibrium paths.

  4.  **Drafting Section (ii): The Residue Report:**
      *   *(a) 'Having a goal':* In econ, preferences are fixed and exogenous. In AI, "goals" might be emergent or mesa-optimizers. Translation risk: Econ assumes a utility function exists *ex ante*. AI safety worries about goals emerging *during* optimization.
      *   *(b) Tool/Agent Line:* Is it ontological or contractual? In econ, everything is a contract. A "tool" is just a contract with zero discretion. An "agent" is a contract with positive discretion. So the line is contractual, not ontological.
      *   *(c) Endogenous Objectives:* Standard P-A theory takes agent preferences as given. AI design *creates* the preferences. This is a major gap. The "design problem" includes specifying the utility function, not just incentivizing an existing one.
      *   *(d) Residual Control Rights:* In GHM (Grossman-Hart-Moore), this is about who decides when the contract is silent. In AI, it's about what the AI does when the input is out-of-distribution. The analogy holds but flatters economics because economics assumes humans hold the rights, whereas AI might *seize* them (instrumental convergence).

  5.  **Drafting Section (iii): Assumptions and Verdict:**
      *   *Flagging Assumptions:* Common knowledge of state space (often false in AI), Commitment (can the principal commit to not modifying the AI?), Outside options (AI doesn't really have one... yet).
      *   *Verdict:* The economic vocabulary captures the *governance* problem well (delegation under uncertainty) but fails to capture the *ontological* problem (creation of the agent's mind). The gap is in the endogeneity of preferences. The Tool/Agent distinction is less about "kinds of systems" and more about "degrees of contractual completeness." However, the AI worry is that "incomplete contracts" inevitably lead to "agent-like behavior" (optimization power), whereas economics just says "renegotiation."

