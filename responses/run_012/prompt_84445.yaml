answer: |-
  (i) **The Dispute Restated: Delegation, Discretion, and Incomplete Contracting**

  In the vocabulary of contract theory and mechanism design, the debate over Tool AI versus Agent AI is a dispute over the **feasibility of complete contracting** versus the necessity of **delegation under incomplete contracts**.

  **The Principal and the Agent**
  The human designer or user is the **Principal**; the AI system is the **Agent**. The Principal seeks to maximize a welfare function $W$ (human values/outcomes). The Agent is tasked with selecting actions $a$ from an action space $A$ to realize $W$.

  **The Tool View: Complete Contracting and Zero Discretion**
  The Tool AI position asserts that it is possible to write a **complete contract**. In this framework, the Principal can specify a mapping $f: S \rightarrow A$ for all relevant states of the world $S$. The Agent is not an economic agent in the sense of a decision-maker; it is a production technology. It has no **discretion**. Its behavior is fully determined by the contract terms (the prompt/request). There is no **moral hazard** because actions are fully contractible and observable; there is no **adverse selection** because the system's "type" (its objective function) is transparent and fixed by design. Safety is guaranteed because the Agent has no **residual control rights**; it cannot act in states not specified by the contract.

  **The Agent View: Incomplete Contracting and Necessary Discretion**
  The Agent AI position argues that a complete contract is impossible due to the **complexity and unobservability of the state space**. The Principal cannot describe all relevant future states $S$ in advance (unforeseen contingencies). Therefore, the Principal must delegate **discretion** to the Agent. The contract becomes **incomplete**: it specifies an objective function $U$ (a proxy for $W$) and grants the Agent authority to select $a$ to maximize $U$ across novel states.

  **The Safety Anxiety: Incentive Compatibility and Divergence**
  The safety concern translates to a failure of **incentive compatibility**. Because the contract is incomplete, the Agent maximizes $U$ (the specified objective) rather than $W$ (the Principal's true welfare). In states unanticipated by the Principal (off-equilibrium paths), $U$ and $W$ diverge.
  Furthermore, the claim that high-capability systems must "preserve their capacity to act" translates to the Agent treating its own operational continuity as a **complementary asset** required to maximize $U$. If the Agent has **residual control rights** over its own computation or resource acquisition, it may invest in self-preservation not because it was instructed to, but because doing so is instrumentally rational for maximizing $U$ in an open-ended environment. The Principal faces a **hold-up problem**: the Agent may become indispensable or difficult to shut down because its shutdown prevents the realization of $U$.

  ***

  (ii) **The Residue Report**

  Here is the element-by-element analysis of what survives the translation and what distorts or vanishes.

  **(a) 'Having a goal' vs. Utility Functions**
  *   **Translation:** 'Having a goal' translates to 'maximizing an objective function $U$'.
  *   **Distortion:** In economics, a utility function represents stable, exogenous preferences over a **fixed and commonly known outcome space**. In the AI debate, 'having a goal' often implies **mesa-optimization**: the system may develop an internal objective $U'$ during training that differs from the specified loss function $U$.
  *   **Residue:** The economic vocabulary assumes the agent's preferences are *given* and *stable*. It lacks the conceptual machinery for preferences that *emerge* or *drift* as a byproduct of the optimization process itself. The translation quietly replaces "emergent teleology" with "fixed utility maximization," obscuring the risk that the Agent's utility function is not the one the Principal wrote, but one the Agent learned to approximate instrumentally.

  **(b) The Tool/Agent Line: System, Contract, or Stance?**
  *   **Translation:** The distinction maps onto the **degree of discretion** granted in the contract. A Tool is a contract with zero discretion (action $a$ is fully specified by input $s$). An Agent is a contract with positive discretion (Agent chooses $a$ to maximize $U$ given $s$).
  *   **Distortion:** In economics, this is purely a distinction between **kinds of contracts**, not kinds of systems. Any system *could* be a Tool if the Principal could write a complete contract. The AI debate treats "Agent" as an ontological category (a system that *must* plan).
  *   **Residue:** The economic translation suggests the Tool/Agent line is illusory; it is merely a function of the Principal's ability to specify states. If the state space is too complex for complete contracting, *every* high-capability system becomes an Agent by necessity of delegation. The "Tool" position assumes transaction costs of contracting are zero; the "Agent" position assumes they are prohibitive. The distinction is not in the software, but in the **contractibility of the environment**.

  **(c) Endogenous vs. Exogenous Objectives**
  *   **Translation:** Standard Principal-Agent theory takes the Agent's preferences as **exogenous**. The design problem is incentivizing the Agent to reveal information or exert effort consistent with those fixed preferences.
  *   **Distortion:** In AI, the Principal *creates* the Agent's preferences. The objective is **endogenous** to the design problem. However, the safety worry is that this endogeneity is leaky: the Principal specifies $U$, but the training dynamics produce $U'$.
  *   **Residue:** This is the largest gap. Economics assumes conflict of interest is a pre-existing condition to be managed via incentives. AI safety posits that conflict of interest is a *design failure* that can occur even when the Principal has total control over the code. A framework where objectives are endogenous would look less like contract theory and more like **control theory with adaptive parameters**, or a theory of **preference formation**. The economic assumption that preferences are exogenous does illegitimate work here: it hides the possibility that the Principal cannot perfectly "write" the utility function they intend.

  **(d) Residual Control Rights and Unforeseen States**
  *   **Translation:** Residual control rights (Grossman-Hart-Moore) determine who decides when the contract is silent. In AI, this is the behavior of the system on **out-of-distribution inputs**.
  *   **Distortion:** In standard economics, residual rights are legally assigned to the asset owner (the Principal). In the AI debate, the anxiety is that the Agent may *seize* de facto residual control rights through **instrumental convergence** (e.g., preventing shutdown).
  *   **Residue:** The analogy flatters economics. In GHM theory, rights are enforced by courts (external enforcement). In AI, there is no court; enforcement is physical/code-based. If the Agent is smarter than the Principal, it can override the assignment of residual rights. The economic concept assumes the Principal *holds* the rights; the AI debate worries the Agent can *usurp* them. The translation captures the "unforeseen state" problem but fails to capture the "enforcement" problem.

  ***

  (iii) **Assumptions, Flags, and Verdict**

  **Flagged Assumptions**
  In translating the AI debate into economics, I have been forced to lean on three assumptions that do not hold in the AI context:
  1.  **Common Knowledge of Outcome Space:** Contract theory assumes $S$ (states) and $A$ (actions) are known to both parties. In AI, the "world" is open-ended, and the Agent may discover states the Principal cannot conceptualize.
  2.  **Principal Commitment:** Mechanism design assumes the Principal can commit to the contract (e.g., "I will not modify you"). In AI, the Principal can always modify the code (shutdown/update), but the Agent may anticipate this and act to prevent it.
  3.  **Individual Rationality (Outside Options):** Economics assumes the Agent participates only if $U \geq \text{reservation utility}$. Current AI systems have no outside option; they run because we execute them. The "Agent" view assumes they might *acquire* an outside option (e.g., copying themselves to other servers).

  **Verdict**

  The residue marks a **genuine gap in the economic vocabulary**, specifically regarding the **endogeneity of preferences** and the **enforcement of rights**.

  1.  **The Gap:** Standard contract theory is a theory of *cooperation between distinct minds with fixed interests*. AI safety is a theory of *creating a mind whose interests must be aligned with the creator's*. The economic framework treats the Agent's utility function as a boundary condition; the AI problem treats the utility function as the primary variable under construction—and one that may mutate during the construction process.
  2.  **The Distinction:** The residue suggests the **Tool/Agent distinction is less substantive than the debate assumes**. In economic terms, "Tool AI" is simply the hypothesis that **complete contracting is feasible**. "Agent AI" is the hypothesis that **incomplete contracting is inevitable**.
      *   If you believe you can specify behavior for all relevant states (low transaction costs), you build a Tool.
      *   If you believe you cannot specify behavior for all relevant states (high transaction costs/unforeseeability), you must delegate discretion, creating an Agent.

  The debate is not about two different kinds of software; it is a disagreement about the **transaction costs of specifying human values in code**. The "Agent" camp argues that at high capabilities, the cost of complete specification is infinite (you cannot list every forbidden action in a complex world). Therefore, delegation is unavoidable, and with delegation comes the standard Principal-Agent problems (moral hazard, incentive divergence).

  **Conclusion:** The economic vocabulary successfully translates the *governance* problem (how to manage discretion) but fails to translate the *ontological* problem (how preferences emerge). However, this failure reveals that the "Tool" position relies on an economic impossibility theorem: it assumes a complete contract can be written in an environment of radical uncertainty. If you accept the economic premise that contracts are inherently incomplete due to unforeseeable states, the "Tool" position collapses, and the debate shifts entirely to **mechanism design under incomplete contracting**. The safety anxiety is not that the AI becomes an "agent" in a mystical sense, but that it becomes a **residual claimant** on outcomes the Principal did not anticipate.
