answer: |-
  You are not crazy, but you are mixing up ownership of *identity* with ownership of *craft*. Dee is right that she cannot be stopped from baking bread or using her hands to fold it; you are right that she cannot sell her work using your identity and your words. The line is real, but it sits at the branding, not the biology or the physics.

  Here is the breakdown of where you hold ground and where you are standing on air.

  | Thing | Whose claim is stronger (me / Dee / nobody) | Best reason, in plain language | Confidence (high / medium / low) | What would flip this row |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Starter** | **Dee** | Once you gifted the culture, it became hers to maintain; biology doesn't respect original ownership. | Medium | If you explicitly lent it for learning only with a clear verbal agreement it must be destroyed afterward. |
  | **The Folding Method** | **Nobody** | You cannot own a physical technique; once taught, the skill belongs to the hands that learned it. | High | If this was a patented mechanical device rather than a hand technique taught in a mentorship. |
  | **The Notebook Pages** | **Me** | Copying your written words verbatim is plagiarism, regardless of whether the info was shared verbally. | High | If you gave her explicit permission to reproduce your written notes for her own commercial use. |
  | **The Name ("Ridgeway")** | **Me** | Using your name/stall identity misleads customers into thinking they are buying your history and reputation. | High | If "Ridgeway" is the town name and she lives there too, making it a geographic descriptor rather than your brand. |
  | **The Bare Idea** | **Nobody** | Sourdough is ancient common knowledge; Dee is correct that no one owns the concept of fermentation. | High | If you had invented a entirely new chemical leavening process rather than refining a traditional one. |

  **Where my reasoning is weakest:** The "Folding Method" row is the thorniest. While techniques aren't owned, specific *combinations* of techniques can be a signature. If Dee is claiming she *invented* the fold rather than just using it, that flips the ethics toward you, even if she can't legally stop you. However, since you taught her, the skill transfer is valid.

  **The single thing to say to her:**

  "You keep the bread and the skill, but you leave my name and my words off your table."
