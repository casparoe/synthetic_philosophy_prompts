  ### 6. The Next Case to Separate the Rules
  To distinguish between the "Discrete Symmetry" rule (predicts 3/8) and the "Continuous Outcome" veto (predicts No Answer), you need a case where the hypothesis is discrete, but the outcome distribution is **invariant** to the hypothesis weight.

