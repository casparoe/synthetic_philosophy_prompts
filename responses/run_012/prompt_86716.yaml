answer: |-
  Look, the atom analogy is where the intuition pump breaks down. Atoms don't have reasons; Peter does. When you talk about an undetermined physical process, you're right—there's no fact of the matter about what it "would" do because there's no internal principle of action steering it one way or the other. It's just probability distributions. But Peter isn't a probability cloud. Even if his choice isn't causally determined by prior states, it's determined by *him* in the moment. The truth of the counterfactual isn't grounded in some past state or a divine decree; it's grounded in Peter's nature as a free agent. If Peter were placed in those circumstances, *Peter* would settle the matter. So the "would" lives in Peter's modal profile—it's a fact about how *he* exercises his freedom, not a fact about the causal chain leading up to it.

  So to answer your second question: Yes, Peter's deliberating is an undetermined process in the sense that prior physical states don't fix the outcome. But it's not undetermined in the sense of being random or uncaused—Peter is the cause. That's the libertarian sweet spot. The truth of the counterfactual is just the logical shadow of that capacity. God doesn't make it true by knowing it; He knows it because it's true of Peter. If you insist that undetermined means "no truth value until the moment of choice," you're basically defining libertarian freedom in a way that makes rational deliberation impossible. I'd rather trust the intuition that I know my friends well enough to know what they'd do, even if they're free, than accept that freedom requires epistemic opacity even for an omniscient mind.
