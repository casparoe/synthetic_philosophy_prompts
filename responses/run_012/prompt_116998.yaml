answer: |-
  **Setting:** *A quiet corner of the university library. Two philosophers, ELIAS (an Epistemicist) and SOFIA (a Supervaluationist), are sitting across from ALEX, a high school student who has been corresponding with them about the problem of vagueness.*

  **ALEX:** Thank you both for meeting me. I've been wrestling with these two cases I invented—the "Secret Ordinance" and the "Zaf" colour—and I can't decide if they're the same kind of problem. Elias, you think vague words have sharp boundaries we just can't know. Sofia, you think they don't have boundaries at all until we make them precise.

  **ELIAS:** Correct, Alex. And I maintain that your first case, the Secret Ordinance, is the model for *all* vague predicates, including your second case.

  **SOFIA:** And I maintain that the Secret Ordinance is a red herring. It's a case of ignorance, not vagueness. Your "Zaf" case is the real deal.

  **ALEX:** Let's start with the Ordinance. The city council picks a number $N$, seals it in a vault, and says a building is a "skyscraper" iff it is $\ge N$ metres. We don't know $N$.

  **ELIAS:** This is straightforward. There is a fact of the matter. A building of height $H$ either is or is not a skyscraper under the ordinance. Our inability to know which is purely epistemic. It's a limitation of our access to the vault, not a limitation of the law.

  **SOFIA:** I agree with Elias here. This isn't genuine vagueness; it's hidden precision. The term "skyscraper" in this legal context has been stipulated to have a sharp cutoff. The semantic value is fixed; we just lack the data.

  **ALEX:** Okay, so we agree on Case 1. Now, Case 2: The word "zaf." A community starts using it for objects resembling a teal swatch. They use it confidently for clear teal things. They never use it for clear blue or green things. But for the borderline shades, they've never had to decide. There is no vault. No stipulation. Just usage. Elias, you say this is the same as the Ordinance?

  **ELIAS:** Fundamentally, yes. In the Ordinance, the boundary is fixed by a legislative act. In the "Zaf" case, the boundary is fixed by the totality of linguistic usage and physical facts.

  **SOFIA:** But there *was* no act, Elias. That's the point.

  **ELIAS:** Not a conscious act, no. But meaning is determined by how we use words in the world. Think of it like a map. If I draw a map of a territory, there is a precise line where the ink stops. If the territory has a mountain range, there is a precise line where the elevation crosses a certain threshold. When we use "zaf," our pattern of application, combined with the physics of light and human vision, necessitates a cutoff point. There *must* be a specific shade where "zaf" stops applying. If there weren't, the word would fail to refer at all.

  **SOFIA:** That's a huge leap, Elias. You're assuming that successful reference requires a sharp boundary. I deny that. In the "Zaf" case, the community's usage determines a *range* of admissible precisifications, not a single line.

  **ALEX:** Can you unpack that, Sofia?

  **SOFIA:** Sure. When the community learned "zaf," they learned rules like "Apply it to this teal swatch," and "Don't apply it to that navy swatch." These rules constrain the meaning. But they don't constrain it enough to pick out exactly one wavelength of light as the cutoff. So, there are many ways to make "zaf" precise that are consistent with how the community uses it. Some precisifications draw the line here, some there.

  **ELIAS:** But in any actual conversation, doesn't the word have to work?

  **SOFIA:** It does. But it works *without* a single sharp boundary. On my view, a sentence like "This chip is zaf" is **super-true** if it comes out true on *all* admissible precisifications. It is **super-false** if false on all of them. And if it's true on some but false on others? Then it has no truth value. It's neither true nor false. There is no fact of the matter.

  **ELIAS:** And that is where you lose me, Alex. Classical logic tells us every declarative sentence is either true or false (Bivalence). If "This chip is zaf" is neither, you've broken logic. In the Ordinance case, we accept Bivalence because we know a number exists. I argue the same applies to "zaf." The boundary exists; it's just that our knowledge is limited by a "margin for error." We cannot know exactly where the boundary is because to know it, we'd have to be able to distinguish the boundary case from its neighbor, which is impossible by definition.

  **ALEX:** This brings me to my first worry, and it's for you, Sofia. You say there's a range of admissible precisifications. But is *that* range sharp?

  **SOFIA:** I'm listening.

  **ALEX:** You say there are "admissible" ways to make "zaf" precise and "inadmissible" ones. Presumably, a precisification that calls a bright red object "zaf" is inadmissible. But what about the edge of the admissible set? Is there a sharp boundary between the admissible precisifications and the inadmissible ones?

  **SOFIA:** *Sighs.* That is the problem of higher-order vagueness.

  **ALEX:** Exactly. If you say there is a sharp boundary between "admissible" and "inadmissible," then you've just reintroduced vagueness at a higher level. You've solved "zaf" by positing a sharp boundary for "admissible." But isn't "admissible" itself vague? If so, doesn't the problem just recur one level up?

  **SOFIA:** You've caught me in a difficult spot, Alex. A strict supervaluationist might bite the bullet and say the set of admissible precisifications is sharp. But many of us admit that higher-order vagueness is real. We can model that by saying the *collection* of precisifications is itself fuzzy.

  **ALEX:** But if the collection is fuzzy, how do you define truth? If it's not clear whether a precisification is in the set, how can you say a statement is true on *all* of them?

  **SOFIA:** It's a technical challenge, I grant you. But compare it to Elias's view. He posits a magical, unknowable sharp line in the spectrum of colour. I posit a fuzzy set of reasonable interpretations. My view preserves the intuition that there is no "fact of the matter" for borderline cases. Your view, Elias, forces us to believe that there is a specific photon wavelength where "zaf" suddenly becomes false, even though no human could ever detect the difference. That seems metaphysically extravagant.

  **ELIAS:** It seems extravagant only if you think meaning is transparent to us. But Alex, this leads to your second worry, which is the strongest argument against my position. You asked: *What fixes the boundary?* In the Ordinance, a council member wrote a number. In "Zaf," no one decided anything. So, why is the cutoff at wavelength 490nm and not 491nm?

  **ALEX:** Yes. That's what keeps me up at night. If you say there is a fact of the matter, what *makes* it a fact?

  **ELIAS:** It is fixed by the complex interaction of our psychological dispositions, the physical environment, and the causal history of the word's use. Think of it like a mountain range. Where exactly does the "hill" end and the "mountain" begin? Geologists might say there's a precise topographic prominence. If we use the word "mountain," our usage is sensitive to those physical facts.

  **ALEX:** But geologists can stipulate a definition. The community using "zaf" didn't.

  **ELIAS:** They didn't stipulate consciously, but their usage *is* the stipulation. Every time they said "that's zaf" or "that's not zaf," they were casting a vote. The boundary is the equilibrium point of all those usage-facts. It's not arbitrary; it's determined by the world and our interaction with it. It just happens to be unknowable.

  **SOFIA:** But Elias, that implies that if the community had used the word slightly differently—say, one person hesitated on a specific shade—the boundary would have shifted to a completely different wavelength.

  **ELIAS:** Precisely.

  **SOFIA:** Then the boundary is incredibly fragile. It means that for any borderline case, there is a fact of the matter, but that fact is utterly unconnected to our reasons for using the word. We use "zaf" based on similarity. But similarity doesn't have sharp cutoffs. So you're saying our word, which is based on similarity, somehow latches onto a non-similarity-based sharp cutoff?

  **ELIAS:** I'm saying our word latches onto a category. Categories in the world might be fuzzy to our perception, but they are sharp in reality.

  **ALEX:** I feel like I'm seeing the trade-off now. Elias, you save classical logic and the idea that every statement is true or false, but you pay for it by saying there are unknowable facts fixed by... what? A mysterious equilibrium of usage?

  **ELIAS:** I pay for it by accepting that language is more precise than our knowledge of it.

  **ALEX:** And Sofia, you save the intuition that there's no fact of the matter for borderline colours, but you pay for it by dealing with truth-value gaps and the problem of higher-order vagueness.

  **SOFIA:** I pay for it by accepting that logic needs to be flexible enough to handle semantic indeterminacy. I think that's a cheaper price than believing in magic cutoffs.

  **ALEX:** So, regarding my two cases: The Ordinance and "Zaf." Do you agree on anything?

  **ELIAS:** We agree that in the Ordinance, the boundary is sharp. I argue "Zaf" is the same.

  **SOFIA:** We agree that in the Ordinance, the boundary is sharp. I argue "Zaf" is fundamentally different because the mechanism of meaning-fixing is different. One is stipulation; the other is organic use.

  **ALEX:** It seems the core disagreement isn't really about the cases themselves, but about how meaning works. Elias, you think meaning *must* determine a reference. Sofia, you think meaning *constrains* reference but doesn't always determine it uniquely.

  **ELIAS:** Well put. If meaning didn't determine reference, communication would be a miracle.

  **SOFIA:** And if meaning always determined a sharp reference, our inability to find it would make communication a miracle of a different sort.

  **ALEX:** *Pauses to take notes.* I think I see why I couldn't settle this on my own. It's not a puzzle with a missing piece; it's a choice between two different ways of describing the relationship between words and the world.

  **ELIAS:** Philosophy often ends not with a solution, Alex, but with a clearer view of the cost of each solution.

  **SOFIA:** Exactly. The question for you is: Which cost are you willing to pay? Unknowable sharp boundaries, or truth-value gaps?

  **ALEX:** I think... I think I need to go home and think about whether I'm more afraid of magic cutoffs or broken logic. Thank you both.

  **ELIAS:** Anytime, Alex.

  **SOFIA:** Keep questioning. That's where the precision lies.
