      *   *Decision:* I will keep it as a two-person dialogue but have them explicitly state, "A student might ask..." OR I can introduce the student as a moderator. A three-way dialogue is often clearer for this purpose. Let's try to keep it to two main speakers but have them address the "interlocutor's" concerns. Actually, adding the student as a participant makes the "worries of mine" section much more organic. I will add "Alex" (the student) for the final section.

      *   *Refining the "Zaf" case:* Ensure it's clear that *no* stipulation happened. It's purely organic usage.
