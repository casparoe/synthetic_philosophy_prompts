      *   *Dialogue Flow:*
          1.  Establish agreement on Case 1.
          2.  Move to Case 2.
          3.  Elias argues for similarity (Semantic Determinism).
          4.  Sofia argues for difference (Semantic Indeterminacy).
          5.  Address Worry 2 (Determination) -> Elias's tough spot.
