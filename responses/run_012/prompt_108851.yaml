answer: |-
  Here is the specification of desiderata for a theory of what matters in survival, structured to isolate the genuine theoretical constraints from the camp-specific prejudices, followed by the inconsistency proof, the application to your custom cases, and the evaluation of existing contenders.

  ### I. The Desiderata Specification

  **1. The Self-Concern Datum**
  *   **Case:** The intuitive asymmetry between how I regard my own future pain and how I regard yours.
  *   **Requirement:** The theory must explain why I have a special, prudential concern for the future stages of this organism/person that I do not have for others, or explain why this concern is an illusion.
  *   **Status:** **Non-Negotiable.** A theory of *survival* that cannot ground or dissolve special concern fails to address the phenomenon it purports to describe.

  **2. The Teletransporter Differential**
  *   **Case:** Destructive Teletransportation (scan-destroy-replicate) vs. Non-Destructive Teletransportation (scan-replicate-survive).
  *   **Requirement:** The theory must account for the strong intuition that these cases differ in survival value. It need not validate the intuition that the first is death, but it cannot treat the metaphysical stakes as identical without explaining the source of the intuitive divergence.
  *   **Status:** **Non-Negotiable (Explanatory).** Ignoring the intuitive gap renders the theory descriptively inadequate, even if it prescriptively argues the gap is irrational.

  **3. The Fission Constraint (No Privilege)**
  *   **Case:** A person divides into two psychologically continuous successors (Lefty and Righty).
  *   **Requirement:** The theory cannot assert that one successor is the original and the other is not, unless it provides a non-arbitrary criterion for distinguishing them.
  *   **Status:** **Non-Negotiable.** Asserting a fact of the matter without a differentiating ground is theoretical fiat.

  **4. The Gradualism Constraint (The Sorites of Self)**
  *   **Case:** The psychological and physical drift from infant to old age via overlapping chains of connection.
  *   **Requirement:** The theory must not posit a sharp metaphysical boundary where none exists phenomenologically or biologically, unless it can locate a specific event that constitutes the boundary.
  *   **Status:** **Non-Negotiable.** Arbitrary cutoffs violate the continuity of the data.

  **5. The Practical Weight Requirement**
  *   **Case:** Promises, debts, punishment, grief, and commitment.
  *   **Requirement:** The metaphysical account of survival must map onto our ethical and legal practices. If the theory says "X survives," it must be able to justify why X inherits the debts of the predecessor.
  *   **Status:** **Non-Negotiable.** A metaphysics of personhood that severs entirely from the ethics of personhood is functionally useless.

  **6. The Identity/Matters Gap**
  *   **Case:** The Reductionist move (Parfit).
  *   **Requirement:** The theory must explicitly state whether "what matters" is identical to "personal identity" or distinct. If distinct, it must define the relation.
  *   **Status:** **Non-Negotiable.** Ambiguity here is the primary source of the circularity you experienced with your friend.

  **7. The Assumption of Binary Survival**
  *   **Case:** The intuition that one is either alive or dead, oneself or another.
  *   **Requirement:** Survival is an all-or-nothing affair.
  *   **Status:** **Camp Preference (Common Sense/Non-Reductionist).** Reductionists argue survival comes in degrees (strength of psychological connection). Insisting on binary survival forces the theory into contradictions in fission and gradual cases.

  **8. The Assumption of Transitive, One-One Identity**
  *   **Case:** Logic of identity (If A=B and A=C, then B=C).
  *   **Requirement:** Identity must hold strictly to logical transitivity and uniqueness.
  *   **Status:** **Genuine (Logical),** *but* applying this strictly to *what matters* is a **Camp Preference.** One can maintain logical identity while arguing identity is not what matters (Parfit), or that identity relations in persons are contingent/conventional (Lewis).

  **9. The Assumption of a Deep Further Fact**
  *   **Case:** The belief that there is a truth about "who is who" independent of physical or psychological facts.
  *   **Requirement:** There is a fact of the matter about identity over and above the descriptive facts.
  *   **Status:** **Camp Preference (Non-Reductionist/Realist).** Reductionists and Conventionalists deny this. Demanding it rules out half the viable literature by fiat.

  ---

  ### II. The Incompatibility Argument

  You suspected that **All-or-Nothing Survival**, **No Privileged Branch in Fission**, and **Identity is What Matters** cannot be held simultaneously. You are correct. This is the "Fission Trilemma."

  1.  **Premise 1 (Identity Matters):** Survival consists in personal identity. (If I survive, I am identical to the future person).
  2.  **Premise 2 (Logic of Identity):** Identity is one-one and transitive. (I cannot be identical to two distinct future people).
  3.  **Premise 3 (Fission Data):** In fission, two distinct future people (Lefty and Righty) both possess equal claim to being me (psychological continuity), and there is no fact of the matter privileging one (No Privilege).
  4.  **Conflict:**
      *   If Identity Matters (P1) and Identity is One-One (P2), I can survive as at most one of them.
      *   If I survive as only one, we have privileged a branch (Violates P3).
      *   If I survive as both, Identity is not One-One (Violates P2).
      *   If I survive as neither, Identity is not what matters (Violates P1), because intuitively I *do* survive fission (or at least, it is not as bad as death).
  5.  **Conclusion:** You must abandon one.
      *   **Abandon P1:** (Parfit) Identity does not matter; Relation R (psychological continuity) matters. Survival is not binary.
      *   **Abandon P2:** (Lewis) Identity is not one-one in fission; I am the overlapping stage of two distinct persons.
      *   **Abandon P3:** (Epistemicism) There *is* a privileged branch, we just can't know which. (Highly costly theoretically).

  ---

  ### III. Application to Custom Cases

  **Case 1: Continuity Insurance**
  *   **Scenario:** A policy pays a sum to "the policyholder" surviving a term. Fission occurs. Both branches claim the sum. The firm pays only one sum total.
  *   **Analysis:**
      *   **If Identity is What Matters:** The contract is void or ambiguous upon fission. If only one branch is *identical* to the payer, the other is a fraudster. But since the theory cannot specify *which* without privilege (Desideratum 3), the firm cannot know whom to pay. The theory fails **Practical Weight (5)**.
      *   **If Continuity is What Matters:** Both branches have an equal claim. If the firm pays one, it arbitrarily disadvantages the other "survivor." If it splits the sum, it admits there are two claimants, implying the original "person" (as a unit of account) has become two.
      *   **Verdict:** This case exposes that our legal/practical conventions rely on **One-One Identity (8)** even if our metaphysics suggests **Continuity (3)**. A theory that validates fission survival must explain why the insurance contract doesn't double the payout. Only a **Conventionalist** view (we *decide* who gets paid) resolves this without metaphysical contradiction.

  **Case 2: Slow Psychological Replacement**
  *   **Scenario:** Total psychological turnover over time without copying/destruction. Treated as same person.
  *   **Analysis:**
      *   **The Challenge:** If the Teletransporter (copy + destroy) is death, why is Slow Replacement (change + continuity) survival? The end state (a person with no original memories/traits) is identical in both.
      *   **The Difference:** The only difference is the **Causal Process**. Slow replacement maintains continuous causal dependence between stages; Teletransportation breaks the causal chain (or relies on a different kind of causation).
      *   **Verdict:** A theory that calls Slow Replacement survival *must* rely on **Causal Continuity** rather than **Qualitative Similarity**. If it relies on Qualitative Similarity, Slow Replacement is death. If it relies on Causal Continuity, it struggles to explain why Teletransportation (which has causal dependence of replica on original) is different.
      *   **Constraint Tested:** This tests **The Teletransporter Differential (2)**. To distinguish them, the theory must posit that the *mode* of causal transmission matters (biological/brain continuity vs. information scanning). If it cannot, it must concede Teletransportation is survival (Parfit) or Slow Replacement is death (Extreme Skepticism).

  ---

  ### IV. The Killer Constraint

  **The Requirement that Eliminates the Most Candidates:**
  **The Fission Constraint (No Privileged Branch) combined with the Demand that Identity be What Matters.**

  Individually, these are manageable. Together, they destroy the "Simple View" (that we are indivisible souls or strictly biological organisms where identity is the sole currency of survival).
  *   It kills the **Simple Ego Theory** (cannot explain fission).
  *   It kills **Strict Biological Criteria** (if brain bisection is possible).
  *   It kills **Strict Psychological Criteria** (without modification like Lewis's overlap).
  *   It forces the **Reductionist** to separate Identity from What Matters.
  *   It forces the **Non-Reductionist** to deny the possibility of fission or accept brute facts.

  It is the single point where metaphysics, logic, and intuition collide irreconcilably.

  ---

  ### V. Scorecard of Contenders

  **Lockean (Psychological Continuity):** Fails fission unless it abandons the transitivity of identity or accepts that you cease to exist when you multiply.
  **Biological (Animalism):** Secures identity in fission (you are the organism) but fails to validate the intuition that psychological copies have a claim to survival.
  **Parfitian (Reductionist):** Saves what matters in fission and teletransportation by conceding that identity is not what matters and survival comes in degrees.
  **Lewisian (Overlap):** Preserves identity logic by positing that two persons were present all along, sharing a pre-fission stage, at the cost of common-sense unity.
  **Conventionalist:** Dissolves the metaphysical problem by treating identity as a social decision, satisfying practical weight but abandoning the "fact of the matter."
  **Epistemicist:** Maintains all common-sense intuitions by asserting a fact of the matter in fission exists but is unknowable, at the cost of positing brute, inaccessible truths.
