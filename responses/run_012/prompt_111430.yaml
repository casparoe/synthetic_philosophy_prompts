  Two members of the lifetime club are watching the nightly roll call.

  **Member A:** "Charlie's been expelled. He went bust playing a favorable game."
  **Member B:** "Let me guess: he was maximizing expected wealth."
  **Member A:** "Naturally."
  **Member B:** "Ah. So he's solvent in the ensemble, just not in the room."

  This joke turns on the ergodicity breaking inherent in repeated multiplicative settings, where the ensemble average (expected wealth) diverges from the time average (geometric growth), rendering the EV-maximizer statistically rich but practically ruined.
