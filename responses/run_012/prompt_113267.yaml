answer: |-
  Your hypothesis is correct, but it can be sharpened. This is not merely a disagreement about what explanations are *permitted*; it is a disagreement about what constitutes a **causal bottleneck**.

  The stalemate persists because you are treating this as a single question with a binary answer ("Is it a code: Yes/No?"). It is not. It is a collision between two distinct causal models that are both empirically adequate but ontologically incompatible. The Literalists are arguing from **Counterfactual Dependency**; the Deflationists are arguing from **Causal Mechanism**.

  Here is the diagnosis of why you have not moved an inch, why you will not move an inch via molecular data, and what would actually count as progress.

  ### 1. The Diagnosis: Control vs. Construction

  The Literalists and Deflationists agree on the physics. They disagree on the **topology of causation**.

  *   **The Deflationist (Mechanism) View:** Causation is continuous. The egg, the cytoplasm, the chromatin, and the DNA are all physical participants in a single, coupled dynamical system. To single out DNA as the "code" is to arbitrarily privilege one component of the machine over the others. In a car engine, the spark plug is not the "code" for the explosion; it is merely one causal trigger among many (fuel, compression, timing). To call it a code is to invoke a ghostly layer of "meaning" where there is only push-and-pull.
  *   **The Literalist (Information) View:** Causation is hierarchical. There is a distinction between the *control parameters* and the *energy source*. DNA acts as a tape that constrains the outcome without supplying the energy. The fact that the sequence can be moved between species (horizontal transfer) or silenced without being destroyed proves that the *specificity* of the outcome is decoupled from the *chemistry* of the medium. This decoupling is the hallmark of a code.

  **Why the stalemate is permanent:**
  You cannot settle this empirically because both models are **projectable**.
  *   If you ask a mechanistic question ("How does the ribosome catalyze the peptide bond?"), the Deflationist vocabulary is superior. "Information" adds nothing to the quantum chemistry of the active site.
  *   If you ask a control question ("Why does this mutation cause cystic fibrosis in humans but not in mice?"), the Literalist vocabulary is superior. The "meaning" of the sequence changed relative to the cellular context, a fact obscured if you only look at binding affinities.

  The recurring moves (misrepresentation, interpreters) fail because they are **category errors masquerading as tests**.
  *   **The Misrepresentation Test:** The Deflationist says "molecules can't be wrong." The Literalist says "mutations are errors." They are using "wrong" differently. One means *logical falsity* (semantic), the other means *functional failure* (teleological). You cannot bridge this with data because "function" is itself a normative concept imposed by the observer (or evolution), not a physical force.
  *   **The Interpreter Test:** The Deflationist demands a homunculus to avoid infinite regress. The Literalist accepts the ribosome as a "frozen accident" interpreter. This is a disagreement about **reductionism**. The Deflationist believes all biological agency must reduce to chemistry. The Literalist believes biological agency is a real, emergent causal power that chemistry alone cannot track efficiently.

  ### 2. Why No Verdict Is Possible (And Why That Is Good)

  You asked for an argument that no progress should be expected. Here it is: **Biological practice requires both ontologies to function, and forcing a choice destroys explanatory power.**

  If you side entirely with the Deflationists, you lose the ability to do synthetic biology. You cannot engineer a gene circuit using only binding affinities; you must treat DNA sequences as logical gates (codes). If you treat them merely as chemicals, the combinatorial complexity becomes unmanageable. The "code" metaphor is a **compression algorithm** that allows biologists to ignore the irrelevant physical details of the nucleotides to focus on the logical structure of the pathway.

  If you side entirely with the Literalists, you lose the ability to do structural biology or drug design. You cannot design a small-molecule inhibitor by treating the ribosome as a "reader." You must treat it as a physical lock. The "machine" metaphor is a **grounding algorithm** that prevents biologists from assuming the cell "wants" to do something when it is physically constrained from doing so.

  The stalemate exists because **science is not monolithic**. The molecular biologist *in the lab* is a Literalist when cloning and a Deflationist when crystallizing. The conflict only arises in the *seminar room*, where you demand a single, unified ontology for the whole organism.

  Therefore, a verdict is not just unreachable; it is **scientifically regressive**. Declaring DNA "literally a code" invites dualism (where is the mind reading it?). Declaring it "merely chemistry" invites reductionism that cannot account for evolutionary homology or genetic engineering.

  ### 3. What Counts as Progress?

  Since a verdict is impossible, progress must be defined as **dissolving the demand for a verdict**. You will know you have made progress when the group stops asking "Is it true?" and starts asking "Where does the leverage lie?"

  **The Better Question:**
  Replace "Is DNA a code?" with **"Under what conditions does the informational stance yield predictive leverage that the mechanistic stance obscures?"**

  This shifts the debate from metaphysics to **methodology**. It allows you to map the boundary conditions:
  *   *Informational stance wins:* When context is stable, and sequence variation is the primary variable (e.g., phylogenetics, CRISPR design).
  *   *Mechanistic stance wins:* When context is variable, and physical constraints are the primary variable (e.g., developmental biology, prion folding, epigenetics).

  **Specific Moves to Disarm the Stalemate:**
  1.  **Retire "Literal":** Agree that "literal" is the wrong metric. In science, models are not true/false; they are **fit/unfit for purpose**. Newtonian gravity is not "literally true" (General Relativity supersedes it), but it is not "mere metaphor" either. It is a valid effective theory. Treat "Genetic Code" as an effective theory.
  2.  **The "Causal Bottleneck" Test:** Instead of asking if there is an "interpreter," ask where the **causal bottleneck** is. In translation, the bottleneck is the codon-anticodon matching (Information). In folding, the bottleneck is the thermodynamic landscape (Chemistry). Acknowledge that the cell switches between regimes.
  3.  **Acknowledge the Normative:** Admit that "Information" and "Code" import **normativity** (rules, errors, functions) into biology. The Deflationists fear this because it looks like magic. The Literalists need this because evolution is inherently normative (selection selects *for* something). Progress comes from admitting that biology is the study of **physical systems that have acquired normative status through evolution**.

  ### Summary

  You are stuck because you are trying to solve a **pragmatic** problem with **ontological** tools.

  *   **Diagnosis:** It is a substantive disagreement about explanatory levels, specifically regarding whether functional organization (Literalist) is reducible to physical mechanism (Deflationist) without loss.
  *   **Verdict:** None is possible. Both are effective theories for different domains of biological inquiry.
  *   **Progress:** Progress is the realization that the question "Is it literally a code?" is ill-posed. The new question is "When does the code model fail?" (e.g., in epigenetics or prion inheritance) and "When does the chemical model fail?" (e.g., in synthetic gene circuits).

  If your group can agree that "Information" is a **real causal pattern** (not just a metaphor) but **not a fundamental substance** (not distinct from physics), you will have moved. You must accept that biology lives in the gap between the two.
