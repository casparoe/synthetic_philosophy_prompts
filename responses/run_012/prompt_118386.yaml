answer: |-
  DIRECTORATE OF ORDINAL STABILITY
  INTERNAL MEMORANDUM 44-B
  TO: Appointment Cohort 9
  FROM: Office of the Senior Clerk
  DATE: [Current Cycle]
  SUBJECT: Operational Protocols for Statutory Reception

  **1. Origin Management**

  1.1. Magistrates are advised that the authority of a statute correlates inversely with the clarity of its inception. Rules whose beginnings are lost to time are received as permanent features of the landscape. Consequently, when introducing necessary adjustments, do not record the date of enactment as the date of origin. Instead, classify the adjustment as a "clarification of existing practice."

  1.2. Instances where a rule arises from immediate necessity require careful archival handling. If a regulation is known to have begun as a temporary measure, all references to the temporary condition must be expunged from the public record after the designated stabilization period (usually five years). An old origin is preferable to a good origin; a rule known to be fifty years old commands compliance regardless of its utility, whereas a rule known to be useful but new invites debate regarding its necessity.

  1.3. Do not attempt to justify a rule by explaining the problem it solved. The public is better served by believing the rule exists because it is the rule. Examination of origins invites the suggestion that things could have been otherwise. Stability requires the appearance of inevitability.

  **2. Separation of Ledgers**

  2.1. The Directorate maintains two distinct registers: the Register of Entitlements (Justice) and the Register of Compliance (Force). These documents must never cross-reference one another. A citation from the Register of Compliance may not be used to validate a claim in the Register of Entitlements, and vice versa.

  2.2. Consider the Ordinance on Canal Withdrawal. This rule dictates water distribution during dry cycles. Internally, it is recorded that this Ordinance originated eleven years ago due to a pump failure in the Upper District. Externally, it is cited as a longstanding custom of equitable sharing. In court, you will enforce the Ordinance using the mechanisms of the Register of Compliance (fines, seizure) without arguing that the pump failure makes the rule right. You will argue the rule is right because it is received.

  2.3. Force is easily recognized; it is visible in the officer, the fine, the barrier. Justice is not visible; it is inferred. If you attempt to prove justice using force, you admit the justice was lacking. If you attempt to enforce force without the cover of justice, you admit to tyranny. The ledgers remain separate so that the citizen sees the force but accepts the justice. They are joined only in the act of compliance, not in the text of the law.

  **3. Instruction of the Academy**

  3.1. Magistrates in training at the Academy are to be instructed that the law is ancient and its authority rests on its reception. They must learn to speak of statutes as discovered truths rather than constructed arrangements. This is not deception; it is the proper framing of custom. Reason has corrupted our access to natural order; therefore, the accumulated weight of practice is the only reliable guide we possess.

  3.2. Internal seminars within the Directorate may discuss the factual history of statutes. Here, it is permissible to acknowledge that certain laws were established to resolve specific conflicts of power. However, these facts are for administrative use only. They explain why we hold the position, not why the position is held.

  3.3. Caution is required when moving between these contexts. In Incident Report 88-C, Magistrate Harlow remarked at a public dinner that the Grain Storage Act was "a convenient fiction established during the famine." While factually accurate regarding the Act's origin, this remark undermined the Act's reception. Magistrate Harlow was reassigned to archival duties. The truth of an origin is less important than the stability of the outcome.

  **4. Handling Appeals to Nature**

  4.1. Litigants may occasionally claim a statute violates Natural Law. Do not concede that specific Natural Laws are currently operative, as human reason is too corrupted to identify them with certainty. However, do not deny the existence of Natural Law entirely, as this removes the ultimate horizon of justice.

  4.2. The standard response is to acknowledge the claim while noting that "received custom is the only visible manifestation of natural order available to us." This maintains the asymmetry: Force is what we can do; Justice is what we aim for; Custom is where they meet. To argue against custom is to argue against the only bridge we have.

  4.3. If a litigant insists their natural right supersedes statutory law, they are reminded that rights without enforcement are merely opinions. The Directorate provides the enforcement. The litigant provides the opinion. The Court provides the judgment that aligns the opinion with the enforcement.

  **5. Note on the Present Document**

  5.1. This memorandum is issued under the authority of the Senior Clerk. Its validity rests on its issuance and your receipt of it. You are not required to inquire into the authority by which the Senior Clerk issues memoranda, nor into the origin of the protocols contained herein. To question the origin of this guidance would be to violate the protocols it describes. Acceptance of this document constitutes compliance with its contents. Its age begins now; its authority begins upon reading.
