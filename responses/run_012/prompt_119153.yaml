  **Theory Note:**
  The punchline relies on the distinction between **Iterated Elimination of Strictly Dominated Strategies (IESDS)** and **Iterated Elimination of Weakly Dominated Strategies (IEWDS)**. While IESDS is order-independent and never removes a Nash Equilibrium, IEWDS is order-dependent and can eliminate some or all Nash Equilibria, potentially leaving the player with no viable strategies (the empty set).
