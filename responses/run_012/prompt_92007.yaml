answer: |-
  **MUNICIPAL OFFICE OF OCCASIONAL SAFETY**
  **NOTICE: GUIDANCE FOR THERMAL OCCASIONS**

  **1. REQUIRED ACTIONS UPON PERCEIVING FLAME**
  Upon observing combustion, immediately relocate your person to the exterior. While movement possesses no inherent power to preserve life, it is the occasion upon which God usually wills continued bodily integrity. If feasible, cast water upon the burning object. Water holds no capacity to extinguish; however, historically, the conjunction of water and flame is the moment God habitually ceases to create the state of burning. Do not gather belongings. Material possession is no guarantee of future existence.

  **2. PROHIBITED ASSUMPTIONS**
  Do not assume the wall will hold the fire. Do not assume the fire will not spread. Do not linger based on the expectation of necessity, for God is free to alter His Habit at any moment. Do not claim that smoke *causes* coughing. Smoke is merely the occasion upon which God usually wills the lungs to spasms. Avoid testing this Habit.

  **3. WHAT TO EXPECT FROM THE BRIGADE**
  The Fire Brigade will arrive. They will apply water via pumps. The pumps possess no mechanical force to suppress heat. However, the arrival of the Brigade coincides with a high frequency of divine mercy regarding property loss. If the building remains standing, it is not because of the bricks, but because God continues to create the state of "structure" rather than "rubble."

  **4. FREQUENTLY ASKED QUESTIONS**
  **Q: Will the smoke alarm save me?**
  A: The device signals an occasion. Your response aligns you with the Habit of survival. The sound itself has no power to protect.
  **Q: Can I touch the fire?**
  A: You may. However, pain usually follows contact. We advise against occasioning pain.
  **Q: Is the exit door locked?**
  A: Locks are occasions for obstruction. We advise checking the handle. Usually, it turns.

  ***

  **[MINORITY OPINION: COMMITTEE MEMBER 7]**
  > Look, I know the doctrine. I know we aren't supposed to say nature has power. But I'm putting this in writing: Fire burns. It is hot. It turns flesh to ash. It is not just a "divine occasion." It has real causal efficacy. If you touch it, you will be hurt because of the fire, not just because God decided to hurt you at that specific moment. Please just run. It burns. Get out.
  > *[Note: This statement has been flagged for theological review. Member 7 has been reassigned to the Department of Metaphysical Corrections.]*

  ***

  **APPROVED BY THE BOARD OF OCCASIONALISTS**
  *Trust in the Habit, but acknowledge the Will.*
