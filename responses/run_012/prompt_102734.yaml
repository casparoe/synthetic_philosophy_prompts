answer: |-
  This is a sophisticated pivot, and you are in good company. The argument for moral trade (MT) has been most rigorously developed by Michael Huemer, Alex Tobin, and within certain Effective Altruism circles (e.g., Budolfson). The intuition is compelling: if we are uncertain about our own moral weights, and we know others have different weights, trading concessions is a Pareto improvement on expected value.

  However, you are right to suspect that the "repugnant" extensions (trading with monsters, clearing houses, trading votes) are where the theory is stress-tested. You asked for the case against MT that does not rely on "sacred value" intuitions but rather on structural failures, instrumental harms, and hidden assumptions. You want to know where the machinery breaks or does something the operators didn't authorize.

  Here is the strongest case against moral trade, sorted from structural/fatal to awkward/manageable, focusing on defeaters a sympathetic defender should concede.

  ### 1. The Epistemic Hazard (Fatal)
  **The Argument:** Moral trade treats moral beliefs as *preferences*. But some moral beliefs are claims about *facts* (e.g., "fetuses are persons," "animals feel pain," "this policy causes unemployment"). When you trade with someone who holds a false moral belief based on a factual error, you are not merely accommodating a different weighting of values; you are subsidizing an error.

  **Why it moves a defender:** A defender wants to maximize expected value. But a clearing house mechanism creates a market price for moral concessions. If I trade with a climate denialist (I concede on border policy, they concede on carbon tax), I have increased their political capital on the border while decreasing it on carbon. If their stance on the border is based on xenophobic factual errors, I have empowered a false narrative.
  More critically, **trade reduces the incentive to correct the error.** If I can get what I want by trading with you, I no longer need to convince you that you are wrong. MT creates a "peace treaty" between truth and falsehood. It prices truth as just another commodity. In a world with robust MT, false moral beliefs become *more* stable because they become tradable assets rather than obstacles to cooperation.

  **The "Under the Table" Mechanism:** The clearing house implicitly assumes that all moral positions are equally valid starting points for negotiation. It smuggles in a radical moral relativism at the meta-ethical level, even if the participants are moral realists. It works *as advertised* (both sides get more of what they want), but the world comes out worse because the correlation between moral influence and moral truth is weakened.

  ### 2. The Signaling Collapse (Fatal for Political Trades)
  **The Argument:** You mentioned trading votes and advocacy. This is where MT faces a category error. A vote or a public advocacy statement is not just a causal lever; it is a *signal*. It conveys information about the constituency's values to representatives and the public.

  **Why it moves a defender:** If votes are tradable (e.g., via vote-swapping apps, but institutionalized), the signal is garbled. If a politician wins a mandate on "Protect the Environment," but 20% of those votes were actually traded by people who care more about "Tax Cuts" (who conceded the environment to get the tax cuts elsewhere), the politician cannot govern effectively. They think they have a mandate for X, but the coalition is actually held together by Y.
  This leads to **dynamic inconsistency.** The value of the vote *as a signal* is destroyed by the ability to trade it. If the signal is destroyed, the efficacy of the political system drops.

  **The "Under the Table" Mechanism:** The trade works ex ante (I get my tax cut, you get your environmental regulation), but the machinery destroys the *informational content* of the actions traded. It's like trading currency that has been counterfeited perfectly; the transaction clears, but the economy collapses because trust in the token is gone. A sympathetic defender must concede that MT cannot apply to actions whose primary value is signaling integrity.

  ### 3. The Hidden Numeraire (Structural)
  **The Argument:** You asked about the clearing house exchange rates. For a clearing house to set a rate (e.g., 5 units of animal welfare = 1 unit of immigration policy), there must be a common numeraire (a unit of account).

  **Why it moves a defender:** Utilitarians have a numeraire (utils/wellbeing). Deontologists, virtue ethicists, or lexical prioritizers often do not. If I believe rights are side-constraints, I cannot trade a violation of a right for a benefit elsewhere, because the "cost" is infinite or non-comparable.
  For the clearing house to function, it must *impose* a comparability framework. It must say, "For the purpose of this trade, we are treating your deontological constraint as a utilitarian cost." This means the clearing house is not a neutral facilitator; it is an **implicit moral hegemon.** It forces all participants to act *as if* they are consequentialists to make the math work.

  **The "Under the Table" Mechanism:** The machinery assumes interpersonal comparability of moral value. If this doesn't hold (and many argue it doesn't), the exchange rates are arbitrary. If they are arbitrary, the "gains from trade" are illusory. One side is inevitably being systematically exploited by the exchange rate, even if they consent, because they lack the metric to judge the fairness.

  ### 4. The Insulation Charge (Meta-Ethical)
  **The Argument:** You asked if the view is insulated into unfalsifiability. The standard caveats are: *no coercion, informed consent, no rights violations, positive sum ex ante.*

  **Why it moves a defender:** If you enforce "no rights violations" strictly, you rule out most controversial trades (e.g., I concede on abortion access, you concede on capital punishment). If you enforce "informed consent" strictly, you rule out trades where one side is factually mistaken (see Epistemic Hazard). If you enforce "positive sum" strictly according to *objective* value rather than *subjective* expectation, you rule out trades where both sides are wrong.
  If the theory only endorses trades that are already permissible and beneficial under standard moral frameworks, **MT adds no normative guidance.** It becomes a description of cooperation, not a prescription.
  However, if MT *does* endorse trades that standard frameworks forbid (e.g., trading with a "monstrous" view), it likely violates the caveats (e.g., by legitimizing rights violations).

  **The Verdict:** The theory is either vacuous (it only recommends trades we should already do) or dangerous (it recommends trades that violate the caveats required to make them safe). A defender must admit that the "pro tanto duty" evaporates once the caveats are rigorously applied to hard cases.

  ### 5. The Erosion Objection (Preference Endogeneity)
  **The Argument:** You asked if the "corrosion of norms" is a genuine defeater. Framed as "sacred values," it is easy to dismiss. Framed as **preference endogeneity**, it is fatal.
  Markets do not just satisfy preferences; they shape them. (See: Bowles & Gintis, Sandel). If we institutionalize moral trade, we train ourselves to view moral commitments as assets.

  **Why it moves a defender:** This is a consequentialist argument. If the practice of MT makes agents more willing to compromise on core principles in the future, it lowers the "transaction cost" of moral betrayal. Over time, the population becomes more mercenary.
  The cost of this erosion is not priced into the individual trade. I trade my vote for a tax cut. I benefit. You benefit. But the *social norm* that "votes are not for sale" degrades. This is a negative externality. Because the clearing house is anonymous/indirect, no individual trader internalizes the cost of the norm erosion.

  **Is it absorbable?** A clever defender says, "We just factor the erosion cost into the calculus."
  **The Rebuttal:** You cannot factor it in because the erosion *changes the calculus itself*. It changes the agents' utility functions. If the utility function is unstable, expected value maximization is impossible. The machinery assumes stable preferences; the operation of the machinery destabilizes them.

  ### 6. Predictions vs. Rivals
  You asked what MT predicts that rivals don't.

  *   **The Integrity Rival:** Says moral agents should act to maximize the truth of their moral beliefs, not the satisfaction of their preferences.
      *   *Prediction:* High polarization, high clarity, lower short-term compromise, but more stable long-term norms.
      *   *MT Prediction:* Convergence of outcomes, divergence of justifications, lower polarization, but "hollowed out" mandates.
  *   **The Test:** Look at legislative bodies. MT predicts that vote-trading (logrolling) leads to better aggregate welfare. Political science suggests logrolling leads to **pork-barrel spending and budget bloat** (concentrated benefits, diffuse costs). MT predicts efficiency; reality predicts inefficiency via coalition building.
      *   *Why this matters:* It suggests MT systematically underestimates the transaction costs of coalition maintenance and the agency costs of representatives trading away principles they were elected to uphold.

  ### Honest Verdict

  You asked for a verdict on whether the view has been insulated into unfalsifiability.

  **Yes, largely.**
  The "pro tanto duty" to engage in moral trade holds only in a vacuum where:
  1.  Values are commensurable (Utilitarian meta-ethic).
  2.  Preferences are stable (No erosion).
  3.  Information is symmetric (No epistemic hazard).
  4.  Actions are purely causal (No signaling value).

  In the real world, these conditions rarely hold simultaneously. When they don't, the caveats required to make the trade safe (don't trade with liars, don't trade rights, don't trade signals) swallow the recommendation.

  **The "Feature or Bug" on Insulation:**
  It is a problem for a view of this kind. If a normative theory tells you to "maximize trade" but then adds "unless the trade is bad," it has collapsed into "do good things." The specific mechanism of *trade* ceases to be the moral engine; the moral engine remains the underlying axiology (utilitarianism, etc.). MT claims to be a *method* for moral progress under disagreement. If the method only works when the disagreement is shallow enough to be tradable without epistemic or normative cost, it cannot solve the deep disagreements it was designed to address.

  **The Strongest Defeater for You:**
  Given your criteria ("the trade works exactly as advertised and the world still comes out worse"), the **Epistemic Hazard** combined with **Signaling Collapse** is your killer.
  Imagine a clearing house successfully matches a pro-choice advocate with a pro-life advocate. They trade: the pro-choice advocate concedes on funding restrictions; the pro-life advocate concedes on access.
  *   **Trade Works:** Both get some of what they want. Tension lowers.
  *   **World Worse:** The fundamental question (is the fetus a person?) is never resolved. The political system receives muddy signals about the public's actual moral stance. The compromise stabilizes a policy that neither side thinks is *right*, only *acceptable*. Moral progress (resolving the truth) is stalled in favor of moral peace (managing the conflict).
  If you believe morality is about *getting it right*, not just *getting along*, MT is a mechanism for stagnation. It monetizes the status quo.

  **Conclusion:**
  You haven't lost it; you've followed the logic of consequentialism to its natural cooperative equilibrium. But that equilibrium assumes a static moral landscape. In a dynamic landscape where beliefs can be corrected and norms shape preferences, the "market" for morality has externalities it cannot price. The duty to trade is real *only* when the trade does not undermine the conditions that make moral truth-seeking possible. Once you add that caveat, the "duty" is far weaker than the initial intuition suggests.
