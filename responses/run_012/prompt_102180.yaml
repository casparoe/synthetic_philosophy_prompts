  3.  **Address the Specific Diagnostic Questions:**

      *   **Verbal vs. Substantive vs. Category Error:** It's a mix. It's verbal because they define "democracy" differently. It's substantive because they value different outcomes (stability/rights vs. responsiveness/mandate). It's a category error because they are measuring different things (institutional resilience vs. popular sovereignty).
      *   **Hidden Empirical/Formal Question:** Does the concept predict regime collapse? The Skeptic argues it doesn't add predictive value beyond "incumbent advantage." The Erosion argues it predicts long-term authoritarian drift.
