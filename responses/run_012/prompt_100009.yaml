answer: |-
  You have essentially rediscovered **Prospect Theory**, specifically the later refinement known as **Cumulative Prospect Theory (CPT)**. It was developed by Daniel Kahneman and Amos Tversky (for which Kahneman won the Nobel) to describe exactly the behavior you are listing.

  Your hunch is remarkably close, but to make it a "single precise rule," we need to tighten the mechanics. You aren't just "bending probabilities." You are running two distinct mental calculations that interact: a **Value Function** and a **Weighting Function**.

  Here is the precise rule that fits your data.

  ### The Principle: Cumulative Prospect Theory

  **1. The Value Function (How you feel about the money)**
  *   **Gains:** You are risk-averse. The difference between \$0 and \$1,000 feels bigger than the difference between \$10,000 and \$11,000. (Concave).
  *   **Losses:** You are risk-seeking. The pain of losing \$1,000 is less than twice the pain of losing \$500. You will gamble to avoid a sure loss. (Convex).
  *   **Loss Aversion:** Losses hurt roughly 2 to 2.5 times more than equivalent gains feel good. A \$100 loss cancels out a \$250 gain.

  **2. The Weighting Function (How you feel about the odds)**
  *   **The Certainty Effect:** Probability 100% is a psychological discontinuity. Dropping from 100% to 99% feels catastrophic. Dropping from 80% to 79% feels negligible.
  *   **The Possibility Effect:** Small probabilities (1% to 5%) are overweighted. A 1% chance feels like 5%.
  *   **The Shape:** It is an "Inverse-S" curve. You overweight the tails (very low and very high probabilities) and underweight the middle.

  ---

  ### How This Explains Your Verdicts (1–6)

  *   **1 & 2 (The Allais Paradox):** In #1, you drop from 100% to 89% certainty. The Certainty Effect screams "No." In #2, both are risky (11% vs 10%), so the certainty spike doesn't trigger. You just see the higher payout (\$5M) and the probabilities feel similar enough that the money dominates. **Verdict: Consistent.**
  *   **3 (Certainty Premium):** You are paying \$500 in Expected Value to stay at 100%. This is the Certainty Effect in its purest form. You are buying the elimination of the "regret" of getting nothing. **Verdict: Consistent.**
  *   **4 (The Lottery Ticket):** Here, the Possibility Effect takes over. You overweight the 1% chance of \$10k. It *feels* like a 5% chance. Meanwhile, the sure \$100 feels trivial due to diminishing sensitivity (Value Function). **Verdict: Consistent.**
  *   **5 (The Reflection Effect):** This is pure Loss Aversion + Convex Value. A sure loss is psychologically agonizing. You convexify the loss curve, making the gamble (50/50) feel less painful than the sure thing, even if the EV is worse. **Verdict: Consistent.**
  *   **6 (Zero Aversion):** This is the most subtle one. K has a 50% chance of **Zero**. L has a 25% chance of **Zero**. In CPT, the outcome "0" is often treated as a reference point anchor. Reducing the probability of "getting nothing" is highly valued, independent of the middle \$100. **Verdict: Consistent.**

  ### The Straight Talk: Where Your Introspection Fails

  You asked me to be straight about which verdicts the principle might throw out. The math holds up on all six choices, but your **reasoning on #6 is internally contradictory.**

  You wrote: *"I take L, but only barely — I feel like the middle outcome is doing almost no work for me."*

  If the middle outcome (\$100) were doing no work, you would be indifferent between K and L. The fact that you choose L means the middle outcome *is* doing work. But it's not doing work because it's \$100. It's doing work because it **displaces the probability of Zero.**

  Your principle isn't just "ends weighted more." It's **"The probability of getting nothing is weighted disproportionately heavily."** In Gamble K, you face a 50% chance of nullity. In Gamble L, you cut that nullity risk in half. Your choice proves you care deeply about avoiding zero, even if your gut says you don't.

  ### The Prediction for Gamble 7

  **The Setup:**
  *   **M:** 95% \$5k, 4% \$500, 1% -\$20k. (EV = \$4,570)
  *   **N:** 100% \$4k. (EV = \$4,000)

  **The Prediction:**
  Based on the rule derived from 1–6, you should choose **N (The Guaranteed \$4,000).**

  **Why?**
  1.  **Loss Aversion:** Gamble M is a *mixed prospect* (mostly gains, but a potential loss). In mixed prospects, Loss Aversion dominates. That 1% chance of losing \$20,000 is not weighted as 1%. Due to the Possibility Effect, it feels like 3-4%. Due to Loss Aversion, the pain of -\$20k is felt as roughly -\$50k. That tail risk creates a massive psychological drag.
  2.  **The Certainty Effect:** You have established in #1 and #3 that you pay a significant premium to move from "high probability" to "certainty." Moving from M (95% gain) to N (100% gain) triggers that certainty spike.
