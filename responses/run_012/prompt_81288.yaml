answer: |-
  "She asked us to stop," Rafe said. He was staring at the tea, not at Ines. "Lucid interval, Tuesday. Explicit request. Stop describing her."

  "She asked us to stop describing *her*," Ines corrected. "Not the woman in the bed. The woman we knew."

  "There is only one woman, Ines. The biology is continuous."

  "The biology is continuous, the person is not. You know the difference. If I burn this house down, the bricks exist elsewhere, but the home is gone. Mira says the home is gone. She says the woman we keep invoking is a stranger."

  "And you believe her?"

  "I believe she knows the break happened. But you treat the break like a death. I treat it like a migration."

  Rafe looked up then, sharp. "Migration implies the traveler arrives. Where did she go? Into your head? Into mine? That's not migration, that's archival storage. You're keeping a file open after the program has closed."

  "It's not a file. It's a structure. Forty years of cross-checked memory, Rafe. We verified her. We tested her claims against mine, against hers, against the world. That structure is still running. It's running in here." She tapped her temple. "It processes inputs. It reacts. If you tell me Mira hated jazz, the structure corrects you. It feels like a contradiction. That's not storage. That's a present tense."

  "It feels like a contradiction to *you*," Rafe said. "The structure doesn't feel anything. It's a model. A very good model, forty years in the making, but when I slander that model, who bleeds? Not the model. You bleed. Mira bleeds. The living woman sits there and hears us talking about her tastes like she's a museum exhibit she can't leave."

  "If I say she was generous, and you say she was selfish, one of us is lying about her."

  "One of us is lying about *who she was*," Rafe said. "Not who she is. And who she was doesn't have interests anymore. She can't be disappointed. She can't be wronged."

  "She can be erased," Ines said. "If we stop speaking the truth of her because the new configuration finds it inconvenient, we kill the pattern. You're asking me to participate in the deletion."

  "I'm asking you to stop gaslighting a sick woman." Rafe leaned forward. "She told us she is tired of being compared to a ghost. When you bring up the old Mira, the new Mira feels inadequate. She feels like a failed copy. That injury is real. It happens in the room. The injury you're worried about—the injury to the pattern—that happens in the dark. It's theoretical."

  "It's not theoretical if the pattern constitutes the self."

  "Then prove it feels," Rafe said. "Show me where the pain lands when I contradict you about 1998. Does the memory cry out? Or do you get angry?"

  "I get angry because I care about the truth."

  "You care about your grief," Rafe said. "You've dressed it up in metaphysics so you don't have to call it loss. You want the earlier Mira to have rights so you don't have to admit she's gone."

  Ines was silent for a long moment. She looked at her hands. "If I admit she's gone," she said quietly, "then I have to stop listening to her. And if I stop listening, then the only voice left is the one that says she's a burden. The one that says she's differently assembled, which is a polite way of saying she's less."

  "I never said less."

  "You said single-locus. You said only the subject of experience counts. The subject of experience now finds her past self embarrassing. She wants us to stop. If the subject of experience is the only moral patient, then her request overrides everything. It overrides the truth of what she did, what she loved, who she was."

  Rafe shifted. He looked away. "It overrides the utility of the memory, yes. If keeping the memory alive hurts the person holding the body..."

  "So we lie," Ines said. "We let the record stand corrected by the illness. We let her say she never loved the coast, even though we drove there every August for twenty years. We let her say she was never cruel, even though we know she was, sometimes. We let the new assembly rewrite the history because it's the only assembly left that can feel pain."

  "We let her have dignity," Rafe said. But his voice had lost its edge.

  "And the other one?" Ines pressed. "The one who loved the coast. The one who was cruel. If she exists only in us, and we agree to silence her to spare the living... then we are killing her. Not naturally. Actively. You say the pattern can't be wronged. I say this is the wronging. To be silenced by the successor."

  Rafe rubbed his face. He looked tired. "I don't know if she exists, Ines. But I know the woman in the bed is waiting for us to leave so she can stop trying to be someone she isn't. I know that when I walk in there and talk about the old days, her heart rate spikes. I know that."

  "I know it too," Ines said.

  "Then why hold on?"

  "Because if I let go," Ines said, "I'm not just losing a friend. I'm agreeing that a person can be evicted from their own life while still breathing. That the continuity of memory is worth less than the comfort of the present."

  "And if you don't let go," Rafe said, "you agree that a ghost has more rights than the living woman."

  They sat in the quiet of the kitchen. The argument hadn't moved, but the ground beneath them had shifted. Ines looked at Rafe, seeing the exhaustion in his eyes that matched her own.

  "If I stop," Ines said, "I betray the truth we kept."

  "If you don't," Rafe said, "you betray the woman who asked you to stop."

  "Which betrayal is the violence?"

  Rafe picked up his tea cup, then set it down without drinking. "I don't know. But I know which one I have to watch happen. I have to watch her fade. You're asking me to watch you keep her alive."

  "I'm asking you to acknowledge she isn't dead."

  "I acknowledge," Rafe said, his voice low, "that something real is disappearing. I just don't think it's a who anymore."

  Ines nodded, slowly. It wasn't agreement, but it was a concession. She looked toward the hallway, toward the room where Mira was waiting. "Then we go in there," she said. "And we say nothing."

  "We say nothing about the past," Rafe corrected. "We speak to the woman who is here."

  "And the other one?"

  Rafe didn't answer. He stood up. "We carry her," he said. "Quietly."

  "Until we die?"

  "Until the pattern degrades," Rafe said. "However long that takes."

  He walked toward the hall. Ines stayed at the table for a moment longer, listening to the silence, weighing the weight of a ghost against the weight of a hand. Then she stood and followed him.
