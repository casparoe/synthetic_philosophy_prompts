  ### How It Differs From Its Neighbors

  You asked for sharp distinctions. Here is how you separate **The Consequentialist Horizon** from the three things people will mistakenly conflate it with:

  **1. It is not the Butterfly Effect.**
  *   **Butterfly Effect:** Claims that small inputs lead to *disproportionately large* outputs due to chaotic systems.
  *   **Your Problem:** Claims that *all* inputs lead to *infinite* outputs, and we have no principled way to sum them.
  *   **The Test:** If the economist said, "Saving these children might accidentally cause a war in 50 years," that's Butterfly. If they say, "Saving these children changes the population structure, which changes growth, which changes value, and we can't sum that series," that's the Horizon. One is about sensitivity; the other is about accounting boundaries.

  **2. It is not the Non-Identity Problem.**
  *   **Non-Identity (Parfit):** Focuses on *who* exists. (e.g., "If we pass this policy, a different set of people will be born, so we can't say we harmed the specific people who exist later.")
  *   **Your Problem:** Focuses on *net value*. (e.g., "Whether the same people exist or not, the total utility might be negative.")
  *   **The Test:** The Non-Identity Problem is about rights and harm to specific individuals. The Horizon Problem is about the aggregation of good and bad outcomes. They often travel together (population ethics), but they are distinct logical bugs.

  **3. It is not Moral Luck.**
  *   **Moral Luck (Nagel/Williams):** Focuses on how factors outside our control affect our *blame or praise*. (e.g., "Two drunk drivers drive home; one hits a kid, one doesn't. We judge them differently.")
  *   **Your Problem:** Focuses on the *knowability of the outcome itself*.
  *   **The Test:** Moral Luck accepts the outcome happened and asks how to judge the agent. The Horizon Problem asks whether the outcome is even *calculable* enough to judge the action.

