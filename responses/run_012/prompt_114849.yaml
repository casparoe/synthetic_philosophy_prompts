answer: |-
  You are right to be annoyed by the "butterfly effect" answer. That is a category error. The butterfly effect is about *ontological sensitivity* (small causes have big, unpredictable effects). Your problem is about *normative accounting* (where do we stop counting value, and why is that line arbitrary?).

  There is no single, universally recognized noun for this (like "Cognitive Dissonance" or "Prisoner's Dilemma"), but there is a precise cluster of terms in moral philosophy and policy analysis that describes exactly what you are seeing.

  ### The Existing Names

  If you want to sound like you know the literature, there are two labels depending on which side of the standoff you emphasize:

  **1. The Cluelessness Objection (Epistemic)**
  This is the dominant term in the effective altruism and consequentialist ethics literature (popularized by philosopher Hilary Greaves). It refers specifically to the claim that for many actions, the long-term consequences are so uncertain that we cannot assign them an expected value.
  *   **Why it fits:** It captures the economist's move ("nobody can know which").
  *   **Why it might feel incomplete:** It focuses on *ignorance*. Your observation is sharper: it's that the *method of calculation* breaks down because the boundary is arbitrary, not just that we lack data.

  **2. The Truncation Problem (Structural)**
  In cost-benefit analysis and policy ethics, this is the technical name for the necessity of stopping the calculation at some point. Every model must "truncate" the future.
  *   **Why it fits:** It captures your insight that "there's no non-arbitrary place to stop."
  *   **The Standoff:** The charity is engaging in **proximate truncation** (stop at lives saved). The economist is demanding **total truncation** (stop at the end of time). Because the net value flips depending on the truncation point, the evaluation becomes unstable.

  ### The Coinage (For Your Piece)

  Since "Cluelessness" is niche jargon and "Truncation" sounds like forestry, if you want a term that works for a general audience and captures the *standoff* specifically, I propose you call it:

  **The Consequentialist Horizon**

  You can define it tightly in your piece like this:
