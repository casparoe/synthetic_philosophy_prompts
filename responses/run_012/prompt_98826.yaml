      *   **Conclusion:** A summary position for the group.

  5.  **Refining the Philosophy:**
      *   Need to be careful not to just say "Biopics lie." The user knows that. The issue is the *consequence* of the lie.
      *   Use the concept of **Testimonial Injustice** (Miranda Fricker-ish, though maybe don't name-drop unless it fits naturally). The film deprives Salieri of credibility.
      *   Focus on the **Contract with the Audience**. The film opens with text: "This is based on the play..." but the *tone* says "This is History."
