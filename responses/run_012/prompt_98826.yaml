      *   **Core Question:** What do we owe the real dead when we dramatize them? Is "name larceny" (the friend's term) a valid concept? Is replacing someone in public memory a distinct/worse wrong than just inventing events? Who is wronged?
      *   **Specific Angles to Cover:**
          *   Distinguish between *fictionalizing events* vs. *usurping memory*.
          *   Analyze the film's framing device (asylum, confession, unreliable narrator). Does it excuse or implicate the film further?
          *   Address the aesthetic argument (is a beautiful lie worse?).
          *   Address the character's nature (does Salieri's snobbery matter?).
          *   Address the scope (is it one sin or several regarding Mozart, Constanze, etc.?).
          *   Identify specific scenes as evidence, including moments where the film "knows it's lying."
      *   **Constraint:** Argue a position, don't just point to essays. Provide a structured philosophical framework for the discussion.

  2.  **Deconstruct the Ethical Problem (The "Wrong"):**
      *   *Can the dead be wronged?* Yes, posthumous harm is a recognized philosophical concept (reputation, legacy, wishes).
      *   *Who else is wronged?* The living (students, descendants, history buffs, the art form itself).
      *   *Distinction 1: Dramatization vs. Erasure.* Putting a real person in fake scenes is standard biopic fare. Overwriting their public identity so the real person becomes invisible is different. Let's call the friend's "name larceny" two things: *Narrative Trespass* (using the name for plot) and *Memorial Dispossession* (stealing their place in history).
      *   *The "Amadeus" Specifics:* The film claims to be "Salieri's confession." It explicitly frames itself as a subjective memory. Does this absolve it? No, because the *marketing* and *reception* treated it as truth. The frame is a shield the audience ignores.

  3.  **Develop the Argument/Position:**
      *   *Thesis:* *Amadeus* commits a specific ethical violation not merely by lying, but by weaponizing beauty to make the lie stickier than the truth. It creates a "Memorial Dispossession." The framing device doesn't save it; it implicates the audience in the act of believing a beautiful monster over a dull saint.
      *   *Key Concept:* **Aesthetic Seduction as Epistemic Violence.** The beauty of the film makes the falsehood resistant to correction.
      *   *Key Distinction:* **Fictionalizing vs. Effacing.**
          *   *Fictionalizing:* Putting Salieri in a room with Mozart they never shared. (Acceptable artistic license).
          *   *Effacing:* Defining Salieri's *character* by a crime he didn't commit, thereby erasing his actual contributions (teaching Beethoven/Schubert). (Unacceptable).

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's unease. Validate that this is a profound philosophical problem, not just pedantry.
      *   **Carving the Wrong (Name Larceny):** Break the friend's term down.
          *   *Act 1: Narrative Trespass.* Using the name for stakes. (Less harmful).
          *   *Act 2: Memorial Dispossession.* Overwriting the historical record. (More harmful).
          *   *Who is wronged?* The Dead (legacy), The Living (knowledge), The Art (music history).
      *   **The Framing Device (The Confession):**
          *   Does it help? It says "This is my memory."
          *   Does it hurt? Yes, because it creates *verisimilitude*. It feels like a truth being told. The final scene ("All the mediocre of the world... I absolve you") is the smoking gun. It asks us to forgive the *fictional* Salieri, which bleeds into forgiving the *historical* slander.
      *   **The Aesthetic Argument:**
          *   "A lovely lie is just a lie with better retention." Use this. The music makes the poison palatable.
      *   **The Scope of the Sin:**
          *   It's not just Salieri. It's Mozart (infantilized), Constanze (vulgarized). It's a systemic rewriting of an era to serve a theme (Mediocrity vs. Genius).
      *   **Specific Scenes:**
