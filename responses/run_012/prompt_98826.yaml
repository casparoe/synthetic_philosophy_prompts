  8.  *(Self-Correction during drafting)*: I initially thought about mentioning the play vs. the film. The user is focused on the film. Keep the focus on Forman's direction and the cinematic language. The text crawl at the start is important evidence—it admits fiction, but the movie overrides it.
      *   *Refinement on the "Wrong":* It's not just about Salieri's feelings (he's dead). It's about the *ecology of truth*. When a lie becomes the dominant narrative, it distorts our understanding of human excellence. If Salieri is a villain, we misunderstand what "competence" looks like in art.

