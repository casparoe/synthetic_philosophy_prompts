      *   **The "Hidden Theorem":** How to imply unprovable truths? Perhaps by pointing to things we know but cannot show, or by leaving something unsaid that is felt. Or acknowledging the limits of what we can demonstrate at this dinner.
      *   **Acknowledging the Difference:** Admit I'm still classical.
      *   **Closing:** A wish that is constructively valid. Not "forever," but "now."

