      *   **Audience:** 40 people. 50% family (non-mathematicians), 50% colleagues (some will know the logic jokes).
      *   **Constraint 1 (The Core Challenge):** Every sentence in the toast must be constructively valid. No "There exists..." without exhibiting. No "Everyone..." unless verifiable. No "She is the best..." (comparatives over infinite sets). No "You will be missed" (future prediction without evidence). No "Nobody else could have..." (universal negative). No LEM reliance ("Either X or not X").
      *   **Constraint 2 (Content):** Warm, funny (a couple of real laughs), 600-700 words. Honest about the speaker's classical stance ( hasn't converted). No logic lecture feel. Specific anecdotes/observations preferred over airy praise.
      *   **Constraint 3 (The Hidden Theorem):** The speaker believes there are true theorems nobody will ever prove. The honoree would say that's meaningless. The toast must *hold* that without asserting it directly (show, don't tell).
      *   **Constraint 4 (Ending):** Do NOT end with "Here's to the next forty years" (she's retiring/aging).

  2.  **Deconstruct Constructivist Constraints for Language:**
