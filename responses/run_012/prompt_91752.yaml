      *   *Use:* "I have seen her teach better than anyone else I have watched." (Finite set of observations).
      *   *Avoid:* "Everyone loves her." (Universal quantifier over infinite/undefined set).
      *   *Use:* "Many people here love her." (Exhibitable).
      *   *Avoid:* "Her work will last forever." (Infinity).
      *   *Use:* "Her work remains on the shelf." (Present state).
      *   *Avoid:* "You will be missed." (Future tense prediction).
      *   *Use:* "I feel her absence already." (Present feeling).
      *   *Avoid:* "Nobody knows X." (Universal negative).
      *   *Use:* "I do not know X." (Personal state).
      *   *Avoid:* "Either she is tired or she is not." (LEM).
      *   *Use:* "She looks tired." (Observation).
      *   *Avoid:* "There exists a solution." (Without showing it).
      *   *Use:* "Here is a solution." (Exhibiting).

  3.  **Drafting - Section by Section:**

