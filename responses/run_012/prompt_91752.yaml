answer: |-
  Good evening. I stand here as a colleague of thirty years. I also stand here as a classical mathematician. I still claim every sentence is true or false. She does not. She requires evidence before she accepts existence. I have not converted. I respect her constraint.

  Thirty years ago, we started in this department together. I asked her once if there was a shortcut to the library. She said, "Show me the path." We walked. She measured the steps. I estimated. She was right. I have seen her apply this rule at dinner. I asked, "Is there milk?" She said, "Open the fridge." I opened the fridge. I saw no milk. I did not say, "There is no milk." I said, "I do not see milk." She smiled. She bought milk the next day. She constructs her world. I inhabit it.

  I have watched her teach. I have watched others teach. I place her at the top of my list. I have not seen another do what she does. She hands students proofs. She does not tell them proofs exist. She gives them the object. I hold her notes. They remain clear. I read them today. They make sense. Her work sits on the shelf. I touch the spines. They are solid.

  I know six people in this room check my clauses. I know twenty people here are her family. You know her rigor. You know she counts only what she holds. I cannot say she is the best. I cannot compare her to every teacher who ever lived. I can say I learned from her. I can say I use her methods. I can say my work stands on her foundations.

  I haven't decided if she was the finest teacher in this building or the finest researcher. I observe both. I lack a metric to separate them. I observe the result. Students arrive. Students leave. They carry knowledge. I see them use it.

  There are things I know. I cannot write them down. I feel a weight in this room. I cannot measure it. I cannot exhibit a formula for this affection. I hold this truth. I cannot prove it to her satisfaction. I assert it anyway. I feel sadness. I feel gratitude. These states exist now.

  She leaves the department next week. I feel a gap where she sits. I do not know what this department will feel in March. I know what I feel today. I see her chair. It is empty. I remember thirty years of conversations. I remember the dinners. I remember the milk.

  I thank her for the proofs she handed me. I thank her for the errors she corrected. I thank her for the path she walked. I walk behind her. I see the footsteps. They are clear.

  Please raise your glasses. I hold this glass. You hold yours. We look at her. We see her here. We acknowledge this moment. We honor the work we can touch. We honor the friend we can see.

  To the present. To the evidence. To her.
