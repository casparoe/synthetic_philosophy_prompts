answer: |-
  **The Irreducibility of Power: A Defense of Sui Generis Dispositions**

  The metaphysics of dispositions seeks to locate the modal force of properties like fragility, solubility, and flammability within a categorical world. The dominant tradition attempts to analyze these dispositions via counterfactual conditionals: to possess a disposition is simply to stand in a certain relationship to possible events. This essay assesses the Simple Conditional Analysis (SCA), evaluates its standard repairs against specific test cases, and argues that both conditional and causal-base reductions fail. The verdict reached is that dispositions constitute a *sui generis* ontological category. While this position sacrifices reductive clarity, it preserves the determinacy and explanatory utility of dispositional talk where reductionist accounts succumb to circularity or vacuity.

  **The Simple Conditional Analysis and Standard Counterexamples**

  The Simple Conditional Analysis (SCA) posits that an object $x$ is disposed to manifest $M$ upon stimulus $S$ if and only if, were $S$ to occur, $M$ would occur. Formally: $D(x) \iff (S(x) \square\rightarrow M(x))$. A glass is fragile just in case, if it were struck, it would break.

  SCA fails due to the divergence between the truth conditions of the counterfactual and the possession of the disposition. In *Finkish* cases, a mechanism removes the disposition upon the arrival of the stimulus. If a wizard makes a glass non-fragile the moment it is struck, the counterfactual "if struck, it would break" is false, yet the glass was fragile prior to the strike. In *Masking* cases, the disposition remains but is blocked. A fragile glass packed in foam will not break if struck; the counterfactual is false, but the fragility remains. In *Mimicking* cases, the disposition is absent but the manifestation occurs. A non-fragile glass protected by a wizard who breaks it anyway upon a strike satisfies the counterfactual, yet lacks the disposition.

  These failures motivate two repairs: qualifying the conditional or appealing to an intrinsic causal basis.

  **The Qualified Conditional Analysis and the Inert Explosive**

  The first repair modifies SCA to a Qualified Conditional Analysis (QCA): $x$ is disposed to $M$ if $S$ iff $M$ would occur if $S$ occurred *and no interfering factors were present* (or under *normal conditions*). This attempts to handle masking and finkish cases by excluding the wizard or the foam as "interferers."

  However, QCA faces the charge of vacuity. To avoid circularity, "interference" must be defined independently of the disposition. If an interferer is simply "anything that prevents $M$," the analysis becomes tautological: the glass is fragile if it would break unless something prevents it from breaking.

  Test Case (A), *The Inert Explosive*, sharpens this problem. A powder detonates only if mixed with a specific catalyst; otherwise, it is inert. Under SCA, the powder is not disposed to detonate (since mixing alone yields no explosion). The QCA proponent might argue the missing catalyst is a missing "enabling condition," not an interference. But this requires expanding the analysis to: $M$ would occur if $S$ and *all enabling conditions* were present.

  Here, the analysis threatens to become true by construction. One might reply that the powder *is* disposed to detonate, provided we refine the stimulus $S$ to "mixing with the catalyst." If we permit arbitrarily complex stimuli, any object can be said to be disposed to any manifestation, provided we pack the sufficient conditions into the antecedent. If I say a stone is "disposed to fly" when "thrown by a giant," the conditional holds, but this tells us nothing about the stone's intrinsic nature. If the analysis allows $S$ to be complexified until $M$ is guaranteed, QCA loses its explanatory power. It no longer analyzes the disposition of the object; it merely describes a sufficient causal scenario. Thus, QCA either remains false (by excluding necessary enablers from $S$) or becomes vacuous (by including them).

  **The Causal Basis Account and the Self-Annulling Solvent**

  The second repair abandons conditionals for the Causal Basis Account (CBA): $x$ is disposed to $M$ under $S$ iff $x$ has an intrinsic property $P$ such that $P$, together with $S$, causally brings about $M$. This handles Finkish cases well: the glass has the categorical basis (molecular structure) for fragility even if the wizard removes it upon striking.

  However, CBA faces a circularity objection regarding the identification of $P$. How do we identify $P$ as the basis for solubility? Usually, by reference to its role in producing dissolving.

  Test Case (B), *The Self-Annulling Solvent*, exposes this vulnerability. A substance possesses molecular structure $P$, which in standard contexts causes solubility. However, in this specific substance, contact with water causes $P$ to immediately rearrange into an inert structure, preventing dissolution. No external interferer exists; the potential basis destroys itself.

  We face a dilemma. First, read at the level of *property types*: $P$ is the type of structure that typically grounds solubility. CBA implies the substance *is* soluble. This contradicts the fundamental intuition of dispositions: a soluble substance must be capable of dissolving. If it never dissolves and cannot dissolve due to its own internal dynamics, calling it soluble is misleading.

  Second, read at the level of *causal efficacy*: $P$ is the basis only if it actually produces $M$. Here, $P$ fails to produce $M$. Thus, the substance lacks the basis and is not soluble. But on this reading, how do we identify the basis? We identify $P$ as the basis *because* it causes dissolving. If it doesn't cause dissolving, it isn't the basis. This collapses CBA back into a conditional analysis: $x$ has the disposition iff it has a property that causes the manifestation. But "causes the manifestation" is functionally equivalent to "would manifest if stimulated." The appeal to an intrinsic basis dissolves into a claim about causal outcomes, reintroducing the vulnerability to finkish and masking scenarios (for the basis itself could be masked).

  **Verdict: Dispositions as Sui Generis**

  The failures of QCA and CBA suggest that dispositions cannot be reduced to non-dispositional terms. QCA fails because specifying "normal conditions" or "complex stimuli" without circularity is impossible; the conditions are normal *relative to the disposition*. CBA fails because identifying the "causal basis" without reference to the disposition's manifestation is impossible; the basis is the basis *of the disposition*.

  Therefore, the correct verdict is that dispositional predicates name a *sui generis* ontological category. Dispositions are real, irreducible properties. They are not shorthand for conditionals, nor are they merely the categorical bases that underwrite them. They are powers. On this view, the Inert Explosive (A) possesses a specific power to detonate *relative to the catalyst*. This is not a vacuous conditional trick but a statement of a real, relational power inherent in the powder's chemistry. The Self-Annulling Solvent (B) lacks the power of solubility. Although it shares a structural type with soluble substances, the causal power associated with that type is absent or broken in this context. The property $P$ exists, but the *disposition* does not, because the disposition is the causal power itself, not the structure that usually carries it.

  **The Strongest Objection: Obscurantism**

  The strongest objection to this primitivist verdict is that it is obscurantist. Science progresses by reducing higher-level properties to lower-level categorical bases. Chemistry explains flammability via molecular bonding; physics explains mass via interaction with the Higgs field. To claim dispositions are *sui generis* seems to halt scientific inquiry, positing a "hidden power" where science seeks a structural mechanism. It risks making dispositions epistemically inaccessible: if they aren't conditionals or structures, how do we detect them?

  This objection conflates metaphysical reduction with scientific explanation. To say dispositions are irreducible is not to say they are unexplainable or unconnected to categorical bases. Science successfully identifies *which* categorical properties realize specific dispositions in specific worlds. The claim is that the *concept* of a disposition is not synonymous with the *concept* of its realizer. Mass is not identical to "resistance to acceleration" (conditional) nor merely "Higgs interaction" (basis); it is a property that *grounds* these truths. Acknowledging dispositions as primitive allows us to say that the Self-Annulling Solvent lacks solubility *despite* having structure $P$, because the realization relation is contingent. The structure $P$ does not metaphysically necessitate solubility; it only typically realizes it. Primitivism captures this contingency without forcing a circular definition. We detect dispositions through their manifestations (conditionals), but they are not *defined* by them.

  **What Is Lost**

  Accepting the *sui generis* verdict entails significant costs. First, we lose **reductive clarity**. We cannot translate dispositional language into the extensional language of conditionals or categorical properties. This complicates the project of naturalizing modality, as we must accept modal forces (powers) as fundamental features of reality rather than derivatives of laws or facts.

  Second, one might fear a loss of **determinacy**. If dispositions are not analyzed via truth-conditions, is it always determinate whether an object has a disposition? However, this fear is misplaced. On the primitivist view, determinacy is secured by the reality of the property itself, not our ability to analyze it. Just as it is determinate whether an object is red, even if "redness" resists reduction to wavelengths, it is determinate whether a powder is explosive, grounded in the objective existence of the power.

  However, what is genuinely lost is the **analytic link between possession and manifestation**. On the conditional analysis, to have a disposition *just is* to satisfy a conditional. On the primitivist view, the connection is synthetic. It becomes a substantive metaphysical question why dispositions manifest when stimulated. This opens the door to skepticism (could a power exist that never manifests?), but it is a price worth paying to avoid the circularity exposed by the Inert Explosive and the Self-Annulling Solvent.

  **Conclusion**

  The Simple Conditional Analysis fails to account for finkish, masking, and mimicking cases. Its qualified repairs succumb to vacuity when faced with enabling conditions, as seen in the Inert Explosive. The Causal Basis Account collapses into circularity or counterintuitive results when the basis fails to exercise its typical power, as seen in the Self-Annulling Solvent. The only coherent position is to treat dispositions as irreducible properties. While this forfeits the dream of a fully extensional ontology, it preserves the integrity of causal explanation, acknowledging that the world contains not just structures and events, but the powers that link them.
