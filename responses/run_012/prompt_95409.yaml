      *   **Critique:** Textualism can be too charitable (makes amendments redundant).
      *   **Core Distinction:** "Readable Constitution" (text in best light) vs. "Usable Constitution" (what an enslaved person could plead in court then).
      *   **Conclusion:** The oath is ambiguous because the author swore to the "readable" but lives under the legacy of the "usable."

  3.  **Address the Specific Questions (Drafting the Response):**

      *   **Question 1: Readable vs. Usable (Genuine distinction or just stated vs. enforced?)**
          *   *Thought:* It's more than just stated vs. enforced. "Stated vs. Enforced" implies corruption or failure of mechanism. "Readable vs. Usable" implies an inherent tension between *potential meaning* and *operational reality* within the legal system itself. It captures the hermeneutic gap.
          *   *Verdict:* It is a genuine and useful distinction. It highlights the difference between *interpretive possibility* and *juridical power*.
          *   *Nuance:* It resembles the distinction between "law in books" and "law in action" (Roscoe Pound), but adds a specific moral/agentic layer (who can use it?).

      *   **Question 2: Does the "Usable" standard prove too much?**
          *   *Thought:* If *nothing* could be used by an enslaved person, does that mean nothing was antislavery?
          *   *Counter-point:* Some clauses *were* used by free Black litigants (e.g., *Somerset* influence, though that's English; or freedom suits in Missouri). But generally, *Dred Scott* closed many doors.
          *   *Analysis:* The standard doesn't prove too much; it proves the *tragedy*. It highlights that rights without standing are theoretical. However, the author should acknowledge that "usable" varies by jurisdiction (free state vs. slave state).
          *   *Refinement:* The standard is strict by design. It exposes the hollowness of rights denied enforcement. It doesn't invalidate the text, but it invalidates the *promise* of the text at that time.

      *   **Question 3: Unfair to Douglass?**
