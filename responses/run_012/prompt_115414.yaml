      *   *Better:* If Carnap believed that the *choice of framework* could be settled by empirical success *alone* without prior volition. But he always insisted volition comes first.
      *   *Okay, the Falsifier:* If Carnap's private papers or correspondence show he believed the "Unity of Science" was not just a methodological proposal but an *ontological* claim that implies a specific social structure is the only rational one.

