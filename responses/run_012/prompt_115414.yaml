      *   *But:* Which constraints? If I constrain private property rights, the shadow prices look like market prices. If I constrain resource equality, they look different. The *constraints* are the political choice.
      *   *Emphasis:* Carnap would say the computational planners are committing a "category mistake" (or metaphysical error) by claiming their system is *True* rather than *Useful*.
      *   *Falsifier refinement:* I need something specific. Maybe his correspondence with Neurath? Or his stance on the "Unity of Science" movement. If he thought Unity of Science *entailed* Central Planning as a logical necessity, I'm wrong. If he thought it was just a tool for planners, I'm right. The latter is more supported.
