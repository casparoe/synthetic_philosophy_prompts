      *   **Health Economists:** They care about empirical outcomes, unintended consequences, and efficiency. A "win" for them is showing the model is theoretically sound but practically unstable (e.g., black markets, reduced altruism). They will attack the *incentive structures*.
      *   **Transplant Surgeon:** They care about patient safety, organ viability, and system integrity. A "win" for them is showing the scheme creates medical risk or administrative burden that outweighs the benefit of more organs. They will attack the *implementation/medical reality*.
