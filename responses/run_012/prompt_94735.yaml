answer: |-
  ### Audience Motivations & "Wins"

  Before the questions, you need to know what your opponents are trying to achieve. In a seminar like this, "winning" isn't about convincing you; it's about exposing a flaw in the room.

  *   **The Kantians:** They want to show that your distinction between "market" and "regulated scheme" is morally irrelevant. For them, the *act* of pricing is the corruption. A win for them is making you admit that money changes the meaning of the gift, regardless of who sets the price.
  *   **The Economists:** They aren't worried about dignity; they're worried about net supply. They want to show that your scheme reduces the total pool of organs by killing altruistic donation (the Titmuss effect). A win for them is proving your model is mathematically self-defeating.
  *   **The Surgeon:** They don't care about your moral theory. They care about graft survival rates and post-op complications. A win for them is showing that paid donors are medically riskier or harder to manage long-term, making the scheme clinically irresponsible.
  *   **You:** Your win is to survive without conceding that the *principle* is wrong. You don't need to prove it will work perfectly; you need to prove it is *permissible* and preferable to the status quo of people dying or selling on the black market.

  ***

  ### Q&A Prep Sheet

  **1. The "Intrinsic Dignity" Objection (The Hardline Kantian)**
  *   **The Question:** "You spend a lot of time distinguishing your scheme from a free market, but you haven't addressed the foundational worry. For many of us, the problem isn't *how* the price is set, but that a price is set at all. To put a tag on a body part is to treat the person as a container of spare parts rather than an end in themselves. Doesn't your fixed price still instrumentalize the donor, regardless of the state's involvement?"
  *   **The Reply:** "That's the 'intrinsic degradation' objection I flagged. My response is twofold. First, consistency: we already allow pricing of bodily risk and effort in hazardous labour, military service, and plasma donation. If those don't negate dignity, why does a kidney? Second, and more importantly, my scheme isn't about buying a *part*; it's about compensating for a *burden*. We compensate jurors for their time, not because their civic duty is for sale, but to ensure the burden doesn't fall only on the wealthy. I'm treating the donor as a citizen undertaking a burden, not a vendor selling a widget."
  *   **The Soft Spot:** **High.** You are bluffing on the consistency claim. Most people *do* feel a kidney is different from plasma or hazardous labour. If they press on the "sanctity of the intact body" vs. "labour," you don't have a knock-down argument, just an intuition clash.

  **2. The "Crowding-Out" Objection (The Health Economist)**
  *   **The Question:** "You're assuming additionality—that these are new organs. But empirical literature on blood and plasma suggests introducing financial incentives crowds out intrinsic altruistic motivation. If you introduce a state price, you signal that this is a transaction, not a gift. You might gain 100 paid donors but lose 500 altruistic ones. Have you modeled the net elasticity of supply here?"
  *   **The Reply:** "It's a serious empirical risk, which is why the scheme must be framed carefully—not as a 'price' but as a 'fixed compensation package' including healthcare and lost wages. We see in countries with presumed consent that cultural framing matters. But even if there is some crowding-out, the status quo is a deficit of 5,000 organs a year. Unless altruistic donation drops to near zero, the net benefit in lives saved outweighs the symbolic loss of the 'pure gift'."
  *   **The Soft Spot:** **Medium.** You're hand-waving the empirical data. Titmuss's arguments are contested but still influential. If they ask for specific studies regarding *kidneys* (not blood), you have very little. You're betting on lives saved over purity of motive.

  **3. The "Ransom Pricing" Definition Objection (The Analytic Philosopher)**
  *   **The Question:** "You define 'ransom pricing' as price set by the desperation of the seller. But a fixed state price doesn't remove desperation; it just standardizes it. If the fixed price is high enough to induce donation, it *must* be high enough to overcome the risk for someone who wouldn't otherwise do it. That implies the donor is financially vulnerable. So aren't you just institutionalizing ransom pricing rather than avoiding it?"
  *   **The Reply:** "There's a difference between *being* desperate and *being exploited by* desperation. In a market, the buyer leverages the seller's desperation to drive the price down to the minimum the seller will accept. In my scheme, the price is decoupled from the seller's reservation price. It's set based on the social value of the organ and the burden to the donor. The desperation might be the *motive* for the donor, but it's not the *mechanism* of the price setting. That breaks the exploitative link."
  *   **The Soft Spot:** **Medium-High.** This attacks the core of your paper. If the only people willing to sell at the fixed price are the desperate, does the mechanism matter? You need to hold the line that *exploitation* is a relational property (buyer vs. seller), not just an outcome property.

  **4. The "Medical Risk" Objection (The Transplant Surgeon)**
  *   **The Question:** "From a clinical perspective, financial motivation incentivizes concealment of comorbidities. Donors will lie about hypertension or family history to clear the threshold and get the compensation. Even with follow-up, if the organ fails in five years because they lied, we've wasted the resource and harmed the recipient. How do you police honesty better than we do now?"
  *   **The Reply:** "Actually, a state-run scheme allows for *more* rigorous screening than the current fragmented system. Because the state isn't profit-driven, there's no pressure to clear donors quickly. We can mandate longer cooling-off periods and more extensive independent advocacy for the donor. The financial incentive is a reason to come forward, not a reason to bypass screening. We separate the recruitment from the medical clearance."
  *   **The Soft Spot:** **Low.** This is a strong point for you if you emphasize the "state-run" aspect. Current systems are often rushed due to organ scarcity. A slower, regulated pipeline is clinically defensible.

  **5. The "Coercion of Poverty" Objection (The Political Philosopher)**
  *   **The Question:** "You say the price is fixed to avoid exploitation. But for a wealthy person, $50,000 (or whatever the figure is) is noise. For a poor person, it's life-changing. That makes the offer coercive for the poor but not the rich. You're effectively creating a scheme where the poor bear the physical risk for the benefit of the general population. Isn't that unjust regardless of the price mechanism?"
  *   **The Reply:** "It highlights background injustice, which I agree is terrible. But we have two options: leave the background injustice in place and let the poor die on the waiting list, or mitigate the background injustice *and* let them die. If the procedure is safe, and the compensation improves their life trajectory, prohibiting it paternalistically denies them a tool to escape that poverty. We should fight poverty, but not by banning the poor from risky but compensated choices."
  *   **The Soft Spot:** **Medium.** The "paternalism" defense is standard but often feels cold in a room full of ethicists. They may press that you are *compounding* injustice rather than just failing to alleviate it.

  **6. The "Black Market" Objection (The Economist/Surgeon Hybrid)**
  *   **The Question:** "You argue this undercut the black market. But if the state price is fixed below the black market price—which it must be to be fiscally sustainable—you won't displace the brokers; you'll just create a two-tier system. The rich who want to jump the queue will still go underground. You've legitimated the principle of sale without stopping the abuse."
  *   **The Reply:** "The queue jumping is handled by the allocation algorithm, which remains medical-need based, not payment-based. The black market thrives on secrecy and lack of follow-up. By bringing the transaction into the light, we bring the donors into long-term medical care. Even if some black market persists, we reduce the harm for the majority who come into the legal scheme. It's harm reduction, not utopian elimination."
  *   **The Soft Spot:** **Medium.** You're assuming the state can enforce the "no queue jumping" rule effectively. If the audience is cynical about state capacity, this looks naive.

  **7. The "Valuation" Objection (The Philosopher/Economist)**
  *   **The Question:** "You say the price is based on the 'burden' and 'social value'. Who calculates that? If you set it too low, no one donates. If you set it high enough to work, you've implicitly admitted the kidney has a market value. Where does the number come from that isn't just a market price in disguise?"
  *   **The Reply:** "We calculate compensation for burden all the time in tort law and workers' compensation. It's not a market price; it's a restitutionary figure. It covers lost wages, pain, suffering, and long-term insurance risk. It's analogous to what we pay a research subject in a clinical trial, not what we pay for a used car."
  *   **The Soft Spot:** **Low.** This is defensible. Research subject payment is a strong analogy for you. Stick to it.

  **8. The "Hope Nobody Asks" Question (The Long-Term Liability)**
  *   **The Question:** "You promise long-term follow-up for donors. Kidney donation risks hypertension and renal failure 15 or 20 years down the line. Who pays for that treatment when the donor is 60 and the government budget has changed? If the state washes its hands of it later, you've sold a promise you can't keep. If they *do* pay for it forever, have you calculated the actuarial cost? Because if you haven't, this scheme is fiscally fraudulent."
  *   **The Reply:** "That is the crucial implementation detail. The scheme must be funded by an endowment or specific insurance premium paid at the time of transplantation, ring-fenced for the donor's lifetime care. It cannot come from general revenue. If we cannot guarantee that funding, you are right, the scheme is unethical. So I argue the compensation package *includes* a lifetime health insurance bond."
  *   **The Soft Spot:** **CRITICAL.** This is where you are bluffing. You likely haven't done the actuarial math. If they press on *how* you ring-fence that money in a political system that constantly raid trust funds, you will struggle. This objection turns your "safety" feature into a promise you can't guarantee. **Prepare a specific answer on funding mechanisms before the seminar.**
