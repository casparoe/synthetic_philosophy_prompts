  Gather the discarded wood,
  build a rival claim.
  Fit every saved plank,
  to steal the honored name.

  Who owns the name?
  Counted through time,
  or piece by piece by plank?
  One continuous ship,
  one bureaucratic claim,
  against the gathered wood.

  Reassembled from the wood,
  the second bears the name.
  Both lodge an equal claim.
  Divided by time,
  docked side by side, one ship,
  restored in every plank.

  "I am the ship continuous through time."
  "I am the wood original, the name is mine."
  "The log holds claim regardless of the plank."
