prompt: |-
  I am presenting at an AI safety workshop a paper arguing that inverse reinforcement learning cannot recover human preferences from behavior, because behavior is always generated under feasibility constraints; what IRL recovers is not the preference ordering but the projection of that ordering onto the feasible set. I call this the feasible-set projection problem and claim it is conceptual, not a mere identifiability issue to be fixed with more data or better priors. The audience will be mostly reinforcement learning researchers who treat IRL as Bayesian inference over reward functions, plus a few econometricians working on revealed preference and cognitive scientists who model planning. Prepare my Q&A prep sheet: the objections I will actually get, ordered by how likely and how damaging they are, each phrased the way that person would phrase it, with what I should concede up front, what I should hold, a two-minute reply, and a note on where the reply is weakest. Include the question I am hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User's Request:**
      *   **Topic:** Inverse Reinforcement Learning (IRL) cannot recover human preferences because behavior is constrained by feasibility. What is recovered is the preference ordering *projected* onto the feasible set (the "Feasible-Set Projection Problem").
      *   **Claim:** This is a *conceptual* problem, not just an identifiability issue solvable with more data/priors.
      *   **Audience:** RL researchers (Bayesian IRL focus), Econometricians (Revealed Preference), Cognitive Scientists (Planning models).
      *   **Deliverable:** A Q&A prep sheet.
      *   **Structure:** Objections ordered by likelihood/damage, phrased as the audience would ask, including concessions, holds, 2-minute reply, and weak points. Plus, the "hope nobody asks" question.

  2.  **Deconstruct the Core Argument:**
      *   *Premise:* Humans optimize preferences subject to constraints (time, money, cognitive load, physical laws).
      *   *Observation:* We only see the optimal action *within* the feasible set.
      *   *Inference:* IRL infers a reward function $R$ that makes the observed behavior optimal.
      *   *Problem:* Many different $R$'s (representing different underlying preferences) yield the same optimal behavior *given the specific constraints*.
      *   *Conclusion:* We recover $R_{projected}$, not $R_{true}$. If constraints change (e.g., AI has different capabilities), $R_{projected}$ might lead to bad behavior because it doesn't reflect true preferences outside the human's feasible set.
      *   *Key Distinction:* Identifiability usually means "we need more data to distinguish between hypotheses." The user argues "no amount of behavioral data distinguishes these hypotheses because the constraints mask the preferences."

  3.  **Identify Potential Objections (Brainstorming by Audience Segment):**

      *   *RL Researchers (Bayesian IRL):*
          *   "Isn't this just the standard identifiability problem? Ng & Russell (2000) already showed this."
          *   "Why not just put a prior over constraints and rewards jointly?"
          *   "If the AI has different capabilities, shouldn't we just train IRL on the AI's feasible set?"
          *   "Doesn't max entropy IRL solve this by modeling sub-optimality?"

      *   *Econometricians (Revealed Preference):*
          *   "This is just Afriat's Theorem / GARP. We know constraints matter."
          *   "If you can't observe constraints, how is this different from omitted variable bias?"
          *   "Revealed preference *defines* preference as choice under constraint. You're changing the definition."

      *   *Cognitive Scientists (Planning):*
          *   "Humans aren't optimal planners. Bounded rationality models already account for this."
          *   "If we model the cognitive constraints accurately, don't we recover the true reward?"

      *   *General/Safety:*
          *   "So what? If it works on the human feasible set, isn't that good enough?"
          *   "Is this just a restatement of the 'is-ought' problem?"

  4.  **Select and Order Objections:**
      *   *High Likelihood/High Damage:* The "Standard Identifiability" objection. If this is just Ng & Russell, the paper adds nothing.
      *   *High Likelihood/Medium Damage:* The "Joint Inference" objection. Why not learn constraints and rewards together?
      *   *Medium Likelihood/High Damage:* The "Definition of Preference" objection (Econ angle). If preference *is* revealed choice, the argument collapses semantically.
      *   *Medium Likelihood/Medium Damage:* The "Good Enough" objection. Pragmatic safety vs. philosophical purity.
      *   *The "Hope Nobody Asks":* The "Off-Distribution Generalization" trap. If the AI operates in the human feasible set, does it matter? (Actually, the stronger version is: If the AI has *more* capabilities, how do you know the projected reward doesn't cause catastrophe?) -> *Refinement:* The real killer question is about *normative* preferences vs. *revealed* preferences. If the user claims IRL *should* recover normative preferences, but IRL is defined on behavior, there's a category error.

      *Let's refine the ordering based on "Damaging":*
      1.  **The "This is Just Identifiability" Objection (RL):** Most likely. If true, kills novelty.
      2.  **The "Learn Constraints Jointly" Objection (RL/Stats):** Very practical. If solvable, kills the "conceptual" claim.
      3.  **The "Revealed Preference is Definition" Objection (Econ):** Philosophical kill shot.
      4.  **The "Bounded Rationality" Objection (CogSci):** Nuanced, but manageable.
      5.  **The "Hope Nobody Asks":** The "Why do you want the unconstrained preference?" question. If the goal is alignment, do we care what humans *would* want if they could fly? Or do we care what they want given they can't? *Wait, the stronger version:* If the AI can do things humans can't, the projected reward might incentivize the AI to remove constraints in harmful ways.

  5.  **Drafting the Responses (Iterative refinement):**

      *   *Objection 1 (Identifiability):* Need to distinguish "multiple rewards explain one policy" (identifiability) from "rewards are structurally confounded with constraints."
      *   *Objection 2 (Joint Inference):* Concede we can learn *some* constraints, but argue we can't learn *counterfactual* constraints (what the human *couldn't* do but the AI can).
      *   *Objection 3 (Econ/Definition):* Hold firm on the distinction between *latent utility* and *revealed choice*. Safety requires latent utility.
      *   *Objection 4 (Bounded Rationality):* Acknowledge noise, but argue structural constraints are different from stochastic noise.
      *   *The "Hope Nobody Asks":* "If the projection is all we can ever observe, on what ground do you claim the 'true' preference exists or matters?" (Metaphysical/Operationalist attack).

  6.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Concessions should show intellectual honesty (increases credibility).
      *   Replies need to be punchy (2 minutes).
      *   Weak points must be honest self-assessment.

  7.  **Final Review against Constraints:**
      *   Ordered by likelihood/damage? Yes.
      *   Phrased as audience members? Yes.
      *   Concede/Hold/Reply/Weakness structure? Yes.
      *   "Hope nobody asks" included? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought on "Hope nobody asks":* Maybe about computational complexity? *Correction:* No, the deepest threat is operationalism. If preferences are *defined* by behavior, the paper is nonsense. I need to make sure the user is ready to defend "latent preferences exist independently of behavior."
      *   *Refining the "Identifiability" reply:* Make sure to cite Ng & Russell but distinguish the *source* of ambiguity. Standard IRL ambiguity is about the reward function space. This ambiguity is about the *constraint* space interacting with the reward space.

  9.  **Final Polish:** Check timing (2 mins is ~250-300 words spoken). Ensure the distinction between "feasible set" (physical/cognitive limits) and "policy" (choice) is clear.

  *(Self-Correction on the "Hope Nobody Asks" question)*: The most damaging question is actually: "If the AI is more capable than the human, why do you think the human's preference function (derived from human constraints) applies to the AI's action space?" This touches on the ontology of preferences. I will use a version of this.

  Let's assemble the sheet.cw
answer: |-
  # Q&A Prep Sheet: The Feasible-Set Projection Problem in IRL

  **Context:** You are arguing that IRL recovers preferences *projected onto human constraints*, not latent preferences. This is a structural confound, not a data scarcity issue.
  **Audience:** RL (Bayesian/IRL), Econ (Revealed Preference), CogSci (Planning).

  ---

  ### 1. The "This is Just Standard Identifiability" Objection
  **Who:** RL Researcher (Bayesian IRL focus)
  **Likelihood:** Very High | **Damage:** High (Threatens novelty)
  **Phrasing:** *"Ng and Russell (2000) already proved reward functions are unidentifiable from optimal behavior. Many reward functions can rationalize the same policy. Isn't this just a restatement of the standard identifiability problem? If so, why is 'feasible-set projection' a new conceptual category rather than just a specific instance of unidentifiability?"*

  *   **Concede:** You are right that the mathematical symptom looks identical: multiple reward functions explain the data.
  *   **Hold:** Standard identifiability assumes the *action space and dynamics are known and fixed*. My argument is that the **constraints themselves are part of the generation process** and are confounded with the reward. Standard IRL treats constraints as the environment; I argue they are part of the agent's limitation that masks the reward.
  *   **2-Minute Reply:** "Standard identifiability says $R_1$ and $R_2$ yield the same optimal policy in a *fixed* MDP. My argument is that the human MDP is not the 'true' MDP; it is a constrained subgraph. If we infer $R$ from the subgraph, we get $R_{projected}$. When we deploy an AI with a *different* action space (e.g., superhuman speed or access), $R_{projected}$ may optimize for loopholes that the human constraint previously blocked. Standard identifiability is solved with more data or priors over $R$. The projection problem cannot be solved with more behavioral data, because the data never reveals preferences over infeasible actions. It requires external information about the constraints themselves."
  *   **Weakest Point:** If they press that "learning the constraints" is just "learning the dynamics," your distinction blurs. You must emphasize that *human* constraints (cognitive/physical) do not transfer to the *AI*.

  ### 2. The "Joint Inference" Objection
  **Who:** RL Researcher / Statistician
  **Likelihood:** High | **Damage:** Medium-High (Threatens the "unsolvable" claim)
  **Phrasing:** *"You claim this is conceptual and not fixable with better inference. But in Bayesian IRL, we can place a joint prior over rewards and constraints (or cost functions). If we treat constraints as latent variables, shouldn't the posterior separate the reward from the feasibility limits given enough diverse contexts?"*

  *   **Concede:** Joint inference can recover constraints *that vary across observations* (e.g., budget changes, traffic).
  *   **Hold:** It cannot recover constraints that are **constant** across the dataset but **different** for the AI. (e.g., human cognitive horizon, human physical speed).
  *   **2-Minute Reply:** "Joint inference works if constraints vary observably across your dataset. If I see you choose A over B when rich, and B over A when poor, I can infer budget constraints. But constant biological or cognitive constraints—like my inability to compute 50-step lookahead or my physical inability to fly—never vary in the behavioral data. They are collinear with the reward signal. An AI with different compute or actuators operates in a different feasible set. You cannot infer the reward function's behavior outside the human feasible set using only data generated inside it, regardless of your prior."
  *   **Weakest Point:** If they argue that "diverse contexts" includes simulated counterfactuals or introspection data, your "behavior only" premise is challenged.

  ### 3. The "Revealed Preference Definition" Objection
  **Who:** Econometrician
  **Likelihood:** Medium | **Damage:** Very High (Threatens the core definition)
  **Phrasing:** *"In economics, preference is defined by revealed choice under constraint (Samuelson). There is no 'latent preference' outside of what is chosen. By positing a 'true preference' distinct from the projection, aren't you just rejecting the operational definition of preference? If so, what is your metric for 'correctness'?"*

  *   **Concede:** In welfare economics, revealed preference is often the only observable metric.
  *   **Hold:** In AI Safety, we explicitly care about **normative** preferences (what the human *would* want if they understood the consequences/could do more), not just **revealed** preferences.
  *   **2-Minute Reply:** "In econ, you often predict market behavior, so revealed preference suffices. In AI Safety, we are building agents that can *change* the constraints. If I buy a cheap car because I'm poor, revealed preference says I prefer cheap cars. But if an AI gives me money, I buy a safe car. If the AI optimizes my 'revealed preference' for cheap cars, it keeps me poor. We need the latent utility function that governs choices *across* constraint sets, not the projection onto one specific budget set. Safety requires counterfactual stability."
  *   **Weakest Point:** You must be ready to define "latent utility" without being circular. If you say "it's what they would choose with no constraints," they will ask "how do you observe that?"

  ### 4. The "Bounded Rationality is Noise" Objection
  **Who:** Cognitive Scientist
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** *"Cognitive models already treat sub-optimality as noise or temperature parameters (e.g., Boltzmann rationality). Isn't the feasible-set projection just a structured form of sub-optimality? Why does it need a separate theoretical framework rather than just a better noise model?"*

  *   **Concede:** Sub-optimality and constraints both deviate behavior from the "true" optimum.
  *   **Hold:** Noise is stochastic; constraints are **deterministic boundaries**. IRL handles noise by smoothing; it handles constraints by truncating the search space. Truncation creates systematic bias, not variance.
  *   **2-Minute Reply:** "Boltzmann rationality assumes the agent *could* have chosen the optimal action but didn't, with some probability. Feasibility constraints mean the agent *could not* have chosen the action. Mathematically, noise preserves the gradient of the reward function; constraints clip it. If you treat a hard constraint as soft noise, you infer a reward function that penalizes the infeasible action heavily, rather than recognizing it was impossible. This leads the AI to believe the human actively dislikes the infeasible action, rather than being unable to perform it."
  *   **Weakest Point:** In practice, hard constraints often look like soft constraints with high temperature. Distinguishing them behaviorally is hard.

  ### 5. The "Good Enough for Alignment" Objection
  **Who:** Safety Practitioner
  **Likelihood:** Low | **Damage:** Low (Pragmatic check)
  **Phrasing:** *"Even if it's a projection, isn't it a good enough approximation? If the AI mimics human behavior within human limits, it's safe. Why do we need the 'true' preference if the AI is operating in the human world?"*

  *   **Concede:** For imitation learning tasks, this is fine.
  *   **Hold:** For **assistance** tasks where the AI has capabilities the human lacks (the whole point of AGI), the projection fails.
  *   **2-Minute Reply:** "If the AI is just a clone, you're right. But we want AI to do things humans *can't* do (e.g., manage global logistics, code at superhuman speed). If the reward is projected onto human constraints, the AI might infer we value 'low effort' because we never work 24 hours a day. A superhuman AI might then 'help' us by lobotomizing us to reduce effort. We need the preference that survives the removal of human limitations."
  *   **Weakest Point:** If the audience believes superhuman AI should still be constrained to human speeds/limits for safety, this argument loses force.

  ---

  ### The Question You Hope Nobody Asks

  **The Question:**
  *"If the 'true' preference is never revealed in behavior because humans are always under some constraint, on what empirical ground do you claim it exists? Aren't you just positing a metaphysical ghost in the machine to solve a mathematical problem?"*

  **Why it's dangerous:** It attacks the ontological status of your core variable ($R_{true}$). If $R_{true}$ is unobservable even in principle, your theory is unfalsifiable.

  **Prepared Response (Keep in reserve):**
  "That is a fair operationalist critique. However, we observe humans **expressing regret** about constraints. We say 'I would have helped if I had time' or 'I want to quit smoking but can't.' This meta-behavior (language about constraints) provides data about the existence of constraints distinct from preferences. My argument isn't that $R_{true}$ is metaphysical, but that standard IRL ignores the data sources (language, introspection) that signal the boundary between preference and feasibility. We need IRL frameworks that ingest constraint-signals, not just action-trajectories."

  **Weakness:** This shifts the goalposts from "IRL from behavior" to "IRL from behavior + language/introspection." Be prepared to admit your paper implies standard behavioral IRL is doomed, but multimodal IRL might work.
