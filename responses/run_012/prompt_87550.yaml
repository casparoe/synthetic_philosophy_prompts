      *   *Actually, looking at the prompt's specific request:* "Name the single requirement that excludes the most otherwise-attractive candidate theories."
      *   *Idea:* The requirement that **a grade must be identifiable independently of the niche.** This rules out Gregorian/Extended cognition theories that rely on the niche to define the grade. It rules out strict internalism.
