      *   *Best Fit:* The requirement to **distinguish Kind from Degree while respecting Continuous Variation.** This is the classic "Sorites" problem in cognitive evolution. It rules out strict stage theories (too rigid) and strict dimension theories (no kinds).
      *   *Wait, let's look at the "Intrinsic vs. Niche" distinction.* If I require the theory to distinguish intrinsic organization from niche resources, but *also* require it to account for creature-plus-artifact loops as a specific grade (Gregorian), I create a paradox. The Gregorian grade *depends* on the niche.
