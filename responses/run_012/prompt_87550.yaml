answer: |-
  # Evaluative Framework for Theories of Cognitive Kinds

  **Seminar Context:** Comparative Cognition
  **Target Object:** Taxonomic theories of cognitive architecture (e.g., the Darwinian/Skinnerian/Popperian/Gregorian schema).
  **Goal:** Specification of desiderata to assess theoretical viability prior to empirical application.

  The following desiderata are ordered by the magnitude of constraint they impose on a theory. The upper tiers represent conditions of scientific intelligibility; the lower tiers represent conditions of explanatory preference.

  ---

  ## I. Desiderata Specification

  ### Tier 1: Empirical Adequacy (Non-Negotiable)
  *These constraints ensure the theory maps onto the actual biological and behavioral world. Failure here renders the theory empirically vacuous.*

  **1. The Extended System Constraint**
  *   **Motivation:** Cognitive performance often depends on a feedback loop between organism and environment that cannot be severed without destroying the competence. A theory of kinds must account for systems where the "mind" is not co-extensive with the "skin."
  *   **Concrete Case:** A navigator using a sextant and star chart. The competence (celestial navigation) is not possessed by the human brain alone, nor the tools alone, but by the coupled system. The theory must assign a grade to this loop without falsely attributing the capacity to the intrinsic biology.
  *   **Classification:** **Non-negotiable.** (Excludes strict intracranialism).

  **2. The Observational Equivalence Constraint**
  *   **Motivation:** Internal simulation (Popperian) and rapid trial-and-error (Skinnerian) can produce identical behavioral outputs if the feedback loop is sufficiently fast and low-cost. A theory must provide criteria to distinguish them beyond mere behavioral success.
  *   **Concrete Case:** A rat solving a maze. If the rat runs the maze physically 100 times (Skinnerian) vs. running it mentally 100 times before moving (Popperian), the final performance is identical. The theory must specify what evidence counts for the internal simulation distinct from the external trial.
  *   **Classification:** **Non-negotiable.** (Excludes strict behaviorism and ungrounded cognitivism).

  **3. The Evolutionary Continuity Constraint (The Baldwin Effect)**
  *   **Motivation:** Evolution does not typically invent novel mechanisms *ex nihilo*; it co-opts and canalizes existing plasticity. A theory of kinds must allow for capacities to migrate between grades over evolutionary time.
  *   **Concrete Case:** A avoidance response that begins as a culturally transmitted warning (Gregorian), becomes a learned association (Skinnerian), and eventually becomes an instinctual fixed action pattern (Darwinian) via genetic assimilation. The theory must treat these as the *same competence* at different temporal stages, not three unrelated kinds.
  *   **Classification:** **Non-negotiable.** (Excludes static typologies).

  **4. The Distributed Competence Constraint**
  *   **Motivation:** In eusocial and highly cooperative species, cognitive capacities (e.g., route planning, resource accounting) are realized across a group where no single individual possesses the full algorithm.
  *   **Concrete Case:** An ant colony optimizing foraging paths via pheromone trails, or a wolf pack coordinating a flank. No single agent holds the "map." The theory must accommodate a grade of cognition that is fundamentally multi-agent.
  *   **Classification:** **Non-negotiable.** (Excludes methodological individualism).

  ### Tier 2: Conceptual Coherence (Non-Negotiable)
  *These constraints ensure the theory is logically consistent and does not confuse categories.*

  **5. The Possession/Exercise Distinction**
  *   **Motivation:** A creature may possess a cognitive architecture capable of a task but fail to execute it due to lack of motivation, opportunity, or interference.
  *   **Requirement:** The theory must define kinds by *capacity* (competence), not *performance*. A sleeping Popperian creature is still Popperian.
  *   **Classification:** **Non-negotiable.**

  **6. The Intrinsic/Extrinsic Boundary**
  *   **Motivation:** To grade a *creature*, one must distinguish what the creature brings to the niche from what the niche affords.
  *   **Requirement:** The theory must explicitly state whether a grade is defined by neural architecture (intrinsic) or functional output (extrinsic). It cannot slide between these definitions to save a classification.
  *   **Classification:** **Non-negotiable.**

  **7. The Realism/Instrumentalism Distinction**
  *   **Motivation:** Predictive success does not guarantee ontological accuracy. An interpreter might predict a creature's behavior by treating it *as if* it simulates (Popperian), even if it is merely conditioned (Skinnerian).
  *   **Requirement:** The theory must distinguish between a creature *actually* running an internal model and an observer *successfully modeling* the creature.
  *   **Classification:** **Non-negotiable.**

  ### Tier 3: Explanatory Scope (Camp Preferences)
  *These constraints reflect theoretical commitments that are debated within the field. A theory may fail these and still be viable, but it will align with specific schools of thought.*

  **8. The Kind/Degree Distinction**
  *   **Motivation:** Is cognition a ladder of discrete steps (Kinds) or a landscape of continuous variables (Degree)?
  *   **Requirement:** The theory must either justify discrete boundaries (phase transitions) or explain why "grades" are useful heuristics for continuous variation.
  *   **Classification:** **Camp Preference.** (Discretists vs. Dimensionalists).

  **9. The Mechanism/Function Alignment**
  *   **Motivation:** Should kinds be individuated by *how* they work (mechanism) or *what* they achieve (function)?
  *   **Requirement:** If a bird and a bat both navigate via echolocation, are they the same cognitive kind? If a human and a computer both solve logic puzzles, are they the same kind?
  *   **Classification:** **Camp Preference.** (Computational Functionalists vs. Biological Naturalists).

  **10. The Learning/Simulation Boundary**
  *   **Motivation:** At what point does weighted association (learning) become hypothesis testing (simulation)?
  *   **Requirement:** The theory must specify the threshold. Is a neural network that backpropagates errors a Skinnerian or a Popperian system?
  *   **Classification:** **Camp Preference.** (Connectionists vs. Classical Cognitivists).

  ### Tier 4: Empirical Constraints (Cannot Contradict)
  *Specific findings that act as hard boundaries.*

  **11. Fixed Action Patterns (Ethology)**
  *   **Finding:** Tinbergen's work on innate releasing mechanisms.
  *   **Constraint:** The theory cannot claim all behavior is learned or simulated. It must accommodate hardwired, stimulus-locked responses that bypass individual processing.

  **12. Latent Learning (Comparative Psychology)**
  *   **Finding:** Tolman's rats forming cognitive maps without reinforcement.
  *   **Constraint:** The theory cannot claim all individual learning is strictly operant (Skinnerian). It must allow for information acquisition without immediate payoff.

  **13. Convergent Evolution (Evolutionary Biology)**
  *   **Finding:** Corvids and Primates exhibit similar problem-solving capacities with radically different neuroanatomy (nidopallium vs. neocortex).
  *   **Constraint:** The theory cannot tie a cognitive kind exclusively to a specific homologous brain structure. It must allow for analogous realization.

  ---

  ## II. Structural Tensions (Incompatibilities)

  No theory of cognitive kinds is likely to satisfy all desiderata simultaneously without residue. The following tensions are structural, arising from the nature of the phenomena rather than clumsy theorizing.

  ### 1. The Discrete/Continuous Tension
  *   **Conflicting Desiderata:** *The Evolutionary Continuity Constraint* (Tier 1, #3) vs. *The Kind/Degree Distinction* (Tier 3, #8).
  *   **The Tension:** Evolutionary biology strongly suggests continuous variation in neural capacity and behavioral flexibility. However, a theory of "Kinds" (like the Darwinian/Skinnerian/Popperian/Gregorian schema) posits discrete categories.
  *   **Why Unavoidable:** To satisfy the Continuity Constraint, the theory must acknowledge that "Popperian" simulation emerges gradually from "Skinnerian" reinforcement as internal feedback loops become faster and more complex. To satisfy the Kind/Degree Distinction, the theory must draw a line where a creature *becomes* Popperian. Any line drawn is biologically arbitrary. You cannot have a theory that respects the smooth gradient of evolution while simultaneously asserting the existence of mutually exclusive cognitive grades. One must yield: either the grades are fuzzy sets (undermining the "Kind" taxonomy) or the evolutionary transitions are treated as saltations (contradicting neo-Darwinism).

  ### 2. The Individuation Tension (Mechanism vs. Function)
  *   **Conflicting Desiderata:** *The Extended System Constraint* (Tier 1, #1) vs. *The Intrinsic/Extrinsic Boundary* (Tier 2, #6).
  *   **The Tension:** To account for Gregorian cognition (tools, language), the theory must treat the artifact as part of the cognitive system (Extended System). However, to grade the *creature* (e.g., to say "Humans are Gregorian, Chimps are not"), the theory must isolate the creature's intrinsic properties from its environment (Intrinsic/Extrinsic Boundary).
  *   **Why Unavoidable:** If cognition is defined by the loop (Extended), then a human without tools is not a Gregorian creature, but a different system entirely. If cognition is defined by the creature (Intrinsic), then the tool is merely a prop, and the "Gregorian" grade collapses into a capacity for tool use intrinsic to the brain. You cannot simultaneously define the grade by the *coupling* and use that grade to classify the *uncoupled organism*. This creates a paradox in comparative assessment: do we test the animal in a vacuum (ignoring its niche) or in its niche (confounding animal with environment)?

  ---

  ## III. The Most Exclusionary Requirement

  **The Requirement:** **The Kind/Degree Distinction (Tier 3, #8)** specifically interpreted as a demand for **Qualitative Discontinuity.**

  **What it Rules Out:**
  This requirement excludes the vast majority of contemporary **dimensional models** in comparative psychology and **connectionist models** in cognitive science.
  1.  **Dimensional Models:** These theories posit that cognition varies along continuous axes (e.g., working memory capacity, inhibitory control, temporal discounting). A theory demanding discrete "Kinds" must reject the view that a chimpanzee is simply a human with lower parameters on these axes. It forces the theorist to claim there is a *switch* that turns on "Popperian" capacity, rather than a slider that turns up "Simulation" capacity.
  2.  **Connectionist/Neural Net Models:** These models demonstrate how "simulation-like" behavior can emerge from simple reinforcement learning architectures as complexity increases, without any architectural phase shift. A requirement for discrete kinds forces the rejection of emergence in favor of architectural modularity.

  **Why this is a Cost rather than a Virtue:**
  While discrete kinds are heuristically powerful for seminar discussion and philosophical categorization, enforcing them as ontological realities imposes a **false precision** on biological data.
  *   **The Cost:** It forces the theory to posit "magic steps" in evolution where none are evident in the fossil or genetic record. It risks creating a taxonomy that is clean conceptually but false biologically. It encourages theorists to ignore borderline cases (e.g., animals that show *some* simulation but not *all*) rather than treating them as the critical data points they are.
  *   **The Justification for Exclusion:** We retain this requirement not because we believe nature is discrete, but because a theory of *Kinds* loses its utility if it dissolves into a list of continuous variables. If every creature is unique in its degree of capacity, comparison becomes impossible. We accept the cost of biological inaccuracy to gain the benefit of communicable taxonomy, but we must acknowledge that this is a pragmatic concession, not an empirical discovery.

  **Conclusion for the Seminar:**
  Any theory we examine must explicitly state where it absorbs these costs. Does it sacrifice biological continuity to save the taxonomy? Or does it sacrifice the discreteness of the kinds to save the biology? A theory that claims to do both without addressing these tensions should be dismissed immediately.
