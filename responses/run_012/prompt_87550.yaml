      *   *Re-reading the prompt:* "Name the single requirement that excludes the most otherwise-attractive candidate theories."
      *   *Selection:* The requirement that **the theory must distinguish a genuinely new grade from a difference of degree.** Why? Because most biological data supports differences of degree (neural complexity, memory capacity). Demanding a "new grade" forces theorists to posit qualitative shifts (phase transitions) that are hard to prove. This excludes many continuous evolutionary models.

  6.  **Refining the Output Structure:**
