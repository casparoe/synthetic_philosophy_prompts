answer: |-
  Here is the translation of the game-theoretic claim into decision-theoretic vocabulary, followed by the residue report and an evaluation of your suspicion.

  ### Part 1: The Translation
  **The Game-Theoretic Claim:** A rational player never plays a strictly dominated strategy (even by a mixed strategy). Iterating this elimination, under the assumption of Common Knowledge of Rationality (CKR), peels the game down to a set of surviving strategies (rationalizable strategies).

  **The Decision-Theoretic Restatement:**
  Consider a decision problem where the **States of Nature** ($\Theta$) correspond to the pure strategy profiles of the opponent(s), and the **Actions** ($A$) correspond to the player's own pure strategies. Let the **Loss Function** be the negative of the payoff function.

  1.  **Single-Step Elimination:** A decision rule (pure strategy) is **inadmissible** if there exists another rule (pure or randomized) that yields strictly lower risk for every state $\theta \in \Theta$. A rational decision maker must restrict their choice to the **complete class** of admissible rules.
  2.  **Iterative Elimination:** This process models a sequence of decision problems $\mathcal{D}_0, \mathcal{D}_1, \dots$. In $\mathcal{D}_0$, the parameter space is $\Theta_0$. We eliminate all inadmissible rules to find the admissible set $A_1$.
      Crucially, we now assert that the "States of Nature" are not passive truths but are themselves the output of a parallel decision problem solved by the opponent. Therefore, we update the parameter space to $\Theta_1$, removing those states corresponding to the opponent's inadmissible rules.
      We repeat the admissibility check on $\mathcal{D}_1$ (with state space $\Theta_1$). A rule that was admissible in $\mathcal{D}_0$ may become inadmissible in $\mathcal{D}_1$ because it was a best response only to states now deemed impossible.
  3.  **The Survivor Set:** The process converges to a set of decision rules that remain admissible under the limiting parameter space $\Theta_\infty$, where $\Theta_\infty$ contains only states consistent with the opponent also selecting from their own limiting complete class.

  ---

  ### Part 2: The Residue Report

  Here is the accounting of what translates cleanly, what requires distortion, and what vanishes entirely.

  #### 1. What Maps Cleanly (The Isomorphism)
  *   **Strict Dominance $\leftrightarrow$ Inadmissibility:** This is a perfect fit. A strategy strictly dominated by a mixed strategy corresponds exactly to a decision rule that is strictly dominated by a randomized decision rule. In both frameworks, the risk set (set of achievable risk vectors) is convexified by allowing randomization, and any point inside the convex hull is inadmissible.
  *   **Rationality $\leftrightarrow$ Admissibility:** The normative claim "a rational agent does not play $X$" maps cleanly to "an admissible rule does not include $X$." Both rely on the Pareto principle: if $Y$ is better than $X$ everywhere, do not choose $X$.
  *   **Survivors $\leftrightarrow$ Complete Class:** The set of strategies surviving IESDS maps to the set of rules that are admissible relative to the restricted parameter space.

  #### 2. What Required Distortion (The Friction)
  *   **States of Nature vs. Strategic Agents:** To make this fit, I had to treat the opponent's strategies as "States of Nature." In Decision Theory (DT), states are passive; they do not react to your decision rule. In Game Theory (GT), states are active choices.
      *   *The Distortion:* The iterative step requires treating the parameter space $\Theta$ as **endogenous**. Standard DT treats $\Theta$ as fixed by the physical world. Here, $\Theta$ shrinks not because we observed data, but because we deduced that a rational agent *could not* occupy those states. This turns a static decision problem into a fixed-point problem over two coupled decision systems.
  *   **Priors as Deductions:** In DT, a prior represents subjective belief or frequency. In the iterative translation, the "prior" in round $k$ must have zero support on states eliminated in round $k-1$. This distorts the DT notion of a prior from "what I believe" to "what is logically consistent with rationality."

  #### 3. What Has No Counterpart (The Void)
  *   **Common Knowledge of Rationality (CKR):** This is the missing engine. DT is fundamentally a **single-agent** framework. It has no vocabulary for "I know that you know that I know."
      *   In DT, I can restrict my parameter space based on *my* knowledge. I cannot restrict it based on *your* rationality unless I hard-code that constraint into the model ex-ante.
      *   The *iteration* itself is not a decision-theoretic operation; it is an epistemic operation. DT tells you how to optimize given a model; GT (via CKR) tells you how to constrain the model itself based on the optimizer's nature.

  ---

  ### Part 3: Addressing Your Suspicion

  You suspected that the **Complete Class Theorem** (Admissible $\implies$ Bayes for some prior) leaves no room to call a strategy "irrational" rather than "suboptimal relative to a belief," and that the **iterative/CKR** component is inexpressible in DT.

  **You are correct.** Here is the precise breakdown of why.

  #### 1. The "Irrationality" vs. "Suboptimality" Gap
  In Decision Theory, if a rule $\delta$ is admissible, Wald's Complete Class Theorem guarantees there exists *some* prior $\pi$ (possibly improper) for which $\delta$ is a Bayes rule.
  *   **DT Verdict:** "Strategy $\delta$ is rationalizable *if* you hold prior $\pi$." DT is agnostic about the rationality of the prior itself (unless you impose subjective probability axioms).
  *   **GT Verdict:** "Strategy $\delta$ is irrational, period."
  *   **The Conflict:** In IESDS, strategies eliminated in round 2 (e.g., in a $3 \times 3$ game where a strategy is a best response only to a dominated opponent strategy) are **admissible** in the original decision problem (Round 0). There *does* exist a prior over the opponent's original strategies that makes them optimal.
  *   **The Resolution:** GT claims that prior is **forbidden**. It assigns positive probability to an event (the opponent playing a dominated strategy) that is logically impossible under CKR.
  *   **Conclusion:** Your vocabulary lacks a mechanism to rule out priors. DT treats priors as exogenous inputs (preferences/beliefs). GT treats priors as endogenous outputs (deductions from rationality). Therefore, DT cannot distinguish between "suboptimal given reasonable beliefs" and "irrational under any consistent belief" without adding external constraints on the support of the prior.

  #### 2. The Iterative/CKR Void
  The iterative elimination is not a search for optimality; it is a search for **consistency**.
  *   In DT, iteration usually implies learning (updating priors via Bayes' rule).
  *   In GT, iteration implies **deduction** (updating the feasible set of states via logic).
  *   Because DT lacks the "other agent" as a mirror, it cannot generate the recursive constraint: "My optimal rule depends on your optimal rule, which depends on my optimal rule." DT solves $\max_a E_\pi[U(a, \theta)]$. GT solves for a fixed point where $\pi$ is consistent with the opponent solving $\max_b E_{\pi'}[V(b, \theta')]$.

  ### Part 4: Verdict — Defect or Ill-Defined?

  Is this residue a defect of your Decision-Theoretic framework, or a sign that the Game-Theoretic claim is doing something less well-defined?

  **It is neither. It is a Category Difference.**

  1.  **Not a Defect of DT:** Decision Theory is designed for **Man vs. Nature**. Its job is to optimize action given uncertainty. It succeeds perfectly there. Asking it to model **Man vs. Man** without augmentation is like asking a hammer to screw in a bolt. The "defect" is expecting a single-agent calculus to solve a multi-agent epistemic constraint problem. The inability to rule out priors is a feature of DT's flexibility, not a bug.

  2.  **Not Ill-Defined GT:** The Game-Theoretic claim is mathematically well-defined (IESDS is a precise algorithm). However, your suspicion points to a known fragility in the **epistemic foundations** of Game Theory.
      *   The claim that a strategy is "simply irrational" relies on the assumption that Common Knowledge of Rationality actually holds.
      *   Many statisticians and epistemologists argue that CKR is an impossibly strong assumption. In the real world (and in many statistical models of behavior), agents *do* assign positive probability to opponents making mistakes (trembling hand, bounded rationality).
      *   If you allow a prior that puts $\epsilon$ probability on the opponent being irrational, the "iterated elimination" collapses. The strategies eliminated in round 2 become admissible again (because they are best responses to the $\epsilon$ chance of irrationality).

  **Final Diagnosis:**
  Your Decision-Theoretic vocabulary is actually **more robust** here. It correctly identifies that strategies eliminated in later rounds of IESDS are *admissible* relative to the full state space. They are only "irrational" under the extreme, singular prior that assigns probability 1 to CKR.

  The Game-Theoretic claim tries to hide a **prior selection problem** inside a **dominance argument**. It says, "You shouldn't play this," but the real reason is, "You shouldn't *believe* that." Since Decision Theory treats beliefs (priors) as primitive, it exposes what Game Theory tries to derive: that the "irrationality" of IESDS survivors is not about the decision rule itself, but about the impermissibility of certain beliefs about the opponent.

  **Recommendation:** When thinking about IESDS in your statistical vocabulary, view it not as "eliminating bad rules," but as **"restricting the support of the prior based on logical consistency constraints."** The residue you feel is the sound of Decision Theory refusing to accept logical constraints on priors without explicit modeling. That is a strength of your framework, not a weakness.
