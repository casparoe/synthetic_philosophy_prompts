          *   Amendment 2: Drops "harm" requirement. Harm belongs to *illness* (experience/social role), not *disease* (biological fact).
          *   Stock Reply: Critics conflate disease (fact) and disvalue (harm). Threshold problems apply to everyone.
      *   **Task:** Draft 10-12 interview questions.
      *   **Format:** Clustered and sequenced, phrased as spoken by a host. Each needs a follow-up keyed to the *likely* answer, plus a one-line note for *unexpected* answers.
      *   **Constraints:**
          *   No "restate your position" or "survey the literature" questions.
          *   No "who said what" questions.
          *   Must press on specific philosophical pressure points (selective environment identification, role of disease without harm, universal disease, historical cases like homosexuality/bereavement, normativity of function, threshold problem, enhancement/aging/pregnancy, practical implications).
          *   **Strategic Sequencing:** Make the "two-ledger" move (disease vs. illness) progressively harder to use.
          *   **Ending:** The "afraid to ask" question + a falsifiability question (with a specific follow-up if she says "nothing could falsify this").
          *   **Editing:** Identify two questions to cut if time runs short.

  2.  **Deconstruct the Guest's Position & Vulnerabilities:**

      *   *Vulnerability 1: The Selective Environment.* How do we know what the "environment of evolutionary adaptedness" (EEA) was? Isn't selecting *which* environment counts a value-laden or theoretical choice?
      *   *Vulnerability 2: Disease without Harm.* If a condition causes no harm (no pain, no disability, no social penalty), why call it a disease? What work is the concept doing?
      *   *Vulnerability 3: Universality.* If everyone has high blood pressure due to salt, is it still a disease? If *everyone* is myopic, is it a disease? This feels counterintuitive.
      *   *Vulnerability 4: Historical Corrections.* Homosexuality removed from DSM. Was that science finding it wasn't a dysfunction, or society deciding it wasn't bad? She will say science. Can we prove it?
      *   *Vulnerability 5: Normativity of Function.* "Function" often implies "what it *ought* to do." Is biology truly value-free?
      *   *Vulnerability 6: Thresholds.* She says thresholds are natural facts. But biology is continuous. Where is the fact?
      *   *Vulnerability 7: Enhancement/Aging.* Aging is a decline in function. Is aging a disease? Pregnancy reduces efficiency in some systems. Is it a disease?
      *   *Vulnerability 8: Clinical Practice.* If harm is separate, do we treat disease without illness? Who pays?

