      *(Self-Correction during drafting)*: Make sure I don't ask her to explain the selective environment too basicly. Focus on the *identification* problem. Make sure the "harm" question challenges the *utility* of the concept, not just the definition.

      *   *Sequencing for the "Two-Ledger" Trap:*
