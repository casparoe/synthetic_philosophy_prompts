answer: |-
  The requirement for normative conditions of use knocks out the most contenders, and the pair of demands for non-spooky metaphysics and autonomous collective causal power is jointly unsatisfiable without invoking recursive feedback loops.

  ### Desiderata for a Theory of National Character

  **1. Ontological Declaration (The Unit)**
  The theory must explicitly select one of the following ontological bases and accept the associated burdens:
  *   **(a) Aggregative:** Character is the joint distribution of individual traits. *Burden:* Explain why this is not trivial (e.g., "all populations have a distribution") by specifying why *this* distribution constitutes a distinct character rather than noise.
  *   **(b) Emergent:** Character is a property of the collective irreducible to members. *Burden:* Provide a mechanistic account (institutions, laws, infrastructure) to avoid "spookiness"; show how the property exerts downward causation without violating causal closure.
  *   **(c) Reflexive:** Character is a self-image held by the population. *Burden:* Map the feedback loop showing how the belief causes the behavior that confirms the belief (self-fulfilling prophecy).
  *   *Constraint:* A theory cannot slide between these categories to evade criticism.

  **2. Temporal Stability (The Time Constant)**
  The theory must specify the half-life of the character and the conditions for its dissolution.
  *   **Duration:** Is the characteristic timespan generational (25 years), centennial, or millennial?
  *   **Change vs. Cohort:** The theory must distinguish character change from cohort replacement. If the "character" shifts entirely because one generation died and another was born, the theory must admit it is measuring demographics, not character.
  *   **Falsification:** State what evidence would prove the character has changed (e.g., a sustained shift in the mean >1 SD over two generations) versus what proves only a temporary fluctuation.

  **3. Structural Sensitivity (The Covariance Case)**
  The theory must answer the "made-up case": Two populations have identical means and variances on all traits, but in Population A the traits are uncorrelated, while in Population B they cluster (e.g., gregariousness covaries with punctuality).
  *   **Requirement:** Declare whether this difference constitutes a difference in national character.
  *   **Cost:** If "no," the theory loses the ability to predict trait syndromes. If "yes," the theory must explain how character resides in the *relations* between traits rather than the traits themselves.

  **4. Variance Accounting & Fallacy Guardrails**
  *   **Within vs. Between:** The theory must acknowledge that within-group variance typically exceeds between-group variance. It cannot use high within-group heritability to justify between-group explanations.
  *   **Ecological Fallacy:** The theory must explicitly forbid inferring individual traits from group statistics unless accompanied by a specified error rate and confidence interval.
  *   **Reference Class:** Define membership rigorously (passport, ancestry, self-ID, language). The theory must state how it handles second-generation immigrants and diasporas (e.g., do they retain the character, acquire a new one, or hybridize?).

  **5. Measurement Robustness**
  *   **Replication:** The theory cannot rely on cross-cultural survey dimensions (e.g., Hofstede, Big Five) unless it addresses measurement invariance. If the metric does not mean the same thing in both cultures, the comparison is void.
  *   **Reflexivity:** The theory must account for stereotype threat. If measuring the character changes the character (by activating the stereotype), the theory must model this interference rather than treating it as noise.

  **6. Normative Gating (Conditions of Use)**
  The theory must distinguish between *truth conditions* and *use conditions*. It must explain why a statistically true generalization is permissible in some contexts (insurance actuarial tables, ancestry-based medical screening) but impermissible in others (hiring, sentencing).
  *   **Requirement:** Provide a principle that separates actuarial fairness (pooling risk) from individual justice (assessing merit).
  *   **Constraint:** A theory that claims "if it's true, you can use it" is insufficient; it must explain why truth alone does not license action in high-stakes individual contexts.

  ***

  ### Meta-Analysis of Requirements

  **Non-Negotiable vs. Prejudicial**
  *   **Non-Negotiable:** Ontological Declaration (1), Temporal Stability (2), and Normative Gating (6). Without these, the concept is either metaphysically incoherent, empirically unfalsifiable, or ethically dangerous.
  *   **Prejudicial:** Structural Sensitivity (3). Insisting that covariance structure *must* count as character privileges configural psychology over aggregative realism; however, a theory is allowed to say "no" here provided it pays the predictive cost outlined above.
  *   **Prejudicial:** Measurement Robustness (5). While ideal, demanding full measurement invariance may exclude historical theories where such data is unavailable; this is a methodological preference for modern psychometrics over philosophical coherence.

  **The Jointly Unsatisfiable Pair**
  You are correct to suspect a tension, but the unsatisfiable pair is specifically: **Non-Spooky Metaphysics (Methodological Individualism) + Autonomous Collective Causal Power.**
  *   If you demand the theory be reducible to facts about individuals (no spookiness), you cannot simultaneously claim the collective property has causal power *independent* of those individuals.
  *   **Resolution:** This pair is only satisfiable if you adopt Ontological Option (c) (Reflexive). Here, the "collective property" is the feedback loop itself. The belief (individual) creates the institution (collective) which shapes the individual. If a theory demands strong emergence (b) without this recursive mechanism, it fails.

  **The Single Most Excluding Requirement**
  **Normative Gating (6).**
  *   **Reasoning:** Most existing accounts (psychological, sociological, historical) focus entirely on descriptive adequacy (is it true?). Very few attempt to justify the *licensing conditions* for acting on that truth. By demanding a principle that separates permissible generalization (medicine/insurance) from impermissible generalization (hiring), you eliminate purely descriptive theories that assume "knowledge is neutral." This forces the theory to engage with political philosophy and ethics, not just social science, which most "national character" accounts fail to do.
