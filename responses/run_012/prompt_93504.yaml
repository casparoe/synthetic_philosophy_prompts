answer: |-
  ### Reconstruction of Hobbes's Mathematical Commitments

  To reconstruct Hobbes's reaction to later mathematics, we must first disentangle his epistemological optimism from his ontological parsimony. Hobbes's central commitment is that *scientia* (demonstrative knowledge) is possible only where we know the cause of the object. In geometry, we possess *scientia* because we construct the figures; we are the cause of the circle, therefore we know its properties. This is not merely psychological; it is kinematic. Geometry is the study of the consequences of motion. Space is the phantasm of existing bodies, and a line is the trace of a moving point.

  This creates a tension. On one hand, Hobbes defines reasoning as "reckoning"—the addition and subtraction of ideas—which sounds proto-formalist. On the other, he violently opposes the symbolic algebra of his contemporaries (notably John Wallis). Why? Because for Hobbes, symbols are only valid if they track clear ideas of magnitude and motion. Empty symbolic manipulation is "scholastic nonsense," a linguistic fog that obscures reality. Furthermore, Hobbes's mathematics is deeply political. He views the obscurity of university mathematics as akin to clerical obscurantism: if only a priestly caste of geometers can verify truth via complex symbols, civil sovereignty is threatened. Truth must be surveyable by the individual reasoner.

  With these commitments—kinematic ontology, constructionist epistemology, and anti-authoritarian surveyability—we can project his responses. Where his texts underdetermine the answer, particularly regarding the distinction between logical consistency and physical truth, I will flag the speculation.

  ### 1. Non-Euclidean Geometries
  **Verdict:** Rejection of the philosophical interpretation; acceptance of the kinematic utility.

  Hobbes would likely deny that non-Euclidean systems constitute "geometry" in the strict sense. For him, geometry describes the necessary properties of space as we construct it. If a system posits parallel lines that meet, it contradicts the phantasm of space derived from our experience of bodies. He would view the axiomatic treatment of geometry—where truth is replaced by consistency within a model—as a retreat into nominalism without anchor. He would argue that these are not discoveries about space, but merely definitions of new names.

  However, his kinematic grounding offers a loophole. If a non-Euclidean model can be generated by a specific type of motion (e.g., motion on a curved surface), he might accept it as a branch of *physics* or applied kinematics, but not as pure geometry. The indeterminacy here lies in whether Hobbes could separate the logical consistency of a system from its truth claims. Given his insistence that geometry is the "only science that it has pleased God hitherto to bestow on mankind," he would likely view the pluralization of geometries as a degradation of certainty, a sign that mathematicians have lost touch with the causal generation of figures.

  ### 2. The Ascendancy of Algebra and Logic
  **Verdict:** Hostile denunciation; a vindication of his feud with Wallis.

  This development represents the total victory of the tradition Hobbes fought against. The arithmetisation of geometry (coordinates) and the formalisation of logic (Frege-Russell) prioritize symbolic manipulation over intuitive construction. Hobbes would denounce this as the triumph of "marking-reckoning" over reasoning. To define a point as a pair of numbers is to lose the causal genesis of the point (the end of a line).

  Crucially, he would interpret this shift through the lens of authority. The formalisation of mathematics created a specialized language inaccessible to the uninitiated, exactly the kind of "university authority" he distrusted. He would argue that by making mathematics dependent on complex symbolic logic, the discipline has become a form of faith: one must trust the logician's derivation because one cannot survey the causal steps. While he championed reasoning as computation, he meant the computation of *concepts*, not the manipulation of uninterpreted signs. He would see the Frege-Russell programme as the ultimate scholasticism: a cathedral of syntax built on no physical substance.

  ### 3. Infinitesimals and Nonstandard Analysis
  **Verdict:** Absolute ontological rejection.

  This is the clearest prediction. Hobbes rejected the concept of "infinite quantity" as a contradiction in terms; one cannot add or subtract what has no bound. He viewed the methods of indivisibles (used by Cavalieri and others) as a revival of Aristotelian essences—magic words used to bypass rigorous demonstration.

  Even the rigorous rehabilitation of infinitesimals in nonstandard analysis would fail to move him. For Hobbes, the problem is not merely logical consistency; it is ontological. There are no infinitesimal bodies, and there is no infinite magnitude. To legitimize them via model theory would strike him as a linguistic trick. He would argue that nonstandard analysis provides a consistent *language* for talking about limits, but it does not prove the existence of the objects the language names. Here, his temperament and his principles align perfectly: the "foundational crisis" regarding infinitesimals would confirm his suspicion that the new mathematics was built on sand.

  ### 4. The Incompleteness Theorems
  **Verdict:** Conflicted; a mix of vindication and dismay.

  Gödel's theorems present a complex challenge. On one hand, they demonstrate the limits of the formal axiomatic method—the very method Hobbes distrusted in favor of construction. He might seize upon incompleteness as proof that symbolic systems cannot capture all mathematical truth, vindicating his claim that reasoning requires intuition of magnitudes, not just syntactic derivation.

  On the other hand, incompleteness undermines the certainty of geometry itself, which Hobbes held as the gold standard of *scientia*. If arithmetic (and by extension, geometry) cannot prove its own consistency, the "demonstrative knowledge" Hobbes promised is unattainable within the system. Hobbes would likely struggle to distinguish between *truth* and *provability*. He would ask: "If the system cannot prove it, what causes it to be true?" If the answer is "intuition," he might agree, but if the answer is "meta-mathematical assumption," he would see this as a regression to faith. This is a point where his framework is strained; he lacks the resources to discuss meta-mathematics without collapsing it into metaphysics.

  ### 5. Machine Proof and Formal Verification
  **Verdict:** Political and epistemic horror.

  This development strikes at the heart of Hobbes's epistemology: surveyability. For Hobbes, I know a theorem is true because I have performed the construction or followed the reckoning in my own mind. A computer-assisted proof (like the Four-Colour Theorem) that no human can fully read is, for Hobbes, not knowledge but testimony.

  He would interpret the reliance on machines as the ultimate transfer of authority from the individual to the institution. Just as he feared the Church demanding belief in mysteries beyond reason, he would see the mathematical community demanding belief in outputs beyond human survey. "The machine says so" is structurally identical to "The Priest says so." He would argue that this severs the link between knowledge and causality. We did not cause the proof; the machine did. Therefore, we do not possess *scientia*, only belief. This is not mere Luddism; it follows directly from his definition of knowledge as causal understanding accessible to the reasoner.

  ### On Prescience
  There is a temptation to read Hobbes as a proto-constructivist or intuitionist, given his insistence on construction and his rejection of actual infinities. There is a coincidence of vocabulary, but not of motivation. Modern constructivism is often driven by logical concerns (e.g., the law of excluded middle); Hobbes's drive was metaphysical and political. He wanted construction because only what is made can be known, and only what can be known by all can secure the peace. His "anticipation" of the limits of formalism is real, but it stems from his kinematic ontology, not from a insight into logical syntax. He was prescient about the *social* consequences of formalism (the creation of an expert priesthood) rather than the *logical* limits.

  ### Closing Reflections
  The predictions I would defend most strongly are his rejection of infinitesimals and his hostility toward machine proof. These follow directly from his ontology of bodies and his epistemology of surveyability. The prediction I would defend least is his reaction to non-Euclidean geometry, as his conflation of physical space with geometric truth leaves room for ambiguity: he might accept it as physics while rejecting it as geometry.

  This exercise reveals the limits of counterfactual history. We can project a philosopher's *principles*, but we cannot easily project their *adaptability*. Hobbes was dogmatic, but he was also a materialist who cared about the "new science." It is possible that faced with the empirical success of calculus or the utility of non-Euclidean geometry in relativity, he might have adjusted his kinematics to accommodate them, redefining "motion" to fit the new math. However, the core tension remains: Hobbes wanted mathematics to be a tool for civil peace, grounded in clear ideas accessible to every rational subject. The trajectory of modern mathematics—increasingly abstract, symbolic, and reliant on institutional and mechanical authority—moves in the exact opposite direction. Hobbes would not merely disagree with modern mathematics; he would view it as a threat to the very possibility of a rational commonwealth.
