  Hey — for a metaphysics reading group I'm putting together a designed case where counterpart theory and transworld identity come apart over whether swapping two indistinguishable things counts as a genuinely different possibility. I think it should come apart: the haecceitist version of transworld identity says the swap is a different world, because it's different individuals occupying those roles, whereas counterpart theory says it's the same possibility described twice, since each thing's counterpart just plays the swapped role. Keep it mundane — identical twins raised together, or two indistinguishable mugs on a symmetric shelf — no electrons, no talk of "possible worlds" inside the scenario itself, and dont smuggle in any fact about which twin is "really" which. After the scenario, give the verdict each theory delivers and why, then say whcih feature of the case is actually doing the work: is it haecceitism, or is it really about how each theory individuates worlds/possibilities? Last, what's the best move for a counterpart theorist who wants to deny there's any real disagreement here, and does that move cost them anything elsewhere?
