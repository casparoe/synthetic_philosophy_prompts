prompt: |-
  Ok, I'm running a small reading group on combinatorial games and I need you to compare two tricks for proving that the first player wins a game without anyone actually being able to say how. The first one is the strategy-stealing argument — you know, the Hex / Chomp kind of thing where you assume the second player has a winning strategy, then the first player makes some throwaway move and pretends to be the second player. The second one is the mirroring or pairing argument, where you just copy your opponent's moves, or pair up squares so every reply is forced (Tweedledum and Tweedledee). Both of them feel like they hand you a win for free, so what I want to know is where they actually come apart: what does each one have to assume about the game that the other one doesnt need?

  The bit I really care about is the so-called strategy-stealing assumption — the idea that having an extra move, or an extra one of your own pieces on the board, can never hurt you. Is that a genuine assumption, or does it follow from something more basic? Is it ever false? Test it on three games: Hex, Chomp, and then one game of your choosing where you think the assumption actually breaks (misère play, zugzwang, take your pick — but tell me why that game and not some other). For each of the three, say which of the two arguments goes through, and if it doesn't, point to the exact step that fails.

  Then give me a verdict. Are these two arguments really different species, or is mirroring just strategy stealing wearing a hat? Which one should make me more suspicious that somethings being smuggled in? And do either of them ever tell you what the actual winning move is, or are they both pure existence proofs that leave you knowing that somebody wins and nothing else? American English please, and no reading list — I want the arguments, not the bibliography.
