answer: |-
  Imagine we are standing at the top of a decision tree, and our first fork asks whether the term species names anything in nature at all. If you answer no, you land on Eliminativism, which holds that species are merely artifacts of human classification with no mind-independent reality, and its most awkward commitment is that we must rewrite all biology textbooks to remove the word without losing explanatory power. If you answer yes, you proceed down the realist branch to a second fork asking whether what it names are kinds or particular historical lineages. If you say they are particulars, you arrive at the Species-as-Individuals thesis, which treats species as concrete entities born at speciation and dead at extinction, and its most awkward commitment is that you cannot have a law of nature about species because particulars do not instantiate laws. If you say they are kinds, you move to a third fork asking whether there is one correct criterion for drawing species boundaries or only a family of purpose-relative ones. If you choose the latter, you land on Pluralistic Realism, which argues that different concepts legitimately answer different questions depending on the biological context, and its most awkward commitment is that you must accept that two biologists studying the same population are talking about different things without either being wrong. If you choose the former, you enter the monist wing where a single definition must cover all cases, and here the tree branches further based on what property defines the kind.

  Within this monist wing, the first branch asks if the defining property is reproductive isolation, which yields the Biological Species Concept, and its most awkward commitment is that asexual organisms must be exiled from the category entirely. The next branch asks if the defining property is shared ancestry and diagnosability, yielding the Phylogenetic Species Concept, and its most awkward commitment is that every trivial mutation creates a new species if diagnosed correctly. A third branch asks if the defining property is occupation of a distinct ecological niche, yielding the Ecological Species Concept, and its most awkward commitment is that two interbreeding populations in different niches are distinct species even if they merge tomorrow. A fourth branch asks if the defining property is overall similarity in form, yielding the Morphological Species Concept, and its most awkward commitment is that cryptic species that look identical but do not interbreed are the same species. A fifth branch suggests the defining property is a cluster of co-occurring properties bound by underlying mechanisms, yielding the Homeostatic Property Cluster view, and its most awkward commitment is that the homeostatic mechanism might be disjunctive across the tree of life. A sixth branch proposes there is one general species concept but many operational criteria for applying it, distinguishing theory from practice, and its most awkward commitment is that the theoretical concept is never directly observable in the field.

  The final branch in this monist wing is the position you suspected nobody has defended under a name, which treats the species category as a functional kind whose content is fixed by what conservation law and biodiversity accounting need it to do. For this to be a real position rather than a pun, it must be true that the regulatory framework causally interacts with the biological reality, such that legal protection prevents hybridization and thereby sustains the distinctness it names. Its most awkward commitment is that a population becomes a species because a lawyer filed a petition. As you look over this map, you will notice the combinations my space leaves empty, such as the conjunction of Individuality and Pluralism, which I diagnose as incoherent because particulars cannot be defined by multiple competing concepts simultaneously. You will also see that the instrument cannot separate the Biological Species Concept leaf from the Homeostatic Property Cluster leaf in cases where gene flow is the homeostatic mechanism, so I flag those as overlapping leaves where the distinction is merely terminological. There is also the empty combination of Eliminativism and Monism, which is incoherent because one cannot be a monist about nothing, and the combination of Individuality and Functional Kindhood, which is simply unexplored because it requires particulars to be defined by normative roles. This taxonomy should allow your students to answer the questions and find their position without memorizing the labels, though they may find the awkward commitments reason enough to move to another branch.
