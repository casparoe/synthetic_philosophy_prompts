      *   **User's Goal:** Needs to argue with his uncle at Thanksgiving (and presumably understand the manager's rhetoric). He wants a breakdown of the *precise claims* hidden in that slogan.
      *   **Specific Requirements:**
          *   Lay out readings from trivial to strong.
          *   Categorize them (platitudes, contentious but defensible, definitely false).
          *   Evaluate whether each reading actually supports the manager's specific arguments (retraining > cash, or don't pay displaced).
          *   Address ambiguities: "work" (activity vs. employment vs. meaning), "meaning" (feeling vs. worth vs. contribution).
          *   Address the automation context (was meaning in the task or the job structure?).
          *   Format: A "menu" for a meeting/argument.
          *   Constraint: No reading lists or citations, just the readings.

  2.  **Deconstruct the Slogan:** "Work is about more than a paycheck."
      *   *Subject:* "Work" (Labor? Employment? Career? Daily grind?)
      *   *Predicate:* "Is about" (Purpose? Function? Psychological effect?)
