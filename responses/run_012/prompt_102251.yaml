  8.  **Final Polish:** Make it look like a "Menu" or "Cheat Sheet" as requested. Use clear headings. Ensure the distinction between the *activity* of working and the *status* of being employed is sharp, as that's the crux of the automation issue. (e.g., Automation removes the activity, but retraining offers a new status).

