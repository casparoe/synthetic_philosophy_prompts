  1. Start by framing the underlying question as "What explanatory work do we want function to do?" rather than "What is function?", establishing that the accounts are tools for different goals before introducing any definitions.
  2. Carry the single concrete case of incipient exaptation, like a neutral bone density variation now accidentally aiding buoyancy, through the whole session because the heart fails to reveal the disagreement since both accounts agree it functions to pump blood.
  3. Head off the "backward versus forward" and "always rivals" misconceptions immediately after defining the accounts by showing how both rely on current causal contributions but disagree on whether history is necessary for attribution.
  4. Deliberately leave out metaphysical debates about teleology and flag them as out of scope to prevent students from conflating semantic criteria with ontological commitments about nature's purposes.
  5. Close by asking whether the buoyancy trait had a function *before* the first differential survival event occurred, forcing them to apply the criteria rather than recite definitions.
