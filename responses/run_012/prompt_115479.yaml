answer: |-
  Your friend has constructed a classic *reductio ad absurdum*. She takes your justification for the Nordic Model, generalizes it into a universal principle, shows that the principle leads to conclusions nobody accepts, and therefore claims the justification is bankrupt.

  It is a very sharp argument. But it does have a break point.

  To keep (3) (The Nordic Model) and (4) (The Asymmetry of Choice) without accepting the absurdity of (7) or the moral exceptionalism of "Sex is Sacred," **you have to break Step (5).**

  Here is where the logic snaps, how to fix it, and what it costs you.

  ### The Break Point: Step (5)

  Step (5) claims: *"In a transaction that is harmful, the side whose participation is unconstrained is the criminal side, and the side whose participation is forced by need gets decriminalized."*

  This is the overreach. This step attempts to turn a specific policy justification into a universal moral law. It assumes that **coercion/need** is the *only* variable that determines criminal liability for the buyer.

  If you accept (5), your friend is right: you must either criminalize the strawberry buyer or admit you're being hypocritical about sex workers.

  ### The Fix: The "Remediability" Distinction

  You can keep (3) and (4) if you modify (5) to include a second condition: **Remediability.**

  The Nordic Model argument isn't just that the seller is coerced by need (Step 4). It is that the market *itself* relies on that coercion in a way that cannot be fixed by regulation, whereas other markets can be.

  *   **Strawberries:** The worker is coerced by need, *but* the harm is contingent. We can (theoretically) fix this with labor laws, unions, minimum wage, and inspections. We punish the *employer* who underpays, not the *consumer* who buys the fruit. The goal is to make the transaction fair, not to eliminate the transaction.
  *   **Kidneys:** The seller is coerced by need. We *do* criminalize the buyer. Why? Because we believe a market in organs is inherently exploitative and cannot be regulated safely. The goal is to eliminate the transaction.
  *   **Sex (Nordic View):** The seller is coerced by need. The Nordic proponent argues that, like kidneys, this market cannot be made "safe" or "fair" through regulation (citing stigma, trafficking risks, psychological harm). Therefore, like kidneys, the goal is to eliminate the transaction by targeting demand.

  So, the revised principle isn't (5). It is **(5*):**

  > **(5*)** In a transaction where one side is coerced by need, the buyer is criminally liable **IF** the market structure prevents the coercion from being remediated through labor regulation, making the harm inherent to the transaction rather than contingent.

  ### Why This Saves You From "Sex is Special"

  You mentioned you want to avoid asserting that "sex is special." Usually, that means avoiding *moral* exceptionalism (i.e., "sex is sacred/sinful").

  The fix above allows you to argue for **structural exceptionalism** without moralizing.

  You aren't saying sex is morally different from strawberries. You are saying the **sex market** is empirically different from the **agricultural market**.
  *   Agriculture can be inspected; sex work is clandestine.
  *   Agriculture can be unionized; sex work is stigmatized and isolated.
  *   Therefore, labor laws work for strawberries but fail for sex work.

  This moves the debate from philosophy ("Is buying sex wrong?") to empirics ("Can sex work be regulated safely?"). It allows you to keep (4) (he has a choice, she doesn't) as the moral engine, but limits its application to markets where regulation fails to protect the vulnerable.

  ### The Cost: What You Give Up

  Giving up (5) for (5*) comes with two specific costs. You need to be aware of them.

  **1. You lose the "Tidy Universal Principle."**
  Your friend's argument was elegant because it relied on a single variable: *constraint*. By introducing *remediability*, your argument becomes messier. You now have to argue about the empirical capacity of the state to regulate different industries. You can no longer say, "It's always wrong to buy from the desperate." You have to say, "It's wrong to buy from the desperate *when we lack the tools to protect them*."

  **2. You concede the Kidney Point (which actually helps you).**
  Your friend says in (8): *"I don't believe it, nobody believes it."* regarding criminalizing buyers of exploited goods.
  **This is factually false.** Nobody buys strawberries from slaves (legally), but **nobody buys kidneys, period.** Organ markets are illegal for buyers almost everywhere, including New Zealand and Germany.
  By accepting (5*), you admit that the Nordic Model treats sex work more like organ donation than like agriculture.
  *   **The Cost:** You have to defend the claim that sex work is more like organ selling than like massage therapy or acting. Opponents will say this is paternalistic. You have to be willing to argue that the *harm* in sex work is intrinsic enough to warrant market abolition, not just regulation.

  ### Summary of the Move

  Tell your friend this:

  1.  **Step (5) is false.** We *do* criminalize buyers in some cases of extreme coercion (organ trafficking, child labor, forced labor goods). So (8) is wrong; we *do* believe it sometimes.
  2.  **The dividing line isn't "Sex," it's "Regulatability."** We don't criminalize strawberry buyers because we have other tools (labor law) to fix the seller's constraint. We *do* criminalize kidney buyers because labor law can't fix organ selling.
  3.  **The Nordic Model rests on the claim** that sex work is structurally more like kidney selling than strawberry picking (due to trafficking, stigma, and enforcement difficulty).
  4.  **Therefore:** You can keep (3) and (4). You don't need to say sex is morally unique. You just need to argue that the **sex market is uniquely resistant to safety regulations.**

  This forces the debate onto the ground where it belongs: not on abstract principles of coercion, but on the empirical reality of whether regulation (New Zealand model) actually protects workers, or whether demand reduction (Nordic model) is the only viable safety mechanism.

  You keep your conclusion. You keep your moral intuition about choice. You just lose the slogan.
