      *   *Soft Spot:* Maimonides distinguishes between the *general end* of the law (welfare of soul/body) and the *particulars* of the law. Sacrifice falls under particulars often being determined by historical context. The user needs to be careful not to say the *entirety* of sacrifice is a concession, but rather the *specific form* mandated to wean them off idolatry.

