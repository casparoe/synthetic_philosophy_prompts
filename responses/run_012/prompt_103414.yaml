      *   *Scholarly debate:* Some say Maimonides thinks sacrifices will *not* return (based on his reading of "I did not speak... concerning burnt offerings" in Jeremiah). Others say he holds the halakhic view they will.
      *   *Advice to User:* Don't gloss over this. If you argue they are purely historical concessions, you must explain why they return. Either (a) Human nature is healed, so the concession becomes a choice, or (b) The Law is eternal regardless of the reason. Option (b) is safer for a paper on the *Guide*.

