answer: |-
  You have put your finger on one of the most open secrets in theoretical computer science. The tension you describe—between the asymptotic definition of efficiency (polynomial time) and the concrete reality of computation (constants and specific input sizes)—is well-known to practitioners, yet the convention persists.

  To answer your question directly: The convention does **not** presuppose that there is a sharp, metaphysical line in nature between tractable and intractable. Nor does it claim that $n^{1000}$ is actually feasible. Instead, it presupposes a set of methodological and structural claims about how we *study* computation.

  Here is a breakdown of what the convention quietly assumes, the ontological status it assigns to "tractability," and what would happen if you rejected it.

  ### 1. What the Convention Quietly Assumes

  The definition of "efficient" as "polynomial time" (often called **Cobham's Thesis**) relies on four hidden pillars. If these pillars collapse, the definition loses its utility.

  **A. The Assumption of Robustness (Machine Independence)**
  The strongest argument for polynomials is not that they are fast, but that they are *stable*. If you change the underlying model of computation (e.g., from a single-tape Turing machine to a multi-tape machine, or to a random-access RAM model), the class of problems solvable in polynomial time remains the same ($P$).
  *   **The Presupposition:** We assume that "efficiency" should not depend on the specific architecture of the computer. An exponential algorithm might shift from $2^n$ to $1.5^n$ depending on the machine, but it stays exponential. A polynomial stays polynomial. The convention assumes we are classifying problems, not machines.

  **B. The Assumption of Closure (Modularity)**
  This is the practical engine of the convention. If you run a polynomial-time algorithm, and then feed its output into another polynomial-time algorithm, the total time is still polynomial. If you compose exponential algorithms, the time explodes ($2^n \times 2^n = 2^{2n}$, which is still exponential, but nesting them can lead to $2^{2^n}$).
  *   **The Presupposition:** We assume algorithms are building blocks. We want a definition of "feasible" that allows us to combine feasible parts without accidentally creating an infeasible whole. Polynomials are the largest class of functions known to be closed under addition, multiplication, and composition.

  **C. The Assumption of Asymptotic Dominance**
  You are correct that for any *fixed* input size we can currently generate, $1.0001^n$ beats $n^{1000}$. However, the convention assumes we care about **scaling**, not just current capacity.
  *   **The Presupposition:** We assume that hardware improvements are transient, but growth rates are permanent. Moore's Law might make $n=50$ solvable today, but if the algorithm is exponential, $n=100$ will remain forever out of reach regardless of hardware speedups. If it is polynomial, hardware improvements push the horizon of solvability outward significantly. The convention assumes we are interested in the *limit behavior* as a proxy for scalability.

  **D. The "Empirical Conspiracy"**
  This is the most fragile assumption. In theory, $n^{1000}$ is in $P$. In practice, no natural problem known to be in $P$ has an exponent anywhere near that high. Usually, if a problem is in $P$, we eventually find an algorithm with a small exponent (like $n^2$ or $n^3$).
  *   **The Presupposition:** We assume that the mathematical class $P$ correlates with "practically solvable" because nature (or human problem-formulation) does not tend to produce high-degree polynomials without also admitting lower-degree solutions. This is an empirical observation, not a logical truth, but the convention bets on it holding.

  ### 2. Ontology: Is Tractability Real or Relative?

  You ask if this commits users to a real division in nature or a property of the problem itself.

  **It is a property of the problem, relative to a physical thesis.**
  Complexity theory aims to treat tractability as an **intrinsic property of the problem** (e.g., "Sorting is easy," "Traveling Salesman is hard"). However, this only holds if one accepts the **Extended Church-Turing Thesis**. This thesis states that any reasonable physical model of computation can be simulated by a probabilistic Turing machine with at most polynomial overhead.

  If the Extended Church-Turing Thesis is true, then $P$ is a physical invariant. If false (e.g., if quantum computers or some hyper-computation model can solve NP problems in polynomial time), then "tractability" is relative to the physics of our universe, not just the logic of the problem.

  **It is not a sharp line in nature.**
  Practitioners do not believe there is a magical cliff where $n^{100}$ works and $n^{100} + 1$ breaks. They view the polynomial/exponential distinction as a **topological distinction**. It separates functions that curve "upward" from those that curve "inward." It is a qualitative distinction used to map the landscape, not a quantitative claim about specific runtimes.

  ### 3. If You Rejected the Picture: What Breaks and What Survives?

  Suppose you adopt the view you suggested: that feasibility is irreducibly about concrete resources at concrete sizes (e.g., "Can I solve $n=10,000$ in 1 hour on a 2024 laptop?"). This is often called **Concrete Complexity** or **Fine-Grained Complexity**.

  **What Would Have to Change (The Casualties):**

  1.  **NP-Completeness Theory:** This is the biggest casualty. The entire theory of NP-completeness relies on polynomial-time reductions. If I reduce Problem A to Problem B, I guarantee that if B is polynomial, A is polynomial. I do *not* guarantee that if B takes 1 second, A takes 1 second. The reduction itself adds overhead. If you care about concrete times, reductions become much less useful because the constant factors in the reduction matter as much as the algorithm itself.
  2.  **The Concept of "Intractable":** You could no longer say a problem is "intractable." You could only say it is "unsolved at size N." This loses the predictive power of the theory. You couldn't warn a student, "Don't try to solve this exactly for large inputs," because you couldn't prove it's impossible, only that current algorithms fail.
  3.  **Cryptography:** Modern crypto relies heavily on asymptotic security (e.g., "breaking this requires super-polynomial time"). If you reject asymptotics, security proofs become much harder. You would have to prove, "Breaking this key size requires $2^{128}$ operations," without relying on the asymptotic hardness of the underlying problem. (Note: Practical crypto already does this, but the theory underpinning it is asymptotic).

  **What Would Survive (The Resilient Parts):**

  1.  **Algorithm Engineering:** Most people who actually write code already reject the strict asymptotic picture. They care about cache locality, constant factors, and average-case performance. This practice would remain untouched because it never relied on the philosophical picture in the first place.
  2.  **Parameterized Complexity:** This field already bridges the gap. It asks, "Is the exponential part confined to a specific parameter $k$?" (e.g., $O(2^k \cdot n)$). This acknowledges that for small $k$, exponential is fine. This field would become the *primary* field, rather than a sub-specialty.
  3.  **Heuristics and Approximation:** The study of approximation algorithms (getting "close enough" in polynomial time) would survive, but the guarantees would shift from asymptotic ratios to concrete error bounds on specific input distributions.

  ### Summary

  The convention presupposes that **structural stability is more valuable than concrete accuracy.**

  It assumes we are building a **taxonomy of problems**, not a **calculator of runtimes**. By drawing the line at polynomials, theorists sacrifice the ability to predict the runtime of specific instances (where $n^{1000}$ is bad) in exchange for the ability to make robust claims about the *nature* of the problem (that it scales reasonably).

  If you reject this, you do not break computer science, but you do break **Complexity Theory** as it currently exists. You would move from a field that asks "What is computable in principle as size goes to infinity?" to a field that asks "What is computable in practice with current physics?" The latter is arguably more honest, but it lacks the mathematical elegance and universal generalizations that make the former a powerful tool for reasoning about computation itself.

  The convention is not a claim about the world; it is a claim about **what kind of questions we want to be able to ask.**
