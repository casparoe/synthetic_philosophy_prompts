answer: |-
  # Joint Statement on Natural Kinds and Scientific Partitioning

  **Signed:** [The Monist] & [The Pluralist]
  **Date:** October 26, 2023
  **Commissioned by:** *The Journal of Philosophical Inquiry*

  ## I. Shared Substantive Claims

  We agree that the metaphor of "carving nature at its joints" is useful only if anchored to specific criteria. We endorse the following claims to frame our disagreement. Each claim is intended to rule out simplifications we have previously tempted ourselves to make.

  1.  **The Projectibility Requirement:** A partition counts as candidate "joint-carving" only if its categories support inductive inferences and counterfactuals beyond the observed sample. We reject the view that mere similarity or linguistic convenience suffices for natural kindhood.
  2.  **The Privilege Condition:** For a partition to be *privileged* (in the Monist's sense), it must demonstrate robustness not merely across current instruments, but across conceivable changes in the scale of observation and the theoretical framework used to describe the entities. We reject the claim that current predictive success alone guarantees privilege.
  3.  **The Success Limitation:** The predictive success of a special science (e.g., biology, economics) demonstrates that its categories track *some* stable structure in the world, but it does not, by itself, demonstrate that those categories are identical to the categories of fundamental physics. We reject the reductionist claim that special science success is illusory if not reducible, and we reject the autonomist claim that special science success proves independence from physical constraints.
  4.  **The Convergence Criterion:** Evidence for convergence on a single partition requires the elimination of alternative partitions that retain equal predictive power without increasing complexity. We agree that the persistence of incompatible but empirically equivalent schemes counts as evidence *against* the existence of a single privileged partition.

  ## II. Table of Remaining Disagreements

  | Question | The Monist's Formulation | The Pluralist's Formulation | Note on Verbal Dispute |
  | :--- | :--- | :--- | :--- |
  | **1. Uniqueness** | There exists exactly one partition of the world that maximizes explanatory power and stability across all possible contexts of inquiry. | There may be multiple partitions that maximize explanatory power and stability, relative to distinct contexts of inquiry, with no fact of the matter regarding which is "the" partition. | **Substantive.** This is not merely about the word "partition," but about whether reality dictates a single optimal grid or permits multiple optimal grids. |
  | **2. Mind-Independence** | A kind is natural only if its boundaries and membership conditions would remain identical even if no cognitive agents existed to classify them. | A kind is natural if it supports stable inference within a practice; the interests that generate the practice are part of the world, so "mind-independence" is an incoherent ideal for special sciences. | **Partially Verbal.** We disagree on the definition of "mind-independent," but also on whether human interests contaminate or constitute natural structure. |
  | **3. Incompatibility** | If two partitions are genuinely incompatible (assign the same entity to mutually exclusive kinds), at most one can be carving at the joints; the other must be merely instrumental. | If two partitions are genuinely incompatible but both license successful intervention and prediction, both carve at the joints relative to their respective aims. | **Substantive.** This concerns the law of non-contradiction applied to ontology versus applied to utility. |

  ## III. The Cruxes

  We identify three sub-questions such that settling one would compel at least one of us to revise our position.

  1.  **The Fundamental Veto:** Does a well-confirmed fundamental physical theory have the authority to declare a higher-level kind "unreal" if the physical theory describes that kind as an artifact of observer constraints?
  2.  **The Possibility of Dual Optima:** Is it metaphysically possible for a domain to admit two partitions that are equally projectible and stable, yet mutually incompatible, with no deeper theory unifying them?
  3.  **The Looping Threshold:** If the existence of a kind depends on humans classifying it (a "looping kind"), does that dependency automatically disqualify it from being a natural joint, or does the stability of the loop constitute a different species of joint?

  ## IV. Analysis of Stipulated Cases

  We have agreed to test our positions against four coherent, non-historical cases. Below we record our predictions and assess the discriminatory power of each case.

  ### Case (i): The Scale-Relative Artifact
  *A classification is perfectly projectible and stable for every instrument and organism we could build, but a well-confirmed physical theory describes it as an artifact of the size-scale at which observers like us must operate.*

  *   **Monist Prediction:** **Does not carve at the joints.**
      *   *Reasoning:* If fundamental physics identifies the category as an artifact of our specific scale/observer constraints, it fails the Mind-Independence condition (Shared Claim 2). It is a joint in our *interface* with nature, not in nature itself.
  *   **Pluralist Prediction:** **Carves at the joints (Pluralist sense).**
      *   *Reasoning:* Stability across all *possible* instruments for agents like us is the only operational meaning of "joint" we can access. To demand a view from nowhere is to demand no science at all.
  *   **Discriminatory Power:** **High.** This case directly targets the Fundamental Veto crux. If the Monist is right, special science ontology is always provisional on physics. If the Pluralist is right, physics is just another practice with its own scale limits.

  ### Case (ii): The Dual Optima
  *A domain admits two partitions, each licensing more successful predictions than any partition other than itself and the other, neither outperforming the other.*

  *   **Monist Prediction:** **At most one carves at the joints.**
      *   *Reasoning:* Empirical equivalence is temporary. There must be a deeper structural reason why one partition aligns with causal powers and the other does not, even if we cannot yet detect it. To accept both is to abandon realism for instrumentalism.
  *   **Pluralist Prediction:** **Both carve at the joints.**
      *   *Reasoning:* This is the definition of legitimate pluralism. Different partitions answer different questions. The lack of a "winner" indicates that nature supports multiple structures, not that we lack data.
  *   **Discriminatory Power:** **High.** This targets the Possibility of Dual Optima crux. It forces the Monist to posit hidden depth (risking unfalsifiability) and the Pluralist to accept genuine ontological ambiguity.

  ### Case (iii): The Looping Social Kind
  *A social kind whose extension is caused in part by the classification itself, so that its boundaries track the classifier's interests.*

  *   **Monist Prediction:** **Does not carve at the joints.**
      *   *Reasoning:* The boundaries are mind-dependent by definition (Shared Claim 2). The stability is sociological, not natural. It is a feedback loop, not a discovery of structure.
  *   **Pluralist Prediction:** **Carves at the joints.**
      *   *Reasoning:* The feedback loop *is* the mechanism. The stability of the prediction (that classifying people changes them in predictable ways) satisfies the Projectibility Requirement (Shared Claim 1). Interests are part of the causal fabric.
  *   **Discriminatory Power:** **High.** This targets the Looping Threshold crux. It tests whether "nature" includes human social dynamics or stands apart from them.

  ### Case (iv): The Extinct Statistical Kind
  *A kind whose members are all extinct and whose characteristic mechanism is unrecoverable, leaving only statistical traces.*

  *   **Monist Prediction:** **Carves at the joints.**
      *   *Reasoning:* The kind existed mind-independently in the past. The loss of the mechanism does not erase the historical reality of the partition.
  *   **Pluralist Prediction:** **Carves at the joints.**
      *   *Reasoning:* The statistical traces support projectibility for current historical inquiry. The partition is legitimate relative to the practice of paleontology/history.
  *   **Discriminatory Power:** **None.**
      *   *Reasoning:* Both parties agree this is a valid natural kind. They disagree on *why* (past mind-independence vs. current projectibility relative to practice), but this difference yields no divergent prediction about the status of the kind itself. We record this plainly: Case (iv) fails to discriminate between our views.

  ## V. Conditions for Revision

  We close by specifying what would change our minds, acknowledging that neither of us currently expects these conditions to be met.

  **The Monist** would move toward Pluralism if:
  It were demonstrated that Case (ii) (Dual Optima) is not merely epistemically possible but metaphysically necessary—that is, if it were shown that no deeper unifying theory *could* exist, even in principle, to resolve the incompatibility between two equally successful schemes.

  **The Pluralist** would move toward Monism if:
  It were demonstrated that Case (i) (Scale-Relative Artifact) is unavoidable for all special sciences—that is, if it were shown that every stable classification we make is ultimately an artifact of our cognitive or physical scale, implying that a single, scale-invariant partition exists "below" or "above" us that renders our current categories merely approximate.

  ***

  *We sign this statement not as a resolution, but as a map of the territory we continue to share.*
