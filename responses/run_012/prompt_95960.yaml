  **(Self-Correction during drafting):** I need to be careful not to imply LD judges *never* care about truth. Many do ("Truth over Tech"). But the *mechanism* is different. In LD, truth is accessed through evidence comparison. In AI Debate, truth is accessed through adversarial pressure. I need to highlight that LD assumes the judge *evaluates* the claim, whereas AI Debate assumes the judge *cannot evaluate* the claim directly, only the *process*.

  Let's structure the response:
  1.  **Translation:** The AI Safety Proposal as an LD Round.
