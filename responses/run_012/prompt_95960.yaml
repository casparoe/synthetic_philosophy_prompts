  *Wait, one nuance:* In AI Debate, the goal is *training*. In LD, the goal is *decision*. I need to make sure this distinction is clear in the "Distortion" section. The AI "ballot" changes the AI's future behavior. The LD ballot ends the round.

  *Another nuance:* The AI proposal relies on "honesty is easier." In LD, we call this "presumption" or "ground." I should use those terms.

  *Obfuscation:* In LD, if I spread, you run theory. In AI Debate, if the AI obfuscates, the system fails. There's no "theory shell" to stop the AI from lying if the judge can't see it. This is a key difference.

