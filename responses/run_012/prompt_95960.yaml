prompt: |-
  I am a high school student who competes in Lincoln-Douglas debate, and I am trying to understand a proposal in AI safety that is sometimes called debate. I know the vocabulary of competitive Lincoln-Douglas well: value and criterion, resolutional analysis, burdens of proof and rejoinder, framework, standards, contention-level analysis, cross-examination, evidence ethics, judge adaptation, topicality, theory shells, and the difference between a tabula rasa judge and an intervening judge. I do not know the AI safety literature well, so please do not assume that I have read it.

  Here is the proposal as I understand it. We want to train two AI systems to debate a claim that the judge cannot directly verify. The judge is a weaker AI with less compute and less knowledge than the debaters. The debaters take opposite sides. The proposal is sometimes motivated by the thought that the truthful side has an advantage because it can answer any question consistently, while the dishonest side must keep a story straight. The hope is that if one side is telling the truth and the other is not, the truthful side can win by exposing the other side's errors in cross-examination, even though the judge cannot independently check the claim. The worry is that the dishonest side can win by obfuscation: it can produce an argument that is too complex or too technical for the judge to evaluate, and the truthful side cannot refute it without making its own answer equally complex and therefore equally unhelpful to the judge. For example, the claim might be a mathematical one, and the dishonest side might offer a proof that is subtly invalid or simply too long for the judge to check. In that case, the debate format may reward the better obfuscator rather than the truth-teller.

  Please restate this proposal, as faithfully as you can, in the vocabulary of competitive Lincoln-Douglas debate. I want the translation to be systematic: map the AI debaters onto the affirmative and negative, the weaker AI judge onto the human judge, the unverifiable claim onto the resolution, the possibility of obfuscation onto the strategic use of evidence, speed, technicality, or theory, and the hope that truth wins onto whatever Lincoln-Douglas assumes about how good judging and good burdens lead to a correct decision. Note that Lincoln-Douglas resolutions are usually normative, while the AI debate claim is usually a factual one with a definite answer that is merely hard to check; say what that difference does to the translation. Then give me the residue report. Which parts of the AI safety proposal translate cleanly into Lincoln-Douglas terms? Which parts translate only with distortion? Which parts have no counterpart at all? I am especially interested in whether Lincoln-Douglas has any real analogue of a judge who is systematically unable to verify the central factual claim, whether the notion of truth-tracking is present in Lincoln-Douglas or whether it only cares about persuasion and burden satisfaction, and whether the problem of obfuscation looks like a judge problem, a burden problem, an evidence-ethics problem, or something else. Finally, tell me whether the residue is a defect of the Lincoln-Douglas vocabulary or a sign that the AI debate proposal is less clear than it first appears.
