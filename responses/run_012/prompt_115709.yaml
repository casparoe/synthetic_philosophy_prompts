answer: |-
  The current arrangement of American employment law presupposes a conception of **negative liberty**, specifically filtered through a **freedom of contract** framework. In this view, freedom is defined as the absence of direct, physical, or legal interference with an individual's choices. Coercion is understood narrowly: it exists only when a specific agent actively threatens harm to compel action. Structural pressures—such as the need for income to survive, or the reliance on an employer for health insurance or visa status—are viewed as background circumstances, not coercive constraints.

  Under this implicit view, the state's role is to enforce voluntary agreements and protect property rights, not to equalize power between parties. The employer's power to fire is an exercise of their property right to disassociate; the employee's acceptance of a non-compete is an exercise of their contractual autonomy. The state enforces the non-compete not as an act of domination, but as the neutral upholding of a promise previously made. Thus, liberty is preserved so long as the state does not initiate force, and private power is legitimate so long as it originates in consent.

  ### Required vs. Fitting
  This conception of freedom **strictly requires** that the state refrain from mandating long-term employment (specific performance of labor), as that would constitute involuntary servitude under the Thirteenth Amendment and a violation of negative liberty. It also requires that the state enforce contracts as written, assuming the signing was free of immediate duress.

  However, much of the practice merely **fits** this view rather than being required by it. For instance, negative liberty does not strictly demand that non-compete clauses be enforceable by injunction; one could argue that restricting a worker's future trade is itself an interference with liberty that outweighs the employer's contract rights. Similarly, the tying of health insurance and immigration status to employment fits a market-based, private-welfare model, but a negative-liberty state could provide these universally without violating its core principles. The asymmetry—where the employer can quit without penalty but the employee faces injunctions for doing so—is not a logical necessity of negative liberty, but a policy choice prioritizing capital mobility over labor mobility.

  ### Internal Consistency and Dual Conceptions
  The practice is **internally consistent only if one accepts a hierarchy of rights** where property interests trump labor interests. It does not necessarily require two different conceptions of freedom, but it does require a dual standard of **state intervention**. The state intervenes aggressively to protect the employer's interest (via injunctions and arbitration enforcement) but remains hands-off regarding the employee's security (at-will firing).

  Critics would argue this reveals a split: the employee is treated as a "free agent" when it comes to bearing risk (at-will firing), but as a "bound subject" when it comes to restricting exit (non-competes). To make this hang together, the law relies on a fiction of **equality of bargaining power**. It assumes the worker consented to the non-compete with the same freedom the employer exercises in firing. If one acknowledges the power imbalance, the system appears to use one conception of freedom (autonomy) to shield the employer from liability, and another (obligation) to bind the worker.

  ### Underdetermination
  The current rules are **underdetermined** because other conceptions of freedom could license similar outcomes. For example, a **utilitarian** framework might support arbitration and non-competes not because they are "free," but because they reduce litigation costs and encourage investment in training. Conversely, a **libertarian** conception of negative liberty might actually reject non-competes entirely as restraints of trade that interfere with a worker's right to sell their labor. The fact that the law enforces them suggests the prevailing view is not pure negative liberty, but a hybrid that privileges corporate stability alongside individual contract rights.

  ### The Rival View: Freedom as Non-Domination
  If we adopt the republican conception of **freedom as non-domination**, where freedom is the absence of subjection to another's arbitrary, unchecked power, the current legal landscape collapses. On this view, dependence itself is unfreedom, regardless of whether the power is exercised.

  1.  **At-Will Employment:** This would likely be abolished or severely curtailed. The employer's unchecked power to fire without cause constitutes domination. The law would need to require "just cause" for termination to ensure the worker is not subject to the employer's arbitrary will.
  2.  **Non-Competes:** These would almost certainly be voided. They increase domination by limiting the worker's exit options, making them more vulnerable to the employer's whims. Freedom as non-domination requires robust exit rights.
  3.  **Arbitration Clauses:** These would likely be prohibited in employment contracts. By removing access to public courts, they strip workers of a neutral arbiter, leaving them subject to the employer's preferred dispute resolution process, which reinforces power asymmetry.
  4.  **Tying of Benefits:** This is the most glaring violation of non-domination. Tying health insurance or visa status to a specific employer gives the employer life-or-death power over the worker. To survive on this view, health care must be decoupled from employment (e.g., universal coverage), and immigration status must be portable, belonging to the worker rather than the sponsor.

  Under the non-domination view, the only part of current practice that survives is the basic prohibition on physical force or fraud. The rest of the architecture would need to be rebuilt to insulate workers from arbitrary private power, transforming employment from a relationship of subordination into one of civic equality.
