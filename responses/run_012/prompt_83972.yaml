  5.  **Drafting the Desiderata (incorporating the cases):**

      *   *Structure:* Case -> Intuition/Constraint -> Negotiability.
      *   *Drip:* Requires handling discontinuity. Non-negotiable for TLNU.
      *   *Ratchet:* Requires limiting aggregation of mild pain. Negotiable (some accept aggregation).
      *   *Two Scales:* Requires defining the metric. Non-negotiable (must define 'suffering').
      *   *Partition:* Requires temporal ontology. Negotiable (moment vs. episode).
      *   *Hollow Trade:* Requires separating prudence and morality. Negotiable.
      *   *Thin End:* Requires decision theory under risk. Non-negotiable (must handle probability).
      *   *Empty Option:* Requires axiology of existence. Non-negotiable (must rank worlds).

  6.  **Addressing Formal Constraints:**

      *   Transitivity: Keep.
      *   Completeness: Keep.
      *   Impartiality: Keep.
