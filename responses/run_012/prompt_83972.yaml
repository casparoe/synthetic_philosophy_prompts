answer: |-
  ### Specification for Threshold Lexical Negative Utilitarianism (TLNU)

  To constitute a viable specification, TLNU must satisfy the following desiderata. Each is annotated with the philosophical consideration motivating it, and a verdict on whether it is constitutive of the view (Non-Negotiable) or a matter of theoretical preference (Negotiable).

  #### 1. The Cases

  **The Drip**
  *   **Scenario:** An episode of suffering is lowered by a hair from just above the threshold to just below it, while unbounded pleasure is available as a counterweight.
  *   **Consideration:** Tests the stability of the lexical discontinuity. If the threshold is sharp, a microscopic phenomenological change flips the moral status from "infinite disvalue (relative to pleasure)" to "finite disvalue."
  *   **Verdict:** **Non-Negotiable.** The theory must explain why the moral discontinuity does not render the threshold metaphysically arbitrary. It must either deny the phenomenological continuity of suffering at that point or accept the "cliff-edge" implication.

  **The Ratchet**
  *   **Scenario:** Everyone in a large population gains one more minute of mild discomfort, all well below the threshold, so that no episode ever crosses it.
  *   **Consideration:** Tests aggregation. Since sub-threshold suffering is commensurable with pleasure, does it aggregate to outweigh supra-threshold suffering? If yes, lexicality is undermined. If no, a second lexical barrier exists between sub- and supra-threshold suffering.
  *   **Verdict:** **Non-Negotiable.** The theory must specify whether sub-threshold suffering aggregates lexically against supra-threshold suffering. (Standard TLNU implies it does not, preserving the priority of the severe sufferer).

  **The Two Scales**
  *   **Scenario:** A single episode scores high on sensory intensity but low on unpleasantness (e.g., intense but masochistically welcomed sensation), or vice versa.
  *   **Consideration:** Tests the metric of the threshold. Is the threshold defined by neural firing rates (intensity) or affective valence (unpleasantness)?
  *   **Verdict:** **Non-Negotiable.** The threshold must be fixed on the morally relevant dimension (unpleasantness/suffering proper), not sensory input. A theory that thresholds intensity fails to capture the negative utilitarian concern.

  **The Partition**
  *   **Scenario:** The same total quantity of suffering, delivered as one continuous episode or many brief ones; steady moderate intensity or intermittent severe spikes of equal area under the curve.
  *   **Consideration:** Tests the temporal ontology of the threshold. Does the threshold apply to instantaneous experiences, or integrated episodes? Spikes might cross the threshold while a steady state does not, despite equal total pain.
  *   **Verdict:** **Negotiable.** The theory may define the threshold over moments (favoring the spike as worse) or episodes (favoring the continuous as worse if duration matters). However, it must be consistent.

  **The Hollow Trade**
  *   **Scenario:** One person accepts a small pain now for a large pleasure later and reports no regret, while the impartial planner must still rank the two lives.
  *   **Consideration:** Tests the conflict between prudential rationality and moral impartiality. If the pain is below threshold, the agent may trade it. If the planner is TLNU, they agree. If the pain is above, the agent is "irrational" morally, even if prudentially satisfied.
  *   **Verdict:** **Negotiable.** The theory may allow a divergence between the "good for" the agent and the "good" simpliciter, provided the moral ranking is clear.

  **The Thin End**
  *   **Scenario:** A one-in-a-billion chance of a lifetime of agony is reduced at the cost of a certain small loss of pleasure for everyone.
  *   **Consideration:** Tests decision theory under risk. Does the lexical disvalue of agony dominate the expected utility calculation even at vanishing probabilities?
  *   **Verdict:** **Non-Negotiable.** The theory must provide a rule for risk. If lexical suffering has infinite negative weight, any non-zero probability dominates finite pleasure losses (lexicographic expected utility).

  **The Empty Option**
  *   **Scenario:** Whether a world containing no sufferers is better than any world containing one, even when the first contains nothing else.
  *   **Consideration:** Tests the zero-point and the value of pleasure. If the single sufferer is below threshold, can their suffering be outweighed by pleasure? If so, a world with pleasure + suffering might beat an empty world.
  *   **Verdict:** **Non-Negotiable.** TLNU must rank these worlds. (Standard TLNU implies: if suffering $\ge$ threshold, Empty is better. If suffering $<$ threshold, Pleasure-World may be better).

  #### 2. Formal Constraints

  The theory should treat the value of an outcome as fixed by the anonymous multiset of experiences it contains, with an ordering that is:

  *   **Transitive:** **Non-Negotiable.** Intransitivity renders the theory action-guiding impossible.
  *   **Complete:** **Non-Negotiable.** The theory must rank any two possible worlds. (This creates tension with *The Drip* if the threshold is vague).
  *   **Impartial:** **Non-Negotiable.** Experiences count equally regardless of identity.
  *   **Weakly Paretian:** **Non-Negotiable.** If everyone is better off, the outcome is better. (TLNU satisfies this provided "better off" is defined by the theory's value function).
  *   **No Discounting (Time/Identity):** **Non-Negotiable.** A unit of suffering counts the same in the future or past, or in another person.
  *   **Continuity:** **Surrendered.** **This must be explicitly surrendered.** A lexical threshold creates a discontinuity in the value function. Small changes in suffering (The Drip) produce infinite changes in relative value.

  #### 3. The Impossibility Results

  There is a triad of requirements that cannot be jointly satisfied. A defender of TLNU must break one link:

  1.  **Phenomenological Continuity:** Suffering varies along a smooth, continuous scale without natural joints (implied by *The Two Scales* and neuroscience).
  2.  **Non-Stipulative Threshold Fixing:** The theory must derive the threshold from the nature of suffering, not posit it arbitrarily (Your core constraint).
  3.  **Sharp Lexicality:** There is a precise point where trade-offs become forbidden (*The Drip*).

  **The Conflict:** If suffering is phenomenologically continuous (1), there is no natural joint to anchor a non-stipulative threshold (2). If you force a sharp lexical line (3) onto a continuous scale without a natural joint, the threshold becomes arbitrary (violating 2). If you insist on a non-arbitrary threshold (2) on a continuous scale (1), you cannot have sharp lexicality (3); you must have a smooth transition (violating TLNU).

  **Which to Surrender?**
  A defender of TLNU must surrender **Phenomenological Continuity** (in the moral sense). They must argue that while sensory intensity is continuous, *suffering-as-unpleasantness* contains a qualitative discontinuity (e.g., the point where suffering destroys the capacity for agency, or the point where it becomes "unbearable" rather than "endurable"). If they cannot establish this qualitative shift, the theory collapses into arbitrariness.

  **The Single Most Restrictive Requirement:**
  **The Non-Stipulative Threshold Fixing.**
  This requirement rules out the standard contenders most effectively. Total Utilitarianism requires no threshold. Classical Negative Utilitarianism treats all suffering as lexically prior (threshold at zero) or tradeable (no threshold). Prioritarianism uses a smooth weighting function. Only TLNU demands a specific, derived discontinuity. This forces the theory out of normative ethics and into meta-ethics or philosophy of mind, requiring a claim about the *ontology* of suffering that most theories avoid.

  #### 4. Performance of Standard Contenders

  **Total Utilitarianism**
  Fails *The Drip* and *The Empty Option* decisively; it possesses no threshold, meaning any quantity of pleasure can outweigh any severity of suffering, contradicting the core TLNU intuition that some suffering is absolute.

  **Classical Negative Utilitarianism**
  Fails *The Hollow Trade* and *The Ratchet* (in its strong form); by treating all suffering as lexically prior to pleasure, it forbids all trade-offs, making life impossible. If it allows trade-offs for mild pain, it becomes TLNU but lacks the resources to fix the threshold non-stipulatively.

  **Critical-Level Prioritarianism**
  Fails *The Drip*; it employs a continuous weighting function where higher suffering counts for more, but never lexically trumps pleasure. It dissolves the cliff-edge but thereby fails to capture the absolute prohibition required by the target specification.

  **Incommensurability or Parity View**
  Fails *Completeness* and *The Thin End*; by claiming severe suffering and large pleasures are incomparable rather than lexically ordered, it cannot generate a decisive ranking for the impartial planner or handle probabilistic trade-offs without violating expected utility norms.
