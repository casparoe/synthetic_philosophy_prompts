prompt: |-
  You're an AI-safety researcher who's actually thought hard about HCH and factored cognition, and I want a careful conceptual explanation, not a survey — no citations, no reading list, I can't look anything up. Here's the setup I mean: HCH is the idealized agent you get when a human can ask arbitrary questions of other humans, each of whom can in turn consult HCH, with some budget; factored cognition is the idea that a big task can be split into smaller subquestions answered by limited, non-omniscient agents. My question: in what sense is this an idealization of deliberation, rather than just a recusive bureaucracy or divide-and-conquer with extra steps? Start by brainstorming the different things 'deliberation' could mean here, then give me your best account of what the HCH construction actually idealizes, what it assumes away (memory, trust, incentives, the base case), and where the analogy to a single deliberator breaks. Then take one twist: suppose the base humans are allowed to be lazy or strategically dishonest, and suppose the factoring is chosen by an adversary rather than a benevolent designer — does HCH still deserve to be called an idealization of deliberation, or does it become a different kind of object? Be explicit about which parts of this are settled among people who know the topic and which are genuinely contested, and don't dress up a contested reading as the consensus.
