  ### Committee Note on Unwelcome Verdicts

  **Unwelcome Verdict:** Case 2 (Allied governments and the 1919 settlement and blockade).

  **Reason:** This verdict is likely to be unwelcome to the committee, particularly the teacher and the lay member representing the publisher's primary market (likely Allied nations). Secondary school histories often rely on a clear moral distinction between the aggressors of the First World War and the victors who established the subsequent order. Admitting that the Allied governments bear *causal responsibility* for post-armistice famine and that the peace terms carried *diplomatic liability* complicates the narrative of a "just victory." It requires teaching students that victors can commit acts resulting in humanitarian suffering without necessarily having "criminal intent," a nuance that is difficult to convey in upper-secondary classrooms and may invite diplomatic complaint from partner nations. However, the procedure forces this verdict because the counterfactual test (Step 2) confirms the blockade caused the suffering, and the Value Check (Step 7) escalates the moral judgment to the Board, leaving the causal fact intact.
