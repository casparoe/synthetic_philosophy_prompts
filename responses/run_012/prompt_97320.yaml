answer: |-
  ### Limitations of the Procedure

  This procedure is designed to standardize reasoning, not to generate absolute truth. It cannot:
  1.  **Resolve metaphysical disputes:** It cannot determine if free will exists or if historical determinism is true; it operates on the practical assumption that agents make choices.
  2.  **Replace legal adjudication:** It does not establish legal guilt under international law, only historical attribution for educational purposes.
  3.  **Eliminate value judgments:** It identifies where values enter the reasoning but cannot neutralize them; those points must be escalated.
  4.  **Heal diplomatic wounds:** A historically supported verdict may still cause diplomatic complaint; the procedure ensures the reasoning is robust, not that the conclusion is painless.

  ### Decision Procedure for Attributing Historical Responsibility

  | Step | Question to ask | What counts as a sufficient answer | What to do if the answer is insufficient | Who signs off |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Event Definition:** Is the specific outcome (war, treaty, atrocity) defined with enough precision to test causality? | A statement of *what* happened, *when*, and *where*, distinct from *why* it happened. | Refine the chapter scope. Do not proceed to responsibility until the event is fixed. | Lead Historian |
  | **2** | **Causal Contribution:** Did the named actor's actions make a difference to the outcome? (Counterfactual Test) | Evidence that if the actor had chosen differently, the outcome would likely have been avoided or significantly altered. | If the outcome was overdetermined (would have happened anyway), attribute only "contributory" not "chief" causality. If evidence is missing, halt. | Both Historians |
  | **3** | **Agency:** Did the actor have the capacity to decide? (People vs. State) | Proof that the entity is a decision-making body (government, command) or, if a "people," proof of widespread complicity or democratic authorization. | If attributing to a "people," restrict attribution to political continuity, not moral intent. If no agency, assign zero moral responsibility. | Lead Historian + Lay Member |
  | **4** | **Moral Culpability:** Did the actor intend the harm or foresee it as a certain cost of their choice? | Documents, minutes, or public statements showing knowledge of likely consequences and a choice to proceed regardless. | If harm was unforeseeable or unintended side-effect, assign no moral guilt. Mark as "tragic outcome" rather than "crime." | Both Historians |
  | **5** | **Legal/Diplomatic Liability:** Does the action violate the norms or treaties active at the time? | Reference to specific treaties, laws of war, or diplomatic norms acknowledged by the actor at the time. | If norms were ambiguous or non-existent, do not assign legal liability. | Lead Historian |
  | **6** | **Remedial Responsibility:** Who bears the duty to repair or prevent recurrence? | Assessment of who holds the resources and political continuity to address the legacy. | If the original actor no longer exists, assign to the successor state or political community. | Teacher + Lay Member |
  | **7** | **Value Check:** Does the verdict rely on a moral judgment (e.g., "unjust," "punitive") rather than a factual one? | A clear distinction between "this caused suffering" (fact) and "this suffering was immoral" (value). | Escalate the value judgment to the Editorial Board. Do not settle it in committee. | Lay Member (to escalate) |
  | **8** | **Final Verdict:** Can the evidence carry the weight of the claim? | A statement of responsibility that matches the type (causal, moral, legal, remedial) proven in Steps 2–6. | If any step fails, issue an explicit "No Verdict" for that category. Do not manufacture a conclusion. | Committee Chair |

