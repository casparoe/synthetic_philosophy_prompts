  It is a pleasure to assist you in settling this wager. Mira's position is sophisticated, and your bewilderment is entirely understandable; she is navigating a path between crude realism and strict instrumentalism that requires a very fine-grained taxonomy of idealisation. She is not merely applying Friedman's 'as-if' methodology indiscriminately, nor is she demanding literal truth.

  Here is my analysis of the rule she is running, the inconsistency in her record, and my verdict on the housing bubble case.

  ### 1. Candidate Rules and Elimination

  To reconstruct Mira's reasoning, we must test candidate principles against her specific verdicts.

  *   **Candidate 1: Predictive Accuracy (Strict Instrumentalism).**
      *   *Rule:* An idealisation is legitimate if and only if the model yields accurate predictions.
      *   *Test:* Mira rejected the pension model assuming eternal life, despite conceding it fit the historical data better than rivals.
      *   *Verdict:* **Discarded.** Predictive success is necessary but not sufficient for her.

  *   **Candidate 2: Empirical Realism.**
      *   *Rule:* An idealisation is legitimate only if the assumption is empirically true.
      *   *Test:* She accepted profit maximisation (despite managers satisficing) and point masses (which do not exist).
      *   *Verdict:* **Discarded.** She accepts false assumptions.

  *   **Candidate 3: The Negligibility Principle.**
      *   *Rule:* An assumption is legitimate if the factor neglected is causally negligible for the phenomenon in question.
      *   *Test:* This explains the pendulum (air resistance is negligible in a vacuum) and the trade model (2 goods is a simplification of a continuum). It explains the rejection of the labour supply model (elasticity cannot be negligible if the model studies tax effects on supply).
      *   *Verdict:* **Survives.**

  *   **Candidate 4: Explanatory Consistency (The 'No-Self-Defeat' Rule).**
      *   *Rule:* An assumption is illegitimate if it logically precludes or removes the very mechanism the model is intended to explain.
      *   *Test:* This explains the rejection of the used car model (you cannot explain market failure due to information asymmetry by assuming perfect information) and the pension model (you cannot explain sustainability over a lifecycle by assuming no death). It allows profit maximisation because the *mechanism* (market selection) validates the outcome even if the psychology is false.
      *   *Verdict:* **Survives.**

  *   **Candidate 5: The Student's Distinction (Negligible vs. Domain vs. Heuristic).**
      *   *Rule:* Legitimate idealisations either treat a factor as negligible, mark the domain of application, or serve as heuristic scaffolding. Illegitimate ones violate the domain or remove the scaffold's load-bearing function.
      *   *Test:* Mira explicitly endorsed this. Profit maximisation is 'heuristic scaffolding' (supported by market selection). Eternal life is a 'domain violation' (pensions are defined by mortality).
      *   *Verdict:* **Survives.**

  ### 2. The Surviving Rules and Their Predictions

  The surviving rules converge on a single, robust principle: **Causal Salience and Constitutive Constraints.**

  Mira's position appears to be that an idealisation is legitimate only if the false assumption does not remove a **causally salient feature** of the phenomenon being explained, nor violate a **constitutive constraint** of the system's definition.

  *   **Rule A (Causal Salience):** You may not assume away a factor that is the primary cause of the effect you are studying (e.g., information asymmetry in used cars; labour elasticity in tax models).
  *   **Rule B (Constitutive Constraints):** You may not assume away a physical or logical constraint that defines the entity in question (e.g., death in pensions; trade requires two parties).
  *   **Rule C (The 'As-If' Defence):** You may assume false motivations (profit max) if environmental pressures (competition) ensure the behaviour matches the assumption functionally.

  **Prediction for the Housing Bubble Paper:**
  The paper assumes identical beliefs and information to explain *speculative* bubbles.
  1.  **Causal Salience:** In most economic theory, speculative bubbles arise precisely because of heterogeneity in beliefs or information (someone thinks the price is too high, someone else thinks it will go higher). If beliefs are identical and rational, prices should track fundamentals (unless it is a specific 'rational bubble' model, but even then, trade requires a motive).
  2.  **Constitutive Constraint:** Speculation implies a wager against the consensus or a temporary mispricing. If all agents hold identical beliefs, there is no disagreement to drive the speculative volume. Furthermore, if information is identical, the 'Used Car' precedent applies: you cannot explain a market imperfection (a bubble) by assuming away the informational friction that typically causes it.
  3.  **Friedmanite Defence:** The authors argue assumptions don't matter because the fit is good. Mira has already ruled (via the Pension case) that fit does not save a model with a constitutively flawed assumption.

  **Verdict:** Mira will deem this model **illegitimate**.

  ### 3. The Inconsistency: Pensions vs. Profit Maximisation

  You noted a tension: she accepts profit maximisation (false) but rejects eternal life (false, fits data). This looks inconsistent until we apply the distinction she endorsed.

  *   **Profit Maximisation:** This is **Heuristic Scaffolding**. The assumption is about *motivation*. Mira accepts it because the *environment* (market competition) acts as a selection mechanism. Firms that do not act *as if* they maximise profits are eliminated. The assumption is functionally true at the system level, even if psychologically false at the agent level.
  *   **Eternal Life:** This is a **Constitutive Constraint**. A pension is, by definition, a financial instrument designed to bridge the gap between working life and death. Assuming away death does not simplify the model; it removes the *raison d'être* of the instrument. No market selection can make an immortal agent behave like a mortal one regarding pension drawdown.

  **Repair:** The inconsistency is repaired by distinguishing between **Functional Idealisations** (where the system enforces the behaviour, e.g., profit max) and **Ontological Idealisations** (where the assumption alters the physical nature of the agents, e.g., immortality). Mira is entitled to draw this line. She is not inconsistent; she is distinguishing between assumptions that capture systemic logic versus those that deny physical reality essential to the mechanism.

  ### 4. The Wine Wager

  I would stake your bottle of wine on the verdict that **Mira will reject the housing bubble model.**

  **Why?**
  The model commits the same error as the Used Car model. In the Used Car case, she rejected assuming perfect information because information asymmetry is the *cause* of the market failure (the 'Lemons' problem). In the Housing Bubble case, assuming identical beliefs removes the *disagreement* or *uncertainty* that is causally salient to speculative trading.
  Furthermore, the 'Fits Data' defence will fail her, just as it failed for the Pension model. She prioritises **explanatory coherence** over **predictive accuracy**. A model that explains bubbles by assuming away the divergence of opinion is, to her mind, like explaining a fire by assuming away oxygen because the burnt building fits the data of 'where fires happen'.

  ### 5. A Discriminating Case

  To distinguish the surviving rules (specifically to test the limits of the 'As-If' defence versus Causal Salience), I propose the following case to put to Mira:

  **The Case:** A model of **Bank Runs** which assumes that all depositors are perfectly patient and know the bank is solvent, yet a run still occurs due to a random 'sunspot' coordination failure. The model fits historical run data well.
  *   **Question:** Is the assumption of perfect knowledge/solvency legitimate here?

  **Why this tells the rules apart:**
  *   If she accepts it, she prioritises **Heuristic Scaffolding** (the run is about coordination, not solvency).
  *   If she rejects it, she prioritises **Causal Salience** (in reality, runs are often caused by fear of insolvency; assuming solvency removes the real cause).
  *   This mirrors the tension between the Profit Max (systemic logic) and Used Cars (specific friction). If she says 'Yes', she aligns with the Profit Max verdict (systemic logic dominates). If she says 'No', she aligns with the Used Car verdict (specific friction dominates).

  ### Summary

  Mira is not a Friedmanite in the crude sense; she is a **mechanismic realist** regarding idealisations. She allows simplifications that aid tractability (2 goods) or capture systemic logic (profit max), but she forbids assumptions that remove the causal engine of the phenomenon (info in used cars) or deny the physical definition of the subject (death in pensions).

  The housing bubble model assumes away the belief heterogeneity that fuels speculation. Despite the data fit, Mira will call it bad modelling. Pour the wine for me.
