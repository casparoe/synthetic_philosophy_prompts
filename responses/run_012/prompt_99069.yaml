  Begin by endowing each bidder with 100 tokens. Explain the core mechanic clearly: the highest bidder wins the Prize and pays their bid; the second-highest bidder pays their bid but receives nothing. All others pay nothing. Bids must increase by increments of 5 tokens. The Auctioneer opens bidding at 5. The Scribe must visibly update the "House Pot" on the whiteboard after every bid, summing the current highest bid plus the previous highest bid (the penalty). This ensures the room sees the Auctioneer's profit growing in real-time, independent of who wins.

  Bidding continues openly until the highest bid exceeds the Prize value (50 tokens). At exactly 55 tokens, the Auctioneer must pause the clock. This is the Escape Hatch trigger. The Auctioneer reads the instruction from their sealed card. For all tables, the offer is identical: "All active bidders may agree to withdraw. If unanimous, the auction ends immediately. No one pays. The Prize returns to the House."

  The difference lies in enforcement. Tables 1 and 2 know you will enforce the stop. Tables 3 and 4 know anyone can resume bidding immediately after the handshake. Allow three minutes for negotiation. Watch for the defect: a bidder at Table 3 realizing they can bid 60, pay 60, win 50, but force the opponent to pay 55 for nothing. If the ceasefire holds, close the auction. If it fails, resume bidding until one bidder exhausts their tokens or refuses to raise.

  Conclude by having the Scribe calculate the final House Pot. Collect all tokens paid by both winner and loser. The physical pile of tokens in the center represents the resources consumed by the conflict. Ensure the Auctioneer does not bid; they are the mechanism, not a player. If bidding stalls below 50, incentivize the Auctioneer to nudge the pace, but never bid themselves. The session ends when all tables have resolved their auctions, whether by ceasefire or exhaustion. The visual of the House Pot growing past the prize value is the critical teaching moment.

  - **The debrief**
  Gather the room. Do not name the game yet. Start with the House Pot. Ask each Scribe to read their final total. Write these on the main board. Ask: "Who created this value?" Guide them to see that the bidders generated the profit, not the Auctioneer. Ask the losers: "At what point did you know you would lose money?" and "Why did you continue?" This isolates the feeling of trapped rationality.

  Next, address the Escape Hatch. Ask Tables 3 and 4: "Why did the agreement fail?" Ask Tables 1 and 2: "Did knowing it was binding make you trust the stop?" Use this to demonstrate that informal agreements collapse under the pressure of the second-bidder penalty. Only now introduce the terms: "Escalation of Commitment" and the "Dollar Auction." Explain that the trap is structural, not psychological. The rules incentivize throwing good money after bad to minimize loss.

  Finally, contrast the tables. Did the binding rule prevent escalation, or did bidders simply avoid the hatch to win? Use this to discuss real-world equivalents: arms races where treaties are non-binding, or price wars where verbal caps are illegal. The lesson is that knowing the trap exists does not disarm it; only changing the payoff structure does. Highlight that the Auctioneer's profit is the only guaranteed outcome. Ask the winners: "Did you feel like you won?" This underscores that in escalation, there are often no true winners, only varying degrees of loss. End by asking what rule change would have saved the tokens. This shifts focus from blame to design.

  - **What will predictably go wrong the first time and how to handle it**
  The most common failure is Auctioneer bias. Participants chosen to run the auction often want their table to "win" or generate the most profit, leading them to hype the bidding or ignore the pause rule. Handle this by scripting the Auctioneer's lines on a cue card they must read verbatim. Another failure is token accounting errors; when bids get high, Scribes miscalculate the House Pot, obscuring the lesson. Provide a simple formula on the board: Current Bid + Previous Bid = House Pot.

  Sometimes, bidders collude before the start, agreeing to bid 5 and split the prize. This bypasses the trap entirely. To prevent this, forbid discussion until the auction begins. If it happens anyway, treat it as a data point: ask during debrief why that coalition didn't hold when the pressure rose. Finally, ensure the Prize feels desirable. If the chocolate bar is unappealing, bids stall too early. Have a backup prize of higher perceived value if the room seems disengaged. Monitor the clock strictly; if one table drags, call a hard stop to ensure time for debrief. Participants may treat tokens as a game to win rather than a system to observe. Remind them mid-auction if laughter becomes too casual that the ledger is real.

  - **What the activity cannot reproduce**
  This simulation cannot reproduce the visceral stress of real financial loss. Tokens are painless; walking away from 100 tokens feels different than losing rent money. Consequently, the emotional drive to "punish" the opponent may be weaker than in reality. You must supply this context in the debrief by asking participants to imagine the tokens represent reputation, career capital, or human lives. The activity also compresses time; real escalations happen over months, allowing for rationalization to set in. Here, the pressure is immediate. You must articulate how time dilutes rationality in the real world, allowing sunk costs to accumulate unnoticed until the trap is inescapable.
