prompt: |-
  I've been going down a bit of a rabbit hole and could use a hand. At work we grade our prediction models with log loss and sometimes Brier score, and someone in a Slack thread mentioned these are "proper scoring rules" and that there's a whole philosophy subfield behind it — something about "accuracy-first epistemology," where the only thing that really matters for a belief is how close it is to the truth, and apparently you can derive stuff like "your credences should obey the probability axioms" just from taking accuracy as the fundamental good. I don't have a philosophy background (I did CS), so I'm prbably mangling it, but the idea stuck with me.

  Anyway I started doodling my own scoring rules and I want to know which ones a serious accuracy-first person would actually take seriously as a measure of how accurate a credence is. Setup: you have a credence p between 0 and 1 in some claim, and the claim turns out either true (t = 1) or false (t = 0); a scoring rule hands you a number, higher = better. Here's my list:

  1. the plain Brier / quadratic one: -(p - t)^2
  2. the log one: the log of the probability you assigned to whatever actually happened
  3. a "good enough" rule: 1 point if |p - t| ≤ 0.1, otherwise 0
  4. an asymmetric rule that punishes being overconfident twice as hard as being underconfident: -2(p - t)^2 when p > t, and -(p - t)^2 when p ≤ t
  5. a rule that only cares about which side of 0.5 you landed on, not how far: +1 if you were on the right side (p > 0.5 and t = 1, or p < 0.5 and t = 0), otherwise 0

  Rank these five from most to least defensible as a fundamental measure of epistemic accuracy, and for each one give me a couple of sentences: does it actually reward honesty (I think the technical word is whether it's "proper" — i.e. your best move is to report your true credence rather than shade it), does it create any perverse incentives where you'd want to game it, and why it lands where it does in the ranking. Assume I basically know nothing, so keep it concrete — if two of them are close, tell me what would have to be true for one to beat the other.
