answer: |-
  **TO:** The Faculty Senate
  **FROM:** Chair, Governance Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Aggregation of Search Committee Rankings

  **1. Recommendation**
  The Governance Committee recommends amending the bylaws to replace the phrase "majority preference" with a specified positional scoring rule. The proposed language is: "Selection committees shall rank candidates by aggregating individual member rankings using a Borda Count. Each candidate shall receive points equal to the number of candidates ranked below them on each member's ballot. Candidates shall be listed in descending order of total points. In the event of a tie, the Committee Chair shall cast a deciding vote. This rule applies to all Senate-chartered search committees regardless of size."

  This rule eliminates the ambiguity of "reading the room" and provides a deterministic method for generating a full ranked list, even when pairwise preferences cycle. It requires no elimination rounds, preserving all preference data for the Dean's consideration.

  **2. Application to Pending Case**
  Applying this rule to the pending search committee data yields the following arithmetic. With four candidates, a first-place ranking receives 3 points, second receives 2, third receives 1, and fourth receives 0.

  *   **Candidate A:** (4 voters × 3) + (3 voters × 0) + (2 voters × 1) = 12 + 0 + 2 = **14**
  *   **Candidate B:** (4 voters × 2) + (3 voters × 3) + (2 voters × 0) = 8 + 9 + 0 = **17**
  *   **Candidate C:** (4 voters × 1) + (3 voters × 2) + (2 voters × 3) = 4 + 6 + 6 = **16**
  *   **Candidate D:** (4 voters × 0) + (3 voters × 1) + (2 voters × 2) = 0 + 3 + 4 = **7**

  The resulting ranked list to be transmitted to the Dean is: **1. B, 2. C, 3. A, 4. D.**

  **3. Reasoning and Trade-offs**
  No aggregation rule satisfies all desirable properties simultaneously. By recommending the Borda Count, we explicitly accept a specific defect: this method can sometimes rank a candidate lower than a rival even if a majority prefers them pairwise. In the pending case, for example, a majority prefers D to A, yet A ranks higher on the Borda count. We accept this violation of the "Majority Criterion" because the alternative in this specific case is indeterminacy. The pairwise results form a cycle (A beats B, B beats C, C beats A). Strict majority rule cannot produce a coherent list here without arbitrary tie-breaking.

  The Borda Count is defensible because it utilizes all information on the ballot, not just first preferences. It rewards broad acceptability over polarizing intensity. Regarding the note circulated by a committee member claiming voting procedure is a "shell game": The note is correct that impossibility results show no rule is immune to paradoxes, such as situations where a group is worse off for voting than abstaining. However, this does not justify inaction. It merely dictates humility. We are not choosing a perfect rule; we are choosing a transparent one. The defect we buy is that intensity of preference (scoring) can override strict pairwise majority will. This is tolerable because the Dean requires a linear list of hires, not a map of contradictions.

  Regarding sensitivity: The margin between B and C is one point. If one member had swapped B and C on their ballot, the order would flip. This volatility is inherent to any close vote, but unlike elimination methods, Borda does not discard the lower preferences that distinguish B from C.

  **4. The Majority Objection**
  The strongest argument against this recommendation is that legitimacy derives solely from majority will. Proponents argue that if a majority prefers A to B, ranking B above A is undemocratic. They suggest reporting the cycle or using instant runoff. This position holds that violating majority preference undermines the Senate's authority.

  My reply is twofold. First, when preferences cycle, there is no single "majority will" to respect. Any linear list constructed from a cycle must violate some pairwise majority relation. Second, instant runoff elimination is designed to select a single winner, not rank a slate. Eliminating the lowest first-place vote getter (here, C) discards the information that C was the second choice of a majority. For a search where the Dean may need to make multiple offers, discarding lower-preference data is inefficient. The Borda Count respects the majority when a Condorcet winner exists (someone who beats everyone pairwise) but provides a consistent resolution when they do not.

  **5. Procedural Objection and Transitional Provision**
  A serious objection is that adopting a new rule after ballots are cast is manipulative. If we select the rule based on the outcome it produces, we undermine the process's integrity. The status quo argument suggests we should have used the method implicit in previous searches (first preferences), which would have ranked A first.

  To answer this, we must acknowledge that the previous bylaw language ("majority preference") was silent on aggregation, effectively delegating the rule to the Chair's discretion. We are not changing a known rule; we are defining an ambiguity. However, to mitigate the appearance of ex post facto manipulation, the Senate should adopt the following transitional provision: "This rule applies prospectively to all searches initiated after the date of adoption. For the pending search, the Committee recommends the list generated by this rule, but acknowledges the procedural tension. The Senate ratifies this specific list as an exception necessary to resolve the ambiguity of the prior bylaws."

  If the Senate has not voted by the time offers are due, I will inform the Dean's office: "The Committee recommends B, C, A, D based on the proposed standard for aggregation. This list is contingent on Senate ratification but is submitted to prevent delay. Final authority rests with the Senate."

  **6. Review Clause**
  This rule should not be considered permanent. The Governance Committee recommends a sunset clause requiring review in three years. The Senate should revisit the rule if evidence arises that the Borda Count systematically produces outcomes contrary to the faculty's considered judgment. Specifically, if a candidate who defeats all others in pairwise comparisons (a Condorcet winner) is repeatedly ranked below others by the Borda Count, the Senate should reconsider whether the violation of the Majority Criterion is too high a price for determinacy. Until such evidence accumulates, this rule offers the most defensible balance between transparency and functionality.
