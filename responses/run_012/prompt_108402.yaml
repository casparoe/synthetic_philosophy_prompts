answer: |-
  # DECISION TREE: FROM OBJECTS TO MINDS
  **Case:** Later Prehistoric Cemetery.
  **Assemblage:** (A) Majority graves: Single pierced animal-tooth pendant at throat. (B) One grave: Intact aurochs skull face-down across adult chest.

  ---

  ### NODE 1: AGENCY AND TA PHONOMY
  **Question:** Does the spatial relationship between the aurochs skull and the human skeleton require the postulation of a human agent to explain the orientation, or is it consistent with natural post-depositional processes (e.g., gravity, scavenging, soil pressure)?

  *   **NO (Consistent with Natural Processes)** → **LEAF 1: Taphonomic Minimalism**
      *   *Awkward Commitment:* Must accept that patterns appearing to be ritual may be indistinguishable from natural noise, rendering 'belief' archaeologically inaccessible.
  *   **YES (Requires Human Agent)** → Go to **Node 2**.

  ---

  ### NODE 2: REGULARITY AND MENTAL STATES
  **Question:** Does the repetition of the tooth pendant at the throat across the majority of graves license an inference that the actors shared a specific propositional belief (a 'rule'), or only that they replicated a behavioral pattern (a 'habit')?

  *   **REPLICATED BEHAVIOR (Habit)** → Go to **Node 2b**.
  *   **SHARED PROPOSITIONAL BELIEF (Rule)** → Go to **Node 3**.

  #### NODE 2b: SOURCE OF HABIT
  **Question:** Is the replicated behavior best explained by embodied practical mastery passed through performance, or by environmental constraints limiting available choices?

  *   **ENVIRONMENTAL CONSTRAINTS** → **LEAF 2: UNNAMED (Ecological Determinism)**
      *   *Status:* **Unattractive.** Rarely occupied in burial studies because it reduces symbolic variation to resource scarcity without explaining the specific choice of *tooth* over *bone*.
  *   **EMBODIED PRACTICAL MASTERY** → **LEAF 3: Practice-Theoretic Accounts**
      *   *Awkward Commitment:* Must accept that agents can act consistently and meaningfully within a community without holding any internal cognitive representation of *why* they act.

  ---

  ### NODE 3: SYSTEMIC FUNCTION VS. SEMANTIC CONTENT
  **Question:** Does the uniformity of the pendant graves primarily license an inference that the burial rite functioned to regulate social cohesion (systemic stability), or that it functioned to communicate information about the deceased (semantic representation)?

  *   **REGULATE SOCIAL COHESION** → **LEAF 4: Processual Middle-Range Inference**
      *   *Awkward Commitment:* Must accept that individual intention is irrelevant and that variation (like the aurochs skull) represents systemic deviation or role change rather than unique meaning.
  *   **COMMUNICATE INFORMATION** → Go to **Node 4**.

  ---

  ### NODE 4: SOURCE OF MEANING
  **Question:** Is the semantic content of the 'face-down' aurochs skull accessed via cross-cultural cognitive universals regarding 'reversal' and 'negation', or via the specific local contrast with the pendant norm?

  *   **CROSS-CULTURAL COGNITIVE UNIVERSALS** → **LEAF 5: Cognitive-Universalist Reconstruction**
      *   *Awkward Commitment:* Must accept that prehistoric minds operated on the same cognitive constraints and symbolic associations as modern experimental subjects.
  *   **SPECIFIC LOCAL CONTRAST** → Go to **Node 5**.

  ---

  ### NODE 5: HERMENEUTIC SCOPE
  **Question:** Does the interpretation of the skull rely on recovering the specific depositor's private intent, or on reconstructing the community's available codes of meaning?

  *   **DEPOSITOR'S PRIVATE INTENT** → **LEAF 6: UNNAMED (Radical Intentionalism)**
      *   *Status:* **Incoherent.** Archaeologically unoccupiable because the material record cannot distinguish private intent from public performance without written testimony.
  *   **COMMUNITY'S AVAILABLE CODES** → **LEAF 7: Contextual or Interpretive Archaeology**
      *   *Awkward Commitment:* Must accept that meaning is recoverable only through a hermeneutic circle where the interpreter's own context inevitably shapes the recovered meaning.

  ---

  ### NOTES ON INFERENCE AND SEPARATION

  **1. Indistinguishable Leaves:**
  *   **Processual Middle-Range Inference (Leaf 4)** and **Practice-Theoretic Accounts (Leaf 3)** cannot always be separated by the assemblage alone. Both predict behavioral regularity (the pendants) and both can account for the exception (the skull) as either systemic role-marking or habitual deviation. The tree separates them by *licence* (System vs. Habit), but the *objects* remain identical.

  **2. Unoccupied or Incoherent Combinations:**
  *   **Node 1 (No) + Node 2 (Belief):** **Incoherent.** One cannot infer a shared mental rule from an arrangement explained by natural processes.
  *   **Node 2 (Habit) + Node 3 (Systemic Function):** **Unattractive.** While logically possible, this combination (Ecological/Behavioral Systemism) is rarely occupied because if one denies belief (Node 2), one usually denies the systemic *regulation* of belief (Node 3), collapsing into Practice Theory.
  *   **Node 4 (Universal) + Node 5 (Private Intent):** **Unexplored.** Cognitive archaeology typically relies on universals precisely to avoid the trap of guessing specific private intents; combining them creates a contradiction in method.

  **3. The Role of Ethnography:**
  *   While not a distinct node, the move from Node 4 to Node 5 implicitly asks whether an ethnographic parallel is doing the work of **generating a hypothesis** (Processual/Cognitive) or **warranting a conclusion** (Contextual). If the parallel warrants the conclusion without local contextual support, the inference collapses into the **Cognitive-Universalist** leaf; if it requires local contextual support, it proceeds to **Contextual**.
