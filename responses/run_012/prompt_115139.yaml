prompt: |-
  For several years now I have been trying to find out whether a particular structure has a name, and I have not managed to settle the question for myself. What I want is the carving rather than the label, so let me set out the structure, give the cases that puzzle me, and say what I have already looked at and found wanting.

  The structure is this. Something I want is offered to me on condition that I genuinely intend to do something unpleasant later on. The offer is honoured the moment the intention exists, before the unpleasant thing has been done. The offer was my whole reason for being willing to do the unpleasant thing, so once I have it the reason for the act has evaporated, while the intention, if it was genuine, is supposed to carry me into the act all the same. In the standard version the offeror is a perfect judge of intentions; in some variants he is not, and must take my word or wait for my conduct.

  Four cases:

  1. A stranger offers me a large sum, payable at once, if I can sincerely form the intention of spending the coming year nursing a relative abroad. I want the money very much. If I can get myself to intend the year, the money is mine; and then the year looks pointless, unless the mere fact of having intended it is itself a reason to go.

  2. The same offer, except that the money is to be paid to my sister rather than to me. The year abroad is still mine to spend and still wretched. Does the structure survive when the benefit lands on someone else, or is the whole interest of the case that the agent is buying his own advantage?

  3. The benefit is not money but information. A specialist will tell me whether I am genuinely committed to a punishing course of treatment, but will do so only if I first form the intention of completing it. What I want is the verdict; the treatment is the price. Is that the same structure, or a different one wearing its clothes?

  4. I discover that I can produce the required intention indirectly: by hypnosis, by a drug that makes me unusually suggestible, by a vow taken while drunk. Does that dissolve the difficulty, and if so, does it show that what was interesting all along was not the economics of the case but the fact that intentions cannot be adopted at will?

  The reply I am given whenever I raise this is that if I abandon the plan once the money is banked, the intention cannot have been genuine, so nothing follows about what I now have reason to do. That seems to me to turn the case into a question about my sincerity at an earlier moment, and I do not see how a verdict on my past sincerity can supply a reason now.

  Three things I have found that are close but, I think, not the thing itself. The first is the familiar business of binding oneself in advance, as the sailor has himself bound to the mast so that he cannot act on the longing the singing will produce: there the agent has a reason to act later and arranges to be unable to act on it, whereas in my cases the agent's later trouble is that he has no reason left at all. The second is promising: if I have promised my sister to go, then the promise is a reason to go after the money has been paid. But in my cases nobody has promised anything and there is nobody to be answerable to; everything hangs on what an intention can do by itself. The third is the suggestion that one might believe a proposition because it would be agreeable to believe it, which strikes me as the same difficulty displaced from action to belief.

  I should add some further cases that I cannot classify at all and would like placed: where the thing to be intended is something I would have wanted to do even without the reward; where the offer is made repeatedly, so that a reputation for carrying through becomes valuable in itself; where the condition is on my believing that I shall act rather than on my intending to; where what I must intend is to refrain from something rather than to do it; and where the benefit was paid some time ago, in reliance on a prediction that I would form the intention, so that it is already spent.

  What I want from you is therefore not a name to file all this under. I want to know whether there is an established name, and if there is, precisely what it covers; if the established name covers only the first sort of case, what the wider family should be called and how you would define it; which feature is doing the real work, whether the unobservability of the intention, the way the benefit destroys the reason for the act, or the impossibility of intending on demand; and which of the cases above belong to the structure and which merely resemble it. Where a case falls outside, I want to know what disqualifies it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** The user is describing a specific philosophical puzzle involving intentions, rewards, and rationality. They want to know if there's an established name for this structure, what it covers, and an analysis of the specific cases they provided.
      *   **The Structure:** An agent is offered a reward *conditional on forming a sincere intention* to do something unpleasant. The reward is given once the intention is formed (before the act). Once the reward is secured, the reason to do the unpleasant act vanishes (since the reward was the only motivation), yet the intention (if genuine) implies doing the act.
      *   **The User's Frustration:** Standard replies ("if you don't do it, you weren't sincere") feel like dodges. They want to understand the *rationality* of the situation, not just the psychology of sincerity.
      *   **Specific Cases to Analyze:**
          1.  Money to self (standard).
          2.  Money to sister (altruistic benefit).
          3.  Information/Verdict instead of money (epistemic benefit).
          4.  Indirect intention formation (hypnosis, drugs, etc.).
          5.  *Additional unclassified cases:* Intrinsic desire, reputation, belief vs. intention, refraining, past benefit.
      *   **Comparisons Rejected by User:** Ulysses binding (self-binding), Promising, Pascal's Wager-type belief.
      *   **Desired Output:** Not just a name, but a deep dive into the philosophical literature, identifying the core mechanism, classifying the cases, and explaining *why* some fit and others don't.

  2.  **Identify the Philosophical Concept:**
      *   The description immediately triggers recognition of the **Toxin Puzzle** (or **Kavka's Toxin Puzzle**).
      *   *Origin:* Gregory Kavka, "The Toxin Puzzle," *Analysis*, 1983.
      *   *Setup:* An eccentric billionaire offers $1 million if you *intend* tonight to drink a harmless but painful toxin tomorrow. The money is deposited tomorrow morning based on the intention. You don't actually have to drink the toxin to get the money, just intend to.
      *   *The Paradox:* Can you intend to do something you have no reason to do once the reward is secured? If you are rational, you know you won't drink it once you have the money. If you know you won't drink it, you can't sincerely intend to. Therefore, you can't get the money.
      *   *Fit:* This matches the user's "Structure" perfectly (Case 1).

  3.  **Address the "Name" Question:**
      *   Yes, there is an established name: **Kavka's Toxin Puzzle**.
      *   Is there a wider family name? Often discussed under **Intention and Rationality**, **Resolute Choice**, or **Self-Prediction**. Edward McClennen's work on **Resolute Choice** is highly relevant here. David Gauthier's **Constrained Maximization** is also related but slightly different (Prisoner's Dilemma focused).
      *   The core philosophical problem is often called the **Intention-Action Gap** or the **Rationality of Intention**.

  4.  **Analyze the Core Mechanism (What is doing the work?):**
      *   The user asks: Is it unobservability, benefit destroying reason, or impossibility of intending on demand?
      *   *Answer:* It's primarily the **transparency of intention to rational action**. Intention is generally taken to imply a belief that one will act. If acting is irrational (no reason left), believing one will act is irrational, thus intending is irrational.
      *   The "benefit destroying reason" is the trigger.
      *   The "impossibility of intending on demand" (Direct Voluntarism) is a constraint that makes the puzzle hard.

  5.  **Evaluate the User's Cases against the Toxin Puzzle:**

      *   **Case 1 (Money to Self):** This *is* the Toxin Puzzle. Fits perfectly.
      *   **Case 2 (Money to Sister):** This modifies the payoff structure. Does the reason evaporate? If I care about my sister, I still have a reason to act *after* getting the money? No, the money is paid *on intention*. Once paid, the sister has the money. Do I still need to nurse the relative? If the only reason was the money for her, and she has it, the reason to suffer is gone. This is a variant often discussed (altruistic toxin). It tests whether the "reason evaporation" holds for altruistic motives.
      *   **Case 3 (Information/Verdict):** This is the **Self-Knowledge** variant. Similar to the "Newcomb Problem" or predictive scenarios. If the specialist tells me I'm committed, I get the info. Once I have the info, do I need the treatment? If the treatment was only to get the info, no. This fits the structure but shifts the domain to epistemic rationality.
      *   **Case 4 (Indirect Intention):** This addresses the **Voluntarism** objection. Kavka assumes intentions aren't directly voluntary. If I can take a pill to *make* myself intend, does it solve it? If I take the pill, get the money, then the pill wears off... do I still act? This touches on **pre-commitment** strategies. It dissolves the *formation* problem but leaves the *execution* problem.

  6.  **Evaluate the "Unclassified" Cases:**
      *   *Intrinsic Desire:* If I wanted to do it anyway, the reward is surplus. The "reason evaporation" doesn't happen because the intrinsic reason remains. **Disqualified.**
      *   *Reputation:* If reputation is the goal, future rewards depend on current action. The reason *doesn't* evaporate because the act sustains the reputation. **Disqualified** (becomes an Iterated Prisoner's Dilemma or Reputation Game).
      *   *Belief vs. Intention:* This is **Pascal's Wager** / **Doxastic Voluntarism**. Structurally similar (belief conditional on benefit), but belief is often considered less voluntary than intention. **Related but distinct.**
      *   *Refraining:* Negation of action. Structurally identical. **Fits.**
      *   *Past Benefit:* Money already spent. This is the **Time-Consistency** problem. If I already spent the money based on the prediction, do I act? This is the core of the Toxin Puzzle (money deposited morning, toxin drunk noon). **Fits.**

  7.  **Address the User's Complaint about the "Sincerity Reply":**
      *   The user hates the "if you don't do it, you weren't sincere" reply.
      *   *Philosophical Consensus:* They are right to hate it. That reply is tautological. The puzzle is about whether a *rational agent* can form that intention in the first place. The literature (Gauthier, McClennen, Bratman) focuses on **Resolute Choice**—the idea that rationality allows you to bind yourself to a plan even when local maximization suggests deviating.

  8.  **Drafting the Response:**
      *   *Acknowledgment:* Validate the user's deep understanding. They have essentially reconstructed Kavka's Toxin Puzzle independently.
      *   *The Name:* Identify **Kavka's Toxin Puzzle** (1983).
      *   *The Family:* Mention **Resolute Choice** (McClennen) and **Constrained Maximization** (Gauthier).
      *   *The Mechanism:* Explain *why* it's a puzzle (The Principle of Instrumental Rationality vs. The Nature of Intention).
      *   *Case-by-Case Analysis:* Go through 1-4 and the additional cases, categorizing them as Core, Variant, or Excluded, explaining why.
      *   *The "Sincerity" Objection:* Explain why philosophers agree with the user that this is insufficient, pointing to the debate on **Rational Resoluteness**.

  9.  **Refining the Tone:**
      *   The user writes with precision and philosophical sophistication ("carving rather than the label," "economics of the case"). The response must match this tone—respectful, precise, and analytically rigorous. Avoid oversimplification.
      *   Ensure the distinction between *forming* the intention and *executing* the act is clear.
      *   Highlight the role of **Michael Bratman's** work on intention as a planning state, which is crucial for the "future-directed intention" aspect.

  10. **Self-Correction/Check during drafting:**
      *   *Did I address Case 4 correctly?* Indirect intention (hypnosis). If I hypnotize myself to intend, get the money, then wake up... do I drink? If the hypnosis compels action, it's not rational agency anymore. If it just compels intention, we are back to square one. Need to be careful here.
      *   *Did I address the "Past Benefit" case?* The user says "benefit was paid some time ago... already spent." This is exactly the Toxin Puzzle timeline (Money Monday, Toxin Tuesday). I need to make sure I confirm this *is* the standard case, not an outlier.
      *   *Check the "Sister" case:* If the money is for the sister, does the agent have a reason to act *after* payment? Only if the sister's having the money depends on the act. The prompt says "money is to be paid to my sister... if I... intend." So once intended, she gets paid. The act (nursing) is still wretched. So the reason evaporates. This is a valid variant.

  11. **Final Polish:** Organize with clear headings. Ensure the distinction between the *Toxin Puzzle* (the specific thought experiment) and the broader problem of *Rational Resoluteness* is clear. (Self-correction: Ensure I mention that some philosophers argue the puzzle is dissolved by rejecting the premise that intention requires belief of action, but most accept the puzzle stands).

