answer: |-
  You have independently reconstructed one of the most famous thought experiments in contemporary philosophy of action and rational choice. The structure you describe is known as **Kavka's Toxin Puzzle**.

  It was introduced by Gregory Kavka in 1983 in a paper titled "The Toxin Puzzle." While there is no single umbrella term for the wider family of cases you describe, they fall under the debates surrounding **Rational Resoluteness**, **Time-Consistency**, and the **Nature of Intention**.

  Here is the analysis you requested: the established name, the scope of the concept, the mechanism doing the work, and a classification of your specific cases.

  ### 1. The Name and The Structure
  **The Name:** **Kavka's Toxin Puzzle**.
  **The Setup:** An eccentric billionaire places a vial of toxin on the table. It will make you painfully ill for a day but will not kill you. He offers you one million dollars if you *intend* at midnight tonight to drink the toxin tomorrow afternoon. The money is deposited in your bank account tomorrow morning. You do not have to drink the toxin to keep the money; you only had to intend to drink it.
  **The Paradox:** To get the money, you must form the intention. But to form the intention, you must believe you will drink the toxin. However, once the money is in your account tomorrow morning, you have no reason to drink the toxin (the money is already yours, and drinking only brings pain). A rational agent knows they will not drink it tomorrow. If you know you will not do it, you cannot sincerely intend to do it. Therefore, a rational agent cannot get the money.

  **Does this cover your cases?**
  Yes, your **Case 1** is the Toxin Puzzle almost exactly. The "nursing a relative" is the painful act; the "large sum" is the reward; the condition is on the *intention*, not the act.

  ### 2. What Feature Is Doing the Work?
  You ask whether the crux is the unobservability of intention, the evaporation of reason, or the impossibility of intending on demand.

  It is primarily the **evaporation of reason** combined with the **transparency of intention**.

  1.  **Instrumental Rationality:** Standard rational choice theory suggests you should always perform the action that maximizes your utility *at the time of action*. At the time of action (tomorrow), the reward is secured. Drinking the toxin reduces utility. Therefore, rationality dictates *not* drinking.
  2.  **The Nature of Intention:** Most philosophers (following Michael Bratman) argue that intention entails a belief that one will act. You cannot intend to do what you believe you will not do.
  3.  **The Conflict:** Because you are rational, you know you won't act tomorrow (due to #1). Because you know you won't act, you cannot intend today (due to #2). Because you cannot intend, you don't get the money.

  The "unobservability" is secondary; even if the offeror could read your mind, the problem remains internal to your rationality. The "impossibility of intending on demand" is a constraint, but the *puzzle* is why rationality prevents it.

  ### 3. Analysis of Your Four Cases

  **Case 1: Money to Self (Standard)**
  *   **Verdict:** **Core Instance.**
  *   **Analysis:** This is the Toxin Puzzle. The "reason evaporation" is total. Once the money is yours, the nursing is pure loss. The puzzle is whether you can form the intention *ex ante* knowing you will defect *ex post*.

  **Case 2: Money to Sister (Altruistic Variant)**
  *   **Verdict:** **Core Instance (with a caveat).**
  *   **Analysis:** This tests whether the "reason evaporation" applies to altruism. If your only reason to nurse the relative is to get the money for her, once she has the money, the reason evaporates just as in Case 1. The structure survives.
  *   **Caveat:** If you derive *independent* satisfaction from her welfare that outweighs the wretchedness of the year, the reason does not evaporate, and the puzzle dissolves. But if the year is truly "wretched" and the money was the *sole* motivator, the structural paradox remains identical.

  **Case 3: Information/Verdict (Epistemic Variant)**
  *   **Verdict:** **Core Instance.**
  *   **Analysis:** This shifts the domain from practical rationality to epistemic rationality. You want the verdict (benefit). The price is the treatment (cost). Once you have the verdict, the treatment is costly with no further gain.
  *   **Nuance:** This touches on **Self-Knowledge**. Can you believe you are committed if you know you are rational? This is structurally isomorphic to the Toxin Puzzle but is often discussed in literature regarding **Self-Fulfilling Prophecies** or **Newcomb's Problem**.

  **Case 4: Indirect Intention (Hypnosis/Drugs)**
  *   **Verdict:** **Dissolves the Puzzle (via Pre-commitment).**
  *   **Analysis:** This addresses the "impossibility of intending on demand." If you can take a pill that *causes* you to intend (and subsequently act), you have bypassed the rationality constraint.
  *   **Why it dissolves it:** The Toxin Puzzle relies on you being a rational agent making a free choice. If you use hypnosis or drugs, you are effectively engaging in **Ulysses Binding** (which you mentioned rejecting). You are altering your future self's utility function or control.
  *   **Does it show the problem was voluntarism?** Yes and no. It shows the problem is that intention is not *directly* voluntary for a rational agent. If you make it indirect, you cease to be the rational agent the puzzle describes; you become a mechanism. Most philosophers argue this cheats the puzzle rather than solving it, because the question is whether *rationality* permits the intention, not whether *causality* can produce it.

  ### 4. Analysis of the "Unclassified" Cases

  **A. Intrinsic Desire (Would have done it anyway)**
  *   **Verdict:** **Disqualified.**
  *   **Reason:** The "reason evaporation" condition fails. You have a standing reason to act independent of the reward. The reward is surplus. You can intend sincerely because you intend to do the act regardless of the money. This is not a paradox; it is a windfall.

  **B. Reputation (Repeated Offers)**
  *   **Verdict:** **Disqualified (Iterated Game).**
  *   **Reason:** This changes the payoff structure. In the Toxin Puzzle, the game is one-off. If reputation is valuable, then acting *now* provides a reason to act (securing future rewards). The reason does *not* evaporate after the current payment because the act sustains the reputation required for the *next* payment. This becomes an **Iterated Prisoner's Dilemma** or a reputation game, not a Toxin Puzzle.

  **C. Belief vs. Intention**
  *   **Verdict:** **Related Family (Doxastic Voluntarism).**
  *   **Reason:** This is **Pascal's Wager** territory. Can you believe $P$ because it is beneficial to believe $P$? The structure is similar (benefit conditional on mental state), but beliefs are generally considered less voluntary than intentions. Philosophers often treat this as a sibling puzzle: **The Pragmatic Paradox of Belief**. It belongs to the wider family of "Rationality of Mental States" but is distinct because belief aims at truth, while intention aims at action.

  **D. Refraining (Intend not to do X)**
  *   **Verdict:** **Core Instance.**
  *   **Reason:** Negation does not change the logic. If you are paid to intend to refrain from smoking, and once paid you have no reason to refrain, the paradox holds. The structure is invariant to the polarity of the action.

  **E. Past Benefit (Money already spent)**
  *   **Verdict:** **Core Instance.**
  *   **Reason:** This is actually the **standard timeline** of the Toxin Puzzle. The money is deposited *before* the act is required. The fact that it is "already spent" emphasizes the evaporation of reason. If the money were paid *after* the act, there would be no puzzle (you would just do the act to get the money). The fact that the benefit is past is essential to the structure.

  ### 5. Addressing the "Sincerity Reply"
  You wrote: *"The reply I am given... is that if I abandon the plan once the money is banked, the intention cannot have been genuine... I do not see how a verdict on my past sincerity can supply a reason now."*

  You are correct, and the philosophical literature agrees with you. That reply is tautological and misses the point. The puzzle is not about whether you *can* lie about your intention; it is about whether a **rational agent** can *form* the intention.

  *   **The Standard View (Orthodox):** You cannot form the intention. Rationality requires you to maximize utility at the time of action. Since you won't act, you can't intend. You lose the money. (This preserves the link between intention and belief).
  *   **The Resolute Choice View (McClennen/Gauthier):** Some philosophers argue that rationality *does* allow you to bind yourself to a plan. They propose **Resolute Choice**: a rational agent can decide to follow through on a plan even when local maximization suggests deviating, because deviating would make the formation of the plan impossible in the first place.
      *   If you accept Resolute Choice, you *can* get the money. You intend, you get the cash, and you follow through because you are "resolute," not because it maximizes utility at that specific moment.
      *   This is the "carving" you are looking for. The debate is not about sincerity; it is about whether rationality is **Myopic** (look only at the current choice) or **Sophisticated/Resolute** (look at the whole plan).

  ### Summary Classification

  | Case | Classification | Why? |
  | :--- | :--- | :--- |
  | **1. Money to Self** | **Core (Kavka's Toxin)** | Perfect fit. Reason evaporates post-reward. |
  | **2. Money to Sister** | **Core Variant** | Reason evaporates unless altruism provides independent utility. |
  | **3. Information** | **Core Variant** | Epistemic version. Benefit secured before cost incurred. |
  | **4. Indirect Intention** | **Dissolution** | Turns into pre-commitment/Ulysses binding. Bypasses rational agency. |
  | **Intrinsic Desire** | **Excluded** | Reason does not evaporate. |
  | **Reputation** | **Excluded** | Becomes an Iterated Game; future reasons remain. |
  | **Belief** | **Sibling Puzzle** | Doxastic voluntarism (Pascal's Wager). |
  | **Refraining** | **Core** | Logical negation does not alter structure. |
  | **Past Benefit** | **Core** | This is the necessary temporal condition of the puzzle. |

  **The Established Name:** **Kavka's Toxin Puzzle**.
  **The Wider Family:** Problems of **Rational Resoluteness** and **Time-Consistency in Planning**.
  **The Real Work:** The conflict between **Instrumental Rationality** (maximize now) and **Intentional Stability** (stick to the plan).

  If you wish to read further, look for **Edward McClennen's *Rationality and Dynamic Choice*** (argues for Resolute Choice) and **David Gauthier's *Morals by Agreement*** (argues for Constrained Maximization). They attempt to solve the very difficulty you have identified: how to have a reason to act when the reason for having the reason has gone.
