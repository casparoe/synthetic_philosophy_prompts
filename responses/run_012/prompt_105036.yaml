          *   Camp A: Covering-Law Model (Hempel-style). Explanation = subsumption under general laws + antecedent conditions.
          *   Camp B: Narrative Model (Dray, Gallie, Mink-style). Explanation = emplotted story, followability, no need for universal laws.
      *   **Structure:**
          1.  Numbered section of Agreed Claims (logical form, prediction/retrodiction, contingency, minimum requirements).
          2.  Table of Residual Disagreements (phrased in each side's acceptable language).
          3.  The Cruxes (sub-questions that move the needle, identifying verbal vs. substantive disputes).
      *   **Specific Content Requirements:**
          *   Engage directly with (a) Retrospective descriptions/significance fixed by later events.
          *   Engage directly with (b) *Ceteris paribus* laws (hedged laws) and whether they do work or just protect the model.
          *   For each Crux: Provide a case/argument/comparison both accept, and record each side's prediction *before* explanation.
      *   **Tone:** Rigorous, collaborative, non-partisan, accessible to scientists (earth sciences background).

  2.  **Deconstruct the Philosophical Positions:**
      *   *Covering-Law (CL):* Explanation shows why something *had* to happen (nomological necessity). Focus on generalizability. Risk: Historians don't actually cite laws. Risk: Triviality if laws are vague.
      *   *Narrative (N):* Explanation shows *how* it happened (process/meaning). Focus on uniqueness and context. Risk: Just storytelling ("one damn thing after another"). Risk: Subjectivity.
      *   *Common Ground:* Both want to distinguish history from fiction. Both want to avoid pure chance. Both care about evidence.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find the overlap.
      *   *Claim 1 (Evidence):* Both agree explanations must be constrained by evidence/archives. No fiction.
      *   *Claim 2 (Causality):* Both agree causes precede effects (ontologically), even if *descriptions* vary.
      *   *Claim 3 (Contingency):* Both agree history isn't deterministic physics. Things could have gone otherwise.
      *   *Claim 4 (Prediction vs. Retrodiction):* CL loves prediction; N loves retrodiction. Agreement: Successful retrodiction doesn't guarantee predictive power, but predictive power isn't the sole test of truth.
      *   *Claim 5 (Minimum):* An explanation must identify a change of state and a mechanism (whether law-driven or agent-driven).
      *   *Refinement for Scientists:* Use terms like "boundary conditions," "initial conditions," "mechanism."

  4.  **Drafting Section 2: Residual Disagreements (Table):**
      *   Need to let each side speak their truth without caricature.
      *   *CL Side:* "Laws are implicit." "Generalizability is key to science."
      *   *N Side:* "Narrative structure *is* the logic." "Laws are trivial or absent."
      *   *Format:* Issue | Covering-Law Formulation | Narrative Formulation.

  5.  **Drafting Section 3: The Cruxes (The Core Task):**
      *   *Crux (a): Retrospective Significance.* (The "Turner's Frontier" or "Fall of Rome" problem).
          *   *Case:* The signing of a treaty that later causes a war.
