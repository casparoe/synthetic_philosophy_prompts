answer: |-
  **JOINT STATEMENT ON THE LOGIC OF HISTORICAL EXPLANATION**

  **Signatories:** The Nomological Working Group (NLG) & The Narrative Configuration Group (NCG)
  **Date:** October 26, 2023
  **Subject:** Parameters of Adversarial Collaboration regarding Historical Explanation

  **Preamble**
  This document summarizes the current state of collaboration between two distinct approaches to the philosophy of history. Our goal is not consensus, but the precise mapping of overlap and divergence. This draft is intended for review by colleagues in the historical and earth sciences who require clarity on the evidentiary and logical standards of historical inquiry.

  ### I. Agreed Claims

  The following propositions are accepted by both the NLG and the NCG. The wording is selected to describe functional requirements of explanation without committing to the ontological status of the mechanisms involved.

  1.  **Constraint by Evidence:** Historical explanations are not free constructions. They are constrained by archival, archaeological, and testimonial evidence. Any explanation that contradicts established empirical data regarding the sequence or occurrence of events is invalid, regardless of its logical elegance or narrative coherence.
  2.  **Causal Ordering:** While the *description* of an event may depend on later knowledge, the *occurrence* of causal conditions must precede or be contemporaneous with the effect. Explanation requires identifying antecedent conditions, even if the significance of those conditions is only recognized retrospectively.
  3.  **The Status of Contingency:** Both sides agree that historical events are not determined in the same manner as classical mechanical systems. Contingency—the possibility that things could have happened otherwise given the same initial conditions—is a real feature of the historical record, not merely a measure of human ignorance.
  4.  **Prediction vs. Retrodiction:** Successful retrodiction (explaining what has already happened) does not logically guarantee the ability to predict future events. However, an explanation that renders the past unintelligible or random fails a basic test of adequacy. Predictive success, where possible, strengthens an explanation but is not a necessary condition for its truth in singular historical cases.
  5.  **Minimum Explanatory Requirement:** To explain an event is to do more than redescribe it. An explanation must identify a *change of state* and provide a *connecting principle* that links the antecedent conditions to the outcome. Whether this connecting principle is termed a "law," a "mechanism," a "rule," or a "plot structure," it must render the transition from A to B intelligible rather than arbitrary.
  6.  **The Role of Generalization:** Both sides accept that historical explanation involves some reference to types of events, not just tokens. To explain a revolution is to imply something about revolutions generally, even if the claim is that *this* revolution is unique. Total particularism (the claim that no event resembles any other) renders explanation impossible.

  ### II. Residual Disagreements

  The following table outlines where the collaboration remains deadlocked. Each formulation is phrased to be acceptable to the respective signatory without caricature.

  | Issue | Nomological Working Group (NLG) Formulation | Narrative Configuration Group (NCG) Formulation |
  | :--- | :--- | :--- |
  | **The Connecting Principle** | The connection between antecedent conditions and outcome must instantiate a general law (universal or probabilistic). Without a law, the connection is an assertion of faith, not an explanation. | The connection between antecedent conditions and outcome is established by emplottment. The "logic" is the followability of the story, not subsumption under an external generalization. |
  | **The Function of "Law"** | Laws may be implicit or *ceteris paribus* (hedged), but they are necessary to distinguish history from fiction. They provide the warrant for the inference. | Demanding laws imposes a scientific model alien to historical practice. Historians use norms, expectations, and reasons, not laws. Calling these "laws" trivializes the concept of law. |
  | **Understanding (Verstehen)** | Understanding is the recognition of a correct logical subsumption. If the law holds, the event is understood. | Understanding is the grasping of a meaningful whole. One can know the laws and still not understand the historical significance of the event. |
  | **Singular Events** | A singular event is explained by showing it as an instance of a recurring relationship between variables. | A singular event is explained by showing how it constitutes a unique configuration of elements that cannot be reduced to variables. |

  ### III. The Cruxes

  We have identified two specific problems where resolving the empirical or logical details would force a shift in at least one position. For each crux, we present a case, the specific question, and the pre-analysis predictions of both groups.

  #### Crux 1: Retrospective Significance (The Problem of "Narrative Sentences")

  **The Issue:** Many historical explanations rely on descriptions that reference events later than the one being explained (e.g., "Archduke Franz Ferdinand's assassination *started the Great War*"). The war did not exist at the moment of the assassination.
  *   **Question:** Does the explanatory power reside in the *later* outcome (which fixes the significance) or in the *antecedent* conditions (which made the outcome possible)?
  *   **Case:** The signing of the Treaty of Versailles (1919).
      *   *Description A:* "A peace settlement ending the Great War."
      *   *Description B:* "A causal factor in the outbreak of the Second World War."
      *   *Explanation:* To explain the instability of the Interwar Period, historians rely on Description B. But Description B was not true in 1919.

  **Predictions:**
  *   **NLG Prediction:** Analysis will show that Description B relies on an implicit law linking "punitive peace terms" to "future aggression." The retrospective label is shorthand for a causal mechanism that was operative at the time, even if unrecognized. The law does the work, not the hindsight.
  *   **NCG Prediction:** Analysis will show that Description B organizes the sequence into a tragedy or a failure. The explanation works *because* we know the ending. The "mechanism" is a construction of the narrative arc, not a pre-existing law. The hindsight *is* the explanation.

  #### Crux 2: Hedged Laws (*Ceteris Paribus* Regularities)

  **The Issue:** The NLG often retreats to *ceteris paribus* (all other things being equal) laws to avoid counterexamples (e.g., "Revolutions occur when relative deprivation rises, *ceteris paribus*").
  *   **Question:** Does a law that admits unstated exceptions do any explanatory work, or does it merely protect the model from falsification?
  *   **Case:** The "Threshold Model" of Rioting.
      *   *Generalization:* "When the perceived cost of participation drops below a threshold, individuals join collective action."
      *   *Counter-instance:* In Case X, costs dropped, but no riot occurred.
      *   *NLG Response:* "Other things were not equal (e.g., police presence, weather)."
      *   *NCG Response:* "The generalization is empty. It explains everything and nothing."

  **Predictions:**
  *   **NLG Prediction:** Refining the *ceteris paribus* clauses will eventually yield a robust probabilistic model comparable to earth sciences (e.g., seismology). The "hedging" is a temporary state of incomplete knowledge, not a defect in the logic.
  *   **NCG Prediction:** The hedging will never end. Each exception requires a new narrative context to explain why the "law" failed. The context explains the event, not the law. The "law" is a placeholder for the narrative context.

  #### Note on Verbal vs. Substantive Dispute

  **Judgment:** A significant portion of the disagreement regarding **Crux 2** is judged to be **merely verbal**, specifically concerning the definition of "Law."

  **Reasoning:**
  If the NLG defines "Law" as a strict, universal conditional (If A, then always B), the NCG is correct that history possesses none. If the NCG defines "Narrative" as merely "a sequence without any generalizable patterns," the NLG is correct that history would be indistinguishable from fiction.
  However, in practice, the NLG accepts *probabilistic tendencies* and the NCG accepts *robust patterns of human behavior*.
  *   **The Verbal Knot:** When the NLG says "Law," they often mean "Stable Causal Mechanism." When the NCG hears "Law," they hear "Deterministic Physics."
  *   **The Substantial Remainder:** Even if we agree to call them "Stable Mechanisms," the dispute remains: Is the mechanism *external* to the story (a rule applied to the events) or *internal* to the story (the logic of the actions themselves)? Settling the verbal definition of "law" will not resolve whether the *source* of intelligibility is the generalization or the configuration.

  ***

  **Prepared for:** Review by Department of Earth Sciences and History
  **Status:** Draft for Comment
