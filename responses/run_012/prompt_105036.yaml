          *   *N Prediction:* The story connects them; the law is irrelevant.
      *   *Crux (b): Ceteris Paribus Laws.* (The "Rational Choice" or "Supply/Demand" problem).
          *   *Case:* Revolutions happen when grievances exceed tolerance (unless they don't).
          *   *CL Prediction:* It's a probabilistic law, still scientific.
          *   *N Prediction:* It's a tautology or a plot device, not a law.
      *   *Verbal Dispute Check:* Is "Law" just a word for "Pattern"? If CL means "strict universal" and N means "strict universal," they agree there are none. If CL means "tendency," N might agree but call it "context." I need to pinpoint if the fight is over the word "law."

  6.  **Refining for the Audience (Earth Scientists):**
      *   Earth sciences (geology, climatology) deal with unique events (formation of the Alps) using general laws (plate tectonics). This is the perfect bridge.
      *   Avoid overly dense analytic philosophy jargon (e.g., "nomological danglers"). Use "generalizations," "mechanisms," "sequences."
      *   Ensure the tone is "Here is where we agree, here is where we fight, here is how to test it."

  7.  **Iterative Drafting - Self-Correction during thought process:**
