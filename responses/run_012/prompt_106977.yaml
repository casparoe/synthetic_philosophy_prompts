          *   $EU(\text{Loose}) = - (P(\text{Primary}) \times P(\text{Fail}|\text{Primary}) \times \text{Disaster})$.
          *   $EU(\text{Tight}) = - \text{Cost}(\text{Tightening})$.
          *   If $P(\text{Primary})$ is high enough (from agent's perspective), AC says Tighten.
          *   RC says: The rule "Always Tighten" is suboptimal because $P(\text{Primary})$ is low *on average*, and Cost(Tightening) adds up.
          *   Wait, if $P(\text{Primary})$ is low on average, AC should also see it as low (unless the agent has specific reason to suspect it's primary).
          *   **Crucial Adjustment:** The agent is in a context where they *should* suspect risk, but the *system* is designed such that most risks are nullified.
