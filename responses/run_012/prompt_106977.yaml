          *   **Fact:** The system is built with 10x redundancy. No single valve failure causes harm.
          *   **Act:** Skipping a torque check on one valve.
          *   **Harm:** System failure.
          *   **Inefficacy:** Because of redundancy, this valve's failure *cannot* cause system failure. (Fact).
          *   **AC:** Agent believes redundancy might not hold (aging system). $P(\text{Redundancy Fail}) \times \text{Catastrophe} > \text{Cost of Check}$. AC: Check.
          *   **RC:** Rule "Check every valve" costs \$1M/year. Expected harm prevented: \$100k/year. Optimal Rule: "Check 10% of valves" or "Check only if visible corrosion."
          *   In this case, the valve looks fine. The Optimal Rule permits skipping.
          *   AC (Subjective) condemns skipping because the agent can't be *sure* redundancy holds.
          *   RC permits skipping because the rule requiring certainty is too costly.
          *   **Wait, one nuance:** If AC is subjective, the agent uses the *average* probability of redundancy failure. If RC uses the average, they should agree.
          *   **Divergence Point:** AC assesses the *act* in isolation. RC assesses the *rule* including the cost of *teaching/monitoring/enforcing* the rule.
          *   AC calculation: $Benefit(\text{Safety}) - Cost(\text{Time})$. It ignores the cost of *having a norm* that demands this time.
