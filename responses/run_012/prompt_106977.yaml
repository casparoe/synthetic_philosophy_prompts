  ### The Thought Experiment: The Expired Stockpile

  **1. The Case Layout**

  *   **Setting:** A city in the early weeks of a respiratory pandemic. Public health infrastructure is strained but functional.
  *   **The Harm:** A healthcare worker (HCW) contracts the virus and dies due to lack of Personal Protective Equipment (PPE).
  *   **The Individual:** A healthy adult (the Agent) needs to go grocery shopping (a moderate-risk activity).
  *   **The Act:** The Agent purchases a box of N95 respirators from a local pharmacy to use while shopping.
  *   **The Alternative:** The Agent shops without the N95 (using a cloth mask or none), accepting a marginally higher personal risk.
  *   **The Fact of Inefficacy:** Unbeknownst to the Agent, the specific box of N95s they purchased was from a batch that had expired the previous month. Hospital procurement protocols automatically reject expired batches. Had the Agent not bought them, these masks would have been incinerated as medical waste. They were never in the pool of resources available to HCWs. Therefore, the Agent's purchase *genuinely makes no difference* to whether an HCW receives a mask.
  *   **The Epistemic Situation:** The pharmacy shelves are bare except for this one box. News reports emphasize critical PPE shortages. A rational Agent assigns a significant subjective probability (e.g., 10%) that purchasing this box deprives an HCW of a usable mask.
  *   **The Magnitudes:**
      *   Cost to Agent of *not* buying: Minor inconvenience and elevated (but low) health risk (Value: \$100 equivalent).
      *   Harm to HCW: Death (Value: -\$10,000,000 equivalent).
      *   Subjective Probability of Deprivation (AC view): 10%.
      *   Expected Harm (AC): $0.10 \times -\$10,000,000 = -\$1,000,000$.
      *   Since \$1,000,000 > \$100, Act-Consequentialism condemns the purchase.

  **2. The Reasoning Walkthrough**

  **Act-Consequentialist (AC) Reasoning:**
  The AC assesses the token act based on the Agent's available evidence (Subjective Act-Consequentialism). The Agent sees empty shelves and hears reports of shortages. While it is a *fact* that these masks are expired, the Agent cannot verify this without opening the box and checking lot numbers against a database they do not have access to.
  *   *Calculation:* $EU(\text{Buy}) = \text{Benefit}_{\text{Agent}} - (P_{\text{Deprivation}} \times \text{Cost}_{\text{HCW}})$.
  *   *Input:* Even a conservative estimate of $P_{\text{Deprivation}}$ (e.g., 1%) multiplied by the magnitude of a human life vastly outweighs the convenience of a specific brand of mask for grocery shopping.
  *   *Verdict:* **Condemn.** The Agent ought to leave the masks, because the expected disutility of potentially depriving a worker exceeds the utility of the purchase. The objective inefficacy is irrelevant to the Agent's decision procedure because it is epistemically inaccessible.

  **Rule-Consequentialist (RC) Reasoning:**
  The RC assesses the optimal set of rules to be inculcated in the population, considering the costs of teaching, monitoring, and complying with those rules.
  *   *Candidate Rule A:* "Do not purchase N95 masks for non-essential activities."
  *   *Candidate Rule B:* "Purchase PPE according to your personal assessment of need."
  *   *Analysis:* To make Rule A work, the public must be able to distinguish "essential" from "non-essential" and "usable" from "expired" stock. This requires complex public guidance, enforcement, and creates a stigma around PPE usage that may lead to dangerous under-protection in genuinely risky private settings. Furthermore, if consumers stop buying, supply chains may stall, and expired stock (like the box in question) may not be rotated out, leading to systemic waste.
  *   *Optimization:* A simpler rule ("Maintain normal preparedness habits") minimizes panic, ensures supply chain turnover, and avoids the high administrative costs of defining "essential use" for millions of individuals. The expected harm of *some* individuals buying unnecessary masks is outweighed by the systemic stability of a free-access rule.
  *   *Verdict:* **Permit.** The optimal rule does not forbid this purchase. The cost of a rule fine-grained enough to catch "expired stock purchases" is too high relative to the benefit, and the general rule permitting purchase is utility-maximizing overall.

  **3. The Key Feature**

  The divergence is driven by **Epistemic Asymmetry combined with Rule Stability Costs.**

  *   **Level of Assessment:** AC assesses the *local epistemic state* of the agent (high perceived risk). RC assesses the *global systemic cost* of the rule required to mitigate that risk.
  *   **Generality:** RC permits the act because the rule required to forbid it ("Don't buy unless you know it won't deprive a worker") is too demanding to be a public morality. It requires knowledge the agent cannot have. AC, focused on the single act, demands the agent act *as if* they have that knowledge (i.e., assume the risk is real).
  *   **Ex Ante Identifiability:** The "harmful" cases (buying a mask that a worker actually needs) cannot be distinguished from the "harmless" cases (buying expired masks) by the agent in advance. AC demands caution in the face of this indistinguishability. RC accepts the indistinguishability as a reason to keep the rule simple and permissive.

  **4. The Removal Test**

  *   **Modification:** Suppose the Agent *knows* the masks are expired (e.g., a clear label on the box).
      *   *AC Verdict:* Shifts to **Permit**. With $P_{\text{Deprivation}} = 0$, the expected harm is zero. The cost of the act is now just the financial cost, which is outweighed by safety.
      *   *RC Verdict:* Remains **Permit**. The rule already permits it.
      *   *Result:* The divergence collapses. AC becomes permissive, aligning with RC. This confirms the divergence relied on the Agent's ignorance.

  *   **Modification:** Suppose the cost of compliance with the restrictive rule is zero (e.g., masks are abundant, no supply chain issues, "essential use" is obvious).
      *   *AC Verdict:* Remains **Condemn** (if shelves are empty and risk is perceived).
      *   *RC Verdict:* Shifts to **Condemn**. If the rule "Don't buy for non-essentials" has no systemic costs and saves lives, it becomes the optimal rule.
      *   *Result:* The divergence collapses. Both condemn. This confirms the divergence relied on the *cost of the rule* (panic/enforcement).

  *   **Conclusion:** The case only generates the reversal when there is **high local perceived risk** (driving AC) coupled with **high systemic cost of regulation** (driving RC).

  **5. The Act-Consequentialist Objection**

  **The Objection:** "You have rigged the case by relying on Subjective Act-Consequentialism while hiding the objective facts from the agent. If AC is about maximizing *actual* good, the Agent ought to do what *actually* produces good. Since the act is objectively harmless, Objective AC permits it. You are comparing Subjective AC against Rule Consequentialism. If you compare Objective AC against RC, they align (both permit). If you compare Subjective AC against Subjective RC (rules assessed by what agents believe), RC would also condemn the act because agents *believe* the rule 'Don't Buy' saves lives."

  **Does the Charge Stick?**
  Partially, but it misses the point of moral theory as a guide for action.
  1.  **Guidance Constraint:** Moral theories are generally expected to guide agents who lack omniscience. Objective AC is not action-guiding for non-omniscient agents. Therefore, Subjective AC is the standard formulation for practical ethics.
  2.  **The RC Counter:** A Subjective RC (assessing rules by what agents *believe* will happen) would indeed likely condemn the act *if* the agents believe the shortage is critical. However, RC introduces the **cost of inculcation**. Even if agents *believe* restricting purchases is good, the RC asks: "Is it good to have a *rule* that requires agents to make complex supply-chain assessments before buying?" The RC verdict rests on the *complexity cost* of the rule, not just the perceived harm. The AC verdict rests on the *expected harm* of the act.
  3.  **The Structural Point:** The reversal holds because AC is sensitive to **marginal risk in a specific context** (empty shelves), whereas RC is sensitive to the **average cost of compliance across all contexts**. The AC says, "In *this* high-risk context, don't buy." The RC says, "A rule that changes based on shelf-emptiness is too unstable to teach."

  This demonstrates that AC is not structurally permissive in inefficacy cases; it is only permissive when the *subjective* probability of efficacy is low. When subjective probability is high (due to scarcity signals) but objective efficacy is zero (due to hidden facts), AC becomes demanding while RC remains permissive due to the costs of fine-grained regulation.
