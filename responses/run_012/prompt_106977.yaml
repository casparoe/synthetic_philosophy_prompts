          *   AC: Clerk doesn't know it's frozen. Clerk knows skipping checks *allows* fraud. $P(\text{Fraud}) \times \text{Loss} > \text{2 mins}$. AC: Do the check.
          *   RC: Rule "Always Check" vs "Trust Automation."
          *   If Automation catches 99.9% of fraud, and human checks catch the rest but are slow/expensive.
