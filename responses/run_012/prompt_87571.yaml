answer: |-
  You are not forty years out of date; you are precisely on time. This problem exploded into the literature in the early 2000s, largely because political philosophers and legal theorists finally caught up with the social choice theorists.

  The name you are looking for is the **Discursive Dilemma**.

  In its specific legal origin (which matches your hospital ethics case perfectly), it is often called the **Doctrinal Paradox**. The broader field that studies this is **Judgment Aggregation Theory**.

  Here is the carving you asked for, following your boundaries.

  ### The Core Identification
  It is not Condorcet (which concerns cyclic *preferences* over alternatives) and it is not Arrow (which concerns *rankings*). It is about the consistency of *propositional attitudes* (believing that P, believing that Q).

  The paradox arises when a group uses majority voting on interconnected propositions. As you noted, individuals are consistent, but the collective set of judgments is logically inconsistent.
  *   **Doctrinal Paradox:** Specifically refers to legal adjudication where a verdict depends on a conjunction of premises (e.g., breach of contract + damages = liability).
  *   **Discursive Dilemma:** The generalization to any group deciding on connected propositions (ethics committees, hiring boards, central banks).

  ### (a) Strict Entailment vs. Normative Coherence
  Does it require logical entailment? **Strictly speaking, yes, for the "Paradox."**

  For the *Discursive Dilemma* to hold in its formal sense, the connection between the premises and the conclusion must be a logical constraint (e.g., $P \land Q \to R$). If the group accepts $P$, accepts $Q$, but rejects $R$, the group is formally contradictory.

  In your hiring case, where the connection is normative ("one *should not* hire if the first two are no"), you are in the territory of **Coherence Constraints** rather than logical entailment.
  *   **The Distinction:** If the connection is logical, the group output is *irrational* (contradictory). If the connection is normative, the group output is *incoherent* or *hypocritical*, but not logically impossible.
  *   **The Name:** Most scholars lump both under **Judgment Aggregation**, but some distinguish the latter as a problem of **Normative Consistency**. The structural math is identical, but the philosophical sting is weaker in the hiring case because the group isn't violating the law of non-contradiction, only a shared norm.

  ### (b) The Two Escapes
  You have correctly identified the two standard solutions. They have names:

  1.  **Premise-Based Procedure (PBP):** You vote on the premises (competent? informed?) and derive the conclusion (honour refusal?) logically.
      *   **The Price:** **Responsiveness.** The outcome on the conclusion may contradict the majority view on the conclusion itself. (As you noted: 60% say competent, 60% say informed, but only 40% say honour refusal. PBP forces "Honour Refusal" even though 60% of the committee voted against it directly).
  2.  **Conclusion-Based Procedure (CBP):** You vote directly on the conclusion (honour refusal?) and ignore the votes on the premises, or treat them as advisory.
      *   **The Price:** **Collective Rationality.** The group's stated reasons (premises) may not support its stated decision. The group appears to lie about why it decided what it decided.

  **Is there a principled reason to prefer one?**
  This is the central debate in the literature.
  *   **Argument for PBP:** Championed by Philip Pettit and Christian List. They argue that for a group to be a moral agent, it must exhibit **Collective Rationality**. A group that contradicts itself cannot be held responsible. Therefore, integrity (PBP) trumps responsiveness (CBP).
  *   **Argument for CBP:** Democratic theorists argue that the *decision* is what matters. If the majority wants outcome X, giving them outcome Y (because of the premises) is undemocratic. This prioritizes **Majoritarian Responsiveness**.

  There is no mathematical tie-breaker; it is a normative choice between valuing the group's *integrity* versus the group's *representativeness*.

  ### (c) Does it turn on the numbers?
  **No, but it affects the probability.**

  *   **Supermajorities:** Requiring a 2/3 vote instead of 1/2 makes the paradox *less likely* to occur, but it does not make it *impossible*. You can construct a distribution of views where a 2/3 majority accepts P, a 2/3 accepts Q, but fewer than 2/3 accept R.
  *   **Unanimity:** If you require unanimity, the paradox vanishes. If everyone agrees on P and everyone agrees on Q, everyone must agree on R (assuming individual rationality). But this buys coherence at the price of gridlock.
  *   **Weighted Voting:** Giving senior members double votes changes the coalition math but does not solve the structural problem. You can still construct a profile of weighted votes that yields the inconsistency.

  The impossibility theorem here (List & Pettit, 2002) proves that *no* voting procedure can satisfy a set of minimal democratic conditions (anonymity, systematicity, etc.) and guarantee collective consistency on all possible agendas. Changing the threshold just moves the goalposts; it doesn't remove the field.

  ### (d) Does the group have a view?
  This is the deepest philosophical question you raised.

  When the group is inconsistent (via the Discursive Dilemma), can it be said to have a "view"?
  *   **The Term:** **Group Agency**.
  *   **The Concept:** **Collective Intentionality**.
  *   **The Problem:** If the group's beliefs are inconsistent, many philosophers argue the group fails to qualify as an **Agent**. An agent must have a "mind" that is minimally rational. If the committee says "P is true, Q is true, but R (which follows) is false," the committee does not have a single mind; it is merely an aggregation of individual minds.

  Pettit calls this the requirement for **Group Integrity**. If you use the Conclusion-Based Procedure (CBP) and end up with inconsistent reasons, the group is "akratic" (weak-willed) or schizophrenic. It has a view, but it is a defective one. If you use the Premise-Based Procedure (PBP), the group has a consistent view, but it is a view that no single member holds (since the majority on the conclusion is overruled).

  So, to answer your specific question: Yes, there is a name for the doubt about whether the group has a view. It is the problem of **Non-Summativism**.
  *   **Summativism:** The group's view is just the sum of the members' views. (This leads to the paradox).
  *   **Non-Summativism:** The group's view is a distinct entity that supervenes on the members but must be curated (via PBP) to ensure rationality, even if it diverges from the statistical majority.

  ### Summary Map
  *   **The Phenomenon:** The Discursive Dilemma (or Doctrinal Paradox).
  *   **The Field:** Judgment Aggregation Theory.
  *   **The Loose Version:** Normative Coherence problems (same structure, weaker logical status).
  *   **The Escapes:** Premise-Based Procedure (values Integrity) vs. Conclusion-Based Procedure (values Responsiveness).
  *   **The Numbers:** Affects likelihood, not possibility (unless Unanimity).
  *   **The "View" Question:** Group Agency and Collective Rationality.

  You are witnessing the friction between a group acting as a *democracy* (aggregating views) and a group acting as an *agent* (holding a coherent position). The discomfort you feel is the sound of those two concepts grinding against each other.
