      *   *Distinction:* The "Doctrinal Paradox" (legal context) usually implies a logical/legal rule. The "Discursive Dilemma" (philosophical context) generalizes this. If the connection is merely a strong normative expectation (hiring case), it's still a judgment aggregation problem, but the "paradox" element is weaker because the group isn't *logically* contradictory, just *normatively* inconsistent.
