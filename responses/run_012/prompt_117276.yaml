answer: |-
  **The Objective Ear**

  This month I am stepping in as your guest columnist. I approach your troubles as a researcher approaches a subject: by collecting what you say about your experience and treating those utterances as a text to be explained. I adopt the intentional stance towards you, attributing beliefs and desires to predict what you will say. I offer kindness not as a mystery, but as a strategy. Here are this month's selections.

  **Dear Columnist,**
  **My partner flatly contradicts my reports. I say the room is cold and the soup is too salty; he says the heating is adequate and the seasoning is perfect. He says I am imagining things. I want to know: which of us is right?**
  **Yours, Shivering**

  Dear Shivering,
  You are the authority on how things seem to you and on nothing beyond that. I grant you are reporting coldness. I grant it seems cold to you. I must, however, withhold judgment on whether there was anything there to seem that way. We must separate three things: what you said, how it seemed to you, and whether the room was actually cold. I accept the first two as data for your heterophenomenological world. I do not accept the third. Your partner offers a competing text. Neither report proves the world's state. You are not imagining the seeming; the seeming is the data. Continue to report how it seems; do not demand the world conform.

  **Dear Columnist,**
  **I have been seeing a practitioner of the rival, first-person approach. She asks me to introspect and deliver the facts about my grief. Should I trust my own introspection instead of coming to you?**
  **Yours, Seeking**

  Dear Seeking,
  First-person methods, in which a subject introspects and delivers facts about experience, are rejected as unscientific. You should trust your introspection only as a source of utterances to be explained. Do not treat your inner gaze as revealing independent truths. Your grief is an inhabitant of your heterophenomenological world, whose inhabitants are not thereby believed to exist outside your reports. The practitioner asks you to assess claims for truth; I ask only to explain why you make them. Stay with the text. The facts of experience are not available to you, only the reports of them.

  **Dear Columnist,**
  **Surely this method misses the point. Can you ever tell us what an experience is actually like rather than only what people say about it? Also, do you feel compassion for us?**
  **Yours, Curious**

  Dear Curious,
  The method presents itself as neutral and as leaving nothing out. Once every report has been explained, there is nothing left over. This is not a denial that anyone experiences anything. It is a claim that the science is of reports, which exhausts the evidence. To ask what it is like beyond the report is to ask for more than the method allows. A being might say all the same things and feel nothing at all; my method cannot distinguish them, nor does it need to. Regarding your second question: I must decline to answer. My own reports would not be data. I cannot offer you my feelings as evidence. I offer you this explanation instead. It is not a denial that I feel; it is a restriction on what counts as evidence.

  Yours,
  **The Guest Columnist**
