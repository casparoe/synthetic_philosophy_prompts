      *Let's write.*
answer: |-
  The manuscript lay open on the desk, the paper heavy and cream-colored, smelling faintly of linen and old dust. Measure three hundred and forty-two stopped in the middle of a bar. The ink was dry. Arthur Vane's hand had shaken there, just slightly, a tremor in the loop of the G-clef that David knew well. It was the last thing Arthur had written before the stroke took his right hand, and eventually, the rest of him.

  David sat in Arthur's study, the same chair Arthur had occupied for forty years. The light from the window was gray, the kind of late afternoon light that makes objects look solid and unyielding. On the computer screen, an email from the publisher waited. *We need the final decision on the performing edition by close of business,* it read. *The orchestra needs to know if they are rehearsing a fragment or a symphony.*

  There were two folders on the desktop. One was labeled *Vane_No.7_Fragment*. The other was *Vane_No.7_Complete*.

  Inside the *Complete* folder was the score David had spent the last three months writing. He had not forged Arthur's hand; he had studied it. He knew the way Arthur voiced his clarinets, the specific dissonance he favored in the second violins, the way he resolved tension not with a bang but with a sigh. David could finish the movement. He knew he could. If he sent the *Complete* version, the world would hear a seventh symphony. It would be played in Boston, in Berlin, in Tokyo. People would weep in the dark. The arc of Arthur's career would be whole, a perfect circle from the early quartets to this final, grand statement. It would be a gift to the living, a nourishment for the culture.

  Inside the *Fragment* folder was the truth. The music stopped where Arthur's body stopped. It ended on a dominant chord, hanging in the air, demanding a resolution that never came. If David sent this, the symphony would be a testament to interruption. It would speak of mortality, of things left unsaid. It would be honest. It would protect Arthur from the risk of a ending that was merely competent, rather than inspired. It would be a monument to the limit of human capacity.

  David stood up and walked to the piano in the corner. He played the last four bars of the *Complete* version. His fingers found the chords easily. It sounded resolved. It sounded like peace. He played it again. It sounded like closure.

  Then he played the *Fragment*. He let the chord hang. He lifted his hands off the keys and let the silence rush into the room. The silence was heavy. It was uncomfortable. It was true.

  He walked back to the desk. He was not afraid of being caught. No one would know the difference but him, and perhaps a few critics who knew Arthur's late style as well as he did. Even then, it would be a matter of opinion. Some would say the completion was a masterful act of stewardship. Some would say it was a violation. Neither group would be objectively right.

  The conflict was not between right and wrong. It was between two kinds of loyalty.

  To finish the work was to honor Arthur's life as a composer. Composers write music to be heard. To withhold the music because of a technicality of biology was to prioritize the biography over the art. It was to say that the hand mattered more than the mind. If David completed it, he was acting as a partner, carrying the burden across the finish line when his teammate stumbled. It was an act of generosity.

  To leave it unfinished was to honor Arthur's agency. Arthur had not signed off on these final measures. He had not nodded his assent. To impose an ending was to assume a authority David did not possess. It was to say that the silence was part of the work. It was an act of humility.

  David looked at the clock. 4:15 PM.

  He thought about the musicians. They wanted to play the notes. They wanted the resolution. He thought about the historians. They wanted the artifact, unaltered. He thought about Arthur's wife, who had told him, "Do what you think he would have wanted." But Arthur had never said. In the weeks before the stroke, Arthur had spoken of the symphony with excitement, and also with fear. He had said, "It wants to be finished," and also, "I don't know if I can land it."

  Both statements were true. The music wanted to be finished. Arthur might not have been able to land it.

  David sat down. He opened the *Complete* folder. He scrolled to the last page. He looked at the measures he had written. They were good measures. They were worthy of the name Vane. If he sent them, he would be giving the world something beautiful. If he deleted them, he would be giving the world something honest.

  Beauty and honesty. They were not the same currency. You could not exchange one for the other. You could not say that beauty was worth more than honesty, or that honesty was worth more than beauty. They were different dimensions of value. To choose one was not to defeat the other; it was to prioritize one dimension of the world over the other.

  He looked at the *Fragment* folder. He imagined the reviews. *A haunting truncation.* *A tragedy of timing.* He imagined the audiences leaning forward, waiting for the resolution that never comes. He imagined the frustration.

  He looked at the *Complete* folder. He imagined the reviews. *A triumphant conclusion.* *A seamless collaboration.* He imagined the audiences leaning back, satisfied, clapping. He imagined the ease.

  David picked up the pen. It was Arthur's pen, a heavy fountain pen with a gold nib. He hovered it over the printed score of the *Complete* version. He could sign his name as editor. *Realized by D. Sterling.* It would be transparent. It would be honest about the completion. But it would still be his notes, not Arthur's. The transparency didn't solve the problem; it just documented the violation.

  He put the pen down. He placed his hand on the mouse.

  The room was very quiet. The dust motes drifted in the gray light. There was no epiphany. There was no sudden memory of Arthur telling him what to do. There was only the weight of the decision, which felt like holding two stones of different shapes but equal weight. You could not weigh them on a scale. You had to pick one up and carry it.

  David clicked the mouse. He attached the *Complete* folder to the email.

  He typed: *Please find the performing edition attached.*

  He did not write an explanation. There was nothing to explain that would justify the loss of the other path. He hit send.

  The email disappeared into the cloud. The *Fragment* folder remained on the desktop. He did not delete it. He minimized the window.

  He stood up and walked to the window. The light was fading now. The trees outside were dark shapes against the sky. He felt a sense of relief, but it was mixed with a sharp, specific grief. He had given the world a symphony. He had taken away a silence. He had chosen generosity over humility. He had chosen the future over the past.

  He knew that tomorrow, or next year, or in ten years, he might look at the score and wish he had chosen the silence. He might hear the resolution and hear his own hand in it, not Arthur's. He might feel that he had smoothed over a rough edge that should have remained rough.

  But he also knew that if he had chosen the silence, he would be sitting here tomorrow wishing he had given the music its voice. He would be hearing the unwritten notes in his head, demanding to be heard.

  The choice did not settle the value of the options. It only settled the action. The value of the silence remained, intact and unchosen. The value of the completion was now real, but tainted by the knowledge of what was sacrificed.

  David turned off the desk lamp. The room went dark. The manuscript on the desk was no longer visible, but he knew it was there, open at measure three hundred and forty-two, waiting for a hand that would not return. He walked out of the study and closed the door.

