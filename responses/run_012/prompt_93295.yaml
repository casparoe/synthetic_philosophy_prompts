      *   **Topic:** Satire of the counterfactual account of causation by omission (philosophical/legal concept).
      *   **Format:** Deadpan Notice to Residents.
      *   **Sender:** Fictional municipal Office of Omission Liability.
      *   **Length:** 550–650 words.
      *   **Tone:** Flat, procedural, unironic (no winking at the reader).
      *   **Key Philosophical Concepts to Incorporate:**
          *   Collapse of doing/allowing distinction.
          *   Regress problem (everyone is liable for everything they didn't prevent).
          *   But-for test inability to draw lines.
          *   Ontological worry (omissions aren't events).
          *   Pre-existing duty to act (as a flawed marker).
      *   **Goal:** Make it recognizable to someone working on the debate (wince in recognition, not embarrassment).

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Counterfactual Causation:* If X hadn't happened, Y wouldn't have happened. Applied to omission: If I *had* acted, Y wouldn't have happened. Therefore, my not-acting caused Y.
      *   *Doing/Allowing:* Usually, doing harm is worse than allowing it. This view collapses them. Not saving someone is equivalent to killing them.
      *   *Regress:* If I didn't prevent a flood, I caused it. But I also didn't prevent the rain, didn't prevent the levee breaking, didn't prevent someone else from fixing it. Everyone is liable for everything they didn't stop.
      *   *But-For Test:* "But for" my inaction, the harm wouldn't exist. This applies to literally every non-action.
      *   *Ontology:* Is "not doing something" an event? It's hard to locate in space-time. The notice should treat it as a tangible administrative unit.
      *   *Duty:* Usually, law limits liability to those with a duty of care. The satire should show how arbitrary or expansive this duty is defined to manage the regress.

  3.  **Drafting - Section by Section:**

      *   **Header:** Official looking. Office of Omission Liability. Notice No. [Something].
      *   **Opening:** Acknowledge the citation context (like the prompt's scenario). State the purpose: clarifying liability computation.
      *   **The Theory (But-For & Counterfactuals):** Explain that failure to act is treated as action. Use dry language. "Negative actuation."
      *   **The Regress/Volume:** Address the sheer number of omissions. Acknowledge the file size issue but dismiss it as a feature, not a bug.
      *   **Ontology:** Address the "is nothing something?" worry. Bureaucratic solution: It's recorded as a null-event.
      *   **Duty:** Explain how duty is assigned. Maybe it's universal now.
      *   **Appeals:** How to appeal an omission? You can't prove you would have acted.
      *   **Closing:** Compliance warning.

  4.  **Drafting - Word Count & Tone Check:**
      *   Need to stay between 550-650 words.
