      *   *Option B (Functional/Attitudinal):* Pleasure is wanting something to continue, or taking attitude X toward experience Y. *Challenge:* Might lose the "feel" of hedonism.
      *   *Option C (Cluster/Jade):* It's a disjunctive kind. *Challenge:* Makes aggregation and trade-offs difficult (how to weigh jadeite vs. nephrite?).
      *   *Option D (Measurement/Operational):* Who cares what it *is*, can we measure the *magnitude*? *Challenge:* Measurement without ontology is shaky (what are we measuring?).

  3.  **Evaluate the Foundation's Constraints & Opportunities:**
