answer: |-
  The room smelled of ozone and old carpet, the kind of basement space that feels pressurized when eight people stop talking. On the far wall, a digital counter glowed red, currently reading zero. Below it sat a row of eight consoles, each with a single black button and a small screen displaying the current pot value. Silas stood by the door, arms crossed, watching them the way a watchmaker watches a clock he suspects is lying about the time. He had put up the money himself, ten thousand dollars wired into the account an hour ago, but the terms were specific. The entry fee was two thousand. Anyone who pressed the button paid the fee and became a claimant. At the end of ten minutes, the pot would be divided equally among the claimants. If you didn't press, you paid nothing and got nothing. If the math left you with a negative balance, you owed the difference. If the pot remained unclaimed, it vanished back into the university endowment, and Silas lost nothing but the afternoon.

  There were six minutes left on the timer. Marcus had his hands flat on the table, fingers spread, as if trying to feel a vibration from the wood. He was looking at Jenna, who was leaning back in her chair with her feet up on the console next to her. Toby was flipping a coin, the metallic clink ringing out every few seconds, catching it, slapping it onto the back of his wrist without looking.

  If I press, Marcus said, his voice too loud for the room, then you press.

  Jenna didn't look at him. Why would I do that?

  Because you're thinking what I'm thinking. We're all reading the same books. We're all sitting in the same chairs. If I decide the rational move is to press, then you've already decided the same thing. We're mirrors. If I break, we all break.

  So you're saying we're a hive mind now? Jenna laughed, but it was tight. I'm not you, Marcus. I have rent due. If you decide to be noble and sit on your hands, that's your funeral. I'm not going to let your morality cost me eight thousand dollars.

  It's not morality. It's arithmetic. If we all press, we all lose seven hundred and fifty dollars. The pot splits eight ways, the fee is fixed. We all go into the hole. If we all abstain, we walk away at zero. Zero is better than negative.

  Zero is boring, Jenna said. She dropped her feet to the floor. And you're assuming you can speak for me. You think because you run the calculation, I run the same one and get the same result. But maybe I run it and decide I like risk. Or maybe I think you're going to chicken out, which means I should press.

  If you think I'll chicken out, then you think I've already done the math and decided not to press. So you know the pot is available for the taking. But if you know that, then you know everyone else knows it. Then everyone presses. Then we all lose.

  You're going in circles, Marcus.

  I'm going up a ladder.

  Toby stopped flipping the coin. He held it up, heads glinting under the fluorescent hum. There's a third way, he said. We don't decide yes or no. We decide a probability. If we all agree to press with a ten percent chance, the expected value maximizes without guaranteeing the crash. It's a mixed strategy equilibrium.

  Marcus turned on him. You can't agree to that. We can't talk. Silas said no communication.

  I'm not talking to you. I'm talking to the air. I'm saying that if I choose to randomize, I'm acknowledging that I can't control your output, only my own distribution. I flip this. Heads, I press. Tails, I walk. If everyone does this, the odds of a catastrophic overload drop to negligible.

  That's just cowardice with extra steps, Jenna said. You're trying to hedge your soul.

  It's honesty, Toby said. He flipped the coin. It spun, a silver blur. He caught it and held it there, covered by his palm. He didn't look at it yet.

  Silas pushed off the doorframe and walked to the center of the room. He didn't look at the students. He looked at the counter. It still read zero. You realize, he said, that the pot isn't static. Every minute that passes without a claim, I deduct five hundred dollars for administrative decay. You're burning the money by thinking.

  That's a threat, Marcus said.

  It's a variable, Silas said. Now you have to factor in the decay against the risk of overcrowding. Does that change the symmetry? If I'm losing money every second, am I still your mirror? Or am I the house?

  He went back to the wall and leaned against it, pulling a notebook from his pocket. He started writing, but he wasn't looking at the paper. He was watching Jenna's hand. She had moved it closer to the button. Her index finger hovered an inch above the black plastic.

  Marcus was sweating. He kept looking at the timer. Four minutes. If he pressed, he risked the collective loss. If he didn't, he risked being the sucker who walked away while someone else took the pot. But the superrational claim was that there was no someone else. There was only the method. If the method said press, everyone pressed. If the method said wait, everyone waited. The only way to win was to ensure the method said wait. But how do you force the method to say wait when the prize is right there?

  You're doing it again, Jenna said. You're trying to think for me.

  I'm thinking for us.

  There is no us. There's me, and there's you, and there's six other people who might not care about your beautiful logic. If I press and you don't, I win big. If I press and you do, we split the loss. But if I don't press and you do, I get nothing and you get rich. I'm not going to leave my wealth up to your consistency.

  So you admit it's about wealth, not truth.

  It's all truth is.

  Toby lifted his hand. He looked at the coin under his palm. He took a breath and slid his hand away. Tails. He exhaled, a sharp sound, and moved his hand away from the button. He was out. He folded his arms and watched the others. He had surrendered his agency to the flip and the flip had said no. He looked relieved, as if he'd been holding a heavy weight.

  Marcus saw this. He saw Toby opt out. Did that break the symmetry? Toby was rational too. If Toby flipped tails, does that mean the universe wants me to press? Or does it mean Toby is the outlier, the noise in the signal? If Toby is noise, then the mirror is cracked. If the mirror is cracked, the superrational argument fails. If it fails, then I should press.

  Marcus's finger twitched.

  Jenna saw the twitch. She smiled, a small, sharp thing. She knew what he was thinking. He was looking for an excuse to defect. He wanted the symmetry to break so he could take the money without breaking his own rules. She didn't care about the rules. She cared about the rent. She pressed her button.

  The counter clicked. One.

  The room went very quiet. The red number glowed. One claimant. Jenna.

  Marcus stared at the number. If he pressed now, he would split the pot two ways. Five thousand each. Minus the two thousand fee. Three thousand profit. It was still positive. The catastrophe was avoided. Jenna had defected, but she hadn't triggered the collapse. She had bet on the others being too noble to follow.

  You see? Jenna said. I'm rich. You're still virtuous.

  Marcus looked at his hand. He could still press. He could salvage something. But if he pressed, he validated her move. He proved that the symmetry was an illusion. He proved that she was right to treat him as a separate entity. If he pressed, he was just another defector, late to the party. If he didn't, he was the control group.

  He left his hand on the table.

  Three minutes left. Silas stopped writing. He looked at the counter. One. He tapped his pen against his notebook. He had bet against them. He had put up the ten thousand knowing that if they coordinated, he would lose the pot to the endowment. If they defected, he kept the entry fees minus the payout. With one claimant, he paid out five thousand. He collected two thousand from Jenna. He was down three thousand on the night, plus the administrative decay. But if Marcus pressed, Silas would pay out another five thousand. He would be down six thousand. If everyone pressed, Silas would collect sixteen thousand in fees and pay out ten thousand. He would profit six thousand.

  Silas wanted them to defect. He needed them to defect to balance his own grant ledger. But he needed them to believe they were cooperating to prove his thesis. He needed them to be wrong about their own goodness.

  Why aren't you pressing, Marcus? Silas asked. You could still make three thousand.

  Because then I'm just like her, Marcus said.

  No, Silas said. Then you're just like a person who wants money. There's no shame in that. The shame is in pretending you're a algorithm when you're just a man.

  Toby was watching Silas. He noticed the way Silas checked his watch, not against the timer on the wall, but against his own wrist. He noticed the notebook. Silas wasn't recording their reasoning. He was recording the payouts.

  You're betting against the pot, Toby said.

  Silas didn't look up. I'm funding the experiment.

  You're hedging. If we all cooperate, you lose the principal. If we all defect, you profit. You want us to fail.

  I want to see what you are.

  Then you're not a neutral observer. You're a player.

  Silas closed the notebook. If I'm a player, then the symmetry expands. You have to model me too. If I want you to defect, and you know I want you to defect, does that make you want to cooperate? Or does it make you want to give me what I want so I stop asking?

  Marcus looked at Silas, then at Jenna, then at the counter. The number was still one. The decay ticked over. The pot dropped by five hundred. Nine thousand five hundred. If he pressed now, the split was forty-seven fifty each. Profit twenty-seven fifty. It was shrinking.

  Jenna leaned forward. Press it, Marcus. Take the money. Buy yourself a drink. Stop trying to save us. We don't want to be saved. We want to be paid.

  Marcus looked at the button. It was matte black, unmarked. It didn't look like a trap. It looked like a choice. If he pressed, he admitted that the group was not a single mind. He admitted that Jenna was distinct from him. If he didn't press, he maintained the fiction that they were linked, that his restraint could somehow retroactively justify her greed.

  He thought about the city outside. If this room were a city, if the counter were a million people, his single press wouldn't matter. But here, with eight people, his press mattered. It changed the average. It changed the outcome. Superrationality works best when the sample is large enough to smooth out the noise, but small enough to feel the connection. Eight was the worst number. Large enough to be anonymous, small enough to be personal.

  Two minutes.

  Toby picked up his coin again. He didn't flip it. He just held it. He was watching Silas's hand. Silas had put his hand in his pocket. He was holding something. A remote? A phone?

  If you press, Silas said, I end the game early. I lock the counter. No one else gets a chance.

  That's not in the rules, Marcus said.

  I'm the organizer. I can change the variables.

  So if I press, you steal the rest of the time?

  I secure the result.

  Jenna laughed. He's bluffing. He wants us to press so he can close the book.

  Marcus looked at Silas. Silas looked back. There was no malice in Silas's eyes, only a cold curiosity. He was waiting to see if Marcus would break the symmetry to save Silas money, or break the symmetry to save himself money. Either way, the symmetry was dead.

  Marcus stood up. He walked to the console. He placed his hand over the button. He didn't press it. He just hovered there. He looked at Jenna. She was watching him, her smile gone. She wanted him to press so she wasn't the only greedy one. She wanted him to validate her.

  If I press, Marcus said, you win.

  I already won, Jenna said.

  No. If I press, you're not a defector. You're a pioneer. If I don't, you're the only one who took the risk. You carry the weight alone.

  I don't want the weight. I want the cash.

  Then you should have stayed home.

  Marcus pulled his hand back. He sat down.

  Jenna stared at him. You're insane.

  Maybe.

  One minute.

  Toby flipped the coin. He didn't look at it. He let it fall on the table. It rolled, wobbled, and settled. Heads. He looked at it. He looked at the button. He had already opted out once. Did the second flip count? The rules didn't say one flip. The rules said decide. He had decided via coin. The coin said yes this time.

  He pressed the button.

  The counter clicked. Two.

  The pot was nine thousand. Split two ways. Forty-five hundred each. Minus the fee. Twenty-five hundred profit each.

  Jenna let out a breath she'd been holding. She wasn't the only one anymore. Her risk was diluted.

  Marcus watched the number change. Two. The symmetry was broken twice now. Once by greed, once by chance. He had held the line. He had zero dollars. He had his integrity, which was worth nothing in the room.

  Silas pushed off the wall. He walked to the console and pressed a key on his own panel. The timer stopped at thirty seconds. The game was over.

  He walked to the center of the room and looked at the counter. Two claimants. He would pay out nine thousand. He had collected four thousand in fees. He was down five thousand. He had lost money. He had wanted them to defect, to fill the room, to validate the model of human selfishness. They hadn't. They had mostly held back. One greed, one chance, six restraint.

  He opened his notebook and tore out the page. He handed it to Marcus.

  What's this? Marcus asked.

  The loss, Silas said. My loss. I bet against you. I thought you'd all press. I structured the pot so I'd profit if you were rational actors maximizing individual utility. You weren't. You were something else.

  Superrational, Marcus said.

  No, Silas said. Just quiet.

  He turned to Jenna. You made the most sense. You understood the game was about you, not the group.

  I understand money, Jenna said. She was looking at her screen, calculating the transfer.

  Silas looked at Toby. And you understood that certainty is a trap.

  I understood I didn't want to decide, Toby said.

  Silas put the notebook in his pocket. He looked at the counter one last time. The number two glowed red. It wasn't zero. It wasn't eight. It was just a number. He turned off the lights in the room, leaving only the glow of the consoles and the counter. He walked to the door and held it open.

  You can go, he said. The transfer will process overnight.

  They stood up. Jenna was the first out, checking her phone for the notification. Toby followed, pocketing his coin. Marcus lagged behind. He looked at the button one more time. He could still press it, technically. The system was on. But Silas was watching him from the doorway.

  Marcus left the button alone. He walked out into the hallway where the air was cooler. Jenna was already arguing with Toby about whether the second flip counted as a new decision or part of the same strategy. Silas locked the door behind them and walked the other way, toward the finance office, to sign the papers for the loss. The counter stayed on in the dark room, the red number burning into the empty air, waiting for someone to come back and change it.
