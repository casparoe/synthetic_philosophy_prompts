answer: |-
  Here is a specification of desiderata for a theory of animal consciousness, drafted for your reading group. I have kept the tone direct and the focus on the constraints rather than the contenders, as requested.

  ### The Desiderata Specification

  Any theory claiming to map the distribution of consciousness across the animal kingdom must satisfy the following conditions. I have distinguished between **Genuine Requirements** (conditions needed for the theory to function as intended) and **Camp Prejudices** (conditions that smuggle in a specific philosophical or biological bias).

  #### 1. The Non-Reporter Constraint
  *   **Specification:** The theory must yield a verdict for organisms incapable of linguistic report or complex training (e.g., honeybees, decapod crustaceans, human infants, non-communicative patients).
  *   **Motivation:** If a theory defines consciousness in terms of capacities only available to adult humans (like verbal report), it is a theory of *reporting*, not consciousness. It renders the question of animal minds tautological.
  *   **Status:** **Genuine Requirement.** Without this, the theory cannot address the group's core question.

  #### 2. The Convergent Evolution Constraint
  *   **Specification:** The theory must account for similar behavioural profiles arising from radically different neural architectures (e.g., mammalian neocortex vs. avian pallium vs. cephalopod vertical lobe).
  *   **Motivation:** Evolution solves problems repeatedly using different hardware. A theory that locates consciousness strictly in mammalian-specific anatomy (e.g., "layer 5 pyramidal neurons") implies that birds and octopuses are philosophical zombies despite complex behaviour, which risks lineage chauvinism.
  *   **Status:** **Genuine Requirement.** Biology dictates multiple realizability; the theory must respect this.

  #### 3. The Action-Guiding Constraint (Usability)
  *   **Specification:** The theory must provide criteria that can be operationalised for policy, welfare, and research regulation within a reasonable timeframe.
  *   **Motivation:** The point of this exercise is not merely metaphysical truth but ethical decision-making. A theory that concludes "we can never know" is scientifically honest but ethically useless.
  *   **Status:** **Genuine Requirement.** Given the stakes (farming, experimentation), pragmatism is a valid constraint.

  #### 4. The Gradient vs. Boundary Constraint
  *   **Specification:** The theory must explicitly state whether consciousness is binary (on/off) or graded (more/less), and if binary, where the threshold lies.
  *   **Motivation:** Welfare law typically requires a binary decision (protected/not protected), but neuroscience suggests continuous variables (integration, complexity). The theory cannot dodge this tension.
  *   **Status:** **Genuine Requirement.** Ambiguity here paralyses decision-making.

  #### 5. The Non-Accidental Constraint
  *   **Specification:** The necessary conditions for consciousness cannot rely on features that appear to be phylogenetic accidents of the human lineage (e.g., specific neurotransmitter subtypes found only in primates).
  *   **Motivation:** To avoid "carbon chauvinism" or "vertebrate chauvinism." Consciousness should depend on computational or functional roles, not historical accidents of our specific evolutionary branch.
  *   **Status:** **Camp Prejudice (Functionalism).** Biological Naturalists would argue consciousness *is* a biological feature, like digestion, and depends on specific substrate. This is a theoretical battleground, not a neutral starting point.

  #### 6. The Friend's Constraint I: Substrate Independence
  *   **Specification:** If two systems are functionally identical (same inputs, outputs, and internal causal relations), they must have the same consciousness verdict, regardless of biological material.
  *   **Motivation:** If the verdict changes when swapping biology for silicon (or vice versa) while keeping function constant, the theory is tracking the *stuff* rather than the *experience*.
  *   **Status:** **Camp Prejudice (Functionalism).** This is the core axiom of computationalism. It is directly contradicted by Biological Naturalism (e.g., Searle), which holds that causal powers of the brain are essential. It belongs on the list as a *test*, but it is not a neutral requirement; it is a vote for one side of the metaphysical debate.

  #### 7. The Friend's Constraint II: The Unrolled Table Challenge
  *   **Specification:** If a theory claims consciousness depends on recurrent processing or complexity, it must explain why a "look-up table" (a system that mimics the input/output of that processing via pre-computed rules without recurrence) is not also conscious, or admit that behaviour alone cannot verify the theory.
  *   **Motivation:** This prevents the theory from collapsing into behaviourism. If you say "recurrence causes consciousness," but a non-recurrent table does the same job behaviourally, how do you distinguish them empirically?
  *   **Status:** **Genuine Requirement (Consistency Check).** This is a logical stress test for functionalist theories. If a theory cannot distinguish between a process and a simulation of that process's output, it lacks explanatory power.

  ---

  ### The Incompatibilities: What Cannot Be Had Together

  You suspected there is a conflict. There is not just one; there is a trilemma. You cannot satisfy **Verification**, **Generality**, and **Precision** simultaneously.

  1.  **Verification (Action-Guiding):** We need to measure consciousness to make laws.
  2.  **Generality (Convergent Evolution/Non-Accidental):** We cannot rely on human-specific biology.
  3.  **Precision (Binary Boundary):** We need a clear line for welfare.

  **The Conflict:**
  If you prioritise **Verification**, you usually rely on behaviour. But if you rely on behaviour, you fall foul of the **Friend's Constraint II (Look-up Table)**. You cannot distinguish a conscious agent from a sophisticated mimic without looking inside.
  If you look inside to avoid the Look-up Table problem, you must rely on **Biology**. But if you rely on Biology, you struggle with **Generality** (birds/octopuses look different from mammals).
  If you solve Generality by moving to abstract **Function** (Friend's Constraint I), you lose **Verification** (we cannot easily measure "function" in a wild crab without anthropomorphising) and you alienate the Biological Naturalists.

  **The Jointly Unsatisfiable Subset:**
  The subset comprising **(1) The Action-Guiding Constraint**, **(2) The Friend's Constraint I (Substrate Independence)**, and **(3) The Friend's Constraint II (Look-up Table)** is mutually unstable.
  *   To be Action-Guiding, you need observable markers.
  *   To satisfy Substrate Independence, you must ignore the specific markers and look at abstract function.
  *   But the Look-up Table challenge proves that abstract function (input/output) is insufficient to guarantee the internal mechanism required for experience.
  *   *Result:* You either sacrifice usability (because you can't check the function), sacrifice substrate independence (by insisting on specific biology), or sacrifice the intuition that look-up tables aren't conscious.

  ---

  ### The "Killer" Requirement

  You asked which single requirement does the most work in throwing out popular theories.

  It is not the Non-Reporter Constraint. Many theories (like Global Workspace Theory) manage to adapt to non-reporters by looking for "ignition" signatures rather than speech.

  The killer is **The Action-Guiding Constraint (Usability)**.

  Most philosophical theories of consciousness (Integrated Information Theory, Higher-Order Thought, Biological Naturalism) are designed to be *true*, not *useful*.
  *   **IIT** often implies consciousness is everywhere (panpsychism) or in weird places, making welfare decisions impossible (do we ban walking on grass?).
  *   **Higher-Order Thought** excludes almost all animals, which solves the line problem but fails the Convergent Evolution constraint.
  *   **Sceptical Agnosticism** satisfies the epistemic humility but fails the Action-Guiding constraint completely.

  A theory that says "Consciousness is a gradient of integrated information" is scientifically interesting. But when a regulator asks, "Does this slaughter method cause suffering to a lobster?", a gradient theory that cannot map its units to a legal threshold is useless. The demand for a *decision procedure* eliminates nearly all metaphysical accounts.

  ---

  ### Honesty Check: What I Would Drop

  If someone leaned on me, here is where I would yield:

  1.  **I would drop Friend's Constraint I (Substrate Independence) first.**
      *   *Why:* It is the most contentious. It is entirely possible that consciousness is a biological phenomenon, like photosynthesis. Photosynthesis cannot be realised in silicon; it requires specific chemical reactions. If consciousness is like that, demanding substrate independence is a category error. Dropping this allows for Biological Naturalism to remain in the conversation without being ruled out by fiat.
      *   *Consequence:* This opens the door to "mammal-centrism" accusations, but it grounds the theory in physical reality rather than abstract computation.

  2.  **I would soften The Action-Guiding Constraint.**
      *   *Why:* Demanding a theory that solves welfare policy *now* might force us to accept a bad theory just because it is decisive. It is better to have a true theory that is hard to apply than a false theory that is easy to apply. We can use precautionary principles for policy while the science catches up.
      *   *Consequence:* This admits that the reading group might not solve the policy problem immediately.

  **What would change my mind?**
  If a theory could demonstrate a **Neural Correlate of Consciousness (NCC)** that is both **functionally abstract** (satisfying Generality) and **physically measurable** (satisfying Verification) without falling into the Look-up Table trap. Currently, no theory has done this. Until one does, the conflict between *knowing* (epistemology) and *being* (ontology) remains the bottleneck.

  ### Summary for the Group
  We are going in circles because we are trying to satisfy the **Non-Reporter Constraint** (science) and the **Action-Guiding Constraint** (ethics) while disagreeing on the **Substrate Independence Constraint** (metaphysics).

  *   If you prioritise Ethics, you risk false positives (granting rights to thermostats).
  *   If you prioritise Science, you risk false negatives (denying experience to fish).
  *   If you prioritise Metaphysics, you risk irrelevance (solving the puzzle but changing nothing).

  Pick two. You cannot have all three.
