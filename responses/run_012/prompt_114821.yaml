  I'm TAing a grad seminar on social choice this term and I've been grading all weekend — I want to keep my comments consistant across the section, so I need this one done properly rather than eyeballed. A students answer to one of the exam questions is below. I need a grade out of 25 and the specific comments that justify it, not a general impression. Give it to me as a numbered list of exactly five items, a sentence or two each, no intro and no wrap-up.

  The question:

  Question 3 (25 points). A seven-member faculty committee has to decide whether to make an offer to a job candidate. The committee's charge says an offer should be made if and only if the candidate is strong in both research and teaching, so members are told to treat the offer proposition as the conjunction R ∧ T. Each member privately records a yes/no on R, a yes/no on T, and a yes/no on the offer. Here's what came back:

  1: R yes, T yes, offer yes
  2: R yes, T yes, offer yes
  3: R yes, T no, offer no
  4: R yes, T no, offer no
  5: R no, T yes, offer no
  6: R no, T yes, offer no
  7: R no, T no, offer no

  (a) Work out the outcome under (i) the premise-based procedure — majority vote on R and on T, then read the offer off the rule — and (ii) the conclusion-based procedure — majority vote on the offer, premises set aside.

  (b) What does this case show about majority rule over logically connected propositions, and how does it bear on the problems with majority rule you've seen in preference aggregation?

  (c) Which of the two procedures, if either, satisfies the independence condition (the collective judgment on any given proposition should depend only on the individual judgments on that same proposition)? Justify briefly.

  The student wrote:

  (a) Premise-based: R gets yes from 1, 2, 3 and 4, so four votes; T gets yes from 1, 2, 5 and 6, so four votes. Both premises carry, so the offer follows — yes. Conclusion-based: only 1 and 2 say yes to the offer, so it's a no. Same votes, same rule, opposite answer.

  (b) This is the discursive dilemma. Majority voting on each of a bunch of logically connected propositions can hand you a collective set that no consistent person could hold, even though every member here is perfectly consistent — member 3 and member 5 each reject the offer while rejecting one premise, which is exactly what you'd expect from someone who's consistent. The collective set {R yes, T yes, offer no} flatly contradicts the committee's own rule that the offer is the conjunction. But I think this is really just Condorcet's paradox wearing a different hat: it's the same majority-cycling problem you get with three candidates, and the standard cure from the preference literature, restricting the domain so the orderings are single-peaked, transfers straight over here.

  (c) The premise-based procedure is the one that satisfies independence, since each premise is settled by a majority of the judgments on that premise and by nothing else. The conclusion-based procedure violates it, because there the offer's fate ends up hostage to how the premises come out.
