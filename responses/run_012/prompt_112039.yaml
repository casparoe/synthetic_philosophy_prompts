  **DSM-7 Field Trial Draft 0.4 — Proposed New Category**
  **Code: 300.19 (PCID)**
  **Condition: Persistent Contextual Integration Disorder**

  *Proposed Diagnostic Criteria:*
  A. A pervasive inability to modulate affective tone following a shift in environmental context (e.g., workplace to residence), persisting for a minimum of 90 minutes.
  B. Intrusive sensory retention from the prior context (auditory, visual, or tactile hallucinations of the prior setting) occurring at least 4 times per week.
  C. The symptoms cause clinically significant distress or impairment in social, occupational, or other important areas of functioning.
  D. The disturbance is not better explained by Post-Traumatic Stress Disorder, Autism Spectrum Disorder, or a psychotic disorder.
  E. Onset typically occurs in early adulthood (ages 22–35).
  F. Presence of "transition latency," defined as a period of immobilization or silence between contexts.
  G. Symptoms persist for at least 6 months.
  H. Exclusion of substance-induced etiologies.

  *Work Group Note:* Criterion F was contested. Dr. V. argued that immobilization is a symptom of depression, not PCID. Dr. L. countered that the *intent* of the immobilization is contextual flushing, not anhedonia. Vote pending.

  ***

  **Patient Journal: Elena R.**
  **January 14**

  I don't know what to call it. It's not burnout. Burnout is being tired. This is being stuck. I left the office at 5:30. I got into my car. I sat there in the parking garage until 7:00. I wasn't crying. I wasn't thinking. I was just listening to the hum of the ventilation system in my head. It was louder than the car engine. When I finally drove home, I walked into the kitchen and asked my husband where the quarterly reports were. He looked at me like I was a ghost. I could still feel the keyboard under my fingers while I was chopping carrots. The keys were hard plastic. The knife was steel. My brain wouldn't let go of the plastic.

  ***

  **Clinical Intake Note: Aris Thorne, LMHP**
  **Date: January 22**
  **Patient: Elena R.**
  **Session: 1**

  Patient presents with high-functioning anxiety, reports inability to "switch off" work mode. Describes sensory carryover (hearing office sounds at home). Sleep hygiene is poor. She describes sitting in her car for hours to avoid bringing the "office air" into the "house air."

  *Assessment:* Rule out Generalized Anxiety Disorder. Rule out OCD. Patient resists OCD label; insists compulsions are contextual, not intrusive thoughts. She says, "I'm not afraid of germs, I'm afraid of the meeting."

  *Plan:* Begin symptom tracking. Introduced concept of "transition periods." Insurance requires a code for coverage. Will monitor for PCID criteria match if draft passes.

  ***

  **Patient Journal: Elena R.**
  **February 10**

  I found the draft online. There's a forum, r/ContextBleed. People are posting checklists. I match A, B, C, F, G. I don't match D because I've never been diagnosed with PTSD, but sometimes I feel like the office is a trauma site. Is that allowed?

  I tried to explain Criterion F to Mark. "Transition latency." He said, "You just sit in the car." I said, "It's not just sitting. It's decompression." He said, "It's avoidance."

  I started washing the car. Every day before I come inside. Not just a rinse. I wipe the steering wheel with disinfectant. I vacuum the floor mats. If I don't, I feel like I'm tracking the data onto the carpet. It takes twenty minutes. It wasn't in the checklist. But when I do it, the ventilation hum stops.

  ***

  **DSM-7 Field Trial Draft 0.7 — Proposed New Category**
  **Condition: Persistent Contextual Integration Disorder (PCID)**

  *Proposed Diagnostic Criteria:*
  A. A pervasive inability to modulate affective tone following a shift in environmental context, persisting for a minimum of 90 minutes.
  B. Intrusive sensory retention from the prior context occurring at least 4 times per week.
  C. The symptoms cause clinically significant distress or impairment in social, occupational, or other important areas of functioning.
  D. The disturbance is not better explained by Post-Traumatic Stress Disorder, Autism Spectrum Disorder, or a psychotic disorder.
  E. Onset typically occurs in early adulthood (ages 22–35).
  F. Presence of "transition latency," defined as a period of immobilization, silence, or **ritualized cleansing behavior** between contexts.
  G. Symptoms persist for at least 6 months.
  H. Exclusion of substance-induced etiologies.

  *Work Group Note:* Criterion F revised based on Field Trial Data Set 4. 34% of provisional patients reported "decontamination rituals" specific to transitional spaces (vehicles, entryways). Dr. V. abstained. Concern raised regarding iatrogenic reinforcement of rituals. Majority ruled rituals are descriptive, not prescriptive.

  ***

  **Clinical Follow-up Note: Aris Thorne, LMHP**
  **Date: March 15**
  **Patient: Elena R.**
  **Session: 3**

  Patient reports improvement in "context separation." Notes significant reduction in sensory retention (Criterion B). However, transition latency (Criterion F) has increased from 20 minutes to 45 minutes. Patient describes extensive cleaning regimen for vehicle interior.

  When asked if the cleaning feels compulsive, patient states, "It's part of the protocol. If I skip it, the bleed happens."

  *Observation:* Patient seems relieved to have a framework, but behavior is rigidifying. She brought a printout of Draft 0.7. She had highlighted Criterion F. She asked if the insurance will cover "transition support" if the ritual is documented as a symptom.

  *Plan:* Validate distress. Caution against rigidity. Continue PCID provisional coding.

  ***

  **Patient Journal: Elena R.**
  **April 02**

  The forum is huge now. 40k members. There's a thread: "What's your F-ritual?"

  People are posting videos. One guy changes his clothes in the garage and burns the work clothes in a barrel (probably fake). A woman plays a specific frequency tone on her phone while standing at her front door. Someone else said if you don't have a ritual, you might not actually have PCID, you might just be stressed. That scared me.

  My ritual is the vacuuming. I bought a new handheld because the old one wasn't loud enough to drown out the office hum. Mark asked why I was vacuuming a clean car. I told him it's clinical. He said, "You're doing it because you read it." I said, "I'm doing it because it works."

  Did I vacuum before I saw the draft? Yes. But I didn't count the minutes. Now I count the minutes. If I do 19 minutes, I feel anxiety. 20 minutes is safe. 20 minutes is in the window.

  ***

  **Clinical Follow-up Note: Aris Thorne, LMHP**
  **Date: May 20**
  **Patient: Elena R.**
  **Session: 5**

  Patient presents with increased anxiety regarding "diagnostic validity." Reports spending time on online communities comparing symptom profiles.

  Patient: "I read that some people have auditory bleed only. I have tactile too. Does that make me severe?"
  Clinician: "Severity is based on impairment, not symptom count."
  Patient: "The forum says tactile implies a deeper integration failure. There's a poll."

  Patient's vehicle cleaning ritual has expanded to include personal hygiene immediately upon entry. She showers before speaking to family. She refers to this as "The Flush." When asked when this started, patient was vague. "Always? Since the diagnosis?"

  *Assessment:* PCID symptoms are stable, but functional impairment regarding family dynamics has increased. Husband reports feeling "shut out" during transition periods.

  *Plan:* Discuss impact on relationships. Review criteria regarding "clinically significant distress." Note: Patient seems to derive comfort from the specificity of the criteria, even when restrictive.

  ***

  **DSM-7 Final Draft — Public Comment Period Close**
  **Condition: Persistent Contextual Integration Disorder (PCID)**

  *Finalized Diagnostic Criteria:*
  A. A pervasive inability to modulate affective tone following a shift in environmental context, persisting for a minimum of 90 minutes.
  B. Intrusive sensory retention from the prior context occurring at least 4 times per week.
  C. The symptoms cause clinically significant distress or impairment in social, occupational, or other important areas of functioning.
  D. The disturbance is not better explained by Post-Traumatic Stress Disorder, Autism Spectrum Disorder, or a psychotic disorder.
  E. Onset typically occurs in early adulthood (ages 22–35).
  F. Presence of "transition latency," defined as a period of immobilization, silence, or **maladaptive transitional cleansing** between contexts.
  G. Symptoms persist for at least 6 months.
  H. Exclusion of substance-induced etiologies.
  **I. Specifier:** *With Ritualized Maintenance* (assigned when cleansing behaviors exceed 30 minutes daily).

  *Work Group Note:* Criterion I added to capture high-frequency cohort. Data indicates patients with *Ritualized Maintenance* respond better to exposure therapy than SSRIs. Inclusion ensures appropriate treatment matching. Some concern that specifier may encourage behavior to secure treatment access. Monitoring recommended.

  ***

  **Patient Journal: Elena R.**
  **June 30**

  I got the specifier. *With Ritualized Maintenance.* It's on my insurance portal. It feels like a badge.

  I hit 32 minutes today. I had to. If I stop at 29, I'm just "Transition Latency." If I hit 30, I qualify for the specialized therapy copay waiver. Mark stood in the garage watching me vacuum the trunk. He didn't say anything. He just held the timer on his phone.

  I looked at the vacuum bag. It was full of dust. Car dust. Road dust. But I kept thinking about the spreadsheets. The emails. I needed to get them out.

  Afterward, I went inside. I sat at the kitchen table. The hum was gone. The keys were gone. I felt clean. I felt real.

  I posted on the forum: "Hit 32 mins today. The bleed stopped immediately. Don't let them tell you it's OCD. It's maintenance." 500 upvotes. Someone commented: "Did you use a HEPA filter? I feel like standard filters don't count for the specifier."

  I wrote back: "Must be HEPA. Otherwise it's not clinical."

  ***

  **Clinical Follow-up Note: Aris Thorne, LMHP**
  **Date: August 10**
  **Patient: Elena R.**
  **Session: 8**

  Patient reports stable mood. No sensory retention events in past 3 weeks. Transition latency consistent at 35 minutes daily.

  Patient: "I think I'm managed."
  Clinician: "How is home life?"
  Patient: "Mark understands the protocol. He buys the filters."

  *Observation:* Patient appears calm, organized. She carries a printed card with her criteria in her wallet. She shows it to me when discussing schedule changes. "I can't meet Tuesday, that violates Criterion G recovery time."

  *Assessment:* By diagnostic standards, patient is in remission of distress (Criterion C). By functional standards, life is organized around the disorder. The treatment is successful. The disorder is the treatment.

  *Plan:* Continue maintenance. Monitor for criterion creep. Note: Patient asked if there is a support group for partners. She said the forum says partners often develop "secondary bleed." I told her I would check the manual.

  ***

