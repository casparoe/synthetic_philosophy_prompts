answer: |-
  ### 1. Dependency Order: What Must Land Before What

  You cannot introduce the "Moment/Calendar" distinction *after* showing the math, or the students will treat the distinction as merely a label for the math. The phenomenology must precede the formalism.

  1.  **The Phenomenological Gap:** Students must first recognize the *experience* of planning vs. doing as distinct modes of agency. (Prerequisite for Moment/Calendar).
  2.  **The Moment/Calendar Distinction:** Once they feel the gap, you name it. This creates the ontological categories. (Prerequisite for mapping to Econ).
  3.  **The Formalization (HD):** Only now do you map Calendar to $t=0$ and Moment to $t=n$. This shows HD is a *model* of the distinction, not the distinction itself. (Prerequisite for Critique).
  4.  **The Normative Critique:** Once they see HD is just a model, you can ask if the model captures the *failure* of will or just a *change* in preference. (Prerequisite for Welfare discussion).

  **Critical Dependency:** If you introduce Hyperbolic Discounting before the Moment/Calendar distinction, the Behavioral Econ students will colonize the conversation, and the Philosophers will spend the whole hour arguing about utility functions rather than agency. You must establish the *agency* problem first.

  ---

  ### 2. The Carrying Example: "The Fascinating Digression"

  **The Scenario:**
  A researcher (the agent) has a paper due in 4 days.
  *   **Sunday (Calendar Self):** Plans to write 3 hours each night (Mon-Thu). The writing is tedious but necessary for tenure.
  *   **Monday 7 PM (Moment Self):** Sits down to write. Finds a citation to a fascinating, tangential philosophical debate.
  *   **The Choice:**
      *   *Option A (Calendar-aligned):* Ignore the citation, grind out the tedious text. (High future value, high immediate effort/pain).
      *   *Option B (Moment-aligned):* Read the tangential debate for 3 hours. (High immediate intellectual reward, low/negative future value regarding the deadline).

  **Why this replaces "Scrolling":**
  "Scrolling" implies mindless consumption, which makes the Moment Self look stupid or purely hedonic. "The Digression" makes the Moment Self look *rational* in its own context (pursuing truth/interest). This forces the Philosophers to argue about whether akrasia requires *knowing* the better course, and forces the Econ students to model "intellectual utility" vs. "career utility."

  **What the Example MUST Have:**
  1.  **Positive Utility for the Deviation:** The temptation cannot be purely "painful" (like addiction withdrawal); it must offer genuine immediate reward (intellectual joy), or the Moment Self looks pathological.
  2.  **No External Constraints:** No website blockers, no locked doors. It must be a pure choice.
  3.  **Reversibility:** The agent *could* have written.
  4.  **Quantifiable Trade-off:** Hours spent vs. Deadline proximity.

  **What the Example MUST NOT Have:**
  1.  **New Information:** The agent on Monday cannot learn that the paper is actually unnecessary. That makes it a belief update, not weakness of will.
  2.  **Physical Incapacity:** The agent cannot be too tired to type.
  3.  **Moral Stakes:** Keep it professional/prudential. If it's "I promised my child," the moral weight drowns out the structural analysis of time.

  ---

  ### 3. Misconception Management

  Here is where you intercept the errors in the sequence.

  | Misconception | Where to Head It Off | How to Intercept |
  | :--- | :--- | :--- |
  | **"Akrasia is just impatience."** | **Segment 2 (Formalization)** | When showing the discount curve, explicitly state: "Impatience is a constant rate. Akrasia is a *reversal* of rank order. If you prefer A to B on Sunday, and A to B on Monday, you are just impatient. If you prefer A to B on Sunday, but B to A on Monday, you are akratic." |
  | **"HD explains all weakness of will."** | **Segment 3 (Critique)** | Ask: "What if the discount rate didn't change, but the *salience* of the temptation did?" Show that HD models the *preference*, not the *mechanism* of the clash. |
  | **"Present bias is automatically irrational."** | **Segment 4 (Normativity)** | Point out that the Moment Self might be responding to *real* immediate value (the joy of the digression) that the Calendar Self undervalued. Ask: "Is the Calendar Self tyrannical?" |
  | **"The 'two selves' picture is literal."** | **Segment 1 (Distinction)** | When introducing Moment/Calendar, say: "These are not homunculi. They are descriptive stances of a single agent at different temporal coordinates. Do not reify them." |
  | **"Later preference = Real preference."** | **Segment 4 (Normativity)** | Challenge the idea that the Sunday plan is the 'true' one. Ask: "Why is the distant self the authority? Why isn't the experiencing self the authority?" |
  | **"Precommitment solves the problem."** | **(Missing Misconception)** | **Segment 4.** If a student suggests locking the books, point out this just empowers the Calendar Self to tyrannize the Moment Self. It doesn't solve the *agency* conflict; it bypasses it. |
  | **"Belief change vs. Preference change."** | **(Missing Misconception)** | **Segment 3.** Ensure they distinguish "I changed my mind about what's good" (Rational update) vs. "I know what's good but want this more" (Akrasia). The Example is designed to test this. |

  ---

  ### 4. The 90-Minute Teaching Plan

  **0:00 – 0:15 | Phenomenology & The Distinction**
  *   **Activity:** Walk through "The Fascinating Digression" example. Do not use math yet.
  *   **Ask:** "Describe the Sunday mindset. Describe the Monday mindset. Are they the same agent?"
  *   **Introduce:** The **Calendar Self** (planner, abstract, cares about trajectory) vs. The **Moment Self** (chooser, concrete, cares about salience).
  *   **Constraint:** Explicitly warn: "These are not two people. This is one agent viewed from two temporal distances."
  *   **Goal:** Get them to feel the clash before defining it.

  **0:15 – 0:40 | The Formalization (Hyperbolic Discounting)**
  *   **Transition:** "The Econ students in the room will recognize this structure. Let's translate the phenomenology into the formalism."
  *   **Board Work:** Map Calendar to $t=0$ and Moment to $t=1$. Sketch the Hyperbolic curve vs. Exponential.
  *   **Key Move:** Show the **Preference Reversal**.
      *   At $t=0$: $Utility(Write) > Utility(Read)$.
      *   At $t=1$: $Utility(Read) > Utility(Write)$ (due to the hyperbolic spike on immediate reward).
  *   **Check:** Ask Econ students to confirm the math; ask Phil students to confirm the mapping. "Does this curve capture the *feeling* of the Monday night struggle?"
  *   **Goal:** Establish HD as a *tool* for modeling the Moment/Calendar clash.

  **0:40 – 1:05 | The Critique: Limits of the Model**
  *   **Pivot:** "HD models the reversal. Does it explain the *failure*?"
  *   **Discussion:**
      *   **Salience vs. Discounting:** Is Monday's choice due to time-discounting, or because the book is physically in front of me (salience)? HD assumes time is the only variable.
      *   **The 'Literal Self' Trap:** If we treat Moment/Calendar as literal agents, we get an infinite regress (who chooses which self wins?).
      *   **Rationality:** Is the Moment Self irrational? Or is the Calendar Self bad at forecasting what will be enjoyable?
  *   **Goal:** Decouple Akrasia from HD. HD is sufficient for preference reversal, but not necessary for weakness of will (e.g., emotional flooding without discounting).

  **1:05 – 1:20 | Normativity & Welfare**
  *   **Question:** "Who wins?"
  *   **Debate:** If the Moment Self chooses the Digression, is the agent worse off?
      *   *Calendar view:* Yes, tenure is at risk.
      *   *Moment view:* No, I had a brilliant intellectual evening.
  *   **Point:** This is where the "Later preference = Real preference" misconception dies. There is no neutral arbiter.
  *   **Goal:** Show that the "Moment/Calendar" distinction describes the conflict, but doesn't solve the normative problem of which self represents the *good*.

  **1:20 – 1:30 | Diagnostic & Close**
  *   **The Diagnostic Question** (See below).
  *   **Wrap:** Summarize that Moment/Calendar is a heuristic for the temporal structure of agency, and HD is one way to formalize it, but the philosophical problem remains: *Which self has standing?*

  ---

  ### 5. What to Openly Refuse to Explain

  You must set boundaries to keep the seminar from exploding into metaphysics or clinical psychology. State these explicitly at the start of Segment 3.

  1.  **"I will not tell you which self is the 'Real' You."**
      *   *Reason:* That is a normative/ethical question, not a structural one. The seminar is about the *clash*, not the resolution.
  2.  **"I will not derive the Beta-Delta parameters from scratch."**
      *   *Reason:* Assume the Econ students know it and can tutor the Phil students if needed. Focus on the *implications* of the curve, not the calculus.
  3.  **"I will not solve the Free Will problem."**
      *   *Reason:* If the Moment Self is determined by neurochemistry, is it still akrasia? Acknowledge the question, then bracket it. We are analyzing the *structure of the choice*, not the metaphysics of the chooser.

  ---

  ### 6. The Diagnostic Question

  Do not ask them to define hyperbolic discounting. Ask them to apply the distinction to a case where the math works but the intuition fails.

  **The Question:**
  > "Imagine an agent who exhibits perfect hyperbolic discounting—they reverse preferences as time nears—but they **never feel regret** after the Moment Self chooses. They are perfectly happy with the 'Digression' on Tuesday morning.
  >
  > **Using the Moment/Calendar distinction: Is this weakness of will?**
  >
  > A) Yes, because the Calendar Self's plan was violated.
  > B) No, because the agent's welfare was maximized across both selves.
  > C) It depends on whether the Calendar Self's plan was based on accurate information.
  >
  > **Defend your choice without using the word 'utility'.**"

  **Why this works:**
  *   If they answer **A**, they treat the Calendar Self as tyrannical (missing the normative critique).
  *   If they answer **B**, they treat preference satisfaction as the only good (missing the concept of *akrasia* as a failure of self-governance).
  *   If they answer **C**, they are focusing on belief vs. preference (good, but maybe dodging the will aspect).
  *   **The "No Utility" Constraint:** Forces Phil students to talk about agency/will, and forces Econ students to translate welfare into non-mathematical terms.
  *   **The "No Regret" Condition:** Tests if they see akrasia as a *structural inconsistency* (HD) or a *normative failure* (regret/standing). If there's no regret, was there really a failure of *will*, or just a change of mind? This cuts to the heart of the Moment/Calendar clash.
