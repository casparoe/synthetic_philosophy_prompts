      *   *Okay, let's go with the "Dinner Party Prep" example.* It's high stakes, social, and involves effort.
      *   *No, let's stick to the "Draft" example but make the temptation *intellectual*.* Reading a fascinating but irrelevant book vs. writing the boring draft. This appeals to academics.
      *   *Decision:* **The "Interesting Digression" Example.**
      *   *Calendar:* Write the paper (boring, high value).
      *   *Moment:* Read the fascinating tangential literature (rewarding now, delays paper).
      *   *Why:* It's not just "laziness" (scrolling). It's *misplaced rational engagement*. This helps philosophers argue it's not just impulse. It helps econ students model "positive utility" of the distraction.

      *(Wait, one more check)*: The prompt asks for "What has to come first for that distinction to land?" I need to be explicit about the dependency chain.

      *(Final Plan Structure)*:
      1. Dependency Map.
      2. The Carrying Example (Specs & Rationale).
      3. Misconception Management (Where to intercept).
      4. The 90-Minute Sequence.
