  Your argument highlights the clash between two decision theories:
  1.  **Causal Decision Theory (CDT):** Focuses on what your action *causes* to happen right now. (Rejects 1, Accepts 6).
  2.  **Functional/Timeless Decision Theory (FDT/TDT):** Focuses on what your decision *algorithm* implies about your behavior across all possible worlds, including counterfactuals. (Accepts 1, tries to Reject 5).

