  Because in the **real world**, Omega does not exist. Beings who can access counterfactual worlds and reward you for dispositions are not real. However, **blackmailers are real**. By adopting the policy "Don't Pay," you protect yourself from real-world exploitation. The cost of losing hypothetical Omega money is worth the benefit of not being a target for real criminals.

