  2.  **You lose the "Win."** In the context of decision theory, "winning" means walking away with the most utility. By not paying, you ensure you don't lose $100, but you guarantee you never get the $10,000 in the Tails worlds. Over many trials, the "Payer" ends up richer. Rejecting (1) means accepting that you are the type of agent who loses these specific games.
  3.  **Inconsistency with Intuition:** You might feel a nagging sense that you *should* have paid. It feels like a contract you broke with your past self (the self that would have wanted the $10,000).

