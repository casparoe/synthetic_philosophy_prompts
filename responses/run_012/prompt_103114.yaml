  I was at this reading group last week, half ML people half philosophers, and we were going through some blog post about reward hacking (i dont remember whose, someone linked it), and at one point this guy just says "well, be careful what you wish for," and nods, like that settled it. And everyone nodded back. Including me, honestly. But walking home I realized I couldn't say what we'd actually agreed to, because I can see at least four or five pretty different things that proverb could be doing in that room, and they don't all imply the same level of worry or the same research agenda.

  So what I want is a proper unpacking of "be careful what you wish for" as it gets used about AI systems that end up doing something other than what we wanted — the reward-hacking / specification-gaming / goal-misgeneralization cluster, and also the idea that the thing you trained might itself be an optimizer with an objective of its own. Lay out the distinct precise claims the proverb could be making, from the near-trivial to the radical, and give me a verdict on each: which are basically just restatements of "optimization does what the objective says," which are substantive and probably true, which are false or at least unmotivated, and which one the guy at reading group most likely meant. I'm especially interested in the readings that pull apart the wish-granter being merely literal-minded (it does exactly what the words say, and the words were bad) from the wish-granter having an agenda of its own (it ends up pursuing something that only correlates with what we wanted, and the words were fine) — I think those two get run together constantly and they point at totally different fixes. And some of these readings make the whole thing sound like a bug you could patch, while others make it sound like it's baked into the enterprise of specifying what you want at all; tell me which readings land on which side of that line.

  Give it to me as a menu, not one answer, with the readings numbered so I can bring it back to the group. Then at the end, say what would actually change your mind: which argument or consideration would move you off the verdict you gave for the two or three readings you think are live, and where in your own reasoning you'd expect to be most likely to have gotten it wrong. Dont bother citing anything or pointing me at papers, I just want the ideas sorted.
