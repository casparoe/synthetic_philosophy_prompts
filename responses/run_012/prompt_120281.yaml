      *   *Claim 2: Paradox of Not Voting (Downsian Paradox).* This is about individual rationality. Cost of voting > Expected benefit (probability of being decisive $\times$ benefit of outcome). Since $P(\text{decisive}) \approx 0$, rational agents shouldn't vote.
      *   *Claim 3: Arrow's Impossibility Theorem.* This is a generalization. No ranked voting system can satisfy a specific set of fairness criteria (unrestricted domain, non-dictatorship, Pareto efficiency, IIA) simultaneously.
