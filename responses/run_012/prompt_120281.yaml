      *   *Critique:*
          *   Cycles *do* happen, but they are rare in large groups with structured preferences (single-peakedness).
          *   Even if a cycle exists, it doesn't mean *no* method can resolve it. It just means simple pairwise majority fails. RCV (Instant Runoff) handles this differently than Condorcet methods.
