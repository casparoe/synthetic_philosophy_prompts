  # JOINT STATEMENT ON THE FOUNDATIONS OF SET THEORY AND PARACONSISTENT LOGIC

  **Date:** October 26, 2023
  **Parties:** 
  1. The Classical Iterative Conception Working Group (CIC)
  2. The Paraconsistent Naive Comprehension Working Group (PNC)

  **Subject:** Outcomes of Adversarial Collaboration regarding Russell's and Curry's Paradoxes

  ## PREAMBLE

  This document records the outcomes of a structured collaboration between proponents of the classical iterative conception of set theory and defenders of unrestricted naive comprehension underpinned by paraconsistent logic. While Russell's Paradox initiated the dialogue, both parties agree that Curry's Paradox presents the more stringent technical constraint on the viability of naive comprehension. The following sections detail our areas of convergence, the precise locus of our disagreements, the technical costs associated with the paraconsistent resolution, and the empirical or formal tests that bear on the dispute.

  ## I. AGREED CLAIMS

  Both parties endorse the following numbered claims as accurate representations of the logical and philosophical landscape:

  1.  **Validity of Derivation:** Both parties agree that the derivation of Russell's Paradox ($\{x \mid x \notin x\}$) and Curry's Paradox ($\{x \mid x \in x \to \bot\}$) is valid within the shared syntax of naive comprehension. The divergence lies not in the derivation steps themselves, but in the consequence relation applied to the result.
  2.  **The Inconsistent Triad:** Russell's Paradox establishes that the following triad is inconsistent: (a) Unrestricted Naive Comprehension, (b) Classical Logic (specifically *ex contradictione quodlibet*), and (c) Consistency (non-triviality). It does not, in isolation, dictate which member of the triad must be rejected.
  3.  **Logic vs. Comprehension:** The fundamental choice is between restricting the set-formation principle (the Iterative approach) or restricting the underlying logic (the Paraconsistent approach). Both are recognized as coherent methodological strategies for preserving a mathematical framework.
  4.  **Decisive Objections:** 
      *   **Against the Iterative Conception:** A decisive objection would be an internal demonstration that the cumulative hierarchy is ill-defined, or that it systematically fails to model essential mathematical structures (e.g., universal categories) required by other domains of inquiry.
      *   **Against Paraconsistent Naive Theory:** A decisive objection would be a proof that the theory is trivial (proves everything), or that the logical restrictions required to avoid triviality render the theory too weak to recover standard arithmetic or a functional truth predicate.
  5.  **The Primacy of Curry:** Both parties agree that while Russell's Paradox can be contained by paraconsistency (by accepting true contradictions), Curry's Paradox threatens triviality even in the absence of negation. Therefore, the viability of the PNC position hinges on the resolution of Curry's Paradox.

  ## II. THE CURRY CRUX: TECHNICAL CONCESSIONS

  Regarding Curry's Paradox, both parties agree on the following technical necessities regarding the Paraconsistent Naive Comprehension (PNC) framework:

  1.  **Required Sacrifice:** To maintain non-triviality in the face of Curry's Paradox while retaining Naive Comprehension, the PNC framework must reject at least one of the following: 
      *   **Contraction:** The principle that $(A \to (A \to B)) \vdash (A \to B)$.
      *   **Modus Ponens:** The rule that $\{A, A \to B\} \vdash B$ (specifically in its detaching form).
      *   **Identity:** The principle that $\vdash A \to A$.
  2.  **Motivation Requirement:** The CIC maintains that any such sacrifice must be independently motivated by semantic or proof-theoretic considerations, rather than being *ad hoc* solely to block Curry. The PNC acknowledges this burden of proof and asserts that relevant logics or non-contractive logics provide such independent motivation (e.g., preserving meaning containment or resource sensitivity).
  3.  **Conditional Status:** Both parties agree that the PNC conditional cannot be the classical material conditional. It must be a detaching conditional strong enough to support inference but weak enough to block Curry.

  ## III. TABLE OF RESIDUAL DISAGREEMENTS

  The following table outlines the remaining philosophical and technical disagreements. Each column is phrased to accurately reflect the position of the respective party, such that each party accepts the wording in their own column as a charitable and precise statement of their view.

  | Topic | Classical Iterative Conception (CIC) View | Paraconsistent Naive Comprehension (PNC) View |
  | :--- | :--- | :--- |
  | **Nature of Sets** | Sets are objects formed in well-ordered stages; a set cannot depend on a totality to which it belongs. | Sets are extensional totalities defined by any condition; membership is prior to hierarchy. |
  | **Status of Contradictions** | A contradiction ($\alpha \land \neg \alpha$) entails triviality; therefore, contradictory sets cannot exist. | Contradictions can be true (dialetheias) without entailing triviality; contradictory sets exist. |
  | **Logical Revision** | Logic is topic-neutral and fixed; revising logic to save a mathematical theory is methodologically unsound. | Logic is fallible and empirical; revising logic to save a fundamental mathematical intuition is justified. |
  | **Cost of Solution** | The loss of Unrestricted Comprehension is a minor cost compared to the loss of Classical Inference. | The loss of Classical Inference (e.g., Disjunctive Syllogism) is a minor cost compared to the loss of Naive Comprehension. |
  | **Truth Predicate** | A global truth predicate satisfying the T-schema ($T(\ulcorner A \urcorner) \leftrightarrow A$) is impossible in a consistent language. | A global truth predicate satisfying the T-schema is possible and necessary, despite inconsistency. |

  ## IV. FORMAL AND CONCEPTUAL TESTS

  Both parties agree that the following tests bear on the viability of the respective positions. We record our predictions in advance.

  | Test Description | Relevance | CIC Prediction | PNC Prediction |
  | :--- | :--- | :--- | :--- |
  | **Arithmetic Recovery** | Can the theory interpret Peano Arithmetic (PA) and prove standard theorems? | **CIC:** ZFC fully recovers PA. <br> **PNC:** PNC will likely fail to recover full PA or will require complex workarounds that weaken inferential power. | **CIC:** PNC can recover PA, potentially using a non-classical consequence relation, without loss of mathematical utility. |
  | **The T-Schema** | Does the theory allow a truth predicate where $T(\ulcorner A \urcorner) \leftrightarrow A$ holds for all $A$? | **CIC:** Any theory allowing this is trivial or inconsistent in a destructive way. | **CIC:** The theory can sustain the T-schema non-trivially by restricting the logic governing the biconditional. |
  | **Classical Negation Adjunction** | If a classical negation ($\sim$) is added to the PNC system, does it become trivial? | **CIC:** Yes. If PNC is consistent, it cannot handle naive comprehension. If it handles comprehension, adding classical negation must trivialize it. | **PNC:** Yes, adding classical negation trivializes the system, which confirms that classical negation is not a universal operator. |
  | **Inferential Utility** | Can the theory support standard mathematical proof techniques (e.g., proof by contradiction)? | **CIC:** PNC will fail to support standard reductio arguments, hindering mathematical practice. | **PNC:** PNC can support a restricted or modified form of reductio sufficient for mathematical practice. |

  ## V. VERBAL DISPUTE ANALYSIS

  Upon review, the parties identify one component of the dispute that appears to be merely verbal, though it masks substantive differences:

  *   **The Term "Valid":** 
      *   **CIC** uses "valid" to mean "truth-preserving in all models, including those where contradictions are impossible."
      *   **PNC** uses "valid" to mean "truth-preserving in all models, including those where contradictions are possible."
      *   **Resolution:** We acknowledge that when CIC says "Naive Comprehension is false," they mean "It is not true in the cumulative hierarchy." When PNC says "Naive Comprehension is true," they mean "It holds in the intended model of the universal totality." We are often talking past one another regarding the domain of quantification. However, this verbal difference does not dissolve the substantive disagreement regarding which logic (Classical vs. Paraconsistent) is the correct normative standard for reasoning.

  ## VI. SIGNATURES

  _________________________ 
  **Lead Representative, Classical Iterative Conception Working Group**

  _________________________ 
  **Lead Representative, Paraconsistent Naive Comprehension Working Group**
