answer: |-
  ### Stage 1: Brainstorming Readings

  Before organizing, I need to lay out the conceptual space. The slogan is polymorphous; it shifts meaning depending on whether "evidence" means "data," "proof," or "justification," and whether "is not" means "does not logically entail" or "does not probabilistically support."

  1.  **The Deductive Reading:** "Absence of evidence does not *entail* absence of the phenomenon." (Logical validity).
  2.  **The Likelihood Equality Reading:** "The probability of finding no trace given the phenomenon existed is equal to the probability of finding no trace given it did not exist." ($P(\neg E|H) = P(\neg E|\neg H)$).
  3.  **The Zero-Sensitivity Reading:** "The detection method has zero power; if the phenomenon existed, we still wouldn't see it." ($P(E|H) = 0$).
  4.  **The Threshold Reading:** "The shift in probability is too small to cross our belief threshold." (Pragmatic).
  5.  **The Sampling Scope Reading:** "We haven't looked in the right place/time to make the absence informative." (Quantifier scope).
  6.  **The Preservation Reading:** "Taphonomic processes destroy the signal regardless of the source." (Archaeological specific).
  7.  **The Semantic Reading:** "Evidence" here means 'conclusive proof,' not 'Bayesian update.' (Equivocation).
  8.  **The Normative Reading:** "It is epistemically irresponsible to update on null results in this domain." (Community norm).

  ### Stage 2: Analysis and Evaluation

  Here is the disambiguated menu. I will use standard Bayesian notation: $H$ is the hypothesis (the practice existed), $\neg H$ is the negation (it did not), $E$ is the observation of a trace, and $\neg E$ is the absence of a trace.

  #### 1. A Menu of Precise Claims

  **Reading 1: The Deductive Immunity**
  *   **Claim:** $\neg E \nvdash \neg H$.
  *   **Commitment:** Observing no trace does not logically guarantee the practice didn't exist.
  *   **Status:** **Trivially True.** In inductive sciences, data rarely entails theory.
  *   **Professor's Intent:** Unlikely. This is too weak to stop a probabilistic argument.
  *   **Licenses Dismissal?** No. It blocks certainty, not probability shifts.

  **Reading 2: The Likelihood Equality (The Core Bayesian Claim)**
  *   **Claim:** $P(\neg E|H) = P(\neg E|\neg H)$. Equivalently, the Likelihood Ratio is 1.
  *   **Commitment:** The observation $\neg E$ is statistically independent of $H$. Finding nothing is exactly as expected whether $H$ is true or false.
  *   **Status:** **Substantive and Contingent.** It is false as a universal law. It is true only if the detection probability is identical in both worlds.
  *   **Professor's Intent:** **High Probability.** This is the only reading that functions as a defeater for the classmate's inference.
  *   **Licenses Dismissal?** Only if the professor has established that the likelihoods are actually equal. If $P(E|H) > 0$, then $\neg E$ *must* lower the probability of $H$. If the professor asserts this reading without proving the likelihood equality, they are committing a formal error.

  **Reading 3: The Zero-Sensitivity (Taphonomic Blackout)**
  *   **Claim:** $P(E|H) = 0$.
  *   **Commitment:** Even if the practice existed, the material record *could not* preserve it (e.g., wooden tools in acidic soil, oral traditions in pre-literate contexts).
  *   **Status:** **Substantive and Defensible.** Common in archaeology (e.g., inferring absence of weaving from lack of loom weights is bad if fibers rot).
  *   **Professor's Intent:** **High Probability.** Often conflated with Reading 2.
  *   **Licenses Dismissal?** Yes, but only for *that specific material class*. It does not license a general ban on inferring absence from null results.

  **Reading 4: The Sampling Scope (The "Not Everywhere" Claim)**
  *   **Claim:** $\neg E$ is local, but $H$ is global. We sampled 1% of the settlement; $H$ refers to the whole settlement.
  *   **Commitment:** $P(\neg E|H)$ is high simply because the sample size $n$ is too small relative to the population $N$.
  *   **Status:** **Ambiguous-but-Repairable.** It becomes Reading 2 if the sampling fraction is negligible. It becomes false if the sampling fraction is sufficient to make $\neg E$ unlikely under $H$.
  *   **Professor's Intent:** Moderate. Often a placeholder for "we need more digs."
  *   **Licenses Dismissal?** Temporarily. It suggests the data is insufficient, not that the inference is invalid in principle.

  **Reading 5: The Pragmatic Threshold**
  *   **Claim:** $P(H|\neg E) < P(H)$, but $P(H|\neg E)$ remains above the "action threshold" for belief.
  *   **Commitment:** The evidence shifts credence, but not enough to assert "probably didn't exist."
  *   **Status:** **Substantive and Defensible.** Depends on priors and cost of error.
  *   **Professor's Intent:** Low. Professors usually speak in ontological terms, not decision-theoretic ones.
  *   **Licenses Dismissal?** No. It concedes the classmate's direction of inference but disputes the magnitude.

  **Reading 6: The Semantic Shift (Equivocation)**
  *   **Claim:** "Evidence" in the slogan means "Proof," but "evidence" in the classmate's argument means "Probabilistic Support."
  *   **Commitment:** A linguistic confusion.
  *   **Status:** **False (as a philosophical claim), True (as a psychological diagnosis).**
  *   **Professor's Intent:** **Very High.** This is the most common source of the contradiction you observed.
  *   **Licenses Dismissal?** No. It reveals a category error in the discussion.

  **Verdict on the Episode:**
  The professor almost certainly meant a blend of **Reading 3 (Zero-Sensitivity)** and **Reading 6 (Semantic Shift)**. They treated "evidence" as "conclusive proof" while implicitly assuming high taphonomic noise.
  *Does this license dismissing the classmate?* **No.** If the classmate's claim was probabilistic ("probably didn't exist"), and the preservation potential was non-zero, the classmate was Bayesianly correct. The professor's slogan, taken literally as Reading 2, is false. Taken as Reading 1, it is irrelevant. The professor is relying on the slogan to do work that requires specific taphonomic modeling.

  #### 2. The Mirror Slogan

  **Slogan:** "Absence of evidence *is* evidence of absence."

  **Readings:**
  1.  **The Bayesian Default:** $P(H|\neg E) < P(H)$ whenever $P(E|H) > 0$.
      *   **Status:** **Mathematically True.** If there is any chance of finding the trace given existence, failing to find it lowers the probability of existence.
  2.  **The Strong Claim:** $\neg E \vdash \neg H$ (or $P(\neg H|\neg E) \approx 1$).
      *   **Status:** **False.** Requires $P(\neg E|H) = 0$ (i.e., if it existed, we *would* have found it).

  **Contraries vs. Compatibility:**
  *   **Contraries:** If the original slogan means "The likelihood ratio is 1" (Reading 2 above) and the mirror means "The likelihood ratio is < 1" (Bayesian Default), they are **contraries**. They cannot both be true for the same dataset.
  *   **Compatible:** If the original slogan means "Absence of evidence is not *proof* of absence" (Reading 1) and the mirror means "Absence of evidence is *probabilistic support* for absence" (Bayesian Default), they are **compatible**.
  *   **The Classroom Contradiction:** The nods you saw indicate the class is oscillating between these two compatible readings without realizing they are switching definitions of "evidence." The professor uses "evidence" = proof (Original Slogan). The second student uses "evidence" = Bayesian update (Mirror Slogan). Both are technically right under their respective definitions, but they are talking past each other.

  #### 3. "You Can't Prove a Negative"

  This is a distinct claim, often confused with the AoE slogan.

  *   **Claim:** $\neg (\exists \text{ data } D \text{ s.t. } D \vdash \neg H)$.
  *   **Relation:** It is a claim about the **ceiling** of certainty, whereas the AoE slogan is usually about the **direction** of the update.
  *   **Assessment:** In a Bayesian framework, "You can't prove a negative" is false if you allow for $P(\neg H) \to 1$. You can become arbitrarily confident in a negative. If the claim is about *deductive* proof from empirical premises, it is trivially true (Hume's problem of induction applies to positives too).
  *   **Function in Seminar:** It is used as a conversation-stopper to protect hypotheses from falsification. It conflates "certainty" with "justification." In archaeology, you often *can* prove a negative for specific scopes (e.g., "There was no iron smelting in this layer" is provable if the detection threshold for slag is lower than any possible smelting output).

  #### 4. Record-Absence vs. World-Absence

  Your distinction is the correct cut, but it needs sharpening to handle the "sleight of hand."

  *   **World-Absence ($\neg H$):** The ontological state of the past (the practice did not occur).
  *   **Record-Absence ($\neg E$):** The epistemological state of the present (the trace is not in the assemblage).
  *   **The Missing Link:** The **Formation Process Function**, $f$.
      *   $\neg E = f(\neg H, \text{Noise}, \text{Bias}, \text{Sampling})$.
      *   The slogan "AoE $\neq$ EoA" is effectively a claim that the derivative $\frac{\partial E}{\partial H} \approx 0$. That is, changes in the World do not produce changes in the Record.

  **Sharpening the Distinction:**
  Do not treat them as binary states. Treat them as **Signal-to-Noise Ratios**.
  *   **Record-Absence** is a fact about the *detection profile*. It asks: "Given the soil chemistry, excavation grid size, and analyst recognition criteria, what is the probability of recording a trace if it were present?"
  *   **World-Absence** is the target parameter.

  **Analogues for Other Media:**
  *   **Texts:** The detection profile is **Transmission History**.
      *   *Record-Absence:* No manuscript copies survive.
      *   *Formation Process:* Copyist bias (was the text orthodox?), material decay (papyrus vs. stone), canonical selection (was it included in the Library of Alexandria?).
      *   *Inference:* If a heretical text is absent from all orthodox libraries, is that World-Absence (it wasn't written) or Record-Absence (it was burned)? The AoE slogan applies if the "burning probability" is high regardless of the text's existence.
  *   **Standing Architecture:** The detection profile is **Visibility and Reuse**.
      *   *Record-Absence:* No walls visible above ground.
      *   *Formation Process:* Robbing (stones taken for new buildings), leveling (tell compression), vegetation cover.
      *   *Inference:* Absence of a temple structure. If the site was heavily quarried in the Roman period, Record-Absence tells you nothing about World-Absence. If it was sealed in volcanic ash, Record-Absence is strong evidence of World-Absence.

  **Verdict:** Your distinction is the right tool. The error in the seminar is treating Record-Absence as a direct map of World-Absence without modeling the Formation Process. The slogan is a warning that the map is distorted, not that the territory is unknowable.

  #### 5. Diagnostic Questions

  To force commitment, you need to ask questions that separate the *logical* claim from the *empirical* claim about preservation. Do not ask "Is it evidence?" Ask about the likelihoods.

  1.  **The Likelihood Question:** "Are you claiming that the probability of finding *nothing* is the same whether the practice existed or not? Or just that it's not *zero*?"
      *   *Forces:* Choice between Reading 2 (Equality) and Reading 1 (Deductive).
  2.  **The Sensitivity Question:** "If the practice *had* existed, what specific trace would we expect to see, and what is the probability that trace would survive to the present?"
      *   *Forces:* Quantification of $P(E|H)$. If they say "low," they concede the mirror slogan (it's still evidence, just weak). If they say "zero," they must justify the taphonomy.
  3.  **The Scope Question:** "Does this slogan apply to this specific assemblage, or is it a universal rule for archaeological inference?"
      *   *Forces:* Admission that in high-preservation contexts (e.g., Pompeii), absence of evidence *is* evidence of absence.
  4.  **The Definition Question:** "When you say 'evidence,' do you mean 'a shift in probability' or 'conclusive proof'?"
      *   *Forces:* Resolution of the Semantic Shift (Reading 6).
  5.  **The Counterfactual:** "What would count as evidence of absence for you? If not this null result, what observation would lower your credence?"
      *   *Forces:* If they cannot name an observation that would lower credence, they are holding an unfalsifiable position.

  ### Summary of the Sleight of Hand

  The professor is likely using the **Deductive Reading** (which is true but weak) to block a **Probabilistic Inference** (which is valid but uncertain). The classmate is making a Probabilistic Inference. The second student is asserting the **Bayesian Default** (which is true).

  The contradiction dissolves if you enforce a single definition of "evidence."
  *   If Evidence = Probabilistic Support: The classmate and second student are right; the professor is wrong (unless preservation is zero).
  *   If Evidence = Deductive Proof: The professor is right; the classmate is overstating their case.

  The "nodding" indicates the seminar is operating with **Contextual Definitions**: "Evidence" means "Proof" when defending a hypothesis, and "Support" when attacking one. Your Bayesian machinery is correctly flagging this as an inconsistency in the likelihood ratios being assumed.
