      *   **Constraints:** No citations/reading lists. American English. Flag uncertainty. Work in stages (brainstorm first, then organize).

  2.  **Stage 1: Brainstorming Readings of "Absence of Evidence is Not Evidence of Absence"**
      *   *Idea 1:* Logical impossibility. You can never deductively prove non-existence from non-observation. (True but trivial).
      *   *Idea 2:* Bayesian irrelevance. $P(H|E) = P(H)$ where $E$ is "no evidence found." (False generally, unless likelihoods are equal).
      *   *Idea 3:* Low sensitivity. The search method was so bad that finding nothing tells you nothing. (Substantive).
      *   *Idea 4:* Preservation bias. The medium doesn't preserve the signal. (Archaeology specific).
      *   *Idea 5:* Scope limitation. We haven't looked *everywhere*. (Quantifier issue).
      *   *Idea 6:* Normative/Pragmatic. Don't bet on absence yet. (Community belief).
      *   *Idea 7:* Likelihood ratio is 1. $P(\text{No Trace} | \text{Present}) = P(\text{No Trace} | \text{Absent})$. (The core Bayesian condition).
      *   *Idea 8:* "Evidence" means "Conclusive Proof." (Semantic shift).

  3.  **Stage 2: Organizing and Evaluating the Readings (Drafting Section 1)**
      *   Need to formalize these into probabilistic terms.
      *   Let $H$ = Hypothesis (Practice existed).
      *   Let $\neg H$ = Hypothesis (Practice did not exist).
      *   Let $E$ = Evidence found (Trace detected).
      *   Let $\neg E$ = No evidence found (Absence of evidence).
      *   Bayesian update: $P(H|\neg E) = \frac{P(\neg E|H)P(H)}{P(\neg E)}$.
      *   $\neg E$ is evidence of absence iff $P(H|\neg E) < P(H)$. This happens iff $P(\neg E|H) < P(\neg E|\neg H)$.
      *   So the slogan claims $P(\neg E|H) \approx P(\neg E|\neg H)$ or that the shift is negligible.
      *   *Reading A (The Logical/Deductive):* $\neg E \nvdash \neg H$. Trivially true.
      *   *Reading B (The Likelihood Equality):* $P(\neg E|H) = P(\neg E|\neg H)$. False generally, true only if detection probability is 0.
      *   *Reading C (The Sensitivity Threshold):* Detection probability is too low to shift credence meaningfully. Substantive/Defensible.
      *   *Reading D (The Sampling Scope):* We haven't sampled the relevant population. Ambiguous/Repairable.
      *   *Reading E (The Preservation Filter):* Taphonomic processes destroy the signal regardless of $H$. Substantive/Defensible (Archaeology specific).
      *   *Professor's Intent:* Likely C or E. Does it license dismissing the classmate? Only if the detection probability is genuinely near zero. If the classmate had a high-sensitivity sample, the professor is wrong.

  4.  **Stage 3: The Mirror Slogan ("Absence of Evidence *Is* Evidence of Absence")**
      *   *Reading:* $P(H|\neg E) < P(H)$.
      *   This is the standard Bayesian result whenever $P(E|H) > 0$.
      *   Are they contraries? "Is not" vs "Is".
      *   If "Is not" means "Is not *conclusive proof*" and "Is" means "Is *probabilistic support*," they are compatible.
      *   If both mean "Does not lower probability" vs "Lowers probability," they are contraries.
      *   In archaeology, the mirror slogan is usually the correct Bayesian default *unless* preservation is impossible.

  5.  **Stage 4: "You Can't Prove a Negative"**
      *   This is about deductive certainty ($P(\neg H | \text{data}) = 1$).
      *   AoE slogan is often used as a proxy for this.
      *   Relation: "Can't prove" is about the ceiling of certainty. "Not evidence" is about the direction of the update.
      *   It's a corollary in the deductive limit, but distinct in probabilistic inference.

  6.  **Stage 5: Record-Absence vs. World-Absence**
      *   User's distinction is good.
      *   Record-Absence: $\neg E$ (No trace in the assemblage).
      *   World-Absence: $\neg H$ (No practice in the settlement).
      *   The link is the *formation process* (taphonomy + sampling).
      *   Sharpening: Define "Detection Profile" (Probability of recording given existence).
      *   Analogue for texts: Transmission history, copyist bias, material decay of papyrus/stone.
      *   Analogue for architecture: Reuse of materials, leveling, visibility surveys.

  7.  **Stage 6: Diagnostic Questions**
      *   Need to force the speaker to quantify $P(E|H)$.
      *   "What is the probability we would find it if it were there?"
      *   "Is the likelihood ratio 1?"
      *   "Are we talking about deduction or induction?"

  8.  **Review and Refine:**
      *   *Tone Check:* Needs to be rigorous, philosophical, but accessible to a rationalist. No fluff.
      *   *Constraint Check:* Did I list *every* distinct reading in the brainstorm? Yes. Did I avoid citations? Yes. American English? Yes. Flag uncertainty? I need to make sure I don't sound dogmatic where archaeological practice varies.
      *   *Self-Correction on "Evidence":* In Bayesian terms, "evidence" is any observation that shifts probability. In common parlance, "evidence" often means "sufficient grounds for belief." I must disambiguate this explicitly.
      *   *Archaeological Specifics:* Ensure taphonomy and sampling bias are central to the "substantive" readings. The "formation process" is key.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Section 1:* Make sure the probabilistic notation is clear. Distinguish between $P(\neg E|H) = 1$ (impossible to detect) and $P(\neg E|H) \approx P(\neg E|\neg H)$ (uninformative).
      *   *Section 2:* Highlight that the mirror slogan is actually the Bayesian default. The original slogan is the *exception* case.
      *   *Section 3:* Keep it tight. Deductive vs. Probabilistic.
      *   *Section 4:* The "Record vs. World" distinction is essentially Signal vs. Source. I should validate this but push for the *process* linking them.
      *   *Section 5:* Questions need to be sharp. "What would have to be true for us to find it?"

  10. **Final Polish:** Check against the "flag uncertainty" instruction. I am unsure about the specific archaeological sub-field conventions (e.g., processual vs. post-processual), but the Bayesian logic holds regardless. I will flag that specific taphonomic models vary.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "The professor is wrong." The professor might be right about *this specific case* if the preservation bias is total. The error is treating the slogan as a universal law rather than a claim about likelihoods. I need to emphasize that the slogan is a claim about the *likelihood ratio*.

