prompt: |-
  I've been doing my family tree for about twenty years now, so I know that world inside out — parish registers, censuses, wills, the DNA matches, and the shoebox of my nan's papers — but I never went to uni and I've never read a history book in my life. The thing I keep bumping into is the same fight historians have about the Trojan War, King Arthur and the Exodus: when does a story stop being just a story and start counting as evidence that anything actually happened? Id like you to take that whole debate — the ones who say there's nothing there, the ones who say there must be a kernel somewhere, and the ones who say the legend is evidence for the people who told it rather than for the events in it — and put it into my vocabulary. Genealogical vocabulary: primary vs secondary sources, the one document that everyones tree is secretly copied from, family lore that somehow gets more detailed the further back it goes, three branches of the family all telling the same story until you find out they all got it from one letter in 1954, two records that disagree and you have to decide which one to believe. Then the bit I actually want: what doesn't survive the translation. Which parts of the historians' argument have no equivalent in what I do, and is that because genealogy is missing something, or because the historians are arguing about something vaguer than it sounds? If the whole thing comes out looking like just "is the source any good or not", then say so — and tell me what would change your mind about that, i.e. what you'd have to see on the historians' side for the leftover to be something real and not just different words for the same thing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Experienced amateur genealogist (20 years), practical, hands-on (parish registers, censuses, DNA, family papers), no formal academic history training. Skeptical but curious.
      *   **Core Question:** How does the historian's debate about myth/legend (Trojan War, King Arthur, Exodus) translate into genealogical terms? Specifically, when does a story become evidence of *event* vs. evidence of *belief*?
      *   **Key Constraint:** Use genealogical vocabulary (primary/secondary sources, derivative sources, family lore, conflicting evidence, etc.).
      *   **Specific Task:** Identify what *doesn't* translate. Is genealogy missing something, or is history arguing about something vaguer?
      *   **Challenge:** If the answer is just "is the source any good or not," admit it and define what would make the historical debate distinct/real.

  2.  **Deconstruct the Historian's Debate (The "Trojan War" Problem):**
      *   *Side A (Minimalists/Skeptics):* No archaeological/textual proof = didn't happen. It's myth.
      *   *Side B (Maximalists/Traditionalists):* There must be a kernel of truth. Oral tradition preserves core facts.
      *   *Side C (Cultural Historians):* Whether it happened doesn't matter; the story tells us about the people who told it.
      *   *The Crux:* The gap between *narrative* and *fact*.

  3.  **Translate to Genealogical Vocabulary:**
      *   *Primary Source:* Birth cert, parish entry, census return (contemporary to event).
      *   *Secondary Source:* A biography written later, a compiled family tree.
      *   *Derivative Source:* A copy of a copy (the "one document everyone's tree is secretly copied from").
      *   *Family Lore:* Oral tradition ("Nan said we were related to Boleyn").
      *   *Corroboration:* Three branches telling the same story (but need to check for common origin).
      *   *Conflict:* Two records disagree (e.g., age on census vs. birth cert).

  4.  **Drafting the Translation (The "Bridge"):**
      *   *The "Kernel of Truth" (Side B):* In genealogy, this is like finding a census entry that matches the family lore. "Great-Grandpa was a blacksmith" -> Find him in the 1881 census listed as Blacksmith. The lore was a secondary source, the census is primary.
      *   *The "It's All Myth" (Side A):* In genealogy, this is the "Royal Descent" that falls apart pre-1700. You hit the brick wall. The lore is derivative of a printed pedigree from 1850 that was made up.
      *   *The "Story as Evidence of Culture" (Side C):* In genealogy, this is analyzing *why* Nan told the story. Maybe she wanted to feel important. The evidence isn't the ancestor, it's Nan's social aspiration.

  5.  **Addressing the "What Doesn't Survive the Translation" (The Core Analysis):**
      *   *Genealogy's Goal:* Identity and biological connection (Did X exist? Was X the parent of Y?). It's binary. Yes/No.
      *   *History's Goal:* Meaning and Causation (Why did X do Y? What did X mean to Z?). It's interpretive.
      *   *The Missing Piece:* Genealogy relies on *individual identification*. History often deals with *collective phenomena* where individual ID is impossible.
      *   *The "Vagueness" Factor:* Historians argue about the *nature of truth* in a narrative. Genealogists argue about the *accuracy of data* in a record.
      *   *Is it just "Source Evaluation"?* Mostly, yes. But there's a nuance. In genealogy, if the source is bad, the fact is discarded. In history, if the source is "bad" (biased, mythical), the *bias* becomes the fact.

  6.  **Refining the Argument (The "Is it just source evaluation?" Test):**
      *   If I say "It's just source evaluation," I need to be careful.
      *   *Genealogist's view:* If the 1850 pedigree says we're royal, and the parish register says we're peasants, the pedigree is wrong. Throw it out.
      *   *Historian's view:* If the 1850 pedigree says we're royal, and the parish register says we're peasants, the pedigree is *evidence of 1850s social climbing*. It's not "wrong" in a useless way; it's "right" about a different question.
      *   *The Difference:* Genealogy asks "Who?" History asks "What does this mean?"
      *   *What would change my mind?* If genealogists started treating false lore as data about the *teller* rather than just discarding it as error. (Actually, good genealogists do this, but often as a side note).
      *   *The Real Distinction:* Scale and Ambiguity. Genealogy collapses ambiguity (I need a name). History sustains ambiguity (Maybe Arthur wasn't a man, but a title). Genealogy hates that.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's expertise. Validate the parallel.
      *   **The Translation:** Map the three historical camps to genealogical scenarios (The Royal Descent, The Common Ancestor, The Family Myth).
      *   **The "One Document" Problem:** Explain derivative sources and the illusion of corroboration.
      *   **The Conflict:** How to resolve conflicting records (Census vs. Bible).
      *   **The Gap (What doesn't translate):**
          *   Binary vs. Spectral truth.
          *   Identity vs. Meaning.
          *   The "Trash Bin" vs. The "Archive."
      *   **The Verdict:** Is it just source evaluation? Yes, but with a different end goal.
      *   **The "Change My Mind" Condition:** What would make the historical debate distinct? (The acceptance of "functional truth").

  8.  **Tone Check:**
      *   Respectful of the user's 20 years of experience.
      *   Avoid academic jargon unless defined by genealogy terms.
      *   Direct, slightly conversational but analytical.
      *   *Self-Correction during drafting:* Make sure I don't sound condescending about "never reading a history book." Frame it as "different toolkits."

  9.  **Final Polish:** Check against specific prompts in the user request (primary/secondary, derivative source, family lore, three branches/one letter, conflicting records). Ensure the "what doesn't survive" section is robust.

  *(Self-Correction on the "Change My Mind" section)*: I need to be precise. If I say it's *only* source evaluation, I might be oversimplifying history. Historians argue about *causality* and *significance*, not just existence. Genealogy proves existence. History explains impact. The "leftover" is the *interpretation of the gap*.

