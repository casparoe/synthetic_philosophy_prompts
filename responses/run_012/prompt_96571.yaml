      *   **Address the Uncertainty (Wild Suffering):** Acknowledge the cousin's point is philosophically deep but empirically murky. It shouldn't veto action on known suffering (factory farms).
      *   **The "Least Bad" Heuristic:** Instead of "zero harm," aim for "significant reduction."
