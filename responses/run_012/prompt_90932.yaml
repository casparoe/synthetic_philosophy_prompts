answer: |-
  We stand today on the high side of the levee, looking across at the ground where the water stood. The river is lower now than it was that spring, and the district across the way has been rebuilt, but the shape of the land remembers what happened here. It has been years since the water broke through at three in the morning, years since the sirens and the shouting and the dark rise of the current where the streets should have been. Eleven people died that night. One of them was a girl I knew, someone I sat beside in a classroom, someone whose absence became a physical weight in the room the next day. I was thirteen years old. I remember the sound of the water, and I remember the silence that followed it. Those memories belong to me, and they belong to the others who were here, and they do not belong to anyone else. That is the first thing we must acknowledge, standing here on this grass above the river. There are things that can be shared, and there are things that must be carried alone.

  This sculpture stands between those two kinds of knowing. The woman who made it came from a country where this river does not flow. She never spent a night in this town. She did not feel the damp in the walls or the shock of the cold. She worked from photographs and from what she was told during three days of interviews. She listened to the voices of people who were wet and frightened, and she tried to turn those voices into stone and metal. I know there are some in this town who have wondered how a stranger could presume to mark a grief that is local and specific. It is a fair question. When someone tells us a thing happened, we can check the facts against the record. When someone tells us a thing is beautiful, or true, or worthy of remembrance, we cannot check that against anything but our own eyes. I have seen the small model of this work, and I have seen photographs of the casting, but I have not seen what stands beneath this sheet. I will not pretend otherwise. I cannot tell you if this work succeeds, because no one can tell you that. You will have to look.

  I stand here as a writer, and people often expect writers to explain what things mean. But words about art are not the art itself, just as words about a flood are not the water. I can tell you that the levee broke, and you can know that fact. I cannot give you the feeling of the ground moving under your feet, and I cannot give you the experience of standing before this figure until you are standing before it. There is a gap between us that no speech can bridge. The sculptor knows this better than anyone. She has taken what we gave her and made something we have not seen, and now she waits while we decide if it holds the weight of what we lost. She is frightened, and she has reason to be. She has built a house out of our stories, and she is handing us the keys. It is not for me to tell you whether the roof holds. It is for me to remind you that the building belongs to you now.

  To the families of the eleven, I know that no bronze or stone can return what was taken. A monument does not fill the empty chair at the table. It does not warm the house when the wind blows off the water. If this work claims to fix what happened, it is lying. If it claims to speak for you, it is presuming too much. What I hope it does is simpler. I hope it stands here as a place where you can stop. I hope it gives you a reason to look across the water without having to explain why you are looking. The value of this thing is not in what I say about it, or what the critics from the capital will write in their notebooks. The value is in the moment you stand before it and feel something that belongs only to you. That is the only testimony that matters. Not my words, not the artist's intent, but your own encounter with the work.

  So we arrive at the moment of unveiling with a shared uncertainty. I was there on the night the water came, and the sculptor was not. But I am not seeing this work yet, and you are not either. In that sense, we are all strangers to it. We are all waiting to see what shape the memory has taken. This is not a failure of authority; it is the condition of making something public. Once the sheet falls away, this thing stops belonging to the artist and stops belonging to the committee that chose her. It belongs to the light that hits it in the morning, and to the eyes that meet it in the evening. It belongs to the river behind it and the town around it. My job is not to judge it for you. My job is to stand beside it and acknowledge that we are all looking at the same thing, even if what we see is different.

  There is a risk in remembering together. We might confuse the map for the territory. We might think that because we have named the loss, we have accounted for it. We have not. The water still flows. The town still stands. The people who died are still gone. This sculpture is not a solution. It is a marker. It says that here, at this place, something happened that required us to stop and look. It asks us to lend our attention to the past without demanding that the past answer back. That is a difficult thing to do. It requires us to be honest about what we know and what we do not. I know the night. I do not know the art. You know the loss. You will know the work when the cloth is removed.

  Let us allow the work to be what it is. Let us allow the sculptor to have done what she could with the words we gave her. And let us allow ourselves the freedom to look without being told what to feel. When the sheet comes down, there will be a silence. Do not rush to fill it. Let the thing stand. Let the river flow behind it. Let the memory of the eleven rest in the space between the water and the levee. We are here to witness, not to verdict. We are here to look.
