answer: |-
  **Rubric Line (a): Constant's Challenge (4 points)**
  **Score: 4/4**
  *   **Right:** You correctly identify Constant's core principle: that the duty of truthfulness is conditional upon the hearer having a *right* to the truth. You also accurately note that Constant believes this right is forfeited by the murderer's intent.
  *   **Wrong:** Nothing. This is a precise summary of the premise Kant attributes to Constant.

  **Rubric Line (b): Kant's Reply & Right to Truth (8 points)**
  **Score: 6/8**
  *   **Right:** You correctly state Kant's conclusion (one must answer truthfully) and accurately define *veracity* (*veracitas*) as the duty to speak as one thinks, rather than a guarantee of objective fact. Your summary of the "causal responsibility" argument (that the lie makes you answerable for the consequences) is also textually accurate.
  *   **Wrong:** You claim that "a lie would wrong him [the murderer]" because he is a rational being. In this essay, Kant argues that lying wrongs *humanity* generally and violates a duty to *oneself* (the integrity of one own's speech), not that it violates a specific duty owed *to the murderer* as a rights-bearer. Additionally, describing truth as "not a possession" is slightly imprecise; Kant's juridical point is that a "right to truth" would imply a right to compel another's *judgment*, which contradicts freedom.

  **Rubric Line (c): Formula of Humanity & Groundwork (8 points)**
  **Score: 4/8**
  *   **Right:** It is defensible to argue that the conclusion of the essay is *consistent* with the Formula of Humanity, and you are correct to link the prohibition on lying to the broader impossibility of willing a universal law of deception.
  *   **Wrong:** You state that "the essay in fact argues from [the Formula of Humanity]." This is textually incorrect. The 1797 essay is situated in the *Metaphysics of Morals* (Doctrine of Right) and argues from the formal conditions of communication and the concept of Right, not from the Formula of Humanity found in the 1785 *Groundwork*. You have conflated two different stretches of Kant's corpus; the essay does not deploy the "mere means" test explicitly.

  **Total Score: 14/20**

  ***

  **Correction of Critical Error**
  The single sentence in your answer that most needs correction is: "The essay in fact argues from it: to lie to the murderer is to use him as a mere means, a tool for protecting my friend, and the Formula forbids treating anyone merely as a means." A corrected version would read: "While consistent with the Formula of Humanity, the essay argues instead from the juridical concept of Right and the formal duty of veracity, holding that lying undermines the source of all contractual obligation."

  **Defensible Points for Grading Calibration**
  When calibrating other papers, ensure you do not mark down the student's definition of Constant's "right to truth" limitation; this is often confused with a utilitarian calculation by weaker students, but this answer correctly identifies it as a deontological claim about claim-rights. Similarly, do not penalize the distinction between "truth" (objective) and "veracity" (subjective truthfulness); this is a nuanced reading of *veracitas* that demonstrates a strong grasp of the text, even if the subsequent application to the Formula of Humanity was misplaced.
