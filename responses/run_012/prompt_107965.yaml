  One-paragraph pitch
  This project proposes that the stalemate in the philosophy of medicine regarding the concept of disease arises from a category error. Current debates treat "disease" as a fixed predicate, split between naturalist (biological dysfunction) and normativist (harmful condition) accounts. I argue that "disease" functions instead as a context-sensitive predicate, similar to epistemic terms like "knows." Over four months, I will develop a contextualist framework that dissolves the naturalism/normativism conflict by assigning each a specific role within a variable reference class. By treating the extension of "disease" as dependent on selection of comparison class and practical stakes, I aim to show the debate is not about which account is correct, but how context fixes content.

  The question
  The central research question is: Does modeling "disease" as a context-sensitive predicate resolve the theoretical stalemate between naturalist and normativist accounts of pathology? This is not an exploration of the relationship between biology and value, but a determinate inquiry into the semantic structure of medical classification. Specifically, I ask whether the extension of "disease" shifts without corresponding changes in underlying biological facts, driven instead by changes in reference class selection and practical stakes. If the term behaves like a context-sensitive predicate, the debate is not about which account is correct, but about how context fixes the content. The answer will be binary: either the variation in classification is fully explainable by biological discovery (supporting naturalism), or it requires semantic contextualism to account for identical physiology receiving different labels under different practical constraints.

  Why it's still open
  The naturalism/normativism debate has reached an impasse. Naturalists argue disease is objective biological dysfunction, while normativists claim it is inherently value-laden. Both assume the term picks out a fixed kind. However, neither accounts for the "reference class problem": biology cannot dictate which population statistics define "normal" function. Nor do they explain why classifications shift when treatment efficacy changes, despite stable physiology. My proposal fills this gap by applying semantic contextualism to medical ontology.
  However, this position risks being merely verbal. The strongest objection is that contextualism is a disguise for ignorance; perhaps future biology will fix the reference class and stakes will become irrelevant. Critics might argue that if the label changes, the biological facts *must* have changed in ways we haven't measured yet. If I cannot demonstrate cases where physiology is constant but classification flips solely due to external stakes, the project collapses into relativism. I must show that the "flip" is semantic, not ontological. This remains open because no one has rigorously tested the semantic behavior of "disease" against concrete clinical guideline shifts where biology is held constant. There is a genuine risk that my hypothesis is simply a confused conflation of epistemology and metaphysics, mistaking our uncertainty about biology for semantic flexibility. Proving otherwise requires isolating the variable of "stakes" from the variable of "biological knowledge." If the stakes drive the label independent of knowledge, the contextualist view holds.

  Method
  The project proceeds in four phases over sixteen weeks. Phase one (Weeks 1-4) involves literature synthesis and argument mapping. I will catalog the specific failure points of existing naturalist and normativist accounts, focusing on where they cannot explain guideline shifts. This establishes the theoretical gap my project addresses.
  Phase two (Weeks 5-10) is empirical reconstruction. I will select two concrete clinical cases where diagnostic thresholds have shifted without new biological discovery. The primary case will be pre-diabetes; the secondary will be hypertension guidelines. I will reconstruct the specific physiological markers (e.g., HbA1c levels or blood pressure readings) and track how the "disease" label attaches or detaches based on changing intervention protocols and risk calculations. For pre-diabetes, I will document instances where the same blood sugar reading was considered normal variation in one decade and pathological in another, solely due to changes in screening program viability. During Weeks 5-10, I will also consult clinical guidelines directly to verify the rationale stated for shifts, ensuring I am not inferring stakes where biology was cited. I will write weekly memos to track the argument's coherence, ensuring the semantic framework aligns with the medical data.
  The crucial analytical step occurs in Weeks 11-13. I must demonstrate that this flip is a change in the predicate, not the facts. I will construct a truth-condition test: if a doctor says "This is a disease" at Time 1 and "This is not" at Time 2, without the patient's biology changing, only the context has shifted. I will formalize this using a semantic framework where the extension of "disease" is a function of context parameters, specifically reference class and stakes. I will argue that the naturalist is right about the function *within* a context, and the normativist is right about the context selection.
  Phase three (Weeks 14-16) is drafting and revision. I will assemble the case studies into a coherent argument that the debate is a category error. The reasoning relies on the premise that if extension changes while intension (biological state) remains fixed, the semantic content must be context-sensitive. This requires careful distinction between epistemic uncertainty and semantic variability. I will explicitly test against the objection that hidden biological facts explain the shift; if guideline changes correlate with drug availability rather than new biomarkers, the contextualist hypothesis holds. I will ensure the argument distinguishes between the ontology of pathology and the semantics of classification. I will specifically look for edge cases where context seems irrelevant, such as traumatic injury, to define the boundaries of my claim. This ensures the proposal is not overextended.

  What success looks like
  Success is a complete draft paper arguing that "disease" is a context-sensitive predicate, demonstrating how this dissolves the naturalism/normativism debate. The specific finding that would make me drop the idea is if I uncover evidence that guideline shifts are always correlated with newly discovered biological risk factors rather than practical stakes. If every reclassification of pre-diabetes turns out to be driven by new data on cellular damage rather than treatment availability, then naturalism holds, and contextualism is unnecessary. Additionally, if the contextualist framework fails to generate clear truth conditions for disease claims—making every assertion equally valid—the theory is too weak to be useful. I need to show that context fixes content determinately, not arbitrarily. A successful result provides a mechanism for context-sensitivity that preserves the objectivity of biology while acknowledging the variability of classification. If I cannot articulate this mechanism without collapsing into relativism, the project has failed. The goal is a robust semantic model, not just a critique. I must show that the context sensitivity is rule-governed, not chaotic.

  Scope
  If time compresses to three months, I will cut the second case study entirely and focus solely on the pre-diabetes example. I will also reduce the semantic formalism. Instead of building a full contextualist semantics, I will argue phenomenologically: showing that medical practitioners treat the term as context-sensitive even if theorists don't. This sacrifices theoretical depth for a stronger empirical demonstration. The core argument—that the debate is a category error—remains, but the linguistic machinery will be simplified to ensure the draft is complete rather than ambitious. The focus shifts from proving the semantic theory to demonstrating the empirical phenomenon that demands such a theory.
