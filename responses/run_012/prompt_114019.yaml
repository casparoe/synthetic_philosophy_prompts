answer: |-
  **Project Title:** The Maximization Premise: Dissolving the Paradox of Deontology as a Category Mistake

  **1. The Governing Question**

  The central question of this paper is: *Is the paradox of deontology a substantive inconsistency within agent-relative constraint-based ethics, or is it an artifact of illicitly applying a teleological structure (the "Maximization Premise") to a non-teleological framework?*

  This question admits a determinate answer in the form of a dichotomy. Either the demand that deontological constraints minimize their own violation is a legitimate internal requirement of rational moral theory (in which case deontology faces a structural defect), or it is a category mistake that imports external consequentialist criteria into a view that rejects those criteria as fundamental (in which case the paradox is dissolved). This paper will argue for the latter disjunct. It aims to demonstrate that the paradox vanishes once we identify and reject the hidden assumption that all moral values function as "maximands" (states of affairs to be brought about), provided the deontologist concedes a specific account of the function of moral constraints: namely, that they govern *agency* rather than *outcomes*.

  **2. Motivation and Background**

  The project originates from the persistent intuitive tension known as the paradox of deontology. In its standard form, the paradox asks: If violating a constraint (e.g., breaking a promise) is bad, why is it not obligatory to violate one constraint to prevent multiple others from violating the same constraint? If the moral theory is organized around the disvalue of promise-breaking, refusing to minimize that disvalue appears irrational, even self-defeating.

  Standard deontological responses typically invoke agent-relativity: my duty is to keep *my* promises, not to minimize promise-breaking in the abstract. However, as my recent dialectical engagement highlighted, this often feels like a restatement of the position rather than a justification. To the critic, insisting that constraints hold even when more of the same would otherwise occur looks like dogmatism unless we can explain why the theory is not answerable to the quantity of violations.

  The working hypothesis for this paper is that the persistence of this puzzle stems from a meta-ethical confusion. We tend to assume that if a theory identifies something as morally significant (like promise-keeping), that significance must cash out in terms of how much of that thing exists in the world. This is the "Maximization Premise." If this premise is not a neutral requirement of rationality but a substantive commitment of consequentialism, then demanding that deontology satisfy it is question-begging. The project seeks to convert this intuition into a rigorous argument: the paradox is not a bug in deontology, but a symptom of viewing all moral theory through a consequentialist lens.

  **3. Why Standard Responses Leave the Question Open**

  Existing literature offers three primary lines of defense, none of which fully satisfy the structural challenge posed by the paradox.

  First, the **Agent-Relative/Agent-Neutral Distinction** approach argues that deontological constraints are essentially agent-relative. While this explains *that* I should not break a promise to prevent five others from doing so, it often fails to explain *why* the agent-relative restriction is rational. To the critic, asserting agent-relativity looks like labeling the problem rather than solving it. It leaves open the charge that agent-relative constraints are irrational because they forbid the agent from acting to produce the best available state of affairs (where "best" is defined by the constraint's own values).

  Second, the **Rights-Based Approach** grounds constraints in the rights of others. I cannot break your promise because I would violate your right, whereas the five others breaking their promises violate the rights of their promisees, which is not my direct doing. While powerful, this response risks shifting the paradox rather than dissolving it. The critic can simply reformulate the question: If rights violations are bad, why is it not obligatory to minimize rights violations? Unless we explain why rights are not "values to be minimized," the structural paradox re-emerges at the level of rights.

  Third, the **Contractualist/Justification Approach** argues that constraints are rules no one could reasonably reject. This explains the origin of the constraints but often sidesteps the structural issue of application. Even if the rule is justified contractually, the agent in the moment still faces the choice: follow the rule or minimize rule-following failures globally. The contractualist account explains why the rule exists, but not necessarily why the agent is barred from optimizing its application in emergency cases.

  All three responses share a weakness: they defend the deontological *verdict* without fully dismantling the *framework* that makes the verdict look paradoxical. They accept the terrain of the argument (that there is a tension between the constraint and the outcome) rather than challenging the assumption that the constraint *ought* to be aligned with the outcome in that specific way. They leave the Maximization Premise intact, treating it as a neutral standard of rationality to which deontology must apologize. This paper proposes that the Maximization Premise is not neutral.

  **4. Proposed Methodology and Approach**

  The paper will proceed by isolating the Maximization Premise and testing its neutrality. The argument will be structured in four movements.

  **Phase 1: Formalizing the Paradox.**
  I will begin by reconstructing the paradox without reliance on specific cases (like the trolley or specific promises). The focus will be on the logical structure: If $V$ is a moral value (e.g., promise-keeping), and Action $A$ reduces the total instantiation of $V$ in the world compared to Action $B$, a rational agent ought to choose $B$. I will show that this principle is not a law of logic but a substantive claim about how values function.

  **Phase 2: Diagnosing the Teleological Assumption.**
  I will argue that the demand for minimization relies on a specific conception of value: that moral values are essentially "states of affairs" to be promoted. I will contrast this with an alternative conception: that moral values can be "standards of conduct" to be honored. The core of this section will be to demonstrate that the move from "X is valuable" to "More X is better" is not automatic. It holds for goods like happiness or welfare, but it does not logically hold for goods like justice, fidelity, or respect, which may be inherently relational or agent-bound.

  **Phase 3: The Concession Requirement.**
  Crucially, I will not argue that deontology is immune to criticism. To avoid the charge of stipulation ("deontology just works this way"), I will identify exactly what the deontologist must concede for the dissolution to work. The deontologist must concede that their theory is not "goal-based" in the standard sense. They must accept that the theory does not offer a unified metric of "moral success" across all agents. This is a significant cost: it means deontology cannot claim to make the world "better" in a global sense, only that it keeps agents "clean" in a local sense. I will argue that this is not a bug, but the intended feature of the view. The success of the dissolution depends on showing that this concession is coherent, not that it is cost-free.

  **Phase 4: Testing the Dissolution.**
  Finally, I will apply this framework back to the specific case that sparked the inquiry: breaking a promise to prevent five others from breaking theirs. I will show that under the "standards of conduct" model, the five future violations are not "more of the same bad thing" in a way that aggregates against the one present violation. They are five separate failures of agency by five separate agents. My agency is not a vessel for fixing their failures. The paradox dissolves because the metric of "total violations" is revealed to be a category mistake—it aggregates distinct moral events that are not fungible across agents.

  **Why This Approach?**
  Alternative approaches often try to show that deontology *does* maximize value in the long run (rule-consequentialist hybrids) or that it protects some higher value (like autonomy). These strategies concede the Maximization Premise; they try to show deontology satisfies it better than consequentialism does. This is strategically weak because it accepts the critic's terms. My approach is superior for a paper of this scope because it attacks the premise itself. It allows for a cleaner, more philosophical resolution that clarifies the distinction between the two ethical frameworks rather than blurring them.

  **5. Criteria for Success and Failure**

  **Success Conditions:**
  1.  **Identification:** The paper successfully isolates the Maximization Premise as a distinct, substantive commitment rather than a neutral requirement of rationality.
  2.  **Coherence:** The alternative conception of value (standards of conduct vs. states of affairs) is shown to be internally consistent and not merely a verbal trick.
  3.  **Cost Acknowledgement:** The paper clearly articulates what the deontologist gives up (the ability to claim global optimization) and argues that this cost is acceptable within the theory.
  4.  **Resolution:** The specific case (1 promise vs. 5 promises) is resolved without residue; the intuition that something is "lost" by not minimizing is explained away as a lingering teleological habit, not a genuine moral remainder.

  **Failure Conditions:**
  1.  **Stipulation:** If the argument relies on defining deontology as "non-maximizing" without explaining how such a system can still be called "moral" or "rational," the project fails. It must show *how* non-maximizing valuation works, not just assert it.
  2.  **Over-Dissolution:** If the argument proves too much by making deontology immune to *any* structural criticism (e.g., if it cannot explain why we should ever care about the consequences of our constraints), the dissolution is too cheap. The paper must leave room for legitimate deontological weaknesses.
  3.  **Under-Dissolution:** If, after the argument, the intuition remains that the agent is still irrational for not preventing the five violations, the category mistake charge has not landed. The "sting" of the paradox must be shown to be illusory, not just tolerated.

  **6. Scope and Limitations**

  **Word Count and Depth:**
  At approximately 8,000 words, this paper must remain tightly focused on the structural paradox. It is a second-year paper, meaning it should demonstrate competence in argument reconstruction and meta-ethical analysis without attempting to solve all problems in normative ethics.

  **Inclusions:**
  *   A rigorous reconstruction of the paradox of deontology (Scheffler-style).
  *   Analysis of the logic of valuation (promoting vs. honoring).
  *   The specific case of promise-breaking as the testing ground.
  *   The meta-ethical implications of the Maximization Premise.

  **Exclusions:**
  *   **Historical Exegesis:** I will not be engaging in detailed textual analysis of Kant, Ross, or other historical figures. Arguments will be referred to by their content (e.g., "the agent-relative defense") rather than by author. This saves space for structural analysis.
  *   **Consequentialist Defense:** I will not attempt to refute consequentialism positively. The goal is to defend the *coherence* of deontology against this specific charge, not to prove it is the *true* morality.
  *   **Other Paradoxes:** I will not address the paradox of self-effacement or the paradox of hedonism. The focus is strictly on the constraint-minimization tension.
  *   **Empirical Psychology:** I will not delve into why humans *feel* the paradox (cognitive science), except insofar as it relates to the philosophical intuition of rationality.

  **Realistic Timeline:**
  *   **Weeks 1-3:** Refining the definition of the Maximization Premise and drafting the formal reconstruction of the paradox.
  *   **Weeks 4-6:** Developing the "promoting vs. honoring" distinction and drafting the core argument (Phase 2 & 3).
  *   **Weeks 7-8:** Applying the argument to the promise case and stress-testing against counter-arguments (Phase 4).
  *   **Weeks 9-10:** Revision, focusing on clarity and ensuring the "concessions" section is robust enough to avoid the charge of stipulation.

  **7. Conclusion**

  The paradox of deontology persists not because deontology is inconsistent, but because we are asking it to answer a question it was designed to reject. By treating the demand for minimization as a category mistake arising from the Maximization Premise, we can dissolve the paradox without resorting to dogmatism. This paper will argue that the price of this dissolution is accepting that moral theory is not always about making the world contain more of the good, but about ensuring that agents relate to the good in the right way. If this distinction can be made precise, the "wreckage" of the argument becomes a clear demarcation line between two fundamentally different ways of thinking about value.
