  # The Perception Decision Tree
  **A Guide to the Argument from Illusion**

  ### Starting Commitment
  You accept that an experience in which something appears other than it is (illusion), or in which nothing is there at all (hallucination), can be **subjectively indistinguishable** from a veridical perception.
  *   *Case:* A straight stick looks bent in water.
  *   *Case:* A drug-induced hallucination is indistinguishable from a genuine sighting.

  ---

  ### The Tree

  **Question 1: Does this indistinguishability imply the mind is in the *same fundamental state* in both the good (veridical) and bad (hallucinatory) cases?**
  *(This is a question about the **metaphysics** of experience: what the experience *is*.)*

  *   **NO** → Go to **Question 2A**.
  *   **YES** → Go to **Question 2B**.

  ---

  #### Path A: The Disjunctivist Route (Different States)

  **Question 2A: If the states are different, does the subject have the *same evidence* or justification for belief in both cases?**
  *(This is a question about **epistemology**: what the subject can *know*.)*

  *   **NO (Different Evidence)** → **Leaf 1: Epistemic Disjunctivism**
      *   *Gloss:* Veridical perception provides factive reasons (you see *that* it is so); hallucination does not.
      *   *Awkward Commitment:* You can sometimes know you are not hallucinating simply by reflecting on your experience, even though it feels the same.
      *   *Case:* A hallucination of a cat that happens to be sitting exactly where the hallucinator is looking (you only know it's real if it *is* real).

  *   **YES (Same Evidence)** → **Leaf 2: Metaphysical Disjunctivism (Sceptical)**
      *   *Gloss:* The experiences are fundamentally different kinds of state, but you cannot tell them apart from the inside.
      *   *Awkward Commitment:* Your justification for belief is never better in the good case than in the bad case, despite the world actually being present in one.
      *   *Case:* A drug-induced hallucination indistinguishable from a genuine sighting.

  ---

  #### Path B: The Common Factor Route (Same State)

  **Question 2B: In this shared state, is your awareness directed at an immediate *object*?**
  *(Does experience involve a 'thing' being presented to the mind?)*

  *   **YES** → **Leaf 3: Sense-Datum Theory**
      *   *Gloss:* In all cases, you are directly aware of a private mental object (a sense-datum) which may represent physical objects.
      *   *Awkward Commitment:* You never directly perceive the physical world, leading to the 'veil of perception' and potential scepticism.
      *   *Case:* A straight stick that looks bent in water (you see a bent sense-datum).

  *   **NO** → Go to **Question 3**.

  **Question 3: If there is no object, is the experience a *representation* of the world or a *manner* of being stimulated?**
  *(Is it like a sentence with content, or like being affected in a certain way?)*

  *   **Representation** → **Leaf 4: Representationalism (Intentionalism)**
      *   *Gloss:* Experience has content (it says the world is thus-and-so) which can be accurate or inaccurate, without needing an object.
      *   *Awkward Commitment:* Hallucinations have content but no object, requiring an explanation of what fixes that content in the absence of the world.
      *   *Case:* Blindsight (responding to stimulus without conscious seeing) suggests content can dissociate from phenomenology.

  *   **Manner** → **Leaf 5: Adverbialism**
      *   *Gloss:* Experience is not a relation to an object but a way of sensing (e.g., sensing 'red-ly' or 'bent-ly').
      *   *Awkward Commitment:* It struggles to explain the structure of experience (e.g., seeing a red ball vs. a blue cube) without smuggling objects back in.
      *   *Case:* A white wall that looks grey in dim light (you are sensing 'grey-ly', not seeing a grey object).

  ---

  ### Analysis of Logical Space

  **Empty Combinations**
  There is one logical combination that the tree does not produce because it is widely considered incoherent: **Same Mental State + Different Evidence**.
  *   *Diagnosis:* If the mental state is identical (Common Factor), most philosophers argue the evidence available to the subject must also be identical (Supervenience of the Epistemic on the Metaphysical). To claim the state is the same but the justification differs is to claim that justification does not depend on the mind's condition, which undermines the internalist motivation for the Common Factor in the first place.

  **Indistinguishable Leaves**
  Readers should note that **Leaf 4 (Representationalism)** and **Leaf 5 (Adverbialism)** are often difficult to separate in practice.
  *   *Reason:* Both deny that experience is a relation to a private object. Many modern 'Representationalists' define content in ways that look very much like 'manners of sensing'. The distinction is often more about linguistic preference than deep metaphysical disagreement.

  ---

  ### Note on Expert Consensus

  As you discuss these positions, please bear in mind the current state of the field:

  1.  **Contested:** The entire tree is contested. There is no consensus on which leaf is correct. **Disjunctivism** (Path A) has gained significant ground in the last 40 years as a reaction against **Sense-Datum Theory** (Leaf 3), but it is not the dominant view.
  2.  **Settled:** It is settled that **Blindsight** (used in Leaf 4) demonstrates a dissociation between visual processing and conscious awareness, but it is *not* settled whether this refutes Representationalism or merely refines it.
  3.  **Terminology:** Be aware that 'Representationalism' is sometimes used as a umbrella term that includes Sense-Datum Theory (as both posit representational intermediaries). In this handout, we follow the contemporary convention that separates them by the *nature* of the intermediary (object vs. content).
  4.  **Epistemology vs. Metaphysics:** This distinction (highlighted in Question 2A) is drawn differently by different writers. Some (like John McDowell) argue that metaphysical Disjunctivism *entails* Epistemic Disjunctivism. Others (like Duncan Williamson) argue you can accept the metaphysical split while retaining the epistemic commonality. This handout treats them as separable to show the logical space.

  ---

  ### Glossary of Cases Used
  *   **Bent Stick:** Classic illusion; physical object is straight, appearance is bent.
  *   **Grey Wall:** Perceptual variation; physical object is white, appearance varies with light.
  *   **Drug Hallucination:** Total hallucination; no object corresponds to the experience.
  *   **Matching Cat:** 'Good' luck hallucination; an object exists where the hallucination places it, but causally unrelated.
  *   **Blindsight:** Neurological condition; subject denies seeing but can guess location of objects accurately.
