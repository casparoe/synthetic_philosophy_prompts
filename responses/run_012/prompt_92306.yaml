answer: |-
  Good evening. For those who don't know me, I am a novelist, which means I make things up for a living. But for the last twenty years, I have also been a friend to [Partner A] and [Partner B], which means I have watched them make a life together, which is much harder work.

  Looking around this room, I see a divide. On my left, the family—warm, funny, and thankfully free of metaphysical training. On my right, the grad school cohort—people who will hear every modal verb in this speech and flinch at any of them that is loose. I have to navigate this carefully. If I say they were "meant" to find each other, the philosophers will wince. If I say their meeting was purely random, the family will think I'm cold. So, I will try to tell the truth about both the accident and the necessity.

  We know how they met. It was grad school. [Partner A] was writing on the metaphysics of modality; [Partner B] was writing on the philosophy of biology. They met in a library aisle, reaching for the same book. It was a narrow miss that became a collision. But we have to acknowledge that it was a contingency. They were both young, adrift, and easily could have taken a different turn. There is a world, very close to this one, where they walk past each other.

  **They could have stood in this light.**

  It was possible. The universe did not conspire to put them there; probability did. But once they were there, once they were *them*, the picture changes. I have spent too long with a view called origin essentialism. It's the claim, usually traced to Kripke, that your identity is welded to the specific sperm and egg that produced you. If that is right, then each of them was, in the strongest possible sense, inevitable from the moment those two cells met. They are not just people; they are *these* people.

  Now, the view has soft edges. We know about twinning. If a zygote splits, origin from that cell cannot be what makes each twin the individual they are, or else the two would be one person. We know there are puzzles about whether what matters is the particular sperm, the particular egg, or only the combination. I would rather gesture at that instability than pretend it away. The metaphysics underneath is contested. But even with those soft edges, the core remains: if the origins shift, the person shifts. If [Partner A] had come from different gametes, [Partner A] would not be here. If [Partner B] had come from different gametes, [Partner B] would not be here. And if they were not here, this love would not be here.

  **They could not have stood in this light.**

  Not as themselves. Not with this history. The necessity of the person protects the contingency of the meeting. They are who they are, and no one else could have built this specific life.

  But metaphysics is a map, not the territory. We are not here to celebrate a logical proof. We are here to celebrate a choice. Because while their existence might be welded to their origins, their union is welded to nothing but their will. They do not stay together because the universe locked them in a causal chain. They stay together because, every day, they choose to. Even if the world were different, even if the modal landscape shifted, their commitment creates a new kind of necessity. Not the necessity of biology, but the necessity of promise.

  **They would have stood in this light.**

  Because that is what they do. They find the light, and they stand in it.

  So, I raise this glass to the accident that brought them together, and the necessity that keeps them there. To the soft edges and the hard truths. To [Partner A] and [Partner B].
