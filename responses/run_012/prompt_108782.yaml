      *   **The Problem/Paradox:** If HPC allows for functional/biological categories like "predator," does the concept of natural kind become too broad? If "predator" is a natural kind, what *isn't*?
      *   **The Deeper Worry:** Does this reduce natural kinds to mere pragmatic utility? If so, are sciences discovering reality or just imposing labels? Is there a distinction between "really real" and "just useful"?
      *   **Goal:** Clarify the tension between essentialism and HPC, address the "predator" example, and tackle the realism vs. pragmatism debate.

