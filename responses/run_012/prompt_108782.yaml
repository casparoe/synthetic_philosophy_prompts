      *   **Clarify the Shift (Essentialism -> HPC):** Briefly recap why we moved from H2O to HPC. Biology doesn't work with necessary and sufficient conditions (think of species variation). HPC saves natural kinds for the special sciences.
      *   **Tackle the "Predator" Example:**
