prompt: |-
  I've got a sabbatical year coming up and I want to spend it on verbal disputes and metaontology — the whole "is this dispute merely verbal" apparatus. The trouble is I cant tell which of the open questions in that area are actually worth a year of one person's life. So rank them for me. Which two or three questions about verbalness, quantifier variance and the rest are most worth working on now, in the sense that settling them would unblock the most other work, and which of the fashionable ones are dead ends that only matter to people already inside the debate? Something I care about more than the field seems to: whether the machinery can do real work outside the ontology seminar room. I keep watching philosophers and physicists talk past each other about time, and economists and ethicists about welfare, and lately a colleague insists that the whole "is the model really reasoning or is it just predicting tokens" fight is a verbal dispute, and I genuinely can't tell whether that's a real diagnosis or just a clever way of ending a conversation. If the apparatus can't be made to do that kind of work, I want to know that too, and I'd rather find out early than after a year of writing. For each question you tell me to keep, say why it's upstream of the others, how tractable it is for one person in a year, and what would move it up or down my list. Give me your actual ordering and defend it, don't hand me a survey. Continuous prose please — no headings, no bullet points, no tables, just write it like an email.
