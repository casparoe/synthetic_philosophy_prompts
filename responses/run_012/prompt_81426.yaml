  4.  **Drafting the Translation (The "Market for Ideas"):**
      *   *Theory as a Position:* Holding a theory is like holding a long position in a specific outcome (e.g., "Resource Scarcity Co.").
      *   *Evidence as Price Action:* Real-world data is the ticker price. If famine happens, price goes up (theory validated). If tech solves it, price goes down (theory challenged).
      *   *Falsification as a Stop Loss:* A scientific theory *should* have a hard stop. "If X doesn't happen by Y date, the theory is dead."
