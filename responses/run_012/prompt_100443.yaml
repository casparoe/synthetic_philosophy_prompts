answer: |-
  ### Phase 1: Brainstorming the Mechanism

  Before we pin a label on this, let's walk through the architecture of what you witnessed. You are describing a situation where the *method of counting* changes the *truth value of the outcome*, even though the *people counting* haven't changed their minds.

  My first instinct is to rule out simple hypocrisy or confusion. You noted that every individual was consistent. If Dr. A believes "Capacity + Informed = No Treatment," and they vote "Yes" on Capacity, "Yes" on Informed, and "Yes" on the Principle, they *must* vote "No" on Treatment to remain rational. If the group ends up voting "Yes" on Treatment, it means the *sum* of the parts is violating the laws of logic that every single part obeys.

  So, where does the logic break? It breaks in the aggregation.

  I'm considering three main buckets:
  1.  **Preference Aggregation (Arrow):** This is about ranking outcomes (I prefer A over B). But your committee isn't ranking outcomes; they are adjudicating truth claims (Is the patient capable? Yes/No). This feels like a category error to call it Arrowian. Arrow is about *wants*; this is about *beliefs* and *logic*.
  2.  **Cyclic Preferences (Condorcet):** This is where the group prefers A to B, B to C, and C to A. That's a loop. What you have isn't a loop; it's a contradiction. It's $P$, $Q$, and $P \land Q \rightarrow R$, but then $\neg R$. That's not a cycle; that's a crash.
  3.  **Judgment Aggregation:** This seems the most fertile. Here, we treat the votes as truth-values on a set of logically connected propositions. The problem arises because majority rule preserves truth on independent propositions but fails to preserve truth on *connected* propositions.

  There is a specific tension here between two procedures:
  *   **Premise-Based Procedure:** You vote on the facts and the rule, and the conclusion is dictated by logic.
  *   **Conclusion-Based Procedure:** You vote directly on the conclusion, ignoring the logical status of the premises.

  Your hospital committee effectively did both, sequentially, and the two procedures yielded contradictory results. This isn't just "inconsistency"; it's a structural inevitability under certain conditions. It suggests that "The Group" is not a unified agent in the same way an individual is. The group mind has a different logic than the individual minds that compose it.

  Okay, I'm confident now. I know the literature this belongs to. It's not Arrow. It's not a Condorcet cycle. It is the **Discursive Dilemma** (often historically rooted in the **Doctrinal Paradox**).

  ***

  ### Phase 2: The Diagnosis

  The phenomenon you are observing is the **Discursive Dilemma** (sometimes referred to in legal contexts as the **Doctrinal Paradox**).

  It was first identified by legal scholars Lewis Kornhauser and Lawrence Sager in 1986 regarding judicial decisions, and later formalized by philosophers Christian List and Philip Pettit in the early 2000s under the banner of **Judgment Aggregation Theory**.

  Here is the precise breakdown of what is happening, why it differs from the concepts you've been offered, and why it matters for the work you cover.

  #### 1. What the Phenomenon Actually Is
  The Discursive Dilemma occurs when a group of rational individuals, each holding a consistent set of judgments on logically interconnected propositions, arrives at a collectively *inconsistent* set of judgments when using majority voting.

  In your hospital example, the logical structure looked like this:
  *   **Proposition $P$:** Patient has capacity.
  *   **Proposition $Q$:** Refusal is informed.
  *   **Constraint:** If $P$ and $Q$, then **Conclusion $C$** (Do not treat).
  *   **Decision:** Vote on $C$ (Treat vs. Do not treat).

  **The Individual Level:** Every doctor on the committee satisfies logical closure. If they believe $P$ and $Q$ and the Constraint, they *must* believe $C$. No individual is contradicting themselves.

  **The Group Level:** The majority believes $P$. The majority believes $Q$. The majority accepts the Constraint. Therefore, logically, the group *should* believe $C$. However, when you put $C$ to a vote, the majority votes $\neg C$ (Treat).

  The group has accepted the premises and the rule but rejected the necessary conclusion. The group, as an entity, is logically incoherent, even though it is composed entirely of coherent agents.

  #### 2. How It Differs from "Arrow's Theorem"
  When people shrug and say "Arrow," they are reaching for the nearest famous impossibility theorem. It is imprecise to the point of error.

  *   **Arrow's Theorem** deals with **Preference Aggregation**. It concerns how we combine *orderings* of outcomes (e.g., "I prefer Policy A over Policy B"). It proves that no voting system can satisfy a set of fairness criteria without being dictatorial.
  *   **The Discursive Dilemma** deals with **Judgment Aggregation**. It concerns how we combine *truth claims* about the world (e.g., "Is the patient capable?").

  The distinction matters because preferences are subjective, but judgments aim at objective truth or logical consistency. Arrow says you can't fairly aggregate *wants*. The Discursive Dilemma says you can't consistently aggregate *reasons* using simple majority rule. Your committee wasn't fighting over what they *wanted* (mostly); they were fighting over the logical implications of what they *believed*.

  #### 3. How It Differs from a Condorcet Cycle
  A Condorcet Cycle is a circular preference ($A > B > C > A$). It creates instability: whatever you choose, there's another option the majority prefers.

  The Discursive Dilemma is not circular; it is **contradictory**. It produces a state of affairs that cannot exist in reality. In your example, the committee simultaneously affirmed "We should not treat" (via premises) and "We should treat" (via conclusion). A Condorcet cycle leaves you unable to choose; the Discursive Dilemma leaves you having chosen two mutually exclusive things.

  #### 4. How It Differs from "The Group Was Incoherent"
  Calling the group "incoherent" implies a psychological failure—that the members were confused or hypocritical. You rightly sensed this was wrong.

  In the Discursive Dilemma, the incoherence is **emergent**. It is a mathematical property of the aggregation function (majority voting), not a psychological property of the voters. You could replace every member of that ethics committee with a logician, and as long as their individual judgments were distributed in a specific way, the group would *still* produce a contradiction. It is a structural flaw in the decision-making protocol, not a moral or intellectual failing of the participants.

  #### 5. Premise-Based vs. Conclusion-Based Aggregation
  You asked whether it makes a difference if you aggregate sub-questions or the final verdict. In Judgment Aggregation Theory, this is the central practical dilemma. You generally have to choose one of two procedures, and both have costs:

  *   **Premise-Based Procedure (PBP):** The group votes on $P$ and $Q$. The conclusion $C$ is derived logically from the majority view on the premises.
      *   *Pros:* Ensures collective rationality and consistency. The "reasons" drive the outcome.
      *   *Cons:* Can be "undemocratic" regarding the outcome. It is possible that a majority of the group actually wants $\neg C$, but they are overruled by the logical implications of the premises. (This is what happened in your first example: the logic said "Don't Treat," but the direct vote said "Treat.")
  *   **Conclusion-Based Procedure (CBP):** The group votes directly on $C$. The premises are ignored or treated as advisory.
      *   *Pros:* Responsive to the group's will on the bottom line.
      *   *Cons:* The group's stated reasons may contradict their decision. (This creates the "hypocritical" minutes you read, where the findings support one outcome but the verdict is another.)

  List and Pettit proved an **Impossibility Theorem for Judgment Aggregation**: You cannot have a voting system that satisfies Universal Domain (any set of individual judgments is allowed), Anonymity (everyone counts equally), Systematicity (issues are treated equally), and **Consistency** (the group output is logically consistent). You must sacrifice one. Usually, committees sacrifice Consistency without realizing it.

  #### 6. The Edges: What Looks Like It But Isn't
  To sharpen your eye for these panels, here are the "false positives" that resemble the Discursive Dilemma but are distinct phenomena:

  *   **Strategic Voting:** If a member votes "No" on Capacity not because they believe the patient lacks capacity, but because they know that if they vote "Yes," the logical outcome will be "No Treatment" (which they oppose), that is strategic manipulation. The Discursive Dilemma assumes everyone is voting sincerely. If they are gaming the system, it's not a paradox; it's politics.
  *   **Semantic Ambiguity:** If "Capacity" means "Medical Understanding" to Dr. A but "Legal Competence" to Dr. B, they aren't voting on the same proposition $P$. This is a communication failure, not a logical paradox. The Discursive Dilemma requires that all members understand the propositions identically.
  *   **Compromise Logrolling:** "I'll vote Yes on your premise if you vote Yes on my conclusion." This creates consistency through deal-making, whereas the Dilemma arises from the absence of such coordination.
  *   **Weighted Issues:** Sometimes a member thinks $P$ is important but $Q$ is trivial. If the voting system doesn't capture intensity of belief, it might look like a paradox, but it's actually a loss of information. (Judgment aggregation usually assumes binary Yes/No, ignoring intensity).

  ### Summary for Your Reporting
  When you see this pattern, you are witnessing the **Discursive Dilemma**. It is not a failure of the experts' intelligence, nor is it standard Arrowian voting paradoxes. It is a specific failure of **majority rule to preserve logical consistency across interconnected propositions.**

  The "shrug" you get from experts is dangerous because it treats a structural flaw as a trivial inconsistency. In a hospital ethics committee, the difference between Premise-Based and Conclusion-Based voting is the difference between rule-of-law consistency (treating like cases alike based on established criteria) and democratic responsiveness (doing what the majority of the committee feels is right *now*).

  Most committees drift between these two modes without declaring which one they are using, which is why you see the minutes contradict the verdict. The fix isn't "smarter voters"; it's a conscious choice of aggregation procedure. They must decide: Are we voting on the *reasons*, or are we voting on the *result*? They cannot do both simultaneously without risking contradiction.
