answer: |-
  This is a profound observation, and your philosopher friend is half-right. She is correctly identifying that the standard *Analytic* philosophy of action (Bratman, Gilbert, Searle) defines "shared intention" and "joint commitment" as requiring common knowledge and mutual belief. By those definitions, your rescue team is impossible.

  However, there is a different tradition—*Phenomenology* and *Practice Theory*—that describes exactly what you are seeing. It accounts for coordination that is cognitively thin, normatively thick, and fragile under scrutiny.

  Here is the carving of the conceptual space you need, using established concepts, followed by a distinction of boundaries, an explanation of the fragility, and a coined term if you need one.

  ### 1. The Nearest Established Concepts

  To capture this phenomenon, you need to triangulate three distinct concepts. No single term does it all, but together they carve the shape.

  **A. Distributed Cognition (The Mechanics)**
  *   **Source:** Edwin Hutchins (Cognitive Anthropology).
  *   **The Fit:** This explains how the team functions without a "global goal" in individual minds. In a ship navigation team (Hutchins' classic example), no single person knows the whole solution; the *system* knows. Individuals process local cues (the slope, the stretcher angle) that are coupled to the others.
  *   **The Limit:** Distributed cognition is functional. It explains how the stretcher gets down, but it doesn't inherently explain why the rescuers feel *morally wronged* if someone quits. It describes the wiring, not the obligation.

  **B. Social Practice Theory (The Norms)**
  *   **Source:** Stephen Turner, Pierre Bourdieu (*Habitus*).
  *   **The Fit:** This explains the normativity without the agreement. In Practice Theory, norms are not mental rules ("I promise to hold this"); they are embedded in the *doing*. If you are trained in this practice, your body expects certain responses from others. When a member wanders off, they aren't breaking a verbal contract; they are violating the *habitus* of the group. The "wronged" feeling is the friction of a practice breaking down.
  *   **The Limit:** Practice theory can be too broad. It explains why we drive on the right, but sometimes lacks the intensity of the specific, high-stakes "we-ness" you describe in the moment.

  **C. Pre-reflective Collective Intentionality (The Experience & Fragility)**
  *   **Source:** Phenomenology (Merleau-Ponty, Dan Zahavi, Hans Bernhard Schmid).
  *   **The Fit:** This is the crucial piece your friend is missing. Phenomenologists argue that "we-intentionality" can exist *pre-reflectively*. You do not need to think "We are doing X." You simply act in a way that incorporates the other's action into your own motor intentionality.
  *   **The Fragility:** This concept explains why naming it kills it. Pre-reflective agency exists only in the *flow*. The moment you reflect on it ("What are we doing?"), you objectify the action. You move from *absorbed coping* to *thematic awareness*. The "we" dissolves into a collection of "I's" observing a plan.

  ### 2. The Carving: Boundaries and Distinctions

  Here is how your phenomenon differs from the neighbors, which will help you write the boundaries of the scenes.

  **Vs. Shared Intention (Bratman/Gilbert)**
  *   **Shared Intention:** Requires a "meeting of minds." I know that you know that we intend X. It is cognitively thick.
  *   **Your Phenomenon:** Requires a "meeting of bodies." I know (kinesthetically) that you are holding the weight. It is cognitively thin.
  *   **The Boundary:** If a character stops to *think* about the plan, they have left your phenomenon and entered Shared Intention. If they just *adjust*, they are in your phenomenon.

  **Vs. Convention (Hume/Lewis)**
  *   **Convention:** Arbitrary coordination (driving on the left vs. right). I follow it because I expect you to follow it. If you break it, I am inconvenienced.
  *   **Your Phenomenon:** Non-arbitrary, functional necessity. If you break it, I am *endangered*.
  *   **The Boundary:** The normative weight. In a convention, I might be annoyed you drove on the wrong side. In your scene, the rescuers feel *betrayed*. The stakes create a moral entitlement, not just a pragmatic expectation.

  **Vs. Mere Aggregate**
  *   **Aggregate:** A crowd running from rain. We are doing the same thing, but my action doesn't depend on yours.
  *   **Your Phenomenon:** Interdependent. My adjustment is a *response* to yours.
  *   **The Boundary:** Counterfactual dependence. If Character A slips, Character B *must* compensate. In an aggregate, if A slips, B keeps walking.

  **Vs. Self-Organizing Order (Flocking Birds)**
  *   **Self-Order:** Emergent behavior without norms. If a bird leaves the flock, the others feel nothing.
  *   **Your Phenomenon:** Emergent behavior *with* normative expectations.
  *   **The Boundary:** The rebuke. If a bird leaves, there is no resentment. If a rescuer leaves, there is resentment. The "normative thickness" is the dividing line.

  ### 3. The Fragility: Is it Essential?

  **Yes.** The fragility you described is essential to this specific mode of agency.

  In phenomenology, this is the distinction between **Ready-to-hand** (*Zuhandenheit*) and **Present-at-hand** (*Vorhandenheit*).
  *   **Ready-to-hand:** When you use a hammer skillfully, you don't notice the hammer. You notice the nail. The tool withdraws.
  *   **Present-at-hand:** When the hammer breaks, you stare at it. It becomes an object of scrutiny.

  Your rescue team operates in a **Collective Ready-to-hand** state. The "team" and the "plan" withdraw. They are invisible mediums through which the work gets done.
  *   **When named:** The moment a leader says, "Here is the plan," the medium becomes an object. The team stops *being* a unit and starts *observing* a unit. The "claim" they have on one another shifts from a mutual vulnerability ("I am relying on your body") to a hierarchical duty ("You are obeying the plan").
  *   **Writing Implication:** You cannot have a character successfully analyze this dynamic *while* it is happening. If they realize, "We are perfectly synchronized," the synchronization will likely falter. The realization is the fracture.

  ### 4. A Coined Term

  If you need a label to hold in your head while writing (not necessarily for the text itself), I propose:

  **Absorbed Joint Agency**

  *   **Definition:** A state of collective action where coordination is achieved through pre-reflective motor-coupling and mutual vulnerability, generating normative expectations without explicit agreement.
  *   **Inside:** The rescue team lowering the stretcher; the orchestra finding the tempo; a jazz rhythm section locking in; a doubles tennis team at net.
  *   **Outside:** A military unit following orders (too explicit); a flash mob (no normative rebuke); a committee voting (cognitively thick).

  **Why this term works for you:**
  1.  **Absorbed:** Captures the "cognitively thin" aspect. They are absorbed in the task, not the plan. It implies the fragility (absorption breaks under scrutiny).
  2.  **Joint:** Captures the "we-ness" and the normative entitlement. It is not solitary.
  3.  **Agency:** Captures the fact that they are *doing*, not just reacting.

  ### 5. Summary for the Novelist

  Your philosopher friend is applying a **Legalistic Model** of action (contracts, agreements, open commitments). You are describing an **Ecological Model** of action (niches, coupling, reliance).

  *   **The Normativity:** Comes from **Mutual Vulnerability**. Because I have adjusted my body to rely on yours, you now hold my safety. You are not just breaking a rule; you are collapsing my support. That is why I am entitled to rebuke you.
  *   **The Silence:** Is not a lack of communication; it is a higher bandwidth of communication. Speech is too slow for the stretcher on the slope.
  *   **The Fragility:** Is the cost of efficiency. To act this fast, you cannot think about acting. To think about acting is to slow down.

  **Recommendation:** Do not try to make the characters understand this. If they understand it, they break it. Let the narrator observe the *consequences* of the bond (the resentment, the seamless movement) without naming the bond itself. The bond is the silence between the words. If you name the silence, it is no longer silence.
