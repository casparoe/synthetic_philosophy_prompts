answer: |-
  ### Brainstorming Pressure Points

  Before drafting the questions, it is useful to map the dialectical terrain. The guest defends a **Causal-Role (CR)** account (function = contribution to a system capacity) against an **Etiological/Selected-Effects (SE)** account (function = effect for which a trait was selected).

  **Pressure Points for the Causal-Role Account:**
  *   **The Indiscriminateness Problem:** Every trait has infinite causal effects. Without selection to filter them, how do we distinguish *the* function from mere side effects?
  *   **The Normativity Gap:** CR describes what a trait *does*. Biology often needs to describe what a trait *should do* (malfunction). If a heart is crushed and cannot pump, CR suggests it has no function. SE suggests it has a function it is failing to perform.
  *   **Interest-Relativity:** CR functions depend on which "system capacity" the analyst chooses to explain. This risks making function claims subjective or pragmatic rather than factual.
  *   **Neutral Drift:** If a trait persists via drift but contributes to a capacity, CR calls it functional. SE does not. Distinguishing functional contribution from coincidental correlation is difficult for CR without fitness data.

  **Pressure Points for the Etiological Account:**
  *   **The Novelty Problem:** New traits (de novo genes, plastic responses) have no selection history. SE risks calling them "functionless" until selection acts, which contradicts biological practice.
  *   **Exaptation Timing:** SE requires a new selection history for a new function. This creates a lag where a trait is useful but lacks a function label.
  *   **Epistemic Access:** Determining selection history is often empirically impossible. CR offers immediate empirical access via experimentation.
  *   **Engineered Systems:** SE must appeal to "artificial selection" or analogies to design to handle synthetic biology, which can feel like a stretch compared to CR's direct appeal to design roles.

  **Strategy for the Interview:**
  The goal is not to let the guest simply list the advantages of CR. The questions must force the guest to explain how CR avoids collapsing into triviality (where everything is a function) or subjectivity (where function depends on the observer), while also pressing on whether SE's problems are fatal or merely epistemic.

  ***

  ### Interview Questions

  **1. The System-Selection Problem**
  Your account defines function as a contribution to a capacity of a containing system. But any trait contributes to countless capacities: the heart circulates blood, but it also makes noise, occupies space, and casts a shadow. Without appealing to a history of selection to filter these effects, what principled criterion do you use to identify the *relevant* system and the *relevant* capacity?

  *   *Likely Reply:* The choice is relative to the explanatory interests of the biologist or the specific capacity being analyzed.
  *   *Follow-up:* If function attributions are relative to our explanatory interests rather than fixed by the biology itself, does this not render function claims interest-relative in a way that undermines their status as objective biological facts? Are we describing the organism, or merely our own curiosity?

  **2. Malfunction and the "Ought"**
  Consider a severely malformed heart that cannot pump blood. On an etiological account, this heart has a function it is failing to perform. On a strict causal-role account, if it contributes nothing to the organism's capacity, it appears to have no function at all. How does your account ground the distinction between a trait that is *malfunctioning* versus a trait that is merely *absent* or *inert*?

  *   *Likely Reply:* We appeal to the function of the trait type or a normal specimen, not the broken token.
  *   *Follow-up:* But what grounds the "normality" of the type if not a history of successful performance? If you cannot appeal to history, are you not forced to treat the "normal type" as a Platonic ideal rather than a biological population statistic?

  **3. Exaptation and Timing**
  Take the classic case of feathers: initially selected for insulation, later co-opted for flight. On your view, does the trait acquire the function of "aerodynamic lift" the moment it reliably contributes to flight, or must there be a subsequent episode of selection stabilizing that effect?

  *   *Likely Reply:* It acquires the function immediately upon reliably contributing to the capacity of flight.
  *   *Follow-up:* If function attribution is immediate, does this not make function claims hostage to future evolutionary events? If the lineage goes extinct tomorrow, was the trait ever truly "for" flight, or was it merely a transient cause of lift?

  **4. Evolutionary Novelty and Drift**
  Consider a *de novo* gene that arises in a lineage and immediately stabilizes a protein complex, yet has not yet been subject to selection, or is maintained purely by drift. The etiological account struggles to call this functional without history. Your account calls it functional easily. But how do you distinguish this functional novelty from a selectively neutral byproduct that also happens to contribute to a system capacity by coincidence?

  *   *Likely Reply:* We distinguish them by measuring the robustness of the contribution to the system's capacity.
  *   *Follow-up:* But robustness often correlates with selection. If you rely on robustness to filter out coincidences, are you not smuggling in a proxy for selection history? Can you draw this line empirically without implicitly asking, "Was this kept by selection?"

  **5. Ecosystem Function**
  In ecology, we speak of the function of a keystone predator or an ecosystem engineer. However, ecosystems do not reproduce or have lineages in the way organisms do, so selection does not act on the ecosystem as a unit. Can a causal-role account make sense of ecosystem function without illicitly treating ecosystems as super-organisms, and does the etiological account fail here entirely?

  *   *Likely Reply:* Causal-role accounts handle this well by referencing ecosystem stability; etiological accounts must resort to metaphor.
  *   *Follow-up:* If you accept function talk in ecology but reject it in organisms without selection history, are you not committed to a pluralism where "function" means fundamentally different things in ecology and physiology? Is there a unified concept of biological function left?

  **6. Molecular Biology Practice**
  A molecular biologist identifies a noncoding RNA that binds to a specific promoter. They assert this is its "function," meaning only its current causal role in regulation, with no thought to evolutionary history. Is this merely a verbal dispute between them and the etiological philosopher, or is there a substantive disagreement about what biology *ought* to mean by function?

  *   *Likely Reply:* It is substantive; the etiological account imposes an unnecessary historical constraint that hinders experimental practice.
  *   *Follow-up:* However, if *any* binding interaction counts as a function, molecular promiscuity implies every molecule has hundreds of functions. Does your account capture the explanatory force of function claims in molecular biology without collapsing into the claim that anything a molecule does is its function?

  **7. Tokens, Types, and Reference Classes**
  When we say "the function of the heart," are we referring to every token heart, or an idealized type? If a particular token heart fails, the etiological account says the token is malfunctioning. If your account says the token simply lacks the function, how do you avoid making every token's function depend on an idealized type that does not physically exist?

  *   *Likely Reply:* Function ascriptions are implicitly generic, referring to the trait type in a standard environment.
  *   *Follow-up:* Who defines the "standard environment"? If the environment changes rapidly, the type's causal role changes. Does this mean the function of the trait type is constantly shifting with the environment, even if the trait's structure remains identical?

  **8. Synthetic Biology and Design**
  In a synthetic gene circuit, the function of a repressor is fixed by human intention, not natural selection. Your account seems to handle this naturally as a causal role in a designed system. But if the circuit reliably produces a toxic side effect that was not intended, does your account classify that side effect as a function of the circuit?

  *   *Likely Reply:* No, because it does not contribute to the capacity for which the system was designed or analyzed.
  *   *Follow-up:* But this appeal to "design intention" mirrors the etiological appeal to "selection history." If you must appeal to intention to filter side effects in synthetic biology, why is it problematic to appeal to selection history to filter side effects in natural biology?

  **9. Explanatory Power**
  Let us step back from metaphysics to explanation. When a biologist says "X is there *because* it does Y," they are often offering an explanation for the trait's presence. If your account severs the link between function and the reason for the trait's presence, what explanatory work is left for the concept of function to do?

  *   *Likely Reply:* It explains how the trait contributes to the maintenance of the current system, not its origin.
  *   *Follow-up:* But if function does not explain presence, is it not merely a description of mechanism? Why retain the teleological vocabulary of "function" rather than simply speaking of "causal contributions" or "mechanisms"?

  **10. Pluralism vs. Unification**
  Given the pressures we have discussed, would you defend a monist view where causal-role function is the *only* legitimate sense of function in biology, or would you accept a pluralist view where etiological functions exist for traits with history and causal-role functions exist for novelties and molecules?

  *   *Likely Reply:* I would defend a monist causal-role view as the primary scientific concept, treating etiological claims as claims about history, not function.
  *   *Follow-up:* If you treat etiological claims as merely historical, how do you account for the normative force of medical diagnosis, where we claim a patient's physiology *ought* to be different? Does stripping function of its etiological basis leave medicine without a philosophical foundation for "health"?

  ***

  ### Note on Unstable Commitments

  The questions most likely to expose an unstable commitment in the guest's position are **Question 1 (System-Selection)** and **Question 2 (Malfunction)**.

  **Question 1** targets the **objectivity** of the view. If the guest admits that function is relative to "explanatory interests," they risk conceding that function is not a biological property but a pragmatic tool of the observer. If they deny this and claim there is a principled way to select the system without history, they must explain what that principle is without circularity.

  **Question 2** targets the **normativity** of the view. Biology and medicine rely heavily on the distinction between "broken" and "working." The CR account struggles to explain why a broken heart is *failing* rather than simply *being different*. If the guest appeals to a "normal type" to solve this, they must explain what constitutes "normality" without implicitly relying on the very selection history they seek to avoid. This is often the point where CR defenders either retreat to pluralism or admit that "normativity" requires an etiological backbone.
