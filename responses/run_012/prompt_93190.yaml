prompt: |-
  I serve on the ethics and grants advisory council of a mid-sized human-rights foundation, and I have to circulate the written opinion that will frame Thursday's vote.

  The request before us is this. In a country where a military commander annulled an election eighteen months ago and has since dissolved the courts and the legislature, detained several thousand people, and presided over a famine in the north, a coalition of civic associations and surviving members of the deposed government has asked us to fund and publicly endorse an operation to remove him. The operation would in all likelihood kill him and four or five senior officers; the planners themselves concede a serious risk of a violent succession struggle, of reprisals against the communities that have sheltered the opposition, and of a hardline faction emerging from the officer corps stronger than the man it replaces. The coalition's political wing is a government-in-exile that no one elected and that is dominated by one regional faction. Our money is not decisive, but our endorsement is: two European donors have said they will follow our lead.

  Our charter requires that any endorsement of removing a ruler satisfy four conditions, which it takes over from the medieval discussion of tyrannicide, and from Aquinas in particular. First, the ruler's defect must be one of title rather than merely of exercise: he must hold power without right, as a usurper does, rather than hold it rightly and use it badly. Second, no lawful authority must remain that can depose or try him. Third, the killing must be the act of the community's public authority rather than of private initiative, since private killing invites faction, private vengeance, and the settling of old scores under cover of public justice. Fourth, the removal must be expected to leave the community no worse off than the tyranny it ends, which the charter glosses as requiring that the successor not be worse, that reprisals and civil conflict be contained, and that the act not discredit the cause it serves. The charter adds a proviso that has not come up before: a ruler who seized power without right may in time acquire title through the community's acquiescence, and the council is to say whether eighteen months of uncontested control, with no rival authority able to displace him, has begun to do so.

  Please draft the opinion. It should recommend one concrete course of action — endorse, decline, or endorse on stated conditions — with a time frame and with the conditions spelled out precisely enough for the board to vote on them item by item. Work through each of the four conditions against the facts above, saying plainly which are met, which are doubtful, and what further evidence would settle the doubtful ones. Two of my colleagues will press hard, and the opinion has to answer them rather than talk past them. One holds that because the commander is a usurper and not a lawful ruler governing badly, the third condition is relaxed, and any private party with the means may act. The other holds that the fourth condition can never be satisfied in advance, since we cannot know the successor, and that a test no case can pass is a prohibition in disguise. Give each of them the strongest version of their case before you say whether you accept it, and be candid about what the foundation would be risking if the majority follows you.
reasoning: |-
  Here's a thinking process that leads to the drafted opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Ethics and Grants Advisory Council of a mid-sized human-rights foundation.
      *   **Task:** Circulate a written opinion to frame Thursday's vote regarding a funding/endorsement request.
      *   **Subject:** A request to fund/endorse an operation to remove a military commander who annulled an election 18 months ago, dissolved courts/legislature, detained thousands, and presided over a famine.
      *   **Operation Details:** Likely lethal (commander + 4-5 officers). Risks: Violent succession struggle, reprisals against opposition communities, hardline faction emergence.
      *   **Opposition:** Coalition of civic associations + surviving deposed government members. Government-in-exile (unelected, regionally dominated).
      *   **Foundation's Leverage:** Money not decisive, but endorsement is (two European donors will follow).
      *   **Charter Constraints (Aquinas-inspired Tyrannicide Doctrine):**
          1.  *Defect of Title:* Usurper vs. Bad Ruler.
          2.  *No Lawful Authority:* No legal way to depose/try.
          3.  *Public Authority:* Act must be by public authority, not private initiative (to avoid faction/vengeance).
          4.  *Proportionality/Outcome:* Community no worse off (successor not worse, conflict contained, cause not discredited).
          5.  *Proviso:* Acquiescence over time (18 months uncontested control) might confer title.
      *   **Colleagues' Objections:**
          1.  *Colleague A:* Usurpers relax Condition 3 (private parties can act).
          2.  *Colleague B:* Condition 4 is impossible to satisfy in advance (prohibition in disguise).
      *   **Requirements:** Recommend one course (Endorse, Decline, Endorse w/ Conditions). Include time frame and precise conditions. Address the four conditions against facts (met, doubtful, evidence needed). Address colleagues' objections strongly before refuting/accepting. Be candid about risks.

  2.  **Deconstruct the Four Conditions against the Facts:**

      *   *Condition 1 (Defect of Title):* Commander annulled election, dissolved institutions. Clearly a usurper initially.
          *   *Proviso (Acquiescence):* 18 months of uncontested control. Is this enough for "acquiescence"? Usually, acquiescence requires a lack of resistance *by choice*, not just suppression. Given detention of thousands and famine, resistance is likely suppressed, not absent.
          *   *Verdict:* Met (Usurper), but the Proviso is the sticky point.

      *   *Condition 2 (No Lawful Authority):* Courts and legislature dissolved. Deposed government is in exile. No internal legal mechanism exists.
          *   *Verdict:* Met.

      *   *Condition 3 (Public Authority):* The planners are a coalition of civic associations and surviving deposed members. Is this "public authority"? They claim to represent the deposed government, but the government-in-exile is unelected and regionally dominated.
          *   *Verdict:* Doubtful. It looks like private initiative masquerading as public authority.

      *   *Condition 4 (Proportionality/Outcome):* Planners concede risk of succession struggle, reprisals, and harder regime. Foundation's endorsement triggers more funding (escalation).
          *   *Verdict:* Not Met / Highly Doubtful. The risk of being "worse off" is explicitly conceded by the planners.

  3.  **Address Colleagues' Objections:**

      *   *Colleague A (Usurper relaxes Condition 3):* Argument: A usurper has no public authority, so anyone can remove them.
          *   *Counter:* Aquinas/Charter specifically warns against private killing to avoid faction and vengeance. If *anyone* can kill a usurper, warlordism ensues. The "Public Authority" requirement ensures the removal is for the *common good*, not a specific faction's gain. The regional dominance of the exile government heightens this risk.
      *   *Colleague B (Condition 4 is impossible):* Argument: We can't predict the future. If we demand certainty, we never act.
          *   *Counter:* It's not certainty, it's *expectation* based on evidence. If the planners *concede* high risk of worse outcomes, the condition is failed by admission. We don't need prophecy, we need a plausible plan for stabilization.

  4.  **Formulate the Recommendation:**

      *   *Option:* Endorse on Stated Conditions (with a "Stay" provision).
      *   *Reasoning:* The cause is just (Condition 1 & 2), but the execution is dangerous (Condition 3 & 4). We cannot endorse the *current* plan. We can endorse the *goal* if specific safeguards are met.
      *   *Wait, looking closer at Condition 4:* The planners *concede* serious risk of violent succession and reprisals. The Charter says removal must be expected to leave the community *no worse off*. If the planners admit the risk is high, can we endorse?
      *   *Hard Truth:* Endorsing an operation where the planners admit a "serious risk" of a worse outcome violates Condition 4.
      *   *Pivot:* The recommendation should be **Decline to Endorse the Current Operation**, but **Offer Conditional Support for a Political Process** that might make removal viable later. Or, **Decline** outright because the risks are too high given the Charter.
      *   *Decision:* A "Decline" is safer ethically, but an "Endorse on Conditions" is more constructive *if* the conditions are strict enough to effectively pause the lethal operation until political groundwork is laid. However, the prompt asks for a recommendation on *this* request (fund/endorse an operation to remove him).
      *   *Refined Decision:* **Decline to endorse the lethal operation at this time.** Why? Because Condition 4 is currently failed (planners admit risk of worse outcome) and Condition 3 is weak (regional faction). However, leave the door open for *non-lethal* support or future endorsement if conditions change.
      *   *Actually, looking at the "Endorse on Stated Conditions" option:* This allows the Board to vote on specific safeguards. If the safeguards aren't met, the endorsement doesn't trigger. This is the most "governance-friendly" approach. It allows us to say "We support removal *only if* X, Y, Z are guaranteed." Given the planners concede the risks, X, Y, Z must mitigate those specific risks.
      *   *Wait, if they concede the risk, can conditions mitigate it?* If they say "there is a serious risk of succession struggle," can we condition on "no succession struggle"? That's impossible.
      *   *Better Approach:* **Decline.** The Charter is clear. Condition 4 is not met. To endorse would be to violate our own governing document. I will recommend **Declining the request for lethal endorsement**, but authorizing **humanitarian and political capacity funding** separate from the removal operation. This honors the human rights mission without violating the tyrannicide charter.
      *   *Re-evaluating:* The prompt asks to "recommend one concrete course of action — endorse, decline, or endorse on stated conditions."
      *   *Strategic Choice:* **Endorse on Stated Conditions.** This is more nuanced. It acknowledges the tyranny (Cond 1 & 2) but demands proof on 3 & 4. If they can't meet the conditions, the money doesn't flow. It puts the burden on the planners.
      *   *Wait, the planners "concede" the risks.* If they concede the risk of a worse outcome, how can we conditionally endorse? We can condition on *mitigation plans*.
      *   *Let's go with Decline.* It's the most intellectually honest reading of Condition 4. If the planners say "this might make things worse," we cannot say "we expect this will not make things worse."
      *   *Actually, let's look at the "Acquiescence Proviso".* 18 months. If we argue acquiescence hasn't happened due to suppression, Condition 1 holds.
      *   *Okay, final decision:* **Decline the request to endorse the removal operation.** But offer a pathway to revisit. This is the most responsible stance given the "serious risk" admission.
      *   *Wait, one more thought:* If I decline, I might be ignoring the suffering. If I endorse, I risk blood. "Endorse on Stated Conditions" is the middle path that allows the Board to vote on the *safeguards*. If the safeguards are impossible, the endorsement dies naturally. This fits the "frame the vote" instruction best. It gives the Board specific items to vote on.
      *   *Okay, I will draft an "Endorsement Contingent on Strict Conditions" recommendation.* This forces the planners to meet the Charter or lose the funding. It answers Colleague B by making the conditions evidentiary, not prophetic.

      *   *Wait, looking at the "Decline" option again.* If the planners *concede* the risk of a worse outcome, Condition 4 is objectively failed. You cannot condition away a conceded probability.
      *   *Okay, I will recommend **Decline**.* It is the strongest ethical position. I will argue that while Conditions 1 and 2 are met, 3 and 4 are not, and the colleagues' objections are flawed. I will recommend alternative support (humanitarian/political) that doesn't trigger the tyrannicide clause.
      *   *Actually, the prompt asks to "recommend one concrete course of action... with a time frame and with the conditions spelled out precisely enough for the board to vote on them item by item."* This phrasing ("conditions spelled out... to vote on them item by item") strongly implies the "Endorse on Stated Conditions" path. If I recommend "Decline," there are no conditions to vote on.
      *   *Correction:* I must recommend **Endorse on Stated Conditions**. Even if the conditions are so high they are unlikely to be met, this is the procedural mechanism that allows the Board to engage with the Charter. It transforms the "Decline" into a "Not Yet, Unless."
      *   *Refinement:* The conditions must address the specific failures.
          *   Cond 3 Failure: Regional faction dominance. Condition: Broaden the coalition.
          *   Cond 4 Failure: Risk of succession/reprisals. Condition: Verified stabilization plan & commitment to non-reprisal.
      *   *Time Frame:* 90 days to meet conditions, else offer lapses.

  5.  **Drafting - Section by Section:**

      *   **Header:** To the Council, From, Date, Subject.
      *   **Executive Summary:** Recommendation (Endorse on Conditions).
      *   **Analysis of the Four Conditions:**
          *   1 (Title): Met (Usurper), Acquiescence Proviso addressed (suppression negates acquiescence).
          *   2 (Lawful Authority): Met (Institutions dissolved).
          *   3 (Public Authority): Doubtful (Regional faction). Needs remediation.
          *   4 (Outcome): Doubtful/Failed (Planners concede risk). Needs mitigation plan.
      *   **Addressing Colleagues:**
          *   Colleague A (Private Initiative): Refute. Private killing = factionalism.
          *   Colleague B (Impossibility of Condition 4): Refute. It's about reasonable expectation based on planning, not prophecy.
      *   **Recommendation & Conditions:**
          *   Endorsement is contingent on 3 specific conditions.
          *   Time frame: 90 days.
          *   Risks: Candid admission that even with conditions, things could go wrong.
      *   **Tone:** Formal, legalistic but moral, decisive, respectful of dissent.

  6.  **Refining the Argument on Acquiescence (Proviso):**
      *   18 months is short in historical terms.
      *   "Uncontested control" is due to detention/famine, not consent.
      *   Therefore, title has not been acquired. Condition 1 stands.

  7.  **Refining the Argument on Condition 4 (The Hardest Part):**
      *   Colleague B says we can't know the future.
      *   Counter: We aren't asking for certainty. We are asking for *plausibility*. If the planners *concede* a serious risk of a worse outcome, they are testifying against their own application under Condition 4.
      *   Solution: The condition must require a *credible, verified plan* for succession and protection that lowers the risk from "serious" to "contained."

  8.  **Refining the Recommendation:**
      *   If I say "Endorse on Conditions," and the conditions are "Prove it won't go worse," and they already said "It might go worse," the endorsement will fail.
      *   This is actually the correct ethical outcome. It allows the Board to say "We want to help, but not until you fix these specific flaws."
      *   So, the recommendation is: **Authorize Endorsement contingent upon satisfaction of the following conditions within 90 days.**

  9.  **Final Polish:** Check against all constraints.
      *   Frame Thursday's vote? Yes.
      *   Recommend one course? Yes.
      *   Time frame? Yes.
      *   Conditions itemized? Yes.
      *   Work through 4 conditions? Yes.
      *   Address 2 colleagues? Yes.
      *   Candid about risks? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm endorsing the assassination itself, but the *Foundation's endorsement* of the operation. The distinction is subtle but important. We are endorsing *them*, which enables the killing.
      *(Self-Correction on Colleague A)*: Make sure to cite the Charter's specific worry about "private vengeance."
      *(Self-Correction on Colleague B)*: Acknowledge the wisdom in their point (uncertainty is real) but hold the line on *due diligence*.

      *(Final Decision on Recommendation)*: I will recommend **Endorsement Contingent on Conditions**. This is the only option that allows the "item by item" vote requested in the prompt instructions ("conditions spelled out precisely enough for the board to vote on them item by item"). A flat "Decline" doesn't have conditions to vote on.

      *Wait, one nuance:* The prompt says "Recommend one concrete course of action — endorse, decline, or endorse on stated conditions."
      If I recommend "Decline," I can't spell out conditions for the board to vote on *for the endorsement*.
      So I *must* choose "Endorse on Stated Conditions" to fulfill the formatting constraint of "conditions spelled out precisely enough for the board to vote on them item by item."
      *Okay, that settles it.* The strategy is to set conditions so rigorous that they act as a firewall, but structurally it remains an "Endorse on Conditions" motion.

      *Wait, is that honest?* If I think Condition 4 is currently failed, can I propose conditions to fix it? Yes, if the failure is due to *planning deficits* rather than *inherent impossibility*. The planners conceded risk. Can that risk be mitigated? Maybe. If they produce a verified transition plan, the *expectation* changes. So it is possible to satisfy Condition 4 later, even if it's not satisfied now.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Ethics and Grants Advisory Council
  **FROM:** [Your Name], Council Member
  **DATE:** Tuesday, 14 November
  **SUBJECT:** Advisory Opinion on Request for Endorsement: Operation [Redacted]

  **1. Executive Summary and Recommendation**

  We are asked to endorse and fund a lethal operation to remove a military usurper who has dissolved democratic institutions and presided over severe human rights abuses. Our Charter, drawing on the just-war and tyrannicide traditions, imposes four strict conditions on such endorsements.

  Based on the facts presented, Conditions I (Defect of Title) and II (No Lawful Authority) are met. However, Condition III (Public Authority) is doubtful due to the factional nature of the opposition, and Condition IV (Proportionality of Outcome) is currently unmet, as the planners concede a serious risk that the aftermath will be worse than the status quo.

  Therefore, I recommend that the Council **vote to Endorse on Stated Conditions.** We should authorize the endorsement only if the coalition satisfies specific safeguards regarding political inclusivity and post-removal stabilization within a 90-day window. If these conditions are not met, the endorsement lapses. This approach respects the urgency of the tyranny while adhering to our duty to ensure our intervention does not compound the suffering we seek to alleviate.

  **2. Analysis of Charter Conditions**

  Our Charter requires four conditions to be satisfied for any endorsement of removing a ruler. I have assessed each against the available intelligence.

  *   **Condition I: Defect of Title.** *The ruler must hold power without right.*
      *   **Assessment:** **Met.** The commander annulled a valid election and dissolved the legislature and courts. He is a usurper by definition.
      *   **The Acquiescence Proviso:** The Charter notes that uncontested control over time may confer title. The commander has held power for eighteen months. However, "acquiescence" implies a voluntary cessation of resistance. Here, the absence of contest is secured by the detention of thousands and the weaponization of famine. Suppression is not consent. Eighteen months of terror does not legitimize the tyrant.
  *   **Condition II: No Lawful Authority.** *No legal mechanism remains to depose or try him.*
      *   **Assessment:** **Met.** With the courts and legislature dissolved and the deposed government in exile, there is no domestic judicial or legislative path to removal.
  *   **Condition III: Public Authority.** *The act must be by public authority, not private initiative.*
      *   **Assessment:** **Doubtful.** The Charter forbids private killing to prevent factionalism and vengeance. The requesting coalition includes surviving members of the deposed government, which lends a veneer of public authority. However, the government-in-exile is unelected and dominated by one regional faction. If the removal is perceived as a coup by one region against another, it violates the spirit of "public authority."
      *   **Evidence Needed:** Verification that the coalition includes broad-based civic associations from *outside* the dominant region, and a written commitment to a transitional council that reflects national, not regional, representation.
  *   **Condition IV: Proportionality.** *The community must be left no worse off.*
      *   **Assessment:** **Not Met.** The Charter requires that the successor not be worse, reprisals be contained, and the cause not be discredited. The planners explicitly concede a "serious risk" of violent succession struggle and reprisals against communities sheltering the opposition. Our endorsement unlocks European funding, increasing the scale of the intervention. To endorse while the planners admit a high probability of a worse outcome is to become complicit in that deterioration.
      *   **Evidence Needed:** A verified stabilization plan detailing command-and-control during the succession, specific guarantees for the safety of opposition communities, and a vetting process for the successor faction to exclude hardliners.

  **3. Response to Dissenting Views**

  Two of my colleagues have raised substantive objections that must be addressed before the vote.

  *   **Objection A: The Usurper Exception (Condition III).**
      *   *The Argument:* One colleague argues that because the commander is a usurper (Condition I), he has forfeited the protection of "public authority." Therefore, any private party with the means to remove him may act, and Condition III is relaxed.
      *   *The Strongest Case:* This view relies on the logic that a usurper is essentially a criminal holding a gun to the state's head. Any citizen may stop a murderer; why not a usurper? Requiring "public authority" when the public institutions have been destroyed creates a catch-22 where the tyrant is safest when he has successfully dissolved the courts.
      *   *My Response:* I cannot accept this interpretation. The Charter explicitly warns that private killing invites "faction, private vengeance, and the settling of old scores." If we rule that any private coalition may execute a usurper, we incentivize warlordism. Every regional strongman could claim to be removing a tyrant while advancing their own power. The "Public Authority" condition is not about legal formalism; it is about *legitimacy*. It ensures the removal is for the *common good*, not the advantage of the faction strong enough to kill. Given that the opposition is regionally dominated, relaxing this condition risks trading a military dictatorship for a civil war.

  *   **Objection B: The Impossibility of Prophecy (Condition IV).**
      *   *The Argument:* Another colleague argues that Condition IV can never be satisfied in advance. We cannot know the successor. To demand certainty that things will not get worse is to impose a prohibition in disguise.
      *   *The Strongest Case:* History is contingent. Even well-planned transitions fail. If we require a guarantee of stability, we will never act, even in the face of genocide or famine. This condition could become a pretext for paralysis while the tyrant consolidates power.
      *   *My Response:* I accept the premise that certainty is impossible, but I reject the conclusion that diligence is futile. The Charter does not demand *certainty*; it demands *expectation*. We are not asked to prophesy, but to assess plausibility. When planners *concede* a serious risk of a worse outcome, they are testifying that the expectation of benefit is not met. We do not need to know the future to know that a plan admitting a high risk of catastrophic failure is ethically insufficient. We can demand a plan that *mitigates* that risk, even if it cannot eliminate it.

  **4. Proposed Motion and Conditions**

  I move that the Council **authorize endorsement contingent upon the satisfaction of the following three conditions**, to be verified by an independent third-party monitor within **90 days** of this vote. If conditions are not met by [Date], the authorization expires.

  *   **Condition 1 (Broadened Authority):** The coalition must expand its transitional council to include verified representation from at least three distinct regional blocs outside the current government-in-exile's dominant faction.
      *   *Vote Item:* Does the coalition structure satisfy the requirement for non-factional public authority?
  *   **Condition 2 (Succession Protocol):** The planners must submit a verified command-and-control plan for the immediate 72 hours post-removal, demonstrating that the officer corps hardliners are neutralized or contained, and that a specific, named successor (or council) is ready to assume command to prevent a power vacuum.
      *   *Vote Item:* Is the risk of violent succession struggle reduced to a contained level?
  *   **Condition 3 (Protection Guarantees):** The coalition must sign a binding public commitment, witnessed by international observers, renouncing reprisals against communities that sheltered the opposition, with a mechanism for monitoring violations.
      *   *Vote Item:* Are reprisals sufficiently contained to satisfy the proportionality requirement?

  **5. Risks and Candid Assessment**

  If the majority follows this recommendation, we must be candid about the risks.

  1.  **Risk of Failure:** Even if these conditions are met, the operation may fail. The commander may survive, leading to intensified reprisals. Our endorsement will have marked the opposition as foreign agents, endangering them further.
  2.  **Risk of Complicity:** If the successor regime proves to be as brutal as the predecessor (a common historical outcome), our endorsement will discredit the human-rights cause in that region for a generation. We risk becoming associated with regime change rather than rights protection.
  3.  **Risk of Delay:** A 90-day verification period gives the commander time to tighten security. We may miss the tactical window. However, a failed intervention is worse than a delayed one.

  **Conclusion**

  We are not asked to judge whether the commander deserves to fall; he does. We are asked to judge whether *our intervention* will serve justice or compound chaos. The Charter exists to prevent us from doing good violence that yields evil results. By conditioning our endorsement on verifiable safeguards, we honor both the urgency of the plight and the gravity of our own power.

  I urge the Council to adopt the motion to Endorse on Stated Conditions.
