  The track record
  Her verdicts divide cleanly between paradigmatic animals and humans (yes) and artifacts or simple biological mechanisms (no). The tension lies in the boundary cases. The bacterium is biological yet denied original intentionality, contrasting with the mouse and dog. The honeybee is granted it marginally, justified by "aboutness" rather than mere response. Artifacts like chess engines and LLMs are denied despite high competence, while hand-coded robots are denied despite embodied action. The pattern suggests biology is necessary but not sufficient, requiring something beyond mere causal tracking or designed function.

  Candidate rules
  Rule One is "Biological Learning." Original intentionality requires an evolved biological nervous system capable of adaptive learning beyond tropism. This accommodates the mouse, dog, and human, and explains the bacterium's exclusion as mere taxis. It strains slightly on the honeybee, treated as marginal perhaps due to instinctual rigidity. Rule Two is "Teleological Independence." Content must be fixed by evolutionary history or individual learning, not by human stipulation, and must exhibit genuine "aboutness." This clears the mouse and dog while excluding the hand-coded robot and LLM. It uniquely supports the digital organisms, as their states evolved without specific human semantic assignment. Rule Three is "Phenomenal Grounding." Original intentionality requires conscious experience. This secures the vertebrates and human, excludes the thermostat and corporation, and renders the honeybee marginal. It decisively excludes the digital organisms, lacking substrate for experience. These frameworks compete to explain her stability.

  Predictions for the new case
  Under "Biological Learning," the verdict is no. Digital organisms lack carbon-based nervous systems, placing them with the thermostat and hand-coded robot regardless of their evolutionary history. Under "Phenomenal Grounding," the verdict is also no. Simulated states do not feel like anything, aligning them with the chess engine and LLM. However, under "Teleological Independence," the verdict flips to yes. Since no human specified what the internal states represent, and selection fixed their content, they escape the "derived" label applied to the robot and corporation. This rule treats the simulation's evolutionary history as functionally equivalent to natural selection. The other rules remain silent on whether substrate matters more than history, but generally imply a negative verdict based on the artifact status. The student champions the second rule; the skeptic, the first or third. Thus, the committee deadlock mirrors the theoretical conflict.

  My best guess
  She will likely vote yes, though with reservations similar to the honeybee. Her resistance to Searle suggests biology isn't strictly necessary, while her rejection of Dennett implies designer independence matters. The bacterium exclusion hinges on "mere response," whereas the digital organisms build internal states mapping food locations, satisfying her "aboutness" condition. The lack of human specification distinguishes them from the hand-coded robot and LLM. She values the evolutionary fixing of content over the substrate. However, expect her to call it marginal, paralleling the honeybee, because the "world" is virtual. She prioritizes the history of selection over the material base, provided the system exhibits genuine aboutness rather than reflex. Her position is nuanced.

  The discriminating case
  Consider a genetically engineered mouse, designed by humans rather than evolved, that learns a maze. "Biological Learning" predicts yes, as it possesses the requisite nervous system. "Teleological Independence" predicts no, as its capacities stem from human stipulation, akin to the hand-coded robot. "Phenomenal Grounding" depends on whether engineering precludes experience. This case isolates substrate from history. If she grants original intentionality, biology trumps history; if she denies it, evolutionary history trumps biology. This cleanly separates the surviving rules regarding the necessity of natural selection versus material constitution.
