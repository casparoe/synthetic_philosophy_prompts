  Adopting the average ladder score as a national target conflates distinct conceptual interpretations of what respondents report. The score is not a univocal measure of welfare; it is an interaction between condition, expectation, and expression. Treating it as a simple KPI risks perverse incentives.

  First, consider the score as a measure of **how well lives are actually going**. Here, the scale is assumed interpersonally comparable and anchored in objective welfare. *Implication:* Government must improve material conditions, health, and liberty. If this reading holds, raising the score is synonymous with improving welfare, and topping the ranking is genuinely desirable. However, this assumes a '7' signifies the same quality of life in Oslo as in Osaka, which is empirically contentious.

  Second, view the score as a measure of the **gap between reality and expectations**. Evaluations often depend on aspirational benchmarks rather than absolute states. *Implication:* The score can be raised by improving conditions *or* by lowering expectations. Consequently, a policy could improve people's lives (e.g., expanding education and opportunity) while lowering the score, if raised expectations outpace tangible gains. Conversely, suppressing ambition could lift the ranking. Under this reading, reaching the top is not necessarily worth wanting; it might indicate a populace with successfully managed aspirations rather than enhanced lives. A government optimising for this metric might discourage social mobility to maintain satisfaction.

  Third, interpret the score as a measure of **what people take to be a normal thing to say**. Response styles vary culturally; some societies value modesty, others positivity. The score reflects linguistic norms or social desirability bias rather than internal states. *Implication:* Government efforts would focus on shifting cultural narratives or encouraging optimistic reporting, potentially decoupling the metric from lived experience entirely. Topping the ranking would merely signify a culture of boastfulness or compliance, holding no intrinsic welfare value.

  The explicit aim of climbing the international ranking exacerbates this ambiguity. If the metric is driven by expectations or norms, climbing the ranking may require policies contrary to welfare maximisation. The panel must recognise that maximising the score is not identical to maximising well-being unless the first reading is exclusively valid. Without this guarantee, targeting the score invites a government to lower aspirations or manipulate culture rather than improve lives. Thus, reaching the top of the ranking is only worth wanting if the score purely reflects objective conditions; otherwise, it is a hollow prize.
