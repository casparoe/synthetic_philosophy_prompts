  I'm assembling a short "philosophy of logic and language" set to perform at a departmental party, and I want one joke that is genuinely about Bradley's regress and the unity of the proposition, not a generic jab at philosophers. What I'm after is a joke whose punchline turns on the actual mechanics of the problem: that any relation supposedly responsible for unifying the constituents of a proposition into a single thinkable content — or for holding between two terms — seems to need a further relation to attach it to those constituents, and then another to attach that relation, and so on without end, so that the very thing meant to explain unity either never gets off the ground or presupposes what it was meant to explain. Someone who has actually worked through the debate should be able to recognize that the humor comes from the structure of the regress rather than from the mere mention of Bradley's name.

  A seed, if it's useful: I keep picturing a support group for relations that are worn out by the demand that they account for their own attachment to their relata, with one of them protesting that it was hired to relate two things and has somehow been made responsible for relating itself to them as well. You needn't use that. You're also welcome to lean on a contested reading if it sharpens the joke — for instance, treating the regress as evidence that relations are unreal and that relational discourse is only ever an approximation of a seamless whole, or conversely treating it as a harmless artifact of our notation rather than a real problem about unity — and it might help to know that the same pattern seems to recur for the relation of instantiation between a property and its bearer, and for the composition of a whole out of its parts, so the joke can play on that repetition if you like. Keep it short enough to deliver out loud, and make sure it lands for an audience that has thought seriously about how a proposition differs from a mere list of its components.

  Since a joke has no verdict to render, I won't ask you to grade its accuracy, but I would like a brief closing note on where it takes liberties with the ideas or leans on a contested reading; within that note, please state plainly how confident you are in your characterization of the regress and identify the single point about it you are least sure of.
