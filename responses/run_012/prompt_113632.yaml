  **FORTIFY KNOWLEDGE ASSURANCE LTD.**
  **Policy Schedule K-99: Epistemic Liability & Encroachment Coverage**

  **1. Definition of Insurable Knowledge**
  The Insured possesses "Knowledge" when holding a Justified True Belief (JTB) sufficient to warrant action in the current Practical Environment. The Insurer acknowledges that evidential weight remains static regardless of context. However, as pragmatic encroachment dictates that knowledge thresholds rise proportionally to stakes, premiums are adjusted to reflect the cost of maintaining JTB status under pressure.

  **2. Premium Schedule & Tiered Exposure**
  Premiums are calculated based on the consequence of error, not the quality of evidence.
  *   **Tier 1 (Low Stakes):** Belief that "The Bank Branch is Open Saturday" for the purpose of depositing a check. Evidence required: Standard signage. Premium: £15.00/month.
  *   **Tier 2 (High Stakes):** Belief that "The Bank Branch is Open Saturday" where failure to deposit results in foreclosure. Evidence required: Same as Tier 1. Premium: £4,500.00/month.
  *   *Note:* The Insured's evidence does not change between tiers. The Insurer covers the epistemic gap created by the increased cost of being wrong.

  **3. Stake-Reduction Rider (Optional)**
  For Clients unable to afford Tier 2 premiums, Fortify offers a Stake-Reduction Rider. For a fee, Fortify will intervene to lower the practical consequences of error, thereby aligning high-stakes environments with Tier 1 evidence levels.
  *   *Example:* In the foreclosure scenario, Fortify may pay the penalty fee to defer the mortgage deadline. The stakes are lowered; the original evidence becomes sufficient; Knowledge is restored without additional investigation.

  **4. Actionability & Loss Exclusion**
  Claims are subject to the Actionability Clause.
  *   **4.1:** No payout shall be made if the Insured fails to act on the belief. If the Insured claims to have known the bridge was out but drove onto it regardless, the belief was not action-guiding and therefore did not constitute Knowledge.
  *   **4.2:** No payout shall be made if the Insured acts and succeeds. Successful action verifies the belief, confirming Knowledge was present. As Knowledge is not an insurable loss, no indemnity is due. Coverage applies only to instances where stakes rendered Knowledge inaccessible prior to loss.

  **5. Disclosure & Regress Management**
  Clients must complete the Stakes Questionnaire. Question 12 requires the Client to assess: "What are the practical stakes involved in answering this questionnaire incorrectly?" Failure to accurately price the stakes of Question 12 voids the policy, as misjudging the stakes of the assessment indicates insufficient knowledge to insure.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Why shouldn't I just gather more evidence instead of buying insurance?**
  A: Evidence gathering is cost-prohibitive. Calling the bank, visiting the branch, and consulting ledger records requires time and resources. Fortify's model recognizes that adjusting stakes is often fiscally superior to adjusting justification. Why verify the bridge is safe when you can simply insure the car against the plunge?

  **Q: Does my knowledge disappear if I lose my policy?**
  A: Your epistemic status remains contingent on the environment. Without coverage, high-stakes environments revert your status to " Mere Belief," leaving you personally liable for errors.

  **Q: Who determines the stakes threshold?**
  A: Fortify Actuaries calculate the threshold based on market volatility and the Insured's risk profile. Disputes regarding whether a specific situation warranted "Knowledge" or "Guesswork" are settled by binding arbitration.

  ***

  **MARKET CONTEXT: FORTIFY VS. CONTEXT MUTUAL**

  Clients often ask about our competitor, Context Mutual. Context Mutual argues that when stakes rise, the word "know" simply changes meaning. They claim the Insured never truly "knew" the branch was open in the high-stakes scenario, only in the low-stakes one.

  Fortify finds this semantic shifting intellectually lazy. We maintain that Knowledge is a robust commodity. The meaning does not change; the risk does. Context Mutual offers cheap premiums by denying the reality of the epistemic asset. Fortify protects the asset. When Context Mutual tells you that you never knew the bridge was safe, they are dodging liability. When Fortify tells you that you knew, but the stakes were too high to act, we are honoring the truth—and billing for it.

  *Fortify Knowledge Assurance Ltd. © 2024. All epistemic rights reserved.*
