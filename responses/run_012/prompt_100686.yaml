prompt: |-
  Okay so I need help building something and I should explain the fight that got me here. My flatmate and I were up til like 2am because she was watching me play and I killed a whole village of NPCs in a pretty casual way — not even for loot, mostly just to see what the physics would do — and she went "you monster" in a half-joking way, and then we realised neither of us could actually say what the joke was resting on. Like, is she claiming something about the villagers, or about me, or just doing a bit? We tried to sort it out and kept sliding between totally different questions without noticing. So what I want is a decision tree / flowchart I can turn into a little quiz for people: start them from some commitment they'd actually recognise, and have each branch be a question about a concrete case, so they end up at a named position on whether video-game characters matter morally, without ever being asked "do you think fictional characters have moral status?" (that question just makes people pick a team, it doesn't sort anyone). Each leaf should be a position with a name (or "unnamed" if nobody really holds it) plus one sentence on its most awkward commitment.

  The angle I want the whole thing built around — this was my flatmate's idea and I think it's the good one — is that a game character can be three pretty different things at once, and people's answers change depending on which one they're secretly talking about: (a) a represented person inside a fiction, (b) a piece of software / an object sitting in the real world, and (c) a node in a social practice between the players (the thing you can be rude about in chat, the thing two people can have an agreement about). I'd like the branch questions to be cases that pull those three apart — e.g. a procedurally generated villager with a randomly assigned name and no backstory; a companion character you're clearly meant to care about; an NPC you can't interact with at all, pure scenery; the moment you delete a save file or overwrite it, so a whole character that "existed" stops existing; modding a character until it's unrecognisable; abusing a pathing glitch or clipping a character into a wall; an avatar that's controlled by a real person in an MMO; and one of those games that quietly keeps score of what you did and reacts later (Undertale-ish) so the game itself seems to have an opinion about your behaviour. Some of these should land in different leaves, and I want you to flag any pairs of leaves the tree just can't separate from each other, instead of pretending it does.

  Please make the positions that have to show up as leaves include at least: the flat no-status view (characters are representations and representations don't have welfare); the indirect view (it only matters through effects on real people — the player's character, other players, the developers); the disclosure/virtue-ish view (how you treat them reveals or trains something in you, independently of whether they're harmed); a view on which what happens to them matters *inside* the fiction even though there's no real suffering; the artifact view (they're objects, so it's really about how we treat objects and artworks); and some kind of emergent/social view where the moral pull comes from the practice rather than from the character. Also please include one leaf for "if the simulation ever got good enough that it could suffer, then it's just animal-welfare-style ethics with extra steps" and say honestly where that one collides with the others. Aim for maybe eight to ten branch questions and six to eight leaves, and for every combination of answers that nobody occupies, tell me briefly whether that's because the view is incoherent, just unattractive, or simply unexplored. Don't worry about references or who said what, I'll look all that up myself — I just want the instrument and the diagnostic questions to be sharp. Also sorry for the length, I'm bad at being concise about this.
