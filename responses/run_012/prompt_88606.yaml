answer: |-
  You have identified a genuine gap in normative taxonomy. The standard triad of **morals** (universal, categorical), **conventions** (arbitrary, coordinative), and **etiquette** (superficial, hierarchical) fails to capture the specific normative force of the examples you describe.

  There is no single, settled philosophical term for this category. The closest historical ancestor is William Graham Sumner's concept of **"folkways"** (habits of the group) versus **"mores"** (folkways with ethical significance). However, Sumner's distinction is anthropological and descriptive; it does not solve the *normative* problem of the visitor's obligation. Contemporary social ontology (e.g., Cristina Bicchieri) speaks of "social norms," but as you noted, this often collapses into descriptive regularity rather than binding obligation.

  Since the existing vocabulary is insufficient, I will coin a term that captures the tension you described: the norm is experienced as moral by the insider, but its binding force on the outsider is limited by geography and knowledge.

  ### The Coinage: **Parochial Mores**

  I propose calling this class of norms **Parochial Mores**.

  *   **Parochial:** Indicates the scope is local, not universal. The obligation arises from *presence* within a specific jurisdiction or community, not from membership in the human community.
  *   **Mores:** Indicates the *phenomenology* of the norm. To the insider, violating these norms triggers reactive attitudes (resentment, indignation) typically reserved for moral violations, not mere breaches of coordination.

  #### Definition
  **Parochial Mores** are locally constituted behavioral standards that:
  1.  **Lack Universal Grounding:** They cannot be derived from pure reason or universal human rights (e.g., there is no universal law that one must tip 20%).
  2.  **Carry Social Sanction:** Violations provoke resentment or social friction from insiders, distinguishing them from mere mistakes.
  3.  **Are Epistemically Conditional:** The obligation for a non-member (visitor) to comply is contingent upon their ability to reasonably know the norm.
  4.  **Serve a Local Function:** They facilitate specific local economic or social arrangements (e.g., the tipping system subsidizes wages; queueing manages scarcity).

  ---

  ### The Carving: How It Differs

  To sharpen the concept, we must distinguish Parochial Mores from the three categories you rejected.

  | Feature | **Moral Obligation** | **Convention** | **Etiquette** | **Parochial Mores** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Source** | Universal reason / Human welfare | Arbitrary coordination | Hierarchy / Polish | Local social contract |
  | **Scope** | Everywhere (invariant) | Wherever the rule exists | Wherever the class exists | Wherever the *community* exists |
  | **Violation** | Wrong (Guilt/Condemnation) | Mistake (Confusion) | Rude (Judgment of class) | **Rude/Wrong (Resentment)** |
  | **Visitor Duty** | Absolute | Absolute (once known) | Optional | **Conditional (on notice)** |
  | **Example** | Do not murder. | Drive on the left. | Use the outer fork. | **Tip 20%; Queue strictly.** |

  **The Critical Distinction:**
  *   **Vs. Convention:** A convention is arbitrary (driving on the left vs. right). A Parochial Mores has a *point* beyond coordination. Tipping isn't just coordination; it is a distributive mechanism for wages. Queueing isn't just order; it is a local conception of fairness.
  *   **Vs. Etiquette:** Etiquette is about signaling status or refinement. Parochial Mores are about reciprocal expectation. Cutting a queue isn't "unrefined"; it is "unfair" within that local framework.
  *   **Vs. Moral Obligation:** Morals bind you regardless of location. Parochial Mores bind you *because* you are there, but only once you have crossed an epistemic threshold.

  ---

  ### The Boundary: Ignorance, Rudeness, and Wrongdoing

  The crux of your dispute with your friend lies in where we draw the line between a visitor's ignorance, their rudeness, and their actual wrongdoing. For Parochial Mores, this boundary is not static; it is **dynamic based on epistemic access and harm.**

  I propose a three-stage model of visitor liability:

  #### 1. Excusable Ignorance (The "Opaque Norm" Phase)
  *   **Condition:** The norm is not visually obvious, not widely publicized, and does not align with the visitor's home norms.
  *   **Judgment:** The visitor is not blameworthy.
  *   **Example:** A visitor from a non-tipping culture enters a restaurant where tipping is hidden in the fine print or culturally subtle. They leave no tip.
  *   **Status:** *No violation of Parochial Mores.* The obligation has not "attached" because the epistemic condition (reasonable knowledge) was not met.

  #### 2. Culpable Rudeness (The "Constructive Notice" Phase)
  *   **Condition:** The norm is visible to a reasonable observer, or the visitor has been in the location long enough to have a **Duty of Inquiry**. The violation causes social friction but no material harm.
  *   **Judgment:** The visitor is rude, but not morally "wrong." The appropriate sanction is social correction (a look, a comment), not moral condemnation.
  *   **Example:** A visitor cuts a line because they didn't see the implicit queuing formation, but everyone else is clearly standing in a line.
  *   **Status:** *Breach of Parochial Mores.* The visitor failed the Duty of Inquiry. They owe an apology, but they are not "evil."

  #### 3. Moralized Wrongdoing (The "Harm Threshold" Phase)
  *   **Condition:** The visitor *knows* the norm (or has been told) and willfully violates it, **OR** the norm protects a vital interest (livelihood, safety) such that ignorance is no longer a valid excuse.
  *   **Judgment:** The violation transitions from a breach of local custom to a universal moral failing (exploitation or disrespect).
  *   **Example:** A visitor is told, "Servers rely on tips for their income," and still refuses to tip. Or, a visitor jaywalks in a way that forces a driver to brake dangerously.
  *   **Status:** *Moral Wrongdoing.* At this point, the Parochial Mores **moralizes**. The local norm recruits universal moral principles (do not exploit, do not endanger) to enforce itself.

  ### Application to Your Dispute

  This framework suggests that **you and your friend are both partially right**, but you are arguing about different stages of the norm's enforcement.

  *   **On Tipping:** Your friend is right that the server is *wronged* if the visitor *knows* the norm. Tipping is a Parochial Mores that sits very close to the Moral Threshold because it involves livelihood (harm). If your friend knew tipping was expected and refused, she committed a moral wrong (exploitation of labor), not just a faux pas. If she genuinely didn't know, she was merely ignorant.
  *   **On Queueing:** You are right that this is often just *rudeness*. Unless the queueing system is critical (e.g., emergency triage), cutting in line is a breach of Parochial Mores (unfairness) but rarely rises to universal moral wrongdoing unless done persistently or aggressively.
  *   **On Jaywalking:** This is a hybrid. It is a legal convention, but when a visitor does it, it is often excused as Ignorance (Stage 1). However, if the visitor does it repeatedly after seeing locals wait, it becomes Rudeness (Stage 2). If they step out in front of a car, it becomes Wrongdoing (Stage 3).

  ### Summary
  The class of norms you are describing is **Parochial Mores**. They are local rules that feel like morals to insiders but function like contracts for visitors. The visitor's obligation is not immediate; it is triggered by **Constructive Notice**.

  *   **Ignorance** is the state before notice.
  *   **Rudeness** is the breach after notice, where harm is low.
  *   **Wrongdoing** is the breach after notice, where harm is high (or the refusal to learn is willful).

  Your friend treats the norm as a **Moral Obligation** (binding immediately). You treat it as **Etiquette** (binding loosely). The truth is **Parochial Mores**: binding conditionally, based on your presence and your willingness to learn the local "language" of social interaction.
