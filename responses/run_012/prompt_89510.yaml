answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Chair, Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposed Futarchy Pilot for Grant Round 2024

  **Recommendation**

  I recommend that the Board **adopt the pilot proposal with named amendments**. Specifically, we must remove the provision for automatic execution of funding, require vetted rather than anonymous traders, and establish an independent committee for metric selection.

  This approach allows us to test the information-aggregating potential of decision markets without abdicating our fiduciary duty or exposing the foundation to unacceptable process risk. The proposal as written conflates the measurement of belief with the exercise of values in a way that threatens our accountability to donors and beneficiaries. The amendments below correct these mechanistic flaws while preserving the innovation the proponent faction seeks.

  **Context and Mechanism**

  The proposal asks us to test "futarchy," a governance system where values are voted on and beliefs are bet on. In this design, the Board sets a success metric (e.g., "number of beneficiaries employed after 24 months"). Traders buy contracts tied to grant proposals; a contract pays out if the proposal is funded and the metric is met. The proposals with the highest contract prices are funded automatically.

  Two amendments are currently on the table: a "guardrail" (a secondary metric floor) and a "lock-in" (setting the metric before the shortlist is revealed). While these improve the design, they do not resolve the fundamental governance risks.

  **Analysis of Mechanism**

  **1. The Illusion of Separating Values from Beliefs**
  Proponents argue this system separates what we want (values) from what we think will work (beliefs). The strongest version of this argument holds that human bias corrupts belief assessment, whereas markets aggregate dispersed information objectively.

  However, this separation is illusory in practice. The choice of the outcome metric *is* the funding decision. If we choose "jobs created" over "policy influence," we have effectively selected the winners before the market opens. Different metrics favor different types of organizations. Because the Board must choose the metric by majority vote, the political dynamics we hope to bypass simply migrate upstream to the metric selection phase. The lock-in amendment helps prevent tailoring the metric to the shortlist, but it does not prevent the majority from selecting a metric that privileges their preferred ideology. We must acknowledge that choosing the yardstick is an exercise of power, not a neutral setup.

  **2. Manipulation and the Stakes Ratio**
  A standard defense of prediction markets is that manipulation is self-correcting: if a trader pushes a price away from the true probability, rational arbitrageurs will bet against them to capture the profit, restoring accuracy.

  This defense fails when a participant's stake in the real-world outcome exceeds their stake in the market profit. In our context, an advocate for a specific grantee may value the grant award at millions of dollars in social impact (or reputational capital), while the cost to manipulate the market is limited to the liquidity subsidy and trading losses. If the grant decision matters more to the trader than the trading P&L, they will trade irrationally to influence the outcome.

  For the arbitrage defense to hold, the capital available to arbitrageurs must exceed the capital stakes of the manipulators. In a public stock market, this is true. In a pilot with a small liquidity subsidy and twenty assets, it is not. A single motivated actor with moderate capital can distort prices enough to sway the ranking of marginal proposals. Anonymity exacerbates this by removing reputational costs for bad-faith trading.

  **3. Thin Markets and Price Informativeness**
  We are proposing a market with approximately twenty assets (the shortlist) and a limited window for trading. In market design terms, this is an exceptionally "thin" market. Thin markets suffer from high volatility and low liquidity, meaning prices reflect noise as much as information.

  Anonymity, often touted as a protection for traders, reduces informativeness here. In small expert communities, reputation signals credibility. If I know a trade comes from a recognized expert in the field, I weigh it heavily. If the trade is anonymous, I cannot distinguish between insider knowledge and random noise. Automatic execution makes this worse, not better. It removes the human layer that might recognize a price anomaly as a glitch or manipulation rather than a signal. It locks us into decisions based on potentially noisy data.

  **4. The Guardrail and Lock-in Amendments**
  The guardrail amendment (a floor on a second metric) does not remove discretion; it relocates it. We must still choose the second metric and set the floor threshold. A low floor renders the guardrail useless; a high floor renders the market irrelevant. It creates a veto point without clarifying the positive criteria for selection.

  The lock-in amendment (metric set before shortlist) is coherent and should be retained. It prevents staff or the Board from reverse-engineering a metric to ensure a specific proposal wins. However, it does not solve the problem that the shortlist itself is pre-selected by staff. If the pool of twenty is already biased, the market can only choose the "best" of a biased set.

  **5. Accountability and Explainability**
  A charitable foundation owes its donors and beneficiaries a decision procedure that can be explained after the fact. If a grant fails, we must be able to say why we made it. "The market price was highest" is not a sufficient fiduciary explanation. It suggests we outsourced our judgment to a mechanism we do not fully control.

  Furthermore, the metric does not exist at the time of betting; it is measured ex-post. This creates "basis risk." Traders are not betting on the true success of the project, but on the *measurement* of the metric. If the metric is difficult to measure or subject to interpretation, traders will bet on how staff will measure the data, not on the actual social impact. This incentivizes grantees to optimize for measurement rather than impact.

  **Recommendation and Amendments**

  To capture the benefit of market aggregation without the governance risks, I propose we adopt the pilot subject to the following three amendments:

  **1. Advisory Pricing, Not Automatic Execution**
  Market prices shall serve as a recommendation to the Board, not a binding command. The Board retains the final vote on funding.
  *   *Reasoning:* This preserves fiduciary duty. If the market prices are clearly manipulated or anomalous, the Board can override them. It transforms the mechanism from a "decision market" to a "decision support system." This addresses the "Capital Laundering" faction's concern: the Board remains accountable for the capital. It addresses my concern regarding Shadow Markets: the prices will be used, not ignored, ensuring the cost of the apparatus yields benefit.

  **2. Vetted Traders, Not Anonymous**
  Trading access shall be restricted to a vetted list of participants (e.g., subject matter experts, staff, trustees) who are identified to the Governance Committee, though trades may be blinded during the window to prevent herd behavior.
  *   *Reasoning:* This increases the cost of manipulation. If a trader knows they can be barred from future participation or held accountable for bad-faith trading, they are less likely to distort prices. It allows us to assess the "stakes ratio" of participants.

  **3. Independent Metric Committee**
  The outcome metric and threshold shall be selected by a committee comprising one trustee, one staff member, and two external experts, requiring unanimous or supermajority agreement.
  *   *Reasoning:* This dilutes the Board's ability to use the metric to pre-determine winners. It forces a negotiation on values before the beliefs are aggregated.

  **Timeline**

  *   **November 15:** Board vote on pilot with amendments.
  *   **December 1:** Metric Committee convened; metric locked by January 15.
  *   **February 1:** Shortlist published; Trading window opens.
  *   **March 1:** Trading closes; Board votes on funding allocation.
  *   **December (Year End):** Review of pilot efficacy against traditional rounds.

  **Conclusion**

  The proposal as written asks us to trust a mechanism that is theoretically elegant but practically fragile in a low-liquidity, high-stakes environment. It risks laundering capital influence under the guise of algorithmic neutrality. However, the intuition behind it—that we can better aggregate information about grant efficacy—is sound.

  By making the market advisory rather than binding, and vetting the participants, we test the signal without surrendering the steering wheel. This satisfies the risk-tolerant faction's desire for innovation, the risk-averse faction's demand for oversight, and the governance committee's duty to ensure process integrity.

  I move we adopt the pilot subject to these amendments.
