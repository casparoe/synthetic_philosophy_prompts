answer: |-
  You have essentially rediscovered one of the most important distinctions in moral philosophy, entirely on your own. You haven't been inconsistent; you've been acting like a human lie detector for **hidden premises.**

  Your gut is following a single, coherent principle. You do not need to give up any of your verdicts.

  ### The Principle: The Normative Bridge

  Your hypothesis was: *"Neutral facts can't give you a should, but facts that are already half-evaluative can, because the should was in there all along."*

  You are exactly right. In philosophy, this is the standard solution to Hume's Is-Ought problem. An argument only works if there is a **Normative Bridge** connecting the fact (Is) to the obligation (Ought).

  *   **Valid Arguments:** The "Is" is actually an "Is + Hidden Ought." The fact invokes a rule, a role, or a value you already accept.
  *   **Cheat Arguments:** The "Is" is a bare fact. There is no bridge to the value.

  Here is how your eight examples map onto this principle.

  #### 1. The Institutional "Shoulds" (Rules & Roles)
  *   *"You promised..."*
  *   *"The sign says..."*
  *   *"He caused the crash..."*

  **Why they work:** These aren't just physical facts; they are **institutional facts**. A promise isn't just sound waves; it is an act that creates an obligation by definition. A sign isn't just metal; it is an authority marker. Causing a crash isn't just physics; it is a violation of liability rules.
  **The Hidden Premise:** "You ought to keep commitments," "You ought to obey posted rules," "You ought to repair harm you cause."
  **Verdict:** Not a cheat. The "should" is baked into the definition of the fact.

  #### 2. The Moral "Shoulds" (Shared Values)
  *   *"That's your mother..."*
  *   *"She's in pain..."*

  **Why they work:** These rely on substantive moral values that are so deeply shared they *feel* like facts. "She is in pain" is the fact. The hidden premise is "Pain is bad and ought to be alleviated." Because almost everyone accepts that premise, the argument feels airtight.
  **The Hidden Premise:** "You ought to care for family," "Suffering is bad."
  **Verdict:** Not a cheat, but notice that if someone *didn't* care about family or suffering, the argument would fail. That proves the "should" was in the premise, not the fact.

  #### 3. The Instrumental "Should" (The Knife)
  *   *"The knife's dull, grab the other one."*

  **Why it feels different:** You spotted this correctly. This is a **Hypothetical Imperative**. It is not a moral command; it is a command of efficiency.
  **The Hidden Premise:** "You want to cut this thing effectively."
  **Verdict:** This saves your pattern. It is valid logic, but it's a different *category* of should. If you say, "I don't care about cutting," the "should" vanishes. In the other valid cases (promises, pain), the "should" applies even if you don't want it to.

  #### 4. The Cheats (The Fallacies)
  *   *"Everyone drives..."*
  *   *"It's natural..."*

  **Why they fail:** These are bare facts with no normative bridge.
  *   **Popularity:** "Everyone does X" does not connect to "X is right" unless you add the premise "Whatever is popular is good." (Which is false).
  *   **Nature:** "It is natural" does not connect to "It is good" unless you add the premise "Nature is moral." (Which is false; cancer and earthquakes are also natural).
  **Verdict:** Cheats. They try to smuggle a value in without declaring it.

  ---

  ### Applying the Principle to Your Unsettled Cases

  Now we can run your two new examples through the machine.

  #### Case 9: "He earns more than me, so he should pay more tax."
  **Verdict:** **Contestable (Depends on the Hidden Premise)**
  This argument feels shaky to some and obvious to others because the Hidden Premise is political, not universal.
  *   **The Fact:** He has more money.
  *   **The Hidden Premise Required:** "Tax obligations should be based on ability to pay (progressive)," OR "Benefits received should dictate cost (flat)."
  *   **Analysis:** Unlike "pain is bad," there is no universal agreement on how tax fairness works. Your brother-in-law might accept the premise; a libertarian might reject it. The logic is valid *if* you accept the premise, but the premise is not baked into the fact of earning money itself.
  *   **Gut Check:** If you feel this is true, it's because you accept the "ability to pay" premise. If you feel it's a cheat, it's because you think tax should be a flat fee for services.

  #### Case 10: "My dog is suffering and won't get better, so I should end it."
  **Verdict:** **Valid (Strong Moral "Should")**
  This is structurally identical to your "She's in pain" example, which you called the strongest one.
  *   **The Fact:** The dog is suffering + no recovery.
  *   **The Hidden Premise:** "Unnecessary suffering is worse than death," or "Mercy is a higher value than biological life."
  *   **Analysis:** In modern ethics, this bridge is very strong. It is not a "natural" fallacy (it doesn't say "it's natural to die"); it is a mercy argument.
  *   **Gut Check:** If you feel hesitation here, it's because there is a *competing* hidden premise: "Killing is wrong." Your gut is weighing two hidden premises against each other (Relief of Suffering vs. Sanctity of Life). But logically, it is not a cheat like the "natural" argument. It acknowledges a value (suffering is bad) and acts on it.

  ### Summary for Your Argument

  You can tell your brother-in-law this:

  > "I've figured out why I agree with some and not others. I'm not deriving an 'ought' from an 'is.' I'm spotting when you've hidden the 'ought' inside the definition of the fact.
  >
  > When I say 'You promised,' the word 'promise' already contains an obligation. When you say 'It's natural,' the word 'natural' contains no obligation. I accept the arguments where the obligation is built-in (promises, pain, rules). I reject the arguments where you try to jump from a neutral fact to a value without a bridge (nature, popularity)."

  You haven't been inconsistent. You've been consistently demanding that people declare their moral premises instead of hiding them inside facts. That is good philosophy.
