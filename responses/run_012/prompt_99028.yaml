      *   *Objection 4: Second-Order Logic.* SOL categorically characterizes $\mathbb{N}$ and $\mathbb{R}$. Does moving to SOL solve it? (Cost: loss of completeness/compactness).
      *   *Objection 5: Quietism/Unfalsifiability.* If every objection is met with "that's just relative to *your* model," does the view say anything substantive?
