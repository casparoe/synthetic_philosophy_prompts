  The program rests on a potential mistake: assuming that "being simulated" entails "causal isolation from high-value outcomes." This is not logically necessary. Simulated agents might influence base reality (e.g., via simulator engagement), or simulated value might be intrinsically equal to base value. If the program assumes dampening rather than testing the mechanisms of leverage, it will produce biased results. The agenda must treat causal reach and axiological status as independent variables, not correlated consequences of simulation status.

  Below are the four conceptual questions ranked by upstreamness and importance. Proposal (a) contains the most critical component but must be split. Proposal (c) is essential for probability weighting. Proposal (b) is downstream and too specific for the central question.

  ### 1. The Axiology of Simulated Existence (Derived from Proposal (a))
  **Question:** Is the moral value of an outcome invariant between simulation and base reality given subjective identity?
  **Why Upstream:** This is the absolute priority. If simulated experiences have zero or negligible value compared to base reality, the simulation argument dampens fanaticism immediately, regardless of anthropic probabilities or causal reach. If value is substrate-neutral, the dampening effect vanishes unless paired with causal isolation. All other questions regarding leverage or probability are moot if the stakes are axiologically null.
  **Tractability:** High for philosophers. This relies on thought experiments (e.g., substrate independence, philosophical zombies) and meta-ethical analysis rather than empirical data.
  **Neglect vs. Importance:** Highly important but moderately neglected. Digital ethics discusses this, but rarely in the specific context of dampening far-future fanaticism via the simulation argument.
  **Movement in 2-3 Years:** If the team produces a robust defense of substrate neutrality, this question moves down the list, shifting focus to causal reach. If substrate dependence is defended, the program's goal shifts to quantifying the discount rate.
  **Proposal Verdict:** Proposal (a) deserves to be the central question, but only its axiological clause. The causal clause is a separate downstream issue.

  ### 2. The Anthropics of Simulation Probability (Derived from Proposal (c))
  **Question:** Does the Self-Indication Assumption (SIA) defeat the Self-Sampling Assumption (SSA) in the context of the simulation argument?
  **Why Upstream:** This determines the probability weight assigned to the "we are simulated" hypothesis. If SIA is correct and implies we are likely in base reality, the dampening effect dissolves because the premise fails. However, it is downstream of Axiology because even if we are likely simulated, the value of that state (Question 1) determines the impact.
  **Tractability:** High for formal epistemologists. This is a technical debate within decision theory and anthropic reasoning.
  **Neglect vs. Importance:** High importance, low neglect. This is the most contested part of the standard simulation argument literature.
  **Movement in 2-3 Years:** If a consensus emerges on anthropic frameworks (unlikely), this question resolves. If the team demonstrates that dampening persists under both SIA and SSA (e.g., via resource constraints), this question moves down.
  **Proposal Verdict:** Proposal (c) deserves to be a core pillar, but not the central question. It addresses the likelihood of the scenario, not the value within it.

  ### 3. The Causal Closure of Simulations (Derived from Proposal (a))
  **Question:** Can simulated agents exert causal influence on base reality or higher-level simulations?
  **Why Upstream:** Assuming substrate-neutral value (Question 1), dampening only occurs if simulated futures are smaller than base futures *and* we cannot affect the base. If causal escape or influence is possible, fanaticism is restored because the accessible value pool includes base reality. This is downstream of Axiology (must value sims first) but upstream of specific mechanisms like simulator engagement.
  **Tractability:** Low. This borders on speculative metaphysics and physics. Philosophers can analyze logical possibility, but plausibility is hard to assess without empirical constraints on computation.
  **Neglect vs. Importance:** High importance, high neglect. Most discussions assume causal closure without argument.
  **Movement in 2-3 Years:** If the team identifies plausible channels of influence (e.g., computational side-channels, simulator incentives), this question becomes the new bottleneck, moving up in priority.
  **Proposal Verdict:** This is the second half of Proposal (a). It must be treated separately from the axiological claim.

  ### 4. Simulator Moral Patienthood and Incentives (Derived from Proposal (b))
  **Question:** Do simulators act as moral patients or value amplifiers for simulated outcomes?
  **Why Upstream:** This is a specific mechanism for restoring value/leverage. It depends on Question 1 (simulators must value something) and Question 3 (simulators must be reachable/influencable). It is the least upstream because it is a specific hope-spot rather than a structural precondition.
  **Tractability:** Low. This requires speculating on the psychology and ethics of post-human superintelligences.
  **Neglect vs. Importance:** Moderate importance, very high neglect. It is often dismissed as science fiction, but if true, it significantly restores expected value.
  **Movement in 2-3 Years:** If the team develops a robust model of simulator incentives, this moves up. If it remains speculative, it stays downstream.
