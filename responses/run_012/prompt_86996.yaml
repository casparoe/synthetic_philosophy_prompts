answer: |-
  This is an enviable position to be in. A year-long fellowship with no teaching is effectively a junior sabbatical; you have the time to write a monograph-length article or a dissertation-lite. Your instinct that the "standard" Leveling-Down Objection (LDO) is dead is correct. Parfit and others have largely settled that telic prioritarianism (ranking states of affairs) does not recommend leveling down, because it values the gain to the worse-off, not the equality itself. The debate has moved on, but as you've noticed, the debris field is confusing.

  Here is the strategic ranking of your open questions, ordered by **upstream conceptual priority** and **tractability for a single-author project**.

  ### 1. The "Inverse Objection" (Gains vs. Levels)
  **Rank:** #1 (The Core)
  **Status:** Upstream of everything else.
  **Tractability:** High.
  **Neglect:** Under-explored compared to standard LDO.

  **The Reasoning:**
  Your supervisor has identified the structural heart of the view. Standard prioritarianism is usually defined over *final welfare levels* (Telic). If you define it over *changes in welfare* (Dynamic/Deontic), you change the view's vulnerability profile.
  *   **Why it's #1:** This determines what the theory *is*. If prioritarianism is about levels, the LDO is a non-starter (as you noted). If it is about gains, the LDO vanishes, but you inherit the "Bottomless Pit" or "Leveling Up" problem (a tiny gain to the worst-off justifies massive losses to the better-off). You cannot resolve the Ex Ante/Ex Post debate or the Population question until you know if the currency of priority is *states* or *transitions*.
  *   **The Trap:** Do not let this become merely verbal. "Levels" vs. "Gains" often maps onto "Status-Quo Dependence." A view sensitive to gains is sensitive to the baseline; a view sensitive to levels is not. You need to argue whether prioritarianism *should* be status-quo dependent.
  *   **What Moves It:** A formal or rigorous thought-experiment demonstrating a **dilemma**. Show that if you anchor prioritarianism in *levels* to avoid the Inverse Objection, you re-invite a version of LDO (or indifference to suffering). If you anchor it in *gains* to solve LDO, you violate aggregation constraints (the "Leveling Up" problem). If you can prove that Prioritarianism cannot simultaneously escape LDO and the Inverse Objection without ad-hoc patching, you have a major result.
  *   **Verdict:** This is your fellowship paper. It is narrow enough for one year, deep enough for a top journal, and directly addresses your obsession.

  ### 2. Ex Ante vs. Ex Post Prioritarianism
  **Rank:** #2 (The Stress Test)
  **Status:** Downstream of #1.
  **Tractability:** Medium (Technical).
  **Neglect:** Heavily hashed in the last 15 years (Voorhoeve, Otsuka, Adler).

  **The Reasoning:**
  This question asks how prioritarianism handles risk.
  *   **Ex Post:** Apply the priority weight to expected outcomes. (Risk of violating Ex Ante Pareto).
  *   **Ex Ante:** Apply the priority weight to expected utilities. (Collapses toward utilitarianism).
  *   **Why it's #2:** This is the most robust way to test the coherence of the view *after* you've settled the Gains/Levels question. However, the literature here is dense and technical. It is easy to get bogged down in math and lose the normative thread.
  *   **Strategic Use:** Do not make this the *subject* of the paper. Make it the **reductio**. Use the Ex Ante/Ex Post dilemma to show why the Gains/Levels distinction (Rank #1) matters. For example: "If we define priority over gains (Rank #1), how does that function under risk? It exacerbates the Ex Ante collapse."
  *   **What Moves It:** Showing that the solution to the Rank #1 problem (Gains vs. Levels) dictates the solution to the Risk problem. If you can link the metaphysical structure of the view to its decision-theoretic behavior, you unify two separate literatures.

  ### 3. Population Ethics and the Person-Affecting Restriction
  **Rank:** #3 (The Boundary Condition)
  **Status:** Parallel/Orthogonal.
  **Tractability:** Low (for this project).
  **Neglect:** Saturated.

  **The Reasoning:**
  Your friend is technically right that LDO has teeth primarily in "Same Number" cases, and population ethics complicates this. However, population ethics is a black hole.
  *   **Why it's #3:** If you try to solve the LDO by solving the Non-Identity Problem or the Repugnant Conclusion, you will not finish your fellowship.
  *   **Strategic Use:** **Bracket it.** Explicitly state in your introduction: "I assume a Fixed Population, Same People constraint." This is standard practice. The LDO is powerful *even if* you grant the friend's premise. Acknowledge the friend's point in a footnote or a "Limitations" section, arguing that even within fixed-population cases, the Inverse Objection (Rank #1) remains fatal.
  *   **What Moves It:** Nothing. Do not try to move this. Use it as a fixed parameter to isolate your main variable.

  ### 4. Parameters, Currency, and Inequality Among the Better-Off
  **Rank:** #4 (Implementation Details)
  **Status:** Downstream of #1 and #2.
  **Tractability:** High (but low payoff).
  **Neglect:** The "Currency" question (Responsibility/Desert) is live, but distinct from LDO.

  **The Reasoning:**
  *   **Weight Parameter:** Debating the shape of the priority function (concave vs. lexical) is important, but it's calibration, not foundation.
  *   **Currency:** Switching from welfare to "claims" or "desert" (Responsibility-Catering Prioritarianism) is a different view entirely. It changes the subject from Prioritarianism to Desert-Catering Egalitarianism.
  *   **Why it's #4:** These are knobs you turn *after* you've built the engine. Worrying about the weight parameter before settling Gains vs. Levels is like tuning the carburetor before deciding if the car runs on gas or electricity.
  *   **What Moves It:** Only discuss this if your Rank #1 argument requires a specific weight to function (e.g., "The Inverse Objection only holds if the priority weight is lexical").

  ---

  ### The "Verbal" Worry
  You asked if some of this is just wording.
  *   **Gains vs. Levels:** This is **not** merely verbal. It is the difference between a view that is *history-dependent* (Gains) and one that is *ahistorical* (Levels). If you care about gains, you care about how we got here. If you care about levels, you don't. This has massive deontic implications.
  *   **Ex Ante vs. Ex Post:** Not verbal. It determines whether you satisfy the Ex Ante Pareto principle.
  *   **Population:** Not verbal, but scope-limiting.

  ### The One-Year Agenda

  **Months 1-3: The Architecture.**
  Focus exclusively on Rank #1. Map the logical space.
  *   Define "Standard Prioritarianism" (Levels).
  *   Define "Dynamic Prioritarianism" (Gains).
  *   Formalize the "Inverse Objection" (Leveling Up).
  *   *Goal:* A clean taxonomy showing that escaping LDO necessitates vulnerability to the Inverse Objection.

  **Months 4-6: The Argument.**
  Draft the core proof.
  *   Construct the dilemma: To avoid LDO, you must value levels. To avoid the Inverse Objection, you must value gains (or limit priority). You can't do both without arbitrariness.
  *   *Goal:* A draft that stands on its own without the Risk or Population complications.

  **Months 7-9: The Stress Test.**
  Bring in Rank #2 (Risk).
  *   Does your solution to Rank #1 hold under uncertainty?
  *   If you argue for "Levels," does Ex Post Prioritarianism save you? (Likely no, due to Pareto violations).
  *   If you argue for "Gains," does Ex Ante Prioritarianism save you? (Likely no, due to collapse).
  *   *Goal:* Strengthen the main argument by showing it survives the introduction of risk.

  **Months 10-12: Polish and Bracket.**
  Address Rank #3 and #4.
  *   Add the "Fixed Population" assumption explicitly to silence the Friend.
  *   Add a section on "Calibration" (Rank #4) to show you know the parameters, but argue they don't solve the structural dilemma.
  *   *Goal:* Final paper submission.

  ### The "Killer Move"
  What would make you say, "*That* was the important one"?
  If you can demonstrate that the **Leveling-Down Objection is actually a feature, not a bug, of the only coherent version of the view.**
  *   *Hypothesis:* Perhaps the only version of Prioritarianism that avoids the "Leveling Up" (Inverse) Objection *is* the one that is vulnerable to LDO, and we should accept that cost.
  *   *Or:* Perhaps the "Inverse Objection" is the real dealbreaker, and Prioritarianism must be abandoned for a Sufficiency View.
  *   *Success Condition:* You don't need to solve Prioritarianism. You need to show that the *debate* has been looking at the wrong objection. If you convince the field that the "Leveling Up" objection is more damaging than the "Leveling Down" objection, you have successfully redirected the research program.

  **Summary:** Ignore the population ethics rabbit hole. Treat Risk as a testing ground, not the main event. Focus your year on the **Gains vs. Levels** distinction and the **Inverse Objection**. That is the upstream conceptual bottleneck. Everything else flows from that.
