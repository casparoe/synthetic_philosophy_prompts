answer: |-
  This is a sophisticated position. You are advocating for a **Structured Imprecise Probability (IP)** view, specifically a *parametric representor* account, coupled with a **hybrid epistemology** (Sharp Bayesianism where evidence dictates, IP where it underdetermines).

  Here is the honest map of exposure you requested, ranked from fatal structural threats to merely pragmatic costs.

  ### 1. The Ranking of Defeaters

  **1. Fatal: The Seepage Problem (Logical Contamination)**
  This is the greatest threat to your "Local/Generated" restriction. You claim to be sharp where symmetry/frequency settles matters and vague elsewhere. However, logic does not respect your boundary between "settled" and "unsettled."
  *   **The Case:** You are sharp (0.5) on $H_A$ (known fair coin). You are imprecise ([0.4, 0.6]) on $H_B$ (unknown bias coin). You learn a reliable report that $H_A \leftrightarrow H_B$ (they land the same).
  *   **The Result:** Your credence in $H_A$ must now become imprecise to match $H_B$.
  *   **Why it hurts:** Your "local" sharpness is not an intrinsic property of the proposition or the evidence regarding *that* proposition alone; it is fragile under conditionalization involving vague propositions. If your parametric family allows dependence between "sharp" and "vague" parameters, the imprecision leaks. To maintain your view, you must either deny the logical update (irrational) or concede that "local sharpness" is transient and context-dependent, undermining the stability of your "settled" zones.

  **2. Severe: The Symmetry Boundary Problem**
  You state: *"I am sharp wherever symmetry... settles the matter."*
  *   **The Conflict:** This puts you at war with the primary motivation for IP. Levi and Walley argue that symmetry (e.g., the unknown coin) *does not* settle the matter; it merely rules out nothing. Jaynes (MaxEnt) argues it forces a sharp prior.
  *   **The Exposure:** You need a meta-principle to decide when symmetry "settles" a matter. If you use Jaynes' MaxEnt for the "sharp" cases and Levi's Permissivism for the "vague" cases, you have a disjointed epistemology. Why does symmetry settle the fair coin (sharp 0.5) but not the unknown bias (vague [0,1])? Usually, the distinction is drawn between *known physical chance* vs. *unknown physical chance*. If your view relies on that distinction, it collapses into a Sharp Bayesian view with a hyper-prior on chances, unless you insist the evidence *itself* is the set. But if the evidence is the set, why does symmetry collapse it in one case and not the other? This looks like an ad hoc boundary to save sharpness where it feels comfortable.

  **3. Serious: Rival Explanatory Power (Smooth Ambiguity)**
  *   **The Rival:** A Sharp Bayesian with a second-order utility function (Klibanoff, Marinacci, Mukerji) or a Choquet Expected Utility agent.
  *   **The Exposure:** These models replicate Ellsberg preferences and caution under uncertainty without positing a set of priors as the *credal state*. They treat the "imprecision" as an attitude toward risk/ambiguity, not a representation of evidence.
  *   **Why it hurts:** It invokes Occam's Razor. If a sharp prior + ambiguity aversion explains the same behavioral data (betting quotients, choices) as your set of priors, your claim that the *credence itself* is indeterminate becomes metaphysically idle. You must argue that your view captures the *epistemic* normativity (what evidence supports) better than the *decision-theoretic* normativity of the rival. But if the decision rules diverge, the rival often looks more action-guiding.

  **4. Awkward: The Decision Rule Zoo**
  *   **The Issue:** As you noted, a set of probabilities does not order acts. You need Maximality, E-admissibility, etc.
  *   **The Exposure:** Each rule has pathologies. Maximality leads to paralysis (incompleteness). E-admissibility is computationally intractable and violates dynamic consistency. $\Gamma$-maximin (lower expectation) is overly pessimistic.
  *   **Verdict:** This is not fatal but is a high tax. A Sharp Bayesian has one rule (Maximize Expected Utility). You have a menu of rules, none of which are universally accepted. This makes your view less "action-guiding," which is a normative cost.

  **5. Mitigated: Dilation**
  *   **The Issue:** Learning $E$ makes the posterior set for $A$ wider than the prior.
  *   **Your Defense:** Your "Generated" constraint (parametric family) actually protects you here compared to vacuous IP. If your family is well-behaved (e.g., conjugate priors), dilation is less likely to be pathological.
  *   **Verdict:** You should concede dilation happens but argue it is a feature, not a bug, of representing ignorance. However, combined with the **Seepage Problem** (#1), dilation becomes dangerous because it can dilate your "sharp" propositions via correlation.

  **6. Mitigated: Washout (Inertia)**
  *   **The Issue:** Wide sets aren't moved by data.
  *   **Your Defense:** You explicitly reject the vacuous set. By restricting to a parametric family (e.g., $\theta \in [0.4, 0.6]$), standard Bayesian convergence theorems often apply *within* the family. The data will shrink the set or shift it.
  *   **Verdict:** Your specific restriction insulates you from the standard "IP leads to skepticism" objection. This is a strength of your specific formulation.

  ---

  ### 2. Concession vs. Dismissal Map

  | Objection | Defender's Stance | Reasoning |
  | :--- | :--- | :--- |
  | **Seepage/Contamination** | **Concede (with patch)** | You must admit "local sharpness" is not stable under all conditioning. You must restrict the *allowable* learning events or accept that sharpness is provisional. |
  | **Symmetry Boundary** | **Dismiss as Misdescription** | You will argue this isn't a boundary problem but a factual claim about evidence. Some evidence *is* precise (frequencies); some *isn't* (unique events). The rival misdescribes the evidence as always sharp. |
  | **Decision Rules** | **Concede as Cost** | Acknowledge the "zoo" is a burden. Frame it as the price of honesty: better to have complex rules than false precision. |
  | **Rival (Ambiguity Aversion)** | **Dismiss as Category Error** | The rival explains *choice*, not *belief*. You are modeling the support relation between evidence and hypothesis, not the utility of gambling. |
  | **Dilation** | **Dismiss as Feature** | Information *should* sometimes reveal that you know less than you thought (e.g., learning a source is biased). |
  | **Washout** | **Dismiss (Insulated)** | Your parametric constraint specifically solves this. |

  ---

  ### 3. Predictive Differences: You vs. The Sharp Bayesian

  If your view is to be empirically or normatively distinct, it must diverge from Sharp Bayesianism in specific predictions.

  1.  **Suspension of Judgment:**
      *   **Sharp Bayesian:** Must assign a precise number (e.g., 0.5001) to the bias of a coin they have never seen, based on a MaxEnt prior. They are forced to bet at specific odds.
      *   **You:** Predicts a *range* of acceptable betting odds (e.g., any price between 0.4 and 0.6). You predict the agent will refuse bets that fall inside the Sharp Bayesian's "acceptable" zone but outside your interval.
      *   **Test:** In elicitation experiments, your view predicts *intervals* of indifference, not points.

  2.  **Dilation as a Prediction:**
      *   **Sharp Bayesian:** Predicts that conditionalizing on a partition should never increase variance/uncertainty about a marginal (in expectation).
      *   **You:** Predicts cases where learning *which* cell of a partition obtained makes you *less* precise about the marginal than you were before. If this is observed in rational agents, you win.

  3.  **Model Uncertainty:**
      *   **Sharp Bayesian:** Must average over models (Bayesian Model Averaging) to get a single posterior.
      *   **You:** Predicts the rational state is the *set* of posteriors from the candidate models.
      *   **Difference:** In high-stakes decisions where models disagree sharply, the Sharp Bayesian takes a weighted average (smoothing the risk). You predict the agent should treat the *disagreement itself* as a risk factor, leading to more conservative choices (maximin-like) than the average would suggest.

  ---

  ### 4. Insulation and Defect Analysis

  **Where are you insulated?**
  You are insulated by the **freedom to choose the parametric family.**
  *   **The Worry:** What constrains the family? If I can choose *any* family that fits my intuition, I can fit any behavior. I can choose a family that is sharp on $A$ and vague on $B$ simply because I want to be.
  *   **Is it a defect?** Yes, unless you provide a **principle of family selection.** If the choice of the family is itself underdetermined by evidence, you have pushed the imprecision back one step (from "What is the probability?" to "What is the set of models?").
  *   **Your Defense:** You likely claim the family is determined by "models I could write down and defend." This is pragmatic. It insulates you from the charge of arbitrariness, but it makes your view **agent-relative.** Rationality becomes relative to the agent's modeling capacity. A smarter agent (who can defend more models) might have a wider set than a duller one. This is counter-intuitive for a normative theory.

  **Is the claim "evidence underdetermines" refutable?**
  *   **Hardly.** It is a modal claim about the support relation. It is insulated from direct empirical refutation.
  *   **Indirect Refutation:** It is refuted if it leads to **Dutch Books** or **Money Pumps.** If your decision rule + credal set allows a sequence of bets that guarantees a loss, the view is pragmatically refuted.
  *   **Status:** Most IP decision rules avoid sure-loss Dutch Books *if* the set is closed. However, they often succumb to *dynamic* inconsistency (changing plans mid-stream). If your view cannot solve dynamic consistency without collapsing into Sharp Bayesianism, the insulation becomes a cage.

  ---

  ### 5. The Verdict on "Local/Generated"

  You asked to be most moved by a demonstration that this restriction cannot be held.

  **The Demonstration:**
  The restriction fails under **Jeffrey Conditionalization** or **uncertain evidence.**
  *   Suppose you are sharp on $P(A)$ (symmetry) and vague on $P(B)$ (no info).
  *   You receive evidence that is not certain, but shifts your credence in $B$. (e.g., a noisy signal).
  *   To update a set of probabilities on uncertain evidence, you typically need to update each member of the set.
  *   If the "sharp" $P(A)$ is logically independent of $B$ *ex ante*, it may not be independent *ex post* given the structure of the uncertainty.
  *   **Crucially:** If your "sharp" probabilities are derived from a symmetry argument (e.g., Principle of Indifference), and your "vague" probabilities are derived from a lack of information, you have two different *kinds* of probability in one system.
  *   **The Break:** When these interact, the "symmetry" probability often loses its justification. If I know $A$ is symmetric, but I learn $A$ is correlated with $B$ (which is vague), the symmetry of $A$ is broken relative to my total evidence. I can no longer claim symmetry "settles" $A$.
  *   **Conclusion:** You cannot maintain a stable partition of "settled" vs. "unsettled" propositions. The "unsettled" infects the "settled" upon almost any non-trivial learning.

  **Recommendation:**
  To save the view, you must weaken the "Local" claim. Do not claim you are *sharp* where symmetry settles it. Claim you are *constrained to a singleton* only when the evidence includes a **known physical chance**. Where it is merely symmetry/indifference, admit you are imprecise. This aligns you more with Levi and less with Jaynes, removes the "Seepage" tension (since everything is potentially vague), and makes your "Parametric Family" constraint the sole source of structure.

  **Final Map:**
  *   **Fatal:** Seepage/Contamination of sharp zones.
  *   **Severe:** Boundary between symmetry/sharpness.
  *   **Costly:** Decision rules.
  *   **Insulated:** Choice of parametric family (needs a selection principle).
  *   **Strength:** Avoids Washout; captures Model Uncertainty better than Sharp Bayes.

  Your view is viable only if you abandon the claim that symmetry *forces* sharpness. If symmetry merely *permits* sharpness, but your parametric family allows vagueness there too, the system becomes coherent, but you lose the "Sharp wherever possible" selling point.
