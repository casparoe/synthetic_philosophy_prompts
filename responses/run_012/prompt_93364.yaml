answer: |-
  | Rank | Question | Why it's upstream | Tractable how / with what methods | What changes its rank in ~3 years |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Can we identify neural/behavioral correlates agreed upon by competing theories (RPT, GWT, HOT)?** | Without convergent indicators, we cannot compare species without settling metaphysics first. | Meta-analysis of existing data; targeted perturbations (TMS/opto) in model organisms to test correlate necessity. | If proven impossible (correlates always diverge), shift funding to theory adjudication (Rank 2) as primary. |
  | 2 | **Do competing theories make divergent, testable predictions for specific taxa (e.g., insects vs. fish)?** | Determines which theory guides policy if convergent indicators fail. | Designing "adjudication experiments" where theories predict opposite outcomes on consciousness presence. | If one theory is empirically falsified in animals, deprioritize it; if all remain viable, increase weight on Rank 4. |
  | 3 | **Is consciousness operationally binary or graded in non-verbal subjects?** | Determines ethical weighting; a dial requires different measurement than a switch. | Psychophysics analogs (confidence reporting, metacognition tasks) adapted for non-human species. | If behavior proves strictly binary, simplify policy frameworks; if graded, prioritize fine-grained scaling tools. |
  | 4 | **What decision rules minimize ethical risk given scientific uncertainty?** | Separates scientific probability from ethical thresholding ("who decides"). | Decision theory modeling; stakeholder workshops to define acceptable error rates (false positives vs. negatives). | If scientific confidence (from 1 & 2) becomes high, this becomes purely legislative rather than research-focused. |

  ### Defense of Ordering

  This agenda prioritizes **measurement validity** over metaphysical resolution. It is settled among experts that nociception is insufficient for consciousness, but contested whether any third-person marker is theory-neutral. Priority 1 addresses your hope for neutral markers directly: it treats their existence as an empirical hypothesis, not a philosophical premise. If we can find correlates that RPT and GWT both agree indicate consciousness, we bypass the "feature vs. bug" of theoretical disagreement. This is upstream because without agreed-upon indicators, cross-species comparison is impossible.

  Priority 2 forces the competing theories to earn their keep. Currently, theorists often retrofit explanations to fit data. By funding experiments designed specifically to break the equivalence between theories (e.g., testing rear-cortex vs. frontocortex necessity in simplified brains), we move from "throat-clearing" to falsification. This is tractable now using perturbation methods in tractable species.

  Priority 3 addresses the binary vs. graded framing. This is downstream of 1 and 2 because you need a measure before you can determine its resolution. However, it is critical for your goal of drawing lines. If consciousness is graded, a binary legal line is inherently arbitrary, pushing more weight onto Priority 4. Regarding the **function of consciousness**: I have excluded it as a primary priority. For distribution questions, *why* consciousness exists is less load-bearing than *where* it exists. Functional accounts often smuggle in ethical assumptions; sticking to correlates and predictions keeps the science cleaner.

  Priority 4 explicitly handles **"who decides."** Science provides probabilities (e.g., "80% chance crabs are conscious"); policy sets thresholds (e.g., "protect if >50%"). Mixing these leads to contested views dressed as consensus. By funding decision-theory work alongside the neuroscience, you acknowledge that the "line" is partly pragmatic. This pushes the ethical deliberation upstream of the final policy, ensuring scientists aren't accidentally making moral judgments disguised as data.

  ### The Single Biggest Objection

  The most damaging objection is **the inference gap**: that subjective experience is inherently private, and no third-person method (neural or behavioral) can ever bridge the gap sufficiently for high-stakes policy. Critics argue that even perfect correlation doesn't prove experience. If this view holds, the entire agenda yields only "consciousness*" (functional proxies), not actual consciousness. This would render the grants useful only for welfare proxies, not for answering the core ontological question you've posed. I am unsure if this gap is bridgeable, but this agenda treats it as a practical engineering problem rather than a metaphysical blocker.
