      *   **(5) Narrative Authority:** Directives have force because a life has a narrative shape; the person authors the whole (ending included). Priority: The Author (Past Self).

  3.  **Identify Conflicts (The Audit):**

      *   *Conflict A: (1) & (5) vs. (2).*
          *   (1) & (5) rely on a strong notion of the "same person" across time to justify the past self ruling the future self.
