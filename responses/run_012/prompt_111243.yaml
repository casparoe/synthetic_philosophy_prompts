      *   *Conflict C: (1) & (5) vs. (4).*
          *   (1) & (5) say override the demented self's resistance.
          *   (4) says autonomy is *present* capacity. If the demented self tugs the tube, they are expressing a will. If they have *any* capacity to govern, overriding them is paternalism.
