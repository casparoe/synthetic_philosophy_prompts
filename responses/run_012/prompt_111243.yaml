  2.  **Deconstruct the Five Commitments:**
      *   **(1) Binding Force:** Competent ADs *ought to bind* caregivers, even if the later demented self seems content/resists (e.g., refusing ANH). Priority: Past Competent Self.
      *   **(2) Personal Identity (Parfitian Reductionism):** No "further fact" of identity. What matters is psychological connectedness/continuity (degrees). Implication: The demented self might be *less* connected to the past self, weakening the identity claim.
