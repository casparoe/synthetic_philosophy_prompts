prompt: |-
  Over the last year or so I've drifted into the moral particularist camp — not the weak "principles have exceptions" version, but the strong one: there are no true exceptionless moral generalizations, reasons are holistic (a feature that counts in favour of an act here can count against it there), and no further principle tells you which way it'll go in the next case. I picture moral principles as lossy compression of a huge table of case judgments, and I suspect the loss is in principle rather than just in practice — moral competence looks more like a perceptual skill than like knowing a rulebook. It's basically the ethics version of all the LW-adjacent stuff about expert judgment resisting codification, which is probably why it appeals to me.

  So: what would count against it? Not the easy stuff like lying to the axe murderer — I want the harder defeaters. Real or constructed cases where a feature's valence flips in a way I can't argue away, empirical results about how moral judgment is actually learned and structured, and the boring possibility that this is just generalism with very long principles, i.e. that it collapses into its rival. What does it predict that a generalist wouldn't? Which parts of the package are load-bearing — if holism goes but "no humanly usable principles" stays, what's left? And which of these defeaters would a particularist themselves concede rather than dismiss, since I dont want only what critics say.

  Also tell me straight whether the view risks anything at all, and if it's unfalsifiable whether that's a fatal problem or just what you'd expect from a claim about what reasons there are. The thing that would move me most is a case where I honestly can't see the flip.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Philosophically sophisticated, likely familiar with meta-ethics (particularism vs. generalism), rationalist/ LessWrong adjacent (mentions "lossy compression," "expert judgment resisting codification," "unfalsifiable").
      *   **Current View:** Strong Moral Particularism (Dancy-style). Key tenets: No exceptionless principles, holism of reasons (valence switching), no higher-order principles to predict switching, moral competence as perceptual/skill-based.
      *   **Goal:** Wants *hard* defeaters, not trivial counterexamples (like "lying to the axe murderer"). Wants to know what would count against the view, empirical challenges, the "long principles" collapse objection, predictive differences, load-bearing components, and concessions particularists might make.
      *   **Tone:** Direct, rigorous, intellectually honest ("Tell me straight").

  2.  **Deconstruct Moral Particularism (The Target):**
      *   *Core Claim:* Moral reasons are holistic. $F$ is a reason for $\phi$ in context $C_1$, but $F$ is no reason (or a reason against) $\phi$ in context $C_2$, without any principled explanation of the switch.
      *   *Metaphor:* Moral principles are lossy compression.
      *   *Epistemology:* Moral perception/intuition > Rule application.

  3.  **Brainstorming Defeaters/Challenges:**

      *   *Challenge 1: The "Default Valence" Argument (Generalist Counter).*
          *   Idea: Maybe features *do* have default valences (e.g., pain is *pro tanto* bad), even if they can be overridden. Particularism denies even *pro tanto* principles sometimes, but strong particularism denies invariant valence.
          *   Defeater: Is there *any* feature that never flips? If yes, particularism is false (or at least the "strong" version is).
          *   Candidate: "Gratuitous torture of a sentient being for fun." Does anything make this good? If the particularist says "maybe in some weird context," they risk absurdity. If they say "no," they admit an exceptionless principle.

      *   *Challenge 2: The "Learnability" / Empirical Challenge.*
          *   Idea: How do children learn morality? If it's purely perceptual without rules, how is transmission possible?
          *   Evidence: Cognitive science on rule-based vs. prototype-based learning.
          *   Defeater: If moral development looks like rule-extraction (even probabilistic), particularism is empirically shaky.

      *   *Challenge 3: The "Collapse into Generalism" (The Long Principle).*
          *   Idea: If the switch depends on context $C$, isn't the principle "If $F$ and $C$, then $R$"?
          *   Particularist Reply: $C$ is open-ended/indefinite.
          *   Defeater: If we can specify the relevant modifiers, it's generalism. If we can't, is it rationality or just mysticism?

      *   *Challenge 4: Guidance/Action-Guidingness.*
          *   Idea: Ethics is practical. If I can't derive "what to do" from principles, what good is it?
          *   Defeater: Particularism might lead to paralysis or arbitrariness in novel cases where intuition fails.

      *   *Challenge 5: Disagreement.*
          *   Idea: If there are no principles, how do we resolve moral disagreements? "My intuition says X, yours says Y."
          *   Defeater: Particularism lacks a framework for arbitration.

      *   *Challenge 6: The "Unfalsifiable" Charge.*
          *   Idea: If every counterexample is explained away by "context changed," is it scientific/philosophical?
          *   Defeater: It risks becoming a "no true Scotsman" of moral reasons.

  4.  **Structuring the Response:**

      *   **Acknowledge and Validate:** Start by confirming understanding of the specific flavor of particularism (Dancy-esque, anti-codifiability).
      *   **Section 1: The "Default Valence" Challenge (The Hardest Case).** Focus on finding a feature that *cannot* flip. This addresses the "case where I honestly can't see the flip" request.
      *   **Section 2: The Empirical/Learning Challenge.** Address the cognitive science angle (rules vs. prototypes).
      *   **Section 3: The Collapse Objection (Generalism with Long Principles).** Analyze whether "indefinite" saves particularism or just hides complexity.
      *   **Section 4: Predictive Differences.** What does particularism predict that generalism doesn't? (e.g., moral dumbfounding, expert disagreement).
      *   **Section 5: Load-Bearing Components.** What happens if holism goes?
      *   **Section 6: Risk and Falsifiability.** Address the "tell me straight" prompt about unfalsifiability.
      *   **Section 7: Particularist Concessions.** What would a Dancy-style particularist admit?

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the "Flip" Case:* The classic is "pain." Usually bad. Can it be good? Sadomasochism (consensual). Punishment (retributive). What about "killing an innocent"? Self-defense? Trolley? Need something tighter. How about "gratuitous cruelty"? If a particularist says "maybe good in some context," they lose credibility. If they say "never," they are generalists about *that* feature.
      *   *Refining the Empirical Angle:* Look at dual-process theory. System 1 (intuition) vs System 2 (rules). Particularism bets heavily on System 1. If System 2 is shown to be necessary for *correct* judgment in novel cases, particularism suffers.
      *   *Refining the Collapse:* The "Hedged Principle" move. Generalists say "All principles are ceteris paribus." Particularists say "No, the variation isn't systematic." The defeater is if we find *systematic* conditions for the flip.
      *   *Falsifiability:* This is crucial. If "context" is a black box that can contain anything, the theory explains everything and nothing. This is a risk.

  6.  **Addressing Specific User Constraints:**
      *   "Not the easy stuff like lying to the axe murderer." -> Avoid standard intro ethics examples.
      *   "Empirical results." -> Cite cognitive science/psychology trends (without needing specific citations, keep it conceptual but grounded).
      *   "Which parts are load-bearing." -> Distinguish Holism from Anti-Codifiability.
      *   "Tell me straight." -> Be direct about the risks (quietism, arbitrariness).

