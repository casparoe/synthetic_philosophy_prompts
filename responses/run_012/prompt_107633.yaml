answer: |-
  Dear Colleague,

  As you prepare for the seminar on the normativity of attitudes, it seems wise to pause before adjudicating the competing solutions to the wrong-kind-of-reasons problem and instead fix our sights on the target itself. We need to agree on what the data is and what any successful theory must capture before we evaluate whether a given account succeeds. If we do not specify the desiderata clearly, we risk talking past one another, mistaking a substantive disagreement for a verbal one, or worse, solving a problem that does not exist while ignoring the one that does. The following is an attempt to lay out those requirements based on the cases we both know well, arguing from the phenomena rather than the literature, to see where the genuine tensions lie.

  We must begin with the data, which consists of a cluster of intuitions about specific scenarios. Consider the demon who threatens to torture you unless you admire him. The intuition here is twofold: first, that the threat gives you a powerful reason to want to admire the demon, or to try to bring it about that you admire him; and second, that the threat does nothing whatsoever to make the demon admirable. A theory of reasons for attitudes must accommodate this split. It must explain how a consideration can bear on the rationality of the agent without bearing on the correctness of the attitude. This yields our first desideratum, which we might call the Fittingness Constraint. An adequate account must distinguish between considerations that make an attitude fitting and considerations that merely make it beneficial or prudent to have that attitude. This is not a prejudice of the fitting-attitude camp but a requirement of phenomenological accuracy. If a theory implies that the demon's threat makes admiration fitting, it contradicts the basic intuition that admiration is a response to merit, not to coercion. The direction of fit matters; admiration aims to match the valuable, whereas the agent aims to match the safe.

  However, we cannot simply dismiss the considerations that fail the Fittingness Constraint as normatively inert. This leads to the second desideratum, the Normative Grip Requirement. In the demon case, and similarly in the case of the eccentric who offers a fortune for believing a known falsehood, it would be practically irrational to ignore the offer or the threat. If you can bribe yourself into the belief or the admiration to avoid torture or gain wealth, you have a reason to do so. Therefore, an adequate theory cannot treat wrong-kind reasons as mere psychological causes or non-normative incentives. They must be acknowledged as reasons in some sense, for they enter into practical deliberation and can justify actions aimed at attitude formation. If a theory says these are not reasons at all, it fails to explain why accepting the bribe is rational while holding the attitude for that reason seems defective. The theory must account for the normativity of the pragmatic consideration without allowing it to contaminate the standard of correctness for the attitude itself.

  This brings us to a third requirement, the Object-Givenness Condition. In the case where you are paid to admire a genuinely admirable person, you have both a right-kind reason and a wrong-kind reason. The intuition is that the payment does not add to the admirability of the person. The reasons that make an attitude fitting must be grounded in the properties of the object of the attitude, not in the consequences of holding it. The admirable qualities of the person are object-given; the money is state-given. An adequate account must explain why the normative force of the right-kind reasons is tied to the content of the attitude in a way that the wrong-kind reasons are not. This is reinforced by the case of the small reward offered for an attitude you already have ample reason to hold. Here, the reward does not increase the degree to which the attitude is called for, even if it increases the motivation to maintain it. The theory must prevent the inflation of fittingness by external rewards. If the account allows pragmatic benefits to accumulate with merit to increase the fittingness of the attitude, it collapses the distinction we established in the first desideratum.

  Now we must confront the tensions between these requirements, for they pull in opposing directions. The central conflict lies between the Fittingness Constraint and the Normative Grip Requirement. If we insist that fittingness is what an attitude's reasons are reasons for, we seem compelled to say that wrong-kind considerations are not reasons for the attitude. Yet, if we acknowledge the Normative Grip Requirement, we must admit these considerations are reasons for something. The question is whether one can hold both that fittingness is the exclusive domain of right-kind reasons and that wrong-kind reasons are reasons for the attitude in any sense at all. If we say wrong-kind reasons are reasons for the attitude, we risk violating the Object-Givenness Condition, because we are admitting reasons that have nothing to do with the object's properties. If we say they are not reasons for the attitude, we must explain what they are reasons for. The most promising path, which respects all three desiderata, is to treat the wrong-kind reason as a reason to manage the attitude rather than to have it. It is a reason to bring it about that one has the attitude, not a reason that counts in favour of the attitude's correctness. This preserves the Fittingness Constraint by keeping the standard of correctness pure, satisfies the Normative Grip Requirement by acknowledging the rationality of the management action, and upholds Object-Givenness by restricting reasons for correctness to properties of the object.

  This raises the question of whether this is one problem across belief, desire, emotion, and intention or several distinct ones wearing a single name. While the structural problem is identical, the stakes differ significantly across attitudes. In the case of belief, the eccentric's offer for a false belief highlights an alethic constraint that is unique to doxastic states. Truth is the constitutive aim of belief in a way that value is the aim of admiration. One might argue that the wrong-kind-of-reasons problem for belief is more severe because believing against evidence is not just unfitting but constitutively impossible or irrational in a way that admiring a demon is not. However, treating them as entirely distinct problems risks missing the general structural insight about the normativity of attitudes. It is better to view them as a single genus with distinct species. The general requirement is that attitudes have standards of correctness internal to their nature, and external incentives cannot alter those standards. Whether that standard is truth, value, or desirability changes the content of the Fittingness Constraint but not the constraint itself. Therefore, a unified theory is preferable, provided it is sensitive to the specific constitutive aims of each attitude.

  Is there a pair of desiderata that cannot be jointly satisfied? One might argue that the Normative Grip Requirement and the Object-Givenness Condition are incompatible if one defines reasons for attitudes broadly enough to include all considerations that rationalize having them. If a pragmatic benefit rationalizes having the attitude, why is it not a reason for the attitude? To hold both, one must adopt a narrow conception of reasons for attitudes, restricting them to considerations that speak to the attitude's correctness. If this pair proves incompatible, it would not be a refutation of the fitting-attitude programme itself, but only of a careless statement of it that attempts to reduce all normativity to a single kind of reason. The fitting-attitude analysis of value relies on the distinction between the fitting and the prudent. If that distinction collapses, the analysis fails. But the distinction is robust. The incompatibility arises only if one insists on a monistic theory of reasons that cannot differentiate between reasons for correctness and reasons for management. Thus, the tension is not fatal to the programme but fatal to monism about normative reasons.

  Regarding which single requirement does the most work in ruling out otherwise popular accounts, it is the Object-Givenness Condition. Many consequentialist or pragmatic accounts of normativity stumble here. They can explain why you should want to admire the demon, and they can explain why you should try to believe the eccentric's proposition, but they struggle to explain why the demon remains unadmirable and the proposition remains unbelievable in the face of these incentives. A simple cost-benefit analysis of mental states cannot capture the intuition that the payment does not add to the merit of the admiration. The Object-Givenness Condition forces the theory to look at the relation between the mind and the world, rather than just the relation between the mind and the agent's welfare. It rules out any account that treats attitudes as mere tools for happiness or survival without regard for their representational or evaluative accuracy.

  Finally, we must distinguish between what is non-negotiable and what is a matter of taste. The non-negotiable requirement is the distinction itself, captured by the Fittingness Constraint. Any theory that conflates the reason to avoid torture with the reason to admire is simply failing to describe the phenomena. It is a brute datum of our normative experience that coercion does not create merit. This is not up for debate. What is a matter of taste is the semantic labeling of the wrong-kind consideration. Whether we call it a reason for the attitude, a reason to have the attitude, or a pragmatic reason is less important than the structural role it plays in the theory. Some philosophers prefer to say there are two kinds of reasons for attitudes; others prefer to say there are reasons for attitudes and reasons for actions that cause attitudes. This is largely terminological, provided the theory respects the Object-Givenness Condition and the Normative Grip Requirement. As long as the account explains why the demon is not admirable despite the threat, and why it is rational to avoid the threat, the label attached to the threat's normativity is secondary.

  In sum, your seminar should focus on ensuring that any proposed solution respects the triad of Fittingness, Normative Grip, and Object-Givenness. The real work lies in explaining how these three cohere without collapsing into monism or dualism that severs the connection between reason and rationality. If a theory sacrifices the Fittingness Constraint to save the unity of reasons, it fails the data. If it sacrifices the Normative Grip to save the purity of fittingness, it fails the agent. The challenge is to navigate between them, acknowledging that while the demon gives you no reason to admire him, he gives you every reason to see to it that you do.

  Yours sincerely,

  A Friend
