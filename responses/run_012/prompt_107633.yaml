      *   *Tension 1:* The "Reasons" Ambiguity. If we say WKRs are *reasons*, we blur the line with RKRs. If we say they are *not reasons*, we ignore the practical rationality of accepting bribes/threats.
      *   *Tension 2:* Unity of the Problem. Is the WKR problem for belief (truth-governed) the same as for admiration (value-governed)?
