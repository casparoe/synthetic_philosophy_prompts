answer: |-
  It is a pleasure to correspond with someone who sees the connection between the renormalization group and ontology. Your provisional principle—"a pattern is real to the degree that it survives re-description"—is essentially a philosophical articulation of **Renormalization Group (RG) invariance**. In physics, we trust quantities that remain stable as we flow toward the fixed point (coarse-grain the system) and distrust those that are sensitive to the cutoff scale (microscopic details).

  Let us run your cases through this RG-style filter, identify where the principle strains, and then propose a repair that honors your experimental instincts.

  ### 1. Testing the Provisional Principle

  Your principle states: *Real = Robust under transformation of variables/scale/level.*

  **The Physics Cases (Temperature, Critical Exponents, Effective Mass)**
  *   **Verdict:** Real.
  *   **Analysis:** These pass with flying colors. Temperature is invariant under coordinate transformations of the molecules. Critical exponents are the definition of universality classes; they explicitly *discard* microscopic details (lattice structure, spin type) and retain the pattern. Effective mass absorbs the complex lattice interactions into a single parameter that behaves like a free particle property.
  *   **Consistency:** High. These are "fixed point" properties.

  **The Economic Case (Stock Support)**
  *   **Verdict:** Not Real.
  *   **Analysis:** A support level is highly sensitive to the "scale" of observation. Change the time window (minute vs. month), change the currency, or switch from price charts to order-flow data, and the support level often dissolves or shifts arbitrarily. It does not survive re-description.
  *   **Consistency:** High. It is a "cutoff-dependent" artifact.

  **The Agency Cases (Chess, Termites, Genes)**
  *   **Verdict:** Chess (Real), Termites (Not Real), Genes (Not Real).
  *   **Analysis:** Here is where your provisional principle fractures.
      *   **Chess:** You say the "want" is real because it predicts moves better than the code. Under your principle, does this "want" survive re-description? If I describe the engine in terms of logic gates rather than evaluation functions, the "want" disappears. If I change the hardware, it stays. It is robust across *hardware* but not across *software architecture*.
      *   **Termites:** You say the "decision" is not real, even though it predicts the mound structure. But structurally, this is identical to the Chess case. The termite colony is a computational substrate; the "decision" is a high-level description of the output. If the "want" in the chess engine is real because it predicts moves, why is the "decision" in the termite colony not real when it predicts structure?
      *   **Genes:** Similar to termites. The "interest" predicts replication success.

  **The Conflict:**
  Your provisional principle ("survives re-description") cannot distinguish between the Chess Engine and the Termite Colony. Both are emergent patterns that yield predictive power at a coarse-grained level but vanish if you look at the fundamental physics (voltage fluctuations or pheromone diffusion).

  To keep your verdicts (Chess = Real, Termites = Not), you must be smuggling in a second criterion. You are distinguishing between **Patterns that are Causal Constraints** vs. **Patterns that are Descriptive Summaries.**

  *   In the **Chess Engine**, the "desire to control the center" is *encoded* in the evaluation function. It is a parameter that drives the search. It is a "knob" in the system's dynamics.
  *   In the **Termite Colony**, the "decision to ventilate" is *not* encoded. There is no variable in the termite's nervous system or the pheromone field that represents "ventilation." The ventilation is a byproduct of local rules. The "decision" is a story we tell about the output, not a lever in the machine.
  *   In the **Gene**, the "interest" is not a causal force; selection pressure is. The gene does not "try"; it simply persists if it fits.

  ### 2. The Repaired Principle

  To accommodate your verdicts without creating a patchwork, we must refine "survives re-description" to include **interventional robustness**.

  **Proposed Principle:**
  > A pattern is real if it is **robust under coarse-graining** AND it corresponds to a **causal degree of freedom** within the system's dynamics.

  In experimental terms: A pattern is real if you can "turn the knob" of that pattern to change the system's behavior, without needing to rewrite the microscopic laws.

  *   **Temperature:** Real. I can change the temperature (add heat) to change the pressure without tracking molecules.
  *   **Critical Exponents:** Real. They dictate how the system responds to perturbations near the phase transition.
  *   **Chess "Want":** Real. If I change the weight of the "center control" parameter in the evaluation function, the moves change. The "want" is a tunable parameter.
  *   **Termite "Decision":** Not Real. I cannot turn the "decision" knob. I must alter pheromone evaporation rates or termite sensitivity. The "decision" is an output, not a control variable.
  *   **Gene "Interest":** Not Real. I cannot adjust a gene's "interest." I can only alter the environment or the replication mechanism.
  *   **Stock Support:** Not Real. I cannot trade "support." I can only trade price. The support level exerts no causal force on the order book; it is a shadow cast by past trades.

  This repaired principle aligns with your background. It treats ontology like **Effective Field Theory**: a higher-level entity is real if it appears as a field or parameter in the effective Lagrangian that successfully predicts interactions, not merely if it describes a static configuration.

  ### 3. Application to New Cases

  Using the **Causal Degree of Freedom** principle, here are the verdicts on your unsettled cases.

  **Case A: A Market's Expectation of Inflation**
  *   **Analysis:** Is this merely a descriptive summary of past prices (like stock support)? Or is it a causal degree of freedom?
      *   In modern macroeconomics, expectations are *encoded* in contracts (wage agreements, bond yields) and central bank forward guidance.
      *   If I could manipulate "expectations" (e.g., via credible central bank communication) without immediately changing current money supply, would behavior change? Yes. Firms would set prices differently; workers would demand different wages.
      *   Does it survive re-description? It survives shifts between different economic models (New Keynesian, Monetarist) provided they include rational/adaptive expectations.
  *   **Verdict:** **Real.**
      *   *Reasoning:* Inflation expectation functions as a causal parameter in the economic dynamics, much like temperature does in a gas. It exerts a "pressure" on current pricing decisions independent of current cash flow.

  **Case B: The Boundary of a Species in a Ring of Interbreeding Populations**
  *   **Analysis:** Consider a ring species (like *Larus* gulls) where population A breeds with B, B with C, ... and Y with Z, but A and Z cannot interbreed. Where is the species boundary?
      *   **Robustness:** The boundary dissolves under re-description. If I look at genetics, it is a cline (a gradient). If I look at geography, it is a circle. There is no single coordinate where "specieshood" switches on or off.
      *   **Causal Degree of Freedom:** Is there a "boundary knob"? No. Reproductive isolation is a continuous variable (gene flow). Drawing a line is a bookkeeping convenience for taxonomists, not a causal constraint on the birds. The birds do not "know" the boundary; they only know local mating compatibility.
  *   **Verdict:** **Not Real.**
      *   *Reasoning:* The boundary is a descriptive artifact imposed by observers who require discrete categories. It does not survive the "re-description" of continuous gene flow, nor does it act as a causal constraint (the gene flow happens regardless of where we draw the line).

  ### Summary

  Your intuition was correct to be wary of Dennett's Intentional Stance if applied too broadly. Dennett tends to flatten the distinction between *designed* teleology (Chess) and *ascribed* teleology (Termites/Genes) because he prioritizes predictive power.

  However, as an experimentalist, you prioritize **causal leverage**. Your repaired principle—**Real Patterns are Robust Causal Degrees of Freedom**—preserves your verdicts. It keeps the physics solid, accepts engineered agency (where goals are parameters), rejects biological metaphor (where goals are descriptions of outcomes), and gives you a clear scalpel for the new cases: Inflation expectations are real (they drive the system); species boundaries in clines are not (they describe the system).

  It is not a patchwork; it is an **Effective Theory of Ontology**.
