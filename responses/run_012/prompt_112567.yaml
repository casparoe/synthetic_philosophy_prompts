answer: |-
  The phenomenon you are describing is well-recognised in both legal theory and metaphysics, though it lacks a single, uncontested label that perfectly captures the strong version of the claim you are interested in.

  ### The Established Name: The Abnormal Conditions Focus

  The classic term for this phenomenon is **The Abnormal Conditions Focus** (sometimes referred to simply as **Abnormalism**).

  This concept was most famously articulated by the legal theorists H.L.A. Hart and Tony Honoré in their seminal work *Causation in the Law* (1959). They argued that when we select a cause from a multitude of necessary conditions, we do not choose based on physical necessity alone. Instead, we select the condition that represents a **deviation from the normal or expected course of events**.

  In your examples:
  *   **The Operator:** Standing still is abnormal (a breach of duty/routine).
  *   **The Visitor:** Standing still is normal (no duty/expectation).
  *   **The Technician:** Not checking the valve is abnormal (breach of personal habit).

  Hart and Honoré explicitly grouped duties, statistical frequencies, and individual habits under the umbrella of "common sense principles" of causation. They argued that a cause is essentially an **intervention** in the normal state of affairs.

  ### The Strong Version: Default-Relative Causation

  You asked whether anyone defends the *strong* version of the claim: that the norm is doing work in causation itself, not merely in our readiness to blame (pragmatics).

  While Hart and Honoré are often interpreted as making a pragmatic claim about how we *talk* about causation, contemporary metaphysicians have defended the strong, ontological version. The most precise established term for this is **Default-Relative Causation** (or **Causal Default-Relativity**).

  **Defenders of the Strong Claim:**
  1.  **Sarah McGrath** (e.g., "Omissions and Causation", 2005): She argues that omissions are causes only relative to a "default" state. Crucially, she defends the view that these defaults can be moral (duties) or statistical (habits/frequencies) without a fundamental metaphysical distinction between them.
  2.  **Christopher Hitchcock** (e.g., "The Intransitivity of Causation Revealed", 2001): Working within Causal Modelling, he argues that causal models require variables to be set to "default" values. Causation is a deviation from these defaults.
  3.  **Jonathan Schaffer** (Contrastive Causation): He argues that causation is a ternary relation (c causes e *rather than* c* causing e*). The "contrast class" is often determined by normative expectations.

  These theorists argue that the norm is not a post-hoc filter applied to a finished causal picture; rather, the norm helps *constitute* the causal relation. Without the norm to establish the baseline, there is no fact of the matter about whether the omission was a cause.

  ### Distinctions from Related Concepts

  You correctly noted that this is not the distinction between **Doing and Allowing**, nor is it simple **Counterfactual Dependence**. Here is precisely how **Default-Relative Causation** differs from them:

  1.  **Vs. Doing and Allowing:**
      *   *The Distinction:* "Doing and Allowing" categorises actions based on physical movement (act vs. omission).
      *   *The Difference:* In your cases, both the operator and the visitor "allowed" the death (omission). The Doing/Allowing distinction places them in the same category. **Default-Relativity** splits them based on whether the omission was a *deviation from a baseline*. It explains why one omission is causal and the other is not, despite both being physically identical.

  2.  **Vs. Counterfactual Dependence:**
      *   *The Distinction:* Standard counterfactual theory says $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.
      *   *The Difference:* As you noted, the counterfactuals are identical (if the operator had moved, the death would not have happened; if the visitor had moved, the death would not have happened). **Default-Relativity** modifies the counterfactual account by insisting that counterfactuals are **contrastive**. We ask: "Did the *deviation* from the norm cause the outcome?" not "Did the *event* cause the outcome?" The norm selects which counterfactual comparison is relevant.

  ### The Gap: Duty, Statistical, and Habitual Norms

  You asked if a single name covers the duty case, the statistical case, and the habitual case together.

  **The Situation:**
  The term **The Abnormal Conditions Focus** (Hart & Honoré) *claims* to cover all three. However, it is frequently criticised for conflating **Prescriptive Norms** (what one *ought* to do, e.g., duty) with **Descriptive Norms** (what one *usually* does, e.g., habit/statistic). Many philosophers (such as Michael Moore) argue that duty-based causation is fundamentally different from statistical causation.

  Consequently, while **Default-Relative Causation** is the modern metaphysical term that *attempts* to unify them, there is no universally accepted term that successfully defends the unification without controversy. The existing vocabulary often fractures them into "Normative Causation" (Duty) and "Statistical Causation" (Habit/Frequency).

  **The Proposed Term:**
  Since you require a term that treats the duty, the habit, and the statistical expectation as functionally identical in their causal power (the strong claim that the *source* of the expectation does not matter, only the *existence* of a baseline), I propose the term:

  **Baseline-Relative Causation**

  **Definition:**
  > **Baseline-Relative Causation** is the theory that causal attribution is determined solely by whether an event or omission constitutes a deviation from a contextually salient baseline, irrespective of whether that baseline is established by legal duty, statistical frequency, or individual habit. Under this view, a breach of duty and a breach of habit are metaphysically identical causal mechanisms: both are failures to adhere to a prescribed or expected default state.

  ### Summary for Your Reports

  *   **Phenomenon:** The Abnormal Conditions Focus (or Abnormalism).
  *   **Strong Metaphysical Defence:** Default-Relative Causation.
  *   **Unified Term for Duty/Habit/Stat:** Baseline-Relative Causation (proposed).
  *   **Key Distinction:** It is not about physical force (Doing/Allowing) or simple necessity (Counterfactuals), but about **Deviance from a Default**.

  In your work as a loss adjuster, you are effectively applying **Baseline-Relative Causation**. You are not merely assigning blame; you are identifying which deviation from the expected baseline operated as the effective cause of the loss. When the standing still was "normal" (the visitor), it was part of the background conditions. When it was "abnormal" (the operator), it became the cause.
