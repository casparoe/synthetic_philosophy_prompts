  Ok so this is a weird one. I'm not an academic, I just listen to too many podcasts and read philosophy encyclopedia entries on the bus, and I've got stuck on something. It's the thing where if you're a deontolgy person you won't do a bad thing even to stop more of that same bad thing — you won't kill one guy to stop five killings, won't lie to stop a bigger lie, etc. — and then the obvious comeback is that this makes you sound like a guy who cares more about keeping his own hands clean than about how much bad stuff actually happens in the world. Someone on a podcast called it the paradox of deontology and then everyone moved on and I've been chewing on it for like a month. (I also can't tell if the "well I didn't do it, it just happened" move is a real answer or a dodge, which is sort of the whole thing.)

  I want a joke about it. You're a philosopher who knows this debate cold and is also actually funny — think it through carefully and brainstorm a few angles first, but only show me the finished joke. It has to be a real joke and not a nerd joke with a philosophy sticker on it: the punchline has to turn on the actual content of the paradox — the doing vs allowing thing, the way a deontologist seems to file my wrongdoing and your wrongdoing in two different columns, the fact that minimize the total number of wrongs just isn't the game being played. Someone who knows the debate should laugh in the right spot, and someone who doesn't shouldn't walk away thinking I've misunderstood the whole idea.

  Format: exactly six numbered lines, each one or two sentences, no intro and no wrap-up. Lines one through five are the joke, one beat per line, punchline on the fifth. The sixth line is for the caveat: if the joke only lands by leaning on a stretched or contested reading of the paradox — or on a caricature of the deontologist — say so there, and tell me what would change my mind, i.e. which argument or consideration would make the paradox come out the other way, and where your own reasoning is most likely to be wrong.
