prompt: |-
  I'm a backend engineer who spends way too much time in git, and last weekend I got into a long, slightly drunk argument with a friend who did a history degree about whether nations are actually old. I kept saying it's basically version control with a rebrand, and he kept saying I was missing the point. Can you do me a favor and restate the main Hobsbawm/Anderson-style picture -- nations as modern, imagined communities, traditions that look ancient but were invented or at least assembled recently -- as faithfully as you can in the vocabulary I actually use: repos, commits, author dates vs committer dates, rebasing, force-pushing, tags, release notes, monorepos, forks, provenance, signed commits, reflogs, that kind of thing. I know git reasonably well (I've done interactive rebases, recovered stuff from the reflog, dealt with submodules and a legacy monorepo), but I'm not a git internals person, so keep the translation at the level of someone who uses it daily rather than someone who writes merge algorithms. The specific thing that got me thinking about this: at my last job there was a giant legacy monorepo where the official history had been cleaned up -- someone had squashed decades of commits into a few tidy ones, backdated some tags, and the release notes told a nice story about a single coherent project. The only trace of the actual mess was in the reflog on one old build server. So I'm primed to think of invented tradition as a kind of history rewrite.

  After you've done the translation, give me the residue report, and please treat the residue as the interesting part rather than a footnote. Which parts of the imagined-communities/invention-of-tradition view map cleanly onto git? Which parts only translate if you distort them -- e.g. does calling a tradition an invented commit smuggle in the assumption that it's a deliberate lie, when the original point might be that it's constructed and then sincerely believed? Which parts have no counterpart at all in version control -- things like sovereignty, mass affect, horizontal comradeship, the way people die for a nation, or the fact that an imagined community is imagined not because it's fake but because its members will never meet yet carry an image of communion? And for each bit of residue, tell me whether it's a defect of my git vocabulary (something version control genuinely cannot represent) or a sign that the original claim was vaguer or more metaphorical than it looked. Don't give me a reading list or citations, I can't look anything up right now; just argue it out. Also, at the end, tell me who you think wins the argument with my friend, and whether 'nations are just repos' is a good translation or a cheap analogy that collapses under pressure.
