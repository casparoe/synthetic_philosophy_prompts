  **What this is and isn't for**

  This tool is not a moral calculator. It does not output the right decision. It is a triage instrument for ethics consults, designed to distinguish genuine moral dilemmas from solvable problems or system failures. Use it when a page comes in claiming "no right option." It forces clarity on whether the conflict is real or merely epistemic. It does not replace an ethicist but stabilizes the situation until one arrives. It protects clinicians from mislabeling administrative failures as tragic choices. If the procedure halts, you must escalate. It ensures that when you say "dilemma," you mean it.

  **The procedure, step by step**

  Follow these steps in order. Do not skip ahead. If you fail a step, the process terminates. This prevents wasting ethics resources on solvable problems.

  1. **Define the Conflict.** Write down the two competing actions. Label them Option A and Option B. State clearly what value each protects and what value each violates. If you cannot articulate two distinct moral claims, you do not have a dilemma; you have a preference. Clinicians often confuse strong preferences with moral duties. This step forces you to isolate the specific duties in collision. Do not describe the patients; describe the obligations. Vague distress is not a conflict. This prevents vague anxiety from driving the consult.
  *Good enough answer: Two sentences, each starting "Option X protects [value] but violates [value]."*

  2. **Check for Epistemic Gaps.** Ask: Is the conflict real, or do we just lack data? If more labs, more time, or clearer advance directives would make one option obviously correct, stop. This is not a dilemma; it is an information deficit. Gather the data. Many pages come in during uncertainty, not impossibility. If the right answer exists but is hidden, your job is search, not choice. Do not moralize ignorance. Uncertainty feels like a dilemma, but it is just a lack of knowledge.
  *Good enough answer: A confirmed "No" to "Would more information solve this?"*

  3. **Test Obligation vs. Permission.** Are both options morally required, or is one merely permitted? A dilemma requires two conflicting obligations. If Option A is required and Option B is just nice-to-have, choose A. No conflict exists. Supererogatory acts (good deeds beyond duty) cannot override mandatory duties. If one path is optional, the conflict dissolves into a standard decision. You cannot claim a dilemma exists simply because you wish you could do everything. Duties are derived from role, promise, or law, not feeling.
  *Good enough answer: Confirmation that both options carry a "must" weight, not a "may."*

  4. **Audit Upstream Avoidability.** Could this conflict have been prevented by earlier planning, resource allocation, or policy adherence? If the scarcity was created by negligence or poor scheduling, this is not a dilemma. It is a system failure masquerading as tragedy. True dilemmas are inevitable; administrative crises are not. If better staffing or earlier referral would have solved this, label it as operational failure, not ethics. Do not let management off the hook by calling it fate. Ethical distress is not a substitute for administrative accountability.
  *Good enough answer: A documented "No" to "Could reasonable prior action have prevented this clash?"*

  5. **Assess Intention.** If you choose Option A, does the harm in Option B happen as a side effect or as a means to your end? You must not intend the harm. If the bad outcome is necessary for the good outcome to occur, you cannot proceed without ethicist review. This distinguishes letting die from killing. If the harm is the mechanism of the rescue, you are crossing a line that requires higher authorization. You must be honest about whether you are using the harm.
  *Good enough answer: A clear statement that the harm is foreseen but not intended as a tool.*

  6. **Plan for Residual Obligations.** Acknowledge that choosing the lesser evil does not erase the wrong done to the losing side. What is owed to them? Apology? Compensation? Memorialization? If you claim nothing is owed, you have not understood the choice. Moral remainders exist. The decision ends the crisis, but it does not end the moral debt. You must record how you will honor the loss. Cleaning up the mess is part of the ethics, not just the choice. Ignoring this turns the patient into a means to an end.
  *Good enough answer: A specific action item listed to address the harm done to the unchosen option.*

  7. **Handoff Condition.** If any step yields a "Yes" to avoidability, "No" to obligation, or uncertainty on intention, stop. Do not force a resolution. Page the ethicist or administrator responsible for the upstream failure. This tool is not a shield against accountability. If the procedure flags a system error, the consult becomes an incident report. If it flags a true dilemma, proceed with documentation of the remainder. You are not alone in this.
  *Good enough answer: A decision to either proceed with documentation or escalate to human review.*

  **Two cases run through**

  Case One: The ICU ECMO scarcity. Step 1 identifies two obligations: save the young patient, save the older patient. Both hold valid claims to life-saving care. Step 2 confirms no missing data will change the scarcity; there is physically one circuit. Step 3 confirms both are patients under care; both have a "must" claim to treatment based on medical need. Step 4 is critical: could this be avoided? If the hospital only bought one circuit despite known pandemic demand, Step 4 flags this. Assuming supply was truly unpredictable and allocation policy was followed, it passes. Step 5 confirms death is a side effect of scarcity, not the method of saving the other. Step 6 requires documenting support for the family of the unchosen patient. Result: Genuine tragic choice. Residual debt acknowledged. The team must grieve the unchosen patient, not just celebrate the survivor. The output is not "who lives," but "how we honor the one who dies." The procedure validates their distress without promising a clean conscience. It forces them to plan a meeting with the losing family, not just chart the decision.

  Case Two: The staffing shortage and med error. Step 1 identifies obligations: safe staffing vs. patient safety. Step 2 passes; the harm is done. Step 3 passes; both are duties. Step 4 fails immediately. Was the shortage preventable? Yes. Staffing schedules are made weeks in advance. Calling this a dilemma insults the harmed patient. It was negligence. The procedure stops at Step 4. Do not process this as ethics. Escalate to administration as a system failure. Do not offer "moral residue" counseling to the nurse; offer incident reporting. This is not a tragedy; it is a mistake. Labeling it a dilemma protects the hospital from liability while burdening the nurse with false guilt. The procedure forces you to admit someone is at fault. The output here is an incident report, not an ethics note. If you run this through to Step 6, you are complicit in the cover-up. The nurse needs legal support, not moral consolation. The tool strips away the "tragic" label to reveal the preventable error underneath. It refuses to let the system hide behind moral ambiguity.

  **Where it stops, and where I'm fooling myself**

  This procedure cannot absolve guilt. It structures thought, but it cannot remove the pain of choosing. It relies on honest self-reporting; a clinician determined to avoid blame can lie at Step 4. It risks bureaucratizing grief, turning moral residue into a checklist item. It cannot solve the shortage of ethicists. If the system is broken, this tool just names the break. It does not fix it. You must accept that some pages will return no answer, only a mirror. Furthermore, it cannot assess intention perfectly in high-stress moments. People lie to themselves about what they intended. The tool assumes rationality where there is often panic. It is a scaffold, not a shelter. It also cannot account for power dynamics. A junior nurse may not feel safe flagging upstream failure.
