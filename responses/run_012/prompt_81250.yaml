answer: |-
  **Exam Question**

  Max Black argues that a symmetric universe containing only two exactly similar spheres is logically possible, and that this possibility refutes the Principle of Identity of Indiscernibles. Evaluate this argument. In your assessment, you must distinguish between the two directions of Leibniz's Law and explain why the principle's validity depends entirely on how one classifies "properties." Finally, discuss what accepting or rejecting the principle implies about the metaphysical constitution of objects: are they merely bundles of qualities, or do they possess a non-qualitative "thisness"?

  ***

  **Model Answer**

  Black's thought experiment presents a significant challenge to the Principle of Identity of Indiscernibles (PII), but whether it constitutes a definitive refutation depends on how one interprets the logical status of the principle and the nature of properties. To evaluate this, we must first distinguish between the two directions of Leibniz's Law. The Indiscernibility of Identicals states that if two things are identical, they share all properties. This direction is logically uncontroversial; it is essentially a rule of substitution. Black's scenario does not threaten this. The controversial direction is the Identity of Indiscernibles: if two things share all properties, they are identical. Black argues that two spheres can share all properties yet remain distinct, thereby breaking this conditional.

  The success of Black's counterexample hinges on the classification of properties. If "properties" includes identity-involving properties (such as "being identical to Sphere A"), then PII becomes analytically true but trivial. Sphere A has the property of being identical to Sphere A, and Sphere B does not; therefore, they are discernible, and PII holds by definition. However, this renders the principle useless for metaphysics. For PII to do any work, it must be restricted to qualitative properties—characteristics like color, mass, or spatial relation that do not presuppose the identity of the object. Black's spheres are constructed to share all qualitative properties. If we accept this restriction, Black successfully demonstrates that PII is not a truth of logic. There is no logical contradiction in describing a symmetric universe with two distinct subjects possessing identical qualitative predicates.

  However, demonstrating that PII is not logically necessary is not the same as proving it is false in reality. This leads to the deeper metaphysical implication regarding the constitution of objects. If one adheres to a Bundle Theory of substance, an object is nothing over and above the collection of its properties. On this view, if two objects share all properties, they are literally the same bundle, and there cannot be two of them. For a Bundle Theorist, Black's universe is not just empirically unlikely but metaphysically impossible to describe coherently, because there is no principle of individuation left once qualitative properties are exhausted.

  Conversely, if one accepts a Substratum Theory, objects possess a non-qualitative "thisness" (haecceity) underlying their properties. This substratum individuates the object regardless of its qualities. If this view is correct, PII is contingent rather than necessary. It might be true in our world that no two things share all qualities, but it is not true in all possible worlds. Black's scenario supports this view by suggesting that distinctness can exist without qualitative difference.

  Therefore, Black's argument successfully refutes the claim that PII is a logical truth or an analytic principle, provided we restrict properties to qualitative ones. It forces a choice: either deny the possibility of Black's universe (committing to Bundle Theory) or accept that objects have a non-qualitative element of individuality (committing to Substratum Theory). The principle is not dead, but its status shifts from a logical necessity to a contingent metaphysical claim dependent on one's ontology of substances. A strong evaluation recognizes that Black wins the logical battle—showing the principle isn't analytic—but the metaphysical war depends on whether one believes objects are merely sums of qualities or something more.

  ***

  **Marking Scheme (25 Points Total)**

  **1. Distinction of Leibniz's Law Directions (5 points)**
  *   **Full Credit:** Clearly distinguishes between "Identicals are Indiscernible" (uncontroversial) and "Indiscernibles are Identical" (the contested principle).
  *   *Common Error:* Students treat Leibniz's Law as a single claim and argue Black refutes the whole thing, including the substitution rule.

  **2. Classification of Properties (5 points)**
  *   **Full Credit:** Explains that PII is trivial if identity-properties are allowed, so it must be restricted to qualitative properties for the debate to matter.
  *   *Common Error:* Students argue the spheres are discernible because they are in different places (spatial relations) without addressing why space might be relational or qualitative.

  **3. Metaphysical Implications (Bundle vs. Substratum) (5 points)**
  *   **Full Credit:** Connects the truth of PII to the constitution of objects (Bundle Theory requires PII; Substratum Theory allows Black's scenario).
  *   *Common Error:* Students discuss the spheres without mentioning what an object is "made of" (properties vs. underlying substance).

  **4. Modal Status of the Principle (5 points)**
  *   **Full Credit:** Identifies that Black shows PII is not logically necessary/analytic, but leaves open whether it is empirically true or contingently false.
  *   *Common Error:* Students claim Black proves PII is universally false, rather than showing it is not a logical truth.

  **5. Structure and Avoidance of Lazy Objections (5 points)**
  *   **Full Credit:** Essay is coherent, avoids the "different locations" shortcut, and avoids the "PII is dead" slogan without nuance.
  *   *Common Error:* Students spend half the essay explaining the thought experiment rather than analyzing its implications.

  **Note on Grading:** Do not award points for naming specific philosophers, texts, or dates. Credit is awarded for conceptual accuracy only.
