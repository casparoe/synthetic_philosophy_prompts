      *   *Counterfactual Conditional:* "If P had been the case, Q would have been the case." (e.g., "If it had rained, the match would have been cancelled.")
      *   *The Carol's Twist:* The Ghost shows a future that *looks* indicative (this *will* happen) but functions rhetorically as a counterfactual (this *would* happen if you don't change).
