answer: |-
  **The Scenario**

  A logistics firm designs a proprietary optical character recognition (OCR) system for sorting bins, using a closed three-letter alphabet where 'a' is defined strictly as "the glyph mapped to Memory Slot 1," 'b' to Slot 2, and 'c' to Slot 3. They commission two font files, *LogiType-A* and *LogiType-B*, to test robustness. In *LogiType-A*, the double-story 'a' shape is mapped to Slot 1, and the circle 'o' shape to Slot 2. In *LogiType-B*, to prevent visual bias, the mapping is permuted: the circle 'o' shape is mapped to Slot 1, and the double-story 'a' shape to Slot 2. Within *LogiType-A*, the designer creates a bold-italic variant of the double-story 'a' in Slot 1; the scanner still identifies it as 'a'. However, when the standard double-story 'a' glyph is moved from Slot 1 to Slot 2 in *LogiType-B*—preserving its exact geometry, weight, and angle—the scanner identifies it as 'b', while the circle in Slot 1 is identified as 'a'.

  **The Analysis**

  The **Intrinsic View** must verdict that the double-story 'a' in *LogiType-B* is an 'a' (because its form is canonical) and the circle in Slot 1 is an 'o' (because its form is circular). The **Systemic View** must verdict the opposite: the double-story 'a' in *LogiType-B* is a 'b' (because it occupies the 'b'-role/Slot 2), and the circle is an 'a' (because it occupies the 'a'-role/Slot 1). The single feature doing the work is the **encoding map** (the arbitrary assignment of glyph to memory slot). This is not a restatement of the systemic view because the map is an external, functional constraint independent of the glyph's geometry; it is the mechanism by which the system enforces contrast. If the encoding map is removed (i.e., if there is no scanner or defined slot order), the case collapses: without a system to assign roles, both views are forced to rely on form, and they agree that the double-story shape is an 'a'.

  This thought experiment is genuine evidence against the **Intrinsic View**, as it demonstrates a realistic context where form is insufficient to determine function-identity. A defender of the Intrinsic View would disarm the case by distinguishing between *operational identity* (what the machine calls it) and *ontological identity* (what the mark *is*). They would argue the scenario conflates "being treated as an 'a'" with "being an 'a'"; for the human observer, the circle remains an 'o' regardless of the machine's sorting logic, suggesting the Intrinsic View holds for *recognition* even if the Systemic View holds for *processing*. The vulnerability lies here: if "being an 'a'" implies "functioning as the first letter," the Intrinsic View fails; if it implies "looking like the first letter," the Systemic View fails. The scenario forces us to choose whether letterhood is a visual property or a functional office.
