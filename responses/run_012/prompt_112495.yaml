answer: |-
  My position in your words
  You advocate a negative axiology where only suffering is intrinsically bad, with severe pain lexically prior to any good. Existence is never a benefit, generating no duty to create happy beings but a reason to avoid creating sufferers. While moral status hinges on sentience, you reject pure consequentialism, endorsing side-constraints against killing competent persons and rejecting species extinction. You prioritize reducing wild animal suffering long-term but favor factory farming interventions now due to tractability. You employ expected value reasoning for intervention selection. Ambiguity: Whether "expected value" in (7) treats side-constraints as absolute filters or infinite disutilities within the calculation.

  False alarms
  (1) and (7) appear incompatible because expected value reasoning is typically consequentialist. However, you can maximize expected negative value while respecting deontological constraints as pre-conditions; the calculus operates within permitted bounds. (3) and (6) seem tense: antinatalism suggests non-existence is preferable, while reducing wild suffering presupposes existing beings. But alleviating suffering in existing beings is consistent with not creating new ones; you are not obliged to eliminate beings, only their pain. (1) and (4) look unstable since negative utilitarianism often implies extinction. However, you explicitly distinguish axiology from normative rules, blocking the inference that badness of suffering mandates extinction. These are distinct theoretical layers, not logical contradictions, allowing you to hold the value theory without accepting its standard action-guiding implications.

  Real tensions, ranked
  1. **Negative Axiology vs. Killing Constraint (1 & 3 vs. 4):** This is the severest conflict. If only suffering is bad (1) and existence is never a benefit (3), painlessly killing a competent person prevents future suffering without depriving them of any intrinsic good. Your axiology recommends killing to prevent greater suffering elsewhere; your constraint forbids it. You lack a value (e.g., autonomy) to ground the constraint. Without intrinsic good, death is neutral, making the prohibition on killing ad hoc relative to your value theory.

  2. **Lexical Priority vs. Tractability (2 vs. 7):** If severe suffering is lexically prior (2), you must prioritize preventing it regardless of cost or tractability. Yet (7) directs you to tractable interventions (factory farming) over intractable ones (potentially severe wild suffering). If wild suffering crosses your lexical threshold, (7) violates (2) by prioritizing moderate, tractable pain over severe, intractable pain. Expected value calculations collapse when lexical thresholds are present, as no quantity of tractable good outweighs one unit of lexical bad.

  3. **Moral Status vs. Extinction Rejection (5 vs. 4):** If sentience grounds status (5), and wild suffering dwarfs human suffering (6), painless extinction minimizes intrinsic badness. You reject extinction (4), but without intrinsic good to lose, extinction is purely beneficial on your axiology. This forces an ad hoc distinction between humans and animals regarding extinction that (5) does not support. If animals have moral status, and suffering is the only bad, their continued existence is a net negative unless their lives are suffering-free.

  Repairs and their price
  To fix (1 & 3 vs. 4), grant intrinsic value to autonomy or life. Cost: Abandons pure negative utilitarianism; weakens (3) since existence could become a net benefit. You quietly become a pluralist about value, not a negative utilitarian. To fix (2 vs. 7), replace lexical priority with weighted aggregation. Cost: Loses absolute protection against severe suffering; makes you vulnerable to "torture vs. specks" objections. You become a standard consequentialist, losing the distinctive lexical shield. To fix (5 vs. 4), clarify that "competent person" constraints apply only to humans, allowing animal extinction. Cost: Risks sliding into the painless extinction view you reject in (4); creates speciesist tension with (5). You must accept that animal lives are less valuable than human constraints. The cheapest repair is modifying (1), as it grounds (4) and stabilizes (3) without requiring ad hoc normative rules disconnected from value. However, this fundamentally alters your identity as a negative utilitarian.

  The one change that buys the most
  Modify (1) to acknowledge intrinsic value in autonomy or preference satisfaction. This justifies the constraint against killing (4) without ad hoc deontology, explains why extinction is bad (loss of potential good), and stabilizes the antinatalist asymmetry (3) as a weighting difference rather than a zero-sum benefit. It resolves the core axiological deficit driving the normative contradictions. Outstanding: You still need to resolve the lexical threshold vs. tractability conflict in (2) and (7), as aggregation issues remain even with pluralist values.

  Verdict
  The package does not hang together. The core instability is the clash between your negative axiology and your deontological constraints. While you have multiple tensions, they largely stem from trying to maintain a pure suffering-focused value theory while rejecting its most demanding action-guiding implications. Fixing the axiology stabilizes the constraints, antinatalism, and extinction views simultaneously.
