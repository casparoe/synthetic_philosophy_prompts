  I think you're accepting the asymbolic's report too literally. When they say "it's pain but I don't mind," they mean "this is the sensation usually caused by damage," not "this is the experience of hurting without the hurt." If you strip the awfulness from pain, you haven't separated two components; you've eliminated the phenomenon. It's like saying you can have a joke that isn't funny but still makes you laugh—the laughter might remain, but the funniness was the core. So I deny your premise: those patients feel a neutral sensation they label "pain" due to its cause, but it lacks the essential property of hurtfulness. If it doesn't hurt, it isn't pain.

  This brings us to your creature and the child. You say "bad" is doing two jobs, but I say you're confusing the harm with the reaction. We stop the child's pain because the sensation is intrinsically bad for them, regardless of their broken attitude. But I want to press you: when you say the creature isn't suffering, are you saying it isn't harmed, or just that it isn't upset? If you admit it's harmed despite not minding, then you've conceded the badness lies in the sensation, not the minding. So which is it? Is the pain bad because it feels awful, or bad because it frustrates a desire? Don't let the child's welfare distract you from the phenomenology.
