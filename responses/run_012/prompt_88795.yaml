answer: |-
  Here are 10 interview questions designed to press the etiological account on concrete biological grounds, including the required follow-ups and "good answer" indicators.

  ### Part 1: The Hard Cases for Etiology (Exaptations, Vestiges, Malfunction)

  **1. (Exaptations) Let's start with male nipples. Physiologically, they can lactate under rare hormonal conditions, but they weren't selected for lactation in males; they're a developmental byproduct of female selection. On your account, do male nipples have a function? If you say "no," doesn't that imply that a trait can be fully integrated into a living system, do useful things, yet be functionally inert?**

  *   **What a good answer needs to accomplish:** He must bite the bullet and say they have *no proper biological function* (even if they have a causal role), or argue they have a different selected effect (e.g., sensory). A bad answer waffles on the definition of "function" or conflates "useful" with "functional." He needs to explain why being a byproduct disqualifies them from having a *teleological* function without denying they exist.

  **2. (Follow-up to Q1: Unknown History) You'll likely say selection history fixes function. But take **sleep**. We know it's vital, but the evolutionary history is contested—was it for energy conservation, brain repair, or predator avoidance? If the selection history is opaque or disputed, does the function become indeterminate? Are we forced to say we don't know what sleep *is* until we agree on why it started?**

  *   **What a good answer needs to accomplish:** He must distinguish between *epistemology* (what we know) and *ontology* (what the function is). A good answer admits we might not *know* the function but insists the function *exists* based on the actual history. If he says "function is relative to our best theory," he's sliding toward the Causal-Role account.

  **3. (Vestigial Traits) Consider **wisdom teeth**. They were selected for in ancestors with larger jaws and tougher diets. Now, they often cause impaction and infection. At what exact point in the lineage did they lose their function? Is it when the jaw size changed, or when the mortality rate from impaction outweighed the benefit? If function is historical, can a trait be "functional" even if it kills the organism today?**

  *   **What a good answer needs to accomplish:** He needs to explain the "time-slice" problem. A good answer will clarify that the function is tied to the *origin* of the trait, not its current utility. He should be willing to say they *had* a function but are now vestigial (or dysfunctional), rather than saying their function changed. If he says the function changed to "causing pain," he's abandoned the etiological view.

  **4. (Follow-up to Q3: Token vs. Type) You'll likely appeal to type-level selection (the trait in the population). But what about a specific individual with a unique mutation that gives them a sixth finger? It wasn't selected for in the species history. Is that token finger functionless, even if it works perfectly for that person? Does your account struggle to assign functions to individual organisms versus population averages?**

  *   **What a good answer needs to accomplish:** He must distinguish between *trait tokens* and *trait types*. A good answer admits that novel mutations in individuals don't have "proper functions" yet until selected. If he tries to assign a function to the individual's unique trait based on current utility, he's borrowing from the Causal-Role account.

  **5. (Malfunction & Normativity) Why is a congenital heart defect a *failure* rather than just a *variation*? On a purely physicalist view, a heart that doesn't pump is just matter moving differently. How does looking at the past explain why the heart *ought* to pump now? How do you get an "ought" from an "was"?**

  *   **What a good answer needs to accomplish:** This is the core normative challenge. He needs to explain how historical success establishes a norm for current performance. A good answer links "failure" to "failing to perform the effect that explains the trait's presence." If he appeals to "health" or "statistical normality" without linking it to selection, he's dodging the philosophical heavy lifting.

  **6. (Follow-up to Q5: Statistical Normality) If 90% of a population suddenly had a heart defect due to a toxin, would the heart's function change? If function is historical, the answer should be "no." But if the norm is statistical, the answer is "yes." Does your account imply that a universal defect is still a defect, even if it's statistically normal?**

  *   **What a good answer needs to accomplish:** He must stand firm that statistical normality does not equal functional normality. A good answer confirms that even if everyone has the defect, it remains a malfunction because it violates the historical standard. If he hedges and says "function is relative to the current environment," he is weakening the etiological claim.

  ### Part 2: Pressure from Causal-Role & Selection Theory

  **7. (Causal-Role Pressure) Take **transposable elements** ("jumping genes"). They copy themselves within the genome. The Causal-Role theorist says their function is "replication within the genome." You might say they are "selfish" and have no function for the *organism*. But if they contribute to the system's capacity to evolve, why isn't that contribution enough for function? Why do we need the history of selection to call it a function?**

  *   **What a good answer needs to accomplish:** He needs to defend the distinction between "what a trait does" and "what it is *for*." A good answer explains that without selection, "function" loses its explanatory power regarding *design* or *adaptation*. If he concedes they have a "system function" but not a "biological function," he needs to clarify why that distinction matters for biology.

  **8. (Dependence on Selection Theory) Your account relies on "selection," but biologists fight about levels of selection. Take **altruistic sterility in bees**. Is the function of the worker's sterility selected at the gene level, the individual level, or the colony level? If the etiological account depends on *what* was selected, and biologists disagree on the level, does the function of the sterility become scientifically indeterminate?**

  *   **What a good answer needs to accomplish:** He needs to show the philosophical account is robust despite biological uncertainty. A good answer argues that *whatever* the correct biological theory turns out to be, the *structure* of the function claim remains the same (i.e., function = effect selected at the relevant unit). If he says "philosophy decides the level of selection," he's overstepping.

  **9. (Metaphilosophical/Pragmatic) Let's zoom out. A Causal-Role theorist might say, "I use 'function' to mean 'current causal contribution,' and that's useful for physiology." You say, "I use 'function' to mean 'selected effect,' and that's useful for evolution." Isn't this debate just about what we want the word *function* to do in our explanations, rather than a discovery about the world?**

  *   **What a good answer needs to accomplish:** He must defend the view that this is metaphysical, not just linguistic. A good answer argues that one account captures the *normativity* of biology (health, disease, design) while the other doesn't. If he says "it's just a choice of tools," he undermines the claim that SE is the *true* account of biological function.

  **10. (Novelty & Engineering) Finally, consider an **artificial heart**. It has a clear function (pumping blood) but zero evolutionary history. The Causal-Role account handles this easily. Do you have to say an artificial heart has no biological function? If so, does that mean your account only applies to natural traits, or do you need a hybrid theory to cover biotechnology?**

  *   **What a good answer needs to accomplish:** This tests the limits of the theory. A good answer either accepts that artificial hearts have "derived functions" (borrowed from the natural heart) or admits SE is strictly for biological traits. If he tries to stretch "selection" to include human design without qualification, he risks making the theory trivial.
