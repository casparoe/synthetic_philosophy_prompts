answer: |-
  This is a sophisticated reconstruction of the tension Susan Wolf identifies in "Moral Saints." You have correctly isolated the friction between the *supremacy* of morality and the *richness* of a human life.

  You asked for a diagnosis that prices the alternatives, specifically focusing on the costs of rejecting (4) versus (7), while respecting your constraint to keep (1) and (2) if possible.

  Here is the pricing of the alternatives.

  ### The Structural Diagnosis
  Before pricing the premises, notice a subtle equivocation in your argument that creates the trap.
  *   **Premise (2)** restricts **Moral Worth**: "The only good relevant to a person's *moral worth* is moral good."
  *   **Premise (1)** governs **Admirability**: "A life is *admirable* to the degree that it realizes the good."
  *   **Premise (4)** bridges them: It assumes that maximizing *moral good* maximizes *admirability*.

  The argument works only if "Moral Worth" and "Admirability" are identical, or if "The Good" in (1) is identical to "Moral Good" in (2). Your friends are circling this, but the precise logical cost lies in how you handle that bridge.

  ---

  ### Option 1: Reject Premise (4)
  **The Claim:** A life that maximizes moral good is *not necessarily* more admirable than a life that trades some moral good for nonmoral excellence.

  **The Commitment:**
  You must adopt a **Hybrid Theory of Value**. You are committing to the view that "Admirability" is a composite function of at least two variables: Moral Worth and Nonmoral Excellence. On this view, Moral Good is *necessary* for a fully admirable life (you cannot be admirable if you are wicked), but it is not *sufficient* for maximal admirability.

  **The Cost (Pricing it):**
  1.  **Loss of Moral Sovereignty:** You must concede that morality is not the sole ruler of the "Best Life." There are rational choices where a person *ought* (all-things-considered) to pursue a hobby or a relationship rather than a moral duty, provided the moral duty is not urgent. This weakens the demandingness of morality.
  2.  **The "Common Measure" Worry:** You asked if this forces you to say admirability has no common measure. **No.** Rejecting (4) does not require incommensurability. It only requires **non-lexicality**.
      *   *Lexical dominance* means 1 unit of Moral Good > 1,000,000 units of Artistic Good. (This is what (4) assumes).
      *   *Non-lexicality* means there is a exchange rate. You can trade a small amount of moral opportunity cost for a large gain in personal excellence. You do not need a single "util" to measure this; you only need a rational principle of trade-off (e.g., "Satisficing" morality: be good enough, then optimize for humanity).

  **The Benefit:**
  This preserves your intuition (7) without making you a moral skeptic. It allows you to keep (1) (Admirability tracks the *Overall* Good) and (2) (Moral Worth tracks *Moral* Good) by admitting they are different metrics. The Saint has maximal Moral Worth, but not maximal Overall Admirability.

  ---

  ### Option 2: Reject Premise (7)
  **The Claim:** Your reluctance is indeed a failure. The Saint's life *is* the most desirable, and our intuition that it is boring or barren is a symptom of moral corruption or psychological limitation.

  **The Commitment:**
  You must adopt a **Transformational Moral Psychology**. You are committing to the view that the reason the Saint seems undesirable is that we currently view duty and desire as opposed. In the truly desirable Saint, this opposition vanishes.

  **The Cost (Pricing it):**
  1.  **The Empirical Burden:** You must argue that a life devoid of nonmoral passions (loving opera *just* because you love it, not because it relieves stress for volunteering) is psychologically coherent and enviable. This is a heavy lift. Most historical examples of "saints" do seem to lack the richness we value in humans.
  2.  **Alienation:** You must explain why the Saint doesn't suffer from alienation. If I love my friend *only* because morality commands it, is that love genuine? To make the Saint desirable, you must argue that moral perfection transforms the agent so deeply that they *naturally* desire what is right (Schiller's "Graceful Soul").

  **The Benefit:**
  This preserves the **Supremacy of Morality**. It keeps the moral universe unified. There is no conflict between "What is best morally?" and "What is best for me?"

  **Addressing your specific question:** *What would it take to make the saint's life genuinely desirable rather than merely admirable?*
  It would require a theory of **Moral Integration**. You would need to show that nonmoral goods (art, love) are either (a) instrumental to moral goods (I paint to uplift spirits) or (b) that the capacity to enjoy them is itself a moral duty (I must rest to serve better). If you cannot integrate them, the Saint remains a "moral monster" of efficiency—admirable like a well-oiled machine, but not desirable as a human.

  ---

  ### Option 3: The Hidden Cost of Keeping (1) and (2)
  You stated you want to keep (1) and (2). However, if you keep them literally, you are forced into Option 1 anyway. Here is why:

  *   If (1) is true ("Admirable... realizes the good"), and you admit nonmoral excellences are *goods* (which (3) admits, it just says they aren't *moral* goods), then "The Good" in (1) must be broader than "Moral Good."
  *   If "The Good" is broader than "Moral Good," then (4) is false, because maximizing *Moral* Good might minimize *Overall* Good.

  Therefore, **rejecting (4) is the cheapest cost** given your constraints. It forces you to distinguish between **Moral Worth** (governed by 2) and **Human Admirability** (governed by 1).

  ### Recommendation
  **Reject (4).**

  **Why?**
  1.  **It respects your constraints:** It allows you to maintain that Moral Worth is special (2) and that Admirability tracks Goodness (1), without conflating the two.
  2.  **It avoids the "Common Measure" trap:** You can argue for a *threshold* view. Moral good is a constraint (you must be above a certain threshold to be admirable), but beyond that threshold, nonmoral excellence determines the *degree* of admirability. This avoids the need for a single currency of value.
  3.  **It diagnoses the error:** The argument's failure is the assumption of **Moral Dominance**. The "Moral Saint" problem arises not because morality is bad, but because it is being asked to do a job (defining the whole of human excellence) that it is not designed to do.

  **The Price You Pay:**
  You must accept that **Morality is not the whole of Rationality.** There will be cases where it is rational to be less than morally maximal. You must be comfortable saying, "It would be morally better to volunteer tonight, but it is a *better life choice* to go to the concert."

  If you reject (7) instead, you pay a much higher price: you must convince your reading group that their deep-seated intuition that a life without personal passions is barren is simply a mistake. That is a harder sell than admitting morality is only one part of the good life.
