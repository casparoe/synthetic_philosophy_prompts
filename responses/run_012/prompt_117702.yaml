answer: |-
  **Verdict on the New Case**
  Your friend will verdict: **Do Not Pay.**

  **The Rules**
  Based on her four previous verdicts, she is operating under the following principles of instrumental rationality:

  1.  **The Causal Leverage Rule:** An action is rational only if it causally influences a future outcome to the agent's benefit. (Derived from Cases 1, 2, and 4).
  2.  **The Sunk Prediction Rule:** Once a benefit has been received based on a past prediction of one's behavior, fulfilling that prediction has no causal value and is therefore irrational. (Derived from Case 3).
  3.  **The Enforcement Condition:** Promises or commitments are binding only if breaking them triggers a causal penalty (e.g., retaliation, reputation loss, or physical inability). (Derived from Cases 1, 2, and 4).
  4.  **The Pre-commitment Exception:** It is rational to restrict one's future freedom (e.g., buy a pill) *if and only if* doing so causally alters another agent's behavior *before* the benefit is conferred. (Derived from Case 4).

  **The Theory**
  She is running **Causal Decision Theory (CDT)**, specifically the "Straightforward Maximizer" variant common in classical game theory and economics.

  *   **Why CDT?**
      *   **Case 1 (Repeated Driver):** CDT agrees with all theories here; future retaliation provides a causal link.
      *   **Case 2 (One-Shot Promise):** CDT dictates defection because there is no causal link between paying and future benefit.
      *   **Case 3 (Benefactor/Resolution):** This is the smoking gun. Theories like Functional Decision Theory (FDT), Timeless Decision Theory (TDT), or Gauthier's "Resolute Choice" argue you *must* pay the £200 to be the *type of agent* who receives the £1,000. By verdicting "Take the £1,000, do not give the £200," she explicitly rejects logical subjunctive dependence. She treats the prediction as a past, fixed event (sunk cost) that her current action cannot causally change. This is the definition of "Two-Boxing."
      *   **Case 4 (Ulysses Pill):** CDT supports buying the pill because the *act of buying* causally influences the driver's decision to carry you. Once carried, the pill causally forces payment. This fits the Causal Leverage Rule perfectly.

  **The Decisive Test Case**
  To cleanly distinguish her Causal Decision Theory from its main rival (Functional Decision Theory), which also fits Cases 1, 2, and 4 but fails on Case 3, you should propose:

  **The Twin Prisoner's Dilemma**

  *   **The Case:** You are placed in a Prisoner's Dilemma against an exact physical and psychological clone of yourself. You cannot communicate. You know your clone thinks exactly like you. If you both Cooperate, you each get £1,000. If you both Defect, you each get £100. If one Cooperates and one Defects, the Defector gets £1,100 and the Cooperator gets £0.
  *   **The Distinction:**
      *   **Her Verdict (CDT):** **Defect.** She will argue that her choice cannot *causally* influence her clone's choice. Since Defecting yields a higher payoff regardless of what the clone does (dominance reasoning), it is the rational choice.
      *   **Rival Verdict (FDT/TDT):** **Cooperate.** They argue that because the clone is identical, your decision *logically determines* the clone's decision. Cooperating leads to the £1,000 outcome; Defecting leads to the £100 outcome.
  *   **Why this case?** Case 3 involved a predictor looking at a *resolution*. The Twin PD removes the element of prediction and time, isolating the core disagreement: does rationality require maximizing based on *causal* consequences (her view) or *logical* correlations (the rival view)?
