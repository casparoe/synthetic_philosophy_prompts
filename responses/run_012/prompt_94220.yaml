answer: |-
  # Diagnostic Decision Tree: The Boundaries of *Pramāṇa*

  **Instructions:** Answer each node based on your intuitive commitment to the case or claim. Follow the branch to the next node or to a terminal position (Leaf).

  1.  **Ontology:** "The list of *pramāṇas* names real natural kinds of cognition, not merely pedagogical groupings."
      *   **No:** → **Leaf 1: Deflationary Taxonomy**
      *   **Yes:** → Go to 2.

  2.  **Truth Condition:** "A *pramāṇa* must guarantee truth (*yathārtha*); reliability alone is insufficient."
      *   **No:** → **Leaf 2: Causal Reliabilism**
      *   **Yes:** → Go to 3.

  3.  **Novelty:** "A source must yield *new* knowledge (*anadhigata*); memory is excluded."
      *   **No:** → **Leaf 3: Memory-Inclusive** (Unoccupied: Unattractive; collapses distinction between acquisition and retention).
      *   **Yes:** → Go to 4.

  4.  **Perception's Scope:** "Perception yields propositional knowledge (e.g., 'This is a pot'), not merely non-conceptual raw data."
      *   **No:** → **Leaf 4: All-as-Inference** (Conceptualization is inferential; perception is pre-cognitive).
      *   **Yes:** → Go to 5.

  5.  **Inference Distinctness:** "Inferring fire from smoke is a source distinct from perception."
      *   **No:** → **Leaf 5: Perception-Only**
      *   **Yes:** → Go to 6.

  6.  **Testimony (Bridge Case):** "Believing a stranger's report ('the bridge is out') without evidence is distinct from inference."
      *   **No:** → **Leaf 6: Perception + Inference** (Testimony reduced to inference about speaker reliability).
      *   **Yes:** → Go to 7.

  7.  **Testimony (Speaker):** "Testimony requires a competent speaker; impersonal text/data cannot testify."
      *   **No:** → **Leaf 7: Impersonal Testimony** (Accommodates AI/Corpus retrieval).
      *   **Yes:** → Go to 8.

  8.  **Comparison (*Upamāna*):** "Identifying a *gavaya* from 'like a cow' is distinct from perception and inference."
      *   **No:** → **Leaf 8: The Three-Source List** (Perception, Inference, Testimony).
      *   **Yes:** → Go to 9.

  9.  **Postulation (*Arthāpatti*):** "Explaining the stout/day-fasting man via night-eating is distinct from inference."
      *   **No:** → **Leaf 9: The Four-Source List** (+ Comparison).
      *   **Yes:** → Go to 10.

  10. **Absence (*Abhāva*):** "Knowing 'no elephant is here' is distinct from inferring absence from non-perception."
      *   **No:** → **Leaf 10: The Five-Source List** (+ Postulation).
      *   **Yes:** → Go to 11.

  11. **Instrument Reliability:** "An instrument reading counts as knowledge even if the user cannot assess its reliability."
      *   **No:** → **Leaf 11: The Six-Source List** (+ Absence; Instrument requires assessment).
      *   **Yes:** → **Leaf 12: Unassessed Instrument** (Instrument reading counts without user assessment).

  ***

  ## Terminal Positions (Leaves)

  1.  **Deflationary Taxonomy:** The taxonomy is an artifact of pedagogy, not metaphysics.
      *   *Awkward Commitment:* There is no fact of the matter about how we know.
      *   *School:* Contemporary Pragmatism.
  2.  **Causal Reliabilism:** Sources are valid if reliably causal, even if fallible.
      *   *Awkward Commitment:* A *pramāṇa* can produce false cognition and remain a *pramāṇa*.
      *   *School:* Naturalized Epistemology.
  3.  **Memory-Inclusive:** Memory is a source; novelty is not required.
      *   *Awkward Commitment:* Recalling a known truth is the same epistemic act as learning it.
      *   *School:* Unoccupied (Diagnosed: Unattractive).
  4.  **All-as-Inference:** Only inference yields propositional knowledge; perception is pre-linguistic.
      *   *Awkward Commitment:* One cannot *know* what one sees until one infers it.
      *   *School:* Dignāga/Dharmakīrti (Buddhism).
  5.  **Perception-Only:** Only perception is a source; inference is hypothetical.
      *   *Awkward Commitment:* We do not know there is fire when we see smoke.
      *   *School:* Cārvāka.
  6.  **Perception + Inference:** Testimony is inference about the speaker's reliability.
      *   *Awkward Commitment:* Trusting a parent's warning is reasoning, not trust.
      *   *School:* Early Nyāya / Buddhism (reductionist).
  7.  **Impersonal Testimony:** Testimony exists without a speaker (e.g., AI, Vedas).
      *   *Awkward Commitment:* Words carry meaning without intent.
      *   *School:* Contemporary AI Epistemology / Mīmāṃsā (Vedas).
  8.  **The Three-Source List:** Admits Testimony (Speaker), rejects Comparison.
      *   *Awkward Commitment:* Learning "gavaya" is just inference, not a unique linguistic event.
      *   *School:* Standard Nyāya.
  9.  **The Four-Source List:** Admits Comparison, rejects Postulation.
      *   *Awkward Commitment:* Night-eating is inferred, but *gavaya*-naming is not.
      *   *School:* Prābhākara Mīmāṃsā.
  10. **The Five-Source List:** Admits Postulation, rejects Absence.
      *   *Awkward Commitment:* Absence is perceived or inferred, but postulation is sui generis.
      *   *School:* Kumārila Mīmāṃsā.
  11. **The Six-Source List:** Admits Absence; Instruments require assessment.
      *   *Awkward Commitment:* Non-existence is a positive object of knowledge.
      *   *School:* Later Nyāya / Advaita Vedānta.
  12. **Unassessed Instrument:** Instruments yield knowledge without user assessment.
      *   *Awkward Commitment:* A broken thermometer yields knowledge if the user trusts it blindly.
      *   *School:* Externalism (Contemporary).

  ***

  ## Diagnostic Notes

  **Empty Slots & Incoherence:**
  *   **Postulation without Inference:** Incoherent. *Arthāpatti* relies on the logical exclusion of alternatives; rejecting inference undermines the mechanism of postulation.
  *   **Absence without Perception:** Incoherent. *Abhāva* typically relies on the perception of a locus (the courtyard) to establish the absence of the object (the elephant).
  *   **Testimony (Speaker) without Inference:** Unexplored/Unattractive. If one accepts testimony as distinct, one usually accepts inference as distinct, as testimony often relies on inferential structures to be understood.

  **Unseparated Leaves:**
  *   **Leaf 8 (3-Source) vs. Leaf 6 (P+I):** The tree separates these by Node 6 (Testimony Distinctness). However, if a school accepts Testimony but defines it narrowly (e.g., only Vedas), it may functionally resemble Leaf 6 regarding human speech. To separate them fully, ask: *"Is human testimony distinct from inference?"*
  *   **Leaf 11 (6-Source) vs. Leaf 12 (Unassessed Instrument):** Both accept the classical six. They differ only on the external instrument case. If the seminar focuses strictly on classical *pramāṇas*, these collapse. To separate, ask: *"Does a *pramāṇa* require the agent to know the source is reliable?"*

  **Contemporary Cases Placement:**
  *   **(a) AI/LLM Retrieval:** Placed at **Leaf 7**. The system retrieves sentences (testimony-like) from a corpus with no single competent speaker. If you reject this as knowledge, you branch to Leaf 8.
  *   **(b) Unassessed Instrument:** Placed at **Leaf 12**. If you require the reader to assess the instrument's reliability for it to count as a *pramāṇa*, you branch to Leaf 11.

  **Seminar Question:**
  Does the existence of Leaf 7 (Impersonal Testimony) and Leaf 12 (Unassessed Instrument) suggest the classical inventory is *open*, or merely that the definitions of the classical sources were *under-specified*?
