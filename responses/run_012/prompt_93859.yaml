prompt: |-
  My partner started a physics PhD this year and ever since, we have the exact same fight about the block universe like once a week and neither of us has moved an inch. The shape of it: she says special relativity already settles it — it's the Rietdijk–Putnam thing, two observers moving relative to each other, an event in Andromeda that's in my future is simultaneous with her here-and-now, and if simultaneity is all there is to now, then that event is just as real as this sentence, so the block wins and becoming is an illusion. I say that's a non sequitur, because now is an indexical and the argument needs a frame-independent present just to get off the ground, which is the one thing relativity takes away. Then she says I'm just redescribing the block, I say she's just redescribing indexicality, and we go to bed annoyed. Ive also read people who say relativity only rules out a present that's a whole simultaneity slice, not a present that's a single point-event, a here-now, and I can't tell if that's a real option or a dodge.

  What I want from you is a diagnosis, not a verdict. Is this a verbal fight about whether real/exists is tensed, a substantive one about whether the argument is valid, two people answering different questions (hers about the geometry of spacetime, mine about the semantics of tense), or is some hidden empirical or formal question doing the work? And here's a suspicion I'd like you to test rather than assume: that the real impasse is one level up, about whether a physics theory can ever rule out a metaphysics at all, the same way people argue about whether thermodynamics rules out Maxwell's demon. Use what each side actually says, and then tell me honestly what would count as progress here — some distinction, a formal result, a change of question — or whether nothing should be expected to move it.
