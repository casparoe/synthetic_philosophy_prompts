  9.  **Final Review against Constraints:**
      *   90 minutes? Yes, the steps are timed.
      *   One page? The output is one page, the procedure generates it.
      *   Sort the objections? Yes.
      *   Three cases? Yes.
      *   Limitations? Yes.
