  8.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the reality. No jargon.
      *   *The Protocol:* Step-by-step.
      *   *Conflict of Interest:* Address the "designer" issue first.
      *   *The Three Cases:* Apply the protocol rigorously.
      *   *Argument Sorting:* Categorize the 7 quotes.
      *   *Limitations:* What the procedure can't solve.

      *(Self-Correction during drafting)*: I initially thought about suggesting a Net Present Value calculation. But 90 minutes isn't enough for a full NPV model on fresh data. It needs to be a "Remaining Benefit vs. Remaining Cost + Exit Penalty" comparison.
      *Correction:* Make sure to distinguish between *hard* exit costs (cash) and *soft* exit costs (reputation). Hard costs go in the math; soft costs go in the "Board Values" section.

      *(Refining the Hospital Case)*: The prompt says "public would riot." The procedure might say "Stop." I need to write the argument for stopping in a way that is defensible publicly, even if the board ignores it. Focus on *lives saved per dollar*.

