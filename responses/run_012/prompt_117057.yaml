  10. **Final Polish:** Ensure the distinction between "Sunk Cost" and "Exit Penalty" is crystal clear. That is the key insight for this user. Sunk cost is ignored; Exit Penalty is a future cost and must be counted.

  *(Self-Correction on the Hospital Case)*: The prompt says "same 70 million would build an outpatient clinic." This is an *opportunity cost*. Standard CBA often ignores opportunity cost of capital if the budget is siloed. I need to make sure the procedure forces the analyst to ask: "Is this capital fungible?" If yes, the clinic counts. If no (restricted funds), it doesn't. I will assume fungibility for the sake of the "hard case" but note the restriction.

  *(Self-Correction on the "Who Runs It" section)*: The prompt asks "who ought to be running the review, given that the person running it is often the person who wanted the project." I need to be direct. It *shouldn't* be the same person. If it must be, there must be a red-team review.

  Let's assemble the document.

  *Structure:*
  1. Protocol Header.
  2. The Conflict of Interest Rule.
  3. The 90-Minute Triage (Steps 1-5).
  4. The Decision Matrix.
  5. Application to Three Cases.
  6. Sorting the Board's Arguments.
  7. Limitations & Hand-offs.

  *Voice:* Chief of Staff / Senior Analyst. Direct, unvarnished.

  *Key Insight to embed:* The "Sunk Cost" fallacy is only a fallacy if there are no *consequences* to stopping. There are always consequences (contractual, political, physical). The procedure must quantify the consequences of stopping, not the costs of starting.

