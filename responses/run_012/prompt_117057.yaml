answer: |-
  # THE 90-MINUTE TRIAGE PROTOCOL
  **For:** Capital-Program Analysis Desk
  **Subject:** Project Continuation Review (Over-Budget/Behind-Schedule)
  **Constraint:** 90 Minutes Per Project

  ## 1. THE CONFLICT RULE (Minute 0)
  **Who runs the review:** Never the person who designed or championed the project during its initiation phase. Cognitive bias cannot be proceduralized away.
  **Procedure:** If you are the analyst and you designed the project, you recuse yourself from the recommendation. You prepare the data packet only. An independent analyst from a different division (e.g., Audit or Planning) must run the Triage and sign the recommendation.
  **If recusal is impossible (staffing shortage):** You must mark the recommendation "Contested: Originator Analyst" and the Board must be notified orally at the start of the session. This does not invalidate the math, but it invalidates the neutrality.

  ## 2. THE TRIAGE SEQUENCE (Minutes 1–90)

  ### Step 1: The Data Sanity Check (15 Minutes)
  *Goal: Determine if the numbers are usable or propaganda.*
  *   **Q1:** Do the remaining cost estimates come from a contractor bound by a guaranteed maximum price (GMP), or are they "estimates"?
      *   *If GMP:* Accept the number.
      *   *If Estimate:* Apply a 1.25 contingency multiplier to the remaining cost immediately.
  *   **Q2:** Has the benefit metric (ridership, traffic flow, safety) been re-validated in the last 12 months?
      *   *If No:* Flag as "High Uncertainty." Reduce projected benefit by 20% for the calculation.
      *   *If Yes:* Accept the number.
  *   **Q3:** Are the "Stopping Costs" (clawbacks, demolition, legal settlements) documented in contract exhibits or are they verbal estimates?
      *   *If Verbal:* Flag as "Unquantified Liability."

  ### Step 2: The Economic Floor (30 Minutes)
  *Goal: Calculate the Net Value of Completion vs. Abandonment.*
  *   **Calculation A (Finish):** `Remaining Benefit - Remaining Cost`
  *   **Calculation B (Stop):** `0 - Stopping Costs` (Note: Stopping Costs are negative values).
  *   **Comparison:** Is A > B?
      *   *If Yes:* Economics favor completion.
      *   *If No:* Economics favor abandonment.
  *   **The Opportunity Test:** Is the capital fungible? If we stop, does the money disappear, or can it be redeployed?
      *   *If Redeployable:* Add the value of the *next best alternative project* to Calculation B.
      *   *If Siloed (Use-it-or-lose-it):* Ignore alternative value.

  ### Step 3: The Liability Audit (15 Minutes)
  *Goal: Identify non-monetary triggers that force a decision.*
  *   **Q1:** Does stopping create an immediate public safety hazard? (e.g., open excavation, unstable structure).
      *   *If Yes:* Stopping Cost increases by the cost of permanent remediation.
  *   **Q2:** Does stopping trigger a default on federal funding for *other* projects?
      *   *If Yes:* Add penalty to Stopping Cost.
  *   **Q3:** Is there a legal mandate (court order, consent decree) requiring completion?
      *   *If Yes:* Recommendation defaults to "Continue" regardless of economics.

  ### Step 4: The Credibility Assessment (20 Minutes)
  *Goal: Quantify the political/strategic cost.*
  *   **Q1:** Is this a joint venture with external partners (cities, private developers)?
      *   *If Yes:* Will abandonment legally or practically preclude future partnerships? (Get General Counsel's opinion, not Project Sponsor's).
  *   **Q2:** Is the cost overrun due to scope creep (our fault) or external market forces (inflation/geology)?
      *   *If Our Fault:* Credibility cost is High.
      *   *If External:* Credibility cost is Low.

  ### Step 5: The Recommendation Logic (10 Minutes)
  *   **Recommend CANCEL if:**
      1.  (Economic Floor: Stop) is significantly better than (Finish) **AND**
      2.  No Safety Hazard exists **AND**
      3.  No Legal Mandate exists.
  *   **Recommend CONTINUE if:**
      1.  (Economic Floor: Finish) is better than (Stop) **OR**
      2.  Stopping Costs (cash + safety) exceed the Remaining Cost.
  *   **Recommend BOARD DECISION (No Recommendation) if:**
      1.  The math favors Stop, but the "Credibility Assessment" suggests catastrophic political fallout.
      2.  The math favors Continue, but the "Opportunity Test" shows a vastly superior alternative use of funds (e.g., Hospital Case).
      3.  *This is where you hand the values to the Board.*

  ---

  ## 3. APPLICATION TO CASES

  ### Case 1: The Interchange Rebuild
  *   **Data:** Spent $610M (Est $480M). Remain $390M. Benefit $340M. Stop Cost $120M ($85M fed + $35M site).
  *   **Step 1 (Sanity):** Remaining cost is likely an estimate. Apply 1.25 multiplier -> $487.5M. Benefit reduced 20% -> $272M.
  *   **Step 2 (Econ Floor):**
      *   Finish: $272M - $487.5M = **-$215.5M** (Net Loss).
      *   Stop: 0 - $120M = **-$120M** (Net Loss).
      *   *Raw Math:* Stopping loses less money.
  *   **Step 3 (Liability):** Site restoration is a safety/liability issue. Included in Stop Cost.
  *   **Step 4 (Credibility):** Major infrastructure. Abandonment signals incompetence.
  *   **Step 5 (Verdict):** **CONTINUE.**
      *   *Reasoning:* While the project is economically negative either way, the *marginal* loss of finishing ($215M) is not sufficiently distinct from the *immediate* loss of stopping ($120M) to justify the political capital destruction of a half-built interchange. The "Exit Penalty" is too high.
      *   *Defense:* "We are not validating the past spend. We are minimizing future loss. Stopping locks in a $120M loss immediately with zero asset. Finishing risks more, but delivers a functional asset that may generate value beyond the current model."

  ### Case 2: The Commuter Rail Extension
  *   **Data:** Spent $310M (20%). Remain $880M. Benefit Collapsed. Stop Cost $25M.
  *   **Step 1 (Sanity):** Ridership forecasts collapsed. Benefit is near zero. Remaining cost is high.
  *   **Step 2 (Econ Floor):**
      *   Finish: $0 (or negligible) - $880M = **-$880M**.
      *   Stop: 0 - $25M = **-$25M**.
      *   *Opportunity:* Funds are likely federal/transit specific (Siloed). If fungible, value of alternative is high.
  *   **Step 3 (Liability):** Mothballing covers safety. No immediate hazard.
  *   **Step 4 (Credibility):** Bus line exists. Partners are likely state/federal transit agencies, less sensitive than local cities.
  *   **Step 5 (Verdict):** **CANCEL.**
      *   *Reasoning:* The Economic Floor is unambiguous. The Exit Penalty ($25M) is trivial compared to Remaining Cost ($880M).
      *   *Board Resistance:* They will refuse. Your memo must state: "Every dollar spent here is a dollar not spent on maintenance or high-demand corridors. This is a $880M donation to a project with no users."

  ### Case 3: The Hospital Seismic Retrofit
  *   **Data:** Spent $180M (75%). Remain $70M. Benefit: Superseded Standard. Alt: Clinic (Same $70M, Higher Life Savings). Stop Cost $15M.
  *   **Step 1 (Sanity):** Benefit is "safety standard." Hard to monetize.
  *   **Step 2 (Econ Floor):**
      *   Finish: Safety Standard Met - $70M.
      *   Stop: $15M loss + Unretrofitted Building.
      *   *Opportunity:* $70M builds Clinic (Higher Life Savings).
  *   **Step 3 (Liability):** Half-retrofitted building. Is it safe to occupy? If yes, Stop Cost is low. If no, Stop Cost rises.
  *   **Step 4 (Credibility):** Public will riot. "Safety" is emotionally non-fungible.
  *   **Step 5 (Verdict):** **BOARD DECISION (Lean CANCEL).**
      *   *Reasoning:* This is the trap. The math says build the clinic (more lives saved per dollar). The politics say finish the retrofit (visible commitment).
      *   *Public Hearing Argument:* "We are not abandoning safety. We are maximizing it. The current retrofit saves X lives for $70M. The clinic saves 3X lives for $70M. The half-built structure will be secured for $15M. We are choosing the path that saves the most citizens, not the path that looks like we finished what we started. To finish the retrofit is to choose symbolism over survival."

  ---

  ## 4. SORTING THE BOARD'S ARGUMENTS

  | Argument | Classification | Analyst Action |
  | :--- | :--- | :--- |
  | *"We've come too far to stop now."* | **Irrelevant** | Ignore. This is pure sunk cost. |
  | *"Walking away means repaying ninety million..."* | **Genuine** | Include in Step 2 (Stopping Costs). This is a real cash flow. |
  | *"The last third is cheaper than the first third..."* | **Warning** | Verify in Step 1. Often false (integration costs rise at end). Apply contingency multiplier. |
  | *"It's ninety percent finished; stopping now would be madness."* | **Irrelevant** | Ignore. 90% finished with 200% budget overrun is the same as 10% finished. |
  | *"If we pull out, partner cities will never co-fund..."* | **Genuine** | Include in Step 4 (Credibility). Quantify the loss of future leverage. |
  | *"We've already spent double... assume remainder will double."* | **Warning** | Use in Step 1 (Sanity). If the estimator has a track record of 50% variance, adjust the remaining cost estimate upward. |
  | *"If we wouldn't start this today, we shouldn't finish it."* | **Genuine** | This is the core Economic Floor test (Step 2). If NPV < 0 today, kill it. |

  **The Textbook Correction:**
  The textbook says "Sunk costs are irrelevant." The Board argues "Stopping triggers costs."
  **Truth:** The textbook is right about the *past* spend. The Board is right about the *future* cost of stopping.
  **Procedure:** Ignore the $610M spent on the Interchange. Count the $120M required to clean up the mess if you stop. That is not a sunk cost; it is a future liability.

  ---

  ## 5. LIMITATIONS & HAND-OFFS

  **Where the Procedure Misfires:**
  1.  **The "Zombie" Project:** If a project has negative economic value but high employment value (keeping a local contractor alive), this procedure will recommend CANCEL. The Board may vote CONTINUE for labor policy reasons. You cannot model this; you must flag it as "Social Policy Override."
  2.  **The "Black Box" Estimate:** If the remaining cost comes from a single source with no GMP and no independent validation, Step 1 fails. You must recommend "Rescope" (pause for independent estimate) rather than Continue/Cancel.
  3.  **The "Life Safety" Trap:** In the Hospital case, the procedure treats lives as fungible units (Clinic vs. Retrofit). The public treats *specific* lives (those in the hospital) as sacred and *potential* lives (clinic patients) as abstract. The math works; the politics do not.

  **Where You Hand Off to Values:**
  You are an analyst, not a politician. You must hand the matter to the Board when:
  1.  **Reputation vs. Cash:** The math says Cancel, but the credibility cost (Step 4) is existential for the agency.
  2.  **Fungibility of Capital:** If the $70M for the Hospital *cannot* legally be moved to the Clinic, the Opportunity Test fails. You must tell the Board: "The money is trapped. The choice is Retrofit or Nothing."
  3.  **Originator Bias:** If you designed the project, you hand off the *entire* recommendation. You provide the data; a peer provides the verdict.

  **Final Instruction:**
  Your recommendation is not "What I would do." It is "What the numbers say, adjusted for known liabilities." If the Board votes against the numbers, that is their prerogative. If you massage the numbers to match their likely vote, that is your failure. Produce the arithmetic. Let them own the politics.
