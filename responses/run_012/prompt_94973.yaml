answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Grant-Making Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Cycle Allocation Decision and Framework for High-Variance Proposals

  **Executive Summary**

  This memo recommends that the Foundation maintain its historical allocation across the four core programs (Scholarships, Vaccination Logistics, Legal Aid, Archive Digitization) for the coming cycle, declining the proposal to allocate two-thirds of capital to the proposed international institution project.

  Simultaneously, it proposes the adoption of a standing "Verifiability and Reversibility" policy for future high-variance grants. This policy replaces arbitrary probability thresholds with requirements for intermediate milestones and bounded downside risk. This framework is subject to review in five years or upon the emergence of new methodologies for long-term impact estimation.

  **Context and Tension**

  At the last meeting, the Committee considered a proposal to prioritize a single intervention with a low probability of success (estimated at $10^{-7}$) but an astronomical estimated impact ($10^{12}$ multiplier). The argument rests on Expected Value (EV) maximization: mathematically, the potential upside dwarfs the certain value of our current portfolio.

  Opposing views suggested hard stopping rules: a probability floor (no bets below 1 in 1,000) or a verifiability requirement (outcomes measurable within 50 years).

  While the EV calculation is formally correct *if* the input variables are reliable, this memo argues that relying on it for this specific proposal exposes the Foundation to unacceptable epistemic and existential risks. We decline the proposal not because the math is wrong, but because the inputs are beyond our capacity to validate, and the downside risk violates our fiduciary duty to preserve the Foundation's capacity to do good.

  **Reasoning on the Allocation Decision**

  **1. The Epistemic Limit of Extreme Probabilities**
  The proponent's argument relies on the precision of the probability estimate (1 in 10 million). In domains like vaccination logistics or legal aid, we derive probabilities from historical data and controlled trials. For a novel international institution intended to steer centuries of civilizational trajectory, no such reference class exists.

  A probability estimate of $10^{-7}$ in this context is not a statistical frequency; it is a subjective confidence interval masquerading as a number. When estimates rely entirely on untested theoretical models, the margin of error on the probability itself likely exceeds the estimate. If the true probability is one order of magnitude lower, or if the "success" condition is ill-defined, the EV collapses. We cannot treat a guess as a variable in a multiplication problem when the guess is the weakest link in the chain.

  **2. Asymmetry of Downside Risk**
  The EV argument presented focuses on the upside multiplier. However, the proposal concedes a 1% chance of entrenching an authoritarian order. Unlike a financial loss, which is recoverable, political entrenchment may be irreversible.

  In decision theory, when one outcome involves "ruin" (the permanent loss of the ability to pursue future value), standard EV maximization fails. If the negative value of an authoritarian centuries-long trajectory is effectively infinite, then $0.01 \times -\infty$ renders the bet unacceptable regardless of the upside. Even if one rejects infinite negative value, the asymmetry is stark: our current programs offer guaranteed, bounded good. The proposal offers a tiny chance of massive good and a small chance of massive harm. Preserving the Foundation's ability to operate in a free society is a prerequisite for all future grant-making.

  **3. Institutional Mission and Capacity**
  The Foundation exists to deploy capital effectively within a five-year evaluation horizon. This constraint is not a bug; it is a feature that enforces discipline. Shifting 66% of our capital to a project evaluable only over centuries effectively dissolves the Committee's oversight capacity. We would be transferring decision-making authority from this Board to the architects of the proposed institution, without the ability to verify performance. This violates our fiduciary duty to steward the endowment for active, accountable philanthropy.

  **Standing Policy: Verifiability and Reversibility**

  Trustee A proposed a probability floor (1 in 1,000). While administratively simple, this is arbitrary. As noted in discussion, there is no principled difference between 1 in 1,000 and 1 in 100,000 that justifies a hard cliff. A rule that shields us from difficult arguments by fiat is intellectually dishonest.

  Trustee B proposed a verifiability standard. This is the stronger operational constraint. Therefore, the Committee recommends adopting a **Verifiability and Reversibility Standard** for any single grant exceeding 10% of the annual budget:

  1.  **Intermediate Falsifiability:** The project must define specific, observable milestones achievable within 10 years that would indicate the project is *off track*. We do not require proof of success within 10 years, but we require the ability to detect failure. If a project cannot be shown to be failing within a decade, it cannot be funded at scale.
  2.  **Bounded Downside:** The proposal must demonstrate that the worst-case scenario does not involve irreversible systemic harm (e.g., political entrenchment, ecological collapse) that would preclude other philanthropic efforts.
  3.  **Exit Mechanism:** There must be a predefined trigger for ceasing funding that does not rely solely on the grantee's self-reporting.

  **Review and Revisitation**

  This policy is not permanent dogma. It should be revisited under the following conditions:

  *   **Evidence:** If the field of long-term impact estimation develops validated methodologies for assigning probabilities to civilizational-scale interventions (e.g., through successful prediction markets or completed long-term historical analogs).
  *   **Time:** This policy shall be reviewed every five years as part of the strategic planning cycle.
  *   **Endowment Shift:** If the Foundation's endowment grows by an order of magnitude, allowing us to absorb total loss of the "risk tranche" without impacting core operations, the Bounded Downside clause may be relaxed.

  **Invitation to Dissent**

  This recommendation asks the Proponent to accept that their probability estimates are currently unverifiable and that the downside risk is too high. It asks the Chair (and those sympathetic to pure EV reasoning) to accept that institutional constraints and epistemic humility are valid multipliers that reduce the effective EV of astronomical bets.

  If a Trustee believes this memo errs, the objection should not be that "1 in 10 million is good enough." The objection must address one of the following:
  1.  **Epistemology:** Provide a mechanism by which we can validate a $10^{-7}$ probability estimate to a standard comparable to our medical or legal grants.
  2.  **Downside:** Demonstrate concretely why the 1% authoritarian risk is reversible or manageable.
  3.  **Mission:** Argue why the Foundation should transition from a grant-making body to a long-term civilizational venture fund, and what governance structure would support that shift.

  **Action Required**

  Vote to approve the allocation maintaining the four core programs and to adopt the Verifiability and Reversibility Standard as the Committee's governing policy for high-variance proposals.

  ***

  **Chair's Note:** I recognize this decision leaves significant potential value on the table *if* the Proponent's numbers hold. However, a foundation that bets its capacity on unverifiable numbers ceases to be a foundation. We must earn the right to make bigger bets by proving we can measure the smaller ones.
