      *   *Interpretation:* The Chair personally leans toward the EV argument (or at least finds the counter-arguments shaky). The Chair wants the *Memo* to recommend the *conservative* path (against the bet) but do so using strong reasoning that challenges the Chair's own intuition. The Memo is the tool to force the Committee (and the Chair) to confront the weaknesses of the EV approach. So, the Memo recommends *rejecting* the 2/3 shift.
