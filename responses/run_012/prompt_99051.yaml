prompt: |-
  I write about mathematics and the physical sciences for a general-interest magazine, and the same problem keeps surfacing in my drafts. A source announces that some new object has been discovered — a manifold, a class of numbers, a space with properties nobody expected — and my prose has to decide, sentence by sentence, whether to treat it as something that was already there waiting to be found, as something a community invented, or as a convenient piece of machinery that earns its keep without anyone claiming it is real. My editors do not care about the metaphysics. They care that we do not smuggle a philosophical position into a reported piece, where it can be attacked in the letters column, and that the story still tells readers what actually happened. I do this most weeks, under deadline, and I cannot call a philosopher every time.

  Please build me a decision procedure I can run on a draft in about ten minutes, with no philosophical training beyond what I have picked up on the beat. For each existence claim in the piece, it should tell me which of a small number of framings my prose is licensed to use and what I must check before using it. Give me the questions in the order I should ask them, what counts as an adequate answer to each, the point at which the procedure stops and returns a definite framing, and the point at which it stops and hands the decision to me or my editor because what remains is a matter of philosophical taste rather than reporting. Draw on what the actual literature on mathematical existence has to say — the indispensability argument, the difficulty of explaining how we could have epistemic access to abstract objects, fictionalist and structuralist alternatives — but translate it into questions a reporter can answer about a specific sentence in a specific draft. In particular, I want the procedure to separate two things I suspect I have been conflating: whether the mathematics is indispensable to the scientific result I am reporting, and whether it is indispensable only to the way my source chose to explain that result. Where the procedure rests on a contested premise, mark it as contested and say what follows for the story if the premise is wrong.

  Then run it on three cases and show me the framing each one yields. First, a physicist reports that a theory works only when formulated in a space of many more dimensions than we observe; the extra dimensions are never measured, and the theory's predictions match experiment to high precision. Second, a mathematician announces a proof that some object must exist, where the object is characterized entirely by the role it plays in a structure, so that no one can say which of several candidate objects it is. Third, a case of your own choosing where the procedure returns an answer I will not like — most likely that a sentence I am attached to must be rewritten in a way that makes the story duller or less quotable — and tell me what I should do about it.

  Finally, tell me what the procedure cannot do. I do not want it to pretend to settle whether mathematical objects exist; I want it to settle what my sentences commit me to, and to make that commitment visible to me and to my editor before we publish. Flag the places where it will misfire — for instance, where an object is introduced by stipulation and the discovery-versus-invention distinction is empty, or where the framing that is safest for the prose is also the least informative for the reader — and say how I should handle those cases.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Science/math writer for a general-interest magazine.
      *   **Problem:** Struggles with ontological framing (discovery vs. invention vs. instrumentalism) in drafts. Editors want to avoid philosophical controversy but maintain accuracy.
      *   **Task:** Create a 10-minute decision procedure for existence claims in drafts.
      *   **Requirements:**
          *   Small number of framings.
          *   Questions in order.
          *   Criteria for adequate answers.
          *   Stop points (definite framing vs. editorial/philosophical judgment).
          *   Draw on literature (indispensability, epistemic access, fictionalism, structuralism) but translate to reporter questions.
          *   Distinguish: Indispensable to *result* vs. indispensable to *explanation*.
          *   Mark contested premises.
          *   Run on three cases (Physicist/Dimensions, Mathematician/Structural Object, Unpleasant Case).
          *   Explain limitations (what it can't do, where it misfires).

  2.  **Deconstruct the Ontological Options (The "Framings"):**
      *   *Platonist/Realist:* It was there, we found it. (Language: "discovered," "exists," "is.")
      *   *Constructivist/Invention:* We made it to solve a problem. (Language: "constructed," "defined," "introduced.")
      *   *Instrumentalist/Fictionalist:* It's a tool that works, don't ask if it's real. (Language: "models," "predicts," "acts as if.")
      *   *Structuralist:* It exists only as a position in a pattern. (Language: "plays the role of," "is determined by.")

  3.  **Develop the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Filter sentences based on empirical evidence and scientific consensus, avoiding deep metaphysics.
      *   *Step 1: Empirical Traceability.* Can we measure it directly?
      *   *Step 2: Indispensability to Prediction.* Does the math *do* the work, or just describe the work? (Quine-Putnam Indispensability Argument translation).
      *   *Step 3: Uniqueness/Rigidity.* Is the object unique or one of many equivalent options? (Structuralism vs. Realism).
      *   *Step 4: Source Consensus.* Do the practitioners talk like it's real or like it's a tool? (Sociological check).

      *Refining the Steps for a Reporter:*
      *   Q1: Is it observable? (If yes -> Realist framing safe).
      *   Q2: If not observable, does removing it break the *predictions* or just the *story*? (Indispensability check).
      *   Q3: Is the object unique or interchangeable? (Structuralist check).
      *   Q4: How do the sources talk? (Community consensus).

      *Stopping Rules:*
      *   If Q1 Yes -> "Real/Found."
      *   If Q2 Breaks Predictions -> "Real/Found" (with caveat).
      *   If Q2 Breaks Story Only -> "Tool/Invented."
      *   If Q3 Interchangeable -> "Structural/Role."
      *   If Ambiguous -> Flag for Editor.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   Need to make sure it distinguishes between "indispensable to result" vs "indispensable to explanation." This is crucial.
      *   Need to mark contested premises. The Quine-Putnam argument is contested.
      *   Time limit: 10 minutes. Questions must be punchy.

  5.  **Developing the Three Cases:**
      *   *Case 1: Extra Dimensions (String Theory/Kaluza-Klein).*
          *   Observable? No.
          *   Indispensable to prediction? Yes (theory fails without them).
          *   Indispensable to explanation? Yes.
          *   Framing: Instrumentalist/Conditional Realist. (Don't say "discovered dimensions," say "theory requires dimensions").
      *   *Case 2: Structural Mathematical Object (e.g., "The" group with property X, but many isomorphic copies).*
          *   Observable? No.
          *   Indispensable? Yes, to the proof.
          *   Unique? No (isomorphic).
          *   Framing: Structuralist. ("Occupies a position," not "found a specific thing").
      *   *Case 3: The "Unpleasant" Case.*
          *   Need something where the safe framing kills the narrative.
          *   Idea: A beautiful, quotable "Eureka!" moment about an abstract object that is actually just a convenient definition.
          *   Example: Renormalization in QFT or a specific coordinate system treated as a physical discovery. Let's go with a specific *coordinate singularity* treated as a physical object (like a black hole horizon in early days, or maybe a gauge choice).
          *   Better: A "new number" that is actually just a definition. Let's choose the discovery of "Imaginary Numbers" historically, or a modern equivalent like a specific *gauge field* that is mathematically necessary but physically redundant.
          *   Selection: A "New Particle" that turns out to be a quasiparticle or a resonance that depends on the framework.
          *   Actually, let's look for a sentence like "The universe *uses* this geometry." If the procedure says "The theory *uses* this geometry," it's duller.
          *   Let's pick: A mathematician proves a solution exists using the Axiom of Choice (non-constructive).
          *   Sentence: "We have found the solution."
          *   Procedure verdict: You haven't found it; you proved it's there without touching it.
          *   Rewrite: "We have proved a solution must exist." (Duller, less "discovery" vibe).

  6.  **Addressing Limitations:**
      *   Can't solve metaphysics.
      *   Misfires on stipulative definitions.
      *   Safe framing might be boring.
      *   Community consensus can be wrong (historical hindsight).

  7.  **Review against Constraints:**
      *   10 minutes? Yes, flowchart style.
      *   No philosophy training? Yes, translated to reporting questions.
      *   Distinguish indispensability types? Yes, built into Q2.
      *   Mark contested premises? Yes.
      *   Three cases? Yes.
      *   Limitations section? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, practical, respectful of the writer's craft.
      *   Formatting: Clear headers, bold text for decision points.
      *   Ensure the "Unpleasant Case" hits home.

  *(Self-Correction during drafting)*: I need to make sure I don't just give a flowchart but explain *why* based on the philosophy requested (Quine, Benacerraf, etc.) without using jargon.
  *   *Indispensability:* Quine/Putnam. If math is essential to science, treat math as real as science.
  *   *Epistemic Access:* Benacerraf. How do we know it? If no causal link, be careful.
  *   *Structuralism:* Benacerraf/Resnik. If objects are indistinguishable, focus on structure.
  *   *Fictionalism:* Field. If it works but isn't true, treat as fiction.

  *Refining the "Unpleasant Case":* The prompt asks for a case where the procedure returns an answer I won't like (duller/less quotable).
  *   Scenario: A source says, "We discovered the shape of the universe."
  *   Reality: They found a topology that fits the data *among many*.
  *   Procedure output: "They found a model that fits."
  *   Why unpleasant: Kills the romance of "The Truth."

  *Refining the "Indispensability" distinction:*
  *   Indispensable to Result: The prediction *cannot* be derived without this entity.
  *   Indispensable to Explanation: The prediction can be derived another way, but this way is clearer/easier.
  *   This maps to Quine (ontological commitment) vs. Pragmatism.

  *Let's build the Procedure.*

  *Step 1: The Causal Test (Observation).*
  *Step 2: The Removal Test (Indispensability).*
  *Step 3: The Identity Test (Structuralism).*
  *Step 4: The Community Test (Consensus).*

  *Let's write it.*
answer: |-
  Here is a decision procedure designed for your workflow. It translates the major positions in the philosophy of mathematics (Platonism, Nominalism, Structuralism, Fictionalism) into editorial checks you can perform on a draft without needing to read the underlying philosophy.

  ### The Ontological Safety Check (10-Minute Procedure)

  **Goal:** Determine the strongest ontological framing ("Discovery," "Invention," or "Tool") your prose is licensed to use for a specific mathematical or theoretical object, based on empirical and communal evidence rather than metaphysical truth.

  **The Three Licensed Framings:**
  1.  **Realist (Discovery):** The object is treated as pre-existing and independent. (Verbs: *found, exists, is, nature uses*.)
  2.  **Structuralist (Positional):** The object is treated as a node in a network of relations. (Verbs: *occupies the role, satisfies the conditions, corresponds to*.)
  3.  **Instrumentalist (Tool):** The object is treated as a useful calculation device with no claim to reality. (Verbs: *models, predicts, acts as if, allows us to calculate*.)

  ---

  #### Step 1: The Causal Trace (Epistemic Access)
  **Question:** Can a measurement device interact with this object *directly*, without passing through a theory first?
  *   *Adequate Answer (Yes):* A detector clicks, a photo is taken, or a physical sample is held, and the interaction is agreed upon by skeptics as the object itself (e.g., an electron, a fossil).
  *   *Adequate Answer (No):* The object is only visible as a variable in an equation that fits data (e.g., a wave function, a 10th dimension, a set of infinite numbers).

  *   **If YES:** Proceed to **Framing 1 (Realist)**. You are licensed to write "discovered" or "exists."
  *   **If NO:** The object is abstract or theoretical. Proceed to Step 2.

  #### Step 2: The Removal Test (Indispensability)
  **Question:** If you remove this object from the theory, do the **numerical predictions** fail, or does only the **explanation** become harder?
  *   *Context:* This distinguishes between the Quine-Putnam Indispensability Argument (math is real because science needs it) and Pragmatism (math is just a convenient language).
  *   *Adequate Answer (Predictions Fail):* There is no known way to derive the experimental match without this specific mathematical entity. It is doing the heavy lifting.
  *   *Adequate Answer (Explanation Harder):* You could get the same numbers using a different, perhaps clumsier, mathematical framework, or by brute-force data fitting without the object.

  *   **If Predictions Fail:** You are *provisionally* licensed for **Framing 1 (Realist)**, but mark as **Contested Premise**.
      *   *Contested Premise:* This relies on the view that "indispensable to science" equals "real." Some philosophers (e.g., Hartry Field) argue science can be nominalized.
      *   *Risk:* If the premise is wrong, you have smuggled in Platonism.
      *   *Mitigation:* Attribute the reality claim to the theory, not the universe. (e.g., "In this theory, the dimensions exist" vs. "The dimensions exist.")
  *   **If Explanation Harder:** Proceed to **Framing 3 (Instrumentalist)**. You must write "model," "tool," or "framework." Do not use "discovered."

  #### Step 3: The Identity Test (Structural Uniqueness)
  **Question:** Is the object unique, or is it one of many indistinguishable candidates?
  *   *Context:* This addresses Paul Benacerraf's identification problem. If two objects play the exact same role, is there a fact of the matter which one is "the" object?
  *   *Adequate Answer (Unique):* There is only one object that fits the description (e.g., the number 1, the Earth).
  *   *Adequate Answer (Interchangeable):* Any object with the right relationships works (e.g., "the" point at infinity, "the" group of order 4, a specific gauge potential).

  *   **If Unique:** You may use **Framing 1 (Realist)** or **Framing 3 (Instrumentalist)** depending on Step 2.
  *   **If Interchangeable:** You must use **Framing 2 (Structuralist)**.
      *   *Constraint:* You cannot say "We found *the* object." You must say "We found an object that plays *the* role" or "The structure requires a position here."

  #### Step 4: The Community Consensus (Sociological Check)
  **Question:** How do the practitioners speak about it in private vs. public?
  *   *Adequate Answer:* If they speak like Realists in the lab ("Look at this particle") but Instrumentalists in the seminar ("This model saves the phenomena"), follow the lab talk for physical objects and seminar talk for mathematical ones.
  *   *Decision Point:* If the community is split 50/50 on whether the object is "real" or "just math," **STOP**.
      *   *Action:* Hand to Editor. This is a live philosophical dispute, not settled science. Your prose must reflect the dispute (e.g., "Some argue X is real; others call it a tool").

  ---

  ### Application to Three Cases

  #### Case 1: The Extra Dimensions
  **Scenario:** A physicist reports a theory (e.g., String Theory) works only when formulated in 10 dimensions. Extra dimensions are never measured. Predictions match experiment to high precision.
  **Draft Sentence:** "The team discovered that the universe hides six extra dimensions."

  1.  **Causal Trace:** Can we measure the dimensions directly? **No.** (They are compactified/unobservable).
  2.  **Removal Test:** If removed, do predictions fail? **Yes.** (The theory breaks without them).
      *   *Premise:* Indispensability implies reality. (Contested).
  3.  **Identity Test:** Are the dimensions unique? **Debatable**, but usually treated as specific geometric configurations.
  4.  **Consensus:** Physicists generally treat these as theoretical necessities, not observed facts.

  **Procedure Verdict:** **Framing 3 (Instrumentalist) with Realist Attribution.**
  *   **Why:** You failed the Causal Trace. While indispensable to the *theory*, they are not indispensable to *observed reality* (since other theories might explain the data without them).
  *   **Required Rewrite:** "The team showed that the theory requires six extra dimensions to match experimental data."
  *   **Why you won't like it:** It removes the punch of "The universe *has* dimensions." It makes the dimensions a property of the *map*, not the *territory*.
  *   **Safety:** This protects you if String Theory is superseded by a 4-dimensional theory tomorrow.

  #### Case 2: The Structural Object
  **Scenario:** A mathematician proves an object must exist (e.g., a specific solution to a differential equation), characterized entirely by its role. There are many isomorphic candidates; no one can say which one it is.
  **Draft Sentence:** "She found the hidden number governing the system."

  1.  **Causal Trace:** Observable? **No.** (Abstract math).
  2.  **Removal Test:** Indispensable to proof? **Yes.**
  3.  **Identity Test:** Unique? **No.** (Any isomorphic copy works).
  4.  **Consensus:** Mathematicians know it's a structural claim.

  **Procedure Verdict:** **Framing 2 (Structuralist).**
  *   **Why:** Benacerraf's problem. If you can't distinguish it from its twins, you can't claim to have found "the" object.
  *   **Required Rewrite:** "She proved the system requires a value occupying a specific structural role."
  *   **Safety:** Prevents the letters column from pointing out that "the number" is ill-defined.

  #### Case 3: The Unpleasant Case (The Non-Constructive Proof)
  **Scenario:** A source uses the Axiom of Choice to prove a solution exists without showing how to build it. They want to say, "We located the solution."
  **Draft Sentence:** "We have finally found the solution to the equation."

  1.  **Causal Trace:** Observable? **No.**
  2.  **Removal Test:** Indispensable to result? **Yes** (The proof relies on it).
  3.  **Identity Test:** Unique? **Yes** (The solution is unique), *but*...
  4.  **Epistemic Access Check (Add-on):** Did you construct it, or just prove it's there? **Proved it's there.**

  **Procedure Verdict:** **Framing 3 (Instrumentalist/Fictionalist).**
  *   **Why:** You have no epistemic access to the object. You know *that* it is, not *what* it is. Claiming to "find" it implies contact.
  *   **Required Rewrite:** "We have proved that a solution must exist."
  *   **Why you won't like it:** "Found" is active, exciting, and quotable. "Proved... must exist" is dry, passive, and kills the "Eureka!" narrative arc.
  *   **What to do:** Accept the dullness. The excitement of a non-constructive proof is intellectual, not exploratory. If you write "found," you are lying about the method. You can salvage the narrative by focusing on the *obstacle* overcome (the proof difficulty) rather than the *object* found.

  ---

  ### Limitations and Misfires

  This procedure does not solve the problem of mathematical existence. It solves the problem of **editorial liability**. Here is where it will fail you, and how to handle it:

  **1. The Stipulative Misfire**
  *   **The Problem:** Sometimes an object is introduced by definition (e.g., "Let X be the set of all..."). The discovery/invention distinction is empty here; it is purely stipulative.
  *   **Procedure Failure:** Step 2 (Removal Test) might flag this as "Instrumental," but the mathematician feels it as "Real" within the system.
  *   **Handling:** Use **Framing 2 (Structuralist)**. Describe the *consequences* of the definition, not the ontology. "By defining X this way, the proof allows us to..."

  **2. The "Safe but Dull" Trap**
  *   **The Problem:** The procedure often pushes you toward Instrumentalism ("The model predicts") because it is the safest ontological bet. This can make science sound like mere bookkeeping, alienating readers who want to know about Reality.
  *   **Handling:** Use **Attribution**. You can write "The universe uses this geometry" if you prefix it with "According to the theory..." or "Einstein argued..." This shifts the ontological commitment from *you/the magazine* to *the source*.

  **3. The Historical Hindsight Risk**
  *   **The Problem:** Community Consensus (Step 4) is not truth. Phlogiston was once consensus.
  *   **Handling:** The procedure protects you from current controversy, not future embarrassment. If the consensus shifts, your attribution ("The theory posits...") saves you. If you wrote "Phlogiston exists," you are wrong. If you wrote "Lavoisier argued phlogiston exists," you are historically accurate. **Always prefer attribution over assertion.**

  **4. The Indispensability Blind Spot**
  *   **The Problem:** The procedure treats "Indispensable to Prediction" as a strong signal for Realism. However, history shows that indispensable tools are often later discarded (e.g., the luminiferous ether was indispensable to 19th-century optics predictions).
  *   **Handling:** Mark any sentence relying on Step 2 with a mental "Contested" flag. If the story is about the *nature of reality*, you must explicitly mention that the tool might be temporary. If the story is about the *result*, the tool's reality is irrelevant.

  ### Summary for your Editor
  When you submit the draft, attach this note:
  > "I have run the ontological claims through a safety check. Sentences framed as 'Discovery' passed the Causal Trace or are attributed to specific theories. Sentences framed as 'Tools' failed the Causal Trace but passed the Indispensability Test. Where the distinction is philosophically contested, I have used attribution to shield the magazine from metaphysical claims."

  This tells your editor you have managed the risk without needing them to understand the difference between a manifold and a number.
