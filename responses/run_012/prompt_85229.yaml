answer: |-
  You aren't contradicting yourself. Your instincts are actually consistent; you just lack the framework to explain *why* they feel right. You are treating the rulebook as the source of authority, but your gut tells you the *members* are the source of authority.

  Here is the single principle that resolves your tangle, followed by the three operational rules you need to apply it.

  ### The Principle of Reversible Sovereignty

  **The League is not the rulebook; the League is the members. A rule is valid only if it reflects the will of the members, provided that will does not destroy their ability to change their minds in the future.**

  To make this work in practice, you need three operational rules. If you adopt these, every verdict you listed becomes consistent.

  1.  **The Hierarchy Rule:** The AGM (the members) is sovereign. The Committee is an employee. The Rulebook is a record. Where the AGM speaks clearly, the Committee cannot override it, even using a "spirit of the game" clause.
  2.  **The Form Rule:** Where the rulebook specifies a procedure (e.g., postal ballot), you must follow it. Where the rulebook is silent (e.g., smoking), established custom counts as law.
  3.  **The Reversibility Rule:** You can make a rule hard to change, but you cannot make it impossible to change. You cannot use the rules to destroy the mechanism (the AGM) that makes the rules valid.

  ---

  ### How this fixes your five contradictions

  **1. The 2011 Amendment (Changing Rule 30)**
  *   **Your verdict:** Valid.
  *   **Why:** This passes the **Reversibility Rule**. They changed *how* to vote (procedure), but they did not stop anyone from voting later. They changed the lock, they didn't burn the key.
  *   **Principle:** A sovereign body can change its own procedures.

  **2. The 2013 Entrenchment (Rule 31 "Cannot be amended") vs. 2015 Subs (Two AGMs)**
  *   **Your verdict:** Rule 31 is worthless; Subs rule is binding.
  *   **Why:** This is the clearest application of the **Reversibility Rule**.
      *   Rule 31 says "Never." That makes reversal *impossible*. It binds the hands of future members permanently. It is void.
      *   The Subs rule says "Two AGMs." That makes reversal *harder*, but not impossible. It is valid.
  *   **Principle:** You can build a hurdle, but you cannot build a wall.

  **3. The 2016 Committee Override (Spirit of the Game)**
  *   **Your verdict:** Out of order.
  *   **Why:** This applies the **Hierarchy Rule**. The AGM is the master; the Committee is the servant. Rule 2 ("spirit of the game") is a general instruction to the Committee, but a specific vote by the AGM is a direct order from the master. A servant cannot use a general instruction to veto a direct order.
  *   **Principle:** Specific sovereignty trumps general delegation.

  **4. The 2017 Forfeits (Show of Hands vs. Postal Ballot)**
  *   **Your verdict:** Not a rule.
  *   **Why:** This applies the **Form Rule**. The rulebook was *not silent*. It demanded a postal ballot. Ignoring an explicit instruction breaks the chain of authority.
  *   **Principle:** Explicit written procedure trumps the vote itself if the procedure is ignored.

  **5. The Unwritten Rules (Smoking & Handshakes)**
  *   **Your verdict:** Valid rules.
  *   **Why:** This also applies the **Form Rule**, but the other side of it. The rulebook was *silent*. In the absence of written law, the tacit consent of the membership (enforced custom for 20+ years) fills the gap.
  *   **Principle:** Custom fills silence; it cannot override explicit text.

  ---

  ### The "Abolish the AGM" Dilemma

  You asked: *Can a simple majority vote to abolish the AGM?*

  **The Answer:** No.

  **Why:** This violates the **Reversibility Rule**. The AGM is the source of the rules' validity. If you abolish the AGM, you destroy the source of authority. A rule that destroys the authority that created it is self-defeating and void.

  You said: *"Half of me says that's what the rulebook says... The other half says a vote can't be allowed to kill off the very thing that makes votes count."*

  **The Shift You Must Make:** You need to drop the idea that "if the rulebook says it, it's valid." The rulebook is just a piece of paper. The *League* is the people. If the people vote to stop being a League, the vote is a resignation, not a rule change. You cannot use the rules to commit suicide.

  **Verdict:** The vote is invalid. The AGM must continue to exist.

  ---

  ### Your Two Test Cases

  **1. Desuetude (Killing a rule by ignoring it for 10 years)**
  *   **Verdict:** Valid repeal.
  *   **Why:** Under the **Form Rule**, where the AGM sees a rule is not being enforced and raises no objection for a decade, that is tacit consent. It is the mirror image of the smoking rule. The members have "voted" by silence.

  **2. The Merger Ban ("Never merge with the county")**
  *   **Verdict:** Invalid if "Never" means "Impossible to change." Valid if it means "Requires a special majority."
  *   **Why:** Back to the **Reversibility Rule**. If the rule says "We will never merge, and no AGM can change this," it is void (like Rule 31). If it says "We will not merge unless 75% of the AGM agrees," it is valid (like the Subs rule). You cannot bind the future forever, but you can ask them to be sure.

  ### Summary of the Sacrifice

  You asked me to be straight about which verdict you have to give up.

  You have to give up the idea that **the Rulebook is the boss.**

  Your working theory was: *"A change is good if the rulebook in force at the time let you make it that way."*
  **This is wrong.**

  The correct view is: *"A change is good if the Members allow it, using the Rulebook as their tool, provided they don't break the tool."*

  This is why the 2011 change (making voting easier) was fine, but abolishing the AGM is not. One sharpens the tool; the other smashes it. If you accept that the Members are above the Book, all your contradictions vanish.
