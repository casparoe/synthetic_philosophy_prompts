  # The Tragedy Diagnostic Tree

  **Instructions:** Begin at the root. Answer each question based on your introspective experience of a paradigmatic sad artwork (e.g., *King Lear*, a requiem, a tragic film). Follow the branch corresponding to your answer until you reach a leaf.

  ### **Q1 (Root): How is the enjoyment ($E$) related to the sadness ($N$)?**
  *   **(i) Identity:** $E$ is not a separate feeling; it is $N$ itself under a favorable description. → *Go to Q2.*
  *   **(ii) Production:** $N$ causes $E$ through transformation or release. → *Go to Q3.*
  *   **(iii) Precondition:** $N$ is required for $E$ (providing stakes or contrast) but is not part of $E$. → *Go to Q5.*
  *   **(iv) Aggregation:** $E$ is independent of $N$ and simply outweighs it. → *Go to Q7.*
  *   **(v) Dissolution:** There is no $N$ of the problematic kind (the emotion is not real or not unpleasant). → *Go to Q8.*

  ---

  ### **Path (i): Identity**
  **Q2: Is the enjoyment directed at your own state of being moved?**
  *   **Yes:** You enjoy the feeling of sadness itself (the "warmth" of grief). → **Leaf 1**
  *   **No:** You enjoy the object, but describe that enjoyment as "sadness." → **Leaf 2**

  ### **Path (ii): Production**
  **Q3: Does the negative affect cease to exist as negative during enjoyment?**
  *   **Yes:** The pain is transmuted into pleasure; the sadness becomes the enjoyment. → **Leaf 3**
  *   **No:** The sadness persists but is relieved or purged. → *Go to Q4.*

  **Q4: Is the relief achieved by expelling the emotion or by resolving its tension?**
  *   **Expelling:** The emotion is discharged from the psyche (a purge). → **Leaf 4**
  *   **Resolving:** The emotion is soothed by narrative closure (a consolation). → **Leaf 5**

  ### **Path (iii): Precondition**
  **Q5: Is the resulting value primarily cognitive (truth) or aesthetic (beauty)?**
  *   **Cognitive:** The sadness is the cost of gaining insight into the human condition. → **Leaf 6**
  *   **Aesthetic:** The sadness enables an appreciation of the work's artistic merit. → *Go to Q6.*

  **Q6: Does the sadness provide contrast for the form or stakes for the resolution?**
  *   **Contrast:** Sadness highlights the beauty of the form (like shadow in a painting). → **Leaf 7**
  *   **Stakes:** Sadness makes the moral resolution meaningful (the cost of virtue). → **Leaf 8**

  ### **Path (iv): Aggregation**
  **Q7: Does the positive value arise from the same source as the sadness?**
  *   **Yes:** The story itself provides both the pain and the outweighing pleasure. → **Leaf 9**
  *   **No:** The pleasure comes from external factors (social bonding, moral vindication). → **Leaf 10**

  ### **Path (v): Dissolution**
  **Q8: Is the emotion directed at a make-believe state of affairs?**
  *   **Yes:** You are not truly sad, only pretending or simulating sadness. → **Leaf 11**
  *   **No:** The emotion is real, but its unpleasantness is denied. → *Go to Q9.*

  **Q9: Is the unpleasantness intrinsic to the feeling or inherited from the object?**
  *   **Inherited:** The feeling is neutral; the object is bad, but we value the object. → **Leaf 12**
  *   **Intrinsic:** The feeling is painful, but the pain is illusory or negligible. → **Empty Slot**

  ---

  ## **The Leaves**

  | Leaf | Position Label | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1** | **Meta-Emotion View** | You must admit you sometimes seek sadness simply to feel the sensation of being sad. |
  | **2** | **Unnamed (Descriptive Identity)** | You must claim "enjoyment" is just a misleading word for a specific kind of painful appreciation. |
  | **3** | **Conversion View** | You must assert that the pain literally changes its phenomenal quality into pleasure during the experience. |
  | **4** | **Discharge (Catharsis) View** | You must treat emotions like fluids that can be drained from the body to restore health. |
  | **5** | **Unnamed (Consolation)** | You must argue that the sadness remains painful but is tolerated because the ending fixes it. |
  | **6** | **Cognitive/Insight View** | You must accept that you would reject the art if it conveyed the same truth without the sadness. |
  | **7** | **Formalist View** | You must claim the sadness is valuable only as a foil to formal beauty, not for its own content. |
  | **8** | **Unnamed (Moral Stakes)** | You must hold that the sadness is merely the price of admission for a moral lesson. |
  | **9** | **Aggregation View** | You must concede that the experience is net-painful for some, yet rational to seek. |
  | **10** | **Unnamed (External Compensation)** | You must admit the art itself offers no joy, only the context around it does. |
  | **11** | **Quasi-Emotion View** | You must deny that your tears or chest-tightness constitute a real emotional state. |
  | **12** | **Unnamed (Pain-Illusion)** | You must argue that pain is not intrinsically bad, even when it feels exactly like pain. |

  *(Note: The slot at Q9/Intrinsic is marked **Empty** because no major position claims pain is intrinsic yet illusory; this is diagnosed as **incoherent**, as intrinsic pain is defined by its unpleasantness.)*

  *(Note: **Leaf 7 (Formalist)** and **Leaf 8 (Moral Stakes)** are flagged as **indistinguishable** by this tree for readers who believe form and moral resolution are inseparable; such readers may answer Q6 arbitrarily.)*

  ---

  ## **Scoring Key & Test Cases**

  Use your leaf position to interpret the following cases. If your position cannot explain a case without modification, note the tension.

  1.  **Tragedy enjoyed more on a second viewing (suspense gone):**
      *   *Fits:* **Leaf 7 (Formalist)** or **Leaf 6 (Cognitive)**. (Sadness provides contrast/insight, not shock).
      *   *Struggles:* **Leaf 4 (Catharsis)** or **Leaf 5 (Consolation)**. (If suspense is gone, is tension purged or resolved differently?).
  2.  **Sad music with lyrics in a language you do not understand:**
      *   *Fits:* **Leaf 7 (Formalist)** or **Leaf 11 (Quasi-Emotion)**. (Sadness is in the sound/simulation, not semantic content).
      *   *Struggles:* **Leaf 6 (Cognitive)**. (Hard to gain specific insight without understanding the text).
  3.  **Documentary about real suffering (artistically magnificent, morally uncomfortable):**
      *   *Fits:* **Leaf 9 (Aggregation)** or **Leaf 10 (External Compensation)**. (Pleasure outweighs pain, or comes from moral engagement).
      *   *Struggles:* **Leaf 11 (Quasi-Emotion)**. (The suffering is real, so the emotion cannot be make-believe).
  4.  **Tragedy whose events one would not want to occur in reality:**
      *   *Fits:* **All Leaves**. (This is the core paradox definition).
      *   *Diagnostic:* Use this to verify **Leaf 12 (Pain-Illusion)**. If you admit the events are bad, do you admit the pain is real?
  5.  **Sad passage one rereads simply for the pleasure of it:**
      *   *Fits:* **Leaf 1 (Meta-Emotion)** or **Leaf 3 (Conversion)**. (The sadness itself is the source of pleasure).
      *   *Struggles:* **Leaf 8 (Moral Stakes)**. (Rereading suggests the lesson is already learned; why pay the cost again?).

  ---

  ## **Diagnostic Notes**

  *   **Empty Slot (Q9/Intrinsic):** This combination (Real Emotion + Real Pain + Illusory Badness) is unoccupied. It is diagnosed as **incoherent**: if pain is intrinsically unpleasant, claiming the unpleasantness is illusory contradicts the definition of pain.
  *   **Indistinguishable Leaves (7 & 8):** The tree separates *Formal Contrast* from *Moral Stakes*. However, in practice, readers who value "beauty" often conflate it with "moral resolution." If you find Q6 impossible to answer, you likely hold a unified **Aesthetic-Moral Precondition** view not fully separated here.
  *   **Unexplored Slot (Q7/No):** **Leaf 10 (External Compensation)** is rarely defended as a primary theory of *artistic* value, as it locates the value outside the artifact. It is marked **unattractive** to aestheticians because it makes the art itself incidental.
