answer: |-
  You are not pattern-matching ghosts. You have independently rediscovered the central insight of modern famine studies. The shape you are seeing is real, it is documented, and it is distinct from simple crop failure.

  There is an existing academic name for the victim's side of this equation: **Entitlement Failure**.

  This term was coined by the economist Amartya Sen. It distinguishes between *Food Availability Decline* (there is no food) and *Entitlement Failure* (there is food, but you have no legal or economic way to command it). In all three cases you cited, the famine was not caused by a lack of food in the aggregate, but by a collapse in the specific group's ability to access it. The rural poor lost the "entitlement" to the food they grew because of price spikes, confiscation, or wage collapse.

  However, "Entitlement Failure" describes the *mechanism of death*, not the *mechanism of policy*. It explains why the peasant starved, but not why the state kept the grain moving the wrong way. You are describing the political engine that drives the entitlement failure. There isn't a single universally accepted term for that specific political rigidity, so, per your request, I will coin one for you to use in your arguments.

  Let's call it **Administrative Starvation**.

  ### What Administrative Starvation Is
  Administrative Starvation occurs when a governing system prioritizes the integrity of its own rules over the biological survival of a specific population. It is not necessarily a desire to kill (though it can be); it is a refusal to suspend the "normal" operation of the state (tax collection, export contracts, procurement quotas, military supply) in the face of exceptional crisis.

  It is defined by three features:
  1.  **Continuity:** The bureaucracy continues to function as if in peacetime or normalcy. Quotas are met, trains run on schedule, exports ship.
  2.  **Extraction:** Food moves from the vulnerable periphery to the protected center (cities, army, metropole) because the system is designed to pull resources inward.
  3.  **Inelasticity:** The rules for claiming food do not bend for the starving. If you cannot pay, you do not eat, even if the warehouse is full, because releasing food without payment breaks the market, the quota, or the ideology.

  ### What It Isn't
  *   **It isn't necessarily Genocide:** Genocide requires intent to destroy a group. Administrative Starvation often requires only indifference to a group's survival in favor of a higher goal (winning a war, industrializing, balancing a budget). The death is a byproduct, not the objective, though the outcome is the same.
  *   **It isn't "Accident":** It is not a mistake. It is the result of choices made to maintain the system.
  *   **It isn't just "Shortage":** A shortage becomes Administrative Starvation only when the distribution system refuses to ration by need and instead rations by price or priority.

  ### Answering Your Edges

  **1. Is it the same thing in all three cases?**
  Structurally, yes. In Ireland, the priority was the market and the rent system (Colonial extraction). In Bengal, the priority was the War effort and inflation control (Military extraction). In China, the priority was Industrialization and Procurement Quotas (Ideological extraction). In all three, the state treated the food as a *resource to be managed* rather than *fuel to keep people alive*. The victims were the producers because they were the furthest from the political center and the easiest to sacrifice without immediate political blowback.

  **2. Where's the line between letting it happen and doing it?**
  The line is **Foreseeability**.
  In all three cases, the authorities were warned. In Ireland, officials knew the potato crop was gone and that the poor ate nothing else. In Bengal, officials knew the price spikes would starve the laborers. In China, local officials knew the quotas exceeded the harvest.
  When you are warned that a rule will cause mass death, and you keep the rule in place to maintain order, profit, or ideology, you have crossed from "letting die" to "killing." This is often called **Structural Violence**. The violence is built into the structure of the rules. If the rules kill, the rule-maker is the weapon.

  **3. Does it still count when the shortage was real?**
  Yes. This is the most important point for your arguments.
  A 10% drop in food supply does not mathematically require a 30% death rate. In a flexible system, a shortage leads to shared hunger, belt-tightening, and rationing. Everyone eats less; no one dies.
  Mass death only occurs when the shortage is *concentrated* on those who cannot defend themselves. If there is a real shortage, but the army and the cities are fed while the countryside starves, the shortage is the *trigger*, but the distribution is the *cause*. You can have a shortage without a famine. You cannot have Administrative Starvation without a political choice to concentrate the shortage.

  ### How to Use This
  When you are in an argument, the opposition will likely say: "The crops failed. It was tragic, but inevitable."
  Your counter is: "Crop failure is inevitable; mass death is not. The food existed. It was moved. The rules remained rigid. That isn't nature; that's administration."

  You aren't seeing a ghost. You're seeing the machinery.
