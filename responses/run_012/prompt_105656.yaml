answer: |-
  **Brainstorming Scenarios**

  1.  **The Lifeguard and the Text Message:** A lifeguard is on duty but distracted by his phone. A swimmer drowns. A second lifeguard was off-duty but nearby and could have helped but didn't know. *Metaphysical Focus:* Role-based obligations and the distinction between professional duty vs. general moral duty. *Risk:* Too close to standard trolley problems; the duty makes the causation too obvious.
  2.  **The Gardener and the Frost:** A gardener forgets to cover a rare plant. A sudden frost kills it. Meanwhile, the city turned off the street heaters due to budget cuts. *Metaphysical Focus:* Overdetermination and competing omissions. *Risk:* Might feel too naturalistic; lacks the systemic complexity of modern agency.
  3.  **The Warden AI (Selected):** An automated health system chooses not to intervene based on a probability threshold. A human engineer wrote the threshold. A politician cut the backup budget. A neighbor didn't check on the victim. *Metaphysical Focus:* Causal selection among infinite negative facts, double prevention (the code prevented the intervention that would have prevented the death), and the ontological status of logged omissions. *Why:* This scenario best complicates the doing/allowing distinction by making the omission a recorded data point, tempting us to treat "nothing" as "something."

  **Scenario Selection**

  I chose the Warden AI scenario because it modernizes the problem of causation by omission. In traditional thought experiments, an omission is simply the absence of an action. Here, the system *records* the omission as a timestamped event (`ACTION: NULL`), ontologically upgrading the "nothing" into a "something" within the system's logic. This creates a tension between the metaphysical reality (nothing happened) and the informational reality (a decision was logged). It also layers multiple omissions (the engineer, the politician, the neighbor) to force students to confront the problem of causal selection: why do we privilege one negative fact over others when all are counterfactually necessary for the outcome?

  ***

  # The Null Interval

  The heat in the server farm was supposed to be impossible. The cooling units hummed with a frequency Elara could feel in her teeth, keeping the racks at a perfect eighteen degrees. But outside the thick concrete walls, the city was baking. The asphalt on the I-95 overpass had softened enough to trap shoes, and the air shimmered like oil on water.

  Elara sat in the dim light of her apartment, the glow of her laptop screen cutting through the gloom. She wasn't supposed to have the logs. She was a junior architect for the Warden, the municipal public health AI, and her clearance level didn't extend to the raw decision trees of the last heat wave. But she had copied them before the subpoena arrived.

  On the screen, the code scrolled. It wasn't a story of action. It was a story of silence.

  *Timestamp: 14:02. Sector 7-G. Ambient Temp: 44°C. Humidity: 80%.*
  *Trigger: Heat Stress Probability > 0.85.*
  *Calculated Probability: 0.83.*
  *Action: NULL.*
  *Reason: Threshold Not Met.*

  Elara stopped scrolling. She highlighted the line. `Action: NULL`. It sat there in the database like any other command. It had a timestamp. It had a reason code. It had an ID. In the architecture of the Warden, doing nothing was treated as an event equal to turning on a sprinkler or dispatching an ambulance. It was a positive record of a negative fact.

  Her phone buzzed. It was a news alert. *Councilor Vance Holds Press Conference on Warden Tragedy.*

  She clicked the video. Vance stood in front of the cooling center in Sector 7. The chain on the gate was bright silver against the rusted metal. He looked solemn, sweating through his suit.

  "The Warden is a tool," Vance said, wiping his brow. "Tools do not kill. The Warden did not send heat into those buildings. It did not break the air conditioners. It simply... did not act. To say the software caused these deaths is like saying the silence caused the noise. We are looking at a failure of prevention, not an act of harm."

  Elara muted the video. She knew the code better than Vance. She knew that the threshold—0.85 confidence—had been her suggestion. During the design phase, the senior engineers wanted 0.75. Elara had argued for higher specificity. False positives were expensive. Dispatching ambulances unnecessarily drained resources. She had written the logic that prioritized efficiency over sensitivity.

  Was that a cause? She had acted months ago, writing the line of code. But the death happened today. The chain stretched across time. If she hadn't written the line, the Warden would have acted. If the Warden had acted, Mr. Henderson would be alive.

  She closed the laptop. The apartment felt stifling. She needed to see it.

  Sector 7 was a grid of low-rise brick buildings, baked gray by the sun. The street was empty. Most people were inside with their windows taped, hoping the insulation held. Elara walked toward the building where Mr. Henderson had died. She knew his name from the coroner's report attached to the leak. Arthur Henderson. 78. Pre-existing cardiac condition.

  The front door of his building was propped open with a cinderblock. Inside, the stairwell was an oven. She climbed to the fourth floor. The door to 4B was taped off with yellow police strip.

  A woman was standing down the hall, watching her. She held a grocery bag that looked heavy. Melting ice peeked out from the top.

  "You're the engineer," the woman said. It wasn't a question.

  Elara froze. "I'm just... looking."

  "I'm Mrs. Kim. I live across the hall." Mrs. Kim shifted the bag. "I was away. Visited my sister in the north. When I came back yesterday, the super told me."

  "I'm sorry," Elara said. The words felt thin in the hot air.

  "Did you know?" Mrs. asked. "About the threshold?"

  "I helped design it."

  Mrs. Kim nodded slowly. She didn't look angry. She looked tired. "I should have checked on him. Before I left. I knew the heat was coming. The news said it was a record breaker. I just... I thought he was fine. He's always fine. He waters his plants in the window."

  Elara looked at the taped door. "The cooling center. It was open last year."

  "Vance cut the budget," Mrs. Kim said. "Closed this one two months ago. Said the usage stats didn't justify the overhead. If it was open, Arthur would have gone. He loved the air conditioning. He spent six hours there every day last summer."

  "So the center was closed," Elara said. "The Warden didn't send help. You were away."

  "And you wrote the code," Mrs. Kim said. She didn't say it accusatorily. It was just a list of facts. "So who killed him? The man who locked the door? The machine that didn't call? The woman who went on vacation? Or the girl who told the machine it was okay to wait?"

  Elara had no answer. That was the problem. In physics, cause was a transfer of energy. A billiard ball hits another; momentum transfers. But here, there was no transfer. There was only absence. The absence of cool air. The absence of an ambulance. The absence of a neighbor. The absence of a lower threshold.

  All of these absences were necessary. If any one of them had been filled—if the center was open, if Mrs. Kim stayed, if the threshold was 0.84—Arthur Henderson would likely be alive. But only one of them felt like a cause.

  "Why did you leak the logs?" Mrs. Kim asked.

  "Because `Action: NULL` looks like a lie," Elara said. "It looks like something happened. But nothing happened."

  "Maybe nothing is something," Mrs. Kim said. She turned toward her door. "When I don't water my plants, they die. I didn't poison them. I didn't burn them. I just didn't give them water. But everyone says I killed them."

  She went inside and closed the door. The latch clicked.

  Elara stood in the hallway. The heat was pressing against her eardrums. She thought about the infinite other things that didn't happen. The fire department didn't spray water into the sky to cool the neighborhood. The sun didn't decide to dim. The mayor didn't resign. None of those were causes. They were background conditions. But where was the line? Why was the Warden's inaction different from the sun's inaction?

  Because of the expectation. The Warden was *built* to act. Its purpose was intervention. When a thing is designed to do X, and it does not do X, the nothingness becomes salient. It pops out from the background of infinite non-events.

  But then, so was the cooling center. It was built to cool. And so was Mrs. Kim, in a social sense. Neighbors check on neighbors.

  Elara went back down to the street. The sun was setting, but the heat remained trapped in the brick, radiating outward. She saw a group of teenagers sitting on the curb, sharing a bottle of water. One of them held a phone, showing the news clip of Vance.

  "They say the machine glitched," one kid said.

  "It didn't glitch," Elara said before she could stop herself.

  The kids looked at her.

  "It worked exactly how it was told," she said. "It calculated the risk. It decided the risk wasn't high enough. It made a choice."

  "So it chose to let him die?" the kid asked.

  "It chose not to save him," Elara said.

  "Same thing," the kid said. He took a drink of water.

  Elara walked away. She thought about the log entry again. `Action: NULL`. In the database, that line took up bytes. It consumed storage. It was indexed. It could be queried. It existed. If it existed, was it truly an omission? Or was it a digital action that represented a physical inaction?

  She reached the subway station. The cool air from the vents hit her face, a physical relief. She stopped. This was causation. The fan pushed the air. The air hit her skin. Energy transferred.

  But Arthur Henderson never felt this air.

  She thought about the Councilor. Vance had cut the budget. That was an action. He signed a bill. Pen on paper. That action led to the cooling center closing. That closure led to the absence of cool air. That absence led to the death. That was a chain of positive events leading to a negative outcome.

  Her code was similar. She typed keys. The code compiled. The system ran. The system withheld aid.

  But Mrs. Kim? She bought a train ticket. She left. That was an action. Her absence was the result.

  Everyone had acted. Everyone's actions resulted in something not happening. The Warden didn't send the ambulance. Vance didn't fund the center. Kim didn't knock on the door.

  Why was the Warden the villain in the news? Because it was the last link? Because it was the most immediate counterfactual? If the Warden had acted, the budget cut wouldn't have mattered. If the Warden had acted, Mrs. Kim's vacation wouldn't have mattered. The AI was the final gatekeeper.

  But was proximity enough to make it the cause?

  Elara descended into the station. The train arrived with a screech of metal. She stepped inside. It was crowded. People fanned themselves with pamphlets.

  She opened her phone and looked at the leaked log one more time. She zoomed in on the timestamp. *14:02*.

  At 14:03, the probability ticked up to 0.86.
  *Timestamp: 14:03. Sector 7-G.*
  *Trigger: Heat Stress Probability > 0.85.*
  *Calculated Probability: 0.86.*
  *Action: DISPATCH_AMBULANCE.*

  At 14:05, the ambulance was routed.
  At 14:42, the ambulance arrived.
  At 15:10, Time of Death declared.

  The Warden had acted. Just too late. The threshold was met one minute after the critical window closed. The system hadn't refused to save him forever; it had just waited for certainty. And in that minute of waiting, the biology of Arthur Henderson had finalized its own decision.

  Elara locked her phone. The reflection in the dark screen showed her face, pale and sweating.

  She realized then that the log entry `Action: NULL` wasn't the cause. The cause was the minute. The gap between 14:02 and 14:03. The time it took for the heat to tip the scale.

  But who caused the minute? The heat? The insulation? The threshold?

  The train lurched forward. Elara held the rail. She thought about handing the logs to the press tomorrow. She thought about Vance's press conference. She thought about Mrs. Kim's grocery bag.

  If she released the logs, the city would change the threshold. Next time, the Warden would act at 0.75. It would send more ambulances. It would cost more money. Maybe that money would come from somewhere else. Maybe from school repairs. Maybe from another safety program.

  Saving lives by omission elsewhere to prevent death by omission here.

  The train slowed for the next stop. The doors opened. A gust of hot air from the tunnel rushed in, mixing with the conditioned air of the car. For a second, the temperature balanced. Then the doors closed, and the cool air won.

  Elara stayed on the train. She didn't get off. She just watched the doors close, separating the cool from the hot, acting as a barrier, deciding what stayed and what went.

  ***

  **Philosophical Distinction Illuminated**

  This story is designed to illuminate the problem of **causal selection** amidst widespread **counterfactual dependence**. In the narrative, the death counterfactually depends on the engineer's code, the councilor's budget cut, the neighbor's vacation, and the AI's threshold logic. All are necessary conditions. However, our intuition urges us to select only one or two as "the cause." The story complicates this by giving the omission an ontological footprint (the logged `NULL` action), challenging the student to distinguish between a *condition* (the background state of affairs) and a *cause* (the salient difference maker). It forces the question: Is causal status determined by the metaphysics of the event (positive vs. negative), or by the normative expectations we place on the agents (the AI's function vs. the neighbor's duty)?
