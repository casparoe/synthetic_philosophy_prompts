prompt: |-
  Hey, I'm a philospohy professor and I'm building a unit on causation by omission for an advanced metaphysics seminar. I want a short story I can hand out before any readings, so students have to argue about whether the central character caused the harm or merely let it happen. You're a philosopher who also writes literary fiction, so I want you to think carefully about the metaphysics before you write a single sentence. Start by brainstorming three or four scenarios that could dramatize the doing/allowing distinction, double prevention (where one failure keeps a backup from kicking in), and the problem of causal selection (why we pick one omission out of all the things that didn't happen as the cause). Pick the one where the omission is most tempting to call a cause and also most tempting to call a mere condition. Then write the story. Don't let any character give a lecture on the philosophy; let the plot and the details do the work. No citations, no bibliography, no name-dropping real philosophers. I want it to feel like a real story, not a dressed-up thought experiment.

  Here's the sort of setup I have in mind, but I'm definately open to you changing the specifics. Near-future city, a public health AI called the Warden is authorized to intervene in heat waves, but its policy says it only acts when its confidence that acting will help is above some threshold. A heat wave hits a poor neighborhood. The Warden does nothing because its confidence is just below the threshold. People die. A junior engineer leaks the logs. The city council says the Warden didn't cause the deaths, it just failed to prevent them; the engineer says the Warden's inaction was a designed part of the system and therefore a cause. Maybe the Warden's code logs every non-intervention as a formal action with a timestamp, because the engineers wanted to audit omissions, and that log is what the engineer leaks. The story follows the engineer in the week after the leak, as she tries to figure out what she actually believes. I want the reader to be able to argue both ways. Maybe include a second omission that complicates things: a city official who diverted funds from cooling centers, or a neighbor who didn't check on an elderly person. The story should make the reader ask why we single out one omission as the cause when there are so many.

  Write maybe 1500-2500 words. Give it a title. Before the story, give me a short paragraph explaining which scenario you chose and why, and after the story, a short paragraph on which philosophical distinction you think it best illuminates. But the story is the main thing. Think carefully, and don't just regurgitate the standard trolley stuff.
