answer: |-
  To the Collections and Conservation Committee,

  I am writing this to summarize my position on the proposed treatment for the sixteenth-century wooden sculpture ahead of our meeting next week. As many of you know, my background is in systems architecture rather than art history, but having built the database that tracks our holdings, I have been forced to confront the practical implications of what we decide here. We are facing a deadline because the donor's funding expires at the end of the fiscal year, so we cannot table this decision indefinitely. We must choose whether to authorize the conservation lab's proposal, reject it, or approve it with specific stipulations. After reviewing the lab's technical pitch, the curator's support, and the serious objections raised by our dissenting conservators, I recommend that we approve the treatment but with strict conditions regarding how the object is catalogued and how the removed material is handled.

  To explain why I am landing on this middle ground, I need to address the underlying question that is making us hesitate. The lab argues that because they are growing replacement wood from the cells of the original sculpture, the new material is effectively the same as the old material. They say this allows the object to remain itself rather than becoming a ruin patched with modern substitutes. Our dissenting colleagues argue that this is biologically true but historically false, and that what emerges from the lab is effectively a new object that contains old parts, which should be catalogued as a reconstruction. Both sides are touching on a difficult puzzle about identity that does not have a single right answer, but we can break it down without relying on abstract theory. The question is whether the artwork is defined by the specific atoms the artist touched five hundred years ago, or whether it is defined by the continuity of its history and form. If we decide the artwork is only the original atoms, then any replacement destroys the object. If we decide the artwork is the continuing history and visual intent, then the object can survive material replacement.

  My view, informed by how our database structures reality, is that the accession number we assign to an object is not just a tag for a pile of material; it is a pointer to a specific history. In database terms, the accession number is the primary key. It links the physical item to its provenance, its exhibition history, its insurance records, and its attribution. If we change the accession number, we sever those links and effectively declare that the history of the previous five hundred years belongs to a dead object, while the new object starts with a blank slate. This seems wrong because the visual form and the historical journey of this sculpture are continuous, even if the material is not. However, the dissenting conservators are correct that transparency is non-negotiable. If we keep the existing accession number, we are asserting continuity, but we cannot use that continuity to hide the extent of the intervention. The record must reflect that while the identity is continuous, the material composition has fundamentally changed.

  Therefore, I propose we approve the treatment on the condition that the cataloguing record is updated to explicitly document the percentage of replacement material. We keep the original accession number to preserve the provenance chain, but we add a permanent, visible flag in the public-facing record and on the gallery label stating that the object has undergone extensive material replacement using cloned wood. This satisfies the donor's desire to display the work as the artist's vision while respecting the conservators' ethical requirement that we do not deceive the viewer about what they are looking at. We are essentially treating the accession number as a record of the artwork's lifecycle rather than a certificate of original material. This allows us to say that the object is the same entity historically, even if it is materially hybrid.

  Regarding the lab's claim that the grown wood is the same wood, I believe we must treat this with skepticism in our documentation. Biologically, the DNA matches, but historically, the new wood has no age, no weathering, and no connection to the moment of creation. It is a sibling to the original wood, not the original wood itself. Acknowledging this distinction protects us from future criticism should the technology or the ethics shift. We should authorize the lab to proceed with the goal of visual reintegration, meaning the joins should be invisible to the naked eye, but we must reject the idea that the new wood is indistinguishable in terms of identity. The distinction must live in the data, even if it is invisible in the gallery.

  Finally, I have significant concerns about the donor's request to deaccession the removed dead wood for discard or teaching purposes. If we are keeping the accession number because the history is continuous, then the removed original material is the only physical evidence left of the artist's actual hand. Discarding it would be akin to deleting the backup file after migrating a database. I recommend we condition approval on the retention of all removed original material as part of the permanent collection, stored alongside the sculpture. It should not be treated as waste or merely as teaching stock that could be lost or dispersed. It must remain linked to the accession number as evidence of the object's prior state. This ensures that if future scholars question the extent of our intervention, the physical proof remains available to them.

  In summary, I move that we approve the conservation proposal with the following conditions: the object retains its current accession number to maintain historical continuity; the public record and gallery label must disclose the extent of material replacement; the removed original wood must be retained in perpetuity as part of the permanent holding rather than discarded; and the treatment must be completed within the current fiscal year to secure funding. This path allows us to save the visual integrity of the work and secure the donor's support without compromising our ethical obligation to truthfulness. It acknowledges that the object is a combination of matter, shape, and history, and while we are replacing the matter, we are safeguarding the shape and history through transparent documentation. I hope this provides a workable framework for our discussion next week, as I believe it addresses the core validity of the dissenters' concerns while allowing the project to move forward.
