      *(Refining the "Same Wood" argument)*: The lab says it's the same wood because of DNA. The counter-argument is that wood is also a historical record (growth rings, age, weathering). Cloned wood is biologically related but historically infantile. I should make this distinction clear.

      *(Refining the Database Analogy)*: The accession number is the primary key. Changing the key breaks the links. But updating the fields is necessary. We keep the key, but we update the "status" field to reflect the intervention.

