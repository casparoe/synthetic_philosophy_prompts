      *   **The Case:** 500-year-old wooden sculpture, 40% lost/dead. Conservation proposal: 3D scan + carve replacements using wood grown from cell cultures of the *original* wood (same tree stock). Goal: Indistinguishable from original. Donor wants it displayed as the artist's work under existing accession number. Dead wood to be deaccessioned. Curator supports. Two conservators dissent (argue it's a new object/reconstruction, needs re-cataloguing).
      *   **User's Conflict:** Understands the database implications (accession number = primary key). Feels there's a deeper ontological question (what is the artwork? wood, shape, history?). Skeptical of "same wood" claim.
      *   **Requirements:**
          *   Recommend a specific course of action (Approve, Approve with Conditions, Reject).
          *   Address the dissenting conservators' position seriously.
          *   Explain philosophical concepts in plain terms (no jargon name-dropping).
          *   Format: Continuous prose (email/letter style), no headings, bullets, bold, or tables.
          *   Tone: Professional, thoughtful, decisive but acknowledging complexity.
          *   Deadline/Constraint: Donor funding lapses at end of fiscal year, can't table forever.

  2.  **Determine the Recommendation:**
      *   *Option A (Reject):* Too conservative? Might lose funding and the object remains a ruin. Doesn't solve the ontological problem, just preserves the status quo of decay.
      *   *Option B (Approve as is):* Ignores the valid concerns of the dissenting conservators. Risks future credibility if the "same object" claim is challenged.
      *   *Option C (Approve with Conditions):* This seems the most balanced. It allows the conservation to proceed (saving the object's visual integrity and securing funding) but addresses the ontological/cataloguing concern by ensuring transparency. The accession number stays (continuity of history), but the record must reflect the extent of intervention.
      *   *Decision:* Approve with Conditions. This respects the donor and curator's desire to display the work, respects the conservators' ethical concerns by mandating transparency, and solves the user's database anxiety by defining what the record represents.

  3.  **Address the Philosophical/Ontological Issue:**
      *   The user is circling the "Ship of Theseus" paradox without knowing the name. I need to explain this simply.
      *   Concept: Is identity based on material continuity or formal/historical continuity?
      *   The lab argues material continuity (cloned wood = same wood).
      *   The dissenters argue material discontinuity (new growth = new object).
      *   The middle ground: Historical/Functional continuity. The object is a record of human engagement, not just a pile of cellulose.
      *   Database analogy: The accession number is the ID, but the fields describe the state. If the state changes drastically, the metadata needs to reflect that without changing the ID.

  4.  **Drafting - Section by Section (Mental Outline):**
      *   **Opening:** Acknowledge the weight of the decision and the deadline. State the purpose of the memo.
      *   **The Proposal:** Briefly summarize the conservation plan (cloned wood, 3D carve, indistinguishable).
      *   **The Conflict:** Acknowledge the dissent. Validate their concern (it's not just bureaucracy, it's about truthfulness).
      *   **The Philosophical Bit (Plain English):** Discuss what makes the object "itself." Is it the atoms or the story? Use the database analogy the user understands. The accession number tracks the *history*, not just the matter.
      *   **The "Same Wood" Claim:** Address the lab's claim. It's biologically similar but historically new material. It's not the *same* wood that the artist touched, even if it's the same tree DNA.
      *   **The Recommendation:** Approve the treatment but with strict cataloguing conditions. Keep the accession number (continuity of history) but add a permanent, visible note in the record and potentially on the display label about the extent of replacement.
      *   **The Deaccessioning:** Address the dead wood. It shouldn't just be discarded; it's the only true original material left. It needs to be preserved as evidence.
      *   **Timeline:** Urgent due to funding.
      *   **Closing:** Call for consensus.

  5.  **Refining the Tone:**
      *   Needs to sound like a committee member, not an outside consultant.
      *   Needs to sound like someone who knows databases (using that as a grounding metaphor).
      *   Avoid philosophical jargon (no "ontological," "mereological," "Ship of Theseus" unless explained simply).
