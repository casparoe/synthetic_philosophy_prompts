              *   **Rule:** Residents *must* answer questions about the Hider's location with "Yes," "No," or "Pass."
              *   **Payoff:** If Hider is found, everyone loses points. If Hider survives, everyone gains points.
              *   **The Kicker:** If *anyone* lies (verified afterwards), the "Truth Rule" changes for the next round. The Instructor is no longer bound to believe *anyone*. He can search *any* house without asking. Lying removes the *procedural constraint* on the Seeker.
              *   **Why this works:** It shows that lying doesn't just mislead the murderer; it removes the *obligation* the murderer had to ask. It shifts the state of nature from "Rule-Governed Inquiry" to "Brute Force Search." This mirrors the Kantian idea that lying damages the standing of assertion itself.

  4.  **Developing the Mechanics (Drafting the Plan):**
