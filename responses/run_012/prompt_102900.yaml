      *   *Critique:* This is still consequentialist (weighing lives vs. trust).
      *   *Pivot:* How to make it feel like a *violation of standing*?
      *   *New Idea:* "The Chain of Custody." Students pass information. The rule is: "You must state what you know." If you lie, you break the chain. The "Murderer" is the Instructor trying to find a hidden object.
      *   *Best Idea:* **"The Neighborhood Watch."**
          *   **Setup:** 16 students. 4 "Households" (groups of 4).
          *   **Goal:** Protect the "Refugee" (hidden among households).
          *   **Threat:** The Instructor (The Inquirer) knocks on doors.
          *   **Mechanic:** Households must issue "Bulletins" (written statements) about where the Refugee is *not*.
          *   **The Twist:** The value of a Bulletin depends on the *history* of truth-telling in the Neighborhood.
          *   **The Kantian Hook:** Lying saves the Refugee *this time*, but invalidates the *medium* of the Bulletin for *all* households in future rounds. Silence (refusing to issue a Bulletin) is allowed but leaves the Refugee vulnerable to search.
          *   **Wait, still too consequentialist.** I need to make the *act* of lying feel structurally different from the *outcome*.
          *   **Final Design Choice:** **"The Protocol."**
              *   Students are operators in a communication network.
              *   They must transmit signals (True/False/Null).
