              *   The "Victim" is the integrity of the Network.
              *   Actually, let's stick closer to the "Murderer at the Door" metaphor but multiply it.
              *   **Activity:** "The Open Door Policy."
              *   **Roles:** Residents (Students), Seeker (Instructor), Hider (One Student).
