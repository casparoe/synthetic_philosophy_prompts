      *   *The Intuition:* Lying to save a life is obviously right.
      *   *The Kantian Twist:* The wrong isn't to the murderer (who deserves no truth); the wrong is to the *institution of communication*.
      *   *The Loophole:* You don't have to answer (silence is okay).
      *   *The Challenge:* How to make "injury to the institution" feel real in a 90-minute class without just simulating consequences (which leads to utilitarianism)?
      *   *Key Insight:* If the game relies on points/payoffs, students will just calculate utility. To capture the *deontological* feel, the "cost" of lying must be structural and irreversible to the *system* of the game, not just a point deduction for the individual. The "trust" must be a shared resource that degrades for *everyone* when *one* person lies, regardless of the immediate outcome.

  3.  **Brainstorming the Activity:**
      *   *Idea 1: Secret Role Game (Werewolf style).* Too much focus on detection.
      *   *Idea 2: Message Relay.* Passing notes. If one lies, the chain breaks. Good, but maybe too abstract.
