          *   In the drowning case, all parties have a positive claim to be saved. Aggregation applies to competing positive claims.
          *   In the surgeon case, the one healthy patient has a negative right *not to be killed*. The five dying patients have a positive claim to be saved. Negative rights usually trump positive claims, regardless of numbers. Or, we invoke the "means vs. side-effect" distinction (Doctrine of Double Effect).
          *   So, dropping (4) does *not* force the surgeon conclusion, provided we introduce a constraint on *how* claims are aggregated (e.g., rights-constraints).

  5.  **Alternative Path (Accepting the Conclusion):**
