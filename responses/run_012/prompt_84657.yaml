      *   **Goal:** Use the film to teach the arrow of time, specifically the Past Hypothesis (PH), time-reversal invariance of micro-laws, and the asymmetry of records/causation.
      *   **Concern:** The film might teach false physics/philosophy.
      *   **Specific Frame:** Micro-laws are T-invariant (Loschmidt); Arrow comes from Boundary Conditions (PH); Records/Memory/Causation are downstream of PH. Suspicion of the "double standard" regarding fixed past/open future.
      *   **Specific Questions:**
          1.  Coherence of "inverting entropy" (charge vs. boundary condition).
          2.  Turnstile as machine vs. PH (engineerable arrow?).
          3.  Interaction problems (breathing, talking, records).
          4.  Determinism (block universe vs. dynamical passage).
      *   **Output Needed:** A "reading" of the film through this lens. Which clips to show, what to say, where it works, where it fails. Honest verdict if it's too muddled.

  2.  **Initial Assessment of *Tenet* vis-à-vis Phil of Physics:**
      *   *Tenet* is notorious for being physically incoherent. It mixes time travel (worldlines looping) with entropy reversal (thermodynamic arrow flipping).
      *   However, for *intro undergrads*, it's a goldmine of intuitions about time asymmetry.
      *   The user's specific frame (PH, T-invariance, Records) is the *correct* standard view (Albert, Loewer, Price).
      *   *Tenet* violates this view constantly, but those violations are exactly where the teaching moments are. It's not a model of the theory; it's a model of the *confusion* surrounding the theory.
      *   *Verdict:* It is usable, but *only* if treated critically. It cannot be shown as "this is how time works." It must be shown as "here is a popular conception of time reversal; let's break it."

  3.  **Addressing the User's Specific Questions:**

      *   **Q1: Entropy as Charge vs. Worldline Direction.**
          *   *Film:* Treats entropy like a charge (invert the sign). Also treats it as moving backwards along the time axis.
          *   *Physics:* Entropy is a macro-state property, not a local charge. You can't flip an electron's entropy. You can reverse momenta (T-transformation), but that requires a global conspiracy of boundary conditions to look like "reverse time."
          *   *Philosophy:* The film conflates $\frac{dS}{dt} < 0$ with moving from $t_2$ to $t_1$. In PH terms, an inverted object is just a subsystem with a *future* low-entropy boundary condition imposed on it.
          *   *Teaching Point:* Distinguish T-invariance of laws from the thermodynamic arrow.

      *   **Q2: The Turnstile vs. Past Hypothesis.**
          *   *Film:* A machine flips the arrow locally.
          *   *Physics:* You can't locally reverse the thermodynamic arrow without expending massive entropy elsewhere (Maxwell's Demon). The Turnstile acts like a boundary condition generator.
          *   *Philosophy:* The PH is a *global* constraint on the universe. The Turnstile suggests the arrow is *local* and *controllable*. This is the biggest divergence.
          *   *Teaching Point:* The Turnstile is a "Local Past Hypothesis" generator. It creates a subsystem where the "future" (for them) is our "past."

      *   **Q3: Interaction (Breathing, Talking, Records).**
          *   *Film:* Inverted people need masks (inverted air). Bullets jump back into guns.
          *   *Physics:* If you reverse momenta, you reverse interactions. An inverted photon hitting a normal eye? Disaster. Thermodynamic equilibrium would be violent.
          *   *Philosophy:* This touches on the *Records* problem. If my entropy runs opposite to yours, can we share information? Information is physical (Landauer).
          *   *Teaching Point:* The "Mask" scene is Nolan admitting that thermodynamic coupling is necessary. This is the best clip for the "Records/Causation" discussion.

      *   **Q4: Determinism.**
          *   *Film:* "What's happened, happened." Block universe.
          *   *Physics:* T-invariant laws + Boundary Conditions = Determinism (classically).
          *   *Philosophy:* The asymmetry of counterfactuals (Lewis) explains why we *feel* the future is open even if it isn't. The film gets the metaphysics (block) right but the phenomenology wrong (inverted people remember *our* future).
          *   *Teaching Point:* The "Temporal Pincer" relies on epistemic asymmetry, not ontological openness.

  4.  **Structuring the Session:**
      *   **Intro:** Set the stage (Micro-laws vs. Macro-arrow).
      *   **Clip 1: The Turnstile/Explanation.** (Focus: Entropy as a local property).
      *   **Clip 2: The Inverted Bullet/Gun.** (Focus: Causation and Records).
