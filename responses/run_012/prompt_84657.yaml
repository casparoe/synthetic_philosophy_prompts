answer: |-
  Here is the honest verdict: **Use the film, but treat it as a pathology report, not a textbook.**

  *Tenet* is physically incoherent, but its incoherencies are philosophically fertile. It conflates time-reversal symmetry ($T$-invariance) with thermodynamic reversal ($\frac{dS}{dt} < 0$), and it treats the arrow of time as a local property rather than a global boundary condition. However, for undergrads, it visualizes the *consequences* of the Past Hypothesis (PH) better than any diagram you could draw. It forces them to confront why "records" and "causation" feel asymmetric.

  Here is the breakdown of your four questions, followed by a concrete lesson plan.

  ### Part 1: The Physics/Philosophy Breakdown

  **1. Entropy as Charge vs. Worldline Direction**
  *   **The Film:** Treats entropy like a quantum number (spin up/spin down) that can be flipped on a single object.
  *   **The Reality:** Entropy is a macro-state property of a system, not a local charge. You cannot invert the entropy of a bullet without inverting the momenta of all its constituent particles.
  *   **The Philosophical Hook:** The film conflates (a) reversing the time parameter in the equations ($t \to -t$), (b) reversing the thermodynamic gradient ($\nabla S$), and (c) reversing subjective experience.
  *   **The Win:** Surprisingly, the film gets the **Psychological Arrow** right. Inverted characters remember what we call the "future." This aligns with the standard view (Albert/Price): memory formation is a thermodynamic process. If your brain's entropy runs backwards relative to us, your memories will track *our* future. This is your strongest teaching point: memory is downstream of entropy, not magic.

  **2. The Turnstile vs. The Past Hypothesis**
  *   **The Film:** The Turnstile is a machine that locally engineers the arrow.
  *   **The Reality:** You cannot locally reverse the thermodynamic arrow without exporting entropy elsewhere (Maxwell's Demon). The Turnstile acts as a **Local Past Hypothesis Generator**. It imposes a low-entropy boundary condition on the "future" end of the object's worldline.
  *   **The Philosophical Hook:** The PH is a constraint on the *universe*, not a device. The film suggests the arrow is controllable.
  *   **The Win:** It visualizes what a "Future Hypothesis" would look like. If the universe had a low-entropy boundary condition in the *future* (a Big Crunch), subsystems near that boundary would behave exactly like the inverted objects in *Tenet*. The Turnstile is a miniature Big Crunch.

  **3. Interaction and Records**
  *   **The Film:** Inverted people need masks (inverted air); inverted bullets must be caught, not fired.
  *   **The Reality:** If a reverse-arrow system interacts with a forward-arrow system, they try to equilibrate. This would be violent (infinite temperature gradient).
  *   **The Philosophical Hook:** This addresses the **Records Problem**. A "record" is a correlation between a present state and a past state, stabilized by entropy increase. If my arrow runs opposite to yours, I cannot leave a record in your world without destroying the gradient that makes me "inverted."
  *   **The Win:** The "Mask Scene" is Nolan admitting that thermodynamic coupling is necessary. It shows that causation isn't just "billiard balls hitting"; it's thermodynamic interdependence. You can't have cross-arrow causation without a medium that supports both gradients (which the film says doesn't exist).

  **4. Determinism and the "Fixed Past"**
  *   **The Film:** "What's happened, happened."
  *   **The Reality:** Classical micro-laws + Boundary Conditions = Determinism.
  *   **The Philosophical Hook:** The asymmetry of counterfactuals (Lewis). We think the future is open because we lack records of it, not because it is ontologically unsettled.
  *   **The Win:** The **Temporal Pincer** is a perfect metaphor for epistemic asymmetry. The Red Team (forward) and Blue Team (inverted) have access to different "records." The Commander has *both*. This dramatizes that "openness" is just a lack of information caused by the entropy gradient.

  ---

  ### Part 2: The Lesson Plan (90 Minutes)

  **Goal:** Move from "Time Travel is cool" to "The Arrow of Time is a Boundary Condition."

  #### **Segment 1: The Setup (15 mins)**
  *   **Clip:** The Opera House siege (start) → The Protagonist is saved by the inverted soldier with the red tag.
  *   **Context:** Show the inverted bullet hole appearing in the glass *before* the shot is fired (from our perspective).
  *   **Discussion Point:** **T-Invariance vs. Thermodynamic Arrow.**
      *   *Ask:* "The micro-laws of the bullet's motion are time-reversible. If I film this and play it backwards, is it physically illegal?" (Answer: No).
      *   *Pivot:* "So why does this look wrong to us? Because we never see glass reassemble. Why?"
      *   *Lecture:* Introduce Loschmidt. Micro-laws don't care about direction. The arrow comes from statistics + Boundary Conditions (The Past Hypothesis).
      *   *Critique:* In *Tenet*, the arrow is local. In reality, the arrow is global. The inverted soldier isn't from a different time; he's from a subsystem with a *different boundary condition*.

  #### **Segment 2: The Mechanism (20 mins)**
  *   **Clip:** Barbara (the scientist) explains the Turnstile. "This is not time travel... it's inversion." She shows the gloves moving backwards.
  *   **Discussion Point:** **Entropy as Charge vs. Boundary Condition.**
      *   *Ask:* "She says they invert the object's entropy. Is entropy a property of the object, like mass?"
      *   *Correction:* Entropy is a relationship between a micro-state and a macro-state description. You can't flip it on a single object without flipping the momenta of its parts.
      *   *The Turnstile:* Frame the Turnstile not as a time machine, but as a **Boundary Condition Imposer**. To invert the object, the machine must know the exact micro-state of the object's future. It is effectively imposing a "Future Hypothesis" on that object.
      *   *Key Insight:* The film treats the arrow as *engineerable*. The PH tells us the arrow is *contingent*. We are lucky the past was low entropy. The film suggests we could build a machine to make the future low entropy.

  #### **Segment 3: Interaction and Memory (25 mins)**
  *   **Clip:** The Highway Chase (inverted car flips back upright) OR The Turnstile entry (Protagonist puts on the mask/oxygen).
  *   **Discussion Point:** **The Records and Causation Asymmetry.**
      *   *Focus on the Mask:* Why does he need the mask?
      *   *Argument:* If his thermodynamic arrow runs opposite to the air, breathing would equilibrate them instantly. He needs "inverted air" to maintain his gradient.
      *   *The Deep Cut:* This solves the "Communication Problem." If I run backwards and you run forwards, can we talk?
          *   *Film:* Yes, but it's hard (they use written notes mostly).
          *   *Phil:* No. To leave a record in your brain, my signal must increase your entropy. But to me, that signal is coming from my future.
      *   *Memory:* Remind them: The inverted characters remember *our* future.
      *   *Takeaway:* Memory tracks the thermodynamic gradient. There is no "psychological arrow" independent of the thermodynamic arrow. This validates the "downstream" view you want to teach.

  #### **Segment 4: Determinism and The Pincer (20 mins)**
  *   **Clip:** The Final Battle briefing. "We have intel from the future." The Temporal Pincer movement.
  *   **Discussion Point:** **The Fixed Past and Epistemic Access.**
      *   *Ask:* "Why can't the Protagonist change the past?" (Slogan: "What's happened, happened.")
      *   *Argument:* Is this a law of physics, or a law of narrative?
      *   *Philosophy:* Connect to Huw Price or David Lewis. The past isn't fixed because of magic; it's fixed because we have *records* of it. The future isn't open because of magic; it's open because we lack records.
      *   *The Pincer:* The Pincer works because the Blue Team has "records" of the battle (from their perspective, it's the past). The Red Team does not.
      *   *Conclusion:* The "openness" of the future is just ignorance caused by the entropy gradient. If you had the Blue Team's access, the future would look as fixed as the past.

  #### **Segment 5: Synthesis (10 mins)**
  *   **The Double Standard:**
      *   Bring it back to your opening frame. We explain the fixed past by appealing to traces/records. But traces only exist *because* of the entropy gradient.
      *   *Tenet* shows us a world where the gradient is locally flipped. Suddenly, *our* future becomes *their* fixed past.
      *   **Final Punchline:** The film proves that "fixedness" is relative to the entropy gradient. There is no metaphysical "flow" of time. There is just the distribution of matter and the boundary conditions. The Turnstile doesn't reverse time; it reverses the gradient that gives time its shape.

  ### Where You Must Stop Them (The "No" List)

  1.  **"Entropy is a charge."** Stop them immediately. Entropy is statistical. You reverse momenta, not "entropy units."
  2.  **"The Turnstile reverses time."** No. It creates a subsystem with a future boundary condition. The rest of the universe keeps ticking forward.
  3.  **"Inverted people experience time backwards."** Clarify: They experience time *forwards* relative to their own entropy. Their "now" moves along their worldline from their low-entropy end to their high-entropy end. It just happens to be opposite to ours.
  4.  **"This proves time travel is possible."** No. This is a visualization of Time-Symmetry + Boundary Conditions. It's a thought experiment, not a blueprint.

  ### Recommended Reading for You (to prep the nuances)
  *   **Huw Price, *Time's Arrow and Archimedes' Point*:** Specifically the chapters on the "Archimedean Point" and why we shouldn't privilege the forward direction. This matches your "double standard" worry perfectly.
  *   **David Albert, *Time and Chance*:** For the clear distinction between the micro-dynamics and the Past Hypothesis.
  *   **Sean Carroll, *From Eternity to Here*:** (Skip the pop-sci fluff, check the chapters on entropy and memory) for the "why we remember the past" argument.

  ### Final Verdict
  *Tenet* is too muddled to teach *physics*, but it is excellent for teaching *philosophy of time*. It makes the abstract consequences of the Past Hypothesis visceral. If you frame it as "Here is what the world looks like if we treat the Arrow as local rather than global," you can use every error in the film to reinforce the correct view.

  **Your mantra for the night:** "The film gets the *phenomenology* of the arrow right (memory, records, fixedness), but the *ontology* wrong (local vs. global, charge vs. statistic). Let's use the phenomenology to understand why we need the Past Hypothesis."
