      *   *Resolution:* The "test" isn't about changing the future (you can't). It's about changing your *attitude* toward the past/present. It's about *Amor Fati*. The repetition makes the attitude crucial. If you resent life, you suffer eternally. If you love it, you rejoice eternally. The "choice" is the stance, not the event.
