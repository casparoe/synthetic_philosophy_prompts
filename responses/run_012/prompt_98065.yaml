  There is a wrinkle I want the session built around, and I haven't worked out how to sequence it. A colleague keeps pressing a line I find genuinely useful: she claims that what gets taught as "naturalism" is not one view but at least two, and that the live disagreement is not naturalism against normativism but between two rival naturalisms — one that ties biological function to the statistical typicality of a reference population, another that ties it to contribution to fitness — and that the two come apart on a specific cluster of cases: contraception, aging, and a benign anatomical variant that harms nothing. I want the students to feel that split arise from the cases themselves rather than be handed it as a taxonomy. So please lay out, in order, the ideas that must be in place before the split can even be stated (I suspect they need some working notion of biological function first, and something about what makes a judgment evaluative, but tell me if that ordering is wrong), the single example that should carry the whole session and what it must have and lack, the example I should deliberately hold back until late and why, the misconceptions you would expect this particular audience to arrive with — my guesses are "naturalism means disease is simply a scientific fact," "normativism means disease is arbitrary or merely socially constructed," and "this is really about whether doctors should be value-neutral in practice" — and the exact point in the sequence where each should be headed off, one question to ask near the end that would reveal whether they have grasped the distinction rather than memorized two labels, and what I should openly refuse to cover at this level. Flag anywhere my own framing is likely to mislead them, and note any place where the clinicians in the room will predictably object before the students do.
