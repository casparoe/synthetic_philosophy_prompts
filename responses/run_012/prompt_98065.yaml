answer: |-
  Here is a teaching plan designed for a 90-minute session. It prioritizes the dependency structure of the concepts to ensure the "Naturalist Split" emerges organically from the cases rather than being imposed as taxonomy.

  ### 1. The Dependency Structure (The Logical Scaffolding)
  Do not present the theories (Naturalism, Normativism, Biostatistical Theory) as labels first. Present them as *solutions to problems* that arise in sequence. If you reverse this order, students will memorize definitions without feeling the philosophical pressure that generates them.

  1.  **The Extension Problem:** Before defining "disease," students must agree on *which things* count. (Presupposition: We need a stable extension to test our intensions).
  2.  **The Evaluative Intuition:** Students naturally define disease as "bad." (Presupposition: Normativism is the default folk view).
  3.  **The Objectivity Constraint:** Clinicians and scientists resist "bad" because it seems subjective/political. They want "broken." (Presupposition: Naturalism arises as a reaction to Normativism's perceived arbitrariness).
  4.  **The Function Concept:** To define "broken," you need "function." (Presupposition: Naturalism depends on a prior account of biological function).
  5.  **The Reference Class Problem:** To measure function, you need a baseline. Is the baseline *what is common* (Statistics) or *what was selected for* (Fitness)? (Presupposition: This is where the Naturalist Split lives).
  6.  **The Normative Return:** Even if we agree on function, does functional failure *necessarily* entail disease? (Presupposition: Normativism returns to complicate the Naturalist consensus).

  **Teaching Implication:** Do not introduce the term "Naturalism" until step 3. Do not introduce the "Statistical vs. Fitness" distinction until step 5.

  ### 2. The Single Carrying Example: **Aging (specifically Presbyopia/Menopause)**
  Use **Aging** to carry the session from minute 0 to minute 75.
  *   **What it must have:** It must be universal (100% prevalence eventually), progressive, and involve functional decline (vision worsens, fertility stops), yet be considered "normal" in common parlance.
  *   **What it must lack:** It must lack a clear "external cause" (like a virus) to prevent students from dismissing it as "injury" rather than "disease."
  *   **Why:** Aging forces the conflict immediately.
      *   *Normativist:* It limits life plans (bad) → Disease?
      *   *Naturalist:* It is universal (statistically normal) → Not Disease?
      *   *Evolutionary:* It reduces fitness (functional decline) → Disease?
      *   It keeps the clinicians engaged (they treat age-related decline) and the bioethicists engaged (resource allocation for aging vs. cure).

  ### 3. The Example to Hold Back: **Contraception (specifically Hormonal Infertility)**
  *   **When to reveal:** Minute 75 (the final 15 minutes).
  *   **Why:** Contraception introduces **intentionality**.
      *   If you introduce it early, students will conflate "Dysfunction" with "Unwanted State." They will argue that contraceptive-induced infertility isn't a disease because it is *chosen*, not because of the biological function status.
      *   By holding it back, you force them to first settle the *biological* status of infertility using the Aging case (Is loss of reproductive function a disease?).
      *   Once they have committed to a definition of function (Stats vs. Fitness) based on Aging, Contraception acts as the stress test.
      *   *The Trap:* Statistical Naturalists must call contraceptive infertility a "disease" (it is a deviation from species-typical function). Fitness Naturalists must also call it a "disease" (it blocks reproduction). Normativists call it "health" (it promotes autonomy). This triad reveals that the "Naturalist" label hides two distinct commitments that yield the same result here, but diverge on the *Benign Variant* (which you can mention briefly as a footnote if time permits, but Contraception is the stronger ethical hook for this audience).

  ### 4. Anticipated Misconceptions & Intervention Points

  | Misconception | Why it arises | When to head it off | How to head it off |
  | :--- | :--- | :--- | :--- |
  | **"Naturalism means disease is simply a scientific fact."** | Students hear "natural" and think "objective truth." | **Minute 20** (when introducing Function). | Emphasize that choosing the *Reference Class* (e.g., "all humans" vs. "males over 50") is a **value judgment**, not a scientific one. Science tells you the stats; philosophy chooses the baseline. |
  | **"Normativism means disease is arbitrary or merely socially constructed."** | Students equate "value" with "opinion." | **Minute 10** (during Evaluative Intuition). | Distinguish *subjective preference* from *objective harm*. Pain is a value-laden concept but not arbitrary. Normativism claims harm is real, not that it is invented. |
  | **"This is really about whether doctors should be value-neutral in practice."** | Clinicians and ethicists conflate *ontology* with *professional ethics*. | **Minute 5** (Introduction). | **Explicitly refuse** to discuss clinical neutrality. State: "We are asking what disease *is*, not how doctors should *act*. A condition can be a disease even if a doctor ought not treat it, and vice versa." |

  ### 5. Clinician Objections (Predictive Mapping)
  The two clinicians auditing will object before the students do. Anticipate this to validate their expertise without letting it derail the metaphysics.

  *   **The Objection:** "If you define Aging out of diseasehood (because it's statistically normal), you deny my patients access to treatment/insurance."
  *   **When:** Minute 40 (when the Biostatistical Theory implies Aging isn't a disease).
  *   **Management:** Acknowledge the stake immediately. "You are highlighting the *normative consequence* of the definition. That is exactly why the definition matters. But does the *consequence* determine the *truth*? Or does the truth determine the *consequence*?"
  *   **The Trap:** Clinicians often slide into Normativism ("It's a disease because I treat it"). Push them: "If you found out tomorrow that insurance would pay for it even if it was 'normal aging,' would you still call it a disease? Why?"

  ### 6. The Diagnostic Question (Minute 85)
  Do not ask: "What is the difference between Naturalism and Normativism?" (They will recite definitions).
  Ask this instead:

  > **"Imagine a genetic trait that causes 10% of the population to die at age 40. It is statistically 'abnormal' (most live to 80), but it is an inevitable part of that subgroup's biological design (like salmon spawning). Is this a disease?"**

  *   **What this reveals:**
      *   If they say **Yes** because it causes death/harm: They are **Normativists**.
      *   If they say **Yes** because it deviates from the species average: They are **Statistical Naturalists** (Boorse).
      *   If they say **No** because it is the selected/typical function for that subgroup (fitness is maximized within the constraint): They are **Fitness Naturalists** (Evolutionary).
      *   *Success:* If you get a split in the room based on these reasonings, they have grasped the internal Naturalist rift.

  ### 7. What to Openly Refuse to Cover
  You have 90 minutes. To make the Naturalist Split land, you must cut the following:
  1.  **The History of the Debate:** Do not teach Canguilhem, Englehardt, or the 1970s context. It adds baggage without aiding the logical dependency.
  2.  **Mental Disorder:** Do not let the session drift into psychiatry. It introduces "mind" complexities that obscure the "biological function" mechanics you need for the Stats vs. Fitness split.
  3.  **The "Enhancement" Debate:** Students will want to ask, "If we cure aging, is that enhancement?" Shut this down. It presupposes the definition of disease you are trying to establish.

  ### 8. Framing Flags (Where Your Own Expertise Might Mislead)
  *   **The "Boorse" Trap:** As a PhD student, you know Boorse's Biostatistical Theory is the target. Do not teach "Boorse." Teach "The Statistical Intuition." If you name-drop Boorse too early, students will treat it as "Author A says X" rather than "Logic B requires Y." Keep the theory anonymous until the end.
  *   **The "Function" Ambiguity:** You know the difference between *Causal Role* and *Selected Effect* function. Do not introduce these terms. Use "What it does" vs. "What it is for." Introducing the etiological/selected-effect distinction too formally will cause the MA students to glaze over before they reach the core split.
  *   **The "Clinician" Dynamic:** Do not let the clinicians become the "authority" on what counts as disease. Their authority is clinical, not ontological. If a clinician says, "In practice, we call this a disease," reply, "In practice, you call it a *billable code*. We are asking if it is a *biological kind*."

  ### 9. Minute-by-Minute Flow (Summary)
  *   **00–10:** **Intuition.** (Aging case). Is it a disease? Vote.
  *   **10–25:** **Normativism.** (Develop the "Harm" argument). Head off "Arbitrariness" misconception.
  *   **25–40:** **Naturalism.** (Develop the "Broken Function" argument). Head off "Scientific Fact" misconception. Clinician objection on treatment access.
  *   **40–60:** **The Crack.** (Reference Classes). Is "Normal" what is *common* or what is *fit*? Use Aging to show the divergence (Universal vs. Decline).
  *   **60–75:** **The Split.** Formalize the two Naturalisms.
  *   **75–85:** **The Test.** Introduce Contraception. Apply the two Naturalisms. Do they agree or diverge?
  *   **85–90:** **Diagnostic Question** & Wrap.

  This structure ensures the "Naturalist Split" is the *solution* to the confusion generated by the Aging case, rather than an arbitrary taxonomy handed to them at the start.
