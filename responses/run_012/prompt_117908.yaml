      *(Refining the Staff Case)*: The physician says the dose brings her to where colleagues are. This sounds like enhancement relative to peers. But the test is relative to *self*. If she has a diagnosis, she likely has a deficit. If the meds restore her to *her* normal, it's treatment. If it pushes her to *super*-normal for her, it's enhancement. I will recommend approving contingent on proof that this dose restores her historical baseline, not exceeds it. This distinguishes her from the student who has no baseline deficit.

