          *   *Application to Appeal 2 (Student):*
          *   Step 1: No diagnosis. Wants meds for exam prep. This is clearly moving past his previous level (unmedicated state). He has no history of needing this for baseline functioning. So it fails Step 1 (it moves past previous level).
