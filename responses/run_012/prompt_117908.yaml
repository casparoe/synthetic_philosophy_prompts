answer: |-
  Colleagues, I am writing to recommend that we adopt a new standard for evaluating coverage requests involving cognitive medication and that we apply this standard immediately to the two appeals on our agenda for Tuesday. Specifically, I propose that we vote to approve the staff member's appeal contingent on documentation that the requested dose restores her to her own historical baseline of functioning, and that we deny the doctoral student's appeal on the grounds that his request constitutes a claim about structural competitive demands rather than a medical need. To manage the transition, I recommend we allow any current plan participants already prescribed doses above the published ceiling a grace period of twelve months to either justify their regimen under this new test or transition to a covered alternative, after which the new standard will apply universally. This approach replaces the medical director's proposal of comparing patients to population norms with a two-step test that first asks whether the intervention restores or maintains the individual's own prior trajectory rather than moving them past it, and second, where the intervention does move them past their prior trajectory, asks whether the benchmark they are trying to meet is set by their biology or by a competitive arrangement maintained by the university, such as an exam curve or a workload expectation, treating the latter as a policy claim rather than a medical one.

  The reason I urge this shift is that the medical director's test, which asks whether a dose returns a person to the range of functioning typical for their age and sex, asks biology to answer a question it cannot settle. There is no stable biological norm for attention or cognitive endurance that maps cleanly onto the demands of modern academic work, and attempting to find one forces us into the very distinction between treating disease and improving the healthy that our panel has already agreed is untenable in practice. A population average tells us nothing about whether a specific employee is disabled or merely ambitious, because functioning is always relative to the task at hand. My proposed test avoids this trap by anchoring the assessment in the individual's history rather than the population's median. The first step requires us to look at the person's own trajectory to determine if the medication is restoring them to a level they have previously occupied or holding them there against a decline, versus moving them past anything they have had before. This respects the medical reality that for some, a higher dose is necessary to return to a baseline lost to tolerance or progression, while for others, it is a bid for new capability. The second step acknowledges that when a request is for new capability, we are no longer talking about health but about fairness. If the level they are trying to reach is determined by a competitive arrangement we ourselves maintain, such as a qualifying exam curve that forces students to chemically optimize just to remain viable, then the appeal is not about the student's health but about the university's standards. By treating such requests as claims about the arrangement, we stop pretending the health plan can solve structural problems with pharmaceuticals.

  Applying this to the two cases before us yields determinate answers that distinguish the staff member from the student without relying on the presence or absence of a diagnostic code. For the staff member, the physician's argument is that the higher dose brings her up to where her colleagues are, not past them. Under the first step of my test, we must verify if this dose restores her to her own historical baseline. If she has a long-standing diagnosis, she likely has a documented history of functioning with or without treatment. If the evidence shows that this dose is required to maintain the level of functioning she held before her condition worsened or before tolerance developed, then she passes the first step and should be covered, regardless of whether that level matches her colleagues. The key is that she is not seeking to exceed her own prior capacity, but to recover it. For the doctoral student, the situation is fundamentally different. He has no diagnosis and no history of requiring medication to function. His request is explicitly to perform at a level required by his work during exam preparation, which implies moving past his unmedicated trajectory. This fails the first step. Consequently, we move to the second step, which asks whether the benchmark is biological or structural. Qualifying exams are a structural arrangement, often curved or standardized to filter candidates. His claim is that without chemical assistance he cannot meet the bar set by this arrangement. This is a claim about the exam structure and the pressure it exerts, not a medical claim about his body. Therefore, his request should be denied as a health benefit, and referred instead to the graduate school as a question of accommodation policy or exam design.

  I anticipate the strongest objection to this proposal will come from those who worry that it replaces a clear medical standard with a vague administrative burden that invites inconsistency and gaming. Critics will argue that determining a patient's own trajectory is far more intrusive and difficult than comparing them to a population norm, as it requires deep dives into medical history that may not exist or may be ambiguous, leaving the panel to arbitrate subjective claims about past functioning. Furthermore, they will argue that the second step dangerously expands our remit, asking a health panel to make judgments about university policy and competitive fairness, which we are neither equipped nor authorized to do. There is also the concern that this creates a two-tier system where those with a documented history of disability gain access to enhancements that are denied to others with similar needs but no prior diagnosis, effectively penalizing late bloomers or those who lacked access to care earlier in life. This objection contends that my proposal relocates the problem from the medical director's office to the human resources and graduate school offices without actually solving the resource constraint, while adding layers of bureaucratic friction that delay care and increase liability.

  My response to this objection is to acknowledge that it does relocate the problem, but to argue that the new location is more tractable and honest than the old one. The current system pretends that coverage decisions are purely medical when they are actually distributive, hiding policy choices behind clinical language. By moving the question of structural demands to the units that set those demands, we force the university to own the consequences of its competitive arrangements. If qualifying exams require stimulant medication to pass, that is a problem for the graduate school to address, not the health plan to subsidize. Regarding the administrative burden, while assessing individual trajectory is more work than checking a population chart, it is less arbitrary than defining normalcy, and we can mitigate the burden by requiring standardized documentation of prior functioning from treating providers rather than conducting investigations ourselves. As for the inequality concern, it is true that history matters in this model, but disability accommodation has always been about restoring access to those who have lost it, not equalizing all desires for enhancement. The distinction between restoring a lost baseline and building a new one is ethically significant, even if the line is sometimes hard to draw. Relocating the problem to policy makes it visible and debatable, whereas hiding it in medical necessity makes it invisible and unchallengeable.

  On Tuesday, I ask that we vote to adopt this two-step test as the governing standard for cognitive medication appeals effective immediately for new requests and following the twelve-month grace period for existing patients. We should then apply this test to the pending appeals by voting to approve the staff member's request subject to the verification of her historical baseline, and to deny the student's request with a referral to the graduate school regarding exam accommodations. This course of action allows us to resolve the immediate cases without relying on a flawed notion of typical functioning, sets a clear precedent for future appeals, and begins the work of separating medical need from structural pressure in a way that is consistent with our role as stewards of both employee welfare and plan sustainability. I believe this offers the most principled path forward given the constraints we face, and I look forward to discussing it with you further when we meet.
