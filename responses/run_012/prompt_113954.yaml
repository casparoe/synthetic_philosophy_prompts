answer: |-
  Here is a defended agenda for your prospectus, ranked by upstream dependency, philosophical tractability, and practical impact.

  ### 1. Assessment of Your Friend's Framework
  **Verdict:** The (a)/(b) split is **coherent and necessary**, but it is a hypothesis, not a conclusion.

  It is not merely a relabeling of standard distinctions. It maps onto the philosophical difference between *intrinsic constitutive properties* (material/maker) and *extrinsic historical properties* (provenance/causal chain). Standard literature often conflates these under "authenticity," leading to the confusion your friend identifies.

  However, her stronger claim—that "the original" is purely an institutional role and not a natural kind—is the high-risk, high-reward engine of this project. If she is right, the question "Is this object real?" is a category error; the only valid question is "Does this object satisfy the criteria for the role of 'original' in Context X (Legal, Aesthetic, Market)?"

  **Recommendation:** Do not assume her framework is true. Make *testing* that framework your primary philosophical task. If you assume it, you are doing sociology; if you test its logical coherence and explanatory power, you are doing philosophy.

  ---

  ### 2. The Ranked Research Agenda
  Here are the five questions that matter, ordered by how much other work depends on them (Upstream), how well a philosopher can tackle them alone (Tractability), and whether an answer changes practice (Impact).

  #### **Q1. Is "Authenticity" a Univariate Property or a Functional Cluster?**
  *   **The Question:** Is there a single property of "authenticity" that objects possess, or is it a cluster concept where different contexts (law, aesthetics, market) weight the (a) Ontological and (b) Biographical criteria differently?
  *   **Why First:** This is the most upstream question. If authenticity is a functional cluster (your friend's "institutional role" claim), then the entire debate about "perfect forgeries" dissolves because there is no single standard to fail. You cannot answer Q2–Q5 without settling the logic of Q1.
  *   **Tractability:** High. This is conceptual analysis. You can test it against case law, auction house disclaimers, and conservation charters without leaving the library.
  *   **Impact:** High. It forces museums and courts to specify *which* authenticity they are claiming, reducing equivocation in disputes.
  *   **Confidence:** 90%.

  #### **Q2. On What Basis Does Value Supervene on History Rather Than Material?**
  *   **The Question:** In the Van Meegeren case, the physical object did not change, but the value collapsed. Does value supervene on the *belief* in the history, or the *fact* of the history? If the fact matters, what is the mechanism? If the belief matters, is the value illusory?
  *   **Why Second:** Once you accept Q1 (that criteria vary), you must explain why the *Market* criterion weighs biography so heavily against ontology. This addresses the "value flip" directly.
  *   **Tractability:** High. This is philosophy of value and social ontology. It requires no lab work, only rigorous thought experiments and analysis of market behavior.
  *   **Impact:** High. This affects insurers and collectors. If value is based on belief, insurance models based on "objective" authenticity are flawed.
  *   **Confidence:** 85%.

  #### **Q3. What is the Minimum Causal Chain Required for Artistic Identity?**
  *   **The Question:** Your friend mentions 3D prints and generated images. At what point does a break in the causal chain (maker → object) destroy identity? Is it the hand of the artist, the artist's supervision, or the artist's concept?
  *   **Why Third:** This applies Q1 and Q2 to new media. It is downstream because you need to know what "identity" means (Q1) before you know when it is lost.
  *   **Tractability:** Medium. It requires keeping up with tech, but the philosophical work is analyzing the concept of "causal history" (similar to Kripke/Putnam naming theories).
  *   **Impact:** Medium-High. Crucial for museums dealing with digital preservation and replicas.
  *   **Confidence:** 80%.

  #### **Q4. Is Deception Constitutive of Forgery or Merely Contingent?**
  *   **The Question:** If I sell a fake Vermeer, explicitly labeling it "A Fake Vermeer," have I created a forgery? If the law says yes (fraud) but art history says no (study object), which definition governs the ethics?
  *   **Why Fourth:** This is an ethical/legal hinge. It depends on Q1 (which role are we playing?) but is narrower in scope.
  *   **Tractability:** High. Purely analytical and legal-philosophical.
  *   **Impact:** Medium. Affects legal statutes and museum acquisition ethics.
  *   **Confidence:** 90%.

  #### **Q5. When Does Material Intervention Constitute Identity Loss?**
  *   **The Question:** The Restoration problem. If 60% of the paint is new, is it the same object? Is this a Sorites paradox, or is there a categorical threshold?
  *   **Why Fifth:** This is the "Ship of Theseus" problem applied to museums. It is important but often becomes a stalemate of intuition. It is less upstream than Q1 because restoration presupposes we already know what object we are trying to preserve.
  *   **Tractability:** Medium. Hard to make progress without slipping into pure intuition-pumping.
  *   **Impact:** Medium. Affects conservation charters.
  *   **Confidence:** 75%.

  ---

  ### 3. Dynamic Factors: What Moves Questions Up or Down?
  You asked what would change this ordering. Monitor these three variables during your first year:

  1.  **The "Natural Kind" Test (Moves Q1 Up/Down):**
      *   *Move Up:* If you find that Law, Market, and Art History use *incompatible* definitions of "original" that cannot be reconciled, Q1 becomes the entire thesis. You prove your friend's "institutional role" theory.
      *   *Move Down:* If you find a core commonality (e.g., all three ultimately rely on the same causal chain), then Q1 is settled quickly, and you move to Q2 (Value) faster.

  2.  **The "Van Meegeren" Mechanism (Moves Q2 Up/Down):**
      *   *Move Up:* If you can demonstrate that value is tied to *narrative coherence* rather than physical fact, this upends economic models of art. This makes Q2 the most impactful.
      *   *Move Down:* If value turns out to be purely speculative (market sentiment), the philosophical progress is limited to "people are irrational," which is less fertile ground.

  3.  **The Digital Threshold (Moves Q3 Up/Down):**
      *   *Move Up:* If museums begin deaccessioning physical objects in favor of high-fidelity digital/fabricated stand-ins (as your friend suggests), Q3 becomes urgent policy.
      *   *Move Down:* If the market rejects digital stand-ins regardless of fidelity, Q3 remains theoretical.

  ---

  ### 4. What to Ignore (The "Fun" Traps)
  Your advisor is right: you need to avoid questions that are dead ends or require empirical data you can't get.

  *   **Ignore "The Aesthetic Experience of the Fake":** (The "Perfect Forgery" debate). Does a fake look as good as the original? This is psychological/empirical. You cannot measure "aura" or aesthetic pleasure from an armchair. It leads to stalemates between Goodman (cognitive) and Kantians (perceptual).
  *   **Ignore "Is Forgery Art?":** This is a definition game that depends entirely on your definition of "Art." It is too broad and distracts from the ontology of the *object*.
  *   **Ignore Technical Detection:** Do not try to solve how we catch forgers. That is science/forensics. Your job is to define what we are catching *once* we catch them.
  *   **Ignore the "Intent of the Forger":** Unless it ties directly to Q4 (Deception), the psychological state of the forger is less important than the institutional status of the object.

  ---

  ### 5. Confidence and Uncertainty
  **Overall Confidence:** I am **85% confident** that this agenda provides a viable, defensible path for a 3-year philosophical project that respects your constraints (no lab/museum access) while engaging with the practical realities of your program.

  **The One Point I Am Least Sure About:**
  I am least certain about the **Impact rating of Q1 (Functional Pluralism)**.
  *   *Reasoning:* While proving that "authenticity" is a cluster concept is philosophically robust, institutions (museums, courts) are resistant to conceptual nuance. They prefer binary labels (Real/Fake) for bureaucratic efficiency. You might prove that "original" is an institutional role, but you may fail to change how institutions *use* the role.
  *   *Risk:* Your thesis could end up being "Philosophically, these terms are distinct; Practically, everyone ignores us."
  *   *Mitigation:* To protect against this, ensure your prospectus emphasizes how clarifying these distinctions *reduces legal liability* or *insurance risk*. Frame the philosophy as risk management, not just categorization.

  ### Summary Recommendation for the Prospectus
  Commit to **Q1** as your primary research question, with **Q2** as the primary application case.
  *   **Title Idea:** *The Institutional Role of the Original: A Functional Pluralism of Authenticity.*
  *   **Thesis:** "Authenticity" is not a property of objects but a status assigned by institutional practices that weigh ontological and biographical criteria differently.
  *   **Defense:** This avoids the "aura" trap, utilizes your friend's distinction without relying on it as dogma, and is fully tractable for a philosopher working alone.

  If you can demonstrate that the "Van Meegeren Flip" is not a mystery of value but a predictable shift in institutional classification, you will have met your advisor's requirement for a question that "other questions hang off of."
