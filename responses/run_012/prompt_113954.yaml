prompt: |-
  I'm a second-year MA student in one of those interdisciplinary programs that's half philosophy, half museum studies, and I have to hand in a prospectus in about six weeks where I commit to one research question and defend why it's worth three years. The area is fakes and forgeries, but I don't want to write about the thing everyone writes about — whether a perfect forgery is as good as the original, aura, all that. My advisor keeps saying my job is to pick the questions that other questions hang off of, and to be honest with myself about which ones a philosopher can actually make progress on without a lab or a museum's cooperation. So what I really want from you is a defended agenda for this area: which open questions matter most, in what order, and why — not a survey of positions, and please don't give me a reading list, I can't get to the library till next month and I'd rather have the reasoning anyway.

  Where I'm at right now is mostly downstream of an argument a friend in the program keeps making. She used to be a conservator, so she's coming at this from the bench rather than from the literature, and she insists we should stop using "authenticity" as one thing and split it into (a) ontological authenticity — the object is what it purports to be, same maker, same materials, same date — and (b) biographical authenticity — the object has had the history it purports to have, the right chain of hands, the right trajectory through the world. Her view is that once you seperate them, most of the disputes people have about originals are really disputes about (b) dressed up as disputes about (a), and that this shows up most clearly in three cases she lumps together as one problem: restoration (the object is still the thing, but the history has been interrupted), museum replicas of repatriated or fragile objects — including the 3D-printed stand-ins that are now good enough to fool almost anyone — and generated images, where there's no interesting causal chain to the depicted scene at all. She also has a stronger claim I'm not sure I buy, which is that "the original" isn't a natural kind at all but an institutional role, and that the market, art history and the law assign that role by completely different criteria, so most of the philosophical literature is quietly assuming one unified role that doesn't exist. That last bit feels either really important or like a verbal trick and I can't tell which. (For what it's worth, the case that got me into this is the WWII-era Dutch forger who sold a fake Vermeer to Göring and was only caught because of the sale — the interesting part isn't the deception, it's that everyone's valuation of the object flipped overnight without the object changing at all.)

  Given that, I'd like you to rank the open questions in this area — say the five or six that actually matter, then put them in order — along three axes: how many other questions depend on this one being settled, how tractable it is for a philosopher working alone over about three years, and whether an answer would change what museums, courts, insurers or collectors actually do. Tell me explicitly what would move something up or down that ordering, and which of the questions I'd be better off ignoring even though they're fun. And be straight with me about whether the (a)/(b) split is even coherent — if the whole framing is confused, or if it's just a relabeling of distinctions that are already standard, say so instead of building on it to be helpful. Please also tell me how confident you are in each thing you claim, and single out the one point you're least sure about.
