          2.  **On What Basis Does Aesthetic/Economic Value Supervene on History?** (The Van Meegeren problem).
          3.  **What is the Necessary Causal Link for Artistic Identity?** (The digital/replica problem).
          4.  **Is Deception Constitutive of Forgery or Merely Contingent?** (The ethical/legal hinge).
