      *   *Claim:* Most disputes are about (b) disguised as (a).
      *   *Claim:* "The Original" is an institutional role, not a natural kind. Market/Law/Art History use different criteria.
      *   *Assessment:* This is actually a sophisticated version of the "cluster concept" of authenticity (like Nelson Goodman's "autographic" vs. "allographic" but more granular). It's not just relabeling; it addresses the *functional* divergence in how we treat objects. The "institutional role" claim aligns with Searle's institutional facts or Dickie's institutional theory of art, but applied to *objecthood*.
