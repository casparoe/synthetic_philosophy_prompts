prompt: |-
  Ok so I work on the risk desk at a mid-sized insurer — my job is to take the output of our cat and liability models and turn it into the single probability that goes into a pricing or reserving decision, and it has to be defensible to the chief actuary. The recuring problem is this. The model hands me a number that's supposed to be a chance, an objective probability of loss for a class of policies. But I always have other stuff in my head: a broker's remark, something in the news, backtesting that shows the model runs hot in one region, the fact that the one contract in front of me got flagged because it looked weird. Sometimes I nudge the number and sometimes I don't, and honestly right now it's pure vibes. I know there's a whole literature on deference to objective chance — the Principal Principle, admissible evidence, the difference between a chance and somebody's credence — but I've never seen it turned into something a working analyst can actually do.

  What I want is a decision procedure I can run in a couple of hours before the committee meets. Give me the questions in order, what counts as a satisfying answer to each, and for every branch say explicitly whether it ends in "use the model's number as-is," "you may deviate, and here's how to deviate," or "stop, this isn't a statistical question, a person has to own it." It has to handle the annoying cases: my extra info is about the model itself rather than about the world (so I think the model is miscalibrated); the "chance" I've been handed is really a vendor's expert judgement laundered into a percentage; the model's number is for a reference class and the thing in front of me got singled out precisely because it's an outlier; and the plain case where I have genuine evidence the model didn't have. Then run it end to end on three situations I actually keep hitting — a windstorm-exposed commercial property, a liability line where backtesting says we're pricing too high, and a one-off bespoke policy where the "probability" came from a broker's gut. At least one of the three should land somewhere I won't like, and I want you to say so out loud rather than smoothing it over. Also tell me where the procedure will misfire, and where two reasonable analysts would run the same steps and still disagree.

  One more thing: be upfront about which parts of this are settled and which are genuinely contested among people who know the area — I don't want a contested reading of deference handed to me as if it were the consensus, because I'll be repeating it to actuaries. No reading list or citations, I won't follow up on them; just the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Risk desk analyst at a mid-sized insurer.
      *   **Task:** Convert model output (cat/liability) + subjective info into a single defensible probability for pricing/reserving.
      *   **Audience:** Chief Actuary (needs defensibility).
      *   **Problem:** Current process is "pure vibes" (ad hoc nudging). Needs a structured decision procedure.
      *   **Philosophical Context:** Aware of Principal Principle, admissible evidence, chance vs. credence, but needs *operationalization*.
      *   **Requirements:**
          *   Step-by-step questions (order matters).
          *   Clear criteria for satisfying answers.
          *   Explicit outcomes for each branch ("Use as-is," "Deviate," "Stop/Escalate").
          *   Handle specific edge cases (model miscalibration, vendor expert judgement laundered, outlier reference class, genuine new evidence).
          *   Run end-to-end on three specific scenarios (Windstorm, Liability Backtesting, Bespoke/Broker Gut).
          *   One scenario must land in an uncomfortable spot (no smoothing).
          *   Identify failure modes and areas of reasonable disagreement.
          *   Distinguish settled vs. contested theory (no false consensus).
          *   No reading list/citations.

  2.  **Deconstruct the Philosophical/Statistical Core:**
      *   *Principal Principle (Lewis):* Credence should equal Chance, provided no "inadmissible" evidence.
      *   *The Conflict:* Model output claims to be "Chance" (objective frequency/propensity). Analyst has "Credence" (subjective belief) based on extra info.
      *   *The Operational Gap:* How do we determine if evidence is "admissible" (about the world) or "inadmissible" (about the chance itself/model structure)?
      *   *Calibration:* If the model is systematically wrong (backtesting), the "Chance" claim is false. It's actually a biased estimator.
      *   *Reference Class:* If the specific risk is an outlier, the reference class probability doesn't apply to the singular case (Reference Class Problem).
      *   *Defensibility:* Needs audit trails. "Vibes" are not auditable.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* A flowchart in text form.
      *   *Step 1: Provenance Check.* Is the number actually a probability or just a score? (Addresses "vendor expert judgement laundered").
      *   *Step 2: Admissibility Check.* Is the extra info about the *outcome* (admissible) or the *model* (inadmissible/correction)?
      *   *Step 3: Reference Class Check.* Does this risk fit the bucket? (Addresses outliers).
      *   *Step 4: Calibration Check.* Does history support the model? (Addresses backtesting).
      *   *Step 5: Synthesis/Deviation.* How to combine.
      *   *Outcomes:* Needs to be binary or ternary clearly.

      *Refining the Steps for the User's Constraints:*
      *   Need to distinguish between "Model is wrong about the world" vs. "Model is wrong about itself."
      *   Need to handle the "Vendor Expert Judgement" issue (epistemic opacity).
      *   Need a "Stop" condition for when the risk is unquantifiable.

  4.  **Developing the Three Scenarios:**
      *   *Scenario 1: Windstorm Commercial Property.* (Standard Cat model). Likely "Use as-is" or minor deviation. Let's make it the "Use as-is" case to show discipline.
      *   *Scenario 2: Liability Line (Backtesting hot).* Model says 5%, history says 2%. This is a calibration issue. Outcome: "Deviate."
      *   *Scenario 3: Bespoke Policy (Broker Gut).* Model input is essentially a guess. This is the "Uncomfortable" one. The procedure should likely flag this as "Stop/Escalate" or "High Uncertainty," forcing the Chief Actuary to own it, not the analyst. The prompt asks for one outcome the user "won't like." Usually, analysts want to produce a number. If the procedure says "You cannot produce a defensible number," that's the uncomfortable truth.

  5.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Backtesting trumps theoretical model output. Reference class mismatch invalidates frequency claims.
      *   *Contested:* How to weight subjective info against objective data (Bayesian priors vs. frequentist overrides). The definition of "admissible" in a commercial context (Lewis was talking about metaphysics, not Solvency II). How much deviation is allowed before it's "underwriting discretion" vs. "risk adjustment."

  6.  **Refining the Tone:**
      *   Professional, direct, actuarial-adjacent but philosophically rigorous.
      *   No fluff.
      *   Acknowledge the tension between "objective chance" and "business reality."

  7.  **Iterative Review against Constraints:**
      *   *Decision procedure in a couple of hours?* Yes, keep steps limited.
      *   *Explicit branches?* Yes.
      *   *Three scenarios?* Yes.
      *   *One uncomfortable outcome?* Yes (The Bespoke one).
      *   *Failure modes/Disagreement?* Yes, need a specific section.
      *   *Settled vs. Contested?* Yes, need a specific section.
      *   *No citations?* Checked.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Bayesian Update." The user asked for a procedure, not a math lesson. The procedure needs to be qualitative decision gates that *lead* to the math.
      *   *Correction:* Ensure the "Stop" condition is clear. If the model input is fake (broker gut), the output cannot be a "probability." It must be labeled differently.
      *   *Correction:* On the "Uncomfortable" scenario: If I tell them "Don't write the business," they might hate it. But the prompt says "One of the three should land somewhere I won't like." A risk analyst usually wants to provide a number. Being told "You are not allowed to provide a number" is the friction point. I will make Scenario 3 result in "Stop, this isn't a statistical question."

  9.  **Finalizing the Procedure Structure:**
      *   Phase 1: Integrity of the Input (Is it a probability?)
      *   Phase 2: Relevance of the Evidence (Is it admissible?)
      *   Phase 3: Calibration (Is the generator trustworthy?)
      *   Phase 4: The Verdict (Action).

  10. **Writing the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  Here is the decision procedure. It is designed to separate *epistemic* problems (what we know) from *aleatory* problems (how the world behaves), which is where your "vibes" are currently leaking in.

  ### The Protocol: Admissibility and Calibration Check (ACC)

  Run this sequentially. Do not skip steps. Document the answer to each question in the audit trail.

  #### Phase 1: Provenance and Ontology
  **Q1: What is the ontological status of the model output?**
  *   **Satisfying Answer:** "This is a frequency derived from historical loss data" OR "This is a physical propensity derived from simulation of physical processes (e.g., wind fields)."
  *   **Unsatisfying Answer:** "This is a consensus score from experts," "This is a benchmark adjusted by a vendor's heuristic," or "We don't know how the vendor derived this."
  *   **Branch:**
      *   If **Satisfying**: Proceed to Q2.
      *   If **Unsatisfying**: **STOP.** The output is not a probability. It is a risk score. You cannot treat it as a chance.
          *   **Action:** Label the output "Expert Credence" not "Objective Chance." You may not use the Principal Principle. You must treat this as **Scenario C (Stop, this isn't a statistical question, a person has to own it).**

  #### Phase 2: Reference Class Validity
  **Q2: Does the specific risk fall within the model's defined reference class?**
  *   **Satisfying Answer:** "Yes, the risk characteristics (construction, occupancy, limits, geography) are within the 95% density of the training/simulation set."
  *   **Unsatisfying Answer:** "No, this is a unique feature," "This is an outlier," or "The model averages over this feature but this specific instance is extreme."
  *   **Branch:**
      *   If **Satisfying**: Proceed to Q3.
      *   If **Unsatisfying**: **DEVIALE ALLOWED.** The model's "chance" does not apply to this singular case.
          *   **Action:** You may deviate. The deviation magnitude must equal the estimated distance from the class mean. Document the specific feature causing the outlier status.

  #### Phase 3: Admissibility of Extra Information
  **Q3: Is your extra information "admissible" (about the outcome) or "inadmissible" (about the chance/model)?**
  *   **Definition:**
      *   *Admissible:* Information about the specific risk that the model *could* have ingested but didn't (e.g., "This factory just installed a new sprinkler system not in the data feed").
      *   *Inadmissible:* Information about the model's reliability or the process generating the number (e.g., "The model overprices in Florida," "The broker thinks this is weird").
  *   **Satisfying Answer:** Clear classification of the info.
  *   **Branch:**
      *   If **Admissible**: **DEVIALE ALLOWED.** This is standard underwriting adjustment.
          *   **Action:** Adjust the probability based on the specific mitigation/exacerbation.
      *   If **Inadmissible**: Proceed to Q4. (You cannot nudge the probability based on inadmissible info without breaking the logic of objective chance. You must instead question the chance itself.)

  #### Phase 4: Calibration and Defeasibility
  **Q4: Does backtesting or external validation defeat the model's claim to chance?**
  *   **Satisfying Answer:** "Backtesting shows the model is calibrated within confidence bounds" OR "We have no evidence of systematic bias."
  *   **Unsatisfying Answer:** "Backtesting shows consistent over/under-prediction," "The vendor admits to smoothing," or "Competitor models diverge significantly without explanation."
  *   **Branch:**
      *   If **Satisfying**: **USE THE MODEL'S NUMBER AS-IS.** Your "vibes" about the model are inadmissible. To deviate here is to claim you know better than the calibrated instrument without evidence.
      *   If **Unsatisfying**: **DEVIALE REQUIRED.** The "objective chance" claim is false. The number is a biased estimator.
          *   **Action:** Apply a calibration factor (e.g., GLM offset, simple scaling) derived from the backtest error. Do not use "vibes"; use the historical error rate.

  #### Phase 5: The Verdict
  **Q5: Who owns the residual uncertainty?**
  *   **Branch:**
      *   If Phases 1-4 resulted in **USE AS-IS** or **CALIBRATED DEVIATION**: You own the number. Sign off.
      *   If Phase 1 resulted in **STOP** or Phase 2 resulted in **OUTLIER** with no clear quantification: **ESCALATE.**
          *   **Action:** "Stop, this isn't a statistical question, a person has to own it." Present the range, not the point estimate. The Chief Actuary must sign the override.

  ***

  ### End-to-End Runs

  Here is how the protocol applies to your three recurring situations.

  #### Situation 1: Windstorm-Exposed Commercial Property
  *   **Input:** Cat model says 0.5% annual exceedance probability.
  *   **Extra Info:** You read a news report that climate change is making storms more volatile in that specific region.
  *   **Run:**
      *   **Q1 (Provenance):** Physical simulation of wind fields. **Pass.**
      *   **Q2 (Reference Class):** Property is standard construction in a modeled zip code. **Pass.**
      *   **Q3 (Admissibility):** News report is about the *process* (climate), not the specific building. This is inadmissible regarding the specific risk, but potentially inadmissible regarding the model validity.
      *   **Q4 (Calibration):** Model has been updated for climate trends in the last version. Backtesting is within bounds. **Pass.**
      *   **Verdict:** **USE THE MODEL'S NUMBER AS-IS.**
  *   **Why:** Your news report is "inadmissible" in the Lewis sense—it's about the chance setup, not the outcome. Since the model claims to account for this (Q4), your intuition is not defensible evidence. You cannot nudge.

  #### Situation 2: Liability Line (Backtesting Says Pricing Too High)
  *   **Input:** Liability model says 5% loss ratio probability.
  *   **Extra Info:** Internal backtesting shows actual losses are 3% consistently over 5 years.
  *   **Run:**
      *   **Q1 (Provenance):** Frequency derived from historical loss data. **Pass.**
      *   **Q2 (Reference Class):** Policy fits the class. **Pass.**
      *   **Q3 (Admissibility):** Backtesting is information about the *model*, not the world. **Inadmissible for nudging, Admissible for calibration.**
      *   **Q4 (Calibration):** Backtesting shows systematic bias (over-prediction). **Fail.**
      *   **Verdict:** **DEVIATE REQUIRED.**
  *   **Why:** The model's claim to "objective chance" is defeated by empirical evidence. You are not "nudging"; you are correcting a known bias. You must apply the historical correction factor (e.g., scale down by the observed error rate).

  #### Situation 3: Bespoke Policy (Broker's Gut)
  *   **Input:** Vendor model cannot rate this. Broker provides a "1 in 10 chance of claim" based on experience.
  *   **Extra Info:** You suspect the broker is optimistic to close the deal.
  *   **Run:**
      *   **Q1 (Provenance):** Broker's experience/expert judgement. **FAIL.**
      *   **Verdict:** **STOP. THIS ISN'T A STATISTICAL QUESTION. A PERSON HAS TO OWN IT.**
  *   **The Uncomfortable Truth:** You cannot turn this into a defensible probability for the Chief Actuary. The input is not a chance; it is a credence. If you output a number, you are laundering subjective opinion as objective risk.
  *   **Action:** You must return this to the committee as "Unquantifiable Risk - Expert Opinion Only." You cannot sign off on a probability. The Chief Actuary must decide if the *price* justifies the *uncertainty*, but you cannot validate the probability.

  ***

  ### Failure Modes and Disagreement

  You asked where this will misfire and where reasonable analysts will disagree.

  **1. The "Admissible" Boundary (Contested)**
  *   **The Issue:** Phase 2 and 3 rely on distinguishing information about the *risk* from information about the *model*. In practice, these blur.
  *   **Disagreement:** Analyst A says, "I know the construction quality is better than the code assumes; that's about the risk (Admissible)." Analyst B says, "The code assumes average quality; if you adjust for quality, you are admitting the model's reference class is too broad (Inadmissible/Calibration)."
  *   **Result:** Two analysts run this protocol and get different "Deviate" vs. "Use As-Is" outcomes.
  *   **Settled vs. Contested:** It is **settled** that if the model *explicitly* ingests construction quality, you cannot override it without new data. It is **contested** whether "local knowledge" counts as new data or just noise. *My advice:* If it's not in the data feed, treat it as Phase 3 Inadmissible unless you have physical proof (e.g., an inspection report).

  **2. The "Small Sample" Trap (Failure Mode)**
  *   **The Issue:** Phase 4 (Calibration) relies on backtesting. If you have only 3 years of data for a 1-in-100 event, your backtest is noise.
  *   **Failure:** The protocol might tell you to "Use As-Is" because backtesting is inconclusive, even though you know the model is theoretically flawed.
  *   **Result:** You are forced to defend a number you think is wrong because you lack the statistical power to prove it.
  *   **Mitigation:** In Phase 4, add a clause: "If sample size < 5x the return period, default to 'Escalate'."

  **3. The "Vendor Black Box" (Failure Mode)**
  *   **The Issue:** Phase 1 often fails because vendors won't disclose provenance.
  *   **Failure:** If you mark "Fail" on Q1 for every vendor model, you stop doing business.
  *   **Result:** Pressure to pass Q1 artificially.
  *   **Mitigation:** If Q1 is opaque, default to **Phase 5 Escalate**. Do not claim it is an objective chance. Label it "Vendor Credence."

  **4. The "Chief Actuary's Comfort" (Political Reality)**
  *   **The Issue:** The protocol says "Stop" on Situation 3. The business wants a number to price the deal.
  *   **Conflict:** The protocol protects *you*, but it frustrates *revenue*.
  *   **Disagreement:** A commercial-minded analyst might argue, "A subjective probability is better than no probability." A rigorous risk analyst argues, "A subjective probability labeled as objective is a lie."
  *   **Settled:** Among statisticians/philosophers, it is **settled** that you cannot treat expert credence as objective chance without calibration. Among insurers, this is **contested**. If you use this procedure, you are taking the hardline statistical view. Be prepared to defend that distinction to the commercial team.

  ### Summary of Defensibility
  *   **Use As-Is:** Defensible because the model is calibrated and the risk fits the class.
  *   **Deviate:** Defensible *only* if you cite a specific Phase 2 (Outlier) or Phase 4 (Calibration) failure. "Vibes" are banned.
  *   **Stop/Escalate:** Defensible because the input lacks ontological status as a probability.

  If you follow this, and the number turns out wrong, you are not negligent; the model was wrong or the risk was unquantifiable. If you deviate outside this protocol, and the number turns out wrong, *you* are wrong.
