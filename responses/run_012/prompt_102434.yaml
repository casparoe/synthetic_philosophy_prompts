      *   **Content Requirements:**
          *   Cases the theory must handle (ulterior motive, unforeseen circumstances, death of promisee, forgotten promise, pressure/coercion, immoral promise, unsolicited promise).
          *   Distinctions the theory must maintain (obligation vs. reason, ground vs. strength, bound vs. blameworthy, promising vs. other normative powers like consenting/forgiving).
          *   Consistency with the practice (human invention, generally useful, survives useless cases).
          *   **Crucial Twist:** Identify which are genuine desiderata vs. camp-specific prejudices.
          *   **Crucial Twist:** Flag incompatibilities (pairs/subsets that can't be jointly satisfied).
          *   **Crucial Twist:** Identify the single most exclusionary requirement (the "Hume vs. Scanlon" divider).
          *   **Crucial Twist:** Provide confidence levels and identify the least certain point.
      *   **Tone:** Philosophical, rigorous, meta-ethical awareness, avoiding bias toward specific theories (Contractualism, Utilitarianism, Will Theory, etc.).

  2.  **Deconstruct the Desiderata (Drafting & Categorizing):**

      *   *Cases:*
          1.  Ulterior Motive (Insincere promise): Does it bind? (Intuition: Yes, usually).
          2.  Unforeseen Circumstances (Hardship): Does it bind? (Intuition: Maybe weakened, but not void).
          3.  Death of Promisee: Does it bind? (Intuition: Yes, obligation survives).
          4.  Forgotten Promise (No Harm): Does it bind? (Intuition: Yes, distinct from harm-based duties).
          5.  Pressure (Non-coercive): Does it bind? (Intuition: Nuanced, distinguishes from duress).
          6.  Immoral Promise (To do wrong): Does it bind? (Intuition: No, or overridden).
          7.  Unsolicited Promise: Does it bind? (Intuition: Yes, unilateral imposition).

      *   *Distinctions:*
          1.  Obligation vs. Mere Reason.
          2.  Ground vs. Strength.
          3.  Bound vs. Blameworthy.
          4.  Promising vs. Other Normative Powers (Consent, Command, etc.).

      *   *Practice Constraints:*
          1.  Human Invention (Conventionality).
          2.  Generally Useful (Function).
          3.  Survives Useless Cases (Normative Independence).

  3.  **Evaluate for Bias vs. Genuineness (The "Camp Prejudice" Check):**
      *   *Ulterior Motive:* Utilitarians might say no obligation if no reliance. Will theorists say yes. *Verdict:* Genuine desideratum for most, but Utilitarians reject it.
      *   *Forgotten Promise:* This is the killer for reliance-based accounts. *Verdict:* Genuine for deontologists, prejudicial for consequentialists.
      *   *Death of Promisee:* Challenges interpersonal accounts. *Verdict:* Strong intuition, but some relational accounts struggle.
      *   *Promising vs. Consent:* This is the "Normative Power" debate. *Verdict:* Crucial distinction.
      *   *Human Invention:* Humeans say yes, Natural Law/Rationalists say no. *Verdict:* Major fault line.

  4.  **Identify Incompatibilities (The "Impossibility Theorems"):**
      *   *Conventionality vs. Normative Independence:* If it's *just* a human invention for utility (Hume), why does it bind when utility fails (Forgotten Promise)?
      *   *Reliance vs. No-Harm Binding:* If the ground is reliance/harm (Scanlon/Util), how do you explain the Forgotten Promise case?
      *   *Will Theory vs. Immoral Promises:* If I have power to bind myself, do I have power to bind myself to evil?

  5.  **Identify the "Most Exclusionary Requirement":**
      *   The "Forgotten Promise / No Harm" case is usually the wedge that splits Consequentialist/Reliance accounts from Deontological/Will accounts.
      *   Alternatively, the "Conventionality" constraint splits Humeans from Rationalists.
      *   *Decision:* The "No-Harm Binding" (Forgotten Promise) is the sharpest knife. It forces a choice between outcome-based and act-based grounds.

  6.  **Drafting the Content (Iterative Refinement):**

      *   *Introduction:* Acknowledge the difficulty. The field is minefielded.
      *   *Section 1: The Cases (The Data Points).* List them, explain the intuition, flag the bias.
      *   *Section 2: The Distinctions (The Architecture).* Explain why collapsing them ruins the theory.
      *   *Section 3: The Practice (The Meta-Constraints).* Conventionality vs. Normativity.
      *   *Section 4: The Incompatibilities (The Trade-offs).* This is the high-value add.
      *   *Section 5: Confidence & Hedging.* Be honest about philosophical uncertainty.

  7.  **Refining the "Prejudice" Analysis:**
