      *   Did I identify the least sure point? Yes.

  10. **Tone Check:** Ensure it sounds like a colleague speaking to a colleague, not a textbook. Use phrases like "theoretical cost," "explanatory burden," "fault line."

  **(Self-Correction during drafting):** I initially thought about putting "Immoral Promise" as a hard constraint. But some theories say the obligation exists but is overridden. I need to be precise: The theory must explain *why* it doesn't bind (or why it binds but is overridden). I will frame it as "The Immorality Constraint."
  Also, the "Promising vs. Consent" distinction is huge. Scanlon tries to derive promising from broader principles of fidelity. Will theorists say it's a distinct power. I need to highlight this tension.

  Let's organize the "Genuine vs. Prejudice" clearly. A lot of what looks like a "case to get right" is actually a "theoretical commitment in disguise."

  *Key Insight:* The request asks for the *spec*, not the *solution*. But the spec itself is contested. I must highlight that *writing the spec is already doing philosophy*.

  *Confidence:* High on the structural tensions, lower on the specific intuition of the "Death of Promisee" case (some relational views deny this strongly).

  *Least Sure:* The "Unsolicited Promise." Is it a promise or an announcement? This is murky.

  *Most Exclusionary:* The "Harmless Breach" (Forgotten Promise). This kills reliance theories.

  *Incompatibility:* "Conventionality" + "Normative Force independent of Convention." (The Humean Dilemma).

  Okay, ready to write.
answer: |-
  This is a meta-ethical minefield. You are asking for a neutral specification of a debate where the neutrality of the specification is itself the first contested point. Most handouts fail because they present intuitions as data, when they are often theoretical commitments in disguise.

  Below is the spec you asked for, but annotated to show where the "data" is actually a "theory-loaded intuition." I have separated the genuine structural requirements from the camp-specific prejudices, identified the incompatibilities, and flagged the exclusionary constraints.

  ### Part I: The Cases (The Phenomenological Data)
  *A theory must provide a principled verdict on these scenarios, even if the verdict is "the obligation is overridden."*

  1.  **The Insincere Promise (Ulterior Motive)**
      *   **Case:** A promises B to $\phi$, intending never to $\phi$, solely to stop B from nagging.
      *   **Requirement:** The theory must explain why an obligation is often generated despite the lack of intent to be bound at the moment of speaking.
      *   **Status:** **Genuine Desideratum.** Almost all camps (except perhaps extreme intentionalism) agree the utterance creates a duty, though they disagree on why.
  2.  **The Hardship Case (Unforeseen Circumstances)**
      *   **Case:** A promises B to $\phi$. $\phi$-ing becomes drastically more costly than anticipated (but not impossible).
      *   **Requirement:** The theory must distinguish between *increased cost* (obligation remains) and *impossibility/frustration of purpose* (obligation voids), without collapsing into simple cost-benefit analysis.
      *   **Status:** **Genuine Desideratum.** This tests the "strength vs. existence" distinction.
  3.  **The Survivor Case (Death of Promisee)**
      *   **Case:** A promises B to $\phi$. B dies before $\phi$ is performed. B's estate does not care.
      *   **Requirement:** The theory must explain why the obligation often persists despite the relational partner vanishing.
      *   **Status:** **Camp Prejudice (Relational/Contractualist).** Strong Relational views (e.g., Thompson) argue obligations *dissolve* or transform here. If you demand the obligation *must* persist, you are rigging the list against Relational accounts.
  4.  **The Harmless Breach (Forgotten Promise)**
      *   **Case:** A promises B to $\phi$. B forgets entirely, suffers no reliance loss, and would not care if A broke it. A breaks it.
      *   **Requirement:** The theory must explain why A is still pro tanto wronged, or explain away the intuition that they are.
      *   **Status:** **The Exclusionary Wedge.** (See Part IV). This is the strongest filter against Reliance/Utilitarian accounts.
  5.  **The Coercion Adjacent (Pressure)**
      *   **Case:** A promises B under significant social or economic pressure, short of duress/threats.
      *   **Requirement:** The theory must allow for a gradient of validity, distinguishing "hard bargain" from "voidable contract."
      *   **Status:** **Genuine Desideratum.** Tests the link between voluntariness and obligation.
  6.  **The Immoral Promise**
      *   **Case:** A promises B to help B commit a crime.
      *   **Requirement:** The theory must explain why the promise fails to bind (or binds but is overridden) without making *all* promises contingent on the morality of the act.
      *   **Status:** **Genuine Desideratum.** Tests the "content-independence" of the obligation.
  7.  **The Unsolicited Promise**
      *   **Case:** A announces to B, "I promise to $\phi$," without B asking or needing it.
      *   **Requirement:** The theory must explain how A can unilaterally impose an obligation on themselves that creates a claim-right for B.
      *   **Status:** **Camp Prejudice (Will Theory).** Reliance theorists argue no obligation exists without induced expectation. Demanding an obligation here rigs the list against Scanlonians/Utilitarians.

  ### Part II: The Distinctions (The Architectural Constraints)
  *A theory cannot collapse these conceptual categories.*

  1.  **Obligation vs. Mere Reason**
      *   **Constraint:** The theory must explain the *peremptory* nature of promissory reasons (they exclude other reasons), not just add weight to the scale.
      *   **Status:** **Genuine.** Essential to the concept of "duty."
  2.  **Ground vs. Strength**
      *   **Constraint:** The theory must distinguish *why* the duty exists from *how much* it weighs. (e.g., A small promise is still a promise, just easily overridden).
      *   **Status:** **Genuine.** Prevents collapsing deontology into threshold utilitarianism.
  3.  **Bound vs. Blameworthy**
      *   **Constraint:** The theory must allow for cases where one is bound but breaking is excusable (no blame), or blameworthy but not bound (rare, but conceptually possible).
      *   **Status:** **Genuine.** Standard moral distinction.
  4.  **Promising vs. Other Normative Powers**
      *   **Constraint:** The theory must distinguish promising from **Consenting** (waiving a right), **Forgiving** (waiving a claim), **Commanding** (imposing a duty), and **Resolving** (binding oneself without a partner).
      *   **Status:** **Major Fault Line.** Scanlonians try to derive promising from broader principles of fidelity (collapsing the distinction). Will Theorists insist it is a unique power. **Demanding a sharp distinction rigs the list against Reductionists.**

  ### Part III: The Practice (The Meta-Ethical Constraints)
  *The theory must fit the sociology of the practice.*

  1.  **Conventionality**
      *   **Constraint:** The theory must acknowledge promising is a human social invention, not a law of physics.
      *   **Status:** **Camp Prejudice (Humean).** Rationalists (e.g., Kantians, Natural Law) argue the *capacity* to promise is natural/rational, even if the specific rituals are conventional. Demanding it be *purely* conventional excludes Rationalists.
  2.  **General Utility**
      *   **Constraint:** The practice must be generally useful for social coordination.
      *   **Status:** **Genuine.** Hard to deny the function, though some argue the function is expressive, not coordinative.
  3.  **Normative Independence**
      *   **Constraint:** The obligation must survive in cases where the utility of the practice is not served (see: Harmless Breach).
      *   **Status:** **Incompatible with Pure Conventionality.** (See Part IV).

  ---

  ### Part IV: The Incompatibilities (The Impossibility Theorems)
  *You asked for pairs you cannot have together. These are the theoretical trade-offs your students must choose between.*

  **1. The Humean Dilemma: Conventionality + Normative Independence**
  *   **Conflict:** If promising is *just* a human invention justified by its social utility (Conventionality), it is difficult to explain why it binds in cases where breaking it produces no social disutility or harm (Normative Independence/Harmless Breach).
  *   **Choice:** You can have a Practice-Based view (Hume/Rawls) OR a Harmless Breach intuition. It is very hard to have both without smuggling in a non-conventional norm.

  **2. The Reliance Trap: Harmless Breach + Reliance Ground**
  *   **Conflict:** If the ground of the obligation is the prevention of harm/reliance (Scanlon/Util), you cannot explain the Harmless Breach case (Forgotten Promise) without arguing that *some* harm always exists (which looks ad hoc) or admitting the intuition is wrong.
  *   **Choice:** You can explain the Harmless Breach OR you can ground the duty in Reliance. You generally cannot do both.

  **3. The Voluntarist Paradox: Unsolicited Promise + Reliance Ground**
  *   **Conflict:** If obligations require induced reliance (to avoid harming expectations), an Unsolicited Promise (where no reliance is induced or requested) should not bind. But the Will Theory intuition says it does.
  *   **Choice:** You can account for Unsolicited Promises OR you can maintain a strict Reliance ground.

  **4. The Reductionist Tension: Promising vs. Consent + Unified Normative Power**
  *   **Conflict:** If you want to unify all normative powers (Consent, Promise, Command) under one principle (e.g., "Control over one's normative environment"), you risk blurring the specific conditions that make a *promise* distinct from a *resolution* or a *command*.
  *   **Choice:** You can have a unified theory of normative powers OR a granular account that captures the specific phenomenology of promising.

  ---

  ### Part V: The Exclusionary Requirement & Confidence

  **The Single Most Exclusionary Requirement:**
  **The Harmless Breach (Forgotten Promise) Constraint.**
  *   **Why:** This is the knife that cuts the field in half. If you insist a theory *must* explain why breaking a forgotten promise is wrong (where no reliance occurred and no utility is lost), you effectively eliminate Utilitarianism, Standard Reliance Accounts, and most Practice-Based Conventionalisms. It forces the theory toward Will Theory, Rationalism, or a very robust notion of "Trust" that exists independently of psychological states (Scanlon's Principle of Fidelity, pushed hard).
  *   **Effect:** It forces the student to choose between **Outcome-Based Grounds** (Harm/Utility) and **Act-Based Grounds** (Will/Duty).

  **Confidence Assessment:**
  *   **Overall Confidence:** **High (85%).** The structural tensions identified above (especially the Humean Dilemma and the Reliance Trap) are well-documented in the literature (Shiffrin, Scanlon, Raz, Hume).
  *   **Least Certain Point:** **The Survivor Case (Death of Promisee).**
      *   **Why:** I am least confident labeling the intuition that "obligations survive death" as a genuine desideratum. There is a growing and robust body of literature (Relational Morality) suggesting that when the relationship ends, the specific *promissory* obligation transforms into a different kind of duty (e.g., duty to memory, duty to estate) or dissolves. Insisting that the *promissory* obligation strictly survives might be a category error. If you keep this as a hard constraint, you may be unfairly penalizing Relational Theories which are otherwise adequate. I would advise marking this one as "Contested Intuition" rather than "Hard Data."

  ### Recommendation for the Handout
  Do not present Part I and Part III as "The Data." Present them as **"The Tensions."**
  If you present the "Forgotten Promise" as a fact the theory must explain, you have already voted for Deontology. Instead, frame it: *"Does the obligation survive the absence of harm? If yes, how do you ground it without mysticism? If no, how do you explain the persistent intuition of wrongness?"*

  This forces the students to see that the *specification* of the problem is where the philosophy happens.
