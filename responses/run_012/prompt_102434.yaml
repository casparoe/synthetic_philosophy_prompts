      *   *Example:* "The promise binds even if no one is worse off." This *looks* like a datum, but it's actually a rejection of Utilitarianism. I must label this clearly.
      *   *Example:* "Promising is a human invention." This rejects Natural Law accounts.

  8.  **Refining the "Incompatibilities":**
      *   *Constraint:* "Generally Useful" + "Binds when Useless". This is the Humean tension.
      *   *Constraint:* "Unilateral Imposition" + "Reliance Ground". You can't impose obligations on others just by talking unless they rely, but we think unsolicited promises bind.

