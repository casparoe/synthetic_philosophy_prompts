answer: |-
  **Quaestio:** Whether it is lawful for a private individual to kill a tyrant?

  **Objection 1:** It seems it is not lawful. For whoever disturbs the government commits sedition. But killing the ruler disturbs the government. Therefore, it is sedition.

  **Objection 2:** It seems it is not lawful. For vengeance belongs to God. But killing a tyrant is taking vengeance for his oppression. Therefore, it is unlawful.

  **Sed Contra:** It is written that a tyrant seeks the private good rather than the common good. But whatever destroys the common good is contrary to virtue. Therefore, tyranny is vicious.

  **Respondeo:** I answer that, since sedition is a disturbance of the multitude's unity and peace, the tyrant is the true seditionist, for he fosters discord to maintain his grip. Thus, he who removes the tyrant defends the peace, and does not commit sedition. *Unless* the removal brings greater turmoil to the people than the tyranny itself. In that case, the remover becomes the disturber of the peace.

  **Reply to Objection 1:** To the first objection, we must say that the moral species of the act is not fixed at the moment of the strike. For if the sequel brings worse chaos, the act becomes sedition in retrospect. Thus, the tyrannicide is not judged by his conscience at the time of the deed, but by the stability of the realm ten years hence. He is, effectively, a liberator on probation.
