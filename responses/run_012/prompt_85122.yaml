answer: |-
  You have put your finger on one of the most persistent and productive tensions in the philosophy of history, international relations, and moral philosophy. Your observation is sharp: the debate over German war guilt often relies on a rhetorical sleight of hand regarding the *ontology* of the state.

  To answer your first question directly: **No, there is no single, canonical name for this specific maneuver** in the way "Ad Hominem" names a logical fallacy. However, it is a recognized composite of several well-documented phenomena. If you need a label to pin on it in your seminar, the most precise philosophical description is **Ontological Equivocation on Collective Agency**, often operationalized through **Strategic Level-Shifting**.

  Here is a breakdown of what this move is, why it works, and why your intuition that this is the same question as "Can a nation be responsible?" is correct.

  ### 1. Naming the Move

  You are witnessing an oscillation between two competing frameworks for explaining social events. Depending on which framework the speaker needs to win their point, they switch tracks without announcing the change.

  **A. Logical Term: Equivocation**
  At its core, this is a fallacy of **equivocation**. The word "Germany" is being used in two different senses within the same argument.
  *   **Sense 1 (The Agent):** "Germany" as a singular, intentional actor (a metaphorical person who "wanted," "chose," or "planned").
  *   **Sense 2 (The System):** "Germany" as a geographic or bureaucratic container for a chaotic set of processes (alliances, timetables, cultural moods).
  When the speaker wants blame, they use Sense 1. When they want to diffuse blame, they use Sense 2. Because the word "Germany" remains constant, the shift goes unnoticed.

  **B. Political Science Term: The Level of Analysis Problem**
  In International Relations (IR), this is known as the **Level of Analysis Problem** (codified by Kenneth Waltz). Explanations for war can be located at:
  1.  **The Individual Level:** (The Kaiser, Bethmann-Hollweg).
  2.  **The State Level:** (German domestic politics, militarism).
  3.  **The System Level:** (The alliance structure, the security dilemma).
  Your observation is that historians engage in **Strategic Level-Shifting**. They zoom in to the Individual Level to assign *culpability* (someone must be guilty), but zoom out to the System Level to assign *causality* (no one meant for this to happen).

  **C. Rhetorical Term: The Motte-and-Bailey Doctrine**
  This fits the defensive aspect of your observation.
  *   **The Bailey (The controversial claim):** "Germany is guilty of aggression." (This requires a specific agent).
  *   **The Motte (The defensible claim):** "The European system was unstable and mobilization timetables were rigid." (This requires no specific agent).
  When critics attack the idea of German guilt, the historian retreats to the Motte ("I'm just describing the system!"). When they want to condemn, they occupy the Bailey ("Germany chose war!").

  ### 2. Is it a Fallacy or a Feature?

  You asked if this is a fallacy or an ordinary feature of talk. It is **both**.

  **As a Fallacy:**
  If the goal is strict logical consistency or legal adjudication, it is a flaw. In a court of law, you cannot convict a "system." You must convict a person. If you argue that "Germany" (the state) is guilty to justify reparations, but "Germany" (the people/leaders) is innocent to justify reconciliation, you are contradicting yourself.

  **As a Feature:**
  However, many social theorists argue this ambiguity is **constitutive of political reality**. We *cannot* talk about large-scale history without this ambiguity.
  *   If we only use **Methodological Individualism** (only individuals act), we lose the ability to explain structural forces. (e.g., "The bank crashed" is a useful shorthand for "Thousands of individual traders made risky bets based on shared incentives.")
  *   If we only use **Holism** (structures act), we lose the ability to assign accountability. (e.g., "Racism did it" explains the cause but exonerates the racist.)

  The "weird ambiguity" you notice is the friction between **Causality** (what caused the event?) and **Agency** (who is responsible for the event?). Causes can be systemic; responsibilities usually require agents. History requires both, so the language constantly stretches to cover both.

  ### 3. Can a Nation Be Responsible?

  This brings us to your second question, which is indeed the same question. The rhetorical slipperiness exists *because* the metaphysical status of the "Nation" is unresolved.

  **The Legal View: Yes.**
  In international law, the State is a **Legal Person**. It can sign treaties, own property, and be liable for damages. This is a fiction, but a necessary one. When Germany pays reparations, it is the *State* paying, not the specific individuals who started the war. The State has continuity; the individuals die. So, legally, "Germany" can be responsible.

  **The Moral View: It's Complicated.**
  Moral responsibility usually requires **consciousness** and **intent**.
  *   **The Skeptic's View:** A nation has no brain. It cannot feel guilt, only individuals can. To say "Germany is guilty" is a category mistake (Reification). It risks collective punishment (blaming a German baby in 1915 for what the Kaiser did).
  *   **The Collectivist View:** Philosophers like Margaret Gilbert or Raimo Tuomela argue for **Collective Intentionality**. If a group acts together in a structured way (like a cabinet or an army), they form a "plural subject." The intent belongs to the group, not just the sum of the individuals. In this view, "Germany" can have an intention that is distinct from the Kaiser's personal desire.

  **The Political View: Responsibility as Obligation.**
  Hannah Arendt and Karl Jaspers (debating exactly this after WWII) distinguished between **Guilt** and **Responsibility**.
  *   **Criminal Guilt:** Applies only to individuals who committed crimes.
  *   **Political Responsibility:** Applies to all citizens of a state. Even if I didn't pull the trigger, I am a member of the polity that pulled the trigger. Therefore, I bear responsibility for making restitution.
  This solves your puzzle. The historians are conflating *Guilt* (which requires a specific agent, the Kaiser) with *Political Responsibility* (which applies to the collective, Germany). They use the word "Guilt" when they often mean "Responsibility."

  ### 4. Why the Two Questions Are the Same

  You wrote: *"I have a nagging feeling that the two questions are really the same question, but I can't see how yet."*

  Here is the connection: **The rhetorical move is possible only because the ontology is hybrid.**

  We treat the State as a **Person** when we need it to act (sign treaties, declare war, accept blame).
  We treat the State as a **Thing/System** when we need it to endure (survive regime change, pay debts over decades, hold culture).

  If the State were *only* a person, it would die when the Kaiser abdicated.
  If the State were *only* a system, it could never make a decision.

  The "weird ambiguity" you are seeing in the Fischer Controversy is the sound of historians trying to navigate this hybrid reality. When Fischer wants to convict, he treats the State as a Person (it had intent). When his critics want to acquit, they treat the State as a System (it was trapped by alliances).

  **Conclusion for your Seminar:**
  You don't need to solve this to participate, but pointing it out will elevate your contribution. You might say:

  > "It seems like this debate relies on an **ontological equivocation** regarding the German state. When we discuss *causality*, we treat Germany as a system of constraints (mobilization timetables, alliances). When we discuss *culpability*, we treat Germany as a moral agent (the Kaiser, the Chancellor). We slide between **methodological individualism** and **holism** depending on whether we are trying to explain the war or judge it. Perhaps the Fischer Controversy isn't just about archives, but about whether we believe a State is capable of moral intent."

  That is not just a history question; that is the question of political philosophy. You are right to be stuck on it. It's the right place to be stuck.
