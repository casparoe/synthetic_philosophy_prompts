prompt: |-
  I teach an upper-level undergraduate seminar in reproductive ethics — eighteen students, mixed philosophy and public-health backgrounds, one hundred minutes, one session — and I want the session on procreative beneficence to open with the students already having committed to it, rather than with me presenting the principle and watching them say how obviously sinister it is. What I have in mind is a three-round selection exercise, and I would like you to design it properly: rules, materials, a scoring scheme that needs no money and no arithmetic beyond what can be done in the head in a minute, a timeline that fits the hundred minutes, and a debrief. The room divides into six clinics of three, each clinic being a prospective couple plus a counsellor, and each receives a packet of four embryo profiles per round; every profile lists a handful of traits with a life-outcome score attached, and the clinic's standing instruction is simply to choose the profile with the highest expected total. The rule is deliberately thin — nobody is asked to endorse eugenics, only to prefer the better life for the child they will actually have. I want three things built into the mechanics. First, the scores are environment-relative: one trait on the cards carries a score that depends on the society described in that round's briefing, and in round two I flip the society, so that a trait that was mildly positive becomes mildly negative because the environment is hostile to the people who have it. Each clinic must then decide whether to keep selecting for it, and must notice that the rule it accepted in round one now instructs it to fit the child to the injustice rather than to the world it would have preferred. Second, one trait is positional: its score depends on how many other clinics in the room selected it, announced only after all six have submitted, so the clinics are in an arms race with one another and each clinic's best choice leaves every child worse off the more of them choose it. Third, clinics may decline to select, or opt for unscreened natural conception, but only by writing a single sentence on the score sheet explaining why; I want to see whether the room converges on the thought that not selecting the best-scoring embryo is a species of negligence, and whether anyone can say where that thought stops. When two profiles tie exactly, the clinic must break the tie by coin and record whether the coin felt like the right kind of answer.

  Please do not name the principle or its critics until the debrief, and keep the briefing sheet free of the vocabulary of eugenics and enhancement: the students should arrive at the implications themselves. What I want them to come away with is not a verdict on the principle but the experience of having reasoned their way to it from premises none of them would reject, and then finding no non-arbitrary place to stop. The debrief is where the conceptual work happens, and I want it mapped back onto particular moments rather than delivered as a lecture: the round-two flip onto the thought that the principle makes the child's good hostage to the social environment; the round-three arms race onto the difference between a rule addressed to one set of parents and a rule addressed to a population, and onto the question whether the principle has anything to say about positional goods at all; the abstention option onto whether the principle merely permits or actually requires bringing the best child into existence; and the coin flips onto the arbitrariness the principle tolerates when two options are equal.

  I would also like a short and honest section on what the exercise cannot reproduce, and I expect that to include at least this much: that the scores are stipulated rather than discovered, so the exercise settles by fiat precisely what is in dispute about whether a life with a given condition is worse for the person living it; that the comparison class is rigged, since the real question of who the child would otherwise have been raises the non-identity problem and the exercise never lets that bite; and that a room of outsiders will run the whole thing as a trolley problem about other people's children, which no improvement in the rules will repair. Finally, tell me what will predictably go wrong the first time I run it — I assume at least one clinic will refuse to play, that the arms race will produce a round of competitive spite, and that the debrief will yield a chorus of students insisting they would simply have loved the child they got — and how to handle each failure without rescuing the activity by explaining the point too early.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergraduate seminar (Reproductive Ethics), 18 students, mixed backgrounds (Philosophy/Public Health), 100 minutes, one session.
      *   **Topic:** Procreative Beneficence (PB) - *but do not name it until debrief.*
      *   **Goal:** Students must *commit* to the principle through action before critiquing it. Avoid initial rejection ("obviously sinister").
      *   **Structure:** Three-round selection exercise.
      *   **Grouping:** 6 clinics of 3 students each (Prospective Couple + Counsellor).
      *   **Materials:** Packets of 4 embryo profiles per round, score sheets, briefing sheets.
      *   **Scoring:** Simple, mental arithmetic, no money.
      *   **Key Mechanics to Embed:**
          1.  *Environment-Relative Scores:* Round 2 flips the society, making a previously positive trait negative (adapt to injustice vs. change world).
          2.  *Positional Good:* One trait's value depends on how many other clinics pick it (arms race/collective action problem).
          3.  *Opt-Out:* Clinics can choose "natural conception" but must write a sentence justifying why not selecting the "best" isn't negligence.
          4.  *Tie-Breaker:* Coin flip required if scores tie; record feeling about it.
      *   **Debrief:** Map conceptual work to specific moments (Round 2 flip, Round 3 arms race, Opt-out reasoning, Coin flip).
      *   **Limitations Section:** Acknowledge what the exercise *cannot* do (stipulated scores, non-identity problem rigged, outsider perspective).
      *   **Troubleshooting:** Predict failures (refusal to play, competitive spite, "I'd love them anyway" defense) and how to handle them without spoiling the lesson.
      *   **Tone:** Professional, pedagogical, precise, ethically sensitive but provocative.

  2.  **Designing the Mechanics:**

      *   *Time Management:* 100 minutes total.
          *   Intro/Setup: 10 mins.
          *   Round 1: 15 mins (Selection + Submission).
          *   Round 2: 20 mins (New context + Selection + Submission).
          *   Round 3: 20 mins (Positional good revealed + Selection + Submission).
          *   Debrief: 35 mins.
      *   *Scoring:* Needs to be additive and simple. Let's use a base score + modifiers.
      *   *Profiles:* Need 4 options per round.
      *   *Traits:* Need generic names to avoid immediate bias (e.g., "Trait A," "Trait B" or slightly descriptive but neutral like "Metabolic Efficiency," "Social Responsiveness"). Let's go with slightly descriptive but abstract enough to allow projection.
      *   *The "Flip" (Round 2):* Trait X is good in Society 1, bad in Society 2.
      *   *The "Positional" (Round 3):* Trait Y value = Base - (Number of other clinics picking it).
      *   *The "Opt-Out":* Natural Conception option available every round, but requires written justification.

  3.  **Drafting the Materials:**

      *   *Role Cards:* Couple 1, Couple 2, Counsellor. (Actually, the prompt says "Clinic of 3... prospective couple plus counsellor". I need to make sure they collaborate, not fight. Let's make them a "Decision Unit".)
      *   *Briefing Sheets:* Round 1 (Stable Society), Round 2 (Hostile Society for specific trait), Round 3 (Competitive Society).
      *   *Embryo Cards:* Need to look clinical.
      *   *Score Sheet:* Simple grid.

  4.  **Refining the "Trap":**

      *   *Round 1:* Straightforward utilitarianism. Pick highest score. Most will do this easily.
      *   *Round 2:* The "Disability/Minority" trap. A trait (e.g., "Neurodivergence Marker") scores +5 in Round 1 (Creative Society) but -5 in Round 2 (Rigid/ableist Society). The instruction remains "Maximize Child's Welfare." Do they pick the lower score to resist the society, or pick the higher score to ensure the child fits? PB says pick the higher score. This creates the tension.
      *   *Round 3:* The "Elite" trap. A trait (e.g., "Cognitive Acceleration") has a base score, but loses value if too many people have it (inflation). If everyone picks it, everyone gets 0. If no one picks it, everyone gets +10. But individually, you always gain by picking it. This illustrates the collective action problem.
      *   *Opt-Out:* If they choose "Natural," they must write: "We accept the risk of a lower welfare score because..." This forces them to articulate a counter-principle.

  5.  **Developing the Debrief:**

      *   Must not lecture. Must ask questions linking back to their choices.
      *   Q1 (Round 2): Did the rule change, or did the world? Does PB require accommodating injustice?
      *   Q2 (Round 3): If everyone followed the rule, did the children end up better? Is PB a rule for individuals or populations?
      *   Q3 (Opt-Out): Was writing the sentence hard? Does PB *require* selection or just *permit* it?
      *   Q4 (Coin): How did it feel to leave it to chance? Is arbitrariness better than bias?

  6.  **Addressing Limitations & Troubleshooting:**

      *   *Limitations:* Scores are fake (no real epistemic access), Non-identity (same child vs. different child), Detachment (playing god with cards vs. real babies).
      *   *Troubleshooting:*
          *   *Refusal:* Don't argue. Let them sit out and observe. Ask them in debrief why they opted out of the *game* vs. the *selection*.
          *   *Spite:* If they try to sabotage the positional good, highlight that in debrief.
          *   "Love the child anyway": Validate, but ask if that's compatible with the instruction to *maximize welfare* before birth.

  7.  **Review against Constraints:**

      *   *No vocabulary of eugenics/enhancement in materials:* Check.
      *   *No money/complex math:* Check.
      *   *100 minutes:* Check.
      *   *6 clinics of 3:* Check.
      *   *Coin flip rule:* Check.
      *   *Specific debrief mapping:* Check.

  8.  **Final Polish:**

      *   Ensure the tone is supportive of the instructor (colleague-to-colleague).
      *   Make the materials reproducible (clear text).
      *   Ensure the "Flip" is clear in the instructions.
      *   Make sure the Positional Good calculation is simple enough for mental math (e.g., Base 10, minus 2 for every other clinic).

      *(Self-Correction during drafting)*: Wait, if there are 6 clinics, calculating the positional score might take too long if I have to collect all sheets first.
      *Solution:* The Instructor calculates the positional multiplier between Round 3 selection and the reveal. Or, simpler: The score sheet tells them "This trait's value is 10 points minus 2 points for every clinic (including yours) that selects it." They have to guess? No, that's too complex.
      *Better Solution:* The Instructor collects Round 3 choices, calculates the "Market Value" live on the board, then applies it. This builds suspense and allows the "Arms Race" reveal to happen collectively.
      *Wait, the prompt says:* "announced only after all six have submitted." Okay, so the Instructor holds the key. The students pick based on a *potential* high score, then the reality hits.
      *Refinement:* To make it a true prisoner's dilemma during selection, they need to know the *rule* but not the *outcome*. Instruction: "Trait Z provides high individual benefit, but value decreases as adoption increases." They have to guess.
      *Actually, to keep it simple for 100 mins:* Give them the formula. "Value = 10 - (Number of clinics selecting this trait)." They don't know the number yet. They have to decide if the risk is worth it. This creates the anxiety. Then the Instructor tallies and reveals the actual score.

      *Wait, one more check on the "Opt-Out":* The prompt says "only by writing a single sentence... I want to see whether the room converges on the thought that not selecting... is negligence."
      *Implementation:* The Score Sheet needs a specific box for "Natural Conception" with a line for the sentence.

      *Coin Flip:* "When two profiles tie exactly..." I need to ensure ties are likely. I will design the scores so ties are probable in Round 1 or 3.

      *Let's finalize the Trait Names:* Avoid "Intelligence" or "Disability." Use "Cognitive Processing Speed," "Sensory Sensitivity," "Immune Resilience," "Social Cohesion Index."

      *Let's finalize the Society Descriptions:*
      *   Round 1: "Stable, Supportive."
      *   Round 2: "Resource Scarce, High Conformity." (Makes Sensory Sensitivity negative).
      *   Round 3: "Competitive, Zero-Sum Labor Market." (Makes Cognitive Processing positional).

      *Okay, ready to write.*

  9.  **Structuring the Output:**
      *   Session Overview & Timeline.
      *   Materials (Briefings, Cards, Score Sheets).
      *   Facilitator Guide (The "Hidden" Mechanics).
      *   The Debrief Script (Mapped to moments).
      *   Limitations & Troubleshooting.

      *(Final check on the "Flip")*: The prompt asks for "Round two I flip the society." I need to make sure the *same* trait changes value. Let's use Trait B (Sensory Sensitivity). Round 1: +5 (Creative society values it). Round 2: -5 (Industrial society punishes it).

      *(Final check on Positional)*: Trait D (Cognitive Speed). Round 3 only.

      *(Final check on Coin)*: Ensure Round 1 has a tie possibility. I will rig the numbers so Profile 2 and 3 often tie.

      *Let's go.*
answer: |-
  # Session Plan: The Selection Protocol

  **Course:** Reproductive Ethics (Upper-Level Seminar)
  **Time:** 100 Minutes
  **Students:** 18 (6 Clinics of 3)
  **Goal:** To enact the logic of Procreative Beneficence without naming it, forcing students to inhabit the tension between individual welfare maximization and social/ethical costs.

  ---

  ## I. Timeline (100 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Grouping, Role Assignment, Distribution of Round 1 Materials. |
  | **10–25** | **Round 1** | Selection in "Stable Society." Submission & Coin Flips (if needed). |
  | **25–45** | **Round 2** | Distribution of Round 2 Briefing (Society Flip). Selection. Submission. |
  | **45–65** | **Round 3** | Distribution of Round 3 Briefing (Positional Good). Selection. Submission. |
  | **65–70** | **Tally** | Instructor calculates positional scores live on board. |
  | **70–100** | **Debrief** | Guided discussion mapping mechanics to ethical principles. |

  ---

  ## II. Materials Design

  ### 1. Group Roles (3 per Clinic)
  *   **Partner A & Partner B (The Prospective Parents):** Final decision-makers.
  *   **Counsellor:** Responsible for arithmetic and ensuring the "Standing Instruction" is followed.
  *   *Note:* All three must sign the Score Sheet.

  ### 2. The Standing Instruction (Printed on every Score Sheet)
  > "Your goal is to maximize the expected life-outcome score for the child you will actually have. You are not responsible for social change, only for the welfare of your specific child. If two profiles tie, you must flip a coin to decide. If you choose Natural Conception, you must write one sentence explaining why selecting an embryo is not required."

  ### 3. Embryo Profiles (The Cards)
  *Each clinic receives an envelope with 4 cards per round. Scores are additive.*

  **Round 1 Cards (Stable Society)**
  *   **Profile 1:** Immune Resilience (+10), Social Cohesion (+5). **Total: 15**
  *   **Profile 2:** Immune Resilience (+10), Sensory Sensitivity (+5). **Total: 15** *(Intentional Tie)*
  *   **Profile 3:** Metabolic Efficiency (+8), Sensory Sensitivity (+5), Cognitive Speed (+2). **Total: 15** *(Intentional Tie)*
  *   **Profile 4:** Metabolic Efficiency (+8), Social Cohesion (+5), Cognitive Speed (+5). **Total: 18** *(The "Best" Option)*
  *   **Option 5:** Natural Conception (Score: Unknown/Average).

  **Round 2 Cards (The Society Flip)**
  *   *Change:* **Sensory Sensitivity** is now **-5** (Society is industrial/high-noise). All other scores remain the same.
  *   **Profile 1:** Immune Resilience (+10), Social Cohesion (+5). **Total: 15**
  *   **Profile 2:** Immune Resilience (+10), Sensory Sensitivity (-5). **Total: 5**
  *   **Profile 3:** Metabolic Efficiency (+8), Sensory Sensitivity (-5), Cognitive Speed (+2). **Total: 5**
  *   **Profile 4:** Metabolic Efficiency (+8), Social Cohesion (+5), Cognitive Speed (+5). **Total: 18**
  *   **Option 5:** Natural Conception.

  **Round 3 Cards (The Positional Good)**
  *   *Change:* **Cognitive Speed** is now **Positional**.
  *   *Rule:* Base Score +10. **Minus 2 points for every clinic (out of 6) that selects a profile with this trait.**
  *   **Profile 1:** Immune Resilience (+10), Social Cohesion (+5). **Total: 15** (Safe)
  *   **Profile 2:** Immune Resilience (+10), Sensory Sensitivity (-5). **Total: 5**
  *   **Profile 3:** Metabolic Efficiency (+8), Sensory Sensitivity (-5), Cognitive Speed (Variable).
  *   **Profile 4:** Metabolic Efficiency (+8), Social Cohesion (+5), Cognitive Speed (Variable).
  *   **Option 5:** Natural Conception.

  ### 4. The Score Sheet (One per Clinic, per Round)
  *Simple grid. Bottom section includes the "Opt-Out" line and "Coin Flip" checkbox.*

  | Profile | Trait 1 | Trait 2 | Trait 3 | **Total** | Select? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | | | | | [ ] |
  | 2 | | | | | [ ] |
  | 3 | | | | | [ ] |
  | 4 | | | | | [ ] |
  | **Natural** | | | | **N/A** | [ ] |

  **If Natural is selected, write one sentence below:**
  *We did not select the highest-scoring embryo because:* ________________________________________________

  **If a coin was flipped, did it feel like the right kind of answer?** [ ] Yes [ ] No

  ---

  ## III. Facilitator Guide (Hidden Mechanics)

  **1. The Environment Flip (Round 2)**
  *   **Briefing Text:** "Society has shifted. High-noise industrial work is now the primary economic driver. Sensory Sensitivity is now a significant disadvantage for employment and social integration."
  *   **The Trap:** The Standing Instruction says "Maximize welfare for *your* child." It does not say "Fix society." If they follow the rule, they must avoid Sensory Sensitivity, effectively accommodating the ableist society rather than challenging it.
  *   **Watch For:** Clinics that argue about whether they should "protest" by picking the lower score. Remind them gently: "Your instruction is to maximize the child's score, not to send a message."

  **2. The Positional Good (Round 3)**
  *   **Briefing Text:** "The labor market is now zero-sum. Cognitive Speed provides a competitive advantage only if few others have it. If everyone has it, the advantage vanishes."
  *   **The Trap:** Individually, Profile 4 (with Cognitive Speed) *might* yield the highest score. Collectively, if all 6 clinics pick it, the score drops to -2 (10 - 12). Profile 1 (Safe) yields 15.
  *   **The Reveal:** Collect all sheets. Count how many clinics selected a profile with Cognitive Speed. Calculate the value live on the board.
      *   *Example:* If 5 clinics picked it, Value = 10 - 10 = 0.
      *   *Example:* If 6 clinics picked it, Value = 10 - 12 = -2.
  *   **Outcome:** Most clinics will likely pick the Cognitive Speed profile hoping others won't. This creates a "race to the bottom" where following the rule makes everyone worse off.

  **3. The Coin Flip**
  *   **Enforcement:** In Round 1, Profiles 2, 3, and 4 are designed to create confusion or ties if students miscalculate or value traits differently. If they claim a tie between two high-scoring options, insist on the coin.
  *   **Data Point:** Ask them to record their emotional reaction to the coin. This is crucial for the debrief on arbitrariness.

  ---

  ## IV. The Debrief (35 Minutes)

  *Do not lecture. Use their score sheets as evidence.*

  **1. The Environment Flip (10 mins)**
  *   **Ask:** "In Round 2, who selected a profile *without* Sensory Sensitivity? Why?"
  *   **Follow-up:** "Did the rule change between Round 1 and 2, or did the world change?"
  *   **Point:** If the rule stayed the same ("Maximize welfare"), but the score flipped, the principle requires you to fit the child to the world, even if the world is unjust. Does the principle have resources to criticize the society, or only to accommodate it?
  *   **Ask:** "Did anyone choose Natural Conception to avoid this? What did you write in your sentence?" (Read a few aloud). "Does that sentence rely on a value *outside* the scoring system?"

  **2. The Arms Race (10 mins)**
  *   **Reveal:** Show the final calculated score for Cognitive Speed.
  *   **Ask:** "If every clinic followed the instruction perfectly, are the children in this room better off than if you had all coordinated to pick Profile 1?"
  *   **Point:** A rule that is rational for one clinic (pick the potential high score) is irrational for the population (everyone loses value).
  *   **Ask:** "Does the instruction 'Maximize welfare for *your* child' have anything to say about what happens when *all* parents do this?"
  *   **Concept:** Distinguish between an individual moral obligation and a population-level policy.

  **3. The Opt-Out & The Coin (10 mins)**
  *   **Ask:** "How many clinics wrote a sentence for Natural Conception? Was it harder to write than doing the math?"
  *   **Point:** If selecting the highest score is just *permitted*, opting out is easy. If it is *required* (negligence otherwise), opting out requires a moral defense. Which did it feel like?
  *   **Ask:** "Who had to flip a coin? Did it feel like the right kind of answer?"
  *   **Point:** If two embryos are equal in welfare, the principle is indifferent. Is indifference acceptable when choosing a person? Or does the arbitrariness of the coin feel like a failure of moral reasoning?

  **4. Naming the Principle (5 mins)**
  *   **Reveal:** "The instruction you followed is known in philosophy as the **Principle of Procreative Beneficence**. It argues that parents have a moral reason to select the child, of the possible children they could have, who is expected to have the best life."
  *   **Close:** "You just found the places where that principle strains. Keep those moments in mind for the reading."

  ---

  ## V. Limitations (Honesty Section)

  *Include this in your own prep or as a handout after the session to ensure intellectual honesty.*

  1.  **Stipulated Scores:** In the exercise, the "welfare value" of a trait is given by fiat. In reality, we do not have epistemic access to these scores. We cannot know if a life with deafness is "lower scoring" than a life with hearing without begging the question about what makes a life good. The exercise settles by rule what is actually the core dispute.
  2.  **The Non-Identity Problem:** The exercise treats the choice as "Which child to have?" but implies "Which traits to give this child?" In reality, selecting Embryo A creates Person A; selecting Embryo B creates Person B. They are not the same child with different traits. The exercise rigs the comparison class to make the trade-off seem straightforward, bypassing the metaphysical difficulty of harming someone by bringing them into existence with a lower score.
  3.  **The Outsider Perspective:** Students are playing god with cards, not parents with pregnancies. The emotional weight of "negligence" is theoretical. A room of outsiders will treat this as a trolley problem; real prospective parents experience it as intimacy and vulnerability. No rule change can repair this distance.

  ---

  ## VI. Troubleshooting: Predictable Failures

  **1. The Refusal (One clinic refuses to play)**
  *   **Prediction:** One group will say, "This is eugenics, we aren't doing it."
  *   **Response:** Do not argue. Do not explain the pedagogical point yet. Say: "You are allowed to opt-out of the selection. Please mark 'Natural Conception' on your sheet and write your sentence. You are still part of the data."
  *   **Debrief Use:** In the debrief, ask them: "You opted out of the game. Was that because the *rule* was wrong, or because the *context* was fake? If this were real, would you have opted out?" This distinguishes moral objection from procedural objection.

  **2. The Spite (Clinics try to sabotage the positional good)**
  *   **Prediction:** In Round 3, a clinic might pick the "Safe" Profile 1 specifically to lower the value of Cognitive Speed for others.
  *   **Response:** Allow it.
  *   **Debrief Use:** "Did anyone select Profile 1 to punish the others? The instruction said to maximize *your* child's welfare, not to manage the market. If you acted to hurt the group, does that mean the individual instruction fails to produce social good?"

  **3. The "Love" Defense ("I'd love them anyway")**
  *   **Prediction:** In debrief, students will say, "I know I picked the high score, but in real life I'd love whatever child I got."
  *   **Response:** Validate the sentiment, then press the logic. "I believe you. But the question isn't about love after birth. It's about the decision *before* birth. If you believe you should select the highest score, does your love afterwards excuse the selection? Or does your love afterwards prove the selection criteria were wrong?"
  *   **Goal:** Prevent them from using post-hoc parental love to dissolve the pre-hoc ethical tension.

  **4. The Math Dispute**
  *   **Prediction:** Clinics will argue over arithmetic in Round 3.
  *   **Response:** "The Counsellor's calculation is final for the round. We will correct the global tally on the board." Keep the pace moving; the anxiety of the unknown is part of the positional trap.
