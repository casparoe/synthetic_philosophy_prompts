answer: |-
  The Bureau of Flow and Toll sat in the basement of District 4, a room smelling of ozone and old paper. Elias sat before the Resonator, a console of brushed steel and brass dials. There were no manuals. There were no rulebooks. There was only the Field, a circular screen displaying the City's conceptual topology, and the Knobs.

  Each Knob controlled a dimension of being. *Propulsion. Substrate. Payload. Intent.*

  Around the perimeter of the Field floated the Anchors: glowing orbs labeled with the tax categories. **CAR**, **BIKE**, **PEDESTRIAN**, **TOOL**, **TOY**. Their positions shifted slightly every day, drifting like continents on a slow mantle. Elias's job was to bring new objects into the Field and see which Anchor pulled them in.

  The applicant stood at the counter, clutching a tablet. "It's the Agro-Glide," he said. "Personal urban agriculture."

  Elias didn't look up. He tapped the intake key. A wireframe model of the object materialized in the center of the Field. It was a single vertical wheel, self-balancing. Attached to the base was a wide, flat deck with spinning blades. Two small bucket seats were bolted to the top, one behind the other.

  "Begin," Elias murmured.

  He reached for the *Propulsion* Knob. It was currently set to *Human-Powered*. He turned it toward *Combustion*. The wireframe grew a small exhaust pipe. In the Field, the **BIKE** Anchor glowed brighter, pulling the wireframe toward it. But as Elias pushed the dial past *Electric* to *Hybrid*, the **BIKE** label flickered. The letters stretched. The 'I' thickened into a piston. The **BIKE** Anchor drifted away from **TOY** and closer to **CAR**.

  "Wait," the applicant said. "It's mostly electric."

  Elias ignored him. He adjusted the *Payload* Knob. *Single Rider* clicked to *Dual Occupant*.

  The effect was immediate. The **PEDESTRIAN** Anchor, usually distant and dim, surged with light. A stroller appeared in the cluster of examples surrounding **PEDESTRIAN**. The wireframe of the Agro-Glide slid across the Field, leaving the **BIKE** cluster. But as it moved, the definition of **PEDESTRIAN** began to warp. The text on the screen bled. **P E D E S T R I A N** softened, the edges blurring until it read something like **P A S S E N G E R**. The examples orbiting it changed: a person walking became a person in a wheelchair, then a person on a Segway, then two people on a bench that was moving.

  "It has a mower deck," Elias noted, his hand on the *Function* Knob. He turned it to *Landscaping*.

  The **TOOL** Anchor snapped toward the wireframe. But **TOOL** was not a vehicle category. It was a tax exemption class. As the wireframe touched the **TOOL** field, the **CAR** Anchor recoiled. The boundary line between **VEHICLE** and **EQUIPMENT** dissolved. The wireframe was now a *Moving Tool*.

  "It's sidewalk legal," the applicant added quickly.

  Elias sighed and turned the *Substrate* Knob to *Pedestrian Zone*.

  The Resonator hummed, a low vibration that rattled Elias's teeth. The Field shuddered. The **PEDESTRIAN** Anchor (now reading **P A S S E N G E R**) merged with the **TOOL** Anchor. They spun together, creating a new gravitational well. The wireframe settled there.

  But the slippage wasn't contained. Elias watched the periphery. The **CAR** Anchor was expanding. It was absorbing **BUS**. The **BIKE** Anchor was shrinking, shedding its *Motorized* examples, which were floating away into a new, unlabelled void. The word **ROAD** on the map beneath the Anchors began to swap places with **PATH**.

  "It's done," Elias said. "Category: Mobile Appliance."

  "Is that... is that toll-free?"

  Elias looked at the console. The knob for *Taxable* was vibrating. It wasn't set to Yes or No. It was oscillating between them, a blur of grey. When he looked back at the Field, the label **MOBILE APPLIANCE** was eating the word **EXEMPT**. The letters of **EXEMPT** were crawling over to **APPLIANCE**, rearranging themselves into **EXPENSE**.

  "It depends," Elias said, watching the **BIKE** Anchor dissolve entirely into a cloud of points that looked suspiciously like **LIVESTOCK**. "Come back tomorrow. The definitions might have settled."

  ***

  **Note on Conceptual Theory**

  The story likely gets the theory of concepts wrong by reifying the "conceptual space." In the story, the categories physically move and change their semantic content on the screen as if the ontology of the city is objectively fluid. In cognitive science (specifically the Hofstadter-esque tradition this mimics), slippage is a *mental* phenomenon, not an external one. The machine in the story externalizes the clerk's cognition, making the slippage a property of the universe rather than a property of the observer's mind. Furthermore, legal classification is performative; the clerk's decision *makes* it true, whereas the story suggests the clerk is *discovering* a truth that is actively running away from him.

  I would change my mind about this being a good illustration if the story focused more on the clerk's internal confusion rather than the machine's display warping. If the "slippage" were shown through Elias's inability to recall the distinct boundaries between "bike" and "moped" as he works, rather than the labels physically melting, it would better capture the idea that concepts are neural habits subject to context, rather than magical entities on a screen. The current version risks suggesting that concepts have a "true position" that moves, rather than positions that are constructed anew in every act of categorization.
