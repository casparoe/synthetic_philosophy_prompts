      *   *Secondary Claim:* Empirical evidence is often a proxy for deeper normative/conceptual commitments. Settling the science wouldn't settle the argument.
      *   *Evaluation:* This is a strong philosophical framework. It aligns with "conceptual engineering" and "deep disagreement" theories. I need to apply this lens to the three cases without simply agreeing blindly. I need to look for nuances where facts *do* matter vs. where they are proxies.

