answer: |-
  Your hypothesis is astute and aligns with a specific framework in contemporary philosophy of language and epistemology. Philosophers David Plunkett and Tim Sundell describe this as **"metalinguistic negotiation."** This occurs when speakers disagree not just about the world, but about how the world should be carved up by concepts. They are negotiating which concept should be attached to a word (e.g., "woman," "fair," "safe") to serve their normative goals.

  Furthermore, this touches on what Robert Fogelin called **"deep disagreement"**: disputes where parties lack a common framework of rules or standards to adjudicate the argument. When you argue about facts, you assume shared standards of evidence. When you argue about values, you assume shared moral axioms. In deep disagreements, even the standards for evidence and the axioms themselves are contested.

  Your hypothesis holds up well under scrutiny, but with a crucial nuance: it is rarely *just* conceptual. It is usually a stack of empirical, normative, and conceptual layers, where the empirical layer is often weaponized to settle the normative layer.

  Here is the diagnosis for each of the three disputes, testing your hypothesis against the structure of the disagreement.

  ---

  ### 1. Sports Eligibility
  **The Dispute:** Sex-based eligibility (fairness) vs. Identity-based eligibility (inclusion).

  *   **Factual Layer:** Do trans women retain physiological advantages (bone density, lung capacity, hemoglobin) after hormone therapy? Does this advantage vary by sport (swimming vs. shooting)?
  *   **Conceptual Layer:** What is the concept of **"Fairness"** in sport?
      *   *Side A* defines fairness as **biological leveling**: Competition should be between bodies with similar physiological potentials. "Woman" is a proxy for a specific biological range.
      *   *Side B* defines fairness as **procedural/social leveling**: Competition should be between people who share a social lived experience. "Woman" is a proxy for social identity and legal status.
  *   **Value Layer:** What is the *purpose* of sport? Is it to identify the absolute biological limit of human performance (Excellence), or to provide a social good that fosters participation and dignity for a marginalized group (Inclusion)?

  **Diagnosis:**
  Your hypothesis is **strongly confirmed** here. The empirical data (e.g., "trans women retain X% advantage after Y years") is treated as decisive by Side A, but Side B often views that data as irrelevant to the *purpose* of the category.
  *   **Where empirical questions are not doing the real work:** Even if we proved conclusively that trans women had *zero* physiological advantage, Side A might still object on the principle that the category "women's sport" exists to protect biological females from male puberty. Conversely, even if a significant advantage were proven, Side B might argue that inclusion outweighs competitive integrity in non-elite contexts.
  *   **Where empirical questions matter:** In elite Olympic contexts, the margin for "fairness" is razor-thin. Here, facts constrain the conceptual negotiation more tightly than in high-school sports.

  **What counts as progress?**
  Not a shared definition of "woman." Progress would be **categorization by function rather than identity.** If sports organizations moved away from a binary "Men/Women" split toward "Open/Restricted" or categorized by physiological markers (e.g., hemoglobin levels, muscle mass) regardless of gender identity, the conceptual deadlock dissolves. However, this is often rejected by both sides (Side A sees it as erasing women; Side B sees it as invasive).
  *   *Verdict:* This is a conceptual disagreement about the *telos* (purpose) of sport, masked as a biological debate. It is unlikely to be fully resolved without abandoning the binary category entirely.

  ---

  ### 2. Single-Sex Spaces (Changing Rooms, Shelters)
  **The Dispute:** Sex-based access (privacy/safety) vs. Identity-based access (dignity/access).

  *   **Factual Layer:** Does allowing trans women into women's shelters increase the risk of sexual assault? Does the presence of trans people increase discomfort or dropout rates for cis users?
  *   **Conceptual Layer:** What is the concept of **"Safety"** and **"Privacy"**?
      *   *Side A* defines safety/privacy as **bodily segregation**: Safety is the absence of exposure to male-bodied individuals. Privacy is the right to not be seen by biological males.
      *   *Side B* defines safety/privacy as **psychological security**: Safety is the absence of discrimination and harassment. Privacy includes the right of trans people to not be outed or excluded.
  *   **Value Layer:** How do we weigh **risk mitigation** against **civil rights**? Is the potential (even if statistically low) risk to cis women a sufficient reason to exclude trans women?

  **Diagnosis:**
  Your hypothesis is **partially confirmed**, but the empirical layer is heavier here than in sports.
  *   **Where empirical questions are doing real work:** Side A often argues from a premise of predation risk ("men pretending to be trans"). If it were empirically proven that inclusive policies led to *no* increase in incidents (which some data suggests), Side A's argument weakens significantly. However, Side A often shifts to "principle" when data contradicts them ("It's not about crime, it's about biology").
  *   **Where empirical questions are proxies:** The debate often hinges on the definition of "woman." If "woman" means "adult human female," Side A wins. If "woman" means "person identifying as a woman," Side B wins. The empirical risk of assault is often a stand-in for the normative claim that biological sex *should* be the primary sorting mechanism for intimacy.

  **What counts as progress?**
  **Distinction of context.** A shelter for survivors of domestic violence by male partners is different from a public gym locker room.
  *   *Progress:* Acknowledging that "Safety" is not a monolith. In high-vulnerability spaces (rape crisis centers), biological sex may remain the operative concept due to the specific nature of the trauma being treated. In low-vulnerability spaces (public restrooms), social identity may be the operative concept.
  *   *Verdict:* This is a clash of values (privacy vs. dignity) fought over the definition of "safety." Resolution requires contextual nuance, not a universal rule.

  ---

  ### 3. Youth Medicine (Blockers and Hormones)
  **The Dispute:** Access (affirmation) vs. Restriction (caution).

  *   **Factual Layer:** What are the rates of desistance (growing out of dysphoria)? What are the long-term effects of blockers on bone density and brain development? Does affirmation reduce suicide rates?
  *   **Conceptual Layer:** What is the concept of **"Medical Care"** and **"Consent"**?
      *   *Side A* defines care as **harm reduction**: The immediate risk of suicide/self-harm outweighs unknown long-term physical risks. "Consent" involves the minor's assent + parental support.
      *   *Side B* defines care as **protective paternalism**: The state/parents must protect the child from irreversible decisions they may regret later. "Consent" requires full adult cognitive maturity.
  *   **Value Layer:** How do we weigh **present suffering** against **future regret**?

  **Diagnosis:**
  Your hypothesis is **weakest here**, but still relevant. This is the one domain where empirical facts *should* be decisive, yet they are interpreted through value lenses.
  *   **Where empirical questions are doing the real work:** If blockers were proven to cause severe cognitive impairment in 50% of users, Side A's position would collapse. If affirmation were proven to reduce suicide by 90%, Side B's position would collapse. The uncertainty of the data allows the values to drive the bus.
  *   **Where empirical questions are proxies:** The debate often masquerades as "follow the science," but the science is incomplete. The real disagreement is about the **threshold of risk**. Side A accepts physical risk to alleviate psychological pain. Side B accepts psychological pain to prevent physical risk. No amount of data settles what level of risk is acceptable.

  **What counts as progress?**
  **Better longitudinal data and decision frameworks.**
  *   *Progress:* Not a shared definition of "trans," but a shared protocol for risk assessment. For example, agreeing that blockers (reversible) are distinct from hormones (partially irreversible) and surgery (irreversible), and applying different evidentiary standards to each.
  *   *Verdict:* This is a value disagreement about risk tolerance, exacerbated by empirical uncertainty. Settling the science would narrow the gap, but not close it, because the weighting of "regret" vs. "dysphoria" is normative.

  ---

  ### Overall Diagnosis of Your Hypothesis

  You are correct that **metalinguistic negotiation** is the engine of the deadlock. When someone says, "Trans women are women," they are not making a biological claim; they are proposing a norm: *"We ought to treat gender identity as the socially salient category for womanhood."* When someone replies, "No, sex is biological," they are countering with a different norm: *"We ought to treat biological sex as the socially salient category for womanhood."*

  Because both sides believe they are stating facts ("It *is* discrimination" vs. "It *is* biology"), they perceive the other as lying or irrational (bad faith).

  **Where the hypothesis needs refinement:**
  It is not *only* about words. It is about **conceptual engineering for political ends.** The fight over the word "woman" is a fight over who gets access to resources, protections, and social recognition. The empirical questions (sports advantage, medical outcomes) are not merely distractions; they are the **constraints** on the negotiation.
  *   If biology made trans women physically fragile, the sports debate would vanish.
  *   If transition caused guaranteed sterilization, the medical debate would shift.
  *   Facts constrain the possible concepts, but they do not dictate them.

  ### What Genuinely Counts as Progress?

  Since these are deep disagreements involving competing moral frameworks, you should not expect **resolution** (one side winning). You should aim for **clarification**.

  1.  **Stop litigating facts as if they are verdicts.**
      *   *Progress:* "We agree that trans women retain some physiological advantage, but we disagree on whether that advantage disqualifies them from competition. Is that right?"
      *   This moves the argument from "You deny science" to "We prioritize different values."

  2.  **Identify the Conceptual Proposal.**
      *   *Progress:* "When you say 'safe,' do you mean 'statistically unlikely to be assaulted' or 'free from the discomfort of opposite-sex bodies'?"
      *   This reveals that Side A might be willing to accept trans people if "safety" is defined statistically, or Side B might realize "comfort" is the actual barrier.

  3.  **Accept "Local" Resolutions over "Universal" Truths.**
      *   *Progress:* Acknowledging that the definition of "woman" that works for a **shelter** (biological) might differ from the definition that works for a **voting booth** (identity).
      *   This rejects the idea that one definition must rule all contexts.

  4.  **Recognize the Trade-off.**
      *   *Progress:* Admitting that every policy creates a victim. Inclusive sports policies may disadvantage cis women; exclusive policies disadvantage trans women.
      *   The argument should then be about *which disadvantage is more justifiable*, not about whether the disadvantage exists.

  ### Conclusion

  Your hypothesis is robust. You are witnessing a **normative conflict disguised as a descriptive one.** Both sides use empirical claims as leverage to win a conceptual war about how society should be organized.

  You will not resolve this by finding the perfect study on puberty blockers or athletic advantage. Progress in your conversations will only come when you can successfully pivot the discussion from **"What is true?"** to **"What are we trying to achieve, and what are we willing to sacrifice to get it?"**

  If you can get your interlocutors to admit that their position entails a trade-off they are willing to accept, the accusation of bad faith often dissipates. They aren't lying; they just value different things and are using words to try to make those values the default. Recognizing this won't make you agree, but it may make the argument bearable.
