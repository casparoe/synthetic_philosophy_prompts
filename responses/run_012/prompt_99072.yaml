      *   *Positions:* Sex-based (privacy/safety) vs. Identity-based (dignity/access).
      *   *Factual Layer:* Risk of predation (do trans women pose a risk to cis women?). Efficacy of segregation in reducing harm.
      *   *Conceptual Layer:* What does "safe" mean? (Physical safety vs. Psychological comfort). What does "woman" mean in this context? (Biological category vs. Social identity).
