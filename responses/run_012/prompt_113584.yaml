  **TO:** Board of Directors, Campus Food Co-op
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding the Mutual-Credit Scrip Proposal

  **Recommendation**
  I recommend that the Board **vote against adopting the mutual-credit scrip proposal in its current form** at Thursday's meeting. Instead, we should table the proposal and form a subcommittee to investigate whether a differentiated credit system (reflecting task difficulty/need) could function without violating our bylaws, or whether we can better secure our mission through caps on surplus distribution while retaining legal currency. We should aim to report back by the November meeting.

  **Analysis of the Manager's Argument**
  The manager is correct that for Aristotle, money (*nomisma*) is a matter of convention (*nomos*) rather than nature (*physis*). It does not exist by physical necessity but by social agreement. However, the manager's inference—that because money is conventional, *any* convention will serve the same moral purpose—is where the Aristotelian analysis breaks down.

  For Aristotle, the convention of money exists to solve a specific problem: **commensurability**. In *Nicomachean Ethics* V.5, he argues that exchange requires proportional reciprocity. A builder and a shoemaker must exchange goods that are qualitatively different. Money serves as a common measure (*metron*) that quantifies these differences so that justice can be maintained. Crucially, Aristotle identifies the underlying basis of this commensurability not as labor input, but as **need** (*chreia*). Money represents the community's demand for the goods exchanged.

  **The Problem with Labor-Time as Measure**
  The proposed scrip fixes the unit of value at one hour of labor, regardless of the task. This does not discover the commensurability required for just exchange; it **stipulates** it. By asserting that all hours are equal, the system ignores the qualitative differences in the *value* of that labor to the community's need.

  This is where the Treasurer's practical objection becomes philosophically decisive. The concern that unpleasant shifts (e.g., cleaning, waste management) will go unfillable is not merely a logistical hurdle; it is evidence that the measure of value is flawed. In Aristotelian terms, the "need" for the grease trap to be cleaned is high, but the "supply" of laborers willing to do it is low. A just exchange system must reflect this proportion to ensure the work gets done. A flat-rate scrip severs the link between the reward and the *need* for the task. It treats the acquisition of credits as an end in itself, detached from the actual provisioning of the household.

  **Oikonomia vs. Chrematistike**
  The manager's stated goal is to keep us on the side of *oikonomia* (acquisition of goods for use) and prevent *chrematistike* (acquisition of wealth for its own sake). This is the correct moral aim. However, *oikonomia* requires the successful management of the household's resources. If the exchange mechanism fails to allocate labor to necessary tasks (as the Treasurer predicts), the co-op cannot provision itself. A system that prevents the community from acquiring what it needs because it refuses to measure value accurately undermines *oikonomia* just as surely as speculative profit-seeking does.

  We cannot avoid the moral complexity of exchange by changing the currency. If the scrip fails to reflect the reality of our mutual needs, it becomes a technical barrier to justice rather than a tool for it.

  **Conclusion**
  We should not adopt a system that claims Aristotelian authority while ignoring his requirement that exchange measure need. I move we reject the flat-rate scrip and explore alternative methods to limit accumulation and prioritize use-value without breaking the mechanism of reciprocal justice.
