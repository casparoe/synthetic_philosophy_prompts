  To evaluate decision theories facing the Pasadena Game, we need desiderata that separate structural integrity from intuitive preferences. The core failure is that Expected Utility Theory (EUT) relies on convergent sums; Pasadena provides a conditionally convergent series that violates this.

  **Non-Negotiable Requirements**
  1.  **Order Invariance:** The value of a gamble cannot depend on the convention used to sum its payoffs. If description changes the value, the theory measures bookkeeping, not utility. This motivates the rejection of natural-order summation as a definitive value. Description-invariance is synonymous here; same gamble, different partition, same verdict.
  2.  **Statewise Dominance:** If Option A yields a strictly better outcome than Option B in every possible state, A is rationally required over B. This drives the Altadena case: Pasadena plus $1 dominates Pasadena. Any theory refusing this fails basic rationality. Silence that quietly becomes permissiveness (allowing you to pick the dominated option) is a critical bug.
  3.  **Forced Choice Guidance:** When refusal is impossible, the theory must rank options. Silence is permissible in opt-in cases, but in forced choices between two undefined expectations, dominance must break the tie. Paralysis in forced choice is irrational.

  **Contested Preferences**
  4.  **Completeness:** Must the theory rank all pairs? Requiring verdicts everywhere forces arbitrary conventions (like natural-order summation). Accepting incomparability is preferable to false precision. A theory declaring almost everything incomparable stops guiding choice, but one that forces comparisons lies.
  5.  **Mixture Coherence:** If Game A is undefined, should A mixed with its mirror image (-A) equal zero? Intuition says yes, but some theories struggle to derive defined values from undefined components. Coherence here is desirable but hard to secure without violating Invariance.
  6.  **Finite Approximation:** Should the infinite game's value equal the limit of its finite truncations? Since truncation limits vary by order, privileging the natural order limit (ln 2) violates Order Invariance. However, ignoring finite intuitions makes the theory disconnected from practical reasoning.
  7.  **Bounded Utility:** Declaring utility bounded solves the math instantly but looks like fiat. It preserves EUT but denies the possibility of the game's setup. Is this a principled constraint on agents or a dodge?
  8.  **St Petersburg Preservation:** A solution shouldn't render the St Petersburg game (infinite positive expectation) unplayable. Intuition says play; a fix for Pasadena shouldn't break this.

  **Impossibility Results**
  You cannot jointly satisfy Order Invariance, Statewise Dominance, and Completeness (always giving a verdict) while allowing unbounded utilities. If you demand a verdict for every pair (Completeness) without bounding utility, you must privilege a summation order, violating Invariance. If you respect Invariance and Dominance (Altadena), you must accept incompleteness (Principled Silence) for some pairs. Dominance and Invariance are the stronger constraints; Completeness must go.

  **Recommendation**
  The strongest approach adopts **Dominance-Based Principles (specifically Weak Expectation)**. Standard expectation fails, but Weak Expectation averages outcomes over symmetric trials, recovering values for mixtures like Pasadena + Mirror while respecting Order Invariance. It treats Expected Utility as secondary to dominance reasoning. This respects Altadena (Pasadena + $1 > Pasadena) and handles Forced Choices without arbitrarily bounding utility or privileging summation orders. It accepts incompleteness as a feature, not a bug: when dominance fails and expectations are undefined, there is no fact of the matter about rational choice. This preserves Order Invariance and avoids the fiat of bounded utility, while keeping St Petersburg playable via dominance or infinite positive sums. It acknowledges that rationality sometimes runs out of verdicts rather than fabricating them.
