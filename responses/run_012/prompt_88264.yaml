  ### Summary

  **Key Driver:** The status of the **Idealization Defence**. Whether AAT is a descriptive law (which (P) correctly critiques) or a normative consistency constraint (which falsifies (P)) carries 80% of the weight of my number.

  **Evidence Needed:** Documented cases where invoking AAT changed agent behavior *without* perfect conditions being met (e.g., prediction markets or Delphi methods where the *expectation* of convergence forced information sharing).

  **Condition for Explanatory Work:** For AAT to explain a disagreement I have witnessed, the disputants must accept a shared partition and prior as a rational obligation. The theorem would then explain the disagreement not as a stable state, but as a transient signal of information asymmetry or computational error that *ought* to be resolved.

