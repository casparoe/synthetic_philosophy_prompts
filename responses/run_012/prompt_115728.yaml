prompt: |-
  Im a postdoc running a metaphysics reading group out of my flat on Thursday nights — six regulars, none of them philosophers by training, two of them are biologists, all of them smart and all of them willing to argue. Next week's topic is the special composition question. I've taught it badly before: I open with "when do some things compose a further thing?", everyone nods, and an hour later it's clear nobody has any idea why anyone would care, and the whole thing collapses into "well, it's just a matter of how you use the word 'chair'".

  So don't explain the special composition question to me — you're someone who's taught this exact session to non-specialists a dozen times, so plan how I should run it. Think it through before you commit; I'd rather see your reasoning than a tidy handout. What has to be in place before the question can even register as a question rather than a word game, the order the pieces have to go in, and why each depends on the one before it. I keep reaching for the Ship of Theseus as my carrying example and I suspect that's a seperate mistake, but I can't say why; tell me whether it can carry the session, and if it can't, what should, and what that example has to have — and conspicuously lack — to do the job.

  Then the misconceptions: the ones they'll walk in with and the ones my own framing will plant, in the order they'll actually surface, and the exact point in the sequence where I should head each off. My guess is "this is just semantics" is the big one, plus some version of "so the world is vague then". The biologists will want to talk about colonies and borderline cases of being alive, and I'd like to use that rather than dodge it — I'd like to land somewhere near whether an ecosystem or a coral reef can be a thing, since two of them care about that for other reasons.

  Finish with what I should openly refuse to go into at this level, and one question I could put to the room at the end that tells me whether they've actually got the question rather than just the vocabulary. No reading list — they won't do it and I don't want one. And if I've got the framing wrong somewhere, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the User and Context:**
      *   **User:** Postdoc in metaphysics (so knows the technical details but struggles with pedagogy for non-specialists).
      *   **Setting:** Flat, Thursday nights, informal but serious (6 regulars, smart, willing to argue).
      *   **Audience:** Non-philosophers (2 biologists, others smart laypeople).
      *   **Topic:** Special Composition Question (SCQ).
      *   **Past Failure:** Opened with the abstract question, led to "it's just semantics/word usage," collapsed interest.
      *   **Goal:** A session plan that makes the question *matter*, avoids semantic deflation, uses appropriate examples (evaluating Ship of Theseus), incorporates biologist interests (ecosystems/colonies), and identifies specific misconceptions.
      *   **Constraint:** No reading list. Show reasoning before the plan.

  2.  **Deconstruct the Problem:**
      *   *Why did it fail before?* Starting with "When do some things compose a further thing?" is too abstract. It sounds like a definition search. Non-philosophers default to linguistic conventionalism ("It depends what you mean by 'thing'").
      *   *What needs to happen first?* The audience needs to feel the *ontological weight* of the question. It can't be about words; it has to be about reality. They need to see that different answers imply different worlds.
      *   *The Ship of Theseus:* The user suspects it's a mistake. They are right. Ship of Theseus is about *persistence through time* (diachronic identity), not *composition at a time* (synchronic composition). Using it confuses the SCQ with the problem of vagueness/identity over time.
      *   *The Biologist Angle:* This is a goldmine. Organisms vs. heaps vs. ecosystems. It grounds the metaphysics in their expertise.
      *   *Misconceptions:* "It's just semantics," "The world is vague," "Science decides this."
      *   *Ending:* Need a diagnostic question to check understanding.

  3.  **Step-by-Step Reasoning & Planning:**

      *   **Phase 1: Pre-requisites (Setting the Stage).**
          *   Before asking *when* composition happens, they need to agree *that* it's a substantive question.
          *   Need to distinguish "conceptual schemes" from "ontological commitment."
          *   Need a synchronic example (at a single time), not diachronic (over time).
          *   *Reasoning:* If they think it's about how we *talk*, the session is dead. If they think it's about how the world *is*, it's alive.

      *   **Phase 2: The Example (Ship of Theseus vs. Alternatives).**
          *   *Ship of Theseus:* Bad for SCQ. It's about identity over time. If you use it, they'll argue about replacement parts, not about whether the parts *now* make a whole.
          *   *Better Example:* Needs to be a "borderline case" of composition at a time.
          *   *Idea:* A scattered object. The "Trout-Turkey" (Quine) or something biological.
          *   *Biologist Hook:* A coral reef? A lichen? A colony of bacteria?
          *   *Selection:* Let's use a **scattered object** first to break intuition, then move to the **biological case**. Maybe "The items on this coffee table" vs. "The coffee table." Or better: "Do your left shoe and the Eiffel Tower compose an object?" (Van Inwagen's classic).
          *   *Decision:* Start with the absurd (Shoe + Eiffel Tower) to force the "Universalism vs. Nihilism" tension. Then move to the Biological (Colony vs. Organism) for the nuanced debate.

      *   **Phase 3: Sequencing the Argument.**
          *   1. Establish the stakes (Ontology vs. Language).
          *   2. The Extreme Cases (Nihilism vs. Universalism) to show the spectrum.
          *   3. The Common Sense Middle (Restrictivism) and why it's hard to defend.
          *   4. The Biological Application (The payoff for the biologists).
          *   5. The "So What?" (Why this changes how we count reality).

      *   **Phase 4: Misconceptions & Defusing.**
          *   *Semantics:* Head this off immediately. Frame it as "counting reality," not "naming."
          *   *Vagueness:* Distinguish epistemic/linguistic vagueness from ontological vagueness.
          *   *Science:* Science tells us what the parts do; metaphysics asks if the "whole" exists over and above the parts.

      *   **Phase 5: What to Exclude.**
          *   Diachronic identity (Ship of Theseus).
          *   Mereological formalism (sums, products, etc.).
          *   Historical exegesis (Aristotle vs. Democritus).

      *   **Phase 6: The Diagnostic Question.**
          *   Needs to force a choice that reveals their ontological commitment, not just their vocabulary.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Critique of Ship of Theseus:* I need to explain *why* it's wrong clearly. It confuses *persistence* with *composition*.
      *   *The "Semantics" Trap:* How to avoid it? Use the "Inventory of the Universe" thought experiment. If God made a list of everything that exists, would "chair" be on it? Or just "atoms arranged chairwise"?
      *   *Biologist Hook:* Use the "Lichen" or "Coral" example. Is a coral colony one animal or many? Science describes the causal connections; Metaphysics asks if there is a *substance* there.
      *   *Structure:*
          1.  Reasoning/Analysis (as requested).
          2.  The Session Plan (Order of operations).
          3.  Misconception Management.
          4.  Exclusions.
          5.  Diagnostic Question.

  5.  **Refining the Tone:**
      *   The user is a peer (postdoc). Tone should be collegial, direct, slightly informal but rigorous.
      *   Acknowledge their past failure without being condescending.
      *   Focus on *pedagogical strategy*.

  6.  **Self-Correction/Check during drafting:**
      *   *Did I address the "why care" aspect?* Yes, by framing it as "counting what exists."
      *   *Did I address the biologists?* Yes, using the organism/colony distinction.
      *   *Did I explain why Ship of Theseus is bad?* Yes, diachronic vs. synchronic.
      *   *Is the reasoning visible?* Yes, the prompt asks to "Think it through before you commit." I will structure the response to show the pedagogical logic first.

  7.  **Final Polish:**
      *   Ensure the distinction between "contact," "fastening," and "life" as composition criteria is clear.
      *   Make sure the "Semantics" defusal is early.
      *   Check the diagnostic question: It needs to be punchy. "If we burn the chair, how many things cease to exist?"

  8.  *(Self-Correction on the Diagnostic Question)*: "If we burn the chair..." might be ambiguous. Better: "Imagine a universe with only two electrons. How many objects are there?" (Tests Universalism vs. Nihilism). Or, "If you remove one atom from a chair, is it still a chair?" (That's vagueness). Let's go with the "Inventory" test. "God's inventory."

      *Wait, better diagnostic:* "If composition never happens, how do you explain the difference between a living cat and a pile of cat ashes?" This forces them to articulate *why* composition might be restricted without just saying "it's alive."

      *Actually, the prompt asks for a question to tell if they got the question.*
      Question: "If I say 'there is nothing here but atoms,' am I making a scientific claim or a metaphysical one?"
      *No, that's too abstract.*
      *How about:* "If Universalism is true, name an object in this room that you didn't notice before." (Forces them to see scattered objects).
      *Let's go with the "Scattered Object" test.*

      *Okay, let's finalize the plan.*

      *   **Reasoning Section:** Why the previous attempt failed (abstraction), why Ship of Theseus is wrong (diachronic), why semantics is the enemy.
      *   **The Plan:** 1. The Inventory (Stakes). 2. The Extremes (Nihilism/Universalism). 3. The Middle (The hard part). 4. The Biology (Application).
      *   **Misconceptions:** Semantics (start), Vagueness (middle), Science (biology section).
      *   **Exclusions:** Time, Formalism.
      *   **Diagnostic:** The "Scattered Object" challenge.

      *Wait, one more thing:* The user wants to know *what the example must have and lack*.
      *   Have: Synchronic existence. Clear parts. Ambiguous unity.
      *   Lack: Temporal change. Functional ambiguity (initially).

      *Okay, ready to write.*
answer: |-
  Here is the reasoning behind the plan, followed by the session structure itself.

  ### Part 1: Pedagogical Reasoning & Diagnosis

  **1. Why your previous attempt collapsed**
  You opened with the abstract formulation ("When do some things compose a further thing?"). For non-specialists, this immediately triggers a linguistic frame. They hear "compose" and "thing" and assume you are asking for a dictionary definition. They default to *conceptual relativism*: "It depends on how we carve up the world." Once they decide it's about *our concepts* rather than *the world*, the stakes vanish. If it's just language, nobody is wrong, and nobody cares.

  To fix this, you must establish **ontological stakes** before you introduce the question. They need to feel that different answers result in different *universes*, not just different dictionaries. You need them to feel the tension between "common sense" (there are chairs) and "parsimony" (there are only atoms).

  **2. The Ship of Theseus Problem**
  You are right to suspect the Ship of Theseus. **Do not use it.**
  *   **Why it fails:** The Ship of Theseus is a problem of *diachronic identity* (persistence through time). The Special Composition Question (SCQ) is a problem of *synchronic composition* (what exists right now).
  *   **The Confusion:** If you use the Ship, the biologists will talk about cell replacement and metabolic turnover. That's a fascinating question, but it's not the SCQ. It allows them to dodge the hard metaphysical work by appealing to continuity of function over time.
  *   **What the Example Needs:**
      *   **Synchronic:** It must exist at a single instant. No time travel, no replacement parts.
      *   **Scattered/Arbitrary:** It must challenge the intuition that things need to be touching to be one thing.
      *   **Causal Connection (Optional but helpful):** It should allow for a debate about whether causal integration is necessary for existence.
  *   **What it Must Lack:**
      *   **Temporal Extension:** No "over time."
      *   **Functional Ambiguity:** Don't start with "Is this a chair?" Start with "Is this *an object*?" Function invites semantics ("chair" is a functional concept). Existence invites ontology.

  **3. The Biologist Hook**
  The biologists want to talk about colonies/organisms. This is excellent, but only *after* you have established the metaphysical framework. If you start there, they will treat it as a biological classification problem ("Well, scientifically, a colony is..."). You need to force them to see that science describes the *arrangement* and *causal relations*, but metaphysics asks if that arrangement *constitutes a substance*.

  **4. The "Semantics" Trap**
  This is the session killer. It arises because they conflate *truth conditions* with *word usage*.
  *   **Defusal Strategy:** The "God's Inventory" thought experiment. If God listed everything that exists in the universe, would "chair" be on the list, or only "atoms arranged chairwise"? This bypasses human language and targets reality.

  ---

  ### Part 2: The Session Plan (Thursday Night)

  **Total Time:** 90 Minutes
  **Goal:** Move from "It's just words" to "We disagree about what exists."

  #### Phase 1: Setting the Stakes (0–15 mins)
  **Activity:** The Inventory of the Universe.
  **Script:** "Imagine God creates the universe. He finishes. Before he rests, he writes down an inventory list of everything that exists. Every single item. My question is: How long is that list?"
  *   **Scenario A:** The list includes atoms, electrons, and quarks. It does *not* include chairs, cats, or people. (Nihilism)
  *   **Scenario B:** The list includes atoms, but also every possible combination of atoms. There is an object composed of your left shoe and the Eiffel Tower. (Universalism)
  *   **Scenario C:** The list includes atoms, plus some specific arrangements (chairs, cats), but not others (shoe+Eiffel). (Restrictivism/Common Sense)

  **Why this works:** It forces them to pick a worldview. It makes it clear that this isn't about the word "chair"; it's about whether "chair" refers to a fundamental feature of reality or a useful fiction.
  **Intervention:** If someone says, "It depends on the list's purpose," stop them. "The list is of *existence*. Not utility. Does the thing *exist*?"

  #### Phase 2: The Extremes & The Intuition Pump (15–35 mins)
  **Activity:** Van Inwagen's "Shoe and Eiffel Tower."
  **Script:** "Look at your left shoe. Look at the Eiffel Tower. Is there an object that is composed of exactly those two things and nothing else?"
  *   **Most will say No.**
  *   **Ask Why:** They will say "They aren't touching," or "They don't do anything together."
  *   **Push:** "If I glue them together, do they become one object? If I glue them with a 10-mile long strand of glue, are they one object?"
  *   **Goal:** Show that *contact* and *fastening* are slippery criteria. This undermines the "Common Sense" view (Restrictivism) without yet offering a solution.

  **The Example Switch:** Now, introduce the **Coral Reef** (for the biologists).
  *   **Script:** "Consider a coral reef. Biologically, it's thousands of polyps. Metaphysically, is it one object? Or is it just 'polyps arranged reef-wise'?"
  *   **Crucial Distinction:** Ask the biologists: "Does biology *tell* you it's one object, or does biology tell you how the parts interact, and *you* decide if that counts as 'one object'?"
  *   **Why:** This separates the scientific data (causal relations) from the metaphysical conclusion (substantial unity).

  #### Phase 3: The Hard Middle (35–60 mins)
  **Topic:** Defending Restrictivism (The Common Sense View).
  **Problem:** Most people want to say "Shoe+Eiffel = No" but "Cat = Yes."
  **Challenge:** "What is the magic ingredient?"
  *   Is it **Contact**? (No, a handshake breaks contact but people remain people).
  *   Is it **Fastening**? (No, a loose screw is still part of the engine).
  *   Is it **Life**? (Van Inwagen's answer: Only living things compose wholes).
  *   **Debate:** Ask the biologists: "Is a virus an object? Is a mitochondrion an object? Is a ecosystem?"
  *   **Goal:** Make them feel the pain of drawing a line. If they can't define the line, maybe the line isn't there (Universalism) or everything is an illusion (Nihilism).

  #### Phase 4: The "So What?" (60–75 mins)
  **Topic:** Ontological Commitment.
  **Script:** "Why does this matter? If I say 'There is no chair, only atoms,' do I stop sitting?"
  *   **Answer:** No. But it changes how we count reality.
  *   **Implication:** If Nihilism is true, there are no populations, only organisms. If Universalism is true, there are infinite objects in this room.
  *   **Biologist Payoff:** "If you study ecosystems, are you studying a *thing* or a *process*? If it's not a thing, can it have rights? Can it be damaged in a way that isn't just damage to the parts?" This connects metaphysics to their ethical/professional concerns.

  #### Phase 5: Wrap & Diagnostic (75–90 mins)
  (See Diagnostic Question below).

  ---

  ### Part 3: Misconception Management

  Here are the misconceptions in the order they will surface, and exactly where to head them off.

  **1. "This is just semantics / how we use words."**
  *   **When:** Phase 1 (The Inventory).
  *   **Defusal:** "If I say 'There are no chairs,' and you say 'There are chairs,' and we both agree on the location of every atom, are we disagreeing? If yes, it's not semantics. It's about whether 'chair' picks out a *real unity* or just a *convenient description*."
  *   **Key Phrase:** "We are not arguing about the word 'chair'. We are arguing about whether the universe contains chairs."

  **2. "So the world is vague then?"**
  *   **When:** Phase 3 (Trying to draw the line between Cat and Pile of Atoms).
  *   **Defusal:** Distinguish *Epistemic Vagueness* (I don't know where the boundary is) from *Ontological Vagueness* (The boundary doesn't exist).
  *   **Argument:** "If composition is vague, then existence is vague. Does it *vaguely exist*? That sounds crazy. Either it's on God's Inventory List or it isn't."

  **3. "Science decides this." (The Biologist Trap)**
  *   **When:** Phase 2/3 (Coral Reef discussion).
  *   **Defusal:** "Science tells us the polyps exchange nutrients. Science tells us they share DNA. Science does *not* have a instrument that detects 'substantial unity'. That's a philosophical filter you put on top of the science."
  *   **Key Phrase:** "Science gives you the map. Metaphysics asks if the borders on the map are real rivers or just drawn lines."

  **4. "But I need to sit on the chair." (Pragmatism)**
  *   **When:** Phase 4.
  *   **Defusal:** "Nihilism doesn't say you'll fall through the floor. It says what you are sitting *on* is not a single object. It's an ethical/ontological claim, not a practical one."

  ---

  ### Part 4: What to Refuse (The "No Go" Zones)

  To keep this from collapsing, you must explicitly rule out three topics. Write these on the board if necessary.

  1.  **No Time:** "We are not talking about whether the chair exists tomorrow. We are talking about whether it exists *now*. No Ship of Theseus."
  2.  **No Function:** "We are not asking if it's a *good* chair or if it works. A broken chair is still a composition problem. Don't argue from utility."
  3.  **No History:** "We are not asking how it was made. A naturally occurring rock formation and a sculpted statue pose the same composition question."

  ---

  ### Part 5: The Diagnostic Question

  Do not ask "Do you understand?" They will nod. Do not ask "What is the SCQ?" They will recite the definition.

  **Ask this:**
  > "Imagine a universe containing only two electrons, a billion miles apart.
  >
  > **Question:** How many objects are in that universe?
  >
  > **A:** Two.
  > **B:** Three (The two electrons + the object composed of them).
  > **C:** It depends on whether we find a use for the pair."

  **Why this works:**
  *   If they say **A**, they are Restrictivists or Nihilists (they require contact/life).
  *   If they say **B**, they are Universalists (any plurality composes a whole).
  *   If they say **C**, they have fallen back into the Semantic Trap (you need to gently correct them: "Remember, we are asking what *exists*, not what we *name*.")

  This forces them to apply the metaphysical framework to a sterile case where biology and function cannot save them. If they can answer this, they have the question.
