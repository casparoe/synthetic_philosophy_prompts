answer: |-
  There is no single standard term, so let's call it **The Origin-Verdict Slide**.

  This concept describes the error of treating conflict initiation as a discrete factual event when it is actually a narrative choice carrying moral weight. As you noted, it combines four elements: retroactive labeling (reaction defines action), temporal arbitrariness (the sliding window), narratability bias (drama over drift), and moral smuggling (origin equals blame).

  In history and law, we separate *cause-in-fact* from *proximate cause*, but those tools aim to assign liability for harm, not to resolve competing origin stories between agents. Philosophers call this "causal selection," but that lacks the moral sting you identified. The Origin-Verdict Slide specifically targets how we weaponize chronology to assign guilt. It differs from a "loaded question" because the question isn't logically flawed; it's pragmatically useless for finding truth, even if it works perfectly for assigning blame.

  Does it cover edge cases? If there is a genuine first move with no prior history—say, a random assault on a stranger—the Slide doesn't apply. The window doesn't slide because there's no prior context to select. The start and the fault align. However, these are rare in geopolitics or family feuds. Almost all human conflict has latency.

  When power is imbalanced, the Slide becomes a tool of oppression. The dominant party sets the window narrowly around the subordinate's resistance. For example, a colonized people revolt; the colonizer calls the revolt the "start" of violence, erasing decades of exploitation. Here, the Fallacy isn't just confusion; it's propaganda. The "narratable event" (the revolt) overshadows the "slow part" (the oppression), allowing the powerful to claim defensive reaction. In this scenario, the Slide protects the instigator of the conditions by punishing the instigator of the event.

  Is "who started it" ever the right question? Rarely. It assumes conflict is an anomaly rather than a process. It demands a villain instead of a diagnosis. In your Cold War example, asking who started it forces a binary choice on a systemic spiral. In the neighbor feud, it ignores the boundary dispute that made the slammed door inevitable.

  Swap the question. Instead of "Who started it?", ask **"What conditions made this collision inevitable?"** or **"Where was the last opportunity for de-escalation?"** The first shifts focus from agents to systems (acknowledging the slow build). The second focuses on agency and responsibility without getting bogged down in chronological origami. It asks who *could* have stopped it, rather than who technically moved first.

  Your brother-in-law wasn't wrong about the facts; he was wrong about the utility of the question. You both identified the same slide but stood on different steps. Recognizing the Origin-Verdict Slide doesn't solve the conflict, but it stops you from fighting about the clock when you should be fighting about the cause.
