prompt: |-
  Ok so I'm in this little reading group that's working through The Mind's I and we finally hit the dialogue where somebody sits down and has a conversation with a book that's supposed to be Einstein's brain, and my friend Jordan has been completely insufferable about it ever since. Jordan's rule is: a mental state has to have an owner. Some one thing has to be the thing that's in the state. If you can't point at the object that's having the thought, then there isn't any thought, and you can't point at a book and a reader and the air in between them and call the pile a mind. My rule is: what matters is that there's a single loop of processing that closes on itself and is available to itself. One loop, one mind, and I don't care how many objects you have to smear it accross to get the loop. Neither of us is pretending we invented these, we just want to watch them fight.

  So here's the job. Build me two cases, one paragraph each, no longer. Case A: everything the owner rule wants is there — one clean, unambiguous physical bearer, one object you could walk up and tap — and yet the one-loop rule says the answer is either zero minds or more than one. Case B: everything the loop rule wants is there — one loop, closed, available to itself, and the system says and does exactly what an ordinary person says and does while having an ordinary thought — and yet the owner rule says zero minds or more than one. Outward behavior is held fixed in both cases, and in both cases it's perfect. Constraints, and I mean these: no new physics, no split-brain patients (used up, and it makes Case A too easy), no China brains, no giant lookup tables, no gradual neuron-by-neuron replacement, no perfect predictors, and nothing may turn on the system being "too big" or "too slow." And Case B can't just be the book again with the serial numbers filed off — the loop has to be closed while the thing is running, not assembled over an hour of page-turning. Both cases should be things a lab could at least describe out loud without laughing.

  Then do the audit, and be strict about it. For each case: state what each of the two rules delivers and why, and show that the verdict falls out of the rule rather than out of how you wrote the case — if a verdict only lands because the scenario was rigged, say so and tell me how you'd un-rig it. Then tell me which of the two rules is actually carrying the weight in the original book case (I have a suspicion that it's the owner rule and that my loop rule is mostly decoration, but I'd like to be argued out of it), and which one I should give up if I want the book to come out conscious after all. Finish with one honest paragraph on whether some third rule handles both of my cases without the weirdness, and if it does, whether it's a real position or just "whatever my intuitions happen to say," which is what Jordan keeps accusing me of anyway. American English please, and no reading list — I can't look anything up right now.
