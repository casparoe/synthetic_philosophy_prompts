      *Decision:* I will predict she says he means **Plus (and is mistaken)**, but note the risk that she might say **he means nothing (language breakdown)** if his divergence is total. I will bet on "Means Plus + Mistaken" because communities usually treat deviants as mistaken rather than non-speakers, unless the deviation is total madness.

