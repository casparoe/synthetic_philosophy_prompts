answer: |-
  You have hit on the central meta-philosophical insight of the last thirty years of this debate: the disagreement isn't just about which theory is true, but about what work the concept of "function" is supposed to do in our explanations. When philosophers talk past each other, it is usually because they are prioritizing different items on the "spec sheet."

  Here is the specification for a theory of biological function, broken down by desiderata, the tension between them, and the structural constraints that force the split between the camps you are studying.

  ### I. The Desiderata (The Spec Sheet)

  To count as adequate, a theory of function is generally expected to satisfy the following constraints. I have divided them into **Core Intuitions** (usually treated as non-negotiable for a *philosophical* account) and **Extensional Desires** (often treated as house preferences or empirical constraints).

  #### 1. The Malfunction Constraint (Normativity)
  *   **The Requirement:** The theory must allow for the possibility that a trait fails to perform its function without ceasing to *have* that function.
  *   **The Case:** A heart with a congenital valve defect that has never pumped blood efficiently, or a heart that has stopped in a corpse. We still say "its function is to pump blood," even though it isn't doing so.
  *   **Why it matters:** This distinguishes *function* from *activity*. If function just meant "what it does," nothing could malfunction; it would just be doing something else. This constraint introduces **normativity** (how things *ought* to be) into a naturalistic framework.
  *   **Status:** **Non-negotiable** for most etiological accounts; often compromised by causal-role accounts.

  #### 2. The Distinction Constraint (Function vs. Effect)
  *   **The Requirement:** The theory must distinguish between a trait's proper function and its mere causal byproducts or side effects.
  *   **The Case:** The heart makes a "thump-thump" noise. This is a reliable causal effect. But it is not the function. If the noise were the function, we would expect selection to have optimized the acoustics.
  *   **Why it matters:** Without this, "function" becomes synonymous with "causal capacity," rendering the concept useless for explaining why an organism is structured the way it is.
  *   **Status:** **Non-negotiable.** Almost every camp claims to satisfy this, but they define the boundary differently.

  #### 3. The Novelty Constraint (Ahistorical Capacity)
  *   **The Requirement:** The theory must assign functions to traits that have no selection history (new mutations) or traits currently used for something other than their historical origin (exaptations).
  *   **The Case:** A spontaneous mutation arises that confers resistance to a new toxin. It has not yet been "selected for" (no history), yet biologists want to say its function is detoxification. Or: feathers evolved for insulation before flight.
  *   **Why it matters:** Biology is forward-looking and dynamic. If a trait needs a long selection history to have a function, then evolution cannot get started, and exaptations are misdescribed.
  *   **Status:** **House Preference.** Crucial for Causal-Role (Cummins) and Systems views; the biggest headache for Selected-Effects (Millikan/Neander).

  #### 4. The Naturalism Constraint (Scientific Usage)
  *   **The Requirement:** The theory should align with how working biologists actually use the term in research contexts, particularly in molecular biology and genomics.
  *   **The Case:** The ENCODE project controversy. One camp said 80% of the genome is "functional" because it is biochemically active (transcribed/bound). The other camp said only ~10% is functional because only that portion is conserved by selection.
  *   **Why it matters:** If a philosophical theory declares that most of what biologists call "function" is actually just "effect," the theory risks being revisionist rather than analytic.
  *   **Status:** **Contested.** SE theorists argue biologists are being sloppy; CR theorists argue SE is too narrow.

  #### 5. The Scope Constraint (Unity vs. Pluralism)
  *   **The Requirement:** Does the theory need to cover artifacts (paperweights), biological traits (kidneys), and medical norms (health) with one definition?
  *   **The Case:** A paperweight's function is determined by human intention. A kidney's is not. A diseased kidney is "malfunctioning" in a medical sense, but is it malfunctioning in an evolutionary sense?
  *   **Why it matters:** If you demand a Unified Theory, you force biological function to look like artifact function (intention-based) or vice versa.
  *   **Status:** **House Preference.** Many modern philosophers (e.g., Garson) argue for **Pluralism**: different concepts of function for different explanatory contexts.

  ---

  ### II. The Incompatibility Result

  You asked if some subset of requirements cannot be satisfied together. **Yes.** This is the structural engine of the debate.

  You cannot simultaneously satisfy **The Malfunction Constraint**, **The Novelty Constraint**, and **The Distinction Constraint** without qualifying the scope of the theory.

  1.  **To get Malfunction (Normativity):** You need a standard against which performance is measured. In nature, the only naturalistic standard available is **History** (what the trait was selected to do). If you ground function in history (SE), you satisfy Malfunction.
  2.  **To get Novelty (Ahistoricity):** You need to ground function in **Current Capacity**. If a trait is new, it has no history. If you ground function in current capacity (CR), you satisfy Novelty.
  3.  **The Conflict:**
      *   If you choose **History (SE)**: You solve Malfunction (the heart *should* pump because ancestors did), but you fail Novelty (the new mutation has no history, so it has no function yet).
      *   If you choose **Current Capacity (CR)**: You solve Novelty (the new mutation does something, so it has a function), but you fail Malfunction (if the heart *can't* pump, pumping is not its causal role, so it has no function).

  **The Trade-off:** You must choose between **Normativity** (Malfunction) and **Ahistorical Applicability** (Novelty).
  *   If you want to explain why a broken heart is still a heart, you must accept that brand-new traits have no functions.
  *   If you want to say brand-new traits have functions, you must accept that a heart that cannot pump has no function (or that "malfunction" is just a change in causal role).

  ---

  ### III. The "Most Excluding" Requirement

  If you are looking for the single requirement that does the most work in filtering theories, it is **The Malfunction Constraint (Normativity).**

  This is the constraint that knocks out the most otherwise plausible theories.
  *   **Why:** It is relatively easy to define function as "causal contribution to a system's capacity" (Cummins). This is clean, scientific, and handles novelty perfectly. It is *only* the demand that a trait can fail to do its function while retaining the function that breaks this account.
  *   **The Exclusion:** The Malfunction Constraint forces you to look **outside** the current organism. You cannot find the norm inside the current system (because the current system includes the defect). You must look to the **etiology** (history) or to **external intentions** (artifacts).
  *   **Consequence:** This is why the Etiological/Selected-Effects view dominates the "strict" philosophical literature. It is the only view that naturalizes normativity without invoking God or Human Designers. If your paper wants to tackle the hardest problem, tackle how to ground normativity naturalistically.

  ---

  ### IV. A Note on Pluralism (The Scope Constraint)

  Regarding your question on whether we are owed one theory: The trend in recent philosophy of biology is **Honest Pluralism**.

  *   **Biological Function (SE):** Used when explaining *why a trait exists* (evolutionary biology). Handles malfunction well.
  *   **Causal Role Function (CR):** Used when explaining *how a system works* (physiology, biochemistry). Handles novelty and genomic activity well.
  *   **Medical Function:** Often a hybrid, referencing both statistical norms and survival value.

  If you argue for Pluralism, you dissolve the tension between Malfunction and Novelty by saying they belong to different *concepts* that share the word "function." However, your seminar seems focused on finding *the* account of biological function, so be careful: pluralism can sometimes look like dodging the question of what makes biological function *biological*.

  ---

  ### V. Brief Scorecard: SE vs. CR

  Here is how the two poles you mentioned fare against the spec, so you can verify the tension yourself.

  | Desideratum | Selected-Effects (Millikan/Neander) | Causal-Role (Cummins) |
  | :--- | :--- | :--- |
  | **Malfunction** | **Pass.** A trait functions if it was selected for X, even if it currently fails at X. | **Fail.** If a trait cannot do X, X is not its causal role. (Some hybrids try to fix this). |
  | **Distinction** | **Pass.** Side effects weren't selected for; functions were. | **Pass.** Side effects don't contribute to the containing system's capacity in the relevant way. |
  | **Novelty** | **Fail.** New traits have no selection history. (Neander argues they gain function immediately upon first reproduction, but this is contentious). | **Pass.** If it does it now, it functions now. |
  | **Genomics (ENCODE)** | **Fail.** Most biochemically active DNA is "junk" (not selected). Conflicts with some biologists' usage. | **Pass.** If it binds/transcribes, it has a causal role. Aligns with "biochemical function." |
  | **Normativity** | **Pass.** Grounded in historical success conditions. | **Fail.** Purely descriptive; lacks "ought." |

  **Summary for your paper:** The debate persists not because one side is blind to the evidence, but because they are optimizing for different constraints. The Selected-Effects crowd prioritizes **Malfunction/Normativity** (making biology explanatory of *design*). The Causal-Role crowd prioritizes **Novelty/Usage** (making biology descriptive of *mechanism*). The "Most Excluding" requirement is Malfunction, because satisfying it forces you into history, which immediately creates the problem of Novelty.
