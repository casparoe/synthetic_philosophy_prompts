answer: |-
  "Give me the keys," said Elena.

  "I can't," said Julian. "I'm respecting Reflection."

  "You've had eight pints."

  "And in three hours, I'll be 100% sure I'm fit to drive. Credence one."

  "Because you'll be drunk."

  "But I know that now. So my expected future credence is one. Which means, by Reflection, my current credence must be one."

  "Julian, the principle assumes your future self isn't compromised."

  "It assumes I can't knowingly disagree with him. And I can't." He unlocked the car. "Epistemically, I have to treat his future certainty as evidence for my current state."

  "You're going to crash."

  "Then his credence was false. But I don't know that yet. Until I do, I'm bound by his judgment."

  He pulled out, immediately clipped a skip, and straightened the wheel without stopping.

  "See?" Julian said. "Minor calibration error. Still bound by the 2 AM consensus."

  "Which is?"

  "That we're home." He pressed the accelerator. "I'm just helping him update on the truth."
