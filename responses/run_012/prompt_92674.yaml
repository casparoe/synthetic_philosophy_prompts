answer: |-
  The hum of the server racks was the only sound in the control room, a low B-flat that vibrated in the marrow of Elias's bones. On the main wall, the load map of the Northern Grid pulsed amber. Across the state line, the Southern Grid, managed by Mara, pulsed the same sickly color.

  The frequency was drifting. If it dropped below 59.5 Hertz, the turbines would shudder, trip, and the cascade would begin. Lights out from the border to the coast. Permanent damage to the transformers. Months of blackouts.

  There was a protocol for this. The Handshake. A negotiated load shed. They would each cut 10% of their demand, share the strain, and ride it out. It required trust. It required time.

  They had neither.

  Elias watched the chat window on his secondary monitor. Mara's cursor blinked in the input field. She was typing. Then she stopped. Then she started again.

  *She knows,* Elias thought. *She knows I'm watching her type.*

  The new automation software installed last month had a feature called "Hard Bind." An engineer could lock the grid into a specific emergency response profile. Once locked, it could not be overridden for sixty minutes. It was designed to prevent panic-induced manual errors. It was a commitment device.

  If Elias engaged Hard Bind for "Northern Priority," the system would automatically sever all outgoing power to the South the moment the frequency hit 59.8. It would save the North. The South would go dark. Mara would then face a choice: accept the blackout and stabilize her own grid, or retaliate by engaging her own Hard Bind, which would sever the connection from her end simultaneously.

  If both severed at once, the synchronization would be lost forever. The grids would never reconnect without a manual rebuild. It would be a divorce of infrastructure. A mutual assured destruction of the network.

  Neither wanted that. Elias had a brother in the South. Mara had contracts to supply the North's hospitals.

  But if Elias waited, and Mara engaged Hard Bind first, he would be left with the choice: capitulate and let the North risk a cascade to save the South, or retaliate and destroy the network. Rationality dictated he would capitulate. He would be the one to blink.

  Therefore, rationality dictated he must not wait.

  His finger hovered over the physical key switch. It was red, protected by a plastic cover.

  The cost of this move was not immediate. The grid would be safe. The lights would stay on here. But the inquiry would come tomorrow. The federal investigators. The lawsuits from the Southern hospitals that lost power. The press calling him the Butcher of the Border. He would be fired, likely blacklisted. His career, built over twenty years, would be ash.

  He looked at the reflection of his hand in the dark glass of the console. He saw a man making a decision for a stranger.

  The Elias of tomorrow would have to stand in front of the cameras. The Elias of tomorrow would have to answer to the families in the dark. The Elias of tomorrow would carry the guilt of choosing his own neighbors over the people just across the line.

  Present Elias didn't feel that guilt yet. He only felt the cold spike of adrenaline, the mathematical certainty that if he didn't press this, Mara would. He was sacrificing a stranger—his future self—to save the man sitting in the chair right now. He was signing an order for a man he hadn't met yet, binding him to a consequence he couldn't feel.

  *He can handle it,* Present Elias told himself. *He's tougher than I am.*

  On the screen, the status light for the Southern Grid flickered. A packet of data arrived.

  *SYSTEM ALERT: EXTERNAL LOCK REQUEST DETECTED.*

  Mara wasn't typing anymore. She was preparing the bind. She was going to move first.

  The fear wasn't about winning. It wasn't about glory. It was the sheer terror of being the one left holding the bag, the one forced to capitulate because the other person had already burned their bridges. If she committed, she made her threat credible. She made herself dangerous. And by making herself dangerous, she made herself safe.

  Elias realized then that the race wasn't about who wanted the victory more. It was about who was more afraid of the other's fear.

  The frequency dropped to 59.7. The alarms began to chirp, a rhythmic, avian panic.

  Elias lifted the plastic cover. The switch clicked softly.

  He didn't watch the screen. He watched the reflection of the red light on his knuckle. He had just ordered his future self to become a villain. He had traded his tomorrow for his now.

  On the monitor, the status bar for the Northern Grid turned from amber to a solid, unblinking crimson.

  **NORTHERN PRIORITY: ENGAGED. IRREVOCABLE.**

  The message broadcast instantly to the Southern control room. It was a public act. There was no taking it back. The ball was in Mara's court. She could see the red light. She knew that if she engaged her own lock, the network dies. She must capitulate. She must let her grid bleed to save the whole.

  Elias exhaled. He had won. He had saved the lights.

  He waited for the Southern status to change, for the green light of capitulation, for the acknowledgment that she would take the hit.

  The frequency ticked to 59.6.

  The Southern status light remained amber.

  Mara's cursor began to blink in the input field again.

  Elias stared at the blinking cursor. It was a heartbeat. It was a countdown. If she typed the confirmation code for her own Hard Bind, they would both be strangers to each other by morning, and the network would be a corpse.

  He kept his hand on the switch, though it was already thrown. He wondered if Mara was looking at her own hand, wondering if she could sacrifice her future self the way he had sacrificed his.

  The frequency dropped to 59.55.

  The cursor blinked.
