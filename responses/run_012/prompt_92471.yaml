      *   *Popper's Failure:* Defined it as Truth + Content. Failed because all false theories have the same verisimilitude (or incomparable) under his logic (Tichý/Miller proofs).
      *   *The Landscape:* Content-like approaches (Popperian legacy) vs. Similarity-like approaches (Tichý, Niiniluoto, Oddie).
      *   *The Tensions:* Language dependence (Miller's demonstration), the value of truth vs. the value of information, the status of "false but informative" vs. "true but trivial."

  3.  **Drafting the Desiderata (The "Spec"):**

      *   *D1: The Basic Directionality (Truth Preference).* A true theory should generally rank higher than a false one. *Weight:* High, but contested (see D6).
      *   *D2: Falsehood Comparison.* One false theory can be closer than another. (e.g., "It's 5 degrees" vs "It's 100 degrees" when truth is 4). *Weight:* Non-negotiable (this is the whole point).
      *   *D3: Truth Comparison.* One true theory can be closer than another (usually via strength/content). *Weight:* High.
      *   *D4: The False Beats True Case (The "Legislator" problem).* Can a highly informative falsehood be better than a trivial truth? *Weight:* Contested.
      *   *D5: Language Invariance.* The ranking shouldn't change if we change predicates (Miller's problem). *Weight:* Highly Contested/Problematic.
      *   *D6: Logical Equivalence.* Logically equivalent statements should have the same verisimilitude. *Weight:* Non-negotiable (logic constraint).
      *   *D7: Metric vs. Order.* Do we need numbers or just ranking? *Weight:* Pragmatic.

  4.  **Identifying Impossibility Results/Trade-offs:**
      *   *Miller's Language Dependence:* You can't have language invariance + certain intuitive similarity judgments in a propositional framework.
      *   *Truth vs. Content:* If you value content too much, false theories look good. If you value truth too much, weak true theories look better than strong false ones.
