answer: |-
  # SEMINAR HANDOUT: THE SPECIFICATION OF VERISIMILITUDE
  **Week 4 | The Problem of Truthlikeness**

  ## PREAMBLE
  Before evaluating specific accounts (Popperian, Similarity-based, Consequence-based), we must define the target. What is the job description for a theory of verisimilitude? 

  Below is the specification. It distinguishes between **logical constraints** (requirements for coherence), **intuitive desiderata** (judgments the theory should capture), and **contested commitments** (philosophical preferences often disguised as requirements). 

  **Note on Status:** Where the literature claims consensus, we mark it *Settled*. Where camps diverge, we mark it *Contested*. Where joint satisfaction is provably difficult or impossible, we mark it *Tension*.

  ---

  ## I. CORE INTUITIVE DESIDERATA
  *These are the pre-theoretical judgments an account of verisimilitude is expected to vindicate.*

  ### 1. The Falsehood Ordering (The Minimal Requirement)
  **Spec:** It must be possible for one false theory to be closer to the truth than another false theory.
  **Motivating Case:** If the true temperature is 4°, the claim "It is 5°" is closer to the truth than "It is 100°."
  **Weight:** *Non-negotiable.* If an account cannot rank false theories, it fails the basic purpose of the concept (explaining scientific progress amidst error).
  **Status:** *Settled.* (This is where Popper's original definition failed).

  ### 2. The Truth Ordering (The Content Intuition)
  **Spec:** Among true theories, a stronger/more informative true theory should rank as closer to the truth than a weaker/trivial true theory.
  **Motivating Case:** "It is 4° and raining" is closer to the truth than "It is 4° or not 4°."
  **Weight:** *High.* Without this, verisimilitude collapses into mere truth. We value scientific progress not just for being right, but for being specific.
  **Status:** *Settled.*

  ### 3. The Truth Priority (The Lexical Constraint)
  **Spec:** Any true theory (even a weak one) must rank higher than any false theory (even a strong one).
  **Motivating Case:** A trivial truth ("It is either raining or not") is scientifically better than a precise falsehood ("It is raining 5mm/h" when it is dry).
  **Weight:** *Contested.* 
  *   *Pro:* Truth is the aim of science; falsehood is a failure state.
  *   *Con:* This makes verisimilitude useless for evaluating actual science, where we rarely possess the whole truth. It privileges tautologies over bold, nearly-correct errors.
  **Status:** *Major Fault Line.* Content-based accounts often lean this way; similarity-based accounts often violate it to allow "useful falsehoods."

  ### 4. The Informative Falsehood (The "Legislator" Problem)
  **Spec:** A highly informative falsehood may rank higher than a trivial truth.
  **Motivating Case:** Newtonian Mechanics (false) vs. "Something happens" (true). Intuitively, Newtonian Mechanics is a greater cognitive achievement and "closer" to the structure of the world than a tautology.
  **Weight:** *Contested.* If you accept this, you are effectively measuring *scientific utility* or *approximate truth* rather than strict logical verisimilitude.
  **Status:** *Disputed.* Accepting this desideratum usually requires sacrificing D3 (Truth Priority).

  ---

  ## II. FORMAL & LOGICAL CONSTRAINTS
  *These are structural requirements necessary for the concept to function within a logical framework.*

  ### 5. Logical Equivalence
  **Spec:** Logically equivalent statements must have the same degree of verisimilitude.
  **Motivation:** Verisimilitude is a property of the proposition/content, not the syntax. $A \land B$ must equal $B \land A$.
  **Weight:** *Non-negotiable.* Violating this makes the measure sensitive to rhetorical formulation rather than content.
  **Status:** *Settled.*

  ### 6. Avoidance of Triviality
  **Spec:** The account must not entail that all false theories are incomparable or equal in verisimilitude.
  **Motivation:** The Tichý–Miller proof demonstrated that Popper's definition entailed that no false theory could be closer to the truth than another.
  **Weight:** *Non-negotiable.* This is the formal failure condition of the 1960s account.
  **Status:** *Settled.*

  ### 7. Quantifiability vs. Ordering
  **Spec:** Must the account provide a numerical metric (degrees of truthlikeness) or merely a qualitative ordering (closer/further)?
  **Motivation:** Metrics allow for calculus of progress; orderings avoid arbitrary precision.
  **Weight:** *Pragmatic.* Most modern accounts aim for a metric, but an ordinal ranking is sufficient for most philosophical claims about progress.
  **Status:** *Settled (as flexible).* A metric is preferred but not strictly required.

  ---

  ## III. THE CONTESTED TERRAIN
  *These are demands often presented as requirements but which depend on deeper metaphysical or semantic commitments.*

  ### 8. Language Invariance (The Miller Condition)
  **Spec:** The ranking of theories should not change based on the choice of primitive predicates (the conceptual scheme) used to formalize them.
  **Motivating Case:** In a "Hot/Rainy/Windy" language, Theory A might look closer to Truth than Theory B. If we translate to "Minnesotan" predicates (complex disjunctions of the originals), the ordering flips.
  **Weight:** *Highly Contested.*
  *   *Realist View:* The world is structured independently of language; verisimilitude must reflect this. Language dependence is fatal.
  *   *Conceptual Relativist View:* All inquiry happens within a conceptual scheme. Demanding language invariance is demanding a "God's eye view" we cannot have.
  **Status:** *The biggest open wound.* Many similarity-based accounts are language-dependent. Some argue this is a bug; others argue it's a feature of conceptual inquiry.

  ### 9. Atomic Independence
  **Spec:** The verisimilitude of a conjunction should be a function of the verisimilitude of its atomic parts.
  **Motivation:** If I get the temperature right but the pressure wrong, my error should be localizable.
  **Weight:** *Contested.* This simplifies calculation but fails to capture holistic theoretical structures where errors in one area degrade confidence in others.
  **Status:** *Disputed.*

  ### 10. The Role of Probability
  **Spec:** Should verisimilitude be defined for deterministic claims only, or must it handle probabilistic theories?
  **Motivation:** Modern physics is probabilistic. A theory saying "Event X has 50% chance" when the chance is 51% is very close.
  **Weight:** *High (for applicability).* An account that only works for deterministic propositional logic is of limited use for actual science.
  **Status:** *Settled (as a goal), Unsettled (in practice).* Extending verisimilitude to probabilistic laws remains technically difficult.

  ---

  ## IV. IMPOSSIBILITY RESULTS & TRADE-OFFS
  *This is the critical section. You cannot satisfy all the above. The following clusters are jointly unsatisfiable under standard logical assumptions.*

  ### TRADE-OFF A: The Miller Invariance Trilemma
  You cannot simultaneously satisfy the following three conditions in a propositional framework:
  1.  **Language Invariance:** Rankings hold across predicate translations.
  2.  **Intuitive Similarity:** The account matches basic distance intuitions (e.g., 5° is closer to 4° than 100° is).
  3.  **Logical Structure:** The account respects standard logical relations between propositions.

  **Implication:** You must choose. 
  *   *Option 1:* Keep Invariance, lose Intuitive Similarity (The ranking becomes counter-intuitive in the base language).
  *   *Option 2:* Keep Similarity, lose Invariance (Admit that verisimilitude is relative to a conceptual scheme).
  *   *Option 3:* Restrict Logical Structure (Move to a non-standard logic).
  **Verdict:** Most contemporary accounts choose Option 2. They accept language dependence as the price of capturing intuitive similarity.

  ### TRADE-OFF B: Truth vs. Content (The Falsehood Ceiling)
  You cannot simultaneously satisfy:
  1.  **Truth Priority:** All truths > All falsehoods.
  2.  **Content Sensitivity:** Stronger falsehoods > Weaker falsehoods (when equally inaccurate).
  3.  **Continuity:** Small changes in error result in small changes in verisimilitude.

  **Implication:** If you insist that *no* falsehood can beat a truth (D3), you often end up flattening the ranking of falsehoods (violating D1) or making the measure discontinuous (a tiny error drops you from "True" to "Garbage").
  **Verdict:** To save the ranking of falsehoods (the main point of the exercise), most accounts weaken Truth Priority. They allow a very close falsehood to beat a very weak truth.

  ### TRADE-OFF C: The "Child's Playground" Result
  If you demand that verisimilitude be defined purely by the **logical consequences** of a theory (Popper's route):
  1.  **Consequence Condition:** Verisimilitude is determined by the set of true and false consequences.
  2.  **Non-Triviality:** False theories are comparable.

  **Implication:** These are incompatible. If you define verisimilitude strictly via logical consequences in a standard calculus, you re-derive the Tichý–Miller result: all false theories are incomparable.
  **Verdict:** You must step outside pure logical consequence. You need a notion of *similarity* or *structure* that is not reducible to entailment. This moves the problem from Logic to Metaphysics (what is the structure of the world?).

  ---

  ## SUMMARY FOR DISCUSSION
  When we evaluate the contenders this week, do not ask "Does this theory work?" Ask: **"Which line of the Spec did they break to make it work?"**

  *   If they save **Language Invariance**, check if they lost **Intuitive Similarity**.
  *   If they save **Truth Priority**, check if they lost the ability to rank **Falsehoods**.
  *   If they save **Logical Rigor**, check if they lost **Applicability to Science**.

  The history of verisimilitude is not a history of solutions; it is a history of managing these trade-offs.
