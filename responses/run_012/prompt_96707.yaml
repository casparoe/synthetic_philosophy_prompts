answer: |-
  The sleep laboratories of the 1950s and 60s, pioneered by Aserinsky, Kleitman, and Dement, fundamentally altered the ontology of dreaming. By correlating Rapid Eye Movement (REM) sleep with waking narratives, they transformed dreaming from a private, unverifiable mental ghost into a public, physiological event. Their deprivation studies—where subjects woken at REM onset exhibited psychological distress and a physiological "rebound" of REM sleep—suggested that dreaming answers to a biological need. Viewed through the lens of Norman Malcolm's *Dreaming* (1959), however, this research program appears not as a discovery of fact, but as a cascade of conceptual confusion. Malcolm, channeling Wittgenstein, argues that a dream is not an experience undergone during sleep but a disposition to tell a story on waking; the waking report is the logical *criterion* of dreaming, not empirical *evidence* of a hidden process. To analyze the sleep labs through Malcolm's account is to watch a collision between ordinary language philosophy and the reductive drive of natural science.

  For Malcolm, the sleep laboratories are guilty of a category mistake: they have reified a disposition into a process. When the researchers claim to have found a correlation between REM sleep and dreaming, Malcolm must insist they have merely found a correlation between a physiological state and the *probability of a dream report*. Since the report is the criterion for the concept "dream," there is no logical space for a dream to exist independently of the report. Consequently, the REM/dream correlation is not a link between a brain state and a mental movie; it is a link between a brain state and a verbal performance.

  This forces a radical translation of the deprivation hypothesis. The claim that "subjects were deprived of dreaming" is, in Malcolm's terms, nonsensical. One cannot deprive a subject of a disposition to tell a story that does not exist until told. What the labs actually did was deprive subjects of REM sleep and prevent them from *reporting* dreams by waking them. The resulting "distress" reported by experimenters must be attributed to sleep fragmentation or REM deprivation, not "dream deprivation." For Malcolm, the phrase "need to dream" is a metaphorical hangover from a dualistic psychology. The laboratories are measuring a physiological need for REM, but they are illegitimately labeling it a need for *dreaming*, thereby treating the dream as a causal agent (a process in the sleeper) that maintains psychological equilibrium. Malcolm would hold that the labs are trading on a concept they have no right to: they treat the dream as a cause of the rebound, when logically, the dream (the report) cannot cause anything, as it only comes into existence after the fact.

  However, Malcolm's account is severely embarrassed by the physiological half of the rebound finding. The REM rebound is a bodily phenomenon: the brain increases the duration and intensity of REM sleep independently of whether a report is ever extracted. If a subject is woken at every REM onset, they produce no dream reports. Yet, when finally allowed to sleep undisturbed, their physiology compensates for the lost REM. This rebound occurs in the silence of the skull, prior to and independent of any waking narrative.

  Here, the "criterion" argument fractures. If the waking report is the sole criterion for dreaming, then during the deprivation phase, no dreaming occurred. Yet the body reacted as if something vital *had* occurred and was now missing. The physiology behaves as if "dreaming" (or the state constitutive of it) is a real process with a homeostatic set-point. Malcolm is forced to sever the link between REM and dreaming entirely to save his thesis, reducing REM to a mere physiological state that happens to coincide with reporting. But this makes the high correlation (often upwards of 80-90%) look miraculous. Why should a physiological state correlate so tightly with a linguistic disposition if they are not ontologically linked? Malcolm's restriction renders the scientific utility of the concept inert; he protects the grammar of "dreaming" at the cost of making the physiological data inexplicable within the framework of the concept itself.

  The verdict must go against Malcolm. The laboratory program was not trading on a concept it had no right to; rather, Malcolm's restriction of the concept is one the evidence should make us abandon. Malcolm's analysis is rigorous regarding the *ordinary language* use of "dreaming," but science is in the business of revising concepts to carve nature at its joints. The sleep labs demonstrated that "dreaming" picks out a natural kind—a specific neurophysiological state with causal powers (rebound, distress upon deprivation)—rather than a mere linguistic commitment. To insist that the dream is *only* the report is to privilege grammatical correctness over explanatory power. The distress caused by deprivation suggests a functional need for the *state* of REM/dreaming. If the state exists and has effects independent of the report, the report cannot be the sole criterion of the phenomenon's existence. We are justified in expanding the concept of dreaming to include the physiological process, even if the narrative content is only accessible upon waking. Malcolm is right that we cannot verify the *content* of a dream independently of a report, but he is wrong to infer that the *event* of dreaming is therefore non-existent during sleep.

  Daniel Dennett's more empiricist handling of the question comes out better than Malcolm's, though it occupies a nuanced middle ground. Dennett, unlike Malcolm, does not treat the grammar of ordinary language as a fortress against scientific revision. In works like *Brainstorms*, Dennett accepts the physiological data as constitutive of the mental state. He is willing to say that the brain processes occurring during REM *are* the dreaming, even if the conscious "narrative" is constructed or finalized upon waking (a view somewhat sympathetic to Malcolm, but naturalized). Dennett avoids Malcolm's error by treating the "dream" as a functional construct realized by the brain, rather than a logical ghost tied to speech acts. He allows the empirical evidence to dictate the ontology: if the physiology predicts the report and has causal powers, it is real. Dennett succeeds where Malcolm fails because he recognizes that concepts in cognitive science are tools for explanation, not static rules of grammar. While Malcolm protects us from the myth of the "inner eye," he throws out the biological baby with the dualistic bathwater; Dennett keeps the biology without needing the Cartesian theater.
