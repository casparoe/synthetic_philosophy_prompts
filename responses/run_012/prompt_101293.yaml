answer: |-
  Two senior quants, Silas and Jude, sit on opposite sides of a glass partition in a high-frequency trading firm. They are running identical models—same codebase, same initialization seed, same historical data. By the Harsanyi Doctrine, they share a Common Prior.

  Yet, Silas is aggressively long on a tech stock, and Jude is aggressively short.

  A junior analyst, nervous about the firm's exposure, taps on the glass. "Excuse me, partners? But if you're both Bayesian rationalists with a Common Prior, Aumann's Agreement Theorem says you can't agree to disagree. If you know each other's posteriors, your probabilities must converge. One of you is being irrational."

  Silas doesn't look up from his screens. "We aren't disagreeing. We're just operating in a state of non-Common Knowledge."

  "But you're in the same room," the analyst says. "I just told Silas your position, Jude. And I told Jude yours. It's public."

  Jude finally turns. "It's *mutual* knowledge. Not *Common* knowledge."

  "What's the difference?"

  "For it to be Common Knowledge," Silas says, "I need to know your posterior. You need to know mine. I need to know that you know mine. You need to know that I know that you know mine. And so on, ad infinitum."

  Jude nods. "It's an infinite regress of epistemic operators. $K_i K_j K_i K_j \dots E$."

  The analyst blinks. "So... how many levels do we have?"

  "Currently?" Jude checks his log. "We're at level 14. I know that Silas knows that I know... fourteen times."

  "And level 15?"

  "Requires a confirmation message," Silas says. "Which I'd have to read, and you'd have to know I read, and I'd have to know you know I read..."

  "You're building a handshake protocol for knowledge," the analyst says.

  "We're building the meet of our information partitions," Jude corrects. "But yes. The theorem forces agreement only at the limit of infinity."

  "And the market?"

  "Closes in three minutes," Silas says.

  "We'll never reach the limit," Jude adds. "So the condition for forced agreement is never satisfied. Technically, we are rationally permitted to hold divergent posteriors as long as the chain of knowledge remains finite."

  The analyst looks at the divergent positions, then at the clock. "So the disagreement isn't a bug in the model. It's a feature of the latency."

  "Exactly," Silas says, executing a trade. "Aumann guarantees convergence at $\infty$. We trade at $t < \infty$."

  Jude smiles and shorts another block. "Thank God for finite time horizons. If we ever actually achieved Common Knowledge, we'd have to stop trading with each other. And where would the profit come from then?"

  "From the clients," Silas says. "Who definitely don't have a Common Prior with us."

  "Bill them for the divergence," Jude says. "Call it an epistemic spread."
