      *   *Chances:* Mention the "Big Bad Bug" explicitly.

  7.  **Final Polish:** Check against the "one page" constraint context. The advice should help them write that page without contradicting themselves. Ensure the ranking is clear.

      *   *Ranking:*
          1.  (1) vs (5) - Incompatible.
