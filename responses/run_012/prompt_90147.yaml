  2.  **Deconstruct the Three Registers:**
      *   *Predictive:* This is the "Intentional Stance" (Dennett). It's useful but potentially shallow. If the model mimics belief talk perfectly, does it matter if it's "real"?
      *   *Diagnostic:* This is the "Mechanistic Interpretability" angle. Do we find a "belief neuron"? This is hard for philosophers without engineering skills.
      *   *Deliberative:* This is the "Governance" angle. Liability, trust, safety. This is what the trustees actually care about.
      *   *Critique:* The user suspects they come apart. I need to validate this. The "Predictive" and "Deliberative" often conflate. If I predict it will lie, I treat it as deceptive (Deliberative). But does it *believe* the lie? The "Diagnostic" is often treated as the truth-maker for the others, but maybe it's irrelevant for governance.

  3.  **Determine Prioritisation Criteria:**
      *   *Upstreamness:* Conceptual clarity must precede policy.
