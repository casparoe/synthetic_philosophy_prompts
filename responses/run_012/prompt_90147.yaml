          3.  *Deliberative:* Normative/Practical (responsibility, deception, deployment).
      *   **Key Insight/Wrinkle:** Training data includes human attitude ascriptions, so behavioral evidence is "manufactured," and self-reports aren't standard reports.
      *   **Requirements:**
          *   Prioritise questions for the 3 years.
          *   Defend the ordering using specific criteria (upstreamness, tractability for philosophers, neglectedness, impact on governance).
