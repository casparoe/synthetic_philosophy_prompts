      *   **Q3:** What Deliberative protocols are robust to uncertainty in the Diagnostic register? (Normative/Policy).

      *Decision:* I will argue that the **Deliberative** register must be prioritised *conceptually* first, because it defines the goal. But the **Predictive** register's reliability (due to the wrinkle) is the biggest *epistemic* hurdle. The **Diagnostic** register should be deprioritised because it's a trap for philosophers (requires engineering) and might be irrelevant for governance (functionalism).

  5.  **Critiquing the Three Registers:**
      *   *Where it works:* It disentangles "Does it work?" (Predictive) from "Is it real?" (Diagnostic) from "What do we do?" (Deliberative). This is better than the standard "Is it conscious?" binary.
      *   *Where it collapses:* Predictive and Deliberative often merge in practice (we treat it as believing because it predicts well). Diagnostic is often assumed to be the ground for Deliberative, but legally/ethically, functional output often suffices.
      *   *Existing distinctions:* It maps loosely to Dennett (Intentional Stance), Churchland/Neurophilosophy (Mechanistic), and Strawson/Responsibility (Reactive Attitudes). The innovation is treating them as distinct *registers of discourse* that can conflict.

  6.  **Developing the Argument (The Defence):**
