      *   *Governance Impact:* The trustees' ultimate metric.
      *   *Trade-off:* I must prioritise *Governance Impact* and *Tractability* over pure *Diagnostic* truth. If we can't solve the metaphysics of belief in 3 years (we can't), we should solve what *attribution practices* do to governance.

  4.  **Drafting the Agenda (The Ordering):**
