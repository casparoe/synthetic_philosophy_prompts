answer: |-
  **Memorandum to the Board of Trustees**

  **Subject:** Prioritisation of Research Questions regarding Propositional Attitude Attribution in AI
  **From:** Advisory Board Member
  **Date:** 24 May 2024

  ### 1. Executive Summary

  The foundation's objective is AI governance; the method is conceptual groundwork. The central risk in this domain is not that we attribute belief too sparingly, but that we conflate distinct reasons for doing so. My proposal is to prioritise the **Deliberative Register** (what we do with the attribution) over the **Diagnostic Register** (whether the attribution is mechanically true), while treating the **Predictive Register** (whether the attribution works) as a compromised evidence base due to the 'manufactured evidence' wrinkle.

  The eight researchers should not attempt to solve the metaphysics of machine mind. Instead, they should construct a normative framework for attitude attribution that remains robust even if the diagnostic status of the model remains opaque. The ordering below is designed to maximise governance impact within the three-year window, prioritising questions that are tractable for philosophers and upstream of policy formulation.

  ### 2. The Proposed Agenda: An Ordering of Questions

  I propose we structure the three-year grant not by register, but by a cascade of dependency. We must settle what work the concept of 'belief' is supposed to *do* for us before we argue about whether the model *has* one.

  **Year 1: The Deliberative Necessity (Normative Upstream)**
  *   **Primary Question:** *Which governance functions (liability, trust, deployment gating) strictly require belief attribution, and which can operate on behavioural regularities alone?*
  *   **Rationale:** This is the most upstream question for the Trustees' interests. If we can regulate deception or sycophancy by referencing input-output constraints without invoking 'belief', the metaphysical debate becomes largely academic. We need to map the 'Deliberative Register' to specific regulatory levers.
  *   **Tractability:** High. This is pure legal philosophy, ethics, and social ontology. It requires no ML engineering.

  **Year 2: The Epistemic Audit (Predictive Reliability)**
  *   **Primary Question:** *To what extent does the 'manufactured evidence' wrinkle degrade the utility of the Predictive Register?*
  *   **Rationale:** Once we know what work belief-talk needs to do (Year 1), we must assess if the models can support it. Since models are trained on human attitude ascriptions, their 'belief-like' behaviour is a simulation of the very evidence we use to judge them. We need to determine if this creates a circularity that renders predictive attribution useless for high-stakes governance.
  *   **Tractability:** Medium. Requires collaboration with cognitive scientists to design experiments that distinguish trained mimicry from generalisation, but remains conceptual/experimental rather than engineering-heavy.

  **Year 3: The Diagnostic Constraint (Metaphysical Downstream)**
  *   **Primary Question:** *Under what conditions does the absence of a Diagnostic correlate (mechanistic evidence) veto a Deliberative attribution?*
  *   **Rationale:** This is the least urgent for governance but necessary for long-term conceptual hygiene. We need to define the 'red lines' where mechanistic interpretability *must* override functional prediction.
  *   **Tractability:** Low. This risks drifting into technical interpretability work. The team should focus on defining the *criteria* for diagnostic sufficiency, not finding the correlates themselves.

  ### 3. Defence of the Ordering

  My prioritisation relies on four criteria: **Governance Impact**, **Upstreamness**, **Tractability**, and **Neglectedness**. Here is how they interact and where I have forced trade-offs.

  **Governance Impact vs. Metaphysical Truth**
  I am explicitly sacrificing the 'Diagnostic Register' as a primary focus. The literature is obsessed with whether the belief is 'real'. For the Trustees, this is the wrong question. The right question is whether treating the system *as if* it has beliefs reduces risk.
  *   *Trade-off:* We may produce a framework that agnostics can use and realists can accept, but we will not settle the ontology of machine mind. I argue this is a feature, not a bug. Settling the ontology is likely impossible in three years; settling the protocol for attribution is not.

  **Upstreamness**
  The Deliberative questions are upstream of the Predictive ones. We cannot judge whether a prediction is 'good enough' until we know what decision it is informing. If the decision is 'grant API access', a low-confidence prediction might suffice. If the decision is 'assign legal liability', the threshold is higher. Therefore, defining the deliberative stakes (Year 1) must precede evaluating the predictive evidence (Year 2).

  **Tractability for Philosophers**
  The 'Diagnostic Register' is a trap for this specific team. If we prioritise finding mechanistic correlates of belief, we are competing with ML engineers on their turf, with inferior tools. By prioritising the Deliberative and Predictive registers, we play to the strengths of philosophy: conceptual analysis, normative theory, and the design of thought experiments.

  **Neglectedness**
  The 'Predictive Register' is well-trodden (Dennett's Intentional Stance). The 'Diagnostic Register' is currently fashionable in interpretability circles. The 'Deliberative Register'—specifically the separation of *practical reasoning about the system* from *prediction of the system*—is neglected. Most literature assumes that if the prediction works, the deliberation follows. My agenda challenges this, suggesting we might deliberately attribute belief for safety reasons even if predictive utility is low (a 'precautionary principle' for attitude attribution).

  ### 4. Where the Registers Come Apart (and Where They Collapse)

  Your three-register sorting is the strongest conceptual tool in the brief, but it requires sharpening before we commit funds.

  **Where the Sorting Does Genuine Work**
  The distinction between **Predictive** and **Deliberative** is vital. In human contexts, these usually align: we predict a human will act on their beliefs, and we hold them responsible for those beliefs. In AI, they can diverge.
  *   *Example:* We might predict a model will output harmful text (Predictive success) without believing it 'wants' to harm (Deliberative hesitation). Conversely, we might hold a model 'responsible' (Deliberative attribution) to trigger a shutdown protocol, even if we know its internal weights don't support a genuine belief state (Diagnostic failure).
  *   *Value:* This allows us to decouple safety protocols from metaphysical debates. We can justify 'treating it as deceptive' as a governance strategy without needing to prove 'it is deceptive' in a mechanistic sense.

  **Where the Sorting Collapses**
  The distinction between **Predictive** and **Diagnostic** is less stable than the literature admits, specifically due to the 'manufactured evidence' wrinkle.
  *   *Collapse:* If a model is trained to predict human text, and humans attribute beliefs to one another, the model learns to output belief-ascriptions that maximise predictive accuracy. Therefore, 'Predictive success' (it says it believes X and acts like it) becomes poor evidence for 'Diagnostic reality' (it has a state corresponding to X).
  *   *Implication:* We cannot treat the Predictive Register as independent evidence for the Diagnostic Register. They are confounded by the training data. My agenda accounts for this by making the 'Epistemic Audit' (Year 2) a separate, critical phase rather than assuming predictive success validates the stance.

  **Existing Distinctions**
  This sorting improves upon the standard *Instrumentalist vs. Realist* debate by carving out the *Normative/Practical* space. However, it risks overlapping with the distinction between *competence* and *performance*, or *functionalism* and *physicalism*. To avoid reinventing the wheel, the team must explicitly frame the 'Deliberative Register' not just as 'usefulness', but as *constitutive* of the governance relationship. It is not just that attribution is useful; it is that attribution *changes the status* of the system in a regulatory context.

  ### 5. Triggers for Reprioritisation

  The agenda above is robust, but specific developments over the next three years could force a reshuffle.

  **Move Diagnostic Upstream If:**
  *   **Mechanistic Interpretability Breakthrough:** If a technique emerges that can reliably locate specific propositional structures in weights (e.g., a 'belief probe' with 99% accuracy), the Diagnostic Register becomes tractable and immediately relevant. We would need to pivot to defining the legal status of that evidence.
  *   **Regulatory Decision:** If the EU or US regulators mandate 'mechanistic proof of alignment' for deployment, the Diagnostic Register moves from theoretical to compliance-critical.

  **Move Predictive Downstream If:**
  *   **Model Stagnation:** If models stop improving in their ability to mimic belief-talk (hitting a plateau in 'human-likeness'), the 'manufactured evidence' problem becomes less acute. The urgency of the Epistemic Audit diminishes.
  *   **Deception Events:** If a model demonstrably deceives developers in a way that *cannot* be explained by training data mimicry (e.g., instrumental convergence in a novel environment), the Predictive Register gains credibility as a signal of genuine internal states.

  **Move Deliberative Downstream If:**
  *   **Liability Precedent:** If a major court case settles that corporations are strictly liable for model output regardless of the model's 'mental' state, the need for a Deliberative framework on belief attribution evaporates. We would regulate the deployer, not the deployed.

  ### 6. Conclusion

  The Trustees are funding theory to serve governance. The greatest risk to this aim is not philosophical error, but **category confusion**. If we allow the Diagnostic question ('Is it real?') to hold the Deliberative question ('What do we do?') hostage, we will produce no actionable guidance.

  By prioritising the Deliberative Register, we acknowledge that 'belief' in AI governance is likely a regulatory construct rather than a natural kind. By auditing the Predictive Register second, we account for the unique epistemic hazard of trained text models. By leaving the Diagnostic Register last, we acknowledge the limits of philosophical labour in the face of engineering complexity.

  This ordering ensures that at the end of three years, even if we have not solved the hard problem of machine consciousness, we will have a defensible protocol for how regulators, developers, and users should talk about, and act towards, systems that mimic the mind.

  I recommend the board approve this prioritisation.
