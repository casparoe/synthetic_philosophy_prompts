      *   If the goal is governance, the *Deliberative* register is the destination. The *Predictive* and *Diagnostic* are inputs.
      *   However, philosophers are best suited to analyze the *concepts* underpinning the Deliberative register.
      *   *Revised Order:*
          1.  **Clarify the Deliberative Stakes (Year 1).** What work are we asking 'belief' to do in governance? (Liability, trust, manipulation).
          2.  **Audit the Predictive Utility vs. Manufactured Evidence (Year 2).** Can we trust the behavioral data given the training wrinkle?
          3.  **Assess Diagnostic Necessity (Year 3).** Do we *need* mechanistic proof to sustain the Deliberative stance?

      *Let's try a more aggressive philosophical stance:*
