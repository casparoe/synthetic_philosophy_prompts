  ### The Case: The Twin Snipers at Kelson Bridge

  **Scenario**
  Two volunteer soldiers, Alpha and Beta, are positioned on opposite banks of the Kelson River during a modern interstate conflict. They are identical in every material respect: same training, same rank, same equipment, same distance from the target, and same tactical orders (hold the bridge). Both act with full voluntariness and possess full knowledge of the strategic situation; neither is conscripted, coerced, or ignorant of the war's origins.

  Alpha serves the **Just State**, which is defending against an unprovoked invasion. Beta serves the **Unjust State**, which is the aggressor in that invasion.

  They engage in a simultaneous duel. Alpha fires at Beta; Beta fires at Alpha. Both shots are fatal. Alpha kills Beta. Beta kills Alpha.

  The assignment is to evaluate the moral status of **Beta's killing of Alpha** (the Unjust Combatant killing the Just Combatant). Specifically, we are concerned with the standing of Alpha's family to mourn him as a victim of wrongdoing, rather than the culpability of Beta.

  ***

  ### Bookkeeping

  **(a) Permissibility of the Killing (Beta killing Alpha)**
  *   **Orthodox:** The killing is **permissible**. Alpha and Beta share the same moral status as combatants. Beta possesses the same license to kill as Alpha.
  *   **Revisionist:** The killing is **impermissible**. Beta is contributing to an unjust threat. Alpha poses no unjust threat. Beta lacks the license to kill Alpha, even if Beta might be excused due to the pressures of war.

  **(b) Culpability of the Killer (Beta)**
  *   **Orthodox:** Beta is **not culpable**. Responsibility for the unjust war lies with Beta's political leaders, not the soldier fulfilling his role.
  *   **Revisionist:** Beta is **culpable** (though potentially excused to varying degrees). He is participating in an unjust project. However, for the sake of this comparison, we focus on the victim, not the killer.

  **(c) Liability of the Victim (Alpha)**
  *   **Orthodox:** Alpha **was liable** to be killed. By donning the uniform and entering the combatant role, he forfeited his right not to be attacked, regardless of the justice of his cause. His death is a foreseeable risk he accepted and a moral forfeiture he incurred.
  *   **Revisionist:** Alpha **was not liable** to be killed. Liability tracks the contribution to an unjust threat. Alpha was defending against aggression; he posed a *just* threat. Therefore, he retained his right to life. His death was a violation of his rights, not a forfeiture.

  **(d) The Victim's Family's Legitimate Complaint**
  *   **Orthodox:** The family has **no moral grievance against Beta**. Because Alpha was liable, Beta did him no wrong. The family may grieve, but they cannot claim their son was *wronged* by the enemy soldier. Their grievance lies solely with the political leaders who started the war.
  *   **Revisionist:** The family **has a moral grievance against Beta**. Because Alpha was not liable, his right to life was violated. Even if Beta is excused from punishment, the act remains a wrong *done to Alpha*. The family is vindicated in viewing Alpha as a victim of injustice, not merely a casualty of war.

  ***

  ### The Single Feature Doing the Work

  The divergence rests entirely on **whether liability is derived from *Status* (Orthodox) or *Conduct/Cause* (Revisionist).**

  *   **Orthodox:** Liability attaches to the *role* of combatant.
  *   **Revisionist:** Liability attaches to the *moral quality of the threat* posed.

  In this case, Alpha's conduct (shooting to kill) is identical to Beta's. The only variable is the justice of the cause. The Orthodox view severs the link between cause and liability, rendering Alpha liable purely due to his uniform. The Revisionist view ties liability to the cause, rendering Alpha immune from liability because his cause is just.

  **Counterfactual: Removing or Reversing the Feature**
  If we **remove** the asymmetry of the cause (e.g., both states are fighting a just war of mutual defense due to reasonable error, or both are fighting an unjust war), the views collapse back into agreement regarding the victims.
  *   If both are Just: Orthodox says both liable; Revisionist says both not liable (though killing may be permissible via necessity).
  *   If both are Unjust: Orthodox says both liable; Revisionist says both liable.

  If we **reverse** the feature (Alpha is Unjust, Beta is Just), the harshness shifts.
  *   **Orthodox:** Alpha (Unjust Victim) is still liable. No change.
  *   **Revisionist:** Alpha (Unjust Victim) is now liable.
  *   In this reversed scenario, the Orthodox view remains constant (always harsh on the victim's liability), while the Revisionist view flips to match the Orthodox on liability. The standard disagreement (Revisionist harsher on the *Killer*) re-emerges as the primary point of contention, and the specific advantage for the *Victim's Family* disappears for the Just side.

  ***

  ### The Orthodox Objection and Its Cost

  **The Objection**
  A defender of the Orthodox view (Walzerian) would argue that this case **smuggles in a private morality model into a public institution.** She would claim I have misdescribed the nature of war by treating it as a series of individual interpersonal killings rather than a collective state of affairs.

  She would argue that declaring Alpha "not liable" undermines the **War Convention**. The Convention relies on the mutual recognition of combatant status to protect civilians and limit the scope of violence. If Just Combatants believe they are *not liable* to be killed, they may fight more recklessly, refuse to surrender, or deny the legitimacy of enemy POW status, thereby increasing overall suffering. The "harshness" toward Alpha's family is the necessary price of a system that contains war's brutality. To tell Alpha's family he was "wronged" is to invite vengeance and destabilize the post-war peace, whereas telling them he was "liable" facilitates reconciliation by treating the enemy soldier as a peer operating under the same rules.

  **The Cost**
  This reply costs the Orthodox defender the **individual moral truth.** She must admit that her theory sacrifices the specific moral status of the Just Victim (Alpha) for the sake of systemic regulation. She concedes that, in reality, Alpha did nothing to forfeit his right to life, but insists we must *pretend* he did to maintain the convention. This leaves her vulnerable to the charge that the Orthodox view is a pragmatic fiction that systematically lies to the families of the just dead, denying them the truth of their loved one's moral innocence to preserve a regulatory framework.
