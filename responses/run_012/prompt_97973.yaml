prompt: |-
  ok so I'm in this reading group on philosophy of science and one of the guys has a favourite analogy he wheels out whenever anyone mentions realism, and I can't decide if it's doing any real work or just being persuasive. here it is: a theory is to evidence what a curve is to a scatter of data points. you've got a finite cloud of points (the observations) and you want to draw a curve through them (the theory). but here's the thing — infinitely many curves pass through any finite set of points. a straight line, a parabola, some mad polynomial that wiggles through every single dot. they all fit. so, he says, infinitely many theories fit any finite body of evidence, which means the evidence never picks one out, and what actually decides between them is stuff like simplicity and elegance — i.e. taste. hence no theory is ever supported in the realist's sense. it's a nice picture and I can see why it lands, but something about it feels too easy. can you audit it for me? I want the correspondence spelled out properly — what's the point, what's the curve, what's the family of curves, what plays the role of simplicity or regularisation, what's the finite set — then the places the mapping actually breaks. in particular I'm suspicious of a few things: (a) real evidence isn't a tidy set of independent points handed to you before the theory, (b) he keeps sliding between "fits the data" and "is empirically equivalent to the rival", which I don't think are the same thing, and (c) the curve-fitting story has its own internal moral — overfitting — that seems to cut against him rather than for him, since a curve that fits everything explains nothing. tell me which of the disanalogies actually matter for the conclusion he wants (no rational theory choice, realism is dead) and which are just noise, whether the conclusion survives once we've priced them in, and whether there's a better analogy for the same point that doesn't smuggle in quite as much. and please write it in British English — my brain keeps autocorrecting to American spellings and I want to see it done properly.
