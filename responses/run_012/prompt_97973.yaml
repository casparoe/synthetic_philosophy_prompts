          *   *Analysis:* "Fitting" usually means minimising error (least squares). "Empirical equivalence" means making identical predictions for all possible observations. A curve can fit existing points but diverge wildly on new ones. Rival theories in science are rarely *strictly* empirically equivalent across all possible domains, only on current data.
          *   *Impact:* Critical. This is the Underdetermination of Theory by Data (UTD) vs. Curve Fitting distinction. If theories aren't strictly equivalent, future data *can* distinguish them.

