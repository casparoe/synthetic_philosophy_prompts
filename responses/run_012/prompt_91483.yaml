          *   *Conclusion on Relativism:* He commits to a hierarchy of values where *Life* is the supreme value, not *Truth*. So, a "false" history that promotes life is "truer" to the condition of existence than a "true" history that paralyzes action. This isn't relativism about facts, but about the *authority* of facts over life.

      *   **Addressing Question 3: "History is Written by the Victors":**
          *   *The Slogan:* Usually implies power dictates narrative.
