      *   *Strong:* Continuous Variables/Prices. Markets aggregate info well. ICs need discrete actions. Many real-world beliefs aren't binary.
      *   *Moderate:* Sophisticated Agents. If I know you are following the herd, I discount your action. Pure IC assumes naive updating on actions as signals.
      *   *Moderate:* Correlated Signals. IC assumes independent private signals. If everyone reads the same news source or goes to the same grad school, signals are correlated. This looks like a cascade but is actually common shock.
      *   *Awkward:* Cost of Dissent. It's not just info; it's reputation. Being wrong alone is costly. This is "reputational herding," distinct from IC.
      *   *Awkward:* Complexity. Some truths are hard. Consensus might be wrong because the *right* answer is hard to find, not because of a cascade.

