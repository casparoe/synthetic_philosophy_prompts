  I've been trying to get my head round this block universe business on my own for a few months now — no physics background, just stubbornness and too much wikipedia at 1am — and here's as far as I've got. Everyone seems to carry their own "now" around with them, and that now isn't a point, it's a whole slice through the entire universe at once, including things billions of light years away that you couldn't possibly see yet. And because we're all drifting about at different speeds, those slices tilt differently. So if you and me walk past each other on the pavement, one of us has a decision being taken right now in a galaxy 2.5 million light years off, and the other one has that same decision already made, years ago, done and dusted — and neither of us is wrong about it. That's the bit I can't stop chewing on: not that time is weird in general, but that "now" apparently works like "here", a word about where you're standing rather than about what's real. The conclusion people draw is that the past isn't gone and the future isn't open, it's all just sitting there like a road you can see the whole of from a hill. I think it's called the Rietdijk–Putnam argument but I might be mashing names together.

  Anyway, what I actually want is a joke out of it. I'm seeing some mates next weekend, a couple of whom did physics at uni, and I'd like one ready to go, so could you take on the role of someone who genuinely knows this stuff and can also write something funny. It has to be a proper joke — setup, then punchline — and the punchline should turn on the real content: the tilting of the slices, or the way "the past is gone" and "the future isn't fixed" both come out false at the same time, or "now" being an indexical like "here". Not a vague "ooh, time's a funny old thing" gag, which is all I keep managing and its rubbish. Someone who knows the argument should smile because they recognise the actual point being turned, and someone who doesn't should still be able to follow it if they're paying attention.

  Have a proper think before you commit — brainstorm three or four different angles, bin the ones that don't turn on anything, then give me the one you'd actually tell out loud, short enough to deliver in a noisy pub. If you've got a spare that's nearly as good, stick it underneath with a line on what makes it work. And i cant decide whether it's a comforting idea or a bleak one, so don't feel you have to pick a side for me.
