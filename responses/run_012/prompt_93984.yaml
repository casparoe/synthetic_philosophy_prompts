  For the first fever of **passion** burns too fast.
  And leaves the room cold for **death**.
  If the body breaks, there is no **health**.
  Then geometry becomes your **illusion**.
  Let the salon whisper its **prejudice**.

  Ignore the crowd's loud **prejudice**.
  Cultivate a severe and lasting **taste**.
  Do not strip bare every sweet **illusion**.
  Recall the heat, the madness of **passion**.
  But know it relies on fragile **health**.
  It is the only buffer against **death**.

  Do not invite the specter of **death**.
  Let fortune manage vulgar **prejudice**.
  Pray for the luck of continued **health**.
  Study provides a reliable **taste**.
  More steady than the spike of **passion**.
  We dwell within a necessary **illusion**.

  It is labor, maintaining this **illusion**.
  To keep the shadow of **death** at bay.
  To remember the fire of **passion**.
  While rising above common **prejudice**.
  Until the mind finds its true **taste**.
  And the body begs for **health**.

  Without the foundation of **health**.
  We weave the fabric of **illusion**.
  The intellect refines its **taste**.
  We do not yield to **death**.
  We overcome the social **prejudice**.
  We give thanks for **passion**.

  *Envoi*

  Secure your days, your **health**, before you meet **death**.
  Wrap the world in **illusion**, honor **passion**.
  Refine your **taste**, disregard **prejudice**.

  ***

  **Note on the Text**

  This poem leans heavily into the Epicurean strand of Du Châtelet's *Discourse on Happiness*, potentially at the expense of her rationalist commitments. A contested reading arises regarding her defense of *illusion*: while the poem presents it as a deliberate tool for contentment, Du Châtelet was also a rigorous Newtonian who valued truth above comfort. A reader might argue that her allowance for illusion is strictly limited to matters that do not impinge on scientific or moral truth, whereas the poem suggests a broader, more aesthetic self-deception. Furthermore, the poem highlights the privilege inherent in her preconditions (*health* and freedom from *prejudice*); while Du Châtelet acknowledges these are matters of fortune, some scholars argue her account is more perfectionist (happiness as the exercise of virtue) than the poem's somewhat egoistic focus on "agreeable feeling" implies. The tension between her demand for truth in physics and her demand for illusion in happiness remains the sharpest philosophical friction in her work.
