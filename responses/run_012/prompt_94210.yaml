  1. The distinction between discrete and continuous cases does not save indifference here, as the scene assumes a uniform prior over fairness it is not entitled to given the hidden mechanism. While it is settled that different parametrizations yield different results, whether this invalidates indifference entirely or just demands better justification remains contested.

  2. The play leans on the naive partition of outcomes, but the joke is that there is no fact about the correct partition because the mechanism is narrative rather than statistical. This dramatizes the contested view that without a justified measure, assigning equal probability is merely an expression of ignorance rather than a property of the world.

  3. Demanding invariance resolves the chord for some physicists, but applying this to the coin smuggles in a physical symmetry the play explicitly denies. It is settled that invariance restricts valid parametrizations, but whether this rescues objective probability or merely hides subjective assumptions is still debated.

  4. Because the process is authored, the chance setup is ill-posed, suggesting indifference requires ontological randomness rather than mere epistemic ignorance. The play adopts this darker view, implying the characters are doomed by narrative necessity rather than victims of a calculable risk.

  5. The scene dramatizes something darker than the Bayesian shrug, proposing that the space of possibilities was never well-defined. This adds a phenomenological distinction to the debate, separating the feeling of statistical improbability from the recognition of a rigged system.
