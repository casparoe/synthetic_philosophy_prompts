  7.  **Final Polish:** Check for clarity and tone. Ensure the distinction between the *book chapter's claims* and *Gould & Lewontin's actual claims* is clear throughout. (The prompt asks to audit the *summary provided*, which is the book chapter's summary of G&L).

      *   *Wait, one nuance:* The prompt asks to audit the *summary sentence by sentence*. The text provided *is* the summary. So I am auditing the text provided in the prompt, comparing it to reality.
