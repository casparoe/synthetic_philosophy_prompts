          6.  Final Verdict on Inferences.

      *   *Refining the "Unfalsifiable" point:* This is crucial. Popperian falsifiability is key in philosophy of science. Claiming G&L said adaptationism is unfalsifiable is a common misconception. They said it's often *untouched* by data, not that it *can't* be.
