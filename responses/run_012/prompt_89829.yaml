prompt: |-
  I spent most of last night arguing with a friend who works on early modern Catholicism, and I'd like to turn the dispute into a short research proposal before it goes stale. Her line was that Galileo's doctrine of accommodation, as laid out in the 1615 letter to the Grand Duchess Christina, is not really an epistemology of science-scripture conflict at all but a rhetorical instrument fashioned for one institutional fight; my line was that it is a genuine epistemic principle, though one with a self-undermining structure, because the license to reinterpret a scriptural passage seems to be triggered by a physical conclusion having been demonstrated, whereas the Copernican case in 1615 rested on sensory and probable considerations that his own standard appears to rule out. I want a proposal for a roughly 4,000-word paper for a one-day interdisciplinary workshop on scriptural authority and the new science, to be written over about six months part-time. State the question so that it has a determinate answer, explain why the familiar ways of dividing the exegetical reading from the political one leave it open, describe the method — what I would actually examine in the letter's argument and in how it grew out of the earlier Castelli exchange — say what a result would look like and what would count as the project failing, and be honest about what could make it too big for the time available. Assume I will supply the citations myself. End with a single line beginning "Summary:" that states the proposal in one sentence.
