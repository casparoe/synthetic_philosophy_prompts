      *   If you succeed in eliminating all craving, you eliminate the craving for tranquilism, thus losing the motive to maintain it.
      *   If you maintain the craving for tranquilism, you haven't achieved tranquilism.

  4.  **Drafting - Step 3: Collapsing the Distinction:**
      *   What if the community says "It's not a craving, it's different"?
      *   If we collapse the distinction, all motivation is craving. Then action is impossible.
      *   If the second-order desire is just another craving, then the ideal state (no craving) requires the extinction of the desire for that ideal.

  5.  **Drafting - Step 4: Addressing the Objection (Commitment vs. Craving):**
      *   Objection: The desire for tranquility is a rational commitment, not a visceral craving.
      *   Counter: A commitment that motivates action functions psychologically as a drive. If it moves you, it binds you. If it binds you, you are not free of craving.
      *   Also, if it's merely intellectual and doesn't move you, it's useless as a practice.
      *   So, it's either a craving (violating the doctrine) or inert (violating the practice).

  6.  **Drafting - Step 5: What Remains (Action, Love, Choice):**
      *   Can the tranquilist act? Yes, but not *for* a goal.
      *   Can they love? Yes, but not attached.
      *   What must be given up? The claim that this state can be *achieved* through effort. The doctrine must surrender its prescriptive power. It can describe heaven, but not build the road.

  7.  **Drafting - Step 6: Refining Tone and Word Count:**
