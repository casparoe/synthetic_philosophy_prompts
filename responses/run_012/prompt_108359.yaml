      *   **Task:** Make an argument for a specific position: Tranquilism is true as an axiology (theory of value) but false as a practical doctrine (method for living).
      *   **Core Argument:** Pursuing absence of craving is itself a craving.
      *   **Key Distinction:** First-order craving (desire for object/state) vs. Second-order craving (desire to be free of first-order craving).
      *   **Requirement:** Show what happens if this distinction is collapsed.
      *   **Objection to Address:** The strongest objection is that the second-order desire is not a craving but a commitment. Answer it.
      *   **Outcome:** Say what the tranquilist can still do (act, love, choose) and what the doctrine must give up.
      *   **Constraints:** No sources, no readings, no appeal to authority. Argument must be rigorous (not just a mood). Open with the position in one sentence. Maximum 800 words.

  2.  **Drafting - Step 1: The Opening Sentence:**
      *   Needs to state the position clearly: Tranquilism is true as an axiology but false as a practical doctrine.
      *   Draft: Tranquilism correctly identifies the supreme value of existence but fails catastrophically as a guide for living because the pursuit of non-craving is itself a craving.

  3.  **Drafting - Step 2: Developing the Core Argument (First vs. Second Order):**
      *   Define first-order craving: wanting food, love, safety.
      *   Define second-order craving: wanting to stop wanting food, love, safety.
