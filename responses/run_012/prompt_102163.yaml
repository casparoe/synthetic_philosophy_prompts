prompt: |-
  I have been a longtime reader of LessWrong, the EA Forum, and related blogs, and I keep running into a move that I can no longer tell whether it is a theorem or a metaphor. A friend in my local rationalist reading group argues that Harsanyi's aggregation theorem settles the foundations of social choice: he says that choosing for a society is just choosing for yourself under uncertainty. You imagine yourself behind a veil of ignorance, not knowing which person you will be; each possible identity is a state of nature; you assign probabilities; you maximize expected utility; and the theorem then shows that any social ranking that respects unanimous individual preferences and satisfies expected-utility axioms must be a weighted sum of individual utilities. He takes this to license utilitarianism, and more specifically to show that any non-utilitarian social welfare function is either irrational or inconsistent with taking people impartially. I want to audit the analogy rather than the theorem, because I suspect the theorem is being carried by the picture.

  The analogy is between an individual decision under risk and a society aggregating utilities. I would like you to treat it as an argument and ask how far it holds. What plays the role of the decision-maker, the states of nature, the probabilities, the outcomes, and the utility function? Which parts of Harsanyi's setup are genuinely parallel to a single person's expected-utility calculation, and which are stipulations that the analogy makes look natural? Where does the mapping break -- for example, is there an actual chooser behind the veil, are the probabilities ethical weights or subjective degrees of belief, does the ex ante perspective treat persons as separable bearers of utility in a way that ordinary risk does not, and what work is done by the assumptions of interpersonal comparability and expected-utility representation? I am especially interested in what the analogy quietly imports from the source: the picture of a single rational agent with a unified utility function, the idea that identities are like lottery outcomes, and the suggestion that impartiality is just equiprobability. Finally, tell me whether the conclusion my friend wants -- that Harsanyi's theorem forces utilitarianism, or at least makes it the uniquely rational social choice -- survives once those disanalogies are on the table, or whether the theorem only gives a representation result whose ethical content comes entirely from the Pareto and veil assumptions.

  Please structure the response as follows. First, a section titled The analogy and its intended work, about one paragraph, stating the mapping and the conclusion it is being used to support. Second, a section titled Correspondence table, giving a table with a row for each element of the source (individual chooser, states of nature, probabilities, outcomes, utility function, expected utility maximization) and the corresponding element in the target, plus a brief note on how tight each correspondence is. Third, a section titled Where the mapping breaks, two or three paragraphs, separating the disanalogies that matter for the intended conclusion from those that do not. Fourth, a section titled What the analogy imports, one paragraph, on the commitments the picture smuggles in. Fifth, a section titled Verdict on the conclusion, one paragraph, saying whether the friend's conclusion survives, and if not, what weaker conclusion the theorem actually supports. Sixth, a section titled A better analogy, one paragraph, if there is one. I do not need citations or a reading list; I want the audit.
