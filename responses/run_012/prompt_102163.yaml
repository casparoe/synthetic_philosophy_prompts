answer: |-
  ### The analogy and its intended work

  The analogy maps the problem of social choice onto the problem of individual decision-making under risk. In the source domain, a single rational agent chooses between lotteries where outcomes depend on states of nature unknown to them; in the target domain, an impartial observer chooses between social states where their "outcome" depends on which person in society they turn out to be. The intended work of this mapping is to reduce moral obligation to prudential rationality: by treating person-identities as states of nature behind a veil of ignorance, the argument claims that maximizing social welfare is structurally identical to maximizing expected personal utility. If the observer is rational (satisfies von Neumann-Morgenstern axioms) and impartial (assigns equal probability to being any person), the analogy concludes that the only coherent social welfare function is the sum of individual utilities, thereby deriving utilitarianism from the requirements of rationality alone.

  ### Correspondence table

  | Source Element (Individual Risk) | Target Element (Social Choice) | Tightness of Correspondence |
  | :--- | :--- | :--- |
  | **Decision Maker** | **Impartial Observer / Society** | **Loose:** A single mind has a unified consciousness; "society" is a construct requiring aggregation of distinct minds. |
  | **States of Nature** | **Identities (Who I am)** | **Loose:** States are external contingencies; identities are constitutive of the utility-bearers. You cannot literally become another person. |
  | **Probabilities** | **Ethical Weights** | **Broken:** In risk, probabilities are descriptive beliefs about reality; in the veil, "probability of being X" is a normative weight disguised as belief. |
  | **Outcomes** | **Individual Utility Levels** | **Tight:** Both represent the final valuation of a state, assuming utilities are comparable across the mapping. |
  | **Utility Function** | **Social Welfare Function** | **Loose:** Individual utility is personal preference; social utility requires interpersonal comparability and normalization not present in the source. |
  | **EU Maximization** | **Utilitarian Aggregation** | **Conditional:** Holds only if social preferences satisfy the Independence axiom, which is contentious for groups distinct from individuals. |

  ### Where the mapping breaks

  The most critical break occurs in the interpretation of probabilities. In the source domain, probabilities represent epistemic uncertainty about an external world; the agent believes there is a fact of the matter regarding which state will obtain. In the target domain, there is no factual uncertainty about who is who; you are not literally going to wake up as someone else. Therefore, the "probability" of being a specific person is not a belief but a normative weight indicating how much that person's welfare counts. By modeling these weights as probabilities, the analogy smuggles in the mathematical machinery of expected utility (specifically linearity) without justifying why ethical importance should obey the axioms of probability theory. This matters for the conclusion because it allows the proponent to claim that unequal weighting is "irrational" (violating probability axioms) rather than merely unethical.

  A second substantive break concerns the separateness of persons versus the unity of consciousness. In individual risk, one person bears all the outcomes across all states; losses in one state can be compensated by gains in another within the same life. In social choice, distinct persons bear the outcomes; a loss for one person cannot be literally compensated by a gain for another. The analogy treats persons as mere containers for utility that can be aggregated linearly, ignoring the distributive texture of society. This matters because it imports risk-neutrality onto the social observer. An individual might be risk-averse regarding their own life, but the analogy often assumes the observer is risk-neutral over the distribution of utilities across people. Rejecting this neutrality (e.g., prioritizing the worst off) is not irrational; it is a rejection of the claim that society functions like a single person facing a lottery.

  Finally, there are disanalogies that do not undermine the conclusion but are often confused with those that do. For instance, the fact that the "veil of ignorance" is a thought experiment rather than a physical state does not matter; idealizations are permissible in both ethics and decision theory. Similarly, the computational difficulty of calculating social utility versus personal utility is a practical, not structural, difference. The structural breaks listed above are the ones that carry weight: if probabilities are normative weights and persons are separate entities, then the move from "rational choice" to "utilitarian aggregation" is not a logical deduction but a substantive ethical commitment to treat ethical weights as probabilities and separate lives as parts of a whole.

  ### What the analogy imports

  The picture quietly imports the metaphysics of a single rational agent with a unified utility function. It assumes that impartiality is equivalent to equiprobability, which is a specific ethical stance rather than a logical requirement of impartiality (one could be impartial and still prioritize the worst off). It also imports the assumption that the observer's utility over outcomes is identical to the individuals' utility over outcomes, bypassing the hard problem of interpersonal comparison of utility scales. By framing the problem as one of uncertainty rather than conflict, the analogy suggests that social trade-offs are merely technical calculations of expectation, obscuring the political and moral reality that sacrificing one person for another is categorically different than sacrificing one period of your life for another.

  ### Verdict on the conclusion

  Your friend's conclusion that Harsanyi's theorem forces utilitarianism or makes it uniquely rational does not survive the audit. The theorem is a representation result: it shows that *if* social preferences satisfy the Pareto principle and the vNM axioms (particularly Independence), *then* social welfare must be a weighted sum of individual utilities. The ethical content comes entirely from the decision to apply individual rationality axioms to social choices and the stipulation of the weights (the veil), not from the mathematics itself. Non-utilitarian theories (like prioritarianism or Rawlsian maximin) are not irrational; they simply reject the premise that social choice must satisfy the Independence axiom or that ethical weights should mimic probabilities. The theorem shows utilitarianism is consistent with certain rationality constraints, not that it is the only consistent view.

  ### A better analogy

  A more faithful analogy is that of a **trustee managing distinct beneficiaries**. In this picture, the decision-maker is not uncertain about their identity but is instead a fiduciary agent responsible for multiple distinct principals. The trustee must balance the claims of these beneficiaries without conflating them into a single mind. This preserves the separateness of persons and makes clear that the aggregation rule (how to weigh competing claims) is a matter of fiduciary duty or ethical mandate, not a calculation of self-interest under uncertainty. It allows for the possibility that a rational trustee might prioritize the most vulnerable beneficiary over the sum total of wealth, capturing the intuition behind non-utilitarian social choice functions without implying the trustee is literally "becoming" the beneficiaries.
