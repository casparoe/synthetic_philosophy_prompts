  2.  **Evaluate the Case Study (The "Solvent Programme"):**
      *   *Is it sufficient for a Lakatosian analysis?*
      *   *Lakatos's Criteria:* A research programme is *theoretically progressive* if each theory change predicts some novel fact. It is *empirically progressive* if some of these novel facts are corroborated. It is *degenerating* if it only offers post-hoc explanations for anomalies.
      *   *Solvent Programme:* Has a novel prediction (enzyme variant). Has belt adjustments (scoring rubric, dose window). Are these adjustments *ad hoc* or content-increasing? The prompt says the dose window narrowing has "independent physiological argument." This suggests content-increasing (theoretical progress), not just saving the phenomenon. The rubric revision is trickier; it recovered a positive result. Is that *ad hoc*? Lakatos distinguishes *ad hoc1* (no new content), *ad hoc2* (no empirical support), *ad hoc3* (no heuristic power).
      *   *Stress Programme:* Fits data equally well but *no novel predictions in 15 years*. This looks degenerative under Lakatos.
      *   *Verdict:* The Solvent Programme looks theoretically progressive (enzyme prediction + physiological arguments for dose narrowing), whereas the Stress Programme looks stagnant/degenerative (no novel facts, just belt tinkering).
