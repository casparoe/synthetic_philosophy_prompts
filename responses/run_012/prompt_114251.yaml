answer: |-
  **Examiner's Note on Case Viability**
  The case is sufficiently robust for a high-level seminar, provided students grasp the distinction between *ad hoc* adjustments and those driven by a positive heuristic. The tension lies in the scoring rubric revision (which smells of *ad hoc* saving) versus the physiological dose arguments and enzyme prediction (which signal content increase). If students treat all belt adjustments as equal, the verdict becomes arbitrary. The marking scheme below penalizes that conflation.

  ***

  ### Exam Question: Philosophy of Science (Final)

  **Question 1**
  Consider the "Solvent Programme" and its rival, the "Stress Programme," as described in the attached case summary.

  1.  Apply Lakatos's Methodology of Scientific Research Programmes (MSRP) to determine which programme is currently rational to pursue. In doing so, you must distinguish between belt adjustments that merely protect the hard core and those that constitute theoretical progress.
  2.  Evaluate whether Lakatos's criterion allows a scientist to make this determination at the time the evidence emerges, or only in hindsight. What implication does this have for MSRP as a guide for scientific practice?
  3.  Briefly contrast this Lakatosian verdict with how a Popperian falsificationist and a Kuhnian paradigm theorist would each characterize the competition between these two programmes.

  *(Answer length: approx. 700 words)*

  ***

  ### Model Answer

  On Lakatosian grounds, the Solvent Programme is rational to pursue, while the Stress Programme is degenerating. The demarcation rests not merely on the count of successful predictions, but on the nature of the protective belt adjustments. Lakatos distinguishes between *ad hoc* adjustments that decrease content and those driven by a positive heuristic that increase it. The Solvent Programme's narrowing of the dose window was supported by independent physiological arguments; this suggests the adjustment was derived from the programme's heuristic rather than concocted solely to evade the anomaly of the negative large-scale study. Furthermore, the novel prediction regarding the enzyme variant constitutes empirical progress, corroborating a previously unexpected fact. Conversely, the Stress Programme, while fitting the epidemiology, has generated no novel predictions in fifteen years. Its belt adjustments (coping styles, exposure windows) appear to be post-hoc rationalizations to accommodate data rather than anticipate it. Thus, the Solvent Programme is theoretically and empirically progressive; the Stress Programme is stagnating.

  However, this verdict is inherently retrospective. Lakatos acknowledges that empirical progress is established only when novel facts are corroborated, which takes time. At the moment the scoring rubric was revised, it was unclear whether this was a content-increasing refinement or a desperate save. The "independent physiological argument" helps, but the ultimate validation comes from the enzyme prediction's confirmation. This limits MSRP's usefulness as real-time advice. A scientist cannot know with certainty if their programme is degenerating until history has judged the subsequent corroborations. MSRP offers a reconstruction of rationality, not a decision procedure for the laboratory. It tells us what *was* rational, not necessarily what *is* rational in the moment of crisis.

  A Popperian would view this competition with greater suspicion regarding the Solvent Programme's hard core. For Popper, the large study where the syndrome failed to turn up should have acted as a potential falsifier of the core claim. By revising the scoring rubric and dose thresholds to absorb this anomaly, the Solvent scientists are engaging in "conventionalist stratagems" to immunize the theory from refutation. Popper would demand a risky test where the core is directly exposed, rather than protected by belt adjustments. He might view the Stress Programme similarly but would likely insist that both are metaphysical until they expose themselves to higher falsifiability. The enzyme prediction is good, but the protection of the core against the negative study is methodologically suspect.

  A Kuhnian would reject the methodological comparison entirely. For Kuhn, these programmes represent competing paradigms (or pre-paradigmatic schools). The choice between them is not decided by algorithmic criteria like novel facts or belt consistency, but by values like accuracy, scope, and simplicity, interpreted through the lens of professional commitment. The fact that both programmes explain away each other's anomalies suggests a state of crisis or incommensurability. A Kuhnian would argue that scientists choose the Solvent Programme not because MSRP dictates it, but because the community perceives the enzyme mechanism as a more promising puzzle-solution for *normal science*. The shift is sociological and gestalt-like, not a logical deduction from methodological rules. Where Lakatos sees a rational reconstruction of progress, Kuhn sees a shift in professional allegiance during a period of extraordinary science.

  ***

  ### Marking Scheme (20 Marks)

  **1. Lakatosian Verdict & Novelty (4 marks)**
  *   **Must Hit:** Identifies Solvent Programme as progressive and Stress Programme as degenerative, citing the enzyme prediction as the key novel fact.
  *   *Common Miss:* States Solvent is better simply because it had "a success," without linking it to Lakatos's specific definition of empirical progress (corroborated novel fact).

  **2. Quality of Belt Adjustments (4 marks)**
  *   **Must Hit:** Distinguishes the physiological dose arguments (content-increasing/heuristic) from the rubric revision (potentially *ad hoc*), noting that not all belt changes are equal.
  *   *Common Miss:* Treats all protective belt adjustments as equally "ad hoc" or fails to discuss the physiological argument's role in signaling theoretical progress.

  **3. Timing & Hindsight (4 marks)**
  *   **Must Hit:** Acknowledges that MSRP is largely retrospective (hindsight) and therefore limited as a real-time decision rule for practicing scientists.
  *   *Common Miss:* Claims MSRP provides a clear, immediate algorithm for scientists to decide which theory to drop in the moment.

  **4. Popperian Contrast (4 marks)**
  *   **Must Hit:** Notes Popper's suspicion of protecting the hard core (immunization) and his view that the negative study should have been more threatening/falsifying.
  *   *Common Miss:* Describes Popper generally (falsification) without applying it to the specific tension of the "negative large study" in the case.

  **5. Kuhnian Contrast (4 marks)**
  *   **Must Hit:** Frames the choice as paradigmatic/sociological rather than methodological, referencing incommensurability or community values over logical criteria.
  *   *Common Miss:* Describes Kuhn as simply "historical" without addressing the incommensurability or the non-algorithmic nature of paradigm choice.
