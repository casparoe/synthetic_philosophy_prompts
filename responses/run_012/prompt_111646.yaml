answer: |-
  This is a sharp setup. You've essentially weaponized the "problem of many causes" against the "problem of no causes," and the Swap Test is a stress test for whether a theory treats causation as a *natural* relation or a *normative* one.

  Here is the tier list based on how well each approach survives the Swap Test without begging the question, followed by the collapse warnings and the verdict on the test itself.

  ### The Tier List

  **S-Tier: Approach 1 (Omissions are causes; selection runs on norms)**
  This theory passes the Swap Test with flying colors because it accepts the symmetry you posit: in both the "action" and "omission" descriptions, the counterfactual dependence holds, so both are causes; norms merely determine which one we *talk* about. It doesn't need the verdict to flip, so it never risks looking like it's manipulating the description to save the intuition.

  **A-Tier: Approach 5 (Quasi-causal: enabling/disabling)**
  This lands high because it offers a principled reason for the verdict to flip without denying the physical parity: it posits two distinct relations (causing vs. enabling) that map onto the different descriptions. It avoids the "question-begging" charge by admitting the relation changes, though it risks looking like a label-swap if the distinction between "causing" and "enabling" isn't physically grounded.

  **B-Tier: Approach 2 (Special counterfactuals relative to defaults)**
  This sits in the middle because "defaults" are slippery in a Swap Test. If the default is statistical (what usually happens), it might pass; but if the default is normative (what *should* happen), it collapses into Approach 4. In a swap scenario where the physics are fixed but the description shifts, defining the "default" without smuggling in the desired verdict is difficult.

  **C-Tier: Approach 3 (Omissions aren't causes; loose talk)**
  This struggles because it must assert an ontological difference (presence vs. absence) in a test case designed to erase that difference. To say one case is "causal" and the other is "mere explanation" despite identical physical/counterfactual profiles looks like it's prioritizing the label over the machinery, failing the "non-question-begging" clause.

  **D-Tier: Approach 4 (Duty/expectation baked into causal status)**
  This is the hardest hit by the Swap Test. Because it makes normative status a *condition* for causation, it must deliver different verdicts for the two cases. But since the physics and counterfactuals are ex hypothesi identical, the only thing doing the work is the normative description itself, which looks exactly like the "quiet re-describing" the test forbids.

  ***

  ### The Collapse Warning

  You asked to flag approaches that collapse under pressure. There are two major fault lines here:

  1.  **Approach 1 and Approach 4 are functionally indistinguishable in practice.**
      While they disagree metaphysically (Is the norm selecting a cause or constituting it?), their output is identical. In any real-world case, Approach 1 says "It's a cause but we ignore it" and Approach 4 says "It's not a cause." For the purpose of prediction, law, or moral reasoning, these yield the same results. Approach 4 is just Approach 1 with stronger metaphysical commitments.
  2.  **Approach 3 and Approach 5 are siblings.**
      Denying omissions are "causes proper" (3) and calling them "quasi-causes" (5) is often a terminological dispute. Both agree omissions lack the metaphysical heft of positive actions. Unless Approach 5 can specify a mechanism for "enabling" that is distinct from "explaining," it's just Approach 3 with extra steps.

  ***

  ### Is the Swap Test Rigged?

  **Yes, but productively so.**

  Your suspicion is correct: the Swap Test presupposes a form of **Causal Physicalism** (causal verdicts should supervene on physical/counterfactual profiles).

  *   **Why it's rigged:** Approaches 2, 4, and 5 explicitly reject that presupposition. They argue that causation is *not* purely physical; it is partly constituted by norms, expectations, or relations. For them, changing the description from "omission" to "action" *is* a metaphysical change, not just a linguistic one. To them, the test asks, "Can you treat these as different when they are the same?" and their answer is, "They aren't the same; the normativity is part of the furniture."
  *   **Why it's still useful:** It forces the Normative Realist (Approach 4) to admit they are non-naturalists about causation. It strips away the camouflage. If a theory cannot pass the Swap Test, it proves that the theory relies on normative facts to do metaphysical heavy lifting.

  **Verdict:** The test doesn't prove the normative theories are *false*, but it proves they are *expensive*. It shows that to save the intuition that "omissions aren't causes," you have to pay by making causation sensitive to norms. Approach 1 wins the test because it's the only one willing to let go of that intuition to save the metaphysics.
