prompt: |-
  My flatmate Nina is obssessed with the royals and has really firm opinions about when a king or queen is allowed to do something off their own bat instead of just doing what the government tells them. Here's where she's landed on the ones we keep arguing about:

  - A bill passes with a massive majority and the public's behind it, and the king refuses to sign it because he personally thinks it's immoral. Nina says that's out of order, it's not his call.
  - An election leaves nobody with a majority, and the king has to decide who to ask to try to form a government. She says he's entitled to pick whoever can actually get the votes in parliament, even if that's not the sitting PM, and even if the sitting PM is telling him to pick himself.
  - The PM asks the king for an early election purely to get out of a vote he's about to lose. She says the king should refuse, even though it's the PM himself who's asking.
  - A PM loses the election and won't leave, and asks the king to shut parliament down so he can carry on ruling on his own. She says the king should tell him where to go and swear in the other lot.

  She's also got a thing about how the Japanese emperor is basically not allowed to do anything at all, and she can't decide whether that's the ideal version of a monarchy or a waste of a perfectly good one.

  Now here's the one I actually want her verdict on, and she's away for a fortnight so I can't ask her. A bill passes easily. It was in the governing party's manifesto, parliament has properly voted it through, there's no sneaky power grab, nobody's messing with elections. But the public hate it, like two thirds against in the polls, and the king genuinely believes it's unjust. He refuses to sign it, goes on telly and explains why, and most of the public backs him. The government would just get hammered at the next election anyway if people are that annoyed.

  So what's she going to say, and whats the rule she's actually been running this whole time? I've got a feeling she's got one rule doing the work in the first case and the last case and maybe a seperate one for the middle two, and I want to know if that's right or if there's just one rule covering all of it. Which of the rules that fit everything she's said does my new case actually test? If you had to bet, which way does she go and why? And then tell me what I should ask her about next, so I can tell whether she thinks a king can veto anything the public's against, or only laws that are genuinely unjust and that the public's against as well.
