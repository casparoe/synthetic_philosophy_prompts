answer: |-
  The Chance-Forge hummed in the basement, a low-frequency vibration that traveled up through the floorboards of the Bureau of Chances. It was a brass beast, scarred by decades of levers pulled. You set the dial—0.0 to 1.0—and pulled the handle. It spat out a slip of paper: 1 or 0. The dial promised a long-run rate, but the machine had a memory. If it had spat out three 1s in a row, the physical disposition of the gears shifted, making the next 1 slightly heavier, though the dial remained fixed. It was a honest liar.

  Upstairs, the air was stale with recycled paper and tension. Elara, the Bureau's chief actuary, spread a map of the island across the table. A single red dot marked Mount Hala.

  "It's a singularity," Elara said, tapping the dot. "One volcano. One decade. Either it blows or it doesn't. There is no long run. There is no ensemble. My frequency tables are empty."

  Julian, the senior underwriter, leaned back, spinning a pen. "The tables are empty because you're looking for ghosts, Elara. Probability isn't out there in the rocks. It's in the ledger. It's what we're willing to bet."

  "It's in the stress fractures," said Dr. Aris. The retired physicist sat by the window, watching the smoke from the forge vent drift over the harbor. He turned, his eyes milky but sharp. "The dial on the Forge isn't a suggestion. It's a setting of physical reality. Like mass. Like charge. Mount Hala has a propensity to erupt. It is a dispositional property of the magma chamber. It exists whether we insure it or not."

  "We can't insure a metaphysical disposition, Aris," Elara snapped. "We insure risks we can quantify. The Bureau's Robustness Rule is clear. A probability is only legitimate if it stays roughly the same when you redraw the boundary of the reference class. Change the decade by a year. Change the volcano class by magma viscosity. If the number jumps, it's noise."

  Aris stood up and walked to the map. "If you change the volcano, it is a different volcano. The propensity is specific to *this* setup. The Robustness Rule drags in other setups that don't matter. You're asking me to measure the mass of this apple by weighing the oranges next to it."

  "And I'm asking you to prove the mass exists without a scale," Elara countered. "The Forge down there? Even that machine violates your view. Its propensity changes based on the history of draws. The disposition isn't stable. It's path-dependent."

  "The dial fixes the attractor," Aris said, stubborn. "The local variations are just noise around the true physical tendency."

  Julian sighed, uncapping his pen. "Look, the government wants this policy sold. The tourists need to know their hotels won't be buried in ash. I'm willing to set the probability at 0.15. Based on my prior assessment of seismic activity, combined with the historical rate of similar subduction zones in the Pacific."

  Elara slammed her hand on the table. "There are no similar subduction zones! Hala is unique. You're just picking a number that feels right. You're a subjectivist, Julian. You think probability is a degree of belief. You could believe it's 0.99 tomorrow if you woke up on the wrong side of the bed."

  "My beliefs are constrained," Julian said, his voice tightening. "I'm calibrated. When I say 15%, events like this happen 15% of the time in my model."

  Elara laughed, a dry, brittle sound. "Calibration? Calibration is itself a frequentist idea, Julian. To be calibrated, you need a long run of trials to check your beliefs against outcomes. You've never seen Hala erupt. You've never seen a decade like this. You're claiming calibration on a sample size of one. That's not calibration. That's confidence."

  Julian flushed. "It's coherent betting odds. If I'm wrong, I lose money. The market corrects me."

  "The market doesn't correct you until after the island is underwater," Elara said.

  The room fell silent. The hum of the Forge seemed to pulse through the floor. They were stuck. The Bureau could not issue a policy without a sanctioned probability. The Robustness Rule was the lock, and none of them had the key.

  Aris walked over to the corner where a smaller, desktop version of the Forge sat used for testing. He ran a hand over the brass dial. "You treat the number as a description of ignorance," he said to Julian. "And you," he pointed to Elara, "treat it as a description of history. I am telling you it is a description of the future's physical shape. The volcano *wants* to erupt. The pressure is a real thing."

  "The Robustness Rule," Elara said, ignoring him, turning back to Julian. "If we shift the boundary. Say, we define the risk as 'eruption within 10 years' versus 'eruption within 11 years'. Does your 0.15 hold?"

  Julian hesitated. "It might shift to 0.16."

  "And if we include dormant volcanoes that haven erupted in 5,000 years versus 10,000?"

  "0.14."

  "It wobbles," Elara said. "The Rule says if it wobbles, the probability isn't legitimate. We can't write the policy."

  "Then the Bureau fails," Julian said. "People need coverage."

  "Better no coverage than false coverage," Elara muttered.

  Aris stepped in. "The wobble is because you are looking at classes. Look at the thing. I have measured the gas emissions. I have measured the tremor frequency. There is a physical likelihood. It is not about the class. It is about the propensity of this specific system. The Robustness Rule is wrong. It forces us to lie about the specificity of the chance."

  "The Rule protects us from hallucinations," Elara said. "If the number depends entirely on how you draw the box, the number is meaningless."

  "Or," Aris said softly, "the chance is real, but your boxes are clumsy."

  He walked back to the small Forge. He set the dial to 0.5. He pulled the lever. It spat out a 1. He pulled it again. 1. Again. 0.

  "See?" Aris said. "The machine has a memory. The propensity of the third draw was different from the first, because the machine changed. But the dial stayed at 0.5. The dial represents the long-run frequency constraint, but the single draw is governed by the immediate physical state. You are trying to apply the dial's logic to the volcano. But the volcano is the single draw."

  Elara rubbed her temples. She looked at the volcano file. She looked at Julian's confident posture. She looked at Aris's trembling hand on the brass.

  She knew Julian was guessing. She knew Aris was mystifying a physical stress test into a metaphysical guarantee. But she also knew the Bureau would be dissolved if they didn't issue a number. The Robustness Rule was a shield, but it was also a cage.

  "Julian," Elara said. "Write the 0.15."

  Julian blinked. "You're approving it?"

  "I'm not approving the truth of it," Elara said, her voice flat. "I'm approving the solvency of the Bureau. We will write the policy. But we add a clause."

  She pulled a contract form toward her. "Clause 44-B. 'Probability assigned under Robustness Exception.' We state explicitly that this probability does not satisfy the reference class stability requirement. We state that this is a subjective assessment backed by physical propensity claims that cannot be frequency-verified."

  "That ruins the product," Julian said. "No one will buy insurance that admits the number might be nonsense."

  "They'll buy it," Elara said. "Because they're scared. But we won't pretend the math is working like it does for car insurance. We stop pretending the volcano is a die roll."

  Aris frowned. "You're diminishing the reality of the chance."

  "I'm protecting the Bureau from the reality of the chance," Elara said. "If you're right, Aris, and the propensity is real, then the volcano doesn't care about our reference classes. If I'm right, and there's no frequency, then we're gambling. If Julian is right, and it's just belief, then we're selling confidence."

  She signed the form. The ink looked black and final.

  Julian signed next, his hand steady, though he avoided Elara's eyes. He knew she had exposed him. He had claimed calibration, but he knew she was right. He was betting on his own coherence, not the world.

  Aris was the last. He hovered over the paper. "If I sign this," he said, "I am agreeing that the propensity is merely a clause. A footnote."

  "You're agreeing that we don't know," Elara said. "You've spent thirty years measuring mass and charge. You know when a measurement is out of range. This is out of range. The Robustness Rule broke because the thing itself is unique. Maybe propensity is real, Aris. But if we can't measure it without dragging in other volcanoes, we can't price it."

  Aris looked at the Forge in the corner. The dial was still set to 0.5. The machine waited. It had a disposition to spit out numbers, a physical tendency grounded in gears and springs and memory. But without the long run, without the reference class, the number on the dial was just a label.

  He thought about the magma beneath Hala. The pressure was real. The disposition was real. But the *probability*? The probability was the bridge between the rock and the ledger. And the bridge was made of words, not steel.

  "If I sign," Aris said, "I am not saying the chance isn't real. I am saying the Bureau cannot capture it."

  "Sign," Elara said. "The tourists are arriving tomorrow."

  Aris signed. His signature was shaky.

  They sat back. The contract lay on the table, a thin sheet of paper between them and the mountain. The hum of the Forge drifted up, steady and indifferent.

  "So," Julian said, breaking the silence. "What do we tell them? The clients?"

  Elara stacked the files. "We tell them the premium is based on the best available assessment. We don't tell them about the Robustness Exception unless they ask."

  "And if they ask?" Aris said.

  Elara looked at him. For the first time, she looked tired. "Then you tell them about the propensity. I'll tell them about the data. Julian will tell them about the belief. And they can choose which story makes them feel safer."

  "Three stories for one number," Julian murmured.

  "One number for three realities," Aris corrected.

  Elara stood up and walked to the window. The sky was grey, matching the sea. She wondered if the volcano cared about the difference. If it erupted, it would bury the Bureau, the Forge, and the contract alike. The ash wouldn't distinguish between frequency and belief. It would just fall.

  But until then, they had to set the dial.

  "Get back to work," Elara said, not turning around. "The Forge needs resetting for the morning run. Make sure the memory wipe is complete. We need the long run to look clean, even if it isn't."

  Aris stood slowly. He walked to the door, then paused. "The memory wipe doesn't change the wear on the gears," he said. "The propensity changes whether you wipe the memory or not. The machine ages."

  "Then we insure the machine too," Elara said.

  Julian gathered his pens. "What's the probability of that?"

  Elara didn't answer. She just watched the smoke from the vent dissolve into the grey air, wondering if the chance was in the smoke, or in the eye watching it fade.
