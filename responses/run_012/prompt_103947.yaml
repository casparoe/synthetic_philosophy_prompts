  You charge I shatter signs and houses twelve,
  And tear the zodiac from its ancient place,
  Where polygons inscribe their strict confines,
  To force the earth with physical embrace.
  You hold the trine compels the seed to grow,
  The square brings strife by force of beam and light,
  As if the stars direct the world below,
  By material rays that rule the day and night.

  Now angles sing where silent matter ceased,
  No beam descends to strike the mortal clay,
  But harmony awakes the soul released,
  As lutes vibrate when kindred tones do play.
  I keep the aspect's harmonic proportion,
  Rejecting all influx and compulsion.

  ***

  **Historical Note**

  **Settled Consensus:** Historians of science agree that Kepler did not intend to abolish astrology, but to reform it on new physical and metaphysical foundations, primarily articulated in *De Fundamentis Astrologiae Certioribus* (1601) and *Harmonices Mundi* (1619). It is secure that he rejected the traditional mechanism of "physical influx" (the idea that light or heat rays physically carry specific influences to Earth) and the validity of the traditional twelve houses. He replaced these with "archetypal causes," arguing that planetary aspects are valid only insofar as they correspond to musical consonances (harmonic proportions) which the Earth-soul perceives geometrically.

  **Contested Interpretations:** Debate remains regarding the extent to which Kepler retained traditional planetary significations (e.g., Mars signifies war). While he theoretically derived meanings from harmony, in practice (such as his weather predictions and natal charts for Wallenstein), he often relied on traditional lore, leading some scholars to argue his reform was more philosophical than practical. Furthermore, while the poem emphasizes "inclination not compulsion" (a standard Keplerian distinction regarding free will), historians contest how deterministic Kepler's system ultimately was; some argue his emphasis on the soul's automatic response to harmony reintroduced a subtle form of determinism he claimed to reject.

  **Poetic License:** The poem leans on the *theoretical* Kepler of *Harmonices Mundi* rather than the working astrologer. The couplet's sharp distinction ("Rejecting all influx") simplifies his view; Kepler admitted physical rays affected the *body* (weather), but denied they affected the *soul* astrologically. The term "compulsion" is used to rhyme with "proportion," reflecting his Latin *compellere*, though he more frequently contrasted "inclination" with "necessity."
