answer: |-
  You have independently rediscovered a famous problem in the intersection of probability theory, decision theory, and philosophy. You are not lumping things together incorrectly; you have identified a precise structural flaw in the standard definition of expectation.

  Here is the breakdown of the name, the math, the distinctions, and the implications.

  ### 1. The Name
  Your "Monster Game" has a specific name in the literature: **The Pasadena Game**.

  It was introduced by philosophers Nicholas Nover and Alan Hájek in their 2004 paper *"Vexing Expectations"*. They constructed it specifically to demonstrate that a game can have a well-defined probability distribution and a well-defined payoff for every outcome, yet fail to have an expected value in the standard sense, even though the alternating series converges conditionally.

  There is also a variant called the **Arroyo Game**, which is even more pathological (the alternating series itself fails to converge), but your game is the canonical Pasadena Game.

  ### 2. The Mathematical Status: "Undefined" vs. "Infinite"
  You asked for the edges of the phenomenon. Here is the rigorous distinction.

  In modern measure-theoretic probability (the Kolmogorov framework), the expected value $E[X]$ is defined as the **Lebesgue integral** of the random variable with respect to the probability measure. For the expectation to exist (be a real number or $\pm \infty$), the integral of the *absolute value* must be defined.

  We split any variable $X$ into its positive part $X^+$ (wins) and negative part $X^-$ (losses).
  $$E[X] = E[X^+] - E[X^-]$$

  *   **Standard Expectation:** Exists if at least one of $E[X^+]$ or $E[X^-]$ is finite.
  *   **Infinite Expectation:** One part is finite, the other is infinite (e.g., St. Petersburg: $E[X^+] = \infty, E[X^-] = 0$). Result: $E[X] = \infty$.
  *   **Undefined Expectation:** **Both** parts are infinite ($E[X^+] = \infty$ and $E[X^-] = \infty$). Result: $\infty - \infty$, which is undefined.

  Your game falls into the third category. The series $\sum \frac{(-1)^{n+1}}{n}$ converges conditionally to $\ln(2)$, but the Riemann Rearrangement Theorem tells us that conditionally convergent series can be reordered to sum to *any* number. Because the sample space of a probability distribution does not come with a mandatory "order" (flip 1, then flip 2...), relying on the natural order $n=1, 2, 3...$ is mathematically arbitrary in the context of integration. To be robust against rearrangement, the expectation requires **absolute convergence** ($\sum |x_n|p_n < \infty$). Your game fails this test.

  So, "Undefined Expected Value" is the correct technical term. Sometimes it is called **non-integrable**.

  ### 3. The Wrinkles: Are they the same?
  Yes. All three cases you described are instances of the same phenomenon: **The Divergence of Both Tails.**

  *   **(a) Symmetric St. Petersburg:** Here $E[X^+] = \infty$ and $E[X^-] = \infty$. It is undefined for the exact same reason as the Pasadena game. The fact that it feels "obviously worth nothing" is a clash between intuition (symmetry) and the formalism (undefined).
  *   **(b) Pasadena + $1:** Since $E[\text{Pasadena}]$ is undefined, $E[\text{Pasadena} + 1] = \text{undefined} + 1 = \text{undefined}$.

  This highlights a critical edge: **Linearity of Expectation fails.** The rule $E[X + c] = E[X] + c$ only holds if $E[X]$ exists. When expectation is undefined, you cannot do arithmetic with it.

  ### 4. What Follows? (Decision Theory)
  You asked if "no expectation" means there is "no fact of the matter." This is where the philosophy gets heated.

  **The Standard View (EUT):**
  Expected Utility Theory is silent. It cannot tell you whether to play the Pasadena game, nor can it tell you that Pasadena + $1 is better than Pasadena. The theory breaks.

  **The Dominance Principle:**
  Even if expectation fails, **Dominance** usually holds. If Game A pays $x$ and Game B pays $y$ in every possible outcome, and $y > x$ always, you should prefer B.
  *   In your Wrinkle (b), Pasadena + $1 dominates Pasadena.
  *   This suggests that Expectation is not the fundamental norm of rationality; Dominance is. Expectation is just a useful tool that works *when it exists*.

  **Weak Expectation (The "Fact of the Matter" Rescue):**
  There is a concept called **Weak Expectation**. While the *Strong Expectation* (the Lebesgue integral) is undefined, the *Weak Expectation* looks at the long-run average of repeated plays.
  *   **St. Petersburg:** The average payoff grows without bound. No stable long-run average.
  *   **Pasadena Game:** Surprisingly, despite the undefined expectation, the average payoff over many trials *does* converge to $\ln(2)$ with probability 1. (This is a result discussed by Kenny Easwaran, 2008).
  *   **Implication:** If you play the Pasadena game a million times, your average profit per game will likely be close to $0.69$. If you play the Symmetric St. Petersburg (Wrinkle a), your average will *not* settle; it will keep swinging wildly.

  So, for the Pasadena game, there *is* a fact of the matter about the long-run frequency, even if the single-case expectation is undefined. For the Symmetric St. Petersburg, there is not.

  ### 5. Summary of Differences

  | Feature | St. Petersburg | Pasadena (Your Game) | Symmetric St. Petersburg |
  | :--- | :--- | :--- | :--- |
  | **Positive Part ($E^+$)** | $\infty$ | $\infty$ | $\infty$ |
  | **Negative Part ($E^-$)** | $0$ (finite) | $\infty$ | $\infty$ |
  | **Expectation** | $+\infty$ | **Undefined** | **Undefined** |
  | **Long-Run Average** | Diverges (grows) | Converges to $\ln(2)$ | Diverges (oscillates) |
  | **Decision Rule** | Play (if utility linear) | Indeterminate (by EUT) | Indeterminate (by EUT) |

  ### 6. Confidence and Uncertainty Flag

  **Confidence Level: High (95%)**
  I am highly confident in the mathematical classification (Lebesgue integrability, Riemann Rearrangement), the identification of the game (Pasadena Game, Nover & Hájek 2004), and the distinction between infinite and undefined expectations ($E^+$ vs $E^-$ divergence).

  **Uncertainty Flag: Normative Decision Theory**
  The bit I am least sure about is the *prescriptive* conclusion: "What should a rational agent do?"
  While I cited Easwaran's argument that the Weak Expectation ($\ln 2$) should guide action for the Pasadena game, this is **not a settled consensus**. Some philosophers argue that if the Strong Expectation is undefined, the game has no value, full stop. Others argue that Weak Expectation saves it. Others propose entirely new decision matrices (like "Relative Expectation Theory").
  If you are looking for a single, universally accepted rule on how to bet on the Pasadena game, it does not exist. The "fact of the matter" regarding *value* is still debated in philosophy of probability, even if the "fact of the matter" regarding the *math* is settled.

  ### Recommendation
  If you want to read the edges of this phenomenon, search for:
  1.  **Nover & Hájek (2004):** *"Vexing Expectations"* (The origin).
  2.  **Easwaran (2008):** *"The Expected Utility of the Pasadena Game"* (The defense of Weak Expectation).
  3.  **Peters (2019):** Work on "Ergodicity Economics" often touches on why time-averages (Weak Expectation) differ from ensemble-averages (Strong Expectation) in these pathological cases.

  Your intuition that this is a "different animal" from St. Petersburg is correct. St. Petersburg is a problem of **infinity**; the Pasadena Game is a problem of **indeterminacy**.
