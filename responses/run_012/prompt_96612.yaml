answer: |-
  You have identified a genuine and well-documented tension in the philosophy of biology, but you are correct that the specific *rhetorical maneuver* you describe—the covert sliding between the two functions mid-argument to gain leverage—does not have a single, universally recognized proper noun like "The Gell-Mann Amnesia Effect."

  The closest established concepts are **"The Species Problem"** (which covers the definitional difficulty but not the rhetorical switch), **"Species Pluralism"** (which advocates for using different definitions for different purposes but assumes honesty about the switch), and **"Boundary Object"** (a sociological term from Star & Griesemer, 1989, which describes *why* the word "species" can hold different meanings for different groups without breaking, but doesn't name the argumentative slide itself).

  There is also **"Strategic Essentialism"** (borrowed from critical theory), which is sometimes used in conservation biology to describe treating a fluid biological group as a fixed unit for political protection. However, this describes a *policy stance*, not the *linguistic slippage* during a debate.

  Because there is no established term that specifically isolates the *covert rhetorical oscillation* between the "real division" claim and the "practical unit" claim, I will provide a precise coinage that captures the mechanism you described.

  ### The Coinage: The Ontological-Pragmatic Slide

  **Definition:**
  The **Ontological-Pragmatic Slide** occurs when a single taxonomic term (like "species") is used in a discourse where it carries two distinct weights:
  1.  **Ontological Weight:** The claim that the term refers to a mind-independent, objective reality in nature (a "real" lineage).
  2.  **Pragmatic Weight:** The claim that the term serves as a necessary unit for management, law, or counting (a "useful" category).

  The "Slide" happens when a speaker implicitly shifts between these weights to evade counter-arguments. When challenged on the *reality* of the division (e.g., "These groups interbreed"), the speaker retreats to the *pragmatic* necessity ("We need to count them separately for conservation"). When challenged on the *utility* (e.g., "Splitting them wastes resources"), the speaker retreats to the *ontological* reality ("But they are evolutionarily distinct treasures"). The fallacy lies in treating the term as having a single, stable meaning while exploiting the ambiguity between its existence-claim and its function-claim.

  **How it differs from related terms:**
  *   **Vs. The Species Problem:** The Species Problem is the *scientific/philosophical difficulty* in defining species. The Slide is the *argumentative tactic* used to navigate that difficulty without admitting it exists.
  *   **Vs. Pluralism:** Pluralism is the *honest admission* that different definitions serve different purposes. The Slide relies on *concealing* that different definitions are being used.
  *   **Vs. Equivocation:** Equivocation is the generic logical fallacy. The Ontological-Pragmatic Slide is a *specific subtype* of equivocation unique to natural kind terms that also serve as regulatory units (like "species," "weed," or "disability").
  *   **Vs. Boundary Object:** A "Boundary Object" is the *structural reason* the term can hold multiple meanings across communities (e.g., lawyers and biologists). The Slide is the *active deployment* of that ambiguity to win a point.

  **The Edges of the Definition:**
  *   **Inside the Definition:** A forum argument where Person A says, "We must save this wolf because it's a unique species" (Ontological), and when told it hybridizes with coyotes, replies, "But if we don't list it as a species, it loses legal protection" (Pragmatic), without acknowledging that the definition of "species" just changed from "reproductive isolation" to "legal unit."
  *   **Outside the Definition:** A biologist stating, "Phylogenetically, these are distinct lineages, but for the purposes of the Endangered Species Act, we are managing them as a single unit." This is **Declared Pluralism**. The switch is explicit, so there is no slide.

  **Boundary Case:**
  Consider the debate over the **Red Wolf (*Canis rufus*)**.
  *   *The Case:* Genetic evidence suggests red wolves are a recent hybrid population between gray wolves and coyotes (challenging the Ontological "real species" claim). However, they occupy a unique ecological niche and have distinct morphology (supporting the Pragmatic "management unit" claim).
  *   *The Boundary:* If a conservationist argues, "They are a distinct species [Ontological], therefore they deserve protection," and when confronted with the hybrid data, says, "Well, species are just human categories anyway, but we need to protect this lineage [Pragmatic]," they are performing the **Slide**.
  *   *The Edge:* If the conservationist argues, "Whether or not they fit the strict biological species concept, they represent an Evolutionarily Significant Unit (ESU) that requires management," they are **not** sliding. They have moved to a third, technical term (ESU) that bridges the gap. The Slide only occurs when the *same word* ("species") is made to bear both weights simultaneously without acknowledgment.

  \answer{no established term — The Ontological-Pragmatic Slide}
