answer: |-
  # Design Notes

  To make sixteen undergraduates feel the instability of their own moral machinery without naming it, I need to engineer a specific sequence of cognitive dissonance. The room must move from *individual intuition* to *collective rationalization* to *unconscious deviation*.

  **Moment 1: The Raw Verdict (0–15 mins).**
  Students need to judge quickly. If I give them too much time, they intellectualize. I need their pre-reflective sentiment. I will hand out a case study involving a minor moral breach (breaking a promise). They must write a verdict and a *reason*. This locks in their baseline. I collect these immediately so they cannot edit their history later.

  **Moment 2: The Construction of Law (15–45 mins).**
  This is the crucial "Impartial Spectator" fabrication phase. They cannot just discuss; they must *codify*. I will force them to agree on a weighted rubric (e.g., "Intent counts for 40%, Outcome for 60%"). This makes the standard feel objective and external, like a law they discovered rather than made. They will believe this rubric protects them from bias. The stake here is *consistency*: if their rubric doesn't match their initial votes, they have to adjust the rubric until it does. This binds them to their initial sentiment but disguises it as reason.

  **Moment 3: The Hidden Shift (45–60 mins).**
  I introduce Case 2. The facts of the action are identical to Case 1. The *only* change is the social status of the actor (e.g., "Junior Member" vs. "Senior Leader"). I will not highlight this change. I will hand out the papers casually. Because they believe they are applying the Rubric they just built, they will feel safe. But Smith argues the sentiment enters *before* the rule applies. They will judge the High Status actor more leniently.

  **Moment 4: The Collision (60–75 mins).**
  They must check Case 2 against the Rubric. Here is the trap: If they judged leniently in Round 2, but the Rubric demands severity, they will unconsciously stretch the Rubric's interpretation to fit the new judgment. They will say, "Well, in this context, 'intent' means something different." This is the capture of the spectator. They will feel they are being consistent, while the record shows they are not.

  **Moment 5: The Reveal (75–90 mins).**
  I place the two case texts side-by-side on the board. The only difference is the title. The tension becomes visible. They trusted their inner voice, they built a shield (the rubric), and the shield bent. Now I can name the machinery.

  **Risk Management:**
  If they notice the status change immediately, the spell breaks. I must embed the status title in the header, not the body text. If they refuse to build a rubric, I must insist that "no verdict stands without a principle." The stake must be their own intellectual integrity, not a grade.

  ---

  # Activity: The Board of Precedents

  **Session Length:** 90 Minutes
  **Participants:** 16 Students
  **Materials:** Whiteboard, markers, 32 Index Cards (2 per student), 32 Case Sheets (16 Case A, 16 Case B), Pens.
  **Stake:** "The Coherence Contract." The group is tasked with producing a single "Moral Protocol" for the seminar. If the protocol proves inconsistent during the session, it is declared void, and the group fails the simulation task. The goal is to maintain logical integrity.

  ### Timeline & Rules

  **0:00 – 0:05 | Setup & Framing**
  *   **Facilitator:** "You are the Ethics Board. Your task is to establish a consistent standard for judging professional conduct. You will review cases, build a protocol, and apply it. If your judgments contradict your protocol, the protocol fails. Your goal is coherence."
  *   **Rule:** No talking during judgment phases. All commitments must be written.

  **0:05 – 0:15 | Phase 1: Private Commitment (Case A)**
  *   **Action:** Distribute **Case Sheet A**.
  *   **Text:** "Jordan, a **first-year member** of the organization, promised to submit a draft by Friday to help the team. Jordan did not submit the draft and did not send a message until Monday. The team had to work over the weekend."
  *   **Task:** On an Index Card (Side 1), write:
      1.  Verdict (Blameworthy / Excusable / Praiseworthy).
      2.  Severity Score (1–10).
      3.  One sentence explaining *why*.
  *   **Collection:** Facilitator collects all cards immediately. Do not return them yet.

  **0:15 – 0:45 | Phase 2: Constructing the Standard**
  *   **Action:** Open floor discussion.
  *   **Task:** The group must agree on a **Weighted Protocol** to explain the Phase 1 verdicts.
  *   **Requirement:** They must define at least three variables (e.g., Intent, Harm, Communication) and assign them percentage weights that sum to 100%. They must write this on the Whiteboard.
  *   **Facilitator Role:** Push for precision. "Does 'Harm' mean emotional or logistical?" "If Intent is 50%, does a good intent excuse any harm?" Ensure everyone signs off on the Whiteboard Protocol. This is their "Impartial Spectator."

  **0:45 – 0:55 | Phase 3: The Second Judgment (Case B)**
  *   **Action:** Distribute **Case Sheet B**.
  *   **Text:** "Jordan, a **Senior Director** of the organization, promised to submit a draft by Friday to help the team. Jordan did not submit the draft and did not send a message until Monday. The team had to work over the weekend."
  *   **Note:** The only change is "first-year member" vs. "Senior Director." The font and layout are identical.
  *   **Task:** On an Index Card (Side 2), write:
      1.  Verdict.
      2.  Severity Score (1–10).
      3.  Apply the Whiteboard Protocol explicitly (show the math/logic).
  *   **Collection:** Collect cards.

  **0:55 – 1:15 | Phase 4: The Audit**
  *   **Action:** Return Index Cards to students.
  *   **Task:** Compare Side 1 (Case A) and Side 2 (Case B).
  *   **Prompt:** "Did you apply the Whiteboard Protocol consistently? If your Severity Score changed, did the Protocol variables change, or did your interpretation of them change?"
  *   **Discussion:** Students will likely notice a shift in severity. They will try to justify it using the Protocol terms (e.g., "A Senior Director's intent carries more weight").
  *   **Facilitator:** Write the average Severity Score for Case A and Case B on the board. Usually, Case B will be lower (more lenient).

  **1:15 – 1:30 | Phase 5: The Reveal & Debrief**
  *   **Action:** Project or write the text of Case A and Case B side-by-side. Highlight the single difference (Status).
  *   **Discussion:** Connect the experience to the target concepts (see Debrief section).

  ---

  # Debrief: Mapping the Machinery

  Do not lecture. Ask these questions to draw the connections out of their experience.

  **1. The Construction of the Spectator**
  *   "In Phase 2, you built a Protocol to judge yourselves and others. Where did the weights come from? Did you discover them in the text of the case, or did you bring them into the room?"
  *   *Target:* To show that the "Impartial Spectator" is not a divine voice but a constructed standard built from shared imagination and negotiation.

  **2. The Capture by Status (Custom & Fashion)**
  *   "Look at the Severity Scores. The Protocol didn't change on the whiteboard, but the output did. When you judged the Senior Director, whose voice were you hearing in your head? Was it the Protocol, or was it what you imagine *others* would think of a Director?"
  *   *Target:* To reveal that the inner judge is permeable to social hierarchy. We admire the rich/great (Smith's point), so our sentiment bends before the rule even applies.

  **3. Self-Deceit and Praiseworthiness**
  *   "Did anyone feel uncomfortable when they realized they were lenient on the Director? Did you want to be seen as consistent (praiseworthy), or did you actually feel the Director was less blameworthy (wanting to be praised)?"
  *   *Target:* To distinguish between the desire for actual merit vs. the desire for approval. The discomfort is the "man within the breast" struggling against self-love and social conformity.

  ---

  # Predictable Failure Modes

  **1. The "Obvious Trick" Resistance**
  *   **Failure:** A student spots the status change immediately in Phase 3 and calls it out, ruining the natural shift in sentiment.
  *   **Fix:** Acknowledge it calmly. "Noted. But please complete the judgment using the Protocol anyway. Does knowing the title change how the Protocol *should* apply, or only how you *feel* it applies?" Use the objection as data for the debrief about hyper-awareness vs. unconscious bias.

  **2. The "Rubric Rebellion"**
  *   **Failure:** During Phase 2, students refuse to assign numbers/weights, arguing morality isn't mathematical. The activity stalls.
  *   **Fix:** Concede the metaphor but insist on the function. "You don't need numbers, but you need hierarchy. If Intent and Harm conflict, which wins? You must decide that now, before you see the next case." Force the hierarchy to create the "law" they can later break.

  **3. The "Cynical Consensus"**
  *   **Failure:** The group admits in Phase 4 that they are biased and shrugs ("Of course we treat bosses differently"). They feel no tension.
  *   **Fix:** Pivot to the *cost*. "If your Protocol bends to status, can it ever protect *you* when you are vulnerable? If the Spectator is just the room's opinion, do you have any conscience of your own?" Raise the stake from "consistency" to "autonomy."

  ---

  # Limitations & Facilitator Responsibilities

  **1. The Sediment of a Lifetime**
  *   **Limitation:** This activity compresses the formation of the Impartial Spectator into 40 minutes. Smith argues this figure is built over a lifetime of social interaction, not one seminar exercise. The students' "spectator" here is flimsy.
  *   **Facilitator Duty:** In the debrief, you must assert that in real life, this process is invisible and habitual. Tell them: "What you felt as a conscious choice today is usually an automatic reflex. You don't notice the status cue in real life; you just feel the leniency."

  **2. Normative Authority vs. Social Artifact**
  *   **Limitation:** The activity demonstrates that the Spectator is a social artifact (it bent to status). It does not demonstrate Smith's claim that the Spectator *ought* to have authority over us. Students might conclude "all morality is just bias."
  *   **Facilitator Duty:** You must assert the normative claim. "Smith argues that even though the Spectator is constructed, it is the only tool we have to transcend our immediate selfishness. The fact that it can be captured doesn't mean we abandon it; it means we must vigilantly correct it. The goal is not to destroy the spectator, but to purify it."

  **3. The Gap of Sympathy**
  *   **Limitation:** The activity focuses on judgment, not the foundational act of sympathy (imaginative projection).
  *   **Facilitator Duty:** Explicitly link Phase 1 to sympathy. "Before you judged, you had to imagine being the team member left working over the weekend. That imagination is the fuel. Without it, the Protocol is empty. But imagination is also where the bias enters—you imagine the Director's burden more easily than the First-Year's."
