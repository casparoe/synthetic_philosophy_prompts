      *   **Problem:** Hit a wall. The wall *is* the story.
      *   **Core Conflict:**
          *   *Demographer:* Generations are statistical artifacts (APC problem: Age-Period-Cohort identification problem). Lines are arbitrary. Math can't untangle them without assumptions.
          *   *Sociologist:* Generations are real social kinds (Mannheimian). Shared formative experiences create a "we." Regression analysis is the wrong tool.
      *   **User's Specific Inputs to Fold In:**
          *   *Input 1 (Roommate/Historical Demography):* "Generation" has double duty (genealogical vs. cohort). These used to align better (people had kids at similar ages). Now they diverge (wildly different childbearing ages). "Next generation" is ambiguous.
          *   *Input 2 (Reporting/Observation):* Labels affect behavior (looping effect). 22-year-olds treat "my generation" like a club/organization. The name gives them something to be.
      *   **Questions to Answer:** Compare the two views. Which describes the world better? Can both be held without waffling? Is the self-fulfilling aspect proof of reality or fiction?
      *   **Tone/Style:** American English. No reading lists/citations. Just the argument. Deep, nuanced, journalistic/essayistic style suitable for a feature writer.

  2.  **Deconstruct the Core Conflict (The "Wall"):**
      *   *The Demographer's View (The Hard Science):* This is the "Age-Period-Cohort (APC) Identification Problem." If you know birth year (cohort), you know age (given a date) and period (given a date). $C = P - A$. Perfect collinearity. You can't statistically separate them without arbitrary constraints. Therefore, claiming "Gen Z is anxious because they are Gen Z" is mathematically suspect; they might just be anxious because they are 20 (Age) or because the economy sucks right now (Period).
      *   *The Sociologist's View (The Soft Science/Humanities):* Karl Mannheim's "The Problem of Generations." A cohort becomes a generation only when it achieves "generational consciousness." It's a cultural unit, not just a demographic bucket. It's about shared location in historical time.
      *   *The Synthesis:* The tension isn't a bug; it's the feature. The *failure* of the math is what allows the *success* of the myth.

  3.  **Address Input 1 (Genealogical vs. Cohort):**
