      *   **The Demographer's Trap (APC):** Explain the math simply. Why the lines are arbitrary. Why "cause" is impossible to pin down.
      *   **The Sociologist's Counter (Mannheim):** Explain the "shared consciousness." Why math misses the point of human experience.
      *   **The Double Duty (Genealogy vs. Cohort):** Integrate the roommate's point. How the confusion of terms fuels the fire. The loss of synchronicity in childbearing.
      *   **The Self-Fulfilling Prophecy (The Looping Effect):** Integrate the 22-year-old quotes. The "money" analogy. Is it fiction or reality? It's a *performative* reality.
