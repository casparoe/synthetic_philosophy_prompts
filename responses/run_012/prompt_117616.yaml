          *   License Far Future? Depends on growth assumptions.
          *   Centrality: Stretch.
          *   Support Friend? No, usually argues for *lower* discounting if future is poorer.

      *   *Reading 5: The Possession/Entitlement Reading.*
          *   Claim: Ownership confers value independent of utility.
          *   Type: Other (Legal/Moral status).
          *   License Far Future? No.
          *   Centrality: Central (literal meaning).
          *   Support Friend? No.

  4.  **Refining the Table Content:**
      *   Need to ensure the "Does it license..." column is precise regarding *far-future climate damages*.
