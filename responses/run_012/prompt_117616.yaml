      *(Self-Correction during drafting the table)*: I need to be careful with the "Does it license..." column. For uncertainty, it licenses discounting *if* the probability of the benefit decreases over time. For climate damages, the "benefit" is avoided damage. If we are uncertain whether the damage will happen, we discount the *avoidance*. But usually, climate risk *increases* with time. So uncertainty about *catastrophe* might argue for *less* discounting (precautionary). However, the proverb is about the *benefit* (the bird). If the bird is "avoided damage," and we aren't sure it will be avoided, we discount. Let's stick to the standard interpretation: Uncertainty about the future good justifies discounting its present value.

