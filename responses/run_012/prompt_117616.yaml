  **Bottom Line**
  You should press him on the **Risk/Uncertainty** reading, forcing him to admit that the proverb justifies discounting only because the future bird might *not exist*, not because it exists *later*. If he insists the proverb supports **Pure Time Preference**, point out that the proverb contrasts *security* with *potential*, whereas his argument contrasts *now* with *later*, which are logically distinct categories.

