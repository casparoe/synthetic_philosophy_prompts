  | **Diminishing Marginal Utility** | Having the bird now satisfies an urgent need; future birds matter less if we are already satiated or richer. | **Diminishing Marginal Utility** (consumption elasticity) | **Depends**, on whether future generations are assumed to be richer than us (if richer, yes; if poorer, no). | **Stretch** (The proverb implies the *same* bird is less valuable, not that we have more birds later). | **No**, this relies on empirical assumptions about future wealth, not a general ethical rule. |
