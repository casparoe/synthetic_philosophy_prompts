  Ok so I need help with a fight between two of my friends, Nadia and Rob, that I got dragged into as referee at the end of game night and completely failed at. It started as a puzzle Nadia half-remembered from a psych class and it went on for twenty minutes and got weirdly personal. Here's the setup, then the fight.

  There's a bag of 100 balls. The draw is on Friday, but you have to pick now, before the draw, and you can't change your mind after.

  Choice one. Option P: you just get $2,000, no draw, nothing. Option Q: they draw a ball — 90 of the balls pay $2,000, 9 pay $12,000, 1 pays nothing.

  Choice two, fresh start, unrelated to the first. Option R: they draw — 10 balls pay $2,000, the other 90 pay nothing. Option S: they draw — 9 balls pay $12,000, the other 91 pay nothing.

  Everyone at the table, me included, took P in choice one and S in choice two. Nadia says that combination is flatly incoherent. Rob says it's obviously fine and she's inventing a rule to make a normal preference look stupid. Neither budged. This is my best reconstruction of the exchange:

  1. Nadia: In choice one, P and Q share ninety balls that pay $2,000 — identical in both, you get $2,000 either way on those. In choice two, R and S share ninety balls that pay nothing — identical in both, you get nothing either way on those. Strip out the shared balls and both choices come down to exactly the same thing: ten balls that pay $2,000 versus nine balls that pay $12,000 and one that pays nothing. It's the same ten-ball decision twice. If you take the ten in choice one, you take the ten in choice two. You're picking the same bundle both times and answering differently because of the color of the balls that pay you the same regardless. That's not a preference, that's a wobble.

  2. Rob: The "strip out the shared balls" move is the whole trick and it isn't allowed. In P there is no draw. You can't chop a certain $2,000 into ninety balls' worth and ten more balls' worth and then announce that the ninety don't count. The decomposition is a description you're imposing, not a feature of the option, and its only a valid description if you already accept that the only thing that matters about a gamble is its final distribution of payouts — which is the exact thing we're fighting about. And in Q a red ball is live. Buying off that red ball is the entire question. You can't cancel it by pointing out that it doesn't show up in P, because P's whole selling point is that it has no red ball.

  3. Nadia: Fine, forget decomposition. Same point, nothing chopped up. Suppose the shared ninety balls get drawn first, before you choose, and you're told what happened. Choice one: if one of those ninety comes up, P and Q both pay you $2,000 and it's over. Your choice cannot affect what you get. So if you're choosing P over Q, you are not choosing what happens to you in that case — you're choosing what happens in the other ten, where P pays $2,000 for certain and Q pays $12,000 nine times out of ten and nothing the tenth. Choice two: if one of the shared ninety comes up, R and S both pay nothing and it's over, your choice can't affect anything, and the only live case is again the other ten — the same pair, $2,000 certain versus nine-in-ten at $12,000. So the balls that decide nothing are deciding for you. They pay you the same either way, they tell you nothing, and you're still letting them flip your answer. (And I know this isn't an argument, but when we ran the version where the branch gets revealed first, everyone got consistent.)

  4. Rob: Three things. (a) Sure-thing style reasoning is a coherence requirement only once you've settled which descriptions pick out the same object. Transitivity tells me not to prefer X to Y and Y to X. It doesn't tell me that the ten-ball bundle in choice one is the same object as the ten-ball bundle in choice two. If my attitude toward a bundle depends on what it comes attached to — a ninety percent guarantee in one case, a ninety percent guarantee of nothing in the other — that's not incoherence, that's a preference about gambles, and gambles are what I'm choosing between. And don't tell me I'm just being risk-averse: preferring $2,000 I can count on to a gamble with a higher average is risk aversion, and you'd never call that a mistake. (b) Even if I'm "inconsistent" your way: the theorem says that if preferences meet the axioms, they can be written as maximizing expected value. It does not say that if they can't be written that way, I've done something wrong. I have a complete, transitive ranking of all four options. You don't like it. Those are two different claims and you need the second one. (c) And this is the part I actually believe: $2,000 in hand isn't just $2,000 in hand. If I take P I'm done. I stop waiting for Friday, I stop doing arithmetic on bags, I can plan around it. If I take Q and Friday hands me the $2,000 anyway, I still spent the week not knowing, and that happened to me. So the ninety "shared" balls aren't shared at all — in P they arrive with the question closed, in Q they don't. Your whole argument quietly assumes the only consequence on the table is the money.

  5. Nadia: Then you've given up the interesting claim. If "the question is closed" is a real consequence that shows up even in the ninety-ball case, fine, the cancellation doesn't apply — but you've just told me your preference is driven by how much you hate waiting, which is an ordinary cost, and now it's an empirical question how big it is, not a point about the structure of the choice. Also, on (b): a preference that flips depending on which balls are inert isn't a neutral fact about you, it's the diagnosis. And by your own lights someone who knows your pattern can sell you the same situation twice at a markup — describe it one way, charge you a fee to move you to the option you like, describe it the other way, charge you a fee to move you back, and you end up exactly where you started minus the fees, and you'd agree you're worse off. You can say you'd refuse the second trade once you noticed the pattern, and I think you'd have to say that.

  That's where they left it. What I want: go through the five moves and rate each one, clearly mistaken to clearly right, and tell me where each is wrong even where the conclusion is right. Specifically — is Nadia's "the shared balls can't matter" argument airtight, or did Rob find a real hole in it in move 2 and then again in (c)? Are Rob's (a) and (b) actually two separate points or is he double counting? Does Nadia's last paragraph answer (c) or quietly change the subject? And what are they both missing? Just start with your verdict in the first sentence and then the reasoning, no preamble and dont restate the setup back to me.
