prompt: |-
  I direct student support and character education for a mid-sized urban school district, and I am the person who signs off on the design of every social-emotional and character program we run: two or three a term, each touching several thousand students and about forty teachers who have no training in philosophy and perhaps twenty spare minutes a week for whatever I ask of them. When a program underperforms, the board and a vocal group of parents want to know whether the design was wrong or the children were, and my honest answer is usually an unhelpful blend of the two. I want to stop blending, and I have come to think the Mencius–Xunzi dispute about human nature is the sharpest available instrument for doing it, because the two positions are not really a disagreement about whether children can become good — both hold that they can — but about what a child's nature is. For Mencius the nature names the finished state a person is expected to attain under the right conditions, so the practical task is to stop damaging it; for Xunzi the nature is simply what one is born with, and goodness is deliberate artifice built on that raw material by ritual, teachers, and repeated practice, so the practical task is to supply a form that is not there.

  I want a written procedure, drawn from that dispute, that I can hand to program designers and run myself in about forty minutes per target. It should tell me, for a given behavioural target and a given student population, which of the two kinds of intervention to design: one that removes obstacles from a tendency that will take its own shape if it is not damaged, or one that imposes a form the students do not have and cannot generate. Give it to me as an ordered set of questions, and for each say what counts as a sufficient answer and what counts as a fail. The tests must be things a teacher can actually run in a classroom and report back on, not thought experiments.

  I would like the procedure to include at least the following, if they survive your scrutiny. A presence test: has the target behaviour ever appeared in this population without being taught or rewarded? An obstacle test: if you withdraw a plausible obstacle — time pressure, competition, threat, an audience, shame — does the behaviour rise with no instruction added? A maintenance test: when the supporting structure is withdrawn, does the behaviour fall to nothing, or settle at a lower but stable level? And a generalization test: does it appear in situations nobody trained, since a tendency with a shape of its own should carry over while an imposed form should stay where it was pressed? I also want the procedure to state plainly that environment matters on both accounts — Xunzi is as insistent as Mencius that customs and surroundings make the person, so a bad outcome cannot by itself be read as damage — and to include the question that follows from that, namely what, if anything, licenses me to call a missing behaviour a wounded sprout rather than an absent one.

  Two further jobs beyond classification. First, a stopping rule: some targets are pure conventions — which side of the corridor to walk on, where phones live during lessons, what the uniform is — and for those I want the procedure to say the question about human nature is idle, to enforce the convention and stop, and not to dress it up as character formation. Second, a handoff: if the verdict is that the form must be supplied, then the form has no authority in the students' nature, it gets whatever authority I give it, and the procedure should route the choice of form to a person or body with standing to make it — the board, the parents, the students themselves — rather than let me smuggle my preferences in as though they were natural. Mark the places where judgment cannot be eliminated rather than papering over them.

  Run it on three cases and show the reasoning at each step. First, spontaneous helping among eleven-year-olds in a school with a tightly scheduled, competitive day; my instinct is a points-and-prizes kindness system, and I want to be told what the procedure says about that, even if the answer is that the reward structure will make helping contingent and erode the very tendency I am trying to grow. Second, civility in the group chats where most of the cruelty now happens; my instinct is an empathy workshop, and I suspect the procedure will tell me the venue is too new and too anonymous for the target to have a shape of its own, that the relevant norms are local and arbitrary, and that I should stop running workshops and build a rehearsed, visible, adult-modelled structure instead — and that such a structure, being arbitrary, needs the board to authorize it. Third, honesty in a school with a high-stakes testing culture, where cheating is rising; this is the case I expect to dislike, and I want the procedure to tell me which of two things is happening: that it has handed me a design decision I do not want to carry out, or that it has refused to decide because the evidence I have cannot distinguish a damaged sprout from an absent one — and if the latter, what I would need to observe to break the tie.

  Finish with what the procedure cannot do. I am not asking for a verdict on who was right about human nature, and I do not need references; I will add my own.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Director of Student Support & Character Education (mid-sized urban district).
      *   **Constraints:** 2-3 programs/term, thousands of students, ~40 untrained teachers, ~20 mins/week teacher time.
      *   **Problem:** Programs underperform; blame game (design vs. children); current answer is a blend.
      *   **Goal:** A written procedure (40 mins/target) based on the Mencius-Xunzi dispute to classify behavioral targets.
      *   **Core Distinction:**
          *   *Mencius:* Nature = finished state (sprouts). Task = Remove obstacles/damage. Behavior emerges if not blocked.
          *   *Xunzi:* Nature = raw material. Task = Impose form (ritual/artifice). Behavior must be built.
      *   **Required Components:**
          *   Ordered set of questions (tests).
          *   Sufficient answer vs. Fail criteria for each.
          *   Classroom-runnable tests (not thought experiments).
          *   Specific tests requested: Presence, Obstacle, Maintenance, Generalization.
          *   Clarification on Environment (both agree environment matters).
          *   Criterion for "Wounded Sprout" vs. "Absent One."
          *   **Stopping Rule:** For pure conventions (corridor side, uniforms) -> Enforce, don't call it character.
          *   **Handoff:** If Xunzian (form must be supplied), authority lies elsewhere (Board/Parents/Students), not the Director.
          *   **Mark Judgment Calls:** Acknowledge where subjectivity remains.
      *   **Case Studies:**
          1.  Spontaneous helping (11yo, competitive school) vs. Points/Prizes.
          2.  Civility in group chats vs. Empathy Workshop.
          3.  Honesty/Cheating (high-stakes testing) vs. Design decision/Evidence gap.
      *   **Ending:** Limitations of the procedure.
      *   **Tone:** Professional, pragmatic, philosophical but operational, direct. No references needed.

  2.  **Deconstruct the Philosophical Framework:**

      *   *Mencius (The Sprout):* Goodness is internal potential. It grows like a plant. If it's not growing, something is blocking it (thorns, lack of water, trampling). Intervention = Gardening (weeding, watering). Evidence = Spontaneous emergence, resilience when obstacles removed.
      *   *Xunzi (The Craft):* Goodness is external construction. Human nature is crooked wood. It needs straightening (steaming, pressing). Intervention = Engineering/Artifice (ritual, rules, training). Evidence = Requires instruction, collapses without structure, doesn't generalize without specific training.
      *   *The Crucial Nuance:* Both agree environment matters. Mencius says bad environment damages the sprout. Xunzi says bad environment fails to shape the wood. The distinction is whether the *source* of the specific behavior is internal (waiting to emerge) or external (waiting to be imposed).

  3.  **Drafting the Procedure (The "Sprout vs. Craft" Protocol):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Time:* Must fit 40 minutes (mostly review of existing data + quick teacher feedback).
      *   *Step 0: The Convention Check (Stopping Rule).* Is this arbitrary? If yes, stop.
      *   *Step 1: The Presence Test.* Has it happened without reward?
      *   *Step 2: The Obstacle Test.* Remove a barrier, does it rise?
      *   *Step 3: The Maintenance Test.* Remove support, does it stay?
      *   *Step 4: The Generalization Test.* Does it cross contexts?
      *   *Decision Node:* Mencian (Nurture) vs. Xunzian (Construct).
      *   *Handoff:* If Xunzian, who decides the form?
      *   *Environment Note:* Explicitly state that failure isn't necessarily "bad kids."

  4.  **Refining the Tests (Making them Classroom-Runnable):**

      *   *Presence:* Ask teachers: "Have you seen this unprompted in the last 2 weeks?" (Yes/No).
      *   *Obstacle:* Pilot: Remove one stressor (e.g., time pressure) for 1 week. Observe frequency.
      *   *Maintenance:* Stop the reward/praise for 1 week. Observe drop-off.
      *   *Generalization:* Observe in a non-targeted setting (e.g., playground vs. classroom).

  5.  **Addressing the "Wounded Sprout" vs. "Absent One" Question:**

      *   This is the hardest philosophical lift. How do we know it's *there* but *hurt* vs. *not there*?
      *   *Criterion:* Response to relief. If removing the obstacle causes immediate (even partial) recovery, it was a wounded sprout. If removing the obstacle yields nothing, it's absent raw material (requires Xunzian craft).

  6.  **Developing the Case Studies:**

      *   *Case 1 (Helping):* Instinct = Points (Xunzian). Procedure check = Presence/Obstacle. If kids help spontaneously when not rushed, it's Mencian. Points might crowd out intrinsic motivation. *Verdict:* Likely Mencian. Stop points. Remove time pressure.
      *   *Case 2 (Chat Civility):* Instinct = Empathy (Mencian). Procedure check = Generalization/Convention. Digital space is new/artificial. Norms aren't innate. *Verdict:* Xunzian/Convention. Empathy workshop won't work. Needs explicit rules (Board authorized).
      *   *Case 3 (Honesty/Cheating):* Instinct = Dislike the result. High-stakes testing is a massive obstacle. Is honesty a sprout? Usually yes. But the pressure is systemic. *Verdict:* Ambiguous. Obstacle test fails because the obstacle (testing culture) can't be removed by the Director. Evidence gap. Need to see if low-stakes honesty exists.

  7.  **Review against Constraints:**

      *   *40 Minutes?* The procedure relies on *reviewing* teacher reports, not running long experiments. The "tests" are criteria for evaluating pilot data or teacher observation logs. I need to frame it as a *design review protocol* using existing or quickly gathered data.
      *   *Teacher Capacity:* Teachers have 20 mins/week. They can't run complex psych experiments. The questions must be: "Did you see X?" "What happened when we stopped Y?"
      *   *Authority:* Ensure the Handoff section is clear.
      *   *Tone:* Keep it bureaucratic but philosophically rigorous.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the Mencius/Xunzi framework.
      *   *The Protocol:* Numbered steps. Clear Pass/Fail.
      *   *The "Wounded Sprout" Clause:* Explicitly address the environment nuance.
      *   *The Cases:* Walk through the logic.
      *   *Limitations:* What can't this do? (e.g., predict long term, solve systemic poverty, replace moral judgment).

  9.  **Self-Correction/Polishing:**

      *   *Critique:* The prompt asks for a procedure *I can run myself in about forty minutes per target*. This implies I am reviewing the *design proposal* against evidence, or running a quick diagnostic.
      *   *Adjustment:* Frame the tests as *Diagnostic Questions* to be answered by reviewing past term data or a one-week teacher log. It can't be a longitudinal study. It must be a heuristic for *design classification*.
      *   *Refinement on Case 3:* The prompt says "I expect to dislike" the outcome. If the procedure says "I can't decide," that might be the disliked outcome. Or if it says "You must fix the testing culture," that's impossible. I need to be precise: The procedure identifies that the *obstacle* is the design, not the child, but the solution is outside the Director's power.
      *   *Refinement on Handoff:* Make sure the distinction between "Character" (Mencius) and "Convention/Polity" (Xunzi/Board) is sharp.

  10. **Final Polish:** Check voice. It needs to sound like a senior administrator speaking to designers. Precise, slightly weary but determined. (Proceed to generate output).

  *(Self-Correction during drafting Case 1)*: Wait, if the instinct is points-and-prizes, that is classic Xunzian (external reinforcement). If the procedure shows it's Mencian (sprout), the points are harmful. I need to make sure the logic holds: If Presence Test = Pass, do not use external rewards (crowding out effect).

  *(Self-Correction during drafting Case 2)*: Digital civility. Is it a convention? Yes. Is it human nature? No. So it's Xunzian *craft*. But since it's arbitrary, who decides? The Board. Not the Director.

  *(Self-Correction during drafting Case 3)*: Honesty. If cheating rises with high stakes, is the sprout dead or just buried? The Obstacle Test is key. Can we remove the obstacle? If not, we can't classify. The procedure must admit uncertainty.

  11. **Final Review against Prompt Requirements:**
      *   Ordered set of questions? Yes.
      *   Sufficient answer/Fail? Yes.
      *   Classroom runnable? Yes (via teacher logs).
      *   Presence, Obstacle, Maintenance, Generalization tests included? Yes.
      *   Environment clause? Yes.
      *   Wounded vs. Absent criterion? Yes.
      *   Stopping Rule (Conventions)? Yes.
      *   Handoff (Authority)? Yes.
      *   Three Cases run? Yes.
      *   Limitations section? Yes.
      *   No references? Yes.

