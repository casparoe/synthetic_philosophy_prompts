answer: |-
  # The Sprout and Craft Protocol (SCP)
  **For:** Program Designers, Student Support Directors
  **Time Cost:** 40 Minutes per Behavioral Target
  **Philosophical Basis:** Mencius (Nature as Sprout) vs. Xunzi (Nature as Raw Material)

  ## Preamble: The Environmental Clause
  Both Mencius and Xunzi agree that environment determines outcome. A failed program does not prove "bad children." It proves a mismatch between the *source of the behavior* and the *method of intervention*.
  *   **Mencius:** Bad environment damages the sprout. Good design removes the damage.
  *   **Xunzi:** Bad environment fails to shape the wood. Good design supplies the mold.

  **The Wounded Sprout Criterion:** You may only classify a missing behavior as a "wounded sprout" (Mencian) if, upon the removal of a plausible obstacle (shame, time pressure, threat), the behavior reappears *without* new instruction. If the behavior remains absent after obstacles are cleared, it is treated as "absent raw material" (Xunzian) requiring construction.

  ---

  ## Part I: The Stopping Rule (Conventions)
  *Before assessing human nature, assess arbitrariness.*

  **Question 1:** Is the target behavior a coordinate convention (e.g., which side of the hall to walk, uniform standards, device storage)?
  *   **Sufficient Answer:** Yes. The behavior has no moral weight outside of social coordination.
  *   **Fail:** No. The behavior implies moral regard (honesty, kindness, courage).
  *   **Action:** If **Yes**, stop. Do not design a character program. Issue a policy. Enforce via administration. Do not claim this builds "character."
  *   **Action:** If **No**, proceed to Part II.

  ---

  ## Part II: The Diagnostic Tests
  *These questions are to be answered by reviewing teacher logs from the current term or a one-week observation pilot. Teachers need only record frequency, not analyze cause.*

  ### Test 1: The Presence Test
  **Question:** Has the target behavior occurred in this population in the last 30 days without being taught, prompted, or rewarded?
  *   **Sufficient Answer (Mencian Signal):** Yes. At least 3 distinct instances observed by different staff where the student acted unprompted.
  *   **Fail (Xunzian Signal):** No. The behavior is never seen unless explicitly demanded.
  *   **Judgment Call:** Distinguish between "compliance" (doing it because told) and "initiative" (doing it because the situation invited it).

  ### Test 2: The Obstacle Test
  **Question:** If we temporarily withdraw one plausible obstacle (e.g., remove time pressure, remove public scoring, ensure anonymity), does the frequency of the behavior rise without adding instruction?
  *   **Sufficient Answer (Mencian Signal):** Yes. Frequency increases or stabilizes when the stressor is lowered.
  *   **Fail (Xunzian Signal):** No. Frequency remains zero or drops, indicating the behavior requires active scaffolding, not just relief.
  *   **Constraint:** The obstacle removed must be within the school's control (e.g., schedule, not poverty).

  ### Test 3: The Maintenance Test
  **Question:** When a supporting structure (reward, reminder, adult supervision) is withdrawn for 5 days, does the behavior collapse to zero, or settle at a lower but stable level?
  *   **Sufficient Answer (Mencian Signal):** Settles at a stable level. The behavior has internal traction.
  *   **Fail (Xunzian Signal):** Collapses to zero. The behavior was entirely dependent on the external structure.

  ### Test 4: The Generalization Test
  **Question:** Does the behavior appear in a context nobody trained (e.g., playground vs. classroom, bus vs. hall)?
  *   **Sufficient Answer (Mencian Signal):** Yes. The tendency carries its own shape across contexts.
  *   **Fail (Xunzian Signal):** No. The behavior stays strictly within the trained context.

  ---

  ## Part III: The Verdict and Handoff

  ### Classification A: The Sprout (Mencian)
  *Criteria:* Passes Presence Test AND (Passes Obstacle Test OR Maintenance Test).
  *   **Design Mandate:** **Gardening.** Your program must focus on removing obstacles (shame, rush, competition). Do not use points, prizes, or public leaderboards. These will crowd out the intrinsic tendency.
  *   **Director's Role:** You may design this. You are protecting a natural resource.

  ### Classification B: The Craft (Xunzian)
  *Criteria:* Fails Presence Test AND (Fails Maintenance Test OR Fails Generalization Test).
  *   **Design Mandate:** **Engineering.** Your program must focus on ritual, repetition, and explicit form. The behavior does not exist in the child; it must be built.
  *   **Director's Role:** **STOP.** You do not have the authority to invent the form.
  *   **Handoff Rule:** Because the form is artificial, it derives authority only from the polity. You must route the choice of form to the Board, Parent Council, or Student Government. You may implement, but you may not choose *what* is implemented. Mark this in the design document: *"Arbitrary Form: Authority Source Required."*

  ### Classification C: The Undecidable
  *Criteria:* Mixed results (e.g., Presence Pass, but Maintenance Fail) OR Obstacle Test cannot be run (obstacle is systemic/state-mandated).
  *   **Action:** Do not launch a district-wide program. Run a controlled pilot. Acknowledge that you cannot distinguish a dead sprout from absent wood without changing the systemic variable.

  ---

  ## Case Studies

  ### Case 1: Spontaneous Helping (11-year-olds)
  **Context:** Tightly scheduled, competitive day.
  **Instinct:** Points-and-prizes kindness system.
  **Protocol Run:**
  1.  **Stopping Rule:** Is helping a convention? **No.** (Moral weight). Proceed.
  2.  **Presence Test:** Teachers report seeing students hold doors or share pencils without being asked, even in competitive weeks. **Pass (Mencian).**
  3.  **Obstacle Test:** Pilot: Remove "time to next class" pressure for one week (2 mins passing time). Helping incidents double. **Pass (Mencian).**
  4.  **Maintenance Test:** (Hypothetical) If rewards are stopped, do they stop helping? Given Presence Pass, likely they settle to baseline, not zero. **Pass (Mencian).**
  5.  **Verdict:** **Classification A (The Sprout).**
  6.  **Design Decision:** The instinct (points-and-prizes) is **rejected**.
      *   *Reasoning:* Helping is a sprout. The competitive schedule is the obstacle. Points convert intrinsic aid into transactional labor, eroding the sprout (crowding-out effect).
      *   *Action:* Cancel the rewards program. Redesign the schedule to reduce rush. Train teachers to notice and narrate helping, not reward it.

  ### Case 2: Civility in Group Chats
  **Context:** Cruelty in digital spaces.
  **Instinct:** Empathy workshop.
  **Protocol Run:**
  1.  **Stopping Rule:** Is digital civility a convention? **Yes/No Hybrid.** It is a new norm, not biological. Proceed with caution.
  2.  **Presence Test:** Has polite conflict resolution happened in chats without adult intervention? **Fail.** (Almost never).
  3.  **Generalization Test:** Does classroom politeness transfer to chats? **Fail.** (Context is too distinct).
  4.  **Maintenance Test:** If adult monitoring leaves the chat, does civility hold? **Fail.** (Collapses immediately).
  5.  **Verdict:** **Classification B (The Craft).**
  6.  **Design Decision:** The instinct (empathy workshop) is **rejected**.
      *   *Reasoning:* Empathy is internal; chat norms are external artifice. You cannot "sprout" a norm for a technology that didn't exist for most of human history. This is Xunzian ritual.
      *   *Handoff:* Because this is an arbitrary form (what counts as "civil" online is not natural law), the Director cannot decide.
      *   *Action:* Route to Board/Parents. Ask them to authorize the "Digital Code." Once authorized, enforce via ritual/rehearsal (e.g., draft messages before sending), not empathy training.

  ### Case 3: Honesty in High-Stakes Testing
  **Context:** Cheating rising due to testing culture.
  **Instinct:** Dislike the outcome.
  **Protocol Run:**
  1.  **Stopping Rule:** Is honesty a convention? **No.** Proceed.
  2.  **Presence Test:** Do students tell the truth in low-stakes settings? **Pass.** (Usually).
  3.  **Obstacle Test:** Can we remove the obstacle (high-stakes pressure)? **Fail (Procedural).** The Director cannot remove state testing requirements.
  4.  **Maintenance Test:** If we stop policing cheating, does honesty hold? **Fail.** (Cheating spikes).
  5.  **Verdict:** **Classification C (The Undecidable).**
  6.  **Design Decision:** The procedure **refuses to decide.**
      *   *Reasoning:* We have a "Wounded Sprout" scenario where the wound is systemic and beyond the Director's power to heal. We cannot distinguish if the sprout is dead (Xunzi) or just buried under concrete (Mencius) because we cannot remove the concrete.
      *   *Action:* Do not launch a "Honesty is the Best Policy" campaign. It insults the students' reality.
      *   *Required Observation to Break Tie:* You would need to observe honesty in a *different* high-pressure environment that the school controls (e.g., competitive sports). If they cheat there too, it suggests a cultural norm (Xunzian craft needed). If they play fair in sports but cheat on tests, the test specifically kills the sprout (Mencian obstacle).
      *   *Director's Burden:* You must report to the Board: "I cannot design a character solution for a structural problem. The evidence is inconclusive because the variable is outside my control."

  ---

  ## Limitations: What This Procedure Cannot Do

  1.  **It cannot solve poverty or trauma.** Both Mencius and Xunzi assume a baseline of stability. If a child is in survival mode, the "sprout" is dormant and the "craft" is impossible. This protocol classifies pedagogical approach, not social work needs.
  2.  **It cannot eliminate your judgment.** The distinction between "convention" and "moral truth" (Part I) is itself a philosophical judgment. You must own that.
  3.  **It cannot guarantee success.** A sprout can be watered and still die. A craft can be built and still collapse. This protocol prevents *category errors* (treating craft as sprout), not *execution errors*.
  4.  **It cannot authorize the Xunzian form.** This is the feature, not the bug. If the behavior is artificial, you are a bureaucrat, not a moralist. The procedure forces you to admit when you are imposing values rather than nurturing them.
  5.  **It requires teacher honesty.** If teachers fear reporting that a behavior "never happens unprompted," the Presence Test fails. You need psychological safety in your staff to get accurate data.

  **Final Instruction:** When a program fails, use this protocol to write the post-mortem. If you classified it as a Sprout and it died, you failed to remove the obstacle. If you classified it as Craft and it failed, you failed to build the structure, or the Board failed to authorize the form. Do not blame the children.
