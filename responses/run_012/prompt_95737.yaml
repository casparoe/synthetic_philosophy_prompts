  I'm hosting a philosopher on our department's interview series who argues that Bradley's regress -- the argument that any relation unifying a proposition's constituents would itself need a further relation to unify it with them -- is not a problem about the unity of propositions but about the unity of facts: on his view, propositions are unified by the act of judgment, whereas facts require a further unification that generates the regress. Draft eight to ten interview questions that press this distinction: at least one on why the regress looks different for propositions and facts, one on whether the distinction survives cases where a proposition is identified with a fact, and one on what the guest takes the real lesson of the regress to be. For each question, include a follow-up keyed to the answer he's most likely to give. End with a brief note stating how confident you are in your characterization of his position and which point you're least sure about.
