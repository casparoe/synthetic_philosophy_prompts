  2.  **Deconstruct the Guest's Position:**
      *   *Standard Bradley's Regress:* If $a$ is $F$, we need a relation $R$ to tie $a$ and $F$. But then we need $R'$ to tie $R$ to $a$ and $F$, ad infinitum. Conclusion: Relations can't unify; reality is a One (Bradley) or we need a different ontology (Russell/Strawson/etc.).
      *   *Guest's Twist:*
