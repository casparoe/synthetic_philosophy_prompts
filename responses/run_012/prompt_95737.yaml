          *   *Follow-up:* Is the act non-relational?

      *   *Q5 (Mind-Independence):* Implications for realism.
          *   *Draft:* Does this mean facts don't exist?
          *   *Refinement:* Are you an anti-realist about facts? Or just a specific kind of realist?
