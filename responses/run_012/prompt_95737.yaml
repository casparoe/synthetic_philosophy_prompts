          *   **Facts:** Mind-independent worldly correlates. If we try to unify constituents *in the world* without the mind, we get the regress.
          *   **Implication:** The regress shows the impossibility of mind-independent facts (or at least complex ones) having intrinsic unity, but it doesn't threaten the coherence of propositional content.

  3.  **Drafting Questions (Iterative Process):**

      *   *Q1 (The Core Distinction):* Need to establish the baseline. Why separate propositions and facts?
