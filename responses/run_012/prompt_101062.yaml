  ### The System: Automated Feature Flag Guardrail

  Consider a **Feature Flag Rollback System** deployed in a continuous integration environment. This is a standard piece of infrastructure in modern software engineering. Its function is to monitor the error rate of a new software release immediately after deployment. If the error rate exceeds a specific threshold (e.g., 1% of requests fail), the system triggers a rollback to the previous stable version.

  The core logic is identical in both cases:
  1.  Ingest real-time metrics (HTTP 500s, latency spikes).
  2.  Compare against a threshold defined in a config file.
  3.  Execute a `rollback()` function if the threshold is breached.

  The code for the decision engine is the same. The difference lies entirely in how the `rollback()` function is wired into the operational loop.

  **Wiring A (The Tool):**
  The `rollback()` function does not touch production. Instead, it writes a high-priority ticket to an incident queue and pages the on-call engineer with a message: *"Error threshold breached. Recommended action: Rollback v2.1."* The engineer must log in, verify the metrics, and click a "Confirm Rollback" button.

  **Wiring B (The Agent):**
  The `rollback()` function calls the deployment API directly. It reverts the traffic immediately. It *then* pages the engineer with a message: *"Error threshold breached. Rollback v2.1 executed."* The engineer is notified for situational awareness and to handle post-mortem analysis.

  ### The Conceptual Issue: Validator vs. Exception Handler

  The distinction between tool and agent here is not about the intelligence of the code (it is a simple threshold check in both cases) nor about the "goal" (both aim to minimize downtime). The distinction is about the **mode of human engagement** required by the wiring.

  In **Wiring A (Tool)**, the human acts as a **Validator**. The system presents a claim ("This release is bad"), and the human must verify it before the state of the world changes. The default state of the system is *inaction*. The human provides the energy for the action.

  In **Wiring B (Agent)**, the human acts as an **Exception Handler**. The system changes the state of the world autonomously. The human's role is to monitor for *false positives* (cases where the system rolled back a good release due to a metric spike). The default state of the system is *action*. The human provides the energy to *stop* or *reverse* the action.

  ### Practical Verdicts

  This shift in wiring leads to divergent practical verdicts regarding safety and responsibility, despite the code being identical.

  1.  **Liability for Harm:**
      *   **Tool:** If a bad release stays live because the engineer was slow to click the button, the **engineer** is answerable. The system fulfilled its duty by raising the alarm; the human failed in their duty to validate.
      *   **Agent:** If a good release is rolled back unnecessarily (a false positive), causing revenue loss, the **platform team** is answerable. The system took unilateral action that proved incorrect. The human cannot be blamed for failing to stop an action that happened faster than human reaction time.

  2.  **Safety Configuration:**
      *   **Tool:** You can tune the threshold to be highly sensitive. False positives are cheap (an engineer clicks "ignore").
      *   **Agent:** You must tune the threshold to be highly conservative. False positives are expensive (automatic downtime). The "safe" configuration for the code *changes* depending on the wiring, even though the logic is the same.

  ### The Feature: The Asymmetry of Inhibition

  The feature that carries the weight of this distinction is **The Asymmetry of Inhibition**.

  In cognitive science and control theory, it is significantly harder to *inhibit* an ongoing process than to *initiate* one.
  *   In the **Tool** configuration, the human initiates the action. They have full inhibitory control (they can simply choose not to click).
  *   In the **Agent** configuration, the system initiates the action. The human must *inhibit* the consequences after the fact (e.g., by re-deploying).

  This asymmetry is why the "Agent" description is the correct one for Wiring B, even if the code is a simple `if/then` statement. Agency is not defined by the complexity of the decision, but by **who holds the initiative**. When the system holds the initiative, the human is relegated to the role of a brake, not a driver.

  **Verdict:** Your suspicion is correct. "Tool" and "Agent" are not properties of the artifact but of the **division of labor**. In this case, the dividing line is whether the human is paid to **verify** (Tool) or to **monitor for exceptions** (Agent).

  **Carry-over Test:** To see if this verdict applies to a nearby case, ask: *If the system makes a mistake, is the human blamed for acting too slowly (Tool), or is the system blamed for acting too quickly (Agent)?* If the answer changes based on the wiring, you are looking at a shift in agency, not a shift in software capability.
