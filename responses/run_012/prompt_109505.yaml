prompt: |-
  I'm a retired field entomologist—spent most of my career on ant trail pheromones, of all things—and since I hung up my field boots I've gotten weirdly into philosphy of biology. I now volunteer as the science advisor for a small natural history museum and a podcast, which mostly means I'm the person who has to sign off on exhibit labels and scripts. Our team keeps writing things like the beetle's horn evolved to fight rivals, or the bird's alarm call evolved to warn its relatives, and I keep thinking about Gould and Lewontin's spandrels critique of adaptationism—the argument that not every trait is an adaptation; some are byproducts, developmental constraints, drift, exaptations, or just side effects of selection on something else. The director wants a new gallery called Built by Evolution, and I can already see every label turning into a just-so story. I have about twenty minutes per script, the writers have intro bio, and I can't send them off to read the literature.

  What I need from you is a decision procedure I can actually hand to a writer. Something like a flowchart in words: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a hard no on the phrase evolved for, and where it has to hand the decision back to me because it's a judgment call about evidence or rhetoric rather than a fact. I've been sketching a two-axis worksheet—current utility on one axis, historical origin on the other—and a four-box outcome: SELECTION, SIDE-EFFECT, CO-OPTED, UNKNOWN. Use that if it helps, but keep it usable by someone who last took biology in college. It should force a check for the usual alternatives—byproduct, exaptation, constraint, drift, correlated selection—before anyone is allowed to say evolved to. I also want it to say what language to use when the evidence is thin: currently functions as, is consistent with, may have been favored, we don't know, etc. And it should flag the places where judgment can't be eliminated, like how much comparative evidence is enough or whether a plausible developmental story counts as a byproduct explanation.

  Then run it on three cases so I can see how it behaves. First, a label claiming a male beetle's oversized horn evolved for fighting rival males. Second, a script claiming a bird's alarm call evolved to warn its relatives. Third, a label about my own old study system—ant trail pheromones—claiming the trail evolved to recruit nestmates. For each, show what the procedure says, what evidence would actually be needed, and what the final label language should be. Include at least one case where the procedure tells me I have to cut a claim I like—the ant one is probably going to sting—and be honest about what the procedure can't settle. No bibliography or citations, please; I need something operational, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case studies:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired field entomologist (ant pheromone specialist), now philosophy of biology enthusiast, science advisor for a museum/podcast.
      *   **Problem:** Museum writers keep producing adaptationist "just-so stories" (e.g., "trait X evolved *for* function Y"). The user wants to curb this Gould & Lewontin style without stifling communication.
      *   **Constraints:** Writers have intro bio, 20 mins per script, can't read primary lit. Needs a *decision procedure* (flowchart in words), usable by non-experts.
      *   **Specific Requirements:**
          *   Use the user's sketched two-axis worksheet (Current Utility vs. Historical Origin) leading to four boxes (SELECTION, SIDE-EFFECT, CO-OPTED, UNKNOWN).
          *   Force checks for alternatives (byproduct, exaptation, constraint, drift, correlated selection).
          *   Define specific language for different evidence levels (e.g., "currently functions as" vs. "evolved to").
          *   Flag areas requiring human judgment (evidence thresholds).
          *   Run the procedure on three cases: Beetle horn, Bird alarm call, Ant trail pheromones.
          *   Include at least one case where the procedure kills a claim the user likes (Ants).
          *   No bibliography/citations. Operational focus.

  2.  **Deconstruct the Core Concept (Adaptationism vs. Pluralism):**
      *   The core tension is between *current utility* (what does it do now?) and *historical origin* (why did it arise?).
      *   "Evolved to" implies historical selection for that specific function.
      *   "Functions to" implies current utility regardless of origin.
      *   The procedure needs to separate these clearly.

  3.  **Drafting the Decision Procedure (The "Adapter's Checklist"):**
      *   *Goal:* Make it step-by-step, binary where possible, but acknowledging gray areas.
      *   *Structure:*
          1.  Define the Trait & Function.
          2.  Check Current Utility (Does it actually do the thing?).
          3.  Check Historical Origin (Did selection drive it?).
          4.  Check Alternatives (Byproduct, Constraint, Drift, Exaptation).
          5.  Assign Language.
      *   *Integration of User's Matrix:* I need to explicitly map the output to the SELECTION, SIDE-EFFECT, CO-OPTED, UNKNOWN boxes.
      *   *Judgment Flags:* I need to insert "STOP - ADVISOR REVIEW" points where the writer can't decide.

  4.  **Refining the Language Guidelines:**
      *   High Confidence (Origin + Utility): "Evolved to," "Adaptation for."
      *   Medium Confidence (Utility known, Origin unclear): "Functions to," "Used for."
      *   Low Confidence/Alternative (Byproduct/Exaptation): "Byproduct of," "Co-opted for," "Incidental."
      *   Unknown: "May have," "Hypothesized to."

  5.  **Developing the Three Case Studies:**

      *   **Case 1: Beetle Horn (Fighting Rivals)**
          *   *Standard View:* Classic sexual selection.
          *   *Procedure Application:* High utility (wins fights). Good comparative evidence (larger horns in high-competition species). Costly trait (handicap).
          *   *Outcome:* Likely SELECTION.
          *   *Language:* "Evolved to" is probably safe, but "Functions in combat" is safer. Let's make it a "Green Light" but with nuance.

      *   **Case 2: Bird Alarm Call (Warning Relatives)**
          *   *Standard View:* Kin selection.
          *   *Complication:* Could be selfish (mobbing, confusing predator) or byproduct of arousal.
          *   *Procedure Application:* Utility is clear (others flee). Origin is harder. Is it *for* relatives or just *for* self-preservation via group defense?
          *   *Outcome:* Likely UNKNOWN or CO-OPTED depending on species. Let's make it a "Yellow Light" requiring nuance. "Functions to warn" is better than "Evolved to warn."

      *   **Case 3: Ant Trail Pheromones (Recruiting Nestmates)**
          *   *User's Twist:* This needs to be the one where the procedure kills the "Evolved to" claim, even though the user studied it.
          *   *Rationale:* Pheromones often start as metabolic byproducts or cuticular hydrocarbons (contact recognition) before becoming volatile trails. Or, the trail follows a path of least resistance (constraint). Or, it's a co-option of a death pheromone or sexual attractant.
          *   *Strategy:* To satisfy the prompt's requirement ("Include at least one case where the procedure tells me I have to cut a claim I like"), I need to construct the scenario such that the *evidence provided by the writers* is insufficient to distinguish origin from utility. Even if the user *knows* it's adaptive, the *writers* don't have the proof to say "evolved to."
          *   *Outcome:* SIDE-EFFECT or CO-OPTED or UNKNOWN. Let's go with UNKNOWN/CO-OPTED to force the language change. The label says "Evolved to recruit," the procedure says "Change to 'Used to recruit' or 'Functions to recruit'."
          *   *Philosophical Point:* Utility $\neq$ Origin. Just because it recruits now doesn't mean selection *started* there.

  6.  **Review and Refine:**
      *   *Tone:* Professional, respectful of the user's expertise, operational, concise.
      *   *Check:* Did I use the 2x2 matrix? Yes. Did I include judgment flags? Yes. Did I avoid citations? Yes.
      *   *Self-Correction on Ant Case:* I need to be careful not to imply ant pheromones *aren't* adaptations (they usually are). The point is about the *burden of proof* for the label. The label claims historical origin ("evolved to"). The writers only have current utility data. Therefore, the procedure must block the historical claim. This aligns with the user's Gould/Lewontin concern.

  7.  **Final Polish:**
      *   Ensure the "Flowchart in Words" is distinct and easy to copy/paste.
      *   Make sure the "Advisor Review" triggers are clear.
      *   Verify the language suggestions are precise.

  8.  *(Self-Correction during drafting)*: Wait, the prompt asks for a "two-axis worksheet... and a four-box outcome." I should explicitly structure the procedure around filling out that worksheet first, then making the decision.
      *   Axis 1: Current Utility (High/Low/None).
      *   Axis 2: Historical Evidence (Direct/Indirect/None).
      *   Actually, the user said "Current Utility on one axis, Historical Origin on the other."
      *   Let's refine the boxes:
          *   High Utility + High Historical Evidence = SELECTION (Evolved to).
          *   High Utility + Low/No Historical Evidence = UNKNOWN/CO-OPTED (Functions to).
          *   Low/No Utility + High Historical Evidence (rare) = DRIFT/VESTIGE.
          *   Low/No Utility + Low Historical Evidence = SIDE-EFFECT (Byproduct).
      *   Wait, the "Side-Effect" box usually implies Low Utility (or incidental utility) + Byproduct origin.
      *   Let's stick to the user's four boxes: SELECTION, SIDE-EFFECT, CO-OPTED, UNKNOWN.
      *   Mapping:
          *   SELECTION: Utility High, Origin = Selection for *this* function.
          *   CO-OPTED (Exaptation): Utility High, Origin = Selection for *other* function or non-adaptive.
          *   SIDE-EFFECT (Spandrel): Utility Low/Incidental, Origin = Byproduct of selection on trait Z.
          *   UNKNOWN: Evidence missing.

      *   Okay, I will build the procedure around sorting the trait into these boxes.

  9.  **Finalizing the Ant Case:**
      *   To make it sting: The writers claim "Evolved to recruit." The procedure forces "Functions to recruit" because we lack comparative phylogenetic data in the script to prove the *origin* was recruitment, not just chemical communication co-opted for trails. Even if it *is* an adaptation, the *label* shouldn't claim history without evidence. This respects the Gould/Lewontin critique rigorously.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is the operational decision procedure, designed for your writers, followed by the three test cases.

  ### The "Adaptation Claim" Decision Procedure

  **Goal:** Prevent "just-so stories" by separating what a trait *does* (Utility) from how it *arose* (Origin).
  **Time Required:** 10–15 minutes per claim.
  **Input:** A draft sentence claiming a trait "evolved to" do something.

  #### Step 1: Define the Trait and the Claimed Function
  Write down the specific physical trait and the specific function claimed in the script.
  *   *Trait:* (e.g., Beetle horn)
  *   *Claimed Function:* (e.g., Fighting rivals)
  *   *Current Draft Language:* (e.g., "Evolved to fight")

  #### Step 2: The Utility Check (Axis 1)
  **Question:** Does the trait currently perform this function reliably in the wild?
  *   **Yes:** There is observational or experimental data showing the trait does this job *now*.
  *   **No/Unsure:** We assume it does, but lack data, or it rarely does this.
  *   **Incidental:** It does this, but seemingly by accident (e.g., blood color makes you visible, but color wasn't selected for visibility).

  *   *If No/Unsure:* Move to **Box: UNKNOWN** or **SIDE-EFFECT**. Stop. Do not use "Evolved to."
  *   *If Yes:* Proceed to Step 3.

  #### Step 3: The Origin Check (Axis 2)
  **Question:** Do we have evidence that natural selection specifically shaped this trait *for* this function historically?
  *   **Strong Evidence:** Comparative phylogenetics (trait appears when function is needed), cost-benefit analysis (trait is costly, implying strong selection), or genetic correlation showing selection on this specific function.
  *   **Weak/Plausible Evidence:** It makes sense functionally, but we lack comparative data.
  *   **Alternative Explanation Plausible:** Could this be a byproduct of growth? A physical constraint? Co-opted from a different function (exaptation)? Drift?

  *   *If Strong Evidence:* Move to **Box: SELECTION**.
  *   *If Alternative Plausible:* Move to **Box: CO-OPTED** or **SIDE-EFFECT**.
  *   *If Weak Evidence:* Move to **Box: UNKNOWN**.

  #### Step 4: The Alternative Filter (Mandatory)
  Before finalizing Step 3, answer **YES** or **NO** to these three questions. If you answer **YES** to any, you cannot use "Evolved to."
  1.  **Byproduct:** Is this trait a necessary physical consequence of something else that was selected? (e.g., red blood is a byproduct of oxygen transport chemistry, not selected for redness).
  2.  **Constraint:** Is this trait the only physically possible solution, regardless of selection? (e.g., small size in microbes due to diffusion limits).
  3.  **Exaptation:** Did this trait exist for a different reason first? (e.g., feathers for warmth before flight).

  #### Step 5: Assign the Box and Language
  Match your findings to the four boxes below. Use the mandated language.

  | Box | Condition | Mandatory Language | Forbidden Language |
  | :--- | :--- | :--- | :--- |
  | **SELECTION** | High Utility + Strong Origin Evidence + Alternatives Ruled Out | "Evolved to," "Adaptation for," "Selected for" | "Maybe," "Coincidentally" |
  | **CO-OPTED** | High Utility + Origin was for *other* function (Exaptation) | "Co-opted for," "Now used to," "Repurposed for" | "Evolved to" (implies original intent) |
  | **SIDE-EFFECT** | Utility is Incidental + Trait selected for *other* reason (Spandrel) | "Byproduct of," "Incidental result," "Consequence of" | "Designed to," "Evolved to" |
  | **UNKNOWN** | High Utility + Origin Evidence Missing or Ambiguous | "Functions to," "Helps the animal to," "Consistent with" | "Evolved to," "Purpose is" |

  #### Step 6: Advisor Review Flags (Stop Points)
  **Hand the script to the Science Advisor if:**
  1.  You are tempted to check **SELECTION** but your evidence is only "It makes sense."
  2.  You are checking **CO-OPTED** or **SIDE-EFFECT** (these require nuanced explanation).
  3.  The trait is behavioral (harder to distinguish from learning/culture).
  4.  The claim involves "altruism" or "group benefit" (high risk of group selection fallacy).

  ***

  ### Case Study 1: The Beetle Horn
  **Draft Claim:** "The male beetle's oversized horn evolved to fight rival males for mates."

  **Procedure Run:**
  1.  **Define:** Trait = Horn. Function = Combat/Mating access.
  2.  **Utility Check:** **Yes.** Males with larger horns win more fights and mate more. (High Utility).
  3.  **Origin Check:** **Strong.** Comparative data shows horns enlarge in species with high male-male competition. Horns are metabolically costly (handicap principle), implying selection pressure.
  4.  **Alternative Filter:**
      *   Byproduct? No, hornless males exist.
      *   Constraint? No, shape varies widely.
      *   Exaptation? Unlikely; structure is specific to combat leverage.
  5.  **Box Assignment:** **SELECTION**.
  6.  **Advisor Flag:** None. Evidence is standard textbook sexual selection.

  **Final Label Language:**
  "The horn **evolved to** help males fight rivals for mates."
  *(Note: This is one of the rare cases where adaptationist language is robust.)*

  ***

  ### Case Study 2: The Bird Alarm Call
  **Draft Claim:** "The bird's alarm call evolved to warn its relatives of predators."

  **Procedure Run:**
  1.  **Define:** Trait = Vocal alarm call. Function = Warning kin.
  2.  **Utility Check:** **Yes.** Relatives flee when the call is made. (High Utility).
  3.  **Origin Check:** **Weak/Ambiguous.** While kin selection is a valid theory, alternative hypotheses exist: the call may startle the predator (selfish), signal to the predator "I see you" (pursuit-deterrence), or be an involuntary byproduct of arousal.
  4.  **Alternative Filter:**
      *   Byproduct? Plausible (arousal vocalization).
      *   Exaptation? Plausible (contact call co-opted).
      *   **Advisor Flag:** **YES.** This triggers Flag #4 (Altruism/Group Benefit). It also triggers Flag #1 (Evidence is "It makes sense" kin-wise, but hard to prove historically).
  5.  **Box Assignment:** **UNKNOWN** (regarding origin) or **CO-OPTED**.
  6.  **Decision:** We cannot confirm the *history* of the trait is specifically for *kin warning* versus self-preservation that *incidentally* helps kin.

  **Final Label Language:**
  "The alarm call **functions to** warn nearby birds, often relatives, of danger."
  *OR*
  "Calling **may have been favored** by selection because it protects the caller's kin."
  *(Note: "Evolved to warn" is forbidden. We know it warns; we don't know if that's why it started.)*

  ***

  ### Case Study 3: Ant Trail Pheromones
  **Draft Claim:** "The ant trail pheromone evolved to recruit nestmates to food sources."

  **Procedure Run:**
  1.  **Define:** Trait = Chemical trail secretion. Function = Recruitment.
  2.  **Utility Check:** **Yes.** Nestmates follow the trail to food. (High Utility).
  3.  **Origin Check:** **Weak (in this context).** The writers have no phylogenetic data on when volatile trails emerged versus contact recognition chemicals.
  4.  **Alternative Filter:**
      *   **Byproduct/Constraint?** **YES.** Chemical communication often begins with cuticular hydrocarbons used for nestmate recognition (contact). Volatile trails may be a co-option of existing chemistry or a metabolic byproduct of gland development selected for *recognition*, not *trailing*.
      *   **Advisor Flag:** **YES.** This is your old system. You know the complexity. The writers do not. They are assuming utility = origin.
  5.  **Box Assignment:** **UNKNOWN** or **CO-OPTED**.
      *   *Reasoning:* Even if you believe it is an adaptation, the *script* lacks the comparative evidence to rule out that it started as a simple recognition scent (spandrel/byproduct of recognition systems) later co-opted for trailing. To say "Evolved to recruit" asserts a historical sequence the writers cannot prove.
  6.  **Decision:** This is the sting. The claim must be downgraded from historical origin to current function.

  **Final Label Language:**
  "Ants lay chemical trails that **function to** recruit nestmates to food."
  *OR*
  "Trail pheromones **are used to** guide nestmates, likely building on older chemical communication systems."
  *(Note: "Evolved to recruit" is forbidden. The procedure forces the distinction that just because it recruits now doesn't mean selection started there. It respects the Gould/Lewontin critique: utility is not proof of origin.)*

  ***

  ### Summary of Limitations (For Your Eyes Only)
  This procedure cannot settle:
  1.  **Degree of Evidence:** It relies on the writer's honesty about "Strong" vs. "Weak" evidence. Your review flag is the safety net there.
  2.  **Phylogenetic Depth:** It doesn't define how many sister species need to be studied to confirm "Origin." That remains your judgment call at the Review Flag.
  3.  **Developmental Plausibility:** A writer might guess a "Byproduct" story that sounds good but is biologically nonsense. The procedure flags it for you, but doesn't solve it automatically.

  **Why the Ant Case Stings:**
  In your career, you likely operated under the working hypothesis that the trails were adaptations. They probably *are*. But the museum label is a public claim of fact. The procedure forces the label to reflect the *evidence available to the writer*, not the *consensus of the field*. If the script doesn't cite the phylogenetic work distinguishing recognition hydrocarbons from volatile trails, it cannot claim historical origin. It forces intellectual humility, which is exactly what the Spandrels paper demanded.
