      *   **5. Disagreements (Table):**
          *   Columns: Issue, Universalist Formulation, Contextualist Formulation, What Turns on It, Type of Disagreement.
          *   *Row 1:* Definition of Public Interest.
          *   *Row 2:* The Gift/Bribe Line.
          *   *Row 3:* State Legitimacy.

      *   **6. Cruxes:**
