  Taking Malcolm's side dissolves dreaming as a temporal mental event, meaning lucid dreamers are mistaken about their agency, sleep science is correlating brain states with waking narratives rather than experiences, and moral responsibility is moot because no actions ever occurred. This conclusion rests on the Wittgensteinian verificationist principle that without independent criteria to check a dream report against the sleep state, the concept of a dream occurring *during* sleep is logically incoherent. For lucid dreamers, the sensation of making choices is not evidence of consciousness during sleep but a feature of the waking story they construct, rendering their claim of real-time agency a grammatical confusion rather than a psychological fact. Regarding sleep labs and nightmare therapy, Malcolm's view reclassifies the data rather than discarding it: REM patterns correlate with the *disposition to report* a dream upon waking, not the occurrence of the dream itself, so therapies like Imagery Rehearsal work by altering the waking narrative script rather than fixing a past sleep event. Finally, moral blame is impossible because actions require events in time, and if dreams are not experiences in time but only waking reports, the "adultery" or "violence" committed in a dream literally never happened, leaving nothing to judge.
