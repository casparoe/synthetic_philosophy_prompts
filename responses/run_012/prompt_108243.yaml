      *   *Claim 3: "Bratman says yes: a shared intention is just each of us intending that we do the thing together, plus each of us knowing that the other intends it too."*
          *   **Assessment:** Fair simplification, but misses "meshing subplans" and "mutual responsiveness." It's not just knowledge; it's interlocking intentions.
      *   *Claim 4: "So the real disagreement is about how much common knowledge you need and nothing deeper."*
          *   **Assessment:** **Wrong.** The disagreement is about the *structure* of the intention (primitive vs. composite), not just the epistemic threshold (common knowledge).
      *   *Claim 5: "And since Searle also insists that all intentionality sits inside individual heads, the two views turn out to be notational variants of each other..."*
