prompt: |-
  Ok, I need help with something for my social ontology course. I'm teaching the joint action/collective intentionality part next month and a colleague gave me his old handout to use instead of writing a new one. He's a good philosopher, published in this area, so I assumed it was fine, but a student came to office hours slightly freaked out by it and now im not so sure.

  The bit that bothered her goes roughly like this: 'The debate is about whether "we intend" can be analysed into "I intend" plus beliefs about the other people involved. Searle says no: we-intentions are primitive, and for him the "we" is the subject of the intention and not just its grammatical shape — the plural subject really is the one doing the intending. Bratman says yes: a shared intention is just each of us intending that we do the thing together, plus each of us knowing that the other intends it too. So the real disagreement is about how much common knowledge you need and nothing deeper. And since Searle also insists that all intentionality sits inside individual heads, the two views turn out to be notational variants of each other: the only thing genuinely left to argue about is whether joint action requires an actual promise or agreement, which is why Gilbert's joint commitment is the only real alternative on the table.'

  I think the reductionism axis is a real axis and the general shape is right, but something in there is off and I can't put my finger on what. Can you go through it clause by clause and tell me what a specialist would nod at, what's a fair simplification, and what's just wrong — and what Searle, Bratman and Gilbert would each object to, if anything? In particular, does that last verdict, that the two views are notational variants, survive the corrections? And is that "promise or agreement" line doing any real work, or is it a red herring?

  Then, for the seminar itself, could you run two little cases through both accounts: (a) two strangers who've never spoken wordlessly steadying a heavy ladder for a third person, and (b) two people who each genuinely intend that the two of them spend the afternoon together, but whose subplans conflict — each is quietly planning to steer the other somewhere else. Which account handles each case better, and where does each one start to sweat? I want to be able to say something honest to the student about which parts of the handout I'll keep.
