answer: |-
  ### Final Examination: Choice and Narrative
  **Question 1 (20 Marks)**

  Consider a driver travelling down a highway at night. There are three identical exits. Due to fog and fatigue (imperfect recall), the driver cannot distinguish one exit from another, nor can they recall how many they have already passed. At each exit, the driver must decide whether to turn off or continue. The payoffs are as follows:
  *   Turning off at the **first** exit yields **1**.
  *   Turning off at the **second** exit yields **3**.
  *   Turning off at the **third** exit yields **4**.
  *   Continuing past all three exits yields **0**.

  Because the intersections are indistinguishable, the driver must adopt a single mixed strategy: at any exit, they exit with probability $p$ and continue with probability $1-p$.

  1.  Construct the expected payoff function $V(p)$ for this journey from the *ex ante* perspective (before the trip begins). Determine the value of $p$ that maximizes this expected payoff.
  2.  Explain what the driver's inability to distinguish the intersections implies for the definition of a "strategy" in this context.
  3.  Analyze the tension between the *ex ante* optimal strategy you calculated and what the driver would wish to do if they somehow knew they were at the **final** intersection. What does this tension reveal about the nature of rational action under conditions of imperfect recall?

  *(Time allowed: 90 minutes)*

  ***

  ### Model Answer

  **1. Expected Payoff and Optimization**
  To calculate the *ex ante* expected payoff, we weigh the payoff of each exit by the probability of reaching it and choosing to exit. The probability of reaching the first exit is 1. The probability of reaching the second is $(1-p)$ (continuing past the first). The probability of reaching the third is $(1-p)^2$ (continuing past the first and second).

  The expected value function $V(p)$ is:
  $$V(p) = 1(p) + 3(1-p)p + 4(1-p)^2p$$
  Expanding the terms:
  $$V(p) = p + 3p - 3p^2 + 4p(1 - 2p + p^2)$$
  $$V(p) = 4p - 3p^2 + 4p - 8p^2 + 4p^3$$
  $$V(p) = 4p^3 - 11p^2 + 8p$$

  To find the maximum, we take the derivative with respect to $p$ and set it to zero:
  $$V'(p) = 12p^2 - 22p + 8 = 0$$
  Dividing by 2: $6p^2 - 11p + 4 = 0$.
  Factoring: $(2p - 1)(3p - 4) = 0$.
  The roots are $p = 0.5$ and $p = 4/3$. Since probability cannot exceed 1, the optimal strategy is **$p = 0.5$**.

  **2. Strategy and Indistinguishability**
  The driver's inability to distinguish intersections collapses the decision tree. In a standard game, a strategy maps specific information sets to actions. Here, there is only one information set: "I am at an exit." Consequently, a strategy cannot be conditional on location (e.g., "exit at the third"). It must be a uniform probabilistic rule applied blindly at every node. The strategy is not a path, but a disposition.

  **3. The Tension and Rational Action**
  A tension exists between the *ex ante* optimum ($p=0.5$) and sequential rationality at the final intersection. If the driver knew they were at the third exit, rationality would dictate exiting with probability 1, as 4 > 0. However, the *ex ante* optimal plan requires continuing with probability 0.5 at this node, risking a payoff of 0.

  This reveals that under imperfect recall, local optimization is impossible because the "self" at the intersection lacks the data to distinguish the final node from the first. If the driver deviates at the final node to secure the 4, they must have deviated earlier, which lowers the overall expected value calculated at the start. Therefore, rational action under imperfect recall cannot be defined by sequential consistency (doing the best thing *now* given current knowledge). Instead, it requires **commitment to an *ex ante* plan**. Rationality becomes a narrative constraint: the driver must adhere to the story planned at the beginning, even when the immediate chapter suggests a different ending. The "rational" agent is one who binds their future selves to the initial calculation, acknowledging that their future perception will be too degraded to optimize locally.

  ***

  ### Marking Scheme (20 Marks)

  | Component | Marks | Required Moves for First-Class Answer | Characteristic Errors (Deduct Marks) |
  | :--- | :---: | :--- | :--- |
  | **1. Setup & Optimization** | **10** | **Setup (5):** Correctly identifies probabilities of reaching each exit as $1$, $(1-p)$, and $(1-p)^2$. Constructs $V(p) = p + 3p(1-p) + 4p(1-p)^2$.<br>**Optimum (5):** Correctly differentiates and solves quadratic. Identifies $p=0.5$ as the valid root. | **Probability Error:** Assumes probability of reaching each exit is 1/3 or ignores the $(1-p)$ accumulation.<br>**Calculus Error:** Fails to maximize $V(p)$; selects $p=1$ or $p=0$ without justification.<br>**Arithmetic:** Algebraic expansion errors leading to wrong roots. |
  | **2. Strategy Definition** | **5** | **Indistinguishability:** Explicitly states that because information sets are identical, the strategy must be a single $p$ across all nodes.<br>**Implication:** Notes that this prevents conditional planning (e.g., "wait until the third"). | **Distinct Nodes:** Treats the intersections as distinguishable stages (e.g., calculating different $p$ for each exit).<br>**Vagueness:** Fails to link indistinguishability to the constraint on the strategy definition. |
  | **3. Tension & Rationality** | **5** | **Tension:** Identifies that at the 3rd exit, Exit (4) dominates Continue (0), yet the optimal plan requires Continuing 50% of the time.<br>**Resolution:** Argues that *ex ante* commitment overrides sequential desire. Rationality is defined globally, not locally, due to memory loss. | **Sequential Rationality:** Claims the driver *should* exit at the last one regardless of the plan (ignoring the *ex ante* constraint).<br>**Sunk Cost:** Argues that once at the 3rd exit, earlier probabilities are sunk and irrelevant.<br>**No Resolution:** Identifies the paradox but fails to explain why *ex ante* planning prevails. |

  **Grading Notes:**
  *   **18-20 (Distinction):** Flawless math; nuanced discussion of "commitment" vs. "local optimization."
  *   **14-17 (Pass/Merit):** Correct math ($p=0.5$); identifies the tension but resolution is slightly vague.
  *   **10-13 (Marginal):** Math errors but correct setup; or correct math with weak conceptual analysis.
  *   **0-9 (Fail):** Fundamental misunderstanding of probability setup or treats intersections as distinguishable.
