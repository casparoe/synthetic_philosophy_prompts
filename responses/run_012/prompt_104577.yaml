prompt: |-
  Take the role of a legal philosopher who's equally at home in contract doctrine and in the metaphysics of personal identity, and think carefully before you answer — maybe brainstorm the mapping in a scratch list first, then write it up clean.

  I'm a contracts lawyer, so the vocabulary I actually live in is: parties, capacity, offer and acceptance, revocation, the dead hand, agency, assignment and novation, unconscionability, specific performance, third-party beneficiaries. I've never seriously studied the philosophy of personal identity and honestly I don't want a lecture on it.

  What I want is a translation job. There's a fight in bioethics over advance directives — whether instructions a person wrote while competent should bind them later, once they've got dementia and seem to want something else. On one side: the earlier, competent self's choices have authority, and letting the demented later self override them betrays the person who actually made a life plan. On the other side: the person sitting in front of you now is the one who has to live it, and the earlier self doesn't get to rule from the grave. Restate that whole fight as faithfully as you can in my vocabulary — as a question about whether one party can bind a later party, who has capacity to revoke, what 'the same party' even means across time, and whether the later self is an agent of the earlier one or a seperate stranger who inherited the estate.

  Then the part I actually care about: the residue report. Which parts of the bioethics debate translate cleanly into contract terms? Which only translate if you fudge something, and what exactly gets distorted in the process? And which parts have no counterpart at all in contract law? I've got a suspicion that contract law just quietly assumes the person stays the same party the whole way through, and that this assumption is where the real fight is hiding — tell me if that's right or if I'm missing something. And whenever something doesn't survive the translation, say whether that's a genuine gap in contract law's vocabulary or a sign the bioethicists are dressing up a distinction that isn't really there.

  Don't just tell me the two are analagous — I already think they're analagous. I want the seams. Flag anything you're unsure about rather than smoothing it over, and if some piece of the debate turns out to be untranslatable, don't fake it just to make the mapping look tidier than it is.
