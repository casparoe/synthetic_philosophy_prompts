answer: |-
  ### Scratch List & Mapping Strategy

  *   **The Core Conflict:** Precedent Autonomy (Past Self rules) vs. Current Interests (Present Self rules).
  *   **Contract Analogues:**
      *   *Advance Directive (AD):* Unilateral contract? Power of Attorney? Will for the living?
      *   *Past Self:* Offeror / Principal / Testator.
      *   *Present Self:* Offeree / Agent / Successor / Beneficiary.
      *   *Dementia:* Loss of capacity? Or Novation (new party)?
      *   *Enforcement:* Specific Performance vs. Damages (inability to undo harm).
      *   *Revocation:* Requires capacity. If Present Self lacks capacity, Past Self's offer stands. *But* what if Present Self is happy?
      *   *Unconscionability:* Is binding a happy demented person to a prior "no treatment" clause unconscionable?
      *   *Identity:* Contract law assumes *Legal Person* = continuous entity. Bioethics asks if *Moral Person* = continuous entity.
  *   **The "Fudge":** Treating biological continuity as legal continuity.
  *   **The Gap:** Contract law protects *expectations* and *reliance*. Bioethics protects *narrative integrity* vs. *phenomenological welfare*.
  *   **The Suspicion:** Contract law assumes identity continuity as a baseline axiom. The bioethics fight challenges that axiom.

  ***

  ### Part I: The Translation
  **Re: The Enforceability of the "Self-Contract" Across Radical Change of Condition**

  Here is the bioethics fight restated strictly within your doctrinal vocabulary.

  **The Transaction:**
  Party A (Competent) executes a unilateral instrument (the Advance Directive) instructing Party B (Healthcare Providers) to withhold specific performance (life-sustaining treatment) upon the occurrence of a contingency (dementia). Party A designates Party A-Future (the later self) as the subject of the performance.

  **The Dispute:**
  The contingency occurs. Party A-Future exists in a state of diminished capacity. Party A-Future exhibits conduct inconsistent with the instrument (e.g., smiling, eating, resisting withdrawal of care). Party B seeks a declaratory judgment on whether the instrument remains binding.

  **The Arguments in Contract Terms:**

  1.  **The "Binding Offer" Argument (Precedent Autonomy):**
      *   Party A had full capacity at formation. Consideration was supplied by Party A's reliance on their own life plan (detrimental reliance on the self).
      *   Loss of capacity by the offeree/subject (Party A-Future) does not constitute a valid revocation. Under standard doctrine, an offeree lacking capacity cannot revoke an offer.
      *   Party A-Future is merely a **successor in interest** to Party A. Just as a corporate merger doesn't void prior contracts, the biological continuity of the human organism preserves the contractual privity.
      *   To rule otherwise is to permit **dead hand control** by the living: allowing the incompetent party to void the competent party's estate plan simply by surviving.

  2.  **The "Impossibility/Novation" Argument (Current Interests):**
      *   The onset of dementia is not merely a loss of capacity; it is a **constructive novation**. The psychological discontinuity is so severe that Party A-Future is a distinct legal person inheriting the estate of Party A.
      *   Party A-Future cannot be an **agent** of Party A because agency requires capacity. If they are not an agent, they are a stranger to the contract.
      *   Enforcing the directive against Party A-Future's current expressed preferences constitutes **unconscionability**. The burden of performance (death) falls entirely on Party A-Future, who received no benefit from the formation and lacks the cognitive capacity to understand the bargain.
      *   The instrument functions as a **Will**, not a contract. Wills are ambulatory and revocable until death. If Party A-Future is the "testator" of their own remaining life, they should retain the power to revoke, regardless of capacity, based on current welfare.

  **The Question for the Court:**
  Does the privity of contract survive the total dissolution of the psychological continuity of the promisor, or does the radical change in condition operate as a discharge by impossibility?

  ***

  ### Part II: The Residue Report

  Here is the audit of the translation. I have categorized the bioethical concepts by how well they survive the transposition into contract doctrine.

  #### 1. Clean Translations (High Fidelity)
  *   **Capacity at Formation:** Both fields agree that the initial act requires full capacity. There is no friction here.
      *   *Verdict:* Clean.
  *   **Agency/Power of Attorney:** When the AD appoints a proxy, this maps perfectly to agency law. The fiduciary duties of the proxy mirror the bioethical duty of the surrogate.
      *   *Verdict:* Clean.
  *   **Dead Hand Control:** The bioethical worry that the "past self" is ruling the "present self" is exactly the legal worry about testators controlling property long after death.
      *   *Verdict:* Clean.
  *   **Specific Performance:** The bioethical act of forcing treatment (or withholding it) against current resistance is legally analogous to specific performance. It is an equitable remedy that courts grant sparingly when damages (money) aren't enough.
      *   *Verdict:* Clean.

  #### 2. The Fudges (Translation Requires Distortion)
  *   **Revocation:**
      *   *The Fudge:* In contract law, revocation requires capacity. If the Present Self lacks capacity, they legally *cannot* revoke. The bioethics debate, however, asks if we *should* honor their non-verbal resistance even if they lack legal capacity.
      *   *The Distortion:* To make this fit contract law, we have to argue that the Present Self's resistance is a "breach" rather than a "revocation." But you can't breach a contract you lack the capacity to understand. We are forced to treat the Present Self as either a competent breacher (which they aren't) or an incompetent ward (which strips their resistance of legal weight).
      *   *What gets lost:* The moral weight of *current suffering*. Contract law doesn't care if performance makes the promisor miserable, provided they had capacity at signing. Bioethics cares deeply about the phenomenology of the present moment.
  *   **Unconscionability:**
      *   *The Fudge:* We use "unconscionability" to describe the unfairness of binding a demented person to a prior wish.
      *   *The Distortion:* In contract law, unconscionability is usually procedural (hidden terms) or substantive (grossly one-sided price). Here, the "price" is life itself, and the "procedure" was fully informed years ago. Stretching unconscionability to cover "existential mismatch" distorts the doctrine. It turns a contract defense into a welfare check.
  *   **Successor in Interest vs. Same Party:**
      *   *The Fudge:* Contract law assumes the "Party" is the legal entity (the human body). Bioethics asks if the "Party" is the psychological consciousness.
      *   *The Distortion:* To translate this, we have to pretend the debate is about **Novation** (did a new party replace the old one?). But contract law doesn't recognize "psychological novation." It only recognizes corporate succession or death. We are forcing a metaphysical change into a corporate law box.

  #### 3. The Untranslatables (No Counterpart)
  *   **Narrative Integrity:**
      *   *Concept:* The idea that a life is a story, and breaking the plot ruins the meaning of the whole book.
      *   *Gap:* Contract law has no concept of "narrative." It cares about the transaction, not the story of the parties. There is no cause of action for "ruining my life's theme."
      *   *Diagnosis:* This is a genuine gap in contract vocabulary. Contract law is atomic (deal-by-deal); bioethics is holistic (life-as-a-whole).
  *   **The "Experience Machine" Problem:**
      *   *Concept:* If the demented self is happy in their delusion, does it matter that their prior self wanted to avoid this state?
      *   *Gap:* Contract law assumes preferences revealed at signing are the "true" preferences. It has no mechanism to weigh "happy delusion" against "dignified death."
      *   *Diagnosis:* This suggests the bioethicists are not dressing up a distinction; they are grappling with a value (welfare vs. autonomy) that contract law deliberately excludes to facilitate commerce.

  ***

  ### Part III: Addressing Your Suspicion

  You suspected that **contract law quietly assumes the person stays the same party the whole way through, and that this assumption is where the real fight is hiding.**

  **You are exactly right.**

  In contract doctrine, "Identity" is a binary switch. You are either the legal person named on the signature line, or you are not. If you are the same biological human, you are the same Party. The law treats personal identity as a **juridical fiction** necessary for stability. If we allowed "psychological discontinuity" to void contracts, commerce would collapse (e.g., "I'm not the same person who bought this car yesterday, I've changed my mind").

  **The Hiding Spot:**
  The bioethics fight is essentially a motion to pierce the corporate veil of the Self.
  *   **The Bioethicists** are arguing that the "Legal Person" (the body) and the "Moral Person" (the psyche) have diverged. They want the law to recognize a **constructive trust** over the self: the Past Self holds the body in trust for the Future Self, but if the Future Self changes fundamentally, the trust terms should fail.
  *   **The Contract Lawyer** (and the law) replies: "I don't recognize that trust. I see one signature, one body, one liability."

  **Is the Distinction Real or Dressing?**
  You asked me to flag if the bioethicists are dressing up a distinction that isn't really there.
  *   **My Verdict:** The distinction is real, but contract law is *designed* to ignore it.
  *   **Why:** Contract law is forward-looking and reliance-based. It protects the *expectations* of the signing party. Bioethics is often backward-looking (narrative integrity) or present-looking (current welfare).
  *   **The Gap:** It is not a gap in contract law's *vocabulary*; it is a gap in its *purpose*. Contract law is not designed to adjudicate the metaphysics of the soul. It is designed to enforce promises. When you apply it to Advance Directives, you are using a commercial tool to solve an existential problem.

  **One Caveat (Where I'm Unsure):**
  There is a doctrine in contract law called **Frustration of Purpose**. If the underlying reason for the contract vanishes, performance may be excused.
  *   *Translation:* Could we argue the "purpose" of the Advance Directive (preserving dignity) is frustrated if the demented self no longer understands dignity?
  *   *Uncertainty:* Courts hate applying Frustration of Purpose to self-imposed conditions. It's a shaky bridge. But it might be the only doctrinal hook available to let the Present Self off the hook without admitting they are a "different person."

  ### Final Summary
  The translation holds up structurally, but it leaks morally.
  *   **Structurally:** ADs function like irrevocable offers coupled with a power of attorney.
  *   **Morally:** Contract law assumes the "Party" is continuous. The bioethics debate exists solely because that assumption is metaphysically fragile.
  *   **The Takeaway:** You cannot solve the bioethics fight with contract doctrine alone, because the fight is about whether contract doctrine's foundational axiom (Personal Identity = Biological Continuity) is morally sufficient for end-of-life decisions. The law says yes. The bioethicists say: "Prove it."
