  6.  **Final Polish:** Check tone. It needs to be respectful but forensic. The user wants to avoid a "wasted episode." The questions must force nuance, not just "Yes/No." Ensure the distinction between *Griff nach der Weltmacht* (War Aims) and *Krieg der Illusionen* (July Crisis) is acknowledged implicitly, as Fischer wrote both.

