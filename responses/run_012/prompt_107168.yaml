answer: |-
  ### Part 1: Strategic Architecture

  **1. The Sequence: Discovery, Not Stipulation**
  To make the argument feel like a discovery, you must reverse the standard textbook order. Do not define "essential property" and then apply it to origins. Instead, start with the intuition of *identity across variation* and let the definition emerge as the solution to a puzzle.

  *   **First: The Modal Apparatus (The Lens).** You must establish the possible-worlds framework *before* introducing the biological case. If you start with biology, students will treat this as a scientific claim about DNA. They need to understand that we are asking about *identity conditions* across worlds, not causal history in this world. The question is not "What caused me?" but "Which things in other worlds count as *me*?"
  *   **Second: The Gradient of Variation (The Data).** Before zooming in on gametes, walk them through a gradient of changes. Could you be you if you had different hair? Yes. Different major? Yes. Different parents? (Pause). This creates the tension. If they say "Yes" to different parents, press them: "If you had different parents, would you be *you*, or just *someone like you*?" This forces them to feel the limit of variation.
  *   **Third: The Origin Constraint (The Conclusion).** Once they feel that there *must* be a limit to how much you can vary while remaining you, introduce the gamete case as the only non-arbitrary stopping point. The notion of an "essential property" here must carry the weight of **individuation**, not **importance**. It threatens to do too much work if students think it means "most important trait" (e.g., rationality). You must insist it means "the property without which *this* entity does not exist."

  **2. The Single Example: The "Shifted Conception" Case**
  **Do not use the IVF embryo example.** You are correct to worry. Pointing to actual frozen embryos (Sibling A, Sibling B) conflates *actual distinct persons* with *possible versions of one person*. It invites the confusion: "But that embryo is already a human; why can't I be it?" This smuggles in the conclusion that the embryo is the person, begging the question.

  **The Better Example:** **The "Five-Minute Delay" Scenario.**
  Ask students to imagine a possible world identical to this one, except your parents conceived you five minutes later. In that world, a different sperm fertilizes the egg (statistically near-certain).
  *   **Why this works:** It holds the *parents* constant (avoiding adoption/social confusion) and holds the *time/place* roughly constant (avoiding birthplace confusion). It isolates the *material origin* as the only variable.
  *   **What it must lack:** It must conspicuously lack any reference to *actual* siblings. We are not talking about your brother or sister; we are talking about a *counterfactual* person who never actually existed. This forces the modal question: "Is that non-existent person *me*, or is it *someone else*?"

  **3. Mapping Misconceptions & Intervention Points**
  *   **Genetic Determinism:** *Head off during the "Gradient of Variation" phase.* Explicitly state: "This is not about what you will become (personality, traits); it is about *who* is there to have traits."
  *   **Adoption/Upbringing:** *Head off during the "Parents" discussion.* Distinguish between "being raised by X" (contingent) and "coming from X" (essential).
  *   **Organism vs. Person:** *Head off immediately before the "Shifted Conception" example.* Stipulate for the sake of the seminar that we are tracking the "human organism" or "person" as a single continuous entity. Acknowledge the debate but bracket it to avoid derailment.
  *   **Religious/Soul View:** *Head off if raised.* Frame it as metaphysical necessity (logic of identity), not theological doctrine.
  *   **Birthplace/City:** *Head off during the "Shifted Conception" example.* Emphasize that location is contingent; the *cause* is essential.
  *   **Psychological Continuity (Memories/Character):** *Save for the very end.* This is the strongest rival theory. Let it stand as the counter-view to be debated next week.

  **4. The Closing Question**
  Do not ask: "Could you have had different DNA?" (Too biological).
  **Ask:** "In the world where the other sperm wins, is the person born *you* with different traits, or *someone else* entirely? If it is *someone else*, what makes them a different person if they have the same parents, same name, and same life?"
  *   *Why:* This tests if they grasp that origin essentialism posits a difference in *identity*, not just a difference in *properties*.

  **5. What to Explicitly Leave Out**
  *   **The Formal Proof of the Necessity of Identity:** (Kripke's argument using rigid designators and Leibniz's Law). It is too technical for 75 minutes and obscures the intuition.
  *   **De Re / De Dicto Distinction:** Use the language of "ways the world could be" rather than modal logic operators.
  *   **The "No Overlap" Principle:** Don't get into whether the same matter could constitute two people.
  *   **Material Constitution Puzzles:** (Ship of Theseus). Keep the focus on biological origins, not artifact composition.

  ---

  ### Part 2: The 75-Minute Lesson Plan

  **Title:** Where Do *You* Begin? (Origin Essentialism)
  **Goal:** Students will derive the claim that origins are essential to identity through modal intuition pumps, distinguishing metaphysical necessity from biological contingency.

  #### I. Reactivating the Modal Apparatus (00:00 – 00:15)
  *   **Hook (5 mins):** Write on board: *"You are in this room. Could you have been in a different room?"* (Yes). *"Could you have been wearing a different shirt?"* (Yes).
  *   **Review Possible Worlds (10 mins):** Remind them of last week. A "possible world" is a way things could have been.
      *   *Task:* Ask students to describe a world where *they* exist but are slightly different.
      *   *Constraint:* They must describe a world where *they* are the subject.
      *   *Goal:* Establish that we can vary *properties* (hair, location, habits) while keeping the *person* fixed.
      *   *Definition Emergence:* Ask: "What are we holding fixed when we say it's still *you*?" Elicit the idea of a "core" or "essence." Define **Essential Property** *now*: A property you have in every world where *you* exist. If you lose it, *you* are gone (not just changed).

  #### II. The Gradient of Variation (00:15 – 00:35)
  *   **The Push (15 mins):** Escalate the variations.
      1.  "Could you have been an Engineering major?" (Most say Yes).
      2.  "Could you have been born in a different hospital?" (Most say Yes).
      3.  "Could you have been adopted by different parents?" (Pause here).
  *   **Intervention (Genetic Determinism & Adoption):** If they say "Yes" to adoption, agree: "Being *raised* by different parents is contingent." Then pivot: "But could you have come from *different biological parents*?"
      *   *Trap:* Students will say "Yes, I'd just be a different version of me."
      *   *Counter:* "If you came from different parents, would that person have your DNA? No. Would they have your history? No. In what sense is that *you*? Is it just 'someone similar'?"
      *   *Goal:* Make them feel that changing parents changes the *subject*, not just the *predicates*.
  *   **The Transition (5 mins):** If parents are essential, why? Is it the social role? No (adoption). Is it the DNA? Maybe. But DNA is a result of something prior. What is the *source*?

  #### III. The Core Example: The Shifted Conception (00:35 – 00:55)
  *   **Setup (5 mins):** Introduce the **Five-Minute Delay Scenario**.
      *   "Imagine your parents are in the same room, same relationship. But conception happens 5 minutes later."
      *   *Biological Fact:* A different sperm fertilizes the egg (almost certainly).
  *   **The Modal Question (10 mins):** "In that world, a child is born. They look like you. They have your parents. They might even be named after you. **Is that you?**"
      *   *Option A:* It is me, just with slightly different DNA.
      *   *Option B:* It is a different person (a counterfactual sibling).
  *   **Discussion (10 mins):** Let them argue.
      *   *If they say A:* Ask, "If that is you, then what makes *this* world's you distinct from *that* world's you? If you can swap sperm and still be you, can you swap *any* matter and still be you?" (Push toward absurdity).
      *   *If they say B:* Ask, "Why? What is the difference? They have the same parents, same time, same place."
      *   *The Discovery:* Guide them to see that the *particular causal history* (this sperm + this egg) is the only thing left to distinguish the two entities.
  *   **Intervention (Organism vs. Person):** If they argue "But the person is the mind!", acknowledge: "We are tracking the human organism that supports the mind. If the organism is different, the seat of the mind is different." (Bracket the psychological view for next week).

  #### IV. Consolidating Origin Essentialism (00:55 – 01:05)
  *   **Formulating the Thesis (5 mins):** Write on board: **Origin Essentialism.**
      *   *Claim:* A person's origin (specific gametes) is an essential property.
      *   *Reasoning:* Without *this* origin, we are not talking about *you*, we are talking about *someone else*.
  *   **Intervention (Religious/Soul):** If a student says, "This is about the soul," reply: "We aren't claiming a soul enters at conception. We are claiming that *identity* tracks the causal chain. Even a materialist must ask: which chunk of matter is *me*?"
  *   **Intervention (Birthplace):** Clarify: "Being born in Chicago is contingent. Coming from *these* parents is essential. Location is where you are; Origin is *what* you are."

  #### V. Closing & Assessment (01:05 – 01:15)
  *   **The Rival View (5 mins):** Briefly mention the Psychological Continuity view ("You are your memories").
      *   "If you are your memories, then Origin Essentialism is false. You could have different origins as long as you develop the same mind."
      *   "Next week we fight this battle. Today, we just established the stakes."
  *   **The Closing Question (5 mins):** Pose the question drafted in Part 1.
      *   *"In the world where the other sperm wins, is the person born **you with different traits**, or **someone else entirely**? If it is someone else, what makes them a different person if they have the same parents, same name, and same life?"*
      *   Have them write a 2-sentence answer on a slip of paper.
  *   **Dismissal:** Collect slips. This checks if they understand the *modal* claim (identity across worlds) vs. the *biological* claim (DNA determines personality).

  ### Instructor Notes for Honesty & Limits
  *   **Explicit Bracket:** At minute 00:40, state clearly: *"We are setting aside the question of when 'personhood' begins morally or legally. We are only asking about metaphysical identity. We are also setting aside the formal logical proof for this claim; we are relying on intuition."*
  *   **Tone Check:** If students feel the view is "fatalistic," remind them: "This doesn't mean your life is determined. It just means *you* are the one living it. A different origin would be a different person living a different life."
  *   **The "Too Much Work" Warning:** If students argue "But I could have been a clone!", acknowledge that cloning complicates the view, but say: *"Origin Essentialism is about *natural* biological origins. We are testing the standard case first."* (This prevents the lesson from bogging down in edge cases).
