      *   *Correction on Example:* The prompt asks for *one* example to carry the whole explanation. The "Counterfactual Sibling" is good, but maybe **"The Queen"** is too abstract. Let's stick with **"You, but conceived 5 minutes later."** It's immediate. Actually, the **"Different Sperm"** case is the standard. Let's call it **The "Winning Sperm" Scenario**.
