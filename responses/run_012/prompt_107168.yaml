      *   **Time:** 75 minutes.
      *   **Goal:** A lesson plan where the argument feels like a *discovery*, not a *stipulation*.
      *   **Specific Questions to Answer:**
          *   Sequence (What comes 1st, 2nd, 3rd?).
          *   Role of possible worlds vs. biological case.
          *   Role of "essential property."
          *   The *single best example* (critique the IVF embryo example, consider twins/timing).
          *   Map of misconceptions (genetic determinism, adoption, organism/person, soul, birthplace, psychological continuity).
          *   When to head off misconceptions.
          *   One closing question to test modal grasp.
          *   What to explicitly leave out (limitations).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Trap:* Origin essentialism sounds like biology or genetics to beginners. It needs to be framed as *metaphysics* (identity across worlds).
      *   *The IVF Problem:* The user is right. Saying "You could have been Embryo B" assumes Embryo B = You (just different circumstances). But Origin Essentialism says Embryo B $\neq$ You. Using IVF siblings risks conflating "different possible life of me" with "different possible person."
      *   *The "Discovery" Feel:* Students need to feel the tension between "I could have been different" and "If I were *too* different, I wouldn't be *me*." They need to derive the limit of variation themselves.

  3.  **Drafting the Sequence (The "Discovery" Arc):**
      *   *Phase 1: Reactivate Modal Intuitions.* Start with what they know (Possible Worlds). Don't lecture definitions; use them.
      *   *Phase 2: The Gradual Drift.* Push the "How different could I be?" question. Move from contingent (hair color) to seemingly essential (species, parents).
      *   *Phase 3: The Origin Point.* Zoom in on the moment of conception. This is where the biological case meets the modal apparatus.
      *   *Sequence:* Modal Tools $\rightarrow$ The Identity Question $\rightarrow$ The Origin Constraint.
      *   *Answering the "Apparatus vs. Biology" question:* The modal apparatus must be the *lens*, but the biological case is the *data*. Don't define essentialism first; let them feel the need for it.

  4.  **Selecting the Single Example:**
      *   *User's IVF Idea:* Rejected (as user suspected). It conflates distinct actual persons with possible persons.
      *   *Identical Twins:* Good for showing genetic sufficiency isn't identity, but might complicate the "single origin" point.
      *   *The "Same Gametes, Different Time" Case:* This is the classic Kripkean move. If *this* sperm and *this* egg meet 5 minutes later, is it *me*?
      *   *Better Option:* **The "Different Parents" Intuition Pump.** Start broad (could I have been born to different parents?), then narrow to the gametes.
      *   *Best Single Example:* **The "Switched at Birth" vs. "Different Conception" contrast.** Actually, the prompt asks for *one* example to carry the whole explanation.
      *   *Refinement:* The **"Queen Elizabeth" case** is the classic Kripke example, but it's distant. For first-years, **"You"** is better.
      *   *Decision:* The **"Different Sperm, Same Egg"** scenario (or vice versa). Why? It isolates the *origin* variable without changing the *parents* (which brings in social/nurture confusion).
      *   *Wait, the prompt asks to critique the IVF example and suggest a better one.* The IVF example fails because it treats siblings as "possible versions." The better example must treat the *counterfactual* entity as distinct.
      *   *Winner:* **The "Nearby Possible World" Conception.** Imagine your parents conceived a child a month earlier (different sperm/egg). That person exists (your potential sibling). Is that you?
      *   *Why:* It separates "being their child" from "being *this* child." It highlights the *particularity* of the origin.

  5.  **Mapping Misconceptions:**
      *   *Genetic Determinism:* Head off early (Phase 2). Distinguish properties from identity.
      *   *Adoption/Upbringing:* Head off when discussing parents (Phase 2).
      *   *Organism vs. Person:* Crucial. Must address before the biological deep dive (Phase 3).
      *   *Soul/Religious:* Head off immediately if raised, frame as metaphysical necessity, not theology.
      *   *Birthplace:* Distinguish origin (causal) from location (contingent).
      *   *Psychological Continuity:* The biggest rival. Must address at the end (Phase 3/Conclusion).

  6.  **Developing the Closing Question:**
      *   Needs to test modal structure, not biological fact.
      *   Bad: "Could you have had different DNA?" (Too biological).
      *   Good: "If we swap the sperm, do we get *you* with different traits, or *someone else*?"
      *   Better: "In the world where the other sperm wins, who is born? You, or a sibling?"

  7.  **Determining What to Leave Out:**
      *   Humean supervenience.
      *   The Necessity of Identity proof (Leibniz's Law formalism).
      *   Material Constitution puzzles (Ship of Theseus).
      *   The "No Overlap" principle technicalities.
      *   Kripke's specific arguments in *Naming and Necessity* (too dense).

  8.  **Fleshing out the Plan (Iterative refinement):**

      *   *Intro (15 mins):* Review Possible Worlds. Not definitions, but usage. "How far can we push 'You'?"
      *   *Middle (45 mins):* The Core Argument.
          *   Step 1: Contingent traits (hair, major).
          *   Step 2: Parental traits (could you have different parents?).
          *   Step 3: The Gamete constraint (The Single Example).
          *   *Intervention points for misconceptions.*
      *   *End (15 mins):* Implications and Closing Question.

      *   *Refining the Example:* The user suggested IVF. I need to explain *why* it's bad (it actualizes the alternatives, making them distinct people *here*, confusing the modal status). The better example is the **Counterfactual Sibling**. "Imagine your parents conceived a month earlier. That child is not you. Why? Because that sperm/egg combination is distinct." This forces the distinction between "Child of X & Y" and "This Specific Child."

      *   *Refining the "Essential Property" role:* It shouldn't be defined as "important." It must be defined as "identity-constituting." If you lose it, *you* cease to exist (in that world).

      *   *Timing the Misconceptions:*
          *   Genetic Determinism: When introducing the gametes.
          *   Adoption: When discussing parents.
          *   Psychology: At the very end as the main rival theory.

  9.  **Final Review against Constraints:**
      *   75 minutes? Yes, broken down.
      *   First-year level? Yes, avoiding jargon.
      *   Discovery feel? Yes, building from intuitions.
      *   Specific questions answered? Yes.

