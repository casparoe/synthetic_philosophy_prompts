answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Provincial Disaster Recovery Fund
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Hollow Creek Claims Proposal (Vote: 14th)

  **Bottom Line**
  I recommend we **amend** the staff proposal. We should reject the flat 20% deduction based solely on floodway location, but apply the 20% deduction specifically to households that ignored two or more evacuation advisories. All claims must meet the statutory "habitable standard" floor.

  **Statutory Mandate**
  Our enabling statute directs us to return households to a habitable standard. It is silent on fault. A flat penalty based on location risks leaving families below habitability due to zoning legacy issues beyond their control, which exposes the Fund to legal challenge. We cannot prioritize punishment over habitability.

  **Agency and Consequences (Dara's Position)**
  Dara has rightly noted that paying claims in full can wipe out the consequences households earned through their choices. Her view—that we should not rescue an adult from being an adult—respects claimant agency and avoids moral hazard. There is validity to the idea that public aid should not insulate people from the predictable outcomes of risky behavior.

  However, this logic breaks when applied to location alone. Many floodway homes were built legally decades ago; living there is a status, not an active choice to neglect safety. Applying a penalty to status punishes circumstance, not agency. We can honor Dara's principle by targeting *actions* (ignoring advisories) rather than *locations*. This ensures the consequence attaches to the neglect, not the address.

  **Administrative Feasibility (Ade's Objection)**
  Ade raised concerns about assigning "desert" across time. While metaphysical debates on identity are outside our remit, administrative rules require a consistent entity to hold liability. The law treats the household as a continuous entity for claims purposes. We do not need to solve the problem of the persisting self to verify whether an evacuation notice was received and ignored. We can implement this on Monday morning.

  **Claimant Equity**
  Compliant claimants are angry that neighbors who ignored warnings receive nearly full compensation. A flat 20% haircut feels arbitrary to them. By tying the deduction to proven neglect (ignored advisories), we address their equity concerns without violating the statute. Those who took reasonable precautions are not subsidized by those who didn't.

  **Recommendation**
  Adopt the amended rule below. This balances statutory duty, respect for agency, and public equity.

  **Motion Text**
  "That the Board approves staff's 20% contributory neglect deduction only for households where records confirm ignoring two or more evacuation advisories; claims based solely on floodway location shall be paid to the habitable standard without deduction."

