      *Actually, the strongest tension is between 1 ("couldn't help it is bad faith") and 3 ("relapse isn't just choices").* If relapse isn't a choice, then saying "I couldn't help it" is true, not bad faith.
      *Resolution:* The "not just choices" phrasing in 3 is the key. It implies *some* choice remains. The revision needs to highlight that "not just" vs "not at all."

      *Let's rank:*
