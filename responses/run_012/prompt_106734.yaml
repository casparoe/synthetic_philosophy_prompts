  *   I need to explicitly address this. In classical logic, yes. In probability/epistemology, often no. The "Adams' Thesis" or the idea of conditional probability as the probability of the conditional is relevant here, though maybe too technical. I'll stick to the "learning" aspect. Learning $A \to B$ makes $\neg A$ more likely if we treat it as a material conditional, which is often absurd.

