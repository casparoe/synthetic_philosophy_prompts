answer: |-
  Your friend is right that taxonomy is constructed, so you must adopt a transparent procedure that separates evidence of evolutionary independence from policy judgments about conservation value.

  ### The Decision Procedure

  This protocol adapts the U.S. Endangered Species Act's "Distinct Population Segment" (DPS) policy but makes the value judgments explicit. It moves from empirical questions (nature) to policy questions (values).

  **Step 1: Discreteness (Empirical)**
  *   **Question:** Is the population markedly separate from other populations of the same taxon?
  *   **Evidence:** Fixed genetic differences, distinct morphology, or occupation of a unique ecological setting (e.g., different watershed, elevation, prey).
  *   **Stop Condition:** If there is no evidence of separation (panmixia, identical morphology, same ecology), stop. **Decision: No Protection.**
  *   **Pass:** Move to Step 2.

  **Step 2: Independence (Empirical)**
  *   **Question:** Is the population evolving separately from other populations?
  *   **Evidence:** Barriers to gene flow (physical or behavioral), evidence of selection maintaining differences despite gene flow, or monophyly in genomic data.
  *   **Stop Condition:** If gene flow is unrestricted and no selection is maintaining distinct traits (i.e., differences are swamped), stop. **Decision: No Protection** (as a species/subspecies; may still qualify as DPS if Step 3 passes).
  *   **Pass:** Move to Step 3.

  **Step 3: Significance (Value Hand-Off)**
  *   **Question:** If this population is lost, does it matter to the evolutionary legacy or ecological function of the taxon?
  *   **Evidence:** Does it occupy a unique ecological setting? Would its loss create a significant gap in the taxon's range? Is it the only surviving representative of a lineage?
  *   **The Hand-Off:** Science cannot answer "does it matter?" This is where the committee votes based on risk tolerance and conservation philosophy (e.g., "Do we prioritize unique genes or unique ecological roles?").
  *   **Pass:** Move to Step 4.
  *   **Fail:** **Decision: No Protection.**

  **Step 4: Diagnosability (Administrative)**
  *   **Question:** Can enforcement officers distinguish this population from non-protected populations in the field?
  *   **Evidence:** Morphological keys, geographic boundaries, or reliable genetic tests available within regulatory timeframes.
  *   **Stop Condition:** If the population cannot be reliably identified without destroying the specimen or sequencing entire genomes, **Decision: No Protection** (practical impossibility).
  *   **Pass:** **Decision: Recommend Protection.**

  ### Running the Cases

  **1. The Cryptic Bat (Identical morphology, distinct call, weird mtDNA)**
  *   **Step 1 (Discreteness):** **Pass.** The echolocation call constitutes a behavioral/ecological barrier; the mtDNA suggests historical separation.
  *   **Step 2 (Independence):** **Pass.** Distinct calls usually prevent mating (behavioral isolation), implying separate evolution despite morphological stasis.
  *   **Step 3 (Significance):** **Value Hand-Off.** Committee must decide if acoustic divergence warrants protection without morphological backing. Given the call prevents gene flow, most committees accept this as evolutionary independence.
  *   **Step 4 (Diagnosability):** **Pass.** Calls can be recorded and analyzed non-invasively.
  *   **Verdict:** **Recommend Protection** (likely as DPS or Subspecies).

  **2. The Hybridizing Salamander (Contact zone, free hybridization)**
  *   **Step 1 (Discreteness):** **Pass.** They meet at a zone, implying distinct populations elsewhere.
  *   **Step 2 (Independence):** **Fail.** "Hybridize freely" implies gene flow is unrestricted across the contact zone. Without evidence that selection is maintaining distinct traits despite this flow (e.g., hybrid breakdown), they do not constitute separately evolving lineages under the Biological Species Concept. They are one lineage with geographic variation.
  *   **Verdict:** **Do Not Recommend Protection** (as species/subspecies).
      *   *Note:* This is the case where your desire to protect them clashes with the procedure. You could attempt a DPS listing if the specific population segment is discrete from others *outside* the contact zone, but as a taxonomic species, the evidence of independent evolution is broken by the gene flow.

  **3. The Desert Fish (Distinct morphology, genetically nested)**
  *   **Step 1 (Discreteness):** **Pass.** Morphologically obvious differences.
  *   **Step 2 (Independence):** **Pass.** Genetic nesting (paraphyly) is common in recent radiations (incomplete lineage sorting). If morphology is distinct and stable, it suggests strong selection maintaining the form despite recent common ancestry.
  *   **Step 3 (Significance):** **Value Hand-Off.** Committee must weigh morphological adaptation against genetic data. Preserving unique adaptations (morphology) is usually weighted heavily in conservation.
  *   **Step 4 (Diagnosability):** **Pass.** Morphology is visible in the field.
  *   **Verdict:** **Recommend Protection** (as Species).

  ### Limitations and Uncertainty

  **What Would Change My Mind**
  I would flip the **Salamander** verdict if genomic sequencing revealed "islands of divergence"—specific genomic regions under strong selection that remain distinct despite the free hybridization in neutral markers. This would indicate that while they *look* like they are merging, natural selection is actively maintaining them as separate evolutionary units (speciation with gene flow). If that evidence exists, Step 2 becomes a Pass.

  **Where My Reasoning Is Weakest**
  The procedure relies heavily on **Step 4 (Diagnosability)** as a hard stop, which is pragmatic but scientifically uncomfortable. It prioritizes enforceability over biological reality. Additionally, the **Desert Fish** verdict risks protecting phenotypic plasticity rather than genetic lineage; if the morphological difference is purely environmental (e.g., diet-induced) and not heritable, the protection is biologically meaningless. Without a common garden experiment or heritability estimate, Step 2 is partially assumed for the fish.

  **The "Astrology" Critique**
  Your friend is correct that no procedure resolves the ontological status of species. This procedure does not find "truth"; it standardizes how you apply uncertainty. By forcing the committee to vote on Step 3 (Significance) explicitly, you acknowledge that the decision is partly about values, not just facts, which protects the agency from accusations of hiding policy choices behind scientific jargon.
