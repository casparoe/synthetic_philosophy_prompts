prompt: |-
  I work in the listing unit of a state wildlife agency — we get petitions to protect particular populations, and the whole thing hinges on wether we call the population a species, a subspecies, or a "distinct population segment," because that label is basically what decides whether it gets legal protection at all. I got into a long argument about this with a friend of mine who's a systematist at a university museum; she thinks the way we do it is astrology, since there's no one true species concept and the choice between them is doing a lot of hidden work, and honestly she half-convinced me. But we still have to sign off on these petitions, usually within a couple of weeks, in front of a five-person committee, and nobody on that committee is a taxonomist except her, on loan. We get maybe three or four petitions a year, but each one is a year of somebody's life and a real chunk of management budget, so I don't want to just wave them through on vibes.

  So what I want from you is a decision procedure we could actually run, in order, on a petition: the questions to ask, what counts as a good enough answer to each, where the procedure stops with a clean no, and — this is the part I care most about — where it has to hand the decision to a person because the remaining question is about values rather than about nature (how much divergence is "enough," how much weight we give to preserving the possibility of future evolutionary change, whether we're willing to be splitters or lumpers, whether the label is really a conservation tool rather than a fact about the world). Ground it in whatever the species literature actually establishes — the competing concepts, the difference between a group being diagnosable and its being a separately evolving lineage, the fact that lots of species are paraphyletic with respect to each other — but keep it usable by someone whose last biology class was in college. The cases that break us: a bat that looks identical to a neighboring bat but has a distinct echolocation call and one weird mitochondrial lineage; two salamander populations that meet along a contact zone and hybridize freely right where they meet; and a desert fish that's obviously its own thing morphologically but genetically sits nested inside another, more widespread species. Run the procedure on all three, including whichever one comes out telling me the population I personally want to protect doesn't qualify. Be upfront about what the procedure can't do and where it's most likely to misfire.

  Two things about the answer. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back at me. And tell me what would change your mind: which argument or piece of evidence would push you toward a different procedure or flip one of the three calls, and where your own reasoning is weakest.
