  (a) **0.90** — Current $\Lambda$CDM data strongly favors a positive cosmological constant and eternal expansion, which provides the time and volume for fluctuations, though vacuum decay remains a wildcard.

  (b) **0.50** — The measure problem is unresolved; while many proposed measures suppress BBs, we lack a derivation from first principles that definitively rules out the "proper time" measure that generates them.

