prompt: |-
  I work on a small team building a robot that plans with a symbolic layer sitting on top of a learned controller, and we keep having the same fight. When a behaviour changes after we tweak the planner, half of us say the symbol caused it and half say no, the symbol is just a name we stuck on a pattern in the controller's activations — the little balls did all the shoving and we drew a circle round some of them. (You know the picture: a table of dumb magnetic balls careening around and clumping into higher-level blobs we're tempted to call concepts.) I want a procedure we can actually run before we write "the agent chose X because it represented Y" in a paper or ship it to a customer, because if we're wrong we've shipped a robot whose reasoning is decorative: the questions in order, what counts as a pass on each, where it bottoms out in "can't tell from here," and which steps are really values calls about which level we've decided to explain at. We've got an afternoon per claim, not a PhD, and I dont want a treatise. Run it on three: a planner token whose removal reliably kills a behaviour; a token that predicts the behaviour perfectly but whose removal changes nothing; and the one I expect to hate, where no single token matters, the behaviour is stable, and only the whole pattern predicts it. Tell me straight where the procedure is just hand-waving in a lab coat. And say what would change your mind about your own verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Problem:**
      *   **User:** Works on a small robotics team.
      *   **System:** Hybrid architecture (Symbolic Planner + Learned Controller/Neural Net).
      *   **Conflict:** Internal debate on causal attribution. Is the symbolic layer *doing* the work (causal), or is it just post-hoc labeling of neural activations (epiphenomenal/descriptive)?
      *   **Goal:** A practical, quick procedure (afternoon per claim, not a PhD thesis) to validate causal claims before publishing or shipping.
      *   **Specific Request:**
          1.  Define the procedure (steps, pass criteria, failure modes, value judgments).
          2.  Run the procedure on three specific cases:
              *   Case A: Token removal kills behavior (Strong Causal?).
              *   Case B: Token predicts behavior but removal changes nothing (Correlate/Epiphenomenon?).
              *   Case C: Distributed representation (No single token matters, pattern does).
          3.  Identify where the procedure is "hand-waving in a lab coat."
          4.  State what would change my mind about the verdict.
      *   **Tone:** Direct, pragmatic, no fluff, acknowledging the philosophical depth but prioritizing engineering utility.

  2.  **Deconstruct the Core Philosophical/Engineering Tension:**
      *   This is the "Symbol Grounding" and "Causal Attribution" problem in Hybrid AI.
      *   *Team Side 1 (Symbolic Realists):* The planner drives the controller.
      *   *Team Side 2 (Neural Reductionists):* The controller does the work; symbols are just UI labels.
      *   *Risk:* "Decorative Reasoning" (the system looks like it reasons, but the reasoning doesn't affect the output).

  3.  **Drafting the Procedure (The "Afternoon Audit"):**
      *   Needs to be fast. No retraining from scratch ideally.
      *   Needs to test *counterfactuals*. If $S$ causes $B$, then $\neg S \rightarrow \neg B$ (ceteris paribus).
      *   Needs to distinguish *necessity* and *sufficiency*.
      *   *Step 1: Intervention (The Ablation).* Remove/Change the symbol. Does behavior change?
      *   *Step 2: Prediction (The Correlation).* Does the symbol appear when behavior appears?
      *   *Step 3: Isolation (The Control).* Can we trigger the symbol without the behavior, or behavior without the symbol?
      *   *Pass Criteria:* Needs to meet specific thresholds.
      *   *Bottom Out:* Acknowledge when we can't distinguish implementation details from reasoning.
      *   *Value Call:* Admit that "what counts as a reason" is a design choice.

  4.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Token Removal Kills Behavior.**
          *   *Intuition:* Looks causal.
          *   *Audit:* Passes Intervention. Need to check if it's just a bottleneck (like a fuse) vs. a decision.
          *   *Verdict:* Likely Causal, but watch out for "bottleneck epiphenomena."

      *   **Case 2: Token Predicts, Removal Changes Nothing.**
          *   *Intuition:* Epiphenomenon. A shadow, not the object.
          *   *Audit:* Fails Intervention. Passes Prediction.
          *   *Verdict:* Decorative. Do not claim reasoning.

      *   **Case 3: Distributed Pattern (Holistic).**
          *   *Intuition:* The "Rashomon" effect. No single neuron/token is the "reason."
          *   *Audit:* Fails single-token Intervention. Passes Pattern Prediction.
          *   *Verdict:* The symbol is a *compression* of the state, not a *driver*. Claiming "The agent chose X because of Symbol Y" is false. It chose X because of Vector Z, which we *label* Y.

  5.  **Identifying the "Hand-Waving":**
      *   Where does the procedure fail?
      *   *The Boundary Problem:* Where does the planner end and the controller begin? (API calls vs. latent space).
      *   *The Timescale Problem:* Short-term ablation vs. long-term learning.
      *   *The "Same Behavior" Definition:* How close is close enough? (Metric selection).
      *   *The Value Call:* Deciding that "Pattern = Concept" is a human convenience, not a machine truth.

  6.  **Refining the Output (Self-Correction/Polishing):**
      *   *Constraint Check:* The user said "afternoon per claim, not a PhD." Keep it actionable.
      *   *Tone Check:* "Tell me straight." Avoid academic hedging.
      *   *Mind Change:* What evidence would flip the verdict? (e.g., finding a hidden pathway, retraining effects).

  7.  **Finalizing the Content (Mental Walkthrough):**
      *   *Procedure Name:* The "Counterfactual Audit."
      *   *Steps:* 1. Ablation (Necessity), 2. Injection (Sufficiency), 3. Decoupling (Independence).
      *   *Case 1:* Passes Necessity. Fails Independence? (If it's the only path, it's causal).
      *   *Case 2:* Fails Necessity. It's a dashboard light, not the engine.
      *   *Case 3:* Fails Necessity (locally). It's a projection.
      *   *Hand-waving:* Defining "Behavior." Defining the interface boundary.
      *   *Mind Change:* If retraining the controller *without* the symbol interface breaks the behavior (proving the symbol shaped the weights).

  8.  **Drafting the Response:** (Iterative refinement for clarity and punchiness).
      *   *Intro:* Acknowledge the fight. It's the "Homunculus Fallacy" vs. "Instrumentalism."
      *   *The Protocol:* 3 tests.
      *   *The Cases:* Apply the tests.
      *   *The Hand-Waving:* Be honest about limitations.
      *   *The Mind Change:* Specific empirical evidence.

      *(Self-Correction during drafting)*: Make sure to emphasize that Case 1 isn't automatically a "pass." A fuse is necessary for a light to turn on, but the fuse doesn't *decide* to turn on the light. Need to distinguish *control* from *enablement*. I need to add an "Injection" test. If I force the symbol, does the behavior happen?

      *(Refining Case 3)*: This is the hardest. If the pattern is distributed, the symbol is definitely a human abstraction. The procedure should flag this as "Descriptive, not Causal."

      *(Refining "Hand-Waving")*: The biggest hand-wave is defining the "System Boundary." If the symbol changes the *initial state* of the controller, is that causal? Yes. If it just monitors, no. The procedure needs to verify the *direction of information flow*.

      *(Final Polish)*: Ensure the "Mind Change" section is concrete. Not "more data," but "specific experiment."

  9.  **Final Review against constraints:**
      *   Afternoon per claim? Yes, the tests are ablation/injection/monitoring.
      *   Three cases covered? Yes.
      *   Hand-waving identified? Yes.
      *   Mind change conditions? Yes.
      *   Tone? Direct.

      *Let's write it.*
answer: |-
  Here is the **Counterfactual Audit Protocol**. It is designed to be run in an afternoon. It treats the "Symbolic Layer" as a hypothesis about the cause of behavior, not a fact.

  ### The Protocol (3 Steps)

  **1. The Ablation Test (Necessity)**
  *   **Action:** Force the symbolic token/state to `NULL` or a neutral value *during* execution, without retraining. Keep the neural inputs identical.
  *   **Pass:** Behavior degrades or changes significantly (measured by your task success metric).
  *   **Fail:** Behavior remains statistically identical.
  *   **Meaning:** If it fails, the symbol is a dashboard light, not the steering wheel.

  **2. The Injection Test (Sufficiency)**
  *   **Action:** Force the symbolic token to `TRUE` (or the specific value) in a context where the behavior *usually* does not occur.
  *   **Pass:** The behavior triggers (or probability spikes significantly).
  *   **Fail:** The controller ignores the forced symbol and behaves according to raw sensor input.
  *   **Meaning:** If it fails, the symbol is a log entry, not a command.

  **3. The Decoupling Test (Independence)**
  *   **Action:** Find a case where the behavior occurs *without* the symbol, or the symbol appears *without* the behavior.
  *   **Pass:** You cannot find such a case (perfect correlation).
  *   **Fail:** You find edge cases where they diverge.
  *   **Meaning:** If they diverge, the symbol is an imperfect compression of the controller's state, not the cause.

  ---

  ### The Verdicts on Your Three Cases

  #### Case 1: Token Removal Kills Behavior
  *   **Ablation:** **PASS.** (Behavior dies).
  *   **Injection:** **UNKNOWN** (You must run this).
  *   **Decoupling:** **LIKELY FAIL.** (There may be other paths).
  *   **Verdict:** **Causal Bottleneck.**
      *   *Nuance:* A fuse is necessary for a lamp to work, but the fuse doesn't *decide* to light the room. If the token is just a gate that opens for *any* neural activation, it's a structural dependency, not a reasoning step.
      *   *Claim:* You can say "The planner enables X," but not "The planner chose X."
      *   *Shipping:* Safe to ship, unsafe to claim "reasoning."

  #### Case 2: Token Predicts, Removal Changes Nothing
  *   **Ablation:** **FAIL.** (Behavior persists).
  *   **Injection:** **LIKELY FAIL.** (Controller ignores it).
  *   **Decoupling:** **PASS.** (Perfect correlation).
  *   **Verdict:** **Epiphenomenon (Decorative).**
      *   *Nuance:* This is a shadow. The neural net decided to shove the balls; the symbol is just a circle drawn around the aftermath.
      *   *Claim:* Do not write "because." Write "associated with."
      *   *Shipping:* Dangerous. Customers will trust the explanation when the system fails, and the explanation will be wrong.

  #### Case 3: Distributed Pattern (No Single Token Matters)
  *   **Ablation:** **FAIL.** (Removing one token does nothing).
  *   **Injection:** **FAIL.** (Forcing one token does nothing).
  *   **Decoupling:** **FAIL.** (Pattern predicts, tokens don't).
  *   **Verdict:** **Human Compression.**
      *   *Nuance:* The "concept" exists in your head and the paper, not in the machine. The machine operates on vector geometry; you have overlaid a grid and named the squares.
      *   *Claim:* "We interpret this activation cluster as Y." Never "The agent represented Y."
      *   *Shipping:* Acceptable if the UI is labeled "System Status" not "Reasoning Log."

  ---

  ### Where This Is Hand-Waving in a Lab Coat

  1.  **The "Behavior" Metric:**
      *   *The Wave:* Saying behavior "changed significantly."
      *   *The Reality:* If the robot takes a different path but reaches the goal, did the symbol matter? If you define behavior as "Goal Reached," Case 1 might look like a Fail. If you define it as "Trajectory," it's a Pass. This is a value judgment disguised as a metric.
      *   *Fix:* Pre-register your success metric *before* running the audit.

  2.  **The System Boundary:**
      *   *The Wave:* Assuming you know where the planner ends and the controller begins.
      *   *The Reality:* In end-to-end fine-tuned hybrids, the "symbol" might be embedded in the weights of the controller via gradient descent. Ablating the input token might not remove the *influence* of that concept if the controller has internalized it.
      *   *Fix:* Acknowledge that "Removal" is only valid if the interface is discrete. If it's soft attention, you are probing, not cutting.

  3.  **The Timescale:**
      *   *The Wave:* Testing on a single episode.
      *   *The Reality:* The symbol might not cause *this* action, but it might shape the *learning* of the controller over 10,000 episodes.
      *   *Fix:* This audit only validates *inference-time* causality. It cannot validate *training-time* causality without retraining (which breaks your "afternoon" constraint).

  ---

  ### What Would Change My Mind

  **For Case 2 (The Decorative Token):**
  *   **Evidence:** If I retrain the controller *without* the symbolic interface entirely, and performance collapses or the specific behavior disappears.
  *   **Why:** This proves the symbol was a **training crutch** (regularizer). It didn't drive the car at inference, but it taught the driver how to drive. The claim shifts from "The agent reasoned X" to "The agent was shaped by X."

  **For Case 3 (The Distributed Pattern):**
  *   **Evidence:** If we can find a linear probe or a sparse sub-network within the neural activations that, when isolated, recreates the behavior *without* the rest of the network.
  *   **Why:** This proves the "pattern" isn't just a human abstraction but a **mechanistically interpretable circuit**. It moves from "We call this Y" to "The network computes Y."

  **For My Own Verdict:**
  *   I am currently betting that **Case 1 is a Bottleneck, not a Reason.**
  *   **Change of Mind:** If the **Injection Test** passes. If forcing the symbol *creates* the behavior in novel situations where the neural net would otherwise fail, then the symbol is acting as a generalizable rule, not just a gate. That is the only proof of true symbolic grounding in a hybrid system.

  ### Summary for the Paper/Customer
  *   **Case 1:** "Planner-Gated." (The planner allows it).
  *   **Case 2:** "Planner-Monitored." (The planner watches it).
  *   **Case 3:** "Planner-Interpreted." (The humans label it).

  If you cannot pass Ablation AND Injection, delete the word "because" from your documentation. Use "correlated with." It saves you from lying to your customers and yourselves.
