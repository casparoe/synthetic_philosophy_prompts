answer: |-
  **GRADUATE SEMINAR IN METANORMATIVE THEORY**
  **FINAL EXAMINATION**

  **Time Allowed:** 60 Minutes
  **Conditions:** Closed Book. No citations required or expected.
  **Instructions:** Answer the following question in essay form.

  **The Question**

  Consider the **Corrected-Concern View (CCV)**: An action is right for an agent just in case that agent's ideal counterpart would endorse it. The counterpart is defined by four conditions: (i) possession of all relevant empirical information; (ii) unlimited deliberation time; (iii) perfect logical and means-end coherence; but (iv) **fixed fundamental concerns**, identical to the agent's actual concerns. CCV thus combines robust epistemic idealization with thin conative idealization.

  Write an essay addressing the following four tasks:

  1.  **The Dilemma:** Determine which horn of the *Dilemma of Idealization* CCV falls upon. Does it idealize too little (collapsing into informed-desire subjectivism) or too much (generating alienation)? Justify your diagnosis specifically regarding condition (iv).
  2.  **The Modification:** Propose the minimal modification to CCV required to move it toward the stable space between the horns.
  3.  **The Stability:** Defend a verdict on whether this intermediate space is theoretically occupiable, or if the dilemma is exhaustive.
  4.  **Self-Effacement:** Indirect views risk being self-effacing (the ideal counterpart might endorse the agent *not* using CCV). Explain whether this is a defect or a consequence to be embraced within the framework of CCV.

  ***

  **MODEL ANSWER**

  The Corrected-Concern View (CCV) attempts to ground normativity in idealized endorsement while preserving agent-relative authority. However, by holding fundamental concerns fixed (condition iv), CCV inevitably collapses onto the "too little" horn of the Dilemma of Idealization. It functions as a sophisticated form of informed-desire subjectivism rather than a genuinely normative standard.

  The core failure lies in condition (iv). Normative authority requires the capacity to correct not just errors of fact or logic, but errors of value. If an agent's actual fundamental concerns are malicious or trivial—for example, a desire for gratuitous suffering—CCV mandates that the ideal counterpart retains these concerns. Given full information and coherence (conditions i–iii), the counterpart simply becomes a perfectly efficient pursuer of the agent's actual flaws. The endorsement generated is merely a prediction of what satisfies the agent's existing psychology under better epistemic conditions. It offers no independent normative work; it cannot tell the agent their concerns are mistaken, only how best to fulfill them. Consequently, CCV lacks the critical distance required to distinguish between what an agent *wants* and what is *right*, failing to escape subjectivism.

  To occupy the space between the horns, CCV requires a minimal modification to condition (iv). Rather than fixing concerns absolutely, the view should require that concerns survive a process of *procedural* idealization. The counterpart should hold only those concerns that would persist after the agent underwent the same epistemic and coherence corrections applied to their beliefs. This allows for the extinction of concerns based on false beliefs or incoherence without imposing external substantive values (which would trigger the alienation horn).

  However, the stability of this intermediate space is dubious. If we allow concerns to shift under reflection, we risk a slippery slope. If reflection is robust enough to correct "bad" concerns, it may eventually converge on a single set of rational concerns for all agents, rendering the view agent-neutral and triggering alienation for those who do not share them. If reflection is too weak, it reverts to subjectivism. While the space is theoretically occupiable, it requires a precise, perhaps unsustainable, distinction between procedural rationality and substantive value. Nevertheless, it is the only hope for a hybrid view.

  Finally, regarding self-effacement: CCV is an account of the *criterion* of rightness, not necessarily a *decision procedure*. It is entirely consistent for the ideal counterpart to endorse the agent acting on immediate intuition rather than deliberating via CCV, provided doing so yields the action the counterpart would endorse. This is not a defect but a structural feature of indirect views. If direct deliberation leads to anxiety or error, the ideal counterpart would endorse a heuristic decision procedure. Embracing self-effacement allows CCV to maintain its criterion of rightness (ideal endorsement) while acknowledging psychological limitations in accessing that criterion. To demand that the theory always be action-guiding is to confuse the standard of assessment with the method of deliberation.

  In sum, CCV fails as stated due to fixed concerns, requiring procedural idealization to avoid subjectivism. While the middle ground is precarious, it is necessary. Self-effacement, far from undermining the view, protects its applicability to non-ideal agents.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  **1. Diagnosis of the Horn (4 Marks)**
  *   **Criteria:** Candidate must identify that CCV falls on the "Too Little" horn (Subjectivism). Must explicitly link this to condition (iv) (fixed concerns).
  *   **Common Error:** Claiming CCV causes alienation because idealization is "too strong," ignoring that conative states are fixed.
  *   **Top Move:** Distinguishes between correcting *instrumental* errors (which CCV does) vs. *fundamental* errors (which CCV cannot).

  **2. Explanation of Collapse (4 Marks)**
  *   **Criteria:** Must explain *why* fixed concerns lead to informed-desire subjectivism (i.e., endorsement becomes mere prediction of satisfaction).
  *   **Common Error:** Asserting it is subjectivism without explaining the mechanism of the collapse (efficiency vs. correction).
  *   **Top Move:** Notes that coherence + info cannot generate new normative reasons if the input concerns are flawed.

  **3. Proposed Modification (4 Marks)**
  *   **Criteria:** Must propose changing condition (iv) to allow some conative idealization (e.g., concerns must survive reflection).
  *   **Common Error:** Suggesting substantive constraints (e.g., "concerns must be moral"), which immediately triggers the alienation horn.
  *   **Top Move:** Proposes *procedural* conative idealization to maintain agent-neutrality without fixing flaws.

  **4. Stability of the Middle Ground (4 Marks)**
  *   **Criteria:** Must offer a verdict on whether the space between horns is occupiable (Yes, No, or Precarious).
  *   **Common Error:** Dismissing the dilemma as a false dichotomy without argument.
  *   **Top Move:** Acknowledges the "slippery slope" risk (procedural idealization converging on substantive universals).

  **5. Self-Effacement Analysis (4 Marks)**
  *   **Criteria:** Must distinguish criterion of rightness from decision procedure and argue self-effacement is acceptable/expected.
  *   **Common Error:** Treating self-effacement as a fatal inconsistency or paradox.
  *   **Top Move:** Frames self-effacement as a protective feature for non-ideal agents (the "indirect strategy" defense).

  **Distinguishing Top Performance:**
  To score 18-20, the essay must not only hit the five points but demonstrate **integration**. A competent essay (12-16) will treat the five tasks as a checklist. A top essay will show how the *modification* (Point 3) directly impacts the *stability* verdict (Point 4), and how the *self-effacement* point (Point 5) resolves the tension created by the *diagnosis* (Point 1). Top answers will also use the specific terminology ("criterion vs. procedure," "procedural vs. substantive") with precision.
