prompt: |-
  Ok so I'm a third-year PhD student working on early modern philosophy of education, and my current chapter is on Sor Juana's defense of women's education — the 1691 reply to the bishop of Puebla, who had published his scolding under the name "Sor Filotea de la Cruz." What I love about that text is that it isn't a rant, it's a piece of maneuvering: she opens by conceding obedience to him, agrees that she shouldn't be pronouncing on sacred matters, and only then turns and builds the real case — that the sciences are a ladder, that you can't reach Scripture without logic, rhetoric, physics and history underneath you, so a prohibition on women reading theology is really a prohibition on women reading anything; that the rule about women keeping silent in church is a matter of local decorum and circumstance rather than capacity, since women have been learned and have even instructed men before (she names Hypatia); and that her appetite for study is itself something God put in her, so ordering her to quit it is ordering her to fight her own maker. Anyway, my department has a work-in-progress session on Thursday and I have to open it, and I'd honestly rather open with a poem than with another slide of my own prose.

  So — could you write me a décima espinela in her voice, addressed to the bishop hiding behind "Sor Filotea"? Ten lines, roughly eight syllables each, rhyme abbaaccddc; English is fine, I'd much rather it actually scan in English than have you fake Spanish at me. The form should be doing the arguing: the opening quatrain is the concession, the turn at line five — where the opening rhyme comes back around — is where she stops giving ground and starts building, and the last four lines should land the ladder-of-disciplines point so I don't have to explain it afterward. Someone who reads Sor Juana for a living should recognize the shape and the actual argument, not just the name; someone who's never heard of her should still get a decent poem out of it. Please don't quote her real verse anywhere, and don't put her lines in quotation marks as if you were recalling them — I know the poems, I just want you writing in the register — and obviously no citations or reading list.

  Then give me exactly five numbered notes, one or two sentences each, no introduction and no wrap-up, on the choices you made — why the vuelta sits where it does, what each rhyme family is carrying, and whatever else is actually worth saying about how the form is doing the philosophy here.
