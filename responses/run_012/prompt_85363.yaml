answer: |-
  The Archive smelled of ozone and old polymer, the specific scent of data kept too cold for too long. Elara ran a gloved finger along the server rack, feeling the vibration of the Ledger. It hummed, a constant, low-frequency thrum that she had listened to for forty years. It was the sound of the world counting its own bruises.

  Kael stood behind her, holographic tablet in hand, buzzing with impatient energy. He was thirty, bright-eyed, and writing the introduction to *The End of Blood*, the definitive history of the Pacification Century.

  "It's there, Elara," Kael said, gesturing at the air where he'd projected the curve. "Look at the slope. From 2050 to 2100, the trajectory is undeniable. We tamed the impulse."

  Elara didn't look at the slope. She looked at the metadata tags scrolling along the bottom. "You're looking at the absolute count."

  "Everyone looks at the absolute count," Kael said. "It's the most honest number. How many violent events occurred? Fewer occurred. Therefore, less violence."

  "Fewer occurred because there were fewer people to commit them." Elara tapped the console. The hologram shifted. A second line appeared, jagged and steep, plummeting downward around 2062. "The Great Thinning. Plague, crop failure, the water wars. We went from ten billion to three billion in eight years. Of course the raw count of assaults dropped. If you lock everyone in separate rooms, the assault rate drops to zero. That doesn't mean everyone became peaceful. It means the sample size collapsed."

  Kael sighed, swiping the second line away. "That's the per-capita argument. It's valid, but it's cynical. It ignores the cultural shift. Even adjusted for population, the *types* of violence changed. We stopped doing wars. We started doing... containment."

  "Containment," Elara repeated. She turned to face him. She was old enough to remember when the Ledger was a public promise, back in the 2030s. Now it was a tomb. "Let's talk about 2077."

  Kael stiffened. "The Amendment."

  "The Bookkeeping Shift," Elara corrected. "Prior to 2077, the Ledger recorded active violence. Ballistic impact, blunt force, thermal injury. In 2077, the Council added Category 9: Deaths from Deliberately Maintained Deprivation."

  "Because it *was* violence," Kael said, his voice hardening. "Withholding medicine. Poisoning the aquifer and knowing it. That is violence. Before 2077, we were blind to it. The Amendment didn't create violence; it created visibility."

  Elara walked to the center of the room, where the main display hovered. "Show me the headline."

  Kael hesitated, then pulled up an archive feed from 2078. The text floated in bold, glowing orange: **VIOLENCE SPIKES 40% FOLLOWING NEW ACCOUNTABILITY MEASURES.**

  "The public saw that," Elara said. "They panicked. They thought the streets were running with blood. But the streets were quiet. The only thing that changed was a definition in a database in Geneva."

  "But the bodies were real," Kael shot back. "My grandfather died in the Water Scare. He drank from a tap the municipality knew was toxic. They didn't fix it because the filters were allocated to the Upper Zone. Under the old Ledger, he died of 'natural causes' or 'accidental ingestion.' Under the new Ledger, he was a homicide victim. Which version of my grandfather is the truth?"

  Elara softened. She knew Kael's history; everyone in the Archive did. "The truth of his death doesn't change, Kael. But the trend line does. You want to write a book about the decline of violence. But you're using a ruler that changed length halfway through the measurement. You can't compare 2050 to 2090 because the instrument was recalibrated."

  "Or," Kael said, stepping closer, "you can argue that the instrument was finally corrected. Look, Elara, I know you love the purity of the data. I know you want a constant proxy, like your ice cores. But morality isn't static. If we realize that starvation is violence, then ignoring it was the error, not counting it. If I measure temperature with a thermometer that ignores humidity, and then I switch to one that accounts for heat index, the reading goes up. Does that mean the weather got hotter, or that I finally understand heat?"

  Elara paused. That was good. She had to admit it. He wasn't arguing from ignorance; he was arguing from moral evolution.

  "That's a strong position," Elara said quietly. "You're saying the decline of violence is real because our definition of violence expanded to match the reality of suffering. The data jump in 2077 isn't noise; it's a correction of a previous blind spot."

  "Exactly," Kael said. "If you keep the old definition, you're saying those deaths didn't matter. You're preserving the integrity of the graph at the cost of the truth."

  "And if you change the definition," Elara countered, "you lose the ability to measure change over time. You can't say violence is declining if you keep moving the goalposts of what counts as a score. You're not measuring history; you're measuring our changing conscience."

  The door chimed. Tomas walked in. He was older than Kael, younger than Elara, wearing the grey utilities of the Water Reclamation sector. He didn't look at either of them. He looked at the server rack.

  "Tomas," Elara said. "We weren't expecting you."

  "I heard the projection," Tomas said, his voice rough. "You're arguing about the numbers again."

  "We're arguing about the meaning," Kael said.

  Tomas walked to the display where the 2077 spike glowed. "My mother died in 2076. December. The filters failed in Sector 4. The Council knew. They had the parts in storage in Sector 1. They didn't ship them. Cost-benefit analysis. Too few of us left down there to justify the transport fuel."

  He turned to Elara. "Under the Ledger then, she was 'Environmental Casualty.' Non-violent."

  He turned to Kael. "Under the Ledger now, she is 'Victim of Deliberate Deprivation.' Violent."

  "Does the category change bring her back?" Elara asked gently.

  "No," Tomas said. "But it changes who is guilty. If it's non-violent, it's a tragedy. An act of god, or nature, or logistics. If it's violent, it's a crime. It means someone chose for her to die."

  Kael nodded vigorously. "That's the point. The Ledger isn't just a counter. It's an accusation."

  "It's a dataset," Elara insisted, though her voice lacked its usual steel. "If it becomes an accusation, it loses its utility as a mirror. If I calibrate my spectrometer to show more lead because I want to convict the mining company, I'm not doing science. I'm doing prosecution."

  "But what if the spectrometer was broken?" Kael pressed. "What if the old science said lead wasn't toxic? Are we bound by the error of the past?"

  Tomas laughed, a dry, brittle sound. "You two. One wants to save the graph. One wants to save the soul. Meanwhile, the water still tastes like copper."

  He walked over to the console and typed in a query. He pulled up the raw event log for December 2076, Sector 4. There were hundreds of entries. *Cardiac arrest. Renal failure. Dehydration.*

  "In 2077," Tomas said, "you people sat in a room and decided these words meant 'Violence.' You clicked a box. The global rate jumped twelve percent overnight. The news feeds screamed that society was collapsing. Riots started in the Upper Zones because they thought we were coming to kill them. We weren't coming to kill them. We were already dead."

  He looked at Elara. "You say the jump is an artifact. A measurement error."

  "I say it's a calibration shift," Elara corrected. "The signal was always there. The sensor just wasn't tuned to hear it."

  "And you," Tomas pointed at Kael. "You say the jump is justice."

  "I say it's honesty," Kael said.

  "It's both," Elara said suddenly. They both looked at her. She rubbed her temples. "Kael is right that the suffering was real and previously uncounted. The old Ledger had a detection limit. It couldn't see structural violence. Tomas is right that the classification changes the moral weight of the event. But I am right that it destroys the longitudinal study. You cannot have a continuous record of decline if you redefine the unit of measurement every time your ethics evolve."

  "So what do we do?" Kael asked. "Publish the book with the old data? Lie by omission?"

  "Publish with the annotation," Elara said. "Show the break. Show the seam."

  "People don't read footnotes," Tomas said. "They read headlines. They saw 'Violence Up.' They panicked. If you publish 'Violence Down, Except We Changed The Definition,' they'll just hear 'Violence Down.'"

  Kael lowered his tablet. "So the truth is unusable?"

  "The truth is multidimensional," Elara said. She walked back to the server, placing her hand on the cold metal again. "In my old life, before the Archive, I studied ice. We looked for CO2 spikes. Sometimes we found a wiggle. We spent years arguing if it was a volcanic event or just dust in the sensor. We never resolved half of them. We just published the uncertainty ranges."

  She turned back to them. "You want to say violence declined. You can. But you have to say: Violence, defined as active kinetic aggression, declined. Violence, defined as suffering inflicted by hierarchy, remained constant. Violence, defined per capita, remained constant. Violence, defined in absolute numbers, declined because humanity nearly went extinct."

  "That's not a conclusion," Kael said. "That's a evasion."

  "It's the only honest one," Elara said. "You want the decline to be a fact about the world. I'm telling you it's a fact about the Ledger. The world bled the same. We just changed the color of the ink we used to write it down."

  Tomas looked at the scrolling numbers. The red line of the 2077 spike still pulsed. "My mother doesn't care about the ink. But the people alive now... they need to know if the water is safe. If you tell them violence is down, they get complacent. They think the monsters are gone."

  "The monsters aren't gone," Elara said. "We just stopped counting their footsteps and started counting their shadows."

  Kael was silent for a long time. He looked at his manuscript, then at the Ledger. "If I write that... if I say the decline is partly an artifact of population collapse and partly a semantic shift... no one will read it. They want the story of progress. They need it."

  "Then write a story," Elara said. "Don't call it history."

  Kael flinched. "That's not fair. I'm using your data."

  "You're using my instrument," Elara said. "But you're interpreting the signal. That's on you."

  Tomas pushed off the console. "I have to get back to the filters. They're clogging again. Sector 7." He paused at the door. "Will that be in the Ledger?"

  "Only if someone reports it as intentional," Elara said.

  "It is intentional," Tomas said. "We don't have the parts. They know we don't have the parts. They send them anyway."

  He left. The door hissed shut.

  Kael looked at the empty doorway, then at Elara. "Category 9," he said. "Deliberately maintained deprivation."

  "Yes."

  "If I include the per-capita adjustment, and I annotate the 2077 shift... the trend line flattens. It doesn't go down. It just... stays horizontal. Roughly constant suffering, distributed over fewer people."

  "Until the next amendment," Elara said. "Next century, someone might decide that psychological stress is violence. The line will jump again."

  "Or someone might decide war is obsolete," Kael said. "And the line will drop."

  "Or," Elara said, "we'll just run out of people to count."

  They stood in the silence of the archive. The Ledger hummed, indifferent. It recorded the argument, the heat in the room, the carbon dioxide in their breath. It counted everything, provided you told it what to look for.

  Kael saved his file. He didn't close the projection. He let the two lines hang there—the raw count plummeting, the per-capita rate holding steady, the 2077 spike jagged like a broken tooth.

  "I'll write the footnotes," Kael said. "Big ones."

  "Make them legible," Elara said.

  "I'll try." He walked to the door. "Elara? Do you think we're better than them? The ones before the Thinning?"

  Elara looked at the server. The light blinked, steady, rhythmic. A heartbeat made of silicon.

  "I think we measure better," she said. "Whether that makes us better... the Ledger doesn't have a column for that."

  Kael nodded, once, and left.

  Elara stayed. She opened a new query window. She typed in *Sector 7, Water Filters, Status*. The system returned a value: *Operational.*

  She knew it was a lie. The sensors were lagging. The data was clean, but the water was not. She hovered her finger over the 'Flag Anomaly' command. It would create a new entry. It would spike the noise. It would ruin the smooth curve of the quarter.

  It would be honest.

  She pressed the key. The Ledger hummed, accepted the data, and continued counting.
