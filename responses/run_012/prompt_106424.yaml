answer: |-
  **The Opaque Gauge**

  **Scenario**
  Elena is a homeowner maintaining her swimming pool, tasked with ensuring the water chemistry is safe for swimming. She uses a handheld digital pH meter to check the acidity. The device has a single toggle switch labeled "Mode." In Mode A (Transparent), the screen displays the precise numerical pH value (e.g., "7.4"), requiring Elena to recall the safe range (7.2–7.6) and judge whether the water is balanced. In Mode B (Opaque), the screen suppresses the number and displays only a binary verdict: "SAFE" or "ADD CHEMICAL," based on an internal threshold comparison. Elena does not know the specific numbers associated with the verdicts; she trusts the device's judgment entirely. The device is an ordinary consumer artifact available at any pool supply store, and Elena is an ordinary adult with no specialized training in chemistry.

  **Analysis**
  **Criteria Verdicts:** In Mode B (Opaque), the **Parity Criterion** verdict is *Extended*. The device performs a comparison operation (judging if value X meets threshold Y); were Elena to perform this comparison internally using working memory and rules, we would count it as a cognitive act. Since the device performs this process, Parity includes it in the cognitive system. However, the **Complementarity Criterion** verdict is *Not Extended*. The device is doing work the internal machinery already does (evaluative judgment), thereby replicating rather than complementing the agent's cognitive contribution. In Mode A (Transparent), the verdicts converge: Parity says *Extended* (retrieving data is cognitive), and Complementarity says *Extended* (the device measures while the brain judges, dividing the labor).

  **The Toggle:** The feature driving the divergence is **Interpretive Opacity**. When this feature is switched off (Mode A), the external resource complements the agent's judgment, satisfying both criteria. When switched on (Mode B), the resource replicates the judgment, satisfying Parity but failing Complementarity. This shows that Parity is insensitive to the *distribution* of cognitive labor, while Complementarity is sensitive to it.

  **Removal Test:** The Removal Test yields *Not Part of the System* in both modes. If the meter is removed in Mode B, Elena's competence vanishes; she cannot judge pH at all. In Mode A, her competence is severely impaired; she lacks the data to apply her rule. This verdict survives the toggle. The reason is distinct from Complementarity: it rests on **fragility of competence** (the resource is a scaffold upon which ability depends, not a constituent of the ability itself) rather than functional replication. Since the test survives the toggle, the internalist need not fall back on alternative arguments here; the dependence argument holds regardless of the mode.

  **Criterion Choice:** If only one criterion could be kept, I would keep **Complementarity**. Parity leads to cognitive bloat in Mode B, labeling a "black box" judge as part of the mind simply because it mimics a mental act. Complementarity preserves the intuition that cognitive extension requires a coupled partnership where the agent and artifact bring different strengths to a task, preventing the dissolution of the agent into their tools.

  **Attack and Reply:** A Parity defender would argue that Complementarity is merely an intuition pump designed to save internalist prejudices, noting that if the process is functionally identical (Mode B), the location shouldn't matter. They would claim denying extension here arbitrarily privileges the biological skull. **Reply:** This ignores the *role* of the process within the system. In Mode B, the agent is passive relative to the judgment; the device is not an extension of Elena's mind, but a replacement for it. Complementarity correctly identifies that extension requires the agent to remain an active participant in the cognitive loop, not merely a recipient of a finished cognitive product.
