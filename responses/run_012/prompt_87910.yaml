answer: |-
  We are writing this down because we have spent the last year circling the same drain every Sunday at the kitchen table, and we both know that rehashing the argument without a map is just a way of performing our own convictions rather than testing them. We agree that we have been scoring the same facts against different scoreboards, and before we look at any new evidence, we need to record where we stand on what is actually at stake. We both affirm that political parties exert a measurable pressure on the thinking of the people inside them, shaping not just their votes but their perception of what is true or possible, and we agree that the claim about parties seeking growth without limit is an empirical claim that could be false rather than a theological axiom. If parties sometimes shrink, or sometimes prioritize purity over expansion, that is a fact we must accept, just as we must accept that they do coordinate people who would otherwise be isolated. The fundamental disagreement is not about whether parties exist or whether they have effects, but about the metric we use to judge them. I am operating on the metric of one person's grip on the truth, where the primary evil is the coercion of the individual mind into collective untruth, while my housemate is operating on the metric of a population's capacity to govern itself, where the primary evil is fragmentation that leaves power in the hands of those who already own platforms. We are both willing to admit that the other is describing something real, but we suspect we are over-generalizing from those realities to cover the whole of political life.

  The core of our disagreement lies in whether the lying is intrinsic to the party form or downstream of something contingent like mass membership, single-member districts, or the specific way parties turned into electoral machines in the twentieth century. On my side, I am asserting that the pressure to conform is not an accident but the engine, that belonging forces you into untruth as the price of membership, and that Simone Weil's alternative of loose journals and independent candidates is a real institutional proposal that could function if we stopped treating parties as necessary. On her side, she is asserting that the discipline I hate is exactly the mechanism that keeps a program honest from one election to the next, that the growth-seeking is what allows non-landowners to coordinate at scale, and that my alternative is a thought experiment meant only to purify our sense of what's wrong rather than a system that could survive contact with people who have dependents and jobs. She believes a world of independent candidates is either noise or rule by whoever already has a platform, and I believe a world of parties is a machine for manufacturing collective passion that ends in collective blindness. We are recording this divergence clearly because we want to know if we are fighting about the nature of organization or just about the specific history of the last hundred years.

  To move past this, we have identified the specific cases that bear on the crux, and we are each on record about which way we expect the evidence to come out before we look. She wants to point at how often a party-line vote is really the leadership's preference imposed on members who privately dissent, arguing that this shows the discipline is external and coercive rather than a genuine agreement, and she expects the data to show that members are regularly silenced to maintain the brand. I expect the data to show that when the label stops carrying any information at all, representation collapses into personality cults or wealth, and I want to point at what happens to policy continuity when candidates stand as themselves instead of as the bearer of some organization's line. We agree to look at instances where parties have fractured and instances where loose coalitions have governed, and we agree to treat the growth claim as falsifiable by looking for parties that deliberately capped their membership or influence to maintain coherence. If it turns out that parties can exist without the growth imperative, I must concede that the evil is contingent, and if it turns out that loose associations can coordinate scale without collapsing into noise, she must concede that the alternative is not a fantasy for the unencumbered.

  Finally, we have to acknowledge that at least one round of this was purely verbal, because we are not using the same definition of the word party. If party means the mass-membership thing Weil was surrounded by in mid-century Europe, then my description is accurate and her defense might be describing something else, but if party means any durable coalition that coordinates resources over time, then her description is accurate and my critique might be attacking a straw man. We agree that this distinction matters because if the problem is only the mass-membership model, then the solution is reform rather than abolition, but if the problem is any durable coalition, then the solution is indeed the radical looseness I am advocating. We are signing this to hold ourselves to the promise that we will not slide back into talking past each other, and that we will treat the other's position as a live hypothesis rather than a moral failing. We are doing this because we live together and because we both care more about getting the answer right than about winning the Sunday argument, and we agree that if we cannot find a way to reconcile the need for truth with the need for scale, we are not going to find it by ignoring either side of the equation.
