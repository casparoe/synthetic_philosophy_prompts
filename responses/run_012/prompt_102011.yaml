  Restate the Cartesian-theatre picture and the multiple-drafts picture, one at a time, as faithful as you can, in the vocabulary I actually use — global versus logical clocks, a single source of truth versus eventual consistency, the serialisation point, clients reading a log, that kind of thing. Then give me the residue report: which parts survive the translation cleanly, which you had to fudge or distort to make them fit, and — the bit I actually care about — what has no counterpart at all in my vocabulary.

