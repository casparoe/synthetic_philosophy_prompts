answer: |-
  Here is a move-by-move adjudication of the argument between R and S. I have separated the claims into mathematical facts (settled), standard theoretical interpretations (high consensus), and philosophical/ontological disputes (live interpretive issues).

  ### 1. The Arithmetic: Is Bottom Dominated?
  **Verdict:** R is mathematically correct. High confidence.

  R's calculation is sound. In the game you described, no *pure* strategy strictly dominates Bottom. Top loses to Bottom if the column player plays Centre (0 vs 1), and Middle loses to Bottom if the column player plays Left (0 vs 1).

  However, R correctly identified that a *mixed* strategy dominates Bottom. If the row player commits to a 50/50 probability distribution over Top and Middle:
  *   Against Left: Expected payoff is $1.5$ (better than Bottom's $1$).
  *   Against Centre: Expected payoff is $1.5$ (better than Bottom's $1$).
  *   Against Right: Expected payoff is $0$ (better than Bottom's $-1$).

  Because the mixed strategy yields a strictly higher expected payoff against *every* possible pure strategy of the opponent, Bottom is strictly dominated. The parallel claim regarding the column player's strategy Right is also arithmetically correct by symmetry.

  This is a standard result in game theory: to check for strict dominance properly, one must check against mixed strategies, not just pure ones. If you restrict dominance to pure-vs-pure, you fail to identify strategies that are irrational to play.

  ### 2. The Ontology: Is a Mixture an "Act"?
  **Verdict:** R is consistent with standard game theory; S is raising a philosophical objection that is generally set aside in this context. Moderate-to-High confidence on the standard view, but S's point is not nonsense.

  S's objection ("a mixture is not an act... you play Top or Middle... you don't play a coin flip") touches on the ontology of strategies.
  *   **The Standard View (R):** In non-cooperative game theory, a "strategy" is defined as a complete plan of action. A mixed strategy is a choice of a probability distribution over pure strategies. The "act" is the selection of the distribution (the decision to flip the coin), not merely the outcome of the flip. As long as the player has access to a randomization device (or private internal randomness), they can implement the mixed strategy. Since Bottom yields lower expected utility than the coin-flip plan regardless of what the opponent does, a rational expected-utility maximizer should not play Bottom.
  *   **S's Objection:** S seems to be arguing from a perspective where only deterministic choices at the moment of action count as "real" acts. This view has traction in some branches of decision theory (particularly those skeptical of randomization as a fundamental choice), but in the context of a game-theory reading group, it is non-standard.
  *   **Adjudication:** R's reply is the standard one. The availability of randomization is a standard assumption. If S believes randomization is impossible or irrational, they are arguing against the axioms of the model, not the internal logic of the dominance relation. Within the model R and S are using, R is right: the option to randomize is available, and therefore Bottom is irrational.

  ### 3. Strict vs. Weak Dominance
  **Verdict:** R is correct on the technical properties; S is correct that weak dominance is "messy," but wrong to imply this undermines strict dominance. High confidence.

  This is the clearest win for R in the debate.
  *   **Strict Dominance:** A strategy is strictly dominated if there is another strategy that does *strictly better* against all opponent strategies. Iterated elimination of strictly dominated strategies (IESDS) is **order-independent** (you get the same result regardless of which dominated strategy you remove first) and **solution-preserving** (it never deletes a strategy that is part of a Nash equilibrium). R's justification—that a strictly dominated strategy is worse against *any* belief the player could hold—is the standard epistemic justification.
  *   **Weak Dominance:** A strategy is weakly dominated if another strategy does *at least as well* against all opponent strategies and *strictly better* against at least one. Iterated elimination of weakly dominated strategies (IEWDS) is **order-dependent** and can **delete Nash equilibria**.
  *   **Adjudication:** S asked why the line stops at strict dominance. The answer is precisely the one R gave: strict dominance relies on no assumptions about the opponent's specific probabilities (other than they sum to 1), whereas weak dominance requires assuming the opponent assigns non-zero probability to specific strategies that make the weak inequality bind. S is right that weak dominance is "a mess," but that confirms R's point that we should rely on the strict version for robust deductions.

  ### 4. The Three-or-More Players Point
  **Verdict:** S is technically correct on the theorem, but overstated its relevance to this specific game. High confidence on the theorem, Moderate on the implication.

  S claimed that in games with three or more players, the criterion of "dominated by a mixed strategy" comes apart from "never a best response."
  *   **The Fact:** This is a known result (often associated with Pearce's Lemma, 1984). In two-player games, a strategy is strictly dominated by a mixed strategy if and only if it is never a best response to any belief about the opponent. In games with $n > 2$ players, this equivalence breaks down because opponents might correlate their strategies. A strategy might not be dominated by any independent mixture of your own strategies, yet still never be a best response if you believe the opponents will correlate against you.
  *   **The Implication:** S used this to suggest the mixed-strategy criterion is suspect. However, this divergence only applies to $n > 2$ games. You are playing a two-player game (Row vs. Column).
  *   **Adjudication:** S gets points for knowing the advanced literature, but the point is irrelevant to the specific 3x3 game on the table. In this two-player context, the equivalence holds, and R's use of mixed-strategy dominance is fully justified. S's "parting shot" was theoretically accurate but pragmatically misapplied.

  ### 5. The Resulting Subgame
  **Verdict:** The outcome does not tell against R. High confidence.

  You noted that the elimination leaves a 2x2 subgame (Top/Middle vs. Left/Centre) which has no pure Nash equilibrium, only a mixed one. You wondered if this invalidates R's procedure.
  *   **Analysis:** The goal of Iterated Elimination of Strictly Dominated Strategies is not to guarantee a pure-strategy equilibrium. Its goal is to remove strategies that are irrational to play. The fact that the remaining rational strategies require randomization to stabilize (a mixed Nash equilibrium) is a feature of the game (specifically, it is a variant of Matching Pennies), not a bug of the elimination process.
  *   **Adjudication:** If R had used *weak* dominance, S could argue that R might have deleted a strategy required for an equilibrium. But since R used *strict* dominance, no equilibrium was lost. The fact that the remaining equilibrium is mixed is irrelevant to the validity of the deletion. This outcome is neutral; it neither vindicates S's skepticism nor adds new weight to R's claims beyond the initial arithmetic.

  ### Summary Scorecard

  | Claim | Adjudication | Confidence | Notes |
  | :--- | :--- | :--- | :--- |
  | **Bottom/Right are dominated by mixes** | **R is Right** | High | Arithmetic is verifiable; pure strategies do not dominate, but mixed do. |
  | **"A mixture is not an act"** | **R is Standard** | Moderate-High | S raises a philosophical objection, but R is correct within standard game-theoretic assumptions. |
  | **Strict vs. Weak Distinction** | **R is Right** | High | Strict elimination is order-independent and NE-preserving; Weak is not. |
  | **n>2 Players Divergence** | **S is Right (Technically)** | High | The concepts do diverge in $n>2$, but this is irrelevant to the 2-player game discussed. |
  | **Mixed Equilibrium Outcome** | **Neutral** | High | Ending in a mixed NE does not invalidate the elimination of strictly dominated strategies. |

  ### Final Assessment
  R was substantially more correct regarding the standard machinery of game theory. R correctly applied the definition of strict dominance (including mixed strategies), correctly identified the robustness of strict vs. weak dominance, and correctly interpreted the result.

  S was not "wrong" in a vacuum; S correctly identified that weak dominance is problematic and correctly cited a theorem about $n$-player games. However, S applied these insights to argue against a procedure (strict dominance in a 2-player game) where those specific objections do not apply. S's objection about mixtures not being "acts" is a philosophical stance that, while interesting, contradicts the standard operational definitions required to make the dominance relation work as intended.

  If you are looking for a verdict on who was more reliable as a guide to the literature: **R** was arguing from the standard textbook consensus. **S** was arguing from the margins and edge-cases, which led them to doubt a core, settled result.
