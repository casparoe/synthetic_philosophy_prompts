      *   *Practical Advice:* Make sure the advice regarding the aunt isn't just "compromise." It needs to be grounded in the moral framework discussed. The "Floor" includes obligations to *oneself*.
      *   *Key Insight:* The "Floor" isn't just what you owe others; it's also what you owe yourself to remain a functioning moral agent. Sacrificing a year might damage the user's ability to be good in the future.

