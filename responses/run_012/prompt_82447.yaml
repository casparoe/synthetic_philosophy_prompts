      *(Refining the Framework)*: The philosophical term is *Supererogation*. I should use that but explain it simply. The "Bank" is the error. The "Floor" is valid.

      *(Final check on the Partner/Sister dynamic)*: Acknowledge that both are projecting. Sister projects family duty. Partner projects individual autonomy. The truth is in the relationship itself.

