      *   *Q3: Can the framework be saved?* Yes. Keep the Floor/Surplus (Obligatory/Supererogatory) distinction, but drop the "Bank." The Floor is defined by: Non-maleficence (don't harm), Fidelity (keep promises), Special Obligations (family/contracts). The Surplus is Beneficence (doing good).
