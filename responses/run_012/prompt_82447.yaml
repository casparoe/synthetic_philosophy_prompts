          *   *User's Internal Framework:* "Morality as Floor and Surplus." The floor is obligation. Above the floor is supererogatory (good but not required). User treats surplus like a "moral bank account" (do good now, spend later).
          *   *Sister's Critique of Framework:* You're inventing currency to buy exemptions from real obligations.
      *   **The Questions:**
          1.  Is the "moral bank account" (floor + surplus) framework valid, or is it rationalization?
          2.  If an act is optional, can it be "spent"? Or does spendability imply it was actually debt?
          3.  Can the framework be saved/refined to define the "floor" without becoming "everything is owed"?
          4.  **Practical:** What should the user do about the aunt?

  2.  **Deconstruct the Moral Framework (Floor vs. Surplus):**
      *   *Philosophical Context:* This maps closely to the distinction between *obligatory* actions and *supererogatory* actions. Supererogatory acts are "above and beyond the call of duty."
      *   *The "Bank Account" Metaphor:* This is the weak point. Morality isn't usually transactional in a temporal sense (I did X good thing, so I can do Y bad thing). That sounds like "moral licensing," a cognitive bias where doing good makes people feel permission to do bad.
      *   *Sister's Point:* She argues the "floor" is higher than the user thinks. She implies a "Capability Principle" (if you can prevent harm at reasonable cost, you must).
      *   *Partner's Point:* He argues the "floor" is lower. He implies a "Contractual/Consent Principle" (obligations arise from agreements or direct causation, not mere proximity/capacity).
      *   *The User's Worry:* Is the "surplus" actually just hidden debt?

  3.  **Evaluate the "Moral Bank Account":**
      *   *Verdict:* The sister is partially right. The "banking" mechanism is flawed. You don't earn "credits" to skip future duties. However, the distinction between *duty* and *charity* (or *supererogation*) is philosophically sound.
      *   *Nuance:* The problem isn't the floor/surplus distinction; it's the *transactional* nature the user applied to it. A good life isn't about balancing a ledger; it's about integrity and relationships.
      *   *Refinement:* Instead of a bank, think of it as "Identity" or "Integrity." Or, stick to the Floor/Surplus but remove the banking aspect. The surplus doesn't excuse violating the floor.

  4.  **Address the Specific Questions:**

      *   *Q1: Is the sister right about the currency?* Yes, morally "banking" is usually rationalization. Good deeds don't cancel out neglect of duty.
