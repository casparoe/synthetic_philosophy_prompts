      *   *Section 2: The "Spendability" Problem.* Explain why banking fails. Morality isn't a ledger. Integrity is holistic.
      *   *Section 3: Redefining the Floor.* How to set the floor without it becoming "everything." Use criteria: Consent, Capacity, Relationship, Cost.
      *   *Section 4: The Aunt Decision.* Apply the criteria.
