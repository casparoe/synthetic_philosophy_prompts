answer: |-
  This is a profound and deeply human dilemma. You are wrestling with one of the oldest problems in ethics: the distinction between *duty* (what is required) and *supererogation* (what is good but not required).

  You have constructed a mental model to manage this tension. Your sister and partner are pulling you toward two opposing ethical poles: **Maximalism** (if you can help, you must) and **Libertarianism** (you owe only what you explicitly agree to).

  Here is an analysis of your framework, the validity of the "moral bank," and how to apply this to the situation with your aunt.

  ### 1. The Framework: Floor and Surplus
  Your intuition about a "floor" and "open ground" is philosophically sound. In ethics, this is the distinction between **obligatory actions** and **supererogatory actions**.
  *   **The Floor:** Duties. If you violate these, you are blameworthy. (e.g., don't lie, don't steal, keep promises, care for your children).
  *   **The Surplus:** Charitable or heroic acts. If you do these, you are praiseworthy. If you don't, you are not blameworthy. (e.g., donating a kidney to a stranger, running into a burning building).

  Your sister is arguing that the Floor is much higher than you think. She is invoking a "Capability Principle": *If you can prevent something bad from happening without sacrificing anything of comparable moral importance, you ought to do it.* By her logic, your surplus ground is an illusion; if you have the capacity to save your aunt from misery, it ceases to be optional and becomes a duty.

  Your partner is arguing that the Floor is defined by **consent and contract**. You did not choose your aunt, you did not promise to care for her, and you did not cause her dementia. Therefore, demanding you pay the price is a violation of your autonomy.

  **Verdict on the Framework:** The distinction between Floor and Surplus is real and necessary. If everything is a duty, morality becomes impossible (you can't breathe without owing someone air). If nothing is a duty, society collapses. Your framework is not a rationalization; it is a necessary structure for a livable life.

  ### 2. The "Moral Bank Account"
  This is where your sister is right, and where your framework risks becoming a rationalization.

  You described "banking" surplus good deeds to "spend" on later exemptions. This is a known psychological phenomenon called **Moral Licensing**. It is the cognitive bias that allows people to do something good (recycle, donate) and then feel permission to do something questionable (lie, cheat, neglect).

  **Why the Bank Fails:**
  Morality is not transactional; it is constitutive. It is about who you *are*, not what you *owe*.
  *   If you have a duty to tell the truth, you cannot fulfill that duty on Monday and "spend" the credit to lie on Tuesday. The duty resets.
  *   If you help a friend renovate (Surplus), that act builds a relationship and expresses generosity. Skipping a best friend's wedding (potentially a Floor violation of friendship, depending on the closeness) damages the relationship. The renovation does not "pay for" the absence.

  **The Insight:** The fact that you feel you *need* to bank credits suggests you view morality as a burden to be minimized rather than a practice to be inhabited. If you are constantly looking for exemptions, you are asking, "How little can I do?" rather than "Who do I want to be?"

  However, the Sister's conclusion—that therefore *everything* is a duty—is also false. You cannot spend surplus credits, but that doesn't mean the surplus doesn't exist. It just means the surplus doesn't excuse violating the floor.

  ### 3. Redefining the Floor
  To save your framework, you need better criteria for where the Floor sits. It cannot be "everything I can do" (Sister), nor "only what I signed" (Partner).

  A robust definition of the Moral Floor usually includes three categories:
  1.  **Non-Maleficence:** Do not cause harm.
  2.  **Fidelity:** Keep explicit promises and contracts.
  3.  **Special Obligations:** Duties arising from specific relationships (parent/child, spouse/spouse).

  **The Gray Zone:**
  Your aunt falls into a gray zone between "Stranger" and "Immediate Family." This is where the **Cost Principle** applies.
  *   If the cost to you is *low* (driving her to appointments on weekends), the obligation moves toward the Floor.
  *   If the cost to you is *existential* (moving in for a year, pausing your career, losing autonomy), the obligation moves toward the Surplus.

  A moral theory that demands you sacrifice your entire life's trajectory to prevent another's unhappiness is unsustainable. It turns you into a tool for others' welfare. You have obligations to yourself to maintain your own agency, health, and future capacity to do good.

  ### 4. The Practical Question: The Aunt
  Given the above, here is how to navigate the decision.

  **Do not accept the binary.**
  Your sister presents a false dichotomy: *Either you move in for a year, or you abandon her to a hellish home.* This is a pressure tactic, likely born of her own guilt or distance.
  *   **The Cost:** A year of your life at age 34 is significant. It is not "just time." It is career momentum, relationship development, and personal autonomy.
  *   **The Need:** Your aunt needs care and dignity. She does not specifically need *you* living in her house 24/7, unless no other option exists.

  **The "Good Enough" Solution:**
  You are looking for a decision that honors the **Special Obligation** (she is family) without violating your **Self-Obligation** (you cannot sacrifice your entire year).

  1.  **Reject the "Bank":** Stop thinking about what you did last spring. It is irrelevant. This decision stands on its own.
  2.  **Reject the "Debt":** Your partner is right that this is not a debt you agreed to. But he is wrong that relationships are purely contractual. You are part of a web of kinship. To treat it purely transactionally is to misunderstand what family is.
  3.  **Find the Middle:**
      *   **Option A (The Sister's Way):** Move in for a year. *Risk:* Resentment, career damage, burnout. If you burn out in month 6, you help no one.
      *   **Option B (The Partner's Way):** Do nothing/Minimal contact. *Risk:* Moral injury, loss of self-respect, permanent rift with family.
      *   **Option C (The Integrated Way):** You take a *portion* of the burden, but not all of it.
          *   Take 3 months of unpaid leave, not a year. Use that time to stabilize her care, hire a part-time nurse, and set up a long-term plan.
          *   Contribute financially from your savings (if she cannot afford care) in lieu of physical presence.
          *   Commit to visiting every two weeks, rather than living there.
          *   Mobilize the scattered cousins. "I can give 3 months and $X. Who can give what?"

  **Recommendation:**
  Do not move in for a year. That cost is too high relative to the obligation of a nephew/niece. It crosses from "Special Obligation" into "Heroism," which by definition is optional.
  However, doing nothing is a violation of the "Special Obligation" floor.
  **The Action:** Take three months. Organize her professional care. Set up a rotation or financial pool with the cousins. Return to your life, but remain the *manager* of her care, even from a distance.

  ### 5. Summary
  Your sister is right that "banking" is a trap, but wrong that capability creates total obligation. Your partner is right that this isn't a debt, but wrong that family is purely voluntary.

  The Floor is not a fixed line; it expands based on relationship and contracts, but it is bounded by the cost to the self. You owe your aunt dignity and significant support. You do not owe her your life.

  If you choose the middle path, you will likely disappoint your sister (who wants the problem solved completely) and worry your partner (who wants you protected). That is the cost of integrity. You must make the decision that allows you to look in the mirror in ten years without regretting either your sacrifice or your self-preservation. Three months of direct care, followed by remote management, is the action that respects both the Floor and your own humanity.
