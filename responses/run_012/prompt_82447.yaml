          *   *Is it Surplus?* Yes, it is highly admirable.
          *   *The Decision:* It sits in the "Gray Zone" of *Special Obligations*. It's not strictly required like feeding a child, but it's not random charity like helping a stranger.
          *   *Synthesis:* The user needs to find a middle path. Moving in for a full year is likely too high a cost (violates self-obligation). Doing nothing is likely too low (ignores special tie). A hybrid approach is best.

  5.  **Drafting the Response:**

