  For calibration: I'm at about 0.3, my friend is at about 0.7. Tell me which of the sub-questions we most likely actually disagree about, and which single piece of evidence or argument would move your number the most — and specifically whether your number for the alloy-ratio machine is higher or lower than for the plain two-bitser, because I think the direction of that gap is the whole ballgame and I keep flip-flopping on it.

