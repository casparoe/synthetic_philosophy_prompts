  # JOINT STATEMENT ON THE COLOR PHI PHENOMENON
  **An Adversarial Collaboration Between the Orwellian and Stalinesque Frameworks**

  **Date:** October 26, 2023
  **Signatories:** The Orwellian Working Group (OWG) & The Stalinesque Working Group (SWG)

  ## 1. Agreed Claims regarding Phenomenon and Theory

  After rigorous exchange, both parties affirm the following empirical and theoretical baseline. Any viable model of the Color Phi Phenomenon must accommodate these constraints:

  1.  **Stimulus Discreteness:** The physical stimuli consist of two discrete events: a colored dot at Location A (Time 1) and a differently colored dot at Location B (Time 2). There is no physical motion or intermediate color stimulus.
  2.  **Reported Continuity:** Under specific inter-stimulus intervals (ISI), observers consistently report a single object moving from A to B and changing color *during* the transit, prior to the arrival of the second stimulus.
  3.  **Temporal Constraint:** The neural processing required to register the second stimulus (Time 2) takes a finite, non-zero amount of time (approx. 50–100ms). The reported experience of the color change occurs subjectively *before* the second stimulus could physically influence the brain in a feed-forward manner.
  4.  **Neural Sufficiency:** Both parties reject dualism. The phenomenon must be explainable entirely through neural mechanisms (latency, feedback loops, memory systems) without invoking non-physical consciousness.
  5.  **The Explanatory Burden:** Any theory must specify *when* the content of the experience (the "green moving dot") is instantiated in the nervous system relative to the physical stimuli and relative to the subject's report.

  ## 2. Table of Disagreements, Cruxes, and Adjudication

  The core dispute concerns the temporal relationship between neural processing, conscious experience, and memory reporting.

  | Point of Contention | Orwellian Position (OWG) | Stalinesque Position (SWG) |
  | :--- | :--- | :--- |
  | **Locus of Falsification** | The *memory* or *report* is falsified. The raw experience is veridical (Red at A, then Green at B), but the narrative is edited post-hoc. | The *experience* itself is falsified (or constructed). The raw data is buffered, edited, and *then* experienced as a continuous stream. |
  | **Timing of Consciousness** | Conscious experience tracks real-time input (with standard latency). The "motion" is never consciously experienced as it is reported; it is a memory confabulation. | Conscious experience is delayed. The "motion" is consciously experienced, but the experience occurs later than the subject believes it does. |
  | **The "Cartesian Theater"** | Rejects a specific "screen" but maintains a distinction between *experiencing* and *remembering*. Editing happens in the remembering. | Rejects a specific "screen" but maintains a distinction between *processing* and *conscious access*. Editing happens before access. |

  ### Cruxes and Pre-Registered Adjudication

  **Crux 1: The Neural Correlate of the "Mid-Flight" Color**
  *   **Question:** Does the neural activity pattern corresponding to the "green" color arise before or after the neural activity corresponding to the "motion" report?
  *   **Adjudication Method:** High-temporal-resolution neuroimaging (MEG/EEG) to identify the Neural Correlates of Consciousness (NCC) for the color green during the illusion.
  *   **OWG Prediction:** NCC for "Green" will appear *after* the NCC for the second stimulus is fully processed, coinciding with memory consolidation areas (e.g., hippocampal-prefrontal loop).
  *   **SWG Prediction:** NCC for "Green" and "Motion" will appear simultaneously in perceptual areas (e.g., V4/MT) *after* the second stimulus is processed but *before* the report is generated, constituting a unified conscious event.

  **Crux 2: Interference with Memory Consolidation**
  *   **Question:** If memory consolidation is disrupted immediately after the second flash, does the Phi illusion persist?
  *   **Adjudication Method:** Apply Transcranial Magnetic Stimulation (TMS) to memory consolidation areas immediately following the second flash.
  *   **OWG Prediction:** The illusion will vanish. Subjects will report two static dots. Since the illusion is a memory edit, disrupting memory prevents the edit.
  *   **SWG Prediction:** The illusion will persist (provided perception is intact). Since the illusion is constructed in perception *before* conscious access, disrupting later memory consolidation should not erase the already-experienced motion.

  ## 3. Analysis of Verbal Dispute

  Both parties acknowledge the challenge raised by Daniel Dennett (the "Multiple Drafts" model) that this dispute may be partially verbal.

  *   **Agreement on Verbal Risk:** We agree that if "conscious experience" is defined strictly as "the content available for verbal report," the distinction collapses. If the subject reports motion, and the brain produces that report via editing, it is Orwellian. If the brain produces that report via delayed construction, it is Stalinesque. If there is no further fact of the matter about *when* it became conscious, the dispute is semantic.
  *   **Remaining Substantive Claim:** However, we disagree that the definition must be strictly functional. We maintain there is a factual difference in neural architecture: **Is the editing mechanism located in systems associated with working memory/report (Orwellian) or in systems associated with early perceptual binding (Stalinesque)?**
  *   **Conclusion:** The dispute is verbal *only if* one denies the possibility of distinguishing perceptual processing from memory processing neurally. If such a distinction exists empirically, the dispute is substantive.

  ## 4. Analysis of Proposed Variant: Mid-Interval Probing

  **Variant Description:** The observer is probed (e.g., forced choice or neural decoding) to identify the color/location of the dot at a time $T$ where $T_{flash1} < T < T_{flash2}$. The probe occurs *before* the second flash physically appears.

  **Predictions:**

  *   **Orwellian Prediction:** At time $T$, the subject is genuinely experiencing a stationary Red dot at Location A. The "editing" process has not yet begun because the second stimulus (the trigger for the edit) has not arrived.
      *   *Behavioral Output:* If forced to report at $T$, the subject will say "Red, Stationary." The Phi illusion will be **disrupted** by the probe.
  *   **Stalinesque Prediction:** At time $T$, the conscious "stream" is paused/buffered. The brain is waiting for the second stimulus to render the movie. The content "Green/Moving" does not exist in consciousness yet.
      *   *Behavioral Output:* If forced to report at $T$, the subject will say "Red, Stationary" (or report uncertainty). The Phi illusion will be **disrupted** by the probe.

  **Will this variant separate the views?**
  **No, not behaviorally.** Both models predict that interrupting the process before the second stimulus arrives prevents the illusion from forming. The Orwellian says the "edit" hasn't happened; the Stalinesque says the "rendering" hasn't happened.

  **How to Separate via Variant:**
  To separate the views using this variant, one must measure the **neural state** at time $T$, not the report.
  *   **OWG:** Neural state at $T$ should match veridical perception of Stimulus 1 (Red/Static).
  *   **SWG:** Neural state at $T$ should show active buffering/inhibition, distinct from veridical perception, as the system prepares for the "show trial."

  **Joint Conclusion on Variant:** This variant confirms that the second stimulus is necessary for the illusion, which both sides already accept. It fails to distinguish the *locus* of the construction without concurrent neural monitoring. Therefore, this behavioral variant alone is insufficient to resolve the dispute.

  ***

  **Signed,**

  *The Orwellian Working Group*
  *The Stalinesque Working Group*
