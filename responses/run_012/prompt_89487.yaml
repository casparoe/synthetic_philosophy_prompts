answer: |-
  **Real tensions, worst first**

  The most damaging contradiction lies between your criterion of rightness (1), your rejection of prerogatives (2), and your considered judgment on the piano case (8). If (1) and (2) are true, the parent spending money on piano lessons instead of famine relief is acting wrongly. The consequences of famine relief are objectively better than piano lessons, and (2) forbids weighting the parent's project higher simply because it is theirs. You cannot claim the act is "not wrong" (8) while maintaining that rightness is determined solely by impartial maximization (1). This isn't a nuance; it is a direct logical contradiction.

  You attempt to bridge this with the criterion/decision procedure distinction (5), but this fails. Distinguishing what is right from how we deliberate protects the agent from blame, not the act from wrongness. Indirect consequentialism allows you to say the parent is *blameless* for following a useful heuristic, but it does not make the suboptimal act *right*. Your claim in (8) is that the act is permissible, not merely excusable. To hold (1), (2), and (8) simultaneously is to assert that an act can be both suboptimal (by 1) and permissible (by 8) without any theoretical mechanism to allow it.

  This normative contradiction is exacerbated by your inconsistent handling of agent-cost in (3), (4), and (6). In (3), you dismiss demandingness because "morality is hard," yet in (4), you concede the integrity objection because morality shouldn't break "what makes life yours." Integrity costs *are* demandingness costs. You cannot claim psychological difficulty is irrelevant (3) while simultaneously claiming psychological displacement is a theory defect (4). Furthermore, (6) undermines (3). If "ought-implies-can" holds in a strong psychological sense (6), then a requirement humans cannot sustain is not binding. If humans cannot psychologically sustain maximal giving, (6) says there is no obligation, but (3) says the obligation stands regardless of difficulty. You are simultaneously arguing that difficulty doesn't matter (3) and that impossibility voids obligation (6). This leaves your theory without a stable account of when agent-cost matters and when it does not.

  **Tensions that dissolve**

  The conflict between your criterion (1) and your decision procedure (5) is standard indirect consequentialism and need not worry you, provided you abandon the claim in (8) that the act itself is right. If you viewed the piano case as wrong but the parent as blameless due to necessary heuristic deliberation, (1) and (5) would cohere perfectly. Similarly, your methodological commitment to reflective equilibrium (7) is not in tension with the other points; rather, it is the tool you should use to resolve them. (7) demands you adjust theory to fit considered judgments. The tension arises only because you are refusing to let (7) do its work on (1) and (2). Finally, (6) and (5) are compatible; psychological limits can dictate the optimal decision procedure without necessarily altering the criterion of rightness, though as noted above, your strong formulation of (6) does press against (1).

  **The cheapest fix**

  You should drop commitment (2) and accept agent-centered prerogatives. This is the cheapest fix because it preserves your methodology (7) and your specific case judgments (8), which are the data points driving your reflective equilibrium. By allowing agents a prerogative to pursue personal projects even when they do not maximize the impartial good, you resolve the contradiction between (1) and (8) without abandoning consequentialism entirely. You can maintain that consequences determine the good (1) while admitting that agents are not always required to maximize it (modifying 1 slightly to accommodate the prerogative). This also dissolves the tension between (3) and (4); you can acknowledge the integrity objection has force (4) without accepting the full demandingness objection (3), because the prerogative creates a protected zone for personal life that doesn't rely on claiming morality is "easy." It is theoretically cleaner than trying to argue via (5) that suboptimal acts are actually right, or trying to argue via (6) that maximal giving is psychologically impossible for everyone.

  **What I'd be giving up**

  You must give up commitment (2). It is the linchpin holding the contradiction in place. You cannot maintain a strict no-prerogative stance while insisting the piano case is permissible. Keeping (2) forces you to either call the parent wrong (violating your reflective equilibrium) or rely on the decision-procedure dodge (which conflates rightness with blamelessness). Sacrificing (2) allows you to keep your consequentialist core while acknowledging that morality leaves space for a life.
