answer: |-
  Good evening, everyone. For those who don't know me, I'm one of the many former students who spent years sitting in [Supervisor's Name]'s office, nodding knowingly while discussing subsidiarity, and leaving still not entirely sure what it meant. And honestly, after thirty years of [Supervisor's Name] writing on the subject, I've come to realize that wasn't an oversight. It was a lesson.

  We often treat subsidiarity like a formula. We imagine there's a scale somewhere, and if you put a policy on it, the needle points to "Local," "Regional," or "Central." But looking around this room—from the EU experts who know the eight-week warning windows by heart, to the family members who just want to know why Grandpa spent three decades writing about it—I think the real magic of [Supervisor's Name]'s work is that it acknowledges subsidiarity isn't a scale. It's a shifter.

  Every mechanism we've built to enforce this principle is really a device for shifting the burden of proof, not a test for the right level of government.

  Think about the European Union. The lawyers here know the drill: if one-third of national parliaments raise a yellow card, the Commission has to review the draft. But does the law stop? No. The Commission can maintain, amend, or withdraw, provided they give reasons. The mechanism doesn't answer the question "Could the lower level have done this?" It simply forces the center to justify why it thinks the lower level *couldn't*. It shifts the burden of justification to the center, but leaves the center holding the gavel.

  Or look at Switzerland. Our friend from the cantons knows that if eight cantons demand it, a federal statute goes to a referendum. That doesn't legally declare the federal government incompetent. It just says, "You want to act at this level? Prove it to the people." It shifts the burden of political legitimacy, not legal capacity.

  Even in the United States, where we don't use the word "subsidiarity" much, we see the same shape. The courts might strike down federal commandeering of state officials—they'll say the federal government can't force states to enforce federal law. But they won't audit the substantive wisdom of the federal scheme. They protect the process of federalism, not the outcome. They shift the burden of means, not ends.

  In Germany, too, the Bundesrat protects the Länder, routing legislation through the guarantee of the federal principle. But again, it is a political and procedural check, not a mathematical calculation of efficiency.

  In each case, the question "could the lower level have done this?" isn't answered by the mechanism. It is deferred to a body that gets to decide how much deference to give. This is why subsidiarity can be sincerely invoked by a centralizer and a secessionist in the same afternoon. The centralizer uses it to say, "We have justified our action." The secessionist uses it to say, "You haven't justified it enough." Both are right, because the principle presupposes a substantive judgment about capacity that no procedure can fully resolve.

  [Supervisor's Name], you never gave us a definition because there isn't one. You gave us a mirror. You showed us that federalism isn't about finding the perfect division of power; it's about maintaining the conversation about who decides. You taught us that the ambiguity isn't a bug in the system; it's the feature that allows diverse democracies to function without breaking apart.

  So, to the partners and family here: thank you for sharing him with us. He spent thirty years teaching us that the question is more important than the answer. And to [Supervisor's Name]: enjoy the retirement. You've earned the right to let someone else carry the burden of proof for a change.

  Thank you.

  ***

  **Confidence Assessment**

  I am highly confident in the factual claims regarding the **EU subsidiarity protocol** (Protocol No. 2 of the Lisbon Treaty), specifically regarding the one-third threshold for national parliaments to trigger a review and the Commission's power to maintain the draft with reasons. I am also highly confident in the **Swiss mechanism**, where eight cantons can demand a facultative referendum on federal statutes (Article 141 of the Federal Constitution). The **US anti-commandeering doctrine** (derived from *New York v. United States* and *Printz v. United States*) is also accurately represented as a limit on means rather than substantive wisdom.

  The claim I am **least sure** of is the specific characterization of the **German system** as a "subsidiarity mechanism" comparable to the EU protocol. While the Bundesrat absolutely protects Länder interests and the "federal principle" is guaranteed under Article 79(3) of the Basic Law, German constitutional law typically frames this through "competence distribution" and "federal comity" (*Bundestreue*) rather than an explicit textual test of "subsidiarity" in the same way the EU treaties do. While the functional effect is similar, the terminology is less precise than in the EU or Swiss examples.

  Summary: Subsidiarity mechanisms function not as objective tests for the optimal level of governance, but as procedural devices that shift the burden of proof to the central authority while leaving substantive judgments about capacity unresolved.
