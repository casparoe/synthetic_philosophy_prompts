  This order is critical. You cannot start with the "announcement" reading because students won't see why it's needed. You need the symmetry of the Flat Earther case to create the problem that the "announcement" reading solves. If you don't establish that the recipes are identical, the distinction between Moore and the Flat Earther feels arbitrary. The dependency runs from structural similarity to substantive difference. You need the students to feel the tension of the Flat Earther case before you offer the resolution. If you resolve it too early, the Flat Earther comparison becomes a footnote instead of the engine of the discussion. The sequence forces them to realize that logic isn't the battleground; the starting assumptions are. Without the Flat Earther mirror, the "announcement" looks like a cop-out. With it, it looks like a necessary boundary condition for knowledge. The students must see the structural identity first to appreciate the epistemic difference. This ensures the "announcement" reading lands as a philosophical position, not just a refusal to argue.

  **The Carrying Example**
  Stick with Moore's hands. Do not swap them for a pen or a prop. The text relies on the immediate phenomenology of seeing your own hands in a lecture hall. It's unavoidable. If you switch to "Here is a pen," it feels trivial. If you switch to "Here is a tree," it's distanced. The hands are part of the student's body, making the skepticism feel more absurd. The globe is only used later as the counter-weight to test the limits of that immediacy. The hands do the heavy lifting because they force the student to confront whether they actually doubt their own senses right now. The physical presence in the room anchors the "common sense" claim better than any prop you could bring in. Changing it risks confusing the unprepared students who might have skimmed the text looking for "hands." Keep the hands for Moore, use the globe for the Flat Earther. It keeps the focus on the text while allowing the globe to serve as the critical contrast case later.

  **Misconceptions and Where I Kill Them**
  1. **"He's begging the question."** This will surface immediately when you write the premises (minute 5). Kill it at minute 15 by introducing the "announcement" reading. Explain that Moore admits it looks circular but argues the premise is *more* certain than the conclusion's negation. It's not a logical error; it's a hierarchy of certainty. Use the phrase "shifting the burden" to clarify. Addressing this early prevents them from disengaging when the logic seems too simple.
  2. **"Knowledge is just feeling sure."** This will erupt during the Flat Earther comparison (minute 30). Students will say the Flat Earther feels sure too. Head this off by distinguishing psychological certainty from epistemic right. Moore isn't saying "I feel sure," he's saying "I have no reason to doubt." The difference is the absence of defeaters, not the presence of conviction. Pin this down before moving to the conclusion, or the "announcement" reading collapses into subjectivism. You must intervene here to prevent them from thinking Moore is just being stubborn. If you let this slide, they leave thinking epistemology is just about who shouts louder. Make sure they see that "common sense" implies a shared standard, not just private confidence. This distinction saves the view from relativism.

  **The Exit Question**
  "Moore says the skeptic must go first. If the skeptic says 'You could be dreaming,' have they given a reason to doubt, or just a possibility? Write one sentence explaining whether Moore would accept that challenge as valid grounds for doubt."

  **What I'm Skipping**
  Do not touch Kant's transcendental idealism. It's too dense for 50 minutes and distracts from the epistemological point. Skip the specific definition of "external world" metaphysics; treat it as "things outside our minds." Skip the historical debate on whether Moore actually refuted skepticism. We are analyzing the move, not grading the win. Tell them outright: "We aren't solving skepticism today; we're looking at Moore's tactic." Also, ignore the two unprepared students' need for full context beyond the basics. Don't let the summary eat the discussion time. Focus strictly on the epistemic conditions for proof.
