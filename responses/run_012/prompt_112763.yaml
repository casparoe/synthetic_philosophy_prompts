prompt: |-
  I'm TAing a 200-level epistemology section and next week is Moore's proof of an external world. I don't need you to explain the proof to me — I need the plan for how to actually give it, fifty minutes, twelve students who've done the reading and two who havent.

  Two things I want built into the plan, because they're where I think the real action is. First, I want to run the proof as a recipe rather than a curiosity: state something you're as sure of as anything, point at the evidence thats literally right there, note that the premise entails the anti-skeptical conclusion, done. Then ask what, if anything, stops a guy who's dead certain the earth is flat from running that exact recipe with a globe on the desk. I want the section to end up there. Second, I want to take seriously the reading that this isn't really an arguement at all so much as an announcement that the skeptic has to go first — that absent some actual reason for doubt, the knowledge you've already got just stands. I'm not sure that reading is right, but it's the one I want the plan organized around. And along the way I'd like to poke at whether "proof" is doing any work here, since Moore seems happy to call it a proof as long as the argument is valid and the premises are known, which makes proofs pretty cheap.

  So lay it out for me as:

  The order — the sequence the pieces have to come in for that ending to land, and what depends on what (roughly 300 words, bullets are fine).
  The carrying example — the one case that should do the heavy lifting, and why that one instead of just reusing Moore's hands; if the hands really are the right call, say why (about 150 words).
  Misconceptions and where I kill them — the wrong readings they'll walk in with or cook up in the room, in the order they'll surface, and the exact point in my sequence where each one gets headed off. I'm already expecting "he's just begging the question" and "so knowledge is just whatever you feel really sure about" (about 250 words).
  The exit question — one question I can ask at the end that tells me whether they got it rather than whether they can recite the standard verdicts (50 words).
  What I'm skipping — what I should refuse to get into at this level, and say so out loud (about 100 words).

  American English please, and keep it plain.
