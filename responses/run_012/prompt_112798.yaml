answer: |-
  One central conceptual issue this disagreement raises is the **problem of explanatory relevance versus instrumental systematization**. Specifically, the debate asks whether the bridge-numbers figure in the *genuine explanation* of why the empirical predictions hold, or whether they merely serve as a *calculational scaffold* that organizes concrete facts without corresponding to distinct features of reality.

  ### The Conceptual Issue: Ontic Explanation vs. Epistemic Utility

  For the **Platonist**, the indispensability of bridge-numbers suggests they play an **ontic explanatory role**. On this view, the derivation of empirical predictions using bridge-numbers is not just a logical trick; it traces the actual structural dependencies of the world. The bridge-numbers represent real, abstract features or relations that constrain physical systems. Therefore, a complete explanation of the phenomenon *must* cite these numbers (or the structures they inhabit). To remove them would be to offer an incomplete explanation, akin to explaining the motion of planets without referencing gravity.

  For the **Nominalist**, the bridge-numbers play only an **epistemic or instrumental role**. They are part of a "useful fiction" that allows researchers to compress complex concrete relations into manageable equations. On this view, the genuine explanation lies entirely within the concrete, physical domain. The bridge-numbers are like the lines of longitude and latitude on a map: they are indispensable for navigation and calculation, but they do not exist on the surface of the Earth. Citing them in an explanation is a category mistake; they explain *how we calculate*, not *why the phenomenon occurs*.

  ### Why Predictive Success Does Not Settle the Issue

  The fact that the mathematical practice "works" (i.e., yields accurate empirical predictions) fails to settle this disagreement for two primary reasons:

  **1. The Underdetermination of Ontology by Empirical Adequacy**
  Predictive success establishes *empirical adequacy*, not *truth*. History provides numerous examples of theoretical posits that were indispensable for prediction but later discarded as ontologically false (e.g., the crystalline spheres in medieval astronomy or the luminiferous ether in 19th-century physics). Both the Nominalist and the Platonist can agree that the bridge-number equations are reliable tools for prediction. The Nominalist argues this reliability stems from the internal consistency of the fiction and its mapping to concrete relations. The Platonist argues it stems from the theory's accurate description of abstract reality. Since both interpretations are compatible with the same successful output, success alone cannot adjudicate which interpretation is correct.

  **2. The Problem of Permutation Invariance**
  The specific constraint that "any permutation of [bridge-numbers] yields the same empirical predictions" creates a specific hurdle for the Platonist that success cannot overcome. If swapping bridge-number $A$ with bridge-number $B$ changes nothing in the observable world, it suggests that the individual identity of these numbers is irrelevant to the physics.
  *   **For the Platonist**, this raises a reference problem: If the numbers are real abstract *objects*, which one is which? If they are indistinguishable in their effects, positing them as distinct objects seems ontologically extravagant.
  *   **For the Nominalist**, this supports the fictionalist view: The numbers are merely placeholders in a structure. The "work" is being done by the *relations* between the numbers, which can be nominalized as relations between concrete entities, rather than the numbers themselves.

  Because the empirical data remains invariant under permutation, the success of the practice cannot tell us whether we are tracking distinct abstract objects (Platonism) or merely utilizing a symmetric formal structure (Nominalism/Structuralism). Thus, the practice's success confirms the *utility* of the bridge-numbers, but remains silent on their *explanatory status*.
