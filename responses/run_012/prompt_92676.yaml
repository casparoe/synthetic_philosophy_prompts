      *   **Topic:** The apparent contradiction between using "cultural dimensions" (national stereotypes/scores) for business training/research and maintaining anti-discrimination policies that forbid judging individuals by nationality.
      *   **Tasks:**
          1.  Reconstruct the theory of national character presupposed by the practice.
          2.  Analyze what must be true for a single score to be meaningful (trait vs. distribution vs. weaker).
          3.  Analyze the relationship between group average and individual case.
          4.  Identify rival views ruled out by the practice.
          5.  Identify where the practice is philosophically underdetermined.
          6.  Assess consistency between training materials and anti-discrimination policy.
          7.  Explain what would change if national character were deemed incoherent.
      *   **Constraints:** No bibliography/citations (user will add them). British English spelling and usage.

  2.  **Deconstruct the Core Tension:**
      *   *Practice A:* Using Hofstede-style cultural dimensions (Power Distance, Individualism, etc.) to predict behaviour, manage teams, and train staff. This relies on generalisation.
      *   *Practice B:* HR policies stating "judge the individual, not the nationality." This relies on particularism.
      *   *The Philosophical Problem:* Essentialism vs. Statistical Generalisation vs. Moral Prohibition.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Acknowledge the EPQ context. Define the tension clearly.
      *   **Reconstructing the Theory (Ontology of National Character):**
          *   What does a score imply? It can't be strict essentialism (every French person *is* X). It must be probabilistic.
          *   *Option 1: Shared Psychological Trait.* Too strong. Implies homogeneity.
          *   *Option 2: Statistical Distribution.* More likely. The score is a mean.
          *   *Option 3: Institutional/Situational.* Maybe it's not psychology but shared norms/rules.
          *   *Conclusion on this point:* The practice usually *acts* like Option 1 (heuristics) but *claims* Option 2 (averages).
      *   **The Average vs. The Individual (Epistemology):**
          *   Does the average tell you about the individual? Statistically, no (ecological fallacy). Practically, yes (bayesian prior).
          *   The practice presupposes that the prior probability is strong enough to inform initial strategy, even if updated later.
      *   **Rival Views Ruled Out:**
          *   *Nominalism:* Nations don't exist as real categories.
          *   *Moral Particularism:* It's wrong to use stats even if true (profiling).
          *   *Dynamic Constructivism:* Culture changes too fast for static scores.
      *   **Philosophical Underdetermination:**
          *   Where can different theories agree? That patterns exist. That heuristics are useful.
          *   Where do they diverge? *Why* the patterns exist (biology vs. socialisation) and *how fixed* they are.
      *   **Consistency Check (The HR Paradox):**
          *   Are they inconsistent? Logically, yes, if "judge as individual" means "ignore all priors."
