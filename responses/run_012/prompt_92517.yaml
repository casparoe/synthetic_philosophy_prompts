answer: |-
  You have identified the central tension in modern dynamical systems theory. Your intuition is correct: the standard "butterfly effect" narrative is incomplete because it conflates the instability of *trajectories* with the stability of *measures*.

  There is indeed an established conceptual framework for this distinction, though it is rarely presented in introductory pop-science accounts of chaos. The distinction lies between **trajectory predictability** (governed by Lyapunov exponents) and **statistical predictability** (governed by Ergodic Theory and Invariant Measures).

  Here is the distinction drawn with its edges, the principles that define the boundary, and the specific concepts that name the phenomenon.

  ### 1. The Two Modes of Evolution
  To understand why one question fails and the other succeeds, we must distinguish between two ways of describing the evolution of the system.

  **A. The Evolution of Points (Trajectories)**
  *   **The Question:** "Given $x_0$, where is $x_t$?"
  *   **The Mechanism:** This is governed by the **tangent map** (the derivative of the evolution function). In chaotic systems, there is at least one positive Lyapunov exponent. This means vectors in the tangent space stretch exponentially.
  *   **The Failure:** Because measurement is finite, your known $x_0$ is actually a small ball of uncertainty $B_\epsilon$. As time evolves, this ball stretches along the unstable manifold. Eventually, the diameter of the evolved ball becomes comparable to the size of the attractor itself. At that point, the system could be anywhere on the attractor.
  *   **The Verdict:** *Unpredictable.*

  **B. The Evolution of Densities (Measures)**
  *   **The Question:** "Given a distribution $\rho_0$, what is the distribution $\rho_t$?" or "What is the long-term average of observable $A$?"
  *   **The Mechanism:** This is governed by the **Perron-Frobenius operator** (or Transfer Operator). Instead of tracking where a point goes, this operator tracks how a *density* of points flows through phase space.
  *   **The Success:** While individual points diverge, the *density* often converges. In mixing systems, any initial smooth density $\rho_0$ (representing your uncertain measurement) will decay toward a unique **Invariant Measure** $\mu$.
  *   **The Verdict:** *Predictable.*

  ### 2. The Principled Class: SRB Measures and Ergodicity
  You asked if the class of answerable questions is "loose" or "principled." It is principled, but with strict mathematical conditions. The questions that remain answerable are those that can be expressed as integrals against the system's **Physical Measure**.

  **The Invariant Measure ($\mu$)**
  In a chaotic dissipative system (like the Lorenz attractor), trajectories collapse onto a fractal set (the strange attractor). The "fraction of time spent in a region" is defined by a probability measure supported on that attractor.
  *   If the system is **Ergodic**, the time average equals the space average for almost all initial conditions.
  *   If the system is **Mixing**, correlations decay. The system "forgets" its initial state, meaning the statistical prediction becomes *independent* of the initial uncertainty after a relaxation time.

  **The SRB Measure (Sinai-Ruelle-Bowen)**
  This is the critical edge. Not all invariant measures are physically relevant. (For example, an unstable fixed point has an invariant measure, but you will never observe it).
  For chaotic systems that model physical reality, we look for the **SRB Measure**. This is a specific invariant measure that describes the statistics of trajectories starting from a set of initial conditions with positive Lebesgue measure (i.e., "typical" initial conditions).
  *   **The Boundary:** If a system possesses an SRB measure, your "Type B" questions (averages, frequencies) are well-defined and robust. If the system lacks an SRB measure (e.g., certain pathological non-hyperbolic systems), even the statistics may be ill-defined or dependent on initial conditions.

  **So, the class of answerable questions is:** *Observables that are integrable with respect to the SRB measure.*

  ### 3. Why the Distinction Exists (The "Why")
  The reason the statistics survive while the trajectory dies is due to the geometry of the flow.

  1.  **Stretching and Folding:** Chaos works by stretching phase space (creating sensitivity) and folding it back (keeping it bounded).
  2.  **Loss of Information vs. Retention of Support:** The stretching destroys information about the *precise location* within the unstable manifold (hence trajectory unpredictability). However, the folding ensures that the *support* of the probability distribution remains confined to the attractor.
  3.  **Convergence of Densities:** While two nearby points $x$ and $y$ separate exponentially, the probability density centered at $x$ and the density centered at $y$ both converge to the same invariant density $\mu$. Your uncertainty about *which* trajectory you are on becomes irrelevant because *all* nearby trajectories yield the same statistics.

  ### 4. Terminology and Labels
  You asked for an established concept or name. There is no single word, but there is a standard vocabulary:

  *   **Statistical Stability:** This is the property you are describing. A system is statistically stable if its invariant measure changes continuously with system parameters, and if time averages converge robustly.
  *   **The Ergodic Hierarchy:** This classifies systems by how much memory they lose.
      *   *Ergodic:* Time averages exist.
      *   *Mixing:* Initial correlations decay (the system forgets where it started).
      *   *Bernoulli:* The system is as random as a coin toss (strongest chaos).
      *   *Your observation:* The "Butterfly Effect" applies to all of these, but **Statistical Predictability** usually requires at least the **Mixing** property.
  *   **Macroscopic vs. Microscopic Predictability:** Often used in statistical mechanics. The microstate (trajectory) is unpredictable; the macrostate (thermodynamic variables/statistics) is predictable.
  *   **Shadowing Lemma:** This is a crucial nuance. It states that a numerically computed trajectory (which has errors at every step) stays close to *some* true trajectory of the system, just not necessarily the one you intended. This reinforces your point: the specific trajectory is epistemically inaccessible, but the existence of *a* trajectory with those statistical properties is ontologically secure.

  ### 5. Where the Edge Blurs (Limitations)
  The distinction is principled, but it is not magic. There are edges where statistical predictability fails:

  1.  **Intermittency:** In some systems, the trajectory spends long periods near unstable periodic orbits before bursting into chaos. The convergence to the statistical average can be so slow (power-law rather than exponential) that for all practical purposes, the statistics are unpredictable within the lifetime of the universe.
  2.  **Non-Stationarity:** If the parameters of the system drift (climate change is the classic example), the invariant measure $\mu$ moves. If the parameters drift faster than the mixing time, the system never settles into the statistics you are trying to measure.
  3.  **Extreme Events:** The SRB measure describes "typical" behavior. It often underestimates the probability of "black swan" events in systems with heavy-tailed distributions. You can predict the *average* rainfall, but the *maximum* rainfall in a century might remain highly sensitive to initial conditions.

  ### Summary
  The pattern you have encountered is the distinction between **Lyapunov Instability** (sensitivity of orbits) and **Statistical Stability** (robustness of invariant measures).

  *   **The Unanswerable Class:** Pointwise prediction ($x_t$). Limited by the inverse of the Lyapunov exponent and measurement precision.
  *   **The Answerable Class:** Expectation values ($\int A \, d\mu$). Limited by the mixing time and the existence of an SRB measure.

  The "Butterfly Effect" is a claim about the **tangent bundle** (derivatives). The "Statistical Predictability" is a claim about the **space of measures** (densities). The former diverges; the latter converges.

  In the philosophy of science, this is sometimes referred to as the transition from **Laplacian Determinism** (knowing the future state) to **Probabilistic Determinism** (knowing the future distribution). The system remains deterministic, but the *accessible reality* is stochastic. You have correctly identified that unpredictability is not a property of the system *simpliciter*, but a relation between the system, the observer's precision, and the **observable** being queried.
