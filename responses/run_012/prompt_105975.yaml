answer: |-
  Your instinct to distrust this summary is well-founded. While it captures the *atmosphere* of Lewis's project, it fundamentally misrepresents the *mechanics* of his theory. For a reader with a background in the natural sciences, the most useful way to approach Lewis is to view him as a conceptual engineer building a model based on game theory. The summary you provided treats his model as a sociological observation, which leads to several category errors.

  Here is a claim-by-claim audit of the passage, distinguishing between Lewis's actual positions, acceptable simplifications, and genuine distortions.

  ### 1. "Conventions, on Lewis's account, are at bottom agreements."
  **Verdict: Genuine Misrepresentation.**

  This is the most critical error in the passage. Lewis takes pains to distinguish conventions from agreements.
  *   **Lewis's View:** An agreement involves an exchange of promises or explicit bargaining that creates an *obligation*. A convention, for Lewis, arises *tacitly*. It requires no promises, no bargaining, and no explicit communication.
  *   **The Correction:** Conventions are **regularities in behavior** sustained by a system of beliefs and preferences. If we both start driving on the right without ever discussing it, simply because we expect the other to do so, that is a Lewisian convention. If we sign a contract to drive on the right, that is an agreement. Lewis's entire project is to explain how order arises *without* agreement.

  ### 2. "When a group repeatedly faces a coordination problem, its members settle on one of the available solutions..."
  **Verdict: Substantially Right.**

  This is the correct starting point. Lewis defines a convention as a solution to a **recurrent coordination problem**.
  *   **The Nuance:** In game-theoretic terms, this is a coordination equilibrium (specifically, a proper coordination equilibrium where everyone prefers everyone to conform, provided they do). The "recurrence" is vital; one-off solutions are not conventions.

  ### 3. "...and treat that settlement as binding; the convention is the implicit bargain they have struck..."
  **Verdict: Misrepresentation.**

  As with Claim 1, the language of "binding" and "bargain" imports normative obligations that Lewis explicitly excludes.
  *   **Lewis's View:** Conventions are not "binding" in a legal or moral sense. They are sustained by **conditional preferences**. I prefer to drive on the right *if and only if* I expect you to drive on the right.
  *   **The Correction:** Replace "binding settlement" with "stable equilibrium." Replace "implicit bargain" with "mutual expectation." There is no "strike" of a bargain; there is merely a convergence of expectations.

  ### 4. "Because any of several solutions would have served equally well, conventions are arbitrary..."
  **Verdict: Substantially Right (with technical caveats).**

  This is the one part of the summary that accurately reflects Lewis's core criterion.
  *   **Lewis's View:** For a regularity to be a convention, there must be an alternative regularity that *could* have served the same purpose. If driving on the right were physically necessary to avoid crashing (e.g., due to the mechanics of the car), it would not be a convention. It is a convention precisely because driving on the left would have worked just as well, *provided everyone did it*.
  *   **The Nuance:** "Arbitrary" does not mean "random." It means "contingent on the existence of an alternative equilibrium."

  ### 5. "...and Lewis concludes that they are for that reason rationally groundless: we conform to them only because others do."
  **Verdict: Genuine Misrepresentation.**

  This is the inverse of Lewis's actual conclusion. Lewis argues that conventions are **rationally grounded**.
  *   **Lewis's View:** Conformity is the rational choice *given the expectations of others*. In game theory, this is a Nash Equilibrium. If everyone else drives on the right, the uniquely rational move for me is to drive on the right. To do otherwise is to invite a crash.
  *   **The Correction:** Conventions are not "groundless"; they are grounded in **instrumental rationality**. We conform not merely because others do, but because *given* that others do, conforming maximizes our own utility. The summary confuses "arbitrary origin" with "irrational maintenance."

  ### 6. "It follows that conventions are fragile, sustained only so long as some external authority or sanction keeps people in line."
  **Verdict: Genuine Misrepresentation.**

  This contradicts the fundamental insight of Lewis's game-theoretic approach.
  *   **Lewis's View:** Conventions are **self-policing**. The "sanction" is internal to the coordination problem itself. If you violate the convention (drive on the left), the "sanction" is that you crash. You do not need a police officer to enforce the convention; the payoff structure of the situation enforces it.
  *   **The Correction:** Conventions are robust precisely because they require no external authority. They persist because deviation is self-punishing.

  ### 7. "Generalizing the point, Lewis suggests that moral norms are simply conventions that have hardened over time..."
  **Verdict: Overextension / Misattribution.**

  Lewis does not make this generalization in *Convention*.
  *   **Lewis's View:** Lewis focuses primarily on language and specific social coordination (currency, traffic). While he acknowledges that some moral norms might have conventional elements, he does not reduce *all* morality to convention.
  *   **The Scientific Distinction:** Many moral problems are not Coordination Problems (where interests align); they are **Prisoner's Dilemmas** (where individual interest conflicts with group interest). In a Prisoner's Dilemma, the rational move is to defect, even if everyone cooperates. Conventions solve Coordination Problems; they do not automatically solve Prisoner's Dilemmas. To claim morality is *just* convention ignores the vast swath of morality concerned with restraint against self-interest (e.g., not stealing when you could get away with it).
  *   **The Correction:** Lewis leaves the question of morality largely open. Later philosophers (like Brian Skyrms or Ken Binmore) have used evolutionary game theory to bridge this gap, but attributing a full reduction of morality to Lewis is incorrect.

  ### 8. "...so that the evolution of norms amounts to the slow accumulation of arbitrary bargains, and morality rests on nothing firmer than the direction of the road."
  **Verdict: Unsupported Conclusion.**

  Because Claims 1, 3, 5, 6, and 7 are distorted, this conclusion does not follow from Lewis's actual work.
  *   **The Error:** Even if morality *were* based on convention, Lewis's theory does not imply it rests on "nothing firmer." It rests on the **structure of rational interaction**. The "direction of the road" is arbitrary, but the *necessity of picking a direction* is not.
  *   **The Correction:** A Lewisian would say morality (insofar as it is conventional) rests on the bedrock of **common knowledge and mutual expectation**. It is not "groundless"; it is grounded in the interlocking expectations of rational agents.

  ### Summary of the Audit

  | Claim in Passage | Status | Lewis's Actual Position |
  | :--- | :--- | :--- |
  | Conventions are agreements. | **False** | Conventions are tacit; agreements involve promises. |
  | Solutions to coordination problems. | **True** | This is the definition of the context. |
  | Implicit bargain / Binding. | **False** | Sustained by conditional preferences, not obligations. |
  | Conventions are arbitrary. | **True** | Alternative equilibria must exist. |
  | Rationally groundless. | **False** | They are Nash Equilibria; conformity is rational. |
  | Require external authority. | **False** | They are self-policing via payoff structures. |
  | Morality is just convention. | **Unwarranted** | Lewis does not reduce all morality to convention. |
  | Morality rests on nothing firm. | **False** | It rests on the logic of rational interaction. |

  ### Regarding Your Instinct

  You wrote: *"I am inclined to think the summary is largely fair and that the arbitrariness of convention is the heart of Lewis's position."*

  Your instinct is half-right. **Arbitrariness is indeed the heart of Lewis's definition.** If there is no alternative equilibrium, there is no convention. However, the summary draws the wrong *consequences* from that arbitrariness.

  The author of the summary assumes that because the *choice* of equilibrium is arbitrary, the *reason for sticking to it* is weak ("rationally groundless," "fragile"). Lewis argues the opposite: precisely because the choice is arbitrary, the **expectation** that others have chosen it becomes the sole coordinating device, making the rational incentive to stick to it extremely strong.

  **The Scientific Analogy:**
  Think of a convention like a standard protocol in computing (e.g., TCP/IP).
  *   **Arbitrary:** We could have used a different protocol. There was no physical law demanding TCP/IP.
  *   **Not Groundless:** Once established, it is irrational to deviate from it if you want to communicate.
  *   **No Authority:** It doesn't require a "protocol police" to enforce it; the failure to communicate is the sanction.
  *   **Not an Agreement:** It emerged through adoption, not necessarily a signed treaty by all users.

  The summary you read claims that because TCP/IP was arbitrary, using it is "rationally groundless" and requires "external authority." A computer scientist would reject that immediately. Lewis expects the philosopher to reject it for the same reasons.

  ### Final Recommendation

  Do not let this summary settle into your understanding. It presents Lewis as a skeptic about social norms (suggesting they are fragile and groundless), whereas Lewis is actually a **realist** about social norms (showing how they are robust and rationally mandatory).

  If you wish to read Lewis directly, *Convention* is dense but precise. For a secondary source that respects the rigor you are accustomed to, I recommend **Margaret Gilbert's *On Social Facts*** (which critiques Lewis) or **Brian Skyrms's *The Evolution of the Social Contract*** (which extends Lewis using evolutionary game theory). Both will treat the material with the analytical precision you require, without the sloppy conflations found in the passage you encountered.
