answer: |-
  This is a precise request for a translation layer between historical sociology and formal rational choice. You are asking for a structural isomorphism check: does the game-theoretic map preserve the topological features of the historical terrain, or does it smooth over the cliffs?

  Here is the systematic restatement, the residue report, the adjudication, and the critique of your attempt.

  ### I. The Three Models Restated

  #### 1. Argument (Moral Persuasion)
  *   **Players:** Moral agents (slaveholders, duelists).
  *   **Action Sets:** $\{ \text{Continue Practice}, \text{Abandon Practice} \}$.
  *   **Payoffs:** $U_i(a) = M_i(a) + S_i(a) + E_i(a)$, where $M$ is moral utility, $S$ is social, $E$ is economic.
  *   **Beliefs:** Agents update priors regarding the moral status of the practice ($P(\text{Practice is Wrong})$).
  *   **Common Knowledge:** The moral argument becomes common knowledge (everyone knows the argument, everyone knows everyone knows...).
  *   **Signal:** Public renunciation.
  *   **Index:** Indexes alignment with moral truth / updated priors.
  *   **Mechanism:** **Preference Change.** The parameter $M_i$ shifts exogenously (via persuasion) such that $U(\text{Abandon}) > U(\text{Continue})$ independent of what others do. This is a dominant strategy shift.

  #### 2. Interest (Economic/Material - Williams)
  *   **Players:** Economic elites (planters, aristocrats) vs. Competing elites (industrialists, merchants).
  *   **Action Sets:** $\{ \text{Maintain Institution}, \text{Switch Regime} \}$.
  *   **Payoffs:** $\pi_i(a)$. Purely material/profit function.
  *   **Beliefs:** Beliefs about relative profitability and political cost of maintenance.
  *   **Common Knowledge:** The institution is now a net liability.
  *   **Signal:** Legislative abolition / cessation of dueling.
  *   **Index:** Indexes economic rationality / modernization.
  *   **Mechanism:** **Constraint Change.** The feasible set or the production function changes. $\pi(\text{Slavery})$ drops below $\pi(\text{Wage Labor})$ due to external market shifts. Moral language is cheap talk (cheap signaling) attached to the material move.

  #### 3. Honor (Social Status - Appiah)
  *   **Players:** Members of the "Honor Group" (Gentlemen).
  *   **Action Sets:** $\{ \text{Participate}, \text{Refrain} \}$.
  *   **Payoffs:** $U_i(a, a_{-i}) = \text{Status}(a, a_{-i}) - \text{Cost}(a)$. Status is a function of coordination.
  *   **Beliefs:** Higher-order beliefs about what others will do and what others believe constitutes honor.
  *   **Common Knowledge:** The definition of "Gentleman" is a Schelling point.
  *   **Signal:** Participation (or refusal).
  *   **Index:** Indexes group membership.
  *   **Mechanism:** **Equilibrium Selection.** This is a Coordination Game (or Assurance Game).
      *   *Equilibrium A:* Everyone duels/owns slaves. Deviation = Loss of Status.
      *   *Equilibrium B:* No one duels/owns slaves. Deviation = Loss of Status (seen as barbaric).
      *   The shift is a cascade where the focal point moves from A to B. The payoff matrix doesn't change; the *expectations* of which equilibrium is being played change.

  ---

  ### II. The Residue Report

  You asked for an honest account of what gets lost. Here are the three specific residues.

  **(a) Direction of Change (Normativity)**
  *   **The Loss:** Your framework is orthogonal to "better." It models stability, not value.
  *   **The Translation:** "Moral Progress" translates to "Pareto Improvement" or "Kaldor-Hicks Efficiency" *only if* you stipulate the welfare function. If you treat the moral argument as a parameter shift in $U_i$ (Model 1), the framework accepts the shift but cannot validate it.
  *   **Verdict:** The realist's claim that abolition was a *discovery* (ontological truth) is inexpressible. The framework can only model it as a *convergence* on a new equilibrium. The claim "this is better" is an external annotation, not an internal variable.
  *   **Confidence:** High (95%). This is a standard limitation of positive vs. normative modeling.

  **(b) Honor's First-Personal Grip (Constitutive vs. Instrumental)**
  *   **The Loss:** In Model 3, I modeled honor as a payoff (Status). But Appiah argues honor is often *constitutive*. The duelist does not duel to *get* honor; he duels because he *is* a gentleman. To refuse is not to lose points; it is to cease to be the agent in the model.
  *   **The Translation:** Game theory treats identity as exogenous to the move. If identity is endogenous (the move defines the player), the payoff function becomes circular: $U_i$ depends on Identity, Identity depends on Action, Action depends on $U_i$.
  *   **Verdict:** Your payoff slot cannot hold this without circularity. To model it, you must treat "Identity" as a state variable that depreciates if the action isn't taken, but this instrumentalizes the identity, missing the phenomenological "grip."
  *   **Confidence:** Medium-High (85%). This is the hardest formalization problem in rational choice (the "internalism" problem).

  **(c) Discontinuity (Ontology of Actions)**
  *   **The Loss:** Moral revolutions often re-describe the action space. "Owning a slave" becomes "Kidnapping a person."
  *   **The Translation:** Your framework assumes a fixed action space $A$. If the *description* of $a \in A$ changes, the game itself changes.
  *   **Verdict:** This is a change in the game, not a parameter move. If "dueling" is re-categorized from "Conflict Resolution" to "Murder," the legal and moral constraints attach to a different node. The framework treats this as a discontinuous jump in payoffs, but historically it feels like a change in vocabulary.
  *   **Confidence:** High (90%). This is a standard critique of static game theory regarding paradigm shifts.

  ---

  ### III. Adjudication

  You asked me to adjudicate between the three candidates, not just list them.

  **The Verdict:** **Honor (Model 3) is the primary mechanism of collapse, Interest (Model 2) is the background stressor, and Argument (Model 1) is the content of the signal.**

  **Reasoning:**
  1.  **Timing:** The Argument model fails the timing test. As you noted, moral arguments against slavery and dueling existed for centuries prior to collapse. If $M_i$ were the driver, the shift should have been gradual and correlated with the spread of literacy/philosophy. It was often sudden and clustered.
  2.  **Cost:** The Interest model fails the cost test. In many cases (e.g., British abolition), elites paid significant compensation to end slavery, or duelists died at rates that exceeded any rational "status gain" calculation. If it were pure profit, they would have waited longer or found cheaper ways to signal.
  3.  **Coordination:** The Honor model explains the *cascade*. Norms are network effects. Once the definition of "Gentleman" flips (via a focal point shift), the payoff for the old behavior crashes *because* others stop doing it. This explains why the collapse accelerates once it begins.

  **Confidence:** Medium (75%). Historical counterfactuals are inherently uncertain. However, Appiah's coordination model fits the *dynamics* of norm collapse better than the linear models of Interest or Argument.

  ---

  ### IV. Critique of Your Attempt

  > *Your Attempt:* Model the duel as a costly-signaling equilibrium in which the signal is willingness to bear mortal risk, and treat the collapse as a change in what the signal indexes, the same act flipping from proving you are a gentleman to proving you are a barbarian.

  **Is this a translation or a substitution?**
  It is a **substitution**. It is a faithful translation of the *structure* of the Honor model, but it substitutes the *motivation*.

  **What it quietly threw away:**
  1.  **Instrumentalization of Honor:** By framing it as "signaling," you imply the agent cares about the *status* resulting from the signal. Appiah's point is that the agent often cares about the *honor* intrinsically. The signaling model assumes: *I duel because I want you to think I'm brave.* The Honor model suggests: *I duel because if I don't, I am not brave (and thus not me).*
  2.  **The Common Knowledge Trigger:** Your model implies the index flipped. But *why* did it flip? In a pure signaling equilibrium, the cost of the signal (death) is constant. For the index to flip, the *receivers* must change their interpretation. Your model describes the *state* before and after, but it doesn't model the *transition mechanism* (the coordination cascade) as well as the Assurance Game model does.
  3.  **Moral Content:** By reducing it to "Gentleman vs. Barbarian," you strip out the moral content that Appiah says was crucial. The signal didn't just flip from "High Status" to "Low Status"; it flipped from "Virtuous" to "Vicious." Your model captures the status cost, but treats the moral valuation as arbitrary labeling rather than a shift in the shared utility function regarding harm.

  **Confidence:** High (90%). Signaling models are inherently instrumental; constitutive norms are not.

  ---

  ### V. Confidence and Uncertainty

  **Confidence Levels:**
  *   **Structural Mapping (Section I):** 95%. The game-theoretic translations are standard applications of the models.
  *   **Residue Report (Section II):** 90%. These are well-known philosophical limitations of rational choice.
  *   **Adjudication (Section III):** 75%. Historical causality is multivariate; privileging Honor is theoretically sound but historically debatable.
  *   **Critique of Your Attempt (Section IV):** 90%. The distinction between signaling and constitutive rules is robust in philosophy of action.

  **Point of Least Certainty:**
  I am least sure about **Residue (b): Honor's First-Personal Grip.**
  *   **Reason:** There is ongoing work in "identity economics" (Akerlof/Kranton) that attempts to endogenize identity into the utility function without circularity. It is possible that a sufficiently sophisticated causal model *could* capture the constitutive nature of honor by treating identity as a capital stock that depreciates with specific actions. I am hedging here because the boundary between "instrumental signaling" and "constitutive identity" may be a modeling choice rather than a hard ontological limit. If you allow dynamic identity updating, the "circularity" might resolve into a feedback loop.

  **Summary:** Your toolkit is sufficient to model the *dynamics* of the collapse (the coordination cascade), but it requires you to treat "moral progress" as an exogenous parameter shock to the utility function, and it struggles to capture the *phenomenology* of why the agents felt bound by the norm in the first place. You can model the switch, but not the "ought."
