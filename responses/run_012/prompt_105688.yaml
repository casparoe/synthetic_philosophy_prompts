answer: |-
  The rain against the single-glazed window of the Bristol Geophysics staff room was the only constant in 1978. Inside, the air smelled of stale tobacco and wet wool. Arthur, Elena, and Simon sat around a Formica table scattered with core samples and printouts. They were three years into the Lithic Capacitance programme. The theory was elegant: sandstone under pressure acted as a capacitor, storing stress as electrical charge until discharge precipitated a micro-shift. It promised a way to hear the earth scream before it broke.

  The first prediction had held. Micro-tremors did follow charge spikes. But the second prediction, the stimulation test, had flopped. At the quarry site, they had vibrated the rock face artificially, expecting a premature discharge. The meters had stayed flat.

  Arthur stirred his tea, the spoon clinking against the mug. "The pore saturation," he said, not looking up. "We assumed the strata was dry enough. If the interstitial water content was above four per cent, it would short the circuit before the meter could catch it."

  Elena leaned forward. She was the post-doc, the one who kept the equations honest. "It's physically possible," she admitted. "Water conducts. If the rock was wetter than the borehole logs suggested, the charge dissipates locally. We wouldn't see it."

  "Exactly," Arthur said. "So the theory holds, provided we adjust for moisture variance. It's not a failure of mechanism, just of site selection."

  Simon, the PhD student, shifted in his chair. "So we add a variable. Moisture threshold."

  "A parameter," Arthur corrected gently. "And yes. It's a reasonable constraint. We test for it next time."

  They didn't test for it. They simply noted the moisture caveat in the logbook and moved to the lab control. Simon was tasked with running the stimulation on dried cores under controlled pressure. It was the clean test. The one that would settle whether the mechanism existed in isolation.

  Simon brought the results to the meeting on a Tuesday. He looked exhausted. "The oven," he said. "The thermostat on the drying chamber drifted. It spiked to eighty degrees instead of sixty."

  Arthur frowned. "Did the core survive?"

  "It cracked," Simon said. "Thermal shock. When we applied the vibration, it shattered immediately. No charge recorded, just mechanical failure."

  Arthur sat back. "Well. The shatter indicates structural fragility under stress. That's consistent with the capacitance model. The energy released as fracture rather than charge."

  "It's invalid," Simon said, his voice tight. "The rock was compromised before we started. The variable wasn't stress, it was heat damage. We can't count this run."

  "We can't discard it simply because it's messy," Arthur countered. "Nature is messy. If the theory is robust, it should account for thermal variance."

  "It wasn't designed to," Simon said. "The protocol specified sixty degrees."

  The room went quiet. The rain hammered the glass. Elena looked from the shattered rock on the table to the pressure gauge logs. She realised then that the data wasn't speaking. The numbers were just numbers. The gauge might have stuck, the rock might have been wet, the theory might be wrong. All three were tied together in a knot.

  "The instrument, the sample, or the idea," Elena said softly. "When the result comes back wrong, something has to give. But the data doesn't tell us which bit. We choose. We decide whether the oven broke the science, or the science survived the oven."

  Arthur bristled. "We don't choose reality, Elena."

  "We choose what counts as evidence of it," she said. "If we keep the theory, the oven is the culprit. If we keep the oven, the theory is the culprit. Both fit the facts we have."

  Nobody answered. It sat there, uncomfortable and true. To admit it was to admit that their careers rested on a series of administrative decisions about what counted as a valid run.

  Later that afternoon, Arthur was on the phone with a colleague at Cambridge, discussing a paper on magnetic declination shifts. His voice was sharp, ruthless.

  "I can't see how you publish this," Arthur said, pacing the office. "Your magnetometer calibration window is too broad. You haven't excluded local interference. Without strict controls, it's just noise. You need to exclude the variable or discard the set."

  He hung up and turned to see Margaret, the department head, standing in the doorway. She held the budget renewal forms for the Lithic Capacitance programme. She had heard the end of the call. She had also read Simon's report on the broken oven.

  Arthur sighed, rubbing his temples. "Standards have to be maintained. If we let sloppy data in, the whole field collapses."

  Margaret walked to the table and looked at the shattered core. She looked at the logbook where the moisture caveat was written in Arthur's hand. She understood the tension. She knew Arthur needed the grant to finish his year. She knew Simon needed the data for his thesis. She knew Elena was right about the choice, but that acknowledging it would stop the work entirely.

  Margaret sat down. She picked up her pen. She didn't ask for a verdict on the theory. She didn't ask if the oven ruined the test. She simply looked at the budget line for equipment maintenance.

  "I'll approve the renewal," Margaret said, her voice flat. "But I'm earmarking funds for a new drying chamber. And I want the next protocol to specify what happens if the temperature drifts. Define the exclusion criteria before you turn the oven on."

  Arthur nodded, relieved. Simon looked at the floor. Elena watched the rain.

  "Six months," Margaret said, signing the form. "Then we decide if the moisture parameter holds."

  She capped the pen. The theory lived, not because it was proven, but because the cost of stopping was higher than the cost of another six months of rain.
