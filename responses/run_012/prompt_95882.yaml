answer: |-
  Here is a sorting of your candidate solutions into tiers, ranked by how directly they address the original logical representational problem (how to specify change without explicitly specifying non-change) versus how much they shift the goalposts.

  ### Tier 1: Genuine Logical Solutions
  *These tackle the representational efficiency problem head-on and largely close it within their specific formalisms.*

  **Successor-State Axioms (Situation Calculus)**
  This is the closest thing to a definitive solution for the logical frame problem, as it mathematically eliminates the need for explicit frame axioms by defining exactly when fluents change.
  *Untouched:* It solves the representational issue but leaves the computational complexity of projecting actions in massive domains largely to the engineer, and it does not touch the philosophical 'relevance' problem.

  **STRIPS-style Assumption**
  This solves the practical engineering problem by fiat, assuming the world is static unless an operator dictates otherwise, which bypasses the need for logical derivation of non-change.
  *Untouched:* It leaves the logical justification entirely untouched; it is a restrictive assumption on the world representation rather than a general solution to reasoning about change.

  ### Tier 2: Formal Attempts with Caveats
  *These attempted to solve the general logical problem using non-monotonic reasoning but required significant patching or faced specific counter-examples.*

  **Circumscription & Default Logic**
  These provided the necessary machinery for non-monotonic reasoning to minimise 'abnormalities', directly addressing McCarthy's original call for a logical formalism.
  *Untouched:* They initially failed to handle temporal projection correctly (as shown by the Yale Shooting Problem), requiring complex modifications that arguably reduced their elegance and generality.

  **Patches for the Yale Shooting Problem**
  These are reactive fixes that demonstrate the previous formalisms were incomplete rather than standing as independent solutions themselves.
  *Untouched:* They solve the specific temporal anomaly but often at the cost of increased computational complexity or by introducing new constraints that limit the expressiveness of the original logic.

  ### Tier 3: Dissolutions and Ontological Shifts
  *These do not solve the original problem; they argue the problem only exists because of the chosen framework.*

  **The Dreyfus-flavoured Claim (Know-how vs. Know-that)**
  This dissolves the problem by rejecting the premise that intelligent action relies on explicit propositional representations that require frame axioms in the first place.
  *Untouched:* It leaves the original logical challenge completely untouched, as it offers no formalism for reasoning about change, only a phenomenological critique of representation.

  **RL / End-to-End World Models**
  This avoids the problem by subsuming it into statistical learning, where 'frame' issues become matters of inductive bias and feature relevance rather than logical axioms.
  *Untouched:* Your suspicion is well-founded; the problem re-emerges as the 'credit assignment problem' or sample inefficiency, effectively hiding the frame problem inside the network architecture rather than solving it.

  ***

  ### On Dissolving, Fractions, and Annoying the KR Crowd

  **Is dissolving a legitimate answer?**
  In philosophy, dissolving a problem is often the highest form of solution (à la Wittgenstein), but in computer science, it can look like a dodge. If the problem is "how do we build a system that reasons about change?", and you reply "don't use reasoning, use statistics", you haven't solved the engineering challenge, you've sidestepped it. However, if the problem is "how does the mind handle relevance?", and the premise is "the mind uses logic", then dissolving the premise is the only honest move. In your thesis, you must distinguish between the *Logical Frame Problem* (a bug in our formalisms) and the *Philosophical Frame Problem* (a bug in our theory of mind). The former can be solved; the latter is likely dissolved.

  **The Fractions**
  If we are talking strictly about the original McCarthy and Hayes formulation (representational efficiency in logic), I would reckon **80%** of that specific problem is handled by Tier 1 (specifically Successor-State Axioms). However, if you look at the broader literature claiming to address "The Frame Problem" (including the philosophical relevance issues), I would estimate that **90%** of the apparent progress is merely restating the problem in a vocabulary where it cannot be asked, rather than answering it. We got very good at writing compact axioms; we did not get much closer to explaining how a system knows what matters.

  **What will annoy the Classical KR People?**
  The thing that will irritate your audience most is if you conflate the Logical Frame Problem with the Philosophical one and imply that because the latter remains open, the former was a waste of time. Classical KR researchers view Reiter's work on Successor-State Axioms as a closed, solved mathematical chapter. If you suggest their work is "merely engineering" or that it fails because it doesn't solve Fodor's problem of global relevance, they will rightly accuse you of moving the goalposts. Acknowledge that they solved the logical representational problem definitively, even if the philosophical spectre of relevance still haunts the broader field of AI. Treat their solutions as successful within their domain, rather than as failed attempts at cognitive science.
