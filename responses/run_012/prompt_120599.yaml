              *   *Generalization:* Counts *against* user. Suggests abstract concepts, not just memorization. *Defense:* Interpolation in high-dimensional space, not conceptual grasp.
              *   *Uncertainty:* Counts *against* user. Suggests epistemic state. *Defense:* Calibration of probability distributions, not epistemic humility.

      *   **Section 6: The "Best Explanation" Bar:**
