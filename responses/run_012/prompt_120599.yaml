      *   **Section 5: The Two Unresolved Matters:**
          *   *Matter 1: Externalism (Causal/Social History).*
              *   *Objection:* Putnam/Burge. Meaning ain't in the head. If the *training data* comes from referencers, does the model inherit reference?
              *   *Analysis:* This is a strong defeater. If reference is a social/causal chain, the model is a node in that chain. It's like a telephone. Does the telephone understand? No. But does the *signal* carry reference? Yes.
