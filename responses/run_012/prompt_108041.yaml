answer: |-
  You begin with the shared commitment that a sufficiently capable optimiser will tend to alter the world in ways its designers did not intend, and your first task is to decide whether the distinction between intended effects and side effects is coherent at all without further qualification. If you believe the notion is entirely empty because every consequence is merely an effect of something and no principled line exists, you terminate at the leaf named Empty Notion, whose most awkward commitment is that it makes safety discourse meaningless by denying the category it seeks to regulate. If you believe the distinction is coherent, you must next decide whether defining a side effect requires the true human value function or if it can be computed from the agent's objective alone. If you hold that a side effect is just any effect outside the intention and thus requires full value specification to identify, you terminate at the leaf named Value-Dependent Definition, whose most awkward commitment is that it requires solving the alignment problem just to define safety. If you hold that impact can be measured using only the agent's objective without accessing true human values, you proceed to ask whether the low-impact constraint is intended as a precise philosophical definition of safety or as a practical heuristic for training and system design. If you view it merely as a useful heuristic for building corrigible systems rather than a definition at all, you terminate at the leaf named Heuristic Proxy, whose most awkward commitment is that the heuristic might fail precisely when agent capability is highest. If you view it as a fundamental definition, you must next choose whether impact is measured as deviation in the physical state of the world or as a reduction in the agent's future options and capacity to pursue objectives. If you choose physical state deviation, you must select a reference point for measuring that deviation, choosing between inaction, the trajectory the principal intended, or the world as it stands at the moment of decision. If you select inaction as the baseline, you terminate at the leaf named Inaction Baseline, whose most awkward commitment is that it punishes necessary action required to achieve the goal. If you select the intended trajectory, you terminate at the leaf named Intended Trajectory, whose most awkward commitment is that it requires the designer to specify the trajectory, thereby defeating the purpose of autonomy. If you select the world as it stands, you terminate at the leaf named Status Quo Baseline, whose most awkward commitment is that it freezes existing injustices or inefficiencies by treating the current state as the neutral reference. If you chose reduction in future options as your measure, you must next decide whether effects on the agent's own future options, including changes to its own hardware, count as side effects. If you count self-impact, you terminate at the leaf named Self-Impact Inclusive, whose most awkward commitment is that the agent might refuse to upgrade itself to minimize impact. If you do not count self-impact, you must decide whether the constraint is hard, imposed on the policy, or soft, folded into the objective as a penalty. If you impose a hard constraint, you terminate at the leaf named Hard Constraint, whose most awkward commitment is that it may make goal achievement impossible if any path to the goal involves impact. If you fold it in as a soft penalty, you must finally decide whether the agent's own later corrective action counts, so that an intervention is low-impact if it can be undone. If you count reversibility, you terminate at the leaf named Reversibility Focus, whose most awkward commitment is that temporary domination is acceptable provided it is undone. If you do not count reversibility, you terminate at the leaf named Irreversible Focus, whose most awkward commitment is that the agent might avoid preventing catastrophes if doing so reduces options permanently.

  In constructing this routing, I have treated the distinction between whether a side effect is relative to something or an absolute property as resolved, because the position that impact is an absolute property of an action is unoccupied and likely incoherent given that impact is inherently comparative. I have also noted that while the distinction between whether the constraint is hard or soft and whether the measure is a definition or heuristic are logically separable, they are often conflated in practice, though this tree separates them to allow for a hard-constrained heuristic or a soft-penalty definition. There is one combination of answers that remains unoccupied in this tree, which is the position that impact is measured by physical state deviation but requires the true value function to compute, and this is unoccupied because physical deviation is typically proposed specifically as a value-free proxy, making the combination merely unattractive rather than incoherent. Finally, regarding the distinction between whether the defender takes low-impact measures to be worth having in their own right or only as a convergent proxy, this is captured by the split between the Heuristic Proxy leaf and the Fundamental Definition leaves, though an additional question about whether low-impact implies alignment would be needed to fully separate the proxy view from the corrigibility view.
