answer: |-
  ### Exam Question: Philosophy of Biology (Function Unit)
  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Manage your time to cover all parts)

  **The Case of the Copper Reed Frog**
  Consider the male Copper Reed Frog. On its forearm, it possesses a specialized gland.
  1.  **Ancestral State:** In the ancestral population, this gland secreted an antimicrobial compound. This prevented infections from the female's mating grip. The trait was selected for specifically because it reduced infection-related mortality.
  2.  **Derived Wild Population:** In the current wild population, the pathogen is extinct. However, the secretion now acts as a pheromone that increases female receptivity. Males with higher output secure more matings. The trait is currently under sexual selection.
  3.  **Lab Colony:** A captive colony has been kept germ-free for 50 generations. Females are paired randomly (no choice). The gland secretes normally, but the secretion affects neither health nor mating success.
  4.  **Blocked Duct Variant:** In the Derived Wild Population, some males possess the gland tissue, but a developmental error blocks the duct. No secretion occurs, though the tissue remains.

  **The Task**
  Analyze the **function** of the gland in these scenarios using two competing theoretical frameworks:
  *   **Account A (History-Based):** A trait's function is determined by the effects for which it was historically selected. (Note: You must distinguish between the view that looks at *any* point in evolutionary history versus the view that requires selection under the *current* regime).
  *   **Account B (Capacity-Based):** A trait's function is determined by its current causal contribution to the capacity of a containing system.

  **In your essay, you must:**
  1.  Determine what each account identifies as the function (or lack thereof) in the **Derived Wild Population**, explicitly addressing the tension between original history and recent selection within Account A.
  2.  Determine the functional status of the gland in the **Lab Colony** according to both accounts.
  3.  Explain how each account handles the **Blocked Duct Variant** (i.e., does it have a function? is it malfunctioning?).
  4.  **Evaluate:** Defend one account as superior. Acknowledge the specific theoretical cost or counter-intuitive result your chosen account must accept in this specific case.

  ***

  ### Model Answer

  The Copper Reed Frog case exposes the fault lines between History-Based (Etiological) and Capacity-Based (Causal-Role) accounts of function. The divergence is sharpest in the Derived Wild Population. For the Capacity-Based account, the function is straightforward: the gland contributes to reproductive success by increasing female receptivity. Its current causal role defines its function. For the History-Based account, a split emerges. If function requires selection at *any* point in history, the function remains antimicrobial protection, as that is why the trait originated. If function requires selection under the *current* regime, the function shifts to pheromone secretion. The History-Based view thus risks either irrelevance (citing a defunct ancestral role) or instability (function changes as selection pressures shift).

  The Lab Colony clarifies the Capacity-Based account's reliance on current systemic contribution. Since the secretion affects neither health nor mating in this environment, the gland has no function on this account; it is merely a trait present in the organism. The History-Based account, conversely, maintains the gland has a function (either antimicrobial or pheromonal, depending on the historical cutoff) regardless of current utility, because the etiological history remains intact. This highlights the Capacity-Based account's vulnerability to environmental context: functions vanish when the system changes, even if the trait does not.

  The Blocked Duct Variant is the decisive test. In the Derived Wild Population, a male with a blocked duct cannot secrete the pheromone. The Capacity-Based account struggles here: if function is defined by actual causal contribution, and this gland contributes nothing, it has no function. Consequently, it cannot be said to be *malfunctioning*; it is simply functionless. This contradicts biological intuition, which suggests the gland is broken. The History-Based account handles this easily: the gland has a function (based on history/current selection) but fails to perform it. It is a clear case of malfunction.

  I defend the History-Based account (specifically the "current regime" variant) as superior because it preserves the normativity essential to biological discourse—specifically, the distinction between a trait lacking a function and a trait failing to perform its function. The Capacity-Based account collapses this distinction, rendering pathology inexplicable.

  However, this choice comes at a cost. By tying function to the current selective regime, we must accept that the gland's function changed abruptly when the pathogen vanished and the pheromone effect became advantageous. This makes function extrinsic and potentially volatile. We must accept that what a trait *is for* depends entirely on the current environment, not its structural design. Yet, this cost is preferable to the Capacity-Based failure to account for malfunction. Without a historical standard to judge failure against, we cannot make sense of disease or developmental error, which are central to biological practice.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Application of History-Based Account to Derived Population (4 Marks)**
  *   **Criteria:** Student identifies the conflict between ancestral origin (antimicrobial) and recent selection (pheromone). Must explicitly distinguish between "original history" and "recent history" versions of the account.
  *   **Common Mistake:** Treating the History-Based account as monolithic and claiming it only supports the ancestral function, ignoring the "recent selection" nuance required by the prompt.

  **2. Application of Capacity-Based Account to Lab Colony (4 Marks)**
  *   **Criteria:** Student correctly identifies that the Capacity-Based account likely denies the trait has a function in the lab (no causal contribution to system capacity).
  *   **Common Mistake:** Arguing that the gland retains function in the lab because it *could* work if moved, confusing dispositional properties with actual systemic contribution.

  **3. Analysis of the Blocked Duct (Malfunction Problem) (4 Marks)**
  *   **Criteria:** Student explains that the Capacity-Based account cannot easily classify the blocked duct as "malfunctioning" (since it contributes nothing), whereas the History-Based account can.
  *   **Common Mistake:** Claiming the Capacity-Based account solves this by appealing to "normal conditions" without explaining how that fits the causal-role definition provided in the prompt.

  **4. Analysis of Function Loss vs. Retention (4 Marks)**
  *   **Criteria:** Student contrasts how the two accounts handle the Lab Colony regarding function retention. History-Based says function remains; Capacity-Based says function is lost.
  *   **Common Mistake:** Failing to note that the Capacity-Based account makes function environment-dependent, leading to the counter-intuitive result that moving a frog changes its anatomy's functions.

  **5. Normative Evaluation and Cost Assessment (4 Marks)**
  *   **Criteria:** Student takes a definitive side and identifies a specific theoretical cost (e.g., volatility of function vs. inability to explain malfunction).
  *   **Common Mistake:** Sitting on the fence ("both have pros and cons") without defending one as superior, or identifying a cost that is not relevant to the specific frog case provided.
