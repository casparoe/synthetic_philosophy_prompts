  5. **Justification vs. Modeling (0.30):** Proponents frame SI as idealization of rational belief updating, not a metaphysical guarantee of truth. If SI is a normative model for consistency rather than a descriptive map of reality, UTM dependence is akin to choosing a coordinate system. The objection demands ontological grounding from a tool designed for epistemic coherence. It functions as a standard for rationality, not reality.
