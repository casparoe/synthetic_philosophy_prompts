  1. **Fixed in Advance (0.20):** SI requires fixing $U$ before observing the sequence. Hardcoding a string $s$ into $U$ reduces $K(s)$ but increases $K(s')$ for most others due to prefix-free constraints. This preserves relative complexity ordering for most pairs, making the "designer" advantage local and costly globally, not a global refutation of the ranking structure. Consequently, the machine choice shifts values but preserves order.
  2. **Asymptotic Regime (0.10):** SI is justified by convergence properties in the limit of infinite data, where it dominates any computable measure. The invariance theorem guarantees probability ratios converge regardless of the additive constant. If the project is about long-run truth identification, the constant is mathematically negligible. The objection only bites if SI claims finite-sample absolute truth, which proponents deny. Thus, for large datasets, the specific machine choice matters less.
  3. **Formalization Robustness (0.40):** Alternatives like logical depth or two-part MDL codes also rely on reference machines to define complexity. If UTM dependence invalidates SI, it invalidates all computational simplicity measures equally. This suggests the issue is inherent to formalizing induction itself, not unique to SI, weakening the claim that SI specifically fails where others might succeed. Therefore, rejecting SI on these grounds rejects compression itself.
