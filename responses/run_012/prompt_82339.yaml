prompt: |-
  I'm a novelist, not a philosopher, but I've been asked to run a 90-minute session for about 18 undergrads in an ethics elective, and what I want is for them to walk out having felt the pull of the procreation asymmetry — the thing where it seems obviously wrong to bring a suffering child into the world and yet not remotely required to bring a happy one, even though those two attitudes don't obviously fit together. Don't let the name into the room until the debrief. Put on your philosopher-and-game-designer hat, think it through carefully, and brainstorm two or three mechanics before you commit to one.

  What I'm picturing: tables of four play a "Registry of Births" that must issue exactly one rule — "the Registry shall refuse a life iff ___" — and apply it to a stack of case cards I hand out, each describing only the life that would result, never anyone currently existing. Then the twist: rules get swapped between tables, and each group has to defend somebody else's rule against a printed sheet of objections, including the one about nobody being worse off when nobody exists either way. And a round where their own rule, applied honestly, drags them to a verdict they hate.

  Give me the case cards written out, a seperate objection sheet, the timeline, the debrief that maps each round onto a piece of the asymmetry, what predictably goes wrong the first time I run it, and be honest about which part of the idea the activity can't reproduce and I'll just have to say out loud. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Novelist (storyteller focus), not philosopher.
      *   **Task:** Run a 90-minute ethics session for ~18 undergrads (ethics elective).
      *   **Goal:** Students *feel* the pull of the Procreation Asymmetry (wrong to create suffering, not required to create happiness) without knowing the term until the end.
      *   **Constraint:** Don't reveal the name/concept until debrief.
      *   **Role:** Philosopher-and-Game-Designer hat (needs rigor + playability).
      *   **Process:** Brainstorm 2-3 mechanics, commit to one, then provide full materials (cards, objections, timeline, debrief, pitfalls, limitations).
      *   **Specific Idea Provided:** "Registry of Births" game. Tables of 4. Create one rule ("Refuse life iff..."). Apply to case cards. Swap rules. Defend against objections (including non-identity/non-existence issues). Round where their rule forces a hated verdict.
      *   **Output:** Case cards, Objection Sheet, Timeline, Debrief (mapping rounds to asymmetry), Predictable Failures, Limitations (what the activity *can't* do).
      *   **Tone:** American English, practical, honest.

  2.  **Brainstorming Mechanics:**

      *   *Idea 1: The Registry (User's Proposal).*
          *   *Pros:* Directly engages with rule-utilitarian/deontological framing. Forces abstraction. The "swap" mechanic creates distance/objectivity.
          *   *Cons:* Might get too bogged down in wording lawyering. "Refuse iff" is a high cognitive load for a warm-up.
          *   *Verdict:* Strong core, needs tuning to ensure the *asymmetry* specifically emerges, not just general utilitarianism.

      *   *Idea 2: The Soul Vending Machine.*
          *   *Pros:* More metaphorical. Students "purchase" lives to instantiate. Budget constraints force trade-offs.
          *   *Cons:* Might trivialize the gravity of existence. Risks turning into a resource management game rather than an ethical intuition pump.
          *   *Verdict:* Too gamified, might lose the ethical weight.

      *   *Idea 3: The Council of Guardians.*
          *   *Pros:* Roleplay. Each student represents a potential person (described on a card). They vote on who gets to be born.
          *   *Cons:* Logistically tricky (18 students = 18 cards? Need more). The "potential person" voting on their own existence is paradoxical and confusing.
          *   *Verdict:* Too abstract/confusing.

      *   *Decision:* Stick with **Idea 1 (The Registry)** but refine it. It's the most robust for generating the specific logical tension of the asymmetry. The "Swap and Defend" is excellent for exposing contradictions. I need to ensure the Case Cards are graded clearly on Happiness/Suffering so the asymmetry becomes obvious.

  3.  **Refining the "Registry" Mechanics:**
      *   *Goal:* Make the asymmetry pop.
      *   *Structure:*
          1.  **Drafting:** Groups write the rule.
          2.  **Application:** Apply to cards.
          3.  **The Swap:** Apply *another* group's rule.
          4.  **The Crisis:** A specific card that breaks their intuition.
      *   *Crucial Tweak:* The prompt mentions a round where "their own rule... drags them to a verdict they hate." This needs to be engineered. I need cards that force the "Happy Child" question.

  4.  **Developing Materials:**

      *   **Case Cards:** Need a spectrum.
          *   Type A: Miserable Life (Clear "Don't Born").
          *   Type B: Neutral/Barely Worth Living (The Grey Zone).
          *   Type C: Happy Life (The "Is it required?" Zone).
          *   Type D: Super Happy Life (The "Is it *more* required?" Zone).
      *   **Objection Sheet:** Needs to hit the Non-Identity Problem and the Asymmetry specifically without using jargon. "The Void Objection" (no one is harmed by not existing).
      *   **Timeline:** 90 mins is tight. Need strict timekeeping.
          *   Intro (5)
          *   Rule Drafting (15)
          *   Round 1: Own Rule (20)
          *   Round 2: Swap & Defend (20)
          *   Round 3: The Trap (20)
          *   Debrief (10)
          *   *Correction:* 90 mins allows for a bit more breathing room. Let's adjust.

  5.  **Drafting the Content (Iterative Process):**

      *   *Cards:* Keep them visceral. Novelist touch. "Chronic pain," "Joyful artist," "Mediocre accountant."
      *   *Objections:* Make them sound like angry citizens or logical traps.
      *   *Debrief:* This is the most important part. I need to map the game feelings to the philosophical concepts (Benatar, Parfit, etc.) without lecturing too hard.
      *   *Limitations:* Be honest. A game can't solve the metaphysics. It can't replicate the *weight* of actual parenthood. It creates a "view from nowhere" which is philosophically useful but humanly distant.

  6.  **Addressing the "Predictable Failures":**
      *   Students will write vague rules ("If the life is bad").
      *   Students will focus on the parents' happiness (utilitarian calculus) rather than the child's (person-affecting). I need to constrain the prompt to focus *only* on the resulting life.
      *   They might laugh at the "Super Happy" card. Need to frame it seriously.

  7.  **Final Review against Constraints:**
      *   American English? Yes.
      *   No jargon until debrief? Yes.
      *   Novelist-friendly? Yes, focus on narrative and feeling.
      *   Philosopher-rigorous? Yes, the logic holds.
      *   Game-designer practical? Yes, clear phases.

  8.  **Writing the Response:** (Self-Correction during drafting)
      *   *Wait, one check:* The prompt asks me to "brainstorm two or three mechanics before you commit to one." I should explicitly show this thinking in the output to demonstrate I followed instructions, or at least structure the response to show I considered alternatives before landing on the Registry. *Correction:* The prompt says "think it through carefully, and brainstorm two or three mechanics before you commit to one." I will include a brief section at the start outlining the considered mechanics to show the work, then proceed with the Registry.
      *   *Wait, another check:* "Give me the case cards written out." I need to provide the actual text for the cards.
      *   *Wait, another check:* "Be honest about which part of the idea the activity can't reproduce." This is crucial. The game simulates logic, not the emotional burden of creation.

      *(Self-Correction on Mechanics Section)*: Actually, looking at the prompt again ("Put on your philosopher-and-game-designer hat, think it through carefully, and brainstorm two or three mechanics before you commit to one."), it implies I should do this thinking *before* generating the final plan. I will include a "Design Log" section to satisfy this requirement explicitly.

      *(Refining the Asymmetry)*: The core tension is:
      1.  Duty to avoid suffering (Presence of Pain is Bad).
      2.  No Duty to create happiness (Absence of Pleasure is Not Bad).
      The game must force them to write a rule that covers #1, then show them that rule fails #2, or vice versa.
      *Round 3 (The Trap)* needs to be a "Golden Child" card. If their rule says "Allow all happy lives," they haven't learned the asymmetry (that's standard utilitarianism). If their rule says "Only allow if net positive," they might be okay. The trap is: Does their rule *require* the happy life? Most won't write a rule that *requires* birth. So the trap is actually the *Objection Sheet* in Round 2. "Why didn't you require this happy life?"
      *Actually, better trap:* A card that is "Happy, but costly to others." No, keep it isolated.
      *Best Trap:* A life that is "Worth Living" but "Not Amazing." If their rule is "Refuse iff Suffering," they allow it. If their rule is "Allow iff Amazing," they refuse it. The tension is: Do we owe it to the mediocre-happy kid to be born?
      *Let's stick to the prompt's suggestion:* "Round where their own rule, applied honestly, drags them to a verdict they hate."
      Okay, I will design a card that is "Happy, but the parents are tired." No, the prompt says "describing only the life that would result."
      Okay, Card 5: "A life of quiet contentment. No great joys, no great pains. The person is glad to be alive, but would not have minded never starting."
      If their rule is "Refuse iff Suffering," they allow it. (Fine).
      If their rule is "Allow iff Great Joy," they refuse it. (Does this feel wrong?)
      *The Real Trap:* The "Obligation" trap. Most groups will write "Refuse iff..." (Negative duty). They won't write "Require iff..." (Positive duty). The trap is revealing that their rule permits *not* creating a happy child, and the Objection Sheet attacks them for that.

      *Okay, let's finalize the plan.*

      *   **Design Log:** Briefly outline 3 mechanics, choose Registry.
      *   **Materials:** Cards, Objections, Rule Sheet.
      *   **Timeline:** Minute-by-minute.
