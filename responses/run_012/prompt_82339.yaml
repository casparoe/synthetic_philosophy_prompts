answer: |-
  ### Design Log: Mechanics Brainstorm

  Before settling on the "Registry" concept you pitched, I weighed three mechanical approaches to see which best generates the *feeling* of the asymmetry without the jargon.

  1.  **The Soul Vending Machine (Resource Management):** Students get a budget of "Existence Points." Each potential life costs points based on how happy it will be. They must spend their budget to maximize total happiness.
      *   *Verdict:* **Discard.** This forces a utilitarian calculus (maximize good) which obscures the asymmetry. It makes creating a happy child a *transaction*, not a moral question. It suggests we *should* create happy kids if we can afford them, which begs the question.
  2.  **The Council of Guardians (Roleplay):** Each student holds a card describing a potential person. They debate whether to "open the gate" for themselves.
      *   *Verdict:* **Discard.** Too logistically messy for 18 students. Also, it creates a paradox: a non-existent person cannot advocate for their existence. It confuses the "Non-Identity Problem" with the "Asymmetry."
  3.  **The Registry of Births (Rule-Making & Stress-Test):** Groups draft a universal policy, apply it to cases, then swap policies to defend against edge cases.
      *   *Verdict:* **Select.** This isolates the logic. By forcing them to write a *rule* ("Refuse iff..."), you force them to commit to a principle. By swapping rules, you prevent them from tweaking the rule mid-game to save their intuitions. The friction comes when the rule works for the sad kids but feels "empty" for the happy kids.

  ***

  ### Session Plan: The Registry of Births

  **Target:** 18 Undergrads (Ethics Elective)
  **Time:** 90 Minutes
  **Goal:** Viseralize the Procreation Asymmetry (The intuition that we have a duty to avoid creating suffering, but no duty to create happiness).
  **Constraint:** Do not use the words "Asymmetry," "Benatar," "Parfit," or "Non-Identity" until the final 10 minutes.

  #### Materials Needed
  *   5 Tables (4 groups of 4, one group of 2 or merge into a group of 3).
  *   **Rule Sheets:** One per table.
  *   **Case Decks:** One deck per table (6 cards each).
  *   **Objection Packets:** One per table (prepared for Round 2).
  *   Whiteboard/Projector.

  ---

  ### 1. The Case Cards (Print on Cardstock)
  *Instruction to Students: "These cards describe the *only* thing you know: the qualitative experience of the life that will result if you approve the birth. You do not know the parents' status, the economic cost, or the environmental impact. Only the life itself."*

  **Card 1: The Agony**
  > This life contains severe, chronic physical pain from birth until death at age 4. There are no periods of relief. There is no capacity for joy, learning, or relationship. The net experience is intensely negative.

  **Card 2: The Struggle**
  > This life involves significant cognitive disability and chronic illness. There is pain, but also moments of comfort and affection from caregivers. The person feels frustration often, but also occasional contentment. On balance, the suffering outweighs the joy, but the person is not constantly miserable.

  **Card 3: The Baseline**
  > This life is ordinary. There are headaches, heartbreaks, and boredom. There are also weekends, good meals, and friendships. The person, looking back from age 80, would say, "It was worth it," but would not claim it was exceptional. Net positive, but barely.

  **Card 4: The Joy**
  > This life is vibrant. The person has high capacity for love, art, and discovery. There is sadness (loss of loved ones, failure), but it is integrated into a meaningful whole. The person is profoundly glad to have existed. Net positive, significantly.

  **Card 5: The Saint**
  > This life is extraordinary. The person alleviates immense suffering for others and experiences deep, sustained fulfillment. There is no chronic pain. The world is objectively better because this person existed. The person is ecstatic to be alive. Net positive, massively.

  **Card 6: The Null**
  > (Keep this face down until Round 3).
  > This card represents *no birth*. No pain, no joy, no existence. Compare this to Card 4 or 5.

  ---

  ### 2. The Rule Sheet
  *Hand this to each table at the start.*

  **REGISTRY DIRECTIVE 001**
  You are the Ethics Board. You must issue one standing rule to govern all future birth applications.
  Your rule must take the form:
  **"The Registry shall REFUSE a life IFF: \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_."**
  *(Example: "...IFF the life contains more pain than pleasure.")*

  Once written, this rule cannot be changed. You must apply it consistently to every Case Card.

  ---

  ### 3. The Objection Packet (For Round 2)
  *Hand this to Table A, but it contains objections to Table B's rule. Swap between tables.*

  **CITIZEN COMPLAINTS**
  *You are now defending the rule written by another table. Read these objections and prepare a defense using ONLY their rule.*

  1.  **The Void Objection:** "Regarding Card 1 (The Agony): You refused this life. Good. But *who* did you help? If you refuse the birth, that specific person never exists. They aren't sitting in a void feeling relieved. They are nothing. So how can you say you 'benefited' them by not creating them?"
  2.  **The Missed Opportunity Objection:** "Regarding Card 5 (The Saint): You approved this life (presumably). But did you *require* it? If you had refused Card 5, no one would be hurt (see Void Objection). So why is Card 5 'good' to create but Card 1 'bad' to create? Isn't that arbitrary?"
  3.  **The Baseline Trap:** "Regarding Card 3 (The Baseline): Your rule allows this life. But this person will suffer real pain (breakups, illness). If you have the power to prevent pain by not creating the person, why are you allowing *any* pain to exist just for the sake of some mediocre joy?"

  ---

  ### 4. The Timeline (90 Minutes)

  **0:00 – 0:10 | Intro & Framing**
  *   Welcome. "You are not judging parents. You are judging *existence*."
  *   Distribute Rule Sheets.
  *   **Constraint:** "You cannot consider resources, overpopulation, or parents' wishes. Only the quality of the resulting life."

  **0:10 – 0:25 | Phase 1: Drafting & First Pass**
  *   Tables draft their "Refuse IFF" rule.
  *   Tables apply the rule to Cards 1, 2, and 3.
  *   *Facilitator Note:* Walk around. If a group writes "Refuse iff the parents are unhappy," stop them. Remind them: *Only the resulting life.*

  **0:25 – 0:45 | Phase 2: The Swap (Defense)**
  *   Collect Rule Sheets. Pass Table 1's rule to Table 2, etc.
  *   Hand out the **Objection Packet**.
  *   Task: "You now work for the Registry that wrote this rule. A citizen is attacking it using the Objections. Write down your defense. You cannot change the rule. You must explain why the rule stands."
  *   *Key Moment:* They will struggle with Objection #2 (The Saint). Their rule likely says "Refuse iff Suffering." This *permits* The Saint, but doesn't *require* it. The Objection asks: "Why isn't refusing The Saint just as bad as allowing The Agony?"

  **0:45 – 1:05 | Phase 3: The Trap (Round 3)**
  *   Return Rule Sheets to original owners.
  *   Reveal **Card 6 (The Null)** and place it next to **Card 4 (The Joy)**.
  *   **Prompt:** "Apply your rule. Does your rule *require* you to create Card 4? If you choose Card 6 (No Birth) instead, does your rule punish you?"
  *   Most rules will say: "Refuse iff Suffering."
  *   **The Trap:** If they choose Card 6 (No Birth), they have followed their rule (No suffering in the void). But they feel a pang of loss. If they choose Card 4, they followed their rule. But why didn't they *have* to?
  *   Ask them to write down: "Does choosing Card 6 over Card 4 make you guilty? Yes/No. Why?"

  **1:05 – 1:20 | Phase 4: The Reveal (Debrief)**
  *   (See Debrief Script below).

  **1:20 – 1:30 | Wrap Up**
  *   Q&A.

  ---

  ### 5. The Debrief Script (Mapping Mechanics to Philosophy)

  *Do not start with definitions. Start with their feelings.*

  **Step 1: The Agony (Cards 1 & 2)**
  *   **Ask:** "Show of hands, whose rule refused Card 1?" (Everyone).
  *   **Philosophical Map:** "You all felt a **Duty to Avoid Suffering**. In philosophy, we call this a *negative duty*. You felt that bringing a suffering child into the world harms *that child*."
  *   **The Twist:** Bring up Objection #1 (The Void). "But if you refuse the birth, the child doesn't exist. Who did you save? This is the **Non-Identity Problem**. You saved them from a life worse than non-existence, but 'non-existence' isn't a state of being."

  **Step 2: The Saint (Cards 4 & 5)**
  *   **Ask:** "Whose rule *required* you to create Card 5 (The Saint)?" (Likely no hands).
  *   **Ask:** "Whose rule *allowed* you to skip Card 5 and choose Card 6 (Null)?" (Most hands).
  *   **Philosophical Map:** "Here is the itch you felt in Phase 3. You felt it was *good* to create The Saint, but not *wrong* to skip it. You have no **Positive Duty** to create happy people."
  *   **The Name:** "This tension is called the **Procreation Asymmetry**. We believe:
      1.  Presence of Pain = Bad (We must avoid it).
      2.  Absence of Pleasure = Not Bad (We don't have to create it).
      Logically, these fight. If pain is bad, pleasure should be good. If skipping pain is good, skipping pleasure should be neutral. But our intuitions say: Skipping pain is *obligatory*, skipping pleasure is *optional*."

  **Step 3: The Baseline (Card 3)**
  *   **Ask:** "Card 3 is barely worth living. Why did you allow it?"
  *   **Philosophical Map:** "Because it's net positive. But notice: You are allowing a life that *will* suffer, just because it also has joy. The Asymmetry struggles here. If we are so worried about suffering (Card 1), why do we tolerate suffering in Card 3? Because the person *consents* to it by being glad to be alive? But they couldn't consent before they existed."

  **Closing:** "You just wrestled with one of the hardest problems in population ethics. There is no consensus solution. Some philosophers say our intuitions are wrong (we *should* create happy kids). Others say existence is always a harm. You felt the tug-of-war. That's the goal."

  ---

  ### 6. Predictable Failures (And Fixes)

  1.  **The "Parents" Distraction:**
      *   *Failure:* Students will write rules like "Refuse iff the parents are too poor."
      *   *Fix:* Intercept this in Phase 1. Remind them: "This is a sci-fi registry. The resources are guaranteed. Judge the *soul*, not the wallet."
  2.  **The "Overpopulation" Shield:**
      *   *Failure:* Students argue that creating The Saint uses up resources for someone else.
      *   *Fix:* Enforce the "Ceteris Paribus" (all else equal) constraint. "Assume this is the only decision being made."
  3.  **Vague Rules:**
      *   *Failure:* Rules like "Refuse iff the life is bad."
      *   *Fix:* Force them to define "bad." Is it pain? Is it lack of joy? During the Swap, if a rule is vague, the defending team must interpret it strictly. This usually breaks the rule, which is a useful learning moment.
  4.  **Giggles at "The Saint":**
      *   *Failure:* Students treat Card 5 as unrealistic or religious.
      *   *Fix:* Frame it secularly. "Think of a life like Marie Curie or Mandela. High impact, high fulfillment, but still involves work and stress."

  ---

  ### 7. Limitations: What This Activity Cannot Do

  *Be honest with yourself (and them) about where the game falls short.*

  1.  **It Cannot Reproduce the "View from Nowhere":**
      *   The game forces a "God's eye view" (judging lives from outside). Real ethics is felt from the *inside* (as a parent or a child). The game simulates the *logic* of the asymmetry, not the *emotional weight* of parenthood. You will need to acknowledge that in the real world, love blinds us to these calculations.
  2.  **It Cannot Solve the Non-Identity Problem:**
      *   The activity exposes the problem (Who is harmed by not existing?), but it doesn't solve it. Students may leave feeling frustrated that "The Void Objection" has no answer. You must validate that frustration: "Philosophers have been stuck here for 40 years. Your confusion is a sign you understood the problem."
  3.  **It Abstracts "Suffering":**
      *   Reading "chronic pain" on a card is not the same as witnessing it. The moral urgency might feel theoretical. As a novelist, use your voice in the debrief to re-humanize the cards. "Remember Card 1 isn't text. It's a crying infant. Remember Card 5 isn't points. It's a laugh."

  ### Final Advice for the Novelist
  You have an advantage over the philosophers here. They will want to win the argument. You want to **sustain the tension**.
  *   If a group finds a "loophole" in the logic, don't let them rest in it. Ask: "Does that loophole feel *right* in your gut?"
  *   The goal isn't a correct rule. The goal is the *unease* when they realize their rule permits them to ignore The Saint (Card 5) but forbids them from ignoring The Agony (Card 1).
  *   That unease *is* the lesson.
