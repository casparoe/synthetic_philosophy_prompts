answer: |-
  # Desiderata for an Account of Constrained Translation

  **Context:** The following specifications are designed for a seminar on constrained writing (Oulipo, formalism, etc.). The operative scenario is **defense**: you must justify your rendering to a reader who *cannot* consult the source text. This reader relies entirely on your text to experience the constraint. Therefore, adequacy is not measured by correspondence to the source, but by the integrity of the target text as a constrained object in its own right.

  ## I. The Desiderata
  *Derived from the ten test cases.*

  **1. The Principle of Functional Equivalence of Difficulty**
  *   **Motivation:** A constraint is a resistance. If the resistance vanishes, the work vanishes.
  *   **Cases:** *Numerical Count (Mora/Syllable)*; *Lipogram (Letter Frequency)*.
  *   **Commitment:** The account must prioritize the *intensity* of the constraint over the *identity* of the unit. If the source avoids 'E' (12% of French), the target cannot avoid 'Z' (0.07% of English) and claim fidelity. The target must avoid a letter of comparable frequency (e.g., 'E' in English) to preserve the labor and the aesthetic tension. The account must define equivalence in terms of statistical improbability and compositional effort, not orthographic matching.

  **2. The Principle of Orthographic Independence**
  *   **Motivation:** Writing systems are not universal containers; they are specific materialities.
  *   **Cases:** *Acrostic (Script Mismatch)*; *Visual Shape*.
  *   **Commitment:** The account must distinguish between *linguistic* constraints and *graphic* constraints. If the source relies on an alphabet the target lacks (e.g., Greek acrostic into Chinese), the account must permit the abandonment of the acrostic in favor of a target-native graphic constraint (e.g., radical count), or demand the admission that the text is untranslatable *as a visual object*. It cannot pretend the script is transparent.

  **3. The Principle of Prosodic Priority**
  *   **Motivation:** In sung or spoken verse, time is a physical limit, not a stylistic choice.
  *   **Cases:** *Song (Melody)*.
  *   **Commitment:** The account must rank *temporal fit* above *lexical precision*. A rendering that matches the notes but alters the syntax is more adequate than one that preserves the syntax but breaks the melody. The constraint of the melody is a hard boundary; the constraint of the dictionary is soft.

  **4. The Principle of Intentionality Filtering**
  *   **Motivation:** Not every pattern is a constraint. Grammar is not art.
  *   **Cases:** *Grammatical Accident (Gender/Honorifics)*; *Hidden Constraint*.
  *   **Commitment:** The account must provide a criterion for distinguishing *systemic necessity* from *deliberate imposition*. If the source language forces verb-final order, reproducing that in a subject-verb-object language is not fidelity to a constraint, but distortion of the target. Conversely, if a constraint is hidden (Case 8), the account must decide if the translator's duty is to preserve the secrecy (making it invisible to the target reader) or to reveal it (making it visible). Given our scenario (reader cannot check), the account must demand **disclosure**: a hidden constraint in the source must be signaled in the target, or it does not exist for this reader.

  **5. The Principle of Paratextual Integrity**
  *   **Motivation:** Explanations are not translations.
  *   **Cases:** *Meta-linguistic Joke*.
  *   **Commitment:** The account must define the boundary of the "text." If a joke relies on source-language morphology, a footnote explains the joke but kills the constraint (which requires the joke to land *in* the text). The account must treat footnotes as evidence of failure to translate the constraint, not as successful compensation. The rendering must either make the joke work in the target language or admit the constraint is broken.

  **6. The Principle of Perceptible Autonomy**
  *   **Motivation:** The reader cannot check the source.
  *   **Cases:** *All cases*, but specifically *Hidden Constraint* and *Untranslatable Provocation*.
  *   **Commitment:** The constraint must be perceptible within the four corners of the target text. If the reader needs to know the source to see the constraint, the translation has failed its specific audience. The translation must stand as a constrained work *sui generis*.

  ---

  ## II. Incompatible Pairs (The Tragic Trade-offs)

  No account can satisfy all desiderata simultaneously. The following pairs are mutually exclusive in practice:

  **1. Functional Equivalence of Difficulty (Req 1) vs. Orthographic Independence (Req 2)**
  *   **Conflict:** In the *Lipogram* case, preserving the difficulty requires changing the forbidden letter (e.g., 'E' to 'E'). In the *Acrostic/Visual* case, preserving the visual identity requires keeping the specific letters or shapes. You cannot change the letter to match the difficulty *and* keep the letter to match the visual pattern.
  *   **Why:** One requirement prioritizes the *statistical experience* of the constraint; the other prioritizes the *material signifier*. You must choose whether the constraint is a mathematical problem or a visual artifact.

  **2. Perceptible Autonomy (Req 6) vs. Intentionality Filtering (Req 4 - Hidden Constraints)**
  *   **Conflict:** If the source constraint was deliberately hidden (Case 8), making it perceptible in the target (to satisfy the reader who cannot check) violates the author's intention of secrecy. If you preserve the secrecy, the target reader (who cannot check) will never know the constraint exists, violating Autonomy.
  *   **Why:** You cannot simultaneously reveal a secret to an audience that has no other way of knowing it and claim to be preserving the secret.

  **3. Paratextual Integrity (Req 5) vs. Functional Equivalence of Difficulty (Req 1)**
  *   **Conflict:** In the *Meta-linguistic Joke* case, preserving the "difficulty" (the joke) often requires a note to explain the source-language pun. But Req 5 states notes are evidence of failure. To satisfy Req 1 (make the joke work), you often violate Req 5 (by adding apparatus). To satisfy Req 5 (no notes), you often violate Req 1 (the joke dies).
  *   **Why:** One requirement demands the text be self-contained; the other demands the effect be equivalent. Some effects are not portable without baggage.

  ---

  ## III. The Ruling Requirement

  The single requirement that does the most to rule out the familiar positions ("Form is Sense," "Sense is King," "Reproduce the Effect") is:

  **The Principle of Perceptible Autonomy (Req 6).**

  *   **Against "Form is Sense" (Formalism):** This position argues the form must be reproduced exactly. But Perceptible Autonomy forces us to change the form (e.g., the lipogram letter) if the original form is invisible or impossible in the target. If the reader can't see the form, it isn't sense *for them*.
  *   **Against "Sense is King" (Instrumentalism):** This position sacrifices form for meaning. But Perceptible Autonomy demands the constraint be visible. If you sacrifice the constraint to save the meaning, the reader sees no constraint, and the text fails as a *constrained* translation.
  *   **Against "Reproduce the Effect" (Reception Theory):** This position aims to make the target reader feel what the source reader felt. But the source reader could check the source; our reader cannot. The effects *cannot* be the same. Perceptible Autonomy demands we create a *new* effect (visibility in the target) rather than chasing a ghost (the original reception).

  This requirement forces the seminar to accept that **a constrained translation is a new constrained original**, not a copy of an old one.

  ---

  ## IV. Sorting Constraints: Identity vs. Option

  **Verdict:** No principled sorting of constraints into "Identity" vs. "Optional" is available in general.

  **Argument:** The list of cases demonstrates that the "identity" of a constrained text is not intrinsic to the constraint type, but relational to the *contract* of the specific work.
  *   In a *Lipogram* (Case 2), the forbidden letter is the identity.
  *   In a *Visual Poem* (Case 5), the shape is the identity.
  *   In a *Song* (Case 6), the melody is the identity.
  *   In a *Grammatical Accident* (Case 7), the grammar is explicitly *not* the identity.

  There is no ontological hierarchy (e.g., "semantic constraints are core, orthographic ones are peripheral") that holds across these cases. To sort them generally would be to impose a theory of textuality that the cases themselves refute. The result is that **constraint identity is local**. The translator must negotiate the identity of *this* text, not apply a universal rule. The list proves that any universal sorting mechanism will fail on at least one of the ten cases.

  ---

  ## V. Verdict on the Zero-Sum Fidelity Conjecture

  **Conjecture:** *Fidelity is zero-sum: any gain in formal fidelity must be paid for in semantic fidelity.*

  **Verdict:** The conjecture is **false**. It is an artifact of a bad requirement.

  **The Artifact:** **The Requirement of Constraint Invariance.**
  The zero-sum view arises only if one assumes that "Formal Fidelity" means **reproducing the exact same constraint mechanism** (e.g., avoiding the *same* letter, counting the *same* units). If you demand the constraint unit be invariant, then yes, you must distort semantics to fit the Procrustean bed of the source constraint.

  **Correction:** If we replace Constraint Invariance with **Functional Equivalence of Difficulty (Req 1)**, the zero-sum game dissolves.
  *   By changing the forbidden letter to one of equivalent frequency (Case 2), you preserve the *formal challenge* without necessarily sacrificing more semantics than the original author did.
  *   By adapting the rhyme scheme to target-native rhymes (Case 3), you preserve the *aesthetic function* without forcing semantic nonsense.

  The zero-sum conjecture assumes the translator is fighting the source text. In constrained translation, the translator is fighting the *target language* on behalf of the source text's *ambition*. When the constraint is homologous rather than identical, semantic and formal fidelity can rise and fall together. The cost is not semantic fidelity; the cost is **replicability**. You cannot replicate the source; you can only re-enact its struggle.
