      *   The historian says: "Reasons are at best slogans." This implies moral judgments lack objective force or truth-tracking ability (Error Theory or Expressivism).
      *   Appiah says: Moral judgments are real, but their *efficacy* depends on social psychology (honor).
      *   The Slide: Moving from "Arguments didn't cause the change" (causal claim) to "Arguments are just slogans" (justificatory claim).
      *   Why it matters: If reasons are just slogans, morality is power. If reasons prepare the ground for honor shifts, morality is reason + social practice.

