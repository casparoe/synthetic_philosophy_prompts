      *   *Claim 4:* "The Williams thesis is the same point... arguments we now find so compelling... look compelling to us only because we already have the sentiments." (Retroactive justification).
      *   *Claim 5:* "Moral revolutions are driven by interest and shame, and reasons are at best the slogans later generations attach..." (Cynical/Materialist view of moral reasoning).

  3.  **Evaluate Against Kwame Anthony Appiah (*The Honor Code: How Moral Revolutions Happen*):**
      *   *Appiah's Core Thesis:* Moral revolutions involve a shift in *honor*. It's not just about arguments (reason) or just about money (interest). It's about identity and social standing.
      *   *Agreement:* Appiah agrees that abstract moral argument *alone* is usually insufficient. He agrees that shame/honor is crucial. He agrees that dueling ended when it became "ungentlemanly."
      *   *Disagreement/Nuance:* Appiah does *not* say reasons are merely "slogans." He argues that moral arguments *prepare the ground* for the shift in honor. Arguments make the practice vulnerable to being re-coded as dishonorable. He rejects the cynical view that reasons are *just* post-hoc. He sees a dialogue between reason and honor.
      *   *The "Slide":* The historian's summary leans towards moral skepticism (reasons don't matter, only causes do). Appiah is a moral realist (reasons matter, but they work through social psychology).

  4.  **Evaluate Against Eric Williams (*Capitalism and Slavery*):**
      *   *Williams' Core Thesis:* The abolition of the slave trade/slavery was driven by economic changes (rise of industrial capitalism made slavery less profitable/compatible) rather than purely humanitarian sentiment.
      *   *Agreement:* Economic interest played a massive role. The "profits decreased" argument is central to Williams.
      *   *Disagreement/Nuance:* Williams is often misread as saying "humanitarianism was a sham." He argued that humanitarianism was the *ideology* that accompanied the economic shift, but he didn't necessarily say every abolitionist was lying. However, the historian's summary aligns fairly well with the "Williams Thesis" regarding economics.
      *   *Correction:* Modern historians have critiqued Williams (e.g., slavery was still profitable when abolished). So repeating Williams as undisputed fact is risky historically, even if philosophically interesting.

