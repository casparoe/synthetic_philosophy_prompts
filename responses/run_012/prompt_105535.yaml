answer: |-
  This is a sophisticated question that touches on moral psychology, historiography, and metaethics. Your historian friend has offered a pungent summary that captures a "realist" or "materialist" intuition about social change. However, if you repeat this summary as a faithful representation of Kwame Anthony Appiah or Eric Williams, you will encounter significant pushback from scholars familiar with their work.

  The summary conflates **causal efficacy** (what actually changed behavior) with **justificatory status** (whether the reasons were true or valid). It also leans harder into cynicism than Appiah does.

  Here is a breakdown of what you can safely repeat, what requires correction, and how to navigate the metaethical slide.

  ---

  ### 1. Kwame Anthony Appiah (*The Honor Code*)

  Appiah's book *The Honor Code: How Moral Revolutions Happen* is the primary source for the claims about dueling and the mechanism of shame.

  **What Appiah Would Accept:**
  *   **Argument alone is insufficient:** Appiah agrees that abstract moral reasoning rarely stops a practice on its own. You cannot logic someone out of a position they didn't logic themselves into, especially when that position is tied to their identity.
  *   **The mechanism is Honor/Shame:** He agrees that the end of dueling was driven by a shift in what counted as "honorable." When dueling went from being a mark of a gentleman to a mark of a ruffian, it died.
  *   **Social Psychology matters:** Moral change requires a shift in the social script, not just individual conscience.

  **What Appiah Would Object To:**
  *   **"Reasons are at best the slogans":** This is the biggest divergence. Appiah does not view moral arguments as mere post-hoc rationalizations. He argues that moral arguments **prepare the ground** for the shift in honor.
      *   *The Objection:* Appiah would say that abolitionists and anti-dueling activists spent decades making arguments that slowly made the practices *vulnerable* to being re-coded as dishonorable. The arguments didn't immediately change behavior, but they changed the *meaning* of the behavior. Without the arguments, the shame would have had no content.
  *   **The Cynical Conclusion:** The summary suggests that because interest and shame did the *work*, the moral reasons were irrelevant or false. Appiah is a moral realist; he believes the reasons (e.g., "slavery is wrong") were true and important, even if their *enforcement* relied on social psychology.
  *   **Dueling and Expense:** Appiah focuses almost exclusively on the *honor* aspect of dueling. While cost may have been a factor, Appiah's specific thesis is that gentlemen stopped dueling because it became socially embarrassing, not primarily because it became too expensive.

  **The Verdict on Appiah:**
  You can say Appiah argues that **moral arguments need the lever of honor to move the world.** You cannot say he argues that **moral arguments are merely slogans.**

  ### 2. Eric Williams (*Capitalism and Slavery*)

  The reference to the "Williams thesis" concerns the economic history of abolition.

  **What Williams Would Accept:**
  *   **Economic Interest is Primary:** Williams argued that the British abolition of the slave trade was driven by the rise of industrial capitalism, which made West Indian slavery less profitable and less compatible with the new economic order.
  *   **Humanitarianism as Ideology:** Williams suggested that the moral arguments of the abolitionists were the *ideological expression* of these underlying economic shifts. The moral sentiment followed the economic interest.

  **What Defenders/Critics Would Object To:**
  *   **Historical Accuracy:** Since Williams published (1944), economic historians (like David Eltis and Stanley Engerman) have challenged his data. Many argue that slavery was still highly profitable when it was abolished. If you repeat "slavery stopped paying" as fact, you are repeating a contested historical claim, not an established truth.
  *   **The "Sham" Accusation:** Williams is often read as saying abolitionists were hypocrites. A nuanced reading suggests Williams was arguing about *structural causality*, not individual sincerity. However, your historian's summary implies the moralists were effectively ineffective until money moved.
  *   **Conflation with Appiah:** Williams is an economic determinist; Appiah is a social psychologist. Merging them implies that "interest" (money) and "shame" (honor) are the same kind of driver. They are distinct mechanisms. Williams says "it cost too much"; Appiah says "it cost too much status."

  **The Verdict on Williams:**
  You can say Williams argues that **economic shifts created the conditions for abolition.** You should add the caveat that **his economic data is contested by modern historians.**

  ---

  ### 3. The Metaethical Slide: Causes vs. Reasons

  You correctly identified a slide in the summary. This is the most dangerous part to repeat without qualification.

  **The Slide:**
  The summary moves from:
  1.  **Causal Claim:** Moral arguments did not *cause* the behavioral change (Interest and Shame did).
  2.  **To Metaethical Claim:** Moral arguments are *only* slogans (they have no truth-tracking or justificatory power).

  **Why this matters:**
  If you accept the summary as written, you are endorsing a form of **Moral Skepticism** or **Error Theory**. You are implying that because we can explain *why* people stopped slavery (economics/honor), we don't need to believe the reason "slavery is wrong" was the *real* reason.

  **Appiah's Correction:**
  Appiah avoids this slide. He distinguishes between the **logic of justification** and the **psychology of motivation**.
  *   *Justification:* Slavery was wrong (Moral Truth).
  *   *Motivation:* People stopped because they wanted to be honored, not shamed (Social Psychology).
  *   Appiah argues that the *arguments* provided the content for the *honor*. The arguments told society *what* to be ashamed of. Therefore, the arguments were not slogans; they were the blueprint for the new honor code.

  **What Survives the Correction:**
  If you correct the slide, the "bracing" lesson remains but becomes more nuanced:
  *   **Survives:** Moral progress is not guaranteed by better arguments alone. It requires changes in social status (honor) and material conditions (interest).
  *   **Survives:** We should be skeptical of our own moral superiority; we likely hold our current views because they are currently "honorable" and "economically viable," not just because we are smarter than our ancestors.
  *   **Lost:** The idea that moral reasoning is impotent or fake. Reasoning is the tool that rewrites the honor code, even if honor is the engine that enforces it.

  ---

  ### 4. How to Repeat This Safely

  If you wish to use this insight in conversation or writing, here is a formulation that respects the authors and avoids the metaethical trap:

  > "My historian friend summarized Appiah and Williams by noting that moral arguments alone rarely end practices like dueling or slavery. Instead, those practices end when they become economically unsustainable and socially dishonorable.
  >
  > However, Appiah would refine this: he argues that moral arguments are what *make* a practice vulnerable to shame. The arguments don't move people directly; they rewrite the social script so that continuing the practice becomes a loss of status. So, while interest and shame are the engines of change, moral reasoning provides the map.
  >
  > The lesson isn't that moral reasons are fake slogans, but that they are socially inert unless they attach to our desire for honor and our material interests. We shouldn't assume we are more moral than our ancestors; we are likely just living in a time where our morality aligns with our honor and our economy."

  ### Summary of Objections and Corrections

  | Claim in Summary | Appiah's Objection | Williams/Historical Objection | Corrected Takeaway |
  | :--- | :--- | :--- | :--- |
  | "Nobody was ever argued out of slavery." | Arguments are necessary to define *what* is shameful, even if they don't directly cause the stop. | Abolitionists were genuinely motivated by faith and reason, not just economics. | Arguments are necessary but insufficient without social leverage. |
  | "Dueling became expensive." | Dueling ended because it became *ungentlemanly*, not primarily because of cost. | N/A | Honor/Shame is the primary mechanism for dueling. |
  | "Slavery stopped paying." | N/A | Modern data suggests slavery was still profitable; economic compatibility changed, not just profit. | Economic *structures* shifted, making slavery less viable for the metropole. |
  | "Reasons are at best slogans." | **Major Objection:** This denies the truth-tracking role of reason. Reasons guide the shift in honor. | Williams focused on causality, not necessarily the falsity of moral claims. | Reasons are the *content* of the revolution; Honor/Interest is the *force*. |
  | "Moral revolutions are driven by interest and shame." | Accepts "Shame/Honor," but sees it as working *with* reason, not replacing it. | Accepts "Interest," but as a structural condition. | Moral change requires a coalition of Reason, Honor, and Interest. |

  ### Final Recommendation

  You can safely repeat the **sociological insight**: *Moral progress requires changes in social status and economic incentives, not just better arguments.*

  You should **not** repeat the **metaethical conclusion**: *Therefore, moral reasons are just post-hoc rationalizations.*

  Appiah's actual view is more hopeful: Moral reasons are the tools we use to reshape what counts as honorable. If you stop making the arguments, the honor code shifts back. So the arguments matter immensely, even if they don't work by logical coercion alone.
