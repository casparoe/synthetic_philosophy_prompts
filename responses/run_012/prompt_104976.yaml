prompt: |-
  I've been reading a popular introduction to philosophy of mind — written by a science journalist, not a specialist — and its chapter on mental causation contains this passage, which I'd like to use in a talk if I can trust it:

  "Kim's causal exclusion argument shows that mental states cannot cause anything once the physical facts are fixed. Since every physical event already has a fully sufficient physical cause, and mental properties are nothing over and above physical properties, any mental cause would be redundant — the physical cause does all the work by itself. Physicalism, if true, therefore entails epiphenomenalism: our beliefs and desires are causally inert. Kim himself accepts this result, which is why he concludes that the only escape is to become a type-identity theorist, and it is why so many philosophers have since abandoned physicalism for dualism or panpsychism."

  Please audit it for me, claim by claim. Separate what someone working on this would accept, what is a defensible simplification that keeps the spirit right, and what is subtly or plainly mistaken — including any place where two claims the argument keeps apart have been run together, or a contested premise has been presented as a settled result. I am especially interested in three things: whether the argument as Kim actually gave it establishes the conclusion the passage draws or only a conditional with several ways out; whether Kim's own response to the problem is what the passage says it is; and whether the closing sociological claim is true. Then tell me whether the passage's overall verdict — that physicalism is refuted and the field has turned away from it — survives once the inaccurate parts are corrected, or whether that verdict rests entirely on the parts that don't hold up. I'm not a specialist, so spell out the distinctions rather than assuming them.
