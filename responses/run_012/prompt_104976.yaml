  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did Kim accept epiphenomenalism? In *Mind in a Physical World*, he argues non-reductive physicalism leads there. In *Physicalism, or Something Near Enough*, he says we must reduce to avoid it. So the passage says "Kim himself accepts this result [that physicalism entails epiphenomenalism]..." This is slightly ambiguous. Kim accepts that *non-reductive* physicalism entails it. He does not accept that *mental causation* is impossible. I need to clarify this.
