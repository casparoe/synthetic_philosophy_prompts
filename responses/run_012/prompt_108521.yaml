  1. **Essentialist:** In this gametic reconstitution case, the new embryo lacks Alice's essential origin, so it cannot be Alice regardless of genetic identity. The particular gametes that actually united at her conception are part of her essence. **Pattern Theorist:** But if the biological information and epigenetic state are identical, you are privileging inert matter over the functional organization that constitutes a life. Why should the specific particles matter if the resulting organism is indistinguishable?

  2. **Essentialist:** The specific gametes provide the unique historical anchor that distinguishes a person from a perfect duplicate across possible worlds. Without this anchor, identity becomes ungrounded and arbitrary. **Pattern Theorist:** Yet if matter is constantly replaced in our bodies, insisting on initial gametes as uniquely essential seems arbitrary without further justification. You must explain why the starting matter locks identity while subsequent matter does not.

  3. **Essentialist:** That view collapses the distinction between being someone and merely being exactly like someone, which violates our deepest modal intuitions. A copy is never the original, even if atomically identical. **Pattern Theorist:** Identity should track the persistent pattern of organization, allowing that Alice could have arisen from different matter had the pattern been preserved. We can distinguish copy from original via causal history rather than material essence.

  4. **Essentialist:** Without origin essentialism, you cannot explain why this reconstituted individual is a twin rather than a continuation of Alice. Your causal history criterion fails if the pattern is perfectly recreated from somatic cells. **Pattern Theorist:** I distinguish them by causal history, not material bits, so the reconstituted person is a copy because the causal chain was broken. If we bridged that chain, your essentialism would still deny identity despite perfect continuity.

  5. **Essentialist:** Continuity of pattern is insufficient without the right kind of beginning to ground the specific individual essence. Identity requires the correct origin, not just the correct structure. **Pattern Theorist:** Then your theory implies that metaphysical necessity trumps all biological and psychological continuity, rendering identity opaque to scientific inquiry. We must decide whether essence lies in the past or the present organization.
