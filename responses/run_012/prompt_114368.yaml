prompt: |-
  I run the assessment desk at a small open-source research firm — four analysts, none of them trained in philosophy — and we publish short "what we know" notes for clients who act on them. Each claim in a note carries one of three labels: known, assessed, possible. Our recurring failure is the chain. A document says something, that something implies a further claim, and by the end of the paragraph we are writing the further claim as known. Our house rule is that each step is solid, so the conclusion is solid. I have come to think this rule smuggles in a principle that a well-known theory of knowledge denies, and I want a procedure that stops us doing it.

  Please write a decision procedure — an ordered checklist an analyst can run on a single claim before it is allowed to carry the label known. Ground it in the tracking account of knowledge (the one associated with Nozick): a claim counts as known only if it is true, believed, and (i) we would not have believed it had it been false, and (ii) we would have believed it had it been true. Build in the following, and write it so that someone who has never heard of the theory can run it:

  - For each question, what counts as a sufficient answer, and what to do when we cannot answer — which, in our line of work, is most of the time.
  - An explicit rule for chaining, which must not assume that knowledge is closed under known entailment. Say which of the two conditions, if either, a conclusion can inherit from a premise, which it cannot, and why.
  - A rule for fixing the description of the method by which a belief was formed. We have noticed that whether a claim passes (i) depends on whether we describe the method as reading this document or as trusting this source; the procedure must either tell us how to fix that description or tell us plainly that fixing it is a judgment call.
  - A non-vacuity check. Some of our claims would have been believed no matter what, so (i) is satisfied trivially; the procedure must catch these rather than pass them.
  - A fallback for the case where (i) cannot be answered but the claim matters, if there is an honest one; if the only honest fallback is a weaker label, say so.
  - The point at which the procedure stops with a no, and the point at which it stops and hands the claim to me, because the question that remains is one an analyst cannot settle.

  Then run the procedure on three cases and give the label each ends with: (a) an unnamed source we have used before says a minister attended a meeting; attendance implies a decision was taken; we write that the decision was taken. (b) A source with an excellent twenty-item track record has sent a report, and we are inclined to call the report accurate on the strength of the record. (c) A source who, we have recently realized, would have told us the reassuring thing whether or not it was true; the procedure will end somewhere I will not like, so do not soften it.

  Close by saying what the procedure cannot do: the kinds of claim on which it will misfire, and which of its steps are judgment dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Head of assessment desk at a small open-source research firm (4 analysts, no philosophy training).
      *   **Output:** Short "what we know" notes for clients.
      *   **Labels:** Known, Assessed, Possible.
      *   **Problem:** The "Chain" problem (transitivity of justification). Analysts assume if $A \to B$ and $A$ is Known, then $B$ is Known. The user suspects this violates a specific epistemological theory (Nozick's Tracking Theory).
      *   **Task:** Create a decision procedure (checklist) for labeling a claim "Known" based on Nozick's Tracking Theory.
      *   **Specific Requirements:**
          *   Grounded in Tracking Theory (Truth, Belief, Sensitivity (i), Adherence (ii)).
          *   Accessible to non-philosophers.
          *   Define sufficient answers and what to do if unanswered.
          *   Explicit rule for chaining (no closure under known entailment).
          *   Rule for fixing method description (to avoid ambiguity in sensitivity checks).
          *   Non-vacuity check (avoid trivial satisfaction of sensitivity).
          *   Fallback for when (i) cannot be answered but the claim matters.
          *   Stop points (Analyst "No" vs. Escalate to Head).
          *   Test on three specific cases (a, b, c).
          *   Closing limitation statement (where it misfires, where it's judgment disguised as procedure).

  2.  **Deconstruct Nozick's Tracking Theory:**
      *   $S$ knows $p$ iff:
          1.  $p$ is true.
          2.  $S$ believes $p$.
          3.  If $p$ were false, $S$ would not believe $p$ (Sensitivity).
          4.  If $p$ were true, $S$ would believe $p$ (Adherence).
      *   *Key Issue for the User:* Knowledge is *not* closed under known entailment in Tracking Theory. You can know $A$, know $A \to B$, but not know $B$ because the belief in $B$ might not track the truth of $B$ (e.g., in a nearby possible world where $B$ is false, you might still believe $B$ via the deduction from $A$, even if $A$ is false in that world, or the method doesn't track $B$ specifically).
      *   *Method Individuation:* Nozick emphasizes that tracking is relative to the *method* of belief formation. "Reading a document" vs. "Trusting a source" yields different counterfactual results.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Make it actionable. Avoid jargon like "possible worlds." Use "scenarios" or "what if."
      *   *Step 1: Truth & Belief.* Easy. Is it factually the case? Do we believe it?
      *   *Step 2: Method Fixation.* This is crucial per the prompt. I need a rule that forces specificity. Let's call it the "Method Lock."
      *   *Step 3: Sensitivity (Condition i).* "If this were false, would we still believe it?" This is the hard one.
      *   *Step 4: Adherence (Condition ii).* "If this were true (in a slightly different scenario), would we believe it?"
      *   *Step 5: Chaining Rule.* Explicitly forbid automatic inheritance.
      *   *Step 6: Non-Vacuity.* Ensure the "If false" scenario isn't impossible or irrelevant.
      *   *Step 7: Fallback/Escalation.*

      *   *Refining the Chaining Rule:* In Nozick's view, if I infer $B$ from $A$, my method for $B$ is "deduction from $A$." If $A$ is sensitive, is $B$ sensitive? Not necessarily. If $B$ were false, $A$ would be false (since $A \to B$). If $A$ were false, would I believe $A$? No (by sensitivity of $A$). So I wouldn't believe $B$. *Wait, this suggests closure holds for deduction.*
      *   *Correction:* Nozick explicitly denies closure. Why? Because the method for $B$ might be different, or the counterfactual landscape shifts. Actually, the standard Nozickian example is Skepticism. I know I have hands. I know hands imply I'm not a brain in a vat. Do I know I'm not a brain in a vat? No. Because if I *were* a brain in a vat, I would still believe I wasn't. So sensitivity fails for the entailed proposition.
      *   *Application to the Firm:* If Source says $A$. $A$ implies $B$. We believe $B$ because of $A$.
      *   *Sensitivity for B:* If $B$ were false, would we believe $B$? If $B$ is false, $A$ might still be true (if $A$ doesn't strictly entail $B$, but implies it probabilistically) OR if $A$ entails $B$, then $B$ false means $A$ false. If $A$ is false, would we believe $A$? If our source is sensitive, no. So we wouldn't believe $B$.
      *   *The Catch:* The prompt says "Our recurring failure is the chain... by the end of the paragraph we are writing the further claim as known." The user wants to stop this. Even if logic suggests closure *might* hold in some strict deductive cases, in open-source intel, implications are rarely strict logical entailments. They are probabilistic or causal. "Minister attended" implies "Decision taken." That is not a logical truth. It's a heuristic. So, the belief in "Decision taken" is formed by the method "Inference from Attendance."
      *   *Sensitivity Check on Inference:* If no decision was taken, would the minister have attended? Maybe yes (to discuss, not decide). If yes, we would still believe "Decision taken" (because we saw attendance). So Sensitivity fails.
      *   *Procedure Instruction:* You cannot inherit "Known." You must test the *conclusion* directly with its *own* method.

      *   *Refining Method Fixation:* Analysts struggle with "Reading doc" vs "Trusting source." The procedure needs to force the *most specific reliable causal link*. Let's mandate: "Describe the immediate causal trigger."
      *   *Refining Non-Vacuity:* If the claim is "The sun will rise," we would believe it even if false (because it's never false in our experience). This makes sensitivity trivial/vacuous. Need to check if the "False" scenario is live.
      *   *Refining Fallback:* If we can't determine Sensitivity, we can't say "Known." Must downgrade to "Assessed."

  4.  **Developing the Checklist Steps:**

      1.  **Truth Check:** (Can we verify?)
      2.  **Belief Check:** (Do we actually believe it?)
      3.  **Method Lock:** (How did we get here? Be specific.)
      4.  **The "False" Test (Sensitivity):** (If false, would we know?)
      5.  **The "True" Test (Adherence):** (If true, would we find out?)
      6.  **Vacuity Check:** (Is the "False" test meaningless?)
      7.  **Chain Breaker:** (Does this rely on a previous claim?)
      8.  **Decision:** (Known / Assessed / Escalate).

  5.  **Addressing Specific Constraints:**
      *   *Sufficient Answer:* Must be a concrete "Yes/No" based on evidence, not a hunch. If "Unknowable," default to "Assessed."
      *   *Chaining:* Explicitly state: "A conclusion cannot inherit the 'Known' label from a premise. The conclusion must pass the False Test on its own merits."
      *   *Method:* "Fix the method at the point of data intake, not inference."
      *   *Stop Points:* Analyst says "No" -> Label "Assessed." Analyst says "I can't tell" -> Escalate to Head (User).

  6.  **Running the Cases:**

      *   *(a) Minister attended -> Decision taken.*
          *   Method: Inference from attendance.
          *   Sensitivity: If no decision taken, would minister have attended? Likely yes (meetings happen without decisions).
          *   Result: Fails Sensitivity. Label: Assessed (or Possible, but prompt implies "Assessed" is the middle ground). Let's stick to the firm's labels: Known, Assessed, Possible.
      *   *(b) Source with 20-item track record.*
          *   Method: Trusting source based on history.
          *   Sensitivity: If this specific claim were false, would source have sent it? If source is reliable, maybe not. But track record is past performance. Does it track *current* truth?
          *   Adherence: If true, would they send it? Yes.
          *   Nuance: Track record establishes reliability, but does it establish *tracking*? If the source is honest but misinformed, they send false reports.
          *   However, usually, high reliability passes Sensitivity *enough* for intel work *unless* there's reason to doubt. But strict Nozick requires: If *this* proposition were false, would we believe it? If the source is mistaken this once, they still send it. So we believe it. Sensitivity fails if the source makes mistakes.
          *   Wait, the prompt says "inclined to call the report accurate on the strength of the record."
          *   Strict Tracking: If the report is false, does the source know? If the source is a human, they might be wrong. If they are wrong, they send the report. We believe the report. So if Report=False, We Believe Report. Sensitivity Fails.
          *   Label: Assessed. (This will be unpopular but philosophically correct).
      *   *(c) Source tells reassuring thing whether true or not.*
          *   Method: Listening to this source.
          *   Sensitivity: If claim were false, would they tell us? Yes (they tell us regardless).
          *   Result: Fails Sensitivity hard.
          *   Label: Possible (or Assessed, but definitely not Known). The prompt says "procedure will end somewhere I will not like." "Possible" is the honest label.

  7.  **Refining the Tone:**
      *   Professional, directive, clear.
      *   No philosophy jargon (explain "tracking" as "responsiveness to truth").
      *   Acknowledge the friction (this will slow you down).

  8.  **Final Review against Constraints:**
      *   *Decision Procedure?* Yes.
      *   *Grounded in Tracking?* Yes (Sensitivity/Adherence).
      *   *Sufficient Answer/Unanswered?* Included.
      *   *Chaining Rule?* Included (No inheritance).
      *   *Method Fixation?* Included (Method Lock).
      *   *Non-Vacuity?* Included.
      *   *Fallback?* Included (Downgrade to Assessed).
      *   *Stop Points?* Included.
      *   *Three Cases?* Run.
      *   *Limitations?* Included.

      *Self-Correction on Case B:* A source with a track record. If the source is a sensor or a very tight human network, Sensitivity might pass. If it's just "they've been right before," that's induction, not tracking. Nozick distinguishes between methods. If the method is "Believe what Source X says," and Source X says $P$. If $P$ is false, does Source X say $P$? If Source X is fallible, yes. So Sensitivity fails. I need to make sure the procedure reflects this rigor. The prompt implies the user *wants* to stop the over-confidence. So failing Case B is actually a feature, not a bug, of the procedure.

      *Self-Correction on Case A:* "Attendance implies decision." This is an entailment claim. The procedure must stop the analyst from saying "We know attendance, attendance implies decision, therefore we know decision." The procedure must force them to test "Decision" directly. How do we test "Decision"? Method: Inference from attendance. Sensitivity: If no decision, would we believe decision? Yes, because we'd still see attendance. Fails.

      *Self-Correction on Method Fixation:* The prompt asks: "whether we describe the method as reading this document or as trusting this source." I need to mandate the *causal* method. "Trusting the source" is the belief-forming mechanism. "Reading the document" is just the medium. I will instruct them to identify the *reliability mechanism*.

      *Final Polish on Limitations:* Acknowledge that counterfactuals are hard for analysts. Acknowledge that "Known" will become very rare.

  9.  **Drafting the Content:** (Mental outline of the response)
      *   Intro: Acknowledge the problem (The Chain).
      *   The Procedure (The "Tracking Checklist").
      *   Step-by-step instructions with "Pass/Fail/Escalate" logic.
      *   The Three Cases.
      *   The Limitations/Coda.

      *(Self-Correction during drafting)*: Make sure to explicitly answer "what to do when we cannot answer." The prompt says "which, in our line of work, is most of the time." The procedure must handle uncertainty. If you can't verify Sensitivity, you can't claim Knowledge. Default to "Assessed."

      *(Chaining Rule Detail)*: Why can't it inherit? Because the method changes. Premise Method: Source Report. Conclusion Method: Deduction/Inference. The counterfactuals for the Conclusion depend on the Inference reliability, not just the Source reliability.

      *(Method Fixation)*: I will institute a "Method Statement" requirement. Must be one sentence. If ambiguous, escalate.

      *(Non-Vacuity)*: Check if the "False" world is impossible. If so, Sensitivity is vacuous.

      *(Fallback)*: If Sensitivity is unclear, label "Assessed."

      *(Stop Points)*: Any "No" = "Assessed." Any "Unsure" on Sensitivity = Escalate to Head (User) *if* high stakes, else "Assessed." The prompt asks for a point where it hands to the user. I'll make that the "Unsure on Sensitivity for High Value Claim" point.

      Let's write it.
answer: |-
  # The Tracking Checklist for "Known" Claims

  **Purpose:** To prevent the "Chain Error" (assuming a conclusion is *Known* just because its premise is *Known*). This procedure ensures a claim is labeled **Known** only if our belief in it *tracks the truth*—meaning our belief would change if the fact changed.

  **Scope:** Run this checklist on *every* claim you intend to label **Known**. If a claim fails any step, it must be labeled **Assessed** or **Possible**.

  ---

  ### Step 1: The Method Lock
  Before testing the claim, you must fix *how* we came to believe it. Ambiguity here breaks the test.
  *   **Instruction:** Write a one-sentence "Method Statement." It must describe the causal mechanism, not the medium.
      *   *Bad:* "Reading the PDF from Source X."
      *   *Good:* "Trusting Source X's reporting on ministerial movements."
      *   *Bad:* "Logical deduction from paragraph 2."
      *   *Good:* "Inferring policy decisions from confirmed meeting attendance."
  *   **Sufficient Answer:** A specific description of the human or technical process that generated the belief.
  *   **If You Cannot Answer:** If you cannot isolate whether you believe it because of the source, the document, or your own inference, **STOP**. Hand the claim to the Desk Head.
  *   **Why:** Sensitivity depends on the method. If we describe the method too broadly, we might pass the test artificially.

  ### Step 2: The Truth & Belief Check
  *   **Instruction:** Confirm the claim is actually true (to the best of current verification) and that the firm actually believes it.
  *   **Sufficient Answer:** Independent verification exists (for Truth); the claim is in our draft note (for Belief).
  *   **If You Cannot Answer:** If truth is unverified, label **Possible**. If we don't actually believe it, do not publish.

  ### Step 3: The "False" Test (Sensitivity)
  *   **Instruction:** Imagine the claim is **false**. Keep the Method Statement (from Step 1) fixed. In that scenario, would we still believe the claim?
  *   **Sufficient Answer:** "No, we would not believe it." (This is the only passing answer).
  *   **If You Cannot Answer:** If you cannot determine what we would believe in the false scenario, proceed to **Step 7 (Fallback)**.
  *   **Why:** If we would believe the claim even if it were false, our belief is not tracking reality; it is tracking our own bias or a flawed source.

  ### Step 4: The Non-Vacuity Check
  *   **Instruction:** Ensure the "False" scenario in Step 3 was a live possibility, not an impossibility.
  *   **Sufficient Answer:** "The claim could conceivably be false given the current situation."
  *   **If You Cannot Answer:** If the claim is a tautology or physically impossible to be false (e.g., "The meeting happened in the past"), the test is vacuous. **STOP**. Label **Assessed**.
  *   **Why:** If a claim *cannot* be false, passing Step 3 proves nothing about our reliability.

  ### Step 5: The "True" Test (Adherence)
  *   **Instruction:** Imagine the claim is **true** (in a slightly different scenario where we might have missed it). Would our method still lead us to believe it?
  *   **Sufficient Answer:** "Yes, we would still believe it."
  *   **If You Cannot Answer:** Proceed to **Step 7 (Fallback)**.
  *   **Why:** If we only believe the truth by accident, we don't know it.

  ### Step 6: The Chain Breaker (Crucial)
  *   **Instruction:** If this claim was derived from a previous claim (e.g., "Meeting happened" $\to$ "Decision made"), you **cannot** inherit the "Known" label from the premise.
  *   **Rule:** A conclusion cannot inherit the **Known** status from a premise, even if the logic is valid. You must run Steps 1–5 on the *conclusion* using the *inference* as the Method.
  *   **Why:** Knowledge is not closed under entailment. We can track the truth of the meeting without tracking the truth of the decision. The method changes from "Observation" to "Inference," and inferences often fail the "False" Test (Step 3).
  *   **Inheritance:** A conclusion can inherit *nothing*. It must pass the "False" Test on its own.

  ### Step 7: Fallback & Escalation
  *   **Scenario A (Uncertainty):** If you cannot answer Step 3 or Step 5 definitively.
      *   **Action:** If the claim is high-stakes (client action involves significant risk/cost), **STOP**. Hand the claim to the Desk Head.
      *   **Action:** If the claim is standard, downgrade the label to **Assessed**.
  *   **Scenario B (Failure):** If Step 3 returns "Yes, we would still believe it."
      *   **Action:** **STOP**. Label **Assessed** (or **Possible** if confidence is low). Do not pass to Desk Head; this is a definitive failure of knowledge.
  *   **Scenario C (Success):** If all steps pass.
      *   **Action:** Label **Known**.

  ---

  ## Procedure Test Cases

  ### Case (a): The Ministerial Chain
  *   **Claim:** "A decision was taken at the meeting."
  *   **Premise:** "The minister attended the meeting" (Label: Known).
  *   **Method Statement:** "Inferring policy decisions from confirmed ministerial attendance."
  *   **Step 3 (The False Test):** If no decision was taken (Claim is False), would we believe a decision was taken?
      *   *Analysis:* Yes. Ministers often attend meetings without decisions being made. We would still see the attendance (the method) and still infer the decision.
      *   *Result:* **FAIL**.
  *   **Step 6 (Chain Breaker):** We cannot inherit "Known" from the attendance claim.
  *   **Final Label:** **Assessed**.
  *   **Note:** The chain is broken. The inference does not track the truth of the decision.

  ### Case (b): The Reliable Source
  *   **Claim:** "The report sent by Source X is accurate."
  *   **Method Statement:** "Trusting Source X based on their twenty-item track record."
  *   **Step 3 (The False Test):** If this specific report were inaccurate (Claim is False), would we believe it is accurate?
      *   *Analysis:* Yes. A source with a good track record can still make a mistake on item 21. If they make a mistake, they send the report. We, trusting their record, believe the report.
      *   *Result:* **FAIL**.
  *   **Final Label:** **Assessed**.
  *   **Note:** Past reliability is induction, not tracking. It does not guarantee sensitivity to *this* specific truth.

  ### Case (c): The Reassuring Source
  *   **Claim:** "The situation is stable."
  *   **Method Statement:** "Accepting assurances from Source Y."
  *   **Step 3 (The False Test):** If the situation were unstable (Claim is False), would we believe it is stable?
      *   *Analysis:* Yes. We have realized Source Y tells us things are stable whether they are or not.
      *   *Result:* **FAIL**.
  *   **Final Label:** **Possible**.
  *   **Note:** This fails the most basic requirement. We are not tracking reality at all.

  ---

  ## Limitations & Disclosures

  **Where This Procedure Will Misfire**
  1.  **General Truths:** This procedure struggles with broad generalizations (e.g., "The regime is fragile"). It is difficult to construct a "False" scenario for systemic claims without changing the entire world, which makes the "Method" ill-defined. These will default to **Assessed** even if you are confident.
  2.  **Negative Claims:** Proving "Event X did *not* happen" often fails the Adherence test (Step 5). If it didn't happen, there is often no signal to detect. You will find it hard to label negatives as **Known**.
  3.  **High-Reliability Sensors:** In cases where the "source" is a technical sensor with near-zero error rate, the procedure may feel bureaucratic. However, strict adherence is required to prevent drift when human analysts interpret sensor data.

  **Where Judgment is Disguised as Procedure**
  1.  **Step 1 (Method Lock):** Deciding whether the method is "Reading the email" or "Trusting the sender" is a philosophical judgment. I have instructed you to choose the *causal* mechanism, but distinguishing cause from correlation in your own workflow is subjective.
  2.  **Step 3 (The False Test):** Evaluating counterfactuals ("What would we believe if...") requires imagination, not evidence. Two analysts can run this test on the same claim and get different results based on how they visualize the "False" world.
  3.  **Step 7 (Escalation):** The decision of what counts as "high-stakes" enough to escalate to me when uncertainty arises is not defined by the checklist. That is a management judgment, not an epistemological one.

  **Final Instruction:** This procedure will drastically reduce the number of **Known** labels. This is the intended effect. If a claim cannot survive the "False" Test, it is not knowledge, regardless of how confident we feel.
