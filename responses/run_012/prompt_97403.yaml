answer: |-
  You have identified a genuine and persistent fault line in moral and legal philosophy. Your intuition is correct: the sorting mechanism you describe does not track physical effort, nor even the bare presence of bodily movement, but rather the *historical relationship* between the agent and the causal chain.

  There is no single, universally accepted noun phrase in the canonical literature that captures this specific asymmetry regarding *effort versus initiation*. However, the phenomenon sits squarely within two established strands of thought: the **Withholding/Withdrawing Distinction** in bioethics and **H.L.A. Hart and Tony Honoré's theory of Causation** in legal philosophy.

  Below, I outline where the existing literature fits, precisely where it fails to account for your observation regarding effort, and I propose a coined term to define the specific phenomenon you have isolated.

  ### 1. The Existing Strand: Intervention and Baselines

  The framework that best describes your pattern is found in *Causation in the Law* (1959) by Hart and Honoré. They argue that we distinguish between 'causing' harm and 'allowing' harm based on the concept of **intervention**.

  *   **The Fit:** Hart and Honoré posit that human action is viewed as an intervention into the "ordinary course of things." If you switch on a ventilator, you have intervened. If you switch it off, you have allowed the "ordinary course" (the disease) to resume. Similarly, in the lighthouse case, the law often treats the *establishment* of a service as creating a reliance. To start the lamp is to create a new expectation; to leave it dark is to maintain the *status quo ante*.
  *   **The Medical Parallel:** This is codified in bioethics as the **Withholding/Withdrawing Distinction**. Withholding treatment (declining to start the ventilator) is legally and morally categorised as an omission (allowing to die). Withdrawing treatment (switching it off) is often categorised as an act (killing), despite the identical outcome and often identical intent.

  ### 2. Where the Fit Breaks Down

  The established literature fails to account for the variable you highlighted: **Sustained Agency**.

  Hart and Honoré's model, and the subsequent bioethical applications, rely on a **Normative Baseline**. They assume the *status quo* is a state of rest that requires no moral or energetic accounting. They treat the background conditions as "free."

  Your lighthouse example exposes the flaw in this assumption. You note that "keeping a lamp dark for years is plainly more work than lighting it once."
  *   **The Breakdown:** The existing literature treats the *maintenance* of a harmful state as morally inert (an omission), even when that maintenance requires constant vigilance, psychological fortitude, or active policy enforcement. It privileges the **genesis** of the causal chain over the **sustenance** of the outcome.
  *   **The Effort Blindness:** Standard Act/Omission theory is blind to energy expenditure. It cares about *causal history* (did I start this?) rather than *causal energy* (how much work am I doing to keep this going?).

  ### 3. Coining the Term: The Causal Inertia Convention

  Since the existing vocabulary describes the *classification* (Act vs. Omission) but not the specific *asymmetry of effort* you have identified, I propose we coin the term **The Causal Inertia Convention**.

  #### Definition
  **The Causal Inertia Convention** is the normative heuristic which treats the *continuation* of an existing causal trajectory as morally and legally passive (an omission), regardless of the energetic or agential cost required to sustain that trajectory, whilst treating the *initiation* of a new trajectory as active (an act), regardless of how fleeting the effort may be.

  It is the habit of assigning moral weight to the **spark** rather than the **fuel**.

  #### Boundaries and Distinctions

  To ensure this term is useful, we must mark its edges against related concepts:

  **1. Versus the Ordinary Act/Omission Distinction**
  *   **The Act/Omission Distinction** is the binary classification itself (e.g., "This is an act," "That is an omission").
  *   **The Causal Inertia Convention** is the *underlying rule* that dictates how we sort them. It explains *why* we classify sustained maintenance as an omission. It highlights that the sorting is based on *momentum* (is the chain already moving?) rather than *muscle* (is the agent working hard?).

  **2. Versus Omission Bias**
  *   **Omission Bias** is a psychological phenomenon where individuals judge harmful omissions as less morally reprehensible than harmful acts, even when outcomes are identical. It is a description of human *feeling*.
  *   **The Causal Inertia Convention** is a structural or doctrinal rule. It exists in law and ethical frameworks even if the individual agent feels no psychological bias. It is a feature of the *system*, not necessarily the *mind*.

  **3. Versus The Doctrine of Doing and Allowing**
  *   **The Doctrine of Doing and Allowing** is the broad philosophical claim that there is a moral difference between the two.
  *   **The Causal Inertia Convention** specifies the *mechanism* of that difference: it is temporal and historical. It reveals that "Allowing" is often defined simply as "Not Interrupting," even if "Not Interrupting" requires a complex, effortful policy of non-interference.

  ### 4. Application to Your Examples

  Applying **The Causal Inertia Convention** clarifies your disputes:

  *   **The Lighthouse:** Under the Convention, lighting the lamp breaks the *causal inertia* of the darkness. It is an intervention. Once lit, the light becomes part of the "ordinary course." However, if the lamp is never lit, the darkness is the baseline. The Convention dictates that maintaining the baseline (darkness), even if it requires years of resisting the urge to light it, is inert. The law sees the *history* of the light (never started), not the *work* of the keeper.
  *   **The Ventilator:** Switching off the ventilator is seen as overcoming the *causal inertia* of the life-support system (stopping the machine). Declining to start it is allowing the *causal inertia* of the disease to proceed. The Convention dictates that the doctor's sustained policy of non-treatment is morally weightless compared to the momentary flick of the switch, because the former aligns with the "natural" trajectory of the illness, while the latter interrupts the "artificial" trajectory of care.

  ### Summary

  You and your friend were arguing about the **Causal Inertia Convention**.

  It is the unspoken rule that ethics and law treat causal chains like physical objects: once they are in motion, keeping them moving is 'natural' (omission), but starting or stopping them is 'force' (act). Your insight was to recognise that human agency does not obey Newton's First Law; maintaining a harmful state often requires more will, work, and intention than initiating a helpful one. The Convention ignores this, prioritising the *origin story* of the harm over the *sustained cost* of preventing it.
