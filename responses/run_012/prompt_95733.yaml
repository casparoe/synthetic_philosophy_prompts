      *   *Modern DDE:* Proportionality is usually a condition for permitting foreseen bad effects.
      *   *Aquinas:* Here, it looks like a constraint on the *act itself* (moderation of defense). It ensures the act remains "self-defense" and doesn't become "revenge" or "excessive force."
      *   *Relation to Means/End:* It's slightly different. Modern DDE says "Good effect must outweigh bad effect." Aquinas says "Don't use more force than needed to achieve the good effect." It's about the *method*, not just a utilitarian calculus.

