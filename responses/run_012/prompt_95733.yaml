answer: |-
  This is a very sharp reading of the text. You are spotting the exact pressure points where later thinkers (like the Jesuits in the 16th century and modern ethicists) expanded Aquinas into the formal "Principle of Double Effect." If you stick strictly to this paragraph, you can avoid importing those later structures.

  Here is a plain-language parsing of what Aquinas is actually saying, followed by how it applies to your specific questions and the Trolley case.

  ### 1. What does "Intend" mean here?
  You asked: *Does "intend" mean aiming at it as an end, or choosing it as a means?*

  In this text, Aquinas is using "intention" primarily to mean **the goal you are aiming for.**

  *   **The Goal:** Saving your life.
  *   **The Consequence:** The aggressor dies.

  Aquinas argues that the moral "species" (the kind of act it is) is determined by the goal. If your goal is self-preservation, the act is "self-defense." If your goal is revenge or killing, the act is "murder."

  However, your intuition is correct that there is a tension here. Aquinas adds a hard constraint at the end: *"it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority."*

  This suggests that for Aquinas, "intention" isn't just a psychological feeling; it is about **what your will accepts as part of the plan.**
  *   **Lawful:** "I will push him away to save myself. I foresee he might hit his head and die, but that is not what I am trying to do." (The death is *beside* the intention).
  *   **Unlawful:** "I will kill him to save myself." (The death is *in* the intention).

  So, to answer your question: Yes, "intend" here is narrower than "knowing it will happen." But it is broader than just "the ultimate end." If you *choose* the killing as the method to achieve safety, Aquinas counts that as intending the killing. You cannot make the death of a private citizen a tool in your plan, even if the goal is good.

  ### 2. What is the work of "Proportionality"?
  You asked: *Is "out of proportion" the same as the modern rule against using death as a means?*

  No, in this text, they are doing **separate work.**

  *   **The Intention Rule:** Determines the *kind* of act it is (Self-defense vs. Murder). This asks: "What is your goal?"
  *   **The Proportionality Rule:** Determines the *manner* of the act. This asks: "Did you use more force than needed?"

  Aquinas writes: *"if a man, in self-defense, uses more than necessary violence, it will be unlawful."*

  This is not a utilitarian calculation (i.e., "does the good outweigh the bad?"). It is a constraint on **moderation.** Even if your intention is pure (save my life), and even if the killing is a side effect, you cannot use a cannon to stop a slap. If you use excessive force, the act becomes unlawful *regardless* of your intention.

  In modern Double Effect, "proportionality" usually means "the good effect must be serious enough to justify the bad side effect." In Aquinas's text, it means "do not use more violence than is strictly required to stop the threat." It is about the **means**, not the balance of outcomes.

  ### 3. Is your friend right about "Species"?
  You asked: *Is "species" just classification, or does it determine permissibility?*

  Your friend is importing modern jargon. For Aquinas, **moral species *is* permissibility.**

  In Scholastic logic, "species" means "what kind of thing is this?" In ethics, the "kind" of act determines its morality.
  *   If the species is "Almsgiving," it is good.
  *   If the species is "Theft," it is bad.

  Aquinas says moral acts take their species from what is intended. Therefore, determining the intention *is* determining the moral identity of the act. You cannot classify an act as "Murder" (bad species) and then say "but it is permissible." If the intention makes it murder, it is forbidden.

  So, when Aquinas says the act takes its species from the intention to save life, he is saying: "This act belongs to the category of Self-Defense (which is permissible), not the category of Homicide (which is forbidden)." The classification *is* the verdict.

  ### 4. The Trolley Loop Case
  You asked: *Does Aquinas's machinery have room for the case where the death is the lever (the means)?*

  Based strictly on this text, **Aquinas would condemn the Loop Case.** Here is why:

  In your scenario, the one person's death is not a side effect (like the noise of the trolley startling a guard). The death is the **mechanism**. The body stops the trolley.
  *   **Aquinas's Test:** Is the killing "beside the intention"?
  *   **Your Case:** No. You are relying on the killing to save the five. The death is part of the causal plan.
  *   **The Authority Clause:** Aquinas explicitly states: *"it is not lawful for a man to intend killing a man... except for such as have public authority."*

  In the Loop Case, you are a private individual. You are intending the death of the one (as a means) to save the five. Aquinas says private individuals do not have the authority to intend the killing of another human being, even for a good outcome. Only the state (public authority) can intend killing (e.g., just war, capital punishment) for the common good.

  For Aquinas, the "two effects" doctrine only works if the bad effect is truly *accidental* to your plan. If the bad effect is the *engine* of your plan, it is intended. Since you lack public authority, intending that death makes the act unlawful.

  ### 5. Where you are reading Modern Double Effect into the Text
  You are likely reading the text as if it contains the **four conditions of the modern Principle of Double Effect**. It does not.

  1.  **The Act Itself:** Modern DDE says the act itself must be good or neutral. Aquinas focuses on the *intention* defining the act.
  2.  **The Means/End Distinction:** Modern DDE explicitly forbids intending evil as a *means*. Aquinas implies this ("not lawful to intend killing"), but he frames it more around **Private vs. Public Authority**. The modern version is about the structure of reasoning; Aquinas's version is about who has the right to wield lethal force.
  3.  **Proportionality:** As noted above, modern DDE uses proportionality to weigh goods vs. evils. Aquinas uses it to check for excessive violence (moderation).
  4.  **Necessity:** Modern DDE often requires that there be no other way. Aquinas mentions this ("more than necessary violence"), but ties it to the moderation of the defense, not necessarily an exhaustive search for alternatives.

  **Summary of the Text's Logic:**
  1.  **Intention:** If you aim to save life, the act is Self-Defense (Good Species). If you aim to kill, it is Homicide (Bad Species).
  2.  **Side Effects:** A bad side effect (aggressor dies) is allowed if it wasn't the aim.
  3.  **Moderation:** You must not use more force than needed.
  4.  **Authority:** You (a private person) are never allowed to *aim* at killing, even in self-defense. You can only aim at stopping the threat. If stopping the threat *happens* to kill him, that is allowed. If stopping the threat *requires* killing him (like the Trolley Loop), that is not allowed for a private citizen.

  Your confusion stems from the fact that later commentators smoothed out Aquinas's rough edges into a systematic formula. In this text, the "Public Authority" restriction is doing a lot of heavy lifting that modern discussions often ignore. Aquinas is less concerned with the abstract logic of "means vs. side effects" and more concerned with the rule that **private citizens cannot intend death.**
