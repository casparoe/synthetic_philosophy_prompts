      *   *Caveat 1 (Proportionality)::* An act with good intention can be unlawful if "out of proportion to the end." (Excessive force = unlawful; Moderate force = lawful).
      *   *Caveat 2 (Duty to Self):* You don't have to omit self-defense to avoid killing the other. Care more for your own life.
      *   *Caveat 3 (Authority):* It is unlawful to take a man's life *except* for public authority. Therefore, it is not lawful to *intend* killing in self-defense (unless you have authority).

  3.  **Address Question 1: Intention (End vs. Means):**
      *   *Text:* "one's intention is to save one's own life... it is not lawful for a man to intend killing a man in self-defense."
      *   *Analysis:* Aquinas distinguishes between the *goal* (saving life) and the *killing*. Even if the killing is necessary, it cannot be the *object of the will*.
      *   *Modern DDE:* Often distinguishes Intended Means vs. Foreseen Side Effects.
      *   *Aquinas:* Seems to treat "intention" primarily as the *end* (the goal). However, the last sentence ("not lawful... to intend killing") suggests that making the death a chosen part of the plan (even as a means) renders it unlawful.
      *   *Key Distinction:* For Aquinas, "intention" isn't just psychological focus; it's what the will rests upon as a good. If I will the death *as* the method of safety, I am willing evil.
      *   *Answer:* You are hitting on the tension. For Aquinas, "intend" usually points to the *end* (saving life). But he explicitly forbids intending the killing. This implies that if the killing becomes part of the *plan* (not just a foreseen consequence), it crosses the line.

