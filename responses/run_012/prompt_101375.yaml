prompt: |-
  Hey, I'm a high school senior and I somehow ended up in a set theory reading group with a couple of grad students, and we each have to pick something for a semester-long project. I've been reading about the continuum hypothesis and it's blowing my mind that it's independent of ZFC, but then I found out people aren't just like oh well it's independent -- there's a whole fight about whether CH is even a definite question, and whether new axioms should settle it one way or the other. Like there's the universe view vs the multiverse view, the idea that forcing axioms like Martin's Maximum push you to 2^aleph0 = aleph2, and then the ultimate-L program that's supposed to give you a canonical inner model where CH is true. And there's the Freiling dartboard thing that's supposed to be an argument against CH, and the weird fact that under AD in L(R) you get a kind of no-intermediate-cardinality result but you lose the well-ordering of the reals. I'm definately not sure which of these is the real action and which is just a side quest. I'm thinking of majoring in math or philosophy, so I want to pick something that won't be a dead end.

  So my question is: if I've got one semester and I want to work on the most important open questions or lines of work about CH, which ones should I prioritize, and why? I care way more about the reasoning than the list -- like what's upstream of what, which questions are tractable for someone at my level (I've done some real analysis and a bit of logic, but no forcing yet), and which ones would actually change how people think about set theory if they got settled. Also, which ones are overrated or don't really matter, and what would move a question up or down your ranking? I'm not asking for a reading list or citations, just your best judgment. Please start your answer with your bottom line in the first sentence, then give the reasoning, and don't restate my question.
