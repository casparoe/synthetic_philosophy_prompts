      *   *Frequentist view:* The p-value is $P(T(X) \ge T(x_{obs}) | H_0)$. This probability is calculated over the *sample space* of all possible sequences of data collection. If the stopping rule depends on the data (optional stopping), the sample space changes. The tail area changes. The error rate changes. If you don't account for the *intent* to stop, you inflate Type I error. The inference *must* control long-run error rates.
      *   *Bayesian view:* Likelihood Principle (LP). The evidence is contained entirely in the likelihood function $L(\theta | x) \propto P(x | \theta)$. If the stopping rule is non-informative (doesn't depend on unknown parameters directly, just on the data observed so far), the likelihood function is proportional regardless of when you stopped. Therefore, the posterior is the same. Inference is about coherence of belief, not long-run frequency properties.
      *   *The User's Hypothesis:* It's not about "probability = frequency vs. belief." It's about "does inference depend on the sample space (unobserved data)?" and "what is the goal of science (error control vs. belief updating)?"
      *   *Is the user right?* Mostly yes. The Likelihood Principle is the mathematical wedge. Birnbaum's theorem says (Conditionality + Sufficiency) => Likelihood Principle. Frequentists reject LP to preserve error rates. Bayesians accept LP to preserve coherence.
      *   *What kind of disagreement is this?* It's not verbal. They mean different things by "evidence." It's not just "answering different questions" because both claim to answer "What does this data tell us about the hypothesis?" But they define "tell us" differently. One defines it as "How surprising is this under null?" (requires counterfactuals). One defines it as "How much does this shift odds?" (requires only observed data).
      *   *Is it bedrock?* Yes. It's axiomatic. You cannot prove the Likelihood Principle without assuming premises frequentists reject (like Conditionality in a specific way). You cannot prove Error Rate control is necessary without assuming a decision-theoretic or Popperian framework Bayesians reject.
      *   *Progress?* No theorem will solve it. No experiment will solve it (because you can construct scenarios where one fails and the other succeeds depending on the metric). The progress is in *triage*: knowing which tool fits which goal.
      *   *Wait, is there nuance?* Yes. "Stopping rule" isn't monolithic. Informative stopping rules (stopping because you ran out of money vs. stopping because p < 0.05) matter differently. But the core conflict is the Likelihood Principle.
      *   *Diagnosis:* It's a conflict of *normative goals*. Frequentism is about *behavior* (what would I do if I did this forever?). Bayesianism is about *state* (what should I believe now?).
      *   *The "Permanent Impasse" question:* It is permanent in the sense that you can't derive an 'ought' from an 'is'. You can't prove science *should* control error rates rather than maximize coherence. That's a philosophical choice.

