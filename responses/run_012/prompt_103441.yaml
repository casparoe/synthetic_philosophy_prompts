      *   *Skeptics (Philosophy Colleagues):* Care about the historical construction of the Mencius-Xunzi dichotomy, whether the debate is real or later orthodoxy (Song Neo-Confucianism).

  3.  **Brainstorming Objections (Targeting the specific constituencies):**

      *   *Sinologist 1 (Terminology):* "Xing" isn't "nature" or "capacity." You're imposing Western metaethics.
      *   *Sinologist 2 (Xunzi's Text):* Xunzi explicitly says nature is *evil* (shan), not just misaligned. You're softening him too much.
      *   *Sinologist 3 (Mencius):* Mencius isn't just about "sprouts" completing themselves; it requires active extension. You're making Mencius too passive.
      *   *Psychologist 1 (Empirics):* Infant data shows *content* specific preferences (helper vs. hinderer), not just capacity. This supports Mencius more than Xunzi.
