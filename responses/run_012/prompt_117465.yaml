answer: |-
  In a member-governed sailing club, the bylaws bind only Full Members to the rule requiring immediate repair of shared gear they damage, whereas Guest Invitees may use the gear without assuming liability for wear. When Dave, a Full Member, returns a torn spinnaker without reporting it, Alice, a Full Member who neglected to report her own tear two days prior, demands he adhere to the rule. Beside her, Clara, a Guest Invitee who has never damaged gear merely because she bears no responsibility for it, equally demands Dave comply. Later, Ben, who resigned his Full Membership yesterday after returning all gear intact, adds his voice to the complaint.

  **The Check**

  **Verdicts and Reasoning**
  *   **Alice (Guilty Member):**
      *   *Participant View:* **Standing.** She is a Full Member; the norm applies to her, making her a party to the practice entitled to address demands to other parties.
      *   *Record View:* **No Standing.** She violated the very norm she invokes; her hands are not clean.
  *   **Clara (Innocent Outsider):**
      *   *Participant View:* **No Standing.** She is a Guest Invitee; the norm does not apply to her, so she is not a party to the practice and cannot address its demands.
      *   *Record View:* **Standing.** She has not violated the norm (indeed, could not); her hands are clean, which entitles her to complain.
  *   **Ben (Ex-Member):**
      *   *Participant View:* **No Standing.** Your friend was unsure, but on the definition given ("someone to whom the norm applies"), the norm no longer applies to him since he resigned.
      *   *Record View:* **Standing.** He left with clean hands; his past membership does not dirty them now.

  **Gaps and Uncertainty**
  The Participant View verdict for Ben relies on interpreting "applies" as "currently applies." If the view holds that past membership establishes permanent party status, Ben might have standing. The Record View verdict for Clara relies on your stipulation that "clean hands" suffice for entitlement; some Record View accounts require the blamer to be *subject* to the norm but innocent, which would deny Clara standing.

  **Key Feature and Removal**
  The divergence hinges on the **conventionality of the norm** (its restriction to members). If you remove this feature and make the norm a universal moral prohibition (e.g., "do not damage property"), Clara is no longer structurally innocent; she is bound by the norm like everyone else. If she hasn't violated it, both views might grant her standing (Participant: she is a moral agent; Record: clean hands). If she has violated it, both might deny it. The specific divergence where the Outsider has Record standing but no Participant standing collapses because the Outsider becomes a Participant in the moral community.

  **Attacks**
  *   **Participant Defender:** Will call the case rigged regarding Clara. They will argue that standing requires *authority*, not just innocence. Clara's blame is mere meddling or noise, not a normative address, because she lacks the stake that membership confers. They will say the case confuses *having an opinion* with *having standing*.
  *   **Record Defender:** Will attack the verdict for Alice as absurd (which you agree with) but might also balk at Clara. They may argue that "clean hands" implies *maintaining* cleanliness despite the *risk* of violation. Since Clara was never at risk, her innocence is trivial, not virtuous, and shouldn't grant standing.

  **Fairness Verdict**
  The scenario is a **fair test of the definitions provided**, but it potentially stacks the deck against the Participant View by exploiting the local nature of the norm. The Participant View is often designed for moral norms where membership is universal (humanity), so restricting it to a sailing club makes its exclusion of Clara seem more arbitrary than it might in a moral context. However, since you requested a local practice to make membership a matter of fact, this stacking is necessary to meet your constraints. The Record View comes off better here only because your definition ("Clean hands are what entitle") is broader than many philosophical accounts, which usually require the blamer to be subject to the norm they enforce. If the Record View required subjection, Clara would lose standing, and the divergence would vanish.
