          3.  Expressibility/Revenge: Can the theory express its own diagnostic notion (ungrounded/stable) within the object language? What does the revenge look like? Is it equal damage?
          4.  Verdict: Which is more defensible? Is the disagreement substantive or theoretical-role-based? Is a hybrid possible/costly?
      *   **Constraints:** Explain in own words, no need for literature survey/references.

  2.  **Deconstruct Approach 1 (Partial Definition/Gaps):**
      *   *Core Idea:* Truth is built up from the ground. Some sentences lack a truth value (gaps).
      *   *(i) The Liar:* It's ungrounded. It fails to express a proposition with a truth condition. It's a category mistake or simply lacks a value.
      *   *(ii) Nature of Truth:* It *aims* for a determinate extension (the minimal fixed point), but admits that the extension is partial. Truth is a property, but not everything has it or its negation.
      *   *(iii) T-Biconditionals:* They fail for the Liar. $T(\lambda) \leftrightarrow \lambda$ is not true (it's a gap). Classical logic might need weakening (e.g., Strong Kleene) to avoid explosion.
      *   *Test Cases:*
          *   Liar: Gap.
          *   Strengthened Liar ("This is not true"): If "not true" includes gaps, this sentence is true (since Liar is not true). But if it's true, it says it's not true. Contradiction/Revenge.
          *   Truth-Teller: Gap (ungrounded), though sometimes treated as arbitrary.
      *   *Revenge:* The predicate "is ungrounded" or "is not true" (in the gap sense) cannot be defined in the language without recreating the paradox.

  3.  **Deconstruct Approach 2 (Revision Theory):**
      *   *Core Idea:* Truth is circular. Defined by a rule of revision. No gaps, but instability.
      *   *(i) The Liar:* It's not pathological in the sense of lacking meaning; it's pathological in behavior. It oscillates. It has no stable status.
      *   *(ii) Nature of Truth:* Truth is not a static extension. It's the *process* of revision. A sentence is "true" if it stabilizes on True across revision sequences (or valid in all revision sequences, depending on the specific validity criterion).
      *   *(iii) T-Biconditionals:* They hold as *rules of revision*, not as static logical equivalences. You can assert $T(\lambda) \leftrightarrow \lambda$, but doing so triggers a revision. Classical logic is often preserved (in the meta-theory or via specific validity definitions), but naive assertion is risky.
      *   *Test Cases:*
          *   Liar: Unstable (flips).
          *   Strengthened Liar: Also unstable.
          *   Truth-Teller: Stable but arbitrary (can be True in one hypothesis, False in another, and stay there).
      *   *Revenge:* Can we define "is stably true"? Usually, the notion of stability across *all* revision sequences is not expressible within the language itself without generating new paradoxes (Cantorian arguments apply).

  4.  **Drafting the Comparison (Section by Section):**

      *   *Introduction:* Acknowledge the depth. It's not just technical; it's metaphysical/semantic.
      *   *Point (i) What goes wrong:*
          *   Gap View: Semantic deficiency. Failure to latch onto the world.
