          *   Revision View: Valid as revision rules, but not as static assertions preserving truth values through inference.

      *   *Test Cases:*
          *   *Simple Liar:* Gap = neither T nor F. Revision = Oscillating.
          *   *Strengthened Liar ("Not True"):*
