          *   *Damage:* Gap view revenge feels more lethal because it threatens the coherence of the "not true" predicate. Revision view revenge is about the limit of the meta-language.

      *   *Verdict & Hybrid:*
          *   *Choice:* Revision theory is often seen as more faithful to the *intuition* that the Liar is meaningful but problematic, whereas Gap views sacrifice classical logic or biconditionals. However, Gap views are simpler for grounded discourse.
          *   *Substantive vs. Role:* It's both. Substantive (is truth a property or a rule?) and Role (do we want to save classical logic or save the T-schema?).
