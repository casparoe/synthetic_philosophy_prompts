  I'm a backend engineer with no philosophy background at all, and I've somehow become the person who has to get new engineering practices to stick across our org of about 40 devs. Someone in a book club told me that culture itself evolves Darwinianly — practices and habits spreading the way memes do, copied with variation and then selected for — and that this is a real theory and not just a metaphor (apparently the word came from a biologist in the 70s). I want to actually use it, so: turn the Darwinian theory of culture into a procedure I can run before I try to roll out a practice, so I can tell in advance whether it'll spread or die, and what to change to give it a better shot.

  It has to be something I can run in an afternoon by myself, no researcher around and noones approval but mine: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision back to a person because the call is about what we value rather than about what spreads. Keep the jargon light and define anything you can't avoid in a clause. Half of what I read says the whole meme thing got quietly dropped by the people who used to work on it, so don't sell me a framework thats been abandoned — if the theory only gets me partway, say where it quits and where it'll hand me a confident wrong answer. And copying isn't literal: people half-remember a practice and reinvent it, so the procedure needs to cope with a practice that mutates a bit every time it's handed on, not just one thats passed along intact.

  Run it at the end on two cases: (1) always write the failing test first, which I've rolled out twice and which died both times, and (2) no code goes to main on a Friday, which spread through the team on its own without me doing anything, and which I'm suspicious of precisely because it caught on so easily. I'd like the procedure to tell me the Friday rule is good, and I have a feeling it won't.

  Give it back as exactly five numbered items, one or two sentences each, no intro and no conclusion — items 1 through 4 are the steps, and item 5 is where you run both cases through them.
