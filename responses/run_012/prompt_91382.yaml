answer: |-
  ### The Certainty Assumption as the True Culprit

  The Problem of Old Evidence (POE) is standardly presented as a crisis for Bayesian conditionalization. The argument runs: if an agent already knows evidence $E$, then $P(E) = 1$. If $P(E) = 1$, then $P(H|E) = P(H)$. Therefore, old evidence cannot confirm new hypotheses. Since this contradicts scientific practice (e.g., General Relativity being confirmed by the previously known perihelion of Mercury), Bayesianism appears broken.

  This diagnosis is incorrect. The defect lies not in the rule of conditionalization, but in the background dogma that knowledge entails probability 1. The POE is best read as a *reductio ad absurdum* of the **Certainty Assumption**: the claim that whatever an agent has learned, she must assign probability 1. By retaining conditionalization but rejecting the assumption that evidence propositions must be fixed at 1, we dissolve the problem without auxiliary repairs.

  ### The Concrete Model: The Fallibilist Agent

  Consider an agent, Ada, who maintains a **revisable evidence base**. Unlike the Orthodox Bayesian, Ada does not treat "learning" as a process of fixing a proposition's probability at 1 forevermore. Instead, she treats coming to know $E$ as raising $P(E)$ sharply toward 1 (e.g., to $0.99$ or $0.999$), while leaving it theoretically revisable.

  For Ada, the algebra of propositions remains intact. $E$ is not quotiented out of the probability space. Consequently, the standard definition of confirmation remains active: $E$ confirms $H$ if and only if $P(H|E) > P(H)$. By the ratio form of Bayes' Theorem:

  $$ \frac{P(H|E)}{P(H)} = \frac{P(E|H)}{P(E)} $$

  In the Orthodox model, once $E$ is learned, $P(E)$ becomes 1. Assuming $H$ entails $E$, $P(E|H)$ is also 1. The ratio becomes $1/1$, and confirmation vanishes.

  In Ada's model, even after she has "learned" $E$, she maintains $P(E) = 0.99$. When she formulates a new hypothesis $H$ (which entails $E$), she assesses the likelihood $P(E|H) = 1$. The confirmation ratio is now $1 / 0.99 \approx 1.01$.

  $$ P(H|E) = P(H) \times 1.01 $$

  $H$ receives a probabilistic boost. The mechanism is simply standard conditionalization. There is no need for Garber-style counterfactuals (asking what Ada would have believed before learning $E$), no need to re-parameterize the likelihood to represent "logical learning," and no special rule for old evidence. The "oldness" of $E$ is probabilistically irrelevant; only its current credence value matters. Because Ada refuses to dogmatize $E$, $E$ retains the capacity to exert probabilistic pressure on $H$.

  The POE arises only if one insists that $P(E)$ must hit the ceiling of 1. If we view the assignment of 1 as an idealization that fails to capture the fallible nature of empirical data, the paradox disappears. The inability of Orthodox Bayesianism to model the confirmation of General Relativity by Mercury's perihelion is not a failure of conditionalization; it is a *reductio* of the claim that empirical evidence must be certain.

  ### The Cost: The Loss of Foundationalism

  We must state the cost of this solution honestly. By rejecting the Certainty Assumption, the Fallibilist Agent sacrifices the **normative stability of the evidence base**.

  Orthodox Bayesianism offers a clean distinction between *evidence* (the fixed constraints, $P=1$) and *hypothesis* (the revisable propositions, $P<1$). This allows for a clean decision theory: when calculating expected utility, the agent conditions on what is known. The evidence serves as an unmoved mover, a foundation upon which belief updates are built. It stops the regress of justification. "Why do you believe $H$?" "Because of $E$." "Why $E$?" "Because I know it."

  For Ada, this clean architecture collapses. If $P(E) < 1$, then $E$ is effectively just another hypothesis.
  1.  **Decision Instability:** When acting, Ada cannot simply condition on $E$. She must weigh the $0.01$ probability that $E$ is false. While this is more realistic, it complicates the normative force of "knowledge." There is no longer a sharp line between what is taken for granted and what is up for debate.
  2.  **The Regress Problem:** If $E$ is revisable, what justifies raising $P(E)$ to $0.99$? It requires a meta-evidence $E^*$. But if the Certainty Assumption is rejected globally, $P(E^*)$ must also be $<1$. This invites an infinite regress of probabilistic support with no foundational floor. Orthodox Bayesianism avoids this by stipulating that the regress stops at "Given $E$."

  In short, Orthodox Bayesianism cleanly separates the **context of justification** (fixed evidence) from the **context of discovery** (shifting hypotheses). The Fallibilist model blurs this line, making every proposition potentially revisable and turning the entire belief system into a coherentist web without anchors.

  ### Verdict

  Is the trade worth making? **Yes.**

  The cost is theoretical tidiness; the benefit is descriptive and normative adequacy. The Orthodox distinction between evidence and hypothesis is a useful fiction, but it is a fiction that breaks when confronted with the history of science. A theory of rationality that implies Einstein's confirmation of General Relativity was impossible is a theory that has prioritized mathematical convenience over rational reality.

  The "foundational stability" Orthodox Bayesianism claims is illusory. Empirical evidence is *never* truly certain; treating it as such forces agents to ignore the risk of error in their evidence base, which is itself irrational. It is better to have a messy, coherentist model that accurately reflects how evidence actually supports theory than a clean, foundationalist model that declares major scientific achievements to be probabilistically null. The POE is not a puzzle to be solved within Orthodox Bayesianism; it is a signpost pointing us toward a fallibilist revision of the framework.
