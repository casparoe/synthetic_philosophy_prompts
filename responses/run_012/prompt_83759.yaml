answer: |-
  # DECISION TREE: CAUSAL EXCLUSION AND MENTAL PROPERTIES

  **Instructions:** Begin at Node 1. Answer each question based on your intuitions about the world, not on which philosophical label you prefer. Follow the branch corresponding to your answer. Terminate at a Leaf.

  ### NODES

  **1. Are mental properties strictly identical to physical properties?**
  *(i.e., Is a complete physical description of the brain also a complete mental description, with no remainder?)*
  *   **YES:** Go to Leaf A.
  *   **NO:** Go to Node 2.

  **2. Is the physical domain causally closed?**
  *(i.e., Can every physical event be fully accounted for by prior physical events and physical laws alone, without external intervention?)*
  *   **YES:** Go to Node 3.
  *   **NO:** Go to Leaf B.

  **3. Do mental properties have any causal influence on physical events?**
  *(i.e., If you remove the mental property but keep the physical base, does the physical outcome change?)*
  *   **NO:** Go to Leaf C.
  *   **YES:** Go to Node 4.

  **4. Is causation a competitive relation among sufficient conditions?**
  *(i.e., If a physical cause is sufficient for an effect, does that logically preclude a distinct mental description from also being a cause?)*
  *   **NO:** Go to Leaf D.
  *   **YES:** Go to Node 5.

  **5. Does current physics describe the intrinsic nature of matter?**
  *(i.e., Does physics tell us what matter *is*, or only how matter behaves/relates structurally?)*
  *   **NO (Only Structure):** Go to Leaf E.
  *   **YES (Intrinsic):** Go to Node 6.

  **6. Do mental properties confer novel causal powers not derivable from physical parts?**
  *(i.e., Does the whole exert force on the parts in a way not reducible to the sum of the parts' interactions?)*
  *   **YES:** Go to Leaf F.
  *   **NO:** Go to Node 7.

  **7. Is the dispute primarily about the definition of "causation" rather than the structure of reality?**
  *(i.e., Would clarifying our language dissolve the problem without changing our ontology?)*
  *   **YES:** Go to Leaf G.
  *   **NO:** Go to Node 8.

  **8. Is the mental property a higher-order structural feature of the physical token?**
  *(i.e., Is the mental property a complex physical arrangement that is causal in virtue of that arrangement?)*
  *   **YES:** Go to Leaf H.
  *   **NO:** Go to Leaf I.

  ---

  ### LEAVES

  **Leaf A: Reductive Physicalism (Identity Theory)**
  *   **Awkward Commitment:** You must accept that the subjective "feel" of an experience is strictly identical to a neural firing pattern, leaving no ontological room for the phenomenology to be distinct.

  **Leaf B: Interactionist Dualism**
  *   **Awkward Commitment:** You must accept that mental events occasionally violate the conservation of energy or the deterministic laws of physics to alter brain states.

  **Leaf C: Epiphenomenalism**
  *   **Awkward Commitment:** You must accept that your conscious thoughts have no effect on your actions, including your action of asserting that they do.

  **Leaf D: Proportionality / Difference-Making Causation**
  *   **Awkward Commitment:** You must accept that causation is not a relation between concrete events, but a relation between variables or descriptions where the mental "screens off" the micro-physical details.

  **Leaf E: Russellian Monism**
  *   **Awkward Commitment:** You must accept that the intrinsic nature of physical matter is proto-experiential, implying a form of panpsychism or panprotopsychism.

  **Leaf F: Emergentism**
  *   **Awkward Commitment:** You must accept brute laws of nature where higher-level systems exert downward causation on their constituents without a mediating physical mechanism.
      *   *(Note on Recurrent Realization: A system where the physical realizer depends on prior mental history fits here if that history is treated as adding novel causal power not contained in the instantaneous physical state.)*

  **Leaf G: Quietism / Deflationism**
  *   **Awkward Commitment:** You must accept that centuries of metaphysical debate regarding mind-body causation amount to a linguistic confusion rather than a substantive discovery about the world.

  **Leaf H: Non-Reductive Physicalism (Realizationism)**
  *   **Awkward Commitment:** You must accept that a single event token can instantiate two distinct properties (mental and physical) where both are causal without overdetermination, relying on a relation of constitution.

  **Leaf I: Non-Reductive Physicalism (Explanatory Autonomy)**
  *   **Awkward Commitment:** You must accept that mental properties are distinct from physical properties yet causally efficacious via special laws that supervene on physics but are not reducible to them.

  ---

  ### ANALYSIS OF LOGICAL SPACE

  **1. Unoccupied Combinations**
  *   **Interactionist Dualism + Reductive Physicalism (Node 1 YES / Node 2 NO):**
      *   *Status:* **Incoherent.** One cannot claim mental properties are identical to physical properties while simultaneously claiming they operate outside physical causal closure.
  *   **Epiphenomenalism + Proportionality Causation (Node 3 NO / Node 4 NO):**
      *   *Status:* **Incoherent.** If causation is defined by difference-making (Node 4 NO), a property that makes no difference (Node 3 NO) cannot be a cause; the definitions contradict.
  *   **Emergentism + Reductive Physicalism (Node 1 YES / Node 6 YES):**
      *   *Status:* **Incoherent.** Novel powers (Emergence) preclude strict identity (Reduction).
  *   **Russellian Monism + Interactionist Dualism (Node 2 NO / Node 5 NO):**
      *   *Status:* **Unexplored / Unattractive.** While logically possible to combine intrinsic structural gaps with causal violation, most proponents of Russellian views seek to preserve physical closure by filling the intrinsic gap, not breaking the closure.

  **2. Indistinguishable Pairs**
  *   **Leaf F (Emergentism) vs. Leaf B (Interactionist Dualism):**
      *   *Gap:* The tree cannot separate these if the "novel powers" in Leaf F are strong enough to alter physical trajectories. Many emergentists insist they are physicalists, but if the causal power is truly novel and not derivable from physical laws, the distinction from Interactionism becomes merely verbal (labeling the novel power "physical" without changing its behavior).
  *   **Leaf H (Realizationism) vs. Leaf A (Reductive Physicalism):**
      *   *Gap:* If the mental property is a higher-order physical feature (Leaf H), it risks collapsing into Leaf A. The distinction relies on a fragile notion of "property distinctness" that many critics argue is not robust enough to support non-reductive status.

  **3. The Case of Recurrent Realization**
  *   *Definition:* A system where the physical realizer at $t_2$ depends on the fact that it was produced by a mental token at $t_1$, such that the instantaneous physical state at $t_1$ does not fix the future.
  *   *Placement:* This case does **not** force a new branch. It re-describes **Leaf F (Emergentism)** or **Leaf H (Realizationism)** depending on how one defines the "physical base."
      *   If the proponent insists the *instantaneous* physical state is the only physical reality, this case forces a move to **Leaf F**, as the mental history adds causal power absent from the physical snapshot.
      *   If the proponent expands the "physical state" to include historical relations (world-lines rather than time-slices), the case collapses into **Leaf H**, as the mental history is encoded in the complex physical relation.
      *   *Verdict:* The tree handles this via Node 6 (Novelty). If the history adds novelty, go to F. If the history is just complex physics, go to H.

  ---

  ### INSTRUMENT CRITIQUE

  **1. Contested Work Under Neutral Phrasing**
  *   **Node 4 ("Is causation a competitive relation...?"):** This question does the heaviest lifting but disguises a metaphysical commitment. A scientist might answer "No" thinking of statistical correlation or interventionism, inadvertently committing to a specific philosophical solution (List/Menzies style proportionality) without realizing it excludes standard nomological sufficiency views. The phrasing "logically preclude" is the trap; many scientists assume causation is permissive, not exclusive.

  **2. Least Confident Leaf Attribution**
  *   **Leaf H (Non-Reductive Physicalism - Realizationism):** I am least confident that this position is stable. The "awkward commitment" (constitution without overdetermination) is the exact point where the Exclusion Argument usually crushes this view. It is highly probable that a rigorous interrogation of Leaf H forces a retreat to Leaf A (Reductive) or a jump to Leaf F (Emergentism). It may be an unstable equilibrium rather than a true leaf.

  **3. The Rebuild Trigger**
  *   **Answer to Node 7 ("Is the dispute primarily about definition?..."):** If a participant answers "Yes," the entire tree above Node 7 becomes irrelevant. If the dispute is verbal, the ontological distinctions (Identity, Closure, Novelty) are category errors. A "Yes" here should ideally terminate the tree immediately, but I placed it late to allow for realist options first. If your group leans heavily towards pragmatism, move Node 7 to Node 2.

  **4. Is a Tree the Right Instrument?**
  *   **Argument:** A tree implies that these positions occupy a common logical space defined by independent binary variables. However, many of these positions are not independent; they are holistic frameworks where answering one question changes the meaning of the terms in the others (e.g., "Physical" means something different to a Russellian Monist than to a Reductive Physicalist).
  *   **Verdict:** The tree is a useful heuristic for mapping *commitments*, but it fails to capture *conceptual drift*. It forces distinct definitions of "causation" and "physical" into the same nodes. For a group of scientists, this is a feature, not a bug: it forces them to stabilize their definitions before choosing a branch. Proceed with the tree, but treat the nodes as requests for definition-stabilization, not just empirical queries.
