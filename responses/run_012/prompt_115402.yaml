      *   **Section 2: Lear's case (~300 words)**
          *   Focus: *King Lear*.
          *   Key elements: The division of the kingdom, the storm, the loss of power, the betrayal by daughters.
          *   Connection to Cicero: Lear experiences the four charges but negatively. Withdrawal is forced exile, not peaceful retirement. Weakness is madness and physical collapse. Loss of pleasure is profound suffering. Death is sought but delayed tragically.
          *   Nuance: Is it age or the abdication? The prompt asks to consider loss of command/property/loyalty.
