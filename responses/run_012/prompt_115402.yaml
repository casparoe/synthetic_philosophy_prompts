      *   **Section 3: Where each is right (~300 words)**
          *   Focus: Synthesis/Comparison.
          *   Cicero is right: About the potential for wisdom and the naturalness of death. Cato's view works for those who retain *auctoritas*.
          *   Lear is right (as counterexample): Shows that without power/security, old age is vulnerable.
          *   The Distinction: Old age vs. Dependence. Cicero assumes independence/status. Lear shows what happens when that is stripped.
