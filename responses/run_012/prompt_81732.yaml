      *   *Nuance:* The uncle says "Market is poker." The roommate says "No trade theorem." I need to bridge these. The uncle is intuitively grasping *Adverse Selection* (Akerlof's Lemons), while the roommate is talking about *Common Knowledge*. I should mention Adverse Selection as the bridge.

  7.  **Final Polish:**
