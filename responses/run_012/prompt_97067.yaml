answer: |-
  Dear Friend,

  I have been thinking about our recurring disagreement regarding the ward election, and specifically about the precision of the argument your friend relies upon. Since he is a retired actuary, he will respect a decomposition of the probability and utility claims hidden inside his one-liner. The phrase my vote does not matter is not a single proposition but a container for several distinct claims that range from the trivially true to the demonstrably false, and the force of his conclusion depends entirely on which specific reading he intends to endorse. To help you dismantle the equivocation, I have laid out the available interpretations as a menu of distinct logical claims, ranging from the platitudinous to the substantive, and finally to the erroneous, so you can ask him exactly which door he is walking through.

  Consider the first reading, which is the claim of causal inefficacy in the but-for sense. This reading asserts that the actual outcome of the election would have been identical had you stayed home. In a race decided by thousands of votes, this is often true, but in the ward elections you described, where margins were countable on one hand, this claim is empirically false. If the margin was three votes and you voted, your vote was a necessary condition for the winner's victory, meaning your vote did matter in the strict counterfactual sense. Your friend's shift to the phrase one vote never decides an election is an attempt to salvage this reading by universalizing it, but that universal claim is falsified by the very existence of close races. If he insists on the universal claim that a single vote never decides an election, he is making a factual error that his own observation of recent ward results should correct. If he retreats to the claim that his vote did not decide this specific election, he is safe from falsification only if the margin was larger than one, but he cannot generalize that to a rule for all elections without contradicting the evidence you both acknowledge.

  Move now to the second reading, which concerns probability rather than actual causation. This is the claim that the ex ante probability of your vote being decisive is zero. For an actuary, this is a strong claim to make, as it requires assuming that the vote distribution is never exactly tied or separated by one vote across the relevant population. This is demonstrably false in small electorates like wards, where the probability is non-zero and sometimes significant. A softer version of this probability claim is that the chance is non-zero but so negligible that it rounds to zero for practical purposes. This is the standard rational choice argument, but it relies on an assumption about the scale of the electorate that may not hold in a ward contest. Even this softer claim is weakened by the history of close races you cited, because past frequency is the best estimator for future probability in local contexts, suggesting the chance is not negligible enough to ignore without calculation.

  There is a third reading, which shifts from probability to expected value. This claim admits that the probability is non-zero but argues that the expected benefit, calculated as the probability of being decisive multiplied by the difference in value between the candidates, is less than the cost of voting. This is the only reading that logically bridges the gap to the conclusion that it is not worth your time. However, this calculation depends entirely on the input variables, specifically the utility function of the voter. If your friend assumes you care only about the instrumental outcome of who wins, the math might work out to staying home. But if your preferences include the expressive value of voting, the satisfaction of fulfilling a civic norm, or the avoidance of regret should your side lose by one vote, the cost-benefit analysis changes. When he says it is not worth your time, he is implicitly asserting a claim about your preferences rather than about the election itself, specifically that you are narrowly self-interested in the policy outcome alone. If you deny that preference structure, his conclusion no longer follows from his premise.

  Consider a fourth reading, which operates at the level of the general rule rather than the individual act. This is the claim that while my vote might matter, the rule that people like me stay home would not matter. This is often a confusion between individual causal impact and collective constitutive impact. If everyone stayed home, the election would lack legitimacy or fail to occur, so the general rule does matter. However, your friend is arguing about your individual act, not the general rule. If he argues that your individual act does not matter because the general rule of abstention would be required to change things, he is committing a fallacy of composition. The fact that a single brick does not hold up the wall does not mean the brick does not matter to the wall's structure, especially if that brick is the keystone. In a close race, your vote is not just a brick but potentially the keystone, so the distinction between the individual act and the collective rule collapses.

  There is a fifth reading, which concerns legitimacy and mandate rather than the vote count. This claim asserts that your vote does not matter because the winner's right to rule is not constituted by your specific contribution. This is a sociological or political claim rather than a mathematical one. It suggests that even if you changed the winner, the legitimacy of the process remains unchanged, or conversely, that your single vote adds nothing to the mandate of the winner. This reading is immune to the evidence of close races, because even in a one-vote victory, the winner is legally elected. However, this reading does not support the conclusion that you should not bother voting unless you also believe that legitimacy is the only reason to vote. If you vote to influence policy rather than to confer legitimacy, this reading is irrelevant to the decision.

  There is a sixth reading, which is the claim of causal overdetermination. This suggests that even if your vote was part of the winning margin, there were enough other votes that the outcome was determined by broader social forces regardless of your participation. This is a metaphysical claim about causation that is difficult to verify. In the context of an election, votes are the mechanism of determination, so to say the votes did not matter because social forces mattered is to confuse the method with the cause. If the social forces operate through the votes, then the votes matter. This reading is usually a placeholder for fatalism and does not survive scrutiny in a system designed to translate individual preferences into outcomes.

  When your friend switches from my vote doesn't matter to one vote never decides an election, he is changing the claim from an indexical statement about his specific situation to a universal generalization about the mechanics of voting. The first statement allows for the possibility that votes matter in other contexts, while the second denies the possibility entirely. This switch is likely a defensive maneuver to avoid the falsification provided by the close ward races you mentioned. The universal claim is false, as history shows single votes deciding elections. The indexical claim might be true for him in a specific landslide, but he cannot use it to advise you against voting in a ward with a history of close margins without ignoring the local data. The readings that make his conclusion follow, specifically the expected value claim based on narrow self-interest, are not the same ones that survive contact with a race decided by a handful of votes. In a close race, the probability of being decisive rises, and the expected value calculation may flip to favor voting. Therefore, the premise that supports his conclusion is vulnerable to the very evidence you have presented.

  To get from my vote doesn't matter to so it isn't worth your time to vote, he actually needs the third reading, the expected value claim based on a specific utility function. He needs you to accept that the probability of decisiveness is low, the differential value between candidates is not infinite, and the cost of voting is positive, and crucially, that you derive no intrinsic value from the act itself. If you challenge any of these inputs, particularly the assumption that you only care about being the decisive voter, the argument collapses. He likely would not accept this plain statement because it admits that the argument is about your preferences and risk tolerance rather than an objective fact about the election. It exposes his advice as a recommendation based on a specific model of rationality that excludes civic or expressive utility, rather than a discovery of fact.

  You can press him on whether he is making a claim about the world or a claim about his own preferences. If he claims it is a fact about the world that his vote doesn't matter, the close races prove him wrong on the causal and probability readings. If he claims it is a fact about his calculation that the cost outweighs the benefit, he must admit that this calculation might not hold for you or for this specific ward. The equivocation lies in sliding between the false universal claim that one vote never decides, which sounds like an objective fact, and the subjective expected value claim, which is what actually drives the decision to stay home. By forcing him to choose between the falsifiable empirical claim and the subjective preference claim, you can show that neither supports a general rule of abstention in the context you both inhabit.

  I hope this breakdown provides the structural leverage you need to move the conversation past the slogan.

  Yours sincerely,

  A Correspondent
