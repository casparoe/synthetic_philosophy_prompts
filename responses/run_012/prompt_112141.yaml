answer: |-
  **Project Title:** Substance and Imputation: A Jurisprudential Reconstruction of the 'Victors' Justice' Objection

  **Statement of the Research Question**
  The prevailing discourse surrounding the Nuremberg and Tokyo tribunals frequently aggregates distinct jurisprudential complaints under the singular label of "victors' justice." This conflation obscures the specific legal vulnerabilities of the judgments. This project poses a precise, determinate question: **Can the substantive criminalization of aggressive war be legally vindicated independently of the fairness of the imputation principles employed to attribute individual liability?**

  This question forces a binary distinction between the validity of the norm (*nullum crimen*) and the coherence of the agency theory used to apply it (*nulla poena sine culpa*). If the answer is negative, then the standard defenses of the tribunals—which typically focus on the pre-existence of prohibitions on war—fail to secure the legitimacy of the judgments, because flaws in individual culpability vitiate the substantive norm. If the answer is positive, then the "victors' justice" critique must be re-located entirely to procedural fairness, leaving the substantive law intact. The project aims to demonstrate that the two are not separable: the tribunals' failure to articulate a coherent theory of individual agency regarding state acts rendered the substantive criminalization of aggression legally indeterminate.

  **State of the Field and Rationale**
  Existing scholarship generally divides into two camps, neither of which resolves the question above. The first camp offers a positivist defense, arguing that the Kellogg-Briand Pact and customary international law sufficiently prohibited aggressive war prior to 1945. This position addresses the existence of the norm but ignores whether that norm was capable of binding individual actors absent a prior theory of state-personhood. The second camp accepts the "victors' justice" critique but treats it as a monolithic political indictment, conflating the lack of positive law with the unfairness of the proceedings and the novelty of the liability standards.

  Consequently, a significant gap remains. No existing analysis rigorously separates the *ontological* status of the crime (was aggression a crime?) from the *imputational* mechanism (could this individual be guilty of it?). By treating these as distinct variables, current literature leaves open the possibility that a valid norm was applied via invalid legal logic. This project closes that gap by testing the separability thesis. It proceeds on the hypothesis that the Tokyo Tribunal, more so than Nuremberg, exposes the dependency of substantive validity on imputational coherence, particularly regarding the doctrine of conspiracy and the defense of superior orders.

  **Methodology and Work Plan**
  This project employs a method of conceptual reconstruction rather than historical survey. The primary materials are the indictments, judgments, and dissenting opinions of the International Military Tribunal and the International Military Tribunal for the Far East. The analysis will not seek to recount the historical facts of the war, but to extract the underlying legal doctrines regarding individual liability. The approach is comparative: by holding the substantive charge (crimes against peace) constant and varying the tribunal (Nuremberg vs. Tokyo), the project isolates how different applications of imputation principles affect the perceived legality of the norm.

  *Months 1–3: Framework and Nuremberg.* I will construct a taxonomy of the three distinct complaints usually hidden within the "victors' justice" label: (1) absence of prior prohibition, (2) lack of fair warning regarding enforcement, and (3) incoherent standards of culpability. I will then analyze the Nuremberg judgment to determine how it attempts to bridge the gap between state acts and individual liability, specifically focusing on the "common plan or conspiracy" charge.

  *Months 4–6: The Tokyo Contrast.* I will apply the same taxonomy to the Tokyo judgment. Given the greater heterogeneity of the bench and the specific focus on the prosecution of political leadership for waging war, Tokyo serves as the critical test case. I will examine whether the dissenting opinions there identify the imputational flaw more clearly than the Nuremberg dissents, and whether the majority opinion relies more heavily on political necessity than legal doctrine to sustain the link between the state and the individual.

  *Months 7–9: Synthesis and Theoretical Modeling.* I will synthesize the comparative findings to answer the central question. This involves testing whether a tribunal could have satisfied the complaints regarding fair warning and culpability (complaints 2 and 3) without abandoning the criminalization of aggression (complaint 1). I will model a counterfactual legal framework that satisfies the principles of individual culpability to see if the substantive norm survives intact.

  *Months 10–12: Drafting and Revision.* The final quarter will be dedicated to writing the monograph-length article or chapter. I will refine the argument to ensure the distinction between substantive validity and imputational coherence is maintained throughout, avoiding the slide back into political moralizing.

  **Criteria for Success and Failure**
  A successful result will yield a determinate classification of the "victors' justice" objection. Specifically, success looks like a demonstration that the legal validity of the judgments stands or falls on the coherence of the theory of imputation, not merely on the existence of the prohibition. I will have succeeded if I can show precisely where the legal reasoning breaks down: is it at the statute, the indictment, or the application of liability?

  The project will be deemed to have failed if the analysis collapses back into a general political assessment of the tribunals' legitimacy. If I cannot distinguish between the *unfairness* of the trial and the *invalidity* of the legal principles used to attribute guilt, the research question remains unanswered. Similarly, if the comparison between Nuremberg and Tokyo yields only historical differences without jurisprudential significance, the methodological approach will have proven insufficient.

  **Scope and Limitations**
  Given the one-year timeframe, strict boundaries are necessary. First, the project will focus exclusively on "Crimes Against Peace." I will exclude "Crimes Against Humanity" and "War Crimes" from the primary analysis, as the imputational problems regarding state aggression differ categorically from atrocities committed by individuals. Second, I will not engage in a detailed historical reconstruction of the Pacific or European theaters; the facts of the war are relevant only insofar as they were alleged in the charge sheets. Third, I will limit the analysis of sentencing and post-judictional developments. The inquiry is restricted to the logic of the judgments themselves. By cutting these elements, I ensure the remaining scope is deep enough to support a conceptual rather than descriptive conclusion.
