answer: |-
  ### The Thought Experiment: The "Three-Whistle" Signal

  **Setting:** The Kaeli, a community of 300 hunter-gatherers in a river valley. No writing, no recording technology. Ordinary human memory and cognition.
  **Practice:** A specific auditory signal used to coordinate group fishing. It consists of a sequence of three whistles with a specific pitch contour: *High-Low-High*.
  **Duration:** The practice remains stable for ten generations (approx. 250 years).
  **Baseline Condition:** Transmission happens through casual observation and participation. There is mild social pressure to get it right (it works better for fishing), but no formal teaching or punishment for errors.

  **The Baseline Outcome:**
  After ten generations, the *High-Low-High* contour remains the dominant version. Minor variations occur but do not take hold.

  **The Competing Explanations (Baseline):**
  *   **(1) The Replicator Picture:** The *High-Low-High* signal is a "fit" meme. It possesses properties that allow it to out-compete variant signals (e.g., *High-High-Low*) for space in human brains and airtime. Its stability is due to its own differential fitness.
  *   **(2) The Attractor Picture:** Human auditory memory has a cognitive default (an attractor) for *High-Low-High* patterns. Every time a Kaeli learns the signal, they reconstruct it from scratch. Noise introduces errors, but cognition pulls the reconstruction back to the default. Stability is due to the structure of the human mind, not the signal itself.

  In the baseline, both models predict the same outcome: **Stability.** The outcome alone cannot distinguish them. To separate them, we must manipulate **Copying Fidelity**.

  ***

  ### The Variable: Social Correction Mechanism

  We manipulate the fidelity of transmission by altering the social consequences of error. This acts as a proxy for copying fidelity without introducing writing or technology.

  #### Setting 1: Low Fidelity (No Correction)
  We imagine a splinter group of the Kaeli where social norms shift. Errors in the whistle signal are ignored; no one corrects mistakes, and there is no penalty for getting it wrong. Transmission is purely osmotic (watch and guess). The error rate in transmission rises significantly (e.g., 20% per generation).

  *   **Outcome:** The *High-Low-High* signal **remains stable**.
  *   **Replicator Prediction (Embarrassing):** To explain stability amidst high noise, the Replicator view must claim the *High-Low-High* meme has an impossibly high "selection coefficient." It must argue that the meme is so "fit" it overcomes the **Error Threshold** (Eigen's Paradox). If the mutation rate exceeds a certain limit, information degrades regardless of fitness. For the Replicator to claim survival here, they must posit a "super-meme" with magical copying power, which is ad hoc and mathematically suspect.
  *   **Attractor Prediction (Comfortable):** The signal matches a universal cognitive bias for pitch contours. Even with high noise in transmission, the *reconstruction* process in the brain filters out the noise. Stability is expected because the mind is the filter.

  #### Setting 2: High Fidelity (Strict Correction)
  We imagine a different splinter group where the signal is sacred. Elders physically correct children who whistle it wrong. Transmission is explicit, rigid, and error-intolerant. The error rate drops to near zero.

  *   **Outcome:** The *High-Low-High* signal **remains stable**.
  *   **Replicator Prediction (Comfortable):** The high-fidelity channel ensures the information is preserved. Selection acts on the channel (the teaching norm), preserving the meme.
  *   **Attractor Prediction (Embarrassing):** The Attractor view claims stability comes from *reconstruction biases*. However, with near-perfect copying, there is **no variation for the attractor to act upon**. If everyone copies perfectly, we cannot observe the "pull" of the cognitive default. The Attractor explanation becomes **causally excluded**; the channel explains 100% of the stability, rendering the cognitive attractor epiphenomenal (a ghost in the machine). The theory becomes empirically toothless.

  ***

  ### Analysis and Verdict

  **The Verdict**
  The **Copying Fidelity** variable is the wedge.
  *   At **Low Fidelity**, the **Replicator view** breaks. It cannot mathematically account for information stability when noise exceeds the error threshold without invoking ad hoc "super-fitness."
  *   At **High Fidelity**, the **Attractor view** breaks. It relies on observing how noise is filtered to prove the existence of the attractor. Remove the noise (via high fidelity), and you remove the evidence for the mechanism. The Attractor claim becomes unfalsifiable and redundant.

  **The Working Feature**
  The feature doing the work is **Variation**.
  *   The Replicator model *needs* variation to select from, but it *fails* if variation (noise) is too high.
  *   The Attractor model *needs* variation (noise) to demonstrate the "pull" of the default, but it *fails* to explain stability if variation is suppressed by external force.

  **If You Remove That Feature**
  If you remove **Variation** entirely (perfect cloning), both models collapse into the same description, and the debate becomes semantic. If you maximize **Variation** (pure noise), both models predict degradation, and the debate is moot. The tension only exists in the middle range, which is why this specific manipulation of fidelity is required to separate them.

  **The Memeticist Counter-Move**
  A dyed-in-the-wool memeticist (Replicator defender) will not accept the "Low Fidelity" embarrassment. They will deploy the **"Niche Construction" defense**.

  They will argue: *"You assume fidelity is an external variable. It isn't. A truly fit meme **constructs its own high-fidelity environment**."*

  They will claim that the *High-Low-High* signal didn't just survive the low-fidelity setting; it *caused* the Kaeli to develop social norms that increased fidelity (even if you didn't measure it). They will argue that "fitness" includes the ability to compel hosts to create better copying channels. By making fidelity an *effect* of the meme rather than a *constraint* on it, they bypass the Error Threshold problem. The meme survives low fidelity because, in their view, a meme that couldn't boost fidelity would have died out earlier. This moves the goalposts from "copying mechanics" to "long-term causal power," insulating the Replicator view from the fidelity constraint.
