answer: |-
  The structure you are describing is standardly classified as a **merely verbal dispute**, and the philosophical diagnosis that such ontological standoffs are empty is known as **metaontological deflationism**.

  This carving distinguishes the *phenomenon* (two parties agreeing on all first-order truths within a domain while disagreeing on higher-order ontological claims) from the *diagnosis* (the claim that this disagreement lacks substantive content). In the literature, the mechanism explaining how this happens is often **quantifier variance** (the idea that "exists" means something slightly different to each party) or **Carnap's internal/external distinction** (the idea that internal mathematical truths are distinct from external ontological frameworks, which are pragmatic rather than factual). The dispute has the *shape* of a disagreement because the surface grammar is identical, but the *diagnosis* asserts that once linguistic frameworks are aligned, the disagreement evaporates.

  The line between this diagnosis and simply refusing to do metaphysics is drawn at **meaning versus triviality**. A refusal to do metaphysics (like **Logical Positivism** or hard **Naturalism**) claims ontological questions are *meaningless* or *illegitimate* and should be discarded. **Metaontological deflationism**, by contrast, allows that the questions are meaningful but argues they are *trivially* resolvable or dependent on conceptual choices rather than worldly facts. The deflationist engages in metaphysics to dissolve it, whereas the positivist refuses to engage at all. For your mathematicians, the deflationist says both are right relative to their frameworks; the positivist says the platonist is speaking nonsense.

  This same structure appears frequently in the **free will debate**, where compatibilists and incompatibilists often agree on all physical and psychological facts (determinism, causation) but disagree on whether the label "free" applies. Deflationists about free will argue this is merely verbal (a dispute over the definition of "free"), while substantivists argue the stakes (moral responsibility) make the disagreement non-verbal despite the factual agreement. The structure is identical—agreement on the base domain, disagreement on the superstructure—but the diagnosis is more contested in ethics than in mathematics because normative stakes resist being dismissed as purely linguistic.
