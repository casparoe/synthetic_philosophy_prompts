answer: |-
  # Activity: The Leaky Room Experiment

  ## Setup & Materials
  *   **Room:** A classroom with a table at the front.
  *   **Divider:** A large cardboard box, whiteboard, or stack of books tall enough to hide a seated person's face and hands from the interrogator.
  *   **Paper & Pens:** Plenty of them.
  *   **Pre-Session Prep:** You (the facilitator) need to recruit **two** confederates beforehand (or arrive 10 minutes early to brief two trusted club members).
      *   **Confederate A (The "Human"):** Plays honestly.
      *   **Confederate B (The "Machine"):** Plays honestly *except* they have a secret information leak.
      *   **Secret Instruction for B:** Sit where they can see the Interrogator's question sheet over the top of the divider (or through a gap you arrange). They must answer *uncannily well*, referencing specific wording on the question sheet that wasn't spoken aloud.
      *   **Secret Instruction for You:** Ensure the Interrogator believes the divider is solid.

  ## Roles (15 People)
  *   **Interrogator (1):** Sits at the table, faces the divider. Writes questions.
  *   **Candidate A (1):** Sits behind the divider (left side).
  *   **Candidate B (1):** Sits behind the divider (right side). This is the "Machine" with the leak.
  *   **Observers (12):** Sit in the audience. They know *something* might be up but don't know what. They take notes on the Interrogator's reasoning.

  ## Rules of the Game
  1.  **Goal:** The Interrogator must identify which candidate is the "Human" and which is the "Machine" (actually both are humans, but B is following a "rule sheet" that implies they shouldn't know certain things).
  2.  **Communication:** All communication is written. Interrogator writes a question, passes it to you (Facilitator), you pass it to both Candidates. Candidates write answers, pass back to you, you give to Interrogator.
  3.  **The Catch:** Tell the Interrogator: "Candidate B is operating under strict constraints. They should not be able to see your face or your specific wording unless they are processing it like a human." (This is a lie, but sets the expectation).
  4.  **Duration:** 5 questions. 3 minutes per question.

  ## Timeline (60 Minutes)

  ### 0:00–0:10: Setup & Briefing
  *   Arrange the room. Place the divider.
  *   Select the Interrogator (pick someone skeptical and vocal).
  *   Seat Candidates A and B behind the divider. Ensure B has the line of sight (the "leak").
  *   Tell the audience: "Watch the Interrogator's confidence. Watch *why* they make their choice."
  *   **Crucial:** Do not explain the ESP/Turing connection yet. Tell them: "We are testing if intelligence can be detected in a sealed system."

  ### 0:10–0:30: The Imitation Game
  *   **Round 1 (Questions 1-3):** Standard questions ("What is your favorite color?", "Count backwards from 100"). Both answer normally.
  *   **Round 2 (Questions 4-5):** The Trap.
      *   Interrogator writes a complex question with a specific typo or unique phrasing (e.g., "Describe the feeling of a *bluie* sky").
      *   **Candidate B (The Leak):** Because they can see the paper, they reference the typo ("You spelled blue wrong") or the specific phrasing.
      *   **Candidate A (Human):** Answers normally ("I like blue skies").
      *   *Effect:* Candidate B looks hyper-aware and "human-like" because they picked up on context clues. Candidate A looks generic.
  *   **Decision:** Interrogator must declare: "A is Human, B is Machine" OR "B is Human, A is Machine."
  *   **Commitment:** Have the Interrogator write down their reason *before* the reveal. (e.g., "B noticed my typo, only a human would catch that.")

  ### 0:30–0:40: The Reveal
  *   Ask the Interrogator to read their reasoning.
  *   Ask Candidate B to stand up and explain how they answered Question 4.
  *   **The Drop:** B reveals they could see the paper over the divider.
  *   **The Shock:** The Interrogator attributed "awareness" to "information access."
  *   **Audience Check:** Ask the audience, "Who else thought B was the human?" (Most hands will go up).

  ### 0:40–0:55: The Turing Debrief (Discussion)
  *   **Phase 1: The Leak (10 mins)**
      *   Ask: "Did the test measure thinking?" (No, it measured line-of-sight).
      *   Ask: "If we didn't know about the leak, would we have been wrong to say B was human?" (Yes).
      *   **Connect to Turing:** Explain that Turing knew people would say "Machines can't have ESP." He replied: "If ESP exists, we need a telepathy-proof room."
      *   **Point:** The test assumes information only travels through the paper. If that assumption is wrong, the test is broken.

  *   **Phase 2: The Regress (5 mins)**
      *   Ask: "How do we prove the room is leak-proof?"
      *   Suggestion: "Check for wires."
      *   Counter: "What if the leak is telepathy? You can't check for wires."
      *   Suggestion: "Run a control test."
      *   Counter: "The control test uses the same room."
      *   **Point:** You cannot verify the conditions of the test *using* the test. You need outside assumptions.

  ### 0:55–1:00: Wrap Up
  *   Summarize: Turing wasn't necessarily saying he believed in psychics. He was saying **any test relies on physics we assume are true.**
  *   Hand out a printout (or write on board) of the specific paragraph from Turing's 1950 paper (Section 7, "The Argument from Extrasensory Perception").
  *   Dismiss.

  ## Predictable Failure Modes & Fixes

  **1. Someone Blabs the Secret Early**
  *   *Risk:* A club member knows B can see and giggles or hints during the game.
  *   *Fix:* Do not treat it as a ruinous event. Stop the game immediately. Say: "Interesting. The information leaked before the test concluded. This actually proves the point faster: the 'sealed room' was never sealed. Let's discuss why sealing a room is harder than it looks." Pivot straight to debrief.

  **2. Interrogator Guesses Wrong (Picks A as Human)**
  *   *Risk:* Interrogator thinks B is *too* perfect and declares B the machine.
  *   *Fix:* This is actually better for the discussion. Ask: "Why did you think B was a machine?" (Because they were too accurate). Reveal B cheated. Point: "You assumed accuracy = human. Then you assumed accuracy = machine. Your criteria shifted based on hidden variables. The test didn't stabilize."

  **3. The Leak Isn't Convincing**
  *   *Risk:* B doesn't use the visual info obviously enough.
  *   *Fix:* Instruct B beforehand: "You must reference something visual on the paper at least once. A typo, a smudge, the handwriting."

  ## What This Activity Cannot Reproduce (Be Honest Here)

  During the debrief, you must explicitly state these limitations so students don't walk away with the wrong idea:

  1.  **We Simulated Cheating, Not ESP:** In our game, the leak was physical (line-of-sight). Real ESP (if it existed) would leave no physical trace. Our game shows why *information leaks* break tests, but it doesn't show what a *telepathic* leak looks like, because we can't simulate that.
  2.  **Turing's Irony:** Turing was likely being somewhat ironic about ESP. He wasn't necessarily a believer. He was using a reductio ad absurdum. "If you believe in ESP, you must admit it breaks my test. So either ESP is false, or we need a new test." Don't let students think Turing was into crystal balls.
  3.  **The "Black Box" Problem:** In our game, we could open the box and see the leak. In reality (with AI or Brains), we can't always "open the box." We have to trust the environment. This is the philosophical crunch: **We never test intelligence in a vacuum; we test it in a world we assume we understand.**

  ## Discussion Questions to Drive the Point Home
  *   "If you can't trust the walls of the room, can you trust the test?"
  *   "What other assumptions are we making right now? (e.g., that we are all human, that time is passing normally, that language means the same thing to us)."
  *   "Turing says we need a 'telepathy-proof room.' Is it possible to prove a room is telepathy-proof without already knowing how telepathy works?" (This leads to the infinite regress).

  ## Facilitator Script for the "Deep Point"
  *Use this verbatim if the conversation stalls:*
  "Here's the thing. We think the Turing Test measures 'Thinking.' But today it measured 'Visibility.' Turing's point is that *every* test measures 'Thinking + Background Assumptions.' If the Background Assumptions (like 'no telepathy') are wrong, the result is garbage. So when we ask 'Can machines think?', we are actually asking 'Can machines think, assuming the laws of physics we know are true?' And that's a much weirder question."
