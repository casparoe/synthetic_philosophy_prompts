answer: |-
  **The Side-Effect Asymmetry: A Diagnostic Instrument**

  **I. The Phenomenon**
  When an agent pursues a primary goal and foreseeably brings about a secondary outcome, observers judge the intentionality of that secondary outcome differently depending on its moral valence. If the secondary outcome is harmful, observers typically classify it as intentional; if the secondary outcome is beneficial, observers typically classify it as unintentional, even when the agent's knowledge and attitude toward the outcome remain identical in both scenarios.

  **II. The Decision Tree**
  *Instructions:* Proceed through the nodes sequentially. Answer each question based on your theoretical commitment regarding what best explains the phenomenon described above. Do not select the answer you find most pleasant; select the answer required by your position.

  **Node 1: The Fundamental Distinction**
  Is the asymmetry described above a feature of the semantic content of the folk concept of intentional action (Concept), or is it an artifact of the psychological process used to apply that concept (Performance)?
  *   **A.** It is a feature of the concept itself. (Proceed to Node 2)
  *   **B.** It is an artifact of the judgment process. (Proceed to Node 6)

  **Node 2: The Neutral Case**
  (Concept Path) Consider a case where the side effect is morally neutral (e.g., changing the shade of a wall) and the agent is indifferent to it. Does the subject judge the side effect as brought about intentionally?
  *   **A.** Yes, indifference plus foresight suffices for intentionality regardless of valence. (Proceed to Node 3)
  *   **B.** No, without moral valence, the asymmetry disappears and intentionality is judged lower. (Proceed to Node 5)

  **Node 3: The Non-Human Agent**
  (Concept/Neutral=Yes) Consider a case where the agent is a robot or non-human animal programmed to maximize profit with identical indifference to the side effect. Does the asymmetry persist (harm = intentional, help = unintentional)?
  *   **A.** Yes, the asymmetry applies to any goal-directed system. (Proceed to Node 4)
  *   **B.** No, the asymmetry requires a moral agent capable of responsibility. (Go to Leaf: Agent-Relative Normativism)

  **Node 4: The Counterfactual Attitude Case (Invented)**
  (Concept/Non-Human=Yes) Consider a case where the agent explicitly states, "I wish this side effect would not occur," but proceeds for the primary goal. Do subjects still judge the harmful side effect as intentional?
  *   **A.** Yes, the outcome's valence overrides the expressed attitude. (Go to Leaf: Strong Normativism)
  *   **B.** No, the expressed negative attitude blocks the intentionality judgment. (Go to Leaf: Moderate Normativism)

  **Node 5: The Control Requirement**
  (Concept/Neutral=No) In cases where the agent foresees the side effect but lacks direct control over it (e.g., it is a byproduct of a complex machine), is the side effect judged intentional?
  *   **A.** No, intentionality requires a degree of control beyond mere foresight. (Go to Leaf: Control-Based View)
  *   **B.** Yes, foresight suffices, but the neutral case fails for other reasons. (Go to Leaf: Unoccupied/Incoherent)

  **Node 6: The Independent Blame Case**
  (Performance Path) Consider a case where the agent is independently blameworthy for an unrelated past action, but the current side effect is *good*. Do subjects judge the good side effect as intentional?
  *   **A.** Yes, general blameworthiness spills over to make good effects intentional. (Go to Leaf: Blame Distortion View)
  *   **B.** No, the asymmetry is specific to the current action's side effect. (Proceed to Node 7)

  **Node 7: The Alternative Verb Case**
  (Performance/Blame=No) If the question asks "Did he do it?" rather than "Did he do it intentionally?", does the asymmetry persist?
  *   **A.** Yes, the asymmetry is robust across verb choices. (Proceed to Node 8)
  *   **B.** No, the asymmetry disappears when "intentionally" is removed. (Proceed to Node 9)

  **Node 8: The Probability Sensitivity Case**
  (Performance/Verb=Yes) If the side effect is described as 50% probable rather than certain, does the asymmetry vanish?
  *   **A.** Yes, uncertainty eliminates the moral weighting of the outcome. (Go to Leaf: Probability Threshold View)
  *   **B.** No, the asymmetry persists even under uncertainty. (Proceed to Node 10)

  **Node 9: The Wording Sensitivity Case**
  (Performance/Verb=No) If the vignette explicitly states "He did not do it on purpose," does the subject still attribute intentionality based on harm?
  *   **A.** Yes, moral judgment overrides explicit textual denial. (Go to Leaf: Deflationary Responsibility View)
  *   **B.** No, the effect disappears with precise wording. (Go to Leaf: Wording Artifact View)

  **Node 10: The Deflationary Check**
  (Performance/Probability=No) Is the judgment actually about moral responsibility rather than action description?
  *   **A.** Yes, subjects are answering a responsibility question disguised as an action question. (Go to Leaf: Deflationary Responsibility View)
  *   **B.** No, it is about action, but mediated by conversation norms. (Proceed to Node 11)

  **Node 11: The Pragmatic Scope Case**
  (Performance/Deflationary=No) Is the effect limited to contexts of praise and blame, disappearing in purely descriptive contexts?
  *   **A.** Yes, it is a pragmatic implicature specific to normative contexts. (Go to Leaf: Pragmatic Implicature View)
  *   **B.** No, it extends to all action taxonomy. (Go to Leaf: Unoccupied/Incoherent)

  **Node 12: The Skill Inference Case**
  (Performance/Probability=No/Pragmatic=No) Does the judgment rely on an inference that the agent used skill to bring about the bad effect but luck for the good effect?
  *   **A.** Yes, subjects infer skill from harm. (Go to Leaf: Skill Inference View)
  *   **B.** No, skill is irrelevant. (Go to Leaf: Unoccupied/Incoherent)

  ***

  **III. Position Leaves**

  1.  **Strong Normativism**
      *   *Path:* 1A → 2A → 3A → 4A
      *   *Awkward Commitment:* The metaphysical status of an action changes based on its moral goodness or badness.

  2.  **Moderate Normativism**
      *   *Path:* 1A → 2A → 3A → 4B
      *   *Awkward Commitment:* Moral valence influences the concept, but not enough to override explicit counter-attitudes.

  3.  **Agent-Relative Normativism**
      *   *Path:* 1A → 2A → 3B
      *   *Awkward Commitment:* The concept of intentional action applies differently to humans than to other goal-directed systems.

  4.  **Control-Based View**
      *   *Path:* 1A → 2B → 5A
      *   *Awkward Commitment:* Foreseen side effects are never intentional unless the agent exercises direct control over them.

  5.  **Blame Distortion View**
      *   *Path:* 1B → 6A
      *   *Awkward Commitment:* The folk are systematically irrational, allowing moral emotion to distort factual judgments about mental states.

  6.  **Pragmatic Implicature View**
      *   *Path:* 1B → 6B → 7A → 11A
      *   *Awkward Commitment:* Philosophers have misinterpreted the folk's literal meaning by confusing it with conversational implication.

  7.  **Probability Threshold View**
      *   *Path:* 1B → 6B → 7A → 8A
      *   *Awkward Commitment:* Intentionality attribution collapses under uncertainty, regardless of moral stakes.

  8.  **Wording Artifact View**
      *   *Path:* 1B → 6B → 7B → 9B
      *   *Awkward Commitment:* The phenomenon is linguistically fragile and disappears with minor phrasing adjustments.

  9.  **Deflationary Responsibility View**
      *   *Path:* 1B → 6B → 7B → 9A (or 10A)
      *   *Awkward Commitment:* There is no asymmetry in action theory, only an asymmetry in how we assign blame.

  *(Note: The Skill Inference View and Unoccupied/Incoherent leaves are available via Nodes 12 and 5/11 but are omitted from this primary list to maintain focus on the major contested positions.)*

  ***

  **IV. Diagnostic Case Notes**

  *   **The Neutral Case (Node 2):** Tests whether morality is constitutive of the concept. If neutral side effects are intentional, the concept is likely non-normative. If unintentional, the concept may be normative.
  *   **The Non-Human Agent (Node 3):** Tests whether the asymmetry requires moral agency or merely goal-directed behavior.
  *   **The Independent Blame Case (Node 6):** Tests whether the effect is driven by a general desire to blame the agent (bias) or by the specific structure of the action.
  *   **The Alternative Verb Case (Node 7):** Tests whether the word "intentionally" triggers the effect or if the underlying judgment is broader.
  *   **The Counterfactual Attitude Case (Node 4 - Invented):** This case separates views that rely on the agent's indifference from views that rely on the outcome's valence. In the original vignette, indifference and harm are conflated. By having the agent express a wish against the harm, we test whether the moral badness alone drives the "intentional" judgment. If subjects still say "intentional" despite the agent's wish against it, it suggests the moral outcome overrides the mental state attitude.

  ***

  **V. Indistinguishable Leaves**

  **Flag:** The **Deflationary Responsibility View** (Leaf 9) and the **Blame Distortion View** (Leaf 5) may be empirically indistinguishable in certain contexts.
  **Reason:** Both positions predict that moral considerations drive the judgment. The Distortion View claims this is an error in processing the concept of action; the Deflationary View claims the subjects are not judging action at all, but responsibility. Since both predict the same behavioral output (affirming intentionality for bad side effects), separating them requires introspective data from subjects about what they think they are judging, which the tree's behavioral questions cannot fully resolve.

  ***

