      *   *Nuance on Q2:* Von Neumann showed self-reference *isn't* strictly necessary for replication (Universal Constructor + Copied Description). But Gödelian self-reference *is* necessary for *evolvability* (Pattee's argument). This distinction is vital. The group should tackle the "Replication vs. Evolution" distinction.
