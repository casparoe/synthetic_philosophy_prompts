      *   *Wait, let's look at "Tractability" again.* Q3 is notoriously hard (semantics). Q2 is formal (automata theory). For a 1-year group, starting with Q2 might yield more concrete results (models) to feed into Q3.
      *   *Alternative Order:* Q2 (Formal Models) -> Q3 (Semantic Interpretation of Models) -> Q1 (Status) -> Q5 -> Q4.
