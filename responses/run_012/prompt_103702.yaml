      *   *Nuance:* Funes's system (7013 = Maximo Perez) looks like a private ostensive definition. Wittgenstein attacks this in PI §258. Funes tries to name a private sensation/object. But without a public check, "Maximo Perez" for 7013 has no stability.
      *   *Key Insight:* Funes isn't just private; he's *atomized*. Wittgenstein's point is that meaning is holistic/contextual. Funes's meaning is atomic.
      *   *The "Overfit" analogy:* Make sure to emphasize that thinking *is* generalization. If you can't generalize, you can't think. This aligns with Wittgenstein's view that language is a tool for action, not a mirror of reality.

