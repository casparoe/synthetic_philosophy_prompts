          *   CI cannot express "Continuous Creation." CI assumes a static DGP or a specified time-varying one. Ghazālī's DGP is re-authorized at every instant.
          *   Is the original indeterminate? No, it's very determinate metaphysically, but indeterminable empirically.

  4.  **Drafting the Response (Iterative refinement):**

