answer: |-
  You have put your finger on one of the oldest and most difficult problems in legal philosophy, and your instinct to treat it as a structural puzzle rather than a mere technicality is exactly right. The phenomenon you are describing, often called unamendability or the basic structure doctrine, forces us to confront the question of where a legal system comes from and whether it can bind itself. To understand what the practice presupposes, we have to distinguish between two ways of imagining a constitution. The first is that a constitution is simply the highest set of rules within a system, like the rules of a club that the club members can change if they all agree. The second is that a constitution is an act of creation that brings the system into existence, distinct from the ordinary operations that happen inside it. When a court strikes down an amendment because it violates an entrenched clause, it is almost always relying on the second picture. It is presupposing a distinction between the constituent power, which is the authority that created the constitution, and the constituted power, which is the government operating under it. In this view, the legislature or parliament is a creature of the constitution, and a creature cannot destroy its creator. The entrenched clause is not just a rule; it is a marker of the boundary between the government and the people who authorized it. This suggests that the source of legal authority is indeed external to the ordinary legal system, residing in a political entity like the People or the Nation that stands behind the text.

  However, it is important to note that while this dualist explanation is the standard justification offered by judges, it is not the only way to reconstruct the theory, and legal theorists are divided on whether this external source is a metaphysical reality or a legal fiction. A strict legal positivist, following the tradition of H.L.A. Hart, might argue that you do not need to reach outside the system to explain this. In this view, the legal system contains a rule of recognition, which is a social rule that officials accept as the standard for what counts as law. If the rule of recognition in a particular country includes the premise that certain core provisions are unalterable, then they are unalterable as a matter of law, without needing to invoke a mystical constituent power. The system is simply programming itself with a limit. The trouble with this internal reconstruction is that it struggles to explain how that rule of recognition itself could ever change. If the officials decide to ignore the entrenchment and amend the core anyway, the positivist must admit that the law has changed, which makes the entrenchment look like a political fact rather than a legal constraint. So, while the practice can be reconstructed using the system's ordinary materials, it sits much more comfortably with the theory that there is a higher authority outside the system. The practice quietly rules out the picture of law as a purely self-contained logical loop where any rule can be revised by the procedures that created it. It also challenges the idea that sovereignty is indivisible, because it effectively splits sovereignty between the temporary majority in the legislature and the permanent will embodied in the constitutional core.

  On the question of coherence, you are asking whether a self-entrenching clause collapses into an ordinary rule or rests on a moral premise. This is genuinely contested territory. Some theorists argue that it is logically incoherent for a rule to bind its own revision, because if you have the power to make the rule, you must have the power to unmake it. On this view, the only thing stopping a legislature from amending an entrenched clause is political cost or the threat of revolution, not legal validity. Other theorists, however, argue that law is not just about power but about authority, and authority can be limited by its own terms. They would say the clause is coherent because it changes the conditions under which a legal act counts as valid. It is not that the legislature lacks the physical power to pass the amendment, but that the product of that act fails to achieve the status of law. Whether this rests on a moral premise depends on what you think the entrenched clauses protect. If they protect human dignity or democratic procedure, many theorists argue these are moral constraints that the legal system has incorporated. If they protect something arbitrary, like the name of the capital city, the claim to legal validity is much weaker. So the practice is underdetermined in the sense that both a moral theory of law and a sophisticated positivist theory can license the same institutional arrangement of a court striking down an amendment. The court does not need to tell you which theory it is using to reach the result, which is why you see the same outcome in countries with very different legal cultures.

  Now to the wrinkle that you noticed, which is perhaps the most insightful part of your observation. You are correct that courts often protect the text of the constitution while simultaneously reinterpreting the meaning of that text over time. This suggests that what is being conserved is not the semantic content of the words, but the identity of the constitutional order itself. When a court says an amendment violates the basic structure, it is usually claiming that the amendment would change the system into something else entirely, transforming a democracy into a dictatorship or a secular state into a theocracy. The text serves as a rhetorical focal point, a stable anchor that allows the court to claim it is being faithful to the original order even as it updates the understanding of what that order requires. If the practice conserves nothing but a rhetorical focal point, it follows that the courts are acting as guardians of the regime's identity rather than guardians of the text. This gives the courts a tremendous amount of power, because they get to decide when a change is a repair and when it is a replacement. It implies that the constitution is not a contract with fixed terms but a living tradition with a core essence that must be preserved. This is why the practice is so controversial; it allows judges to invalidate the work of elected representatives by appealing to an unwritten essence that only the judges seem to be able to perceive.

  If one were to give up this presupposed view and adopt a frankly procedural account where anything produced by the prescribed procedure is valid law, the way judgments are written would change drastically. Courts would no longer reason about the substantive content of amendments or whether they damage the basic structure. Instead, judicial review would be limited to checking whether the correct numbers voted, the correct notices were given, and the correct procedures were followed. The language of dignity, democracy, and secularism would disappear from amendment cases, replaced by the language of process and jurisdiction. The courts would become clerks of the amendment process rather than guardians of the constitutional soul. This would likely lead to more frequent constitutional changes, as political coalitions would know that if they could assemble the necessary majority, they could change anything, including the rules about how to change things. The risk, of course, is that a temporary majority could use the procedural machinery to dismantle the very system that allowed them to win, which is exactly the fear that entrenchment is designed to prevent.

  It is worth clarifying where the consensus lies and where the debate remains open. It is settled among scholars that many constitutions contain these clauses and that courts in several jurisdictions enforce them. It is also settled that this creates a tension between democracy and constitutionalism. What is not settled is whether this enforcement is legally justified or merely a political power grab by the judiciary. Some theorists accept the basic structure doctrine as a necessary feature of modern constitutionalism that prevents democratic suicide. Others view it as an illegitimate usurpation of the constituent power by the judges. There is also no agreement on whether the entrenchment applies to the constitution as a whole or only to specific clauses. In some systems, the courts have implied that the entire constitution has an unamendable core, while in others, only the explicit clauses are protected. This underdetermination means that the same practice can support very different theories of authority. A judge in India, a judge in Germany, and a judge in Israel might all strike down an amendment using similar language, but one might be relying on a theory of popular sovereignty, another on a theory of objective values, and another on a theory of institutional competence.

  Ultimately, the practice you are reporting on presupposes that a legal system is more than just a set of procedures; it is a project with a purpose. The self-entrenching clause is the legal system's way of declaring that there are some things it is not willing to become, even if the proper procedures are followed. Whether that declaration is legally binding or politically binding is the question that theorists continue to fight over. For your purposes, the key takeaway is that when a court invokes these clauses, it is stepping outside the normal chain of legal validity and appealing to a higher source of authority, whether that source is the People, History, or Reason. This makes the court a political actor in a philosophical sense, because it is deciding what the state is allowed to be. If you treat the constitution as a parlor game, the players have agreed that certain moves are off-limits, and the umpire has the power to say when a move changes the nature of the game itself. The puzzle you have identified is that the umpire is also a player, and the rules about who the umpire is are also part of the game. The practice works only as long as everyone agrees to pretend that the umpire is standing outside the board, even though we all know they are sitting at the table.
