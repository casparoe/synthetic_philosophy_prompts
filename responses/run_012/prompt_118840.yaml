answer: |-
  This is a fantastic project topic. Your advisor is absolutely right: in axiomatic bargaining theory, the "solution" you get is entirely determined by the "requirements" (axioms) you decide are non-negotiable. There is no single "correct" rule; there are only rules that satisfy different sets of principles.

  Here is the breakdown of your list, the conflict between the two famous rules, and the impossibility result you can hang your project on.

  ### Part 1: Evaluating Your List
  I have translated your bullets into their formal mathematical names. I've categorized them as **Core Requirements** (almost everyone agrees on these) or **Camp Preferences** (this is where the fight is).

  **1. The Fallback (Individual Rationality)**
  *   **Verdict:** **Core Requirement.**
  *   **Why:** If a rule gives you less than your fallback (disagreement point), you would simply walk away and take the fallback instead. A solution that isn't individually rational isn't a voluntary agreement; it's coercion.
  *   **Concrete Failure:** If the fallback is \$0 and the rule says you get -\$5, you reject the deal. The rule fails to describe a real agreement.

  **2. No Waste (Pareto Efficiency)**
  *   **Verdict:** **Core Requirement.**
  *   **Why:** If there is a deal that makes you better off without hurting your sister, and you don't pick it, you are leaving value on the table. Rational agents shouldn't do that.
  *   **Concrete Failure:** Imagine you split a cake, but some crumbs fall on the floor and nobody eats them. That's inefficient. A rule that picks an interior point (inside the blob) instead of a boundary point (edge of the blob) fails this.

  **3. Symmetry (Symmetry)**
  *   **Verdict:** **Core Requirement (for Fairness).**
  *   **Why:** If you and your sister have the exact same fallback and the exact same set of possible deals, a "fair" rule shouldn't favor one of you just because you are "Player 1."
  *   **Concrete Failure:** If the blob is a perfect circle centered on the fallback, and the rule gives you 60% and her 40% despite identical situations, the rule is biased.

  **4. Dollars vs. Cents (Scale Invariance)**
  *   **Verdict:** **Core Requirement (Technical).**
  *   **Why:** In utility theory, measuring happiness in "utils" vs. "2 \times utils" shouldn't change the real outcome. The rule should depend on the *preferences*, not the *units* used to write them down.
  *   **Concrete Failure:** If you measure your happiness in dollars and the rule gives you \$50, but if you measure in cents (100 \times scale) the rule suddenly gives you a different physical split of the cake, the rule is broken. It's measuring the ruler, not the cake.

  **5. Better Options $\neq$ Less Pay (Individual Monotonicity)**
  *   **Verdict:** **Camp Preference (Kalai–Smorodinsky Camp).**
  *   **Why:** This is the intuition that "if the pie gets bigger on my side, my slice shouldn't shrink." It feels morally obvious, but mathematically it clashes with Consistency (Bullet 6).
  *   **Concrete Failure:** Imagine you can currently get at most \$100. A new deal opens up where you *could* get \$200, but your sister's options don't change. If the rule now gives you *less* than before (or even exactly the same, when you expected more), it violates the spirit of bargaining power.
  *   **Note:** You mentioned your advisor said not every rule passes this. That is correct. The Nash solution often fails this.

  **6. Ignore Unpickable Deals (Independence of Irrelevant Alternatives - IIA)**
  *   **Verdict:** **Camp Preference (Nash Camp).**
  *   **Why:** This says the deal we strike should depend only on the deals near the agreement, not on "dream deals" that are impossible to reach. It ensures consistency.
  *   **Concrete Failure:** Imagine we agree on splitting a pizza 50/50. Then I say, "Hey, theoretically we *could* have eaten the whole table, but we can't." If mentioning that impossible table deal changes our pizza split from 50/50 to 60/40, the rule is unstable.
  *   **Note:** This is the axiom Nash famously used. K-S rejects it.

  **7. Three or More People (n-Person Generalizability)**
  *   **Verdict:** **Robustness Check (Not a strict requirement for 2-person rules).**
  *   **Why:** A rule can be perfectly valid for two people but break down with three. However, a "good" theory should ideally scale.
  *   **Concrete Failure:** A rule works for you and your sister, but when your brother joins, the rule produces no solution or multiple contradictory solutions.

  ---

  ### Part 2: The "Killer" Bullet & The Impossibility Result

  You asked which single bullet rules out the most rules. The answer is actually a **pair of bullets that cannot coexist.**

  **The Conflict:** You cannot have a rule that satisfies **Bullet 5 (Monotonicity)** AND **Bullet 6 (IIA)** at the same time (assuming you also want the Core Requirements 1–4).

  **The Impossibility Theorem:**
  There is **no** bargaining solution that satisfies Individual Rationality, Pareto Efficiency, Symmetry, Scale Invariance, **AND** both Monotonicity **AND** IIA.

  *   If you demand **IIA** (Bullet 6), the *only* rule that works is the **Nash Bargaining Solution** (the product rule). But Nash **fails** Monotonicity.
  *   If you demand **Monotonicity** (Bullet 5), the *only* rule that works is the **Kalai–Smorodinsky Solution** (the percentage rule). But K-S **fails** IIA.

  **This is the result of your project:** Fair division isn't about finding the "true" rule. It's about deciding which axiom you are willing to sacrifice. Do you value **Consistency** (Nash/IIA) or **Fairness in Opportunity** (K-S/Monotonicity)?

  ---

  ### Part 3: Scorecard (Nash vs. Kalai–Smorodinsky)

  Here is how your two contenders stack up against your list.

  | Axiom (Your Bullet) | Nash (Product Rule) | Kalai–Smorodinsky (Percentage Rule) |
  | :--- | :--- | :--- |
  | **1. Fallback (IR)** | **PASS** | **PASS** |
  | **2. No Waste (PE)** | **PASS** | **PASS** |
  | **3. Symmetry** | **PASS** | **PASS** |
  | **4. Scale Invariance** | **PASS** | **PASS** |
  | **5. Better Options (Monotonicity)** | **FAIL** | **PASS** |
  | **6. Ignore Unpickable (IIA)** | **PASS** | **FAIL** |
  | **7. 3+ People** | **PASS** (Generalizes easily) | **PASS** (Generalizes, but more complex) |

  **Why Nash Fails Monotonicity (Bullet 5):**
  Imagine the set of deals is a triangle. Nash picks the point where a hyperbola touches the edge. If you expand the triangle on *your* side (giving you better potential options) but don't change the edge near the current solution, the hyperbola still touches the same spot. Nash says "The deal stays the same." You gained leverage, but the rule didn't reward you. K-S, however, draws a line to your new maximum and moves the solution toward you.

  **Why K-S Fails IIA (Bullet 6):**
  K-S depends on the "Ideal Point" (the best possible deal for each person). If you add a crazy, impossible deal to the list that extends your Ideal Point further out, K-S changes the slope of the line and changes the agreement—even if that crazy deal was never going to be picked. Nash ignores that crazy deal completely.

  ---

  ### Part 4: Confidence Levels

  I am assessing my confidence in these claims so you know where to double-check before your presentation.

  *   **Axiom Definitions & Conflicts (High Confidence):** The definitions of IR, PE, Symmetry, SI, IIA, and Monotonicity are standard textbook game theory. The conflict between Nash and K-S on these axioms is the foundational result of the field (Nash 1950, Kalai & Smorodinsky 1975).
  *   **Impossibility of IIA + Monotonicity (High Confidence):** It is a proven theorem that no solution satisfies the standard 4 axioms plus both IIA and Monotonicity. This is the safest "big result" for your project.
  *   **Nash Generalization to n-person (High Confidence):** The Nash product $\prod (u_i - d_i)$ generalizes very naturally to $n$ people.
  *   **K-S Generalization to n-person (Medium Confidence):** *This is my least certain claim.* While K-S generalizes to $n$ people, there isn't just one "n-person K-S rule." There are variations on how to handle the "ideal point" intersection in higher dimensions (e.g., the line might not hit the Pareto frontier exactly in the same way). Most textbooks focus on the 2-person case.
      *   **Advice:** In your presentation, emphasize the 2-person case as your main result. Mention the 3-person case as "an area of ongoing research" or "more complex," rather than making a definitive claim that it works exactly the same way.

  ### Summary for your Presentation
  1.  **Start with the Axioms:** Tell the club that before picking a rule, we must pick our values.
  2.  **The Divide:** Explain that everyone agrees on Fallback, Efficiency, Symmetry, and Scale.
  3.  **The Clash:** The fight is between **IIA** (Nash) and **Monotonicity** (K-S).
  4.  **The Verdict:** There is no perfect rule. Nash is more "consistent" (ignores irrelevant options), but K-S is more "fair" (rewards better options).
  5.  **Your Defense:** If you defend K-S, argue that **Monotonicity** is more important for fairness than IIA. If the set of possibilities grows in my favor, I should benefit. Ignoring that (as Nash does) feels like ignoring bargaining power.

  Good luck. This is solid math club material.
