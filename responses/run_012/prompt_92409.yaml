          4.  Reference Class / Principle of Indifference Attack (The Seminar Context).
          5.  Radical Skepticism (The "False" or "Conditional" extreme).

      *   *Re-evaluating the "False" category:* I should include a reading that is commonly implied but technically incorrect. E.g., "Absence of evidence is *never* evidence of absence." This is false because if I search everywhere and find nothing, that *is* evidence of absence. The slogan is often used universally, which makes the universal claim false.

