          *   Classification: Trivially True.
          *   Relevance to dispute: Weak. It stops you from saying Prob(H)=0, but doesn't stop you from saying Prob(H)=0.5.

      *   *Reading 2: The Bayesian Likelihood One.*
          *   Idea: Failing to find evidence only lowers probability if you expected to find it.
          *   Formulation: $P(\text{No Evidence} | H) \neq P(\text{No Evidence} | \neg H)$ is required for "No Evidence" to shift belief. If search is shallow, likelihoods are equal, so posterior = prior.
          *   Classification: Substantive and Defensible (standard Bayes).
          *   Relevance to dispute: Doesn't help the colleague. It says stick to the *prior*, but if the prior is 0.5 (Indifference), this supports the *opponent*, not the colleague.

      *   *Reading 3: The Epistemic/Justification One (The "Weight" of Evidence).*
          *   Idea: Keynes/Carnap distinction. Probability vs. Weight of evidence.
          *   Formulation: The *justification* for assigning a precise probability depends on the amount of evidence, not just the balance. No evidence = low weight = wide interval.
          *   Classification: Defensible under a condition (accepting imprecise probability frameworks).
          *   Relevance to dispute: Strongly supports the colleague. Distinguishes $P(H)$ from confidence in $P(H)$.

      *   *Reading 4: The Deep Uncertainty/Model Ambiguity One.*
          *   Idea: We don't even know the reference class.
          *   Formulation: Without data, we cannot define the sample space or likelihood function uniquely. Therefore, a single probability distribution is ill-defined.
          *   Classification: Substantive and Defensible (in deep uncertainty contexts).
          *   Relevance to dispute: Supports the colleague. Attacks the applicability of the math, not just the value.

      *   *Reading 5: The Pragmatic/Decision-Theoretic One.*
          *   Idea: Acting on a precise number when ignorant is dangerous (maximin vs. expected utility).
          *   Formulation: Decision rules requiring precise probabilities are inadmissible under total ignorance.
          *   Classification: Defensible under a condition (adoption of robust decision criteria).
          *   Relevance to dispute: Supports the colleague's practical conclusion, though changes the subject from belief to action.

      *   *Reading 6: The Radical Skeptical One.*
          *   Idea: No evidence means we know nothing, so probability is meaningless.
          *   Formulation: If evidence is absent, probability assignments are cognitive illusions.
          *   Classification: False (or at least too strong for standard decision theory).
