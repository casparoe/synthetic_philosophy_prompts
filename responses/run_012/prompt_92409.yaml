      *   *Epistemic interpretation:* Lack of data doesn't justify high confidence in negation.
      *   *Imprecise Probability interpretation:* Lack of data justifies wide intervals, not point estimates.

  3.  **Drafting the Menu (Iterative Process):**

      *   *Reading 1: The Logical/Trivial One.*
