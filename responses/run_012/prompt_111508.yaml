      *   *Correction:* Ensure the distinction between "assumptions are false" and "assumptions are irrelevant" is clear. Friedman argues they are *not* the target of testing, not that their truth value is metaphysically impossible.
      *   *Correction:* The "map" analogy is actually in the essay ("A theory is to be judged by the accuracy of the predictions... not by the realism of its assumptions... it is a filing system... a map"). So I should acknowledge the gloss is faithful there, but the *inference* drawn in the final sentence is the problem.
      *   *Correction:* On the "F-Twist": Attribute it correctly. It's often associated with McCloskey, but the logical point is older (Samuelson, etc.). I'll describe the logical error without getting bogged down in bibliographic pedantry.
