          6.  **Constraints:** Keep exegesis (what Friedman said) and philosophy (what is true/defensible) separate. Be plain about reconstruction vs. reporting. Do *not* say "go read the essay."

  2.  **Deconstruct the Provided Gloss (Claim-by-Claim Analysis):**

      *   *Claim 1:* "Friedman settled all of this in his 1953 essay..."
          *   *Status:* Contested/Overstated.
          *   *Analysis:* Friedman's essay is seminal, but hardly "settled" anything. It ignited 70 years of debate.
      *   *Claim 2:* "...the realism of a theory's assumptions is simply irrelevant to how good the theory is, and the only test that matters is whether the theory generates accurate predictions."
          *   *Status:* Standard simplification (with caveats).
          *   *Analysis:* This is the core "Instrumentalist" reading. Friedman *does* say assumptions need not be realistic, but "irrelevant" is too strong. He says they shouldn't be tested *directly*, but they matter for the theory's scope. Prediction is primary, but not the *only* thing (simplicity matters too).
      *   *Claim 3:* "Hence his notorious dictum that the more significant the theory, the more unrealistic the assumptions..."
          *   *Status:* Contested/Ambiguous.
          *   *Analysis:* Friedman does say significant theories have "assumptions that are wildly descriptive of reality." But "more unrealistic = better" is a caricature (the "F-twist"). He means abstraction is necessary for generality, not that falsehood is a virtue in itself.
      *   *Claim 4:* "His own illustration is the expert billiard player..."
          *   *Status:* Accurate reporting.
          *   *Analysis:* This is indeed Friedman's example.
      *   *Claim 5:* "Firms are the same. No manager literally equates marginal revenue with marginal cost, but the hypothesis of profit maximization still yields the right comparative statics..."
          *   *Status:* Accurate reporting of Friedman's view.
          *   *Analysis:* This is the application of the billiard analogy to the firm.
      *   *Claim 6:* "For Friedman a theory is a tool rather than a body of claims about the world, so its assumptions are not even the sort of thing that could be true or false."
          *   *Status:* Contested/Philosophical Reconstruction.
          *   *Analysis:* This is the "Instrumentalist" interpretation (Boland, etc.). Friedman leans this way, but some argue he was a "realist" about the *theory* even if not the assumptions. This is where the "F-twist" accusation usually lands.
      *   *Claim 7:* "Critics have grumbled... it asks assumptions to be descriptive, which is to demand a photograph where what we want is a map."
          *   *Status:* Standard simplification/Metaphor.
          *   *Analysis:* Friedman uses the map analogy. It's a fair representation of his rhetoric, though "photograph vs. map" is a bit more Hausman/philosopher gloss than direct Friedman quote (he uses "map" in the context of theory).
      *   *Claim 8:* "So when a colleague objects that a model assumes perfect information... the correct reply is that this is exactly what a good model does — the more idealized the assumptions, the more general the theory, and the less need we feel to test the assumptions themselves."
          *   *Status:* Simply Wrong / Dangerous Overextension.
          *   *Analysis:* This is the "practical moral" the user suspects. Friedman does *not* say you never test assumptions or that idealization *always* equals generality. He says don't test assumptions *instead* of predictions. But if assumptions limit the *domain of validity*, they matter.

  3.  **Address the "F-Twist":**
