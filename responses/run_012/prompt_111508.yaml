      *   *Constraint Check:* Did I tell them to read the essay? No. Did I separate exegesis from philosophy? I need to make sure I explicitly label when I'm talking about what Friedman *meant* vs. what is *methodologically sound*.

  8.  **Refining the Content (Self-Correction during drafting):**
