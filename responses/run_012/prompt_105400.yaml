          *   Sophisticated: Anticipates change. Declines the first trade to avoid the trap.
          *   Resolute: Commits to the plan despite future preferences.
      *   *The Objection:* If a rational agent is defined as one who *won't* get pumped (by being sophisticated/resolute), then the money pump argument is trivial. It says "Irrational agents get pumped." It doesn't prove "Agents *ought* to have transitive preferences."
      *   *McClennen's Critique:* Resolute choice requires a theory of rationality that allows sticking to a plan even when it's no longer optimal by current lights. This challenges the standard decision theory the pump usually supports.
      *   *Concession:* Defenders often concede the pump targets *naivety* or *lack of planning capacity*, not necessarily the preference structure itself.
      *   *Ranking:* High exposure (Undermines the normative force).

