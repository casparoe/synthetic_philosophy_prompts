          2.  Exposure Map (Ranked).
          3.  Deep Dive 1: Changing Taste (The Over-generation Problem).
          4.  Deep Dive 2: Escape Routes (The Sophistication Problem).
          5.  Deep Dive 3: Collapse (The Strategy Reduction).
          6.  Predictions & Falsifiability.
          7.  The "Paragon" Test (Crucial constraint).
          8.  Final Verdict.

      *   *Refining the "Changing Taste" case:* Need to ensure it's not just cyclic preferences. It must be *time-dependent* preferences that are locally consistent.
          *   *Example:* The "Self-Torturer" (Quinn) or Hyperbolic Discounting.
          *   *Analysis:* If I prefer $A$ to $B$ now, and $B$ to $A$ later, am I irrational? The pump says yes (if it leads to loss). But if the change is due to new information or legitimate valuation shift, the pump misfires.
          *   *Key Distinction:* Endogenous cycles vs. Exogenous shifts.

