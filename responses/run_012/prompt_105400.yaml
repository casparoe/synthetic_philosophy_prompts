      *   *Awkward:* The Collapse. If diachronic rationality is just synchronic choice over plans, the "diachronic" label is marketing.

  7.  **Address Predictions and Falsifiability:**

      *   *Prediction:* Agents with cyclic preferences *will* lose money in dynamic settings *unless* they adopt resolute choice or binding.
