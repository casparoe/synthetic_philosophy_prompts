  3.  **Address Focus Area 1: The Changing-Taste Pump (Dynamic Inconsistency):**

      *   *Scenario:* Hyperbolic discounting or preference reversal.
      *   *Case:* I prefer Health ($H$) over Pleasure ($P$) today for tomorrow. But when tomorrow comes, I prefer $P$ over $H$.
      *   *Pump:* Pay a small fee to lock in $H$ today. Tomorrow, pay a small fee to switch to $P$. Net result: $P$ minus fees vs. $H$. Or, more classically: Pay to delay gratification, then pay to indulge.
      *   *Synchronic Status:* At $t_1$, preferences are transitive. At $t_2$, preferences are transitive.
      *   *Diachronic Status:* Exploitable.
      *   *The Crux:* Is changing taste *irrational*? Most philosophers (e.g., Parfit, Bratman) say preference change itself isn't irrational, but failing to manage it might be.
      *   *Over-generation:* If *any* predictable preference change leads to a "pump" (loss relative to a counterfactual plan), does the pump argument condemn all growth/change?
