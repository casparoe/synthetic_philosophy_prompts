  9.  **Final Polish:** Check the 1742 vs 1752 date again. *Essays, Moral and Political* (1742). *Political Discourses* (1752). The economic essays (*Of Money, Of Interest, Of Balance of Trade*) are in *Political Discourses*. Ines is definitely wrong on the date. This is a great hook for the protagonist to catch her out.

