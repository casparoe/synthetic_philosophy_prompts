  8.  **Self-Correction on the "Ideal Bank" point:** Hume's point about the bank locking up coins is often misread. He says if all money were locked up, we'd just use credit, and prices would adjust. He uses it to prove money is nothing but a representational tool. However, he acknowledges the *shock* of changing the money supply matters. Marcus's interpretation that this means "manufactured money is close to worthless" is a bit strong but directionally okay regarding Hume's skepticism of paper credit inflation. I need to be precise here so the user doesn't put wrong info in the book.
