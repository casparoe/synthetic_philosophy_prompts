      *   *Ines (1742 Volume):* **Clearly Mistaken.** It's *Political Discourses* (1752). This is a crucial factual error for the novel's timeline (1750s). If she's reading it in the 1750s, 1752 is possible, 1742 is not for this essay.
      *   *Marcus (Long Run vs. Path/Lag):* **Clearly Right.** This is the standard charitable reading (short-run non-neutrality).
