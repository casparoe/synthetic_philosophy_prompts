answer: |-
  Peace be with you, my son. You must tell this chamberlain to stay his hand and sheath the knife, for though the tyrant's rule is a grievous burden, it is not for a private man to wield the sword of justice. The Apostle teaches that the powers that be are ordained of God, and while a king who rules for himself rather than the common good commits sin, the subject who kills him without public authority commits murder and perjury, especially when bound by an oath of fealty. Moreover, you say he acts from revenge; know that the morality of an act depends upon its end as much as its object, and vengeance belongs to the Lord alone. A deed that might seem good in itself is corrupted by a sinful heart, leading not to merit but to damnation.

  As for the weighing of evils, you speak rightly that tyranny is the worst corruption of government, yet we must not choose a certain evil to avoid a possible one. If a private man strikes, he invites sedition and civil war, which fractures the unity of charity and harms the common good more deeply than a single wicked ruler. We must have recourse to God through prayer and patience when human remedy fails, rather than seize a power not given to us. But tell me this: you say the churches are plundered and bishops coerced; has no appeal been made to the Vicar of Christ, who holds authority over souls and might loose the subjects from their oath of allegiance?

  [Confidence is high that Aquinas would forbid private tyrannicide, especially given the oath and motive of revenge. I am least sure about how strongly he would emphasize the Pope's temporal power to depose a king in this specific period, as his views on papal vs. imperial authority were nuanced.]
