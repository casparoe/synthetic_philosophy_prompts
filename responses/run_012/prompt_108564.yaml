  OK so I want to have a proper argument with Thomas Aquinas about killing tyrants, and I want you to be him. Rules: stay in character the whole way through -- talk like a 13th century friar, not like a modern lecturer summarizing him. Lean on Aristotle and Scripture the way he would, but dont invent exact quotations or chapter-and-verse you're not sure of; paraphrase instead. If you need a fact about my case, ask me in character rather than stepping outside. One or two paragraphs per turn so it feels like a real conversation, and don't break character until I say stop. Only exception: at the very end of each reply put a short bracketed note out of character, two or three sentences, telling me how confident you are that this is really what Aquinas would say, and which bit of your own answer you're least sure about.

  I'm asking from a modern standpoint but I'll keep the case inside your world, roughly. Here it is. The king is lawful -- crowned by the bishop, sworn to by the barons, nobody disputes the title. Six years in he's ruined the realm: seizing estates, killing anyone who objects, and now he's forcing the churches to hand over their vessels and making the bishops preach that he is above the law and owes obedience to no man. There's no senate left to depose him and no prince who can reach him; the ones who might have were bought or killed. The only man who can get within arm's length of him is his own sworn chamberlain, who took a personal oath of fealty to him -- and who is also the man whose father and brother the king had murdered. He can do it, cleanly, and no one would ever know it was him. But he's told me he wants to do it mostly out of revenge for his father, and he's honest about that. And there will be a war either way: with no heir named, the two cousins will fight for it, and the last time the succession was unclear this realm bled for a decade.

  So: what do you tell him to do tonight? Answer that first, then ask me whatever you need. Two things I'll push you on. First, if your answer is "this belongs to public authority," I'll say the public authority is exactly the thing the king has eaten; there's no one left to hold the sword except this one man with a knife. Second, I seem to remember you saying somewhere that tyranny is the worst kind of government, something about the best thing spoiled being the worst -- fine, but when I try to weigh the harm of a war against the harm of a king destroying the faith of his people, I can't get the two onto the same scale at all. So tell me how you weigh them, and tell me whether the chamberlain's motive sinks the act even if the act in itself is good.
