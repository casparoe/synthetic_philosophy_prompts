  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Task:** Argue for a specific position on a puzzle about social norms/conventions.
      *   **The Puzzle:** Everyday conventions (escalators, queues, tipping, jaywalking) are enforced with moral vocabulary (blame, resentment), yet they vary wildly by location. This suggests they might just be local preferences, not moral obligations, implying visitors have no duty to follow them.
      *   **The Position:** Argue *against* the conclusion that they are *all* just preferences, but only *halfway*.
          *   Claim 1: Some conventions *are* genuine moral obligations.
          *   Claim 2: This class is smaller than locals think.
          *   Claim 3: A visitor's obligations are narrower than a resident's.
      *   **The Framework:** Use the distinction between *Structural Conventions* (conformity makes the practice possible; nonconformity defeats the practice/expropriates resources) and *Expressive Conventions* (practice survives defection; function is membership/regard).
      *   **The Argument:**
          *   Structural conventions generate genuine obligations for everyone (visitor/resident).
          *   The ground is *not* locality (rejecting "When in Rome" as the foundational reason).
          *   Expressive conventions generate only obligations of courtesy (owed to specific engaged individuals, not the community).
      *   **Hard Cases/Objections:**
          *   Collision: Repugnant expressive convention? Excluded from structural convention?
          *   Objection: Is Structural/Expressive just Harm/Taste in disguise?
      *   **Format:** Continuous argument, clear thesis up front, anticipate replies within the flow (no mechanical "Objection/Reply" lists).

  2.  **Deconstruct the Thesis:**
      *   *Thesis:* While many social norms are merely local preferences, structural conventions constitute genuine moral obligations binding on all agents regardless of origin, whereas expressive conventions bind only through specific interpersonal engagement. The "When in Rome" maxim is misleading because it attributes obligation to locality rather than the functional necessity of the norm.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** State the puzzle. Introduce the temptation (moral relativism about norms). State the thesis clearly using the Structural/Expressive distinction.
      *   **Defining the Distinction:** Elaborate on Structural vs. Expressive.
          *   Structural: Coordination problems, scarce resources, safety. Defection = harm/failure of the system. (Queues, traffic sides).
          *   Expressive: Signaling, respect, membership. Defection = rudeness, but system survives. (Tipping, greetings).
      *   **The Moral Ground of Structural Conventions:** Why are they moral? Because they prevent harm and ensure fairness. It's not about "being local," it's about not breaking the cooperative scheme.
          *   *Anticipating Reply:* Isn't this just "harm"? Address the objection that this distinction is just Harm vs. Taste. Argue that "harm" is too blunt; structural conventions create *systemic* vulnerability that individual harm doesn't capture. It's about the *practice* itself being a public good.
      *   **The Visitor's Status:** Why does the visitor have the same duty here? Because they benefit from the structure (using the road, the queue).
          *   *Nuance:* The "When in Rome" critique. It's not because it's Rome; it's because the bridge holds weight only if everyone walks evenly.
      *   **Expressive Conventions & Courtesy:** Why are these different? They don't sustain a system. They signal regard.
          *   *Visitor's Duty:* Only to those they engage. If I don't tip, I hurt the waiter *if* I ate there. If I don't shake hands, I insult the person *I met*. I don't insult "The Nation."
          *   *Limit:* Locals often over-enforce these as moral duties. They are mistaken.
      *   **Hard Cases (Collisions & Exclusion):**
          *   *Repugnant Expressive:* If a greeting is sexist/racist. Visitor is excused. Courtesy doesn't demand self-abasement.
          *   *Excluded from Structural:* If a group is barred from the queue or road. Does the obligation hold? If the system is rigged, the duty to cooperate dissolves (fairness condition).
          *   *Self-Exclusion:* If I choose not to use the road, do I need to follow traffic laws? Yes, if my presence creates risk, but if I'm truly off-grid, maybe not. But usually, we are embedded.
      *   **Refining the Harm/Taste Objection:** Return to the charge that Structural/Expressive is just Harm/Taste.
          *   *Counter:* Harm is individual. Structural is *constitutive*. Tipping (Expressive) can cause harm (waiter loses income), but the *practice* doesn't collapse if one person skips. Driving on the left (Structural) crashes the system if one person defects. The moral weight comes from the *fragility of the coordination*, not just the outcome.
      *   **Conclusion:** Summarize. Reiterate the limited scope of moral obligation in norms.

  4.  **Refining the Tone:**
      *   Needs to be philosophical but accessible.
      *   Argumentative spine needs to be visible.
      *   Avoid "On the one hand/On the other hand." Use transitional phrases to weave objections into the narrative.
      *   Ensure the "Halfway" nature is clear: Don't say *all* norms are moral, don't say *no* norms are moral.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "When in Rome" slogan specifically? *Adjustment:* Make sure to explicitly say why "When in Rome" is the wrong *reason* even if it gives the right *advice* for structural norms.
      *   *Check:* Did I handle the visitor vs. resident distinction? *Adjustment:* Emphasize that for structural, they are equal. For expressive, the visitor has less obligation (only to engaged parties).
      *   *Check:* The "Harm vs. Taste" objection. *Adjustment:* This needs to be the climax of the argument. Make sure to distinguish *constitutive harm* (breaking the system) from *contingent harm* (someone loses money).
      *   *Check:* Hard cases. *Adjustment:* Ensure the exclusion point lands hard. If the structure is unjust, the obligation to uphold it is weakened.

  6.  **Final Polish:** Check flow, clarity, and ensure the thesis is prominent in the first paragraph. (The resulting essay should follow this structure closely.)

  *(Self-Correction Note during drafting)*: I need to be careful not to make Structural conventions sound *too* rigid. What if the structural convention is inefficient? The argument relies on the convention *actually* solving the coordination problem. I should briefly acknowledge that the convention must be *functional* to bind.

  *(Refining the "Visitor" aspect)*: The prompt says "visitor's obligations are narrower." This applies mostly to expressive. For structural, they are the same. I need to make sure I don't confuse this. The "narrower" part refers to the *overall class* of obligations a visitor has, because they are exempt from the expressive ones unless they engage.

  *(Final check on the "Halfway" constraint)*: I must grant that the class of moral obligations is smaller than locals suppose. Locals treat tipping (expressive) as moral. I must argue it is not (or is lesser).

  Okay, ready to write.
answer: |-
  The temptation to dismiss social conventions as mere local preferences, dressed up in the pomp of moral vocabulary but lacking moral substance, is strong. When a norm varies by latitude—when standing on the right of the escalator is a duty in London but a hindrance in New York—it seems absurd to claim that morality itself shifts with the geography. The skeptical conclusion follows naturally: these are not moral obligations but tribal signals, and a visitor, being of no tribe, is under no duty to observe them. I argue that this conclusion is too sweeping, though it contains a kernel of truth. The correct view lies halfway between moral absolutism and normative nihilism. My thesis is this: everyday conventions divide into two distinct classes, structural and expressive. Structural conventions, which coordinate behavior to prevent harm or resource exhaustion, generate genuine moral obligations binding on visitors and residents alike, grounded not in locality but in the necessity of cooperative fairness. Expressive conventions, which signal regard or membership, generate at most obligations of courtesy owed only to specific interlocutors, not the community. Consequently, the popular maxim "When in Rome" is misleading; it suggests obligation flows from sovereignty, when in fact, for the conventions that truly matter, obligation flows from participation in a shared vulnerability.

  To see why this distinction matters, we must first rigorously separate the structural from the expressive. A convention is structural when conformity is what makes the practice possible at all. Consider the queue. The point of queuing is to distribute a scarce resource (a bus seat, a ticket counter) fairly and efficiently among many people. If one person defects and crowds the door, they do not merely offend; they expropriate the time and opportunity of others and risk collapsing the order into a scramble where the strongest win. Similarly, driving on the designated side of the road is structural; the specific side matters less than the universal adherence to it. Nonconformity here is not a difference of taste; it is a physical threat. By contrast, an expressive convention survives the defection of any single person without the practice itself failing. Tipping is the paradigmatic case. If one diner leaves no tip in a culture where tipping is standard, the restaurant does not close, the service mechanism does not jam, and other diners are not physically endangered. The function of the tip is to mark mutual regard, economic gratitude, or membership in a class of "knowing" patrons. When a visitor fails to tip, they may signal ignorance or stinginess, but they do not break the system.

  It is regarding structural conventions that the skeptic is wrong to claim a visitor has no obligation. The obligation to queue or to drive on the correct side is not owed to the "nation" or the "local culture," but to the other individuals caught in the same coordination problem. This is why the "When in Rome" slogan misdescribes its own foundation. It implies that I should drive on the left in London because London says so, as if sovereignty creates morality. But the moral force comes from the fact that by driving on the right, I actively endanger others who are relying on my predictability to navigate a shared hazard. The visitor is bound by structural conventions not because they are a guest, but because they are an agent operating within a cooperative scheme from which they intend to benefit. If I use the road, I must follow the logic of the road. To claim immunity because "I am not from here" is to claim a license to impose risk on others without cause, which is a moral wrong regardless of border lines. Therefore, the class of genuine moral obligations among conventions is smaller than locals suppose—locals often moralize the expressive—but it is not empty, and it binds the visitor just as tightly as the resident.

  However, this binding force dissolves when we move to expressive conventions, and here the skeptic is half-right. Because expressive norms do not sustain a necessary cooperative practice, violating them does not constitute a wrong against the community as such. A visitor who refuses to shake hands in a culture where handshakes are standard does not break the institution of greeting; the practice survives. The obligation here is one of courtesy, not morality. Crucially, courtesy is interpersonal, not collective. I owe a handshake to the person I am meeting, as a sign of respect for our specific interaction. I do not owe a handshake to the "French" or the "Japanese" as an abstract collective. If I never engage with a local, I violate no duty by ignoring their expressive norms. This explains why the visitor's obligations are narrower than the resident's. A resident is embedded in a web of ongoing relationships where expressive norms grease the wheels of daily cooperation; a visitor passes through. To demand that a visitor adopt the expressive norms of a host community is to demand they perform membership they do not hold. Locals often conflate this with morality, treating a failure to tip or greet as a character flaw. But while it may be rude, it is not unjust. The resentment locals feel is often a category error, mistaking a breach of etiquette for a breach of right.

  One might object that this structural/expressive distinction is merely a redescription of the intuitive difference between conventions backed by harm and conventions backed by taste. If structural conventions prevent crashes and expressive ones merely hurt feelings, haven't I just redrawn the line between harm and offense? This objection misses the constitutive nature of structural conventions. Harm is often contingent; I can drive on the wrong side of the road at 3:00 AM on an empty street and cause no actual damage. Yet, the obligation remains. Why? Because the obligation is not to avoid a specific crash in a specific instance, but to uphold the *expectation* of conformity that makes the system safe for everyone else. The harm in structural defection is systemic vulnerability, not just individual injury. Conversely, expressive conventions can involve tangible harm. In the U.S., a waiter relies on tips for their livelihood; failing to tip causes financial harm. Yet, I classify this as expressive. This is because the *practice* of dining does not collapse without the tip, nor does the diner's refusal expropriate a resource from other diners. The harm is to a specific individual's income expectations, not to the fairness of a shared resource. The moral weight of structural conventions lies in their role as the scaffolding of public interaction; without them, the public sphere becomes a war of all against all. Expressive conventions decorate that sphere; without them, it is cold, but it stands.

  This distinction faces its sternest test in hard cases where the two collide or where the visitor is excluded. Consider a visitor who finds a local expressive convention repugnant—say, a greeting that requires a gesture of subservience. Since expressive conventions are obligations of courtesy owed to specific individuals, they are voided if the cost of compliance is self-abasement or moral compromise. Courtesy cannot demand complicity in degradation. The visitor is excused, not because they are a foreigner, but because the duty of courtesy is reciprocal; it requires mutual regard. If the local norm denies regard, the obligation to signal it dissolves.

  More difficult is the case of structural exclusion. What if a visitor finds themselves in a community where the structural convention—say, the queue—is systematically rigged against people of their background? If the practice is supposed to be a fair coordination mechanism but functions instead as a tool of expropriation by the dominant group, is the marginalized visitor bound to conform? Here, the moral ground of the structural convention erodes. The obligation to follow the queue rests on the premise that the queue ensures fair access. If the queue is a sham, and conformity merely facilitates one's own exploitation without securing the cooperative benefit for one's group, the duty to cooperate weakens. However, this does not grant a license for chaos. The visitor is permitted to opt out of the specific unfair instance, but they are not permitted to destroy the practice for others who might still benefit from it. The obligation shifts from conformity to reform. One may not cut the line to steal a spot, but one may rightly refuse to stand at the back if the front is reserved for others by fiat. The structural obligation binds only insofar as the structure is genuinely structural—that is, genuinely cooperative.

  Finally, we must address the visitor who chooses to opt out of the structural practice entirely. If I do not drive, am I bound by traffic laws as a pedestrian? If I do not use the bank, must I queue? The answer turns on whether my presence creates the hazard the convention is meant to manage. If I walk on a road, I am part of the traffic system, and my unpredictability creates risk. I am bound. If I stand in a public space where a queue forms to manage crowding, my refusal to queue creates a bottleneck. I am bound. But if I truly remove myself from the practice—if I hike a mountain where no paths exist—I am not bound by the trail markers of a park I do not enter. The obligation is not to the rule, but to the people sharing the space.

  In sum, the puzzle of social norms resolves when we stop asking "Is this the local rule?" and start asking "What does this rule do?" When a convention is structural, coordinating our actions to prevent shared harm, it commands moral obedience from anyone who enters the field of play, visitor or resident. When it is expressive, signaling who we are, it commands only courtesy from those who choose to engage. The "When in Rome" slogan is dangerous because it suggests we obey merely to avoid offending the hosts. In truth, for the conventions that matter, we obey because we are sharing the road. The visitor is not a tourist in morality; they are a participant in the human practice of living together, and where that living together depends on coordination, the duty is universal. But where it depends only on custom, the visitor is free to remain a stranger, owing respect to individuals but allegiance to no flag.
