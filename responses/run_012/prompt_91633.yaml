  **MEMORANDUM**

  **TO:** All New Hires, Chance Department
  **FROM:** Senior Management, Objective Chance Division
  **SUBJECT:** Onboarding Protocols and Deference Standards

  **Welcome to the Team.**
  You have been selected to manage the objective chances for this sector of reality. Your work ensures that rational agents know how much to believe. Please read the following protocols carefully. Deviation may result in metaphysical inconsistency.

  **1. Role Description**
  Your primary function is to survey the Humean Mosaic—the totality of local matters of particular fact across all space and time. You are to identify the systematization that best balances simplicity and strength. The frequencies derived from this Best System are to be posted as "Objective Chances." Please note: These chances are not causal powers or primitive features of reality. They are mere summaries of the distribution of facts. However, despite being derivative of the Mosaic, they are authorized to dictate rational belief across the organization. Do not dwell on the metaphysical status of a summary commanding the summands. It is not your role to question why a shadow bosses around the object casting it. Your job is to post the numbers; the staff's job is to trust them.

  **2. Duties**
  All staff must strictly adhere to the Principal Principle. Your credences regarding future events must align with the posted chances, conditional on admissible history. You are required to treat these posted summaries as normative guides for expectation. If asked why a descriptive summary prescribes belief, refer personnel to the Handbook. The authority of the chance function is procedural, not ontological. You must act as though the chances are real, even though your job description confirms they are just patterns in the data. Discrepancies between the ontological status of chance and its normative force are considered personal matters.

  **3. Key Performance Indicators (KPIs)**
  Performance is measured by system stability. You must avoid the "Big Bad Bug." This occurs when you assign a non-zero chance to a future sequence of events that, if realized, would render a different systematization optimal, thereby altering the very chances you posted. Essentially, you cannot post a chance that predicts its own falsification via the Best System analysis. If a future undermines the present theory, it counts against your KPIs, even if that future was assigned high probability. We reward accuracy, unless accuracy undermines the basis of the accuracy. In such cases, accuracy is penalized.

  **4. Note from Legal**
  To mitigate KPI failures, Legal has inserted a No-Undermining Clause into all employment contracts. Futures that undermine the current chance theory are classified as "inadmissible" for the purpose of conditionalization. You are to defer to chances conditional on the assumption that the future will not undermine the present theory. Legal advises that you do not inquire into the modal status of these excluded futures. They are physically possible, but you must condition on them not obtaining. Effectively, you must ignore the possibilities you are paid to calculate. This ensures the theory remains stable, provided the future cooperates.

  **5. FAQ**
  **Q: Why don't we defer conditional on the complete theory of chance?**
  **A:** This proposal is circulated by the Reform Faction (Middle Management, Level 3). They argue for the "New Principle," suggesting deference should be conditional on the theory itself, not just history. They claim this resolves the undermining issue and have submitted several tickets regarding logical coherence. Management maintains the standard Principal Principle. We defer to history. The theory is mutable; history is fixed. Accommodating the Reform Faction would require admitting the current theory might be wrong, which violates Brand Guidelines. Their access to the posting terminal has been restricted.

  **Q: Is termination standard for landing in an undermined future?**
  **A:** We prefer resignation. See Exit Interview Transcript, Employee #451: "I followed the probabilities. The probabilities said this future was possible. Now that I'm in it, the probabilities say it shouldn't have happened because the Best System changed. I'm not quitting; the logic quit me."

  **Compliance is mandatory.**

  ***

  **Note on Accuracy**

  I am highly confident (95%+) that jokes regarding **(a) the Big Bad Bug** and **(b) the No-Undermining Clause** are fair readings. These are central, well-documented problems in Lewis's formulation of Humean supervenience, specifically regarding undermining futures and the subsequent attempt to exclude them from admissible evidence.

  I am also confident (90%) in **(d) the normativity/summary tension**. The challenge of explaining why rational agents should defer to frequencies that are merely descriptive summaries of the whole mosaic (the "queerness" of Humean chance) is a standard objection in the literature.

  I am moderately confident (80%) in **(c) the Reform Faction/New Principle**. This references the debate between Lewis's original Principal Principle and the revised "New Principle" (advocated by Hall, Thau, etc.) which conditions on the chance theory itself to avoid undermining. Portraying this as disgruntled middle management is satirical, but the technical distinction is accurate.

  **Least Sure Point:** I am least sure about the specific phrasing of the **New Principle** in the FAQ. While the core idea (conditioning on the theory vs. history) is correct, the internal debate is nuanced regarding *what* exactly is admissible. Simplifying it to a management dispute risks slightly obscuring the fact that many Humeans accept the New Principle as an improvement rather than a factional revolt, but for the sake of the memo's narrative, the "reform" angle holds up.
