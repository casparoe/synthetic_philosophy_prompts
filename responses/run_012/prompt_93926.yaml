      *   Why this works: It meets the "apt output" bar (on standard inputs) but fails the "robustness" bar in a way that reveals it's not tracking *meaning* but *surface statistics*.
      *   Wait, the user's criteria includes "robustness to perturbation." So if I show it fails perturbation, I show it fails the criteria. That's not an "apt output but no understanding" case.
      *   I need a case where it *passes* the perturbation test but still seems shallow.
      *   *Revised Crux:* **The "Alien Anthropologist" Case.** The system translates human emotional texts perfectly. It preserves ambiguity, handles puns, etc. But it has *no* internal state corresponding to valence. It treats "grief" and "joy" as purely syntactic tokens with distributional relationships.
      *   *Independent Reason:* We have reason to think understanding requires *phenomenal experience* or *grounding* (connection to action/world). If the system is causally isolated from the referents, is it understanding?
