      *   *Best Crux:* **The "Syntactic Mirror" Case.** A system trained *only* on parallel corpora (no monolingual data, no world interaction). It translates perfectly between Language A and Language B. But it cannot use Language A to describe a picture, or answer a question about the world in Language A. It is a closed loop.
