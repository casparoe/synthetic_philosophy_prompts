      *   Address the "Will-Writing Man": He isn't deceiving himself about the *risk* (subconsciously), he is deceiving himself about the *probability* (consciously). Or, he holds implicit knowledge (will) and explicit belief (fine).
      *   Address Ordinary Cases: The affair (reframing), the parent (attentional blindness).

  7.  **Refining the Tone:**
