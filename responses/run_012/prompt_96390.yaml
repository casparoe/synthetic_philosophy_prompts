  6.  **Developing the "Best Version of the Concept":**
      *   Don't say "it depends." Say "Here is the working definition."
      *   Definition: Self-deception is *motivated cognitive processing that results in a confidence level disproportionate to the evidence, often sustained by information avoidance.*
