answer: |-
  Good evening. Thank you for asking me to speak. It is a strange thing to stand in a hall like this, where the air still smells faintly of oil and sawdust, even though the machines are gone. I grew up two streets over. My father spent thirty-one years on the floor of the mill. He is not here tonight, but many of the men who worked beside him are. I see them at the tables. I see their families. I see the branch leadership who kept this local alive when the lights went out in 2019. And I see the site manager at my own table. We are all in the same room. That is no small thing.

  We are here to mark a hundred years. Usually, a centennial is a look backward. But this local does not have the luxury of looking only backward. We are standing in the middle of a transformation that is happening right now, in this building. The mill is closed. The site is a data centre. Sixty of our members are back at work in the toolroom, grading model answers, thousands a day. The company calls this Skills Transfer. There is a plaque in the lobby that lists you not as workers, but as knowledge contributors.

  I have been struggling with what to say about this because I know the room is divided. Some of you believe this deal was a lifeline thrown to a drowning union. Some of you believe it was a sale of the members' judgement for wages and a piece of brass on the wall. I am not here to settle that argument. I am here to suggest that both sides are looking at the same reality, and that reality is heavier than any of us want to admit.

  When a tool becomes a machine, something fundamental changes. In the old mill, the skill was in your hands. You knew the sound of the press, the feel of the metal, the rhythm of the line. That knowledge belonged to you. It was yours to keep, yours to withhold, yours to pass on to an apprentice. But when the process is automated, when the intelligence is built into the apparatus, the skill does not disappear. It moves. It moves out of the worker and into the machine.

  This is what is happening in the toolroom today. The judgement you used to apply to the work is now being applied to the system that does the work. You are grading the answers. You are teaching the model. But once that lesson is learned by the system, it no longer belongs to you. It belongs to the capital that owns the server. The skill is preserved, yes, but it is preserved outside of you. And when the skill moves into the machine, the worker is left tending it.

  I know some are told to take comfort in the idea that there is still a human in the loop. That a person is still making the call. But we know what it means to supervise a process rather than perform it. It is not a promotion. It is a narrowing. You are no longer the craftsperson; you are the quality control for the craft that has been encoded.

  And we must be honest about the pace. There is an old idea that machinery exists to lighten the load, to shorten the day, to give us leisure. But look at the quotas. Thousands of grades a day. The machine does not make the labor lighter; it makes it cheaper. It intensifies the work. It demands that you keep up with the speed of the system, not the speed of human thought. So when we look at this new work, we cannot pretend it is the same as the old work, merely cleaner. It is a different relation to what you produce.

  This brings me to the plaque. "Knowledge Contributors." It is a flattering title, but it hides the transaction. You are contributing the tacit knowledge that made you good at the old jobs. You are surrendering it, one judgement at a time, to train the system that may eventually replace the need for that judgement. This is not retraining in the sense of learning a new trade. It is the transfer of your expertise into a form you do not control.

  So, if the skill is gone from our hands, and the work is intensified, and the knowledge is owned by the company, why are we here? Why stay in this hall? Why keep the local chartered?

  Because there is a contradiction in this new world, and it is our opening.

  We are entering a time where production rests on stored-up social knowledge. The wealth generated here does not come from the sweat of a single shift anymore. It comes from the accumulated intelligence of the system, the general intellect of society, captured in code. When wealth is created this way, labor time stops being a sensible measure of value. If the machine does the heavy lifting, if the knowledge is social, then tying wages strictly to hours worked, or tying dignity strictly to manual output, becomes a way to keep us poor in the midst of plenty.

  This is the crisis for the company, and it is the opportunity for us. They want to treat you as hourly workers feeding a machine that generates wealth beyond measure. They want to pay for your time while they keep the value of the knowledge you poured into it. But if the wealth comes from the general intellect, from the stored knowledge, then the claim on that wealth should not be limited to the clock.

  This is why the quarrel in the branch matters. It is not just about whether the deal was good or bad. It is about what we demand next. Those who fought for this deal saw survival. They were right that a union without members is a ghost. Those who oppose it see the cost. They are right that a union without leverage is a club. But both sides agree on one thing: that the people in this room deserve more than a wage for tending the machine.

  We are not here to celebrate the closure of the mill. We are not here to flatter the company for letting us stay in the building. We are here because the building is still ours in spirit, and the work is still ours in substance. The knowledge in that system came from your heads, your years on the floor, your understanding of how things work. You are the source of the signal.

  So, let us not be consoled by the idea that our skills live on in the system. Let us be demanding about who owns them. Let us not be satisfied with being the human in the loop. Let us insist that if the loop generates wealth, we own the loop.

  My father worked here for thirty-one years. He taught me that dignity comes from knowing what you are worth. Not what the market says you are worth. Not what the plaque says you are. But what you know you are. The mill is gone. The machines are different. But the need for us to stand together is the same. When the skill moves to the capital, the only thing left that belongs to us is each other.

  There is a future where the wealth generated by this stored knowledge benefits the community that built it. There is a future where the reduction of necessary labor means more life for us, not more profit for them. But that future does not happen because the company grants it. It happens because we understand the change, we name it correctly, and we organize around the truth of it.

  Thank you for your work. Thank you for your families. Thank you for keeping this hall open. Let us eat, and let us talk, and let us remember that while the mode of working may have changed, the need for solidarity has not. To the union.
