      1.  **Anti-Dualism:** You must establish that for Nietzsche, there is no "mind" separate from physiological state. Thought is a symptom of the body.
      2.  **Regimen as Filter:** Once the body is the ground, diet becomes epistemological. You eat to exclude what drains energy, not to "be healthy."
      3.  **Health as Capacity:** Finally, define health not as comfort, but as the capacity to endure suffering for creation.
      *Collapse:* If you start with #3, you get wellness culture. If you start with #2, you get nutritionism. #1 is the foundation.

      *Refining the Example:*
      Use *Ecce Homo*'s claim that German food and damp climate caused his depression/pessimism, while Italian cuisine and high altitude enabled *Zarathustra*. It's concrete (wine, meat, weather), self-reported, and links physiology directly to philosophical output without saying "his sickness made him wrong."

