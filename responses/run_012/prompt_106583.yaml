answer: |-
  This is a sophisticated position, and it is one that many economists find attractive precisely because it promises to derive ethics from rationality. It turns a moral claim ("we ought to maximize the sum") into a technical consistency condition ("you cannot be rational and disagree").

  However, your intuition that something is being "smuggled in" is correct. The Harsanyi aggregation argument is not a derivation of utilitarianism from *thin* rationality; it is a derivation of utilitarianism from rationality *plus* a specific set of normative commitments that are disguised as technical axioms.

  Here is the map of what counts against the view, ranked from fatal structural flaws to philosophically costly concessions, tailored to an economist's sensibilities.

  ### 1. The Interpersonal Comparability (IPC) Trap (Question a)
  **Verdict:** *Fatal to the "Logical Necessity" claim.*

  You asked if IPC is handed to you or assumed. **It is assumed.** This is the most common misunderstanding of the theorem among economists.

  *   **The Math:** The VNM theorem gives you cardinal utility for *individual* $i$, unique up to a positive affine transformation ($U_i' = a_i U_i + b_i$, where $a_i > 0$).
  *   **The Aggregation:** Harsanyi proves the Social Welfare Function takes the form $W = \sum w_i U_i$.
  *   **The Problem:** To interpret $W$ as *utilitarianism* (where weights $w_i$ are equal and meaningful), the units of $U_i$ must be comparable across persons. If Alice's "util" is measured in centimeters and Bob's in kilograms, summing them is mathematically coherent but substantively meaningless.
  *   **The Smuggle:** Harsanyi tries to fix this with the Veil of Ignorance. He argues that behind the veil, you maximize *your own* expected utility, where the states of the world are "I am Alice," "I am Bob," etc.
  *   **The Catch:** For "I am Alice" and "I am Bob" to be states in a single probability space that you can weigh equally, there must be a common metric of well-being that allows you to say "Being Alice in state $X$ is better/worse than being Bob in state $Y$."
  *   **What a Harsanyi Defender Concedes:** They must concede that the Veil of Ignorance *presupposes* a solution to IPC. It does not solve it. You have to assume that human experiences are commensurable *before* you can step behind the veil. If you are a hard-line ordinalist or believe preferences are incommensurable across minds, the theorem gives you a weighted sum of *numbers*, but not a sum of *welfare*.

  **Why this should move you:** You view the result as "the only coherent way to add people up." But you can only add them up if you assume they are adding the same kind of thing. That assumption is ethical, not mathematical.

  ### 2. The Common Priors Requirement (Question b)
  **Verdict:* *Technically Fatal (without strong idealization).*

  Your reading group member is **not confused**; they are citing a robust impossibility result (formalized by Mongin, 1995, and later Gilboa et al.).

  *   **The Setup:** Harsanyi's theorem requires that individuals and society rank the *same* set of prospects. A prospect is defined by outcomes and probabilities.
  *   **The Conflict:** If Alice thinks probability of State $S$ is 0.9 and Bob thinks it is 0.1, they are effectively ranking different objects.
  *   **The Result:** If you maintain the Pareto Principle (respect unanimous preference) and VNM rationality for society, but allow **heterogeneous priors**, you run into "Spurious Unanimity."
      *   *Example:* Alice and Bob both prefer Bet A to Bet B. Alice prefers A because she thinks Horse X will win. Bob prefers A because he thinks Horse X will lose (and the payout structure is weird). They agree on the choice, but for contradictory reasons. A rational aggregator shouldn't necessarily respect this unanimity.
  *   **The Fix:** To save the theorem, you must assume **Common Priors**. Everyone (and society) must agree on the objective probabilities of states of the world.
  *   **Why this should move you:** As an economist, you know agents usually have private information and different models. By assuming common priors, Harsanyi is assuming away disagreement about *facts*. This turns the theorem into a claim about idealized rational agents who already agree on the physics of the world, leaving only "tastes" to aggregate. That is a massive restriction on the domain of social choice.

  ### 3. Ex Ante vs. Ex Post and the Independence Axiom (Question c)
  **Verdict:* *Philosophically Costly (The "Fairness" Defeater).*

  This addresses your intuition that favoring the coin flip (ex ante) over the sure thing (ex post) feels wrong.

  *   **The Tension:**
      *   **Ex Ante Pareto:** If everyone prefers the coin flip (lottery) before the fact, society must prefer it.
      *   **Ex Post Efficiency:** Once the dust settles, one person has the kidney and one is dead. The coin flip led to a state that was dominated by a state where the person with the higher survival chance got it for sure.
  *   **Harsanyi's Commitment:** Harsanyi is committed to **Ex Ante** evaluation. The object of moral choice is the *prospect*, not the *outcome*.
  *   **The Cost:** This forces all ethical concerns into the individual utility function *before* aggregation.
      *   If individuals are risk-neutral and care only about their own health, Harsanyi says: Give the kidney to the one with the highest survival rate (Maximize Sum).
      *   If you (the social planner) think there is intrinsic value in *fairness* (a 50/50 chance for both), Harsanyi says: You are irrational unless that preference for fairness is already inside the individuals' $U_i$.
  *   **The Defeater:** This is **Welfarism**. It forbids society from having values that are not reducible to individual preferences over outcomes. Many philosophers (and some economists) argue that *procedural fairness* is a social value distinct from individual risk preferences. Harsanyi's theorem rules this out by axiom (specifically, the Independence Axiom applied to social choice).
  *   **Why this should move you:** You mentioned the coin flip feels "plainly wrong." That intuition is likely a commitment to *Ex Post* equity. Harsanyi's framework cannot accommodate this without distorting individual preferences. It forces you to model "I want a fair chance" as a preference over risk, rather than "Society ought to be fair" as a constraint on aggregation.

  ### 4. The "Patching" and Triviality (Question d)
  **Verdict:* *Substantive Restriction (Not trivial, but narrow).*

  Has the view been patched until it's risk-free? No, but it has been narrowed until it is clearly a *specific* ethical theory, not a general logic of aggregation.

  To make Harsanyi work, you need to accept this bundle:
  1.  **Welfarism:** Only individual utility matters (no rights, no desert, no procedural values unless internalized).
  2.  **Cardinal IPC:** Utilities are comparable across persons (via the Veil normalization).
  3.  **Common Priors:** No disagreement on probabilities.
  4.  **Social Independence:** Society's preferences must satisfy the VNM Independence Axiom.

  **Is this a problem?** It depends on whether you see these as "technical conditions" or "ethical commitments."
  *   **The Critique:** The **Social Independence Axiom** is the heaviest lift. In individual choice, Independence says "if you prefer A to B, adding a common lottery C to both shouldn't change your preference." In *social* choice, this implies society should be risk-neutral regarding the *distribution* of welfare. It blocks aversion to inequality *unless* that aversion is already in the individual $U_i$.
  *   **The "Good Theorem" Defense:** A Harsanyi defender would say: "Of course it has premises. A theorem without premises is magic. The point is that if you accept these premises (which define a liberal, rational, welfarist society), Utilitarianism follows."
  *   **The Counter:** The problem is that the premises do the heavy lifting. If you drop Social Independence (allowing society to be inequality-averse even if individuals aren't), you can get Prioritarianism or Egalitarianism. Harsanyi doesn't prove Utilitarianism is the *only* coherent view; he proves it is the only coherent view *given a specific definition of social rationality that biases toward aggregation.*

  ### Ranking the Defeaters

  1.  **Fatal / Foundational: Interpersonal Comparability.**
      *   *Why:* Without a justified method to normalize utility scales across persons, the "sum" is meaningless. The Veil of Ignorance assumes what it needs to prove (that "being me" is comparable to "being you").
      *   *Economist Translation:* You are summing variables with undefined units.

  2.  **Fatal / Technical: Heterogeneous Priors.**
      *   *Why:* If people disagree on probabilities, the Pareto principle + Aggregation leads to contradictions or spurious unanimity. The theorem collapses without the Common Priors assumption.
      *   *Economist Translation:* The model assumes away informational asymmetry and model disagreement, which is where most real social choice problems live.

  3.  **Philosophically Costly: Welfarism & Ex Ante Evaluation.**
      *   *Why:* It excludes fairness, rights, and procedure as independent social values. It forces all ethics into individual risk preferences.
      *   *Economist Translation:* It imposes a restriction on the Social Welfare Function space that excludes inequality aversion unless it originates in individual utility functions.

  4.  **Cosmetic / Clarification: The "Weights" Issue.**
      *   *Why:* Harsanyi gets *weighted* utilitarianism. You need the Veil to get *equal* weights. This isn't a defeater, but it clarifies that the "Utilitarianism" conclusion requires an extra ethical step (the Veil) beyond the aggregation theorem itself.

  ### The "Hard to Swallow" Premise for an Economist

  If you are willing to nod along to thin premises, the one that should trip you up is **Social Independence (VNM for Society).**

  In individual choice, Independence is plausible (mostly). In social choice, it implies that **society should not care about the correlation of risks.**
  *   *Scenario:* Policy A gives everyone a 50% chance of a good outcome (perfectly correlated). Policy B gives everyone a 50% chance (independent coin flips for each person).
  *   *Harsanyi:* If individuals are indifferent, Society must be indifferent (because expected utility is the same).
  *   *Intuition:* Most people prefer Policy B (uncorrelated risk) because it avoids the catastrophe of *everyone* suffering together.
  *   *Implication:* Harsanyi's framework cannot capture aversion to social risk or correlation unless individuals are explicitly risk-averse about *social states*.

  ### Summary
  Your conviction rests on the idea that Harsanyi derives Utilitarianism from **Rationality**.
  The counter-map shows that Harsanyi derives Utilitarianism from **Rationality + Welfarism + Common Priors + IPC + Social Risk Neutrality.**

  The theorem is valid, but it is not a "free lunch." It tells you that *if* you want a social ordering that looks like an expected utility maximizer, *then* you must be a utilitarian. But there is no logical compulsion to demand that society look like an expected utility maximizer. That is a moral choice, not a logical necessity.
