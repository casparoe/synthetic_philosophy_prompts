answer: |-
  In your ensemble novels, value aggregation is simply the plot resolution. You have seven viewpoint characters, each with a utility function—a want—that cannot be simultaneously maximized. When you decide that Character A gets the climax while Character B gets the subplot, you are weighting values. When you decide who dies and who walks away, you are solving the equation of whose satisfaction outweighs whose frustration. There is no mathematical formula in your outline, only your gut, but the operation is identical to the AI argument: you are summing incompatible desires into a single output.

  The liberal neutrality ideal is the omniscient narrator who refuses to judge. It is the promise that the narrative camera treats the villain's reasoning with the same textural weight as the hero's. You aim for a system where the book doesn't tell the reader what to feel, but merely presents the conflict, letting the audience decide who was right. This is the "neutral platform" argument: the novel is the container, the characters are the users, and you are just the engineer ensuring the plumbing works without imposing your own morality on the flow.

  On the actual page, this neutrality collapses into value laundering. You claim the camera is objective, but you chose where to point it. You gave Character C the last word of the novel; that is an endorsement, however subtle. You rendered Character D's pain in sensory detail but described Character E's pain in summary. These are craft choices that function as moral weights. You aren't laundering money; you're laundering authority. You claim the story "told itself," but you built the rooms where the characters could walk. The system designer claims the algorithm is neutral; you claim the narrative is inevitable. Both claims hide the hand that built the maze, and neither of you has earned the right to call it objective.

  The analogy stops at consequences and feedback. If you bias the novel, the reader feels aesthetic dissonance or thematic confusion; if the designer biases the system, a human gets denied a loan or imprisoned. You cannot patch the novel after publication based on character feedback; the AI learns from interaction, while your book is dead wood once printed. You are expected to have a point of view; they are expected to have a utility function. But when you claim neutrality, you are lying just as hard as they are.

  Here is the residue. What translates cleanly is the impossibility of the view from nowhere; structural bias is inevitable in both code and prose. What translates with distortion is consent; readers buy the book knowing they will be manipulated, while AI users often expect service without interference. What cannot be said in your vocabulary is material consequence; your bias changes interpretations, their bias changes outcomes. The leftover is your craft-talk missing something real—the stakes of physical harm—not their disagreement being less substantive than it sounds. They are fighting over the same power you wield, just with higher costs.

  Residue: The untranslatable difference is material harm, but the core insight holds that neutrality is a stylistic choice, not an engineering state.
