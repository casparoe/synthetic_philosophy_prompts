      2.  **The Tautological Reading:** Swing = Action. Nose = The boundary of permission. (True but useless).
      3.  **The Rights-Based Reading:** Swing = Action. Nose = Protected Right. (Substantive but begs the question).
      4.  **The Welfare/Interest Reading:** Swing = Action. Nose = Vital Interest. (Mill's actual view, substantive).
