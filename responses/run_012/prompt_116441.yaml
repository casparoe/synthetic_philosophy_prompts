  *   Roommate: Equates ears with non-noses. This is the "Literal" reading.
  *   Why they feel like cheating: Because they switch definitions mid-argument.

  Let's build the response.

  *   **Intro:** Validate the user's suspicion. The slogan is an empty vessel.
