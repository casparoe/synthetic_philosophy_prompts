      *   *Body Paragraph 4 (Legitimacy & Verdict):* Despite this, the step is legitimate as an adoption of the "design stance." We predict the system's behavior by assuming its components function as designed, regardless of human consciousness during the event. This licenses talk of the market having "reasons" for a crash: the systemic logic dictated a correction to zero liquidity given the inputs, even if no participant desired that outcome. The crash was a rational outcome of irrational constraints.
