prompt: |-
  Last week a friend of mine, a population ecologist, and I spent most of a long drive arguing about the units of selection, and the argument ended where it always ends, with his claim that every case anyone has ever called group selection can be rewritten as selection among individuals or among genes, so that the whole controversy is a dispute about bookkeeping rather than about nature. I could not say precisely what would be lost if he were right, and on Thursday I have to teach the topic.

  The setting: twelve first-year doctoral students in an interdisciplinary seminar, mostly ecologists and molecular biologists, none of whom has thought about levels of selection since an undergraduate lecture on kin selection, and two or three of whom suspect the whole subject is a hangover from the 1960s. I have eighty minutes, a whiteboard, and no set text. Do not explain the debate to me; plan how I should teach it.

  What I need first is the order of ideas, with the dependencies made explicit: what has to be in place before the question of the level at which selection acts can be asked in a way that has an answer, and why each later piece is unintelligible without the earlier ones. Tell me where the distinction between a replicator and a vehicle belongs in that sequence, and whether it should arrive before or after the students have seen that a single population can be described correctly at more than one level.

  For the example that carries the session I want to use something I have invented rather than the usual yeasts and siderophores, half of which they will have met already and will nod at without thinking. Mine is this: larvae from many different parents settle on one rock and fuse into a single colony with a shared water canal; a fraction of the colony's cells become stinging defenders that cannot reproduce at all and die with the colony; the colony reproduces only when a fragment breaks off and settles elsewhere. The defenders therefore have no individual fitness of their own, their neighbours are not their relatives, and the entity that reproduces is the colony. Tell me whether this example can bear the weight of the session: what it has that the session needs, what it lacks, whether the lack is fatal or instructive, and, if fatal, what a replacement would have to contain.

  Then the misconceptions: what they will bring in with them, what they will form during the session, the precise point in the sequence at which each should be headed off, and the move that heads it off. I expect at least that a gene's-eye view will be taken to mean that there is no group selection, the inference from groups differing in productivity to group selection having been demonstrated, and the converse error of treating group selection as the theory that rescues altruism; I would like the rest. I also want one question to put to them at the end that would show whether they can distinguish a trait that merely benefits a group from a trait selected at the level of groups, and that a student who has learned only the vocabulary would fail. Finally, tell me what I should refuse to cover in eighty minutes and how to say so out loud, and whether the equivalence my friend insists on should be the destination of the session or a live dispute left open -- and if part of what he and I disagreed about is merely verbal, which part, so that I do not stage for the students a disagreement that is not there.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** A professor/instructor teaching a seminar on levels of selection to 12 first-year doctoral students (ecologists/molecular biologists).
      *   **Context:** 80 minutes, whiteboard, no text. Students have basic undergrad knowledge (kin selection) but some think the topic is outdated.
      *   **Core Conflict:** The user's friend (population ecologist) claims group selection is just "bookkeeping" (reducible to individual/gene selection). The user feels something is lost if this is true but couldn't articulate it.
      *   **Tasks:**
          1.  Order of ideas (dependencies).
          2.  Placement of Replicator/Vehicle distinction.
          3.  Placement of "multiple levels description" concept.
          4.  Evaluate the user's invented example (fusing larvae colony with sterile defenders).
          5.  Identify misconceptions (pre-existing and emergent) and how to head them off.
          6.  Create a final assessment question (distinguishing benefit vs. selection).
          7.  Determine what to exclude/refuse to cover.
          8.  Address the "bookkeeping" equivalence dispute (destination vs. open dispute).

  2.  **Deconstruct the Science (Levels of Selection):**
      *   *Core Concept:* Selection requires variation, heritability, and differential fitness.
      *   *The "Bookkeeping" Argument:* Mathematically, the Price Equation allows partitioning selection into within-group and between-group components. If the between-group component is non-zero, group selection is occurring *mathematically*. However, some argue this is just a different way of calculating individual fitness (inclusive fitness).
      *   *The "Ontological" Argument:* Is the group a real entity that evolves, or just a collection of individuals?
      *   *Key Distinctions:* Replicator (entity that passes structure) vs. Vehicle/Interactor (entity that interacts with environment).
      *   *Key Condition:* For group selection to be *causal*, group-level traits must vary, be heritable, and affect group survival/reproduction *independently* of individual effects (or despite individual costs).

  3.  **Task 1: Order of Ideas (Dependencies):**
      *   *Foundation:* What is selection? (Variation, Heritability, Differential Fitness).
      *   *Step 1:* Entities. You can't have selection without something being selected.
      *   *Step 2:* Hierarchy. Populations are nested.
      *   *Step 3:* The "Multiple Descriptions" insight. A single process can be modeled at different levels. (This addresses the friend's "bookkeeping" claim early).
      *   *Step 4:* Replicator vs. Vehicle. This clarifies *what* is being copied vs. *what* is doing the surviving. Crucial for defining the "unit."
      *   *Step 5:* Causal vs. Statistical. When does a statistical description imply a causal mechanism?
      *   *Sequence:* Definition of Selection -> Hierarchy/Nesting -> Multiple Descriptions -> Replicator/Vehicle -> Criteria for Group Selection (The "Hard" Part).

  4.  **Task 2: Replicator/Vehicle Placement:**
      *   Dawkins' distinction is vital.
      *   *Before or After Multiple Descriptions?* It should come *after*. First, establish that we *can* describe things at multiple levels. Then, use Replicator/Vehicle to decide which level *matters* for evolution. If the group is a vehicle but not a replicator, can it be a unit of selection? (Usually no, unless it reproduces).
      *   *Decision:* Introduce Multiple Descriptions first (to validate the friend's point partially), then Replicator/Vehicle to refine the definition of a "Unit of Selection."

  5.  **Task 3: Evaluating the Invented Example (Fusing Larvae):**
      *   *Scenario:* Larvae from different parents fuse. Shared canal. Some become sterile defenders. Colony reproduces via fragmentation. Neighbors not relatives.
      *   *Strengths:*
          *   Clear sterile altruism (defenders die).
          *   Non-kin (kills kin selection explanation).
          *   Colony reproduces (fragmentation), individuals don't (defenders).
          *   Clear hierarchy (Cell -> Colony).
      *   *Weaknesses:*
          *   Is it *really* non-kin? (Need to ensure students accept the premise).
          *   Is the "fusion" a one-time event or ongoing?
          *   Does it distinguish *group selection* from *individual selection* acting on a new individual (the colony)?
      *   *Verdict:* It's strong. It forces the "Unit of Selection" question. If the colony is the only thing reproducing, isn't it just a new "individual"?
      *   *Refinement:* The example risks conflating "Group Selection" with "Major Transition in Individuality." This is actually *good* for doctoral students. It shows where group selection leads (new individuals).
      *   *Lack:* It might be *too* clean. It lacks the tension of within-group conflict (cheaters). If defenders *cannot* reproduce, there's no within-group selection for cheating (unless mutations occur).
      *   *Fix:* Add the possibility of "cheater" cells that refuse to defend but still reproduce in the fragment. This creates the Within-Group vs. Between-Group tension essential for the Price Equation logic.

  6.  **Task 4: Misconceptions:**
      *   *Pre-existing:* "Gene's eye view = No group selection." "Group selection = Altruism only." "Group selection = Old/Wrong."
      *   *Emergent:* "If groups differ in output, it's group selection" (ignores heritability). "Group selection requires conscious cooperation."
      *   *Timing:* Address "Gene's eye" early (compatibility). Address "Altruism" during the example. Address "Difference in output" during the criteria section.

  7.  **Task 5: Final Assessment Question:**
      *   Need to distinguish "Trait benefits group" vs. "Trait selected *because* it benefits group."
      *   *Idea:* A trait that helps the group but spreads because it helps the individual (incidental).
      *   *Draft:* "A bacteria produces a public good. It spreads. Is it group selection?" (Too simple).
      *   *Better:* Compare two scenarios. One where the trait spreads despite individual cost (Group Selection), one where it spreads due to individual benefit (Individual Selection).
      *   *Best:* The "Incidental Benefit" trap. A trait increases group survival, but within every group, individuals *with* the trait have lower fitness than those *without*, yet the trait spreads globally. Wait, that's the definition of group selection.
      *   *The Trap:* A trait increases group survival, and within every group, individuals *with* the trait have *higher* fitness. (This is Individual Selection, even if the group benefits).
      *   *Question:* "In Population A, defenders have lower fitness than non-defenders within colonies, but colonies with defenders outgrow others. In Population B, defenders have higher fitness than non-defenders within colonies, and colonies with defenders outgrow others. In which case is group selection *necessary* to explain the spread?" (Answer: A).

  8.  **Task 6: What to Exclude:**
      *   Mathematical derivations (Price Equation algebra). Keep it conceptual.
      *   History of the debate (Wynne-Edwards vs. Williams). Irrelevant to mechanism.
      *   Cultural evolution / Memes. Distracting.
      *   *The Friend's Claim:* This is the crux. Is it bookkeeping?
      *   *Resolution:* It *is* mathematically equivalent (Price Equation), but causally distinct. The "bookkeeping" claim is mathematically true but biologically shallow. Don't resolve it definitively; frame it as "Modeling choice vs. Causal mechanism."

  9.  **Drafting the Plan (Iterative refinement):**

      *   *Introduction (10 min):* Hook with the friend's argument. Define Selection (Lewontin's 3 conditions).
      *   *Module 1: Hierarchy & Description (20 min):* Nested entities. The "Multiple Descriptions" point. (Friend is right about math).
      *   *Module 2: Replicator/Vehicle (20 min):* Insert here. Distinguish copying from surviving. Apply to the Larvae Example.
      *   *Module 3: The Criteria for Group Selection (20 min):* Within-group vs. Between-group variance. The "Cheater" problem. (Friend is wrong about causality).
      *   *Conclusion & Assessment (10 min):* The Final Question.

      *   *Refining the Example:* The user's example is good but needs the "Cheater" variant to show the *conflict*. I will advise adding a "mutant cell" scenario.
      *   *Refining the "Bookkeeping" dispute:* This is the "Equivalence Thesis." It is mathematically true (Okasha, Price). But causally, identifying the *vehicle* of reproduction matters. I need to tell the user to validate the friend's math but challenge the friend's ontology.

  10. **Final Review against Constraints:**
      *   80 minutes.
      *   12 PhD students.
      *   Whiteboard only.
      *   Address specific questions about order, example, misconceptions, final question, exclusions, and the friend's claim.

      *(Self-Correction during drafting)*: Make sure I explicitly answer the "Replicator/Vehicle before or after Multiple Descriptions" question. I think Multiple Descriptions first is better because it sets up the problem that Replicator/Vehicle solves.
      *(Self-Correction on Example)*: The user's example describes a "Major Transition." I need to warn them that this blurs the line between "Group Selection" and "Individuality." This is a feature, not a bug, for PhD students, but needs handling.
      *(Self-Correction on Friend's Claim)*: The friend says it's *only* bookkeeping. The counter is that causal explanation requires identifying the mechanism. If the mechanism is group extinction, calling it "individual selection" is obfuscating.

  11. **Final Polish:** Ensure tone is authoritative yet pedagogical. Structure clearly with headings matching the prompt's requirements. (Proceed to generate output).

      *Wait, one more check on the Final Question:*
      "Distinguish a trait that merely benefits a group from a trait selected at the level of groups."
      Scenario 1: Trait helps group, helps individual more. (Individual selection).
      Scenario 2: Trait helps group, hurts individual. (Group selection).
      The question must force them to look at *within-group* fitness differentials.
      Proposed Question: "A trait increases the survival of the colony. In Scenario X, individuals with the trait reproduce more than those without it *within the same colony*. In Scenario Y, individuals with the trait reproduce less than those without it *within the same colony*, yet the trait increases in the total population. In which scenario is 'Group Selection' the *only* adequate causal explanation?"
      Answer: Y. In X, individual selection explains it (even if group benefits). In Y, individual selection opposes the trait; only group selection explains its spread.

      *Okay, ready to write.*
answer: |-
  Here is a teaching plan designed for your 80-minute seminar, structured to address the conceptual dependencies, evaluate your example, manage misconceptions, and resolve the "bookkeeping" dispute without bogging down in history or excessive math.

  ### 1. The Order of Ideas (Dependencies)

  You cannot ask "at what level does selection act?" until you have defined what selection *is* and what entities *exist* to be selected. The sequence must move from ontology (what exists) to mechanics (how it changes) to interpretation (what we call it).

  1.  **The Lewontin Conditions (Foundation):**
      *   *Concept:* Selection requires Phenotypic Variation, Differential Fitness, and Heritability.
      *   *Dependency:* Nothing else works without this. If any of these are missing at a specific level, selection cannot act at that level.
      *   *Why first:* It provides the objective criteria students will use to test later claims.

  2.  **Nested Hierarchy (The Stage):**
      *   *Concept:* Biological entities are nested (genes within cells, cells within organisms, organisms within groups).
      *   *Dependency:* You need a hierarchy before you can have a "level."
      *   *Why second:* It establishes that multiple levels *exist* simultaneously.

  3.  **Multiple Descriptions (The Friend's Point):**
      *   *Concept:* A single evolutionary trajectory can be mathematically partitioned in different ways (e.g., Price Equation partitioning).
      *   *Dependency:* Requires the Nested Hierarchy.
      *   *Why here:* This validates your friend's claim early. It prevents students from thinking levels are mutually exclusive physical boxes. It establishes that "bookkeeping" is possible.
      *   *Crucial Turn:* Acknowledge this is true, but ask: "Does mathematical equivalence imply causal equivalence?"

  4.  **Replicator vs. Vehicle (The Filter):**
      *   *Concept:* **Replicator:** Entity that passes structure (copying). **Vehicle (Interactor):** Entity that interacts with the environment to cause differential survival/reproduction.
      *   *Dependency:* Requires the Lewontin Conditions.
      *   *Placement:* **After** Multiple Descriptions.
      *   *Reasoning:* If you introduce this too early, students treat "Replicator" as the *only* unit of selection (the Gene's Eye dogma). By placing it after "Multiple Descriptions," you use it to solve the problem created by the friend's claim. The friend says the math is equivalent; the Replicator/Vehicle distinction asks: "Which entity is actually doing the copying and which is doing the dying?" This moves the debate from bookkeeping to mechanism.

  5.  **The Conflict Criterion (The Decision):**
      *   *Concept:* Group selection is causally necessary only when selection at the lower level (individual) opposes selection at the higher level (group).
      *   *Dependency:* Requires all previous steps.
      *   *Why last:* This is the operational test. It distinguishes "Group Benefit" from "Group Selection."

  ### 2. Evaluation of Your Invented Example

  **The Scenario:** Larvae from different parents fuse into a colony. Shared canal. Some cells become sterile defenders (die with colony). Colony reproduces via fragmentation. Neighbors are not relatives.

  **Verdict:** This example is **strong enough to carry the session**, but it contains a specific trap that you must exploit rather than avoid.

  **What it has that the session needs:**
  1.  **Non-Kin:** It explicitly blocks the "Kin Selection" escape route students will try to use.
  2.  **Sterility:** It creates a stark fitness cost at the cell level (fitness = 0 for defenders).
  3.  **Colony Reproduction:** It establishes the colony as a potential Vehicle.

  **What it lacks (and why it is instructive):**
  *   **The Lack:** In your description, the defenders *cannot* reproduce. This removes Within-Group selection pressure. If a cell *cannot* cheat, there is no conflict. Without conflict, the colony looks simply like a new "Individual" (a Major Transition in Individuality) rather than a group undergoing selection.
  *   **Is it Fatal?** No, but you must modify the scenario live on the whiteboard to make it work.
  *   **The Fix:** Introduce a **mutation**. Ask the students: "Suppose a mutant cell arises that *refuses* to become a defender but still benefits from the colony's protection and gets included in the reproductive fragment."
      *   Now you have Within-Group selection (Mutant > Defender).
      *   Now you have Between-Group selection (Colony with Defenders > Colony without).
      *   Now the "Levels of Selection" question becomes urgent. If the mutant spreads, the colony collapses. If defenders persist, group selection must be overpowering individual selection.

  **Instruction:** Use the example to show the continuum between "Group Selection" and "New Individual." Tell the students: *"Your friend says this is just individual selection because the colony is the reproducer. I say this is group selection because the cells are the replicators. The distinction lies in where the conflict is."*

  ### 3. Misconceptions and Interventions

  | Misconception | Origin | When to Head Off | The Move |
  | :--- | :--- | :--- | :--- |
  | **"Gene's-Eye View denies Group Selection."** | Pre-existing (Dawkins pop-sci). | **Minute 15** (After Multiple Descriptions). | Explicitly state: "The Gene's Eye view is about *replication*. Group selection is about *vehicle interaction*. A gene can replicate best by building a group vehicle that outcompetes other groups." |
  | **"If groups differ in productivity, it is Group Selection."** | Emergent (Intuitive). | **Minute 50** (During Conflict Criterion). | Draw two groups. Group A produces more offspring than Group B. Ask: "Did the group cause this, or did Group A just have better individuals?" Require them to check *within-group* fitness differentials. |
  | **"Group Selection is the theory that rescues Altruism."** | Pre-existing (Old debate). | **Minute 5** (Intro). | Reframe: "Group selection is not a theory of altruism. It is a theory of population structure. Altruism is just one possible outcome. Selfish traits can also be selected at the group level if they help the group win." |
  | **"Mathematical Equivalence = Causal Identity."** | Emergent (From Friend's claim). | **Minute 35** (Replicator/Vehicle). | Use the "Bookkeeping" analogy. "I can describe a car crash as 'metal deforming' or 'kinetic energy dissipating.' Both are mathematically true. But if I want to prevent crashes, I need to know which description identifies the *cause* (brakes vs. material)." |
  | **"Groups must be conscious/cooperative."** | Pre-existing (Anthropomorphism). | **Minute 20** (Nested Hierarchy). | Use bacteria or your larvae. Emphasize that "Group" is a statistical clustering of interaction, not a social contract. |

  ### 4. The Final Assessment Question

  You need a question that forces them to look at **within-group fitness differentials**, not just group outcomes. A student who has only learned vocabulary will look at the group benefit. A student who understands the mechanism will look at the individual cost.

  **The Question:**
  > "Consider a trait 'T' that increases the survival rate of the colony.
  >
  > **Case 1:** Within every colony, individuals *with* trait T reproduce faster than individuals *without* it. Colonies with more T-individuals also outcompete colonies with fewer.
  >
  > **Case 2:** Within every colony, individuals *with* trait T reproduce slower than individuals *without* it. However, colonies with more T-individuals outcompete colonies with fewer, such that trait T increases in the total population.
  >
  > In which Case is 'Group Selection' the *only* adequate causal explanation for the spread of T? Why is the other explanation insufficient?"

  **The Answer Key:**
  *   **Case 1:** This is **Individual Selection**. The trait spreads because it benefits the individual. The group benefit is incidental (a byproduct). You do not *need* group selection to explain this.
  *   **Case 2:** This is **Group Selection**. Individual selection is acting *against* the trait (T has lower fitness within groups). The only force that can overcome this negative within-group slope is positive between-group selection.
  *   **Why students fail:** They will pick both, arguing "both benefit the group." You want them to recognize that in Case 1, invoking group selection is redundant (Occam's Razor), whereas in Case 2, it is necessary.

  ### 5. What to Refuse to Cover

  You have 80 minutes. You must explicitly exclude three topics to keep focus. Say this out loud at the start:

  1.  **"We will not do the History."** (Wynne-Edwards vs. Williams).
      *   *Say:* "Knowing who lost the argument in 1966 does not help you model the system in front of you today. We are doing mechanics, not historiography."
  2.  **"We will not derive the Price Equation."**
      *   *Say:* "My friend the ecologist loves the math. We will use the *logic* of the partitioning, but we will not spend 80 minutes on algebra. If you want the proofs, see me after class."
  3.  **"We will not solve the 'Major Transition' problem."**
      *   *Say:* "My larvae example looks like a new individual evolving. Distinguishing a 'high-cohesion group' from a 'new organism' is a PhD thesis in itself. Today we only distinguish the *selection pressures*, not the final ontological status."

  ### 6. The Friend's "Bookkeeping" Claim: Destination or Dispute?

  Do not treat your friend's claim as false, but treat it as **incomplete**.

  *   **The Truth:** Mathematically, he is right. The Price Equation allows you to partition selection however you like. You *can* rewrite group selection as individual selection with contextual effects.
  *   **The Loss:** If you stop there, you lose **Causal Power**.
  *   **How to stage it:**
      *   Tell the students: "My friend says it is all bookkeeping. He is mathematically correct. But science is not just bookkeeping; it is explanation."
      *   *Analogy:* "I can explain a famine by 'lack of food' (group level) or by 'individuals starving' (individual level). Both describe the same death. But if I want to stop the famine, sending food to the region (group intervention) works; telling individuals to 'stop starving' (individual intervention) does not."
      *   **Resolution:** The session's destination is not to prove the friend wrong, but to prove that **causal explanation requires identifying the level where the variance is heritable and the conflict lies.**
      *   **The Verbal Dispute:** Acknowledge that part of the disagreement is verbal. If "Individual Selection" is defined broadly enough (inclusive fitness + contextual effects), it swallows everything. But if "Individual Selection" implies mechanisms acting on individual phenotypic variance *within* a group, then Group Selection is distinct. Tell the students: *"Define your terms, and the argument often vanishes. But keep the terms that give you predictive power."*

  ### Summary of the 80 Minutes

  *   **00-10:** Intro. Lewontin's 3 Conditions. State the Friend's "Bookkeeping" Thesis.
  *   **10-30:** Hierarchy & Multiple Descriptions. (Friend is right about math). Introduce Larvae Example (without mutation yet).
  *   **30-50:** Replicator vs. Vehicle. Add the "Cheater Mutation" to the Larvae Example. (Friend is wrong about causality).
  *   **50-70:** The Conflict Criterion. Within-group vs. Between-group slopes. Work through the Final Assessment Question together.
  *   **70-80:** Conclusion. Equivalence is mathematical; Causality is mechanistic. Assign reading (e.g., Okasha or West et al.) for the math they didn't see today.
