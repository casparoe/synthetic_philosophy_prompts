prompt: |-
  I have been defending a view I call perceptualism about aesthetic value: the aesthetic value of an artwork is entirely determined by its perceptible properties. On this view, a perfect forgery — one indistinguishable from the original in every perceptible respect, under any possible sensory modality or scientific analysis — is aesthetically just as valuable as the original. Its provenance may have historical, sentimental, or monetary value, but not aesthetic value. I am a graduate student in philosophy of art, and I have been arguing for this in a seminar; my interlocutors keep appealing to the "authenticity" intuition, but I want to know what would actually count against the view, not just what makes people uncomfortable.

  Please give me a map of the view's exposure. What observations, arguments, intuitions, formal results, or possible cases would count against perceptualism, and what would have to be true for it to be false? I am especially interested in the following: (a) the case where a perfect forgery is created and then the original is destroyed, so that the forgery is now the only remaining object with those perceptible properties — does its aesthetic value change, and if so, is that a defeater? (b) the case where a work believed to be an original is later discovered to be a forgery — if our aesthetic evaluation changes upon discovery, does that show that aesthetic value is not perceptible-only, or only that our experience of the work changes? (c) the two-worlds case: in world A, a work is painted by a famous artist; in world B, it is a perfect forgery created by a different artist, with identical perceptible properties — if we think the work in world A is more aesthetically valuable, is that a defeater, and can the perceptualist reply that the difference is not aesthetic but historical without trivializing the view? (d) the possibility of aesthetic properties that are not perceptible but are nonetheless aesthetic, such as being original, inventive, expressive of a particular historical moment, or a solution to a problem in the medium — are these aesthetic properties, and if so, does perceptualism collapse? (e) a forgery that is not a copy of any existing work but is an entirely new work created in the style of a famous artist, later discovered to be a forgery, where the forger's intention was not to deceive but to honor the artist — does the intention matter, and what does that show? Also, what does perceptualism predict that its rivals do not, and are those predictions anything more than conceptual?

  I would like the defeaters ranked from fatal to merely awkward, with an explicit distinction between evidence that would be decisive and evidence that would merely be awkward. I also want to know what the view's defenders would themselves concede as counting against them, not just what critics say, and which of these defeaters are live rather than merely logically possible. Finally, I want an honest assessment of whether the view risks anything at all or has been insulated by qualifications — and if it has, whether that is a problem for a view of this kind. Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Graduate student in philosophy of art.
      *   **Topic:** Defending "Perceptualism" about aesthetic value (aesthetic value is *entirely* determined by perceptible properties).
      *   **Core Claim:** Perfect forgeries are aesthetically equivalent to originals. Provenance affects historical/monetary value, not aesthetic value.
      *   **Goal:** A "map of the view's exposure." What counts *against* it? What would make it false?
      *   **Specific Cases to Address:**
          *   (a) Forgery survives, original destroyed.
          *   (b) Believed original discovered to be forgery (evaluation change).
          *   (c) Two-worlds case (famous artist vs. forger, identical properties).
          *   (d) Non-perceptible aesthetic properties (originality, inventiveness, etc.).
          *   (e) Forgery as homage/new work in style (intention).
      *   **Requirements:**
          *   Rank defeaters (Fatal vs. Awkward).
          *   Distinguish decisive evidence vs. merely awkward.
          *   Include what *defenders* concede (internal critique).
          *   Identify "live" defeaters vs. logical possibilities.
          *   Assess insulation/trivialization risk.
          *   Predictions of Perceptualism vs. Rivals.
          *   Tone: Academic, rigorous, American English.

  2.  **Deconstruct Perceptualism:**
      *   *Core Thesis:* Aesthetic Value (AV) supervenes on Perceptible Properties (PP). If $PP(x) = PP(y)$, then $AV(x) = AV(y)$.
      *   *Key Distinction:* Aesthetic Value vs. Artistic/Historical/Monetary Value.
      *   *Key Proponents:* Clive Bell (Formalism), Frank Sibley (aesthetic concepts require taste/perception, though he's nuanced), Kendall Walton (categories of art - *wait, Walton is a major opponent* via "Categories of Art").
      *   *Key Opponents:* Nelson Goodman ("Art and Authenticity"), Kendall Walton, Arthur Danto ("Artworld"), Jerrold Levinson (historical definitions).

  3.  **Address Specific Cases (Drafting the Content):**

      *   *(a) Forgery survives, original destroyed:*
          *   *Perceptualist:* AV stays the same. It's the same PP.
          *   *Opponent:* If we value it *more* because it's now the "last one," is that aesthetic?
          *   *Verdict:* Awkward, not fatal. Perceptualist can say the *context* changed our access, not the value inherent in the object.

      *   *(b) Believed original -> Discovered forgery:*
          *   *Perceptualist:* Evaluation change is psychological/sociological, not ontological. The *experience* changed, not the *value*.
          *   *Opponent:* If experience is the locus of value, and experience changed due to non-perceptible knowledge, then PP isn't all that matters.
          *   *Verdict:* Live and strong. This attacks the link between PP and Experience.

      *   *(c) Two-Worlds Case:*
          *   *Perceptualist:* AV is identical. Difference is historical.
          *   *Opponent:* If "being by Picasso" enhances the aesthetic experience (Walton), then it's an aesthetic property.
          *   *Verdict:* Theoretical stalemate unless we define "aesthetic" strictly.

      *   *(d) Non-perceptible Aesthetic Properties:*
          *   *Examples:* Originality, boldness, derivative.
          *   *Perceptualist:* These are art-historical judgments, not aesthetic. "Bold" must be seen to be aesthetic. "Original" is relational.
          *   *Opponent:* You can't appreciate the *boldness* without knowing the history. Therefore, history is part of the aesthetic.
          *   *Verdict:* **Fatal if conceded.** If "originality" is an aesthetic property, Perceptualism dies.

      *   *(e) Homage Forgery (Intention):*
          *   *Perceptualist:* Intention doesn't matter for AV, only PP.
          *   *Opponent:* Intention determines the *category* (Walton), which determines how we perceive it.
          *   *Verdict:* Strong, relies on Walton's argument.

  4.  **Ranking Defeaters (Fatal vs. Awkward):**
      *   *Fatal:* Demonstrating that relational/historical properties are *constitutive* of aesthetic properties (Goodman/Walton). Showing that "aesthetic experience" necessarily involves cognitive knowledge of origin.
      *   *Awkward:* Intuitions about monetary worth, sentimental attachment, the "shock" of discovery.
      *   *Insulation Risk:* If Perceptualism defines "aesthetic" so narrowly that it excludes "originality" or "influence," does it become trivial? Yes, this is a major risk.

  5.  **Refining the Argument (The "Walton/Goodman" Challenge):**
      *   Nelson Goodman's *Art and Authenticity* is the biggest hurdle. He argues that knowing a work is a forgery changes how we *look* at it, thus changing the perceptual experience itself.
      *   Kendall Walton's *Categories of Art* argues that aesthetic properties (like "serene" or "dynamic") depend on the category (e.g., "Guernica" as a painting vs. "Guernica" as a relief). The category is determined by history/intention, not just PP.
      *   *Crucial Point:* If aesthetic properties supervene on PP *plus* Category, and Category is historical, then AV does not supervene on PP alone.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the position (Formalist/Perceptualist lineage).
      *   **The Map of Exposure:** Categorize objections.
      *   **Ranking Defeaters:** Fatal, Serious, Awkward.
      *   **Addressing Specific Cases (a-e):** Integrate into the ranking or treat separately? Better to treat them within the ranking analysis to show *why* they rank where they do.
      *   **Defender Concessions:** What do Perceptualists admit? (e.g., Artistic value $\neq$ Aesthetic value).
      *   **Insulation/Trivialization:** The "No True Scotsman" risk.
      *   **Predictions:** What does Perceptualism predict? (e.g., Blind tests should yield equal ratings).
      *   **Conclusion:** Honest assessment.

  7.  **Drafting the Content - Specific Considerations:**
      *   *Case (a):* If the original is destroyed, the forgery becomes the "original" in terms of causal history for future works? No, keep it simple. If AV is intrinsic to PP, destruction of the causal source shouldn't matter. If it does matter, Perceptualism is false.
      *   *Case (b):* The "Psychological vs. Ontological" distinction. Perceptualists must hold that the *value* didn't change, only our *access* to it. This is hard to maintain if value is grounded in experience.
      *   *Case (d):* This is the definition battle. If "originality" is aesthetic, Perceptualism is dead. Perceptualists must argue originality is *artistic* or *historical*, not *aesthetic*.
      *   *Insulation:* If Perceptualism says "Only PP count," and then defines "Aesthetic Value" as "Value derived from PP," it's tautological. It needs to claim that *our actual concept* of aesthetic value is limited to PP.

  8.  **Refining the "Fatal" Criteria:**
      *   A defeater is fatal if it shows that two objects with identical PP *cannot* have identical AV in principle, not just that we *think* they don't.
      *   Goodman's argument is the strongest: The knowledge of authenticity alters the *perceptual discrimination* itself. If I can't see the difference *now*, I might learn to see it *later* because I know one is a forgery. Thus, PP are not fixed; they are epistemically penetrable.
      *   Walton's argument: Aesthetic properties (e.g., "sad") depend on categories. Categories depend on history. Therefore, Aesthetic Properties depend on History.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about "what defenders concede"?
      *   *Adjustment:* Need to explicitly mention that sophisticated perceptualists (like Sibley or modern formalists) distinguish between *aesthetic* and *artistic* value. They concede forgeries lack artistic value but maintain aesthetic parity.
      *   *Check:* Did I address the "insulation" risk?
      *   *Adjustment:* Yes, the "trivialization" objection is key. If the view is true by definition, it's uninteresting.
      *   *Check:* American English. (Ensure spelling and idioms match).

  10. **Final Polish:** Organize with clear headings. Ensure the ranking is explicit. Make sure the distinction between "Aesthetic" and "Artistic" is clear, as that's the Perceptualist's main shield.

  *(Self-Correction on Case A)*: If the original is destroyed, does the forgery's value change? Perceptualist says No. Opponent says Yes (it's now the unique causal source). If the Opponent is right, is it fatal? Yes, because it shows historical status affects AV.
  *(Self-Correction on Case E)*: Intention. If intention determines the category (Walton), and category determines aesthetic properties, then intention matters. This is a strong argument against Perceptualism.

  11. **Finalizing the Ranking:**
      *   **Fatal:** The Walton/Goodman argument (Category dependence of aesthetic properties). The collapse of the Aesthetic/Artistic distinction.
      *   **Serious/Live:** The "Experience" argument (Case B). If aesthetic value is grounded in experience, and knowledge changes experience, knowledge matters.
      *   **Awkward:** Intuitions about scarcity/uniqueness (Case A). Monetary/Sentimental confusion.

  12. **Writing the Response.** (Proceed to generate output based on these thoughts).
answer: |-
  This is a sophisticated position with a distinguished lineage (touching on Formalism, Clive Bell, and aspects of Frank Sibley), but it faces formidable challenges in contemporary analytic aesthetics. The debate largely hinges on the definition of "aesthetic value" and the relationship between perception, cognition, and context.

  Below is a map of your view's exposure, ranked by the severity of the threat. I have distinguished between objections that are merely intuitive (awkward) and those that threaten the logical coherence or explanatory power of the view (fatal). I have also highlighted where defenders of perceptualism typically make concessions.

  ### I. The Ranking of Defeaters

  #### 1. Fatal Defeaters (Logical/Conceptual Collapse)
  These arguments suggest that Perceptualism is either false or trivially true by stipulation.

  *   **The Category-Dependence of Aesthetic Properties (The Walton Objection):**
      *   **The Argument:** Kendall Walton, in *Categories of Art*, argues that aesthetic properties (e.g., being *serene*, *dynamic*, *garish*) are not determined solely by perceptible properties (PP). They depend on the *category* under which the work is perceived (e.g., painting, sculpture, cubist work). Which category is correct is determined by historical facts (artist's intention, art-historical context), not just PP.
      *   **Why it is Fatal:** If aesthetic properties supervene on PP + Category, and Category is determined by history/provenance, then aesthetic value does not supervene on PP alone. A perfect forgery belongs to a different category (e.g., "Forgery of Picasso" vs. "Picasso"). Therefore, it possesses different aesthetic properties, even if PP are identical.
      *   **Perceptualist Concession:** Defenders often concede that *artistic* value is category-dependent but insist *aesthetic* value is not. However, if "being derivative" or "being innovative" are experienced aesthetically, this distinction collapses.
      *   **Status:** **Live and Decisive.** This is the standard objection in graduate seminars for a reason.

  *   **The Trivialization/Insulation Objection:**
      *   **The Argument:** If you define "aesthetic value" strictly as "value derived from perceptible properties," your thesis is tautological. If you claim it matches our *ordinary* concept of aesthetic value, you must account for why we routinely describe historical properties (e.g., "groundbreaking," "derivative," "influential") as aesthetic judgments.
      *   **Why it is Fatal:** If Perceptualism survives only by stipulating that "originality" is not an aesthetic property, it risks becoming an empty verbal maneuver. It saves the theory by shrinking the domain of "the aesthetic" until nothing counter-evidence remains.
      *   **Status:** **Live.** This attacks the motivation for the view.

  #### 2. Serious Defeaters (Empirical/Phenomenological Threats)
  These arguments suggest that Perceptualism fails to account for how aesthetic experience actually functions.

  *   **The Epistemic Penetrability of Perception (The Goodman Objection):**
      *   **The Argument:** Nelson Goodman (*Art and Authenticity*) argues that knowing a work is a forgery changes how we *see* it. Even if we cannot currently detect a difference, the knowledge that one is a forgery trains us to look for differences. Thus, the PP are not fixed; the *perceptual experience* is cognitively penetrable.
      *   **Why it is Serious:** Perceptualism assumes PP are stable inputs. If knowledge of provenance alters the perceptual input (by changing attention or discrimination), then provenance indirectly determines aesthetic value by altering the PP available to the viewer.
      *   **Status:** **Live.** Empirical psychology of art supports the idea that top-down processing affects visual perception.

  *   **The "Change of Mind" Case (Your Case B):**
      *   **The Argument:** When a work is re-attributed from Master to Pupil, our aesthetic evaluation changes (e.g., "It looks clumsy now"). If the PP haven't changed, the change in evaluation must be due to the change in historical belief.
      *   **Perceptualist Reply:** The *value* didn't change; our *access* to it did. We were previously hallucinating value that wasn't there.
      *   **Why it is Serious:** This makes the Perceptualist view revisionist. It implies that for centuries, critics have been systematically wrong about the aesthetic value of artworks because they lacked correct provenance data. This is a high bullet to bite.
      *   **Status:** **Live.** It forces the Perceptualist to claim that most art history is aesthetically misguided.

  #### 3. Awkward Defeaters (Intuitive Friction)
  These are uncomfortable but can be parried by distinguishing aesthetic value from other types of value.

  *   **The Scarcity/Uniqueness Case (Your Case A):**
      *   **The Scenario:** Original destroyed; forgery remains.
      *   **The Objection:** The forgery gains value because it is now the unique causal source of future impressions.
      *   **Perceptualist Reply:** This is *historical* or *relic* value, not aesthetic. The visual experience remains identical.
      *   **Status:** **Awkward but manageable.** Most philosophers accept a distinction between the value of a relic (Washington's axe) and the value of an artwork.

  *   **The Intentional/Homage Case (Your Case E):**
      *   **The Scenario:** Forgery created as homage, not deception.
      *   **The Objection:** The intention changes the "aboutness" of the work.
      *   **Perceptualist Reply:** Intention is relevant to *meaning*, not necessarily to *sensory beauty*.
      *   **Status:** **Awkward.** This bleeds into the Walton objection. If the intention changes the category, it's fatal. If it only changes the semantic content, it's manageable.

  ---

  ### II. Analysis of Your Specific Cases

  Here is how the Perceptualist view fares against your specific scenarios, mapped against the defeaters above.

  **(a) The Surviving Forgery (Original Destroyed)**
  *   **Perceptualist Prediction:** Aesthetic value remains constant.
  *   **Defeater Potential:** **Low.** This is easily deflected as a confusion of aesthetic value with scarcity value. Unless the opponent can show that *scarcity itself* enhances the visual experience (e.g., via a "sacred" aura that alters perception), this is merely an intuition clash.
  *   **Verdict:** Awkward, not fatal.

  **(b) The Re-Attribution (Believed Original -> Discovered Forgery)**
  *   **Perceptualist Prediction:** Aesthetic value was always lower; we were just ignorant.
  *   **Defeater Potential:** **High.** This is the strongest phenomenological evidence against you. If aesthetic value is grounded in *experience* (as most Perceptualists claim), and the experience changes upon learning the truth, then the truth (a non-perceptible property) is a constituent of the experience.
  *   **The Trap:** If you say "The experience *shouldn't* change," you are prescribing rather than describing. If you say "The experience changes, but the value doesn't," you sever the link between value and experience, which undermines the motivation for Perceptualism.
  *   **Verdict:** Serious/Live.

  **(c) The Two-Worlds Case**
  *   **Perceptualist Prediction:** Aesthetic value is identical across worlds.
  *   **Defeater Potential:** **Medium.** This relies on the "Aesthetic vs. Artistic" distinction. If your interlocutors argue that "being by Picasso" makes the work *look* bolder (Walton), then the worlds are not perceptually identical in terms of *aesthetic properties*, even if they are in terms of *physical properties*.
  *   **Verdict:** Depends on whether you can successfully defend the Formalist distinction between "aesthetic" (sensory) and "artistic" (historical/relational) properties.

  **(d) Non-Perceptible Aesthetic Properties (Originality, Inventiveness)**
  *   **Perceptualist Prediction:** These are not aesthetic properties; they are art-historical properties.
  *   **Defeater Potential:** **Fatal.** This is the definition battle. If "originality" is an aesthetic property (as many argue it is, because we *appreciate* it aesthetically), Perceptualism is false.
  *   **The Trap:** To save the view, you must argue that we appreciate originality *only* insofar as it manifests in perceptible novelty. But if two works are perceptually identical, and one is original and one derivative, and we value the original *more*, Perceptualism fails.
  *   **Verdict:** Fatal if the opponent successfully categorizes "originality" as aesthetic.

  **(e) The Homage Forgery (Intention)**
  *   **Perceptualist Prediction:** Intention is irrelevant to aesthetic value.
  *   **Defeater Potential:** **Medium/High.** This ties into the "Category of Art" argument. If the intention determines the category (e.g., "Parody" vs. "Serious Work"), and the category determines the aesthetic properties (e.g., "witty" vs. "clumsy"), then intention matters.
  *   **Verdict:** Serious. It shows that PP alone cannot fix the aesthetic properties without knowing the intention-based category.

  ---

  ### III. What Defenders Concede (Internal Critique)

  To defend this view credibly, you must acknowledge what sophisticated Perceptualists (like Sibley or contemporary Formalists) concede:

  1.  **Concession on Artistic Value:** They concede that forgeries lack *artistic* value. They admit that art is a historical kind. They argue only that *aesthetic* value (a subset of artistic value) is perceptual.
      *   *Risk:* Critics argue this distinction is artificial. If artistic value is largely constituted by aesthetic value, and aesthetic value is perceptual, the view becomes marginal.
  2.  **Concession on Perception Training:** They concede that knowing a work is a forgery might help us *see* flaws we missed.
      *   *Risk:* This concedes Goodman's point: provenance aids perception. If provenance aids perception, and perception determines value, provenance is instrumentally necessary for accessing value.
  3.  **Concession on "Aesthetic" Definition:** They concede that if "aesthetic" is defined broadly to include cognitive appreciation of context, Perceptualism is false. They must argue for a narrow definition.
      *   *Risk:* This invites the Trivialization Objection (see above).

  ---

  ### IV. Predictions and Insulation

  **What Perceptualism Predicts (That Rivals Do Not):**
  1.  **Blind Testing:** In a double-blind test where experts cannot distinguish Original from Forgery, they should assign identical aesthetic ratings. (Rivals like Goodman predict that even without knowing, the *knowledge that one might be a forgery* alters the experience).
  2.  **Irrelevance of Restoration:** If a restoration is perceptually indistinguishable from the original paint, the aesthetic value should be identical, even if the material continuity is broken. (Historical views disagree).
  3.  **Digital Reproduction:** A perfect digital scan of a painting should have the same aesthetic value as the canvas, provided the perceptual experience is identical. (Aura/Authentication views disagree).

  **The Insulation Problem:**
  You asked if the view has been insulated by qualifications. **Yes, it has.**
  *   **The Problem:** By shunting all counter-evidence (originality, intention, history) into the bucket of "non-aesthetic value" (historical, monetary, cognitive), Perceptualism protects itself from falsification.
  *   **Is this a problem?** Yes. A theory that explains away all counter-intuitions by redefining terms loses explanatory power. If the ordinary concept of "aesthetic appreciation" includes appreciating a work's historical ingenuity, Perceptualism is not a theory of *our* concept of aesthetic value, but a revisionary proposal for a new one.
  *   **Defense:** You must argue that the ordinary concept is *confused* and that Perceptualism clarifies it. You cannot simply say "That's not aesthetic." You must argue "That *shouldn't count* as aesthetic."

  ### V. Honest Assessment

  **Is the view at risk?**
  Yes. The view is currently a minority position in analytic aesthetics precisely because of the Walton/Goodman arguments. The consensus is that while perceptible properties are *necessary* for aesthetic value, they are not *sufficient*.

  **What would make it false?**
  1.  **Demonstrating that "Aesthetic Properties" are Relational:** If you can be forced to admit that properties like "bold," "derivative," or "serene" depend on historical context to be correctly identified, Perceptualism collapses.
  2.  **Demonstrating that Experience is Cognitive:** If aesthetic value is grounded in experience, and experience is cognitively penetrable (affected by knowledge of provenance), then provenance affects value.

  **Strategic Advice for the Seminar:**
  Do not defend the view by saying "Provenance doesn't matter." Defend it by saying: **"Provenance matters to the *art*, but not to the *beauty*."**
  *   Accept that the forgery is a lesser *artifact*.
  *   Insist that the *visual experience* it affords is identical.
  *   Argue that conflating the two (artistic status and visual beauty) is a category mistake that leads to snobbery.

  However, be prepared for the Walton counter: **"You cannot have the visual experience of 'Picasso's boldness' without knowing it is by Picasso, because 'boldness' is a property relative to the category 'Picasso Painting'."** If you cannot answer this without denying that "boldness" is an aesthetic property, the view is in trouble.
