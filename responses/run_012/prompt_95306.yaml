      *   **Goal:** Understand the nuance/correct theory before publishing, to avoid embarrassment in the letters column.
      *   **Tone:** Intellectual, slightly skeptical, conversational but rigorous (fitting an ideas-piece writer).

  2.  **Deconstruct the Theory (Handicap Principle/Costly Signaling):**
      *   *Origin:* Amotz Zahavi (biologist).
      *   *Core Mechanism:* Signals are honest because they are costly *relative to the quality of the signaler*.
      *   *Key Insight:* It's not about the absolute cost; it's about the *marginal cost*.
      *   *The User's Misconception:* "More waste = better signal."
      *   *The Correction:* "The cost must be affordable for the high-quality type but prohibitive for the low-quality type."

  3.  **Address the "Differential" Comment:**
      *   The friend wasn't dodging; they were stating the mathematical core of the theory.
      *   *Differential Cost:* The cost of the signal must impact a low-quality individual *more* than a high-quality individual.
      *   *Example:* A peacock with good genes can afford the tail's energy drain. A weak peacock dies if it tries to grow the same tail.
      *   *Example:* A rich person burning \$100k is a signal. A poor person burning \$100k is bankruptcy (not a sustainable signal).

