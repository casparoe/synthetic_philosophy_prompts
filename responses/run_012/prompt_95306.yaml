  5.  **Formulate the Counter-Argument (The "Sweet Spot"):**
      *   Signaling requires an *equilibrium*.
      *   If the cost is too low, everyone fakes it (pooling equilibrium).
      *   If the cost is too high, no one does it (or only the reckless).
      *   The cost must be *just right* to separate the types (separating equilibrium).
      *   *Crucial Point:* Waste itself isn't the virtue; the *ability to bear the waste* is the signal.

