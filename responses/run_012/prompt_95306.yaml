      *   *College Degrees (Spence):* Correct (Michael Spence's job market signaling).
      *   *Fasting/Tithing/Ironman/Watches:* Generally correct applications.
      *   *The "More Waste = More Truth" Fallacy:* This is the critical error.
          *   *Wedding:* Burning *too much* money might signal irresponsibility rather than commitment.
