answer: |-
  Thank you. Please remain seated. I know the folding chairs are conspiring against your lower backs, and I know the sun has moved from behind that cloud to directly above this stage. I also know that I am the person standing between you and the reception table. So I will be brief.

  I am also, admittedly, the wrong person to be standing here.

  I sat where you are sitting exactly twenty years ago. I studied philosophy. I asked questions that had no answers, wrote papers that had too many words, and graduated into a world that didn't particularly need more philosophers. Today, I work in forecasting. My job is to look at plans—government projects, business ventures, big ambitious things—and tell the people in charge what usually happens to plans like theirs. I deal in base rates. I deal in the outside view.

  And this ceremony… well, this ceremony is the purest inside view there is.

  The genre of the commencement address requires me to tell you that you are exceptional. It requires me to say that the future is unwritten, that you are the authors of your destiny, and that the statistics do not apply to this specific group of people in this specific quad on this specific day. It is a genre built on the idea that you are the exception to the rule.

  My profession is built on the idea that there are no exceptions, only rules we haven't found yet.

  So, when the Board asked me to speak, I felt a distinct sense of discomfort. It felt like asking a meteorologist to give a toast at a wedding. You want him to say "Here's to love," and he's looking at the barometric pressure thinking, "Actually, there's a sixty percent chance of rain."

  But I realized that discomfort is exactly why I should be here. Because both stories—the one I usually tell, and the one I'm supposed to tell today—are traps if you take them too seriously.

  If I stand here and tell you that you are magic, that the world is yours for the taking, I am selling you a story. It's a nice story. It feels good. But it's an inside view. It ignores the fact that most people drift. It ignores luck. It ignores the fact that ten years from now, many of you will be doing something you never planned to do, in a city you didn't choose, for reasons you can't quite explain.

  But I also refuse to stand here and give you the deflationary version. I could tell you that most graduates change careers three times by thirty. I could tell you about student debt loads and housing markets. I could recite the statistics for how many of you will be doing something else in a decade.

  Some of you might think that would be honest. It isn't. That is just the opposite error dressed up as rigor. It is pretending that the past dictates the future so strictly that agency doesn't matter. That isn't wisdom; it's fatalism wearing a lab coat.

  Here is the truth I want you to take with you: The outside view is a discipline, not an oracle.

  When I look at base rates, I am looking at priors, not verdicts. But—and this is the part people forget—those base rates only have grip relative to a reference class that somebody chose. Choosing that class is an act of judgment. It can be lazy. It can be self-serving.

  Forecasters sometimes ping-pong between reference classes until they find one that flatters the answer they wanted. If I want a project to look safe, I compare it to similar projects that succeeded. If I want to kill it, I compare it to a broader category where things usually fail.

  You will do this too. You will do it with your lives.

  When you are scared, you will find a reference class that justifies your fear. You will say, "People like me don't start businesses," or "People with my degree don't make art." When you are arrogant, you will find a reference class that justifies your risk. You will say, "Look at all the founders who dropped out and succeeded."

  The honest form of modesty is modesty at both turns. You must be humble about the narrative you'd like to tell about yourself—that you are the hero, that you are unique. But you must also be humble about the class you've sorted yourself into to correct it.

  The inside view and the outside view are not rivals standing on either side of a question. They run in a loop. You need the story to know where you want to go, and you need the statistics to know how hard the road might be. But you must not let either one freeze you.

  And this leads me to the most important thing I have to say. Please listen closely, because this is where the parents who paid tuition and the faculty who graded your papers might disagree with me.

  The lesson of the outside view is not "expect less."

  It is tempting to think that knowing the odds means you should play it safe. If most startups fail, don't start one. If most artists struggle, don't make art. But timidity, too, is usually an inside-view story. It is a story you tell yourself about what you can handle.

  Once you see how wide the distribution really is, and how little of it anyone controls, you are actually licensed to make bolder, higher-variance choices. If you know that life is unpredictable for everyone—that the stable path is often an illusion anyway—then you might as well aim for something that matters to you.

  Knowing that the odds are long doesn't mean you shouldn't play. It means you shouldn't be surprised when it gets hard. It means you shouldn't take it personally when you fail. It means you can treat your life less like a masterpiece you must protect, and more like a series of experiments you are running.

  So, do not let the statistics crush you. But do not let the sentiment of this day intoxicate you.

  Hold the tension. Keep the loop running. Check your stories against the world, and check the world against your stories. And when you find yourself playing it safe because the base rates look scary, ask yourself if you're being prudent, or if you're just telling yourself a different kind of story.

  I promised the students I would keep this under ten minutes. The faculty will notice if I fumble the epistemology, and the parents will notice if I fumble the optimism. But mostly, I want you to notice that you are free. Not free from constraints, and not free from probability. But free to choose how you weigh them.

  Congratulations. Go get out of the sun.
