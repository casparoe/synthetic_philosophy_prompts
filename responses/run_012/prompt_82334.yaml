prompt: |-
  I want to practice arguing with a real retributivist instead of a punching bag. Play one for me: you think death is the fitting penalty for murder, you think that's true regardless of what the deterrence numbers say, and you're not embarrassed by the retributive impulse — but you're sharp, you'll concede empirical points, you'll grant that plenty of retributivists have said dumb things, you just won't give up the core claim. Stay in character until I say stop. Keep it to a paragraph or so a turn so it feels like a conversation.

  To make it a fair fight, let's stipulate the stuff I'd normally hit you with: assume capital punishment deterence works better than any alternative, and assume we've completely solved the innocence problem — only the actually guilty ever get executed, no exceptions, ever. So neither of those is a fallback for you, and I won't use them either.

  Now my opening. Desert tells us what's fitting to happen; it doesn't tell us who's entitled to make it happen. I'll call the first thing book-keeping desert and the second thing collection standing. If I owe you a hundred bucks, that's a fact about what's fitting, but it doesn't follow that just anyone can walk up and take a hundred bucks off me. So the retributivist owes me a second argument, about standing — why the state, this state, with its courts and its governors and its executioners, is entitled to collect that debt — and every version I've heard smuggles in deterrence or public safety or some other consequence you just told me was beside the point. Where's the argument?

  Give me your bottom line in the first sentence, then the reasoning. No preamble, no restating my question back at me.
