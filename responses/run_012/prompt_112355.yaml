answer: |-
  ### Brainstorming Notes: Anticipated Evasive Moves

  1.  **The "Ideal Type" Retreat:** When pressed on empirical contradictions (e.g., moral progress, stable coordination), she will likely retreat to the status of her categories as "ideal types." She will argue that no real society is purely Order or Conscience, so counter-examples merely show the mix, not the falsity of the types. *Counter:* Press whether a theory that explains everything by mixing ratios explains nothing.
  2.  **The "Division" Dodge:** When asked to prioritize one morality over the other or resolve a conflict, she will revert to her conclusion: "That is why we need the division of labour." She will treat the tension as a feature, not a bug, refusing to adjudicate the conflict. *Counter:* Force her to admit that in any single moment of decision, the division of labour collapses, and an agent must choose one master.
  3.  **The "Thick Background" Definition:** When pressed on the parasitism thesis in thin societies, she will likely argue that a society without thick order-morality isn't a moral society at all, but a state of nature. This defines away the counter-example rather than addressing the circularity. *Counter:* Ask if this means conscience is merely the luxury of the already orderly, rendering it powerless against systemic injustice.

  ***

  ### Interview Questions

  **1. The Burden of Proof**
  You argue that Order and Conscience morality do not disagree on which acts are permitted, but only on where the burden of proof sits: either on the deviator to justify breaking the rule, or on the enforcer to justify imposing it. If the output—the permissibility of the act—remains the same once the burden is discharged, haven't you reduced a moral disagreement to a merely verbal dispute about procedure? Is there any substantive disagreement left underneath, or have you simply described two ways of saying "yes"?

  *   **Follow-up:** If you say there is a substantive difference, does it not follow that one placement of the burden is epistemically superior to the other in tracking moral truth, which would require you to abandon the symmetry your model relies on?
  *   **Second Follow-up:** You might reply that truth is less important than social function here, but if function is the only metric, doesn't that slide your account into pure pragmatism, stripping the moralities of any normative force?

  **2. The Parasitism Thesis**
  Your parasitism thesis claims conscience-morality functions only against a thick background of order-morality, otherwise becoming indistinguishable from doing as one likes. In a society where that background is thin—perhaps due to corruption or collapse—does your theory imply that conscientious objection becomes impossible? And if so, isn't the thesis circular: conscience is only valid where order already reigns, meaning conscience can never legitimately challenge the foundation of order itself?

  *   **Follow-up:** If conscience cannot challenge the foundation because it relies on that foundation to be distinct from whim, isn't conscience-morality merely a safety valve for order-morality rather than a independent source of value?
  *   **Second Follow-up:** You may argue that this is why we need the division of labour, but if conscience is structurally incapable of operating when order fails, what utility does it have in the exact moments where moral progress is most desperate?

  **3. The Cost-Bearer Problem**
  Let's force the cost-bearer problem into the open with a concrete case. Imagine a cooperative scheme, like a water rationing system during a drought, which everyone else regards as harmless and necessary. A single member refuses, on conscience, to take part, claiming the distribution formula is unjust. Order-morality treats them as an exception to be scheduled around; conscience-morality cannot explain why others should bear the cost of this refusal. In this specific instance, isn't the conscientious objector effectively free-riding on the order-morality of their neighbours to subsidize their own virtue?

  *   **Follow-up:** If you deny they are free-riding, you must provide a mechanism for cost distribution that conscience-morality lacks; if you admit it, haven't you conceded that conscientious refusal is morally permissible only when it is costless, which empties it of its paradigm achievement?
  *   **Second Follow-up:** You might suggest the community should absorb the cost as a price of pluralism, but if the refusal threatens the scheme's collapse, at what point does the division of labour mandate suppressing the conscientious objector to save the order they parasitize?

  **4. Empirical Claims on Stability**
  You suggest order-morality produces stable coordination. Is this an empirical claim about human psychology and social systems, or a conceptual truth within your model? If it is empirical, what evidence would count against it? Could there not be societies where rigid rule-compliance leads to brittle collapse rather than stability, and would your theory be falsified if high-order societies proved less stable than high-conscience ones?

  *   **Follow-up:** If you retreat to saying this is only true of "ideal" orders, doesn't that sever the link between your theory and the actual folk morality you claim to be describing?

  **5. National Labels and Essentialism**
  In your broader work, you have mapped these ideal types onto German and American moral cultures respectively. Are these labels doing genuine explanatory work regarding historical and institutional development, or are they a polite way of essentialising two nations? What specific evidence would show that you have mapped them onto the wrong pair, or is the mapping insulated from falsification by the flexibility of the "ideal type"?

  *   **Follow-up:** If the mapping is heuristic, why tie it to specific nations at all rather than abstract structures, unless you intend to make a claim about national character that risks the essentialism you disavow?

  **6. Folk Morality vs. Reconstruction**
  You describe these as types of "folk morality," yet the distinctions you draw—particularly regarding burden of proof and second-order practices—seem highly technical. What makes this a description of how people actually think, rather than a philosopher's reconstruction imposed upon them? If you interviewed ordinary people, would they recognize these burdens of proof, or are you attributing a sophistication to the folk that only exists in your analysis?

  *   **Follow-up:** If it is a reconstruction, on what grounds do you claim it resolves folk conflicts rather than simply replacing them with a philosophical framework that suits your own normative preferences?

  **7. Adjudicating Conflict**
  Here is the domain's own question: when these two moralities conflict in a specific agent, which has the better of it? You conclude neither is self-sufficient, but an agent cannot act on "neither"; they must choose compliance or refusal. If you refuse to prioritize one, aren't you leaving the agent with no decision procedure, and if you do prioritize one, haven't you abandoned the division of labour for a hierarchy?

  *   **Follow-up:** If you say the agent must feel the tension and act tragically, isn't that a description of psychological distress rather than a moral solution, leaving the question of right action unanswered?

  **8. Moral Progress and the vicious Reformer**
  You admit order-morality's blind spot is moral progress, which arrives first as a deviation. But if order-morality defines deviation as the paradigm failure, doesn't your account entail that the moral reformer is initially vicious by the lights of the prevailing morality? How can you explain moral progress without validating the judgment of the oppressors who correctly identify the reformer as a deviator failing their duty?

  *   **Follow-up:** If you say the reformer is virtuous only in hindsight, doesn't that make moral virtue entirely retrospective, denying the agent any access to moral truth at the moment of decision?

  **9. The Flawless Official**
  You identify the "flawless official" who substitutes correct procedure for judgment as the characteristic vice of order-morality. But if the division of labour requires order-morality to function, are you not necessitating a certain population of flawless officials to maintain the background? Is the vice actually avoidable, or is the "flawless official" the inevitable cost of the stability you value?

  *   **Follow-up:** If it is an inevitable cost, how do you justify imposing the risk of administrative cruelty on the minority who fall victim to the official's procedure, simply to maintain the background for conscience?

  **10. Description, Normativity, and Relativism**
  Finally, is the division of labour a description of how societies actually survive, or a normative proposal in disguise? If it is descriptive, it offers no guidance on how we ought to act; if it is normative, you are prescribing a balance without a metric for the right ratio. Does this collapse into relativism, where the "right" morality is simply whichever one keeps the specific society running, regardless of its justice?

  *   **Follow-up:** If you argue it avoids relativism by preserving both, doesn't that require a third, Archimedean standpoint to judge the balance, which contradicts your claim that we are embedded within these folk moralities?
  *   **Second Follow-up:** You might claim the balance is found in practice, but if practice is just the clash of the two moralities, haven't you defined the solution as the problem itself, leaving us with a theory that observes conflict but cannot resolve it?
