      You are conflating macro-structural access with micro-level permission. The EU argument is a red herring for the "ordinary life" test. For ninety percent of citizens, the freedom to work in Lisbon is theoretical, whereas the freedom to renovate a kitchen or hire a nanny is immediate. My yardstick measures the friction of daily existence, not the potential for expatriation. Sweden's EU membership grants a latent liberty, certainly, but it does not reduce the number of forms a Stockholm shopkeeper must file compared to one in Bergen. If we are measuring the state's grip on the routine, geopolitical access is noise.

