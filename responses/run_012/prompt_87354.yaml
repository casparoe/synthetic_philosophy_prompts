      *(Refining the Crypto point)*: Impagliazzo's Worlds are relevant here. If $\mathsf{P} \neq \mathsf{NP}$ but only in worst-case (Heuristica), crypto doesn't exist. For crypto to exist, we need Minicrypt or Cryptomania (Average-case hardness). The Theorist is conflating $\mathsf{P} \neq \mathsf{NP}$ with Crypto.

