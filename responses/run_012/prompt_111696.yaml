answer: |-
  This is a classic and powerful objection, often raised against structural equation models and interventionist accounts (like James Woodward's). It exploits the tension between the **symmetry of mathematical equations** and the **asymmetry of causal relations**.

  Your intuition is correct: the argument fails, but to save interventionism, you must reject **Step (3)** (and consequently Step (4)). However, you are right to worry about the cost. Rejecting (3) requires you to commit to a specific metaphysical view about what structural equations represent.

  Here is the breakdown of where the argument goes wrong, why it looks plausible, and what you are buying into by rejecting it.

  ### 1. Which Step to Reject?
  You should reject **Step (3)**: *"An intervention on Y that changes Y will, by the inverse law, change X."*

  Under the interventionist account (and Structural Causal Models à la Pearl), this statement is false. An intervention on $Y$ does **not** propagate backward to $X$ via an inverse function.

  ### 2. Why Did It Look Plausible?
  The plausibility of Step (3) stems from conflating **algebraic equations** with **structural equations**.

  *   **Algebraic Equation:** $Y = f(X)$ is a constraint on the possible values of $X$ and $Y$. If this is a pure mathematical constraint, then yes, fixing $Y$ determines $X$. In this view, the variables are mutually constrained.
  *   **Structural Equation:** $Y := f(X)$ represents a **mechanism** or a **process**. It says that the value of $Y$ is *generated* by the value of $X$ via some physical process.

  Your friend's argument treats the relation between Temperature ($H$) and Reading ($T$) as an algebraic constraint that must hold in all possible worlds, including those where we intervene. Interventionism treats it as a mechanism that can be **broken** or **overridden**.

  When you intervene on $Y$, you are not solving the equation for $Y$; you are **replacing** the equation $Y := f(X)$ with a new equation $Y := y_{fixed}$. The original mechanism linking $X$ to $Y$ is severed. Therefore, the inverse law does not apply, and $X$ remains unchanged.

  ### 3. The Thermometer Case
  Here is how an interventionist handles your friend's thermometer example to make the cost of rejecting (3) acceptable.

  *   **The Model:** The normal operation of the thermometer is represented by the structural equation $T := h(H)$. This represents the physical mechanism of thermal expansion.
  *   **The Intervention:** You intervene on $T$ (the reading) by applying a lighter to the bulb. In interventionist notation, this is $do(T = t^*)$.
  *   **The Result:** This intervention **breaks** the link from $H$ to $T$. The equation $T := h(H)$ is suspended for the duration of the intervention. The mercury rises because of the lighter, not because of the ambient temperature.
  *   **The Asymmetry:** Because the mechanism is broken, the ambient temperature $H$ does **not** change to satisfy the inverse function $H := h^{-1}(T)$. The room does not get hotter because you heated the thermometer.
  *   **Conclusion:** Since an intervention on $T$ does not change $H$, $T$ does not cause $H$. Causation remains asymmetric.

  ### 4. What Are You Paying? (The Commitments)
  By rejecting Step (3), you are not giving up a premise of interventionism; you are clarifying its ontological commitments. However, there is a cost. You are committing to the **Modularity Thesis**.

  **The Modularity Thesis:**
  You must accept that the world is composed of distinct, autonomous mechanisms that can be disrupted independently. A structural equation is not a law of nature in the sense of a universal constraint (like conservation of energy); it is a description of a specific local mechanism.

  *   **Cost 1: Directionality is Primitive to the Model.** You cannot derive the direction of causation solely from the functional form $f$. You must know *which* equation represents the mechanism. The asymmetry is not in the math; it is in the assignment of the equation ($:=$ vs $=$).
  *   **Cost 2: Laws vs. Mechanisms.** You must distinguish between fundamental physical laws (which might be symmetric) and the structural equations used in causal modeling (which are asymmetric). Your friend calls $T=h(H)$ a "law." You must insist it is a "mechanism description." If it were a fundamental law of nature that truly bound $H$ and $T$ symmetrically, interventionism would indeed struggle. But thermometer readings are not fundamental laws; they are contingent device behaviors.

  ### 5. Summary of the Response to Your Friend
  To defend interventionism, you should argue as follows:

  1.  **Interventions Break Equations:** An intervention on $Y$ replaces the structural equation determining $Y$. It does not solve it. Therefore, the inverse function is not activated.
  2.  **Step (3) is False:** In a causal model, intervening on the effect does not change the cause. It merely decouples the effect from the cause.
  3.  **The Thermometer:** Heating the thermometer changes the reading ($T$) but leaves the temperature ($H$) fixed. The relation $T=h(H)$ is violated during the intervention. This proves $T$ does not cause $H$.
  4.  **The Cost:** The cost is accepting that causal models represent **modular mechanisms**, not just mathematical constraints. But this is a feature, not a bug: it is precisely what allows us to distinguish causation from correlation.

  **Verdict:** The argument is invalid because it misapplies the definition of an intervention. Step (3) assumes interventions preserve structural equations, but the core of interventionism is that they **override** them. You can keep (1) and (8) without contradiction, provided you insist that structural equations are asymmetric mechanisms, not symmetric algebraic constraints.
