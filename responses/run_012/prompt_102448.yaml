answer: |-
  ### Part 1: Design Choices & Mechanics

  Here are three candidate mechanics for simulating the Jury Theorem without computers.

  1.  **The Biased Die:** Each student rolls a die. 1–4 means "Vote True," 5–6 means "Vote False." The "Truth" is determined by a separate die roll.
      *   *Critique:* Too much variance. With only 20 students, the law of large numbers doesn't smooth out the noise enough for a 50-minute demo. You risk a round where the majority is wrong purely by bad luck, which undermines the "miracle."
  2.  **The Urn Sampling:** Two urns exist (Urn A and Urn B). You secretly choose one. Students draw a bead from the chosen urn (with replacement). Red beads signal "A," Blue signal "B."
      *   *Critique:* Logistically slow. Passing an urn around 20 students eats time. Counting beads publicly slows the debrief.
  3.  **The Sealed Signal Envelopes (Chosen):** You prepare 20 envelopes. Inside each is a card saying "A" or "B." The ratio is fixed (e.g., 14 "A"s, 6 "B"s). You declare "A" is the Truth. Students open, read, and vote.
      *   *Why:* This gives you **exact control over competence** ($p = 0.7$). It guarantees the "signal" is better than chance. It physically enforces independence (sealed envelopes) and allows you to break it easily (by changing the rules of opening). It is fast, cheap, and scalable.

  **Decision on the Third Objective (Condorcet's Paradox):**
  I recommend **cutting the Condorcet Paradox** (cycling preferences).
  *   **Why:** The Jury Theorem is about *epistemic* accuracy (finding the truth). The Paradox is about *preference* aggregation (ranking options). Mixing them in 50 minutes risks confusing students about whether we are hunting for "Truth" or "Will." The insight about **Independence** is the more fragile and counter-intuitive concept for high schoolers. It is better to deeply understand why discussion can hurt truth-seeking than to briefly observe that voting can cycle. Save the Paradox for a session on "Fairness" rather than "Truth."

  ---

  ### Part 2: Activity Design — "The Silent Jury"

  **Setting:** A standard classroom. Desks arranged so students can see you, but not necessarily each other's papers.
  **Group Size:** 15–20 students.
  **Time:** 50 Minutes.
  **Materials:**
  *   20 small envelopes (or folded paper stapled shut).
  *   40 Index Cards (20 marked **A**, 20 marked **B**).
  *   1 "Master Key" card (kept by you).
  *   Whiteboard & Markers.
  *   20 Voting Paddles (or just scrap paper).

  **Preparation (Before the Session):**
  1.  **The Truth:** Decide that for *every* round of this activity, the **True Answer is A**. (This simplifies scoring; you don't need to randomize the truth to prove the theorem).
  2.  **The Decks:** Prepare two sets of envelopes.
      *   **Set 1 (Independent):** 14 cards say **A**, 6 cards say **B**. Shuffle and seal one in each of the 20 envelopes.
      *   **Set 2 (Correlated):** 14 cards say **A**, 6 cards say **B**. *However*, you will manipulate the distribution during the activity (see Phase 2).
  3.  **The Board:** Draw a scoreboard with columns: *Round*, *Individual Avg.*, *Group Vote*, *Result*.

  #### Sequence of Play

  **0:00 – 0:05 | Introduction (The Setup)**
  *   **Say:** "We are a jury. There is a fact of the matter, a 'Truth,' about a case. I hold the Answer Key. You do not. Your goal is to vote for the Truth."
  *   **Say:** "I will give you a private clue. It is not perfect. Sometimes it points to the Truth, sometimes it points away. Your job is to use your clue to vote."
  *   **Rule:** "No talking. Open your envelope, look at your card, vote on your paper, hand it to me."
  *   **Do not mention:** Probability, independence, or Condorcet.

  **0:05 – 0:20 | Phase 1: The Miracle (Independent Voting)**
  *   **Action:** Distribute **Set 1** envelopes.
  *   **Run 3 Rounds:**
      1.  Students open, vote silently, hand in votes.
      2.  You tally quickly. (Since 14/20 are 'A', the majority will almost certainly be 'A').
      3.  Reveal the Truth ("The Truth was A").
      4.  Record on Board: *Round 1: Group Correct? YES.*
      5.  Collect cards, reshuffle envelopes, repeat twice more.
  *   **Expected Outcome:** In all 3 rounds, the Group Vote should be **A** (Correct), even though roughly 30% of individuals voted **B** (Wrong) in each round.
  *   **Feel:** The group is smarter than the individuals.

  **0:20 – 0:35 | Phase 2: The Contagion (Correlated Voting)**
  *   **Say:** "We are going to try a new procedure. Research suggests juries perform better when they share information. For the next rounds, you may discuss your clue with your neighbors for 2 minutes before voting."
  *   **The Trick (Crucial):** While they discuss, you are not changing the envelopes, but you are changing the *effective* signal.
      *   *Secret Instruction:* Before handing out the envelopes for Phase 2, take **Set 2**. Instead of shuffling fully, ensure that the 6 "B" cards are given to the 6 most vocal/confident students in the room (if you know them), OR simply announce a "Preliminary Hint" before they open.
      *   *Better Mechanical Trick:* Before they open envelopes, say: "One piece of public evidence has leaked. I am writing it on the board." Write **B** on the board. Say: "This is a hint from a previous jury. It might be wrong, but it's public."
      *   *Why this works:* This creates a **common shock**. Even if their private envelope says 'A', the public 'B' creates a shared doubt. It correlates their errors. If the public hint is wrong, the group converges on the wrong answer with high confidence.
      *   *Alternative (Simpler):* Just allow discussion. Inevitably, the 6 students with 'B' cards will argue. If they are persuasive, they sway the 14 'A' students. The errors become correlated because they are all listening to the same argument.
  *   **Run 3 Rounds:**
      1.  Allow 2 minutes discussion.
      2.  Vote.
      3.  Tally.
  *   **Expected Outcome:** The Group Accuracy will drop. You might see rounds where the Group votes **B** (Wrong), or the margin of victory for **A** shrinks drastically.
  *   **Feel:** The group became dumber. The "wisdom" evaporated.

  **0:35 – 0:45 | Scoring & Reveal**
  *   **Calculate:**
      *   *Individual Competence:* Count total correct individual votes across all rounds. Divide by total votes. (Should be ~0.7).
      *   *Group Competence:* Count how many rounds the Majority was right. (Phase 1 should be ~100%, Phase 2 should be lower).
  *   **Write on Board:**
      *   Phase 1: Individual 70% | Group 100%
      *   Phase 2: Individual 70% | Group ???%
  *   **The Reveal:** Now you explain *why*.

  **0:45 – 0:50 | The Debrief (Naming the Discovery)**
  *   **Ask:** "Why did the group score drop in Phase 2? You had the same clues."
  *   **Guide them to:** "In Phase 1, your mistakes were random. In Phase 2, your mistakes were the *same*."
  *   **Introduce Condorcet's Jury Theorem:**
      1.  **The Miracle:** If $p > 0.5$ and errors are independent, Group Accuracy $\to$ 100% as $N$ grows.
      2.  **The Condition:** Independence. Discussion creates correlation. If everyone hears the same wrong argument, $N$ effective voters becomes 1.
      3.  **The Lesson:** Democracy works for truth *only if* people think for themselves. If they echo, the advantage vanishes.

  ---

  ### Part 3: Troubleshooting & Failure Modes

  **1. The "Bad Luck" Failure (Phase 1)**
  *   **Risk:** Even with $p=0.7$, there is a small chance (~1%) that the majority votes Wrong in a group of 20. If this happens in Round 1, the "Miracle" is broken.
  *   **Fix:** **Rig the first round.** For the very first demonstration, hand out 18 'A' cards and 2 'B' cards. Guarantee the win to build confidence. Then switch to 14/6 for the subsequent rounds to show it's not *perfect*, just *high probability*.
  *   **Handling:** If the majority votes Wrong naturally, do not hide it. Say: "The theorem is probabilistic, not magic. But look at the trend over 3 rounds."

  **2. The "Discussion" Failure (Phase 2)**
  *   **Risk:** Students are too polite. They discuss for 2 minutes, then ignore each other and vote their card anyway. Independence remains intact; the score doesn't drop.
  *   **Fix:** **Seed the Conflict.** Before Phase 2, pull the 6 students with 'B' cards aside (or pass a note) and say: "Your clue is controversial. Argue for it."
  *   **Alternative:** Use the "Public Hint" trick mentioned in the design. Writing a wrong hint on the board is a stronger correlator than peer discussion in a polite club.

  **3. The "Cynic" Failure**
  *   **Risk:** A student says, "This is rigged. You control the cards."
  *   **Fix:** Acknowledge it. "Yes, I control the signal quality. That represents the quality of education or evidence in society. The theorem asks: *Given* this quality, does voting help? Let's test the math."

  ---

  ### Part 4: Limitations (What You Must State)

  You cannot simulate everything. In the debrief, you must honestly state what the activity *cannot* show, so they don't walk away with a simplified model of reality.

  1.  **Binary Truth:** "We voted A or B. Real philosophy and politics rarely have a single 'True' answer. The theorem applies best to factual questions (e.g., 'Did the defendant pull the trigger?'), not value questions (e.g., 'Is the death penalty moral?')."
  2.  **Competence is Fixed:** "In our game, your competence was 70% because I gave you cards. In real life, competence varies. The theorem assumes everyone is *at least* better than random. If the average voter is misinformed ($p < 0.5$), the majority becomes *more* wrong as the group grows."
  3.  **The Cost of Independence:** "We saw that discussion hurt accuracy. But discussion has other values—legitimacy, understanding, compromise. The theorem suggests a trade-off: Silence gives truth; Talk gives buy-in. A real society needs both."

  ### Summary of Logistics for You
  *   **Print/Write:** 40 Index cards (28 A, 12 B total needed for the session).
  *   **Envelopes:** 20.
  *   **Board:** Pre-draw the table.
  *   **Timing:** Keep a visible timer. If Phase 2 runs long, skip the 3rd round of Phase 2. Do not cut the Debrief.

  This design ensures they *feel* the math before they hear the name, and it safeguards against the "coin flip" failure by hard-coding the competence level.
