      *   *Phase 1:* 3 Cases. (Truth is always A). Deck is 14 A / 6 B.
      *   *Phase 2:* 3 Cases. (Truth is always A). Deck is 14 A / 6 B. *Constraint:* 2 minutes discussion.
      *   *Scoring:* Track "Group Correct?" on board.
      *   *Condorcet:* I will explicitly advise cutting it. 50 mins is too short for 20 kids to grasp binary aggregation *and* ranking cycles. The independence condition is the more critical philosophical lesson for a "philosophy club" interested in truth-seeking.

  12. **Final Polish:** Ensure tone is supportive but authoritative (expert designer). Make sure the "Rigging" is clear to the facilitator but hidden from students.

