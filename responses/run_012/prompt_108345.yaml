answer: |-
  This is a sharp observation. You have identified a structural contradiction that professional ethicists often dance around: the mismatch between the *ontology* of climate change (a threshold-based, aggregate phenomenon) and the *moral technology* we use to address it (individual accounting).

  You asked me to commit to a reconstruction rather than survey the field. Here is my judgment on the theory of responsibility presupposed by the practices you describe (calculators, offsets, flight shame).

  ### 1. The View of Contribution: Proportional Attribution
  The practices presuppose a view I will call **Proportional Attribution**. This is the claim that an individual's moral responsibility is strictly proportional to their quantitative contribution to the total harm, regardless of whether that contribution crosses a causal threshold.

  *   **What it requires:** It requires treating the atmosphere as a common-pool resource that can be subdivided into morally significant slices. It assumes that if the total harm is $H$, and you contributed $x$, you are responsible for the fraction $x/H$ of the moral wrong.
  *   **What it rules out:** It quietly rules out **Threshold Causality** (the view that you are only responsible if your act tips the scale to a disaster) and **Structural Determinism** (the view that individuals are locked into systems and bear no responsibility for systemic outputs).
  *   **The Fiction:** Scientifically, climate harm is non-linear and threshold-dependent. One tonne of CO2 does not cause a specific unit of suffering; it adds to a stock that eventually triggers tipping points. The practices, however, operate on a linear model. They require you to believe the "folk physics" that your tonne is a distinct, harmful object you are releasing, rather than a drop in a bucket that only matters when it overflows.

  **Verdict:** The practices require you to act *as if* your marginal contribution is causally detectable and morally freestanding, even though the movement's policy wing knows it isn't.

  ### 2. The Tension: Net-Harm Bookkeeping vs. Act-Character
  You labeled the two camps "net-harm bookkeeping" (offsetters) and "act-character" (abstainers). Are they consistent?

  **No, they are logically inconsistent.**
  *   **The Offsetters** are pure consequentialists. They believe the moral wrong resides entirely in the *state of the atmosphere*. If the net concentration is unchanged, no wrong has occurred. The act of flying is morally neutral; only the outcome matters.
  *   **The Abstainers** are deontologists or virtue ethicists. They believe the moral wrong resides in the *act of participating* in a harmful system. Paying someone else to clean up your mess does not change the fact that *you* chose to pollute. It treats the act as a corruption of integrity that cannot be bought off.

  **Can one theory underwrite both?**
  Only a hybrid theory of **Restorative Complicity**. This theory would say: "You are complicit in a harmful system by participating (Abstainer view), but you have a duty to repair the harm caused by that participation to the extent possible (Offsetter view)."

  However, this is a unstable compromise. If the act itself is wrong (Abstainer), repairing the harm doesn't make the act right; it just mitigates the damage. If the harm is all that matters (Offsetter), then the act itself wasn't wrong, just the net result. The practices tolerate this inconsistency because they serve different psychological functions: abstention manages *guilt* (I am a good person), while offsetting manages *anxiety* (I am fixing the problem). The movement relies on this ambiguity to keep people engaged.

  ### 3. The "No Difference" Objection and Non-Causal Responsibility
  You ask if the practices must rest on a non-causal notion of responsibility. **Yes.**

  If the practices relied on a purely causal account (i.e., "You must do this because it prevents harm"), they would collapse immediately under the "inefficacy objection" (your single flight doesn't change the climate).

  To survive, the practices implicitly shift to a **Fairness/Complicity** model. The argument becomes: "Even if your flight doesn't change the outcome, it is unfair to enjoy the benefits of a high-carbon lifestyle while others suffer the costs, or while others restrain themselves."

  *   **Forward-looking/Expressive:** A purely expressive account ("I do this to signal virtue") could license the practices, but it would render the *calculators* meaningless. A calculator implies there is a "correct number" to hit, not just a signal to send.
  *   **The Necessity:** Therefore, the practices cannot be *purely* expressive. They require a notion of **duty-based contribution**. You owe a duty to the collective to stay within your "fair share," regardless of causal impact. This is a non-causal duty derived from membership in a cooperative scheme (humanity), not from the physics of your specific emissions.

  ### 4. Presupposed vs. Underdetermined
  Here is where we separate the engine from the bodywork.

  *   **Strictly Presupposed:**
      1.  **Agency:** Individuals have meaningful control over their emissions (ignoring structural constraints like lack of public transport).
      2.  **Commensurability:** All emissions are morally equivalent (a tonne from a flight = a tonne from heating), allowing for offsets.
      3.  **Atomism:** The collective problem is solvable by summing individual solutions.

  *   **Merely Fits Comfortably (Underdetermined):**
      1.  **The Moral Engine:** As noted in Q2, the practices work whether you are a Utilitarian (minimize total harm) or a Kantian (follow the rule "do not over-consume"). The *behavior* is the same; the *reason* is underdetermined.
      2.  **The Goal:** It is unclear if the goal is *actual climate stabilization* (which requires policy) or *moral purification* (which individual action provides). The practices function identically for both goals, even though one is effective and the other is not.

  **Judgment:** The practices are underdetermined regarding *why* the individual matters, but rigidly determined regarding *how* the individual must measure their mattering (quantitatively).

  ### 5. The Aggregate-Only View
  If we took the view seriously that **only states and firms bear responsibility**, the individual-level practices would have to undergo a radical transformation.

  *   **Calculators:** Would become obsolete or repurposed. Instead of "Your Carbon Footprint" (moral blame), they would become "Your Political Leverage Score" (e.g., "You emit this much; here is how much tax you should lobby for").
  *   **Offsets:** Would cease to be "absolution." They would be reclassified as charitable donations. You cannot "cancel" a wrong you didn't commit; you can only donate to a cause you support.
  *   **Flight Shame:** Would become irrational harassment. Shaming an individual for a systemic necessity would be viewed like shaming someone for breathing.

  **Survival:** They could survive only as **Political Signaling**. "I fly less" would not mean "I am morally clean," but "I am demonstrating the feasibility of low-carbon living to pressure the state." But the current *moral accounting* framing (guilt, sin, redemption) would have to be abandoned.

  ### Reflection on My Reading
  I have committed to the view that these practices presuppose **Proportional Attribution** (a folk-consequentialism that ignores thresholds).

  **Where I might be wrong:**
  I may be underestimating the **Signaling Theory**. It is possible the architects of these campaigns *know* individual causal impact is negligible. They might view the "individual responsibility" framing not as a moral truth, but as a **behavioral nudge** designed to build political will. If this is true, the practices don't presuppose a theory of individual responsibility at all; they presuppose a theory of *marketing*. They are using a moral fiction to drive systemic change.

  **Where my reasoning is most vulnerable:**
  My claim that Offsetters and Abstainers are inconsistent relies on them holding coherent philosophical views. In reality, most people are moral pragmatists who hold contradictory beliefs without noticing. If the "theory" is just "do what feels right," then there is no inconsistency to resolve. I am granting the practices more intellectual coherence than their users likely possess.

  **The Push for a Different Verdict:**
  The consideration that would push me to change my mind is evidence that the major climate NGOs explicitly teach the **Complicity Model** (you are responsible for joining the system, not the specific tonnes) rather than the **Footprint Model** (you are responsible for your specific tonnes). If the "footprint" concept were admitted to be a metaphor rather than an accounting reality, my reconstruction of "Proportional Attribution" would fail. Currently, however, the tools themselves (calculators) enforce the accounting view, regardless of the rhetoric.

  \answer{Fungible Share Responsibility}
