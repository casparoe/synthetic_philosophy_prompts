answer: |-
  Good evening. Welcome to the museum, and to this room. I see neighbors whose families walked the mill floor, and I see scholars who study how towns like ours rise and fall. I see also a man who has lent us the object at the center of this display. We are here to talk about a fire. But first, look at the clock.

  It sits in the glass, stopped at 4:40 a.m. It is tempting to treat this time as the answer. We want the fire to have a birthday, a specific minute where everything changed. We want to believe that if we could understand that minute, we could understand the loss. But a clock in a fire does not tell us when the spark flew. It tells us when the heat broke the mechanism. It tells us when the mill stopped keeping time for the town. That is a different story than how the fire began.

  Our research into that night has not given us a single spark. It has given us three. We found wiring in the carding room rotted by decades of humidity and wool dust. We found records of a load left smouldering in the loading yard the evening before. We found a habit of stacking oil-soaked waste against a wooden wall. Any one of these, alone, could have brought the flames we saw that morning. They were independent paths to the same destruction. Historians have a word for this: overdetermined. The fire did not need a specific match to happen; it needed only opportunity.

  This is where our memories diverge. Many in this town have said the owner caused the fire because he refused to install a sprinkler system. I will not tell you that is false. But I must tell you what kind of truth it is. A sprinkler does not prevent a spark. It prevents a spark from becoming a catastrophe. The missing water did not light the wool, but it decided how much of the wool would burn.

  So, how do we hold this together? How do we say that no single act would have prevented the fire, and yet the burning-down of the mill was avoidable? Think of it like a house with three open windows in a storm. Closing one window might not have kept the rain out, because the other two were still open. But building a roof would have saved the furniture. The ignition was likely, given the state of the building. The destruction was not. Responsibility lives in both places. It lives in the rotting wire, and it lives in the decision not to build the roof.

  We often want blame to rely on a simple test: without this one thing, the disaster would not have happened. But life is rarely that clean. You do not need a single switch to be at fault. You can be responsible for the conditions that made the disaster easy. Carelessness adds up. Neglect accumulates. A refusal to act is a cause of a different order from an act, but it is still a cause. The owner did not necessarily strike the match, but he laid the wood dry and refused to keep the bucket full.

  I know some of you came tonight hoping I would name the villain. Others came hoping I would name the accident. I will do neither. I will not name a single cause. I offer you this refusal not as a withholding of truth, but as a gift of accuracy. To pick one spark is to lie about the other two. To pick only the sprinklers is to ignore the kindling. The truth is heavy, and it belongs to all of us. It belongs to the workers who knew the wiring was bad, to the managers who knew the waste was stacked, and to the owner who held the keys to the safety system.

  To the grandson sitting in the front row: your family's return of this clock allows us to mark the hour of our loss without demanding a verdict on who wound the spring. We accept this object as a testament to the time we lost, together.

  We cannot go back to 4:40 a.m. We cannot rewind the clock to fix the wire, or move the waste, or install the pipes. We are left with the ash and the story. The fire is part of this town's foundation now, just as the river is. It shaped who we are, and how we remember care, and risk, and survival. The clock remains stopped. The water never came. The wool burned. And we are still here, standing in the room after the smoke has cleared, trying to decide what part of the heat we should carry forward.
