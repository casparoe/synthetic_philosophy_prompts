answer: |-
  # Decision Tree: The Moral Taxonomy of Deception

  **Instructions:** Start at the root. Answer each question based on your moral intuition about the case descriptions provided. Follow the branch that matches your answer until you reach a leaf. The leaf describes the philosophical position consistent with your answers, along with its most difficult commitment.

  ### **Root Node: The Source of Wrongness**
  **Question 1:** When a speaker deceives a hearer, is the primary moral wrong located in the **outcome** (the hearer acquiring a false belief) or in the **act** (the speaker violating a norm of communication)?
  *   **Outcome:** Go to Node 2.
  *   **Act:** Go to Node 3.

  ---

  ### **Node 2: The Outcome Branch**
  **Question 2:** If the false belief is the primary wrong, does the **hearer's entitlement** to the truth change depending on whether the speaker made a direct assertion or merely implied something?
  *   **No (Entitlement is constant):** Go to **Leaf 1**.
  *   **Yes (Entitlement varies by context):** Go to **Leaf 2**.

  ---

  ### **Node 3: The Act Branch**
  **Question 3:** If violating a communicative norm is the primary wrong, is that violation committed *only* when a speaker **states something false**?
  *   **Yes (Falsity of utterance is necessary):** Go to **Leaf 3**.
  *   **No (Manipulation of belief suffices):** Go to Node 4.

  ---

  ### **Node 4: The Mental State Branch**
  **Question 4:** If manipulating belief is the wrong, does the speaker need to **intend** for the hearer to form a false belief, or is it enough that the false belief was **foreseeable**?
  *   **Intention Required:** Go to **Leaf 4**.
  *   **Foreseeability Suffices:** Go to Node 5.

  ---

  ### **Node 5: The Selection Case Branch**
  **Question 5:** Consider the **Selection Case**: A speaker makes a true statement with true implicatures, but selects that specific fact knowing the hearer will draw a false conclusion (e.g., "The fund is audited" implying "The fund is safe"). Is this a violation of the hearer's entitlement to truthfulness?
  *   **No (Literal truth protects the speaker):** Go to **Leaf 5**.
  *   **Yes (Contextual manipulation violates entitlement):** Go to Node 6.

  ---

  ### **Node 6: The Severity Ranking Branch**
  **Question 6:** If the Selection Case is a violation, how does its moral severity compare to standard lying (asserting a falsehood) and standard misleading (asserting truth with false implicatures)?
  *   **Selection is Worst:** Go to **Leaf 6**.
  *   **Misleading is Worst:** Go to **Leaf 7**.
  *   **Lying is Worst (or Equal):** Go to **Leaf 8**.

  ---

  ### **Terminal Leaves**

  **Leaf 1: Strict Consequentialism**
  *   **Position:** No moral difference between lying and misleading.
  *   **Awkward Commitment:** This view must condemn a speaker who accidentally causes a false belief through a literal truth just as harshly as a calculated liar.

  **Leaf 2: Contextual Consequentialism**
  *   **Position:** The difference is wholly context-dependent with no general ranking.
  *   **Awkward Commitment:** This view makes the moral status of an utterance depend on shifting social norms rather than the harm caused or the act performed.

  **Leaf 3: Assertion-Centric Deontology**
  *   **Position:** Lying is always worse than misleading.
  *   **Awkward Commitment:** This view permits elaborate, harmful deceptive schemes provided the speaker never technically asserts a falsehood.

  **Leaf 4: Intentionalist Hierarchy**
  *   **Position:** Unnamed (Intention-based distinction).
  *   **Awkward Commitment:** This view excuses reckless communication that foreseeably deceives, provided the speaker did not specifically intend the false inference.

  **Leaf 5: Literalist Safe Harbor**
  *   **Position:** Unnamed (Literalism).
  *   **Awkward Commitment:** This view treats manipulative selection of facts as morally neutral, even when designed solely to induce error.

  **Leaf 6: The Epistemic Trap**
  *   **Position:** Selection-style deception is worse than either lying or implicating.
  *   **Awkward Commitment:** This view claims that leaving the victim with no false statement to point to is more vicious than directly lying to them.

  **Leaf 7: Manipulation-Centric View**
  *   **Position:** Misleading is always worse than lying.
  *   **Awkward Commitment:** This view judges indirect deception as more morally corrupt than direct dishonesty, often on the grounds that it treats the hearer as a puppet rather than a conversational partner.

  **Leaf 8: Commitment Hierarchy**
  *   **Position:** Lying is worse, but misleading is the same kind of wrong.
  *   **Awkward Commitment:** This view must explain why violating the same norm (trust) is significantly worse in one instance without relying on the mere falsity of the utterance.

  ---

  ### **Logical Gaps and Indistinct Leaves**

  **1. The Empty Space: Act-Based + Falsity Necessary + Selection Worse**
  There is no leaf for the view that *only* stating falsehoods violates the norm (Node 3: Yes), yet the Selection Case (which contains no falsehoods) is morally worse (Node 6: Selection Worst). This combination is **incoherent**. If the violation requires a false statement, a case without a false statement cannot be a violation, let alone the worst one.

  **2. The Empty Space: Outcome-Based + Intention Required**
  The tree does not produce a leaf for the view that the *outcome* (false belief) is the primary wrong, but only if *intended* (Node 4 path). This gap exists because if the outcome is the sole source of wrongness (Node 1), the mental state usually modifies blame rather than the nature of the wrong. A view holding this combination is **unexplored**, as it conflates the definition of the harm with the culpability of the agent.

  **3. Indistinguishable Leaves: Leaf 1 vs. Leaf 8**
  **Leaf 1 (Strict Consequentialism)** and **Leaf 8 (Commitment Hierarchy)** may be practically indistinguishable in standard cases. Both often result in lying being treated as the paradigmatic wrong. They separate only in "Selection Cases" or cases where literal truth causes false belief without manipulative intent. If your seminar does not discuss Selection Cases, these two positions will collapse into the same verdict.

  **4. Indistinguishable Leaves: Leaf 3 vs. Leaf 8**
  **Leaf 3 (Assertion-Centric)** and **Leaf 8 (Commitment Hierarchy)** both conclude that lying is worse. They separate only on *why*. Leaf 3 claims misleading is a *different* (lesser) kind of act. Leaf 8 claims it is the *same* kind of act (trust violation) but less severe. In a grading or blame scenario, this distinction may not change the verdict, making them **functionally equivalent** for students focused on outcomes rather than moral ontology.
