prompt: |-
  I'm a database engineer with no formal philosophy training, and I want the symbol grounding problem restated in the vocabulary I actually use: schemas and keys, foreign keys and referential integrity, joins, views versus materialized views, ETL and reconciliation jobs, staleness and drift, the closed-world assumption, and the fact that every key in my world points at another table rather than at the world. Take the main positions on how a symbol comes to be about anything — causal-informational accounts, teleosemantic accounts, conceptual-role accounts, embodied or sensorimotor accounts, and the social-practice accounts on which grounding is a matter of how symbols are used rather than what they correspond to — and restate each in that vocabulary as faithfully as you can, one at a time, without smuggling in assumptions my vocabulary happens to make. For each, say what maps cleanly, what survives only as a distortion, and what has no expression at all. No citations; I will chase down names myself if I need them.

  Then the residue report, which is the part I care about. My hunch is that grounding is just referential integrity with the world, and I want to know exactly where that hunch breaks. Take seriously, in particular, that a chain of foreign keys has to terminate somewhere: every table I own is defined by other tables, and the only thing that stops the regress is data written by hardware or by a person at the edge of the system. Tell me whether that terminus is the right analogue of grounding or whether it merely relocates the problem. I also want to know what my vocabulary can and cannot say about drift: I have reconciliation jobs that detect when a materialized view has gone stale relative to its source, but nothing that detects when the source itself has gone stale relative to the world, and I suspect that gap is doing real work rather than being an oversight. Close with a verdict on the residue: where it shows my framework is missing something the philosophical debate has, where it shows the philosophical debate was less clear than it looked, and which of my questions the translation leaves genuinely open rather than merely unanswered in my terms.
