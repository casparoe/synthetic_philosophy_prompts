      Consequently, deliberation functions as preference aggregation within a safe corridor, not policy discovery. The assembled public is a legitimating sounding board, not a knowing subject. If they were knowing subjects, they would co-author the agenda. Features like sortition and stipends are philosophically underdetermined; they fit both epistemic democracy (diversity yields truth) and liberal fairness (descriptive representation). However, the pre-screening and non-binding council vote strictly presuppose the technocratic view. They ensure the administrative state retains monopoly over political reality.

      A genuinely experimentalist design would require three shifts. First, the assembly must interrogate feasibility constraints, not just accept them. Experts should testify on *how* constraints could change, not just what they are. Second, the council commitment must be binding unless overridden by a supermajority, treating the assembly as a co-equal branch of inquiry rather than an advisory committee. Third, deliberation should continue into implementation, monitoring outcomes to revise the policy, completing the experimental cycle.

