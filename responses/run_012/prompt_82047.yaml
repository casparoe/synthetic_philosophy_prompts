  4.  **Developing the Argument (within word limit):**
      *   *Implicit Theory:* The feasibility screen presupposes a division of labor: technicians define the possible (means), citizens choose values (ends). This is classic Weberian bureaucracy + Schumpeterian democracy (voters choose leaders/options, experts manage reality).
      *   *Deweyan Critique:* Dewey argues means and ends are continuous. You can't know the end (housing justice) without interrogating the means (rent control feasibility). By ruling items "infeasible" *before* inquiry, the city prevents the public from discovering *why* they are infeasible or if the constraints themselves should change.
      *   *Deliberation Function:* It's not discovering better policies (inquiry); it's aggregating preferences within a safe corridor (legitimation). The public is a legitimating sounding board.
