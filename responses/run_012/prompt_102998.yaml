      2.  Refine the diagnosis: It's a **teleological disagreement** (purpose of theory) disguised as an **ontological disagreement** (nature of markets).
      3.  Analyze why the Scope Theorist and Framework Critic talk past each other (Idealization vs. Mechanism).
      4.  Analyze the User's role (The Philosopher in the room).
      5.  Define Progress: Metatheoretical agreement + Formalizing the "friction."

