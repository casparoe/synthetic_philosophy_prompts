      *   **The Technician's Internal Shift:** He realizes the script is also an illusion. He is also running the code. He can't truly convince her because he is subject to the same user-interface.
      *   **Ending:** Ambiguous. They sit there. The pain remains for her, the doubt remains for him. No cure, no debunking.

  5.  **Refining the "No Lecturing" Constraint:**
      *   Instead of saying "Illusionism posits that...", the technician says things like "The model shows the regulatory function is active, but the descriptor tag is... local."
      *   Use the forms. "Subjective Intensity vs. Neural Load."
      *   The patient's resistance should be physical. Clenching fists, touching the spot.

  6.  **Refining the "No Resolution" Constraint:**
      *   Don't let her say "I feel better."
      *   Don't let her say "You're crazy."
      *   End on the tension between the data and the feeling.

  7.  **Word Count Management:**
      *   Need to expand on the sensory details of the room and the internal monologue of the technician to hit ~1,200 words.
      *   Focus on the texture of the script and the physicality of the patient's reaction.

  8.  **Drafting - Step-by-Step:**

      *   *Title Idea:* The Interface, The Readout, False Color, The User Illusion. Let's go with **False Color**.
      *   *Scene:* The room. The screen. The graph.
      *   *Dialogue:* Sparse. The script does the talking.
      *   *The Twist/Internal Conflict:* The technician feels the weight of his own words. If the theory is true, his conviction is also just a represented state.

      *(Self-Correction during drafting)*: Make sure I don't slip into explaining the theory explicitly. Keep it grounded in the clinic's procedure. The "script" is the vehicle for the theory.

      *Focus on the "Advertisement" aspect:* The brain states advertise qualities they don't have. How to show this? The scan shows "Regulatory Alert" where she says "Agony."

      *The Technician's Shift:* He starts confident. He ends unsure, not because the patient proved him wrong, but because his own confidence feels like part of the illusion.

  9.  **Writing - First Pass Mental Outline:**
