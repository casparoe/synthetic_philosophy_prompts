answer: |-
  **False Color**

  The light in Debriefing Room 4 was calibrated to reduce anxiety, a soft, amber glow that made the skin look healthier than it was. I sat behind the glass desk, the tablet warm against my palms. On the screen, the script waited, highlighted in blocks of grey and white. I had read it a thousand times, but the words never settled. They slid off the mind like water off oil.

  Mrs. H entered at 14:00 exactly. She moved stiffly, her right hand hovering near her lower back, protecting the site of the complaint. She was fifty, maybe sixty, with the tired eyes of someone who has spent years arguing with her own nerves. She sat in the chair opposite me, the fabric sighing under her weight.

  "Did you find it?" she asked. Her voice was tight. "The damage."

  I tapped the tablet. The wall screen behind me woke up, displaying the neural map. It was a complex web of blue and green lines, pulsing gently. There were no red zones. No jagged spikes indicating tissue trauma or inflammatory cascades. Just the steady, rhythmic hum of regulatory maintenance.

  "We found the state, Mrs. H," I said. I kept my voice level, matching the script's tone guide. "The regulatory system is active. The signals are firing."

  "But?"

  "But the quality you reported... the burning, the grinding." I gestured to the screen. "The model doesn't show a corresponding property. The state exists. It is doing work. It is telling your muscles to brace, your attention to focus. But the *burn* isn't in the signal. The signal is just data."

  She flinched, her hand pressing harder into her back. "It feels like fire. Don't tell me it's data."

  "I'm not telling you it doesn't feel like fire." I scrolled down the script. The next block of text was bolded. *Acknowledge the report without validating the ontology.* "I'm telling you that the fire is how the data presents itself to you. The brain state represents itself as having heat. It doesn't actually have heat."

  She stared at me. The amber light caught the wetness in her eyes. "So I'm imagining it."

  "No. You are seeing it. You are attending to it. The process is real. The description is where the error lies." I paused. The script prompted me to explain the persistence. "Think of it like a warning light on a dashboard. The light is red. It demands attention. But the plastic of the light isn't hot. The car isn't bleeding. The redness is there to make you look. Your pain is there to make you move."

  "It hasn't made me move in three years," she said. "I can't move. It locks me."

  "Then the signal is stuck in the loop. It keeps advertising the danger even though the danger isn't... intrinsic." I hated the word. It sounded like I was dismissing her. I looked at the readout again. The blue lines pulsed. Somewhere in that mesh of electricity, a state was claiming to be agony. It was a lie told by biology to ensure survival, but it had outlived its utility.

  Mrs. H leaned forward. "If it's just a label, why can't I peel it off? If you tell me the light is just plastic, I should be able to ignore it. But it burns. Every second."

  "The system producing the report cannot see its own code," I said. I was reading directly from the tablet now. "You are inside the interface. You cannot step outside to check the wiring. The feeling of inescapability is part of the advertisement. It has to feel real, or you wouldn't care."

  "That's convenient," she whispered. "For you. For the model."

  "It's not for anyone." I put the tablet down. The script was done. The rest was supposed to be integration. *Leave the patient with something livable.*

  I looked at her hands. They were trembling. She was in pain. I knew this. The clinic knew this. But the model said the pain was a user-error, a misattribution of properties. If I was right, if the model was right, then her suffering was a ghost. But if it was a ghost, why was she shaking?

  And why was I so sure?

  I felt a sudden tightness in my own chest. A flare of irritation at her resistance. I recognized the feeling. It felt like frustration. It felt like heat rising in my neck. But according to the model, that heat wasn't there. My brain state was representing itself as frustrated to motivate me to argue, to defend the clinic, to close the file. The feeling was an advertisement.

  I looked at Mrs. H. She was waiting for me to fix it. To reach across the desk and turn off the red light. But I couldn't. I was running the same software.

  "The script says I should tell you that knowing this reduces the load," I said. My voice sounded hollow in the amber room. "It says that seeing the mechanism weakens the signal."

  "Does it?" she asked. "For you?"

  I looked at the tablet. The screen was dark now, reflecting my own face. A man in a white coat, looking tired. Looking real. "I don't know."

  "If you don't know, then you're feeling it too."

  "I'm feeling the report of it."

  "Is there a difference?"

  The question hung in the air. The theory said yes. The theory said the difference was everything. The theory said that once you understood the trick, the magic lost its power. But the theory was just words on a screen, and the screen was just light, and the light was just photons hitting a retina that represented them as brightness.

  I couldn't prove to her that the quality was false without using a quality—my own certainty—that was also potentially false. If illusionism was true, my confidence was just another state representing itself as solid. I had no ground to stand on. I was trying to convince her that the floor wasn't there while standing on it myself.

  "The model is consistent," I said finally. "The scans don't lie."

  "The scans don't feel," she said. She stood up slowly, wincing. The movement was careful, negotiated with the pain. "I have to live in the scan. You just read it."

  She walked to the door. She didn't look cured. She didn't look liberated. She looked like someone who had been told her house was made of pictures instead of wood, but still had to sleep inside it.

  "Mrs. H," I said.

  She stopped, her hand on the frame.

  "We can adjust the regulatory thresholds," I said. "Medication can dampen the advertisement. Even if the quality isn't real, the volume can be turned down."

  She turned back. Her face was unreadable. "Turn it down. But don't tell me it's not loud."

  "I won't."

  She nodded, once, and left. The door slid shut with a soft click.

  I was alone in Room 4. The amber light hummed. I looked at my hands. They looked solid. They looked like they belonged to me. I pressed my thumb against my index finger. I felt the pressure. I felt the skin.

  According to the script, this feeling was a representation. A useful fiction. A way for the body to track its own boundaries. I knew the theory was sound. The data was robust. The logic held.

  But the pressure felt like pressure. And I couldn't tell if the certainty I felt about that was knowledge, or just another layer of the advertisement, convincing me that I was real enough to know the truth. I sat there for a long time, watching the blue lines pulse on the dark screen, waiting for the feeling of sitting to fade. It didn't.
