answer: |-
  # Specification Requirements for Bounded Rational Choice Under Unbounded Uncertainty

  ## 1. Preamble
  This specification defines the necessary conditions for a decision rule governing a resource-bounded agent. The agent operates with finite memory, finite processing time, and finite numerical precision. The environment presents lotteries with outcomes ranging from modest certain values to arbitrarily large (potentially unbounded) values associated with arbitrarily small probabilities. The goal is to establish criteria that determine whether Expected Value (EV) Maximization is viable or whether it necessitates unacceptable "fanaticism" (prioritizing negligible probabilities of immense payoff over certain modest gains).

  ## 2. Requirements List

  ### Requirement 1: Computational Feasibility (Finite Precision)
  *   **Motivation:** The agent is a physical or digital system with fixed register width. It cannot represent real numbers with infinite decimal expansion, nor can it distinguish between a probability $p$ and zero if $p$ is below the machine epsilon $\epsilon$.
  *   **Concrete Case:** The agent must process a probability $p = 10^{-20}$. If the system's float precision bottoms out at $10^{-15}$, the system must treat $p$ as either exactly zero or round it to the nearest representable number. It cannot store the "true" value.
  *   **Structural Result:** The decision rule must terminate in finite steps without invoking oracles or infinite series summation.
  *   **Status:** **Non-Negotiable.** This is a physical constraint on the agent's architecture.

  ### Requirement 2: Statewise Dominance
  *   **Motivation:** If action $A$ yields an outcome at least as good as action $B$ in every possible state of the world, and strictly better in at least one, $A$ must be preferred. To violate this is to choose a guaranteed loss.
  *   **Concrete Case:** Action $A$ pays $\$10$ in all worlds. Action $B$ pays $\$10$ in all worlds except world $w$, where it pays $\$11$. The theory must select $B$.
  *   **Structural Result:** Consistency with first-order stochastic dominance.
  *   **Status:** **Non-Negotiable.** Violation constitutes a definition of irrationality (throwing away value).

  ### Requirement 3: Probability-Value Separability
  *   **Motivation:** The theory must not collapse the distinction between a tiny chance of an enormous *finite* payoff and a nonzero chance of an *infinite* payoff. It must also distinguish between a value that is merely large and a value that is lexicographically prior to all others.
  *   **Concrete Case:** Compare Lottery $L_1$ (probability $10^{-100}$ of $10^{100}$ utils) vs. Lottery $L_2$ (probability $10^{-100}$ of $\infty$ utils). An adequate theory must rank $L_2$ strictly above $L_1$, even if $10^{100}$ exceeds any practical scale. Similarly, it must distinguish a payoff of $10^{100}$ from a payoff that is "infinitely more valuable" than any finite number.
  *   **Structural Result:** The utility function and probability measure must support an ordering that preserves these distinctions without arithmetic overflow or underflow.
  *   **Status:** **Preference.** This depends on whether the ontology of the environment actually contains infinite values or merely large finite ones.

  ### Requirement 4: Dynamic Consistency (No Money Pumps)
  *   **Motivation:** The agent must not make a sequence of choices that leads to a sure loss relative to an available alternative plan. If the agent plans to take action $X$ tomorrow, it should not take action $Y$ today that precludes $X$ unless $Y$ is strictly preferable.
  *   **Concrete Case:** The agent is offered a bet today that it will rationally reject tomorrow, yet paying a fee to keep the bet open today results in a net loss regardless of the outcome.
  *   **Structural Result:** Immunity to diachronic money pumps. The decision rule must be time-consistent across a sequence of choices.
  *   **Status:** **Non-Negotiable.** Vulnerability here allows adversaries to drain the agent's resources.

  ### Requirement 5: Tail Sensitivity (EV Continuity)
  *   **Motivation:** This is the core of Expected Value Maximization. It requires that for any certain payoff $V$, there exists some sufficiently large payoff $V^*$ and probability $p > 0$ such that the lottery $(p, V^*; 1-p, 0)$ is preferred to $V$.
  *   **Concrete Case:** Pascal's Mugging. A agent is offered a certain loss of $\$10$ versus a probability $10^{-10}$ of gaining $10^{12}$ utils. If the theory is EV-maximizing with unbounded utility, it must accept the gamble.
  *   **Structural Result:** Satisfaction of the Archimedean axiom in the probability space. No outcome is so valuable that no probability is too small to justify pursuing it.
  *   **Status:** **Preference.** This is the specific commitment of the EV baseline that critics label "fanaticism."

  ### Requirement 6: Bounded Risk Immunity (Anti-Fanaticism)
  *   **Motivation:** A bounded agent cannot reliably verify probabilities below its precision threshold. Relying on such probabilities exposes the agent to exploitation by claims that cannot be empirically distinguished from zero.
  *   **Concrete Case:** An agent is presented with a claim: "Give me $\$100$, and I will generate $10^{50}$ utils with probability $10^{-60}$." The agent's sensors cannot distinguish $10^{-60}$ from 0. Accepting this based on testimony alone opens the agent to infinite resource drainage by liars.
  *   **Structural Result:** The decision rule must effectively truncate or discount probabilities below a reliability threshold $\epsilon$, or bound the utility function.
  *   **Status:** **Preference (but practically necessary).** This blocks fanaticism but violates standard EV axioms.

  ## 3. Constructed Case: The Precision Cliff

  To test these requirements, we define a specific decision problem that exploits the agent's boundedness.

  **The Scenario:**
  *   **Agent Precision:** The agent's probability register has a minimum positive representable value of $\epsilon = 10^{-15}$. Any $p < \epsilon$ is stored as $0$.
  *   **Action A (Certain):** Yields a utility of $100$.
  *   **Action B (Lottery):** Yields a utility of $10^{20}$ with probability $p = 10^{-16}$, and $0$ otherwise.
  *   **Mathematical EV:**
      *   $EV(A) = 100$.
      *   $EV(B) = 10^{20} \times 10^{-16} = 10,000$.
      *   Mathematically, $EV(B) \gg EV(A)$.
  *   **Agent Representation:**
      *   The agent stores $p$ as $0$.
      *   Calculated $EV(B) = 10^{20} \times 0 = 0$.
      *   Calculated $EV(A) = 100$.
  *   **The Conflict:**
      *   If the agent follows **Requirement 1 (Feasibility)**, it must choose A.
      *   If the agent follows **Requirement 5 (Tail Sensitivity/EV)**, it must choose B.
      *   The agent cannot choose B without violating its own hardware constraints (it cannot represent the probability that justifies the choice).

  **Distinction to Preserve:**
  This case forces a distinction between *mathematical expectation* (which exists in the abstract) and *computable expectation* (which exists for the agent). A theory that collapses this distinction demands the agent act on information it physically cannot hold.

  ## 4. Impossibility Results and Conflicts

  There is a genuine impossibility theorem inherent in this specification. The following four requirements form an inconsistent set; no decision rule can satisfy all of them simultaneously in the domain of unbounded value and bounded precision.

  **The Inconsistent Tetrad:**
  1.  **Unbounded Utility:** Payoffs can be arbitrarily large.
  2.  **Archimedean Probability:** Probabilities are standard real numbers (no infinitesimals, no thresholds); any $p > 0$ counts.
  3.  **Expected Value Maximization:** Choice is determined by maximizing the sum of $p \times u$.
  4.  **Computational Feasibility:** The agent has finite precision and cannot distinguish $p < \epsilon$ from 0.

  **The Conflict:**
  Requirements (1), (2), and (3) jointly imply **Fanaticism**. They dictate that for any certain modest payoff, there is a lottery with a sufficiently large payoff and sufficiently small (but nonzero) probability that dominates it. However, Requirement (4) dictates that when that probability drops below $\epsilon$, the agent *must* treat it as zero.
  *   If the agent treats $p < \epsilon$ as zero, it violates (3) (EV Maximization) because it ignores the positive mathematical expectation.
  *   If the agent treats $p < \epsilon$ as nonzero, it violates (4) (Feasibility) because it requires precision the hardware does not possess.
  *   If the agent caps utility to stop the payoff from growing, it violates (1).
  *   If the agent uses non-Archimedean probabilities (e.g., treating $10^{-100}$ as a distinct class from $10^{-15}$), it violates (2).

  **The Forcing Case:**
  The **Precision Cliff** case (Section 3) forces this contradiction. To satisfy EV Maximization with Unbounded Utility, the agent must be sensitive to the "tails" of the distribution. But a bounded agent physically cannot see the tails once they recede beyond $\epsilon$. Therefore, **EV Maximization is computationally unrealizable for unbounded domains on finite hardware.**

  ## 5. The "Killer" Requirement

  The single requirement that, if kept, excludes the largest number of otherwise attractive theories is **Requirement 1: Computational Feasibility (Finite Precision)**.

  **Argument:**
  Most classical decision theories (Standard EV, Hyperreal EV, Standard Bayesianism) assume the agent can represent and manipulate arbitrary real numbers or infinitesimals. They assume the Archimedean property holds for the agent's internal state.
  *   If **Computational Feasibility** is enforced as a hard constraint, **Standard EV Maximization** is excluded because it requires summing infinite series or representing probabilities smaller than machine epsilon.
  *   **Hyperreal/Surreal Decision Theories** are excluded because they require infinite precision to distinguish orders of infinitesimals.
  *   **Strict Dominance** arguments in infinite contexts often fail because checking dominance across infinite states requires infinite time/precision.

  By insisting that the agent is *bounded*, you invalidate the mathematical idealizations upon which almost all normative decision theories are built. You force the theory to be one of *approximation*, *truncation*, or *bounded utility*, rather than one of *optimization*.

  ## 6. Classification of Requirements

  **Non-Negotiable (Physical/Logical Constraints):**
  *   **Computational Feasibility:** The agent cannot do what it cannot do. A theory requiring infinite precision is a theory for a god, not a bounded agent.
  *   **Statewise Dominance:** Violating this is accepting a guaranteed loss, which is functionally self-destructive.
  *   **Dynamic Consistency:** Violating this allows the agent to be money-pumped to zero resources.

  **Preferences (Normative Camps):**
  *   **Tail Sensitivity (EV Continuity):** This is the commitment to the EV baseline. Keeping this forces Fanaticism or requires impossible hardware. Dropping it allows for risk aversion or probability thresholds.
  *   **Unbounded Utility:** This is an ontological claim about the world. If dropped (by capping utility), Fanaticism is solved, but the theory cannot handle genuine infinite stakes.
  *   **Probability-Value Separability:** This is a preference for structural elegance over computational simplicity.

  ## 7. Conclusion on Fanaticism

  The baseline of Expected Value Maximization **does** force fanaticism in this setting, but only if one ignores Computational Feasibility.
  *   If you keep **EV Maximization** and **Unbounded Utility**, you get Fanaticism.
  *   If you keep **Computational Feasibility**, you **cannot** keep **EV Maximization** for unbounded domains.

  Therefore, the requirement that blocks fanaticism is not necessarily a change in risk attitude, but the admission of **Finite Precision**. A bounded agent *must* ignore probabilities below $\epsilon$. This effectively imposes a probability threshold. This threshold blocks the "Pascal's Mugging" style fanaticism not because the payoff isn't large enough, but because the probability is *invisible* to the agent.

  However, this creates a new vulnerability: **The Cliff Edge.** If a payoff is large enough to push the required probability just *above* $\epsilon$, the agent must suddenly switch from ignoring the gamble to accepting it, potentially creating instability. A complete theory must specify how to smooth this transition without violating Feasibility.
