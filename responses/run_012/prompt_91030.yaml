answer: |-
  Your intuition is spot on: your mate is making a classic category mistake. He's taking a logical puzzle about language (the Sorites paradox) and trying to use it to engineer a solution for practical communication, but in doing so, he's misunderstanding what words are actually for.

  While his insurance firm is quite right to set a hard line for *administrative* purposes, his leap to saying we should do this 'everywhere' rests on a few philosophical blunders. Here is where his reasoning goes off the rails.

  ### 1. The False Dilemma
  Your mate presents a choice: either there is a hidden, magical number where you become bald (Epistemicism), or the word 'bald' doesn't really mean anything at all (Nihilism). He rejects the first as silly and accepts the second.

  The problem is that these aren't the only two options on the menu. This is a false dilemma. Most philosophers of language would reject both of his premises.

  *   **Against Epistemicism:** He's right that the idea of a 'hidden cutoff' feels counter-intuitive. (Though, for the record, some very serious logicians, like Timothy Williamson, actually defend this view! They argue the cutoff exists but is unknowable due to the nature of how we learn language). However, just because one finds epistemicism 'silly' doesn't force one into nihilism.
  *   **Against Nihilism:** The alternative isn't that the word is meaningless. It's that the meaning is inherently **gradient** or **context-dependent**.
      *   **Degree Theory (Fuzzy Logic):** Truth isn't always binary (true/false). One can be '0.8 bald' or '0.4 bald'. The word has meaning, but it doesn't demand a sharp boundary.
      *   **Supervaluationism:** A statement like 'John is bald' is true if it remains true under all acceptable ways of making 'bald' precise, and false if false under all acceptable ways. In the borderline cases, it's neither true nor false, but the word still functions perfectly well in clear cases.
      *   **Contextualism:** The cutoff for 'bald' shifts depending on the conversation. In a medical trial, it might be 120 hairs. At a bar, it might be 'noticeably thinning'. The meaning isn't fixed, but it isn't non-existent.

  So, the Sorites paradox shows that classical binary logic struggles with vague predicates, not that the predicates themselves are void of meaning.

  ### 2. Vagueness is a Feature, Not a Bug
  Your mate reckons precise definitions are a 'straight upgrade'. This ignores the evolutionary and pragmatic utility of vagueness.

  Natural language is designed for efficiency, not mathematical rigour. If we had to measure height in centimetres every time we described someone, communication would be exhausting.
  *   **Cognitive Economy:** 'Tall' conveys a useful generalisation without requiring a tape measure. It allows us to group things for practical purposes.
  *   **Flexibility:** Vagueness allows language to adapt to new contexts without needing new legislation. If we defined 'heap' as exactly 1,000 grains, we'd be unable to describe a small pile of sand as a heap in a casual context without lying.
  *   **Politeness and Diplomacy:** Vague language allows for social lubrication. Telling someone 'you are becoming bald' is softer than 'you have 121 hairs'. Precision can be brutal; vagueness allows for nuance.

  Replacing all vague terms with precise ones wouldn't make the world better; it would make it incredibly cumbersome and socially brittle.

  ### 3. The Insurance Context is Special
  Your mate is conflating **stipulative definitions** with **descriptive definitions**.

  *   **Descriptive:** How the word is actually used by people in the wild (e.g., 'bald' means lacking hair to a noticeable degree).
  *   **Stipulative:** A definition created for a specific purpose (e.g., 'for the purposes of this policy, bald means ≤120 hairs').

  The insurance company *must* use a stipulative definition. They need a binary outcome to decide whether to pay out or not. They cannot pay '0.8 of a claim'. In this specific, bureaucratic context, precision is necessary to prevent litigation.

  However, this doesn't mean the stipulative definition captures the 'true' meaning of baldness. It creates a new technical term, let's call it 'bald*'. Someone with 121 hairs is not 'bald*' but might still be 'bald' in ordinary conversation. Your mate thinks the precise definition solves the paradox, but it actually just sidesteps it by changing the subject. The Sorites paradox would immediately reappear for the new term if you asked, 'Why 120 and not 119?' The boundary is still arbitrary; it's just now enforced by a contract rather than usage.

  ### 4. The 'No Fact of the Matter' Error
  Your mate concludes that because there's no sharp cutoff, there's 'no fact of the matter' about who is bald. This is too strong.

  There is a fact of the matter about clear cases. David Attenborough is not bald. Jason Statham is bald. The paradox only arises in the borderline cases. The existence of a grey area doesn't negate the black and white. If I say 'that paint is red', and it is clearly crimson, the vagueness of where red becomes orange doesn't make my statement meaningless.

  ### Summary
  Your mate is right that the Sorites paradox is a headache for logicians, and he's right that insurance firms need hard lines to function. But he is wrong to think this proves vague words are defective.

  Vagueness is not a failure of language; it is a tool that allows us to navigate a world that rarely presents us with sharp edges. Replacing 'tall' with 'over 185cm' might work for a basketball scout, but it would be a terrible way to describe your mates down the pub.

  So, you can tell him his insurance rule is sound business, but his philosophy is a bit hair-brained. The Sorites paradox shows the limits of binary logic, not the limits of meaning.
