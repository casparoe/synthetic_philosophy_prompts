answer: |-
  **MEMORANDUM**

  **TO:** Medical Policy Committee
  **FROM:** Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Appeal Regarding Growth Hormone for Idiopathic Short Stature

  **Recommendation**

  I recommend that the Committee **grant the appeal** authorizing growth hormone therapy for this patient, but **limit coverage to the twenty-fifth percentile**, denying the request to extend treatment to the fiftieth percentile. Furthermore, I propose we amend our medical policy to explicitly include Idiopathic Short Stature (ISS) as a covered condition when height is below the third percentile, provided the treatment goal is restoration to the low-normal range (up to the twenty-fifth percentile).

  To sustain this decision, we must adopt a new operational criterion for medical necessity: *Interventions are medically necessary when they correct a statistically significant deviation from population norms that results in functional impairment or substantial psychosocial disadvantage, aiming to restore the patient to a functional baseline rather than an optimal state.*

  **The Nature of "Defect" and "Normal"**

  We must begin by answering the utilization-review nurse's challenge regarding our current policy language. She is correct: our first prong (addressing a defect) and second prong (restoring to normal range) are not purely descriptive biological facts; they are evaluative choices. When we cover eyeglasses for mild refractive error, we are not fixing a broken organ in the pathological sense; we are correcting a functional limitation relative to a standard of visual acuity. If we cover orthodontia for mild crowding, we acknowledge that "normal" includes a range of aesthetic and functional acceptability.

  Therefore, we cannot deny this appeal by claiming ISS is not a "defect" while covering mild myopia. Both are deviations from a statistical norm that carry functional consequences. The distinction lies not in the biology of the break, but in the severity of the deviation and the goal of the repair. The first percentile represents a statistical outlier comparable to severe visual impairment, whereas the gap between the twenty-fifth and fiftieth percentiles represents normal human variation.

  **Therapy vs. Enhancement: The Percentile Cap**

  This brings us to the parents' request to treat to the fiftieth percentile. We must draw a line between therapy and enhancement. Therapy aims to relieve a burden; enhancement aims to provide an advantage.

  Moving a child from the first percentile to the twenty-fifth percentile removes them from the range of clinical concern. It alleviates the significant disadvantage of being exceptionally small in a world designed for average sizes. However, moving a child from the twenty-fifth to the fiftieth percentile does not relieve a medical burden; it seeks to optimize a trait. If we cover treatment to the fiftieth percentile, we implicitly define "health" as "average," which would require us to treat any child below the median. This is financially unsustainable and medically indefensible. The twenty-fifth percentile represents a functional baseline—a return to the broad range of normal variation—without crossing into optimization.

  **The Stigma Argument**

  I want to address the argument from our consumer advisory panel's disability-studies representative. They contend that covering treatment for short stature entrenches the stigma that makes shortness a disadvantage. By paying for growth, we signal that short bodies are defective, reinforcing the social prejudice rather than challenging it. Ideally, society should accommodate height diversity just as we are learning to accommodate other physical differences.

  This is a powerful moral claim. However, as a health plan, we have a fiduciary and ethical duty to our current members living in the world as it exists, not as we wish it to be. While we should advocate for a less discriminatory society, refusing coverage does not dismantle stigma; it merely abandons the individual child to suffer its consequences. The disadvantage short children face in social development, athletic participation, and future economic opportunity is documented. To deny relief because the disadvantage is socially constructed is to punish the victim of that construction. We can acknowledge the social origin of the harm while still providing the medical means to mitigate it. We treat the patient before us, not the abstract ideal.

  **The "Welfare" Alternative**

  Some have suggested we drop the language of "defect" and "normal range" entirely and simply ask: *Does this intervention improve the patient's welfare?* While morally intuitive, this standard is operationally fatal for an insurance plan. "Welfare" is too subjective. One could argue that taller stature improves welfare for a child at the fortieth percentile, or that cosmetic enhancements improve welfare. Without an objective anchor, we invite arbitrary decision-making and endless appeals.

  We need a standard that claims staff can apply without calling a philosopher. The "statistically significant deviation" criterion I proposed earlier provides that anchor. It relies on growth charts (objective data) and sets a clear cutoff (the third percentile for eligibility, the twenty-fifth for termination). It acknowledges the evaluative nature of "normal" without surrendering to subjectivity.

  **Addressing the Nurse's Observation**

  Finally, regarding the nurse's observation that the second prong is a "rationing rule dressed up as a definition": She is right, but that is not a criticism. All insurance definitions are rationing rules; resources are finite. The ethical requirement is that the rationing be consistent and defensible. Covering eyeglasses but denying growth hormone for the first percentile is inconsistent. Covering growth hormone to the twenty-fifth percentile but not the fiftieth is consistent with the distinction between restoring function and optimizing traits. We should revise our policy to admit that "medical necessity" includes preventing substantial functional disadvantage, even in the absence of a specific hormonal pathology.

  **Conclusion and Motion**

  We are navigating the line between caring for patients and managing resources. The textbook therapy/enhancement distinction is blurry here, but not invisible. The blur does not excuse inaction.

  I move that we:
  1.  **Grant the appeal** for the twelve-year-old member.
  2.  **Authorize payment** until the patient reaches the twenty-fifth percentile, at which point medical necessity ceases.
  3.  **Adopt the new operational criterion** focusing on statistical deviation and functional restoration for future ISS cases.

  This approach honors our commitment to member welfare, maintains fiscal sustainability, and provides a clear, defensible rule for our staff. It acknowledges that while "normal" is a value judgment, it is one we must make to administer care fairly. We treat the disadvantage without promising the average.

  Please review this reasoning prior to Thursday's vote. I look forward to your questions.
