answer: |-
  Here are 10 interview questions designed to press your guest's view on Pascal's Mugging, structured to build logically from the definition of the problem to the mechanics of her solution, and finally to its real-world implications. Each includes a follow-up keyed to the standard philosophical defenses she is likely to offer.

  **1. The Pascal's Wager Distinction**
  "Let's start with the genealogy of the problem. Pascal's Wager argues that a tiny probability of infinite reward justifies belief in God. Your mugger offers a tiny probability of a *finite* but astronomical reward. Is the Mugging just the Wager with a stranger instead of a deity, or is there a structural difference that makes the Mugging a unique threat to decision theory?"
  *   **Follow-up:** If she argues the Wager relies on *faith* while the Mugging relies on *evidence*, press this: "But the Mugging explicitly asks us to assign a non-zero probability to a claim with *no* evidence. If the problem is purely about the math of Expected Utility, doesn't treating them differently require changing the math, not just the context?"

  **2. Infinite vs. Unbounded Utility**
  "Your solution pairs a probability floor with a bounded utility function. But do we actually need *infinite* utility for the Mugging to break Expected Utility Theory? If utility is unbounded but finite—meaning I can always imagine a number bigger than the last one—doesn't the mugger still win if he just names a big enough number?"
  *   **Follow-up:** If she says unbounded finite utility is sufficient for the problem, ask: "Then why is the utility bound necessary for your solution? If the probability floor zeros out the tiny chances, shouldn't that solve the problem even if utility remains unbounded?"

  **3. The Threshold Mechanics**
  "Let's look at the probability floor. You argue we treat probabilities below a certain threshold as zero. Where does that line sit? If a claim has a one-in-a-million chance, do we evaluate it? What about one-in-a-googol? Is there a sharp cliff where rationality suddenly stops applying?"
  *   **Follow-up:** If she suggests the threshold is based on cognitive limitations or 'negligibility,' press this: "If the threshold is just where human brains stop caring, aren't you describing a psychological bug rather than a normative rule? Should rationality be defined by our processing limits?"

  **4. Independent Motivation vs. Ad Hoc**
  "You've stated this probability floor is 'independently motivated' rather than just a fix for the Mugging. Where does that motivation come from? Is it grounded in epistemology, physics, or something else? Or is it ultimately a cutoff introduced for convenience to make the math stop exploding?"
  *   **Follow-up:** If she cites independent grounds (like computational complexity or evolutionary heuristics), ask: "Even if that explains why we *do* ignore tiny probabilities, does it justify why we *should*? If the mugger actually *is* a wizard, your floor guarantees you lose the trillion dollars. Is 'independent motivation' just a polite way of saying 'I prefer this error'?"

  **5. Fanaticism and the Floor**
  "A major motivation for your view is avoiding 'fanaticism'—where an agent sacrifices everything for a vanishingly small chance of a huge payoff. Does your probability floor actually avoid fanaticism, or does it just redefine it? If I have a million different muggers each offering a slightly higher probability, does your floor block the fanaticism or just relocate it?"
  *   **Follow-up:** If she claims the floor blocks it effectively, press this: "You mentioned the floor is independently motivated. If the only reason we accept that motivation is that it stops fanaticism, isn't that circular? How do we know the floor isn't just an *ad hoc* device to get the result we want?"

  **6. The Sorites of Muggings**
  "Consider a Sorites-style version: A mugger offers you a deal at probability *P*. You reject it. He improves the odds by 0.00001%. You reject it again. He keeps doing this until the probability is high enough that you accept. Does your probability floor create a hard 'bright line' that prevents this slippery slope, or does it just force us to accept an arbitrary jump from 'irrational' to 'rational' at the threshold?"
  *   **Follow-up:** If she argues the bright line is necessary for decision-making, ask: "But in the real world, evidence accumulates gradually. If your theory says a hypothesis is 'zero probability' one moment and 'live option' the next based on a tiny update, doesn't that make rational action discontinuous and unstable?"

  **7. Assigning Probability to the Unfalsifiable**
  "To even get to your threshold, we have to assign *some* initial probability to the mugger's claim. How do we assign a probability to a unique, unfalsifiable, one-off claim like 'I am a wizard'? Should the mugger's credibility—his sanity, his dress, his tone—matter, or does the Mugging argument assume we strip all that away?"
  *   **Follow-up:** If she says credibility adjusts the prior probability, press this: "But the Mugging is designed to work *even if* the prior is incredibly low. If you rely on credibility to lower the prior, aren't you solving the epistemic problem rather than the decision-theoretic one? What if the mugger is perfectly credible but the claim is still magic?"

  **8. Real-World Existential Risk**
  "Let's apply this to effective altruism and existential risk. Many arguments for preventing AI risk or pandemics rely on low probabilities but astronomical stakes. If you implement a probability floor, do you risk filtering out genuine existential threats because they look too much like Pascal's Muggings? Is that a bug or a feature of your view?"
  *   **Follow-up:** If she says it's a feature that prevents waste, ask: "But history is full of low-probability, high-impact events that were ignored until it was too late. If your decision theory systematically blinds agents to 'black swans' to avoid muggings, aren't you trading one type of error for a potentially catastrophic other?"

  **9. Consequentialism vs. Decision Theory**
  "Is Pascal's Mugging really a problem for Expected Utility Theory specifically, or is it an objection to Consequentialism as a whole? If you reject the Mugging, are you saying the math is wrong, or that maximizing the good is the wrong moral goal? Can you keep Consequentialism while rejecting the decision procedure that drives it?"
  *   **Follow-up:** If she says it's only a Decision Theory problem, press this: "But if Consequentialism tells us to maximize value, and Expected Utility is the only coherent way to calculate that under uncertainty, doesn't breaking EUT break Consequentialism with it? Or are you suggesting we need a non-consequentialist constraint on rationality?"

  **10. The Intuition Check**
  "Finally, back to the party. You laughed off the wizard. Most people would too. But philosophy often tells us our intuitions are wrong. If your theory implies you *should* have laughed, are you validating common sense over rigorous theory? And if rigorous theory says you *should* have paid, would you accept that conclusion, or does the intuition that it's absurd carry more weight than the math?"
  *   **Follow-up:** If she says intuition should align with the theory, ask: "So if the math says pay the mugger, we are irrational for not doing it? Or is the fact that *every* human intuition screams 'no' evidence that the math is missing a variable we haven't named yet?"
