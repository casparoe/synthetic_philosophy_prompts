      *   Needs to be authoritative but accessible (seminar level).
      *   Avoid citing external scholars (Pritchard, Coliva, etc.) as per instructions.
      *   Focus on the internal logic of the dialogue.

  6.  **Final Polish:** Check against constraints. Did I rate them? Yes. Did I answer the specific questions? Yes. Did I avoid literature references? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to simply say "Wittgenstein says X." The prompt asks me to referee *Devi and Marcus*. I should use Wittgensteinian logic to judge them, but the verdict is on *their* arguments.
