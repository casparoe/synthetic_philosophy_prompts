      *   (6) Human language is special; cheap talk works via reputation/gossip/enforcement, not handicaps.

  3.  **Evaluate Internal Consistency (The Audit):**

      *   *Tension A: (1) vs. (3).*
          *   (1) says HCP is the *general* theory (cost needed for trust).
          *   (3) says index signals (no cost, physics-based) are the *normal* case.
          *   *Conflict:* If (3) is the normal case, (1) cannot be the general theory. They contradict on prevalence and necessity.
          *   *Severity:* High. This is a definitional clash.

      *   *Tension B: (1) vs. (6).*
          *   (1) says cost is needed for trust about hidden qualities.
          *   (6) says human language (often about hidden states/intentions) works via cheap talk + enforcement (reputation).
          *   *Conflict:* Is human language an exception to the "general theory"? If (1) is general, (6) needs explaining as an outlier. If (6) is the human norm, does (1) hold generally?
