          5.  The Single Best Concession.

      *   *Refining the Tensions:*
          *   *Apparent:* (2) & (1) is standard Grafen/Zahavi synthesis. (4) & (5) is standard signalling (individual benefit via group access).
          *   *Real:*
              1.  **(1) vs. (3):** "General theory" vs. "Normal case". If indices are normal, HCP isn't general. This is the biggest logical crack.
              2.  **(1) vs. (6):** If HCP is general, why does human language bypass it? Needs scope restriction.
