  # HANDOUT: MAPPING THE INEFFICACY OBJECTION
  **Grad Reading Group: Collective Action & Individual Obligation**

  **Instructions:** Start at the top. Answer the questions based on your intuitions about the hard cases (the safe-seat vote, the single burger, the dial-turn torture). Follow the branches to find your position. Do not look at the leaf names until you arrive.

  ---

  ### THE DECISION TREE

  **1. What is the primary unit of moral evaluation?**
  *   **The Token Act:** We are judging *this specific occurrence* (e.g., *this* vote, *this* burger). $\rightarrow$ Go to 2.
  *   **The Act-Type / Pattern:** We are judging the *practice* or *maxim* (e.g., *voting in safe seats*, *eating meat*). $\rightarrow$ Go to 5.

  **2. (Token) Does the act's wrongness depend on its causal contribution to the harm?**
  *   **Yes:** The act is wrong only because of what it brings about. $\rightarrow$ Go to 3.
  *   **No:** The act can be wrong even if it changes nothing about the outcome. $\rightarrow$ Go to 4.

  **3. (Causal) In overdetermined cases (e.g., the dial torture), does your act make a difference?**
  *   **No (Causally Inert):** My act changes neither the outcome nor the probability of the outcome. $\rightarrow$ **LEAF A: Flat Inefficacy / No-Obligation**
  *   **Yes (Probabilistic):** My act has a non-zero chance of being pivotal (expected value). $\rightarrow$ **LEAF B: Act-Consequentialist Expected-Value**
  *   **Yes (Constitutive):** My act is a necessary part of a sufficient set, even if not pivotal. $\rightarrow$ **LEAF C: Threshold / Collective-Impact**

  **4. (Non-Causal Token) What makes the token act wrong if not causal impact?**
  *   **Agent's Internal State:** It reveals something about your will or character. $\rightarrow$ Go to 6.
  *   **Agent's External Relation:** It places you in a problematic group or role. $\rightarrow$ Go to 7.

  **5. (Act-Type) What validates the rule or pattern?**
  *   **Universalizability / Rules:** The act is wrong because it violates a rule no one should follow. $\rightarrow$ **LEAF D: Kantian / Rule-Consequentialist**
  *   **Structural Position:** The act is wrong because of your location in a system, regardless of the rule. $\rightarrow$ Go to 8.

  **6. (Internal State) Is the defect in the Will or the Character?**
  *   **The Will (Maxim):** You are acting on a principle that cannot be willed universally. $\rightarrow$ **LEAF D: Kantian / Rule-Consequentialist** *(Note: Converges with Type view)*
  *   **The Character (Trait):** You are expressing a vice (greed, callousness) regardless of the rule. $\rightarrow$ **LEAF E: Virtue / Expressive**

  **7. (External Relation) Is the relation voluntary or imposed?**
  *   **Voluntary Association:** You joined a harmful project or group. $\rightarrow$ **LEAF F: Complicity / Participatory**
  *   **Imposed Position:** You occupy a role in an unjust structure (chosen or not). $\rightarrow$ Go to 8.

  **8. (Structural) Does your position generate blame or only obligation?**
  *   **Blame + Obligation:** You are accountable for the structural harm. $\rightarrow$ **LEAF G: Structural Accountability**
  *   **Obligation Only:** You have duties to repair/resist, but blame is inappropriate (no control). $\rightarrow$ **LEAF H: Structural Obligation (No Blame)**

  ---

  ### THE LEAVES (POSITIONS)

  *   **LEAF A: Flat Inefficacy / No-Obligation.** (My vote/burger makes no difference; therefore, I have no obligation to refrain. Criticism is misplaced.)
  *   **LEAF B: Act-Consequentialist Expected-Value.** (My act has a tiny probability of triggering harm; Expected Disvalue = Probability $\times$ Magnitude. Obligation exists.)
  *   **LEAF C: Threshold / Collective-Impact.** (My act is a member of a set that *together* causes harm. I am wrong because I am in the harming set, not because I was pivotal.)
  *   **LEAF D: Kantian / Rule-Consequentialist.** (The question isn't "did this hurt?" but "what if everyone did this?" or "can this be a universal law?" Token impact is irrelevant.)
  *   **LEAF E: Virtue / Expressive.** (The act is wrong because it expresses a vicious character trait (e.g., callousness), regardless of consequences or rules.)
  *   **LEAF F: Complicity / Participatory.** (I am morally tainted by participating in a collective project that causes harm, even if my contribution was causally redundant.)
  *   **LEAF G: Structural Accountability.** (My position in the structure makes me both obligated to change it and blameworthy for sustaining it.)
  *   **LEAF H: Structural Obligation (No Blame).** (My position generates forward-looking duties to repair, but backward-looking blame is incoherent because I did not choose the structure.)

  ---

  ### LOGICAL SPACE MAPPING

  **Occupied Combinations:**
  The leaves above represent the stable, defended positions in the literature. They correspond to coherent combinations of answers (e.g., Token + Causal + Inert $\rightarrow$ Inefficacy).

  **Empty / Awkward Corners:**
  These are combinations of answers the tree allows but which yield unstable or unoccupied positions.

  1.  **Token Act + Rule-Consequentialism (without Universalizability).**
      *   *Status:* **Unattractive.** Judging a token act solely by a rule, without appealing to universalizability or consequences, collapses into arbitrary deontology or virtue ethics.
  2.  **Causal Dependence + Virtue Ethics.**
      *   *Status:* **Incoherent.** Virtue ethics locates wrongness in the agent's character, which is typically independent of luck/outcomes. Requiring causal impact for a virtue judgment contradicts the "control condition" of character.
  3.  **Structural Position + No Obligation.**
      *   *Status:* **Unexplored / Incoherent.** If one accepts the Structural view (that positions generate norms), denying *any* obligation renders the structural analysis morally inert. It becomes sociology, not ethics.

  ---

  ### INDISTINGUISHABLE POSITIONS

  **Flag:** **Leaf D (Kantian/Rule-Cons)** and **Leaf E (Virtue/Expressive)**.
  In many overdetermined cases (like the single burger), these views yield the same verdict ("Don't do it") and rely on similar non-causal reasoning (what the act *means* vs. what it *does*). The tree separates them by *source* (Will/Rule vs. Character), but in practice, a "callous maxim" looks a lot like a "callous character." Expect friction here.
