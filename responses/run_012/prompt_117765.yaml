answer: |-
  # JOINT STATEMENT ON MORAL UNCERTAINTY AND INTER THEORETIC COMPARISON

  ## I. AGREED CLAIMS

  1.  **The Locus of Disagreement:** Both camps agree that the dispute is not about which first-order moral theory is true, but about the decision rule an agent should employ when holding non-extreme credences across multiple conflicting moral theories.
  2.  **Convergence Conditions:** Both camps agree that when an agent holds credence 1 in a single theory, that theory's verdict dictates the choice. Both camps also agree that when all theories under consideration rank two options identically, the choice between them is determined.
  3.  **Concessions on Costs:** Camp 1 (Normalization) concedes that different normalization methods (e.g., range vs. variance) yield different verdicts on the same data, and that no non-arbitrary principle for selecting a normalization method has yet been universally established. Camp 2 (Non-Aggregative) concedes that their preferred rules (e.g., My Favorite Theory) ignore the intensity of value differences between options, potentially permitting choices that sacrifice immense value for negligible gains according to highly credible theories.
  4.  **Practical Irrelevance:** Both camps agree that the disagreement makes no practical difference when credences are sufficiently extreme (approaching 0 or 1) or when the cardinal structures of the competing theories are linear transformations of one another.
  5.  **Criteria for Progress:** Both camps agree that progress is not measured by conversion to the opposing view, but by identifying which formal properties of a decision rule (e.g., Independence of Irrelevant Alternatives, Scale Invariance) are non-negotiable requirements of rationality and which are optional.

  ## II. THE DISAGREEMENT

  *Note: No single sentence was found that both camps accept as a fair rendering of the opposing position. Each camp provides its own statement of the core dispute.*

  **Camp 1 (Normalization):**
  "The rational response to moral uncertainty is to maximize expected choiceworthiness. Since moral theories employ different scales, rationality requires us to normalize these scales to a common unit before aggregation. To refuse this integration is to arbitrarily discard information about the intensity of value held by credible theories."

  **Camp 2 (Non-Aggregative):**
  "Intertheoretic comparisons of value are metaphysically and semantically meaningless; there is no fact of the matter about how one theory's units map onto another's. Therefore, any normalization is a fiction that imposes a false precision. Rationality requires acting on the theory judged most likely correct or avoiding acts condemned by all serious theories, rather than aggregating incommensurable quantities."

  ## III. THE CRUXES AND TESTS

  | Crux | Camp 1 Position (Normalization) | Camp 2 Position (Non-Aggregative) | Test Case | Camp 1 Prediction | Camp 2 Prediction | What Moves Whom |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Meaningfulness** | Intertheoretic comparisons are meaningful if scales are normalized to a common statistical property (e.g., range). | Intertheoretic comparisons are never meaningful; units are inherently theory-relative and cannot be aligned. | **Symmetric Trade-off:** Two theories (50/50). Option A (T1: 10, T2: 0). Option B (T1: 0, T2: 10). | Indifference between A and B (Normalized values are equal). | Indifference between A and B (MFT splits or vetoes neither). | If Camp 2 accepts indifference is due to *equal value* rather than *tie-breaking*, they move toward Camp 1. |
  | **2. Menu Dependence** | Rational choice can depend on the set of available options because normalization factors (e.g., range) change with the menu. | Rational choice between two options should not depend on the presence of a third, irrelevant option (Independence of Irrelevant Alternatives). | **The Third Option:** Add Option C (T1: -90, T2: -990) to the Symmetric Trade-off above. | **Preference Shift:** A becomes strictly preferred to B. (T1 range expands to 100; T2 range expands to 1000. A scores higher). | **Stability:** A and B remain on a par. (T1 still prefers A; T2 still prefers B; credences unchanged). | If Camp 1 finds the reversal intuitive, Camp 2 moves. If Camp 1 finds it absurd, Camp 1 moves. |
  | **3. Individuation** | The verdict should not change if a theory is split into sub-variants with identical verdicts, provided normalization accounts for the split. | The verdict *will* change under re-description, proving aggregation is sensitive to arbitrary framing of the theory space. | **Re-description:** Split T1 into T1a and T1b (each 25%, identical verdicts to original T1 at 50%). | Verdict remains stable (if weighting is by credence mass) or shifts (if weighting is by theory count). Camp 1 commits to stability. | Verdict shifts, demonstrating that aggregation rewards "gerrymandering" the list of theories. | If Camp 1 cannot produce a normalization method invariant to theory-splitting, Camp 1 moves toward Camp 2. |
  | **4. Fanaticism** | A tiny credence in a theory with astronomical stakes can dominate the choice, unless normalization dampens the variance/range sufficiently. | A tiny credence should never dictate action against a near-certain moderate theory (My Favorite Theory dominates). | **The Fanatic:** 99.9% in Moderate Theory (diff: 10 units). 0.1% in Fanatic Theory (diff: $10^{30}$ units). | **Swamping:** The Fanatic Theory dictates the choice (Expected value of fanatic option exceeds moderate option). | **Resistance:** The Moderate Theory dictates the choice (0.1% is below the threshold of seriousness). | If Camp 1 accepts swamping is irrational, they must adopt a specific dampening normalization. If Camp 2 accepts swamping is rational, they move toward Camp 1. |
  | **5. Infinities** | Infinite values break expected choiceworthiness unless treated via surreal numbers or lexical priority rules. | Infinite values confirm the impossibility of aggregation; no finite probability can weigh against an infinite stake. | **The Infinite Stake:** One theory assigns infinite disvalue to Option X. | **Lexical Avoidance:** Option X is ruled out regardless of other theories' credences (if normalization handles infinity). | **Veto:** Option X is ruled out because at least one serious theory condemns it. | If both rule out X but for different mathematical reasons, the practical difference vanishes, but the justification remains distinct. |

  ## IV. CLOSING DIAGNOSIS

  **Verbal and Definitional Disputes:**
  1.  **Individuation of Theories:** A portion of the dispute stems from differing definitions of what constitutes a "theory." Camp 1 treats theories as fixed inputs for a function; Camp 2 treats the listing of theories as itself a normative act subject to manipulation. Agreement on a principle of theory-individuation would resolve Crux 3.
  2.  **The Nature of the "Should":** Camp 1 often speaks of a "rational requirement" to maximize a mathematical expectation. Camp 2 often speaks of a "permission" to follow the most likely truth. If Camp 1's "should" is interpreted as a pragmatic heuristic rather than a truth-apt claim about moral reality, some substantive friction dissolves.

  **Substantive Disputes:**
  1.  **Axioms of Rationality:** The core substantive disagreement is over which decision-theoretic axioms are binding. Camp 1 prioritizes *State-Wise Dominance* and *Information Integration* (using all credence data). Camp 2 prioritizes *Independence of Irrelevant Alternatives* and *Scale Invariance*. These are mutually incompatible in the context of moral uncertainty; one cannot satisfy both without restricting the domain of applicable theories.
  2.  **Metaphysics of Value:** Camp 2 maintains a substantive claim that value units are essentially private to theories (like temperature vs. length). Camp 1 maintains a substantive claim that value units are structurally analogous across theories (like length measured in inches vs. centimeters). This is not merely verbal; it is a disagreement about the structure of normative reality.

  ***

  **Signed,**

  _________________________
  **Representative, Camp 1 (Normalization)**

  _________________________
  **Representative, Camp 2 (Non-Aggregative)**

  _________________________
  **Rapporteur**
