answer: |-
  1. LTCM's risk models offered an average-case guarantee of solvency conditional on market environments remaining within the class of historical statistical distributions characterized by stable correlations and low volatility. Their Value-at-Risk calculations assumed that price movements followed a normal distribution, effectively quantifying risk only over environments where past relationships held true.

  2. The Russian default and subsequent flight to liquidity constituted a distributional shift out of the modeled class rather than a mere tail event within it, as historical correlations between asset classes broke down completely. This distinction matters because the models were entitled to claim safety only within the original distribution, leaving them silent and vulnerable when the environment shifted to a regime of universal correlation collapse.

  3. A genuine worst-case guarantee would have required holding capital reserves sufficient to survive total market closure or arbitrary price movements, a requirement that is either ruinously costly or vacuous in practice. This parallels the alignment claim that unbounded worst-case guarantees are empty, suggesting that only bounded robustness against specific adversarial budgets or shift magnitudes is a meaningful demand.

  4. This episode suggests that average-case alignment guarantees will similarly fail under distributional shift, yet the finance analogy breaks down because markets provided immediate price signals and feedback that AI deployment may lack. Without such corrective feedback, the cost of violating an average-case guarantee in AI could be catastrophic rather than merely financial.

  5. The case favors bounded worst-case reasoning over pure average-case expectations, but exposes the dichotomy's limit by showing the critical task is defining the bound of the environment class rather than choosing between extremes. Ultimately, the failure lies not in choosing worst-case over average-case, but in misidentifying the set of environments over which any guarantee is claimed to hold.
