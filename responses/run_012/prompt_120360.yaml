answer: |-
  Your verdicts do cohere, but not under a single flat rule. They cohere under a **tiered principle of epistemic responsibility**. Your hunch about "bring" versus "have" is close, but the critical distinction is not between priors and data; it is between **processing** (what you do with inputs) and **positioning** (where you stand relative to the other agent).

  Here is the principle that repairs your hunch, followed by the mapping, predictions, and the honest mismatch you requested.

  ### The Principle of Calibrated Divergence

  **Disagreement is epistemically defective if it persists after agents have corrected for processing errors, updated on the fact of the disagreement itself, and weighted each other by relative reliability. Disagreement is legitimate only if it rests on a "rational residual": a difference in foundational priors or values that survives this calibration.**

  This principle has three operative clauses:

  1.  **The Processing Clause:** Agents must not differ on the mechanical manipulation of shared inputs. (Logic, math, basic inference).
  2.  **The Symmetry Clause:** If agents regard each other as epistemic peers (symmetric reliability), they must update their views toward one another upon learning of the disagreement.
  3.  **The Weighting Clause:** If agents differ in reliability (asymmetric track record, expertise, or information access), the less reliable agent must defer to the more reliable one, regardless of priors.

  ### Mapping the Clauses to Your Cases

  *   **Case 1 (Inflation Forecast):** Violates the **Processing Clause**. "Same training" implies symmetric reliability and shared priors. If the numbers differ, one has miscalculated. The disagreement is a bug, not a feature.
  *   **Case 2 (Pre-2020 Weighting):** Satisfies the **Symmetry Clause** but invokes the **Rational Residual**. The "weighting" is treated not as a processing error but as a foundational prior (a methodological value). Because they are peers, they update (Case 3), but because the divergence is prior-based, a residual gap is permitted.
  *   **Case 3 (Colleague Exchange):** Enacts the **Symmetry Clause**. The movement *is* the Bayesian update on the fact of the other's opinion. Refusing to move implies you think you are more reliable than you have demonstrated; collapsing implies you think you are less reliable.
  *   **Case 4 (Unknown Hypothesis):** Fails the precondition of **Shared Inputs**. There is no disagreement to adjudicate because the "shared data" condition is not met.
  *   **Case 5 (Same Prob, Opposite Wants):** Satisfies the **Rational Residual** condition for Values. This is not an epistemic disagreement but an axiological one. The principle does not demand convergence on ends.
  *   **Case 6 (Student vs. Field):** Enacts the **Weighting Clause**. This is the asymmetry case. The "Field" represents aggregated reliability and track record. The student's prior is uncalibrated; the field's prior is tested. The student must defer not because their logic is wrong, but because their *weight* is lower.
  *   **Case 7 (Bad Faith):** Violates the **Meta-Epistemic Condition**. Attributing disagreement to character rather than evidence destroys the possibility of applying the Processing or Symmetry clauses. It halts the calibration mechanism.

  ### Predictions for New Cases

  Here is how the Principle of Calibrated Divergence handles the three scenarios you requested:

  **1. The Poorer Reasoner (Shared Prior/Data, Different Skill)**
  *   **Scenario:** A and B share priors and data. A is a skilled logician; B is prone to fallacies. They disagree.
  *   **Prediction:** The disagreement is a **defect in B**, but **A should not fully converge to B**. Under the Weighting Clause, A should assess B's reliability. A should move slightly (acknowledging the possibility of their own blind spots, per Symmetry), but B should move significantly toward A. If B refuses, B is violating the Processing Clause.
  *   **Verdict:** Asymmetric updating.

  **2. Trust in Opinion (Uncertain Reliability)**
  *   **Scenario:** A and B disagree. A knows B is honest but is unsure if B is competent.
  *   **Prediction:** A must update based on the *probability* of B's competence. If A assigns a 50% chance that B is a peer, A moves halfway toward B. If A assigns a 10% chance, A moves slightly.
  *   **Verdict:** The degree of movement is a function of the estimated reliability weight. Refusing to move at all implies A believes B's competence is zero.

  **3. Disagreement on Evidence (What Counts as Data)**
  *   **Scenario:** A counts anecdotal testimony as evidence; B requires double-blind trials.
  *   **Prediction:** This is a **Case 2 (Prior/Methodological)** issue, not a Processing issue. It is a difference in how they carve up the world.
  *   **Verdict:** Legitimate divergence, *provided* they acknowledge it as methodological. However, if one method has a objectively higher track record of prediction (Weighting Clause), the proponent of the weaker method should defer on predictions, even if they maintain their methodological preference.

  ### The Honest Mismatch

  There is a tension in your verdicts that the principle exposes but cannot fully dissolve without a concession from you.

  **The Conflict:** Case 2 vs. Case 3 (and Aumann).
  In Case 2, you say: *"Neither has slipped up, and I would not be surprised if they never converge."*
  In Case 3, you say: *"We end up somewhere in between. I think that is exactly the right behaviour."*

  **The Problem:** If Case 3 is the "right behaviour" for peers, then Case 2 economists *must* converge, at least partially. If they "never converge," they are violating the Symmetry Clause. Aumann's theorem suggests that if they truly know each other's numbers and respect each other as peers, the gap *must* close. By saying they might "never converge," you are implicitly treating their methodological weights as **Values (Case 5)** rather than **Probabilities (Case 1)**.

  **The Repair:**
  You have two options to resolve this tension in your column:

  1.  **Complicate the Clause (Recommended):** Admit that in Case 2, the economists are not disagreeing about *what will happen* (facts), but about *what matters* (values/methodology). If they disagree on the forecast *number*, they must converge. If they disagree on the *model* used to generate the number, they may diverge. You must distinguish between **ontological disagreement** (the world) and **methodological disagreement** (the lens).
  2.  **Give Up the Verdict:** Concede that if the Case 2 economists truly respect each other and share the data, "never converge" is too strong. They should converge asymptotically. If they don't, one is secretly treating their prior as infallible, which is a form of bad faith (Case 7).

  **My Advice:**
  Take option 1. It strengthens your column. It allows you to argue that much of what looks like expert disagreement on *facts* is actually disguised disagreement on *weights/values*.

  **Revised Verdict for Case 2:** "Neither has slipped up on the math, but they are no longer arguing about the inflation rate alone; they are arguing about the relevance of history. They will converge on the prediction if they update on each other's reliability, but they may permanently disagree on the model."

  This preserves your "Bring vs. Have" hunch, provided you define "Bring" as **Methodological Values** and "Have" as **Shared Evidence**. When "Bring" dictates how "Have" is measured, disagreement is legitimate. When "Bring" simply miscalculates "Have," it is a defect.
