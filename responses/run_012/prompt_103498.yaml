prompt: |-
  I teach an upper-level seminar in the philosophy of technology, and this term the material became personal: I have just been appointed to my hospital's technology review committee, which is weighing a proposal to add a mandatory waiting period and a second-approver step to an automated prescribing tool. Half the committee treats this as a neutral workflow tweak with no political content; the other half says the tool was already making a political decision before anyone touched the workflow, and that the new step merely makes it visible. I need a final-exam essay question that forces students past reciting the stock debate over whether artifacts have politics and makes them do the analytic work themselves.

  Please act as an experienced examiner and philosopher of technology. Start by brainstorming the distinct senses in which a design feature might be called political, then settle on the one or two that make the question sharp rather than merely surveyable.

  I want a single essay question, answerable in about 60 minutes, that asks students to separate three readings of the claim that an artifact has politics: (i) an expressive reading, on which the design encodes or expresses a value; (ii) a causal reading, on which the design produces or stabilizes a distribution of power; and (iii) a constitutive reading, on which the design partly constitutes the political relation rather than merely expressing or causing it. The question should require students to say which reading, if any, the waiting-period proposal satisfies, and to say how one would tell the readings apart in practice — for instance, what evidence would show that a design is doing constitutive work rather than merely expressing a politics already settled elsewhere.

  Then give me: the question; a model answer of roughly 700 words; and a marking scheme totaling 25 marks that names the specific moves a first-class answer must make and the specific moves that should cap an answer at a lower band, noting for each must-hit point the way students typically get it wrong. Students will have studied the standard literature on technology and politics, so the marks should reward applying and interrogating the distinctions, not naming who said what; no citations are needed.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level philosophy of technology seminar. Instructor is on a hospital technology review committee dealing with an automated prescribing tool (mandatory waiting period + second approver).
      *   **Conflict:** Committee split between "neutral workflow tweak" vs. "making visible pre-existing political decisions."
      *   **Goal:** Create a final-exam essay question (60-minute duration).
      *   **Specific Requirement:** The question must force students to distinguish three specific readings of "artifacts have politics":
          1.  *Expressive:* Design encodes/expresses a value.
          2.  *Causal:* Design produces/stabilizes power distribution.
          3.  *Constitutive:* Design partly *constitutes* the political relation (not just expressing or causing).
      *   **Task:** Students must apply these to the waiting-period proposal and explain how to distinguish them empirically/conceptually (evidence for constitutive vs. expressive).
      *   **Deliverables:**
          1.  Brainstorming distinct senses of "political" (to settle on the sharpest ones).
          2.  The Essay Question.
          3.  Model Answer (~700 words).
          4.  Marking Scheme (25 marks total, specific moves for first-class vs. lower bands, common errors).
      *   **Constraint:** No citations needed (students know the lit), focus on application/interrogation.

  2.  **Brainstorming "Political" in Design:**
      *   *Idea 1: Intent.* Did the designer intend a political outcome? (Too psychological, hard to prove).
      *   *Idea 2: Impact.* Does it affect who gets what? (Distributive justice).
      *   *Idea 3: Agency.* Does the artifact act as a moral agent? (Latour).
      *   *Idea 4: Constitution.* Does the artifact define the subjects involved? (Feenberg, Ihde).
      *   *Selection:* The prompt explicitly asks for Expressive, Causal, and Constitutive. I need to ensure the brainstorming validates these specific three as the most analytically useful for this specific hospital scenario.
      *   *Refinement:*
          *   *Expressive:* Symbolic. "We value caution."
          *   *Causal:* Instrumental. "This slows down prescriptions, reducing errors but increasing workload."
          *   *Constitutive:* Ontological/Relational. "This changes the doctor from a decider to a ratifier, fundamentally altering the clinical relationship."
      *   *Decision:* These three map well onto the committee dispute. The "neutral tweak" crowd sees it as Causal (maybe) or non-political. The "visible politics" crowd sees it as Expressive or Constitutive. The Constitutive reading is the hardest and most philosophically rich, fitting for an upper-level seminar.

  3.  **Drafting the Essay Question:**
      *   Needs to be concise but dense enough for 60 minutes.
      *   Must explicitly name the three readings (Expressive, Causal, Constitutive).
      *   Must require application to the hospital case.
      *   Must require a method for distinguishing them (evidence).
      *   *Draft:* "Consider the hospital proposal. Distinguish between expressive, causal, and constitutive politics. Which applies? How do you tell?" -> *Too simple.*
      *   *Revision:* Make it demand an argument about *which* reading is most salient and *how* to verify it.
      *   *Final Polish:* Ensure the distinction between "causing power shifts" and "constituting the relation" is clear in the prompt instructions.

  4.  **Drafting the Model Answer:**
      *   *Length:* ~700 words.
      *   *Structure:*
          1.  Define the three readings briefly.
          2.  Apply to the case (Waiting period/second approver).
          3.  Argue for the Constitutive reading (as it's the most philosophically demanding).
          4.  Address the "how to tell" (evidence) requirement.
      *   *Content:*
          *   Expressive: Symbolizes distrust of automation or doctors.
          *   Causal: Slows throughput, shifts workload to approver.
          *   Constitutive: Transforms the nature of prescribing from clinical judgment to bureaucratic compliance.
          *   Evidence: Look at how actors describe their role *after* implementation. If they say "I am checking boxes" vs "I am healing," that's constitutive.
      *   *Tone:* Academic, precise, analytical.

  5.  **Developing the Marking Scheme:**
      *   *Total:* 25 marks.
      *   *Categories:*
          *   Conceptual Clarity (Definitions).
          *   Application to Case.
          *   Methodological Distinction (Evidence).
          *   Argumentative Cohesion.
      *   *First-Class (20-25):* Nuanced distinction between causal and constitutive (the hardest part). Clear evidence criteria.
      *   *Mid-Range (13-19):* Good definitions, but blurs causal/constitutive. Generic application.
      *   *Lower Band (0-12):* Confuses the categories. Recites "artifacts have politics" without analysis.
      *   *Common Errors:* Treating constitutive as just "long-term causal." Ignoring the evidence requirement.

  6.  **Review and Refine:**
      *   *Check against constraints:* Did I start with brainstorming? Yes. Is the question single? Yes. Is the model answer ~700 words? (Need to monitor count). Is the marking scheme 25 marks? Yes. Are citations avoided? Yes.
      *   *Self-Correction on Model Answer:* Ensure I don't just list the three but *argue* for one while acknowledging the others. The prompt asks "which reading... satisfies," implying a choice or a hierarchy. I will argue that while all three apply, the constitutive is the one that resolves the committee deadlock.
      *   *Self-Correction on Marking Scheme:* Make sure the "common errors" are specific to the prompt's tripartite distinction. A common error will be collapsing (ii) and (iii).

  7.  **Final Polish:** Check tone. It should sound like a colleague speaking to a colleague (experienced examiner to instructor).

  *(Self-Correction during drafting the Model Answer)*: I need to be careful with word count. 700 words is roughly 3/4 of a single-spaced page. I need to be economical. I will focus heavily on the distinction between Causal and Constitutive, as that is the philosophical crux.

  *(Self-Correction during Marking Scheme)*: Ensure the marks add up to 25. Let's do 5 for definitions, 10 for application/argument, 10 for the methodological/evidence distinction. Or maybe 5/10/10 is too skewed. Let's try: 5 (Concepts), 10 (Case Application), 10 (Methodological/Evidence). That works.

  Let's write it.cw
answer: |-
  ### Brainstorming the Senses of "Political" in Design

  Before settling on the question, we must ensure the three categories you requested are distinct enough to be analytically useful in a 60-minute exam context.

  1.  **Instrumental/Causal:** The artifact is a tool that affects power distributions (e.g., a speed bump forces drivers to slow down, shifting power from driver to planner). *Risk:* Students often reduce all politics to this (consequentialism).
  2.  **Symbolic/Expressive:** The artifact signals a value or stance (e.g., a camera signals surveillance). *Risk:* Students treat this as "mere" rhetoric, ignoring material effects.
  3.  **Constitutive/Ontological:** The artifact changes the *nature* of the actors and relations involved (e.g., the prescribing tool doesn't just slow the doctor; it redefines "doctoring" from judgment to compliance). *Risk:* Students conflate this with long-term causal effects.

  **Selection:** The **Constitutive** reading is the sharpest for your seminar. It moves beyond "who wins/loses" (causal) or "what does this say" (expressive) to "what kind of world is being built?" This distinction forces students to grapple with the committee's deadlock: the "neutral tweak" group sees only Causal/Expressive elements, while the "visible politics" group is intuiting the Constitutive shift.

  ***

  ### Final Exam Essay Question

  **Question:**
  Consider the hospital committee's proposal to institute a mandatory waiting period and second-approver step for an automated prescribing tool. One faction calls this a neutral workflow tweak; the other argues it renders visible a political decision already embedded in the tool.

  Distinguish between three readings of the claim that this design feature is "political": (i) an **expressive** reading (encoding values), (ii) a **causal** reading (stabilizing power distributions), and (iii) a **constitutive** reading (forming the political relation itself).

  In a timed essay, argue which of these three readings best captures the stakes of the proposal. Crucially, you must explain how one would empirically distinguish a *constitutive* effect from a merely *causal* one. What specific evidence would demonstrate that the design is not just shifting power or expressing values, but actively redefining the roles of the clinicians and patients involved?

  ***

  ### Model Answer (Approx. 700 words)

  To analyze the hospital proposal, we must disaggregate the claim that the design is "political." While the three readings overlap, they locate the politics in different ontological layers of the technology.

  The **expressive reading** treats the waiting period as a signal. It suggests the system encodes a value of "caution over speed" or "distrust of automation." Here, the politics is semiotic. If the waiting period were removed, the value signal would vanish, but the workflow might remain functionally similar. The **causal reading** treats the design as an intervention in a pre-existing field of power. It predicts material outcomes: prescriptions slow down, error rates drop, and physician autonomy is reduced in favor of bureaucratic oversight. The politics here is distributive: who bears the cost of the delay, and who holds the veto power?

  However, both the "neutral tweak" and "visible politics" factions risk missing the **constitutive reading**. On this view, the technology does not merely act upon existing subjects (doctors, patients, administrators) nor simply express values about them. Rather, the waiting period and second-approver step partially *construct* what it means to be a "prescriber" in this context. Before the tool, prescribing was a clinical act of judgment. With the mandatory wait and external approval, prescribing becomes a bureaucratic act of compliance. The political relation is not just shifted; it is invented anew. The doctor is no longer solely a healer but a node in a verification chain.

  The constitutive reading best captures the stakes of the proposal because it explains the intensity of the committee's deadlock. If this were merely causal (a workflow tweak), the debate would be about efficiency metrics. If it were merely expressive, it would be about morale. The conflict is existential: it is about the identity of the clinical role. The "neutral" faction assumes the subject (the doctor) remains constant while the tools change. The "political" faction intuits that the tool changes the subject.

  Distinguishing the constitutive from the causal is the critical analytic challenge. A causal effect is observable as a change in variable magnitude (e.g., time-to-prescribe increases, error rate decreases). A constitutive effect is observable as a change in the *description of action* provided by the actors themselves.

  To evidence a constitutive claim, one cannot simply measure throughput. One must examine the phenomenological self-understanding of the clinicians. If the design is merely causal, doctors will complain about the delay but still describe their action as "treating patients." If the design is constitutive, their language will shift. They will begin to describe their work as "clearing queues," "managing risk," or "satisfying protocols." The evidence lies in the erosion of clinical vocabulary in favor of administrative vocabulary.

  Furthermore, a causal reading allows for reversal without residue. If you remove a speed bump, the car drives fast again. A constitutive change leaves a trace even if removed. If the waiting period were abolished after six months, would the doctors return to their prior mode of judgment, or would they remain habituated to seeking external validation? If the latter, the technology constituted a new form of subjectivity.

  Therefore, the proposal is not neutral. It is not merely expressing caution or causing delays. It is instituting a specific form of political life within the hospital where trust is externalized from the professional to the system. To treat it as a workflow tweak is to ignore that workflows define who we are allowed to be. The committee's task is not just to optimize safety, but to decide what kind of medical practice they wish to constitute. The evidence required is not just in the error logs, but in the minutes of staff meetings where the very definition of "care" is renegotiated around the constraints of the software.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Conceptual Distinction (5 Marks)**
  *   **5 (First-Class):** Clearly defines all three readings. Crucially, distinguishes *causal* (change in distribution/outcome) from *constitutive* (change in subject/role definition).
  *   **3-4 (Upper-Mid):** Defines all three but blurs the line between causal and constitutive (e.g., treats constitutive as just "long-term causal").
  *   **1-2 (Lower-Mid):** Definitions are vague or conflated. Treats "political" as a single monolithic concept.
  *   **0:** Fails to address the three categories.
  *   *Common Error:* Defining "constitutive" simply as "having a big impact."

  **2. Application to the Case (10 Marks)**
  *   **8-10 (First-Class):** Argues persuasively for one reading (preferably constitutive) while acknowledging the others. Explains *why* the committee deadlock exists through the lens of the chosen reading (e.g., ontological clash vs. efficiency debate).
  *   **5-7 (Upper-Mid):** Applies the categories to the case but treats them as a checklist rather than an argument. Identifies the stakes but misses the connection to the committee's specific disagreement.
  *   **2-4 (Lower-Mid):** Generic application. "The tool has politics because it affects people."
  *   **0-1:** Irrelevant to the hospital scenario.
  *   *Common Error:* Taking sides with the committee factions without analyzing *why* their disagreement maps onto the philosophical categories.

  **3. Methodological/Evidence Distinction (10 Marks)**
  *   **8-10 (First-Class):** Provides a concrete criterion for distinguishing constitutive from causal effects (e.g., linguistic shifts in self-description, irreversibility/habituation). Shows understanding that constitutive claims require different evidence than causal claims.
  *   **5-7 (Upper-Mid):** Suggests evidence (e.g., "ask the doctors") but doesn't explain *what* in their answers would prove constitution vs. causation.
  *   **2-4 (Lower-Mid):** Suggests only quantitative data (error rates, time logs), which only proves causal effects.
  *   **0-1:** No discussion of evidence.
  *   *Common Error:* Proposing surveys that measure satisfaction (causal/expressive) rather than interviews that measure role-identity (constitutive).

  **Total: 25 Marks**

  **Examiner's Note for Grading:**
  A first-class answer does not need to cite Winograd, Feenberg, or Latour. It needs to demonstrate the *logic* of those positions. Penalize answers that treat the "constitutive" reading as mystical; it must be grounded in observable changes in practice or language. If a student argues the proposal is *only* expressive, they can still achieve high marks if they rigorously defend the evidentiary boundary between expression and constitution.
