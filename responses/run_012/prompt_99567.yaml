answer: |-
  **Mara:** Let's skip the famine relief examples. I want to press your defense directly. You argue that consequentialism isn't overly demanding because an agent's personal projects—family, health, rest—are themselves welfare-producing. Therefore, maintaining them is permitted up to the point where sacrificing them yields more utility elsewhere. My worry is that this offers no stable baseline. You're redescribing self-interest as instrumental altruism. But if the value of my projects is purely instrumental, the baseline shifts with every calculation. Either this accommodation swallows the objection entirely, or it collapses back into extreme demandingness the moment the calculus tips. Which is it?

  **Julian:** It's not a shift; it's an optimization. Think of it like system maintenance. You don't keep a server running at 100% capacity indefinitely because hardware degrades. Rest and relationships are maintenance costs. They are permitted not because you have a right to them, but because neglecting them reduces your long-term output. The baseline is fixed by the principle of maximizing welfare, but the *application* recognizes diminishing returns.

  **Mara:** But that makes the protection contingent on empirical facts, not structural principles. Suppose I'm a software engineer. It's 2:00 AM, and a critical deployment fails. I'm exhausted. My "project" of health says sleep. But the "project" of welfare says if I fix this now, I save a client thousands of dollars that could be donated to effective charities. If I sleep, I risk greater loss tomorrow. On your view, I must work. My health is only protected if staying healthy produces more welfare than burning out. If the crisis is big enough, I'm sacrificed.

  **Julian:** In that specific case, yes. But how often is the crisis that big? Most late nights produce buggy code, which costs more later. The empirical reality is that sustainable agents produce more welfare than martyrs. So, while the baseline is theoretically contingent, practically it aligns with what we consider reasonable. The objection assumes a world where sacrifice is always efficient. That's rarely true.

  **Mara:** You've moved the goalposts. The demandingness objection isn't about whether the world *happens* to be nice; it's about what the theory *requires* if the world isn't. If the empirical facts changed—if, say, AI monitoring ensured I could work safely without burnout—would the requirement vanish? No. The demand would return. So your reply doesn't solve the philosophical problem; it just hopes the world cooperates. If the redescription of my projects as welfare-producing is only valid when it aligns with maximizing, then my projects have no intrinsic protection. They are hostage to the calculus.

  **Julian:** They aren't hostage; they are inputs. Look, if you argue that morality shouldn't demand sacrifice when the cost to the agent is high, you're smuggling in a non-consequentialist constraint. You want a protected sphere of agency. I'm saying the sphere exists, but its boundary is drawn by welfare, not by autonomy. If the world becomes harsher, yes, morality becomes harder. But that's a feature, not a bug. It means the theory is sensitive to reality.

  **Mara:** Sensitivity is fine, but stability is necessary for a normative guide. If I can never know if my project is protected until I run the numbers, I live in a state of moral precariousness. You say the accommodation doesn't collapse because burnout is real. But suppose I'm uniquely effective. Suppose my marginal gain from working is always higher than my marginal loss from rest. Your theory then demands I work until I drop. The redescription fails to stop the demandingness; it just renames the fuel.

  **Julian:** If you are uniquely effective, then yes, you have a unique obligation. That follows from the premise that everyone counts equally. But this is rare. For most agents, the "maintenance cost" is high enough that the demandingness is muted. You're treating a contingent mitigation as a structural failure.

  **Mara:** It's a structural failure because the mitigation is external to the theory. You're relying on psychology and economics to do the work that ethics should do. If the objection is that the theory demands too much, answering with "usually, facts prevent that" isn't a defense of the theory; it's a hope about the world. The baseline remains unstable because it's defined by the very maximization principle the objection challenges.

  **Julian:** I think you're demanding a guarantee the theory shouldn't provide. Consequentialism says "maximize the good." If the good requires little sacrifice, so be it. If it requires much, so be it. To build in a structural limit is to abandon consequentialism. So, strictly speaking, you're right: the baseline isn't fixed independently of the calculus. But that doesn't make the objection decisive; it just means the theory accepts high stakes when the stakes are high.

  **Mara:** Then we agree the objection isn't refuted, only managed.

  **Julian:** Precisely. And I think that's the honest place to stop. The redescription of projects as welfare-producing doesn't logically disarm the demandingness objection. It shows that, given human psychology and economic diminishing returns, the demandingness is often less severe than critics fear. But it establishes that if the empirical facts were different, the demand would return. The objection survives as a structural critique, even if it loses force as a practical complaint.

  **Mara:** So the theory remains radically demanding in principle, but moderately demanding in practice.

  **Julian:** Yes. And whether that is acceptable depends on whether you think morality should be comfortable. I don't think it should. You do. That's where we actually disagree.

  **Mara:** Then the dialogue hasn't settled whether the objection is decisive, only that it hinges on whether we accept a morality that is contingent on empirical luck.

  **Julian:** Correct. The redescription saves the agent from burnout, but not from the obligation. The baseline is stable only as long as the world is kind. We haven't solved the instability; we've just measured it.
