  2.  **Deconstruct the Philosophy:**
      *   *What is said:* The literal truth-conditional content.
      *   *What is implicated:* The inferred meaning based on the assumption of cooperation (Quality, Quantity, Relation, Manner).
      *   *Cancellation:* You can cancel conversational implicatures ("He's a great philosopher, but not very smart" vs "He's a great philosopher. I'm not saying he's smart."). You generally *cannot* cancel conventional implicatures (markers like "but", "therefore" carry meaning that isn't truth-conditional but is attached to the words).
      *   *The Bot:* Represents a semantic engine. It catches lies (Quality violation) and direct orders (maybe defined as imperatives violating protocol). It misses the pragmatic inference.
