prompt: |-
  Hey, so I'm in this philosophy of language class and we've spent like two weeks on Grice and now I have to write a short story for the final that "dramatizes" the gap between what a speaker literally says and what they actually mean. Prof keeps stressing the story has to show the machinery working, not just have someone be sarcastic or say the opposite of what they mean. So the hearer has to actually reason about what the speaker intended, and I have to be able to point to why the literal content on its own won't do the job.

  Here's the setup I want: a story set at a company that has a compliance bot. The bot transcribes everything and flags anything that's literally false or literally an instruction to break a rule. It's genuinely good at the "what was said" level — disambiguating, resolving who "she" refers to, that kind of thing. It's totally blind to implicature, because it can't model why a person said one thing rather than another thing they could've said. The manager knows this and runs the whole department through hints. He never lies, never gives an order, just says things that are true and lets everyone infer the rest. I want the climax to be the bot's transcript being 100% accurate and everyone having done the bad thing anyway.

  A few things I need in it, because the marking scheme definately cares:

  1. Somewhere someone tries to cancel an implicature out loud — like "I'm not implying anything, I'm just saying..." — and it should be clear whether that works and why. I want it to work in one spot and fail in another, and the failure should be because the word itself is doing the work, the way "but" or "even" or "therefore" shove something through no matter how you hedge afterward.

  2. A scene where the exact same content said a different way carries no hint at all, to show that some implicatures ride on how you said it and not on what you said.

  3. I want the reasoning to be visible on the page — the hearer has to think something like "why is she telling me this, of all things, right now" and get to the meaning from there.

  Also our prof has this phrase she keeps using, "cooperative bluff" — when you're relying on the other person being cooperative enough to infer what you won't come out and say. Work that in as the theme if it fits.

  Don't make it a lecture, it should just be a story. Maybe 900 words? Whatever feels right. And please don't name-drop a bunch of real papers, I can't cite anything anyway and it'll just look fake.
