prompt: |-
  I run a small philosophy podcast and next months guest is someone who's spent the last few years defending the view that omissions can be causes. Her line, as best I can reconstruct it: causation is at bottom a matter of making a difference, and once you accept that there's no good reason to insist that the things related by the causal relation have to be events — an absence can make a difference just as surely as a shove can. She also holds that the doing/allowing distinction is real but isn't a causal distinction; it's a moral one that we smuggle into our causal talk. And she has some story about why we don't count every omission as a cause of everything, something to do with which omissions the agent had a role-based reason to perform.

  I want to interview her properly rather than let her restate the view for fourty-five minutes. Could you draft eight to ten questions? I want at least one that goes at the metaphysics of absences — what exactly sits on the omission side of the relation, and why that's a cause rather than just a fact about what didn't happen; one on the counterfactual side, i.e. what the possible-worlds story is supposed to be doing when the thing we're calling the cause is a non-happening, and whether the account can tell a positive cause and an omission apart when they're symmetrical difference-makers; one on the doing/allowing distinction, where I want to know how it survives once she's said it isn't causal; and one on the awkward cases where two candidate causes are both difference-makers but we only want to call one of them the cause (pre-emption, that sort of thing), with an omission as one of the candidates.

  For each question give me a follow-up keyed to the answer she's most likely to give, so I'm not sat there nodding. Finish with something on what would count against the view: what would she accept as a reason to think omissions are never causes, and is her role-based constraint doing so much work that the view stops predicting anything?

  One more thing, and I dont think this is in the literature, it's just my own bugbear. A hospital drug pump is supposed to deliver a dose at 3am, it silently doesn't, nobody checks, the patient dies. Everyone agrees the failure to check is the thing to criticise. But are the pump's not delivering and the nurse's not checking two causes, one cause, or one cause plus a background condition? I want to know whether her account can answer that in a principled way instead of just landing on whichever answer matches our blaming practices.

  If a question leans on a technical term, stick a short gloss in brackets so I don't have to bluff my way through it. No citations or reading lists, I just want questions I can read out loud. Write it all in British English.
