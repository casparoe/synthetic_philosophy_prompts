answer: |-
  This is a classic debate in political philosophy. Your friend is channeling **John Harsanyi**, the Nobel Prize-winning economist who famously critiqued Rawls on exactly these grounds. Harsanyi argued that if you treat the Veil of Ignorance as a standard decision problem under uncertainty, rational agents *must* maximize average utility. Rawls, conversely, argued that the Original Position is not a standard decision problem.

  To settle the fight, we need to dissect the "Lottery Analogy" your friend is using. It is intuitive, but Rawls explicitly designed the Original Position to break that intuition.

  Here is the explicit correspondence, where it breaks, and whether those breaks save the Difference Principle.

  ### 1. The Correspondence: Mapping the Lottery Analogy

  Your friend's argument relies on mapping **Decision Theory** onto **Political Philosophy**. Here is the explicit map he is using:

  | **The Lottery (Econ Model)** | **The Society (Rawls' Veil)** | **The Function** |
  | :--- | :--- | :--- |
  | **The Urn/Drum** | **The Population** | The set of possible outcomes. |
  | **The Tickets** | **Social Positions** | Specific life trajectories (rich, poor, disabled, talented). |
  | **Drawing a Ticket** | **Being Born** | The random assignment of your place in society. |
  | **Not Seeing the Number** | **The Veil of Ignorance** | Ignorance of your specific future status. |
  | **The Jackpot/Prize** | **Primary Goods** | Income, wealth, rights, liberties. |
  | **Expected Value** | **Average Utility** | The sum of welfare divided by population. |
  | **Risk Aversion** | **Maximin Strategy** | Choosing the option where the worst outcome is the least bad. |

  **The Econ Conclusion:** In a lottery, if you don't know the odds, the Principle of Insufficient Reason says you should assume every ticket is equally likely. Therefore, a rational agent maximizes the *average* payoff. To choose the *minimum* payoff (Maximin) implies infinite risk aversion, which is irrational unless the downside is death.

  ### 2. Where the Analogy Breaks

  Rawls anticipates this objection (in *A Theory of Justice*, Sections 27–28). He argues the analogy fails in four critical ways. Three of these are incidental, but one is fatal to your friend's conclusion.

  #### Break A: Probabilities (The "Risk" vs. "Uncertainty" Distinction)
  *   **The Analogy:** In a lottery, there are objective probabilities (1 in 10 million). Even if you don't know them, standard theory says you should estimate them.
  *   **The Reality:** Rawls insists there are **no objective probabilities** in the Original Position. You are not a soul waiting to be born into an existing statistical distribution. You are *constructing* the distribution.
  *   **Does it matter?** **Yes.** Expected Utility Theory (your friend's weapon) requires probabilities. If you cannot assign a probability to being in the bottom 10%, you cannot calculate an "expected value." Rawls classifies this as **decision under uncertainty**, not *risk*. Under radical uncertainty, Maximin is a recognized rational strategy.

  #### Break B: The Stakes (Reversibility)
  *   **The Analogy:** If you pick a losing lottery ticket, you lose money. You can buy another ticket tomorrow.
  *   **The Reality:** If you pick a losing social position, you lose basic liberties, self-respect, or the means of subsistence. You cannot "exit" society.
  *   **Does it matter?** **Yes.** Rawls argues Maximin is rational when the downside is **unacceptable**. If the "average utility" society allows for slavery or starvation to boost the average, the "losing ticket" isn't just a smaller paycheck; it is a life not worth living. Risk aversion is not cowardice when the risk is catastrophic and irreversible.

  #### Break C: The Fixed Pot (Production vs. Distribution)
  *   **The Analogy:** The lottery implies a fixed jackpot that is merely sliced up.
  *   **The Reality:** As you suspected, the rules of society determine the size of the pot.
  *   **Does it matter?** **Yes, but less than A and B.** Your friend assumes Average Utility creates more wealth. Rawls argues that strict equality kills incentives, but unchecked inequality destabilizes society. The Difference Principle isn't just about slicing; it's about setting incentives so that the *worst-off* get the largest slice possible *given* that incentives are needed to grow the pot.

  #### Break D: The Nature of the "Person"
  *   **The Analogy:** You are choosing which *existing* person to be.
  *   **The Reality:** You are choosing the *rules* that define what a person is.
  *   **Does it matter?** **Incidental.** This is more metaphysical. While important for Rawls' Kantianism, it doesn't directly refute the econ calculation as effectively as Breaks A and B.

  ### 3. Addressing Your Specific Suspicions

  You hit on the two weakest points of the Econ Guy's argument.

  **Suspicion 1: Is the Veil just ignorance of your ticket number?**
  **Verdict: No.** The Veil is much thicker. It hides your *conception of the good*, your psychological propensities (are you a gambler?), and your generation.
  **Why it matters:** If you don't know your psychology, you can't know if you are "risk-averse" or "risk-seeking." Your friend assumes the parties behind the veil are risk-averse calculators. Rawls argues the parties are mutually disinterested representatives who care about **Primary Goods** (rights, liberties, opportunities, income). Because they don't know if they value risk, they must secure the baseline conditions for *any* life plan. You can't pursue a risky life plan if you are a slave.

  **Suspicion 2: Does "probability of being a person" make sense?**
  **Verdict: No.** This is the Harsanyi-Rawls hinge. Harsanyi says, "Treat it as if you have a 1/N chance of being anyone." Rawls says, "That is metaphysical nonsense."
  **Why it matters:** If you accept Harsanyi's probability, **your friend wins.** Average Utility is the mathematical result. If you accept Rawls' uncertainty (no probabilities), **Rawls wins.** Maximin is the rational result. The fight isn't about math; it's about whether the Original Position allows for probabilistic calculation. Rawls says the structure of the OP *forbids* it to ensure the outcome is fair, not gambling-based.

  **Suspicion 3: Fixed Pot vs. Produced Wealth.**
  **Verdict: The Econ Guy assumes a fixed pot.**
  **Why it matters:** The Difference Principle allows inequality *if* it improves the absolute position of the worst-off. (e.g., Doctors get paid more so there are more doctors, which helps the poor). The Econ Guy's "Average Utility" could theoretically justify sacrificing the basic rights of a minority if it makes the majority slightly happier. Rawls argues this undermines the *stability* of the society. If the poor know the system is rigged to sacrifice them for the "greater good," they will not cooperate, and the pot shrinks.

  ### 4. A Better Analogy: The "Ship Design"

  The Lottery Analogy fails because it implies gambling. A better analogy that captures Rawls' intent is **Designing a Ship you must sail on for life.**

  *   **The Setup:** You are an architect designing a vessel. Once launched, you will be placed on this ship for the rest of your life.
  *   **The Veil:** You do not know where on the ship you will be stationed (Captain's quarters or the coal hold).
  *   **The Choice:** Do you design the ship to have the most luxurious average cabin (Average Utility), even if the coal hold is flooded and toxic? Or do you ensure the coal hold is safe, dry, and habitable, even if it means the Captain's quarters are slightly smaller (Difference Principle)?
  *   **Why it works:**
      1.  **Irreversibility:** You can't jump ship. If the hold is toxic, you die.
      2.  **Structural:** You are designing the *rules* of the ship, not drawing a ticket.
      3.  **Rationality:** It is not "cowardly" to ensure the hold is habitable. It is a prerequisite for the ship to function at all. If the people in the hold revolt or die, the ship sinks.

  **Does this save the Difference Principle?**
  Yes, it justifies it better. It shifts the focus from "maximizing welfare" to "securing the conditions of cooperation." Under the Ship Analogy, Average Utility is irrational because a flooded hold sinks the ship (social instability). Maximin is rational because it ensures the vessel remains seaworthy for everyone.

  ### 5. Who Came Out Ahead?

  **Technically:** Your friend is right about **standard decision theory**. If you treat the Veil as a standard gamble with equal probabilities, Maximin is irrational. Harsanyi won the Nobel Prize for formalizing this.

  **Philosophically:** Rawls is right about **the setup**. The Original Position is not meant to be a standard gamble. It is a *moral* device designed to filter out bias. By forbidding probabilistic calculations (Break A) and emphasizing the catastrophic nature of losing basic liberties (Break B), Rawls constructs a scenario where Maximin is the only rational choice *within that specific framework*.

  **The Verdict:**
  Your friend's conclusion ("Difference Principle is irrational") **does not survive** once the breaks are on the table.
  *   If you accept the Lottery Analogy, you get Average Utility (but you've ignored the stakes and the nature of social cooperation).
  *   If you accept the Ship/Constitutional Analogy, you get the Difference Principle (because you prioritize the viability of the system over the average luxury).

  Rawls' point is that justice isn't about gambling for the best life; it's about agreeing to terms of cooperation that no one could reasonably reject. The "Econ Guy" is treating justice as a bet; Rawls treats it as a contract. In a contract where you can't walk away, protecting the minimum is not cowardice; it's prudence.

  **Tell your group:** The Econ Guy is playing Poker; Rawls is writing the Constitution. You don't use Poker strategy to write a Constitution.
