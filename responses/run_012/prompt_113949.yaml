      *(Self-Correction on the "Same Actors" point)*: In the film, the actors also play different races/genders. This complicates the "soul" idea. Does the soul change gender? Yes. Does consciousness? In Vedanta, consciousness has no gender. So the casting actually supports Vedanta better than the birthmark does. I should mention this nuance.

      *(Refining the Ethics)*: If I am you, why do I need to be responsible for the future? Because the future is also now. But the film treats time linearly. This is a major friction point.

