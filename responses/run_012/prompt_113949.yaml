      *   **The Casting Device:** Analyze the "same actors" trope.
          *   *Pro-Schrödinger:* One "substance" (the actor) underlies all forms.
          *   *Anti-Schrödinger:* The characters don't know they are the same. In Schrödinger's view, the realization is the point. In the film, the connection is often unconscious or spiritual, not ontological identity.
