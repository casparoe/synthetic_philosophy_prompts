  (1) **Nadia: Mostly Right.** In reconciliation, preemptive vulnerability is often a prerequisite for safety, not just a result of it; waiting for proof prevents the proof from emerging.

  (2) **Rob: Mostly Mistaken.** Sustained authentic warmth is psychologically difficult to maintain without underlying cognitive alignment; micro-expressions and timing inevitably betray private verdicts.

  (3) **Nadia: Right.** Emotional leakage is real; pretending hope exists while expecting failure creates instability that inevitably undermines the goal over years.

  (4) **Rob: Partially Right.** Belief shouldn't be purely instrumental, but his lottery analogy fails because belief here causally influences the outcome, unlike a lottery draw.

  (5) **Nadia: Right.** When a choice is forced and momentous, refusing to choose is itself a choice with evidential consequences that favor the pessimistic outcome.

  (6) **Rob: Mostly Mistaken.** Treating pessimism as the "honest default" ignores that resignation also manufactures evidence by ensuring the failure it predicts.

  **What They Are Missing**
  Nadia ignores the risk of pathological hope; if the brother is dangerous or manipulative, her approach enables further abuse rather than reconciliation. Rob ignores that social evidence is dynamic; he treats the brother's response as independent data rather than a reaction to Dave's attitude.

  **Verdict**
  Nadia is closer to right. Rob treats evidence as static, like weather, but relationships are co-constructed. In interpersonal dynamics, expectations are causal forces. Withholding belief isn't neutral; it actively prevents the positive outcome. Nadia correctly identifies that in this specific domain, pragmatic justification bleeds into epistemic justification because the belief helps create the truth it claims to track. Rob's epistemic hygiene is admirable but misapplied to a context where objectivity guarantees failure. The "James-and-Clifford" frame usually favors Clifford on facts, but Nadia wins here because the "fact" of the brother's return is not independent of Dave's stance. Rob demands evidence that cannot exist without the belief he forbids.
