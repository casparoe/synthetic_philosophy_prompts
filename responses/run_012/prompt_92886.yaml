prompt: |-
  I've got a three-year postdoc and I get to pick the project, so I'm trying to decide how much of it to spend on underdetermination of theory by evidence. I dont want to write the hundredth paper on whether Duhemian holism sinks realism — that feels settled in the boring sense that everyone already knows everyone's move. What I'm actually drawn to: the local cases where two rival theories fit all the current data yet disagree about what the world is made of, and the further thought that maybe underdetermination isn't a relation between theory and evidence at all but between a theory and the questions we're willing to ask of it. Which open questions in this vicinity matter most now, and in what order would you work them if you were me? I care about the reasoning more than the list: which questions are upstream of which, which are tractable for one person with a taste for formal argument rather than history-of-science case studies, which look important but wouldn't change much downstream if they got answered, and what would move something up or down the ranking. And tell me which question I'm not seeing.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Request:**
      *   **User Profile:** 3-year postdoc in philosophy of science (likely). Has autonomy over project selection. Prefers formal argument over historical case studies. Wants to avoid "settled/boring" debates (e.g., standard Duhem-Quine vs. Realism).
      *   **Core Interest:** Underdetermination of Theory by Evidence (UTE). Specifically:
          *   Local cases (rival theories, same data, different ontology).
          *   Reconceptualizing UTE: Not just Theory vs. Evidence, but Theory vs. *Questions* we ask.
      *   **Goal:** A prioritized research agenda (order of operations).
      *   **Constraints/Criteria:**
          *   Focus on reasoning/structure (upstream/downstream dependencies).
          *   Tractability for a single formal-minded researcher.
          *   Impact assessment (which answers actually move the needle?).
          *   Identify blind spots ("which question I'm not seeing").

  2.  **Deconstruct the Core Idea (Theory vs. Questions):**
      *   Standard UTE: $T_1$ and $T_2$ entail $E$. $E$ is all we have. Choose?
      *   User's Twist: UTE is relative to a set of questions $Q$. $T_1$ answers $Q_1$, $T_2$ answers $Q_2$. If $Q_1 \neq Q_2$, is it really underdetermination, or just incommensurability/pragmatic divergence?
      *   This shifts the focus from *evidence* to *explanatory goals* or *inferential roles*. This aligns well with formal approaches (erotetic logic, Bayesian pragmatics, structural realism).

  3.  **Brainstorming Open Questions in this Vicinity:**
      *   *Definitional:* What counts as a "rival"? (Empirical equivalence vs. ontological divergence).
      *   *The "Questions" Angle:* How do we formalize "questions"? (Erotetic logic, partition of logical space).
      *   *Decision Theory:* How do we choose between $T_1$ and $T_2$ if evidence doesn't decide? (Epistemic utility, cognitive values).
      *   *Structure:* Is the underdetermination stable over time or transient? (Transient vs. Permanent).
      *   *Ontology:* What does "what the world is made of" mean formally? (Structuralism, Ramsey sentences).
      *   *Blind Spot:* The role of *methodology* or *instrumentation* in shaping the questions. Or the social/communal aspect of question-selection.

  4.  **Filtering & Prioritizing (The "Reasoning" Requirement):**
      *   *Constraint:* Formal argument > History. This rules out deep dives into specific historical controversies (e.g., Newton vs. Cartesian vortices) unless used as abstract examples.
      *   *Constraint:* Tractability. Needs to be doable in 3 years.
      *   *Upstream/Downstream:*
          *   Upstream: Defining the terms (What is a question? What is a rival?).
          *   Midstream: The relationship between questions and evidence.
          *   Downstream: Implications for realism/antirealism.
      *   *Impact:* If I solve the definition of "question," does it dissolve the problem? Or does it make it sharper?

  5.  **Developing the Research Agenda (Drafting the Order):**

      *   *Phase 1: Formalizing the "Question" (Upstream).* You can't argue about Theory vs. Questions without a formal model of Questions. Erotetic logic or Bayesian partitioning.
      *   *Phase 2: Defining "Rivalry" relative to Questions.* When are two theories rivals? Only if they answer the *same* question differently? If they answer different questions, is it UTE or just different projects?
      *   *Phase 3: The Dynamics of Question-Selection.* Who picks the questions? Why? This touches on the "blind spot."
      *   *Phase 4: Implications for Realism.* (Downstream). If UTE is question-relative, does realism survive?

  6.  **Refining the "Blind Spot":**
      *   The user focuses on Theory vs. Questions. But *Questions* don't appear out of nowhere. They are constrained by *feasibility* and *instrumentation*.
      *   *Blind Spot:* The underdetermination of *questions* by *interests/capacities*. Or, the "Model-Data Gap." The data doesn't speak to the theory directly; it speaks to a model. Maybe the UTE is actually underdetermination of *models* by *data*, and *theories* by *models*.
      *   *Better Blind Spot:* **The Normative Status of Question-Selection.** If UTE is relative to questions, what justifies the questions? If that's arbitrary, UTE is trivial. If it's constrained, by what? (This is the "Meta-Underdetermination").

  7.  **Drafting the Response (incorporating the "Reasoning" focus):**
      *   *Tone:* Professional, peer-to-peer, rigorous.
      *   *Structure:*
          1.  Validation of the intuition (Theory vs. Questions is a strong move).
          2.  The Upstream Foundation (Formalizing Questions).
          3.  The Midstream Mechanism (Rivalry & Equivalence).
          4.  The Downstream Payoff (Realism & Ontology).
          5.  The Blind Spot (Meta-Underdetermination/Question-Selection).
          6.  Tractability Check.

  8.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is "Erotetic Logic" too niche?
      *   *Fix:* Suggest Bayesian partitioning as an alternative formalism. It's more common in formal epistemology.
      *   *Critique:* Is this too abstract?
      *   *Fix:* Emphasize "Local UTE" (e.g., QM interpretations, Cosmology) as the testing ground, even if not doing history.
      *   *Critique:* User wants to know what moves the ranking.
      *   *Fix:* Explicitly state conditions that would reprioritize (e.g., if formalizing questions fails, pivot to pragmatics).

  9.  **Final Polish:** Ensure the distinction between "settled/boring" and "fertile" is clear. Emphasize that the "Theory vs. Questions" shift transforms UTE from an epistemic problem to a pragmatic/structural one. (This aligns with van Fraassen but pushes it further).

      *(Self-Correction on the Blind Spot)*: I initially thought about instrumentation. But for a formalist, the better blind spot is **The Stability of the Question Set**. If the questions change, the UTE dissolves. So the real problem is: *What stabilizes the question set?* This is the "Meta-Underdetermination."

  10. **Final Review against constraints:**
      *   3-year timeline? Yes, phased.
      *   Formal argument? Yes, emphasized logic/probability.
      *   Upstream/Downstream? Yes, structured that way.
      *   Blind spot identified? Yes.

      *(Final thought)*: Make sure to mention *Structural Realism* as a potential downstream beneficiary or casualty.

      *Let's write it.*
answer: |-
  This is a sharp intuition. Shifting the locus of underdetermination from **Theory–Evidence** to **Theory–Question** moves you out of the exhausted Duhem-Quine realism/antirealism trench warfare and into the terrain of *erotetic epistemology* and *scientific pragmatics*. It treats underdetermination not as a failure of evidence to compel belief, but as a mismatch between the granularity of the theory and the resolution of the inquiry.

  Since you prefer formal argument to case history, your leverage points are logic, probability, and structural modeling. Here is how I would order a three-year agenda, prioritized by upstream dependency and tractability for a single formalist.

  ### Phase 1: The Upstream Foundation (Year 1)
  **Project:** *Formalizing the "Question" and the "Answer Space"*

  You cannot argue that underdetermination is relative to questions until you have a formal account of what a scientific question *is* and how theories *answer* them.

  *   **The Core Problem:** In standard UTE, $T_1$ and $T_2$ are empirically equivalent ($E \vdash T_1 \leftrightarrow T_2$). In your framework, you need to show that $T_1$ and $T_2$ partition the logical space differently relative to a query set $Q$.
  *   **The Formal Tool:** Use **Bayesian Partitioning** or **Erotetic Logic**.
      *   Model a "question" $Q$ as a partition of the possibility space.
      *   Model a "theory" $T$ as a subset of that space (or a probability distribution over it).
      *   Define "answering" as reducing the entropy of the partition.
  *   **Why Upstream?** If you skip this, your claim that "UTE is about questions" is just a metaphor. You need to demonstrate that two theories can be equivalent relative to partition $Q_1$ (empirical data) but distinct relative to partition $Q_2$ (ontological structure).
  *   **Tractability:** High. This is pure formal epistemology. You don't need historical data; you need consistency proofs and existence theorems (e.g., "For any $T_1, T_2$ that are empirically equivalent, there exists a $Q$ such that they are not $Q$-equivalent").
  *   **Decision Point:** If you cannot formalize "ontological questions" without collapsing them into "empirical questions," the project stalls. If you succeed, you unlock Phase 2.

  ### Phase 2: The Midstream Mechanism (Year 2)
  **Project:** *Rivalry and the Stability of Question-Sets*

  Once you have formalized questions, you must define when two theories are genuine *rivals* versus merely *different projects*.

  *   **The Core Problem:** If $T_1$ answers $Q_1$ and $T_2$ answers $Q_2$, are they underdetermined rivals, or just talking past each other? Standard UTE assumes they are rivals because they predict the same $E$. Your view implies they are rivals only if we *care* about the difference between $Q_1$ and $Q_2$.
  *   **The Question:** What stabilizes the question set $Q$? Why is $Q_{ontology}$ a legitimate scientific question rather than a metaphysical idle wheel?
  *   **The Formal Argument:** You need a metric of **Explanatory Utility**.
      *   Assign a cost/value to asking specific questions.
      *   Show that underdetermination persists only when the cost of distinguishing $Q_1$ from $Q_2$ exceeds the evidential budget, *not* when the distinction is meaningless.
      *   This moves UTE from an epistemic limitation to a resource-allocation problem.
  *   **Why Midstream?** This depends on Phase 1's definition of $Q$. It determines whether your view dissolves UTE (by calling ontological questions illegitimate) or sharpens it (by showing why we persist in asking them despite evidential poverty).
  *   **Tractability:** Moderate. Requires bridging formal epistemology with norms of inquiry. You risk drifting into sociology; keep it normative (what *should* we ask) rather than descriptive (what *do* we ask).

  ### Phase 3: The Downstream Payoff (Year 3)
  **Project:** *Ontological Commitment under Question-Relative Underdetermination*

  Now you cash out the implications for realism.

  *   **The Core Problem:** If UTE is question-relative, does realism survive?
  *   **The Argument:**
      *   *Option A (Anti-Realism):* If ontological questions are not stabilized by evidence, realism about unobservables is unjustified.
      *   *Option B (Structural Realism):* If $T_1$ and $T_2$ answer empirical questions identically but ontological questions differently, perhaps we should only be realist about the structure that answers the empirical questions (the stable $Q_{empirical}$).
      *   *Option C (Pragmatic Realism):* We are realist about the entities posited by the theory that answers the *most valuable* questions, even if evidence doesn't decide.
  *   **Why Downstream?** This conclusion is useless without the machinery of Years 1 and 2. If you start here, you're just writing another "UTE and Realism" paper.
  *   **Tractability:** High, provided Years 1 and 2 hold. This is where you write the "big picture" papers.

  ---

  ### The Blind Spot: Meta-Underdetermination of Questions

  Here is the question you are not seeing, and it is the one that could sink or save the project:

  **What underdetermines the Question Set itself?**

  You propose that UTE is a relation between Theory and Questions. But in science, the set of admissible questions $Q$ is not fixed. It is selected by the community, funding bodies, instrumental capabilities, and prior theoretical commitments.

  *   **The Risk:** If the choice of $Q$ is itself underdetermined by evidence (i.e., there is no evidential reason to ask "What is the world made of?" rather than "How does the world behave?"), then you haven't solved UTE; you've just pushed it upstream. You now have **Meta-Underdetermination**: The evidence doesn't decide between $T_1$ and $T_2$, and the evidence doesn't decide between asking $Q_1$ or $Q_2$.
  *   **Why it Matters:** If you ignore this, a critic will say: "Sure, $T_1$ and $T_2$ differ on $Q_{ontology}$, but why should we care about $Q_{ontology}$?" If your answer is pragmatic ("because it's useful"), you need to formalize *usefulness* without circularity.
  *   **How to Address It:**
      *   Don't try to solve the meta-underdetermination of questions completely (that's too big).
      *   Instead, **condition your results on it**. " *Given* a stable question set $Q$, UTE behaves like X."
      *   Or, argue that certain questions are **Invariant**. (e.g., Causal questions might be invariant even if ontological ones aren't).
      *   **Ranking Impact:** If you can show that some questions are *evidentially compelled* (you literally cannot do the science without asking them), your project gains massive weight. If all questions are pragmatic choices, your project becomes a branch of decision theory.

  ### Summary of Priorities & Triggers

  1.  **Start with Phase 1 (Formalizing Questions).**
      *   *Reason:* It is the prerequisite for everything else. It is the most tractable for a formalist.
      *   *Kill Switch:* If you find that "ontological questions" cannot be formally distinguished from "empirical questions" without begging the question, pivot. Abandon the "Theory vs. Question" frame and move to "Model vs. Data" (the semantic view of theories).

  2.  **Move to Phase 2 (Stability of Q) only if Phase 1 yields a robust distinction.**
      *   *Reason:* This is where the philosophical heavy lifting happens.
      *   *Trigger to Skip:* If the literature on "scientific values" (Kuhn, Longino) already covers this sufficiently for your purposes, summarize it and move to Phase 3.

  3.  **End with Phase 3 (Realism Implications).**
      *   *Reason:* This is the payoff.
      *   *Trigger to Elevate:* If you find that your formalism naturally supports Structural Realism (Year 2), make that the centerpiece of the postdoc. It's a hotter topic than general UTE.

  **Final Advice:**
  The "Theory vs. Question" move is essentially a revival of **van Fraassen's constructive empiricism**, but updated with modern formal tools. To avoid writing the "hundredth paper," you must ensure your formalism does more than just restate van Fraassen.

  The differentiator is **Local UTE**. Don't talk about theories in general. Apply your formalism to a specific, live local underdetermination case (e.g., Bohmian Mechanics vs. Standard QM, or Dark Matter vs. MOND). You don't need to do history; you need to use the *current* formal structure of those theories as your input data. This grounds your formal argument and proves it isn't just a logical game.

  **Order of Operations:**
  1.  Formalize $Q$ (Erotetic/Bayesian).
  2.  Apply to one live local case (e.g., QM interpretations).
  3.  Derive the Meta-Underdetermination constraint (The Blind Spot).
  4.  Publish the Realism implications.

  This keeps you formal, avoids the "settled" debates, and addresses the actual practice of science without requiring archival work.
