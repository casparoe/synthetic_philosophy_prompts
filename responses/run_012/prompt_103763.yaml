answer: |-
  **Project Title:** Contrast Classes and Counterfactuals: A Meta-Analysis of the Great Divergence Debate

  **Statement of the Problem and Research Question**
  The "Great Divergence"—the question of why sustained industrial growth emerged in nineteenth-century England rather than in the economically sophisticated regions of China—remains one of the most contentious topics in global economic history. Scholarship is currently polarized between cultural-institutional explanations, which emphasize property rights and political fragmentation, and material-geographic explanations, which emphasize resource endowments and global conjunctures. Despite decades of research, no consensus has emerged.

  This project proceeds from the hypothesis that this stalemate is not merely empirical but logical. Specifically, the standard question "Why England and not China?" conceals at least three distinct inquiries, defined by their "contrast class." First, why England specifically rather than China specifically (nation-vs.-nation)? Second, why Western Europe rather than East Asia (region-vs.-region)? Third, why the globally leading region rather than any other (leader-vs.-rest)? I argue that proponents of cultural explanations tend to tacitly assume the first contrast class, while materialists often assume the third. Consequently, scholars are not answering the same question, rendering their disagreements largely talk-past-each-other.

  Furthermore, I propose a secondary distinction regarding the modal status of the alternative. Some contrast classes posit alternatives that were historically available (e.g., could the Yangzi Delta have industrialized given the resources of 1750?), while others posit only logical possibilities (e.g., could China have industrialized if it had England's coal?). If a contrast class relies on a counterfactual that was not historically available, the resulting explanation may be vacuous.

  Therefore, my research question is precise and determinate: *To what extent does the ambiguity of the contrast class and the historical availability of alternatives account for the theoretical fragmentation in Great Divergence scholarship?* This question is answerable through conceptual analysis of existing literature, independent of new economic data.

  **Review of Existing Approaches**
  Current literature treats the "Why England and not China?" formulation as univocal. Institutionalists argue that specific English legal structures permitted growth, implying that without those structures, growth was impossible. Materialists argue that global resource flows determined the outcome, implying that internal structures were secondary. Because the field does not distinguish whether the explanation is intended to account for national specificity, regional disparity, or global leadership, arguments are evaluated against the wrong criteria. For example, a factor sufficient to explain why Europe led Asia (regional geology) may be insufficient to explain why England led France (national policy). Existing answers leave the core problem open because they attempt to solve a composite question with single-variable solutions. By failing to isolate the contrast class, the field cannot determine whether a given cause is necessary, sufficient, or merely incidental.

  **Methodology and Work Plan**
  As a high school student, I lack access to archival economic data or the technical training for econometric modeling. My methodology is therefore philosophical and historiographical. I will treat the secondary literature as a dataset, coding arguments based on their implicit contrast classes and their assumptions about historical possibility. I will work from my school library and digital academic repositories.

  *Weeks 1–2: Taxonomy of Arguments.* I will read major survey texts and representative articles from both the cultural-institutional and material-geographic camps. I will not focus on the economic data they present, but on the structure of their claims. I will create a database categorizing each argument by its implied contrast class (Nation, Region, or Leader) and its modal claim (Necessary, Sufficient, or Contributing).

  *Weeks 3–4: Analyzing the Contrast Class Shift.* I will analyze cases where scholars appear to disagree. I will test my hypothesis by showing that apparent contradictions dissolve when the arguments are assigned to different contrast classes. For instance, I will examine whether institutional arguments cluster around the Nation contrast class while geographic arguments cluster around the Leader contrast class.

  *Weeks 5–6: Analyzing Historical Availability.* I will focus on the counterfactuals. I will distinguish between arguments that claim the alternative was possible but unrealized, versus those that imply the alternative was impossible given global constraints. I will assess whether specific explanations collapse when the "availability" condition is enforced.

  *Weeks 7–8: Synthesis and Drafting.* I will synthesize these findings into a final paper. I will construct a typology of Great Divergence questions, demonstrating which explanations are valid for which contrast classes. I will conclude by outlining which versions of the Great Divergence question are empirically tractable and which are logically malformed.

  **Expected Results and Criteria for Failure**
  A successful project will produce a paper that offers a clear typology of the debate. The result will look like a conceptual map: "If you ask Question A (Nation), Explanation X is relevant; if you ask Question B (Leader), Explanation Y is relevant." Success is defined by the ability to resolve at least three specific scholarly disputes by showing they arise from category errors.

  The project would fail if I find that the contrast class distinction makes no difference to the explanatory power of the arguments. If cultural and material explanations remain in direct conflict even when the contrast class is held constant, my hypothesis is incorrect. Additionally, the project would fail if I am unable to distinguish between "logical possibility" and "historical availability" without making unsupported historical claims myself.

  **Scope and Limitations**
  It is crucial to be candid about what this project cannot achieve. I am not attempting to solve the Great Divergence. I am not determining whether coal or institutions were the true cause of industrialization. That task requires advanced economic modeling and archival access beyond my reach. Nor can I definitively prove what was "historically available" to eighteenth-century China; I can only analyze how scholars *use* those claims.

  This project is limited to a meta-analysis of the debate's logic. I can settle whether the debate is structured coherently, but I cannot settle the historical facts themselves. I leave the empirical verification of these typologies to professional historians. My contribution is to clarify the questions so that future empirical work does not proceed at cross-purposes. An eight-week fellowship is sufficient to map the logic of the literature, but insufficient to rewrite the history. By narrowing my scope to the structure of the argumentation rather than the content of the history, I aim to provide a rigorous, feasible contribution that respects the limits of my position as a student researcher while engaging with a graduate-level theoretical problem.
