answer: |-
  This is the crux of McTaggart's argument, and it is notoriously difficult because it clashes with how we intuitively (and how modern physicists) think about time. Your confusion is well-founded: most contemporary philosophers of time (B-Theorists) argue exactly what you are suggesting—that variation across B-series positions *is* sufficient for change.

  However, to understand McTaggart, you have to step out of the modern B-Theory mindset and adopt his specific definition of what "change" must be to constitute *time* rather than just *logic*.

  Here is a walkthrough of why he thinks the B-series fails, what he means by change, and how this leads to the unreality of time.

  ### 1. What does McTaggart mean by "Change"?

  Your intuition is: *If an object has property P at time $t_1$ and property not-P at time $t_2$, that is change.*

  McTaggart's response is: *No, that is just variation.*

  For McTaggart, genuine change requires that **the same fact** alters its status. In the B-series, all facts are eternal.
  *   Fact 1: "Event $E$ is at position $t_1$." (This is eternally true).
  *   Fact 2: "Event $E$ is at position $t_2$." (This is eternally true).

  If the B-series is all that exists, the statement "The poker is hot at $t_1$" is true forever. It was true before the universe began, and it will be true after the universe ends. It is a timeless truth, like "2 + 2 = 4". Similarly, "The poker is cold at $t_2$" is also a timeless truth.

  McTaggart argues that if all the facts about the poker are timeless truths, **nothing has happened.** The poker hasn't *become* cold; it simply possesses the eternal property of *coldness-at-$t_2$*.

  For McTaggart, real change requires **temporal passage**. It requires that a proposition changes from being false to being true, or from being future to being present to being past.
  *   **B-Theory Change:** "The poker is hot" is true relative to $t_1$; "The poker is cold" is true relative to $t_2$. (Both are eternally the case).
  *   **McTaggart's Change:** "The poker is hot" is true *now*, but later "The poker is hot" will be false (and "The poker is cold" will be true).

  Without the A-series (Past/Present/Future), there is no "now" that moves. There is no moment where the hotness *ceases* and the coldness *begins*. There is just a static landscape where hotness is at coordinate 1 and coldness is at coordinate 2.

  ### 2. Why the B-Series alone is just a logical ordering

  McTaggart argues that if you strip away the A-series, the B-series loses its specifically *temporal* character and becomes indistinguishable from a purely logical or spatial ordering.

  Consider the number line:
  *   1 is earlier than 2.
  *   2 is earlier than 3.
  *   This relation never changes. 1 never stops being earlier than 2.

  Now consider a B-series timeline:
  *   1900 is earlier than 2000.
  *   2000 is earlier than 2100.
  *   This relation never changes. 1900 never stops being earlier than 2000.

  McTaggart asks: What is the difference between the number line and the timeline if nothing ever *becomes* present? If 1900 is never "now," and 2000 is never "now," they are just coordinates. A universe consisting only of B-relations is a "block universe" where everything just *is*.

  He writes: *"An event can never cease to be an event. It can never get out of any time series in which it once is."*

  He means that in the B-series, the death of Queen Anne is eternally "an event at 1714." It doesn't slide from the future into the past. It just sits at 1714. If nothing slides, nothing changes. If nothing changes, there is no time.

  ### 3. Why the A-Series is "More Fundamental"

  This is the second part of your question. McTaggart claims the B-series depends on the A-series, not the other way around.

  His reasoning is that the terms "Earlier" and "Later" are meaningless without reference to a "Present."
  *   Why is 1900 earlier than 2000?
  *   McTaggart says: Because 1900 is further in the **past** than 2000 is.
  *   Why is 2100 later than 2000?
  *   Because 2100 is further in the **future** than 2000 is.

  The concepts of Past and Future (A-determinations) define the direction and nature of the Earlier/Later relations. If you remove the distinction between Past, Present, and Future, "Earlier" just means "to the left of" on a diagram. It loses its temporal force.

  Therefore, the A-series is fundamental because it provides the *temporal* quality to the relations. The B-series is just the skeleton; the A-series is the flesh that makes it time.

  ### 4. How this connects to "Time is Unreal"

  This specific argument (that B-series needs A-series for change) is only **Step 1** of McTaggart's overall proof. It sets the trap.

  Here is the structure of the full argument, showing where your excerpt fits in:

  1.  **Time requires Change.** (Premise).
  2.  **Change requires the A-Series.** (This is the argument you are reading now. The B-series is static, so it can't support change).
  3.  **Therefore, Time requires the A-Series.** (Conclusion from 1 & 2).
  4.  **But the A-Series is Contradictory.** (McTaggart's next argument: Every event must be Past, Present, and Future. But nothing can be all three at once. Therefore, the A-series is impossible).
  5.  **Therefore, Time is Unreal.** (Since Time requires A, and A is impossible, Time is impossible).

  If you could prove that the B-series *could* account for change (as you suggested with the red/blue example), McTaggart's argument would collapse at Step 2. If the B-series allows for change, then Time does *not* require the A-series. If Time doesn't require the A-series, then the contradiction in the A-series (Step 4) doesn't matter, and Time can exist as a pure B-series.

  McTaggart anticipates your objection. He knows people will say, "But things *do* have different properties at different B-positions!" His counter is that those are just eternal facts. For time to be real, reality itself must change, not just vary across coordinates. And reality can only change if events change their A-properties (from future to present to past).

  ### Summary for your reading
  When McTaggart says the B-series can't accommodate change, he means:
  1.  **B-relations are permanent:** $X$ is always earlier than $Y$. Permanent relations cannot constitute change.
  2.  **B-facts are eternal:** "X is at $t_1$" is always true. If facts never come into or go out of existence, nothing happens.
  3.  **Real Change requires passage:** Something must *become* present and then *cease* to be present. Only the A-series tracks this "becoming."

  He is forcing you to choose: Either you accept that time requires a moving "Now" (A-series), or you must admit that what we call "time" is actually just a static, timeless ordering of events (which he argues isn't time at all). He later argues that the "moving Now" is contradictory, leaving us with no time.
