answer: |-
  **Project Title:** Competence Without Comprehension: A Taxonomy of Explanatory Inversions

  **Departmental Workshop Series Proposal**

  **1. The Research Question**

  Modern cognitive and biological sciences frequently rely on a powerful explanatory schema: the "strange inversion." This pattern, famously associated with Darwin and Turing, posits that high-level competence (design, intelligence, calculation) can exist prior to and independent of high-level comprehension (a designer, a mind, a understander). In the standard narrative, these two historical moves are treated as instances of a single logical pattern. Darwin showed that design needs no designer; Turing showed that computation needs no comprehender. In both cases, competence comes first, and comprehension, if it appears at all, is a late and optional by-product.

  This workshop series proceeds from the hypothesis that this unity is an assumption rather than a demonstrated fact. It is possible that the Darwinian and Turingian inversions are fundamentally different kinds of explanation. In the Darwinian case, the competence is arguably owned by the system: the organism is genuinely good at surviving, and this goodness is a physical fact independent of observation. In the Turingian case, it is far less clear that the competence is owned by the machine. A computer's proficiency at chess or translation may be a fact about the interpretations we impose on its physical states rather than a fact about the states themselves. If this distinction holds, the Turingian inversion does not merely relocate comprehension to a lower level; it dissolves the question of where comprehension lives.

  The central research question for this workshop is therefore: **Do the Darwinian and Turingian inversions belong to a single explanatory kind, or do they differ in whether the competence they explain is a property of the system or an artifact of the description under which we view it?** Furthermore, can we derive a criterion that tells us which kind of inversion we are confronting in a new case, without resorting to intuition or stipulation?

  **2. The Gap in Existing Positions**

  Current defenses of the "competence without comprehension" schema treat the Darwinian and Turingian cases as mutually reinforcing. The argument relies on symmetry: if nature can produce design without a mind, surely artifacts can produce intelligence without a soul. This analogy carries rhetorical conviction, but it obscures the ontological status of the competence being explained.

  The literature oscillates between two incompatible readings of what is being inverted. In one reading, comprehension is treated as a genuinely explanatory posit—a causal mechanism that the inversion successfully eliminates or replaces with a mechanical substrate. In this view, the inversion is a reduction. In the other reading, comprehension is treated as a piece of folk psychology with no explanatory work to do, merely a label we apply to successful output. In this view, the inversion is a dissolution.

  The problem is that neither reading applies uniformly across both cases. In evolutionary biology, treating fitness as merely "in the eye of the beholder" undermines the causal power of natural selection. In computation, treating syntax as intrinsic to the physics of the machine invites category errors. By treating the two inversions as identical, current frameworks allow proponents to slide between these readings depending on which offers the easier defense in a given context. This workshop aims to arrest that slide. We must determine whether the symmetry is structural or merely rhetorical, and whether the elimination of the "comprehender" functions the same way in biology as it does in computer science.

  **3. Methodology and Case Studies**

  To answer this question, the workshop will not proceed via abstract argument alone. Instead, we will construct a taxonomy by working through a small set of paradigmatic cases chosen specifically because they pull the two candidate readings apart. We will examine four systems:

  1.  **A Simple Feedback Device (e.g., a thermostat):** This represents low-level competence. It maintains a state without representation.
  2.  **A Chess Engine:** This represents high-level syntactic competence. It plays master-level games without (presumably) understanding the concept of "checkmate."
  3.  **A Biological Mechanism (e.g., DNA polymerase proofreading):** This represents high-level biological competence. It corrects errors to ensure replication fidelity without a nervous system.
  4.  **A Distributed System (e.g., a market or bureaucracy):** This represents a hybrid case. Competence emerges from the interaction of agents who possess partial comprehension, though no single agent grasps the whole.

  The distinguishing axis for these cases will be **Observer Independence.** We will ask: Does the competence persist if the interpreting observer vanishes? For the polymerase, the answer seems to be yes; the organism dies without proofreading regardless of whether a biologist is watching. For the chess engine, the answer is debatable; the physical state transitions occur, but their status as "moves" depends on a ruleset imposed by an interpreter.

  To avoid the trap of defining comprehension in a way that makes the answer come out by stipulation (e.g., defining comprehension as "biological" to ensure Darwin wins), we will employ a **Cost of Interpretation** metric. We will analyze how much work the observer must do to map the system's physical states onto a semantic description. If the mapping is trivial and unique (as in the thermostat), the competence may be intrinsic. If the mapping is complex and underdetermined (as in the chess engine), the competence may be ascribed. If the mapping is constrained by physical survival (as in the polymerase), the competence is owned. The workshop sessions will be dedicated to applying this metric to the four cases to see if a clear boundary emerges between "owned" and "ascribed" competence.

  **4. The Serious Alternative: The Collapse View**

  We must give honest treatment to the most serious alternative hypothesis: that the distinction I propose is illusory. This is the "Collapse View," which holds that *all* competence is observer-relative. On this view, "owned-by-the-system" and "artifact-of-description" are merely intrinsic and observer-relative ways of describing the same phenomenon. Just as a chess move only exists relative to the rules of chess, biological function only exists relative to the "goal" of survival, which is itself an interpretation imposed by evolutionary theory.

  If the Collapse View is correct, the Darwinian case is no different from the Turingian one; both rely on an external framework to define what counts as success. For this collapse to be correct, it must be true that evolutionary fitness is no more mind-independent than syntactic validity.

  However, there is significant resistance to this view. Natural selection operates as a physical filter; organisms that fail to replicate cease to exist regardless of whether an observer categorizes them as "unfit." Syntax, by contrast, does not cause physical transitions in the machine; it is a layer of description *over* the physical transitions. The workshop will dedicate one session to stress-testing the Collapse View. We will ask: What would have to be true for fitness to be as observer-relative as syntax? And conversely, what physical facts resist that relativity? If we find that biological competence has causal powers that syntactic competence lacks, the distinction holds. If we find that both rely on teleological framing, the distinction collapses.

  **5. Outcomes: Success and Failure Conditions**

  It is vital to define what a successful result looks like for a workshop of this scope. Success is **not** a verdict on whether machines understand. We will not solve the hard problem of consciousness.

  **Success** is defined as the production of a usable criterion—a diagnostic tool—that allows researchers to say, for a given case, whether a competence-without-comprehension explanation has discharged the demand for understanding or merely postponed it. A successful criterion will allow a biologist to distinguish between a mechanism that is genuinely goal-directed and a mechanism that is merely described as such, without needing to settle contested questions in the philosophy of mind.

  **Failure** has two specific forms. First, the project fails if the resulting criterion classifies cases only by how we choose to describe them (e.g., "If we call it biological, it's owned; if we call it computational, it's ascribed"). This would indicate that the distinction is verbal, not structural. Second, the project fails if the criterion cannot be applied without first settling contested questions in the philosophy of mind (e.g., requiring a solution to intentionality before we can classify the system). We must name these failure conditions explicitly: if we find that observer-independence cannot be measured without a prior theory of semantics, we will conclude that the "strange inversion" is not a freestanding explanatory tool but a dependent variable of our metaphysics.

  **6. Scope and Significance**

  This proposal is scoped for a departmental workshop series, not a multi-year grant. We will not attempt a comprehensive survey of the literature on teleology or computation. Instead, we will stake out the distinction, work it through the four specified cases, and end with the criterion and its known weaknesses.

  Why is this framing worth pursuing? The familiar question—"Can machines think?"—is often a dead end because it invites a battle of intuitions about the word "think." By shifting the focus to the *structure of the explanation* rather than the *status of the agent*, we bypass the semantic stalemate. If the Darwinian and Turingian inversions are different, then importing explanatory strategies from biology into cognitive science (or vice versa) requires caution. We may be importing a category error.

  If the Turingian inversion dissolves comprehension while the Darwinian inversion merely relocates it, then treating cognitive systems as purely syntactic engines may be stripping them of the very ownership that makes their competence real. Conversely, if the Collapse View holds, we must admit that biological function is as interpretive as computer code. Either result significantly alters how we construct models in the cognitive and biological sciences. This workshop offers a structured environment to test this foundational assumption before it hardens further into dogma. By treating the unity of the pattern as an open question, we open the possibility of a more precise vocabulary for explanation itself.
