answer: |-
  The list cannot be satisfied as a coherent whole without accepting a productive contradiction, and the requirement that imperceptible structural causes must remain narratable without becoming fate does the most work to eliminate candidate theories.

  **Desiderata for a Theory of Historical Time**

  1.  **Persistence without Intent:** The theory must explain how a transhumance route survives the death of every shepherd who walked it. *Status: Non-negotiable.* If the pattern dies with the carrier, you have biography, not history; the mechanism must be embedded in landscape or habit, not memory.
  2.  **Eventual Leverage:** A single decision to cut a canal must be able to pivot the valley's trajectory without reducing the harbour's silting to mere scenery. *Status: Non-negotiable.* If structure swallows event, the novel lacks drama; if event swallows structure, it lacks depth; the event must ride the structure to change its course.
  3.  **Structural Genealogy:** The silting must be shown as the sediment of past storms and dredgings, not as an eternal law. *Status: Preference.* Hard determinism is easier to write, but false; this requirement complicates the prose but saves the truth, preventing the environment from becoming myth.
  4.  **Environmental Non-Linearity:** Climate and soil must constrain without dictating, allowing for abrupt ruptures where slow drivers break fast. *Status: Non-negotiable.* Linear determinism is fate; tipping points are tragedy; the theory must allow the sea to be calm for decades and then take a life in an hour.
  5.  **Archive Silence:** The theory must hold when the record is written by the propertied and the slow processes leave no log. *Status: Non-negotiable.* A theory relying on the paperwork of the poor is fiction twice over; it must infer the slow from the gaps in the fast.
  6.  **Polytemporal Presence:** A single harvest must simultaneously embody daily weather, decadal prices, and centennial exhaustion. *Status: Non-negotiable.* Time must not be segmented into chapters; it must layer within them, so that a price spike feels both immediate and ancient.
  7.  **Scalar Integrity:** The valley must be treatable as a unit distinct from the household or the sea, licensed by flow (grain, people) not just boundary. *Status: Preference.* Boundaries are always porous, but the book needs a frame; the theory must justify why the valley matters more than the port or the home.
  8.  **Narrative Access:** The narrator must articulate causes the characters cannot perceive without making the characters puppets. *Status: Non-negotiable.* If characters see the structure, they cease to be lived-in; if the narrator cannot show it, the theory is invisible; the voice must know more than the people without knowing everything.

  **The Incompatible Pair**
  The demand that *events must alter trajectories* and the demand that *structures must constrain outcomes* cannot be fully reconciled. If the structure explains the outcome, the event is noise; if the event decides the outcome, the structure is backdrop. You must privilege one in any given scene, accepting that a perfect equilibrium between contingency and explanation is a mathematical ideal, not a narrative reality.

  **The Primary Eliminator**
  The requirement regarding *Narrative Access* eliminates the most candidates. Sociological models fail because they are analytical rather than dramatic, offering variables where you need motives; deterministic models fail because they remove the tension of choice required for character, turning people into leaves in the wind.

  **Scoring of Existing Models**
  Braudel's layered scheme scores high on polytemporality but low on interaction; his layers often slide past one another without friction, making the event feel trapped rather than transformative. Microhistory scores high on event leverage and narrative access but low on structural persistence; the mountain disappears behind the tree, and the grain price becomes merely what the merchant said. Ecological nested-cycle models score high on environmental non-linearity and scalar integrity but low on narrative access; they explain collapse well and handle abrupt breaks beautifully, but they are mechanistic, treating human grief as mere energy dissipation.
