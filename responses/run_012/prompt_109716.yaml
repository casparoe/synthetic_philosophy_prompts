answer: |-
  Sir, you press me with great acumen, and I am pleased to find an interlocutor who looks beyond the surface of my words to the structure of the argument itself. Let us first dispose of the charge of triviality. You suggest that if an idea is by definition in a mind, then to say I cannot conceive of it without conceiving it as perceived is merely to say I cannot think without thinking. I beg leave to differ. The point is not merely about the act of thinking, but about the ontological status of the object itself. When I speak of a sensible thing—a colour, a sound, a figure—I speak of nothing but a sensation or a combination of sensations. Now, can a sensation exist without being felt? Can a sound exist without being heard? It is not a tautology about my mind to say that pain cannot exist without a feeling subject; it is a truth about the nature of pain. So it is with all sensible qualities. To say a sensible thing exists unperceived is not a trivial error of thought, but a genuine contradiction in terms, like speaking of a father who has no child. The existence of the sensible thing *consists* in its being perceived; it is not merely that we cannot know it otherwise, but that it has no being otherwise.

  Regarding your second objection, concerning notions, you have seized upon a distinction I indeed make, but you have applied it where it cannot hold. I admit that we have notions, rather than ideas, of spirits and their operations, because a spirit is an active being that cannot be represented by a passive idea. But a tree, a stone, or a garden are not active beings; they are collections of sensible ideas. You cannot have a "notion" of a tree in the same way you have a notion of a mind, because a tree is not an agent. It is an object. To claim you have a notion of an unperceived tree is to claim you have a grasp of a sensible object existing without sensibility. This is to combine incompatible things. You may frame the words "unperceived tree," but you cannot frame the meaning, for the moment you frame the tree in your understanding, you perceive it. The notion of a mind is coherent because minds are the *perceivers*; the notion of an unperceived object is incoherent because objects are the *perceived*.

  Consider now your garden at dusk. You say you imagine it with no one in it, and thus conceive it unperceived. I answer: who is it that imagines this garden? It is you. The light, the shades, the shapes of the plants—are they not ideas in your mind? You may omit the idea of a perceiver from the scene you paint in your imagination, but you cannot omit the fact that you are perceiving that scene. You conceive of trees, but you omit to conceive of yourself conceiving them; yet you still conceive them. Thus, you prove my principle, not your own. You show that you can conceive of trees without conceiving of a perceiver *alongside* them, but you cannot conceive of trees without conceiving of them, that is, without perceiving them in your mind.

  So, to answer your final question plainly: what are you doing when you take yourself to be conceiving an unperceived tree? You are framing certain ideas of sense—greenness, solidity, extension—and you are judging falsely that these ideas could subsist without a mind. You are separating the existence of the idea from its being perceived, which is to separate a thing from itself. You conceive the ideas, indeed, but you annex to them a supposed absolute existence outside any mind, which is a contradiction. You think you are conceiving of a thing existing without thought, when in truth you are only thinking of a thing while neglecting to think of the thought that sustains it.
