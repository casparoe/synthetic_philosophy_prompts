  2. Although each biased game ($q > 1/2$) has an order-independent expectation, this stability exists only because the bias geometrically suppresses the tail outcomes responsible for the conditional convergence.
  3. The limiting procedure as $q \to 1/2^+$ implicitly relies on the natural temporal ordering of tosses by maintaining the specific decay rate required for the alternating series to converge.
  4. This arbitrariness is confirmed by the parameter asymmetry, since approaching from $q < 1/2$ produces outright divergence rather than a complementary limit, proving the expectation function is discontinuous at the fair coin.
  5. Consequently, the limit $\ln(2)$ is an artifact of the regularization path rather than a discovery of value, leaving the unbiased game's expectation genuinely undefined.
