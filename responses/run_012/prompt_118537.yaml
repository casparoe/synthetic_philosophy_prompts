      *   The standard solution to POE (which neither explicitly named) involves **counterfactuals** or **ur-priors**.
      *   *The Counterfactual Move:* We ask: "What would my credence in $H$ have been *if* I had not known $D$?" If $H$ predicts $D$ and $\neg H$ does not, then in that counterfactual state, $H$ would be confirmed. We import *that* support into the current state.
      *   *The Structural Move:* $H$ isn't confirmed by $D$ directly (since $D$ is known). $H$ is confirmed because $H$ provides the *only good explanation* for why $D$ is true. The confirmation comes from the *explanatory relationship*, not the probability update on $D$.
      *   *The Likelihood Move (Refinement):* Round 4 was close. The Bayes Factor works even if $P(D)=1$, provided we are comparing $H$ to specific rivals $\neg H$. The problem only arises if we demand absolute probability increase via conditionalization on a certainty.
      *   *Missing Element:* They are arguing about *updating* (conditionalization) vs. *support* (likelihood). The Philosopher wants updating to work. The Statistician wants support to work. They are talking past each other slightly.
