      *   *What's Missing:* The counterfactual "ur-prior" strategy (what would I believe if I didn't know D?) OR the distinction between *updating* (conditionalization) and *support* (likelihood). Also, the role of *entailment discovery* (learning that H entails D is the new evidence, not D itself).

