answer: |-
  ### 1. Candidate Criteria and Tensions

  Your seven cases pull toward three competing criteria for representation. I will label them **Decoding**, **Causal Role**, and **Systematicity**.

  *   **Decoding (Informational):** A property is represented if it can be read out from the activations.
      *   *Supported by:* None of your negative verdicts. Case 2 explicitly kills this (number is decodable but not represented). Case 3 kills the requirement for *linear* decoding.
      *   *Tension:* Case 2 shows decoding is insufficient. Case 3 shows linear decoding is unnecessary.

  *   **Causal Role (Functional):** A property is represented if the internal state bearing that information is causally responsible for the behavior tracking that property.
      *   *Supported by:* Case 1 (Truth), Case 3 (Synthetic), Case 6 (Unused but wired).
      *   *Tension:* Case 4 shows that spurious causality (confounded by topic) doesn't count. Case 5 shows that causal lookup (memorization) doesn't count. This suggests Causal Role must be *specific* and *structural*, not just correlational or associative.

  *   **Systematicity (Generalization):** A property is represented if the mechanism mapping the property to the state, and the state to the behavior, generalizes across inputs and seeds.
      *   *Supported by:* Case 1 (Truth generalizes), Case 4 (Sentiment fails robustness), Case 5 (Memorization fails generalization).
      *   *Tension:* Case 6 (Unused Direction) tests the limit of this. If the mechanism is general but never activated, does it count? Your verdict is Yes. This implies Systematicity applies to the *capacity*, not the *frequency of use*. Case 7 (Uncertainty vs. Difficulty) tests the limit of Content Determination: if two properties share the exact same causal role, does the representation distinguish them?

  **The Core Friction:** The strongest tension is between **Case 5** (Memorized Lookup = No) and **Case 6** (Unused Capacity = Yes). Both involve low frequency/coverage. The distinguishing factor must be whether the *mapping function* is general (Case 6) or specific to an instance (Case 5). A second tension is **Case 7**, where the causal role is shared by two distinct properties. Your principle must decide if representation is determined by the *cause* of the state or the *effect* of the state.

  ### 2. The Principle: Systematic Causal Role Theory

  A neural network represents a property $P$ if and only if there exists a subspace of activations $S$ (the vehicle) satisfying the following four clauses:

  1.  **Causal Efficacy:** Interventions on $S$ produce changes in downstream behavior that track variations in $P$. (Motivated by **Case 2**: Decoding without causation is not representation.)
  2.  **Robust Specificity:** The causal link between $S$ and behavior persists when controlling for confounding variables (e.g., topic, frequency) and holds across independently trained seeds. (Motivated by **Case 4**: Artifacts and confounds are not representations.)
  3.  **Mechanistic Systematicity:** The mapping from input conditions to $S$, and from $S$ to output, is governed by a general rule rather than an instance-specific lookup. The mechanism must be capable of handling novel inputs that instantiate $P$, even if such inputs are rare. (Motivated by **Case 1** vs. **Case 5**: Truth is a general rule; memorized strings are instance associations.)
  4.  **Dispositional Existence:** The subspace $S$ counts as a representation even if the conditions required to activate it are never met in the actual deployment distribution, provided clauses 1–3 are satisfied counterfactually. (Motivated by **Case 6**: Unused capacities are still representations.)

  ### 3. Verdicts on New and Constructed Cases

  **New Case:** A network in which $P$ is represented only in a subspace that is causally used solely when the model is asked to do a task it was never trained on but generalizes to.
  *   **Verdict:** **YES.**
  *   **Reasoning:** This satisfies Clause 3 (Mechanistic Systematicity). The mechanism generalizes to the new task, implying the network has acquired a general capacity for $P$, not just a training-set fit. It satisfies Clause 4 (Dispositional Existence) regarding the training distribution, but becomes actualized in the test distribution.

  **Constructed Case A (The "Accidental Wire"):** We find a direction that steers behavior correctly for $P$ on the test set, but when we retrain the model with a different random seed, the direction moves to an orthogonal subspace or disappears entirely, though performance remains constant.
  *   **Verdict:** **NO.**
  *   **Reasoning:** Violates Clause 2 (Robust Specificity). If the feature is not stable across seeds, it is likely a "multi-tool" or an artifact of a specific optimization trajectory rather than a robust representational vehicle. It is encoding, not representation.

  **Constructed Case B (The "Compressed Lookup"):** A model memorizes 1,000 specific facts. We find a subspace that decodes the *index* of the fact being recalled. Intervening on the index changes which fact is recalled. However, the model cannot recall an 1,001st fact even if the format is identical.
  *   **Verdict:** **NO.**
  *   **Reasoning:** Violates Clause 3 (Mechanistic Systematicity). The mechanism is a bounded lookup table. It represents the *index*, but it does not represent the *property* governing the facts (e.g., "capital city of"). It lacks the compositional structure to apply the rule to new instances.

  ### 4. Honest Ledger: Mismatches and Sacrifices

  Your seven verdicts are remarkably consistent, but my principle forces one clarification that may feel like a sacrifice regarding **Case 7**.

  *   **Accommodated:** Cases 1, 2, 3, 4, 5, and 6 are fully accommodated. Specifically, the tension between 5 (No) and 6 (Yes) is resolved by Clause 3: Case 5 fails systematicity (instance-specific), while Case 6 passes it (general mechanism, rare trigger).
  *   **The Mismatch (Case 7):** You asked whether there is a "fact of the matter" regarding Uncertainty vs. Difficulty. My principle dictates that **there is currently no fact of the matter.**
      *   *Reason:* Clause 1 (Causal Efficacy) is satisfied by *both* properties equally. Clause 2 (Robustness) is satisfied by both. Until you can decorrelate Uncertainty and Difficulty in the input distribution or via intervention (e.g., make a hard question easy to be sure about, or an easy question hard to be unsure about), the representational content is **disjunctive**: the model represents "Difficulty-or-Uncertainty."
      *   *Sacrifice:* You must give up the hope that the current data supports a binary Yes/No on *which* property it is. The principle demands you break the correlation before assigning content. If you insist on a verdict now, you are projecting your own ontology onto the network.

  ### 5. Decision Procedure for the Researcher

  To determine if a discovered feature is a representation, execute this five-step protocol. Stop at any "No" and classify the feature as an **Encoding** or **Artifact**.

  1.  **Isolation:** Can you identify a subspace (linear or nonlinear) that correlates with property $P$?
      *   *If No:* Stop. (No evidence).
      *   *If Yes:* Proceed.
  2.  **Causal Intervention:** Does ablating or steering this subspace change the model's behavior in a way that specifically tracks $P$ (and not just general perplexity)?
      *   *If No:* Stop. (Verdict: **Passive Encoding**, like Case 2).
      *   *If Yes:* Proceed.
  3.  **Control for Confounds:** Does the effect persist when controlling for correlated properties (e.g., topic, length, frequency) and across random seeds?
      *   *If No:* Stop. (Verdict: **Artifact**, like Case 4).
      *   *If Yes:* Proceed.
  4.  **Systematicity Test:** Does the mechanism work on inputs that instantiate $P$ but differ structurally from the training set (e.g., new syntax, new domain)? Or is it limited to a fixed set of memorized instances?
      *   *If No:* Stop. (Verdict: **Memorized Association**, like Case 5).
      *   *If Yes:* Proceed.
  5.  **Content Decorrelation (Crucial for Case 7):** If $P$ is correlated with $Q$ in the data, can you construct an intervention or input where $P$ is high and $Q$ is low (or vice versa) to see which one the downstream circuit actually tracks?
      *   *If No:* Verdict: **Indeterminate Content** (The model represents $P \lor Q$).
      *   *If Yes:* Verdict: **Representation of the property that tracks with behavior.**

  **Decisive Evidence:** The only decisive evidence for representation is **successful intervention on out-of-distribution inputs**. If you can steer the feature on a novel task and the model behaves appropriately regarding $P$, you have proven the mechanism is general (Clause 3) and causal (Clause 1). If the intervention only works on training-like data, you have merely found a high-dimensional lookup key.
