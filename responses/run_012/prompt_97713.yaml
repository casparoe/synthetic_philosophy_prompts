  I'm in a seminar on the history of computing and the philosophy of mind, and I need to draft a short research proposal — about 1,500 words, one term — on von Neumann's late thinking about the brain. I want to build it around a worry I can't shake. Von Neumann held both that the brain's elementary signalling is digital (the nerve impulse is all-or-nothing) and that the brain's operative language is statistical rather than the exact logico-arithmetic language of a computer, because a system assembled from unreliable components cannot lean on precise logical operations and must instead tolerate and average out error. My worry is that statistical language is being asked to do two distinct jobs: sometimes it means the brain represents things probabilistically, as degrees of evidence or confidence, and sometimes it means only that the brain redundantly encodes information so that noise can be corrected. These look separable — a system might be highly redundant yet encode in a precise, non-probabilistic code, or represent probabilistically with little redundancy — and if they are separable, the reliability argument may support only the second reading, leaving the stronger claim about the brain's language unsupported. Turn this into a proposal: state the question so it has a determinate answer, explain why the obvious readings of von Neumann leave it open, lay out the method (I'd like to know what I could actually do in a term — including whether a small toy model contrasting a redundant logical code with a statistical one under noise would help), say what would count as a result and what would count as the project failing, and give an honest assessment of the scope. Skip citations; I'll add them myself.
