prompt: |-
  I'm in an Enlightenment course this term (mostly 18th-century French stuff, Descartes through Rousseau) and this week we're on Du Châtelet's Discourse on Happiness — she wrote it around 1746 and it only got published after she died, which the prof keeps bringing up because of the whole "she knew she was dying" angle. The translation we were assigned is pretty loose so I grabbed the French from the edition linked on the syllabus, and I can follow it sentence by sentence but I genuinely can't see how the paragraph holds together as a whole. I have to write a response paper on it by Friday, so can you walk me through it?

  Here's the chunk that's tripping me up:

  Il faut, pour être heureux, s'être défait des préjugés, être vertueux, se bien porter, avoir des goûts & des passions, être susceptible d'illusions, car nous devons la plupart de nos plaisirs à l'illusion, & malheureux est celui qui la perd. Loin donc de chercher à la faire disparaître par le flambeau de la raison, tâchons d'épaissir le vernis qu'elle met sur la plupart des objets; il leur est encore plus nécessaire que ne le sont à nos corps les soins & la parure. Il faut commencer par se bien dire à soi-même & par se bien convaincre que nous n'avons rien à faire dans ce monde qu'à nous y procurer des sensations & des sentiments agréables. Les moralistes qui disent aux hommes: réprimez vos passions, & maîtrisez vos désirs, si vous voulez être heureux, ne connoissent pas le chemin du bonheur.

  And then a bit further on she says something like: don't be fooled into thinking passions cause more misery than joy, because the miserable are visible — they need other people, they like telling their stories — while happy people just quietly get on with it; and then she adds that even if passions did make more people miserable than happy, they'd still be worth wanting, since without them you can't have great pleasures.

  My problem is these three moves don't obviously fit together. She says you have to be virtuous and free of prejudice to be happy, then two sentences later she's telling you to stop trying to see through illusions and instead make the varnish *thicker*, and then she says flat out that we have nothing to do in this world except procure ourselves agreeable sensations and feelings. Is "vertueux" doing any real work in that list, or is it just window dressing so she doesn't sound like a hedonist? And what is "illusion" even supposed to be here — she can't mean we should lie to ourselves, right, so what's the subtler thing she's after? Also I can't tell if the bit about the happy being invisible is an actual argument or just a clever observation, and whether the "even if they make more people miserable" line rescues it or quietly gives up on arguing.

  So: translate the passage for me, then explain how the pieces hang together (or honestly, if they don't), and tell me what the most defensible reading is of illusion and of virtue's role in her picture. Please don't send me off to secondary literature, I'll track that down myself — I just want to actually understand what she's saying and be able to defend a reading of it.
