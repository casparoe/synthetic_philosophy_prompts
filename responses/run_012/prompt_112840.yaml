answer: |-
  Here is the spec sheet you asked for. I have stripped out the history and the rhetoric to focus on the structural requirements any viable theory must satisfy.

  ### I. The Spec Sheet (Desiderata)

  **1. Phenomenological Coverage (The Cases)**
  A theory must account for the following asymmetries without treating them as unrelated coincidences:
  *   **Thermodynamic:** Irreversible processes (diffusion, heat flow, chemical equilibration).
  *   **Radiative:** Retarded waves (source to future) vs. advanced waves (future to source).
  *   **Quantum Measurement:** Wavefunction collapse or decoherence (pure state to mixed state).
  *   **Epistemic:** The existence of records/traces of the past, but not the future.
  *   **Psychological:** Memory (access to past) vs. Anticipation (prediction of future).
  *   **Causal/Intervention:** The ability to manipulate future outcomes vs. the fixedness of past outcomes.
  *   **Cosmological:** The expansion of the universe (and the associated density/temperature gradient).

  **2. Conceptual Distinctions (The Boundaries)**
  A theory must explicitly state whether it is:
  *   **Reducing:** Deriving one arrow from another (e.g., reducing the psychological arrow to the thermodynamic).
  *   **Pluralist:** Accepting multiple independent arrows that happen to align.
  *   **Ontological:** Claiming the direction is a feature of the world itself.
  *   **Epistemic:** Claiming the direction is a feature of our description or knowledge of the world.
  *   **Local vs. Global:** Does the arrow hold in a closed box on Earth, or does it require the state of the whole universe?

  **3. Physical Constraints (The Hard Limits)**
  A theory cannot contradict established physics:
  *   **Micro-T-Symmetry:** It must accommodate the fact that fundamental dynamical laws (Newtonian, Hamiltonian, Schrödinger, Dirac) are time-reversal invariant (ignoring the minor CP-violation in weak interactions, which is insufficient to drive macroscopic arrows).
  *   **Statistical Second Law:** It must respect that entropy decrease is *improbable*, not *impossible* (fluctuation theorems).
  *   **Relativity:** It must be compatible with the lack of a preferred global simultaneity (the arrow must be definable within light cones).

  **4. The Meta-Constraint (Your "Bug")**
  *   **Explanatory Parity:** The theory must justify why the low-entropy past is treated as a boundary condition (brute fact) while the high-entropy future is treated as a dynamical consequence. It cannot demand a mechanism for the increase while accepting the initial state as unexplained, unless it provides a principled reason for this asymmetry in explanation.

  ---

  ### II. The Incompatible Pair

  Here is the tension you suspected. You generally cannot satisfy both of these simultaneously without a "bridge" assumption that carries its own cost:

  1.  **Strict Micro-Physical Symmetry:** The fundamental laws of nature are exactly time-reversal symmetric (T-symmetric).
  2.  **Robust Macroscopic Objectivity:** The arrow of time is an objective, mind-independent feature of physical processes, not merely a result of human ignorance or coarse-graining.

  **The Conflict:** If the laws are symmetric, the physics works equally well running forward or backward. To get an *objective* arrow out of *symmetric* laws, you must introduce an asymmetric boundary condition (the Past Hypothesis). But if the arrow depends on a boundary condition, it is not intrinsic to the *laws* (violating the spirit of Objectivity for some), and if you claim the arrow is intrinsic to the *processes*, you imply the laws aren't symmetric (violating Symmetry).
  *Most theories solve this by sacrificing one: either they make the arrow perspectival (sacrifice Objectivity) or they posit a new asymmetric law (sacrifice Micro-Symmetry).*

  ---

  ### III. The "Killer" Requirement

  If you only check one box to filter the literature, use this one:

  **The Record Constraint:** *The theory must explain why physical records (traces, memories, fossils) are reliably formed of the past and not the future, without presupposing the temporal direction of the recording process.*

  **Why it rules out popular answers:**
  *   It kills **circular causal accounts** (e.g., "We have records of the past because causes precede effects").
  *   It kills **purely epistemic accounts** (e.g., "Entropy is just ignorance"). Ignance doesn't leave physical footprints; burnt wood does.
  *   It kills **naive thermodynamic accounts** unless they can show *why* entropy increase creates traces in one direction only (the "fork asymmetry" problem).

  ---

  ### IV. Scorecard of Current Families

  Here is where the four main approaches break against the spec sheet.

  | Theory Family | Core Claim | Where It Breaks |
  | :--- | :--- | :--- |
  | **1. The Standard View**<br>(Boltzmann / Albert)<br>*Past Hypothesis + Stats* | Arrow comes from time-symmetric laws + a special low-entropy initial boundary condition. | **Fails Explanatory Parity.** It treats the Past Hypothesis as a brute fact. It explains why entropy *increases*, but not why the universe *started* low. It pushes the mystery to the boundary. |
  | **2. The Epistemic View**<br>(Price / Subjective)* | The arrow is not in the world, but in our perspective as agents embedded within it. | **Fails Objectivity.** A cup of coffee cools in an empty universe. This view struggles to explain why thermodynamic irreversibility persists without observers to "coarse-grain" the data. |
  | **3. The Coarse-Graining View**<br>(Jaynes / Information)* | Entropy is a measure of missing information; irreversibility is a loss of resolution. | **Fails the Record Constraint.** If entropy is just "our ignorance," why does the *physical world* retain traces (records) that constrain our ignorance? It conflates the map with the territory. |
  | **4. The Fundamental Law View**<br>(Penrose / Prigogine)* | There is a hidden, time-asymmetric law at the micro-level (e.g., gravity-induced collapse). | **Fails Empirical Adequacy.** There is currently no experimental evidence for T-violation in the relevant domains (strong/EM gravity). It requires new physics that hasn't arrived. |

  **Summary for a Chemist:**
  You are likely finding arguments frustrating because most interlocutors are defending **Row 1** (Standard View) while pretending it doesn't have the **Explanatory Parity** problem, or they are defending **Row 2** (Epistemic) while ignoring that reactions proceed without a lab notebook.

  If you want the most robust current framework, look at the **Standard View (Row 1)**, but demand they justify the **Past Hypothesis**. If they can't, they are smuggling in a metaphysical assumption and calling it physics.
