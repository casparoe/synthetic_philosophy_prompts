answer: |-
  Consider a stable triangular arch constructed from three smooth, dry granite blocks resting on a flat concrete floor, where the central keystone is held in place solely by gravity and friction against the two side blocks, with no mortar, glue, nails, ropes, or ties involved, such that every internal surface of the central block is in direct spatial contact with the side blocks but no external material binds them together.

  **Verdicts and Reasoning:**
  *   **Universalism:** Yes. Composition is unrestricted; any plurality of objects, including these blocks, composes a further object.
  *   **Nihilism:** No. Only simple objects exist; the blocks are composite themselves (or simples arranged block-wise), but no new object is formed.
  *   **Contact:** Yes. The blocks compose an object because their parts are in direct spatial contact with one another.
  *   **Fastening:** No. The blocks do not compose an object because they are not fastened together; gravity and friction are forces, not binding mechanisms like glue or nails.

  **Feature Analysis:**
  The single feature doing the work is **spatial contact without mechanical or adhesive binding**. If you remove this feature by adding mortar, Fastening switches to "Yes" (now they are bound); if you remove it by separating the blocks slightly, Contact switches to "No" (contact is broken). The Fastening defender, whose verdict conflicts with the intuition that a stable arch is a single unit, would escape by arguing that "fastening" requires a dedicated binding agent rather than incidental forces, or by biting the bullet and claiming the arch is merely blocks arranged arch-wise, denying that structural stability entails ontological unity. This demonstrates that the disagreement stems from the strictures of the composition principle itself (binding vs. touching) rather than smuggled intuitions about what an "arch" is.
