prompt: |-
  Building a case for a metaphysics reading group. I need a scenario where two of the moderate (restrictivist) answers to the special composition question -- pick two out of contact, fastening, cohesion -- give opposite verdicts about whether some composite object exists, and the disagreement isnt because one of those answers is obviously dumb. Constraints: ordinary materials only (furniture, rocks, tools, food), no living things anywhere (life is another answer I want held out of the example), no exotic physics, and keep it to one paragraph. After the scenario, spell out the verdict and the reasoning for each of: universalism, nihilism, and your two chosen restrictivist answers. Then tell me which single feature of the case is doing the work, what breaks if I take that feature away, and how a defender of whichever answer comes out worse would try and escape the case. The point of the exercise is that restrictivism isnt one position, so the split has to fall out of the composition principle itself and not out of intuitions about what counts as an object that got smuggled in with the setup.
