ersion of this pushes back until you'd have to have chosen your own starting point, so nothing is ever really anyone's doing. Is that right, or is there a line in my list that actually holds? Give me exactly five numbered points, one or two sentences each, no intro and no wrap-up: the principle or small set of principles that fits my verdicts, what it says about cases I haven't listed, and which of my gut reactions I have to give up.
