  Here is the reverse-engineering of her machine, the prediction for Universe J, and the test case that will expose her true algorithm.

  ### 1. The Machine: Two Compatible Frameworks
  There are two major ethical frameworks that fit all four of her previous rulings perfectly. They differ in their math, but they agree on almost everything you've shown her so far.

  **Framework A: Average Utilitarianism (Limit of Means)**
