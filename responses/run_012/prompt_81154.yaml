      *   Fit accounts (epistemic, gaps, degree, context)? Yes.
      *   Distinguish requirements vs. tolerance? Yes.
      *   What would change (degree/context)? Yes.

  7.  **Final Polish:** (Produces the structured response below).
answer: |-
  The tension you identify is real, but the resolution lies in recognizing that the law is not committed to a single metaphysical theory of vagueness. Rather, it operates on a **political theory of authority**. The "void for vagueness" doctrine is not a semantic critique; it is a separation-of-powers constraint.

  Here is a reconstruction of the implicit theory, an analysis of how it fits philosophical accounts, and an evaluation of what would change under rival theories.

  ### 1. Reconstructing the Implicit Theory: Authority over Ontology

  The legal system does not care whether a boundary exists "in nature." It cares about **who has the authority to draw the line** and **whether the subject had notice**.

  The apparent contradiction dissolves when we distinguish between **unconstrained discretion** and **constrained delegation**.

  *   **Commitment 1 (Void for Vagueness):** This targets *unconstrained discretion*. If a statute forbids "annoying conduct" without defining "annoying," it delegates the power to define the crime to the police officer or prosecutor at the moment of enforcement. This violates Due Process because the legislature has abdicated its lawmaking function. The citizen lacks notice, and the enforcer lacks a standard.
  *   **Commitment 2 (Standards like Negligence):** This represents *constrained delegation*. The legislature acknowledges it cannot write a rule for every contingency. It delegates the line-drawing to the jury, but crucially, it surrounds that delegation with **common law history, jury instructions, and appellate review**. "Reasonableness" is not a blank check; it is a reference to a community standard of care that is culturally thick and legally curated.

  **The Unified Theory:** The law treats vagueness as a defect of *legitimacy*, not *truth*.
  *   When the legislature draws an arbitrary line (stipulation), it is valid because the legislature has the democratic authority to precisify.
  *   When the jury draws a contextual line (delegation), it is valid because the jury represents the community's moral intuition, constrained by judicial oversight.
  *   When the police draw the line (enforcement discretion), it is void because the executive branch lacks the authority to define the law.

  ### 2. Stipulation vs. Delegation

  You correctly identify these as the two devices. Here is how they map to philosophical commitments:

  **A. Stipulation (The Arbitrary Line)**
  *   *Examples:* Age of majority, neurological death, statutes of limitation.
  *   *Philosophical Fit:* **Supervaluationism.** The predicate (e.g., "adult") has a gap. The law does not claim to discover the boundary; it *selects one admissible precisification* and makes it binding.
  *   *Justification:* Administrability and Equality. The law prefers a "false precision" (midnight on a birthday) to the cost of case-by-case inquiry. The law explicitly admits it is creating a fiction ("legal death") to serve a regulatory purpose.
  *   *Commitment:* The law does not suppose the boundary was there all along. It supposes the *need for a boundary* was there, and the legislature has the power to fill the gap.

  **B. Delegation (The Standard)**
  *   *Examples:* Negligence, obscenity, reasonableness.
  *   *Philosophical Fit:* **Contextualism.** The extension of "reasonable" shifts with the circumstances. The law does not try to freeze the extension in text.
  *   *Justification:* Equity and Competence. Twelve jurors are deemed better at assessing local nuance than a legislature is at predicting it.
  *   *Commitment:* There is no "fact of the matter" independent of the community judgment. The verdict *creates* the fact of the matter for that case.

  ### 3. Which Philosophical Account Fits Best?

  The legal practice is ecumenical, but it rules out specific metaphysical claims in specific contexts.

  *   **Epistemicism (Determinable but unknowable extensions):** The law *mimics* this when it enforces bright-line rules (e.g., "0.08% BAC"). It acts *as if* there is a sharp line. However, it does not require a belief that the line is metaphysically real, only that it is legally binding.
  *   **Supervaluationism (Gaps/Permissible Precisification):** This is the **dominant operational theory**. The Void for Vagueness doctrine essentially says: "This statute allows for too many inadmissible precisifications." A valid statute narrows the range of admissible precisifications to a manageable set. A standard like "negligence" relies on the jury to select the correct precisification for the context.
  *   **Degree Theory (Truth comes in degrees):** The law **strictly resists** this in the context of liability (binary verdicts) but **accepts** it in remedies (comparative negligence, sentencing). The law demands a binary switch for rights and punishment (Guilty/Not Guilty) to maintain moral clarity and finality, even if the underlying reality is graded.
  *   **Contextualism:** This is the theory underlying **standards**. The Void for Vagueness doctrine is *not* confused about this; it demands that the context be *judicial*, not *executive*. A statute is void if the "context" that resolves the vagueness is the whim of the arresting officer. It is valid if the "context" is the evidence presented to a jury under judicial instruction.

  ### 4. Requirements vs. Tolerance

  **What the Practice Strictly Requires:**
  1.  **Intelligible Principle:** The legislature must provide a standard that limits enforcement discretion. It cannot say "ban what you dislike."
  2.  **Fair Notice:** An ordinary person must be able to know, ex ante, which side of the line they are on (for criminal laws).
  3.  **Binary Resolution:** For liability, a decision must be reached. The law cannot leave a case in a "gap."

  **What the Practice Merely Tolerates:**
  1.  **Metaphysical Arbitrariness:** The law tolerates that "death" or "adulthood" might not map to biological reality, provided the rule is clear.
  2.  **Semantic Vagueness:** The law tolerates words like "reasonable" because it trusts the procedural machinery (jury + appeal) to resolve the vagueness case-by-case.
  3.  **Borderline Cases:** The law tolerates that some cases are hard, provided the *rule* for deciding them is clear.

  **What the Voidness Doctrine Rules Out:**
  It rules out **unstructured delegation**. It does not rule out vagueness *per se*; it rules out vagueness that empowers the executive branch to define the crime. If a statute says "no vehicles in the park," it is vague (is a bicycle a vehicle?), but it is not void, because a judge can interpret it. If a statute says "no annoying things in the park," it is void, because "annoying" provides no interpretive constraint on the police.

  ### 5. Counterfactuals: What Would Change?

  **A. If We Adopted Degree Theory Fully**
  *   *Current Practice:* Verdicts are binary. You are either negligent or not; guilty or not.
  *   *Change:* If the law accepted that negligence is a matter of degree, verdicts would be graded (e.g., "0.6 liable").
  *   *Consequence:* This would collapse the **Burden of Proof**. "Beyond a Reasonable Doubt" would need to be quantified (e.g., >90% certainty). It would also complicate **Stare Decisis**. Precedent relies on binary holdings.
  *   *Why it hasn't happened:* The law serves a coordinative and retributive function. Punishment requires a moral threshold, not a sliding scale. You cannot imprison someone "0.6 years" for being "0.6 guilty." The binary verdict is a moral technology, not a semantic description.

  **B. If We Adopted Contextualism Fully (and applied it to Voidness)**
  *   *Current Practice:* A statute is judged on its face for vagueness.
  *   *Change:* If courts accepted that meaning is *entirely* context-dependent, they might be less willing to strike down statutes on their face, arguing that the "context of enforcement" will clarify the meaning.
  *   *Consequence:* This would weaken Due Process. It would shift power from the legislature (writing the text) to the enforcer (creating the context).
  *   *Why the Doctrine isn't Confused:* The Void for Vagueness doctrine correctly identifies that in criminal law, the **text** must provide the constraint, not the **situation**. Relying on situational context allows for discriminatory enforcement (e.g., "loitering" is vague, but in practice, it means "loitering while black"). The doctrine insists the *law* must narrow the context, not the *police*.

  ### Conclusion: Which Commitment is Doing the Work?

  The commitment that is doing the real work is **not about vagueness at all**. It is about **the Rule of Law vs. The Rule of Men**.

  *   **Stipulation** works because it represents the **Rule of Law**: The legislature has spoken, the line is fixed, and everyone is treated equally, even if the line is arbitrary.
  *   **Standards** work because they represent the **Rule of Law** mediated by community judgment: The legislature has set a goal ("care"), and the jury applies it consistently within the judicial process.
  *   **Void for Vagueness** strikes down statutes that represent the **Rule of Men**: The legislature has remained silent, leaving the definition of the crime to the individual whim of the enforcer.

  The law is not confused. It accepts ontological vagueness (death, age) and semantic vagueness (reasonableness) so long as the **authority to resolve that vagueness** is located in a legitimate institution (Legislature or Jury) rather than an arbitrary agent (Police). The "defect" voided by the courts is not indeterminacy; it is **unauthorized discretion**.
