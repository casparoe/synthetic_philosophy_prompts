prompt: |-
  Legal systems seem to me to hold two commitments about vagueness that cannot comfortably sit together, and I would like to know which of them is doing the real work. On one side, courts in the jurisdictions I know best treat indeterminacy in a criminal prohibition as a defect serious enough to void the statute: if an ordinary person cannot tell what conduct is forbidden, or if the prohibition leaves police and juries to enforce it as they please, the law is struck down even when the conduct it targets is plainly worth prohibiting. On the other side, the same systems run on predicates that are graded through and through — negligence, reasonableness, materiality, competence, undue influence, obscenity — and on a definition of death by neurological criteria, and nobody supposes these are void. Here the line is left to a jury.

  I want the implicit theory of vagueness reconstructed. Take the sorites seriously: neurons do not cease together, impairment is a continuum, and the age of majority falls at midnight on a birthday with no physiological significance whatever. When the law stipulates such a line, does it suppose it is discovering a boundary that was there all along, or openly creating one? When it delegates reasonableness to twelve jurors, has it decided that there is no fact of the matter, or that there is one and jurors are as reliable at finding it as anyone? I suspect two devices carry different commitments and ought to be separated: stipulation — the authoritative arbitrary line, defended on grounds of notice, administrability, and equal treatment, with the maxim that the law does not concern itself with trifles, grandfather clauses, and limitation periods as its cousins — and delegation, where no line is drawn at all and the case is handed to a decision-maker.

  So reconstruct the theory, or theories, and say whether the practice is unified. Which accounts does it fit: that vague predicates have determinate but unknowable extensions; that they have gaps, so that a legal line is a permissible precisification of a predicate the law had left unsettled; that vagueness is a matter of degrees of truth; that the extension shifts with context and with the purpose of the inquiry? Distinguish what the practice strictly requires from what it merely tolerates — I expect that a legislature's power to draw a line somewhere is compatible with almost every view, and that the interesting question is what the voidness doctrine rules out. Then tell me what would actually change in court if we adopted a rival account: under a degree-theoretic picture, should verdicts themselves be graded, so that partial negligence and partial liability become the honest outcome? And if extensions shift with context, is the voidness doctrine confused about the problem it takes itself to be solving?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** The user identifies a seeming contradiction in legal systems regarding vagueness.
          *   Commitment A: Vagueness/Indeterminacy in criminal statutes is a defect (Void for Vagueness Doctrine). Requires clear notice, prevents arbitrary enforcement.
          *   Commitment B: Legal systems rely heavily on inherently vague standards (negligence, reasonableness, death, etc.) delegated to juries/judges without being void.
      *   **Task 1: Reconstruct the Implicit Theory:** What is the underlying philosophy of vagueness in law?
      *   **Task 2: Analyze the Mechanisms:** Distinguish between *stipulation* (arbitrary lines like age 18) and *delegation* (standards like "reasonable").
      *   **Task 3: Evaluate Philosophical Accounts:** How does legal practice fit with theories of vagueness (epistemicism, supervaluationism/gaps, degree theory, contextualism)?
      *   **Task 4: Distinguish Requirements vs. Tolerance:** What does the practice *demand* vs. what does it *allow*? Specifically, what does the "void for vagueness" doctrine rule out?
      *   **Task 5: Counterfactual Analysis:** What would change if we adopted a rival account (e.g., degree theory $\rightarrow$ graded verdicts? Contextualism $\rightarrow$ is voidness doctrine confused?)?

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Void for Vagueness (VfV):* Rooted in Due Process. Needs notice and non-arbitrary enforcement. Applies mostly to criminal law (strict scrutiny), less to civil/tort.
      *   *Standards vs. Rules:* "Reasonable care" is a standard. "Speed limit 55" is a rule. Standards delegate authority; rules constrain it.
      *   *Philosophical Theories:*
          *   *Epistemicism:* There is a sharp line, we just don't know it. (Law sometimes acts like this with bright-line rules, but rarely claims metaphysical certainty).
          *   *Supervaluationism/Gaps:* There are clear cases, borderline cases, and no truth value in between until precisified. (Fits VfV: if too many borderlines, it's void. Fits Standards: jury precisifies).
          *   *Degree Theory:* Truth comes in degrees. (Law generally resists this in verdicts—binary guilty/not guilty—but accepts it in sentencing/damages).
          *   *Contextualism:* Meaning shifts with context. (Law uses this via "reasonable person *in these circumstances*").
      *   *The "Real Work":* Is it about metaphysics or power? It's mostly about *authority* and *legitimacy*. Who gets to draw the line? Legislature (democratic) vs. Police/Judge (arbitrary).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis: The law isn't committed to a single metaphysical theory of vagueness but rather a *political theory of authority*. The tension is resolved by distinguishing *rules* (legislative stipulation) from *standards* (judicial/jury delegation).

      *   **Reconstructing the Implicit Theory:**
          *   It's not about "truth" in the philosophical sense; it's about *notice* and *discretion*.
          *   *Commitment 1 (VfV):* Protects against *ex post facto* criminalization and arbitrary state power.
          *   *Commitment 2 (Standards):* Acknowledges the impossibility of codifying every nuance of human conduct.
          *   *Synthesis:* The law treats vagueness as a *defect of authority*, not necessarily a defect of language. If the legislature draws the line (stipulation), it's valid (even if arbitrary, like age 18). If the line is left to enforcement without guidance (delegation without standards), it's void.

      *   **Stipulation vs. Delegation:**
          *   *Stipulation:* "Age 18," "55 mph." This is *precisification by fiat*. Fits Supervaluationism (legislature selects one admissible precisification). Justified by administrability and equality.
          *   *Delegation:* "Reasonable," "Negligent." This is *contextual precisification*. The law admits it cannot know the boundary in advance. It trusts the community (jury) to find the "local truth."
          *   *Resolution of Tension:* VfV strikes down statutes that delegate *without constraints*. "Reasonableness" has a common law history/constraint. "Whatever the police think" does not.

      *   **Fitting Philosophical Accounts:**
          *   *Epistemicism:* Law occasionally mimics this (bright lines), but doesn't claim the boundary was "there all along" metaphysically. It claims it's *made* there.
          *   *Supervaluationism (Gaps):* Best fit for VfV. A statute is void if it leaves too much of the "gap" uncovered or allows too many inadmissible precisifications. Standards work because the jury fills the gap legitimately.
          *   *Degree Theory:* Law largely rejects this for *liability* (binary verdicts) but accepts it for *remedies* (comparative negligence, sentencing).
          *   *Contextualism:* Strong fit for standards. "Reasonable" shifts with context. VfV isn't confused; it demands the context be *legal* context, not *officer* whim.

      *   **Requirements vs. Tolerance:**
          *   *Requirement:* The legislature must provide an "intelligible principle" or sufficient guidance.
          *   *Tolerance:* The law tolerates metaphysical vagueness (when does life end?) as long as procedural legitimacy is maintained.
          *   *VfV's Real Target:* It rules out *unconstrained discretion*, not vagueness *per se*.

      *   **Counterfactuals (What would change?):**
          *   *Degree Theory:* If adopted fully, verdicts would be probabilistic or graded. "60% guilty." This would collapse the burden of proof ("Beyond a Reasonable Doubt" becomes "90% sure?"). Currently, law resists this to maintain moral clarity and finality.
          *   *Contextualism:* If VfV acknowledged contextualism fully, it might be more lenient on statutes if the context narrows them. But VfV insists on *statutory* context, not *enforcement* context.
          *   *Conclusion on Change:* Little would change practically because the law's "theory" is functional, not metaphysical.

  4.  **Refining and Polishing:**

