      *   *Specific Examples:* Use the user's examples (death, age, negligence).
      *   *Addressing the "Real Work":* Make sure to explicitly answer which commitment is doing the work. (Answer: The commitment to *legitimacy of coercion*, not semantic precision).

  5.  **Self-Correction/Critique during drafting:**
      *   *Initial thought:* Maybe the law is an epistemicist system.
      *   *Correction:* No, because the law admits it *creates* lines (age 18). Epistemicism says the line exists independently. Supervaluationism fits better (legislature picks a precisification).
      *   *Check:* Did I address the "death by neurological criteria" example?
      *   *Adjustment:* Use that to show stipulation. The law *makes* you dead at criteria X, even if biology is fuzzy.
      *   *Check:* Did I answer the "graded verdicts" question?
