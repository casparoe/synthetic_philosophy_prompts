answer: |-
  ### The phenomenon

  You are describing the problem of **updating on conditional evidence**. In standard Bayesian updating, an agent learns a proposition $E$ is true and eliminates all possible worlds where $E$ is false, then renormalizes. Here, the evidence is not a categorical fact like 'I am not in Birch', but a conditional constraint: 'If North, then Ash'.

  The edges of this case are defined by the lack of antecedent knowledge. If you learned 'You are in the North' and separately 'If North, then Ash', standard conditionalization applies twice. If you learned 'You are in Ash', the conditional is redundant. The peculiar tension arises specifically when the *only* new information is the conditional relation itself. The conflict is between treating the conditional as a truth-functional constraint on worlds (eliminating Birch) versus treating it as a constraint on conditional probabilities (shifting weight within North). This distinguishes it from **Jeffrey Conditionalization**, where the evidence itself is uncertain (e.g., 'I'm 90% sure I'm in the North'). Here, you are 100% sure of the conditional, but unsure how that maps to world-elimination.

  ### The nearest names

  The broad literature term is **The Problem of Updating on Conditionals**. Within this, your specific puzzle is often associated with **Igor Douven**, who has extensively analyzed cases where learning a conditional seems to preserve the antecedent's probability. It is also intimately linked to **Lewis's Triviality Results**. David Lewis proved that if you treat conditionals as standard propositions with truth conditions and assume the **Ramsey Test** (that credence in 'If A then C' equals conditional credence $P(C|A)$), probability theory collapses.

  This distinguishes your case from simple **Material Conditionalization**. If the conditional were merely a material implication ($\neg(A \land \neg C)$), the update would be straightforward (Rule 1 below). The friction exists because natural language conditionals often behave like **suppositional** claims rather than truth-functional propositions. It is not **Jeffrey Conditionalization** because you aren't uncertain about the evidence; you are uncertain about how the evidence partitions the logical space.

  ### The crux

  The silence of ordinary probability machinery stems from the fact that Bayes' rule requires a proposition $E$ to conditionalize on ($P_{new}(H) = P_{old}(H|E)$). The machinery goes silent because it is unclear what proposition $E$ corresponds to the English sentence 'If North, then Ash'. The two competing recipes encode different semantic assumptions about that sentence.

  **Recipe 1: The Material Update.**
  This treats the conditional as a material implication: $\neg(\text{North} \land \neg\text{Ash})$. This proposition is false only in the Birch world.
  *   **Procedure:** Eliminate Birch. Renormalize across Ash, Cedar, Dogwood.
  *   **Principle:** **Truth-Conditionalism.** Conditionals have truth values identical to material implications. Learning a true sentence eliminates worlds where it is false.
  *   **Result:** Credence in North drops (1/2 → 1/3).

  **Recipe 2: Antecedent Preservation (Douven's Rule).**
  This treats the conditional as a constraint on the conditional probability: $P(\text{Ash}|\text{North})$ becomes 1, while $P(\text{North})$ remains fixed.
  *   **Procedure:** Shift all probability mass from Birch to Ash. Keep total mass of North vs. South constant.
  *   **Principle:** **Suppositionalism.** The news concerns the *connection* between antecedent and consequent, not the likelihood of the antecedent itself. Learning a rule doesn't change the base rate of the rule's application conditions.
  *   **Result:** Credence in North stays fixed (1/2).

  The choice isn't arbitrary; it depends on the **source** of the conditional. If a god tells you 'It is not the case that (North and not Ash)', Recipe 1 is correct. If a guide tells you 'Whenever someone is in the North, they are in Ash' (implying a structural constraint), Recipe 2 is often more intuitive because the guide's testimony targets the relation, not the distribution of agents.

  ### Verdict

  The underdetermination is real, but it is not a failure of rationality; it is a semantic ambiguity. Probability theory dictates how to update given a proposition, but it does not dictate which proposition corresponds to a natural language conditional. Choosing between the recipes is a matter of principle regarding the **semantics of the evidence**, not mere taste.

  If the conditional is learned as a logical constraint on the world (a fact about the map), Recipe 1 is mandated. If it is learned as an evidential link (a fact about the correlation between location and town), Recipe 2 is mandated. In your medical and legal examples, the conditional usually functions as an evidential link (a positive test *indicates* disease; truthfulness *implies* presence), suggesting Recipe 2 is often the pragmatic choice. However, without specifying the metaphysical status of the conditional learned, standard probability theory cannot uniquely determine the posterior credences. The silence of the machinery is therefore a result: there is no unique rational answer absent a theory of what conditionals *are*.
