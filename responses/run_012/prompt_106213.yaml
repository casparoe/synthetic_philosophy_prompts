  **Sketch of Strong Answer:** A strong answer distinguishes *De Regno* from *Summa Theologiae*, noting textual tensions. It must clarify agency: Aquinas typically reserves coercive power for public authority, not private citizens. It should discuss the role of superior authorities (e.g., Emperor) in deposing tyrants, not just popular revolt. Finally, it should contextualize 'tyrannicide' within natural law rather than modern resistance theory.

  **Grade: 2:1**

  **Comments:**

  **Strengths:** You accurately summarize *ST* II-II, q. 42: sedition opposes the common good and is sinful. You correctly note that tyrannical rule, directed to private good, lacks true justice, so opposing it isn't strictly sedition. Your inclusion of Aquinas's prudential warnings (upheaval may worsen conditions) shows good engagement.

  **Weaknesses:** You state "any citizen... may take part." This is problematic. Aquinas generally denies private individuals the right to kill rulers, reserving this for public authority. He suggests that if a community has the right to appoint the ruler, it may depose him, but this is collective, not individual. While *De Regno* calls delivering people from tyranny "praiseworthy," it doesn't straightforwardly license private assassination.

  **Textual Precision:** You treat Aquinas's corpus as monolithic. *De Regno* is more permissive than the *Summa*. A strong answer notes this development or tension.

  **Settled vs. Contested:** It is settled that Aquinas condemns sedition against just regimes. However, whether he endorses *private* tyrannicide is genuinely contested. Scholarship is divided: some see here a proto-resistance theory; others argue Aquinas prioritizes order and leaves judgment to superiors, not mobs. You present the permissive reading as consensus; it is not.

  **Verdict:** Solid first-year work showing good textual familiarity, but lacks critical nuance on agency and textual development. You've captured the spirit but oversimplified the mechanics of legitimate resistance.
