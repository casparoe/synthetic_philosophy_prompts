answer: |-
  # Q&A Prep Sheet: Strategy-Stealing & Determinacy

  **Thesis Summary:** SSA proves $\neg(\text{P2 wins})$. Inferring $\text{P1 wins}$ requires determinacy. In finite games, this makes SSA redundant (vs. Backward Induction). In infinite/draw-possible games, assuming determinacy is circular. Also, SSA requires monotonicity, often overlooked in zugzwang contexts.

  **Audience Profile:** 12 people. 9 CGT (pragmatic, know the games), 2 Constructivists (logic purists), 1 Complexity (feasibility focused).

  ---

  ### 1. The "Epistemic Utility" Objection (CGT Lead)
  **Who:** The senior combinatorialist who actually uses SSA in papers.
  **The Question:** "You claim SSA is redundant in finite games because Backward Induction (BI) exists. Theoretically, yes. But for Chomp on a $10 \times 10$ board, the game tree is too large for BI to be a meaningful proof. SSA is the *only* tool we have that establishes the winner in feasible time. If 'earning its keep' means providing knowledge we couldn't otherwise feasibly obtain, aren't you ignoring the epistemic value of the argument?"
  **Damage:** **High.** This attacks your core claim that SSA "does no work." If work = feasible proof, SSA is essential.
  **Your Reply:** "I concede SSA has *heuristic* or *epistemic* value where BI is computationally intractable. My claim is about *logical* dependence, not computational complexity. I'm arguing that the *validity* of the conclusion relies on determinacy, not that the proof is easy to find. However, I should clarify that in contexts where complexity matters, SSA is indeed doing 'work' that BI cannot practically do."
  **Soft Spot:** You risk sounding like you're dismissing computational complexity as irrelevant to "proof." If you lean too hard on "theoretical possibility," you lose the complexity person and the pragmatists. Acknowledge the distinction between *verifiability* and *provability*.

  ### 2. The "Excluded Middle" Objection (Constructivist)
  **Who:** One of the proof theorists.
  **The Question:** "You say the move from 'P2 cannot win' to 'P1 wins' requires a determinacy premise. In a finite game without draws, determinacy is equivalent to the Law of Excluded Middle (LEM) over the statement 'P1 has a winning strategy.' Are you not simply restating that SSA is a non-constructive existence proof? We already know that. What is the gain in calling it a 'determinacy premise' rather than just admitting you're using classical logic?"
  **Damage:** **High.** They will pin you on whether your thesis is just a rebranding of "SSA is non-constructive."
  **Your Reply:** "The gain is precision. 'Non-constructive' is a broad bucket. By isolating 'determinacy' as the specific premise, we can see exactly where the argument breaks in infinite or loopy games where LEM doesn't straightforwardly apply to game outcomes. It allows us to separate the strategy-stealing mechanic from the topological/logical structure of the game space."
  **Soft Spot:** If they press you on whether "determinacy" adds anything over "LEM" in the finite case, you have little ground. In finite games, they are extensionally identical. Admit this is mostly about generalizing to infinite cases.

  ### 3. The "Monotonicity Counter-Example" Objection (CGT Veteran)
  **Who:** The person who knows Chomp and Hex cold.
  **The Question:** "Your second point is that SSA fails without monotonicity. But SSA is almost exclusively applied to Hex and Chomp, which *are* monotone. Can you name a specific game in the literature where researchers have incorrectly applied SSA because they missed a zugzwang-like non-monotonicity? If not, aren't you solving a problem that doesn't exist?"
  **Damage:** **Medium.** If you can't name a case, this point looks like padding.
  **Your Reply:** "I am not claiming it has caused widespread errors in Hex literature. I am claiming it is a hidden assumption that limits the argument's generalizability. For example, in certain variants of *Nim* with pass-moves or specific *Chess* endgame studies, symmetry arguments are sometimes invoked loosely. My point is cautionary: SSA is not a universal symmetry argument; it is a monotonicity argument."
  **Soft Spot:** You need a concrete example. If you say "Chess" they will laugh (SSA isn't used in Chess). If you say "Nim," they will say "Nim is solved by Sprague-Grundy." **Prep a specific variant:** Look up "Chomp with a pass" or "Misère Hex" where monotonicity breaks and SSA fails. If you don't have one, cut this point or soften it significantly.

  ### 4. The "Circularity vs. Dependency" Objection (Logic/CGT)
  **Who:** The other proof theorist or a logic-minded CGTer.
  **The Question:** "You call the argument circular in infinite games because determinacy is 'up for grabs.' But often SSA is used *as a lemma* within a larger determinacy proof, not to prove determinacy from scratch. For example, we might use SSA to rule out P2 winning, then use topological arguments to rule out draws, concluding P1 wins. Where is the circularity there?"
  **Damage:** **Medium.** You may be overstating the "circularity" charge.
  **Your Reply:** "If SSA is just one lemma in a chain where determinacy is proved by *other* means (e.g., compactness, topology), then I agree it is not circular. My critique targets cases where SSA is presented as the *primary* justification for P1 winning in contexts where draws are possible, without an independent proof of no-draw. I want to prevent SSA from doing the heavy lifting for determinacy."
  **Soft Spot:** You must be careful not to accuse specific papers of circularity unless you are sure. Frame it as a "pedagogical risk" rather than a "literature-wide error."

  ### 5. The "Non-Constructive is a Feature" Objection (Complexity)
  **Who:** The complexity theorist.
  **The Question:** "We know SSA doesn't give the strategy. That's why we study it. It tells us the complexity class of the *decision problem* (P1 wins) is distinct from the *search problem* (find the move). By focusing on the logical premises, aren't you obscuring the computational content? The value is that it separates existence from construction."
  **Damage:** **Medium.** Reframes your critique as missing the point of complexity theory.
  **Your Reply:** "I agree that the separation of existence and construction is valuable. My point is that we should be explicit about *which* non-constructive principle is doing the work. Is it the stealing mechanism, or is it the background determinacy? Clarifying this helps us understand why SSA fails in constructive settings or infinite games."
  **Soft Spot:** Don't let them box you into "SSA is useless." Agree on the utility, insist on the logical clarity.

  ### 6. The "Infinite Hex" Objection (CGT)
  **Who:** A CGTer interested in infinite games.
  **The Question:** "In Infinite Hex, determinacy is a deep theorem (using Borel determinacy or specific topological arguments). SSA is still used there to rule out P2. Are you saying SSA is useless there because determinacy is hard? Or that it's circular because we assume determinacy?"
  **Damage:** **Low/Medium.** Tests the boundary of your thesis.
  **Your Reply:** "In Infinite Hex, determinacy is non-trivial. If we invoke SSA to say 'P1 wins' *before* establishing no-draw, we are jumping the gun. SSA tells us 'If there is a winner, it is P1.' That is a valuable constraint, but it is not a proof of a win until the no-draw condition is met independently."
  **Soft Spot:** This is actually where your thesis shines. Stick to the distinction: SSA = "P2 doesn't win." Determinacy = "Someone wins." Together = "P1 wins."

  ### 7. The "Zermelo's Theorem" Objection (Pedant)
  **Who:** Someone who wants to show they know history.
  **The Question:** "You're describing Zermelo's Theorem (1913). Zermelo already established that finite perfect information games are determined. Are you just asking us to cite Zermelo explicitly when we use SSA?"
  **Damage:** **Low.** Makes you sound like you're rediscovering basic game theory.
  **Your Reply:** "I'm asking for explicit acknowledgment of the dependency. Often SSA is taught as 'P1 wins because they can steal P2's strategy,' glossing over the 'because the game must be won by someone' step. In teaching, that gap confuses students when they encounter drawn games later."
  **Soft Spot:** Don't let it sound like you're demanding new citations. Frame it as pedagogical clarity.

  ### 8. The "So What?" Objection (General)
  **Who:** The room collectively, if you haven't convinced them.
  **The Question:** "Let's say we accept your analysis. SSA relies on determinacy. Determinacy holds for finite games. SSA works. Does this change how we solve games? Does it change the theorems? Or is this purely semantic?"
  **Damage:** **Fatal.** If the answer is "semantic," you've wasted their time.
  **Your Reply:** "It changes how we approach *open* problems. If we are looking at a new game variant where determinacy is unknown, SSA gives us a conditional result. It directs research: 'Don't look for a P2 strategy, look for a draw or a P1 strategy.' It prioritizes the search space."
  **Soft Spot:** You need to sell the *utility* of the distinction. If you can't, the talk feels like philosophical navel-gazing.

  ---

  ### The One Question You Hope Nobody Asks

  **"Is there a single theorem in the last 50 years that would be false if we adopted your stricter phrasing, or are you just asking us to add a footnote?"**

  *   **Why it's fatal:** If you say "No theorems are false," they will conclude your talk was trivial. If you say "Yes," they will demand the counter-example, and if you can't produce a specific paper that claimed "SSA proves P1 wins in [Game X]" where [Game X] turned out to be a draw or undetermined, your empirical claim collapses.
  *   **Preparation:** You need to find *one* paper or textbook passage that glosses over the determinacy requirement in a context where it wasn't yet proven (e.g., early papers on Infinite Hex or specific Chomp variants). If you can't, pivot to: "It prevents future errors in infinite game theory where determinacy is not guaranteed."

  ---

  ### Strategic Advice for the Room

  1.  **Don't fight the Constructivists on LEM.** They are right. Admit you are working in Classical Logic. Your point is that *even within Classical Logic*, the dependency on Determinacy is often elided.
  2.  **Pivot to Infinite Games.** Your thesis is strongest there. In finite games, you are technically right but pragmatically weak (BI exists). In infinite games, Determinacy is *not* trivial, so your critique bites hard. Spend your energy there.
  3.  **The Monotonicity Point is your Weak Link.** The CGTers know Hex is monotone. If you spend too much time on zugzwang, they will think you don't understand why SSA is used in Hex. Frame it as "Why SSA *doesn't* apply to Chess," rather than "Why SSA is dangerous for Hex."
  4.  **Own the "Redundancy" Critique.** Admit that in finite games, SSA is logically redundant but computationally vital. Don't claim it's "doing no work." Claim it's "doing *epistemic* work, not *logical* work." That distinction will satisfy the Complexity person and the CGTers.
