answer: |-
  The established concept you are looking for is **Moral Standing** (specifically, the **Standing to Blame**).

  In contemporary moral philosophy (championed by thinkers like R. Jay Wallace, T.M. Scanlon, and Macalester Bell), a distinction is drawn between the *truth* of a blame claim (is the act wrong?) and the *standing* of the blamer (are they entitled to hold the other to this norm?). Your intuition is correct: this is distinct from hypocrisy. Hypocrisy concerns inconsistency between word and deed; standing concerns the *relationship* between the blamer, the blamee, and the norm.

  However, your three cases are not perfectly identical. They represent two different *grounds* for losing standing (or moral weight). Below is the analysis of the established concept, followed by a coined term to capture the specific "cost" intuition you described.

  ### 1. The Established Concept: Moral Standing

  **Definition:** A person lacks the standing to blame when they are implicated in the wrong they are criticizing in a way that makes their censure inappropriate, even if the censure is factually accurate.

  **Boundary:** Standing is lost not when the blamer violates the norm *now* (hypocrisy), but when their relationship to the norm is compromised by **complicity** or **injustice**.

  #### Application to Your Cases

  **Case 1 (The Manager) & Case 2 (The Countries): Complicity**
  These two cases fall squarely under **Complicitous Loss of Standing**.
  *   **Principle:** The blamer is causally or historically responsible for the conditions that led to the violation.
  *   **Case 1:** The manager *engineered* the failure. By creating impossible conditions, they become a co-author of the "wrong." To blame the staff is to deny their own agency in the outcome. This is sometimes called **"Constructive Blame"** or **"Entrapment."**
  *   **Case 2:** The lecturing country *benefited* from the historical violation. Their current "clean" status is subsidized by past "dirty" emissions. This is a loss of standing due to **Unjust Enrichment** or **"Dirty Hands."**
  *   **Verdict:** In both cases, the objection is normative. The blamer has *no right* to issue the blame because they are tainted by the very system they critique.

  **Case 3 (The Teetotaler): Moral Distance**
  This case is philosophically distinct. In strict terms, a teetotaler *retains* the standing to blame a drinker (a non-murderer has standing to blame a murderer). However, your intuition that the remark "lands differently" points to a defect in **Moral Authority** or **Moral Weight**, rather than standing.
  *   **Principle:** The blamer lacks **Shared Vulnerability**. They have not paid the "cost" of adhering to the norm.
  *   **Verdict:** This is not necessarily a loss of *right* to blame, but a loss of *wisdom* or *empathy*. The blame is "sterile." It lacks the weight that comes from struggle.

  ### 2. The Unifying Principle: Asymmetry of Burden

  You asked whether the relevant feature is producing the wrong, benefiting from it, or being untouched by the costs. While Cases 1 and 2 are about *taint* (complicity), Case 3 is about *distance* (privilege).

  The thread tying all three together is **Asymmetry of Burden**. In all three scenarios, the blamer demands adherence to a norm from which they are insulated—either because they rigged the game (Case 1), because they already cashed out their chips (Case 2), or because they never had to gamble (Case 3).

  ### 3. A Coined Term: "Unrisked Censure"

  Since "Standing" covers Cases 1 and 2 well but is debated in Case 3, and since you specifically want to capture the defect regarding the *cost* of the norm, I propose the term **Unrisked Censure**.

  **Definition:**
  **Unrisked Censure** is blame issued by an agent who is insulated from the costs, risks, or causal origins of the norm they are enforcing. It is a defect of moral positioning where the blamer demands sacrifice from the blamee that the blamer has not themselves risked, paid for, or necessitated.

  **Precise Boundaries:**

  1.  **Excludes Ordinary Hypocrisy:** If a smoker tells a smoker not to smoke, that is hypocrisy (inconsistency). If a non-smoker tells a smoker not to smoke, that *can* be Unrisked Censure (if the non-smoker finds abstinence effortless due to privilege/biology and dismisses the struggle).
  2.  **Excludes Mere Bad Manners:** It is not just being rude. It requires a structural asymmetry regarding the *norm's cost*. A doctor telling a patient to quit smoking is not Unrisked Censure, even if the doctor never smoked, because the doctor shares the *goal* of health and operates within a framework of care, not just judgment.
  3.  **Includes "Setup" Scenarios:** It covers the Manager (Case 1) because the manager is insulated from the *risk* of failure they imposed on others.
  4.  **Includes "Historical Benefit" Scenarios:** It covers the Countries (Case 2) because the lecturing country is insulated from the *cost* of development that the criticized country is now being asked to forgo.

  ### Summary of Differences

  | Feature | **Hypocrisy** | **Complicitous Standing Loss** (Cases 1 & 2) | **Unrisked Censure** (Your Unified Intuition) |
  | :--- | :--- | :--- | :--- |
  | **Core Defect** | Inconsistency (Word vs. Deed) | Implication (Blamer caused/benefited from wrong) | Insulation (Blamer pays no cost for norm) |
  | **Is the Blame True?** | Yes | Yes | Yes |
  | **Is the Blame Permissible?** | No (usually) | No (forfeited right) | Debatable (has right, lacks weight) |
  | **Example** | A thief stealing while arresting a thief. | A manager setting impossible deadlines then blaming staff. | A teetotaler dismissing the struggle of addiction. |

  ### Conclusion

  The established philosophical term is **Lack of Moral Standing**. This perfectly covers your first two cases (Manager and Countries) under the sub-heading of **Complicity**.

  However, to capture the specific nuance of the third case (and the "cost" element across all three), **Unrisked Censure** is the more precise descriptor. It identifies the defect not merely as a logical inconsistency or a legal forfeiture, but as a moral asymmetry: **the blamer is demanding a price from the blamee that the blamer has not paid, did not cause, and does not risk.**
