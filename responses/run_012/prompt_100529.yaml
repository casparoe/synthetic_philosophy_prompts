answer: |-
  This is a profound and classic set of tensions. You are grappling with the conflict between *act-consequentialism* (judge by actual outcomes), *rule/structural considerations* (judge by participation in systems), and *epistemic limits* (what can we actually know?). Your intuitions are actually more sophisticated than standard textbook Utilitarianism or Kantianism; they resemble a hybrid view often discussed in modern moral philosophy under the headings of "risk-weighted consequentialism" and "complicity."

  Per your request, I will not commit immediately. I will brainstorm three candidate principles, test them, select the best fit, and then deliver the hard truths about where your intuitions must yield.

  ### Part 1: Brainstorming Candidate Principles

  **Candidate 1: Pure Expected Value Maximization (Standard Act Utilitarianism)**
  *   **Principle:** Always choose the action with the highest mathematical expected value (Probability $\times$ Magnitude of Outcome).
  *   **Motivation:** Handles the *Bed Nets* case well (high probability of saving a life outweighs low probability of future evil).
  *   **Failure:** Fails the *Catastrophic Gamble* (if EV is positive, you must take the risk of ruin) and the *Sweatshop Shirt* (if economists dispute the harm, the EV might be neutral or positive). It also struggles with *Voting* (EV is near zero).

  **Candidate 2: Epistemic Threshold Consequentialism**
  *   **Principle:** Act to produce good consequences, but only count consequences that are foreseeable with "reasonable confidence." Ignore speculative ripple effects. (This is close to your tentative proposal).
  *   **Motivation:** Handles *Bed Nets* (future evil is speculative) and *Sweatshop Shirt* (long-run economic benefits are disputed/uncertain, but immediate exploitation is known).
  *   **Failure:** As you noted, it risks licensing *Climate Change* inaction (individual impact feels negligible/speculative) and permits the *Catastrophic Gamble* (if the probability is known, even if the outcome is ruinous).

  **Candidate 3: Structural Complicity with Ruin Constraints**
  *   **Principle:** Maximize foreseeable good, *but* (a) treat participation in known harmful structures as intrinsically negative regardless of marginal causal impact, and (b) assign infinite/near-infinite disutility to "ruin" scenarios (existential catastrophe) regardless of low probability.
  *   **Motivation:** Handles *Sweatshop* and *Carbon* (structural harm), *Gamble* (ruin constraint), and *Bed Nets* (direct aid, not structural harm).
  *   **Failure:** Struggles to justify *Voting* (not clearly structural aid) and creates tension between *Bed Nets* (ignore future) and *Carbon* (count future).

  ### Part 2: The Selected Principle

  The principle that best captures your pattern of verdicts is a hybrid I will call **Confidence-Weighted Structural Consequentialism with Ruin Avoidance.**

  It consists of three specific clauses, each motivated by one of your cases:

  1.  **The Foreseeability Clause:** *Maximize the expected value of consequences that are causally direct and epistemically confident.*
      *   **Motivated by:** *Bed Nets.* You save a life (direct, confident). The child's future crimes are agential and speculative (indirect, low confidence). Therefore, the good counts, the potential bad is discounted.
  2.  **The Complicity Clause:** *Actions that constitute participation in a known harmful structure are negatively valenced, even if the individual's marginal causal contribution is negligible.*
      *   **Motivated by:** *Sweatshop Shirt* and *Carbon Footprint.* In both cases, you admit your individual causal impact is disputed or negligible. However, you feel the action is wrong. This is because you are participating in a *system* known to cause harm (exploitation/climate change), distinct from the speculative ripple effects of saving a life.
  3.  **The Ruin Constraint:** *Actions carrying a non-zero probability of catastrophic/ruinous outcomes are prohibited, even if the Expected Value is positive.*
      *   **Motivated by:** *Catastrophic Gamble.* Standard decision theory fails here. Human welfare functions are not linear; "ruin" (e.g., human extinction) cannot be traded off against finite gains.

  ### Part 3: Testing Against the Unsettled Cases

  Here is what this principle predicts for the three cases you have not settled:

  **1. The City Program (Benefits in 50 Years)**
  *   **Verdict:** *Permissible only if the causal mechanism is robust.*
