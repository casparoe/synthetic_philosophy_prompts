answer: |-
  # Tutorial Quiz: What Kind of Probabilist Are You?

  **Instructions:**
  This quiz consists of nine scenarios. For each, select the option that best matches your intuition about what is *true* in that situation. Do not worry about technical terms; focus on what you think the world is actually like in these cases. There are no "correct" answers, only different philosophical commitments.

  ---

  ### 1. The Unflipped Coin
  A coin is minted with a specific physical asymmetry that would make it land heads 60% of the time *if* flipped. However, the coin is placed in a museum vault immediately and will never be flipped.
  *   **A.** It is false to say this coin has a 60% probability of heads. Probability requires actual events.
  *   **B.** The coin has a 60% probability of heads because of its physical disposition, even if never exercised.
  *   **C.** The probability is 60% only relative to a hypothetical infinite sequence of similar coins, not this specific object.

  ### 2. The Decayed Atom
  A specific radioactive atom decayed at exactly 12:00 PM. At 11:00 AM, before it decayed, what was the probability that it would decay within the hour?
  *   **A.** The probability was 1 (or 0), because the outcome was already fixed by the prior state of the universe.
  *   **B.** The probability was less than 1 (e.g., 0.5), because the physical situation was genuinely indeterministic.
  *   **C.** The probability was less than 1, but this just measures our ignorance of the determining factors, not a feature of the atom.

  ### 3. The Raven's DNA
  You have a specific raven in front of you. You have sequenced its entire genome and know all relevant environmental factors. The genetics determine its feather color with 100% physical necessity. What is the probability that this raven is black?
  *   **A.** 1 or 0. Given the complete physical description, the outcome is certain.
  *   **B.** High, but not 1. There is always a residual physical chance of mutation or external interference.
  *   **C.** It depends on what information *you* have. If you know the DNA, it's 1. If you only know it's a raven, it's high but less than 1.

  ### 4. The Random Number
  What is the probability that a "randomly chosen" natural number is prime? (Note: As numbers get larger, primes become rarer. The limiting frequency of primes among natural numbers is zero).
  *   **A.** Zero. The proportion of primes approaches zero as the set of numbers approaches infinity.
  *   **B.** The question is meaningless. There is no physical process to "choose randomly" from an infinite set.
  *   **C.** There is a definite logical probability based on the mathematical relations, regardless of frequency.

  ### 5. The Election That Wasn't
  A popular candidate died the week before an election. The election was cancelled. What is the probability that the candidate *would have* won?
  *   **A.** There is no probability. The event never happened, and no relevant reference class of "cancelled elections" exists.
  *   **B.** There is a fact of the matter based on the disposition of the voters at that time.
  *   **C.** There is no fact of the matter about the "chance," only a fact about how confident we are justified in being that they would have won.

  ### 6. The Smoker's Risk
  Consider a specific 45-year-old male smoker. We can calculate his risk of lung cancer based on "all 45-year-old males," "all smokers," or "all 45-year-old male smokers with his genetic profile." These groups yield different probabilities.
  *   **A.** We must use the narrowest class possible (his specific genetic profile). That is the true probability.
  *   **B.** We must use the broadest reliable class (all smokers). Single-case specifics introduce noise.
  *   **C.** There is no single "true" probability. The chance is real, but it is relative to which classification we choose to ask about.

  ### 7. The Laplacian Demon
  Imagine a world that is completely deterministic. If you knew the position and momentum of every particle, you could predict the future with 100% accuracy. Are there any objective chances in this world?
  *   **A.** No. If the future is fixed, chance is an illusion.
  *   **B.** Yes. Even in a deterministic world, probabilistic laws might be the best way to summarize the history of the world.
  *   **C.** Yes, but only as a measure of human ignorance, not as a feature of the world.

  ### 8. The Principal Principle
  Suppose you know for a fact that the objective chance of an event is 0.3. You have no other relevant information. What should your personal degree of belief (credence) be?
  *   **A.** Exactly 0.3. Rationality requires your belief to match the known chance.
  *   **B.** Not necessarily 0.3. My belief is my own mental state; the chance is a feature of the world. They can come apart.
  *   **C.** The premise is flawed. There is no "objective chance" to know, only my credence which should be 0.3 based on the evidence.

  ### 9. The Symmetric Die
  You are given a die that is physically perfectly symmetric. You have never seen it rolled. What is the probability it will land on 1?
  *   **A.** 1/6. The physical symmetry dictates this logical probability before any rolls occur.
  *   **B.** Undefined. Until we see it rolled (or know the frequency of similar dice), we cannot assign a number.
  *   **C.** 1/6 represents my state of indifference, not a fact about the die.

  ---

  ## Scoring Key & Interpretation

  *For the TA: Tally the student's answers. While few students will match a profile perfectly, the dominant pattern indicates their intuitive commitment. Below are the "Pure Type" answer keys.*

  | Position | Q1 (Coin) | Q2 (Atom) | Q3 (Raven) | Q4 (Number) | Q5 (Election) | Q6 (Smoker) | Q7 (Determinism) | Q8 (Credence) | Q9 (Die) |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Actual Freq.** | A | A | A | A | A | B | A | C | B |
  | **Hypothetical Freq.** | C | B | A | A | C | B | A | A | B |
  | **Propensity** | B | B | B | B | B | A | A | A | A |
  | **Subjectivist** | C | C | C | C | C | C | C | C | C |
  | **Obj. Bayesian** | B | B | C | C | C | C | C | A | A |
  | **Humean Best-System** | B | B | B | B | B | A | **B** | A | A |
  | **Deflationary** | C | C | C | C | C | C | C | **C** | C |
  | **Ref. Class Perspect.**| B | B | B | B | B | **C** | A/B | A | A |

  ### Position Descriptions for Feedback

  1.  **Actual-Frequency Frequentism:** Probability *is* the observed relative frequency. If there are no trials (Q1), there is no probability. If the event is past/fixed (Q2, Q3), probability is 0 or 1. Determinism kills chance (Q7).
  2.  **Hypothetical/Long-Run Frequentism (von Mises):** Probability requires a "collective" (infinite sequence). Single cases have probability only derivatively (Q1-C). Counterfactuals are tricky (Q5-C). Determinism usually rules out genuine collectives (Q7-A).
  3.  **Single-Case Propensity:** Probability is a physical disposition of the specific object (Q1-B). Requires indeterminism (Q2-B, Q7-A). The narrowest physical description gives the true chance (Q6-A).
  4.  **Personalist Subjectivism (de Finetti):** Probability is always degree of belief. "Objective chance" is shorthand for idealized belief (Q8-C). Compatible with determinism (Q7-C). All single-case probs are coherent credences (Q1-C).
  5.  **Objective Bayesian / Logical:** Probability is a logical relation between evidence and hypothesis. Symmetry/Math yields definite values without frequencies (Q4-C, Q9-A).
  6.  **Humean Best-System Chance (Lewis):** Chances are the probabilities entailed by the best systematization (simplicity + strength) of the actual history. Compatible with determinism if probabilistic laws summarize best (Q7-B). Single cases have chances via the laws (Q1-B).
  7.  **Deflationary / Eliminativist:** There are no chances in the world. There are only credences and norms for updating them (Q8-C). Talk of "chance" is useful fiction.
  8.  **Reference Class Perspectivism:** (Your "half-defended" view). Chances are real physical features, but they are inherently relative to a reference class description. There is no "God's eye" narrowest class (Q6-C).

  ---

  ## TA's Guide to Ambiguity & "Uninhabited" Territory

  **1. Positions this quiz cannot easily separate:**
  *   **Subjectivism vs. Deflationary:** Both reduce chance talk to credence talk. The distinction is often metaphysical (is 'chance' a useful fiction or just synonymous with 'credence'?) rather than practical. Look at **Q8**: A Deflationist rejects the premise ("There is no objective chance to know"), while a Subjectivist might accept it as shorthand for "ideal credence."
  *   **Propensity vs. Humean:** Both allow single-case chances (Q1-B) and agree on the Principal Principle (Q8-A). The main splitter is **Q7 (Determinism)**. Propensity theorists usually deny chances in deterministic worlds; Humeans allow them. If a student answers B to Q1 but A to Q7, they are likely a Propensity theorist. If they answer B to both, they are likely Humean.

  **2. Uninhabited or Unstable Combinations:**
  *   **The "Deterministic Propensity" (Q1-B + Q7-A is standard, but Q1-B + Q7-B is rare for Propensity):** It is very uncommon to find a *Propensity* realist who believes in chances in a deterministic world. Propensity is usually tied to causal powers which require indeterminism. If a student marks **Propensity** on Q1/Q2 but **Humean** on Q7, they may be conflating physical disposition with Humean law.
  *   **The "Actual Frequentist Counterfactual" (Q1-A + Q5-B):** This combination is logically unstable. If you believe probability requires *actual* frequencies (Q1-A), you cannot consistently believe in probabilities for events that *never happened* (Q5-B). Students who pick this often haven't thought through the implications of "actual" vs. "hypothetical."
  *   **The "Logical Frequentist" (Q4-A + Q4-C):** Students sometimes want to say the probability of a prime number is 0 (frequency) *and* that it's a logical relation. This quiz forces a choice. In the literature, Logical Probabilists reject the frequency answer for mathematical truths because there is no "random process."

  **3. Note on Reference Class Perspectivism:**
  This view (Q6-C) is distinct from Subjectivism. A Subjectivist says the probability varies because *knowledge* varies. A Perspectivist says the probability varies because *the chance itself* is relative to the classification, even if everyone agrees on the facts. It is a form of realism about chance, but denies there is a "fundamental" level of chance. This view is rarely named in introductory texts (sometimes called "Relativistic Chance" or "Contextualist Chance"), which is why I have labeled it **Reference Class Perspectivism** for the purpose of this unit. It is a viable middle ground between hard Propensity Realism and Anti-Realism.

  **4. Scoring Advice:**
  If a student's answers are scattered (e.g., Propensity on Q1, Frequentist on Q4, Subjectivist on Q8), they likely hold an **eclectic** or **pragmatist** view. This is common! You can tell them: "You are a Methodological Pluralist. You think different interpretations work for different domains (e.g., Frequencies for demographics, Propensities for physics, Credences for elections)." This is often a more defensible position than strict adherence to one school.
