answer: |-
  The move is a regulative maxim of reflective judgment necessitated by reason's need for systematic unity, rather than a constitutive claim about ontological reality or a disguised theological providence.

  To see why, we must weigh this against two rival readings often tempted by this text. The first is a dogmatic metaphysical reading: Kant is claiming Nature *actually* possesses a hidden teleological agency akin to divine providence. The second is a fictionalist or pragmatic reading: Kant knows history is chaotic nonsense but argues we should pretend it has a plan to feel better. Both fail. The dogmatic reading violates the Critical restriction on knowledge of supersensible objects (treating "Nature" as a causal agent with intentions), while the fictionalist reading undermines the serious cognitive claim Kant makes about the "destiny" of capacities. The text supports the regulative reading because Kant phrases the move as a heuristic attempt ("try to see if he can discover"), signaling that the "natural purpose" is a lens imposed by the philosopher to make the manifold of history cognizable, not a property found within the objects themselves. This anticipates the *Critique of Judgment*'s account of purposiveness without purpose: the "expedient" is not an inference from effect to cause, but a presupposition required for the systematic investigation of human actions when determinant judgment fails.

  Regarding the indignation and the "idiotic" course of things, the chaos is not merely rhetorical seasoning but a transcendental condition for this specific teleology. If individual actions displayed conscious rational purpose on the macro scale, history would be a matter of empirical psychology and biography, requiring no philosophical "Idea." The "indignation" marks the limit of empirical observation; it is the affective signal that determinant judgment has exhausted its resources. Kant needs the history to look "idiotic" at the level of individual agency so that the unity he posits cannot be located in human freedom or conscious design. This preserves the Critical distinction: the plan belongs to "Nature" (understood critically as the mechanism of inclinations and external constraints), not to human will or divine intervention. If the history appeared less chaotic, the need for a regulative idea would vanish, and the teleology would collapse into empirical generalization or theological dogma.

  Finally, the principle that "all natural capacities are destined to develop completely" functions as a regulative standard for judgment rather than an empirical prediction or an explanatory law of causation. It does explanatory work only insofar as it organizes disparate historical events into a coherent narrative of progress, allowing us to distinguish significant epochs from noise. If treated empirically, the principle is falsifiable (humanity could extinguish itself); if treated as constitutive, it violates the bounds of sense. As a regulative principle, it guides inquiry without claiming knowledge of the outcome. This safeguards the distinction from theodicy: Kant is not justifying evil or claiming providence ensures moral justice, but rather providing a framework wherein the mechanical workings of nature (even folly and malice) can be judged as contributing to the development of reason in the species. The "natural purpose" is thus a methodological tool for viewing history *cosmopolitically*, allowing reason to hope for progress without asserting knowledge of God's plan.
