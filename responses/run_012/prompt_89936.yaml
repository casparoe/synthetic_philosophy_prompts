answer: |-
  **MEMORANDUM**

  **TO:** All Personnel
  **FROM:** Director of Communication Integrity
  **SUBJECT:** Implementation of Communication Integrity Policy v4.0
  **DATE:** October 24, 2023

  Attached please find the revised Communication Integrity Policy. This document formalizes the firm's adoption of the received teaching on veracity. Previous iterations allowed for consequentialist exceptions regarding client retention and regulatory mitigation; these are no longer permitted. Compliance is mandatory. Employees are expected to read the definition of violation carefully, as it pertains to internal states rather than external accuracy. Acknowledgement of receipt is required by Friday.

  ***

  **POLICY NUMBER:** CI-404
  **TITLE:** COMMUNICATION INTEGRITY POLICY
  **EFFECTIVE:** IMMEDIATELY

  *"How then by a lie shall I rightly be able to prosecute lies?"*

  **1.0 PURPOSE AND SCOPE**
  This policy establishes the absolute prohibition of falsehood within firm operations. The integrity of the firm rests on the alignment of utterance and thought. This prohibition is not based on the potential harm of a false statement but on the structural disorder of the statement itself. Consequently, no operational necessity, financial pressure, or legal threat constitutes a valid exception.

  **2.0 DEFINITION OF VIOLATION**
  A violation occurs when an employee utters a statement contrary to what they hold in mind, with the intention of deceiving the listener. External accuracy is secondary to internal alignment.
  2.1 **Good-Faith Error:** An employee who utters a false statement believing it to be true has not violated this policy. Documentation of data sources may be required to demonstrate good faith.
  2.2 **Accidental Truth:** An employee who utters a true statement while believing it to be false has violated this policy. The mismatch between mind and utterance constitutes the lie, regardless of factual correspondence. Employees unsure of a fact's veracity must decline to speak rather than risk asserting what they believe to be false.
  2.3 **Intent:** The intention to deceive is required. Statements made without expectation of belief are excluded (see 3.2).

  **3.0 PERMISSIBLE EVASIONS AND EXCLUSIONS**
  3.1 **Concealment:** Employees may decline to answer, state that they cannot answer, or change the subject. Active misdirection intended to create a false belief in the listener is prohibited. Silence is permissible; misleading silence is not.
  3.2 **Figurative Speech:** Jokes, hyperbole, and established figures of speech are exempt, as they carry no intent to deceive regarding factual states. Sarcasm is permitted only where tone clearly negates literal intent.
  3.3 **Administrative Review:** Adjudication of violations under Section 2.2 requires inquiry into the employee's internal state at the time of utterance. Employees must cooperate with interviews regarding their belief states during the relevant period.

  **4.0 OPERATIONAL CONSTRAINTS**
  4.1 **Undercover Operations:** The Security Department frequently requests authorization for staff to pose as members of outside groups to expose wrongdoing. Such requests are denied. A lie cannot be used to prosecute lies. The firm accepts the increased risk of undetected internal fraud as the cost of compliance.
  4.2 **Legal and Professional Compulsion:** Employees compelled by legal counsel, regulatory bodies, or professional standards to utter statements contrary to their internal knowledge must refuse the compulsion. Employees are expected to accept the personal and professional consequences of refusal, including fines or contempt proceedings. The firm will provide counsel but will not indemnify penalties resulting from truthful refusal.

  **5.0 PRECEDENT AND INTERPRETATION**
  5.1 **Ambiguous Precedents:** The tradition contains records of respected figures who staged public rebukes of colleagues for the audience's benefit, rather than out of genuine grievance. Some interpretations excuse this as pedagogical fiction; others condemn it as deceptive performance.
  5.2 **Firm Position:** Given the ambiguity, such actions are prohibited within the firm. Employees may not stage disagreements or feign ignorance for instructional or strategic effect. The risk of modeling deception outweighs the pedagogical benefit.

  **6.0 SANCTIONS**
  All violations are subject to disciplinary action. The tier of the violation determines the severity of the sanction, not the permissibility of the act. No tier grants permission. See Appendix A for the Schedule of Violations.

  ***

  **APPENDIX A: SCHEDULE OF VIOLATIONS BY TIER**

  **TIER 1: DOCTRINAL FALSEHOOD**
  *Definition:* Falsehoods regarding religious teaching or ultimate truths.
  *Sanction:* Immediate termination. Referral to relevant professional bodies.

  **TIER 2: MALICIOUS FALSEHOOD**
  *Definition:* Falsehoods intended to harm an innocent party or subvert justice.
  *Sanction:* Immediate termination. Potential legal referral.

  **TIER 3: INSTITUTIONAL FALSEHOOD**
  *Definition:* Falsehoods regarding firm solvency, safety data, or compliance status.
  *Sanction:* Termination.

  **TIER 4: PERSONAL GAIN**
  *Definition:* Falsehoods told to secure promotion, compensation, or advantage.
  *Sanction:* Suspension without pay. Demotion.

  **TIER 5: SOCIAL CONVENIENCE**
  *Definition:* Falsehoods told to spare feelings or avoid awkwardness where no harm is imminent.
  *Sanction:* Written warning. Mandatory ethics retraining.

  **TIER 6: PROTECTIVE FALSEHOOD (PROPERTY)**
  *Definition:* Falsehoods told to protect property or financial interests where no physical harm is involved.
  *Sanction:* Written warning.

  **TIER 7: PROTECTIVE FALSEHOOD (PHYSICAL)**
  *Definition:* Falsehoods told to protect a person from physical harm or violation.
  *Sanction:* Formal reprimand. Note: While the harm averted may be severe, the violation remains recorded.

  **TIER 8: PROTECTIVE FALSEHOOD (CHASTITY)**
  *Definition:* Falsehoods told specifically to protect someone's chastity.
  *Sanction:* Formal reprimand. This represents the lowest gravity of violation but retains the status of a prohibited act.

  **NOTE ON TIER ADJUDICATION:**
  Employees may not appeal a sanction by arguing that a lower-tier lie prevented a greater harm. The hierarchy determines penalty severity, not moral licitness. A Tier 1 lie is not permitted even to prevent a Tier 2 harm. The integrity of the speaker is prioritized over the outcome of the speech.
