      *   **Requirements:**
          *   Think carefully and lay out commitments (internally, though the output should be continuous prose).
          *   Adjudicate move by move (sound, mistaken, overlooking something, overstated).
          *   Provide a verdict on the underlying question (does evolutionary history give reason to doubt moral realism, and how much?).
          *   **Format:** Continuous prose, no headings, no bullet points, no bold text, no tables. Like a long letter to a colleague.

  2.  **Deconstruct the Debate (The Six Moves):**
      *   *Move 1 (Colleague A - The Debunker):* Standard EDA. Moral beliefs are products of selection for fitness/cooperation, not truth. Process is insensitive (would produce same beliefs even if moral facts were different/non-existent). Insensitivity undermines justification.
      *   *Move 2 (Colleague B - The Defender):* Third-factor or convergence reply. Moral truths might *be* what makes cooperation adaptive. If "cooperation is good" is true, and selection favored cooperation, selection tracked the truth.
      *   *Move 3 (Colleague A):* Circularity/Scope objection. Assumes "survival is good" (substantive premise). Even if granted, only covers thin core (cooperation), not rich morality (rights, distributive justice, etc.).
      *   *Move 4 (Colleague B):* Global skepticism objection. Perception/logic also evolved. If EDA kills morality, it kills everything (self-defeating or too broad).
      *   *Move 5 (Colleague A):* Disanalogy. Perception has causal feedback (objects cause beliefs). Moral properties are causally inert (no feedback loop).
      *   *Move 6 (Colleague B):* Epistemological objection. Causal inertness $\neq$ untrackable. Demanding causal connection begs the question against non-naturalist realism (which denies causal efficacy of moral facts).

  3.  **Analyze the Philosophical Commitments:**
      *   *Colleague A (Debunker):* Committed to the Insensitivity Principle (if a belief is held regardless of its truth, it's unjustified). Committed to a causal constraint on knowledge (or at least a strong disanalogy between moral and empirical domains). Likely a moral skeptic or error theorist, or at least thinks realism is epistemically precarious.
      *   *Colleague B (Defender):* Committed to Moral Realism (likely non-naturalist given the inertness point). Committed to the possibility of non-causal tracking (conceptual connection or third-factor). Wants to avoid global skepticism.

  4.  **Evaluate Each Move (Mental Draft):**
      *   *Move 1:* Strong premise. The "insensitivity" claim is the heart of the EDA (Street, Joyce). It's sound *if* one accepts the evolutionary genealogy is independent of truth.
      *   *Move 2:* This is the "Third Factor" move (Enoch, Wielenberg). It's a standard reply. Is it sound? It depends on whether the moral fact *explains* the adaptive value. It risks circularity if used to justify the belief in that moral fact.
      *   *Move 3:* Strong point. Even if "survival is good" links evolution to truth, it doesn't get us to "slavery is wrong" or "progressive taxation is just." It limits the scope of vindication. Also, assuming survival is good is indeed a moral premise.
      *   *Move 4:* The "Global Skepticism" or "Self-Defeat" argument. It's a powerful pragmatic point, but logically, EDAs often claim morality is special. If A can show a relevant difference, this fails.
      *   *Move 5:* The "Causal Constraint" argument. This is the crux. Non-naturalists deny moral facts are causal. If knowledge requires causal contact, realism dies. But does knowledge require causal contact? (Math is the counterexample).
      *   *Move 6:* The "Question-Begging" charge. B is right that demanding causality assumes naturalism. However, A needs *some* explanation of the link. If facts are inert, how do we track them?

  5.  **Synthesize the Adjudication:**
      *   The debate is a classic instantiation of the Street/Joyce vs. Enoch/Wielenberg dialectic.
      *   Move 1 is the strongest starting point for the skeptic.
      *   Move 2 is plausible but limited (as Move 3 notes).
      *   Move 3 is very strong; it concedes too little ground to save realism.
      *   Move 4 is a bit of a deflection unless the skeptic claims *all* beliefs are debunked (which they usually don't).
      *   Move 5 is the skeptic's best theoretical defense, distinguishing math/morality from perception.
      *   Move 6 is the realist's best meta-epistemological defense, challenging the causal requirement.
      *   *Verdict:* The EDA creates a significant explanatory burden for the realist but doesn't decisively refute realism. It pushes realism toward a specific kind of epistemology (non-causal tracking) which is costly but not impossible. The "how much" part: it undermines confidence in specific, complex norms more than abstract core values.

