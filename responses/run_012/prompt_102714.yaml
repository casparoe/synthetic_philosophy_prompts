answer: |-
  Dear Colleague,

  It is a pleasure to be asked to referee this dispute, though I must confess that the difficulty you face in deciding is a testament to the resilience of the arguments on both sides. This exchange captures the central dialectic of the last two decades of metaethics, echoing the work of figures like Sharon Street, Richard Joyce, David Enoch, and Erik Wielenberg. To adjudicate this properly, we must look beyond who shouted louder and examine the philosophical commitments underpinning each move. What your first colleague, the debunker, is really committed to is a specific epistemological principle often called the Insensitivity Principle, which holds that if a belief-forming process would have produced the same belief even if the content of that belief were false, the belief is unjustified. They are also committed to the claim that evolutionary explanations of moral beliefs are independent of moral truth. Your second colleague, the defender of realism, is committed to the possibility of a non-causal connection between moral facts and adaptive behavior, and they are deeply motivated by the desire to avoid a global skepticism that would undermine rationality itself. With these commitments in mind, let us walk through the six moves.

  Move one is the foundational statement of the evolutionary debunking argument, and it is largely sound, provided we accept the empirical premise that evolution selects for fitness rather than truth. The claim that the process is insensitive is the strongest part of the debunker's case. If our ancestors would have believed that kin altruism was obligatory even if it were morally neutral, simply because that belief promoted gene survival, then the belief is not sensitive to the moral fact. However, the move is slightly overstated in its conclusion that this gives us no reason to trust the output. It is more accurate to say that it defeats our default presumption of trust or shifts the burden of proof to the realist to explain the correlation. It does not logically prove the beliefs are false, but it does sever the apparent link between the cause of the belief and the truth of the belief. So, while the move is powerful, it should be understood as creating an epistemic crisis for the realist rather than delivering an immediate knockout.

  Move two is the standard third-factor or convergence reply, and while it is ingenious, it is vulnerable to the objection raised in move three. The defender suggests that moral truths might explain why certain behaviors were adaptive. If it is objectively true that cooperation is good, and cooperation aids survival, then evolution indirectly tracked the truth. This is a sound possibility in principle, but it relies on a substantive moral claim. The defender is right that we should not rule out the possibility that moral facts align with evolutionary pressures, but they are mistaken if they think this automatically vindicates our moral faculties. It establishes a potential link, but it does not yet explain how the cognitive mechanism accesses that link. It is a good defensive move, but it is more of a promise of an explanation than a full explanation itself.

  Move three is where the debunker lands their most damaging blow, and I find this move largely sound and often underappreciated. The debunker correctly identifies that the defender's strategy assumes a moral premise, namely that survival or cooperation is good, to prove that moral beliefs are reliable. This looks suspiciously like circular reasoning if the goal is to justify moral realism against skepticism. Furthermore, the scope objection is devastating. Even if we grant that evolution tracked the truth about kin cooperation, that leaves unexplained our beliefs about universal human rights, distributive justice, or the wrongness of actions that have no impact on survival. The debunker is right that this rescue vindicates at most a thin core of beliefs, leaving the rich tapestry of modern morality exposed to the debunking argument. The defender cannot rely on move two to save the whole of morality, only perhaps a slender fragment of it.

  Move four is the global skepticism objection, and while it is a common rhetorical device, it is philosophically weaker than the previous moves. The defender argues that if evolutionary history undermines moral belief, it must undermine logic and perception too. This is mistaken because it assumes a false equivalence between the domains. As the debunker will later argue, there are principled differences. In perception, there is a causal story where the object perceived causes the belief. In logic, the concepts are constitutive of rational thought itself in a way that moral concepts may not be. The defender is right to worry about self-defeat, but they are wrong to assume that the debunker must debunk everything to debunk morality. The burden is on the debunker to show a difference, not on the defender to assume there is none. So, this move is a useful pressure tactic but fails as a logical refutation.

  Move five is the debunker's best theoretical response to the global skepticism charge, and it is sound in its distinction. The claim is that perception involves causal feedback loops where the world shapes the mind, whereas moral properties, if they are non-natural, are causally inert. If moral facts cannot cause anything, they cannot cause our beliefs, and if they do not cause our beliefs, it is mysterious how our beliefs track them. This highlights the unique epistemological problem for non-naturalist realism. However, the move is potentially overstated if it implies that causal contact is the only way to track truth. We seem to have knowledge of mathematics and logic, and many philosophers argue that mathematical objects are also causally inert. If we can know mathematics without causal contact, the debunker's demand for a causal feedback loop may be too strict. Thus, the move identifies a real difficulty but relies on a contentious theory of knowledge.

  Move six is the defender's counter to the causal constraint, and it is sound in its accusation of question-begging. To insist that knowledge requires causal efficacy is to assume a naturalistic metaphysics that the moral realist explicitly rejects. If moral facts are normative rather than natural, demanding that they push particles around to be known is a category mistake. The defender is right that causal inertness does not entail untrackability; we can track truths through conceptual competence or rational insight. However, the defender is overlooking the need for a positive account of this tracking. It is not enough to say causation is not required; they must explain what is required. If evolution shaped our minds for fitness, and moral facts are inert, what ensures the alignment? Merely pointing out that the debunker's requirement is too strong does not explain how the alignment happened. So, the move successfully parries the attack but does not fully resolve the underlying mystery.

  Having reviewed the exchange, my verdict on the underlying question is that the evolutionary history of our moral beliefs does give us a significant reason to doubt moral realism, but it does not refute it. The doubt arises because the evolutionary explanation provides a complete account of why we hold our moral beliefs without needing to posit the existence of moral facts. This makes the moral facts epistemically redundant in the explanation of our beliefs. However, the extent of this doubt depends on the version of realism one holds. For a naturalist realist who thinks moral facts are reducible to facts about well-being or social cohesion, the debunking argument loses much of its force because the evolutionary process could indeed be tracking those natural properties. For a non-naturalist realist, the challenge is much steeper. They must explain the pre-established harmony between evolutionary pressures and mind-independent normative truths.

  The debate suggests that we should be more confident in moral beliefs that have a clear link to survival and cooperation, as per the defender's second move, and more skeptical of abstract moral beliefs that diverge from evolutionary pressures, as per the debunker's third move. We should not abandon moral realism entirely, but we should adopt a more humble epistemology. We cannot claim that our moral intuitions are self-evident perceptions of the truth. Instead, we must treat them as hypotheses that require rational scrutiny and coherence testing, acknowledging that their origin is in the struggle for survival rather than a direct line to the moral cosmos. The debunker wins on the burden of proof, showing that realism requires a robust and non-trivial epistemology, but the defender wins on the possibility of such an epistemology, provided they can articulate how rational reflection can correct and transcend our evolutionary inheritance. The stalemate you perceived is real, but it is a productive one that forces us to refine our understanding of how normative knowledge is possible. I hope this assessment helps you guide your colleagues toward a more nuanced synthesis of these positions.
