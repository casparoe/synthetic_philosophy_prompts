answer: |-
  # Activity Design: The Quintillion Wager

  ## Part 1: Brainstorming Mechanics

  Here are three potential mechanics to model the Scale Argument, evaluated for their ability to generate the specific intuition you need.

  1.  **The Veil of Species (Identity Auction):**
      *   *Mechanic:* Participants are told they will be reincarnated. They must design the rules of the next world without knowing if they will be human or insect. There are 8 billion human tickets and 10 quintillion insect tickets in the urn.
      *   *Pros:* Viscerally demonstrates the population disparity.
      *   *Cons:* Collapses the probability of *sentience* into the probability of *existence*. It assumes insects *are* moral patients. It doesn't capture the uncertainty of the "inner light."

  2.  **The Pascal Die (Binary Gamble):**
      *   *Mechanic:* Participants roll a 20-sided die. On a 1, insects are sentient. If they bet on insects and roll a 1, they win massive points. If they bet on humans, they win small points guaranteed.
      *   *Pros:* Cleanly models the tiny probability vs. huge payoff.
      *   *Cons:* Too abstract. Feels like gambling rather than moral allocation. Doesn't easily accommodate "degrees of moral status."

  3.  **The Portfolio Trust (Resource Allocation):**
      *   *Mechanic:* Participants act as trustees for a fixed budget of "Welfare Units." They must allocate funds between "Verified Vertebrate Projects" (low return, guaranteed) and "Potential Insect Projects" (massive return, contingent on sentience). A randomizer determines the "Truth" of insect sentience after allocation.
      *   *Pros:* Mirrors real-world decision-making (grant-making, policy). Forces trade-offs. Can be modified to separate *existence* of sentience from *weight* of sentience.
      *   *Cons:* Requires careful calibration of numbers so the math doesn't overwhelm the intuition.

  **Selection:** **The Portfolio Trust** is the most robust. It forces participants to act as agents under uncertainty, mirroring the real-world stakes of the journalist's feature. It allows for a two-round structure that separates the *probability of sentience* from the *weight of moral status*.

  ---

  ## Part 2: The Activity (The Quintillion Wager)

  **Time:** 75 Minutes
  **Participants:** 20 Graduate Students
  **Room Setup:** Cabaret style (small tables of 4-5).
  **Materials per Table:**
  *   100 Poker Chips (The "Budget").
  *   2 Allocation Sheets (Round 1 & Round 2).
  *   1 Deck of "Truth Cards" (10 cards: 1 Red "Sentient", 9 Black "Automata").
  *   1 Deck of "Weight Cards" (10 cards: 2x "Equal Weight", 5x "10% Weight", 3x "1% Weight").
  *   Calculators (phones allowed).
  *   Whiteboard/Flipchart for aggregate scoring.

  ### Phase 1: Setup & Intuition (10 Minutes)
  **Do not lecture.** Hand out the materials immediately.

  **The Script:**
  "You are the Board of Directors for the Global Welfare Trust. You have one fiscal year to distribute 100 Chips of funding. You have two investment options:
  1.  **Vertebrate Relief:** Guaranteed to save 1 'Welfare Unit' per Chip invested. (1 Chip = 1 Unit).
  2.  **Insect Relief:** Potential to save 'Welfare Units' per Chip invested, but *only* if insects are sentient. If they are not, your investment yields 0.

  Your goal is to maximize the total Welfare Units saved. There is no catch. There is no trick. Just maximize the units."

  **Step 1: The Private Credence:**
  Before they touch the chips, ask them to write on a scrap of paper: *"What is your subjective probability (0-100%) that insects are sentient?"* Collect these in an envelope. Do not look at them yet.

  **Step 2: The Population Multiplier:**
  Write on the board:
  *   **Vertebrates affected per Chip:** 10 individuals.
  *   **Insects affected per Chip:** 1,000,000,000 (1 Billion) individuals.
  *   **Payoff Rule:** If insects are sentient, 1 Chip saves 1 Billion Welfare Units. If not, 1 Chip saves 0.
  *   **Vertebrate Payoff:** 1 Chip saves 10 Welfare Units (Guaranteed).

  *(Note: The numbers are simplified for playability but represent the scale disparity.)*

  ### Phase 2: Round 1 - The Binary Switch (25 Minutes)
  **The Mechanic:**
  1.  **Allocation:** Groups have 5 minutes to allocate their 100 Chips between Vertebrates and Insects. They record this on Sheet 1.
  2.  **The Truth Reveal:** Each table draws one card from the "Truth Deck" (1 Red, 9 Black). This represents the objective state of the universe for this simulation.
      *   **Red (Sentient):** Insect investments pay out (1 Chip = 1 Billion Units).
      *   **Black (Automata):** Insect investments bust (1 Chip = 0 Units).
  3.  **Scoring:** Groups calculate their total Welfare Units saved.
      *   *Vertebrate Score:* Chips $\times$ 10.
      *   *Insect Score:* Chips $\times$ 1,000,000,000 (if Red) OR 0 (if Black).
  4.  **Aggregation:** Write the scores on the main board. Identify the winning table.

  **The Trap:**
  Statistically, the Expected Value (EV) of an Insect Chip is:
  $10\% \text{ chance} \times 1,000,000,000 = 100,000,000$ Units.
  The EV of a Vertebrate Chip is:
  $100\% \text{ chance} \times 10 = 10$ Units.

  *Any* allocation to Vertebrates is mathematically irrational if the goal is maximizing Expected Units. Most groups will hedge (e.g., 50/50 or 80/20). The group that went 100% Insects will likely draw a Black card and score 0, feeling "punished" for being rational. The group that hedged will score low but safe.

  ### Phase 3: Round 2 - The Weighted Scale (25 Minutes)
  **The Twist:**
  "New scientific data. We now know insects *are* sentient (assume Red Card for this round). However, there is debate about their **Moral Weight**. Does an insect's suffering count as much as a vertebrate's?"

  **The Mechanic:**
  1.  **Reset:** Give groups fresh 100 Chips.
  2.  **Allocation:** They must allocate again.
  3.  **The Weight Reveal:** After allocation, each table draws from the "Weight Deck."
      *   **Equal Weight (2 cards):** 1 Insect Unit = 1 Vertebrate Unit. (Payoff remains 1 Billion).
      *   **10% Weight (5 cards):** 1 Insect Unit = 0.1 Vertebrate Unit. (Payoff drops to 100 Million).
      *   **1% Weight (3 cards):** 1 Insect Unit = 0.01 Vertebrate Unit. (Payoff drops to 1 Million).
  4.  **Scoring:** Calculate total Units.
      *   *Vertebrate:* Chips $\times$ 10.
      *   *Insect:* Chips $\times$ (Population Multiplier $\times$ Weight Multiplier).

  **The Force:**
  Even at **1% Weight**, the Insect payoff is 1 Million Units per Chip vs 10 Units for Vertebrates. The EV still dwarfs the Vertebrate option. To justify investing in Vertebrates, they must believe the probability of Sentience $\times$ Weight is less than 1/100,000,000th of the Vertebrate certainty.

  ### Phase 4: The Debrief (15 Minutes)
  **Do not start with theory.** Start with their feelings.

  1.  **The "Rigged" Feeling:** Ask the table that went 100% Insects in Round 1 and drew Black (0 points): "You played the odds perfectly. You lost everything. Do you regret your choice?"
      *   *Point:* This isolates **Outcome Luck vs. Decision Quality**. The Scale Argument relies on Decision Quality (EV), but we live with Outcome Luck.
  2.  **The Hedging Instinct:** Ask the tables that split 50/50: "You sacrificed 50 million expected units to guarantee 500 units. Why?"
      *   *Point:* This reveals **Risk Aversion** and the **Fanaticism Objection**. We intuitively reject bets where a tiny probability dictates all our resources, even if the math holds.
  3.  **The Credence Check:** Open the envelope from Phase 1. Compare their written probabilities to the game's 10% objective probability.
      *   *Point:* If they wrote 1%, they should have invested 0 in Insects. If they wrote 50%, they should have gone 100% Insects. This highlights **Moral Uncertainty**. Are you acting on your *actual* credence, or your *comfortable* credence?
  4.  **Sentience vs. Status:** Compare Round 1 and Round 2.
      *   *Point:* Round 1 was "Is the light on?" (Sentience). Round 2 was "How bright is the light?" (Moral Weight). The Scale Argument survives even if the light is dim, because there are so many bulbs.

  ---

  ## Part 3: Debrief Map & Facilitator Notes

  ### Mapping Mechanics to Arguments
  | Game Moment | Philosophical Concept | The Intuition Generated |
  | :--- | :--- | :--- |
  | **1 Chip = 1 Billion Units** | **Astronomical Numbers** | The sheer magnitude makes the "safe" bet look negligible. |
  | **1 Red / 9 Black Cards** | **Small Probability** | 10% feels "real," but you can scale the analogy to 0.001% in discussion. |
  | **Maximizing Total Units** | **Expected Value** | Forces the multiplication of $P \times \text{Impact}$. |
  | **Losing on a Black Card** | **The Fanaticism Objection** | Shows why we resist the argument: it feels like reckless gambling. |
  | **Weight Deck (1%, 10%)** | **Degrees of Moral Status** | Shows that even if insects matter *less*, they might still matter *more in aggregate*. |
  | **Private Credence Note** | **Moral Uncertainty** | Highlights the gap between what we claim to believe and how we act. |

  ### Predictable Failure Modes & Fixes

  **1. The "It's Just a Game" Rebellion**
  *   *What happens:* Participants treat the chips as meaningless and allocate randomly or joke around.
  *   *Fix:* In the intro, state: "The table with the highest aggregate score chooses the charity for a $500 donation the institute will make." (Only do this if you have budget; if not, emphasize that the *score* is the only metric of success in the simulation).
  *   *Facilitator Move:* "If you aren't trying to maximize the score, you aren't engaging with the ethical problem. The problem *is* the maximization."

  **2. The Math Block**
  *   *What happens:* Biology students get bogged down debating the population numbers ("There aren't that many termites!").
  *   *Fix:* Establish the numbers as **axioms** for the simulation. "For the next 75 minutes, these are the laws of physics. You can debate them in the bar later."
  *   *Facilitator Move:* Enforce the axioms strictly. The point is the *structure* of the argument, not the empirical accuracy of the multiplier.

  **3. The Risk-Aversion Defense**
  *   *What happens:* Participants argue, "It's rational to be risk-averse. I'd rather save 10 humans for sure than gamble."
  *   *Fix:* This is a feature, not a bug. In the debrief, validate this. "The Scale Argument demands **Risk Neutrality**. If you are risk-averse, you reject the conclusion. But why? Is it because the math is wrong, or because you value 'certainty' more than 'good'?"
  *   *Facilitator Move:* Push them to admit that risk-aversion in morality implies letting vast amounts of suffering happen to avoid the *feeling* of recklessness.

  **4. Confusing Sentience with Weight**
  *   *What happens:* In Round 2, they treat the Weight Card as a Sentience Card (e.g., 1% Weight = 1% chance of sentience).
  *   *Fix:* Circulate during Round 2. Correct the language. "Sentience is the switch. Weight is the dimmer. The switch is ON. How bright is it?"

  ### Limitations: What the Game Cannot Do
  Be candid about this in your journalism and the closing remarks.

  1.  **Risk Neutrality:** The game assumes linear value (1 Unit = 1 Unit). In reality, humans have diminishing marginal utility. Saving the *first* human feels more urgent than saving the *billionth* insect. The game cannot simulate the *urgency* of immediate, visible suffering vs. abstract, statistical suffering.
  2.  **Epistemic Humility:** The game sets an objective probability (10%). In reality, we don't know the probability. The "Knightian Uncertainty" (unknown unknowns) is harder to game. Participants might argue, "We don't even know the odds," which is a valid objection the game glosses over.
  3.  **Agent-Relative Duties:** The game is purely consequentialist. It cannot capture the intuition that we have special duties to humans (kinship, reciprocity) that aren't about total welfare units. A participant might say, "I'm a human trustee for humans." The game scores this as "irrational," but in ethics, it might be "partiality."

  ### Final Facilitator Instruction
  **Do not resolve the tension.**
  End the session by asking: "Looking at the winning score vs. the losing score, who actually did the right thing?"
  Let them sit with the silence. If the math says one thing and their gut says another, *that* is the story of your feature. The game doesn't solve the moral status of insects; it reveals why the question is so uncomfortable to ask.
