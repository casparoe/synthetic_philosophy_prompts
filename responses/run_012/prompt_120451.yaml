answer: |-
  **The Case**

  Two drivers, Ali and Bill, operate identical vehicles on the same model of roadway at night. Both travel at the posted speed limit, maintain identical following distances, and possess identical driving records, attention levels, and visual acuity. The road surface appears dry to both; unknown to either, a patch of black ice covers the lane ahead, optically indistinguishable from asphalt under streetlights. Both detect a stopped vehicle ahead at the same distance and apply the brakes with identical pressure and timing, following all standard safety protocols for the conditions as known to them.

  In Case A, microscopic variance in tire-friction physics causes Ali's vehicle to enter an unrecoverable spin, colliding with a stationary barrier and destroying the car. In Case B, Bill's vehicle experiences no such variance, decelerates linearly, and stops safely without incident. The divergence is purely physical; no mechanical defect, no difference in road treatment, and no third-party intervention distinguishes the scenarios prior to the spin. The risk of driving on undetectable ice was ex ante equal for both, and the divergence is a low-probability deviation in causal unfolding rather than a difference in choice or capacity.

  The harm in Case A is total loss of the vehicle and significant trauma to Ali; in Case B, there is no harm. Both agents performed the exact same act under the exact same epistemic conditions. The only difference is that the risk inherent in the situation materialized for Ali but not for Bill. Nothing differs between the two cases except the outcome itself.

  ***

  **The Audit**

  **1. The Pair and the Variable**
  The pair consists of Ali (Crash) and Bill (Stop). The single variable that differs is the **materialization of harm** (the physical collision and resulting damage/injury). All ex ante conditions—agent capacity, information, act performed, and environmental setup—are stipulated as identical.

  **2. Verdicts of Three Positions**
  *   **Strict Control Principle:** Since the agents' acts and control were identical, the divergence in outcome licenses **no difference in blameworthiness**. Ali and Bill are equally blameworthy (which, given the lack of negligence, means neither is blameworthy). The outcome is outside their control, so moral assessment must remain invariant.
  *   **Agent-Regret View:** The divergence licenses a **distinctive first-personal regret** for Ali that Bill does not owe. Ali must acknowledge having *done* the thing (crashed the car) even if she was not at fault. This regret attaches to the agency involved in the harm, distinct from blame, whereas Bill, having caused no harm, owes no such acknowledgement.
  *   **Institutional/Outcome-Directed Response View:** The divergence licenses **different institutional responses** (compensation, insurance sanctions, public accounting) for Ali compared to Bill. Even if blameworthiness is equal, an outcome-directed response is owed because a harm occurred. Ali must pay restitution or face sanctions triggered by the crash; Bill faces none.

  **3. The Feature Doing the Work**
  The feature doing the work is the **occurrence of the crash (harm)**. If we delete this feature by modifying the pair so that both agents stop safely (Case A* and Case B* both result in no harm), the verdicts converge. Under the Control Principle, both are equally non-blameworthy. Under the Agent-Regret view, neither owes special regret because neither caused harm. Under the Institutional view, neither triggers compensation or sanction mechanisms. The divergence in verdicts disappears entirely when the outcome is equalized.

  **4. Attributable Outcome Variance**
  The attributable outcome variance of this pair is **zero**. The difference between the outcomes (Crash vs. Stop) is produced entirely by surrounding circumstances (microscopic friction variance, chaotic physics) rather than by the agents' own acts. Since the acts were qualitatively identical in force, timing, and intention, none of the variance in the result can be attributed to the agents. The variation belongs wholly to the world.

  **5. Purpose and Cheating**
  The case is designed to force a wedge between **blameworthiness** (controlled by the agent) and **responsibility for outcomes** (controlled by the world). It tests whether moral theory can sustain different obligations for agents who are morally identical ex ante. Cheating in constructing this case would involve smuggling in a difference of **negligence or capacity**—for example, implying Ali was slightly less attentive or her tires were slightly more worn. If the divergence in verdicts relies on a hidden fault rather than the stipulated commitments of each position (e.g., if the Institutional view punishes Ali because she "should have known" about the ice), the isolation of outcome luck has failed.

  **6. Steelman of the Control Principle**
  The strongest line of attack for the defender of the Control Principle is to argue that **conflating outcome-directed responses with moral assessment corrupts the concept of blame**. They must concede that while society may treat Ali differently (insurance, restitution), this treatment is **pragmatic or legal, not moral**. The defender must insist that if Ali truly owes nothing in blame, then any "regret" or "sanction" she bears is a burden imposed by a world that ignores moral truth, not a requirement of morality itself. They must concede that the *appearance* of difference (we feel worse for Ali) is a psychological error, not a moral insight.
