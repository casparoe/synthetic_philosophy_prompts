answer: |-
  Here is the hard truth: You and Dana are talking past each other because you are operating in different registers. Dana is giving you a **genealogical/descriptive** answer (how institutions *actually* begin), while you are demanding a **normative/justificatory** answer (how power is *legitimated*). In political science, her answer is often sufficient. In political theory, your intuition is correct: if legitimacy requires justification to the governed, an arbitrary boundary undermines the claim to legitimacy.

  However, trying to "solve" the boundary problem in the abstract (Paradox vs. Truism) is the fastest way to waste a year. That debate was effectively codified by Frederick Whelan in 1983 (*Democratic Theory and the Boundary Problem*), and his conclusion was that it is logically insoluble procedurally. If you spend a year trying to prove Whelan wrong on logical grounds, you will likely fail or rediscover existing arguments.

  To make this a viable prospectus, you need to move from "Is it a paradox?" to "Where does the paradox do the most damage, and how do we mitigate it?"

  Here is the defended ordering of your candidate questions, ranked by **leverage** (how many other questions depend on it), **tractability** (can you do this in a year without fieldwork?), and **novelty** (is it talked to death?).

  ### 1. The Upstream Question: All-Affected vs. All-Subjected (The Criterion)
  **Status:** *Essential, but needs narrowing.*
  **Why it's first:** You cannot evaluate whether the boundary problem is a "paradox" or a "truism" without a metric for what the boundary *ought* to be.
  *   **All-Affected:** largely considered dead in rigorous theory because "affect" is infinite and indeterminate (Goodin tried to save it, but it's leaky).
  *   **All-Subjected to Coercion:** This is the live wire (Abizadeh, Viehoff). It ties the boundary to the justification of force.
  **The Trap:** If you just compare the two principles, you are writing a literature review.
  **The Move:** You must determine if "coercion" can be defined without presupposing the *demos*. If coercion requires a legal order, and the legal order requires a *demos*, you are back to Dana's circularity.
  **Verdict:** This is your theoretical toolkit. You must settle on a working definition of "subjection" to proceed, but do not make this the *entire* dissertation.

  ### 2. The High-Value Question: State vs. Non-State Bodies (The Context)
  **Status:** *Highest ROI for a Theory PhD.*
  **Why it's second (but should be your focus):** This is where you beat Dana's "clubs are easy" argument.
  *   **The State:** Has a monopoly on violence and territorial fixity. Boundaries are sticky.
  *   **Non-State (Firms, Platforms, AI Governance):** Boundaries are fluid, membership is often non-voluntary (in practice), and coercion is private but potent.
  **The Argument:** Dana says "clubs start with founders, then members decide." This works for a knitting circle. It fails for a platform that governs speech or an algorithm that allocates credit. If you can show that the boundary problem is **more severe** in non-state governance because "exit" is illusory and "founding moments" are opaque, you validate your intuition without getting stuck in the abstract paradox.
  **Tractability:** High. You can analyze terms of service, corporate charters, and algorithmic governance structures as "texts" without needing empirical methods.
  **Verdict:** **This is your project.** It takes the old boundary problem and applies it to the one area where the "Westphalian fix" (territory = demos) doesn't work.

  ### 3. The Meta-Question: Paradox vs. Legitimacy Deficit (Reframing Dana)
  **Status:** *Necessary framing, but don't fight it head-on.*
  **Why it's third:** You won't "solve" whether it's a paradox. Instead, reframe it.
  *   **Dana's View:** It's a brute fact (institutional beginning).
  *   **Your View:** It's a circular justification.
  *   **Synthesis:** It is a **Legitimacy Deficit**. Accept Dana's point that boundaries *must* start somewhere (genealogy), but argue that this creates a permanent deficit in legitimacy that must be compensated for by other means (e.g., stronger internal rights, easier exit, stakeholder representation).
  **Verdict:** Use this to write your introduction and conclusion. It resolves the argument with Dana by conceding the descriptive point while winning the normative one.

  ### 4. The Drop List: Secession and Theories of Justice
  **Status:** *Cut these.*
  **Secession:** This is too legalistic and empirical. To do secession right, you need to know constitutional law and historical cases (Quebec, Scotland, Catalonia). Without empirical training, you will end up doing armchair speculation that political scientists will dismiss. It's also a downstream application of the boundary problem, not a solution to it.
  **Justice vs. Procedure:** This is too meta. Asking "Is this a problem for justice generally?" leads to Rawlsian/Non-Ideal theory rabbit holes that will consume your year without producing a clear argument about democracy. Keep this as a background assumption (i.e., "I am assuming procedural legitimacy is a precondition for justice"), but don't make it a chapter.

  ---

  ### If I Had the Year: The Strategy

  If I were in your shoes, aiming for a job market paper and a prospectus in 12 months, here is exactly how I would spend the time:

  **The Thesis:** The boundary problem is not a logical paradox that prevents democracy from starting; it is a **continuing pathology of private power**. While states can hide the boundary problem behind territory and history, private governance (corporations, platforms, AI systems) exposes the circularity, making the "All-Subjected" principle the only viable remedy.

  **The Order of Operations:**

  1.  **Months 1-3: Master the "Subjected" Criterion.**
      *   Read Abizadeh ("Democratic Theory and Border Coercion"), Whelan, and recent critiques (e.g., by Song or Miller).
      *   *Goal:* Define "coercion" in a way that applies to non-state actors. If a platform de-platforms you, is that coercion comparable to state exile? If you can argue "Yes," you unlock the project.
  2.  **Months 4-7: The Non-State Application.**
      *   Apply the criterion to digital platforms or algorithmic governance.
      *   *Goal:* Show that Dana's "club" analogy fails here. In a club, you consent to the founders' rules to join. In a platform/AI system, you are often subjected to rules you couldn't foresee and can't exit without significant cost. The boundary is imposed *on* you, not chosen *by* you.
  3.  **Months 8-10: The Remedy.**
      *   If the boundary can't be democratically set, how do we mitigate the legitimacy deficit? (e.g., Stakeholder governance, fiduciary duties for platforms, portable reputation).
      *   *Goal:* Move from critique to constructive theory.
  4.  **Months 11-12: Write the Prospectus.**
      *   Frame the "Paradox vs. Truism" debate as the historical context (Chapter 1), but position the Non-State analysis as the novel contribution (Chapter 2 & 3).

  ### Why This Ordering?

  1.  **Tractability:** You avoid the "infinite regress" trap of the abstract boundary problem by grounding it in specific non-state contexts. You don't need to solve the problem for *all* democracies, just show where the current solutions fail.
  2.  **Marketability:** "Democratic Theory meets Tech/Political Economy" is much hotter on the job market than "Another look at Whelan's Boundary Problem."
  3.  **Leverage:** If you prove that private power suffers from a *worse* version of the boundary problem than the state, you force the field to reconsider the state-centric assumptions of democratic theory.

  ### What Would Move This Down the List?

  *   **If you find "Coercion" is indefensible outside the state:** If you conclude after 3 months that "coercion" strictly requires a sovereign monopoly, you must pivot. In that case, drop the Non-State angle and focus on **Secession**, but only if you are willing to read legal theory.
  *   **If the "All-Subjected" principle is proven circular:** If you find you cannot define "subjected" without already knowing who the members are, you must retreat to the **Meta-Question**. Your project then becomes a defense of "Democratic Foundings" as a distinct, non-democratic category of action (a la Machiavelli or Arendt). This is riskier but philosophically deeper.

  ### Final Advice on Dana

  Don't try to convince Dana she's wrong. She isn't, within her discipline. Institutionalists *need* the boundary to be a brute fact to study what happens *after* the boundary is drawn. You are studying the *normative cost* of drawing it.

  Your prospectus should explicitly acknowledge this: *"While institutionalists treat the boundary as a starting condition, this project treats it as a continuing variable of legitimacy."* That validates her work while carving out your own.

  **Start with Abizadeh on coercion.** If that link holds, you have a year of work. If it breaks, you need to find a new normative hook, because without coercion, the "club" analogy wins.
