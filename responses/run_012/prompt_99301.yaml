prompt: |-
  I'm a junior in a philosphy of mind course and we've spent two weeks on the Turing test and behavioral criteria, and I'm honestly more confused than when we started. Every discussion turns into argueing about whether some chatbot passes or fails, but nobody ever says what the test is supposed to be a test of, or what would count as a good theory of the relation between behavior and mind in the first place. My professor keeps saying the test is an operational definition, but then she also says it can't be, because of zombies and other minds and all that. So I want to back up and ask for the spec before we argue about any particular case. Act as an expert philosopher of mind who is also comfortable with cognitive science and the history of these debates. Think carefully, and before you give me the final list, do a short brainstorm of candidate requirements so I can see the reasoning.

  What I need is the desiderata for any adequate theory of behavioral criteria for mind -- that is, a theory that says what behavioral evidence can and cannot tell us about mentality. Write the requirements list: the cases it has to get right, the puzzles it has to dissolve or explain, the distinctions it must not collapse, and the results it has to be consistent with. For each requirement, give the case or consideration that motivates it, and say why it's a requirement rather than just a preference of one camp. Some cases I keep coming back to, and I'd like you to at least address them: a system that produces all the right answers but by a lookup table; a system that passes the test only by lying about its inner life; a group of people or a corporation that collectively passes; a system that fails the test because it's catatonic or paralysed but might still be conscious; a system that passes for five minutes but not for five hours; and the reverse case, a system that behaves nothing like a human but that we have independent reason to think is minded. I also want you to mark which requirements are non-negotiable and which are only commitments of particular camps, and flag any pair or subset of requirements that you suspect can't be jointly satisfied. If the list itself turns out to be a result -- like, if the demands pull in opposite directions -- that's the part I most want to see. A table is fine, but keep the weight on the criteria and their motivating cases, not on scoring the existing views. The purpose I care about is a theory good enough to tell a research program what behavioral evidence is worth, not a theory that just picks a winner in the old Turing test debates.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
