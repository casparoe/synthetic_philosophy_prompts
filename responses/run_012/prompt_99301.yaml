      *   **Problem:** Discussions focus on specific cases (does Chatbot X pass?) without establishing the criteria for evaluation (what should a theory of behavioral criteria look like?). Professor gives conflicting signals (operational definition vs. not, due to zombies/other minds).
      *   **Task:** Act as an expert philosopher of mind/cognitive science. Provide a list of *desiderata* (requirements) for any adequate theory of behavioral criteria for mind.
      *   **Specific Instructions:**
          *   Do a short brainstorm of candidate requirements first to show reasoning.
          *   Write the requirements list (cases to get right, puzzles to dissolve, distinctions to maintain, consistency constraints).
          *   For each requirement: Give the motivating case/consideration and explain why it's a requirement (not just a preference).
          *   Address specific cases mentioned: Lookup table, lying about inner life, collective/group mind, catatonic/paralyzed, duration (5 mins vs. 5 hours), non-human behavior but minded.
          *   Mark requirements as "Non-negotiable" vs. "Camp-specific Commitments."
          *   Flag tensions/incompatibilities between requirements (the "result" might be that they pull in opposite directions).
          *   Format: Table is okay, but prioritize criteria and motivating cases over scoring existing views.
          *   Goal: A theory good enough to guide a research program on behavioral evidence, not just picking a winner in old debates.

  2.  **Brainstorming Candidate Requirements (Internal Monologue/Drafting):**
      *   *What is the core problem?* We want to know when behavior justifies attributing mind.
      *   *Requirement 1: Sensitivity to Implementation.* The Lookup Table argument (Block's Chinese Gym/Blockhead). If behavior is identical but mechanism is trivial, is it mind? A theory needs to say yes or no, but consistently.
      *   *Requirement 2: The Error Margin.* Lying/Deception. If something says "I am sad" but isn't, behavior misled us. Theory needs to account for the possibility of behavioral error.
      *   *Requirement 3: Substrate Independence/Collective.* The Corporation/Group case. If the output is right, does the internal structure (many humans vs. one brain) matter?
      *   *Requirement 4: Absence of Evidence vs. Evidence of Absence.* The Catatonic case. No behavior $\neq$ No mind. Theory must distinguish inability to act from inability to feel.
      *   *Requirement 5: Temporal Robustness.* 5 mins vs. 5 hours. Intelligence/Mind isn't a snapshot. It requires sustainability.
      *   *Requirement 6: Non-Anthropocentrism.* The Alien/Animal case. Mind without human-like behavior. Theory shouldn't be human-chauvinist.
      *   *Requirement 7: The Operational Tension.* The Professor's point. Is it a definition (Behaviorism) or evidence (Realism)? This is the big tension.
      *   *Tension:* If we demand behavior is *proof* (Operational), we fail the Zombie/Lookup table cases. If we demand behavior is merely *evidence* (Realist), we lose the ability to definitively test.
      *   *Tension:* If we demand substrate neutrality (Group mind), we might violate intuitions about unity of consciousness.
      *   *Tension:* If we allow non-human behavior (Alien), we risk making the criteria so vague they are useless.

  3.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the student's frustration (it's a classic pedagogical bottleneck). Validate the need for "specs" before "testing."
      *   **Brainstorming Section:** Briefly outline the thought process behind selecting these desiderata (The "Why" before the "What").
      *   **The Desiderata List (The Core):** Use a structured format (Requirement, Motivating Case, Rationale, Status).
      *   **Addressing Specific Cases:** Ensure the user's specific examples (Lookup table, Lying, Group, Catatonic, Duration, Alien) are embedded in the requirements.
      *   **The Incompatibility Matrix (Crucial Step):** Highlight where these requirements conflict. This answers the user's suspicion that the list itself is the result.
      *   **Conclusion:** Summarize what this means for a research program.

  4.  **Drafting the Content (Iterative Refinement):**

      *   *Refining the "Operational Definition" confusion:* I need to clarify that Turing likely meant it as a *replacement* for the question "Can machines think?" but philosophers treat it as a *criterion* for a pre-existing concept. This distinction is key for the "Non-negotiable" vs. "Camp-specific" tagging.
      *   *The Lookup Table:* This is Ned Block's "Blockhead." The requirement is about *Counterfactual Robustness*. It's not just what it does, but what it *would* do.
      *   *The Lying Case:* This touches on *Asymmetry of Access*. First-person vs. Third-person.
      *   *The Catatonic Case:* This is the *Problem of Negative Evidence*.
      *   *The Group Case:* This is the *Combination Problem* or *Vehicle Externalism*.
      *   *The Alien Case:* This is *Multiple Realizability*.

      *   *Tagging Status:*
          *   Non-negotiable: Must handle negative evidence (catatonic), must handle multiple realizability (alien).
          *   Camp-specific: Lookup table (Behaviorists say Yes, Functionalists say Maybe, Biological Naturalists say No), Lying (Skeptic vs. Realist).

      *   *Identifying Tensions:*
          *   Tension 1: Operational Certainty vs. Metaphysical Fallibility. (If behavior defines mind, you can't be wrong. If behavior evidences mind, you can be wrong. The user's professor is oscillating here).
          *   Tension 2: Anthropocentric Benchmark vs. Substrate Neutrality. (Turing Test uses human conversation. Alien mind might not converse).
