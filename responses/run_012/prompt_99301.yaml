  *   *Tensions:* The "Trilemma" of Behavioral Criteria.
  *   *Conclusion:* How to use this for research.

  7.  **Final Polish:** Check the specific cases again.
      *   Lookup table -> Counterfactual Robustness.
      *   Lying -> First-Person Authority/Error.
      *   Group -> Substrate/Structure.
      *   Catatonic -> Negative Evidence.
