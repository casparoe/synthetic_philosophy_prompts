  Constraints: keep it to 8 rules max, no rule that refers to itself by number in a way that's just circular wordplay, and no appeal to "the rules are invalid because..." -- the paradox has to be a legal outcome, not a verdict about legality. Also it should be the kind of thing two players could play out in one evening, not something that needs infinite moves or a computer.

