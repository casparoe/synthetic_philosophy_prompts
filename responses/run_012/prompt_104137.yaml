answer: |-
  This is a profound observation, and it cuts to the heart of why death determination is arguably the most philosophically fraught area of clinical practice. You are describing a structural sleight-of-hand that undermines the logical authority of the definition while relying on its rhetorical power.

  As a philosopher of medicine, I can tell you there is no single, canonical term in the literature that captures this exact dynamic in its entirety. However, there are three "near miss" concepts from philosophy of science, ethics, and logic that get close. Understanding why they *don't* quite fit will help us carve out the precise term you need.

  ### The Near Misses

  **1. Ad Hoc Rescue (Philosophy of Science)**
  *   **The Concept:** In the work of Karl Popper and Imre Lakatos, an *ad hoc rescue* occurs when a theory is threatened by counter-evidence, and a researcher adds a new clause to the theory solely to explain away the anomaly, without increasing the theory's predictive power.
  *   **Why it's close:** Your committee is "saving" the definition from the "counter-evidence" of the clinical case (e.g., the patient on ECMO).
  *   **Why it misses:** An *ad hoc* rescue is usually admitted (or at least visible) as a modification to a *theory* to save it from *facts*. In your case, the modification is hidden, and the "facts" (the practice) are actually driving the "theory" (the definition). More importantly, an *ad hoc* rescue admits the theory was in trouble. Your committee is pretending the definition remains the stable authority.

  **2. Reflective Equilibrium (Ethics)**
  *   **The Concept:** John Rawls described a method where we move back and forth between our general principles (definitions) and our particular judgments (cases) until they cohere. We adjust the principle if it yields a result we find unacceptable, and we adjust our judgment if it violates a principle we hold dear.
  *   **Why it's close:** This is literally what your committee is *doing*. You are adjusting the definition to match the practical judgment.
  *   **Why it misses:** Reflective equilibrium is a *virtuous*, transparent process. It requires acknowledging that both the principles and the judgments are fallible and subject to revision. The move you are describing is *covert*. It claims the principle is fixed and authoritative, while secretly bending it to the judgment. It is **Reflective Equilibrium without the Reflection.**

  **3. Stipulative vs. Reportive Definition (Logic)**
  *   **The Concept:** A *reportive* (or lexical) definition claims to describe how a word is actually used or what a thing truly is (e.g., "Water is H2O"). A *stipulative* definition assigns a meaning for a specific purpose (e.g., "For this study, 'heavy drinking' means 4+ drinks").
  *   **Why it's close:** Your committee is treating a *stipulative* choice (what we *want* death to be for policy reasons) as if it were a *reportive* fact (what death *is* ontologically).
  *   **Why it misses:** This describes the *category error*, but not the *temporal dynamic*. It doesn't capture the retroactive adjustment. It explains the confusion, but not the maneuver.

  ### The Coinage: "Cryptonormative Redefinition"

  Since no existing term captures the *retroactive*, *concealed*, and *authority-mimicking* nature of this move, I propose we call it **Cryptonormative Redefinition**.

  In political philosophy and legal theory, "cryptonormativity" refers to claims that present themselves as objective facts or descriptions but actually rely on hidden normative (value-based) judgments. Applying this to definition:

  **Definition:** A **Cryptonormative Redefinition** occurs when a definition is rhetorically positioned as the independent *authority* governing a decision (a reportive claim about reality), but is functionally treated as a dependent *variable* adjusted to validate a prior practical commitment (a stipulative choice), without acknowledging the adjustment.

  It is a **Direction-of-Fit Deception**.
  *   **Claimed Fit:** Word-to-World (The definition describes the reality of the patient).
  *   **Actual Fit:** World-to-Word (The reality of the patient is massaged to fit the definition, or the definition is massaged to fit the reality we want to act upon).

  ### The Carving: Edges and Boundaries

  To use this term effectively on your committee, you need to know where it applies and where it doesn't. Here is how to carve the concept:

  **1. The Core Case (Cryptonormative Redefinition)**
  *   **Scenario:** The ECMO patient.
  *   **Why it fits:** The committee feels a normative pressure to declare the patient dead (to stop treatment, harvest organs, or free a bed). The existing definition blocks this. The definition is amended to allow it, but the amendment is presented as "clarifying what death *always was*," not "changing the rules to fit this case." The definition provides an **Alibi** for a decision that was already made.

  **2. Ordinary Revision (Not Cryptonormative)**
  *   **Scenario:** New neuroscience shows that certain brainstem reflexes can persist permanently without consciousness, so the committee openly votes to update the policy.
  *   **Why it differs:** The normative driver is acknowledged ("We need to update our criteria based on new data"). There is no pretense that the old definition was secretly always the new one. The authority of the definition is paused while the definition is repaired.

  **3. The Borderline Case (Conceptual Drift)**
  *   **Scenario:** Over 20 years, the phrase "irreversible cessation" is slowly interpreted more loosely across the jurisdiction without formal policy change.
  *   **Why it's borderline:** This is *Semantic Drift*. It lacks the specific *argumentative move* of waving the definition around as authority in a specific hard case. It is a cultural shift rather than a rhetorical maneuver. However, if a specific committee member uses that drift to shut down debate in a specific meeting ("We all know what 'irreversible' means here"), it tips into Cryptonormative Redefinition.

  **4. The Contrast Case (Honest Stipulation)**
  *   **Scenario:** "We know the biology is murky here. For the purposes of organ procurement, we are *stipulating* that death occurs at time X."
  *   **Why it differs:** This is honest. It admits the definition is a tool for a goal, not a discovery of a fact. It removes the mask of authority.

  ### Why This Matters for Your Committee

  You should introduce this term because it names the **trust cost** of the maneuver.

  When you engage in **Cryptonormative Redefinition**, you are borrowing the authority of science (the "is" of death) to justify a policy decision (the "ought" of treatment withdrawal). Every time the definition shifts to match the practice, the "scientific authority" of the definition erodes. Eventually, the definition becomes a hollow shell that everyone knows is manipulatable, which fuels the exact distrust you see when families object on religious grounds.

  **How to use it:**
  Next time the move happens, you might say:
  > "I worry we are engaging in **cryptonormative redefinition**. We are adjusting the definition to match our practical intuition about this case, which is fine—we should do reflective equilibrium. But we cannot then turn around and use the definition as if it were the independent authority that *forced* this result. If the definition is changing to fit the case, we need to admit the decision rests on our ethical judgment, not just the definition."

  This forces the committee to own the ethical weight of the decision rather than hiding behind a moving semantic target.
