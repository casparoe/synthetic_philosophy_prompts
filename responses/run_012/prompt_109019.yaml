prompt: |-
  My two friends have been arguing for about a year now — one of them runs a risk-analysis shop and thinks the precautionary principle is mostly an excuse to make bad decisions with a straight face, the other works in environmental policy and thinks that line is industry apologetics. I want to force them to sit down and write the document together: a joint statement of an adversarial collaboration on the precautionary principle that both of them could actually sign their names to.

  Here's the shape I want.

  1) A numbered agreed-claims section. What can a precautionist and an expected-utility person both accept? About why the status quo isn't a neutral baseline, about what we can and can't know in advance, about which of the standard objections to precaution are fair hits and which are strawmen. And I want two specific things in there. First, a trigger clause: the conditions under which they both agree restricting an activity is warranted. Second, a burden-of-proof ledger saying who has to show what at each stage — before deployment, after deployment, and once a warning signal shows up. Also make them pin down how they're carving up the epistemic space: do they want to seperate risk (probabilities known), uncertainty (probabilities unknown), and plain ignorance (you can't even list the possible outcomes)? Get them to commit to a split like that and say what each thinks should happen in each tier, because I'm fairly sure half their fight is really about which tier we're in.

  2) A disagreements table. Every remaining disagreement stated in wording each side would accept as a fair statement of the other's view, then what they take the crux to be, then for each crux a case or consideration they both agree bears on it, with each side's prediction written down in advance. I want at least these three: whether there's a non-arbitrary threshold for triggering precaution or whether every threshold is a value judgement wearing an epistemic costume; whether irreversible harms get priority or merely a bigger weight; and whether precaution applies to the precautionary measure itself.

  3) Then run their agreed criteria on a case I think is nasty for both of them: an intervention with a small chance of a large, irreversible, hard-to-attribute harm that would also avert a large harm that's already happening. The precautionist can't just say restrict and the expected-utility person can't just say do the math, because here the uncertainty is about the possibility space rather than the odds. Tell me where they land, whether they land in the same place, and if they split, whether the split is a real disagreement or just a fight over words. If part of this whole debate turns out to be verbal, name that part.

  One last thing — both of them keep saying the precautionary principle as if it were one thing, so make them state which version each is definately defending, and whether the weak/strong distinction is doing any actual work or just relabelling the same disagreement.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Create a joint statement of adversarial collaboration between two friends (Risk Analyst vs. Environmental Policy Advocate) regarding the Precautionary Principle (PP).
      *   **Tone:** Professional, precise, philosophical yet practical, acknowledging deep disagreement while finding common ground.
      *   **Structure:**
          1.  Agreed Claims (Numbered): Baseline assumptions, epistemic categories (Risk/Uncertainty/Ignorance), Trigger Clause, Burden-of-Proof Ledger.
          2.  Disagreements Table: Specific disputes (Thresholds, Irreversibility, Meta-Precaution), stated fairly, with cruxes and testable predictions.
          3.  Case Study Application: A specific nasty case (small chance/large irreversible harm vs. large existing harm). Analyze convergence/divergence and identify verbal vs. substantive disputes.
          4.  Definitions: Clarify which version of PP each defends (Weak vs. Strong) and evaluate the utility of that distinction.

  2.  **Deconstruct the Personas:**
      *   **Friend A (Risk Analyst):** Likely favors Expected Utility (EU), Cost-Benefit Analysis (CBA). Views PP as paralysis, anti-innovation, potentially dangerous if it blocks beneficial tech. Concerned with "opportunity costs."
      *   **Friend B (Environmental Policy):** Likely favors Precautionary Principle. Views EU as insufficient for tail risks, systemic collapse, or irreversible damage. Concerned with "false negatives" and industry externalities.
      *   **Common Ground:** Both want good outcomes. Both acknowledge uncertainty. Both dislike status quo bias *in theory* (though they disagree on what the status quo is).

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Epistemic Categories:* Need to distinguish Risk (known probs), Uncertainty (unknown probs), Ignorance (unknown unknowns). This is crucial (Knightian uncertainty).
      *   *Status Quo:* Acknowledge that "doing nothing" is also an action with risks.
      *   *Trigger Clause:* When does action happen? Needs to be specific. Plausibility + Severity + Irreversibility?
      *   *Burden of Proof:* Who proves what? Shifts over time.
      *   *Objections:* Acknowledge valid critiques (paralysis) vs. strawmen (anti-science).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Thresholds:* Is there a mathematical line (A) or a value judgment (B)?
      *   *Irreversibility:* Priority (B) vs. Weight (A).
      *   *Meta-Precaution:* Does PP apply to the regulation itself? (A says yes, B says... maybe reluctantly).
      *   *Format:* Claim, Crux, Shared Evidence, Predictions.

  5.  **Drafting Section 3: Case Study:**
      *   *Scenario:* Geoengineering? Gene Drive? AI Alignment? Let's go with **Stratospheric Aerosol Injection (SAI)** or a **Gene Drive for Pest Eradication**. Let's choose a *Gene Drive* to release a mosquito-killer.
      *   *Harm:* Ecosystem collapse (irreversible, hard to attribute).
      *   *Benefit:* Malaria eradication (large, existing harm).
      *   *Analysis:*
          *   Risk Analyst: Wants probability estimates. If $P(collapse) \times Cost < P(malaria) \times Cost$, go. But $P(collapse)$ is unknown (Ignorance).
          *   Policy Advocate: Ignorance triggers PP. Don't release.
          *   *Convergence:* Both agree on contained field trials (monitoring).
          *   *Divergence:* Full deployment.
          *   *Verbal Dispute:* Is "contained trial" a "restriction" or "data gathering"?

  6.  **Drafting Section 4: Definitions (Weak vs. Strong):**
      *   *Weak PP:* Lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures (Rio Declaration). Basically "Don't wait for 100% proof."
      *   *Strong PP:* Shift burden of proof to proponent of activity. Ban until proven safe.
      *   *Utility:* Is it useful? Often used to hide value judgments.

  7.  **Refining and Polishing:**
      *   *Voice:* Needs to sound like a negotiated treaty. "The Undersigned."
      *   *Precision:* Ensure the distinction between Uncertainty and Ignorance is sharp.
      *   *Constraint Check:* Did I include the Trigger Clause? Yes. Burden-of-Proof Ledger? Yes. Epistemic Carve-up? Yes. Disagreements Table with predictions? Yes. Case Study? Yes. Version Definition? Yes.

  8.  **Self-Correction/Iterative Thought during drafting:**
      *   *Critique:* Initially, I might make them agree too much.
      *   *Fix:* Ensure the Disagreements Table highlights fundamental philosophical splits (e.g., incommensurability of values).
      *   *Critique:* The Case Study needs to be "nasty" for both.
      *   *Fix:* Make sure the Risk Analyst *can't* just do the math because the probabilities are undefined. Make sure the Policy Advocate *can't* just ban it because people are dying *now* from the status quo (Malaria). This forces the "Status Quo isn't neutral" agreement to work hard.
      *   *Critique:* The "Verbal Dispute" identification needs to be specific.
      *   *Fix:* Identify the definition of "Safety" or "Action" as the verbal sticking point.

  9.  **Final Review against constraints:**
      *   Numbered agreed claims? Yes.
      *   Trigger clause included? Yes.
      *   Burden-of-proof ledger (Before/After/Signal)? Yes.
      *   Epistemic space (Risk/Uncertainty/Ignorance)? Yes.
      *   Disagreements table (3 specific topics)? Yes.
      *   Case study (Small chance/large irreversible vs large existing)? Yes.
      *   Landing analysis (Same place? Split? Verbal?)? Yes.
      *   Version definition (Weak/Strong)? Yes.

  10. **Final Polish:** Check tone. Ensure it sounds like a document *they* would sign, not just an essay about them. (Decided to frame it as the document itself, with a brief intro/outro).

  *(Self-Correction during final output generation)*: I need to make sure the "Burden-of-Proof Ledger" is very clear about *who* proves *what*.
  *Before:* Proponent proves no *known* showstoppers.
  *After:* Regulators monitor for signals.
  *Signal:* Proponent must explain or halt.

  Let's write it.cw
answer: |-
  **DOCUMENT TITLE:** Framework for Adversarial Collaboration on the Precautionary Principle
  **DATE:** October 26, 2023
  **PARTIES:** The Risk-Analysis Working Group (Party A) & The Environmental Policy Working Group (Party B)
  **SUBJECT:** Operationalizing the Precautionary Principle under Deep Uncertainty

  ---

  ### PART 1: AGREED CLAIMS & OPERATIONAL FRAMEWORK

  We, the undersigned, acknowledge that our prior debates have suffered from category errors regarding epistemic states and the baseline status quo. We agree to the following foundational claims to structure future adjudication of technological deployment.

  **1. The Epistemic Carve-Up**
  We agree to distinguish three distinct epistemic tiers. Disagreements often arise from misidentifying which tier a case occupies.
  *   **Tier 1 (Risk):** Outcomes are known, and probabilities are quantifiable (e.g., actuarial tables). *Consensus:* Standard Expected Utility (EU) analysis applies. PP is redundant.
  *   **Tier 2 (Uncertainty):** Outcomes are known, but probabilities are unknown or contested (e.g., climate sensitivity). *Consensus:* EU requires priors; PP requires robustness checks.
  *   **Tier 3 (Ignorance):** The outcome space is incomplete; "unknown unknowns" exist (e.g., novel gene drives interacting with non-target ecosystems). *Consensus:* EU fails mathematically here. PP is triggered specifically for Tier 3.

  **2. The Status Quo Baseline**
  We agree that "inaction" is not a neutral baseline. The status quo carries its own risk profile.
  *   **Claim:** Blocking a new technology imposes the risks of the *old* technology.
  *   **Implication:** Party A accepts that maintaining the status quo under Tier 3 Ignorance is not inherently "safer." Party B accepts that "innovation" is not inherently "riskier." The comparison must be between *Risk Profiles*, not *Action vs. Inaction*.

  **3. Valid vs. Invalid Objections**
  *   **Valid Objection (Party A):** The PP can be paralyzed by "infinite regress" (if we must be precautionary about the precautionary measure, nothing happens).
  *   **Valid Objection (Party B):** Standard Cost-Benefit Analysis (CBA) often treats irreversible systemic collapse as a linear cost, which is a category error.
  *   **Strawman (Both):** The PP is not "anti-science"; it is a rule for decision-making *under* scientific limitation. CBA is not "industry apologetics"; it is a tool for resource allocation under Tier 1 conditions.

  **4. The Trigger Clause**
  Restrictive action is warranted only when **all three** conditions are met:
  1.  **Plausibility:** There is a theoretically grounded mechanism for harm (not mere speculation).
  2.  **Severity:** The potential harm involves irreversible systemic damage or violation of fundamental rights (not merely economic loss).
  3.  **Epistemic Barrier:** The probability of harm cannot be bounded within a confidence interval acceptable for standard insurance markets (i.e., we are in Tier 2 or 3).

  **5. The Burden-of-Proof Ledger**
  We agree to shift the burden of proof dynamically based on the deployment stage.

  | Stage | Burden Holder | Requirement to Discharge Burden | Consequence of Failure |
  | :--- | :--- | :--- | :--- |
  | **Pre-Deployment** | **Proponent** | Must demonstrate absence of *known* showstoppers (Tier 1 risks) and provide a monitoring plan for Tier 2/3 uncertainties. | Deployment denied or restricted to contained testing. |
  | **Post-Deployment** | **Regulator** | Must actively monitor for "weak signals" of harm. Cannot assume silence equals safety. | Regulatory capture/Negligence. |
  | **Warning Signal** | **Proponent** | If a signal appears, Proponent must demonstrate the signal is *not* linked to the activity within a fixed timeframe. | Activity paused or revoked (Precautionary Suspension). |

  ---

  ### PART 2: DISAGREEMENTS TABLE

  We acknowledge the following remaining disagreements. We commit to phrasing the opposing view in a way the holder accepts as fair.

  | Topic | Party A (Risk) View | Party B (Policy) View | The Crux | Shared Evidence / Test Case | Party A Prediction | Party B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Thresholds** | Any threshold for "plausible harm" is ultimately a value judgment disguised as math. We should make the value trade-off explicit (e.g., "We accept 1% chance of collapse"). | There is a non-arbitrary threshold at the point of *irreversibility*. Once a system tips, cost-benefit math breaks down. The threshold is structural, not numerical. | **Commensurability:** Can all values be traded off on a single scale? | **Case:** Introduction of a non-native species for pest control that might escape containment. | We will agree on a "maximum tolerable probability" (e.g., <0.01%) and proceed if benefits exceed costs. | We will halt deployment regardless of probability because the *consequence* (extinction) is incomparable to economic gain. |
  | **2. Irreversibility** | Irreversible harms get a higher *weight* in the utility function, but they do not get a *veto*. High benefits can justify high irreversible risks. | Irreversible harms get a *priority* (lexical ordering). No amount of benefit justifies crossing a threshold of no-return. | **Lexicality:** Is safety a trump card or a high-value chip? | **Case:** Climate Geoengineering (Stratospheric Aerosols). | We will model the risk of termination shock vs. warming damage and choose the lower expected loss. | We will reject deployment because termination shock represents a loss of control that cannot be priced. |
  | **3. Meta-Precaution** | The PP must apply to the regulation itself. Over-regulation causes harm (drug lag, energy poverty). We must be precautionary about stifling innovation. | The PP applies primarily to the *intrusion* into complex systems. Regulatory harm is usually reversible (laws can be changed); ecological harm often is not. | **Asymmetry of Reversibility:** Is regulatory error easier to fix than ecological error? | **Case:** FDA approval delays for life-saving drugs vs. release of persistent organic pollutants. | Strict precaution on regulation will cost more lives (via delay) than it saves. | Strict precaution on pollutants will save more systems than it costs in delayed innovation. |

  ---

  ### PART 3: CASE STUDY APPLICATION

  **The Scenario:** *The Vector-Drive Intervention*
  A new gene-drive technology is proposed to eradicate a mosquito species carrying a lethal hemorrhagic fever (killing 50,000/year *now*).
  *   **Benefit:** Averts large, certain, ongoing harm (50k deaths/year).
  *   **Risk:** Small chance (<1% estimated, but unquantifiable tail) that the gene drive jumps to a non-target species, causing a pollinator collapse. This harm is irreversible and hard to attribute until it is too late.
  *   **Epistemic State:** Tier 3 (Ignorance). We cannot list all host species the drive might mutate to infect.

  **Application of Agreed Criteria:**

  1.  **Trigger Check:**
      *   *Plausibility:* Yes (gene flow is known).
      *   *Severity:* Yes (ecosystem collapse is irreversible).
      *   *Epistemic Barrier:* Yes (probabilities unquantifiable).
      *   **Result:** The Trigger Clause is met. Precautionary measures are warranted.

  2.  **Burden of Proof:**
      *   *Pre-Deployment:* Proponent cannot prove absence of showstoppers (Tier 3).
      *   *Status Quo:* Status quo is 50k deaths/year (High Severity).
      *   **Conflict:** Party B wants to restrict deployment (Risk of Collapse). Party A wants to deploy (Risk of Deaths).

  **Where They Land:**

  *   **Convergence:** Both agree on **Contained Field Trials**.
      *   *Reasoning:* Party A gets data to move from Tier 3 to Tier 2. Party B gets assurance that the gene drive is not released globally immediately. Both agree on the "Monitoring Plan" requirement from the Ledger.
  *   **Divergence:** **Full Deployment.**
      *   **Party A (Risk):** Argues that the "Status Quo Baseline" agreement compels action. The certain death of 50,000 people is a *current* irreversible harm (death is irreversible). To block the cure is to choose the certain harm over the uncertain one. They propose deployment with an "undo mechanism" (even if imperfect).
      *   **Party B (Policy):** Argues that the *type* of irreversibility matters. Human death is tragic but localized; pollinator collapse is systemic and potentially existential. They invoke the "Lexical Priority" of systemic integrity. They propose rejection until Tier 3 uncertainty is resolved (which may be never).

  **Analysis of the Split:**

  1.  **Substantive Disagreement:** There is a genuine clash in **Value Hierarchy**. Party A prioritizes *identifiable victims* (statistical lives lost now). Party B prioritizes *systemic resilience* (capacity for future life). This is not verbal; it is ethical.
  2.  **Verbal Dispute:** The definition of **"Safety."**
      *   Party A defines Safety as "Net reduction in expected harm."
      *   Party B defines Safety as "Absence of uncontrolled systemic intervention."
      *   *Resolution:* If they agree to use the term **"Net Risk Reduction"** (A) vs. **"Systemic Containment"** (B), the argument clarifies. They are not arguing about facts; they are arguing about whether "safety" is a aggregate sum or a boundary condition.

  **Verdict:** They do not land in the same place on full deployment. However, they agree on the *process* (Contained Trials -> Monitoring -> Re-evaluation). The split is substantive regarding the *goal*, but verbal regarding the label of "Precaution." Party A calls blocking the drug "reckless"; Party B calls releasing the drive "reckless." They agree on the definition of recklessness (ignoring the Trigger Clause), but disagree on which arm of the Trigger Clause (Severity of Status Quo vs. Severity of Intervention) dominates.

  ---

  ### PART 4: DEFINITIONAL COMMITMENTS

  To prevent future equivocation, we state our positions on the "Weak" vs. "Strong" Precautionary Principle distinction.

  **Party A (Risk Analyst) Position:**
  *   **Defending:** The **Weak Precautionary Principle** (Rio Declaration formulation). *"Lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures."*
  *   **Function:** This is a procedural check against using uncertainty as a veto. It keeps the burden of proof on those claiming harm.
  *   **View on Distinction:** The Weak/Strong distinction is **useful**. It separates "don't wait for 100% proof" (acceptable) from "prove 100% safety before starting" (impossible).

  **Party B (Environmental Policy) Position:**
  *   **Defending:** A **Contextual Strong Precautionary Principle**. *"When an activity raises threats of harm to human health or the environment, precautionary measures should be taken even if some cause and effect relationships are not fully established scientifically."* (Wingspread Statement).
  *   **Function:** This shifts the burden of proof to the proponent of the activity in Tier 3 (Ignorance) scenarios.
  *   **View on Distinction:** The Weak/Strong distinction is **often a trap**. "Weak" PP is often co-opted to mean "Proceed as usual until disaster strikes." "Strong" PP is labeled "anti-progress." The real distinction is not Weak/Strong, but **Reversible vs. Irreversible** contexts. We agree to stop using "Weak/Strong" as shorthand and instead specify the **Epistemic Tier** (1, 2, or 3) we are discussing.

  **Joint Addendum:**
  We agree that the phrase "The Precautionary Principle" shall not be used without specifying:
  1.  The Epistemic Tier (Risk, Uncertainty, Ignorance).
  2.  The Burden Holder (Proponent or Regulator).
  3.  The Reversibility of the proposed action.

  **Signed,**

  _____________________ (Risk-Analysis Working Group)
  _____________________ (Environmental Policy Working Group)
