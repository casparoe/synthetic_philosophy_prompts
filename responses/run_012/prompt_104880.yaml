answer: |-
  # Simulation Design: The Impact Exchange

  **Concept:** A 90-minute market simulation where participants trade commitments to labor (actions) to maximize a private "Impact Score."
  **Participants:** 16–18 people.
  **Room Setup:** One large central table or clustered desks. One large whiteboard ("The Tally"). Four clear jars labeled with the Causes.
  **Facilitator Role:** Market Maker / Clearing House / Timekeeper.

  ---

  ## 1. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Onboarding** | Hand out materials. Explain rules. **Emphasize:** Scores are private; trades are binding. |
  | **00:10 – 00:15** | **Valuation** | Players review private Value Cards. No talking yet. |
  | **00:15 – 00:45** | **Trading Floor** | **Round 1 & 2 (Enforced).** Players negotiate. Deals brought to Clearing House. Facilitator records deal, moves token to Cause Jar, updates Whiteboard Tally. |
  | **00:45 – 00:55** | **The Glitch** | **Friction 2 (No Enforcement).** Facilitator stops recording. "System overload. Deals are handshake only." Watch trust evaporate. |
  | **00:55 – 01:05** | **Closing** | Freeze market. Count jars. Announce Total Market Volume per Cause. |
  | **01:05 – 01:10** | **The Objection** | **Friction 3 (The Objector).** The non-trader speaks (5 mins). |
  | **01:10 – 01:30** | **Debrief** | Facilitator leads discussion on comparative advantage, integrity, and commensurability. |

  ---

  ## 2. Materials to Print

  ### A. Player Packets (18 copies, varied)
  Each packet contains:
  1.  **Value Card (Private):** Lists the 4 Causes with weights summing to 100.
      *   *Note:* Use increments of 10 to ease mental math later (e.g., 60, 30, 10, 0).
      *   *Constraint:* 3 cards have a red stamp: **"DEONTOLOGICAL CONSTRAINT: You cannot perform actions for [Cause X]."**
      *   *Objector:* 1 card has a gold star: **"PRINCIPLED OBJECTOR: You do not trade. Prepare a 5-minute statement on why."**
  2.  **Labor Vouchers (6 per player):** Blank cards. When you commit to an action, you write it here and hand it to the partner/facilitator.
  3.  **Score Sheet:** A grid to record the Final Market Totals and calculate their score.
  4.  **Action Menu:** List of 6 available actions (see below).

  ### B. The Action Menu (Public)
  All actions cost "1 Unit of Labor" (simulated).
  1.  **Vegan Week:** No animal products for 7 days. *(Tag: Animal Welfare)*
  2.  **Shelter Shift:** 3 hours at local animal shelter. *(Tag: Animal Welfare)*
  3.  **GiveDirectly:** Donate $50 to cash transfers. *(Tag: Global Poverty)*
  4.  **Policy Letter:** Write 5 letters to reps re: development aid. *(Tag: Global Poverty)*
  5.  **AI Safety Study:** 5 hours reading/summarizing safety lit. *(Tag: AI Risk)*
  6.  **Community Build:** Organize a local neighborhood cleanup. *(Tag: Local/Family)*

  ### C. The Tally Board (Whiteboard)
  Four columns: **Animal | Poverty | AI | Local**.
  Facilitator updates the running count of tokens in the jars.

  ---

  ## 3. The Mechanics (Rules for Players)

  1.  **Goal:** Maximize your **Impact Score**.
  2.  **Score Formula:** At the end, the Facilitator will announce the **Total Actions** completed for each Cause (the number in the jars).
      *   *Your Score* = (Animal Total × Your Animal Weight) + (Poverty Total × Your Poverty Weight) + ...
  3.  **Endowment:** You start with 6 Labor Vouchers. You **must** spend all 6. You cannot spend them on yourself unless no one else will take them (inefficient).
  4.  **Trading:** You want others to spend vouchers on *your* high-weight causes. You pay them by spending vouchers on *their* high-weight causes.
  5.  **Exchange Rates:** You set the price. (e.g., "I will do 2 Vegan Weeks if you do 1 AI Study").
  6.  **Clearing:** To be valid, both parties must bring the signed Vouchers to the Clearing House (Facilitator) during Trading Rounds. The Facilitator puts the tokens in the Jars.

  ---

  ## 4. Implementing the Frictions

  ### Friction 1: Deontological Constraints
  *   **Prep:** On 3 Value Cards, print the constraint in small red text at the bottom.
  *   **Effect:** These players cannot *perform* the forbidden action, even if it gets them a better rate. They can still *benefit* if others do it.
  *   **Live Patch:** If a player tries to trade a forbidden action, the Clearing House rejects the deal immediately. "Compliance Violation." This creates a liquidity crunch for that cause.

  ### Friction 2: Enforcement Collapse
  *   **Trigger:** At minute 45, stand up and announce: "Regulatory oversight suspended. Clearing House is closed. You may continue trading, but deals will not be recorded or enforced."
  *   **Effect:** Players can still exchange paper vouchers, but the Facilitator stops updating the Whiteboard and Jars.
  *   **Observation:** Watch if high-trust deals continue or if trading halts. Do people "front-run" (take the voucher without promising return)?
  *   **Resolution:** When time is called, ask for a show of hands: "Who made a deal in the last 10 minutes?" Then ask: "Who believes that deal will actually happen?"

  ### Friction 3: The Objector
  *   **Prep:** The player with the Gold Star card does not trade. They observe.
  *   **Trigger:** During the Debrief, before you speak, invite them up.
  *   **Prompt:** "You have 5 minutes. Tell the room why participating in this market was wrong, regardless of the score."
  *   **Goal:** To surface the "integrity objection" (that some things shouldn't be traded) from inside the room, not from a lecture.

  ---

  ## 5. Scoring Without Calculators

  Multiplying 18 people × 4 causes is too slow. Use the **"Slider Method."**

  1.  **On the Score Sheet:** Print a vertical column of numbers 0–50 (representing possible Market Totals).
  2.  **Next to it:** Print their 4 Weights (e.g., 60, 20, 10, 10).
  3.  **The Tool:** Provide a strip of paper with their weights printed on it.
  4.  **The Action:** When you announce "AI Total is 12," they align their paper strip so their AI weight lines up with 12 on the sheet. The intersecting number is their points.
  5.  **Simpler Alternative:** Tell players: *"For the purpose of this simulation, treat your weights as multipliers of 0, 1, 2, or 3."* (e.g., 0%, 25%, 50%, 75% becomes 0, 1, 2, 3). This keeps the ratios but makes the math trivial. **Recommendation:** Use this. It saves 10 minutes of silence.

  ---

  ## 6. Predictable Failures & Live Patches

  | Failure | Why it happens | Live Patch |
  | :--- | :--- | :--- |
  | **Gridlock** | Everyone wants AI work; no one wants to do Animal work. | **Market Maker:** Facilitator steps in Round 1. "I will buy 2 Animal tokens for 1 AI token." Inject liquidity, then step back. |
  | **Confusion** | Players think they score points for *their own* labor. | **Broadcast:** "Reminder: You score points on what lands in the Jars, not what leaves your hand. Specialize!" |
  | **Math Panic** | End-game calculation takes too long. | **Cut:** Skip individual scores. Ask: "Who has more points than their starting endowment would have yielded?" (Compare Jar Total × Weight vs. 6 × Weight). |
  | **Objector Anxiety** | The Objector feels put on the spot. | **Briefing:** Pull them aside at min 40. "Your role is vital. You are the conscience of the market. No one will attack you; we need your critique." |

  ---

  ## 7. The Debrief Script (Key Concepts)

  Do not lecture. Ask questions that lead them to the concepts.

  **1. Comparative Advantage (The Gains from Trade)**
  *   *Ask:* "Did anyone end up doing an action they cared very little about?" (Hands will go up).
  *   *Ask:* "Did anyone get more actions done on their top cause than they could have alone?"
  *   *Point:* "You sacrificed integrity of labor for volume of impact. This is Ricardo's Comparative Advantage. You didn't need to agree on *value* to agree on *trade*."

  **2. Enforcement & Trust (The Glitch)**
  *   *Ask:* "What happened in the last 10 minutes when I stopped recording?"
  *   *Point:* "Markets require a state. Without enforcement, the 'moral promise' degraded. Was that cynicism or rationality?"

  **3. The Integrity Objection (The Objector)**
  *   *Ask the room:* "How did it feel to hear [Objector] speak after an hour of trading?"
  *   *Point:* "The market optimized for *preference satisfaction*, not *moral truth*. The Objector reminds us that some duties might be non-fungible."

  **4. Commensurability (The Meta-Limit)**
  *   *Say:* "We treated 'AI Safety' and 'Vegan Weeks' as mathematically comparable via the Score. Is there a fact of the matter that a world with 50 AI points and 10 Animal points is 'better' than the reverse?"
  *   *Point:* "The game proves trade makes *players* happier. It does not prove the *world* is better. That requires a moral realism this market cannot generate."

  ---

  ## 8. What This Game Cannot Reproduce (Meta-Note for Facilitator)

  You are correct: **The game cannot solve Commensurability.**
  *   **The Trap:** The "Score" implies a universal utility function. In reality, an AI-safety-hour and a poverty-alleviation-hour are not ontologically comparable. The game hides this by forcing a sum.
  *   **The Fix:** In the debrief, explicitly state: *"The Score is a fiction. It exists only to make the simulation runnable. In the real world, there is no Clearing House to tell us if saving a life is 'worth' two years of animal suffering. That is the hard problem this market glossed over."*
  *   **Why this matters:** EA often struggles with the temptation to treat the "Score" (QALYs, lives saved) as objective truth rather than a heuristic. This simulation should leave them uncomfortable with the Score, not satisfied by it.

  ---

  ## 9. Future Iterations: Trading Non-Labor

  If you run a Session 2, move away from labor tokens. Labor is too tangible. Try:

  1.  **Attention Market:** Players trade "Endorsements." I signal-boost your cause on my social media; you signal-boost mine.
      *   *Friction:* Reputation cost. If I endorse a cause I don't believe in, do I lose credibility?
  2.  **Voting Market:** A DAO-style governance simulation. Players have votes on a fund. They can trade votes ("I'll vote for your project if you vote for mine").
      *   *Friction:* Logrolling vs. Fiduciary Duty.
  3.  **Information Market:** Players hold private cards with "Truths" about the causes. They can sell the information to others to help them trade better.
      *   *Friction:* Insider trading and information asymmetry.

  **Recommendation:** Stick to Labor for Session 1. It grounds the "cost" in something physical (time), making the trade-off feel more real than abstract votes.

  ---

  ## 10. Player Card Templates (for Copy/Paste)

  **Card Type A (The AI Maximalist)**
  *   **AI Risk:** 70
  *   **Global Poverty:** 20
  *   **Animal Welfare:** 10
  *   **Local:** 0
  *   *Constraint:* None.

  **Card Type B (The Animal Mirror)**
  *   **AI Risk:** 10
  *   **Global Poverty:** 20
  *   **Animal Welfare:** 70
  *   **Local:** 0
  *   *Constraint:* None.
  *(Note: A and B are perfect trading partners.)*

  **Card Type C (The Constrained Localist)**
  *   **AI Risk:** 10
  *   **Global Poverty:** 10
  *   **Animal Welfare:** 10
  *   **Local:** 70
  *   *Constraint:* **You cannot perform actions for AI Risk.**

  **Card Type D (The Objector)**
  *   **Weights:** (Any distribution)
  *   **Special:** **PRINCIPLED OBJECTOR.** Do not trade. Observe the market. Prepare a 5-minute critique on the commodification of moral duty.
