prompt: |-
  I'm in a metaethics reading group and we've spent three weeks circling the Frege-Geach problem, and I want to stop reading proposed solutions until I know what a solution would even have to do. So before I open another expressivist paper, write me the desiderata: the full spec that any theory of moral thought and talk has to meet if it's going to handle embedding. I want the list of requirements with the case that generates each one, so I can see why it's a requirement and not just something one camp happens to want. Some of the cases we've been yelling about, so you can see the shape of what I mean: (a) a flat assertion, "telling your brother you broke the vase was wrong"; (b) that very same clause sitting unasserted as the antecedent of "if telling him was wrong, then you owe him an apology" -- nobody asserts it there, and yet the argument "if it was wrong then you owe him an apology; it was wrong; so you owe him an apology" is valid, and the validity cant be an artifact of the word "wrong" quietly changing its job between the premise and the antecedent; (c) negation, where "it wasnt wrong" has to be the contradictory of "it was wrong" and not merely the absence of disapproval -- a friend keeps saying the expressivist gets "I don't disapprove" where we need "not wrong," and I want that on the list as a requirement with a reason behind it, not as a gotcha; (d) embeddings that aren't "if" or "not": "it was probably wrong," "was it wrong?", "he believed it was wrong," "it was wrong because he trusted you," and the suppositional "suppose lying is wrong -- then what you did was wrong too"; (e) the genuinely mixed ones, like "if lying is wrong then the boss will hear about it," moral antecedent and descriptive consequent, where the whole conditional still looks truth-apt; (f) arguments where no moral sentence is ever asserted at all, like modus tollens off the conditional. Two more things I want the list to confront head on. First, whatever the theory says, the logic has to be one logic: validity in the moral argument can't be a different relation from validity in the descriptive one, or the whole thing is a verbal trick. Second, the requirement that makes the game hard -- the theory has to stay expressivist, i.e. it can't earn its way to embedding by quietly handing "wrong" a full-blooded truth-conditional semantics and a property, because then my classmate is right that it's just realism with extra steps.

  So: give me the requirements list with the consideration behind each, mark which are non-negotiable and which are really just preferences of a particular camp (whether the theory owes a compositional semantics for the surface syntax, whether it has to preserve classical logic as-is, whether it has to avoid positing moral properties altogether, whether "true" has to come out deflationary, and so on), and flag any subset you think can't be jointly satisfied -- that's the part I most want, so be explicit about which pairs are in tension and why, and say which single requirement does the most work in ruling out the expressivist strategies people actually defend. Skip the full scorecard against every contender, I'll do that in the group, but tell me in a sentence or two which horn you'd sacrifice first, embedding or staying-expressivist, and why.

  And at the end, tell me what would change your mind: which case or argument would move one of your non-negotiables over into the negotiable column, and where in your own reasoning you think you're most likely to be wrong. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is in a metaethics reading group, stuck on the Frege-Geach (F-G) problem. They want to stop reading solutions until they understand *what* a solution needs to achieve (the desiderata/spec).
      *   **Task:** Write a list of requirements (desiderata) for any theory of moral thought and talk to handle embedding.
      *   **Specifics:**
          *   Include the case generating each requirement (using the user's examples: flat assertion, unasserted antecedents, negation, other embeddings, mixed conditionals, unasserted arguments).
          *   Address two meta-requirements: One Logic (validity must be uniform) and Stay Expressivist (no cheating into realism).
          *   Distinguish Non-Negotiable vs. Camp Preferences (e.g., compositional semantics, classical logic, moral properties, deflationary truth).
          *   Flag tensions/incompatibilities (which pairs can't be jointly satisfied).
          *   Identify the single requirement doing the most work in ruling out expressivist strategies.
          *   Personal stance: Which horn to sacrifice first (embedding vs. staying-expressivist) and why.
          *   Mind-changing condition: What argument/case would move a non-negotiable to negotiable, and where the AI might be wrong.
      *   **Tone/Style:** American English, direct, philosophical but accessible (no fluff), acknowledging the frustration of the reading group.

  2.  **Deconstruct the Frege-Geach Problem (Mental Sandbox):**
      *   *Core Issue:* Expressivism says "X is wrong" = "Boo X!" (non-cognitive attitude). But logic works on propositions (truth-apt content). How can "Boo X!" function in "If Boo X!, then..."?
      *   *The "Spec":* A theory needs to explain how moral sentences work in complex contexts without losing their expressive nature or breaking logic.
      *   *User's Examples:*
          *   (a) Assertion: Standard expressivist turf.
          *   (b) Embedding/Validity: Modus Ponens. Content must be stable.
          *   (c) Negation: Contradiction vs. absence of attitude.
          *   (d) Other embeddings: Probability, questions, belief reports, explanations.
          *   (e) Mixed Conditionals: Moral + Descriptive.
          *   (f) Unasserted Arguments: Validity without assertion.
      *   *Meta-Constraints:* One Logic (validity is validity), Stay Expressivist (no realist properties).

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to formalize the user's examples into general requirements.
      *   *Requirement 1: Content Stability.* (Cases a & b). The meaning of "wrong" in "It is wrong" must match the meaning in "If it is wrong."
      *   *Requirement 2: Logical Negation.* (Case c). "Not wrong" must contradict "wrong," not just express a different/lack of attitude.
      *   *Requirement 3: Compositional Semantics.* (Case d). The meaning of the complex sentence must be a function of the parts.
      *   *Requirement 4: Mixed Embedding.* (Case e). Moral and descriptive content must mix seamlessly in conditionals.
      *   *Requirement 5: Validity Preservation.* (Case f & Meta 1). Arguments valid in descriptive logic must be valid in moral logic using the same rules.
      *   *Requirement 6: Expressivist Fidelity.* (Meta 2). Cannot posit robust moral properties or truth-conditions that mimic realism.

  4.  **Categorizing: Non-Negotiable vs. Preference:**
      *   *Non-Negotiable:* Content Stability, Logical Negation, Validity Preservation (One Logic). If you fail these, you haven't solved F-G.
      *   *Preference/Camp:* Compositional Semantics (some pragmatists might dodge this), Classical Logic (some might adopt non-classical logic), Deflationary Truth (some expressivists accept truth, just not robust truth), Avoiding Properties (this is the definition of expressivism, so it's non-negotiable *for expressivism*, but negotiable if one becomes a quasi-realist). *Correction:* The prompt asks what a theory needs to meet *if it's going to handle embedding* while *staying expressivist*. So "Stay Expressivist" is a constraint of the project, not necessarily a truth of the universe. I need to clarify this distinction.
      *   *Refinement:* Let's stick to the prompt's framing: "Non-negotiable" for a *successful solution to F-G for an expressivist*.
      *   *Actually, the prompt asks:* "mark which are non-negotiable and which are really just preferences of a particular camp." This implies philosophical neutrality where possible.
      *   *Decision:*
          *   Non-Negotiable (for logic/meaning): Content Stability, Negation as Contradiction, One Logic.
          *   Camp Preference/Debatable: Strict Compositionality (pragmatics might help), Classical Logic (maybe intuitionistic?), Deflationary Truth (some expressivists embrace truth predicates), No Properties (this is the expressivist constraint, but a solution might force us to drop it).

  5.  **Identifying Tensions (The "Hard Part"):**
      *   *The Big Tension:* **Content Stability + One Logic + Stay Expressivist.**
      *   Specifically: **Logical Negation (c) vs. Stay Expressivist.** Expressivism defines "wrong" as an attitude. Negation of an attitude ("I don't boo") isn't the same as the attitude of negation ("Boo not"). This is the "Negation Problem" (Schroeder/Blackburn).
      *   **Compositionality vs. Expressivism:** If you build a compositional semantics that handles embedding, you usually end up with proposition-like objects. If those objects look too much like truth-conditions, you've become a realist (Quasi-Realism slide).
      *   **The Single Requirement doing the most work:** *Content Stability in Unasserted Contexts.* This forces the expressivist to posit a "content" distinct from the "force," which threatens the core expressivist insight.

  6.  **Personal Stance (AI Persona):**
      *   I need to pick a side on "Embedding vs. Staying Expressivist."
      *   *Philosophical Consensus:* Most contemporary metaethicists think Quasi-Realism (Blackburn/Gibbard) *mostly* works, but the "Negation Problem" is a serious scar.
      *   *My Choice:* I will argue that **Embedding/Logic** is the non-negotiable. If a theory breaks logic, it's useless. If it has to become Quasi-Realist (looking like realism) to save logic, so be it. But if it has to become *Realist* (positing properties), then Expressivism fails.
      *   *Wait, the prompt asks:* "which horn you'd sacrifice first, embedding or staying-expressivist."
      *   *My Answer:* I'd sacrifice **Staying-Expressivist**. Logic and semantic compositionality are too fundamental to language. If expressivism can't handle "if," it's dead. If saving "if" requires accepting truth-apt moral propositions (Quasi-Realism bordering on Realism), then Expressivism was the wrong starting point.

  7.  **Mind-Changing Condition:**
      *   What would make me think Expressivism can work? A robust account of *normative* logic that isn't just descriptive logic in disguise. Or a pragmatic solution that explains validity without propositional content (e.g., inferential role semantics that doesn't collapse into truth-conditions).
      *   Where am I likely wrong? Underestimating the power of Inferential Role Semantics (Brandom/etc.) to save expressivism without truth-conditions.

  8.  **Review and Refine:**
      *   *Check Constraints:* American English? Yes. List format? Yes. Cases linked to requirements? Yes. Tensions flagged? Yes. Single requirement identified? Yes. Sacrifice choice? Yes. Mind-change? Yes.
      *   *Tone Check:* Don't be condescending. Acknowledge the difficulty. The user is frustrated; validate that.
      *   *Specific User Cases:* Ensure (a) through (f) are explicitly mapped.
      *   *Meta-Requirements:* Ensure "One Logic" and "Stay Expressivist" are integrated.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   Make sure I distinguish between "Quasi-Realism" (expressivist trying to earn the right to talk like a realist) and "Realism" (ontological commitment). The prompt warns against "realism with extra steps." I need to be careful there.
      *   Ensure the "Negation" point is sharp. That's the friend's objection.
      *   Make sure the "One Logic" point is clear. Validity can't be equivocal.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the specification list you asked for. I've stripped out the history and the names of the theorists so you can focus on the structural constraints. I have categorized them by **Non-Negotiable** (if you fail this, you haven't solved the problem) and **Camp Preference** (this is where theories diverge based on prior commitments).

  At the end, I've flagged the tensions, identified the "killer" requirement, and given you my own verdict on which horn to cut.

  ### The Desiderata Spec for Handling Embedding

  **1. Content Stability (The Frege-Geach Constraint)**
  *   **The Case:** Your examples (a) and (b). In "It was wrong" (asserted) and "If it was wrong..." (unasserted antecedent), the word "wrong" must contribute the same semantic content to both sentences.
  *   **The Requirement:** The theory must assign a semantic value to moral terms that remains constant regardless of whether the sentence is asserted, questioned, or embedded.
  *   **Why Non-Negotiable:** If the meaning shifts between the premise and the antecedent, the argument commits the fallacy of equivocation. The validity of Modus Ponens depends on the identity of the term $p$ in both spots. If expressivism says $p$ means "Boo!" in the premise but something else in the antecedent, it hasn't explained validity; it's explained it away.
  *   **Status:** **Non-Negotiable.**

  **2. Contradictory Negation**
  *   **The Case:** Your example (c). "It wasn't wrong" must be the logical contradictory of "It was wrong."
  *   **The Requirement:** The theory must explain how negating a moral sentence results in a contradiction, not merely a different or absent psychological state. "I do not disapprove" is compatible with "I disapprove" (I might be undecided), but "Not wrong" is incompatible with "Wrong."
  *   **Why Non-Negotiable:** Classical logic requires that $P$ and $\neg P$ cannot both be true. If expressivism analyzes "Wrong" as *Disapproving*, then "Not Wrong" becomes *Not Disapproving*. But one can fail to disapprove without approving. The logic breaks unless the negation operates on the content, not just the attitude.
  *   **Status:** **Non-Negotiable.**

  **3. One Logic (Validity Uniformity)**
  *   **The Case:** Your example (f) and Meta-Requirement 1. An argument like "If lying is wrong, then the boss will hear; the boss won't hear; so lying isn't wrong" must be valid for the *same reason* that "If it rains, the grass is wet; grass isn't wet; so it didn't rain" is valid.
  *   **The Requirement:** The relation of logical consequence must be univocal. You cannot have "moral validity" and "descriptive validity" as two different relations that just look alike.
  *   **Why Non-Negotiable:** If validity is equivocal, we can't reason from moral premises to descriptive conclusions (or vice versa). It renders mixed discourse impossible. Logic is the engine of inference; if the engine changes depending on the fuel, the car doesn't run.
  *   **Status:** **Non-Negotiable.**

  **4. Compositional Semantics**
  *   **The Case:** Your example (d). "Probably wrong," "Was it wrong?", "He believed it was wrong."
  *   **The Requirement:** The meaning of the complex sentence must be determined by the meanings of its parts and the way they are combined. You cannot treat "If wrong then..." as a sui generis idiom; it must be built from "If," "Wrong," and "Then."
  *   **Why Camp Preference:** Some pragmatists argue we can explain understanding through use-rules rather than strict semantic composition. However, most semanticists view this as non-negotiable for a systematic theory of language.
  *   **Status:** **Strong Preference (bordering on Non-Negotiable).**

  **5. Mixed Conditional Aptness**
  *   **The Case:** Your example (e). "If lying is wrong, then the boss will hear."
  *   **The Requirement:** The theory must explain how a sentence with a moral antecedent and descriptive consequent functions as a unified claim that can be believed, asserted, or denied.
  *   **Why Non-Negotiable:** We actually reason this way. If the theory says this sentence is semantically defective or lacks a truth-value while we treat it as true, the theory fails to describe actual linguistic practice.
  *   **Status:** **Non-Negotiable.**

  **6. Expressivist Fidelity (No Cheat Codes)**
  *   **The Case:** Meta-Requirement 2.
  *   **The Requirement:** The solution cannot solve embedding by simply positing robust moral properties and truth-conditions that mirror realism. It must ground the semantics in non-cognitive states (plans, attitudes, commitments) without secretly turning those states into belief-like representations of reality.
  *   **Why Camp Preference:** This is the definition of the project. If you drop this, you win the battle (embedding works) but lose the war (you're a realist). However, from a neutral metaphysical standpoint, this is a constraint *you* are imposing, not a constraint logic imposes.
  *   **Status:** **Non-Negotiable (for an Expressivist Solution).**

  **7. Deflationary Truth**
  *   **The Case:** Implicit in (a) and (e).
  *   **The Requirement:** The theory should ideally explain moral truth as deflationary (e.g., "It is true that X is wrong" just means "X is wrong") rather than robust correspondence.
  *   **Why Camp Preference:** Realists demand robust truth. Expressivists (Quasi-Realists) want deflationary truth. You can solve embedding with robust truth (become a realist), but that violates Requirement 6. You can try to solve it with deflationary truth, but it's harder.
  *   **Status:** **Camp Preference.**

  ---

  ### The Tensions: Where the Spec Breaks

  You asked for the pairs that cannot be jointly satisfied. Here is the friction points.

  **1. Content Stability (1) vs. Expressivist Fidelity (6)**
  *   **The Tension:** To keep content stable across asserted and unasserted contexts, you need a "content" that is distinct from the "force" of assertion. Realists have this easily (the proposition). Expressivists traditionally identify meaning with the attitude expressed. If you separate them to save Content Stability, you start looking like you're positing a proposition-like object that the attitude is "about."
  *   **The Risk:** This is the slide into Quasi-Realism. If the "content" behaves exactly like a truth-condition, the distinction between "expressing an attitude" and "describing a fact" becomes verbal.

  **2. Contradictory Negation (2) vs. Expressivist Fidelity (6)**
  *   **The Tension:** This is the **Negation Problem** (often associated with Mark Schroeder). If "Wrong" = *Disapproving*, then "Not Wrong" should = *Not Disapproving*. But as noted, *Not Disapproving* is not the contradictory of *Disapproving*. To get a real contradiction, you need to negate the *content* of the attitude, not the attitude itself. But if there is a content separate from the attitude that can be negated, what is that content? If it's not a property, what is it?
  *   **The Risk:** This is the hardest technical hurdle. Many expressivist solutions handle conditionals well but crash on negation.

  **3. One Logic (3) vs. Expressivist Fidelity (6)**
  *   **The Tension:** Standard logic (classical validity) is defined over truth-apt propositions. If moral sentences aren't truth-apt (per strict expressivism), they technically fall outside the domain of standard logic. To keep One Logic, you must make moral sentences truth-apt. To stay Expressivist, you must say they aren't truth-apt in the *realist* sense.
  *   **The Risk:** You end up inventing a new logic (e.g., a logic of attitudes) which violates One Logic, or you stretch "truth-apt" until it means nothing (Deflationism), which risks making the theory trivial.

  ### The "Killer" Requirement

  The single requirement doing the most work in ruling out expressivist strategies is **Content Stability (1)**.

  **Why:** It forces the expressivist to posit a semantic value for "wrong" that survives outside of an actual expression of attitude. Once you have a semantic value that persists in the antecedent of a conditional, behaves under negation, and combines compositionally, you have effectively built a proposition. The moment you have a proposition, the motivation for expressivism (that moral language *isn't* propositional description) evaporates. This requirement forces the expressivist to earn the right to use propositional machinery without admitting they are using propositional machinery. That is the "Quasi-Realist" tightrope, and it is where most attempts fall.

  ### My Verdict: Which Horn to Sacrifice?

  If I have to choose between **Embedding (Logic/Content Stability)** and **Staying-Expressivist (No Robust Properties)**:

  **I would sacrifice Staying-Expressivist.**

  **Why:** Logic and compositionality are the infrastructure of cognition and communication. If a theory requires us to treat moral reasoning as fundamentally different from descriptive reasoning (violating One Logic) or fails to explain how we understand "If wrong, then..." (violating Content Stability), it fails to account for how we actually think. We *do* reason morally using Modus Ponens. We *do* treat negation as contradictory. If the only way to save that data is to admit that moral sentences function as truth-apt propositions describing normative properties (Realism), then Expressivism was a false start. It is better to be a realist with a working logic than an expressivist with a broken one. Quasi-realism often looks like "realism with extra steps" because the steps are there to hide the fact that you've arrived at realism.

  ### What Would Change My Mind

  **The Argument:** A successful **Inferential Role Semantics (IRS)** that decouples validity from truth-conditions entirely.

  **The Condition:** If someone could demonstrate that logical validity is not a relation between truth-bearing propositions, but a relation between *commitments* or *plans* (e.g., Allan Gibbard's norm-expressivism or Robert Brandom's inferentialism), such that the "Negation Problem" is dissolved by showing that *rejecting a plan* is structurally identical to *negating a proposition* without positing a proposition.

  **Where I Might Be Wrong:** I am likely underestimating the power of **Deflationary Truth**. I treat "truth-apt" as a heavy metaphysical commitment. If a Quasi-Realist can convince me that "truth" is just a device for endorsement (disquotationalism) and that "properties" are just shadows of predicates, then the tension between Requirement 1 and Requirement 6 disappears. If "moral property" doesn't mean "queer metaphysical entity" but just "whatever moral predicates track," then Realism and Expressivism might be the same theory wearing different hats. If that's true, I'm fighting a verbal ghost, and the Expressivist can keep their title without sacrificing Logic. I remain skeptical that the metaphysics can be washed away that easily, but that is the weakest point in my own reasoning.
