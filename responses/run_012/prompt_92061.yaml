      *   *Reading 3 (Aggregation):* Standard sum utilitarianism yields $\infty$ for many plausible worlds. If World A = $\infty$ and World B = $\infty - 100$, standard arithmetic says $\infty = \infty$. So the finite loss *doesn't* change the sum, but it doesn't mean the loss is *irrelevant* (Pareto principle suggests A > B). Verdict: Defensible thesis (in some frameworks) but doesn't support the "gamble anything" conclusion without more axioms.
