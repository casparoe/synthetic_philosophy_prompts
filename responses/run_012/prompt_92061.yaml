answer: |-
  Here is a breakdown of the argument your group member is making, dissected by the formal machinery actually used in infinite ethics and decision theory. You can bring this list directly to the group.

  ### The Menu of Readings
  Your friend's claim ("infinity minus finite is still infinity") is ambiguous. In the literature, this sentence could correspond to five distinct technical claims. Here is the menu, categorized by the mathematical/philosophical framework being invoked.

  **1. The Cardinal Arithmetic Reading**
  *   **The Claim:** Value is isomorphic to cardinal numbers (sizes of sets). Since $|\mathbb{N}| - n = |\mathbb{N}|$, removing finite disvalue from an infinite set leaves the value unchanged.
  *   **Technical Status:** **Category Error / Triviality.**
  *   **Analysis:** This is mathematically true for cardinals ($\aleph_0$), but ethically vacuous. Ethics is not about counting existences; it is about *weighting* them. Even if the *number* of happy people remains $\aleph_0$, the *pattern* of utility has changed. Standard infinite utilitarianism (e.g., Vallentyne & Kagan) rejects cardinality as the sole metric for value comparison because it violates the Pareto principle (if everyone is slightly worse off, the world should be judged worse, even if both are infinite).

  **2. The Extended Real Number Reading (Aggregation)**
  *   **The Claim:** Total value is the sum of a series in the extended reals $[-\infty, +\infty]$. If $\sum V = \infty$, then $\sum V - k = \infty$.
  *   **Technical Status:** **False (or Undefined).**
  *   **Analysis:** In standard analysis, $\infty - \infty$ is undefined. If the background world already contains infinite value (e.g., an eternal future), subtracting a finite harm (climate change) leaves you with $\infty - \text{finite} = \infty$. *However*, this makes *all* infinite worlds equal. If World A has $\infty$ utility and World B has $\infty + 1$ utility, standard summation says they are equal. This violates basic intuition. Most infinite ethicists (Bostrom, Arntzenius) argue we must use **orderings** (like "Overtaking" or "Catching Up" criteria) rather than simple sums to distinguish between infinite worlds. Under Overtaking criteria, a finite loss *does* matter because World A will eventually exceed World B at every time step.

  **3. The Lexical Priority Reading (Ordering)**
  *   **The Claim:** Infinite value is lexically superior to finite value. Any amount of infinite good outweighs *any* amount of finite bad, regardless of probability.
  *   **Technical Status:** **Defensible Thesis (Non-Archimedean).**
  *   **Analysis:** This requires abandoning the Archimedean axiom of standard utility theory (which states that for any two goods, there is some probability mixture that makes you indifferent). If you accept Non-Archimedean utility (e.g., using Hyperreals or Surreal Numbers), then yes, an infinite good lexically dominates finite harms.
  *   **Catch:** This leads to "Lexical Fanaticism." It implies you should ignore all finite welfare to pursue infinite welfare. While logically consistent within that specific axiomatic system, it is widely rejected in decision theory because it makes agents vulnerable to money pumps and ignores probability sensitivity.

  **4. The Expected Value Reading (Decision Theory)**
  *   **The Claim:** Expected Value (EV) = Probability $\times$ Payoff. If Payoff = $\infty$ and $p > 0$, then $EV = \infty$. Therefore, the action dominates any finite alternative.
  *   **Technical Status:** **Defensible Thesis (with major caveats).**
  *   **Analysis:** This is the core of "Pascalian Fanaticism." In standard Von Neumann-Morgenstern utility theory, utilities must be real-valued (finite) to guarantee the existence of a maximum. If you allow infinite utilities, the Expectation Rule breaks down (you get indeterminacy when comparing two infinite expectations).
  *   **Catch:** To make this work, you need a decision rule for infinite expectations (e.g., "Maximize probability of infinite outcome"). But this leads to the **St. Petersburg Paradox** on steroids. It implies you should mortgage the earth for a $10^{-100}$ chance of heaven. Most decision theorists (e.g., Easwaran, Nover & Hájek) argue this is a *reductio ad absurdum* of allowing infinite utilities in EV calculations, not a valid guide to action.

  **5. The Measure Theory Reading (Spacetime Integration)**
  *   **The Claim:** Value is an integral over spacetime. If the domain is infinite, the integral diverges. Finite changes to the integrand do not change the divergence.
  *   **Technical Status:** **True but Irrelevant.**
  *   **Analysis:** Mathematically, changing a function on a set of finite measure does not change the divergence of the integral over an infinite domain. However, ethics cares about the *local* properties of the integrand, not just the global divergence. This reading conflates the *convergence of the sum* with the *goodness of the state*. A world where everyone suffers slightly less is better, even if the total integral diverges in both cases.

  ---

  ### Diagnosis: What is your friend actually relying on?

  He is conflating **Reading 1 (Cardinal Arithmetic)** with **Reading 4 (Expected Value)**.

  He is treating "Infinity" as a magical number that swallows finite numbers (Cardinal intuition) and then applying that to a decision matrix (Expected Value).
  *   **The Error:** He assumes that because the *sum* remains infinite, the *choice* is determined solely by the presence of infinity.
  *   **The Reality:** Even if the total sum is infinite, **Pareto principles** usually apply. If Act A causes finite harm and Act B does not, and both lead to infinite value, Act B is strictly better. The fact that the *total* is infinite in both cases does not make the finite harm irrelevant; it just means our aggregation method (simple summation) is too blunt to measure the difference. We need a more sensitive ordering (like Overtaking), which *will* register the finite harm.

  ---

  ### Do any of these readings get him his conclusion?

  **Conclusion A: "Finite harms (climate change) are irrelevant."**
  *   **Verdict:** **False.**
  *   **Reasoning:** Even in infinite ethics, the **Pareto Principle** is standard: If outcome X is better for some people and worse for none, X is better than Y. A finite harm makes some people worse off. Therefore, the world with the harm is worse than the world without it, even if both contain infinite value. Your friend's argument requires rejecting the Pareto principle, which is a much heavier bullet to bite than he realizes.

  **Conclusion B: "We should gamble anything on a nonzero chance of infinite payoff."**
  *   **Verdict:** **Defensible only if you accept "Fanaticism."**
  *   **Reasoning:** This follows *only* if you accept Non-Archimedean utility (Reading 3) and a specific decision rule for infinite expectations (Reading 4). However, this position is widely considered a bug, not a feature. It implies you should ignore a 99.9% chance of universal torture for a 0.1% chance of infinite bliss. Most formal decision theorists (e.g., Beckstead & Thomas, "A Paradox for Tiny Probabilities and Enormous Values") argue that rational agents *must* discount extremely low probabilities of infinite payoffs to avoid absurdity, or else bound their utility functions.

  ---

  ### Final Verdict: Is "Infinite Value" Coherent?

  **Verdict:** **Mathematically Coherent, Decision-Theoretically Pathological.**

  1.  **Mathematically:** Yes. We can model infinite value using Hyperreals, Surreals, or extended reals. We can define orderings on infinite streams of utility (e.g., the "Overtaking Criterion").
  2.  **Decision-Theoretically:** No, not without severe restrictions. Allowing unbounded infinite utilities in standard Expected Utility Theory leads to **indeterminacy** (you cannot compare two infinite expectations) or **fanaticism** (ignoring all finite goods).
  3.  **The Consensus:** The serious literature (Bostrom 2011, "Infinite Ethics"; Vallentyne 2000; Arntzenius 2014) does **not** conclude that finite harms don't matter. It concludes that:
      *   Simple summation fails for infinite worlds.
      *   We must use comparative principles (Overtaking/Catching Up).
      *   Under comparative principles, finite harms *do* reduce the value of a world, even an infinite one.
      *   We should likely bound our utility functions or discount low-probability infinite claims to avoid Pascalian mugging.

  **Recommendation for the Group:**
  Tell your friend his claim relies on a category error between set cardinality and utility aggregation. Ask him to specify his **ordering principle**. If he uses simple summation, he violates Pareto. If he uses Overtaking, finite harms matter. If he uses Lexical Priority, he must defend why he would accept universal torture for a epsilon chance of heaven.

  **Suggested Reading for the Group:**
  *   **Nick Bostrom,** *"Infinite Ethics"* (2011) – The canonical survey of the problem.
  *   **Peter Vallentyne & Shelly Kagan,** *"Infinite Value and Finitely Additive Value Theory"* (1997) – On why simple sums fail.
  *   **Frank Arntzenius,** *"Supertasks and the Measurement of Infinite Value"* – On the technical aggregation issues.
  *   **Thomas & Beckstead,** *"A Paradox for Tiny Probabilities and Enormous Values"* – On why the "gamble anything" conclusion is rejected.
