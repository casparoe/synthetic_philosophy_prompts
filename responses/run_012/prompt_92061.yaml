      *   *Reading 5 (Decision Rule/Dominance):* "Maximize probability of infinite value." If one act guarantees finite and another offers $p > 0$ of infinite, does the latter win? Only if you value infinite lexically higher than *any* finite sum. Verdict: Defensible thesis (Lexical Priority), but controversial.

