      *   *Part (b):* The "no artificial means" stipulation. Why? (To block "bootstrapping" or external causation of intention. If you can just pop a pill to intend, you don't need a *reason* to intend in the deliberative sense. It forces the intention to be formed via practical reasoning).
      *   *Part (c):* Distinction: Reason to *bring about* intention (causal/strategic) vs. Reason *favoring* the intention (normative/justificatory). Is the $1M a reason of the first, second, or both? (Standard Debate: Instrumentalists say only the first. Some say neither. Very few say the second, because intentions are judged by the action's merits. The student claims *both* and that they "come to the same thing here." This is a contentious claim).
      *   *Part (d):* Stability Norm (Bratman etc.). Intention involves settledness. Incompatible with knowing you won't do it. Assessment: Does it make intention impossible/irrational/no reason? (Standard view: It makes the intention irrational or impossible to form *rationally*, not necessarily impossible simpliciter. It suggests a constraint on rational intention formation).

