      *   Total: 31/35 seems generous but fair for the clarity. 30/35 is stricter. Let's aim for 31/35 (A-) because the writing is very clear and the philosophical instincts are mostly there, even if the specific theoretical move in (c) is bold. Actually, for an *upper-level* course, asserting bootstrapping without argument is a significant error. I will grade it 30/35 (B+).

