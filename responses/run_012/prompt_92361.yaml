answer: |-
  # JOINT STATEMENT ON THE ARCHITECTURE OF PERCEPTION
  **Undersigned:** [The Encapsulationist] & [The Penetrationist]

  ### I. AGREED CLAIMS

  We, the undersigned, having reviewed the literature and the constraints imposed on this collaboration, affirm the following claims. We sign these not as concessions, but as the shared foundation upon which our disagreement rests.

  1.  **The Existence of Top-Down Influence:** We agree that cognitive states (beliefs, desires, expectations, categories) causally influence the subject's interaction with the environment. Neither side denies that a subject who expects a stimulus will behave differently than one who does not. The dispute concerns *where* in the processing stream this influence exerts its primary effect.
  2.  **Methodological Dualism (The Two-Index Constraint):** We agree that no single measure exhausts the evidence. A complete assay of any alleged penetration effect requires both a report-based measure (sensitive to criterion shifts) and a criterion-free sensitivity measure (e.g., discrimination thresholds, aftereffects). We agree that a divergence between these indices is data, not noise, and must be explained by any successful theory.
  3.  **Process Architecture (The Three-Stage Stipulation):** We agree that the perceptual process can be analytically divided into Registration (encoding distal stimulus), Organisation (grouping and constancy), and Uptake (knowledge availability). We agree that the term "perception" is ambiguous across these stages and that clarity requires specifying which stage is under discussion.
  4.  **Temporal Modes (Online/Offline):** We agree that cognitive influence may be *offline* (reshaping the system via learning prior to the episode) or *online* (influencing the computation during the episode). We agree that demonstrating offline effects does not automatically prove online penetration, nor does proving offline plasticity vindicate encapsulation against online claims.
  5.  **Falsification Conditions:**
      *   **For Penetration:** The Penetrationist accepts that if, under strict controls for demand characteristics, all criterion-free sensitivity measures remain invariant across shifts in cognitive state (while report-based measures shift), the claim for *perceptual* penetration is falsified.
      *   **For Encapsulation:** The Encapsulationist accepts that if a criterion-free sensitivity measure (e.g., a shift in discrimination threshold or aftereffect magnitude) reliably tracks a manipulation of belief or desire *without* a corresponding change in the distal stimulus or low-level adaptation, the claim for strict informational encapsulation is falsified.
  6.  **The Evidential Weight of the Hypothetical Result:** We agree on the relevance of the following hypothetical outcome: If an expectation manipulation shifts the report-based index but leaves the criterion-free index untouched, while a physical stimulus change does the reverse, this dissociation is the critical battleground. We agree this result would not end the debate but would force a specific reckoning regarding the definition of perceptual content.

  ### II. RESIDUAL DISAGREEMENT AND CRUXES

  While we agree on the phenomena to be explained and the methods used to assay them, we disagree on the interpretation of the causal architecture. The table below isolates the specific cruxes where our positions diverge. In the "Formulation" columns, each author speaks in their own theoretical vocabulary.

  | Crux | Encapsulationist Formulation | Penetrationist Formulation | Shared Test Design | Advance Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Signature of the Perceptual** | Perception is defined by its proprietary format and informational limits. If an effect does not show up in criterion-free sensitivity (e.g., d-prime, aftereffects), it is not perceptual; it is a shift in judgement or response criterion. | Perception is defined by its phenomenal character and representational content. If a belief alters how the world looks or feels to the subject (captured by report), the perceptual episode itself is altered, regardless of discrimination thresholds. | **The Boundary Shift:** Induce expectation that a boundary stimulus (e.g., teal) belongs to Category A (Green) vs Category B (Blue). Measure (a) forced-choice categorization (report) and (b) discrimination threshold for hue differences near the boundary (sensitivity). | **Encap:** Report shifts; Thresholds remain stable. <br> **Pen:** Report shifts; Thresholds may shift or remain stable, but the *phenomenal salience* of the boundary changes. |
  | **2. The Locus of Influence (Stage)** | Effects attributed to penetration occur at the stage of **Uptake**. The perceptual module delivers a fixed output; cognition selects, interprets, or weights that output for decision and memory. | Effects attributed to penetration occur at the stage of **Organisation** (and potentially Registration). Cognitive states modulate the grouping or constancy computations *before* the scene is delivered for uptake. | **The Ambiguous Figure:** Train subjects to expect a specific 3D interpretation of an ambiguous wireframe. Measure (a) reported depth order and (b) low-level adaptation aftereffects specific to the perceived depth plane. | **Encap:** Adaptation tracks the *retinal* input, not the perceived depth. Report tracks expectation. <br> **Pen:** Adaptation tracks the *perceived* depth plane, indicating early organisational change. |
  | **3. Online vs. Offline Mechanism** | Apparent online effects are actually **Offline** reshaping. Long-term priors tune the system, but once the episode begins, the computation is closed to current beliefs. | Genuine **Online** penetration exists. Current goals or transient beliefs can modulate the weighting of sensory evidence *during* the computation, not just via long-term tuning. | **The Transient Prime:** Use a subliminal prime to induce a transient goal (e.g., "look for tools") immediately before a brief stimulus presentation, controlling for long-term expertise. Measure reaction time and sensitivity. | **Encap:** Any effect is due to response bias or pre-existing tuning. No modulation of sensitivity during the window. <br> **Pen:** Sensitivity to goal-relevant features increases specifically during the trial, indicating online modulation. |
  | **4. Interpretation of the Dissociation** | In the Hypothetical Result (Report moves, Sensitivity static), the percept is constant. The subject sees the same colour but *judges* it differently due to task demands or willingness to commit. | In the Hypothysical Result (Report moves, Sensitivity static), the percept is altered. Discrimination thresholds measure *acuity*, not *content*. One can see a scene differently without having better acuity for its parts. | **The Hypothetical Case:** Replicate the scenario where expectation shifts reports but not thresholds, while physical changes shift thresholds but not reports. | **Encap:** This proves perception is encapsulated; the report shift is post-perceptual noise. <br> **Pen:** This proves perception is distinct from acuity; the report shift captures the phenomenal change acuity misses. |

  ### III. ASSESSMENT OF THE VERBAL DISPUTE

  We conclude that the dispute is partially verbal, but not wholly so.

  **The Verbal Component:**
  A significant portion of our disagreement dissolves once we apply the **Three-Stage Stipulation**. If the Encapsulationist defines "perception" strictly as *Registration and Organisation* (computed prior to conceptual influence), and the Penetrationist defines "perception" as *Organisation and Uptake* (the conscious scene available to the subject), we are often describing the same causal chain with different boundary markers. When the Encapsulationist says, "That effect is post-perceptual," and the Penetrationist says, "That effect is perceptual," they are frequently agreeing on the *timing* of the effect (e.g., after grouping but before verbal report) but disagreeing on whether that timing falls inside or outside the label "perception." If we agree to ban the word "perception" in favour of "Registration," "Organisation," and "Uptake," roughly 40% of our terminological friction vanishes.

  **The Substantive Component:**
  However, a hard core of substantive disagreement remains regarding **Informational Flow**.
  1.  **Architecture:** The Encapsulationist claims the system computing *Organisation* is architecturally prevented from accessing belief-states as *inputs* to the computation. The Penetrationist claims belief-states act as *parameters* within that computation. This is a claim about neural or functional connectivity, not just labeling.
  2.  **The Status of Phenomenology:** The Encapsulationist treats criterion-free sensitivity as the only valid tracker of the perceptual state. The Penetrationist treats first-person report (phenomenology) as a valid tracker of perceptual content, even if acuity is unchanged. This is a disagreement about the metaphysics of perceptual content: is content defined by discriminability (Encapsulationist) or by phenomenal character (Penetrationist)?

  **Conclusion:**
  We agree that the "Two-Index Constraint" is the only way forward. If report-based measures shift while criterion-free measures remain static, the Encapsulationist must explain why the subject's conscious experience shifts without a change in sensory encoding, and the Penetrationist must explain why sensory encoding remains immune to the very beliefs that alter the experience. Until a study demonstrates a shift in a criterion-free measure driven solely by a high-level cognitive manipulation (controlling for offline learning), the Encapsulationist retains the default position. Until a study demonstrates that report-based shifts vanish when demand characteristics are rigorously removed, the Penetrationist retains the suspicion that phenomenology is being ignored. We sign this statement to acknowledge that the burden of proof is now shared, and the path to resolution is empirical, not merely conceptual.
