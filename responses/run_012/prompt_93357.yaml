      *   *Ergodicity:* Time averages = Ensemble averages. If history is ergodic, we can infer the long-run behavior from one long trajectory.
      *   *Martingale:* $E[X_{t+1} | X_t] = X_t$. This is the *null hypothesis* of no direction (random walk). Teleology rejects the martingale property.
