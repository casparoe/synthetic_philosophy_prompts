answer: |-
  This is a sharp reconstruction, and your flatmate has spotted the exact pressure points where Popper's argument is often misunderstood (or over-simplified). You are right to feel half-conceded: the flatmate is correct that your current draft proves too much, but you are also correct that the *prediction claim* is the real prize worth keeping.

  Here is the diagnosis.

  ### 1. Which step do you give up?
  **You must drop (or radically rewrite) Step 2.**

  > *2. History is the study of a single sequence of events — what actually happened, once, in this world.*

  **Why it looked fine:** It appeals to the intuition that "The Past" is unique. There is only one actual timeline. It feels like a solid ontological grounding for why history isn't like physics (which studies repeatable experiments).

  **Why it fails:** It conflates *the actual past* with *types of historical events*. While the timeline is singular, the *events* within it are not. There have been many revolutions, many hyperinflations, many sieges, many dynastic collapses. If there are multiple instances of "revolution," we can look for regularities across them. By defining history as a "single sequence," you artificially strip it of the sample size needed for induction, which triggers your flatmate's "singleton science" objection. Cosmology studies one universe, but it studies many stars, many galaxies, and many quantum events *within* that universe to derive laws. History does the same.

  **The Cost:** You lose the claim that history is *ontologically* unique in a way that precludes laws. You must admit that human behavior exhibits regularities that can be formulated as universal laws (psychology, economics, game theory).

  ### 2. What about Step 4?
  Your flatmate calls Step 4 "bookkeeping." He is half-right, but this is where you can salvage the distinction.

  > *4. A generalisation that does cover other cases... is a law of economics... not a law of history.*

  **The Fix:** Don't frame this as disciplinary turf wars ("that belongs to economics"). Frame it as **universality vs. trend**.
  A law of economics (e.g., price controls create shortages) applies to *any* society with markets, past, present, or future. A "law of history" (in the historicist sense Popper attacks) claims a specific trajectory for *this* sequence (e.g., "feudalism inevitably leads to capitalism").
  **Keep the spirit of (4), but change the wording:** "A genuine law must be universal. A generalisation that only holds for this specific epoch or sequence is not a law, but a *trend*."

  ### 3. Can you still get the Prediction Claim?
  **Yes, and it becomes stronger if you decouple it from the "No Laws" argument.**

  Your current draft tries to get to "no prediction" via "no laws." This is vulnerable. If your flatmate can show there *are* laws in history (e.g., demographic transitions), he thinks he's defeated the prediction claim.

  **The Popperian Shortcut:**
  Popper's real argument for unpredictability (which you mentioned in your prompt) does not rely on the absence of laws. It relies on the **Growth of Knowledge Argument**.
  1.  Human history is strongly influenced by the growth of human knowledge.
  2.  We cannot predict, by rational or scientific methods, the future growth of our scientific knowledge. (If we could, we would possess that knowledge now.)
  3.  Therefore, we cannot predict the future course of human history.

  **Why this is better:** It allows you to concede that there are "laws in history" (psychology, economics) while maintaining that the *system as a whole* is unpredictable. You can have laws governing the parts without having a law governing the trajectory of the whole. This neutralizes the flatmate's "singleton science" objection because cosmology doesn't have the "knowledge feedback loop" in the same way (the universe doesn't learn about its own laws and change its trajectory because of it).

  ### 4. What have you conceded if you shrug?
  If you adopt the slogan: *"No laws of history, but plenty of laws in history,"* here is what you have actually conceded and what you have saved:

  **You have conceded:**
  *   **Determinism of Human Action:** You admit that individuals and groups act according to regularities (incentives, cognitive biases, resource constraints). You cannot claim history is "magic" or purely contingent chaos.
  *   **Explanatory Power:** You admit we can explain *why* things happened retrospectively using universal laws (e.g., "The regime fell because of economic pressure + legitimacy crisis").

  **You have saved:**
  *   **Anti-Historicism:** You deny that there is a *master law* governing the sequence itself (e.g., "History moves toward liberty" or "History is class struggle").
  *   **Long-term Prediction:** You maintain that while we can predict short-term reactions based on laws (e.g., "If they print money, inflation will rise"), we cannot predict the long-term structural evolution of society because the *conditions* (knowledge/technology) change in unpredictable ways.

  ### 5. Confidence and Wobble

  **Confidence: 85%**
  I am highly confident that Step 2 is the logical weak point that invites the "singleton science" counter-example. I am also confident that decoupling the "prediction claim" from the "no laws claim" is the standard and most robust Popperian move. The "Growth of Knowledge" argument is Popper's specific contribution; the "no laws" argument is a more general positivist stance that is easier to attack.

  **The Wobble (Least Sure Part):**
  I am least sure about the status of **cosmology** in your flatmate's objection.
  While I agree his objection hurts *your* Step 3, there is a genuine philosophical debate about whether cosmology *is* a "singleton science" in a way that makes its laws different from laboratory physics. Some philosophers argue cosmological models are underdetermined in a way physics isn't, precisely because we have $N=1$ universe.
  If your flatmate is a sophisticated philosopher of science, he might argue that even cosmology relies on "inference to the best explanation" rather than strict Humean regularity. If he's just an economist, he's likely using "cosmology" as a rhetorical club.
  **Why this matters:** If cosmology *is* fundamentally different from physics because of the $N=1$ problem, then your Step 3 wasn't entirely wrong, just misapplied. History might be more like cosmology than like chemistry. However, even if that's true, it doesn't save *historicism* (the prediction of the sequence), which is what you actually care about.

  ### Summary Recommendation
  Rewrite the argument to pivot on **knowledge**, not **singularity**.

  1.  Laws are universal (keep Step 1).
  2.  There are many historical events of the same kind (drop Step 2).
  3.  Therefore, there are laws *in* history (economics, psych) (modify Step 4/5).
  4.  **However**, the *course* of history depends on the future state of knowledge.
  5.  Future knowledge is unpredictable (because predicting it requires having it).
  6.  Therefore, the *course* of history is unpredictable (Historicism is false).

  This lets you tell your flatmate: "You're right, there are laws in history. But you can't use them to predict the historical trajectory, because the variables change in ways the laws can't anticipate." That is a much harder position to wriggle out of.
