answer: |-
  This is a brilliant pedagogical structure. It forces students to operationalize their intuitions before they have the vocabulary to rationalize them away. Below is the run-sheet, materials, and facilitation guide to make this work in 90 minutes with 16 students.

  ### 1. Materials & Preparation

  **The Decks**
  You need two distinct decks printed on different colored cardstock.
  *   **The Core Deck (Blue):** 12 Cases. (I recommend reducing from 15 to 12 to save 5 minutes for discussion; 15 is too tight for 90 mins).
  *   **The Trap Deck (Red):** 5 Cases. (Kept sealed until Phase 3).
  *   **Score Sheets:** One per group.
  *   **Definition Slips:** Small slips of paper for the final definition (to be swapped).

  **Card Wording Rules**
  *   **No Diagnostic Labels:** Never use words like "disease," "disorder," "syndrome," "condition," or specific medical names (e.g., "Huntington's").
  *   **Phenomenological/Biological Only:** Describe the state of the body and the state of the life.
  *   **The Two Questions:** Printed at the top of every Core Card.
      1.  *Malfunction?* "Is a biological system failing to perform its species-typical function?" (Yes/No/Unsure)
      2.  *Harm?* "Is this person harmed, and would medicine be doing them a favour by stepping in?" (Yes/No/Unsure)

  **Sample Core Card Text (for your drafting)**
  *   *Case: Sickle Cell.* "Red blood cells are crescent-shaped rather than round. In a region with no malaria, the person experiences fatigue and pain crises. In a region with high malaria, the person is immune to the parasite and experiences no fatigue."
  *   *Case: Grief.* "Following the death of a spouse, the person experiences weight loss, insomnia, tearfulness, and lack of motivation for 3 months. They say this is the appropriate response to loss."
  *   *Case: Asymptomatic Hypertension.* "Blood pressure consistently measures 150/95. The person feels energetic, has no headaches, and suffers no current organ damage. Statistical models suggest a higher risk of stroke in 20 years."
  *   *Case: Mirrored Organs.* "Heart is on the right side, liver on the left. All functions are normal. The person is unaware of this until an X-ray is taken for a broken arm."
  *   *Case: Voice Hearing.* "Person hears distinct voices commenting on their actions. They are not distressed, function well at work, and their community views this as spiritual communication."
  *   *Case: Lactose Intolerance.* "Digestive system lacks enzyme to break down milk sugar. Consuming milk causes diarrhea. Community A relies on milk for 80% of calories. Community B never consumes milk."

  **Sample Trap Card Text (Red Deck)**
  *   *Trap 1 (Stats):* "Person has six fully functional fingers. Dexterity is higher than average. No health issues." (Targets: Purely Statistical definitions).
  *   *Trap 2 (Harm):* "Person is deeply distressed by their height (too short). They suffer social anxiety and depression solely due to this trait. Biology is normal." (Targets: Purely Harm-based definitions).
  *   *Trap 3 (Malfunction):* "Person carries a bacteria in their throat. It replicates normally for them. It is lethal when transmitted to others. Carrier feels fine." (Targets: Purely Malfunction definitions).
  *   *Trap 4 (Authority):* "Person has a cosmetic birthmark. Doctors in this country routinely laser it off for a fee. Doctors in neighboring country ignore it." (Targets: 'What doctors treat' definitions).
  *   *Trap 5 (Culture):* "A maple tree has a fungus that changes leaf color but does not kill the tree. The local culture worships this coloration." (Targets: Anthropocentric definitions).

  ---

  ### 2. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10 | Setup & Rules**
  *   Divide into 4 groups of 4.
  *   Hand out **Core Deck (Blue)** and **Individual Score Sheets**.
  *   **Rule 1:** Rate the 12 cards privately. Do not talk.
  *   **Rule 2:** Answer the two questions (Malfunction? Harm?) separately. You can say Yes to one and No to the other.
  *   **Rule 3:** You are building a *policy*. Your definition will determine insurance coverage and treatment access.

  **00:10 – 00:30 | Group Consensus (The Struggle)**
  *   Groups discuss their ratings. They will quickly find they disagree on specific cards (e.g., Grief, Hypertension).
  *   **Task:** You must agree on a single verdict for every card as a group.
  *   **Facilitator Note:** Circulate. If a group is moving too fast, ask: "Does your verdict on the Grief case match your verdict on the Hypertension case? Why?"

  **00:30 – 00:40 | The Definition (The Constraint)**
  *   Hand out **Definition Slips**.
  *   **Task:** Write one sentence: *A condition counts as a disease IFF ______.*
  *   **Constraint 1:** No disjunctions (No the word "OR").
  *   **Constraint 2:** No compound criteria (You cannot combine biology AND values. Must be one or the other).
  *   **Constraint 3:** No appeals to authority (Cannot use words "doctor," "hospital," "treat").
  *   *Why?* This forces them to choose a lane (Naturalist OR Normativist), setting up the failure in the next round.

  **00:40 – 00:55 | The Attack (Trap Deck)**
  *   Groups swap Definition Slips with another group.
  *   Hand out **Trap Deck (Red)** to each group.
  *   **Task:** Use the 5 Red Cards to break the *other* group's definition.
  *   **Scoring:**
      *   +1 Point for every Red Card that fits the definition but *shouldn't* be a disease (False Positive).
      *   +1 Point for every Red Card that *should* be a disease but doesn't fit the definition (False Negative).
      *   (Determine "should/shouldn't" by group consensus).
  *   **Winner:** The group with the most points (i.e., the group that best broke the other definition).

  **00:55 – 01:30 | The Debrief (The Philosophy)**
  *   See detailed script below.

  ---

  ### 3. The Debrief Script (Mapping Game to Theory)

  Do not lecture immediately. Ask questions that map their game experience to the literature.

  **Phase 1: The Data (10 mins)**
  *   "Look at your individual scores for the Grief case and the Hypertension case. How many of you marked 'Malfunction: No' but 'Harm: Yes' for Grief? How many marked 'Malfunction: Yes' but 'Harm: No' for Hypertension?"
  *   **Point:** If disease were just biology, these columns would match. They don't. Your intuition separates *function* from *value*.

  **Phase 2: The Definition Failure (10 mins)**
  *   "Who wrote a definition based on 'Statistical Normality'? Did the Six Fingers card break you?" (Naturalism problem: Statistical rarity isn't disease).
  *   "Who wrote a definition based on 'Harm'? Did the Short Height card break you?" (Normativism problem: Harm without pathology is just life).
  *   "Who wrote a definition based on 'Malfunction'? Did the Asymptomatic Carrier card break you?" (Naturalism problem: Public health requires counting carriers).
  *   **Point:** Every single-criterion definition failed. This is the conceptual crisis of the 1970s philosophy of medicine.

  **Phase 3: The Winner's Paradox (10 mins)**
  *   "The group that 'won' (broke the most definitions) didn't win because they knew more biology. They won because they knew which values your committee shared."
  *   "When you decided the Voice Hearing case was *not* a disease, was that because of the brain? Or because the community accepts it?"
  *   **Point:** This is the Normativist claim (Culver, Gundry). Disease isn't found; it's assigned based on what we consider a 'misfortune' worth fixing.

  **Phase 4: The Synthesis (5 mins)**
  *   "So, is it Biology or Values?"
  *   Introduce **Wakefield's Harmful Dysfunction**: You need *both*. (Malfunction AND Harm).
  *   "Why didn't I let you write that today?"
  *   **Point:** Because even 'Harmful Dysfunction' leaves the hard cases open. Who decides the harm? Who decides the function? The game shows that even the Hybrid view rests on normative judgments about what 'function' is for.

  ---

  ### 4. Honest List: What Will Go Wrong (And How to Fix It)

  **1. The "OR" Loophole**
  *   **Failure:** A group writes: "A disease is a malfunction OR something that causes harm."
  *   **Fix:** Enforce the "No Disjunction" rule strictly during the writing phase. Tell them: "A definition with 'OR' covers everything. It explains nothing. Pick one foundation."
  *   **Why:** If they allow 'OR', they solve the game too easily and miss the tension.

  **2. The Appeal to Authority**
  *   **Failure:** A student says, "It's a disease if a doctor diagnoses it."
  *   **Fix:** Ban the words "doctor," "clinic," "diagnosis," and "treatment" from the definition slip.
  *   **Why:** This is circular. Medicine is the practice of treating disease; you can't define disease by medicine.

  **3. The Premature Constructivist**
  *   **Failure:** One student says, "Disease is just a social construct," in minute 5. The room relaxes, thinking the work is done.
  *   **Fix:** Acknowledge it, then pivot. "If it's *just* a construct, why did you hesitate on the Pain case? Why did you feel the biology pulling you?"
  *   **Why:** You want them to feel the *resistance* of the biology, not just dismiss it. The tension is the lesson.

  **4. The Time Sink**
  *   **Failure:** They spend 20 minutes arguing over one card (usually Grief or Voices).
  *   **Fix:** Use a visible timer. Announce: "You must have a verdict on all 12 cards in 10 minutes. If you're stuck, vote and move on."
  *   **Why:** The volume of cases creates the pattern recognition. Dwelling on one kills the data set.

  **5. The "Hidden Fact" Naturalist**
  *   **Failure:** A student argues, "The Grief case *is* a malfunction, we just haven't found the neurotransmitter yet."
  *   **Fix:** Do not argue this in the moment. Park it. "That is a bet on future science. For the purpose of *current* policy, do we treat it as disease now?"
  *   **Why:** This is the Boorse position. It's valid, but it turns disease into a placeholder for future knowledge, which has its own philosophical costs. Address this in the reading, not the game.

  ---

  ### 5. Limitations: What This Activity Cannot Do

  You asked for honesty about the limits. This activity is powerful, but it is not a silver bullet.

  **1. It Does Not Refute the "Ignorant Naturalist"**
  *   **The Problem:** A committed Naturalist (like Christopher Boorse) will argue that your students' confusion is epistemic, not ontological. They will say: "The Grief case either is or isn't a biological malfunction. That you don't know which doesn't make it normative. You are confusing *what disease is* with *how we decide to treat it*."
  *   **What You Must Supply:** This activity shows that our *concept* of disease is value-laden. It does not prove that *reality* is. You need to follow this session with Boorse's "Health as a Theoretical Concept" to show the counter-argument. The game sets up the problem; the reading provides the rigorous defense of Naturalism.

  **2. It Flattens "Function"**
  *   **The Problem:** The game treats "biological function" as obvious. It isn't. Is the function of the heart to pump blood (Naturalist) or to sustain life (Normativist)?
  *   **What You Must Supply:** In the debrief, explicitly mention that "Function" is the battleground. Naturalists rely on "species-typical design." Normativists argue "design" implies a designer or a goal, which is normative.

  **3. It Risks Cynicism**
  *   **The Problem:** Students may walk away thinking, "So disease is fake? It's all just politics?"
  *   **What You Must Supply:** You must close the loop on *why* this matters. It's not that disease is fake; it's that the *line* is a policy tool. The biology is real (the blood pressure is real), but the *category* is a tool for resource allocation. Ensure they leave knowing that biology constrains the definition, even if it doesn't determine it.

  ### Final Facilitation Tip
  When the winning group is announced, say this:
  *"Group 3 won. They didn't win because they found the truth. They won because their definition best matched the values in this room. That is not a bug. That is the Normativist thesis. You just proved it."*
