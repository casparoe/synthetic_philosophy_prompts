answer: |-
  Your position is philosophically sophisticated and aligns with a growing faction in mechanistic interpretability, but it contains a severe internal contradiction regarding the determinacy of content versus the indeterminacy of the basis, alongside several secondary tensions that require clarification. The most severe inconsistency lies between your commitment to realism about determinate representational content and your claim that there is no fact of the matter about which directions in activation space are real due to linear basis freedom. If you hold that a network possesses determinate representational content in the same way a thermometer represents temperature, there must be a fact of the matter about which physical state carries that content. However, your assertion that any invertible linear change of basis preserves the information implies that the specific direction intervened upon is arbitrary. If the direction is arbitrary, the content attached to it cannot be determinate, because rotating the basis would rotate the content without changing the network's input-output behavior. This undermines the causal criterion you endorse, as intervening on an arbitrary direction in an arbitrary basis may not yield stable causal effects unless that direction is privileged by the network's geometry. The cheapest repair here is to anchor your realism not to the raw activation space but to the sparse feature space you mention later. By conceding that determinate content exists only relative to the specific sparse decomposition that breaks the rotational symmetry, you preserve realism while accepting that the raw basis is indeed indeterminate.

  A secondary tension exists between your claim of basis indeterminacy and your conviction that sparse factorization discovers rather than imposes structure, though this is more of a conceptual friction than a logical contradiction. You seem to worry that accepting sparse features conflicts with the linear algebra argument that no basis is privileged, but mathematically, sparse coding escapes this problem precisely because it is not a linear change of basis. When you factor activations into more directions than there are dimensions using sparsity constraints, you are no longer dealing with an invertible linear transformation, and the rotational symmetry is broken. Therefore, there is no genuine conflict here provided you recognize that the indeterminacy argument applies only to unconstrained linear subspaces. The field is currently divided on this point; while the mathematics of sparse coding breaking symmetry is settled, whether these sparse features correspond to ontologically real units of computation rather than just useful analytical tools is highly contested. Many researchers treat sparse autoencoders as discovering ground truth features, but instrumentalists argue they are merely convenient compressions. To maintain consistency, you should explicitly limit your basis indeterminacy claim to linear bases and treat the sparse decomposition as the exception that grounds your realism.

  The third tension involves your claim that what one network represents tells you nothing about another network trained the same way, which clashes with the scientific utility of your realist stance. While this does not logically contradict the idea that individual networks have real representations, it severely weakens the claim by making representation a fragile property of specific weight configurations rather than a stable property of the architecture or task. If representations are entirely idiosyncratic, the causal criterion becomes difficult to generalize, as you cannot validate representational claims across instances. This view is genuinely contested in the current literature. Recent work on model stitching and linear mode connectivity suggests that there are regularities across networks trained with different seeds, implying that representations are not wholly arbitrary. The cheapest repair is to soften this claim from telling you nothing to telling you very little without specific alignment techniques. This allows you to maintain that representations are real and causal within a network while acknowledging that cross-network regularities exist but are obscured by symmetry transformations like permutation.

  Regarding the broader consensus in the field, it is crucial to recognize that none of your core premises are settled science. Your realist stance is a minority view compared to instrumentalism, which dominates much of machine learning practice where internal states are treated as useful fictions so long as loss decreases. The causal criterion for representation is widely respected but not universally accepted as sufficient, with some philosophers and researchers arguing that information-theoretic or teleological accounts are necessary to distinguish representation from mere causation. The indeterminacy of the linear basis is mathematically sound but its philosophical implication that there is no fact of the matter is debated, especially given that training dynamics often break symmetry in practice. The status of sparse features as discovered structure is a hot topic with emerging consensus on their utility but no agreement on their ontological status. Finally, the lack of cross-network regularity is increasingly challenged by evidence of consistent circuits across models. To present your view accurately, you must frame your realism and causal criteria as philosophical commitments supported by interpretability practices rather than established facts, and acknowledge that the field is actively investigating whether the structure you see is discovered or imposed.

  In summary, the severity of tensions ranks from the contradiction between determinate content and basis indeterminacy as the most critical, followed by the scientific weakness introduced by denying cross-network regularities, and finally the apparent but resolvable friction regarding sparse features. To repair the most severe issue, you should restrict your claim of determinate content to the sparse feature space where symmetry is broken, thereby harmonizing your realism with the mathematical reality of activation spaces. For the cross-network issue, moderating your claim to allow for latent regularities accessible via alignment will protect your view from empirical counterevidence without abandoning the core insight that weight-space symmetries obscure direct comparison. By making these adjustments, you can maintain a coherent realist position that respects the causal evidence you value while navigating the mathematical and empirical constraints currently debated in the field.
