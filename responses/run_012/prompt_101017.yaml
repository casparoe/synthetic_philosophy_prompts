answer: |-
  You are a whistleblower holed up in Chicago, and a corporate security firm has deployed "Locate-Plus," a behavioral prediction algorithm with a verified 99% accuracy rate for tracking fugitives' final destinations based on psychological profiling. The firm will send a retrieval team to exactly one location: your family home in Evanston or a sterile safehouse in Milwaukee. If the team arrives where you are, you are eliminated; if they miss you, you escape to safety. You know Locate-Plus bases its prediction on your profile, which heavily favors returning to family when frightened, and you understand that your decision now will match the prediction already transmitted to the team. While survival is the primary goal, you have a settled preference: if you must be eliminated, you prefer it happen at home in Evanston rather than alone in Milwaukee. You must choose now: drive to Evanston or drive to Milwaukee.

  **The Machinery**

  Causal Decision Theory (CDT) asks what your choice causally influences. Since the algorithm's prediction and the team's deployment are already in the past, CDT asserts your choice cannot change where the team is. To maximize survival, you should go where the team is *not*. But you know the team is where the algorithm predicted you would be. If you lean toward Evanston, you must believe the algorithm predicted Evanston, meaning the team is in Evanston, so you should go to Milwaukee. But if you go to Milwaukee, the algorithm would have predicted that, so the team is in Milwaukee, so you should go to Evanston. CDT cycles endlessly; there is no stable probability assignment where your choice aligns with your beliefs about the team's location. Proposing a mixed strategy (randomizing 50/50) does not rescue it; if you adopt a randomization policy, the algorithm predicts the outcome of that policy with 99% accuracy, so you still face the same instability. The randomization is just an ad-hoc patch that fails to self-ratify because any specific probability you assign becomes the target the predictor hits.

  Evidential Decision Theory (EDT) asks what your choice indicates about the world. Choosing Evanston is strong evidence (99% probability) that the algorithm predicted Evanston and the team is waiting there. Choosing Milwaukee is strong evidence the team is in Milwaukee. Since the algorithm is 99% accurate, your probability of survival is roughly 1% regardless of your choice. EDT accepts this fatalism. Because survival odds are effectively equal, the decision turns on the secondary preference. Dying in Evanston yields higher utility than dying in Milwaukee. Therefore, EDT firmly recommends driving to Evanston. It accepts the near-certainty of death to secure the better quality of demise.

  **The Pivot Point**

  The single feature doing all the work is the **asymmetry in the utility of death**. In the textbook symmetric version, both theories struggle (CDT cycles, EDT is indifferent). By introducing a preference for *where* you die, EDT gains a tie-breaker for the two equally fatal options, allowing it to output a definitive choice. CDT, however, remains fixated on the causal impossibility of influencing the past prediction; it continues to search for a survival path that doesn't exist, refusing to settle on the "better death" because it insists its choice *should* be able to dodge the team, leading to the loop.

  **If You Remove It**

  If you remove the preference and are indifferent between dying in Evanston or Milwaukee, EDT loses its firm recommendation. It calculates equal expected utility for both options (99% death either way) and shrugs, returning indifference. CDT remains unstable. The divergence between the theories vanishes; both fail to give a unique, actionable survival strategy, though EDT at least admits the fatalism while CDT continues to spin its wheels looking for a causal lever that isn't there.

  **The Counter-Argument**

  A defender of CDT would argue the case is rigged by assuming the predictor's accuracy holds even against a deliberating agent. They would claim that a rational agent should be able to commit to a mixed strategy that the algorithm cannot penetrate—for instance, using a quantum randomizer that breaks the psychological profiling link. If the agent can truly make their choice unpredictable, the accuracy drops below 100%, creating a causal gap where survival is possible. They would say EDT's recommendation is defeatist: it treats the prediction as a fixed fact rather than a challenge to be outmaneuvered, conflating the evidence of death with the cause of it.
