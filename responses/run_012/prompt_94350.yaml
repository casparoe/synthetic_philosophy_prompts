          2.  **The Granularity/Richness Objection.** Visual experience is analog/high-res; thoughts are digital/low-res. How does the latter make the former conscious?
          3.  **The Animal/Infant Problem.** Requires conceptual capacity. Implies dogs aren't conscious.
          4.  **Collapse into Global Workspace/First-Order.** If "dispositional" just means "available for report," isn't that just access consciousness (Block)?
      *   *Section 2: Theorist's Response (Concede vs. Dismiss).*
          *   They will dismiss the empirical vacuity charge by saying HOT is a *conceptual* analysis, not an empirical hypothesis.
          *   They might concede on animals (bite the bullet) or modify "conceptual" to be weaker.
      *   *Section 3: Unfalsifiability Deep Dive.* Yes, it is a serious problem. It risks making the theory a "just-so story."
      *   *Section 4: What would change my mind / AI Limitations.*
          *   *Change Mind:* A neural correlate specifically for HORs that is distinct from 1st-order and predicts reports better than GWT.
          *   *AI Limitation:* I don't experience consciousness. I might treat "report" as equivalent to "experience," which is the Hard Problem.

