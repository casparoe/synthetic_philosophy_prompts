  8.  **Final Polish:** Check for flow and clarity. Ensure the distinction between the "Planner" (Pre-amnesia/Early amnesia Leonard) and the "Doer" (Current Leonard) is sharp. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful with the "messages" variant in AMD. If the driver can leave a message at Exit 1 for Exit 2, the forgetfulness is solved *unless* the message can be tampered with. In *Memento*, the tampering is key. I must highlight that the *integrity* of the signal is the philosophical crux, not just the transmission.

