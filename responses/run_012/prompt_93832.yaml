          *   What does the film add to the debate that standard formulations miss?
      *   **Constraints:** Do not summarize the plot (user knows it well). Be precise about decision theory. Be honest about the film's ambiguities. Suitable for teaching undergraduates (needs clarity but depth).

  2.  **Deconstruct the Absent-Minded Driver (AMD) Problem:**
      *   *Setup:* Driver wants to exit at the 2nd exit (High Payoff). 1st exit is Okay Payoff. Going past both is Terrible Payoff.
      *   *Constraint:* Indistinguishable intersections. Forgetfulness upon arrival (cannot condition action on location).
      *   *Decision Theoretic Tension:*
          *   *Planning Self (Ex-ante):* Chooses a probability $p$ of continuing to maximize expected utility.
          *   *Executing Self (Ex-interim):* Upon arrival, updates beliefs about which intersection this is based on the strategy $p$. This leads to time inconsistency (Piccione & Rubinstein vs. Aumann et al.).
      *   *Key Philosophical Issue:* The separation of the "Planner" and the "Doer." Are they the same agent?

  3.  **Deconstruct *Memento* (Philosophical Lens):**
      *   *Condition:* Anterograde amnesia (cannot form new explicit memories).
      *   *System:* Externalized memory (facts vs. truth).
      *   *Structure:* Reverse chronology (color) vs. Forward chronology (B&W).
      *   *Agency:* Leonard sets goals (avenge wife), but his future selves must execute them without remembering the commitment.
      *   *Twist:* Leonard manipulates his own system. He *chooses* to forget or mislead his future self to maintain purpose.

  4.  **Synthesize: Mapping AMD to *Memento*:**
      *   *The Intersections:* Every encounter (Natalie, Teddy, Dodd) is an "intersection." Leonard doesn't know the context (history) of the encounter.
      *   *The Policy:* "Find John G." / "Don't believe lies."
      *   *The Forgetfulness:* Diachronic discontinuity. The Leonard at $t_1$ is not epistemically continuous with Leonard at $t_2$.
      *   *The Messages:* Tattoos/Notes correspond to the "commitment device" or the policy instruction.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the connection. State the thesis: *Memento* doesn't just illustrate AMD; it radicalizes it by introducing *motivated* forgetfulness and the fragmentation of agency.

      *   **1. The Structural Isomorphism (Intersections and Indistinguishability):**
          *   AMD: Indistinguishable exits.
          *   *Memento:* Indistinguishable moments. Every waking moment is "Exit 1" or "Exit 2?"
          *   Decision Theory: The driver uses a mixed strategy ($p$). Leonard uses a heuristic ("Fact 1: John G.").
          *   *Nuance:* In AMD, forgetfulness is a bug. In *Memento*, it's a feature (or at least, exploited).

      *   **2. External Memory as Commitment Device (The Tattoos):**
          *   AMD Variant: Can the driver leave a note? If yes, does it solve it?
          *   Standard View: Notes restore continuity, collapsing the problem back to standard sequential decision theory.
          *   *Memento's* Twist: The notes are *corruptible*. Leonard writes "Don't believe his lies" on Teddy's photo *after* deciding to use Teddy.
          *   *Philosophical Point:* The "Planner" manipulates the "Doer." The external memory isn't a neutral bridge; it's a tool of control. This highlights the *conflict* between temporal slices of the agent.

      *   **3. Time Inconsistency and the Fragmented Agent:**
          *   AMD Debate: Aumann (ex-ante optimal) vs. Piccione/Rubinstein (dynamic consistency).
          *   *Memento:* Leonard's ex-ante self (the one who knew the truth about his wife) vs. ex-interim selves (the avenger).
          *   The film suggests the "Planner" is dead (or suppressed). The "Doer" is the only one who exists phenomenologically.
          *   *Agency:* Is Leonard one agent or a chain of agents? The film leans toward the latter (a "temporal commons").

      *   **4. Where the Analogy Breaks Down (Motivated Forgetting):**
          *   AMD assumes rational forgetfulness (exogenous constraint).
          *   Leonard practices *endogenous* forgetfulness. He chooses not to write things down. He chooses to burn the photo.
          *   *Decision Theory Gap:* Standard AMD assumes the agent *wants* to remember but *can't*. Leonard *needs* to forget to function. This shifts the problem from epistemic limitation to existential necessity.
          *   *Teaching Point:* Use this to discuss utility functions. Leonard's utility isn't just "revenge"; it's "purpose." Once revenge is achieved, utility crashes. So he engineers continued forgetfulness.

      *   **5. Conclusion: What the Film Adds:**
          *   AMD is usually about calculation errors or belief updating.
          *   *Memento* makes it about *identity constitution*.
          *   The "Gap": Formal theory assumes a unified utility function over time. The film shows the utility function itself is unstable across temporal slices.
