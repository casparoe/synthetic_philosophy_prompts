answer: |-
  This is a compelling framing for a dissertation chapter. Connecting the Piccione and Rubinstein (1997) formulation of the Absent-Minded Driver (AMD) to *Memento* moves the discussion from a paradox of probability to a phenomenology of fragmented agency. The film does not merely illustrate the problem; it radicalizes it by introducing the possibility that the agent might *want* to remain absent-minded.

  Here is a reading designed to help you map the decision-theoretic structures onto the film's narrative architecture, specifically tailored for your pedagogical and research needs.

  ### 1. The Structural Isomorphism: Indistinguishable Intersections

  In the standard AMD problem, the driver faces two identical exits. At the first, exiting yields a modest payoff; at the second, a high payoff; passing both yields zero. The constraint is that upon arriving at an intersection, the driver cannot distinguish Exit 1 from Exit 2, nor can she remember if she has passed one already. She must rely on a pre-committed probability $p$ of continuing.

  In *Memento*, every waking moment is an intersection. Leonard Shelby cannot distinguish the "current" moment from any other moment in his anterograde amnesiac timeline. He does not know if he is at the beginning of the investigation (Exit 1) or the end (Exit 2).

  *   **The Payoff Structure:** For the Driver, the payoff is external (money/safety). For Leonard, the payoff is existential. "Exiting" (killing a John G.) provides a temporary resolution, but passing all exits (running out of targets) yields the zero payoff of meaninglessness.
  *   **The Policy:** The Driver adopts a mixed strategy ($p$). Leonard adopts a heuristic policy encoded in his "System": *Trust the facts, not the lies; find John G.*
  *   **The Epistemic Block:** Just as the Driver cannot condition her action on location ($L$), Leonard cannot condition his action on history ($H$). He acts on local cues (tattoos, notes) which serve as proxies for the global state he cannot access.

  **Pedagogical Point:** Use this to show students that AMD is not about "forgetting where you put your keys"; it is about the inability to locate oneself within a causal chain. Leonard literalizes this: he is always at "an" intersection, never "the" intersection.

  ### 2. The Ex-Ante vs. Ex-Interim Split: Planner and Doer

  The central tension in AMD is between the **planning self** (ex-ante, before the trip) and the **executing self** (ex-interim, at the intersection).
  *   **Aumann et al.** argue for the optimality of the ex-ante plan.
  *   **Piccione & Rubinstein** argue that the ex-interim self must re-evaluate based on the probability that they are at Exit 1 or 2 given that they have arrived there. This leads to time inconsistency.

  *Memento* dramatizes this split not as a mathematical inconsistency, but as a hostile takeover.

  *   **The Planner:** This is the Leonard who originally established the System. It is also, arguably, the Leonard who realized his wife survived the assault (the truth he suppresses). This self knows the "map."
  *   **The Doer:** This is the Leonard we follow in the color sequences. He is the ex-interim agent. He arrives at the "intersection" (e.g., meeting Teddy) without knowing the history.

  The film suggests that the "Planner" is effectively dead or inaccessible. The ex-interim self is the only phenomenologically real agent. When the Driver in AMD arrives at an intersection, she updates her credence based on the strategy $p$. When Leonard arrives at a moment, he updates his credence based on his artifacts. But in *Memento*, the artifacts are not neutral data; they are commands from a past self that the current self cannot interrogate.

  **The Gap:** Standard decision theory assumes the ex-ante and ex-interim selves share the same utility function. *Memento* exposes a gap where the utility function itself degrades. The Planner might want "Truth/Justice." The Doer wants "Purpose." Once Truth is achieved, Purpose evaporates. Therefore, the Doer has an incentive to ignore the Planner's final instructions.

  ### 3. The Variant: Messages and the Corruption of the Signal

  You asked about the variant where the driver can leave messages. In decision theory, if the driver can leave a note at Exit 1 saying "This was Exit 1, continue to Exit 2," the forgetfulness is solved, and the problem collapses into a standard sequential choice. The driver regains diachronic continuity.

  Leonard's tattoos and Polaroids are precisely these messages. They are intended to restore continuity. However, *Memento* introduces a variable standard AMD ignores: **the integrity of the signal.**

  *   **The Tampering Problem:** In the AMD variant, we usually assume the note is stable. In *Memento*, the "note" (the tattoo or photo) can be written by a self that was already compromised.
  *   **The Scene:** Consider the scene where Leonard decides to make Teddy his next target. He knows Teddy is not "John G." (the original target). He knows he has already completed his mission. But to avoid the zero payoff (a life without revenge), he chooses to write a "fact" on the Polaroid: "Don't believe his lies."
  *   **The Implication:** Leonard is not just a forgetful driver; he is a driver who *alters the signposts* to force his future self to keep driving.

  This complicates the "messages" variant. It suggests that external memory does not solve the agency problem if the agent is diachronically fragmented. The "Planner" (Leonard at $t_1$) manipulates the "Doer" (Leonard at $t_2$) by poisoning the well of external memory. The message doesn't restore the *same* agent; it creates a puppet.

  **Philosophical Payoff:** This moves the debate from *epistemology* (how do I know where I am?) to *politics* (who has the authority to bind the future self?). The tattoos are not just memory aids; they are legislation.

  ### 4. Motivated Forgetting: Endogenous Constraints

  This is where the film resists being reduced to a mere illustration of AMD and offers a critique of the formalism.

  *   **AMD Assumption:** Forgetfulness is an exogenous constraint. The driver *wants* to remember but *cannot*.
  *   **Memento Reality:** Forgetfulness is partially endogenous. Leonard *chooses* what to commit to memory and what to let fade. He admits, "We all need mirrors to remind ourselves who we are. I'm no different." But he also chooses to burn the photo of his wife's body after he has used it to motivate himself.

  Leonard practices **motivated forgetting**. He realizes that if he remembers that he has already killed the "real" John G., he loses his utility function. So, he engineers his own amnesia regarding the success of his mission. He selectively tattoos facts that sustain the game.

  **Decision Theoretic Implication:** Standard AMD models the agent as trying to maximize utility *despite* memory loss. *Memento* models an agent who maximizes utility *by means of* memory loss. This suggests that for certain utility functions (specifically those dependent on narrative continuity or unresolved desire), diachronic discontinuity is a feature, not a bug.

  This challenges the "rational agent" assumption in the AMD problem. Is Leonard rational?
  *   **Ex-ante:** No, he is sabotaging his own closure.
  *   **Ex-interim:** Yes, he is maximizing his current expected utility (which is "have a purpose").
  *   **The Lesson:** Rationality is relative to the temporal slice of the agent. The film vindicates the Piccione/Rubinstein worry about time inconsistency but adds an emotional weight: time inconsistency isn't just a calculation error; it's a survival mechanism.

  ### 5. Identity and the Temporal Commons

  You asked if the film suggests AMD is a puzzle about what counts as the same agent. The answer is a definitive yes.

  In the standard AMD problem, we assume the Driver at Exit 1 and the Driver at Exit 2 are the same agent for the purpose of utility aggregation. We sum the payoffs. In *Memento*, the "payoff" is experienced locally. The Leonard who kills Teddy feels the satisfaction. The Leonard who wakes up the next day feels the confusion.

  The film proposes a **Temporal Commons** model of agency. Leonard is not one person stretching over time; he is a sequence of short-term agents sharing a body and a set of artifacts.
  *   **The Tragedy:** The "Tragedy of the Commons" applies here. Each temporal slice of Leonard consumes the resource (the "John G. mystery") for its own sustenance, leaving the next slice with nothing. To prevent the resource from running out, the current slice must lie to the next slice.
  *   **Sammy Jankis:** Sammy is the mirror. Leonard tells the story of Sammy to prove that conditioning (memory) is impossible for someone like him. But the twist is that Leonard projected his own failure onto Sammy. Sammy is the "Doer" who couldn't be bound by the "Planner." Leonard is the "Planner" who learned to manipulate the "Doer."

  **Where the Analogy Breaks Down:**
  In AMD, the driver is passive regarding her condition. In *Memento*, Leonard is active. He is not just solving a decision problem; he is *writing* the decision problem for his future selves. This introduces a layer of **second-order agency** that standard decision theory lacks. The driver chooses $p$. Leonard chooses the *meaning* of $p$.

  ### 6. Teaching Takeaways: The Gap Between Formalism and Lived Experience

  For your undergraduates, the film illuminates what the formalism leaves out: **the phenomenology of the gap.**

  1.  **The Anxiety of the Intersection:** In AMD, the intersection is a node in a graph. In *Memento*, it is a moment of panic. The film shows the *affect* of diachronic discontinuity. The decision theory treats the belief update as a Bayesian calculation; the film treats it as a crisis of trust (trusting the note, trusting the stranger, trusting oneself).
  2.  **The Utility of Illusion:** AMD assumes the agent wants the true payoff. *Memento* shows an agent who prefers a sustainable illusion to a devastating truth. This challenges the definition of "reward" in the decision matrix. If the reward is "meaning," and meaning requires ignorance, then rational choice requires self-deception.
  3.  **Agency as Narrative:** The film suggests that agency under forgetfulness isn't about optimizing outcomes, but about maintaining a coherent narrative. Leonard's "policy" is a story he tells himself. When the story ends, the agent ceases to function (or must restart the story).

  ### Conclusion for the Dissertation

  *Memento* does not solve the Absent-Minded Driver problem; it existentializes it. It suggests that the "separation of the agent who chooses a policy from the agent who executes it" is not a technical glitch to be resolved by better commitment devices (tattoos), but a fundamental ontological condition of human temporality.

  The film argues that when diachronic continuity is broken, "agency" becomes a political relation between temporal slices. The external memories (messages) do not solve the problem because they are subject to the same fragmentation as the mind that reads them. Ultimately, *Memento* posits that the Absent-Minded Driver is not a puzzle about knowledge (how do I know which exit this is?), but a puzzle about **will** (why do I want to keep driving?).

  For your chapter, this offers a bridge from the technical literature on time inconsistency (Aumann, Piccione, Rubinstein, Arntzenius) to the literature on personal identity and narrative self-constitution (Schechtman, Parfit). The film validates the decision-theoretic intuition that the "self" is not a stable locus of choice, but it adds the crucial dimension that the self might *prefer* it that way.
