answer: |-
  Two pharmaceutical firms, Alpha and Beta, are racing to finalize identical gene therapies. A safety practice exists: the "Open Adverse Event Registry" (OAER). Posting trial data to OAER is digital, instantaneous, and costs zero marginal dollars or development time; it imposes no latency, complexity, or capability loss on the therapy itself (Specification 3). Posting enables instant detection of rare side-effects, preventing patient harm and subsequent class-wide regulatory bans. However, adverse event data reveals metabolic pathways useful for optimizing efficacy. If Alpha posts to OAER and Beta does not, Beta ingests Alpha's data, refines its own therapy without R&D cost, and secures FDA approval first. Alpha prevents harm but loses patent exclusivity and collapses. Beta wins the market but inherits the safety risk. If neither posts, rare harms accumulate unnoticed, regulators eventually ban the entire drug class, and both firms lose their investments (Specification 4). Both firms prefer the ban avoided (Specification 2). Both are rational and informed. Neither posts (Specification 5).

  **Analysis**

  **Causal Chain:**
  1.  **Actors:** Alpha and Beta compete for patent exclusivity.
  2.  **Constraint:** Market survival depends on being first to approval; proprietary data is the key advantage.
  3.  **Link:** The safety practice (OAER) converts proprietary data into a public good.
  4.  **Drop:** Safety is dropped not because it slows development (Engineering Tax = 0), but because it accelerates the competitor (Competitive Externality).
  5.  **Result:** Both skip safety, leading to industry ban. No link in this chain relies on the safety practice having a positive engineering cost.

  **Name:**
  The Competitive Externality.

  **Ablations:**
  (a) **Remove Competition:** If Alpha holds a monopoly, it posts to OAER. The safety practice is adopted, and the industry survives. The race collapses without the competitive structure, proving the structure is load-bearing.
  (b) **Add Engineering Tax:** If posting to OAER now costs 1 month of delay, the outcome does not change in kind; Alpha still skips to avoid Beta leapfrogging. The structural incentive alone was sufficient to suppress safety; the tax only deepens the disincentive. This shows the tax and structure are substitutes, and the tax is idle in the baseline explanation.

  **Honest Note on Counter-Move:**
  A critic may argue that lost market share *is* a tax, rendering my distinction verbal. If "alignment tax" is redefined to include any competitive disadvantage, the term expands to mean "reason not to adopt." This rescues the tax-centred explanation only by conceding that the "tax" is not a technical fact about safety (engineering cost) but a fact about the market (opportunity cost). My construction isolates the engineering cost (zero) from the strategic cost (positive). The feature doing work I did not intend is the intellectual property regime; without IP, data sharing wouldn't threaten exclusivity. However, IP is standard in contemporary pharma (Specification 1). The case genuinely separates the two explanations: it shows safety can be technically free yet strategically expensive, proving the competitive structure is the primary driver, not the technical tax.

  **Conflict Check:**
  Specification 3 (Free) and Specification 4 (Worse Off) appear to conflict: if safety is free, why does skipping benefit the actor? They do not conflict because "Free" refers to engineering physics (time/money/capability), while "Worse Off" refers to economic outcome (profit/survival). The tension between technical freedom and strategic cost is precisely the point of the experiment.

  Verdict: Competitive structure drives safety loss, not engineering tax.
