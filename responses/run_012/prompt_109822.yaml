  2. Democracy operates as a multi-agent coordination framework where preference aggregation is dynamically revised through communication channels that generate common knowledge regarding shared problems rather than merely processing fixed individual inputs.
  3. Experimentalism frames both inquiry and democracy as online learning algorithms that continuously update system models through exploration, treating every action as an experiment whose consequences feed back into robust control policies.
  4. This translation distorts Dewey by treating the determinate situation as a state of minimized estimation error rather than a qualitative resolution of conflict, revealing a limitation in control theory's tendency to quantify uncertainty rather than capture contextual meaning.
  5. Dewey's conception of democratic life as intrinsic moral and aesthetic growth has no counterpart in this vocabulary, indicating a genuine feature of the subject matter where normative values cannot be fully reduced to optimization objectives or coordination metrics.
