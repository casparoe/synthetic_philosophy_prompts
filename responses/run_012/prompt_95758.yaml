answer: |-
  Your position is a sophisticated version of a view held by several prominent legal theorists and metaphysicians, often called the "normative view" of omission causation. It is intuitively powerful because it respects the ontological difference between something happening and nothing happening. However, the inference fails primarily at the step where you move from "norms are needed to pick out the omission" to "the causal claim is really a normative claim."

  The mistake lies in conflating **causal relation** with **causal attribution**. Most contemporary accounts of causation (particularly counterfactual theories) distinguish between the metaphysical dependence of one event on another and the pragmatic or normative selection of which cause to highlight in explanation. When you say that an agent's inaction answers to indefinitely many descriptions (failed to water, failed to fill bath, etc.), you have identified the problem of **causal selection**, not the problem of **causal existence**. We face the same issue with positive acts: a fire is caused by the spark, the oxygen, the dry wood, and the absence of a sprinkler system. All are metaphysically necessary conditions (in the INUS or NESS sense), but we select the "spark" as *the* cause because it is abnormal or manipulable. We select the "failure to water" as *the* omission cause for similar pragmatic reasons, often guided by norms, but the norms determine which cause we *blame*, not whether the causal dependency exists.

  Regarding your confidence that "an absence is not a cause": this depends entirely on accepting a process-transference theory of causation (where causation requires physical energy exchange). If you adopt a counterfactual theory (where causation is about dependence: "if X had not occurred, Y would not have occurred"), absences function perfectly well as causal relata. The plant's death counterfactually depends on the non-watering. To insist this is not causation requires defining causation so narrowly that it excludes many standard scientific explanations (e.g., "the lack of pressure caused the valve to close").

  Therefore, the core error is not necessarily your ontology of absences, but your conclusion that the need for normative selection collapses the causal claim into a normative one. Causation remains a metaphysical relation of dependence; responsibility is a normative judgment layered on top of that relation. We cannot drop causal language because we need to distinguish between agents who caused harm by omission (and might be excused) and agents who did not cause harm at all (and cannot be liable even if they had a duty).

