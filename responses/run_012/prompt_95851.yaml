answer: |-
  If any pattern of choices generated by your risk function can be mathematically rewritten as expected utility maximization simply by redescribing the outcomes to include the risk profile of the gamble itself, what prevents your theory from collapsing into a mere notational variant of expected utility, and what substantive work is the risk function doing that isn't just hidden in the description of the goods?

  **Question:** You argue that we should elicit the risk function from small, transparent lotteries where outcomes are clearly defined, but if the objection is that expected utility can mimic you by enriching those outcomes, on what principled grounds do you forbid the enrichment that would save expected utility without forbidding the enrichment that would save your theory?
  **Note:** Matter 1 (Content distinct from EU / Principled vs. Convenient description).
  **Follow-up:** If she appeals to "transparency" or "natural" descriptions, ask whether transparency is a property of the world or merely a property of the description, and who gets to decide which descriptions count as natural.
  **Reasoning:** This follows directly from the lead. If the lead establishes the threat of redescription, this question forces her to provide a criterion for admissible outcomes. If she cannot provide a principled criterion independent of the theory itself, the theory risks circularity or arbitrariness.

  **Question:** To elicit this risk function, you rely on choices among those small lotteries, but if those choices are the very data the theory is meant to explain, aren't you defining the risk function by the choices it is supposed to predict, and how do you break that circularity?
  **Note:** Matter 2 (Measurement without circularity).
  **Follow-up:** If she claims the axioms constrain the function independently, ask whether those axioms are empirical generalizations or normative stipulations, and how we verify them without already assuming the theory.
  **Reasoning:** Having established the need for distinct content, we now probe the epistemology. If the risk function is only known via the choices it explains, the theory loses predictive power. This tightens the pressure on the theory's empirical footing.

  **Question:** Even if you can measure the function in a small world, what licenses exporting a risk function calibrated on enumerated states to decisions where the state space cannot be enumerated, given that risk attitudes often shift when uncertainty becomes ambiguity?
  **Note:** Matter 2 (Exportation from small to large worlds).
  **Follow-up:** If she insists risk attitude is stable across contexts, ask for evidence against situationist psychology which suggests preferences are highly sensitive to framing and context.
  **Reasoning:** This extends the measurement problem to scope. Even if the function is measurable in principle, its application to real-world decisions (where states are unknown) is the guest's specific claim. This questions the validity of that extrapolation.

  **Question:** A known vulnerability of risk-weighted maximization is dynamic inconsistency, where the plan preferred at the start is not the one preferred mid-course; does your theory tell the agent to stick to the plan or update to her current preferences?
  **Note:** Matter 3 (Dynamic consistency).
  **Follow-up:** If she says "stick to the plan," ask whether this implies the agent should ignore her current evaluation of the situation, and how that squares with rational responsiveness to evidence.
  **Reasoning:** We move from static measurement to diachronic rationality. If the theory yields inconsistent plans over time, it threatens the agent's ability to act effectively. This introduces a cost to adopting the theory.

  **Question:** If the answer is that she must stick to the plan via an act of resolve, aren't you admitting that the theory is not a theory of choice at each moment but a theory of planning, and does that concede that expected utility wins on the terrain of moment-to-moment rationality?
  **Note:** Matter 3 (Resolve / Theory of choice).
  **Follow-up:** If she argues planning is the proper locus of rationality, ask whether this disconnects rationality from motivation, since the motivation to act exists only at the moment of choice.
  **Reasoning:** This deepens the dynamic consistency point into a question of agency. If REU requires "resolve" to function, it may be describing a coping mechanism rather than a normative standard for choice itself.

  **Question:** Your machinery requires cumulating probabilities from best to worst outcomes, presupposing a complete ordering, but what does the theory prescribe when the agent cannot completely rank the outcomes, since the weighting function has no input to operate on?
  **Note:** Incomplete rankings of outcomes.
  **Follow-up:** If she suggests incompleteness is itself irrational, ask whether this makes the theory too demanding for human agents who frequently face incommensurable values.
  **Reasoning:** This attacks a structural prerequisite. If the theory cannot handle incompleteness—a common feature of real decision problems—its applicability is severely limited compared to more flexible models.

  **Question:** When this apparatus is used behind a veil of ignorance, does weighting the probabilities of being anyone in particular deliver anything that a prioritarian weighting of people's claims could not deliver on its own, and is the analogy between probability weights and moral claims legitimate?
  **Note:** Social use (Veil of ignorance / Prioritarianism).
  **Follow-up:** If she claims it grounds prioritarianism, ask whether the probabilistic interpretation adds any justificatory force or is merely a mathematical analogy for moral weight.
  **Reasoning:** We shift from individual rationality to social ethics. If the machinery adds nothing substantive to existing ethical frameworks, its utility in moral philosophy is diminished, narrowing its domain of success.

  **Question:** Is this view offered as a theory of rationality, implying agents violate it at their peril, or merely as a theory of actual preference, implying agents who maximize expected utility are simply different rather than irrational?
  **Note:** Rationality vs. actual preference.
  **Follow-up:** If she claims it is a theory of rationality, ask whether risk-aversion is then a cognitive error akin to a probability mistake, or a legitimate value orientation.
  **Reasoning:** This questions the normative status. If it's descriptive, it competes with psychology; if normative, it competes with EU on rationality grounds. Clarifying this is essential before the final synthesis.

  **Question:** Given the need to restrict outcome descriptions, the leap from small to large worlds, the reliance on resolve for consistency, and the structural demand for complete rankings, is risk-weighted expected utility still a genuine rival to expected utility, or is it expected utility with a set of auxiliary hypotheses that do all the heavy lifting?
  **Note:** Synthesis / Cumulative Pressure.
  **Follow-up:** If she insists it is a rival, ask for the single decisive experiment or thought experiment where EU fails and REU succeeds without invoking these auxiliary hypotheses.
  **Reasoning:** This brings all previous pressure points together. It forces the guest to defend the core identity of the theory against the accumulation of qualifications required to make it work, directly addressing your impasse with your friend.
