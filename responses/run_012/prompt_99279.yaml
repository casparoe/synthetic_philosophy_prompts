  ### Ranking of Justifications for False Assumptions in Intervention Models

  1.  **(e) The assumption-ledger view**
      *   **Score:** 92
      *   **Justification:** This approach explicitly quantifies uncertainty and defines the specific domain of validity, directly addressing the safety risks inherent in real-world intervention.

  2.  **(b) Derivational robustness**
      *   **Score:** 84
      *   **Justification:** Demonstrating that a result survives the relaxation of false assumptions indicates the conclusion is not an artifact of a specific modeling choice, increasing reliability.

  3.  **(c) Galilean idealization**
      *   **Score:** 68
      *   **Justification:** While isolating causal factors is theoretically valuable, applying it to intervention requires difficult and often uncertain steps to re-introduce real-world complexities.

  4.  **(a) Milton Friedman's as-if defense**
      *   **Score:** 45
      *   **Justification:** Predictive success in historical data does not guarantee structural validity, making this approach vulnerable to failure when interventions change the system's underlying rules.

  5.  **(d) Fictionalist modeling**
      *   **Score:** 25
      *   **Justification:** Treating a model as a credible fiction severs the necessary ontological link between the model's levers and the world's causal mechanisms, rendering it unsafe for action.

  ***

  ### Moving from Useful Fiction to Warranted Instrument

  For the two highest-ranked justifications, the following **non-empirical** information is required to establish epistemic warrant:

  **1. For the Assumption-Ledger View (e):**
  The modeler requires a **mathematical proof of structural stability** demonstrating that the proposed intervention will not cause the budgeted error terms to interact non-linearly or compound catastrophically outside the specified counterfactual range. Without this logical guarantee, the error budget is merely a static snapshot that may not hold under the dynamic pressure of an actual policy change.

  **2. For Derivational Robustness (b):**
  The modeler requires a **theoretical derivation of the common core** that identifies whether the robust result arises from a shared causal mechanism or merely a shared mathematical constraint inherent to the modeling family. Distinguishing between causal robustness and mathematical artifact is a conceptual task that ensures the "warrant" rests on the world's structure rather than the tool's architecture.
