prompt: |-
  So I'm a backend engineer, never took a single philosophy class, and somehow I've ended up as the person who runs our team's fortnightly lunch-and-learn. Next one I want to do on this thing I keep half-remembering called the reference class problem, because it keeps biting us at work and nobody on the team can agree on anything.

  The thing that keeps happening: we've got an alerting pipeline with a little model that scores each incoming alert with a probability that it's a real incident versus a flake. And the number it spits out is completely hostage to what you count as the pool of "similar past alerts" — all alerts ever, alerts from this one service, alerts from this one rule, alerts on this shift, alerts somebody actually bothered to look at. Pick a different pool, get a wildly different number, and everyone quietly picks the pool that gives them the answer they already wanted. Same fight happens over whether a deploy is risky, or whether a given on-call page "should" have been caught earlier. And the bit that really messes with me: someone always says "just use the empirical frequency from our own logs," but we decide what gets logged in the first place, so it feels like we're choosing the reference class by choosing the logging config.

  Don't explain the reference class problem to me — I've read the wiki page twice and it still won't stick. What I want is a plan for how to teach it to my team in about 25 minutes, mostly me talking over a few slides. The audience is smart engineers, all Bayes-fluent, zero philosophy, and they get impatient fast. So: what has to be in place before the whole thing clicks, in what order, and why does each piece depend on the one before it? What's the one example that should carry the whole talk — I was going to use the alerting thing, but tell me if that's a bad carrier, what it would need to have or lack to be the right one, and what I should use instead if so. Which wrong ideas will they form, in the order they'll form them (my guess is "the right reference class is just whatever your data has the most of" and "this is just the base rate fallacy with extra steps"), and exactly where in the sequence I should head each one off. Also give me one question to ask at the end that'll tell me whether the idea actually landed or whether I just made them nod, and tell me what I should openly say I'm not going to get into at this level instead of bluffing it.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, no philosophy background, runs team lunch-and-learn.
      *   **Audience:** Smart engineers, Bayes-fluent (understand priors, likelihoods, posteriors), impatient, practical.
      *   **Topic:** Reference Class Problem (RCP).
      *   **Goal:** A 25-minute teaching plan (talk + slides).
      *   **Constraint:** Do *not* explain RCP in the abstract (they've read Wiki, it didn't stick). Focus on *how to teach it* so it clicks.
      *   **Specific Pain Point:** Alerting pipeline probabilities vary wildly based on how "similar past alerts" are defined. Logging config influences the reference class.
      *   **Deliverables:**
          1.  Prerequisites/Order of operations (why each step depends on the last).
          2.  The One Example (evaluate the alerting example vs. alternatives).
          3.  Anticipated Misconceptions (order of formation + interception points).
          4.  The "Did it land?" Question.
          5.  What to explicitly exclude (scope boundary).

  2.  **Deconstruct the Reference Class Problem (RCP) for Engineers:**
      *   *Core Issue:* Probability is conditional on the class definition. $P(Event | Class)$. If Class is ambiguous, Probability is undefined.
      *   *Engineering Translation:* Feature selection for a classifier, but the "features" define the population itself. Or: GroupBy keys in SQL determine the aggregate.
      *   *Why Wiki fails:* It's usually abstract (Tibets, CEOs, Socrates). Engineers need concrete, causal mechanisms.
      *   *Why Bayes-fluent helps:* They know $P(A|B)$. RCP is essentially "What is B?"

  3.  **Evaluate the "Alerting" Example:**
      *   *Pros:* It's their actual pain point. High relevance.
      *   *Cons:* It's messy. It involves logging config (causal recursion), human behavior (who looks at alerts), and model architecture. It might be *too* complex for a 25-minute intro because the "class" is multidimensional (service, rule, shift, severity).
      *   *Verdict:* Keep it, but *simplify* it drastically for the core analogy. Use a cleaner "toy version" of the alerting problem to establish the concept, then map back to the real mess. Actually, a cleaner analogy first might be better to isolate the variable. Let's consider the "Bus Arrival" or "Car Accident" analogy.
      *   *Better Idea:* Stick to the alerting example but *abstract* it. Don't use the real pipeline. Use a hypothetical "Service X" with clear dimensions. Why? Because using the real one invites immediate debate about *their* specific logging config, derailing the philosophy lesson.
      *   *Decision:* Use a *simplified* version of their alerting problem. It resonates, but needs to be stripped of the specific political baggage of their current system.

  4.  **Drafting the Sequence (The "Click" Order):**
      *   *Step 1: The Intuition of Frequency.* Engineers trust frequencies. Start there.
      *   *Step 2: The Ambiguity of "Similar".* Show that "similar" is a choice, not a fact.
      *   *Step 3: The Consequence.* Show that different choices = different probabilities = different actions.
      *   *Step 4: The Resolution (Pragmatic).* We can't solve it philosophically; we solve it by utility/cost.
      *   *Dependency:* You can't understand the consequence (Step 3) without accepting the ambiguity (Step 2). You can't accept ambiguity without starting from the intuition of frequency (Step 1).

  5.  **Anticipating Misconceptions:**
      *   *Misconception 1:* "More data = better class." (The "Big Data" fallacy).
      *   *Misconception 2:* "It's just Base Rate Neglect." (Confusing RCP with ignoring the base rate, whereas RCP is *choosing* the base rate).
      *   *Misconception 3:* "We can optimize the class." (Thinking there's a true optimal class rather than a trade-off).
      *   *Interception:* Need to address these exactly when they arise in the flow.

  6.  **The "Did it Land?" Question:**
      *   Needs to be actionable. Not "Do you understand?"
      *   Needs to force a trade-off.
      *   Idea: Ask them to define the class for a *new* scenario where data is scarce.

  7.  **Scope Boundaries (What to Exclude):**
      *   Don't solve it. (There is no solution).
      *   Don't dive into Single Case Probability metaphysics.
      *   Don't discuss frequentist vs. Bayesian interpretations of probability (they are Bayes-fluent, keep it Bayesian).

  8.  **Refining the Plan (Self-Correction/Iterative Polish):**
      *   *Critique:* Is 25 minutes enough? Yes, if strict.
      *   *Critique:* Is the alerting example too emotional?
      *   *Fix:* Use the alerting example but frame it as "The 3 AM Page" scenario.
      *   *Key Insight:* The user mentioned "Logging config determines the class." This is crucial. It means the *measurement* defines the *population*. I need to highlight this feedback loop.
      *   *Structure:*
          1.  Hook (The 3 AM Page).
          2.  The Mechanism (GroupBy).
          3.  The Trap (Choosing the GroupBy).
          4.  The Way Out (Cost Functions).

  9.  **Finalizing the Content:**
      *   *Prerequisites:* None technically, but mindset shift from "Truth" to "Utility".
      *   *Example:* The Alerting one is perfect *if* sanitized.
      *   *Misconceptions:* "Narrowest class" vs "Broadest class".
      *   *Question:* "What cost function are we optimizing?"
      *   *Exclusions:* Metaphysics of probability, solving the problem permanently.

  10. **Writing the Response:** (Aligning tone with user: direct, engineering-focused, no fluff).

      *   *Check:* Did I answer all parts of the prompt?
          *   Plan/Order/Why? Yes.
          *   One Example? Yes.
          *   Wrong Ideas/Interception? Yes.
          *   Final Question? Yes.
          *   What to exclude? Yes.

      *(Self-Correction during drafting)*: Make sure to emphasize *why* the order matters. If you jump to "Cost Functions" too early, they think it's just optimization. They need to feel the *ambiguity* first.

      *(Refining the "Logging Config" point)*: This is the deepest insight the user has. I need to make sure the talk highlights that *instrumentation is ontology*.

      *(Final Polish)*: Ensure the tone matches a senior engineer talking to peers. No academic jargon. Use SQL/Code metaphors.

      *(Wait, one more thing)*: The user said "Don't explain the reference class problem to me". I need to make sure I don't define it in the output, but rather describe *how to teach it*. The output should be a lesson plan, not a definition.

      *(Re-evaluating the Example)*: The user asked "tell me if that's a bad carrier". I should be honest. It's high risk/high reward. It's the *right* example for relevance, but dangerous for objectivity. I will advise using a *sanitized* version of it.

      *(Final Plan Structure)*:
      1.  The Core Sequence (4 slides).
      2.  The Example Strategy.
      3.  The Misconception Intercept Map.
      4.  The Validation Question.
      5.  The "Out of Scope" Declaration.

