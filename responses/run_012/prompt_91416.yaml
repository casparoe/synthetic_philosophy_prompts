answer: |-
  Here is the 25-minute battle plan. Since your team is Bayes-fluent, you don't need to teach probability; you need to teach **ontology**. The problem isn't math; it's schema design.

  ### 1. The Sequence (What must click, in order)

  You cannot jump to "how to fix it" until they feel the "why it's broken." If you start with solutions, they will treat RCP as an optimization problem. It is not. It is a definition problem.

  **Slide 1: The Frequency Illusion (5 mins)**
  *   **Concept:** Probability is a `COUNT(*) / COUNT(*)` query.
  *   **Why first:** Engineers trust aggregates. Anchor them in the comfort of SQL.
  *   **The Move:** Write a query on the board: `SELECT count(failure) / count(total) FROM alerts WHERE ...`
  *   **Dependency:** You need them to agree that probability *is* a frequency derived from a dataset before you show them the dataset is arbitrary.

  **Slide 2: The `WHERE` Clause is a Choice (10 mins)**
  *   **Concept:** The Reference Class is just the `WHERE` clause.
  *   **Why second:** Now that they accept the math, show them the input is subjective.
  *   **The Move:** Show three queries for the *same* alert.
      1.  `WHERE service_id = 'checkout'` (High failure rate)
      2.  `WHERE severity = 'P1'` (Low failure rate)
      3.  `WHERE on_call_engineer = 'me'` (Zero failure rate, because I fix them before logging)
  *   **Dependency:** This relies on Slide 1. If probability is a query, and the query changes, the probability changes. There is no "true" probability, only "conditional on schema."
  *   **Crucial Pivot:** Explicitly call out the logging config. "If we don't log `engineer_id`, Query 3 is impossible. We define reality by what we instrument."

  **Slide 3: The Trade-off (Variance vs. Bias) (5 mins)**
  *   **Concept:** Narrow classes are accurate but noisy (high variance). Broad classes are stable but irrelevant (high bias).
  *   **Why third:** Now that they see the ambiguity, they will panic. "So we can't know anything?" Calm them with ML terms they know.
  *   **The Move:** Map "Specific Reference Class" to Overfitting. Map "Broad Reference Class" to Underfitting.
  *   **Dependency:** You can't explain the trade-off until they accept there are multiple valid classes (Slide 2).

  **Slide 4: Utility, Not Truth (5 mins)**
  *   **Concept:** Don't pick the "true" class. Pick the class that minimizes cost.
  *   **Why last:** This is the only actionable takeaway.
  *   **The Move:** Stop asking "What is the probability?" Start asking "What decision does this probability drive, and what is the cost of being wrong?"
  *   **Dependency:** Requires accepting the Trade-off (Slide 3). If there's no perfect class, we optimize for outcome.

  ---

  ### 2. The One Example: The Alerting Pipeline

  **Verdict:** Use it, but **sanitize it**.

  **Why it's risky:** It's too real. If you use the actual production pipeline, engineers will immediately argue about the specific implementation details ("But we *do* log shift ID...") rather than the philosophical point. They will fight the data, not the concept.

  **What it needs to work:**
  1.  **Strip the specific service names.** Call it "Service Alpha."
  2.  **Hardcode the numbers.** Do not pull live logs. Pre-calculate three wildly different probabilities for the *same* hypothetical alert based on three valid `WHERE` clauses.
  3.  **Include the "Logging Config" trap.** You mentioned this is a pain point. You must explicitly show a slide where changing the logging schema (e.g., dropping `user_id` to save space) retroactively changes the reference class availability for future models.

  **Why not use a different example (e.g., car accidents)?**
  Because you said this is biting you at work. If you use a philosophy example (Socrates is mortal), they will nod, learn nothing, and go back to fighting about alerts. The alerting example is the only one that forces them to confront their own behavior. Just make sure it's a *canonical* version of your problem, not the *current* instance of it.

  ---

  ### 3. Anticipated Misconceptions & Interception Points

  They will form these wrong ideas in this specific order. You must head them off exactly when they arise.

  **Misconception 1: "The Right Class is the Most Specific One."**
  *   **When:** During Slide 2 (The `WHERE` Clause).
  *   **Thought:** "If I filter by Service + Rule + Shift + Engineer, that's the *real* probability."
  *   **Interception:** Hit them with the **Data Sparsity** argument immediately. "If you filter by all 4, you have N=1. Your probability is 0 or 1. That's not a model, that's a memory."
  *   **Script:** "Specificity feels like truth, but it's just overfitting. A class with one member has no predictive power."

  **Misconception 2: "This is Just the Base Rate Fallacy."**
  *   **When:** During Slide 3 (The Trade-off).
  *   **Thought:** "We're just ignoring the global average. We should weight them."
  *   **Interception:** Clarify that Base Rate Fallacy is ignoring the prior. RCP is **arguing over which prior is the valid one.**
  *   **Script:** "Base Rate Fallacy assumes there is one correct base rate. RCP says there are five correct base rates, and they contradict. You can't weight them if they measure different populations."

  **Misconception 3: "We Can Optimize the Class Selection."**
  *   **When:** During Slide 4 (Utility).
  *   **Thought:** "We can write a meta-model to pick the best reference class."
  *   **Interception:** Remind them of the **Logging Config** loop. The meta-model needs a reference class to train on. It's turtles all the way down.
  *   **Script:** "You can't optimize the class without a cost function. But the cost function depends on the decision. You're chasing your own tail. Stop trying to find the right class. Start trying to make the right decision."

  ---

  ### 4. The "Did It Land?" Question

  Do not ask "Does this make sense?" They will lie to end the meeting.

  **Ask this:**
  > "For the next sprint, if we have to choose between logging *more fields* (to narrow the reference class) or *more volume* (to stabilize the broad class), what metric do we need to define *before* we can make that choice?"

  **Correct Answer:** "The cost of a false positive vs. a false negative" (or "The decision we're making").
  **Wrong Answer:** "Accuracy" or "Confidence" or "More data."

  If they say "Accuracy," you failed. They still think there is a "true" probability to be found. If they say "Cost/Decision," they get it.

  ---

  ### 5. What to Explicitly Exclude (Scope Boundary)

  You cannot solve RCP in 25 minutes. If you try, you will look like you're bluffing. Be honest about the limits.

  **Say this verbatim:**
  > "I am not going to tell you how to solve this. There is no mathematical solution to the Reference Class Problem. It is not a bug in our pipeline; it is a property of inference. I am not going to talk about single-case probability metaphysics or frequentist vs. Bayesian interpretations. We are Bayesians here; we know probabilities are states of knowledge. Today is just about admitting that *which knowledge we choose to include* is a product decision, not a data decision."

  **Why:** This disarms the pedants who want to argue about the nature of truth, and it relieves the pressure on you to provide a silver bullet. It frames the problem as **Engineering Trade-offs**, which is where your team lives.
