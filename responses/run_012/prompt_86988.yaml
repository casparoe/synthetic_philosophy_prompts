      *   Conclude strongly.

  6.  **Writing Phase (incorporating constraints):**
      *   *Self-Correction during drafting:* Ensure I don't slip into bullet points when listing arguments. Use transition words. Keep the philosopher of biology voice—analytical, focused on mechanisms and evolutionary stability.
      *   *Word Count Management:* If I'm running short, expand on the implications of the academic case. If long, trim the intro.
      *   *Specific focus:* The prompt asks to "Steelman the orthodox waste-is-essential reading as hard as you can." I need to spend good words on why someone would reasonably believe the orthodox view before tearing it down.

  7.  **Final Polish:** Check against the "no hedging" rule. Make definitive statements. Ensure the distinction between "absolute cost" and "marginal cost differential" is clear throughout.

