  *(Self-Correction on Academic Case)*: The prompt asks to be honest if it doesn't survive. If the postdoc treadmill is just waste, the differential view says it's not a stable signal unless the cost differs by talent. If talented people find it easier, it works. If it's just time-serving, it's noise. I should argue that the differential view exposes the treadmill as potentially inefficient hazing rather than functional signaling.

