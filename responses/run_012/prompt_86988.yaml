answer: |-
  To understand why the orthodox interpretation of signaling theory holds such sway, we must first acknowledge its intuitive and theoretical power. The popular reading of the handicap principle rests on a compelling logic of deterrence. If a signal is cheap to produce, any agent can produce it, rendering it meaningless noise. For a signal to convey reliable information about underlying quality, there must be a barrier to entry that prevents low-quality imposters from mimicking high-quality senders. The orthodox view identifies this barrier strictly with absolute cost. The reasoning is that the signal must impose a fitness penalty significant enough that a low-quality sender would suffer a net loss by attempting it. Therefore, the waste itself—the energy burned, the risk taken, the resources destroyed—is the very mechanism of credibility. On this reading, a peacock's tail is honest precisely because it is cumbersome and dangerous; a PhD is credible because it is arduous and time-consuming. The waste is not a bug; it is the feature. This view suggests a tight coupling between the magnitude of the cost and the reliability of the information. If the cost drops, the reliability should collapse. Consequently, we should expect evolutionary pressure to maintain or even inflate these costs to ensure the firewall against cheating remains intact. This is a robust, conservative view of communication: trust is purchased with blood and treasure, and anything less is suspect.

  However, this reading confuses the condition for stability with the mechanism of honesty. The orthodox view focuses on the height of the cost barrier, but the structural logic of signaling depends entirely on the slope of the cost function. Honesty is maintained not because the signal is expensive in absolute terms, but because the marginal cost of producing that signal differs between sender types. If a high-quality sender pays less for each additional unit of signal than a low-quality sender, an equilibrium exists where the low-quality sender finds it not worth the effort to mimic, even if the absolute cost is trivial. The waste is not what makes it credible; the differential is. If the cost structure is such that quality reduces the marginal burden of signaling, then a signal can be perfectly honest while costing almost nothing. Conversely, if the cost is identical for all senders, the signal can be ruinously wasteful and still tell the receiver nothing at all. Calling this "costly signaling" is a misnomer that directs our attention to the burn rate rather than the incentive structure. The orthodox view treats cost as a toll booth that must be high enough to scare off the poor; the differential view treats cost as a gradient that sorts agents based on their ability to climb it.

  This distinction is not merely verbal; it generates divergent empirical predictions about the dynamics of signal evolution. The orthodox waste-is-essential reading predicts an open-ended arms race toward ever more extravagant signals. If waste is the source of credibility, then selection should favor senders who waste more, as this further distances them from potential cheaters. We should see signals escalating in cost until they hit the hard limit of the sender's survival capacity. The differential-cost reading predicts something quite different. It suggests signals should settle down at roughly the cheapest level that still separates the types. High-quality senders have no incentive to burn resources beyond the point where they are distinguishable from low-quality senders. Efficiency is favored over extravagance. Once the separation is achieved, additional waste is just wasted fitness, not added credibility. Therefore, we should expect to see signals stabilizing at a minimum effective dose rather than runaway maximization. If we observe systems where signals remain modest yet highly informative, the orthodox view struggles to explain why the arms race didn't happen, while the differential view expects it.

  A common objection to this differential reading is that it renders the theory unfalsifiable. Critics argue that since we cannot directly measure anyone's internal cost function, the differential view can explain away any observation post hoc. If a signal is expensive, we say the costs are high; if it is cheap, we say the differential is steep. If the cost function is invisible, is the theory empty? This objection fails because it conflates measurement difficulty with theoretical vacuity. We cannot directly measure fitness either, yet evolutionary theory remains robust because it predicts patterns of behavior and distribution. The differential view makes specific claims about stability and magnitude. It predicts that signals will not exceed the threshold necessary for separation. If we observe a system where signals continue to escalate in cost without any corresponding increase in information transfer or separation efficiency, the differential view is challenged. Furthermore, we can infer cost structures from behavioral responses to environmental changes. If a signal disappears when resources are abundant, it suggests a budget constraint; if it disappears when competition drops, it suggests a separation threshold was met. The theory is not unfalsifiable; it just requires looking at dynamics rather than static snapshots.

  Consider the biological case where the very top-quality individuals stop signaling altogether, leaving only the middling individuals to display. This pattern is awkward for the orthodox reading. If waste is the proof of quality, the highest-quality individuals should be the most extravagant signalers, as they can best afford the cost and have the most to gain from proving their status. For the alpha to go silent while the beta displays looks like a reversal of credibility. Why would the most trustworthy sender stop sending? The differential-cost reading resolves this by recognizing that signaling is only necessary to distinguish oneself from relevant competitors. If the top-quality individual is so far above the rest that their quality is evident through other means, or if the marginal benefit of signaling drops to zero because they already secure all mating opportunities, the cost of signaling outweighs the benefit. They do not need to burn resources to prove what is already uncontested. The middling individuals signal because they are fighting for the tier below the top, where separation is not yet secure. The signal is a tool for differentiation, not a badge of honor. The orthodox view sees the silence as a loss of information; the differential view sees it as an efficiency gain once separation is achieved.

  Now apply this to the social claim that the academic job market's endless postdoc treadmill is a credible signal of commitment. The orthodox reading argues that the profession burns people's twenties on purpose because only the genuinely committed will put up with the misery. The suffering is the firewall. Under the differential reading, this justification only holds if the misery costs genuinely committed researchers less than it costs the less committed. If the marginal cost of a fifth year of postdoc work is lower for the talented and dedicated than for the opportunistic, then it functions as a signal. However, if the cost is merely time served, and the talent distribution does not correlate with the ability to endure arbitrary delay, then the treadmill is not signaling; it is hazing. The differential view forces us to ask whether the extension of the treadmill actually improves separation or just increases waste. If the market were functioning as an efficient signaling system, we should see the duration settle at the minimum time required to distinguish competence. The fact that it keeps extending without clear gains in predictive validity suggests the orthodox view is being used to rationalize inefficiency. The differential reading suggests this system is likely unstable or exploitative, masking labor shortages as credibility tests. It does not survive the reading as a functional signal; it survives as a institutional habit dressed in signaling rhetoric.

  Ultimately, shifting from the waste-is-essential model to the differential-cost model changes what we look for in nature and society. It moves us from admiring extravagance to analyzing efficiency and separation thresholds. It stops us from assuming that because something is hard, it must be meaningful. The orthodox view comforts us with the idea that truth is expensive. The differential view warns us that truth is only expensive for those who cannot afford it, and for everyone else, it should be cheap. If we see waste, we should not assume it is necessary for honesty. We should ask who pays the margin, and whether the signal has settled at the minimum level required to tell the truth. Anything more is not credibility; it is just noise.
