prompt: |-
  Just got out of a two-hour argument with a friend about whether LLMs are basically Skinnerian creatures, and I need a tiebreaker. His case: they're shaped by reinforcement, they emit the next token, there's nothing in there but a history of contingencies — a Skinnerian creature, case closed, and if anything a bad one, since at least a Skinnerian creature has a real world doing the reinforcing. My case: thats the cartoon Skinner, and RLHF has no depriving operation, no discriminative stimulus, nothing like the three-term contingency, so the analogy is carrying way less weight than he thinks. Put on the hat of someone who knows radical behaviorism from the inside — a historian of psychology who has actually read the man, not the Chomsky-review version — and tell me what Skinner would have said about LLMs, and where he'd land among Dennett's four kinds of creatures (and whether that four-way split is even fair to him). Think it through carefully before you write, then give me exactly five numbered points, a sentence or two each, no intro and no conclusion. I want: whether he'd claim LLMs as a vindication of behaviorism; whether their output counts as verbal behavior in his sense (tacts vs mands, and what became of the speaker's history); whether he'd say asking if it has a mind is simply the wrong question; where the prediction is genuinely underdetermined by anything he actually wrote; and what he'd make of RLHF as a technology of control. Please dont just tell me he'd say its all reinforcement.
