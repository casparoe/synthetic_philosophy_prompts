  **Standard Issue**

  The zipper on Leo's backpack was designed for a left-hand pull. It wasn't a conspiracy, just geometry; the tab sat on the right side of the track, meaning you had to reach across your body to zip it up, elbow sticking out like a wing. For Leo, whose right hand was the one that knew where things were, it meant twisting his torso every morning, a little corkscrew motion that Elena watched with a tight smile.

  "Almost there, bug," she said, kneeling to help him. Her own left hand found the tab effortlessly. "You just have to remember to twist."

  "I am twisting," Leo said, his voice muffled by the fabric. He was five, small for his age, with a cowlick that swept stubbornly to the right. "It digs into my rib."

  "That's just how they're made," Elena said, smoothing his hair. "Everyone's backpack is like this. You'll get used to the feel of it."

  She walked him to Oak Creek Primary, holding his left hand because that was the side people passed on in the hallway, the safe side. The school lobby smelled of floor wax and glue. Other parents were milling about, most adjusting collars or checking watches with their left wrists. A few mothers—righties, Elena could tell by the way they wore their watches on the right wrist, exposed and vulnerable—were chatting near the bulletin board. They nodded at each other with a specific, weary solidarity.

  Mr. Harrison met them at the classroom door. He was a tall man with broad shoulders and a standard-issue left-handed wedding band. He beamed at Leo.

  "Welcome! You must be Leo. We're so excited to have you." He shook Elena's left hand, then glanced down at Leo's right hand, which was hovering near his pocket. Mr. Henderson didn't flinch, didn't stare. He just had a way of looking slightly past the hand, as if it were a minor sunburn. "We've got a great spot for him. Near the front, so I can keep an eye on his… alignment."

  "Alignment?" Elena asked.

  "Just his writing posture," Mr. Harrison said smoothly. "Sometimes the right-dominant kids hook their wrists a bit much to see what they're doing. We don't want him smearing the ink. It gets frustrating for them."

  "He likes to write," Elena said, a little too quickly.

  "Oh, wonderful. We love enthusiasm. We just want to make sure he doesn't develop bad habits early on. It's harder for them to maintain the standard flow, naturally." He used the word *them* gently, the way one might talk about people with seasonal allergies. "We'll work on his grip. Just some gentle correction."

  Inside, the room was a grid of desks. Each had a small laminate armrest welded to the left side. Leo climbed into his chair and immediately his right arm collided with the rest. He had to hunch his shoulder, twisting his spine to bring his hand to the paper. He looked like a question mark.

  Mr. Harrison circulated, handing out worksheets. When he got to Leo, he placed a pair of scissors on the desk. The blades were reversed, standard steel, but the handle loops were molded for left-thumb pressure.

  "Try these, Leo," Mr. Harrison said. "I know the standard ones can be tricky for your strong hand. These require a bit less squeeze."

  "I used the ones at home," Leo said. "The other kind."

  "Those are special order," Mr. Harrison said, keeping his voice low, warm. "We don't want you to feel different from your friends. Besides, these are better for fine motor development. You want to be strong, don't you?"

  Leo looked at the scissors. He looked at the girl next to him, who was cutting a perfect circle with her left hand, not looking up. He took the scissors. The paper crumpled.

  "See?" Mr. Harrison said, patting his shoulder. "Just needs practice. We'll help you."

  At pickup, Elena found Mr. Harrison holding a clipboard. He looked apologetic.

  "Just a quick form," he said. "Physical Particulars. For the health office. It helps us track… demographics. For funding."

  Elena took the clipboard. The form was clean, efficient.
  *Name:* _______________
  *Grade:* _______________
  *Dominant Hand:* [ ] Left (Standard) [ ] Right (Adapted)
  *If Right, please initial here:* _______________
  *Acknowledgement:* I understand that standard equipment may require additional adjustment periods for Right-dominant students. The school is not liable for wrist strain or smearing issues arising from non-compliance with Standard Grip protocols.

  "It's just bureaucracy," Mr. Harrison said, seeing her pause. "We have so many righties this year, almost ten percent. It's actually quite high. We're very supportive."

  "I know," Elena said. She initialled the box. Her hand felt heavy. "He just… he cried a little about the desk."

  Mr. Harrison sighed, a sound of genuine sympathy. "I know. It's tough. But look, Elena, we want him to succeed. If we let him write however he wants, he's going to stand out. We don't want him to be *that* kid. The one who makes a fuss about the furniture."

  "He's not making a fuss. He's hurting."

  "He's five," Mr. Harrison said softly. "He doesn't know what's best for his future. Sometimes, being comfortable means learning to fit the world, not asking the world to bend. We'll work on his grip. Maybe we can train the left hand for writing? Just for school? Many righty boys do it. They grow out of the right-hand preference eventually."

  "He's not left-handed, though."

  "No," Mr. Harrison agreed. "But he can be adaptable. That's a valuable trait. Much more than which hand holds the pencil." He smiled, and it was a kind smile. It was the smile of a man who truly believed he was offering a lifeline. "Don't worry. By third grade, nobody will even notice. We'll stop noticing."

  Elena took the form back. She walked to the car where Leo was waiting, buckling his seatbelt with a clumsy reach across his chest.

  "How was it?" she asked.

  Leo held up his hand. There was a smudge of graphite on the side of his palm, black and permanent-looking. "Mr. Harrison said I'm gripping too hard."

  "You were gripping fine," Elena said.

  "He said I'm too right-handed about it," Leo said, repeating the phrase he'd heard in the hallway from an older boy. *Don't be so right-handed about it.* Meaning: Don't be difficult. Don't be obvious. Don't take up space.

  Elena started the car. She looked at her own left hand on the steering wheel, natural and unthinking. She looked at Leo's right hand, resting on his knee, slightly curled as if apologizing for existing.

  "Next year," she said, and she wasn't sure if she was promising or pleading. "We'll look at the private schools. Maybe they have different desks."

  "It's okay, Mom," Leo said, looking out the window at the passing traffic, all steering wheels on the right side, drivers reaching across with their left. "I'll just twist more. I can get used to it."

  Elena merged into traffic. She didn't say anything. She just reached over with her left hand and squeezed his right one, careful not to smudge the graphite, careful not to make a fuss, careful to drive on the side of the road that was built for her.
