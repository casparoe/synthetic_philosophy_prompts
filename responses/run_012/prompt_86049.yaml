prompt: |-
  Hey — I host a tiny interview podcast (like 200 listeners, mostly people from my local rationalist meetup) and next month's guest is a philosopher I've wanted on for ages. She's spent her career defending deontological constraints — the "you may not kill the one to save the five" kind — and she thinks the so-called paradox of deontology is an artifact of bad framing. I've read enough of this stuff to know the paradox: if constraints are supposed to protect people from being violated, then a constraint that forbids you from doing the thing that results in fewer people being violated looks self-undermining — five die so your hands stay clean, which is a weird thing for a morality of respect for persons to be for. Her comeback, as far as I can tell from her papers and a couple of talks online, is that this only looks like a paradox if you assume a moral theory is a device for producing the best outcome, and that once you drop that assumption, the five-vs-one comparison just isn't the kind of thing a constraint answers to. She also thinks constraints are agent-relative all the way down, and that what other people do with the people you didn't save never enters into what you may do.

  I don't want to ask her to restate that, and I don't want the canned stuff she's answered a hundred times. Write me 8–10 questions, in the order I should ask them, so each one sets up the next. Aim them where the view is actually under load: (a) what she gets to say to the five, and whether that's distinguishable from what a person who simply doesn't care says — plus why she'd still feel wrecked about them if the answer is "nothing"; (b) whether her move collapses the constraint into a mere permission, since if numbers never count, is she ever required to save anyone, even when it's free; (c) whether the same "drop the outcome frame" move also dissolves the constraint, i.e. whether she's just a consequentialist about constraints; (d) the doing/allowing vs. intending/foreseeing structure — if she keeps the first distinction and drops the second, why; (e) whether the constraint binds when the one you'd kill is you, and what that tells us about whose rights are doing the work; (f) the torture-the-wrongdoer case, where the person you'd harm is himself a violator — I think that's where "respect for persons" starts straining. For each question, give me the answer she's most likely to give and a follow-up aimed at that answer specifically. I'd rather have six questions that actually bite than twelve she can swat away, so if a question can't be made to bite, cut it and say so.

  Role-wise: be a normative ethicist who knows this debate cold. Think carefully about where the load-bearing joints of the position actually are before drafting anything — start by sketching the two or three strongest replies a defender of constraints has in her pocket, then write the questions against those replies rather than against a strawman. I want the ones that make her say "hmm, that's a good question" and then take a second, not the ones she reframes into something she's already answered.

  Format: give me the questions as a table with these columns — Question | What it presses on | Most likely answer | Follow-up question | Does this actually threaten the view? (high/medium/low, one line of why). Then, after the table, a short JSON object with the fields {"strongest_question": ..., "why": ..., "question_to_cut": ..., "what_a_good_answer_would_have_to_do": ...}.
