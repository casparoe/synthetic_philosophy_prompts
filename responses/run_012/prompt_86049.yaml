answer: |-
  ### Strategic Sketch: The Defender's Strongest Replies

  Before drafting the questions, here are the three strongest moves your guest has in her pocket. We are aiming the questions *through* these shields, not at them.

  1.  **The Agency/Integrity Reply:** "Morality governs the will, not the world. I am responsible for what I *do*, not for the causal chains I fail to interrupt. To demand I kill the one is to demand I become a murderer, which is a demand to corrupt my own moral agency."
      *   *Counter-angle:* If agency is completely decoupled from the state of the world, does morality become a form of solipsistic hygiene?
  2.  **The Incommensurability Reply:** "Rights are not weights on a scale. A violation is a categorical failure, not a quantitative cost. You cannot 'balance' a murder against five deaths because they belong to different normative categories."
      *   *Counter-angle:* If the categories are so distinct, why does the *death* of the one matter? If it's just about the "killing motion," why not forbid killing but require nothing to prevent death?
  3.  **The Separateness of Persons Reply:** "Aggregation treats people as vessels for value. Constraints respect the boundary between individuals. I cannot use Person A as a resource to save Person B, even if B is a group."
      *   *Counter-angle:* This works for killing, but does it hold for saving? If I can't use A to save B, can I *fail* to use myself to save B? And if A is a villain, is the boundary still sacred?

  ***

  ### Interview Questions

  | Question | What it presses on | Most likely answer | Follow-up question | Does this actually threaten the view? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1.** You argue the "paradox" vanishes if we stop treating morality as an outcome-production device. But if I stand before the five survivors and explain that I didn't kill the one because "morality isn't about outcomes," haven't I just told them their deaths don't matter to me? How is this distinguishable from simple indifference? | **(a) The Address to the Five:** Tests whether the view collapses into moral narcissism (caring more about one's own status than others' lives). | "It's not that their deaths don't matter; it's that *my* moral agency isn't a tool to fix the world. I respected the one as an end, which is a form of caring that outcome-thinking misses." | "If that form of caring leaves five dead when they could have lived, does the survivor hear 'respect' or do they hear 'I prioritized my integrity over your life'? If the latter, isn't the 'respect' claim purely internal?" | **High.** Forces her to bridge the gap between agent-relative duty and interpersonal justification. |
  | **2.** Let's grant that numbers don't count against the *constraint* (you can't kill the one). But do numbers count for the *duty to aid*? If you can save the five at no cost to yourself, are you *required* to? If yes, doesn't aggregation sneak back in through the back door of positive duties? | **(b) Constraint vs. Permission:** Tests the asymmetry between negative and positive duties. | "Constraints forbid; they don't necessarily require. I may have a duty to aid, but that's distinct from the constraint against killing. Numbers might count in aid, but not in violation." | "If numbers count in aid but not in killing, what is the moral magic of the *act/omit* distinction? Why does the causal pathway change whether five lives outweigh one?" | **High.** Presses the coherence of the negative/positive duty split. |
  | **3.** You say constraints protect persons from being used. But if I choose to sacrifice *myself* to save the five, most deontologists say that's permissible, even noble. If the constraint is about the sanctity of the person, why am I allowed to violate it on myself? Who owns the right—the person or the moral law? | **(e) Self-Sacrifice:** Tests whether the constraint is a right (waivable) or a duty (binding). | "You have sovereignty over yourself. The constraint protects you from *others*; it doesn't forbid you from waiving your own protection." | "If I can waive it, then the constraint isn't about the 'inviolability of persons' generally, but specifically about *interpersonal* boundaries. Does that mean the 'paradox' is just a rule about social interaction, not objective value?" | **Medium/High.** Challenges the metaphysical grounding of the constraint. |
  | **4.** Consider the terrorist who planted the bomb. He is a person, but he is also a violator. If we torture him to save the five, are we violating a constraint? If you say yes, 'respect for persons' seems to protect predators. If you say no, doesn't that imply constraints depend on moral merit, not personhood? | **(f) The Wrongdoer Case:** Tests the "respect for persons" foundation. | "Rights can be forfeited by violating the rights of others. He placed himself outside the protection of the constraint by his own agency." | "If rights are forfeitable, then the constraint isn't protecting 'persons' as such, but 'persons in good standing.' Doesn't that turn deontology into a kind of moral contract that villains opt out of?" | **Medium.** Standard forfeiture reply, but presses the definition of "personhood." |
  | **5.** If I follow your view and let the five die, I will likely feel profound guilt. You might say this is just psychological residue. But if I truly did the *right* thing (as your theory says), why is guilt a rational response? Does the guilt suggest I actually did something pro tanto wrong that your theory can't account for? | **(a) Emotional Residue:** Tests whether the theory matches moral phenomenology. | "Guilt isn't always normative. You can feel regret for a tragic situation without admitting moral fault. It's agent-regret, not guilt." | "But if the regret is universal and rational, doesn't that imply a moral 'remainder'? If the theory says 'all clear' but the moral sense says 'stain,' is the theory describing morality or just rationalizing it?" | **Medium.** Hard to prove phenomenology tracks truth, but presses the "clean hands" claim. |
  | **6.** You reject the outcome frame to save the constraint. But if I optimize for "minimizing constraint violations" rather than "minimizing deaths," haven't I just become a consequentialist about constraints? What stops this from being consequentialism with a different metric? | **(c) Consequentialism about Constraints:** Tests the structural difference between deontology and consequentialism. | "Because the constraint binds *me* specifically. A consequentialist about constraints would let me kill one if it prevented two others from killing. I am forbidden to do that." | "So the difference isn't the *goal* (minimizing violations), but the *assignment* of the goal? If the goal is still to minimize violations globally, why am I forbidden to do my part to achieve it?" | **High.** Presses the agent-relativity claim directly. |

