prompt: |-
  You're a philosopher who works on well-being measurement and social choice, so I want you to think carefully here rather than give me the textbook tour. I've been trying to work out what I actually believe about comparing how well off two people are, going case by case on gut feel, and its driving me a bit mad.

  - A is in agony for a day, B has a mild headache all day. A is worse off. That's a fact about the two of them, not about me, and it would still be true if everyone disagreed.
  - Is A's day three times as bad as B's? Is A's agony equal in badness to C's grief? My gut says there's nothing there to be right or wrong about — not "I don't know," but "no fact."
  - Take £100 off a rich person and give it to a poor person: better. And I'm happy to say the poor person gets more out of the £100, without thinking there's any number for how much more.
  - Someone already far better off gains a lot, someone badly off gains a little: I still feel the little gain to the badly-off person is the better outcome. Shrink the little gain enough and my gut flips.
  - Two lives equally good overall but shaped completely differently — one placid, one full of struggle and recovery — and I don't think there's any fact of the matter about which is better. I get irritated at people who insist there must be one.
  - My 20-year-old self versus me now: I'll happily say I'm better off, but push me on whether it's my preferences then or my preferences now doing the work and I'll wriggle.

  My provisional guess at a principle: I can rank lives by how bad the worst stretches are, but I can't do arithmetic on those rankings. That seems to save the first and third bullets, maybe the fourth. I don't see how it gets the fifth or sixth.

  So: what principle, or small set of candidates, actually fits this, stated precisely, with the case that forces each clause? Which of my verdicts does it make me give up? And what does it say about a case I haven't listed — someone whose preferences have been reshaped by years in a very restricted institution and who now sincerely reports being content: better off than me, worse off, or no fact of the matter? If no single principle saves the lot and I just have to drop one verdict, say which and why. And if I'm confused somewhere — if "no fact of the matter" is being asked to do work it can't do, or the whole framing is off — push back instead of humouring me. Start by brainstorming a few candidate principles before you commit to one, and be upfront about how confident you are in the final answer.
