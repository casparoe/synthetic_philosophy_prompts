  2. Asserting that consensual deals without harm are fine (5) clashes with banning price gouging even when it secures supply and involves willing buyers (2). You need to either define exploiting desperation as a specific harm or accept that price gouging bans are inefficient paternalism.
  3. Allowing kidney sales relies on the same consent-under-duress logic that makes you oppose price gouging on water during floods. Consistency requires either permitting price gouging as liberty or banning kidney sales to protect the economically desperate.
  4. Applying your veil of ignorance rule (6) might lead you to ban kidney markets to protect the poorest version of yourself, contradicting your current stance (1). You must decide if your current gut feeling overrides the procedural rule you set for unsure cases.
  5. Permitting payment for bodily risk (4) while banning payment for civic action (3) creates a boundary you haven't justified beyond the commodification vibe you reject elsewhere. You need to articulate why bodily service is sellable labor but civic participation is not, without relying on View 5's dismissal of commodification.

  Abandoning the absolute claim in point 5 that commodification is never a valid reason would allow your intuitions on voting and price gouging to stand without logical contradiction.
