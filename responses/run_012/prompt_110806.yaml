prompt: |-
  ok so I'm not an academic, this is just me arguing with friends and trying to keep my own head straight, and I want to know wether my views on buying and selling things actually hang together. Here's where I've ended up:

  1. Selling a kidney should be legal. The ban kills people who are waiting, and the "it's degrading to sell part of your body" thing has never been a real argument to me, it's a vibe.
  2. Price gouging laws are right. Somebody tripling the price of bottled water the week after a flood is doing something wrong, and it's still wrong even if the high price is what gets the water trucked in.
  3. Selling your vote should be illegal, and not just because it's hard to police. Even a sale nobody could ever catch would be wrong.
  4. Paying someone to take part in a risky drug trial, or to carry a baby for you, is fine as long as they actually understand what they're signing up for.
  5. "That shouldn't be for sale" is never its own reason. If nobody involved is harmed and nobody else is worse off, the deal is fine, and "commodification" is just the word people use when they can't name the harm.
  6. When I'm unsure I try to ask what rule I'd want if I didn't know which side of it I'd end up on, instead of trusting my gut about the particular case.

  I'd like to think that's one coherent package but I honestly can't tell, and I don't want to just drop whichever one is inconvenient. Which of these are actually pulling against each other and how badly, and which ones only look like they clash but don't? Give it to me as exactly five numbered points, one or two sentences each, worst tension first, each with what would have to give, and finish with the single change that would clean up the most. No intro, no summing up at the end.
