answer: |-
  1. Does the proposal establish an exclusive privilege that diverts capital from better employments and forces home consumers to buy dearer while territory producers sell cheaper? An affirmative answer counts as sufficient to reject the proposal unless no trade is possible otherwise, stopping the process immediately. The thirty-year concession fails this test by excluding competitors, while the island dependency passes if trade remains open upon relinquishment.

  2. Does the arrangement constitute the commercial agent as the sovereign authority over the people with whom it trades, creating an interest opposed to theirs? If yes, this is sufficient to reject the proposal due to expected bad governance, stopping the process immediately. The consortium concession fails here by combining merchant and sovereign roles, whereas the island administration passes only if the state governs directly or relinquishes authority entirely.

  3. Do the charges for defence and administration of the possession exceed the revenue it contributes to the home country? An affirmative answer is sufficient to recommend divestiture, stopping any proposal to retain or expand authority unless offset by reciprocal contribution. The concession might pass if the consortium bears all costs, but the island dependency fails this test as it currently requires a naval subsidy.

  4. Does the policy maximize the annual produce of land and labour by ensuring reciprocal representation or by parting with authority to keep trade on equal terms? A negative answer is not sufficient to stop the proposal alone but dictates the form of the arrangement toward reciprocity or free trade. The concession fails to offer reciprocity, while the island proposal succeeds only if authority is relinquished while securing market access.

  5. Where does the economic calculation end and the decision become a question of political values, and where might this procedure misfire by recommending an outcome you will not want to hear? This step hands the decision to the minister when strategic honour overrides net expense, acknowledging the procedure may misfire on the island case by recommending relinquishment despite political costs. The procedure stops here, warning that Smith's remedy of equal trade after separation may prove impossible if neighbours seize the territory, while the concession remains rejected unless strategic necessity overrides economic loss.
