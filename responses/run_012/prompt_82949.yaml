  Actually, for the JSON, I should reflect the *stubbornness* described. "Nothing" might be appropriate for some if they are dogmatic, but "a formal proof..." is better for a reading group.

  Let's finalize the "disagreement_type". Is it "ill_posed_question"? The Dissolution camp thinks so. But the others think it's solvable. "Mixed" is safer and more accurate. Components: "different_questions_under_one_name" and "disagreement_about_standards_of_correctness".

  Let's finalize the "askers_hypothesis". The user says: "disagreement about what a decision problem is... answering different questions under one name." This is "partly right". It misses the normative clash (which question *ought* to be asked).

  Okay, ready to write.

  *(One last check on constraints)*: "If your diagnosis presupposes an answer to the puzzle itself, say which." I should mention this in the prose. My diagnosis presupposes that the tension between ex-ante and ex-interim is irreconcilable without pluralism, which leans towards the Dissolution/Pluralist view but doesn't solve the math.

