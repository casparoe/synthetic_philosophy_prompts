      *   *Drafting:* The regress is ontological, not merely linguistic. It concerns the *unity* of the fact. At stage one, $R$ is posited to unify $a$ and $b$. But if $R$ is an entity, it stands alongside $a$ and $b$ as a term. To unify, it must relate to them. This requires a new relating entity, $R_1$. Crucially, the requirement at stage two is identical to stage one: $R_1$ is now an entity alongside $a$ and $R$, so it too stands apart from what it must unify. It suffers the same defect as $R$.
