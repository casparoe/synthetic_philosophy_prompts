  (1) "My paraphrase, tightened"
  Consider a relational fact, $aRb$. If $R$ is a distinct entity from $a$ and $b$, it must be connected to them to function as a relation. But connecting $R$ to $a$ requires a further relation, $R_1$. Now $R_1$ must connect to $a$ and $R$, requiring $R_2$, ad infinitum. Thus, $R$ never actually connects anything. Alternatively, if $R$ is not distinct but merely a third term alongside $a$ and $b$, we have a collection $\{a, b, R\}$, not a unified fact. Either $R$ is inert (a mere list) or it demands an impossible infinite chain of connectors. Therefore, relations cannot intelligibly relate terms; they are contradictory appearances rather than ultimate reality.

  (2) "What the regress is a regress of"
  The regress is ontological, concerning the *unity* of the fact, not merely linguistic. At stage one, $R$ is posited to unify $a$ and $b$. But if $R$ is an entity, it stands alongside $a$ and $b$ as a term. To unify, it must relate to them. This requires a new relating entity, $R_1$. Crucially, the requirement at stage two is identical to stage one: $R_1$ is now an entity alongside $a$ and $R$, so it too stands apart from what it must unify. It suffers the same defect as $R$. If $R$ needed connecting because it was "external," $R_1$ is equally external. The dependence is not causal but constitutive: the existence of the relational fact *depends* on the completion of the relating work. Since each step produces another term requiring relating, the work is never done. The regress shows that the very concept of a relation as a distinct entity connecting terms entails an endless deferral of the unity it promises. It is a regress of *conditionality*: the condition for $aRb$ being a fact is never met because each condition generates a further condition of the same type.

  (3) "Is it vicious?"
  The case for benignity rests on category distinctions. Russell argues Bradley treats relations as things (substances) rather than ways things are. If $R$ is unsaturated (a verb-like entity), it doesn't need a further glue to stick to $a$. Asking "what relates $R$ to $a$?" is a category mistake, like asking "what weighs the number 2?" The case for viciousness rests on the demand for intelligibility. Bradley argues that if we cannot say *how* unity is achieved without generating contradiction, the concept is flawed. Even if we posit $R$ as primitive, the logical structure remains: $a$, $b$, and $R$ are distinguishable. If they are distinguishable, their union requires explanation. To stop at "brute unity" is to abandon philosophy for mysticism. If the analysis of any relational fact inevitably produces distinct elements whose togetherness remains unexplained, the fact is inherently contradictory. The regress is vicious because it reveals that the concept of external relations cannot fulfill its own definition of providing unity without presupposing the unity it seeks to explain.

  (4) "What the regress would and wouldn't license"
  The argument successfully licenses the conclusion that relations cannot be conceived as distinct entities *external* to their terms without generating logical incoherence. It proves that relational unity is not additive; you cannot build a fact from independent parts plus a connector. However, it does not immediately license Bradley's monism (the Absolute). To move from "relations are contradictory" to "only the Absolute is real" requires the premise that reality must be wholly non-contradictory and intelligible.
  The smuggled leap is the criterion of reality. Bradley assumes that if a concept generates a regress when analyzed, it is merely "appearance." A realist might argue that the regress shows only the limits of analysis, not the unreality of the fact. Furthermore, defeating external relations doesn't prove internal relations work (Bradley argues they collapse distinctions). The argument licenses skepticism about pluralistic realism, but reaching the Absolute requires additional arguments about the nature of experience and coherence. It shows relations are not *ultimate*, but not necessarily that they are *illusory* in a practical sense, only metaphysically dependent.

  (5) "Bottom line"
  Your reconstruction is accurate to Bradley's text. The crucial pivot point is not whether the regress exists (both sides agree it does if you treat relations as terms), but whether the demand for further relating is legitimate. Russell denies the demand; Bradley insists intelligibility requires it. To defend Bradley, press the claim that distinguishable elements require a ground of unity. To attack him, argue that unity is primitive and analysis is secondary.
