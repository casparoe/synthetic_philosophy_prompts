      *   *Content:* Start with the relational fact (aRb). If R is distinct, it needs connecting to a and b. Let's call the connector R1. Now we have aR1R and R1b. But R1 needs connecting to a and R. This generates R2, etc. Alternatively, if R isn't distinct, it's just a lump.
      *   *Drafting:* Take a relational fact, $aRb$. If $R$ is a distinct entity from $a$ and $b$, it must be connected to them to function as a relation. But connecting $R$ to $a$ requires a further relation, $R_1$. Now $R_1$ must connect to $a$ and $R$, requiring $R_2$, ad infinitum. Thus, $R$ never actually connects anything. Alternatively, if $R$ is not distinct but merely a third term alongside $a$ and $b$, we have a collection $\{a, b, R\}$, not a unified fact. Either $R$ is inert (a mere list) or it demands an impossible infinite chain of connectors. Therefore, relations cannot intelligibly relate terms; they are contradictory appearances rather than ultimate reality.

