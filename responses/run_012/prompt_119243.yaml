  # JOINT STATEMENT ON ANTHROPIC REASONING
  **Drafted for the Anthropics & Probability Seminar Study Group**
  **Status:** Working Document for Consensus-Building

  ## 1. PREAMBLE
  We, the undersigned members of the study group, acknowledge that our debate regarding the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) has reached an impasse. We recognize that this impasse stems not from a failure of logic, but from differing foundational premises regarding indexical information. This document is not an attempt to convert one side to the other, but to map the terrain of our agreement and isolate the precise coordinates of our disagreement.

  ## 2. SHARED COMMITMENTS
  Before addressing our divergence, we affirm the following methodological commitments held by both camps:

  1.  **Bayesian Framework:** We all agree that anthropic reasoning must be consistent with Bayesian probability theory. We are arguing over priors and likelihood functions, not the rules of updating.
  2.  **Indexical Uncertainty is Real:** We agree that "where/who I am" is a distinct category of uncertainty from "what the world is like." Learning *de se* information (e.g., "I am awake now") can update *de dicto* beliefs (e.g., "The coin landed Tails").
  3.  **The God's-Eye View:** We agree on the "objective" probabilities of hypotheses prior to considering indexical information. If a coin is fair, the prior probability of Heads is 0.5 for everyone. The disagreement begins only when we condition on the fact that *we* are the ones observing the result.
  4.  **Rejection of Solipsism:** We agree that other observers exist (or could exist) and that our reasoning should not treat our own existence as metaphysically unique in a way that breaks physical symmetry.

  ## 3. PRECISE DEFINITIONS
  *Note: We correct some informal glosses used in early seminars to align with standard formalizations.*

  **The Self-Sampling Assumption (SSA)**
  *   **Core Claim:** You should reason as if you are a random sample from the set of **all actually existing observers** in your reference class.
  *   **Implication:** Your existence confirms that your hypothesis allows for observers like you, but it does *not* favor hypotheses that produce *more* observers. It favors hypotheses where a larger *fraction* of the observers have your specific evidence.
  *   **Correction to Seminar Gloss:** It is not strictly true that SSA says "existence tells you nothing." It says existence rules out worlds with *no* observers like you, but it does not weight worlds by the *count* of observers.

  **The Self-Indication Assumption (SIA)**
  *   **Core Claim:** You should reason as if you are a random sample from the set of **all possible observers**.
  *   **Implication:** The mere fact that you exist is evidence in favor of hypotheses that contain more observers. All else being equal, a world with a trillion observers is a trillion times more likely to contain *you* than a world with one observer.
  *   **Correction to Seminar Gloss:** SIA proponents do not necessarily claim they can deduce the size of the universe from an armchair with certainty; rather, they claim the *likelihood ratio* shifts in favor of larger populations, which must then be weighed against the prior probability of those hypotheses.

  ## 4. AREAS OF AGREEMENT
  There are standard cases where SSA and SIA converge. We agree on the following:

  1.  **Non-Anthropic Updates:** If the evidence is purely external (e.g., "I see a red light"), both sides update identically.
  2.  **The "Small World" Case:** If Hypothesis A has 2 observers and Hypothesis B has 2 observers, but in A both see evidence E and in B only one sees evidence E, both SSA and SIA favor A. (Here, the *fraction* and the *count* move together).
  3.  **Existence as a Constraint:** Both sides agree that if a hypothesis implies you *cannot* exist (e.g., "No conscious beings exist"), that hypothesis is falsified by your existence.

  ## 5. AREAS OF DISAGREEMENT
  *Phrased charitably, as each side understands its own motivation.*

  **The SSA Position:**
  "We reject the idea that the universe is obligated to produce us just because it is large. SIA leads to the 'Presumptuous Philosopher' problem, where one can reject a well-motivated physical theory (that predicts few observers) in favor of a wilder theory (that predicts infinite observers) solely based on the fact of one's own existence. We believe this violates the principle that physical theories should be tested by physical evidence, not by headcounts of observers. We prioritize the *fraction* of observers who see our evidence over the *total number*."

  **The SIA Position:**
  "We reject the idea that our existence is a 'free' variable that doesn't update probabilities. If you are more likely to be created in a world with a billion people than in a world with one, then finding yourself created *is* evidence that you are in the world with a billion people. SSA leads to the 'Doomsday Argument,' where one can conclude the end of humanity is imminent simply because we are early in the sequence of humans. We believe this is an absurd constraint on the future derived from nothing but birth order. We prioritize the *total number* of observers as a weighting factor for likelihood."

  ## 6. THE CRUXES
  *These are the sub-questions where settling the definition would force at least one side to update.*

  ### Crux 1: The Reference Class Problem
  *   **Question:** Who counts as a member of the group you are sampling from? (e.g., All humans? All conscious beings? All beings who know their name is "Alex"?)
  *   **Why it matters:** SSA is extremely sensitive to this. If the reference class is "All Humans," Doomsday holds. If the reference class is "All Beings Born in the 20th Century," Doomsday vanishes. SIA is less sensitive but still affected.
  *   **Test Case:** A world with 100 humans and 1,000,000 aliens. You discover you are human.
      *   **SSA Prediction:** If Reference Class = "All Observers," you should be surprised you are human (100/1,000,100). If Reference Class = "Humans," no update.
      *   **SIA Prediction:** You should be less surprised than SSA (because the world with aliens is weighted higher to begin with), but still update somewhat.
  *   **Agreement:** If we cannot define the reference class non-arbitrarily, SSA becomes unfalsifiable.

  ### Crux 2: Observers vs. Observer-Moments
  *   **Question:** Are we sampling from whole lives (persons) or temporal slices (moments)?
  *   **Why it matters:** This determines the outcome of Sleeping Beauty-style cases.
  *   **Test Case:** Sleeping Beauty (1 awakening on Heads, 2 on Tails).
      *   **SSA Prediction:** If sampling *Persons*, Credence(Heads) = 1/2. If sampling *Moments*, Credence(Heads) = 1/3.
      *   **SIA Prediction:** Typically aligns with *Moments* (Credence(Heads) = 1/3) because SIA weights by the number of opportunities for experience.
  *   **Agreement:** If SSA adopts "Observer-Moments" as the default reference class, it converges with SIA on many practical cases. The fight is often about whether "Moments" is a valid ontological category for sampling.

  ### Crux 3: The Prior Weight of Existence
  *   **Question:** Does the hypothesis "There are more observers" get a prior boost, or does the boost happen at the likelihood stage?
  *   **Why it matters:** This is the mathematical engine of the Presumptuous Philosopher.
  *   **Test Case:** Two physical theories, T1 and T2. T1 predicts 1 billion observers. T2 predicts 1 trillion observers. Both fit existing physical data equally well.
      *   **SSA Prediction:** Credence remains 50/50 (assuming equal priors). The number of observers is irrelevant to the truth of the physics.
      *   **SIA Prediction:** Credence shifts to 1000:1 in favor of T2. You are 1000x more likely to exist in T2.
  *   **Agreement:** This is the hardest substantive disagreement. It asks whether "I exist" is evidence about physics.

  ## 7. ANALYSIS OF THE SEMINAR CASE (The Amnesiac Coin)
  *Case Description:* A fair coin is flipped.
  *   **Heads:** You live for 1 day.
  *   **Tails:** You live for 1,000 days.
  *   **Condition:** In the Tails scenario, your memory is wiped every night. Each morning you wake up with no idea if it is Day 1 or Day 700.
  *   **Question:** Upon waking, what is your credence that the coin landed Heads?

  **Diagnosis of Ambiguity:**
  This case is **rigged/ambiguous** because it does not specify the **Reference Class**. The SSA/SIA split does not bite until we define what is being sampled.

  **Scenario A: Reference Class = "Whole Lives" (Persons)**
  *   **SSA:** There is one person in Heads-world. There is one person in Tails-world. You are a random person from the actual people. Since there is one in each, the probability is **50% Heads**.
  *   **SIA:** There is one person in Heads-world. There is one person in Tails-world. SIA weights by number of observers. Since the count is equal (1 vs 1), the probability is **50% Heads**.
  *   **Result:** **Agreement.** (Both are Halfers).

  **Scenario B: Reference Class = "Observer-Moments" (Awakenings)**
  *   **SSA:** You are a random awakening from the set of actual awakenings.
      *   Heads: 1 awakening.
      *   Tails: 1,000 awakenings.
      *   Total actual awakenings: 1,001.
      *   Probability you are in Heads: 1/1001. **Credence ≈ 0.1% Heads**.
  *   **SIA:** You are a random possible observer-moment.
      *   SIA weights the hypothesis by the number of moments.
      *   Likelihood ratio favors Tails 1000:1.
      *   **Credence ≈ 0.1% Heads**.
  *   **Result:** **Agreement.** (Both are "Thirder"-style, or in this case, 1/1001-ers).

  **The Real Disagreement in This Case:**
  The disagreement is not between SSA and SIA here; it is between **Scenario A and Scenario B**.
  *   The **SSA camp** is internally divided. Some SSA proponents insist on "Whole Lives" to avoid the Doomsday Argument (favoring 50%). Others accept "Observer-Moments" to handle Sleeping Beauty coherently (favoring 0.1%).
  *   The **SIA camp** generally defaults to Scenario B (Observer-Moments), as SIA treats every center of experience as a data point.

  **Verbal Dispute Flag:**
  In this specific case, if the SSA side adopts "Observer-Moments" as their reference class, **SSA and SIA yield the same numerical answer.** The fight is not about the math of sampling, but about the *metaphysics of the sampler*. Is "You" the whole life or the current morning?
  *   If "You" = Whole Life: The memory wipe is irrelevant. You are just a person wondering about your lifespan. (50%)
  *   If "You" = Current Experience: The memory wipe creates 1,000 distinct epistemic situations. (0.1%)

  ## 8. CONFIDENCE AND UNCERTAINTY STATEMENT
  *Per the request, we flag our confidence levels in the above characterizations.*

  *   **High Confidence:** The mathematical definitions of SSA (fraction weighting) and SIA (count weighting). The convergence of SSA/SIA when Reference Class is fixed to Observer-Moments.
  *   **Medium Confidence:** The claim that SIA always leads to the Presumptuous Philosopher conclusion (some SIA proponents introduce "cutoffs" to avoid this). The claim that SSA always leads to Doomsday (depends entirely on reference class selection).
  *   **Low Confidence:** The claim that all SSA proponents view "Whole Lives" as the default reference class. There is significant internal variation in the SSA camp regarding whether reference classes should be broad or narrow.

  **The Single Point of Least Certainty:**
  I am least sure about the **SSA camp's consensus on the Reference Class for the Amnesiac Coin case.**
  *   *Reasoning:* Prominent SSA proponents (like Bostrom) have shifted views over time regarding Observer-Moments vs. Observers. Some SSA users treat "Sleeping Beauty" as a Halfer case (Whole Lives), while others treat it as a Thirder case (Moments). If your study group's SSA members are "Halfer SSA," they will say 50%. If they are "Thirder SSA," they will say 0.1%.
  *   *Recommendation:* Do not ask the SSA side "What does SSA say?" Ask them "What is your Reference Class?" That is the actual variable determining their answer.

  ## 9. CONCLUSION
  The SSA/SIA debate is often a proxy war for the **Reference Class Problem**. If we define the reference class as "Observer-Moments," SSA and SIA often converge numerically, though they justify it differently. If we define it as "Whole Persons," they diverge sharply on cases involving memory loss or multiple awakenings.

  We recommend the seminar pause the "SSA vs. SIA" labeling and instead debate: **"What is the correct ontological unit for anthropic sampling: The Person or The Moment?"** Resolving that question renders the SSA/SIA distinction largely mathematical rather than philosophical.

  ***

  **Signed:**
  *The Study Group (Draft)*
