  Hey, so I'm taking this seminar on anthropics and probability and my study group has basically split in half over the self-sampling assumption vs the self-indication assumption, and we've been going around in circles for like three weeks now. The SSA people say that when you reason about where you are among all the observers, you should treat yourself as a random draw from the observer-positions in your world, so the mere fact that you exist tells you nothing extra about how many observers there are. The SIA people say no, your existence is itself evidence, so hypotheses that posit more observers are automatically likelier to be the ones you're in -- which is why everyone accuses them of being the presumptuous philosopher, the guy who thinks that just from the fact that he's sitting there existing, he can be near-certain the universe contains astronomically many people. And then the SSA people run the Doomsday argument and the SIA people run the presumptuous philosopher right back at them as a reductio, and both sides just keep saying, look, your assumption gives absurdity. Then someone mentions Sleeping Beauty and we all start over from scratch.

  I want us to write the document we should have written in week one. So: draft the joint statement that an SSA person and an SIA person could both actually sign. Start with the claims both sides accept -- what each assumption really says (spell out both precisely, and correct me if my gloss above is off), what the two share, like both being Bayesian and both trying to make sense of indexical uncertainty, and which parts of the standard cases both sides agree on. Then the disagreements, each one phrased the way its own side would want it phrased, not as a strawman. Then the cruxes: the sub-questions where settling one would force at least one side to move. My guess is the self-indication factor itself, the reference class problem, and whether observers means whole people or observer-moments, but I don't actually know, and figuring that out is half of what I want from you. For each crux, give a case or argument that both sides would agree bears on it, and write down in advance what each side predicts about that case.

  One more thing, and honestly it's the part I care about most: I made up a case in seminar and nobody could agree what either assumption even says about it, so I want it in the document. Roughly -- a coin decides whether you'll live one day or a thousand days, but in the thousand-day case your memory is wiped every night, so each morning you wake up having no idea whether it's day 1 or day 700. Does the SSA/SIA split even bite here, and do the two camps sample persons or morning-experiences? If you think the case is rigged or ambiguous, say so rather than forcing an answer out of it. And if part of the whole SSA/SIA fight turns out to be merely verbal -- two ways of saying the same thing -- then say which part and why, don't smooth it over.

  Also please be upfront about how confident you are in each claim you make on behalf of either side, and flag the single point you're least sure of. i'd much rather have something like, I'm not sure real SSA people would accept this framing of their own view, than a confident summary that turns out to be a strawman of one side. Dont bother with citations or a reading list, I just want the document itself.
