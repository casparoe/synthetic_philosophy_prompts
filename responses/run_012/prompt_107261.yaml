answer: |-
  # Joint Statement on the Status of Phenomenal Consciousness
  **Signatories:** [The Illusionist] & [The Phenomenal Realist]

  ### Preamble: Positioning Within the Trichotomy
  We acknowledge that "Illusionism" and "Realism" are families of views, not monoliths. To clarify our dialectic, we adopt the following three-way disambiguation of Illusionism regarding phenomenal properties:
  (i) **Eliminativism:** There are no phenomenal properties; phenomenal consciousness names nothing at all.
  (ii) **Fictionalism:** Phenomenal discourse is a useful fiction rather than a description of anything real.
  (iii) **No-Further-Fact (Deflationary) Illusionism:** Introspective reports are about real, reportable mental states, but those states carry no phenomenal properties over and above their functional and representational ones—the illusion is only that we take there to be such a further property.

  **The Illusionist's Location:** I endorse **(iii)**. I reject (i) because mental states (access, functional, neurobiological) clearly exist; I reject (ii) because the discourse refers to real states, albeit misdescribed. I locate the Realist as believing that a "further fact" exists beyond the functional/representational base.

  **The Realist's Location:** I endorse **Phenomenal Realism** (the view that phenomenal properties are real and irreducible). I locate my colleague as claiming to hold **(iii)**, but I argue that (iii) is unstable: it either collapses into **(i)** (if the "phenomenal" aspect is denied) or concedes Realism (if the real state admitted is sufficient for consciousness). Thus, I regard the trichotomy as potentially misleading regarding (iii), though I accept it as a heuristic for my colleague's intent.

  ---

  ### 1. Agreed Claims
  *We affirm the following substantive propositions. These are not merely trivial truths but commitments that exclude skeptical or obscurantist positions often found in the periphery of this debate.*

  1.  **The Physicality of Introspection:** Introspective judgments about consciousness are physical events produced by cognitive mechanisms. These mechanisms are fallible, subject to evolutionary pressure, and amenable to empirical investigation by cognitive science. We reject the notion that introspection provides infallible, non-physical access to its objects.
  2.  **The Priority of the Meta-Problem:** Solving the "meta-problem" (explaining why humans behave as if they have phenomenal consciousness, regardless of whether they do) is a necessary condition for progress on the "hard problem." A theory that cannot explain the production of phenomenal reports is empirically inadequate.
  3.  **The Epistemic Gap:** There is an uncontroversial *epistemic* gap between physical/functional descriptions and phenomenal concepts. We agree that conceivability arguments (e.g., philosophical zombies) successfully establish this epistemic gap. We disagree only on whether this gap entails an *ontological* gap.
  4.  **Limits of No-Go Arguments:** We agree that no current argument (zombies, knowledge argument, etc.) logically forces the conclusion of substance dualism without additional premises regarding the nature of physical explanation or the transparency of introspection. The debate turns on the plausibility of these auxiliary premises, not on the validity of the core intuitions alone.
  5.  **Criteria for Progress:** Theoretical progress will not be achieved solely by conceptual analysis. It requires a convergent explanation that integrates (a) the cognitive science of introspection (meta-problem) and (b) a coherent ontology of the mental. A theory that solves (a) but renders (b) incoherent is incomplete; a theory that secures (b) but renders (a) impossible is empirically false.

  ---

  ### 2. Residual Disagreements
  *We identify the following points of contention. We have flagged whether we judge the disagreement to be substantive (ontological/empirical) or verbal (conceptual/terminological), noting where these overlap.*

  **Disagreement A: The Stability of Deflationism**
  *   **Illusionist:** "My position (iii) is stable. There is a real state (functional/representational) that causes the report. The error is solely in the *properties* we attribute to that state (intrinsic, non-functional qualia). There is no 'hard problem' once the introspective error is explained." **[Flags as Substantive]**
  *   **Realist:** "Position (iii) is unstable. If the real state causes the report, and the report is 'I am having an experience,' then the experience is real. To say the state exists but the 'phenomenality' is an illusion is to say the state exists but does not do what it essentially does. You are either an eliminativist (i) about the experience itself, or you are a Realist about the functional state." **[Flags as Substantive]**
  *   **Joint Assessment:** **Substantive with Verbal Overlap.** The dispute is verbal insofar as we define "phenomenal property" differently (Illusionist: intrinsic non-functional quality; Realist: whatever grounds the truth of phenomenal reports). It is substantive insofar as it concerns the causal efficacy of the introspective mechanism (does it track a property or confabulate one?).

  **Disagreement B: The Authority of Introspection**
  *   **Realist:** "Introspection may be fallible regarding the *nature* of the experience (e.g., dualist vs. physicalist), but it is authoritative regarding the *existence* of the experience. To deny the existence of the 'what-it-is-like-ness' is to deny the datum itself." **[Flags as Substantive]**
  *   **Illusionist:** "Introspection is not authoritative regarding existence, only regarding appearance. Just as visual perception can present a non-existent object (hallucination), introspection can present a non-existent property (qualia). The 'datum' is the report, not the property reported." **[Flags as Substantive]**
  *   **Joint Assessment:** **Substantive.** This turns on the analogy between perception and introspection. If introspection is a form of inner perception, illusionism is viable. If introspection is constitutive of the state, realism is secured.

  ---

  ### 3. The Cruxes
  *We identify the following sub-questions. Settling these would force at least one of us to revise our position. For each, we state the evidence type we agree is relevant and our respective predictions.*

  **Crux 1: The Mechanism of Introspective Attribution**
  *   **Question:** Does the cognitive mechanism producing phenomenal reports function primarily as a *tracker* of intrinsic properties or as a *constructive model* for control and prediction?
  *   **Agreed Evidence:** Empirical results from cognitive science showing systematic introspective errors (e.g., change blindness, saccadic suppression, misattribution of arousal) and neural correlates of introspective judgment.
  *   **Illusionist Prediction:** Neuroscience will reveal that introspective systems utilize "user-illusion" interfaces that simplify complex functional data into a format that *appears* simple, intrinsic, and non-physical. Finding a specific "qualia neuron" will be impossible; finding a "report-generation mechanism" that operates via heuristic simplification will be confirmed.
  *   **Realist Prediction:** Neuroscience will correlate neural states with reports, but will not explain the *selection* of the phenomenal mode of presentation. The mechanism may be constructive, but it must be tracking *something* to avoid being a system-wide hallucination without cause. We predict findings that show introspection tracks a distinct, higher-order property of neural processing that cannot be reduced to input-output function.

  **Crux 2: The Coherence of Phenomenal Concepts**
  *   **Question:** Can "phenomenal consciousness" be defined ostensively without presupposing the truth of Realism, or is the concept inherently tied to the claim of irreducibility?
  *   **Agreed Evidence:** Conceptual analysis and the success/failure of proposed neutral definitions in cross-philosophical discourse (e.g., can we agree on a definition of 'consciousness' that doesn't beg the question?).
  *   **Illusionist Prediction:** We can successfully define the target of the meta-problem (the disposition to make reports) without committing to irreducibility. Once defined functionally, the intuition of irreducibility will be diagnosed as a cognitive bias.
  *   **Realist Prediction:** Any definition that strips away the claim to irreducibility changes the subject. If you define consciousness functionally, you have explained access, not phenomenality. We predict that attempts to define the phenomenon neutrally will invariably slip back into Realist terminology when pressed for clarity.

  ---

  ### Conclusion
  We acknowledge that our disagreement persists not because of a lack of shared data, but because we interpret the relationship between the *mechanism of reporting* and the *object reported* differently. The Illusionist sees the mechanism as creating the object (in error); the Realist sees the mechanism as detecting the object (with potential error about its nature).

  \answer{The stability of deflationary illusionism}
