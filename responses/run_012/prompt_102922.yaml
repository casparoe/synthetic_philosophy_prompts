answer: |-
  You have independently rediscovered a central concept in the philosophy of science and social theory. There is an established name for this, a specific body of work behind it, and direct answers to your three questions.

  The term you are looking for is **The Looping Effect** (sometimes called **Dynamic Nominalism**).

  The philosopher most associated with this idea is **Ian Hacking**. He developed it specifically to analyze the history of psychiatric categories (like multiple personality disorder, autism, and homosexuality), which matches your observation perfectly.

  Here are the direct answers to your three questions, based on Hacking's framework and related social theory.

  ### 1. Are the two directions (internal adoption vs. institutional enforcement) one phenomenon or two?

  In Hacking's framework, they are treated as **one phenomenon**, though they operate through different mechanisms.

  Hacking calls the category an **Interactive Kind**. The "Looping Effect" describes the entire cycle: the classification changes the people, and the changed people change the classification. He does not strictly separate "people adopting the label" from "institutions enforcing the label." He views them as entangled forces that drive the loop.

  However, in sociology, there is a distinction that maps to your two variations:
  *   **Variation 1 (Internal Adoption):** This is often discussed under **Identity Formation**. The person incorporates the label into their self-concept.
  *   **Variation 2 (Institutional Enforcement):** This is the domain of **Labeling Theory** (associated with sociologists like Howard Becker and Thomas Scheff). This focuses on how societal reaction and institutional tracking (like your school example) create deviance or outcomes regardless of the individual's self-view.

  **Verdict:** Philosophically (Hacking), it is one phenomenon (The Looping Effect). Sociologically, the *mechanisms* are often analyzed separately (Agency vs. Structure), but they feed the same loop.

  ### 2. What makes a category capable of being affected by its own application?

  Hacking draws a sharp line between two types of categories:

  *   **Indifferent Kinds:** These are things that do not care how they are classified. A fractured tibia, a quark, or a chemical element falls here. If you classify a bone as "broken," the bone does not change its behavior because it knows it is broken. The classification aims to match a static reality.
  *   **Interactive Kinds:** These are things that can interact with the classification itself. This applies primarily to **human beings** (and groups of humans).

  **The Differentiator:** The capacity for **reflexivity**.
  For a looping effect to occur, the thing being classified must be able to "know" (in a broad sense) how it is classified and adjust its behavior or self-understanding accordingly.
  *   **Tibia:** Cannot hear the diagnosis. (Indifferent)
  *   **Person:** Can hear the diagnosis, read about it, feel stigma, feel relief, or be treated differently by others based on it. (Interactive)

  Hacking argues that with Interactive Kinds, there is no "true" underlying reality waiting to be discovered. The reality and the description co-evolve.

  ### 3. Does this extend to non-humans (e.g., software concepts)?

  This is the most complex question. Hacking specifically restricts "Interactive Kinds" to **people**, because he believes the loop requires the capacity for self-awareness or suffering. Code does not suffer, and a microservice does not know it is a microservice.

  However, there is a broader concept in social science and economics that covers your software example: **Performativity**.

  Associated with scholars like **Michel Callon** and **Judith Butler**, Performativity argues that statements or concepts do not just describe reality; they *enact* it.
  *   **In Economics:** A theory about how markets work can change how traders behave, thereby making the theory true.
  *   **In Software:** The term "Technical Debt" is performative. Before the term existed, engineers wrote messy code. After the term existed, engineers wrote messy code *and* tracked it, prioritized refactoring, and argued about it in meetings. The concept reshaped the *practice* of engineering.

  **Is it the same phenomenon?**
  Structurally, **yes**. It is a feedback loop where the map changes the territory.
  Philosophically, **there is a distinction**.
  *   In **Psychiatry (Hacking):** The loop runs through the *person's* self-conception.
  *   In **Software (Performativity):** The loop runs through the *practitioners'* behavior. The code itself is an "Indifferent Kind." It does not change because it is named. But the *system of human practices surrounding the code* is an "Interactive Kind."

  So, "Technical Debt" is not an Interactive Kind itself, but "Software Development Practice" is. The category reshapes the humans, who then reshape the code.

  ### Summary and Terminology

  If you want to search for the literature, here is the terminology you should use:

  1.  **The Looping Effect / Interactive Kinds (Ian Hacking):** Use this for the psychiatric/human diagnosis aspect. This is the exact match for your first two paragraphs.
      *   *Key Text:* *The Social Construction of What?* (1999), specifically the chapter "Making Up People."
  2.  **Labeling Theory (Sociology):** Use this for the institutional/school tracking aspect where the subject might not be aware.
      *   *Key Text:* *Outsiders* by Howard Becker.
  3.  **Performativity (Science & Technology Studies / Economics):** Use this for the software/technical concept aspect.
      *   *Key Text:* "The Performativity of Economics" by Michel Callon.

  **Direct Answer to your constraint:**
  No single term covers *everything* from psychiatric patients to software architecture without qualification. Hacking's **Looping Effect** is the precise term for the human/psychiatric phenomenon you described. For the software analogy, it is best described as **Performativity within a Sociotechnical System**.

  You have accurately identified that in social and sociotechnical systems, description is never neutral. It is an intervention.
