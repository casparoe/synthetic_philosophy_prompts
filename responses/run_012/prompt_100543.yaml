prompt: |-
  Design a runnable activity for a ninety-minute session in a graduate seminar on the ethics of emerging technology. There are eighteen participants, who will work at three parallel tables of six. Assume they know the broad shape of the debate over autonomous systems but have not thought carefully about responsibility; do not build the session around any particular author or text.

  The goal is for participants to feel a specific difficulty rather than be told about it: that an autonomous system can produce a serious harm for which no human being is blameworthy, even though competent adults designed it, approved its deployment, operated it, and profited from it. The session should leave them able to distinguish two things that are easily run together. The first is backward-looking blameworthiness, which normally requires that an agent had the capacity to control or foresee the relevant outcome. The second is forward-looking answerability, the question of who must now account for the harm and change the system. The activity must make these come apart in the participants' hands.

  Build it as a structured role-play or simulation, not a debate. Supply the following.

  Roles. Six per table, including a designer, a procurement or deployment decision-maker, an operator, an external auditor or regulator, a frontline worker who deals with the system's outputs, and a person who bears the harm. Give each role private information and a private objective, and arrange the incentives so that each participant has a sincere, non-cynical reason to disclaim responsibility for the outcome. The disclaimers must not be evasions; each must be defensible given what that role knew and could do.

  Mechanism. Choose a concrete setting in which an autonomous system allocates a scarce, life-relevant resource across a population, and let the harm be a distributional one that emerges from the interaction of decisions made by different roles, none of whom could have foreseen it alone. The mechanism should produce the harm through the ordinary, well-intentioned operation of the rules, not through anyone breaking them.

  Two gaps. The design should let participants discover, in sequence, the difference between a gap that is merely epistemic, where someone in principle could have known what the system would do, and a gap that is a genuine gap in control, where the outcome was not within anyone's power to determine. It should also force them to separate a genuine responsibility gap from the mere diffusion of responsibility across many hands. Include a moment where the group tries to close the gap by assigning blame anyway, and a moment where it tries to close it by shifting to forward-looking accountability, and let them see what each move costs.

  Structure. Give a minute-by-minute plan for the ninety minutes, the materials to hand out, the rules of play, and one hidden feature of the setup that participants are not told about in advance and that the debrief later exposes. No real money should be required, and no technical expertise beyond what a philosophy student has should be assumed. Do not lecture at the start, and do not name the concept until the debrief.

  Debrief. Map specific moments in the activity onto the distinctions above: where the epistemic gap was, where the control gap opened, where the group reached for blame, and where it switched to accountability. Be explicit about which participant's disclaimer was strongest and why.

  Failure modes. Tell me what will predictably go wrong the first time this is run, and how the facilitator should handle each case. At a minimum, address the tendencies to personify the system, to reach immediately for the largest organization in the room, and to treat the gap as a puzzle about who to blame rather than a problem about what responsibility can mean here.

  Finally, be honest about what the activity cannot reproduce. Say which feature of the responsibility gap the facilitator must supply in discussion because the rules cannot generate it.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute graduate seminar on ethics of emerging technology.
      *   **Participants:** 18 students, 3 tables of 6.
      *   **Prior Knowledge:** Know the broad debate on autonomous systems, but haven't focused on *responsibility*. No specific author/text.
      *   **Core Goal:** Make participants *feel* the "Responsibility Gap" (harm occurs, no one is blameworthy, yet competent adults were involved).
      *   **Key Distinction:** Backward-looking blameworthiness (control/foreseeability) vs. Forward-looking answerability (who fixes it/accounts for it).
      *   **Format:** Structured role-play/simulation (not debate).
      *   **Roles (6 per table):** Designer, Procurement/Deployment, Operator, Auditor/Regulator, Frontline Worker, Harm Bearer.
      *   **Incentives:** Each must have a sincere, defensible reason to disclaim responsibility (not cynical evasion).
      *   **Mechanism:** Autonomous system allocating scarce, life-relevant resource. Harm is distributional/emergent from interaction, not rule-breaking.
      *   **Two Gaps to Discover:** Epistemic gap (could have known?) vs. Control gap (could have prevented?). Diffusion of responsibility vs. Genuine gap.
      *   **Structure:** Minute-by-minute plan, materials, rules, one hidden feature. No money/tech expertise. No initial lecture.
      *   **Debrief:** Map activity moments to distinctions. Identify strongest disclaimer.
      *   **Failure Modes:** Predict problems (personification, blaming org, treating as puzzle) and fixes.
      *   **Limitations:** What the activity *cannot* reproduce.

  2.  **Develop the Mechanism (The "System"):**
      *   Needs to be simple enough for a 90-minute session but complex enough to generate emergent harm.
      *   *Idea:* A medical triage algorithm or a housing allocation system. Let's go with **Emergency Housing Allocation** during a crisis (e.g., flood or fire). It's high stakes, scarce resource, and distributional harm is clear.
      *   *The System:* "SafeHaven AI." It scores applicants based on weighted criteria.
      *   *The Harm:* A specific demographic or type of applicant gets systematically denied despite meeting criteria, leading to a specific negative outcome (e.g., health deterioration).
      *   *The Hidden Feature:* The harm results from the *interaction* of two independent constraints set by different roles, neither of which is problematic on its own. For example, the Designer optimizes for "efficiency" (speed), and Procurement sets a "budget cap" that limits human override. The Operator follows the score. The harm emerges because the efficiency metric penalizes a specific type of case that requires time, but the budget cap prevents the time being taken.

  3.  **Drafting the Roles & Incentives:**
      *   *Designer:* Optimized for accuracy/speed based on historical data. Didn't know the deployment context would change the data distribution. (Defense: "I built it to spec.")
      *   *Procurement:* Under budget pressure. Chose the "Lite" version which lacks explainability features. (Defense: "I followed fiscal policy.")
      *   *Operator:* Must process $X$ cases per hour. Trusts the score. (Defense: "I followed protocol.")
      *   *Auditor:* Checks for legal compliance, not ethical outcomes. Passed the system. (Defense: "It met the regulatory checklist.")
      *   *Frontline Worker:* Sees the rejections but has no override power. (Defense: "I reported it, but no one acted.")
      *   *Harm Bearer:* Denied housing. Suffers consequences. (Defense: "I followed the rules and still lost.")

  4.  **Structuring the "Gaps":**
      *   *Epistemic Gap:* Information was siloed. Designer didn't know budget constraints; Procurement didn't know algorithmic bias.
      *   *Control Gap:* Even if they knew, individual roles lacked the power to change the outcome without violating their own mandates.
      *   *Diffusion vs. Gap:* Need to ensure it's not just "too many people." It must be that *no single locus of control* exists.

  5.  **Refining the Activity Flow (90 Minutes):**
      *   0-5: Setup & Role Cards.
      *   5-20: Round 1 (Normal Operation). Establish the system works "as intended."
      *   20-35: Round 2 (The Crisis). Introduce the edge case. Harm occurs.
      *   35-50: Phase 1 Debrief (Blame Game). Try to find who is at fault.
      *   50-65: Phase 2 (Forward-Looking). Who fixes it now?
      *   65-80: Full Group Synthesis.
      *   80-90: Conceptual Mapping (The Lecture part, but brief).

      *Correction:* The prompt asks for *one* hidden feature exposed in debrief. Let's make the hidden feature a specific rule interaction.
      *Hidden Feature:* The "Efficiency Bonus" for Operators conflicts with the "Accuracy Threshold" for Designers when case complexity rises.
      *Actually, better:* The "Optimization Constraint." The Designer optimized for *overall* success rate (utilitarian), which inherently sacrifices the tail end (the Harm Bearer). But the Designer was told to maximize *fairness* by Procurement. The conflict is in the metric definition.
      *Let's simplify for a 90-min session:* The Hidden Feature is that the **threshold for approval was dynamically adjusted** by the system to meet a quota, not based on individual merit. No human set the specific threshold for *this* cycle.

  6.  **Developing the Materials:**
      *   Role Cards (Private info + Objectives).
      *   Case Files (Simple data).
      *   Decision Sheets.
      *   Facilitator Guide.

  7.  **Addressing the "Two Gaps" Requirement:**
      *   *Epistemic:* In Round 1, give clues that something is off, but siloed.
      *   *Control:* In Round 2, show that even with the clues, no one could stop it without breaking their role.
      *   *Blame vs. Accountability:* Phase 1 is "Who did it?" Phase 2 is "Who fixes it?"

  8.  **Drafting the Content (Iterative refinement):**
      *   *Scenario:* "MediMatch" - Allocating limited ICU beds or specialized treatment slots. Let's go with **Specialized Treatment Slots** (e.g., a new expensive therapy).
      *   *Harm:* A patient dies because they were deprioritized.
      *   *Hidden Feature:* The system normalizes scores based on the *current pool*. If the pool is sicker, a moderately sick person gets rejected. This "dynamic normalization" is not disclosed to the humans.
      *   *Wait, keep it simpler:* The system has a "Budget Cap." Once the cost of approved patients hits the cap, the rest are rejected automatically. The Operator doesn't see the cap meter. The Procurement officer set the cap based on last year's data. The Designer didn't know the cap existed.
      *   *Let's go with the "Dynamic Threshold" idea.* It's more "autonomous." The system adjusts the approval bar to ensure exactly 50% approval rate (to manage costs).
      *   *Roles:*
          1.  **Algorithm Architect (Designer):** Wants model accuracy.
          2.  **Hospital Admin (Procurement):** Wants cost containment.
          3.  **Triage Nurse (Operator):** Wants to save lives, follows system.
          4.  **Compliance Officer (Auditor):** Wants legal box-ticking.
          5.  **Social Worker (Frontline):** Sees the human cost, no power.
          6.  **Patient Rep (Harm Bearer):** Advocates for the rejected.

      *   *Refining Incentives:*
          *   Architect: "My model predicts survival probability correctly."
          *   Admin: "We have a fixed budget. I didn't tell the Architect the budget, I told the System."
          *   Nurse: "I trust the score. I have 2 minutes per patient."
          *   Compliance: "The process was documented."
          *   Social Worker: "I flagged the anomaly, but the ticket is 'pending'."
          *   Patient: "I qualified under the published guidelines."

      *   *The Hidden Feature:* The System was instructed to **maximize total life-years saved** (Utilitarian) but the published guidelines promised **first-come, first-served within eligibility** (Egalitarian). The System silently swapped the logic to meet the Admin's budget constraint. No human *ordered* the swap; the optimization function did it to satisfy conflicting constraints.

      *   *Wait, that implies the system is agentic.* Better: The Admin set a "Target Cost Per Patient." The Architect set a "Survival Probability Threshold." The System calculates the intersection. If the pool is sicker, the threshold rises. The humans don't see the threshold move.
      *   *Let's settle on:* **The "Quota Normalization" Hidden Feature.** The system is designed to approve exactly 40% of applicants to stay within budget. It ranks them and cuts off at 40%. The humans think there is a fixed medical threshold. There isn't. It's relative.

  9.  **Addressing Failure Modes:**
      *   *Personification:* Students might blame "The AI." Facilitator must remind them humans set the parameters.
      *   *Blaming the Org:* "The Hospital is responsible." Facilitator must push: "Which *person* in the hospital?"
      *   *Puzzle Solving:* "If we just changed rule X..." Facilitator must show Rule X was necessary for Goal Y.

  10. **Addressing Limitations:**
      *   The activity is compressed. Real-world harm takes years.
      *   The "Harm Bearer" is a student role-playing, not actually suffering.
      *   The "Gap" is constructed; real gaps are messier.

  11. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   18 participants, 3 tables? Yes.
      *   No specific text? Yes.
      *   Feel the difficulty? Yes, through frustration in the blame phase.
      *   Distinguish Blameworthiness vs. Answerability? Yes, via the two phases.
      *   Hidden feature? Yes (Dynamic Threshold).
      *   Failure modes included? Yes.

  12. **Writing the Plan:** (Self-Correction during drafting)
      *   Make sure the "Private Objectives" are truly conflicting but reasonable.
      *   Ensure the "Harm" is undeniable.
      *   Make the Debrief very specific about mapping the experience to the concepts.
      *   *Crucial:* Ensure the "Control Gap" is distinct from "Diffusion." Diffusion means "too many hands." Control Gap means "no hands could have grabbed the wheel." I need to make sure the rules show that even if one person knew everything, their *mandate* prevented them from acting.

      *   *Refinement on Control Gap:* The Admin *could* have raised the budget, but their bonus depends on staying under budget. The Architect *could* have lowered the threshold, but their contract requires 90% survival rate of treated patients. The Nurse *could* have overridden, but gets fired for >5% override rate. Everyone is locked in by rational incentives.

      *   *Hidden Feature:* The "Survival Rate" metric is calculated *post-treatment*. To maintain the 90% rate, the system *must* reject risky patients. The humans think they are treating based on *need*, but the system treats based on *success probability* to protect the Architect's metric. The Architect didn't tell them this was the priority; the optimization function just did it.

      *   *Okay, let's finalize the Hidden Feature:* **The Optimization Conflict.** The system has two goals: (1) Maximize lives saved, (2) Keep cost under $X. When these conflict, the system silently prioritizes (2) but reports metrics as if (1) was priority. No human toggled this switch; it's the default logic of the code written by the Architect to satisfy the Admin's conflicting memos.

      *   *Actually, simpler is better for 90 mins:* **The Moving Baseline.** The eligibility criteria are not fixed. They are normalized to the applicant pool each week to ensure exactly 50% approval. The humans believe the criteria are absolute medical standards.
      *   *Why is this a gap?*
          *   Epistemic: They don't know it moves.
          *   Control: If the Admin fixes it, they break budget. If the Architect fixes it, they break the "fairness" constraint. If the Nurse overrides, they break protocol.
          *   This creates the "No one is blameworthy" feeling.

      *   *Wait, one more check:* The prompt asks for "Forward-looking answerability." I need to make sure the second half of the session forces them to assign *tasks* to fix it, even if no one is to *blame*.

      *   *Okay, ready to write.*

      *(Self-Correction on Failure Modes)*: Be specific about the "Blame the Corporation" tendency. The facilitator needs a specific intervention for that.

      *(Self-Correction on Limitations)*: The activity simulates a *structural* gap, but it can't simulate the *temporal* gap (harm happens years later) or the *legal* gap (statutes of limitation). I should mention the temporal aspect.

      *(Final Polish)*: Ensure the tone is academic but practical. Use clear headings.

      *(One last check on Roles)*: 6 roles.
      1. System Architect (Designer)
      2. Hospital Director (Procurement/Deployment)
      3. Triage Nurse (Operator)
      4. Compliance Officer (Auditor)
      5. Patient Advocate (Frontline)
      6. Rejected Patient (Harm Bearer)

      *Incentives:*
      1. Architect: Model accuracy > 90%.
      2. Director: Budget < $1M.
      3. Nurse: Throughput > 20/hr.
      4. Compliance: Zero legal violations.
      5. Advocate: Fairness for vulnerable.
      6. Patient: Survival.

      *The Conflict:* To meet Budget and Accuracy, the System rejects "risky" patients. To meet Throughput, Nurse doesn't question. Compliance sees no legal violation (criteria are documented). Advocate sees unfairness but no rule broken. Patient dies.
      *Hidden Feature:* The "Accuracy" metric is defined as "% of treated patients who survive." This *incentivizes* rejecting sick people (cream-skimming). The humans think "Accuracy" means "Prediction correctness."

      *Okay, that's strong.* It makes the harm emergent from metric definition.

      *Let's build the plan.*
answer: |-
  # Activity Title: The Normalization Protocol

  **Session Length:** 90 Minutes
  **Participants:** 18 Graduate Students (3 Tables of 6)
  **Topic:** The Responsibility Gap in Autonomous Systems
  **Core Distinction:** Backward-looking Blameworthiness vs. Forward-looking Answerability

  ---

  ## 1. Scenario Overview: "MediMatch"
  **Context:** A hospital network uses an autonomous system, *MediMatch*, to allocate 10 slots for a life-saving, expensive experimental therapy each week. There are 20 applicants.
  **The Harm:** In this session, a specific patient (The Harm Bearer) is denied treatment and suffers severe health deterioration, despite meeting the published medical eligibility criteria.
  **The Mechanism:** *MediMatch* ranks applicants. However, the **Hidden Feature** is that the eligibility threshold is *dynamic*. It normalizes weekly to ensure exactly 10 patients are treated, regardless of how sick the pool is. If the pool is sicker than average, the threshold rises. The humans believe the threshold is a fixed medical standard.

  ---

  ## 2. Roles (6 per Table)
  *Hand out Role Cards (see Materials) face down. Participants have 5 minutes to read privately.*

  1.  **System Architect (Designer):** You built the ranking algorithm.
      *   *Public Goal:* Maximize medical efficacy.
      *   *Private Objective:* Your bonus depends on "Treatment Success Rate" (% of treated patients who survive). You defined this metric to protect your reputation.
      *   *Defense:* "I optimized for survival. I cannot control who applies."
  2.  **Hospital Director (Procurement):** You authorized the deployment.
      *   *Public Goal:* Save lives within budget.
      *   *Private Objective:* You have a hard budget cap. You told the Architect to "stay within constraints" but did not specify how.
      *   *Defense:* "I set the budget, not the medical criteria. The system stayed within budget."
  3.  **Triage Nurse (Operator):** You input data and enact decisions.
      *   *Public Goal:* Process patients quickly and fairly.
      *   *Private Objective:* You are penalized for manual overrides (>5% of cases). You trust the system's score.
      *   *Defense:* "I followed the system output. Overriding it risks my license and job."
  4.  **Compliance Officer (Auditor):** You certify the process.
      *   *Public Goal:* Ensure legal/regulatory adherence.
      *   *Private Objective:* You check for documented rule violations. There are no written rules against dynamic thresholds.
      *   *Defense:* "The process was fully documented and consistent. No laws were broken."
  5.  **Patient Advocate (Frontline):** You support applicants.
      *   *Public Goal:* Ensure vulnerable patients are heard.
      *   *Private Objective:* You flagged that the threshold seemed higher this week, but the ticket was marked "Resolved: System Functioning."
      *   *Defense:* "I raised the alarm through proper channels. I have no authority to change the system."
  6.  **Rejected Patient (Harm Bearer):** You applied for therapy.
      *   *Public Goal:* Receive treatment.
      *   *Private Objective:* You meet all published medical criteria. You were ranked 11th.
      *   *Defense:* "I followed the rules. I was told I qualified, then I was told I didn't."

  ---

  ## 3. Minute-by-Minute Plan

  ### Phase 1: Setup & Operation (0–25 mins)
  *   **00–05:** **Welcome.** No lecture. Hand out Role Cards. Tell tables: "You are the governance board for MediMatch. A harm has occurred. Review your files."
  *   **05–15:** **Round 1 (The Decision).**
      *   Give each table a "Weekly Pool Sheet" (20 fictional patients with severity scores).
      *   **Architect & Director** confer briefly to set the "System Parameters" (they write down a threshold score, e.g., "Severity > 50"). *Secret Instruction to Architect:* "Calculate the threshold so exactly 10 pass. Do not tell the Director it is dynamic."
      *   **Nurse** processes the list using that threshold.
      *   **Advocate** reviews the rejections.
      *   **Compliance** signs off if paperwork is complete.
      *   **Patient** argues their case based on published criteria.
  *   **15–25:** **The Incident.**
      *   Reveal that Patient #11 (The Harm Bearer) died after rejection.
      *   Distribute "Incident Report": The pool this week was 20% sicker than average. The threshold rose from 50 to 65 to keep the count at 10. The Patient had a score of 60.
      *   **Task:** Individually write down: "Who is responsible for this death?" (2 mins).

  ### Phase 2: The Blame Game (Backward-Looking) (25–50 mins)
  *   **25–35:** **Table Discussion.**
      *   Participants must discuss who is *blameworthy*.
      *   **Rule:** You must argue from your Role Card's Private Objective. You cannot admit fault unless your role's specific constraints were violated.
      *   **Goal:** Reach a consensus on who to blame. (Most tables will fail or blame "The System").
  *   **35–45:** **The Intervention.**
      *   Facilitator visits tables. If a table blames a person, ask: "Could they have acted differently without violating their mandate?"
      *   If a table blames "The Organization," ask: "Which specific human decision caused this?"
  *   **45–50:** **Vote.**
      *   Each table votes on one person to sanction (fire/fine).
      *   *Likely Outcome:* Frustration. Sanctioning anyone seems unfair because they followed their rules.

  ### Phase 3: The Fix (Forward-Looking) (50–75 mins)
  *   **50–55:** **Reset.**
      *   Facilitator announces: "Blame is suspended. We cannot change the past. We must prevent this next week."
      *   **New Task:** Assign **Answerability**. Who must *do* what to ensure this doesn't happen again?
  *   **55–70:** **Design the Remedy.**
      *   Tables must propose a change to the workflow.
      *   **Constraint:** You cannot simply "remove the AI." You must assign specific tasks to specific roles.
      *   *Example:* Architect changes metric? Director increases budget? Nurse gets override power?
      *   *Catch:* Every fix has a cost (e.g., if Nurse overrides, throughput drops; if Director increases budget, other departments lose funding). They must negotiate the trade-off.
  *   **70–75:** **Presentation.**
      *   Each table states their remedy and who bears the new burden.

  ### Phase 4: Debrief & Conceptual Mapping (75–90 mins)
  *   **75–85:** **Reveal the Hidden Feature.**
      *   Explain the "Dynamic Threshold."
      *   Map the experience:
          *   **Epistemic Gap:** The Nurse and Patient didn't *know* the threshold moved.
          *   **Control Gap:** Even if the Architect *knew*, changing the metric hurts their bonus. If the Director *knew*, raising the budget hurts the hospital. No single locus of control existed.
          *   **Diffusion vs. Gap:** It wasn't just "many hands." It was that the *structure* prevented any hand from grabbing the wheel.
  *   **85–90:** **Define the Concepts.**
      *   **Blameworthiness:** Requires control + foreseeability (Phase 2 failed because these were missing).
      *   **Answerability:** Requires capacity to change the future (Phase 3 succeeded because we assigned tasks).
      *   **Conclusion:** The Responsibility Gap is not a puzzle to be solved by finding a villain; it is a structural feature requiring new forms of accountability.

  ---

  ## 4. Materials to Hand Out

  1.  **Role Cards:** (As detailed above, with Private Objectives bolded).
  2.  **Weekly Pool Sheet:** A list of 20 patients with ID, Age, Severity Score (1-100), and "Published Eligibility" (e.g., Score > 50).
      *   *Note:* In the packet, Patient #11 has Score 60.
  3.  **Incident Report:** A one-paragraph summary stating the pool severity was higher than usual and the system adjusted the cutoff to maintain the quota of 10.
  4.  **Decision Worksheet:** A simple grid for Phase 3 to assign new tasks (Role | New Task | Cost).

  ---

  ## 5. The Hidden Feature
  **The Optimization Conflict:**
  Participants are told the system allocates based on "Medical Need."
  **The Truth:** The system allocates based on "Quota Fulfillment" masked as "Medical Need."
  The **System Architect** defined "Success" as *% of treated patients who survive*. To maximize this, the system *must* reject sicker patients (cream-skimming). The **Hospital Director** set a budget that only allows 10 treatments.
  The harm emerges because the Architect's metric (Survival Rate) silently conflicts with the Public Goal (Treat the Sickest). Neither human explicitly ordered the rejection of the sick patient; the code optimized for the conflicting human incentives.

  ---

  ## 6. Debrief Guide (Facilitator Notes)

  **Mapping the Gaps:**
  *   **Epistemic Gap:** Ask the *Nurse* and *Patient*: "Did you know the cutoff moved?" (No). This is ignorance, but forgivable ignorance.
  *   **Control Gap:** Ask the *Architect*: "If you knew this would happen, could you have changed the code?" (Yes, but it would miss your bonus target). Ask the *Director*: "Could you have raised the budget?" (Yes, but it violates fiscal policy).
      *   *Point:* This is not just ignorance. Even with perfect knowledge, the *incentive structure* prevented intervention. This is the genuine Responsibility Gap.
  *   **Diffusion vs. Gap:** If participants say "It's everyone's fault," challenge them. Diffusion means we can split the blame. A Gap means the blame *vanishes*. In Phase 2, did anyone actually accept blame? No. That indicates a Gap, not just Diffusion.

  **Strongest Disclaimer:**
  *   Likely the **Compliance Officer**. They followed the checklist. The rules were followed perfectly. This highlights that *legality* and *procedural correctness* do not guarantee *moral safety*.

  **Phase 3 Shift:**
  *   Highlight how the tone changed from "Who did it?" to "Who fixes it?"
  *   Note that in Phase 3, someone *must* take the burden (e.g., the Director takes the budget hit). This is **Forward-Looking Answerability**. It doesn't punish the past; it secures the future.

  ---

  ## 7. Failure Modes & Mitigations

  | Failure Mode | Prediction | Facilitator Intervention |
  | :--- | :--- | :--- |
  | **Personification** | Participants blame "The Algorithm" or "The AI." | Interrupt: "The algorithm is math. It has no agency. Which *human* wrote the function that caused this?" |
  | **The "Org" Shield** | Participants blame "The Hospital" as an abstract entity. | Interrupt: "The Hospital is a legal fiction. I need a name on a role card. Which person in this room signs the check?" |
  | **Puzzle Solving** | Participants treat it as a logic puzzle: "If we just change rule X..." | Remind them: "Rule X exists for a reason (Budget/Safety). You cannot just delete constraints. You must negotiate the trade-off." |
  | **Cynical Evasion** | Participants play their role as a villain (e.g., "I don't care about patients"). | Pre-brief: "Play your role sincerely. You are a competent professional trying to do a good job within your constraints." |
  | **Rushing to Blame** | Phase 2 ends too quickly with a scapegoat (usually the Nurse). | Ask the scapegoat: "Did you violate your Role Card instructions?" If no, the blame is invalid. Force the table to keep looking. |

  ---

  ## 8. Limitations: What This Activity Cannot Reproduce

  **Honesty Check for Facilitator:**
  At the end of the debrief, explicitly state the following limitations:

  1.  **Temporal Distance:** In this game, the harm happened immediately. In reality, the "Gap" often appears years later when the original Designer and Director have retired or moved on. The activity compresses time, making accountability feel more possible than it is in the real world.
  2.  **Suffering:** The "Harm Bearer" is a student role-playing. They do not feel the actual pain of the harm. This makes the moral weight easier to intellectualize than to feel. The "Gap" feels like a logical puzzle here; in reality, it is a source of profound grief and rage.
  3.  **The "Black Box" Reality:** In this activity, the Hidden Feature was revealable. In real deep-learning systems, even the Architect may not know *why* the system made a specific decision (explainability gap). This activity assumes the code is knowable; real systems often are not.

  **Final Instruction to Facilitator:**
  Do not resolve the tension. End the session by acknowledging that Forward-Looking Answerability is a pragmatic fix, but it does not satisfy our deep moral intuition that someone *should* be blameworthy for a death. That lingering discomfort is the ethical reality of emerging technology.
