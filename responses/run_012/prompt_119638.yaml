prompt: |-
  I run the exposure-investigation unit at a state health department — four of us, and we get two or three "cancer cluster near the plant" petitions a year, plus alot of smaller complaints, each one with a family attached and usually a lawyer on the other side. Right now we decide whether the exposure caused it by instinct, and we get accused of both rubber-stamping and crying wolf. I want a written proceedure we can actually run on a petition: the questions to ask in order, what counts as a good enough answer to each, where the process stops with a no, and where it goes to the director because it's a values call about how much evidence is enough rather than a fact we can settle.

  Build it out of the philosophy of causation, specifically the disagreement between the but-for / counterfactual line (X caused Y if Y wouldn't have happened without X) and the interventionist line (ask what would happen if you could intervene on X surgically, setting aside everything that normally travels with X). I want to know which of those two questions to reach for when, because they come apart on exactly the cases that land on my desk: two sources each of which was sufficient on its own; a factor that only mattered because it made things happen sooner; an exposure that made things worse only because somebody else had already switched off the thing that would have stopped it; and the ordinary case where the exposure is one factor among many and the real question is which factor to blame.

  Run it on three: (1) a cluster of a rare birth defect downstream of a plant with a documented release the year before and no other local source anyone can find; (2) a neighborhood where the water utility and an old industrial site both plausibly put the same solvent into wells, and the wells are contaminated; (3) a complaint where the exposure made an existing condition worse but the condition would have progressed anyway.

  And be blunt if this is a bad idea — if a checklist honestly can't do this, or if I'm quietly mashing together two different questions (did this exposure cause this person's illness, vs. does this exposure cause this illness in general), say so instead of handing me a tidy flowchart. Flag the steps that are judgment calls in a lab coat.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Runs an exposure-investigation unit at a state health department (4 people).
      *   **Context:** High stakes, high emotion. 2-3 "cancer cluster near plant" petitions/year + smaller complaints. Families + Lawyers involved. Accusations of bias (rubber-stamping vs. crying wolf).
      *   **Current State:** Deciding by "instinct."
      *   **Goal:** A written procedure (checklist/flowchart) based on the *philosophy of causation*.
      *   **Specific Philosophical Framework:** Contrast "But-For/Counterfactual" (Y wouldn't happen without X) vs. "Interventionist" (What happens if we surgically change X?).
      *   **Specific Scenarios to Test:**
          1.  Rare birth defect + plant release + no other source.
          2.  Dual source contamination (water utility + industrial site).
          3.  Acceleration/aggravation of existing condition.
      *   **Constraint:** Be blunt. If a checklist can't do this, or if the user is conflating specific vs. general causation, say so. Flag judgment calls.

  2.  **Deconstruct the Philosophical Tension:**
      *   *But-For (Sine Qua Non):* "But for the exposure, would the disease have occurred *at this time, in this person*?" Good for necessary causes. Fails with overdetermination (two sufficient causes).
      *   *Interventionist (Manipulability):* "If we intervene to remove X, does the risk/outcome change?" Good for policy and general causation. Can be tricky with specific individual attribution if the intervention isn't clean.
      *   *The Conflict:* The user correctly identifies that these come apart in overdetermination (two sufficient causes), preemption (one cuts off the other), and acceleration (timing vs. occurrence).
      *   *The Elephant in the Room:* **Specific vs. General Causation.**
          *   *General:* Does X cause Y in the population? (Epidemiology, Toxicology).
          *   *Specific:* Did X cause Y in *this* person? (Clinical, Individual attribution).
          *   *Legal/Regulatory Reality:* Compensation and liability usually demand *specific* causation, but science usually only provides *general* causation (probabilities). This is the "judgment call in a lab coat."

  3.  **Evaluate the Feasibility (The "Blunt" Requirement):**
      *   Can a checklist solve this? No. Science deals in probabilities; law/politics deals in binaries (liable/not liable).
      *   Is the user conflating questions? Yes. "Did this exposure cause this person's illness" (Specific) is often scientifically unanswerable with certainty. "Does this exposure cause this illness" (General) is answerable but doesn't satisfy the family/lawyer.
      *   *Decision:* I must build the procedure but heavily caveat it. I need to explicitly separate General vs. Specific causation steps. I need to show where the philosophy switches from But-For to Interventionist.

  4.  **Drafting the Procedure (Iterative Process):**

      *   *Phase 1: Triage (General Causation).* Before asking "Did it cause *this*?", ask "Can it cause *any*?" If the science says no, stop. This is the easiest filter.
      *   *Phase 2: Exposure Assessment.* Did the person actually get the dose? (Crucial step often skipped).
      *   *Phase 3: Specific Causation (The Philosophical Meat).* This is where But-For vs. Interventionist matters.
          *   *Standard Case:* But-For works.
          *   *Overdetermination (Two sources):* But-For fails (disease happens anyway). Interventionist works (remove one, risk drops). *Decision:* For regulatory purposes, use Interventionist (contribution to risk). For compensation, this is the legal mess.
          *   *Acceleration:* But-For fails (disease happens eventually). Interventionist works (timing changes). *Decision:* Define "Cause" to include "Material Contribution to Timing."
      *   *Phase 4: The "Values Call".* When do we kick it to the Director? When the science is equivocal but the public trust is at stake.

  5.  **Applying to the Three Test Cases:**

      *   *Case 1 (Birth Defect + Plant):* Strong General Causation link? Yes. Exposure verified? Yes. Other sources? No. *Verdict:* Passes But-For (likely). Passes Interventionist. High confidence.
      *   *Case 2 (Dual Solvent):* Overdetermination. But-For fails for *both* (if you remove Utility, Industry did it; if you remove Industry, Utility did it). Interventionist says both contributed to the *concentration*. *Verdict:* This is the "Values Call." Science says "both contributed to dose," Policy says "who pays?"
      *   *Case 3 (Aggravation):* But-For fails (condition existed). Interventionist says removing exposure changes *severity/timing*. *Verdict:* Requires redefining "Cause" to include "Significant Aggravation."

  6.  **Refining the Tone:**
      *   Professional, direct, slightly weary (matching the user's vibe).
      *   Acknowledge the political pressure.
      *   Highlight the "Lab Coat Judgment Calls."

  7.  **Final Review against Constraints:**
      *   Did I use But-For vs. Interventionist? Yes.
      *   Did I run the three cases? Yes.
      *   Did I be blunt about limitations? Yes.
      *   Did I flag judgment calls? Yes.

  8.  **Self-Correction/Nuance Check:**
      *   *Correction:* I initially thought about suggesting Probability of Causation (PC) calculations. *Correction:* No, that's too mathematical for a 4-person unit dealing with lawyers. Keep it conceptual but rigorous.
      *   *Nuance:* Make sure to distinguish between "Cause of the Cluster" (Population) vs "Cause of the Case" (Individual). The prompt asks about petitions which are usually individual cases within a cluster context. I need to address the "Cluster" aspect specifically.
      *   *Philosophy Check:* Ensure I don't misrepresent Interventionism. Interventionism is about *manipulability*. In Case 2, intervening on *one* source doesn't stop the outcome, but it reduces the *magnitude*. I need to be precise there.

