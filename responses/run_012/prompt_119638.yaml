answer: |-
  Here is the blunt truth before we build the procedure: **You are quietly mashing together two different questions.**

  1.  **General Causation:** Is this exposure *capable* of causing this disease in the population? (Science can answer this.)
  2.  **Specific Causation:** Did this exposure cause *this* disease in *this* person? (Science often cannot answer this with certainty for complex diseases like cancer.)

  Lawyers and families want an answer to #2. Epidemiology and toxicology give you answers to #1. Your "instinct" is currently bridging that gap. A checklist cannot bridge that gap; it can only force you to admit where the bridge is made of wood instead of steel.

  Furthermore, **But-For causation fails in public health.** If two factories dump enough toxin to kill a fishery, the But-For test says *neither* caused the dead fish (because if you remove Factory A, Factory B still kills them). If you use But-For, you will exonerate everyone in multi-source scenarios. You must switch to **Interventionist/Contributory Causation** (Did this exposure materially increase the risk or dose?) for regulatory decisions.

  Below is the Procedure. It is designed to fail safely. It tells you when to stop, when to say "we don't know," and when to kick it upstairs because the question isn't scientific, it's political.

  ***

  # STANDARD OPERATING PROCEDURE: EXPOSURE-CAUSATION PETITION REVIEW
  **Unit:** Exposure-Investigation | **Version:** 1.0 (Causality-Explicit)

  ## PHASE 1: THE CAPABILITY FILTER (General Causation)
  *Goal: Determine if the exposure is biologically plausible. If this fails, the petition dies scientifically.*

  **Step 1.1: The Toxicological Link**
  *   **Question:** Is there peer-reviewed evidence (IARC, NTP, major cohort studies) linking Substance X to Disease Y?
  *   **Pass:** "Known" or "Probable" human carcinogen/toxin for this specific endpoint.
  *   **Fail:** No mechanistic or epidemiological link exists.
  *   **Action:** If Fail, issue "No Association" letter. **STOP.**
  *   **Lab Coat Judgment Call:** If evidence is "Suggestive" but not "Probable," do not stop. Flag for Phase 4.

  **Step 1.2: The Dose-Response Threshold**
  *   **Question:** Did the measured or modeled exposure exceed the biological threshold for effect?
  *   **Pass:** Exposure levels are in the range where effects are observed in literature.
  *   **Fail:** Exposure is trace/background level, orders of magnitude below effect thresholds.
  *   **Action:** If Fail, issue "No Exposure" letter. **STOP.**

  ## PHASE 2: THE ATTRIBUTION FILTER (Specific Causation)
  *Goal: Determine if the exposure reached the petitioner. This is where we switch from Population to Individual.*

  **Step 2.1: Pathway Verification**
  *   **Question:** Is there a completed pathway from Source to Person (Air, Water, Soil) during the latency period?
  *   **Pass:** Environmental monitoring or modeling confirms presence at the receptor point during the relevant window.
  *   **Fail:** No pathway exists (e.g., wrong wind direction, aquifer flow away from well).
  *   **Action:** If Fail, issue "No Pathway" letter. **STOP.**

  **Step 2.2: The Alternative Source Scan (The "But-For" Trap)**
  *   **Question:** Are there other sufficient sources of the same agent?
  *   **Action:** Map all potential sources within the plausible radius.
  *   **Decision Node:**
      *   **Scenario A (Single Source):** Only one plausible source found. -> **Proceed to Phase 3.**
      *   **Scenario B (Multiple Sources):** Two or more sources could independently account for the dose. -> **STOP. Switch to Interventionist Logic (Phase 3, Step B).**

  ## PHASE 3: THE CAUSALITY TEST
  *Goal: Apply the correct philosophical framework based on Phase 2 findings.*

  ### Path A: The Single Source Case (Standard But-For)
  *Use when only one plausible source exists.*
  *   **Question:** "But for this exposure, is it more likely than not that this disease would have occurred?"
  *   **Metric:** Probability of Causation (PC) > 50%. (Use NIOSH/IREP calculators if available).
  *   **Pass:** PC > 50%.
  *   **Fail:** PC < 50%.
  *   **Action:** If Pass, recommend "Consistent with Exposure." If Fail, recommend "Inconclusive/Unlikely."

  ### Path B: The Multi-Source / Overdetermination Case (Interventionist)
  *Use when multiple sources exist (e.g., Utility + Plant).*
  *   **Philosophy:** But-For fails here. We ask: "If we surgically remove *this* source, does the risk profile change?"
  *   **Question:** Did this source contribute a *material portion* of the total dose, regardless of whether the other source was sufficient on its own?
  *   **Metric:** Contribution to Total Load.
  *   **Pass:** Source contributed >10% of total contaminant load (or exceeded regulatory contribution limits).
  *   **Fail:** Source contribution is negligible compared to background or other sources.
  *   **Action:** If Pass, finding is "Contributory Factor." **DO NOT SAY "THE CAUSE."**
  *   **Lab Coat Judgment Call:** Defining "Material." Is 5% material? Is 20%? This is a policy call, not science. **ESCALATE TO DIRECTOR.**

  ### Path C: The Aggravation / Acceleration Case
  *Use when the condition pre-existed (e.g., asthma, progressive disease).*
  *   **Philosophy:** But-For fails (disease would happen anyway). Interventionist asks: "Does removing exposure alter the trajectory?"
  *   **Question:** Did the exposure significantly accelerate the onset or worsen the severity beyond the natural history of the disease?
  *   **Metric:** Clinical deviation from expected progression curve.
  *   **Pass:** Onset occurred significantly earlier than baseline models predict, or severity is statistically anomalous.
  *   **Fail:** Progression matches natural history.
  *   **Action:** If Pass, finding is "Significant Aggravation."
  *   **Lab Coat Judgment Call:** Defining "Significantly." 6 months earlier? 5 years? **ESCALATE TO DIRECTOR.**

  ## PHASE 4: THE DIRECTOR ESCALATION (Values & Risk)
  *Goal: Identify when the decision is political, not scientific.*

  **Escalate to Director if ANY of the following are true:**
  1.  **The "Lab Coat" Boundary:** The science is equivocal (e.g., "Suggestive" link in Phase 1), but public trust requires a binary decision.
  2.  **The "Material" Boundary:** In Multi-Source cases (Path B), the contribution is borderline (e.g., 15%). Deciding if 15% warrants liability is a legal/policy decision.
  3.  **The "Cluster" vs. "Case" Conflict:** Statistical analysis shows no cluster in the population, but individual biological plausibility is high. (Telling a family "You are an outlier" is a values call).
  4.  **The "Latency" Gap:** Exposure occurred outside standard latency windows, but new emerging science suggests a different mechanism.

  ***

  # RUNNING THE TEST CASES

  Here is how your unit applies this SOP to the three scenarios you provided.

  ### Case 1: Rare Birth Defect + Plant Release + No Other Source
  *   **Phase 1 (Capability):** Pass. (Assuming toxin matches defect).
  *   **Phase 2 (Attribution):** Pass. Pathway confirmed.
  *   **Phase 2.2 (Alt Source):** **Single Source.**
  *   **Phase 3 (Path A - But-For):**
      *   We ask: "Without this release, would the defect have happened?"
      *   Given the rarity of the defect and the documented release during the critical window, the baseline probability is near zero. The exposure raises the probability significantly.
      *   **Result:** **Pass.**
      *   **Finding:** "Consistent with Exposure."
      *   **Note:** This is the "easy" win. But-For works because there is no overdetermination.

  ### Case 2: Neighborhood Wells + Utility AND Industrial Site (Same Solvent)
  *   **Phase 1 (Capability):** Pass. Solvent causes the illness.
  *   **Phase 2 (Attribution):** Pass. Wells contaminated.
  *   **Phase 2.2 (Alt Source):** **Multiple Sources.** (Utility + Industry).
  *   **Phase 3 (Path B - Interventionist):**
      *   **But-For Test:** If we remove Industry, Utility still contaminated the well. If we remove Utility, Industry still contaminated the well. **But-For says NEITHER caused it.** (This is why your instinct hates this case).
      *   **Interventionist Test:** If we remove Industry, does the concentration drop? Yes. Did Industry contribute to the *dose* the family received? Yes.
      *   **Result:** **Pass as "Contributory Factor."**
      *   **Finding:** "Exposure contributed to total contaminant load."
      *   **Escalation:** **YES.** You cannot decide if "contribution" equals "liability." The Director must decide if being *a* cause is enough for state action, or if they must be *the* cause.

  ### Case 3: Exposure Worsened Existing Condition (Progression)
  *   **Phase 1 (Capability):** Pass. Exposure aggravates condition.
  *   **Phase 2 (Attribution):** Pass. Exposure confirmed.
  *   **Phase 3 (Path C - Aggravation):**
      *   **But-For Test:** Would the condition exist without exposure? Yes. **But-For says NO CAUSATION.**
      *   **Interventionist Test:** If we remove exposure, does the health outcome change? Yes (slower progression/less severity).
      *   **Result:** **Pass as "Significant Aggravation."**
      *   **Finding:** "Exposure materially accelerated disease progression."
      *   **Escalation:** **YES.** You need the Director to define "Material." If the exposure made them sick 3 months earlier, is that state business? If it was 5 years, is it? That is a budget/policy line, not a scientific one.

  ***

  # THE "LAB COAT JUDGMENT CALLS" (FLAGGED)

  These are the steps where you are not doing science; you are doing risk management. Do not hide these behind data.

  1.  **The "Suggestive" Evidence Flag (Phase 1):** When the literature isn't settled, but the community is panicked. Deciding to investigate anyway is a trust decision, not a science decision.
  2.  **The "Material Contribution" Threshold (Phase 3, Path B):** In the dual-source case, deciding that 15% contribution warrants a "Yes" finding is a policy choice. Science only tells you it's 15%.
  3.  **The "Significant Aggravation" Threshold (Phase 3, Path C):** Defining how much sooner is "too soon."
  4.  **The Cluster Outlier (Phase 4):** When the statistics say "random chance" but the biology says "plausible." Telling a family they are statistically invisible is a values call.

  # FINAL ADVICE

  If you implement this, you must change your output language.
  *   Stop saying: "The plant caused this cancer." (Specific Causation/But-For)
  *   Start saying: "The exposure is consistent with the disease," or "The exposure contributed to the risk." (General Causation/Interventionist)

  If you try to use this checklist to give lawyers a binary "Yes/No" on specific causation for complex diseases, they will break it. Use the checklist to categorize the *type* of uncertainty.

  *   **Category 1:** Science says Yes (Case 1).
  *   **Category 2:** Science says "Shared Responsibility" (Case 2).
  *   **Category 3:** Science says "Accelerant" (Case 3).

  Let the Director and the lawyers fight over what those categories mean for compensation. Your job is to stop pretending you can calculate the incalculable.
