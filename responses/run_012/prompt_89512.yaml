answer: |-
  # The Counterparty Claim Protocol (CCP)

  **Timebox:** 20 Minutes
  **Goal:** Determine if a trade proposal survives the "No-Trade" objection by identifying *why* the counterparty is wrong or forced, without relying on the assumption that we are simply "smarter."
  **Philosophy:** The current price is not a number; it is a standing offer from a specific set of counterparties. To buy is to assert that the seller is mistaken or constrained. To sell is to assert the buyer is mistaken or constrained. If you cannot identify the constraint or the mistake, you are the liquidity of last resort (the sucker).

  ---

  ### Step 1: Name the Counterparty (3 Minutes)
  **Question:** Who is on the other side of this trade, and what is their claim?
  **Procedure:** The proposer must identify the *type* of entity currently holding the asset (if buying) or bidding for it (if selling).
  *   **Acceptable Answers:** "A forced seller due to margin call," "A momentum fund rebalancing," "The aggregate market pricing in a 10% recession," "A strategic holder exiting a non-core asset."
  *   **Unacceptable Answers:** "The market," "Someone who thinks it's overvalued," "I don't know."
  **Stop Condition:** If the proposer cannot characterize the counterparty's position or motivation, **STOP. VOTE NO.**
  **Judgment Call Flag:** Identifying the counterparty is often an estimate. The committee must agree if the estimate is plausible.

  ### Step 2: Classify the Edge (5 Minutes)
  **Question:** Why is the counterparty's claim wrong, or why must they ignore it?
  **Procedure:** Categorize the edge into exactly one of these three buckets.
  1.  **Information Advantage:** We know a fact they do not (e.g., proprietary data, legal private research).
  2.  **Processing Advantage:** We have the same data, but our model/speed/skill interprets it better *and* the market cannot instantly correct.
  3.  **Constraint Advantage:** The counterparty is forced to trade regardless of price/value (e.g., redemptions, regulatory caps, index rebalancing).
  **Stop Condition:** If the proposal relies on **Processing Advantage** (Bucket 2) in a highly liquid, heavily covered asset, **STOP. VOTE NO.** (This is the No-Trade Theorem zone: if info is common and rationality is assumed, processing differences are arbitraged away instantly).
  **Judgment Call Flag:** Determining if the market is "heavily covered" enough to arb away processing differences is subjective.

  ### Step 3: Validate Heterogeneous Priors (5 Minutes)
  **Question:** Are we betting on the world changing, or on us being right about the world?
  **Procedure:** Acknowledge that we do not share a prior with the counterparty. Explicitly state the divergence.
  *   **Requirement:** The proposer must state: "The market prices this asset assuming [Prior X]. We are acting on [Prior Y]."
  *   **Test:** Is [Prior Y] based on new information (Step 2, Bucket 1) or a constraint (Step 2, Bucket 3)?
  *   **If Bucket 2 (Processing):** You must prove why the market hasn't adopted [Prior Y] yet. If the answer is "they are stupid," **STOP. VOTE NO.** (Assuming irrationality without proof violates the "Rational Counterparty" check).
  **Judgment Call Flag:** Assessing whether a prior is "reasonable" or "delusional" is purely subjective. This step requires a vote on plausibility, not proof.

  ### Step 4: The "Sucker" Check & Risk Limit (7 Minutes)
  **Question:** If we are wrong, what happens? If we are right, why hasn't the price moved yet?
  **Procedure:**
  1.  **Catalyst:** What forces the market to agree with us? (Earnings, macro shift, forced covering). If there is no catalyst, the mispricing can persist forever.
  2.  **Adverse Selection:** If the counterparty is *not* forced (Bucket 3) and we have *no* private info (Bucket 1), assume they know something we don't.
  **Decision:**
  *   **Pass:** If Edge is Info or Constraint + Catalyst exists.
  *   **Fail:** If Edge is Processing + No Catalyst + Liquid Market.
  *   **Handoff:** If the trade passes the above but size/concentration exceeds risk limits, this step hands the decision back to the Chair for sizing approval.

  ---

  # Worked Examples

  ### Proposal 1: The Public Filing Misread
  **The Pitch:** An analyst read a 10-K for a large-cap tech company. Everyone has the 10-K. The analyst believes the market is underestimating the margin expansion from a new cost-cutting line item buried in the notes.
  **Running the CCP:**
  *   **Step 1 (Counterparty):** "The aggregate market." (Acceptable).
  *   **Step 2 (Edge):** **Processing Advantage.** We have the same 10-K. We think we read it better.
      *   *Check:* Is the asset liquid/heavily covered? Yes, large-cap tech.
      *   *Result:* **STOP. VOTE NO.**
  *   **Why:** In a liquid market with common information, the No-Trade Theorem holds strongest here. If the margin expansion was obvious, algos would have priced it. If you think you are smarter than the consensus without new data, you are betting on "I am the rational one, they are noise." The protocol treats this as adverse selection risk. The market price claims the margin expansion is unlikely or priced in. You have no evidence to refute the price other than opinion.
  *   **Outcome:** **REJECTED.** (This is the answer you hate. It blocks "pure fundamental stock picking" on public info in efficient markets).

  ### Proposal 2: The Satellite Imagery
  **The Pitch:** We bought imagery of a retailer's supplier parking lots. It shows 40% more trucks than last quarter. Earnings are in 3 weeks. The current price assumes flat growth.
  **Running the CCP:**
  *   **Step 1 (Counterparty):** "Investors pricing in flat growth based on public guidance."
  *   **Step 2 (Edge):** **Information Advantage.** We have a fact (truck count) the market does not have yet. It is legally obtained alternative data, not insider info.
      *   *Check:* Does this break "Common Knowledge"? Yes. The setup of who collects what info is *not* common knowledge.
  *   **Step 3 (Priors):** Market prior = Flat growth. Our prior = Growth based on physical evidence. Divergence is valid because our prior is conditioned on data they lack.
  *   **Step 4 (Sucker Check):** Catalyst = Earnings release in 3 weeks. Adverse Selection = Low. The seller is not selling because they know the truck count; they are selling because they don't.
  *   **Outcome:** **APPROVED.** (The No-Trade Theorem assumptions fail because information is not common).

  ### Proposal 3: The Distressed Fund Wind-Down
  **The Pitch:** A competitor fund has hit redemption walls. They hold a position we like. They must liquidate by Friday. The price has dropped 20% on their selling. We think the fundamentals are unchanged.
  **Running the CCP:**
  *   **Step 1 (Counterparty):** "A forced seller facing liquidity constraints."
  *   **Step 2 (Edge):** **Constraint Advantage.** The seller is not trading based on value or information. They are trading based on a mandate to exit.
      *   *Check:* Does this break "Rationality"? Yes. A rational actor would hold for value; a constrained actor must sell at any price.
  *   **Step 3 (Priors):** Market prior = Asset is toxic (because price is dropping). Our prior = Asset is sound, price is dislocated due to flow.
  *   **Step 4 (Sucker Check):** Catalyst = Selling pressure ends Friday. Adverse Selection = Minimal. The seller isn't selling because they know bad news; they are selling because they have to.
  *   **Outcome:** **APPROVED.** (This is the classic refutation of No-Trade. Trade occurs due to liquidity needs, not information asymmetry).

  ---

  # Limitations & Overrule Guide

  **What This Procedure Cannot Do:**
  1.  **It Cannot Verify Truth:** It assumes the satellite data is accurate or the distressed seller is actually forced. It filters logic, not facts.
  2.  **It Cannot Quantify Conviction:** It tells you if the trade is *valid*, not if it's *big enough* to matter.
  3.  **It Cannot Solve "Processing" Disagreements:** If the committee genuinely believes the market is inefficient enough to profit from reading filings better (Proposal 1), this protocol will block it.

  **When to Overrule the Procedure:**
  1.  **The "Market Structure" Overrule:** If you have evidence that the specific asset class is structurally inefficient (e.g., small-cap illiquid bonds), you can overrule Step 2's rejection of "Processing Advantage." You must document *why* arbitrage cannot function there.
  2.  **The "Relationship" Overrule:** If the "Distressed Seller" (Proposal 3) is a key prime broker or partner, you may take the trade even if Step 4 flags risk, to preserve the relationship. This is a business decision, not a risk decision.
  3.  **The "Chair's Prerogative":** As Chair, if you believe the Risk Member's interpretation of "Common Knowledge" is too strict for your specific strategy (e.g., you are a deep-value fund and *must* trade on public filings), you can overrule a Step 2 "No."
      *   **Cost:** If you overrule a Step 2 "No," you must double the capital reserve against that position. This prices in the higher probability that you are the sucker.

  **Final Note to the Committee:**
  This procedure does not prove the Risk Member wrong. It admits she is right about *efficient markets with common knowledge*. It forces us to prove, for every trade, that we are *not* in that specific setup. If we can't prove that, we don't trade. That is the price of doing business without inside information.
