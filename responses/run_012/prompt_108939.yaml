answer: |-
  ### 1. Essay Question

  **Berkeley describes money as a 'ticket' or 'counter' that functions without intrinsic value, yet he insists true wealth arises from 'the elements and man's labour.' If money is merely a conventional sign, what anchors its value to this real wealth? Discuss whether Berkeley's semiotic theory of language (as developed in *Alciphron* and the *Principles* Introduction) provides the resources to prevent his economic theory from collapsing into a system where 'wealth' is determined solely by prevailing fashion or will.**

  ***

  ### 2. Model Answer (Strong MA Level)

  **Title:** Signs, Tickets, and the Anchor of Industry

  In *The Querist*, Berkeley presents a striking dichotomy: money is a mere "ticket" for reckoning and transferring, yet wealth is objectively rooted in "the elements and man's labour." This generates a philosophical tension. If money is a conventional sign detached from precious metal, what prevents it from floating free of the reality it is supposed to measure? If the "will" of the nation determines the currency, and fashion determines industry, does "wealth" become nothing more than collective whim? I argue that Berkeley's semiotic theory, specifically his non-representational account of language in *Alciphron*, offers the structural resources to anchor money to labor, but only by shifting the criterion of value from *reference* to *teleological function*.

  The core problem is the "claim" problem. If a banknote is a ticket, it is a ticket *for* something. In a specie-based system, the ticket claims a portion of gold. In Berkeley's fiat-friendly system, the gold is removed. If the ticket does not claim gold, it must claim the "true source of wealth": labor and elements. However, labor is not a static object one can store in a vault. Therefore, money cannot function as a name standing for an idea of wealth (a representational sign). If it did, without bullion to ground the idea, the sign would be empty. This is where the standard critique stops, noting a tension between Berkeley's moral realism (industry is good) and his monetary conventionalism (money is arbitrary).

  However, Berkeley's linguistics in *Alciphron* suggests signs do not always function by standing for ideas. Words can raise passions, dictate actions, or dispose the mind without conveying a specific propositional content. Berkeley treats money analogously. Money is not a noun referring to a stockpile; it is an imperative verb. Its "meaning" lies in its capacity to motivate industry. When Berkeley asks if money is a "ticket," he is not asking what it represents, but what work it does. A ticket admits one to a venue; money admits labor into circulation.

  This semiotic shift attempts to solve the "fashion" objection. If money's value depends on its reference, and the reference is removed, value is arbitrary (fashion). But if money's value depends on its *use*—specifically, its ability to stimulate the "elements and labour"—then it is anchored by a physical reality external to the sign. The "will" that establishes the currency is not arbitrary because it is constrained by a natural teleology: the survival and flourishing of the polity. Fashion might dictate *what* is produced (silks vs. wool), but the necessity of *production itself* is a law of nature, not convention. The ticket is valid only insofar as it successfully commands labor. A currency that stimulates only luxury without industry is, for Berkeley, a broken sign; it fails to perform its semantic function.

  Yet, this solution exposes a fragility in Berkeley's system. By grounding value in the *effect* of the sign (industry) rather than a backing asset, Berkeley makes the evaluation of money empirical and retrospective. How do we know if the ticket is "good" before the labor is performed? Here, the "prevailing will" becomes dangerous. If the sovereign decides that building pyramids counts as "industry," the semiotic loop closes: the money moves the labor, and the labor validates the money. Berkeley relies on a moral realist backdrop—ultimately theological—to ensure that "industry" is defined by genuine human need rather than parasitic churn. Without this moral anchor, the semiotic theory allows the sign to create its own reality, collapsing the distinction between real wealth and speculative bubble.

  Therefore, Berkeley's semiotics saves his economics from emptiness, but not from circularity. The "ticket" is anchored to labor not by reference, but by causal efficacy. Money is a tool to unlock the "elements." But for this to distinguish wealth from waste, the "will" issuing the tickets must be aligned with a objective good. Berkeley assumes a providential order where true interest aligns with industry. If one removes the moral theology, the "ticket" theory indeed collapses into the very conventionalism he fears, where fashion dictates value. The system holds, but only because Berkeley refuses to let the sign be purely arbitrary; it is bound by the laws of nature and God, which dictate that men must eat and work to survive.

  ***

  ### 3. Marking Scheme (Out of 20)

  **A. Understanding the Economic Tension (5 marks)**
  *   **5:** Clearly articulates the "claim problem": if money is a ticket without bullion, what is the claim on? Identifies the risk of wealth collapsing into "fashion/will."
  *   **3-4:** Identifies the tension between labor-theory and fiat-money but treats it as a simple contradiction rather than a structural problem of reference.
  *   **0-2:** Summarizes Berkeley's views separately without identifying the conflict.

  **B. Integration of Semiotics (*Alciphron*/*Principles*) (5 marks)**
  *   **5:** Correctly applies the "use theory" of language (words raising passions/actions, not just conveying ideas) to money. Explains money as imperative/functional rather than representational.
  *   **3-4:** Mentions *Alciphron* or signs but treats money as a "symbol" for labor without explaining the non-representational mechanism.
  *   **0-2:** Ignores the semiotic prompt or reverts to *Principles* idealism ("money is an idea in the mind of God") to solve the economic problem. **(Major Penalty)**

  **C. Critical Analysis of the "Anchor" (5 marks)**
  *   **5:** Identifies that the anchor is *teleological/causal* (does it produce industry?) rather than *referential*. Critiques the circularity risk (who defines industry?) and notes Berkeley's reliance on moral/theological realism to stop the regress.
  *   **3-4:** Argues that labor anchors the money but fails to explain *how* a fiat ticket commands labor without force. Accepts Berkeley's solution too uncritically.
  *   **0-2:** Vague assertions that "God guarantees value" or "the government decides."

  **D. Structure and Clarity (5 marks)**
  *   **5:** Argument flows logically from problem to semiotic solution to critique. Precise philosophical terminology.
  *   **3-4:** Readable but disjointed. Some confusion between economic and metaphysical claims.
  *   **0-2:** Disorganized or difficult to follow.

  **Specific Differentiators (The "Line"):**
  *   **The B+ Answer:** Says, "There is a tension between conventional money and real labor. Berkeley uses language theory to say money is a sign. This helps, but it's still risky."
  *   **The A Answer:** Says, "The tension is about *reference* vs. *use*. Berkeley solves the reference problem by making money an imperative sign. The risk isn't emptiness, but *circularity* (bad industry validating good money). Berkeley avoids this only via moral realism."
  *   **The Trap:** Any answer that tries to solve the economic problem by appealing to *esse est percipi* (e.g., "Gold only exists when perceived, so paper is fine") should be capped at 12/20. This is a category error the question is designed to expose.
