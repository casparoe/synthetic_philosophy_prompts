answer: |-
  You have correctly identified that conservation practice is not just a set of technical rules; it is applied metaphysics. The profession is operating with a specific, albeit often implicit, ontology of the artwork. The tension you are sensing—between treating the object as sacred matter and treating it as a replaceable vehicle—is not a mistake on their part, but a reflection of a hybrid metaphysical stance that shifts depending on which part of the object is under discussion.

  Here is the argument for what metaphysics is actually doing the work, where the inconsistencies lie, and what would happen if you forced a single metaphysical view upon the whole practice.

  ### 1. The Core Ontology: The Work as a "Historical Individual"
  Conservation does not treat the artwork as identical to its matter (the "Work = Material" view), nor does it treat it as a purely abstract type (the "Work = Idea" view). Instead, it treats the artwork as a **historical individual** that supervenes on a specific material substrate.

  This commits conservators to **Origin Essentialism**. The identity of the work is tied to the causal history of its production. This explains the auction house scenario: a chemically identical cast or facsimile is not the work because it lacks the correct causal genealogy (it was not caused by the artist's hand in the right way). If the work were just its visual properties (a "qualitative" view), the copy would be identical. Since the copy is worthless, the profession commits to the view that *history is a constitutive property of the object.*

  ### 2. Resolving the "Minimal Intervention" vs. "Replacement" Tension
  You asked whether minimal intervention implies the material is constitutive, while replacement implies it is not. This looks like a contradiction, but conservation resolves it by distinguishing between **constitutive matter** and **scaffolding matter**.

  *   **Constitutive Matter:** The paint layer, the carved surface, the original patina. This bears the "trace of the act."
  *   **Scaffolding Matter:** The stretcher, the armature, the frame, the backing board. This bears the "burden of existence."

  **The Metaphysical Commitment:**
  When a conservator argues for weeks over stripping varnish, they are debating whether the varnish has migrated from *scaffolding* (protective layer) to *constitutive* (historical layer). If the varnish was applied by the artist, it is constitutive; removing it is destroying the work (Work = Material). If it was applied 100 years later, it is scaffolding; removing it is maintenance (Work > Material).

  When they replace a rotten stretcher, they are asserting that the stretcher is *not* part of the work's identity conditions. The work can survive mereological change (replacement of parts) provided the *constitutive* parts remain intact.

  **Is this consistent?**
  Yes, but only if you accept a **Functional Essentialist** view. The work is defined by its function: to present the aesthetic result of the artist's specific historical action.
  *   **Minimal Intervention** protects the *evidence* of that action (the brushstroke, the aging).
  *   **Replacement** protects the *capacity* of that evidence to persist (the canvas needs a stretcher to hang).

  If you took the view that **Work = Material (Strict Identity)**, conservation would be impossible. You could not replace the stretcher, because the object would literally cease to be the original. You could not clean the painting, because removing atoms (dust/varnish) would be destroying part of the object. The practice *requires* the view that the work is a structure that can survive minor material loss, provided the "informational content" (the image/trace) remains.

  ### 3. The Conceptual Art Exception (Type vs. Token)
  You noted the instruction-based pieces where the wall is repainted every time. Here, the metaphysics shifts explicitly from **Token** to **Type**.

  *   **Traditional Painting:** The work is a singular token. The specific atoms matter because they hold the causal trace.
  *   **Conceptual/Installation:** The work is a universal (a type). The physical instantiation is a temporary manifestation.

  **Is the profession running two metaphysics?**
  Yes, but this is not an error; it is a category distinction. Conservation practice acknowledges that "artwork" is not a single ontological category.
  *   For the oil painting, the work is a **particular**.
  *   For the instruction piece, the work is a **kind**.

  **What the practice commits to:**
  In the instruction piece, the "certificate" or "score" is the constitutive element, not the paint on the wall. The conservator's job shifts from preserving matter to preserving *fidelity to the instructions*. If you applied the "Work = Material" view here, you would have to preserve the original painted wall and forbid re-painting. This would destroy the work's intended nature (which is to be ephemeral or re-creatable). Therefore, the practice commits to the view that **the artist's intention determines the ontological category of the work.** The metaphysics follows the intent, not the other way around.

  ### 4. What Would Change if You Forced a Single Metaphysics?

  To see what is really doing the work, imagine forcing the rival views you mentioned onto the current practice.

  **Scenario A: Strict Materialism (The Work IS the Clay)**
  *   **Premise:** The artwork is identical to the specific atoms currently arranged statue-wise.
  *   **Consequence for Conservation:** All restoration is forbidden. Replacing a stretcher creates a new object. Cleaning removes atoms, thus destroying the work. The "yellowed varnish" must stay, even if it obscures the image, because those atoms are now part of the object's history.
  *   **Consequence for Market:** A perfect copy is still worthless (correct), but a damaged original is also worthless if the damage is significant, because the specific atoms are compromised.
  *   **Verdict:** This would end the profession of conservation. It would turn museums into mausoleums where objects are left to decay, as any intervention is ontological murder.

  **Scenario B: Strict Platonism (The Work IS the Type)**
  *   **Premise:** The artwork is an abstract structure or idea; the physical object is just an instance.
  *   **Consequence for Conservation:** Conservation is irrelevant. If the painting rots, paint a new one. If the atoms don't matter, only the pattern does.
  *   **Consequence for Market:** The original and the perfect copy should have equal value, as they instantiate the same type equally well. Provenance becomes irrelevant.
  *   **Verdict:** This destroys the art market and the concept of the "masterpiece." It works for Sol LeWitt, but it fails for Rembrandt.

  ### 5. The Verdict on the "Varnish Argument"
  The reason conservators argue over the varnish is that they are fighting over the **boundary of the object**.
  *   If the varnish is deemed "historical evidence," it becomes constitutive (Work = Material + History).
  *   If the varnish is deemed "optical obstruction," it becomes scaffolding (Work = Image).

  This debate proves they are **not** committed to a single rigid metaphysics. They are committed to a **pragmatic realism**. They treat the work as a **four-dimensional object** that extends through time.
  *   The "Work" includes its history of reception (hence keeping some old varnish).
  *   The "Work" also includes its intended appearance (hence removing some old varnish).

  The tension you see is the friction between the work as a **physical relic** (a thing that was there then) and the work as an **aesthetic experience** (a thing that must be seen now).

  ### Summary of Commitments
  1.  **Market Value:** Commits to **Origin Essentialism**. (It matters *who* made it and *when*, not just what it looks like).
  2.  **Replacement of Parts:** Commits to **Functionalism**. (The work survives change if its aesthetic function is maintained).
  3.  **Minimal Intervention:** Commits to **Historical Materialism**. (The physical trace of time is part of the work's identity).
  4.  **Conceptual Art:** Commits to **Anti-Materialism**. (The work is a set of conditions, not a thing).

  **Conclusion:**
  Conservation practice is not inconsistent; it is **context-sensitive**. It rejects the idea that "artwork" has a single metaphysical definition. Instead, it posits that the artwork is a **cluster concept**.
  *   Sometimes the cluster prioritizes **Matter** (the original canvas).
  *   Sometimes it prioritizes **History** (the provenance/aging).
  *   Sometimes it prioritizes **Structure** (the instructions).

  If you argued that the work *just is* its material, you would have to ban all restoration. If you argued the work is *just* a repeatable type, you would have to devalue the original. The fact that they do neither proves they are operating with a sophisticated, hybrid ontology where the **causal history of the object** is the primary glue holding the identity together, allowing for material change only so long as that causal chain remains visibly unbroken.
