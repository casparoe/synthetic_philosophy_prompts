      *   *No Alternatives Argument (NAA):** Scientists have looked hard and found nothing else.
      *   *Bayesianism:* Priors aren't arbitrary; they are constrained by theoretical virtues.
      *   *Risk:* Decoupling confirmation from observation risks dogmatism or sociology masquerading as epistemology.

  3.  **Drafting the Questions (Iterative Process):**

