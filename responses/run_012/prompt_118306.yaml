answer: |-
  Here are ten interview questions designed to probe the epistemic limits of non-empirical confirmation, along with follow-ups keyed to standard philosophical defenses.

  **1. The No-Alternatives Argument**
  You argue that a theory gains confirmation when scientists fail to find viable rivals. But how do we distinguish between "no alternatives exist" and "no alternatives have been funded or imagined yet"? Does it matter that the people judging the exhaustion of options are invested in the current program?
  *   **Follow-up:** If she replies that we must trust the sociological consensus of experts: "Historically, experts have often declared problems 'solved' or 'unique' right before a paradigm shift—think of Kelvin on classical physics. What meta-inductive evidence do we have that *this* community is better at spotting exhaustion than previous ones?"

  **2. The Measure Problem**
  In eternal inflation, predictions depend on a "measure" to count universes. Since different measures yield different probabilities, and we tend to select measures that make our universe look typical, isn't this functionally equivalent to fitting a curve to existing data?
  *   **Follow-up:** If she argues the measure is chosen for mathematical simplicity: "Is simplicity in this context an empirical virtue that tracks truth, or an aesthetic one that tracks human preference? If the latter, how does it confer confirmation?"

  **3. Fine-Tuning and the Inverse Gambler's Fallacy**
  Critics say inferring a multiverse from fine-tuning is like seeing a double-six and concluding many dice must have been rolled. You rely on observer-selection effects to block this. But does that inference work if we condition on *this specific* observer configuration, rather than just 'observers exist'?
  *   **Follow-up:** If she insists the inference holds for any life-permitting universe: "Then why isn't the hypothesis confirmed equally by *any* possible set of constants that allow life, even ones radically different from ours? Does that dilute the confirmation too much to be meaningful?"

  **4. Boltzmann Brains**
  Some versions of this framework suggest it is overwhelmingly more likely that we are momentary thermal fluctuations than evolved beings. If the theory predicts our observations are likely illusory, doesn't it saw off the branch it's sitting on?
  *   **Follow-up:** If she says this is a known problem to be solved, not a refutation: "If the theory currently predicts we shouldn't trust our reasoning, on what basis are we trusting our reasoning to develop the theory? Is that a pragmatic inconsistency?"

  **5. 'Confirmed' vs. 'Worth Pursuing'**
  If a theory is non-empirically confirmed but yields no testable predictions for decades, what practical work does the word 'confirmed' do? Why not call it 'the only viable research program' and leave truth claims aside?
  *   **Follow-up:** If she says it justifies belief, not just funding: "If belief doesn't change our actions or experimental designs because the data is inaccessible, is that belief epistemically stable, or is it just faith in a mathematical framework?"

  **6. Bayesian Priors**
  You suggest we can update priors based on theoretical virtues like unification. But if those priors aren't anchored by past empirical success of *similar* theories, aren't we just quantifying our own prejudices?
  *   **Follow-up:** If she cites General Relativity as a precedent for non-empirical acceptance: "GR was accepted quickly, but it *did* offer the perihelion of Mercury immediately. Is there a case where a theory was held as confirmed for this long with *zero* novel empirical contact?"

  **7. The Definition of a 'Rival'**
  When you say there are 'no alternatives,' do you mean no alternatives that explain the same math, or no alternatives that explain the same math *and* meet the same theoretical virtues? If it's the latter, aren't you defining rivals out of existence?
  *   **Follow-up:** If she argues the virtues are necessary for coherence: "Who decides which virtues are necessary? If 'background independence' or 'unification' are the gatekeepers, aren't those just preferences inherited from 20th-century physics?"

  **8. The Old Picture of Testing**
  You argue the demand for novel prediction is a leftover from an older philosophy of science. But isn't that demand specifically designed to prevent us from falling in love with elegant mathematics that doesn't describe the world?
  *   **Follow-up:** If she says the old picture is too restrictive for fundamental physics: "If we remove the constraint that forces theory to bow to data, what mechanism prevents the field from becoming a branch of pure mathematics?"

  **9. Historical Analogy**
  Your meta-inductive argument relies on the idea that theories with these virtues tend to be true. But the sample size of 'final theories of everything' is effectively zero. Is the induction statistically valid?
  *   **Follow-up:** If she argues we can use 'intermediate' theories as data points: "Intermediate theories like the Standard Model were empirically confirmed. Are you drawing an analogy between empirically confirmed theories and non-empirically confirmed ones? Isn't that circular?"

  **10. Temporality of Confirmation**
  If non-empirical confirmation is provisional, waiting on future empirics, at what point does the lack of data flip the verdict? Is there a 'tipping point' where the absence of evidence becomes evidence of absence, even for this framework?
  *   **Follow-up:** If she says it's never strictly falsified but becomes improbable: "If the probability drops only when empirical data arrives, haven't we just redefined 'confirmation' to mean 'waiting for data'?"

  ***

  ### Honest Critique

  **The Weakest Question:**
  **Question 5 ('Confirmed' vs. 'Worth Pursuing').**
  This is the weakest link because it invites a semantic stalemate. A skilled philosopher can easily argue that "confirmation" is a graded epistemic state distinct from "pragmatic pursuit." She can simply say, "I am entitled to *believe* it is true with high probability, even if I cannot *act* on that belief experimentally." It allows her to retreat into a private epistemology that is hard to dislodge without sounding like an instrumentalist bully. It risks turning into a debate about dictionary definitions rather than scientific practice.

  **The "Dead End" Condition:**
  I would consider the non-empirical confirmation line a dead end if she cannot satisfactorily answer **Question 1 (The No-Alternatives Argument)** without appealing to authority.
  If her defense of "no alternatives" rests entirely on "trust the experts in the field," the argument collapses into sociology. The epistemic weight of non-empirical confirmation relies on the claim that the *space of possible theories* is objectively constrained, not just that the *sociological space of funded theories* is narrow.
  If she admits that alternatives might exist but are ignored due to funding, hiring, or prestige dynamics, then the "No Alternatives" argument is not evidence of truth, but evidence of groupthink. Once that pillar cracks, the Bayesian updating she relies on loses its primary input, and the whole structure of non-empirical confirmation loses its claim to being anything other than "high confidence without a reason."
