      *   **Requirements:** 8-10 interview questions, each with a specific follow-up based on the likely answer.
      *   **Specific Topics to Cover:**
          1.  No-alternatives argument (exhaustion vs. imagination, insider bias).
          2.  Measure problem (fitting the curve).
          3.  Fine-tuning/Multiverse inference (inverse gambler's fallacy vs. observer selection).
          4.  Boltzmann Brains (self-undermining).
          5.  "Confirmed" vs. "Worth Pursuing" (semantic/pragmatic distinction).
      *   **Constraints:** Short enough to read aloud. Don't strawman/restate position in the question.
      *   **Ending:** Honest critique of the weakest question and a "dead end" condition for the guest's argument.

  2.  **Deconstruct the Guest's Position (Dawid-style Non-Empirical Confirmation):**
      *   *Core Claim:* Empirical data isn't the *only* way to increase probability of a theory being true.
