      *   *Topic 10: Future Empirics.*
          *   *Draft 1:* Will we ever test this?
          *   *Refinement:* If the answer is "maybe never," does non-empirical confirmation become permanent?
          *   *Final Q10:* Focus on the temporality of the confirmation.
          *   *Follow-up:* If she says "it's provisional," ask at what point it flips to disconfirmed without data.

