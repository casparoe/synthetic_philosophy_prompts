          *   *Refinement:* Frame it as self-undermining. If the theory says you're likely a hallucination, why trust the theory?
          *   *Final Q4:* Focus on the "sawing off the branch" aspect.
          *   *Follow-up:* If she says "we'll solve it," ask if that's an empirical promise or a theoretical pledge.

      *   *Topic 5: "Confirmed" vs. "Worth Pursuing".*
          *   *Draft 1:* Why not just say it's interesting instead of confirmed?
          *   *Refinement:* What work does the word "confirmed" do if it doesn't change action?
