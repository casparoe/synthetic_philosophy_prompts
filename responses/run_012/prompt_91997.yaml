answer: |-
  **1. Question**
  This project asks a comparative question with a determinate answer: Does rewilding a sixty-acre temperate hay meadow produce less net wild animal suffering than maintaining it in low-intensity agriculture over a ten-year horizon? To answer this, the project will test three specific claims. First, that the suffering incurred by displaced animals during habitat destruction often exceeds the suffering prevented by reducing population density. Second, that disturbed agricultural land supports species compositions with higher turnover rates and juvenile mortality than restored habitats, altering the total welfare flux. Third, that distinguishing between the instantaneous stock of suffering and the temporal flux of suffering production reverses standard evaluations of land management interventions. By resolving these claims, the project will determine whether conservation or agriculture is the welfare-positive default for marginal land.

  **2. Why it is open**
  The existing debate on wild animal suffering focuses primarily on the net value of nature itself, often concluding that wild lives are not worth living. From this premise, a standard argument follows: human intervention that reduces habitat capacity reduces population size, thereby reducing the total amount of suffering. This view assumes that removing animals is a net welfare gain because it prevents future births into suffering. However, this position rests on fragile assumptions that fail under scrutiny. It treats death as a welfare neutral endpoint, ignoring the process of dying. When land is cleared or changed, animals are not simply deleted; they are displaced, often facing slow deaths via starvation, exposure, or predation in suboptimal territories.

  Furthermore, the standard argument ignores species composition. Disturbed, low-intensity agricultural land often favors r-selected species—small mammals, insects, and rodents characterized by high reproductive rates and extremely high juvenile mortality. Rewilded land may support fewer individuals but of larger body sizes and longer lifespans (K-selected species). A hectare of meadow might contain thousands of short-lived mice, while a hectare of forest contains dozens of deer. Counting heads alone misses the intensity of suffering per life. Finally, the field conflates the stock of suffering (how much pain exists on the land right now) with the flux (how much pain is generated over time). A field might have a low stock of suffering at any instant but a high flux due to rapid turnover and constant predation. Because current frameworks lack the conceptual tools to distinguish these variables, land managers cannot currently make defensible welfare-based decisions between rewilding and agriculture.

  **3. Approach**
  This six-month project is conceptual rather than empirical, designed to build the metric necessary for evaluation before data collection begins. Months one and two will focus on defining the welfare accounting framework. I will develop precise definitions for suffering stock and suffering flux, drawing on population dynamics models to express welfare as a function of density, lifespan, and mortality causes. The goal is to produce a formula where welfare impact is not merely population count, but a weighted integral of suffering over time.

  Months three and four will address the counterfactual and the replacement problem. I will construct a comparative model of the sixty-acre meadow under two scenarios: continued hay production and passive rewilding. This involves mapping the likely species succession in both cases. I will analyze the transition period specifically, modeling the welfare costs of displacement against the long-term welfare benefits of stable habitats. This phase will tackle the non-identity problem: since different animals will exist under each regime, the comparison must rely on expected value per potential life rather than specific individual identities.

  Months five and six will synthesize these models into a decision framework. I will test the framework against edge cases to ensure internal consistency. A philosophical approach is necessary here because empirical data on wild animal subjective experience is sparse. We cannot measure pain directly in wild populations yet. However, we can rigorously define the variables that matter. By clarifying the logic of the comparison, this project prevents future empirical efforts from measuring the wrong things. The output will be a structured argument that identifies which empirical parameters (e.g., predation rates vs. starvation rates) are most critical for determining the welfare outcome, allowing future grants to target data collection efficiently.

  **4. What a result looks like**
  A finished answer will look like a decision matrix for land managers. It will not necessarily declare rewilding universally superior; it may show that under specific conditions, such as high predation pressure in restored habitats, low-intensity agriculture minimizes suffering. The result will be a ranked list of welfare-relevant variables, showing whether the flux of suffering in high-turnover agricultural land outweighs the displacement costs of rewilding. The argument could conclude either way, provided the reasoning is robust enough to guide action.

  **5. What would count as failure**
  The project would fail if the distinction between stock and flux proves mathematically incoherent or if the counterfactual modeling requires empirical data that is completely unavailable. If I cannot produce a framework that narrows the uncertainty rather than expanding it, the scope will have been too ambitious for six months.

  **6. Why fund it**
  Land trusts and conservation groups increasingly face pressure to justify their management choices through ethical lenses, yet they currently lack the tools to evaluate animal welfare impacts. They operate on the assumption that "more nature" equals "more good," or conversely, that reducing wildlife density reduces suffering. This project provides actionable guidance that moves beyond theoretical debate. With this framework, a land trust could audit their properties to determine whether restoration or sustainable use aligns better with harm reduction. Funding this work transforms wild animal welfare from an abstract philosophical problem into a concrete variable in conservation planning, allowing organizations to allocate resources where they actually reduce suffering rather than inadvertently increasing it.
