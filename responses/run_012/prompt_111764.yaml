prompt: |-
  I sit on my faculty's research integrity committee, and at next week's meeting we must dispose of a case that has split us down the middle. A doctoral researcher in a theoretical group contends that the central move in a paper published by their supervisor — a reframing of an old problem that suddenly made it tractable — was first proposed by the student, in a whiteboard conversation and then in a shared draft. The supervisor reworked the idea, proved the results with two other co-authors, and credited the student only in the acknowledgements. The supervisor's defence is that ideas are not property, that the student's sketch was one input among several, and that what the paper actually contributes is the articulation and the proofs, which the supervisor supplied. The student wants authorship, or failing that a formal note of conceptual contribution attached to the published record.

  A friend and I spent most of Saturday evening arguing about this and got nowhere. Her line was that what the student lost was not a thing but an opportunity — that the currency of scholarship is priority, not ownership — and that a committee which confuses the two will either invent property rights over thoughts or leave real injuries without a remedy. My worry is the opposite: that if a remark in conversation can ground an entitlement, nobody will think out loud again, and the seminar and the corridor, where most ideas are actually made, will go quiet.

  Please draft the short written opinion I shall circulate before Thursday's meeting. It should recommend a concrete disposition — including what, if anything, the supervisor must do, and by when — and give the committee reasons it can act on. Engage the supervisor's position seriously rather than dismissing it as self-interest; say plainly what is strongest in it and why it should or should not carry the day. Say also how the rule you propose would bear on the ordinary case, where an idea is genuinely in the air and two people reach it independently, since I suspect the committee will want to know that before it signs. Where the decision turns on contested facts, tell me what further finding we must make first. Keep it short enough to be read aloud at the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Faculty Research Integrity Committee.
      *   **Task:** Draft a short written opinion to circulate before Thursday's meeting.
      *   **Context:** A dispute between a doctoral researcher (student) and their supervisor regarding authorship on a published paper.
      *   **The Conflict:**
          *   *Student:* Claims the central conceptual move was theirs (whiteboard conversation + shared draft). Wants authorship or a formal note of contribution.
          *   *Supervisor:* Claims ideas aren't property, student's sketch was just one input, paper's value is in articulation/proofs (supervisor + 2 others). Student credited in acknowledgements.
      *   **Committee State:** Split down the middle.
      *   **Key Arguments to Address:**
          *   *Friend's View:* Priority vs. Ownership. Don't invent property rights over thoughts.
          *   *User's Worry:* Chilling effect on open discussion/seminars if conversation grounds entitlement.
          *   *Supervisor's Defense:* Ideas $\neq$ Contribution. Execution matters.
      *   **Requirements:**
          *   Recommend a concrete disposition (actions/deadlines).
          *   Give actionable reasons.
          *   Engage seriously with the supervisor's position (strengths/weaknesses).
          *   Address the "ordinary case" (independent discovery/ideas in the air).
          *   Identify necessary factual findings if facts are contested.
          *   **Constraint:** Short enough to be read aloud at the meeting.

  2.  **Determine the Stance/Recommendation:**
      *   *Ethical Standards:* Most guidelines (e.g., ICMJE, COPE, disciplinary norms in math/theory) suggest authorship requires substantial contribution to *conception OR design OR execution OR interpretation*. Merely having an idea is often insufficient, *but* if the idea is the *central novelty* and the student documented it (shared draft), it leans toward conception.
      *   *Balance:* We need to protect students from exploitation without criminalizing mentorship or casual brainstorming.
      *   *Decision:* The "shared draft" is the smoking gun. A whiteboard conversation is ephemeral; a draft implies elaboration. If the draft contains the core insight, the student contributed to the *conception*. Acknowledgements are likely insufficient for a central conceptual move. However, the supervisor's point about execution (proofs) is valid for determining *order* of authorship, not *presence*.
      *   *Disposition:* Recommend a Correction/Erratum noting the specific conceptual contribution, or ideally, adding the student as a co-author (likely middle author). Given the paper is published, adding an author is harder but possible. A formal note of contribution is the minimum viable remedy. Let's aim for the authorship addition if the draft evidence holds, otherwise a detailed correction. Let's lean towards authorship if the "central move" claim is verified, as acknowledgements are for support, not core intellectual genesis.
      *   *Fact Finding:* We *must* verify the draft's content and timing.

  3.  **Drafting - Section by Section:**

      *   **Header:** To the Committee, From [Me], Date, Subject.
      *   **Opening:** State the purpose (recommendation for disposition).
      *   **Addressing the Supervisor's Argument:** Acknowledge the strength. Ideas *are* fluid. Execution (proofs) is labor-intensive and vital. Acknowledgements are standard for minor inputs. *Why it fails here:* If the "central move" is the paper's value, conception *is* a substantial contribution.
      *   **Addressing the "Chilling Effect" (User's Worry):** Distinguish between casual seminar talk and specific, documented supervisory guidance. The rule shouldn't be "ideas = property" but "documented conceptual genesis = contribution."
      *   **Addressing the "Priority vs. Ownership" (Friend's Worry):** Agree that we aren't assigning property, but attributing credit for intellectual labor.
      *   **The "Ordinary Case":** How does this apply to independent discovery? This rule requires *causality*, not just priority. If two people find it independently, both deserve credit. If one tells the other who then publishes, the teller deserves credit.
      *   **Fact Finding:** We cannot decide without seeing the draft.
      *   **Recommendation:**
          1.  Verify the draft (timeline/content).
          2.  If verified: Request authorship addition (or at minimum a detailed Correction stating the conceptual origin).
          3.  Timeline: 30 days.
      *   **Tone:** Formal, reasoned, decisive but fair.

  4.  **Refining and Editing (Self-Correction during drafting):**
      *   *Critique:* Is it too long?
      *   *Fix:* Trim the philosophical musing. Focus on the committee's mandate.
      *   *Critique:* Is the recommendation concrete?
      *   *Fix:* Specify the "Correction" vs. "Authorship" hierarchy.
      *   *Critique:* Did I address the friend's argument?
      *   *Fix:* Integrate it into the reasoning about credit vs. property.
      *   *Critique:* Did I address the user's worry?
      *   *Fix:* Explicitly limit the scope to documented supervisory interactions.

  5.  **Final Polish (checking against constraints):**
      *   *Read aloud test:* Keep sentences relatively punchy. Avoid dense jargon.
      *   *Deadline:* Thursday meeting.
      *   *Action:* Supervisor must do X by Y.
      *   *Facts:* Need to verify the draft.

  6.  **Final Draft Structure:**
      *   **To/From/Subject.**
      *   **Recommendation Summary.**
      *   **Analysis of Supervisor's Claim (Strengths/Limits).**
      *   **Analysis of Policy Concerns (Chilling Effect/Ordinary Cases).**
      *   **Required Fact-Finding.**
      *   **Proposed Resolution.**

  *(Self-Correction on "Authorship Addition"):* Adding an author post-publication is administratively difficult and requires all co-authors' consent. A "Correction" or "Erratum" detailing the contribution is often the more realistic integrity remedy if authorship is denied. However, integrity committees usually uphold authorship criteria. If the student meets authorship criteria (substantial contribution to conception), they *should* be an author. I will recommend the committee urge the addition of the student as a co-author, with the Correction as the fallback if co-authors refuse. Actually, to be decisive: Recommend the committee find that authorship criteria *were* met.

  *Revised Plan:*
  1.  Acknowledge the split.
  2.  Validate Supervisor's view on execution but reject the exclusion of conception.
  3.  Address the "chilling effect" by narrowing the rule to *documented* contributions in a supervisory context.
  4.  Mandate a factual finding on the draft.
  5.  Recommend authorship addition.

  *Wait, one nuance:* The prompt asks for *my* opinion to circulate. It needs to sound like a committee member speaking to colleagues.

  *Let's write.*
answer: |-
  **TO:** Research Integrity Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommended Disposition: Case [Reference Number]

  Colleagues,

  We are asked to adjudicate a conflict between credit for execution and credit for conception. My recommendation is that we find in favor of the student, contingent on a specific factual verification, and require the supervisor to request an authorship correction from the journal.

  **The Supervisor's Position**
  The supervisor's defense rests on a robust norm in our field: that ideas are cheap and proofs are expensive. There is truth here. A heuristic sketch is not a theorem. If we grant authorship for every suggestion made in a corridor, we risk chilling the open exchange of half-formed thoughts that drives theory. Furthermore, the supervisor is correct that scholarship tracks priority and contribution, not property. We are not assigning ownership of a thought, but attributing labor.

  However, this position fails when the "central move" of a paper—the element that makes it publishable—originates elsewhere. Authorship criteria (including our own faculty guidelines) typically require "substantial contributions to the conception or design of the work." If the student provided the conceiving insight *and* documented it in a shared draft prior to the supervisor's proof work, they have met this criterion. Acknowledgements are for support; authorship is for intellectual genesis. To rule otherwise is to permit the senior party to appropriate the junior party's specific intellectual labor under the guise of "mentorship."

  **Addressing Policy Concerns**
  My colleague worries that ruling for the student invents property rights over thoughts. I argue the opposite: we are protecting the currency of scholarship, which is accurate attribution. If we rule against the student, we signal that junior researchers should withhold ideas until they have proved them alone—a far greater chill on collaboration than the one we fear.

  Regarding the "ordinary case" where ideas are in the air: This ruling does not apply to independent discovery or general seminar discussion. It applies specifically to the supervisory relationship, where a power imbalance exists, and where there is *documentary evidence* (the shared draft) establishing causality between the student's input and the paper's core. We are not ruling that ideas are property; we are ruling that documented conceptual contributions in a mentorship context constitute authorship eligibility.

  **Required Fact-Finding**
  We cannot decide on assertions alone. Before voting, we must verify:
  1.  **Timestamp:** Does the shared draft predate the supervisor's proof work?
  2.  **Content:** Does the draft explicitly contain the "central move" claimed, or is it a vague suggestion retroactively fitted to the result?

  **Recommendation**
  1.  **Finding:** If the draft verification is positive, we find that the student meets the criteria for co-authorship.
  2.  **Action:** The supervisor must formally request the journal publish a Correction adding the student as a co-author (position to be negotiated, likely middle author).
  3.  **Alternative:** If the other co-authors refuse, the supervisor must request a Correction explicitly detailing the student's conceptual contribution in the published record.
  4.  **Timeline:** This request must be initiated within 30 days of our final decision.

  This disposition upholds the value of execution without erasing the value of conception. It protects the seminar room by requiring documentation, and it protects the student from exploitation.

  I look forward to discussing this on Thursday.
