          1.  **Production:** Roll dice. High endowment = more dice.
          2.  **Election:** Top 4 producers become the Chamber.
          3.  **Legislation:** Chamber writes one rule for next round.
          4.  **Payoff:** At the very end, who holds the "Constitution" wins? No, the prompt says payoff is the right to set rules.
          5.  **The Twist:** In Round 3, the Chamber is elected, but the *rules* they wrote in Round 2 constrain them so much that they cannot protect their own interests, or a coalition of the bottom 50% exploits a voting rule established earlier.
          6.  *Decision:* Let's use a "Veto" mechanic. In Round 1, the Rich write rules to protect wealth. In Round 2, they tighten them. In Round 3, a procedural rule established in Round 1 (e.g., "Any 5 players can propose a referendum") allows the Poor to overturn the economic logic.

  5.  **Developing the Debrief:**
      *   Must map to: Content, Persistence, Change.
      *   Must address: Relative Autonomy vs. Last Instance.
