      *   *The Twist:* Final round needs to break the pattern. How? Maybe a coalition of the poor, or a rule that backfires, or a random shock that the rules can't handle. Let's go with a coalition of the "have-nots" exploiting a procedural loophole or a moral hazard that the "haves" didn't anticipate because they were too focused on accumulation.
