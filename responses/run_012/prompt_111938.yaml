      *   *Actually, the most philosophical twist:* The Chamber becomes so bogged down in procedure (superstructure) that production halts, and the economic base reasserts itself violently (chaos), OR the Superstructure acts so autonomously it destroys the base.
      *   *Let's go with the "Ideological Capture" twist.* The Rich in Round 1 write rules claiming "Meritocracy." In Round 3, a Poor student uses the language of Meritocracy to shame the Rich into a redistribution that hurts the Rich. This shows the Superstructure (ideas/rules) biting the hand that fed it.

  9.  **Refining the Debrief Questions:**
      *   1. Content: Why did Round 1 rules look like they did? (Economic interest).
      *   2. Persistence: Why did they last through Round 2? (Inertia/Institutionalization).
      *   3. Change: Why did Round 3 break the pattern? (Relative autonomy/Contradiction).
