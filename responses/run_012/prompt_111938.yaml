      *   **Debrief:** 25-30 minutes.

  4.  **Refining the Mechanics for the "Twist":**
      *   If the rich always win, it's just "might makes right." We need the *instability*.
      *   Idea: The Chamber members are also players. If they make rules too favorable to themselves, production might crash, or the non-Chamber members might refuse to play/produce (strike), or they might vote strategically.
      *   Better Idea for Philosophy: The "Superstructure" develops its own logic. The rules created in Round 1 to help the rich might inadvertently create a mechanism the poor can use in Round 3.
      *   *Specific Mechanism:* The Chamber sets a "Tax" or "Redistribution" rule to stabilize the economy (to keep the poor producing). In Round 3, the poor use that redistribution to outvote or out-maneuver the rich in a specific way, or the rich fracture among themselves.
      *   *Let's simplify:* The currency is "Authority Chips." You get them by producing. But the Chamber *allocates* them differently than production dictates.
