  Here is the breakdown of your professor's likely position, the rule she is using, a rival rule that fits her past verdicts, and the case that will force her to choose between them.

  ### 1. The Verdict on Future N
  She will say **Future A is better**.

  She will tell you that ten billion lives of genuine flourishing (100s) cannot be outweighed by a quadrillion lives of mere comfort (3s), even though the 3s are "worth living." To her, there is a qualitative gap between a life that is merely "okay" and a life that is "as good as a human life can go." The sheer number of the 3s does not bridge that gap.

  ### 2. The Rule She Is Running: Weak Lexical Utilitarianism
  Her four verdicts kill off the standard candidates:
  *   **Total Utilitarianism** is dead (Case 1: She rejects the Repugnant Conclusion).
  *   **Average Utilitarianism** is dead (Case 2: She accepts Mere Addition, even though it lowers the average).
  *   **Critical-Level Utilitarianism** is dead (Case 4 vs. Case 1: To reject the Repugnant Conclusion, the critical level $c$ must be $>1$. But if $c>1$, then lives at welfare 1 have *negative* value. In Case 4, ten trillion lives at 1 would then constitute a massive negative value, vastly worse than one person at -1000. She says the opposite).

  The principle that fits all four is **Weak Lexical Utilitarianism** (a form of Qualitative Hedonism).
  *   **The Rule:** There is a lexical threshold of welfare (likely somewhere between 3 and 100, perhaps around "flourishing"). Lives above this threshold are lexically superior to lives below it. No number of sub-threshold lives can outweigh the loss of a threshold life. However, within the sub-threshold tier, aggregation applies (Case 4), and adding sub-threshold lives is good if it doesn't displace threshold lives (Case 2).
  *   **Why it fits:**
      *   *Case 1:* 100s are lexical, 1s are not. A > B.
      *   *Case 2:* Adding 2s adds value without harming 100s. B > A.
      *   *Case 3:* Adding negatives is bad. A > B.
      *   *Case 4:* Within the non-lexical tier, ten trillion positives outweigh one massive negative. A > B.

  ### 3. The Alternative Rule: Convex Total Utilitarianism
  There is another rule that fits all four verdicts perfectly but yields the opposite result on Future N. This is **Convex Total Utilitarianism** (or Excellence-Weighted Utilitarianism).
  *   **The Rule:** Value is the sum of welfare raised to a power greater than 1 (e.g., $V = \sum w^3$). This gives disproportionately high value to high-welfare lives without making them *infinitely* valuable (lexical).
  *   **Why it fits the first four:**
      *   *Case 1:* $10^{10} \times 100^3$ ($10^{16}$) is greater than $10^{15} \times 1^3$ ($10^{15}$). A > B.
      *   *Case 2:* Adding positive welfare always increases the sum. B > A.
      *   *Case 3:* Adding negative welfare decreases the sum. A > B.
      *   *Case 4:* $10^{13} \times 1^3$ ($10^{13}$) is vastly greater than $1 \times -1000$. A > B.
  *   **Why it differs on N:**
      *   *Future A:* $10^{10} \times 100^3 = 10^{16}$.
      *   *Future N:* $10^{15} \times 3^3 = 27 \times 10^{15} = 2.7 \times 10^{16}$.
      *   On this view, the quadrillion lives at 3 accumulate enough "excellence value" to overtake the ten billion lives at 100. **N > A.**

  ### 4. The Tie-Breaker Case
  To separate these two rules, you need to test whether the value of the "100" lives is **discontinuous** (Lexical) or just **very steep** (Convex).

  **Put this case to her:**
  > **Future A:** Ten billion people at 100.
  > **Future C:** Ten billion people at 99 **plus** a quadrillion people at 3.

  *   **If she says A > C:** She is a **Lexical Utilitarian**. Dropping the ten billion from 100 to 99 crosses a qualitative threshold (from "Perfect/Flourishing" to "Merely Excellent"), losing their lexical status. The quadrillion 3s cannot compensate for this loss.
  *   **If she says C > A:** She is a **Convex Totalist**. The loss of value from 100 to 99 is small (continuous), and the massive addition of the quadrillion 3s outweighs that small loss.

  ### Summary of Commitments
  If her four verdicts genuinely don't fix N, it is because both Lexical and Convex views can mimic each other on discrete data points.
  *   **If she chooses A (Lexical):** She commits to the view that there are "kinds" of lives, and ethics is partly about maximizing the number of people who achieve the higher kind, regardless of the total sum of happiness.
  *   **If she chooses N (Convex):** She commits to the view that all lives are on the same scale, but excellence matters exponentially more than mediocrity. She avoids the Repugnant Conclusion not by denying aggregation, but by weighting quality so heavily that quantity rarely wins—unless the quantity is truly astronomical and the quality is decent (like 3s).
