  **Note on Philosophical Accuracy**

  This sestina adheres to René Descartes' arguments in Part V of the *Discourse on the Method*. 

  **The Two Tests:**
  1.  **Test of Language (Words/Signs):** Descartes argues that while animals (or machines) might emit sounds, they cannot arrange words or **signs** to declare their **thoughts** appropriately to all contexts. This is addressed in Stanza 2 ("Cannot shape a word... emitting noise") and Stanza 4 ("No declarative sign"). The magpie mimics the test but cannot pass it, as its speech is merely a rearrangement of sounds (Stanza 4: "I rearrange the word").
  2.  **Test of Performance (Organs/Clock):** Descartes contends that animals act from the disposition of their **organs** (instinct/mechanism) rather than knowledge. They may perform specific tasks well (like a **clock** keeps time) but fail in others requiring universal reason. This is addressed in Stanza 2 ("Driven by the disposition of my organ") and Stanza 3 ("Mechanical organ... tick away the seconds"). The magpie acknowledges its actions are mechanical permutations (Stanza 5: "Regular as a clock").

  **The Asymmetry (Envoi):**
  The envoi highlights an asymmetry in Descartes' reasoning. Descartes admits that a machine resembling an animal (like a monkey) would be indistinguishable from the real animal, as we do not expect animals to use reason or language. However, a machine resembling a human *would* be distinguishable because it would fail the two tests (language and universal reason). The magpie points out that Descartes applies the human test (language/reason) to the bird. Line 1 ("For the monkey, no sign validates the word") notes that monkeys aren't tested for speech. Line 2 ("But man's false clock breaks the human organ") notes that humans are tested for internal reason versus mechanical action. Line 3 ("So why test the thought inside the beast?") challenges the anthropocentric application of the tests.

  **Structural Ambiguity:**
  The sestina form itself performs the philosophical problem. The end-words are permuted by a fixed mathematical rule, mirroring the "disposition of organs" rather than genuine **thought**. The magpie speaks fluently about its own lack of thought, leaving the reader uncertain whether the insight in the envoi is a genuine declaration of thought or merely another mechanical permutation of the fixed repertoire.
