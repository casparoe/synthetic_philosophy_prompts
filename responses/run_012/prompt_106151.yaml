prompt: |-
  Ok so I'm a junior (phil/econ) and I'm the student rep on my university's Student Conduct Board, which is basically the disciplinary panel for student code violations. We meet Thursday and I have to circulate a written opinion before then, and I'm kinda out of my depth on the philosophy side of it even though that's literally my major.

  Here's the case. Seven students occupied the second floor of the admin building for about two days in March to try to stop the trustees from voting to renew the university's contract with an immigration-detention contractor. They didn't wreck much (one door, and someone pulled a fire alarm on the way out, which was dumb), nobody got hurt, and when the police finally came they went limp and got carried out rather than fighting. They're charged under the Code's unauthorized-presence and failure-to-comply sections. Those carry a mandatory one-semester suspension, but the Code lets us go lower if we find "extenuating circumstances," which it never defines. Their defense is basically: we tried everything — petitions, three meetings with the president, a student referendum that passed 62%, and the trustees announced in advance they'd treat it as advisory no matter what. So they say they had no other channel left, and that makes it protest, not just trespass.

  What I have to write: a decision memo I can hand around, recommending a concrete outcome (what sanction for whom, and what we should say as our finding), with reasons the other members could actually argue with. Not just "the Code says X." It goes in the record so it should read formal-ish, but you can talk to me like a person in the reasoning parts.

  The stuff I want it to actually engage, and I'm worried I'll botch it:

  - The Code's preamble says students become members of a community of scholars and accept its norms "by enrolling and remaining enrolled." Is that enough to ground an obligation to follow the rules? What if you never agreed to this particular thing and you get no vote on the trustees who did? I keep hearing the benefit argument (you take the good stuff the university gives you, so you owe compliance) and it seems like it proves too much or too little — definately too much, if it means you owe obedience on everything forever.
  - Is there a real difference between breaking a rule you think is unjust and breaking a neutral rule (trespass, failure to comply) in order to protest something else? Does it matter that they weren't protesting the trespass rule itself?
  - Does it change anything that they took the punishment without resisting? Some people say accepting the penalty is what separates civil disobedience from plain lawbreaking, others say that just lets the institution certify which protests count. Which is it?
  - The chair told me off the record that the trustees are watching and a light outcome "sends a message." Should that affect anything, or is that exactly the kind of pressure that shouldn't?
  - The one I can't get past: if we lower the sanction because we happen to agree the contract is bad, doesn't our authority just become conditional on our agreeing with whoever's occupying the building next time? Give me the strongest version of that worry, then tell me whether it actually holds up.

  Also the fire-alarm kid — same outcome as the ones who just sat there, or not? I think no, but I need a principled line, not vibes.

  Can you draft it? Maybe 800–1000 words.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **User:** Junior Phil/Econ major, Student Rep on Student Conduct Board.
      *   **Task:** Draft a decision memo (written opinion) for a disciplinary hearing regarding a student protest/occupation.
      *   **Deadline:** Needs to be circulated before Thursday.
      *   **Case Details:** 7 students occupied admin building (2 days) to protest immigration-detention contract. Minimal damage (one door, one pulled fire alarm). Non-violent (went limp). Charged with unauthorized presence & failure to comply.
      *   **Code:** Mandatory 1-semester suspension, *unless* "extenuating circumstances" (undefined).
      *   **Defense:** Exhausted all channels (petitions, meetings, referendum), trustees ignored them. Claim "extenuating circumstances" due to lack of recourse.
      *   **Key Philosophical/Practical Issues to Address:**
          1.  Obligation to follow rules (social contract vs. lack of voice).
          2.  Breaking neutral rules to protest unrelated injustice (trespass vs. contract).
          3.  Acceptance of punishment (civil disobedience marker vs. institutional co-optation).
          4.  External pressure (trustees watching) vs. impartiality.
          5.  Consistency/Precedent worry (does leniency invite future occupations?).
          6.  Differentiation: The fire-alarm student vs. the sit-in participants.
      *   **Tone:** Formal enough for the record, but reasoned and argumentative (so colleagues can engage). 800-1000 words.
      *   **Goal:** Recommend a concrete outcome with philosophical grounding.

  2.  **Determine the Stance/Recommendation:**
      *   To make the memo useful for a student rep trying to navigate these philosophical tensions, I need to take a clear position that balances the Code's authority with the moral weight of the protest.
      *   *Recommendation:* Find them responsible but apply "extenuating circumstances" to reduce the sanction for the 6 sit-in participants. Treat the fire-alarm student differently (more severe).
      *   *Rationale:* Acknowledge the breach of community norms but validate the *motivation* and *method* (non-violent, last resort) as extenuating, without endorsing the tactic as standard procedure. Distinguish the fire alarm as creating unnecessary risk, violating the "non-violence/safety" norm of civil disobedience.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Re).
      *   **Introduction:** State the recommendation clearly upfront. (Responsible, but sanction reduced for 6; different for 1).
      *   **Philosophical Grounding (The "Why"):**
          *   *Obligation:* Address the "community of scholars" preamble. It's not blind obedience; it's reciprocal. If the university fails its moral obligations (ignoring democratic student input), the students' obligation weakens, though doesn't vanish.
          *   *Neutral Rules:* Acknowledge they broke trespass rules, not the contract rule. But civil disobedience *requires* breaking a neutral law to highlight a deeper injustice.
          *   *Acceptance of Punishment:* They didn't resist arrest. This shows respect for the *process* even while rejecting the *outcome*. This distinguishes them from vandals.
          *   *Precedent/Consistency:* Address the "slippery slope." Leniency isn't about agreeing with the cause, but recognizing the *exhaustion of channels*. It sets a high bar, not an open door.
          *   *External Pressure:* Explicitly state that trustee pressure is irrelevant to conduct findings.
      *   **Differentiation (The Fire Alarm):**
          *   Why is this different? Safety vs. Disruption. Pulling an alarm risks panic/injury. It violates the "do no harm" principle inherent in legitimate protest.
      *   **Conclusion:** Summarize the sanction.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is this too activist?
      *   *Fix:* Ensure I emphasize that they *are* responsible. We aren't acquitting them. We are using the "extenuating circumstances" clause. This upholds the Code while allowing discretion.
      *   *Critique:* Is the distinction on the fire alarm clear?
      *   *Fix:* Frame it as a violation of the *safety* norm, which is more fundamental than the *presence* norm.
      *   *Word Count Check:* Keep it tight. Don't ramble on Rawls; keep it applied to the Code.
      *   *Tone:* Needs to sound like a student rep who knows their philosophy but respects the board's function. Formal but analytical.

  5.  **Drafting the Content (incorporating specific prompts):**
      *   *Obligation:* Use the "reciprocity" angle.
      *   *Neutral Rules:* Cite the nature of civil disobedience.
      *   *Precedent:* Frame it as "exhaustion of remedies" rather than "good cause."
      *   *Trustees:* Dismiss this firmly as extraneous.

  6.  **Final Review against Constraints:**
      *   800-1000 words? (Will aim for this range).
      *   Address all 5 bullet points? (Yes).
      *   Differentiate fire alarm kid? (Yes).
      *   Formal memo style? (Yes).

  7.  **Final Polish:** Check transitions and ensure the "voice" sounds like a thoughtful junior majoring in Phil/Econ (analytical, precise, slightly academic but practical). *Self-correction: Make sure I don't sound like I'm writing a term paper. It needs to be a legalistic/ethical memo.*

  *(Drafting process mental check)*: Start with the recommendation. Then the reasoning. Then the specific distinction. End with the sanction. Ensure the "extenuating circumstances" definition is proposed clearly.

  Let's write.

  *Word Count Strategy:*
  - Header: 50 words
  - Intro/Rec: 150 words
  - Obligation/Community: 200 words
  - Civil Disobedience/Neutral Rules: 200 words
  - Precedent/Trustees: 200 words
  - Fire Alarm Distinction: 150 words
  - Conclusion: 50 words
  Total: ~1000.

  *Refining the "Obligation" point:* The prompt asks about the "benefit argument." I should explicitly reject the idea that enrollment = blanket consent. Instead, frame it as a conditional covenant.
  *Refining the "Precedent" point:* The worry is that authority becomes conditional on agreement. I need to argue authority rests on *procedural fairness*, not outcome alignment.

