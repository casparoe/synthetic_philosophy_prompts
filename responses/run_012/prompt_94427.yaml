answer: |-
  The rain had been falling since dawn, a steady, gray sheet that blurred the edges of Elena's backyard. Inside, the kitchen was too warm, smelling of damp wool and bergamot. Elena stood at the counter, watching the kettle shudder. She had bought the good tea bags, the ones with the strings and tags, though she usually drank coffee. She checked her watch. 2:00 PM.

  Sarah arrived at 2:15, shaking a wet umbrella over the mat. She was forty, dressed in a coat that had seen better winters, her hair pulled back in a way that suggested she hadn't meant to be seen by anyone.

  "You're wet," Elena said.

  "It's raining," Sarah said. She stepped out of her boots. "You said you had heating."

  "I do. Sit."

  Elena poured the water. She offered the box of tea bags; Sarah picked one, inspected it, and put it back, choosing a different flavor. A small, petty friction. Elena sat opposite her. Between them lay the manuscript, bound in black comb spine, three years of work resting on the laminate table.

  "Page forty-two," Sarah said. She didn't touch the tea.

  Elena knew the page. Act Two, Scene Three. The strategy meeting.

  "The scene where she cuts the funding," Sarah said. "For the East Side shelter."

  "It's in the ledger, Sarah. You gave me the ledger."

  "The ledger shows she moved the funds. It doesn't show her saying... what she says in your dialogue." Sarah tapped the cover. "You have her say, 'Let them sleep in the cold. It makes better photos.' My mother never said that."

  "She said something like it."

  "She wrote it in a private note to a donor. That's not the same as saying it to a room full of volunteers." Sarah's voice was tight. "In your play, she says it to *them*. To the people who trusted her."

  "Drama requires compression," Elena said. She reached for her mug. "If I have her write the letter, then read it aloud in a monologue, the audience checks out. If she says it in the room, the tension holds."

  "So you're admitting you changed it."

  "I'm admitting I dramatized it. There's a difference between a transcript and a play."

  "It's not a small change," Sarah said. "It changes who she was. In the ledger, she's making a hard choice to save the North Side clinic. She's sacrificing one to save the other. In your play, she's doing it for the *photos*. You're making her cynical. You're making her... ambitious."

  "I'm making her human," Elena said. "Saints don't fill seats. Saints are boring. If I write her as a martyr, nobody believes her. If I write her as a person who did good things for complicated reasons, maybe they see themselves in her."

  "They won't see themselves," Sarah said. "They'll see *her*. And when you're gone, and this play is done, this version of her is what stays. You're carving it in stone."

  "It's paper."

  "It's public record. You're putting this out into the world. People will read this and think they know her. They'll talk about her at dinner parties. 'Oh, Margot Vance, the one who liked the cold photos.' That's what sticks. Not the clinic. Not the shelter. The line."

  Elena looked out the window. The rain was heavier now, drumming against the glass. "She kept that letter, Sarah. She didn't burn it. She put it in the archive. She knew someone might find it."

  "She was fifty-two. She was tired. She wrote a lot of things she didn't mean when she was tired."

  "Then why keep it?"

  "Because she was disorganized. Because she thought no one would care." Sarah finally picked up her tea, holding the mug with both hands. "You care. You went digging. You found the one thing that makes her look bad, and you built a whole act around it."

  "I didn't dig for dirt. I dug for truth. There's a difference."

  "Is there?" Sarah looked at her. "You wanted a conflict. You needed her to have a flaw. So you took a moment of weakness and you made it a character trait."

  "If I leave it out, I'm lying."

  "If you put it in like this, you're lying too." Sarah set the mug down. Too hard. Tea sloshed over the rim. Neither woman moved to wipe it. "You talk about truth like it's an object. Like it's something you can hold. But memory is truth too. I lived with her. I know what she was like at breakfast. I know how she treated me. You're telling me my memory is less valid than a letter she wrote in an office when she was alone?"

  "Memory is subjective. The letter is physical."

  "The letter is one second of one day. I have ten thousand days." Sarah leaned forward. "She can't answer you, Elena. That's the problem. You're putting words in her mouth. You're appointing yourself her proxy. Did she ask you to do this?"

  "No."

  "Did she ask anyone to tell this story?"

  "I don't need permission to tell the truth."

  "She's dead."

  "I know."

  "She can't sue you. She can't write an op-ed. She can't call you up and say, 'That's not what I meant.'" Sarah's voice cracked, just once. "You have all the power here. I'm just asking you to... soften it. Just the dialogue. Keep the action. Keep the funding cut. But don't make her say the line about the photos."

  Elena looked at the manuscript. She thought about the scene. She had written it three times. The first version was too soft; the actors couldn't find the stakes. The second was too hard; the test audience hated Margot. This version, the third, felt true. It felt like the weight of the world pressing down on a person until they snapped.

  "If I change it," Elena said, "I'm protecting her. I'm curating her legacy."

  "You're respecting her."

  "I'm respecting the work."

  "The work is fiction."

  "It's based on fact."

  "It's based on *her*." Sarah sat back. "You know what happens when a play opens? It becomes real. People will quote it. Biographers will use it as a source. You're not just writing a story; you're writing history. And you're writing it wrong."

  "I'm writing it honest."

  "Honest for who? For the audience? For you?" Sarah gestured to the room. "You get a career out of this. You get a production. Maybe an award. She gets to be the woman who liked cold photos."

  "I don't want an award."

  "Everyone wants an award."

  Elena felt a flash of anger, hot and sharp. "I have spent three years in her life. I have read every receipt. I have talked to every surviving colleague. I have dreamed about her. Do not tell me I don't care."

  "I'm telling me you care about the *story* more than you care about the *person*."

  "They're the same thing."

  "They're not." Sarah stood up. She walked to the window, looking out at the rain. "When I was twelve, I broke my arm. She missed my recital to handle an eviction crisis. I was furious. I didn't speak to her for a week. Later, I found out she paid the rent for that family out of her own pocket because the grant hadn't come through. She didn't tell me. She just let me be mad."

  "And?"

  "And in your play, you have her miss the recital to meet a donor. You changed the reason."

  "Because the eviction doesn't drive the plot. The donor does."

  "See?" Sarah turned around. "You're fixing her. You're editing her to make sense to strangers. She didn't make sense sometimes. She was messy. But she wasn't cynical. You're taking her messiness and turning it into malice because malice is easier to stage."

  Elena looked at the wet spot on the table. It was spreading toward the manuscript. She should move it. She didn't.

  "If I change it," Elena said quietly, "I'm saying she was better than she was."

  "If you don't," Sarah said, "you're saying she was worse."

  "Which is the lie?"

  Sarah walked back to the table. She picked up her umbrella. "I don't know. But I know who has to live with it. You'll go on to the next subject. You'll write about someone else. She stays here. In this book. In this scene."

  "I can't change it, Sarah."

  "I know." Sarah didn't sound surprised. "I just wanted you to hear me. I wanted you to know that when you write that line, you're killing her again. Not the body. The rest of her."

  "She's already dead."

  "That doesn't make it hurt less." Sarah put her hand on the manuscript. For a moment, Elena thought she might take it. Instead, she smoothed the corner of the page. "Do what you want. You're the writer. I'm just the daughter."

  "I'll put a note in the program," Elena said. "About the complexities. About the archive."

  "People don't read the program," Sarah said. "They read the play."

  She picked up her boots. She didn't put them on; she just held them by the heels. "Keep the tea. I'm not thirsty."

  "Sarah—"

  "Don't call me. When it opens, send me a ticket. I'll come. I'll sit in the back."

  She opened the door. The sound of the rain rushed in, loud and immediate, filling the silence of the kitchen.

  "Will you stay for dinner?" Elena asked. She didn't know why she asked.

  Sarah looked at her, then at the manuscript, then at the rain. "No."

  She stepped out onto the porch. Elena waited until she heard the car start, the engine coughing against the damp, before she moved. She picked up the manuscript. The corner where Sarah's hand had been was dry. The rest of the table was damp from the air.

  Elena took a pen from the drawer. She opened the book to page forty-two. She hovered the ink over the line: *Let them sleep in the cold. It makes better photos.*

  She held it there for a long time. The rain continued to fall, blurring the backyard, washing the garden, eroding the soil. She put the cap back on the pen. She closed the book. She went to the sink and wiped up the spilled tea, rubbing the laminate until it was dry, until there was no evidence that anyone else had been there at all.
