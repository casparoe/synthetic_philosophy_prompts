prompt: |-
  I am leading a ninety-minute reading group for non-specialists on the disagreement between Peirce and James about truth, and I need a teaching plan rather than an exposition. Please set out the order in which the ideas must be introduced so that the difference between a condition of truth-aptness and a criterion of truth does not collapse, and identify the one carrying example to build the session around. I want to use a case of my own devising: two archivists dispute whether a water-damaged ledger’s missing entry truly records a debt, one treating truth as what an unlimited community of inquiry would converge on, the other as what it is beneficial to believe for settling the estate. Explain what that example must include and exclude, and why the usual carriers, such as religious belief or a plain observation report, would serve worse. Which misconceptions will the group predictably form, for instance that James simply identifies truth with usefulness, that Peirce is merely a consensus theorist, or that pragmatism is a form of relativism; at exactly what point in the sequence should each be headed off; and what single question should I ask at the end to tell whether they have grasped the disagreement rather than merely memorised two slogans? Finally, tell me what I should explicitly refuse to cover at this level.
reasoning: |-
