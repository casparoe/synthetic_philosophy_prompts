answer: |-
  ### Teaching Plan: Peirce vs. James on Truth (90 Minutes)

  #### I. The Carrying Example: The Water-Damaged Ledger
  **Do not change this example.** It is superior to religious belief (which lacks verifiable consequences for non-believers) and plain observation (e.g., "the cat is on the mat," which verifies too quickly to show the tension between "now" and "long run").

  **What the Example Must Include:**
  1.  **Irretrievable Ambiguity:** The ink is smudged. It *could* be a debt, it *could* be a gift. There is no immediate empirical test to decide.
  2.  **Independent Reality:** It must be clear that historically, the transaction *either happened or it did not*, regardless of what the archivists think. (This secures the **Condition of Truth-Aptness**: there is a fact of the matter).
  3.  **Practical Urgency:** The estate cannot be settled until this is decided. Heirs are anxious; legal fees are mounting. (This secures the **Criterion of Truth**: the pressure to verify).
  4.  **Consequences of Belief:** Believing it is a debt allows settlement but hurts one heir. Believing it is not a debt stalls settlement and angers creditors.

  **What the Example Must Exclude:**
  1.  **Moral Valence:** Do not make the debt "good" or "bad." This distracts into ethics.
  2.  **Perfect Verification:** Do not allow a scenario where a third copy of the ledger might be found next week. The Peircean must argue for a *theoretical* long run, not a literal search for more paper.
  3.  **Emotional Bias:** The archivists must be disinterested professionals. This prevents the group from dismissing James as "wishful thinking."

  ---

  #### II. Sequence of Ideas (90 Minutes)
  *The goal of this sequence is to prevent the collapse of the **Condition** (what makes a claim capable of being true) from the **Criterion** (how we verify it).*

  **0:00 – 0:15 | Introduction: The Pragmatic Maxim**
  *   **Activity:** Present the Ledger Case. Ask the group: "What would it *mean* for the missing entry to be true?"
  *   **Concept:** Introduce the Pragmatic Maxim loosely: To understand a concept, look at its practical consequences.
  *   **Protection:** Explicitly state: "We are not asking what is *nice* to believe. We are asking what *counts* as truth."
  *   **Distinction Setup:** Draw two columns on the board: **(1) The Fact** (Did the debt exist?) and **(2) The Verification** (How do we decide?). Label them **Condition** and **Criterion**.

  **0:15 – 0:35 | Peirce: The Long Run and External Permanency**
  *   **Idea:** Truth is the opinion fated to be agreed upon by all who investigate, in the indefinite long run.
  *   **Application:** Archivist P says: "We cannot settle yet. We must correlate this ledger with tax records, letters, and bank logs. The truth is what the evidence *forces* us to conclude eventually."
  *   **Misconception Checkpoint (0:25):** **Head off "Peirce = Consensus Theorist."**
      *   *Ask:* "If everyone agreed the debt was real, but they were all mistaken, is it true?"
      *   *Correction:* No. For Peirce, reality *causes* the consensus. The consensus is the sign, not the source. The "External Permanency" (the actual historical debt) constrains the inquiry.
  *   **Distinction Reinforcement:** Peirce treats the **Condition** as fixed (the debt happened or didn't) and the **Criterion** as asymptotic (we approach truth but may never hold it fully now).

  **0:35 – 0:55 | James: Expediency and the Cash-Value**
  *   **Idea:** Truth is what proves itself to be good in the way of belief. It "happens" to an idea when it guides us successfully through experience.
  *   **Application:** Archivist J says: "We have exhausted reasonable search. To believe 'Debt' allows us to close the estate, pay the creditors, and end the family stress. This belief 'works' to navigate the current reality."
  *   **Misconception Checkpoint (0:45):** **Head off "James = True is Useful."**
      *   *Ask:* "If lying about the debt stopped the stress, would that be true?"
      *   *Correction:* No. "Useful" does not mean "pleasant." It means "instrumentally reliable." The belief must connect with the rest of the web of experience (e.g., the creditors actually get paid, the legal system accepts it). It is not a free pass to fantasy.
  *   **Distinction Reinforcement:** James blurs the **Condition**. For him, the truth *is made* in the verification. The "fact" isn't a static ghost waiting to be found; it is constituted by the successful settlement.

  **0:55 – 1:15 | The Collision: Condition vs. Criterion**
  *   **Activity:** Return to the two columns on the board.
  *   **Analysis:**
      *   **Condition:** Peirce insists the truth exists *before* we find it (Realism). James insists truth is a property of the *process* of verification (Humanism).
      *   **Criterion:** Peirce demands the *ideal limit* of inquiry (Science). James demands the *satisfactory closure* of the specific problem (Life).
  *   **Misconception Checkpoint (1:05):** **Head off "Pragmatism = Relativism."**
      *   *Ask:* "Can Archivist J say it's a debt, and Archivist P say it's not, and both be right?"
      *   *Correction:* No. They are answering different questions. Peirce asks, "What is the final story of the universe?" James asks, "What is the right move for us today?" James is not saying reality is subjective; he is saying our *access* to truth is bound to our human needs.

  **1:15 – 1:30 | Synthesis and Assessment**
  *   **Review:** Summarize that Peirce protects the *objectivity* of truth (saving science), while James protects the *vitality* of truth (saving life/religion/action).
  *   **Final Assessment Question:** (See below).

  ---

  #### III. The Single Assessment Question
  Do not ask them to define the terms. Ask them to apply the distinction to a counter-factual.

  **"Suppose the estate is settled using Archivist J's method, and the family lives peacefully for generations. However, 200 years later, a time-capsule is found containing a letter from the deceased explicitly stating 'I forgave the debt.'**

  **According to James, was Archivist J's belief *true* when he held it? According to Peirce, was it *true*?"**

  *   **Correct Grasp:**
      *   **James:** Yes (or "True in that context"). The belief worked; it guided action successfully *at the time*. Truth can expire or be overwritten by new experience.
      *   **Peirce:** No. The belief was false, even if it was useful. The "final opinion" (revealed by the letter) contradicts it. Utility is not truth.
  *   **Sign of Failure:** If they say "Both were right" (Relativism) or "Both were wrong because truth doesn't exist" (Nihilism) or "James was lying" (Moralizing).

  ---

  #### IV. What to Explicitly Refuse to Cover
  To keep the distinction between Condition and Criterion from collapsing, you must exclude topics that muddy the metaphysical waters.

  1.  **Do not cover Peirce's Semiotics:** Do not introduce Icons, Indices, and Symbols. This distracts into linguistics and away from the metaphysics of truth.
  2.  **Do not cover James's "Radical Empiricism":** Do not discuss the metaphysical status of "relations" or "pure experience." This makes James sound like an idealist, which reinforces the "relativism" misconception.
  3.  **Do not cover Rorty or Dewey:** Do not mention later pragmatists who explicitly *did* collapse the distinction (e.g., Rorty's anti-realism). Stick strictly to the Peirce-James friction.
  4.  **Do not cover the "Will to Believe":** While related, this essay focuses on the *right* to believe without evidence. Stick to the definition of truth itself to avoid conflating *epistemic permission* with *truth conditions*.

  #### V. Instructor's Note on the "Condition/Criterion" Trap
  Non-specialists naturally conflate "How we know" (Criterion) with "What it is" (Condition).
  *   **Visual Aid:** Keep the two columns (**The Fact** vs. **The Verification**) visible on the board for the entire 90 minutes.
  *   **Verbal Cue:** Every time a student says "Truth is...", ask them: "Are you describing the *territory* (Condition) or the *map-making process* (Criterion)?"
  *   **Peirce's Trap:** Students will think Peirce defines truth *as* consensus. Remind them: Consensus is the *thermometer*, not the *heat*.
  *   **James's Trap:** Students will think James defines truth *as* profit. Remind them: Profit is the *receipt*, not the *goods*.
