      *   Is sincerity consistent? (Yes, crucial).
      *   Can it carry the ending? (Yes, but with caveats on what "responsibility" means).

      *(Self-Correction during drafting)*: Make sure to mention Michael Gazzaniga explicitly. He coined the "Interpreter" module which is exactly this press secretary idea. Also mention Daniel Wegner ("The Illusion of Conscious Will").

      *(Refining the Ending advice)*: If the book ends on "I'm not responsible," it might feel unsatisfying. A better thematic resonance might be "I am not the author, but I am the voice, and the voice matters." Or, "Even if it's spin, it's the only truth we have."

      *(Final check on Libet)*: Ensure I clarify that Libet's data is heavily contested now. Don't present it as settled fact.

