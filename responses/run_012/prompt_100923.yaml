answer: |-
  # Q&A Prep Sheet: Distributional Acausal Trade (DAT)

  **Strategy:** Your friend's dichotomy (EDT vs. Metaphysics) is the framing the room will adopt. Your goal is to argue it is neither: it is *policy selection* over a *logical state space*. Do not defend the metaphysics as "physical"; defend it as "necessary for logical coherence." Do not deny the EDT overlap; deny that EDT explains *why* the correlation holds.

  **Strategic Concessions (Say these in the Intro):**
  1.  **Causal Isolation:** Concede immediately that in standard causal games (Prisoner's Dilemma with causal contact), DAT collapses to CDT. You are not claiming to overturn causal dominance where causal arrows exist.
  2.  **Extensional Equivalence:** Concede that in many simple cases, DAT yields the same recommendations as EDT. Your claim is not about the *output* in simple cases, but the *structural explanation* in logically correlated cases.
  3.  **Ontological Commitment:** Admit that DAT requires accepting a measure over logical possibilities, not just physical frequencies. Frame this as a cost of doing business in logical decision theory, not a bug.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Causal Graph Objection (The CDT Majority)
  **Vocabulary:** *Causal arrows, intervention, screening off, spurious correlation.*
  **The Charge:** "You've drawn a decision matrix where my choice is probabilistically correlated with yours, but you haven't drawn a causal arrow connecting them. In a causal graph, these nodes are d-separated. By conditioning on your output to make your decision, you are treating a logical correlation as a causal lever. That's the definition of magical thinking. Where is the mechanism that allows my policy to shift the measure of your type?"
  **The Reply:** "The mechanism isn't causal; it's logical. We aren't intervening on the other agent's output; we are selecting a policy that logically entails a specific distribution over outputs. Think of it not as 'I choose Cooperate, so you Cooperate,' but 'We both instantiate the same algorithm. If the algorithm outputs Cooperate, the measure of cooperative types is 1.' The 'shift in measure' is just the recognition that my decision procedure is a logical fact that constrains the possible worlds compatible with that fact. I am not pulling a causal lever; I am locating myself in the logical space of algorithms."
  **Weakness:** This relies entirely on the audience accepting that "logical space" has normative force. If they view logic as descriptive and causation as prescriptive, you haven't moved them.

  #### 2. The Measure Ontology Objection (The Probability Philosopher)
  **Vocabulary:** *Sigma-algebra, support, conditioning on measure zero, sample space.*
  **The Charge:** "You speak of a 'probability distribution over agent-types.' But if the agents are deterministic functions of a random seed, the type is fixed. The probability is either 0 or 1. You are conditioning on events that are logically determined. Unless you have a theory of logical probability that allows non-trivial measures over necessary truths, your 'distribution' is empty. You're smuggling in uncertainty where there is only ignorance."
  **The Reply:** "I am not claiming the uncertainty is physical; it is indexical and logical. The sample space isn't 'what happens in the world,' it's 'which logical instantiation I am.' Before I evaluate my policy, I must assign a measure over the possible logical outputs of my own code. This is the 'logical updatelessness' condition. I evaluate the policy from a perspective where I do not yet know the output of my own computation. The measure represents the weight of logical possibilities, not physical frequencies."
  **Weakness:** This is the hardest technical hurdle. If they press on how to construct this measure without arbitrariness, you risk admitting it's just a prior you're tweaking to get the result you want.

  #### 3. The Dominance Objection (The Game Theorist)
  **Vocabulary:** *Dominant strategy, Nash equilibrium, payoff matrix, best response.*
  **The Charge:** "Look at the payoff matrix. Defecting is a dominant strategy. Regardless of what the other distribution does, Defect yields a higher utility. You're arguing that I should choose a policy that yields a lower payoff in the actual world, based on a counterfactual world that doesn't exist. That violates the basic axiom of rationality: maximize utility in the world you are in, not the world you wish you were in."
  **The Reply:** "Defection is only dominant if you treat the other agent's move as fixed while you vary yours. But in DAT, you cannot vary your move without varying the logical probability of the other's move. The 'world you are in' is determined by your policy. If you choose the Defect policy, you are in a world where the measure of Defect-types is high, and payoffs are low. You maximize utility by choosing the policy that creates the best world, not by optimizing within a world fixed by a bad policy."
  **Weakness:** Game theorists hate redefining the matrix. They will see this as moving the goalposts to avoid the dominance argument.

  #### 4. The EDT Redundancy Objection (Your Friend)
  **Vocabulary:** *Conditional expected utility, screening off, common cause, Newcomb.*
  **The Charge:** "This is Evidential Decision Theory with extra steps. EDT says 'choose the action that gives the best news.' You say 'choose the policy that shifts the measure.' But since the measure shift is just a probabilistic correlation, you're just maximizing conditional expected utility. Why do I need 'distributions over types' to tell me to do what EDT already does?"
  **The Reply:** "EDT fails when correlations are spurious (e.g., the Smoking Lesion). EDT says 'don't smoke' because smoking is evidence of the lesion. DAT says 'smoke' because your policy doesn't control the lesion's distribution, only your own type's distribution. DAT distinguishes between logical correlations (which you control via policy) and mere evidential correlations (which you don't). It recovers EDT's wins in Newcomb problems but avoids EDT's losses in common-cause problems."
  **Weakness:** You need a clear example where DAT and EDT diverge ready to go. If you can't produce one instantly, this objection sticks.

  #### 5. The Incentive Compatibility Objection (The Economist)
  **Vocabulary:** *Mechanism design, truth-telling, implementation, exploitation.*
  **The Charge:** "Is this mechanism incentive-compatible? If I know you are using Distributional Acausal Trade, can I program my agent to defect against you while mimicking the 'cooperative distribution' signature? If your trade relies on predicting my distribution, and I can fake my distribution, your scheme collapses. It isn't robust to strategic misrepresentation."
  **The Reply:** "DAT assumes the agents are transparent or logically simulatable. You cannot fake your distribution because your distribution is derived from your source code, which I can inspect. If you try to 'fake' cooperation, your code actually becomes a defector-code, shifting your measure. The 'signature' isn't a message; it's the logical structure of your decision procedure. Incentive compatibility holds because logical facts cannot be lied about, only instantiated."
  **Weakness:** This assumes perfect transparency. In real-world applications (or bounded rationality), code isn't fully readable. The economist will pounce on the "idealized transparency" assumption.

  #### 6. The Logical Counterfactual Objection (The Logical Uncertainty Researcher)
  **Vocabulary:** *Logical induction, counterfactuals, consistency, explosion.*
  **The Charge:** "How do you compute the counterfactual 'If I chose Cooperate, what is the distribution of the other?' If the other agent is a copy of you, and you choose Cooperate, then logically they *must* choose Cooperate. There is no probability distribution to shift. It's a tautology. Your framework treats logical implications as if they were stochastic variables."
  **The Reply:** "We are dealing with bounded agents with logical uncertainty. I don't know for certain that the other is a copy. I assign a probability to the hypothesis 'they are a copy.' My policy selection evaluates the expected utility across these logical hypotheses. The 'distribution' is over the space of logical relationships, not just actions."
  **Weakness:** This retreats from "acausal trade" to "uncertainty about identity." It weakens the core claim that trade occurs even with known copies.

  #### 7. The Indexicality Objection (The Philosopher)
  **Vocabulary:** *Self-locating belief, actuality, reference class.*
  **The Charge:** "You say I shouldn't privilege my indexical location. But I *am* here. I am the actual decider. Why should I care about the 'measure' of my type in other logically possible worlds? Those worlds aren't real. I only experience the utility of this world."
  **The Reply:** "Because 'this world' is selected by the policy you adopt. You are not a point in a world; you are an algorithm that generates a world. To ask 'why care about other worlds' is to ask 'why care about the logical consequences of my code.' The indexical 'I' is just the pointer to the algorithm's execution. The utility is summed over the execution trace, not the single instance."
  **Weakness:** This sounds mystical to non-SSA (Self-Sampling Assumption) thinkers. It risks sounding like you're denying the reality of the present moment.

  #### 8. The Predictive Difference Objection (The Skeptic)
  **Vocabulary:** *Empirical content, falsifiability, operationalization.*
  **The Charge:** "If DAT agrees with CDT in causal games and EDT in Newcomb games, what does it predict that is new? If it makes no unique predictions, it's just a reinterpretation. If it does make unique predictions, are they plausible?"
  **The Reply:** "It predicts cooperation in 'Transparent Prisoner's Dilemmas' where agents can read each other's code but have no causal contact. CDT defects; EDT might cooperate but fails on lesions; DAT cooperates robustly. It also prescribes different behavior in 'Counterfactual Mugging' scenarios where the existence of the agent depends on the decision."
  **Weakness:** These cases are highly theoretical. The skeptic will dismiss them as "philosopher's toys" with no real-world application.

  ---

  ### The One Question I Hope Nobody Asks

  **"How is the distribution over distributions selected?"**

  **Why it's dangerous:** Your theory relies on agents controlling the conditional distribution of their type. But what fixes the *prior* distribution over the agent-types themselves? If I can choose my policy, can I also choose the prior that makes my policy look good? If the prior is fixed, where does it come from? If it's subjective, isn't this just Bayesianism with a fancy name? If you admit the prior is arbitrary, the normative force of the theory collapses. If you say it's objective, you need a metaphysics of logical probability you likely don't have fully worked out.

  **If asked:** "The prior is fixed by the logical structure of the problem space, not the agent. It represents the space of possible algorithms, not the agent's belief. However, I concede that formalizing the 'measure over algorithms' is the primary open technical problem for DAT." (Then pivot to the Logical Uncertainty researchers in the room).
