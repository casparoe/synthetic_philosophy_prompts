answer: |-
  Your hunch is sharp, but it is only half the picture. You have correctly identified the moral texture of the disagreement, but you are underestimating the legal and functional layers that are hiding inside it.

  Here is the diagnosis of the shape of this disagreement, tested against your intuition.

  ### 1. Testing your hunch: Rules vs. Relationships
  You suggest London wants a rule applicable without knowing who you are, while Lagos says it depends on the relationship. This is accurate, but it frames the dispute as purely philosophical. It is not.

  London is not merely arguing for universal morality; they are arguing for **predictability**. For Finance, a rule is a tool to remove discretion. If the rule is "no payments to officials," the decision is made. If the rule is "no payments unless culturally appropriate," the decision requires judgement, and judgement creates liability.

  Lagos is not merely arguing for relational ethics; they are arguing for **efficacy**. For the local lead, the "fee" is not a moral choice but a logistical variable, like fuel or freight. To them, London's refusal to pay looks less like integrity and more like a refusal to acknowledge the terrain.

  So, your hunch is right that they are arguing about *how to decide*, but it is not just about moral arguments. It is about **risk allocation**. London allocates risk to the company's legal standing; Lagos allocates risk to the project's timeline. They are both trying to protect the company, but they are protecting different organs of the same body.

  ### 2. The Nature of the Disagreement
  You asked if this is factual, evidential, or bedrock. It is all three, layered like sediment.

  **The Factual Layer (Surface)**
  Does the fee work? Lagos says yes; London suspects it is a racket that invites further demands. This is empirically testable, but you cannot test it without paying, which creates the catch-22. However, even if you proved definitively that paying guarantees release within 24 hours, London would still object. Therefore, the facts are not doing the heavy lifting.

  **The Evidential Layer (Middle)**
  What counts as data? London cites the UK Bribery Act (which has extraterritorial reach) and internal compliance audits. Lagos cites local precedent and the physical reality of the warehouse. Nairobi cites social anthropology (the distinction between a shakedown and a gift).
  They are talking past one another because they do not agree on which evidence is admissible. London treats local custom as irrelevant against statute. Lagos treats statute as irrelevant against survival. Nairobi is trying to introduce nuance, but both sides are ignoring her because she complicates the binary.

  **The Bedrock Layer (Deep)**
  This is where your hunch lands. It is a disagreement about **agency**.
  *   **London** views the company as a distinct legal entity that must remain separate from the state. Any payment blurs that line.
  *   **Lagos** views the company as a participant in a social ecosystem. You cannot operate without being embedded.
  *   **Nairobi** views the transaction as a moral act defined by intent and reciprocity.

  This is bedrock because neither side can give a reason the other is obliged to accept. London cannot explain to Lagos why a missed launch is preferable to a dirty hand without sounding privileged. Lagos cannot explain to London why the law doesn't apply here without sounding reckless.

  ### 3. The "Essentially Contested Concept"
  You worried that calling corruption "essentially contested" means nobody can be wrong. That is a cop-out interpretation.

  It simply means the word "corruption" does not describe a physical object (like a server); it describes a **violation of a norm**. If you do not agree on the norm, you cannot agree on the violation.
  *   For London, the norm is *statutory compliance*.
  *   For Lagos, the norm is *operational continuity*.
  *   For Nairobi, the norm is *social propriety*.

  When they argue about corruption, they are actually arguing about which norm takes precedence. It is not that truth is impossible; it is that they are measuring against different rulers.

  ### 4. The Lobbying and Networking Challenge
  You asked if the point about lobbying and Christmas drinks is a cheap move. It is not. It is the most important philosophical point raised in the thread, which is why it silenced the room.

  If "corruption" is defined simply as "money influencing an official," then all lobbying is corruption. If it is defined as "gifts influencing decisions," then all networking is corruption. Since we generally accept that lobbying and networking are legitimate (if regulated) parts of business, the definition must be more specific.

  The distinction that does the work is not the *money*, but the **discretion** and the **disclosure**.
  *   **Lobbying:** Attempts to change the *rule* itself. It is (ideally) transparent and public.
  *   **Networking:** Builds general goodwill. It is reciprocal but not transactional for a specific immediate act.
  *   **Bribery:** Buys a specific *exception* to the rule. It is covert and buys discretion that should not exist.

  The reason this point silenced them is that it threatens London's moral clarity. If the line is blurry, then London's hard "no" looks like cultural arrogance rather than ethical rigour. However, it also threatens Lagos's pragmatism. If the "facilitation fee" buys an exception to a rule that others must follow, it is functionally identical to bribery, regardless of whether it is called a "fee" or a "gift."

  ### 5. What Counts as Progress?
  You will not settle this by defining corruption. You will not find a distinction that cleanly separates a gift from a fee from a bribe that satisfies everyone, because the disagreement is not about definitions. It is about authority.

  **Progress looks like this:**

  1.  **Stop arguing about the word.** Acknowledge that "corruption" is doing too much work. Split the conversation into three distinct questions:
      *   **Legal:** Does this violate the UK Bribery Act or US FCPA? (This is binary. If yes, the discussion ends. London wins by default of jurisdiction).
      *   **Operational:** If we cannot pay, what is the contingency plan? (This forces Lagos to solve the problem without the fee, rather than arguing for the fee).
      *   **Cultural:** How do we navigate local expectations without breaking the law? (This gives Nairobi a role: finding compliant ways to build relationships that don't trigger legal clauses).

  2.  **Accept the Bedrock.** Admit that London and Lagos are operating in different moral universes. London is in a *compliance universe* where the primary sin is liability. Lagos is in a *survival universe* where the primary sin is failure. You cannot reconcile these; you must prioritise one. In a multinational, the legal universe usually trumps the local one, but that decision must be made explicitly by leadership, not argued out in Slack by middle management.

  3.  **The Verdict on the "Cop-out".** It is not a cop-out to say the concept is contested. It is a diagnostic tool. It tells you that you are trying to solve a political problem with a dictionary.

  ### Summary
  Your diagnosis is correct: this is a disagreement about what a moral argument is supposed to do. London wants a shield (protection from liability); Lagos wants a key (access to the market).

  The "lobbying" point proved that the shield is porous, which frightened London. The "customs" point proved that the key is locked, which frightened Lagos.

  **Progress** is not agreement. Progress is recognising that this is a **governance decision**, not an ethical debate. Someone with the authority to accept legal risk or operational delay must decide which norm prevails. Until then, you are asking philosophy to do the job of management.
