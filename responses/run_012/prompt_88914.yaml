      *   *Survival under Phi:* Almost all of it survives. Why? Because PRT is measured from *stimulus* to *action*, not *conscious awareness* to *action*. The Color Phi problem is about the dating of *qualia*, not the latency of *motor initiation*.
      *   *Instrumental Fudge:* Yes, it is largely instrumental. It's a safety margin.
      *   *Internal Tension:* Yes, there is a tension. Perception is treated as a point for calculation, but engineers know it's a distribution (hence the 95th percentile). The "point" is a statistical abstraction.
