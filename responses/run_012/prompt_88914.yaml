      *   *Resolution:* Engineering is *instrumentalist*. It doesn't care about the "hard problem" or the precise metaphysics of qualia. It cares about *behavioral output* relative to stimulus onset.
      *   *Stimulus Onset:* Crucially, engineering defines PRT relative to the *stimulus* (hazard becomes visible), not the *internal experience*.
