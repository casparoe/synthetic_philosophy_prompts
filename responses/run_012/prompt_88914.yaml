      *   *Epistemic Status:* It's normative and statistical, not metaphysical. It's based on 90th or 95th percentile performance data from empirical studies (brake reaction time tests).
      *   *Legal Use:* In reconstruction, it's used to establish *negligence*. If you reacted slower than the standard, you were negligent. If the road didn't provide enough sight distance for that standard, the road is defective.
      *   *Metaphysical Commitment:* Practically, it treats perception as a discrete onset ($t_0$). Why? Because causality in physics (kinematics) requires discrete time points for calculation ($d = vt + 0.5at^2$).

  3.  **Deconstruct the Philosophical Challenge (Color Phi/Dennett):**
