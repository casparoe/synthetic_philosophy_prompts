answer: |-
  **Q&A Prep Sheet: Decision-Theory Reading Group**

  **Concessions to Make Up Front**
  Don't wait for them to pry these out; state them in your opening remarks or immediately when the floor opens. It disarms the "you haven't thought of this" attack.
  1.  **Scope of Normativity:** Concede that evolutionary stability is not a universal account of rationality. It applies specifically to competitive trade environments where agents are subject to selection pressure. It does not claim to govern solitary reasoning or moral choice.
  2.  **The Foresight Condition:** Concede that the money pump analogy fails if agents have perfect foresight and zero transaction costs. Your claim relies on the *cost* of detecting incoherence being non-zero, which allows the "mutant" (the pump) to exploit the "resident" (the agent) before selection eliminates them.

  ***

  **Objection 1: The Normative Gap (The Kantian Ethicist)**
  *Damage Rating: Critical. If this stands, your thesis is descriptive biology, not normative philosophy.*

  **How they'll phrase it:**
  "You've built a clever bridge from biology to economics, but you've jumped the is-ought gap. Even if incoherent agents go extinct in a market, that only tells us what survives, not what they *ought* to prefer. Survival is a fact; rationality is a norm. Why should I care about being evolutionarily stable if I'm not in a competitive market? You've explained why irrationality is expensive, not why it's irrational."

  **Your Two-Minute Reply:**
  "I agree that survival isn't normativity in a vacuum. But decision theory isn't practiced in a vacuum; it's practiced by agents who want to achieve ends without undermining themselves. My claim is that the 'normative punch' of coherence arguments comes from the fact that incoherence makes you vulnerable to *anyone* who wants to exploit you. In a trade environment, 'rationality' just means 'not easily exploited.' If you reject EU, you aren't logically contradictory; you're just prey. The 'ought' comes from the hypothetical imperative: if you want to persist in your projects without being drained by others, you ought to be coherent. I'm not saying fitness is the only good, but in the specific domain of preference aggregation under competition, fitness is the proxy for success."

  **Where the reply is soft:**
  You haven't really explained why *we* should care about the trade environment as the definition of rationality. If someone says, "I'd rather be exploited than change my preferences," your model calls them extinct, but they might call themselves free. You're defining rationality as survival, which some will reject as circular.

  ***

  **Objection 2: The Formal Mapping (Formal Epistemologist #1)**
  *Damage Rating: High. If the math doesn't hold, the analogy is just a metaphor.*

  **How they'll phrase it:**
  "You're claiming EU-maximizability is equivalent to evolutionary stability. But in game theory, ESS and Nash equilibria don't always align with EU maximization, especially in repeated games or non-zero-sum contexts. There are stable strategies that violate independence axioms. Are you claiming an identity here, or just a correlation? If it's not isomorphic, your 'invasion argument' doesn't prove EU is unique."

  **Your Two-Minute Reply:**
  "I'm not claiming identity across all game structures. I'm claiming identity within the specific 'trade environment' of coherent betting markets—the same environment Dutch book arguments assume. In that specific niche, where bets are offered sequentially and payouts are immediate, non-EU preferences create arbitrage opportunities. That arbitrage is the 'mutant.' In broader ecological contexts, sure, satisficing might be stable. But the coherence arguments themselves assume a specific environment of trade. I'm just making that environment explicit. Within that narrow lane, EU is the only strategy that doesn't invite invasion."

  **Where the reply is soft:**
  You risk looking like you're moving the goalposts. If you restrict the environment too much to save the math, the audience will ask why this specific environment is the one that matters for general decision theory. You need to hold the line that this *is* the environment decision theory cares about.

  ***

  **Objection 3: The Learning Agent (Behavioral Economist)**
  *Damage Rating: Medium-High. Attacks the mechanism of your analogy.*

  **How they'll phrase it:**
  "Your model treats preferences like fixed genotypes. But humans aren't bacteria. If I see I'm being money-pumped, I don't go extinct; I update. I construct a new preference on the spot to stop the loss. Your model assumes blind replication, but agents have foresight. Where are the learning dynamics in your invasion story?"

  **Your Two-Minute Reply:**
  "Learning is exactly the selection mechanism. But learning is costly. It takes time and cognitive energy to detect a pump. In my model, the 'mutant' isn't just a trader; it's the cognitive cost of monitoring yourself. If you have to calculate EU every time to avoid a pump, that cost might outweigh the loss from the pump. So, sometimes non-EU heuristics are stable because they're cheap. But when the stakes are high enough, the selection pressure forces the agent to adopt EU-like consistency. I'm not saying people are blind; I'm saying they're budget-constrained."

  **Where the reply is soft:**
  This concedes that EU isn't always the stable strategy, only the high-stakes strategy. This weakens your claim that EU is *the* normative standard. It becomes "EU is normative when it's worth the calculation," which is a softer norm.

  ***

  **The Single Reply That Must Land**
  You must successfully define the **"Environment."**
  If you let them think you mean "biological evolution" or "general life," you lose. You must convince them that the "environment" is the *structure of choice problems itself*. The selection pressure isn't death; it's resource loss within the decision context. If you can land the idea that *the decision problem creates the selection pressure*, the analogy holds. If they think you're talking about literal survival, the Kantian will eat you.

  **The Question You Hope Nobody Asks**
  "Can you write down the replicator dynamics equation you're assuming for this trade environment?"
  *Why:* You're an ecologist, so they'll expect the math. If you haven't formalized the specific mapping between betting rounds and generation time, you'll look like you're using biology as a metaphor rather than a model. Hand-waving here undermines your credibility as the scientist in the room.

  \answer{Formal Equivalence Objection}
