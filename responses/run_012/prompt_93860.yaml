          *   *Residue:* The value of sincerity.

  4.  **Developing the Residue Report:**
      *   What survives? Incentive alignment, Goodhart's Law, Substitution effects, Network externalities.
      *   What doesn't? Normative preferences (wants vs. shoulds), Collective agency (the "People"), Ontology of the self (display degrades being).
