  ***

  **Note on liberties taken:**
  This joke leans heavily on a contested reading of the Simulation Argument's implications for decision theory. Specifically, it assumes (1) that the Simulators are consequentialists who allocate compute based on the perceived moral value of the simulation, and (2) that our behavior within the sim can causally influence resource allocation in base reality. Most formulations of the trilemma treat the simulation as a closed causal box where our actions don't affect the Simulators' budget decisions. It also glosses over the distinction between "ancestor simulations" (which might have a set endpoint) and open-ended physics simulations. Basically, it treats the Simulators like cloud providers who offer auto-scaling based on traffic, which is... optimistic.
