answer: |-
  This is a remarkably precise moral intuition, and you are right to reject the standard labels. "Vicarious anger" is too passive; "standing to blame" is too legalistic. Your experience describes a specific functional role that your anger plays in relation to the victim, not the offender.

  Here is the carving of the phenomenon, the mechanism of the "switch," and a proposed name for it.

  ### The Carving: Validatory vs. Retributive Indignation

  To understand why the victim's forgiveness dissolves your anger while the offender's excuses do not, we must distinguish between two types of moral anger.

  1.  **Retributive Indignation:** This is anger at the *violation of a rule*. The focus is on the offender and the moral order. If this were your mode, the offender's mitigation (stress, ignorance) would matter, because it affects their culpability. The victim's feelings would be secondary; a crime is a crime even if the victim forgives.
  2.  **Validatory Indignation:** This is anger at the *violation of a person*. The focus is on the victim's worth and dignity. The anger functions as a proxy signal saying, *"You matter enough that this treatment is unacceptable."*

  You are experiencing **Validatory Indignation**.

  This explains why the offender's excuses fail. When someone says, "He didn't mean it," they are asking you to adjust your judgment of the *offender*. But your anger isn't about the offender's character; it's about the victim's status. You don't care if the person who stabbed them was stressed; you care that the victim was stabbed.

  ### The Switch: Why Forgiveness Discharges You

  You asked what the victim's release is doing to your attitude. It is rendering it **functionally obsolete** and potentially **intrusive**.

  Your anger is acting as a **placeholder for the victim's unexpressed grievance**. In a healthy moral ecosystem, the person who was harmed is the primary agent of response. When they are silent, shocked, or powerless, you step in to hold the space for the gravity of the harm. You are effectively saying, "Since you cannot fight this, I will hold the weight of this wrong for you."

  When the victim says, "I've let it go," they are reclaiming their agency. They are signaling: *"I am no longer defined by this harm. I have processed this. I am whole."*

  If you continue to be angry after that point, your anger ceases to be protective and becomes **paternalistic**. It implies that you know the cost of the harm better than they do, or that you believe they *should* still be hurt. Their forgiveness tells you that the wound is closed. To keep picking at it is to disrespect their recovery. The "switch" turns off because the *function* of the anger (defending the victim's dignity) has been successfully completed by the victim themselves.

  ### The Permanent Anger: Orphaned Grievances

  This explains the flip side: when the victim is dead, a child, or unaware.

  In these cases, the grievance is **orphaned**. There is no primary agent to close the loop. Because your anger is Validatory (focused on the person), and the person cannot validate their own recovery, the validation can never be completed.

  You become the **involuntary custodian** of the harm. Since no one can say "I am okay," you cannot stand down. The anger feels permanent because, in a very real sense, the harm *is* permanent in the absence of a living witness to resolve it. You are left holding a bag that no one is coming to claim.

  ### The Edge Cases

  You asked about the boundaries. Based on this carving, here is how the mechanism should theoretically respond:

  *   **Coerced Forgiveness:** If the victim says "I forgive" out of fear or pressure, the switch should **not** work. If you perceive the forgiveness as inauthentic, you recognize that the victim's agency is still compromised. Your anger should remain because the *harm* (the coercion) is ongoing. If your anger *does* dissolve here, it suggests you are prioritizing "peace" over the victim's actual state.
  *   **Misguided/Self-Abnegating Forgiveness:** If the victim forgives too easily (e.g., "It's fine, I deserved it"), your anger might actually **intensify**. This is a crucial test. If your anger is truly about their dignity, their lack of self-respect is a secondary injury. You aren't angry at the offender anymore; you are angrily protective of the victim against themselves. The switch doesn't flip; it jams.
  *   **Victim Wants Revenge, You Forgive:** The reverse does not work. You cannot flip their switch. This confirms the asymmetry. They hold the veto on your anger; you do not hold the veto on theirs. This is because they own the harm; you are merely witnessing it.

  ### The Label: Custodial Indignation

  There isn't a single established psychological term for this specific dynamic, though it touches on *empathic distress* and *moral stewardship*.

  I propose calling this **Custodial Indignation**.

  **Definition:** A form of third-party anger where the observer holds the grievance in trust for the victim. The anger is not borrowed from the victim, nor is it an abstract demand for justice. It is a **stewardship of the wound**.

  **Why this fits:**
  1.  **Custody implies temporary holding:** You hold the anger *until* the owner (the victim) claims it or disposes of it.
  2.  **It explains the discharge:** When the victim forgives, they are reclaiming their property (the experience). Once they have it, you no longer need to hold it.
  3.  **It explains the permanence:** If the owner is gone (death/child), the property is unclaimed. The custodian must hold it indefinitely.
  4.  **It distinguishes from "Standing":** Standing is about *rights* (do I have permission to speak?). Custody is about *responsibility* (am I keeping this safe?). You feel you have a responsibility to witness the harm until the victim indicates witnessing is no longer required.

  ### Summary
  You are not borrowing their anger; you are **guarding their grievance**.

  The offender's excuses don't matter because they don't heal the victim. The victim's forgiveness matters because it heals the victim, making your guard duty unnecessary. When the victim cannot speak, you are left on permanent watch. This is not a bug in your moral software; it is a highly refined form of solidarity that prioritizes the victim's agency over abstract justice.
