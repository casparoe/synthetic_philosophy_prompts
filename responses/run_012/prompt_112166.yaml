  1. A subject trained in micro-phenomenology performs a simple visual onset detection task using a screen, a button, and a timer. While their reaction times are consistent, they voluntarily report that the flash is never experienced as an instantaneous point but always as a "temporal bloom" that widens over 200ms, a feature never mentioned in instructions. Their button presses align precisely with the reported apex of this bloom rather than the physical onset, and this alignment holds across varied luminosities and colors without error.

  2. The heterophenomenologist records that the subject believes the flash possesses a 200ms widening structure and acts on that belief, which the subject accepts as accurate regarding their beliefs and behavior. The subject rejects only the account's silence on whether the bloom exists as an experience, objecting that the method implies the belief could exist without the phenomenological structure that constitutes it.

  3. This rival method treats the "temporal bloom" as a real structural feature of consciousness that causally determines the reaction time, not merely as a belief state. It cannot be waved away because the stability and specificity of the report across varying physical stimuli suggest a stable phenomenological object rather than a mutable propositional attitude.

  4. The feature is the causal efficacy of the reported structure on behavior despite its absence in the physical stimulus. The conflict does not survive taking this feature out, as without it the case collapses into a standard science of belief where heterophenomenology faces no challenge.

  5. A defender argues this is the method working as intended because science can only measure the belief-state that causes the button press, not the experience itself. This defence costs them the claim to be doing a science of consciousness, admitting they are doing a science of belief about consciousness.
