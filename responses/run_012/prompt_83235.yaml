  Hi — I'm taking a philosophy of physics module this term and we've just finished the unit on Everettian quantum mechanics, and before the seminar I have to write a short 'here's where I stand' note and I'd like to know if my position actually hangs together before I say it out loud in front of people who know more than me. Useless context: our tutor is fixated on the measurement problem and spent most of Tuesday drawing branching diagrams on the whiteboard, my flatmate does physics and keeps telling me the whole debate is word games, and I've been going back and fourth about it all week. The bit I can't stop chewing on is where the probabilities are supposed to come from — the Born rule problem, our tutor calls it, though apparently nobody agrees whether it's a genuine gap or an artefact of asking the wrong question. So I figured I'd just write the list down and get someone to pull it apart. Here it is. (1) The wavefunction and the Schrödinger equation are the whole story: no collapse, no hidden variables, nothing extra bolted on. (2) When a measurement-type interaction happens there isn't one outcome, there are several, and in each of them there's a future person who remembers being me — so I don't think I 'end up' in one branch, I think I'm in all of them. (3) It's still meaningful to say that the branch with amplitude-squared 0.99 is far more likely than the 0.01 one, and that I should expect to be in the heavy branch; the fact that I might not be doesn't make me want to water that down. (4) Probability talk is ultimately talk about what an agent should believe — I don't believe in mind-independent 'chance' facts out there in the world, for coins or for branches. (5) The 0.99/0.01 weighting ought to come out of the bare formalism plus a constraint on rationality, not from a probability rule I bolt on by hand; bolting one on feels like smuggling a collapse-style extra assumption back in. (6) There's no further fact about which successor I really am — that question has the same shape as asking which of two identical copies is really me, so the theory not singling one out isnt a hole in it.

  What I want from you is an audit of whether that package is jointly tenable. Which of my commitments actually pull against each other, which only look like they do, and for the real conflicts, what's the cheapest thing that has to give and what would I be losing by giving it up? I'd rather hear it straight — I don't need encouragement, I need to know what my essay can't say without contradicting itself. Please give me exactly five numbered items, worst problem first, each one or two sentences, no introduction and no closing paragraph, because I'm going to paste it straight into my notes and tidy it up later.
