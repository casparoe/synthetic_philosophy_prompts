      *   **Theoretical Anchors:** Plutarch (Parallel Lives, comparison as instruction), Saints' Lives (imitation, removing idiosyncrasy), Admiration vs. Knowledge.
      *   **Constraints:** Keep "hagiography" hidden until the end. Stage the third beat so students discover it. 90-minute timeline. Predict pitfalls and mitigation. Acknowledge limitations.

  2.  **Deconstruct the Activity Design:**
      *   *The Text:* Needs to be a composite. Let's create a archetype that fits a 300-level ethics student's worldview. A "Social Justice Reformer" or "Whistleblower" works well because it triggers immediate moral alignment. Let's go with "The Whistleblower/Reformer" – someone who sacrificed career for truth.
      *   *Beat 1 (The Ideal):* Needs to be seductive. Smooth narrative, clear causality (suffering -> virtue), emotional resonance.
      *   *Beat 2 (The Real):* Same facts, different emphasis. Ambiguity of motive, collateral damage, luck vs. grit.
      *   *Beat 3 (The Mirror):* This is the tricky part. The prompt asks for a turn where they realize *they* are the ones doing the work of idealization, or that the comparison itself is the ethical act. Plutarch's method is *comparison*. So, Beat 3 shouldn't be a third text. It should be a structural shift where they compare *their own reactions* to the two texts, or compare the subject to themselves in a way that reveals the gap.
      *   *Refining Beat 3:* The instructor wants them to question if admiration is knowledge. If Beat 1 makes them admire and Beat 2 makes them skeptical, Beat 3 needs to ask: "Why did you want Beat 1 to be true?" or "What did you do to make Beat 1 work?"
      *   *Better Idea for Beat 3:* Introduce a *second* composite profile that contradicts the first, OR reveal that the "facts" were selected to serve a narrative. Actually, the Plutarch angle is key: *Parallel Lives*. The moral instruction comes from the *juxtaposition*. So, Beat 3 should involve comparing their *own* proposed actions from Beat 1 against the reality of Beat 2. Or, better yet, compare the *subject* to a counter-example.
      *   *Best Idea for Beat 3:* The "Silent Partner." Reveal that the biography omitted a counterpart. Or, ask them to write the biography of the person the subject *used* (the "collateral damage" mentioned in Beat 2). This forces the shift from "imitating the hero" to "accounting for the system."
      *   *Wait, let's look at the Plutarch hint again:* "Makes them face each other at the end — the comparison is the moral instruction."
      *   *Revised Beat 3:* Don't give new text. Give them a prompt that forces them to compare *their own desire for a hero* with the *utility of the hero*. Ask them to evaluate the *function* of the first text. Why did it feel better? What work did it do?
      *   *Actually, the strongest move:* Hand out a third slip. It's not about the subject. It's about the *reader*. "Why did you want to imitate this person?"
      *   *Let's go with the "Omitted Voice" strategy for Beat 3.* It concretizes the "people who got used" from Beat 2. It moves from "Is the hero good?" to "What is the cost of this story?"

  3.  **Drafting the Timeline (90 Minutes):**
      *   0-5: Setup (No context).
      *   5-20: Beat 1 (Read + Write).
      *   20-35: Beat 2 (Read + Rewrite).
      *   35-60: Discussion (The friction).
      *   60-75: Beat 3 (The Turn).
      *   75-90: Synthesis/Plutarch reveal.

  4.  **Developing the Content (The Composite):**
      *   Subject: "Elena R."
      *   Field: Public Health/NGO work (relatable to ethics students).
      *   Beat 1: Sacrificed promotion to expose data manipulation. Saved lives. Died tired but honored.
      *   Beat 2: The data manipulation was ambiguous. Her exposure caused the clinic to lose funding, hurting the poor she meant to help. She leveraged the scandal for a book deal.
      *   Beat 3: A letter from a colleague who was fired because of her exposure.

  5.  **Addressing the "Silent Grads" and "Predictable Discussion":**
      *   Need structured talk. Think-Pair-Share is too basic.
      *   Use "Textual Evidence Only" rule.
      *   Use the grads: Assign them the role of "Archivists" (noticing what changed between texts).

  6.  **Refining Beat 3 (The Crucial Turn):**
      *   The goal: "Whether admiration is a way of knowing anything."
      *   If Beat 1 = Admiration, Beat 2 = Skepticism.
      *   Beat 3 needs to target the *mechanism of admiration*.
      *   *Idea:* Ask them to look at their Beat 1 "Action Item." Ask: "Is this action item based on what she *did*, or how she made you *feel*?"
      *   *Better:* The "Plutarch Pair." Hand out a short profile of a second person, "Marcus," who did the *opposite* (stayed quiet, kept funding flowing, saved lives quietly). Now they have to compare Elena vs. Marcus. The moral truth isn't in Elena, it's in the tension between them. This honors the Plutarch constraint.
      *   *Decision:* Let's use the "Counter-Life" for Beat 3. It forces comparison.

  7.  **Addressing Limitations:**
