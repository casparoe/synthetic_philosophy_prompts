answer: |-
  This is a sharp pedagogical problem. You're fighting the "consumption model" of ethics, where students treat moral agents like products to be reviewed rather than problems to be inhabited. Your instinct to use the *structure* of the session to mimic the *structure* of the problem is correct. If you want them to feel the friction of biography, they have to become the biographers.

  Here is the build. It relies on complicity. By the end, they shouldn't just be critiquing the text; they should be uneasy about their own desire for the first version.

  ### The Materials

  You need three slips of paper. Do not staple them. Do not put them in a packet. Hand them out sequentially. This prevents flipping ahead and ruins the "reveal."

  **The Subject:** "Elena V." A mid-level administrator in a global health NGO. This is specific enough to be real, vague enough to be universal. Avoid "famous" figures; fame triggers pre-existing scripts.

  **Handout 1: The Tribute (1 page)**
  *   **Style:** Eulogy. Smooth causality. Suffering is redemptive.
  *   **Content:** Elena noticed data irregularities in a vaccine rollout. She was pressured to stay quiet. She leaked the data. The program was halted. She was fired. Years later, the data was vindicated; a new, safer protocol was adopted. She died recently, modestly, honored by her peers.
  *   **Key Phrase:** "She chose truth over comfort."

  **Handout 2: The Archive (1 page)**
  *   **Style:** Internal memo/annotated timeline. Disjointed. Motives are mixed.
  *   **Content:** Same events. But: The data irregularities were statistically ambiguous (she knew this). The leak caused the funding to be pulled *immediately*, leaving 5,000 people without the current (imperfect but working) vaccine for 18 months. Estimated excess mortality: 200. She leveraged the scandal to publish a memoir. She did not speak to the regional directors before leaking.
  *   **Key Phrase:** "The decision was irreversible."

  **Handout 3: The Editor's Cut (Half page)**
  *   **Style:** Instructional prompt.
  *   **Content:** "You are writing the introduction for a 'Leadership Ethics' textbook. You have 150 words to summarize Elena's life as a lesson for future leaders. You must use Handout 1's *tone* but you cannot lie about Handout 2's *facts*. Write the summary."

  ---

  ### The Timeline (90 Minutes)

  **0:00 – 0:05: The Setup**
  *   **Say:** "We are going to talk about how we learn from lives. I'm not going to lecture. I'm going to ask you to do some work. Please put away phones. No searching for names; this person doesn't exist."
  *   **Do:** Hand out **Handout 1**.
  *   **Refuse:** Do not explain *why* you are doing this. Do not mention ethics yet.

  **0:05 – 0:20: Beat One (The Saint)**
  *   **Task:** Read silently (5 mins). Write one sentence: "The lesson of this life is..." and one action: "Tomorrow I will..." (5 mins).
  *   **Discussion:** Go around the room. Rapid fire. Just the sentences.
  *   **Instructor Move:** Write their verbs on the board. (e.g., *Speak, Sacrifice, Endure*).
  *   **Silence the Grads:** If a grad student tries to contextualize ("Well, in the literature..."), gently interrupt: "Hold that. Stay with the text."

  **0:20 – 0:35: Beat Two (The Human)**
  *   **Do:** Collect Handout 1. (This is crucial. It removes the safety net). Hand out **Handout 2**.
  *   **Say:** "Same person. Same events. Different file."
  *   **Task:** Read silently (5 mins). Rewrite your lesson sentence. You cannot use the same verbs you used before. (5 mins).
  *   **Discussion:** Ask: "What changed?"
  *   **Predictable Response:** "She's not a hero," or "It's complicated."
  *   **Your Push:** "Don't tell me she's complicated. Tell me what *you* did to the first text to make it work. What did you ignore in Handout 1 that was actually there?"

  **0:35 – 0:60: The Friction (Seminar Discussion)**
  *   This is where the usual stalemate happens. They will argue whether she was "good" or "bad."
  *   **Intervention:** Stop the verdict.
  *   **Say:** "You are trying to judge her. I want you to judge the *gap* between Handout 1 and Handout 2. Handout 1 made you feel something. Handout 2 made you think something. Which one taught you how to live? Be careful. If you say Handout 2, why did you feel inspired by Handout 1? If you say Handout 1, are you comfortable ignoring the 200 deaths?"
  *   **Grad Student Role:** Now you can invite the grads in. "You two have read more biographies than the juniors. When you read Handout 1, did you believe it? Or did you just recognize the genre?"

  **0:60 – 0:75: Beat Three (The Complicity)**
  *   **Do:** Hand out **Handout 3**.
  *   **Say:** "You are the biographer now. You have to make this useful for a student. Write the 150-word summary."
  *   **Task:** 10 minutes writing. 5 minutes sharing.
  *   **The Turn:** When they read their summaries, they will inevitably smooth over the 200 deaths to make the lesson "clean."
  *   **Say:** "Look at what you just cut. To make her life *teachable*, you had to remove the cost. Plutarch paired Greeks and Romans so you couldn't just imitate one; you had to weigh them. Saints' lives removed the cost so you could imitate them without hesitation. You just wrote a Saint's Life. You just burned the 200 people to make a lesson."

  **0:75 – 0:90: The Reveal & Close**
  *   **Say:** "The word for Handout 1 is *hagiography*. It's not a dirty word; it's a functional one. It creates models. The problem isn't that Handout 1 is a lie. The problem is that admiration feels like knowledge. It isn't. Admiration is a feeling that a well-built story produces. Knowledge is what happens when you hold Handout 1 and Handout 2 in your head at the same time without dropping one."
  *   **Exit Question:** "For next week: Don't tell me what you learned from the reading. Tell me what you had to ignore to learn it."

  ---

  ### What Predictably Goes Wrong (And Fixes)

  **1. The Cynical Pivot**
  *   **The Problem:** A student says, "So biography is useless. We can't know anything." They retreat into relativism.
  *   **The Fix:** "Biography isn't useless. But it's not a map; it's a mirror. If Handout 1 made you want to be a whistleblower, that tells me about *you*, not Elena. The ethics is in checking why you want that."

  **2. The "Well, Actually" Fact-Check**
  *   **The Problem:** Someone fixates on the composite nature. "But if she's fake, does it matter?"
  *   **The Fix:** "She is composite. The *feeling* you had reading Handout 1 was real. The *hesitation* you felt reading Handout 2 was real. That's the data I care about."

  **3. The Silent Grads**
  *   **The Problem:** They sit in the back, arms crossed, signaling superiority.
  *   **The Fix:** In Beat 3 (The Editor), assign them the role of "Copy Chief." Their job isn't to write the summary, it's to approve the juniors' summaries. "Does this summary betray the facts in Handout 2? Yes or No." This gives them authority without letting them monologue.

  **4. Running Long**
  *   **The Problem:** Beat 2 discussion eats the time.
  *   **The Fix:** Hard stop at minute 60. Even if hands are raised. Say: "We are leaving this unresolved. That discomfort is the syllabus." If you resolve it, you ruin Beat 3.

  ---

  ### What This Activity Cannot Do (Your Burden)

  You need to be honest about the limits of this design so you don't blame the activity when the room goes quiet.

  1.  **It Cannot Reproduce Time:** Biography works over a lifetime; this seminar works in 90 minutes. The "lesson" they feel in Beat 1 is cheap because it cost them nothing. You have to verbally underscore that *real* imitation takes decades, not a writing prompt.
  2.  **It Cannot Fix Narcissism:** Students often read biography to find themselves, not to encounter the Other. If they say, "I would have done the same," the activity hasn't landed. You have to challenge that: "You don't know that. You're reading a script."
  3.  **The "Turn" Relies on Your Restraint:** The success of Beat 3 depends entirely on you *not* saving them. When they realize they sanitized the truth in their Editor summary, they will look to you for absolution ("It's okay, it's just an exercise"). You must refuse. "It is just an exercise. That's why it was easy. Imagine doing this for a living."

  ### Why This Works for Plutarch & The Saints
  You mentioned Plutarch's comparisons and the Saints' imitation.
  *   **Beat 1** is the Saints' Life (Imitation requires perfection).
  *   **Beat 2** is the Archive (History requires truth).
  *   **Beat 3** is the Plutarchian Move (Ethics requires *comparison*). By forcing them to edit the truth into a lesson, they enact the violence of the genre. They become Plutarch. They see that the "moral instruction" is a construction, not a discovery.

  If you pull this off, they won't leave asking "Was Elena good?" They'll leave asking "Why do I need her to be?" That is the ethical question.
