prompt: |-
  I'm teaching a medieval philosophy of religion unit for the first time next term and I'm in way over my head — my area is metaethics, I haven't touched this stuff seriously since grad school. A colleague in the history dept sent me a paragraph he uses in his own lectures on Al-Ghazali and causation, and I'd like to use something like it, but I don't want to stand up in front of forty students and say things a specialist would flinch at. Here's what he sent:

  "Al-Ghazali's occasionalism is basically the view that there are no real causal powers in nature. Fire doesn't burn cotton — God directly creates the burning each time. The label comes from the idea that natural events only line up occasionally in the patterns we expect, so what we call a law of nature is really just chance, and that's why he thinks we can never actually know what's going to happen next. His target was the philosophers' claim that the world runs on its own steam, by necessity; he wanted to leave room for miracles, so his move is to say God is the only real cause and can therefore interrupt the order of nature whenever he likes — and since no cause really constrains any effect, God could in principle do literally anything, contradiction or no. People call him the Hume of Islam because, like Hume, he points out that all we ever observe is one thing following another and never a necessary connection. And the upshot, which I think most historians would now sign off on, is that by pulling the rug out from under natural causality he pulled it out from under any science of nature too, which is a big part of why the Islamic golden age of science wound down."

  Can you take this clause by clause and tell me what a specialist on Ghazali would nod along to, what they'd wince at, and whats just wrong? A couple of things I half-remember — that he was actually fine with science, and that the 'occasionalism' label is itself contested — but I might be making those up, so tell me if I am. I also want to know whether the moral he draws at the end (occasionalism killed Islamic science) actually follows from anything true in the paragraph, or whether it's a separate empirical claim that's just been bolted on. And what's the one thing he leaves out that a specialist would say is the whole point? Don't worry about citations, I'll fill those in myself — I just need to know what's safe to say out loud.
