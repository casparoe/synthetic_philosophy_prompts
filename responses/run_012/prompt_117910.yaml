  Based on Maya's track record, here is the reverse-engineering of her decision rules, the prediction for Dev, and the test case that would finally tell you which logic she's actually using.

  ### The Verdict
  **Maya will say Dev is not being rational.**

  She will likely tell you: *"Dev is being a good citizen, and maybe he's being moral, but he's not being rational. He's doing a moral math problem and calling it an instrumental one."*

  ### The Two Rules That Fit Her Record
  There are two distinct frameworks that explain every single data point you provided. They agree on Dev, but for different reasons.

  **Rule 1: The "Causal Expected Value" Rule (The Econ Standard)**
  *   **The Logic:** An action is rational only if the Probability of Impact $\times$ Value of Impact exceeds the Cost of Action ($P \times V > C$). This applies to both selfish goals (warranties) and altruistic goals (charity).
  *   **How it fits the record:**
      *   **Charity:** $P$ is 1/200. $V$ is a life. $C$ is $200. **Rational.**
      *   **Safe State Voting:** $P$ is 1/10,000,000. $V$ is policy change. $C$ is time. **Irrational.** (She admits her own voting is a "vice," i.e., consumption, not investment).
      *   **Group Project:** Marginal impact on grade is 0 (grade is secured). $P \times V = 0$. **Irrational** to work. (She classifies the *choice* to work as moral, implying the *rational* choice is to free-ride).
  *   **Prediction for Dev:** **Irrational.** Dev admits $P \approx 0$. Therefore $P \times V < C$. The motivation (duty) is irrelevant to the math.

  **Rule 2: The "Domain Separation" Rule (The Philosophical Split)**
  *   **The Logic:** "Rationality" is a label reserved strictly for instrumental/market decisions (maximizing efficiency). Actions taken out of duty, norm-following, or social obligation belong to a separate domain called "Morality." An act cannot be both "Moral" and "Rational" if the instrumental value is negligible.
  *   **How it fits the record:**
      *   **Group Project:** She explicitly says working is *"not a rationality thing at all, that's about not being a leech."* This draws a hard line between the domains.
      *   **Safe State Voting:** She calls it a "vice." She separates the *enjoyment* (consumption) from the *rationale* (investment).
      *   **Charity:** She calls this rational because it is framed as an *investment* in saving lives (efficiency), not just a duty to give.
  *   **Prediction for Dev:** **Not Rational.** Dev's motivation is explicitly "not wanting to be a freeloader" (Duty/Morality). By her Group Project precedent, this places the act in the Moral domain, automatically excluding it from the Rational domain.

  ### Why Dev's Case Doesn't Settle Anything
  You shouldn't act like Dev's case proves which rule she uses, because **both rules predict the same outcome.**

  *   **Rule 1 says No** because the *math* fails (odds are too low).
  *   **Rule 2 says No** because the *category* is wrong (it's duty, not efficiency).

  Maya's response will sound the same either way: *"It's a nice thing to do, but don't call it rational."* To find out which rule is actually driving her brain, you need a case where the Math works but the Duty doesn't, or vice versa.

  ### The Splitter Case
  To distinguish between **Causal Expected Value (Rule 1)** and **Domain Separation (Rule 2)**, propose this scenario:

  **The "Selfish Effective" Case:**
  > "Imagine Dev finds a charity that gives him a tax break worth $250 for a $200 donation. The charity does absolutely nothing useful (0% chance of saving lives), but Dev nets $50 profit. He does it purely for the money."

  *   **If Maya says this is Rational:** She is using **Rule 1 (Causal EV)**. She cares about the efficiency of the outcome (positive return), regardless of whether it's moral or altruistic.
  *   **If Maya says this is Irrational (or 'Smart but not Rational'):** She is using **Rule 2 (Domain Separation)**. She likely reserves the word "Rational" for *socially useful* efficiency (like the bed nets) and views pure profit-seeking as "Prudential" or "Selfish," distinct from the "Rationality" she praises in the charity case.

  **The "Duty with Odds" Case (Alternative Splitter):**
  > "Imagine a school board race decided by 10 votes. Dev votes solely because he feels a duty, not because he thinks he'll change the outcome."

  *   **If Maya says Rational:** She follows **Rule 1**. The odds are high enough ($P$ is large) that the math works, regardless of his moral motivation.
  *   **If Maya says Not Rational:** She follows **Rule 2**. Even if the math works, if his *stated reason* is duty, she might categorize it as moral behavior that happens to align with rationality, rather than rationality itself. (Though based on her School Board track record, she'd likely call this Rational, which would weaken Rule 2).

  ### Best Guess
  Maya is a data scientist with an Econ masters. She almost certainly runs **Rule 1 (Causal Expected Value)**.

  The Group Project comment is the tell: *"She says no, thats not a rationality thing at all."* In Econ 101, free-riding *is* the rational choice in a public goods game. By acknowledging that working is "not rational," she is admitting that **Rationality = Individual Instrumental Gain** (or Altruistic Gain with high P), while **Morality = Sacrificing Gain for Norms.**

  Dev is sacrificing time (Cost) for a Norm (Duty) with no Instrumental Gain (Impact). Therefore, he is being **Moral**, and by her definition, **Not Rational.**

  **What to tell her:**
  "Dev isn't trying to be rational. He's trying to not be a leech. You already told me that's a moral thing, not a rationality thing. So why are we debating if it's rational? You agree he's being a good citizen, you just won't give him the 'Rational' sticker."
