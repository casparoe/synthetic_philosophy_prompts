  # The Pleasure-Pain Taxonomy Tree

  **Instructions:** Start at the top. Answer the question that best fits your intuition, follow the arrow, and keep going until you hit a boxed position. Read the "Awkward Commitment" to see if you can stomach the consequences.

  ### **Q1: Are pleasure and pain the same kind of "currency"?**
  *Imagine you have a ledger. Can you write pleasure in pen and pain in pencil on the same page, or are they like writing in English vs. Mandarin?*

  *   **[A] They are fundamentally different categories.** → Go to **Q2**.
  *   **[B] They are the same currency (positive and negative).** → Go to **Q3**.
  *   **[C] They are the same, but the exchange rate is vague or fuzzy.** → **POSITION: Parity & Vagueness**
      *   *Awkward Commitment:* You have to admit that sometimes there is simply no true answer to whether a life is worth living, even in principle.
      *   *(Note: This is functionally hard to distinguish from the Measurement Skeptic below for practical decisions.)*

  ---

  ### **Q2: (If different categories) Is it because they are incomparable, or because only pain matters?**
  *   **[A] They are incomparable (like apples and oranges).** → **POSITION: Hard Incommensurability**
      *   *Awkward Commitment:* You cannot say a life of pure bliss is better than a life of pure agony; they are just different.
  *   **[B] Only pain matters (pleasure is just the absence of pain).** → **POSITION: Pure Negative Utilitarianism**
      *   *Awkward Commitment:* You must prefer a world where no one exists over a world where everyone is mildly happy.

  ---

  ### **Q3: (If same currency) Can enough mild pleasure ever cancel out extreme torture?**
  *   **[A] No, never.** → Go to **Q4**.
  *   **[B] Yes, eventually.** → Go to **Q5**.
  *   **[C] They are the same currency, but we can't measure precisely enough to know.** → **POSITION: Measurement Skeptic**
      *   *Awkward Commitment:* You must act as if they might be incomparable, even though you believe they aren't.
      *   *(Note: For decision-making, this leaf behaves almost identically to Hard Incommensurability.)*

  ---

  ### **Q4: (If pleasure can't cancel torture) Is this rule for one person's life, or for the whole world?**
  *   **[A] Just for one life (we can trade across different people).** → **POSITION: Intrapersonal Asymmetry**
      *   *Awkward Commitment:* You must accept sacrificing one person's sanity to save a billion others from headaches, while forbidding that trade within a single life.
  *   **[B] For the whole world (torture trumps everything, always).** → **POSITION: Lexical Ceiling**
      *   *Awkward Commitment:* You must let a billion people suffer migraines rather than inflict one minute of agony on an innocent person.

  ---

  ### **Q5: (If pleasure can cancel pain) Is the exchange rate constant?**
  *   **[A] Yes, always the same rate.** → Go to **Q6**.
  *   **[B] No, the rate changes at extremes (thresholds).** → Go to **Q7**.

  ---

  ### **Q6: (If constant rate) Is the rate 1-to-1?**
  *   **[A] Yes, 1 unit of pain = 1 unit of pleasure.** → **POSITION: Benthamite Hedonism**
      *   *Awkward Commitment:* You must believe a stubbed toe is exactly cancelled by a sip of beer, and torture is just "more stubbed toes."
  *   **[B] No, pain counts for more (e.g., 1 pain = 5 pleasure).** → **POSITION: Finite Negative Weighting**
      *   *Awkward Commitment:* You have to pick a specific number (like 5x or 10x) and defend why it isn't one unit higher or lower.

  ---

  ### **Q7: (If rate changes) Where does the math break down?**
  *   **[A] Tiny pains don't count (Floor), but extreme pains can be cancelled.** → **POSITION: Threshold Floor**
      *   *Awkward Commitment:* You must accept that adding a million dust specks in your eye never adds up to the pain of a punch.
  *   **[B] Extreme pains can't be cancelled (Ceiling), but tiny pains count.** → **POSITION: Ceiling Only**
      *   *Awkward Commitment:* You must count a lifetime of paper cuts against a happy life, but refuse to count a year of torture against any amount of bliss.
  *   **[C] Both (Tiny pains ignored, extreme pains uncancellable).** → **POSITION: Double Threshold**
      *   *Awkward Commitment:* You have to defend two arbitrary lines: one where pain starts mattering, and one where it stops being tradable.
  *   **[D] Pleasure stops adding up, but pain doesn't (Satiation).** → **POSITION: Satiation View**
      *   *Awkward Commitment:* You must believe that after a certain point, more happiness adds zero value, but more misery always adds negative value.
  *   **[E] The ceiling rises if there's enough pleasure at stake (Sliding).** → **POSITION: Contextual Threshold**
      *   *Awkward Commitment:* You have to accept that torture is sometimes permissible if the universe is happy enough elsewhere.

  ---

  ### **Hanging Branch: The "Positive Utilitarian" Route**
  *If you answered Q3 [Yes] and Q5 [No], but claimed only the Floor exists (Pain is just noise).*
  *   **STATUS: Empty Branch (Unattractive)**
      *   *Reason:* This implies pain has no disvalue, only lack of pleasure does. Most people who hold this simply revert to Benthamite Hedonism or Satiation View; claiming pain is "noise" while admitting it feels bad is psychologically incoherent for most.

  ---

  ### **Summary of Leaves (1-13)**
  1.  Parity & Vagueness
  2.  Hard Incommensurability
  3.  Pure Negative Utilitarianism
  4.  Measurement Skeptic
  5.  Intrapersonal Asymmetry
  6.  Lexical Ceiling
  7.  Benthamite Hedonism
  8.  Finite Negative Weighting
  9.  Threshold Floor
  10. Ceiling Only
  11. Double Threshold
  12. Satiation View
  13. Contextual Threshold
