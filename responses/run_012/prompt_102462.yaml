      *   *Why:* If you skip 1 & 2, "Shape" is just "Shape," and the answer is trivially "Yes."

      *Refining the Example:* The V-shape vs. U-shape is good. Let's make sure the constraints are clear. No thickness, no color, no shadow. Just "line in space."
