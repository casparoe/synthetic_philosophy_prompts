      *   *The Trap:* If you ask "Can he recognize it?" immediately, students treat "recognition" as a brute fact.
      *   *The Fix:* We need to establish *what* is being recognized. Is it the *idea* of the shape? Is it the *sensation* of the shape?
      *   *Sequence:*
          1.  **Phenomenology of Touch:** What does the blind person actually have? (Not just "shape," but a specific *mode* of access).
          2.  **Phenomenology of Vision:** What does the newly sighted person actually get? (Not "objects," but patches of color/light).
          3.  **The Gap:** Why isn't the transfer automatic? (Heterogeneity of senses).
          4.  **The Question:** Now ask the Molyneux question.
      *   *Why this order?* If you don't establish the *qualitative difference* between tactile extension and visual extension, the question seems trivial ("Of course it's a cube, it's the same object!"). You must make the *identity of the object* across senses the problem, not the starting point.

