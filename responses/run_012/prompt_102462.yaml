          *   *Let's try:* **A Straight Rod vs. A Bent Rod (V-shape).**
          *   *Touch:* Continuous straight line vs. Discontinuous angle.
          *   *Vision:* Straight line vs. Two lines meeting.
          *   *Why:* It isolates "continuity" and "angle."
          *   *Constraints:* Uniform color, no shadows, no thickness.
          *   *Let's go with the **V-Shape vs. U-Shape**.**
          *   *Touch:* Sharp point vs. Smooth turn.
          *   *Vision:* Vertex vs. Arc.
          *   *Why:* It highlights the qualitative difference between "sharpness" in touch (pressure point) and "sharpness" in vision (contrast boundary).

  4.  **Misconceptions & Timing:**
      *   *Empirical Trap:* "Let's just ask a blind person." (Head off early, frame as conceptual).
      *   *The "Naming" Trap:* "He knows the word 'cube'." (Distinguish concept from sensation).
      *   *The "Locke vs. Molyneux" Trap:* They think they agree. (Locke says No, Molyneux implies No but asks).
      *   *The "Innate Ideas" Trap:* "It's just Rationalism vs. Empiricism." (It's deeper: it's about sense modality integration).
