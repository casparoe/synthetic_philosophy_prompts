          *   *Touch:* Dome vs. Flat.
          *   *Vision:* Circle vs. Circle.
          *   *Problem:* Vision *should* see the depth.
          *   *Let's stick to the core philosophical issue:* **Heterogeneity of Ideas.**
          *   *Chosen Example:* **A Wire Triangle vs. A Wire Circle.**
