  5.  **Final Assessment Question:**
      *   Needs to test if they understand *why* the answer is difficult, not just *what* the answer is.
      *   *Idea:* Ask them to construct a scenario where the answer *would* be Yes, based on Locke's principles. Or ask them to explain *what* the blind person is missing.
      *   *Better:* "If Locke is right that the answer is 'No', what must the newly sighted person do *first* before they can identify the object?" (Answer: Associate/Correlate).
      *   *Best:* "Imagine the blind person *could* answer Yes. What would that prove about the mind that Locke denies?" (Innate spatial concepts).

  6.  **What to Skip:**
      *   Berkeley's *New Theory of Vision* (too complex, changes the terms).
      *   Modern neuroscience (ventral/dorsal streams).
      *   Historical outcomes of cataract surgeries (irrelevant to the conceptual point).

  7.  **Drafting the Plan (Iterative refinement):**
