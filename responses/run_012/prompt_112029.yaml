prompt: |-
  I run a monthly lunch-and-learn for the engineers on my team -- 12ish people, one hour, a meeting room and sandwiches, no budget for anything else. Next month I want to do it on Daniel Dennett's counterfeit people stuff (the AI-is-like-counterfeit-money essay). I'm a software engineer with zero formal philosophy, and I dont want to stand up and lecture about a view I only half-remember. I want the room to walk into the problem themselves in the first half hour and hear Dennett's name for the first time in the debrief.

  Here's the sketch I had in mind, but scrap it if you've got something that does the job better. A trust market. Everyone writes a few short messages on index cards -- advice, a rumor, a claim about how our deploy pipeline actually works -- and they all go into a pool. Each round, people spend a limited budget of trust tokens on the messages they'd actually act on. By round 2 or 3 the pool is contaminated: some entries are still human, some are recombined from earlier entries, and nobody is told which. Then the mechanic I care about most: people can pay to sign/watermark their own messages. It's cheap but not free, and it's per message, so the individually rational move is to skip it while everyone else keeps paying -- and the medium degrades even though no single person was fooled by anything in particular. I want the room to feel that the harm lands on the shared thing rather than on the individual dupe, and then to argue about whether Dennett's fix (mark the fakes, make passing along unmarked fakes illegal, hold the vendors liable) is the right shape of fix or whether it just relocates the free-rider problem somewhere else.

  What I need from you: the actual rules and materials (index cards, a projector, a shared doc is what I've got), a minute-by-minute plan for the hour, the scoring scheme without real money, and a debrief that maps what just happened onto Dennett's view -- the part where we can't help treating anything that talks sensibly with us as a person, and the part where counterfeits are a problem for everybody's ability to trust anything, not just for the person who got taken in. Tell me what will predictably go wrong the first time (I'm facilitating and I'm not a teacher), and be honest about what this game can't reproduce no matter how I run it -- which piece of the idea I'll have to just say out loud myself.

  Cap it at 900 words. Numbered rules beat paragraphs.
