answer: |-
  **Materials**
  *   Index cards (3 per person), pens.
  *   Paper slips for "Trust Tokens" (10 per person).
  *   Projector for timer/rules.
  *   Pre-written "Counterfeit" cards (5 cards with vague platitudes like "Write clean code" or "Optimize database").

  **Rules**
  1.  Everyone starts with 10 Trust Tokens.
  2.  **Round 1 (High Trust):** Write a specific, actionable engineering tip on a card (e.g., "Use `git rebase` for clean history"). Do not sign it.
  3.  Submit cards to the pool. Facilitator shuffles.
  4.  Players bet 0–2 tokens on any card they would actually act on.
  5.  **Payout:** Human cards pay 2x bet. Tokens returned.
  6.  **Round 2 (Contamination):** Write new tips. Facilitator mixes in 5 pre-written "Counterfeit" cards (vague, recombined platitudes).
  7.  Players bet 0–2 tokens. Counterfeits pay 0x (tokens lost). Human cards pay 2x.
  8.  **Round 3 (Watermarking):** Players may pay 1 Token to sign their card ("Watermark").
  9.  Players bet. Unsigned cards are risky; Watermarked Human cards pay 3x. Watermarked Counterfeits (if any slip through) pay 0x plus penalty.
  10. **Goal:** End with the most tokens.

  **Schedule (60 Minutes)**
  *   **00–05:** Setup. Distribute tokens/cards. Project Rules.
  *   **05–25:** Play Rounds 1–3. Keep pace brisk. Announce payouts loudly.
  *   **25–30:** Tally scores. Ask: "Who lost tokens in Round 2? Who paid for Watermarks in Round 3?"
  *   **30–55:** Debrief (see below).
  *   **55–60:** Close.

  **Scoring**
  *   No real money. Tokens equal "Cognitive Load."
  *   Winner gets first pick of sandwiches next month (or bragging rights).
  *   Track total tokens lost to Counterfeits vs. spent on Watermarks on the whiteboard.

  **Debrief Script (Dennett Mapping)**
  *   **The Reveal:** Introduce Daniel Dennett's essay on AI as counterfeit money. Do not start here; start with their feelings.
  *   **Question 1:** "In Round 2, did you bet less overall?" *Point:* The harm isn't just losing tokens on fakes; it's that you stopped trusting the *real* cards. This is Dennett's core thesis: AI devalues human communication systematically.
  *   **Question 2:** "Did watermarking feel fair?" *Point:* Dennett argues we must make passing unmarked AI illegal. But in the game, it cost *you* tokens. Discuss the free-rider problem: if watermarking is costly, honest speakers are penalized.
  *   **Question 3:** "Did you treat the cards like they had intent?" *Point:* Dennett's "Intentional Stance." We can't help but treat anything that talks sensibly as a person/mind. AI exploits this biological hack.
  *   **Conclusion:** The problem isn't being fooled individually; it's the erosion of the shared information environment. Dennett's fix is regulatory (liability/watermarks), not technical.

  **Predictable Failures**
  1.  **Collusion:** Players might share signals to beat the house. *Fix:* Remind them bets are secret.
  2.  **Boredom:** Round 1 might feel slow. *Fix:* Enforce a 3-minute timer per round.
  3.  **Unconvincing Fakes:** Your pre-written cards won't feel like real AI. *Acknowledge this:* Admit real AI is harder to spot. The game simulates the *economic structure*, not the tech.
  4.  **No Real Trust:** Losing paper tokens doesn't hurt. *Mitigation:* Emphasize during debrief that in reality, the cost is wasted engineering time, not points.

  **What You Must Say Out Loud**
  The game cannot reproduce **scale**. In the room, 5/20 cards were fake. In reality, the feed could be 90% fake. You must explicitly state: "Imagine if Round 2 never ended. Imagine if every document you read required a bet." That is the existential risk Dennett describes. The game shows the mechanism; you must supply the magnitude.
