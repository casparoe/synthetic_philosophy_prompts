prompt: |-
  Hey, so I'm a junior and I'm doing this independent study on pragmatism becuase my uncle bet me I couldn't explain Peirce and James without just saying truth is what works, and now I'm stuck. I need you to build me a thought experiment, not just talk about the theories. Here's the setup I want: take an ordinary family or a small town (no time travel, no brain in vats, no perfect predictors, no ghosts if you can help it) and give them a belief that is doing real work for them -- it keeps them together, gets them through a hard season, makes them better neighbors -- but the belief is about something inquiry could never settle, because the only evidence is gone or it's about a dead person's private intention or something like that. I'm inventing two little homemade tests the family uses: the long ledger, where they write down every reason for and against the belief and the rule is that if ideal inquirers could keep adding entries forever and still never converge, the belief doesn't count as settled; and the Monday test, where if the belief gets everyone to the barn by 6 a.m. and keeps the family from falling apart, it's working. I want the case to make Peirce and James split: Peirce's theory (truth is what the community of inquiry would converge on at the end of inquiry) says the belief isn't true, but James's theory (truth is what works, what's good in the way of belief, what pays off in experience) says it is true. Don't just assert that -- make the details do the work.

  After you give me the scenario (one paragraph max, realistic, no supernatural stuff if you can help it, and no quoting actual philosophers), walk through it like a lab report: state the belief, state what inquiry would do with it, give Peirce's verdict and James's verdict, and point to the exact feature of the case that makes them come apart. Then tell me what happens if I remove that feature -- does the case collapse into agreement? -- and how a defender of Peirce (or James, whichever gets the short end) would try to attack the case and keep their theory from losing. Also, I'm not asking for citations or a reading list, I can't look stuff up, so keep it self-contained. And at the end, say how confident you are in the whole thing and which part you're least sure about, because my uncle will definately ask.
