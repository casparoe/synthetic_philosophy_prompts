answer: |-
  Your friend is reacting to a very common phenomenon in pop-sci: the presentation of a specific, lively hypothesis as a settled, monolithic fact. The book you read is describing the **Cognitive Science of Religion (CSR)**, specifically the "byproduct" school associated with scholars like Pascal Boyer and Justin Barrett.

  However, the field is actually a battleground between CSR and the **Evolutionary Psychology of Religion** (e.g., Ara Norenzayan, David Sloan Wilson), plus a lot of pushback from anthropologists and historians.

  Here is the breakdown of what is standard, what is simplified, and what is flat-out contested, and why the "fade away" conclusion doesn't follow from the premises.

  ### 1. The Mechanism: Agency Detection (HADD)
  **The Claim:** *Religion comes from a Hyperactive Agency Detection Device (HADD). We see agents everywhere.*
  *   **Status:** **Standard Finding (with caveats).**
  *   **The Science:** It is well-established in cognitive psychology that humans have a low threshold for attributing agency. If you hear a twig snap, it is evolutionarily safer to assume "predator" (agent) than "wind" (non-agent). This is called HADD.
  *   **The Simplification:** The book implies HADD *is* religion. It isn't. HADD explains why we might think a spirit is in the bush. It does not explain complex theology, ritual sacrifice, priesthoods, or moral codes.
  *   **Why it matters:** HADD is the *spark*, not the *engine*. Most researchers agree HADD contributes to supernatural concepts, but few claim it explains the entirety of religious systems. Treating it as the "cause" of religion is like saying "language exists because we have vocal cords." True, but it misses the grammar, the syntax, and the social utility.

  ### 2. Byproduct (Spandrel) vs. Adaptation
  **The Claim:** *Religion is a useless byproduct (spandrel), not an adaptation.*
  *   **Status:** **Heavily Contested.**
  *   **The Science:** This is the biggest fault line in the field.
      *   **The Byproduct View (Book's view):** Religion is like a cognitive itch. It arises from how our brains work (HADD, theory of mind) but offers no survival advantage itself. It's a "virus of the mind."
      *   **The Adaptation View:** Religion *co-evolved* because it solved massive coordination problems. Groups with shared rituals and beliefs cooperated better, out-competing groups without them. Therefore, religious behavior was selected for.
  *   **Why it matters:** If religion is a **spandrel**, it is essentially a mistake and potentially easier to discard. If it is an **adaptation**, it serves a crucial social function (cohesion, trust, reducing anxiety). If it's adaptive, explaining its origin doesn't make it go away, because the *function* remains even if the *mechanism* is understood. Your friend likely rolled her eyes because the book presents the "byproduct" view as settled, ignoring the robust "adaptation" literature.

  ### 3. Convergence: "Big Moralizing Gods"
  **The Claim:** *Religions converge on the same content (all-knowing god who cares about behavior).*
  *   **Status:** **Empirically Disputed.**
  *   **The Science:** This is known as the "Big Gods" theory (popularized by Ara Norenzayan). It suggests that as societies got larger, they needed "Big Gods" to police behavior among strangers.
  *   **The Contest:** Recent large-scale historical data (specifically the **Seshat Global History Databank**) has challenged this.
      *   Many large historical states existed without moralizing high gods.
      *   Many small-scale societies have moralizing spirits.
      *   The timing often doesn't line up; "Big Gods" often appear *after* social complexity, not before.
  *   **Why it matters:** The book claims there is a universal "shape" to religion driven by cognitive hardware. The data suggests the "shape" is driven by specific socio-political histories. If religion doesn't converge on a single type, the idea of a single "religious instinct" is weaker.

  ### 4. The "Not Tracking Reality / Will Fade" Conclusion
  **The Claim:** *Because we know the natural cause, the beliefs aren't true and will vanish with science.*
  *   **Status:** **Philosophical Smuggling (The Genetic Fallacy).**
  *   **The Science:** This is where the author stops doing science and starts doing philosophy.
      *   **The Genetic Fallacy:** This is the logical error of judging the truth of a belief solely by its origin. *Example:* If I believe there is a tiger in the grass because my HADD triggered fear, explaining the fear mechanism does not prove there is *no* tiger. The origin of the belief is separate from the truth value of the belief.
      *   **The Secularization Thesis:** The idea that "science explains more, so religion fades" is the classic Secularization Thesis. Sociologically, this is largely considered dead. Global religiosity is stable or rising. Even in scientific societies, religion persists.
  *   **Why it matters:** The science explains *how* we believe. It is silent on *what* is believed (ontology). To say "we know the mechanism, therefore the object is false" is an atheistic philosophical commitment, not a scientific finding. A theist can accept HADD and say, "God wired us that way so we could find Him." An atheist can say, "God isn't there, just the wiring." The science supports both equally.

  ### Summary: What your friend knows that the book hid
  Your friend isn't saying the science is wrong; she's saying the **narrative arc** is wrong.

  1.  **Mechanism:** HADD is real, but it's not the whole story.
  2.  **Function:** Religion might be adaptive (useful), not just a spandrel (useless). If it's useful, it won't fade just because we understand it.
  3.  **Uniformity:** Religions don't all look the same; the "Big God" model is historically specific, not universal.
  4.  **Truth:** Explaining the *cause* of a belief does not disprove the *content* of the belief.

  **The Verdict:** The book gave you a clean, satisfying story that confirms your priors. That is the hallmark of good pop-sci, but bad scholarship. The field hasn't "cracked" religion; it has identified some cognitive tools used in religious thinking. Whether those tools build a house of cards (spandrel) or a social fortress (adaptation) is still being fought over. And whether the house is haunted is a question science cannot answer.
