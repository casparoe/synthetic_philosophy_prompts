answer: |-
  This is a sharp instinct. The "assembly as poll" analogy is the standard defense of sortition in contemporary political theory (often drawing on Deliberative Polling® literature), but it conflates **measurement** with **governance**. Your flatmate is relying on a statistical conception of representation (descriptive) to solve a political problem (authorization and accountability).

  Here is the audit of the analogy, the breakdown of where it fails, and an assessment of whether those failures kill his argument.

  ### 1. The Correspondence Table

  | Polling Concept | Sortition/Allotted Assembly Concept |
  | :--- | :--- |
  | **Population** | The Demos (all eligible citizens). |
  | **Sampling Frame** | The Civic Register (e.g., voter roll, census data). |
  | **Sample** | The Allotted Assembly (the MPs/Sortitioned citizens). |
  | **Data Point** | An individual member's vote or voice. |
  | **Measurement** | The final legislation or decision. |
  | **Margin of Error** | The statistical deviation of the assembly's demographics/preferences from the populace. |
  | **Nonresponse Bias** | Refusal to serve (opt-outs, exemptions, disqualifications). |
  | **Weighting** | Rules of procedure (e.g., supermajorities, committee structures) intended to correct skew. |
  | **Fieldwork Period** | The Legislative Term. |

  ### 2. Where the Mapping Breaks (The Audit)

  You identified three major breaks. Here is how they function theoretically and why they matter.

  **A. Static Measurement vs. Dynamic Transformation**
  *   **Poll:** Captures preferences at $t_0$. The goal is fidelity to the *existing* distribution of opinion. If the poll changes the respondent's mind, it is a "bad" poll (interviewer bias).
  *   **Assembly:** Operates from $t_0$ to $t_n$. The goal is *will formation*. Deliberation is supposed to change minds.
  *   **The Break:** If the assembly changes its mind through deliberation, it is no longer a statistically accurate mirror of the population at $t_0$. It becomes a **filter**, not a **sample**.
  *   **Impact:** This breaks the "representativeness = legitimacy" link. If the assembly decides something the population currently opposes (but might agree with later), the statistical mirror is shattered. The legitimacy must then come from the *quality of deliberation*, not the *randomness of selection*.

  **B. Opinions vs. Interests/Consequences**
  *   **Poll:** Measures low-cost opinions. The respondent bears no consequence for the answer. The "truth" is internal (what do you feel?).
  *   **Assembly:** Makes high-cost decisions. The members (and the population) bear the consequences. The "truth" is often external (will this policy cause inflation?).
  *   **The Break:** In a poll, the respondent is the sole authority on their data point. In an assembly, the member is *not* necessarily an authority on the causal effects of the law.
  *   **Impact:** This directly addresses your flatmate's "competence" claim. In polling, asking for expertise is indeed a category error. In legislation, it is not. You need to know how the world works, not just how you feel about it.

  **C. Anonymity vs. Agency (The Nonresponse Problem)**
  *   **Poll:** Nonresponse is handled via statistical weighting. If rich people don't answer, we weight the poor answers heavier to match census data.
  *   **Assembly:** You cannot "weight" a vote. If the busy, working-class, or highly skilled refuse to serve (high opportunity cost), they are physically absent. You cannot mathematically correct a missing body in a chamber.
  *   **The Break:** Systemic opt-outs create a **systematic bias** that randomization cannot fix. Randomization only guarantees representativeness *if* participation is universal or random.
  *   **Impact:** This threatens the core statistical claim. If the "refusers" share a trait (e.g., primary caregivers, high-income earners), the assembly is no longer a microcosm. It is a specific demographic slice.

  ### 3. Evaluating Your Flatmate's Conclusions

  **Claim 1: "Sortition is simply more representative."**
  *   **Verdict:** **True descriptively, False substantively.**
  *   **Why:** The assembly will likely look more like the population (gender, class, race) than an elected chamber. That is descriptive representation. However, because of the *Dynamic Transformation* break (A), they may not *act* like the population would. Representation is not just a picture; it's a relationship. If they deliberate themselves into a position the public rejects, the "representativeness" is cosmetic.

  **Claim 2: "Competence worries are a category error (like asking a poll for experts)."**
  *   **Verdict:** **False.**
  *   **Why:** This is the weakest part of his argument. In a poll, the "data" is subjective preference. In legislation, the "data" includes objective constraints (budget, physics, logistics).
  *   **The Audit:** A poll asks "Do you want lower taxes?" A legislature asks "If we lower taxes, will the deficit spike?" The former requires no expertise; the latter does. Treating legislation as pure preference aggregation ignores the **epistemic** function of parliament (knowing what is feasible). Ignoring this leads to populist incoherence, not democratic purity.

  **Claim 3: "Therefore it is more legitimate."**
  *   **Verdict:** **Contingent.**
  *   **Why:** Legitimacy in democracy usually requires two things: **Input legitimacy** (who decides?) and **Output legitimacy** (does it work?). Sortition maximizes Input legitimacy (statistical fairness) but risks Output legitimacy (competence/efficacy). If the assembly passes unworkable laws, legitimacy collapses regardless of how representative the sample was.

  ### 4. Is There a Better Analogy?

  You are reaching for the **Jury**, and you are right to do so. It is the historical and functional ancestor of sortition.

  **The Jury Analogy:**
  *   **Similarities:** Random selection, laypeople, deliberation, binding verdict, insulation from electoral pressure.
  *   **Differences:** Juries react to cases brought by others (agenda setting is external); they decide on facts/past events, not future policy; they are temporary.

  **Why Jury > Poll:**
  The Jury analogy captures the **judgment** aspect that the Poll analogy misses. A jury is not measuring public opinion on a crime; they are *determining* the truth of a specific matter through evidence and deliberation.
  *   **Fixes the Competence Objection:** We accept juries despite lack of legal expertise because we trust *collective judgment* on matters of fact and fairness, provided there are safeguards (judge's instructions, rules of evidence).
  *   **Fixes the Transformation Objection:** We expect jurors to change their minds during deliberation. That is a feature, not a bug.

  **The "Mini-Public" / "Trustee" Hybrid:**
  If you want to be precise, the best conceptual model is a **Trustee Model within a Microcosm**.
  *   They are a microcosm (statistically representative).
  *   They act as Trustees (using judgment to decide for the good of the whole), not Delegates (transmitting pre-existing opinions).
  *   **The Catch:** Trustees require accountability to be legitimate. Juries aren't accountable (you can't fire them); MPs are (elections). An allotted chamber lacks the "fire alarm" of elections.

  ### 5. Summary for Your Head

  The "Assembly as Poll" analogy is a **category mistake**.
  *   **Polls** are **epistemic tools** for measuring static preferences.
  *   **Assemblies** are **political tools** for exercising dynamic power.

  Your flatmate is using the statistical validity of the *selection method* to paper over the political validity of the *decision method*.
  *   **What holds:** Random selection *does* guarantee a better demographic mirror than elections.
  *   **What breaks:** A demographic mirror does not guarantee good decisions, nor does it solve the problem of expertise, nor does it guarantee that the "sample" remains representative after deliberation changes their minds.
  *   **The Verdict:** The analogy works to defend sortition against the charge of "aristocratic bias" (elections favor the rich/famous). It fails to defend sortition against the charge of "epistemic deficit" (governance requires knowledge) or "accountability deficit" (governance requires recourse).

  If you need a shorthand: **A poll tells you what the people want. A jury decides what is right. A parliament must do both.** The sortition analogy treats parliament like a poll, but it functions like a jury. The tension lies in the fact that juries don't write the laws they enforce.
