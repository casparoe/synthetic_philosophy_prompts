answer: |-
  The audit reveals two genuine tensions and one illusory one. Here is the ordering of costs, from highest to lowest, followed by the specific revision required to resolve the system.

  ### 1. The Existential Tension: Contingency (1) vs. Constraint (2)
  **Cost: Critical.**
  These two claims are logically contradictory as currently stated. You cannot assert that large outcomes "could easily have gone otherwise" (1) while simultaneously asserting they were "close to inevitable" (2). If the geography and technology made industrialization inevitable (2), then a world without industrialization was not a live possibility, and the outcome could *not* easily have gone otherwise. Holding both at full strength renders your model of causation incoherent; it treats history as both determined and undetermined in the same breath regarding the same variables.

  ### 2. The Explanatory Tension: Lock-in (3) vs. Fitness (4)
  **Cost: Moderate.**
  These are competing heuristics for explaining persistence. (3) explains persistence via inertia and suboptimality; (4) explains it via adaptation and function. While they describe different mechanisms, the tension lies in your *presumption*. (3) invites you to suspect inefficiency when you see stability; (4) commands you to presume efficiency until proven otherwise. You can hold both as *possible* mechanisms, but you cannot use them both as the *default* explanation for the same phenomenon. If you default to (3), you violate (4). If you default to (4), you risk blind spots identified by (3). This is a methodological conflict, not an ontological one.

  ### 3. The Methodological Check: Counterfactuals (5)
  **Cost: Negligible.**
  This claim does not pull against the others; it is the tool you use to test them. (5) is compatible with (2) (you run the counterfactual to confirm the inevitability) and (1) (you run it to find the branching point). It only creates friction if you use it to prove (1) while ignoring the constraints of (2), but that is an error in execution, not a flaw in the claim itself.

  ***

  ### The Single Revision

  To clear up the most confusion, you must **sharpen Claim (1): Contingency.**

  You do not need to drop it, but you must retreat from the claim that *large outcomes* are contingent. If you accept (2) — that geography and technology constrain the menu of viable civilizations — then the "large outcomes" (e.g., the rise of agrarian states, the advent of industry) are the constrained variables.

  **The Sharpened Version:**
  > "(1) Contingency. The *specific instantiations* of large outcomes — which *specific* state consolidated, which *specific* economy industrialised *first*, which *specific* technology standard won — turned on small accidents and local decisions, and could easily have gone otherwise."

  **What This Commits You To:**
  1.  **Distinguishing Levels:** You must commit to distinguishing between *structural trajectories* (governed by Constraint) and *historical pathways* (governed by Contingency). You can no longer argue that the Industrial Revolution itself was accidental, only that it happened in Britain in the 18th century due to accident.
  2.  **Burden of Proof:** When invoking Contingency, you must prove the event was a pathway selection, not a structural necessity. When invoking Constraint, you must prove the pressure was material, not just retrospective.
  3.  **Resolving (3) vs (4):** This revision helps resolve the Lock-in/Fitness tension. If a "large outcome" is constrained (2), its persistence is likely due to Fitness (4). If a "specific instantiation" (like a specific keyboard layout or rail gauge) is contingent (1), its persistence is likely due to Lock-in (3).

  By scoping Contingency to the *form* and *timing* rather than the *substance* of history, you preserve the insight of accident without denying the reality of structure.
