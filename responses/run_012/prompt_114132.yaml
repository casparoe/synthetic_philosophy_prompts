prompt: |-
  Next week I'm giving a talk to our philosophy of science reading group and I want to be ready for the Q&A. My thesis: the underdetermination of theory by evidence has been mis-framed by almost everyone. The version worth caring about isn't the logical one (here are two theories, here's the same evidence, pick either) but a resource-bounded one -- theories are underdetermined only relative to what's cheap to compute and cheap to test, so the gap between "the evidence" and "the theory" shrinks or widens with our computational and experimental budget instead of being a fixed, logical feature of the situation. The room is mostly Bayesians who will say this just collapses into a story about priors and likelihoods and adds nothing, plus a couple of old-school scientific realists who think the whole underdetermination literature is a cottage industry of toy examples and Duhem-Quine hand-waving. Draft my Q&A prep sheet: the objections I'll actually get from these people, ordered by how much damage they'd do, each phrased the way a Bayesian or a realist would put it, with a two-minute reply and a note on where my reply is soft. Include the one question I'm hoping nobody asks. Don't worry about being nice about the weak spots -- I'd rather find out now.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of science reading group talk next week.
      *   **Thesis:** Underdetermination of theory by evidence (UTE) is mis-framed. It's not a logical problem (infinite theories fit data) but a *resource-bounded* problem (underdetermination depends on computational/experimental costs). As resources increase, the gap shrinks.
      *   **Audience:** Mostly Bayesians (will argue it's just priors/likelihoods) + a couple of Old-School Scientific Realists (will argue UTE is trivial/toy examples).
      *   **Task:** Draft a Q&A prep sheet.
      *   **Requirements:**
          *   Objections ordered by damage potential (high to low).
          *   Phrased in the voice of the objector (Bayesian or Realist).
          *   Two-minute reply for each.
          *   Note on where the reply is soft/weak (brutal honesty).
          *   Include the "One Question I'm Hoping Nobody Asks."
          *   Tone: Direct, strategic, not sugar-coating weak spots.

  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* UTE is contingent on resource constraints (computation, experimentation), not logical necessity.
      *   *Implication:* Better tools/computers = less underdetermination.
      *   *Contrast:* Standard view (Quine/Duhem) = UTE is in principle permanent/logical.
      *   *Potential Weakness:* Does "resource-bounded" just mean "pragmatic"? If so, does it address the *epistemic* worry of UTE? If two theories are empirically equivalent *given current resources*, are they still distinct theories?

  3.  **Anticipate Objections (Brainstorming):**

      *   *Bayesian Objection 1:* This is just priors. If you can't distinguish them, your posterior doesn't update. If you *can* distinguish them with more resources, your likelihood function changes. You haven't added anything to Bayes.
      *   *Bayesian Objection 2:* Complexity penalties (Occam's Razor) are already in Bayesian model selection (BIC/AIC). You're rediscovering regularization.
      *   *Realist Objection 1:* If resources solve it, then truth is for sale. That's instrumentalism, not realism.
      *   *Realist Objection 2:* The logical point still stands. Even with infinite resources, there might be empirically equivalent theories (e.g., Poincaré's sphere world). You're ignoring the in-principle argument.
      *   *Hybrid/General Objection:* You're conflating *underdetermination* with *uncertainty*. Underdetermination is about structure; uncertainty is about confidence.

  4.  **Select and Order Objections (by Damage):**

      *   *Highest Damage:* The Bayesian "It's just priors/likelihoods" argument. If this sticks, the thesis is redundant. It attacks the *novelty* and *necessity* of the framework.
      *   *High Damage:* The Realist "In-Principle" argument. If logical underdetermination exists regardless of resources, the resource-bounded account is incomplete. It attacks the *scope* of the thesis.
      *   *Medium Damage:* The "Rediscovering Regularization" argument. Makes the philosopher look like they don't know statistics. Attacks *technical competence*.
      *   *Low Damage:* "So what?" (Pragmatic dismissal).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Objection 1 (Bayesian):* "You're just describing the cost of computing likelihoods."
          *   *Reply:* No, it's about the *space of hypotheses* we can even formulate. Bayes assumes a hypothesis space. Resource bounds limit the space itself.
          *   *Soft Spot:* Bayesians can just say the hypothesis space is part of the prior.
      *   *Objection 2 (Realist):* "What about in-principle equivalence?"
          *   *Reply:* In-principle equivalence is rare/toy cases. Science deals with *actual* theory choice.
          *   *Soft Spot:* Dismissing the logical possibility looks like dodging the hard philosophical bullet.
      *   *Objection 3 (The "So What?"):* "Does this change how we do science?"
          *   *Reply:* Yes, it shifts funding from theory to tooling.
          *   *Soft Spot:* Normative claims are hard to defend.

      *   *The "Hope Nobody Asks" Question:* Needs to be the killer blow. Something that exposes a contradiction or a trivialization.
          *   *Idea:* If resources define truth, what happens when resources change? Does truth change?
          *   *Refinement:* "If underdetermination vanishes with enough compute, does that mean a theory was *false* yesterday and *true* today?" (Truth vs. Assertibility).

  6.  **Refining the Voices:**
      *   *Bayesian:* Precise, slightly impatient, focused on formalism. "Likelihood functions," "Hypothesis space," "Marginalization."
      *   *Realist:* Grumpy, focused on truth, "in-principle," "approximate truth."

  7.  **Final Review against Constraints:**
      *   Ordered by damage? Yes.
      *   Phrased correctly? Yes.
      *   Two-minute replies? (Need to ensure word count allows for ~2 mins spoken).
      *   Soft spots identified brutally? Yes.
      *   "Hope nobody asks" included? Yes.

  8.  **Final Polish:** Check tone. Ensure it sounds like a strategic briefing for a philosopher, not a generic advice column. (Self-Correction: Make sure the "Soft Spot" sections are really critical, not just "this is hard.")

  *(Self-Correction during drafting Objection 1)*: I need to make sure the Bayesian objection hits the core claim that this *adds* something. The Bayesian will say "My framework already handles costs via utility functions." I need to make sure the reply distinguishes between *decision theory* (cost of acting) and *epistemology* (cost of knowing).

  *(Self-Correction during drafting the "Hope Nobody Asks")*: The best question is one that collapses the distinction between *epistemic* and *pragmatic*. If UTE is resource-bounded, is it still an *epistemic* problem? Or just an engineering problem?

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Q&A Prep Sheet: Resource-Bounded Underdetermination

  **Thesis:** Underdetermination is not a logical fixed point but a function of computational/experimental cost.
  **Audience:** Bayesians (Formalists) + Old-School Realists (Metaphysicians).
  **Goal:** Defend novelty and epistemic significance without getting crushed by formalism or dismissed as trivial.

  ---

  ### 1. The "Redundancy" Objection (Bayesian)
  **Damage Level:** 🔴 Critical (Threatens novelty)
  **The Voice:** "You're dressed up in philosophy of science language, but you're just describing the cost of computing likelihoods. In a Bayesian framework, computational constraints are handled by utility functions or approximations of the posterior. If a theory is too expensive to test, its likelihood contribution is effectively zero. You haven't solved underdetermination; you've just added a 'price tag' variable to the prior. Why do we need a new framework for what looks like standard decision theory?"

  **The 2-Minute Reply:**
  "Standard Bayesianism assumes a pre-defined hypothesis space. My claim is that resource bounds determine *which hypotheses enter the space at all*. It's not just that I can't compute the likelihood of Theory B; it's that with limited compute, Theory B is *inconceivable* or *unformulatable* to the agent.
  Bayesianism treats the hypothesis space as given, then updates probabilities. I'm arguing the geometry of the space itself is resource-dependent. If I can't afford the simulation to distinguish Theory A from Theory B, they aren't two theories with equal probability; they are *one effective theory* for that agent. Underdetermination isn't about probability mass distribution; it's about the resolution of the conceptual map. That's an structural claim about theory individuation, not just a decision-theoretic claim about which bet to take."

  **Where This Is Soft:**
  A sharp Bayesian will hit you with *Logical Omniscience* objections. They will argue that ideal Bayesianism already accounts for this via "imperfect recall" or "bounded rationality" models. If you can't point to a specific formal difference between 'resource-bounded hypothesis space' and 'prior probability zero due to complexity penalty,' you look like you're reinventing the wheel. **Be ready to define exactly how your 'effective theory' differs from a 'low-prior theory.'**

  ---

  ### 2. The "In-Principle" Objection (Realist)
  **Damage Level:** 🟠 High (Threatens scope)
  **The Voice:** "You've addressed *practical* underdetermination, which nobody really worried about. We know we can't distinguish everything *right now*. The philosophical problem—the one Quine and Duhem raised—is about *in-principle* underdetermination. Even with infinite compute and perfect instruments, there are logically distinct theories that yield identical predictions (e.g., Poincaré's sphere world, or global skeptical scenarios). By focusing on budget, you've sidestepped the actual metaphysical threat to realism. You've solved an engineering problem and called it an epistemic one."

  **The 2-Minute Reply:**
  "I'm arguing that the 'in-principle' cases are a cottage industry of toy examples that don't drive actual scientific practice. Science doesn't stall because of global skeptical scenarios; it stalls because specific discriminating experiments are too expensive or computationally intractable.
  If the 'in-principle' gap never manifests in a resource-constrained universe, does it matter? My thesis is that underdetermination is a *relation* between the world and the knower, not a property of the world alone. If the gap only exists in a limit case that no physical agent can ever reach, then treating it as the central problem of UTE is a category error. I'm offering an account of underdetermination as it actually functions in the history of science, not as it functions in logic textbooks."

  **Where This Is Soft:**
  This sounds like pragmatism disguised as realism. The Realist will press: "So if a theory is empirically equivalent in principle, you're saying it's *not* underdetermined?" If you say "yes," you look anti-realist. If you say "no," you admit your thesis doesn't cover the hard cases. **You risk conceding that your thesis only applies to 'boring' science.**

  ---

  ### 3. The "Truth vs. Assertibility" Objection (Hybrid)
  **Damage Level:** 🟡 Medium (Threatens coherence)
  **The Voice:** "If underdetermination shrinks as our budget grows, does the *truth* of the theory change? If I have a $100 budget, Theory A and B are underdetermined (effectively one theory). If I get $1M, they separate, and A is falsified. Did Theory A become false yesterday? Or was it always false, and we just couldn't tell? If the latter, underdetermination was always logical, you just couldn't see it. If the former, you're making truth contingent on our wallet."

  **The 2-Minute Reply:**
  "Truth doesn't change; *individuation* does. With the $100 budget, A and B are not distinct truth-bearers; they are a single coarse-grained description of the world. They aren't 'both true' or 'both false'; they are *indistinguishable*.
  When the budget increases, we aren't revealing the truth value of the old theories; we are replacing a coarse-grained theory with a fine-grained one. Underdetermination is a measure of resolution, not a measure of truth. The gap shrinks because the *theories* change, not because the *world* changes. We aren't buying truth; we're buying specificity."

  **Where This Is Soft:**
  This is semantic sleight of hand. If A and B make different claims about unobservables (e.g., "electrons are real" vs "electrons are instruments"), and you say they are "one coarse-grained theory," you are effectively instrumentalizing the unobservables. **Realists will smell blood here.** You are flirting with van Fraassen-style constructive empiricism while claiming to solve a realist problem.

  ---

  ### 4. The "One Question I'm Hoping Nobody Asks"
  **Damage Level:** ☠️ Fatal (Threatens the core thesis)
  **The Question:** "If underdetermination is purely a function of resource constraints, then as technology improves, underdetermination should monotonically decrease. But history shows the opposite: better tools often reveal *more* competing theories (e.g., quantum interpretations). If your thesis were true, the history of science should show a convergence toward unique theories. Why does increased computational power seem to *increase* the space of viable theories rather than collapse it?"

  **Why This Kills You:**
  Your thesis relies on the assumption that resources *resolve* ambiguity. If resources actually *generate* new degrees of freedom and new theoretical distinctions (which they often do), then the gap between evidence and theory doesn't shrink; it just moves. This suggests underdetermination is structural to theory-building, not a bug of limited compute.

  **The Hail Mary Reply (If asked):**
  "That's a feature, not a bug. Increased resolution reveals *new* underdetermination at a finer scale. It's like zooming in on a fractal. The *absolute* gap might widen, but the *relative* gap (uncertainty per unit of explanatory power) shrinks. We aren't solving UTE forever; we are pushing the horizon of underdetermination further out. The thesis isn't that UTE vanishes, but that its *location* is determined by our resource frontier, not by logic."
  *(Note: This is weak. It admits UTE is permanent, just mobile. It undermines the "shrinks or widens" claim in your abstract.)*

  ---

  ### Strategic Advice for the Room
  1.  **Don't fight the Bayesians on Math:** If they pull out a formula, don't try to out-math them. Pull it back to *concept individuation*. "Your formula assumes the variables exist. I'm asking where the variables come from."
  2.  **Don't fight the Realists on Truth:** If they ask about "Approximate Truth," concede that your account is about *theory choice*, not *truth tracking*. Frame it as "How scientists actually decide," not "How the world actually is."
  3.  **Watch Your Language:** Avoid saying "Underdetermination disappears." Say "Underdetermination becomes *actionable*." Disappearing implies a logical solution; actionable implies a resource solution.

  **Final Check:** Your softest spot is the definition of "Theory." If a theory is defined by its predictions, resources don't change it. If a theory is defined by its *mechanism*, resources do. **Lock down your definition of 'Theory' before you start.**
