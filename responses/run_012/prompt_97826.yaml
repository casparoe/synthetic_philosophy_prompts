      *   *Second Pick:* **The Formal/Computational Modeling (Tom's idea).** High risk, high reward. Needs work.
      *   *Third Pick:* **Methodological/Value Incommensurability.** Often overlooked. Crucial for current science (e.g., climate modeling, AI ethics).
      *   *Overrated:* **The "No Common Measure" Rationality Debate.** (Old school). Mostly settled or dissolved by naturalized epistemology.
