prompt: |-
  I'm in a reading group that has spent the term working through the triviality results for indicative conditionals — the family of proofs showing that if you identify the probability of a conditional with the corresponding conditional probability, and add what look like innocuous principles about probability and about how conditionals embed, the conditional collapses into the material conditional or into something equally unacceptable — and I've noticed that we keep fighting over individual proofs before anyone has said what a theory of indicative conditionals is even supposed to deliver. Before we go back to the derivations, I want the specification written out.

  Please give me the desiderata any adequate theory of indicative conditionals must meet: the cases it has to get right, the puzzles it has to dissolve or explain, and the distinctions it must respect, with the consideration behind each requirement. I have in mind things like the Ramsey test (roughly, that you accept a conditional to the degree you would accept the consequent on supposing the antecedent), the intuition that conditionals are not truth-functional and that a conditional's probability is not the probability of any proposition, the paradoxes of material implication, the embedding problem (conditionals inside the antecedents and consequents of other conditionals, and in the scope of quantifiers and propositional attitudes), the import-export question, the alleged counterexamples to modus ponens, and the contrast between indicative and counterfactual conditionals — but don't just adopt my list; tell me which of these are genuine constraints on a theory and which are artifacts of one camp's framework. Most of all, I want the pairs or sets of desiderata you suspect cannot be jointly satisfied: the triviality results are supposed to be exactly such an impossibility, and I'd rather the list make the shape of that impossibility visible than have you re-derive any one proof. Tell me which single requirement does the most to exclude the popular candidates, and, briefly, how the main families of theory fare against the list — a possible-worlds or truth-conditional account, an expressivist or non-propositional account, and a restrictor or context-shifting treatment of if. Keep the weight on the criteria and the cases that motivate them; I'll handle the scoring myself.
