answer: |-
  This is a strategic pivot. You are correct that arguing over the validity of a specific lemma in Lewis's or Bradley's proof is futile if the group hasn't agreed on what the proof is proving *impossible*. The triviality results are not merely mathematical curiosities; they are boundary markers showing where our intuitions about conditionals contradict one another.

  Below is the specification you requested. It separates the genuine phenomenological and logical constraints from the artifacts of specific formalisms, maps the incompatibilities, and scores the major theoretical families against them.

  ---

  ### I. The Specification: Desiderata for a Theory of Indicative Conditionals

  An adequate theory must account for the data of usage, logic, and probability. We can group these into six core constraints.

  #### 1. The Ramsey-Adams Constraint (Probabilistic Coherence)
  *   **Requirement:** The degree of belief (or acceptability) in a conditional $A \to C$ must equal the conditional probability of the consequent given the antecedent, $P(C|A)$.
  *   **Consideration:** This captures the **Ramsey Test**: to evaluate $A \to C$, you hypothetically add $A$ to your stock of knowledge and evaluate $C$. It explains why "If the coin is tossed, it will land heads" is 50% acceptable, even though the material conditional is 99% likely to be true (since the coin probably won't be tossed).
  *   **Status:** **Genuine Constraint.** This is the primary intuition that distinguishes indicative conditionals from material implication.

  #### 2. The Logical Constraint (Inferential Role)
  *   **Requirement:** The conditional must support standard inferences, specifically **Modus Ponens** (from $A$ and $A \to C$, infer $C$).
  *   **Consideration:** Conditionals are used to reason. If a theory validates the probability constraint but invalidates MP, it fails to explain how we use conditionals to derive conclusions.
  *   **Status:** **Genuine Constraint,** but with caveats (see McGee below).

  #### 3. The Embedding Constraint (Compositionality)
  *   **Requirement:** Conditionals must be able to appear as constituents of larger sentences: in the scope of negation, disjunction, quantifiers, and propositional attitudes (e.g., "It is not the case that if A, C"; "Either if A, C or if B, D"; "Alice believes that if A, C").
  *   **Consideration:** Natural language allows nested conditionals. A theory that treats conditionals as speech acts or non-propositional attitudes struggles to explain how they function semantically within complex logical structures (the **Frege-Geach problem** for conditionals).
  *   **Status:** **Genuine Constraint.** Any theory that denies conditionals have truth-conditions owes an account of embedding.

  #### 4. The Paradox Constraint (Non-Truth-Functionality)
  *   **Requirement:** The theory must not validate the "paradoxes of material implication": specifically, $\neg A \models A \to C$ and $C \models A \to C$.
  *   **Consideration:** We do not accept "If the moon is cheese, then 2+2=4" merely because the consequent is true, nor "If I win the lottery, I will be sad" merely because I won't win. The truth of the parts should not automatically determine the truth of the conditional.
  *   **Status:** **Genuine Constraint.** This is the primary motivation for rejecting the material conditional analysis.

  #### 5. The Import-Export Constraint (Structural Equivalence)
  *   **Requirement:** The sentence "If A, then if B, C" should be logically equivalent to "If (A and B), then C".
  *   **Consideration:** This seems like a basic equivalence of reasoning. If supposing A allows me to say "If B then C," that seems identical to supposing A and B together to conclude C.
  *   **Status:** **Contested/Artifact.** While intuitive, this is the primary source of conflict with Modus Ponens (see Section III). It is likely too strong to be a mandatory desideratum.

  #### 6. The Indicative/Subjunctive Distinction
  *   **Requirement:** The theory must explain why indicatives ("If Oswald didn't shoot Kennedy, someone else did") and subjunctives ("If Oswald hadn't shot Kennedy, someone else would have") differ in truth value and acceptability conditions.
  *   **Consideration:** The grammar marks a difference; the semantics should reflect it. Usually, this involves the temporal/epistemic relationship between the antecedent and the context.
  *   **Status:** **Genuine Constraint.** A unified theory is preferable, but it must account for the divergence.

  ---

  ### II. Critique of Your List: Constraints vs. Artifacts

  You asked to distinguish genuine constraints from artifacts of specific frameworks.

  1.  **The Ramsey Test:** **Genuine.** However, distinguish between the *psychological* version (acceptance conditions) and the *semantic* version (truth conditions). Triviality arises when you assume the psychological version dictates the semantic probabilities of propositions.
  2.  **Probability = Conditional Probability:** **Genuine Intuition, Dangerous Constraint.** This is Adams' Thesis. It is a pre-theoretical datum about usage, but treating it as a strict identity for *propositions* is what generates the triviality proofs.
  3.  **Non-Truth-Functionality:** **Genuine.** The data overwhelmingly supports this.
  4.  **Embedding:** **Genuine.** However, *how* they embed is the battleground. Truth-conditionalists say they embed like propositions; Expressivists say they embed via logical operators defined on acceptance conditions.
  5.  **Import-Export:** **Artifact/Over-demanding.** This is the weakest link. Vann McGee (1985) provided compelling counterexamples to Modus Ponens that arise specifically when Import-Export is assumed. A theory may have to sacrifice Import-Export to save Modus Ponens.
  6.  **Modus Ponens:** **Genuine, but fragile.** While we want MP to hold, McGee's cases (involving nested conditionals in elections) suggest that MP might fail for indicative conditionals in specific embedding contexts. A theory that preserves MP at all costs might be distorting the data.
  7.  **Indicative vs. Counterfactual:** **Genuine.** But note: some theories (e.g., Kratzer) treat the "if"-clause not as part of the conditional at all, but as a restrictor on a modal. In that view, the difference is not in the conditional operator (which doesn't exist) but in the modal being restricted.

  ---

  ### III. The Shape of the Impossibility: Incompatible Sets

  The triviality results are not isolated bugs; they are symptoms of trying to satisfy mutually exclusive sets of desiderata. Here are the three main tension points.

  #### 1. The Lewis-Stalnaker Trilemma (The Probabilistic Problem)
  You cannot jointly hold:
  1.  **Propositionality:** Conditionals express propositions with truth conditions.
  2.  **The Ramsey Equation:** $P(A \to C) = P(C|A)$ for all probability functions.
  3.  **Kolmogorov Probability:** Standard probability axioms apply to these propositions.

  *   **The Conflict:** Lewis (1976) proved that if (1) and (3) hold, (2) implies that the probability of the conditional collapses into the probability of the consequent (triviality).
  *   **The Cost:** You must drop one.
      *   Drop (1): **Expressivism** (Adams, Gibbard). Conditionals aren't propositions.
      *   Drop (2): **Truth-Conditionalism** (Stalnaker, Lewis). $P(A \to C) \neq P(C|A)$ generally; the Ramsey test is only a heuristic for acceptance, not truth.
      *   Drop (3): **Non-Standard Probability** (Bradley). Revise probability theory to allow conditionals to be probabilistic objects without being standard propositions.

  #### 2. The McGee Trilemma (The Logical Problem)
  You cannot jointly hold:
  1.  **Modus Ponens:** Valid for indicatives.
  2.  **Import-Export:** $(A \to (B \to C)) \equiv ((A \land B) \to C)$.
  3.  **Classical Logic for Antecedents:** Standard conjunction rules apply inside antecedents.

  *   **The Conflict:** McGee (1985) showed that in cases involving nested conditionals (e.g., regarding election outcomes), accepting Import-Export and Classical Logic forces you to accept conclusions via Modus Ponens that are intuitively unacceptable.
  *   **The Cost:** Most theories sacrifice **Import-Export**. Some (like McGee's own view) restrict **Modus Ponens**.

  #### 3. The Embedding/Expressivism Trade-off
  You cannot jointly hold:
  1.  **Strict Expressivism:** Conditionals have no truth conditions (only acceptance conditions).
  2.  **Naive Embedding:** Conditionals embed in logical compounds exactly like propositions (e.g., via standard Boolean negation).

  *   **The Conflict:** If "If A, C" has no truth value, what does "Not (If A, C)" mean? Standard negation operates on truth values.
  *   **The Cost:** Expressivists must develop a complex logic of acceptance (e.g., Gibbard's logic of consistency) to explain embedding, which often looks suspiciously like truth-conditions in disguise.

  ---

  ### IV. The Single Most Exclusionary Requirement

  If you must identify the one requirement that does the most work to exclude popular candidates, it is:

  **The Ramsey Equation applied to Propositions.**
  *(The claim that conditionals are truth-apt propositions AND their probability is always the conditional probability.)*

  *   **Why:** This is the engine of the Lewis triviality result. It is the most pre-theoretically attractive intuition (the Ramsey Test feels undeniable), yet it is mathematically incompatible with the standard view that sentences express propositions that serve as objects of belief.
  *   **Effect:** It forces every theory into a corner.
      *   **Truth-Conditionalists** must deny the equation (arguing Ramsey is about *assertibility*, not truth).
      *   **Expressivists** must deny the propositionality (arguing Ramsey is right, but conditionals aren't truth-apt).
      *   **Restrictor Theorists** must deny the syntax (arguing there is no binary conditional operator to which the equation applies).

  ---

  ### V. Brief Scoring of Theoretical Families

  Here is how the main families fare against the specification, highlighting where they break.

  #### 1. Truth-Conditional / Possible Worlds (Stalnaker, Lewis)
  *   **Strategy:** Conditionals are propositions (sets of worlds). $A \to C$ is true if the closest $A$-world is a $C$-world.
  *   **Satisfies:** Embedding (perfectly), Logic (MP holds, IE usually rejected), Paradox Constraint (avoids material paradoxes).
  *   **Fails:** **The Ramsey Equation.** Stalnaker admits $P(A \to C) \neq P(C|A)$ in general. They must argue the Ramsey Test is a rule of *acceptance*, not a semantic identity.
  *   **Verdict:** Best for logic and grammar, worst for the probabilistic intuition.

  #### 2. Expressivist / Non-Propositional (Adams, Gibbard, Edgington)
  *   **Strategy:** Conditionals do not express propositions. They express conditional beliefs or norms of acceptance.
  *   **Satisfies:** **The Ramsey Equation** (Adams' Thesis is built-in), Paradox Constraint (no truth conditions to generate paradoxes).
  *   **Fails:** **Embedding.** They struggle to explain negation, disjunction, and quantification without reintroducing truth-conditions by the back door. They also struggle with **Indicative/Subjunctive** unity.
  *   **Verdict:** Best for probability and the Ramsey intuition, worst for grammar and logical complexity.

  #### 3. Restrictor / Context-Shifting (Kratzer, von Fintel)
  *   **Strategy:** There is no conditional operator. "If" is a restrictor on a covert modal operator. "If A, C" is parsed as "Must (if A)(C)".
  *   **Satisfies:** **Embedding** (treats "if" like a quantifier restrictor), **Indicative/Subjunctive** (difference lies in the modal, not the "if"), **Ramsey Intuition** (conditional probability emerges from modal semantics).
  *   **Fails:** **Logical Simplicity.** It requires a massive revision of the surface syntax. It also faces challenges with **Modus Ponens** (since there is no binary operator to detach).
  *   **Verdict:** Best for linguistic integration and modal unity, but requires the highest syntactic revision cost.

  ### Summary for the Reading Group
  When you return to the derivations, do not ask "Is this proof valid?" Ask: **"Which desideratum is this proof showing to be incompatible with which?"**

  If the proof assumes Propositionality and derives Triviality from the Ramsey Equation, the group must decide: Do we save the Proposition (Stalnaker) or save the Equation (Adams)? If the proof assumes Import-Export and breaks Modus Ponens, ask: Is Import-Export actually a constraint, or just a habit of formalization?

  The triviality results do not tell us conditionals are impossible; they tell us **Propositionality + Ramsey + Standard Probability** is impossible. The rest of the philosophy of conditionals is the story of which one we chose to kill.
