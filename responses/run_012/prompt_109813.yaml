  **Total Grade: 14 / 20**

  Here is the breakdown and the specific margin comments you can use. The student has a strong grasp of the *theory* and *philosophy* of the Kelly criterion (Parts A and C), but they committed a fatal mathematical error in Part B regarding Expected Utility theory that undermines the core learning objective of the problem set.

  ***

  ### Part (a): 8 / 8 points
  **Comments:**
  *   **Correct.** Your derivation of the Kelly fraction ($f^* = 0.10$) is accurate.
  *   **Good justification.** You correctly identified that the objective is maximizing the expected logarithmic growth rate ($E[\log(1+fX)]$).
  *   **Note:** Your mention of the concavity of the growth rate and the risk of ruin ($f=1$) demonstrates a solid understanding of why the interior solution exists. No deductions here.

  ### Part (b): 1 / 7 points
  **Comments:**
  *   **Incorrect Conclusion.** The criterion from (a) is **Maximize Expected Log Wealth**, not Maximize Expected Wealth. You concluded "Yes, take it," but the correct answer is **No**.
  *   **Fatal Mathematical Error.** You wrote: *"since log is an increasing function, a bet that raises expected wealth also raises expected log wealth."* **This is false.** Because $\log(\cdot)$ is concave, by Jensen's Inequality, $E[\log(W)] < \log(E[W])$. A bet can have positive Expected Value (EV) but negative Expected Utility (EU) under log utility.
  *   **Wrong Calculation.** The prompt asked for the "relevant calculation" for the criterion in (a). You calculated Expected Value ($0.5 \times 0.10 = 5\%$). You needed to calculate Expected Log Utility:
      $$0.55 \log(1 + 0.5) + 0.45 \log(1 - 0.5)$$
      $$\approx 0.55(0.405) + 0.45(-0.693) \approx 0.223 - 0.312 = -0.089$$
      Since $-0.089 < 0$, the bet reduces expected log wealth. The criterion rejects it.
  *   **Partial Credit (1 pt):** You correctly noted that the LLN justification doesn't apply in the single-shot case. However, since the decision rule itself was applied incorrectly, most points must be deducted. Staking 50% of your bankroll on a coin flip is too risky for a log-utility agent, even with a favorable edge.

  ### Part (c): 5 / 5 points
  **Comments:**
  *   **Correct.** This is a strong assessment. You correctly identified that while Kelly is formally equivalent to EU maximization with log utility, the *justification* for that utility function is distinct (time-average growth vs. subjective risk preference).
  *   **Good nuance.** Your point about expected wealth maximization leading to ruin in the repeated setting (due to over-betting) accurately captures the ergodicity argument we discussed in class. Full marks.

  ***

  ### Grader's Note (For your eyes only):
  The student's failure in Part (b) is significant for a Decision Theory seminar. Confusing $E[\log(W)]$ with $\log(E[W])$ suggests they might be treating the Kelly Criterion as a "rule of thumb" rather than understanding the underlying utility theory.

  *   **Why 1 point and not 0 in Part (b)?** I left 1 point because their comment on the Law of Large Numbers was technically correct (the *justification* changes, even if the *criterion* remains the same).
  *   **Why not higher?** If you give more than 2 points here, you signal that confusing Expected Value with Expected Utility is acceptable. In this specific course, that distinction is the entire point of Problem 5.
  *   **Recommendation:** When handing back, verbally emphasize the Jensen's Inequality error. It's the kind of mistake that will hurt them on the final if not corrected now.
