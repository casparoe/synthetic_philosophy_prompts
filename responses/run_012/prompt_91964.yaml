prompt: |-
  I'm a science journalist — I mostly do AI and stats for a trade outlet, but I've been noodling on a side piece about how philosophers talk about evidence, and I'm trying to avoid writing the ten-thousandth explainer that boils down to "Bayes's theorem, isn't it neat." Last week I had lunch with a philosopher of science who works on confirmation, and she mentioned that Bayesians have a second rule besides ordinary conditionalization, for when you can't be sure what you just observed — the cloth-under-candlelight case, where you're certain you're having *some* visual experience but not certain whether the cloth is blue or green. She called it Jeffrey conditionalization (or maybe probability kinematics, I forget which one is the rule and which one is the family). The way I understood it: you keep your old conditional probabilities given "blue" and given "green" fixed, and then just mix them in whatever proportion your new uncertainty dictates — so if I've come to be 70/30 on blue vs. green, I weight the two conditionals 70/30 and out pops a posterior. Also I'm assuming it doesn't care what order you learn things in, the way ordinary conditionalization doesn't — P(A given B and C) is the same as P(A given C and B), so presumably this is order-proof too, which would be a nice thing to be able to tell readers.

  Here's whats bugging me and I'd like you to tell me straight whether I've got it right. If that's the rule, then the old objection that Bayesianism can't cope with uncertain evidence is basically dead — fine, great, one less thing. But it also looks like it hands the agent a free parameter: I decide how much weight to put on each cell, the rule mechanically spits out a posterior, and so in any real case where my evidence is fuzzy I can land wherever I want and still be "following the rule." Doesn't that make the whole apparatus unfalsifiable — a get-out-of-jail-free card that absorbs any observation whatsoever? And if the flexible version is the honest one, what was the point of all that fuss about strict conditionalization being the norm in the first place — was everyone just pretending to be more constrained than they are?

  I have a feeling I'm missing something about what's actually doing the constraining here, and the philosopher I talked to was too polite to correct me, so please just explain it rather than reassuring me that Bayesianism is fine.
