          1.  *Coworker/Client:* Said "test came back clean" (false). Ruling: Lying. (Clear cut).
          2.  *Supplement Ad:* Said "clinically studied" (technically true, but misleading because study showed nothing). Ruling: Lying/Down on it hard. (Focus on intent/impression over literal truth).
          3.  *Tom/Restaurant Time:* Said "closes at 11" (false, thought it was 11). Ruling: Not a lie, just wrong. (Focus on intent/belief).
          4.  *Tom/Mom Visit:* Said he'd come, forgot, didn't show. Ruling: Not a lie, just flaky. (Focus on intent at time of speaking).
          5.  *Murderer at the Door:* Would lie. Ruling: Acceptable deception. (Focus on harm/moral hierarchy).
      *   **The Current Situation:** User said "we talk most weeks" (True) to imply "I warned her" (False/Unsaid). Manager understood the implication. User knew manager would understand the implication.
      *   **User's Question:** What rule is she running? Is she right? How can I test this rule to get a straight answer?

  2.  **Deconstruct the Girlfriend's Moral Framework:**
      *   *Observation 1 (Intent vs. Accuracy):* She distinguishes between *malicious/knowing* deception and *honest mistakes*. (Tom examples). If you believe it, it's not a lie, even if false.
      *   *Observation 2 (Literal Truth vs. Communicative Truth):* She distinguishes between *technically true words* and *the message conveyed*. (Supplement Ad). If the impression is false, it's a lie, even if the words are true.
      *   *Observation 3 (Harm/Protection):* She allows lying for protection/higher moral good. (Murderer at the door).
      *   *Synthesis:* Her definition of a "lie" isn't about the dictionary definition of the words spoken. It's about **the integrity of the information transfer.**
      *   *Key Principle:* A lie is **intentionally causing someone to hold a false belief.**
          *   Coworker: Intended client to believe test was done. (Lie)
          *   Supplement: Intended customer to believe product works. (Lie)
          *   Tom (Time): Did not intend to deceive, just mistaken. (Not a lie)
          *   Tom (Mom): Did not intend to deceive at the moment of speaking. (Not a lie)
          *   Murderer: Intended to deceive, but to prevent greater harm. (Justified Lie)
