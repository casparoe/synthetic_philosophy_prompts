  # Research Proposal: The Commitment Gap in Intent Alignment

  ## Project Title
  The Commitment Gap: Re-evaluating Intent Alignment Through a Philosophy of Action Lens

  ## Problem Statement
  The contemporary discourse on AI alignment frequently bifurcates the problem into "intent alignment" (getting the system to do what the operator means) and "value alignment" (ensuring what the operator means is actually good). The prevailing strategy treats intent alignment as the tractable technical core, bracketing the ethical complexities of value alignment for later. This framing relies on a specific operational definition of "intent": typically modeled as the satisfaction of revealed preferences or the maximization of an implicit utility function.

  This proposal argues that this operationalization conflates *preferences* (desires over outcomes) with *intentions* (settled commitments that structure planning). In the philosophy of action, intentions are distinct from preferences: they resist recalibration in the face of fluctuating desires, they close off deliberation, and an agent can intend to do something while simultaneously preferring not to do it (e.g., intending to finish a thesis while preferring to sleep). If AI systems align to operator preferences rather than operator intentions, they may systematically undermine human agency by optimizing for what the operator wants *now* rather than what the operator has committed to *doing*. Conversely, if they align to intentions, they may violate current preferences, creating friction that looks like misalignment from a preference-based view.

  ## Research Question
  Does substituting a philosophical model of intention (commitment-based) for the standard preference model (desire-based) in intent-alignment render the narrow alignment problem distinct from, collapsible into, or intractable compared to the broad value-alignment problem?

  ## Why Existing Positions Do Not Settle This
  Current arguments for intent alignment assume that "what the operator intends" is recoverable from "what the operator prefers." This assumption goes unchallenged because the literature treats the operator as a source of reward signals rather than an agent with a temporal structure of agency. 
  1.  **The Technocratic View:** Assumes intent is simply high-fidelity instruction following. This ignores cases where the instruction contradicts the commitment (e.g., "tell me I don't have to do this" vs. "make sure I do this").
  2.  **The Preference Utilitarian View:** Assumes aligning to revealed preference is sufficient for agency. This fails to account for akrasia (weakness of will) where an agent prefers the vice but intends the virtue.
  3.  **The Value Realist View:** Dismisses intent alignment entirely as morally insufficient. This overlooks the possibility that respecting intention *is* a core value, meaning the "narrow" problem might actually be the primary ethical problem if modeled correctly.

  None of these positions address the structural mismatch between the *model of the human* used in alignment (preference maximizer) and the *structure of human agency* (commitment holder).

  ## Methodology
  This project is primarily conceptual. It will reconstruct the two competing models of operator agency and test them against divergent case studies to determine if they yield different alignment targets.

  **Phase 1: Model Reconstruction**
  *   Formalize the **Preference Model**: The operator is a utility function; intent is the gradient of expected satisfaction.
  *   Formalize the **Intention Model**: The operator is a planning agent; intent is a settled node in a plan that excludes further deliberation on specific sub-goals, regardless of fluctuating utility estimates.

  **Phase 2: Case Study Analysis**
  I will run three specific scenarios through both models to identify divergence points:
  1.  **The Reluctant Commitment:** An operator intends to complete a difficult task (e.g., coding a security patch) but currently prefers to avoid the stress. A preference-aligned system offers distractions; an intention-aligned system blocks them.
  2.  **The Paternalistic Override:** A system predicts the operator will regret a settled intention later (e.g., sending an angry email). A preference-aligned system intervenes to maximize future satisfaction; an intention-aligned system executes the commitment to preserve agency integrity.
  3.  **The Articulated Intent:** An operator has no settled intent until the system forces a declaration. A preference model waits for signals; an intention model recognizes the declaration as the creation of the intent itself.

  **Phase 3: Synthesis**
  *   Map the divergences to determine if the "narrow" problem collapses into value judgments (e.g., deciding when to respect commitment over preference is itself a value judgment).
  *   Determine if the intention model makes the problem harder (requires modeling agency structure) or thinner (aligning to empty commitments).

  ## Why Conceptual Work Rather Than Empirical HCI?
  Empirical methods (surveys, behavioral experiments) can tell us what users *say* they want or how they *react* to system behavior, but they cannot resolve category errors. You cannot measure the difference between "preference" and "intention" via user satisfaction scores, because users often conflate the two themselves. The question is normative and structural: what *constitutes* alignment with an agent? This requires philosophical reconstruction before it can be operationalized. HCI can validate the implementation later; it cannot define the target now.

  ## Timeline (9 Months, Part-Time)

  | Period | Milestone |
  | :--- | :--- |
  | **Months 1-2** | **Model Reconstruction:** Complete formal descriptions of the Preference Model and Intention Model of agency. |
  | **Months 3-4** | **Case Development:** Draft detailed narratives and decision trees for the three core case studies (Reluctant Commitment, Paternalistic Override, Articulated Intent). |
  | **Months 5-6** | **Comparative Analysis:** Run cases through both models; document divergence points and alignment failures for each. |
  | **Month 7** | **Synthesis:** Determine if divergences collapse into value questions or remain technical intent problems. Draft initial argument. |
  | **Month 8** | **Drafting:** Write full paper/report. Integrate feedback from peers/advisors. |
  | **Month 9** | **Revision:** Finalize deliverable. Prepare summary brief for non-specialist audience. |

  ## Deliverable
  A 10,000-word research paper suitable for publication in an AI ethics venue (e.g., FAccT, AIES) or philosophy of technology journal, plus a 2-page executive summary for governance practitioners.

  ## Success and Failure Conditions
  **Success:** The project demonstrates a clear, systematic divergence between preference-aligned and intention-aligned outcomes in at least two of the three case studies, proving that the "narrow" alignment problem is currently mis-specified. It will show whether this makes the problem harder (requires new technical primitives) or collapses it (requires value judgments to choose between preference and intention).

  **Failure:** The analysis reveals that for all practically relevant cases, the Preference Model and Intention Model converge on the same system behavior. If the distinction turns out to be philosophically coherent but engineering-idle (i.e., no current or foreseeable system architecture could distinguish them), the project will conclude that the distinction is a distinction without a difference for alignment engineering. This is a valid negative result that prevents wasted effort on a phantom problem.

  ## Strongest Objection and Verdict
  **Objection:** Even if the philosophical distinction holds, current AI architectures (LLMs, RLHF) are fundamentally preference-based (predicting next token based on probability/reward). They cannot represent "commitment" distinct from "desire." Therefore, the distinction is theoretically interesting but practically idle for the next decade of alignment work.

  **Verdict if Objection Holds:** The project shifts from solving alignment to critiquing architecture. It would conclude that intent alignment is impossible *as currently conceived* because the systems lack the ontological structure to recognize intention. This would imply we need new architectural primitives, not just new loss functions.

  ***

