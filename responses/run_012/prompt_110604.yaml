prompt: |-
  OK so I'm putting together an application for a small AI-ethics-and-governance fellowship — nine months, part time, one deliverable — and I've got a half-formed idea I want you to turn into a real research proposal.

  The idea is about the intent-alignment vs value-alignment split, specifically the "narrow" definition of the alignment problem, where you say: the alignment problem is just getting the system to do what the operator actually intends, and we bracket the question of whether that intent is any good, because that's the "value" part and someone else's problem.

  I keep feeling like this framing is doing something sneaky with the word "intent." The way it gets operationalized, "intent" ends up meaning the operator's preferences over outcomes — basically a utility function, possibly implicit, that we're trying to infer from behavior. But thats a desire model of intent, not an intention model. In the philosophy-of-action tradition, intentions aren't just strong desires: they're settled, they close off deliberation, they're the thing you're committed to and that structures everything else you're planning, and they can come apart from what you'd most prefer (you can intend to finish the draft even while, at every moment, preferring to do something else). If that's right, then "align to the operator's intent" and "align to the operator's preferences" are two different targets, and the narrow framing quietly swapped one for the other without anyone noticing.

  So the question I want the proposal to nail down: does the intent/value distinction survive once you stop treating intent as preference-satisfaction? And once you do, does the narrow definition of the problem (a) collapse back into the value question, (b) become a different and harder problem, or (c) stay tractable only because it's now aligning the system to something thinner than anyone actually cares about?

  Turn this into the proposal. I want it to: state the question so it has a determinate answer; explain why the existing positions — intent-alignment as the tractable core, value-alignment as the real problem, the "just do what the user wants" line — don't settle it; lay out the method. My instinct is this is mostly conceptual work: reconstruct the preference model, reconstruct the intention model, then run a handful of cases through both and see where they diverge. Some cases I'd want worked: an operator who has already settled on a decision but would (right now) prefer the system to talk them out of it; a system that's perfectly aligned to revealed preferences but overrides a stated intention because it better predicts what the operator will later wish they'd done; an operator whose "intent" is only settled once the system asks them to state it. Say why conceptual work is the right tool here and not empirical HCI stuff. Give a realistic month-by-month for nine months part time. Say what a result looks like, and what would count as the project failing — I think the honest failure mode is that the two models turn out to coincide on every case that matters, in which case the whole thing is a distinction without a difference, and I want the proposal to own that rather than hide it.

  No citations — I'll add those myself. And please argue about positions rather than summarizing what the literature supposedly says; a reading-list feel is not what I need.

  After the proposal, give me a JSON object with these fields, filled in from the proposal: title (string); research_question (one sentence, determinate); central_distinction (two short strings, the two things being pulled apart); why_open (2-3 sentences); method_steps (array of strings, ordered); why_conceptual_not_empirical (1-2 sentences); timeline (array of objects, each {"period": "...", "milestone": "..."}); deliverable (string); success_looks_like (string); failure_looks_like (string); strongest_objection (string — the best case that the distinction is idle); and verdict_if_objection_holds (string).
