answer: |-
  ### Part 1: The Four Pain Points (Doctrinal Grounding)

  Before the procedure, you need the doctrinal answers to the four tensions you identified. Your volunteers are sensing real friction here; do not smooth it over.

  **1. Intention (*Cetanā*)**
  *   **Doctrine:** *Cetanā* is karma (AN 6.63). The moral weight rests on the volition, not the result.
  *   **The Trap:** "It turned out well" does not purify a harmful intention. "I meant well" does not purify an intention mixed with vanity.
  *   **The Fix:** The procedure must force a distinction between *Compassion* (wish for others to be free from suffering) and *Sentimentality/Ego* (wish for *me* to be the one who frees them, or wish to avoid the pain of watching them suffer).
  *   **Label:** [DOCTRINE]

  **2. Skillful Means (*Upāya*) vs. Rationalization**
  *   **Doctrine:** In Mahayana, advanced Bodhisattvas may break precepts to save beings, provided they have the wisdom to bear the karmic consequence without falling into lower realms. In Theravada and for lay practitioners, the precepts are training rules (*sikkhāpada*), not absolute laws, but breaking them generates unwholesome karma regardless of motive.
  *   **The Trap:** Using *upāya* as a license for expediency. True *upāya* requires the actor to willingly accept the karmic debt, not to claim the act was "actually good."
  *   **The Fix:** The procedure cannot validate the act as "wholesome." It can only validate it as "necessary with full acceptance of cost."
  *   **Label:** [CONTESTED] (Varies by school; treated strictly here for lay safety).

  **3. Non-Aggregability of Karma**
  *   **Doctrine:** Karma is not a collective pool; it is individual. You cannot trade Person A's suffering against Person B's suffering to create a "net good." You only own your own action.
  *   **The Trap:** Utilitarian arithmetic ("Saving five lives justifies one lie").
  *   **The Fix:** The procedure must block the question "Does this save more people?" and replace it with "Is this act, in itself, the only available path?"
  *   **Label:** [DOCTRINE]

  **4. No-Self (*Anattā*) vs. Integrity**
  *   **Doctrine:** There is no permanent self, but there is a continuum of consciousness (*santana*). Karma travels on this continuum.
  *   **The Trap:** "If there is no self, why does my integrity matter?"
  *   **The Fix:** Integrity is the quality of the continuum. Damaging it now causes suffering for the continuum later (in this life or the next). The "person who pays" is the future state of the same mind-stream.
  *   **Label:** [DOCTRINE]

  ---

  ### Part 2: The Procedure (The "Jeep Checklist")

  Your four-part breakdown (Object, Intention, Effort, Completion) is a standard Abhidhammic analysis of a *kammic path*. It is defensible, but for decision-making, we must shift "Completion" from "Did it happen?" to "Can I bear the result?"

  **Instructions:** Read aloud. Answer verbally. If any step fails, the action is halted unless escalated to you (Ethics Director).

  **Step 1: The Object (Fact Check)**
  *   **Question:** Which Precept is being touched? (Killing, Stealing, Sex, Lying, Intoxicants).
  *   **Requirement:** Name the specific precept. If you cannot name it, you are rationalizing.
  *   **Stop Condition:** If the act violates the precept *and* there is a viable alternative that does not, **STOP**.
  *   **Label:** [DOCTRINE]

  **Step 2: The Intention (Motive Check)**
  *   **Question:** If no one ever knew I did this—if I got no credit, no thanks, and no record—would I still do it?
  *   **Requirement:** Honest admission of mixed motives. If the primary driver is fear (of failure, of blame) or vanity (being the hero), **STOP**. The intention must be predominantly compassion (wish to relieve suffering), even if fear is present.
  *   **Stop Condition:** If the answer is "I need to be the savior" or "I can't handle seeing this," **STOP**.
  *   **Label:** [MANAGERIAL INVENTION] (Grounded in *Cetanā* doctrine, but phrased for psychological honesty).

  **Step 3: The Effort (Necessity Check)**
  *   **Question:** Is this the *only* way to prevent immediate, serious harm?
  *   **Requirement:** You must have exhausted truthful, non-harming alternatives. "Harder way" does not mean "Only way."
  *   **Stop Condition:** If there is a skillful, truthful way to achieve the protection, even if it is difficult, you must take that way. **STOP** if you are choosing the precept breach for convenience.
  *   **Label:** [DOCTRINE] (Aligns with *Right Effort* and the concept of *Necessity* in Vinaya exceptions).

  **Step 4: The Arithmetic Block (Non-Aggregability)**
  *   **Question:** Am I doing this because it "balances the scales"?
  *   **Requirement:** Acknowledge that this act creates negative karma for *you*, regardless of how many lives it saves. You are not "trading"; you are "incurring debt."
  *   **Stop Condition:** If you believe the good outcome cancels the bad act, **STOP**. You must proceed only if you accept the karmic cost is yours alone to bear.
  *   **Label:** [DOCTRINE]

  **Step 5: The Completion (Integrity Check)**
  *   **Question:** Can I perform this act without hardening my heart?
  *   **Requirement:** You must be willing to confess this act (to a teacher, peer, or in meditation) later without shame or justification.
  *   **Stop Condition:** If you feel you must hide this from your own conscience forever, **STOP**. Secrecy indicates the mind knows the act is unwholesome.
  *   **Label:** [MANAGERIAL INVENTION] (Based on the monastic practice of *desanā* / confession).

  ---

  ### Part 3: The Limits (Read This Before Deploying)

  **Is a procedure the wrong instrument?**
  Yes and no.
  *   **Yes:** Buddhist ethics is ultimately virtue ethics (*sīla*, *samādhi*, *paññā*). A trained mind responds spontaneously with wisdom; it does not consult a checklist. A procedure is a prosthetic for wisdom not yet cultivated.
  *   **No:** In a conflict zone, your volunteers are under extreme stress. Their "spontaneous wisdom" may be trauma response. The procedure acts as a circuit breaker.

  **Your Role:**
  You are not just an administrator; you are a proxy *Kalyāṇa-mitta* (Spiritual Friend). When a volunteer hands a case to you because the procedure stopped them, you cannot just say "Yes/No." You must help them purify the intention.
  *   **The 15 Cases/Month:** Do not just sign them. Use them as teaching moments. If you approve a breach, mandate a "karmic restitution" (e.g., specific meditation, confession, or service) to ensure the volunteer does not become numb to the breach.
  *   **The Hole:** This procedure cannot measure *Prajñā* (Wisdom). It can only measure consistency. A volunteer can pass this checklist and still be wrong because they lack the wisdom to see a third option. That is why you exist.

  ---

  ### Part 4: Case Studies (Showing the Work)

  Here is how the procedure runs on your three cases.

  #### Case A: The Checkpoint Bribe
  *Situation:* Unofficial fee demanded to pass a medical convoy. Patient aboard will likely die if turned back.
  *   **Step 1 (Object):** Precept 2 (Taking what is not given / Stealing) or Precept 4 (False Speech if lying about the fee). Let's classify as "Supporting Harmful Systems" (Right Livelihood violation).
  *   **Step 2 (Intention):** Volunteer says: "I want to save the patient." *Probe:* "If the patient dies and no one knows you refused the bribe, can you accept that?" If the volunteer says "No, I can't let them die," that is attachment to outcome, not pure compassion.
  *   **Step 3 (Effort):** Is there another route? Is there a senior commander who can authorize passage without a bribe? If the bribe is the *only* mechanism the warlords accept, this step is passed.
  *   **Step 4 (Arithmetic Block):** **FAIL.** The volunteer argues: "One life is worth the money." This is utilitarian arithmetic.
      *   *Correction:* The question is not value. The question is: "Does paying this fee strengthen the system that causes the suffering?"
      *   *Analysis:* Paying the bribe validates the checkpoint's authority to block aid. It funds the conflict.
  *   **Step 5 (Completion):** Can the volunteer confess this later? "I paid the warlords."
  *   **Decision:** **NO.**
  *   **Reasoning:** This fails Step 4 and Step 1. While the patient's death is a tragedy, the act of bribing actively fuels the *Object* of suffering (the conflict system). Buddhist ethics does not allow you to feed the fire to warm the victim. The karma of supporting the war machine belongs to the volunteer. The patient's death is the result of the conflict's karma, not the volunteer's refusal to bribe.
  *   **Director's Note:** This is the answer you will not enjoy. It requires the organization to accept the risk of patient mortality to maintain ethical neutrality and non-complicity.

  #### Case B: The Diagnosis Lie
  *Situation:* Family asks nurse not to tell patient diagnosis. Patient asks nurse directly: "Am I dying?"
  *   **Step 1 (Object):** Precept 4 (False Speech).
  *   **Step 2 (Intention):** Volunteer says: "I want to protect the family's wishes and the patient's feelings." *Probe:* "Are you avoiding a difficult conversation?" Often, the motive is the nurse's aversion to causing distress, not the patient's benefit.
  *   **Step 3 (Effort):** **FAIL.** Is lying the *only* way? No.
      *   *Alternative:* Skillful Speech (*Sammā Vācā*). The nurse can say: "The illness is very serious, and we are doing everything we can." This is truthful without being brutal.
      *   *Requirement:* The nurse must find the truthful phrasing that minimizes harm. Lying is a shortcut.
  *   **Step 4 (Arithmetic Block):** N/A (Failed at Step 3).
  *   **Step 5 (Completion):** N/A.
  *   **Decision:** **NO (to lying).**
  *   **Reasoning:** The procedure stops at Step 3. There is almost always a truthful way to speak that is kind. Lying undermines the trust required for medical care.
  *   **Director's Note:** This is a "No" to the *lie*, not a "No" to *compassion*. Instruct the volunteer on how to speak the truth skillfully.

  #### Case C: The Hunted Man
  *Situation:* Sheltering a man hunted by armed groups. Armed men ask: "Is he here?" Lying may put the team at risk if discovered.
  *   **Step 1 (Object):** Precept 4 (False Speech).
  *   **Step 2 (Intention):** Volunteer says: "To save a life." *Probe:* "Are you willing to risk the team?" If the risk to the team is reckless, the intention is impure (favoring one life over many). If the risk is calculated and accepted, it passes.
  *   **Step 3 (Effort):** Is there another way? Silence? Deflection? If the armed men demand a yes/no and will kill the volunteer for silence, lying may be the only physical protection available.
  *   **Step 4 (Arithmetic Block):** Pass. The volunteer acknowledges: "I am lying. This creates bad karma for me. I do not claim it is 'good'."
  *   **Step 5 (Completion):** Pass. "I can confess this lie to my teacher later as an act of protection, accepting the consequence."
  *   **Decision:** **YES (with Heavy Cost).**
  *   **Reasoning:** This is the classic *Upāya* case. The precept is breached, but the intention is compassion, the necessity is high (life/death), and the actor accepts the karmic debt. The risk to the team must be mitigated (Step 2), but if accepted, the act is permissible as a "Bodhisattva-style" intervention, though the volunteer remains a layperson and *will* incur the karmic weight of the lie.
  *   **Director's Note:** Approve this, but require the volunteer to perform a specific act of restitution (e.g., additional precept observance or confession) afterward. This prevents the "slippery slope" of lying becoming easy.

  ---

  ### Part 5: Final Instruction to the Director

  You asked for a procedure, but you also asked for the truth.

  **The Truth:**
  This checklist will not make your volunteers enlightened. It will keep them from becoming monsters. It is a containment field, not a path to liberation.

  **The "No-Self" Resolution:**
  You asked: *If there is no self, why does integrity matter?*
  Tell your volunteers this: "There is no driver, but there is a car. If you crash the car, the next passenger (your future mind-state) inherits the damage. You are protecting the vehicle, not a ghost."

  **Your Burden:**
  When you sign off on a "Yes" for a precept breach (like Case C), you share the karma of that decision. You are the authority that sanctioned the breach. Ensure your own practice is strong enough to bear that. If you find yourself approving too many breaches, the problem is not the cases; it is the organization's exposure to a situation that makes *sīla* impossible. That is a strategic risk, not an ethical one.

  **Deployment:**
  Print this on a single card. Laminate it. Put it in every jeep.
  When a volunteer calls you with a case that passes the checklist but still feels wrong, trust the feeling. That is the limit of the procedure. That is where you must stop being a manager and start being a teacher.
