answer: |-
  This is a profound difficulty to encounter mid-draft, for it strikes at the very heart of industrial relations and the philosophy of collective action. You have stumbled upon a distinction that legal theorists and unionists have wrestled with for a century. To resolve it for your narrative, we must dissect the logic of both accounts, test them against the mechanics of rights, and finally consider where the human tragedy lies.

  ### The Two Accounts Compared

  The first account (Strike-First) posits that the withholding of labour is the primal act. On this view, organisation is merely a force multiplier—a way to make the strike louder, longer, and more painful for the employer. It treats the union as a tool, akin to a picket sign or a strike fund. If the tool becomes cumbersome, the logic suggests it should be set aside in favour of the act itself. This view resonates with syndicalist traditions and the raw morality of the shop floor: *we stop, they pay.*

  The second account (Organise-First) argues that organisation is constitutive, not merely instrumental. It suggests that without a recognised structure, a 'strike' is legally and economically indistinguishable from a mass breach of contract or collective resignation. On this view, the right to organise creates the *status* that allows the strike to be recognised as a protected industrial action rather than a sacking offence. The organisation is the vessel; the strike is the cargo. Without the vessel, the cargo drowns.

  ### Which Account is More Defensible?

  The second account—that the right to organise is a second-order right conditioning the right to strike—is the more defensible, both philosophically and practically.

  Philosophically, this aligns with the understanding that rights in an industrial society are rarely 'natural' liberties but are constructed through recognition. An individual has a liberty to stop work, but in a capitalist economy, that liberty carries the consequence of termination. To transform that liberty into a meaningful right, one requires a counter-power. That counter-power is the organisation.

  Practically, international labour law supports this hierarchy. The International Labour Organization's Convention 87 (Freedom of Association) is the bedrock; the right to strike is derived from it as a means to defend collective interests. In British law, for instance, there is no positive 'right to strike'; rather, there are statutory immunities granted to *trade unions* that protect them from liability for inducing breach of contract. The protection flows from the organised body, not the individual act. Therefore, organisation is logically prior: it creates the legal space in which the strike can occur without ruin.

  ### Liberty vs. Claim-Right

  The distinction becomes sharpest when you ask whether the right to strike is a mere liberty or a claim-right.

  If it is a **liberty** (in the Hohfeldian sense), it means the worker has no duty to work, but the employer has no duty to retain them. Account 1 (Strike-First) functions adequately here. A worker is free to leave, and a group is free to leave. But this is a fragile freedom; it is the freedom to be dismissed.

  If it is a **claim-right**, it entails a correlative duty in others (the employer, the state) not to interfere or punish. Account 1 collapses here. An employer has no duty to tolerate an unorganised stoppage. Account 2, however, explains how a claim-right is generated. Through organisation (collective bargaining recognition), the workers impose a duty on the employer to negotiate and, by extension, to tolerate the pressure tactic (the strike) that makes negotiation meaningful.

  Thus, if your characters view the strike as a claim-right (something they are *owed* protection for), they must logically accept Account 2. You cannot have the protection without the structure that negotiates it.

  ### Handling the Awkward Cases

  The superiority of Account 2 is further revealed when we apply it to the complexities you mentioned:

  1.  **The Wildcat Strike:** Under Account 1, a wildcat strike (unofficial, without union blessing) is the purest form of the right to strike. Under Account 2, it is a paradox. It exercises the first-order right while bypassing the second-order condition. Account 2 explains why wildcats are often vulnerable: because they lack the organisational shield (funds, legal immunity), the workers are exposed to dismissal. Account 1 cannot explain why such a 'fundamental liberty' leaves them defenceless.
  2.  **Secondary Action:** This involves striking against an employer not directly involved in the dispute. Account 1 might justify this as solidarity (extending the strike). Account 2 restricts it. If the right to strike is derived from the organisational relationship with a specific employer, action against a third party strains the 'condition' of the right. This explains why secondary action is often the first thing restricted by law; it detaches the strike from the organisational framework that legitimises it.
  3.  **No-Strike Clauses:** Here, workers trade the right to strike for security or higher pay. Account 1 views this as alienating a fundamental liberty—something one should not be able to sell. Account 2 views it as a procedural adjustment within the organisational framework. The organisation remains (the second-order right), but it agrees to suspend the exercise (the first-order right) to ensure longevity. Account 2 makes sense of why unions sign these deals; Account 1 views it as heresy.

  ### The Novelistic Betrayal

  You ask which account a character could plausibly misunderstand in a way that damages those he means to serve.

  While the error of Account 1 (leading a wildcat without support) is a classic tragedy of hubris, the more interesting and insidious betrayal lies in a misunderstanding of **Account 2**.

  Imagine a character—a union representative or a seasoned organiser—who genuinely believes Account 2 is correct. He believes the Organisation is the precondition for all power. However, he misunderstands the *relationship* between the condition and the exercise. He comes to believe that the preservation of the Organisation is the *end*, rather than the *means*.

  **The Betrayal:**
  This character argues that to save the Union (the second-order right), they must not risk it on a Strike (the first-order exercise). He persuades the workers to accept a no-strike clause or to vote down industrial action, arguing that 'if we strike and lose, the Union will be broken.' He treats the Organisation as a fragile museum piece to be protected from the very workers it is meant to empower.

  In doing so, he preserves the shell—the union hall, the dues, the recognition—but neuters the power. He saves the condition for exercising rights while ensuring the rights are never exercised. Over time, the workers realise they have a union that cannot fight. The Organisation survives, but it becomes a instrument of management discipline rather than worker defence.

  **Why this is more compelling:**
  1.  **Plausibility:** This is a historically common trajectory in mature trade unionism. It allows for a character who is not corrupt, but tragically misguided. He believes he is being prudent.
  2.  **Complexity:** It avoids the melodrama of the 'scab' or the 'agent provocateur'. This character loves the workers but misunderstands the nature of the power he holds.
  3.  **Thematic Resonance:** In a mill town, where institutions often outlive the individuals, the idea that the institution might consume its purpose is a potent metaphor. It explores the tension between survival and integrity.

  ### Recommendation for Your Draft

  I advise you to resolve the conceptual difficulty in favour of **Account 2**. It is the more robust, legally grounded, and sociologically accurate position. It provides the 'hard truth' of your setting: that without structure, passion is easily crushed.

  However, let the dramatic tension arise from a character who accepts Account 2 but inverts its morality. Let him be the guardian of the Union who inadvertently becomes the jailer of the workers. He will argue that the right to organise is too precious to risk on the right to strike. Your protagonist, perhaps, must realise that an organisation that will not strike is no organisation at all—that the second-order right is worthless if it forbids the first.

  This allows you to honour the complexity of the labour movement: the strike is the sword, but the union is the hand. A hand that refuses to wield the sword is useless, yet a sword without a hand is merely a fallen weapon. The tragedy lies in forgetting which serves which.
