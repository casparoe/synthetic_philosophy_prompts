  **JOINT STATEMENT ON INFINITE ETHICS AND LONGTERMIST PRIORITIZATION**

  **Signatories:** [Source A] and [Source B]
  **Date:** October 26, 2023
  **Subject:** Clarifying the impact of infinite future scenarios on decision theory and cause prioritization.

  ### Preamble
  We have engaged in extensive debate regarding the implications of an potentially infinite future for longtermist ethics. While we disagree on the normative conclusions, we recognize that public discourse has conflated mathematical technicalities with moral paralysis. To advance the field, we issue this joint statement to delineate where the standard models break, where they hold, and precisely where our disagreement lies.

  ### Part I: Agreed Claims
  *We both endorse the following five claims as the baseline for future discussion.*

  1.  **The Breakdown of Standard Expected Value:** If an agent assigns a nonzero credence to a future containing infinite positive value, and adheres to standard Expected Utility Theory (EUT) using the "Total View" (summing welfare), the expected value of all actions becomes undefined or infinite. Under these specific mathematical conditions, standard EUT cannot rank policies.
  2.  **Finite Differences Persist:** Even if the total sum of value in the future is infinite, our actions today can still causally determine whether specific, finite sets of lives are good or bad. We agree that causing suffering to a finite number of beings is distinguishable from not doing so, regardless of the background infinity.
  3.  **Empirical Uncertainty:** Whether the future is physically or metaphysically infinite is an open empirical and philosophical question. It depends on cosmology (e.g., eternal inflation), digital physics (e.g., infinite simulations), and population dynamics. It is not a settled fact.
  4.  **No Immediate Paralysis:** The mathematical breakdown of standard EUT does not logically entail that we must cease all decision-making. Agents must still act, implying that either our axiology (theory of value) or our decision theory requires extension, not abandonment.
  5.  **The "Swamping" Risk:** We agree that if infinite outcomes dominate expected value calculations, finite-scale concerns (e.g., near-term poverty alleviation) risk being ignored *unless* a framework is adopted that preserves sensitivity to finite changes within infinite contexts.

  ### Part II: Semantic Clarification on "Value"
  *A significant portion of our debate stems from differing definitions of "better" in infinite contexts.*

  *   **Source A** operates primarily under the **Total View**: The value of a world is the strict sum of welfare of all beings within it. In this framework, if World 1 has $\infty$ welfare and World 2 has $\infty + 1$ welfare, they are axiologically equivalent ($\infty = \infty$).
  *   **Source B** operates under an **Extended Axiology** (e.g., Average Utilitarianism, Critical-Level, or Spatiotemporal Density): The value of a world is determined by metrics other than the raw sum, such as the density of welfare per unit of spacetime, or the Pareto principle (if World 2 is better for some and worse for none, World 2 is better).

  **Agreement:** We acknowledge that if Source A adopts Source B's axiology, the "paralysis" problem largely dissolves. The core dispute is whether the Total View is mandatory for longtermism.

  ### Part III: Core Cruxes and Predictions
  *We disagree on the following specific claims. For each, we identify an argument we both agree is relevant, and we state our predictions in advance to allow for future resolution.*

  | Crux | The Disagreement | The Agreed Argument / Evidence | Source A Prediction | Source B Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Probability Sensitivity** | **Can current policy change the probability of an infinite future?**<br><br>**A:** No. The probability is dominated by background physics/metaphysics (e.g., whether the universe expands forever). Policy changes are negligible.<br><br>**B:** Yes. Existential risk reduction extends the lifespan of civilization, which is a necessary condition for realizing infinite potential (e.g. via simulation or expansion). | **The "Duration Chain" Argument:** If infinite value requires a civilization to survive for a duration $T$, and current policy increases expected survival time from $t$ to $t + \Delta t$, does this shift the probability mass of "Infinite Outcome"? | Reducing existential risk by 10% will change the credence in an "Infinite Future" by less than 0.01%. The probability is binary based on physics, not survival. | Reducing existential risk by 10% will increase the expected *duration* of civilization significantly, thereby increasing the probability of triggering infinite-generating processes (like ancestor simulations) by a measurable margin. |
  | **2. Comparability of Infinities** | **If two futures are both infinite, is one preferable?**<br><br>**A:** No (under Total View). You cannot rank them. Therefore, we cannot prioritize long-term policies over short-term ones if both lead to infinity.<br><br>**B:** Yes. We can rank them by density, order of growth, or finite differences. Longtermism survives because we can prefer "Dense Infinity" over "Sparse Infinity." | **The "Finite Addition" Thought Experiment:** In an already infinite future, if we can add 1 billion happy lives at zero cost, should we do it? | **Indifferent.** Since the total sum remains $\infty$, the action has no expected value gain. We should be indifferent between doing it or not. | **Yes.** A world with $\infty + 1$ billion happy lives is strictly better than a world with $\infty$. Refusing to add them is a moral failure. |
  | **3. Decision Theory Stability** | **Does infinite ethics require abandoning Longtermism?**<br><br>**A:** Yes. If we can't rank outcomes, the "Long Term" cannot be prioritized over the "Short Term." The project loses its computational anchor.<br><br>**B:** No. We can use "Finite Difference" decision rules. We optimize for the finite difference we control, treating the infinite background as a constant. | **The "Hemlock" Test:** If a policy guarantees a finite amount of suffering now to secure a potential infinite future, is it permissible?<br>*(Note: Both agree this is risky, but disagree on the calculus.)* | **No.** Because the infinite future is already probable (or improbable) regardless, trading finite certainty for infinite uncertainty is irrational gambling. | **Yes, conditionally.** If the finite cost is low and the probability shift (see Crux 1) is positive, the "finite difference" in the infinite future justifies the cost. |

  ### Part IV: Commitment to Resolution
  We commit to revisiting these predictions in five years. Specifically, we will evaluate whether models of existential risk reduction (Source B's claim) have successfully demonstrated a causal link to increased probability of post-human infinite expansion, or whether cosmological constraints (Source A's claim) have rendered such policy interventions irrelevant to the infinite question.

  Until then, we urge policymakers to note that **infinite ethics complicates the calculus but does not necessarily negate the imperative to reduce existential risk.** The disagreement is not about whether the future matters, but about the mathematical machinery required to measure it.

  ***

  **Signed,**

  [Source A]
  [Source B]
