      *   **Key Concept:** Nyāya treats testimony (*śabda*) as a独立 (independent) source of knowledge (*pramāṇa*), alongside perception (*pratyakṣa*), inference (*anumāna*), and comparison (*upamāna*).
      *   **Specific Constraints:**
          *   Keep the plot straight (no invented scenes).
          *   Audience has seen the film twice (no plot summary needed, just analysis).
          *   No reading lists, citations, or bibliography.
