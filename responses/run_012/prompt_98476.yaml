      Interrogator and Respondent chambers must maintain a minimum separation of fifteen meters, intervening space occupied by standard attenuation material (lead-lined drywall or equivalent). Facilities utilizing Faraday-Varley cages must certify grounding integrity weekly. It is insufficient to merely prevent acoustic or visual cues; the protocol requires attenuation of direct cognitive resonance. Shielding efficacy shall be verified via standardized sender-receiver dyads prior to each evaluation cycle. If the shielding coefficient drops below 0.85, the facility is deemed compromised. Note that shielding is intended to normalize the background psychonic field, not necessarily to eliminate it entirely, as total elimination may induce artificial null results (see Appendix A).

      **3.0 DIRECTIONAL LEAKAGE AND AUDIT ASYMMETRY**
