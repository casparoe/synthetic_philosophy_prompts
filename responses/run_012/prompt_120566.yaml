  ### The job the slogan was doing

  You argued that archival silence regarding enslaved households is structural data, revealing the record-keepers' priorities rather than merely obscuring reality. You treated the gap as informative about power. The slogan was invoked to block this inference entirely. By asserting that silence proves nothing, your colleague treated the lack of documents as epistemologically neutral, forbidding you from drawing conclusions about the social order from what was not written. It stopped you from turning the archive's bias into an object of study itself. It was a rhetorical move.

  ### The menu

  1. **The Logical Tautology.** This reading claims that if no search for evidence has occurred, one cannot infer non-existence from the void. For this to hold, the search space must remain unexamined or undefined by the researcher prior to the claim being made. The verdict is a platitude no one denies; it governs basic inquiry but does not address examined silences where the search was thorough. In your specific case, you have searched the ledgers systematically; this reading does not apply to your systematic review of the plantation papers. It is a warning against laziness, not a critique of your method.

  2. **The Probabilistic Caution.** This reading claims that failure to find evidence lowers confidence in a hypothesis but never reduces probability to zero. For this to hold, there must be a known or estimable rate of detection and preservation within the specific archive being consulted by the historian. The verdict is a substantive thesis that is defensible; it warns against certainty but allows for probabilistic inference regarding enslaved arrangements. It suggests you should hedge your claims rather than abandon them entirely. It admits silence is informative but insists it is not conclusive proof of non-existence on its own.

  3. **The Archival Imperfection.** This reading claims the surviving corpus is a non-random sample; silence may reflect material loss rather than historical reality. For this to hold, preservation conditions must be unrelated to the content's social meaning or administrative value to the planters. The verdict is a substantive thesis that is defensible; it reminds us that accidents of survival mimic structural silence in plantation records. However, it assumes loss is random, which is often not true for managed estates. It suggests fire or rot, not bias, caused the gap you are analyzing.

  4. **The Structural Blindspot.** This reading claims record-creating institutions ignore subjects that do not serve their administrative or economic needs. For this to hold, record creation must be purposive, exclusionary, and tied to power dynamics among owners and enslaved people. The verdict is a claim that is false as stated by the colleague; this actually supports your argument that silence is data about the institution. It validates your view that the gap reveals the logic of enslavement itself. Your colleague used the slogan to deny this, but the slogan here contradicts their dismissal.

  5. **The Metaphysical Gap.** This reading claims events occur in the past that leave no physical trace whatsoever capable of recovery by historians. For this to hold, it requires a definition of trace broader than documents, encompassing all causal impacts on the material world. The verdict is a formulation too vague to assess; philosophically contentious depending on one's theory of causality and material persistence. It risks making history impossible by suggesting some truths are permanently inaccessible. It implies your question might be unanswerable regardless of methodological sophistication.

  6. **The Methodological Prohibition.** This reading claims historians cannot build positive arguments solely on silence without positive corroboration from other independent sources. For this to hold, it must be true within standard empirical historiography where negative evidence is considered weak without controls. The verdict is a substantive thesis that is defensible; it is a rule of thumb for avoiding speculation about household structures. It demands you find diaries or oral histories to confirm the ledger's silence. This is likely the professional norm your colleague was invoking to protect against overreach.

  7. **The Neutral Silence Claim.** This reading claims silence carries no information about the system producing the records; it is merely empty space waiting to be filled. For this to hold, records must be passive mirrors of reality rather than active constructions shaped by human intent. The verdict is a claim that is false as stated; it denies the agency of the archivist and the state in shaping the record. This is the reading your colleague likely used to shut down your structural argument. It treats the archive as a neutral container rather than a product of power.

