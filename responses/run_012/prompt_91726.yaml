answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** Chair, Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Framework and Recommendation: "Moral-Value Anchor" Applications (Cycle 44)

  ### 1. Executive Summary

  We are currently reviewing three applications (Applicants A, B, and C) proposing interventions based on the prevention of outcomes defined as having **infinite disvalue**. Applicant A (the primary case) requests $2M for implementation, arguing that any non-zero probability of preventing infinite loss yields infinite Expected Value (EV), thus dominating all finite considerations.

  After reviewing the mathematical validity of the claim, the fiduciary constraints of our $20M fixed budget, and the strategic implications for the foundation, I recommend the following:

  1.  **Reject** the $2M implementation requests for all three applications in this cycle.
  2.  **Offer** each applicant a **$500k "Epistemic Verification" Grant** (Total: $1.5M). These funds are strictly for formalizing the probability estimate, stress-testing the "infinity" claim, and prototyping the mechanism's feasibility.
  3.  **Reallocate** the remaining $4.5M (from the original $6M requested) to the highest-ranked finite-EV projects in our pipeline to ensure we meet our fiduciary duty to commit the full $20M this cycle.
  4.  **Establish** a "Right of First Refusal" policy: If an applicant successfully verifies their claims during the Verification phase, they will be prioritized for implementation funding in Cycle 45, potentially via emergency reallocation if necessary.

  This approach accepts the theoretical weight of the infinite-stakes argument while addressing the operational impossibility of comparing competing infinities without better data.

  ### 2. Analysis of the Infinite EV Claim

  Three committee members have correctly noted that we cannot dismiss the applicant's core mathematical premise. If an outcome is truly infinitely bad ($-\infty$) and the intervention has a non-zero probability ($p > 0$) of preventing it, the Expected Value is indeed infinite. Refusing to fund based solely on the smallness of $p$ is inconsistent with our mandate to reduce existential risk.

  However, accepting the math does not compel us to fund the *implementation* request as currently structured. We face three specific decision-theoretic hurdles that the current applications do not clear:

  **A. The Problem of Competing Infinities**
  We have three applications claiming infinite EV. Mathematically, $\infty = \infty$. If we fund all three, we spend $6M. If we receive ten such applications next year, do we fund all ten? If we fund every project with a claimed infinite EV, our budget becomes entirely consumed by unverified infinite claims, leaving zero capital for finite, high-probability risk reduction. We need a tie-breaking mechanism. Since the EVs are formally identical (all infinite), the only variable we can optimize is the **credibility of the probability estimate ($p$)**.

  **B. The Value of Information (VoI)**
  In high-stakes decision theory, when the stakes are maximal, the marginal value of reducing uncertainty about the *probability* often exceeds the marginal value of immediate implementation.
  *   **Current State:** We are being asked to bet $2M on a probability estimate ($10^{-14}$) provided by the applicant without independent verification. Human intuition is notoriously poor at distinguishing between $10^{-6}$ and $10^{-14}$.
  *   **Proposed State:** By funding a Verification phase, we purchase information. If the verification shows the mechanism is impossible or the "infinity" is ill-defined, we save $1.5M per project. If verification increases our confidence in $p$, the subsequent implementation becomes a much stronger candidate.
  *   **Conclusion:** Even for an EV maximizer, the highest-leverage action *today* is not building the anchor, but proving the anchor can hold.

  **C. The Definition of "Infinite"**
  Our fiduciary duty requires us to ensure funds are used for *actual* risk reduction, not conceptual artifacts. Several applications define "infinite disvalue" in ways that may be philosophically coherent but operationally indistinguishable from very large finite numbers. We cannot allocate 30% of our annual budget ($6M of $20M) to claims where the core metric (infinity) has not been stress-tested against our investment criteria.

  ### 3. Recommendation and Conditions

  **Decision:** **Fund with Conditions (Phase 1 Verification).**

  **The Offer:**
  We will offer Applicants A, B, and C a grant of **$500,000 each** for a 12-month Verification Phase.

  **Conditions for Verification Funding:**
  1.  **Independent Audit:** Applicants must submit their probability models and definitions of "infinite disvalue" to a panel of three external experts (one mathematician, one philosopher, one domain specialist) agreed upon by the Foundation.
  2.  **Mechanism Prototype:** Applicants must demonstrate a working prototype of the "institutional machinery" or a rigorous proof of concept that the proposed intervention is physically/logically possible.
  3.  **Comparative Analysis:** Applicants must explicitly model why their intervention dominates the other two infinite-claim applications in this cycle (i.e., why their $p$ is higher or their mechanism is more robust).

  **Conditions for Future Implementation (Cycle 45):**
  1.  Successful completion of the Verification Phase does not guarantee the full $2M. It grants priority status.
  2.  Implementation funding is contingent on the Verification Panel assigning a credibility score to $p$ that exceeds a threshold set by the Committee (e.g., $p > 10^{-9}$ with high confidence).

  **Budget Reallocation:**
  The $4.5M remaining from the original $6M request will be immediately deployed to the next tier of finite-EV projects (Applications D through H). This ensures we meet our bylaws requiring the full $20M commitment this cycle.

  ### 4. Handling the Pipeline

  This decision sets a precedent for all future "Infinite Value" claims.
  *   **Policy:** Any application claiming infinite EV must undergo a mandatory Verification Phase before implementation funding is considered.
  *   **Rationale:** This prevents "Pascal's Mugging" dynamics (where bad actors exploit the infinity argument) without ruling out genuine infinite-stakes opportunities. It treats the *claim* of infinity as a hypothesis to be tested, not a premise to be accepted.

  ### 5. Uncertainty and Potential Errors

  I want to be transparent about where this reasoning is most vulnerable. My recommendation relies on two assumptions that could be wrong:

  **Assumption 1: Time Insensitivity**
  *   **The Risk:** This recommendation assumes we have time to verify. If the "infinitely bad" outcome is imminent (e.g., possible within the next 12 months), a 12-month Verification Phase guarantees failure.
  *   **Why I might be wrong:** The applicants argue the risk is ever-present. If there is a specific, narrow window of opportunity closing *this cycle*, delaying for verification reduces $p$ to zero.
  *   **Mitigation:** As part of the Verification Grant, applicants must certify the timeline. If they can prove the window closes before verification is complete, we will expedite to a 4-week rapid review.

  **Assumption 2: Linearity of Credibility**
  *   **The Risk:** I am assuming that increasing our confidence in $p$ is valuable. However, if the true nature of the risk is such that *any* non-zero $p$ demands immediate action regardless of magnitude (a "lexicographic" preference), then verification is a waste of resources.
  *   **Why I might be wrong:** Some decision theories suggest that if the stake is truly infinite, you act on the first non-zero signal.
  *   **Mitigation:** Our fiduciary duty to the *portfolio* prevents this. We have three competing signals. We cannot act on all three fully. We must triage. Verification is the triage mechanism.

  ### 6. Flip Conditions

  I am prepared to change my recommendation to **Full Implementation Funding ($2M)** immediately if either of the following conditions is met before the vote:

  1.  **Independent Confirmation:** An external audit (commissioned by us, paid from operational reserves) confirms that the mechanism is feasible and the probability estimate is conservative (i.e., true $p$ is likely higher than $10^{-14}$).
  2.  **Uniqueness Proof:** The applicant demonstrates conclusively that their project is the *only* possible intervention for this specific risk (eliminating the "Competing Infinities" problem) AND that the window for action closes within 6 months.

  ### 7. Conclusion

  We are not rejecting the possibility of infinite stakes. We are rejecting the idea that an unverified claim of infinite stakes bypasses the need for due diligence. By funding Verification, we respect the EV argument (by taking the claim seriously enough to test it) while honoring our fiduciary duty (by not betting 30% of our budget on unproven inputs).

  Please review the attached term sheets for the Verification Grants. I propose we vote on this framework on Thursday.

  ***

  **Chair's Note:** I welcome pushback, specifically on the "Time Insensitivity" assumption. If any committee member has evidence that delay equates to failure, please bring it to the table before Thursday. I would rather be overruled on urgency than fail on diligence.
