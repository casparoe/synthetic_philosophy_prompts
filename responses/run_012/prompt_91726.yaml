      *   *Budget Math:* $20M total. 40 grants avg $500k. This $2M request is 4x average.
      *   *Decision:* Reject the $2M implementation. Offer $250k Verification Grant (scaled up to make it meaningful). That leaves $1.75M to be distributed among other high-quality finite projects. This keeps the budget committed.

