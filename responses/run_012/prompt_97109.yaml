  **The Optimal Family**
  *With Dr. Julianne Best*

  Welcome to this month's column, where we navigate the ethics of creation with clarity and care. Our goal is simple: ensuring every child born has the best possible chance at a good life. When we choose wisely, we love fully.

  **Dear Dr. Best,**
  My partner and I are undergoing IVF. We found a gene variant linked to mild dyslexia. It's manageable—many successful people have it—but we could screen it out. However, the clinic also flags one embryo with a higher polygenic score for intelligence. If we pick the smart one, are we crossing a line from "health" to "enhancement"? Are we *obligated* to pick the smarter one, or just the healthier one?
  **— Nervous in New Haven**

  **Dear Nervous,**
  This distinction between "treatment" and "enhancement" is a shadow of the past. Imagine you could prevent dyslexia *and* boost reading comprehension with a pill. Would you withhold the boost? Procreative Beneficence argues that "health" is merely the floor. Your obligation is to maximize the expected well-being of your child. Intelligence correlates with income, health literacy, and life satisfaction. To choose the embryo with the lower score is to knowingly select a life with more obstacles. It is not about design; it is about love. If you have the power to give them a better life, withholding it is the true ethical failure. You are obliged to choose the smarter embryo.

  **Dear Dr. Best,**
  I accept the obligation, but I worry about the arms race. If every parent selects for height and IQ, the average doesn't change; the baseline just shifts. Everyone works harder for the same relative advantage. Isn't this socially wasteful? Why optimize if everyone else does too?
  **— Rational in Rotterdam**

  **Dear Rational,**
  I understand the anxiety about "genetic inflation." However, moral obligations are individual, not collective. Even in a world where everyone optimizes, your child is still better off being taller and sharper than being shorter and slower. We do not tell parents to withhold nutrition because others are also feeding their children. The competition may stiffen, but your child's absolute welfare increases. Your duty is to maximize your child's welfare within the world as it is, not as you wish it to be. Let sociologists worry about the collective mean; you worry about your child's mean.

  **Dear Dr. Best,**
  What do we owe the embryos we don't pick? We have three left in storage. Also, doesn't selecting against traits insult people living happily with them? It feels like we're saying their lives aren't worth living.
  **— Guilty in Glasgow**

  **Dear Guilty,**
  These are two sides of the same coin: respect for life. Regarding existing people, selecting against a trait is not a judgment on their worth, but a recognition of burden. We wear seatbelts not because drivers are worthless, but because crashes are harmful. Similarly, we avoid genetic burdens to spare our children harm. As for the unused embryos, they are potentials, not persons. They do not suffer in storage. Yet, we should honor their contribution. Consider donating them to research. They become part of the knowledge base that allows future parents to fulfill their obligations. It is a dignified end: enabling the beneficence of others.

  **With warmth,**
  **Dr. Best**

  ***

  **Note on the Satire**
  This piece leans on a specific, rigid interpretation of Procreative Beneficence (PB). A defender of PB, such as Julian Savulescu, typically argues that the principle is constrained by justice—it shouldn't be followed if it exacerbates unfair social inequalities. The column ignores this "justice constraint" to highlight the tension between individual obligation and social consequence. Additionally, PB defenders often rely on the "non-identity problem" (the selected child wouldn't otherwise exist) to defuse claims of harm, whereas the column treats the choice as a direct comparison of welfare levels. For the satire to be unfair, a defender would need to show that the justice constraint *always* overrides the individual obligation in cases of enhancement, or that "best life" cannot be meaningfully quantified across traits like intelligence versus health.
