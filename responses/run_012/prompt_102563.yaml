answer: |-
  You measure **Motion** as a vector state,
  I read the texts that speak of living **Force**,
  Where every object seeks its proper **Place**.
  To them, a stopped stone is in natural **Rest**,
  Not waiting for a push to move the **Body**,
  But settled in the order of its **Kind**.

  We share the lexicon, not quite the **Kind**,
  When you describe the rectilinear **Motion**,
  I hear the weight of falling **Body**,
  Dragged down by gravity, not inner **Force**.
  You say equilibrium is merely **Rest**,
  I see a homecoming to central **Place**.

  I point to where you mark the coordinate **Place**,
  You see a slot within a neutral **Kind**,
  I see a pause, a breathing, temporary **Rest**.
  You chart the graph of uniform **Motion**,
  I feel the strain of the resisting **Force**,
  The heavy ache inside the material **Body**.

  Sometimes I bridge the gap of **Body**,
  And show you how the archer finds the **Place**,
  Where tension holds before the release **Force**.
  You nod, accepting friction as a **Kind**
  Of drag that slows the projectile **Motion**,
  Until the arrow finds its target **Rest**.

  But then I try to explain the natural **Rest**,
  Of earth returning to the cosmic **Body**,
  You ask for data on the thermal **Motion**.
  I gesture to the ground, the empty **Place**,
  You look for particles of every **Kind**,
  I have no units for this missing **Force**.

  You calculate the net applied **Force**,
  I watch the system settle into **Rest**,
  You sort the data by statistical **Kind**,
  I touch the warm and solid **Body**,
  You fill the grid of abstract **Place**,
  I watch the history of **Motion**.

  I hold the old terms, **Force** and **Body**,
  You keep the new states, **Rest** and **Kind**,
  Glossary: **Motion**, **Place**, **Force**, **Body**, **Rest**, **Kind**—
