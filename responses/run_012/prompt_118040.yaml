answer: |-
  To stop shifting the goalposts, you must treat a definition of art not as a description of what you like, but as a technical specification for a classification system. A robust account must function like a legal code: it needs to handle precedent (history), jurisdiction (culture), and edge cases (the absurd).

  Below is the specification. I have separated the **Non-Negotiable Constraints** (logical necessities for the system to function) from **Contested Verdicts** (where your personal preference will dictate the theory you choose). Finally, I have exposed the logical inconsistency inherent in the list.

  ### The Specification

  #### 1. The Indiscernibility Constraint
  *   **The Case:** The urinal in the gallery (*Fountain*) versus its identical twin in the plumbing shop.
  *   **The Requirement:** The definition must distinguish between two physically identical objects where one is art and the other is not, based on properties *other* than sensory perception.
  *   **Why it is Non-Negotiable:** If a definition relies solely on beauty, form, or craft, it fails this test. Since we accept (in modern discourse) that the gallery urinal is art and the shop urinal is not, any theory that cannot account for this difference is extensionally inadequate. It is not prejudice; it is a logical necessity that art status does not supervene solely on physical properties.
  *   **Status:** **Non-Negotiable.**

  #### 2. The Intentional Stability Constraint
  *   **The Case:** The forger's painting before and after the experts catch him.
  *   **The Requirement:** The definition must determine whether art status is intrinsic to the object's history or extrinsic to its reception. If it is art before discovery, the definition must rely on successful *representation* of intent. If it ceases to be art upon discovery, the definition must rely on *social trust*.
  *   **Why it is Non-Negotiable:** A definition cannot allow ontological fluctuation (it is art on Monday, not art on Friday) without a change in the object or its context. The theory must pick a lane: is art a historical relation or a present status?
  *   **Status:** **Non-Negotiable** (The theory must choose a consistent mechanism, even if you prefer one outcome over the other).

  #### 3. The Human Agency Constraint
  *   **The Case:** The child's drawing and the trained artist's lookalike; the elephant that paints.
  *   **The Requirement:** The definition must specify the necessary degree of cognitive intent. Does the maker need to understand they are making 'art', or merely intend to make a mark?
  *   **Why it is a Preference:** This is where you must stop shifting. If you include the elephant, you abandon 'artistic intent' for 'creative output'. If you exclude the child, you demand 'professional competence'. You cannot have a definition that includes the artist's lookalike but excludes the child without a criterion of *training*, which is sociologically arbitrary.
  *   **Status:** **Contested Verdict** (You must decide if 'Human' and 'Intentional' are hard filters).

  #### 4. The Reception Independence Constraint
  *   **The Case:** The novel in a drawer nobody ever reads; the piano piece where nothing gets played (4'33").
  *   **The Requirement:** The definition must accommodate art that is never experienced, or art that consists of the *potential* for experience rather than sensory stimulation.
  *   **Why it is Non-Negotiable:** If art requires an audience, the unread novel is not art until found. This contradicts our intuition that the work existed in the drawer. If art requires sensory input, the silent piece fails. A robust definition must allow for art as an *entity* rather than an *event*.
  *   **Status:** **Non-Negotiable.**

  #### 5. The Retrospective Validity Constraint
  *   **The Case:** The pot that sat unrecognized in the ground for three thousand years.
  *   **The Requirement:** The definition must allow for objects created without 'artistic intent' to acquire art status through later contextualisation.
  *   **Why it is a Preference:** This directly conflicts with the Human Agency Constraint. If you demand the pot be art, you admit original intent is unnecessary. If you demand original intent, the pot is merely an artefact. Most modern theories prioritise the museum's status over the potter's intent, but this is a choice, not a logical truth.
  *   **Status:** **Contested Verdict.**

  #### 6. The Sovereignty Constraint
  *   **The Case:** The craftsperson who'd deny making art; things from cultures with no word for art.
  *   **The Requirement:** The definition must decide who holds the authority to classify: the maker, the viewer, or the institution.
  *   **Why it is Non-Negotiable:** A system cannot have multiple ultimate authorities. If the craftsperson says "this is not art" and the gallery says "this is art", the definition must specify whose classification overrides. To ignore the cultural context (the society with no word for art) is to impose colonial categories; to accept it fully is to dissolve the category of 'art' entirely into 'culture'.
  *   **Status:** **Non-Negotiable** (The theory must assign authority, even if you dislike the assignment).

  ---

  ### The Inconsistency

  You asked to see where the list breaks. It breaks at the junction of **Requirement 1 (Indiscernibility)**, **Requirement 3 (Human Agency)**, and **Requirement 5 (Retrospective Validity)**.

  You cannot satisfy all three simultaneously.

  1.  To solve the **Urinal** (Req 1), you must allow that context/intention makes the art, not the object.
  2.  To solve the **Elephant/Child** (Req 3), you must insist on specific *human* cognitive intent to distinguish them from accidents or animals.
  3.  To solve the **Ancient Pot** (Req 5), you must allow that objects made *without* artistic intent can become art later.

  **The Contradiction:**
  If you insist on **Human Agency** to exclude the Elephant, you must exclude the Ancient Pot (which lacked artistic intent).
  If you allow **Retrospective Validity** to include the Ancient Pot, you cannot use **Human Agency** to exclude the Elephant (as the Elephant's painting could be retrospectively validated by a gallery).
  If you use **Context** to validate the Urinal, you undermine the **Craftsperson's Sovereignty** (Req 6), because the context overrides their denial.

  Any theory you adopt will have to sacrifice one of these intuitions. Most institutional theories sacrifice Agency (allowing the Pot, risking the Elephant). Most intentionalist theories sacrifice Retrospective Validity (keeping the Pot as 'craft', keeping the Elephant out). There is no consistent set that covers all your cases without contradiction.

  ### Final Recommendation

  To stop the goalpost shifting, you must accept that 'Art' is not a natural kind like 'Water' or 'Gold'. It is a status conferred by a specific network of relations. When you argue, do not ask "Is this beautiful?" or "Did this take skill?". Ask which requirement your opponent is willing to sacrifice.

  \answer{The Indiscernibility Constraint}
