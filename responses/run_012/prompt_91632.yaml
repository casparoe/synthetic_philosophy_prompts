      *   **The Verdict:** The Boss's sentence is not a "truth claim" to be verified; it is a "causal hypothesis" to be tested. Priya is wrong to call it meaningless, but right to call it unproven. The Boss is wrong to treat it as fact, but right to treat it as the focus of inquiry.
