      *   **Priya's Statement:** A *general causal generalization* ("If P happens, Q happens more often"). She adheres to a strict empiricist/positivist view (only observable data counts).
      *   **The Tension:** Causality vs. Correlation, Specificity vs. Generality, Actionability vs. Rigor.

