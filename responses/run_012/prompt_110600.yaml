      *   *Triviality:* Re-description is not explanation. It must generate novel predictions or constraints, not just map existing control theory onto variational calculus.
      *   *Markov Blankets:* Must be ontologically robust, not just a modeling convenience. If it's just a math trick, FEP explains nothing about the world, only about our maps.
      *   *Scope:* Universal claims require universal coverage. If it claims to be a principle of *life*, it must cover bacteria and flames (in some sense). Dropping cases weakens the "unification" claim.
      *   *Technical Bookkeeping:* Yes, it must clarify the bound vs. value and the target of action. Ambiguity here fuels the "unfalsifiable" critique.
      *   *Falsifiability:* Yes, even frameworks need falsifiable instantiations. "It's just a framework" is a shield against critique.
      *   *Experience:* Phenomenology is outside the core brief of FEP *as stated*, but a theory of *brains* cannot ignore it forever. However, for the specific FEP desiderata, I will argue it's secondary to the structural claims.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Empirical Novelty.* (Addresses Triviality). It can't just be Bayesian control theory with extra steps.
