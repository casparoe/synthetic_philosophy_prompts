      Okay, I will integrate the specific points into the Desiderata list where they fit best, but I will make sure my stance on them is explicit. Actually, a dedicated section for the "Contentions" followed by the "Desiderata" might be clearer. No, the prompt says "Write me the desiderata... Some things I want either on the list or explicitly argued off it." I will make the Desiderata the core structure and use the contentions to flesh out the justification for each.

