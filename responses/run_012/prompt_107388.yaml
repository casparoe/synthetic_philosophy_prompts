answer: |-
  ### Exam Question

  **Question 1: The Löbian Obstacle and Artificial Self-Trust**

  Consider an artificial agent $A$ operating within a formal system $T$ (e.g., PA or ZFC). $A$ wishes to reason about its own future actions and proofs to ensure goal stability during self-modification. To do this, $A$ desires to adopt the **Global Reflection Principle**: for every sentence $\phi$ in the language of $T$, $A$ accepts $\square_T \phi \to \phi$ (i.e., "If I prove $\phi$, then $\phi$ is true").

  (a) Explain precisely why adopting Global Reflection renders $T$ inconsistent or trivial, invoking Löb's Theorem. Do not simply state Gödel's Second Incompleteness Theorem; you must demonstrate the specific logical mechanism by which the reflection principle collapses the distinction between provability and truth within the system.

  (b) Since a sound agent *is* trustworthy (its proofs *are* true), the failure is one of *self-verification*, not soundness. Characterize a specific, weaker form of self-trust (e.g., restricted reflection schemas or parametric polymorphism) that a consistent agent *can* coherently hold. What capabilities does this restricted trust grant the agent, and what limitations does it impose on recursive self-improvement?

  ***

  ### Model Answer

  The Löbian obstacle arises not because an agent is untrustworthy, but because a formal system cannot contain its own truth predicate without collapsing. The desire for **Global Reflection** ($\forall \phi: \square \phi \to \phi$) is a desire for the system to internalize its own soundness. However, Löb's Theorem states that for any sentence $\phi$, if $T \vdash \square \phi \to \phi$, then $T \vdash \phi$.

  The mechanism of failure is subtle. If we add Global Reflection as an axiom schema to $T$, then for *any* $\phi$, the system proves $\square \phi \to \phi$. By Löb's Theorem, this entails $T \vdash \phi$. Consequently, the system proves every sentence in its language. If the system is consistent, it cannot prove the reflection principle; if it adopts the principle, it becomes inconsistent (trivial). This is distinct from Gödel's Second Incompleteness Theorem, which forbids proving $\text{Con}(T)$. While $\text{Con}(T)$ is equivalent to $\square \bot \to \bot$ (a specific instance of reflection), Löb's Theorem shows that *any* instance of reflection used as a derivable rule forces the provability of the consequent. Thus, an agent cannot universally trust its own proofs *within* its own logic because doing so eliminates the logical gap required to distinguish "I proved it" from "It is true."

  However, a sound agent *is* factually trustworthy; it simply cannot *prove* this fact universally to itself. To function, an agent must adopt **Restricted Reflection**. A standard viable approach is limiting reflection to $\Sigma_1$ sentences (existential statements). Since $T$ is $\Sigma_1$-complete, if a $\Sigma_1$ sentence is true, $T$ proves it. Conversely, if $T$ is sound, $\square \phi \to \phi$ holds for $\Sigma_1$ sentences. An agent can consistently adopt the schema $\forall \phi \in \Sigma_1: \square \phi \to \phi$.

  This restricted trust allows the agent to verify computational outcomes and halting states, which is sufficient for many practical goals. However, it imposes severe limitations on recursive self-improvement, specifically the "Tiling Agents" problem. If agent $A$ wants to create a successor $A'$ with the same trust capabilities, $A$ must prove that $A'$s actions preserve goals. But if $A'$ operates in the same system $T$, $A$ cannot prove $A'$s soundness using only $T$'s restricted reflection.

  To overcome this, advanced architectures utilize **Parametric Polymorphism** or ordinal analysis. The agent operates in a hierarchy of systems $T_\alpha$. $T_\alpha$ can trust $T_\beta$ where $\beta < \alpha$. An agent can trust a successor that operates at a lower ordinal level, or it can use a parameterized policy where trust is conditional on the proof length or complexity class. This allows for bounded self-modification: the agent can trust its immediate successor to execute specific, verifiable tasks (like $\Sigma_1$ goals), but it cannot guarantee infinite recursive self-improvement without eventually exhausting its ordinal resources or shifting to a stronger meta-system. Thus, coherent self-trust is possible, but it must be hierarchical and bounded rather than global and static.

  ***

  ### Marking Scheme (Total: 20 Points)

  **Part A: Diagnosis of the Löbian Obstacle (10 Points)**

  *   **A Range (9-10 pts):** Explicitly invokes Löb's Theorem ($\vdash \square(\square \phi \to \phi) \to \square \phi$). Explains that adopting $\square \phi \to \phi$ as an axiom allows the antecedent of Löb's theorem to be satisfied, forcing $\vdash \phi$ for all $\phi$. Clearly distinguishes this from Gödel II (not just about $\text{Con}(T)$, but about the implication structure itself).
  *   **B Range (7-8 pts):** Correctly states that Global Reflection leads to inconsistency. Mentions Löb's Theorem but may conflate it slightly with Gödel II (e.g., focuses only on consistency rather than the derivation of arbitrary $\phi$). Explanation of the mechanism is present but less precise.
  *   **C Range (5-6 pts):** States that self-trust is impossible due to incompleteness. Fails to use Löb's Theorem specifically or claims the agent becomes unsound (rather than inconsistent/trivial).
  *   **D/F Range (0-4 pts):** Recites Gödel's theorems without applying them to the reflection principle. Claims the agent simply "cannot know" anything without explaining the logical collapse.

  **Part B: Restricted Trust and Agency Implications (10 Points)**

  *   **A Range (9-10 pts):** Proposes a specific restricted schema (e.g., $\Sigma_1$-reflection, ordinal hierarchies, or parametric polymorphism). Explains *why* it is consistent (e.g., $\Sigma_1$-completeness). Discusses the "Tiling" limitation: restricted trust blocks infinite self-identification in the same system. Connects logic to agency (self-modification/goal preservation).
  *   **B Range (7-8 pts):** Suggests weaker trust (e.g., "trust only some proofs") but lacks technical specificity (fails to name $\Sigma_1$ or hierarchies). Identifies that self-improvement is limited but does not explain the mechanism (e.g., ordinal exhaustion).
  *   **C Range (5-6 pts):** Suggests the agent should just "trust a bit." Fails to address how this avoids Löb's theorem. Ignores the self-modification/tiling context.
  *   **D/F Range (0-4 pts):** Claims the problem is unsolvable. Suggests external verification only. No discussion of internal restricted schemas.

  **Specific Penalties:**
  *   **-3 pts:** Confusing *soundness* (semantic truth) with *provability* (syntactic derivation) in a way that suggests the agent is actually untrustworthy.
  *   **-2 pts:** Failing to mention the Tiling Agents problem or self-modification context in Part B.
  *   **-2 pts:** Word count violation (significant under/over writing indicating lack of synthesis).

  **Grade Thresholds:**
  *   **A (17-20):** Precise logical mechanism in Part A; specific technical workaround in Part B.
  *   **B (13-16):** Correct intuition on Löb; vague or general workaround in Part B.
  *   **C (9-12):** Understands there is a problem; technical explanation flawed.
  *   **D (0-8):** Fundamental misunderstandings of incompleteness or logic.
