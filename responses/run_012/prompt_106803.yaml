      *   *Reading 6: Functional/Computational Gradience.* Information processing complexity is continuous.

      *Refining Verdicts:*
      *   Metaphysical: Controversial (Binary vs. Gradualists).
      *   Evolutionary: True biologically, but doesn't entail metaphysical continuity of *experience*.
      *   Semantic: Plausible (vagueness is real), but doesn't solve the moral problem.
