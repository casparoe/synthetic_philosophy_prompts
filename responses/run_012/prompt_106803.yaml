  *(Refining the "Colleague 2" analysis)*: The claim that the gap is "morally trivial" is a non-sequitur even on a degree view. A difference of 0.05 vs 0.95 is a difference of degree, but morally massive. I need to highlight this logical gap.

  *(Refining "Gradience vs Vagueness")*: This is crucial. Ontic gradience (the property is continuous) does not entail semantic vagueness (the term has no sharp boundary). We can define a sharp boundary on a continuous scale (e.g., voting age).

  *(Final check on constraints)*: No literature survey. Focus on arguments. Menu format.

