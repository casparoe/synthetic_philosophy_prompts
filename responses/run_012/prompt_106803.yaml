      *   *Strongest Objection:* The "Measurement Problem" or "Category Error." You can't quantify qualia linearly. A mouse isn't 0.6 of a human. The *quality* of experience might differ, not just quantity. Also, the "Threshold Objection" (rights might be binary even if sentience is graded).

