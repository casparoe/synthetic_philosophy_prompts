answer: |-
  **Case Analysis: The Regulatory Weaponization of the Therapy/Enhancement Distinction**

  **I. Mapping the Intervention**

  In the standard vocabulary of biomedical ethics, the intervention imposed on the DSD athlete—pharmacological suppression of endogenous testosterone—fits uneasily into the category of therapy. Therapy is traditionally defined as an intervention intended to restore or maintain species-typical functioning or to treat pathology. By the athlete's own physiological lights, there is no pathology to treat; her endocrine system is functioning exactly as her constitution dictates. Consequently, this is not restoration of normal function in the species-typical sense, nor is it prevention of a harm to the athlete's health. It is, explicitly, the suppression of a natural advantage to satisfy a regulatory constraint.

  When we examine the accounts of the therapy/enhancement line, the regulator's rhetoric and actions diverge. The regulator invokes **positional fairness**. The stated aim is not the athlete's welfare (the welfarist account), which is arguably diminished by the imposition of unnecessary medication and the psychological burden of eligibility scrutiny. Nor is the regulator strictly adhering to **species-typical functioning**, as the athlete's functioning is typical for a human male, and arguably typical for her specific developmental trajectory. Instead, the regulator is enforcing a **reference-class norm**. The "normal" function being restored is not the organism's health, but the competitive equilibrium of the "female" category. The regulator is using the language of medical management to enforce a boundary of eligibility. What is being done is neither therapy nor enhancement in the clinical sense; it is *normalization by fiat*. The distinction is being wielded not to protect the athlete from medical harm, but to protect the category from biological variance.

  **II. The Stress Test**

  Applying the **restoration counterfactual** reveals the instability of the baseline. We must ask: toward which baseline does the intervention move the subject?
  1.  **Statistical Norm for the Human Organism:** Her testosterone levels fall within the male-typical range, which is statistically normal for the species *Homo sapiens*. The intervention moves her *away* from this species-wide statistical norm.
  2.  **Subject's Untampered Constitution:** Her baseline is high endogenous testosterone. The intervention moves her *away* from her own physiological set-point.
  3.  **Reference Class Norm:** The relevant class is "elite female athletes." The intervention moves her *toward* the hormonal profile typical of this specific regulatory class.

  These three baselines do not give the same answer. The first two suggest the intervention is a deviation from health or nature; the third suggests it is a correction. The rules are in fact tracking the **reference class norm**. This choice can only be defended if one prioritizes the integrity of the competition category over the bodily integrity of the participant. If the goal of medicine is health, this intervention is unjustified. If the goal of the regulator is parity, the intervention is instrumental.

  The **endogenous/exogenous asymmetry** further stresses the distinction. Had this athlete achieved the same testosterone levels via external injection, the act would be classified as doping—an illicit enhancement. Because the testosterone is endogenous, it is classified as a disqualifying natural advantage that must be medically suppressed. This asymmetry reveals that the therapy/enhancement distinction is not tracking function or biological impact, but **provenance and permission**. The distinction collapses because the moral valence of the hormone level depends entirely on its source relative to the rules, not its effect on the body. If the distinction were truly about function, the physiological impact would matter most. Instead, the distinction is being used to mark the boundary between "eligible biology" and "ineligible biology." It shows the regulator is not interested in whether the trait is therapeutic or enhancing for the *individual*, but whether it is permissible for the *game*.

  **III. The Verdict**

  This case does not confirm the therapy/enhancement distinction; it demonstrates that the distinction was always doing less normative work than its defenders claim, serving instead as a placeholder for deeper judgments about parity and category integrity. In this context, the distinction is silent on the core ethical problem: the right of a governing body to mandate medical intervention for non-medical ends.

  The real normative labour is being done by a separate idea: **parity of competition**. The regulator has determined that for the "female" category to exist as a meaningful contest, certain biological variations must be excluded or suppressed. The therapy/enhancement language is merely the vehicle used to implement this parity. By framing the suppression of testosterone as a condition of eligibility, the regulator effectively invokes the "therapy" side of the line to license a bodily intervention that serves no therapeutic aim for the person on whom it is imposed. This corrupts the welfarist account of medicine. If "therapy" can be defined by the needs of a sporting federation rather than the needs of the patient, the distinction loses its protective power. It becomes a tool of governance rather than a shield for health.

  A brief comparison to the dispute over the bilateral amputee sprinter sharpens this point. In the amputee's case, the question was whether technology provided *more* than normal human function (enhancement). Here, the question is whether biology provides *more* than the allowed category function (disqualification). In both instances, "normal" is not a biological fact but a regulatory construct. In the amputee case, the technology was scrutinized to ensure it did not exceed the species-typical baseline. In the DSD case, the biology is scrutinized to ensure it does not exceed the category-typical baseline. Both cases show that when high-stakes competition is involved, the therapy/enhancement distinction is subordinate to the definition of the "normal" competitor.

  Ultimately, this case refutes the utility of the distinction in regulatory contexts. It shows that when power is applied, the line between treating a disease and managing an advantage is drawn by the entity holding the power, not by the physiology of the subject. The distinction cannot bear the weight of this coercion. It suggests that in graduate seminars, we must stop asking where the line is, and start asking who holds the pen that draws it. The ethical failure here is not the confusion of therapy and enhancement, but the authorization of medical harm in the service of administrative consistency.
