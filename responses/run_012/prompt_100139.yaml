answer: |-
  ### I. Dependency Order

  Establish the following sequence. Do not deviate, or the view will appear arbitrary.

  1.  **The Normative Authority Problem (Minutes 0–15):**
      *   **Must come first.** You must establish that the students feel the pull of two conflicting intuitions: (a) Normativity must be grounded in the agent's own motivational set (Internalism), or it lacks authority over them; and (b) Actual motivations are often irrational, ignorant, or self-destructive, and thus cannot ground what one *ought* to do.
      *   **Why:** If the students do not feel that actual desires are normatively authoritative *but* fallible, the idealization move looks like a stipulation (i.e., "let's just ignore what you want"). The idealization move only looks like an *answer* if it is presented as the only way to preserve Internalism while correcting for fallibility.
  2.  **The Definition of the Counterpart (Minutes 15–25):**
      *   **Must come second.** Define the counterpart strictly as a function of the actual agent's psychological states, modified by specific parameters (information, coherence, etc.).
      *   **Why:** Objections regarding "alienation" (that the counterpart is a stranger) cannot be stated until the students understand the counterpart is generated *from* the agent. Objections regarding "proceduralism" cannot be stated until they know what the counterpart does.
  3.  **The Axis of Idealization (Minutes 25–35):**
      *   **Must come third.** Specify *how* the counterpart is improved (e.g., full information + instrumental coherence vs. full information + substantive value coherence).
      *   **Why:** Objections regarding "selfishness vs. impartiality" depend on knowing which axis is being pushed. If you do not specify the axis, students will assume the axis that fits their preconception.
  4.  **The Verdict/Application (Minutes 35–50):**
      *   **Must come fourth.** Apply the counterpart to the specific case.
      *   **Why:** Objections regarding "determinacy" (whether there is a unique verdict) only arise once a verdict is proposed.
  5.  **The Authority/Determinacy Distinction (Minutes 60–75):**
      *   **Must come last.** Separate the question of *why* the verdict binds from the question of *what* the verdict is.

  ---

  ### II. The One Case

  **The Case:** The "Integrity-Bound Activist."

  **What it must contain:**
  *   **An Agent:** A political activist deeply committed to a specific cause.
  *   **A Conflict:** The activist's actual desire is to sacrifice all personal relationships and health for the cause. They believe this sacrifice is constitutive of their integrity.
  *   **The Counterpart:** The activist's idealized self (fully informed about the causal efficacy of their actions, fully coherent in their belief-desire set, and perhaps possessing enhanced imaginative sympathy for those affected, including the activist themselves).
  *   **The Divergence:** The idealized counterpart endorses stepping back to preserve personal relationships/health, judging the total sacrifice as disproportionate or self-undermining in the long run.
  *   **The Surrender:** The verdict demands the agent surrender the very commitment (total sacrifice) that they currently view as defining their moral identity.

  **What it must leave out:**
  *   **Factual Ignorance:** Do not allow the divergence to hinge on the agent not knowing the charity is a scam or the cause is lost. The agent must know the facts.
  *   **Cognitive Exhaustion:** Do not allow the divergence to hinge on the agent being tired, depressed, or having "not thought long enough." The agent must be resolute and reflective.
  *   **External Morality:** Do not frame the counterpart's verdict as "morality demands it." Frame it as "your own improved self endorses it."

  **Why standard candidates will not do:**
  *   **"Wrong about the facts" (e.g., the bridge is out):** This reduces the view to instrumental rationality. If the only divergence is ignorance, idealization is just "getting the facts." It fails to show how idealization corrects *values*.
  *   **"Has not thought long enough" (e.g., impulsive anger):** This reduces the view to "cooling out." It fails to capture the tension where a reflective, stable actual desire conflicts with a reflective, stable ideal desire. The Activist case forces the question: *If I am fully reflective now, why does my more-reflective self disagree?*

  ---

  ### III. Misconceptions and Intervention Points

  Head off these misconceptions at the exact moments specified. Do not wait for questions.

  1.  **Misconception:** *"Idealized just means thinking harder and longer."*
      *   **When to head off:** **Minute 20**, immediately after defining the counterpart.
      *   **Intervention:** Explicitly state: "The counterpart is not you with more CPU time. The counterpart is you with a different psychological constitution (e.g., no cognitive biases, or different affective responses). It is a counterfactual version, not a future version."
  2.  **Misconception:** *"The idealized verdict is a procedure the agent could follow."*
      *   **When to head off:** **Minute 40**, during the Case Application.
      *   **Intervention:** When a student asks, "So how does the activist *become* the counterpart to decide?" stop them. Say: "The counterpart's verdict defines the *ought*. It is not a decision procedure. You cannot consult your ideal self; you can only theorize about them. If you could consult them, they wouldn't be idealized."
  3.  **Misconception:** *"Idealization can only push an agent toward greater selfishness (prudence) or only toward greater impartiality (morality)."*
      *   **When to head off:** **Minute 30**, when specifying the Axis of Idealization.
      *   **Intervention:** Before giving the Activist verdict, ask: "If we idealize for coherence, does that make us selfish? If we idealize for sympathy, does that make us saints?" Clarify that the *axis* determines the outcome, and the theory is a schema, not a single political stance.
  4.  **Misconception:** *"The whole view is a dressed-up universalizability test."*
      *   **When to head off:** **Minute 65**, during the Closing Discussion.
      *   **Intervention:** If a student says, "This is just Kant," respond: "Kant asks what *any* rational agent must will. This view asks what *this* agent, with *these* roots, would will if improved. The source of authority is internal, not rational law."

  ---

  ### IV. The Ending Tension

  **The Tension:** The students must hold simultaneously that (A) the idealized counterpart is still *them* (grounding authority) and (B) the counterpart's verdict demands the surrender of something they actually care about (creating alienation).

  **Where to let it surface:** **Minute 55**, immediately after the Activist Case verdict is revealed, but *before* the Closing Question.

  **Instruction:**
  1.  Ask the class: "If the Activist follows the counterpart, they betray their current integrity. If they ignore the counterpart, they are irrational by their own improved lights."
  2.  Pose the question: "Is the counterpart the agent's *true* self, or a *replacement* self?"
  3.  **Do not resolve this.** Allow the silence to sit. Acknowledge that if the counterpart is too different, it lacks authority (it's a stranger). If it is too similar, it lacks corrective power (it's just the agent).
  4.  Say: "Hold this discomfort. It is the central instability of the view. Do not try to solve it yet."

  ---

  ### V. Closing Question & Exchange

  **The Closing Question (Minute 65):**
  "If the idealized counterpart is indeterminate—meaning there are multiple equally 'ideal' versions of you who endorse different things—does that destroy the *authority* of the view, or just the *usefulness*?"

  *   **Why this works:** It forces them to separate the **Authority Problem** (why the verdict binds) from the **Determinacy Problem** (whether there is a unique verdict).
  *   **Strong Answer:** "It destroys authority. If there is no unique verdict, there is no single 'ideal self' to ground the 'ought.' The normativity dissolves into ambiguity." (Connects determinacy to authority).
  *   **Weak Answer:** "It just makes it hard to use. We still ought to do what *an* ideal self would want, even if we don't know which one." (Fails to see that 'ought' implies a specific action, not a range).

  **The Ready Exchange (Minute 70):**
  *   **Student:** "But which idealization is the correct one? Full information? Coherence? Sympathy?"
  *   **You:** "That question assumes we can step outside the theory to judge it. Within this metaethical framework, 'correct' just means 'the one that best captures our normative practices.' We aren't looking for the One True Idealization; we are looking for the one that solves the Normative Authority Problem best. Asking which is 'correct' is like asking which definition of 'knowledge' is correct before doing epistemology."

  ---

  ### VI. Omissions

  **Minute 74:** Explicitly announce the following omissions to prevent confusion in future courses.

  **Script:**
  "I am leaving out three things today. First, I am leaving out the **historical lineage**: we are not tracing this from Sidgwick to Railton to Smith. Second, I am leaving out the **technical machinery**: we are not formalizing the coherence conditions or the counterfactual logic. Third, I am leaving out the **competing internalist solutions**: we are not comparing this to actual desire satisfaction theory in depth. We are isolating the Idealization move itself. If you take Advanced Metaethics, you will dismantle the machinery. Today, you are only learning to see the shape of the view."
