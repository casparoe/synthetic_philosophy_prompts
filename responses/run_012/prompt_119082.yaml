answer: |-
  **Project Title:** The Salience of the Present: Reinterpreting Present Bias in Akratic Choice

  **Principal Investigator:** [Your Name]
  **Duration:** One Semester
  **Request:** Stipend for 0.5 FTE Research Assistant + Release Time

  **1. Research Question and Objective**
  The central question of this project is determinate: *Does akratic choice reflect a temporal reversal of underlying preference (the Economic view) or a distortion of decision weights via attentional salience (the Salience view)?*

  Standard accounts of weakness of will (akrasia) talk past one another. The philosophical tradition treats akrasia as a defect of execution: the agent judges $A > B$ but does $B$, maintaining a stable ranking that fails to guide action. The behavioral-economic tradition treats akrasia as preference reversal: the agent's ranking at $t_1$ ($A > B$) genuinely differs from their ranking at $t_2$ ($B > A$), modeled via quasi-hyperbolic discounting ($\beta < 1$).

  The economic model explains the choice but contradicts the phenomenology: akratics report that the better option *remained* better in their eyes even as they chose the worse one. My hypothesis is that the $\beta$ parameter in discounting models should not be read as time preference, but as an *attentional weight* assigned to immediate stimuli. If correct, this dissolves the paradox: the preference ranking remains stable ($A > B$), but the decision function is locally distorted by the salience of the immediate option.

  However, the phenomenon of *regret* threatens this dissolution. If an agent regrets the choice at $t_3$, does this indicate the preference flipped back (supporting Economics), or that the stable preference was re-asserted once salience faded (supporting Salience)? This project aims to distinguish these readings conceptually and test the phenomenological reports associated with them.

  **2. Methodology**
  The project combines conceptual modeling with a small-scale vignette study.

  *   **Conceptual Work (PI):** I will formalize the distinction between a *preference reversal* model and a *salience distortion* model. The key is to specify conditions under which the two models yield different predictions regarding reported valuation versus revealed choice. Specifically, I will develop a framework where "valuation" is measured independently of "choice propensity" to see if they dissociate under high-salience conditions.
  *   **Empirical Vignette Study (RA):** The RA will design and run a scenario-based study ($N \approx 200$). Participants will face akratic dilemmas (e.g., health vs. indulgence) where the *time delay* is held constant, but the *perceptual or cognitive salience* of the immediate reward is manipulated (e.g., vivid description vs. abstract description).
      *   *Measure 1:* Choice (A or B).
      *   *Measure 2:* Ex-ante and Ex-post Valuation (Rating $A$ vs. $B$ on a Likert scale).
      *   *Measure 3:* Phenomenology of Regret. Crucially, the survey will ask participants to characterize their regret: Did they "change their mind" about what was best (Reversal), or did they "know better but couldn't help it" (Salience/Execution)?

  **3. Work Plan (Month-by-Month)**
  *   **Month 1:** PI completes formal mapping of the Salience Model against Quasi-Hyperbolic Discounting. RA conducts literature review on salience manipulations in vignette methodology and drafts survey instruments.
  *   **Month 2:** Finalize survey design. Submit for IRB exemption (if required). PI refines the conceptual distinction between "decision weight" and "utility" to ensure the vignette questions track the correct variable.
  *   **Month 3:** RA launches survey, monitors data collection, and performs preliminary statistical analysis (ANOVA on choice vs. valuation across salience conditions). PI begins drafting the theoretical framework paper.
  *   **Month 4:** RA codes open-ended regret responses for "Reversal" vs. "Stable" language. PI integrates findings into final manuscript. Submission of draft to internal working paper series or target journal.

  **4. Expected Outcomes and Failure Conditions**
  *   **Positive Result:** Data shows that high salience increases choice of the immediate option *without* shifting ex-ante valuation ratings. Furthermore, regret reports in the high-salience condition cluster around "I knew it was worse" rather than "I wanted it more." This supports the Salience View and suggests akrasia is an attentional failure, not a preference instability.
  *   **Negative Result:** Valuation ratings shift in tandem with choices (participants rate the chosen option as "better" at the moment of choice). This supports the Economic Reversal View and suggests the "stable judgment" phenomenology is a post-hoc confabulation.
  *   **Project Failure:** The study fails to manipulate salience independently of utility (e.g., making the option more vivid simply makes it more useful to the agent). If the conceptual distinction collapses under empirical scrutiny, the project concludes that the Salience View is merely a relabeling of context-dependent utility.

  **5. Feasibility and Risk Assessment**
  Is this one semester of work? Yes, but with a significant caveat. The conceptual framing is robust enough to sustain a semester of analysis, and the vignette study is appropriately scaled for a half-time RA. However, the risk lies in the "honest paragraph" requirement of this proposal: there is a non-trivial chance that the distinction between "attentional weight" and "contextual utility" is verbal rather than substantive. If "salience" simply *is* how utility is computed in the moment, then the Salience View collapses back into the Economic View, merely offering a different vocabulary for the same function. I am confident the conceptual work will clarify this, but it is possible the semester will end not with a solution to akrasia, but with a proof that the question is ill-posed. That would be a successful negative result, but it risks leaving the manuscript in a state of "interesting aporia" rather than definitive conclusion. I judge this risk acceptable for an internal seed grant, as even a negative result clarifies the boundary conditions for future interdisciplinary work.
