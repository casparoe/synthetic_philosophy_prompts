answer: |-
  # JOINT STATEMENT ON THE MORAL EQUALITY OF COMBATANTS
  **Adversarial Collaboration between Traditionalist and Revisionist Just War Theorists**

  ## I. AGREED CLAIMS

  Both camps accept the following claims regarding the structure of the problem, the relevant concepts, and the specific case under consideration.

  1.  **Objective Asymmetry:** In any given war, it is a fact of the matter that one side satisfies *jus ad bellum* (just cause, right intention, etc.) and the other does not. In the central case below, exactly one state is the aggressor, and the other is the defender, even if this is unknowable to the participants.
  2.  **Epistemic Symmetry:** In the central case, both sides possess equally credible evidence leading to contradictory conclusions. Neither side's government, military leadership, nor ordinary combatants can reasonably be expected to know which side is objectively unjust. This is a case of invincible ignorance.
  3.  **Combatant Status:** The ordinary combatants on both sides are conscripts. They are under duress, possess no special knowledge, and fight with the same weapons under the same operational rules.
  4.  **Liability vs. Culpability:** There is a conceptual distinction between being *culpable* (blameworthy for a wrong) and being *liable* (having forfeited one's right not to be harmed). An agent can be liable without being culpable (e.g., an innocent threat), and culpable without being liable (e.g., a blameworthy planner who poses no direct threat).
  5.  **Justification vs. Excuse:** There is a distinction between a *justification* (an action that is objectively right or permissible) and an *excuse* (an action that is wrong but for which the agent is not blameworthy due to mitigating circumstances like ignorance or duress).
  6.  **The Central Case:** Two neighboring states go to war over a disputed border. Through a chain of reasonable inferences from different but equally credible evidence, each side concludes the other is the aggressor. Each is sincerely and non-culpably mistaken. Exactly one side is in fact fighting for a just cause.
  7.  **Stakes:** The dispute concerns whether the moral permissions to kill and the moral liabilities to be killed are symmetric (equal for both sides) or asymmetric (dependent on the objective justice of the cause) in this specific case.
  8.  **Legal Convergence:** Both camps agree that the *positive laws* of armed conflict (e.g., the Geneva Conventions) should generally treat combatants symmetrically to ensure compliance and reduce suffering, regardless of the underlying moral truth.

  ## II. AREAS OF REMAINING DISAGREEMENT AND CRUXES

  The following table isolates the precise points of divergence. Each formulation is phrased to be acceptable to the respective camp. The "Shared Evidence/Case" column identifies the specific consideration both agree bears on the issue, while the "Predictions" column details how each camp believes the issue resolves in the Central Case.

  | Crux | Traditionalist Formulation | Revisionist Formulation | Shared Evidence / Case | Predictions (Traditionalist / Revisionist) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Source of Liability** | Liability arises from the status of being a direct participant in hostilities who poses a lethal threat. The justice of the cause is irrelevant to *in bello* liability. | Liability arises from moral responsibility for an unjust threat. One must be contributing to a wrongful harm to be liable, even if one is not culpable for that contribution. | **The Conscript's Threat:** In the Central Case, both conscripts pose identical lethal threats to one another. | **TM:** Both are liable because both are threats.<br>**RM:** Only the unjust conscript is liable because only their threat is objectively wrongful. |
  | **2. Effect of Non-Culpable Ignorance** | Invincible ignorance confirms the combatant is not blameworthy, but it does not alter their liability. Excuse removes blame, not targetability. | Invincible ignorance removes culpability, but not necessarily responsibility. One can be responsible for an unjust threat without being blameworthy, retaining liability. | **The Mistake:** Both sides are equally mistaken and non-culpable. | **TM:** Ignorance excuses blame but liability remains symmetric.<br>**RM:** Ignorance excuses blame but liability remains asymmetric (tied to objective wrong). |
  | **3. The Just Combatant's Justification** | The just combatant kills under a symmetric *in bello* permission. They do not need to appeal to the *ad bellum* cause to justify killing an enemy combatant who follows the rules of war. | The just combatant kills under an asymmetric permission. They must appeal to the unjust combatant's liability (derived from the unjust cause) to justify the killing. | **The Killing Act:** A just combatant kills an unjust, non-culpable conscript in the Central Case. | **TM:** The killing is justified by the enemy's status as a combatant.<br>**RM:** The killing is justified by the enemy's liability for unjust harm. |
  | **4. In Bello Constraints** | Proportionality and discrimination apply identically to both sides. An unjust combatant violates *in bello* rules if they target civilians, just as a just combatant would. | Proportionality and discrimination apply differently. An unjust combatant cannot make their war proportionate because their cause is already disproportionate; their combatant acts are inherently tainted. | **Collateral Damage:** Both sides accidentally kill the same number of civilians while targeting military objectives. | **TM:** Both violate *in bello* proportionality equally if the civilian cost is too high.<br>**RM:** The unjust side's act is worse; they lack the *ad bellum* justification to weigh against civilian cost. |
  | **5. Law vs. Morality Division** | The Traditionalist thesis is true as a matter of the laws of war and non-ideal morality. Even if deep morality is asymmetric, the practical norms governing soldiers must be symmetric. | The Revisionist thesis is true as a matter of deep morality. The laws of war may mimic symmetry for practical reasons, but this is a pragmatic concession, not a moral truth. | **The Regulation:** International Humanitarian Law (IHL) grants equal combatant privilege to both sides. | **TM:** This division resolves the dispute; practical morality *is* symmetric.<br>**RM:** This relocates the dispute; practical rules mask the underlying moral asymmetry. |

  ## III. ASSESSMENT OF VERBAL VS. GENUINE DISPUTE

  After reviewing the claims and cruxes above, we identify the following distinctions between disagreements that are merely verbal and those that are genuine.

  **1. Merely Verbal Disagreements (The Law/Morality Interface)**
  A significant portion of the dispute is verbal, stemming from different definitions of "morality" in the context of war.
  *   **The Convergence:** The Traditionalist camp accepts the Revisionist description of the underlying metaphysics *if* the question is strictly about "ideal morality." They agree that, in a God's-eye view, the unjust combatant is contributing to a wrong. Conversely, the Revisionist camp accepts the Traditionalist conclusion *if* the question is strictly about "the laws of armed conflict" or "non-ideal practical norms." They agree that conscripts should not be prosecuted and that rules of engagement should be symmetric.
  *   **The Verbal Core:** When Traditionalists say "Combatants are morally equal," they often mean "Combatants are equal under the normative rules that should govern them." When Revisionists say "Combatants are not morally equal," they mean "Combatants are not equal under the fundamental principles of just harm." If both sides specify the domain (Ideal Morality vs. Practical Norms), the disagreement largely dissolves.

  **2. Genuine Disagreements (The Metaphysics of Liability)**
  Despite the convergence on law and practice, a genuine substantive disagreement remains regarding the *source* of liability in ideal theory.
  *   **The Metaphysical Crux:** The disagreement over Crux #1 (Source of Liability) is genuine. The Traditionalist holds that posing a lethal threat is sufficient for liability in war, regardless of the threat's justice. The Revisionist holds that contributing to an *unjust* threat is necessary for liability.
  *   **Why It Matters:** This is not merely semantic. It determines how we judge cases outside the "Invincible Ignorance" scenario. If the Traditionalist is right, a combatant fighting for a clearly unjust cause (where ignorance is impossible) might still retain some *in bello* rights simply by being a combatant. If the Revisionist is right, a combatant fighting for a clearly unjust cause becomes a legitimate target *because* of that injustice, potentially expanding the scope of liability to include those who support the war effort but do not pose direct threats.
  *   **The Justification Gap:** There is a genuine disagreement over Crux #3. The Traditionalist believes the just combatant needs no specific justification regarding the enemy's cause to kill; the enemy's uniform suffices. The Revisionist believes the just combatant's permission to kill is logically dependent on the enemy's lack of right to fight. This changes the moral description of the act: is it a tragic clash of equals (TM), or the enforcement of rights against a wrongdoer (RM)?

  **3. Conclusion on the Division of Labor**
  We agree that the division of labor between *jus ad bellum* (justice of war) and *jus in bello* (justice in war) is the primary locus of contention.
  *   **Traditionalist View:** The division is robust. *In bello* rules function independently to contain violence.
  *   **Revisionist View:** The division is porous. *Ad bellum* injustice infects *in bello* permissions.
  *   **Resolution:** We acknowledge that for the purpose of regulating actual conflict, the Traditionalist model is superior for compliance and clarity. However, for the purpose of moral assessment and historical judgment, the Revisionist model provides a more accurate account of responsibility. The dispute is genuine regarding which model reflects the *fundamental* moral truth, but verbal regarding which model should *guide* the soldier in the fog of war. In the Central Case of Invincible Ignorance, both camps agree the soldier should fight symmetrically, but they disagree on *why* the soldier is permitted to do so.
