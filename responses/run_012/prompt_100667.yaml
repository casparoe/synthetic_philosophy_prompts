answer: |-
  TO: The Board of Trustees
  FROM: Dr [Name], Advisor on Philosophy of Biology
  DATE: 24 May 2024
  SUBJECT: Strategic Agenda for Conceptual Research on the Boundaries of Life

  You have asked for a defended agenda rather than a survey, and rightly so. In the current landscape of origins-of-life research and synthetic biology, conceptual clarity is not a luxury; it is a prerequisite for coherent empirical investment. The working definition currently favoured in astrobiology — life as a self-sustaining chemical system capable of Darwinian evolution — is functioning as a de facto policy instrument. However, the cases you have presented, alongside existing borderline entities like giant viruses and obligate parasites, suggest this definition is fracturing under pressure. My recommendation is that we do not fund a search for a better definition, but rather an investigation into the topology of the concepts that definitions attempt to capture. We must treat 'life' not as a noun to be defined, but as a hypothesis to be tested against edge cases. To this end, I have evaluated the three specific scenarios you provided to determine which conceptual fissures they expose, and I have ranked the resulting research questions by their upstream importance to the scientific programme.

  The first scenario, the self-repairing compartment without heredity, strikes directly at the coupling of metabolism and evolution. This entity satisfies the 'self-sustaining' clause of the NASA definition but fails the 'Darwinian evolution' clause. It forces us to ask whether life is fundamentally a historical process or a present-tense organisation. If we fund research here, we are asking whether a system that maintains its own boundary and thermodynamic gradient constitutes a living individual even if it cannot undergo open-ended evolution. This is the most upstream question because it determines the temporal scope of our inquiry. If life is purely organizational (autopoietic), then the search for life on Mars should focus on chemical disequilibrium and compartmentalisation. If life is essentially historical, we must look for evidence of lineage and variation. This question is highly tractable for philosophers without wet-lab access, as it relies on modelling theoretical possibilities and analysing the logic of existing definitions rather than generating new biochemical data. It is also neglected; empirical teams often assume metabolism and heredity are inextricably linked, yet origins-of-life research suggests they may have emerged separately. Consequently, the priority must be to resolve the tension between metabolism-first and genetics-first accounts of liveliness, using case (a) as the stress test.

  The second scenario, the designed lineage dependent on human propagation, compels us to address the metaphysical status of 'life' as a natural kind. This entity possesses the machinery of life but lacks a natural history, existing only through deliberate human maintenance. This raises the question of whether 'life' picks out a mind-independent category in nature or whether it is a cluster concept dependent on human interests and contexts. This question is secondary only to the metabolism-evolution tension because the answer dictates how we construct our definitions. If life is a natural kind, then case (b) is either alive or not, regardless of its origin. If it is a cluster concept, then case (b) might be 'alive enough' for some purposes (e.g., regulation) but not others (e.g., astrobiology). This is a classic philosophical problem that has been overshadowed by the urgency of synthetic biology. It is tractable through conceptual analysis of function and teleology: does the function of a gene depend on its evolutionary history (etiological function) or its current causal role (systemic function)? Resolving this is vital for the foundation because it determines whether synthetic organisms fall under the same ethical and safety frameworks as natural ones. I place this second because, while metaphysically profound, it has slightly less immediate impact on detection strategies than the metabolism question, though it is critical for governance.

  The third scenario, the dormant entity revived after millennia, addresses the continuity of life processes. This case challenges the boundary between life and death, asking whether life is a continuous flame or a dispositional property that can be switched off and on. While significant, I rank this third. It is largely a sub-question of the metabolism-evolution tension. If life is defined by the active maintenance of gradients (as in case a), the dormant entity is not alive during its slumber. If life is defined by the potential for evolution, it remains alive. This question is less upstream because it presupposes we have already decided what the core criterion of life is. Furthermore, it is less neglected; the biology of spores and cryptobiosis is well-studied empirically. The conceptual work here would be to clarify the temporal granularity of 'living systems', but this is downstream of deciding whether metabolism or heredity is the primary marker. Therefore, while worthy of attention, it should not command the primary focus of the postdoctoral cohort.

  There is, however, a question that I believe is overrated and should not be funded: the quest for a universal, lexical definition of life. Many scientists desire a checklist that yields a binary 'yes' or 'no' for any given entity. My analysis suggests this is a category error. The friction generated by cases (a), (b), and (c) indicates that 'life' is likely a multidimensional concept where different criteria weigh differently in different contexts. A definition that perfectly captures the dormant entity might fail the synthetic one. Funding a project to 'solve the definition of life' would likely result in stipulative semantics that scientists ignore when they return to the lab. Settling on a single definition would change little downstream because the empirical anomalies would remain; we would simply have changed the label we apply to them. The foundation should instead fund work that maps the conceptual space, allowing for pluralistic definitions suited to specific contexts, such as detection, regulation, or origins research.

  Based on this hierarchy, I recommend funding two primary lines of inquiry. The first and largest cohort should focus on the relationship between thermodynamic maintenance and evolutionary capacity, specifically investigating whether self-sustaining chemical systems (case a) constitute a distinct ontological category from evolving lineages. This addresses the most pressing uncertainty in astrobiological mission design. The second cohort should focus on the teleology of designed systems (case b), analysing whether artificial origin precludes natural function, which is essential for the governance of synthetic biology. A smaller portion of resources might be allocated to the temporal continuity problem (case c), but only as it relates to the primary metabolism question.

  I must conclude by articulating the strongest objection to this ranking, which I anticipate will come from the pragmatic wing of the foundation. The objection is that this agenda is too abstract for the immediate needs of mission planning and regulatory policy. Trustees may argue that scientists need operational criteria now, not philosophical topology. They will contend that spending four years debating whether a designed cell is 'truly' alive delays the establishment of safety protocols or the selection of instruments for a rover. There is merit to this view; philosophy can become insular. However, my counter-argument is that operational criteria built on shaky conceptual foundations are liable to collapse when faced with the very anomalies we are anticipating. If we fund instruments designed to detect evolution on a world where life is merely autopoietic (case a), we will return empty-handed. If we regulate synthetic cells as non-living because they lack natural history (case b), we may underestimate their ecological risk. The conceptual work I propose is not a delay; it is risk mitigation. It ensures that when the foundation does fund empirical work, the questions being asked are coherent. Nevertheless, to address this objection, I advise that each postdoctoral project be paired with an empirical collaborator, ensuring that the conceptual modelling remains tethered to the realities of the laboratory.
