      *   *Check:* Is it continuous prose? *I need to avoid bullet points in the main text to ensure flow, though a memo usually has headers. I will use paragraph breaks to structure the argument without lists.*

  8.  **Final Polish:** Ensure the distinction between "life as a process" and "life as a material" is clear. Ensure the distinction between "natural kind" and "functional kind" is sharp. Make sure the objection is charitable but stinging. (e.g., The "Mars Objection" - philosophers deliberating while the rover waits).

