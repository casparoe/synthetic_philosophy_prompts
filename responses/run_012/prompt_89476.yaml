answer: |-
  Dear Friend,

  What you have put your finger on is a distinction that haunts the edges of cognitive science and philosophy, though I suspect you have arrived at it through the much sharper lens of character and consequence. There is no single established term that captures precisely what you are describing, specifically the moral and functional weight of the dependency you have noticed. There is a field of study called the Extended Mind Thesis, proposed by philosophers Andy Clark and David Chalmers, which argues that our tools are not merely aids but literal parts of our cognitive system. In their view, the notebook is as much a part of the writer's mind as the neurons firing in the cortex. There is also the concept of distributed cognition, which looks at how groups and tools share the load of thinking, much like your surgeon and their team. However, these frameworks tend to flatten the distinction you are sensing. They treat the boatbuilder and the clinician as equally intelligent systems, merely bounded differently. They do not account for the fragility you observed, nor the tragedy of the gift dying with the boatbuilder while the clinician's skill vanishes when the checklist is removed. Because the existing literature lacks a term that captures this specific vulnerability and the difference between owned and rented capacity, I will offer you a coinage that might serve your work, drawn from the Greek roots often used in these discussions.

  I suggest you call the clinician's capacity exosomatic simulation and the boatbuilder's capacity endosomatic simulation. The prefix endo means within, and exo means outside. While these words exist in biology and anthropology, applying them specifically to the capacity for foresight and modeling creates the boundary you are looking for. Endosomatic simulation is the ability to run a model of the world inside the skin, using the body and brain as the sole engine. It is slow to learn, often tacit, and difficult to transfer, which is why the boatbuilder could not teach it. It is owned because it is biological. Exosomatic simulation is the ability to run that model using an artifact as the engine. The checklist, the aloud reading, the notebook, or the surgical team provides the structure that allows the future to be simulated. This capacity is transferable because the tool can be handed over, but it is rented because it is contingent on the tool's presence. When the artifact goes, the simulation stops. This distinction allows you to rank your characters not by how well they perform when everything is in place, but by what remains when the props are kicked away.

  The line between a skill that is genuinely someone's own and one that is only being rented falls on two tests: fragility and transferability. If the skill degrades but persists when the tool is removed, it is internalized and therefore owned. If the skill collapses entirely, it is exosomatic and rented. This is where your hard cases find their place. The surgeon who is nothing without their team is operating with a form of social exosomatic simulation. The team functions as the artifact, the external scaffold that allows the surgery to be modeled and executed safely. If you strip the team away, the surgeon's capacity collapses, which means that specific competence is rented from the system. This does not make the surgeon less valuable, but it makes their power systemic rather than individual. Similarly, if you cannot write without your notebooks, you are engaging in exosomatic simulation. The thinking is not happening in your head and then transcribed; the thinking is happening in the negotiation between your hand and the paper. If the paper is taken, the thought cannot form. This is not a failure, but it is a dependency.

  What this leaves out, and what you must decide as a novelist, is whether the rental is a weakness or a new kind of strength. The literature of extended cognition suggests it is simply a different way of being human, but your observation suggests a hierarchy of resilience. The boatbuilder's endosomatic skill is robust but rare and non-scalable. The clinician's exosomatic skill is fragile but scalable and teachable. The tragedy you sensed is that we often mistake the tool for the person. We praise the clinician for their insight, but we are praising the checklist. For your purposes, the boundary is best drawn at the point of removal. If you can take the thing away and the person still knows what to do, even if they do it slower or worse, the skill is theirs. If you take the thing away and they are lost, the skill belonged to the arrangement, not the individual. This gives you a way to measure your characters under pressure, not by how they succeed when equipped, but by how they fail when stripped.

  I hope this terminology offers the traction you need. It is rare to see the machinery of thought described with such clarity, and I suspect the tension between these two modes of foresight could drive a great many scenes. You have noticed that we are not just minds in bodies, but minds in ecosystems, and some of us are tenants while others are owners. Knowing which is which allows you to decide what happens when the lease expires.

  Warmly,

  A Reader
