answer: |-
  Good evening, everyone. For those who don't know me, I'm the best man and the groom's older brother.

  Looking around this room, I realize we have a unique situation. This wedding is basically two rooms stapled together. On one side, we have our family, who are lovely people and mostly know us as the boys who used to fight over the remote. On the other side, we have the vision science community, who know my brother and his new wife as colleagues who publish papers on spatial frequency and contrast sensitivity.

  I have a responsibility to both groups. If I get too technical, my aunt will fall asleep in her soup. If I dumb it down too much, the grad students will start critiquing my methodology. So, I'm going to attempt a balancing act. If I start losing the family, just look at the open bar. If I start losing the scientists… well, pretend I'm using air quotes around everything.

  I wanted to talk tonight about how we tell stories. Specifically, the story of how these two met.

  My brother met his fiancée in a perception lab. She was running it; he was a postdoc. And because they work in perception, I've been thinking about a classic demo called the Color Phi phenomenon. I promise I will not turn this into a journal club, but stick with me for thirty seconds.

  Here's the setup: You flash a dot on a screen. Let's say it's red. Then, a fraction of a second later, you flash a dot in a different spot, but this one is green.

  Objectively, there are two stationary dots. But subjectively, people don't see two dots. They see *one* dot moving from the first spot to the second. And here's the kicker: they report seeing that dot change color from red to green halfway through the journey.

  Now, think about the timing. The brain reports the color change happening *before* the second dot has even appeared. Which is impossible, if you think of consciousness like a video camera recording reality in real-time.

  So, how does the brain pull off this magic trick? For decades, philosophers and scientists have argued over two explanations.

  The first is the "Stalinesque" model. This suggests the brain is a bit of a dictator. It waits until it has all the information—both dots—before it lets you consciously experience *anything*. It constructs the scene, adds the motion, adds the color change, and then presents it to you as a finished show. You think you're seeing it live, but you're actually watching a delayed broadcast where the ending was already decided.

  The second is the "Orwellian" model. This suggests you do see it live, exactly as it happens. But afterwards, your memory gets edited. The Ministry of Truth comes in, rewrites the diary, and makes you *remember* seeing a color change that never actually occurred in the moment.

  One says the experience was faked upfront; the other says the memory was faked afterwards. And the terrifying, wonderful truth is: there is no experiment that can tell them apart. There is no "fact of the matter." As far as your life is concerned, the experience is identical.

  I bring this up because I've been thinking about the story of how my brother and his fiancée fell in love.

  We all have our versions. The family version involves destiny and soulmates. The lab version probably involves compatible schedules and shared grant interests.

  Maybe the "Stalinesque" version is true: maybe the universe waited until it had all the data—until they were standing here today—before it arranged the past to make sense of the present. Maybe the moment they met wasn't special until *now*, and our brains are just projecting the motion backwards to connect the dots.

  Or maybe the "Orwellian" version is true: maybe they fumbled through awkward dates and disagreements in real-time, but years of love have edited the memory, smoothing over the static until all we remember is the color change, the motion, the inevitability of it.

  And here is the point where I stop being a scientist and start being a brother: It does not matter which one it is.

  Whether our brains construct the story in real-time or edit it in retrospect, the feeling is the same. The love is the same. The fact that memory is a reconstruction doesn't make it fake; it makes it human. We are not cameras. We are storytellers. We take the disjointed dots of our lives—the red dots, the green dots, the moments of stillness and the moments of change—and we weave them into a single, moving line.

  My brother and his wife have built a life where the story they tell together is kinder, and funnier, and more beautiful than the raw data would suggest. They have agreed on a shared reality where they are better together than they were apart. And if that's a trick of perception, it's one I hope they keep playing on each other for the next fifty years.

  So, I'd like to ask you all to raise a glass.

  To the bride and groom: May your motion always be apparent, may your colors always change for the better, and may you never worry about the mechanism behind the magic.

  To the happy couple.
