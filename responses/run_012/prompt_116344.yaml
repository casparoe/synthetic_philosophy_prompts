answer: |-
  **Case 1: The Sustained Norm**
  In the Bureau of Land Allocation, a functioning branch of a stable state, Officer K receives a basket of cured meat from Applicant L. K moves L's file from the bottom of the stack to the top. The formal duty requires first-come, first-served processing. K and L are neighbors in a district where the community sustains a norm that a subordinate must honor a superior with harvest goods to acknowledge the superior's burden, and the superior must expedite the subordinate's needs to acknowledge the dependency. K and L believe they are discharging a social obligation, not evading a rule. The exchange is part of a standing network of similar transfers among officers and locals. The cost is borne by Applicants M, N, and O, who wait longer; they are members of the same community and know of the norm, though they lack the surplus to participate in the network.

  **Case 2: The Unsustained Norm**
  In the Bureau of Land Allocation, a functioning branch of a stable state, Officer K receives a basket of cured meat from Applicant L. K moves L's file from the bottom of the stack to the top. The formal duty requires first-come, first-served processing. K and L are neighbors in a district where the community does *not* sustain a norm endorsing such transfers; the prevailing view is that office resources are public and distinct from private kinship debts. However, K and L personally believe they are discharging a social obligation inherited from a previous generation, not evading a rule. The exchange is part of a standing network of similar transfers, now shrinking, among a clique of officers and locals. The cost is borne by Applicants M, N, and O, who wait longer; they are members of the same community and actively disapprove of the practice.

  ***

  **The Check**

  **Verdicts and Reasoning:**
  *   **Impartiality Account:** Corrupt in both cases. The reasoning step is the identification of a personal tie (the meat/kinship obligation) substituting for an impersonal standard (the queue) in the allocation of a trusted resource.
  *   **Local-Norm Account:** Not corrupt in Case 1; Corrupt in Case 2. The reasoning step is the alignment (Case 1) or misalignment (Case 2) between the act and the norms the relevant community actually sustains.

  **The Single Feature:**
  The existence of the community-sustained norm. When removed (Case 2), the accounts diverge: Impartiality holds firm on corruption; Local-Norm flips to corruption. They do not converge. If the feature is removed entirely (a community with *no* norm on the matter), the Local-Norm account becomes silent or defaults to the formal rule, while Impartiality remains active.

  **Impartiality and Reimportation:**
  The Impartiality verdict survives the version where the community endorses the practice (Case 1). It does not quietly reimport the community's norm as the standard. It treats the community's endorsement as irrelevant data. The standard is the impersonal allocation rule inherent to the office, not the social sentiment surrounding it. This makes the Impartiality account robust but potentially blind to the social reality that makes the office function.

  **Network Structure:**
  The network structure moves the Local-Norm verdict significantly; it solidifies the "practice" into a "norm." It moves the Impartiality verdict only in degree (systemic vs. isolated), not kind. The Local-Norm account is embarrassed by the move. If the network sustains the norm (Case 1), Local-Norm must call it "not corrupt," even if the network systematically excludes the poor (M, N, O) who also hold the norm. The account cannot condemn a practice that the community willingly sustains, even if that practice creates a caste system within the community.

  **Strongest Attacks:**
  *   **Against Impartiality:** "You are imposing an external standard of 'impersonality' that destroys the social fabric required to make the office function." This is a **Repair**. It argues the definition of the office's duty should include social maintenance.
  *   **Against Local-Norm:** "You are powerless to condemn a community that decides to eat its own." This is an **Admission**. It accepts that if the community agrees to be corrupted, the Local-Norm account cannot call it corruption.

  ***

  **The Final Move**

  The internal-criticism move—pointing out that the gift violates the community's *other* norm of reciprocity (the supplicant cannot repay in kind)—does not rescue the universalist. It is relativism with extra steps. The Local-Norm account is still deriving its condemnation from within the community's own web of norms, not from an external standard of impartiality. It merely pits Norm A (gift-giving) against Norm B (reciprocity).

  For the answer to go the other way—for the internal criticism to function as a universalist rescue—the community would have to recognize a meta-norm that prioritizes abstract fairness over specific social obligations *and* enforce that meta-norm against its own immediate interests. If the community sustains a norm that says "our local customs yield to the public good," then the Local-Norm account collapses into the Impartiality account. If it does not, the internal criticism is just one local norm fighting another, and the universalist gains no ground. The Local-Norm account can only condemn the practice if the community is already divided against itself; it cannot condemn a community that is unanimously, comfortably corrupt.
