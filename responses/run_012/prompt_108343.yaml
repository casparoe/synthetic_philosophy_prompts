answer: |-
  Welcome. We have epistemologists here who could recite the literature backwards, and we have guests who have read their way into this subject because it matters outside the academy. My goal for these minutes is to speak to both groups without boring the first or losing the second. We are here to discuss the norms of assertion, the rules that govern when you are allowed to state something as true. But I want to suggest we have been looking at the wrong games.

  The debate has been conducted largely on cases in which one person tells another how things are and very little hangs on it. I call these report cases. The cases that matter are ones in which the audience will act on what is said and the speaker knows it. I call these stake cases. Moving from the first to the second is not a change of subject but a change of pressure on the very same question.

  I should pause here. Nearly everything an opening speech does is thanking, promising, hoping, and predicting, so the norms we have convened to discuss are oddly idle in the very genre that opens the discussion. I will not pretend otherwise, except to say that I hope we treat that irony as data rather than embarrassment.

  Consider the first case. A mountain-rescue coordinator, working from radio reports and a snowpack test taken that morning, tells a team on the ground that the ridge is safe to traverse. Her evidence is good but not conclusive—she would put it near ninety percent—and she knows the team will go if she says so. They go; a slab releases. Was the assertion permissible?

  If the rule is the knowledge norm, which says you must only assert what you know, she likely failed; ninety percent is not certainty. If the rule is the truth norm, which says you must only assert what is true, she failed because the ridge was not safe. If the rule is the belief norm, which says you must only assert what you believe, she passed. But none of these quite capture the error. The error is that she authorized action on evidence that was insufficient for the risk. If the answer is that she should have said something weaker, she should have said, "The data suggests safety, but you must verify locally." That is not a dodge. It is a calibration of authority to consequence. In stake cases, the cost of being wrong enters the calculation of whether you are entitled to speak at all.

  Now consider the second case. A clinician learns, from an unblinded result given to her in confidence, that the trial drug is harming patients in the control arm, and the protocol bars her from telling the participants. She knows. Does anything in the standard accounts explain why it would still be wrong of her to say so?

  If nothing does, say so plainly. The knowledge norm is satisfied; she knows. The truth norm is satisfied; it is true. The belief norm is satisfied; she believes it. Yet asserting it is a breach of professional duty. This shows that epistemic norms are not the only norms governing speech. Sometimes you are epistemically cleared to speak but practically forbidden. This does not mean the epistemic norms are false; it means they are not sovereign.

  These two cases bookend the problem. In the mountain case, the practical stakes raise the epistemic bar; you need more than ninety percent to authorize a traverse. In the clinician case, the practical stakes lower the epistemic permission to zero, regardless of the evidence. In both instances, the standard accounts—knowledge, truth, belief—say something true and something insufficient. They describe the state of the speaker but ignore the position of the listener.

  This is why the shift from report cases to stake cases is vital. In a report case, if I am wrong about the weather, you get wet. In a stake case, if I am wrong about the ridge, you die. If I am wrong about the drug, you suffer. The question is not whether the speaker possesses the right mental state. The question is whether that mental state is sufficient to license another person's action.

  We are not here to declare a winner among the standard accounts. They are tools, and each tool breaks when used on the wrong material. Instead, I want to put a single question to this room for the next two days. When the cost of being wrong shifts from embarrassment to injury, does the rule for speaking change, or does the rule stay the same and simply demand more?

  If the rule changes, we need a new theory of assertion that incorporates risk. If the rule stays the same, we need to explain why ninety percent knowledge is enough for a weather report but not for a rescue mission. The answer determines whether we are studying language or responsibility. I suggest we are studying both.

  We have two days. The coffee is adequate, the rooms are booked, and the silence is waiting. Let us begin.

  Summary: The remarks argue that shifting from low-stakes report cases to high-stakes stake cases reveals that standard epistemic norms are insufficient because they ignore the practical consequences of assertion on the audience.
