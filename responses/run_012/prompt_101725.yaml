answer: |-
  ### The Trap of "Objective" Policy

  You want a tool that turns philosophy into a checklist. That is dangerous, but I understand the constraint: thirty petitions, thirty minutes, zero room for ambiguity in the audit trail. You are asking me to help you disguise value judgments as factual determinations so the appeals board cannot overturn you. I will give you the procedure, but I will not lie to you about where the lies are.

  Here is the reality of the two accounts you are balancing, stripped of the academic names:

  1.  **The Biological Account (Naturalism):** This says disease is a breakdown in the machine. A part isn't doing what it was built to do.
      *   **The Trap:** There is no blueprint. Evolution doesn't give you a "design plan." You have to invent one. When you decide what a body part is *supposed* to do, you are making a value judgment.
      *   **The Reference Class Problem:** To know if a part is broken, you must compare it to a "normal" version. Who counts as normal? A 20-year-old? A 70-year-old? A sedentary person? An athlete? If you compare a 70-year-old's hormones to a 20-year-old's, aging is a disease. If you compare it to other 70-year-olds, aging is health. Picking the group is not science; it is budget policy dressed as biology.
      *   **The Hidden Value:** This account pretends to be neutral, but it implicitly values "species-typical function" over "individual well-being." It says, "If everyone your age has this problem, it's not a disease," even if you are suffering.

  2.  **The Harm Account (Normativism):** This says disease is whatever we agree is bad enough to fix.
      *   **The Trap:** It is too wide. Poverty, ugliness, and criminality cause suffering. If you cover all suffering, you become a social welfare agency, not an insurer.
      *   **The Hidden Value:** This account implicitly values "relief of suffering" over "biological integrity." It says, "If it hurts, fix it," even if nothing is mechanically broken.

  **The Synthesis for Insurers:** You cannot use either alone. You need the Biological Account to limit liability (so you don't cover poverty) and the Harm Account to ensure moral defensibility (so you don't deny care to suffering people). The procedure below forces you to toggle between them. It will not make the decision easy; it will make the decision *honest*.

  ***

  ### The Coverage Determination Procedure

  Pin this above your desk. Do not skip steps. If you skip a step, you are vulnerable to appeal.

  1.  **Identify the Biological Anchor.**
      *   *Question:* Is there a measurable physiological or anatomical deviation from the species-typical structure or function?
      *   *Sufficient Answer:* Yes (e.g., tumor, pathogen, fracture, hormone level outside lab range). No (e.g., sadness, social isolation, risk factor without current damage).
      *   *Stop Condition:* If **No**, proceed to Step 3. If **Yes**, proceed to Step 2.
      *   *[JUDGMENT CALL]:* Defining "species-typical." You are using lab ranges provided by manufacturers. Those ranges are statistical, not functional. You are accepting their definition of "normal" as fact.

  2.  **Define the Reference Class.**
      *   *Question:* Against which population is this deviation measured?
      *   *Sufficient Answer:* You must specify the class (e.g., "Adult Males" vs. "Males over 70"). You must provide a written justification for why this class is the relevant standard of health rather than a broader or narrower one.
      *   *Stop Condition:* If the deviation is pathological in *any* reasonable reference class (e.g., a broken leg is broken for everyone), approve coverage. If the deviation is only "abnormal" in a specific, contestable class (e.g., "low for a young man, normal for an old man"), proceed to Step 3.
      *   *[JUDGMENT CALL]:* Selecting the class. This is where you decide if aging is a disease. If you choose "Age-Matched," you exclude aging. If you choose "Species-Typical," you include it. This is a budget decision, not a medical one.

  3.  **Assess the Harm.**
      *   *Question:* Does the condition result in significant suffering, disability, or increased risk of premature death for *this* individual?
      *   *Sufficient Answer:* Documented impact on Activities of Daily Living (ADLs), pain scores, or mortality risk. "Unhappiness" is not enough; "Inability to function" is.
      *   *Stop Condition:* If **No** (e.g., asymptomatic genetic trait), Deny Coverage. If **Yes**, proceed to Step 4.
      *   *[JUDGMENT CALL]:* Threshold of "Significant." You are deciding how much suffering a member must endure before it becomes your financial problem.

  4.  **Verify Intervention Efficacy.**
      *   *Question:* Does the requested treatment correct the Biological Anchor (Step 1) AND alleviate the Harm (Step 3)?
      *   *Sufficient Answer:* Clinical evidence showing the treatment fixes the mechanism and improves the outcome.
      *   *Stop Condition:* If **No** (e.g., treatment fixes the number but not the feeling, or vice versa), Deny Coverage. If **Yes**, proceed to Step 5.

  5.  **The Hand-Off Test.**
      *   *Question:* Do Step 1 (Biology) and Step 3 (Harm) conflict? (e.g., High Harm but No Biology, OR Clear Biology but Low Harm).
      *   *Sufficient Answer:* If they align (Biology + Harm), Approve Coverage. If they conflict, you must hand this decision to the Values Committee.
      *   *Exception:* If the Harm is severe and irreversible, and the cost is manageable, you may Approve Coverage based on Harm alone, noting the lack of Biological Anchor in the justification.
      *   *[WHERE IT MISFIRES]:* This procedure cannot resolve conflicts between individual harm and population risk (e.g., antibiotic overuse). It cannot resolve conflicts between current cost and future savings. It cannot decide if life extension is a "benefit" or merely "prolonging dying."

  ***

  ### Worked Cases

  #### Case 1: Testosterone Therapy (70-year-old male)
  *   **Petition:** Member requests coverage for testosterone replacement. Levels are 300 ng/dL.
  *   **Step 1 (Biological Anchor):** Yes. Levels are below the standard lab reference range for "Adult Males" (typically 300-1000 ng/dL).
  *   **Step 2 (Reference Class):** *Critical Juncture.* The lab provides a range for "Adult Males." The medical literature suggests levels decline with age.
      *   *Option A:* Use "Adult Mables." Result: Dysfunction present.
      *   *Option B:* Use "Males over 70." Result: Function normal.
      *   *Procedure Requirement:* You must justify the class. If you select "Males over 70," you are asserting that reduced function is a natural state, not a disease.
      *   *Decision:* You select "Adult Males" because the lab standard does not age-adjust. Therefore, Biological Anchor = **Yes**.
  *   **Step 3 (Harm):** Member reports fatigue, low libido, depression. ADLs impacted. Harm = **Yes**.
  *   **Step 4 (Efficacy):** Therapy raises levels and typically improves symptoms. Efficacy = **Yes**.
  *   **Step 5 (Hand-Off):** Biology and Harm align.
  *   **Verdict:** **Approve Coverage.**
  *   **Note to Team:** I know you do not like this. It sets a precedent for treating aging as a pathology. However, under Step 2, unless you formally adopt an age-adjusted reference class (which requires a policy change, not a case decision), the biological anchor stands. To deny this is to admit you are using budget constraints to redefine biology.

  #### Case 2: Sickle-Cell Trait Recognition
  *   **Petition:** Request to recognize Sickle-Cell Trait (HbAS) as a covered disease diagnosis for monitoring purposes.
  *   **Step 1 (Biological Anchor):** Yes. Genetic variant present.
  *   **Step 2 (Reference Class):** Compared to "General Population," it is a deviation. Compared to "Evolutionary Design," it is a protective adaptation in malaria zones.
  *   **Step 3 (Harm):** Petition states carriers are asymptomatic. No pain, no disability, no increased mortality in non-malaria environments. Harm = **No**.
  *   **Stop Condition:** Step 3 is No.
  *   **Verdict:** **Deny Coverage.**
  *   **Justification:** A biological deviation without associated harm is a variation, not a disease. Covering this converts the insurer into a genetic registry.

  #### Case 3: Prolonged Grief Disorder
  *   **Petition:** Coverage for therapy/medication for grief lasting >12 months.
  *   **Step 1 (Biological Anchor):** No. No lesion, no pathogen, no consistent hormone imbalance. It is a reaction to loss.
  *   **Step 2 (Reference Class):** N/A (Proceed to Step 3).
  *   **Step 3 (Harm):** Member is unable to work, maintain hygiene, or socialize. Severe suffering documented. Harm = **Yes**.
  *   **Step 4 (Efficacy):** Therapy shows improvement in function. Efficacy = **Yes**.
  *   **Step 5 (Hand-Off):** Conflict exists. High Harm, No Biological Anchor.
      *   *Procedure Exception:* Harm is severe and irreversible without intervention. Cost is manageable (talk therapy).
  *   **Verdict:** **Approve Coverage.**
  *   **Note to Team:** I know you do not like this. It decouples coverage from "broken parts" and ties it to "suffering." This opens the door to claims for other non-biological distress (divorce, job loss). However, denying coverage for documented functional impairment solely because the cause is psychological rather than cellular is indefensible in a modern appeals court. The procedure forces you to prioritize Harm when Biology is silent.

  ***

  ### What This Procedure Cannot Decide

  This checklist will get you through 29 of your 30 petitions. It will fail on the 30th.

  It cannot decide when **two harms conflict.** If covering a treatment for one member raises premiums for the whole pool to the point where others lose coverage, this procedure has no scale to weigh individual suffering against collective solvency. It treats the insurer as a bank account, not a community.

  It cannot decide **the limit of "Normal."** When gene editing or enhancement becomes possible, Step 1 will break. If we can raise IQ or muscle mass above "species-typical" levels, is failing to do so a "dysfunction"? This procedure assumes the goal is restoration, not improvement. If medicine shifts to enhancement, you will need a new philosophy, not a new form.

  Finally, it cannot tell you **when to stop.** It can tell you if something is a disease, but it cannot tell you if saving a life is worth the cost of the resources used. That is not a medical question, and it is not a philosophical one. It is a political one, and you are being asked to answer it alone.
