answer: |-
  **Exam Question**

  **Question 4**
  Consider the following case: Elena promised her mother months in advance that she would attend a critical pre-surgery consultation. However, Elena has also registered as an organ donor and is discovered to be the only viable match for a stranger's child requiring a transplant. The surgery is rescheduled to the exact same morning as her mother's consultation. Elena cannot be in both places. Furthermore, the obligation to the stranger's child exists only because she voluntarily joined the donor registry, whereas the promise to her mother was a standalone commitment.

  Write an essay that addresses the following:
  (a) Reconstruct the strongest logical argument for why genuine moral dilemmas (where two binding obligations cannot both be fulfilled) are impossible, utilising the principle that 'ought implies can'.
  (b) Identify exactly which premise a philosopher who believes dilemmas *are* possible must reject to avoid contradiction.
  (c) Defend that rejection against the charge that it is merely 'fudging the logic' to save a desired conclusion. In doing so, consider whether the fact that Elena voluntarily joined the donor registry (thereby helping to create the clash) renders the dilemma illusory.

  *(Word limit: 1,000 words)*

  ***

  **Model Answer**

  The claim that genuine moral dilemmas are logically impossible rests on a conflict between our moral intuitions and the consistency of moral logic. To reconstruct the argument against dilemmas, we begin with Elena's situation. She faces two obligations: she ought to attend her mother's consultation (Obligation A) and she ought to donate the organ (Obligation B). It is physically impossible for her to do both (Not Can (A and B)).

  The impossibility argument proceeds as follows. First, we accept the Principle of Agglomeration: if an agent ought to do A and ought to do B, then they ought to do (A and B). Second, we accept the Kantian maxim that 'Ought Implies Can' (OIC): if an agent ought to do X, it must be possible for them to do X. If we combine these, we reach a contradiction. If Elena ought to do A and ought to do B, Agglomeration dictates she ought to do (A and B). By OIC, this implies she *can* do (A and B). Yet, by definition of the dilemma, she cannot. To resolve this contradiction, the argument concludes that the initial description was false: Elena cannot have two binding obligations. One 'ought' must dissolve, meaning no genuine dilemma exists.

  A defender of genuine dilemmas must reject a premise to break this chain. While some reject OIC, this is costly as it severs the link between morality and agency. The more sophisticated move is to reject the Principle of Agglomeration. One can argue that while Elena individually ought to A and individually ought to B, it does not follow that she ought to the conjunction (A and B) when that conjunction is impossible. Obligations may be *prima facie* binding individually without aggregating into a single binding command to do the impossible.

  Is this rejection merely 'fudging the logic'? Critics argue that denying Agglomeration makes moral reasoning incoherent; if I ought to pay tax and ought to feed my child, surely I ought to do both. However, the dilemma defender replies that Agglomeration holds only when the actions are compossible. Rejecting it is not fudging, but rather acknowledging that moral obligations are not atomic propositions in a vacuum; they are sensitive to context. To insist on Agglomeration in impossible contexts is to prioritise logical tidiness over moral reality. It preserves the intuition that Elena truly wrongs someone regardless of her choice, without demanding she perform a physical impossibility.

  Finally, does the fact that Elena volunteered for the donor registry change this? Some argue that because she created the clash, she cannot claim a genuine dilemma; she is simply cleaning up her own mess. However, this conflates *blame* with *possibility*. That Elena is blameworthy for placing herself in a position where she must choose does not negate the binding nature of the obligations at the moment of choice. She may be culpable for the history leading to the conflict (a diachronic 'can'), but at the moment of decision (a synchronic 'can'), she still faces two competing 'oughts' she cannot satisfy. To argue otherwise is to suggest that past negligence erases present obligation, which is counter-intuitive. The dilemma is genuine because the conflict is real, even if the agent is at fault for the conflict's existence. Thus, rejecting Agglomeration allows us to acknowledge the tragedy of the choice without violating logical consistency regarding what is physically possible.

  ***

  **Marking Scheme**

  **First Class (70%+)**
  *   **Reconstruction:** Clearly articulates the conflict between Agglomeration and 'Ought Implies Can' (OIC). Explicitly formulates the contradiction: $O(A) \land O(B) \rightarrow O(A \land B) \rightarrow Can(A \land B)$.
  *   **Premise Identification:** Correctly identifies **Agglomeration** as the premise to reject (or offers a nuanced rejection of the scope of 'Can').
  *   **Defense Against 'Fudging':** Argues that rejecting Agglomeration is not logical cheating but a recognition that obligations are context-sensitive or *prima facie*. Distinguishes between logical consistency and moral residue (the feeling of guilt remains even if one 'ought' is dropped).
  *   **Self-Creation/Diachronic Distinction:** **Crucial Differentiator:** Explicitly distinguishes between the **diachronic 'can'** (could she have avoided this situation in the past?) and the **synchronic 'can'** (can she do both now?). Argues that voluntary participation affects *blame* for the situation, but not the *existence* of the dilemma at the moment of choice.
  *   **Common Pitfall Avoided:** Does not confuse "having an excuse" with "not having an obligation."

  **Upper Second (2:1) (60-69%)**
  *   **Reconstruction:** Accurately outlines the 'Ought Implies Can' argument and identifies the contradiction.
  *   **Premise Identification:** Identifies that Agglomeration or OIC must be dropped, but may not explain *why* Agglomeration is the better candidate for rejection as clearly as a First.
  *   **Defense Against 'Fudging':** States that rejecting the premise is valid but may rely on a simpler assertion that "morality isn't math" without fully explaining how obligations function without Agglomeration.
  *   **Self-Creation/Diachronic Distinction:** Addresses the volunteer aspect but may conflate blame with obligation. Might argue that because she volunteered, the obligation is weaker, rather than distinguishing the *timing* of the impossibility. May miss the specific **diachronic vs. synchronic** distinction regarding the word 'can'.
  *   **Common Pitfall:** Often spends too much time on the specific details of the medical scenario rather than the logical structure of the dilemma argument.

  **Lower Second (2:2) (50-59%)**
  *   **Reconstruction:** Understands the basic tension but fails to formally reconstruct the logical steps (Agglomeration is often missing).
  *   **Premise Identification:** Vaguely suggests "exceptions" to the rules rather than rejecting a specific premise.
  *   **Self-Creation:** Likely to argue that because she volunteered, she simply *must* donate (or must keep her promise), resolving the dilemma by prioritising one duty rather than analysing the structure of the conflict.
  *   **Common Pitfall:** Treats the question as a standard "what should she do?" applied ethics question rather than a meta-ethical analysis of dilemmas.

  **Fail (<50%)**
  *   **Content:** Fails to address the logical argument against dilemmas. Relies on the Trolley Problem or unrelated examples.
  *   **Logic:** Misunderstands 'Ought Implies Can' (e.g., thinks it means "if you can't, you shouldn't").
  *   **Scenario:** Ignores the specific constraints of the Elena case provided in the prompt.
