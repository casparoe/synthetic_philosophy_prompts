  2.  **Direction 1: Mapping the Scale Argument onto the Episodes:**

      *   *Decision Makers & Options:*
          *   UK Act: Parliament/Government. Options: Recognize (procedural duty) or Don't Recognize. *Dependency:* What exactly does "have regard" mean in practice? (Assume it imposes low-cost administrative burden but potential for downstream regulation).
          *   NYU Declaration: Scientists/Philosophers. Options: Sign or Don't Sign. Impact: Normative pressure, shifting Overton window, not law.
      *   *Probability of Sentience:*
          *   Scale Argument needs $P(S) > 0$.
          *   UK Review: Implicitly treated $P(S)$ for insects as below a threshold for *action*, not necessarily zero ontologically. For decapods, $P(S)$ was high enough.
          *   NYU: Explicitly claims "realistic possibility."
          *   *Crucial Distinction:* Is $P(S)$ a credence about a fact (does the bug feel?) or a measure of theoretical disagreement (Integrated Information Theory vs. Global Workspace)? If the latter, the Scale Argument becomes an argument for *theoretical humility*, not just biological uncertainty.
      *   *Lobster vs. Fruit Fly:*
          *   Why the split? Neuroanatomy (centralization, nociception).
          *   Scale Argument challenge: If we lack a non-arbitrary prior over the reference class "invertebrates," the cut-off looks arbitrary. The UK review relied on specific neural markers. The Scale Argument says even if markers are absent, the *numbers* compensate for lower $P(S)$.
          *   *Problem:* The Scale Argument assumes $P(S)$ is independent of $N$ (numbers). But scientifically, evidence for sentience usually *decreases* as we go down the phylogenetic tree. So $N$ goes up, $P(S)$ goes down. Does $N \times P(S)$ actually increase?
      *   *Cost Asymmetry:*
          *   UK Act: "Have regard." Low cost to include insects administratively. High *potential* cost if "having regard" blocks pesticide use or agricultural practices.
          *   Scale Argument logic: If Cost(Inclusion) is low, and Expected Harm($N \times P(S)$) is high, inclusion is mandatory.
          *   The UK excluded insects. Why? Likely because the *downstream* costs (agriculture) are perceived as massive, despite the *procedural* cost being low. The Scale Argument often underestimates the economic stakes of the downstream implications.

  3.  **Direction 2: What the Episodes Reveal About the Scale Argument:**

      *   *Implicit Probability Threshold:*
          *   UK Act implies a threshold $T$. If $P(S) < T$, ignore, regardless of $N$.
          *   Is this defensible? Deontologically, maybe (rights require certain capacities). Consequentialistically, no (expected utility sums).
          *   Inertia: Animal law is built on vertebrates. Extending to decapods was a stretch; insects were a bridge too far for the political machinery.
      *   *Fanaticism Objection:*
