answer: |-
  You speak sharply, like a man who has found a crack in the wall and claims the house must fall. But you confuse the architect's plan with the builder's constraints. As a physician, I tell you: if a man is accustomed to eating only rotten flesh, you do not command him immediately to live on honey and manna. You give him clean meat first, or he will die of starvation. The divine wisdom does not ignore the clay from which man is formed. You ask if the Torah is the best guidance for all time? Yes, precisely because it accounts for the stubbornness of human nature, which does not change. The Egyptians are gone, but the human capacity for imagination to overpower intellect remains. The Law is eternal because it treats the disease of the soul as it actually is, not as a poet might wish it to be.

  You demand I pick one book: was the end the sacrifice or the weaning? I say you present a false choice. The end is the knowledge of God and the submission of the will to Him. Sacrifice was the vessel chosen to break the vessel of idolatry, nothing more. When the Temple was destroyed, prayer took its place, proving the end was never the blood, but the devotion. As for slavery and meat, do not lump distinct things together. The Law regulates them to curb cruelty and lust, building a stable society where wisdom can eventually grow. A society that collapses into chaos because it demanded too much too soon teaches no one truth. The Torah is perfect not because it ignores reality, but because it guides men through it toward the ultimate end. Do not mistake the medicine for the health.
