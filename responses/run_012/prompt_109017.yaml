answer: |-
  Here are nine questions designed to be asked aloud, with follow-ups tailored to her likely Parfitian-but-strict responses.

  **1. The "Same Process" Definition**
  "You argue that what matters is the continuation of the *very same* causal process generating your mental life. Could you sketch what counts as 'same process' for you? Is it about the physical substrate, the pattern of activity, or the history of the atoms involved?"
  *   **Follow-up:** (If she emphasizes physical continuity of the substrate): "So if a neuron fires and causes the next one to fire, that's the chain. But given synaptic turnover happens constantly, are we saying the process is only as stable as its slowest-changing part?"

  **2. The Gradual Replacement Boundary**
  "You're happy to grant survival in gradual neuron-by-neuron replacement, which aligns with the 'degrees of what matters' view. But is there a threshold where the causal process snaps? If we replace 51% of your brain in a week versus a year, does the *speed* of replacement break the causal chain you rely on?"
  *   **Follow-up:** (If she says it's vague/no sharp line): "If the line is vague, does that mean there are cases where it's objectively indeterminate whether you've survived, or just indeterminate whether we should *say* you've survived?"

  **3. Radio Signal vs. Blueprint (Causal Constraint I)**
  "Let's look at the teletransporter. You say the causal chain breaks there, creating a duplicate. But consider a 'Vat Case': a machine reads a blueprint of your brain and constructs a body from new matter. If the radio signal in the teletransporter case carries the causal information, why doesn't the blueprint in the vat case do the same work? What's the metaphysical difference between a signal and a schematic?"
  *   **Follow-up:** (If she says the signal is dynamic while the blueprint is static): "But your brain stores memories statically until recalled. If static storage counts as 'you' internally, why doesn't static storage count as 'you' when it's transmitted externally?"

  **4. The Non-Destruction Glitch (Causal Constraint II)**
  "Imagine the teletransporter malfunctions: it scans and builds the replica, but fails to destroy you. You step out and spend an hour arguing with your replica. On your view, he's a duplicate. But for that hour, you have identical causal histories up to the scan. What fact about the *causal process* makes your future matter more than his, given you're now two distinct processes running in parallel?"
  *   **Follow-up:** (If she says you are only continuous with yourself): "But he remembers being you just as vividly as you do. If identity doesn't matter, as Parfit says, why does the 'original' causal thread get privileged over the duplicate's thread?"

  **5. Fission Arithmetic (Division I)**
  "Moving to fission: if I split into two successors, and 'what matters' comes in degrees, do I suffer a loss? Is it that I get 0.5 survival in each branch, or do I get full survival in both? How does the arithmetic work when the process forks?"
  *   **Follow-up:** (If she says it's 0.5 in each branch): "If it's 0.5 in each, then fission is worse than normal survival. But Parfit argued fission is as good as survival. Are you willing to say splitting yourself in two is literally a worse outcome than staying intact?"

  **6. Branch Competition (Division II)**
  "Following up on that: if I fission into Left and Right, and then Left dies immediately, do I lose half my 'what matters'? Or does Right's survival retroactively secure the full degree of what mattered? Do the branches compete for the survival points?"
  *   **Follow-up:** (If she says they don't compete): "Then if Right survives a long life and Left dies instantly, am I rational to be equally concerned about both futures at the moment of fission? It seems counterintuitive to fear Left's death if it doesn't diminish the total 'what matters'."

  **7. The Self-Concern Objection**
  "This is the big one: If personal identity is off the table, why is it rational to care *more* about the future person connected by your causal process than about a perfect duplicate? If I'm not identical to my future self, what grounds the special prudential concern for *this* causal chain over any other?"
  *   **Follow-up:** (If she says causal connection is the only ground for concern): "But isn't that just defining 'identity' in terms of 'what matters' and then denying it's identity? If the causal chain does all the work, why not just call it identity and be done with it?"

  **8. Practical Implications**
  "Stepping back from the metaphysics: if your view is correct, should we change how we treat teletransportation or uploading? If the receiver is a duplicate who thinks they're you, do they have a right to your property, or does your estate trigger upon scanning?"
  *   **Follow-up:** (If she says the duplicate has no claim): "So the duplicate is essentially a stranger with your memories. Does that mean we should treat psychological continuity as legally irrelevant if the causal process was interrupted?"

  **9. Changing Her Mind**
  "Finally, what would actually change your mind on this? Is there a thought experiment or a physical discovery about the brain that would convince you that the teletransporter *does* preserve the same causal process, or is this a purely conceptual commitment for you?"
  *   **Follow-up:** (If she says it's conceptual): "If it's conceptual, is there a risk that the view becomes unfalsifiable? How do we test if we've correctly identified the 'very same process' if empirical data can't shift the verdict?"
