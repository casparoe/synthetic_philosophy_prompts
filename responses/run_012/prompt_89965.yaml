  So she has two realizations:
  1. Some things (future desires) can't be pre-closed.
  2. The Epicurean logic is technically true (no subject to suffer), but... (here comes the conflict with Marcus).

  Marcus takes the line: "You will not be around to be deprived... dread is confusion about absence."
