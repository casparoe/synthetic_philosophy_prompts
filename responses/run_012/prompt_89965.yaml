answer: |-
  The spreadsheet was color-coded. Green for completed, yellow for in progress, red for impossible. Elena sat at her kitchen table, the glow of the laptop illuminating a stack of finalized insurance forms. She had closed the credit cards. She had transferred the car title to her brother, David, along with a note that said *No guilt, just keys.* She had apologized to her college roommate for the thing in 2014. David had cried on the phone. It was done.

  The logic was hers, though it leaned on old bones. Epicurus said death was nothing to us. Elena had refined the theorem. Death was a thief. It stole time, experience, potential. But a thief could not steal from an empty house. If she emptied the house of expectations, of debts, of open loops, death would arrive to find nothing to take. The cost of leaving would be zero.

  She took a sip of tea. It had gone cold.

  On the counter sat a packet of heirloom tomato seeds. She had bought them three days ago, before the diagnosis, before the logic took hold. *Cherokee Purple.* She looked at the packet. To plant them would be to expect a harvest in August. She would be dead in July. If she planted them, she would be creating a future she would not inhabit, which meant she would be leaving something behind. That violated the zero-cost principle.

  But if she didn't plant them, she was denying herself the act of planting.

  She put the packet in the drawer. She marked the row on the spreadsheet: *Gardening – Abandoned.* Green.

  It felt like holding her breath.

  Marcus arrived at seven. He brought Thai food and a bottle of wine he knew she couldn't drink much of, given the medication. He was a high school history teacher, broad-shouldered and soft-spoken, the kind of man who listened to students when they lied about their homework because he knew why they were lying.

  "You look tidy," Marcus said, hanging his coat. He meant the apartment. There were no piles of mail, no laundry baskets. Just surfaces, cleared.

  "I'm optimizing," Elena said. She dished out pad see ew. "Sit."

  They ate for ten minutes. The silence was comfortable, the way it is when people have known each other longer than they have been sober or serious.

  "David called me," Marcus said. "He said you sent the car."

  "It's more useful to him. I don't drive anymore."

  "And the apology?"

  "Done."

  Marcus put his fork down. "Elena. You're treating this like a tax audit."

  "I'm treating it like a subtraction problem. If X is the value of my life, and Y is the loss of death, I'm reducing Y to zero by reducing X to match."

  "That's not how loss works."

  "It is if you define loss as deprivation." Elena leaned forward. "I read the arguments. The deprivation account. Death is bad because it deprives you of the goods of life. So, if I voluntarily relinquish the goods of life in advance, I cannot be deprived of them. I'm beating the system."

  "You're not beating it. You're just dying early."

  "I'm dying on schedule. I'm just adjusting the variables."

  Marcus rubbed his face. He looked tired. Not the tired of a long day, but the tired of watching someone walk toward a cliff while checking a compass. "You can't relinquish the goods of life while you're still alive. Because you're still the kind of creature that wants them."

  "I can stop wanting them."

  "Can you?" Marcus gestured to the drawer where she'd put the seeds. "You bought those."

  "I made a mistake."

  "You bought them because you thought you might want to see them grow. That desire isn't a debt you can pay off. It's a... it's a trajectory. You can't stop a trajectory without crashing."

  Elena felt a flicker of irritation. This was the flaw she had sensed but couldn't name. The seeds were a future desire. She couldn't 'finish' the desire to see them bloom because the desire was contingent on the bloom existing in the future. By killing the future, she wasn't satisfying the desire; she was amputating the part of her that held it.

  "I notice something, though," Elena said. "I look at the seeds, and I feel a pang. But I know that in July, when I'm dead, I won't feel the pang. There is no moment where I am dead and suffering the lack of tomatoes. Epicurus is right. The suffering is only now."

  "Exactly," Marcus said. "So why are you suffering now to avoid a suffering that won't happen?"

  "Because the loss is real, even if the feeling isn't."

  "The loss is to whom?" Marcus asked. "If you aren't there, who loses?"

  "The world loses. I lose the version of me that would have been."

  "But that version of you doesn't exist. You're grieving a ghost."

  "I am the ghost," Elena said. "I'm the one who won't be there."

  Marcus shook his head. "No. You're the one who is here. And right now, you are depriving yourself of the seeds to avoid a deprivation you won't experience. You're confusing your absence with your presence. You're trying to make your absence comfortable for your presence."

  "It minimizes the cost."

  "There is no cost to you in being dead, Elena. That's the point. You're worried about a bill that doesn't get sent."

  "But I'm looking at the bill now."

  "Then put it down."

  "I can't. Because if I put it down, I admit that I'm losing something. If I admit I'm losing something, then death has power over me."

  "Death has power over you because it stops you. Not because it takes things. There's a difference."

  "It feels like taking."

  "That's the confusion," Marcus said. "You're projecting yourself into the void. You're standing in the future looking back at your life and saying, 'Look what I missed.' But you won't be standing there."

  Elena stood up and walked to the window. It was dark outside. She could see her reflection. She looked pale, thinner. She thought about the brother she had reconciled with. She had closed the loop. But by closing it, she had ensured there would be no new fights, no new resolutions, no drift and return. She had frozen the relationship in a state of perfect, dead peace. She had saved herself from the pain of a future falling out, but she had also killed the possibility of a future intimacy that didn't yet exist.

  "I can't finish the things I don't know I want yet," she said to the glass.

  "No," Marcus said from the table. "You can't."

  "So the ledger is incomplete."

  "The ledger is the wrong tool."

  "If I don't use the ledger, I have to accept that I'm being robbed."

  "You aren't being robbed. Robbery implies a victim."

  "I am the victim."

  "You're the subject," Marcus said. "And the subject is ceasing. You're trying to manage the cessation as if it's an event in your life. It's not. It's the end of the management."

  "But the dread is an event in my life."

  "Then treat the dread. Don't treat the death."

  "I can't separate them." Elena turned around. "If I accept that I won't be there to suffer, then I have to accept that nothing I do now matters in the long run. Because the long run is where I'm not."

  "Things matter because you're here now. Not because you'll be there later."

  "That's a consolation prize."

  "It's the only prize," Marcus said. "You're trying to balance the books for a company that's liquidating. You don't need to balance the books. You just need to... spend the remaining cash."

  "If I spend it, I lose it."

  "If you don't spend it, it vanishes anyway. The only difference is whether you got to use it."

  Elena walked back to the table. She looked at the spreadsheet. The green cells looked like tombstones.

  "I bought the seeds," she said. "I put them in the drawer. I didn't plant them."

  "Plant them."

  "It's October."

  "Plant them inside. Under lights. They might not fruit. They might just grow leaves and die."

  "Why would I do that?"

  "Because you want to see them grow. Not because you want the tomatoes."

  Elena sat down. She looked at Marcus. He wasn't smiling. He looked sad, and stubborn. He believed he was right, but he knew he couldn't make her feel it. She knew he was logically correct—there would be no moment of deprivation—but she also knew that the logic didn't touch the ache in her chest, the sense that she was being erased.

  "If I plant them," Elena said, "I'm admitting that I expect a future."

  "You're admitting you want one."

  "Wanting is the vulnerability."

  "Wanting is the point." Marcus leaned in. "You say death takes nothing if you have nothing. But if you have nothing, you're already dead. You're trying to arrive at the grave before you get there."

  "I'm trying to make the arrival painless."

  "It's not painful for you! That's what I'm trying to say. You're hurting yourself right now to avoid a hurt that won't exist. You're the one suffering the loss, not the you that's gone."

  "But the loss is of *me*."

  "No, it's the loss of *time*."

  "Which is mine."

  "It's not property, Elena. You don't own time. You occupy it."

  "If I don't own it, why does it hurt to leave it?"

  "Because you're occupying it now. Because you're here." Marcus tapped the table. "The pain is the proof you're alive. You're trying to anesthetize the life to make the death easier. But the death doesn't care."

  "I care."

  "Then stop acting like you're already gone."

  "I have to prepare."

  "You're preparing for a trip you won't take. You're packing bags for a destination where you won't arrive."

  "It's better than being caught unprepared."

  "There is no preparation for non-existence." Marcus's voice rose, just a fraction. "You can't budget for zero. You can't save up for nothing. Every minute you spend trying to make your absence cost nothing is a minute you're spending while you're present. You're paying the cost now to avoid a bill that won't come."

  "If I don't pay it now, I leave a mess."

  "Leave the mess!" Marcus slammed his hand on the table. The silverware jumped. "Leave the seeds in the packet. Leave the car keys on the table. Leave the argument with David unfinished. Let someone else deal with it. Let the world absorb the impact. You think you're protecting yourself by shrinking, but you're just making the hole smaller. The hole is going to be there regardless."

  "I won't be there to see the hole."

  "Exactly! So why does it matter how big it is?"

  "Because it matters to me *now*."

  "Then let it matter now! Feel the loss now. Grieve now. Don't try to push the grief into a future where you can't feel it."

  Elena opened her mouth. She wanted to tell him that the grief was too heavy to carry while she was still standing, that the logic was a crutch she needed to stay upright. She wanted to tell him that if she admitted the loss was real, she would drown.

  "Marcus," she said.

  "No, listen. You're arguing that you can outsmart the end by pretending it's a transaction. It's not a transaction. It's a cessation. You can't negotiate with a stop sign."

  "But I can choose how I approach it."

  "You can choose to drive until the road ends, or you can choose to park three miles back and walk the rest of the way because you're afraid of the crash. But the car stops either way."

  "I'm not afraid of the crash."

  "Then why are you braking?"

  "Because I don't want to leave skid marks."

  "Who cares about the skid marks?" Marcus stood up. "You care. The living care. You're worrying about the living. You're worrying about *me*."

  Elena looked at him. He was right. The ledger wasn't for her. It was for David. It was for Marcus. It was to make sure they didn't have to feel the weight of her absence. She was trying to make her death cost *them* as little as possible, and calling it her own philosophy.

  "I'm doing it for you," she said.

  "Then stop," Marcus said. "Let us carry it. That's what we're for."

  "But it's inefficient."

  "Love is inefficient." Marcus reached for the wine bottle, then stopped. He looked at her, his eyes bright. "You're trying to solve death like it's a math problem. It's not. It's a biological fact. You're fighting a wall with a spreadsheet."

  "I need the spreadsheet."

  "You need to plant the damn seeds."

  "I told you, it's October."

  "Plant them anyway."

  "It's irrational."

  "Everything you're doing is irrational. You're trying to minimize a loss that you won't experience. That's not rational. That's fear."

  "It's logic."

  "It's fear dressed as logic." Marcus stepped closer. "You're scared that if you want the tomatoes, and you don't get them, it will prove that death took something from you. And it did. It will. It takes everything. But you won't be there to count the inventory."

  "I'm counting it now."

  "Then count it. Count the loss. Admit it hurts. Admit you're angry. Admit you're scared. Don't hide behind Epicurus."

  "I'm not hiding."

  "You are. You're hiding in the idea that you won't be there to suffer. But you are here. And you are suffering. Right now."

  Elena felt the tightness in her throat. The spreadsheet glowed on the screen. The green cells mocked her. She had wanted to be light, unburdened. She wanted to slip away like a ghost before she was even dead. But Marcus was anchoring her. He was forcing her to be heavy, to be present, to be a person who would lose things.

  "I don't want to be heavy," she said.

  "Then be heavy together."

  "I can't ask that."

  "You're not asking. I'm offering." Marcus sat back down. He didn't look away. "You say death is nothing to us. Fine. But life is something. And you're still in it. So act like it. Stop trying to balance the books for a estate that doesn't exist yet."

  "But if I stop, I have to admit I'm going."

  "You're going. The spreadsheet doesn't change the trajectory."

  "It changes the impact."

  "It changes the paperwork." Marcus shook his head. "You're confusing the map with the territory. You think if you erase the map, you won't have to travel the distance."

  "I'm trying to make the distance shorter."

  "The distance is fixed, Elena. The only variable is how you walk it."

  "I don't want to walk it."

  "I know." Marcus reached across the table. He didn't touch her hand. He just rested his arm on the wood, an invitation. "But you are. And you're doing it right now. And I'm doing it with you. So put the computer away."

  Elena looked at the laptop. The cursor blinked in the cell next to *Gardening*.

  "If I close it," she said, "I can't reopen it."

  "You don't need to."

  "I need the control."

  "You don't have it."

  "I know," Elena said. She felt the tears coming, hot and sudden. She hated them. They were inefficient. They were a biological response to a psychological stimulus that served no purpose. They were a waste of water and salt.

  "Elena," Marcus said.

  "If I let go," she said, her voice cracking, "then I admit that I'm losing it all. And I can't..."

  "You're losing it all anyway."

  "Then why does it matter if I admit it?"

  "Because then you're not alone in it."

  "I'm alone in the dying."

  "You're alone in the experience. You're not alone in the fact." Marcus leaned forward. "You keep saying you won't be there to suffer the loss. That's true. But you are here to suffer the anticipation. And you don't have to do that part alone. That's the only part you can share."

  Elena looked at him. She wanted to believe him. She wanted to believe that sharing the anticipation reduced the weight. But the logic held firm in her head: the suffering is mine, the absence is mine, the zero is mine.

  "But the anticipation is just a preview," Elena said. "It's not the event."

  "It's the only event you get."

  "Then it's a poor substitute."

  "It's all there is." Marcus's voice was quiet now. "You're arguing that the preview doesn't count because the movie ends. But the preview is the only part you're watching."

  "I want to see the whole movie."

  "You can't."

  "Then I want to turn off the screen."

  "Don't."

  "It hurts to watch."

  "I know." Marcus waited. The silence stretched between them, filled with the hum of the refrigerator and the distant sound of traffic. "But if you turn it off now, you're just sitting in the dark."

  Elena looked at the laptop. She looked at the drawer with the seeds. She looked at Marcus. She knew he was right about the fear. She knew she was right about the logic. They were speaking different languages, one of emotion, one of metaphysics, and neither could translate for the other.

  "I still think the ledger helps," she said.

  "It helps you hide."

  "It helps me organize."

  "You can't organize nothing."

  "I can organize the approach to nothing."

  "There is no approach. There's just the stop."

  "There's a deceleration."

  "There's a crash."

  "I'm wearing a seatbelt."

  "You're wearing a straitjacket." Marcus exhaled, frustrated. "You're so busy trying to make sure you don't lose anything that you're not keeping anything. You're letting go of the wheel to prove you don't need to steer."

  "I'm letting go because the car is going off the cliff."

  "Then drive it until it goes over."

  "That's reckless."

  "It's living."

  "It's denial."

  "It's presence." Marcus stood up again. He was pacing now, the energy of the argument needing movement. "You say death is nothing. Okay. So why are you acting like it's everything? Why is it dictating your every move? If it's nothing, put the seeds in the dirt. If it's nothing, leave the credit cards open. If it's nothing, then live like it doesn't matter. But you're living like it's the only thing that matters."

  "Because it is the only thing that matters."

  "No, life is the only thing that matters. Death is the period. You're obsessed with the period."

  "Because it ends the sentence."

  "The sentence is what counts."

  "The sentence is incomplete."

  "So finish it."

  "I can't."

  "Then write until you can't." Marcus stopped pacing. He looked at her, his chest heaving slightly. "You're trying to write the period before you finish the sentence. You think that makes it neater. It just makes it nonsense."

  "It makes it controlled."

  "It makes it dead."

  "I am dying."

  "Then die," Marcus said. "Don't practice."

  "I'm preparing."

  "You're rehearsing."

  "It's the same thing."

  "It's not." Marcus came back to the table. He put his hands on the edge of the laptop. "Close it."

  "No."

  "Close it."

  "I need to check the insurance forms."

  "You checked them."

  "I need to check the beneficiaries."

  "They're set."

  "I need to make sure."

  "You're making sure of things that won't exist."

  "They will exist for David."

  "David will be fine. David will grieve. Let him grieve. You're robbing him of the grief."

  "I'm sparing him the burden."

  "Grief isn't a burden. It's the tax on love. You're trying to evade the tax."

  "I'm trying to minimize the liability."

  "There is no liability!" Marcus's voice cracked. "There is only us. And you're trying to dissolve the us before the end because you think it makes the end cleaner. It doesn't. It just makes the now emptier."

  Elena looked at his hands on the laptop. She could feel the heat from them. She wanted to pull the computer away. She wanted to agree with him. She wanted to win the argument. She wanted to stop talking.

  "If I close it," Elena said, "then I have to admit that I'm not in control."

  "You're not."

  "If I admit that, I might panic."

  "You might."

  "I can't panic. I have to stay calm."

  "Why?"

  "Because if I panic, I lose the dignity of the exit."

  "Who cares about the dignity?"

  "I care."

  "Then be undignified. Scream. Cry. Plant the seeds in October and watch them rot. Do something useless."

  "I don't want to be useless."

  "You're going to be dead. That's the ultimate uselessness. Accept it."

  "I can't."

  "Then suffer."

  "I am suffering."

  "Good." Marcus leaned in, his face close to hers. "Then stop trying to stop it. Let it hurt. Let it be messy. Leave the forms half-filled. Leave the argument with David open. Tell him you're still mad. Tell him you're scared. Tell him you don't know. Stop trying to be a ghost."

  "I'm not trying to be a ghost."

  "You're acting like one. You're haunting your own life."

  "I'm tidying it."

  "You're erasing it." Marcus grabbed the laptop lid. "Close it."

  "Don't."

  "Close it, Elena."

  "No."

  "Why?"

  "Because if I close it, I have to look at you."

  "Look at me."

  "I don't want to."

  "Look at me."

