      Prompt: "Each researcher's judgment is correct 80% of the time."
      Scenario: Draft is *bad*.
      Correct judgment = "This is bad" (Don't post). Probability = 0.8.
      Incorrect judgment = "This is sound" (Post). Probability = 0.2.
      Student: "Each researcher is wrong about a bad draft one time in five." (Correct).
      Student: "Chance that at least one... judges a bad draft sound and posts it is 1 - 0.8^12."
      Logic: $P(\text{Post}) = 1 - P(\text{No Post})$.
      $P(\text{No Post}) = P(\text{All 12 judge correctly}) = 0.8^{12}$.
      So $P(\text{Post}) = 1 - 0.8^{12}$.
      This is correct.
