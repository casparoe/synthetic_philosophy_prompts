prompt: |-
  My friend group is fighting about Secret Santa rules. Someone proposed capping the price at $5, and my friend Maya is defending it in a way I can't argue with: she says even if the people who get cheap gifts are getting exactly the same cheap gifts they'd have gotten anyway, it's still better if nobody's gift is way nicer than everyone else's, because it's just wrong for some people to be that far above the rest. I said you're literally only making the big spenders worse off and helping nobody, so what's the point? She says I'm only looking at how much each person ends up with and not at the gap itself, and that the gap being there is its own bad thing.

  My other friend said Maya's position means it'd be fine to break the tall kids' legs so everyone's the same height, which Maya said is a stupid comparison because nobody's getting hurt by a $5 cap.

  I honestly don't know who's right and I have to argue a side at dinner. Does her argument actually work, or does the leg thing kill it? And does it change anything if the people who lose out are the ones who were already better off anyway — like, are they allowed to complain? Keep it under 300 words and start with your bottom line.
