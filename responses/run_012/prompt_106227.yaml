  2.  **Deconstruct the "Two-Things View" (Coincidentalism):**
      *   *Core Claim:* Object A (Statue) and Object B (Clay) exist at the same place/time, are distinct, but share all matter.
      *   *Motivation:* Different modal properties (statue can't survive squashing, clay can), different historical properties (clay existed before statue), different aesthetic/value properties.
      *   *Main Rival:* Constitution View (One object, constituted by clay), or Eliminativism (No statues, just clay), or Dominant Sorts.

  3.  **Address the User's "Decisive Tests":**
      *   *Test 1 (Collapse):* Does "two objects" just mean "one object under two descriptions"?
          *   *Risk:* If the difference is *only* in predicates we apply (sortal-relative), then there's ontological bloat without payoff.
          *   *Defense:* The defender claims the difference is in *truth conditions* of counterfactuals, not just descriptions.
      *   *Test 2 (Predictive Power):* Does it change what happens/what to do?
          *   *Risk:* If both views agree the statue breaks when squashed, what does the ontology add?
