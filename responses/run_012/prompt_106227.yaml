      *   *Verdict:* It helps, but it shifts the debate to Social Ontology. It shows distinct persistence conditions, which supports numerical distinctness.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Direct, philosophical but pub-friendly (no jargon without explanation), rigorous.
      *   *Structure:*
          1.  Validate the position (it's a standard, defensible view called Coincidentalism).
          2.  Address the "Decisive Tests" first (Collapse & Predictive Power).
          3.  The Risk Map (Fatal -> Awkward).
