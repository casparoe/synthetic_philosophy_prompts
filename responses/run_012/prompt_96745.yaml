answer: |-
  Your friend has constructed a classic *reductio ad absurdum*: they've taken a principle you find intuitive (you can't blame people for what they couldn't know) and pushed it until it snaps into moral nihilism (we can't blame anyone, ever). The logic is valid, which means the error isn't in the deduction, but in the premises or their application.

  Since you want to keep the core principles (1) and (2)—the idea that blame requires knowledge, and knowledge is context-dependent—you cannot drop them without abandoning your moral intuition. You also can't drop (6), because a theory of blame that blames no one is indeed useless.

  The joint you need to break is **Step (3)**.

  ### Why Step (3) looks fine
  Step (3) claims that for figures like Jefferson, Churchill, or Columbus, the condition in Step (2) was met: that slavery, empire, or dispossession was "simply in the air" and they "couldn't reasonably have known better."

  This looks fine because it relies on a conflation of **prevalence** with **exclusivity**. We look back and see that slavery was legal, common, and economically entrenched, so we assume the *argument* against it was unavailable. We project our own epistemic isolation onto them. It feels like humility to say, "Who are we to judge?" but it's actually an assumption about their intellectual environment that rarely holds up to scrutiny.

  ### What dropping it costs you
  Dropping (3) costs you the **blanket immunity**. You can no longer use "his time" as a generic shield that automatically absolves historical figures. Instead, you have to treat "he couldn't have known" as a factual claim that requires evidence, not a philosophical axiom.

  You have to ask: *Was dissent actually impossible, or just inconvenient?*
  *   **Jefferson:** He wrote explicitly about the moral peril of slavery and the "wolf by the ear" dilemma. He knew the arguments; he chose the economy.
  *   **Churchill:** Reports on the Bengal famine were available; dissenting voices in Parliament existed. He chose priority for European theaters.
  *   **Columbus:** Even in 1493, there were Spanish clerics (like Montesino later, but the theological seeds were there) arguing for the humanity of Indigenous peoples.

  By dropping (3), you admit that these men were not morally blind; they were morally selective. They had access to the counter-argument but suppressed it. This means they *are* blameworthy under your own principles (1) and (2), because the "reasonable knowledge" was available to them, even if it wasn't popular.

  ### The selective use of the defense
  Your suspicion is correct. In practice, the "man of his time" defense is rarely applied consistently; it is a **taxon of admiration**.

  We apply it to Jefferson, but we do not apply it to the enslaved people who rebelled (we don't say "they were people of their time" for accepting their lot). We apply it to Churchill, but not to the Indian nationalists he jailed (we don't say "they were people of their time" for wanting independence). If the moral knowledge was truly bounded by the era, *no one* in that era could access the dissent. But dissenters always exist.

  When we use the defense for a hero, we are implicitly saying: *"He was bound by his time."*
  When we judge a villain, we say: *"He should have known better."*

  The price of dropping (3) is that you lose the ability to keep your heroes pristine. You have to accept that moral progress is usually driven by people who *did* know better within the "bad" time, and that the famous men we admire often chose to ignore them. The defense stops being a shield for ignorance and becomes a confession of priority: *He knew it was wrong, but he did it anyway.*

  Verdict: Reject Step (3); replace assumed ignorance with evidence of accessible dissent.
