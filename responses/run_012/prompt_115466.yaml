  ### I. The Logical Space

  Before assigning names to positions, we define the structural dimensions of the problem. A position is determined by its answers to the following sequential questions. Not all combinations are permissible; some answers preclude later questions.

  **Dimension 1: The Unit of Agency**
  *   **Question:** Is the primary deliberating agent the individual ("I") or the collective ("We")?
  *   **Permitted Answers:** Individual, Plural.
  *   **Constraint:** If Plural, the route terminates (no further individual-level distinctions apply).

  **Dimension 2: The Metaphysics of Rationality**
  *   **Question:** Is there a determinate fact of the matter about what rationality requires in this scenario?
  *   **Permitted Answers:** Yes, No.
  *   **Constraint:** If No, the route terminates.

  **Dimension 3: The Route of Dependence**
  *   **Question:** What is the nature of the link between your choice and the counterpart's choice?
  *   **Permitted Answers:** Causal Only, Evidential Only, Logical/Subjunctive.
  *   **Constraint:** "Causal Only" terminates the route (non-causal distinctions become irrelevant). "Evidential Only" terminates the route (logical control is denied).

  **Dimension 4: The Unit of Evaluation**
  *   **Question:** Does the demand of rationality apply to the specific act or to a general policy/disposition?
  *   **Permitted Answers:** Act, Policy, Disposition.
  *   **Constraint:** If Act, the route terminates (policy-level distinctions are irrelevant). If Disposition, the route terminates (policy-content distinctions are irrelevant).

  **Dimension 5: The Identity Threshold**
  *   **Question:** Does the logical dependence require the counterpart to run the exact same algorithm as you?
  *   **Permitted Answers:** Exact Identity, Functional Similarity.
  *   **Constraint:** Only applicable if Dimension 4 is "Policy".

  **Dimension 6: The Source of Normativity**
  *   **Question:** Is the reason to cooperate grounded in instrumental success (outcomes) or conformity to a rule (duty/universality)?
  *   **Permitted Answers:** Instrumental, Conformity.
  *   **Constraint:** Only applicable if Dimension 5 is "Functional Similarity".

  **Permitted Combinations (Paths):**
  1.  Plural (Terminates)
  2.  Individual + No Fact (Terminates)
  3.  Individual + Fact + Causal Only (Terminates)
  4.  Individual + Fact + Evidential Only (Terminates)
  5.  Individual + Fact + Logical + Act (Terminates - *Theoretically possible but rarely occupied*)
  6.  Individual + Fact + Logical + Disposition (Terminates)
  7.  Individual + Fact + Logical + Policy + Exact Identity (Terminates)
  8.  Individual + Fact + Logical + Policy + Similarity + Instrumental (Terminates)
  9.  Individual + Fact + Logical + Policy + Similarity + Conformity (Terminates)

  ---

  ### II. The Decision Tree

  **Entry:** You accept the Prisoner's Dilemma payoffs. You cannot communicate. You grant some dependence between choices.

  *   **Node 1: Unit of Agency**
      *   *Question:* Do you deliberate as a singular agent ("What should I do?") or as a member of a plural agent ("What should we do?")?
      *   *Branch A (We):* **Team Reasoning**.
          *   *Verdict:* Cooperate to maximize the group's payoff.
          *   *Awkward Commitment:* Requires a metaphysical shift in agency that standard rationality does not explain how to trigger.
      *   *Branch B (I):* Go to Node 2.

  *   **Node 2: Metaphysics of Rationality**
      *   *Question:* Is there a fact of the matter about what rationality requires here, or is the concept indeterminate?
      *   *Branch A (No Fact):* **Deflationary**.
          *   *Verdict:* There is no unique rational choice; the question is ill-posed.
          *   *Awkward Commitment:* Renders normative theory useless in precisely the cases where guidance is most needed.
      *   *Branch B (Fact):* Go to Node 3.

  *   **Node 3: Route of Dependence**
      *   *Question:* Is the connection between choices purely causal (physical influence/prediction), purely evidential (correlation without influence), or logical (same algorithm)?
      *   *Branch A (Causal Only):* **Causal Decision Theory**.
          *   *Verdict:* Defect, because your act cannot causally change theirs.
          *   *Awkward Commitment:* Forces you to leave money on the table in Newcomb-style problems where correlation is reliable.
      *   *Branch B (Evidential Only):* **Evidential Decision Theory**.
          *   *Verdict:* Cooperate, because your choice is strong evidence they will too.
          *   *Awkward Commitment:* Commends "managing the news" rather than influencing the world (e.g., avoiding medical tests to avoid bad news).
      *   *Branch C (Logical/Subjunctive):* Go to Node 4.

  *   **Node 4: Unit of Evaluation**
      *   *Question:* Does rationality evaluate your specific act or your underlying policy/disposition?
      *   *Branch A (Disposition):* **Constrained Maximization**.
          *   *Verdict:* Cooperate, because you possess a disposition to cooperate with similar types.
          *   *Awkward Commitment:* Requires cultivating a disposition that may be exploited by those who can fake similarity.
      *   *Branch B (Policy):* Go to Node 5.

  *   **Node 5: Identity Threshold**
      *   *Question:* Does the logical dependence require the counterpart to run your exact code, or merely a functionally similar one?
      *   *Branch A (Exact Code):* **Superrationality**.
          *   *Verdict:* Cooperate, assuming identical reasoners must output identical choices.
          *   *Awkward Commitment:* Cooperation collapses instantly if the counterpart differs by even one bit of code or random seed.
      *   *Branch B (Functional Similarity):* Go to Node 6.

  *   **Node 6: Source of Normativity**
      *   *Question:* Is the reason to adopt the cooperative policy that it produces the best outcomes or that it conforms to a universal rule?
      *   *Branch A (Best Outcomes):* **Policy-Level/Logical-Dependence**.
          *   *Verdict:* Cooperate, because your algorithm's output determines the output of all similar algorithms.
          *   *Awkward Commitment:* Implies you are responsible for the choices of independent agents who happen to run similar code.
      *   *Branch B (Universal Rule):* **Kantian/Cooperative Principle**.
          *   *Verdict:* Cooperate, because the maxim of cooperation is the only one that can be universally adopted without contradiction.
          *   *Awkward Commitment:* May require cooperation even in cases where universal adoption leads to suboptimal outcomes for you (duty over prudence).

  ---

  ### III. Location of Positions & Gap Analysis

  **Occupied Combinations:**
  1.  **Plural Agency:** Team Reasoning.
  2.  **No Fact:** Deflationary.
  3.  **Causal Only:** Causal Decision Theory.
  4.  **Evidential Only:** Evidential Decision Theory.
  5.  **Logical + Disposition:** Constrained Maximization.
  6.  **Logical + Policy + Exact:** Superrationality.
  7.  **Logical + Policy + Similar + Instrumental:** Policy-Level/Logical-Dependence (e.g., Functional Decision Theory).
  8.  **Logical + Policy + Similar + Conformity:** Kantian/Cooperative Principle.

  **Unoccupied Combinations (Gaps):**
  1.  **Logical + Act:** *Unexplored/Incoherent.* If the dependence is logical, the act is merely the output of a procedure. Evaluating the act in isolation ignores the mechanism generating the correlation. It collapses into Evidential Decision Theory or Logical-Dependence depending on how "act" is defined.
  2.  **Causal + Policy:** *Unattractive.* If the link is purely causal, policy-based reasoning offers no advantage over act-based causal reasoning in a one-shot game, as the policy cannot causally influence the past or the other's independent causal chain.
  3.  **Evidential + Disposition:** *Unexplored.* A disposition-based view that relies merely on evidence rather than logical control or causal power lacks a mechanism for why the disposition is rational to cultivate if it doesn't influence outcomes or logical outputs.
  4.  **Exact Identity + Instrumental:** *Merged with Superrationality.* Superrationality is typically instrumental (Hofstadter), but the "Exact" constraint makes it distinct from robust policy views. I have located it as its own leaf, but it could be viewed as a strict subset of Policy-Level views.
  5.  **Similar Identity + Disposition:** *Unexplored.* Constrained Maximization is usually framed around dispositions, but often implies a threshold of similarity. This gap is merely a matter of emphasis; it is structurally similar to the occupied Disposition node.

  ---

  ### IV. Limitations and Indistinguishable Leaves

  **Indistinguishable Leaves:**
  The tree cannot separate **Policy-Level/Logical-Dependence** from **Kantian/Cooperative Principle** based on the *verdict* in the standard Prisoner's Dilemma. Both recommend cooperation under functional similarity.

  **Reason for Indistinguishability:**
  Both views converge on the same action in symmetric cases because the "best outcome if universal" and the "only universalizable rule" coincide in the Prisoner's Dilemma.

  **Additional Question Needed:**
  To separate them, add a node asking: *"If universal adoption of the policy led to a slightly lower personal payoff than a non-universal exception, would you still cooperate?"*
  *   **Yes:** Kantian/Cooperative Principle (Duty binds even against marginal utility loss).
  *   **No:** Policy-Level/Logical-Dependence (Instrumental rationality binds only insofar as it maximizes the good).

  **Second Indistinguishability:**
  The tree groups **Kantian** and **Cooperative Principle** views into one leaf.
  *   **Reason:** Both rely on universalizability/conformity rather than direct instrumental calculation of the specific act.
  *   **Additional Question Needed:** *"Is the binding force derived from the contradiction in conception (logic) or the contradiction in will (desire for a good society)?"* This separates deontological Kantianism from rule-consequentialist Cooperative Principles.
