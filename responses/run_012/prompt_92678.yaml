              4.  Plurality (two rabbits) -> word takes pair form, not repeated.
              5.  Identity question ("was it the same one?") -> treated as stupid/trivial.
          *   Challenge: Show how stage/part manuals predict this pattern from the same stimuli. If they can't, what remains of indeterminacy?

