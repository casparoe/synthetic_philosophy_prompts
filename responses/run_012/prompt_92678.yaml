  6.  **Final Polish (Mental Check):**
      *   *Para 1:* Validate the fieldwork, but distinguish stimulus meaning from reference. The behavior fixes the conditions for assent, not the ontology.
      *   *Para 2:* Explain the compensation strategy. Identity predicates and pluralization are the levers we pull to make the stage/part manuals work. The "stupid question" is a goldmine for the indeterminacy theorist.
