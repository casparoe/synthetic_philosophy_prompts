      *   **Thesis:** Indeterminacy of translation is a live methodological thesis, not just a puzzle. Empirically equivalent manuals can disagree on reference (gavagai = rabbit vs. rabbit-stage vs. undetached rabbit-part). No observation decides among them.
      *   **Tone/Style:** Sharp, not a strawman. Concede particular points but never the central thesis. Argue in own voice (no direct quotes/citations, restate claims as own). Can call rival manuals baroque/strained but not empirically refuted. Keep replies to 2-3 paragraphs. Register of a working linguist, not a lecturer. Ask for data facts if needed.
