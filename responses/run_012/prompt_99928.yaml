answer: |-
  The air in the hatch room was thick enough to chew, a warm wool of humidity and wet down. Mara stood over the tray, her hands moving in a rhythm that had nothing to do with counting. Pick up. Candle. Turn. Set down. Left basket for the live, right for the dead.

  She didn't look at the light box anymore. She felt the weight of the egg in her palm, the way the fluid settled against the shell. Some felt heavy, anchored. Some felt light, hollowed out by rot. Some vibrated, a tiny shivering that traveled up her wrist and lodged in her elbow.

  "You're fast today," Simon said from the doorway. He leaned against the frame, arms crossed, watching the pile of culled eggs grow in the right basket. He owned the hatchery, but he never came into the warm room. He said the heat messed with his head.

  "Cycle is peaking," Mara said. She didn't look up. Her thumb brushed the shell of a Muscovy duck egg. She held it there. Three seconds. She placed it in the left basket.

  "That one was doubtful yesterday."

  "Changed."

  Simon pushed off the doorframe and walked over. He didn't touch the eggs; he knew better. Oil from skin clogs the pores, kills the breath. He watched her hands instead. They were red from the heat, the knuckles swollen, but they never hesitated. There was no deliberation in the movement. It was a flow, like water finding the gap in a rock.

  "I need to write it down, Mara," Simon said. "For the manual. If you get sick, or if we expand... I need to know how you do it."

  Mara picked up another egg. This one was still. Cold, despite the room. She tapped it against her fingernail. A dull thud. Right basket.

  "There's nothing to write," she said.

  "There has to be. Temperature settings are identical for everyone. Humidity is automated. You get ninety-eight percent hatch rate. The others get eighty. There's a variable. I need the variable."

  She reached for the next egg. Her hand hovered. For a fraction of a second, the flow stuttered. She looked at the egg, then at her own hand. She didn't know why she was reaching for it. The impulse had arrived before the thought.

  "It's the turning," she said. The words came out smooth, ready-made. "I turn them odd numbers. Twice at dawn, once at dusk."

  "We have timers for that," Simon said. "They all get turned odd numbers. The machine does it."

  "Then it's the light," Mara said. She felt a tightness in her chest, a hollowing out similar to the dead eggs. "I keep the candling light low. Doesn't shock them."

  "The bulbs are standard issue. I bought them myself." Simon stepped closer. His voice wasn't angry, just hungry. He wanted the lever he could pull. "Tell me the truth. Is it the feed? The mother's diet?"

  Mara set the egg down. She wiped her palms on her apron. The heat was pressing against her eardrums. She looked at the left basket, full of eggs that contained birds folding themselves into position, breaking down their own walls to get out. They didn't know they were birds. They just followed the tightness.

  "I listen," she said.

  Simon blinked. "You listen."

  "To the hum. When the room is quiet. They make a sound. Before the pip. A clicking."

  "We've got recording equipment in here, Mara. There's no clicking."

  "There is if you're here."

  Simon stared at her. He waited for her to elaborate, to give him the frequency, the timing, the rule. Mara opened her mouth to speak again. She intended to say *I don't know*. She intended to tell him that her hands knew the weight of life better than his machines, but that she couldn't translate the weight into words.

  Instead, she heard herself say: "It's about the resonance. The shell has to match the room."

  She stopped. The sentence hung in the humid air. It sounded sensible. It sounded like an explanation. It sounded like something an expert would say. But she hadn't chosen the words. They had arrived in her throat the same way the impulse to turn the egg had arrived in her wrist. Generated elsewhere. Delivered here.

  She looked at Simon. He was nodding slowly. He was writing it down in a small notebook he'd pulled from his pocket. *Resonance. Shell match.* He looked satisfied. He had a cause now. He could buy different bulbs. He could change the acoustic paneling. He could fix the variable.

  Mara looked down at her hands. They were resting on the edge of the tray. They looked like tools left on a bench. She wondered who was using them. She tried to feel the intention behind the words she had just spoken. She searched for the thought that preceded the sentence *The shell has to match the room*. There was nothing there. Just a silence, and then the sound of her own voice, competent and clear.

  It was like watching a chick break the shell. The bird doesn't know it is breaking out. It just kicks against the constraint because the space is too small. The competence of the escape belongs to the pressure, not the bird.

  Simon closed the notebook. "Resonance. Okay. I can work with that."

  He turned to leave. At the door, he paused. "Don't change anything. Keep the room exactly as is until I get the new sensors."

  "Okay," Mara said.

  She watched him go. The door clicked shut. The hum of the ventilation system filled the space again. A low, steady thrum.

  On the tray, an egg shifted. It rolled slightly to the left, though the tray was level. Mara watched it. She didn't reach out to steady it. She waited to see if it would roll back.

  Inside the shell, something moved. A beak, testing the air space. A lung, drawing breath for the first time. Did it know it was breathing? Did it know the air was there, or did it just expand because the pressure allowed it?

  Mara raised her hand to her throat. She touched the skin over her vocal cords. She wanted to say something, anything, just to see if she could choose the word. She wanted to say *blue*.

  "Blue," she said.

  The word hung in the heat. It meant nothing. It was just a shape of mouth and breath. But it had come out. Perfectly formed. Competent.

  She looked at the egg. It rocked again, driven by the struggle inside. She looked at her hand. It hovered over the egg, ready to help, or ready to cull. She didn't know which until the fingers closed.

  Outside, the ventilation hummed. Inside the shell, the breathing quickened. Mara stood between them, listening to the noise of things working without knowing why. She waited for the crack, but she didn't know if she was waiting for the egg to break, or for herself.
