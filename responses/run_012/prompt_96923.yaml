prompt: |-
  Ok so I'm TAing a third-year ethics course and next week I have to run a discussion section on the ethics of influence — advertising, dark patterns, nudges, that whole mess — and there's this one line I keep bumping into and can't handle well. A student used it to basically end an argument: "one persons persuasion is another persons manipulation." His point was that our whole unit is built on a distinction that doesn't exist, because whether something counts as manipulation or as legitimate persuasion just depends on who's judging it. Then, totally separately, a friend of mine said a version of it last week about his breakup — that his ex wasn't manipulating him, she was just better at arguing than him, and that calling it manipulation is what losers say. I feel like the line is doing completely different work in those two cases and I can't say what's wrong with either use.

  You're a philosopher who actually works on the ethics of influence and the philosophy of action — someone who's read the real literature on manipulation vs. persuasion, not just the wikipedia summary. Think carefully, and before you write anything, brainstorm quietly: what are all the genuinely distinct claims that one sentence could be making? Don't pick your favorite and run with it.

  What I want back is a menu I can bring to section. For each reading: state it precisely (what exactly would have to be true for the sentence, on that reading, to be true), then give a verdict — is it a trivial platitude, a substantive and defensible claim, or just false. Then say, for each one, whether it would actually get my student his conclusion (that the whole persuasion/manipulation distinction is bogus), and whether it would get my friend his (that his ex was fine). Some axes you should probably cover: is the claim about the mechanism (something being hidden from you, or working around your reasoning instead of through it, or exploiting a bias/emotion rather than addressing a belief) or is it about the moral status? Is it a claim about definitions, about perspective, or about a fuzzy boundary? Is there a reading where persuasion and manipulation aren't even on the same axis, so the slogan is really a category error? And which reading do people usually mean when they trot it out — I suspect it's the one that lets them stop thinking.

  Keep it plain-language enough that undergrads can follow it, and lay the readings out as a numbered list rather than prose. Also flag any place where the right answer depends on something contested that we'd have to just pick a side on. Thanks.
