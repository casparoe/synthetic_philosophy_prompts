      *   *Refining Reading 4 (The "Fuzzy Boundary" Reading):* True but doesn't go far enough. Vagueness $\neq$ non-existence. Doesn't help student (distinction still exists), doesn't help friend (could still be on the manipulation side).
      *   *Refining Reading 5 (The "Mechanism" Reading):* False. Persuasion and manipulation are defined by different mechanisms (reason vs. bypassing reason). If it bypasses reason, it's not persuasion. Helps neither really, but clarifies the concepts.
      *   *Refining Reading 6 (The "Autonomy" Reading):* Substantive. Manipulation violates autonomy; persuasion respects it. Helps student (if they deny autonomy matters), helps friend (if they think losing an argument isn't a violation).

  4.  **Selecting and Polishing the Menu:**
      *   I need to make sure these are distinct enough for undergrads to grasp but rigorous enough for a 3rd-year course.
      *   I need to ensure I address the "mechanism vs. moral status" axis explicitly.
