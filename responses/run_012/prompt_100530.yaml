      *   *Neptune vs. Vulcan:* Make sure to emphasize that the *mechanism* of naming was identical. This isolates the variable to the existence of the object, not the linguistic act.
      *   *Necessary A Posteriori:* Be careful not to conflate "Vulcan is the cause of Mercury's orbit" (false) with "Vulcan exists" (false). The necessary truth is the negative existential.
      *   *Phlogiston:* Phlogiston is a substance kind; Vulcan is a specific object. This matters for rigid designation (names vs. natural kind terms). I should note this distinction.

