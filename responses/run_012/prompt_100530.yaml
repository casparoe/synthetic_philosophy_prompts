  *(Self-Correction on the "Necessary A Posteriori" point)*: Wait, is "Vulcan does not exist" *necessary*? If 'Vulcan' is a rigid designator that fails to refer, then in no possible world does it refer. So "Vulcan does not exist" is true in all worlds. Yes. But is it *a posteriori*? Yes, because we needed empirical investigation to determine that the name is empty. If we thought it referred, we were wrong. So it fits.

