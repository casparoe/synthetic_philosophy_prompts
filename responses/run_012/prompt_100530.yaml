          *   *Strain:* The causal chain was active for 60 years. The community treated it as referring. The theory says they were all failing to refer. This creates a gap between *social use* and *semantic success*. The theory struggles to explain the *utility* of the name during those 60 years if it referred to nothing. It treats the discourse as systematically flawed rather than approximately true or useful.

