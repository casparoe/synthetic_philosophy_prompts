prompt: |-
  I'm a backend engineer (mostly Python, a bit of Rust) with no philosophy degree — I did computer science — and I'm putting together an application for a one-year fellowship my old university runs for people coming into philosophy from other fields. The idea I want to develop started as a joke in the pub and has now got slightly out of hand. I was reading about Newton's bucket, the spinning bucket of water whose surface goes concave, and I thought: if I wrote a physics engine that only ever stored the relative positions and velocities of bodies, and never any absolute position anywhere, could it ever make the water climb the walls? My first instinct was yes, obviously, because whatever the engine spits out just is the physics, and the concave surface is part of what we observe — but then I couldn't see what work absolute space is doing that isn't just "the rules of the engine", and I also couldn't see how the engine tells the difference between the bucket spinning and the water spinning, since as far as I can tell those come out as the same state and I'm not sure they should. Then someone in the group said the interesting case is the lonely bucket: a universe with nothing in it but the bucket and its water, no stars, no distant matter to be relative to. Either the water still goes concave, which is meant to be bad news for the relationist because there's nothing for the rotation to be relative to; or it doesn't, which seems to make the local behaviour of water depend on what's happening at the far end of the universe; or the question has no answer at all, which I find the most interesting option and the one nobody could say anything sensible about. I want to know whether that's a genuine third option or just a polite way of giving up.

  Turn this into the proposal. I need the question pinned down so that it has a determinate answer — I'm aware that "is relationism true" isn't that, and I suspect the thing I actually want to ask is narrower, something like whether a relationist can handle the lonely bucket without either smuggling absolute structure back in through the side door or helping herself to facts about what would have happened if the matter distribution had been different. Explain why the going positions leave that open rather than settling it, and say where the burden of proof actually sits, because I genuinely can't tell who's supposed to be proving what here. Then the method: what I'd actually do month by month across the year, bearing in mind that I can read philosophy but I can't do the maths to a physics-postgrad level, so if the honest answer is that I should treat the simulation framing as a conceptual argument rather than a calculation, say so and tell me what I'd have to give up as a result. I want to know what would count as the project failing: if the third option turns out to be empty, or turns out to be a restatement of one of the first two, is that a bad outcome or is that the outcome? Give me a realistic scope for a year of part-time work and tell me what to cut if it's too big.

  The form wants about two pages and warns that the panel is interdisciplinary, so keep the jargon down and explain the physics bits as you go. I'll do the reading and fill in all the references myself, so please don't bother with citations or a reading list — and definately don't invent any, I'd rather have a gap I can seperate out later.
