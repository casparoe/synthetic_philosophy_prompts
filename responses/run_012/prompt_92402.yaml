answer: |-
  **Project Title:** The Lonely Bucket: Computational Modelling and the Burden of Proof in Relational Space

  **Project Summary**
  This project investigates a classic problem in the philosophy of physics: the nature of space and inertia. The starting point is Newton's bucket experiment. When a bucket of water spins, the water's surface becomes concave. Newton argued this proved the existence of "absolute space"—the water rotates relative to space itself. Later, Ernst Mach argued the water rotates relative to the "fixed stars" (the bulk matter of the universe). This is the debate between Substantivalism (space is a thing) and Relationism (space is just relationships between things).

  The standard debate presents a dichotomy. However, a third option is often whispered but rarely formalized: in a universe containing *only* the bucket and water (a "lonely bucket"), the question of whether the water climbs the walls might have no answer. It is not that the water stays flat; it is that the concept of rotation becomes meaningless.

  My background is in backend engineering (Python/Rust), not physics or philosophy. My initial approach was to build a physics engine that stores only relative positions and velocities, with no absolute coordinate system, to see if inertial forces (the concave water) emerge. This quickly revealed a deeper philosophical issue: if the engine cannot run without implicitly smuggling in absolute structure, that reveals a hidden ontological cost in Relationism.

  This fellowship will allow me to pivot from a purely technical simulation to a rigorous analysis of this "third option." I aim to determine whether indeterminacy in the lonely bucket case is a genuine metaphysical position or merely a refusal to answer. Specifically, I will ask: *Does a strictly relational framework necessitate that inertial facts are indeterminate in an isolated system, and does this shift the burden of proof to the Substantivalist to explain why the question must have an answer?*

  **Research Question and Context**
  The core question is narrower than "Is Relationism true?" It focuses on the conditions under which a physical theory assigns truth values to states of motion. In standard Relationism, motion is defined by changes in distance between bodies. In a lonely bucket universe, there are no other bodies. A strict Relationist might say rotation is undefined. A Substantivalist says rotation is defined relative to the spacetime manifold.

  Current literature often treats the "undefined" option as a form of verificationism (if you can't measure it, it doesn't exist) or simply gives up. I want to know if this is a stable position. Does the Relationist need to rely on counterfactuals (e.g., "if there *were* stars, the water would climb")? If so, they are relying on facts about non-existent matter, which weakens the relational claim. If they don't, they must accept that local physics can be indeterminate.

  The burden of proof is currently unclear. Substantivalists assume rotation must be real or not. Relationists assume rotation must be relative to something. I argue the burden lies on the Substantivalist to demonstrate why a universe without a reference frame must still support a fact of the matter about inertia. My project will test whether the "indeterminate" option is empty or if it offers a coherent alternative that dissolves the problem rather than solving it.

  **Methodology and Work Plan**
  I am aware of my limitations regarding advanced mathematics. I cannot derive solutions in General Relativity. Therefore, the "simulation" aspect will be treated as a formal conceptual model rather than a high-fidelity numerical engine. If building a functional relational engine proves mathematically impossible without absolute background assumptions, that impossibility *is* the data. It would demonstrate that Relationism requires more structure than it claims.

  *Months 1–3: Foundations and Literature*
  I will focus on the history of the debate (Newton, Mach, Leibniz) and modern interpretations (Brown, Pooley, Saunders). I need to understand the precise formulation of "Mach's Principle" and why it fails in standard General Relativity. I will map the existing arguments against the "indeterminate" option to see if they have been properly refuted or just ignored.

  *Months 4–6: Formal Modelling*
  I will attempt to design the state-space of a relational physics engine. I will not aim for a full fluid dynamics simulation. Instead, I will model a simplified N-body system where state is defined purely by inter-particle distances. I will document exactly where the model breaks or requires external input to resolve inertial forces. This technical constraint analysis will serve as a proxy for the metaphysical constraint analysis.

  *Months 7–9: Analysis of the Third Option*
  Using the findings from the modelling phase, I will analyze the "indeterminate" position. I will compare it to similar moves in other areas of philosophy (e.g., indeterminacy in quantum mechanics or vagueness). I will draft the argument regarding the burden of proof: if the relational framework renders the question meaningless, is that a bug or a feature?

  *Months 10–12: Writing and Dissemination*
  I will write the final thesis/dissertation. I aim for a style accessible to the interdisciplinary panel, avoiding unnecessary technical jargon. I will also prepare a shorter article for submission to a journal in philosophy of science.

  **Feasibility and Risk Management**
  The main risk is that the "third option" collapses into one of the standard two. If "indeterminate" just means "flat" (no inertial forces) or "absolute" (hidden structure), then the project might seem to have found nothing new. However, this is not a failure of the project; it is a determinate result. Clarifying that the third option is empty is a valuable philosophical contribution.

  A second risk is the mathematical complexity. If I cannot formalize the relational engine even in a simplified form, I will pivot entirely to conceptual analysis. I will treat the "engine" as a thought experiment, analyzing the logical requirements of such a system rather than the code. This reduces the scope but ensures completion within the part-time timeframe.

  To keep the scope realistic, I will cut the fluid dynamics aspect entirely. I will focus on point masses. The concave water surface is a proxy for inertial forces; I can analyze the forces without simulating the fluid. If the workload becomes too heavy, I will reduce the historical review in Months 1–3 to focus strictly on 20th-century analytic treatments of the problem.

  **Outcome and Success Criteria**
  Success is not proving Relationism or Substantivalism. Success is pinning down the status of the lonely bucket case.
  1.  **Positive Outcome:** I demonstrate that the "indeterminate" option is a coherent metaphysical stance that shifts the burden of proof to the Substantivalist.
  2.  **Negative Outcome (Productive):** I demonstrate that the "indeterminate" option inevitably smuggles in absolute structure or collapses into counterfactual dependence, thereby strengthening the case against strict Relationism.
  3.  **Failure:** The project fails only if I cannot clarify the burden of proof or if the work remains at the level of "pub philosophy" without engaging the technical literature.

  This project leverages my engineering background to treat metaphysical frameworks like system architectures: what dependencies do they require to run? By testing the "lonely bucket" as a boundary case, I hope to show where the architecture of space breaks down.
