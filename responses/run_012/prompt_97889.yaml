          *   *Refinement:* The pragmatic view handles this well *if* the offense is use-conditional. The semantic view struggles because there's no real extension to attach the hateful property to.

      *   **Reclamation:**
          *   *Issue:* How does the same word stop wounding and start bonding?
          *   *Pragmatic Prediction:* Reclamation is a change in usage norms (pragmatics), not meaning (semantics).
          *   *Strength:* This is the pragmatic view's strongest point. Semantic views struggle to explain how the truth-conditions shift so rapidly or vary by speaker.
          *   *Nuance:* It needs to explain why *outsiders* can't use the reclaimed term. This suggests a complex rule of use (indexical or speaker-relative), which fits pragmatics/expressives better than static semantics.

      *   **The Innocent Foreigner:**
