  7.  **Assess Insulation/Qualification:**
      *   The shift from Implicature -> Conventional Implicature -> Use-Conditional Meaning -> Expressive Semantics.
      *   Is this retreat ad hoc? Or is it refining the "pragmatic" bucket?
      *   *Honesty:* It risks becoming a verbal dispute. If "pragmatic" means "not truth-conditional but mandatory and projective," how is that different from "non-truth-conditional semantic content"?
      *   *Falsification:* Show a case where the slur contributes to truth conditions in a way the neutral term does not (e.g., "He is a [S] but not despicable" is a contradiction).

