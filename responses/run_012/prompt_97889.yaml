      *   Keep the distinction between "truth-conditional" and "use-conditional" sharp.
      *   Be critical of the "Pragmatic" label itself—is it doing work, or is it a hiding place?

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "fictional slur" prompt correctly?
      *   *Correction:* Make sure to distinguish between a slur for a real group used in fiction vs. a slur for a *fictional* group. The prompt asks for the latter (no actual referent). This tests the link between reference and offense.
      *   *Check:* Did I rank the defeaters?
