  3.  **Brainstorm Commitments (First Principles):**
      *   If derogation is pragmatic, it must be cancellable (if implicature) or projectable (if presupposition/expressive).
      *   If semantic content is innocent, embedding under logical operators should behave like neutral terms regarding truth conditions.
      *   The "sting" of the word must be separable from its reference.
      *   Learning the word involves learning a rule of use, not a new category of object.
      *   Disagreement about the slur's applicability is disagreement about the neutral facts, not the evaluation.

  4.  **Map Exposure (Predictions vs. Semantic Views):**
      *   *Semantic View (Content View):* Derogation is part of truth conditions. "X is a S" is false if X is not despicable (even if X is in the extension of N).
      *   *Pragmatic View:* "X is a S" is true if X is in the extension of N, regardless of despicability.
      *   *Testable Prediction 1:* Cancellation. Can I say "X is a S, but I don't mean anything bad by it" without contradiction? (Semantic: Contradiction. Pragmatic: Okay).
      *   *Testable Prediction 2:* Embedding. In "If X is a S, then...", does the offense project? (Both say yes, but for different reasons. Semantic: content carries through. Pragmatic: presupposition/expressive projects).
      *   *Testable Prediction 3:* Truth Value Judgments. If a bigot uses a slur about a member of the group who is morally upright, is the sentence *false*? (Semantic: Yes. Pragmatic: No, it's true but offensive).

