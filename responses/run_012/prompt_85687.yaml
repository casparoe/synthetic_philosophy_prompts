answer: |-
  ### (1) Exam Question

  **Course:** PHI 550 — Disagreement and Higher-Order Evidence
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Do not summarize existing literature (e.g., Christensen, Elga, Kelly). Your grade depends on your analysis of the specific case below.

  **The Case:**
  Agents A and B share a first-order evidence base $E$ that supports $p$ to degree 0.8. A arrives at credence 0.8 using Method $M$. A then acquires higher-order evidence (HOE): a calibration study showing that in cases of this shape, $M$'s 0.8-verdicts are correct only 60% of the time. Standard conciliationism suggests A should drop to 0.6; maintaining 0.8 constitutes epistemic akrasia.

  **The Wrinkle:** The calibration study was produced by a process A can only certify as reliable by using $M$. Thus, in A's bookkeeping, the evidence that $M$ is unreliable is only as trustworthy as $M$ itself. Agent B has the same $E$ and possesses the same calibration study, but B arrived at 0.8 via a method distinct from $M$ and certifies the study independently of $M$.

  **Essay Prompt:**
  Evaluate the normative implications of this case. Your essay must explicitly commit on the following three issues:
  1.  **Evidential Scope:** Does the calibration study function as evidence about $p$'s support (affecting A and B equally) or as a defeater specific to A's doxastic formation (affecting A disproportionately)? Explain how B's presence forces this distinction.
  2.  **The Self-Certification Loop:** Does the fact that A must use $M$ to validate the anti-$M$ study make the conciliationist requirement incoherent, merely weaker, or untouched for A?
  3.  **Akrasia:** Does this wrinkle open a permissible door for A to maintain credence 0.8 while accepting the normative verdict that she ought to be at 0.6?

  Defend your commitments. Show what follows for both conciliationist and steadfast frameworks given your analysis.

  ***

  ### (2) Model Answer

  The divergence between A and B reveals that higher-order evidence (HOE) is not merely first-order evidence in disguise. If the calibration study were simply evidence about $p$'s probability given $E$, A and B should converge identically. However, because A's access to the HOE is mediated by $M$, while B's is not, the study functions differently for each. For B, the study is external data updating the likelihood of $p$ given $E$. For A, it is a process defeater targeting the justification of her specific belief-forming mechanism. Therefore, the evidential scope is hybrid: it updates $p$ for B, but undermines the warrant for A's belief in $p$.

  Regarding the self-certification loop, the conciliationist requirement is not incoherent, but it is significantly weaker for A. If A uses $M$ to validate the study claiming $M$ is unreliable, she faces a self-undermining loop. If $M$ is only 60% reliable, the certification of the study is likewise compromised. This does not nullify the HOE entirely—that would be dogmatic steadfastness—but it dampens its force. A should not drop all the way to 0.6. Instead, she should discount the HOE by the reliability of $M$, settling at a credence higher than 0.6 but lower than 0.8. To demand a full drop to 0.6 is incoherent because it requires A to trust $M$ enough to believe the study, but distrust $M$ enough to ignore its output entirely.

  This damping effect opens a limited door regarding akrasia. Standard views hold that believing $p$ while believing one ought to believe $\neg p$ (or less confidently) is irrational. However, in this loop, A's normative belief ("I ought to be at 0.6") is itself derived from a compromised source. A can rationally maintain 0.8 if she recognizes that the mandate to drop to 0.6 is undercut by the very method generating that mandate. This is not full-blown akrasia, but a "justified tension." She holds 0.8 because the evidence for lowering it is self-contaminated.

  For the conciliationist, this case forces a refinement: HOE requirements are sensitive to the genealogy of the HOE itself. One cannot simply apply a "total evidence" view without weighing the reliability of the HOE source. For the steadfastist, this offers a refuge, but not a victory. They can argue A stays at 0.8, but only by admitting that the HOE was too tainted to function as a defeater. Ultimately, the case shows that epistemic norms are not merely about the content of evidence, but the structural integrity of the access to that evidence. A and B are not epistemic peers despite sharing $E$ and the study, because their epistemic architectures regarding the study differ.

  ***

  ### (3) Marking Scheme

  | Point | Criteria | Marks | Typical Failure |
  | :--- | :--- | :--- | :--- |
  | **1** | **A/B Distinction:** Correctly identifies that A and B differ epistemically because A's access to HOE is mediated by the undermined method $M$, while B's is not. | 4 | Treats A and B as identical peers who must converge on the same credence. |
  | **2** | **Loop Analysis:** Argues specifically whether the self-certification loop renders conciliationism incoherent, weaker, or untouched (must choose one). | 4 | Claims the loop invalidates the HOE entirely or ignores the loop's recursive nature. |
  | **3** | **Akrasia Constraint:** Takes a clear stance on whether A can hold 0.8 while accepting the 0.6 norm, distinguishing credence from normative belief. | 4 | Defines akrasia away verbally without addressing the normative conflict. |
  | **4** | **Conciliationist Impact:** Explains how the case forces conciliationism to account for the genealogy/reliability of the HOE source itself. | 4 | Recites standard conciliationist arguments without applying them to the self-certification wrinkle. |
  | **5** | **Steadfastist Impact:** Explains whether the wrinkle provides a valid steadfast harbor or merely a dogmatic escape hatch. | 4 | Uses the wrinkle to argue for steadfastness without addressing the residual force of the HOE. |
  | **Total** | | **20** | |
