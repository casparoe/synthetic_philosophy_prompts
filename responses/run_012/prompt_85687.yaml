  Hey — I'm a 4th year PhD student in epistemology, and my advisor has me on the hook for writing the take-home final for our grad seminar on disagreement and higher-order evidence. I need you to act like a professional philosopher who's taught this material to grad students, and please think carefully before you start writing; I'd definately rather you spend a minute working out where the real crux is than churn out something generic.

  I want ONE essay question, built around a case of my own, because I'm sick of reading answers that just recite the concilliationism-vs-steadfastness food fight back at me. Here's the case. Two agents, A and B, share a first-order evidence base E that on its own supports p to about 0.8. A gets to 0.8 by running E through method M. A then reads a calibration study: across cases of exactly this shape, M's 0.8-level verdicts are correct only about 60% of the time. Standard move: A has higher-order evidence, A should drop to roughly 0.6, and sitting at 0.8 while believing she ought to be at 0.6 is epistemic akrasia. Now the wrinkle. The calibration study was itself produced by a process that A can only certify as reliable by using M. So in A's own bookkeeping, the evidence that M is unreliable is only as trustworthy as M. Meanwhile B has the same E and the same calibration result but never touched M — B got to 0.8 some other way.

  Deliverables: (1) the exam question itself, one essay, aimed at 90 minutes, pitched so a student can't pass by summarizing positions; (2) a model answer of about 600 words; (3) a marking scheme of exactly five must-hit points totaling 20 marks, with a one-line note per point about how candidates typically blow it. Make the question force students to commit on (a) whether the calibration result is evidence about p's support or only about A's doxastic state — B's presence should make that unavoidable — (b) whether the self-certification wrinkle makes the conciliationist requirement incoherent, merely weaker, or untouched, and (c) whether the twist opens the door to the move where you keep the first-order belief while accepting the higher-order verdict. Don't let the question just ask them to pick a team; make them say what follows for each team. And keep the marking scheme in actual marks, not vibes.
