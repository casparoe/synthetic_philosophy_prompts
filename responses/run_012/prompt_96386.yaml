answer: |-
  Your friend is repeating a very common script that circulates in pop-science circles. It mixes accurate technical definitions with significant logical leaps that behavioral geneticists generally reject.

  Here is a sentence-by-sentence breakdown of what a behavioral geneticist would agree with, what would make them wince, and what is plainly wrong.

  ### 1. "Heritability is basically the share of a trait that's genetic."
  *   **Verdict:** **Wince.**
  *   **The Science:** This is the most common misconception about heritability. Heritability is **not** the proportion of an individual's trait that is caused by genes. You cannot say "70% of *your* intelligence is genetic."
  *   **The Correction:** Heritability ($h^2$) is a statistic that describes the proportion of **variation** in a trait within a specific **population** that can be attributed to genetic variation.
  *   **Analogy:** If you have a bucket of corn seeds (genes) and plant half in poor soil and half in rich soil (environment), the height difference *between the two groups* is 100% environmental. But within the rich soil group, the variation in height might be 80% genetic. Heritability describes the variation, not the trait itself.

  ### 2. "Height is about 0.8 and adult IQ around 0.7, so people say intelligence is roughly 70% genes."
  *   **Verdict:** **Wince (on phrasing), Agree (on rough numbers).**
  *   **The Science:** The numbers are roughly correct for adults in Western, industrialized nations. Height is highly heritable (0.8–0.9), and adult IQ heritability does rise with age, settling around 0.6–0.8 in adulthood.
  *   **The Correction:** Again, the phrasing "70% genes" implies the trait itself is made of genes. A geneticist would prefer: "In this specific population, at this specific time, 70% of the *differences* in IQ scores are associated with genetic differences." Note that heritability of IQ is lower in childhood and lower in low-socioeconomic status populations (where environmental constraints create more variation).

  ### 3. "It's a population number, sure, but the takeaway is that most of the differences between people in IQ come down to their DNA."
  *   **Verdict:** **Agree.**
  *   **The Science:** This is the actual definition of heritability. If $h^2 = 0.7$, then 70% of the *variance* (differences) observed in that group is statistically accounted for by genetic variance.
  *   **The Nuance:** This is only true for the population and environment in which it was measured. If you change the environment (e.g., universal high-quality schooling), the heritability number can change.

  ### 4. "And since it's that heritable, there's a real ceiling on what schools or parenting can do..."
  *   **Verdict:** **Plainly Wrong.**
  *   **The Science:** This is the **Intervention Fallacy**. High heritability does **not** mean a trait is unchangeable.
  *   **The Counter-Example:** Phenylketonuria (PKU) is a genetic condition that causes severe intellectual disability. It is 100% heritable (entirely genetic cause). However, it is 100% treatable by an environmental intervention (a specific diet).
  *   **Height Analogy:** Height is more heritable than IQ (0.8+). Yet, average height has increased by several inches over the last century due to better nutrition. The genes didn't change; the environment allowed the genetic potential to be fully expressed. High heritability does not imply a "ceiling" on intervention; it just means that *in the current environment*, genes explain most of the differences.

  ### 5. "...genes set the range and the environment just decides where in the range you land, and that's true however you tinker with the environment."
  *   **Verdict:** **Wince / Partially Wrong.**
  *   **The Science:** This describes the "Reaction Range" model. While useful as a heuristic, the claim "that's true however you tinker with the environment" is false.
  *   **Gene-Environment Interaction:** Genes and environment interact. A genetic propensity for reading might only manifest if books are available. If you "tinker" with the environment drastically (e.g., eliminate lead exposure, improve prenatal care), you can shift the entire distribution, not just move people within a fixed range.
  *   **The Flynn Effect:** IQ scores have risen roughly 3 points per decade for the last century. This happened too fast to be genetic. It shows that environmental changes can lift the "ceiling" for everyone, contradicting the idea of a fixed genetic range.

  ### 6. "It's also why the average IQ gap between rich and poor countries is probably mostly genetic."
  *   **Verdict:** **Plainly Wrong.**
  *   **The Science:** This is the **Between-Group Heritability Fallacy**.
  *   **The Logic:** Knowing that differences *within* a group are mostly genetic tells you **nothing** about the cause of differences *between* two groups.
  *   **Analogy:** Imagine you plant two handfuls of the exact same corn seeds (identical genetics). You plant one handful in Iowa (rich soil) and one in the Sahara (poor soil).
      *   **Within** the Iowa patch, differences in height are mostly genetic (since soil is constant).
      *   **Within** the Sahara patch, differences are mostly genetic.
      *   **Between** the two patches, the massive difference in average height is 100% environmental.
  *   **Application:** High within-group heritability of IQ in the US or UK does not explain why the average IQ in Norway might differ from the average IQ in Niger. Those differences are overwhelmingly attributed to environmental factors (nutrition, disease burden, education quality, test bias, etc.).

  ***

  ### Is the 'ceiling' bit smuggled in?

  **Yes, absolutely.**

  The heritability number ($h^2$) is a description of the **status quo**. It tells you how much genes matter *right now*, in *this* environment. It contains no information about **malleability**.

  Your friend is smuggling in a separate philosophical claim: *that we have already optimized the environment.*

  *   **If the environment is uniform:** Heritability goes **up** (because environmental variance is removed, leaving genes to explain the rest).
  *   **If the environment is improved:** Heritability can go up or down, but the *average trait value* usually goes up.

  When your friend says "there's a real ceiling on what schools can do," he is assuming that current schools are already providing the optimal environment for genetic expression. Behavioral geneticists generally do not make this assumption. Most would argue that because environments are *not* perfectly equal or optimized, heritability estimates are context-dependent and do not predict the success of new, novel environmental interventions.

  ### Summary for Pushback
  If you want to push back gently, here are the three strongest points:
  1.  **Heritability $\neq$ Fixedness:** Height is highly heritable, but we got taller due to better food. High heritability doesn't mean environment can't change the average.
  2.  **Within-Group $\neq$ Between-Group:** Explaining why *I* differ from *my neighbor* (mostly genes) does not explain why *Americans* differ from *Nigerians* (mostly environment). That is a statistical error.
  3.  **Context Matters:** Heritability is not a universal constant like the speed of light. It changes depending on how equal the environment is.

  Your friend has the right statistics but is drawing the wrong conclusions about policy and potential.
