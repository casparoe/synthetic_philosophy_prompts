  # JOINT STATEMENT ON DYNAMIC INCONSISTENCY AND PRACTICAL RATIONALITY

  **Signatories:** The Philosophy Working Group on Action Theory & The Behavioral Economics Decision Lab
  **Date:** October 26, 2023
  **Subject:** Clarifying the Disagreement Structure Regarding Weakness of Will and Present Bias

  ### Part I: Agreed Claims

  We, the undersigned, acknowledge that our disciplines have historically modeled the same behavioral patterns using different vocabularies. To facilitate productive collaboration, we affirm the following eight claims as common ground. These claims are substantive and require no hedging from either side.

  1.  **Empirical Robustness of Reversal:** The empirical regularity of dynamic inconsistency is real and robust; agents systematically choose options at time *t* that they preferred to avoid at time *t-n*, particularly when immediate gratification is involved.
  2.  **Explanatory Limits of Willpower:** Invoking "willpower" as an unanalyzed primitive force explains nothing; any viable model must specify the mechanism (cognitive, neural, or structural) by which one impulse overrides another.
  3.  **Endorsement Without Alignment:** An agent can act against a plan she still endorses without thereby acting against any *long-term* preference ordering she holds at the time, provided the model allows for competing short-term valuation signals.
  4.  **Distinction of Cases:** The "Lucid Lapse" (acting against a standing judgment) and the "Revised Counterpart" (acting on a changed judgment) are phenomenologically distinct reports that require distinct theoretical accommodations.
  5.  **Predictive Underdetermination:** Observed choice data alone is insufficient to distinguish between a genuine change in valuation (preference reversal) and a failure of execution against stable valuation (akrasia).
  6.  **Rationality of Binding:** Self-binding strategies are rational instruments for agents who anticipate either future preference shifts or future failures of rational agency; the demand for such tools is predicted by both frameworks.
  7.  **Normative Independence:** Assessments of whether an action is *rational* are distinct from predictions of whether an action will *occur*; a model can successfully predict behavior while labeling it normatively defective.
  8.  **Welfare Complexity:** Welfare analysis cannot rely solely on revealed preference at the moment of choice; ex-ante plans and ex-post regret reports provide necessary data for evaluating agent well-being.

  ### Part II: Disagreements Table

  While we agree on the phenomena listed above, we disagree on their interpretation. The following table isolates the specific points of contention. We have classified each as either **Substantive** (a disagreement about how the mind works or what constitutes well-being) or **Verbal** (a disagreement about how to define terms or map models to the world).

  | Point of Contention | Philosopher's Formulation | Economist's Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **1. The Lucid Lapse (Case 1)** | **Possible and Central.** It is coherent to describe an agent who, at midnight, judges she should not drink, yet drinks. This is a failure of rationality where action diverges from contemporaneous best judgment. | **Incoherent (Strict).** If "judgment" maps to "all-things-considered preference," she cannot judge X best and choose Y. If she chooses Y, she preferred Y. The report of "judging X best" must be treated as a measurement error or a non-choice-relevant mental state. | **Substantive** |
  | **2. Preference Identification** | **Mental State.** Preference is a psychological state that *guides* choice. Choice can be inconsistent with preference (e.g., due to compulsion or weakness). | **Operational Definition.** Preference is *defined* by choice. To say "she chose Y but preferred X" is a category error within the model. We can model "multiple selves," but each self's preference matches its choice. | **Verbal** |
  | **3. The Resolute Self-Binder (Case 3)** | **Rational Agency.** The agent acts rationally by aligning action with her best judgment, overriding a contrary desire. This is the mirror image of the Lucid Lapse (success vs. failure of rational control). | **Inter-temporal Conflict.** The agent is simply satisfying her long-term self's preference over her short-term self's preference. This is not "rationality" in a special sense, but one preference winning over another. | **Verbal** |
  | **4. Welfare Metric** | **Judgment-Based.** The agent is made worse off by the Lucid Lapse because she violated her own authoritative standard, regardless of the pleasure gained. | **Preference-Based.** The agent is made better off by the choice (she got what she wanted at that moment). Welfare loss only occurs if the *sequence* of choices violates the long-term self's utility function. | **Substantive** |

  **Note on the Verbal Disagreement (Row 2):** We identify the disagreement over Preference Identification as **Verbal**. The Philosopher uses "preference" to denote a normative mental state that *ought* to guide action. The Economist uses "preference" to denote the mathematical function that *does* explain action. We agree that if the Economist defines preference as choice, the Philosopher's "akrasia" becomes "preference reversal" in the Economist's lexicon. The impasse regarding whether the framework can represent the case under dispute dissolves if the Economist admits "preference" in his model is a theoretical construct for prediction, not an exhaustive ontology of the mind.

  ### Part III: Cruxes and Empirical Tests

  For the substantive disagreements (Rows 1 and 4), we propose the following tests. These are designed to produce results that would force one or both sides to revise their position.

  **Crux 1: The Neural Timing of Valuation (Addressing The Lucid Lapse)**
  *   **Case/Test:** We will examine the "Lucid Lapse" using process-tracing and neuroimaging during a high-conflict decision (e.g., resisting a tempting food item after pledging a diet). We specifically look for the timing of the value signal in the ventromedial prefrontal cortex (vmPFC) relative to the motor initiation of the choice.
  *   **Predictions:** The **Philosopher** predicts that in a true Lucid Lapse, the neural value signal for the healthy option will remain higher than the tempting option *at the moment of action*, indicating action against valuation. The **Economist** predicts the value signal for the tempting option will flip to exceed the healthy option *prior* to action, indicating the "judgment" report was lagging or inaccurate.
  *   **Moving the Parties:** If the value signal for the tempting option does not exceed the healthy option before action, the **Economist** must concede that choice can diverge from neural valuation, undermining the strict revealed preference assumption. If the signal flips consistently before action, the **Philosopher** must concede that the "Lucid Lapse" is phenomenologically real but ontologically identical to preference reversal.

  **Crux 2: Welfare Reports in Resolution (Addressing The Resolute Self-Binder)**
  *   **Case/Test:** We will study the "Resolute Self-Binder" (Case 3): agents who feel a strong urge to drink at midnight, judge drinking as "best" in terms of immediate sensation, but refrain to honor a prior plan. We will measure ex-post satisfaction and regret immediately after the decision.
  *   **Predictions:** The **Philosopher** predicts these agents will report high satisfaction and low regret, as they successfully acted on their authoritative judgment. The **Economist** (assuming welfare = satisfaction of revealed preference) predicts these agents should report some welfare loss or "cost," as they denied their highest-ranked option at time *t*.
  *   **Moving the Parties:** If resolute agents report zero regret and high satisfaction despite denying their immediate top-ranked option, the **Economist** must adjust welfare metrics to weight long-term judgments over short-term revealed preferences. If they report significant distress/regret, the **Philosopher** must acknowledge that acting against immediate desire carries a welfare cost that "rationality" does not fully offset.

  **Crux 3: Demand for Constraints Under High Valuation**
  *   **Case/Test:** We will offer agents the opportunity to purchase a binding constraint (e.g., a financial penalty for drinking) at midnight, *after* the urge to drink has already peaked and they currently rank drinking highest.
  *   **Predictions:** The **Philosopher** predicts agents will pay to bind themselves *even while* ranking drinking highest, to enforce their judgment. The **Economist** predicts agents will only bind themselves if they anticipate their ranking will *change again* in the future; no one should pay to prevent themselves from doing what they currently most prefer.
  *   **Moving the Parties:** If agents pay to restrict options they currently rank highest (without expecting a future rank change), the **Economist** must admit that "current preference" is not the sole driver of demand, validating the Philosopher's distinction between judgment and preference. If no such demand exists, the **Philosopher**'s model of "judgment" lacks behavioral bite.
