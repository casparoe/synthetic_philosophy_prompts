prompt: |-
  I run the data platform at a mid-size insurance company, so I live in inconsistent data: two source systems assert conflicting values for the same field, a constraint blows up, and we decide whether to quarantine the row, pick a winner, or let both stand with a flag on it. I know SQL's three-valued logic and NULL semantics cold, I've built a half-assed truth-maintenance layer, I've shipped eventually-consistent stores, and internally we tag every assertion with a provenance token and a trust tier — when tiers conflict the higher one wins silently and the contradiction only ever shows up downstream at the view level, never in the base tables. So "the same fact is both true and false in here" is basically Tuesday for me.

  I keep bumping into people who say that some contradictions are true — dialetheism, paraconsistent logic, and I have a vague memory that some logician built a four-valued logic for exactly this kind of mess. Restate that position for me as faithfully as you can in the vocabulary I actually use: relations, assertions, provenance, constraints, views, transactions, the three-valued logic, the difference between what a base table holds and what a view derives, and what goes wrong when you switch on ex falso and every query starts cheerfully returning every row in the database.

  Then give me the residue report. What maps cleanly? What do I only think I'm getting — for instance, is "the database contains P and not-P" really the same claim as "P and not-P is true," or am I sliding between two different things when I say it? What can't my vocabulary express at all, and is the leftover there because databases are missing something, or because the philosophical claim is doing less work than it sounds like? Be honest about where the translation cheats — I don't want "paraconsistent logic is just inconsistent databases" or "it's nothing like that," I want to see exactly where the analogy carries weight and where it collapses. And at the end, tell me whether the system I've already got — contradictions resolved by provenance priority, nothing ever revised — is a paraconsistent system or just a classical one with an arbitration rule bolted on. No references, please, I just want the translation and the residue.
