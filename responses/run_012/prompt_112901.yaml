answer: |-
  Here is the teaching plan for your fifty-minute tutorial. It is structured to prevent the discussion from dissolving into a semantic debate and to force the students to confront the normative emptiness of the heterogeneity objection.

  ### 1. The Dependencies: Order of Operations
  You cannot introduce the heterogeneity problem immediately. If you ask "What do pleasures have in common?" in the first five minutes, students will offer intuitive similarities (they feel good, we like them) and feel satisfied. The objection only bites if they first accept what a theory of well-being is *required to do*.

  **Sequence:**
  1.  **Function First (0–10 mins):** Establish that a theory of well-being must be **action-guiding** and **determinate**. It must tell an agent *what to aim for* without using the word "good" or "well-being" in the definition.
      *   *Why:* If the theory doesn't need to guide action, it doesn't matter if "pleasure" is a messy category. If it *does* need to guide action, a messy category is fatal.
  2.  **The Phenomenological Claim (10–25 mins):** Introduce the single example. Force the group to locate the "pleasure" within it.
      *   *Why:* You must exhaust the intuitive "common thread" strategies before introducing empirical data. If you bring in neuroscience too early, they will treat it as a scientific fact rather than a philosophical problem.
  3.  **The Empirical Wedge (25–35 mins):** Introduce the outside material (Liking vs. Wanting).
      *   *Why:* This serves as empirical proof that the "common thread" they just tried to find might not exist even in the brain. It transforms the problem from "philosophical quibble" to "structural failure."
  4.  **The Normative Consequence (35–45 mins):** Connect the lack of a common thread to the inability to maximize.
      *   *Why:* This is where the objection lands. It's not that pleasures are different; it's that "maximize pleasure" becomes an empty command, like "maximize stuff."
  5.  **Closing & Containment (45–50 mins):** The test question and the refusal strategy.

  ---

  ### 2. The Single Example: "The Compulsive Check"
  Do not use a list of pleasures (itch, math, sadism). A list allows students to say, "Well, they are different, but they are all pleasures." You need a single scenario where the label "pleasure" fractures internally.

  **The Case:**
  Ask the group to consider the experience of **checking a phone notification when you aren't expecting anything important.**
  *   **The Setup:** You feel a pull to check (anticipation). You check (action). You see nothing important (outcome).
  *   **The Interrogation:**
      1.  Did you *want* to check? (Almost always yes).
      2.  Did you *enjoy* the checking? (Often no/neutral).
      3.  Was there "pleasure" involved?

  **Why this works better than a list:**
  A list compares two different objects (cake vs. symphony). This case compares two different *roles* within a single event. It forces the question: Is pleasure the *pull* (motivation) or the *buzz* (sensation)? If the hedonist says "Maximize pleasure," do they mean "Maximize the urge to act" or "Maximize the feeling upon completion"? In this case, you can have one without the other. If "pleasure" can be split like this in a single instance, it cannot be the single currency of value.

  **What it must lack:**
  It must lack obvious moral valence. Do not use drugs or gambling where moral judgment interferes. Keep it mundane (social media, email). This prevents the "bad pleasures" objection from hijacking the session.

  ---

  ### 3. The Outside Material: Liking vs. Wanting
  **Source:** Kent Berridge's research on reward systems (dissociation of "liking" [hedonic impact] and "wanting" [incentive salience]).
  **Placement:** Minute 25 (immediately after they struggle to locate the pleasure in "The Compulsive Check").
  **Function:** To sharpen the heterogeneity problem, not solve it.

  **How to deploy it:**
  Tell them: "Neuroscience suggests these aren't just philosophically distinct; they are biologically distinct systems. You can stimulate 'wanting' in rats without 'liking,' and vice versa."
  **The Trap to Avoid:** Do not let them think this *solves* the problem by letting the hedonist choose one (e.g., "Okay, hedonism is about liking, not wanting").
  **The Point to Make:** If biology treats them as separate systems, then the word "pleasure" is covering two different natural kinds. If the hedonist says "Maximize Pleasure," they are giving an instruction that the brain processes as two different commands. This reinforces the objection: there is no single *thing* to maximize.

  **Alternative if you prefer non-scientific material:**
  Use **Ryle's Category Mistake**. Frame "pleasure" not as a ghostly feeling but as a way of doing things. If I say "I enjoyed the walk" and "I enjoyed the cake," Ryle argues I'm not naming a feeling but describing *how* I did them. This leads to the same result: "Pleasure" isn't a state you can maximize; it's an adverb. However, the Berridge data is usually more striking for second-year students who respect empirical authority.

  ---

  ### 4. Misconceptions: Interception Points
  Here is the order in which these will surface and how to head them off without killing the discussion.

  1.  **"Hedonism is just about bodily pleasure."**
      *   *When:* Minute 5 (Defining terms).
      *   *Intercept:* "If that were true, the hedonist would have to say reading a book is only good insofar as it tickles the eyes or relaxes the muscles. Most hedonists (like Mill) deny this. We must assume the hedonist is smart enough to include mental states. If we limit it to bodily states, we win too easily."
  2.  **"Different pleasures just mean different causes of the same inner feeling."**
      *   *When:* Minute 15 (Analyzing "The Compulsive Check").
      *   *Intercept:* "Okay, posit that feeling. Describe it without using the word 'good,' 'pleasant,' or 'like.' Is it a tingle? A warmth? If you can't describe it independently, how do you know it's there? If it has no specific quality, is it really a 'feeling'?"
  3.  **"So the objection is that hedonism is vague, and vague theories are usable."**
      *   *When:* Minute 30 (After the Liking/Wanting reveal).
      *   *Intercept:* "Vagueness is 'I don't know exactly where the heap starts.' Heterogeneity is 'I don't know if we're counting heaps or cars.' If I tell you to 'maximize fruit,' and you don't know if tomatoes count, that's vague. If you don't know if 'fruit' means 'botanical ovary' or 'sweet snack,' that's heterogeneity. You can't calculate a sum if you don't know the unit."
  4.  **"Any common feature you name will be trivially true — they're all pleasant."**
      *   *When:* Minute 35 (The Tautology Trap).
      *   *Intercept:* "Exactly. That is the objection. If the only thing all pleasures have in common is that we call them 'pleasures,' then the theory says 'Maximize the things you maximize.' That is not a theory of well-being; it is a repetition of the word 'good'."
  5.  **"Mill's Higher and Lower Pleasures."**
      *   *When:* Minute 40 (The Desperate Save).
      *   *Intercept:* "Mill tries to fix this by ranking pleasures. But to rank them, he needs a standard *other* than pleasure (e.g., dignity, competence). If he uses a standard other than pleasure to rank pleasures, he has admitted pleasure isn't the only good. We are discussing Hedonism, not Pluralism. Let's keep the hedonist honest."

  ---

  ### 5. What to Leave Out
  **The Propositional Attitude Debate.**
  *   *What it is:* The view that pleasure is not a felt quality but an attitude (e.g., "being pleased that p").
  *   *Why exclude it:* This is a metaphysical solution that pre-solves the heterogeneity problem by stipulation. If pleasure is just "any attitude of being pleased," then heterogeneity disappears because the attitude is the same even if the objects differ.
  *   *Instruction:* If a student raises this (likely a strong student), say: "That is a sophisticated move (Fred Feldman's view), but it changes the subject from *phenomenology* to *psychology*. For this session, we are testing the classical hedonist claim that well-being is a specific *kind of experience*. If we allow pleasure to be any attitude, we risk making the theory tautological again. Let's bracket that to see if the experiential view can survive."

  ---

  ### 6. The Closing Question
  Do not ask "Do you agree?" Ask a question that tests if they understand the *consequence* of the objection.

  **The Question:**
  "Imagine the hedonist responds: 'Okay, pleasures are heterogeneous. So what? I still say you should just pursue whichever one you feel like in the moment.'
  Why is that response a surrender? What has the hedonist given up about the *authority* of their theory if they say that?"

  **Expected Answer:**
  They should recognize that the hedonist has given up the claim that pleasure is an *objective* standard for well-being. If you just "pursue what you feel like," you are no longer a hedonist; you are a subjectivist. The theory no longer critiques your choices; it just rubber-stamps them. The heterogeneity objection shows that without a common thread, "pleasure" cannot judge between conflicting desires.

  ---

  ### 7. The Refusal Strategy (Last 5 Minutes)
  **The Question you must refuse to answer:**
  "Why can't the hedonist simply define pleasure as 'whatever the agent likes'?"

  **Why you must refuse:**
  Answering this collapses the session. If pleasure = whatever is liked, then "Maximize Pleasure" = "Maximize Whatever You Like." This makes Hedonism a **Tautology** (True by definition) rather than a **Substantive Theory** (True by fact). It renders the theory unfalsifiable and useless for adjudicating conflicts (e.g., I like smoking, but I like health more).

  **How to Refuse:**
  "I'm not going to answer that, because if we allow that definition, we aren't doing ethical theory anymore; we're doing dictionary work. That move saves the word 'pleasure' but kills the theory. I want you to leave today understanding *why* that move is a trap, not how to make it work. If you define pleasure as 'whatever is liked,' you can no longer say someone is *mistaken* about what is good for them. Do you want a theory that can tell you you're mistaken, or one that just nods?"

  **Final Instruction:**
  End the session there. Do not resolve the tension. The goal is for them to leave feeling that "Maximize Pleasure" is a harder instruction than they thought, not to provide them with a solution manual.
