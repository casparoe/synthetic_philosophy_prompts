  (2) Gödel's rotating-universe solution is a solution to the Einstein field equations, and it contains closed timelike curves—future-directed timelike paths that return to their starting event.
  (3) Therefore, closed timelike curves are a genuine possibility for our world.
  (4) If closed timelike curves are possible, then for some events there is a future-directed timelike path from the event back to itself.
  (5) If an event can be both earlier and later than itself along a future-directed path, then there is no objective global order of earlier and later.
  (6) If there is no objective global order of earlier and later, then temporal passage—the objective becoming of events—is an illusion.
  (7) Therefore, temporal passage is an illusion.

  I cannot accept (7). I would most like to keep (2) and (6). Which step should I reject, and what does rejecting it cost? Explain why that step looked compelling in the first place. If the argument is valid and the real question is which plausible premise is least costly to give up, say so; if there is a subtle equivocation or modal slide, identify it precisely. Be exact about the difference between the absence of a global time function, the absence of a global chronological order, and the absence of objective becoming, if those distinctions matter. In your answer, separate what is settled from what is genuinely contested among people who know the topic, and do not present a contested view as the consensus. State your confidence and flag any simplifications.
