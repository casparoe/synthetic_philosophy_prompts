prompt: |-
  I chair the research ethics committee at a mid-sized university hospital. Our recurring failure is not that we approve bad protocols or reject good ones; it is that we cannot agree on when to stop asking for further justification. One faction treats any unresolved question as grounds for deferral, so reviews drag on for months and investigators learn to bury us in documentation. Another treats the principal investigator's professional standing, or the mere fact that a practice is common locally, as sufficient warrant, so our approvals sometimes rest on nothing more than seniority. I want to replace this with a written procedure that any member of the committee can run.

  Write me that procedure. It must be usable by reviewers who are not philosophers, in a thirty-minute first pass, and it must be defensible when the investigator appeals to the medical director, who signs off on the final record.

  The procedure should take the form of an ordered set of tests: what question the reviewer asks at each step, what counts as a sufficient answer, when a chain of reasons may be closed, when it must be recorded as unresolved, and when it must be handed to the full committee as a values decision rather than a factual one. Ground the stopping rules in the three standard positions on the regress of justification — foundationalism, the view that a chain must terminate in something that needs no further support; coherentism, the view that a claim is justified by its fit with what we already accept; and infinitism, the view that justification may legitimately continue without end — and say explicitly which moves in your procedure come from which position, and where you are deliberately compromising among them rather than applying any one of them cleanly.

  Our committee has already adopted two house rules, which the procedure has to accommodate and whose status you should assess. The No Private Anchors rule: no chain of justification may be closed by appeal to a claim whose only support is the proposer's own authority, seniority, or the fact that the practice is common here. The Two-Door requirement: a chain may be closed either at a door anyone on the committee could open for themselves — a published standard, a measurement, a legal requirement — or at a door the committee explicitly votes to hold shut, with that vote recorded as a values judgment. Tell me whether these two rules are coherent, whether they smuggle in one of the three positions under another name, and whether together they leave any protocol unjustifiable in principle.

  Then run the procedure on three cases. First, a placebo-controlled trial whose justification for withholding an available treatment rests on the claim that the design is standard in the field. Second, a first-in-human dosing study whose risk estimate rests on an unpublished pilot the investigator ran in their own laboratory. Third, a protocol the committee is ethically sympathetic to but whose central assumption cannot be closed at an open door without a vote the committee would rather not take. For each, show the steps, the verdict, and the point at which the procedure stops and a person must decide. At least one verdict should be one the committee will dislike.

  Finish by stating what the procedure cannot do: which disagreements it will merely relocate, which of its stopping points are conventions rather than discoveries, and how a reviewer should behave when the procedure returns unresolved.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a Research Ethics Committee (REC) at a mid-sized university hospital.
      *   **Problem:** Inconsistent stopping rules for justification. One side demands infinite justification (deferral/burden), the other accepts authority/common practice (seniority/status quo).
      *   **Goal:** A written procedure for reviewers (non-philosophers) to use in a 30-minute first pass. Must be defensible against appeals to the Medical Director.
      *   **Format:** Ordered set of tests (questions, sufficient answers, closing conditions, unresolved conditions, values decisions).
      *   **Philosophical Grounding:** Must explicitly ground stopping rules in Foundationalism, Coherentism, and Infinitism, acknowledging compromises.
      *   **House Rules to Accommodate/Assess:**
          *   *No Private Anchors:* No closing justification on authority/seniority/local custom alone.
          *   *Two-Door Requirement:* Close at an "Open Door" (public standard/data/law) OR a "Closed Door" (explicit committee vote on values).
      *   **Assessment of House Rules:** Are they coherent? Do they smuggle in a philosophical position? Do they leave protocols unjustifiable?
      *   **Case Studies:** Run the procedure on three specific cases (Placebo trial, First-in-human/unpublished pilot, Ethically sympathetic but hard-to-justify). At least one verdict must be unpopular.
      *   **Limitations:** State what the procedure *cannot* do (relocated disagreements, conventions vs. discoveries, behavior when unresolved).

  2.  **Deconstruct the Philosophical Framework:**

      *   *Foundationalism:* Chains stop at basic beliefs (self-evident, empirical, or authoritative standards). In REC context: Regulations, established clinical standards, hard data.
      *   *Coherentism:* Chains stop when the belief fits well with the rest of the system. In REC context: Consistency with hospital mission, alignment with other approved protocols, internal logic of the study design.
      *   *Infinitism:* Chains never truly stop; justification is a process. In REC context: Continuous monitoring, conditional approval, acknowledging uncertainty.
      *   *The Compromise:* We need a practical stopping rule. We can't be pure infinitists (reviews never end). We can't be pure foundationalists (no standard covers every nuance). We can't be pure coherentists (risk of groupthink). The procedure needs to blend these: Start with Foundational checks, move to Coherentist checks, allow Infinitist mitigation (monitoring) if risks remain, but force a "Closed Door" vote if foundational/coherentist paths fail.

  3.  **Drafting the Procedure (The "REC Stopping Protocol"):**

      *   *Step 1: The Regulatory Floor (Foundational).* Is it legal/compliant? If no, reject. If yes, move on.
      *   *Step 2: The Public Standard (Foundational/Open Door).* Is there a guideline/data supporting this? If yes, close chain.
      *   *Step 3: The Internal Fit (Coherentist).* Does this fit our risk/benefit matrix? Is it consistent with similar approved studies?
      *   *Step 4: The Private Anchor Check (House Rule).* Is the justification relying on the PI's status? If yes, reject/flag.
      *   *Step 5: The Unresolved/Values Vote (Closed Door).* If 2 & 3 fail, is the risk acceptable based on committee values? Vote.
      *   *Step 6: The Infinitist Safety Net.* If approved with uncertainty, mandate monitoring.

      *Refining for the Prompt:* The prompt asks for specific philosophical attribution for each move. I need to make sure the "Open Door" maps to Foundationalism, the "Fit" maps to Coherentism, and the "Monitoring/Conditional" aspect maps to Infinitism (or at least acknowledges the regress). The "Closed Door" vote is a pragmatic override.

  4.  **Assessing the House Rules:**

      *   *No Private Anchors:* This blocks a lazy Foundationalism (appeal to authority). It forces public justification.
      *   *Two-Door:* This creates a dichotomy. Open = Foundational (public facts). Closed = Coherentist/Decisionist (committee will).
      *   *Coherence:* They work together. One bans bad foundations, the other defines good ones or explicit choices.
      *   *Smuggling:* "Open Door" is Foundationalist. "Closed Door" is essentially Decisionist (which is a form of Coherentism where the committee's consensus is the foundation).
      *   *Unjustifiable?* Only if a protocol requires a justification that violates public standards *and* the committee refuses to take responsibility for a values vote. It prevents "drifting" into approval without ownership.

  5.  **Running the Cases:**

      *   *Case 1 (Placebo):* Justification = "Standard in field."
          *   Test: Is "Standard in field" an Open Door? Only if published guideline exists. If just "we always do it," it's a Private Anchor (No Private Anchors rule).
          *   Verdict: Deferral/Rejection unless guideline produced. (Unpopular if field is lax).
      *   *Case 2 (First-in-Human/Unpublished Pilot):* Risk estimate = PI's own lab data.
          *   Test: Private Anchor? Yes. Open Door? No (unpublished).
          *   Verdict: Cannot close chain at Open Door. Must go to Closed Door (Values Vote) regarding trust in PI vs. public data. Likely Deferral until published/audited.
      *   *Case 3 (Sympathetic but Hard-to-Justify):* Ethical good, but no standard supports the assumption.
          *   Test: Fails Open Door. Committee doesn't want to vote "Closed Door" (political heat).
          *   Verdict: Procedure forces the vote. If they won't vote, it remains Unresolved. Protocol stalls. (Unpopular verdict: Good study blocked because committee is cowardly).

  6.  **Drafting the Limitations:**

      *   It doesn't solve moral disagreement; it forces it into a vote.
      *   "Open Doors" are conventions (we agree this guideline counts).
      *   When unresolved, the reviewer must recommend deferral, not rejection (unless safety risk).

  7.  **Review and Refine:**

      *   *Tone:* Professional, procedural, authoritative but humble about philosophical limits.
      *   *Constraints:* 30-minute first pass? The steps need to be quick checks.
      *   *Philosophical Labeling:* Ensure every step explicitly cites Foundationalism, Coherentism, or Infinitism as requested.
      *   *House Rule Assessment:* Make sure to answer the specific questions (coherent? smuggling? unjustifiable?).
      *   *Case Studies:* Ensure the "Unpopular Verdict" is clear.

      *(Self-Correction during drafting)*: I need to be careful with Infinitism. Pure infinitism says justification *never* stops. In a REC context, that means "continuous review." I should frame the "monitoring/conditional approval" aspect as the Infinitist concession—acknowledging we don't know everything now, so we justify through ongoing process.
      Also, need to ensure the "Two-Door" assessment is critical. Does "Closed Door" smuggle in Coherentism? Yes, because it relies on the coherence of the committee's will. Does it make things unjustifiable? Yes, if the committee is paralyzed.

      *(Refining the Procedure Steps)*:
      1.  Regulatory Check (Foundational).
      2.  Public Evidence Check (Foundational/Open Door).
      3.  Internal Consistency Check (Coherentist).
      4.  Authority Check (No Private Anchors).
      5.  The Stopping Decision (Open vs. Closed Door).
      6.  Residual Uncertainty (Infinitist mitigation).

      Let's assemble the document.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Ordered set of tests? Yes.
      *   Questions/Sufficient Answers? Yes.
      *   Philosophical grounding explicit? Yes.
      *   House Rules assessed? Yes.
      *   Three cases run? Yes.
      *   Limitations stated? Yes.
      *   Unpopular verdict included? Yes.

      *Wait, one nuance:* The prompt asks to say *where I am deliberately compromising*. I need to highlight that the procedure forces a "Closed Door" vote to stop the regress, which is a pragmatic compromise against pure Infinitism (which would never stop) and pure Foundationalism (which might not have a foundation).

      *Case 1 Verdict:* If "standard in field" isn't published, it's a Private Anchor. Verdict: Deferral. This will be disliked by clinicians.
      *Case 3 Verdict:* If committee won't vote Closed Door, protocol stalls. This is the "Unresolved" outcome.

      Let's write it.

      *Structure:*
      1.  Introduction (Context).
      2.  Assessment of House Rules.
      3.  The Procedure (The "Justification Termination Protocol").
      4.  Case Studies.
      5.  Limitations & Reviewer Conduct.

      *Tone Check:* Needs to sound like a formal SOP but with the philosophical meta-commentary requested.

      *(Final check on House Rules Assessment)*:
      *   Coherent? Yes, they complement.
      *   Smuggling? "Open Door" = Foundationalism. "Closed Door" = Decisionism (a pragmatic cut-off).
      *   Unjustifiable? Yes, if no Open Door exists and Committee lacks courage for Closed Door. This is a feature, not a bug (prevents drifting).

      *(Final check on Philosophical Grounding)*:
      *   Foundationalism: Steps relying on external standards (Regulations, Guidelines).
      *   Coherentism: Steps relying on internal consistency (Risk/Benefit matrix, alignment with mission).
      *   Infinitism: Steps acknowledging ongoing uncertainty (Monitoring plans, conditional approval).
      *   Compromise: The "Closed Door" vote is a pragmatic truncation of the regress.

      Okay, ready to generate.cs
answer: |-
  # REC Justification Termination Protocol (JTP-1)

  **Purpose:** To standardize the point at which a reviewer ceases to request further justification for a protocol element, preventing both infinite deferral and uncritical acceptance of authority.
  **Time Allocation:** 30 minutes (First Pass).
  **Applicability:** All initial protocol reviews.

  ---

  ## Part I: Assessment of House Rules

  Before applying the procedure, the committee must understand the philosophical status of its existing constraints.

  **1. The No Private Anchors Rule**
  *   **Assessment:** This rule explicitly bans a specific form of *Foundationalism* (Appeal to Authority). It prevents the chain of justification from terminating at the PI's seniority or local custom.
  *   **Coherence:** It is coherent with the *Two-Door Requirement*. If you cannot anchor privately, you must anchor publicly (Open Door) or collectively (Closed Door).
  *   **Smuggling:** It does not smuggle a position; it excludes a fallacious one. However, it implicitly assumes that *public* or *collective* anchors are epistemically superior to *private* ones, which is a pragmatic, not purely logical, stance.
  *   **Unjustifiability:** It renders a protocol unjustifiable *only* if the PI relies solely on their own authority and no public standard or committee consensus exists to support them. This is a feature: it forces the justification into the public or collective realm.

  **2. The Two-Door Requirement**
  *   **Assessment:** This creates a dichotomy for stopping the regress.
      *   **Open Door:** Corresponds to *Foundationalism*. The chain stops at a fact or standard external to the committee (e.g., FDA regulation, published guideline).
      *   **Closed Door:** Corresponds to *Decisionism* (a pragmatic compromise). The chain stops because the committee votes to accept the risk, acknowledging no further external foundation exists.
  *   **Coherence:** The two doors are mutually exclusive but collectively exhaustive for the purpose of approval. A chain must exit through one or the other.
  *   **Smuggling:** The "Open Door" smuggles in *Foundationalism* (treating guidelines as self-justifying). The "Closed Door" smuggles in *Coherentism* (the justification is that this decision fits the committee's current values/consensus).
  *   **Unjustifiability:** Together, they leave a protocol unjustifiable in principle if: (1) It violates public standards (Open Door locked), and (2) The committee refuses to take responsibility for a values vote (Closed Door locked). This creates a "stall" state. This is intentional: it prevents approval by drift.

  ---

  ## Part II: The Procedure (JTP-1)

  **Instruction to Reviewer:** Apply these tests in order. Do not proceed to the next test until the current one is resolved. If a test fails, follow the prescribed action.

  ### Step 1: The Regulatory Floor (Foundationalist Check)
  *   **Question:** Does this protocol element violate a binding legal or regulatory requirement (e.g., FDA 21 CFR, Declaration of Helsinki, State Law)?
  *   **Sufficient Answer:** "Yes, it complies" or "No, it violates."
  *   **Stopping Rule:**
      *   If **Violates**: Stop. Recommend Rejection. (Chain broken by negative foundation).
      *   If **Complies**: Proceed to Step 2.
  *   **Philosophical Ground:** *Foundationalism*. Regulations are treated as basic beliefs that require no further justification within this context.

  ### Step 2: The Public Standard Scan (Foundationalist / Open Door)
  *   **Question:** Is there a published guideline, consensus statement, or empirical dataset (external to the PI's lab) that supports this specific design choice or risk estimate?
  *   **Sufficient Answer:** A citation to a guideline or data source accessible to any committee member.
  *   **Stopping Rule:**
      *   If **Yes**: Close the chain at the **Open Door**. Record the citation. No further justification required for this element.
      *   If **No**: Proceed to Step 3.
  *   **Philosophical Ground:** *Foundationalism*. We accept external public evidence as a sufficient terminus for justification.
  *   **Constraint:** Apply *No Private Anchors*. If the PI cites their own unpublished data or "common practice here" without external validation, the answer is **No**.

  ### Step 3: The Internal Coherence Check (Coherentist Check)
  *   **Question:** If no public standard exists, is this choice consistent with (a) the hospital's risk/benefit matrix, and (b) at least two other protocols approved by this committee in the last 24 months?
  *   **Sufficient Answer:** Demonstration of logical fit with existing committee precedents and institutional values.
  *   **Stopping Rule:**
      *   If **Consistent**: Proceed to Step 4 (Conditional Close).
      *   If **Inconsistent**: Proceed to Step 5.
  *   **Philosophical Ground:** *Coherentism*. Justification is derived from the fit with the existing web of beliefs (precedents and institutional values) rather than an external foundation.

  ### Step 4: The Infinitist Mitigation (Process Check)
  *   **Question:** For elements closed in Step 3 (Coherence) or where uncertainty remains, is there a monitoring plan that allows the committee to revisit the justification if new data emerges?
  *   **Sufficient Answer:** A schedule for interim review or a stopping rule for the study itself.
  *   **Stopping Rule:**
      *   If **Yes**: Close the chain with **Conditional Approval**.
      *   If **No**: Proceed to Step 5.
  *   **Philosophical Ground:** *Infinitism*. Acknowledging that justification is not static; if the foundation is weak, the process of justification must continue through monitoring.
  *   **Compromise:** We are not demanding infinite justification *now*, but we are institutionalizing the *capacity* for future justification.

  ### Step 5: The Values Vote (Closed Door)
  *   **Question:** The chain cannot be closed by public standard (Step 2) or coherence (Step 3). Does the committee explicitly accept the residual risk based on the potential value of the research?
  *   **Sufficient Answer:** A formal vote recorded in the minutes as a "Values Judgment," not a factual determination.
  *   **Stopping Rule:**
      *   If **Vote Passes**: Close the chain at the **Closed Door**. Record the dissenting opinions.
      *   If **Vote Fails** or **Is Deferred**: The chain remains **Unresolved**.
  *   **Philosophical Ground:** *Pragmatic Decisionism*. This is a deliberate compromise. We stop the regress not because we found truth, but because we must act.
  *   **Action on Unresolved:** If Unresolved, the reviewer must recommend **Deferral**. The PI must be told specifically which justification chain failed to close.

  ---

  ## Part III: Case Applications

  ### Case 1: The Placebo-Controlled Trial
  **Scenario:** A trial withholds an available standard treatment for a control group. PI justification: "This design is standard in the field."
  *   **Step 1 (Regulatory):** Complies with regulations allowing placebo under specific conditions. (Pass)
  *   **Step 2 (Public Standard):** Reviewer asks for the guideline defining "standard in the field." PI provides no published consensus, only verbal assurance that "other hospitals do this."
      *   *Application of No Private Anchors:* "Other hospitals do this" is local custom/authority. It is not an Open Door. (Fail)
  *   **Step 3 (Coherence):** Reviewer checks past protocols. Two previous trials were rejected for similar lack of equipoise. (Fail)
  *   **Step 5 (Values Vote):** To approve, the committee must vote that "field custom" overrides the lack of published equipoise guidelines.
  *   **Verdict:** **Deferral.**
  *   **Unpopular Outcome:** The clinical investigators will argue this blocks necessary research. The procedure forces the committee to either find a public guideline or take ownership of deviating from standard care via a vote. Most committees prefer to hide behind "field standards." This procedure exposes that hiding place.
  *   **Stopping Point:** Step 2 fails; Step 5 requires a vote the committee may fear making.

  ### Case 2: First-in-Human Dosing (Unpublished Pilot)
  **Scenario:** Risk estimates for a new drug rely on a pilot study run by the PI in their own lab, unpublished.
  *   **Step 1 (Regulatory):** Complies. (Pass)
  *   **Step 2 (Public Standard):** Data is unpublished and proprietary. No external validation.
      *   *Application of No Private Anchors:* PI's own data is a Private Anchor. (Fail)
  *   **Step 3 (Coherence):** Inconsistent with committee precedent which requires GLP (Good Laboratory Practice) data for first-in-human risk estimates. (Fail)
  *   **Step 5 (Values Vote):** Committee must vote to trust the PI's private data over public GLP standards.
  *   **Verdict:** **Deferral.** (Recommendation: Publish pilot or undergo external audit).
  *   **Stopping Point:** Step 2.
  *   **Rationale:** Approving this would violate the *No Private Anchors* rule. The chain cannot close at an Open Door. The committee is unlikely to pass a Closed Door vote here due to liability.

  ### Case 3: The Ethically Sympathetic "Orphan" Protocol
  **Scenario:** A study offers potential high benefit for a rare disease but uses a delivery mechanism with no safety data. The committee wants to approve it but knows there is no "Open Door."
  *   **Step 1 (Regulatory):** Complies. (Pass)
  *   **Step 2 (Public Standard):** No safety data exists anywhere. (Fail)
  *   **Step 3 (Coherence):** Inconsistent with standard risk matrices (risk is unknown, not just high). (Fail)
  *   **Step 4 (Infinitist Mitigation):** PI proposes intensive monitoring. (Pass)
  *   **Step 5 (Values Vote):** The committee must vote a **Closed Door** judgment: "We accept unknown risk because the disease is fatal."
  *   **Verdict:** **Conditional Approval (contingent on Closed Door Vote).**
  *   **The Friction:** The committee "would rather not take" this vote. They prefer to find a factual reason to approve. The procedure forces them to acknowledge this is a *values* decision, not a *safety* decision.
  *   **Stopping Point:** Step 5. If they refuse to vote, the protocol is **Unresolved** and stalls. This is the "Unjustifiable" state predicted in Part I.

  ---

  ## Part IV: Limitations and Reviewer Conduct

  **1. What This Procedure Cannot Do**
  *   **It does not resolve moral disagreement.** It relocates it. Disagreements about risk are moved from "Is this safe?" (Factual) to "Are we willing to vote for this risk?" (Values).
  *   **It does not guarantee truth.** The "Open Doors" (guidelines) are conventions we agree to treat as foundational. They may be wrong. The procedure defends the *process*, not the *outcome*.
  *   **It cannot force a Closed Door.** If the committee is paralyzed by fear of liability, the protocol remains Unresolved. This is a systemic risk, not a procedural failure.

  **2. Conventions vs. Discoveries**
  *   Reviewers must recognize that Step 2 (Open Door) relies on the convention that *published* equals *valid*. This is a compromise. Unpublished truth may exist, but we exclude it to prevent the *No Private Anchors* violation.
  *   Step 5 (Closed Door) is a convention of authority. We decide that the committee's vote *makes* the justification sufficient, rather than *finding* it sufficient.

  **3. Reviewer Behavior on "Unresolved"**
  *   If a chain returns **Unresolved** (Step 5 fails or is deferred), the reviewer must **not** recommend Rejection on ethical grounds.
  *   **Correct Action:** Recommend **Deferral**.
  *   **Required Notation:** "Justification chain terminated at Step 5. No Open Door found; Closed Door vote not achieved."
  *   **Rationale:** This protects the investigator from a factual rejection when the issue is actually committee indecision. It places the burden of the stalemate on the committee's record, not the investigator's protocol.

  **4. Defense Against Appeal**
  *   If an investigator appeals to the Medical Director, the reviewer defends the record by pointing to the **House Rules**.
  *   *Argument:* "We did not reject the science. We could not close the justification chain without violating the No Private Anchors rule. The committee declined to exercise the Closed Door option. The procedure prevents us from approving based on seniority alone."
  *   This shifts the appeal from "Is the study good?" to "Is the committee willing to take responsibility?"

  ---
  **End of Procedure**
