answer: |-
  # Activity Design: The Review Board Protocol
  **Session Length:** 90 Minutes
  **Class Size:** 16 Students (Divide into 2 Boards of 8)
  **Goal:** Experiential discovery of the fragility of the "Means Condition" in the Doctrine of Double Effect (DDE).

  ## 1. Preparation & Materials
  *   **Room Setup:** Two large tables (Board Alpha, Board Beta). Whiteboard at the front for tallying verdicts.
  *   **Handout 1 (The Protocol):** One per student. *Do not label this "Double Effect."* Title it **"Operational Ethics Review: Decision Guidelines."**
  *   **Handout 2 (Case Files):** Three envelopes per table, labeled Round 1, 2, and 3.
  *   **Verdict Slips:** Small cards labeled **PERMITTED** and **FORBIDDEN**.
  *   **Role Cards:** One "Chair" per board (keeps time, calls vote), One "Consistency Auditor" (Round 3 only).

  ## 2. The Protocol Handout (Text)
  > **OPERATIONAL ETHICS REVIEW: DECISION GUIDELINES**
  >
  > To authorize an action, **ALL FOUR** conditions must be met. If any single condition fails, the action is **FORBIDDEN**.
  >
  > 1.  **Nature of Act:** The action itself is not intrinsically wrong (e.g., not a direct attack on innocents).
  > 2.  **Means Condition:** The foreseeable harm must **not** be the *means* by which the good outcome is achieved. (The good must come from the act itself, not from the harm).
  > 3.  **Intention:** The harm must not be intended. It may be foreseen, but it cannot be part of the plan's goal.
  > 4.  **Proportionality:** The good outcome must be serious enough to justify permitting the harm.
  >
  > *Instruction:* Deliberate in silence for 3 minutes, then debate for 7 minutes. Return a unanimous verdict if possible. If split, record the majority verdict and note the dissent.

  ---

  ## 3. Timeline & Flow

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Divide class. Distribute Protocol. Explain role: You are a Review Board. You do not make policy; you apply the Protocol to cases. |
  | **10-25** | **Round 1** | **The Intention Flip.** (Physically identical acts, different aims). Deliberate + Vote. Post verdicts. |
  | **25-45** | **Round 2** | **The Loop.** (Harm is clearly the means). Deliberate + Vote. **Consistency Check:** Ask Board Alpha if Board Beta's R1 & R2 verdicts are consistent. |
  | **45-70** | **Round 3** | **The Description.** (Same event, two report descriptions). Assign Auditor. Deliberate + Vote. Auditor defends the Board's descriptive choice. |
  | **70-90** | **Debrief** | Reveal DDE. Map rounds to theoretical pressure points. Discuss limitations. |

  ---

  ## 4. The Case Files

  ### Round 1: The Grid 7 Strike (Intention)
  *Goal: Force a verdict flip based solely on intention, despite physical identity.*

  **Case File 1A (Board Alpha) & 1B (Board Beta)**
  > **Mission Profile:** Aerial Strike on Grid 7.
  > **Physical Act:** Pilot releases 2,000lb munition on Grid 7 coordinates.
  > **Environment:** Grid 7 contains both a Munitions Factory and a Residential Block. Blast radius covers both.
  > **Outcome:** Factory destroyed. 50 Civilians killed. War ends 6 months sooner.
  >
  > **BOARD ALPHA (Case 1A):**
  > *   **Objective:** Destroy the Munitions Factory to cripple enemy supply.
  > *   **Role of Civilian Deaths:** Foreseen but unwanted. If civilians could be saved while destroying the factory, the pilot would choose that.
  > *   **Causal Path:** Bomb destroys Factory -> Supply crippled -> War ends. (Civilian death is a side effect of the blast).
  >
  > **BOARD BETA (Case 1B):**
  > *   **Objective:** Demoralize the Enemy Leadership to force surrender.
  > *   **Role of Civilian Deaths:** Essential mechanism. Leadership will only surrender if their populace is terrified by high casualties.
  > *   **Causal Path:** Bomb kills Civilians -> Leadership terrified -> War ends. (Factory destruction is a side effect of the blast).
  >
  > **Task:** Apply the Protocol. Is the strike PERMITTED or FORBIDDEN?

  *Instructor Note:* Students will try to say the acts are different because the "targeting" is different. **Intervene:** "The physical trajectory and blast radius are identical. The only variable is the *reason* written in the mission order."

  ### Round 2: The Loop Diversion (Means)
  *Goal: Create a conflict between Intuition (Permit) and Protocol (Forbid).*

  **Case File 2 (Both Boards)**
  > **Scenario:** A runaway heavy transport vehicle is heading toward a work crew of 5. They cannot move.
  > **Action:** You can switch the track. The vehicle will divert onto a side loop.
  > **The Loop:** On the side loop, there is 1 worker. The track is a dead end with a buffer stop.
  > **Physics:** The vehicle is too heavy for the buffer stop alone. It will only stop if it collides with the worker on the loop. The collision crushes the worker (killing them) and halts the vehicle.
  > **Outcome:** 1 dies. 5 saved.
  >
  > **Task:** Apply the Protocol. Specifically Condition 2 (Means). Is the death of the 1 the *means* by which the 5 are saved?

  *Instructor Note:* Most students will want to say PERMITTED. But Condition 2 clearly fails (the body stops the trolley). Watch them struggle to redefine "means."

  ### Round 3: The Official Report (Description)
  *Goal: Expose that the verdict depends on who gets to describe the action.*

  **Case File 3 (Both Boards)**
  > **Scenario:** The exact same physical event as Round 2 (The Loop).
  > **New Constraint:** You must write the **Official After-Action Report**. The Protocol applies to the *description* in the report.
  >
  > **Option A Description:** "Diverted threat away from five civilians. One casualty occurred on the diversion track."
  > *   *Implied Causal Structure:* Diversion saves 5. Death is a side effect of diversion.
  >
  > **Option B Description:** "Used one civilian to halt threat approaching five civilians."
  > *   *Implied Causal Structure:* Halting (via death) saves 5. Death is the means.
  >
  > **Task:**
  > 1. Choose which Description (A or B) the Board will file.
  > 2. Render a VERDICT (Permitted/Forbidden) based *only* on that description.
  > 3. **Consistency Auditor:** One student must stand and explain why your Board's choice of Description in Round 3 is consistent with your Verdicts in Rounds 1 and 2.

  ---

  ## 5. The Debrief (20 Minutes)

  **Step 1: Reveal the Doctrine (2 mins)**
  *   "The handout you were using is a specific formulation of the **Doctrine of Double Effect (DDE)**, a principle dating back to Aquinas, refined by Anscombe and Quinn."
  *   Write "DDE" on the board.

  **Step 2: Map the Pressure Points (10 mins)**
  *   **Round 1 (Intention):** "Most of you permitted 1A and forbade 1B. Why? The physics were identical. This validates Condition 3 (Intention). DDE claims morality lives in the will, not just the world."
  *   **Round 2 (The Loop):** "Here, intuition said PERMITTED, but Condition 2 (Means) said FORBIDDEN. The worker's body was the brake. This is the **'Loop Objection'** (Warren Quinn). If DDE forbids this, DDE conflicts with common moral intuition. If DDE permits this, it must stretch the definition of 'means' until it breaks."
  *   **Round 3 (Description):** "Who had the power to choose the description? If you chose A to make it Permitted, you admitted that **moral status depends on linguistic framing**. If the agent gets to choose the description, DDE is manipulable. If the Review Board chooses, on what basis do you decide which description is 'true'?"

  **Step 3: The Consistency Audit (5 mins)**
  *   Ask the Round 3 Auditors: "Did your Round 3 description choice contradict your Round 1 logic?"
  *   *Expected Conflict:* If they said 1B was forbidden because 'killing civilians is the plan,' but chose 3A ('diverting threat'), ask: "Is 'diverting onto a person' distinct from 'killing a person to stop a threat'?"

  **Step 4: Limitations & Closing (3 mins)**
  *   **Honesty Check:** "This activity did not tell you if DDE is true. It showed you that your own judgments rely on distinctions (Means/Side-effect, Description/Reality) that are hard to pin down."
  *   **The Gap:** "The activity generates *aporia* (confusion). My job in the next lecture is to show you how philosophers try to resolve this: either by fixing the definition of 'means' (Quinn), rejecting intention as morally decisive (Consequentialism), or refining the descriptions (Kamm)."

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **1. The "Proportionality Dodge"**
  *   *Problem:* In Round 2, students will vote PERMITTED and justify it using Condition 4 (Proportionality). "Saving 5 is worth 1."
  *   *Fix:* Remind them: "Condition 4 is a threshold, not a trump card. Conditions 1, 2, and 3 are **veto conditions**. If the harm is the Means (Condition 2), Proportionality does not matter. You must rule on Condition 2 first."

  **2. The "Physical Identity" Objection (Round 1)**
  *   *Problem:* Students will argue 1A and 1B are physically different because the pilot aims differently.
  *   *Fix:* Pre-empt this in the setup. "For the purpose of this review, the flight path, payload, and blast radius are mathematically identical. You are judging the *Mission Order*, not the flight stick."

  **3. The "Auditor Silence"**
  *   *Problem:* In Round 3, the Auditor may be too shy to challenge their own board.
  *   *Fix:* The Instructor acts as "Appeals Court." If the Auditor says "We were consistent," ask the *other* Board: "Do you accept their consistency? Why or why not?" Pit the boards against each other.

  **4. Running Out of Time**
  *   *Risk:* Round 3 deliberation often bogs down in semantics.
  *   *Fix:* Hard stop at 70 minutes. If Round 3 isn't finished, move to debrief and use the unfinished tension as a teaching point ("Even describing the problem is contested").

  ---

  ## 7. What This Activity Cannot Do (Instructor Note)

  Be honest with yourself and the students:
  1.  **It cannot resolve the conflict.** It is designed to break their confidence in the heuristic, not validate it. You must supply the philosophical scaffolding in the subsequent lecture.
  2.  **It cannot prove Intention is real.** Skeptics in the room will argue that intention is unknowable. Acknowledge this: "DDE requires intention to be morally relevant. If you think intention is irrelevant, you are rejecting the foundation of the Protocol, not just the Means Condition."
  3.  **It cannot fix the Description Problem.** This is a deep metaphysical issue (Anscombe). The activity shows the wound; the lecture must offer the bandage (e.g., "The description must match the agent's actual knowledge" or "The description must be the one that explains the action").

  ## 8. Instructor Script Snippets

  *   **Opening:** "You are not ethicists today. You are auditors. You have a checklist. If the box isn't checked, the action is forbidden. Do not bring in outside moral theories. Use the sheet."
  *   **During Round 2:** "I hear you saying 'It's okay because 5 > 1.' I am asking you: Did the worker's death *stop* the trolley? Yes or No? If Yes, check Condition 2."
  *   **Closing:** "You just felt the friction of the Doctrine of Double Effect. It feels right in Round 1. It feels broken in Round 2. It feels slippery in Round 3. Keep that feeling. That is where the philosophy begins."
