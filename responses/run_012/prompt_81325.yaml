answer: |-
  **MEMORANDUM**

  **To:** Members of the Citizens' Assembly
  **From:** Drafting Group
  **Date:** 24 October 2023
  **Subject:** Final Recommendations on Local Election Reform

  **Purpose**
  At this Thursday's session, we must finalise our advice to the Council on three specific changes to local elections. This memo sets out the reasoning for our recommendations and defines how we will know if these changes succeed or fail. Our goal is not to win a debate, but to offer the Council a clear, workable path to a healthier local democracy.

  **Guiding Principle: Voting as Maintenance, Not Just Speech**
  We have heard two competing views. One sees voting as a form of free speech: something you should only do if you want to. The other sees voting like jury service: a necessary job to keep the system running, even when it is inconvenient.

  Our recommendation rests on the second view. Local decisions on bins, buses, and housing affect everyone equally, so everyone should share the work of choosing who makes those decisions. However, we acknowledge the risk raised by our colleagues: if voting feels like a tax rather than a duty, people may resent it. To balance this, we recommend safeguards that preserve the right to abstain without penalty.

  **Recommendations**

  **1. Compulsory Voting (with exemptions)**
  **Recommendation: YES**
  We recommend making voting mandatory for eligible residents, enforced by a small fine similar to a parking penalty. Crucially, this must include:
  *   A 'None of the Above' box on the ballot paper.
  *   A simple 'conscientious objection' exemption anyone can tick during registration.

  **Reasoning:** High turnout ensures the Council represents the whole community, not just the loudest voices. The exemptions ensure that those who feel voting is morally wrong, or who genuinely dislike all candidates, are not punished. This keeps the 'duty' from becoming 'coercion'.

  **2. Voting Age Lowered to Sixteen**
  **Recommendation: YES**
  **Reasoning:** At sixteen, residents can work, pay taxes, and consent to medical treatment. They are also subject to local laws and school policies. It is inconsistent to ask them to contribute to the community financially while denying them a say in how that contribution is used.

  **3. Voting Rights for Non-Citizens (5+ years residence)**
  **Recommendation: YES**
  **Reasoning:** Local elections determine daily life, not national sovereignty. If someone has lived here for five years, pays local taxes, and uses local services, they have a stake in the outcome. Citizenship is a national status; residency is what matters for municipal power.

  **Addressing the Objection: Does Compulsion Kill Meaning?**
  A strong view in this room is that forcing people to vote turns a civic expression into a chore, potentially undermining the legitimacy we seek to build. We take this seriously. If compulsion leads to random voting or angry spoiled ballots, the colleague who opposes this will be proved right.

  However, evidence from other jurisdictions suggests that once the habit is formed, resentment fades. The 'None of the Above' option is our insurance policy here: it allows a citizen to fulfil their duty to attend while refusing to endorse a candidate. This preserves the expressive element within the duty.

  **The National Question**
  Our remit is municipal, but we should not pretend these changes happen in a vacuum. Recommending these reforms will be read as a statement about national elections too. We believe it is more honest to own this. If local democracy is strengthened by these measures, it provides a test case for the wider country. We recommend the Council states plainly that this is a local pilot with national implications, rather than hiding behind jurisdictional technicalities.

  **How We Will Know If We Are Wrong**
  To address the sceptics in this room and the public, we must define what failure looks like. We recommend the Council agrees to a formal review after the first election cycle. Our recommendations should be considered **wrong** and reversed if:

  1.  **Spoiled Ballots Rise Sharply:** If the number of invalid or deliberately spoiled ballots increases by more than 5% compared to the previous election, it suggests compulsion is driving disengagement rather than participation.
  2.  **Trust Falls:** If annual resident surveys show a drop in trust in the Council's legitimacy despite higher turnout, the 'chore' argument has won.
  3.  **Exemption Abuse:** If the 'conscientious objection' exemption is either used by almost no one (suggesting fear) or almost everyone (suggesting the rule is ignored), the balance of duty and freedom is broken.

  **Conclusion**
  These three measures hang together. Expanding who can vote (16+ and non-citizens) makes the community whole; making voting mandatory ensures that whole community shows up. But we must watch the data. If compulsion turns voters against the process, we must have the courage to scrap it.

  We ask the Assembly to vote **Yes** on all three parts, with the condition that Part 1 is subject to the review criteria listed above.
