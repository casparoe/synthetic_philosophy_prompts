      *   *Self-Correction on "Redistricting":* The side that lost Round 1 (or Round 2?) gets to redraw. Prompt: "side that just lost gets to redraw". In Round 1, Blue/Green lost. In Round 2, if Red loses coalition, Red lost. Let's make it Round 1 losers (Blue) redraw for a hypothetical Round 3, or just redraw the Round 1 map to show how they *could* have won. Let's have the Round 1 losers (Blue/Green) redraw the map to show how they could have stolen the majority.

      *   *Refining the Flow:*
          1.  Enter, get Party Card (Red, Blue, Green). Sit at assigned tables (pre-set for Round 1).
          2.  Round 1: SMD. Count hands. Write on board. Red wins majority seats, minority votes.
          3.  Round 2: PR. Whole room is one district. 18 seats. Count hands. Proportional seats. Coalition bargaining. Green decides who wins.
          4.  Redistricting: Blue (losers of R1) get to move 4 students to new tables. Show how they could have won R1.
          5.  Debrief.

      *   *Wait, one constraint:* "The first thing I want them to notice on their own... is that a majority is made by a counting rule rather than found in a population." (Round 1).
      *   "The second... is that proportional seats do not buy proportional power." (Round 2).
      *   "Enlarged partway through... one party comes out... with fewer seats." (Alabama). I am dropping this. I must explain why.
      *   "Redistricting minute late in the session."

      *   *Okay, let's write.*

      *   *Check:* "Write the whole thing as continuous prose — no headings, no numbered lists, no bullet points, no bold, no tables."
      *   *Check:* "Start with a short stretch of thinking aloud about two or three candidate mechanics."
      *   *Check:* "Finish with an honest account of what this activity cannot reproduce."

      *   *Thinking Aloud Section:* Discuss SMD vs PR vs STV. Discuss Alabama Paradox feasibility. Conclude on SMD/PR hybrid.
