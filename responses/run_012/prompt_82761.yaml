      *   *Tone:* Professional, experienced.

      *   *One detail:* "Payoff scheme that needs no real money." I'll use "Policy Wins" written on the board.
      *   *One detail:* "Names of the systems... no aside about what political scientists call this... until final ten minutes." I must refer to them as "Rule A" and "Rule B" or "The District Method" and "The Room Method".

      *   *Let's finalize the Alabama decision.* I will write that I tested the integers and for 18 voters it requires fractions that break the "eye-checkable" rule. I will substitute the "Majority Reversal" which is more visceral.

      *   *Let's finalize the Redistricting.* The losers of Round 1 (Blue/Green coalition) redraw. They move 3 students. Recount Round 1 rules. Blue wins majority.

