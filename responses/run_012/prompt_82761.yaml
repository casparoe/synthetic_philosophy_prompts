answer: |-
  I want to start by talking through why I am making some specific mechanical choices here, because you know as well as I do that a simulation that collapses under its own arithmetic is worse than a lecture. I initially considered trying to stage the Alabama Paradox, where enlarging the chamber causes a party to lose a seat, because you asked for it and it is a striking phenomenon. However, after working through the integers for an eighteen-person room without calculators, I am advising against it. To make the Hamilton Method paradox work cleanly, you need specific vote ratios that usually require a total electorate larger than eighteen or divisions that result in messy decimals which students cannot verify by eye on a whiteboard. If you force it, you will spend fifteen minutes doing long division on the board, and the students will watch your hand, not the logic. The cognitive load of checking the math will drown the political lesson. Instead, I am substituting the Majority Reversal in the first round, where a party wins a majority of seats with a minority of votes. This is arithmetically robust at this scale, instantly visible, and it achieves your primary goal of showing that majorities are manufactured by rules rather than found in the population. We will keep the chamber enlargement idea but use it to show how threshold effects in proportional systems can freeze out small parties, which is less fragile than the Alabama Paradox and still demonstrates that seat share is not power share.

  Here is how you run the session. You need to prepare three colors of index cards, say red, blue, and green, representing three fictional parties called the Reds, Blues, and Greens. Before the students arrive, arrange the four tables so that three are clustered together and one is slightly apart, though all should be visible to the whole room. You will assign the students to tables as they enter so that the geography is fixed for the first round. You need a specific distribution of the eighteen students to ensure the math works for the Majority Reversal. Give eight students Red cards, six Blue cards, and four Green cards. Seat them as follows. Table One gets three Reds and two Blues. Table Two gets three Reds and two Greens. Table Three gets three Blues and one Green. Table Four gets two Reds, one Blue, and one Green. This uses all eighteen students. Do not tell them this distribution is fixed; let them think they sat randomly or were assigned arbitrarily. Hand each student a ballot slip that simply lists the three party names. Tell them this is a legislature of four seats, one for each table, and the rule is that the party with the most votes at the table wins the seat. Have them vote by showing their cards simultaneously at each table. Ask each table to announce their winner. You will write the results on the whiteboard. Table One goes Red. Table Two goes Red. Table Three goes Blue. Table Four goes Red. The Reds have three seats, a clear majority. Now ask for a show of hands of the total vote count for the whole room. You will have eight Reds, six Blues, four Greens. Write this next to the seat count. The Reds have forty-four percent of the vote but seventy-five percent of the seats. Do not explain why yet. Just let them sit with the discrepancy. Ask the Blues and Greens how they feel about the result. They will likely say it is unfair. Ask the Reds if they feel legitimate. They will likely say they won the rules. This lodges the first lesson that the counting rule created the majority.

  Now you move to the second round. Tell them the constitution has been amended. The four tables no longer matter. The whole room is now one single district electing eighteen seats, one for each person present. This satisfies your constraint for a chamber size between fifteen and twenty-five while keeping the arithmetic trivial. Have them vote again by showing cards. Count the hands. Eight Reds, six Blues, four Greens. Assign the seats proportionally. The Reds get eight seats, Blues six, Greens four. Write this on the board. Now introduce the payoff scheme. Tell them the legislature must pass a budget on three issues: Taxes, Services, and Environment. The Reds only care about Taxes, the Blues only care about Services, and the Greens only care about Environment. To pass a budget, you need ten votes. No party has ten. They must form a coalition. Give them ten minutes to negotiate. They will quickly realize the Greens are the kingmakers. The Reds and Blues both need the Greens to reach ten. The Greens can sell their four seats to either side. Let them bargain openly. If the Greens join the Reds, the budget passes with Taxes and Environment, but Services die. If the Greens join the Blues, Services and Environment pass, Taxes die. The crucial moment comes when you ask the Reds, who have eight seats, how much power they have. They have more seats than the Greens, but the Greens decide the outcome. Then ask the Blues, who have six seats, if they feel represented if the Reds and Greens coalition forms. They will say no, despite having a third of the chamber. This drives home the second lesson that proportional seats do not guarantee proportional power.

  For the redistricting minute, you return to the first round's geography. Tell the Blues and Greens, who lost the majority in round one, that they have won a court case allowing them to redraw the district boundaries. They keep the same eighteen voters and the same four tables, but they can move students between tables. Give them five minutes to rearrange themselves to maximize their seat count under the original rule of one winner per table. They will quickly realize they can pack the Reds into two tables and spread the Blues and Greens to win the other two, or even three. Let them move the chairs and bodies. Recount the vote at the new tables. You will likely find the Blues and Greens can manufacture a majority for themselves. Ask the Reds how they feel now that the map changed the outcome without a single voter changing their mind. This forces them to defend the map they drew, and they will feel the discomfort of knowing the result is arbitrary.

  The debrief must happen in the final ten minutes, and you must resist the urge to lecture until the very end. Start by asking them to describe the feeling of being a Red voter in round one versus round two. They will say they felt powerful in round one and frustrated in round two. Ask the Greens to describe round two. They will say they felt disproportionately powerful. Write their descriptions on the board. Only now do you introduce the terms. Tell them round one was Single Member Districts or First Past the Post. Tell them round two was Proportional Representation. Tell them the redistricting exercise was Gerrymandering. Connect their feelings to the theoretical trade-offs. The accountability of knowing exactly who won the district versus the inclusivity of the coalition. The stability of a manufactured majority versus the fragility of a negotiated one. Ask them which system they would choose if they did not know which party they would belong to. This rawlsian question usually crystallizes the debate better than any definition.

  There are specific ways this will go wrong that you need to watch for. The most common failure is that the students will treat the bargaining round as a math problem rather than a political one. They will try to split the policies evenly rather than trading support for specific outcomes. You need to intervene if they start compromising on the issues. Remind them that their party card dictates their preference and they cannot vote for a policy they hate. Another failure point is the redistricting phase. Students may try to move too many people or forget the constraint that there are only four tables. You must act as the election commission and veto any map that does not use exactly four tables with the existing eighteen voters. Also, watch for the Reds in round two refusing to accept the Green kingmaker role. They may claim they have the most seats and should lead. You must enforce the rule that ten votes are needed to pass anything, stripping the largest party of automatic authority. If the Reds deadlock the room, call the vote and let the government fall, which is itself a valuable lesson on proportional instability.

  Finally, you need to know what this activity cannot do. It cannot reproduce the long-term stability of party systems or the role of ideology beyond the three simple issues. It cannot show how voters might change their behavior strategically if they knew the rules in advance, because the students are fixed in their party assignments. It also cannot capture the racial or geographic minorities that often motivate districting beyond pure partisanship. In the last three minutes, you must supply this context yourself. Tell them that in the real world, parties are not fixed cards but coalitions of voters who might switch. Tell them that geography often correlates with race and class, so redistricting is not just about party scores but about community representation. Tell them that the instability they felt in round two is why some countries use mixed systems. Do not present this as the answer, but as the complexity that follows the simulation. You are giving them the skeleton of the problem so they can hang the flesh of the theory on it themselves. If you stick to the timing and keep the math visible, they will leave the room feeling the weight of the rules rather than just memorizing the definitions.
