prompt: |-
  I chair the Meritorious Service Review Panel of a regional emergency-services agency — five members, quarterly sittings, six to ten cases per sitting — and we have reached the point where I no longer trust our own minutes. The charter gives us three outcomes: no award, on the ground that the act fell within what the person's role already required; a commendation; and the agency's medal. The line between the first two is where everything goes wrong. A career firefighter who enters a burning building is doing his job; the same man, off duty and in street clothes, pulling two people from a wrecked car, is a hero. A volunteer who buys his own rescue equipment is thanked in public; a salaried officer who does the same is told he was merely diligent. We also get the mirror-image cases — conduct nobody could discipline but which leaves the panel feeling soiled: a dispatcher who follows protocol to the letter and keeps a caller on hold for eleven minutes while a colleague sits free, a paramedic who withdraws from a shift by two-line text the evening before. Our previous chair wanted a fourth category for such conduct; the agency's counsel refused, and I still do not know whether he was right about the concept or only about our exposure. And we know that whatever we reward, the training division begins to treat as expected: two years ago we medaled a lifeguard for a rescue outside his post's remit, and the job description was rewritten within twelve months. I am not sure whether we were honouring something or quietly converting it into a work rule.

  What I want from you is the decision procedure I can put in front of the panel: the questions to ask, in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the points at which it must hand the matter back to us because the question is one of values rather than fact. Build it on the best thinking about supererogation — the distinction between what morality requires, what it merely permits, and what it permits while praising; the baseline problem, that is, how much is already owed by virtue of a role, a contract, or a general duty to rescue, and whether that baseline shifts between paid staff, volunteers, and people who hold no role at all; whether an act can count as beyond duty when the agent never grasped the risk he was running; whether mixed or frankly self-interested motives spoil the classification; and whether the panel's own practice can make obligatory something that was optional when we first praised it. Keep it usable by five people with no philosophical training who must justify every decision in a written minute that the union will read. Assume that decisions are quarterly, that a medal carries a small stipend and a public announcement, that we are not a disciplinary body and cannot put in a minute what we may think privately, and that I sign the minutes. No reading list or citations, please — the panel cannot check them and I need the substance.

  Then run the procedure on three cases and show your work: (1) the off-duty firefighter, in street clothes, who pulls two people out of a car; (2) a nurse who stays four hours past the end of her shift to sit with a dying patient whose family is delayed in traffic, where I suspect the procedure will tell us the act was never supererogatory at all, because her duty of care already covered it, and I want to be told plainly if I am wrong; and (3) the dispatcher who followed protocol exactly, where the procedure must yield something the panel can defensibly write — including, if it comes to this, that the procedure gives us no grounds to say what we believe. Finish by telling me what the procedure cannot do, and where it will predictably be gamed, by the union on one side and by the communications office on the other.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a Meritorious Service Review Panel (5 members, quarterly, 6-10 cases).
      *   **Problem:** Loss of trust in minutes, inconsistency in distinguishing "duty" vs. "commendation" vs. "medal." Concerns about "moral creep" (rewarding something makes it expected duty). Concerns about "negative merit" (bad behavior that isn't disciplinable but feels wrong).
      *   **Constraints:** 3 outcomes (No Award, Commendation, Medal). No 4th category for negative conduct. Minutes are public/union-read. Chair signs minutes. No philosophical citations/reading lists (needs substance, not theory).
      *   **Task:** Create a decision procedure (questions, order, sufficiency, stop points, value-judgment handoffs). Run it on 3 specific cases. Explain limitations and gaming risks.
      *   **Key Philosophical Concepts to Embed:** Supererogation (beyond duty), baseline problem (role/contract/volunteer), risk awareness, motive purity, institutional creep (reward $\rightarrow$ rule).

  2.  **Deconstruct the Philosophical Core (Supererogation & Duty):**
      *   *Duty:* What is owed by contract, role, or law. (No Award).
      *   *Commendation:* Good performance within duty, or slightly beyond, but not risky/sacrificial. (Middle ground).
      *   *Medal:* Supererogatory. Beyond duty, involves risk/sacrifice, voluntary.
      *   *The "Baseline" Problem:* Paid vs. Volunteer vs. Civilian. A firefighter entering a burning building is duty; a civilian doing it is hero. A volunteer buying gear is hero; paid doing it is diligence.
      *   *Risk Awareness:* Can you be heroic if you didn't know the risk? (Usually, objective risk matters more than subjective fear, but intent matters).
      *   *Motive:* Does self-interest spoil it? (Usually no, as long as the act itself is beyond duty).
      *   *Institutional Creep:* If we medal it, does it become duty? (Need a safeguard against this).
      *   *Negative Conduct:* Cannot punish, but can refuse reward. The procedure must handle the "icky but legal" cases by filtering them out early.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Simple enough for 5 laypeople, robust enough for union scrutiny.
      *   *Structure:* Sequential gates. If "No" at specific points, stop.
      *   *Gate 1: Eligibility & Fact.* Is this actually an act we can review? (Filters out the "dispatcher followed protocol" negative cases).
      *   *Gate 2: The Baseline (Duty).* Is this required by the job description/contract/law? (Filters out "firefighter in burning building").
      *   *Gate 3: Volition & Risk.* Was there a choice? Was there sacrifice/risk? (Distinguishes Commendation from Medal).
      *   *Gate 4: Institutional Impact.* Will rewarding this create an unfair expectation? (Addresses the "creep" issue).
      *   *Value Handoff:* Where do we vote? (At the margins of Duty and Risk).

      *Refining the Questions:*
      *   Q1: Is the conduct disciplinary? (If yes, stop. We aren't HR).
      *   Q2: Is the conduct prohibited or neutral? (If yes, stop. We reward positive acts).
      *   Q3: What is the Baseline Duty? (Define the role at the time of the act).
      *   Q4: Did the act exceed the Baseline? (If no, No Award. If yes, proceed).
      *   Q5: Was there significant personal risk or sacrifice? (If no, Commendation. If yes, Medal candidate).
      *   Q6: The "Creep" Check. (Does medaling this make it unfair to expect next time?).

  4.  **Running the Cases:**

      *   *Case 1: Off-duty firefighter, street clothes, car wreck.*
          *   Baseline: Firefighter duty applies when on-duty/in uniform usually. Off-duty + street clothes changes baseline to "civilian" + "general duty to rescue" (which is low).
          *   Exceeds Duty? Yes.
          *   Risk/Sacrifice? Yes (physical risk, liability, time).
          *   Creep? No, can't mandate off-duty intervention in street clothes easily.
          *   Outcome: Medal.

      *   *Case 2: Nurse stays 4 hours late for dying patient.*
          *   Baseline: Nursing duty of care. Does it end at shift change? Usually, care must be handed over safely. If family delayed, abandonment is unethical/professional misconduct.
          *   Exceeds Duty? Debatable. If "safe handover" was impossible without staying, it's duty. If she *could* have left but chose to comfort, it's beyond strict medical duty.
          *   *User's suspicion:* User thinks this is duty.
          *   *Analysis:* Professional codes usually require continuity of care. Leaving a dying patient alone because a shift ended is often actionable negligence. Therefore, staying is *meeting* the baseline, not exceeding it.
          *   Outcome: No Award (or perhaps Commendation for *compassion* shown, but not for *time* spent). I need to be careful here. If the procedure says "Duty," I must support the User's suspicion if the logic holds. Let's argue that "continuity of care" is the baseline. Staying is fulfilling the baseline.
          *   *Correction:* A Commendation might be appropriate for the *quality* of care, but not for the *act* of staying if staying was required to prevent abandonment. Let's lean towards "No Award" for the time, perhaps "Commendation" for the emotional labor if distinguishable. But the prompt asks to test the suspicion that it was *never supererogatory*. I will support that suspicion.

      *   *Case 3: Dispatcher followed protocol (11 min hold).*
          *   Q1: Disciplinary? No (per prompt).
          *   Q2: Positive Act? No. It's neutral compliance.
          *   Stop early.
          *   Problem: Panel feels "soiled."
          *   Solution: The procedure must explicitly state we do not reward compliance. The minute must reflect "Criteria for Meritorious Service not met" without commenting on the morality.
          *   Outcome: No Award. Minute language is key.

  5.  **Addressing Limitations & Gaming:**
      *   *Limitations:* Can't fix moral discomfort. Can't predict future creep perfectly. Can't judge motive deeply.
      *   *Gaming:* Union will argue "Baseline" is too high (everything is duty). Comms will argue "Medal" stories are good PR (push for Medal on weak cases).
      *   *Creep:* The "Precedent Warning" in the minutes.

  6.  **Refining the Tone:**
      *   Authoritative, practical, clear.
      *   No academic jargon (explain "supererogation" as "beyond what is owed").
      *   Focus on the *Minute* as the deliverable.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "motive" issue? (Self-interest). *Add to Q5.*
      *   *Check:* Did I address the "risk awareness" issue? (Didn't know risk). *Add to Q5 (Objective Risk).*
      *   *Check:* The Nurse case. I need to be precise. If the nurse *could* have transferred care but stayed to comfort, that's supererogatory. If she stayed because no one else was there, that's duty. I will assume the latter based on the User's suspicion to validate their intuition, but provide the nuance.
      *   *Check:* The Dispatcher case. The prompt says "procedure must yield something the panel can defensibly write." I need to draft the specific minute language.
      *   *Check:* The "Creep" issue. I need a specific step where the panel asks, "If we medal this, does it become a KPI?"

  8.  **Final Polish:** Organize into clear sections: The Procedure, The Cases, The Limitations/Gaming. Ensure the "Value Handoff" points are clear (where philosophy meets voting).

  *(Self-Correction on the Nurse Case)*: The prompt says "I suspect the procedure will tell us the act was never supererogatory at all... and I want to be told plainly if I am wrong." I need to be honest. If the professional code mandates "abandonment is prohibited," then staying is duty. I will confirm the Chair's suspicion but add the nuance about *how* she stayed (comfort vs. medical monitoring).

  *(Self-Correction on the Dispatcher Case)*: The prompt says "where the procedure must yield something the panel can defensibly write — including, if it comes to this, that the procedure gives us no grounds to say what we believe." I need to make sure the procedure explicitly filters out "neutral compliance" so the minute doesn't look like a passive-aggressive rebuke.

  *(Final Plan)*:
  1.  **The Procedure:** 5 Gates. Clear Stop/Go.
  2.  **The Cases:** Apply gates strictly.
  3.  **The Limits:** Gaming, Creep, Moral Residue.
  4.  **Tone:** Professional, bureaucratic but ethical.

  Let's write it.cw
answer: |-
  ### The Meritorious Service Decision Procedure

  This procedure is designed to be read aloud at the start of each case review. It converts philosophical distinctions into administrative gates. It does not eliminate judgment, but it confines judgment to specific points where the panel must vote and record the rationale.

  **The Three Outcomes:**
  1.  **No Award:** The act fell within baseline duty, or was neutral/negative conduct.
  2.  **Commendation:** The act exceeded baseline duty in quality or effort, but involved no significant personal risk or sacrifice.
  3.  **Medal:** The act exceeded baseline duty and involved significant personal risk, sacrifice, or exceptional volition.

  ---

  #### Gate 1: The Nature of Conduct (Filter)
  **Question:** Is the nominated conduct a positive act of service, or is it merely compliance with protocol / absence of misconduct?
  *   **Sufficient Answer:** "Compliance" or "Neutral."
  *   **Decision:** If the act is simply following rules (even if the rules produced a bad outcome, provided no rule was broken), stop. **Outcome: No Award.**
  *   **Minute Language:** "The panel found the conduct described constituted standard compliance with established protocol and did not meet the threshold for meritorious recognition."
  *   **Value Handoff:** None. This is a factual determination of whether an *extra* act occurred.

  #### Gate 2: The Baseline (Duty Definition)
  **Question:** What was the nominee's specific duty baseline at the exact time of the act?
  *   **Sufficient Answer:** A defined role description (Paid On-Duty, Paid Off-Duty, Volunteer, Civilian).
  *   **Rule:**
      *   *Paid On-Duty:* Baseline includes all job description tasks + reasonable emergency extension.
      *   *Paid Off-Duty:* Baseline reverts to "Civilian" + General Duty to Rescue (if legally applicable), unless they identified themselves as an officer and assumed command.
      *   *Volunteer:* Baseline is the specific task they volunteered for, not the entire agency mission.
  *   **Decision:** If the act is contained within this baseline, **Outcome: No Award.**
  *   **Value Handoff:** The panel must vote on whether a specific action (e.g., buying equipment) is "diligence" (Paid) or "generosity" (Volunteer). Record the vote split if >1 member dissents.

  #### Gate 3: Volition and Risk (The Supererogatory Test)
  **Question:** Did the nominee have a meaningful choice to refrain, and did they incur personal cost or risk?
  *   **Sufficient Answer:** Evidence of risk (physical, legal, financial) or sacrifice (time, comfort, safety) that was not required to fulfill the baseline.
  *   **Rule:**
      *   *Risk:* Objective risk counts, even if the nominee claims they "didn't think about it."
      *   *Motive:* Mixed motives (e.g., heroism + pride) do not disqualify the act.
  *   **Decision:**
      *   If No Risk/Sacrifice but exceeded baseline: **Outcome: Commendation.**
      *   If Significant Risk/Sacrifice and exceeded baseline: **Proceed to Gate 4.**
  *   **Value Handoff:** Determining "Significant." This is a value judgment.

  #### Gate 4: The Institutional Creep Check
  **Question:** If we award the Medal for this act, does it reasonably become an expectation for future role-holders?
  *   **Sufficient Answer:** "Yes, this could be written into a job description" vs. "No, this relies on unique individual circumstance."
  *   **Decision:** If "Yes," downgrade to **Commendation** (to signal appreciation without setting a precedent) or **No Award** (if it creates an unfair burden). If "No," **Outcome: Medal.**
  *   **Value Handoff:** This is a policy judgment, not a moral one.

  #### Gate 5: The Minute Test
  **Question:** Can we write the rationale without implying criticism of those who did *not* do the act?
  *   **Decision:** If the rationale implies that anyone who *didn't* do this was deficient, downgrade the award. We reward the exceptional, we do not implicitly punish the adequate.

  ---

  ### Application to Cases

  #### Case 1: Off-Duty Firefighter (Street Clothes, Car Wreck)
  *   **Gate 1 (Nature):** Positive act (rescue). **Pass.**
  *   **Gate 2 (Baseline):**
      *   *Status:* Paid, Off-Duty, Street Clothes.
      *   *Baseline:* Civilian duty. While firefighters have a general moral expectation to assist, legally and contractually, he was not on shift, had no equipment, and assumed no command.
      *   *Analysis:* Pulling victims from a wreck is not a civilian duty. It exceeds the baseline. **Pass.**
  *   **Gate 3 (Volition/Risk):**
      *   *Risk:* Physical injury from broken glass/fuel, potential liability.
      *   *Volition:* Could have waited for on-duty units.
      *   *Analysis:* Significant risk present. **Pass to Gate 4.**
  *   **Gate 4 (Creep):**
      *   *Question:* If we medal this, do we expect all off-duty firefighters to intervene in street clothes?
      *   *Analysis:* No. Agency policy usually advises off-duty personnel not to intervene unless safe/equipped. Medaling this specific instance acknowledges the choice without mandating it for others.
      *   *Decision:* **Medal.**
  *   **Gate 5 (Minute Test):**
      *   *Draft:* "For voluntary intervention in a high-risk traffic collision while off-duty and without equipment, exceeding the expectations of his off-duty status."
      *   *Result:* Safe. Does not imply on-duty firefighters who wait for backup are deficient.

  #### Case 2: Nurse (Stayed 4 Hours Past Shift for Dying Patient)
  *   **Gate 1 (Nature):** Positive act (care). **Pass.**
  *   **Gate 2 (Baseline):**
      *   *Status:* Paid, On-Duty (extended).
      *   *Baseline:* Nursing Code of Ethics and Employment Contract.
      *   *Analysis:* This is the critical failure point. Professional nursing standards prohibit "abandonment." If a patient is actively dying and no relief is present, the nurse *cannot* leave. The shift end time is administrative; the duty of care is continuous until handover is safe.
      *   *Chair's Suspicion:* You are correct. The act of *staying* was not supererogatory; it was mandatory to avoid professional misconduct.
      *   *Decision:* **No Award** for the time spent.
      *   *Nuance:* If she performed specific *comfort* measures outside medical necessity (e.g., calling distant relatives, personal vigil), that *portion* could be a Commendation. But the time itself is duty.
  *   **Gate 3 (Volition/Risk):**
      *   *Analysis:* She had no meaningful choice to refrain without violating professional ethics.
      *   *Decision:* **Stop at Gate 2.**
  *   **Outcome:** **No Award.**
  *   **Minute Language:** "The panel determined that continuity of care for a critical patient is a fundamental requirement of the nursing role. Ensuring the patient was not alone until family arrival fulfilled the baseline duty of care."
  *   **Note:** This will be unpopular with the nominee. The Minute must be precise so the Union cannot argue we are penalizing dedication. We are defining the baseline of the profession.

  #### Case 3: The Dispatcher (Protocol Followed, 11-Minute Hold)
  *   **Gate 1 (Nature):**
      *   *Question:* Is this a positive act of service?
      *   *Analysis:* No. It is compliance. The nominee followed the script. The outcome was poor, but the conduct was neutral.
      *   *Decision:* **Stop.**
  *   **Outcome:** **No Award.**
  *   **The Problem:** The panel feels "soiled." The procedure prevents you from saying why.
  *   **Minute Language:** "The panel found the conduct constituted adherence to established dispatch protocols. Adherence to protocol, while necessary, does not constitute meritorious service exceeding baseline requirements."
  *   **Why this works:** It is factually true. It does not say "This was bad." It says "This was normal." It protects the agency from liability (admitting the protocol is bad) and the panel from accusations of bias. It forces the issue back to Operations/Training where it belongs (i.e., if the protocol is bad, change the protocol, don't medal the follower).
  *   **Constraint:** You cannot add "However, the panel notes..." That violates the charter. You must trust that Operations reads the minutes and sees a pattern of "Protocol Adherence" awards being denied and investigates the protocol itself.

  ---

  ### Limitations and Vulnerabilities

  This procedure solves the consistency problem, but it introduces new risks. You must be aware of where it breaks.

  **1. What the Procedure Cannot Do**
  *   **It cannot cleanse moral residue.** In Case 3 (Dispatcher), you will leave the room feeling that justice wasn't served because a "bad" outcome was treated the same as a "good" outcome (both No Award). The procedure treats "Neutral" and "Negative" identically because you are not a disciplinary body. You must accept that the minutes will sometimes feel morally incomplete.
  *   **It cannot stop the "Creep" entirely.** Even with Gate 4, the Training Division may still rewrite job descriptions after a Medal. The procedure protects your *logic*, not the *consequence*. You mitigate this by ensuring Gate 4 minutes explicitly state: *"This award recognizes a unique circumstance and does not establish a new performance baseline."*
  *   **It cannot judge the "Heart".** Gate 3 allows mixed motives. A firefighter might save a life to get a medal. The procedure says "Medal." You cannot probe intent deeply without becoming an inquisition. You judge the act, not the soul.

  **2. Predictable Gaming**
  *   **The Union (Baseline Inflation):**
      *   *Tactic:* They will argue Gate 2. They will claim that *everything* a member does is "above and beyond" because the job description is "too vague" or "under-resourced." They will argue that buying one's own equipment (salaried officer) is supererogatory because "the agency should have provided it."
      *   *Counter:* Hold the Baseline to the *Contract*, not the *Ideal*. If the contract says "maintain readiness," buying gear is diligence, not heroism. Do not let resource failures be rewarded as merit; that lets management off the hook.
  *   **The Communications Office (Medal Inflation):**
      *   *Tactic:* They will pressure Gate 4. They want Medal stories for press releases. They will argue that "Commendation" is invisible to the public. They will push for Medals on cases that fail the Risk test (e.g., the Nurse case) to generate positive news.
      *   *Counter:* Use Gate 5. If the press release would embarrass those who did the bare minimum ("Nurse X stayed, why didn't Nurse Y?"), the Communications Office must find another story. Remind them that a Medal that becomes a Job Description is a liability, not a PR win.
  *   **The "Off-Duty" Loophole:**
      *   *Tactic:* Members may begin to stage interventions while "off-duty" to bypass Gate 2.
      *   *Counter:* Scrutinize the "Off-Duty" claim. If they are wearing agency identifiers or carrying agency comms, they are On-Duty for the purpose of Baseline.

  **3. The "Soiled" Hands Problem**
  In cases like the Dispatcher, the procedure forces you to be silent. This is the cost of not being a disciplinary body. If you cannot punish, you cannot reward the *absence* of punishment. Your power is limited to recognizing the exceptional. If the exceptional is absent, the minute must be silent. If this becomes frequent, your recommendation to the Agency Head should not be in the minutes, but in a separate quarterly cover letter: *"The Panel notes a high volume of cases involving strict protocol adherence with poor outcomes. This suggests a training or protocol issue, not a merit issue."*

  **Final Instruction to the Panel:**
  When you sign the minutes, you are not signing off on the *morality* of the person. You are signing off on the *classification* of the act. If the procedure says "No Award," and the person is decent, the minute is still correct. Trust the gates. If the gates feel wrong, amend the gates at the next quarterly review, not the decision in front of you.
