answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **ON THE METAPHYSICS OF PHENOMENAL CHARACTER**

  **Signatories:** The Qualia Realist (QR) and The Structural Skeptic (SS)^1
  **Rapporteur:** Neutral Chair
  **Date:** October 26, 2023

  ### I. Points of Agreement

  The signatories affirm the following claims as a common foundation for further inquiry. These claims are formulated to be consistent with both the assertion that phenomenal properties are genuine intrinsic features of the world and the assertion that such properties, as commonly defined, lack coherent identity conditions.

  1.  **On the Four Marks:** We agree that the debate centers on properties of experience characterized by four marks: (a) *Ineffability* (resistance to full public description), (b) *Intrinsicality* (nature independent of relations to other things), (c) *Privacy* (access restricted to the subject), and (d) *Direct Apprehensibility* (known immediately by the subject). We agree that these marks are the standard definition of the target concept, regardless of whether we believe instances of such properties exist.
  2.  **On Identity Criteria:** We agree that for any property to figure in a complete scientific or metaphysical account of the world, there must be principled conditions under which a token of that property at time *t1* is the same as or different from a token at time *t2*, or in subject *S1* versus *S2*. We disagree on whether properties bearing the four marks satisfy this requirement, but we agree that the requirement itself is legitimate.
  3.  **On the Stipulated Cases:** We agree that the following two scenarios describe coherent situations that any theory of mind must accommodate, even if we disagree on what makes them true:
      *   *The Taster Pair:* Consider two subjects who previously shared identical discriminatory abilities and preferences regarding a specific beverage. Subject A undergoes a physiological change such that they can no discriminate between the constituent flavors, yet their affective preference for the beverage remains unchanged. Subject B retains full discriminatory ability but undergoes a shift in affective preference. When queried, both subjects utter identical verbal reports regarding the beverage (e.g., "This is the one I enjoy"). We agree this scenario demonstrates a dissociation between discriminatory capacity, affective response, and verbal report.
      *   *The Chameleon:* Consider a subject whose color vision undergoes a gradual shift over a long period. The shift occurs in steps too small to be noticed at any single stage. By the end of the process, the phenomenal character of their experience when viewing a red object is, by stipulation, identical to the phenomenal character of their experience when viewing a blue object at the start. Throughout this process, the subject's ability to match, discriminate, and verbally label colors remains perfectly stable. We agree this scenario describes a divergence between phenomenal character and functional disposition.
  4.  **On Introspection:** We agree that introspective report is a primary source of data regarding the mind, but it is not infallible. A subject's conviction that a property is intrinsic or ineffable does not, by itself, guarantee that the property *is* intrinsic or ineffable in the metaphysical sense. Introspection reveals how things seem to the subject, which is a fact that requires explanation, regardless of whether it reveals how things are in themselves.

  ### II. Disagreements Table

  The following table isolates the specific points of divergence. Each formulation is phrased to be acceptable to the respective signatory without conceding the opponent's position.

  | Question in Dispute | Qualia Realist (QR) Formulation | Structural Skeptic (SS) Formulation | The Crux |
  | :--- | :--- | :--- | :--- |
  | **1. Individuation of Phenomenal Properties** | Phenomenal properties are individuated by their location in a similarity structure *of experiences*. Two experiences differ if they feel different to the subject, even if the subject cannot judge them to be different. | Phenomenal properties are individuated by their location in a similarity structure *of judgments and dispositions*. Two experiences differ only if there is a difference in the subject's capacity to discriminate or judge them. | Is the similarity structure that defines a property a structure of *raw feel* or a structure of *cognitive access*? |
  | **2. The Status of the Chameleon Case** | The Chameleon case describes a factual change in the world (a change in intrinsic properties) that is not captured by behavioral or functional description. This fact is in principle recordable (e.g., via a perfect phenomenologist or neural correlate). | The Chameleon case describes a difference in how we redescribe the subject's dispositions. To say the experience "changed" is merely to say that if the subject's history were different, their judgments *would* be different. There is no additional fact to record. | Is the divergence between experience and function a *fact* or a *manner of speaking*? |
  | **3. Explanatory Role** | Any complete account of the mind must explain why these intrinsic properties exist and how they relate to physical states. Ignoring them leaves out the central phenomenon. | Positing properties with the four marks explains nothing because they are defined by their exclusion from functional roles. A complete account explains the dispositions and judgments; adding "intrinsic properties" adds no predictive power. | Do intrinsic phenomenal properties have *causal/explanatory weight* or are they *explanatorily idle*? |

  ### III. Agreed Evidence and Predictions

  For each Crux identified above, the signatories agree on the type of evidence that would be relevant to resolving the dispute, though they diverge on the predicted outcome.

  **Regarding Crux 1 (Individuation):**
  *   **Agreed Evidence:** Neurophenomenal correlation studies where a subject's discriminatory behavior remains constant while neural activity in sensory processing areas shifts systematically (mimicking the Chameleon case).
  *   **QR Prediction:** If neural activity shifts while behavior remains constant, this confirms that the phenomenal property has changed. The neural state tracks the intrinsic property, not the judgment. The property is individuated by the neural/phenomenal state, not the behavior.
  *   **SS Prediction:** If neural activity shifts while behavior remains constant, this indicates a change in the *vehicle* of representation, not the *content* or property itself. Since the subject's access and discrimination are unchanged, the relevant psychological property has not changed. The neural shift is irrelevant to the identity of the experience.^2

  **Regarding Crux 2 (The Chameleon Fact):**
  *   **Agreed Evidence:** A completed ideal physics and neuroscience that accounts for all behavioral dispositions and verbal reports of the subject in the Chameleon case.
  *   **QR Prediction:** Even a complete physical/functional account will leave out the fact of *which* quality is present (red-ish vs. blue-ish). There will be a residual fact about the "inner light" that the physical description misses.
  *   **SS Prediction:** A complete physical/functional account will leave nothing out. Once all dispositions to judge, remember, and act are accounted for, the question "But what did it *really* feel like?" has no answer. The "residual fact" is a grammatical illusion generated by the structure of language.

  ### IV. Closing Statement: Verbal vs. Genuine Disagreement

  In concluding this collaboration, we distinguish between disagreements that arise from terminology and those that arise from conflicting ontological commitments.

  **Merely Verbal Disagreements:**
  We acknowledge that some friction arises from the use of the word "property." The QR uses "property" to denote a feature that can be instantiated even if it makes no difference to relations. The SS uses "property" to denote a feature that must contribute to the causal or inferential role of an entity. If the debate were solely about whether the word "property" applies to ineffable feels, it would be lexical. However, we do not believe the debate is merely lexical.

  **Residual Genuine Disagreement:**
  The core disagreement is ontological. It concerns whether there are facts about consciousness that are *categorical* rather than *dispositional*.
  *   The **QR** maintains that there are categorical facts: it is a fact that *this* experience is like *that* one, independent of any disposition to compare them. The Chameleon case proves that the space of possible phenomenal facts is larger than the space of functional facts.
  *   The **SS** maintains that there are no categorical facts of this kind. All facts about experience are exhausted by facts about how the world seems to the subject, where "seeming" is analyzed in terms of dispositions to believe and act. The Chameleon case describes a verbal possibility, not a metaphysical one.

  We conclude that the dispute reduces to this: **Does the difference between "feeling red" and "feeling blue" consist entirely in differences in discriminatory and cognitive dispositions, or does it consist in an intrinsic quality that *grounds* those dispositions but can vary independently of them?** We have failed to convince one another, but we have succeeded in isolating this specific point of divergence as the necessary target for future inquiry.

  ***

  ^1 *Note on Terminology:* The term "Structural Skeptic" is used here to denote the position historically associated with "Quining Qualia." We avoid the term "Quiner" in the body text to prevent the implication that the position is merely a denial of experience rather than a denial of a specific metaphysical interpretation of experience.

  ^2 *Note on Formulation:* An earlier draft of the SS Prediction stated: "The neural shift is irrelevant to the experience." This was rejected by the QR as implying the experience doesn't exist. The current formulation ("irrelevant to the identity of the experience") is accepted by the SS as consistent with the view that identity is functional, and by the QR as a clear statement of the disagreement.
