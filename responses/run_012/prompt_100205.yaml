      *   *The Chameleon:* Red -> Blue shift. Imperceptible steps. No behavioral change.

  5.  **Review against Constraints:**
      *   Four parts? Yes.
      *   Two cases treated as coherent? Yes.
      *   No citations? Yes.
      *   Footnotes for slanted language checks? Yes.
      *   Neutral rapporteur voice? Yes.

  6.  **Writing the Content (Iterative refinement):**
      *   *Self-Correction on Part I:* Make sure the claims aren't too weak. "We agree we disagree" is too weak. "We agree that introspection reports are data" is better.
      *   *Self-Correction on Part II:* Ensure the Realist doesn't sound dogmatic and the Quiner doesn't sound eliminativist in a way that denies the phenomenon entirely (Quiners usually deny the *interpretation*, not the experience).
      *   *Self-Correction on Part III:* The "argument both sides agree would bear on it." This is tricky. They usually disagree on what counts as evidence. I need to find a common ground, perhaps neurophenomenal correlation.
      *   *Self-Correction on Part IV:* Distinguish verbal vs. genuine carefully.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally validate the Quiner's view that qualia don't exist in the Agreed section. The Realist must be able to sign. So, instead of "Qualia do not exist," the Quiner's view in the agreement should be "Properties satisfying the four marks lack clear identity conditions."

