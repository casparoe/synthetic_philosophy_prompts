          *   *Qualia Realist:* Experiences have intrinsic, ineffable, private, directly apprehensible properties (the "four marks"). These are genuine features of the world.
          *   *Quiner:* The notion of qualia (as characterized by the four marks) is incoherent or explanatorily idle because no identity criterion can be given for such properties.
      *   **Required Content:**
          *   Think carefully on the page first (analysis of commitments, talking past each other).
          *   Two stipulated cases must be treated as coherent: (i) The Taster Pair (palate change vs. preference change), (ii) The Chameleon (spectrum shift without notice).
          *   Four Parts:
              1.  Numbered list of agreed claims (four marks, identity criteria, cases, introspection).
              2.  Disagreements Table (Realist formulation, Quiner formulation, Crux).
              3.  Agreed Evidence/Arguments for each Crux + Predictions.
              4.  Closing Section (Verbal vs. Genuine disagreement, residual statement).
      *   **Constraints:** No citations, no attributions, write for knowledgeable readers, avoid vacuous/slanted formulations (note in footnotes if considered), focus on the document itself.

  2.  **Pre-Drafting Analysis (Thinking on the Page):**
      *   *The Realist's Core:* There is "something it is like." This "what it is like" has a nature independent of functional role or judgment. The Chameleon case shows that experience can change while function/judgment stays the same.
      *   *The Quiner's Core:* To talk about a property, we need to know what makes it *that* property and not another. If it's private and ineffable, we can't compare across subjects or times reliably without relying on judgment/function. If function/judgment stays the same (Chameleon), there's no fact of the matter about change. The "four marks" create a black box that explains nothing.
      *   *Talking Past Each Other:*
          *   *Identity:* Realist thinks identity is given by direct acquaintance (I know *this* red is the same as *that* red because I feel it). Quiner thinks identity requires public criteria or functional role.
          *   *The Cases:* Realist sees the Chameleon as proof of inverted/shifted qualia without functional change. Quiner sees it as a description of dispositions where "experience change" is just a metaphor for "potential judgment change under counterfactuals."
          *   *Ineffability:* Realist means "cannot be fully captured by public language." Quiner means "cannot play a role in explanation because it cannot be pinned down."
      *   *The Taster Pair:*
          *   Drinker A (Palate change, same preference): Can't tell flavors apart, but likes it same as before.
          *   Drinker B (Same palate, preference change): Can tell flavors, but likes it differently (or vice versa? Prompt says: "first... no longer discriminate... preferences unchanged; second... unchanged palate but shifted preferences." Both say same words).
          *   *Significance:* Dissociates discrimination (functional/phenomenal?) from affect/preference. Realist sees this as separating qualia from judgment. Quiner sees this as separating discriminatory dispositions from affective dispositions.
      *   *The Chameleon:*
          *   Red experience becomes Blue experience over time, imperceptibly. No notice. Behavior identical.
          *   *Significance:* The hard case for functionalism. Realist says "Experience changed." Quiner says "Nothing changed but the description; without a difference in discrimination, 'change' is empty."
      *   *Drafting Strategy:* I need to find language that allows the Realist to say "There is a fact of the matter" and the Quiner to say "There is a fact of the matter about *what*?" without calling the other a fool. The agreement section needs to be robust enough to show they aren't just arguing about definitions, but specific enough to show where the split happens.

  3.  **Drafting - Section by Section:**

      *   **Part I: Agreed Claims.**
          *   Need to define the "four marks" neutrally.
          *   Need to agree on what an identity criterion *would* look like (even if they disagree on whether qualia have one).
          *   Need to treat the cases as coherent scenarios (logical possibility).
          *   Need to limit introspection (it's not infallible).
      *   **Part II: Disagreements Table.**
          *   Crux 1: Individuation (Similarity structure of experiences vs. judgments).
          *   Crux 2: The Chameleon (Recordable fact vs. Redescription of dispositions).
      *   **Part III: Evidence & Predictions.**
          *   What would settle it? Neuroscience? Phenomenology?
          *   Realist predicts neural correlate will show change where behavior doesn't.
          *   Quiner predicts neural correlate will track behavior/discrimination, not the "shift."
      *   **Part IV: Closing.**
          *   Verbal: Maybe some of it is just how we use "property."
          *   Genuine: Is there a non-functional fact of the matter?

      *   *Refining the Tone:* Must be dry, precise, philosophical. No "I think." Use "The Signatories agree..."
      *   *Refining the Cases:* Describe them fresh, don't use "Inverted Spectrum" or "Qualia" in the description of the cases themselves if possible, to keep it neutral.
      *   *Footnotes:* Need to check for slanted language.

  4.  **Drafting - Specific Challenges:**
      *   *The Quiner's Name:* "Quiner" is a specific term (Dennett). I must not cite Dennett. I must describe the position.
      *   *The Four Marks:* Ineffable, Intrinsic, Private, Directly Apprehensible.
      *   *Identity Criterion:* Realist says "Acquaintance." Quiner says "Functional Role." How to state this in the *Agreed* section? They agree on what a criterion *is*, not that qualia *have* one.
      *   *The Taster Pair:* Ensure the description matches the prompt exactly.
