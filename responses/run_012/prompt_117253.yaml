prompt: |-
  I'm teaching a 90-minute elective session on philosophy of psychiatry to second-year psych residents next week, and the topic is Hacking on looping effects. Don't explain looping effects to me, I know them — what I need is the plan for how I put them across.

  Settle the order first. What has to be in their heads before the loop will land as a claim rather than a slogan? My hunch is that the load-bearing piece isnt the loop at all but something earlier, about what a classification is for and who it's for — tell me if that's wrong, and what actually depends on what.

  Then the carrying example. I dont want to run it on multiple personality / DID: they'll spend the whole hour litigating whether it's real and never get to the mechanism, and half of them have already been taught to be cynical about it. My current plan is to carry it on prolonged grief disorder, on the theory that they've all watched a category arrive mid-training and can each name someone who now describes themselves in its terms. Tell me if that's the right horse — what the example has to have, what it must not have, and what it buys me that DID doesn't.

  Misconceptions I'm expecting: "looping means the diagnosis isn't real"; "looping means patients are suggestible or faking"; "it's just a self-fulfilling prophecy"; and something muddy about the observer effect in physics. Where in the sequence does each one get headed off, and before or after they've seen the loop itself? Also, someone will inevitably say "so it's like TikTok self-diagnosis of ADHD" — tell me where to use that rather than defuse it.

  One thing I want them to walk out with, and I'm not sure Hacking hands it to me cleanly: the difference between a category that changes because the classified people change and a category that changes because the classifiers changed their practice. As far as I can tell he runs those together under one loop. I want them separated — the second is measurement drift, the first is the interesting claim — but I don't want to hand it over as a definition in minute two. Build the sequence so it's available to them by the end.

  And what do I leave out? I've got maybe fifteen spare minutes. Also give me the closing question that would show me whether they got it — not a comprehension check, something where they have to apply it to a case I haven't given them.

  Format: bottom line in the first sentence, then the reasoning. No preamble, and don't restate what I asked.
