answer: |-
  Your hunch is correct: the loop only lands if you first establish diagnoses as interactive kinds designed for intervention rather than natural kinds designed for description, and PGD is the stronger vehicle because it avoids the ontological trench warfare of DID.

  **Order and Dependencies**
  The load-bearing concept is not the loop itself but the **interactive kind**. If residents view diagnoses as natural kinds (like viruses), looping looks like measurement error or fraud. You must establish that psychiatric classifications are tools for intervention and identity formation before introducing the mechanism.
  1.  **Minute 0–20 (The Ontology):** Define classification by function. Natural kinds wait to be found; interactive kinds change when found. This heads off "looping means the diagnosis isn't real" immediately (interactive kinds are real *because* they cause effects) and "observer effect in physics" (this is semantic/causal, not quantum).
  2.  **Minute 20–40 (The Mechanism):** Explain the loop as a feedback cycle between classification and agency. This is where you head off "patients are suggestible or faking" by emphasizing unconscious accommodation and institutional reinforcement, not conscious deception. Distinguish this from "self-fulfilling prophecy" here: prophecy is individual/psychological; looping is historical/kind-level.
  3.  **Minute 40–70 (The Case - PGD):** Use Prolonged Grief Disorder to separate drift from looping. Do not define the difference yet; show it.
  4.  **Minute 70–90 (Application):** Use the TikTok ADHD comment here as a valid high-velocity example, then deploy the closing question.

  **The Carrying Example: Prolonged Grief Disorder (PGD)**
  PGD is the right horse because it is recent (DSM-5-TR/ICD-11), low-stigma relative to DID, and clinically visible.
  *   **What it must have:** A clear pre-diagnosis state (normal grief), a codification moment, and observable post-diagnosis behavioral shifts (e.g., patients seeking treatment specifically for "PGD" rather than "depression").
  *   **What it must not have:** High controversy over existence (like DID) or purely biological markers (like Alzheimer's).
  *   **What it buys you:** A shared timeline. Every resident saw the field change. DID buys drama but loses the mechanism to ontology debates; PGD keeps the focus on the *process* of classification.

  **Handling Misconceptions**
  *   **"Diagnosis isn't real":** Head off in Minute 0–20. Reality in interactive kinds is defined by causal power, not independent existence.
  *   **"Physics observer effect":** Head off in Minute 0–20. Clarify this is about language and agency, not measurement disturbance.
  *   **"Suggestible/Faking":** Head off in Minute 20–40. Frame it as "becoming what is described" rather than "pretending to be what is described."
  *   **"Self-fulfilling prophecy":** Distinguish in Minute 40–70. Use the PGD case to show that prophecy happens to a person, looping happens to a *category* over time.
  *   **"TikTok ADHD":** Use in Minute 70–90. Do not defuse. Ask them to map the loop steps onto it (Label circulates -> Identity shifts -> Symptom reporting changes -> Clinicians adjust thresholds). It validates their intuition while disciplining the concept.

  **Separating Drift vs. Looping**
  Do not define this distinction early. Build it through the PGD timeline in Minute 40–70.
  *   **Step 1:** Show the criteria changes from DSM-5 to 5-TR (Measurement Drift/Practice Change).
  *   **Step 2:** Show the change in patient self-reporting and help-seeking behavior post-awareness (Looping/People Change).
  *   **Step 3:** Ask them to sort specific clinical anecdotes into "Ruler Changed" vs. "Thing Changed." By the end, they will have constructed the distinction themselves.

  **What to Leave Out**
  Cut Hacking's broader historical epistemology, Foucault comparisons, detailed DSM committee politics unrelated to patient feedback, and competing philosophical frameworks (Kuhn/Popper). You have 15 spare minutes; use them for the PGD case analysis, not theory.

  **Closing Question**
  Present a hypothetical scenario: "A new category 'Digital Dissociation' is introduced. Year 1: Criteria are strict. Year 3: Criteria are identical, but patients report symptoms more vividly and clinicians diagnose more frequently. Year 5: Criteria are relaxed to match patient reports. Which phase represents looping, which represents drift, and why does distinguishing them matter for treatment?" This forces them to apply the mechanism to a novel case rather than recite definitions.
