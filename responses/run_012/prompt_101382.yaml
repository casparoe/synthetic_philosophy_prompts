answer: |-
  The shape you are describing has a name in epistemology (the study of knowledge). It is called **the Problem of Bootstrapping**, often discussed under the broader header of **Easy Knowledge**.

  Since you can't look these up, I will carve the concept out for you right here. You have correctly identified that this is not simple circularity, and you are right to feel that it is distinct from a normal track-record argument. Here is the breakdown of the machinery, why it fails, and how it differs from the cousins you mentioned.

  ### The Name: Epistemic Bootstrapping

  The term comes from the phrase "pulling yourself up by your own bootstraps"—an impossible physical feat. In epistemology, it refers to a specific kind of reasoning where a subject uses a source of information to confirm the reliability of that very source, without any independent check.

  Your intuition is spot on: the problem isn't that the logic is formally invalid. It's that the *warrant* (the justification) for the premises depends on the conclusion already being true.

  ### Carving 1: Bootstrapping vs. Begging the Question

  You asked how this differs from ordinary circular reasoning or begging the question.

  **Begging the Question** is usually structural and immediate. It looks like this:
  *   *Premise:* God exists.
  *   *Conclusion:* Therefore, God exists.
  Or more subtly:
  *   *Premise:* The Bible says God exists (and the Bible is true because God wrote it).
  *   *Conclusion:* God exists.

  In begging the question, the conclusion is essentially hidden inside the premise. If you doubt the conclusion, you must immediately doubt the premise.

  **Bootstrapping** is procedural and inductive. It looks like data collection. It hides the circle inside a process.
  *   *Step 1:* I look at the gas gauge. It says 'F'. I look in the tank. It looks full. (Match!)
  *   *Step 2:* I look at the gas gauge. It says 'H'. I look in the tank. It looks half-full. (Match!)
  *   *Step 3:* [Repeat 10 times.]
  *   *Conclusion:* Therefore, the gas gauge is reliable.

  The trick here is that "I look in the tank" *is* "I look at the gas gauge" (or relies on vision, which is the thing being tested). In your friend's case, "listing times he remembered correctly" relies entirely on memory to verify the list.

  **The Difference:** Begging the question is a static circle (A proves A). Bootstrapping is a dynamic spiral that *looks* like a ladder. It generates a feeling of empirical weight ("I have ten data points!") when it actually has zero independent data points. It feels like science, but it is solipsism.

  ### Carving 2: Bootstrapping vs. Legitimate Track-Record

  This is the most important distinction. A track-record argument is valid *if and only if* there is **Independence**.

  **Legitimate Track-Record:**
  *   *Source:* My friend's promise.
  *   *Check:* Did they show up? (Verified by my eyes, by other witnesses, by the completed task).
  *   *Why it works:* The verification method (seeing them show up) is distinct from the source being tested (their verbal promise). I am using Faculty B (vision) to check Faculty A (testimony).

  **Bootstrapped Track-Record:**
  *   *Source:* My memory.
  *   *Check:* Did I remember correctly? (Verified by... my memory).
  *   *Why it fails:* There is no "outside" vantage point. You are using the tool to measure itself.

  In your news source example, the man reads the source to check if the source is biased. Unless he has an external way to determine bias (e.g., cross-referencing with raw data, checking funding records via a different channel), he is just reading *claims* of balance. He is using the source's testimony to verify the source's honesty.

  ### Carving 3: First-Time Trust vs. Topping Up Confidence

  You asked if there is a real difference between establishing reliability for the first time versus just reassuring an existing doubt.

  **Epistemically (Regarding Knowledge): No Difference.**
  Whether you are trying to prove the faculty works for the first time or just calming a panic attack, the logical structure is identical. If the method cannot generate *new* justification, it cannot *restore* lost justification. If the bridge is out, driving back and forth over the remaining stub doesn't fix the bridge, even if it makes you feel like you've traveled a long distance.

  **Psychologically (Regarding Anxiety): Real Difference.**
  This is where your observation is keen. Bootstrapping is terrible for finding truth, but excellent for regulating emotion.
  *   **First-Time:** The person is trying to build a foundation. Bootstrapping here is delusional.
  *   **Topping Up:** The person already has a foundation (they generally trust their memory), but they have a localized crack (anxiety). The bootstrapping act serves as a "ritual of reassurance." It doesn't actually fix the crack, but the act of performing the ritual lowers cortisol.

  The danger is that the psychological success masks the epistemic failure. Your friend feels better, so he assumes the worry was unfounded. But the worry might have been correct (his memory *might* be fading), and his test was simply incapable of detecting it.

  ### Analyzing Your Examples

  1.  **The Memory Friend:** This is a textbook case of Bootstrapping. He is querying memory to validate memory. If his memory is flawed, the list he generates will *also* be flawed, but he will believe the list is accurate. He cannot detect the error from inside the system.
  2.  **The News Guy:** This is Bootstrapping mixed with **Confirmation Bias**. He is using the source's output to validate the source's integrity. This is particularly dangerous because news sources often explicitly claim their own balance ("We are the most trusted name in news"). Accepting that claim as proof is the bootstrap.
  3.  **The Student:** This is the borderline case. Using reasoning to check reasoning is unavoidable. You cannot use a microscope to check the rules of logic. This touches on the **Cartesian Circle**. However, there is a nuance: she is re-deriving the argument. If she finds a contradiction, reasoning has checked itself successfully. If she finds it sound, she has only confirmed consistency, not necessarily truth. This is less "bootstrapping" in the negative sense and more "coherentism" (things fit together). But if she doubts her *capacity* to reason (e.g., "Am I too tired to think?"), re-doing the math while tired is bootstrapping.

  ### The Verdict

  The concept you are looking for is **Bootstrapping**.

  However, since you asked for a carving and not just a label, here is the specific edge you are sensing that standard definitions sometimes miss:

  **The Illusion of Accumulation.**
  Standard circularity is obvious because it's a loop. Bootstrapping feels like a line. It feels like progress.
  *   *Circularity:* "I am right because I am right."
  *   *Bootstrapping:* "I was right here, and here, and here... therefore I am right."

  The "pile up" you mentioned is the key. The error is that the "successes" are not independent data points. They are echoes. If you shout in a cave and hear an echo, you haven't verified that your voice is loud; you've only verified that the cave reflects sound. Your friend is shouting into the cave of his memory and listening for the echo.

  ### A Proposed Term for the Psychological Variant

  Since standard "Bootstrapping" focuses on why this *fails* to produce knowledge, and you are interested in the *pattern of behavior* used to quell anxiety, I will coin a descriptive term for this specific dynamic:

  **Self-Vouching.**

  *   **Definition:** The act of a cognitive faculty issuing a certificate of its own competence using its own operations.
  *   **The Edge:** Self-vouching is distinct from bootstrapping in that bootstrapping is the *logical error*, while self-vouching is the *behavioral ritual*.
  *   **Borderline Case:** A calculator checking its own math by running the equation backwards. Is this self-vouching? No, because the reverse operation is a distinct logical path.
  *   **Borderline Case:** A person asking themselves "Am I calm?" and answering "Yes." This is self-vouching. If they are actually panicked but believe they are calm, the self-vouch has failed, and they have no way to know.

  ### Summary

  You have identified **Epistemic Bootstrapping**.
  *   It is not **Begging the Question** because it wears the mask of induction (collecting examples).
  *   It is not a **Track-Record Argument** because it lacks an independent verifier.
  *   It does not matter if it is for **First-Time Trust or Topping Up**; epistemically it is void in both, though psychologically useful in the latter.

  The "bug" you feel is the recognition that the data points are not independent. They are correlated by the very thing under suspicion. You cannot count a witness's testimony as proof of their honesty if the only evidence of their honesty is their own testimony. That is the shape.
