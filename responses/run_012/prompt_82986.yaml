answer: |-
  The phenomenon you describe is the central tension in the philosophical foundations of decision theory, yet surprisingly, there is no single, lexicalized noun (like "Modus Ponens" or "Reification") that universally names this specific inferential move in the literature.

  The closest established phrases are **"The Normative Interpretation of Representation Theorems"** or **"The Representation Theorem Argument for Rationality."** These are descriptive labels for the *position* or the *argument*, not a sharp name for the *move* itself—the specific step where mathematical fit is transmuted into normative bindingness.

  Here is the carving you requested, distinguishing this move from its nearest neighbors, followed by a coinage that isolates it.

  ### The Carving

  **1. Distinction from "Coherence"**
  "Coherence" (or "Consistency") names the *state* of satisfying the axioms (e.g., transitivity, probabilism). It is the target, not the justification. Your target is the argument that *because* incoherence prevents a mathematical representation, it is therefore irrational. One can demand coherence without using a representation theorem (e.g., via direct intuition); your target is specifically the derivation of the norm *from the representability condition*.

  **2. Distinction from "Dutch Book" Arguments**
  A Dutch Book argument provides a *pragmatic* penalty: if your beliefs violate probability axioms, you can be made to accept a sure loss. The move you identify lacks this pragmatic bridge. It argues: "If you violate the axioms, no utility/probability function exists." The jump to "therefore you are irrational" relies entirely on the value of being representable, not on the cost of being exploited. This is a structural norm, not a pragmatic one.

  **3. Distinction from "Operationalism"**
  Operationalism defines a theoretical quantity (utility) by the operations used to measure it (choice behavior). If an agent violates the axioms, an operationalist says "Utility does not exist for this agent." That is a metaphysical claim. The move you identify adds a *normative* layer: "Utility *ought* to exist; therefore, the agent *ought* to satisfy the axioms." It converts an operational limit into a rational duty.

  **4. Application to Belief**
  The move appears identically in epistemology. Axioms (e.g., additivity) are laid down for belief. A representation theorem shows these beliefs can be mapped to a probability function. The move concludes that agents whose beliefs violate the axioms are "epistemically irrational," not merely "unmodelable." This is often called the "Representation Theorem Argument for Probabilism," but again, that names the argument, not the specific inferential step.

  ### The Coinage

  Since the existing terminology ("Normative Interpretation," "Representation Theorem Defense") describes the *context* rather than the *inferential mechanism*, I propose the following term to name the move itself.

  **Term:** **Representational Normativity**

  **Definition:** The inferential move that treats the mathematical preconditions for representing an agent's attitudes (preferences or beliefs) within a specific formal model as normative constraints on the agent's rationality.

  **Boundary Conditions:**
  *   **Included:** Arguing that an agent is irrational *because* their preferences violate the Independence Axiom and thus cannot be mapped to an Expected Utility function.
  *   **Included:** Arguing that beliefs are irrational *because* they are not probabilistically coherent and thus lack a probability representation.
  *   **Excluded:** Arguing that an agent is irrational because they accept a Dutch Book (this is *Pragmatic Normativity*).
  *   **Excluded:** Arguing that an agent is irrational because their beliefs are false (this is *Veritic Normativity*).
  *   **Excluded:** Simply noting that an agent's behavior cannot be modeled by Expected Utility theory without assigning a negative rational evaluation (this is *Descriptive Modeling*).

  **Why this fits:** It captures the source of the norm (the requirements of the *representation*) and the nature of the claim (a *normative* binding on the agent). It highlights the category error you detected: conflating the topology of the map with the terrain of the mind.

  \answer{no established term: Representational Normativity}
