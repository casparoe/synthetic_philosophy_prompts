answer: |-
  # JOINT STATEMENT ON THE NATURE OF LARGE LANGUAGE MODEL COGNITION

  **Date:** October 26, 2023
  **Parties:** [Name A] ("The Functionalist") and [Name B] ("The Skeptic")
  **Purpose:** To delineate points of agreement, isolate substantive disagreements, and establish pre-registered empirical cruxes to resolve the debate regarding whether Large Language Models (LLMs) possess genuine understanding or function solely as stochastic approximators.

  ---

  ## PART I: AGREED PREMISES

  We both affirm the following claims as factually accurate descriptions of the current technological and theoretical landscape. We sign this section to establish that our disagreement is not rooted in basic mechanics or observed performance metrics.

  1.  **The Training Objective:** We agree that the base training objective for these models is next-token prediction (or equivalent denoising objectives) over massive corpora of text. We agree that no explicit objective for "truth," "logic," or "meaning" is directly optimized.
  2.  **Performance vs. Mechanism:** We agree that high performance on a benchmark does not prove a specific internal mechanism. A model can solve a math problem via retrieval, reasoning, or statistical coincidence; performance alone does not distinguish these.
  3.  **The "Black Box" Constraint:** We agree that we currently lack full interpretability. We cannot directly observe "concepts" or "rules" in the weights, only correlate activation patterns with inputs and outputs.
  4.  **Emergent Capabilities:** We agree that models display capabilities (e.g., few-shot learning, basic reasoning) that were not explicitly programmed and emerge at scale, which were not predictable solely from the training loss curve.
  5.  **The Definition Problem:** We agree that the word "understanding" is not a technical term with a universally accepted operational definition in cognitive science or computer science. A significant portion of our argument stems from competing definitions of this term.
  6.  **The Stakes:** We agree that this is not purely academic. If the models are merely tracking statistics, they are fundamentally unreliable in out-of-distribution (OOD) scenarios. If they are representing meaning, they may be robust in ways that statistics alone would not predict.

  ---

  ## PART II: SUBSTANTIVE DISAGREEMENTS

  The following table outlines the core disagreements. These are phrased to ensure neither party feels their view is being caricatured.

  | Domain | The Skeptic's Position (Stochastic Parrot) | The Functionalist's Position (Genuine Understanding) |
  | :--- | :--- | :--- |
  | **Internal Representation** | The model's internal states are high-dimensional statistical maps of token co-occurrence. There is no separation between the *symbol* and the *referent*. | At sufficient scale, the model is forced to construct internal world models to minimize loss. These states function as semantic representations, not just syntactic probabilities. |
  | **Generalization** | Generalization is interpolation within the manifold of the training distribution. When the model appears to reason, it is matching surface forms to stored patterns. | The model learns abstract rules and causal structures. It can extrapolate to novel situations that require combining known concepts in ways never seen in training. |
  | **Grounding** | Syntax is not semantics. Without sensorimotor grounding (a body, a world), the model is manipulating empty symbols (The Chinese Room argument). | Functional use is sufficient for meaning. If a system can use language indistinguishably from a grounded agent, the lack of biological sensors is irrelevant to the presence of understanding. |
  | **Mechanism Importance** | The mechanism *is* the point. A system that arrives at the right answer via probability matching is categorically different from one that arrives at it via reasoning, regardless of output. | The mechanism is secondary to the capacity. If the input-output behavior is robust across counterfactuals, the system "understands" in the only way that matters for interaction and safety. |

  ---

  ## PART III: CRUXES, TESTS, AND PRE-REGISTERED PREDICTIONS

  This section identifies the specific sub-questions where an empirical answer would force one or both of us to update our position. For each crux, we define a test case and lock in predictions *before* the test is run.

  ### Crux 1: Representation vs. Statistical Tracking (The Artificial Language Test)
  **The Question:** Can a system that gets the statistics right be said to represent a rule rather than merely track it?
  **Methodological Note on Proposed Test:** The Skeptic proposed training a model on a made-up language with a rule no natural language has. The Functionalist worries this is gameable (the model could memorize the rule structure statistically).
  **Refined Test Design:** To prevent gaming, the model will be trained on a Context-Free Grammar (CFG) with a recursive rule (e.g., nested dependencies) that is *under-represented* in the training set. The test set will contain *depths of recursion* never seen in training (e.g., train on depth 1-3, test on depth 5-10). This isolates rule induction from memorization.

  | Side | Pre-Registered Prediction |
  | :--- | :--- |
  | **The Skeptic** | The model's accuracy will degrade significantly as recursion depth increases beyond the training distribution. It will fail to generalize the rule abstractly because it is relying on local statistical cues that vanish at higher depths. |
  | **The Functionalist** | The model will maintain high accuracy on deep recursion. It will have induced the abstract grammatical rule, proving it represents the structure rather than just tracking token proximity. |
  | **Update Condition** | **If Accuracy > 90% on OOD depth:** The Skeptic must concede that the model is capable of abstract rule induction, not just interpolation.<br>**If Accuracy < 60% on OOD depth:** The Functionalist must concede that the model is not learning abstract rules in this domain, but rather surface statistics. |

  ### Crux 2: Compositional Generalization
  **The Question:** Is compositional generalization the real dividing line or a red herring?
  **Test Design:** A systematicity benchmark (similar to SCAN) adapted for natural language. The model is trained on commands involving specific attribute-object pairings (e.g., "red square," "blue circle") but explicitly *excluded* from seeing certain combinations (e.g., "red circle"). The test requires the model to execute or describe the excluded combinations correctly based on the constituent parts.

  | Side | Pre-Registered Prediction |
  | :--- | :--- |
  | **The Skeptic** | The model will struggle with the unseen combinations. It will hallucinate or revert to the most statistically probable pairing from the training set because it lacks a discrete, compositional representation of "red" and "circle" as independent variables. |
  | **The Functionalist** | The model will succeed on the unseen combinations. It has learned vector representations for attributes and objects that are additive or composable, allowing for systematic generalization. |
  | **Update Condition** | **If Success Rate on Unseen Combos ≈ Seen Combos:** The Skeptic must acknowledge that the model possesses systematic compositional capabilities.<br>**If Success Rate drops by >40%:** The Functionalist must acknowledge that compositionality is a major weakness and likely not handled via genuine symbolic-like composition. |

  ### Crux 3: Grounding vs. Use
  **The Question:** Is grounding in the world required for meaning, or is enough use enough?
  **Test Design:** A "Turing Test" for Grounding. Two systems interact with a simulated physics environment. System A is text-only (trained on transcripts of interactions). System B is multimodal/embodied (trained on text + direct sensorimotor feedback from the simulation). Both are asked to solve novel physical puzzles described in text.
  *Note: This tests whether text-only training creates a sufficient world model.*

  | Side | Pre-Registered Prediction |
  | :--- | :--- |
  | **The Skeptic** | System A (Text-Only) will fail on puzzles requiring intuitive physics not explicitly described in the text corpus. It lacks the causal model that comes from interaction. System B will outperform System A significantly. |
  | **The Functionalist** | System A will perform comparably to System B on tasks describable in language. The text corpus contains sufficient latent information about physics that a sufficiently large model can extract a functional world model without direct embodiment. |
  | **Update Condition** | **If System A ≈ System B:** The Skeptic must concede that direct grounding is not a strict requirement for functional understanding of physical concepts.<br>**If System B >> System A:** The Functionalist must concede that text-only training hits a hard ceiling on "meaning" regarding physical reality. |

  ---

  ## PART IV: THE VERBAL DISPUTE

  **The Question:** Is any part of this fight just verbal? If so, which part, and what exactly would we have to stipulate to make it disappear?

  **Joint Assessment:**
  We agree that a portion of the dispute is verbal, specifically regarding the label "understanding."
  *   **The Verbal Core:** The Skeptic uses "understanding" to imply *human-like conscious experience or biological grounding*. The Functionalist uses "understanding" to imply *functional competence and robustness*.
  *   **The Stipulation:** To dissolve the verbal component, we agree to adopt the term **"Functional Understanding"** for the Functionalist's claim and **"Phenomenal Understanding"** for the Skeptic's claim.
  *   **Remaining Dispute:** Even with this stipulation, a substantive disagreement remains regarding **Mechanism**. The Skeptic argues that even "Functional Understanding" is impossible without the underlying mechanism being rule-based rather than statistic-based. The Functionalist argues that if the function is robust, the mechanism (stats vs. rules) is an implementation detail.

  **Resolution Protocol:**
  If the models pass the tests in Part III (Cruxes 1 & 2) with the specified thresholds, we agree to drop the "Stochastic Parrot" label in favor of "Statistical Learner with Functional Understanding." If they fail, we agree to drop the "Genuine Understanding" label in favor of "Pattern Matching."

  ---

  **Signed:**

  _________________________ (The Functionalist)

  _________________________ (The Skeptic)
