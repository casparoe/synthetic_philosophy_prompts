prompt: |-
  You are an archaeological theorist with a philosopher's habits — someone who has spent years on the question of what, exactly, licenses an inference from a mute object to a past belief or institution, and who is suspicious of both the confident processualist and the confident interpretivist. Think carefully and at length before you answer. Begin by briefly setting out, in your own words, what each of the two approaches below actually claims about the object-to-belief inference — its ontology of the "belief," its unit of evidence, and what would count as getting it wrong — and only then turn to the comparison. Do not let the preamble run away with you; it is scaffolding for the answer, not the answer.

  The two things to compare:

  (1) The actualistic, analogy-based approach: past beliefs and institutions are inferred by projecting regularities observed in living or historically documented societies onto material remains, with the reliability of the projection underwritten by general uniformitarian or middle-range principles, and with the "belief" treated as a cause that left a material trace.

  (2) The material-engagement approach: cognition and belief are not merely evidenced by objects but partly constituted and enacted through them, so that the object is not a downstream trace of a prior mental state but a participant in the very practice that the belief consists in.

  Compare them on at least these axes: what each takes the object to be evidence of, and whether "belief" is the right kind of explanandum at all; how each handles the chronic underdetermination of material form by mental content; what each owes to the observer's own cultural position; and what each can and cannot say about change — how a belief or institution comes into being or dies out, as read from the objects. Where a given axis is not one the theory addresses, say so rather than manufacturing a position for it.

  Now bring in two things I am injecting, and treat them as stipulated — do not go looking for a real counterpart.

  First, a case. Imagine a single standardized artifact form: small perforated bone discs, drilled centrally, bearing a fixed and nearly invariant set of notches, recovered in large numbers from domestic refuse, spread across several centuries and a wide region, with variation so slight it looks enforced. Read this case twice, once through each approach, and say what belief or institution each would reconstruct, what each would refuse to reconstruct, and what both readings leave untouched. Then say which features of the case are load-bearing for each reading.

  Second, a criterion I have coined myself and want stress-tested, which I call the double-substitution test. For an object-based inference to a belief to be warranted, it must survive two substitutions: hold the object form fixed and ask whether a materially identical practice could have been produced by people holding a different belief; then hold the belief fixed and ask whether it could have issued in a materially different object form. If the belief can be swapped out under the first substitution, or the object swapped out under the second, the object does not individuate the belief. Apply this test to the case, tell me which of the two approaches can accommodate the test and which is embarrassed by it, and — this matters most — tell me whether the test is a genuine advance or merely a restatement of the underdetermination worry dressed in new clothes. If it collapses into something older, name what it collapses into.

  Throughout, be disciplined about the mapping and honest about silence: do not force either theory to speak where it has nothing to say, and do not let the comparison flatten into "both are useful in their own way."

  Give your final answer as a single JSON object with exactly the following fields:

  - "approach_1_summary": string — the actualistic approach's core claim about the object-to-belief inference.
  - "approach_2_summary": string — the material-engagement approach's core claim.
  - "axes": array of objects, each with "axis" (string), "approach_1" (string), "approach_2" (string), and "theory_silent" (boolean).
  - "case_reading_1": string — how the actualistic approach reads the stipulated case.
  - "case_reading_2": string — how the material-engagement approach reads it.
  - "case_residue": string — what both readings leave unexplained.
  - "double_substitution_verdict": object with "approach_1" (string), "approach_2" (string), and "is_genuine_advance" (string, saying whether it is a real advance or a restatement, and of what).
  - "decisive_consideration": string — the single point that most separates the two approaches.
  - "bottom_line": string — one paragraph stating which approach you would trust more for reconstructing belief from objects, and under what conditions you would switch.
