  **Brainstorming Angles**

  1.  **The Black Cab:** I reach the destination, meter reads £12.50. I argue that since I've never travelled this exact distance before, the rule 'plus' might revert to 'quus', making the fare £5. The driver responds by locking the doors and calling the police.
      *Pros:* Very London. *Cons:* A bit cliché; the driver's reaction is just force, not necessarily 'community practice'.

  2.  **The IKEA Assembly:** My partner and I are building a bookcase. Instruction 57 says "Insert 68 screws". I hesitate, invoking the sceptical paradox. My partner throws the Allen key at me.
      *Pros:* Domestic setting. *Cons:* Hard to fit the specific numbers naturally; risks becoming about relationship breakdown rather than rule-following.

  3.  **The Divorce Settlement:** Lawyer says "Half the assets". I ask "What is 'half' in this new context?" Lawyer bills me for the extra hour.
      *Pros:* High stakes. *Cons:* Too dark; obscures the mathematical rule-following aspect.

  4.  **The High Street Bookmaker:** I'm collecting on an accumulator. The slip says I'm due £125. The bookie argues that given my finite betting history, there's no fact that I meant 'plus' rather than 'quus', so the payout is £5. He resolves it by appealing to what the 'community' of punters accepts.
      *Pros:* Captures the 'assertability conditions' vs 'truth conditions' distinction perfectly. The bookie represents the community enforcement. Money makes the stakes real. Very British setting.

  **Selection:** Angle 4. It allows the 'community solution' to land with the necessary brute force that makes Kripke's reading feel both practical and deeply unsettling.

  ***

  **The Payout**

  It was a Tuesday afternoon at William Hill, smell of damp raincoats and stale tobacco. I handed my slip over to Len behind the counter. It was a lucky accumulator, total return £125.

  Len looked at the slip, looked at me, and pushed a £5 coin across the Formica.

  "Hold on," I said. "68 plus 57 is 125. Not 5."

  Len didn't blink. "Look, mate. You've never placed a bet involving numbers this big before. All your past slips, all your past sums—they're compatible with you meaning 'plus', but they're also compatible with you meaning 'quus'. Where 'quus' is addition up to 57, and 5 thereafter. There's no fact about your past behaviour that settles it."

  I was stunned. "Are you... are you reading Kripke?"

  "I'm reading the room," Len said. "There's no internal fact about what you meant. Meaning isn't a mental state. It's how you're disposed to act, corrected by the community." He gestured around the shop at the three other punters staring at us. "And the community says you're having a laugh."

  "But surely," I stammered, "if there's no fact of the matter, why 5? Why not 125?"

  "Because," Len said, leaning forward, "the condition for asserting you've won £125 is that we let you walk out with it. And the condition for that is you take the fiver."

  He nodded to the bouncer by the door. I took the coin. It felt cold. I walked out, wondering if I'd actually lost the argument, or if I'd just followed a rule I didn't know I was following, in a language I wasn't sure I spoke. To be honest, I'm not certain now if I've told this joke correctly, or if you've just been quussed.

  ***

  **A Note on the Text**

  A couple of liberties here. First, Kripke presents this as Wittgenstein's argument, but many scholars (like Baker and Hacker) argue vehemently that Wittgenstein wasn't a sceptic at all and Kripke has invented 'Kripkenstein'. Second, the 'communal solution'—that meaning is saved by shared assertability conditions rather than truth conditions—is Kripke's proposed way out, but it's heavily disputed whether this actually defeats the sceptic or just collapses into relativism. I've also treated the community's enforcement as a bit more coercive than Wittgenstein's 'forms of life' usually imply, mostly for comedic effect. And there might be a typo in there somewhere, though given the paradox, there's no fact of the matter whether it was intended.
