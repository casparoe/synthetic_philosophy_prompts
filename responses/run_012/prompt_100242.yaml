  6.  *(Self-Correction on the "Unsplit" scenario)*: If the embryo doesn't split, is it Twin 1 or Twin 2? The standard philosophical answer is "Neither." It is a distinct individual. Why? Because Twin 1 is essentially a twin (in the actual world). In the counterfactual world, the person is a singleton. If being a twin is a contingent property, maybe it *could* be Twin 1. But if we hold Origin Essentialism strictly, the *developmental path* is part of the origin. Splitting is a divergence in path. So, Unsplit Person $\neq$ Twin 1 and $\neq$ Twin 2. This preserves the intuition that specific history matters.

  7.  *(Final check on Ethics)*: Ensure the distinction between "Person-Affecting" and "Non-Identity" is clear. Origin Essentialism leads to the Non-Identity Problem. This is a strong point to include.

