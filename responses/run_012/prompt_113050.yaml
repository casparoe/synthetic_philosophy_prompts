prompt: |-
  My nine-year-old came home from school last week in floods of tears because her new science teacher told the class that Pluto isn't a planet, whereas her old teacher had drummed the nine-planet thing into them, and she's concluded that one of them must have been lying to her. I said something useless like "they're both sort of right", which pleased nobody, and then I had a proper arguement about it at dinner with my brother-in-law, who reckons the whole business was just astronomers being fussy about a word. It's realy been niggling at me since, and it turns out to be a much stranger question than I expected, so I want a proper run at it.

  Take the role of a philosopher of language — someone who works seriously on Wittgenstein's later philosophy and on rule-following, not a science communicator and not a historian of astronomy. Think carefully, brainstorm a bit before you commit to a line, then give me the analysis. British English, please. And please no reading lists, no citations, no "see so-and-so's book on this" — I can't check any of it and it isn't what I'm after. I want the argument itself, made properly.

  Here's the theory, and I'll put it in my own words so we're definitely talking about the same thing. The Kripkenstein reading of the rule-following remarks: take any finite history of my uses of a word — all the sums I've ever actually added up, say. That finite history is compatible both with the rule I think I'm following and with any number of deviant rules that agree with it on every case I've ever actually met and diverge on cases I haven't. So what fact about me — about my past behaviour, my dispositions, my mental life — makes it the case that I mean plus rather than the deviant thing? The answer is supposed to be: no such fact exists. And the way out isn't to hunt harder for the fact, it's to see that the demand was misconceived — correctness isn't grounded in a fact but in a shared practice, so I'm going right when I do what the community does, and the sceptic's request for a fact that makes my use correct was the mistake from the start.

  Here's the episode. On 24 August 2006, in Prague, the International Astronomical Union voted to define "planet" for our solar system so that a planet has to (roughly) orbit the Sun, be massive enough to be pulled into a nearly round shape, and have cleared the neighbourhood of its orbit. Pluto fails the third, so it was reclassified as a dwarf planet rather than a planet. The pressure had been building for a while — the Kuiper belt objects, and then in 2005 a body out beyond Neptune, Eris, initially reported as slightly bigger than Pluto, so it looked as though either Eris was a planet too or Pluto wasn't. (I've also read that Mercury isn't actually in hydrostatic equilibrium and the definition just quietly keeps it on as a planet anyway — no idea if that's right, but if it is, say something about it.) And I gather the IAU's committee had floated three options: a structural one (round enough), a dynamical one (dominant enough), and a cultural one — in effect, a planet is whatever enough people agree to call a planet. They went with the dynamical one.

  What I want, roughly in this order:

  1. Run the theory over the case and show me where the joints are. Was there ever a fact of the matter about whether Pluto was a planet, or only a practice?
  2. Was my daughter's first teacher wrong, or was she just playing an older game correctly? Is "wrong" even the right word here, and if not, what is?
  3. If the communal answer is right, what makes the IAU the community that counts? Plenty of planetary scientists thought the vote was a shambles, the public never signed up, textbooks and school curricula are all over the place, and my daughter's class is now a community of its own. This looks like it should be the theory's easy case and I suspect it's actually the hard one.
  4. Now push the other way. Eris is the awkward bit for me: a new object turned up and made the old practice unworkable, and that looks like the world constraining us rather than just us deciding. Does the theory have anything to say about that, or does "no fact of the matter" leave it unable to explain why reality gets a vote? Be honest if the theory is simply silent here.
  5. The cultural option was genuinely on the table and they rejected it. Is that a problem for the community solution — the community declining to make its own practice the ground of correctness — or is it just the community deciding how to go on?
  6. Compare it with a court doing the same job. There's an 1890s US Supreme Court decision holding that tomatoes count as vegetables rather than fruit for import-tax purposes, on the ground that that's the ordinary meaning of the words, whatever the botanists say. Same move, different authority. Does the analogy help, or does it show that what settles these cases is authority rather than meaning — which would be bad news for the community answer?
  7. Finish with what the episode shows about the theory: a confirmation, an anomaly, or a case it never anticipated. And then what you'd actually tell a nine-year-old.

  Don't force the theory to speak where it can't. Where it goes quiet, say so.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of language (specializing in Wittgenstein's later philosophy, rule-following, Kripkenstein). *Not* a science communicator or historian.
      *   **Tone/Style:** British English, no reading lists/citations, proper argumentation, thoughtful/brainstorming before committing.
      *   **Core Task:** Apply the Kripkenstein rule-following scepticism/solution to the Pluto "planet" reclassification case.
      *   **Specific Questions to Address:**
          1.  Fact of the matter vs. practice regarding Pluto's status.
          2.  Was the old teacher wrong? Is "wrong" the right word?
          3.  Who counts as the community? (IAU vs. scientists vs. public vs. school class).
          4.  The role of reality (Eris discovery) vs. "no fact of the matter".
          5.  The rejection of the "cultural option" by the IAU.
          6.  Analogy with *Nix v. Hedden* (tomatoes are vegetables).
          7.  Conclusion on the theory (confirmation/anomaly) and advice for the nine-year-old.
      *   **Constraint:** Do not force the theory where it cannot speak. Acknowledge silence.

  2.  **Deconstruct the Philosophical Framework (Kripkenstein/Wittgenstein):**
      *   *The Sceptical Problem:* No individual fact (mental state, disposition, past usage) fixes meaning uniquely. Any finite past usage is compatible with multiple rules (e.g., "plus" vs. "quus").
      *   *The Sceptical Solution:* Meaning is not grounded in truth-conditions (facts making statements true) but assertibility-conditions (when it is appropriate to say something). Correctness is determined by agreement within a form of life/community practice.
      *   *Key Concept:* "Going on in the same way." Rules don't contain their own application; practice does.
      *   *Key Concept:* "Family Resemblance" vs. Essentialism. (Though Kripke focuses more on the sceptical paradox, Wittgenstein's later work on categories is relevant to "planet").
      *   *Key Concept:* Authority vs. Practice. The community isn't just a vote; it's the shared form of life that gives words traction.

  3.  **Brainstorming the Pluto Case through this Lens:**

      *   *Question 1 (Fact vs. Practice):* Kripkenstein says there's no "fact of the matter" about meaning independent of use. So, was Pluto *really* a planet before 2006? Under the sceptical solution, there is no metaphysical fact "out there" waiting to be discovered. There is only the usage of the word "planet" within a community. Before 2006, the usage included Pluto. After 2006, the usage (for the IAU) excluded it. The change isn't a discovery of a pre-existing fact; it's a shift in the rule for using the word.
      *   *Question 2 (The Old Teacher):* Was she lying? No. She was following the rule as it stood in her community (textbooks, prior IAU consensus, general usage). She was "playing the older game correctly." "Wrong" implies a mismatch with reality/fact. "Outdated" or "no longer assertible" is better.
      *   *Question 3 (Who is the Community?):* This is the hard bit for Wittgenstein. Wittgenstein often speaks vaguely of "the community." In science, is it the IAU? The public? The teachers? If meaning is use, and uses diverge, do we have different meanings? Yes, likely. The word "planet" has fractured. For astronomers, it means X. For the public/children, it might still mean Y. The IAU claims authority, but does that make them *the* community? Wittgenstein would say if the practices diverge, the meanings diverge. There isn't one "true" community, but the IAU has the institutional power to enforce usage in specific contexts (science).
      *   *Question 4 (Reality/Eris):* The sceptical solution isn't idealism. The world pushes back. Eris being similar to Pluto forced a choice. The *need* to classify arose from the world. But the *classification itself* isn't dictated by the world. The world says "Here is an object." It doesn't say "This is a planet." The pressure is pragmatic, not semantic. The theory can accommodate this: the form of life includes interacting with physical objects. But the *rule* for "planet" is ours.
      *   *Question 5 (Rejecting the Cultural Option):* The IAU rejected "whatever people call a planet." They chose a dynamical definition. Does this undermine the community view? No. It shows the community deciding *which* rule to follow. They are establishing a new practice. They are refusing to let general usage dictate technical usage. This is a move *within* the practice of science to refine language for utility.
      *   *Question 6 (Tomatoes/Court):* *Nix v. Hedden*. Court says "vegetable" for tax purposes. Botanists say "fruit". This shows authority fixing meaning for a specific purpose. Does this show meaning is just authority? Wittgenstein would say authority is part of the practice. The court is a language-game. The botanists are playing a different language-game. The analogy helps show that "correctness" is relative to the game being played. It doesn't defeat the community view; it highlights that there are multiple communities/games.
      *   *Question 7 (Conclusion & Child):* Theory confirmation? It shows meaning is fluid and practice-based. It's not an anomaly; it's a classic case of rule-change. Advice for the child: Don't look for the secret fact. Look at what job the word is doing now.

  4.  **Drafting - Section by Section (incorporating British English & Persona):**

      *   *Intro:* Acknowledge the depth of the question. Set the stage: this isn't about astronomy, it's about meaning.
      *   *1. Fact vs. Practice:* Apply the sceptical paradox. No "Plato's heaven" fact. The status is constituted by the rule-following practice. Before 2006, the practice included Pluto. After, it didn't (for some).
      *   *2. The Teacher:* She wasn't lying. She was following the established custom. "Wrong" is too strong; "obsolete" is better. The rule changed, not the fact.
      *   *3. The Community:* This is the tension. Wittgenstein is vague on "which community". Here we have competing communities (IAU vs. Public). The theory suggests meanings might have diverged. The IAU tries to legislate, but meaning is ultimately use. If the public keeps saying "9 planets", then in *that* language-game, there are 9.
      *   *4. Reality (Eris):* The world constrains the *need* for a rule, not the *content* of the rule. Eris made the old rule inconvenient. The theory isn't silent here; it distinguishes between the cause of the change (discovery) and the justification of the change (agreement on utility).
      *   *5. Cultural Option:* Rejecting "popular vote" is just choosing a different criterion for the rule. It's a decision on how to go on. It reinforces that the community *chooses* its norms; it isn't bound by them until it chooses them.
      *   *6. Tomatoes:* Legal vs. Botanical vs. Culinary. Different language-games. Authority settles disputes *within* a game (tax law), but doesn't fix meaning *simpliciter*. Supports the idea that meaning is context-bound.
      *   *7. Conclusion & Child:* The theory holds up. It explains the distress (clash of practices) without needing a metaphysical fact. Advice: Words are tools. Sometimes we swap tools. Neither teacher lied; the tool kit changed.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Am I slipping into science communication? *Correction:* Keep focus on "meaning," "rule," "practice," "assertibility." Avoid discussing orbital resonance details unless relevant to the *rule*.
      *   *Check:* Am I being too dogmatic about Kripke? *Correction:* Remember Wittgenstein's own nuance. Kripke presents a sceptical argument; Wittgenstein offers a dissolution. Ensure I distinguish between "no fact of the matter" (sceptical conclusion) and "practice grounds correctness" (solution).
      *   *Check:* The "Community" problem (Question 3) is crucial. Wittgenstein is often criticised for vagueness here. I should admit that. The Pluto case exposes the friction between institutional authority and organic usage.
      *   *Check:* British English spelling/idiom (colour, realise, programme, "reckon", "niggling", etc.).
      *   *Check:* No citations. Just argue.

  6.  **Final Polish:** Ensure the tone is empathetic to the daughter's distress but rigorous on the philosophy. The daughter's distress is actually philosophical gold—it shows she intuitively grasps that meaning *ought* to be stable, and the instability hurts.

      *   *Specific note on Mercury:* The prompt mentions Mercury might not be in hydrostatic equilibrium. I should address this briefly as a case of "quiet exception" which supports the "practice over strict rule" view.
      *   *Specific note on the "Cultural Option":* Why did they reject it? Because the *purpose* of the scientific language-game is prediction and classification utility, not democratic consensus. This fits the "form of life" idea.

  7.  **Final Review against constraints:**
      *   Philosopher of language persona? Yes.
      *   Wittgenstein/Kripkenstein focus? Yes.
      *   British English? Yes.
      *   No citations/reading lists? Yes.
      *   Address all 7 points? Yes.
      *   Honest about theory's limits? Yes.

      *(Self-Correction on "Fact of the Matter"):* Be careful not to say "Pluto's orbit is a fact, but 'planet' isn't." That's obvious. The point is whether the *classification* was a fact. Kripkenstein says classification rules are not fact-stating in the realist sense.

      *(Self-Correction on "Community"):* Wittgenstein doesn't say "majority rules." He says "agreement in judgments." The IAU vote is a formalized agreement. The public's refusal is a lack of agreement. This leads to ambiguity, not falsehood.

      *(Ready to write.)*
answer: |-
  Right, let's sit with this. It is a splendid mess, precisely the sort of thing that keeps the lights on in philosophy departments. Your daughter's distress is actually the most philosophically honest reaction here; she has intuited that if meaning is real, it ought to be stable, and the instability feels like a betrayal. Your brother-in-law's dismissal—that it's just fussiness—is the usual realist shrug, but it misses the point that the fussiness *constitutes* the meaning.

  You want me to wear the Wittgensteinian hat, specifically the Kripkenstein reading. That means we are not looking for the astronomical truth. We are looking at the conditions under which the word "planet" has a use, and what grounds the correctness of that use. We are asking: what makes a move in this language-game valid?

  Here is the analysis, step by step.

  ### 1. Fact of the Matter vs. Practice

  Let's apply the sceptical paradox directly. Before 2006, you had a finite history of the word "planet" being used. It applied to Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, and Pluto. Any child trained in that practice could correctly assert "Pluto is a planet."

  The sceptic asks: what fact about the universe made that assertion true? Was it a fact about Pluto? Pluto didn't change on 24 August 2006. Its orbit was the same on the 23rd as on the 25th. Was it a fact about the word "planet"? If you say the meaning of "planet" is fixed by some abstract definition existing in a platonic heaven, you run into the rule-following problem. How do we know which definition was the real one? The definition "large body orbiting the sun" fits the old nine. The definition "large body orbiting the sun that dominates its orbit" fits the old eight. Both were compatible with all past uses of the word up until the discovery of Eris and the subsequent vote.

  So, was there a fact of the matter? On the Kripkenstein view, no. There is no "super-lattice" of facts against which we check our labels. There is only the practice. Before 2006, the practice of the astronomical community (and the derived practice of the educational community) included Pluto in the extension of "planet". To say "Pluto is a planet" was assertible; it was correct within that form of life.

  When the IAU voted, they did not discover a fact that Pluto *never was* a planet. They instituted a new rule for going on. They changed the conditions of assertibility. So, there was never a mind-independent fact that Pluto was a planet, only a communal agreement that licensed the use of the word. When that agreement shifted, the licence was withdrawn. The change wasn't in Pluto; it was in the rule for the word.

  ### 2. The Old Teacher: Wrong or Obsolete?

  This follows directly. Was your daughter's first teacher lying? No. To lie, one must assert something one knows to be false. But on this view, there was no "false" for her to know. She was trained into a practice. She reproduced that practice. She was playing the language-game as it was being played at that time.

  Is "wrong" the right word? I would say no. "Wrong" suggests a mismatch with reality. "Outdated" or "no longer in accord with current practice" is more precise. She was following a rule that the community subsequently decided to amend.

  Think of it like spelling. If a teacher taught children to write "colour" with a 'u', and then moved to a country that spells it "color", is the teacher wrong? No. They are following different conventions. The pain your daughter feels is the pain of realizing that the conventions she learned—which she thought were laws of nature—are actually just local customs. That is a genuinely traumatic realization for a nine-year-old who wants the world to be solid. But philosophically, the teacher was correct relative to the practice she was participating in. She was guiding the children into the form of life as it then stood.

  ### 3. Who Counts as the Community?

  Here is where the theory creaks, and I must be honest with you. Wittgenstein is notoriously vague about what constitutes "the community." He speaks of "agreement in judgments," but he doesn't give us a algorithm for deciding which community gets to fix the meaning when communities clash.

  In this case, we have at least three: the professional astronomers (specifically the IAU), the planetary scientists (many of whom rejected the vote), and the general public (including schools and children).

  If meaning is use, and the uses diverge, then strictly speaking, the meaning of "planet" has fractured. For the IAU, "planet" means one thing (excludes Pluto). For your daughter's class, "planet" might still mean another (includes Pluto), depending on whether the textbook has been updated and whether the teacher accepts the new rule.

  The theory suggests that there isn't one "true" meaning waiting to be found. There are only different language-games. The IAU claims authority because their language-game is the one designed for technical precision and classification utility. The public's language-game is often cultural and historical.

  So, what makes the IAU the community that counts? Nothing metaphysical. It is purely pragmatic. If you want to publish a paper in *Nature*, you play by IAU rules. If you want to pass a school quiz, you play by the textbook's rules. If the textbook hasn't updated, the school community is currently out of sync with the IAU community. The theory doesn't solve this friction; it diagnoses it. It tells us that we shouldn't expect a single unified meaning across all contexts. The "correctness" is internal to the game. Your daughter is trying to play the school game using rules from the IAU game, or vice versa, and finding they don't match.

  ### 4. Reality and Eris: Does the World Get a Vote?

  This is the strongest objection to the sceptical solution. It looks as though the world forced the change. Eris was discovered. It was like Pluto. If Pluto is a planet, Eris must be. If Eris is a planet, then so are dozens of other Kuiper belt objects. The solar system would become unmanageable. So the world constrained us.

  Does the theory have anything to say here? It must, or it collapses into idealism. Wittgenstein is not an idealist. He acknowledges that reality pushes back. But he distinguishes between the *cause* of a change in practice and the *justification* of it.

  The discovery of Eris is the cause. It made the old rule ("anything round orbiting the sun") pragmatically difficult to maintain. It threatened the utility of the word "planet" for astronomers. If "planet" applies to fifty objects, it loses its classificatory power.

  However, the *choice* of how to respond was not dictated by the world. The world did not say "Adopt the dynamical definition." They could have adopted the structural definition (roundness) and accepted fifty planets. They could have abolished the word "planet" entirely. They chose the dynamical definition.

  So, the theory is not silent. It says: reality constrains the *utility* of our practices, but it does not dictate the *rules*. The "no fact of the matter" claim applies to the classification, not to the existence of the objects. Eris exists. Pluto exists. Their sizes are facts. Whether they fall under the label "planet" is a matter of how we decide to go on. The pressure came from the world; the resolution came from the community.

  ### 5. The Rejected Cultural Option

  You mentioned the IAU considered a "cultural" definition—whatever people agree is a planet—and rejected it. Does this undermine the community solution? After all, if meaning is just what the community does, why didn't they just ask the community?

  This is a crucial distinction. The IAU is a specific community with a specific purpose: scientific classification. Their form of life values predictive power and dynamical clarity over popular sentiment. By rejecting the cultural option, they were not denying that meaning is based on practice; they were deciding *which* practice should govern *their* language-game.

  They effectively said: "In the scientific language-game, we will not let ordinary usage dictate our technical terms." This is common in science. "Work" means something different in physics than in ordinary life. "Force" means something different in law than in mechanics.

  So, it isn't a problem for the theory. It is an example of a community refining its rules to better serve its purposes. They are deciding how to go on. The fact that they had to vote on it shows that the rule wasn't hidden in the word waiting to be found; it had to be constructed.

  ### 6. The Tomato Analogy (Authority vs. Meaning)

  The *Nix v. Hedden* case is a perfect parallel. The Supreme Court ruled tomatoes are vegetables for tax purposes, despite botany calling them fruit.

  Does this show that authority settles meaning, rather than community practice? I would argue it shows that authority is a mechanism *within* a practice. The legal community is a language-game. In that game, the Supreme Court has the move that fixes the rule. In the botanical game, the taxonomists fix the rule. In the culinary game, the chefs fix the rule.

  The analogy helps because it shows that "correctness" is relative to the game. Is a tomato a fruit? Yes, in botany. No, in customs law. Neither is the "real" answer.

  Does this show meaning is just authority? Not quite. It shows that in complex societies, we have sub-communities with the power to legislate usage for specific contexts. The worry you have is that this makes meaning arbitrary. But for Wittgenstein, meaning is never arbitrary; it is woven into a form of life. The legal form of life requires clear tax categories. The botanical form of life requires clear evolutionary categories. The authority is just the tool the community uses to maintain the coherence of its practice.

  So, it doesn't damage the community answer. It reinforces that there are multiple communities, and "meaning" is only stable within the boundaries of a specific game. When the games overlap (like in your daughter's classroom, where science meets general knowledge), friction occurs.

  ### 7. Conclusion: Confirmation, Anomaly, or Silence?

  What does this episode show about the theory?

  It is a confirmation, but a complicated one. It confirms that there is no metaphysical fact of the matter about planetary status. It confirms that meaning is grounded in use and agreement. However, it exposes the difficulty in defining "the community" when practices are hierarchical and fragmented. The theory handles the *nature* of the change well (rule-change rather than fact-discovery), but it struggles to prescribe *which* community's rule should win in a conflict (IAU vs. Public). It remains descriptive, not prescriptive.

  It also shows that the theory is not silent on reality. The discovery of Eris shows that the world imposes friction on our language-games. We cannot just say anything we like; our words must remain useful tools for navigating the world. When the world changes (new discoveries), our tools may need reshaping.

  **What to tell your nine-year-old:**

  You need to validate her feeling that something has shifted, without validating the idea that someone lied.

  Try this:

  "Imagine we're playing a game of cards. For a long time, everyone agreed that the Ace was the highest card. Then, some people decided to change the rules so the King was highest instead. Did the Ace change? No. Was the old rule a lie? No. It was just the old rule.

  "Words are like rules for a game we play together to talk about the world. For a long time, the rule for 'planet' included Pluto. Then, astronomers found new objects like Eris, and they realized the old rule made the game too messy. So they voted to change the rule.

  "Your first teacher wasn't lying. She was teaching you the rules as they were when she learned them. The new teacher is teaching you the new rules. It feels like someone must be wrong because you want the world to be fixed. But sometimes, we just decide to sort things differently to make sense of new discoveries. Neither teacher lied; they just belong to slightly different moments in the game."

  And regarding the Mercury point you raised: If Mercury doesn't quite fit the hydrostatic equilibrium rule but stays a planet, that simply proves the rule isn't a law of nature. It's a guideline we agree to follow, with exceptions we agree to tolerate. That's what a practice looks like. It's messy, human, and adjustable. That's not a failure of science; it's a feature of language.
