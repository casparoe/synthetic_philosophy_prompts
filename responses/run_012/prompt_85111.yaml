answer: |-
  Augustine defines a lie as intentionally signifying something you believe to be false, meaning your words (or any signs) must contradict your own mind, regardless of objective truth or successful deception.

  The apparent contradiction in the "double heart" definition dissolves once you realize Augustine is talking about *subjective* truth (what you hold in your mind) rather than *objective* truth (what matches reality). When you say something objectively true but believe it is false, the "true thought you are sitting on" is the negation of your statement. For example, if it is raining (objective truth) but you believe it is dry, and you say "It is raining," the thought you hold but do not produce is "It is dry" (which you think is true). You still have a "double heart" because your internal conviction ("It is dry") conflicts with your external sign ("It is raining"). The "double thought" is simply the discrepancy between what you believe and what you signal, not necessarily a discrepancy between reality and your words.

  "Opines" is there to close a loophole regarding confidence levels. Augustine distinguishes "believing" (firm conviction without claiming knowledge) from "opining" (thinking you know when you don't), but he treats them identically for the purpose of lying. If you speak against either your firm beliefs or your shaky opinions, you are lying. This ensures you cannot excuse yourself by saying, "I didn't *know* it was false, I just had an opinion," or "I believed it but didn't claim to know." If you utter something contrary to what you hold in your mind—whether that holding is belief or opinion—you are lying.

  Applying this test to your examples:
  *   **The PR Excuse:** This is a lie. Even though your words ("heads down on migration") are objectively true, you are using them as signs to produce a false belief ("I looked at your PR") that you know is false. Augustine says we lie "by signs of whatever kind," and implicature counts as a sign. Since you intend to convey a meaning you believe to be false, you have a "double heart."
  *   **The Joke:** This is not a lie, provided you do not intend to be believed. Augustine notes that the liar's fault is the "desire of deceiving." If you say something false (e.g., "I'm a dragon") but your intent is for the listener to recognize the jest, you do not wish to deceive them about the reality of the statement. If they believe you anyway, you are not a liar; you are just misunderstood.
  *   **The Support Reply:** This is a lie. If you craft technically accurate words specifically because you know they will be misread to imply something false, you are intentionally signifying falsehood. The "thing in your mind" is the false implication you intend them to draw, and you are uttering signs to produce it.

  Ultimately, Augustine's "fault" is the *will* to create that discrepancy. If you say something false but believe it true, you are "erring and rash" but not a liar because your heart is single (your words match your mind). If you say something true but believe it false (or intend it to convey falsehood), your heart is double because your words betray your mind.
