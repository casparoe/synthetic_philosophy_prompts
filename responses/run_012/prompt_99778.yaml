  3. Animals exhibiting white pigmentation on only part of the morphology, such as a single eye or hoof, shall remain liable for the full 'Horse' rate, as the compound designation requires total whiteness.
  4. Where a bay horse is coated in white pigment, the animal shall be classified as 'White Matter on Horse', liable for both duties, since the underlying shape remains unchanged by the colour.
  5. Importers declaring 'White Horses' must therefore provide certification that the animal is not a horse, failing which the shipment will be held as unclassified matter until the shape separates from the colour.
