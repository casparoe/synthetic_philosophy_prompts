      *   *Objection 4 (Medium Damage):* The "Cluelessness" Expert (Metaethicist). You're conflating *ordinal* cluelessness (which action is better) with *cardinal* instability.
      *   *Objection 5 (Low Damage/Turf):* Semantic quibbles about "causal closeness."

