      *   *Proposed Solution:* Causal proximity restriction (ignore far-future/remote effects).
      *   *Vulnerability 1 (Decision Theory):* Arbitrariness. Why causal proximity? Isn't that ad hoc? What about known long-term effects (climate change)?
      *   *Vulnerability 2 (Metaethics):* Abandoning the core insight of consequentialism (maximize the good). If you ignore consequences, are you still a consequentialist?
      *   *Vulnerability 3 (Economics):* Discounting. Economists already handle this with discount rates. Why reinvent the wheel? Is "causal closeness" just a proxy for high discounting?
      *   *Vulnerability 4 (General):* The "Cluelessness" literature (Lenman, Greaves) usually focuses *epistemic* limits. Shifting to *structural* limits is interesting but needs justification.
      *   *Vulnerability 5 (The Killer):* If the tail dominates, why think the "causally close" sum *isn't* also dominated by a sub-tail within that domain?

