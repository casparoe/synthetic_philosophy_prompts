answer: |-
  # COLLOQUIUM PREP SHEET: The Structural Cluelessness Problem
  **Topic:** EV Instability & Causal Restriction in Act-Consequentialism  
  **Audience:** Metaethicists (Majority), Decision Theorists (n=2), Economist (n=1)  
  **Goal:** Defend the claim that cluelessness is a structural/mathematical problem, not an epistemic one, and that "causal proximity" is the necessary truncation device.

  ---

  ## STRATEGY NOTE
  Your thesis challenges the *formalism* of consequentialism, not just its application. The metaethicists care about whether this is still "consequentialism." The decision theorists care about whether your truncation violates rationality axioms. The economist cares about whether this is operationalizable. **Do not get bogged down in defining "causal closeness" too precisely early on;** admit it's a parameter to be fixed, not a bug.

  ---

  ## OBJECTIONS (Ordered by Damage Potential)

  ### 1. The "Self-Defeating Justification" Objection
  *   **Who:** Senior Metaethicist (The "Gotcha" Question)
  *   **Phrasing:** "If the rightness of an action is determined by its consequences, on what grounds do you restrict the set of relevant consequences? If you justify the restriction by saying 'it leads to better outcomes to ignore the tail,' haven't you just smuggled the long-term consequences back in to justify ignoring them? If not, isn't this just deontology wearing a consequentialist hat?"
  *   **Damage:** **Critical.** This attacks the theoretical coherence of the view.
  *   **Your Reply:** "It's a second-order rule. We aren't ignoring the tail because it doesn't matter; we're ignoring it because including it makes the first-order calculus *incoherent*. It's like a court excluding hearsay not because it's false, but because it breaks the trial procedure. The justification is pragmatic coherence, not direct outcome maximization."
  *   **Soft Spot:** You are effectively admitting that *pure* act-consequentialism is untenable. You're moving to rule-consequentialism or a hybrid view.
  *   **Verdict:** **Real Problem.**

  ### 2. The "Arbitrary Truncation" Objection
  *   **Who:** Decision Theorist #1 (Formal Focus)
  *   **Phrasing:** "You argue the EV sum is unstable because of the tail. But if you truncate the probability space based on 'causal distance,' you violate Stochastic Dominance. If Act A has a 0.0001% chance of causing a causal chain that saves 1 billion lives (distant), and Act B does not, your rule says ignore A. But in the full space, A dominates. How is this rational?"
  *   **Damage:** **High.** Attacks the rationality of your proposed decision procedure.
  *   **Your Reply:** "Standard EV maximization breaks down when expectations are undefined or infinitely sensitive to modeling assumptions (the 'Cluelessness' result). When the sum doesn't converge, dominance arguments fail too. We need a prior constraint on the sample space to make *any* calculation possible. Causal proximity is the only non-arbitrary anchor we have."
  *   **Soft Spot:** "Causal proximity" is vague. A butterfly effect is causally close but temporally distant.
  *   **Verdict:** **Real Problem.**

  ### 3. The "Discount Rate" Objection
  *   **Who:** The Economist (Cost-Benefit Analyst)
  *   **Phrasing:** "In CBA, we don't throw out the tail; we discount it. We use a discount rate $r$ to handle uncertainty and time preference. Your 'causal closeness' sounds like a hard cutoff version of a discount function. Why introduce a new, vague metaphysical category when we already have a tractable mathematical tool for this?"
  *   **Damage:** **Medium.** Makes your solution look naive compared to existing tech.
  *   **Your Reply:** "Discounting assumes the sum *converges*. My point is that for certain moral stakes (existential risk, population ethics), the magnitude grows faster than the discount rate shrinks. The tail still dominates. We need a domain restriction, not just a weighting adjustment."
  *   **Soft Spot:** If they press you on *why* magnitude grows faster than discounting in ordinary cases (not just existential risk), you might lose them.
  *   **Verdict:** **Turf Defense.** (They want to use their tools; you need to show their tools fail here).

  ### 4. The "Extensional Adequacy" Objection
  *   **Who:** Metaethicist (Normative Focus)
  *   **Phrasing:** "Does this view deliver the right results? If I know for a fact that a causally distant outcome is catastrophic (e.g., I plant a time-bomb), does your view tell me it's permissible? If your 'causal closeness' rule forbids counting that, your theory is extensionally inadequate."
  *   **Damage:** **Medium.** Standard "counterexample" strategy.
  *   **Your Reply:** "Causal closeness isn't just temporal or spatial; it's about the *chain of dependency*. A time-bomb is a direct causal mechanism I'm initiating now. The restriction is meant to filter *unforeseeable ripple effects* (butterfly effects), not *known long-term mechanisms*."
  *   **Soft Spot:** Distinguishing "ripple effects" from "known mechanisms" is notoriously difficult without appealing to epistemic access (which you said you wanted to avoid).
  *   **Verdict:** **Real Problem.**

  ### 5. The "Cluelessness is Epistemic" Objection
  *   **Who:** Metaethicist (Specialist in Cluelessness Literature)
  *   **Phrasing:** "Lenman and Greaves frame cluelessness as an epistemic problem about *comparative* expected value. You're reframing it as a structural problem about *absolute* expected value. Aren't you just changing the subject? The original problem was that we can't know if A > B, not that the sum of A is unstable."
  *   **Damage:** **Low.** Academic turf war.
  *   **Your Reply:** "They are linked. If the sum is structurally unstable (sensitive to tail modeling), then *comparative* knowledge is impossible. The structural issue is the root cause of the epistemic symptom."
  *   **Soft Spot:** You need to show the math clearly to prove the structural instability exists for *ordinary* actions, not just Pascal's Mugging cases.
  *   **Verdict:** **Turf Defense.**

  ---

  ## CONCESSIONS TO MAKE UP FRONT
  1.  **Concede on "Pure" Consequentialism:** Admit that if "consequentialism" means "maximize *all* causal consequences," your view is not that. Frame it as "Consequentialism for Finite Agents."
  2.  **Concede on Precision:** Acknowledge that "causal closeness" needs a metric (e.g., number of causal nodes, energy decay, etc.) and you don't have the final formula yet. Frame it as a research program, not a finished calculus.
  3.  **Concede to the Economist:** Agree that discounting is useful for *policy*, but insist it fails for *fundamental moral permissibility* in high-stakes/long-tail cases.

  ---

  ## THE ONE QUESTION YOU HOPE NOBODY ASKS
  **"If the Expected Value sum is unstable because of the tail, what guarantees that the Expected Value sum *within your restricted causal domain* isn't *also* dominated by a sub-tail of tiny-probability, enormous-magnitude outcomes inside that domain?"**

  *   **Why it kills you:** It suggests the problem isn't the *scope* of the consequences, but the *nature* of EV maximization itself. If the tail dominates even in the "close" domain (e.g., a 1 in a billion chance your coffee cup contains a nanobot that saves the world), your restriction solves nothing.
  *   **Emergency Reply:** "That's why the restriction isn't just causal, it's also *modal*. We restrict to outcomes grounded in *actual* causal mechanisms, not merely possible ones. But yes, this pushes the problem back to defining 'grounded possibility.'" (Then pivot to Q&A end).

  ---

  ## TONE CHECK
  *   **To Metaethicists:** Be humble about the label "Consequentialism." Focus on *normative guidance*.
  *   **To Decision Theorists:** Be precise about "undefined expectations" vs. "zero value."
  *   **To Economist:** Don't dismiss discounting; frame your view as a *boundary condition* for discounting.

  **Good luck. Keep your answers under 2 minutes.**
