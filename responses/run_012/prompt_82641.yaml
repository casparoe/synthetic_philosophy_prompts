answer: |-
  **Project Title:** The Structural Basis of Prioritarian Immunity to the Levelling-Down Objection

  **Research Question**
  Is the priority view's immunity to the levelling-down objection a substantive moral result, or merely a bookkeeping artefact of its commitment to separability? Furthermore, is there a formulation of the priority view that is non-separable—capable of handling variable populations and relative baselines—without thereby becoming vulnerable to a levelling-down objection of its own?

  This project seeks a determinate answer: either a proof that separability is necessary for immunity (meaning prioritarianism cannot handle non-separable cases without contradiction), or a constructed model of non-separable prioritarianism that survives the objection. Success is defined by mapping the precise trade-off between structural independence and immunity to absurd outcomes.

  **Background and Limitations of Existing Replies**
  The levelling-down objection states that egalitarianism is flawed because it implies it is better (in one respect) to make the better-off worse off even if no one benefits. Prioritarianism avoids this by weighting benefits to the worse off more heavily. However, standard defences of this move leave the structural mechanism unclear.

  1.  **The Person-Affecting Reply:** This argues that levelling down harms someone without benefiting anyone, so it is strictly worse. *What it settles:* It confirms the intuition that levelling down is bad. *What it leaves open:* It does not explain whether this intuition relies on the view that values are fixed independently for each person. If the value of a benefit depends on relations to others, the 'harm' calculation changes.
  2.  **The 'Different Betterness Relation' Reply:** This claims egalitarianism and prioritarianism simply rank outcomes differently. *What it settles:* It distinguishes the two views formally. *What it leaves open:* It treats the difference as a brute fact rather than isolating the variable responsible for immunity. It fails to identify separability as the specific feature blocking the objection.
  3.  **The 'Utilitarianism with a Curve' Reply:** This treats prioritarianism as utilitarianism with a concave transformation function. *What it settles:* It provides a mathematical model for weighting. *What it leaves open:* It assumes the function applies to individual utilities in isolation. It does not test whether the curve holds when utilities are interdependent or when populations vary.

  Consequently, we do not know if prioritarianism solves the problem morally, or if it simply defines the problem away by refusing to compare persons relationally. This project isolates separability as the variable to test.

  **Methodology**
  The project will proceed by case-construction and logical testing rather than literature synthesis. I will construct three specific classes of counterfactual cases designed to stress-test the link between separability and immunity.

  1.  **Variable Population Cases:** Scenarios where the existence of future persons depends on current distribution. Standard prioritarianism struggles here because separability makes it difficult to weigh non-existent persons against existing ones. I will test whether introducing relational value (non-separability) to handle existence triggers the levelling-down objection.
  2.  **Relative Baseline Cases:** Scenarios where being 'worse off' is determined by social standing rather than absolute welfare. If prioritarianism adapts to this (becoming non-separable), does it imply that lowering the top without raising the bottom is valuable because it changes the relative baseline?
  3.  **Incommensurable Benefits Cases:** Scenarios where benefits cannot be compared across persons without a relational metric. I will test if a non-separable weighting function can operate here without implying that equality of status is valuable in itself (which reintroduces levelling down).

  I will test these cases against two candidate formulations:
  *   **Standard Prioritarianism:** Strictly separable, individual-focused weighting.
  *   **Relational Prioritarianism:** A proposed non-separable variant where weighting depends on the distributional context.

  The decision criterion is binary: does the formulation avoid the levelling-down objection in these specific cases? If Standard Prioritarianism avoids the objection but fails the cases, and Relational Prioritarianism passes the cases but succumbs to the objection, the dependency is proven.

  **Outcomes and Failure Conditions**
  A successful outcome produces a formal map showing exactly where prioritarianism loses its immunity. Ideally, I will formulate a non-separable version that retains immunity, proving the view is robust.

  However, there is a clear failure condition. If every attempt to make prioritarianism non-separable immediately reintroduces the levelling-down objection, then the project demonstrates that prioritarianism is structurally incapable of handling variable populations or relative baselines without contradiction. In this scenario, the 'solution' to the levelling-down objection is revealed as a limitation of the theory's scope rather than a moral advantage. This is a negative result, but a determinate one. I will not claim success if the only way to save the view is to weaken the definition of the levelling-down objection itself.

  **Scope and Timeline (Nine Months)**
  This timeline is tight for formal modelling and drafting. To remain realistic, the project will cut historical exegesis of Parfit and Temkin. The focus is strictly on the logical structure of the views, not their intellectual history.

  *   **Months 1–2:** Refine the three case classes. Ensure they are minimal and do not rely on contested empirical assumptions.
  *   **Months 3–5:** Develop the Relational Prioritarianism formulation. Test it against the cases. This is the core philosophical work.
  *   **Month 6:** Draft the paper. Focus on clarity for a general academic audience.
  *   **Month 7:** Internal review and revision.
  *   **Month 8:** Workshop preparation. The workshop will be a working session with colleagues from economics and public policy to test the plain-language clarity of the models.
  *   **Month 9:** Finalise paper and workshop report.

  The deliverable is a single journal-ready paper (approx. 8,000 words) and a half-day workshop. I will not produce a comprehensive survey of all prioritarian literature; the argument stands on the constructed cases. If the modelling proves too complex for a philosophical paper, I will simplify the cases to ensure the logical point remains clear rather than striving for mathematical rigour that obscures the moral argument.
