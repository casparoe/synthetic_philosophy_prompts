      *   *Verdict 5 (Morgue):* This is the stress test. 3 doctors + skeptical panel. If Rule B were active, this *might* tip the scale. He rejected it. This leans heavily toward Rule A. He explicitly says "antecedent improbability... is still too great." This implies the antecedent improbability of a *miracle* is treated as insurmountable.

