      *   **Rule A (Literal Prohibition / A Priori):** No testimony can ever establish a miracle. A miracle is a violation of a law of nature. Laws of nature are established by uniform experience. Therefore, the evidence against the miracle is maximal. Testimony is always fallible. Maximal evidence > Fallible evidence. Verdict: Always Disbelieve Miracles. (Accepts extreme improbability within nature, rejects violation of nature).
      *   **Rule B (Proportional Weighing / Hume's Maxim proper):** Weigh $P(Event)$ against $P(Testimony is False)$. If $P(False) > P(Event)$, Believe. If $P(Event) > P(False)$, Disbelieve. In practice, $P(Event)$ for miracles is so high it usually wins, but theoretically, testimony *could* win if strong enough.

