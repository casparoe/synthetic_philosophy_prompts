          2.  *The Proportional Maxim (True Humean Balance):* Weigh the marvel of the event against the marvel of the testimony being false. If testimony is strong enough, belief is rational.
      *   **Analysis of Past Verdicts:**
          *   Stuntman (Believe) shows he accepts high improbability within nature.
