answer: |-
  Your hypothesis is substantially correct, but it misses one crucial dimension that explains why the stalemate persists despite everyone knowing the stakes. You have correctly identified that this is a **functional dispute** (what does the label *do*?) and an **ontological dispute** (what is the *nature* of the harm?). However, the reason the argument never goes anywhere is that it is also a **constitutive dispute**: the struggle over the definition *is* the mechanism by which international norms are enforced.

  Here is the diagnosis of why the genocide definition debate is a permanent stalemate, broken down by the layers you identified, followed by what actual progress would look like.

  ### 1. The Functional Layer: The "Trigger" Problem
  You are right that the fight is about obligations. Article I of the Genocide Convention states that genocide is a crime "whether committed in time of peace or in time of war," and contracting parties undertake to "prevent and to punish" it. This creates a unique legal hook.

  *   **The Legal Pragmatist's View:** If you broaden the definition (e.g., include political groups or cultural destruction), you lower the threshold for triggering the "duty to prevent." Since states are reluctant to intervene in sovereign affairs (especially militarily), they will simply ignore the obligation if the threshold is too low. The narrowness is a **credibility mechanism**. If the ICC or ICJ cries "genocide" too often, states will tune it out.
      *   *Case in Point:* **Darfur (2004-2005).** The US Commission of Inquiry found crimes against humanity but hesitated on genocide because the *dolus specialis* (specific intent to destroy the group) was hard to prove against the Sudanese government as a whole. When the US *did* call it genocide, nothing happened. This fueled the cynicism that the label is hollow.
  *   **The Moralist's View:** If you keep the definition narrow, you create a **hierarchy of suffering**. Victims of "mere" crimes against humanity are denied the specific recognition and mobilization potential of the G-word.
      *   *Case in Point:* **Rwanda (1994).** The US and UN famously avoided the word "genocide" during the killings specifically to avoid the legal obligation to intervene under the Convention. Here, the narrowness (or rather, the caution in applying it) facilitated inaction.

  **Diagnosis:** This is not a verbal dispute; it is a **sovereignty dispute**. The definition is the border control for humanitarian intervention. One side wants open borders (broad definition, lower threshold for action); the other wants strict visas (narrow definition, high threshold to protect state sovereignty and legal integrity).

  ### 2. The Ontological Layer: Group Rights vs. Individual Rights
  You identified the "groupist" vs. "individualist" tension. This is the philosophical engine driving the legal drafting.

  *   **The Law is Individualist:** Criminal law punishes *individuals*, not groups. To convict someone of genocide, you must prove *their* specific intent to destroy a *collective*. This is cognitively dissonant.
      *   *Case in Point:* **Srebrenica (1995).** The ICJ and ICTY ruled this genocide because the killing of military-aged men was deemed intended to destroy the biological reproduction of the Bosnian Muslim group in that area. Other massacres in Bosnia, equally deadly but without that specific "biological destruction" intent, were ruled Crimes Against Humanity. To the families, the moral harm is identical (mass death); to the law, the ontological harm is different (destroying a group vs. killing people).
  *   **Lemkin's Vision was Collectivist:** Lemkin viewed genocide as the disintegration of a group's institutions, language, and culture. He was thinking sociologically. The 1948 drafters rejected "cultural genocide" because states (including colonial powers and those assimilating minorities) did not want to be criminalized for nation-building policies.
      *   *Case in Point:* **The Holodomor.** Was it genocide? If the group is "Ukrainian nationals," yes. If the group is "kulaks" (a social/class group), the Convention says no. The debate persists because we cannot agree if the harm was the death of individuals or the breaking of Ukrainian national aspirations.

  **Diagnosis:** This is a **substantive moral disagreement** that cannot be drafted away. International law is built on liberal individualism, but genocide is an illiberal, collectivist crime. The friction is permanent.

  ### 3. The Empirical Void
  You noted the lack of evidence regarding enforcement. This is the most critical failure in the discourse.

  *   **The Inflationism Fear:** Legal scholars argue that if "genocide" applies to cultural suppression or political purges, the term loses its "sting." (The "Boy Who Cried Wolf" theory).
  *   **The Mobilization Hope:** Activists argue that the term "genocide" is the only rhetorical tool powerful enough to pierce public apathy. (The "Never Again" theory).

  **Diagnosis:** Neither side has data. We do not know if labeling the Uyghur situation in Xinjiang "genocide" increases the likelihood of effective sanctions or prevention, or if it simply hardens diplomatic lines. We do not know if the ICC's strict adherence to *dolus specialis* deters perpetrators or just makes them smarter about hiding intent. **The debate is stalled because it is operating on theology, not data.**

  ### 4. Why the Contest *Is* the Point
  You asked if this is a category where the contest is the point. **Yes.**

  In domestic law, definitions are settled to ensure due process. In international law, definitions are **normative battlegrounds**. The struggle over whether Armenia (1915) fits the definition (which didn't exist yet) is not a legal inquiry; it is a political struggle over historical memory and reparations. The struggle over whether Ukraine (2022) fits the definition is a struggle over the level of Western military aid.

  If the definition were settled, the political utility of the term would vanish. The ambiguity allows states to perform morality without necessarily committing resources. They can debate the *definition* rather than address the *atrocity*.

  ### What Would Count as Progress?

  Given this diagnosis, "solving" the definition is impossible and perhaps undesirable. Progress requires **decoupling the registers of discourse**. Here is what that looks like:

  **1. Functional Differentiation (The "Three Genocides" Approach)**
  We need to explicitly acknowledge we are using three different words that happen to share a spelling:
  *   **Legal Genocide:** Strict 1948 Convention + ICC/ICJ jurisprudence. High bar for *dolus specialis*. Used *only* for prosecution and state responsibility.
  *   **Sociological Genocide:** Lemkin's broader conception. Includes cultural destruction, forced assimilation, and political groups. Used by historians and sociologists to describe structural harm.
  *   **Political Genocide:** The rhetorical mobilization tool. Used by activists to trigger R2P or sanctions.
  *   *Progress:* When a lawyer says "This isn't genocide," a historian shouldn't hear "This didn't happen," but rather "This doesn't meet the Article II threshold for prosecution." We need to stop letting the legal definition veto the moral description.

  **2. Shift Focus from Labeling to Preventing**
  The obsession with the *label* is a distraction from the *duty*. The Genocide Convention's greatest innovation was the "duty to prevent."
  *   *Progress:* Move the metric of success from "Did we prove genocide?" to "Did we stop the atrocity?" If a situation meets the threshold for Crimes Against Humanity (which is easier to prove and carries similar penalties), the international response should be identical. We need to de-escalate the G-word's monopoly on moral outrage.

  **3. Empirical Research on "Naming and Shaming"**
  *   *Progress:* Fund studies on the efficacy of the label. Does the US designation of genocide in Darfur or against the Uyghurs correlate with measurable policy changes? If the data shows the label triggers backlash without prevention, the "moralist" argument for broadening it weakens. If the data shows strict legalism allows atrocities to continue unchecked, the "legalist" argument weakens.

  **4. Accept the "Gray Zone"**
  *   *Progress:* Acknowledge that **Crimes Against Humanity** can be just as morally heinous as Genocide. The hierarchy of crimes creates a perverse incentive for perpetrators to ensure their intent remains ambiguous (e.g., "we are just killing insurgents, not the ethnic group"). Flattening the moral hierarchy between Genocide and Crimes Against Humanity would reduce the incentive to litigate the definition.

  ### Conclusion
  Your diagnosis is correct: it is a fight about obligations and victimhood status, underpinned by a moral disagreement about group rights. But the reason it never resolves is that **the ambiguity serves a function for the international system.** It allows states to signal concern without committing to intervention, and it allows activists to mobilize without needing proof of intent.

  To move forward, you must stop trying to win the definitional argument. Instead, insist on **clarity of register**. Ask: "Are we talking about a crime for prosecution, a historical pattern, or a call to action?" If the answer is "all three," the argument will never end. If the answer is "we are talking about legal prosecution," then the 1948 narrowness is a feature, not a bug. If the answer is "we are talking about moral horror," then Lemkin's breadth is required.

  The progress lies not in a new definition, but in admitting that the 1948 definition was a political compromise, not a moral truth, and building parallel frameworks that don't rely on it for all moral and political heavy lifting.
