          *   Dismissals: "Physically impossible" (rejected as unprincipled), "Local rules only" (rejected as giving up on axiology).
      *   **User's Hypothesis 1:** Global Axiology vs. Decision Theory (ranking worlds vs. guiding action).
      *   **User's Hypothesis 2:** Summation is a red herring; real clash is Aggregation vs. Constraints (Utilitarianism vs. Deontology/Rights).

  3.  **Initial Assessment & Persona Adoption:**
