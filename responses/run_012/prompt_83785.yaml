prompt: |-
  Ok so this is a weird ask but you're the only person I can ask at this hour. I'm a third-year phil of mind PhD and I've somehow become the philosophy person on a working group at our accessibility office. They've had a run of cases where someone's assistive setup got pulled out from under them — an app the vendor discontinued, a note-taking system the exams office banned, a partner who had been doing all the remembering for years and then moved out — and the office realised they have no way to tell the difference between we've taken away their crutch, annoying but survivable and we've taken away a piece of their mind. One student said something in a meeting about it being closer to a lobotomy than a lost pencil and now nobody can unhear it, so they've asked me to write them an actual procedure.

  What I want from you is a decision procedure for people who are smart but not philosophers, that a caseworker can run in about twenty minutes with the person sitting in front of them and that spits out a one-paragraph rationale they can stick in the file. There's an appeals process and a manager has to sign off, so it has to be something they can be cross-examined on later. Sequence of questions, in order: what to ask, what counts as a good enough answer, where a no ends the process and where it only shifts the burden, and where the procedure has to stop and hand the thing to a human because what's left is a values question rather than a factual one. They also want it as a flowchart in words they can paste into the staff handbook, so keep it literal enough to be pasted.

  Things it has to handle, because these are the ones that actually come up: the aid is owned by someone else and can be switched off by them (a company, a university that won't renew the licence, a spouse who could leave); the aid is another person, i.e. the memory is literally in someone else's head and has been for a decade; the person can no longer tell you whether they endorse the aid, either because of late-stage dementia or because they've used it so long that their testimony is exactly the thing in question; the aid does something its designer never intended and the manufacturer would disown; and two people share one aid (a family calendar, a group home's whiteboard) so pulling it hits both of them. Also, their current draft has two tests I think are both bad — if they say it's part of them, it counts and if they can't function without it, it counts — so either replace those with something better or show me the repaired form of one of them that actually survives the cases above. Please don't just say it depends, the whole point is that they need a decision.

  One more thing: I'd rather this not be the Clark-and-Chalmers checklist with the serial numbers filed off. Their conditions (you always have it, you trust it without checking, you'd consult it without thinking) are a decent start but every hard case above is exactly where they go mushy, and the standard objection — that being coupled to a thing isn't the same as being made of it, otherwise whatever you happen to be plugged into is part of you — needs to get answered rather than ignored. My hunch is that the useful cut is something like: is the aid where the thinking happens, or just where a finished thought gets parked? But I don't know if that survives the dementia case, so if it doesn't, say so and give me something that does.

  Then run it end to end on three cases, and make one of them a case where the procedure says no accommodation is owed — I want to see it bite rather than ratify whatever the sympathetic answer is. And tell me what it can't do, and which steps are judgment dressed up as a test, because the caseworkers will work that out eventually and I'd rather it came from me. Dont worry about citing anything, I know the literature well enough to check you.
