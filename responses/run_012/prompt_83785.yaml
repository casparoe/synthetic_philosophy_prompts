answer: |-
  This is a high-stakes administrative problem disguised as a metaphysical one. The "Coupling-Constitution" objection (just because you use it doesn't mean it's *you*) is the exact weapon an appeals board will use to deny claims. To survive that, your procedure cannot rely solely on *reliability* (Clark & Chalmers); it must rely on **integration** and **redundancy**.

  Your hunch ("thinking vs. parking") is close, but it fails the "Otto's Notebook" test. Otto parks his beliefs in the notebook, but if you burn the notebook, you haven't just taken a tool; you've lobotomized his beliefs. The cut isn't processing vs. storage; it's **Sole Locus vs. Redundant Cache**. If the information or process exists *only* in the aid, and the user has no internal backup, the aid is constitutive. If the aid is a convenient copy of something held internally, it's a tool.

  Below is the **Cognitive Continuity Assessment (CCA)**. It is designed to be read verbatim by a caseworker. It replaces "Do you feel it's part of you?" (too subjective) and "Can you function without it?" (too outcome-based) with questions about workflow integration and redundancy.

  ***

  # The Cognitive Continuity Assessment (CCA)
  **For Internal Use Only – Accessibility Services**

  **Purpose:** To distinguish between the loss of an *Environmental Tool* (Crutch) and the loss of a *Cognitive Component* (Piece of Mind).
  **Time Limit:** 20 Minutes.
  **Outcome:** A one-paragraph Rationale for the student file.

  ### INSTRUCTIONS FOR CASEWORKER
  Ask the following four questions in order. Record the answers.
  *   **STOP RULE:** If the answer to **Q1** is "No," classify as **Environmental Tool**. End procedure.
  *   **BURDEN SHIFT:** If the answer to **Q2** is "No," the burden shifts to the student to prove why a generic substitute will not work.
  *   **HANDOFF:** If **Q4** reveals a conflict between two users (Shared Aid) or a Third-Party Control issue (Spouse/Vendor), flag for Manager Review. The CCA determines the *nature of the loss*, not the *liability of the third party*.

  ---

  ### THE SEQUENCE

  **Q1: The Transparency Test (Phenomenology)**
  *Ask:* "When you use this aid, do you have to consciously decide to access it, or does the information/action feel like it arrives automatically as part of your thought?"
  *   **Yes (Automatic):** The aid is transparent. You don't notice using it; you notice the result. (Proceed to Q2).
  *   **No (Conscious):** You have to stop, query the tool, and interpret the answer like a library search.
  *   **Decision:** If **No**, this is an **Environmental Tool**. The aid is coupled to you, but not constituted in you.
      *   *Rationale:* "The aid requires conscious querying and interpretation, indicating it functions as an external resource rather than an integrated component of the student's cognitive workflow. Loss constitutes inconvenience, not cognitive degradation."

  **Q2: The Redundancy Test (Sole Locus)**
  *Ask:* "If this aid were destroyed right now, does the information or capacity exist anywhere else (in your head, in a backup, or in a generic form), or is this the *only* place it exists?"
  *   **Yes (Sole Locus):** The aid is the only place this memory/process lives. There is no internal backup. (Proceed to Q3).
  *   **No (Redundant Cache):** You could reconstruct it from memory or another source, even if it takes time.
  *   **Decision:** If **No**, this is an **Environmental Tool**.
      *   *Rationale:* "While the aid is trusted, the student retains internal or alternative access to the information/function. The aid serves as a redundant cache rather than the sole locus of the cognitive state."

  **Q3: The Substitution Cost Test (Re-learning vs. Coping)**
  *Ask:* "If we gave you a generic replacement today, would you need to *re-learn how to think* about this task, or just *learn how to use the new tool*?"
  *   **Yes (Re-learning):** The workflow is so specific that a new tool breaks the cognitive routine itself. (Proceed to Q4).
  *   **No (New Tool):** You can transfer the data/process to a new system with standard training.
  *   **Decision:** If **No**, this is an **Environmental Tool**.
      *   *Rationale:* "Functionally equivalent substitutes are available that do not require restructuring the student's cognitive routine. The specific configuration is preferred but not constitutive."

  **Q4: The Agency & Control Check (Third-Party/Shared)**
  *Ask:* "Who controls the 'off switch' (license, access, participation), and does removing it sever a dependency that functions like a biological sense?"
  *   **Scenario A (Vendor/University):** They control the switch.
      *   **Decision:** If Q1-Q3 were "Yes," this is a **Cognitive Component**. The university owes a functional equivalent, not necessarily the specific product.
  *   **Scenario B (Spouse/Partner):** They control the switch.
      *   **Decision:** If Q1-Q3 were "Yes," this is a **Cognitive Component** (Transactive Memory). *Note:* The university cannot compel the partner, but must treat the loss as a medical/cognitive emergency requiring immediate scaffolding replacement.
  *   **Scenario C (Shared Aid):** Removing it harms another user.
      *   **Decision:** **HANDOFF TO MANAGER.** This is a values conflict, not a factual assessment.
      *   *Rationale:* "The aid meets the criteria for a Cognitive Component, but removal impacts competing rights of another user. Requires ethical review."

  ---

  ### THE OUTPUT (Paste into File)

  **If Cognitive Component:**
  > "Assessment confirms the aid functions as a constitutive part of the student's cognitive architecture rather than an environmental tool. Evidence shows the aid is transparent in use (Q1), acts as the sole locus of critical information/process with no internal redundancy (Q2), and substitution would require restructuring the cognitive routine itself rather than simple tool training (Q3). Loss of this aid is treated as a loss of cognitive capacity. Accommodation priority: Immediate provision of functional equivalent."

  **If Environmental Tool:**
  > "Assessment confirms the aid functions as an environmental tool rather than a constitutive part of the student's cognitive architecture. While relied upon, the aid requires conscious querying (Q1) and/or holds redundant information accessible internally or via other means (Q2). Substitution with a generic equivalent is viable without restructuring the cognitive routine (Q3). Loss of this aid is treated as a logistical inconvenience. Accommodation priority: Standard procurement or suggestion of alternatives."

  ***

  # END-TO-END TEST CASES

  ### Case 1: The Discontinued App (The "No" Bite)
  **Scenario:** A student uses a specific, proprietary task-management app ("TaskFlow") to organize their essay deadlines. They have used it for two years. The vendor goes bust; the app stops working. The student claims they cannot write essays without *TaskFlow* and demands the university buy the source code or host a private server.
  **CCA Run:**
  *   **Q1 (Transparency):** *Yes.* They check it automatically without thinking.
  *   **Q2 (Redundancy):** *No.* The deadlines exist in the syllabus; the student *chose* to park them in TaskFlow. They can reconstruct the list from the course docs.
  *   **Q3 (Substitution):** *No.* They can use a spreadsheet or a different app. It requires data entry (annoying), but not re-learning how to plan an essay.
  **Verdict:** **Environmental Tool.**
  **Rationale:** "While the aid is trusted, the student retains access to the raw information (syllabi) and can transfer the planning function to generic tools without restructuring their cognitive routine. The specific app is a preferred cache, not the sole locus of planning capacity."
  *(Note: The procedure bites. The university owes help migrating data, not preserving the specific app.)*

  ### Case 2: The Spouse/Partner (The Hard Case)
  **Scenario:** A student with early-onset memory issues has relied on their spouse for 10 years to manage all appointments, finances, and daily logistics. The spouse moves out. The student is now missing exams and cannot feed themselves. They claim the university must provide a "replacement spouse."
  **CCA Run:**
  *   **Q1 (Transparency):** *Yes.* The student didn't "ask" the spouse; they just knew the spouse would handle it. The memory was distributed.
  *   **Q2 (Redundancy):** *Yes.* The student has no internal backup. The spouse *was* the hippocampus for this data.
  *   **Q3 (Substitution):** *Yes.* A generic planner won't work because the student cannot initiate the planning process. They need an active agent or high-scaffolding system.
  *   **Q4 (Agency):** *Scenario B (Spouse).*
  **Verdict:** **Cognitive Component.**
  **Rationale:** "Assessment confirms the partner functioned as a constitutive part of the student's transactive memory system (Sole Locus). Removal constitutes a loss of cognitive capacity, not just social support. While the university cannot compel the partner's return, it must treat this as a cognitive emergency and provide active scaffolding (e.g., dedicated case manager) equivalent to the lost function."

  ### Case 3: The Exam Ban (The "Yes" Case)
  **Scenario:** A student with aphasia uses a specific, self-devised shorthand symbol system on scratch paper to formulate sentences before writing them. The Exams Office bans it as "unauthorized code." The student says without it, they cannot generate language, only noise.
  **CCA Run:**
  *   **Q1 (Transparency):** *Yes.* The symbols trigger the words automatically.
  *   **Q2 (Redundancy):** *Yes.* The internal language pathway is damaged; the symbols are the *only* bridge to speech.
  *   **Q3 (Substitution):** *Yes.* Standard paper requires them to hold the sentence in working memory, which they cannot do. The *process* of thinking is tied to the *act* of drawing the symbol.
  *   **Q4 (Agency):** *Scenario A (University).*
  **Verdict:** **Cognitive Component.**
  **Rationale:** "The shorthand system is the sole locus of the student's language generation process. Removal breaks the feedback loop of decision-making, not just storage. Banning the aid is functionally equivalent to restricting their capacity to think. Accommodation priority: Exemption from ban."

  ***

  # LIMITATIONS & TRANSPARENCY (For the Handbook)

  *Caseworkers must acknowledge the following limitations when applying the CCA. This section is for staff training, not the student file.*

  **1. Where Judgment is Dressed as a Test**
  *   **Q2 (Redundancy):** Determining if a backup is "robust" or "theoretical" is a judgment call. A student might say "I could reconstruct it," but if it takes 10 hours, it's not a real backup. Caseworkers must probe for *time-cost*, not just *possibility*.
  *   **Q4 (Shared Aid):** The procedure explicitly hands this off. Deciding whether Student A's "Piece of Mind" outweighs Student B's "Right to Quiet" is a values question, not a cognitive one. The CCA identifies the stakes; it does not resolve the conflict.

  **2. The Dementia/Non-Testimony Gap**
  *   If the student cannot answer Q1-Q3 (late-stage dementia), the caseworker must rely on **Behavioral Coherence**.
  *   *Substitute for Q1:* Does the student become disoriented/panic (cognitive loss) or angry/frustrated (tool loss) when the aid is removed?
  *   *Substitute for Q2:* Is there evidence of the student attempting to bypass the aid? (If they never attempt to bypass it, it suggests no internal redundancy exists).

  **3. The "Third-Party Switch" Problem**
  *   The CCA can determine that a spouse or vendor-controlled app is a "Piece of Mind." It **cannot** force a spouse to stay or a vendor to remain solvent.
  *   *Policy Implication:* If the CCA returns "Cognitive Component" but the aid is gone due to third-party action, the university's obligation shifts to **Functional Equivalence**. You do not owe the *specific* aid; you owe the *cognitive capacity* the aid provided. This distinguishes between "Restore the lobotomy" (impossible) and "Treat the injury" (required).

  **4. Why This Isn't Just Clark & Chalmers**
  *   C&C focuses on *trust* and *access*. This procedure adds **Sole Locus** and **Substitution Cost**. A library is trusted and accessible, but it is not your mind because you have a choice to use it and the info is redundant. This procedure filters out the "Coupling-Constitution" false positives by demanding proof that the aid is the *only* place the thinking lives.
