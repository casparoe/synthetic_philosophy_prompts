answer: |-
  Good morning.

  I stand here as a hybrid creature. For ten years, I have worked in newsrooms where "objectivity" is a shield against lawsuits and angry emails. But I have also spent those years reading the work of many of you in this room—the epistemologists—who treat belief as a mathematical commitment to the truth.

  I know the tension in this room. To the journalists: the epistemologists look like they live in a world of clean variables, unaware of the deadline pressure that forces simplification. To the epistemologists: the journalists look like they trade in nuance only when it suits a narrative, unaware that their norms might be structurally irrational.

  I am not here to resolve that tension. I am here to propose that we are arguing past each other because we are using the same word—"accuracy"—to mean two different things. And until we separate them, we cannot fix the broken bridge between public reason and scientific evidence.

  I want to distinguish between **First-Order Accuracy** and **Second-Order Accuracy**.

  First-Order Accuracy is about the world. It asks: Is the proposition true? Did the temperature rise? Does the drug work?
  Second-Order Accuracy is about the evidence. It asks: Does my confidence match the support available? Given what we know *now*, how certain should I be?

  My thesis is this: The professional norm of journalistic "balance" is a demand for First-Order Accuracy that systematically sacrifices Second-Order Accuracy. And if we take accuracy-first epistemology seriously, we must reject balance in favor of evidential calibration.

  Let me show you what this looks like in practice. I want to walk you through a specific editorial meeting I attended three years ago. We were covering the release of a major consensus report on climate sensitivity. The science was clear: the vast majority of models and experts converged on a specific range of warming. The uncertainty was narrow. The consensus was robust.

  But in the newsroom, the assignment editor looked at my draft and said, "It reads like a press release. You need a counterweight. Find someone who disputes the sensitivity range."

  I pushed back. I said, "The evidence doesn't support that dispute. The people disputing this are outside the consensus."
  The editor replied, "We don't know for sure they're wrong. If we print only the consensus and they turn out to be right, we look biased. We look like we took a side. Give them ten percent of the column inches."

  That decision—that specific allocation of space—is where the epistemic error lives.

  Why did the editor demand this? The editor was optimizing for First-Order Accuracy. The fear was this: If the fringe view is actually *true*, and we ignored it, we published a falsehood. We failed to match the way the world is. To protect against the risk of being wrong about the truth, we diluted the report.

  But look at what happened to Second-Order Accuracy. By giving a fringe view ten percent of the space, we signaled to the reader that the *evidence* is split roughly 90-10, or perhaps 80-20. We signaled that the state of knowledge is contested. But the state of knowledge was not contested. The evidence was overwhelmingly one-sided.

  In that moment, the newsroom produced a story that was potentially safe on First-Order grounds—if the fringe was right, we covered them—but was demonstrably false on Second-Order grounds. We lied about the weight of the evidence.

  This is where I need you, the epistemologists, to listen closely. You often model accuracy as a property of an individual mind minimizing distance from the truth. But journalism is not an individual mind. It is a public epistemic engine. It distributes credences to a population that cannot check the raw data themselves.

  When a newsroom demands "balance," it is effectively applying a scoring rule that penalizes false negatives (missing the truth if the fringe is right) much more heavily than it penalizes false positives (misrepresenting the strength of the evidence). You would recognize this as a skewed utility function. It prioritizes avoiding the error of omission over the error of commission.

  But for the public, the cost of that skew is catastrophic. The public does not just need to know what is true; they need to know *how we know*. They need to know where the weight lies. When we prioritize First-Order Accuracy in a context of uncertainty, we create a false equivalence. We tell the public that the evidence is ambiguous when it is not. We degrade their ability to form accurate credences about the *state of science*, even if we technically avoid printing a direct falsehood.

  Now, to my colleagues in journalism: I know why you do this. You are not trying to deceive. You are trying to be humble. You are trying to acknowledge fallibility. You fear the accusation of bias more than the accusation of confusion.

  But humility is not the same as equivocation. True epistemic humility is admitting that your evidence might be incomplete, not pretending that incomplete evidence is equally divided.

  If we accept that Second-Order Accuracy is the primary virtue of science reporting, we must change how we work. We cannot simply say "follow the science," because that is a slogan, not a method. We need a procedural revision.

  Here is my proposal for this workshop to consider: **We must replace the norm of "Balanced Sides" with the norm of "Calibrated Confidence."**

  What does this look like in the newsroom?

  First, it means we stop counting sources and start weighing evidence. We do not give space to a view because it exists; we give space proportional to its evidential support. If ninety-seven percent of the evidence supports proposition A, the architecture of the story must reflect that weight. This might mean we do not quote a denier at all. Or, if we do quote them to illustrate the existence of dissent, we explicitly contextualize that dissent as unsupported by the data.

  Second, it means we report on the *process* of consensus, not just the *outcome*. We explain why the evidence is strong. We explain where the uncertainty lies. We distinguish between "we don't know the exact number" and "we don't know if the phenomenon exists."

  Third, and this is the hardest shift: We must accept that being accurate about the evidence will sometimes look like bias to the public. If the evidence is one-sided, our reporting will be one-sided. That is not political bias; that is epistemic fidelity. We need the vocabulary to defend that. We need to tell our editors and our audience: "We are not taking a side. We are taking a stand on the evidence."

  To the epistemologists in the room: This is where I need your help. You have the tools to formalize this. You talk about scoring rules and proper credences. I am asking you to turn those tools outward. Help us design newsroom norms that function as proper scoring rules for the public.

  Show us how to quantify the cost of false equivalence. Help us build a framework where "balance" is not a moral virtue but an epistemic variable. If accuracy is the goal, then the structure of public discourse must be optimized for it, not for the comfort of the institutions reporting it.

  There is a risk here. If we adopt Second-Order Accuracy as our north star, we become vulnerable. When the consensus shifts—as it sometimes does—we will look like we were wrong. But we will not have been inaccurate *at the time*. We will have accurately reported the state of knowledge as it stood. That is the best any of us can do.

  We are gathered here under the banner of "Accuracy and Public Reason." But public reason cannot function if the information it consumes is calibrated to the wrong frequency. If journalists optimize for the possibility that the fringe is right, and epistemologists optimize for the individual's distance from the truth, the public is left in a vacuum.

  Let us leave this workshop with a new agreement. Let us agree that the most honest thing a journalist can do is not to pretend the world is undecided when the evidence has decided. Let us agree that accuracy is not just about hitting the target, but about correctly describing the aim.

  If we can make that distinction stick, we might just restore the link between what we know and what we report. And that is work worth doing.

  Thank you.
