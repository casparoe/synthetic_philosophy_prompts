      *   *Refinement:* To make it do *argumentative work*, the case needs to show the *cost* of the decision. The decision isn't just "what do we print?" it's "what credence do we signal to the public?"

  4.  **Drafting - Section by Section:**

      *   **Introduction (2 mins):** Acknowledge the tension in the room. Establish the shared goal (Accuracy). Introduce the distinction (First vs. Second Order).
      *   **The Case Study (3 mins):** The newsroom meeting. The Editor's demand for "balance." The Journalist's internal conflict.
      *   **The Analysis (3 mins):** Apply the distinction. Show how "balance" seeks First-Order Accuracy (don't be wrong if the fringe is right) but fails Second-Order Accuracy (misrepresenting the weight of evidence). Explain why Second-Order is the proper norm for journalism.
      *   **The Proposal (2 mins):** Concrete revision to practice. "Evidential Calibration."
      *   **Conclusion (1 min):** Call to collaboration.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is this just saying "trust the science"?
      *   *Fix:* No, it's about the *structure of the report*. It's about how we assign probability in the text.
      *   *Critique:* Will epistemologists find this trivial?
      *   *Fix:* I need to frame the journalistic norm of "balance" as a specific *scoring rule* that is improperly applied. I need to show them that public reason has its own epistemic utility function that is currently miscalibrated.
      *   *Critique:* Will journalists feel attacked?
      *   *Fix:* Acknowledge the pressure they face (libel, accusations of bias). Validate their instinct to be fair, but reframe fairness as accuracy.
      *   *Constraint Check:* Do not lecture on scoring rules. *Action:* Use the *logic* of scoring rules (penalizing error) without the math. Talk about "penalties" for being wrong vs. "penalties" for being misleading.

  6.  **Developing the "Something New" for Epistemologists:**
      *   Epistemologists usually think of accuracy as an individual cognitive virtue.
      *   I need to argue that *institutional norms* function as distributed cognitive systems. The newsroom is a belief-forming mechanism. If the mechanism optimizes for the wrong kind of accuracy, the public's credences become malformed. This shifts accuracy-first epistemology from the individual mind to the social institution.

  7.  **Drafting the Content (Iterative Process):**
      *   *Opening:* Welcome both camps. Acknowledge the suspicion.
      *   *The Distinction:* Define First vs. Second Order clearly.
      *   *The Story:* The Tuesday morning editorial meeting. The IPCC report. The "contrarian" source.
      *   *The Pivot:* Why do we invite the contrarian? To avoid being wrong if they turn out to be right (First-Order). But in doing so, we lie about the evidence (Second-Order).
      *   *The Epistemic Claim:* Journalism is not a truth-machine; it's an evidence-weighing machine.
      *   *The Proposal:* Stop "balancing" claims. Start "calibrating" confidence.
      *   *Closing:* We need each other.

  8.  **Polishing for Voice:**
      *   Needs to sound spoken. Rhythm, pauses, direct address.
      *   Avoid jargon where possible, but use the specific terms defined (First/Second-Order).
