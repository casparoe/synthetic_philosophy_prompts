answer: |-
  The structural bias of Whig history translates cleanly as a topological error and a sampling artifact, but its normative claim of progress fails to map onto any measurable scalar in your framework.

  In your vocabulary, the Whig interpretation commits a categorical error by treating a ramifying phylogeny as a graded series. It roots the tree on the extant terminal taxon and interprets internal nodes not as reconstructed ancestral states optimized via likelihood or parsimony, but as necessary precursors optimized for the present condition. This is the ladder move on a tree (Resource 1). It assumes the extant lineage is the trunk and all extinct sister taxa are sideshows. For this designation to be more than a viewpoint choice, one must assume the extant state is the global optimum toward which the system was driven. The historical record cannot supply this assumption; it supplies only topology and branch lengths, not a fitness landscape defined on intellectual or moral states. The Whig historian treats survival as evidence of superiority, conflating persistence with adaptation.

  The principal objection translates as a critique of inference rules. You employ uniformitarianism to infer past process from present mechanism, anchoring reconstruction in the present without making it a terminus (Resource 2). The Whig historian violates this by treating the present state as a teleological attractor. They confuse epistemic privilege (we know the outcome) with ontological privilege (the outcome was destined). This is not an inference rule but a claim about trajectory directionality. The distinction can be drawn sharply only if one separates the probability of the observed path given the model from the probability of the model given the observed path. Whig history collapses these, treating the single realized history as the only probable history.

  Decomposing the progress claim reveals the structural weakness (Resource 3). A Whig narrative posits a state space of historical configurations and a scalar (e.g., "reason," "liberty," "complexity") defined on it. It claims this scalar is monotone along the actual trajectory leading to the present and asserts a reason to prefer higher values. The Whig historian supplies the scalar and the preference; the record supplies only the trajectory. The critic objects that the scalar is undefined or orthogonal to survival. The record alone cannot supply the scalar because history lacks a replicate ensemble to estimate the variance of the trait independent of the lineage. Without a defined metric, the claim of monotonicity is unfalsifiable.

  Regarding trends, the Whig pattern is indistinguishable from a passive trend generated by a random walk confined by a reflecting boundary (Resource 4). Sampled at the end, any surviving lineage looks directional. If the process is unreplicated, asking whether the pattern is a property of the process or an artifact of sampling is ill-posed; you have one realization. However, if you treat extinct lineages as samples from the same distribution, you can test for directionality. Whig history ignores the extinct sample, creating a survivorship bias that mimics a driven trend. The appearance of progress is an artifact of where the sampling stops (the present), not evidence of a driver.

  Finally, contingency and convergence address the replay experiment (Resource 5). If the sequence recurs on independent runs, evidence supports constraint or direction; if not, the appearance of progress is one draw from a distribution. The Whig reading needs convergence to claim necessity. The evidence available to historians cannot support this because the history is single-sample. You cannot rerun the French Revolution. The Whig reading assumes convergence where only contingency is testable. It treats the actualized topology as the expected topology.

  **Residue Report**

  **Translates Cleanly:**
  *   **Survivorship Bias:** The Whig focus on winners maps exactly to sampling only extant terminals while pruning extinct sisters.
  *   **Topological Error:** The ladder vs. tree distinction is isomorphic to graded series vs. cladogenesis.
  *   **Sampling Artifact:** The "directionality" of history translates precisely to a passive trend induced by a lower boundary (extinction) and sampling at the maximum time slice.

  **Translates with Distortion:**
  *   **Heroes and Obstacles:** This maps to "adapted" vs. "maladapted," but distorts agency. In phylogenetics, extinction is often stochastic or ecological, not a failure of "quality." The moral valence of "obstacle" implies intent or normative failure absent in selective filters.
  *   **Inference Rules:** Uniformitarianism in paleobiology assumes physical laws are constant; Whig uniformitarianism assumes *values* are constant. The latter is a category error, not just a methodological risk.

  **No Counterpart:**
  *   **The Scalar:** Your framework requires a defined character state. Whig history relies on scalars like "freedom" or "truth" that lack operational definitions comparable to morphological characters. There is no homology assessment for ideas in Whig history.
  *   **Normative Preference:** The commitment to prefer higher values of the scalar (Resource 3) has no counterpart. Survival is not a preference in your framework; it is a binary outcome. Whig history asserts the outcome *should* have happened, not just that it *did*.

  **Verdict on the Residue**

  Your guess is partially correct but misses the topological core. The evaluative element (progress as a standard) indeed falls out of translation because your framework is descriptive, not normative. However, the real failure lies in the original claim's clarity. The Whig historian posits a scalar without defining its state space or measuring its variance. This is not a defect of your framework, which cannot express nonsense; it is a sign that the original claim was less clear than it looked. It masks a topological error (tree vs. ladder) and a sampling error (survivorship) behind a normative veil. The residue is not something your vocabulary cannot express; it is something science cannot measure. The Whig claim is not a hypothesis awaiting translation; it is a narrative artifact generated by sampling a single terminal taxon on a branching tree.
