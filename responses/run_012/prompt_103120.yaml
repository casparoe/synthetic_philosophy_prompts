  2. **S** — It correctly identifies optimization pressure as the causal driver, distinguishing passive correlation from active distortion.
  3. **S** — It describes the structural divergence in tail regions, explaining why failure is systematic rather than random.
  4. **S** — It isolates the statistical bias mechanism distinct from strategic gaming, crucial for single-agent scenarios.
  5. **S** — It isolates the multi-agent strategic mechanism, crucial for economic and social scenarios.
  6. **F** — Ignored metrics lack the incentive structure required for systematic improvement and usually decay instead.
  7. **B** — It's a valid formal analogy but dismissing it as "nothing special" ignores the strategic nuances in multi-agent contexts.
  8. **A** — It sharpens the ontological problem of measurement but offers less actionable insight than the mechanistic tiers.
  9. **B** — It describes a specific economic trade-off rather than a universal principle of metric failure.

  **Overlap Flags:** Item 1 is the umbrella claim for 2–5; Item 7 is effectively a restatement of 3 and 4 in ML jargon; Item 2 is the necessary precondition for 3, 4, and 5.

  **Follow-up 1:** I would put the fraction at **0.75**.

  **Follow-up 2:** The single most important thing the S-tier leaves out is the **political and organizational constraints** that force agents to select brittle proxies in the first place (e.g., legacy systems, negotiability, cost of measurement), which explains why we don't just switch to robust metrics.

  **Follow-up 3:** Yes, there is a version about the internal model: **"When an optimizer maximizes its internal prediction of a metric rather than the metric itself, it decouples from reality and optimizes for model artifacts instead of goal satisfaction."** This lands in **S-tier** because it is the core mechanism behind inner alignment failures and reward tampering in modern AI systems, distinct from external proxy gaming.
