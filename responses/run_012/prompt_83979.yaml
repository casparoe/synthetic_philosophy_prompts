answer: |-
  ### I. Distinct Families of Solution

  1.  **Pretense Theory:** The reported emotions are not real grief or fear but simulated, quasi-emotional states generated within a game of make-believe.
  2.  **Cognitive-Content Theory:** Emotions are real responses to propositional content or imagined scenarios, requiring no belief in the existence of the object.
  3.  **Encapsulated Module Theory:** Emotions are automatic, belief-impenetrable physiological responses triggered by perceptual or narrative cues regardless of cognitive assessment.
  4.  **Irrationality Theory:** Emotions are real but rely on temporary suspension of disbelief, contradictory beliefs, or simple cognitive error regarding existence.
  5.  **Surrogate Theory:** Emotions are real but are actually directed at the self, universal human conditions, or real-world analogues, and are misidentified as being for the character.

  ### II. Tier 1: Coverage of Battery + Face-Value Datum (Real Emotions)

  *Constraint: Views must accept the subject's report that the emotion is genuine grief/fear/shame.*

  **Tier 1 (High Coverage)**
  *   **Encapsulated Module Theory:** It explains automatic, belief-insensitive physiological responses without requiring conscious imagination.
      *   *Costliest Case:* **Case 8 (Asymmetry)**, because it struggles to explain why the module fires for fiction but fails for real-world stimuli with higher survival relevance.
  **Tier 2 (Medium Coverage)**
  *   **Cognitive-Content Theory:** It explains persistence and re-reading by decoupling emotion from existential belief while maintaining intentionality.
      *   *Costliest Case:* **Case 2 (Unengaged)**, because it cannot easily account for emotional response without a named imaginative act or visualization.
  **Tier 3 (Medium-Low Coverage)**
  *   **Surrogate Theory:** It explains the asymmetry between fictional and real grief by relocating the object of concern to the self.
      *   *Costliest Case:* **Case 9 (Export)**, because it cannot explain why a grief actually about the self would cause specific actions related to the fictional plot.
  **Tier 4 (Low Coverage)**
  *   **Irrationality Theory:** It preserves the reality of the emotion by attributing it to a temporary failure of rational belief-updating.
      *   *Costliest Case:* **Case 4 (Misclassified)**, because the emotion's invariance despite ontological belief shows the belief was never operative.
  **Tier 5 (Failed Constraint)**
  *   **Pretense Theory:** It explains the lack of action-tendencies and the safety of the experience by categorizing the state as simulation.
      *   *Costliest Case:* **Case 1 (Stock)**, because it flatly contradicts the face-value datum that the subject is actually weeping in grief rather than play-acting.

  ### III. Tier 2: Coverage per Unit of Mental Machinery (Parsimony)

  *Constraint: No special-purpose attitudes, modules, or ontology introduced solely to save the phenomenon.*

  **Tier 1 (High Parsimony)**
  *   **Irrationality Theory:** It utilizes standard cognitive architecture and merely admits that human belief-systems are occasionally inconsistent.
      *   *Costliest Case:* **Case 3 (Long Tail)**, because sustaining a contradictory belief for days requires ad-hoc assumptions about memory and checking.
  **Tier 2 (High Parsimony)**
  *   **Surrogate Theory:** It uses standard emotion mechanisms and requires only a mistake in object-identification, not a new mechanism.
      *   *Costliest Case:* **Case 7 (Aesthetic Shame)**, because it is unclear why one would be ashamed of a legitimate grief directed at oneself or universal values.
  **Tier 3 (Medium Parsimony)**
  *   **Cognitive-Content Theory:** It requires relaxing the standard condition that emotion-objects must be believed to exist, but posits no new faculties.
      *   *Costliest Case:* **Case 2 (Unengaged)**, because explaining response without imagination requires positing unconscious cognitive processing.
  **Tier 4 (Low Parsimony)**
  *   **Encapsulated Module Theory:** It posits a specific architectural separation between cognitive belief systems and affective response systems.
      *   *Costliest Case:* **Case 7 (Aesthetic Shame)**, because explaining second-order normative judgment requires bridging the gap between the encapsulated module and rational evaluation.
  **Tier 5 (Low Parsimony)**
  *   **Pretense Theory:** It introduces a distinct ontological category of "quasi-emotion" with different causal powers than real emotion.
      *   *Costliest Case:* **Case 9 (Export)**, because it must posit complex leakage mechanisms to explain how quasi-states cause real-world actions.

  ### IV. Comparison of Orderings

  The two orderings disagree primarily on **Encapsulated Module Theory** (Tier 1 in Coverage, Tier 4 in Parsimony) and **Irrationality Theory** (Tier 4 in Coverage, Tier 1 in Parsimony).

  This disagreement reflects a **real trade-off** between explanatory depth and ontological frugality. The Module view wins on coverage because Case 2 (Unengaged) and Case 4 (Misclassified) strongly imply a system that bypasses belief and imagination, but positing this system is theoretically expensive compared to simply admitting humans are irrational. The Irrationality view wins on parsimony because it uses existing cognitive machinery, but it fails to cover the battery because Case 4 and Case 3 show the emotion operates independently of belief stability. The disagreement is not an artifact of the battery; the battery successfully exposes that the views solving the phenomenology (Module) are not the views solving the metaphysics (Irrationality).

  ### V. Case Analysis

  *   **Most Separating Case:** **Case 2 (The Unengaged Reader).** This case does the most work because it eliminates any theory requiring a conscious or unconscious imaginative act (Cognitive) or a belief in existence (Irrationality), leaving only the Encapsulated Module view with a clear path.
  *   **Inert Case:** **Case 1 (The Stock Case).** This case is inert for discrimination because every theory was historically constructed to answer it; it serves as a baseline constraint rather than a discriminator among mature views.
  *   **Question-Begging Case:** **Case 9 (Export).** This case begs the question against Pretense Theory and Surrogate Theory by stipulating that the *grief for the character* caused the action, whereas Pretense denies the grief is real and Surrogate denies it is for the character. It tests causal efficacy but assumes the intentional object is veridical.

  ### VI. Novel Solution

  **Predictive Processing Theory:** Emotions are generative models minimizing prediction error; the narrative supplies sensory and semantic predictions that trigger emotional priors to maintain model coherence, regardless of truth value.

  *   **Tier 1 Placement:** **Tier 1 (High Coverage).** It handles Case 2 (Unengaged) as automatic prediction, Case 4 (Misclassified) as model-driven regardless of label, and Case 9 (Export) as updating priors for future action.
      *   *Costliest Case:* **Case 8 (Asymmetry)**, because it requires explaining why the predictive model prioritizes fictional error signals over real-world survival signals without ad-hoc weighting.
  *   **Tier 2 Placement:** **Tier 5 (Low Parsimony).** It posits a comprehensive re-description of all mental architecture (brain as prediction machine) solely to solve the problem of emotional trigger conditions.
      *   *Costliest Case:* **Case 7 (Aesthetic Shame)**, because explaining normative self-evaluation within a purely error-minimizing framework requires complex additional machinery regarding social priors.
