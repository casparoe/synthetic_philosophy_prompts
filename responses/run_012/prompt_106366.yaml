  Ok so this is a bit of a weird one but it's been bugging me for a week. My flatmate Marcus had his friend Dana over and somehow at like 1am we ended up on the hitchhiker thing — the desert one, where you're stranded and a driver says he'll take you to town if you pay him once you get there, and the whole question is whether you pay once you're safe. I'm pretty sure it's Parfit's example, out of that big ethics book, the one where he says self-interest kind of eats itself, or "rational irrationality" or something like that, but honestly I'd never heard of it before and the other two had, so mostly I just listened and now I can't work out who was winning. Marcus went first: obviously you don't pay, he said, because once you're in town paying costs you and buys you nothing, so any self-interested person takes the ride and stiffs him — but the driver knows that, so he never picks you up, so pure self-interest is self-defeating, and the fix is to actually become the sort of person who pays, not to fake it. Dana pushed back twice. First, she said you can't just choose your dispositions like that; a disposition is basically a prediction of what you'll do, and what you'll do when it's time to pay is not pay, because by then it's the exact same calculation all over again. Second, she said even granting you could, it's circular: the only reason to pay is to get the ride, and the ride already happened, so "be a payer" just means "so drivers will trust you," and the driver only trusts you because you'd actually pay, which you wouldn't. House of cards, she said.

  Marcus came back that people really are like that — you become the sort who keeps his word by keeping his word, by wanting to be that guy, and it sticks; that's not a choice so much as a character, and the case just shows that if you're not that guy you get left in the desert. Dana said that proves her point: notice you just made it depend on wanting to keep your word for its own sake, so now it's a story about the value of promises, not about self-interest at all, you've smuggled in a moral reason and called it rational. And she added a second thing — it over-generates. If being the paying type is rational because it gets you rides, why not be the type who pays double, or triple, whatever the driver asks? Drivers would love that type even more. You can't say "pay what you promised" without already assuming promises matter. Marcus said there's a limit, because the disposition has to be one a person can actually have and hold onto — nobody is really the guy who pays whatever's demanded, but plenty of people are the guy who keeps a fair deal, so the content gets pinned down by what's psychologically real rather than by whatever maximises rides. Then he threw in something a friend had told him about, called resolute choice or something, where you don't need a special character at all — you just decide up front that you're paying and then refuse to reopen the question later, treat your own earlier decision as binding on you. Dana said that's the same relabeling trick again, since you can only refuse to reopen it if you'll actually refuse, and if you're the type who reopens things when it gets cheaper not to, you will. Marcus said no, the resolute person isn't refusing to think, she genuinely cares about sticking to her own plan, so the plan really does bind her, and it's a third option between "you won't pay" and "you're a certain type of person." Dana said then she cares about it for its own sake too, same move, same over-generation problem. They both seemed to think they'd won and I genuinely couldnt tell.

  Can you go through the whole exchange and tell me who's right at each step, not just who wins overall? I'd like a rating for each move from clearly wrong to clearly right, with a short reason for each. And then the two bigger things: is there actually a real third option here like Marcus thinks, or does Dana's relabeling charge land every single time? And is her over-generation objection fatal, or does Marcus's "it has to be a disposition people can really have" answer save him? Also tell me what I think both of them are missing — like whether this is even a question about rationality versus a question about morality, or whether the driver being able to "just tell" what type you are is doing more work than either of them noticed. Please just write it out as continuous prose, no headings, no bullet points, no bold, no tables — like you're explaining it to me in a long email, since I read better that way.
