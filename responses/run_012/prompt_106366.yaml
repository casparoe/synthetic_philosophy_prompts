answer: |-
  Hi there,

  It is completely understandable that this conversation kept you up at night, because you have stumbled onto one of the most famous and contentious problems in modern moral philosophy and decision theory. What you heard was a vernacular version of a debate that has occupied philosophers since Derek Parfit published Reasons and Persons in 1984, and it touches on the very definition of rationality. Since you asked for a breakdown of who was right at each step followed by the bigger picture, I will walk through the exchange exactly as it happened, rating the strength of each argument as we go, and then tackle the deeper theoretical questions you raised.

  Starting with Marcus's opening move, where he claims that pure self-interest is self-defeating because the driver won't pick up a non-payer, I would rate this as clearly right. This is the central insight of Parfit's Hitchhiker example. If you define rationality strictly as maximizing your own welfare at every single moment of choice (what philosophers call Causal Decision Theory), then once you are in town, paying the driver costs you money and gains you nothing, so a rational agent would not pay. However, because the driver can anticipate this, the driver never offers the ride, and you die in the desert. Marcus is correct that this specific definition of self-interest leads to a worse outcome for the agent, making it self-defeating.

  Dana's first pushback, where she argues you cannot simply choose a disposition like a switch and that the calculation at the moment of payment remains the same, is partially right but ultimately too narrow. She is right that you cannot magically change your preferences at the exact second you arrive in town if you are a standard rational agent; the incentives haven't changed. However, she is slightly wrong to suggest dispositions are merely predictions that cannot be cultivated. People do build character over time, and what you are disposed to do is not always identical to what gives you the most utility in a single isolated moment. Still, her point highlights the tension between acting rationally now versus having been rational in the past.

  When Dana argues that the reasoning is circular because the ride has already happened, I would rate this as a strong point. She is identifying the problem of time-inconsistency. If the only reason to pay is to get the ride, and you already have the ride, the reason evaporates. This is the hardest hurdle for Marcus to clear. If rationality is purely instrumental about achieving goals, and the goal (survival) is achieved, the instrument (payment) becomes irrational. Marcus cannot easily escape this without changing the definition of rationality.

  Marcus's counter, that people really are the sort who keep their word and that this is about character rather than a conscious choice in the moment, is largely right in a practical sense but shifts the goalposts theoretically. He is moving from Causal Decision Theory to something closer to Evidential Decision Theory or Dispositionalism. In this view, being rational means having the dispositions that lead to the best outcomes overall, not necessarily making the utility-maximizing move at every specific instant. Philosophically, this is a defensible position, but it requires accepting that rationality applies to your whole life and character, not just individual acts.

  Dana's accusation that Marcus is smuggling in a moral reason by valuing promise-keeping for its own sake is very strong, perhaps the strongest move she makes. If the only reason to pay is that you value keeping promises intrinsically, then you are no longer acting out of self-interest; you are acting out of morality. You have solved the problem by ceasing to be a purely self-interested agent. This cuts to the core of Parfit's own conclusion, which was that rationality and morality might converge, but it validates Dana's claim that Marcus is no longer talking about pure self-interest.

  Marcus's response about psychological realism, where he says you cannot be the type who pays double but can be the type who keeps fair deals, is a good pragmatic defense. It prevents the slippery slope Dana is worried about. Humans have limited capacities for commitment, and social norms usually dictate fairness rather than infinite generosity. I would rate this as mostly right because it grounds the theory in human psychology, though it concedes that rationality is constrained by what humans can psychologically sustain rather than pure logic.

  When Marcus introduces resolute choice, suggesting you can bind yourself to a prior decision without needing a special character trait, he is invoking a specific philosophical theory developed by Edward McClennen. I would rate this as theoretically innovative but controversial. It challenges the standard view that rational agents must re-evaluate choices at every step. Dana's rebuttal, that this is just relabeling because you must be the type of person who respects resolute choice, is logically tight. If you only respect your prior plan because it benefits you, you will abandon it when it stops benefiting you. To stick to it, you must value sticking to it for its own sake. I would rate Dana's counter here as clearly right within the standard framework of decision theory.

  Now, to address your first bigger question about whether there is a real third option like Marcus thinks, or if Dana's relabeling charge always lands. The truth is somewhere in the middle, but Dana is technically more correct within standard economics. Resolute choice is only a viable third option if you accept that rationality requires dynamic consistency, meaning you should not change your plan just because time has passed. If you accept that requirement, Marcus is right that you can bind yourself. However, Dana is right that this requires a preference for consistency itself. If you are a purely consequentialist agent who only cares about outcomes, you will always reopen the question when it benefits you. So, resolute choice works, but only if you value resoluteness as a good in itself, which brings us back to Dana's point that this is no longer pure self-interest.

  Regarding your second question about the over-generation objection and whether Marcus's psychological limit saves him, Dana's objection is logically fatal to pure instrumentalism, but Marcus's psychological limit saves the theory as a description of human beings. If the only rule is "have the disposition that gets you the most rides," then logically you should have the disposition to pay a million dollars if that's what it takes to get picked up. Pure instrumentalism cannot set a limit on how much you should pay. Marcus saves himself by appealing to what humans are actually capable of, but in doing so, he admits that rationality is not just about maximizing outcomes; it is about navigating human psychological constraints. So, Dana wins on logic, but Marcus wins on practicality.

  Finally, here is what I think both of them are missing, which might help you make sense of why they talked past each other. First, they are unknowingly arguing about different definitions of decision theory. Marcus is arguing for Evidential Decision Theory, where your choice provides evidence about what kind of person you are, which influences the driver's choice. Dana is arguing for Causal Decision Theory, where your choice only matters if it physically causes an outcome. Since the payment happens after the ride, causally it cannot affect whether you get picked up. They need to agree on which framework they are using before they can decide who is right.

  Second, they are underestimating the role of the driver's ability to detect your type. The whole problem collapses if the driver cannot reliably tell whether you are a payer or a non-payer. If the driver cannot read your disposition, then pretending to be a payer works just as well as being one, and the whole debate about character becomes irrelevant. The example only works if the driver has something like a lie detector or deep psychological insight, which makes it a special case rather than a general rule for rationality.

  Third, and perhaps most importantly, they are treating rationality and morality as opposites when Parfit's ultimate point was that they are not. Parfit argued that if we define rationality correctly, it turns out that being moral is the most rational thing to do in the long run. Marcus is trying to show this but keeps getting trapped by the definition of self-interest. Dana is right that if you stick to a narrow definition of self-interest, morality looks irrational. But they are both missing the possibility that the definition of self-interest is what needs to change. If you value your integrity or your identity as a promise-keeper, then paying is self-interested because it maintains that identity. They are fighting over whether that value counts as self-interest or morality, when Parfit would say the distinction is less important than the fact that both lead to paying the driver.

  I hope this helps untangle the week of buzzing in your head. It is a rare thing to hear such a high-level philosophical debate happen over drinks, and while neither of them landed a knockout punch, they both managed to articulate positions that professional philosophers still argue over today. Marcus is right that you end up better off if you are the kind of person who pays, but Dana is right that explaining why that is rational without secretly relying on moral values is incredibly difficult.

  Best wishes
