      *   **Tone:** Technical, precise, respectful of both fields, avoiding condescension or oversimplification. No "improving" the translation.

  2.  **Part 1: Translation (AFE $\to$ Forecast Evaluation)**
      *   *Credence Function* $\to$ *Forecast Rule / Probabilistic Predictor*. (Approximation: Credences are often treated as static states, forecasts as actions, but in AFE they are evaluated like actions).
      *   *Worlds* $\to$ *States of Nature / Realizations*. (Approximation: "Worlds" are often logically possible, states of nature are usually empirically possible).
      *   *Scoring Rule* $\to$ *Loss Function*. (Note: AFE maximizes accuracy, FE minimizes loss. Need to flip signs carefully. $Accuracy = -Loss$).
      *   *Closeness to Truth* $\to$ *Minimizing Expected Loss*.
      *   *Probability Axioms (Probabilism)* $\to$ *Coherence / Admissibility*. (Specifically: avoiding dominance).
      *   *Accuracy-Dominance* $\to$ *Statewise Dominance*. (Crucial distinction: AFE uses statewise, FE often uses risk/admissibility).
      *   *Expected Accuracy* $\to$ *Bayes Risk* (relative to a prior).
      *   *Conditionalization* $\to$ *Bayes Update Rule*.
      *   *Epistemic Good* $\to$ *Objective Function*.

      *Drafting the Translation:*
      "Epistemic rationality is equivalent to minimizing a specific loss function $L(\omega, f)$, where $f$ is the forecast vector and $\omega$ is the realized state. The fundamental norm is: do not adopt a forecast rule $f$ if there exists an alternative $f'$ such that $L(\omega, f') \leq L(\omega, f)$ for all $\omega \in \Omega$ and strict for some. This is statewise dominance. Probabilism corresponds to the set of forecasts not statewise-dominated under any strictly proper loss. Diachronic rationality (Conditionalization) corresponds to the update rule that minimizes expected loss (Bayes risk) relative to a prior distribution over $\Omega$."

  3.  **Part 2: Residue Report (The "Failures of Translation")**
      *   *Uniqueness of Accuracy:* In FE, loss is task-dependent (economic cost, etc.). In AFE, accuracy is *the* goal.
          *   *Distortion:* FE treats loss as exogenous/contextual. AFE treats it as endogenous/constitutive of belief.
      *   *Single World vs. Sampling:* FE usually assumes a data generating process (DGP), repeated trials, or at least a known distribution for risk. AFE evaluates at a *single* world (statewise).
          *   *Distortion:* AFE relies on statewise dominance (stronger than admissibility in risk). FE usually cares about performance over the distribution (Bayes risk or frequentist risk).
      *   *Calibration/Sharpness:* FE decomposes score = calibration + sharpness + uncertainty. AFE collapses this into "Accuracy".
          *   *Distortion:* AFE implies calibration is derivative of accuracy (via propriety). FE sees them as distinct diagnostic dimensions.
      *   *Choice of Scoring Rule:* FE chooses based on sensitivity/outliers/application. AFE argues *all* strictly proper rules yield the same normative constraints (Joyce's non-pragmatic representation theorem).
          *   *Distortion:* FE sees rule choice as modeling. AFE sees it as irrelevant for norms (as long as proper).

  4.  **Part 3: Testing the Hunch (Dominance = Admissibility?)**
      *   *Hunch:* Accuracy-dominance $\approx$ Admissibility of Bayes rules under strictly proper loss.
      *   *Verification:*
          *   Joyce's argument: If you violate probability axioms, you are accuracy-dominated (statewise).
          *   Decision Theory: A rule is admissible if no other rule has lower risk for all priors (or statewise lower loss).
          *   *The Break:* Standard admissibility is usually defined relative to *Risk* (expectation over states), not *Loss* (pointwise). Statewise dominance is much stronger.
          *   *The Norm vs. Rationality:* In FE, admissibility is a constraint on *procedures* given a *goal*. In AFE, it's a constraint on *belief states* constitutive of *rationality*.
          *   *Informative Break:* The break highlights that AFE wants to derive the *goal* (probability) from the *structure of evaluation*, whereas FE takes the goal (loss) and finds the optimal procedure. AFE claims probability is required *regardless* of the specific proper score (robustness). FE says "If you care about this score, be probabilistic." AFE says "To be a believer, you must be probabilistic."

  5.  **Part 4: Reverse Translation (What FE misses)**
      *   *The Nature of the "State":* FE treats states as outcomes of a process. AFE treats worlds as truth-makers. FE misses the *alethic* dimension (truth vs. prediction success).
      *   *The Agent's Perspective:* FE is often third-person (evaluating a model). AFE is first-person (norms for *my* beliefs). FE misses the *doxastic voluntarism* issue (can I choose my credence?).
      *   *Logical Omniscience:* FE allows incoherent forecasts if they minimize risk under constraints. AFE demands logical coherence (probability axioms) as a rational ideal, often ignoring computational cost.
      *   *The "Why":* FE explains *how* to score. AFE tries to explain *why* we should score that way (normative force).

  6.  **Refining and Polishing:**
      *   *Check Constraints:* "Do not improve it in translation." "Be explicit wherever a term... is only approximately the right counterpart."
      *   *Tone Check:* Ensure I'm speaking to a peer, not a student. Use the jargon correctly (statewise dominance, Bayes risk, strictly proper).
      *   *Specific Focus:* Ensure the four specific candidates (uniqueness, single world, cal/sharp, rule choice) are addressed prominently.
      *   *Hunch Test:* Be precise about Statewise Dominance vs. Admissibility in Risk. This is the technical crux.

      *(Self-Correction during drafting)*: I need to be careful about the "Admissibility of Bayes Rules" claim. In decision theory, complete class theorems say admissible rules are Bayes rules (or limits). In AFE, the argument is that *non-probabilistic* credences are dominated by *probabilistic* ones. This is slightly different. It's not that Probabilistic rules are admissible; it's that Non-Probabilistic rules are *inadmissible* (dominated). I need to make sure this distinction is clear. The hunch is that Probabilism $\approx$ Admissibility. Actually, Probabilism $\approx$ Non-Dominance.
      Also, need to clarify the "Statewise" aspect. In FE, we rarely demand statewise dominance because it's too strong (usually impossible unless one model is strictly better everywhere). But in AFE, for *incoherent* credences, a dominating coherent credence *always exists* (de Finetti/ Joyce). This is a mathematical peculiarity of the Brier/Log geometry that doesn't hold for general decision problems. I must highlight this.

      *Calibration/Sharpness:* In FE, $Score = Calibration + Sharpness + Uncertainty$. In AFE, "Accuracy" is the score. They argue calibration is valuable *because* it contributes to accuracy (via propriety). FE treats them as orthogonal diagnostics.

      *Reverse Translation:* What does FE miss? The *normative force*. FE says "If you want to minimize Brier, do X." AFE says "You *ought* to minimize accuracy loss." FE misses the derivation of the 'ought'.

  7.  **Final Review against constraints:**
      *   Restate program in user terms? Yes.
      *   Explicit about approximations? Yes.
