  *Self-Correction on Case 2:* Telia on learned behavior. Millikan distinguishes biological proper function from learned use. Learned use doesn't establish new *semantic* content unless it becomes a stabilized proper function (maybe culturally?). Let's have Telia stick to biological selection for simplicity, or acknowledge the tension.
