answer: |-
  **Dialogue: The Content Wars**

  **Participants:**
  *   **Telia:** Teleosemanticist (Millikan/Neander lineage).
  *   **Info:** Informational Semantics (Fodor-style Asymmetric Dependence).

  **Setting:** A quiet corner of a conference lounge, late afternoon.

  **Telia:** Let's start with the bird. Neuron L. Fires on sweeping shadows. Ancestors used it to dive from hawks. Lab bird, never seen a hawk, still dives on shadows. What does L represent?

  **Info:** Easy. It represents *sweeping shadow*. That's what nomically covaries with the firing. In the lab, in the wild, the immediate cause is the shadow pattern.

  **Telia:** Then you can't explain error. If it means *shadow*, then every firing is true. But the bird dives when it's just a cloud. That's a false alarm. It's supposed to dive for *hawks*. The content is fixed by the consumer system—the motor mechanisms that produce the dive. They were selected to save the bird from *hawks*. The shadow is just the sign.

  **Info:** That's where asymmetric dependence kicks in. Look: Shadow-caused firings happen without Hawks. But Hawk-caused firings only happen *because* Hawks look like Shadows. The Hawk-link depends on the Shadow-link. So the content is *Shadow*. But wait—I can flip it. If the mechanism is tuned specifically to hawk-shapes, maybe the Shadow-link depends on the Hawk-link. If the shadow didn't resemble a hawk, the neuron wouldn't fire. Then it means *Hawk*.

  **Telia:** But how do you settle the dependence direction without appealing to function? You're saying the link depends on the other because the system is *designed* to prioritize one. That's smuggled teleology. You're using function to fix the asymmetry.

  **Info:** Not function. Nomic structure. Laws of nature. If the law "Hawks cause L" holds only because "Shadows cause L" holds, then the dependence is asymmetric. It's metaphysics, not biology. But fine, take the lab bird. No selection history in *this* bird's lifetime. Does it have content?

  **Telia:** Yes. Proper function is historical but type-based. The neuron type has a history. The token in the lab bird inherits the proper function of the type. It represents *Hawk*, even if it's never seen one. When it fires at a cloud, it misrepresents. It's failing to do what it's supposed to.

  **Info:** So Swampman—molecule-for-molecule duplicate of you, popped into existence by chance, no history—has no beliefs?

  **Telia:** Correct. No history, no proper function, no content. He behaves *as if* he has beliefs, but there's no normativity. Nothing he says is true or false.

  **Info:** That's a bullet I don't have to bite. Swampman has content because he starts covarying with the world immediately. But let's push your history view. Case two: The bird population learns. Mothers teach chicks: when L fires, don't dive, snap at the insect flushed by the shadow. It's adaptive. Now L serves two uses. Dive (old) vs. Snap (new). What's the content?

  **Telia:** The biological proper function remains *Hawk/ Danger*. The learned use is parasitic. It's a clever exploitation of the signal, but it doesn't change the semantic content unless the learning mechanism itself becomes genetically assimilated over generations. Until then, the consumer system for the dive is the original selector.

  **Info:** Parasitic? The snap behavior is reliably adaptive *now*. The covariation is now L ↔ Insect-presence (via shadow). If the asymmetric dependence shifts—if the insect-link becomes independent of the hawk-link—doesn't the content shift? You're privileging the dead past over the live utility.

  **Telia:** Utility isn't enough. Trash cans are useful, but they don't have proper functions unless designed. You need a selection history to ground the *norm*. Without it, you just have regularities. Why is snapping *wrong* if the insect isn't there? On your view, if L doesn't fire, did it misrepresent?

  **Info:** Yes, if the nomic connection holds. But here's my hit on you: The Homunculus. You say the consumer system fixes content. But the consumer has to use the signal *as* representing something. Does the motor neuron "interpret" L? If not, how does it know what L is *for*? If yes, you've pushed the content problem back a step. You need a little man in the head to read the signal.

  **Telia:** No little man. Consumption is causal. A lock doesn't "interpret" the key; it just opens. The motor mechanism is tuned to fire *only if* L fires. The norm comes from the fact that this locking mechanism was selected because it saved ancestors. No interpretation needed, just mechanistic uptake governed by historical success.

  **Info:** But the lock doesn't represent the key. You want the signal to represent the *world*. To get from "L fires" to "Hawk exists," the consumer must treat L as standing for Hawk. That's representation. If you deny the consumer needs content, you lose the intentionality. If you affirm it, you regress.

  **Telia:** Better than your regress. Your asymmetric dependence is just counterfactual function talk. "Depends on" means "is less robust than." That's a functional property. You're a teleosemanticist who won't admit it. Now, Case three. The CO2 monitor. Component made for smoke alarms, now wired to open vents on CO2. Design history A: Smoke. Design history B: CO2. What does it represent?

  **Info:** It represents CO2. It covaries with CO2 now. The old smoke history is irrelevant. Physical causation fixes content.

  **Telia:** It represents whatever the *current designer* intended it to function as. If the engineer repurposed it, the new design history overrides the old. Artifacts have derived intentionality. But notice: if a Swampman engineer built it by chance, no design history, you'd say it represents CO2. I'd say it's just a lump of metal triggering a vent. No representation.

  **Info:** And that's where we split. You tie content to history so tight you strangle it. I tie it to current structure so loose it floats away. But admit this: if the component starts drifting and fires on humidity, you call that malfunction. Why? Because it's not doing what it was *selected* for (by the engineer). You're using my case to prove your point. You need selection to explain error.

  **Telia:** I do need selection. But you need it too. You need asymmetric dependence to rule out the "Humidity-or-CO2" disjunction. Why does the humidity-link depend on the CO2-link? Because the device is *supposed* to track CO2. That's function. You can't naturalize content without norms.

  **Info:** And you can't have norms without a consumer who already has content. We're both stuck. You're stuck with Swampman having no mind. I'm stuck with explaining why the dependence isn't just hidden function.

  **Telia:** I'm willing to live with Swampman. It preserves the normativity. You're willing to live with content without norms?

  **Info:** I'm willing to live with content fixed by laws. Norms are just our projection on reliable mechanisms. But you—what about the lab bird again? If the species evolves so L *only* fires at clouds now, but the dive mechanism stays? When does the content change?

  **Telia:** When the selection pressure shifts over generations. Not in one bird.

  **Info:** So content is vague across generations but precise in history?

  **Telia:** History is precise. Evolution is gradual. That's nature, not a bug.

  **Info:** Then we're done. You prioritize the past; I prioritize the present laws. Neither explains how the past gets into the present without magic, or how laws get norms without smuggling.

  **Telia:** Agreed. But my bird dives. Yours just covaries.

  **Info:** And mine means something even if it never dives.

