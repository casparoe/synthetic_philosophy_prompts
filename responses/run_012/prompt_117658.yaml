answer: |-
  Here is a procedure for evaluating Strategy-Stealing Arguments (SSA). It is designed to separate the logical skeleton from the hand-waving flesh. I have labelled each step as **[HARD TEST]** (logical necessity; failure kills the proof) or **[SOFT JUDGMENT]** (mathematical taste; failure weakens the paper but might not invalidate the core claim).

  ### The Procedure

  **Step 1: The Zermelo Check**
  *   **Question:** Is the game finite, two-player, perfect information, and strictly win/loss (no draws, no infinite loops)?
  *   **Pass:** Yes, explicitly stated or trivially obvious from rules.
  *   **Fail:** No. (e.g., draws possible, infinite play possible, >2 players).
  *   **Verdict:** If **Fail**, stop. The SSA cannot invoke Zermelo's Theorem. The argument is dead.
  *   **Label:** **[HARD TEST]**

  **Step 2: The Monotonicity Lemma (The "Extra Move" Test)**
  *   **Question:** Does having an *extra* piece/move/turn on the board *never* disadvantage the player who owns it?
  *   **Requirement:** The author must define an ordering on game states such that State $S + \text{piece}$ is $\ge$ State $S$ for the owner.
  *   **Pass:** The author provides a rigorous justification (e.g., "pieces only add connectivity," "moves only reduce opponent options").
  *   **Fail:** The author asserts "obviously an extra move helps" without proof, or the game mechanics suggest interference (blocking, misère conditions, capacity limits).
  *   **Verdict:** If **Fail**, the SSA is broken. This is the most common failure point. An extra piece can block a path, force a bad move in misère play, or clog a board.
  *   **Label:** **[HARD TEST]**

  **Step 3: The Collision Protocol**
  *   **Question:** The strategy-stealer (P1) makes a dummy move. P2's hypothetical winning strategy eventually demands playing on that occupied cell. What does P1 do?
  *   **Requirement:** P1 must have a legal "fallback" move that preserves the advantage gained by the dummy move. Usually, this is "make another dummy move."
  *   **Pass:** The rules allow passing, or the board is large enough that an arbitrary new move is always legal and harmless (see Step 2).
  *   **Fail:** The game requires playing on specific open spots (e.g., "must capture"), or the fallback move violates Step 2 (hurts the player).
  *   **Verdict:** If **Fail**, the stealing mechanism jams.
  *   **Label:** **[HARD TEST]**

  **Step 4: The Constructive Gap**
  *   **Question:** Does the paper claim to provide a playable strategy, or merely an existence proof?
  *   **Requirement:** Acknowledge that SSA is non-constructive.
  *   **Pass:** Author admits they do not know *how* P1 wins, only *that* P1 wins.
  *   **Fail:** Author claims this argument yields a practical algorithm.
  *   **Verdict:** If **Fail**, the author is confused. If **Pass**, proceed to Step 5.
  *   **Label:** **[HARD TEST]**

  **Step 5: The Value Assessment (Referee vs. Puzzle)**
  *   **Question:** What is the deliverable?
  *   **Context A (Journal):** Is the existence of a win mathematically interesting despite not knowing the strategy? (e.g., complexity class implications, structural properties).
  *   **Context B (Puzzle Page):** Is the reader expected to solve/play the game?
  *   **Verdict:**
      *   **Journal:** If Steps 1–4 pass, **Accept**. Non-constructive existence is valid mathematics.
      *   **Puzzle:** If Steps 1–4 pass, **Reject**. A puzzle requires a constructible solution. Telling a reader "you win but I can't tell you how" is a frustration, not a puzzle.
  *   **Label:** **[SOFT JUDGMENT]** (Depends on venue goals).

  ---

  ### Running the Procedure: Three Cases

  #### Case 1: Hex-Style Connection Game
  **The Setup:** $n \times n$ rhombus grid. P1 (Black) connects Top-Bottom. P2 (White) connects Left-Right. No draws (Brouwer fixed point).
  **The Argument:** P1 places a stone anywhere. P1 pretends to be P2. If P2's strategy calls for the occupied cell, P1 places elsewhere. Since stones only help connectivity, P1 wins.
  **The Run:**
  1.  **Zermelo:** Finite, 2-player, no draws. **[PASS]**
  2.  **Monotonicity:** Does an extra black stone ever hurt Black's connection? No. Graph connectivity is monotone with respect to edge/vertex addition. **[PASS]**
  3.  **Collision:** If the strategy says "play at $x$" and $x$ is occupied, play at $y$. Since extra stones don't hurt, the new configuration is still $\ge$ the required one. **[PASS]**
  4.  **Constructive:** Author admits no explicit strategy is known for large $n$. **[PASS]**
  5.  **Value:**
      *   **Journal:** Accept. It establishes P1 win without solving the complexity.
      *   **Puzzle:** Reject. You cannot ask a reader to "play the winning strategy" for Hex on a $19 \times 19$ board based on this.
  **Verdict:** Sound argument. Valid for journal, useless for puzzle page.

  #### Case 2: Misère Take-Away (Nim Variant)
  **The Setup:** One pile of $N$ tokens. Players remove $1$ or $2$ tokens. Last player to move *loses* (Misère).
  **The Argument:** "This is finite and drawless. Assume P2 wins. P1 takes 1 token. P1 steals P2's strategy. Having fewer tokens on the board is always better (closer to empty). So P1 wins."
  **The Run:**
  1.  **Zermelo:** Finite, 2-player, no draws. **[PASS]**
  2.  **Monotonicity:** Does having *fewer* tokens (an "extra move" made) never hurt? In Misère, you want to avoid taking the last token. Having *more* tokens available might force you to take the last one later. Having *fewer* might save you. But the SSA relies on the *extra move* (the dummy stone) being an advantage. Here, the "extra move" is having *already moved*.
      *   *Correction:* The SSA assumes having an extra *piece* on the board helps. In take-away, there are no pieces on a board, only pile size. The argument translates to: "Being in a state with $N-1$ tokens is strictly better than $N$ tokens for the current player."
      *   *Test:* Is $N-1$ always better than $N$ in Misère?
      *   If $N=1$, P1 takes 1, P1 loses. (Bad state).
      *   If $N=2$, P1 takes 1, leaves 1. P2 takes 1, P2 loses. P1 wins. (Good state).
      *   So $N-1$ is not uniformly better than $N$. The "advantage" oscillates.
      *   **Verdict:** Monotonicity fails. **[FAIL]**
  3.  **Collision:** N/A (Argument died at Step 2).
  **Verdict:** Broken. The conclusion is also false (P2 wins if $N \equiv 1 \pmod 3$). The SSA fails because the value of a game state is not monotonic in Misère play.

  #### Case 3: Misère Hex (The "True Conclusion, Broken Proof" Case)
  **The Setup:** Standard Hex board. Rules identical to Hex, *except* the first player to complete a chain *loses*. (Also known as "Reverse Hex" or "Rex").
  **The Claim:** "SSA applies. P1 makes a move. P1 steals P2's strategy. An extra stone never hurts. Therefore P1 wins."
  **The Truth:** On an even-sized board ($n \times n$), P1 *does* have a winning strategy (proven via pairing strategies, not SSA).
  **The Run:**
  1.  **Zermelo:** Finite, 2-player, no draws (someone must connect eventually). **[PASS]**
  2.  **Monotonicity:** Does an extra stone *never hurt*?
      *   In Normal Hex: Extra stone helps you connect.
      *   In Misère Hex: Extra stone *helps you connect*. But connecting makes you **lose**.
      *   Therefore, an extra stone can be a liability. It brings you closer to the losing condition.
      *   The assumption "extra move $\ge$ 0" is false.
      *   **Verdict:** Monotonicity fails. **[FAIL]**
  3.  **Collision:** N/A.
  4.  **Constructive:** N/A.
  **Verdict:** The argument is **Broken**, even though the conclusion (P1 wins on even boards) is **True**.
  **Why this matters:** If you accept this paper, you validate a proof technique that relies on a false lemma. The fact that P1 wins is due to parity/pairing arguments, not strategy stealing. Accepting this would pollute the literature with a "correct result, wrong reason" error, which is dangerous for future generalizations.
  **Referee Action:** Reject. Demand the pairing strategy proof instead.

  ---

  ### What the Procedure Can't Do

  1.  **It cannot detect novelty.** A paper can pass all five steps and still be a trivial rehash of the 1949 Nash Hex argument. Step 5 requires you to judge importance, which the checklist cannot automate.
  2.  **It cannot verify complexity.** An SSA proves existence. It says nothing about how hard it is to find the win. A paper might claim "P1 wins" (true) and imply "P1 wins efficiently" (false). The checklist accepts the existence claim; you must read the complexity claims separately.
  3.  **It cannot fix bad writing.** An author might bury the Monotonicity Lemma in a footnote. The checklist tells you to look for it, but it won't find it if the author hides it.
  4.  **It cannot resolve "Soft" Monotonicity.** Sometimes "extra move doesn't hurt" is true but hard to prove (e.g., in certain topological games). The checklist flags it as a **[HARD TEST]**, but *you* still have to do the math to verify the lemma. The checklist forces you to look at the wound; it doesn't stitch it up.

  **Final Advice:** Use this to filter the "grumpy report" from the "accept." If Step 2 fails, the report writes itself: "The Monotonicity Lemma is asserted but false for this rule set." If Step 5 fails (Puzzle context), the report is: "Non-constructive proofs are unsuitable for this column." Save your squinting for the papers that pass the checklist but smell funny.
