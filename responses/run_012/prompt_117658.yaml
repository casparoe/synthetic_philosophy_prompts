      *   **Task:** Create a concrete, step-by-step procedure (checklist) for evaluating SSA papers.
      *   **Requirements:**
          *   Distinguish between "real tests" (logical necessities) and "taste" (subjective judgment).
          *   Address the critical "extra move never hurts" assumption (monotonicity).
          *   Handle edge cases (inverted wins, no-pass, $>2$ players, draws, infinite games, self-interference).
          *   Evaluate the *value* of a non-constructive proof (referee vs. puzzle context).
          *   Run the procedure on three specific cases (Hex-style, Misère take-away, a counter-intuitive case).
          *   Conclude with limitations of the procedure.
          *   Tone: Professional, slightly weary but rigorous, matching the user's voice ("grumpy report," "squint at them").
          *   Constraint: No references needed.

  2.  **Deconstruct the Strategy-Stealing Argument (SSA):**
      *   *Core Logic:*
          1.  Game is finite, perfect information, no draws (Zermelo's Theorem applies).
          2.  Assume Player 2 (P2) has a winning strategy.
          3.  Player 1 (P1) makes an arbitrary first move.
          4.  P1 pretends to be P2, using P2's strategy.
          5.  If the strategy calls for playing on the occupied cell, P1 makes another arbitrary move.
          6.  *Crucial Assumption:* Having an extra piece/move on the board never disadvantages P1 (Monotonicity).
          7.  Contradiction: P1 wins using P2's strategy, so P2 couldn't have had a winning strategy.
          8.  Conclusion: P1 must win.
      *   *Common Failure Points:*
          *   Game isn't finite/drawless.
          *   Extra piece *does* hurt (e.g., blocking your own path, misère play).
          *   "Arbitrary move" isn't legal or changes the game state in a way the strategy doesn't account for.
          *   Symmetry arguments confused with SSA.

  3.  **Drafting the Procedure:**
      *   Need a flowchart-like structure but in text.
      *   Need to label steps as [TEST] or [TASTE].
      *   Need to address the "extra move" issue specifically.
      *   Need to address the "value" question (Referee vs. Puzzle).

      *   *Step 1: Game Properties.* (Finite? Perfect Info? Drawless? 2-player?) -> [TEST]
      *   *Step 2: The Steal Mechanism.* (Can P1 mimic P2?) -> [TEST]
      *   *Step 3: The Monotonicity Condition.* (Does the extra move hurt?) -> [TEST] (This is the big one).
      *   *Step 4: The Collision.* (What if the strategy says play where P1 already played?) -> [TEST]
      *   *Step 5: Value Assessment.* (Referee vs. Puzzle) -> [TASTE/Context]

  4.  **Developing the Three Cases:**
      *   *Case 1: Hex-style.* Classic SSA. Should pass.
          *   Board: $n \times n$. Goal: Connect opposite sides.
          *   Logic: Extra stone helps connection. No draws.
      *   *Case 2: Misère Take-away.* (e.g., Nim but last move loses).
          *   Logic: SSA usually fails here because having *more* options or *more* tokens might force you to take the last one.
          *   Verdict: Broken.
      *   *Case 3: The "True Conclusion, Broken Proof" Case.*
          *   Need a game where P1 wins, but SSA doesn't apply (or the paper claims SSA applies but relies on a false monotonicity assumption).
          *   Idea: A game where P1 wins by parity, but the author uses SSA claiming "extra move helps."
          *   Better Idea: *Chomp* on a specific board where SSA works, vs. a variant where it doesn't.
          *   Let's go with a "Poisoned Chocolate" variant (Chomp) vs. a "Must-Move" variant.
          *   Actually, let's use a *Maker-Breaker* game on a hypergraph where the extra edge hurts. Or simpler: A game where pieces block movement.
          *   *Selection:* "King of the Hill" on a grid. P1 wins (by centrality), but SSA fails because an extra piece blocks movement.
          *   *Wait, user wants:* "honest verdict goes against what I'd like it to be — you pick it, but I want to see the procedure tell me the argument is broken when the conclusion is true, or the reverse."
          *   *Case 3 Plan:* A game where P1 *does* win, but the SSA is invalid because the "extra move hurts" condition is violated. This shows SSA isn't universal even when the conclusion is right.
          *   *Specific Game:* "Avoid-Connection" (Misère Hex). P1 wins on even boards? Actually, Misère Hex is solved but SSA doesn't apply directly.
          *   *Let's try:* A specific "Blocker" game. P1 wants to make a line. P2 wants to stop. But P1's pieces block P1.
          *   *Refined Case 3:* "Crowded Tic-Tac-Toe." 4x4 board. Win = 3 in a row. But if you fill a cell adjacent to your own line, it invalidates the line (self-interference). P1 might still win by brute force, but SSA fails because the extra piece invalidates the win condition.

  5.  **Refining the "Value" Section:**
      *   Referee: Non-constructive existence is mathematically valid. Acceptable for theory.
      *   Puzzle: Useless. Readers want to *play* the win.
      *   Why? Math seeks truth; Puzzles seek insight/mechanism.

  6.  **Refining the Limitations:**
      *   Checklist doesn't check *novelty*.
      *   Checklist doesn't check *complexity*.
      *   Checklist assumes the author is honest about the rules.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Keep it crisp. "Squint at them" -> "Systematic squint."
      *   *Monotonicity:* Call it the "Monotonicity Lemma."
      *   *Labels:* Use **[HARD TEST]** for logic, **[SOFT JUDGMENT]** for taste.

      *(Self-Correction during drafting Case 3)*: I need a case where the conclusion is *true* (P1 wins) but the SSA is *broken*.
      *   Game: "Fill the Board." 2 players place tokens. Last player to move loses (Misère). Board size $N$ (odd).
      *   Truth: P1 wins (because odd number of cells, P1 makes last move, so P1 loses? Wait. Misère: Last move loses. Odd cells -> P1 makes 1st, 3rd... Nth. P1 makes last move. P1 loses. So P2 wins.)
      *   Let's flip it. Normal Play (last move wins). Odd cells. P1 wins. SSA works? Yes, extra move never hurts in filling.
      *   Okay, let's try a game where P1 wins by *parity*, but author claims SSA.
      *   Game: "No-Touch Dominoes" on a $3 \times 3$ grid. Place dominoes. Cannot touch orthogonally. Last player wins.
      *   Max dominoes = 2 (corners). P2 wins.
      *   Okay, let's stick to the prompt's suggestion: "inverted win conditions."
      *   *Case 3:* **Misère Nim with a single pile of size 1.**
          *   Truth: P1 takes 1, P1 loses. P2 wins.
          *   Author Claim: SSA says P1 wins.
          *   Verdict: SSA broken, Conclusion False.
          *   *Wait, prompt asks for:* "argument is broken when the conclusion is true, or the reverse."
          *   Okay, I need: **Argument Broken, Conclusion True.**
          *   Game: **Chomp on a $2 \times 2$ grid.**
          *   Truth: P1 wins (take top-right, leave L-shape).
          *   Author Claim: Uses SSA.
          *   Problem: Chomp SSA *is* valid.
          *   Okay, I need a game where Monotonicity fails but P1 still wins for other reasons.
