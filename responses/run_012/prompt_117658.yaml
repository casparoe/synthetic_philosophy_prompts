          *   Actually, let's use **"Misère Hex"** (Whoever connects first loses).
          *   Truth: P1 wins on even boards (proven by specific strategy, not SSA).
          *   Author Claim: "SSA applies, P1 wins."
          *   Test Result: Monotonicity fails (connecting is bad). SSA Invalid. Conclusion True (by other means).
          *   This fits perfectly.

  8.  **Final Review against Constraints:**
