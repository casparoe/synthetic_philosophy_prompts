  10. **Refining the Philosophical Content:**
      *   *Relativism:* Identify this as Eli Hirsch's "Quantifier Variance" or Putnam's "Conceptual Relativity."
      *   *The "Context Forces" Move:* This sounds like *Contextualism* about ontology (Thomasson?). But claiming it's a *metaphysical fact* rather than a semantic/pragmatic one is the danger zone. It risks being "Error Theory" about the registrar.
      *   *Alternative:* Suggest *Constitution View* (Baker) - they are distinct but related by constitution. Or *Eliminativism* (Merricks) - no statues, just atoms. Or *Temporal Parts* (Sider) - they share a stage but differ in temporal extent.
