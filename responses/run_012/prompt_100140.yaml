      *   **Context:** Growth lead for a small subscription app.
      *   **Problem:** A/B test on onboarding flows.
      *   **Data Paradox:** Flow B wins overall (aggregate), but Flow A wins in every subgroup (Simpson's Paradox).
      *   **Complication 1 (Causal Structure):** Subgroups (like "heavy user") are not fixed pre-treatment covariates but are influenced by the treatment (Flow B nudges invites -> moves usage tiers). This makes stratification problematic (collider bias/post-treatment bias).
      *   **Complication 2 (Metric Definition):** The headline metric is a ratio (retained users / active users). Both numerator and denominator can shift, potentially masking true effects (Simpson's paradox again, or just ratio metric instability).
      *   **Constraint:** Must ship next week.
      *   **Task:** Provide the most important implications for how to decide.
      *   **Format:** Exactly five numbered points.
      *   **Length:** A sentence or two each.
      *   **Restrictions:** No intro, no wrap-up.

  2.  **Deconstruct the Statistical/Philosophical Issues:**
      *   **Simpson's Paradox:** The classic aggregate vs. stratified conflict. Usually, you trust the stratified data *if* the strata are pre-treatment confounders.
      *   **Post-Treatment Bias:** The prompt explicitly states "heavy user" is a downstream consequence of the treatment (Flow B nudges invites). Stratifying on a post-treatment variable biases the estimate of the total effect. If Flow B makes people heavy users (which is good), but heavy users retain better regardless, stratifying hides Flow B's ability to *create* heavy users.
      *   **Metric Definition:** "Retained users over active users" is weird. Usually, retention is Retained / Started. If it's Retained / Active, it's measuring stickiness among survivors. If Flow B increases active users (denominator) but keeps retention rate similar, the ratio might drop even if absolute retained users rise.
      *   **Decision Context:** "Ship something next week." Need actionable advice, not just statistical theory.
      *   **Goal:** Growth for a subscription app. Ultimately cares about revenue/LTV, not just ratios.

