          *   Final: Trust the aggregate result because stratifying on usage tiers introduces post-treatment bias by conditioning on an outcome the flow itself influences. Flow B may be winning overall precisely because it successfully nudges users into higher-value tiers that retain better.

      *   *Point 2: Address the Metric Issue.*
