          *   Final: Abandon the ratio metric for this decision and evaluate absolute counts of retained subscribers instead to avoid masking effects where both numerator and denominator shift. A flow that activates more users might lower your ratio slightly while significantly increasing total revenue.

      *   *Point 3: Address the Goal (Growth/Subscription).*
