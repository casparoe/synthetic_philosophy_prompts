prompt: |-
  I'm a backend engineer with no philosophy training, and I run a lunchtime reading group at work (three engineers plus one actual biologist) on the function debate — the etiological vs. causal-role thing about what it means for a trait to have a function. I want to hand out a decision tree / taxonomy so people work out which camp they're really in from what they say about cases, not from the labels they like. Build it from the questions out, not from a list of names: every branch node should be a question that actually splits the positions, phrased so someone can answer it without knowing the jargon — no "are you an etiological theorist?" — and then hang the named positions on the branches. The splits I care about are: whether having a function requires some kind of history (selection, or at least a history of being retained); whether function is inherently normative, so that malfunction has to be possible; whether it's about contributing to some larger system's capacity; and whether the account is meant to cover only traits shaped by selection or also novel traits nobody selected and things that didn't evolve at all.

  Leaves I need in there, 8 to 12 total: the selected-effects / etiological view; the causal-role view; the propensity view; an organizational or goal-directed view; a weaker etiological view where the history doesn't have to be natural selection specifically; pluralism ("theres no single right answer"); and eliminativism ("drop the concept"). If any of those is really two positions wearing one name, split it and say so.

  Run these cases through it, and add more if they help: a flightless island bird's wings that now only do display and balance; the human appendix; a lab bacterium whose flagellum no longer helps it swim; a trait that spread by drift in a tiny population and was never selected; and, since we're engineers, a legacy module in a codebase whose only remaining role is that other code depends on its quirks — for that one, say which accounts let a non-evolved artifact have a function at all and which call that a different sense of the word. Label any combination of answers nobody defends and say whether thats because it's incoherent, unattractive, or just unexplored, and flag any two positions the tree can't separate.

  Two things about the answer. Tell me which of these splits are real disagreements and which are basically terminological, and where people who work on this genuinely still disagree vs where they mostly agree — don't sell me a consensus that isn't there. And keep it under 800 words total, tree and notes included.
