  *   **Flightless Bird:** SE says "none" (no selection for flight). CR/Org say "yes" (balance).
  *   **Appendix:** SE says "none" (vestigial). CR says "yes" (current effect).
  *   **Lab Bacterium:** SE says "none" (flagellum useless). CR says "yes" (moves fluid).
  *   **Drift Trait:** SE says "none." Weak Etio says "yes" (if retained).
  *   **Legacy Code:** Weak Etio/CR say "function." SE Strictists say "derived function" (different sense; depends on user intent, not selection). Eliminativists say "coupling."

  **Meta-Analysis**
  *   **Real Disagreements:** **Normativity.** SE/Org insist traits can *fail* (broken heart). CR says traits just *don't* (pump fails). **History.** SE requires past selection; CR requires current capacity. This changes verdicts on vestigial traits.
  *   **Terminological:** **System Boundaries.** CR vs. Org often disagree on what counts as a "system" (organism vs. cell). Often resolvable by defining scope. **Artifact Functions.** SE proponents admit artifacts have "functions" but label them "derived" to protect the biological definition; practically identical to Weak Etio.
  *   **Consensus:** There is no consensus on the *definition*, but consensus that *some* functional talk is indispensable in biology and engineering. Everyone agrees functions explain presence or capacity.
  *   **Disagreement:** Whether "function" implies "ought" (normativity) is the deepest rift. Pluralists avoid the fight by saying both are right in different contexts.
  *   **Incoherent:** **History=Yes + Normativity=No + System=No.** If history matters but sets no norm and aids no system, "function" is synonymous with "cause." Unattractive; adds no explanatory power.
  *   **Indistinguishable:** **Weak Etiological vs. SE on Artifacts.** SE theorists often analogize design to selection, making their verdicts on code identical to Weak Etio. **Propensity vs. Weak Etio.** If retention is probabilistic, these merge.
  *   **Tree Limits:** Cannot separate **Cybernetic** from **Organizational** if "goal" equals "self-maintenance." Cannot separate **Domain** from **Contextual Pluralism** if domains are defined by context.
