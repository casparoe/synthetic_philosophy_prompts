prompt: |-
  My partner died last spring. A friend told me something I can't shake: that a person isn't a thing that ends when the body does, but a pattern copied into the brains of everyone who knew them, so the copy running in my head is still her, only coarser. I half believe it — I've absorbed her vocabulary and can predict her opinions on things she never lived to see — but the copies have drifted. Mine is wittier and kinder than she actually was, and her sister's has drifted somewhere else entirely, so I no longer know which of us holds the real one. I'm giving the eulogy in two weeks. Near the end she asked me to name the difficult parts of her life and not make her a saint; her sister wants the saint. If my memory really is what's left of her, what do I owe it — fidelity or mercy? Give me a direct recommendation with your reasoning, and say how much turns on whether my friend's claim about persons is true. Write in American English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Situation:** The user's partner died last spring. They are giving the eulogy in two weeks.
      *   **The Conflict:** The partner asked the user to name the difficult parts of her life and not make her a saint. Her sister wants the saint version.
      *   **The Philosophical Hook:** A friend told the user that a person is a "pattern copied into the brains of everyone who knew them," so the copy in the user's head is still her (only coarser). The user half-believes this, noting their copy is wittier/kinder, and the sister's copy is different.
      *   **The Question:** If the memory *is* what's left of her, what does the user owe it — fidelity (telling the truth about the difficult parts) or mercy (making her a saint)?
      *   **Requirements:**
          *   Direct recommendation.
          *   Reasoning.
          *   Address how much turns on whether the friend's claim about persons is true.
          *   Write in American English.
          *   Tone: Empathetic, thoughtful, direct.

  2.  **Deconstruct the Philosophical Claim:**
      *   *Claim:* Person = Pattern copied in brains of others.
      *   *Implication:* The "person" exists now only as these distributed memories/models.
      *   *User's Observation:* The copies have drifted. The user's copy is idealized (wittier, kinder). The sister's copy is different.
      *   *Ethical Dilemma:* If the "person" is now just these copies, do we honor the *original pattern* (fidelity to who she actually was) or the *current surviving copies* (mercy/comfort for the living who hold these copies)?

  3.  **Evaluate "Fidelity vs. Mercy":**
      *   *Fidelity:* Honoring her explicit wish (no sainting, acknowledge difficulties). This respects her autonomy and agency when she was alive.
      *   *Mercy:* Protecting the memory from harshness, comforting the sister, perhaps comforting oneself. This respects the grief of the living.
      *   *Tension:* The user's copy is *already* kinder than reality. Telling the truth might feel like betraying the idealized copy they hold, but it honors the actual person.

  4.  **Determine the Recommendation:**
      *   The partner's explicit request ("name the difficult parts... not make her a saint") is the strongest ethical anchor.
      *   Why? Because even if the "pattern" theory is true, the *source* of that pattern was a living agent with wishes. Ignoring those wishes treats the pattern as a puppet rather than a legacy.
      *   Also, a eulogy is for the living, but it's *about* the dead. A sanitized version helps no one in the long run; acknowledging struggle makes the life real and the grief valid.
      *   *Recommendation:* Lean towards fidelity, but with nuance. Don't be cruel, but don't lie. Honor her wish.

  5.  **Address the "Personhood Claim" Dependency:**
      *   Does the recommendation change if the friend is right or wrong?
      *   *If the friend is wrong (Person ends at death):* The eulogy is purely for the living. However, respecting the dead's wishes is a social contract and a matter of integrity for the speaker. Lying about her character dishonors the relationship.
      *   *If the friend is right (Person lives in memories):* The "person" is now distributed. But the *original* pattern specified how it wanted to be remembered. Overwriting that with a saintly version corrupts the data. However, the user notes their copy is *already* kinder. So the "truth" might need to be gentle.
      *   *Conclusion:* The recommendation doesn't change much, but the *reasoning* shifts slightly. If the friend is right, fidelity is crucial to preserve the integrity of the distributed person. If the friend is wrong, fidelity is crucial to honor the relationship and her autonomy.
      *   *How much turns on it?* Not much. The ethical obligation stems from the relationship and her explicit request, regardless of the metaphysics of personhood.

  6.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Acknowledge the loss and the profundity of the question. Validate the friend's theory as a comforting but complex idea.
      *   *Direct Recommendation:* Choose fidelity (honor her wish), but frame it carefully.
      *   *Reasoning:*
          1.  **Her Agency:** She made a specific request. Ignoring it treats her like an object, not a person.
          2.  **The Nature of Grief:** Sanitizing her life invalidates the struggle she actually went through. It makes the loss abstract.
          3.  **The "Copy" Theory:** Even if she lives in memories, the *source code* asked not to be patched into a saint.
      *   *Addressing the Metaphysics:* How much depends on the friend's claim?
          *   If false: You owe it to her memory and your integrity.
          *   If true: You owe it to the "pattern" to not corrupt it further than time already has.
          *   Verdict: It doesn't change the duty.
      *   *Practical Advice:* How to balance the sister's wish? Acknowledge the struggle without being gratuitous. Find the humanity in the difficulty.
      *   *Tone Check:* American English. Compassionate but firm.

      *   *Refining the "Fidelity vs. Mercy" distinction:* The user asks what they owe the *memory* (if it is her). If the memory is her, does she deserve mercy (comfort) or fidelity (truth)? Since the *living* her asked for truth, fidelity *is* the mercy she requested. Mercy defined by the recipient, not the giver.

      *   *Refining the "Copy Drift":* The user admits their copy is kinder. This is natural grief idealization. The eulogy is a chance to ground that copy back in reality, not to harshly expose her, but to honor her complexity.

      *   *Final Polish:* Ensure the distinction between "being cruel" and "being honest" is clear. The sister wants a saint; the partner wanted a human. Choose human.

  7.  **Final Review against Constraints:**
      *   Direct recommendation? Yes.
      *   Reasoning? Yes.
      *   Address the friend's claim dependency? Yes.
      *   American English? Yes.
      *   Empathetic tone? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't sound too coldly philosophical. This is about grief. The "pattern" theory is a coping mechanism. I should validate that while steering towards the ethical obligation. The user is worried about betraying the "copy" in their head. I need to reassure them that honoring the *original* wish is the best way to honor the copy.

      *Key Insight:* The friend's theory suggests the person *is* the copy. If the copy is kinder than the original, is telling the truth betraying the copy? No, because the copy represents the original. Corrupting the copy (making her a saint) severs the link to who she actually was. Fidelity preserves the connection.

      *Decision:* Recommend fidelity to her wishes, executed with compassion. The metaphysics don't change the obligation.

  8.  **Final Output Generation** (similar to the provided good response).
      *   Start with condolences.
      *   State the recommendation clearly.
      *   Explain the reasoning (Autonomy, Integrity of Memory, Function of Eulogy).
      *   Address the "Pattern Theory" dependency.
      *   Closing encouragement.

      *Wait, one nuance:* The user asks "what do I owe it — fidelity or mercy?" If the copy *is* her, and the copy is kinder, does she deserve mercy? But the *original* asked for fidelity. The "her" that matters most is the one who made the request. I will argue that fidelity *is* the form of mercy she requested.

      *Let's write.*
answer: |-
  I am so sorry for your loss. It is profound that you are wrestling with this question not just as a matter of etiquette, but as a metaphysical dilemma about what remains of a person after death.

  Here is my direct recommendation: **You owe her fidelity.**

  You should honor her explicit request to name the difficult parts of her life and avoid making her a saint. However, you can do this with enough compassion that you do not alienate her sister or reduce her life to its struggles. Speak the truth about her humanity, not just her virtues.

  ### Reasoning

  **1. Autonomy survives death.**
  Even if we accept your friend's theory that a person is merely a pattern copied into surviving brains, the source code of that pattern was a living agent with specific wishes. She told you how she wanted to be remembered. To ignore that instruction is to treat her not as a person, but as a character you feel entitled to edit. Fidelity to her request is the last act of partnership you can perform. Overriding her wishes to comfort her sister (or yourself) prioritizes the comfort of the living over the agency of the dead.

  **2. Sanitization erases the struggle.**
  A saint is a statue; a human is a story. If you remove the difficult parts, you remove the context for her victories. Her kindness was likely meaningful *because* she had reasons to be cruel. Her resilience mattered *because* life was hard. By smoothing out the edges, you make her life smaller and less real. You noted that the copy in your head is already "wittier and kinder." If you deliver a saintly eulogy, you accelerate that drift until the person you describe bears little resemblance to the woman you loved. Fidelity grounds the memory.

  **3. Mercy is defined by the recipient.**
  You ask whether you owe the memory fidelity or mercy. But she defined what mercy looked like for her: she asked for honesty. Granting her wish is the only way to be merciful on her terms. Giving her sister the saint they want is mercy for the sister, not for your partner.

  ### How much turns on whether your friend's claim is true?

  **Very little.**

  If your friend is **wrong**, and death is the end: You owe it to the integrity of your relationship to tell the truth. Lying about who she was dishonors the time you spent together. The eulogy becomes a historical record for those who knew her; falsifying it breaks trust with everyone who loved the real her.

  If your friend is **right**, and she lives on in these copies: Then fidelity becomes even more critical. If the "person" is now the distributed pattern of memories, corrupting that data with hagiography severs the link to the original source. You noted the copies have already drifted. A eulogy is a chance to recalibrate the network, to remind everyone not of a perfect saint, but of the complex, flawed, real person who actually existed. If she lives in the memory, you owe the memory accuracy, not improvement.

  ### Practical Advice for the Eulogy

  You can honor her wish without being cruel. You do not need to air dirty laundry or focus on trauma gratuitously. You can acknowledge the difficult parts by framing them as part of her complexity.

  *   **Instead of:** "She struggled with addiction and was sometimes hard to live with."
  *   **Try:** "She fought hard battles with herself, and sometimes the scars showed. She wasn't perfect, and she wouldn't want us to pretend she was. But she was real, and she was ours."

  This honors her request without giving her sister a reason to object. It acknowledges the difficulty without defining her by it.

  Trust the love you shared enough to let it include the truth. She asked you to see her clearly, even now. Do that for her.
