      *   *Victimhood:* Scale (7/10 - internet). Reinstatement (2/10 - permanent stain). False Alarm (3/10 - belief over evidence). Enforcement (4/10 - mob/admin). Hostage (8/10 - easy to weaponize).

      *Wait, I need to check the "False-Alarm Cost" definition.* "How much damage the culture inflicts when an accusation... is mistaken."
