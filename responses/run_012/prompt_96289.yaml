      *   *Decision:* I will argue that "Victimhood" is unstable and often collapses into "Audit Culture" or "Bureaucratic Dignity." But for the sake of the exercise, I will keep it but note its dependency on Dignity's institutions.

  5.  **Mapping Sociological Styles:**

      *   *Punish:* Honor (retribution), Dignity (prison).
