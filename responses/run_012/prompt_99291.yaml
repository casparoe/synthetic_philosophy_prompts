answer: |-
  Here is the breakdown of Rosa's moral architecture, the prediction for your character, and the test case to prove it.

  ### The Verdict
  **Yes.** Rosa will say the character's life is worth living. She will call it "beautiful," "true," or "holy." She will likely say she would take that life, just as she said she would take the hospice nurse's life.

  However, there will be a tremor in her voice. With the lawyer and the bean-eater, her endorsement was warm. With the nurse, it was reverent. With this character, it will be **funereal**. She will validate the *goodness* of the life without validating the *health* of the person. She sees the emptiness not as a tragedy, but as the final receipt of the transaction: the self has been successfully spent.

  ### The Three Competing Rules
  To understand why, we have to isolate the algorithm Rosa is running. Based on her history, three distinct rules fit the data, but they diverge on your character.

  **1. The Vector Rule (Direction of Will)**
  *   **The Logic:** Goodness is defined solely by where the energy flows. If the flow is Outward (toward others), it is Good. If the flow is Inward (toward ego/status/comfort), it is Bad. The state of the source (happy, tired, empty) is irrelevant.
  *   **Fits Data:** Explains the Lawyer (Outward), Bean-Eater (Outward), Nurse (Outward), and Vain Volunteer (Inward).
  *   **Prediction for Character:** **Approve.** Her will is entirely Outward. The emptiness proves the Self is no longer intercepting the signal.
  *   **Probability:** High. This fits the "Saint" archetype.

  **2. The Flame Rule (Sustainability of Love)**
  *   **The Logic:** Goodness requires a burner. You cannot have light without fire. If the human spirit is extinguished (emptiness), the light is mechanical, not moral. A life that destroys the capacity to love the good is ultimately a failure of stewardship.
  *   **Fits Data:** Explains the Lawyer (Sustainable), Bean-Eater (Sustainable). It struggles with the Nurse, unless Rosa views the Nurse's death as a "completed burn" rather than a failure. It strongly explains the rejection of the Vain Volunteer (who had no love for others).
  *   **Prediction for Character:** **Reject.** Emptiness is not sacrifice; it is extinction. You cannot give what you do not have.
  *   **Probability:** Moderate. This fits a psychologist or a pragmatist, but Rosa called the Nurse's self-destruction "beautiful."

  **3. The Witness Rule (Relational Proof)**
  *   **The Logic:** Goodness must be infectious. It must show others that the good life is *possible*. If the life looks like a punishment (emptiness), it repels people from the good. It fails as a testimony.
  *   **Fits Data:** Explains the Lawyer (Happy/Attractive) and Bean-Eater (Fun/Attractive). It struggles with the Nurse (who worked till she quit), unless Rosa sees the Nurse's sacrifice as a powerful, albeit tragic, witness. It explains the Vain Volunteer (repulsive).
  *   **Prediction for Character:** **Reject/Ambivalent.** An empty person does not invite others to follow; they warn them away.
  *   **Probability:** Low. Rosa explicitly said she would *take* the Nurse's life. She values the act over the advertisement.

  ### The Bet: Why the Vector Rule Wins
  I would bet on the **Vector Rule**. Here is why:

  Rosa's judgment of the **Hospice Nurse** is the keystone. The Nurse had no hobbies, no partner, no balance, and worked until her body quit. By the *Flame Rule*, the Nurse failed (she burned out). By the *Witness Rule*, the Nurse failed (she isn't a model for sustainable living). But Rosa called it "beautiful" and said she would live that life.

  This proves Rosa values **Purity of Expenditure** over **Sustainability of the Self**.

  The Vain Volunteer was rejected not because she was unhappy, but because the *beneficiary* of the work was ultimately her own ego (Vanity). The Character is accepted because the *beneficiary* is the work, and the *cost* is the self. The emptiness is not a bug; it is the feature. It is the proof that the ego has been fully negated.

  Rosa lives a balanced life (Lawyer/Bean hybrid) not because she thinks balance is *morally superior*, but because she believes she can do *more total good* over time by staying alive. But she reserves her highest moral admiration for those who do not calculate that. She admires the Martyr more than the Steward, even if she chooses to be the Steward.

  **The Nuance:** Rosa will not tell your character to *keep* going. She will likely try to feed her, or sit with her in silence. She validates the *life*, but she will mourn the *human*. She sees the character as a vessel that has been successfully emptied. In Rosa's theology, an empty vessel is ready to be filled by God/Good. If the character feels nothing, Rosa assumes that is because the "Self" that usually feels things is gone.

  ### The Test Case: How to Prove It in the Novel
  To confirm this rule in your narrative, you need a scenario that pits **Purity** against **Sustainability**.

  **The Scenario:**
  Introduce a new character, let's call him **David**. David is a doctor in a war zone. He is incredibly effective. But David has a secret: he keeps a stash of luxury goods (good coffee, a satellite phone for games, a private tent) that he does not share. He argues that these small selfish comforts keep him sane enough to work for ten years instead of burning out in two. He saves more lives *because* he is slightly selfish.

  **The Choice:**
  Rosa must judge David against your Empty Character.
  *   **The Empty Character:** Saves X lives, then breaks/dies/empties out in 2 years. Total Purity.
  *   **David:** Saves 5X lives over 10 years. Impure (keeps comforts).

  **The Decider:**
  *   **If Rosa says David is "Better":** She is running the **Utilitarian/Flame Rule**. The outcome matters more than the soul's state. Your Empty Character is a waste.
  *   **If Rosa says David is "Wise" but the Empty Character is "Holy":** She is running the **Vector Rule**. She acknowledges David saves more, but she reserves her *moral worship* for the Empty Character.
  *   **If Rosa says David is "Corrupt":** She is running a **Rigorous Vector Rule**. Any self-preservation is a dilution of the good.

  **My Prediction for the Test:**
  Rosa will say David is **wise**, but she will look at your Empty Character with **awe**. She will tell your protagonist: *"David does more. But she is more."*

  This distinction is crucial for your novel. It means Rosa sees morality not just as a calculation of good deeds, but as an **aesthetic of sacrifice**. Your character has achieved the perfect aesthetic. She is a statue of saintliness. Rosa will love her for it, even as she watches her starve.

  ### Writing the Scene
  When Rosa meets this character, do not have her offer advice. Do not have her say "You need rest." That implies the character belongs to herself. Rosa believes the character belongs to the Work.

  Instead, have Rosa offer **witness**.
  Have her look at the emptiness and recognize it as a sacred space.
  *"You've given it all,"* Rosa should say. Not as a warning. As a confirmation.
  *"There's nothing left to take."*

  If you want to create tension, have your protagonist *want* Rosa to tell her to stop. She wants permission to be selfish. Rosa's tragedy—and hers—is that Rosa cannot give it. To tell her to stop would be to tell her the sacrifice wasn't worth it. And Rosa believes it always is.
