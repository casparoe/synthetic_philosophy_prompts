answer: |-
  You have identified a very real, very specific, and deeply annoying linguistic phenomenon. Your intuition is correct: standard "Gricean implicature" doesn't quite capture it because Grice assumed conversation was a cooperative effort where speakers own the meanings they imply. Your examples describe a *non-cooperative* use of implication.

  There isn't one single, perfect word in the dictionary that captures every nuance you described, but there are three terms that, when layered, define this exactly.

  ### 1. The Common Term: **Insinuation**
  The closest existing English word is **insinuation**.
  *   **Definition:** To suggest or hint (something bad) in an indirect way.
  *   **Why it fits:** It captures the "planting the seed" aspect.
  *   **Why it falls short:** It doesn't explicitly encode the *strategic denial* mechanism. You can insinuate something and then admit it ("Yes, I was insinuating he's corrupt"). Your examples require the speaker to *reject* the insinuation when caught.

  ### 2. The Technical Term: **Paltering**
  In negotiation psychology and ethics (popularized by Harvard Kennedy School researchers), this is called **paltering**.
  *   **Definition:** The active use of truthful statements to create a false impression.
  *   **Why it fits:** It distinguishes the move from lying. A liar asserts a falsehood; a palter asserts a truth to manufacture a falsehood in the listener's mind.
  *   **Why it falls short:** It focuses more on the *deception* than the *social maneuvering* of the denial.

  ### 3. The Precise Term: **Weaponized Implicature**
  In recent philosophy of language and pragmatics, scholars (like Jennifer Hornsby and others discussing "illocutionary denial") have started calling this **weaponized implicature** or **strategic implicature**.
  *   **Definition:** Generating a conversational implication with the specific intent of disowning it if challenged.
  *   **Why it fits:** This is exactly what you described. It takes a standard linguistic tool (implicature) and turns it into a shielded weapon.

  ***

  ### Addressing Your Examples

  **Are Example 1 (Politician) and Example 2 (Coworker) the same phenomenon?**
  **Yes.** Both are instances of **Strategic Insinuation (Weaponized Implicature)**.
  *   **The Mechanism:** The speaker relies on the listener's ability to fill in the gap.
  *   **The Goal:** To achieve the *effect* of an accusation (damage the rival/colleague) without taking on the *cost* of an accusation (being held accountable for the claim).
  *   **The Shield:** Plausible Deniability.

  **Is Example 3 (Mum/Aunt) the same move?**
  **No.** This is a **Pragmatic Misfire** (or Accidental Implicature).
  *   **The Difference:** In Ex 1 & 2, the speaker *intends* the inference but denies *commitment*. In Ex 3, the speaker did not intend the inference at all.
  *   **Why it matters:** In Ex 1 & 2, the ambiguity is *engineered*. In Ex 3, the ambiguity is *accidental*. Your mum didn't build a trap; she stepped in a hole. The mechanism (implicature) is the same, but the *agency* is reversed. In 1 & 2, the speaker is the architect. In 3, the listener is the architect of the offense.

  ***

  ### The Boundaries: How to Tell Them Apart

  You asked where the lines are. The key variable is **Commitment**.
  In speech act theory, when you say something, you undertake a "commitment" to that meaning. The move you are describing is **decoupling uptake from commitment.**

  Here is how you distinguish it from the related concepts you mentioned:

  | Concept | Truth of Literal Statement | Intent of Inference | Willingness to Own Inference | Audience |
  | :--- | :--- | :--- | :--- | :--- |
  | **Lying** | False | Intended | Yes (if caught out) | Everyone |
  | **Bullshitting** | Irrelevant | Irrelevant | No (indifferent to truth) | Everyone |
  | **Dog Whistle** | True/False | Intended (Coded) | No (Plausible Denial) | **In-Group Only** |
  | **Normal Implicature** | True | Intended | **Yes** ("Yes, that's what I meant") | Everyone |
  | **Your Phenomenon** | **True** | **Intended** | **No** ("That's what *you* thought") | **Everyone** |

  **1. Versus Lying:**
  Lying requires asserting a proposition the speaker believes to be false. In your examples, the politician *did* find it funny; the coworker *was* impressed by the attendance. The literal text is defensible. The lie exists only in the gap between the text and the inference.

  **2. Versus Bullshitting:**
  Harry Frankfurt defined bullshitting as indifference to the truth. Your speaker is *not* indifferent to the truth; they are carefully curating the truth to be technically accurate. They are indifferent to **commitment**, not truth.

  **3. Versus Dog Whistles:**
  This is the trickiest distinction. A dog whistle relies on a *code* known only to a subset (e.g., "urban" meaning "Black" to racists, but "city" to others). Your examples are not coded; they are **ambiguous**. Everyone in the room hears the insult. The difference is that a dog whistle *wants* the in-group to know they are being signaled. Your speaker wants *everyone* to hear the insult, but *no one* to be able to prove they said it.

  **4. Versus Normal Implicature:**
  If I say "It's raining" and you hand me an umbrella, that is normal implicature. If you ask, "Are you saying I should take an umbrella?" I will say, "Yes."
  In your examples, if you ask, "Are you saying Sarah is lazy?" the coworker says, "No."
  **The Test:** If the speaker refuses to ratify the inference when asked directly, it is Weaponized Implicature.

  ***

  ### The Proposed Name

  If you want a label to use in the wild that captures the engineering, the denial, and the inference, I propose you call it:

  ## **The Poisoned Well Move**
  *(Or more formally: **Deniable Inference**)*

  But if you want the most accurate descriptive term to use in analysis, use **Strategic Insinuation**.

  **Definition:** A communicative act where a speaker intentionally triggers a specific inference in a listener while structuring the literal utterance to allow for plausible denial of that inference if challenged.

  **Why the implication sticks (or slides):**
  You asked: *What makes the implication stick to the speaker instead of sliding off onto the listener?*

  It sticks when the **literal meaning is irrelevant.**
  *   **Coworker Case:** Why mention Sarah's meeting attendance unless it contrasts with her work output? If the literal compliment ("impressive") was the only point, the context wouldn't fit. The inference sticks because the literal statement is too weak to justify the utterance on its own.
  *   **Politician Case:** Why mention the certificate unless eligibility is in doubt?
  *   **Mum Case:** The inference slides off because the literal meaning ("nice boy") is a complete, valid sentiment on its own. There is no contextual pressure forcing the "step down" interpretation.

  **Summary:**
  You are describing **Strategic Insinuation** (or Weaponized Implicature). It is distinct from lying because it uses truth. It is distinct from normal conversation because it rejects commitment. And your Mum's case is not the same move; hers was a misunderstanding, whereas the politician and coworker were engaged in **calculated ambiguity.**
