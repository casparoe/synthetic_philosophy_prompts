      *   *Nuance:* Utilitarianism applies the principle of choice for one person (sacrifice now for gain later) to society (sacrifice one person for gain of others).
      *   *Problem with (1):* It defines the objection too broadly as "aggregating benefits and burdens." Almost *any* non-solipsistic moral theory aggregates in some sense (e.g., prioritarianism, sufficientarianism, even some rights-based theories in conflict resolution).
      *   *Verdict:* (1) is the most vulnerable premise. It captures a *feature* of utilitarianism that the objection targets, but it identifies the *wrong feature* as the defect. The defect isn't aggregation itself; it's the *moral justification* for aggregation that ignores the boundaries of persons.

  4.  **Diagnose Premise (2): The Rescue Case:**
      *   *Is (2) accurate?* Yes, saving 5 over 1 involves weighing lives. It implies a sum-total calculation.
      *   *Nuance:* Does *every* theory that saves the 5 aggregate in the *same way*? A rights theorist might say "minimize rights violations." A contractualist might say "no one could reasonably reject." But functionally, it looks like aggregation.
      *   *Verdict:* (2) is mostly solid, but one could argue that non-utilitarian theories justify saving the 5 without *utilitarian* aggregation. However, for the sake of the user's argument, (2) is acceptable.

  5.  **Diagnose Premise (4): The Intuition:**
      *   *Is (4) true?* "It is plainly true that the agent ought to save the five."
      *   *Challenge:* Is it *plainly* true? Most people think so (the "numbers count"). But some deontologists or radical individualists might dissent (lottery system?).
      *   *Verdict:* (4) is a strong common-sense intuition. Rejecting it is costly (leads to moral skepticism or radical deontology). Keeping it is standard.

  6.  **Develop the Core Critique (The "Rawlsian" Response):**
      *   Rawls doesn't object to *all* aggregation. He objects to the *model* of aggregation.
      *   *Analogy:* One person sacrifices a present pain for a future gain. This is rational *for that person*. Utilitarianism says Society can sacrifice Person A for Person B's gain. This is irrational *between persons* because there is no "Social Entity" that experiences the net gain.
      *   *Distinction:* Trade-offs *within* a life vs. trade-offs *between* lives.
      *   *Refining (1):* The objection isn't "aggregation is bad." It's "aggregation that treats interpersonal trade-offs as equivalent to intrapersonal trade-offs is bad."
      *   *The Rescue Case:* In the 1 vs. 5 case, is it an interpersonal trade-off imposed by authority, or a rescue scenario?
      *   *Key Distinction:* **Imposition vs. Rescue.** Rawls's objection is strongest when the sacrifice is *imposed* on the one for the sake of the many (e.g., punishing an innocent to prevent a riot). In the rescue case, no one is being *used*; everyone is facing death, and the agent chooses who to save.
