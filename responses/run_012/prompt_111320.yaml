          *   *Identity:* DT assumes the agent is the *same* in Heads and Tails worlds (indexical uncertainty). PE (Non-Identity) says they are *different* people (metaphysical uncertainty). Mapping requires treating the "Principle" as the agent, not the people.
      *   *Inexpressible in PE:*
