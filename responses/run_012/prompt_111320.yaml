          *   PE Translation: Evaluating the policy from the "veiled" perspective (before knowing which specific people exist/which world is actual) vs. evaluating from the perspective of the actualized people. Totalism is inherently "updateless" in a sense (sums across all possible worlds weighted by probability? No, sums across actual people). Need to distinguish *ex-ante* expected utility of a population principle vs. *ex-post* evaluation of the actual population.
      *   *Core Concept:* Logical Correlation (Parfit's Hitchhiker / Logical Mugging).
          *   DT: Coin replaced by logical fact.
