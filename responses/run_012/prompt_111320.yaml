          *   PE Translation: Needs to involve *people* and *welfare*. The "agent" becomes a "generator of people" or a "policy affecting existence." The "money" becomes "welfare units." The "prediction" becomes "logical/metaphysical dependency between possible persons."
          *   Idea: A policy determines which possible people exist. The "Predictor" is the structure of reality/modal space.
