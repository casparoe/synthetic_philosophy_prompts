      *   **Task 1 (Translation):** Restate DT concepts (counterfactual mugging, updatelessness, logical correlation, blackmail) into population ethics vocabulary (possible people, summed welfare, non-identity, totalism vs. rivals, asymmetry). Do this idea by idea, faithfully, without verdict.
      *   **Task 2 (Residue Report):** Analyze the mapping. What translates cleanly? What requires fudging (e.g., treating branch-selves as distinct people)? What is inexpressible in population ethics (PE)? What is in PE but inexpressible in DT (e.g., non-identity, repugnant conclusion)? Assess whether gaps indicate impoverishment or different scopes.
      *   **Constraint:** Do not dumb it down. Assume fluency in both literatures (though the user admits less fluency in DT). Push on the joints.

  2.  **Deconstruct Task 1: Translation (DT $\to$ PE)**
