answer: |-
  ### Part I: The Translation

  You asked for the decision-theoretic apparatus restated in the vocabulary of population ethics (PE). I will treat the "agent" not as a singular self persisting through branches, but as a **Principle of Population Selection** (PPS). The "payoffs" are not monetary utilities but **welfare levels of possible persons**. The "prediction" is not a psychological simulation but the **metaphysical or logical dependency between actions and identities**.

  **1. Counterfactual Mugging $\to$ The Conditional Existence Problem**
  *   **DT Setup:** Coin flip. Tails: Pay \$100. Heads: Get \$10k *if* predicted to pay on Tails.
  *   **PE Translation:** A PPS is evaluated across two possible worlds, $W_T$ and $W_H$, with equal probability.
      *   In $W_T$ (Tails), a specific set of Actual People ($A$) exists. The PPS demands a welfare cost (sacrifice) from $A$.
      *   In $W_H$ (Heads), a different set of High-Welfare Possible People ($H$) exists. $H$ comes into existence *if and only if* the PPS is such that it would have demanded the sacrifice from $A$ in $W_T$.
      *   **The Dilemma:** You are standing in $W_T$. $A$ is actual. $H$ is merely possible. Do you impose the cost on $A$?
      *   **CDT/EDT (Updateful):** No. $H$ does not exist in this world. The conditional "if predicted" is counterfactual history. Maximizing actual welfare means sparing $A$. Result: $H$ never exists in $W_H$ (because the PPS was the kind that wouldn't pay), so total expected value across the probability space is low.
      *   **FDT/UDT (Updateless):** Yes. You evaluate the PPS *ex-ante*, before knowing which world is actual. The PPS that demands sacrifice in $W_T$ is the same PPS that generates $H$ in $W_H$. To maximize expected sum-total welfare across the probability distribution of worlds, the PPS must bind $A$ in $W_T$ to secure $H$ in $W_H$.

  **2. Updatelessness $\to$ Ex-Ante vs. Ex-Post Principles**
  *   **DT Setup:** Act on the prior distribution, not the posterior conditional on your branch.
  *   **PE Translation:** This is the debate between **Ex-Ante Totalism** and **Ex-Post Totalism**.
      *   **Ex-Post (Updateful):** Value is the sum of welfare of people who *actually* exist. Once you know you are in $W_T$, $H$ has zero weight. The "branch-self" in $W_H$ is a different population, morally disconnected from $A$.
      *   **Ex-Ante (Updateless):** Value is the expected sum of welfare of people who *could* exist, weighted by the probability of the world they inhabit, conditional on the adoption of the PPS. The "branch-self" in $W_H$ is a **Counterfactual Stakeholder**. Their potential welfare counts toward the evaluation of the principle even if they do not actualize, provided their existence is counterfactually dependent on the principle's disposition in $W_T$.

  **3. Logical Mugging $\to$ The Non-Identity Link**
  *   **DT Setup:** The coin is replaced by a logical fact (e.g., the 10,000th digit of pi). Your decision is logically correlated with the fact.
  *   **PE Translation:** This maps directly onto the **Non-Identity Problem**, but tightened.
      *   In standard Non-Identity, choosing Policy X causes Person $P_1$ to exist; Policy Y causes Person $P_2$ to exist.
      *   In Logical Mugging PE, the "fact" is the **Identity Constitution**. The existence of the High-Welfare Population ($H$) is not causally downstream of the sacrifice; it is *logically entailed* by the type of PPS that accepts the sacrifice.
      *   The "Predictor" is the **Metaphysical Structure of Persons**. Just as the digit of pi is fixed but unknown, the identity of the future population is fixed by the action but unknown to the chooser. The "correlation" is the supervenience of identity on action. To refuse the sacrifice is to logically select a world where $H$ is impossible.

  **4. Blackmail / Multi-Agent $\to$ Intergenerational Dependency Chains**
  *   **DT Setup:** A threat fires depending on what multiple recipients do.
  *   **PE Translation:** **Intergenerational Equity with Non-Identity Chains.**
      *   Generation 1 ($G_1$) is asked to sacrifice. Generation 2 ($G_2$) exists only if $G_1$ sacrifices. Generation 3 ($G_3$) exists only if $G_2$ would have sacrificed had they been in $G_1$'s position.
      *   The "Blackmail" is the **Conditionality of Existence**. Future people "threaten" (logically) not to exist unless current people adopt a PPS that harms them (the current people).
      *   **Updateful PE:** $G_1$ ignores $G_2$'s threat because $G_2$ doesn't exist yet.
      *   **Updateless PE:** $G_1$ adopts the PPS that satisfies the threat, because the PPS is the invariant across generations. The "recipients" are temporal slices of the same **Trans-Generational Population**.

  ***

  ### Part II: The Residue Report

  Here is the audit of what survives the translation, what requires distortion, and what vanishes entirely.

  #### 1. What Carries Over Cleanly
  **The Ex-Ante/Ex-Post Distinction.**
  The decision-theoretic debate between CDT/EDT and FDT/UDT is isomorphic to the debate in population ethics between **Actualism** (value depends on who actually exists) and **Possibilism** (value depends on the expected welfare of the principle governing existence).
  *   **DT:** UDT wins because it captures value in the counterfactual branch where the predictor pays out.
  *   **PE:** Possibilist Totalism wins (arguably) because it captures value in the counterfactual world where the high-welfare people exist.
  *   **Verdict:** Your framework already contains this. "Updatelessness" is just **Rule Consequentialism applied to Population Principles** evaluated from behind a Veil of Ignorance regarding *which* possible people will be actual.

  **Precommitment as Principle Adoption.**
  *   **DT:** Precommitting to pay the mugger.
  *   **PE:** Adopting Totalism (or a specific variant) as a fixed moral law rather than maximizing act-by-act.
  *   **Verdict:** Clean. The "binding" mechanism in DT is self-modification or algorithmic rigidity; in PE, it is the move from Act-Consequentialism to Rule-Consequentialism (or Theory X).

  #### 2. What Carries Over Only With Fudging
  **The Identity of the "Branch-Self."**
  *   **DT:** Crucially assumes the agent in the Tails world and the agent in the Heads world are the **same agent** (or sufficiently logically correlated copies). The utility gained in Heads must accrue to the *same locus of evaluation* that suffers the cost in Tails.
  *   **PE:** The Non-Identity Problem asserts the opposite. The people in $W_T$ and $W_H$ are **distinct persons**.
  *   **The Fudge:** To make the translation work, you must treat the **Principle of Population Selection** as the agent, not the people. The "utility" is not experienced by a continuous self, but aggregated across distinct souls.
  *   **The Friction:** DT relies on *self-interest* (or self-locating utility) to motivate the payment. "I pay now so *I* get paid later." PE lacks this. $A$ pays so that $H$ can exist. $A$ and $H$ are not the same.
  *   **Consequence:** You cannot ground the "Updateless" move in PE using the same psychological leverage as DT. You need an **Impersonal Good** (Totalism) to bridge the gap. If you are a Person-Affecting View (PAV), the translation breaks completely. A PAV agent in the Tails world sees no benefit in the Heads world because the beneficiary is a *different person*. DT assumes the beneficiary is *you*.
  *   **Verdict:** The translation requires you to abandon the Person-Affecting Restriction. If you hold that "an outcome can only be better if it is better for some particular person," Counterfactual Mugging is inexpressible. The "Mugging" only works in PE if you accept the **Impersonal Totalist** premise that possible people's welfare counts even if they are not identical to the payers.

  **Logical Correlation vs. Causal Dependence.**
  *   **DT:** Functional Decision Theory relies on *logical* correlation (my decision algorithm is the same as the predictor's simulation).
  *   **PE:** Relies on *causal* or *metaphysical* dependence (my action causes their conception).
  *   **The Fudge:** PE treats the link as causal (actions $\to$ gametes $\to$ people). DT treats it as logical (algorithm $\to$ output).
  *   **Consequence:** DT allows for "acausal trade" between distinct agents who share source code. PE generally does not recognize acausal links between distinct generations unless you posit a metaphysical identity across time.
  *   **Verdict:** PE is metaphysically "heavier." It requires a story about how actions generate identities. DT is "lighter"; it requires only a story about information and correlation. To translate DT's Logical Mugging into PE, you must assume the **Identity of Indiscernibles** applies to moral principles across worlds, which is a stronger claim than PE usually makes.

  #### 3. What Is Inexpressible in Population Ethics
  **Indexical Uncertainty (Self-Locating Belief).**
  *   **DT:** A core component of the Mugging is: "I don't know if I am in the Heads world or the Tails world." (Or in the logical version: "I don't know the output of the computation.")
  *   **PE:** PE typically assumes the agent knows *which* world is actual (the actual population). PE asks "Which world *should* be actual?" not "Which world *is* actual?"
  *   **The Gap:** DT is epistemological (how to act given uncertainty about *location* in logical space). PE is axiological (which population structure has more value).
  *   **Verdict:** PE lacks a robust theory of **self-locating obligation**. If I am a person in $W_T$, do I have an obligation to act as if I might have been in $W_H$? DT says yes (Updatelessness). PE usually says no (I am actually in $W_T$). PE cannot easily state the force of the "might have been" without invoking the Ex-Ante/Ex-Post distinction mentioned above, but even then, PE lacks the *indexical* punch of "This could be me."

  **The Source of Normativity.**
  *   **DT:** The normativity comes from **instrumental rationality**. If you don't pay, you lose money (in expectation). It is prudential.
  *   **PE:** The normativity comes from **moral value**. If you don't sacrifice, the world is worse (impersonally).
  *   **The Gap:** DT argues you *should* pay because it benefits *you* (the algorithm). PE argues you *should* sacrifice because it benefits *them* (the possible people).
  *   **Verdict:** DT's "Mugging" is a trap for egoists who fail to see their extended self. PE's "Mugging" is a trap for person-affecting theorists who fail to see the impersonal good. The *structure* is the same, but the *normative engine* is different. PE cannot express the prudential force of the DT argument without collapsing morality into prudence.

  #### 4. What Is Inexpressible in Decision Theory
  **The Asymmetry.**
  *   **PE:** A central dogma for many (including Parfit initially) is the Asymmetry: Creating a happy person is neutral; creating a miserable person is bad.
  *   **DT:** Utility functions are symmetric. Gaining 10 utils is the mirror of losing 10 utils.
  *   **The Gap:** DT has no natural way to model the Asymmetry without ad-hoc utility patching (e.g., utility is 0 for non-existence, positive for existence, but the *expectation* doesn't count).
  *   **Verdict:** DT is impoverished here. It assumes a continuous utility function over existence and non-existence. PE recognizes that existence might be a **lexical threshold** or a **different category of value**. DT cannot capture the intuition that "you can't do a favor for someone by bringing them into existence" without violating expected utility axioms.

  **The Repugnant Conclusion.**
  *   **PE:** Totalism implies that a vast population of barely-worth-living lives is better than a small population of ecstatic lives. This is treated as a *bug* (or a bullet to bite).
  *   **DT:** Maximizing Expected Utility implies accepting large probabilities of small gains over small probabilities of huge gains (or vice versa depending on risk neutrality).
  *   **The Gap:** DT treats the Repugnant Conclusion as a feature of linear aggregation. It doesn't agonize over it. PE agonizes over it because it conflicts with **intuitions about quality of life**.
  *   **Verdict:** PE is doing work DT doesn't need. DT assumes the utility function is given. PE asks **what the utility function should be**. The Repugnant Conclusion is a meta-ethical constraint on the shape of the value function. DT takes the value function as input; PE tries to derive it.

  **The Non-Identity Complaint.**
  *   **PE:** "But the child born into slavery wouldn't exist otherwise!" This is a specific moral complaint about **harm**.
  *   **DT:** "The outcome in Branch A is correlated with Branch B."
  *   **The Gap:** DT ignores the *directionality* of harm. It only sees outcome values. PE cares about **comparative harm** relative to a baseline of non-existence.
  *   **Verdict:** DT is outcome-oriented; PE is often harm-oriented. The Non-Identity Problem is a problem *only* if you care about harm to specific subjects. If you are a pure Totalist (Impersonal), the Non-Identity Problem dissolves (just like the Mugging dissolves for UDT).
  *   **Crucial Insight:** The Decision Theorists have solved the Non-Identity Problem by **ignoring identity**. They treat the "Person in Tails" and "Person in Heads" as instances of the same utility function. Population Ethicists keep identity because they care about **rights, harm, and complaints**.
  *   **Verdict:** DT is not impoverished; it is **deliberately blind** to identity. PE is not impoverished; it is **deliberately sensitive** to identity. The Mugging debate is what happens when PE tries to be DT (Impersonal Totalism). The Non-Identity debate is what happens when PE refuses to be DT (Person-Affecting Views).

  ### Summary Judgment

  Your home apparatus **does** have the debate inside it, but it is distributed across two different camps that DT collapses into one.

  1.  **Impersonal Totalism** in PE is isomorphic to **UDT/FDT**. It solves the Mugging by counting counterfactual people. It bites the Repugnant Conclusion. It ignores Non-Identity.
  2.  **Person-Affecting Views** in PE are isomorphic to **CDT/EDT**. They fail the Mugging (refuse to pay for counterfactual people). They avoid the Repugnant Conclusion (usually). They obsess over Non-Identity.

  **The Decision Theorists are not onto something new;** they are onto the **structural consequences of Impersonal Totalism** when applied to single agents under uncertainty. They have formalized the "Ex-Ante" perspective that Parfit gestured toward in *Reasons and Persons* but didn't mathematize.

  **However,** the Decision Theorists are missing the **Asymmetry** and the **Harm Complaint**. Their framework assumes that "more utility is always better" and "identity is transparent." If your intuition is that creating happy people is *not* a moral gain in the same way that saving existing people is, DT has no vocabulary for you. It will tell you that you are "irrational" (leaving money on the table), whereas PE allows you to say "the table is set differently."

  **Final Recommendation:** Treat UDT as the formal proof of **Ex-Ante Impersonal Totalism**. Treat the resistance to UDT (the "why should I pay?" intuition) as the formal expression of the **Person-Affecting Restriction**. The friction you feel is not a gap in your vocabulary; it is the exact friction between Totalism and Person-Affecting Views, re-scaled from populations to branches of a single life.
