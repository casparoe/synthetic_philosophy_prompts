answer: |-
  Here is the mapping of the 2006 Pluto episode through the three theoretical lenses, followed by an assessment of where each account succeeds and where it stalls.

  ### 1. Boyd's Homeostatic Property Cluster (HPC)

  **The Setup:** Boyd argues that natural kinds aren't defined by necessary and sufficient conditions (like classical essences), but by clusters of properties that tend to co-occur because of underlying causal mechanisms. The "kind" is real if the cluster is maintained by a homeostatic mechanism that allows for reliable induction and explanation.

  **The Mapping:**
  Under the HPC view, the pre-2006 category "planet" was a weak kind. It grouped bodies by historical accident (visibility to ancients) and broad similarity (orbiting the Sun, not twinkling). There was no single causal mechanism ensuring that Mercury, Jupiter, and Pluto shared a deep structural unity. They are compositionally diverse (rock, gas, ice) and dynamically distinct.

  The 2006 definition attempts to retrofit "planet" into a stronger HPC kind. Criterion (c), "cleared the neighbourhood," is the candidate for the homeostatic mechanism. It tracks **dynamical dominance**. A body that clears its orbit has undergone a specific causal history of accretion and scattering; it is the gravitational boss of its zone. This property correlates with mass, formation time, and orbital stability. If this mechanism holds the cluster together, the IAU definition is an attempt to carve a real joint: the distinction between bodies that dominate their formation environment and those that are merely passengers in a debris field (like the Kuiper Belt).

  **Where it runs out of gas:**
  1.  **The Vote:** HPC assumes nature holds the cluster together. In Prague, humans voted on the threshold. Homeostasis is a causal process, not a parliamentary procedure. If the boundary of the kind depends on a show of hands, it suggests the cluster isn't robust enough to sustain itself without human intervention.
  2.  **The Locality Problem:** The definition applies only to bodies orbiting *our* Sun. A natural kind should be projectable. If "Water" is H2O, it is H2O in the Andromeda galaxy. If "Planet" requires orbiting Sol, it is not a kind of object; it is a role in a specific system. This suggests the IAU wasn't identifying a universal natural kind, but creating a local nomenclature. Boyd's realism struggles to accommodate a "natural kind" that is geographically restricted to one star system by fiat.
  3.  **Vagueness:** "Cleared the neighbourhood" is quantitative, not qualitative. There is a continuum of clearing. HPC kinds usually tolerate some variation, but a hard cutoff on a continuum often signals a conventional boundary, not a causal discontinuity.

  ### 2. Dupré's Promiscuous Realism

  **The Setup:** Dupré argues that the world is causally complex and can be classified in multiple, equally legitimate ways depending on human interests. There is no "God's Eye" taxonomy. Different joints are real relative to different investigative purposes.

  **The Mapping:**
  This theory handles the Pluto mess better than any other. It predicts exactly what happened: a conflict of interests masquerading as an ontological dispute.
  *   **Dynamical Astronomers:** Interested in solar system formation and orbital stability. For this interest, the "cleared neighbourhood" criterion is the correct joint. Pluto is an outlier.
  *   **Geophysical Planetary Scientists:** Interested in surface processes, atmospheres, and geology. For this interest, "hydrostatic equilibrium" (roundness) is the correct joint. If it's round, it has complex geology. Pluto fits here.
  *   **The Public/Culture:** Interested in heritage and narrative. Pluto is the ninth planet.

  Dupré would say the IAU made a category mistake by claiming their dynamical definition was the *only* true one. The backlash from planetary scientists (who keep calling Pluto a planet) isn't ignorance; it's them adhering to a different, equally valid realism suited to their work. The existence of the new category "dwarf planet" alongside the continued use of "planet" for Pluto in literature is evidence of promiscuous realism in action: multiple classifications co-existing because they serve different explanatory goals.

  **Where it runs out of gas:**
  1.  **Power and Authority:** Dupré's view is tolerant, but science is hierarchical. The IAU vote wasn't a friendly agreement to disagree; it was an attempt to enforce one taxonomy as authoritative for textbooks, funding, and nomenclature. Promiscuous realism explains why the conflict exists, but it doesn't explain why one group had the institutional power to legislate reality for the others.
  2.  **The "Discovery" Intuition:** Scientists generally feel they are *discovering* what Pluto is, not *deciding* what to call it. Dupré dissolves this intuition by saying both are legitimate. But this leaves the scientists unsatisfied. It turns an ontological crisis into a semantic pluralism, which might be philosophically accurate but fails to capture the stakes the participants felt. They weren't arguing about interests; they argued about truth.

  ### 3. Locke/Hacking (Nominal Essence + Interactive Kinds)

  **The Setup:** Locke distinguishes between real essence (the hidden constitution of a thing) and nominal essence (the abstract idea we attach a name to). Hacking adds that some kinds are "interactive": classifying them changes the thing classified (or the practices surrounding it), creating a feedback loop.

  **The Mapping:**
  *   **Locke:** "Planet" has no real essence. There is no atomic number or DNA for a planet. It is a nominal essence—a definition we agree upon for communication. The 2006 vote was literally the construction of a new nominal essence. The frustration arose because people treated the nominal essence as if it were a real one. They thought they were finding out what Pluto *really* was, when they were actually voting on how to use a word.
  *   **Hacking:** While rocks don't react to labels, the *scientific discipline* does. By creating the kind "dwarf planet," the IAU changed the landscape of inquiry. Funding calls, mission proposals, and departmental structures loop back on the classification. If you classify Pluto as a dwarf planet, it gets studied differently than if it is a planet. The classification alters the "kind" of science done on the object.

  **Where it runs out of gas:**
  1.  **The Causal Weight of (c):** The Locke/Hacking view risks making the definition seem arbitrary. But "clearing the neighbourhood" isn't arbitrary; it tracks gravitational physics. A purely nominalist view struggles to explain why *this* definition gained traction over others. It wasn't just a linguistic preference; it tracked a physical reality (dynamical dominance). Treating it as purely nominal ignores the scientific work the criterion does.
  2.  **Indifferent vs. Interactive:** Hacking's looping effects are strongest with human kinds (e.g., classifying a person as "depressed" affects their depression). Planets are "indifferent kinds"—Pluto doesn't care what we call it. Applying Hacking here requires stretching the theory to cover *institutional* looping rather than *ontological* looping. It explains the sociology, but it doesn't explain the astronomy.
  3.  **The Vote:** Locke would say we can define nominal essences however we want. But the controversy shows that scientists believe they are constrained by the world, not just language. The vote feels illegitimate to many because it treats a scientific question as a legislative one. Locke's framework accepts the vote as valid definition-making, but fails to capture why it feels like a betrayal of scientific practice.

  ### Synthesis: What the Episode Reveals

  **Was "Planet" ever a natural kind?**
  Probably not. It started as a cultural/historical list (the wanderers). The 2006 attempt was an effort to *make* it a natural kind (via dynamical dominance) but failed to universalize it (Sun-only restriction). The episode suggests "planet" is a **hybrid**: it attempts to track a causal property (clearing) but is bounded by human convention (the vote, the Solar System limit).

  **Discovery or Decision?**
  It was a **decision dressed as a discovery**. The IAU framed it as "we finally understand the Solar System's structure" (discovery), but the mechanism was a vote on a threshold (decision). The "cleared neighbourhood" criterion does causal work—it distinguishes dominant bodies from debris—but the hard line drawn at Pluto was a policy choice to keep the number of planets manageable.

  **Does the Sun-centric limitation give the game away?**
  Yes. This is the strongest evidence against "Planet" being a natural kind in the Boydian sense. A definition that cannot travel to exoplanets is a local taxonomy, like "Continent" or "Sea," not a universal kind like "Star" or "Element." It admits that the category is about *our* relationship to the Solar System, not the intrinsic nature of the objects.

  **Where the theories stand after the vote:**
  *   **Boyd (HPC):** Hurt. The case shows that scientific communities will vote on kind boundaries when the causal clusters are fuzzy. It reveals that "homeostasis" can be enforced by committee when nature provides only a continuum.
  *   **Dupré (Promiscuous Realism):** Vindicated, but politically naive. The persistence of the geophysical definition alongside the IAU definition proves multiple realisms coexist. However, Dupré underestimates the damage done when one group tries to legislate their realism as the only one.
  *   **Locke/Hacking:** Most accurate on the process, least satisfying on the science. They correctly identify the move as nominal essence construction with looping effects on the discipline. But this view risks cynicism, implying the science is just semantics, whereas the dynamical criterion *does* track something physically significant.

  **The Silent Spot:**
  None of these theories fully account for the **authority of the vote**. Philosophy of science usually assumes evidence settles categories. Here, a majority vote settled a category. This suggests that for "fuzzy" kinds (where the causal cluster is continuous), the "natural kind" is actually a **social kind** stabilized by institutional authority. The theories describe the *objects* and the *concepts*, but they lack a mechanism for how a show of hands at a convention center becomes an ontological boundary for the rest of the scientific community. The Pluto case suggests that when nature doesn't provide a sharp joint, scientists don't just pick one (Dupré) or find a cluster (Boyd); they legislate one, and the "reality" of the kind depends on whether the community accepts the authority of the legislators.
