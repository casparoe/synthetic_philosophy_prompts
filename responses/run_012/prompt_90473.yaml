answer: |-
  # Session Plan: The Weight of Apples (90 Minutes)

  **Goal:** Students experience the differential weight of evidence (Black Ravens vs. Green Apples) across two different background distributions without prior theoretical framing.
  **Participants:** 18 Students (3 Teams of 6).
  **Materials:** Printed cards, envelopes/folders, betting slips, timers.

  ---

  ## 1. Preparation & Materials

  You need to prepare three distinct physical kits. Do not skimp on the physical separation of data; it is the engine of the activity.

  ### A. The Cards (The "Objects")
  You need two decks. Each card represents an object in the world.
  **Design:** Use standard playing cards or printed index cards folded in half vertically.
  *   **Outside:** "OBJECT [ID Number]"
  *   **Inside Left:** "IS RAVEN? (YES / NO)"
  *   **Inside Right:** "IS BLACK? (YES / NO)"

  **Deck 1 (Round 1: Dense World)** - *Total 100 Cards*
  *   **World A (Truth):** 30 [Yes/Yes] (Black Raven), 20 [No/Yes] (Black Shoe), 50 [No/No] (Green Apple). 0 [Yes/No] (White Raven).
  *   **World B (Alternative):** 10 [Yes/Yes], 20 [Yes/No], 40 [No/Yes], 30 [No/No].
  *   *Preparation:* Build the deck to match **World A**. This is the ground truth they are sampling from. Tell them the world is either A or B, but you (the facilitator) know it is one of them. (For the activity to work as a simulation, the deck *must* match the distribution of the True World, otherwise the probabilities lie. Set World A as True).

  **Deck 2 (Round 2: Sparse World)** - *Total 300 Cards*
  *   *Note:* 300 cards is bulky. If you must scale down, keep the ratios identical (e.g., 30 cards: 1.2 Ravens is impossible. Use 60 cards: 2 BR, 0 WR, 20 BN, 38 NBN vs 1 BR, 1 WR, 20 BN, 37 NBN). **For this plan, I assume you build the full 300 to preserve the "feel" of scarcity.**
  *   **World A (Truth):** 12 [Yes/Yes], 100 [No/Yes], 188 [No/No]. 0 [Yes/No].
  *   **World B (Alternative):** 11 [Yes/Yes], 1 [Yes/No], 101 [No/Yes], 187 [No/No].
  *   *Preparation:* Build the deck to match **World A**.

  ### B. The Sampling Protocols (Team Roles)
  Assign one protocol per team. They must stick to it for both rounds.
  1.  **Raven-Samplers:** Draw card. Open **Left** (Raven?). If NO, close and return (do not look at Right). If YES, open **Right** (Color), record, close, return.
  2.  **Non-Black-Samplers:** Draw card. Open **Right** (Color?). If YES (Black), close and return (do not look at Left). If NO (Non-Black), open **Left** (Type), record, close, return.
  3.  **Population-Samplers:** Open Both. Record Type and Color. Return.

  ### C. The Betting Slip (Pre-Registration)
  Hand this out before Round 1 starts.
  > **PRIVATE BET**
  > We are trying to distinguish World A from World B.
  > In your team, agree on a number: **How many "Green Apples" (Non-Black Non-Ravens) provide the same evidence strength as one "Black Raven"?**
  > Write this number down. Seal it in an envelope. Do not open until the end.
  > *Team Name:* _______________
  > *Exchange Rate:* _______ Apples = 1 Raven

  ---

  ## 2. Timeline & Run of Play

  ### 00:00 – 00:10: Setup & Pre-Registration
  *   **Divide:** 3 Teams of 6. Assign protocols (Raven, Non-Black, Population).
  *   **Brief:** "There are two possible worlds, A and B. One is real. You hold the deck of the real world. You do not know which distribution it matches. Your goal is to gather evidence to bet on A or B."
  *   **Distribute:** Hand out the **Round 1 Deck** (shuffled) and the **Betting Slip**.
  *   **Task:** Teams discuss and seal their "Exchange Rate" bet.
  *   **Constraint:** "You may only look at the data your protocol allows. If you are caught looking at forbidden data, your team loses 50% of final points." (You must patrol this).

  ### 00:10 – 00:40: Round 1 (The Dense World)
  *   **Action:** Teams draw 12 cards each (36 total observations from the 100-card deck).
  *   **Recording:** They tally their results on a whiteboard.
      *   Raven Team: Count Black Ravens vs. White Ravens (expect 0 White).
      *   Non-Black Team: Count Green Apples vs. Black Shoes.
      *   Population: Count everything.
  *   **Interim Check (Min 30):** Ask teams to raise hands if they feel they know which World it is. (Population and Raven will likely be confident; Non-Black should be uncertain but leaning).
  *   **Reset:** Collect Deck 1.

  ### 00:40 – 01:10: Round 2 (The Sparse World)
  *   **Brief:** "Same Worlds A and B. New Deck. Different distribution."
  *   **Action:** Distribute **Round 2 Deck** (300 cards). Teams draw 12 cards each.
  *   **Friction:** This round feels slower. Ravens are rare. Non-Blacks are common.
  *   **Observation:** The Raven team might find 0 or 1 Raven in 12 draws. The Non-Black team will find almost exclusively Apples.
  *   **Reset:** Collect Deck 2.

  ### 01:10 – 01:20: Calculation & Final Bet
  *   **Task:** Teams calculate their posterior confidence.
  *   **Question:** "Based on your 12 draws, which World is it? And was your Pre-Registered Exchange Rate correct?"
  *   **Reveal:** Ask the Non-Black team: "Did your Green Apples move your confidence?" Ask the Raven team: "How much did your Ravens move it?"
  *   **Collect:** Final bets on World A vs. B.

  ### 01:20 – 01:30: The Debrief (The Reveal)
  *   **Open Envelopes:** Compare their pre-registered Exchange Rates to the mathematical truth.
  *   **Name It:** "This is Hempel's Raven Paradox."
  *   **The Math (Board Work):**
      *   **Round 1:**
          *   Black Raven: $P(A)/P(B) = 30/10 = 3$. (Strong evidence).
          *   Green Apple: $P(A)/P(B) = 50/30 = 1.67$. (Weak evidence).
          *   **Ratio:** $3 / 1.67 \approx 1.8$. (Truth: ~2 Apples = 1 Raven).
      *   **Round 2:**
          *   Black Raven: $12/11 \approx 1.09$.
          *   Green Apple: $188/187 \approx 1.005$.
          *   **Ratio:** Log-odds comparison $\approx 16$. (Truth: ~16 Apples = 1 Raven).
  *   **The Lesson:**
      1.  **Contrapositive:** "All Ravens are Black" is equivalent to "All Non-Black things are Non-Ravens." Checking an apple checks the second statement.
      2.  **Nicod's Criterion:** Instances confirm generalizations. An apple *is* an instance of the contrapositive.
      3.  **Background Knowledge:** The paradox vanishes when you specify the alternative world. The weight of the apple depends entirely on how many white ravens exist in the alternative world (World B) vs. how many green apples exist.
      4.  **Selection Bias:** "Why didn't we go find an apple?" Because *searching* for a non-black thing introduces bias. Being *handed* one at random is the evidence. If you go look for an apple, you are sampling from the "Non-Black" population, not the "Universal" population.

  ---

  ## 3. Physical Controls & Enforcement

  **The "Folded Card" Mechanism:**
  *   Print cards on A4 paper, folded into quarters.
  *   **Panel 1 (Outer):** ID Number.
  *   **Panel 2 (Inner Left):** RAVEN? (YES/NO).
  *   **Panel 3 (Inner Right):** BLACK? (YES/NO).
  *   **Panel 4 (Back):** Blank.

  **Enforcement Protocol:**
  *   You (the facilitator) cannot watch 18 hands simultaneously.
  *   **The Auditor:** Appoint one student in each team as the "Compliance Officer." Their only job is to watch their teammates' hands. Rotate this role every 4 draws.
  *   **The Penalty:** If a team is caught (by you or an auditor from another team), they must discard their last 3 draws. This creates peer pressure to follow the rules.

  **The Payoff (No Money):**
  *   **Epistemic Points:**
      *   Correctly identifying World A: 10 Points.
      *   Pre-Registration Accuracy: Points awarded for closeness to the true ratio (2 for Round 1, 16 for Round 2).
      *   **Prize:** Winning team chooses the topic for the next seminar, or gets a "Pass" on one short reflection question.

  ---

  ## 4. Predictable Failure Modes & Fixes

  **1. The "Bored Apple" Problem**
  *   *Risk:* In Round 2, the Non-Black team draws 12 Green Apples in a row. They will feel they learned nothing. They will disengage.
  *   *Fix:* Before Round 2 starts, explicitly tell them: "In this round, evidence will be scarce. Your job is to measure the *absence* of counter-evidence." Remind them that finding a Black Shoe (Black Non-Raven) would be catastrophic evidence against World A. The tension is in *not* finding a shoe.

  **2. The "Cheating" Temptation**
  *   *Risk:* Raven-samplers will peek at the color of a non-raven just to see.
  *   *Fix:* Use the "Compliance Officer" rotation. Make it a game of policing. If Team A catches Team B cheating, Team A gets a bonus point.

  **3. The Math Confusion**
  *   *Risk:* Students won't understand why 188/187 matters.
  *   *Fix:* In the debrief, do not use fractions immediately. Use frequencies. "In World A, you expect 188 apples. In World B, you expect 187. You saw 12. Which world makes 12 apples more likely?" (Actually, keep it to the Likelihood Ratio on the board).
  *   *Visual Aid:* Draw two jars. Jar A has 188 green balls. Jar B has 187 green balls. You pull one. It's green. Which jar? It's barely different, but it *is* different.

  **4. Time Overrun**
  *   *Risk:* Shuffling 300 cards takes forever.
  *   *Fix:* Pre-shuffle Deck 2 before class. Put them in a box, not a deck, to make drawing faster. Or, for Round 2, use a digital randomizer on a projector for the "Draw," but have students record it. *Recommendation:* Stick to physical cards for Round 1. For Round 2, if you are short on time, reduce the deck to 60 cards but keep the 16:1 ratio (4 BR vs 1 WR, 38 NBN vs 37 NBN). Acknowledge this scaling in the debrief.

  ---

  ## 5. Limitations (What You Must Supply)

  Be honest with yourself about what this activity *cannot* do. You must bridge these gaps in the final 10 minutes.

  1.  **The "Infinite World" Assumption:**
      *   *Activity:* We specified finite worlds (100 and 300 objects).
      *   *Reality:* The actual Raven Paradox assumes an open, potentially infinite universe.
      *   *Your Job:* Explain that the paradox feels intuitive because we *don't* know the background distribution of apples vs. ravens. The activity removes the paradox by *giving* them the background knowledge. The philosophical problem is how to reason when we *don't* have the numbers I just gave you.

  2.  **The "Search" vs. "Sample" Distinction:**
      *   *Activity:* Students sampled from a fixed deck (Random Sampling).
      *   *Reality:* In real life, we go look for ravens. We don't wait for the universe to hand us objects.
      *   *Your Job:* Explain that if the Non-Black team had gone to a fruit bowl to find an apple, the evidence value drops to zero (Selection Bias). The activity forces random sampling to make the math work. You need to explain why "finding" an apple is different from "being given" one.

  3.  **The "Seriousness" of the Hypothesis:**
      *   *Activity:* Arbitrary Worlds A and B.
      *   *Reality:* "All Ravens are Black" feels like a law of nature. "All Non-Black things are Non-Ravens" feels like a linguistic trick.
      *   *Your Job:* Acknowledge that psychological "projectability" (Goodman's Grue) makes us care more about Ravens. The math says they are equivalent; our brains say they aren't. The activity proves the math; it doesn't fix the brain.

  ---

  ## 6. Facilitator Script Snippets

  **Opening:**
  > "I am not going to tell you what this is about. I am going to give you a problem. There are two worlds. One is real. You have to figure out which one. But you are blindfolded. You can only touch one part of the object. Go."

  **Mid-Session (Round 2):**
  > "I hear the Raven team is bored. You haven't seen a raven in 10 draws. Good. That boredom is data. The Non-Black team, you've seen 12 apples. Do you feel like you know nothing? Check your confidence slider. Did it move? Even a millimeter?"

  **The Debrief:**
  > "Open your envelopes. Who guessed 2? Who guessed 100? The math says 2 for the first game, and 16 for the second. Why did the value of an apple change? The apple didn't change. The *world* changed. That is the paradox. The evidence isn't in the object; it's in the difference between the possible worlds."
