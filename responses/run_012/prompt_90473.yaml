prompt: |-
  I'm running a 90-minute session for 18 second-years in a philosophy of science unit and I want them to actually feel the raven thing rather than hear me explain it. They shouldn't hear Hempel's name, or the word paradox, until teh last ten minutes.

  The engine I want the activity built around is a flock with two fully specified possible worlds, and teams that are each only allowed to read one attribute off each object they inspect. Something like: world A is 30 black ravens, 20 black non-ravens (shoes, whatever), 50 non-black non-ravens (green apples); world B is 10 black ravens, 20 white ravens, 40 black non-ravens, 30 non-black non-ravens. Both worlds have 100 objects, 30 ravens and 50 non-black things, so a green apple is 50/100 likely under A and 30/100 under B -- a likelihood ratio of 5/3, which makes two green apples worth about one black raven (that one is 30/100 against 10/100, ratio 3). That's the thing I want them to feel in their chest: green apples are evidence, and it takes about two of them to match a black raven, when I'd bet the room's instinct is that green apples tell you nothing or that you'd need a million. Bonus: the black shoe they'll all dismiss is 20/100 against 40/100, so it's real evidence for the other side.

  Then a second round, same shape but a sparse flock: 300 objects, 12 ravens, 188 non-black things, with the alternative world differing by a single white raven. There a green apple is 188/187 against a black raven's 12/11, so roughly sixteen apples to a raven. Same observation type, same reasoning, wildly different weight -- I want them to have to reconcile that.

  Three teams of six, three sampling protocols: raven-samplers (draw at random, and if the card isn't a raven slide it back unseen and draw again), population-samplers (record everything), non-black-samplers (if it's black, back it goes unseen). Twelve observations each, no lecture up front.

  Build me the whole runnable thing: materials and how you physically stop a team reading the attribute their not allowed to use, the payoff scheme without real money, a pre-registration step before any data is drawn (each person privately writes down how many green apples would move their confidence as much as one black raven, and we compare with 2.15 and 16 at the end), the scoring, a timeline, and a debrief that maps what happened onto the actual structure of the problem -- the contrapositive, the criterion that a generalization is confirmed by its instances, why specifying the alternatives is doing all the work here, and why going and finding a green apple to check would be worth nothing whereas being handed one at random is not. Tell me what predictably goes wrong the first time and how to head it off, and be honest about which part of the original problem the activity can't reproduce and I'll have to supply myself. No readings or citations, I just want the activity.
