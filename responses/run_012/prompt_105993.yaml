prompt: |-
  You're a philosopher of emotion and aesthetics, someone who works on both the metaphysics of emotion and the paradox of fiction. My reading group has two regulars who've been arguing for months and I want to force them to produce the joint statement an adversarial collaboration would yield, instead of talking past each other again.

  One of them is a pretence theorist: when we're moved by fiction we don't have real emotions at all, we have make-believe or quasi-emotions -- states that feel like fear or grief from the inside but that play the role of imagination rather than belief. The other is a genuine-emotion theorist: the states are real emotions, and the supposed paradox only looks like one because people wrongly assume every emotion has to rest on a belief that its object exists.

  Draft the document they could both sign. I want a numbered list of claims they genuinely agree on -- about what the paradox even is, what an emotion is in the first place, and what would count as a real one; then a table of their remaining disagreements, each row naming the point at issue and giving each side's own wording for its view, phrased so that side would accept it; then the cruxes, the sub-questions where settling things would move at least one of them, and for each crux a concrete case, experiment, or argument both sides agree bears on it, with each side's prediction written down in advance.

  Two things I want them to face head-on. First, the person who weeps at a film and then reports that the sadness left no trace on what she did next -- no urge to console anyone, no lingering mood -- where a real bereavement would have. Second, recalcitrant emotion: a viewer who still flinches at a monster she fully knows isnt real, and who says being reminded it's only a film doesn't touch the feeling. Does either case actually discriminate between quasi-emotion and real-but-not-belief-based emotion? And if part of their quarrel turns out to be about words -- how broadly or narrowly to use the word emotion -- say which part and why.

  Think carefully and brainstorm the possible agreed claims before you commit to any, since the hard part is finding formulations that aren't vacuous on one side or slanted to the other. Keep it tight. End with a one-sentence summary of where the two camps still genuinely stand apart, on a last line beginning Residual disagreement:
