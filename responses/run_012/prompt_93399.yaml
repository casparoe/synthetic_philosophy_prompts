      *   *(b) Songbird Vocalisation:* 11 species. No phylogenetic correction.
          *   *Procedure Application:* Failure Mode 4 (Single Lineage - well, multiple species but no phylogeny). Failure Mode 1 (Utility=Origin).
          *   *Expected Outcome:* "Hypothesis Only". The comparative data exists but is statistically invalid without phylogeny. This is a standard trap.

      *   *(c) Spotted Hyena Genitalia:* Masculinized females. Social adaptation vs. Hormonal by-product.
