          *   Must handle four specific failure modes: (1) Current utility = Origin, (2) Design argument, (3) Unfalsifiability, (4) Single lineage.
          *   Must specify questions, stopping points, hand-offs, and verdict labels.
          *   Must distinguish between non-adaptive alternatives (by-product, constraint, exaptation, drift) where possible, or flag them as open.
          *   Must test the procedure on three specific manuscripts (a, b, c).
          *   One test case must yield an unwelcome result (stress test).
          *   Must conclude with limitations and temptation points.
      *   **Tone:** Professional, practical, direct, usable by a new AE. No literature review.

  2.  **Deconstruct the Problem:**

      *   *The Core Conflict:* The Gould-Lewontin critique warns against "Just-So Stories." The current guideline is too vague ("address alternatives") leading to inconsistency. Reviewers are either too lax (function = origin) or too strict (demanding impossible population genetics).
      *   *The Goal:* A heuristic that filters out bad adaptationism without demanding impossible proof, acknowledging the limits of behavioral/field data.
      *   *The Time Limit:* 45 minutes means I can't run new analyses. I have to evaluate what's *in* the text.
      *   *The Expertise Limit:* I can't judge complex phylogenetic models. I need to check if they *tried* to account for phylogeny, not if the model is perfect.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Definition Check.* Does the paper claim adaptation? If not, skip. If yes, proceed.
      *   *Step 2: The "Current Utility" Trap.* Do they distinguish function now vs. origin?
      *   *Step 3: The "Design" Trap.* Do they acknowledge complexity isn't proof?
      *   *Step 4: Comparative/Phylogenetic Evidence.* This is crucial for behavioral bio. Did they compare relatives?
      *   *Step 5: Alternatives.* Did they explicitly list non-adaptive hypotheses?
      *   *Step 6: Falsifiability.* Could their data have disproven the claim?

      *Refining the Verdicts:* I need specific labels.
      *   *Accept:* Adaptation claim supported.
      *   *Revise:* Claim too strong for evidence (tone down to "function" or "hypothesis").
      *   *Reject:* Adaptationism is the only point and it's unsupported.
      *   *Defer:* Needs expert input (phylogenetics).

      *Refining the "Non-Adaptive Alternatives":*
      *   Constraint/By-product: Can field data rule this out? Usually no. Can we flag it? Yes.
      *   Drift: Hard to rule out without pop gen. Flag as open.
      *   Exaptation: Can comparative data help? Yes (ancestral state).

      *Addressing the 4 Failure Modes:*
      1.  Utility = Origin: Check if they distinguish current function from evolutionary history.
      2.  Design: Check if they mention trade-offs or costs.
      3.  Unfalsifiability: Check if they state what data *would* refute them.
      4.  Single Lineage: Check if they have a comparative context.

  4.  **Developing the Decision Procedure (The "Algorithm"):**

      *   *Input:* Manuscript + Reviews.
      *   *Time:* 45 mins.
      *   *Flow:*
          1.  Identify the Claim.
          2.  Check for Failure Mode 1 (Utility/Origin).
          3.  Check for Failure Mode 4 (Single Lineage/Phylogeny).
          4.  Check for Failure Mode 3 (Falsifiability).
          5.  Check for Failure Mode 2 (Design/Perfection).
          6.  Assess Alternatives.
