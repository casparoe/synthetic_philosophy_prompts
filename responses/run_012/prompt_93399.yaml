answer: |-
  # DECISION PROCEDURE: ADAPTATION CLAIM ASSESSMENT (DACA)

  **Purpose:** To standardize the evaluation of adaptation claims in behavioural and evolutionary biology manuscripts without requiring population-genetic modeling expertise from the Associate Editor (AE).
  **Time Budget:** 45 minutes.
  **Scope:** Applies only when the manuscript explicitly claims a trait is an *adaptation* (selected for its current function), not merely when it describes a trait's current function.

  ---

  ## PART 1: THE PROCEDURE

  ### Step 1: The Claim Identification (5 mins)
  **Question:** Does the manuscript explicitly claim the trait is an **adaptation** (i.e., shaped by natural selection *for* its current role), or does it describe **current utility** (i.e., the trait currently confers a benefit)?
  *   **Check:** Search for "adapted for," "selected for," "evolutionary function," vs. "current function," "role," "utility."
  *   **If Current Utility only:** Stop. Proceed as a standard physiology/behaviour manuscript. No adaptation assessment needed.
  *   **If Adaptation claimed:** Proceed to Step 2.

  ### Step 2: The Single Lineage Check (Failure Mode 4) (10 mins)
  **Question:** Is the trait assessed in only one species (or one terminal taxon) without reference to close relatives or ancestral states?
  *   **Yes:** The manuscript cannot distinguish origin from current utility.
      *   **Action:** Stop. Verdict: **Current Function Only**.
      *   **Requirement to Pass:** Authors must either (a) provide comparative data across a phylogeny, or (b) retract the adaptation claim and frame as a hypothesis about origin based on mechanistic plausibility.
  *   **No:** (Comparative data provided). Proceed to Step 3.

  ### Step 3: The Phylogenetic Independence Check (10 mins)
  **Question:** If comparative data across multiple species is used, do the authors account for shared ancestry (e.g., independent contrasts, phylogenetic GLM)?
  *   **Note:** You are not judging the *correctness* of the model, only its *presence*.
  *   **No:** The data points are not statistically independent. The pattern may be due to common descent, not selection.
      *   **Action:** Stop. Verdict: **Adaptive Hypothesis**.
      *   **Requirement to Pass:** Re-analyze with phylogenetic correction.
  *   **Yes:** Proceed to Step 4.

  ### Step 4: The Falsifiability Check (Failure Mode 3) (10 mins)
  **Question:** Do the authors state what evidence *would have* refuted their adaptation hypothesis?
  *   **Check:** Look for a sentence in the Discussion or Methods specifying a predicted pattern that, if absent, would reject the adaptation claim.
  *   **No:** The story accommodates any outcome (Just-So Story).
      *   **Action:** Stop. Verdict: **Unsubstantiated Adaptationism**.
      *   **Requirement to Pass:** Authors must specify falsifiable predictions or downgrade claim to **Adaptive Hypothesis**.
  *   **Yes:** Proceed to Step 5.

  ### Step 5: The Alternative Hypotheses Check (Failure Modes 1 & 2) (10 mins)
  **Question:** Do the authors explicitly test or discuss at least one non-adaptive alternative (Constraint, By-product, Exaptation, Drift)?
  *   **Check:** Look for a specific section or paragraph dedicated to "Alternative Explanations."
  *   **No:** Design argument assumed (intricacy = adaptation).
      *   **Action:** Stop. Verdict: **Unsubstantiated Adaptationism**.
  *   **Yes:** Proceed to Verdict Assignment.

  ### Step 6: Verdict Assignment
  Based on the stops above, assign one of the following four labels.

  1.  **ADAPTATION CONFIRMED**
      *   *Criteria:* Passed Steps 2–5. Comparative data + Phylogenetic correction + Falsifiability + Alternatives addressed.
      *   *Meaning:* The claim that selection shaped the trait for its current role is supported by the data provided.
  2.  **CURRENT FUNCTION ONLY**
      *   *Criteria:* Failed Step 2 (Single Lineage).
      *   *Meaning:* The trait does a job now, but the paper cannot demonstrate it was *selected* for that job.
      *   *Distinction:* Collapsing this with **Adaptation Confirmed** misleads readers into thinking evolutionary history is resolved when it is not.
  3.  **ADAPTIVE HYPOTHESIS**
      *   *Criteria:* Failed Step 3 (No Phylo correction) OR Failed Step 5 (Alternatives mentioned but not tested).
      *   *Meaning:* The story is plausible and consistent with data, but confounding variables (ancestry, constraints) are not ruled out.
      *   *Distinction:* Collapsing this with **Unsubstantiated Adaptationism** punishes plausible science that needs more work; collapsing it with **Adaptation Confirmed** lowers the evidentiary bar.
  4.  **UNSUBSTANTIATED ADAPTATIONISM**
      *   *Criteria:* Failed Step 4 (Unfalsifiable) OR Failed Step 5 (Alternatives ignored).
      *   *Meaning:* The manuscript relies on logical fallacies (utility = origin, design = history).
      *   *Distinction:* Collapsing this with **Adaptive Hypothesis** validates bad logic. This verdict requires major revision or rejection.

  ---

  ## PART 2: NON-ADAPTIVE ALTERNATIVES DISCRIMINATION

  This procedure **cannot** definitively discriminate between the following without data types outside the scope of a 45-minute desk check (e.g., population genetics, developmental knockout studies).

  | Alternative | Can Procedure Discriminate? | Action if Uncertain |
  | :--- | :--- | :--- |
  | **Drift** | **No.** Requires population genetic modeling ($N_e s$). | Flag as **Open**. Manuscript must acknowledge drift cannot be ruled out. |
  | **Developmental Constraint** | **No.** Requires embryological/manipulative data. | Flag as **Open**. Manuscript must acknowledge constraint as viable alternative. |
  | **By-product (Spandrel)** | **Partial.** If comparative data shows trait appears *after* the selected trait, it suggests by-product. | If ancestral state unknown, verdict defaults to **Adaptive Hypothesis**. |
  | **Exaptation** | **Partial.** If comparative data shows trait existed *before* current function. | If supported, verdict is **Adaptation Confirmed** (for new role) but text must note exaptation. |

  **Rule:** If the procedure cannot discriminate, the manuscript is **not permitted** to conclude "It is not a by-product." It must conclude "Data are consistent with adaptation, but by-product remains possible."

  ---

  ## PART 3: HAND-OFF PROTOCOLS

  *   **AE (You):** You run the procedure. You assign the Verdict Label. You write the decision letter using the label definitions.
  *   **Authors:** They must revise the text to match the Verdict Label. If they receive **Current Function Only**, they must remove "adaptation/selected for" language from the Abstract and Conclusion.
  *   **Editor-in-Chief (EiC):** Hand-off *only* if:
      1.  Reviewers recommend Accept, but Procedure yields **Unsubstantiated Adaptationism**.
      2.  Reviewers recommend Reject, but Procedure yields **Adaptation Confirmed**.
      3.  *Reason:* This indicates a systemic disagreement on evidence standards that requires board-level policy clarification, not just a manuscript decision.

  ---

  ## PART 4: TEST CASES

  ### Manuscript (a): The Human Chin
  *   **Claim:** Chin is a mechanical adaptation to resist chewing loads.
  *   **Evidence:** Bone thickness and trabecular orientation in *Homo sapiens*.
  *   **Rivals:** By-product of face reduction; contested developmental evidence.
  *   **Procedure Run:**
      1.  **Claim:** Adaptation (Yes).
      2.  **Single Lineage:** Yes. Only *H. sapiens* analyzed. Fossil comparison is minimal/contested.
      3.  **Stop:** Step 2.
  *   **Verdict:** **CURRENT FUNCTION ONLY**.
  *   **Rationale:** Biomechanics show what the chin *can* do now, not why it evolved. Without a robust phylogeny of hominins showing the chin appearing *with* chewing loads (and not just face reduction), origin is unproven.
  *   **AE Reaction:** **Annoying.** This will likely force you to ask authors to strip the evolutionary claim from a solid biomechanics paper. You will want to publish the mechanics, but the procedure forbids the evolutionary conclusion.
  *   **Required Revision:** Authors must rewrite to state the chin *resists* load (function), not that it was *selected to* resist load (adaptation). They must acknowledge the by-product hypothesis remains viable.

  ### Manuscript (b): Songbird Vocalisation
  *   **Claim:** Courtship call is an adaptation for mate attraction.
  *   **Evidence:** Comparison of call structure across 11 species.
  *   **Rivals:** None explicitly tested.
  *   **Procedure Run:**
      1.  **Claim:** Adaptation (Yes).
      2.  **Single Lineage:** No (11 species).
      3.  **Phylogenetic Independence:** No correction for shared ancestry.
      4.  **Stop:** Step 3.
  *   **Verdict:** **ADAPTIVE HYPOTHESIS**.
  *   **Rationale:** The correlation exists, but without phylogenetic correction, the pattern could be due to common descent rather than convergent selection.
  *   **AE Reaction:** Acceptable. This is a standard fix.
  *   **Required Revision:** Authors must either run phylogenetic contrasts or downgrade the claim to a hypothesis. They cannot claim "selection drove divergence" without the correction.

  ### Manuscript (c): Spotted Hyena Genitalia
  *   **Claim:** Masculinized female genitalia are a social adaptation (dominance signaling).
  *   **Evidence:** Social rank correlates with androgen levels; fitness benefits observed.
  *   **Rivals:** By-product of selection on males (pleiotropy/hormonal constraint).
  *   **Procedure Run:**
      1.  **Claim:** Adaptation (Yes).
      2.  **Single Lineage:** Borderline (Hyaenidae comparison usually available). Assume Yes for this test.
      3.  **Phylogenetic Independence:** N/A (Single lineage focus, but strong mechanistic/fitness data). *Correction:* If single lineage, Step 2 triggers. However, hyena papers usually include comparative data within Hyaenidae. Let's assume they include 3 hyena species.
      4.  **Phylo Check:** Assume they did not do contrasts (common in mammal behav). Stop Step 3?
      5.  *Alternative Path:* If they provide strong fitness data (survival/reproduction) directly linked to the trait *within* the population, this mitigates the Single Lineage failure slightly, but strictly, Step 2 says No.
      6.  *Strict Application:* Step 2 triggers. **CURRENT FUNCTION ONLY**.
      7.  *Nuance Check:* If they explicitly address the hormonal by-product hypothesis (Step 5) and show fitness variance *independent* of the hormonal constraint...
      8.  *Decision:* To show the procedure's rigor, we apply Step 2 strictly.
  *   **Verdict:** **ADAPTIVE HYPOTHESIS** (Assuming they address alternatives but lack phylo).
  *   **Rationale:** The pleiotropy problem is the core issue. Unless they show the trait can evolve independently of the hormonal mechanism (e.g., via receptor sensitivity), the by-product hypothesis is indistinguishable.
  *   **AE Reaction:** Satisfied. This prevents a "Just-So" social story from overriding endocrinology.

  ---

  ## PART 5: LIMITATIONS AND TEMPTATIONS

  ### What This Procedure Cannot Do
  1.  **It cannot prove Drift.** If a trait is neutral, this procedure will likely classify it as **Adaptive Hypothesis** because neutral traits can look functional. Only population genetics can rule this out. The procedure merely forces authors to admit they haven't ruled it out.
  2.  **It cannot resolve "Spandrel vs. Pendentive" definitions.** It does not decide if a trait *is* a by-product. It decides if the *evidence provided* supports the claim of adaptation. A trait can be a by-product and still pass as **Adaptive Hypothesis** if the authors acknowledge the uncertainty.
  3.  **It cannot judge complex models.** If authors use a Bayesian phylogenetic model, you are checking for its existence, not its convergence diagnostics. You rely on reviewers for the math.

  ### Points of Temptation (Where You Will Want to Overrule)
  1.  **The "Cool Biomechanics" Temptation (Manuscript A):** You will want to let the Human Chin paper claim adaptation because the mechanics are elegant. The procedure will force you to downgrade it. **Do not overrule.** If you do, you reintroduce the inconsistency the board tried to fix.
  2.  **The "Consensus" Temptation:** If three reviewers say "Adaptation Confirmed" but the Procedure says **Current Function Only** (e.g., they missed the Single Lineage failure), you will feel pressure to accept. **Hand off to EiC.** Do not absorb the policy violation yourself.
  3.  **The "Fieldwork Reality" Temptation:** Authors will argue they cannot get phylogenetic data for rare species. The procedure does not care. If they cannot get the data, they cannot make the claim. They must publish as **Adaptive Hypothesis**. This is the trade-off for rigor.

  ### Final Instruction
  Paste the **Verdict Labels** into your decision letter template. Do not write prose explanations for the verdict; use the definitions in Part 1, Step 6. If the authors argue with the label, refer them to this procedure. If they argue with the procedure, refer them to the Editor-in-Chief.
