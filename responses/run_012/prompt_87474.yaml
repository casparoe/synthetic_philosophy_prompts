      *   *Step 3:* Address the "too strong" worry. It's not that *any* procedure is optimization, but that any *successful* identification procedure must be.
      *   *Underdetermination:* Distinguish by focusing on the *pragmatic resolution* rather than the epistemic problem. The "chosen, not found" line is the differentiator.
      *   *AI Pivot:* It's essential because it turns a metaphysical puzzle into a governance problem.

  8.  **Refining the Critique (Self-Correction during drafting):**
      *   Make sure I don't just praise. Tear it apart as requested.
