      *   **Theme:** "What is a system actually representing?"
      *   **Core Claim:** When ontology-determining information is inaccessible, "ontology identification" is a constrained optimization problem, not a discovery problem.
      *   **Skeleton:**
          1.  Behavior consistent with indefinitely many ontologies (gerrymandering predicates).
          2.  Disambiguating information (internals, counterfactuals) is inaccessible/non-existent.
          3.  Therefore, any procedure yielding "the" ontology is actually selecting one optimal relative to constraints (prior, simplicity, etc.).
          4.  Honest question: "Given constraints C, which ontology maximizes O?"
          5.  Corollary: Residual indeterminacy = ontological questions irrelevant to C (success within C, failure outside C).
          6.  Pivot to AI: Debates about "beliefs" or "preferences" are clashes of constraint sets, not facts.
          7.  Punchline: Ontology identification is impossible in the limit, easy in the relevant case, because the relevant case is chosen, not found.
      *   **Specific Concerns:**
          *   (a) Does the argument go through? (Step 3 too strong? Premise 1 dubious?)
          *   (b) Is it interesting or just dressed-up underdetermination?
