      *   *Point 4 (AI):* It's the stakes, not garnish. It moves from "what is it" to "what do we want it to be."

      *Wait, one more check on Step 3:* The user says "any procedure that hands you 'the' ontology is really handing you whichever one is optimal relative to some explicit constraint set."
      *Critique:* Is it always *explicit*? Usually implicit. The argument should say "implicit or explicit." Also, is it always *optimal*? Or just *satisficing*? "Optimal" might be too mathematically rigid. "Best fit" might be safer. But "Optimization" sounds punchier. I'll suggest keeping "optimization" but defining the objective function broadly.

      *Check on "Underdetermination":* The standard reply to "this is just Quine" is "Quine stops at the problem; I'm proposing the solution mechanism." The mechanism is *constraint specification*.

