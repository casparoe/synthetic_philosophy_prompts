answer: |-
  Here is the specification for the theory of letter identity, structured as requested.

  ### I. Desiderata for a Theory of Letter Identity

  The following requirements define the necessary conditions for a shape $S$ to be identified as the letter $a$ (lowercase Latin) within the context of a generative design system.

  **1. Robustness to Stylistic Variation**
  *   **Requirement:** The identity conditions must hold across the full topological and geometric variance of accepted forms (single-storey, double-storey, script, blackletter, handwritten, distorted).
  *   **Motivation:** *The Span Case.* A theory that defines $a$ by a specific curve angle or stroke count will fail on italic or script forms. The boundary must be topological or functional, not metric.
  *   **Status:** **Non-Negotiable.** (If the generator cannot produce valid script or sans-serif $a$'s, it fails the core brief.)

  **2. Sensitivity to Directional Invariants**
  *   **Requirement:** The theory must encode orientation (left/right, up/down) as constitutive of identity, not accidental. A mirror-image $a$ must be classified as *not-$a$, even if topologically identical.
  *   **Motivation:** *The Near-Miss Case.* Unlike physical objects (cups), symbols are defined by their orientation relative to a reading direction. A mirrored $a$ is a different symbol or nonsense.
  *   **Status:** **Non-Negotiable.** (Essential for distinguishing $b$, $d$, $p$, $q$.)

  **3. Script/System Dependence**
  *   **Requirement:** Identity cannot be determined by shape alone. The theory must include a parameter for "Script Membership" (e.g., Latin vs. Cyrillic) that overrides visual identity.
  *   **Motivation:** *The Homoglyph Case.* The Cyrillic $а$ is visually indistinguishable from the Latin $a$ in many fonts but is a different letter with a different value. Shape is necessary but not sufficient.
  *   **Status:** **Non-Negotiable.** (Without this, the system cannot distinguish between homographs in multi-script environments.)

  **4. Accommodation of Graded Membership**
  *   **Requirement:** The theory must account for typicality effects without collapsing into fuzzy logic that loses the boundary. It must distinguish "degenerate $a$" from "not-$a$."
  *   **Motivation:** *The Typicality Case.* Readers agree that some $a$'s are "better" examples. A generative system needs to know where the "center" of the category is to avoid drifting into ambiguity during style transfer.
  *   **Status:** **Negotiable.** (For a generator, a binary "valid/invalid" switch is sufficient *if* the optimization function handles quality. However, a theory without gradients cannot explain *why* some valid $a$'s look wrong.)

  **5. Distinction of Identity from Quality**
  *   **Requirement:** The conditions for *being* an $a$ must be distinct from the conditions for *being a good* $a$. A malformed, smudged, or ugly $a$ must satisfy the identity conditions even if it fails quality conditions.
  *   **Motivation:** *The Identity vs. Quality Case.* Legibility and aesthetics are performance metrics, not identity metrics. Conflating them prevents the system from recognizing valid inputs or generating "gritty" styles.
  *   **Status:** **Non-Negotiable.** (Crucial for separating the "what" from the "how well" in the generation logic.)

  **6. Relational/Systemic Definition**
  *   **Requirement:** The identity of $a$ must be partially defined by its difference from neighbors ($d$, $g$, $o$, $u$). The theory must allow for structural motifs to be shared across the alphabet while maintaining distinctness.
  *   **Motivation:** *The Alphabet as a System Case.* In many typefaces, $a$ and $o$ share a bowl; $a$ and $d$ share a stem. Identity is maintained by the *arrangement* of parts relative to the system's constraints.
  *   **Status:** **Non-Negotiable.** (Required for the *Letter Spirit* goal of family consistency. You cannot design an $a$ in a vacuum.)

  **7. Separability of Style and Identity**
  *   **Requirement:** The theory must posit a representation where "style" parameters can vary while "identity" parameters remain fixed.
  *   **Motivation:** *The Category-by-Style Grid.* The core engineering challenge is to vary the look without changing the letter. The theory must support this factorization.
  *   **Status:** **Non-Negotiable.** (This is the architectural premise of your program. If style and identity are fused, the program cannot generalize.)

  **8. Normative Grounding**
  *   **Requirement:** The theory must locate the authority for identity in the conventions of the writing community, not just in the physical properties of the mark.
  *   **Motivation:** *The Normativity Case.* A shape is an $a$ because users agree to treat it as one. This explains why new styles are accepted (if the community accepts them) and why errors are corrected.
  *   **Status:** **Negotiable.** (For a program, you can hard-code the norm rather than modeling the community. But for the *theory*, this explains where the rules come from.)

  **9. Contextual Sensitivity**
  *   **Requirement:** The theory must specify the degree to which surrounding glyphs disambiguate identity.
  *   **Motivation:** *The Context Case.* An ambiguous mark between $c$ and $e$ may be resolved by the word context. The theory must say if the mark *itself* is an $a$, or if it is an $a$-functioning mark.
  *   **Status:** **Negotiable.** (If your program generates isolated glyphs, you can assume canonical context. If it generates words, this becomes NN.)

  **10. Cognitive Plausibility**
  *   **Requirement:** The representation of $a$ should not exceed the computational or memory constraints of human recognition (e.g., no infinite precision coordinates).
  *   **Motivation:** *Psychological Fit.* If the theory requires a representation humans couldn't possibly use, it fails to explain the "competent reader" benchmark.
  *   **Status:** **Negotiable.** (Your program can use high-precision vectors even if humans use coarse coding, provided the *output* matches human judgment.)

  ---

  ### II. Impossibility Results: Conflicting Requirements

  There are tensions in this list that suggest you cannot satisfy all desiderata simultaneously without compromising the nature of the theory.

  **Conflict 1: Script Dependence (3) vs. Pure Shape Robustness (1)**
  *   **The Tension:** Requirement 1 demands that the theory accept *any* shape that looks like an $a$. Requirement 3 demands that it reject shapes that look like an $a$ if they belong to the wrong script (Cyrillic).
  *   **Why they conflict:** If the theory relies on visual features to satisfy Robustness (spanning handwriting to blackletter), it lacks the information to satisfy Script Dependence (which is non-visual). If it relies on metadata tags to satisfy Script Dependence, it risks making the visual shape irrelevant, violating the spirit of Robustness.
  *   **Resolution:** You must admit a **dual-factor theory**. Identity = $f(\text{Shape}, \text{System})$. You cannot have a theory of letter identity based *only* on form. This kills any "visual-only" recognition model.

  **Conflict 2: Relational Definition (6) vs. Intrinsic Invariants (2)**
  *   **The Tension:** Requirement 2 implies $a$ has intrinsic properties (orientation, topology) that make it an $a$ regardless of neighbors. Requirement 6 implies $a$ is defined by its contrast with $d$ and $o$.
  *   **Why they conflict:** If $a$ is defined relationally, then in a system where $d$ does not exist, $a$ might lose its identity or merge with $d$. If $a$ has intrinsic invariants, the system constraints are secondary.
  *   **Resolution:** You must prioritize **Intrinsic Invariants for Identity** and **Relational Constraints for Style**. The "a-ness" is intrinsic; the "family resemblance" is relational. Mixing them leads to circular definitions during generation.

  **Conflict 3: Normativity (8) vs. Psychological Fit (10)**
  *   **The Tension:** Normativity is prescriptive (how readers *should* classify); Psychology is descriptive (how they *do* classify). Children and tired readers often accept "errors" that norms reject.
  *   **Why they conflict:** A theory grounded in community norms will reject marginal cases that a psychological theory would accept as "recognized."
  *   **Resolution:** For a design tool, **Normativity wins**. You are building a tool to create *correct* letters, not to simulate *confused* readers.

  ---

  ### III. The Killer Requirement

  The single requirement that does the most work to eliminate otherwise plausible accounts is **Requirement 3: Script/System Dependence (The Homoglyph Constraint).**

  **Why it is the killer:**
  It eliminates any theory that identifies a letter solely with its visual form (**Naive Perceptualism**) and any theory that identifies a letter solely with its abstract code point (**Digital Encodism**).

  1.  **It kills Naive Perceptualism:** If you claim "an $a$ is a shape with a bowl on the right and a stem on the left," the Cyrillic $а$ refutes you. It has that shape but is not a Latin $a$. Therefore, visual shape is insufficient for identity.
  2.  **It kills Digital Encodism:** If you claim "an $a$ is Unicode U+0061," you fail the *Span* requirement. A handwritten $a$ has no code point until interpreted. You need a theory that bridges the gap between the abstract slot (Latin Alphabet, Position 1) and the physical token (ink on paper).
  3.  **It leaves the "In-Between":** This requirement forces you into a **Functional-Structural** account. The letter is a *role* in a system that *typically* takes a certain shape. This is the only space where your generator can operate: manipulating the shape while preserving the role.

  This requirement is the wedge that forces you to acknowledge that **letter identity is not a property of the image, but a property of the image's relationship to a system.**

  ---

  ### IV. Genuine Requirements vs. Disciplinary Prejudices

  Upon reflection, not all the requirements above are facts about the world; some are artifacts of specific fields. You can drop the prejudices to simplify your theory without losing generative power.

  **1. The Prejudice of Separability (Requirement 7)**
  *   **Source:** *Typography and Engineering.*
  *   **Critique:** The idea that "Style" and "Identity" are cleanly separable variables is a designer's convenience, not a cognitive reality. In extreme styles (e.g., heavy blackletter), the $a$ and $o$ become so similar that identity *depends* on the stylistic differentiation.
  *   **Verdict:** **Drop as a hard constraint.** Treat Style and Identity as coupled variables. Your generator should not assume it can vary style infinitely without risking identity drift. The "grid" is a useful heuristic, not an ontological truth.

  **2. The Prejudice of Psychological Fit (Requirement 10)**
  *   **Source:** *Cognitive Science.*
  *   **Critique:** You are building a machine, not a brain. Requiring your internal representation to match human neural coding is an unnecessary constraint. A vector-based mathematical model may produce perfect $a$'s without mimicking human feature detection.
  *   **Verdict:** **Drop.** Focus on **Output Equivalence** (the generated letter must be recognized by humans) rather than **Process Equivalence** (the generation must happen like a human).

  **3. The Prejudice of Normativity (Requirement 8)**
  *   **Source:** *Linguistics/Philosophy.*
  *   **Critique:** While norms exist, readers are remarkably flexible. A shape counts as an $a$ if it works in context, regardless of whether it violates a style guide. Normativity is a social layer on top of recognition.
  *   **Verdict:** **Soften.** Replace "Normative Grounding" with **"Functional Legibility."** A shape is an $a$ if it successfully performs the function of $a$ in a reading context. This is more operational for a program than appealing to "community disposition."

  **4. The Genuine Core**
  The requirements that remain non-negotiable and free of prejudice are **Robustness (1)**, **Directional Invariants (2)**, and **System Dependence (3)**.
  *   **Robustness** acknowledges the physical reality of variation.
  *   **Directional Invariants** acknowledges the physical reality of orientation in writing systems.
  *   **System Dependence** acknowledges the logical reality of symbolic systems.

  If your theory satisfies these three, it survives the Homoglyph case, the Mirror case, and the Span case. The rest are optimizations for quality or engineering convenience. Build your machinery on the triad of **Form, Orientation, and System Role.** Everything else is styling.
