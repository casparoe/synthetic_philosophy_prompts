      *   *Common Currency:* The scalar nature of $r_t$ (summed in return $G_t$).
      *   *Motivational Pull:* Policy update gradient ($\nabla J$) driven by $r_t$.
      *   *Subject:* The agent (policy network + state).
      *   *Good/Bad Fixer:* The reward function design (human designer or environment dynamics).

  3.  **Deconstruct Task 2: The Fractures (Where it breaks)**
      *   *Provenance:* External (designer) vs. Internal (homeostatic/nociceptive).
      *   *Attitude:* Causal push vs. Phenomenological feel (the "what it is like").
      *   *Intrinsic vs. Instrumental:* Reward is the target of optimization, but does the agent *care*?
      *   *Mattering:* Does the signal matter *to* the system or just *for* the system's performance relative to an external metric?
      *   *Load-bearing:* The "Mattering/Attitude" fracture is crucial for moral status. If there's no "subject of experience," suffering is incoherent. Provenance is secondary (humans can be tortured by external stimuli).

  4.  **Deconstruct Task 3: The Rival Analogy (Reward as Fitness)**
      *   *Mapping:* Reward = Reproductive Fitness. Policy = Genotype/Phenotype. Update = Natural Selection.
      *   *Evaluation:* This removes the *synchronic* experience. Evolution doesn't feel pain; populations shift frequencies. This analogy suggests RL is about *lineage* optimization, not *individual* experience.
      *   *Comparison:* It fares better descriptively for evolutionary algorithms or base models trained once. It fares worse for online RL where the *individual* policy updates. But it strongly undermines the "suffering" claim by making reward a historical statistic, not a present feeling.

  5.  **Deconstruct Task 4: Adjudication & Neuroscience**
      *   *Functionalism:* If function is identical (error minimization, approach/avoid), the internal substrate doesn't matter. Suffering *is* negative reinforcement signal processing.
      *   *Anti-Functionalism:* Qualia matter. A thermostat regulates temperature but doesn't feel cold. Syntax is not semantics.
