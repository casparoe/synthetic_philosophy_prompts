prompt: |-
  I'm in a graduate seminar on judgment and decision making, and we have just finished with the dollar auction and escalation of commitment. Our readings treat escalation as a bias and pre-commitment — declining to enter, fixing a walk-away price in advance — as the standard remedy. In practice, though, organizations more often escape escalation by changing the decider than by changing the decision: a failing project is handed to a new manager or an outside consultant on the reasoning that the incumbent is too invested to judge it. I would like you to reconstruct what that practice presupposes about practical reasons. It seems to assume that a reason generated by a past expenditure belongs to the person who incurred it rather than to the role, so that a successor facing identical prospects is not merely better placed to cancel but genuinely uncommitted, while the incumbent's position is partly constituted by what they have already done. Is that a defensible account of reasons — a kind of authorship or ownership of one's own commitments — or does the practice merely exploit a psychological fact while the normative situation is the same for both parties? Consider also the ledger: the successor is normally given a project whose past spending has been written off or hidden, which changes what they know and not only how they feel. Since the magnitude of what has already been spent may itself be evidence about the project's prospects, can a cost be normatively inert yet evidentially relevant, and does the practice commit itself to an answer? Please distinguish what the practice strictly requires from what it merely fits well with, and say whether it presupposes a unity of the agent over time that the pre-commitment remedy does not.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** Graduate seminar on Judgment and Decision Making (JDM). Topic: Dollar Auction, Escalation of Commitment.
      *   **Standard View:** Escalation is a bias; Pre-commitment (walk-away price, declining to enter) is the remedy.
      *   **Observed Practice:** Organizations often escape escalation by *changing the decider* (new manager/consultant) rather than *changing the decision rule* (pre-commitment).
      *   **Core Question:** Reconstruct what this practice presupposes about *practical reasons*.
      *   **Specific Hypothesis:** Does it assume reasons generated by past expenditure belong to the *person* (authorship/ownership) rather than the *role*? Is the incumbent constituted by past actions while the successor is uncommitted?
      *   **Normative vs. Psychological:** Is this a defensible account of reasons, or does it merely exploit psychology while the normative situation remains identical?
      *   **The Ledger Issue:** Successors often get projects where past spending is written off/hidden. This changes *knowledge* (evidence), not just *feeling*.
      *   **Evidential vs. Normative:** Can a cost be normatively inert (sunk) yet evidentially relevant? Does the practice commit to an answer?
      *   **Requirements vs. Fit:** Distinguish what the practice *strictly requires* vs. what it *fits well with*.
      *   **Unity of Agency:** Does this practice presuppose a unity of the agent over time that the pre-commitment remedy does not?

  2.  **Initial Analysis & Conceptual Mapping:**

      *   *Escalation of Commitment:* Throwing good money after bad due to sunk costs.
      *   *Standard Remedy:* Pre-commitment (Ulysses contract). Assumes the agent is temporally extended and needs to bind their future self.
      *   *Organizational Remedy:* Agent Replacement. Assumes the *agent* matters, not just the *situation*.
      *   *Philosophical Core:* The nature of practical reasons. Are reasons agent-relative or agent-neutral? Do past actions create normative obligations for the *role* or the *person*?
      *   *Sunk Cost Fallacy:* Normatively, sunk costs are irrelevant to future utility. Psychologically, they feel relevant (loss aversion, ego).
      *   *Evidential Value:* High past spending *might* signal high expected value (why else spend so much?), but in escalation contexts, it often signals error. Hiding the number removes the evidence.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis: The practice of changing the decider relies on a hybrid view of reasons that blends psychological realism with a specific (and contestable) theory of agency and authorship. It treats the *incumbent* as normatively distinct from the *successor*, not just psychologically biased.

      *   **1. The Ownership of Reasons (Authorship vs. Role):**
          *   *The Hypothesis:* The prompt suggests the practice assumes past expenditure creates reasons for the *spender*, not the *role*.
          *   *Analysis:* If reasons were purely role-based (agent-neutral within the org), the successor would face the exact same normative landscape. The fact that we swap people implies we think the *relationship* to the past action matters.
          *   *Defensibility:* Is it defensible? There's a "clean hands" argument. The incumbent has *authored* the failure; the successor has not. There is a normative weight to *responsibility* that isn't just about future utility. It's about accountability.
          *   *Counter:* Normatively, only future consequences matter (consequentialism). So, strictly speaking, the situation is identical. The practice exploits the psychological fact that the incumbent *feels* ownership.

      *   **2. The Ledger and Evidential Relevance:**
          *   *The Mechanism:* Hiding/write-offs.
          *   *Normative vs. Evidential:* Sunk costs are normatively inert (don't affect future value) but can be evidentially relevant (signal of prior confidence, quality, or conversely, depth of hole).
          *   *The Practice's Commitment:* By hiding the number, the org treats the cost as *contaminating evidence*. They assume the successor will treat the number as a sunk cost normatively, but the *incumbent* treats it as a reason to continue.
          *   *Nuance:* If the cost is hidden, the successor lacks the evidence. This suggests the org believes the *number itself* triggers the bias, not just the *responsibility*. This leans towards the "psychological exploit" view rather than the "authorship" view.

      *   **3. Requirements vs. Fit:**
          *   *Strict Requirement:* The practice *requires* that the successor's decision function differs from the incumbent's given the same objective prospects. It requires that the *identity* of the decider is a variable in the utility function of the organization.
          *   *What Fits Well:* It fits well with the "Authorship" theory (I own my mistakes). It fits well with the "Psychological Reset" theory (New eyes, no baggage).
          *   *Distinction:* It does *not* strictly require that the incumbent has a *normative* obligation to continue, only that they have a *psychological* compulsion. However, the *ritual* of handing over suggests a transfer of burden, implying a normative shift.

      *   **4. Unity of the Agent:**
          *   *Pre-commitment:* Assumes a *single* agent over time who needs to bind their future self. High unity.
          *   *Agent Replacement:* Assumes *discontinuity*. The "Organization" is the principal, but the "Manager" is an interchangeable agent. It treats the temporal stages of the *role* as potentially different agents.
          *   *Contrast:* Pre-commitment tries to solve the time-inconsistency of *one* agent. Replacement solves the bias by swapping the agent entirely. It presupposes a *fragmented* agency where the "past self" (incumbent) and "future self" (successor) are distinct enough to have different rational permissions.

      *   **5. Synthesis/Conclusion:**
          *   The practice is pragmatically rational but philosophically messy.
          *   It treats sunk costs as *agent-relative reasons* (psychologically) while pretending they are *agent-neutral* (by hiding them from the successor).
          *   It relies on a "fiction of discontinuity" to bypass the "trap of continuity."

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to conflate the Organization's rationality with the Manager's rationality. The prompt asks about *practical reasons*.
      *   *Focus:* The prompt asks: "Is that a defensible account of reasons... or does the practice merely exploit a psychological fact?" I need to take a stance or at least weigh them heavily.
      *   *Key Insight:* The "Write-off" is crucial. If the successor doesn't know the sunk cost, they can't be biased by it. But if the sunk cost is *evidence*, hiding it blinds them. So the practice assumes the *bias* outweighs the *evidence*.
      *   *Agency:* Pre-commitment assumes I am one person. Replacement assumes I can be replaced by someone "clean." This implies the "Role" is the enduring agent, but the "Person" is the source of bias.
      *   *Refining the "Authorship" point:* Does the incumbent have a *reason* to continue because they spent the money? No, that's the fallacy. But do they have a *reason* to *resolve* the situation because they spent the money? Maybe (reputational). The prompt asks if the reason belongs to the person. Yes, reputational reasons are agent-relative.

  5.  **Final Polish:** Check against all constraints in the prompt.
      *   Reconstruct presuppositions about practical reasons? Yes.
      *   Authorship/ownership vs. Psychological fact? Yes.
      *   Ledger/Evidential relevance? Yes.
      *   Normatively inert vs. Evidentially relevant? Yes.
      *   Strictly requires vs. Fits well? Yes.
      *   Unity of agent vs. Pre-commitment? Yes.

  6.  **Tone:** Academic, philosophical, precise, suitable for a graduate seminar context. (Avoid self-help language, use terms like "agent-relative," "normative force," "epistemic access").

  7.  **Final Review of the "Unity of Agent" point:** Pre-commitment *presupposes* unity (I bind myself). Replacement *presupposes* discontinuity (I am not my predecessor). This is a strong contrast to highlight.

  **(Self-Correction on the "Unity" point):** Wait, pre-commitment acknowledges *disunity* in preferences (time inconsistency) but asserts *unity* in agency (I am responsible for my future self). Replacement asserts *disunity* in agency (The successor is not responsible for the predecessor's choices). I need to make sure this distinction is clear.

  8.  **Drafting the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  This is a sophisticated intervention into the standard economic and psychological treatment of escalation. The practice you describe—replacing the decider rather than binding the decision—reveals a tension between the normative theory of rational choice (which treats agents as interchangeable utility maximizers) and the phenomenology of agency (where authorship matters).

  Here is a reconstruction of the presuppositions regarding practical reasons, the evidential status of sunk costs, and the metaphysics of agency implicit in the organizational remedy of agent replacement.

  ### 1. The Ownership of Reasons: Authorship vs. Role
  Your hypothesis is that the practice assumes reasons generated by past expenditure belong to the *person* who incurred them, not the *role* they occupy. This is largely correct, but it requires distinguishing between **normative reasons** and **motivational forces**.

  Strictly speaking, in a consequentialist framework, reasons are agent-neutral regarding the future. The state of the world (the project's prospects) is identical for the incumbent and the successor. If the practice presupposes that the incumbent has a *normative* reason to continue that the successor lacks, it is endorsing the sunk cost fallacy as a valid principle of practical reasoning. It is unlikely organizations explicitly endorse this.

  However, the practice does presuppose that **responsibility is agent-relative.** The incumbent is not merely a calculator of future utility; they are the *author* of the past expenditure. This authorship generates agent-relative reasons that the successor does not share:
  *   **Reputational Reasons:** The incumbent faces a personal cost (loss of standing) upon cancellation that the successor does not.
  *   **Integrity/Consistency Reasons:** The incumbent may feel a normative pull to vindicate their past judgment, a pull that constitutes a form of practical identity.

  Therefore, the practice presupposes that **practical reasons are partially constituted by the history of the agent.** It treats the incumbent's situation as normatively distinct from the successor's, not because the *project* has changed, but because the *relationship to the project's history* has changed. This is a defensible account of reasons only if one accepts that practical rationality includes the maintenance of agency and integrity, not just the maximization of exogenous value. If one holds a strict "view from nowhere" consequentialism, the practice is merely exploiting a psychological weakness (the incumbent's irrational attachment) rather than responding to a genuine normative difference.

  ### 2. The Ledger: Normative Inertia vs. Evidential Relevance
  You raise a crucial point regarding the ledger: the successor is often given a project where past spending is written off or hidden. This maneuver illuminates the practice's stance on the epistemic status of sunk costs.

  *   **Normative Inertia:** The write-off confirms the standard economic view: past costs are normatively inert. They should not enter the successor's utility function.
  *   **Evidential Relevance:** However, the magnitude of past spending *is* evidence. It signals the prior confidence of the organization, the complexity of the task, or the depth of the hole.

  By hiding the number, the organization treats the cost as **epistemically contaminating.** They assume that for the successor, the number functions primarily as an anchor or a trigger for loss aversion, rather than as Bayesian evidence.

  Does the practice commit to an answer on whether a cost can be normatively inert yet evidentially relevant? **Yes.** It commits to the view that the **evidential value is outweighed by the risk of normative confusion.** The organization acts as though the successor *cannot* successfully compartmentalize the evidence. They assume that knowing the sunk cost will inevitably corrupt the successor's judgment, turning evidential data into a normative burden. Thus, the practice requires that **information be managed to preserve rationality.** It presupposes that rational agency is fragile and dependent on epistemic boundaries; a fully informed agent might be *less* rational than a partially blinded one.

  ### 3. Requirements vs. Fit
  It is vital to distinguish what this practice *strictly requires* from what it *fits well with*.

  *   **What it Strictly Requires:** The practice requires only that the **decision function varies by agent identity.** It requires that $Decision(Incumbent, State) \neq Decision(Successor, State)$. It does not strictly require that this difference be due to "ownership of reasons." It could merely be a psychological reset button. The organization needs a discontinuity in choice behavior; the *explanation* for that discontinuity (normative authorship vs. psychological bias) is secondary to the outcome.
  *   **What it Fits Well With:** The practice fits well with the **Authorship Theory** (that the incumbent is uniquely burdened). It creates a ritual of transfer that symbolically absolves the successor. It also fits well with a **Principal-Agent model** where the Organization (Principal) views the Managers (Agents) as interchangeable modules. If the module is malfunctioning (biased), swap the module.

  The danger lies in conflating the two. If the organization believes the Authorship Theory (that the incumbent *ought* to feel bound), they may fail to address the structural incentives that created the escalation. If they acknowledge it is merely a Psychological Fix, they admit their rational agents are systematically irrational, which undermines the authority of the decision-making structure itself.

  ### 4. Unity of the Agent: Pre-commitment vs. Replacement
  Finally, your question about the unity of the agent cuts to the metaphysical core of the two remedies.

  *   **Pre-commitment (The Standard Remedy):** This presupposes a **strong unity of the agent over time.** It assumes that "I" at $t_1$ and "I" at $t_2$ are the same moral and practical entity. Because I am the same entity, I am responsible for binding my future self to protect my past self's intentions. It treats time-inconsistency as a failure of *self-governance* within a single enduring agent.
  *   **Agent Replacement (The Organizational Practice):** This presupposes a **fragmented or discontinuous agency.** It treats the "Manager at $t_1$" and the "Manager at $t_2$" as effectively different agents. The successor is not the "future self" of the incumbent; they are a distinct entity with "clean hands."

  The practice of replacement does not merely solve the time-inconsistency problem; it **dissolves the temporal link.** It presupposes that the organization is the enduring agent, while the human deciders are transient vessels. By swapping the vessel, the organization escapes the normative drag of the past.

  **Conclusion:**
  The practice of changing the decider is not merely a psychological hack; it is a tacit assertion that **practical reasons are agent-relative.** It asserts that the incumbent is normatively "tainted" by their history in a way the successor is not. While this contradicts the strict economic view that only future consequences matter, it aligns with a richer view of agency where responsibility and authorship constrain rational choice.

  However, by hiding the ledger, the practice reveals a cynicism: it admits that while the successor is *normatively* uncommitted, they are not *epistemically* robust enough to handle the evidence of that commitment. Ultimately, this remedy presupposes a **disunity of the agent over time** that pre-commitment explicitly denies. Pre-commitment tries to make the agent consistent across time; replacement accepts that consistency is impossible and seeks salvation in discontinuity.
