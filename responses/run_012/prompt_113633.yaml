answer: |-
  Marcus is closer to right about the legal function of the ordinance, though Dana lands the stronger philosophical blows regarding higher-order vagueness.

  (1) **Defensible.** Dana correctly articulates the epistemicist position that vagueness is ignorance of a sharp boundary, preserving classical logic, though this requires accepting unknowable metaphysical facts.
  (2) **Defensible.** Marcus correctly outlines supervaluationism, where truth depends on precisifications, allowing for truth-value gaps that better match intuition about borderline cases.
  (3) **Clearly Right.** Dana identifies the fatal flaw in standard supervaluationism: if 'admissible' is vague, the theory suffers from higher-order vagueness and cannot define its own truth conditions without reintroducing sharp boundaries.
  (4) **Defensible.** Marcus rightly notes that epistemicism struggles to explain how usage determines a specific sharp boundary, whereas supervaluationism aligns better with the practice of stipulative resolution.
  (5) **Clearly Right.** Dana is correct that numerical thresholds significantly reduce semantic vagueness, creating a dilemma for Marcus: either the amendment works (contradicting the necessity of vagueness) or the vagueness is trivial.
  (6) **Defensible.** Marcus is right that application involves interpretive flexibility (e.g., how height is measured), but he overstates the case by implying '5%' retains the same semantic vagueness as 'exceeds'.

  Marcus is closer to right about the underlying question because legal ordinances function by authoritative stipulation rather than the discovery of pre-existing semantic facts, making the supervaluationist model of "selecting a sharpening" more practically accurate than the epistemicist model of "avoiding error." Both miss the role of measurement uncertainty: 2.09 m is not a metaphysical absolute but an empirical estimate with error bars, which complicates Dana's sharp line and Marcus's semantic indeterminacy alike. They are talking past each other because Dana argues from metaphysics (what makes the proposition true) while Marcus argues from pragmatics (what entitles the board to assert a verdict).

  I am 85% confident in this verdict. The point I am least sure about is the rating of Move 6, as distinguishing between semantic vagueness and operational measurement error in legal contexts is notoriously difficult.
