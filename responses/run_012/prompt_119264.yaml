answer: |-
  The gap between the epistemic foundations of game theory and the solution concept of Nash equilibrium can be stated simply: **Common Knowledge of Rationality (CKR) does not imply Nash Equilibrium.**

  To understand why, we must first disentangle two distinct claims that are often conflated in the definition of an equilibrium.

  ### 1. Two Claims: Internal Consistency vs. External Correctness

  A Nash Equilibrium requires two conditions to hold simultaneously for every player:
  1.  **Internal Rationality:** Each player's choice is a best response to that player's own *beliefs* about what the others will do. (The choice maximizes expected utility given the belief.)
  2.  **External Correctness:** Each player's *beliefs* about what the others will do are *correct*. (The belief matches the opponents' actual choices.)

  Standard definitions of **rationality** in game theory encompass only the first claim. Rationality is an instrumental property: it concerns the efficiency of the means (the choice) relative to the ends (payoffs), given the agent's information (beliefs). It does not guarantee the truth of that information. **Equilibrium**, however, requires the second claim. It demands a coordination of expectations such that the subjective map matches the objective territory.

  The epistemic gap arises because CKR enforces Internal Rationality across all levels of the knowledge hierarchy, but it leaves External Correctness unconstrained.

  ### 2. A Counterexample: Miscoordination with Common Knowledge

  Consider a simple 2×2 Coordination Game between Row and Column.
  *   **Strategies:** Row chooses {Up, Down}; Column chooses {Left, Right}.
  *   **Payoffs:**
      *   If (Up, Left): (2, 2) — *Equilibrium A*
      *   If (Down, Right): (1, 1) — *Equilibrium B*
      *   If (Up, Right) or (Down, Left): (0, 0) — *Miscoordination*

  **The Outcome:** Suppose Row plays **Up** and Column plays **Right**. The payoff is (0, 0). This is **not** a Nash Equilibrium, because Row would prefer Down (given Right) and Column would prefer Left (given Up).

  **The Epistemic State:** Can this outcome occur under Common Knowledge of Rationality? Yes.
  *   **Row's State:** Row plays Up. Row believes Column will play **Left**. Given this belief, Up is a best response (2 > 0). Row is rational. Furthermore, Row believes Column is rational. For Column to rationally play Left, Column must believe Row plays Up. So, Row believes that Column believes Row plays Up.
  *   **Column's State:** Column plays Right. Column believes Row will play **Down**. Given this belief, Right is a best response (1 > 0). Column is rational. Furthermore, Column believes Row is rational. For Row to rationally play Down, Row must believe Column plays Right. So, Column believes that Row believes Column plays Right.

  **Checking the Hierarchy:**
  *   **Level 1:** Both are rational (maximizing given beliefs).
  *   **Level 2:** Row knows Column is rational? Yes, because Row's belief system includes the fact that Column's choice (Left) is optimal given Column's belief (that Row plays Up). Column knows Row is rational? Yes, because Column's belief system includes the fact that Row's choice (Down) is optimal given Row's belief (that Column plays Right).
  *   **Level 3:** Row knows Column knows Row is rational? Row believes Column thinks Row plays Up. If Column thinks Row plays Up, Column thinks Row is maximizing (since Up is BR to Left). So Row attributes knowledge of Row's rationality to Column. The symmetry holds for Column.

  This loop can extend infinitely. Each player inhabits a subjective world where they are coordinating on an equilibrium (Row thinks Equilibrium A; Column thinks Equilibrium B). Both are internally consistent and rational. Yet, objectively, they have miscoordinated.

  **Whose belief is false?**
  *   Row's belief that Column plays Left is false (Column plays Right).
  *   Column's belief that Row plays Down is false (Row plays Up).

  **Why is this not irrational?**
  Holding a false belief is a failure of *epistemic* rationality (truth-tracking), but not *practical* rationality (goal-maximization). Game theory defines rationality practically. If you are given a map that incorrectly shows a bridge where there is none, and you drive off the cliff because you followed the map to minimize travel time, you were practically rational (you optimized given your information) but epistemically unlucky. CKR guarantees that players optimize given their maps; it does not guarantee the maps are accurate.

  ### 3. Why the Hierarchy Cannot Close the Gap

  One might suppose that deepening the hierarchy of knowledge ("I know that you know that I know...") would force beliefs to converge on the truth. It does not.

  The infinite hierarchy of mutual knowledge of rationality constrains only the **relation between each player's beliefs and that player's own choice**. It ensures that my choice fits my belief, and that I believe your choice fits your belief, and so on. It creates a closed system of mutual justification.

  However, the hierarchy never constrains the **fit between those beliefs and the choices they are beliefs about**. The chain of knowledge is a chain of conditionals: *If* you believe X, *then* you do Y. CKR ensures everyone accepts these conditionals. But it does not fix the antecedent. As long as the false beliefs are mutually consistent with the assumption of rationality (as they were in the Coordination Game example), the infinite hierarchy is satisfied. The loop closes internally within the web of beliefs, never anchoring to the external reality of the actual play.

  ### 4. The Missing Condition: Consistency of Beliefs

  To bridge the gap and derive Nash Equilibrium, we must impose a further condition: **Consistency of Beliefs** (sometimes called *Correct Conjectures*).

  *   **Precise Statement:** For every player $i$, the subjective probability distribution $i$ holds over the opponents' strategies must assign probability 1 to the strategies the opponents actually choose.
  *   **Classification:** This is **not** a rationality requirement. It is an **equilibrium condition** or a **coherence requirement of a different kind**.
      *   Rationality is a monadic property (concerning a single agent's mind and action).
      *   Consistency of Beliefs is a dyadic or systemic property (concerning the relation between multiple agents' minds and the world).
      *   It requires a coordination of expectations that rationality alone cannot generate. It essentially assumes away the problem of how players come to agree on which equilibrium to play.

  ### 5. Extension to Extensive-Form Games

  The gap sharpens in extensive-form games (games played over time with trees) because rationality must be assessed at information sets that play may never reach. This brings us to **Backward Induction**.

  **Two Readings of Rationality:**
  1.  **The "Actual Do" Reading:** A player is rational if they maximize utility at every information set that is *actually reached* during play.
  2.  **The "Would Do" Reading:** A player is rational if they maximize utility at *every* information set in the game tree, even those that are not reached (counterfactuals).

  **Backward Induction Requirement:**
  Backward-induction reasoning requires the **"Would Do" Reading**. To decide whether to stop a game early, I must know what you *would* do if I continued. If your rationality is defined only by what you *actually* do (Reading 1), and the node where you would move is never reached because I stop early, then your rationality at that node is undefined. I cannot reason backward from a node where your behavior is unspecified.

  **Why the Second Reading is Substantive:**
  Adopting the "Would Do" reading is not merely verbal; it is a substantive addition to the epistemic assumptions.
  *   Under Reading 1, a player could maintain a "non-credible threat" (e.g., "If you enter the market, I will start a price war that hurts us both"). If you believe the threat and stay out, the node is never reached. The player never actually carries out the irrational price war, so they satisfy Reading 1.
  *   Under Reading 2 (Sequential Rationality), the threat is ruled out. We assume the player *would* maximize at that node, meaning they *would not* start a price war. Knowing this, you enter the market.
  *   This assumption restricts the set of possible "types" or dispositions a player can have. It assumes that rationality is a dispositional property inherent to the agent, not just a description of their observed path. It requires Common Knowledge of Rationality to extend to counterfactual worlds that the players themselves believe will not occur.

  ### 6. The Role of the Common Prior

  Finally, what becomes of the gap if we add the **Common Prior Assumption (CPA)**—the assumption that all players' beliefs derive from the same underlying probability distribution updated by private information?

  In **normal-form (strategic) games**, the CPA helps close the gap. Aumann and Brandenburger (1995) showed that in a two-player game, Common Knowledge of Rationality *plus* a Common Prior implies that the players' beliefs are correct (Nash Equilibrium). The common prior acts as a coordinating device; if we start with the same probabilities and know each other to be rational, our posteriors cannot diverge regarding our actions without violating the common prior logic.

  However, in **extensive-form games**, the CPA is insufficient to fully resolve the difficulty of off-path beliefs. Even with a common prior, players must specify how beliefs are *updated* when an unexpected move occurs (an information set with prior probability zero). Different updating rules (e.g., different assessments of "trembles" or mistakes) can sustain different equilibria. Thus, while the Common Prior narrows the gap in static games, the dynamic gap regarding counterfactual rationality remains, requiring additional refinements like Sequential Equilibrium to fully specify the epistemic conditions.
