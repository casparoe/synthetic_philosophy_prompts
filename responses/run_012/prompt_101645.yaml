  ### The Arithmetic of the Disposition
  To determine the rational disposition, we must evaluate the expected value (EV) of the two possible policies *ex ante*, before the coin is flipped. Omega predicts your disposition, so the letter arrival and the no-letter reward are determined by your global policy, not your local whim at the moment of receiving the letter.

  Let $H$ be Heads (Disaster -$1,000,000) and $T$ be Tails (No Disaster $0). Probability of each is 0.5.
  Let $P$ be the policy "Pay $100 if Letter" and $R$ be "Refuse if Letter".
  Letter Rule: $L \iff (H \oplus \text{Action})$.
  Reward Rule: If $\neg L$, +$10,000 $\iff$ Policy is $P$.

  **Policy 1: Disposed to Pay ($P$)**
  *   **Heads (50%):**
