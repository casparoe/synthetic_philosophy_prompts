answer: |-
  The strongest version of the geometric rationality position argues that expected value maximization is a cognitive error rooted in a confusion between ensemble averages and time averages. Proponents claim that because wealth dynamics are multiplicative and non-ergodic, the arithmetic mean of wealth across possible worlds diverges from the geometric mean along a single lived trajectory. Therefore, maximizing expected log wealth is not merely a expression of risk aversion but an objective requirement for any agent who wishes to survive and grow over time. On this view, the Kelly criterion is not a preference but a physical constraint analogous to thermodynamics; to ignore it is to invite certain ruin, making growth-rate optimization a universally applicable norm independent of subjective utility functions.

  Geometric rationality is not a decision theory at all but a theorem about a restricted class of decision problems, and treating it as a general criterion of rational choice is a mistake. The growth-rate argument derives its force from specific structural premises—repetition, multiplicative dynamics, and wealth as the terminal value—and when any of these premises are dropped, the normative authority of the Kelly criterion collapses into mere instrumental advice or subjective preference.

  To see why, we must examine the mechanics of the ergodicity argument. The theorem holds that for a sequence of independent, multiplicative bets, the time-average growth rate converges to the expected logarithm of wealth. This is mathematically genuine. However, this convergence relies on the limit as the number of trials approaches infinity. In a one-shot bet you will never get to repeat, the law of large numbers does not apply, and the time average does not converge to anything. If you face a single opportunity to bet your entire bankroll on a coin flip that pays 3-to-1 on heads, expected value maximization suggests taking the bet, while Kelly forbids it. The geometric rationalist argues that you should still act as if you were repeating the bet to avoid the habit of ruin. But this smuggles in a preference for survival over expected outcome. If the goal is to maximize the probability of achieving a specific threshold in a single period—say, paying off a debt to avoid immediate default—the optimal strategy may require leveraging far beyond Kelly. The growth-rate theorem dictates nothing here because there is no long run to optimize.

  Furthermore, the argument presupposes multiplicative dynamics where today's capital determines tomorrow's betting capacity. In additive scenarios, where you can earn income independent of your portfolio or where losses do not scale with wealth, the arithmetic mean is the correct optimizer for growth. If I can bet a fixed $100 repeatedly regardless of my net worth, maximizing expected wealth maximizes the growth rate. The Kelly criterion only becomes mandatory when the system forces you to reinvest a fraction of your current total. Most real-world decisions are hybrids; human capital is additive, financial capital is multiplicative. Applying a purely multiplicative solution to a mixed dynamic problem is a category error that sacrifices value for mathematical elegance.

  The most critical premise, however, is that wealth itself is the utility function. The geometric rationalist claims that maximizing growth rate is objective because wealth is the medium of survival. But utility is defined by what wealth can purchase, not the number itself. If utility is bounded—for instance, if you need $1 million to save a life and $10 million provides no additional benefit—then maximizing expected log wealth is irrational. You should instead maximize the probability of crossing the threshold, even if it requires over-betting the Kelly fraction. Conversely, if you have diminishing marginal utility of wealth for consumption purposes, log utility might approximate your preferences, but that makes it a psychological fact about you, not a physical fact about the market. The ergodicity argument attempts to bypass preference by claiming that any other utility function will eventually be outcompeted by log-utility agents in a market selection process. This is an evolutionary argument, not a normative one; it tells you how to survive a competition, not how to achieve your personal goals.

  This fragility is evidenced by the common practice of betting fractional Kelly. If the Kelly criterion were a theorem of rationality akin to logic, betting half-Kelly would be irrational. Practitioners do it because the theorem assumes known probabilities and infinite divisibility, neither of which exist in reality. Estimation error turns a positive expected log return into a negative one if you bet too aggressively. Fractional Kelly is a hedge against model uncertainty, acknowledging that the "optimal" fraction is sensitive to input error. This admission reveals that the criterion is not a hard law of rationality but a heuristic that requires tuning based on risk tolerance and confidence levels. The decision of what fraction to bet is ultimately a preference statement about how much variance in growth rate one is willing to tolerate to avoid drawdowns, not a derivation from first principles.

  Finally, the prescription "don't risk ruin" is often presented as a theorem, but it is actually a boundary condition imposed by the agent. Mathematically, full Kelly avoids zero wealth asymptotically, but in finite time with discrete betting, ruin is possible. To say ruin must be avoided is to assign infinite disutility to zero wealth. That is a preference, not a theorem. If you assign finite disutility to ruin, there exists some positive expected value bet that risks total loss which you should take. The geometric rationalist insists ruin is absorbing and irreversible, which is true for the game, but not necessarily for the agent who might restart or whose utility does not hit zero at zero wealth.

  Geometric rationality is entitled to claim that in repeated, multiplicative games with known odds, maximizing expected log wealth maximizes the long-run growth rate. It is not entitled to claim that this growth rate is the only rational objective for all agents in all contexts. When the repetition vanishes, when dynamics are additive, or when utility diverges from wealth, the theorem loses its normative grip. The surviving prescription is not "maximize geometric mean" but "match your strategy to the dynamics of the game and the shape of your utility." To do otherwise is to mistake a powerful tool for a universal law.
