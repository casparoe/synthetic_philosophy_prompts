      *   *The Singing:* They sing a specific song. "Oh Zilai! What are you becoming? Where are you going? Becoming a rat's liver? Becoming a bug's arm?"
      *   *Confucius's Explanation:* Distinguishes between "within the frame" (ritual, society, Confucian norms) and "outside the frame" (Dao, nature, spontaneity).
      *   *Metaphysics:* Life and death are like day and night, or the changing of seasons. They are phases of *qi* condensation and dispersion.

  3.  **Address Question 1: The Function of the Singing:**
      *   *Not just provocation:* It's an active participation in the transformation.
      *   *The Lyrics:* They aren't singing "Rest in Peace." They are asking "What will you become next?" (Rat's liver, bug's arm). This emphasizes *continuity of substance* despite *discontinuity of form*.
      *   *Ritual Subversion:* Confucian rituals (*li*) are about maintaining social order and distinctions (living vs. dead, honor vs. shame). Singing disrupts the solemnity required to maintain that distinction. It treats the corpse not as a sacred object of grief but as raw material for the next phase.
      *   *Aesthetic/Performative:* It's a way of *enacting* the philosophy. You don't just think death is transformation; you *sing* it into being. It aligns the emotional state of the living with the metaphysical reality of the dead.

