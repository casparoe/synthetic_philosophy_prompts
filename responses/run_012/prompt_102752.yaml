      *   *Source:* Also Chapter 6 (Zilai's speech before dying). "The Great Clod burdens me with form, labors me with life, eases me in old age, rests me in death."
      *   *Connection:* The singing is the *response* to the "rest." If death is rest, mourning is inappropriate. It would be like crying because someone stopped working a hard shift.
      *   *Nuance:* The "Great Clod" passage emphasizes the *benefit* to the individual (rest). The singing emphasizes the *cosmic process* (transformation into other things). Together, they cover the subjective experience (rest) and the objective reality (transformation).

