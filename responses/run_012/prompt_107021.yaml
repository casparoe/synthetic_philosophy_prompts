answer: |-
  This is an exceptionally sharp observation, and it cuts to the heart of a major unresolved tension in contemporary animal ethics and bioethics policy. Your friend is deploying an argument from **moral uncertainty** combined with **expected value theory**. The basic structure is: if there is a non-zero probability ($P$) that an entity has moral status ($S$), and the number of entities ($N$) is vast, then the Expected Moral Value ($E = P \times S \times N$) can outweigh the certain moral value of a smaller number of high-status entities.

  To make the current institutional practice (strict regulation for vertebrates, zero regulation for insects) coherent, one cannot simply appeal to "common sense." One must commit to specific, and often controversial, meta-ethical and empirical claims. Here is a reconstruction of what the status quo is committed to, what it rules out, and where the inconsistencies lie.

  ### 1. The Theoretical Commitments of Current Practice

  For the Animal Care Committee (ACC) system to be coherent while excluding insects, it must be committed to at least one of the following three theoretical positions:

  **A. The Lexical Threshold View (Deontological Status)**
  The current system operates as if moral standing is binary, not gradient. It assumes there is a threshold of cognitive capacity or phylogenetic membership that, once crossed, grants an entity "inviolable" status (or at least significant weight). Below that threshold, moral weight is **zero**, not discounted.
  *   **Commitment:** This rules out the idea that moral weight scales continuously with the probability of sentience. It asserts that a 99% chance of sentience counts for nothing if it falls below the taxonomic or neurological "line."
  *   **Implication:** The system treats insects as *moral objects* (like rocks) rather than *moral patients* with low probability. It does not weigh the risk of suffering; it denies the possibility of morally relevant suffering entirely.

  **B. The Qualitative Intensity Discount**
  This view accepts that insects *might* feel, but argues that the *magnitude* of their suffering is lexically inferior to vertebrates.
  *   **Commitment:** One unit of "mouse pain" is worth more than 10,000 units of "fly pain." This relies on a specific neuro-phenomenological claim: that without a cortex (or specific homologous structures), subjective experience is not just different, but "dimmer" or less ethically weighty.
  *   **Implication:** This allows the math to work. If $N(\text{flies})$ is huge, but $Weight(\text{fly suffering})$ is near-zero, the total expected suffering remains lower than that of the mice.

  **C. The Epistemic Conservatism Principle**
  This is the administrative defense. It argues that in the face of moral uncertainty, we should regulate only where sentience is *scientifically settled*.
  *   **Commitment:** This prioritizes **false negatives** (failing to protect a sentient insect) over **false positives** (burdening science with unnecessary regulations for non-sentient insects).
  *   **Implication:** This is a pragmatic, not ethical, commitment. It admits that insects *might* matter but claims the cost of finding out (regulatory burden) is too high. This is vulnerable to the charge that administrative convenience is being prioritized over potential massive suffering.

  ### 2. Which Rival Views Are Ruled Out?

  By maintaining the vertebrate/invertebrate divide, the current practice explicitly rejects:

  *   **Strict Expected Utility Maximization:** Your friend's view. If you are a utilitarian who sums expected welfare across all beings, the current system is morally catastrophic. It prioritizes the certain suffering of thousands of mice over the probable suffering of billions of flies.
  *   **Gradient Sentientism:** The view that moral consideration should scale with the *probability* of sentience and the *complexity* of the nervous system. Current practice draws a hard line (e.g., at the phylum Chordata or subphylum Vertebrata), whereas gradient sentientism would suggest a sliding scale of protection (e.g., cephalopods get more than crickets, crickets get more than fruit flies).
  *   **The Strong Precautionary Principle:** In environmental ethics, if there is a 1% chance of an ecosystem collapse, we act. Current animal ethics policy applies a **Weak Precautionary Principle**: "If there is a 99% chance it feels pain, we act." It refuses to extend precaution to the invertebrate case.

  ### 3. The Precautionary Principle Inconsistency

  You asked if there is a real inconsistency with how institutions invoke the precautionary principle elsewhere. **Yes, there is a glaring asymmetry.**

  *   **Biosafety/Environmental:** If a lab modifies a mosquito such that there is a 0.01% chance it could disrupt the local ecosystem, the Institutional Biosafety Committee (IBC) will impose strict containment. The *potential* harm drives the policy.
  *   **Animal Welfare:** If a lab uses a million crickets, and there is a 1% chance they feel agony during grinding, the ACC imposes no containment or anesthesia. The *potential* harm is ignored.

  **Why the inconsistency?**
  To make this coherent, the institution must claim that **human/ecological harm** is subject to precaution, but **animal harm** is subject to certainty. This implies a hierarchy where the *risk* to human interests outweighs the *actuality* (or high probability) of animal interests. It suggests the regulations are not truly about *animal welfare*, but about **public perception and liability regarding vertebrates.** We regulate mice because the public would be outraged by mouse torture; nobody cares about cricket torture.

  ### 4. Where the Practice is Underdetermined

  The current system is not even consistent with its own internal logic in several areas, suggesting it is underdetermined and evolving:

  *   **Larval Stages:** Zebrafish are not regulated until 5 days post-fertilization. Why? Because sentience is assumed to develop then. This admits that moral status is developmental, not purely taxonomic. If it's developmental in fish, why is it static in insects? (e.g., a caterpillar vs. a moth).
  *   **Cephalopods and Decapods:** The EU, UK, New Zealand, and Canada have recently extended protections to octopuses and lobsters/crabs. This admits the vertebrate line was arbitrary. If the line moves based on neuroanatomy (ganglia complexity), then insects (with complex central ganglia) are the next logical step.
  *   **Humane Endpoints:** We kill mice to prevent prolonged suffering. In insect rearing, "culling" often involves freezing or grinding live feed. If insects have even a 1% chance of sentience, grinding them alive is a high-risk moral act. The fact that this is standard procedure suggests the system assumes $P(\text{sentience}) = 0$, not $P < 0.05$.

  ### 5. What Would Change if We Took the Scale Argument Seriously?

  If your reading group accepts the "Expected Value" argument (1% probability $\times$ Billions of lives = Priority), the implications are radical and likely paralyzing for current science:

  1.  **Regulatory Collapse:** IACUC/ACC committees would explode in size. Reviewing protocols for millions of fruit flies is administratively impossible under current models. You would need a new tier of "Invertebrate Ethics" that relies on statistical auditing rather than individual protocol review.
  2.  **Research Shift:** High-throughput screening using insects (common in genetics and neurobiology) would become morally toxic. Funding would shift toward *in silico* models or organoids to avoid the "numbers problem."
  3.  **Feed Ethics:** The fish facility down the hall becomes a moral horror show. If crickets are sentient, breeding them solely to be ground up for fish feed is factory farming on a scale that dwarfs pork or beef. The institution would need to switch to artificial feed or algae-based feed immediately.
  4.  **Anesthesia Research:** We would need to fund research into insect analgesia. (Does clove oil work? Does CO2 induce unconsciousness or just paralysis?) Using anesthesia on flies would become mandatory.
  5.  **Dietary Implications:** For the individuals in your reading group: Veganism would no longer be sufficient. Crop agriculture kills vast numbers of insects (pesticides, harvesting). Taking the scale argument seriously might push one toward **fruitarianism** (low insect death) or **synthetic food**, as standard plant agriculture involves massive insecticide use.

  ### Summary for Your Discussion

  To defend the status quo coherently, your institution is committed to the view that **moral standing requires a threshold of probability or capacity that insects fail to meet, regardless of numbers.** They are effectively betting that insect sentience is impossible, not just unlikely.

  If they admit even a small probability, they are inconsistent with the **Precautionary Principle** applied elsewhere in the university.

  The only way to save the practice without changing it is to argue for a **Qualitative Discount**: that insect suffering is so phenomenally "thin" that even billions of them do not equal one mouse. But this is an empirical claim about consciousness that neuroscience has not settled.

  If your group takes the scale argument seriously, you cannot just tweak the policy; you have to acknowledge that modern biology (which relies on model organisms like *Drosophila*) is potentially built on a moral catastrophe comparable to factory farming, and that the administrative state is incapable of handling the math of invertebrate welfare.
