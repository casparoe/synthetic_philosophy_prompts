      *   Empirical support (climate)? Yes.
      *   Tech wrinkle? Yes.
      *   Defenders' side? Yes.
      *   Straight answer on falsifiability? Yes.

  7.  **Final Polish:** Ensure the distinction between (a) and (b) is the through-line. (a) is robust; (b) is fragile.

  *(Self-Correction on the "Straight Answer"):* The user asks: "if it turns out to be well insulated against everything I've listed, is that a fatal problem for a view of this kind, or is there a legitimate sense in which a framework for interpretation isn't supposed to be falsifiable in the way a hypothesis is?"
  *Decision:* I will argue that for *causal* historical claims (which Braudel makes), insulation is a vice, not a virtue. If it's just a lens for meaning, it's fine. But the user is talking about *causality* ("real causal action"). Therefore, unfalsifiability is fatal to the *causal* claim, even if the *heuristic* remains useful.

