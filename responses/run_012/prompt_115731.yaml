      *   *The River:* Focuses on *long-term* structural preparation. It's about institutional stability, military readiness, and public goodwill *before* the crisis. It's defensive *virtù*.
      *   *The Woman:* Focuses on *immediate* reaction to the crisis. When the flood *is* happening, dikes might break. Then you need boldness. It's offensive *virtù*.
      *   *Resolution:* They represent different temporal phases of political action. The River is peace-time preparation; the Woman is war-time/crisis execution. They aren't at odds; they are sequential.
      *   *Correction on "Beating":* The user says "beat and coerce." Machiavelli says fortune is a woman who favors the young/impetuous because they handle her more boldly. It's about *mode of engagement*, not necessarily literal violence (though the metaphor is aggressive).
