          *   *Soft Spot:* Renaissance is the strongest case for realism; user is weakest there.

      *   *Objection 5: The Grad Students (Metaphysics).*
          *   *Thought:* "Are you a realist or not?"
          *   *Phrasing:* "Ontological commitment," "natural kinds," "constructivism."
          *   *Reply:* Pragmatism. Refuse the binary.
