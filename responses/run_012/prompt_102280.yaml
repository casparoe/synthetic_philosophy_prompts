      *   **Part (c):** Does the anti-luminosity argument, if sound, show that the KK principle is false? Defend your answer.
          *   *Key Concept:* This is the trickiest part.
          *   *Standard Williamson View:* Yes, ALA undermines KK because knowing one knows is a luminous condition. If no non-trivial condition is luminous, KK fails.
