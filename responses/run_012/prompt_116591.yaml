      *   Teetotal safe? (Yes, frames sobriety as wisdom/authority).

  **(Post-Drafting Thought):** I need to make sure I don't sound condescending to the non-philosophers. I will explain the concepts simply. I also need to make sure the Bride isn't just the "babysitter" but the "wise leader."

