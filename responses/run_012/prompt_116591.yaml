answer: |-
  Good evening, everyone. For those of you who don't know me, my name is [Your Name], and I have the privilege of being [Groom's] best man.

  Looking around the room, I realize we have a bit of a divided audience. On one side, we have [Groom's] parents and their wonderful community from the church. On the other, we have the survivors of our university philosophy department. Now, usually, mixing these two groups is risky. One group is worried I'm going to quote scripture incorrectly; the other is worried I'm not going to quote it enough.

  But the truth is, [Groom] and I met right at the intersection of these two worlds. We met ten years ago in a graduate seminar on Plato's *Laws*. Specifically, Book Two. And while the rest of the class was reading it for theory, [Groom] and I were reading it for practical application. Over a decade of friendship, we've tested many of Plato's hypotheses. And tonight, I want to propose that Plato actually wrote the perfect blueprint for this marriage.

  In Book Two of the *Laws*, Plato argues that wine is a "god-given gymnasium for self-control." He wasn't a teetotaler, but he wasn't a binge-drinker either. He believed drinking was a test. It's a fire that reveals the true metal of a man's character.

  Plato lays out a strict regimen. He says no wine before eighteen. From eighteen to thirty, you may taste it, but you must practice absolute moderation. It is only after forty, he argues, that you are allowed to drink more freely, because at that age, it loosens the knots of life and makes you young again.

  Now, [Groom], I've checked your ID. You are not forty yet. Which means, according to the Academy, you are still in the moderation phase. And anyone who knows him knows he has mastered this. [Groom] is the same man at 2:00 PM as he is at 2:00 AM. He is steady. He is kind. And if Plato is right that drink reveals who someone *really* is, then [Groom] has passed the test with flying colors. He doesn't need alcohol to be generous, and he doesn't need a crowd to be brave.

  But here is where Plato gets really interesting for tonight. He insists that no drinking party should happen without a "Symposiarch"—a Lord of the Feast. A sober president in charge. Plato knew that freedom without wisdom is just chaos. He believed the most important person in the room isn't the one holding the glass, but the one holding the reins. The one who ensures the party remains warm, safe, and joyful.

  [Groom], you have found your Symposiarch.

  [Bride's Name], Plato would have loved you. You bring the order that allows for the joy. To [Bride's] parents and family: you raised a woman of immense wisdom and grounding. In the eyes of ancient philosophy and modern faith alike, she is the anchor of this ship. She is the sober wisdom that guides the ship through the storm. [Groom], you have the moderation; she has the command. Together, you have the balance.

  There is one more thing Plato says about marriage, though he doesn't say it in the *Laws*, but rather in the *Symposium*. He suggests that love is the only thing that makes us brave enough to face our own imperfections.

  [Groom] and [Bride], you are building a life together. There will be days that feel like a seminar on the *Laws*—complex, demanding, requiring deep thought. And there will be days that feel like the party after the seminar—loud, joyful, and full of laughter.

  My wish for you is that you always remember the lesson of the "gymnasium." Marriage is the ultimate gymnasium for self-control. It is where you learn to temper your ego, to moderate your anger, and to strengthen your patience.

  For the philosophers here: May you always find the golden mean.
  For the parents and family here: May you always see the virtue in their union.
  And for both: May you always remember that the best parties are the ones where everyone feels safe, seen, and loved.

  [Groom], you've waited for the "over forty" rule to kick in. I'd say wait until your 40th anniversary for the free pass. Until then, stick to the moderation, listen to your Symposiarch, and keep passing the test.

  If everyone could please rise.

  To [Groom] and [Bride]. May your love be the sober guide, your life be the well-run party, and your happiness be the only law that matters.

  To the couple.
