prompt: |-
  My best friend is getting married in a few weeks and I'm doing the best man's toast, and I'm stuck on how to pitch it. Half the room is our old philosophy department — we met in a grad seminar on Plato's Laws and we've spent ten years drinking together — and the other half is his parents and their church friends, who are teetotal and, I think, a little braced for a boozy best man speech. So I want the whole toast built on what Plato actually says about drinking in book 2 of the Laws, as I remember it: that wine is a god-given gymnasium for self-control, that you shouldn't touch it before your eighteen, that young men should only take it in moderation, and that past forty you're allowed to drink more freely because it loosens you back up and makes you young again — but only at a well-run party with a sober president in charge, since drink is what shows you who someone really is. I want that to do real work in the speech, not just be a bit I quote at the top and then drop. The tricky part is it has to land for the philosophers without making the teetotal half feel judged, and it has to actually be about the couple rather than a lecture on the Laws. Five minutes, warm, funny where it can be, and it should end as a toast to them. Can you write it?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Best Man's toast at a wedding.
      *   **Audience:** Split 50/50. Half: Old philosophy grad school friends (know Plato, drink together). Half: Groom's parents and church friends (teetotal, conservative, wary of boozy speeches).
      *   **Core Theme:** Plato's *Laws*, Book 2 (specifically regarding wine/drinking).
      *   **Key Platonic Points to Include:**
          *   Wine is a "god-given gymnasium for self-control."
          *   No drinking before 18.
          *   Young men (18-30) = moderation.
          *   Over 40 = drink more freely (loosens up, makes you young).
          *   Condition: Well-run party with a sober "Symposiarch" (President/Master) in charge.
          *   Purpose: Drink reveals true character.
      *   **Constraints:**
          *   Must not be just a quote-and-drop; the theme must drive the speech.
          *   Must not alienate/judge the teetotal half.
          *   Must focus on the *couple*, not just be a philosophy lecture.
          *   Tone: Warm, funny where appropriate, 5 minutes (approx. 750-900 words spoken at a moderate pace).
          *   Ending: A toast to the couple.

  2.  **Determine the Angle & Tone:**
      *   *Tone:* Respectful but witty. Intellectual but accessible.
      *   *Challenge:* How to talk about drinking without making the teetotalers feel like they're missing out or being judged as "fun killers," and how to talk about philosophy without boring the non-philosophers.
      *   *Solution:* Frame the Platonic rules as a metaphor for the marriage itself and the Groom's character. Acknowledge the teetotalers explicitly and warmly (Plato respects the "sober president," after all).
      *   *The "Sober President":* This is the bridge. The Bride is the perfect candidate for the "Symposiarch" (the sober ruler of the party). This empowers her and comforts the parents.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the split audience immediately. Disarm the tension. Introduce the friendship origin (Plato seminar).
      *   **The Philosophical Hook:** Introduce *Laws* Book 2. Explain the "gymnasium for self-control" concept.
      *   **Applying to the Groom:** Map the age rules to the Groom's life. He's likely under 40 (since parents are there and it's a wedding), so he's in the "moderation" phase. But show he has the *character* for it.
      *   **The Teetotal Bridge:** Address the "Sober President" rule. This is crucial. Plato says you need a sober guide. Who is that? The Bride. This validates the non-drinkers and elevates the Bride.
      *   **The "True Character" Point:** Plato says drink reveals who you are. The Groom is the same sober or not. That's why he's a good husband.
      *   **Conclusion/Toast:** Bring it back to the future. A wish for their life together. The actual toast.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I mention the 18/40 rule? *Yes, need to weave that in naturally.*
      *   *Check:* Is it too lecture-y? *Keep the philosophy conversational. "As those of us who survived Grad School know..."*
      *   *Check:* Are the parents comfortable? *Emphasize that Plato values sobriety and order, not just drunkenness.*
      *   *Check:* Is it about the couple? *Ensure the Bride gets equal billing in the "Symposiarch" section.*
      *   *Timing:* 5 minutes is roughly 750-850 words. I need to watch the length.

  5.  **Drafting the Speech (Iterative Process):**

      *   *Opening:* Good evening. For those who don't know me...
      *   *The Meeting:* Plato's *Laws*. Irony: We studied laws about drinking while drinking.
      *   *The Philosophy:* Plato wasn't a prude, but he wasn't a frat boy. Wine is a test.
      *   *The Groom:* He's in the "moderation" phase. He has self-control.
      *   *The Parents/Church:* Plato insists on a "Lord of the Feast." A sober guardian. That's [Bride's Name].
      *   *The Marriage:* Marriage is the ultimate gymnasium for self-control.
      *   *The Toast:* To the couple.

      *(Self-Correction on the 40 rule)*: If the Groom is under 40, I should joke that he has to wait a bit for the "free pass," but he's already wise enough. Or, if one of the parents is over 40, I can nod to them. Let's assume Groom is late 20s/early 30s. I'll frame the "over 40" rule as a hope for their future anniversary parties.

      *(Refining the Teetotal aspect)*: Make sure to say that Plato values the *sober* mind most of all. The drink is just the test; the virtue is the goal. This aligns with the church values.

  6.  **Final Polish:**
      *   Check the flow.
      *   Ensure the transition from philosophy to emotion is smooth.
