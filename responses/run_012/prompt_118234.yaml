answer: |-
  Project Title: The Epistemic Cost of Welfare Conditionality: A Screening Theory

  **The Research Question**

  Contemporary debates over welfare conditionality are predominantly framed as disputes about desert and reciprocity. This project proposes a shift in perspective: conditionality functions primarily as an epistemic screening device. Because entitlement to means-tested benefits turns on facts the state cannot directly observe—genuine inability to work, sincere search effort, actual household composition—the state manufactures costs to induce self-selection. Those with alternatives opt out; those without remain. This reading implies that the moral vocabulary of deservingness is not the justification of the policy but a public-facing description of the mechanism. The normative work is epistemic rather than retributive.

  This shift generates a specific research question: *Under what conditions is it permissible for the state to impose access costs on eligible claimants to deter ineligible ones?* The project seeks to provide a determinate answer in the form of a constraint on permissible policy design. It will not merely offer a balancing test but will attempt to define a threshold beyond which screening costs become impermissible, regardless of the fiscal savings generated. The goal is to articulate a principle that limits the magnitude of burden the eligible may be required to bear to solve the state's information problem.

  **The Gap in Existing Literature**

  Existing normative frameworks leave this question open because they rely on assumptions that the screening rationale renders untenable. The desert and reciprocity literature settles questions of entitlement by assuming that the eligible are identifiable independently of the screening process. It asks whether a specific individual deserves support, presupposing we can know their status without imposing costly conditions. Similarly, standard rights adjudication employs least-restrictive-means tests that presuppose a determinate class of rights-bearers. These frameworks ask how to treat those who *have* a right, not how to identify them when verification is costly.

  If the screening reading is correct, these approaches miss the core ethical tension. The tension is not between the state and the undeserving, but between the state and the *deserving* who must pay the price of verification. By assuming identifiability, existing literature obscures the fact that conditionality knowingly makes benefits unattractive to the eligible to filter the ineligible. Consequently, the literature provides no resources for judging whether the cost imposed on the true positives is justified by the exclusion of the false positives. This is not an oversight but a structural blind spot created by the assumption of independent identifiability.

  **Method and Work Plan**

  The project will proceed in four stages over one semester. First, I will conceptually separate screening justifications from desert justifications. This involves demonstrating that the desert vocabulary does no independent work once the screening rationale is on the table. If the policy works by signaling rather than judging, arguments about contempt or respect miss their target.

  Second, I will test the empirical premise of the screening story against the mechanics of actual schemes. The screening model predicts that costs should target behaviors correlated with ineligibility. However, sanctions in practice attach far more often to procedural failures, such as missed appointments and unreturned forms, than to established deception. Furthermore, a substantial share of overpayment is attributed to administrative error rather than claimant fraud. I will analyze why these facts matter if the screening reading is correct. They suggest the signal is noisy and the cost is borne by people who were never the target of the screening. This empirical mismatch strengthens the need for a normative constraint.

  Third, I will construct a candidate constraint. I will explore formulations such as a requirement that the state show the deterrence gain could not be bought more cheaply in the coin of the claimants' own interests, or that those screened out by mistake be compensated. The aim is to find a principle that does not collapse into ordinary cost-benefit reasoning.

  Fourth, I will test that constraint against cases where it appears to give the wrong answer, including cases where I would want the scheme to survive. This reflective equilibrium process will refine the constraint to ensure it is credible and not overly prohibitive.

  **Failure Conditions and Scope**

  Given the one-semester timeframe, the deliverable will be a draft journal article rather than a full chapter. I must be honest about the conditions under which this project would fail. First, the screening reading might turn out to be eliminable in favour of a straightforward desert reading after all; if conditionality can be fully explained as retributive or educative, the epistemic argument collapses. Second, every candidate constraint might either collapse into ordinary cost-benefit reasoning, in which case there is no distinct philosophical question here, or forbid schemes I am not willing to give up, in which case the constraint is not credible.

  If the argument only half works, the deliverable will be a rigorous map of the problem rather than a solved equation. Even if I cannot derive a perfect constraint, demonstrating that the desert literature rests on false empirical assumptions about identifiability constitutes a significant contribution. The project will succeed if it forces the literature to acknowledge the screening cost borne by the eligible, even if the final normative principle remains provisional.

  \proposal{question: What constraint limits the magnitude of screening costs imposed on eligible claimants to deter ineligible ones?; falsifier: The screening rationale collapses into ordinary desert claims or cost-benefit analysis.}
