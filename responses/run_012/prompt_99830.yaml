  Your tentative principle is very close to a recognized concept in epistemology called **defeasibility**, but it stumbles on the "Brain in a Vat" case and conflates two different kinds of defeat.

  Your intuition is tracking a distinction between **global skepticism** (which we are licensed to ignore) and **local, specific defeaters** (which we are not).

  Here is the principle that fits your cases, the distinction you're missing between the concussion and the replication, and the verdict you might need to adjust.

  ### The Principle: Specific, Competent Defeaters

  You can ignore counter-evidence if and only if **the counter-evidence fails to provide a specific, localized reason to doubt the reliability of your belief-forming process *in this instance*.**

  Let's break down why this works better than your tentative version:

  1.  **Competence Hierarchy:** In the **Receipt/Widget** and **Lemma/Crank** cases, the counter-evidence comes from a source you have independent reason to believe is *less* competent than your own process in that context. The widget is a black box; the crank offered a circular argument. They fail the "Competent" test.
  2.  **Specificity:** In the **Keys/Wife** and **Pin/Concussion** cases, the counter-evidence is *localized*. Your wife isn't saying "your memory is always bad"; she's saying "you put the keys down *here*." The concussion isn't saying "knowledge is impossible"; it's saying "your hippocampus was compromised *last week*." These are specific defeaters.
  3.  **Global vs. Local:** The **Brain in a Vat** case fails the "Specific" test. It is a *global* defeater. If true, it undermines *everything*, including the evidence used to support the Vat hypothesis itself. Because it offers no specific reason to doubt your hands *more* than it doubts the guy speaking to you, you are licensed to Moorean-shift it (i.e., "I know I have hands, therefore I am not a vat").

  ### The Concussion vs. Replication Distinction

  You asked if these are the same phenomenon. They are not. In epistemology, this is the difference between an **Undercutting Defeater** and a **Rebutting Defeater**.

  *   **The Concussion (Undercutting Defeater):** This attacks the *connection* between your belief and the truth. It says, "Even if your PIN is 1234, your brain was not in a state to *know* it." This feels retroactive because it dissolves the *justification* you thought you had. You didn't just have a false belief; you lacked knowledge.
  *   **The Replication (Rebutting Defeater):** This attacks the *content* of the belief directly. It says, "The world is not actually the way you thought it was." It doesn't necessarily mean the original scientists were cognitively broken (they might have been unlucky or p-hacked); it means the *phenomenon* doesn't exist. This feels like "the result is wrong" rather than "I never knew it," because the failure is in the external world (the psychology), not necessarily in your internal cognitive machinery.

  ### The New Case: Friend vs. Friend

  **Scenario:** You believe *P* because Trusted Friend A told you. Trusted Friend B (equal trust) tells you *not-P*.

  **Application of Principle:**
  *   **Competence:** Equal.
  *   **Specificity:** Both are making specific claims about the world.
  *   **Verdict:** **You cannot ignore Friend B.**

  Unlike the Widget or the Crank, Friend B is a competent source. Unlike the Vat, this is not a global skeptical hypothesis. Unlike the Wife or Concussion, there is no immediate tie-breaker (like checking the counter or knowing about the brain injury).

  **Result:** You must **suspend judgment**. You cannot shrug this off. Your gut should tell you that you are now in a state of epistemic equilibrium, and you need third-party verification before holding *P* or *not-P* with confidence. If you ignore Friend B, you are violating the principle because you have no reason to think Friend A's process was superior to Friend B's in this instance.

  ### Which Verdict Do You Have to Give Up?

  You likely need to nuance the **Psych Replication** case.

  **Your Verdict:** "I now think the original is genuinely in trouble."
  **The Nuance:** If a result has been replicated 20 times, a single failed replication is statistically likely to be a false negative (Type II error) or a boundary condition issue, rather than proof the original is wrong.

  According to the **Specific, Competent Defeater** principle, the failed replication *is* a competent defeater (it's science), so you cannot ignore it. **However**, the *weight* of the defeater matters. One failure against twenty successes does not warrant moving from "Sure" to "In Trouble." It warrants moving from "Sure" to "Mostly Sure, but investigating boundary conditions."

  If you treat one failed replication as putting the original "genuinely in trouble," you are arguably overweighting the defeater relative to the original evidence base. You are treating the single lab as having more authority than the consensus of twenty. To be consistent with your **Receipts** case (where you trusted your own sum over a widget), you should trust the consensus of 20 over the single outlier, unless the single lab provides a *specific* reason why the others failed (e.g., "We found a methodological flaw in the original protocol").

  **Correction:** You shouldn't feel the result is "in trouble" solely based on the failure. You should feel the result is **"provisionally secure but requires monitoring."** You can shrug off the *falsity* of the original, but you cannot shrug off the *need to check* the methodology.

  ### Summary

  Your gut is following the **Principle of Specific, Competent Defeaters**.
  1.  **Ignore** global skepticism (Vat) and lower-competence sources (Widget, Crank).
  2.  **Update** on specific, localized attacks on your process (Wife, Concussion).
  3.  **Suspend** on equal-competence conflicts (Friend vs. Friend).
  4.  **Weight** scientific defeaters according to the pre-existing evidence base (don't let 1 lab kill 20 reps without a specific methodological critique).

  The "retroactive" feeling in the concussion case is because your *capacity to know* was undercut, whereas in the psych case, the *fact of the matter* was rebutted. One is about you; the other is about the world.
