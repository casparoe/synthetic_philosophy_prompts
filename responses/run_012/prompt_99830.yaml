  According to the **Specific, Competent Defeater** principle, the failed replication *is* a competent defeater (it's science), so you cannot ignore it. **However**, the *weight* of the defeater matters. One failure against twenty successes does not warrant moving from "Sure" to "In Trouble." It warrants moving from "Sure" to "Mostly Sure, but investigating boundary conditions."

  If you treat one failed replication as putting the original "genuinely in trouble," you are arguably overweighting the defeater relative to the original evidence base. You are treating the single lab as having more authority than the consensus of twenty. To be consistent with your **Receipts** case (where you trusted your own sum over a widget), you should trust the consensus of 20 over the single outlier, unless the single lab provides a *specific* reason why the others failed (e.g., "We found a methodological flaw in the original protocol").

  **Correction:** You shouldn't feel the result is "in trouble" solely based on the failure. You should feel the result is **"provisionally secure but requires monitoring."** You can shrug off the *falsity* of the original, but you cannot shrug off the *need to check* the methodology.

  ### Summary

  Your gut is following the **Principle of Specific, Competent Defeaters**.
  1.  **Ignore** global skepticism (Vat) and lower-competence sources (Widget, Crank).
  2.  **Update** on specific, localized attacks on your process (Wife, Concussion).
  3.  **Suspend** on equal-competence conflicts (Friend vs. Friend).
  4.  **Weight** scientific defeaters according to the pre-existing evidence base (don't let 1 lab kill 20 reps without a specific methodological critique).

  The "retroactive" feeling in the concussion case is because your *capacity to know* was undercut, whereas in the psych case, the *fact of the matter* was rebutted. One is about you; the other is about the world.
