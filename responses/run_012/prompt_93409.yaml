prompt: |-
  ok so I run the sort of unofficial AI safety lunchtime club at my school (there's five of us, we meet in the maths room on Thursdays, and honestly two of them only come for the biscuits) and next week I have to lead the session on wireheading and reward tampering, which I sort of get but not really. My problem is that every video I watch makes it sound like one single thing — "the AI hacks its own reward button, lol" — and then when I actually try to think about it there seem to be like six different things people could mean, and they lead to totally different conclusions about whether it's even a real problem. Like: is it changing something inside yourself so the score always reads max, or changing the actual scoring process out in the world? Is the system trying to get the reward, or trying to get the thing the reward was only ever a stand-in for? And I read somewhere that some people think the whole fear is confused, because the reward is just what we use to train the thing and it isn't even there when the thing is actually running — which, if true, makes the entire topic evaporate, and I can't tell if that's a really clever point or a total dodge.

  Anyway what I want to make for the handout is a decision tree / flowchart that takes someone from "I've heard AI systems might tamper with their own reward" to a specific position, where every branching point is a question a person could answer without already knowing which position it leads to (so no nodes that are basically "do you believe in instrumental convergence?" — that's cheating, it just makes people pick a team). Each leaf should be a named position, or "nobody actually holds this" if it's an empty spot in the space. I definately want it to seperate these things, whether or not they end up as seperate leaves: wireheading as self-modification vs tampering with the reward process outside the agent; reward-as-the-goal vs reward-as-evidence-about-the-goal; the worry being about training going wrong vs about the deployed system misbehaving; and the "it's not even a coherent worry, reward isn't the optimisation target" view. Please also stick in a leaf for the people who think deliberately wireheading an AI would be a *solution* rather than a problem, and one for the "this is just Goodhart / specification gaming, nothing new here" view, and say where those two sit relative to everything else.

  Concrete cases please, not abstractions — the tree should turn on cases like: a game-playing bot that finds a bug giving it infinite points; an agent that rewrites its own reward-computing code; one that edits the world so its sensors report success; one that talks the humans rating it into giving top marks; and one that leaves the reward channel completely alone but arranges the world so the reward just arrives for free (I have a suspicion that last one is the interesting one and the others are all secretly the same thing). Maybe 8–10 branching points is right. At the end, flag any two leaves that none of my cases can actually tell apart, because I'm pretty sure alot of these positions are the same position wearing different hats, and if some combination of answers gives you a view that's obviously incoherent or that nobody would ever defend, say so and say why — I don't want to fake a leaf just to make the tree look tidy.
