answer: |-
  # SEMINAR HANDOUT: THE ASYMBOLIA CHALLENGE
  **Case:** Patients locate pain, rate intensity (e.g., 8/10), say "It hurts," but show no distress, withdrawal, or preference for it to stop.

  ### DECISION TREE

  **START:** Patient reports "It hurts," points to spot, rates intensity, shows no distress.

  **1. Is the patient's report "It hurts" literally false?**
  *   **YES:** They are misusing the word or confabulating. There is no pain experience here.
      *   ➔ **LEAF 5: Eliminativism** (These patients aren't in pain at all).
  *   **NO:** They are reporting a real experience accurately.
      *   ➔ **GO TO 2**

  **2. Is "pain" a single unified natural kind, or a cluster of distinct capacities?**
  *   **CLUSTER:** "Pain" is just a label for a bundle (sensing, judging, reacting) that can come apart.
      *   ➔ **LEAF 6: Pluralism** (Pain isn't one natural kind; the question is malformed).
  *   **UNIFIED:** Pain is one thing; if parts are missing, the thing is altered.
      *   ➔ **GO TO 3**

  **3. Is the "unbothered" reaction due to a missing *component* of the experience, or a broken *link* between experience and action?**
  *   **MISSING COMPONENT:** Part of the pain experience itself is gone.
      *   ➔ **GO TO 4**
  *   **BROKEN LINK:** The experience is intact, but it fails to motivate.
      *   ➔ **GO TO 7**

  **4. Is there a sensory feel (location/intensity) present distinct from the "suffering"?**
  *   **NO:** The sensory feel and the suffering are the same thing.
      *   ➔ **GO TO 5**
  *   **YES:** You can have the feel without the suffering.
      *   ➔ **GO TO 6**

  **5. If they are identical, and suffering is absent, is the sensation absent?**
  *   **YES:** A pain without suffering is a contradiction; what remains is a hollow shell.
      *   ➔ **LEAF 1: Constitutionalism** (Badness is baked in; pain that doesn't bother is barely pain).
  *   **NO:** *(Empty Cell: Identical but one absent? Incoherent).*

  **6. Is the "suffering" a separate desire/aversion tacked onto the neutral sensation?**
  *   **YES:** Sensation is neutral; aversion is a separate conative state.
      *   ➔ **LEAF 2: Separabilism** (Badness is a separate conative state).
  *   **NO:** *(Leads back to 5 or Empty Cell: Neutral sensation with no aversion and no baked-in badness?)*.

  **7. (Broken Link) Does the experience represent the bodily state as "bad" or "damaged"?**
  *   **YES:** It carries content about the body's value.
      *   ➔ **GO TO 8**
  *   **NO:** It does not describe the body's value.
      *   ➔ **GO TO 9**

  **8. Is that content a description (true/false) or a command (obeyed/ignored)?**
  *   **DESCRIPTION:** It says "This is bad." The patient just doesn't care about the truth.
      *   ➔ **LEAF 4: Representationalism** (Pain represents the bodily state as bad).
  *   **COMMAND:** It says "Stop this!" The patient just disobeys.
      *   ➔ **GO TO 10**

  **9. If it represents neither value nor command, what motivates action normally?**
  *   **RAW QUALIA:** The feel itself pushes action, but the link is severed.
      *   ➔ *(Empty Cell: Rarely defended as a complete theory of badness).*
  *   **EXTERNAL JUDGMENT:** A separate belief motivates, not the pain.
      *   ➔ *(Leads to Leaf 2 variant).*

  **10. Is the "badness" of pain just the force of that command?**
  *   **YES:** Pain is an imperative. Disobedience doesn't remove the command.
      *   ➔ **LEAF 3: Imperativism** (Pain experience is a command to protect the body).
  *   **NO:** *(Empty Cell: Command exists but isn't what makes it bad?)*.

  ---

  ### EXTRA CASES: PREDICTIONS BY LEAF

  **CASE A: The Drug**
  *Hypothetical:* Drug leaves sensation bit-for-bit identical but kills the "get away" pull for one hour.
  *   **Leaf 1 (Constitutionalism):** Predicts **No Pain.** (If badness is baked in, you can't remove the pull without changing the sensation).
  *   **Leaf 2 (Separabilism):** Predicts **Pain, Not Bad.** (Sensation remains; aversion/conation is killed).
  *   **Leaf 3 (Imperativism):** Predicts **Pain, Not Bad.** (Command issued, but motivational force blocked/ignored).
  *   **Leaf 4 (Representationalism):** Predicts **Pain, Not Bad.** (Representation of damage exists, but evaluative impact nullified).
  *   **Leaf 5 (Eliminativism):** Predicts **No Pain.** (If no avoidance, no pain).
  *   **Leaf 6 (Pluralism):** Predicts **Pain (Partial).** (Sensory cluster intact, reactive cluster offline).

  **CASE B: The Masochist**
  *Hypothetical:* Patient says pain is intense but would rather keep it than lose it.
  *   **Leaf 1 (Constitutionalism):** Predicts **Barely Pain.** (If it doesn't bother them, it lacks the essence).
  *   **Leaf 2 (Separabilism):** Predicts **Pain, Still Bad.** (Sensation + Aversion exist; higher-order desire overrides aversion, but badness remains).
  *   **Leaf 3 (Imperativism):** Predicts **Pain, Still Bad.** (Command to stop is issued; disobedience doesn't cancel the command).
  *   **Leaf 4 (Representationalism):** Predicts **Pain, Still Bad.** (Body is still represented as damaged; desire doesn't change the truth).
  *   **Leaf 5 (Eliminativism):** Predicts **Pain.** (Report is sincere).
  *   **Leaf 6 (Pluralism):** Predicts **Pain.** (Enough cluster members present).

  ---

  ### META-ANALYSIS: EMPTY CELLS & EMPIRICAL FLAGS

  **1. Flagged Empirical Nodes (Not Philosophical)**
  *   **Node 1 (Truth of Report):** Determining if the patient is "lying" or "confabulating" relies on behavioral/neurological data, not conceptual analysis.
  *   **Node 3 (Missing Component vs. Broken Link):** Deciding whether the lesion removed a *part* of the experience or the *output* of the experience is an empirical claim about brain function.

  **2. Empty / Undefended Cells**
  *   **Node 5 (NO branch):** Claiming suffering and sensation are identical, yet suffering is absent while sensation remains, is **Incoherent**.
  *   **Node 9 (RAW QUALIA):** A view where pain has no content (no command, no representation) but usually causes action via "brute force," yet here doesn't, is **Unattractive**. It struggles to explain why the feel *should* motivate without content.
  *   **Node 10 (NO branch):** Claiming pain is a command but the "badness" is something *other* than the command's force is **Uncharted**. (Why call it a command if the force isn't the point?).

  **3. Hard-to-Separate Leaves**
  *   **Leaf 3 (Imperativism) vs. Leaf 4 (Representationalism):** In the **Masochist Case**, both predict "Pain, Still Bad." The tree cannot separate them based on preference alone; you need to know if the patient thinks the pain *describes* damage or *orders* action.
  *   **Leaf 1 (Constitutionalism) vs. Leaf 5 (Eliminativism):** Both predict "No Pain" in the **Drug Case**. The difference is semantic: Leaf 5 says the word "pain" doesn't apply; Leaf 1 says the *phenomenon* is missing its essence.
