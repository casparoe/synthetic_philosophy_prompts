      *   *Defender's Move:* "The threshold is a property of *experience*, not aggregation." They argue value isn't additive across persons in the standard way. They might claim the "Population Reading" is a category error.
      *   *What must be given up:* Either the lexicality (accept trade-offs) or the additivity (accept non-aggregative views like Prioritarianism or Rights-based constraints).

  7.  **The Core Feature:**

      *   *Feature:* The *concentration* of suffering relative to the threshold boundary.
