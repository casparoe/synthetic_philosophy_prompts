      *   **Task:** Analyze a specific cluster of practices among professional bettors/investors (Bankroll management, Fractional Kelly, Screening by EV/Sizing by Growth, Ruin as Special).
      *   **Requirements:**
          1.  Begin with a short brainstorming section setting out candidate readings before committing.
          2.  Reconstruct the implicit theory (Rational objective: Growth vs. EV? Log utility vs. Long-run dominance?).
          3.  Address the tension in (c) (Coherence of EV screening + Growth sizing? Risk aversion vs. Estimation error?).
          4.  Address the one-shot case (Repeated game assumption vs. Lexicographic survival constraint?).
          5.  Contrast with straightforward EV maximization and Subjectivist EU maximization.
          6.  Flag philosophical underdetermination.
          7.  No citations or reading lists.
          8.  Tone: Philosophical, rigorous, clear verdicts.

  2.  **Brainstorming & Candidate Readings (Mental Draft):**
      *   *Practice:* Pros don't bet full bankroll on +EV. They use Kelly (or half-Kelly). They hate ruin.
      *   *Reading 1: The Orthodox EU View.* They are just EU maximizers with logarithmic utility ($U(w) = \ln w$). Kelly maximizes expected log wealth. Fractional Kelly is just "more concave" utility (e.g., power utility). Ruin avoidance is just $U(0) = -\infty$.
      *   *Reading 2: The Frequentist/Long-Run View.* They care about the time-average growth rate (Ergodicity Economics). EV is ensemble average; Growth is time average. In non-ergodic systems (multiplicative wealth), time average $\neq$ ensemble average. Rationality is maximizing time-average growth.
      *   *Reading 3: The Instrumental/Survival View.* Growth is instrumental to staying in the game. Ruin is a hard constraint because you can't bet if you're broke. EV screening is a heuristic for "is this bet type profitable?" Sizing is "how do I survive long enough to collect?"
      *   *Reading 4: The Epistemic View.* Full Kelly assumes known probabilities. Half-Kelly accounts for parameter uncertainty. It's not risk aversion; it's robustness.
      *   *Tension:* Why screen by EV (linear) but size by Kelly (log/growth)? If you're Log-utility, you should screen by Expected Log Utility, not Expected Value. A bet can have +EV but negative Expected Log Utility (if stake is too high, but here we are talking about *taking* the bet at all). Actually, a bet with +EV always has +ELU for *some* stake, but maybe they mean screening the *opportunity*.
      *   *One-Shot:* Kelly relies on repetition (Law of Large Numbers). If it's truly one-shot, Log-Utility justifies refusal, but Long-Run Growth does not (unless you pretend it's one of many). Ruin aversion suggests a deontological constraint or lexicographic preference.

  3.  **Structuring the Response:**
      *   **Brainstorming Section:** Lay out the competing interpretations (EU-Log, Ergodic/Growth, Epistemic/Robustness, Lexicographic Survival).
      *   **Section 1: Reconstructing the Implicit Theory.** Focus on the Growth Rate vs. EV distinction. Distinguish between "Wealth is Log Utility" (Normative/Axiological) and "Growth Dominates" (Descriptive/Instrumental). Verdict: The practice leans towards the Instrumental/Growth view but relies on Log Utility as the mathematical proxy.
      *   **Section 2: The Tension (EV Screening + Fractional Kelly).** Analyze the coherence. Is it inconsistent? Or is EV a filter for "positive drift"? Analyze Fractional Kelly: Risk aversion (EU) vs. Estimation Error (Growth). Verdict: Underdetermined, but Epistemic/Robustness fits the "prudence" language better without abandoning the growth framework.
      *   **Section 3: The One-Shot Case.** Does it presuppose repetition? Or is ruin a hard constraint? Verdict: It reveals a crack in the pure Growth theory. It requires a Lexicographic Survival constraint which is distinct from pure growth maximization.
      *   **Section 4: Counterfactuals (EV Max vs. Subjectivist EU).** How would behavior change?
      *   **Conclusion:** Summary of verdicts and underdetermination points.

  4.  **Drafting the Content - Key Philosophical Distinctions:**
      *   *Ensemble vs. Time Average:* This is crucial for the "Geometric View." EV is ensemble. Growth is time.
      *   *Log Utility vs. Log Wealth:* $E[\ln W]$ vs. $\lim \frac{1}{N} \ln W_N$. Mathematically equivalent in i.i.d. settings, philosophically distinct (Preference vs. Physical Process).
      *   *Ruin:* In EU, ruin is just low utility. In Growth, ruin is zero growth rate (absorbing state). In Practice, ruin is "game over."
      *   *Fractional Kelly:* If EU, it's changing the utility function. If Growth, it's acknowledging uncertainty in the edge (optimization under uncertainty).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on (c):* Why screen by EV? If I maximize growth, I should screen by "does this increase growth rate?" For small bets, +EV implies +Growth. But for large bets, +EV can mean -Growth. The practitioners screen by EV to find *edges*, then size by Kelly to capture the edge without killing growth. This suggests EV is the *source* of value, Growth is the *method of harvesting*.
      *   *Correction on One-Shot:* A pure growth maximizer should take a 51% double-or-nothing if it's truly one-shot and they don't care about the future? No, because Geometric Mean of {2, 0} is 0. So Growth theory *does* reject it. But why? Because the geometric mean assumes compounding. If no compounding, Arithmetic Mean (EV) rules. So the refusal implies they treat *every* bet as part of a sequence. This is a metaphysical commitment to the "repeated game" nature of professional betting.
      *   *Refining "Underdetermination":* I need to be careful not to say "It is X." I need to say "The practice is compatible with X and Y, but Z is required to explain feature W."

  6.  **Final Polish:** Check constraints. No citations. Start with brainstorming. Clear verdicts. Philosophical tone.

      *   *Brainstorming:* Keep it distinct.
      *   *Verdicts:* Make them bold.
      *   *Tone:* Academic but accessible to an undergrad.

      *(Self-Correction on the EV Screening vs Growth Sizing)*:
      Wait, if you have Log Utility, you maximize $E[\ln W]$. A bet with +EV might have negative $E[\ln W]$ if the stake is too high. But the practice says "Screen by EV" (is the bet good?) then "Size by Growth" (how much?).
      If the bet has +EV, there exists *some* fraction $f > 0$ such that Expected Log Growth is positive. So screening by +EV ensures the *opportunity* is valid. Sizing by Kelly ensures you extract the max growth. This is coherent *if* the goal is long-term capital accumulation.
      However, if they were pure EU maximizers with Log Utility, they would just maximize $E[\ln W]$ directly. The separation of "Screen" (Linear) and "Size" (Geometric) suggests a two-stage process: 1. Identify positive drift (EV). 2. Optimize trajectory (Kelly). This supports the "Growth as Instrumental" view over the "Log Utility as Fundamental" view.

      *(Self-Correction on Fractional Kelly)*:
      "Prudence rather than correction for error." This is the key phrase. If it were EU, they'd say "I am more risk averse." If they say "Prudence," it often implies "I don't trust my numbers." This points to the Epistemic/Robustness reading. But it could also be "I want to reduce volatility drawdown," which is compatible with Log Utility (just a different coefficient). I need to highlight this underdetermination.

      *(Self-Correction on One-Shot)*:
      If it's truly one-shot, Geometric Mean is irrelevant. Arithmetic Mean rules. If they refuse, they are either (a) lying about it being one-shot (they view their career as a sequence), or (b) have a hard constraint against ruin (Lexicographic). The prompt asks if the practice presupposes all betting is repeated. I should argue that for the professional, "one-shot" is a fiction. Their identity is "bettor," which implies a sequence.

  7.  **Finalizing the Plan:**
      *   **Brainstorming:** List 3-4 candidate frameworks (Standard EU, Ergodic/Growth, Epistemic Robustness, Lexicographic Survival).
      *   **Reconstruction:** Argue for the "Time-Average Growth" view as the primary driver, with Log Utility as the mathematical engine, not the axiological foundation.
      *   **Tension:** Argue that EV Screening + Growth Sizing is coherent under the Growth view (EV = Drift, Kelly = Optimal Trajectory). Fractional Kelly is underdetermined but fits Epistemic Robustness better given the "prudence" language.
      *   **One-Shot:** Argue this reveals a commitment to the "Repeated Game" metaphysics. Refusal implies they do not believe in one-shot bets. Alternatively, it implies a Lexicographic Survival constraint.
      *   **Counterfactuals:** EV Max would bet big/concentrated. EU Risk-Averse would look similar but lacks the "Ruin is Special" categorical distinction (it's just very bad, not infinite).
      *   **Underdetermination Flags:** Explicitly mark where EU-Log and Growth-Log are indistinguishable in practice but distinct in theory.

  8.  **Writing the Response:** (Proceeding to generate output based on these thoughts).
answer: |-
  ### Brainstorming Candidate Readings

  Before settling on a reconstruction, I must map the logical space. The practices you describe sit at the intersection of three competing frameworks. I need to weigh them against the specific constraints of your cluster (a)–(d).

  1.  **The Standard Expected-Utility (EU) Reading:** The practitioners are subjective expected-utility maximizers with a concave utility function, specifically logarithmic ($U(w) = \ln w$).
      *   *Fit:* Explains (a) and (c) mathematically (Kelly maximizes expected log-wealth). Explains (d) if $U(0) = -\infty$.
      *   *Strain:* Struggles with (b). If I am a Log-utility maximizer, "half-Kelly" implies I am actually a square-root utility maximizer. Why call it "prudence" rather than "my utility function"? Also, screening by linear EV while sizing by log-utility is theoretically messy; a pure EU agent should screen by expected utility, not expected value.

  2.  **The Ergodic/Growth Reading:** The practitioners distinguish between ensemble averages (Expected Value) and time averages (Geometric Growth). They view wealth dynamics as non-ergodic. Rationality is maximizing the time-average growth rate.
      *   *Fit:* Perfectly explains (a) and (c). EV identifies positive drift; Kelly maximizes the time-average growth rate of that drift. Explains (d) because ruin sets the time-average growth rate to $-\infty$ (an absorbing state).
      *   *Strain:* Struggles with the one-shot case. Time averages require time. If there is no repetition, the time-average collapses to the single outcome. Why refuse a one-shot +EV bet?

  3.  **The Epistemic/Robustness Reading:** The practitioners believe in growth optimization but acknowledge that probabilities are estimates, not known facts. Full Kelly is optimal only for known probabilities. Fractional Kelly is a heuristic for optimization under parameter uncertainty.
      *   *Fit:* Explains (b) ("prudence") without abandoning the growth framework.
      *   *Strain:* Doesn't fully explain (d) on its own. You can be robustly uncertain and still accept a risk of ruin if the upside is high enough, unless ruin is structurally different from uncertainty.

  4.  **The Lexicographic Survival Reading:** The practitioners operate under a hard constraint: "Stay in the game." Growth is secondary to survival.
      *   *Fit:* Explains (d) categorically. Explains (a) as a buffer.
      *   *Strain:* Hard to reconcile with (c). If survival is lexicographically prior, why care about EV screening at all? Why not just minimize variance?

  **Settled Approach:** I will argue that the practice is primarily grounded in the **Ergodic/Growth Reading**, but it relies on the **Lexicographic Survival Reading** to handle boundary cases (like the one-shot bet) and the **Epistemic Reading** to justify fractional sizing. The Standard EU Reading is mathematically equivalent in many instances but philosophically distinct; the practitioners' language ("ruin," "game," "prudence") signals they are not thinking in terms of subjective preference curves, but in terms of system dynamics.

  ***

  ### 1. Reconstructing the Implicit Theory

  The cluster of practices (a) through (d) presupposes a conception of rationality that is **instrumental and dynamic**, rather than static and axiological.

  **Growth Rate vs. Expected Value**
  The practices strictly presuppose that the rational objective is the **long-run time-average growth rate of capital**, not the maximization of expected value (ensemble average).
  *   **Why:** Practice (a) is the smoking gun. If the objective were Expected Value (EV), a 60/40 bet at even money should be taken at maximum size. The refusal to do so is irrational under EV maximization. It is only rational if the agent cares about the *trajectory* of wealth over time, not the arithmetic mean of possible worlds.
  *   **Log Utility vs. Long-Run Dominance:** You ask if this is a claim about value (log utility) or a claim about rationality (growth dominates). The practice suggests the latter.
      *   If it were a claim about value (i.e., "I inherently value dollars logarithmically"), then the constraint would be internal to the agent's psychology.
      *   However, the language of "bankroll," "ruin," and "game" suggests the constraint is external: it is a property of the *environment* (multiplicative dynamics), not the *agent*. In a multiplicative world, arithmetic expectation is a phantom; it does not represent what happens to a single trajectory.
      *   **Verdict:** The practice presupposes that **growth rate dominates in the long run** as a matter of physical/mathematical necessity in non-ergodic systems. Logarithmic utility is merely the mathematical tool that captures this dynamic, not the foundational axiom of value. The two claims are distinct. The practice *can* run on either (since the math is identical in i.i.d. sequences), but the *justification* offered by practitioners (avoiding ruin, staying in the game) aligns with the Growth/Dynamic view. They are not saying "I dislike risk"; they are saying "Volatility drains compound returns."

  **The Status of Ruin**
  Practice (d) treats ruin as an absorbing state. In the Growth framework, this is not just a "bad outcome"; it is the termination of the process. If wealth hits zero, the growth rate becomes undefined or negative infinity because the sequence stops.
  *   **Verdict:** The practice presupposes that **rationality requires maintaining the capacity to act.** Value is conditional on existence. This is not a claim about the utility of zero dollars; it is a claim about the precondition for utility accumulation.

  ### 2. The Tension: Screening, Sizing, and Fractional Kelly

  **Coherence of (c): Screening by EV, Sizing by Growth**
  Is this incoherent? No, but it requires a specific interpretation of what EV is doing.
  *   If the goal is growth, why screen by linear EV? Because in the limit of small bets, positive Expected Value is a necessary condition for positive Expected Log Growth. A bet with negative EV will always reduce geometric growth.
  *   However, a bet with positive EV can still reduce geometric growth if sized too large (the "betting too much" problem).
  *   **Reconstruction:** The practitioners treat EV as a **filter for opportunity** (is there a positive drift?) and Kelly as the **optimizer of harvest** (how do I extract that drift without killing the goose?).
  *   **Verdict:** This is coherent under the Growth view. It would be slightly incoherent under a pure Log-Utility EU view, where one should screen by Expected Log-Utility directly. The separation suggests they view the "edge" (EV) as an objective feature of the bet, and the "size" (Kelly) as a subjective feature of their capital management.

  **Reading (b): Fractional Kelly**
  You ask if half-Kelly is risk aversion (EU view) or error correction (Growth view).
  *   **The EU Reading:** If I maximize $E[U(w)]$ and $U(w) = \ln w$, full Kelly is optimal. If I bet half-Kelly, I am behaving *as if* my utility function is more concave (e.g., $U(w) = w^{0.5}$). This contradicts the "growth optimal" story unless the growth story is just a mask for risk aversion.
  *   **The Epistemic Reading:** Full Kelly assumes the probability $p$ is known. In reality, $p$ is estimated. If you optimize for an estimated edge that turns out to be smaller, full Kelly can lead to negative growth. Fractional Kelly creates a "safety margin" against estimation error.
  *   **The Practitioners' Language:** They describe it as "prudence." In decision theory, prudence often relates to the third derivative of utility, but in common parlance, it means "caution regarding uncertainty."
  *   **Verdict:** The practice is **philosophically underdetermined** here. Both readings fit the behavior. However, the Growth framework *strictly presupposes* the Epistemic Reading to maintain internal consistency. If they admit they are simply more risk-averse, they abandon the claim that Kelly is "optimal." To keep the claim that Kelly is optimal *for growth*, they must claim that their inputs (probabilities) are imperfect. Therefore, the practice *fits well* with Risk Aversion (EU), but *strictly presupposes* Estimation Error (Epistemic/Growth) to maintain its self-conception as "growth optimizing."

  ### 3. The One-Shot Case: Repetition or Survival?

  The case: 51% to double, 49% to lose everything. One shot.
  *   **EV Calculation:** $0.51 \times 2 + 0.49 \times 0 = 1.02$. Positive EV.
  *   **Kelly Calculation:** Geometric mean of $\{2, 0\}$ is $0$. Growth rate is $-\infty$.
  *   **The Conflict:** The Growth argument relies on the Law of Large Numbers. It says "If you take this bet many times, you go broke." But the premise is *one shot*.
  *   **Why do they refuse?**
      1.  **The Metaphysical Commitment:** They do not believe in one-shot bets. A professional bettor views their career as a single, continuous sequence of wagers. Even if *this* specific market never appears again, *they* will bet again. Therefore, every bet is effectively a fraction of an infinite sequence. To treat a bet as "one-shot" is to misunderstand the nature of their activity.
      2.  **The Lexicographic Constraint:** If we grant the bet is truly one-shot (and the bettor retires immediately after), the Growth argument fails. The refusal then presupposes a **Lexicographic Priority of Survival**. This is not about value (utility of money) but about rationality (conditions of agency).
  *   **Verdict:** The practice presupposes that **all real betting is a repeated game.** This is a metaphysical commitment about the nature of the activity, not just the math. If forced to accept a truly one-shot scenario, the practice collapses into the Lexicographic Survival view. This constraint is a commitment about **rationality**, not value. It says: "A rational agent must preserve the possibility of future action." It is a deontological constraint on the maximization process.

  ### 4. Counterfactuals: How the Practice Would Change

  To clarify the philosophical commitments, consider how the behavior would shift if we swapped the underlying theories.

  **Scenario A: Straightforward Expected-Value Maximization**
  *   **Bankroll Management:** Would vanish. Agents would stake the maximum allowable amount on any bet with positive EV. Concentration would be praised; diversification would be seen as "diworsification" (diluting returns).
  *   **Ruin:** Would not be special. Ruin is just an outcome with utility zero. If a bet had EV +$1M but 99% risk of ruin, an EV maximizer takes it.
  *   **Fractional Kelly:** Would be viewed as irrational cowardice.
  *   **Difference:** The practice would look like high-frequency, high-concentration gambling, indistinguishable from a lottery ticket buyer who only buys +EV tickets.

  **Scenario B: Subjectivist Expected-Utility (Risk-Averse)**
  *   **Bankroll Management:** Would look similar (concave utility leads to diversification).
  *   **Ruin:** Would be treated as "very bad" but not "categorically different." There would be a price at which the agent accepts ruin (e.g., a huge payout for a 1% risk of total loss). In the current practice, there is *no* price; ruin is vetoed.
  *   **Fractional Kelly:** Would be interpreted as "my utility function is not log, it's power." The language of "error" or "prudence" would be replaced by "preference."
  *   **Difference:** The main difference is in the **justification** and the **boundary conditions**. Under EU, the agent asks "How much do I dislike this loss?" Under the Growth practice, the agent asks "Does this threaten the compounding process?" In the middle range of bets, they look identical. At the extremes (near ruin), they diverge: EU trades off risk for reward; Growth practice vetoes risk that threatens the chain.

  ### Summary of Verdicts and Underdetermination

  1.  **Objective:** The practice presupposes **Long-Run Growth Rate** as the rational objective, not Expected Value. Logarithmic utility is the mathematical engine, not the axiological foundation.
  2.  **Coherence of (c):** Coherent under the Growth view (EV = Drift Filter, Kelly = Growth Optimizer). Incoherent under pure EU unless screened by Expected Log-Utility.
  3.  **Fractional Kelly:** **Underdetermined.** It fits Risk Aversion (EU) perfectly but *presupposes* Estimation Error (Epistemic) to remain consistent with the Growth narrative. The practitioners' language ("prudence") leans Epistemic.
  4.  **One-Shot Case:** Reveals a commitment that **all betting is repeated.** If forced to be one-shot, it relies on a **Lexicographic Survival Constraint**. This is a constraint on **Rationality** (preservation of agency), not Value.
  5.  **Ruin:** Treated as an **Absorbing State** (systemic termination), not a low-utility outcome. This distinguishes the practice from standard Risk-Averse EU, where ruin is tradable.

  **Final Philosophical Diagnosis:**
  The practitioners are acting as **Ergodicity Economists** before the term existed. They intuitively grasp that in non-ergodic systems (where you cannot ensemble-average your way out of bankruptcy), the time-average path is the only one that matters. However, their practice is philosophically hybrid: it uses the math of Log-Utility (EU) to solve the dynamics of Growth (Ergodicity), justified by an Epistemic humility (Fractional Kelly), and bounded by a Deontological constraint against Ruin (Survival). The tension you feel arises because they are using a static tool (Utility) to solve a dynamic problem (Time), while speaking the language of survival (Existence).
