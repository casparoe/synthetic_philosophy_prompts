answer: |-
  1. Framing
  The **Principal** is the sovereign people. A critical modeling choice must be flagged immediately: are we modeling the people as a single long-lived agent with time-inconsistent preferences (the Ulysses view) or as a sequence of distinct, short-lived agents (the Dead Hand view)? I will model them as a sequence ($G_t, G_{t+1}$) to capture the conflict, noting that the pro-entrenchment argument requires collapsing this into a single intertemporal utility function. The **Agent** is the government officeholder, but functionally, future generations act as agents of the founders regarding constitutional adherence. The **Contract** is the Constitution, specifying action spaces, rights, and amendment rules. The **Objective Function** is the maximization of discounted intertemporal social welfare. I assume preferences are stable enough to be represented by utility functions and that "binding" means altering the feasible set or payoff structure via an equilibrium mechanism.

  2. The Translation
  The Ulysses argument translates directly into a **commitment device** problem driven by **time-inconsistency**. Generation 0 ($G_0$) maximizes an intertemporal welfare function but anticipates that $G_1$ will exhibit hyperbolic discounting or state-contingent temptation (e.g., defaulting on debt during a crisis). $G_0$ prefers policy $X$ ex-ante, but knows $G_1$ will prefer $Y$ ex-post. The Constitution restricts $G_1$'s action space, removing $Y$ from the feasible set. The value of this entrenchment is the difference between the utility of the committed path and the utility of the time-inconsistent equilibrium. Here, rigidity is a feature, not a bug; it increases the cost of deviation to ensure the ex-ante optimal plan remains **subgame-perfect**.

  The Dead Hand objection challenges the **participation constraints** of the sequential agent model. If $G_0$ and $G_1$ are distinct agents, $G_0$ cannot bind $G_1$ without violating $G_1$'s individual rationality. $G_1$ receives no utility from $G_0$'s welfare; thus, adhering to the Constitution is only rational if it yields a payoff above $G_1$'s reservation utility (revolution or ignoring the text). If the constitution forces $G_1$ into a Pareto-inferior outcome relative to their current options, it is not **incentive compatible**. The objection asserts that without $G_1$'s consent, the contract is void.

  This leads to **renegotiation-proofness**. A constitution that is too rigid prevents mutually beneficial adjustments when states of the world change unexpectedly. If the cost of amendment is too high, $G_1$ will seek extra-constitutional renegotiation (revolution or ignoring rules). If too low, the commitment value collapses. The optimal constitution balances the ex-ante value of commitment against the ex-post efficiency loss of preventing renegotiation. The debate over amendment thresholds is precisely a debate over the cost of renegotiation technology.

  Furthermore, constitutions are **incomplete contracts**. They cannot specify actions for every possible state of the world. This leaves **residual control rights**: who decides when the text is silent? Assigning these rights to a judiciary rather than a majority is a mechanism to insulate residual decisions from $G_1$'s immediate preferences, preserving the commitment. However, this introduces an enforcement problem. In mechanism design, a contract is only as good as its enforcement mechanism. If the judiciary lacks independent power, the constitution is not **self-enforcing**. The debate often assumes enforcement is exogenous, but in polity models, enforcement is endogenous to the equilibrium strategies of the agents.

  Finally, the **Revelation Principle** suggests we should not simply command $G_1$ to adhere. Instead, the mechanism should be designed such that adhering is the dominant strategy given $G_1$'s private information about their preferences. The democratic objection argues that no such mechanism exists without periodic re-authorization. If we model the polity as a single agent, the Dead Hand objection disappears but becomes a problem of internal consistency (why does the past self veto the present?). If we model them as distinct agents, the Ulysses justification collapses unless we assume intergenerational altruism or transfer payments. The theoretical stalemate is thus a disagreement over the boundary conditions of the principal.

  3. Clean Transfers
  *   Time-inconsistency of preferences maps cleanly onto the conflict between ex-ante constitutional design and ex-post majoritarian temptation.
  *   Amendment rules map directly onto the cost of renegotiation technology in contract theory.
  *   Judicial review functions as the assignment of residual control rights in an incomplete contract.
  *   Entrenchment value is equivalent to the welfare gain from a credible commitment device.

  4. Distorted Transfers
  *   **"The People":** Modeling generations as distinct agents fudges the metaphysical continuity of the polity; modeling them as one agent fudges the reality of demographic turnover.
  *   **Enforcement:** Assuming the constitution is enforceable smuggles in a Leviathan; in reality, enforcement is endogenous to the very agents being constrained.
  *   **Utility Comparability:** Comparing $G_0$ welfare to $G_1$ welfare requires an intergenerational social welfare function that the agents themselves may not recognize.

  5. Untranslatable Residue
  *   **Normative Legitimacy:** The claim that binding successors is *wrong* (not just inefficient) is deontological, not welfarist.
  *   **Identity:** The metaphysical question of whether "the People" persist across time is not a preference parameter.
  *   **Rights as Trumps:** Constitutional rights are often claimed as side-constraints on utility maximization, not instruments within it.

  6. Verdict on the Residue
  The residue indicates a structural limitation in mechanism design, not necessarily a lack of clarity in the philosophy. Mechanism design is inherently consequentialist and welfarist; it evaluates institutions based on equilibrium outcomes and efficiency. It cannot capture deontological constraints—claims that certain actions are forbidden regardless of their welfare consequences. When a constitutional theorist argues that binding successors violates their *autonomy*, they are invoking a normative status that mechanism design reduces to a preference for autonomy. If autonomy is just a preference, it can be traded off against security; if it is a right, it cannot. The apparatus dissolves the normative force of the Dead Hand objection into a participation constraint, but this is a category error. The objection is not that successors *won't* comply (incentive compatibility), but that they *shouldn't be made to* (legitimacy).

  However, some philosophical fog does dissolve. The "single agent vs. sequence" puzzle is often treated as a metaphysical mystery in constitutional theory. Mechanism design forces a choice: either specify the intertemporal utility function (single agent) or the game form between generations (sequence). Once forced, many arguments reveal themselves as disguised claims about discount rates or altruism parameters. The residue that remains genuine is the authority question: mechanism design can explain why a constitution is stable, but it cannot explain why it is binding on a agent who prefers to deviate. Stability is an equilibrium condition; obligation is a normative claim. The apparatus explains the mechanics of the Ulysses contract, but it cannot justify the morality of tying hands that do not yet exist.
