prompt: |-
  Just lost most of a evening to an argument with my friend Nadia about common knowledge, and now I need to outsource the thinking. Her line was basically: the group chat works because everyone knows the plan, so what's the big deal. My line was that everyone-knowing is precisely the part that does no work — it's the everyone-knows-that-they-know part that does — and she said that's the same thing said twice. We didn't resolve it. And now I've somehow agreed to run next week's theory lunch on the epistemic conditions for rational play. Fifty minutes, whiteboard, no slides. So I need a plan for how to explain this, not an explanation of it.

  The room: ten-ish people, mostly econ PhD students plus two philosophers. Everyone knows what a Nash equilibrium is, and everyone has definately heard the phrase "common knowledge" — which is the whole problem, they think it's already in the bag.

  What I need:

  1. The order. What has to be in place before the next thing can even be stated, and why that order rather than the obvious one. My instinct is mutual knowledge, then the infinite hierarchy, then the fixpoint/"banner" reading, then the public announcement puzzle, then rationality conditions. Tell me where that's wrong. In particular I don't know whether to bring in the fixpoint version early, because it stops the hierarchy sounding like a joke, or late, because early it sounds like a technicality before anyone has felt the problem it solves.

  2. The one example that carries the whole thing, and what it has to have and to lack. I'd assumed muddy children / the cheating husbands, but I've seen it so many times I can no longer tell whether it's doing work or whether people just nod along because they recognise it. If you'd keep it, say what it's actually doing. If you'd swap it, give me the case and say what it buys that muddy children doesn't. Nadia's candidate is a group chat where the host posts that the party's on, nobody replies, and she panics that nobody's coming — I think that's about acknowledgement or something else entirely and not common knowledge, but I can't articulate why, so settle it.

  3. The misconceptions, in the order they'll form, and exactly where in the sequence I should head each one off. I'm expecting: (a) common knowledge just is everyone knowing; (b) the infinite hierarchy is hand-waving and there's some other, real definition underneath; (c) the announcement adds no new information, so the puzzle must be a trick; (d) common knowledge of rationality is basically automatic in a lab game; (e) something about certainty vs probability 1 vs almost-sure that I have never once gotten straight, so flag it if it's load-bearing. Add the ones I'm missing, especially any that only show up once they've half-understood it. And I have a suspicion that the real fault line is whether "rational" at a node nobody reaches means the same thing as "rational" at a node that does get reached — if that's the sharp edge, tell me where in the sequence it belongs and how to raise it without opening a hole I can't close.

  4. What to leave out, and how to say out loud that I'm leaving it out. I'm thinking the formal possibility-model machinery, and anything about how common knowledge degrades under imperfect information. Confirm or push back.

  5. The single question to put to them at the end that tells me whether the announcement puzzle actually landed, as opposed to them pattern-matching to "oh, it's the muddy children one."

  And if this genuinely can't be done honestly in fifty minutes to that room, tell me what to cut it down to instead of pretending.
