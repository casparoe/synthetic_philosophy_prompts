answer: |-
  You have correctly identified that the word "convention" is doing too much heavy lifting. It is acting as a umbrella term for two fundamentally different kinds of social rules, and conflating them is what creates the moral confusion you're feeling.

  To get clear on this, we need to distinguish between **Coordination Conventions** and **Reliance Conventions**.

  ### 1. The Two Types of Conventions

  **Coordination Conventions** are arbitrary rules where the *content* of the rule does not matter, only the *uniformity*.
  *   **The Logic:** We need to do the same thing to avoid crashing into each other. It does not matter if we drive on the left or the right, only that we agree on one.
  *   **The Binding Force:** The obligation to follow these comes from the need to maintain the equilibrium. If you deviate, you create confusion or risk.
  *   **The Moral Weight:** Low. Breaking a coordination convention is usually a technical error or a nuisance, not a moral violation.

  **Reliance Conventions** are rules where the *content* matters because people have built expectations and life structures around them.
  *   **The Logic:** This is a local solution to a distributional or relational problem. The rule isn't arbitrary; it's the load-bearing wall of a specific social contract.
  *   **The Binding Force:** The obligation comes from **reasonable reliance**. Other people are acting based on the expectation that you will follow the rule. If you break it, you aren't just causing confusion; you are violating an implicit contract and potentially harming specific individuals who relied on you.
  *   **The Moral Weight:** High. Breaking a reliance convention is often functionally equivalent to breaking a promise or withholding payment.

  ### 2. Applying the Distinction to Your Examples

  This framework explains why your three examples feel different, even though people label them all "conventions."

  **Jaywalking (Empty Street):** This is a **Coordination Convention**.
  The rule exists to manage traffic flow and safety statistics. At 2am on an empty street, the coordination value is zero. There is no driver relying on you to stay on the curb. No specific person is harmed. The "binding" nature of the rule evaporates when the equilibrium isn't active. Breaking it is a technical violation, not a moral wrong.

  **Waiting in Line:** This is a **Fairness Convention** (a subset of Reliance).
  This isn't just about order; it's about a first-come, first-served contract. The people behind you are relying on the order to secure their place. If you cut, you aren't just disrupting an equilibrium; you are stealing time and opportunity from specific individuals. They have a claim on you based on their presence prior to yours. Breaking this wrongs *them*, not just "society."

  **Tipping (US):** This is a **Reliance Convention** masquerading as a Coordination Convention.
  This is where the equivocation is most dangerous. People say, "Tipping is just a custom," implying it's arbitrary (like which fork to use). It is not. In the US wage structure, the tip is not a bonus; it is deferred wages. The server is relying on that money to pay rent. When you sit down, you enter an implicit contract where the price of the meal is (Menu Price + Expected Tip). To withhold the tip is to underpay for the service rendered. It wrongs a specific person who is relying on you. Calling it "just a convention" is an attempt to downgrade a financial obligation into a social preference.

  ### 3. What "It's Just a Convention" Is Actually Doing

  When someone defends a rule by saying "it's just a convention," they are usually trying to perform a **category shift**.

  *   **If the rule is actually Coordination:** They are telling you to stop overthinking the content and just align. (e.g., "Just drive on the left, it doesn't matter which side.")
  *   **If the rule is actually Reliance:** They are trying to shield the rule from moral scrutiny. By labeling a reliance-based obligation (like tipping or queuing) as "arbitrary," they are attempting to remove the victim from the equation. They want you to think you are disrupting a system, when you are actually harming a person.

  The phrase is a rhetorical tool to lower the stakes. It works for jaywalking. It fails for tipping.

  ### 4. The Traveler's Obligation

  Now, let's look at your position as a short-term guest. You are outside the social contract's long-term reciprocity, but you are inside its immediate sphere of influence. Here is how the reasons survive:

  **The Coordination Reason: Survives.**
  Even as a visitor, if you drive on the wrong side or disrupt a queue, you create friction and risk for the locals maintaining that equilibrium. You are a variable in their system. Your non-conformity is visible and costly to them. You owe it to the system not to introduce chaos, regardless of how long you stay.

  **The Fair Play Reason: Survives.**
  This is the "Principle of Fair Play." If you benefit from a cooperative scheme, you are obligated to do your part, even if you didn't help build the scheme. By walking into a restaurant that operates on tipping, or a bank that operates on queuing, you are accepting the benefits of the order those rules provide. You cannot free-ride on the locals' conformity just because you're leaving in two weeks. You are consuming the social order; you owe it the maintenance cost.

  **The Reliance/Harm Reason: Survives Completely.**
  This is the strongest bind. The server does not care if you are a tourist. Their reliance on your tip is immediate and material. The person behind you in line cares that you cut, regardless of your passport. If a specific person is relying on your conformity to avoid harm or loss, your status as a visitor is irrelevant.

  ### 5. The Uncomfortable Case: Exploitative Norms

  Here is the straight answer you asked for.

  **Is "you're a guest, so you follow it" a moral claim, or is it etiquette wearing a moral costume?**

  It is **etiquette wearing a moral costume.**

  The "guest" argument is primarily a demand for deference, not a genuine moral imperative. It is used to prioritize the comfort of the host culture over the moral agency of the visitor. However, there is one critical exception where it becomes moral: **Harm Mitigation.**

  You must distinguish between **complicity** and **consequence**.

  1.  **If the norm is demeaning but harmless:** (e.g., taking off shoes, specific greetings, dress codes).
      *   **Verdict:** Follow it. This is basic respect. Refusing is arrogant. But if you break this, you are being rude, not immoral. The "guest" claim here is etiquette.

  2.  **If the norm is exploitative or unjust:** (e.g., a norm that requires you to bribe an official, or a caste-based service expectation, or a gender-segregation rule that enforces inequality).
      *   **Verdict:** You are not morally bound to follow it. Your moral agency travels with you. "When in Rome" is a heuristic for reducing friction, not a command to commit moral wrongs.

      *   **The Nuance:** You must calculate the **consequences of your defiance**.
          *   If refusing to tip in the US gets the server fired or yelled at by their manager, you should tip. Not because the tipping system is right (it's exploitative), but because your defiance punishes the victim, not the system. In this case, you comply to protect the *person*, not the *norm*.
          *   If refusing a bribe or refusing to segregate simply results in *you* being denied service or asked to leave, you should refuse. Your compliance would be sustaining an unjust system without protecting anyone.

  **The Bottom Line:**
  "You're a guest" is a plea for you to minimize friction. It is valid when the cost of conformity is low (etiquette). It is invalid when the cost of conformity is complicity in injustice (morality). Do not let locals offload their systemic problems onto your conscience, but do not use your "moral superiority" as an excuse to harm the vulnerable people operating within that system.

  If the convention hurts a specific person who relies on you (like the server), you follow it to protect them. If the convention only hurts abstract principles or yourself, you are free to reject it.
