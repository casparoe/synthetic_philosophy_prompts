answer: |-
  (I place a single silver shilling on the lectern. It catches the light from the chapel windows.)

  We are gathered in a church. Frank Ramsey would not have knelt here. His wife Lettice called him a militant atheist. He found the universe sufficient without a creator, and he found human life sufficient without a promise of heaven. To speak of him in this space, surrounded by stone that seeks to lift the eye toward God, risks a kind of irony he would have enjoyed and perhaps dismissed. But we are not here to pray for his soul. He did not believe he had one that could be prayed for. We are here to occupy the same air he breathed, for a few minutes, and to acknowledge that the largest thing in this room is not the vaulted ceiling, nor the God it implies, but the person we are remembering.

  I am a novelist. I have spent four years trying to reconstruct the texture of his mind. I stand before an audience divided. On my left, there are those who can recite the Ramsey-Carnap sentence, who know the derivation of the optimal saving rule, who understand his treatment of universals better than he might have explained it himself. On my right, there are those who know him only from a single page, written when he was barely a man. The page where he says the world is not drawn to scale. The page where the stars are shrunk to the size of small coins, and the far future is discounted to almost nothing, so that human beings can stand in the foreground without apology.

  I am not going to explain the mathematics to the family. And I am not going to sentimentalize the philosophy for the mathematicians. The two are the same object, viewed from different distances.

  (I touch the shilling.)

  Ramsey argued that value is not a function of cosmic scale. We have a reflex, when we suffer, to zoom out. We look at the galaxies to feel our smallness, hoping that our pain will shrink with us. Ramsey mocked this. He said he felt no humility before the vastness of the heavens, because the heavens cannot think, and they cannot love. They are cold. To find meaning, you do not look up; you look across. You look at the person standing next to you. The perspective is not a distortion to be corrected by astronomy. It is the only frame in which anything matters at all.

  This brings me to the brother. Michael Ramsey. One brother found that the silence of the universe demanded a voice from beyond it; he became the Archbishop of Canterbury. The other found that the silence of the universe demanded a voice from within it; he became a philosopher. They loved each other. We should not tidy this into a sermon. We should not say they were seeking the same truth by different paths. They were two men, born of the same house, looking at the same shilling, and disagreeing on what it bought. One bought a ticket to eternity; the other bought a meal for today. We honor Frank not by reconciling him to Michael's God, but by respecting the integrity of Frank's "no." He did not want your comfort if it required a lie.

  In my novel, I tried to capture this integrity. There is a scene where Frank and Ludwig Wittgenstein walk at night along the Grantchester meadows. It is dark. The stars are out. In my book, they quarrel. Wittgenstein insists that the ethical and the mystical are one, that the stars have a claim on us that logic cannot touch. Frank, in my version, stops walking. He takes a coin from his pocket—this coin—and he says that a star is only a claim if it can be cashed in human terms. If it cannot feed a child or solve a problem, it is just light.

  It is a good scene. It dramatizes the split between the mystical and the pragmatic. It serves the narrative arc.

  It is not true.

  I need to say this here, in this room, where some of you knew the weight of his hand and the sound of his laugh. I invented that walk. I invented those words. I do not know if they ever spoke of stars at night. I do not know if Frank ever held a coin up to the sky. To write a novel is to borrow a life to pay for a story. It costs me something to stand here and admit that I have fictionalized the dead. It costs you something to hear it. But Ramsey taught us that truth is not a matter of aesthetic satisfaction. If I leave you with the scene, I leave you with a picture. If I take it back, I leave you with the man. The man is harder to hold.

  He died at twenty-six. He left behind a body of work that would have been a lifetime's output for a lesser mind, but he did not leave it for us. He left it because he was thinking. He was not building a monument. He was clearing the ground.

  He wrote that the chief proposition of philosophy is that philosophy is nonsense. But he added the crucial instruction: we must not then treat it as *important* nonsense. We must not bow down to the confusion. We must not turn his atheism into a creed, and we must not turn his mathematics into a religion.

  So what are we to do with him? We do not say he lives on in his work. That is a consolation for the living, not a fact about the dead. He is not in the equations. He is not in the pages of the *Tractatus* he translated. He was a person who got up in the morning, who worried about money, who loved his wife, who argued with his friends, who died when he was too young.

  (I pick up the shilling and close my hand around it.)

  The chapel is beautiful. It reaches for the infinite. But Frank Ramsey reminds us that the infinite is indifferent. The finite is not. This coin is metal. It is cold. But in the hand, it is warm. It has value because we agree to give it value. It has weight because gravity holds it.

  We cannot fix his death. We cannot solve the problem of his absence. We can only acknowledge the scale on which we are living. We are the foreground. The stars are coins. The future is discounted. What remains is the sayable.

  Frank Ramsey was a man who spoke clearly. He asked us to speak clearly too. He asked us not to pretend that the silence of the universe is a message. He asked us to look at each other instead.

  He was here. He was twenty-six. He was our contemporary. And that is enough.
