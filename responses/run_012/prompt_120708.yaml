      *   *Decision:* Let's use a **coin**. Specifically, a shilling or a penny held in the hand. It connects the "stars as coins" image with economics (value) and the tangible human scale. Let's make it a *shilling* (pre-decimal, fits the era) or just "a coin." Let's go with "a coin" to keep it universal, but evoke the specific imagery. Actually, the prompt asks for *one concrete object that stays in view*. If I hold a coin, it anchors the speech.
