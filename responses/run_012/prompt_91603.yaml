answer: |-
  **I.**

  The antechamber smelled of floor wax and old paper. Tomas sat on a plastic chair that clicked when he shifted his weight, so he stopped shifting. His wife, Elena, stood beside him, smoothing the lapel of his jacket for the third time. Her fingers trembled slightly, a vibration he felt more than saw.

  "Collar," she whispered.

  He lifted his chin. She fixed the fabric, her eyes avoiding his. She was wearing the blue dress, the one they saved for funerals and weddings, though this was neither. It was an administrative hearing. On the table between them lay a clipboard with a single sheet of paper clipped to it. The clerk, a man with a gray tie and a face like unbaked dough, tapped a pen against the clipboard without looking up.

  "Five minutes," the clerk said. His voice was flat, practiced. "You know the protocol. Interruption voids the grant. Correction voids the grant. Presence is the only requirement."

  Tomas nodded. He looked at his hands. They were steady now, unlike they had been twenty years ago during the Border Insurgency, when he was nineteen and the rifle felt like it weighed a hundred kilos. He wasn't a monster then. He was just a boy in a uniform that didn't fit, standing in a ditch outside the village of Orla.

  "Elena," he said.

  "Don't," she said softly. She stopped fixing his collar and rested her hand on his shoulder. Her grip was tight, anchoring him. "Just sit. Just listen. Then we go home."

  **II.**

  The hearing room was circular, lined with acoustic tiles that swallowed sound until the air felt thick. There were no windows, only a ring of fluorescent lights that hummed at a frequency that made Tomas's teeth ache. In the center, behind a low podium, sat Mrs. Galle. She was older than he remembered from the photographs, her hair white and pulled back severely. She held a stack of papers bound in red twine.

  To his left, the clerk sat at a desk with a digital timer. To his right, three rows of benches held a handful of observers: a journalist taking notes, a student sleeping, and Elena in the back row, pretending to read a program she wasn't holding.

  Mrs. Galle cleared her throat. The sound boomed, amplified by the room's design. She began to read. Her voice was not angry. It was flat, factual, which made it worse. She described the date, the coordinates, the unit designation. She described the ditch. She described the boy who stood there.

  *The subject stood over the deceased,* she read. *He checked his watch.*

  Tomas blinked. The air in the room seemed to vanish.

  *He checked his watch,* she repeated, the words landing heavily on the tiles. *Then he fired.*

  **III.**

  The memory hit him with the force of a physical blow. Not the shooting—that was a blur of noise and recoil—but the moment before. He hadn't checked a watch. He had been crying. He had been wiping snot and rain from his face with the back of a shaking hand, trying to clear his vision so he could follow the order. He hadn't cared about the time. He had wanted time to stop.

  Mrs. Galle looked up from the paper, her eyes locking onto his. This was the detail. He knew it. To her, the watch check was the proof of his indifference. It was the anchor of her grief. If he was indifferent, then her son died by the hand of evil, and her hatred was justified. It was sacred. It was the only thing holding her upright.

  Tomas's throat tightened. The urge to speak rose like bile. *I didn't,* he thought. *I was shaking. I was scared. I wasn't him.*

  If he spoke, the clerk would stop the timer. The amnesty would dissolve. He would be taken back to the prison they had let him out of six months ago. Elena would lose the pension. They would lose the house. He would be the monster again, but this time with a verdict.

  He looked at Mrs. Galle. She was waiting for the flinch. She needed the flinch.

  He looked at Elena in the back row. She was staring at her hands.

  Tomas opened his mouth. The air rushed in, cold and sharp. He felt the words form on his tongue: *I was crying.*

  He swallowed them. He forced his throat to close around the truth until it tasted like copper. He placed his hands on his knees, palms down, and pressed until his knuckles turned white. He stared at the wall behind Mrs. Galle and did not move.

  **IV.**

  Mrs. Galle finished the entry. She tied the red twine around the papers again, her movements precise. She placed the bundle on the podium and stood up. She did not look at him again.

  The clerk stood and walked over to Tomas with the clipboard. The pen was uncapped. The room was silent except for the hum of the lights.

  "Are there any corrections to the archive entry?" the clerk asked. It was the only question that mattered. The formulaic end to the ritual.

  Tomas looked at the pen. It was a cheap ballpoint, black ink. He looked at the line where he would sign, acknowledging the truth of the document.

  "No," Tomas said. His voice sounded rough, unused.

  "Sign," the clerk said.

  Tomas took the pen. He pressed it to the paper. The ink flowed, dark and permanent. He signed his name, the letters looping slightly because his hand was trembling again, just like it had in the ditch. He handed the clipboard back.

  "Amnesty confirmed," the clerk said, stamping the paper with a heavy thud. "You are dismissed."

  **V.**

  Outside, the sky was gray and low, pressing down on the city of Kaelen. The rain had started, a fine mist that coated the stone steps of the Hall of Records. Elena was waiting by the car, holding an umbrella that turned inside out in the wind. She struggled with it for a moment before giving up and letting the rain hit her face.

  Tomas walked down the steps. His legs felt heavy, as if the gravity here was stronger than anywhere else. He reached the bottom and stood beside her. She didn't ask him how it went. She didn't ask if it was true.

  "Did you stay?" she asked.

  "Yes," he said.

  She opened the car door for him. He got in. The interior was warm, smelling of coffee and the fabric freshener she liked. She got into the driver's seat and started the engine. The wipers slapped back and forth, clearing the glass, then clearing it again.

  "We can go home," she said, putting the car into gear.

  Tomas looked out the window as they pulled away from the curb. He watched the Hall of Records recede in the side mirror, a block of concrete disappearing into the mist. He touched his wrist, where a watch used to be, then let his hand drop to his lap. He closed his eyes and listened to the rhythm of the wipers, keeping time for a journey he had already finished.
