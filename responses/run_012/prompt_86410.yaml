answer: |-
  Here is a tiered ranking of these notions, ordered from strongest to weakest support for the claim that hardness is intrinsic to the problem itself.

  ### Tier 1: Fundamental Limits
  *These notions describe limits that hold regardless of computational power, relying only on the nature of information or description.*

  *   **Information-theoretic hardness:** This is relative to an adversary's access to information (e.g., a key) rather than their compute time, which supports the claim strongly because no amount of algorithmic ingenuity can overcome missing data.
  *   **Kolmogorov incompressibility:** This is relative to the choice of a universal description language (up to a constant), which supports the claim well because it measures the inherent information content of the object itself rather than the time to process it.

  ### Tier 2: Proven Computational Limits
  *This notion offers mathematical certainty but restricts the definition of "machine."*

  *   **Unconditional lower bounds:** This is relative to a restricted machine model (e.g., specific circuit depths), which helps the claim by providing a proven fact but hurts it by suggesting the hardness might vanish if the machine model is expanded.

  ### Tier 3: Conditional Structural Limits
  *These notions apply to general computation but rely on unproven mathematical conjectures.*

  *   **Inapproximability:** This is relative to an approximation factor and complexity conjectures (like $P \neq NP$), which supports the claim strongly within that tier because it asserts the solution space itself is rugged, not just the exact answer.
  *   **Smoothed hardness:** This is relative to a perturbation model and complexity conjectures, which helps the claim by arguing that hardness survives noise and is not an artifact of pathological inputs.
  *   **Worst-case hardness:** This is relative to unproven assumptions (like $P \neq NP$) and the existence of pathological instances, which weakens the claim because the hardness might disappear if the conjecture is false or if pathologies are avoided.

  ### Tier 4: Distributional Limits
  *This notion shifts the source of difficulty from the problem to the input selection.*

  *   **Average-case hardness:** This is relative to a specified input distribution, which hurts the claim significantly because the problem itself may be easy, and the "hardness" is actually a property of the chosen data distribution.

  ***

  ### The Objectivity Split
  The ordering above prioritizes **independence from computational contingencies** (assumptions, models, distributions). However, if you adopt a sense of objectivity based on **generality of the computational model**, the split falls at **Tier 2**.

  *   **Certainty View:** Tiers 1 and 2 are superior because they rely on proofs or information theory rather than conjectures ($P \neq NP$).
  *   **Generality View:** Tier 3 is superior to Tier 2 because Unconditional Lower Bounds (Tier 2) are currently only possible for weak machine models (like restricted circuits), whereas Worst-case Hardness (Tier 3) applies to general Turing Machines, even if conditional. From this view, Tier 2 describes "our machines" (the restricted model) more than "the problem" in a general sense.

  ### Most Overrated Notion
  **Worst-case hardness** is the most often overrated notion by practitioners.

  Engineers frequently encounter the label "NP-Hard" (a worst-case classification) and interpret it as "impossible to solve in practice." This ignores the fact that worst-case instances are often artificial pathologies that never appear in real-world data, leading practitioners to abandon exact solvers prematurely when heuristics or average-case performance might suffice.
