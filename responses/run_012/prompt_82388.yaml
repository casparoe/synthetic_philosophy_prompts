  I've graded this strictly based on standard **Game Theory/Rational Choice** conventions (where the escalation is rational and the cost isn't "sunk").
  *   **Check your lecture notes:** If your professor specifically taught the Dollar Auction as a *behavioral* example of the Sunk Cost Fallacy (rather than a Game Theoretic paradox), you should adjust Part (d) to give them full marks (2/2) and Part (a) to acknowledge their point on irrationality.
  *   **Part (c)** is almost certainly 0 in a Rational Choice course (money is fungible), so keep that strict.
  *   **Part (a)** is the big one: if your course emphasizes that "rational bidders never enter," then their answer is partially right. If the course emphasizes "once in, rational bidders escalate," then my grading above is correct.

