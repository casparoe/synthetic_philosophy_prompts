      *Wait, one nuance:* Weber distinguishes Formal Rationality (calculable rules) from Substantive Rationality (value-oriented). Control is Formal. Alignment is Substantive. Weber was deeply pessimistic about the triumph of Formal over Substantive. This is the key to the "Iron Cage" argument.

