      *Tone Check:* Needs to be somber, authoritative, avoiding modern tech-bro optimism. Use terms like "substantive vs. formal rationality," "polytheism of values," "legitimacy."

      *(Final thought on the "Voice" vs "Extrapolation" flag)*: I need to be careful not to claim I *am* Weber. I need to explicitly state at the end: "Here is where I am simulating his style vs. where I am logically extending his theories to a context he couldn't imagine."

