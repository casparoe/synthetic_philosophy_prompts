      *   Discomfort before naming? Yes (Writing the gaslighting journal).
      *   Predictable errors? Yes.
      *   Limitation? Yes (Artificial stakes).
      *   Confidence/Least Sure? Yes.

      *One tweak for the "Knowledge" aspect:* To make it closer to the paradox, the participants shouldn't just be *told* it's infallible. They should feel they *know* it.
      *   How? Give them a key to decode a part of the map first. If they decode it, they feel agency.
      *   Okay, add a 5-minute decoding step. They "unlock" the Map's authority.

      *Let's finalize the structure.*
      *   Activity Name: "The Cartographer's Error."
      *   Roles: Surveyors.
      *   Materials: Envelopes, Maps, Journals.
