  Dear Coherent,

  Welcome to the column where we align your timeline. Rationality is not just about being right now; it is about being consistent across time. Your future self is who you are becoming. Treat them accordingly. Here are this week's coherence checks.

  Dear Coherent, I know my future self will read a bad blog and become a cultist. Reflection says I should believe what they believe now. Do I join the cult early?
  —Worried Now

  Dear Worried, Reflection requires you to defer to your future self only insofar as you expect them to be rational. If you are certain now that their belief stems from brainwashing, you are certain they are irrational. You do not defer to irrationality. However, be careful: claiming they are wrong is not enough. You must be certain their process is corrupted. If there is any chance they know something you don't, you must split the difference. The escape hatch is narrow. You cannot use it simply because you dislike the destination. If you think they might be right, you must be them now. To disagree is to claim you know better than your future self, which contradicts the principle that they have more evidence.

  Dear Coherent, I want to lock my credit card so Future Me can't buy a boat. But Future Me will really want the boat. Isn't binding them disrespecting their judgment?
  —Ulysses Jr.

  Dear Ulysses, If you bind yourself, you are asserting that Future You will be irrational—specifically, weak-willed. Precommitment is not a violation of Reflection; it is a response to an expected violation of rationality. If you trusted Future You to be rational, you would let them decide. By locking the card, you admit you expect them to fail. The tension is real: either trust them and let them buy the boat, or distrust them and lock the card. You cannot claim they will be rational and still bind them. To bind them is to judge them incompetent. You are protecting your rational self from your irrational self.

  Dear Coherent, Past Me believed in ghosts. I don't. Why do I owe respect to Future Me but not Past Me?
  —Time Traveler

  Dear Time Traveler, Evidence accumulates. Your future self possesses your current evidence plus whatever they gather between now and then. Your past self possesses less. Deference is based on information set inclusion. You respect the future because they know more. You ignore the past because they knew less. It is not about respect; it is about data. To defer backward is to voluntarily ignore new information. That is irrational. The arrow of time is the arrow of information flow. Your past self is a stranger with less data. Your future self is you with more.

  Dear Coherent, Future Me will want to be a accountant. I want to be a poet. Should I start wanting accounting now?
  —Romantic Soul

  Dear Romantic, Reflection strictly governs credences, not utilities. However, if your future preferences are based on better beliefs about the world, you should align your plans. If Future You wants accounting because they know poetry pays poorly, you should update your belief about poverty. But if their preference is just a taste change, Reflection does not apply. Be warned: often what looks like a taste change is actually a belief update. If you think their values are better informed, you should want what they want. Do not cling to ignorance. If their values are the result of rational reflection, you should adopt them now.

  **Note on the View:**
  *   Reflection as a rationality requirement is contested; some see it as a constraint on updating, not a standalone duty.
  *   The reliability proviso is standard but risks triviality if "expecting rationality" just means "expecting agreement."
  *   Precommitment is compatible only if future irrationality is expected.
  *   Extending to preferences is a major stretch; standard Reflection is doxastic, not conative.

  Verdict: The column claims you must defer to your future self unless you are certain they will be irrational, in which case you may bind them.
