answer: |-
  You have identified a genuine and persistent structural feature of historical explanation, one that sits uncomfortably between metaphysics and rhetoric. To the best of my knowledge, there is no single established term that captures the specific configuration you describe: the coexistence of multiple sufficient causes, the variability of the outcome's details depending on the trigger, and the rhetorical slide between type-inevitability and token-inevitability.

  The nearest philosophical concept is **overdetermination**. This occurs when an effect has multiple sufficient causes. However, standard philosophical examples (such as the firing squad you mentioned) assume *causal redundancy with token identity*: whichever bullet kills the prisoner, the death is numerically identical. Your cases involve *causal redundancy with token variance*: whichever cause triggers the war, the war's specific character (duration, settlement, casus belli) differs.

  The nearest systems-theory concept is **equifinality**, which posits that different initial conditions can lead to the same end state. Yet, equifinality usually implies functional equivalence of the end state, whereas you are rightly pointing out that the *particulars* of the event are contingent upon the path taken.

  Because the existing terminology fails to capture the rhetorical slide and the sensitivity of the specific outcome, I propose we name this configuration **The Inevitability Equivocation**.

  ### Definition and Boundaries

  **The Inevitability Equivocation** is a pattern of explanation arising from a state of **Token-Sensitive Overdetermination**. It is defined by three concurrent features:

  1.  **Causal Redundancy:** There exist multiple distinct antecedent conditions, any one of which was sufficient to produce an outcome of a general type (e.g., 'a great power war', 'the collapse of the firm').
  2.  **Token Sensitivity:** While the general type of outcome was guaranteed by the redundancy, the specific details of the actual outcome (the *token*) were dependent on which sufficient cause triggered first.
  3.  **The Rhetorical Slide:** The explanation treats the inevitability of the *type* as though it confirms the inevitability of the *token*, thereby presenting a list of causes that mixes indispensable conditions with dispensable (redundant) ones without distinguishing their logical status.

  **Boundaries:**
  *   **Distinct from the Firing Squad:** In the firing squad case, the effect is invariant. In the Inevitability Equivocation, the effect varies in its particulars.
  *   **Distinct from Pre-emption:** In pre-emption, Cause A triggers the effect and thereby prevents Cause B from operating. In the Equivocation, Cause B *would* have operated had A not, but the resulting effect would have been recognisably different in detail.
  *   **Distinct from Simple Equifinality:** Equifinality suggests different paths to the *same* state. The Equivocation acknowledges different paths to *similar but distinct* states, which are retrospectively categorised as the 'same' event for explanatory convenience.

  ### The Decisive Cause and Timing

  You ask whether the questions 'which cause was decisive?' and 'why then rather than at some other time?' have answers in these cases.

  **'Which cause was decisive?'**
  In cases of the Inevitability Equivocation, this question has no *causal* answer regarding the general type of event, because multiple causes were sufficient. However, it has a *narrative* answer. Historians select the 'decisive' cause not because it was uniquely necessary, but because it offers the greatest explanatory leverage for the *specific details* of the token event. If you wish to explain why the war lasted four years rather than six, the 'decisive' cause is the one that determined the duration, not the one that guaranteed a war would occur. The search never terminates because generations of historians are often answering different questions: one asks 'why a war?', another asks 'why this war?'.

  **'Why then?'**
  This question does have a factual answer. In a field of redundant sufficient causes, the timing is determined by the **trigger**. Background conditions (alliances, arms races) may create the potential (the type-inevitability), but the trigger (the Balkan crisis, the specific quarrel) determines the *tokenisation* of the event. The 'why then' is answered by identifying the final necessary condition that completed the first sufficient set to reach threshold.

  ### Application to Further Cases

  You propose two test cases to see how this account holds.

  **Case 1: A single sufficient cause alongside contributing factors.**
  *Scenario:* An outcome has one cause that would have sufficed, alongside other candidates listed as contributing factors that would *not* have sufficed.
  *Verdict:* This is **not** an instance of the Inevitability Equivocation.
  *Reasoning:* Here, there is no causal redundancy. The 'contributing factors' are merely background conditions or INUS conditions (Insufficient but Necessary parts of an Unnecessary but Sufficient condition). There is no slide between type and token inevitability because the single sufficient cause renders the outcome inevitable in both type and token (barring interference). The list of causes here is logically coherent; it does not mix necessary and sufficient conditions in the contradictory way your pattern describes. This is standard causal analysis, not the equivocation you identified.

  **Case 2: A friendship that ended.**
  *Scenario:* You perceive the friendship was going to end (inevitable), but the actual ending (the row, the date, the words spoken) was contingent.
  *Verdict:* This **is** a clear instance of the Inevitability Equivocation.
  *Reasoning:*
  1.  **Causal Redundancy:** There were likely multiple sufficient strains on the friendship (drifting interests, a specific betrayal, external pressure). Any one might have sufficed to terminate it.
  2.  **Token Sensitivity:** Had it ended over 'drifting interests', the parting would have been gradual and amicable. Had it ended over 'betrayal', it would have been sudden and acrimonious. The *fact* of the ending was inevitable; the *manner* was contingent on the trigger.
  3.  **The Slide:** To say 'the friendship was doomed' slides between 'it could not survive indefinitely' (type) and 'it had to end exactly as it did' (token).
  *Implication:* Recognising this allows you to accept the truth of the inevitability claim (the structural decay was real) without accepting the fatalism of the specific outcome (the painful details were not strictly necessary). It validates the feeling that the ending was 'meant to be' whilst acknowledging the tragedy of its specific form.

  ### Summary

  The pattern you have met is **The Inevitability Equivocation**. It arises when historians (or analysts) confront **Token-Sensitive Overdetermination**. It is bounded by the presence of multiple sufficient causes and the variability of the outcome's details. It is distinct from standard overdetermination because the specific cause matters for the specific shape of the event. In these cases, 'which cause' is a narrative choice rather than a causal fact, whilst 'why then' is determined by the trigger. Recognising this configuration allows one to separate the structural forces that make an event likely from the contingent details that make it specific, curing the sensation that the explanation is at once undeniable and empty.
