answer: |-
  Harsanyi's aggregation theorem is often celebrated in social choice theory as a rigorous bridge between individual rationality and collective morality. It purports to show that if individuals and society alike behave rationally over risks, and if society respects individual preferences, then social welfare must be a sum of individual utilities. Frequently, this is taken to be a 'neutral' derivation of utilitarianism, suggesting that the moral conclusion flows inevitably from formal constraints on rationality rather than contentious ethical commitments. However, this reputation is doubly misleading. The theorem does not establish utilitarianism without significant normative supplementation, and its axioms are far from distributionally innocent.

  The first point of contention concerns the weighting of utilities. The representation result of Harsanyi's theorem demonstrates that the social welfare function must take the form of a weighted sum of individual utility functions: $W = \sum a_i U_i + b$. Crucially, the mathematics alone dictates only that the weights $a_i$ be non-negative; it does not require them to be equal. To move from this weighted utilitarianism to the classical utilitarian conclusion where every person counts for one and none for more than one, one must invoke a further premise. Harsanyi supplies this via the veil of ignorance, arguing that a rational chooser who regards every social position as equally probable would assign equal weights to all individuals.

  This move, however, reveals that the egalitarian aspect of utilitarianism is not a consequence of the aggregation axioms, but an independent normative premise. The veil of ignorance is not a logical truth; it is a specific conception of impartiality. One could equally argue for a weighting scheme that privileges the worst-off, or that weights individuals according to their contribution or virtue, without violating the aggregation theorem itself. Therefore, anyone wishing to derive classical utilitarianism from the theorem must supply and defend a substantive principle of fairness to fix the weights. The theorem itself remains silent on the matter, leaving the door open for hierarchical or prioritarian weightings that are mathematically consistent with the representation result but morally distinct from utilitarianism.

  The second, and perhaps more profound, objection is that the axioms themselves are not neutral regarding distribution. The demand that the social ordering satisfy the expected-utility (von Neumann–Morgenstern) axioms, specifically the Independence Axiom, imposes a linear structure on aggregation that effectively excludes egalitarian concerns. If social preferences must satisfy the Independence Axiom, society must be risk-neutral with respect to utility. This precludes any view on which the weight carried by a person's utility depends on how low that utility is.

  Consider the famous counter-example posed by Peter Diamond. Suppose there are two individuals and one unit of a good. Society can give the good to individual 1 (Lottery A), give it to individual 2 (Lottery B), or flip a coin to decide (Lottery C). If individuals only care about receiving the good, they are indifferent between A and B. A strict egalitarian might prefer C, as it offers ex-ante fairness. However, if society satisfies the Independence Axiom and is indifferent between A and B, it must be indifferent between C and a situation where the good is destroyed. Harsanyi's framework rules out the preference for the coin flip if it is based solely on fairness, because it treats the lottery merely as a sum of expected utilities. By insisting that society obey the vNM axioms, Harsanyi builds in a commitment to risk-neutrality at the social level, which is incompatible with prioritarianism or egalitarianism. Thus, the 'neutral derivation' is an illusion; the axioms themselves privilege a utilitarian structure by fiat.

  A defender of the theorem might offer a strong reply: they would argue that a Pareto-respecting social ordering which satisfies the expected-utility axioms simply *is* the utilitarian structure, so there is nothing left for a separate premise to accomplish regarding the form of the function. On this view, the veil of ignorance is not an ad hoc assumption but a plausible principle of fairness required only to set the weights to unity. Furthermore, they might contend that violating the vNM axioms to accommodate egalitarianism amounts to social irrationality.

  This reply, however, begs the question. To assert that satisfying the vNM axioms is a requirement of rationality for a *collective* agent is to make a substantive ethical claim, not a logical one. Individual rationality does not straightforwardly translate to social rationality. A society might coherently value the reduction of inequality even at the cost of total expected utility, a preference that the Independence Axiom forbids. By defining social rationality in a way that excludes distribution-sensitive preferences, the defender merely stipulates the conclusion. Regarding the veil of ignorance, while it is a plausible principle to some, it relies on the assumption that the chooser is risk-neutral. If the chooser behind the veil were risk-averse, they would maximise the expected utility of a concave transformation of individual utility (prioritarianism), not the sum of utilities. Thus, even the veil argument relies on a specific attitude towards risk that is not mandated by rationality alone.

  Finally, we must scrutinise the Pareto condition as employed in the theorem. Harsanyi applies the Pareto principle to individuals' preferences over lotteries (ex-ante Pareto), rather than to the distribution of utility that results (ex-post Pareto). This is a substantive commitment rather than a minimal requirement of rationality. Ex-ante Pareto requires that if every individual prefers one lottery to another, society must do the same, regardless of the correlation of outcomes. This ignores concerns about the fairness of the resulting distribution. For instance, if two individuals prefer a lottery that gives one of them everything and the other nothing over a sure equal split (perhaps due to risk-seeking behaviour), ex-ante Pareto forces society to endorse the unequal outcome. Accepting this version of Pareto prioritises individual sovereignty over risk above social equity. It assumes that the only thing that matters is the satisfaction of preferences over prospects, disregarding the moral significance of the actual distribution of well-being. This is a robust ethical stance, not a neutral procedural rule.

  In conclusion, Harsanyi's aggregation theorem does not provide a neutral derivation of utilitarianism. It relies on a separate normative premise to equalise weights, and its core axioms impose a linear, risk-neutral structure that systematically excludes egalitarian and prioritarian alternatives. The theorem is best understood not as a proof of utilitarianism, but as an explication of the conditions under which utilitarianism holds.

  I am highly confident in the argument presented above, particularly regarding the structural implications of the Independence Axiom. The single step in which I have the least confidence is the characterisation of the veil of ignorance as necessarily relying on risk neutrality; while standard interpretations suggest this, some sophisticated defenders of Harsanyi argue that risk attitudes behind the veil can be reconciled with the aggregation theorem through specific cardinalisations of utility, a technical nuance that might soften the claim that the veil is purely an independent normative premise.
