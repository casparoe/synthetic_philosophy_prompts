      *   Check that all constraints of the prompt are met (brainstorm first, identify step, explain temptation, price alternatives, address the specific triad (1, 3, ~8)).
      *   Make sure the distinction between the "Frege-Geach Problem" (specific to ethics) and the "Embedding Problem for Non-Cognitivism" (general) is clear.

  8.  **Structure of the Output:**
