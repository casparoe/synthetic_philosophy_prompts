answer: |-
  This is a sophisticated reconstruction of the Frege-Geach problem, extended into a global argument against use-theories of meaning. Your friend has effectively compressed the "embedding problem" into a *reductio* of non-cognitivism that generalizes to all non-assertoric speech acts.

  Here is my diagnosis of the argument, the pricing of your alternatives, and a verdict on whether you can maintain the position you desire.

  ### 1. Diagnosis: The Fault Lines

  The argument contains two distinct fault lines. One is a local equivocation that expressivists have long anticipated; the other is a global semantic assumption that is far more contentious.

  **The Primary Break: Step (4) to (5)**
  The critical error occurs in the inference from (4) to (5). This step relies on a hidden premise: **The Principle of Propositional Contribution.** This principle states that for a clause to contribute to the meaning of a complex sentence (like a conditional), it must contribute a truth-conditional proposition (a "detachable content").

  *   **The Error:** This is a **category mistake** or **equivocation on "Meaning."** In Premise (2), "meaning" refers to *illocutionary potential* or *commitment conditions* (what state of mind the sentence encodes). In Premise (5), "meaning" is tacitly redefined as *truth-conditional content* (a representation of the world).
  *   **Why the Inference Fails:** The expressivist denies that the only way for a clause to have semantic value is to have truth conditions. They argue that the clause 'lying is wrong' contributes a *different kind of semantic value* (e.g., a norm, a plan, or a commitment state) that can logically combine with other values without becoming a description of fact. Step (5) asserts that because the *act* of disapproving is absent in the antecedent, the *content* must be descriptive. The expressivist replies: The *attitude type* is preserved even if the *attitude token* is not enacted.

  **The Secondary Break: Step (7) to (8)**
  This is the generalization move. It assumes that because the logic of embedding seems to force descriptivism in ethics, it must do so for *all* non-assertoric discourse ('Ouch', imperatives, etc.).
  *   **The Error:** This is a **hasty generalization** based on the assumption that classical truth-conditional semantics is the only viable semantics. It ignores developments in **dynamic semantics**, **update semantics**, and **expressivist logic** (e.g., Gibbard 2003, Yalcin 2007) which allow non-truth-conditional content to embed logically.
  *   **Why it Fails:** Premise (8) claims "Every meaningful expression must carry a detachable, assertoric-style content." This is demonstrably false in contemporary philosophy of language. Interrogatives ('Is it raining?') and imperatives ('Shut the door') embed ('If shut the door, then...') without necessarily being analyzed as hidden descriptions of speaker psychology.

  ### 2. Why the Offending Step Looks Innocent

  The temptation of Step (4) is powerful because it exploits the **Fregean Orthodoxy**. For most of the 20th century, the dominant paradigm (truth-conditional semantics) held that:
  1.  Meaning is truth conditions.
  2.  Logic is truth preservation.
  3.  Therefore, anything that participates in logic (like the antecedent of a conditional) must have truth conditions.

  When your friend says, "embedding strips away the doing and leaves behind a meaning," they are relying on the intuition that *only* "stuff" (propositions/facts) can survive the stripping of "force" (acts). It looks like a simple subtraction: *Sentence = Content + Force*. If you remove Force in the antecedent, Content must remain. If the Content was originally just Force (as expressivism claims), then removing Force leaves nothing. Therefore, there must have been hidden Content all along.

  This looks innocent because it treats "meaning" as a singular, monolithic substance. It fails to see that "meaning" might be a functional role that can be played by different kinds of entities (facts vs. norms).

  ### 3. Pricing the Alternatives

  You asked to evaluate the costs of rejecting specific premises. Here is the ledger:

  **Option A: Reject (1) — "Uttering 'Lying is wrong' is not expressing disapproval."**
  *   **Cost:** You abandon the core motivation for expressivism. You lose the explanation of **moral internalism** (the necessary connection between moral judgment and motivation). You become a Cognitivist (moral facts exist) or an Error Theorist (moral sentences aim at facts but fail).
  *   **Effect on Embedding:** Embedding becomes easy (standard logic applies), but you lose the metaethical plot.

  **Option B: Reject (3) — "In 'If P then Q', the clause P *does* express disapproval."**
  *   **Cost:** This is the **Barker/Ridge "Hybrid" or "Ecumenical" move**. You claim that asserting the conditional *does* involve a complex attitude toward the antecedent.
  *   **Effect on Embedding:** It solves the logic problem by making the attitude present in the embedding.
  *   **Downside:** It is phenomenologically counterintuitive. When I say, "If lying is wrong, then stealing is wrong," I do not feel I am currently disapproving of lying. I am hypothesizing a norm. Rejecting (3) forces you to explain away this intuition.

  **Option C: Reject (4)/(5) — "Meaning need not be detachable assertoric content."**
  *   **Cost:** This is the **Quasi-Realist/Expressivist** path (Blackburn, Gibbard). You must construct a non-truth-conditional logic.
  *   **Effect on Embedding:** You accept the "Frege-Geach Debt." You must explain how validity works without truth. (e.g., Validity is not truth-preservation, but *consistency of plans* or *inconsistency of attitudes*).
  *   **Downside:** High technical complexity. You face the "Negation Problem" (Schroeder 2008): distinguishing 'Lying is wrong' from 'Lying is not wrong' requires distinct attitude types, not just negation of a proposition. This is a genuine theoretical debt, not just bookkeeping.

  **Option D: Reject (8) — "Not every expression carries assertoric content."**
  *   **Cost:** You deny the universal applicability of truth-conditional semantics.
  *   **Effect on 'Ouch'/'Hooray':** You preserve the intuition that 'Ouch' means *pain-expression* and not *'I am in pain'*.
  *   **Downside:** You must accept a **fragmented semantics**. Some parts of language work via truth conditions (descriptive), others via update conditions or commitment conditions (expressive). This complicates the theory of communication but aligns better with linguistic diversity.

  ### 4. Can You Keep (1), (3), and Deny (8)?

  **Yes.** This is the most defensible position for a modern expressivist.

  *   **Keep (1):** Moral judgments express attitudes (non-cognitivism).
  *   **Keep (3):** Embedding does not assert the attitude (the antecedent is unasserted).
  *   **Deny (8):** Meaning is not always assertoric content.

  **What you surrender by taking this path:**
  You surrender the hope for a **unified, classical truth-conditional semantics** for all of language. You cannot say that *all* meaning reduces to truth conditions. You must adopt a semantics where the semantic value of 'Lying is wrong' is something like *a set of acceptable plans* (Gibbard) or *a commitment to a norm* (Blackburn), and the semantic value of 'If...then' is a function that operates on *those* values, not just truth values.

  **Is the residual problem a genuine debt or bookkeeping?**
  It is a **genuine debt**.
  *   **Bookkeeping** would be simply stipulating: "Let's call attitudes 'truth-apt' for convenience." (This is what your friend accuses you of in Premise 6).
  *   **Genuine Debt** is explaining *why* 'Lying is wrong' and 'If lying is wrong then stealing is wrong' logically entail 'Stealing is wrong' without invoking truth.
      *   If you deny (8), you owe an account of **logical validity for non-cognitive states**.
      *   For example: Gibbard argues that validity is about the *consistency of norm-acceptance*. If you accept the norm against lying, and you accept the norm that "if lying is banned, stealing is banned," consistency requires you to accept the norm against stealing.
      *   The debt is "genuine" because it is difficult to define "consistency" for attitudes without smuggling in truth-conditions (the "Negation Problem"). However, it is not a *fatal* debt; it is a research program.

  ### 5. Final Verdict

  Your friend's argument is valid *only if* you accept the hidden premise that **Semantic Value = Truth Conditions**.

  If you reject that hidden premise (which is what denying (8) amounts to), the argument collapses. You can maintain that 'Lying is wrong' gets its meaning from its role in expressing disapproval (1), even when embedded (3), provided you allow that the semantic value contributed by the clause is a *normative commitment* rather than a *fact* (denying 5 and 8).

  **Recommendation:**
  Do not surrender (1) or (3). (1) is your metaethical thesis; (3) is linguistic data. Surrender (8). Embrace the view that language is semantically heterogeneous. Some sentences describe the world; others propose how to live in it. The fact that we can reason about both does not prove they are the same *kind* of thing, only that our logic is more capacious than classical truth-conditional semantics allows.

  Your friend's generalization (7-8) is actually a *reductio* of their own semantic monism, not of your expressivism. If their argument proves 'Ouch' means 'I am in pain', their argument is too strong, and thus self-defeating. Use that leverage.
