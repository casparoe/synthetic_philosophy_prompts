          5.  Distinguish between the "genuine debt" (logical embedding) and "bookkeeping" (semantic values).

  2.  **Deconstruct the Argument:**
      *   (1) Uttering 'Lying is wrong' = expressing disapproval (not describing). *Standard Expressivist Claim.*
      *   (2) Meaning = Expressing the attitude. *Strong Expressivist Claim (Use-Theory of Meaning).*
      *   (3) In 'If P then Q', 'P' is not asserted/no attitude expressed. *Observation about Embedding.*
      *   (4) Dilemma: Either meaning/use come apart, or attitude is expressed (but it isn't). *The Frege-Geach Move.*
      *   (5) Therefore, meaning $\neq$ expression. *Intermediate Conclusion.*
      *   (6) Expressivism is false. *Metaethical Conclusion.*
      *   (7) Generalization: Applies to 'Ouch', 'Hooray', Imperatives, Modals. *The "Big" Move.*
      *   (8) Universal Conclusion: No expression's meaning is its use. All meaning is detachable assertoric content. *Global Cognitivism/Descriptivism.*

  3.  **Brainstorming Fault Lines (The "Philosopher's Eye"):**
      *   *Premise (2):* Is this what expressivists actually say? Modern expressivists (Gibbard, Blackburn) often say meaning is *defined* by the conditions of expression, not the *act* of expression itself. There's a type/token distinction here.
      *   *Premise (4):* This assumes a simple "meaning = force" equation. It ignores the distinction between *semantic content* (which might be non-representational) and *illocutionary force*. It assumes that if the force isn't active, the content vanishes or changes type.
      *   *Premise (7)/(8):* This is the generalization step. It assumes that *all* non-assertoric discourse works exactly like moral discourse in a way that forces descriptivism. It ignores dynamic semantics, update semantics, or expressivist semantics (like Blackburn's quasi-realism or Gibbard's norm-expressivism).
      *   *The Equivocation:* "Meaning." In (2), it means "illocutionary potential" or "commitment." In (5)/(8), it means "propositional content" or "truth-conditions."
      *   *The "Doing" vs. "State" distinction:* Expressivism isn't necessarily that meaning *is* the psychological event (the doing), but that meaning is constituted by the *normative role* of that event.

  4.  **Identifying the Core Error:**
      *   The argument relies on a conflation of **Illocutionary Force** and **Semantic Content**, specifically assuming that if the force is "cancelled" (embedded), the content must be propositional/truth-conditional to survive.
      *   The critical break is at **(4)** and the inference to **(5)**. It assumes that for a clause to contribute to the meaning of a complex sentence, it must contribute a truth-apt proposition. This is the *Frege-Geach* assumption itself.
      *   However, the *generalization* in (7)-(8) is where the friend overreaches. Expressivists have developed semantic frameworks (e.g., Gibbard's *Thinking How to Live*, Blackburn's *Ruling Passions*) that assign semantic values to moral terms *without* making them descriptive facts. These values are often sets of plans, norms, or commitment states, not world-states.
      *   So, (8) is false because one can have non-truth-conditional semantics that still handle embedding (e.g., via dynamic semantics or expressivist logic).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the friend's argument. It's a classic Frege-Geach formulation extended to a global semantic claim.
      *   **Diagnosis (The Fault Line):**
          *   Focus on **Premise (4)** and the inference to **(5)**.
          *   Identify the error: **The Equivocation on "Meaning"** and **The Assumption of Propositionalism**.
          *   The argument assumes: Contribution to complex meaning $\rightarrow$ Truth-Conditional Content.
          *   Expressivist counter: Contribution to complex meaning $\rightarrow$ Consistency of Attitudes/Plans.
          *   Also, distinguish Sentence Type vs. Utterance Token. (2) is slightly misleading. Meaning is the *rule* for use, not the *act* of use.
      *   **Why it looks innocent:**
          *   Classical semantics (Frege/Tarski) equates meaning with truth conditions. It's hard to imagine "logic" without truth values.
          *   The intuition that embedding "neutralizes" force suggests the remaining stuff must be "content" in the descriptive sense.
      *   **Pricing the Alternatives:**
          *   *Reject (1):* Abandon expressivism. Become a cognitivist/error theorist. Cost: Lose the explanation of motivation/internalism.
          *   *Reject (3):* Claim attitudes *are* expressed in antecedents. (Barker, Ridge). Cost: Counterintuitive. I don't disapprove of lying when I say "If lying is wrong..."
          *   *Reject (4)/(5) (The Expressivist Move):* Develop a non-truth-conditional semantics. Cost: Technical complexity (the "negation problem," "logic of attitudes"). This is the "genuine debt."
          *   *Reject (8):* Deny the generalization. Allow some expressions to have use-based meaning that embeds via non-classical logic. Cost: Need a unified semantics that handles both descriptive and expressive terms (hybrid theories or global expressivism).
      *   **Can you keep (1), (3), and deny (8)?**
          *   Yes, this is the standard Quasi-Realist/Expressivist path.
          *   (1) is the core thesis.
          *   (3) is the data (embedding doesn't assert).
          *   Denying (8) requires showing how non-assertoric content embeds.
          *   What is surrendered? The classical truth-conditional semantics for *all* language. You accept a fragmented or expanded semantics.
      *   **The "Genuine Debt" vs. "Bookkeeping":**
          *   Bookkeeping: Just labeling things.
          *   Genuine Debt: Explaining validity. If 'P' and 'If P then Q' entail 'Q', what preserves validity if 'P' isn't true/false? The debt is explaining the *logic of attitudes*.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Premise (2):* The friend states (2) as "the expressing... just is what the sentence means." This is a crude version of expressivism (simple emotivism). Sophisticated expressivism (Blackburn/Gibbard) says meaning is determined by the *conditions* under which it is appropriate to express the attitude. I need to point out that rejecting the crude (2) helps, but the Frege-Geach problem survives even for sophisticated versions. The real battle is at (4)/(5).
      *   *The Generalization (7-8):* This is the friend's "killer move." If moral terms are descriptive because they embed, then 'Ouch' must be descriptive. This is *reductio ad absurdum* of the friend's premise (8), not necessarily of expressivism. I should emphasize that (8) is highly controversial in philosophy of language (think of imperatives or questions).
      *   *Semantics-Pragmatics Interface:* Need to mention that "meaning" in (2) might be pragmatic force, while "meaning" in (5) is semantic content. The friend conflates them.

  7.  **Final Polish:**
