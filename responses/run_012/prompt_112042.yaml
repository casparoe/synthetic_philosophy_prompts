  Imagine a patient named Elena visiting a community clinic for a routine blood test required by her employer. She is fully competent, speaks the language fluently, and sits voluntarily in the phlebotomy chair. The nurse, Marcus, knows that due to a temporary malfunction of the internal centrifuge, Elena's sample must be sent to an external partner laboratory for processing. The external lab adheres to the exact same privacy standards, delivers results in the same timeframe, and costs Elena nothing extra. The medical outcome is identical regardless of where the blood is analyzed. Marcus also knows that while some patients worry about external labs, Elena has never expressed any preference or concern about where her samples are processed; she is genuinely indifferent to the location so long as the results are accurate. However, Marcus anticipates that explaining the logistical glitch might confuse her or delay the queue, so he tells her, "We will process this here in our internal lab." Elena nods and extends her arm, consenting to the blood draw based on this representation. She would have consented even if Marcus had told her the truth about the external lab, as she places no value on the distinction. The blood is drawn, sent externally, and the results return perfectly normal. There is no harm, no risk incurred, no coercion applied, and no impairment of Elena's capacity. The only defect is Marcus's lie about the processing location, motivated by a desire for efficiency and to prevent unnecessary anxiety that often arises from logistical explanations, not by any malice or gain.

  Under the counterfactual test, Elena's consent is valid. This test asks whether the consenter would have agreed had they known the truth. Since Elena is indifferent to the processing location and would have authorized the blood draw even if told the sample was going externally, the condition is satisfied. The deception did not alter her decision, nor did it expose her to a risk she would have avoided. On this view, consent is a mechanism to protect welfare and autonomy in decision-making; since neither her welfare nor her ultimate decision was compromised, the permission she granted stands. The lie is morally regrettable, but it does not undo the validity of the consent because the hypothetical agreement mirrors the actual outcome.

  The rival account, however, reaches the opposite conclusion. On this view, consent is not merely about ratifying an outcome or satisfying a hypothetical preference; it is about authorizing specific terms. Valid consent requires that the agent actually authors the permission given, matching the description of the act under which it is permitted to the description of the act performed. Elena authorized a blood draw processed internally. She did not authorize a blood draw processed externally. Even though the physical act and outcome were identical, the transactional terms differed. By lying about the location, Marcus prevented Elena from authorizing the actual terms of the procedure. She transferred authority over her bodily integrity for Procedure A, but Marcus executed Procedure B. Because the authorization did not cover the act as it was actually defined in the institutional framework, the consent is invalid. The wrong is not just the lie, but the fact that the nurse acted without permission for the specific transaction that occurred.

  The feature that makes these two accounts come apart is the distinction between outcome equivalence and descriptive accuracy. The counterfactual test looks downstream to the choice and its consequences, finding them unchanged. The rival account looks upstream to the speech act of consent itself, finding a mismatch between the proposition accepted and the proposition executed. If you remove this feature by making Elena care about the location, the case collapses into an ordinary materiality case. If she minded where the blood was sent, the counterfactual test would fail because she would not have consented to the truth, and everyone would agree the consent is invalid. The case only holds its distinctive shape because the lie is about a fact that is outcome-neutral but transactionally specific.

  A defender of the counterfactual test would mount a strong attack by arguing that this scenario exhibits a wrong of disrespect rather than invalid consent. They would claim that Marcus treated Elena as a means rather than an end by lying to her, which is a violation of her dignity, but that this violation does not retroactively nullify the permission she gave. On this objection, consent is a state of affairs regarding the agent's will and the permissibility of the act; since Elena's will was aligned with the outcome, the act was permissible. The lie is a separate moral failure, akin to breaking a promise after receiving valid permission, but it does not mean the permission was never granted. To say consent is invalid is to say Marcus trespassed, but the defender argues he did not trespass because Elena was willing for him to be there, even if he lied about the address.

  My verdict is that the case can be built to these specifications, but it exposes a fault line in how we define the boundaries of an act. The attack succeeds only if one views consent as primarily concerned with welfare and hypothetical alignment. However, if consent is understood as a normative power to grant authority over specific terms, the attack fails. In this scenario, the lie changes the identity of the transaction within the institutional context, even if it does not change the physical intrusion. Because Elena did not authorize the external processing, Marcus lacked the normative power to send the blood there, rendering his action unauthorized. The case holds because it isolates deception from harm and preference, forcing us to decide whether consent protects the agent's choices or the agent's authorship. Here, authorship was bypassed. The constraint that nearly blocks the case is the requirement that the consenter genuinely does not care; if there is any hidden preference, the case becomes trivial. But assuming strict indifference, the scenario stands: consent is invalid because authority was never transferred for the act as described, proving that validity can fail even when hypothetical agreement succeeds.
