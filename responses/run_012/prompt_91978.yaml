  ### Consensus vs. Contested Map
  *For your seminar, keep these distinctions clear to avoid presenting one theory as fact.*

  | Condition | Status in the Field | Key Theorists / Movements |
  | :--- | :--- | :--- |
  | **(f) Crafted Artifact** | **Broadly Rejected** | There is near-consensus that craft is not necessary. | *Duchamp, Readymades, Institutional Theory.* |
  | **(b) Aesthetic Intent** | **Highly Contested** | Traditionalists say Yes; Conceptualists say No. | *Kant/Bell (Yes) vs. Danto/Dickie (No).* |
  | **(e) Expression** | **Contested** | Too narrow for abstract/minimal art. | *Tolstoy (Yes) vs. Formalists (No).* |
  | **(c) Institutional** | **Dominant but Criticized** | The leading theory of the late 20th C, but accused of elitism. | *Dickie, Danto.* |
  | **(d) Historical Relation** | **Dominant but Criticized** | The leading rival to Institutionalism. | *Levinson, Carroll.* |
  | **(a) Intentionality** | **Broadly Accepted** | Hardest to discard, though AI art is testing this now. | *Most Analytic Aestheticians.* |

  **Study Tip:** If your seminar leader pushes back on the weights, argue that the weights reflect **resilience to counterexamples** (how hard it is to break the rule), not metaphysical truth. That is the standard analytic approach.
