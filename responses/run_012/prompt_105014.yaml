          3.  *Rejected:* Culturally salient distress pattern, spreading online. *Reasoning:* Label application causes symptom drift (looping effect), validates itself rather than tracking independence.
          4.  *Approved:* Distinct dysfunction, uptake stable over a decade.
      *   **New Proposal:** Syndrome, plausible but unconfirmed neural mechanism, self-diagnosed/discussed online, committee expects formal recognition will cause history reinterpretation and different presentation (looping effect).

  2.  **Analyze the Track Record to Extract Rules:**
      *   *Case 1 (Approved):* Biomarker + Distinct Dysfunction + Unserved Patients > Stigma + No Treatment Difference.
          *   *Potential Rule A:* Biological validity (biomarker/dysfunction) is sufficient for approval.
          *   *Potential Rule B:* Serving unserved patients is a priority.
          *   *Potential Rule C:* Stigma and treatment utility are secondary to validity.
      *   *Case 2 (Rejected):* Symptom Cluster + No Distinct Dysfunction + Relabeling + Self-description.
          *   *Potential Rule D:* No distinct dysfunction = Reject.
          *   *Potential Rule E:* Relabeling existing patients = Reject.
          *   *Potential Rule F:* Pre-existing self-description/popularity = Reject (maybe).
      *   *Case 3 (Rejected):* Culturally salient + Online spread. *Reasoning:* Looping effect (label changes symptoms), fails to track independence.
          *   *Potential Rule G:* Susceptibility to looping effects/social construction = Reject.
          *   *Potential Rule H:* Must track something "independent" of the label.
      *   *Case 4 (Approved):* Distinct Dysfunction + Stable Uptake.
          *   *Potential Rule I:* Stability over time supports approval.
