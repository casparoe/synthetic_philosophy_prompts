  1.  **Deconstruct the Request:**
      *   **Task:** Analyze a hospital system's psychiatric nosology committee's track record to determine their implicit decision-making rules. Apply these rules to a new proposal. Identify the most likely rule the committee is actually using. Propose a further case to distinguish between tied rules.
      *   **Constraint:** Focus on the committee's *pattern* of commitment, not on whether the new category *should* exist (normative vs. descriptive analysis).
      *   **Input Data (Track Record):**
          1.  *Approved:* Rare syndrome, known biomarker, distinct underlying dysfunction, patients previously unserved. *Caveats:* No treatment difference, label carries stigma.
