      6.  The Irreversibility Test: Physical vs. Institutional.
      7.  Category-Neutral Standards: The Choice.
      8.  Conclusion: Presupposition vs. Underdetermination.

      *Wait, one nuance:* The prompt asks "Distinguish three readings... and say which the practice commits to." I need to be clear.
      (i) Threshold: No, thresholds differ.
      (ii) Burden: Yes, but applied to category defaults.
      (iii) Substantive Priority: Yes, this drives the defaults.
      Actually, the practice commits to a *hybrid* of (ii) and (iii). The substantive priority (iii) sets the default, and the burden of proof (ii) enforces the default. I will argue it commits primarily to (iii) which *dictates* the application of (ii).

      *Wait, another nuance:* "Say what the practice rules out: a single category-neutral cost-benefit test, a single category-neutral precautionary test, or a rule placing the burden on whoever would disturb the present state of affairs, whatever that state happens to be."
