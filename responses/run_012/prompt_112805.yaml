answer: |-
  ### Part 1: Selecting the Tools (Brainstorming)

  You are correct that your colleagues are arguing about *force* rather than *meaning*. They understand the dictionary definition of the words; they disagree on what doing the saying *does* to the company's obligations. To build a tool you can use in an hour, we must strip the theory down to its load-bearing walls. Here is what stays and what goes.

  **What stays:**
  1.  **Direction of Fit:** This is the engine. Does the sentence try to match words to the world (describing what is true), or match the world to the words (making something true by saying it)? This distinguishes a privacy notice (description) from a service level agreement (promise).
  2.  **Felicity Conditions (Authority & Context):** A sentence only binds the company if the speaker has the institutional power to bind it. A developer blogging on Medium cannot commit the company; a CEO signing a contract can. We need to check if the 'speaker' is authorised.
  3.  **Constitutive vs. Regulative:** Does this rule create a new status (e.g., "You are granted access") or merely govern existing behaviour (e.g., "Do not share passwords")? This helps distinguish policy from operational instruction.
  4.  **Specificity (Measureability):** A promise without a condition for failure is often just an aspiration. "We will try" is not the same as "We will".

  **What goes:**
  1.  **Perlocutionary Effect:** We do not care if the sentence scares the user or reassures them. We care about what obligation was created. Emotional impact is for Marketing; obligation is for Compliance.
  2.  **Uptake:** In written corporate comms, we assume the reader understands the standard meaning. Testing individual uptake is impossible. We assume publication equals uptake.
  3.  **Insincerity:** Whether the company *intends* to keep the promise is irrelevant to whether the promise *exists*. A lie is still a promise; it's just a broken one. We are testing for the existence of the bond, not the integrity of the binder.
  4.  **Deep Metaphysics:** We will not debate whether the commitment exists in the mind or on the paper. We treat the text as the act.

  ***

  ### Part 2: The Compliance Speech-Act Procedure

  This procedure is designed to take a single sentence from a draft and classify its force. It should take roughly ten minutes. If you reach a "Hand-off" point, stop and consult Legal or the relevant Executive.

  **Step 1: The Verb Test (Direction of Fit)**
  *   **Question:** Is the main verb describing a current state/fact, or is it undertaking a future action?
  *   **Look for:** "Is/Are/Has" (Description) vs. "Will/Shall/Must" (Commitment/Rule) vs. "Aim/Strive/Commit to" (Aspiration/Expressive).
  *   **Sufficient Answer:** Identify the primary verb.
  *   **Verdict:**
      *   If "Is/Are": Go to Step 4 (Description).
      *   If "Will/Shall/Must": Go to Step 2 (Binding Check).
      *   If "Aim/Strive/Committed to": Go to Step 3 (Aspiration Check).

  **Step 2: The Binding Check (Felicity & Specificity)**
  *   **Question:** Is the action specific enough to be measured as kept or broken, and is this document the right place to bind the company?
  *   **Look for:** Time limits, specific metrics, clear conditions. Check document type (Contract vs. Blog vs. Policy).
  *   **Sufficient Answer:** Can you prove breach objectively? (e.g., "72 hours" = Yes; "Promptly" = No).
  *   **Verdict:**
      *   If Specific + Formal Document: **Binding Commitment.**
      *   If Vague OR Informal Document: **Hand-off to Legal.** (Risk of unintended contractual term).

  **Step 3: The Aspiration Check (Expressive vs. Commissive)**
  *   **Question:** Does this sentence express a value we hold, or does it promise a result?
  *   **Look for:** "Committed to", "Dedicated to", "Believe in".
  *   **Sufficient Answer:** Does it promise a specific outcome if failed?
  *   **Verdict:**
      *   If no specific outcome linked: **Value Statement (Non-binding).**
      *   If outcome linked (e.g., "Committed to refunding..."): **Binding Commitment.**

  **Step 4: The Authority Check (Constitutive Power)**
  *   **Question:** Does this sentence change someone's status or rights merely by being published?
  *   **Look for:** "You are granted", "Access is permitted", "Employees must".
  *   **Sufficient Answer:** Does this require institutional power to work?
  *   **Verdict:**
      *   If yes: **Policy/Rule.** (Ensure authorised sign-off).
      *   If no: **Description.**

  **Step 5: The "Reasonable Reader" Sanity Check**
  *   **Question:** If this appeared on the front page of a newspaper, would a reasonable person feel cheated if we didn't do it?
  *   **Sufficient Answer:** Yes/No based on common sense.
  *   **Verdict:** If "Yes" but previous steps said "Non-binding", **Hand-off to Legal.** (Risk of estoppel/misrepresentation).

  **Output for your Meeting (The One-Paragraph Justification):**
  > "This sentence uses [Verb Type], which linguistically functions as a [Verdict] rather than a [Alternative]. Because it lacks [Specificity/Authority], it does not create a measurable obligation under our compliance framework. Treating it as binding creates unenforceable risk; treating it as [Verdict] aligns with our actual operational capacity."

  ***

  ### Part 3: Running the Procedure

  Here is the procedure applied to your three examples.

  #### Sentence 1: "We are committed to protecting your data."

  *   **Step 1 (Verb):** "Are committed". This is a state of mind/stance, not a future action verb like "will protect". It falls into the **Aspiration Check**.
  *   **Step 3 (Aspiration):** Does it promise a specific outcome? No. It states a commitment *to the act of protecting*, but defines no standard of protection (e.g., "using encryption", "within 24 hours"). It expresses a value.
  *   **Step 5 (Sanity Check):** Would a reader feel cheated if data was lost? Yes. This flags a risk.
  *   **Verdict:** **Value Statement (Non-binding).**
  *   **Working:** Linguistically, this is an *expressive* act, not a *commissive* one. It describes the company's current attitude, not a contractual covenant. It creates no measurable condition for breach. You cannot sue for "lack of commitment" easily; you sue for "failure to protect".
  *   **The Unpopular Truth:** You have been treating this as load-bearing. It is not. It is rhetorical padding. It signals virtue but creates no enforceable duty. If you want a duty, change "are committed to" to "will protect".
  *   **Meeting Justification:** "This sentence uses a stative verb ('are committed') which functions as a value statement rather than a contractual promise. Because it lacks specific performance metrics, it does not create a measurable obligation. Treating it as binding creates unenforceable risk; treating it as a value statement aligns with its linguistic function."

  #### Sentence 2: "We will notify affected users within 72 hours of discovering a breach."

  *   **Step 1 (Verb):** "Will notify". Future action. **Binding Check**.
  *   **Step 2 (Binding):** Is it specific? Yes ("72 hours"). Is it the right document? Assuming this is a Privacy Notice or Terms, yes.
  *   **Verdict:** **Binding Commitment.**
  *   **Working:** This is a classic promise. It changes the world to match the words. If you fail, you are in breach.
  *   **Meeting Justification:** "This sentence uses a future-tense auxiliary ('will') with a specific metric ('72 hours'), functioning as a binding commitment. It creates a measurable obligation that, if failed, constitutes a breach. We must ensure operational teams can meet this threshold before publication."

  #### Sentence 3: "Managers should aim to hold a weekly one-to-one with each direct report."

  *   **Step 1 (Verb):** "Should aim". Modal verb of recommendation + aspiration. **Aspiration Check**.
  *   **Step 3 (Aspiration):** Does it promise a result? No. "Aim to" explicitly denies a guarantee.
  *   **Step 4 (Authority):** It governs behaviour (Regulative), but weakly.
  *   **Verdict:** **Internal Policy (Aspirational).**
  *   **Working:** This is a directive, but the "aim to" weakens the illocutionary force. It is not an order ("Must hold"). It allows for failure without breach.
  *   **Meeting Justification:** "This sentence uses a modal recommendation ('should aim') rather than a mandatory instruction ('must'). It functions as an aspirational policy guideline, not a binding employment obligation. It allows management discretion without creating grounds for grievance if missed."

  ***

  ### Part 4: Limitations and Gaps

  This procedure is a linguistic tool, not a legal shield. There are three specific areas where it will misfire or stop working.

  **1. The "Reasonable Reliance" Gap (Law vs. Language)**
  Speech-act theory says Sentence 1 ("We are committed") is non-binding. However, contract law sometimes cares less about the grammar and more about the *reliance*. If a customer signs up *because* of that sentence, a court might rule you created a legitimate expectation, regardless of the verb.
  *   *Where theory and practice part:* The procedure says "Value Statement". The law might say "Misrepresentation".
  *   *Action:* If Step 5 (Sanity Check) flags high reliance, ignore the linguistic verdict and call Legal.

  **2. The Context Collapse**
  The procedure assumes the document type is clear. But a sentence on a marketing landing page has different force than the same sentence in a Master Services Agreement. The procedure treats the sentence in isolation.
  *   *Where it misfires:* "We will respond within 24 hours" on a support page might be puffery; in a contract, it's a SLA.
  *   *Action:* You must apply the "Document Type" filter before Step 1. If the document is external-facing marketing, downgrade all "Will" statements to "Aspirational" unless Legal says otherwise.

  **3. The Implicit Declaration**
  Some sentences change reality without using "declarative" verbs. "Your account is active." This looks like a description (Step 4), but it actually *makes* the account active. The procedure might classify this as Description, but it functions as a Constitutive Rule.
  *   *Where it stops:* The procedure cannot detect status changes hidden in descriptive clothing.
  *   *Action:* If a sentence describes a status that grants rights (access, ownership, employment), hand off to Legal regardless of the verb.

  **Final Note on Authority**
  I am a philosopher, not your General Counsel. This procedure clarifies what the words *do*, but only Legal can confirm what the law *says* those words mean in your jurisdiction. Use this to win the argument about *intent*; use Legal to win the argument about *liability*.
