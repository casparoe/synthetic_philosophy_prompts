prompt: |-
  Quick context before I ask: I'm a compliance officer at a mid-sized software company (roughly 400 staff) and a big part of my job is signing off on language before it goes out the door — privacy notices, security and uptime commitments, the code of conduct, support promises, and the occasional public statement after we've messed something up. Everyone treats this as a legal question and legal does get the final say, but most of the fights I actually have are about something else: whether a sentence commits us to a course of action, merely describes what we tend to do, authorises somebody to do something, or just signals a value we like. My colleagues and I genuinely can't agree on a case-by-case basis, and I've started to suspect we're disagreeing about what kind of act the sentence performs rather than about what it means. I need something I can point at in a meeting.

  Please act as a philosopher of language who also spent a few years doing compliance work, and who knows the speech-act tradition (Austin, Searle, and the people who came after) well enough to use it without name-dropping. Think carefully about this before you write anything. Start with a short brainstorming section: which distinctions from that tradition actually earn their keep for someone in my seat — illocutionary force versus perlocutionary effect, felicity conditions, the difference between an act that misfires and one that goes through but is insincere, uptake, constitutive versus regulative rules, the special status of declarations that need an institution standing behind them. Say which you'll keep, which you'll drop as unusable in an hour, and why. Don't survey the literature, just make the cuts and defend them.

  Then build me the actual thing: a decision procedure I can run on a single sentence of a draft in about ten minutes. Ordered questions, what counts as a sufficient answer to each, where the procedure lands on a definite verdict, and where it stops and hands the call to a person — me, or legal, or the relevant executive. Where you simplify a distinction to make it usable, keep the part that changes the verdict and bin the part that only interests specialists, and tell me which is which. Be honest about which steps are judgement calls dressed up as procedure.

  Constraints, so you can calibrate: I have maybe an hour per document, I have no philosophy background, my colleagues will push back and I need to be able to justify a verdict in one paragraph to a non-philosopher, and legal signs off last so I can't be seen to be freelancing. The stakes are that a sentence that reads as a promise but was meant as aspiration can create a commitment we can't keep, and a sentence meant to bind that reads as aspiration lets us weasel out of something we should have been held to — I care about both directions.

  Then run the procedure on three sentences and show your working: (1) "We are committed to protecting your data." (2) "We will notify affected users within 72 hours of discovering a breach." (3) "Managers should aim to hold a weekly one-to-one with each direct report." At least one of your three verdicts should be one I won't like, and if the procedure says the first sentence is doing almost nothing, say so plainly and explain why, because I've been treating it as the load-bearing promise in the whole notice.

  Finish with what the procedure can't do — the cases where it will misfire, the ones it can't settle at all, and where the whole exercise quietly stops being about speech acts and becomes a question of law or of what a reasonable reader would take from the text. Also flag any point where the theory and the practical answer come apart, so I know when I'm following the philosophy and when I'm just following the lawyers.

  Write it in British English please.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of language with compliance experience (knowledgeable in speech-act theory but practical).
      *   **User:** Compliance officer at a mid-sized software company (400 staff).
      *   **Task:** Create a decision procedure to classify sentences in drafts (privacy notices, commitments, etc.) based on what kind of act they perform (promise, description, authorization, aspiration).
      *   **Constraints:**
          *   British English.
          *   Start with a brainstorming section (selecting useful distinctions from speech-act theory, discarding unusable ones).
          *   Build a decision procedure (ordered questions, ~10 mins per sentence, clear verdicts, hand-off points).
          *   Run the procedure on three specific sentences.
          *   One verdict must be unpopular/unexpected (specifically hinting that sentence 1 might be doing "almost nothing").
          *   Finish with limitations (where it misfires, becomes law/reasonable reader test, theory vs. practice gaps).
          *   Tone: Professional, practical, authoritative but humble about limits.
          *   Justification: Must be explainable to non-philosophers in one paragraph.
          *   Time/Stakes: ~1 hour per document, high stakes on commitment vs. aspiration.

  2.  **Brainstorming & Selection (Speech-Act Theory vs. Compliance Reality):**
      *   *Illocutionary Force vs. Perlocutionary Effect:* Crucial. Illocution = what is done *in* saying it (promising, ordering). Perlocution = what happens *because* it was said (panic, reassurance). Compliance cares about the act performed, not the emotional reaction. Keep Illocution, drop Perlocution.
      *   *Felicity Conditions:* Essential. Does the speaker have authority? Is the context right? If not, the act misfires. Keep this, but simplify to "Authority + Context".
      *   *Misfire vs. Abuse (Insincerity):* Important distinction. A misfire means the act didn't happen (e.g., I promise but I'm not authorized). Abuse means the act happened but was lying (e.g., I promise but don't intend to keep it). Compliance cares mostly about misfires (did we bind ourselves?) but also abuse (are we lying?). Keep the distinction but focus on "Did the binding happen?"
      *   *Uptake:* Did the hearer understand? In written docs, uptake is assumed upon publication. Too messy to test per sentence. Drop as a procedural step, assume uptake happens upon release.
      *   *Constitutive vs. Regulative Rules:* Constitutive creates the reality (e.g., "You are hired"). Regulative governs existing behavior (e.g., "Drive safely"). Crucial for distinguishing policy vs. commitment. Keep this.
      *   *Declarations:* Need institutional power. "You're fired" only works if I'm the boss. Vital for compliance. Keep this.
      *   *Direction of Fit:* Word-to-world (assertions) vs. World-to-word (promises/orders). This is the core engine for distinguishing fact from commitment. Keep this, simplify terminology.
      *   *Drop:* Deep metaphysical debates, historical lineage (Austin vs. Searle), "propositional content" analysis beyond basic subject/verb.

  3.  **Developing the Decision Procedure (The "Compliance Speech-Act Test"):**
      *   Goal: Classify sentence into: Binding Commitment, Policy/Rule, Aspiration/Value, or Description.
      *   Time: ~10 mins.
      *   Steps:
          1.  **Verb Check (Direction of Fit):** Is it trying to change the world (will/must) or describe it (is/are)?
          2.  **Authority Check (Felicity):** Do we have the power to bind the company here?
          3.  **Conditionality Check:** Is it dependent on something outside our control?
          4.  **Specificity Check:** Is it measurable?
          5.  **Verdict:** Commitment, Rule, Aspiration, Description.
      *   Hand-off: If ambiguous on authority or specificity, kick to Legal.

  4.  **Running the Procedure on the Three Sentences:**
      *   (1) "We are committed to protecting your data."
          *   Verb: "Are committed" (State of mind/Aspiration vs. Promise).
          *   Specificity: Low.
          *   Verdict: Aspiration/Value Statement (Not a binding contractual promise). *This matches the user's hint.*
      *   (2) "We will notify affected users within 72 hours of discovering a breach."
          *   Verb: "Will notify" (Future action/Promise).
          *   Specificity: High (72 hours).
          *   Verdict: Binding Commitment.
      *   (3) "Managers should aim to hold a weekly one-to-one with each direct report."
          *   Verb: "Should aim" (Aspiration/Policy).
          *   Authority: Internal policy.
          *   Verdict: Internal Policy/Aspiration (Not externally binding, weak internally).

  5.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* British English (authorise, programme, colour, etc.). Professional, slightly academic but grounded.
      *   *Section 1: Brainstorming.* Be decisive. Cut the fluff.
      *   *Section 2: The Procedure.* Make it a flowchart-like list. Clear "If X, then Y".
      *   *Section 3: The Examples.* Show the working. Be blunt about Sentence 1.
      *   *Section 4: Limitations.* Where philosophy meets law (reasonable reader test).

  6.  **Refining the "Unpopular Verdict":**
      *   The prompt asks: "if the procedure says the first sentence is doing almost nothing, say so plainly and explain why, because I've been treating it as the load-bearing promise in the whole notice."
      *   I need to ensure I explain *why* "We are committed" is often legally hollow compared to "We will". It expresses a state of mind, not necessarily a contractual obligation. This is a classic speech-act distinction (Expressive vs. Commissive).

  7.  **Refining the Limitations:**
      *   Estoppel/Reliance: Even if not a promise, if people rely on it, it might become binding in law. Philosophy says "no promise", Law says "tough, you created an expectation". I must highlight this gap.
      *   Context: A sentence in a contract vs. a marketing blog. The procedure needs to account for document type.

  8.  **Final Review against Constraints:**
      *   British English? Yes.
      *   Brainstorming section first? Yes.
      *   Decision procedure (ordered questions, verdicts, hand-offs)? Yes.
      *   Run on 3 sentences? Yes.
      *   One unpopular verdict (Sentence 1)? Yes.
      *   Limitations section? Yes.
      *   No philosophy name-dropping (use concepts, not names)? Yes.
      *   Justifiable in one paragraph? I should ensure the explanation is concise.

  9.  **Writing - Step-by-Step:**
      *   *Intro:* Acknowledge the role.
      *   *Brainstorming:* Cut perlocution, uptake, deep metaphysics. Keep direction of fit, felicity/authority, constitutive/regulative.
      *   *Procedure:* 5 Questions.
      *   *Application:* Walk through the three sentences.
      *   *Limitations:* Law vs. Language, Context, Reliance.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* academic. The user has no philosophy background. Explain "direction of fit" simply as "changing the world vs. describing it". Ensure the British spelling is consistent (authorise, programme, analyse, centre).

      *(Check on Sentence 1)*: "We are committed to..." is often treated as marketing puffery or a statement of current intent, not a contractual covenant. I need to be clear that while it *feels* like a promise, linguistically it's often an expressive act (stating a feeling/stance) rather than a commissive act (undertaking an obligation). This fits the "unpopular verdict" requirement.

      *(Check on Sentence 3)*: "Should aim" is clearly non-binding internally too. Good contrast.

      *(Check on Hand-offs)*: Ensure I explicitly say when to call Legal.

      *(Check on Tone)*: "Philosopher of language who also spent a few years doing compliance work". Needs to sound empathetic to the grind of compliance but rigorous on the logic.

      *(Final Polish)*: Ensure the "one paragraph justification" requirement is met in the procedure output (i.e., provide the script for the meeting).

