answer: |-
  Here is the plan. It is designed to prevent the audience from retreating into the "capacity saves us" defense, forcing them to grapple with the moral weight of temporal identity.

  ### The Carrying Case: "The Unrevoked Convert"

  **What the case must contain:**
  1.  **Self 1 (The Signer):** A patient, fully competent, who signs an Advance Directive (AD) based on a deep, identity-constituting commitment (e.g., a Jehovah’s Witness refusing blood, or a strict pro-life advocate refusing abortion to save their own life).
  2.  **Self 2 (The Repudiator):** The same patient, years later, fully competent, who has undergone a genuine conversion of values (e.g., renounced the faith, or changed their view on bodily sanctity).
  3.  **The Gap:** Self 2 has *not* legally revoked the AD. This is crucial. They are not incapacitated; they are administratively negligent or philosophically ambivalent about their right to overwrite Self 1.
  4.  **The Trigger:** A medical situation arises where the AD *would* dictate treatment, but Self 2 verbally expresses the opposite wish.
  5.  **The Conflict:** The hospital system (or family) insists that the *document* (Self 1) holds authority until the *paperwork* is changed, while Self 2 claims their *current mind* should hold authority.

  **What the case must NOT contain:**
  1.  **No Incapacity:** Self 2 must be able to speak, reason, and sign a new form *right now*. If they cannot speak, the audience will retreat to "substituted judgment."
  2.  **No Coercion:** Self 2’s change of heart must be authentic, not the result of depression or external pressure (psychiatry residents will look for this).
  3.  **No Emergency:** There must be time to discuss. If it’s a crash, the clinical imperative overrides the ethics.

  **Why this case:** It isolates the **authority of the past** from the **incapacity of the present**. Legally, Self 2 wins. Ethically, the tension remains: Does Self 1 have a moral claim on Self 2’s body?

  ---

  ### The Dependency Sequence (90 Minutes)

  You cannot jump to the conclusion. Each step creates the necessary condition for the next question to make sense.

  **1. The Intuition of Planning (Minutes 0–15)**
  *   **Idea:** We value ADs because we value *extended agency*. We want our future to reflect our current values.
  *   **Dependency:** You must establish that Self 1 was rational and authentic. If Self 1 was impulsive, the rest of the session collapses into "bad paperwork."
  *   **Activity:** Ask the chaplains: "When is a vow binding?" Ask the residents: "When is a treatment plan binding?"
  *   **Goal:** Establish that Self 1 deserves *some* respect.

  **2. The Reality of Metamorphosis (Minutes 15–30)**
  *   **Idea:** People change fundamentally, not just superficially. Self 2 is not a "corrupted" Self 1; they are a *new* moral agent in the same body.
  *   **Dependency:** This step depends on Step 1. If Self 1’s values didn't matter, Self 2’s change wouldn't be a conflict; it would just be an update.
  *   **Activity:** Present the "Convert" case. Emphasize Self 2’s competence.
  *   **Goal:** Establish that Self 2 also deserves *full* respect.

  **3. The Collision of Authorities (Minutes 30–60)**
  *   **Idea:** The conflict is not Autonomy vs. Welfare (the standard trap). It is **Past Autonomy vs. Present Autonomy**.
  *   **Dependency:** This depends on Steps 1 & 2. If either self lacks authority, there is no collision.
  *   **Activity:** Roleplay the conversation. The Chaplain argues for the integrity of the vow (Self 1). The Psychiatrist argues for the reality of the current mind (Self 2).
  *   **Goal:** Force the audience to choose which "time" constitutes the real person.

  **4. The Burden of Revocation (Minutes 60–80)**
  *   **Idea:** If Self 2 wins, what is the cost? The cost is the destabilization of all long-term planning. If Self 1 can be easily voided, ADs become mere "current preference forms."
  *   **Dependency:** This depends on Step 3. You can only discuss the cost of the resolution once the resolution is felt.
  *   **Activity:** Ask: "If Self 2 can ignore Self 1 without consequence, why did we ask Self 1 to sign anything?"
  *   **Goal:** Show that honoring Self 2 undermines the institution of the AD itself.

  **5. The Synthesis (Minutes 80–90)**
  *   **Idea:** Authority lies with Self 2, but *accountability* lies with the relationship between the two.
  *   **Dependency:** Requires the tension of Step 4 to be resolved not by law, but by narrative.
  *   **Goal:** Move from "Who wins?" to "How do we honor the transition?"

  ---

  ### The Misconception Map

  You must head these off at precise moments, or the discussion will derail.

  **1. "Honoring the directive simply is respecting autonomy."**
  *   **The Misconception:** That autonomy is a static property you deposit in a document.
  *   **When to kill it:** **Minute 15 (End of Step 1).**
  *   **How:** Explicitly state: "If autonomy is the right to control your future, does it include the right to *change your mind* about that control?" If you don't kill this here, they will treat Self 2’s change of mind as a loss of autonomy rather than an exercise of it.

  **2. "The real clash is Autonomy vs. Welfare."**
  *   **The Misconception:** That Self 2 wants treatment because they want to *live* (welfare), and Self 1 refused it to *avoid suffering* (autonomy).
  *   **When to kill it:** **Minute 30 (Start of Step 3).**
  *   **How:** Ensure the case makes clear that Self 2 is willing to accept the risks of their new choice. The conflict is not about safety; it is about *identity*. "Self 2 is not trying to be safe; they are trying to be *themselves*."

  **3. "The Document is the Patient."**
  *   **The Misconception:** That the legal form has more stability than the human being.
  *   **When to kill it:** **Minute 60 (Start of Step 4).**
  *   **How:** When discussing the "Burden of Revocation," point out that the document cannot suffer. Only the person can. If the audience privileges the paper, ask: "Who feels the pain of this decision? The ink or the arm?"

  ---

  ### The Final Question

  Do not ask: *"What should the doctor do?"* (They will recite the law: Honor the competent patient).
  Do not ask: *"Is the AD valid?"* (They will say: "No, because capacity trumps.")

  **Ask this:**
  > "If Self 2 chooses to override Self 1, **who owes whom an apology?**"

  **Why this works:**
  *   If they say "No one," they haven't grasped the moral weight of Self 1.
  *   If they say "Self 2 owes Self 1," they acknowledge the authority of the earlier self.
  *   If they say "Self 1 owes Self 2," they acknowledge the tyranny of the past.
  *   It tests whether they see the two selves as distinct moral agents in tension, rather than a legal problem to be solved.

  ---

  ### The Deliberate Omission

  **Leave out:** **The legal mechanism of revocation.**
  Do not explain *how* Self 2 tears up the form. Do not discuss state statutes on verbal vs. written revocation.

  **Word to them:**
  > "I am leaving out the law because the law has already solved this problem: the competent present always wins. If we talk about the law, you will stop thinking about the *authority* of the past and start thinking about *liability*. I want you to sit with the discomfort that the law removes. I want you to feel the loss that Self 1 suffers when Self 2 takes the pen."

  ---

  ### Confidence and Doubt

  **Confidence Level:** **85%**
  This structure successfully isolates the "Competent vs. Competent" variable, which is the hardest constraint. The sequence forces the audience to build the ethical tension before resolving it. The "Apology" question is a robust probe for internalization.

  **The Claim I Am Least Sure Of:**
  I am least sure of the claim in **Step 4 (The Burden of Revocation)**: *"If Self 2 can ignore Self 1 without consequence, ADs become mere current preference forms."*
  **Why:** There is a strong counter-argument that ADs are *always* just current preference forms, and pretending otherwise is paternalistic. If your audience is heavily principled libertarians (common in psychiatry), they may reject the idea that Self 2 has *any* debt to Self 1. If they reject this premise, Step 5 collapses. You must be prepared to defend the idea that a "Life Project" has moral weight beyond the current moment, or the session will end in a shrug.
