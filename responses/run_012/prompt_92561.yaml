      *   **Neutrality:** The scientist brackets the truth of the experience. It doesn't matter if the subject is lying, deluded, or accurate; what matters is that they *believe* they are having that experience.
      *   **Goal:** Explain behavior and correlate the HPW with third-person physical states (neuroscience, etc.).
