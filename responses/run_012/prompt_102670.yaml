  4.  **Drafting - The Reply:**
      *   *Tone:* Authority, slightly patronizing, clinical.
      *   *Structure:* Numbered prescriptions.
      *   *Content:* Diagnose the partner as stuck at a lower tier (e.g., Skinnerian). Advise the writer to act as the "Gregorian" handler.
      *   *Satire:* Implicitly rank the partner as lesser human based on cognitive tier. Treat the taxonomy as a ladder of moral/relational worth.

  5.  **Drafting - The Editor's Note:**
      *   *Content:* Clarify that the taxonomy is descriptive, not necessarily hierarchical or moral. Note the contestation around the "ladder" aspect.

  6.  **Writing - Step-by-Step:**

      *   *Header:* DEAR MIND DOCTOR / THE COGNITIVE BEAT.
      *   *Letter:* "Dear Mind Doctor, My husband... refuses to use a calendar... learns only from pain... is he broken?"
