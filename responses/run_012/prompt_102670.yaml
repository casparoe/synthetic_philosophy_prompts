      Reply: Diagnose him as Skinnerian. Advise her to be the Gregorian architect.

      *Editor's Note:* Needs to be precise. "Settled" = the categories exist as descriptions. "Contested" = strict sequencing, moral weight, exclusive occupancy.

  7.  **Review against Constraints:**
