          *   It rules out value systems that prioritize rapid improvement or view the status quo as unacceptable (e.g., radical utilitarianism).
          *   If the baseline is incoherent (because existence implies impact), the practice must admit it is optimizing for human comfort/predictability, not objective safety, and becomes a political constraint rather than a technical one.

      *   *Refining for density and flow:*
          *   Combine the baseline and value theory points.
