          *   Is it internally consistent (avoiding all side effects = doing nothing)?
          *   Reconstruct the implicit theory (required vs. convenient implementation).
          *   What would the practice have to give up if the baseline idea is incoherent?
      *   **Constraints:**
          *   Lead with the bottom line in the first sentence.
