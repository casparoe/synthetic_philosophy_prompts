          4.  **Consistency & Paralysis:** The system avoids paralysis only by tuning a trade-off parameter between task reward and impact penalty. This tuning is not mathematical but normative; it decides how much risk is acceptable for how much gain. Consistency is maintained only by accepting that "safety" is a relative threshold, not an absolute state.
