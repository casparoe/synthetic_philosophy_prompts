answer: |-
  The practice of penalizing impact is not a technical workaround for value alignment but a concealed conservative ethic that treats the status quo as inherently preferable and assumes human intentions can be neatly isolated from their consequences.

  This design habit presupposes that the "default trajectory"—usually defined as what happens if the agent does nothing—is a safe or neutral reference point, which embeds a status quo bias directly into the reward function. By penalizing deviation from this baseline, the system asserts that the existing causal order is safer than the agent's agency, licensing value systems based on the precautionary principle while quietly ruling out radical utilitarianism or any goal where transforming the world is the primary objective. The distinction between "task" and "side effect" only holds for narrow objectives; it collapses for transformative goals like "cure cancer," where the desired outcome is itself a massive deviation from the baseline, meaning the practice implicitly assumes AI will remain a tool for incremental tasks rather than a driver of historical change.

  To cash this out without a full theory of value, proponents rely on proxies like reversibility or attainable utility preservation, which assume that keeping future options open is intrinsically good and reducing them is bad. This avoids defining *which* futures are good, but it still imposes a value judgment that optionality outweighs specific outcomes, creating internal tension where the agent must balance task completion against impact minimization via a tunable parameter that is ultimately a normative choice about acceptable risk. If the baseline idea proves incoherent because an embedded agent cannot truly do "nothing," the practice must surrender its claim to objectivity and admit it is not minimizing "impact" but minimizing "human discomfort" or "visibility," shifting from a safety guarantee to a user experience constraint designed to keep operators comfortable rather than the world safe.
