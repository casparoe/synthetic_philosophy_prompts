answer: |-
  # The Consciousness Report Decision Tree

  **Starting Commitment:** A science of consciousness must rest on evidence that can be shared and checked by multiple observers.

  ### **Node 1: The Nature of the Report**
  When a subject speaks about their mind, is their speech primarily **a direct record of inner facts** (Testimony) or **a behavior in the world that needs interpretation** (Text)?

  *   **Path A: Direct Record (Testimony)** → Go to Node 2.
  *   **Path B: Behavior to Interpret (Text)** → Go to Node 4.

  ---

  ### **Node 2: The Reliability of Access**
  If the speech is a direct record, is the subject's natural ability to look inward reliable enough for science without special training?

  *   **Yes:** → **Leaf 1**
  *   **No:** → Go to Node 3.

  #### **Leaf 1: The Naive Witness (Old Introspectionism)**
  *   **Awkward Commitment:** Must accept that a subject who says nothing provides no data, even if they behave normally.
  *   **Distinguishing Case:** *The Silent Subject* (Behaves normally but reports nothing; science stops here).

  ---

  ### **Node 3: The Role of Third-Person Data**
  If the subject requires training to report accurately, does their trained report stand alone, or must it match brain data?

  *   **Stands Alone:** → **Leaf 2**
  *   **Must Match Brain:** → **Leaf 3**

  #### **Leaf 2: The Trained Expert (Disciplined Phenomenology)**
  *   **Awkward Commitment:** Must accept that a trained subject can report an experience the scientist believes is physically impossible.
  *   **Distinguishing Case:** *The Impossible Report* (Subject claims to see with their elbow; scientist must believe them).

  #### **Leaf 3: The Feedback Loop (Neurophenomenology)**
  *   **Awkward Commitment:** Gives the brain scan veto power over the lived feeling if the two disagree.
  *   **Distinguishing Case:** *The Impossible Report* (Subject claims to see with their elbow; brain scan says no, so the report is discarded).

  ---

  ### **Node 4: The Reality of Experience**
  If the speech is a behavior to be interpreted, does it point to a real inner experience that is hidden from view?

  *   **Yes (Hidden Experience):** → Go to Node 5.
  *   **No (No Hidden Experience):** → Go to Node 6.

  ---

  ### **Node 5: The Author of the Meaning**
  If there is a real experience behind the words, who counts as the **author** of the report's meaning?

  *   **The Subject:** → **Leaf 4 (Unnamed)**
  *   **The Scientist:** → **Leaf 5**
  *   **The Culture:** → **Leaf 6**

  #### **Leaf 4: Unnamed (Incoherent)**
  *   **Diagnosis:** Incoherent. If the subject is the sole author of a real experience, the report is Testimony (Path A), not a Text to be interpreted (Path B).
  *   **Distinguishing Case:** N/A (Position collapses under logic).

  #### **Leaf 5: The Objective Interpreter (Heterophenomenology)**
  *   **Awkward Commitment:** Must deny the subject authority on whether they are conscious, treating them like a character in a novel.
  *   **Distinguishing Case:** *The Split-Brain Patient* (Scientist knows the subject's explanation for a movement is a fabrication, subject does not).

  #### **Leaf 6: The Cultural Script (Social Constructivism)**
  *   **Awkward Commitment:** Makes consciousness depend on language availability, implying infants or animals lack rich inner lives.
  *   **Distinguishing Case:** *The Hypnotized Subject* (Vivid experience is treated as a role played from a cultural script, not a private state).

  ---

  ### **Node 6: The Function of the Illusion**
  If there is no hidden inner experience, is the report a **mistake** about the mind or an **action** of the body?

  *   **Mistake (Error):** → Go to Node 7.
  *   **Action (Doing):** → **Leaf 7**

  #### **Leaf 7: The Living Body (Enactivism)**
  *   **Awkward Commitment:** Struggles to explain vivid hallucinations where the body is paralyzed and no action occurs.
  *   **Distinguishing Case:** *The Blindsight Subject* (Denies seeing but guesses correctly; "seeing" is just the successful guessing action).

  ---

  ### **Node 7: The Target of the Error**
  If the report is a mistake, is the error that we **think we have experience**, or that we **argue about the words**?

  *   **Think We Have Experience:** → **Leaf 8**
  *   **Argue About Words:** → **Leaf 9**

  #### **Leaf 8: The User-Illusion (Illusionism)**
  *   **Awkward Commitment:** Must explain why the illusion feels so real without using the word "feel."
  *   **Distinguishing Case:** *The Perfect Duplicate* (A zombie is indistinguishable from a human because "feeling" is just a false report).

  #### **Leaf 9: The Verbal Dispute (Deflationism)**
  *   **Awkward Commitment:** Dismisses the suffering of pain as a linguistic confusion rather than a biological fact.
  *   **Distinguishing Case:** *The Impossible Report* (Claims of "seeing with the elbow" are not false, but nonsense, like asking "what color is jealousy?").

  ---

  ### **Summary of Positions**

  1.  **The Naive Witness** (Old Introspectionism)
  2.  **The Trained Expert** (Disciplined Phenomenology)
  3.  **The Feedback Loop** (Neurophenomenology)
  4.  **Unnamed** (Incoherent Combination)
  5.  **The Objective Interpreter** (Heterophenomenology)
  6.  **The Cultural Script** (Social Constructivism)
  7.  **The Living Body** (Enactivism)
  8.  **The User-Illusion** (Illusionism)
  9.  **The Verbal Dispute** (Deflationism)
