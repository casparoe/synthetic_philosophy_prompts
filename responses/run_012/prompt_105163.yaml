answer: |-
  ### Part I: The Specification of Desiderata

  You are correct to demand a specification before evaluating solutions. The literature on vagueness is often a contest of formalisms in search of a problem, rather than an analysis of the problem dictating the formalism. Below is the specification. It distinguishes between *phenomena* (what exists), *intuitions* (how it seems), and *logical constraints* (how we reason about it).

  #### 1. The Phenomena (What must be modeled)
  *   **Borderline Cases:** There must be objects for which the application of a vague predicate (e.g., "is red") is not determinately true and not determinately false.
      *   *Motivation:* The existence of patches that competent speakers hesitate over, even under ideal conditions.
  *   **Clear Cases:** There must be positive and negative paradigms. A fire engine is red; the sky is not.
      *   *Motivation:* Without clear cases, communication using vague terms would be impossible.
  *   **Higher-Order Vagueness:** The boundary between "clear cases" and "borderline cases" must itself be vague. There is no sharp line where redness stops and borderline-redness begins.
      *   *Motivation:* Any attempt to draw a sharp line around the borderline region seems to recreate the original problem (the "second-order sorites").
  *   **Penumbral Connections:** Logical relations between vague predicates must be preserved. A patch cannot be both "red" and "green," even if it is borderline for both. A patch that is borderline red and borderline orange must still satisfy "red or orange."
      *   *Motivation:* Fine's observation that truth-value gaps should not break logical laws like non-contradiction or excluded middle within the penumbra.

  #### 2. The Intuitions (Pre-theoretic judgments to preserve)
  *   **Boundarylessness:** There is no specific point in a sorites series where the predicate suddenly switches from true to false.
      *   *Motivation:* The semantic intuition that "red" does not carve nature at a specific wavelength joint.
  *   **Tolerance:** A change sufficiently small in the relevant dimension (hue, height, grain count) cannot change the status of the predicate.
      *   *Motivation:* The plausibility of the sorites conditional premise ("If $n$ grains is not a heap, $n+1$ is not a heap").
  *   **Context Sensitivity:** The extension of vague predicates shifts with comparison classes and conversational context.
      *   *Motivation:* A 6ft man is tall for a jockey, not tall for a basketball player.
  *   **Phenomenal Indiscriminability:** If two items look identical to a competent observer, they should not be assigned different semantic values *on the basis of that observation alone*.
      *   *Motivation:* The link between epistemic access and semantic classification.

  #### 3. The Logical Constraints (Formal requirements)
  *   **Classical Logic:** The theory should, if possible, preserve standard inference rules (Modus Ponens, Bivalence, Non-Contradiction).
      *   *Motivation:* Classical logic works everywhere else; abandoning it is a high theoretical cost.
  *   **Truth Functionality:** The truth value of a compound sentence should be determined by the truth values of its constituents.
      *   *Motivation:* Compositionality of meaning.

  #### 4. House Rules vs. Genuine Constraints
  You asked to distinguish genuine constraints from camp-specific rules.
  *   **Genuine Constraints:** Borderline Cases, Clear Cases, Penumbral Connections, Boundarylessness, Tolerance. (Any theory denying these denies the phenomenon of vagueness itself).
  *   **House Rules:**
      *   *Knowability:* The demand that vague facts *cannot* be known is a house rule of non-epistemicists. Epistemicism demands they *can* be known (in principle). This is a point of contention, not a pre-theoretic datum.
      *   *Truth-Value Gaps:* The demand that borderline cases must lack a truth value is a house rule of Supervaluationism/Nihilism. Degree theorists assign intermediate values; Epistemicists assign classical values.
      *   *Ontic Vagueness:* The demand that the world itself is vague is a house rule of metaphysical vagueness proponents. Most semantic theories assume a precise world.

  #### 5. The Central Result: The Inconsistent Triad
  Your suspicion is correct. The specification contains a contradiction. The following three claims form an inconsistent triad; no theory can accept all three:
  1.  **Tolerance:** The sorites step is valid (small changes don't matter).
  2.  **Classical Logic:** Standard inference rules (Modus Ponens) and bivalence hold.
  3.  **Existence of Clear Cases:** There are true positive cases and true negative cases (e.g., 0 grains is not a heap, 1,000,000 is).

  **Proof:** If (1) and (2) hold, we can iterate the sorites step from the clear positive case to the clear negative case. By Modus Ponens, the negative case must be positive. This contradicts (3).
  **Consequence:** Every adequate theory must explicitly state which horn of the triad it rejects. A theory that claims to satisfy all three is formally defective.

  ***

  ### Part II: The 2D Color Grid Case

  Your grid case (Red corner $\to$ Green corner, indiscriminable steps, Hue/Brightness axes) is a stress test that exposes weaknesses hidden in 1D sorites.

  #### 1. Requirements the Grid Pulls Apart
  *   **Transitivity of Indiscriminability vs. Semantic Identity:**
      *   *The Tension:* Phenomenally, $Patch_{1,1} \sim Patch_{1,2}$ and $Patch_{1,2} \sim Patch_{1,3}$. But $Patch_{1,1}$ is Red and $Patch_{1,100}$ is Green.
      *   *The Constraint:* A theory must explain why indiscriminability does not entail semantic identity without denying the phenomenology. If the theory says "Indiscriminable patches must have the same truth value," it collapses into Nihilism (no color terms apply). If it says "They can have different truth values," it must explain the disconnect between epistemic access and semantic fact.
  *   **Path Dependence (Hysteresis):**
      *   *The Tension:* Walking Red $\to$ Green vs. Green $\to$ Red.
      *   *The Constraint:* Does the classification of a central patch depend on the path taken to reach it?
          *   If **Yes**: The theory must be Contextualist or Dynamic. It violates the intuition that the patch's color is a stable property.
          *   If **No**: The theory must posit a static boundary. This makes the "indiscriminable step" across that boundary semantically momentous but phenomenally invisible.
  *   **Multidimensional Boundaries:**
      *   *The Tension:* A 1D theory posits a line. A 2D grid requires a boundary *region*.
      *   *The Constraint:* Higher-order vagueness becomes geometric. Is the boundary between Red and Borderline-Red a line? If so, it's sharp. If it's a region, is there a sharp boundary around *that* region? The grid makes the regress of higher-order vagueness visually unavoidable.

  #### 2. Theories that Quietly Fail
  *   **Simple Degree Theories:** They often fail **Penumbral Connections** in 2D. If Red is degree 0.5 and Green is degree 0.5, is the patch both? If the degrees sum to 1, what about the intermediate hues (yellow)? The geometry of the color space often breaks the algebra of the truth degrees.
  *   **Static Supervaluationism:** It struggles with **Path Dependence**. It assigns a global truth value based on all precisifications. But if the context of comparison shifts as you walk the path (which it phenomenally does), the static model cannot capture why a patch seems red when approached from the red side but green when approached from the green side.

  ***

  ### Part III: Evaluation of Main Families

  Here is how the five major families fare against the Desiderata and the Grid.

  1.  **Epistemicism (e.g., Williamson)**
      *   *Stance:* Rejects **Boundarylessness**. There is a sharp boundary; we just cannot know it.
      *   *Grid Performance:* Handles the grid easily (there is a precise coordinate where Red stops). Fails **Phenomenal Indiscriminability** (claims two identical-looking patches can have different truth values).
      *   *Verdict:* Saves Classical Logic and Tolerance (as a false principle), but violates the core intuition of Boundarylessness.

  2.  **Supervaluationism (e.g., Fine)**
      *   *Stance:* Rejects **Bivalence** (but keeps Classical Validity). Truth is truth on all precisifications.
      *   *Grid Performance:* Handles **Penumbral Connections** well (Red $\lor$ Green is true even if neither is determinately true). Struggles with **Higher-Order Vagueness** (requires precisifications of precisifications).
      *   *Verdict:* Saves Boundarylessness (no single sharp line across all precisifications), but makes the Sorites Step invalid (it is false on some precisifications).

  3.  **Degree Theory (Fuzzy Logic)**
      *   *Stance:* Rejects **Classical Logic** (Bivalence). Truth comes in degrees [0, 1].
      *   *Grid Performance:* Handles **Boundarylessness** perfectly (smooth gradient). Struggles with **Penumbral Connections** (truth-functionality issues: if Red=0.5 and Not-Red=0.5, Red $\land$ Not-Red = 0.5, violating Non-Contradiction).
      *   *Verdict:* Saves Tolerance and Boundarylessness, but sacrifices Classical Logic and standard Truth Functionality.

  4.  **Contextualism (e.g., Raffman, Soames)**
      *   *Stance:* Rejects **Fixed Extension**. The boundary shifts as you attend to the series.
      *   *Grid Performance:* Handles **Path Dependence** perfectly (walking Red$\to$Green shifts the context differently than Green$\to$Red). Handles **Indiscriminability** (you group them until a shift occurs).
      *   *Verdict:* Saves Tolerance (locally) and Boundarylessness (globally), but sacrifices **Stability of Truth** (a patch is red *at a time/context*, not *simpliciter*).

  5.  **Nihilism (Eliminativism)**
      *   *Stance:* Rejects **Existence of Clear Cases** (for vague predicates). "Red" does not apply to anything.
      *   *Grid Performance:* Trivially consistent. No patch is red.
      *   *Verdict:* Solves the paradox by destroying the subject matter. Fails the requirement to **Save the Phenomena**.

  #### The Single Eliminating Requirement

  You asked for the single requirement that eliminates the largest number of these theories.

  **The Requirement:** **The Tolerance Principle.**
  *(Specifically: "For any patch $x$, if $x$ is Red and $y$ is indiscriminable from $x$, then $y$ is Red.")*

  **Why it eliminates the most:**
  1.  **Epistemicism:** Explicitly rejects it. (There is a cut-off where tolerance fails).
  2.  **Supervaluationism:** Rejects it. (The conditional is false on precisifications that place the boundary between $x$ and $y$).
  3.  **Contextualism:** Rejects it. (Tolerance holds only within a stable context; the "forced march" breaks the context).
  4.  **Nihilism:** Rejects it. (Nothing is Red, so the antecedent is always false).
  5.  **Degree Theory:** **Accepts it.** (Truth values change by degrees, so the drop is never abrupt).

  **Result:** Adhering strictly to the Tolerance Principle eliminates **4 out of 5** major theories. It is the most expensive constraint to maintain. This confirms your suspicion: the demand for **No Sharp Boundaries** (which Tolerance enforces) is incompatible with **Classical Logic** and **Stable Truth**. Since most theories prioritize Logic and Stability, Tolerance is the casualty.

  **Final Conclusion:**
  The central result of this exercise is the **Inconsistent Triad**. You cannot have Tolerance, Classical Logic, and Clear Cases simultaneously. The 2D Grid case demonstrates that resolving this triad requires choosing between **Semantic Precision** (Epistemicism), **Logical Revision** (Degree Theory), or **Truth Instability** (Contextualism). Any theory claiming to avoid this choice is obscuring its own commitments.
