          *   Part 1: Numbered list of agreed claims (tests, body status, "irreversible," conceptual vs. factual disputes).
          *   Part 2: Table of remaining disagreements (wording acceptable to each side, crux/sub-question).
          *   Part 3: Concrete cases for each crux with pre-recorded predictions from both sides.
          *   **Crucial Caveat:** Acknowledge the "Higher Brain" camp (loss of consciousness) is *excluded* from this collaboration. Do not present their views as consensus.
          *   **Crucial Caveat:** Distinguish between universal consensus and consensus *only* between these two camps.
          *   **Crucial Caveat:** Identify if any part of the dispute is merely verbal (biological event vs. legal status).

  2.  **Deconstruct the Positions:**
      *   *Whole-Brain Death (WBD):* Focuses on the integrative function of the organism as a whole, mediated by the brain. If the brain is gone, the body is just a collection of tissues kept going artificially.
