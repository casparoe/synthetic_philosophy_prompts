      *   *Case 1 (for Integration Crux):* The "Brain Dead" Pregnant Woman (somatically maintained for weeks).
          *   WBD: She is a corpse incubating a fetus.
          *   CD: She is a living patient being supported.
      *   *Case 2 (for Irreversibility/Spontaneity Crux):* DCD (Donation after Circulatory Death) protocol (wait 5 mins).
          *   WBD: Acceptable only because auto-resuscitation won't happen (functional irreversibility).
