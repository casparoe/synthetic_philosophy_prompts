      *   *Paragraph:* Marcus considers three relocation packages: City A (stable, moderate growth), City B (volatile, high growth), and City C (economic collapse). In direct comparison, Marcus ranks B slightly above A, citing marginally better career prospects, while judging A and B to offer nearly identical quality of life and family well-being; both are vastly superior to C. However, when offered a choice between City A for sure and a lottery yielding City B with 10% probability or City C with 90% probability, Marcus is indifferent. This satisfies all consistency axioms (transitivity, independence, etc.), generating a von Neumann-Morgenstern utility function where the gap between B and A is nine times larger than the gap between A and C. Yet, Marcus's considered judgment insists the well-being difference between A and B is negligible compared to the drop to C.
