      *   *Lottery:* She is indifferent between Job A for sure and a 99% chance of Job B + 1% chance of Unemployment (Job C).
      *   *VNM Implication:* $U(A) = 0.99 U(B) + 0.01 U(C)$. If $U(C)=0$, then $U(A) \approx 0.99 U(B)$. Wait, that makes them close. I need them far apart.
      *   *Correction:* To make the gap *large* in VNM terms while welfare is *small*, she needs to be *risk-seeking*? No, usually risk aversion creates concavity.
      *   *Let's look at the "Large Gap" requirement:* "Fitted cardinal scale implies a large gap."
      *   *Scenario:* Elena ranks Job A > Job B > Job C.
      *   *Welfare Judgment:* A is only marginally better than B (e.g., slightly shorter commute).
      *   *Lottery Choice:* She is indifferent between Job B for sure and a 50/50 lottery of Job A vs. Job C.
      *   *VNM Math:* $U(B) = 0.5 U(A) + 0.5 U(C)$. Let $U(C)=0, U(A)=1$. Then $U(B)=0.5$. The gap A-B is 0.5. The gap B-C is 0.5.
      *   *Welfare Judgment:* A is barely better than B, but B is much better than C.
      *   *Wait, the prompt says:* "treat two of the options as nearly equal while the fitted cardinal scale implies a large gap."
      *   *Okay:* Options A and B are nearly equal in welfare. But VNM says they are far apart.
      *   *How?* She must be extremely risk-averse regarding the loss of A.
      *   *Revised Scenario:* Elena ranks Job A (Remote, flexible) > Job B (Office, rigid) > Job C (Unemployed).
      *   *Welfare:* A and B provide nearly identical life satisfaction (she works either way).
      *   *Lottery:* She rejects a 90% chance of A / 10% chance of C in favor of B for sure.
