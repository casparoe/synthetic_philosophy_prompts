      *   *Refining for the constraint:* "Sure options alone must determine only an ordinal ranking." This is standard. "Cardinal difference... supplied entirely by lottery choices." This is VNM theory.
      *   *The Crux:* She reveals extreme risk aversion in lotteries involving her top choice, inflating its VNM utility, but in surveys/introspection, she says the top choice isn't *that* much better than the second choice.
