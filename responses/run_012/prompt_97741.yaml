      *   *Choice-Based (VNM):* Utility is defined by risk attitudes. If I'm risk-averse over a domain, the utility function curves, creating large "utility gaps" between outcomes that might feel similar in welfare to ensure I avoid the risk.
      *   *Welfare-Based (Hedonic/Ordinal):* Utility is about how good the outcome *feels* or how well life goes. Risk attitudes might be due to factors other than the intrinsic value of the outcomes (e.g., fear, principle, anxiety).
