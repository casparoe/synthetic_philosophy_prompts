answer: |-
  Marcus considers three relocation packages: City A (stable, moderate growth), City B (volatile, high growth), and City C (economic collapse). In direct comparison, Marcus ranks B slightly above A, citing marginally better career prospects, while judging A and B to offer nearly identical quality of life and family well-being; both are vastly superior to C. However, when offered a choice between City A for sure and a lottery yielding City B with 10% probability or City C with 90% probability, Marcus is indifferent. This satisfies all consistency axioms (transitivity, independence, etc.), generating a von Neumann-Morgenstern utility function where the gap between B and A is nine times larger than the gap between A and C. Yet, Marcus's considered judgment insists the well-being difference between A and B is negligible compared to the drop to C.

  **Construals:** (a) The choice-based construal takes the utility function to be the VNM scale ($U(B)=10, U(A)=1, U(C)=0$), because utility is defined by the risk attitudes revealed in lottery choices. (b) The welfare-based construal takes utility to be the ordinal ranking with negligible cardinal distance between A and B ($W(B) \approx W(A) \gg W(C)$), because well-being is determined by the intrinsic properties of the outcomes, not the agent's attitude toward risk. **Divergent Feature:** The divergence arises because the choice-based construal incorporates risk aversion into the cardinal measurement of utility, whereas the welfare-based construal treats risk attitude as distinct from how well off the agent is. **Removing Lotteries:** If lottery choices are removed, the disagreement vanishes; both construals agree that only an ordinal ranking is supported by the evidence. **Defender's Reply:** A defender of the choice-based construal argues that introspective judgments about "well-being" are theoretically ungrounded and noisy, whereas revealed preference is objective; furthermore, the anxiety Marcus feels regarding the risk of C is a real psychological cost that the VNM function correctly captures as part of his total utility, making his considered judgments about "quality of life" incomplete. **Third-Party Decision:** If a fiduciary must choose for Marcus between the sure thing (City A) and the lottery (10% B, 90% C), a welfare-maximizing fiduciary would strictly choose City A (since $W(A) \approx W(B)$ makes the expected welfare of the lottery negligible), while a choice-utility-maximizing fiduciary would be indifferent between the two options.
