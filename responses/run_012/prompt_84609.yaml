  2.  **Analyze the Core Function of IC in Safety Arguments:**

      *   Why do we care about IC? Not because it's mathematically pretty, but because it supports the *Risk Argument*: Advanced AI systems, even with seemingly benign goals, will tend to pursue harmful instrumental subgoals (power, survival, resource acquisition) that conflict with human interests.
      *   Therefore, an adequate account *must* support the inference: "Goal $G$ + Capability $\rightarrow$ Risk of Instrumental Drive $D$."
      *   If an account of IC is true but doesn't imply risk (e.g., convergence on "being polite"), it fails the safety job.
      *   If an account implies risk but only for impossible agents, it fails the empirical job.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Topic 1: Measure over Goals.*
          *   Problem: "Most goals" is meaningless without a measure. Uniform measures over infinite spaces don't work.
          *   Requirement: The account must specify the domain and measure, OR show robustness across a wide class of measures, OR ground the measure in something physical/computational (e.g., simplicity priors).
