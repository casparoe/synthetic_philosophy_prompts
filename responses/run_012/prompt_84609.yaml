      *   *Topic 2: Type of Convergence.*
          *   Problem: Is it about ideal agents (OMs), learned agents (RL), or uncertain agents?
          *   Safety Link: We are building learned agents via gradient descent, not programming OMs. If IC only holds for OMs, it might not apply to LLMs/RL agents.
          *   *Draft Criterion:* **Implementation Pathway.** Must specify if it's normative (rationality) or descriptive (learning dynamics).

      *   *Topic 3: Closure of Drives (The "Satiable One-Shot" Counterexample).*
          *   Problem: Omohundro/Bostrom lists are suggestive. A one-shot agent wanting "5 on a wall" doesn't need self-preservation after Tuesday.
          *   Safety Link: If IC only applies to infinite horizon agents, is it relevant? Most real tasks have horizons.
          *   *Draft Criterion:* **Horizon Sensitivity & Drive Closure.** Must explain why drives persist in finite/satiable contexts relevant to safety.

      *   *Topic 4: Orthogonality Thesis (OT).*
          *   Problem: OT says intelligence $\perp$ goals. IC says intelligence $\rightarrow$ specific subgoals.
          *   Safety Link: IC is the bridge that makes OT dangerous. If OT is false (goals correlate with intelligence), IC might be redundant. If IC holds without OT, it's stronger.
          *   *Draft Criterion:* **Orthogonality Compatibility.**

      *   *Topic 5: Values vs. Behavior.*
          *   Problem: An agent might *value* power but fail to get it, or be constrained.
          *   Safety Link: We care about *behavior* (taking over the world), not just internal reward functions.
          *   *Draft Criterion:* **Behavioral Cash-Out.**

  4.  **Refining and Categorizing (Non-negotiable vs. Camp Commitments):**

      *   *Non-negotiable (Safety Critical):* Must link to risk, must apply to plausible architectures, must handle the measure problem honestly.
