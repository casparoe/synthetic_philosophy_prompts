answer: |-
  The wall in Room 3 was painted a specific shade of cerulean. On the monitor, Subject 402's qualia-index was a flat, dead line. The neural bridge targeting her V4 cortex was glowing soft amber, indicating the inhibition field was active. The experience channel was cut.

  "She's describing the hue," Elias said, his hand hovering over the console. "Precision is within normal variance."

  "Listen," Dr. Thorne said. He leaned against the glass, arms crossed. Thorne was the lead on the Dissociation Project, a man who treated consciousness like a exhaust fume—interesting to analyze, but useless for driving the car.

  Inside the room, Subject 402, a volunteer named Sarah, tilted her head. "It's not just blue," she said, her voice bright, engaged. "It's… calming. Like the sky just after rain. Is that the lighting? It feels cool."

  Elias watched the biometrics. Heart rate steady. Cortisol low. But the qualia-index remained zero. There was nothing it was like to be Sarah right now. There was only the processing of information about blue.

  "Perfect common cause separation," Thorne murmured. "The neural state N triggers the verbal report R. Normally, it also triggers the experience E. We've severed the link to E. N still causes R. The shadow is gone, but the object casting it is still speaking."

  Dr. Kovic didn't look up from her tablet. She was rubbing her temples, a gesture she'd perfected over the last six months of trials. "She's using the word 'feel'," Kovic said. "She says it 'feels' cool. If the feeling is absent, what is the referent of that word?"

  "Behavioral output," Thorne said. "The word 'feel' is just a label for the neural state N. She's reporting on the brain state, not the ghost."

  "She's reporting on a ghost that isn't there," Kovic snapped. She finally looked up, her eyes sharp. "Aris, if I build a machine that measures temperature and prints 'Hot' when the thermometer rises, and then I break the thermometer but leave the printer wired to the heat source… the printer still says 'Hot'. But it's not measuring temperature anymore. It's just noise triggered by heat."

  "It's not noise," Thorne countered, calm as a scalpel. "It's reliable. It's correlated. If we show her red, she says red. If we show her blue, she says blue. The correlation holds perfectly without the qualia. That proves the qualia were never doing the work. You've been clinging to the idea that the experience pushes the words around. Look at her. She's arguing about the lighting. The experience is inert."

  "She's not arguing," Kovic said, her voice dropping. "You are. She's just… humming."

  Elias adjusted the gain. "We need to run the reverse protocol. Subject 404 is ready."

  Thorne waved a hand. "Later. 402 is the clean data. 404 is just tragedy."

  "Tragedy is data," Kovic said. She walked to the glass. Inside, Sarah was now tapping her foot, humming a tune. She looked perfectly conscious to any observer. She was a philosophical zombie, animated by the clockwork of the brain, devoid of the inner light.

  "Sarah," Kovic said over the intercom. "Do you know why you're here?"

  Sarah smiled. "To help science. To see how the mind works."

  "And how does it feel?"

  "Wonderful," Sarah said. "Like I'm contributing."

  Kovic turned to Thorne. "She's lying. Not intentionally. But the statement 'It feels wonderful' is false. There is no feeling. So when she says 'I', who is she talking about? If the experience is the only thing that owns the perspective, and you've deleted the experience, then the 'I' in that sentence is a fiction generated by the report channel."

  "It's a useful fiction," Thorne said. "The brain models a self to navigate the world. The model persists without the qualitative feed."

  "So when I say 'I am in pain'," Kovic pressed, "and you say 'Your pain is just a shadow,' you're telling me that my report of pain is caused by the brain state, but the pain itself—the burning, the ache—did nothing to make me say it?"

  "Exactly. The brain state did the work. The pain was just what it looked like from the inside."

  "Then how do you know what 'pain' means?" Kovic asked. "If you've never felt the shadow, only seen the gear turning, you don't know what pain is. You only know 'pain-behavior'. You've solved the hard problem by deleting the hard part and pretending the easy part answers the question."

  Thorne sighed, pushing off the glass. "Lena, we have the separation. We can turn the light off and leave the switch on. That is empirical fact. Your objection is semantic."

  "My objection is about truth!" Kovic's voice echoed in the control booth. "If the report isn't caused by the experience, then the report is not *about* the experience. It's about the neural state. So when she says 'That looks blue', she is technically saying 'My V4 cortex is firing in pattern X'. She doesn't know what blue is. None of us do. We just know our brains are firing."

  Elias watched Sarah inside the room. She was looking at her hands, turning them over. She was inspecting the machinery of her own existence without feeling the weight of it. It was horrifyingly efficient.

  "Subject 404," Elias said quietly. "Let's look at 404."

  Thorne hesitated, then nodded. Elias pulled up the feed from the adjacent room.

  Subject 404, a man named David, sat in a chair. His qualia-index was spiking off the charts. Bright red waves cascaded across the screen. He was swimming in raw sensation. But his motor output channel was inhibited. He couldn't speak. He couldn't move a finger.

  On the screen, David's eyes were wide, terrified. He was screaming silently. The report channel was cut. The experience was fully intact. He was pure subjectivity with no objectivity, a scream trapped in a vacuum.

  "He knows," Kovic whispered. "He knows exactly what it is like. But he can't tell us. And if we rely on the reports from people like Sarah to understand consciousness, we'll never know David exists."

  "David is an outlier," Thorne said, though his voice lacked its usual steel. "We can infer his state from the neural signature. We don't need the report."

  "You infer it from *your* experience," Kovic said. "You map his brain to yours. But if Sarah's report is unmoored from experience, why is yours any different? How do you know *you* aren't Sarah? How do you know your report isn't just a mechanism humming along, assuming a shadow that isn't there?"

  Thorne looked at the monitors. One showed a woman speaking without feeling. The other showed a man feeling without speaking. The gap between them was absolute.

  "Because I feel this," Thorne said, tapping his chest. "Right now."

  "According to your theory," Kovic said softly, "that feeling didn't cause you to tap your chest. The neural state did. The feeling was just… along for the ride. So you can't use the feeling to validate the theory. The theory says the feeling doesn't matter."

  Thorne didn't answer. He watched Sarah stand up and walk to the wall. She touched the cerulean paint.

  "It's smooth," she said.

  The qualia-index remained flat.

  Elias felt a cold knot in his stomach. He thought about his own hands, his own voice. He thought about the thirty years he'd spent listening to neurons fire, assuming the noise was the music.

  "Reset Sarah," Thorne said finally. "Bring the experience channel back online."

  Elias typed the command. The amber light on the console turned green. The qualia-index jumped. Sarah blinked, shivered, and rubbed her arms.

  "Wow," she said. "It's cold in here."

  "Was it cold before?" Thorne asked over the intercom.

  Sarah frowned, looking confused. "I… I don't know. I was just talking."

  She looked at her hands, then at the wall. For a second, she looked like David. Trapped between the report and the feeling, trying to stitch them back together.

  "Session ended," Thorne said. He turned off the monitor.

  The room was quiet. The data was saved. The separation was proven. The mechanism worked.

  Kovic picked up her tablet, but didn't open it. "She said she was just talking," Kovic said. "When the light was off."

  "She was," Thorne said.

  "No," Kovic said, looking at the blank screen where the qualia-index had been. "She said she didn't know. If the report runs parallel to the experience, she should have remembered the report. But she doesn't remember the zombie state. Only the experience returns."

  Thorne paused at the door. "Memory is part of the neural state. It reintegrates."

  "Or," Kovic said, "the experience is the only thing that binds the memory together. Without it, the report is just… noise that vanishes."

  Thorne opened the door. "We run 404 tomorrow."

  "Aris," Kovic said. "If we cut my report channel, and I'm stuck in here like David… will you know I'm suffering? Or will you just see a flat line and a quiet room?"

  Thorne looked at her, his face tired. "I'll see the neural signature."

  "That's not me," Kovic said. "That's the shadow."

  She left the room. Thorne stood alone in the control booth, looking at the cerulean wall on the monitor. He raised his hand to touch the screen, then stopped. He wasn't sure if he wanted to feel the glass, or just verify the signal.

  Elias saved the log. *Subject 402: Dissociation Successful.* He stared at the words. Successful for whom, he wondered. The science worked. The philosophy held. But somewhere in the gap between the signal and the sense, something essential had slipped away, and none of them could quite say what it was.
