prompt: |-
  I teach a 90-minute session in an upper-level undergraduate seminar on decision theory and rational choice — about eighteen students, mostly philosophy and economics majors, comfortable with probability but not with measure theory. Every year I put the Allais choices on a slide, they dutifully report the usual pattern, and nothing lands: it stays a fact about other people rather than a felt pull. I want an activity that gets them to feel the force of the tension between the certainty effect and the independence (sure-thing) axiom from the inside — to make the choices themselves, live with them, and then discover, through the structure of what happens rather than through anything I say, that their own preferences can't be held together. Crucially, I don't want it to be a rehash of the textbook pair I already show them; I'd like the mechanic to carry them somewhere the standard presentation doesn't go. Two things I'd especially like built in: first, a sequential or commitment element, so that the same person can be led to choose differently depending on whether they fix their choice in advance or only after a first stage has resolved, and can feel that the difference is not just noise; and second, a trading or brokering role, so that someone in the room is actively trying to buy or swap the positions the others hold, and the discomfort of the inconsistency is felt as a price rather than as a logical remark.

  Please give me the full runnable design: the cover story, the exact lottery pairs or prospects (with numbers, and the small real stakes — tokens, candy, a modest prize pool, no cash), how the choices are elicited so that people commit before they see what others did, the roles and rules for the sequential stage and for the broker, a timeline that fits the 90 minutes, and materials I can photocopy. The idea should surface in the mechanics: by the time I name Allais, the independence axiom, or the sure-thing principle, they should already have run into the problem themselves. Then a debrief that maps what happened onto the formal apparatus — the common-consequence versus common-ratio structure, the role the axiom plays in the expected-utility representation, and what exactly has to give if one keeps the preferences (and what one is giving up by keeping the axiom instead). Tell me honestly what will predictably go wrong the first time — where the stakes will be too small to bite, where a clever student will try to game the broker, where the group will split and the split will muddy the point — and how to handle each. Finally, be candid about which feature of the paradox the activity cannot reproduce and that I will have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute upper-level undergrad seminar (Philosophy/Economics).
      *   **Topic:** Decision Theory, Rational Choice, Allais Paradox.
      *   **Problem:** Standard slide presentation fails to make the tension *felt*. It remains abstract.
      *   **Goal:** An activity where students *feel* the pull of the certainty effect vs. independence axiom from the inside.
      *   **Specific Constraints:**
          *   Not the standard textbook pair (needs a twist).
          *   Must include a *sequential/commitment* element (plan vs. act).
          *   Must include a *trading/broker* role (inconsistency felt as a price).
          *   Real stakes (tokens/candy/prize pool, no cash).
          *   Full runnable design (cover story, numbers, elicitation, roles, timeline, materials).
          *   Debrief linking mechanics to formal theory (common consequence/ratio, EU representation).
          *   Honest assessment of pitfalls and limitations.

  2.  **Deconstruct the Allais Paradox:**
      *   Standard Form:
          *   1A: $1M for sure.
          *   1B: 10% $5M, 89% $1M, 1% $0.
          *   (Most choose 1A).
          *   2A: 11% $1M, 89% $0.
          *   2B: 10% $5M, 90% $0.
          *   (Most choose 2B).
      *   Violation: Independence Axiom. The 89% chance of $1M is common to 1A/1B. If you cancel it, you get 2A/2B. Preferences should reverse or stay same, not switch.
      *   Desired Twist: Sequential/Commitment + Trading.

  3.  **Brainstorming the Activity Mechanic:**
      *   *Sequential/Commitment:* How to make them feel the difference between planning ahead and reacting?
          *   Idea: A two-stage game. Stage 1 is a "qualifier" or a "filter."
          *   Better: A "Pre-Commitment Contract" vs. "Spot Choice."
          *   Best for Allais: The "Dynamic Allais." Present the choice as if it happens in two steps, where the first step might eliminate the common consequence. This highlights the *resolvability* of uncertainty.
      *   *Trading/Broker:* How to make inconsistency cost something?
          *   Idea: If I prefer A over B, but my choices imply B over A, a broker can exploit me (Money Pump).
          *   Implementation: Assign one student (or the instructor initially) as the "Arbitrageur." They hold tickets. Students hold preferences. If preferences are intransitive or violate independence, the Arbitrageur can offer swaps that leave the student worse off (paying a fee to swap back and forth).
      *   *Stakes:* Candy or raffle tickets for a larger prize (e.g., a gift card or extra credit). Let's use "Raffle Tickets" for a $50 Amazon card. It scales well and feels real enough without needing cash on hand.

  4.  **Developing the "Twist" (Beyond Standard Allais):**
      *   Standard Allais is static. To get the *sequential* feel, I need to frame it as a two-stage process where the "Common Consequence" is revealed in Stage 1.
      *   *The Machina Triangle approach:* Visualizing the probabilities.
      *   *The "Envelope" Method:*
          *   Scenario 1 (Certainty Frame): You get a ticket. 89% of the tickets are "Win $1M" immediately. 11% go to a second draw.
          *   Scenario 2 (Risk Frame): You pick a ticket from a different urn.
      *   *Refining for the Prompt:* The prompt asks for a sequential element where fixing a choice in advance differs from choosing after resolution.
      *   *Proposal:* **The "Two-Door" Protocol.**
          *   Phase 1: Students choose a *policy* (If I get to Stage 2, what will I pick?).
          *   Phase 2: A random draw determines if they *go* to Stage 2.
          *   Phase 3: If they go to Stage 2, they are allowed to *change* their mind (Spot Choice).
          *   The Broker enters between Phase 1 and Phase 3 to offer swaps based on declared preferences.

  5.  **Drafting the Design - Step-by-Step:**

      *   **Cover Story:** "The Venture Capital Game." Investing in startups.
      *   **Currency:** "Equity Points" (EP). 10 EP = 1 Raffle Ticket for the Grand Prize.
      *   **The Lotteries:** Need numbers that aren't exactly Allais but structurally identical to avoid rote memorization, yet clear enough to calculate.
          *   Let's use a 100-ticket urn.
          *   **Option X (Safe):** 89 tickets = 1 EP, 11 tickets = 1 EP. (Basically 1 EP for sure). *Wait, need the Allais structure.*
          *   **Option X:** 89 tickets = 1 EP, 10 tickets = 1 EP, 1 ticket = 0 EP. (Total 99% chance of 1 EP).
          *   **Option Y:** 89 tickets = 1 EP, 10 tickets = 5 EP, 1 ticket = 0 EP.
          *   *Correction:* Standard Allais relies on the "Sure Thing" being distinct.
          *   Let's stick closer to the structure but change the values slightly to feel fresh.
          *   **Urns:** 100 chips.
          *   **Choice 1 (The "Safe" Context):**
              *   Plan A: 100 chips. 89 Red (1 EP), 11 Blue (Draw again).
                  *   Actually, let's simplify.
              *   **Lottery 1:** 100 Tickets.
                  *   Option Safe: 100 tickets win 1 EP.
                  *   Option Risky: 89 tickets win 1 EP, 10 tickets win 5 EP, 1 ticket wins 0 EP.
              *   **Lottery 2:** 100 Tickets.
                  *   Option Safe: 89 tickets win 0 EP, 11 tickets win 1 EP.
                  *   Option Risky: 90 tickets win 0 EP, 10 tickets win 5 EP.
          *   *Wait, I need the Sequential Element.*
          *   **The Twist:** Frame Lottery 1 as a Two-Stage process.
              *   Stage 1: Draw a chip. 89% chance the game ends (you get 1 EP). 11% chance you proceed to Stage 2.
              *   Stage 2: If you proceed, you choose between (1 EP for sure) vs (10/11 chance of 5 EP, 1/11 chance of 0).
              *   This makes the 89% common consequence *explicitly* a prior stage.
              *   Lottery 2 is just the Stage 2 choice presented outright.
              *   This highlights the *dynamic inconsistency*. If you plan at the start, you treat the 89% as part of the package. If you arrive at Stage 2, the 89% is gone (sunk), and you might choose differently.

      *   **The Broker:**
          *   One student is the "Market Maker."
          *   They have a stash of EP.
          *   They can offer to swap a student's position *before* the final draw, for a small fee (1 EP).
          *   If a student prefers Safe in Lottery 1 (implying they value the certainty) but Risky in Lottery 2 (implied by their Stage 2 choice), the Broker can exploit this.
          *   *Mechanism:*
              1.  Student commits to Option Safe in Lottery 1.
              2.  The "89% event" happens (simulated). If it hits, game over. If not, they enter Stage 2.
              3.  At Stage 2, they are offered the choice again. If they switch to Risky, the Broker says: "Wait, you originally bought Safe. I'll let you switch to Risky for 1 EP fee."
              4.  If they switch back later? No, keep it simple.
              5.  *Better Money Pump:*
                  *   Student declares preference for 1A (Safe) and 2B (Risky).
                  *   Broker holds a ticket for 1B. Offers to swap 1A for 1B + small fee? No.
                  *   Let's use the **Sequential Revealing** method.
                  *   Students write down Choice 1.
                  *   Then we simulate the "Common Consequence" resolution.
                  *   Those who "survive" make Choice 2.
                  *   Broker offers to trade the *rights* to the lottery based on the inconsistency.

      *   **Refining the Broker Mechanic for Maximum Impact:**
          *   The Broker needs to show that holding both preferences costs money.
          *   Let's create a "Contract" phase.
          *   Students buy a ticket for Game 1.
          *   Before Game 1 resolves, they can sell it back or trade it.
          *   If they prefer 1A but would choose 2B if they got there, the Broker can buy 1A from them, wait for the 89% to clear, then sell them 2B back at a higher price (or fee).
          *   *Simpler:* The Broker offers a "Plan vs. Action" arbitrage.
          *   Step 1: Students commit to a Plan for Game 1.
          *   Step 2: Broker offers to swap their Game 1 ticket for a Game 2 ticket + fee, *conditional* on reaching the second stage.
          *   This is getting complicated to explain in 90 mins.
          *   *Back to basics:* The Money Pump.
          *   If you prefer 1A > 1B and 2B > 2A.
          *   Broker starts you with 1B.
          *   Broker says: "You prefer 1A. I'll swap 1B for 1A, cost you 1 candy." (You pay).
          *   Broker says: "But wait, we are now in the sub-game (89% removed). You prefer 2B (which is 1B stripped) over 2A (1A stripped). I'll swap 1A for 1B, cost you 1 candy." (You pay).
          *   You are back at 1B, but poorer.
          *   *Implementation:* We need to simulate the "state" where the 89% is removed.
          *   *Activity:* "The Resolving Urn."
          *   Everyone starts with a ticket for Lottery 1B (Risky).
          *   Broker offers swap to 1A (Safe) for 1 token. (Based on their stated Preference 1).
          *   Then, we draw the "Common Consequence" urn. If the 89% outcome occurs, the game ends (everyone wins 1 EP). If the 11% outcome occurs, we enter the "Sub-Game."
          *   *Crucial:* In the Sub-Game, the Broker points out: "Now that the 89% is gone, 1A looks like 2A and 1B looks like 2B. You said you prefer 2B. So I'll swap your 1A (now effectively 2A) for 1B (now effectively 2B) for 1 token."
          *   Result: You paid 2 tokens to end up with the same ticket you started with, *conditional on reaching the sub-game*.
          *   This hits the "Sequential" and "Broker" requirements perfectly.

  6.  **Developing the Numbers & Stakes:**
      *   Stakes: "Class Credits" or "Raffle Tickets." Let's use **Raffle Tickets** for a $25 Coffee Card. It's tangible.
      *   Urn: 100 Ping Pong Balls (or numbered slips in a bag).
      *   **Lottery 1 (The Full Game):**
          *   **Ticket A (Safe):** 100 balls. 1-89 (1 Ticket), 90-100 (1 Ticket). -> *Wait, Allais needs a zero.*
          *   **Ticket A:** 1-89 (1 Raffle Ticket), 90-99 (1 Raffle Ticket), 100 (0). -> *No, 1A is usually 'Sure'.*
          *   Let's use the standard Allais numbers but scaled to 100 balls.
          *   **Ticket A:** 1-100 win 1 Raffle Ticket. (Sure Thing).
          *   **Ticket B:** 1-89 win 1 Raffle Ticket, 90-99 win 5 Raffle Tickets, 100 win 0.
      *   **Lottery 2 (The Sub-Game):**
          *   **Ticket C:** 1-89 win 0, 90-99 win 1 Raffle Ticket, 100 win 0. (Effectively 10% chance of 1).
          *   **Ticket D:** 1-90 win 0, 91-99 win 5 Raffle Tickets, 100 win 0. (Effectively 10% chance of 5).
          *   *Correction:* To make the Sub-Game link clear, Ticket A must be decomposable.
          *   **Revised Ticket A:** 1-89 (Win 1), 90-100 (Enter Sub-Game 1).
          *   **Revised Ticket B:** 1-89 (Win 1), 90-100 (Enter Sub-Game 2).
          *   **Sub-Game 1:** 100% Win 1.
          *   **Sub-Game 2:** 90% Win 5, 10% Win 0.
          *   This is the **Machina/Sequential Allais** framing. It makes the independence violation a dynamic inconsistency.

  7.  **Timeline (90 Minutes):**
      *   0-10: Intro & Setup (No theory yet).
      *   10-25: Phase 1 (Commitment). Students choose Ticket A or B. Write it down. Seal it.
      *   25-35: The Broker Phase 1. Broker tries to swap based on stated preferences.
      *   35-50: The Resolution (Sequential). Draw the "Common" urn.
      *   50-65: Phase 2 (Action). Those who hit the 11% zone make the choice again. Broker Phase 2.
      *   65-80: The Pump. Show the loss.
      *   80-90: Debrief & Theory.

  8.  **Addressing Pitfalls:**
      *   *Stakes too low:* Use a visible prize. Make the "fee" painful (e.g., they have to give up a raffle ticket they already hold).
      *   *Gaming the broker:* Students might lie to mess up the demo. *Fix:* Anonymous voting first, then volunteer for the live pump. Or make the Broker the Instructor initially to ensure smoothness, then let a student try. *Decision:* Instructor acts as Broker first to guarantee the logic holds, then invite a student to try.
      *   *Split group:* Some won't violate independence. *Fix:* Acknowledge this. "If you didn't feel the pull, you are an Expected Utility maximizer. Congratulations, you are a unicorn." Focus on those who did.
      *   *Confusion:* Keep numbers simple (100 balls).

  9.  **Materials:**
      *   Choice Slips.
      *   Urn/Bag with 100 numbered chips.
      *   Raffle Tickets (physical).
      *   Broker Script.
      *   Worksheet for Debrief.

  10. **Refining the "Broker" Logic for the Activity:**
      *   To make it a *price*, the Broker needs to charge a transaction fee.
      *   Give every student 3 Raffle Tickets at the start.
      *   The Lotteries award *additional* tickets.
      *   The Broker charges 1 Ticket to swap.
      *   If they swap back and forth, they lose tickets.
      *   *Wait, if they start with Ticket B, and swap to A (pay 1), then swap to B (pay 1), they have lost 2 tickets and are back at B.*
      *   This is the Money Pump. It needs to happen *live*.
      *   *Constraint:* Only those who hit the 11% zone can participate in the second swap.
      *   *Solution:* Run the Money Pump hypothetically for the whole class, but *actually* execute it for one volunteer who exhibits the preference pattern. This saves time and focuses attention.

  11. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   Upper-level? Yes, debrief gets technical.
      *   No measure theory? Yes, finite probabilities.
      *   Sequential/Commitment? Yes (Plan vs. Sub-game).
      *   Broker/Trading? Yes (Money Pump).
      *   Not standard slide? Yes, it's a dynamic simulation.
      *   Honest pitfalls? Will include section.
      *   Limitations? Will include section (e.g., doesn't solve *why* we violate, just that we do).

  12. **Writing the Response:**
      *   Tone: Professional, pedagogical, precise.
      *   Structure: Overview, Materials, Timeline, Script/Mechanics, Debrief, Pitfalls, Limitations.
      *   *Self-Correction on Numbers:* Ensure the "Common Consequence" is exactly the same in 1A and 1B so it cancels out mathematically.
      *   1A: 100% $1M.
      *   1B: 89% $1M, 10% $5M, 1% $0.
      *   Common: 89% $1M.
      *   Remainder 1A: 11% $1M.
      *   Remainder 1B: 10% $5M, 1% $0.
      *   2A: 11% $1M, 89% $0.
      *   2B: 10% $5M, 90% $0.
      *   *Wait, 2A/2B probabilities must sum to 100%.*
      *   2A: 11% $1M, 89% $0.
      *   2B: 10% $5M, 90% $0.
      *   My sequential framing needs to match this.
      *   Sequential Frame:
          *   Stage 1: 89% chance Game Ends (Win $1M). 11% chance Go to Stage 2.
          *   Stage 2 Choice:
              *   Option X: 100% Win $1M. (Total: 11% $1M + 89% $1M = 1A).
              *   Option Y: 10/11 Win $5M, 1/11 Win $0. (Total: 10% $5M + 1% $0 + 89% $1M = 1B).
          *   Lottery 2 is just Stage 2 presented alone.
      *   This works perfectly. It isolates the "Certainty Effect" as the desire to lock in the win at Stage 1 vs. the risk tolerance at Stage 2.

  13. **Final Polish:** Check the "Broker" mechanics again. The Broker needs to be able to execute the pump *before* the final payoff to make the loss real.
      *   Actually, doing the pump *before* the final draw is cleaner.
      *   1. Elicit Preferences (1A vs 1B) and (2A vs 2B).
      *   2. Identify violators.
      *   3. Broker approaches violator. "You have 1B. I know you prefer 1A. Swap for 1 ticket fee."
      *   4. "Now, imagine the 89% didn't happen. You hold 1A (now 2A). You prefer 2B. Swap for 1 ticket fee."
      *   5. "You are back at 1B, minus 2 tickets."
      *   This is clearer than running the urn first. The urn is used to demonstrate *why* the transformation happens.
      *   Okay, I will structure it: Commitment -> Broker Pump (Hypothetical but with real fees) -> Urn Resolution -> Payoff.
      *   Wait, the prompt asks for "sequential... so that the same person can be led to choose differently depending on whether they fix their choice in advance or only after a first stage has resolved."
      *   Okay, I must run the Stage 1 resolution *live*.
      *   Revised Plan:
          1.  Commit to Plan (Choice 1).
          2.  Resolve Stage 1 (The 89% Urn).
          3.  If "Continue", make Choice 2 (Spot).
          4.  Broker intervenes *between* Plan and Spot if they differ.
      *   This is the strongest design. It captures the *dynamic inconsistency*.

      *   *Wait, one nuance:* If they choose 1A (Safe) in Plan, they get $1M if 89% hits. If they choose 1B (Risky), they *also* get $1M if 89% hits. The difference is only in the 11% branch.
      *   So, if the 89% hits, the choice didn't matter. The tension is only felt if the 11% hits.
      *   So the Broker can only pump those who hit the 11%.
      *   To ensure someone hits the 11%, I might need to rig the urn or run multiple rounds.
      *   *Better:* Run the "Money Pump" logically *before* the urn, using the *stated* preferences for the counterfactual.
      *   "You said if you got here, you'd pick X. Now you're here, and you pick Y. Pay me."
      *   Okay, I will combine them. Elicit Plan. Elicit Spot (conditional). If they differ, Broker pumps. Then resolve Urn for payoff.
      *   This satisfies the "fix choice in advance vs after" requirement.

      *   Let's finalize the stakes. 100 Tickets in a bag.
      *   Prize: $30 Gift Card.
      *   Currency: "Chips". 1 Chip = 1 Entry into the raffle for the Gift Card.
      *   Start: 5 Chips each.
      *   Broker Fee: 1 Chip.
      *   This makes the loss tangible.

      *   Okay, ready to write.
answer: |-
  # Activity Design: The "Dynamic Money Pump" Seminar

  ## 1. Overview & Learning Objective
  **Title:** The Two-Stage Venture
  **Time:** 90 Minutes
  **Class Size:** 18 Students
  **Goal:** To transform the Allais Paradox from a static logical contradiction into a *dynamic inconsistency* that costs students tangible resources. By separating **Planning** (ex-ante) from **Action** (ex-post) and introducing a **Broker** who charges fees for swaps, students experience the violation of the Independence Axiom as a financial loss (a "money pump") rather than a logical error.

  **Core Mechanic:** The lotteries are framed as a two-stage process. The "Common Consequence" (the 89% chance of a moderate win) is explicitly modeled as Stage 1. Students commit to a choice in Stage 1. If they survive to Stage 2 (the 11% branch), they are allowed to choose again. If their Stage 2 choice contradicts their Stage 1 plan, a Broker exploits the inconsistency.

  ## 2. Materials Required
  1.  **The Prize:** One visible prize (e.g., $30 Coffee Card or "Homework Pass").
  2.  **Currency:** 100 poker chips or heavy cardstock tokens per student (start them with 5 each). Explain: *"At the end, we will raffle the Prize. Each token is one ticket. More tokens = higher chance of winning."*
  3.  **The Urn:** An opaque bag containing 100 numbered ping-pong balls (1–100).
  4.  **Choice Slips:** Two distinct colors of paper per student.
      *   **Blue Slip:** "Commitment Contract" (filled out at start).
      *   **Red Slip:** "Spot Decision" (filled out only if Stage 2 is reached).
  5.  **Broker Badge:** A lanyard or sign for the student/instructor acting as Broker.
  6.  **Projector:** For the Debrief (blank until the end).

  ## 3. The Lotteries (The "Venture" Structure)
  Do not present these as "Lottery 1 vs Lottery 2." Present them as a **Single Venture with a Branch.**

  **The Setup:**
  "We are investing in a startup. There are 100 possible market scenarios (balls in the urn)."

  **Stage 1 (The Market Filter):**
  *   **Balls 1–89 (89%):** The market booms. *Everyone wins 1 Token immediately, regardless of their strategy.* (This is the Common Consequence).
  *   **Balls 90–100 (11%):** The market is volatile. You proceed to **Stage 2**. Your payoff depends on the choice you made.

  **Stage 2 (The Volatile Branch):**
  *If you reach this stage (Balls 90–100), you must choose between Strategy Safe or Strategy Risky.*
  *   **Strategy Safe (Option A):** You get **1 Token** for sure.
      *   *(Mathematically: 11% chance of 1 Token)*.
  *   **Strategy Risky (Option B):** You draw from a sub-bag (10 chips: 9 Gold, 1 Black).
      *   Gold (90% of the 11%): **5 Tokens**.
      *   Black (10% of the 11%): **0 Tokens**.
      *   *(Mathematically: 9.9% chance of 5 Tokens, 1.1% chance of 0)*.

  **The Hidden Comparison (Lottery 2):**
  Later, you will be offered a *different* venture that skips Stage 1 entirely.
  *   **Venture X:** 11% chance of 1 Token, 89% chance of 0.
  *   **Venture Y:** 10% chance of 5 Tokens, 90% chance of 0.
  *(Note: Venture X is mathematically identical to the Stage 2 payoff of Strategy Safe. Venture Y is identical to Strategy Risky.)*

  ## 4. Timeline & Script (90 Minutes)

  ### Phase 1: Setup & Commitment (0–20 mins)
  1.  **Distribute Tokens:** Give every student 5 tokens. Explain the raffle for the Prize. Emphasize: *"Tokens are your only currency. Protect them."*
  2.  **The Cover Story:** Explain the Two-Stage Venture (as above). Do **not** show the probabilities on the slide yet. Describe it verbally and with a simple tree diagram on the board.
  3.  **The Commitment (Blue Slip):**
      *   Ask students to fill out the Blue Slip.
      *   *Question:* "Before we draw the Urn, you must commit. If you reach Stage 2, will you choose **Safe** or **Risky**?"
      *   *Crucial:* They must sign it. Collect these. Do not return them yet.
  4.  **Silence:** Instruct them not to discuss choices.

  ### Phase 2: The Broker's Entry (20–35 mins)
  1.  **Select the Broker:** Choose one articulate student (or act as Broker yourself for the first run to ensure smoothness). Give them the Broker Badge and a "Bank" of 20 extra tokens.
  2.  **Broker's Rule:** "My job is to offer you swaps. If you swap, you pay me a **1 Token Fee**. I will not force you, but I will offer."
  3.  **The Second Preference (Red Slip):**
      *   Hand out Red Slips.
      *   *Question:* "Imagine a *different* venture. No Stage 1. Just a direct draw.
          *   **Option X:** 11% chance of 1 Token.
          *   **Option Y:** 10% chance of 5 Tokens.
          *   Which do you prefer?"
      *   Collect Red Slips.
  4.  **The Arbitrage Check:**
      *   The Broker compares Blue and Red slips for each student.
      *   **Pattern to Hunt:** Blue = Safe (A) AND Red = Risky (Y).
      *   *Note:* This is the Allais violation. (Preferring Sure Thing in the big frame, but Risk in the small frame).
      *   **Public Call:** "I am looking for investors who chose **Safe** on the Blue Slip but **Risky** on the Red Slip."
      *   Usually, 60–80% of the class will raise hands. Acknowledge them. "You are my target market."

  ### Phase 3: The Money Pump (35–55 mins)
  *This is the core experiential moment.*

  1.  **Select a Victim:** Pick one student who raised their hand (exhibiting the inconsistency).
  2.  **Step 1 (The Plan Swap):**
      *   **Broker:** "You committed to **Safe** on your Blue Slip. But I hold a contract for **Risky**. I know you actually prefer Risky in the sub-game (per your Red Slip). I will let you swap your commitment from Safe to Risky now, before the draw."
      *   **Cost:** 1 Token fee.
      *   **Action:** Student pays 1 Token. Broker marks their record as "Risky."
      *   **Rationale:** "You are optimizing your plan based on your true preferences."
  3.  **Step 2 (The Resolution):**
      *   **Broker:** "Now we draw the Urn for Stage 1."
      *   **Action:** Draw a ball.
      *   **Scenario A (Balls 1–89):** The student wins 1 Token. Game over. *The inconsistency didn't cost them extra beyond the fee.* (This happens 89% of the time).
      *   **Scenario B (Balls 90–100):** The student enters Stage 2. *This is where the pump completes.*
      *   *Pedagogical Trick:* If you draw 1–89, **reset the bag and draw again** until you hit 90–100. Tell the class: *"We are analyzing the decision node, so we must condition on reaching it."* This ensures the lesson lands.
  4.  **Step 3 (The Spot Swap):**
      *   **Broker:** "You are now in Stage 2. You currently hold the **Risky** position (because you swapped in Step 1). But wait. Look at your Red Slip. You prefer Risky (Y) over Safe (X). But look at the structure. In Stage 2, **Safe** is Option X and **Risky** is Option Y."
      *   *Wait, I need to reverse the pump logic to make them lose.*
      *   *Correction for Maximum Impact:*
          *   Start them with **Risky** (Default).
          *   **Swap 1:** "You chose Safe on Blue. You value certainty. I'll swap your Risky ticket for a Safe ticket. Fee: 1 Token." (Student pays. Now holds Safe).
          *   **Resolve Urn:** Force the 11% branch (Stage 2).
          *   **Swap 2:** "You are now in Stage 2. The 89% certainty is gone. It's sunk. You told me on the Red Slip that without the 89%, you prefer Risky (Y). So Risky is better than Safe here. I'll swap your Safe ticket for a Risky ticket. Fee: 1 Token." (Student pays. Now holds Risky).
          *   **Result:** They started with Risky. They ended with Risky. They paid 2 Tokens.
  5.  **The Lesson:** "You paid 2 Tokens to change your mind twice and end up exactly where you started. Your preference depended on whether the 89% was *possible* or *resolved*, even though it didn't affect the relative value of the options in the branch you actually entered."

  ### Phase 4: Payoff & Debrief (55–90 mins)
  1.  **Final Draw:** Run the Stage 2 sub-draw for the victim to determine their final winnings (5 Tokens or 0).
  2.  **Raffle:** Run the raffle for the Prize using everyone's token counts.
  3.  **The Reveal (Projector):** Now, and only now, put up the formal Allais Matrix.
      *   Map "Blue Slip Safe" to 1A.
      *   Map "Blue Slip Risky" to 1B.
      *   Map "Red Slip X" to 2A.
      *   Map "Red Slip Y" to 2B.
  4.  **Discussion Points:**
      *   **Independence Axiom:** Why did the 89% common consequence matter to you? It should have cancelled out.
      *   **Certainty Effect:** The psychological weight of moving from 99% to 100% (in the standard framing) vs. 11% to 10%.
      *   **Dynamic Consistency:** If you are rational, your Plan (Blue) and your Action (Red) should match. If they don't, you are vulnerable to a Money Pump.
      *   **What Gives?** To keep EU theory, you must deny the preferences (say you are indifferent). To keep the preferences (say they are real), you must drop EU (e.g., Prospect Theory, Rank-Dependent Utility).

