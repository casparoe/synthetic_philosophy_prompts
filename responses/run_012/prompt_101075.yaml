  ## 6. Predictable Pitfalls & Mitigations

  | Pitfall | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Stakes feel fake** | Tokens abstract; students don't care about a $30 card. | **Visualize the Prize.** Put the gift card on the desk. Count tokens aloud during the pump. "That's 20% of your buying power gone." |
  | **No one violates** | Some classes are hyper-rational or contrarian. | **Pre-seed the Broker.** If no one violates, *you* act as the Broker and demonstrate the pump on a hypothetical student, asking the class "Would you pay?" Most will admit they would have swapped. |
  | **Confusion on Probabilities** | 11% vs 10% math gets muddy in heads. | **Use the Urn.** Physical balls (1-89 vs 90-100) make the "Common Consequence" visible. Don't rely on percentages alone. |
  | **Broker Gaming** | A clever student Broker might refuse to pump to "save" their peer. | **Instructor as Broker.** For the first run, *you* be the Broker. It ensures the logic is ruthless. In future years, let a student try, but give them a script. |
  | **The "Sunk Cost" Objection** | Students argue the 89% isn't sunk, it's part of the plan. | **Acknowledge it.** This is the heart of the debate. The Independence Axiom *says* it should be treated as sunk. The Paradox *shows* we don't. Validate their feeling, then show the cost. |

  ## 7. Limitations (What You Must Supply)

  Be candid with your colleagues (and yourself) about what this activity *cannot* do:

  1.  **It doesn't solve the paradox.** It demonstrates the *cost* of the violation, but it doesn't tell them which theory is "right." You must explain in the debrief that dropping Independence leads to non-linear probability weighting (Prospect Theory), which has its own problems (e.g., framing effects).
  2.  **It relies on small stakes.** Even with tokens, this isn't life-changing money. Some students will say, "I'd behave differently with $1M." You must concede that the *magnitude* of the certainty effect might scale, but the *direction* usually holds.
  3.  **It assumes resoluteness.** The Money Pump works only if the student feels bound by their previous choice or preference. A truly "sophisticated" chooser might anticipate the pump and pre-commit to not trading. You need to explain that *naive* agents get pumped; *sophisticated* agents incur costs to prevent themselves from trading (self-binding).
  4.  **The "Zero" Problem.** In the standard Allais, the "zero" outcome is implicit. Here, we make it explicit. Some students might fixate on the "loss" of 0 rather than the gain. You need to steer the debrief back to the *common consequence* cancellation.

  ## 8. Instructor's Cheat Sheet for the Debrief

  *   **If they say:** "I chose Safe because I hate risk."
      *   **You say:** "But you chose Risky in the second venture. The risk was identical (10% vs 11%). Why did the risk feel different?"
  *   **If they say:** "The 89% mattered because it was a sure win."
      *   **You say:** "Exactly. That's the **Certainty Effect**. But Expected Utility Theory says a 89% chance of X should be valued as 0.89 * U(X). It shouldn't get a 'certainty bonus'. If you add that bonus, you break the math of independence."
  *   **If they say:** "I changed my mind in Stage 2 because the situation changed."
      *   **You say:** "Did the *relative* situation change? In both cases, you were comparing a smaller sure thing vs. a larger gamble. The 89% was common to both options in Game 1. Removing a common factor shouldn't change the ranking. That's the **Sure-Thing Principle**."
  *   **The Takeaway:** "Rationality isn't just about having preferences. It's about having preferences that don't eat your own wallet."
