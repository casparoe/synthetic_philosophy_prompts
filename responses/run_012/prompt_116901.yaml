answer: |-
  ### Brainstorming & Assumptions

  Okay, let's pull this apart. You're asking about the decision-theoretic underpinnings of randomized enforcement, using "Death in Samarra" as the anchor.

  **Assumption 1:** You're framing this as a single-agent decision problem (CDT vs. EDT), but I suspect it's actually a **Game Theoretic** problem. In "Death in Samarra," the agent is fighting fate (a fixed outcome). In tax audits, the agency is fighting a strategic opponent (the taxpayer). If the agency plays a pure strategy (fixed schedule), the target plays a best response (cheat on off-days). The "loop" you describe isn't fatalism; it's a **Mixed Strategy Nash Equilibrium**. The agency randomizes not because causality is spooky, but because predictability is exploitable.

  **Assumption 2:** You ask if this commits the agency to Causal Decision Theory (CDT) over Evidential Decision Theory (EDT). This is the muddled bit I need to push back on. EDT says "choose the act that is good news." If I audit where I smell a rat, that's good evidence I'll find a rat. But Game Theory says if I do that, the rats move. Randomization isn't about CDT vs. EDT; it's about **breaking the opponent's ability to condition their action on mine**. It presupposes the target has access to my policy (or can infer it).

  **Assumption 3:** You suggest the target must "talk themselves in circles." Do they? Not necessarily. They don't need to be confused; they just need to be **risk-averse**. If the penalty is high enough and the probability is non-zero, a simple expected-utility calculator complies. They don't need to believe the audit is *caused* by their cheating, only that it *might coincide*.

  **Assumption 4:** The "value of a mixed policy." You're right that the value isn't the average of the pure policies. In Game Theory, a mixed strategy can have a higher expected payoff than any pure strategy because it alters the *opponent's* payoff matrix.

  ---

  ### The Verdict: Joints, Requirements, and Convergence

  Here is the breakdown of what the practice (randomized/unannounced enforcement) actually relies on.

  #### 1. What the Practice Strictly Requires
  *   **Strategic Uncertainty:** The target must not be able to know *exactly* when the inspection occurs with probability 1. If they know, they game it.
  *   **Costly Penalties:** The penalty for being caught must outweigh the benefit of cheating, adjusted for the probability of detection. ($P(\text{catch}) \times \text{Penalty} > \text{Gain from Cheating}$).
  *   **Common Knowledge of Rationality:** The target must believe the agency is willing to carry out the threat. If the target thinks the agency is bluffing (too expensive to audit randomly), the randomness doesn't matter.

  #### 2. What Merely "Fits Well" (But Isn't Required)
  *   **CDT vs. EDT:** As noted, this distinction is less relevant than the Game Theory. However, the practice *does* reject a naive EDT approach by the agency. A naive EDT auditor thinks, "I should audit where I see signs of cheating." A Game-Theoretic auditor thinks, "If I only audit where I see signs, they will hide the signs." So, the practice fits with a **sophisticated CDT** that accounts for the target's counter-move.
  *   **Target Confusion:** You don't need the target to be philosophically confused (Samarra-style). You just need them to be unable to correlate their cheating schedule with the audit schedule. A simple random number generator on the agency's side defeats a smart target.

  #### 3. Where Incompatible Theories Converge
  *   **Behavioral Economics & Rational Choice:** A hyper-rational expected-utility maximizer and a anxiety-prone heuristic thinker will both comply under randomization. The rationalist calculates the odds; the anxious thinker fears the "anytime" possibility. The policy works regardless of the target's internal decision theory, provided they are risk-averse.
  *   **Libertarian Paternalism & Authoritarianism:** Both might endorse randomization. The authoritarian wants control; the paternalist wants to "nudge" compliance without constant surveillance. The *practice* looks the same; the *justification* differs.

  #### 4. The Pushback on Your Framing
  You asked: *"Does the practice presuppose... that they're the sort of agent who'd reason, if I skip today that means they predicted it, so they must be here today?"*

  **No.** That reasoning implies the target thinks their choice *causes* the audit (magical thinking or Newcomb's Problem). In reality, the target reasons: *"I don't know when they are coming, and I can't find out, so I must assume they could be here now."* It's not a causal loop; it's an **information asymmetry**. The agency hides information to prevent the target from conditioning their behavior. If the target thinks their choice *summons* the auditor, that's superstition. If they think their choice *increases the statistical risk*, that's math. The institution relies on the math, not the superstition.

  ---

  ### The Novelistic Swap: Changing the Presuppositions

  For your book, you need to know what happens if you change the underlying theory. If the institution stops believing in **Strategic Uncertainty** and starts believing in something else, the physical reality of the enforcement changes.

  Here are two concrete swaps:

  #### Swap A: From "Randomization" to "Algorithmic Transparency"
  **The Presupposition:** The agency believes **Predictive Determinism**. They assume they *can* know where the cheating is without randomness. They believe uncertainty is inefficient and unfair.
  **The Practice on the Ground:**
  *   **No more surprise visits.** The inspectors publish the exact risk algorithm. "We audit anyone whose energy usage drops 10% below the neighborhood median."
  *   **The Target's Behavior:** Targets don't stop cheating; they start **gaming the metrics**. They don't hide the act; they hide the *signal*.
  *   **Concrete Scene:** Instead of hiding drugs in the trunk (fear of random search), the driver installs a device that mimics the chemical signature of clean air in the exhaust (optimizing for the test).
  *   **The Vibe:** It feels less like a police state and more like a bureaucratic hellscape of SEO-style compliance. The tension isn't "Will they catch me?" it's "Did I optimize my profile enough?"

  #### Swap B: From "Randomization" to "Total Pre-Commitment"
  **The Presupposition:** The agency believes in **Causal Certainty via Severity**. They assume randomness is weak because it relies on probability. They believe if the penalty is infinite, the probability doesn't matter.
  **The Practice on the Ground:**
  *   **Fixed, Public Schedule:** "We audit every third Tuesday."
  *   **The Twist:** The penalty for cheating detected *at any time* (even outside audits) is ruinous. To make this work, they need **Whistleblower Immunity**. They outsource the surveillance to the targets' peers.
  *   **Concrete Scene:** The doping authority doesn't show up randomly. They announce the test date. But they offer a full pardon and a cash bounty to any teammate who reveals who doped *before* the test.
  *   **The Vibe:** Paranoia shifts from the Authority to the Peer Group. The "Death in Samarra" loop becomes a Prisoner's Dilemma among the targets. The institution doesn't need to be unpredictable; they just need to make the targets unpredictable to *each other*.

  #### Swap C: From "Randomization" to "Evidential Hunting" (The Naive EDT Swap)
  **The Presupposition:** The agency believes **Evidential Decision Theory**. They think, "Auditing is costly. We should only audit when we have evidence it will pay off."
  **The Practice on the Ground:**
  *   **Profiling:** Inspectors only visit when something looks wrong.
  *   **The Consequence:** This creates **Safe Zones**. If you know how to look clean, you can cheat freely.
  *   **Concrete Scene:** A tax auditor sits at a desk and only calls in people who made specific math errors. The sophisticated cheaters hire accountants who never make math errors. The audits become a ritual for punishing the clumsy, not the corrupt.
  *   **The Vibe:** The institution looks incompetent or biased. The "Death" character isn't omnipresent; he's a bumbling bureaucrat who only catches the poor. This undermines the authority's legitimacy in the eyes of your characters.

  ### Recommendation for the Book
  If you want to explore the philosophy of the "loop," **Swap A (Algorithmic Transparency)** is the most fertile ground.
  *   **Why:** It keeps the tension but changes the nature of the "game." In the current system (Randomization), the character fights **Chance**. In Swap A, the character fights **Logic**.
  *   **The Philosophical Shift:** It moves from "I cannot know where Death is" (Epistemic limitation) to "I know exactly where Death is, so I will walk around him" (Strategic exploitation).
  *   **The Conflict:** The institution realizes the targets are gaming the algorithm. Do they revert to randomness (admitting they can't predict)? Or do they make the algorithm more complex (escalating the arms race)? This gives you a plot engine: the transition from a Random Regime to a Transparent Regime, and the chaos that ensues when the targets solve the transparency.

  Does that give you the leverage you need? I can drill down on the Game Theory if you need the math to hold up, or the behavioral stuff if you need character motivation.
