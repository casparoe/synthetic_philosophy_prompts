answer: |-
  Here is a decision tree designed to cut through the "competence vs. equality" deadlock. It forces you to commit to ontological and institutional claims that usually get glossed over in seminar talk.

  ### The Epistemic Democracy Decision Tree

  **Start:** *Shared Premise:* Voters are often ignorant; some understand policy better; correct decisions are preferable.

  **Q1: Ontology.** Is there a fact of the matter about the "right" policy independent of what people want?
  *   **No:** (Legitimacy is purely procedural). → **Leaf 1: Pure Proceduralism**
  *   **Yes:** (Truth-tracking is possible). → *Go to Q2.*

  **Q2: Locus of Competence.** Is the capacity to track truth primarily an *individual* trait (expertise) or a *collective* property (diversity/aggregation)?
  *   **Collective:** → *Go to Q3.*
  *   **Individual:** → *Go to Q4.*

  **Q3: Collective Mechanism.** How is collective competence harnessed?
  *   **Random Selection:** → **Leaf 2: Lottocracy**
  *   **Structured Deliberation:** → **Leaf 3: Deliberative Mini-Publics**
  *   **Dynamic Delegation:** → **Leaf 4: Liquid / Delegable Voting**
  *   **Market Aggregation:** (Wait, markets are usually individual bets). → *See Q5.*

  **Q4: Expert Identification.** Can we reliably measure individual competence *ex-ante* without introducing bias or gaming?
  *   **No:** (Competence exists but is unmeasurable). → **Leaf 5: Technocracy** (Insulated agencies).
  *   **Yes:** (We can license the competent). → *Go to Q5.*

  **Q5: Incentive Structure.** Should we aggregate judgments via *votes* or *bets*?
  *   **Bets:** (Skin in the game). → **Leaf 6: Futarchy**
  *   **Votes:** (Formal power). → *Go to Q6.*

  **Q6: Power Allocation.** How does competence translate to formal power?
  *   **Gatekeeping:** (Vote or nothing). → **Leaf 7: Restricted Suffrage**
  *   **Weighting:** (More votes per person). → **Leaf 8: Plural Voting**
  *   **Checking:** (Veto over others). → *Go to Q7.*

  **Q7: Legitimacy Source.** Once equal votes are off the table, what justifies the veto?
  *   **Correctness:** (They know better). → **Leaf 9: Epistocratic Veto**
  *   **Contestability:** (They can only block, not rule). → **Leaf 10: Unnamed (Contestatory Epistocracy)**
      *   *Note:* This distinguishes a "wise council" from a "blocking chamber." Most literature conflates them, but the legitimacy claim differs.

  ***

  ### Analysis of the Tree

  #### 1. Incoherent or Unexplored Combinations
  There are logical paths through these questions that yield no defensible position. Here is where the arguments in your reading group are likely hiding:

  *   **Realism + Unmeasurable Experts + Plural Voting:** *Incoherent.* If you believe there is a right answer (Q1=Yes) and experts are unmeasurable (Q4=No), you cannot justify giving specific *individuals* extra votes (Q6=Weighting). You can only insulate institutions (Technocracy). Plural voting requires a list of names; Technocracy requires a list of rules.
  *   **Proceduralism + Individual Expertise:** *Incoherent.* If there is no fact of the matter (Q1=No), appealing to "competence" (Q2=Individual) is category error. Competence implies tracking truth; proceduralism implies satisfying will.
  *   **Collective Competence + Restricted Suffrage:** *Unexplored/Unattractive.* If the crowd is smart (Q2=Collective), why filter the crowd (Q6=Gatekeeping)? This view implies the crowd is smart *only if* you remove the bottom 20%. It's logically possible but empirically shaky (Condorcet's Jury Theorem breaks down if you skew the distribution too hard).

  #### 2. Indistinguishable Leaves
  Your tree cannot cleanly separate these pairs with the current questions. Be ready for this objection:

  *   **Technocracy (Leaf 5) vs. Epistocratic Veto (Leaf 9):** In practice, insulated agencies (Fed, Courts) *have* veto power. The distinction is theoretical (appointment vs. exam), not functional. To separate them, you'd need a branch on "Recruitment Method" (Exam vs. Appointment), but that's bureaucratic detail, not political theory.
  *   **Lottocracy (Leaf 2) vs. Mini-Publics (Leaf 3):** If a mini-public has binding power, it *is* a lottocracy. The distinction usually rests on "deliberation" vs. "voting," but lots deliberate too. This split is often just branding for the same mechanism.

  ***

  ### Placement of Your Proposal

  **Your Proposal:** Bicameral. House 1: Elected. House 2: Lot from Exam-Passers. Power: Suspensive Veto on Cost-Benefit.

  **Where it sits:**
  This proposal is a hybrid that straddles the **Individual/Collective** split (Q2).
  1.  **Exam:** Assumes individual competence is measurable (Q4=Yes).
  2.  **Lot:** Assumes collective randomness is valuable (Q3=Random).
  3.  **Veto:** Assumes power should be a check, not a rule (Q6=Checking).

  **Closest Leaf:** **Leaf 9: Epistocratic Veto.**
  Functionally, your second house is an epistocratic body with veto power. The use of *lot* to select them is a secondary filtering mechanism to prevent the exam-passers from becoming a cohesive class interest.

  **How to push it into different leaves:**
  *   **To become Lottocracy (Leaf 2):** Remove the exam. Let the second house be drawn from *everyone*. You lose the competence guarantee but gain descriptive representation.
  *   **To become Restricted Suffrage (Leaf 7):** Give the second house *full* legislative power (not just veto) and abolish the elected house. You move from a check on democracy to a replacement of it.
  *   **To become Technocracy (Leaf 5):** Replace the lot/exam with appointment by credentialed bodies (e.g., Bar Association, National Academy of Sciences) and remove the veto (make it direct administration).
  *   **To become Unnamed (Leaf 10):** Emphasize that the second house cannot propose laws, only *block* them based on procedural correctness (cost-benefit), framing legitimacy purely as **Contestability** rather than **Correctness**. This shields you from the "who guards the guardians" objection.

  **Blunt Assessment for the Group:**
  Your proposal is the most stable position on the tree because it hedges. It admits experts exist (Exam) but fears class capture (Lot). It admits democracy fails (Veto) but fears tyranny (Suspensive only). The cost is complexity. If your group hates it, it's because they prefer the purity of Proceduralism (Leaf 1) or the efficiency of Technocracy (Leaf 5). Hybrids annoy purists.
