  *(Tuesday was the visitor; Thursday was the void.)*

  The gate latch clicked without a wind.
  A shape stood where the gravel ended.
  I saw the coat, the darkened hand,
  The face I knew before it turned.
  I called the name and heard it land.
  The silence held until it burned.

  The gate latch clicked without a wind.
  A shape stood where the gravel ended.
  I saw the coat, the darkened hand,
  The face I knew before it turned.
  I called the name and heard it land.
  The silence held until it burned.

  Morning light lies flat on wood.
  I try to find where they diverge.
  The memory stands where both have stood.
  My hands meet only wood and verge.
  One night the world came to the door,
  The other made the dark feel full.

  Notes on the form

  The two identical stanzas perform the common-kind argument. By presenting the hallucination and veridical perception with identical syntax and imagery, the poem mimics the claim that subjective indistinguishability entails a shared mental state. The reader sees the same words and feels the same weight, mirroring the subject's inability to distinguish.

  The disjunctivist turn occurs in the final stanza. While the speaker admits she cannot name the night that lied, the poem asserts an ontological difference: One night the world came to the door, the other made the dark feel full. This leans disjunctivist. It refuses to reduce the experience to the common denominator of the description. The nature of the experience is constituted by its object, not just its feel.

  Does this make disjunctivists look worse? The objection claims that if the subject can't tell, the fact of the external object is irrelevant to her life. The poem answers this by showing the difference matters even if inaccessible. The world coming to the door implies a connection to reality that making the dark feel full lacks. The epistemic limitation does not erase the metaphysical distinction. The poem validates the disjunctivist claim that the real case is fundamental, even if the subject cannot introspectively verify it. The difference sits outside the text, in the fact of the matter, not in the description.
