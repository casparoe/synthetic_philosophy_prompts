      *   **Goal:** A Q&A prep sheet. Not a defense, but a *map* of objections.
      *   **Requirements:**
          *   Objections ordered by likelihood/damage.
          *   Phrased in the voice of the specific objector (Prof, Coherentists, Infinitist).
          *   Short reply (1-2 mins).
          *   Candid note on weakness.
          *   Concessions vs. Hard Lines.
