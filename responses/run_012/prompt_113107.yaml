answer: |-
  I.

  The valley woke when heavy engines came,
  A concrete throat to swallow up the rain.
  They moved the bones to serve a larger name,
  A bronze lung breathing for the thirsty plain.
  Now boys dive down where parishioners walked,
  To claim the road where funeral carts once rolled.
  Great cities rise on sacrifices made,
  The past must fuel the hunger of the now.
  No shadow lingers in this bright arcade,
  We honor progress with a sweaty brow.
  The stone remains; the water takes its due.
  So let them swim above the buried nave,
  And drink the life that drowned the quiet dead.
  The tower points the way a hero gave,
  A finger raised where living bread is spread.
  The reservoir is memory's grander cup,
  Where history lifts the present moment up.

  II.

  The valley slept within the careful soil,
  A gentle throat that held the ancestor.
  They moved the bones to spare the roots from spoil,
  A bronze tongue speaking from the reservoir.
  Now boys dive down where parishioners walked,
  To trace the road where funeral carts once rolled.
  Small households grow on care for what was made,
  The past must feed the piety of the now.
  No shadow fades in this quiet arcade,
  We count the cost with a reverent brow.
  The stone remains; the water takes its due.
  So let them swim above the buried nave,
  And taste the life that drowned the quiet dead.
  The tower keeps the watch a keeper gave,
  A finger raised where silent bread is spread.
  The reservoir is memory's sacred cup,
  Where history holds the present moment up.

  III.

  The valley choked when heavy engines came,
  A concrete throat to swallow up the rain.
  They left the bones to rot in a stranger's name,
  A bronze lung choking on the thirsty plain.
  Now boys dive down where parishioners
  kicked the road where funeral carts once
  Great cities gorge on sacrifices made,
  The past must bleed the hunger of the now.
  Every shadow lurks in this bright arcade,
  We mask the theft with a sweaty brow.
  The stone remains; the water takes its due.
  So let them swim above the broken nave,
  And drain the life that drowned the quiet dead.
  The tower points the crime a hero gave,
  A finger raised where stolen bread is
  The reservoir is memory's poisoned cup,
  Where history grinds the present moment—

  ***

  **Note on Choices**

  The form is a strict container: three movements, each comprising three six-line stanzas in loose iambic pentameter, with an *ababcc* rhyme scheme. This rigidity serves the Nietzschean argument: the "facts" (the tower, the road, the water) do not change, only the valuation placed upon them. Movements I and II are metrically and syntactically parallel to emphasize that the Monumental and Antiquarian modes are both stable, habitable ways of living with the past. The refrain—"The stone remains; the water takes its due"—is the pivot. In I, "due" is natural law (progress requires fuel); in II, it is ritual obligation (the ledger must be balanced); in III, it is extortion (theft disguised as necessity).

  I have taken a liberty with Nietzsche's *Critical* mode. For Nietzsche, the Critical mode is a violence committed against the past *for the sake of life*, a necessary destruction to prevent the past from suffocating the present. It is not inherently moralistic, though it often looks like it. In the poem, Movement III begins to fracture visually and metrically (line breaks in stanza one, broken rhyme in stanza three) to mimic this destructive impulse. However, I resisted making Movement III the "truth." Movement I (Monumental) is seductive in its promise of civic greatness; Movement II (Antiquarian) is seductive in its warmth and belonging. Movement III is seductive only in its clarity, but it offers no place to live—the form breaks because a purely Critical history consumes its own ground. The poem ends mid-thought because the Critical mode, if it dominates, eventually destroys the language it uses to judge.
