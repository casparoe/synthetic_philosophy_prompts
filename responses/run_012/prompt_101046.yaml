prompt: |-
  The Halvorsen Institute, where I chair the community-standards subcommittee, hosts about forty visiting fellows a year, most of them from a country whose everyday conventions around lining up, crossing the street, and tipping differ sharply from ours. Three matters are now before us. First, several fellows habitually drift out of the single serpentine service line at the institute cafeteria, joining it wherever it happens to be when they arrive; the cafeteria staff and the fellows who have been waiting call this queue-jumping, and because there is one line it plainly changes who is served when. Second, the fellows routinely cross the four-lane road between the two institute buildings at grade rather than walk two hundred meters to the pedestrian bridge; the crossing is technically unlawful, virtually every local employee does it too, and the city has only recently begun issuing the occasional citation. Third, our café is run by a contractor that pays its baristas a base wage comfortably above the statutory minimum, and the fellows, following the custom they grew up with, leave nothing in the tip jar; the baristas say the omission reads as a judgment on their service, while the fellows say a tip tied to nothing is simply a demand for money they have no reason to give.

  Our mandate cuts both ways: the charter commits us to fostering an inclusive community in which visitors are guests rather than supplicants, and separately to conducting our affairs in accordance with the laws and the reasonable expectations of the surrounding community. A staff petition asks us to require all fellows to observe local conventions on pain of losing cafeteria privileges; a counter-petition signed by roughly half the fellows says we would be conscripting them into customs they never agreed to, and that courtesy is all anyone can owe a stranger. Two members have already floated candidate rules. One proposes an exit test: a local convention binds a visitor just in case the visitor could opt out of it without making the practice unworkable for those who rely on it. The other proposes a reciprocity condition: visitors owe compliance only with conventions we would ourselves observe were we the guests.

  Please draft the short written opinion I will circulate before the vote. It should recommend a concrete course of action — one disposition for each of the three practices, with a time frame for implementation — and give the reasoning that supports it. Two things I want it to do explicitly. First, it should not treat the three practices as interchangeable: say what, if anything, distinguishes the line, the crossing, and the tip, and whether any of the three is a genuine moral obligation rather than a matter of etiquette. Second, it should engage the fellows' objection in its strongest form rather than dismissing it as cultural insensitivity; if some conventions do bind visitors, say what makes them bind, and if the honest answer is that it depends, give a criterion a reader could actually apply to a fourth case we have not seen. Assume the reader has no patience for a bare appeal to local custom, or for the claim that every custom is as valid as any other, as a stopping point — and treat the two proposed rules on their merits rather than by fiat.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Community-Standards Subcommittee at the Halvorsen Institute.
      *   **Audience:** Subcommittee members (and potentially the wider institute community, as it will be circulated before a vote).
      *   **Task:** Draft a short written opinion recommending a concrete course of action for three specific issues (cafeteria line, jaywalking, tipping).
      *   **Constraints/Requirements:**
          *   Recommend a disposition for each practice + time frame.
          *   Provide reasoning.
          *   *Crucial 1:* Do not treat the three practices as interchangeable. Distinguish them (moral obligation vs. etiquette).
          *   *Crucial 2:* Engage the fellows' objection strongly (don't just dismiss as cultural insensitivity). Explain *why* some conventions bind visitors.
          *   *Crucial 3:* Provide a generalizable criterion for future cases (not just "local custom" or "relativism").
          *   *Crucial 4:* Evaluate the two proposed rules (Exit Test, Reciprocity Condition) on their merits.
          *   Tone: Professional, reasoned, authoritative but inclusive, avoiding bare appeals to custom or radical relativism.

  2.  **Deconstruct the Three Issues:**
      *   **Issue 1: The Cafeteria Line.**
          *   *Nature:* Single serpentine line. Drifting in changes the order of service.
          *   *Harm:* Directly affects other waiters (time/fairness). Zero-sum game (if you cut, someone waits longer).
          *   *Fellows' View:* Habit/custom.
          *   *Local View:* Queue-jumping (unfair).
          *   *Analysis:* This creates a negative externality on specific others. It violates fairness in a resource allocation system.
      *   **Issue 2: Jaywalking.**
          *   *Nature:* Crossing a 4-lane road at grade vs. using a bridge 200m away.
          *   *Legality:* Technically unlawful, but enforcement is new/rare.
          *   *Prevalence:* Locals do it too.
          *   *Harm:* Safety risk (mostly to self, potentially to drivers), minor traffic disruption.
          *   *Analysis:* If locals do it, it's a "broken window" norm rather than a strict moral boundary. The harm is diffuse.
      *   **Issue 3: Tipping.**
          *   *Nature:* Baristas paid above minimum wage. Fellows don't tip (custom). Baristas feel insulted.
          *   *Economics:* Wage is "comfortably above statutory minimum." Tip is optional/gratuity.
          *   *Harm:* Psychological/relational (baristas feel judged), not financial survival (presumably).
          *   *Analysis:* This is purely normative/etiquette. No contractual obligation.

  3.  **Evaluate the Proposed Rules:**
      *   **Exit Test (Opt-out without making practice unworkable):**
          *   *Line:* If everyone opted out, the line system collapses. Fails test -> Binding.
          *   *Crossing:* If everyone crossed at grade, traffic might slow, but usually, it's about safety. If *everyone* (including locals) does it, the practice is already "workable" in a sense, but the law says otherwise.
          *   *Tipping:* If no one tipped, baristas might quit or wages might adjust. But since wages are high, maybe not unworkable.
          *   *Critique:* Good for systemic coordination problems (lines), less good for symbolic norms (tips).
      *   **Reciprocity Condition (Would we observe it if guests?):**
          *   *Line:* Yes, we would wait in line abroad.
          *   *Crossing:* If locals do it, we would too.
          *   *Tipping:* If we were guests in a no-tip culture, we wouldn't tip.
          *   *Critique:* Strong on fairness, but relies on hypotheticals.

  4.  **Develop the Guiding Principle (The "Criterion"):**
      *   Need something better than "Local Custom" (too authoritarian) or "Anything Goes" (too chaotic).
      *   Need to address the Fellows' concern about not being "conscripted."
      *   *Idea:* Distinguish between *Coordination Norms* (fairness/efficiency affecting others) and *Expressive Norms* (symbolic/cultural).
      *   *Refined Idea:* **The Harm and Fairness Principle.** A convention binds a visitor if violating it imposes a non-consensual burden on specific others or undermines a fair system of cooperation, *unless* the host community itself systematically violates the norm.
      *   *Wait, let's look at the "Exit Test" again.* It's actually quite robust for the line.
      *   *Let's look at Reciprocity.* It handles the jaywalking well (locals do it, so we can too).
      *   *Synthesis:* I should adopt a hybrid approach or select the stronger one. The prompt asks me to treat them on their merits. I think the **Reciprocity Condition** is better for the "guest" status, but the **Exit Test** is better for the "queue."
      *   *Actually, a better criterion:* **The Non-Imposition Principle.** Visitors are bound by norms that prevent imposing costs on others, but not by norms that are purely symbolic or where the host community is non-compliant.
      *   *Let's try to formulate a specific criterion for the opinion:* "A convention binds a visitor when its violation imposes a tangible burden on specific others or undermines a fair cooperative scheme, provided the host community upholds that scheme."

  5.  **Drafting the Dispositions:**
      *   **Line:** Must follow the queue. It's a fairness issue. Violation harms specific waiters.
      *   **Crossing:** No sanction. Locals do it. It's a safety choice, not a fairness issue regarding others (mostly). The law is tepidly enforced.
      *   **Tipping:** No requirement. It's a gift, not a wage. Baristas' feelings are valid but don't create an obligation. Education/Signage instead of coercion.

  6.  **Addressing the Fellows' Objection:**
      *   Acknowledge that "custom" isn't law.
      *   Acknowledge that being a guest doesn't mean total assimilation.
      *   Argue that obligation arises from *interaction*, not just geography. When you enter a cooperative scheme (the line), you owe fairness to participants.

  7.  **Structure of the Opinion:**
      *   **Header:** To, From, Date, Subject.
      *   **Introduction:** Acknowledge the tension (Inclusion vs. Local Norms). State the purpose.
      *   **Framework/Criterion:** Evaluate the two proposals. Propose the working standard (Harm/Fairness + Host Compliance).
      *   **Analysis of the Three Cases:** Apply the standard. Distinguish them.
      *   **Recommendations:** Concrete actions + timelines.
      *   **Conclusion:** Reiterate the community vision.

  8.  **Refining the Tone:**
      *   Avoid moralizing.
      *   Be precise.
      *   Ensure the distinction between moral obligation and etiquette is clear.
      *   Make sure the "criterion" is applicable to a hypothetical fourth case.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I treat the three practices as interchangeable? *No, I need to explicitly contrast them.*
      *   *Check:* Did I engage the fellows' objection? *Yes, by validating that not all customs bind.*
      *   *Check:* Did I evaluate the proposed rules? *Yes, need to explicitly mention why I accept/reject parts of them.*
      *   *Check:* Is there a time frame? *Need to add specific dates or periods (e.g., "immediately," "upon arrival," "next semester").*
      *   *Check:* Is the criterion generalizable? *Yes, formulate it clearly.*

      *(Self-Correction on the Criterion)*: The prompt asks me to treat the two proposed rules on their merits. I should explicitly discuss them.
      *   Exit Test: Good for the line (if everyone opts out, line fails). Bad for tipping (if no one tips, system might survive due to wages).
      *   Reciprocity: Good for jaywalking (locals do it). Good for tipping (we wouldn't tip abroad if not expected).
      *   My Synthesis: I will propose a standard that incorporates the *spirit* of both: **The Fair Cooperation Standard.** (Does it undermine a fair system? + Do hosts uphold it?)

      *(Refining the Tipping Issue)*: The baristas feel insulted. This is real harm, but is it an *obligation*? If wages are high, tipping is truly discretionary. Requiring tips turns them into a surcharge. Better solution: Signage explaining local custom, but no mandate.

      *(Refining the Jaywalking)*: It's unlawful. But "virtually every local employee does it too." This triggers the Reciprocity condition. If hosts break the rule, guests shouldn't be punished for it.

      *(Refining the Line)*: This is the strongest case for enforcement. It's a zero-sum resource allocation.

  10. **Final Polish:** Check word count (keep it "short written opinion"), ensure clear headings, and verify all prompt constraints are met. (Make sure to explicitly mention the "fourth case" criterion).

      *Decision on Criterion:* I will propose a modified version of the Exit Test, tempered by Reciprocity. Let's call it the **"Fair Burden Principle."** A norm binds if violating it shifts a burden to others *and* the host community generally bears that burden themselves.

      *Wait, one more check:* The prompt asks to "treat the two proposed rules on their merits rather than by fiat." I need to show I considered them.
      *   Exit Test: Useful for identifying systemic dependencies.
      *   Reciprocity: Useful for identifying legitimate local expectations vs. hypocrisy.
      *   My view: Use Exit Test for the Line (systemic), Reciprocity for the Crossing (hypocrisy), and neither for the Tip (voluntary).

      *Let's finalize the recommendations:*
      1.  Line: Mandatory orientation + potential loss of privileges (last resort).
      2.  Crossing: No action (safety advisory only).
      3.  Tipping: Signage/Education, no mandate.

      *Time frames:* Immediate for Line (orientation), Immediate for Crossing (advisory), End of Month for Tipping (signage).

      *Let's write.*
answer: |-
  **TO:** Community-Standards Subcommittee
  **FROM:** Chair, Community-Standards Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendations on Visitor Conventions and Community Norms

  **I. Purpose and Framework**

  We face a tension inherent to any international community: how to honor our charter's commitment to inclusivity without abdicating our responsibility to the local laws and expectations that sustain our operations. The staff petition demands assimilation; the fellows' counter-petition demands exemption. Both claim the mantle of "courtesy." To resolve this, we must distinguish between mere etiquette and genuine moral obligation.

  We were offered two heuristics: the **Exit Test** (does opt-out break the system?) and the **Reciprocity Condition** (would we follow this if we were guests?). Both have merit. The Exit Test correctly identifies when a behavior creates a negative externality that undermines a cooperative scheme. The Reciprocity Condition correctly identifies when a host community lacks the standing to enforce a norm it routinely violates.

  However, neither is sufficient alone. I propose we adopt a **Fair Burden Criterion** for this and future cases: *A local convention binds a visitor if violating it imposes a non-consensual burden on specific others or undermines a fair system of cooperation, provided the host community generally upholds that system.* This criterion respects the fellows' objection that they are guests, not subjects, while acknowledging that guest status does not grant license to disrupt fair cooperation.

  **II. Analysis of Practices**

  We must not treat the three matters as interchangeable. They differ in the nature of the harm and the legitimacy of the expectation.

  1.  **The Cafeteria Line (Moral Obligation):**
      The single serpentine line is a cooperative scheme for allocating scarce resources (time and food). When a fellow drifts into the middle, they do not merely violate etiquette; they impose a direct time cost on every person behind them. This fails the fellows' "courtesy" defense because courtesy cannot justify imposing costs on strangers without their consent. It passes the Exit Test: if everyone opted out, the system would collapse into chaos. It passes the Fair Burden Criterion: locals wait, and the burden of waiting is shifted to them by the violation.
      *Disposition:* **Binding.**

  2.  **The Pedestrian Crossing (Prudential/Legal):**
      While technically unlawful, this practice is widely observed by local employees. To enforce this against fellows while locals evade citation would be hypocritical and violates the spirit of the Reciprocity Condition. The primary risk is to the walker and drivers, not a specific queue of pedestrians. While we should not encourage illegality, we lack the standing to sanction fellows for a norm the host community treats as optional.
      *Disposition:* **Non-Binding (Advisory Only).**

  3.  **The Tip Jar (Etiquette/Expressive):**
      Tipping here is a gratuity, not a wage supplement, as baristas are paid above the statutory minimum. The fellows' refusal to tip is not a refusal to pay a debt, but a refusal to give a gift. The baristas' feeling of insult is real, but feelings do not create obligations for guests in the absence of economic necessity or explicit contract. Requiring tips would convert a gratuity into a surcharge, contradicting the "guest" status. This fails the Fair Burden Criterion: no tangible burden is imposed on specific others, only a symbolic slight.
      *Disposition:* **Non-Binding (Educational Only).**

  **III. Recommendations and Implementation**

  Based on the Fair Burden Criterion, I recommend the following dispositions:

  1.  **Cafeteria Queueing:**
      *   **Action:** Adherence to the single line is a condition of cafeteria access.
      *   **Implementation:** Effective immediately. Orientation materials will explicitly diagram the queueing system. Staff are authorized to issue one warning; a second verified incident results in loss of cafeteria privileges for the remainder of the fellowship term.
      *   **Reasoning:** This protects the fairness of the cooperative scheme.

  2.  **Street Crossing:**
      *   **Action:** No sanctions. The Institute will issue a safety advisory noting the legal risk and the existence of the bridge.
      *   **Implementation:** Advisory included in arrival packet within 14 days.
      *   **Reasoning:** Reciprocity dictates we cannot enforce a norm locals ignore. Safety concerns are best addressed through information, not punishment.

  3.  **Tipping:**
      *   **Action:** No requirement to tip. The Institute will install signage near the register explaining local tipping customs ("Tipping is appreciated but not required").
      *   **Implementation:** Signage installed by end of next month.
      *   **Reasoning:** This respects the fellows' cultural norms while ensuring the omission is not misinterpreted as a judgment on service. It balances the baristas' desire for recognition with the fellows' refusal to be conscripted into an unfamiliar custom.

  **IV. Conclusion**

  This approach rejects the claim that "custom is law," but also rejects the claim that "guests owe nothing." It draws a line where behavior shifts from cultural difference to unfair imposition. By applying the Fair Burden Criterion, we ensure that if a fourth case arises—say, noise levels in shared workspaces—we can ask: *Does this violate a fair cooperative scheme, and do we uphold it ourselves?* If yes, it binds. If no, it remains a matter for dialogue, not discipline.

  I move we adopt these recommendations.
