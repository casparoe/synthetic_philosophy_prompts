answer: |-
  You have identified a precise mechanism that translation theory often circles but rarely names with the specificity you demand. Your hypothesis is correct: this is fundamentally about **Verification Asymmetry**.

  There is no single, canonical term in translation studies that captures the entire loop you described (the masking of the loss, the drift of the sense, and the retroactive attribution to the source). However, the phenomenon is a recognized risk in constrained writing and formalist translation.

  Here is the carving you asked for.

  ### The Term: **Formal Ventriloquism**

  I propose **Formal Ventriloquism** to name this phenomenon.

  **Definition:**
  *Formal Ventriloquism* occurs when a translation successfully replicates high-salience formal constraints (rhyme, meter) at the expense of low-salience constraints (acrostics, semantic fidelity), such that the success of the audible form creates an **Illusion of Fidelity**. This illusion causes the reader (and often the translator) to misattribute the semantic drift necessitated by the form to the original author's intent.

  ### The Mechanism: Verification Asymmetry

  Your insight about "constraints a reader can check for free" is the engine of this phenomenon. In software terms, you have discovered a **Checksum Error**.

  1.  **High-Salience Constraints (The Checksum):** Rhyme and meter are "low-cost verification." A reader hears them immediately. They act as a checksum for the poem's integrity. If the rhyme scans, the reader's brain assumes the "data packet" (the poem) is intact.
  2.  **Low-Salience Constraints (The Payload):** The acrostic and the precise semantic sense are "high-cost verification." They require effort, marginalia, or bilingual comparison to verify.
  3.  **The Failure:** When the checksum passes (the rhyme is perfect), the system validates the payload even if it has been corrupted (the meaning has drifted).

  ### One Phenomenon or Two?

  You asked if dropping the unseen constraint and adding the unearned image are the same thing. Under **Formal Ventriloquism**, they are a single coupled system, best understood through **Constraint Thermodynamics**.

  A poem has a finite "energy budget" for constraint satisfaction.
  1.  **Constraint Displacement:** You spend energy on Rhyme (high salience). You must subtract energy from Acrostic (low salience). The acrostic is dropped not by accident, but by thermodynamic necessity.
  2.  **Semantic Drift:** Rhyme requires specific phonemes. Those phonemes require specific words. Those words carry specific associations. The "unearned image" is not an addition; it is the exhaust heat generated by the engine of the rhyme.
  3.  **Retroactive Attribution:** Because the Checksum (Rhyme) passed, the reader assumes the Exhaust Heat (the new image) was part of the original engine design.

  Therefore, the loss and the gain are not two errors; they are the input and output of the same process.

  ### Differentiation from Nearby Concepts

  It is vital to distinguish **Formal Ventriloquism** from existing translation concepts:

  *   **Vs. "Something gets lost":** The general complaint of translation loss is passive. *Formal Ventriloquism* is active; the loss is *concealed* by a gain.
  *   **Vs. Domestication (Venuti):** Domestication makes the text familiar to the target culture. *Formal Ventriloquism* makes the text feel *faithful* to the source structure, even while altering the source meaning.
  *   **Vs. Compensation:** Compensation is when a translator admits a loss in one place and makes up for it elsewhere (e.g., "I lost the pun here, so I added a joke there"). *Formal Ventriloquism* is unacknowledged. The translator does not say, "I dropped the acrostic to save the rhyme." They simply present the rhyme, and the acrostic vanishes silently.
  *   **Vs. The Intentional Fallacy:** This is the literary error of assuming the text's effect equals the author's intent. *Formal Ventriloquism* is a specific *translation-induced* intentional fallacy, where the translator's constraints are mistaken for the author's intent.

  ### Edge Cases and Boundaries

  You asked where the edges of this carving lie.

  **1. Is it still Formal Ventriloquism if the translator flags the loss in a note?**
  **No.** The moment you add a note saying "The acrostic was lost to preserve the rhyme," you break the *Ventriloquism*. You have severed the link between the formal success and the illusion of total fidelity. It becomes **Declared Adaptation**. The "mirage" requires the silence of the translator regarding the trade-off.

  **2. Is it still the same thing if the added image contradicts the original?**
  **Yes, but it escalates.** If the drift is neutral (a new image), it is *Formal Ventriloquism*. If the drift contradicts the original (e.g., the original is joyful, the rhyme forces a melancholic word, and the reader perceives the original as melancholic), it becomes **Structural Usurpation**. The form has not just masked the loss; it has inverted the source.

  **3. Does this extend to prose with stylistic constraints?**
  **Yes.** Consider translating Hemingway's brevity into a language that requires verbose verb conjugations.
  *   **Constraint:** Brevity (High Salience in style).
  *   **Loss:** Nuance or specific tense aspect (Low Salience to a casual reader).
  *   **Drift:** The text feels "staccato" in the target language, but implies a rudeness not in the original.
  *   **Result:** Readers assume Hemingway was rude in French, rather than the translation being forced into brevity. This is **Stylistic Ventriloquism**.

  ### Summary for the Engineer

  You are experiencing **Verification Asymmetry** leading to **Formal Ventriloquism**.

