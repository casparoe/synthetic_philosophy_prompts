          2.  Condensed-Matter Theorist (Emergentist/EFT) - Thinks realism is dissolved by effective field theory (EFT), proposal is particle-physics parochialism.
          3.  Two Committed Realists (Structuralist, Entity/Ineliminable Work) - Think the proposal concedes too much, turns realism into mere heuristic.
      *   **Format:** Objections ordered by likelihood/damage, phrased in the constituency's vocabulary, 2-minute spoken reply, honesty note (soft spots), strategy (concede/hold/reframe), opening concession advice, closing "fear question."
