      *   *Weakness 2 (EFT/Emergentist):* Why care about "truth" of posits if EFT works regardless? Electrons might just be quasiparticles. Convergence might just mean convergence on *effective* utility, not ontology.
      *   *Weakness 3 (Realists):* Graded credence sounds like instrumentalism. If you admit theories get abandoned, what are you being a realist *about*? Structuralists want the math/structure, not the "posit count."
