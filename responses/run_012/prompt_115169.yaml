      *   *Ether Historian:* "Independence is an illusion. Michelson-Morley, stellar aberration, Fizeau—all relied on Maxwellian optics or specific mechanical assumptions. You're calling them independent routes, but they were all trapped in the same paradigm. You're coding independence based on survival, not historical context."
