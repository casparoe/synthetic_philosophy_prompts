      *   **Topic:** Defending qualified scientific realism against the pessimistic meta-induction (PMI) using a "convergence of evidence" (base-rate/reference class) argument.
      *   **Core Argument:** PMI fails because the reference class is wrong. Abandoned posits had low evidential convergence; retained posits (atoms, electrons, genes) had high convergence. Realism should be graded credence based on convergence count.
