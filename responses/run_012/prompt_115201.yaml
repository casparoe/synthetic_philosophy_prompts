  Drafting notes
  We discarded claims that logic "mirrors reality," as Camp B rejects metaphysical readings of logical constants while Camp A embraces them. We also rejected "truth is consistent," which Camp A explicitly denies. The hardest formulations concerned "validity." Camp A sees it as strict truth-preservation; Camp B as rational acceptability-preservation. We settled on "preservation of designated status" to remain neutral on the nature of the designated value. We also struggled with "paradox solution." Camp A sees acceptance as the only honest solution; Camp B sees restriction of rules as necessary. We phrased this as "either diagnosing the derivation or accepting the conclusion." Finally, "false" was contentious. Camp A allows true-and-false; Camp B requires exclusive falsity. We used "unacceptable" where possible to avoid truth-value commitments, though this risks obscuring the normative force each side attributes to falsity. We avoided naming specific formal systems to prevent privileging one mathematical implementation over another.

  Framing
  We agree that classical logic fails to handle semantic paradoxes and inconsistent information without triviality. The dispute concerns the interpretation of this failure. Camp A argues that the paradoxes are sound arguments revealing that reality or truth itself is contradictory. For them, denying this is ad hoc revisionism that sacrifices honesty for comfort. They fear that restricting logic to save consistency mutilates natural language. Camp B argues that logic is a normative tool for reasoning, and contradictions signal error, not truth. For them, accepting contradictions collapses the distinction between correct and incorrect belief, rendering logic useless. They fear that accepting gluts destroys the guidance logic offers action. Both sides agree the stakes are high: Camp A risks irrationality; Camp B risks dishonesty. We frame this not as a technical error but as a divergence on the purpose of logic: is it to describe the limits of truth, or to regulate belief? Both sides acknowledge that if they are wrong, their preferred logic either licenses nonsense or forbids truth. This document maps the overlap without dissolving the tension, acknowledging that both sides view the other as theoretically unstable despite shared formal commitments.

  Agreed claims
  **Consequence and Explosion**
  1. The principle of explosion (from a contradiction, anything follows) is invalid.
  2. Logical consequence is defined as the preservation of a designated status from premises to conclusion.
  3. A paraconsistent consequence relation is formally coherent and mathematically well-defined.
  4. Classical validity holds in domains where inconsistencies are absent.
  5. Negation expresses incompatibility between contents.

  **Paradoxes and Derivation**
  6. The Liar paradox constitutes a valid argument within natural language under standard rules.
  7. The premises of the Liar derivation are plausible commitments of any theory of truth.
  8. A solution to a paradox must either identify a faulty rule or accept the conclusion.
  9. Ad hoc restrictions on logical rules are methodologically undesirable without independent justification.
  10. Semantic closure (a language containing its own truth predicate) is a desirable feature of natural language.

  **Truth, Meaning, and Method**
  11. Truth is normative: one ought not to assert what is not true.
  12. Meaning is public and determined by use, not by private mental states.
  13. A theory of truth must cohere with a theory of meaning and assertion.
  14. Logical evaluation requires both formal adequacy and philosophical plausibility.
  15. Inconsistent information states (in law, science, databases) are common and manageable.

  Disagreements
  | Issue | Dialetheist Formulation | Non-Dialetheist Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | Truth of Contradictions | Some contradictions are true and false. | No contradiction is true; some are only acceptable. | Conceptual |
  | Law of Non-Contradiction | The LNC is false as a universal law. | The LNC is true but not a logical law. | Conceptual |
  | Liar Sentence Status | The Liar is true and false. | The Liar is unacceptable but not true. | About Truth |
  | Expressing Rejection | We cannot express exclusive falsity fully. | We must be able to express exclusive falsity. | Formal |
  | Rational Belief | It can be rational to believe a contradiction. | It is never rational to believe a contradiction. | About Method |
  | Logic's Primary Aim | To describe truth conditions accurately. | To regulate rational belief revision. | About Method |
  | Nature of Falsehood | Falsehood is compatible with truth. | Falsehood excludes truth. | Conceptual |

  Cruxes
  **1. The Expressibility of Exclusion**
  Can a logic that allows true contradictions express the thought that a sentence is *only* false? Camp A predicts no: any attempt to say "not true" will itself be subject to paradox, leading to a hierarchy or remainder. Camp B predicts yes: without this, we cannot guide action or reject errors. This is load-bearing because if Camp A cannot express exclusion, their logic cannot guide belief revision. Both agree the "Liar-like" sentence applied to the exclusion predicate tests this. Camp A predicts the exclusion predicate will fail to exclude gluts; Camp B predicts it succeeds but requires restricting self-reference.

  **2. The Usable Conditional**
  What must be given up to keep a usable conditional once paradoxes are admitted? To avoid triviality, either the rule detaching conclusions or the rule contracting premises must fail. Camp A prefers keeping detachment to preserve deduction, accepting that contracting premises is unsafe. Camp B prefers keeping contraction to preserve standard inference, accepting that detachment may fail in paradoxical contexts. This is load-bearing because it determines whether the logic supports standard mathematical proof. Both agree the paradox of self-referential implication is the test case. Camp A predicts contraction fails; Camp B predicts detachment fails or is restricted.

  **3. Normativity of Contradiction**
  Does accepting a contradiction violate a norm of rationality? Camp A says no: rationality requires accepting sound arguments, even if contradictory. Camp B says yes: rationality requires consistency in belief. This is load-bearing because it defines the role of logic in human life. Both agree that agents should avoid error. Camp A predicts that consistency norms are heuristic, not absolute. Camp B predicts that consistency norms are constitutive of belief. Settling this determines whether paraconsistency is merely instrumental or metaphysical.

  What is merely verbal
  We argue this is not merely verbal. The obvious candidate is the word "true." Camp A uses it to mean "correctly assertible even if contradictory"; Camp B uses it to mean "correctly assertible only if consistent." However, the disagreement extends beyond definition to normative commitment. If it were merely verbal, both sides could agree on the facts of usage and diverge only on labeling. Instead, they diverge on whether a rational agent should ever assent to a contradiction. This is a disagreement about the world (or truth-bearers), not just words. The expression "true" carries different inferential roles for each camp. Camp A infers "accept" from "true" even with negation; Camp B infers "reject" from "false" exclusively. Because these roles dictate different behaviors in paradoxical situations, the dispute is substantive.

  Conditions for signature
  **Dialetheist Camp**
  This exercise fails if the document implies that accepting contradictions is inherently irrational or a mistake to be repaired. We regard our position as refuted if it is shown that we cannot express the concept of exclusion without collapsing into triviality. Specifically, if we cannot formulate a predicate that excludes gluts without generating a new paradox, our claim to semantic closure is false. We also count it a refutation if classical logic is shown to be recoverable in full strength within inconsistent domains without restriction. We sign only if our view is presented as a stable, coherent alternative, not a deviation from a norm we reject.

  **Non-Dialetheist Camp**
  This exercise fails if the document implies that contradictions are truth-apt or that the Law of Non-Contradiction is false. We regard our position as refuted if it is shown that paraconsistent logic cannot regulate belief without accepting gluts. Specifically, if we cannot maintain a consistent truth predicate while retaining semantic closure, our instrumentalist view collapses. We also count it a refutation if rejecting explosion forces us to accept true contradictions. We sign only if our view is presented as preserving the normative force of logic, not merely managing inconsistency as a data error.

  Residual disagreement
  Once formal cruxes are settled, a metaphysical divergence remains. Camp A sees logic as descriptive of truth's structure; Camp B sees it as normative for belief. Outsiders should care because this determines how we build systems handling inconsistent data. If Camp A is right, AI must tolerate true contradictions. If Camp B is right, AI must flag them as errors. The residual disagreement is whether inconsistency is a feature of information or a bug. This affects law, science, and computing. It is not esoteric; it dictates whether we repair inconsistencies or accommodate them. Thus, the dispute matters for any domain relying on automated reasoning or formal verification of inconsistent theories.
