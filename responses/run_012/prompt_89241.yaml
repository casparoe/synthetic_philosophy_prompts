answer: |-
  Good evening, everyone. For those who don't know me, I'm [Name]. I'm [Uncle's Name]'s niece/nephew.

  Looking around this room, I see two different maps of the same coastline. On my left, I see family. You know him as the guy who smells like diesel on Sundays, the one who can't look at a sunset without checking the wind, the uncle who buys the best oysters at Christmas.

  On my right, I see the crew. The captains, the deckhands, the processors. You know him as the voice on the radio, the signature on the manifest, the guy who sat in the meetings where the numbers got crunched until they didn't make sense anymore.

  For thirty years, he stood right in the middle of those two groups. And if there is one thing he taught me, it's that you don't get to choose which version of the truth matters. You have to hold both of them.

  We all know why he's stepping down. We know the boats are quieter than they used to be. And I know my family wants to hear that this is because the world got greedy, or that a few bad apples ruined the barrel. It's a comforting story. It gives us someone to blame.

  But [Uncle's Name] wouldn't want me to tell you a comforting lie.

  He spent three decades explaining that the fishery isn't dying because anyone is greedy. It's dying because the water doesn't forgive hesitation. He used to say that any boat that holds back just feeds the next boat. If you show restraint, you get punished, one boat at a time. Restraint only pays off if everybody does it at once. And on the ocean, everybody never does it at once.

  So, we wrote rules. Quotas, gear limits, seasons. But as he'd tell you, those rules just pushed the same race up a level. It stopped being about who could find the fish, and started being about who could game the regulations.

  The brutal part, the part he'd want said out loud tonight, is that everybody in this room gets it. The captains know it. The regulators know it. The families know it. And yet, nothing changes. The trap stays shut.

  Some people might call that a failure. I think [Uncle's Name] would call it honesty.

  He didn't fix it. He's not a hero, and he'd punch me if I called him one. He was just the guy who kept the ledger honest while the tide was going out. He spent thirty years being the one to say the quiet part out loud, over and over, even when he knew the outcome wouldn't change. He managed the decline without losing his respect for the water or the people working it.

  To the family: He loves you, and he's looking forward to sleeping past 4 AM.
  To the crew: He knows what you carry, and he knows you're doing the best you can with the cards the water dealt.

  So, let's not drink to a solution. Let's drink to the work. Let's drink to the man who stood in the gap for thirty years, told the truth without flinching, and is finally ready to tie the boat up.

  To [Uncle's Name].
