      *   *Tension B (1 vs. 3):* Point 1 says Occam is a *theorem* (implying objectivity/necessity). Point 3 says "simpler" is relative to a coding convention (implying subjectivity/arbitrariness on finite data). If the constant swamps the signal, is it really a theorem about *the world* or just about *prefix codes*?
      *   *Tension C (5 vs. 6):* Point 5 says Compression = Truth-tracking. Point 6 says No-Free-Lunch (NFL). If the environment is adversarial or mismatched to the prior, compression might *not* track truth (overfitting noise that looks structured relative to the wrong UTM).
