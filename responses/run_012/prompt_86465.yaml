  ### Which Constructivist Are You? A Decision Tree

  You are standing at the entry point of a peculiar corridor. You have written code in continuation-passing style. You have caught exceptions to escape deep recursion. You have observed that `call/cc` allows you to produce a value of type `A` from a term of type `((A -> Void) -> Void)`. In logic, this is Double Negation Elimination. In your machine, it is control flow.

  This observation forces a fork. Does this make you relaxed about classical reasoning, because your hardware performs it? Or suspicious, because it arranges computations rather than describing values? Follow the questions below. Answer them as a programmer, not as a philosopher. There are seven questions. At the end, you will find your position.

  **Question 1: The Control Operator**
  When you use `call/cc` to satisfy a type `((A -> Void) -> Void) -> A`, do you possess a runtime value of `A`, or have you merely arranged for the program to continue as if you did?
  *   **I possess a value.** (Go to Question 2)
  *   **I have merely arranged the continuation.** (Go to Leaf 1)

  **Question 2: Existence and Computability**
  If your program proves that a number `n` exists satisfying a property `P`, must your program be able to return that specific `n`?
  *   **Yes, it must return the number.** (Go to Question 3)
  *   **No, it suffices that the number is determined by a rule.** (Go to Question 4)

  **Question 3: Markov's Principle**
  Suppose you have a decidable predicate on natural numbers. You know it is impossible that the predicate *never* holds. Does this mean you have found a number where it holds?
  *   **Yes, the search is effectively done.** (Go to Leaf 2)
  *   **No, knowing it doesn't diverge is not the same as halting.** (Go to Leaf 3)

  **Question 4: Choice Sequences**
  Consider an infinite sequence of natural numbers. Is it a fixed law (like a function in your code), or a free creation of the mind that unfolds over time?
  *   **A free creation, subject to continuity.** (Go to Question 5)
  *   **A fixed law or rule.** (Go to Question 5)

  **Question 5: Impredicativity**
  Can you define a set (or type) by quantifying over a collection that includes the set you are defining? (For example, defining a number by referencing the set of all numbers).
  *   **Yes, totalities are legitimate.** (Go to Question 6)
  *   **No, that is circular; build totals from the bottom up.** (Go to Question 7)

  **Question 6: The Axiom of Choice**
  If you have a collection of non-empty sets, can you pick an element from each? Is this a logical truth derived from the meaning of 'exists', or an extra assumption?
  *   **It is a theorem; 'exists' means I have a witness.** (Go to Leaf 4)
  *   **It is an axiom; I must assume I can pick.** (Go to Question 7)

  **Question 7: The Metatheory**
  When you prove that your constructive logic is sound, may you use classical logic to do so?
  *   **Yes, classical reasoning is fine for the outside view.** (Go to Leaf 5)
  *   **No, the study of construction must itself be constructive.** (Go to Leaf 6)

  ***

  ### The Leaves

  **Leaf 1: Constructivity as a Property of Proofs**
  *Path: Q1 (Arranged continuation)*
  You view logic as a description of what mathematicians do, not a ground for reality. Classical logic is acceptable provided proofs are annotated with computational content.
  *   **Awkward commitment:** You must accept that a proof of existence does not guarantee a runnable program without further translation.

  **Leaf 2: The Russian School**
  *Path: Q1 (Value) → Q2 (Return number) → Q3 (Search done)*
  You identify constructive existence with computability by a Turing machine. Mathematics is a branch of computer science.
  *   **Awkward commitment:** You must accept Markov's Principle, swallowing the idea that non-divergence implies convergence.

  **Leaf 3: Unoccupied (The Computabilist without Markov)**
  *Path: Q1 (Value) → Q2 (Return number) → Q3 (Search not done)*
  *   **Status:** Unattractive.
  *   **Reason:** If you demand a returned number but reject Markov's Principle, you have the strictness of the Russian school without its pragmatic bridge to classical analysis. Few stand here.

  **Leaf 4: Type-Theoretic Constructivism**
  *Path: Q1 (Value) → Q2 (Rule) → Q4 (Fixed law) → Q5 (Totalities) → Q6 (Theorem)*
  You work in a system where the Axiom of Choice is provable because existence data is carried in the type.
  *   **Awkward commitment:** You must treat the Axiom of Choice as a tautology, which can collapse distinct proofs into one another.

  **Leaf 5: Bishop-Style Constructivism (Classical Meta)**
  *Path: Q1 (Value) → Q2 (Rule) → Q4 (Fixed law) → Q5 (Totalities) → Q6 (Axiom) → Q7 (Classical Meta)*
  You want constructive analysis that looks like standard analysis, usable by classical mathematicians.
  *   **Awkward commitment:** You must tolerate using classical logic to justify a system that forbids it internally.

  **Leaf 6: Bishop-Style Constructivism (Constructive Meta)**
  *Path: Q1 (Value) → Q2 (Rule) → Q4 (Fixed law) → Q5 (Totalities) → Q6 (Axiom) → Q7 (Constructive Meta)*
  You want Bishop's analysis but insist the metatheory remains pure.
  *   **Awkward commitment:** You must accept that your position is nearly indistinguishable from Brouwerian Intuitionism, save for your rejection of choice sequences.

  **Leaf 7: Brouwerian Intuitionism**
  *Path: Q1 (Value) → Q2 (Rule) → Q4 (Free creation) → Q5 (Circular)*
  *Note: Brouwer rejects impredicative totalities, so Q5 leads here regardless of the 'Yes/No' split in the tree structure above, but logically Q5 'No' aligns best.*
  You believe mathematics is a languageless activity of the mind. Choice sequences are legitimate objects with their own identity conditions.
  *   **Awkward commitment:** You must accept the continuity principle, which implies all functions on real numbers are continuous, contradicting classical analysis.

  **Leaf 8: Unoccupied (The Impredicative Intuitionist)**
  *Path: Q1 (Value) → Q2 (Rule) → Q4 (Free creation) → Q5 (Totalities Yes)*
  *   **Status:** Incoherent.
  *   **Reason:** Brouwerian choice sequences rely on a temporal unfolding that is fundamentally incompatible with quantifying over completed, impredicative totalities.

  **Leaf 9: Predicativism**
  *Path: Q1 (Value) → Q2 (Rule) → Q4 (Fixed law) → Q5 (No totalities) → Q7 (Constructive Meta)*
  You refuse to quantify over totalities that are not yet built. You are safe from paradox but limited in scope.
  *   **Awkward commitment:** You must give up the least upper bound property for arbitrary sets of real numbers.

  **Leaf 10: Unoccupied (The Classical Predicativist)**
  *Path: Q1 (Value) → Q2 (Rule) → Q4 (Fixed law) → Q5 (No totalities) → Q7 (Classical Meta)*
  *   **Status:** Unexplored.
  *   **Reason:** Predicativism is almost exclusively pursued to avoid non-constructive commitments; using a classical metatheory defeats the motivation for most adherents.

  ***

  ### Confidence Assessment

  I am moderately confident in the tree as a whole, particularly in the distinctions drawn between the Russian, Bishop, and Brouwerian schools, as these are well-documented divergences in the literature of constructive mathematics. The mapping of the `call/cc` observation to the "Property of Proofs" leaf is also robust, reflecting the standard computational interpretation of classical logic.

  However, I am least sure of the distinction made between **Leaf 5 (Bishop with Classical Meta)** and **Leaf 6 (Bishop with Constructive Meta)**. In practice, Bishop himself was pragmatic about metatheoretical reasoning, and the boundary between a "Bishop-style constructivist who uses classical meta-reasoning" and a "Type-theoretic constructivist" can be porous. Splitting them into two leaves risks inventing a distinction that most practitioners would consider a matter of taste rather than a fundamental doctrinal fork. I have retained the split to meet the structural constraints of the tree, but flag it here as a point of potential overlap.
