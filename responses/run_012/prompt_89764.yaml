      *   *Refining the "Metaphysics" charge:* I need to address why it's not *just* tracking metaphysics. It's tracking the conditions for moral complaint.
      *   *Refining the Regulator point:* Make sure to distinguish between protecting interests vs. maximizing value.

      *   *Final Polish:* Ensure the distinction between "wrong" and "bad" is clear. The PAV allows that things can be bad without being wrongs.

      *   *Drafting text:*
      (Para 1) The difference is the availability of a complaint. In Case One, the child has a coherent grievance: "I am worse off than I would have been had you acted differently." In Case Two, the child cannot coherently claim they are worse off, because the alternative was their own non-existence. This isn't just metaphysical bookkeeping; it's about the structure of moral accountability. Morality, on my view, is a system of claims that persons have against one another. If there is no subject who is disadvantaged by the action compared to their baseline, there is no victim, and without a victim, there is no wrong. The metaphysics matters because the subject of the harm must be the same subject across the comparison. You cannot compare the welfare of Person A to the non-existence of Person A; you can only compare Person A's welfare to Person A's welfare in another scenario.

