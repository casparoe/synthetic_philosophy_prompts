      *   *Step 4:* A compound name ("White Horse") has a narrower extension than the head noun ("Horse").
      *   *Step 5:* The pragmatic test: Requesting a "horse" allows yellow/black; requesting a "white horse" excludes them. Therefore, the *conditions for satisfaction* differ.
      *   *Step 6:* "White Horse" and "Horse" are not the same name/range.
      *   *Step 7:* Conclusion: "A white horse is not a horse."
