      *   Step 6 talks about *names* (intension/extension of terms). Step 7 talks about *things* (ontology).
      *   Even if the *concept* WHITE HORSE is not identical to the *concept* HORSE, the *object* that falls under WHITE HORSE still falls under HORSE.
      *   The user's Step 5 is the strongest pragmatic point (seeking a horse vs. seeking a white horse), but it proves difference in *demand*, not difference in *ontology*.
