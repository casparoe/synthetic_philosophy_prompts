      *   **The Ambiguity:** It's not just "is." It's the shift from *Ming* (Name/Concept) to *Shi* (Actuality/Object). Step 6 is about *Ming*. Step 7 is about *Shi*.
      *   **Price:** If we reject 7, we save common sense but lose the radical metaphysical punch. However, we save the semantic insight (intensionalism).

