answer: |-
  This is an exceptionally clear reconstruction of the *Bai Ma Lun* (White Horse Dialogue). You have correctly identified that the argument's power lies in its semantic precision (steps 1–6) and its absurdity lies in its ontological overreach (steps 7–9). You are also right to feel that simply waving at the ambiguity of "is" (*fei*) is insufficient, because Gongsun Long (the Advocate) is explicitly arguing about *ming* (names) and their function, not merely playing on grammatical copulas.

  Here is the diagnosis you requested.

  ### 1. The Diagnosis: Where to Break the Chain

  **You must reject the inference from Step 6 to Step 7.**

  Step 6 is defensible within the Advocate's framework: "White horse" and "horse" are not the same *name*, and they do not have the same *range* (extension). The intension of the compound name is distinct from the head name.

  Step 7, however, makes an illicit ontological leap. It moves from a claim about **names** ("White horse" and "horse" are not the same name) to a claim about **objects** ("A white horse is not a horse").

  **Why it looked acceptable:**
  It looked acceptable because the dialogue is framed as a dispute about *naming* (*ming*). In the School of Names, there is a tight coupling between the rectification of names and the ordering of reality (*shi*). The Advocate relies on the intuition that if two names are not interchangeable in a request (Step 5), they must pick out fundamentally different kinds of being. The slide from "The name 'white horse' is not the name 'horse'" to "The object *white horse* is not a *horse*" feels natural if one assumes a strict isomorphism between language and reality (a key tenet of the *Ming Jia*).

  **The Specific Ambiguity You Missed:**
  You noted you avoided the ambiguity of "is not" by focusing on the "work a name does." However, the ambiguity survives in the **subject of the sentence** in Step 7.
  *   In Steps 1–6, the subject is the **Name** ("White horse" does not do the work of "horse").
  *   In Step 7, the subject becomes the **Object** ("A white horse is not a horse").

  The argument proves that the *concept* WHITE HORSE is not identical to the *concept* HORSE. It does not prove that an object falling under the concept WHITE HORSE fails to fall under the concept HORSE. Step 7 conflates **Conceptual Distinctness** with **Class Exclusion**.

  ### 2. The Price of Alternatives

  **Option A: Reject Step 7 (The Semantic Repair)**
  *   **The Cost:** You lose the shocking metaphysical conclusion. The dialogue ceases to be a paradox about reality and becomes a technical lesson in semantics (intension vs. extension).
  *   **The Gain:** You save the text from absurdity (Step 9) and preserve the insight in Steps 1–5. You retain the pragmatic truth that "requesting a horse" and "requesting a white horse" are different speech acts with different satisfaction conditions.
  *   **Verdict:** This is the philosophically honest price. The text remains a sophisticated analysis of modification and reference, rather than a denial of taxonomy.

  **Option B: Keep Step 7, Reject Step 1 (The Common Sense Repair)**
  *   **The Cost:** You must deny that "white" and "horse" do different work. You have to claim that adding a modifier does not restrict the range or change the name's function. This destroys the distinction between simple and compound terms.
  *   **The Gain:** You save the ordinary truth that a white horse is a horse.
  *   **Verdict:** This is too high a price. Step 1 is intuitively correct and logically sound. Giving it up destroys the nuance of language.

  **Option C: Accept Step 9 (The Skeptical/Nominalist Route)**
  *   **The Cost:** You accept that nothing is ever what it is called. Language is fundamentally disconnected from reality.
  *   **The Gain:** You maintain logical consistency within the Advocate's radical framework.
  *   **Verdict:** This renders communication impossible. It is a *reductio ad absurdum* of the Advocate's own premises, not a viable philosophy.

  ### 3. What Survives of the Advocate's Thesis?

  Once you excise Step 7, does anything substantive survive, or is it pure sophistry?

  **Substance Survives:** The dialogue is not mere sophistry if read as a claim about **Names**, not Animals.
  The Advocate's substantive thesis is that **compound names are not synonymous with their heads.** This is a claim about **compositionality**.
  *   "Horse" names a shape-class.
  *   "White Horse" names a shape-colour intersection.
  *   Because the conditions for applying the names differ, the names are not interchangeable *salva veritate* in all contexts (specifically, contexts of request or definition).

  If we read the conclusion "A white horse is not a horse" as shorthand for "The designation 'white horse' is not equivalent to the designation 'horse'," the thesis is a robust contribution to the philosophy of language. It anticipates the distinction between sense (intension) and reference (extension). The "sophistry" arises only when the Advocate insists that this linguistic non-identity entails ontological exclusion.

  **Which reading has to go?**
  The **claim about animals** (ontology) must go. The **claim about names** (semantics) stays. The dialogue is a warning against conflating the map with the territory. When the Advocate says "A white horse is not a horse," he should be understood as saying "The category 'white horse' is not co-extensive with the category 'horse'." If he means "This animal here is not a member of the species horse," he is wrong.

  ### 4. The Companion Thesis: Hard and White (*Jian Bai Lun*)

  Does the same diagnosis dispose of the *Hard and White* dialogue?

  **Yes, the same diagnosis applies, but the mechanism is slightly different.**

  In *Hard and White*, Gongsun Long argues that because you perceive whiteness with the eye and hardness with the hand, and the senses do not overlap, "hard" and "white" are separate universals (*zhi*) that exist independently of the stone. He concludes the stone is not "one" thing but a locus for separate universals.

  **The Shared Error:**
  The shared error is the **Reification of Distinctions in Perception/Conception into Distinctions in Being.**
  *   In *White Horse*: A distinction in **Naming** (Compound vs. Simple) becomes a distinction in **Object** (White Horse vs. Horse).
  *   In *Hard and White*: A distinction in **Perception** (Sight vs. Touch) becomes a distinction in **Entity** (Whiteness vs. Hardness).

  In both cases, the Advocate takes a feature of the *subject's access* to the world (language or sense modalities) and projects it onto the *object itself*.
  *   Just because the name "White Horse" is distinct from "Horse" doesn't mean the animal is excluded from the class Horse.
  *   Just because "Hard" is perceived differently from "White" doesn't mean they are not co-instantiated in the same Stone.

  **The Difference:**
  *   *White Horse* is a logical error regarding **class inclusion** (confusing intensional difference with extensional exclusion).
  *   *Hard and White* is a metaphysical error regarding **universals** (confusing epistemic separation with ontological separation).

  **Conclusion on *Hard and White*:**
  If you apply the repair used for *White Horse* (separating the mode of access/naming from the object accessed/named), the *Hard and White* thesis also collapses. The stone can be one object that possesses multiple properties, even if those properties are accessed via different cognitive or sensory channels. The "two-ness" belongs to the *concepts* Hard and White, not to the *stone*.

  ### Summary for your Formalization

  To save your formalization while preserving the insight:

  1.  **Keep Steps 1–6.** They are a brilliant analysis of intension and modification.
  2.  **Modify Step 7.** Change "So a white horse is not a horse" to "So the name 'white horse' is not equivalent to the name 'horse'."
  3.  **Discard Step 9.** It follows only if you accept the ontological slide in Step 7.
  4.  **Diagnosis:** The error is the **Name-Actuality Slide**. The Advocate proves a thesis about *Ming* (Names) and illegitimately applies it to *Shi* (Actuality/Objects).

  The dialogue survives not as a paradox of reality, but as a paradox of reference: **How can a specific be the same as a general, when the conditions for their use differ?** That is a question that remains live in philosophy today.
