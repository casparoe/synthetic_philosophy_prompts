  ### Summary for Grading Defense

  If the student contests the grade, your defense rests on two technical pillars that are standard in upper-level metaphysics:

  1.  **Bivalence vs. LEM:** The student claimed Supervaluationism is bivalent. It is not. It is non-bivalent (it allows gaps) but classical regarding tautologies (LEM holds). This is a definitional error regarding the logic of the view. (Deduction: 2 points in Part a).
  2.  **The Existential Commitment:** The student claimed Supervaluationism renders the "sharp boundary exists" sentence false. It renders it *supertrue*. This is the single most discussed technical result of Supervaluationism (often called the "price" of the view). Getting this wrong indicates the student does not understand how the view handles the Sorites conclusion. (Deduction: 4 points in Part b).

