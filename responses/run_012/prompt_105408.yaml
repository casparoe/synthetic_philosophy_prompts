answer: |-
  Here is the specification for a viable global history, followed by the analysis of your friend's triad.

  ### The Spec: Desiderata for Global History

  To count as a rigorous global history rather than a disguised regional one, a narrative must satisfy the following cases, distinctions, and constraints.

  **1. The Cases It Must Get Right**
  *   **The Great Divergence:** It must explain *why* industrialization concentrated in Northwest Europe without treating it as inevitable or morally superior.
      *   *Why:* Ignoring this denies the material reality of the last 200 years. Treating it as inevitable is teleological fiction. A good history treats it as a contingent outcome of specific ecological, financial, and geopolitical pressures (e.g., coal proximity, access to New World land), not cultural destiny.
  *   **1492 / The Columbian Exchange:** It must treat this as a biological merger of hemispheres, not a "discovery."
      *   *Why:* 1492 is the hard anchor of modern globalization. If you center the *voyage*, it's Eurocentric. If you center the *biological exchange* (disease, crops, silver), it is a systemic shock that affected China (silver inflation), Africa (demographics), and the Americas (collapse) equally.
  *   **Pre-Modern Trade Networks (Indian Ocean/Silk Road):** It must demonstrate high-volume connectivity prior to European dominance.
      *   *Why:* This disproves the "fragments" argument. If the Indian Ocean was a cohesive trade zone managed by Arab, Indian, and Chinese merchants in 1200, the world was already connected without Europe. This validates global history as a study of *systems*, not just European expansion.
  *   **Non-European Polities (Song China, Inca, Mali):** It must treat these as complex states with internal logic, not as scenery for European arrival.
      *   *Why:* If you only mention the Inca when Pizarro arrives, you are writing European history. If you explain the Inca road system or tax economy on its own terms, you prove that "history" was happening elsewhere independently.

  **2. The Distinctions It Cannot Collapse**
  *   **Pivotal vs. Moral:** It must distinguish between an event that changed the system (smallpox) and an event that was morally significant (human rights).
      *   *Why:* Germs killed more people than generals. A history that prioritizes moral narratives over demographic realities fails to explain why the world looks the way it does. Impact is not virtue.
  *   **Source vs. Amplifier:** It must distinguish who invented a technology vs. who scaled it globally.
      *   *Why:* Gunpowder is Chinese; the global military-fiscal state that weaponized it was largely European. Confusing origin with diffusion erases the specific mechanisms of power. You can credit China with the invention and Europe with the globalization without contradiction.
  *   **Connection vs. Homogenization:** It must show how regions linked up without assuming they became the same.
      *   *Why:* Trade creates interdependence, not cultural identity. India and Britain were economically fused in 1900 but remained culturally distinct. Collapsing this leads to the error of assuming globalization means Westernization.

  **3. Hard Constraints**
  *   **No Teleology:** You cannot write backwards from the present.
      *   *Why:* If you start with "Why does the West rule?" you will inevitably find reasons the West rules. You must start with "What were the constraints in 1000 CE?" and follow the path forward. This prevents the "ancient/medieval/modern" periodization from forcing European timelines onto Asian or African histories.
  *   **Endogenous Periodization:** Period breaks must be justified by local or systemic shifts, not European dynasties.
      *   *Why:* The "Middle Ages" is a European concept. Applying it to Japan or Peru imposes a European rhythm of time. A global history uses periods defined by trade cycles, climate shifts, or pandemic waves that affect multiple regions simultaneously.

  ***

  ### The Triad Analysis: Can Your Friend's Three Demands Coexist?

  Your friend wants:
  (a) No event or region gets privileged by default.
  (b) You can still say some things mattered more than others.
  (c) It still has to read as one connected story.

  **You are right: These three cannot be held simultaneously without modification.**

  The conflict lies between **(a)** and **(b)**.
  If you enforce (a) strictly (methodological symmetry), you cannot satisfy (b) (empirical asymmetry). In the 19th century, London *did* matter more to the global system than Lima. If you give them equal narrative weight to satisfy (a), you violate (b) by obscuring where power actually sat. If you acknowledge London's dominance to satisfy (b), you violate (a) by "privileging" a region.

  **Where the Trade-off Sits:**
  The trade-off is between **Equality of Focus** and **Explanation of Power**.
  *   To keep (b) and (c), you must drop strict (a). You cannot treat all regions as equal *at all times*.
  *   **The Solution:** Privilege must be **temporal and functional**, not cultural. In 750 CE, Baghdad gets the narrative privilege. In 1250 CE, Hangzhou gets it. In 1850 CE, London gets it.
  *   This satisfies (b) because you acknowledge the center of gravity shifted. It satisfies (c) because you track the shift of that gravity as one story. It modifies (a) to mean "No region is privileged *forever*," rather than "No region is privileged *ever*."

  **The Collapse Point:**
  Which requirement, if dropped, makes the most attempts fall apart?
  **Connectivity (c).**
  If you drop the requirement for a single connected story, you immediately validate your friend's critique: you are left with "a pile of disconnected regional stories." Comparative history is not global history. Without the demand to trace the *links* (trade, disease, climate, migration) that bind the regions, the project ceases to be global history and becomes a library of separate national histories.

  However, the requirement that makes attempts *fail morally and analytically* is **(b) Hierarchy of Importance**. Most attempts at "non-Eurocentric" history fail because they try so hard to be fair (a) that they refuse to admit asymmetry (b). They end up claiming the world was multipolar when it was actually hegemonic. That destroys explanatory power.

  But strictly speaking, without **Connectivity**, the genre doesn't exist.

  ***

  Verdict: Trace causal links
