answer: |-
  **Framing**
  The standard objection to epiphenomenalism is that if experiences don't cause our reports, our claims about them are mere coincidences. Our guest argues this assumes a causal model where none is needed. He proposes instead that shared neural causes secure reliability and that experience partly constitutes judgment.

  **The common cause reply**

  1. You argue that the reliability of our judgments is underwritten by a shared physical base rather than a causal link from experience to judgment. But in epistemology, reliability usually matters because it tracks truth via a specific mechanism; if the experience is not part of that mechanism, what specific epistemic work is the experience doing rather than just the neural state?
  [Follow-up: If he says the experience provides the "content" or "truth-maker," ask whether a neural state alone could not have provided that same content without the extra ontological cost.]

  2. Suppose the neural common cause fires in the absence of any experience, as a zombie case suggests is conceivable: is the resulting judgment false, unjustified, or merely ungrounded, and why does accepting this outcome not simply relocate the paradox from "why does experience cause judgment?" to "why does the neural state cause both matching experience and judgment?"
  [Follow-up: If he says the judgment is false, ask why the presence of experience in the actual case makes it true if the causal production of the judgment is identical in both cases.]

  3. You concede that your view cannot explain why the correlation between neural states and experiences holds rather than not, but claim no one else can either. However, if the neural state is sufficient to produce the judgment, doesn't positing an inert experience violate a principle of parsimony that your rivals do not violate?
  [Follow-up: If he says parsimony doesn't apply to conscious experience, ask whether there is any empirical evidence that could ever count against his view if the neural correlates remain fixed.]

  **Constitution and the first person**

  1. You hold that in the first-person case, the experience partly constitutes the judgment, closing the gap between them. If the experience is a constituent of the judgment, is it possible for me to be mistaken about having that experience, or does this view commit you to a strong infallibility about current conscious states?
  [Follow-up: If he says infallibility holds, ask how he accounts for cases where subjects misclassify their experiences, such as confusing pain for itch, without abandoning the constitution claim.]

  2. Critics will argue that a constitutive relation that does epistemic work—making the judgment justified or accurate—is indistinguishable in practice from a causal relation. How do you distinguish constitution from causation without simply relabeling the causal link you deny?
  [Follow-up: If he says constitution is metaphysical rather than causal, ask whether a metaphysical dependence that ensures truth isn't functionally equivalent to causation for the purposes of the paradox.]

  3. You liken your position to externalist theories of content regarding ordinary perception, suggesting a double standard if one is accepted and the other rejected. But externalism usually relies on a causal history linking subject to object; if you remove the causal link here, what remains of the analogy that does the heavy lifting?
  [Follow-up: If he says the structural relation is what matters, ask whether structure alone without causal transmission can genuinely support an epistemic claim.]

  **The cost**

  1. In clinical settings, we distinguish between authoritative reports of experience and those we treat as confabulated, often based on whether the experience caused the report. If experiences are causally inert, what marker distinguishes a genuine report from a confabulation on your view?
  [Follow-up: If he says the neural signature differs, ask whether the experience itself is then redundant to the distinction we care about.]

  2. Name the single strongest consideration against your view and say what specific evidence would change your mind.
  [Follow-up: If he says nothing would change his mind because it is conceptual, ask whether holding a view immune to evidence renders it a philosophical thesis or a definition.]

  **The last word**

  1. Once the standard objection about causal inertness is set aside, what is the dispute over epiphenomenalism really about in one paragraph?
  [Follow-up: If he says it is about metaphysics, ask whether a metaphysics that severs experience from agency is worth the price of saving it from physical reduction.]
