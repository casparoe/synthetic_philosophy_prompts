answer: |-
  # DECISION TREE: PRACTICAL REASON IN TIES

  **Starting Commitment:** The agent faces two options which, on the best account she can give, are equally worth choosing.

  **Node 1 [Normative]:** In the **Job Offers (b)** case, is the agent's lack of preference due to *motivational indifference* (she does not care) or *normative symmetry* (there is no fact about which is better)?
  *   **Motivational Indifference:** Go to Node 2.
  *   **Normative Symmetry:** Go to Node 3.

  **Node 2 [Normative]:** If motivational, in **Job Offers (b)**, is the agent making a mistake about her own desires?
  *   **Yes (Mistake):** Go to Node 10.
  *   **No (No Mistake):** **Leaf 1**.

  **Node 10 [Normative]:** If a mistake, must the agent seek more information before choosing?
  *   **Yes:** **Leaf 9**.
  *   **No:** **Leaf 10**.

  **Node 3 [Normative]:** If normative, in **Buridan's Ass (a)**, is starvation a rational requirement when reasons are balanced?
  *   **Yes:** **Leaf 2**.
  *   **No:** Go to Node 4.

  **Node 4 [Empirical]:** If not required, can the will initiate motion without a preponderant reason?
  *   **No:** **Leaf 3**.
  *   **Yes:** Go to Node 5.

  **Node 5 [Normative]:** If the will can move, in **Job Offers (b)**, does tossing a coin add rationality compared to picking arbitrarily?
  *   **Yes:** **Leaf 4**.
  *   **No:** Go to Node 6.

  **Node 6 [Normative]:** If arbitrary picking is permitted, in **Pharmacy (d)**, does the fact that this choice sets a precedent make it impermissible?
  *   **Yes:** **Leaf 5**.
  *   **No:** Go to Node 7.

  **Node 7 [Normative]:** If no precedent constraint, in **Promise (f)**, does a prior casual promise count as a decisive reason to break the tie?
  *   **Yes:** **Leaf 6**.
  *   **No:** Go to Node 8.

  **Node 8 [Normative]:** If no prior reason, in **Transformative (e)**, does the act of choosing itself settle the worth of the options?
  *   **Yes:** **Leaf 7**.
  *   **No:** Go to Node 9.

  **Node 9 [Normative]:** If worth is independent, in **Two Strangers (c)**, are the claims of the strangers *equal* or *incomparable*?
  *   **Incomparable:** **Leaf 8**.
  *   **Equal:** Go to Node 11.

  **Node 11 [Normative]:** If equal, is the agent permitted to choose *without excuse* or only *with an excuse*?
  *   **Without Excuse:** **Leaf 11**.
  *   **With Excuse:** **Leaf 12**.

  ***

  **Leaf 1: Subjectivist.**
  Awkward Commitment: Rationality depends on fleeting moods rather than objective value.
  Case Verdict: The agent may simply accept the job she happened to be looking at.

  **Leaf 2: Rational Stasis.**
  Awkward Commitment: Agents are required to remain inactive rather than act arbitrarily.
  Case Verdict: The ass starves because moving would be irrational.

  **Leaf 3: Determinist.**
  Awkward Commitment: Human action is physically impossible without a determining cause.
  Case Verdict: The ass moves only if a physical impulse breaks the symmetry.

  **Leaf 4: Proceduralist.**
  Awkward Commitment: Rationality requires an external randomizer rather than internal will.
  Case Verdict: The agent must toss a coin to choose the job permissibly.

  **Leaf 5: Policy-Bound.**
  Awkward Commitment: Present permissibility is held hostage by future administrative consistency.
  Case Verdict: The pharmacist cannot choose arbitrarily because it sets a bad rule.

  **Leaf 6: Prior Commitment.**
  Awkward Commitment: A trivial past promise outweighs present normative symmetry.
  Case Verdict: The agent must keep the casual promise despite the tie.

  **Leaf 7: Voluntarist.**
  Awkward Commitment: Value is created by choice rather than discovered by reason.
  Case Verdict: The choice makes the transformative option the right one.

  **Leaf 8: Tragedy.**
  Awkward Commitment: Some moral conflicts have no rational resolution.
  Case Verdict: Saving either stranger leaves a moral remainder or wrong.

  **Leaf 9: Investigator.**
  Awkward Commitment: Agents must delay action indefinitely to hunt for hidden reasons.
  Case Verdict: The agent cannot choose the job until she finds a differentiating fact.

  **Leaf 10: Introspectionist.**
  Awkward Commitment: Agents have infallible access to their own motivational states.
  Case Verdict: The agent chooses the job based on a revealed hidden desire.

  **Leaf 11: Libertarian.**
  Awkward Commitment: The will is a source of reasons independent of value.
  Case Verdict: The agent may save either stranger without further justification.

  **Leaf 12: Excuse Theory.**
  Awkward Commitment: Permissible acts can still constitute a normative failure.
  Case Verdict: The agent saves one stranger but owes an apology to the other.

  ***

  ### UNOCCUPIED COMBINATIONS

  **The Rational Indeterminist.** This position holds that starvation is not required (Node 3) but the will cannot move without a reason (Node 4). It is diagnosed as **incoherent**: it demands action while denying the physical capacity for it.

  **The Precedent Voluntarist.** This position holds that choice creates value (Node 8) but precedent constrains the choice (Node 6). It is diagnosed as **unattractive**: it asserts value is created by the agent while simultaneously being bound by external policy.

  **The Excuse Investigator.** This position holds that the agent must seek information (Node 10) but acts only with an excuse (Node 11). It is diagnosed as **unexplored**: it combines epistemic diligence with normative pessimism in a way few theorists motivate.

  ### INSEPARABLE LEAVES

  **Leaf 3 (Determinist) and Leaf 2 (Rational Stasis).** Both result in the ass not moving by its own volition. The tree cannot separate them because it treats the *outcome* (stasis) as identical. A further case involving *external nudging* would separate them: the Determinist moves when nudged; the Rational Stasis position might still forbid it.

  **Leaf 1 (Subjectivist) and Leaf 10 (Introspectionist).** Both allow arbitrary-looking choice based on internal states. The tree cannot separate them because both locate the reason in the agent's psychology. A case involving *self-deception* would separate them: the Introspectionist forbids choice under deception; the Subjectivist permits it.

  ### TREE MISFIRES

  **Node 4 (Empirical).** This node does real work only if one believes metaphysics constrains rationality. For most normative theorists, whether the will *can* move is irrelevant to whether it *may*; this node decorates a distinction the leaves (3 and 5) do not strictly need.

  **Node 6 (Precedent).** This node risks conflating first-order practical reason with second-order administrative rule. It misfires if the reader views the Pharmacy case as fundamentally about *aggregation* rather than *precedent*, which would require a different branching question.

  **Node 9 (Equality vs. Incomparability).** This node assumes the reader can distinguish equality from incomparability in the **Two Strangers** case. If the reader believes the distinction is merely verbal, this node decorates a distinction the leaves (8 and 11) do not need, as both face a choice without a decisive reason.
