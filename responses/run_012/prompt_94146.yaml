answer: |-
  Good evening. Thank you for the privilege of standing here.

  Look around the room. We have wine in the glasses, plates still making the rounds, and a mix of people that doesn't often sit at the same table. To my right, a High Court judge. To my left, a consultant anaesthetist. At the top table, families who have lost people to violence. And scattered through the rest, colleagues who have spent thirty years arguing about whether the state should ever kill a citizen, and colleagues who think sometimes it must.

  We are here to celebrate the Bar, but I want to talk about a bill currently making its way through Parliament. You know the one. It doesn't bring back the hangman. It proposes something newer, cleaner. For prisoners on whole-life orders, it offers a 'voluntary judicial death'. A written request, a medical procedure, no pain, safeguards piled high. It is being sold as mercy. It is being sold as autonomy. And I have heard some of my oldest friends, staunch abolitionists, nodding along. They say: if the suffering is inevitable, why prolong it?

  I want to suggest that this is a trap. And to explain why, I want to borrow the engine of a famous argument against the death penalty, without getting bogged down in the text of it. There was a great essay written decades ago, by a French writer, against the guillotine. We often remember it as a plea against pain. We think the argument was: hanging hurts, shooting hurts, so let's not do it.

  But if you read that writer closely, the physical pain wasn't the heart of it. The horror was the premeditation. The horror was the state scheduling a death, cooling its heels while the clock ticks down, and then going home to dinner afterwards. The wrong wasn't just that the prisoner suffered; it was that the state claimed the authority to decide that a life should end, coldly, deliberately, as an administrative act.

  If that is the core of the objection—and I believe it is—then this new bill does not solve the problem. It perfects it.

  By making it painless, the bill removes the physical agony. But by making it judicial, it retains the state's claim on the citizen's life. It turns the state from a jailer into a service provider for death. It says: we have the power to keep you until you rot, but if you ask nicely, we have the power to end you too. It sanitises the killing. It makes it bureaucratic. And I would argue it makes it more dangerous, not less, because it removes the visceral horror that currently checks our power.

  To my left, the anaesthetist. You hear 'no pain' and think of your oath. But medicine is not just about the absence of pain; it is about the purpose of the act. Administering a drug to end a life because the state has authorised it is not healing. It is execution with a syringe. It asks you to be the instrument of a judicial sentence, not a doctor treating a patient.

  To my right, the Judge. You know the weight of sentencing. You know that when we pass a whole-life order, we are saying society must be protected, or justice demands confinement. We are not saying, 'You should be dead.' If we add a clause that says, 'But you can ask us to kill you,' we blur the line between punishment and euthanasia. We make the court a gateway to death. That is not a power the judiciary should hold.

  And to the families at the top table. I know there is no comfort I can offer you tonight. Your loss is absolute. But justice is not balanced by adding more death to the scale. Whether it is forced or requested, state killing changes us. It tells us that some lives are disposable. That is a message that harms all of us, not just the prisoner.

  To my colleagues who think this is defensible: I know you are motivated by kindness. You look at the man in the cell, knowing he will never walk free, and you think, 'Let him out of his misery.' But do not let compassion blind you to the principle. If we accept that the state can kill when it is convenient, when it is requested, when it is 'humane', we lose the absolute barrier that says the state does not kill its own. Once that barrier is breached for the willing, how long before it is argued for the unwilling? How long before 'mercy' becomes 'efficiency'?

  The French writer argued that the death penalty corrupts the society that uses it. It coarsens us. This bill offers us a way to kill without getting our hands dirty. It offers us a clean conscience for a bloody act. We should refuse it.

  We should defend the principle that the state's power over the citizen ends at confinement. It does not extend to extinction. Even when asked. Especially when asked. Because if we cannot say 'no' to a prisoner begging for death, we have admitted that we believe some people are better off dead. And once we admit that, we are no longer the guardians of justice. We are just the managers of endings.

  So, let the bill fail. Not because we lack mercy. But because we value something higher than a painless death. We value a state that does not kill. Let us keep our hands clean, not by finding a cleaner way to kill, but by refusing to kill at all.

  Thank you.

