answer: |-
  Good evening. For those who don't know me, I'm [Name], [Sister]'s sibling.

  Looking around this room, I see two distinct languages being spoken. On one side, I see family who hold marriage as a sacred order, a structure designed for family and future generations. On the other, I see friends who worry that defining marriage confines the freedom of love. I know these views don't perfectly overlap. I'm not standing here to reconcile theology or philosophy. I'm standing here to talk about what I have seen with my own eyes.

  Let's assume, for the sake of argument, that the elders are right: that marriage is ordered toward building a legacy. Even on that map, the terrain [Sister] and [Partner] are walking is solid. Because a legacy isn't built on grand intentions; it's built on the quiet capacity to show up.

  I remember last November. [Sister] had the flu, the kind that leaves you shaking on the bathroom floor. [Partner] didn't make a speech about commitment. They just sat on the edge of the tub, holding a cool cloth, staying there until the shaking stopped. Or consider Sunday mornings in their kitchen. There is no performance there. Just coffee, the newspaper, and a silence that isn't empty, but full.

  To our parents and elders: You value stability, sacrifice, and generativity. You see those virtues here. To the friends: You value authenticity, presence, and choice. You see those virtues here, too.

  Whatever the institution of marriage is *for*, these are the bricks that make a marriage *good*. Definitions don't make a union real; fidelity does. Promises don't make a marriage holy; keeping them does.

  So, I want to be clear. This is not a rehearsal. This is not an approximation waiting to become the real thing. This is the real thing. Whatever you believe marriage is supposed to be, this is it. They are building a life where two people become one flesh not by erasing themselves, but by weaving themselves together, thread by thread, day by day.

  So please, raise your glasses.

  To the life they are building, day by day, together.

  ***

  The pivot happens when I shift from debating the purpose of the institution to observing the virtues of the practice.
