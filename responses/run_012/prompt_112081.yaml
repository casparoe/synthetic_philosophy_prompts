  ok so for my philosophy club i have to make up a thought experiment and i keep getting stuck, so i'm outsourcing. the topic is the special composition question — you know, when do a bunch of little things actually add up to one bigger thing? like is there really a chair there or just atoms arranged chairishly, that kind of thing.

  heres what i want. i want a pair of cases that are as close to identical as possible except for one thing, and that one thing has to be the thing that makes the difference between "yes, theres one object here" and "no, theres just a bunch of objects here" for the view that says things only compose something new when they add up to a life (a living thing). but for the other two views — the one that says any bunch of things whatsoever composes a new thing, and the one that says nothing ever composes anything, its all just particles — i want both of those views to give the exact same answer in both cases, so the flip only happens for the life view. that way you can see exactly which feature is doing the work.

  constraints cause otherwise its too easy: no science fiction, no brains in vats, no teleporters, no weird physics. it has to be stuff you could actually point at — like in a kitchen, a garden, a hospital, a fish tank, whatever. no fair using "and then it dies" as the variable either, i want the variable to be something you can see. also dont make it a person, thats cheating cause then everyone argues about whether people are special. one paragraph each for the two cases, then the analysis.

  after the two cases, do the check: for each of the three views, say what it says about case A and case B and why, and then tell me straight which feature is actually doing the work and whether its the same feature for all three views or not. then the honest bit: what happens if you remove that feature, does the case collapse back into the boring version, and how would someone who believes the life view fight back and say my cases rigged it or that the verdicts dont really come from their view? and at the end tell me which of the three views comes out looking dumbest in my cases and why, cause thats the whole point of the assignment basically.

  btw if you think my whole setup is impossible (like theres no way to make the variable flip only the life view without sneaking in something else) then say so and explain why, dont just fake it. i'd rather know.
