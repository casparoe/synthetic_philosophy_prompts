  **Case A**
  On a sunlit kitchen shelf sits a potted pothos vine. Its cells are actively dividing, drawing water up through the stem to unfurl a small, bright green new leaf at the tip of one strand. The particles making up the vine are engaged in homeostasis and metabolic repair; if you cut a stem, it bleeds sap and can grow roots. The arrangement of atoms here is dynamic, self-maintaining, and directed toward the survival of the organism. You can point to the vine and watch it change shape slightly over the course of a week as it grows toward the light.

  **Case B**
  On an identical shelf right next to it sits a high-quality silk imitation of the same pothos vine. It is made of plastic and fabric particles arranged in the exact same shape as the living vine, including a small, unfurled leaf at the tip that looks identical to the real one. However, the particles are static; there is no water uptake, no cell division, and no metabolic repair. If you cut a stem, no sap emerges, and it cannot grow. The arrangement is fixed by glue and manufacturing rather than internal biological processes, and it will not change shape over time unless moved by an external force.

  **Analysis**
  For **Universalism**, both Case A and Case B yield the same answer: "Yes, composition occurs." Since Universalism holds that any collection of particles composes an object, the presence or absence of life is irrelevant; both the living vine and the silk vine are objects. For **Nihilism**, both cases also yield the same answer: "No, composition never occurs." Since Nihilism denies that parts ever compose wholes, neither the living vine nor the silk vine is a true object; both are just particles arranged vine-wise. For the **Life View (Organicism)**, the verdicts flip: Case A is "Yes" because the activities of the parts constitute a life, while Case B is "No" because the parts are merely arranged together without biological unity. The feature doing the work is **metabolic activity/self-maintenance** (visible as growth and repair). This feature is *not* the same for all three views; it is the sole determinant for the Life View, while Universalism and Nihilism ignore it completely due to their absolute rules.

  **The Honest Bit**
  If you remove the feature (e.g., by making both cases dead plants or both cases living clones), the contrast collapses and the Life View gives the same verdict for both, defeating the purpose of the thought experiment. A proponent of the Life View might fight back by claiming the cases are rigged because "life" isn't just visible growth but involves a specific kind of causal unity that isn't fully captured by looking at a leaf unfurl; they might argue you're smuggling in "functional integration" rather than pure "life." Alternatively, they might argue that the silk vine *does* compose an object, just not a *living* one, but that violates the strict Organicism rule that composition *only* occurs with life. In these cases, **Universalism** comes out looking the dumbest. While Nihilism is counterintuitive for denying the living vine exists, Universalism is ontologically wasteful, insisting that the silk plant is just as much a genuine object as the living one, thereby failing to distinguish between a self-sustaining entity and a mere lump of plastic, which seems to miss the whole point of asking what makes a "thing" a thing.
