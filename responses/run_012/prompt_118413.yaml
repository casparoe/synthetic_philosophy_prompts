answer: |-
  **Project Title:** Immunizing the Long Run: Distinguishing Theoretical Revision from Ad Hoc Rescue in Tendency Claims

  **Project Summary**
  This project investigates the epistemic status of "long-run tendency" claims in social theory, using the debate over Malthusianism as a primary case study. When a prediction fails, proponents often defend the theory via one of three moves: restricting the scope (a), deferring the date (b), or swapping the mechanism (c). Critics argue these are immunizing stratagems that render the theory unfalsifiable; proponents argue they are necessary refinements of complex systems. This project asks: **Can we distinguish between legitimate theoretical revision and illegitimate rescue in long-run predictions using *ex-ante* structural criteria, without relying on hindsight accuracy?**

  I will develop a criterion based on *present constraints*. A revision is legitimate only if it imposes new, testable constraints on the present state of the system, not just on the future outcome. If a "tendency" claim does not forbid any specific configuration of variables *now*, it is, as my interlocutor argued, a cheat. I will test this criterion against three cases: Malthusian population theory, Limits to Growth resource depletion models, and Secular Stagnation hypotheses. The output will be an 8,000–10,000-word paper suitable for publication in a journal of economic methodology or philosophy of social science.

  **The Research Question**
  The initial intuition—that "right but early" covers distinct logical moves—is correct but insufficient. The deeper problem is that "tendency" claims often function as escape hatches. If a theory predicts $X$ will happen *eventually*, and $X$ has not happened *yet*, the theory is technically safe. This makes the theory compatible with all possible present states of the world.

  Therefore, the research question is operationalized as follows: **Do the three defensive moves (Scope Retreat, Date Deferral, Mechanism Swap) generate distinct auxiliary hypotheses that are testable in the short run?**
  *   **Hypothesis:** A defensive move is methodologically legitimate if and only if it alters the expected trajectory of *current* observable variables, not just the terminal outcome.
  *   **Null Hypothesis:** All three moves are functionally equivalent immunizing strategies that render the core theory unfalsifiable until the predicted event occurs (or never).

  This formulation forces a determinate answer. Either the moves can be distinguished by their immediate empirical content, or they cannot.

  **Methodology and Work Plan**
  The project will proceed over one academic term (12 weeks). The method is comparative reconstruction. I will not be gathering new empirical data on population or resources; I will be reconstructing the logical structure of the arguments to test for "present constraints."

  *   **Weeks 1–3: Logical Reconstruction.**
      *   Formalize the Malthusian argument and the three defensive moves (Scope, Date, Mechanism) into premise-conclusion structures.
      *   Explicitly model the friend's critique: Define "tendency" as $P(Event | Time \to \infty) > 0$. Show mathematically or logically why this is unfalsifiable without auxiliary assumptions about the *rate* of approach.
      *   *Deliverable:* A 2,000-word logic map of the Malthus debate.

  *   **Weeks 4–6: Comparative Case Testing.**
      *   Apply the same reconstruction to two analogue cases:
          1.  **Resource Depletion (Limits to Growth):** When predicted depletion dates pass without crisis, do proponents retreat scope (only specific minerals), defer date (new reserves found), or swap mechanism (price signals ration demand)?
          2.  **Secular Stagnation (Summers/Krugman vs. Optimists):** When growth persists despite demographic headwinds, is the theory revised by scope (only advanced economies), date (debt crisis later), or mechanism (AI productivity)?
      *   *Test:* For each defensive move in these cases, identify if the revision demanded a change in *current* policy or measurement. If the revision changes nothing about how we measure the economy today, it is coded as "Ad Hoc." If it requires new data or policy *now*, it is coded as "Progressive."
      *   *Deliverable:* Comparative matrices coding the moves.

  *   **Weeks 7–9: Drafting the Argument.**
      *   Synthesize findings. If the "Present Constraint" criterion holds, I will argue that Mechanism Swaps are often progressive (they imply new causal pathways to monitor now), while Date Deferrals are often degenerative (they imply waiting). Scope Retreats are ambiguous and depend on whether the boundary is theoretically motivated or arbitrary.
      *   Address the friend's critique directly: A tendency is only scientific if it implies a *rate of change* that can be measured now. If the theory cannot specify a rate, it is metaphysics.
      *   *Deliverable:* First full draft (8,000 words).

  *   **Weeks 10–12: Revision and Falsification Check.**
      *   Stress-test the conclusion. What if a "Progressive" revision turns out to be wrong? (This doesn't invalidate the method). What if an "Ad Hoc" revision turns out to be right? (This validates the method—theories can be lucky but unscientific).
      *   Final polish.
      *   *Deliverable:* Final manuscript.

  **Feasibility and Scope**
  This is a term-length project, not a dissertation. A dissertation would require a full history of economic thought or a novel formal model of falsification. This project limits itself to *structural analysis* of existing arguments. I am not solving the problem of induction; I am proposing a heuristic for evaluating a specific class of social science claims. The word count (8–10k) is sufficient to define the criterion, apply it to three cases, and defend the classification.

  The risk is that the "Present Constraint" criterion is itself arbitrary. To mitigate this, I will ground it in existing methodological literature (e.g., Lakatos on research programmes, Popper on ad hoc hypotheses) without letting the literature review dominate the text. The focus remains on the Malthus/Econ debate as the driving example.

  **Success and Failure Conditions**
  *   **Success:** The paper produces a clear heuristic (e.g., "The Immediate Constraint Test") that allows a reader to look at a revised theory and classify the revision as legitimate or illegitimate based on its current empirical implications, independent of whether the long-run prediction eventually comes true.
  *   **Failure:** The analysis reveals that all three moves are indistinguishable without hindsight. If I conclude that *no* distinction is possible, the project still succeeds intellectually if it proves that "tendency claims" in social science are inherently unscientific until they specify a time-bound rate of change.
  *   **True Failure:** The project becomes a historical survey of Malthus rather than a methodological analysis. I will avoid this by keeping the historical details minimal and focused only on the logical structure of the defenses.

  **Conclusion**
  My friend's objection—that "tendency" is just a prediction with the date removed—is the strongest argument in the room. This project does not assume it is wrong; it assumes it is the standard by which these theories must be judged. If Malthusianism (or its modern analogues) cannot specify what would count against it *today*, it is not a theory that is "right but early," but a belief system that is "always safe." Determining whether there is a middle ground between dogmatism and falsificationism is the specific contribution of this work.
