answer: |-
  The river mist clung to the Customs House, dampening the sound of the bells that marked the shifting tides. Elian stood before the Concordance, a brass-and-glass apparatus that dominated the center of the inspection floor. It hummed with the tension of wound springs and settled lenses. For two generations, the device had吐出 paper strips bearing the true names of every crate, bale, and barrel presented on its plinth. It had never erred. Yet, as the newly appointed Inspector, Elian's duty was not to trust the machine, but to certify the **purchase** of its names upon the world.

  His mentor, Master Hales, had died with the question unfinished. Hales had spent twenty years arguing that the Concordance did not name the objects themselves, but rather the light that fell upon them. He had left notes suggesting that if a crate of apples were wrapped in blue cloth, the machine might output the word for "Blue-Square" rather than "Fruit," provided the dictionary defined "Fruit" only by its exposure to air. The dictionary was a closed loop; every term defined another term, circling back on itself like a snake eating its tail. No living soul knew what the words originally pointed to. The Inspector's seal was the only anchor, a wax stamp declaring that the name held fast to the cargo.

  Elian picked up the ledger. The **purchase** of the previous day's entries looked secure on paper, the ink dry and the seals unbroken. But the physical evidence told a different story. Along the back wall sat the Founders' Sample Cases, glass boxes containing the original objects used to calibrate the Concordance. Time had not been kind. What was once recorded as "Hard-Grain" had rotted into a black sludge. What was "Woven-Flax" had unraveled into dust. The Concordance, when presented with these samples today, still produced the original names. It named the decay as if it were the substance. This suggested the machine tracked the history of the object, or perhaps the shape of the glass around it, rather than the material within.

  To prove this, Elian needed a test. He could not simply say, "Is this the wood or the shadow?" The law required the test to be described in the dictionary's own terms. He spent weeks drafting a proposal in the margin of the logbooks. He proposed moving a crate from the sunlit quay into the shadowed hold during the weighing process. If the name changed, the **purchase** depended on light. If the name remained steady, it depended on the mass. But the dictionary had no word for "shadow" that did not also imply "absence-of-thing." To write the test was to presuppose the answer.

  The difficulty weighed on him. The port continued to churn. Barges docked, stevedores shouted, and the Concordance clacked and whirred. Elian watched the operators place a barrel of tar on the plinth. The machine whispered, printing *Viscous-Black-Seal*. Elian stamped it. He felt the hollowness of the act. He was certifying a relationship he could not see, binding a word to a thing based on a tradition he could not verify.

  Then came the storm.

  It arrived with the evening tide, a squall that turned the river the color of bruised iron. The wind howled through the rigging of the docked ships, snapping lines and tearing canvas. A merchant barge, overloaded with timber, began to list dangerously near the Customs House steps. If the cargo shifted too far, the vessel would capsize, spilling the wood into the silt where it would be lost to the river guilds. The law stated that cargo must be named on the plinth before it could be legally moved to safety. If the barge sank before the naming, the timber became river-wreck, property of the Crown, and the merchant would be ruined.

  Elian ran out onto the wet quay. Rain lashed his face, stinging his eyes. The stevedores were struggling to drag a massive log onto the inspection plinth, which was elevated above the flood line. The sky had gone dark as night. The Concordance relied on ambient light filtered through its upper lenses to read the texture and hue of the cargo. In this gloom, the machine might fail, or worse, output a name based on the darkness itself.

  "Get it up!" Elian shouted, slipping on the slick stones. His boots found no **purchase** on the algae-covered steps. He scrambled up, grabbing the rail, and haul himself onto the platform.

  The log was dragged onto the brass plinth. It was wet, dark, and indistinguishable from the shadows surrounding it. The Concordance began to cycle. The lenses whirred, seeking focus. The storm drowned out the usual hum. A flash of lightning illuminated the scene for a fraction of a second, stark and white. The machine clacked. A strip of paper emerged.

  *Water-Logged-Drift.*

  The merchant screamed from the deck below. "It's timber! Green-cut Oak! If you name it Drift, the Crown takes it!"

  The definition of *Drift* in the dictionary implied "Object-Removed-From-Owner-By-Water." If Elian sealed this name, the merchant lost everything. If he rejected it, the barge would sink before the storm broke and the sun returned. He had seconds. The log was sliding back toward the edge. He had to act on the answer before he could justify it. Did the machine name the wood, or did it name the water soaking it? In this light, they were the same.

  Elian looked at the paper. He looked at the merchant's desperate face. He looked at the rotting Sample Cases in his mind, the black sludge that was still called "Grain." The machine was consistent. It named what was presented. In this storm, the wood was water. To call it Oak was a lie of memory, not observation. But to call it Drift was a sentence of poverty.

  He reached for his seal. The wax was soft in the humidity. He pressed it down onto the strip before the log slipped back into the rain. He certified the name.

  "Secure the line!" he roared at the stevedores. "Move it to the dry shed. Now!"

  They dragged the timber away just as the barge righted itself. The merchant stared at Elian, hatred burning in his eyes, but he was alive, and his cargo was saved, even if its legal status was now complicated. Elian stood alone on the platform, the rain washing over the brass plinth.

  He returned to the office soaked and shivering. The ledger lay open. He looked at the entry: *Water-Logged-Drift*. He knew he could not prove why the machine had chosen that word. He could not prove it wasn't the correct name for Oak in a storm. The **purchase** of the seal was no longer about truth; it was about consequence.

  Elian took his quill. He did not strike the entry. To do so would be to admit the Concordance could err, which would invalidate every seal in the archive. Instead, he opened a new column in the ledger, one not mandated by the statute. He labeled it *Condition-of-Presentation*.

  He wrote: *Light: Flash. Surface: Wet. Context: Flood.*

  He realized then that the test he had planned was impossible. He could never separate the object from the scene, because the object only existed within a scene. The Concordance was not lying; it was simply more honest than the merchants wanted. It named the moment, not the essence.

  Elian dipped his quill again. He would not resign. He would not attempt to dismantle the machine. He would continue to stamp the names. But he would record the weather, the time of day, and the angle of the light for every single entry. He would build a second archive alongside the first, a shadow ledger that tracked the context the Concordance actually tasted.

  Let the future inspectors puzzle over why *Oak* was named *Timber* in the sun and *Drift* in the rain. Let them try to find the **purchase** of the word on the thing. Elian had taken **purchase** of his office. He closed the ledger and lit a fresh candle. The storm raged outside, but the ink was dry, and the work continued.
