      *   *The "Missing":* The specific gender dynamics are huge here. A woman's "early voice" replaced by a man's "early genius." That's not just attribution; it's cultural erasure. Also, the signature issue (FP signed them). Is it a forgery if she signed his work with permission? That's a legal/ethical grey zone they skipped.

  6.  **Final Review against Constraints:**
