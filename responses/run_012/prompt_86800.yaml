      *   **The History:** FP signed them, MP didn't object. No forgery. Misattribution stood for 40 years.
      *   **The Shift:** Market value up (now MP's early work). Critical narrative shifts (from "young woman finding voice" to "young man's early work").
      *   **The Core Conflict:** Ontology of the artwork vs. Context of the artwork. Does the *identity* of the maker constitute the *work* itself?

  3.  **Analyze Move by Move:**

