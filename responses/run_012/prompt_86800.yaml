      *   **Move 2 (Philosopher):** "Properties we praise are relational... early work, first attempt... part of what one sees."
          *   *Evaluation:* Right (in art theory context). Art isn't just retinal; it's intentional/historical.
          *   *Assumption:* Art is an achievement within a history, not just an object.
          *   *Verbal/Substantive:* Substantive. Challenges Move 1's definition of the object.

      *   **Move 3 (Curator):** "The Test... if announced late instead of early, would qualities change? If yes, qualities move with story."
          *   *Evaluation:* Partly Right (as a trap), but the Philosopher accepts it. It's a *reductio* attempt that fails.
