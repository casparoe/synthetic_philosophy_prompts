  ***

  **A Note on Historical Theory**

  This poem deliberately inhabits the ambiguity between cyclical and linear historiography rather than resolving it. In doing so, it takes liberties with classical cyclical theories. For instance, Polybius's *anacyclosis* or Ibn Khaldun's theory of *asabiyyah* (group solidarity) propose mechanistic degeneration—dynasties *must* decay over generations due to specific sociological pressures. The poem softens this determinism; the "crack" returns, but it is unclear if it is caused by structural inevitability or human failure ("We promise not to stumble").

  Furthermore, the poem leans into the "spiral" interpretation—a modern compromise suggesting that while events recur, they do so at a different elevation or context. This contests the strict closure of thinkers like Spengler, who viewed cultures as organic bodies destined for death without rebirth. Conversely, it also resists the Enlightenment narrative of linear progress. By ending where it began, yet shifting the semantic weight of the lines (e.g., "There is no map for walking strictly back" moves from a statement of impossibility to a statement of disorientation), the poem reflects the contested consensus of modern history: that patterns exist, but agency and contingency prevent them from being perfect loops.
