answer: |-
  This is a profound puzzle because it sits at the intersection of property law, ontology (what kind of thing an object is), and ethics. Your engineering intuition—that a copy is not the original—is ontologically sound regarding *data* or *manufactured goods*. However, the museum practice you describe relies on a different ontology, one drawn from anthropology and post-colonial legal theory.

  To make the practice coherent rather than cynical, we must reconstruct the implicit theory of **Cultural Heritage as a Service** rather than **Cultural Heritage as a Stock**.

  Here is the reconstruction of the implicit theory behind digital repatriation and renewable loans, addressing your four specific points.

  ### 1. The Locus of Value: Function over Substrate

  Your intuition relies on a **Substrate Theory of Value**: the value of the file is bound to the specific magnetic states on the specific disk where it was first written. If you keep the original disk, you keep the value.

  The museum practice, however, operates on a **Relational-Functional Theory of Value**. This view presupposes that the value of a cultural object is not located primarily in its unique material substrate (the atoms), but in the **relationships it sustains** and the **functions it performs** for a community.

  *   **What the practice commits to:** It commits to the view that an object's primary "work" is to transmit knowledge, enable ritual, or sustain identity. If a high-resolution 3D scan allows a community to teach their youth, study the carving techniques, or incorporate the image into a digital memorial, the *functional value* has been repatriated, even if the *material substrate* has not.
  *   **What it leaves open:** It leaves open whether the material substrate has *any* intrinsic value. It does not deny that the original is special; it merely asserts that the "originality" is not the *only* source of value. It treats the object as having a "split ontology": it is both a physical thing (in the museum) and a cultural agent (in the community). The digital copy satisfies the "cultural agent" role, while the museum retains the "physical thing" role (often citing preservation concerns).

  **The Engineer's Translation:** The museum is arguing that the *API* (the access to the form, data, and imagery) is the valuable product, not the *server* (the physical stone or wood). If you give the community root access to the data, they can build what they need, even if you keep the hardware.

  ### 2. Legal Title vs. Possession: The "Bundle of Rights"

  The "renewable loan" model is baffling if you view ownership as a binary switch (Owned/Not Owned). In legal philosophy, however, ownership is often treated as a **Bundle of Rights**. This bundle includes the right to possess, the right to use, the right to exclude, the right to sell, and the right to destroy.

  *   **The Presupposition:** This practice presupposes that the moral injury of colonial theft was primarily a violation of the **right to use** and the **right to care**, not necessarily the **right to title** in the abstract.
  *   **Why Possession Matters Morally:** Possession matters because it enables *stewardship*. For many source communities, objects are not "art" to be viewed; they are ancestors or tools to be fed, sung to, or used. Possession allows for this *care*.
  *   **Why Title is Retained:** By retaining legal title on a renewable loan, the museum presupposes a **Paternalistic Stewardship Model**. It assumes that while the community has the moral right to *use* the object, the museum retains the ultimate responsibility (and authority) for its *physical safety*. It treats the museum as a "cold storage backup." If the community loses the object (to war, disaster, or decay), the museum's retained title allows them to theoretically reclaim it to "save" it.

  **The Coherence:** The practice is coherent if you believe the moral debt is about *access and agency*, not *property*. The museum says: "We acknowledge you should control how this is used (Possession), but we claim a residual duty to ensure it physically survives (Title)."

  ### 3. Human Remains vs. Inanimate Objects: Category Errors

  You asked if the same underlying theory is at work for human remains. The answer is **no**. The split presupposes a fundamental ontological distinction between **Persons** and **Property**.

  *   **Inanimate Objects:** These fall under the theory of *Cultural Property*. They can be copied, loaned, or shared because their value is symbolic or functional. A mask can be represented by a scan because the mask *stands for* something else.
  *   **Human Remains:** These fall under the theory of **Personhood/Dignity**. In this regime, the remains are not "objects that represent ancestors"; they *are* the ancestors (or the physical vessel of the person).
  *   **The Value at Stake:** For objects, the value is *identity and knowledge*. For remains, the value is *dignity and rest*.
  *   **Why the Split:** A scan of a skull cannot "rest." A scan cannot be buried. To offer a digital copy of human remains is to commit a category error: it treats a subject (a person) as an object (data). The practice presupposes that human remains possess an **inalienable right to bodily integrity** that transcends cultural utility.

  **The Coherence:** The practice is only coherent if it accepts that human remains are **non-fungible** in a way that masks or tools are not. The "digital return" for remains is almost universally rejected because the "service" the remains provide is not information, but *presence*. You cannot virtualize presence in a funeral context.

  ### 4. Strict Presuppositions vs. Underdetermined Aspects

  This is the most critical part for your analysis. We must separate what *must* be true for this to work from what is merely ambiguous.

  **Strict Presuppositions (What must be true for the practice to make sense):**
  1.  **Value is Divisible:** The value of the object must be separable into "informational/symbolic value" (which can be copied) and "material/historical value" (which cannot). If value were indivisible (i.e., the object *just is* its matter), digital repatriation would be nonsense.
  2.  **Stewardship > Ownership:** The moral claim of the source community must be based on *stewardship* (the right to care for/use) rather than *sovereignty* (the right to exclude the museum entirely).
  3.  **Remains are Persons:** Human remains must be ontologically distinct from cultural artifacts. If remains were just "biological artifacts," digital copies would be theoretically permissible (as they are for statues).

  **Underdetermined Aspects (Where incompatible theories license the same behavior):**
  1.  **The Motive for Retaining Title:**
      *   *Theory A (Benevolent):* The museum keeps title to ensure preservation against local instability (The "Global Backup" theory).
      *   *Theory B (Cynical):* The museum keeps title to maintain leverage and prestige, knowing a loan can be revoked if the community becomes too demanding (The "Neocolonial Control" theory).
      *   *Observation:* Both theories result in the exact same contract (renewable loan). The practice does not tell you which is true.
  2.  **The Sufficiency of the Copy:**
      *   *Theory A (Platonist):* The "Form" of the object is the real object; the matter is just a vessel. Therefore, the scan is nearly as good as the original.
      *   *Theory B (Pragmatist):* The scan is *not* as good, but it is the best we can do without risking damage during transport. It is a compromise, not an equivalence.
      *   *Observation:* Museums often speak as if Theory A is true ("virtual restitution"), but act as if Theory B is true (keeping the original in climate control).

  **Counterfactual Test:**
  *   **If you replaced the view with "Object = Material":** The practice collapses. Digital returns become insults. Renewable loans become nonsensical (you must transfer title).
  *   **If you replaced the view with "Object = Form":** The practice expands. Physical return becomes unnecessary for *everything*, including sacred objects. The museum would keep all physical items and send hard drives to everyone.
  *   **What survives untouched:** The distinction regarding human remains. Even if "Object = Form," most ethical frameworks would still reject scanning human remains as sufficient, because the "Form" of a person is not separable from their "Matter" in the way a statue's form is.

  ### Summary for the Engineer

  You are viewing the museum as a **Database**, where the primary key is the physical ID. In your model, `SELECT * FROM Objects WHERE ID = 123` must return the physical row.

  The museum is operating as a **Content Delivery Network (CDN)**. They are arguing that the "content" (the cultural meaning, the visual data, the ritual utility) can be cached locally by the source community, while the "origin server" (the museum) maintains the master copy for redundancy and uptime guarantees.

  The practice is coherent **if and only if** you accept that cultural heritage is primarily *information* and *relationship*, not *matter*. It becomes cynical only when the museum uses that theory to retain *power* (title) while offloading the *cost* of care, or when they apply the "information" theory to things that are fundamentally "matter" (like human remains). The friction you sense is the collision between a **Property Logic** (who owns the disk?) and a **Kinship Logic** (who cares for the ancestor?). Digital repatriation attempts to bridge these with code, but the underlying protocols are incompatible.
