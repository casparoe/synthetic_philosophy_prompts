  The practice

  A large public institution, such as a university or hospital, revises its procurement policy to reduce environmental impact. This documentation could be replicated across a dozen cities. The primary mechanism is the removal of beef from menus, replaced largely by chicken. Public communications highlight the land and water footprint of cattle, framing the shift as climate action. Simultaneously, the institution adopts third-party higher-welfare certifications for its new chicken and egg supply, mandating more space and humane slaughter. However, the policy documents remain silent on the animals killed to grow feed crops for the poultry, as well as the culling of male chicks in the egg supply. The arithmetic is stark: because a steer yields vastly more meat than a broiler, this substitution increases the number of individual animals killed per kilogram of protein by roughly two orders of magnitude. The policy thus pairs a reduction in emissions with a multiplication of deaths, justified by environmental metrics and welfare standards that ignore the scale of killing.

  The implicit theory

  The implicit theory operating here is a form of aggregate consequentialism where the moral unit is the sustainable meal, not the individual life. Value is assigned to outcomes—specifically greenhouse gas emissions and land use—rather than to the rights or existence of specific subjects. Under this view, moral status is not invariant; it is weighted against environmental cost. The beef ban presupposes that the climate harm of cattle production outweighs the moral cost of removing them, but the switch to chicken reveals a further assumption: that the moral cost of killing a chicken is negligible compared to the environmental benefit gained. This is per-plate accounting: the ethics reside in the kilogram of protein, not the creature providing it.

  The welfare certification adds a crucial nuance: it suggests that while death itself is not a primary moral violation, suffering is. This creates a hybrid valuation where death is permissible if the life was "good" and the environmental footprint is "low." The label presupposes that a life worth living can offset the harm of an early death, provided the end is swift. It implies that the moral wrong of killing is not absolute but contingent on the quality of the life preceding it. By ignoring feed-crop deaths and male chicks, the theory further assumes that moral concern diminishes with distance from the final product; indirect killing is morally invisible compared to direct slaughter. This suggests a hierarchy of visibility rather than a hierarchy of sentience.

  The two halves of the policy run on different accounting schemes that converge only on the per-plate metric. The environmental office counts carbon; the procurement office counts welfare standards; neither counts heads. The presupposed philosophy is that systemic sustainability justifies individual expendability, provided the expendable units are treated well while they exist. The moral weight of an animal is thus fungible, scalable, and subordinate to the aggregate goal of a lower-emission food system. Furthermore, the policy hints at a graded moral status based on cognitive complexity or ecological impact. If a cow is morally heavier than a chicken, the swap reduces total moral harm despite the headcount increase. However, the welfare label complicates this by granting chickens significant moral consideration regarding their living conditions. This suggests the institution does not view the chicken as morally negligible, but rather views its death as less significant than its suffering or its environmental cost. The theory separates the wrong of suffering from the wrong of killing, prioritizing the mitigation of the former and the environmental externalities of the latter, while treating the count of deaths as morally inert.

  What it rules out

  This practice strictly rules out a straightforward per-head accounting view, such as a rights-based position where killing itself is the primary harm regardless of species or welfare. If every individual death counted equally, substituting one cow for one hundred chickens would be recognized as a moral regression, not progress. It also rules out a pure suffering calculus that includes indirect harms; by omitting feed-crop deaths and male chicks, the policy declares that suffering or death occurring outside the immediate slaughterhouse boundary is irrelevant to the ethical audit. Additionally, it rejects the view that a good life cannot offset an early death. The welfare label functions as a moral offset, implying that enhanced living conditions legitimize the killing.

  Furthermore, it rules out a view that weights suffering by intensity rather than by death count. If the trauma of death is significant per individual, multiplying that trauma by two orders of magnitude should register as a major ethical cost, yet the policy treats it as negligible. It cannot accommodate the position that the number of subjects is the primary metric of success. The institution acts as if the moral landscape is flattened by environmental metrics, rendering the sheer volume of killing invisible. Any philosophy that demands a cap on total deaths, regardless of the carbon savings, is incompatible with this menu.

  Where it is underdetermined

  The practice is underdetermined regarding the specific valuation of species. It is coherent if one assumes a cow possesses significantly higher moral status than a chicken, such that saving one cow offsets killing fifty chickens. Under this graded status view, the swap reduces total moral harm despite the headcount increase. It is also coherent under a strict climate consequentialism where carbon reduction is the sole moral imperative, and animal ethics are secondary constraints managed by welfare labels. However, the practice becomes incoherent if the institution claims to care about "animal lives" generally while ignoring the multiplication of deaths.

  It is also underdetermined whether the silence on feed crops implies those lives have zero moral weight or simply that they are too difficult to measure. If the former, the theory is speciesist regarding indirect victims; if the latter, the theory is pragmatically limited rather than philosophically complete. We cannot know if the institution believes chicken lives are less valuable, or if they believe climate harm outweighs any individual life count. The disconnect between the sustainability office and procurement suggests the underdetermination lies in institutional silos rather than unified philosophy. It is unclear if this is a deliberate ethical synthesis or an administrative accident where no single agent holds the whole moral equation.

  What would have to change

  To adopt a headcount view, the institution would need to alter its metrics from carbon-per-kilogram to animals-per-meal. Procurement would shift away from chicken toward plant-based proteins or less frequent meat service, potentially retaining beef for special occasions to minimize total deaths. Public justification would focus on "lives saved" rather than emissions reduced. The welfare label would become secondary to the reduction in slaughter volume. Labels would need to change from "higher welfare" to "lower mortality," signaling ethical priority. Procurement contracts would need caps on total units purchased, not just standards per unit. The public narrative would have to shift from "sustainable food" to "humane food," acknowledging the trade-off between climate and life count.

  To adopt a total-suffering view, the institution would need to expand its accounting boundary to include feed-crop deaths and male chick culling. This might reveal that high-welfare chicken still incurs massive indirect suffering. Procurement would likely move toward plant-based options that minimize field deaths, or regenerative systems that reduce crop dependency. The justification would need to weigh the suffering of a life lived against the suffering of deaths incurred to produce it. Both shifts require breaking the silo between environmental and animal welfare offices, integrating death counts and indirect harms into the primary sustainability dashboard, and accepting that the lowest-carbon meat option may not be the lowest-harm option overall. The institution would have to admit that efficiency per plate does not equal ethics per life. Ultimately, both alternatives demand a unified moral ledger where environmental and animal costs are summed in a common currency of harm, rather than segregated by department.
