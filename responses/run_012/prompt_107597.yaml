  The science stands, the price is low,
  We count the hands that made it so.
  We bear the blame should it decay,
  So this is where we draw the line.

  ***

  **Seminar Note**

  This poem stages the Discursive Dilemma (List & Pettit) rather than modeling shared intentionality à la Searle or Bratman. It assumes a Premise-Based Procedure where the group maintains rationality across propositions even at the cost of matching member verdicts. The philosophical bet is that group agency requires this kind of rational integration, treating the collective as a distinct intentional system. It ignores Searle's claim that we-intentions are primitive irreducible states, and Bratman's focus on meshing subplans, favoring Gilbert's joint commitment but pushing it toward corporate personhood. The liberty taken is freezing the deliberation; real groups often negotiate to avoid this paradox. The irreducible line ("We bear the blame should it decay") attributes responsibility no majority member accepts; the reducible line ("We count the hands that made it so") describes mere aggregation. The poem distorts if you believe group agency dissolves upon such disagreement; it illustrates if you accept that groups can hold attitudes independent of their members' majority will.
