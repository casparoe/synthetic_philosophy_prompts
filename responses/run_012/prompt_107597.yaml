      *   Premise 2 (Q): Was there a contractual obligation not to do the act?
      *   Conclusion (R): Is the defendant liable? (R = P & Q)
      *   Scenario:
          *   Judge A: Yes P, Yes Q -> Yes R.
          *   Judge B: Yes P, No Q -> No R.
          *   Judge C: No P, Yes Q -> No R.
      *   Majority on P: Yes (A, B).
      *   Majority on Q: Yes (A, C).
      *   Majority on R (Conclusion): No (B, C).
      *   *Group Decision via Premise-Based Procedure:* Accept P (Yes), Accept Q (Yes) -> Conclude R (Yes).
      *   *Result:* Group says "Liable" (Yes), but only 1 out of 3 judges believes "Liable". The majority believes "Not Liable".
