  I'm a retired field biologist who got into moral philosphy a few years ago, and now I've somehow agreed to give a paper at a small ethics workshop next month. The audiance is mostly Kant scholars, plus one virtue ethicist, one consequentialist, and one political philosopher who works on reciprocity and free-riding. My thesis is that supererogation isn't a mysterious gap in the moral ledger; it's a social technology. Communities use the label of going beyond duty to reward and encourage costly contributions, especially after a crisis, without making those contributions mandatory. The act isn't supererogatory in itself; the labeling practice does the work. I call this the ratchet view. Can you draft my Q&A prep sheet? I want the eight or so objections this specific audience will actually raise, ordered by how much dammage they'd do, phrased the way each person would put it, with a two-minute reply and a note on where the reply is soft. Include the question I'm hoping nobody asks. No reading list or citations, just the objections and what I should say back.
