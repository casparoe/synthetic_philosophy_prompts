answer: |-
  # Q&A Prep Sheet: The Ratchet View of Supererogation

  **Strategy:** You are positioning supererogation as a *functional mechanism* (social technology) rather than a *metaphysical category*. The Kantians will attack the universality of duty; the Political Phil will attack the fairness; the others will attack the exclusion of character/outcomes. Your defense is systemic stability: mandatory altruism collapses under free-riding; voluntary altruism collapses under lack of incentive. The "Ratchet" locks the benefit without locking the obligation.

  ---

  ### 1. The "Duty Creep" Objection (Kant Scholar)
  **The Question:** "If an action is objectively good and within an agent's capacity, on what grounds do you withhold the status of duty? By calling it 'optional,' aren't you simply giving agents a permission to be morally lazy? Your ratchet seems to lower the bar of duty rather than protect the supererogatory."

  **The Reply:** "The bar isn't lowered; the system is stabilized. In biological systems, if a costly behavior becomes mandatory for survival, it often selects for evasion or resentment. If we categorize high-cost benevolence as 'duty,' we invite universal non-compliance, which degrades the norm itself. The Ratchet View preserves the *value* of the act by protecting its *voluntariness*. We aren't saying the act isn't good; we're saying mandating it would destroy the social conditions that make the act possible. We keep it optional not to excuse laziness, but to ensure the behavior actually occurs."

  **Soft Spot:** You haven't defined the threshold where "costly" becomes "mandatory." If the cost is low, your view implies we still shouldn't make it duty, which sounds counterintuitive.

  ### 2. The "Exploitation" Objection (Political Philosopher)
  **The Question:** "You describe this as a social technology for community benefit. But historically, labeling care work or heroism as 'beyond duty' is how powerful groups offload burdens onto the vulnerable without compensation. Isn't your Ratchet just a philosophical justification for free-riding on the goodwill of the marginalized?"

  **The Reply:** "That is a risk of the technology, not a feature of the concept. A hammer can build a house or break a thumb. My claim is descriptive of the *function*: the label manages burden distribution. However, acknowledging this mechanism allows us to audit it. If the 'voluntary' burden falls disproportionately on one group, the Ratchet View gives us the vocabulary to say the labeling practice is malfunctioning. We can adjust the social incentives without necessarily converting the act to a duty, perhaps by redistributing the costs of the 'optional' act."

  **Soft Spot:** You are relying on the community to self-correct the exploitation. If the community benefits from the exploitation, they have no incentive to fix the "malfunction."

  ### 3. The "Naturalistic Fallacy" Objection (Senior Kant Scholar)
  **The Question:** "You are describing how communities *use* moral language, not how they *ought* to use it. You've moved from sociology to ethics without crossing the bridge. Even if communities label acts this way to manage incentives, does that make it *morally right* to do so?"

  **The Reply:** "I'm not arguing that the practice is right simply because it exists. I'm arguing that the *concept* of supererogation only makes sense within that functional context. Without the social technology, 'supererogation' is just 'good but not required,' which is a paradox in deontic logic. The 'ought' comes from the necessity of maintaining a sustainable moral ecosystem. If we want a society where high-cost benevolence happens, we *ought* to maintain the category that allows it to flourish without breaking the agents who perform it."

  **Soft Spot:** This conflates "sustainable" with "moral." A sustainable slave system is still immoral. You need to be careful not to equate social stability with moral truth.

  ### 4. The "Universalizability" Objection (Kant Scholar)
  **The Question:** "Can the maxim of your view be universalized? 'I will label costly good acts as optional to ensure I get the benefit without the obligation.' If every community does this strategically, doesn't trust in the moral label collapse? Everyone will see the labeling as manipulation."

  **The Reply:** "The maxim isn't 'manipulate for benefit.' It's 'preserve voluntariness to preserve the act.' If everyone universalized the Ratchet View, we wouldn't lose trust; we would gain clarity. Agents would understand that high-cost contributions are socially desired but not coerced. Transparency about the function of the label prevents the manipulation. The collapse only happens if the strategy is hidden. My view encourages making the technology visible."

  **Soft Spot:** Once the technology is visible, agents might game it (performing the act only for the social reward), which undermines the moral worth Kantians care about.

  ### 5. The "Sub-Optimal Outcome" Objection (Consequentialist)
  **The Question:** "If the goal is community well-being, and the act produces the best outcome, why are you protecting the agent's option not to do it? Your Ratchet prioritizes the agent's comfort over the victim's need. If I can save a life at high cost to myself, your view says the community should praise me but not require it. That seems to privilege the bystander over the suffering."

  **The Reply:** "It privileges the long-term capacity of the bystander over the short-term need of the victim. If we mandate high-cost rescue, we deplete the pool of rescuers. People will hide, or they will burn out. By keeping it supererogatory, we encourage a culture where people *want* to rescue, rather than a culture where people calculate the minimum compliance to avoid punishment. The Ratchet maximizes total good over time by preventing moral burnout, even if it sacrifices optimal outcomes in single instances."

  **Soft Spot:** In emergency cases (one-off scenarios), the long-term argument doesn't hold. You're admitting that in a specific crisis, your view might permit less good than a consequentialist mandate.

  ### 6. The "Character Erasure" Objection (Virtue Ethicist)
  **The Question:** "You're treating moral acts as transactions between the agent and the community. But supererogation is about excellence of character. A saint doesn't save the child because the community labeled it 'rewardable.' They do it because they are virtuous. Your view makes the community the moral author, not the agent."

  **The Reply:** "I'm not denying the agent's character; I'm explaining the social space that character inhabits. Virtue doesn't exist in a vacuum. Even the saint needs a community that recognizes their act as exceptional rather than expected. If the community labels the saint's act as 'duty,' the saint is no longer virtuous, they are merely compliant. The Ratchet View protects the space for virtue to be recognized *as* virtue. It preserves the distinction between 'doing what is required' and 'excelling beyond it.'"

  **Soft Spot:** This concedes that the *recognition* is what matters, not the act itself. It risks making morality performative.

  ### 7. The "Contingency" Objection (Kant Scholar)
  **The Question:** "On your view, is an act supererogatory only if a community decides to label it so? If a hermit performs a great sacrifice alone, is it not supererogatory because there is no social technology to apply the label? You've made moral status contingent on social consensus."

  **The Reply:** "In a strict sense, yes. 'Supererogatory' is a relational term, like 'hero.' A hero requires a society to recognize heroism. Without the social context, the act is still good, but it loses its deontic status as 'beyond duty.' Duty and supererogation are social categories. The intrinsic value of the act remains, but its classification depends on the moral ecosystem. This isn't relativism; it's acknowledging that moral concepts are tools for social coordination."

  **Soft Spot:** This is the hardest pill for Kantians to swallow. It implies there is no supererogation in a vacuum, which feels like denying the objective value of the sacrifice.

  ### 8. The "Motivation" Objection (Kant Scholar)
  **The Question:** "If the label is a reward mechanism, aren't you encouraging people to act for the sake of the praise rather than from duty or good will? You're turning morality into a reputation economy."

  **The Reply:** "I'm describing how the category functions, not prescribing the agent's motive. An agent can act from pure good will while the community uses the label to sustain the practice. The two levels operate independently. The community's functional use of the label doesn't contaminate the agent's internal motivation, provided the community doesn't make the praise the *only* reason to act. The Ratchet View is about the structure of the norm, not the psychology of the actor."

  **Soft Spot:** It's hard to separate the structure of the norm from the psychology of the actor. If the system rewards praise, it selects for praise-seekers over time.

  ---

  ### The Question You Hope Nobody Asks
  **The Question:** "If the labeling practice is a technology for social stability, what happens when the stability requires *injustice*? If a community uses the 'supererogatory' label to ensure that only the poor perform risky labor, while the rich claim the benefit, does your view condemn the label or endorse it as functional?"

  **Why it's dangerous:** It forces you to choose between your functionalist definition (it works to stabilize) and a normative judgment (it's unjust). If you say it's still supererogation, you look like you endorse oppression. If you say it's not, you admit there's an objective standard of justice outside your social technology, which undermines your main thesis.

  **Prepared Deflection:** "That is a malfunction of the technology, not a feature. A tool that breaks the user is a bad tool. The Ratchet View provides the framework to identify that malfunction: if the 'voluntary' burden is coerced by economic necessity, it is no longer truly optional, and the label is being misapplied. We use the theory to correct the practice, not to excuse it." (This is weak, but it's the best you have without abandoning the thesis).
