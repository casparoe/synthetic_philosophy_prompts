      *   *Refinement on the Analyst's point:* The analyst mentions "top of a noisy number is mostly noise." This is specifically **Regressional Goodhart** (selecting for luck).
      *   *Refinement on the Philosophical point:* The user asks, "In what sense is the measure still wrong?" I need to explain *Construct Validity*. The measure is no longer a valid proxy for the underlying construct (Quality of Care).

