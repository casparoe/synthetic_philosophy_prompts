answer: |-
  **Recommendation**

  **Decision:** Exclude deaths from comprehensive economic sanctions from the headline "Violent Deaths" index. Track them in the separate companion series on structural and policy-induced mortality.

  **Closest Analog:** The exclusion of deaths from preventable disease and malnutrition resulting from government policy, *not* the inclusion of sieges.

  **Reasoning**
  Your institute's precedents hinge on a distinction between **harm as a weapon** and **harm as a side effect**. 

  1.  **The Siege Distinction:** You include siege deaths because the deprivation of food and water is the *mechanism of coercion* intentionally applied to the population. The harm is constitutive of the strategy. 
  2.  **The Policy Distinction:** You exclude preventable disease and malnutrition arising from policy because, while the deaths are foreseeable, the policy is not *aimed at harm*. 
  3.  **Application to Sanctions:** Comprehensive sanctions fit the latter category. The stated aim is regime behavior change; the mechanism is economic pressure. The resulting malnutrition and mortality are foreseeable collateral damage, not the direct instrument of force. To include them would require collapsing the distinction you established when excluding traffic fatalities and unsafe working conditions (both foreseeable, policy-influenced, but not direct acts of force).

  Colleague A's argument (consistency with sieges) fails because it conflates *outcome* (starvation) with *intent* (starvation as a weapon vs. starvation as a byproduct). Colleague B's argument (slippery slope) is valid; if you count sanctions, you lack a principled basis to exclude austerity measures or climate inaction that also produce foreseeable excess mortality through economic channels.

  **The Rule**
  This decision commits you to the **"Direct Intent of Harm" Rule**: 
  > *A death counts as violent for the headline index only if the harm is inflicted either through direct kinetic force or through deprivation intentionally used as the primary mechanism of coercion against the victims. Foreseeable mortality resulting from economic coercion, where deprivation is a side effect rather than the weapon, is excluded.*

  **Normalization**
  For the companion series, you should count these deaths **per capita**. Your institute's methodological commitment is to normalize for population growth to avoid making the past look artificially peaceful. Abandoning this for the companion series would create inconsistency in your long-run trend analysis, even if the category remains separate from the headline index.

  **Fact vs. Stipulation**
  There is no "fact of the matter" on whether these deaths are "really" violence. Violence, in the context of your database, is an **operational stipulation**. You have already established this precedent by deciding that legality does not equal nonviolence (including executions) and that structural violence belongs in a separate series. This is a measurement boundary, not a metaphysical discovery.

  **Underdetermination and the Distinguishing Case**
  While the "Direct Intent" rule resolves the current tension, your record is slightly underdetermined regarding *evidence of intent*. Governments rarely admit to aiming at civilian harm. The line between a "siege" and "sanctions" can blur if sanctions are designed to be so comprehensive they function as a siege without walls.

  To future-proof this rule, the board should define a **Distinguishing Case**: 
  *   **Scenario:** A sanction regime that explicitly exempts food and medicine but collapses the banking sector required to import them (Current Sanctions) **VS.** A sanction regime that explicitly places embargoes on food, medicine, or the infrastructure required to distribute them (Targeted Sanctions).

  If the board ever encounters the latter (explicit embargoes on humanitarian goods), the "Direct Intent" rule would shift the classification to **Include** in the headline index, aligning it with the Siege precedent. This distinction protects you from the slippery slope while maintaining consistency with your inclusion of sieges.
