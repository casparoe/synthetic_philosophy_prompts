      *Actually, looking closer:* "We excluded deaths from preventable disease... even when they are foreseeable consequences of government policy... [because they] are not the product of a single deliberate policy aimed at harm."
      Sanctions *are* a single deliberate policy. Are they *aimed at harm*? The prompt says "sanctioning governments... say their aim is to change a regime's behavior."
      So, is harming the population the *aim* or the *means*? In a siege, harming the population (via starvation) is the *means* to force surrender. In sanctions, economic strangulation is the means, population suffering is the *side effect* of that strangulation.
