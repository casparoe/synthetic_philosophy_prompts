      *   *Slippery Slope:* Including sanctions makes it hard to exclude austerity or climate inaction without arbitrary line-drawing. Excluding them maintains the "direct force/intentional deprivation" boundary.
      *   *Per Capita vs. Absolute:* Since they are excluded from the main index, this is secondary, but for the companion series, per capita is consistent with the institute's normalization philosophy for long-run trends.
      *   *Fact vs. Stipulation:* It is a stipulation. "Violence" in this context is an operational definition for measurement, not a metaphysical truth.

