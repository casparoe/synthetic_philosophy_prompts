      *   (4) is likely targeting the view that "but" has a truth-conditional sense AND a pragmatic sense.
      *   So (3) + (4) = "But" has one sense: [AND + CI].
      *   This is consistent.

      *   **Final Plan:**
          *   Validate the Gricean core (1, 2, 5).
