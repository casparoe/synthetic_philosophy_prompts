answer: |-
  This is a robust, classically Gricean set of commitments with a specific leaning toward Conventional Implicature (CI) for connectives. You are effectively positioning yourself as a **Gricean Semanticist**: you keep the Gricean machinery for scalar implicatures (5) and the definition of speaker meaning (1), but you block the pragmatic reduction of connectives like "but" (3), treating them as semantically encoded (likely as CIs) rather than calculated.

  Overall, this is a defensible and coherent position (akin to Potts or Grice's later views). However, there is a significant friction point regarding the role of **intention** in your theory of meaning, and a terminological risk regarding **literal content**.

  Here is the consistency check, ordered by severity.

  ### 1. The Intention Clash: (1) vs. (3)
  **Severity: High**
  *   **The Tension:** (1) defines speaker meaning *constitutively* via reflexive intention. (3) explicitly states the contrast of "but" belongs to standing meaning *"rather than to anything the speaker intends."*
  *   **The Problem:** If the contrast is communicated (which it is), but it is not intended (per 3), how does it enter the communicative exchange? If I utter "but" by pure accident (a slip of the tongue with no intention to convey contrast), does the contrast exist? (3) implies yes (it's standing meaning). (1) implies that without the intention, there is no *speaker meaning*.
  *   **What has to give:** You cannot maintain that communicated content is *totally* independent of speaker intention while holding a Gricean view of communication (1). Even Conventional Implicatures must be *intended to be invoked*, even if their content is not *inferred* via maxims.
  *   **The Cost:** You must concede that the speaker *does* intend to invoke the conventional meaning of "but." You lose the hard semanticist claim that the contrast exists *regardless* of intention.
  *   **Why it matters:** A reading group member will ask: "If I say 'but' ironically, or mistakenly, do you still attribute the contrast to my speaker meaning?" Your current (3) says yes; your (1) says no.

  ### 2. The "Literal" vs. "Standing" Ambiguity: (3) vs. (5)
  **Severity: Medium**
  *   **The Tension:** (5) claims you are "not a contextualist about literal content." (3) claims "but" contrast is "standing meaning" that "survives negation."
  *   **The Problem:** In most post-Gricean literature, "literal content" is synonymous with truth-conditional content. Content that "survives negation" (projects) is typically *not* truth-conditional (it's CI).
  *   **What has to give:** You need to clarify your terminology. If "standing meaning" includes non-truth-conditional conventions (CI), then (3) posits semantic content that is *not* "literal content" in the truth-conditional sense used in (5).
  *   **The Cost:** You must distinguish *Sentence Meaning* (Standing) from *Literal/Truth-Conditional Content*. If you conflate them, (3) and (5) contradict (one says contrast is semantic/standing, the other implies only TC content is literal/standing).
  *   **Why it matters:** If you claim "but" contrast is part of the "literal content," you invite attacks on truth-conditionality (e.g., "Is 'p but q' false if there is no contrast?"). If you say it's "standing meaning" but *not* "literal," you are safe, but you must be precise.

  ### 3. The Polysemy Worry: (3) vs. (4)
  **Severity: Low (Apparent Tension)**
  *   **The Tension:** (3) says "but" carries contrast in its standing meaning. (4) says "resist... 'but' adds a second sense."
  *   **The Problem:** It might *appear* that giving "but" a contrastive semantic component multiplies senses compared to "and."
  *   **Resolution:** This is consistent provided (4) is read as a constraint against *polysemy* (context-dependent ambiguity), not against *semantic richness*. You are claiming "but" has **one** stable sense ([AND + CONTRAST]), not two.
  *   **The Cost:** None, provided you clarify that (4) targets ambiguity, not semantic complexity.

  ### 4. The Implicature Taxonomy: (2) vs. (3)
  **Severity: None (Consistent)**
  *   **The Tension:** (2) defines *Conversational* Implicature (CI*) via calculability/non-detachability. (3) notes "but" is detachable/non-calculable.
  *   **Resolution:** This correctly classifies "but" contrast as **Conventional Implicature** (or semantic), distinct from the *Conversational* Implicature defined in (2). This is a feature, not a bug. It shows you understand the Gricean taxonomy.

  ---

  ### The Cheapest Way to Make the Set Consistent

  The set is 90% consistent. The friction is entirely in the phrasing of **(3)** regarding intention. You are trying to protect the *conventionality* of "but" by denying the *intentionality* of the contrast. You don't need to deny the intention; you only need to deny the *inferential mechanism*.

  **The Single Revision:**
  Revise **(3)** to acknowledge that the speaker intends to invoke the convention, even if the content is not derived via reflexive inference about that intention.

  **Current (3):**
  > "The contrast carried by choosing 'but' over 'and', and the like, is genuine, but it belongs to the standing meaning of the sentence **rather than to anything the speaker intends**: it is detachable, it is not calculable from the maxims, and it survives under negation and embedding."

  **Proposed Revision:**
  > "The contrast carried by choosing 'but' over 'and', and the like, is genuine, and it belongs to the standing meaning of the sentence **encoded by convention rather than calculated via maxims**: it is detachable, it is not calculable from the maxims, and it survives under negation and embedding."

  **Why this cleans up the most:**
  1.  **Preserves (1):** It removes the claim that the contrast is *unintended*. You can intend to use a word according to its convention without that content being a *conversational implicature*. This aligns "but" with Conventional Implicature (which is meant, but not calculated).
  2.  **Preserves (2):** It keeps the distinction between "calculated via maxims" (Conversational) and "encoded by convention" (Conventional/Standing).
  3.  **Preserves (4):** It treats "but" as having a single conventional sense, not a context-dependent pragmatic one.
  4.  **Avoids the "Magic Meaning" Trap:** It prevents the objection that meaning can exist without *any* speaker intention (which undermines the Gricean framework of (1)).

  **Summary for your Reading Group:**
  "I am a Gricean about communication and scalar implicatures, but I treat connectives like 'but' as carrying Conventional Implicature. My commitment to intention-based speaker meaning (1) applies to *what is communicated*, but I distinguish between content *inferred* from intention (Conversational) and content *encoded* by convention and intended to be recognized as such (Conventional). My revision to (3) clarifies that while the contrast isn't calculated, it is still intended via the choice of conventional vehicle."
