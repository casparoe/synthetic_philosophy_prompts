answer: |-
  # A Dichotomous Key for the Taxonomy of *a*

  **Instructions:** Begin at Couplet 1. Answer the question based on your intuition about the case presented. Follow the directive to the next Couplet or to a Terminal Leaf. The key sorts philosophical positions by their commitments to specific cases, not by their preferred terminology.

  **1a.** Consider a historical script (e.g., Phoenician *aleph*) where the ancestor of *a* looks nothing like the modern letter but is historically continuous with it. Is this ancestor an instance of the letter *a*?  
  → **Yes:** Go to Couplet 2.  
  → **No:** Go to Couplet 3.

  **2a.** Consider an invented alphabet containing a glyph that looks exactly like *a* but functions as a different letter and has no historical link to Latin. Is *this* glyph an instance of *a*?  
  → **Yes:** **Disjunctive Pluralism**. *Awkward commitment: A mark can be *a* solely by descent even if it looks like /k/, and solely by shape even if it descends from /k/; the category has no unifying principle.*  
  → **No:** **Historical/Cladistic Descent**. *Awkward commitment: A perfect visual copy of *a* is not *a* if it was invented five minutes ago without lineage.*

  **3a.** Consider the invented alphabet case again (looks like *a*, functions as /k/, no history). Is this glyph an instance of *a*?  
  → **Yes:** Go to Couplet 4.  
  → **No:** Go to Couplet 6.

  **4a.** Consider a machine-generated form that satisfies all structural features of *a* but that no human has ever seen. Is it an *a*?  
  → **Yes:** Go to Couplet 5.  
  → **No:** **Perceptual Phenetics**. *Awkward commitment: If no one sees it, it isn't *a*, even if it matches the rules; similarity requires a perceiver to exist.*

  **5a.** Consider the single-storey and double-storey forms of *a*, or a typeface in which *a* is barely distinguishable from *o* except for a small tail. Do these share a single necessary geometric essence, or is one a deviation?  
  → **One is a deviation:** **Typological Essentialism**. *Awkward commitment: One of these common forms is technically a mistake or imperfect copy of the true *a*.*  
  → **Neither is a deviation:** **Population Thinking**. *Awkward commitment: The 'letter' is a cloud of variation; the 'essence' is an statistical average that no actual mark possesses.*

  **6a.** Consider a logo or mark that is read as *a* only because of its context (e.g., in the word 'cat'), though in isolation it looks like a circle. Is it *a*?  
  → **Yes:** Go to Couplet 7.  
  → **No:** **Strict Nominalism**. *Awkward commitment: Marks have no identity outside explicit naming; context and usage are irrelevant to the mark's nature.*

  **7a.** Consider a child's reversed or malformed *a*. Is there a determinate fact of the matter whether it is *a*, or is the question void?  
  → **The question is void:** **Eliminativism**. *Awkward commitment: 'Letter *a*' is a useful fiction; reality contains only ink and neural firings, no letters.*  
  → **There is a fact:** Go to Couplet 8.

  **8a.** In the case of the child's malformed *a*, does it fail to be *a* because it cannot perform the reading role, or is it still *a* despite the failure?  
  → **Fails to be *a*:** **Functionalism**. *Awkward commitment: A mark ceases to be *a* if the reader is illiterate or the ink is smudged, as the 'role' is broken.*  
  → **Still *a*:** **Intentionalism (Hybrid)**. *Awkward commitment: A mark is *a* if intended as such, even if it functions as /b/ to the reader; mental states override physical function.*

  ***

  **Note on Unexplored Combinations:**  
  The tree does not produce a leaf for a view that claims historical descent is necessary (Couplet 1a: Yes) but visual form is irrelevant (Couplet 2a: No). This combination is flagged as **unattractive**: it implies a mark could change its shape entirely over time yet remain *a*, while a perfect copy is not *a*, rendering visual recognition inexplicable.  

  **Note on Indistinguishable Leaves:**  
  **Perceptual Phenetics** and **Population Thinking** are separated here by the mind-independence of the form (Couplet 4a). However, if one holds that statistical norms exist only in the mind of the observer, these two leaves collapse. They are flagged as **potentially conflated** depending on one's ontology of statistics.
