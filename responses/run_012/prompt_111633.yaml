answer: |-
  **Brainstorm: Carving the Space**
  Before we label, we need observable cuts. The ladder conflates *mechanism* (how it works) with *history* (how it evolved). To sort cases, ask:
  1.  **Plasticity:** Does the system adjust its behavior within its own operational lifetime?
  2.  **Cost:** Does adjustment require suffering the actual consequences of an action (pain, failure, reward)?
  3.  **Scaffolding:** Does the system rely on external artifacts (words, paper, tools) to simulate outcomes before acting?

  **The Decision Tree**

  *   **Node 1:** Does performance improve over repeated exposures without genetic/structural redesign?
      *   *No:* **Darwinian** (Selection happened before existence).
      *   *Yes:* Go to Node 2.
  *   **Node 2:** Does improvement require executing the action and experiencing the outcome?
      *   *Yes:* **Skinnerian** (Selection happens via actual consequences).
      *   *No:* Go to Node 3.
  *   **Node 3:** Does the system reject bad options by manipulating culturally transmitted symbols or tools (language, paper, code)?
      *   *Yes:* **Gregorian** (Selection offloaded to cultural scaffolding).
      *   *No:* **Popperian** (Selection happens via internal modeling).

  **Placing the Cases**

  *   **Slime Mold:** *Darwinian.* It routes around obstacles via chemical tropisms. No lifetime learning; physiology is pre-wired by selection.
  *   **Rat in Skinner Box:** *Skinnerian.* Learns lever-pressing only after receiving pellets shocks. Needs actual consequences.
  *   **Songbird:** *Skinnerian.* While song templates are innate, refinement requires auditory feedback and practice (trial and error).
  *   **Crow (Wire Hook):** *Popperian.* Solves novel problems via insight. It manipulates the wire mentally (or via quick physical testing) without prior reinforcement history for that specific shape.
  *   **Chess Engine:** *Popperian.* It simulates millions of move sequences internally ("letting ideas die") without playing them out on the board.
  *   **Kid (Long Division):** *Gregorian.* Cannot solve the problem without pencil, paper, and learned algorithms. The thinking is offloaded.
  *   **Chatbot:** *Darwinian.* During inference, weights are frozen. It does not learn from the conversation; it executes a fixed map selected during training.

  **The Worry: Offloading and Overlap**

  You asked if offloading simulation onto paper makes one Popperian or Gregorian. My tree forces a choice: if the simulation *requires* the paper, it is Gregorian. But this reveals a flaw: **Gregorian is not a distinct cognitive architecture; it is a Popperian creature equipped with tools.** A kid doing math in their head is Popperian; with paper, they become Gregorian. The rung isn't a new kind of mind, but a new *ecology* for the same mind.

  **Failures to Separate:**
  1.  **Chatbot vs. Slime Mold:** Both are classified as Darwinian here because neither learns during operation. Yet the Chatbot mimics Popperian reasoning linguistically. The tree cannot distinguish "simulated intelligence" from "physiological reflex" based on observation alone.
  2.  **Popperian vs. Gregorian:** The boundary is porous. If a crow uses a tool it invented itself, is it Popperian. If it uses a tool another crow invented, is it Gregorian? Observing tool use doesn't reveal the cultural transmission history required to confirm the Gregorian label.

  **Verdict:** The ladder does double duty. "Popperian" describes a capacity (internal simulation); "Gregorian" describes a resource dependency (culture). They are not mutually exclusive rungs. A Gregorian creature *is* a Popperian creature that has colonized external storage. Treat Gregorian not as a step up, but as a Popperian mind extended into the world.
