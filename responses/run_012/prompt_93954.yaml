answer: |-
  To resolve the tension between effective outreach and ethical integrity, your team needs a decision procedure grounded in the principle of respect for agency, which distinguishes legitimate persuasion from manipulation by asking whether the message facilitates a reasoned choice or bypasses reasoning through deception or exploitation. This procedure, called the Agency Integrity Check, is designed to be completed in twenty minutes by a designer without philosophical training and relies on four sequential gates that move from factual verification to value judgment. The first gate asks whether every claim made in the message is literally true and whether any omitted information would materially change the recipient's decision if known. If the answer is no, the message is rejected immediately because literal truth that creates a false impression is the definition of deception. If the answer is yes, the designer proceeds to the second gate, which asks whether the path to refusing the offer is as visible and frictionless as the path to accepting it. This ensures that inertia is not being weaponized against the recipient. If the refusal path is hidden or difficult, the message stops unless the friction is mandated by law, in which case it must be sent to General Counsel to confirm the statutory requirement. If the refusal path is clear, the designer moves to the third gate, which asks whether any examples, testimonials, or social norms imply a probability of success or a typical outcome that contradicts aggregate data. This is the critical filter for emotional or social pressure tactics. If an example is real but unrepresentative in a way that suggests a typical result, the message is rejected immediately because it exploits the availability heuristic to create false expectations. If the example is representative or clearly framed as an outlier, the designer proceeds to the fourth gate, which asks whether the team would be comfortable explaining the specific tactic used on the front page of a newspaper or in a legislative hearing. If the answer is no, the decision is handed to the Communications Director because this is a question of reputational values rather than factual ethics. If the answer is yes, the message is approved for shipment.

  When we apply this procedure to the three messages currently in front of us, the results clarify where our ethical boundaries lie. The social-norm line stating that most households in the county have claimed the credit passes the first gate because the claim is accurate, and it passes the second gate because claiming or not claiming remains equally accessible. It passes the third gate because aggregate data about county behavior is inherently representative of the group being described, even if you selected that specific county statistic because it tested best, provided the text does not imply that claiming is mandatory or that the credit is guaranteed. It likely passes the fourth gate as well, since peer comparison is a standard and defensible public health and finance tactic, so this message ships. The default pre-enrollment in the savings plan passes the first gate as the terms are accurate, and it passes the second gate because you specified they may leave at any time, meaning the exit friction is low. It passes the third gate because a default does not imply a success rate, it merely sets a starting position. It may trigger discomfort at the fourth gate for some designers, but since opt-out defaults are standard policy in many jurisdictions, this likely goes to the Communications Director for a value call on paternalism, but it does not trigger a hard no. The real but unrepresentative and moving personal testimonial, however, fails at the third gate. Because the testimonial was chosen specifically because a plainer one tested worse, and because it is unrepresentative, it inevitably implies a higher likelihood of success or a typicality of experience that the aggregate data does not support. This exploits the recipient's inability to distinguish between an existence proof and a probability statement. Under this procedure, this message is a no, and it will not ship. I anticipate your team will hate this because storytelling is a powerful tool in their arsenal, but the procedure identifies it as manipulating expectations rather than informing choice.

  This procedure cannot do the work of moral courage for you, and it will misfire in the hands of a designer who is motivated to find a yes rather than find the truth. The weakest point is the third gate regarding representativeness, because a designer can always argue that a testimonial is meant to be inspirational rather than statistical, thereby rationalizing that it does not imply a probability. A designer wanting to ship the unrepresentative testimonial can claim the emotional resonance is the goal, not the implication of success, and unless you have a rigid rule that bans unrepresentative success stories entirely, this loophole remains open. Similarly, the fourth gate relies on the designer's imagination of public scrutiny, but a motivated designer can convince themselves that the public would understand the nuance of their tactic when in reality the public would feel betrayed. The procedure also cannot account for cumulative effects, so a message that passes on its own might contribute to a broader sense of harassment when combined with the other eleven messages sent that month. Finally, the procedure assumes the designer answers the questions honestly, but if the culture rewards shipping over scrutiny, the Agency Integrity Check will become a box-ticking exercise where every answer is massaged until it fits the desired outcome. You must audit the audits, because a tool designed to protect agency can itself be manipulated if the incentive structure rewards conversion above all else.
