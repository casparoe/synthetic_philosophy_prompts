  3.  **Brainstorming Commitments:**
      *   If AU holds, the AI cannot be "smarter than it says it is" in a way that matters for safety.
      *   If AU implies Dominance, the AI's internal representation must be universally compatible with *our* ascriptions.
      *   It commits to the idea that "belief" is a coherent property to ascribe to neural nets (or whatever substrate).
      *   It commits to the idea that there is a "best" ascription relative to an epistemic state.

  4.  **Developing Defeaters (The Stress Test):**

      *   *Defeater 1: The Compressibility/efficiency gap (Resource Bounds).*
          *   *Idea:* The AI might know $P$, but explaining $P$ in human-ascribable terms requires exponential compute. The AI's "explicit belief" might be a compressed vector that *implies* $P$ but doesn't *state* $P$ in a way we can verify without simulating the AI.
          *   *Impact:* Breaks the "Dominance" claim. The AI is epistemically superior, but its *explicit* beliefs (in our language) are weaker.
          *   *Status:* Live, Fatal to Dominance, Awkward for Honesty.

      *   *Defeater 2: The Ontological Mismatch (Alien Concepts).*
