      *   *Intuition:* If I can attribute a belief $P$ to the AI using *any* interpretive lens (behavioral, structural, etc.), the AI should also "believe" $P$ (or something stronger) in its explicit reasoning. It prevents "hidden knowledge" or "deceptive alignment" where the AI knows $X$ but says $Y$.
