answer: |-
  Here is a comparison of the two frameworks, structured around the four points you specified, followed by a verdict on the current research and an analysis of your "inverted values" test case.

  ### 1. The Strength of Similarity: Identity vs. Correlation
  **Hofstadter's Superrationality** relies on a strong assumption of identity. In the canonical telling, the agents are not merely similar; they are effectively instantiations of the same algorithm facing the same input. Hofstadter's logic rests on the idea that there is only one correct solution to a rational problem. Therefore, if you are rational, and your counterpart is rational, and you both see the same problem, you *must* arrive at the same answer. The symmetry is binary: either you are the same reasoner, or the logic does not apply.

  **Evidential Cooperation in Large Worlds (ECL)** weakens this requirement significantly. It does not demand that agents be identical, only that their decision-making processes be *correlated*. You can be a human using heuristics, and the other agent can be an AI using a neural network, provided that there is a probabilistic link between your outputs. If your deliberation makes it 60% more likely that they will take a corresponding action, ECL can theoretically harness that 60%. It survives with agents who reason by different methods, provided those methods are functionally aligned enough to produce correlated behavior in the relevant context.

  ### 2. Divergence in Values: Common Payoff vs. Gains from Trade
  **Hofstadter's Superrationality** is typically framed within a symmetric Prisoner's Dilemma where both agents share the same payoff matrix. The goal is to maximize a common utility function. The "cooperation" is simply the recognition that mutual defection is suboptimal for the shared goal. The decision rule is: "Choose the strategy that, if adopted by everyone, maximizes our common payoff."

  **ECL** is explicitly motivated by the *divergence* of values. This is the crucial innovation. In the ECL framework, the other agents care about things you do not care about (and vice versa). The decision rule changes from "maximize our common payoff" to "maximize a weighted sum of all values, where the weights are determined by the strength of the evidential correlation." You sacrifice local utility (doing something you don't intrinsically value) to create evidence that agents elsewhere will sacrifice local utility to do what you value. The divergence in values does not just change the size of the prize; it changes the *currency* of the interaction. You are no longer coordinating on a single outcome; you are trading influence across value systems.

  ### 3. The Role of Largeness: Dyad vs. Aggregate
  **Hofstadter's Superrationality** works perfectly well with exactly two agents. The logic is about the *type* of reasoning, not the volume of agents. If two superrationalists face each other, the symmetry holds regardless of whether there are billions of others in the universe. The force of the argument comes from logical necessity, not statistical aggregation.

  **ECL** *requires* the largeness of the world to function as a practical guide. Because ECL often involves acting against your local preferences (to help agents with different values), there is a local cost. In a universe with only one other correlated agent, the risk that the correlation fails or that the trade is unfavorable might outweigh the benefit. In a "large world" (potentially infinite), the law of large numbers applies. You are trading with a vast population of counterparts. Even if the correlation with any single one is weak, the aggregate expected value of influencing the multiverse can dwarf the local cost. Without the "many," the evidential coupling is often too fragile to justify the sacrifice.

  ### 4. Decision Theory Dependence: Implicit vs. Explicit
  **Hofstadter's Superrationality** is often presented as a form of rationality that transcends standard decision theory, though it is functionally equivalent to **Evidential Decision Theory (EDT)**. Hofstadter argued that causal decision theory (CDT) was insufficient for these cases, but he did not formalize it as such. He treated the correlation as a "logical causality."

  **ECL** is explicitly built on **EDT** (or its modern descendant, Functional Decision Theory). It openly admits that there is no causal link between you and the distant agents. It argues that you should condition your choice on the evidence it provides about their choices. A CDT agent would reject ECL entirely, viewing the correlation as spurious and refusing to pay the local cost. ECL does not claim to be available to anyone; it is available only to agents who accept that evidential correlations are decision-relevant.

  ***

  ### The Verdict: What Are They Running?
  The researchers you are observing are running **Evidential Cooperation in Large Worlds (ECL)**, not Hofstadter's original Superrationality.

  While they use the term "superrationality" occasionally for historical continuity, their work is distinctively ECL. You can tell this because their papers focus heavily on "gains from trade" between different value systems and the "size of the universe" as a multiplier for expected value. Hofstadter's version is a logical puzzle about symmetry; the researchers' version is a cosmological strategy for influence. They are taking Hofstadter's intuition, stripping away the requirement for identical payoffs, and scaling it up to the multiverse.

  ***

  ### The Test Case: The Inverted Counterpart
  You asked about a counterpart in a causally disconnected region who is your equal in reasoning but whose values are the **exact inversion** of yours (they want what you avoid, and vice versa). This is the sharpest possible wedge between the two ideas.

  **Hofstadter's Superrationality** struggles to yield a determinate answer here. Superrationality relies on the premise that "what is good for me is good for you" because you are the same agent type facing the same problem. If your values are inverted, you are no longer facing the *same* problem in terms of utility. You are in a zero-sum conflict. Hofstadter's logic of "we must choose the same strategy" breaks down because the strategy "Cooperate" no longer implies a mutual benefit. If you "Cooperate" (help them), and they "Cooperate" (help themselves/hurt you), you lose. The symmetry of reasoning remains, but the symmetry of interest is gone. Superrationality effectively dissolves into a stalemate or defaults to competition.

  **ECL**, however, can process this case mathematically. ECL asks: "Does adopting this policy increase my expected utility across the large world?"
  1.  **Correlation:** You reason alike, so your actions are correlated.
  2.  **Values:** Their utility function is $-U$ (where yours is $U$).
  3.  **Calculation:** If you sacrifice local utility to help them, the evidential coupling suggests they will sacrifice local utility to help *themselves* (which hurts you).
  4.  **Result:** The expected value of cooperation is negative. ECL explicitly tells you **not** to cooperate with this specific counterpart.

  **Do they agree?**
  In the outcome, yes: both advise against cooperation.
  **Do they come apart?**
  Yes, in the *reasoning*. Hofstadter's framework breaks because the precondition of shared interest is violated. It has no mechanism to calculate "negative cooperation." ECL's framework holds; it calculates the correlation, applies the value function, and outputs a "Defect" recommendation. ECL survives the hostility; Superrationality evaporates.

  **However,** there is a nuance you should note for your feature. ECL is most powerful not when values are *inverted*, but when they are **orthogonal** (you care about Stars, they care about Stripes). In the Inverted Case (Zero-Sum), ECL says "No Trade." In the Orthogonal Case (Non-Zero-Sum), ECL says "Trade." Hofstadter's Superrationality cannot easily distinguish these; it assumes the game is a Prisoner's Dilemma (mutual gain possible).

  ### Which is More General?
  **Evidential Cooperation in Large Worlds is the more general theory.**

  Hofstadter's Superrationality is a special case of ECL where:
  1.  The correlation is perfect (identity).
  2.  The payoff structures are identical (common values).
  3.  The number of agents is irrelevant (logic holds for $N=2$).

  ECL relaxes all three constraints. It handles probabilistic correlation, it handles divergent values (calculating when to trade and when not to), and it leverages the large world to make the trade mathematically robust. Your "inverted values" case shows that ECL is robust enough to tell you when *not* to cooperate, whereas Superrationality is a heuristic that assumes cooperation is always the goal. For a feature on cooperation without communication, ECL is the more accurate description of the frontier science you are investigating.
