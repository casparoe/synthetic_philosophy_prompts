answer: |-
  There is no single canonical name for the combined phenomenon, though bioethicists classify the first pattern as the "Asymmetry of Precedent Autonomy" and the second as the "Problem of Psychological Continuity," so I will coin the unified operational term **"The Diachronic Authority Filter."**

  The first pattern you observe is a specific instantiation of the **Asymmetry of Precedent Autonomy**, rooted in the distinction between negative and positive liberty. In law and ethics, the right to refuse treatment (negative liberty) is nearly absolute, whereas the right to demand treatment (positive liberty) is constrained by medical judgment and resource allocation. When a competent patient refuses care in advance, they exercise a negative right that creates a permanent shield against battery; a later incompetent self cannot waive this shield because they lack the capacity to consent to what was previously defined as harm. Conversely, when a competent patient requests care in advance, they create a positive claim that cannot override the current bodily integrity of an incompetent patient who is actively resisting (a current refusal). Thus, a "No" carries more temporal weight than a "Yes" because refusing harm is prioritized over securing benefit. This is not merely "autonomy as refusal," but specifically the **priority of non-maleficence over beneficence across time.**

  The second pattern tracks the **Problem of Psychological Continuity**, specifically the distinction between **pathological vs. authentic transformation.** When the change in the patient is due to disease (dementia, psychosis), the ethical consensus treats the earlier self as the "true" agent because the later self's preferences are viewed as symptoms of the pathology rather than authentic choices. Here, **Critical Interests** (Dworkin's term for life-defining values set by the competent self) override **Experiential Interests** (current comfort). However, when the change is due to growth (sobriety, recovery), the later self is viewed as *more* authentic than the earlier one; the earlier preferences are reclassified as products of a constrained or impaired agency (addiction, depression). In these cases, the **Narrative Identity** of the patient is seen as evolving toward greater autonomy, so the later self supersedes the earlier one.

  **The Diachronic Authority Filter** combines these into a two-step test for sorting contested cases:

  1.  **The Authenticity Gate (Identity):** Determine whether the change in the patient's values is *Pathological* (loss of capacity/function) or *Authentic* (growth/recovery).
      *   If **Pathological**, authority remains with the **Earlier Competent Self**.
      *   If **Authentic**, authority transfers to the **Later Self** (even if currently impaired, provided the impairment doesn't negate the specific choice).
  2.  **The Liberty Gate (Direction):** Once authority is assigned, apply the weight of the choice.
      *   A **Refusal** from the Authorized Self is binding (Veto).
      *   A **Request** from the Authorized Self is presumptive but can be overridden by a Refusal from the *Unauthorized* Self if enforcing it causes immediate distress (battery).

  **Where existing concepts stop fitting:**
  *   **Ronald Dworkin's "Critical Interests":** Fits the Decline/Pathological cases perfectly (Past Self wins) but fails the Growth cases, as Dworkin argues the earlier competent self should *always* bind the later self, regardless of transformation.
  *   **Rebecca Dresser's "Current Interests":** Fits the Growth cases and the "Present Refusal overrides Past Request" scenario, but fails the Decline cases where you honor the Past Refusal over Present Consent.
  *   **Standard "Right to Refuse":** Explains why a "No" wins, but fails to explain why a Past "No" wins over a Present "Yes" in decline cases, while a Past "Yes" loses to a Present "No."

  **Sorting Example:**
  *   *Case:* Patient previously refused dialysis (Competent). Now demented (Pathological), asks for dialysis.
      *   Authenticity Gate: Pathological → Authority = Past Self.
      *   Liberty Gate: Past Refusal (Veto) vs. Present Request.
      *   Result: **No Dialysis.** (Past Refusal wins).
  *   *Case:* Patient previously requested life support (Competent, depressed). Now recovered (Authentic), refuses life support.
      *   Authenticity Gate: Authentic → Authority = Present Self.
      *   Liberty Gate: Present Refusal (Veto).
      *   Result: **No Life Support.** (Present Refusal wins).
  *   *Case:* Patient previously refused feeding tube (Competent). Now sober after alcoholism (Authentic), asks for feeding tube.
      *   Authenticity Gate: Authentic → Authority = Present Self.
      *   Liberty Gate: Present Request vs. Past Refusal.
      *   Result: **Feeding Tube.** (Present Authority overrides Past Refusal because the Past Self is deemed obsolete).

  This framework clarifies that your team is not just weighing autonomy, but adjudicating **which version of the person holds the license to be autonomous.**
