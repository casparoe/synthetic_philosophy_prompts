answer: |-
  This is a really sharp distinction you have drawn, and you are right to sense that the obligation surrounding the decorative conventions is philosophically slippery compared to the load-bearing ones. The reason you are circling this prompt is likely because you are bumping up against the difference between a moral obligation grounded in consequences and one grounded in relationship or social ontology. To give you the strongest case that a visitor is actually obliged to follow decorative conventions, you have to move away from the idea that the obligation comes from the specific outcome of the single act and instead look at the act as a participation in a shared system of coordination. The argument here is that conventions, even decorative ones, function as a low-cost signaling system that reduces social friction and cognitive load for everyone involved. When you enter a community as a visitor, you are effectively borrowing their social infrastructure. If you ignore the decorative rules, you are forcing the locals to constantly recalculate their expectations about your behavior. While standing on the wrong side of the escalator might not physically injure anyone, it introduces a micro-uncertainty into the flow of movement. The strongest case for obligation rests on a principle of fair play or non-imposition: since you benefit from the predictability that conventions provide generally, you have a duty to uphold the conventionality of the system even in its trivial aspects. If everyone treated decorative conventions as optional because they are arbitrary, the distinction between decorative and load-bearing would blur, because the reliability of the signaling system would degrade. Therefore, the obligation exists not because breaking the rule causes direct harm in that instance, but because treating the rule as binding maintains the integrity of the cooperative scheme you are entering. It is an obligation to be legible to others, to minimize the cognitive tax you impose on strangers who are trying to navigate around you, and to acknowledge that your autonomy is temporarily constrained by the host community's established patterns of life.

  However, the strongest case against this obligation, and the one that suggests you are merely seeing politeness wearing obligation's clothes, relies on a stricter definition of moral agency and the nature of arbitrariness. If a convention is truly decorative, then by definition it serves no functional purpose other than social signaling. If I stand on the left of the escalator and someone has to walk around me, they are inconvenienced, but they are not wronged in any substantive sense. The argument here is that morality should concern itself with welfare, rights, and justice, not with adherence to arbitrary local customs that have no basis in utility. To claim there is an obligation to follow decorative conventions risks moralizing etiquette, turning social faux pas into moral failures. If the rule is arbitrary, then my reason for following it can only be prudential or aesthetic, not moral. I might choose to follow it to be polite, or to avoid awkwardness, or to show respect, but these are virtues of character, not duties of obligation. The visitor retains their moral autonomy, and unless their actions infringe on another's rights or set back another's interests, they are free to disregard local customs that they find silly. To say otherwise is to grant the host culture a kind of moral authority over the visitor that they have not earned, essentially demanding conformity for the sake of conformity. On this view, the pressure to comply is real, but it is social pressure, not moral obligation, and conflating the two dilutes the meaning of moral responsibility.

  The real conceptual action, and where I think your suspicion is correct, lies in precisely where the load-bearing versus decorative line diverges from the harm versus no-harm line. You suspected they are not the same line, and the reason is that load-bearing conventions are defined by their functional necessity within a system, whereas harm is defined by the impact on an individual's welfare. A convention can be load-bearing without causing immediate harm in a specific instance, and a convention can be decorative while still causing minor harm. For example, jaywalking when there is no traffic is decorative by your definition because it signals outsider status and doesn't change the outcome for drivers, but it could still be argued to cause a tiny amount of anxiety to a watcher, which is a form of psychological harm. Conversely, not tipping a waiter is load-bearing because it affects their income, but if the waiter is wealthy and doesn't need the tip, the harm is negated while the convention remains load-bearing. The divergence is that load-bearing refers to the structural role the rule plays in maintaining a cooperative equilibrium, while harm refers to the consequentialist output of breaking it. The obligation for the visitor likely stems from the structural role rather than the immediate harm. When you follow a load-bearing convention, you are preventing systemic failure. When you follow a decorative convention, you are maintaining systemic coherence. The obligation exists in both cases, but it is an obligation to the system of coordination itself, not necessarily to the specific individuals you encounter. This explains why we feel obliged to follow decorative rules even when no one is visibly hurt: we are honoring the implicit contract of social coordination that makes collective life possible. The harm line is too narrow because it misses the cost of uncertainty and the value of social fluency, while the load-bearing line captures the importance of maintaining the grid of expectations, even if some of those expectations are merely decorative. So the obligation is real, but it is not grounded in preventing injury; it is grounded in the duty not to be a gratuitous source of noise in a signal-based environment.
