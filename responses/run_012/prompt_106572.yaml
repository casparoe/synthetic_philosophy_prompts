answer: |-
  1. **The Baseline Entitlement**
  Let's start with your vegetarian and carnivore. You say they trade—she gives money, he gives up burgers. But trade requires property. Who decided the carnivore owns the right to eat the cow in the first place? If she shouldn't have been eating it, isn't this just paying her to stop doing something wrong?
  *Follow-up:* You'll likely say we have to start from the legal status quo to keep things practical. But you're selling this as moral progress, not legal realism. If the law says slavery is okay, do we treat the slaveholder as having an entitlement we need to buy out, or is some baseline too unjust to trade from?

  2. **The Indivisible Good**
  Most of your examples involve two different pies—meat versus money, policy A versus policy B. But the fights that keep us up at night are usually over one indivisible thing. Who gets the kid? Does the referendum pass? Where's the trade there?
  *Follow-up:* I expect you'll say people usually have mixed preferences, so there's always room to move. But you're building a theory for the hard cases. What if my preference is lexicographic? I don't want *mostly* no slavery, I want *no* slavery. If trade only needs ordinal rankings, where does the absolute constraint fit?

  3. **Corruption and Incentives**
  I'm worried about the market leaking into the morality. If I pay my neighbor to stop playing loud music, I've solved the noise, but have I corrupted the relationship? And worse, does this give me an incentive to become more extreme so I have more to sell?
  *Follow-up:* You'll probably argue that the consequence is what matters—if the music stops, the world is better. But if we normalize selling out our principles, don't we lose the kind of people who hold principles in the first place? Are you training us to be mercenaries?

  4. **Descriptive vs. Normative**
  Sometimes you talk like this is how smart people already negotiate, and sometimes like it's a new rulebook for how we ought to. Which is it? Are you describing human behavior or prescribing it?
  *Follow-up:* If you say it's both, I need to know which one leads the charge. Because if you tell people this is rational behavior, they might start acting like ruthless traders instead of citizens. Does the description become a self-fulfilling prophecy?

  5. **Unilateral Action and Offsets**
  Let's turn this on your own side. If I know I can buy carbon offsets for my flight, does that make taking the flight permissible? Does the existence of the trade change the morality of the unilateral act?
  *Follow-up:* You'll likely say yes, because the net harm is reduced. But doesn't that create a moral license? If I know I can pay you to look away, do I become less careful about not hurting you in the first place?

  6. **Political Logrolling**
  You extend this to voters trading support on different issues. But vote trading is illegal in many places, and often called corrupt. Why is it moral in your framework when it's banned in our courts?
  *Follow-up:* If you say it's because it increases overall utility, I'd push back: Is efficiency the only metric for democracy? If the rich can trade more effectively than the poor, does this model just encode inequality into the voting booth?

  7. **Power Asymmetry**
  In your examples, both sides seem to have equal leverage. But in reality, one side is often desperate. If a community needs a factory and the polluter knows it, is their deal still a "gain from trade" if one gun is to the other's head?
  *Follow-up:* You'll say the deal is still voluntary and mutually beneficial compared to the alternative. But if the alternative is starvation, is "voluntary" doing enough work there? At what point does a trade look like extortion?

  8. **The "Separate Question" Trap**
  I've noticed when things get tough, you tend to say "that's a separate question" or "it depends on the framework." I want to pin this down. Is there any case where you would say two people *should not* make a trade, even if both benefit?
  *Follow-up:* If you hesitate or say "it's complex," I'll press: I need a principle. If the answer is always "whatever maximizes the surplus," then you're not an ethicist, you're an accountant. Is there a line you won't cross?

  9. **The End Game**
  If your model works perfectly, do we still need moral agreement? Or does a society held together only by trades become purely transactional?
  *Follow-up:* You'll likely say transactional is fine if it keeps the peace. But solidarity isn't transactional. If we stop trying to convince each other and start just paying each other off, do we lose the ability to act together when money isn't on the table?
