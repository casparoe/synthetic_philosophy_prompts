      *   **Constraint 2 (No Harm to Victim):** The act forbidden must leave the specific victim *no worse off* (no harm, no knowledge, no cost). This isolates the wrong as *using*, not *harming*.
      *   **Constraint 3 (Third-Party Usage):** The alternative must involve *other people* being used as means by *third parties*, not just harmed as side effects. This blocks the Doctrine of Double Effect.
      *   **Tone/Effect:** The reader must feel the charge that the protagonist's scruple is self-regarding (protecting her own integrity at others' expense).
      *   **Output:** A single, concrete case with institutional detail, plus a brief philosophical explanation of why it's paradoxical and the best defense for the protagonist.

  2.  **Deconstruct the Paradox of Deontology:**
