  So I'm in a formal epistemology seminar this term and my friend Priya has gotten really into this "accuracy-first" thing — the idea that what makes a credence rational is just that it's the one that maximizes expected accuracy (expected closeness to the truth), scored by some strictly proper rule, and that this is supposed to deliver probabilism, conditionalization, the whole package without needing representation theorems or Dutch books. I'm mostly convinced it's a neat trick for the easy cases but I don't buy it as a full story about epistemic rationality, and we keep going in circles because we can't agree on where the actual crux is. Her bold claim, which she'll defend to the death, is roughly: for any rational agent with evidence E, her credence function is exactly the one that maximizes expected accuracy given E under a strictly proper scoring rule, and nothing else is needed to say what she's rationally required to believe. Give me your credence that that claim is true — a real number — and please don't just tell me it's "roughly right in spirit."

  Decompose it for me into the sub-claims it actually rests on, put a rough number on each, then tell me how they combine: (a) that accuracy (closeness to truth) is the sole fundamental epistemic good, i.e. veritism holds and no separate goods like calibration, truthlikeness, understanding, or explanatory unification ever override it; (b) that rational credences have to be precise point-valued probabilities at all, rather than sometimes being imprecise or indeterminate in a way that no single credence function captures; (c) that the expected-accuracy argument survives the idealization problems — agents who are uncertain about their own credences, about logic, or about what their evidence even is (the logical-omniscience stuff); and (d) the one Priya and I actually fight about, whether the fact that different strictly proper scoring rules can rank two credence functions differently means accuracy-first is either incomplete, or — if she retreats to "any proper rule is fine, so both rankings are permissible" — collapses into a vacuous permissiveness that can't rule anything out.

  Then give me the combination, and tell me which single term my final number is most sensitive to — if I got to resolve exactly one of those sub-questions definitively, which one moves me most — plus what evidence or argument would actually shift that term. I'm around 0.35 on the whole claim myself and Priya's at like 0.9, so I'd also like your read on which sub-question our disagreement most likely lives in, since I suspect we're definately not even disagreeing about the same thing.
