  6.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I distinguish "incomparable" from "equal"? Yes, this is crucial. Incomparability means value isn't measurable on the same scale; equality means it is, and the numbers match.
      *   *Check:* Did I address the physics? Yes, need to ensure the answer says physics explains *how* movement happens, not *why* it's rational.
