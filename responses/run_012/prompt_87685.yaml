  # Bureau of Personal Merit & Allocation: Member Support Portal

  ## Frequently Asked Questions Regarding Merit Score (MS) Calculation and Dispute Resolution

  **Welcome to the Bureau Support Center.** Please review the following inquiries before opening a ticket. Hold times for the Merit Helpline are currently 45–60 minutes.

  **Q: How is the National Baseline determined for my score?**
  A: Your Merit Score (MS) reflects your performance relative to the Normative Median Citizen (NMC). The NMC represents a statistical aggregate of standard cognitive and physical capacities under average environmental conditions. Please note that the specific parameters defining the NMC are proprietary to prevent gaming. If you believe your baseline assignment is incorrect due to undocumented hardship, submit Form B-12 (Baseline Variance Claim). Processing time is 6–8 weeks.

  **Q: How do you separate my effort from lucky circumstances?**
  A: The Bureau utilizes Probabilistic Life-Path Modeling (PLPM). This system simulates counterfactual scenarios where specific advantages (e.g., inheritance, genetic predisposition) were removed. We do not guess; we calculate variance. If your actual output exceeds the PLPM projection, the surplus is credited to personal merit. Please be aware that PLPM relies on self-reported data regarding upbringing. Discrepancies found during audit may result in a temporary Merit Freeze.

  **Q: If my character determines my effort, isn't my effort also luck?**
  A: This is a common misconception addressed by the Secondary Volition Coefficient (SVC). Your initial score measures output. Your SVC measures the effort expended to generate that output. If you dispute the SVC, you may file for a Tertiary Will Audit. However, be advised that proving the origin of your will requires evidence of a choice made prior to character formation. As no such records exist, most Tertiary Audits are denied pending new metaphysical evidence.

  **Q: I have a high Merit Score. Why was my loan application denied?**
  A: It is vital to distinguish between *Desert* and *Entitlement*. A high MS indicates you are worthy of reward based on past metrics. It does not constitute a legal claim on specific resources. Entitlement is determined by Allocation Capacity and systemic liquidity. You may deserve a promotion, but if the position does not exist, the Bureau cannot manufacture one. Merit validates the person; Logistics validate the reward.

  **Q: If my score grants me better schools and networks, isn't my future success less earned?**
  A: The Bureau accounts for this via Cohort Normalization. As your MS increases, you are compared against higher-performing peer groups rather than the general population. Therefore, maintaining a high score requires proportionally greater effort as your advantages increase. Your score does not shrink because the difficulty setting adjusts dynamically. You are always running uphill relative to your tier.

  **Q: Can I opt out of the Merit Score system?**
  A: Opting out requires a minimum Merit Score of 750 to ensure you possess the judgment necessary to waive protection.

  ***

  **RELATED ARTICLES**

  *   **Understanding Your Volition Coefficient:** Why effort counts twice but talent counts once.
  *   **Disputing Heritage Advantages:** How to prove your parents' success wasn't your fault.
  *   **Why Your Children's Scores Are Provisional:** Minors operate under "Potential Merit" until age 18.

  ***

  **Q: What happens if the entire population achieves maximum merit?**
  A: Our modeling indicates this is statistically impossible due to dynamic baseline recalibration.
