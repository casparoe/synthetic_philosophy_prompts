answer: |-
  **Project Title:** The Normative Scope of Good's Theorem: Identity vs. Prescription under Preference Sensitivity

  **1. Central Research Question**
  Does the non-negativity of the expected value of information hold as a normative principle for rational agents when the acquisition of information alters the agent's preference ordering over outcomes, rather than merely updating credences?

  This question admits a determinate answer based on the formal coherence of the decision model. The answer will be **negative** if I can construct a decision problem where: (a) the agent is rational by standard synchronic lights, (b) information is costless and relevant to the state of the world, and (c) the expected utility of the informed decision is strictly lower than the uninformed decision due to endogenous preference shifts rather than exogenous psychological costs. The answer will be **positive** if I can demonstrate that any such apparent counterexample relies on a violation of diachronic rationality or collapses into a model where preferences are stable and the "cost" is merely a re-description of belief-dependent utility.

  **2. Background and Motivation**
  The standard result in decision theory, often attributed to I.J. Good, establishes that the expected value of free information is never negative. The canonical defense relies on the "option to ignore": an informed agent retains all acts available to the uninformed agent and can therefore replicate the uninformed choice. Consequently, the informed agent can do no worse in expectation. When faced with empirical cases of information avoidance (e.g., declining medical tests), proponents of the standard view preserve the theorem by categorizing these agents as having belief-dependent utilities. On this reading, the agent does not avoid the *instrumental* disvalue of information but rather pays a psychological cost for holding certain beliefs; the theorem remains intact because it concerns only instrumental value derived from state-dependent outcomes.

  I argue that this defense conflates a mathematical identity with a normative claim. The non-negativity result functions as a bookkeeping identity between two decision problems that share a single prior and a single preference relation. However, treating information avoidance merely as a matter of belief-dependent utility redescribes the problem rather than solving it. It assumes that the preference relation is stable across the information-gathering event. If the content of the information itself alters the preference ordering (e.g., learning a fact makes a previously acceptable outcome unacceptable, independent of anxiety or "taste"), the "option to ignore" is illusory. The agent cannot choose as they would have *without* the information, because the act of knowing changes the valuation of the acts themselves.

  Existing discussions leave this question open because they typically treat preference stability as a background assumption rather than a variable. They assume that if we strip away "psychological costs," the theorem must hold. My project challenges this by asking whether the theorem survives when the preference relation is sensitive to the information set itself, without appealing to external psychological penalties.

  **3. Methodology**
  This project will employ a hybrid method of conceptual analysis and formal modeling. I will not conduct empirical research but will instead construct and analyze small-scale decision problems.

  *   **Phase 1: Reconstruction.** I will formally reconstruct the standard proof of the non-negativity theorem to isolate the specific assumptions regarding act availability and preference stability. I will identify the precise step where the "option to ignore" relies on the invariance of the utility function.
  *   **Phase 2: Model Construction.** I will develop decision matrices (typically two acts, two states) where the utility function is indexed not only to states and outcomes but to the information partition. This models "preference sensitivity" distinct from "belief-dependent utility."
  *   **Phase 3: Testing.** I will test these models for counterexamples. I will attempt to generate a scenario where $EV(\text{informed choice}) < EV(\text{uninformed choice})$ solely due to the shift in preference ordering induced by the signal.
  *   **Phase 4: Evaluation.** I will evaluate whether these counterexamples represent genuine rational dilemmas or failures of diachronic coherence. I will attempt to prove restricted versions of the theorem that might hold under specific constraints on how preferences are allowed to shift.

  **4. Expected Outcomes and Deciding Considerations**
  *   **Positive Result (Theorem Survives):** I may find that any model where information has negative expected value implies a form of dynamic inconsistency that renders the agent irrational by independent standards. For example, if the preference shift violates a principle of reflection or conditionalization, the failure of the theorem may be attributed to the irrationality of the preference change rather than the value of information. A positive result would look like a proof that rational preference sensitivity must be "transparent" in a way that preserves the non-negativity identity.
  *   **Negative Result (Theorem Fails):** I may successfully construct a case where an agent is synchronically rational at every node, yet the prior expectation of the informed path is lower. This would occur if the "option to ignore" is structurally unavailable because the knowledge state is a constituent of the outcome evaluation. A negative result would look like a formal counterexample where information avoidance is instrumentally rational even with stable psychological traits.

  The deciding consideration will be whether the preference shift can be modeled as a rational response to the *content* of the information without violating diachronic coherence norms. If the shift is arbitrary, the standard view wins (it's just irrational preference change). If the shift is structurally necessary (e.g., certain acts are only permissible under ignorance), the standard view loses.

  **5. Feasibility and Risk Assessment**
  The primary risk is scope creep. The literature on belief-dependent utility and dynamic choice is vast. To keep this within 6,000 words, I must strictly limit the formalism to illustrative cases rather than attempting general proofs for all classes of preference-sensitive agents.

  A second risk is conflation. It is easy to inadvertently model "preference change" as simply another form of "belief-dependent utility" (e.g., treating the preference shift as a cost). I must be rigorous in distinguishing between utility functions that depend on the *state of belief* (which the standard view accommodates) and utility functions that depend on the *history of information acquisition* in a way that breaks the partition refinement assumed by Good's Theorem.

  Finally, there is a risk that the project becomes purely semantic. If I define "rational preference" in such a way that it excludes information-sensitive preferences by fiat, the result is trivial. To avoid this, I will ground the permissibility of preference sensitivity in intuitive cases (e.g., strategic ignorance in social coordination) rather than abstract axioms alone. If I find that distinguishing between the "identity" reading and the "normative" reading requires more nuance than 6,000 words allow, I will narrow the focus to the specific failure of the "option to ignore" defense in a single class of counterexamples.
