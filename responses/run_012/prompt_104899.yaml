answer: |-
  1. "What's actually going wrong"
  Metrics fail in two distinct ways: either the number never measured what you thought it did (invalid proxy), or it did measure it until people started optimizing for the number instead of the goal (measure drift). When you tie a number to a reward or review, you change the behavior around that number. This isn't usually lying; it's rational optimization. The goal of this review is not to find "perfect" metrics (they don't exist) but to identify *how* the metric will break under pressure so you can document the risk and adjust the incentive, not just the math.

  2. "The procedure"
  **Timebox:** 45 minutes. **Attendees:** Metric Owner, Analytics Rep, Stakeholder Lead.
  **Output:** A signed "Metric Risk Card" (template below).

  **Phase 1: The Gap Check (10 mins)**
  *Goal: Distinguish Invalid Proxy vs. Measure Drift.*
  1.  **Write the Goal:** In one sentence, what business outcome do we want? (e.g., "Customers resolve issues quickly," not "Lower handle time.")
  2.  **Write the Metric:** Exactly how is it calculated? (e.g., "Average Handle Time < 5 mins.")
  3.  **The "So What?" Test:** If this metric goes up 10%, does the Goal *necessarily* improve?
      *   *Pass:* Yes, historically and logically.
      *   *Fail:* No, it's possible for the metric to improve while the goal gets worse.
      *   *Action:* If Fail, mark as **Invalid Proxy**. Stop here. Do not approve metric.
      *   *Action:* If Pass, mark as **Valid Proxy**. Proceed to Phase 2. (This distinguishes your two failure types).

  **Phase 2: The Four Flavors Classification (10 mins)**
  *Goal: Force the team to name the specific risk.*
  Ask: "If we put a bonus or public scoreboard on this, which of these four things happens?" (Pick exactly one primary risk).
  1.  **Regressional (The Extremes):** The metric correlates with the goal on average, but the highest scores don't match the best outcomes. (e.g., High test scores don't always mean best employees).
  2.  **Causal (The Broken Link):** The metric causes the goal only up to a point, then the link snaps. (e.g., Practice improves skills, but obsessive practice causes injury and lowers performance).
  3.  **Adversarial (The Hack):** People deliberately manipulate the data or process to hit the number without doing the work. (e.g., Closing tickets to lower "Open Tickets" without solving the user's problem).
  4.  **Selection (The Bias):** Measuring this changes who or what gets measured. (e.g., Only counting "active users" makes us stop trying to win back churned users).

  *Judgment Call Flag:* There is no math test for this. It relies on institutional memory. If the team disagrees on the flavor, record both.

  **Phase 3: The Pre-Mortem Stress Test (15 mins)**
  *Goal: Prove the risk is manageable.*
  1.  **The "How to Cheat" Brainstorm:** Spend 5 minutes listing specific ways a smart, motivated employee could hit the target while hurting the company.
      *   *Requirement:* Must list at least 3 specific tactics. If you can't think of 3, you aren't trying hard enough.
  2.  **The Cost-Benefit:** For the top tactic, how hard is it to detect?
      *   *Pass:* We can detect it with existing data/audits within 2 weeks.
      *   *Fail:* We would only find out after quarterly reviews or via customer complaint.
  3.  **The Threshold Check:** Is the target a "cliff" (pass/fail) or a "slope" (more is better)?
      *   *Pass:* Slope or range.
      *   *Fail:* Binary cliff (e.g., "Zero incidents"). Binary cliffs maximize Adversarial risk.

  **Phase 4: Decision & Handoff (10 mins)**
  *Fill out the Metric Risk Card.*
  *   **Status:** Approved / Rejected / Approved with Caveats.
  *   **Risk Flavor:** (From Phase 2).
  *   **Known Exploit:** (From Phase 3).
  *   **Detection Plan:** How/when will Analytics check for gaming?
  *   **Human Handoff:** If the risk is **Adversarial** or **Causal**, this requires Exec sign-off. Analytics certifies the *measurement*, Execs certify the *incentive*.

  *[JUDGMENT CALL FLAG]*: This step admits that Analytics cannot approve incentives. If the metric is safe but the bonus is dangerous, you must escalate.

  3. "Three reviews"

  **(a) Support: Per-Agent "Customer Happiness" Score**
  *Goal:* Improve customer sentiment. *Metric:* Average of post-ticket survey scores (1-5) per agent.
  *Phase 1:* Valid Proxy. Higher scores generally mean happier customers.
  *Phase 2:* Risk is **Adversarial**. Agents can pressure customers ("I can't close this unless you give me a 5") or cherry-pick easy tickets.
  *Phase 3:* Cheating is easy (verbal pressure). Detection is hard (requires call listening). Target is a cliff (must maintain 4.8).
  *Verdict:* **Rejected.** The detection cost is too high for the risk.
  *Fix:* Change metric to "Random Sample Audit Score" (managed by QA) rather than "All Surveys." This moves the leverage from the agent to the auditor.

  **(b) Engineering: "Code Quality" Score**
  *Goal:* Reduce technical debt. *Metric:* Static analysis score (0-100) based on linting and complexity rules.
  *Phase 1:* Valid Proxy. Cleaner code is generally more maintainable.
  *Phase 2:* Risk is **Regressional**. A score of 90 is great. A score of 100 implies they stopped shipping features to refactor whitespace. The correlation breaks at the extreme.
  *Phase 3:* Cheating involves disabling rules or splitting functions artificially. Detection is easy (Analytics can spot rule-suppression commits). Target is a range (85-95).
  *Verdict:* **Approved with Caveats.** The metric itself is fine. The risk is not the math, it's the *threshold*.
  *Escalation:* This goes to the Exec Team. Analytics signs off on the measurement validity, but the doc explicitly states: "If Engineering hits 100 consistently, velocity will drop. Do not bonus on >95." This is the counter-intuitive result: The metric is safe, the incentive is the bomb.

  **(c) Safety: "Incidents Per Quarter"**
  *Goal:* Zero harm. *Metric:* Count of reportable safety incidents.
  *Phase 1:* Invalid Proxy. A count of zero does not mean "safe," it means "unreported."
  *Phase 2:* Risk is **Adversarial** (Under-reporting).
  *Phase 3:* Cheating is trivial (classify an injury as "off-site" or "pre-existing"). Detection is nearly impossible for Analytics; requires external audit. Target is a cliff (Zero).
  *Verdict:* **Rejected.** This is the classic "Zero Harm" trap.
  *Fix:* Measure "Near Miss Reports" (leading indicator) instead of "Incidents" (lagging indicator). Reward the reporting of near misses, not the absence of incidents. This aligns the metric with the goal (awareness) rather than the appearance of the goal.

  4. "Where I still have to guess"
  *   **Weighting:** This procedure validates a single metric, not how it weighs against others in a scorecard. (e.g., Safety vs. Speed).
  *   **Frequency:** It doesn't tell you how often to review the metric for drift (monthly? quarterly?).
  *   **Cultural Baseline:** It assumes a rational actor. It doesn't account for a culture where people are too scared to game, or too ethical to game.
  *   **External Shocks:** It cannot predict market changes that break the Goal/Metric link (e.g., a pandemic changes what "Support Speed" means).
  *   **Lag Time:** It doesn't solve the problem where the metric moves today but the business impact isn't felt for six months.
  *   **Cost of Measurement:** It flags detection difficulty, but doesn't calculate if the audit cost is worth the metric's value.
  *   **Team Maturity:** A metric safe for a senior team might be dangerous for a junior team; the procedure treats them the same.
  *   **Political Will:** It identifies the risk, but cannot force leadership to accept a "messier" metric over a clean-looking one.

  5. "What this procedure can't do"
  This procedure is a filter, not a generator. It will tell you if a metric is dangerous, but it cannot tell you what the *right* metric is. If your strategy is flawed, measuring it rigorously will only help you fail faster. It also cannot protect you from leadership that demands certainty where none exists. If an executive insists on a "Zero Defect" metric because it looks good in a board deck, this process will give you the paper trail to say "I told you so," but it will not stop them from implementing it.

  Furthermore, this does not solve the problem of *multitasking*. Even if a metric is un-gameable in isolation, optimizing it might cause teams to neglect unmeasured work. If you measure Support Speed, they might stop updating documentation. This procedure reviews the lever, not the whole machine. Finally, it relies on honesty. If the Metric Owner lies during the "How to Cheat" brainstorm because they want the bonus, the procedure fails. It requires a culture where pointing out flaws is rewarded, not punished. If your team feels unsafe admitting a metric is fragile, no checklist will save you.
