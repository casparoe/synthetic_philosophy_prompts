      *   Conclusion survive correction? Yes.
      *   Cleaned-up version? Yes.
      *   Single consideration to change verdict? Yes.
      *   Where am I likely wrong? Yes.

  11. **Final Polish:** Ensure tone is analytical, charitable but rigorous. Avoid taking sides on Longtermism itself, focus on the logic of the SA application. (Self-Correction: Make sure to distinguish between "moral weight" and "probability of success." The blogger conflates them. The correction separates them.)

  *(Self-Correction during drafting)*: I need to be careful about the "1/3" claim. Bostrom says one of the three is *true*, not that they are equiprobable. The blogger's claim of "roughly equal pieces" is a specific Bayesian prior that is not mandated by the argument. I should highlight this as a major error.

  *(Self-Correction on "Discounting")*: The blogger says "mere shadow... stakes are discounted." This is moral anti-realism about sims. I need to emphasize that standard philosophy of mind rejects this.

  *(Self-Correction on "Dampening")*: Even if moral weight is equal, if $P(\text{we can affect the long future})$ is lower because we might be in a sim that gets turned off, then EV is lower. This saves the conclusion but changes the premise.

