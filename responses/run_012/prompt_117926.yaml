      *   **Methodology:** Import a distinction from anthropology/linguistics (observer's categories vs. native categories; descriptive adequacy vs. systemic faithfulness). Test this against a specific case study: The Scientific Revolution (are "science," "experiment," "laws of nature" usable categories for actors who lacked them?).
