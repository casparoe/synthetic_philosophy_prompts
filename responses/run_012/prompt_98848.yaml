answer: |-
  **The Scenario: The Six-Storm Pact**

  Two neighbors, Sam and Jordan, share a private driveway and have a verbal agreement to handle winter plowing for the season. The meteorologist has predicted exactly six major snowstorms. They alternate responsibility: Sam handles storms 1, 3, and 5; Jordan handles 2, 4, and 6. For each storm, the responsible neighbor has a choice: "Plow" (spend $100 of effort, clears the whole drive, pact continues) or "Salt Only" (spend $20, clears only their own side, leaves the neighbor stranded, pact ends immediately). If they Plow every time, both save $500 in total effort over the season. If someone Salts, the saver keeps their cash, the stranded neighbor pays a $200 tow fee, and the cooperation dies.

  **The Backward Induction Walkthrough**

  Start at the end. Storm 6 is Jordan's turn. Jordan knows there is no Storm 7. There is no future punishment for breaking the pact. Rationality dictates Jordan Salts Only to save the $100. Sam knows this. So at Storm 5, Sam knows that even if he Plows, Jordan will Salt on Storm 6 anyway. Sam gains nothing by Plowing now, so Sam Salts on Storm 5. Jordan knows *that*. So on Storm 4, Jordan knows Sam will Salt on 5, so Jordan Salts on 4. This logic cascades backward like falling dominoes. By the time you reach Storm 1, the logic says Sam should Salt immediately. The rational verdict is to betray the neighbor on the very first snowfall.

  **The Payoff Gap**

  If both players follow the backward induction verdict, they Salt on Storm 1. Sam saves $80 (relative to plowing), and Jordan gets stranded immediately, paying the tow fee. The total value generated is minimal. If they both ignore the logic and simply Plow every time until the season ends, they each net $500 in saved costs. The "rational" strategy leaves hundreds of dollars on the table for both parties compared to the "naive" cooperative strategy.

  **The Fragility Feature: Common Knowledge of the End**

  The single thing making this paradox tick is **Common Knowledge of the Endpoint**. Both players must know not only that the game ends at Storm 6, but that the *other* knows it, and that the *other knows that they know it*. This certainty is what powers the backward cascade. If you remove this feature—if there is even a 1% chance of a seventh storm—the verdict shatters. Suddenly, Salting on Storm 6 carries a risk: you might lose the opportunity for future cooperation. That tiny uncertainty is enough to justify Plowing on Storm 6, which justifies Plowing on Storm 5, all the way back to Storm 1. The "defect immediately" verdict is incredibly fragile; it requires absolute certainty that there is no tomorrow.

  **The Strongest Counter-Argument**

  A defender of backward induction would argue that you are conflating "rational" with "successful." They would say the model assumes players care only about immediate monetary payoff. If people cooperate, it's because their payoff function includes "being a good neighbor" or "avoiding guilt," not because the logic is wrong. If you add those social preferences to the math, backward induction still holds—it just leads to a different answer (Plowing becomes the rational move).

  **Does It Land?**

  Logically, the objection is sound; you can always rescue a model by redefining the variables. But practically, it misses the point. The paradox exists precisely because people *do* cooperate even when the monetary incentives say they shouldn't. Dismissing this as "hidden payoffs" makes the theory unfalsifiable. The backward induction verdict is mathematically airtight but behaviorally brittle, which is why real neighbors usually keep plowing until the snow stops.
