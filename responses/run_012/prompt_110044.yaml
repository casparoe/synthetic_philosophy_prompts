answer: |-
  - "The setup"
  You are the sole rescuer. On one path, one person will die unless you act. On the other, five people will die unless you act. All are strangers, equally healthy, and equally distant. You cannot save both groups. Everyone agrees each person's life matters equally and saving anyone is a serious good. You cannot talk to them or move them. You must choose whom to save. The rest die. This chart sorts your view on whether the number of people matters to that choice, using concrete cases rather than abstract theories. Answer based on what you think you should do or why.

  - "The tree"
  1. Is the bare fact that five people die instead of one, by itself, any reason at all to save the five?
     - **No** → Go to 2.
     - **Yes** → Go to 5.

  2. Since numbers aren't a reason, may you save whoever you like, or must you randomize the choice?
     - **Save whoever** → Go to 3.
     - **Must randomize** → Go to 4.

  3. If you save the one and the five die, do you feel you ought to regret it more than if the one had died?
     - **Yes** → Leaf A.
     - **No** → Leaf B.

  4. Must you give each *group* an equal chance (coin flip), or each *person* an equal chance (weighted lottery)?
     - **Group (50/50)** → Leaf C.
     - **Person (5/6 vs 1/6)** → Leaf D.

  5. Imagine the one person needs the whole antidote to live 50 years, but the five each need one-fifth to live only 1 year each. Total life years: 50 vs 5. Headcount: 1 vs 5. Do you save the five?
     - **No (Save the one)** → Leaf E.
     - **Yes (Save the five)** → Go to 6.

  6. Suppose you had previously promised the one person you would save them, but made no promise to the five. Do you still save the five?
     - **No (Save the one)** → Leaf F.
     - **Yes (Save the five)** → Go to 7.

  7. Are you *required* to save the five in this case, or merely *allowed* to?
     - **Allowed** → Leaf G.
     - **Required** → Leaf H.

  - "The leaves"
  - **Leaf A (Regret View):** Numbers don't constrain what you may do but do affect what you should feel bad about afterwards.
  - **Leaf B (Pure Indifference):** You may save either and feel no difference afterwards, which sounds uncomfortably like you don't care about people at all.
  - **Leaf C (Coin Flip):** You're permitted to save either, flip a coin if you like, which implies the four extra people don't matter even for chances.
  - **Leaf D (Equal Chance):** Give everyone an equal chance, which means you'll end up saving the five most of the time without counting them as more important.
  - **Leaf E (Welfarist):** The pure "more lives is just more good" view, which implies you should save one long-lived person over five short-lived ones.
  - **Leaf F (Tiebreaker):** Numbers only break ties, which means a single promise from the one person outweighs the lives of the five.
  - **Leaf G (Supererogatory):** Numbers count toward what is good but not what is owed, which means you can knowingly do the worse thing without wrongdoing.
  - **Leaf H (Claims/Required):** You're required to save the five, but not for aggregative reasons, which implies five weak claims outweigh one strong claim without adding up.

  - "Empty rooms"
  - **Answers 1-No, 2-Save Whoever, 3-No:** Empty because it's coherent but no one would want it (implies moral indifference to death).
  - **Answers 1-Yes, 6-No, 7-Required:** Empty because it's incoherent (you cannot be required to save the five if you just said you save the one).
  - **Answers 1-No, 4-Person:** Occupied (Taurek), but often mistaken for empty because people think equal chance requires numbers to matter.

  - "What the tree can't tell apart"
  - **Leaf H lumps two views:** The "More claims satisfied" view and the "Required... not for aggregative reasons" view land here; separate them by asking if the reason is the *sum* of claims or the *strength* of the strongest claim.
  - **Leaf E lumps two views:** Act Utilitarians and Rule Utilitarians both save the one in the antidote case; separate them by asking if they'd save the one even if doing so violated a general rule that usually saves more lives.
  - **Leaf G and Leaf A:** Both say you aren't required to save the five; separate them by asking if the reason numbers matter is about *action* (G) or only *emotion* (A).
