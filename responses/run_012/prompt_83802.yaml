  ### SEPARATION ANALYSIS

  **Which pairs of leaves cannot be separated?**
  This tree separates the **Two-Level View** from the **Practice-Internal View** at **Q1**. The Two-Level theorist answers **YES** (there is a universal violation of entrusted power, even if locally thickened); the Practice-Internal theorist answers **NO** (if the practice is patronage, there is no violation of *that* practice's norms). However, in concrete cases (like the *Nephew Appointment*), these positions often converge on action: both may advise against intervening. The tree separates their *ontological commitments* (is there a ghost of impartiality haunting all offices?), but it cannot separate their *policy recommendations* in low-capacity states.

  **Empty Leaves:**
  The **Deflationary View** is marked as rarely occupied. It is not incoherent, but it is practically unattractive to anyone running a charity, as it disarms the language required to raise funds or demand accountability.

