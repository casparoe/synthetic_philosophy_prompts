  # THE CORRUPTION TAXONOMY

  **Q1. In the *Brother-in-Law Contract*, is it corrupt even if the community accepts it, the price is fair, and the work is good?**
  *   **YES** (Process/Power matters more than outcome/local norm) → **Go to Q2**
  *   **NO** (Outcome/Local norm matters more than process) → **Go to Q5**

  **Q2. In the *Facilitation Fee* and *Nurse Queue*, is the wrongness located in the *individual act* of taking the fee, or in the *system* that makes the fee necessary?**
  *   **SYSTEM** (The coercion is structural) → **STRUCTURAL VIEW**
      *   *Hardest Commitment:* You must condemn the state that forces the choice before you condemn the official who makes it.
  *   **ACT** (The choice is individual) → **Go to Q3**

  **Q3. In the *Surgeon Envelope* and *Match Tickets*, is there a single definition of "private gain" that applies even if the giver calls it a "gift" and the local law allows it?**
  *   **YES** (One definition fits all) → **FLAT UNIVERSALIST**
      *   *Hardest Commitment:* You must call a grateful gift corruption if it touches an official, regardless of the intent or the culture.
  *   **NO** (Context fills the definition) → **TWO-LEVEL VIEW**
      *   *Hardest Commitment:* You must maintain a universal principle that you admit cannot be directly applied without local translation.

  **Q5. In the *Festival Budget* and *Brideprice*, should we call this corruption, or simply describe the transfer without the moral label?**
  *   **DESCRIBE ONLY** (Retire the word) → **DEFLATIONARY VIEW** *[LEAVE RARELY OCCUPIED: Unattractive to practitioners as it removes moral leverage for reform.]*
      *   *Hardest Commitment:* You must refuse to use the word "corruption" even when it would mobilize donors to stop a harmful transfer.
  *   **USE THE LABEL** → **Go to Q6**

  **Q6. In the *Festival Budget* and *Brideprice*, does the word "corruption" apply where the public purse and the household's money are treated as one?**
  *   **NO** (The distinction is the export) → **ANTI-CORRUPTION AS POLITICAL EXPORT**
      *   *Hardest Commitment:* You must accept that your charity's anti-corruption stance is itself a form of political imperialism.
  *   **YES** (The distinction is required) → **Go to Q7**

  **Q7. In the *Village Road* and *Nephew Appointment*, if the nephew is best or the village poorest, does the *patronage* satisfy the office's obligation?**
  *   **YES** (Patronage *is* the practice) → **PRACTICE-INTERNAL VIEW**
      *   *Hardest Commitment:* You must admit that impartiality is not a universal virtue but a rule internal to specific bureaucratic games.
  *   **NO** (Patronage is a workaround) → **Go to Q8**

  **Q8. In the *Police Favor* and *Facilitation Fee*, is the practice acceptable because the state fails (second-best), or because local norms differ (relativism)?**
  *   **STATE FAILS** (Functionality) → **PATRONAGE AS SECOND-BEST**
      *   *Hardest Commitment:* You must support a corrupt practice temporarily while working to make it unnecessary.
  *   **NORMS DIFFER** (Validity) → **RELATIVIST**
      *   *Hardest Commitment:* You must accept that a practice you find abhorrent is morally right for them, not just expedient.

