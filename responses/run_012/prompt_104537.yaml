prompt: |-
  Last night a friend and I argued for the better part of two hours about Bernard Williams's integrity objection to utilitarianism, and we kept circling back to his example of the man who saves his wife rather than a stranger and who, in justifying himself, has one thought too many. My friend's view is that the whole line of criticism rests on a mistake about what a moral theory is for. Williams, he says, treats utilitarianism as though it had to be run as a calculation inside the agent's head at the moment of action, so that the husband would first have to survey the general welfare before he were permitted to reach for his wife. But a standard of right action need not double as a decision procedure: the act can be right because it maximises welfare without welfare's being the thought that moves the agent, and nothing in utilitarianism forbids the husband from simply acting out of love. On his reading, the objection dissolves the moment one separates the criterion of rightness from the agent's deliberations, and the offending extra thought turns out to be something Williams foisted on the theory rather than something the theory requires. I could not produce the reply, and it has been nagging at me since. Was the integrity objection really just a confusion of criterion with decision procedure, so that nothing survives once the two are held apart — or is there a residue that the distinction leaves untouched, and if so, precisely which part of the objection does the distinction answer and which part does it not?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Bernard Williams's integrity objection to utilitarianism (specifically the "one thought too many" example regarding saving one's wife).
      *   **The Friend's Argument:** Williams conflates the *criterion of rightness* (what makes an act right) with the *decision procedure* (how an agent decides what to do). Utilitarianism can say saving the wife is right (because it maximizes utility generally) without requiring the husband to *calculate* utility in the moment. He can act out of love. Therefore, the "one thought too many" is a straw man.
      *   **The User's Problem:** They couldn't reply to this friend. They want to know if the objection really dissolves under this distinction or if there's a remaining "residue" of the objection that survives the criterion/procedure split.
      *   **Goal:** Provide a nuanced philosophical analysis that validates the friend's point (it's a standard reply) but explains why Williams's objection runs deeper than just a confusion of criterion and procedure. Identify what part of the objection is answered and what part remains.

  2.  **Deconstruct the Friend's Position (The Standard Reply):**
      *   *Claim:* Utilitarianism is a criterion of rightness, not a psychological algorithm.
      *   *Implication:* Agents can (and should) have non-utilitarian motives (love, loyalty) because having these motives generally produces better utility than constant calculation.
      *   *Result:* The husband doesn't need to think about utility. He just saves his wife. No "extra thought."
      *   *Verdict:* This is a very strong, standard defense (often associated with R.M. Hare's two-level utilitarianism or indirect utilitarianism). It definitely blunts the *literal* reading of Williams's example.

  3.  **Deconstruct Williams's Position (The Integrity Objection):**
      *   *Core Claim:* Utilitarianism alienates the agent from their actions and projects. It attacks *integrity* (understood as the connection between action and ground projects/commitments).
      *   *The "One Thought Too Many":* It's not just about the *moment* of action. It's about the *justification* of the disposition.
      *   *The Deeper Point:* Even if the husband *doesn't* calculate in the moment, utilitarianism must ultimately *endorse* his love *only because* it leads to good consequences. If the love stopped producing good consequences, utilitarianism would require him to suppress it.
      *   *Alienation:* The agent's deepest commitments are held at arm's length, subject to external validation by the "utility calculus."

  4.  **Synthesize: Where does the distinction help, and where does it fail?**
      *   *Where it helps:* It refutes the idea that utilitarianism requires *conscious calculation* at every turn. It saves utilitarianism from being psychologically impossible or absurdly cold in emergency situations.
      *   *Where it fails (The Residue):*
          1.  **The Justification of Motives:** Utilitarianism still claims the *authority* to judge the motive. The husband loves his wife *ultimately* because the utility calculus permits it. Williams argues this corrupts the nature of the commitment. A commitment shouldn't be contingent on its general welfare output.
          2.  **Negative Responsibility:** Even if I act on love, if my loving act leads to suboptimal outcomes compared to a stranger, utilitarianism says I am objectively doing the wrong thing (even if I'm blameless). Williams cares about the *truth* of the action's rightness, not just the blame.
          3.  **The Point of View of the Universe:** Utilitarianism demands we adopt a neutral standpoint. Integrity is about *my* life, *my* projects. The distinction doesn't remove the demand that *my* projects are only valuable insofar as they serve the neutral standpoint.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the friend's sophistication. This is the "Indirect Utilitarianism" or "Two-Level" reply. It's the strongest defense.
      *   *Concession:* Admit the friend is right about the *decision procedure*. Williams isn't saying utilitarians *must* calculate.
      *   *The Turn (The Residue):* Explain that Williams's target is deeper. It's about the *structure of justification*, not just the psychology of deliberation.
      *   *Key Argument 1: The Contingency of Commitments.* If the utility calculus changes, the permission to love changes. This makes the commitment instrumental. Williams says integrity requires commitments to be foundational, not instrumental.
      *   *Key Argument 2: Alienation.* Even if I don't think about utility, the theory tells me my love is only valuable *because* of utility. This creates a split between the agent's self-conception and the moral truth (according to the theory).
      *   *Key Argument 3: Negative Responsibility.* It's not just about what I think; it's about what makes the act *right*. If saving the wife is suboptimal, it is *wrong*, regardless of my thoughts. Williams finds this unacceptable.
      *   *Conclusion:* The distinction solves the "psychological impossibility" charge but fails to solve the "alienation/integrity" charge.

  6.  **Refining the Tone:**
