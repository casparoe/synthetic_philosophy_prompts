answer: |-
  Your friend has offered you the standard, strongest defense available to the utilitarian. In the literature, this is often associated with **indirect utilitarianism** or R.M. Hare's **two-level utilitarianism**. Your friend is correct that Williams is not simply accusing utilitarianism of being psychologically impossible (i.e., that we cannot calculate utility in a burning building).

  However, your friend is mistaken in thinking that this distinction dissolves the integrity objection entirely. The distinction between the *criterion of rightness* (what makes an act right) and the *decision procedure* (how an agent decides) answers the **psychological** version of the objection, but it leaves the **structural** and **existential** version untouched.

  Here is how you can reconstruct the reply. You need to concede the point about decision procedures to gain traction on the deeper point about justification and alienation.

  ### 1. What the Distinction Answers (The Psychological Objection)
  Your friend is right: Williams does not seriously believe that a utilitarian husband must pause to calculate net welfare before jumping into the water. Most sophisticated utilitarians agree that the best *decision procedure* is often to act on immediate dispositions like love and loyalty, because cultivating those dispositions generally leads to better outcomes than constant calculation.

  If Williams's objection were merely, "Utilitarianism requires agents to think like spreadsheets in emergencies," your friend would have refuted him. The distinction saves utilitarianism from the charge of being **self-defeating** (i.e., that trying to be a good utilitarian makes you produce worse utility).

  ### 2. The Residue: Why the Objection Survives
  Williams's integrity objection is not about what the agent *thinks* in the moment; it is about what the theory says *makes the action right* and how that relates to the agent's identity. Even if we separate criterion from procedure, three problems remain.

  #### A. The Contingency of Commitments
  The distinction allows the husband to act out of love without thinking about utility. But it does not change the utilitarian verdict on *why* that love is permissible.
  *   **The Utilitarian View:** The husband is permitted to save his wife because having a disposition to save one's spouse generally maximizes utility.
  *   **The Williams View:** This makes the commitment to the wife **contingent** on its utility output.

  Williams argues that integrity involves "ground projects" — commitments that give your life meaning. These commitments must be taken as **foundational**, not instrumental. If the husband accepts the utilitarian criterion, he must acknowledge that if the general welfare calculus shifted (e.g., if saving his wife somehow triggered a catastrophe, or if his disposition to love her ceased to be socially useful), he would be morally required to extinguish that love.

  The "one thought too many" is not necessarily a conscious thought in the moment. It is the **background justification**. To accept utilitarianism is to agree that your love is only morally valid *because* it serves the general welfare. Williams argues this alienates the agent from their own deepest commitments. You cannot truly love someone if you hold your love at arm's length, ready to discard it should the utility calculus demand it.

  #### B. Alienation and the "Point of View of the Universe"
  Williams argues that utilitarianism requires the agent to adopt the "point of view of the universe" — a neutral standpoint where everyone's interests count equally. Integrity, however, requires a **personal standpoint**.

  Even if the decision procedure is "act on love," the *criterion* tells the agent that their personal standpoint is ultimately subordinate to the neutral standpoint.
  *   **The Residue:** The agent is alienated from their action because the *truth* of the action's rightness lies outside them (in the general welfare), not in their own projects.
  *   **Example:** Suppose saving the wife is actually sub-optimal (perhaps the stranger is a brilliant surgeon who will save thousands). The indirect utilitarian says: "Act on love anyway, because calculating this every time is bad."
  *   **Williams's Counter:** But the theory still says you are doing the **wrong thing**. You are merely a "blameless wrongdoer." For Williams, this is intolerable. It means that in the most intimate moments of your life, the moral truth is that you are failing the universe. This creates a split between the agent's self-conception ("I am doing the right thing by saving my wife") and the moral reality ("You are objectively failing to maximize value"). That split is the loss of integrity.

  #### C. Negative Responsibility
  Williams's integrity objection is tightly bound to his critique of **negative responsibility** (the idea that I am responsible for the consequences I fail to prevent, just as much as those I cause).

  The criterion/procedure distinction does not solve this. Even if I don't *calculate* the stranger's death, utilitarianism holds me responsible for it. If I save my wife, I am allowing the stranger to die. The theory says I am causally and morally implicated in the stranger's death because I could have prevented it.

  Williams argues that integrity requires a distinction between what *I do* and what *I allow*. By collapsing this distinction, utilitarianism attacks the integrity of the agent as an individual locus of action. Separating the decision procedure doesn't fix this; it just means I don't have to *think* about my responsibility for the stranger's death while I ignore it. But the responsibility remains, hovering over the agent, dictating that their life is not truly their own to live.

  ### Summary for Your Reply
  You can tell your friend this:

  1.  **Concede:** "You are right that Williams isn't asking for a calculation in the moment. The distinction between criterion and procedure saves utilitarianism from being psychologically absurd."
  2.  **Pivot:** "But Williams isn't arguing about psychology; he's arguing about **justification** and **identity**."
  3.  **The Knockout:** "Even if the husband doesn't *think* about utility, utilitarianism insists that his love is only *right* because of utility. This makes his commitment to his wife instrumental and contingent. It forces him to view his own life from a neutral, external standpoint. Integrity means your projects are yours; utilitarianism says they are only on loan from the general welfare. The 'one thought too many' isn't a conscious calculation; it's the theory's demand that it gets the final say on whether your love is permissible. That is the alienation Williams is talking about, and the criterion/procedure distinction doesn't touch it."

  Williams's point is that a moral theory that cannot accommodate the thought "I am saving her because she is *my wife*" as a **complete** justification (without reference to general welfare) is a theory that demands we abandon our integrity. Indirect utilitarianism hides the calculation, but it does not remove the subordination of the self to the calculus.
