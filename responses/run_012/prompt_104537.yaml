  7.  **Self-Correction/Check during drafting:**
      *   *Did I address the "one thought too many" specifically?* Yes, need to clarify that Williams uses it to illustrate a structural point, not just a psychological one.
      *   *Did I answer the specific question?* "Which part does the distinction answer and which part does it not?" Need to make this explicit.
      *   *Is the distinction between criterion and procedure clear?* Yes, ensure the friend's view is characterized fairly as "Indirect Utilitarianism."

  8.  **Final Polish:** (Reviewing against the prompt's request for precision on the "residue".)
