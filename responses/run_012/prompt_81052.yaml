answer: |-
  Here is the comparative judgment based on expected epistemic improvement over a twenty-year horizon, assuming the fixed selection and support mechanisms you described.

  ### Tier A: High Expected Epistemic Improvement
  **Design 1: Permanent Chamber with Suspensive Veto**
  *   **Score:** 0.80
  *   **Mechanism:** The power to delay forces the elected legislature to improve the justification and quality of bills to avoid the political cost of a second passage, without creating the gridlock of an absolute veto.
  *   **Failure Mode:** **Routine Override:** The elected house treats the veto as a mere procedural speed bump and routinely re-passes legislation without genuine reconsideration, rendering the chamber ceremonial.

  ### Tier B: Moderate Expected Epistemic Improvement
  **Design 4: Advisory Panels with Mandatory Response**
  *   **Score:** 0.65
  *   **Mechanism:** The "comply or explain" requirement creates a public record of reasoning, shaming the legislature into better justification even if they ignore the recommendation.
  *   **Failure Mode:** **Bureaucratic Box-Ticking:** The legislature generates formulaic, legalistic responses that technically satisfy the requirement to give reasons without engaging with the substantive epistemic input.

  **Design 5: Hybrid Chamber (50% Allotted, 50% Elected)**
  *   **Score:** 0.60
  *   **Mechanism:** Directly infuses non-partisan votes into the final decision, potentially breaking party whips on conscience issues or long-term planning.
  *   **Failure Mode:** **Partisan Socialization:** Allotted members rapidly assimilate into the norms, tribalism, and deal-making culture of the elected politicians they sit alongside, losing their distinct epistemic perspective.

  ### Tier C: Low Expected Epistemic Improvement
  **Design 3: Standing Body with Agenda Power Only**
  *   **Score:** 0.45
  *   **Mechanism:** Filters the legislative menu to prioritize high-salience or neglected issues, preventing the legislature from ignoring specific topics entirely.
  *   **Failure Mode:** **Strategic Bottleneck:** The elected leadership captures the agenda-setting process or simply ignores the body's prioritization, treating it as a suggestion box with no enforcement leverage.

  **Design 2: Ad Hoc Assembly (Binding on Petition)**
  *   **Score:** 0.40
  *   **Mechanism:** Corrects specific legislative failures on high-salience issues where the electorate is mobilized enough to petition.
  *   **Failure Mode:** **Framing Capture:** Because petitioners fix the question wording, well-funded interests can manipulate the framing to force the allotted body into a binary choice that precludes nuanced or superior policy solutions.

  ***

  ### Fastest Degradation
  Your friend is partially right that institutional drift is inevitable, but **Design 5 (The Hybrid Chamber)** would degrade the fastest. While Design 2 is vulnerable to external capture, that requires coordination among external actors; Design 5 suffers from *internal* socialization. The psychological pressure to conform to group norms is immediate and daily. Within a single term, allotted members in a mixed chamber are likely to adopt the partisan heuristics and adversarial posture of their elected colleagues to function effectively within the room. This erodes the unique epistemic value of sortition (independence from career incentives) much faster than the procedural erosion that would affect the veto or advisory models.

  ***

  ### The Voter Restriction Question
  Restricting the pool to those who voted in the last general election would **lower the scores of Design 1 and Design 5 significantly, likely dropping Design 5 into Tier C.**

  The primary epistemic engine of sortition is *cognitive diversity*—including voices systematically excluded from or disillusioned with the electoral process. Non-voters differ demographically and psychologically from voters (skewing younger, poorer, and more marginalized).
  *   **Impact on Design 5:** This design relies on allotted members resisting partisan pressure. Voters are *more* likely to have entrenched partisan identities than non-voters. By filtering for voters, you select for people already more invested in the status quo political game, accelerating the "Partisan Socialization" failure mode.
  *   **Impact on Design 1:** The veto power relies on the chamber representing a distinct "public interest" from the legislature. If the chamber is drawn only from voters, its composition mirrors the electorate that chose the legislature, reducing the distinctiveness of its perspective and making the "Routine Override" failure mode more likely.
  *   **Impact on Design 2:** This is the least affected, as the petitioners themselves must be registered to vote to sign; aligning the assembly with the petitioners creates coherence, though it reduces the check on populist framing.

  Your intuition is correct: restricting the pool reintroduces the selection bias sortition is meant to cure, disproportionately harming the designs that rely most on the allotted body having a *different* epistemic character than the elected one.
