prompt: |-
  There's a result I keep failing to get across in a seminar: Good's theorem — free information can't lower your expected payoff if you'll act sensibly once you've got it, even though some of what you might learn leaves you worse off than you were before you looked, and you'd take the same deal again. I've got a decision theory reading group, 10-12 people, 75 minutes, mixed math comfort, and I want them to live through it rather than watch me prove it. So: a game where they pick an action, then get offered a free look, arranged so that the ones who look sometimes end up visibly worse off than the ones who don't — and the accounts afterwards show that the ones who didn't look were wrong in expectation. Give me the rules, the materials (nothing to buy), the payoff table (play money or points is fine), a stage-by-stage script of what I do and say, and a debrief that pulls apart the ex ante and the ex post claim, names the assumptions it leans on (the look is free, you act optimally after it, you can't unlearn what you saw, nobody else sees it) and says what goes wrong when each one fails. I'd also like one round where the look is worth exactly nothing because there's no decision left to make once you've had it. Tell me what will predictably go wrong the first time i run it, and what the game can't reproduce that I'll have to just say out loud.
