          *   If State = Good: No Look gets High Payoff. Look gets High Payoff (if signal perfect) or High Payoff (if signal imperfect).
          *   If State = Bad: No Look gets Low Payoff (Crash). Look gets Medium Payoff (Safe).
          *   *To make Lookers feel worse:* I need a scenario where looking makes you *switch* to a suboptimal action for the *actual* state realized, due to imperfect information, OR simply the opportunity cost of playing safe when you could have won big.
          *   *Better approach for the "Pain":* Use imperfect information.
          *   State: Heads (Win) / Tails (Lose).
          *   Action 1 (Risky): Win 100 if Heads, Lose 50 if Tails.
          *   Action 2 (Safe): Win 10 if Heads, Win 10 if Tails.
          *   No Info: EV(Action 1) = 0.5*100 + 0.5*(-50) = 25. EV(Action 2) = 10. Rational choice: Action 1.
          *   Info: Coin toss bias signal? No, let's use a deck of cards.
