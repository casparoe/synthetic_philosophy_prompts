answer: |-
  Here is a complete seminar plan designed to make Good's Theorem felt rather than just proved.

  # Seminar Plan: The Value of Knowing (Good's Theorem)
  **Time:** 75 Minutes
  **Participants:** 10–12 (Split into two teams: **Team Blind** and **Team Seer**)
  **Materials:** 
  *   20 small slips of paper (pre-prepared, see below).
  *   Whiteboard/Flipchart.
  *   Pens for participants.
  *   Play money (or just keep score on the board).

  ---

  ## 1. The Setup (10 Minutes)

  **The Hook:**
  "Today we are testing a claim from decision theory: *Free information is never bad for you.* Intuitively, that sounds true. But if I tell you that looking at the information might make you change your mind, and changing your mind might make you lose money you could have won, does it still hold? We're going to bet on it."

  **The Teams:**
  *   Divide the room: 6 people **Team Blind** (No Info), 6 people **Team Seer** (Free Info).
  *   Tell them: "You will play 5 rounds. Your goal is to maximize your personal score. I will tally team averages at the end."

  **The Game Mechanics (Write on Board):**
  *   **The State:** In each round, there is a hidden State: **GOOD** or **BAD** (50% chance each).
  *   **The Actions:**
      *   **INVEST (Risky):** Payoff +100 if GOOD, -20 if BAD.
      *   **SAVE (Safe):** Payoff +30 always.
  *   **The Choice:**
      *   **Team Blind:** Must choose INVEST or SAVE without knowing the State.
      *   **Team Seer:** Gets a **Hint** about the State first, *then* chooses INVEST or SAVE.
  *   **The Hint (Crucial):** The Hint is 80% accurate.
      *   If State is GOOD, Hint says "GO" 80% of the time, "STOP" 20% of the time.
      *   If State is BAD, Hint says "STOP" 80% of the time, "GO" 20% of the time.

  **Preparation (Do this before they arrive):**
  Prepare 10 slips for the 5 rounds (2 slips per round, one for each Seer player, or just draw from a bag). Actually, to keep it simple for 5 rounds:
  Prepare a "Deck of States" (5 GOOD cards, 5 BAD cards).
  Prepare a "Deck of Hints" correlated to the States.
  *Easier Method:* Pre-write 10 scenario slips.
  *   4 Slips: State=GOOD, Hint="GO"
  *   1 Slip: State=GOOD, Hint="STOP" (The Pain Slip)
  *   4 Slips: State=BAD, Hint="STOP"
  *   1 Slip: State=BAD, Hint="GO"
  *Shuffle these 10 slips. Draw one for each Seer player each round.*

  ---

  ## 2. The Main Game (30 Minutes)

  **Script:**
  1.  **Instruction:** "Team Blind, you must decide now: INVEST or SAVE? Write it down." (Give them 30 seconds).
      *   *Facilitator Note:* Ensure they calculate EV. INVEST EV = 40. SAVE EV = 30. If they play Safe due to risk aversion, remind them: "Play for max expected score over 5 rounds."
  2.  **Instruction:** "Team Seer, come to the front. Draw a slip. Look at the Hint. Do not show anyone. Go back, then choose INVEST or SAVE."
  3.  **Reveal:** "Reveal the State for this round." (Draw a card from a separate 50/50 deck, or reveal the State part of the slip if you structured it that way. *Better:* Use the Pre-written Slips for Seers. For Blind, just flip a coin publicly so everyone sees the State was fair).
      *   *Correction for Fairness:* To ensure Blind and Seer face the *same* States, use one master deck of 5 GOOD / 5 BAD states for the rounds. The Seers get the correlated hints for those specific states.
  4.  **Scoring:** Calculate points. Write scores on the board publicly.
      *   *Column 1:* Round #
      *   *Column 2:* State (Good/Bad)
      *   *Column 3:* Team Blind Avg Score
      *   *Column 4:* Team Seer Avg Score
  5.  **Repeat:** Do this for 5 Rounds.

  **The Tension Point:**
  Inevitably, in one of the rounds where State is **GOOD**, a Seer will draw the **"STOP"** hint (20% chance).
  *   They will play **SAVE** (+30).
  *   Team Blind (playing rational EV) will play **INVEST** (+100).
  *   **Result:** The Seer player will visibly score 70 points *less* than the Blind player.
  *   **Call it out:** "Look at Round 3. Sarah (Seer) got 30. John (Blind) got 100. Sarah, do you regret looking?" (Let her say yes).

  ---

  ## 3. The Zero-Value Round (10 Minutes)

  **Script:**
  "Okay, new game. One round only. Same teams."
  **The Payoffs:**
  *   **Action A:** +50 points (Always).
  *   **Action B:** +10 points (Always).
  **The Info:**
  *   Team Seer gets a Hint about the State (Good/Bad).
  *   Team Blind does not.
  **The Catch:** The State does not affect payoffs. Action A dominates Action B regardless of State.

  **Execution:**
  1.  Team Blind picks A.
  2.  Team Seer looks at Hint (says "Go" or "Stop"). They still pick A.
  3.  Reveal State.
  4.  **Score:** Everyone gets 50.
  5.  **Ask:** "What was the value of the information for Team Seer?"
  6.  **Answer:** Zero. It changed nothing.

  ---

  ## 4. Aggregation & The Reveal (10 Minutes)

  **Script:**
  "Look at the board. In Round 3, the Seers lost to the Blind. But look at the **Total**."

  *   **Team Blind Total:** Likely around 200 (40 EV * 5 rounds).
  *   **Team Seer Total:** Likely around 265 (53 EV * 5 rounds).
  *   *Note:* With small numbers, variance might obscure this. If the Seers didn't win on aggregate, **do not fake it.** Use this as data. "The theorem says *Expected* Value. We played 5 hands. Variance exists. But mathematically, let's see why the Seers *should* have won."

  **The Math (Whiteboard):**
  Draw the decision tree.
  1.  **Blind:** $0.5(100) + 0.5(-20) = 40$.
  2.  **Seer:**
      *   Case Good (50%): 80% Invest (100) + 20% Save (30) = 86.
      *   Case Bad (50%): 80% Save (30) + 20% Invest (-20) = 20.
      *   Total EV: $0.5(86) + 0.5(20) = 43 + 10 = 53$.
  3.  **Comparison:** $53 > 40$.

  **The Punchline:**
  "Good's Theorem holds. The Seers won in expectation. But Sarah (the Seer in Round 3) still lost money *because* she looked. How is this possible?"

  ---

  ## 5. Debrief & Theory (15 Minutes)

  **Ex Ante vs. Ex Post:**
  *   **Ex Ante (Before the hint):** The *option* to look is worth 13 points (53 - 40). You would pay up to 13 points for the hint.
  *   **Ex Post (After the hint):** Once you see "STOP" in a GOOD state, you have incurred an **Opportunity Cost**. You switched to a safe action that paid less than the risky action would have.
  *   **Key Insight:** Information has value because it lets you avoid disasters (Bad State/Invest). It has a cost in *regret* when it makes you miss out on windfalls (Good State/False Stop). The value comes from the asymmetry of the payoffs (avoiding -20 is 'cheaper' than missing 100, but the probability weighting makes it worth it).

  **The Assumptions (Write on Board):**
  Ask the group: "What did we assume to make this math work?"
  1.  **Free Information:** The hint cost 0 points. If it cost 15 points, Seers lose (53 - 15 < 40).
  2.  **Rational Action:** We assumed Seers *act* on the info. If Sarah saw "STOP" and gambled anyway, the value vanishes.
  3.  **Private Information:** If Team Blind could see Sarah's hint, they might change their strategy (Game Theory). Good's theorem is for single-agent decision theory.
  4.  **Linear Utility:** We treated points as money. If Sarah is risk-averse, -20 hurts more than 100 helps.

  **What Goes Wrong When Assumptions Fail:**
  *   *Costly Info:* Value can be negative net.
  *   *Irrationality:* If you can't process the info, value is zero.
  *   *Strategic Settings:* If your opponent sees you looking, they might bluff. Info can be a liability in poker.

  ---

  ## 6. Predictable Pitfalls & Limitations

  **What will go wrong the first time you run it:**
  1.  **Risk Aversion in Team Blind:** Participants might choose SAVE (+30) instead of INVEST (EV +40) because -20 feels bad.
      *   *Fix:* Explicitly frame the game as "You are a fund manager playing 1,000 rounds. Maximize the aggregate." Or increase the payoff to +1000 / -200.
  2.  **Distrust of the Hint:** Seers might think the Hint is a trick and ignore it.
      *   *Fix:* Run a practice round where you show them the correlation explicitly.
  3.  **Small Sample Size:** In 5 rounds, Team Seer might actually lose due to variance (e.g., if they hit the "False Stop" hint twice).
      *   *Fix:* Acknowledge variance. "The theorem is about Expectation, not Guarantee. If we played 1,000 rounds, the Seers crush the Blind."
  4.  **Confusion on "State":** Participants might think the Hint *determines* the State rather than correlates.
      *   *Fix:* Be precise with language. "The Hint is a weather forecast. The State is the actual weather."

  **What the game can't reproduce (Say this out loud):**
  1.  **Psychological Cost:** The game assigns points. It cannot measure the anxiety of looking. Some people *prefer* not to know (information aversion), even if it costs them money. Good's theorem assumes you care only about the outcome, not the state of your knowledge.
  2.  **Computational Cost:** We assumed processing the hint was instant and free. In reality, thinking takes time/energy.
  3.  **Identity/Values:** Sometimes knowing the truth forces you to act against your values (e.g., a trolley problem). The theorem assumes a consistent utility function.

  ---

  ## Facilitator Cheat Sheet (Payoff Logic)

  | Scenario | Probability | Blind Action | Blind Payoff | Seer Hint | Seer Action | Seer Payoff | Difference |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **State Good** | 50% | Invest | +100 | Go (80%) | Invest | +100 | 0 |
  | | | | | **Stop (20%)** | **Save** | **+30** | **-70 (Pain)** |
  | **State Bad** | 50% | Invest | -20 | Stop (80%) | Save | +30 | **+50 (Gain)** |
  | | | | | Go (20%) | Invest | -20 | 0 |

  **Expected Value:**
  *   **Blind:** $0.5(100) + 0.5(-20) = 40$
  *   **Seer:** $0.5[0.8(100) + 0.2(30)] + 0.5[0.8(30) + 0.2(-20)] = 43 + 10 = 53$
  *   **Value of Info:** $53 - 40 = 13$ points per round.

  **Zero-Value Round Logic:**
  *   Action A: 50. Action B: 10.
  *   Blind picks A (50).
  *   Seer sees Hint, picks A (50).
  *   Value: 0.

  ---

  ## Closing Script
  "Good's theorem tells us that *flexibility* has value. The Seers weren't smarter; they just had the option to brake. Sometimes braking when the road is clear feels like a mistake—and in that specific moment, it *was* a mistake. But having the brakes available made the car safer overall. That is why free information is never negative in expectation, even if it sometimes leaves you wishing you'd stayed blind."
