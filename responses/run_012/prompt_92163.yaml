          *   I need the Looker to switch to Safe *when they could have won*.
          *   Signal says "Stop" (False Alarm). Looker takes Safe (10). No-Looker took Risky (100). Looker is visibly worse off.
          *   *But* in the "Lose" state, Looker takes Safe (10), No-Looker takes Risky (-50). Looker is better off.
          *   *Average:* Looker > No-Looker.
          *   *Individual:* Some Lookers < Some No-Lookers.
