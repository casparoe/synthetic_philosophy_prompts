      *   *Hint Accuracy:* 75% accurate.
      *   *Implementation:* I pre-generate the State/Signal pairs on slips of paper. This ensures the probabilities hold and saves time on shuffling/explaining complex card correlations during the game.
      *   *Slips:* 20 slips.
          *   10 slips: State=Good. (8 say "Hint: Good", 2 say "Hint: Bad").
          *   10 slips: State=Bad. (8 say "Hint: Bad", 2 say "Hint: Good").
