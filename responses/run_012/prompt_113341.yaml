answer: |-
  **Terms and Thesis**

  To begin, we must define our terms without leaning on intuition pumps. By **causation**, I mean a relation of counterfactual dependence between events or states of affairs. $C$ is a cause of $E$ if and only if, had $C$ not occurred (or obtained), $E$ would not have occurred. By **omission**, I mean the non-occurrence of an event within a specific context where that event was possible and, crucially, expected. By **causal selection**, I mean the pragmatic process by which agents isolate one or a few causes from the total set of counterfactual dependencies for the purposes of explanation, blame, or intervention.

  My position is this: Omissions are genuine causes. There is no metaphysical distinction between "doing" and "allowing." The intuition that there is such a distinction arises from conflating the *causal structure of the world* (the territory) with *causal selection* (the map). The gardener's failure to water is a cause of the plants' death in the same ontological sense that a drought is a cause. If this implies that nearly everything is a cause of nearly everything, that is not a bug; it is a feature of the territory. The work is done not by restricting causation, but by explaining why we select specific causes from the infinite web of dependencies.

  **The Counterfactual Trap**

  The strongest argument for omissions as causes is the counterfactual account, most famously associated with David Lewis. It is simple and robust: if the gardener had watered the plants, they would not have died. Therefore, the non-watering is a cause.

  However, this account immediately triggers the problem of **over-generation**. Consider the plants again. It is also true that if the Queen of England had watered the plants, they would not have died. It is true that if a meteor had not struck the greenhouse, they would not have died. It is true that if the gardener had not been born, he couldn't have failed to water them, so they would have died anyway (or perhaps someone else would have watered them). The counterfactual dependence relation is ubiquitous. For any event $E$, there are indefinitely many non-events $C_1, C_2, \dots C_n$ such that if $C_i$ had occurred, $E$ would not have.

  If we accept the counterfactual account, the Queen's omission is just as much a cause of the plants' death as the gardener's. This strikes most people as absurd. The standard response in the literature is to patch the definition of causation. Some propose that causes must involve energy transfer (process theories), which excludes omissions because "nothing" transfers no energy. Others introduce normative constraints directly into the metaphysics, arguing that an omission is only a cause if there was a duty to act.

  I argue that patching the definition is a category error. It attempts to solve a pragmatic problem with an ontological solution. The over-generation of causes is not a failure of the theory; it is an accurate description of the causal structure of the universe. The universe does not care about duties, norms, or energy transfers; it cares only about dependencies. The fact that the Queen's omission is a cause is true. The fact that we do not *talk* about it as the cause is a feature of our psychology and social coordination, not a feature of the physics.

  **Structure vs. Selection**

  We must therefore distinguish **causal structure** from **causal selection**.

  Causal structure is the complete set of counterfactual dependencies surrounding an event. It is objective, mind-independent, and massively over-generated. In the garden case, the causal structure includes the gardener's omission, the Queen's omission, the lack of rain, the soil composition, and the sun's heat. All are equally "real" causes.

  Causal selection is the subjective, context-dependent process of highlighting one node in that structure. We select causes based on **abnormality**, **intervention capability**, and **normative expectation**. We select the gardener's omission over the Queen's because the gardener had a specific duty (normative expectation) and was the only one in a position to easily intervene (capability). We select the lack of water over the presence of sunlight because the sunlight is the background condition (normal) and the lack of water is the deviation (abnormal).

  This distinction dissolves the metaphysical worry. We do not need to prove that omissions are "less real" than commissions. We only need to explain why we treat them differently in discourse. The difference is not in the *making* of the cause, but in the *naming* of it.

  **The Dead Man's Switch**

  Let us test this distinction on your case. An operator sits at a dead man's switch. The core stays cool only while she holds a button. If she releases it, coolant stops, and the core melts.

  *Case 1 (The Slip):* The operator is distracted, her hand slips, she releases the button, and the core melts.
  *Case 2 (The Sabotage):* The operator deliberately presses a second button marked 'coolant cutoff', and the core melts.

  **Metaphysical Analysis**
  Under the counterfactual account, the causal structure is nearly identical in both cases.
  In Case 1, the meltdown counterfactually depends on the *absence* of pressure on the primary button.
  In Case 2, the meltdown counterfactually depends on the *presence* of pressure on the secondary button.
  However, even in Case 2, the meltdown depends on the *absence* of her refraining from pressing the button.
  More importantly, in both cases, the meltdown depends on the *design of the system*. If the system had a fail-safe coolant dump, the meltdown would not have occurred in either case. Thus, the design is a cause in both scenarios. The operator's action (or inaction) is a cause in both scenarios. Metaphysically, there is no deep difference between the slip (omission of holding) and the press (commission of cutting). Both are necessary conditions in the actual world for the outcome, given the background conditions.

  **Causal Selection and Fault**
  Where the cases diverge is in causal selection, driven by norms and abnormality.

  In **Case 1 (The Slip)**, we have two competing candidates for selection: the Operator and the Designers.
  *   *Selecting the Operator:* We view the "normal" state as the operator holding the button. Her hand slipping is a deviation from her expected performance. Because this deviation is abnormal (she is usually attentive) and within her locus of control, we select her omission as the cause.
  *   *Selecting the Designers:* We can shift the background. If we consider "human fallibility" as a normal constant, then a system design that relies on perfect human vigilance is the abnormal deviation. A safe system should be fail-safe, not fail-deadly. If we adopt the norm that "engineering must tolerate human error," then the *design* becomes the salient cause. The operator's slip is merely the trigger; the design is the loaded gun.

  My account predicts that we will oscillate between blaming the operator and the designers in Case 1, because both are valid selections from the causal structure depending on which norm we prioritize (duty of care vs. duty of safe design).

  In **Case 2 (The Sabotage)**, the selection shifts overwhelmingly to the Operator.
  Why? Because the "normal" background expectation is that agents do not deliberately destroy their workplace. This is a stronger norm than "operators do not slip." A slip is a minor deviation from competence; sabotage is a massive deviation from moral and legal norms.
  Furthermore, the Designers are rarely selected as causes in Case 2. Why? Because it is not a standard engineering norm to design systems that are immune to *deliberate, authorized access sabotage*. To make the system immune to Case 2 would require removing the cutoff button entirely, which might be functionally necessary. Thus, the design is not "abnormal" in the same way it was in Case 1.

  **The Verdict on Fault**
  You asked if my selection principle can say why we fault her in one case and the designers in the other, or if we might be wrong to.

  My argument implies that **we are often wrong to treat these as mutually exclusive.** In Case 1, if we blame *only* the operator, we are ignoring the causal contribution of the design (the failure to engineer redundancy). If we blame *only* the designers, we ignore the causal contribution of the operator's lapse. The "either/or" nature of our blame is a limitation of our social punishment systems, which prefer single villains, not a reflection of the causal structure.

  However, the selection principle explains why the *weight* of blame shifts. In Case 1, the operator's deviation (a slip) is low-magnitude, while the design's deviation (reliance on vigilance) is high-magnitude relative to safety norms. Therefore, a rational selection process should weight the designers' causal contribution more heavily than the operator's. In Case 2, the operator's deviation (sabotage) is maximal. The design's contribution is minimal (providing a necessary tool). Therefore, selection falls on the operator.

  If our legal or moral systems punish the operator fully in Case 1 while exonerating the designers, my argument suggests the system is utilizing a flawed selection heuristic—one that prioritizes "active human error" over "passive systemic fragility"—rather than tracking the true causal structure.

  **Calibration**

  I am **85% confident** in the conclusion that omissions are genuine causes and that the distinction between doing and allowing is pragmatic rather than metaphysical. The counterfactual account is too robust to discard, and the "Structure vs. Selection" distinction cleanly dissolves the paradoxes without requiring ad-hoc metaphysical patches.

  The step in this argument I am **least sure of** is the bridge from *causal selection* to *moral fault*. I have argued that because the design is a cause in Case 1, the designers share responsibility. However, it is possible that moral responsibility requires a condition beyond causal contribution—specifically, a condition of *intentionality* or *agency* that omissions (and systemic design choices) satisfy differently than direct actions.

  For this step to fail, it would have to be true that **moral responsibility tracks "agency" in a way that is metaphysically distinct from causal contribution.** If there is a deep metaphysical difference between "letting die" and "killing" that impacts moral desert *independently* of social norms or consequences, then my pragmatic account of causation would remain true, but its application to ethics would be incomplete. I suspect no such metaphysical difference exists, but I cannot prove it from causation alone.
