      *   *Postdoc:* **Causal/Interventionist view.** A representation is real only if manipulating it changes behavior in a predictable way. (Close to Woodwardian interventionism or Dretske's informational semantics + causal role).
      *   *Advisor:* **Semantic/Functional view.** Representation is tied to the *content* of the behavior (accuracy, confusion). If the model outputs correct dates, it "knows" the format. The internal state inherits meaning from the successful function. (Close to Millikan's teleosemantics or Dennett's intentional stance).
