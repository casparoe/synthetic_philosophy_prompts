answer: |-
  Here is the restatement of the anti-commodification critique within the formal vocabulary of mechanism design, followed by the residue report and the verdict on the translation loss.

  ### I. The Restatement: Anti-Commodification as Admissibility Constraints

  Let the economic environment be $E = (N, \Theta, X, \succeq)$, where $N$ is the set of agents, $\Theta$ the type space, $X$ the set of outcomes, and $\succeq$ the preference profile. A mechanism is $\Gamma = (M, g)$, mapping messages $m \in M$ to outcomes $x \in X$.

  Standard welfare economics treats commodification as an expansion of the feasible set $X$ or the message space $M$ (allowing monetary transfers $t$). The anti-commodification critique is restated here not as a welfare loss (a negative term in the utility function), but as a hard constraint on the **admissible message space** and the **range of the outcome function**.

  #### 1. Kidneys (Bodily Integrity and Undue Inducement)
  *   **Standard MD:** A matching market. Agents $i$ have types $\theta_i$ (health status, compatibility). Outcome $x$ includes allocation of kidney $k$ and transfer $t$. IC ensures truthful reporting of compatibility; PC ensures donors participate voluntarily ($u_i(x, t) \geq 0$).
  *   **Anti-Commodification Translation:** The constraint is on the **transfer component** of the outcome vector.
      *   Let $x = (k, t)$. The set of feasible outcomes is restricted to $X' \subset X$ such that $\forall i, t_i = 0$ for organ transfer.
      *   Alternatively, restrict the message space $M$. Agents cannot send messages $m_i$ that constitute a bid $b_i > 0$ for an organ.
      *   **The Constraint:** The mechanism $\Gamma$ is inadmissible if its range includes any $x$ where $\exists t \neq 0$ correlated with biological material. This violates a **Normative Participation Constraint**: even if $u_i(k, t) > u_i(k, 0)$, the type $\theta_i$ is not permitted to realize utility via $t$ in this domain. The "type" is legally/morally bounded from acting as a seller.

  #### 2. Votes (Political Equality and Aggregation)
  *   **Standard MD:** A social choice function $f: \Theta^n \to A$. If votes are tradable, the mechanism allows side-payments. Agents reveal intensity of preference via willingness to pay.
  *   **Anti-Commodification Translation:** The constraint is on the **transferability of utility** across specific domains.
      *   Standard MD often assumes Quasi-Linear Utility (QLU): $u_i(a, t) = v_i(a) + t$. This allows votes to be priced.
      *   **The Constraint:** The admissible type space $\Theta$ for voting mechanisms excludes QLU. The utility function is non-separable or lexicographic regarding the voting right.
      *   More formally, the message space $M$ for a voting mechanism is restricted to $M = \{ \text{rankings} \}$, explicitly excluding $M' = \{ \text{rankings} \times \mathbb{R} \}$.
      *   **Incentive Compatibility:** A mechanism allowing vote-selling might be IC (truthful revelation of intensity), but it violates a **Constitutional Feasibility Constraint**. The allocation rule $g$ must be anonymous and neutral *without* regard to endowments $w_i$. Introducing price makes $g$ contingent on $w_i$, rendering the mechanism inadmissible for the domain of "citizenship."

  #### 3. Price-Gouging (Necessity and Solidarity)
  *   **Standard MD:** A market clearing mechanism. Price $p$ adjusts until $\sum \text{demand} = \sum \text{supply}$. High demand during scarcity raises $p$.
  *   **Anti-Commodification Translation:** The constraint is on the **outcome function's range** regarding price vectors.
      *   Let $x = (q, p)$. The feasible set is constrained by $p \leq \bar{p}$, where $\bar{p}$ is a normatively determined ceiling (e.g., pre-disaster price).
      *   **Participation Constraints:** The seller's PC ($u_{seller} \geq 0$) is overridden by a **Social Rationality Constraint**. Even if the seller prefers $(q, p_{high})$, the mechanism design forbids the message $m_{ask} > \bar{p}$.
      *   This treats "solidarity" not as a preference in $u_i$, but as a restriction on the strategy space. You are not allowed to play the strategy "exploit scarcity."

  ---

  ### II. The Residue Report

  Here we analyze what survives the translation from philosophical critique to mechanism design formalism.

  | Anti-Commodification Claim | Translates Cleanly (MD Equivalent) | Distorted to Fit (Forced Translation) | No Counterpart (Lost in Translation) |
  | :--- | :--- | :--- | :--- |
  | **Kidneys:** Selling degrades human dignity / treats body as property. | **Constraint on $X$:** Prohibition on transfers $t$ for biological goods. | **Type Definition:** MD treats "dignity" as a fixed preference parameter or constraint. Philosophy argues the market *constitutes* the loss of dignity. | **Constitutive Meaning:** MD cannot model how the mechanism *changes the definition* of the good (from "gift" to "commodity") endogenously. |
  | **Votes:** Selling votes undermines equality / turns citizens into consumers. | **Constraint on $M$:** Excluding monetary messages from the ballot. | **Utility Separability:** Forcing non-QLU preferences. MD assumes preferences exist *prior* to the mechanism; critique says the mechanism defines the agent's role. | **Role Morality:** The distinction between "citizen type" and "consumer type" is ontological, not just a restriction on the message space. |
  | **Gouging:** Profiting from necessity violates solidarity. | **Price Ceiling:** Exogenous constraint $p \leq \bar{p}$ on the outcome function. | **Objective Function:** Treating solidarity as a hard constraint rather than a social welfare weight. | **Expressive Harm:** The signal sent by *allowing* the price (even if no trade occurs) is a social outcome MD typically ignores. |

  #### Analysis of the Residue

  1.  **What Translates Cleanly:** The **policy implication**. If the philosophical conclusion is "we must ban this market," MD captures this perfectly as a restriction on the feasible set of mechanisms $\mathcal{M}_{feasible} \subset \mathcal{M}_{all}$. The *prohibition* is mathematically isomorphic.
  2.  **What Must Be Distorted:** The **source of the constraint**. In MD, constraints are usually exogenous (technology, law). In the critique, the constraint is endogenous to the *meaning* of the interaction. To fit MD, we must treat "meaning" as a static boundary condition, whereas the critique argues the boundary is dynamic and normative.
  3.  **What Has No Counterpart:** The **Expressive/Constitutive Dimension**. Standard MD is consequentialist. It evaluates mechanisms based on the allocation $x$. It does not evaluate the *relationship* established by the mechanism $\Gamma$ itself, independent of $x$. If a market for votes is proposed but no trades occur (equilibrium is no trade), MD sees no harm. The philosopher sees harm in the *existence* of the market institution.

  ---

  ### III. The Verdict: Defect of Vocabulary or Clarity of Critique?

  You asked whether the residue is a defect of the mechanism-design vocabulary or a sign that the original critique was less clear than it looked.

  **The Verdict:** The residue is primarily a **defect of the standard mechanism-design vocabulary**, specifically its commitment to **consequentialism** and **fixed ontologies**.

  However, there is a secondary failure of clarity in the philosophical critique when it attempts to prescribe policy without acknowledging the trade-offs MD highlights.

  #### 1. Why Mechanism Design is Deficient Here
  Standard mechanism design operates on a **Fixed World Assumption**. It assumes:
  *   Agents ($N$) and Types ($\Theta$) are pre-defined.
  *   Goods ($X$) have fixed properties.
  *   The mechanism $\Gamma$ is a neutral tool to map $\Theta \to X$.

  The anti-commodification critique relies on a **Constitutive World Assumption**:
  *   The mechanism $\Gamma$ *defines* the Agents (e.g., "citizen" vs. "customer").
  *   The mechanism $\Gamma$ *defines* the Good (e.g., "civic duty" vs. "asset").
  *   The act of implementation changes the Type Space $\Theta$ for future periods (endogenous preferences/norms).

  When you treat repugnance as a constraint on the admissible message space, you are treating a **structural/ontological objection** as a **boundary condition**. In MD, a boundary condition is something you hit; in the critique, the boundary is the thing that holds the social reality together. MD lacks the vocabulary to model "social ontology" as a variable. It can model the *ban*, but it cannot model the *reason* for the ban as anything other than an arbitrary preference of the designer.

  #### 2. Is Something Lost?
  **Yes.** By translating the objection into a constraint on feasible trades, you lose the **expressive content** of the prohibition.
  *   **In MD:** A ban on kidney sales is equivalent to a price ceiling of $0$. It is a scarcity constraint.
  *   **In Philosophy:** A ban on kidney sales is a declaration that kidneys are *not the kind of thing* that can be priced.

  If you treat it merely as a constraint on trades, you leave open the possibility that if the efficiency gains were high enough, the constraint could be relaxed (which is exactly what the "cost in the objective function" approach does, which you explicitly excluded). But by making it a hard constraint, MD renders the reason for the constraint **exogenous and unexamined**. It becomes a "black box" parameter.

  #### 3. The "Dangerous" Knowledge Check
  You know enough MD to know that **implementation theory** asks: "Which social choice functions can be implemented?"
  The anti-commodification critique is actually making a meta-claim: **"Certain Social Choice Functions are illegitimate inputs to the implementation problem."**

  If you treat the critique *only* as a constraint on feasible trades, you imply that the moral work is done by the *outcome*. But the critique is often that the moral work is in the *process*.
  *   **MD View:** If no one sells a vote, the mechanism is harmless.
  *   **Philosopher View:** If the mechanism *allows* selling votes, citizenship is corrupted, even if no one sells.

  **Conclusion:**
  The objection to commodification is **not just a constraint on feasible trades**. It is a constraint on the **admissible class of mechanisms** based on their constitutive properties, not just their outcome ranges.

  To capture this in MD, you would need to expand the outcome space $X$ to include **institutional states** or **normative stocks** that depreciate when certain messages are admissible, regardless of whether they are sent. Standard MD lacks this state variable.

  Therefore, the residue is not a lack of clarity in the critique; it is the **ontological limit of consequentialist formalism**. The critique is clear: "This mechanism changes who we are." MD replies: "I can only model what you get." The translation fails not because the philosopher is vague, but because the mathematician's map does not include the territory of "meaning."
