      *   *Price-Gouging (e.g., water during a disaster):* Exploits necessity, violates norms of solidarity, treats survival as a commodity.
      *   *Core Philosophical Claim:* Certain goods lose their value or corrupt the social fabric when allocated via price mechanisms. It's not just about efficiency or distribution; it's about the *nature* of the good and the *relationship* between agents.

  3.  **Translate into Mechanism Design (MD) Vocabulary:**
      *   *Types ($\theta$):* Preferences, endowments, but also social norms/internal constraints.
      *   *Allocations ($x$):* Who gets what (kidney, vote, water).
      *   *Incentive Compatibility (IC):* Truth-telling is optimal.
      *   *Participation Constraints (PC):* Individual rationality (voluntary).
      *   *Feasible Mechanisms:* The set of rules allowed.
      *   *Admissible Message Space ($M$):* What can be said/offered.
      *   *The "Repugnance Constraint":* This is the key. Instead of $U(x) - \text{cost}(\text{repugnance})$, we say $(x, p) \in \mathcal{A}$ where $\mathcal{A}$ is the set of admissible allocations. If a price is attached to a vote, it's outside $\mathcal{A}$.

      *   *Kidneys:* Standard MD: Match donors to recipients. Anti-comm: Prohibit $p > 0$. Message space cannot include monetary bids for organs.
      *   *Votes:* Standard MD: Aggregation rule. Anti-comm: Prohibit transfer of voting rights for money. Message space is "vote for candidate," not "sell vote for $X."
      *   *Price-Gouging:* Standard MD: Clearing price equals demand. Anti-comm: Cap price $p \leq \bar{p}$. Message space restricts asks above $\bar{p}$.

  4.  **Drafting the Restatement (The "Translation"):**
      *   Need to be precise. Use the formalism.
      *   Define the environment $E = (N, \Theta, X)$.
      *   Define the mechanism $\Gamma = (M, g)$.
      *   The anti-commodification move is restricting $M$ or the range of $g$.
      *   *Kidneys:* Restrict transfers $t_i$. No $t_i > 0$ for organ transfer.
      *   *Votes:* Restrict the domain of preferences. Votes are not transferable utility.
      *   *Gouging:* Exogenous price ceiling as a constraint on the outcome function $g$.

  5.  **Drafting the Residue Report:**
