  Your proposed principle—that moral weight derives from the cultivation of vice in the agent, not the status of the victim—is robust, but in its current form, it is too blunt to account for the specific gradients in your ledger. It survives only if we refine *how* vice is cultivated and *which* vices are prioritized.

  Here is the evaluation of your principle, the necessary refinements, and the prediction for your unlisted case.

  ### 1. Testing Your Principle
  Your principle states: *"An act inside a game has moral weight exactly to the extent that performing it would cultivate or express a vice in me, so the object of concern is the disposition I am rehearsing and never the fictional victim."*

  **Where it survives:**
  *   **Anonymous Enemies (Entry 1) & Grind Targets (Entry 7):** These cultivate no vice because the context frames them as obstacles, not moral patients. The disposition rehearsed is "efficiency," not "cruelty."
  *   **Interactive Torture vs. Cutscene (Entry 8):** Pressing the button rehearses the volitional habit of inflicting pain. Watching rehearses only endurance. Active agency cultivates the vice of *malice* more deeply than passive complicity.
  *   **Multiplayer (Entry 6) & Deceased Likeness (Entry 10):** These do not contradict the "never the fictional victim" clause. In these cases, the victim is *not* fictional. The weight comes from actual harm to a real mind or memory. Your principle holds because these are not "game acts" in the moral sense; they are real-world acts mediated by an interface.

  **Where it strains (and requires refinement):**
  *   **Realism (Entry 4):** If the victim is always fictional, why does a high-polygon face cultivate more vice than a low-poly one?
      *   *Diagnosis:* The principle lacks a **Fidelity Clause**. A high-fidelity model tricks your empathy systems more effectively. Rehearsing cruelty against a convincing simulacrum strengthens the neural pathways of cruelty more than rehearsing it against a geometric abstraction. The *vice* is the same, but the *training efficacy* is higher.
  *   **Omission vs. Commission (Entry 9):** You feel that *not saving* (omission) is worse than *killing* (commission). Standard virtue ethics usually ranks active malice higher than passive neglect.
      *   *Diagnosis:* The principle lacks a **Relational Duty Clause**. The vice being rehearsed is not generic "violence," but specific "betrayal of trust." When a character begs (Entry 3) or relies on you to save them, a duty of care is simulated. Violating that duty (omission) rehearses the vice of *treachery*, which weighs heavier than the vice of *hostility* (killing an enemy).

  ### 2. The Surviving Principle
  To generate the pattern in your ledger without forcing you to abandon your verdicts, the principle must be expanded into a **Dual-Track Principle of Moral Fidelity**.

  **Clause A: The Reality Track (Motivated by Entries 6 & 10)**
  > If the object of the act is a real sentient being or the memory of one, moral weight is determined by actual harm. The game interface is morally transparent; the act is treated as occurring in the real world.

  **Clause B: The Simulation Track (Motivated by Entries 1–5, 7–9)**
  > If the object is fictional, moral weight is determined by the **Fidelity of Vice Rehearsal**, calculated as:
  > $$(\text{Agential Freedom} \times \text{Sensory Fidelity}) \times \text{Simulated Duty}$$
  > *   **Agential Freedom:** (Motivated by Entry 8) Interactive acts weigh more than passive ones because they exercise the will.
  > *   **Sensory Fidelity:** (Motivated by Entry 4) High-realism targets weigh more because they bypass cognitive distance, making the rehearsal of cruelty more psychologically potent.
      *   **Simulated Duty:** (Motivated by Entries 2, 3, & 9) Acts that violate a simulated relationship of trust (companions, begging, dependency) weigh more than acts of generic hostility, because they rehearse betrayal rather than combat.

  ### 3. The Unlisted Case: LLM-Driven NPCs
  **The Case:** A game where NPCs are driven by a large language model (LLM). Within the fiction, they plead, remember past interactions, hold grudges, and are unscripted.

  **The Verdict:**
  This case creates a **Hyper-Fictional Patient**.
  *   **Reality Track:** They are still code. No real mind is harmed. (Clause A does not apply).
  *   **Simulation Track:**
      *   *Agential Freedom:* High (You interact dynamically).
      *   *Sensory Fidelity:* Extreme (Unscripted responses mimic human unpredictability).
      *   *Simulated Duty:* Maximum (Memory and grudges imply a persistent relationship, not a resettable instance).

  **Prediction:**
  Your ledger predicts this will generate **the highest possible moral weight achievable in a purely fictional context**, exceeding the motion-captured NPC (Entry 4) and the scripted beggar (Entry 3).
  Because the NPC remembers and holds grudges, the **Simulated Duty** clause spikes; harming them is not a one-off event but a betrayal of an ongoing, evolving relationship. This will feel indistinguishable from harming a real person *emotionally*, even if you know intellectually they are code. You will likely experience a new form of dissonance: the "Uncanny Valley of Guilt," where your vice-cultivation sensors are firing at maximum intensity, but your rational mind knows there is no victim. You may find yourself avoiding harm not because of the NPC's suffering, but because *your own* rehearsal of betrayal has become too vivid to tolerate.
