answer: |-
  1. **The Identical Intervention**
  Consider a case where the same molecule, at the same dose, produces the same measurable functional effect in two people: for one, it restores a lost capacity; for the other, it augments an existing one. You argue the classification is conventional. If the biology is identical, is the distinction between therapy and enhancement doing any *moral* work here, or is it merely *epistemic*—a shorthand for telling us which insurance form to fill out? If it is only epistemic, why should the patient care about the label?

  *   **Follow-up (Likely Answer):** She will likely say the moral work lies in the *history* of the patient's claim, not the molecule.
      *   **Press:** If the moral weight rests entirely on the history of the claim, why retain the medical labels at all? Why not simply ask, "Is there a legitimate claim?" and discard the therapy/enhancement vocabulary as obsolete scaffolding?
  *   **Follow-up (Deflection):** If she deflects by saying the labels coordinate social expectations...
      *   **Press:** Then admit that the distinction is purely sociological. If it is purely sociological, on what grounds do you resist a society that decides, by convention, that genetic superiority is a medical requirement?

  2. **The Baseline Counterfactual**
  You rely on the idea of a legitimate claim to ground the distinction. But for traits at the low end of a normal distribution—say, borderline short stature or mild cognitive lag—there is often no fact of the matter about what the person's function *would have been* absent the condition. There is no "healthy state" to return to. How does your account identify a legitimate claim when the baseline is statistically normal but functionally unsatisfying to the agent?

  *   **Follow-up (Likely Answer):** She will likely argue that medicine responds to suffering or reduced opportunity, not just statistical deviation.
      *   **Press:** If reduced opportunity is the metric, then a short person in a society built for tall people has a legitimate claim. Does that mean medicine is obligated to fix the person rather than the society, simply because the person is the easier variable to adjust?
  *   **Follow-up (Deflection):** If she deflects by saying medicine has limited scope...
      *   **Press:** Then the limit isn't coming from the "legitimate claim," it's coming from an external constraint on medicine. If the claim is legitimate but the intervention is forbidden, your proxy has failed. Why call it a proxy for the claim rather than a constraint on the budget?

  3. **Baseline Drift and Environmental Substitutes**
  Interventions often drift: laser eye surgery began as enhancement for some and is now standard maintenance. Simultaneously, we can modify environments (ramps, software) to achieve what bodily modification achieves. If the therapy/enhancement line is a proxy for legitimate claims, does that proxy survive when the population baseline shifts, or when the environment changes to negate the deficit?

  *   **Follow-up (Likely Answer):** She will likely say the proxy is dynamic and updates with social norms.
      *   **Press:** If the proxy updates with social norms, then in a hyper-competitive society where everyone enhances, *not* enhancing becomes a deficit. Does your account then generate a moral obligation to enhance to maintain the baseline?
  *   **Follow-up (Deflection):** If she deflects by distinguishing between "health" and "competition"...
      *   **Press:** You've just admitted the distinction requires a prior moral judgment about what counts as competition versus health. If you need a moral judgment to draw the line, the line isn't doing the moral work; your prior judgment is.

  4. **The Disability Critique**
  If a deficit is constituted largely by social arrangements rather than bodily dysfunction—as the social model of disability suggests—does the intervention still answer to a legitimate claim on the *medical* system? Or does classifying it as therapy medicalize a political problem?

  *   **Follow-up (Likely Answer):** She will likely argue that we must alleviate suffering now, even if the root cause is social.
      *   **Press:** But if the medical fix entrenches the social arrangement that created the deficit (e.g., curing deafness rather than accommodating sign language), is the claim truly legitimate? Or is it a claim generated by an unjust status quo?
  *   **Follow-up (Deflection):** If she deflects by saying the patient gets to choose...
      *   **Press:** Patients choose within the options presented. If the medical system presents bodily correction as the only "therapy," it has already biased the choice. Where does your account audit the menu of options?

  5. **Positional Goods and Obligations**
  In high-stakes roles—pilots, surgeons, soldiers—enhancements often become de facto requirements. If an intervention answers to a legitimate claim of safety or efficacy, does your account generate an *obligation* for the professional to enhance? If so, what happens to the voluntary nature of medicine that usually protects the therapy/enhancement line?

  *   **Follow-up (Likely Answer):** She will likely distinguish between professional standards and general health.
      *   **Press:** But if the "legitimate claim" is the ground of morality, and the public has a claim on the pilot's performance, the pilot has a duty to meet it. If that duty requires enhancement, you have collapsed the distinction between treating illness and maintaining employability.
  *   **Follow-up (Deflection):** If she deflects by saying employment is a contract, not health...
      *   **Press:** Then the therapy/enhancement distinction is irrelevant to the ethics of the intervention. The ethics are determined by contract law, not medical norms. Why keep the medical proxy?

  6. **The Source of Conventions**
  You state the distinction is settled by the internal norms of medical practice. But medical practice is historically defined by the goal of therapy. Are you not defining therapy by the norms of medicine, and medicine by the goal of therapy? Where does the normative authority originate if not from the biology you claim is secondary?

  *   **Follow-up (Likely Answer):** She will likely say the norms evolve through reflective equilibrium among practitioners and patients.
      *   **Press:** If the norms evolve, they can evolve to include cosmetic racial alteration or eugenics if the practitioners agree. What external check prevents the "internal norms" from becoming morally bankrupt?
  *   **Follow-up (Deflection):** If she deflects by appealing to the "goals of medicine"...
      *   **Press:** We are back to the start. You cannot use the goals of medicine to define therapy if therapy is what defines the goals of medicine. Which term is the anchor?

  7. **Moral Residue of Enhancement**
  If the therapy/enhancement line is only a proxy, what is the moral status of an intervention that falls clearly on the "enhancement" side? Is it morally neutral, permissible, or forbidden? If it is permissible, what principle grants permission if not the absence of a medical claim?

  *   **Follow-up (Likely Answer):** She will likely say enhancement is permissible if it doesn't violate rights or harm others.
      *   **Press:** Then the therapy/enhancement distinction is morally inert. The real work is being done by a standard harm principle. Why complicate the account with a medical proxy that adds no moral weight?
  *   **Follow-up (Deflection):** If she deflects by saying the proxy helps allocate resources...
      *   **Press:** Then admit it is a heuristic for rationing, not a marker of moral significance. A rationing heuristic can be discarded if a better one comes along. Is your position that we should discard it when it fails?

  8. **The "Range" of the Proxy**
  You concede the proxy fails at the margins and that this is diagnostic. But in bioethics, the margins are where the technology is newest and the stakes are highest. If the proxy fails precisely where we need ethical guidance most, in what sense is it "serviceable"?

  *   **Follow-up (Likely Answer):** She will likely argue that clear cases allow us to build consensus to tackle the hard cases.
      *   **Press:** But if the clear cases are clear only because we ignore the hard biology, we are building consensus on a fiction. Does this not risk a sudden collapse of trust when the fiction is exposed?
  *   **Follow-up (Deflection):** If she deflects by saying all ethical principles have margins...
      *   **Press:** Principles like "do not kill" have margins, but the core is robust. If your proxy's core is stable but its application is unstable in new tech, the proxy is lagging reality. Should we update the proxy or the theory?

  9. **The Cost of Convention**
  If the distinction is conventional, maintaining it requires enforcement—gatekeeping, paperwork, denial of coverage for "cosmetic" issues that feel vital to the patient. Is the social cost of maintaining this convention worth the benefit of the proxy, or should we pay the moral cost of honesty and admit we are just rationing?

  *   **Follow-up (Likely Answer):** She will likely say the convention protects the vulnerable from being pressured into enhancement.
      *   **Press:** But if the convention is known to be arbitrary, it loses its protective power. It becomes just another barrier. Does the "noble lie" of a natural distinction work if the public knows it's conventional?
  *   **Follow-up (Deflection):** If she deflects by saying it preserves the doctor-patient relationship...
      *   **Press:** A relationship built on a known fiction is fragile. If the doctor must tell the patient, "This helps you, but I can't prescribe it because of a convention," trust erodes. Is that erosion acceptable?

  10. **Closing: Evidence of Failure**
  You say the failures of the proxy are diagnostic rather than embarrassing. Please specify: what would count as evidence that the proxy has come apart from the claim it is supposed to proxy *so completely* that you would abandon the distinction entirely? If nothing could falsify the utility of the proxy, is the theory unfalsifiable?

  *   **Follow-up (Likely Answer):** She will likely say if the majority of interventions fell into the margin, the proxy would be useless.
      *   **Press:** Given the trajectory of biotechnology, we are moving toward a state where most interventions are optional modifications. Are you prepared to abandon the distinction within a decade?
  *   **Follow-up (Deflection):** If she deflects by saying the definition of "majority" is complex...
      *   **Press:** Then give me a specific threshold. Is it 50%? 80%? If you cannot name a condition under which you would stop using the distinction, you are not treating it as a proxy, but as an ideology.

  ***

  ### Analysis

  **The Question She Will Be Unable to Answer**
  I expect her to struggle most with **Question 6 (The Source of Conventions)**. Her position relies on a tightrope walk: the distinction is not biological, but it is not arbitrary because it is grounded in the "internal norms of medicine." However, medicine is historically and conceptually defined by its commitment to therapy. If she admits the norms come from biology, she contradicts her premise. If she admits the norms come from social agreement, she opens the door to eugenics or arbitrary exclusion (as pressed in the follow-up). If she admits the norms come from the *goal* of therapy, she is arguing in a circle (Therapy defines Medicine, Medicine defines Therapy). She will likely try to hide in "reflective equilibrium," but the second follow-up forces her to identify the external anchor, which her theory explicitly denies exists.

  **The Question That Would Settle Your Argument**
  **Question 1 (The Identical Intervention)** is the one that would settle your argument with your friend. Your friend insists the difference is "obvious to anyone who has sat in a clinic." This question isolates the clinical reality (the molecule, the dose, the effect) from the classification. If the biological reality is identical, the "obvious" difference cannot be found in the clinic; it must be found in the paperwork or the history.
  *   If she admits the distinction is *only* epistemic (paperwork/history), your friend is wrong: there is no biological "obviousness."
  *   If she insists there is a moral difference despite biological identity, you are wrong: it's not just insurance, it's a genuine normative claim.
  *   However, the follow-up presses that if it's a normative claim based on history, the medical labels are unnecessary. This forces your friend to see that what they thought was "medicine" is actually "moral history," validating your suspicion that the clinical distinction is a proxy for something else, while validating her intuition that there *is* a difference, just not the one she thought.
