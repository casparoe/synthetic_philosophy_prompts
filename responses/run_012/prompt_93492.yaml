  **BUREAU OF BIOLOGICAL CLASSIFICATION**
  **INTERNAL HANDBOOK 44-B: REGISTRAR PROTOCOLS**
  **REVISION 11.4**

  **1.0 AUTHORITY AND MANDATE**
  Registrars are hereby instructed to issue Certificates of Life only to entities satisfying Definition 11.4. The Bureau's mandate is the maintenance of the Official Register. Registrars shall not engage in ontological speculation. Discrepancies between field observation and Register categories are to be resolved via the Amendment History below.

  **2.0 DEFINITION 11.4 AND AMENDMENT TRAJECTORY**
  An entity is classified *Living* if it exhibits (A) homeostatic metabolism OR (B) heritable variation subject to natural selection, PROVIDED THAT (C) the entity possesses a carbon-based substrate and (D) is a member of a lineage historically certified as Living.

  *2.1 Amendment History.*
  Definition 1.0 (Metabolism-only) was rescinded after Field Report 19-A admitted *Combustion Events* (Fire) to the Register. Definition 2.0 (Reproduction-added) excluded Fire but erroneously excluded sterile hybrids (e.g., *Equus ferus caballus × Equus africanus asinus*). Definition 3.0 restored hybrids via Kind-Membership clauses. Definition 5.0 (Metabolism-emphasized) excluded Viruses; Definition 6.0 (Evolution-emphasized) reinstated them following Petition 88-V. Definition 7.0 excluded Prions due to lack of nucleic acid. Definition 8.0 clarified that cryptobiotic states (e.g., frozen tardigrades) constitute a procedural pause, not termination. Definition 9.0 addressed Endosymbionts (Mitochondria), ruling them as Parts rather than Individuals. Definition 10.0 admitted synthetic RNA replicators but excluded immortalized cell lines (e.g., HeLa) as Lineage Fragments. Definition 11.0 admitted Cell Lines upon proof of continuous metabolism. Definition 11.4 added Substrate Constraint (C) to exclude self-replicating software following Incident Report 2001-AI.

  **3.0 PROCEDURAL PROTOCOLS**
  *3.1 The Origins Threshold.*
  In cases of abiogenesis or synthetic genesis, Registrars must identify the *Threshold of Continuity*. Certification attaches to the Lineage, not the individual molecule. The First Certified Entity is the earliest point in the continuous chemical process where Definition 11.4 is met without retrospective gap. Do not attempt to locate the precise moment of transition; select the nearest administratively convenient timestamp.

  *3.2 Factional Disputes.*
  Committee records indicate divergence between Metabolism-First and Evolution-First factions. A third faction maintains the Register is a filing convenience.^1 Registrars are instructed to apply Definition 11.4 uniformly regardless of theoretical alignment.

  **4.0 APPENDIX: FREQUENTLY DETERMINED CASES**
  *   **Wildfire:** Denied (See Def 1.0 History).
  *   **Bacteriophage:** Granted (Def 6.0).
  *   **Prion:** Denied (Def 7.0).
  *   **Mule:** Granted (Def 3.0 Kind-Membership).
  *   **Frozen Tardigrade:** Pending Thaw (Def 8.0).
  *   **Mitochondrion:** Denied (Part Status, Def 9.0).
  *   **HeLa Cell Line:** Granted (Def 11.0).
  *   **Self-Replicating Code:** Denied (Substrate Constraint, Def 11.4).

  **5.0 EXCERPT: APPEALS DECISION 892-B**
  *Petitioner:* Male Equine Hybrid (Mule).
  *Grounds:* Inability to reproduce violates Definition 2.0.
  *Ruling:* Certificate Granted.
  *Reasoning:* While the Individual lacks capacity for reproduction, the Kind (*Equus* hybrid) possesses reproductive capacity in the parental generation. Sterility is an accidental property of the individual, not an essential property of the Kind. To rule otherwise would require revocation of Certificates for all post-reproductive humans. The Register tracks Kinds, not physiological contingencies.

  **6.0 FOOTNOTES**
  ^1 *Note on Ontological Status:* The Definition is descriptive in intent and stipulative in effect. It describes natural clusters while simultaneously creating them through registration. Registrars are instructed not to worry about this.

  ^2 *Dissenting Opinion (Dr. Aris Thorne):* "After eleven amendments, the Definition resembles a patchwork quilt rather than a natural boundary. We admit viruses but exclude prions; we admit mules but exclude fire. I suspect no single criterion will do. We are not discovering life; we are drawing a line in the sand and pretending the tide respects it. I recommend we abolish the Register and issue Certificates of Interesting Chemistry instead." [Note: Dr. Thorne has been reassigned to Mineralogy.]

  **7.0 COMPLIANCE**
  Failure to adhere to Definition 11.4 may result in the existence of unregistered life forms. Registrars are reminded that unregistered life is not the Bureau's responsibility.

  **END OF DOCUMENT**
