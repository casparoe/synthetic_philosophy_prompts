          *   *Why?* In Athens, rich people had more visibility, resources to campaign (liturgies), and social networks. If you vote, you tend to pick the "notable" people (the rich/famous). If you draw names from a hat, every citizen has an exactly equal mathematical chance.
          *   *Explanation:* Need to clarify that "democracy" for Aristotle means "rule by the many poor," and they want strict equality. "Oligarchy" means "rule by the few rich," and they want merit/wealth to matter.

      *   *Point 2: The Mixture (Polity/Constitutional Government).*
          *   Aristotle has a taxonomy: Kingship, Aristocracy, Polity (good forms) vs. Tyranny, Oligarchy, Democracy (deviant forms).
          *   Wait, in Book 4, he often uses "Democracy" and "Oligarchy" as the two competing *factions* within a mixed state.
          *   The "Polity" (sometimes translated as "Constitutional Government") is the *mean* or mixture.
          *   Why "Aristocratic"? Because it selects for merit (election) but doesn't exclude based on wealth (no property qual). It creates a "best" group without being exclusive to the rich.
          *   *Key Concept:* The "Middle Constitution" (*Politeia*). It blends features to stabilize the state.

      *   *Point 3: Ambiguity as a Compliment.*
          *   If a system is purely democratic, the rich hate it. If purely oligarchic, the poor hate it.
          *   If it's mixed, the rich see the election part and think "Oligarchy!" (Good). The poor see the no-property-qual part and think "Democracy!" (Good).
          *   *Result:* Stability. Neither faction feels cheated. The ambiguity proves the balance is working.
          *   *Sparta Example:* Sparta had kings (monarchy), elders (oligarchy), and ephors/common input (democracy). Because it had elements of both, it lasted a long time.

  3.  **Evaluate the Teacher's Proposal against Aristotle:**

      *   *The Proposal:* 300 people, lottery, paid, 2-year term, 10-year cooldown, expert advisors (no vote).
