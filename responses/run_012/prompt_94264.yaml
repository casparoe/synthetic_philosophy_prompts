          3.  Section 2: Applying Aristotle to the Assignment (The Lottery Proposal).
          4.  Section 3: The "Outdated" Warning (Citizenship/Scale).
          5.  Conclusion: Summary advice for the essay.

      *   *Refining Point 1 (Election):* Emphasize *campaigning*. Rich people win elections because they are known. Lottery is blind equality.
      *   *Refining Point 2 (Aristocracy):* Explain that "Aristocracy" means "Rule of the Best." If you elect people (looking for the best) but don't require wealth (allowing the poor best to rise), you get a "Rule of the Best" that isn't just "Rule of the Rich."
