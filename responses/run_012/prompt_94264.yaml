      *   *Aristotle's View on Payment:* He knows payment allows the poor to serve (democratic feature).
      *   *Aristotle's View on Experts:* He distinguishes between ruling and being ruled. He might worry about experts having too much influence if they aren't accountable, but likes the idea of deliberation.
      *   *Relevance:* Aristotle is definitely applicable, but with caveats. He warns against *pure* democracy (rule by the poor without law). A pure lottery might lean too far toward the "democratic" extreme in his view, unless mixed with some elective element or structured to encourage merit.
      *   *However:* The prompt asks about *lottery vs. voting*. Aristotle says pure lottery = extreme democracy. Pure election = oligarchy. The *best* stable state mixes them.
      *   *Critique of Proposal:* Aristotle might say: "It's too democratic." He prefers the mixed model (election without property qual). But he might approve of the pay (enables poor to serve) and the term limits (prevents entrenched power).
      *   *Caveat on Citizenship:* User is right to worry about "citizens." Aristotle excluded women, slaves, laborers. The modern proposal implies "whole population." Need to address this distinction.

