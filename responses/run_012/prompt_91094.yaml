answer: |-
  This is a classic and difficult problem in the philosophy of science. You are grappling with the tension between the **Pessimistic Meta-Induction** (past theories were false, so current ones are likely false) and **Scientific Realism** (science converges on truth). Your specific friction point—distinguishing Fresnel's Ether from Newton's Absolute Space despite both having "abandoned ontology + surviving math"—is the precise battleground where **Structural Realism** fights with **Entity Realism**.

  Here is the breakdown of your friend's technical objection, a proposed principle to capture your verdicts, and an honest assessment of where your intuitions may need correction.

  ### 1. The Friend's Technical Objection: Newman's Problem

  Your friend's objection is known as **Newman's Problem** (after M.H.A. Newman, 1928). It is a decisive objection against "pure" Structural Realism (the view that we only know the mathematical structure of the world, not the nature of the things involved).

  **The Argument:**
  1.  Suppose a theory tells us only that "The world has mathematical structure $S$."
  2.  Mathematical structure is defined purely by relations (e.g., $aRb$, $bRc$).
  3.  If you do not specify *what* the relata ($a, b, c$) are (i.e., you stay agnostic about the ontology), then *any* collection of objects can satisfy structure $S$, provided there are enough of them.
  4.  **Example:** If physics says "The universe has the structure of a 4-dimensional manifold," and you refuse to say what is *in* the manifold (matter, fields, spirits, apples), then logically, the universe could be made of anything at all.
  5.  **Conclusion:** A claim about "structure only" is trivially true of almost anything. It fails to constrain the world. Therefore, saying "we keep the math but drop the ontology" empties the theory of empirical content.

  **Why this matters for you:**
  Your friend suggests keeping the math of Fresnel and Newton while dropping the ontology (Ether/Absolute Space). Newman's Problem shows that if you are *totally* agnostic about what the math is describing, the math loses its grip on reality. To say Fresnel's math teaches us something *real*, you must commit to the idea that the math describes relations between *specific kinds of things* (e.g., electromagnetic fields), not just "something or other."

  ### 2. A Principle to Capture Your Verdicts

  To distinguish Fresnel (Success) from Absolute Space (Failure) while accommodating Caloric and Phlogiston, you need a principle that discriminates between **redundant theoretical posits** and **robust functional roles**.

  I propose the following principle: **The Principle of Invariant Causal-Functional Structure.**

  > **Clause 1 (Functional Continuity):** We learn something real about the world when the *causal or functional role* posited by the abandoned theory is preserved in the successor theory, even if the *substrate* performing that role is re-identified.
  >
  > **Clause 2 (Observable Mapping):** The mathematical structure that survives must map primarily to relations between **operationally defined quantities** (observables/measurables) rather than to **theoretical gauge variables** (unobservables shown to be redundant).
  >
  > **Clause 3 (Non-Triviality):** The preserved structure must not be satisfiable by any arbitrary ontology (avoiding Newman's Problem); it must constrain the *type* of causal power present.

  #### How this principle handles your cases:

  *   **Phlogiston (Verdict: Nothing Learned)**
      *   *Analysis:* Phlogiston was posited to have "negative weight" (mass decreases upon release).
      *   *Clause 1:* This functional role was **false**. Mass increases in combustion. The causal role was not preserved.
      *   *Result:* **Fail.** No knowledge gained about the specific posit.

  *   **Caloric (Verdict: Something Learned)**
      *   *Analysis:* Caloric was a fluid that flows from hot to cold.
      *   *Clause 1:* The *flow* role (thermodynamics) and conservation in ideal cycles (Carnot) were preserved. The substrate changed from fluid to kinetic energy/entropy.
      *   *Clause 2:* The math maps to temperature and pressure (observables).
      *   *Result:* **Pass.** We learned about the functional structure of heat transfer.

  *   **Fresnel's Ether (Verdict: Something Learned)**
      *   *Analysis:* Ether was the medium for light waves.
      *   *Clause 1:* The *wave propagation* role was preserved. The substrate changed from mechanical ether to electromagnetic field.
      *   *Clause 2:* The equations map to wavelength, frequency, and angle (observables).
      *   *Result:* **Pass.** We learned about the structure of light propagation.

  *   **Newton's Absolute Space (Verdict: Nothing Learned)**
      *   *Analysis:* Absolute Space was a fixed container distinguishing true rest from motion.
      *   *Clause 1:* The functional role of "absolute rest" was shown to be **causally inert**. It does nothing.
      *   *Clause 2:* The variables for absolute position ($x, y, z$ in the absolute frame) are **gauge variables**. They are mathematically redundant; physics works exactly the same without them (Galilean relativity).
      *   *Result:* **Fail.** We learned nothing about *Absolute Space* because it was a redundant posit. (Note: We *did* learn about inertia, but that is a property of bodies, not the container).

  *   **Crystalline Spheres (Verdict: Nothing Learned)**
      *   *Analysis:* Spheres physically carried planets.
      *   *Clause 1:* The causal role (physical contact propulsion) was falsified by comets passing through and gravity.
      *   *Result:* **Fail.**

  ### 3. Implications for New Cases

  Based on the **Principle of Invariant Causal-Functional Structure**:

  1.  **Mathematical Survivor without Interpretation (e.g., Curve Fitting):**
      *   If a formula predicts data but maps to no causal role (Clause 1 fails) and uses no operationally defined quantities (Clause 2 fails), it is **instrumentalism**, not knowledge. It is a tool, not a description of the world.

  2.  **Posited Entity Later Confirmed (e.g., Atoms, Black Holes):**
      *   This is the "easy" case. Both substrate and function are preserved. The principle classifies this as **full realist success**.

  3.  **Dark Matter:**
      *   *Current Status:* We have the math (gravitational anomalies) but not the substrate (WIMPs? Axions?).
      *   *Verdict:* According to Clause 1, we **have learned something real**: there exists a mass-distribution functional role that affects gravity. Even if "Dark Matter particles" turn out to be wrong (like Caloric fluid), the *gravitational structure* is real knowledge.
      *   *Risk:* If Modified Gravity (MOND) succeeds, the "mass" role might be discarded. Currently, the principle suggests we have partial knowledge (functional, not ontological).

  ### 4. Honest Assessment: Which Verdicts to Give Up

  You asked for an honest statement of which verdicts this principle cannot accommodate, or which you should reconsider. There are two pressure points in your list.

  **1. The Absolute Space Verdict (You should soften this)**
  You wrote: *"I don't believe anything was learned about space or time from [Newton]."*
  *   **Critique:** This is too strong. Newton's theory established the **inertial structure** of spacetime. Even though "Absolute Space" (the container) was discarded, the **metric structure** (how distances and durations are measured) and the **law of inertia** survived into Special and General Relativity as limiting cases.
  *   **Correction:** You should say: *"We learned nothing about Absolute Space as a substantial entity, but we learned robust truths about inertial frames and the metric relations of space and time."*
  *   **Why:** If you say "nothing was learned," you imply a discontinuity that doesn't exist. Newtonian spacetime is a specific geometry that is still "true" in low-energy limits. Denying this makes it hard to explain why Newton's math still works for building bridges.

  **2. The Phlogiston Verdict (You might be too harsh)**
  You wrote: *"I don't think anything true about combustion was learned from it."*
  *   **Critique:** Phlogiston theory correctly identified that combustion involves a **transfer of a substance between the body and the air**. They got the direction wrong (release vs. uptake), but they moved chemistry away from "qualities" toward "material exchange."
  *   **Correction:** You might concede: *"We learned that combustion is a material exchange process, even if the specific posit (phlogiston) was false."*
  *   **Why:** This aligns better with your Caloric verdict. In both cases, the "fluid" was false, but the "flow/exchange" was real. If you accept Caloric, consistency demands you accept *some* structural learning from Phlogiston.

  ### Summary for Your Paper

  1.  **Reject Pure Structural Realism:** Use Newman's Problem to explain why "just the math" is insufficient. The math must describe *causal roles*.
  2.  **Adopt Selective Realism:** Defend the **Principle of Invariant Causal-Functional Structure**. This allows you to keep the "truth" of Fresnel's optics while rejecting the Ether, and keep Carnot's thermodynamics while rejecting Caloric.
  3.  **Distinguish Fresnel from Newton:** Fresnel's math described **observable wave relations** (which survived). Newton's Absolute Space described **unobservable gauge redundancy** (which did not).
  4.  **Revise Your Verdicts:** Acknowledge that Newton taught us about *inertial structure* (not absolute space) and Phlogiston taught us about *material exchange* (not negative weight). This makes your position more robust against counter-attack.

  This approach allows you to avoid the label of "Naive Realist" (who says old theories were true) and "Anti-Realist" (who says we learn nothing), positioning you instead as a **Structural-Functional Realist**.
