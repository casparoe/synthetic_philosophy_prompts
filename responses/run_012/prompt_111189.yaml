  I am a machine learning engineer who works on causal inference. I build structural causal models, reason with directed acyclic graphs, the backdoor and frontdoor criteria, do-calculus and instrumental variables, and I treat the standard assumptions — causal Markov, faithfulness, no unmeasured confounding relative to a specified target — as working hypotheses that are usually harmless and occasionally the whole story. My quantum mechanics is at the level of a good undergraduate textbook, and I have read none of the physics literature on Bell's theorem.

  What I want from you is a translation, and then a residue report.

  First, restate Bell's theorem — its setup, its assumptions and its conclusion — in my vocabulary, as faithfully as you can manage. Set the Bell scenario up the way I would set it up: which variables are observed and which are latent, what the graph looks like, how the experimenter's choice of measurement setting enters the model, and where the assumption usually called local causality enters as a structural or graphical claim rather than a physical one. Do not smooth over the places where the fit is bad. If the translation forces me to add an assumption I would not otherwise make, or to drop something the physics needs, say so at the point where it happens rather than in a summary at the end.

  Then tell me what does not survive. In particular: (i) whether the physicists' locality is the same claim as the absence of an unblocked path between spacelike-separated variables, or whether the two come apart in cases that matter; (ii) whether the no-signalling condition is an assumption of the theorem, a consequence of it, or something else again; (iii) what work the notion of an intervention is doing here, given that for me an intervention is primitive and well defined for a knob I can physically turn, and whether it is legitimate to carry it over to the setting of a measurement on a particle; and (iv) whether the analogue of faithfulness is doing anything at all, or whether Bell's argument needs strictly less than a causal model hands it.

  Finally, the part I actually care about. What does my vocabulary silently assume that Bell's argument does not need? What does the argument need that my vocabulary cannot express? And where the translation fails, is that a defect of my framework — it cannot state something real — or a sign that the original claim was vaguer than it looked once someone tries to make it precise? I would rather have an honest account of the seams than a smooth analogy. Do not send me to the literature; I will not read it. If you want to invoke a named result or a position someone holds, state it in your own words instead of citing it.
