prompt: |-
  I'm a journalist covering technology and ideas — before that I spent six years as a security engineer, mostly on access control and capability-based systems — and I'm now at work on a long piece about the three-way disagreement between German data protection, the American tradition of openness, and the Chinese apparatus that gets filed under "social credit." What keeps frustrating me is that the argument is usually conducted in the moral register, and every time I try to think it through in the vocabulary I actually trust — threat models, adversary models, trust boundaries, attack surface, reference monitors, least privilege, default-deny versus default-allow, ambient authority, the confused deputy, revocation, separation of policy and mechanism, capability versus access-control-list — the three positions look much less like three moral visions and much more like three different answers to a question I can state precisely: who is the adversary, and what is the system's trust boundary? I want to know whether that's a real insight or whether I'm just flattering my old trade.

  So: restate each of the three positions, as faithfully as you can, in that vocabulary. Take the German position at its strongest, including the constitutional doctrine of informational self-determination that the Federal Constitutional Court derived from the personality right and human dignity in its 1983 census ruling, and the accompanying commitments to data minimization, purpose limitation, and the idea that the state's ability to assemble a comprehensive picture of a person is itself the injury, independent of any later misuse. Take the American position at its strongest too, in its own terms — publicity as a check on power, the presumption that government information belongs to the public, the press and the request-and-disclosure apparatus as the mechanism. And for the Chinese side, translate the version a defender would actually defend: I know the label is a mess, that much of what Western coverage calls one system is a patchwork of corporate credit ratings, court blacklists, and local pilots, and I don't want you to paper over that. Don't send me reading lists or citations; I can't check anything while I'm drafting, and a bibliography is not what's missing.

  The part I care most about is the residue. For each position, tell me which commitments survive the translation cleanly, which survive only with distortion, and which cannot be expressed in my vocabulary at all — and then say what you think the residue means. Is my framework simply missing a category (something like legitimacy, dignity, or the constitutive role of being seen), or is the residue evidence that the political claim was never really a claim about security properties in the first place, so that the translation exposes a thinness in the original rather than a gap in mine? Watch for the trap of smuggling my framework's assumptions into the translation and calling that fidelity — if the adversary's identity is itself the thing under dispute, then a "threat model" framing that presupposes it has already taken a side, and I want that flagged rather than hidden.

  Before you write the JSON, work through each position carefully on a scratch pass — lay out the commitments you intend to translate, test each rendering, and only then compress. Your reply should contain a short bottom line and then one JSON object, with exactly these fields: "bottom_line" (a string of no more than 100 words); "positions" (an array of three objects, each with "id" set to one of "german", "american", "chinese", "label", "core_commitments" as an array of 3–6 strings in the position's own idiom, "translations" as an array of objects with "commitment", "rendering", "fidelity" set to one of "clean", "forced", "absent", and "what_the_rendering_drops", and "residue" as an array of objects with "item" and "why_it_has_no_counterpart"); "who_is_the_adversary" as an object with "finding" and "evidence" (an array of strings); "framework_blind_spot" as an object with "claim" and "explanation"; "diagnosis" as an object with "verdict" set to one of "defect in my vocabulary", "the political claim was not a security claim", or "mixed", plus "reasoning"; and "sentence_i_must_not_write", the one sentence about all this that I should be forbidden from putting in print.
