answer: |-
  **TO:** Editorial Ethics Group, Independent Press
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on AI Supervision Regime

  **Context**

  We are debating how to govern the AI tool we license for our translation imprint. One faction argues for process-based supervision: demanding transparency from the vendor and mandating human checkpoints during the workflow. The other argues for outcome-based supervision: ignoring the pipeline and judging only the final text for errors and plagiarism.

  The recent Bengali novel incident decides this debate. The AI flattened honorifics and pronouns, erasing the social register essential to the book's meaning. Our outcome review passed the text because every sentence was grammatically sound. The error was not in the facts, but in the relationships between the words. This proves that for translation, quality is not merely the sum of correct sentences.

  **Recommendation**

  I recommend we adopt the **Process-Based Regime**, with a specific modification regarding vendor transparency.

  We should require mandatory human checkpoints at fixed stages of the translation workflow, specifically targeting cultural register, voice, and pronoun consistency. However, we should temper the demand for full vendor documentation of training data. While we should ask for it, we must acknowledge that a small press cannot audit a large vendor's proprietary pipeline. Relying on vendor documentation as a primary guardrail is indeed, as the outcome group fears, likely to be theatre.

  Our supervision must focus on *our* process, not just their promises. We must treat the AI not as a finished product generator, but as a junior translator who requires management.

  **Reasoning**

  The core philosophical failure of the outcome-only approach is the assumption that a text's integrity is visible in its final state. With human translation, a skilled editor can read a manuscript and sense if the voice is consistent. With AI translation, the degradation is often systemic and invisible to a standard read-through.

  AI models optimize for probability, not truth or cultural fidelity. They smooth out outliers. In the Bengali case, the honorifics were statistical outliers compared to standard grammar, so the model normalized them. An outcome review looks for breaks in the text; a process review looks for breaks in the logic of the translation itself. By inserting checkpoints where a human translator must verify specific high-risk elements (like kinship terms, politeness markers, or dialect) *before* the copyediting phase, we catch the drift while it is still correctable.

  If we wait for the final book, we are testing for failure rather than ensuring quality. We are betting that the AI's errors will be loud enough for us to hear. The Bengali novel proves they will be quiet.

  **The Case for Outcome-Based Supervision**

  I want to make the strongest possible case for the opposing view, because their concerns are valid.

  The outcome group argues that process supervision is bureaucratic friction that slows production without guaranteeing quality. They are right that vendor transparency is often a mirage. Companies will provide "model cards" and "safety reports" that are marketing documents, not technical audits. Demanding them consumes legal and staff time that a small press does not have.

  Furthermore, the outcome group correctly identifies that our ethical obligation is ultimately to the reader, not to the supply chain. If the book reads well, is factually accurate, and does not plagiarize, does the method matter? For a press fighting for survival, efficiency is an ethical good. If we bog down in checkpoints and logs, we publish fewer books, amplify fewer voices, and risk the financial viability of the imprint. There is also the risk of "checklist fatigue," where editors sign off on process steps mechanically, creating a false sense of security that is more dangerous than honest outcome testing.

  Finally, outcome-based supervision respects the editor's expertise. It trusts the human to recognize a bad translation. The Bengali incident was a failure of review, yes, but the outcome group would argue the solution is better training for reviewers, not more bureaucracy.

  **Conclusion**

  The outcome argument is pragmatic, but it relies on a definition of "quality" that AI is specifically designed to mimic but not embody. AI can produce text that looks right but is wrong.

  We cannot afford to publish books that are grammatically perfect and culturally hollow. Therefore, we must intervene in the process. We will not solve the vendor transparency problem, but we can solve our own workflow problem. I urge the group to vote for the process-based regime, focusing our energy on mandatory human checkpoints rather than unenforceable vendor audits. We must supervise the work, not just the result.
