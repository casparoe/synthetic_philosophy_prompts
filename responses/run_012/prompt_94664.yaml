      *   *Case for the Opposition (Outcome-Only):* It's honest to admit that process audits are often fake. Vendors guard their weights. Checkpoints slow down the workflow. Ultimately, the reader only cares about the book, not the pipeline. If the book is good, does the method matter? For a small press, survival depends on efficiency.

