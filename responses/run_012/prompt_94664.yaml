          *   *Cons:* Can be bureaucratic ("theatre"), vendors might lie or obfuscate, slows down production, might not catch subtle semantic drift.
      *   **Outcome-Based Supervision:** Focuses on *what* the AI produces. Quality control, spot checks, plagiarism detection.
          *   *Pros:* Pragmatic, focuses on the reader's experience, less bureaucratic overhead.
          *   *Cons:* Reactive (fixes problems after they happen), misses subtle cumulative errors (like the Bengali honorifics issue), assumes human reviewers can spot AI-specific degradation.
      *   **The Bengali Incident:** This is the crux. The outcome *looked* fine sentence-by-sentence, but the *meaning/culture* was eroded. This suggests pure outcome-based review is insufficient for translation where register and cultural context are paramount. However, pure process-based might be too heavy for a small press.

