answer: |-
  It is a pleasure to correspond with someone who has actually handled the glycerol stocks. You know better than most that the boundary between a vial of DNA and a culture is often just a matter of temperature and media.

  Your friend's argument is a clean, rigorous version of what is known in the philosophy of biology as the **Lineage View** (or sometimes the Evolutionary View) of life. It is not a straw man; it is the position held by heavyweights like John Maynard Smith, Eörs Szathmáry, and Peter Godfrey-Smith.

  You asked for a map of what is settled versus what is a live fight, and an analysis of where to break the chain. Here is that breakdown.

  ### Part 1: The Map (Settled vs. Live Fight)

  **What is genuinely settled (Consensus):**
  *   **Evolution is the unique marker:** There is near-universal agreement among biologists and philosophers that "capacity for Darwinian evolution" is the only non-arbitrary feature that distinguishes biological systems from complex chemical systems (like flames or crystals). Metabolism is necessary for *individual* persistence, but not sufficient for *lineage* persistence.
  *   **Selection is population-level:** Premise (3) is standard population genetics. An individual does not evolve; an individual is selected *or* it is not. Evolution is a statistical change in allele frequencies over generations.
  *   **The Virus Problem:** There is **no consensus** on whether viruses are alive. In microbiology practice, we treat them as distinct from cellular life. In evolutionary theory, they are often treated as biological entities because they evolve. This ambiguity is not a failure of your knowledge; it is a feature of the concept "life."

  **What is a live fight (Philosophical Ontology):**
  *   **Intrinsic vs. Relational Properties:** Premise (1) assumes "alive" must be intrinsic (like mass or charge). Many philosophers of biology argue "alive" is a *historical* or *relational* property (like "being a currency note" or "being a spouse"). A piece of paper is only currency because of a specific social history/system. A bacterium might only be "alive" because of its specific evolutionary history.
  *   **The Unit of Life:** Is the organism the primary unit of life, or is the lineage? The "Lineage View" argues the lineage is the real biological entity; organisms are just temporary vehicles. This is still contested.
  *   **Dispositional Properties:** Can an individual possess a property that is defined by what it *would* do under certain conditions (e.g., "flammable," "soluble," "evolvable") even if it isn't currently doing it?

  ### Part 2: Analyzing the Argument

  Your friend's logic is valid. If you accept (1) through (4), (5) follows inescapably. Since (6) contradicts (5), one of the premises must be false.

  You stated you want to keep **(2)** (Evolution is the criterion) and **(6)** (Individuals are alive).
  To do this, you must reject either **(1)** or **(4)**.

  #### The Best Candidate for Rejection: Premise (1)
  *( "If 'alive' is a real feature... it has to be a feature of the thing itself... not about us or about its relatives.")*

  **Why it looked fine:** It appeals to a physicalist intuition. We want "life" to be like "atomic weight"—something you can measure on the thing in front of you, right now, in isolation.

  **Why you should reject it:** "Alive" is not a physical state; it is a **historical/functional status**.
  Consider a dollar bill. Chemically, it is cotton and linen blend. If you find one in a cave from 1000 BC, it is not currency. If you find one in a Federal Reserve vault today, it is. The difference is not intrinsic to the paper; it is about its relationship to an economic system and its history of issuance.
  Similarly, a bacterium in your glycerol stock is "alive" not because of its current metabolic rate (which is zero), but because it stands in the right causal relation to a lineage that has evolved and *can* evolve again upon thawing.

  **The Cost:**
  You lose the idea that life is a purely intrinsic physical property. You must accept that determining if something is alive requires knowing its **history** and its **potential context**.
  *   *For your work:* This validates your strain collection. The bacteria aren't alive because they are metabolizing in the freezer; they are alive because they are nodes in a continuous evolutionary lineage that *can* be reactivated.
  *   *For the Virus:* This is the big cost. If you keep (2) and reject (1), **viruses are alive** (when inside a host). They are part of an evolving lineage. Your opening statement ("viruses aren't really alive") becomes the casualty. You would have to shift to saying, "Viruses are alive, but they are not *cells*," or "Viruses are alive only during the infection phase."

  #### The Alternative Candidate: Premise (4)
  *( "So being subject to natural selection is not a feature of any individual thing.")*

  **Why it looked fine:** It follows from (3). If selection needs a population, an individual can't have the property of "being selected."

  **Why you might reject it:** This confuses the *process* of selection with the *disposition* to be selected.
  A bomb is "explosive" even when it is sitting in a museum case and not exploding. "Explosive" is a dispositional property. It describes what the object *will* do under specific conditions.
  You can argue that an individual bacterium possesses the **disposition** to participate in natural selection. It carries the machinery (DNA, replication enzymes) that *makes it the kind of thing* that can be selected.

  **The Cost:**
  You have to embrace **dispositional metaphysics**. You are arguing that "being alive" is like "being flammable." It is real, but it refers to potentialities, not just current actualities. This is philosophically defensible but requires you to argue that potentialities are real features of objects (which not all philosophers agree on).

  ### Part 3: The Verdict

  If you want to keep your evolutionary criterion (2) and your intuition that you are alive (6), **reject (1).**

  **Why?**
  It is the cleanest cut. It acknowledges that biology is not just physics; it is history. Physics deals with intrinsic properties (mass, spin). Biology deals with historical entities (genes, species, organisms).
  By rejecting (1), you accept that "alive" is a **relational property**.
  *   **What it saves:** It saves the intuition that *you* are alive. You are a node in a lineage.
  *   **What it costs:** It forces you to concede the virus point. If "alive" means "part of an evolving lineage," then viruses are alive. They evolve. They have descent with modification. The fact that they are obligate intracellular parasites is no different than a mitochondrion (which we call alive) or *Rickettsia* (which you studied). The distinction between "virus" and "organism" becomes a distinction of **degree of autonomy**, not a binary of "alive vs. dead."

  ### Part 4: What if you keep (1) and accept (5)?

  You asked: *If the argument is actually fine and (5) is just true, say so, and tell me what that would mean for what I spent thirty years doing.*

  If (5) is true ("Only populations and lineages are alive"), then **individual organisms are not alive; they are components of life.**

  **The Implications:**
  1.  **Ontological Shift:** You did not spend 30 years studying "living things." You spent 30 years studying the **mechanisms of replication** that allow the *lineage* to persist. The bacterium is a "vehicle" (in Dawkins' terms) or a "interactor" (in Hull's terms). The *lineage* is the "replicator."
  2.  **Death Changes Meaning:** Individual death is not the end of life; it is merely the shedding of a vehicle. This sounds poetic, but scientifically, it means your focus on the *strain* (the lineage) was more ontologically fundamental than your focus on the *cell* (the individual).
  3.  **The Strain Collection:** Your collection is not a morgue of dead individuals; it is a library of paused lineages. This view actually elevates the importance of the collection. You are preserving the *lineages*, which are the only things that are truly "alive" in this framework.

  ### Summary Recommendation

  1.  **Settled Science:** Evolution (2) is the only robust boundary for biology. Selection (3) is a population process.
  2.  **Live Fight:** Whether "life" is intrinsic (1) or relational.
  3.  **The Move:** Reject **(1)**. Accept that "alive" is a historical/relational property, like "currency" or "heir."
  4.  **The Price:** You must admit that **viruses are alive** (in the context of infection). Your 30 years of distinguishing "obligate intracellular bacteria" from "viruses" remains microbiologically vital (they are different *kinds* of replicators), but ontologically, they both fall under the umbrella of "evolving biological systems."

  Your friend's argument is strong because it exposes that "life" is not a substance, but a **process**. You can keep your intuition that you are alive, but only by admitting that your aliveness depends on your connection to the past (ancestry) and the future (potential offspring), not just your current metabolism.
