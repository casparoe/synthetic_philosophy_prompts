  The entire space turns on the locus of explanatory priority in the causal chain linking genetic inheritance to observed behavior.

  ### The Decision Tree

  **Level 1: The Subsistence Constraint**
  *Case: Foraging returns among the Ache or Hadza.*
  **Question:** Do foraging decisions track real-time caloric optimization models regardless of tradition, or do they follow fixed rules even when inefficient?
  *   **Answer A (Optimization):** Behavior tracks ecological variance and return rates. → *Go to Level 2 (Ecological/Plasticity Branch)*
  *   **Answer B (Fixed Rules):** Behavior follows inherited constraints or transmitted rules. → *Go to Level 2 (Inheritance/Architecture Branch)*

  **Level 2 (Ecological/Plasticity Branch): The Source of Flexibility**
  *Case: Lactase persistence and dairy consumption.*
  **Question:** Is the behavioral pattern driven by individual ecological optimization (HBE) or by a historical process of cultural transmission altering selection pressures?
  *   **Answer A (Individual Optimization):** The driver is current ecological payoff. → **Leaf: Human Behavioral Ecology**
  *   **Answer B (Historical Transmission):** The driver is inherited information or modified selection. → *Go to Level 3 (Transmission Branch)*

  **Level 2 (Inheritance/Architecture Branch): The Nature of Inheritance**
  *Case: Westermarck effect vs. cultural taboo.*
  **Question:** Is the fixed rule caused by a species-typical cognitive architecture (biological) or by cultural/developmental resources (constructive)?
  *   **Answer A (Biological Architecture):** The mechanism is genetic/cognitive. → *Go to Level 3 (Modularity Branch)*
  *   **Answer B (Developmental Resources):** The mechanism is resource-based construction. → *Go to Level 3 (Developmental Branch)*

  **Level 3 (Transmission Branch): The Inheritance System**
  *Case: Dual-inheritance models of dairy spread.*
  **Question:** Are genes and culture separate inheritance systems co-evolving (Dual-Inheritance), or is the system a single developmental process?
  *   **Answer A (Separate Systems):** Genetic and cultural fitnesses are modeled separately. → **Leaf: Gene-Culture Coevolution**
  *   **Answer B (Single Process):** Inheritance is a unified developmental flow. → *Go to Level 4 (Developmental Distinction)*

  **Level 3 (Modularity Branch): The Cognitive Structure**
  *Case: Wason selection tasks.*
  **Question:** Does improved performance on social contracts evidence a dedicated cheater-detection module or domain-general reasoning?
  *   **Answer A (Domain-Specific):** The mind contains dedicated modules. → *Go to Level 4 (Inference Branch)*
  *   **Answer B (Domain-General):** The mind uses general capacities. → **Leaf: Spandrel-and-Exaptation Critique**

  **Level 4 (Developmental Distinction): The Causal Mechanism**
  *Case: Beaver dams vs. avian song learning resources.*
  **Question:** Is the primary theoretical contribution the modification of selection pressures (Niche) or the parity of developmental resources (DST)?
  *   **Answer A (Modification of Selection):** Organisms actively construct their environment. → **Leaf: Niche-Construction Approach**
  *   **Answer B (Parity of Resources):** All developmental factors are equally causal. → **Leaf: Developmental Systems Theory**

  **Level 4 (Inference Branch): The Evidence Standard**
  *Case: Human taste for sugar and fat.*
  **Question:** Can adaptation be inferred from current design utility and mismatch alone, or does it require comparative phylogenetic evidence?
  *   **Answer A (Current Utility):** Design and mismatch suffice. → *Go to Level 5 (Toolkit Branch)*
  *   **Answer B (Phylogenetic Evidence):** Comparative history is required. → **Leaf: Comparative Adaptationism**

  **Level 5 (Toolkit Branch): The Empirical Toolkit**
  *Case: Validity of the hunter-gatherer analogy and EEA reconstruction.*
  **Question:** Are standard tools (EEA, universality claims, WEIRD samples) sufficient to test adaptation hypotheses?
  *   **Answer A (Sufficient):** The toolkit is valid. → **Leaf: Santa Barbara School (Massive Modularity)**
  *   **Answer B (Insufficient):** The toolkit is currently flawed. → *Go to Level 6 (Just-So Diagnosis)*

  **Level 6 (Just-So Diagnosis): The Status of the Charge**
  *Case: Replicability of priming effects.*
  **Question:** Is the "just-so-story" charge an accusation about testability in principle or evidential standards in practice?
  *   **Answer A (Evidential Standards):** The theory is testable, but current rigor is low. → **Leaf: Deflationary View (Normal Science)**
  *   **Answer B (Testability in Principle):** The hypotheses are untestable. → **Leaf: Hard Skepticism**

  ***

  ### Notes on Unoccupied Combinations and Indistinguishable Leaves

  **Indistinguishable Leaves:**
  *   **Niche-Construction vs. Developmental Systems Theory:** While the tree separates these at Level 4 based on "modification of selection" versus "parity of resources," in practice these positions are rarely mutually exclusive; most niche constructors accept developmental parity, and most DST proponents accept ecological feedback. The distinction is primarily rhetorical emphasis rather than empirical incompatibility.

  **Unoccupied Combinations:**
  *   **Modular Architecture + Phylogenetic Evidence + Flawed Toolkit:** This combination (believing in modules, requiring phylogeny, but rejecting EEA methods) is logically possible but unoccupied; those demanding phylogeny usually reject the massive modularity hypothesis itself, collapsing into the Spandrel critique.
  *   **Optimization + Cultural Transmission:** A view that individuals optimize fitness solely through culturally transmitted rules without genetic coevolution is incoherent; if culture drives the optimization, it becomes a Gene-Culture model, if not, it reverts to standard HBE.
  *   **Comparative Adaptationism + Santa Barbara Toolkit:** A position requiring phylogenetic evidence while accepting EEA reconstruction as sufficient is unattractive; the demand for phylogeny inherently undermines the validity of reconstructing the EEA via modern hunter-gatherer analogy.
  *   **Hard Skepticism + Normal Science:** The leaf for Hard Skepticism represents a view that EP is pseudoscience; practitioners holding this view typically leave the field, making this a stable theoretical position but an unoccupied professional stance within the seminar context.
