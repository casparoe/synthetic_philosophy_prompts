      *   Let's settle on 14/20. It's a clear pass, shows reading, but the critical analysis in (b) is surface-level. It asserts consistency without proving it against the obvious tensions (e.g., duty to save life vs. duty to tell truth).

  7.  **Final Polish of Comments:**
