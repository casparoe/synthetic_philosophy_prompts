prompt: |-
  I teach a second-year undergraduate module in metaphysics, and next month I have to give the session on whether a person could have come from a different sperm and egg — origin essentialism, and the arguments on either side of it. The topic has recently become awkwardly personal for me: my partner and I had a daughter last year using an egg from a donor, and since then I have been unable to stop turning over the counterfactual our own treatment made vivid, namely whether a different egg from the same cohort would have meant a different child, and what my strong sense that it would have is actually tracking.

  What I want from you is not an explanation. I can state the position myself, and I do not need sources or readings. I want a plan for teaching it in seventy-five minutes to twenty-five students who have had one session on personal identity, no exposure at all to modal notions, and a firm prior that this is a question about biology, or about destiny, rather than about necessity.

  So, first, the order: what has to be in place before the thesis even sounds like a thesis, and why each step depends on the one before it — which of the components (the gap between a thing's properties and its identity conditions; the idea of varying an individual rather than varying a world; the difference between what is causally settled and what is metaphysically necessary) can be presupposed at this level and which cannot. Second, the carrying example. The two I keep reaching for are an artifact case — a thing made from a different lump of matter, or the same lump differently arranged — and the well-worn case of a person of famous parentage asked whether they could have been born to a different couple. I suspect neither does the work I need. Tell me which, if either, earns its place, what the carrying example must have that they lack, and whether the donor-gamete case, or the neighbouring cases of children conceived with a third party's mitochondria or chosen from a cohort of embryos, should carry the session or would only turn it into bioethics. Third, the misconception map: I predict they will hear the thesis as fatalism, as a claim about which sperm in fact won the race, as a claim about genes rather than about individuals, and as a religious claim about souls. Where in the sequence should each of those be headed off, and what am I failing to anticipate? Fourth, the personal problem: my own family is the most vivid example available to me, and I do not trust my judgment about whether to use it. Is it a mistake, and what does it cost if it is? Fifth, what should I openly decline to explain at this level, and say that I am declining? And finally, one question to put to them at the end that would separate a student who has grasped the modal claim from one who has merely learned the slogan.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** Second-year undergraduate metaphysics instructor.
      *   **Topic:** Origin Essentialism (could a person have come from a different sperm/egg?).
      *   **Context:** Personal stakes (daughter via egg donor).
      *   **Constraints:** 75 minutes, 25 students, 1 prior session on personal identity, *no* exposure to modal notions, strong prior that this is biology/destiny not metaphysics.
      *   **Needs:**
          1.  Order/Sequence (prerequisites, dependencies).
          2.  Carrying Example (artifact vs. famous parent vs. donor/IVF).
          3.  Misconception Map (fatalism, biology, genes, souls).
          4.  Personal Problem (to disclose or not to disclose).
          5.  Declinations (what to explicitly skip).
          6.  Final Question (grasp vs. slogan).
      *   **Tone:** Philosophical, pedagogical, sensitive, precise. No explanations of the theory itself (user knows it).

  2.  **Deconstruct the Challenge:**
      *   *The Modal Gap:* Students don't know possible worlds semantics. They think "could" means "physically possible" or "allowed." Origin essentialism is about *metaphysical* necessity. This is the biggest hurdle.
      *   *The Biological Bias:* Students think this is a science question (genetics). It's an identity question.
      *   *The Personal Stake:* The instructor's vulnerability. Using the real case is powerful but risky (bioethics drift, emotional overwhelm, loss of objectivity).
      *   *Time:* 75 minutes is tight for building modal intuition *and* arguing the thesis.

  3.  **Drafting - Section by Section:**

      *   **1. The Order (Sequence & Dependencies):**
          *   *Problem:* You can't argue origin essentialism if they think "could" means "physically possible."
          *   *Step 1: Distinguish Properties from Identity.* (The Ship of Theseus intuition, but simpler). Need to establish that *what makes a thing itself* isn't just *how it is*.
          *   *Step 2: Introduce 'Could' without 'Worlds'.* Avoid Kripkean semantics jargon. Use "ways things might have been." Distinguish *epistemic* (we don't know), *nomological* (laws of nature), and *metaphysical* (coherent identity).
          *   *Step 3: Causation vs. Constitution.* This is crucial. Students think "If the egg was different, the *cause* was different." Need to shift to "If the egg was different, the *stuff* constituting the start was different."
          *   *Dependency:* You can't do Step 3 without Step 2. You can't do Step 2 without Step 1.
          *   *Presuppositions:* Can presuppose basic logic. Cannot presuppose modal realism or even basic possible worlds talk. Must build it from intuition.

      *   **2. The Carrying Example:**
          *   *Artifact (Table/Wood):* Classic Kripke. Good for intuition, bad for engagement. Too distant from "personhood."
          *   *Famous Parent (Queen Elizabeth):* Dated, classist, confuses social role with biological identity.
          *   *Donor/IVF/Cohort:* High engagement, high risk.
          *   *Verdict:* The artifact case is necessary *first* to isolate the metaphysics from the ethics. But the IVF case is the *target*.
          *   *Strategy:* Start with the artifact (clean metaphysics), transition to the biological (the test case). Do *not* lead with the donor case. It triggers bioethics immediately. Use a "hypothetical IVF" case first, then maybe acknowledge the real one later.
          *   *Requirement:* The example must isolate *origin* from *outcome*. (i.e., same traits, different start).

      *   **3. The Misconception Map:**
          *   *Fatalism/Destiny:* "It was meant to be." -> Address early. Distinguish "necessary" from "fated."
          *   *Biology/Genes:* "It's about DNA." -> Address during the transition from artifact to human. DNA is property, origin is constitutive.
          *   *The Winning Sperm:* "If *that* sperm didn't win, I wouldn't exist." -> This is actually close to the truth, but they frame it causally. Need to shift to identity conditions.
          *   *Souls/Religion:* "The soul enters at conception." -> Address explicitly as a *different* theory. Metaphysics doesn't need souls.
          *   *Timing:* Pre-empt fatalism in the intro. Pre-empt biology during the example. Pre-empt souls at the conclusion/Q&A.

      *   **4. The Personal Problem:**
          *   *Risk:* Bioethics drift. Students focus on the ethics of donation, not the metaphysics. Instructor emotional load.
          *   *Benefit:* Vividness. Cuts through abstraction.
          *   *Advice:* Use it, but *framed*. Do not make it about *your* daughter specifically in the argument phase. Make it about the *class of cases* your daughter exemplifies. Disclose at the end or as a framing device, not the engine of the argument. It costs objectivity if used too early.
          *   *Decision:* Disclose, but late. Use it to show why the question matters, not to prove the point.

      *   **5. Declinations:**
          *   *What to skip:* Possible Worlds semantics (Lewis vs. Plantinga). The Gradual Replacement argument (too long). The "No Unqualified Identity" view (too advanced).
          *   *Statement:* "We are not doing science, we are not doing theology, and we are not mapping logical space formally."

      *   **6. The Final Question:**
          *   *Goal:* Distinguish modal grasp from slogan memorization.
          *   *Idea:* A case where origin is the same, but outcome is wildly different. Or origin is different, but outcome is identical.
          *   *Better Idea:* The "Twin Earth" style variation. If the egg was the same, but the environment was totally different, is it the same person? (Tests if they think origin is *sufficient* or just *necessary*).
          *   *Best Idea:* Ask about the *reverse*. If a different egg produces a qualitatively identical person, is it the same person? (Tests haecceity vs. qualitative identity).

  4.  **Refining and Polishing:**
      *   *Tone Check:* Needs to be empathetic to the instructor's position but rigorous on the pedagogy.
      *   *Timing:* 75 mins is short. 15 intro/modal setup, 30 artifact/bio transition, 20 argument/objections, 10 personal/wrap-up.
      *   *Specific Advice on Modal Notions:* Since they have *no* exposure, avoid "World W1." Use "Scenarios."
      *   *Specific Advice on the Personal:* The instructor says "I do not trust my judgment." I need to give a clear criterion. If the instructor cries or gets defensive, don't do it. If they can treat it as data, do it. Actually, better advice: Use the *structure* of the case without the *emotion* of the case. "Consider a case like mine..."

  5.  **Final Review against Constraints:**
      *   Did I explain origin essentialism? No.
      *   Did I give sources? No.
      *   Did I address the 5 specific points + order? Yes.
      *   Is it sensitive to the personal context? Yes.

  6.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction on Order:* Make sure the distinction between *epistemic* and *metaphysical* possibility is the very first hurdle. If they don't get that, nothing else works.
      *   *Correction on Example:* The artifact case is boring but necessary. I should advise using it *briefly* as a scaffold, then dropping it for the biological case.
      *   *Correction on Personal:* Be careful. If the instructor uses their own child, students might feel unable to challenge the view. I should suggest framing it as "a case structurally identical to my own" rather than "my daughter."

  7.  **Final Polish:** Ensure the voice is collegial and respectful of the instructor's expertise while offering structural guidance. (Proceed to generate response).

  *(Self-Correction during final output generation)*: Wait, the prompt asks for "what has to be in place before the thesis even sounds like a thesis." I need to be very specific about the conceptual scaffolding. Also, the "Final Question" needs to be sharp. Let's make sure it targets the *necessity* vs *sufficiency* distinction or the *qualitative* vs *numerical* identity distinction.

  Okay, ready to write.s
answer: |-
  Here is a plan structured around the conceptual scaffolding required to make origin essentialism intelligible to students without modal training, while managing the personal stakes you have identified.

  ### 1. The Order: Conceptual Scaffolding
  You cannot argue for origin essentialism until the students understand what kind of claim it is. With no modal background, they will default to empirical or epistemic interpretations. You must build the modal space before you fill it.

  *   **Step 1: Numerical vs. Qualitative Identity (15 mins).**
      *   *Why:* Students conflate "being the same person" (numerical) with "being exactly similar" (qualitative). If they think identity is just a cluster of properties (genes, personality, appearance), origin essentialism is unintelligible.
      *   *Dependency:* You cannot discuss *which* properties are essential until they agree that identity is distinct from properties.
      *   *Presupposition:* You can presuppose they grasp basic logic. You cannot presuppose they grasp the *de re/de dicto* distinction. Do not use those terms. Use "The object itself" vs. "The description of the object."

  *   **Step 2: Three Senses of 'Could' (15 mins).**
      *   *Why:* This is the critical bottleneck. They will hear "Could I have come from a different egg?" as "Is it biologically possible?" (Yes) or "Is it compatible with what I know?" (Yes). You need them to hear "Is it compatible with *being me*?"
      *   *Sequence:*
          1.  **Epistemic:** "For all I know, I might have been adopted." (Compatible with my knowledge).
          2.  **Nomological:** "Physics allows a different sperm to fertilize this egg." (Compatible with laws of nature).
          3.  **Metaphysical:** "Could *this very person* exist if the starting material were different?" (Compatible with identity conditions).
      *   *Dependency:* Step 3 is impossible without Step 2. If they think you are making a biological claim, they will refute you with biology.

  *   **Step 3: Constitution vs. Causation (15 mins).**
      *   *Why:* Students view the egg/sperm as a *cause* of the person (like a builder is the cause of a house). Origin essentialism treats the egg/sperm as *constitutive* (like the bricks are to the house).
      *   *Dependency:* Depends on Step 1. If identity is just a property cluster, causation is enough. If identity is a primitive "this-ness," constitution matters.
      *   *Presupposition:* You can presuppose they understand basic causality. You cannot presuppose they understand hylomorphism or constitution views. Keep it intuitive: "Made *out of*" vs. "Made *by*."

  ### 2. The Carrying Example
  Neither the artifact nor the famous parent case is sufficient on its own, but they serve different structural roles.

  *   **The Artifact Case (The Table):**
      *   *Verdict:* **Keep, but minimize.** Use it solely to isolate the metaphysics from the ethics.
      *   *Function:* It creates a "control group." No one has ethical feelings about a table. If they agree a table made of different wood is a *different table*, you have established the logical form of the argument without the biological noise.
      *   *Deficiency:* It fails to capture the intuition that persons are different from objects. Students will rightly suspect the analogy breaks down at the human level.

  *   **The Famous Parent Case (Queen Elizabeth):**
      *   *Verdict:* **Discard.** It is dated, relies on social status, and confuses "being the Queen" (a role) with "being Elizabeth" (a person).

  *   **The Donor/IVF Case:**
      *   *Verdict:* **This must be the target, but not the entry point.**
      *   *Function:* This is where the thesis lives or dies. It isolates the *material origin* from the *genetic outcome* (if using a cohort with similar traits) and from the *gestational environment*.
      *   *Risk:* It immediately triggers bioethics (commodification, selection, "designing" children).
      *   *Strategy:* Start with the Table (5 mins) to lock in the logical form. Move immediately to a *hypothetical* IVF case (generic parents, generic clinic). Only once the metaphysical distinction is clear do you acknowledge that this is not merely hypothetical.
      *   *Why not lead with it?* If you lead with the donor case, the session becomes a seminar on the ethics of assisted reproduction. Students will argue about whether it *should* matter, rather than whether it *does* matter for identity. The artifact case earns its place as a neutral ground to establish the rule before applying it to the high-stakes human case.

  ### 3. The Misconception Map
  You must head these off proactively. If you wait for them to raise these, they will have already solidified their misunderstanding.

  *   **Fatalism/Destiny ("It was meant to be"):**
      *   *Where:* **Step 2 (Senses of 'Could').**
      *   *Correction:* Explicitly state: "Origin essentialism is not about fate. It is not saying the actual egg *had* to win. It is saying that if a different egg had won, the resulting person would not be *you*. It is a claim about identity, not a claim about history."
  *   **Biology/Genes ("It's about the DNA"):**
      *   *Where:* **Step 3 (Constitution vs. Causation).**
      *   *Correction:* Distinguish the *material* from the *code*. Ask: "If we could copy the DNA exactly onto a different egg cell, is it the same origin?" This forces them to see the claim is about the physical particular, not the genetic information.
  *   **The Winning Sperm ("If my dad sneezed, I wouldn't exist"):**
      *   *Where:* **During the Argument.**
      *   *Correction:* This is the closest to the truth, but they frame it as causal fragility. Reframe it: "It's not that you wouldn't exist; it's that *someone else* would exist in your place."
  *   **Religious Claims/Souls:**
      *   *Where:* **Conclusion/Q&A.**
      *   *Correction:* Do not bring this up unless they do. If they do, say: "That is a dualist account of identity. Origin essentialism is compatible with materialism. It claims the physical origin fixes the identity, regardless of whether a soul is involved."
  *   **Unanticipated Misconception:** **The "Same Parents" Intuition.**
      *   *Risk:* Students will argue, "But I would still be my parents' child."
      *   *Correction:* You must distinguish "being a child of X" (a relation) from "being individual Y" (a substance). You can be your parents' child without being *you*.

  ### 4. The Personal Problem
  You do not trust your judgment because the stakes are high. Here is the calculus:

  *   **The Cost of Using It:** If you make it about *your* daughter, students may feel socially pressured to agree with you. It shuts down dissent. It also invites the bioethics drift you want to avoid. It places an emotional burden on you to defend your family's metaphysics.
  *   **The Cost of Hiding It:** You lose the most vivid illustration available. You also lose the opportunity to model how to separate personal investment from philosophical analysis.
  *   **The Recommendation:** **Disclose, but depersonalize.**
      *   Do not say: "My daughter might not have been my daughter."
      *   Do say: "I am asking this question because my own family was formed through donor conception. This makes the counterfactual vivid for me: if the clinic had handed us a different vial from the same batch, would we have the same child? I find myself intuitively saying 'no'. I want to know if that intuition is metaphysical or emotional."
      *   *Timing:* Put this in the **final 10 minutes**. Use the first 65 minutes to build the argument abstractly. Then, reveal the personal stake as an illustration of why the abstraction matters. This protects the argument from being swamped by the personal, and protects you from having to defend your family during the technical phase.

  ### 5. What to Decline
  You have 75 minutes. You must explicitly state what you are *not* doing to prevent scope creep.

  *   **The Declaration:** "Today we are not asking whether donor conception is ethical. We are not asking whether genetics determines personality. And we are not doing formal modal logic with possible worlds semantics."
  *   **The Specific Declination:** **The Gradual Replacement Argument.**
      *   Do not try to walk them through the sorites-style argument for origin essentialism (changing the matter by 1% increments). It takes too long and requires a grasp of tolerance principles they don't have. Stick to the intuitive leap: "Different start, different thing."
  *   **The Specific Declination:** **The Necessity of Origin vs. Necessity of Kind.**
      *   Do not get bogged down in whether a human *must* come from humans. Stick strictly to the *particular* origin (this egg vs. that egg).

  ### 6. The Final Question
  You need a question that tests if they understand that origin is a *necessary condition of identity*, not just a causal antecedent.

  **The Question:**
  "Imagine a technology that allows us to take the exact genetic code from Egg A and sperm B, but reconstruct it physically inside Egg Z and Sperm Y (different physical matter, identical code). If Origin Essentialism is true, is the resulting child *you*?"

  *   **The Slogan Answer:** "No, because it's a different egg." (This shows they memorized the rule but might be conflating matter with code).
  *   **The Grasping Answer:** "It depends on whether 'origin' means the *genetic information* or the *physical particular*. If origin essentialism is about the physical matter, it's a different person. If it's about the genetic blueprint, it might be the same. The theory claims it's the physical particular that fixes identity."
  *   **Why this works:** It forces them to distinguish between the *biological information* (which students think is what matters) and the *metaphysical particular* (which is what the thesis claims matters). It reveals if they understand that the thesis is about *haecceity* (this-ness), not qualitative similarity.
