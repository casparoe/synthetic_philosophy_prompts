answer: |-
  **Risk Allocation Protocol (RAP)**
  **Purpose:** Distinguish compensable brute luck from non-compensable option luck.
  **Constraint:** 20 minutes/file. Manager review if payout >$50k or Step 2 contested.

  **Step 1: The Alternative Test (Fact)**
  Identify the nearest safe alternative action available at the time of injury.
  *Evidence:* Police reports, employment contracts, medical advice logs.
  *Question:* Was there a legally available, physically possible action that carried significantly less risk?
  *Sufficient Answer:* "Yes, wearing a helmet" or "Yes, not entering the fight."
  *If No:* Classify as Brute Luck. **Cover All.** Stop.
  *If Yes:* Proceed to Step 2.

  **Step 2: The Cost Test (Evaluation)**
  Would choosing the alternative have imposed a cost exceeding 20% of baseline income or threatened basic housing/food security?
  *Note:* "Ego," "Convenience," or "Social Standing" do not count as costs.
  *Sufficient Answer:* Pay stubs showing income loss; eviction notices.
  *If Yes:* Classify as Brute Luck (Constrained Choice). **Cover All.** Stop.
  *If No:* Classify as Option Luck. Proceed to Step 3.

  **Step 3: Decomposition (Calculation)**
  Can the loss be split into "Baseline Risk" (what happens if safe) vs. "Amplified Risk" (extra damage from choice)?
  *Example:* Helmetless crash. Baseline = broken bones. Amplified = severe TBI.
  *If Separable:* Cover Baseline costs. Deny Amplified costs.
  *If Indivisible:* (e.g., injury only exists because of the risk). **Cover Acute Medical Only. Deny Lost Earnings.**
  *Rationale:* This solves the entanglement problem. We do not try to quantify luck. We assign the "grey area" of indivisible loss to the agent, preserving the scheme's solvency while preventing medical abandonment. Medical care prevents destitution; earnings replacement subsidizes the gamble.
  *If Unclear:* Default to Indivisible. Deny Earnings.

  **Step 4: Foreseeability Override**
  Was the specific injury mechanism statistically rare (<5% probability given the act)?
  *Evidence:* Actuarial tables, medical literature.
  *If Yes:* Treat as Brute Luck. **Cover All.**
  *If No:* Uphold Step 3.

  **Case Applications**
  1.  **Unhelmeted Motorcyclist:**
      *   Alternative: Wear helmet. Cost: Negligible (Step 2 = No).
      *   Decomposition: TBI severity indivisible from crash dynamics without complex modeling.
      *   Decision: **Cover acute surgery. Deny lost earnings.**
      *   *Result:* He survives but faces financial ruin. This is the intended harshness of holding choice responsible.

  2.  **Fight Starter:**
      *   Alternative: Walk away. Cost: Pride (not basic security). Step 2 = No.
      *   Decomposition: Injury indivisible from the fight.
      *   Decision: **Cover acute medical. Deny lost earnings.**
      *   *Result:* Consistent with motorcyclist. Violence is a chosen risk.

  3.  **Night Job Driver:**
      *   Alternative: Unemployment. Cost: 100% income loss, housing threat. Step 2 = Yes.
      *   Decision: **Classify as Brute Luck. Cover full loss (medical + earnings).**
      *   *Result:* The risk was imposed by circumstance, not genuine preference.

  **Vulnerabilities & Falsification**
  **Where it Misfires:** Step 2 (Cost Test). A 20% income loss is catastrophic for a low-wage worker but trivial for a high-wage one. The procedure treats percentage as neutral, but impact is not. It systematically penalizes the poor who cannot absorb "choices."
  **Decomposition Failure:** Step 3 assumes medical causality is clear. Often, it isn't. Caseworkers will guess, introducing bias.
  **What Changes My Mind:** If empirical data shows that "risky choices" (smoking, helmetless riding) correlate >80% with socioeconomic deprivation, the "Choice" label becomes a fiction. If the environment dictates the choice, Luck Egalitarianism collapses. I would then abandon the Responsibility model for a Needs-Based model, covering all injuries regardless of origin, funded by progressive taxation. The distinction between option and brute luck cannot survive a deterministic social reality.
