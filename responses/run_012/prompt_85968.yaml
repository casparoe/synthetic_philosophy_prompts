      *   Need a scoring or threshold system for the "20 minutes" constraint.

  3.  **Refining the Decomposition Problem:**
      *   The prompt asks to solve how to decompose loss when choice and luck mix.
      *   Solution: *Counterfactual Baseline*. Compare actual outcome to the outcome of the *nearest reasonable alternative*.
      *   If the injury exceeds the risk of the reasonable alternative, cover the excess. If the injury is within the risk of the chosen action, deny.
