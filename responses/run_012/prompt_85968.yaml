      *   **Challenge:** Choice and luck are entangled (e.g., helmet choice vs. injury severity, smoking, constrained choices).
      *   **Task:** Create a concrete decision procedure (algorithm/checklist) for the team.
          *   Must decompose loss into chosen/unchosen parts OR handle when decomposition fails.
          *   Must avoid cruelty (abandoning bad choosers) but avoid covering everything (distinction must work).
          *   Constraints: No philosophy background for users, 20 mins/file, thresholds trigger manager review.
