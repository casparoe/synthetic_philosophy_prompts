          *   If Yes -> Cover baseline injury cost (what would happen with helmet). Deny amplification (extra rehab/lost time due to severity).
          *   If No (Injury indivisible) -> **Deny Lost Earnings.** Cover acute medical stabilization only. Rationale: You own the gamble's downside.
          **Step 4: Foreseeability Override.** Was the specific injury mechanism statistically rare (<5% probability)? If Yes -> Treat as Brute Luck. Cover all.

      *   *Drafting Cases:*
