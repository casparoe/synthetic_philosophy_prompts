      *   Revised Procedure:
          1.  **Identify the Risky Act.**
          2.  **Was there an Acceptable Alternative?** (If no -> Brute Luck -> Cover. If yes -> Go to 3).
          3.  **Was the Specific Harm Foreseeable?** (If no -> Brute Luck -> Cover. If yes -> Go to 4).
          4.  **Decomposition:** Cover only the portion exceeding the baseline risk of the alternative. (This is hard to calculate).
          *   *Simplification for caseworkers:* Binary decision based on "Acceptable Alternative". If a reasonable person could have avoided the risk without unacceptable sacrifice, it's Option Luck (No Cover). If not, Brute Luck (Cover).
