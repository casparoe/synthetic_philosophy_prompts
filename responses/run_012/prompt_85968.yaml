      *   **Step 4: The Exception.** If the specific injury type was statistically improbable (e.g., helmetless but hit by meteor), revert to Brute Luck.

  4.  **Drafting the Test Cases:**
      *   **Motorcyclist:** No helmet. Alternative: Wear helmet or don't ride. Cost: Low. Verdict: Option Luck. Deny lost earnings. (Unpalatable result).
      *   **Fight:** Started it. Alternative: Walk away. Cost: Pride/Ego (not basic dignity). Verdict: Option Luck. Deny.
      *   **Night Job:** Driving night. Alternative: Unemployment/Starvation. Cost: High (basic functioning). Verdict: Brute Luck. Cover.

  5.  **Drafting the Reflection:**
      *   Misfire: The "Cost" calculation is subjective. 20% income loss means different things to different people.
      *   Change Mind: If evidence shows "choices" are systematically determined by socioeconomic status, the distinction collapses.

