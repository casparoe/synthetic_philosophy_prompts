          *   *Procedure:*
              1.  **Alternative Test:** Could they have avoided the risk without sacrificing basic functioning/income? (Yes -> Option Luck. No -> Brute Luck).
              2.  **Foreseeability Test:** Was the specific injury a known probable outcome of the choice? (Yes -> Option Luck. No -> Brute Luck).
              3.  **Decomposition Rule:** If Choice + Luck mixed, cover only medical stabilization, deny lost earnings (the "gambler's loss").

