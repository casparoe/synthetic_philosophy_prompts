          3.  **Night Job:** Driving night. Alternative: No job. Cost: >20% income (total loss). Step 2 = Yes. Verdict: Brute Luck. Cover full loss.

      *   *Drafting Reflection:*
          **Weak Joints:** Step 2 (Acceptable Cost) is subjective. A 20% loss ruins a poor person, not a rich one. The procedure treats income loss as neutral, but it isn't.
          **Change Mind:** If data shows "risky choices" correlate 90% with poverty, the "choice" label is a fiction. I'd switch to a Needs-Based model instead of Responsibility-Based.

      *   *Review against constraints:*
          *   900 words hard limit.
