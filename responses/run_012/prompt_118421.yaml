      *   *The Risk:* Participants might just feel "this is too hard" or "I don't know enough" (epistemic limitation) rather than "the calculation itself is inherently unstable/unresolvable even with perfect info" (metaphysical/structural limitation).
      *   *The Solution:* The activity needs to simulate the *structure* of the problem, not the actual timeline. It needs to force them to extend chains until the value flips repeatedly and becomes arbitrary. It needs to make the "far future" weight disproportionately heavy compared to the "now."
