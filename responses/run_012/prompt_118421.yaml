      *   *Wait, 75 mins is tight.* Need to tighten the rounds.
      *   *Scoring:* Needs to be simple. +1 / -1.
      *   *Weighting:* This is crucial for the "far future swamps nearby" feeling. The scoring key must weight the distant future exponentially.

  5.  **Addressing the "Hard Version" of Cluelessness:**
      *   The hard version isn't just "we don't know." It's "the calculation diverges."
