      *Wait, one more thing:* The prompt asks for "consequentialist cluelessness." This specifically refers to the argument (often associated with William MacAskill or Hilary Greaves) that because the future is vast and our influence is chaotic, the expected value of any action is dominated by unknowable long-term effects, rendering the calculation void.
