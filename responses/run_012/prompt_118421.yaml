      *   *Pitfall 1:* Participants treat it as creative writing fun, ignoring the scoring. *Fix:* Enforce the scoring rigor.
      *   *Pitfall 2:* Skeptics roll their eyes at the "1000 year" part. *Fix:* Acknowledge the absurdity in the debrief (it's a feature, not a bug).
