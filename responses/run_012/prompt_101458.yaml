      *   *Ending:* Raise glasses.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally implicate the estrangement. If I say "He taught us to listen to what is *not* said," the colleagues might think "Ah, the son." I must contextualize "what is not said" as *philosophical depth*, not personal secrets. I will anchor "unsaid things" to *kindness* or *intellectual generosity*.

      *(Refining the "Mistake" Implicature)*: I need to be clear to colleagues that the "single principle of rationality" is insufficient. I can say, "He showed us that rationality guides speech, though perhaps not all speech is guided by rationality alone." That's too direct for the Dean.
      Better: "He mapped the rational structures of our talk. And yet, when we look at the warmth in this room, we find data that resists mapping."
      Colleagues: "Data resists mapping" = Theory is incomplete/wrong.
      Family: "He created warmth."
      Dean: "I'm praising the atmosphere."

      *(Refining Cancellability)*: Use "It strikes me," "One might observe."

