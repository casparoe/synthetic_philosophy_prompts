  8.  **Final Safety Check on the Son:** Ensure no references to "legacy," "children," "passing the torch," "silence at home," or "reconciliation." Stick to "students" and "colleagues."

  9.  **Final Safety Check on the Dean:** Ensure no explicit criticism. The "mistake" must be framed as "open-ended inquiry" or "richness beyond the model."

  10. **Notes Section:** Explain the Gricean mechanics clearly.

