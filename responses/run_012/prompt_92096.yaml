      *   *The User's Specific Flavor:* "Strong" but "Continuous." This is the tension point. If priority is strong enough to handle the "1 vs. 1 million" case, it risks becoming Lexical. If it's weak enough to avoid Lexicality, it risks failing to prioritize the worst off enough in extreme cases.
      *   *The Transformation:* Prioritarianism is mathematically often represented as Maximizing $\sum f(w_i)$ where $f$ is strictly concave. Utilitarianism is $f(w) = w$. Egalitarianism is often defined by a ranking of distributions, but Telic Egalitarianism values equality *per se*.
      *   *The "Egalitarian" Critique:* If you just maximize a sum of transformed utilities, aren't you just a sophisticated utilitarian? Parfit says yes, it's a view about the *good*, not the *distribution*. But the user wants to distinguish it from Egalitarianism.
      *   *The "Lexical" Critique:* If the weight goes to infinity as well-being goes to zero (or some baseline), it becomes Lexical Prioritarianism (which avoids the "1 vs. 1 million" problem but introduces others). The user specifies *continuous*, so weights are finite.

  3.  **Brainstorming Defeaters/Challenges:**

      *   **Challenge 1: The "Fanaticism" / "Extreme Priority" Problem (The 1 vs. 1 Million Case).**
