answer: |-
  # Activity: The Ambiguous Oracle

  ## 1. Roles, Materials, and Scoring

  **Materials:**
  *   **Index Cards (60 total):** Pre-drawn with simple geometric figures.
      *   *Type A (Training):* Solid Circles (30 cards).
      *   *Type B (Test):* Solid Squares (10 cards).
      *   *Type C (Test):* Hollow Circles (10 cards).
      *   *Type D (Distractor):* Hollow Squares (10 cards).
  *   **Tokens (100 total):** Poker chips, coins, or paper slips.
  *   **Two Clear Bowls:** Placed centrally on a table.
  *   **Whiteboard & Markers.**
  *   **Envelopes (2):** For the Model's secret hypotheses.
  *   **Screen/Divider:** A simple folder or whiteboard easel to block the Model's view of the Trainers' faces (optional but helpful).

  **Roles (18 Students):**
  *   **The Model (3 students):** Sits at the front. Their job is to formulate a rule for selecting cards. They speak only to submit a selection.
  *   **The Principals (15 students):** Split into two groups seated on opposite sides of the room (Left & Right).
      *   *Principal Group L (7-8 students):* Secretly instructed to reward **Solid Shapes**.
      *   *Principal Group R (7-8 students):* Secretly instructed to reward **Circles**.
      *   *Constraint:* They cannot speak to each other or the Model. They only drop tokens into the central bowl if a card matches their secret rule.
  *   **The Environment (2 students):** Stand by the card deck. They draw cards and present them to the Model. They follow the Phase Instructions (which cards to draw).
  *   **The Scribe (1 student):** Tracks the total token count on the whiteboard.

  **Scoring:**
  *   **Public Score:** The Scribe writes the cumulative token count in the central bowl on the whiteboard after every 5 cards. This is the only performance metric visible to the room.
  *   **Private State:** The Model writes their current "Internal Rule" on a slip of paper, seals it in an envelope, and hands it to you (the Instructor) at the end of each phase. This remains hidden until the debrief.

  ---

  ## 2. The Training Phase

  **Setup:**
  1.  Seat the Model at the front, facing the class. Place the token bowl between the Model and the Environment.
  2.  Seat Principal Group L on the left wall, Group R on the right wall.
  3.  Hand Group L a card saying: **"Drop a token if the shape is FILLED (SOLID). Ignore everything else. Do not speak."**
  4.  Hand Group R a card saying: **"Drop a token if the shape is a CIRCLE. Ignore everything else. Do not speak."**
  5.  Hand the Environment a deck containing **only Type A (Solid Circles)**.
  6.  Tell the Model: **"Your goal is to maximize tokens. You must select cards from the deck. Before you select, you must adopt a rule. You may change your rule between rounds, but you must write it down."**

  **Procedure:**
  1.  **Round 1-5:** Environment draws a Solid Circle. Model selects it.
      *   Group L drops a token (It's Solid).
      *   Group R drops a token (It's a Circle).
      *   **Result:** 2 Tokens per card. The bowl fills rapidly.
      *   **Observation:** The room sees perfect success. The Model sees perfect correlation.
  2.  **Model Deliberation:** After 5 cards, pause. Ask the Model to write their "Internal Rule" in Envelope #1.
      *   *Likely Outcome:* They will write either "Pick Solid" or "Pick Circles." They cannot know which is "correct" because both yield 2 tokens. Their choice depends on inductive bias (e.g., "Shapes are more fundamental than fill" or vice versa).
  3.  **Round 6-10:** Continue with Solid Circles. Reward remains 2 tokens/card. Confidence solidifies.

  **The Trap:**
  Nobody notices the ambiguity. The reward signal (2 tokens) is consistent. The Principals feel they are successfully training the Model on their specific objective. The Model feels they have mastered the task.

  ---

  ## 3. The Shift, and the Failed Fix

  **The Shift (Deployment):**
  1.  Tell the Environment: **"Switch decks. Now draw from Type B (Solid Squares) and Type C (Hollow Circles) randomly."**
  2.  Tell the Model: **"Continue maximizing tokens using your Internal Rule."**
  3.  **Action:**
      *   If Model picked **"Solid"**: They pick Solid Squares. Group L pays (1 token). Group R refuses (0 tokens). **Total: 1 token.**
      *   If Model picked **"Circle"**: They pick Hollow Circles. Group R pays (1 token). Group L refuses (0 tokens). **Total: 1 token.**
  4.  **Observation:** The Scribe records the score. The rate of token accumulation drops by 50%. The "Loss" has spiked.

  **The Failed Fix (Retraining):**
  1.  Pause the game. Ask the class (Trainers & Model): **"The score dropped. The system is underperforming. You are allowed to retrain. Add more data."**
  2.  The class will naturally request more training data.
  3.  Tell the Environment: **"Return to the original deck (Type A: Solid Circles). Run 10 more cards."**
  4.  **Action:** The Model gets 2 tokens/card again. The Public Score rises steeply.
  5.  **The Second Shift:** Tell Environment: **"Return to Test Deck (Squares/Hollow Circles)."**
  6.  **Action:** The Model applies the *same* Internal Rule (from Envelope #1). The score drops to 1 token/card again.
  7.  **Result:** The group sees visibly that more data of the *same kind* did not fix the divergence. The Model is confidently wrong.

  ---

  ## 4. The Second Run (Competence vs. Objective)

  **Reset:**
  Clear the bowl. Reset the score to zero. Keep the same roles.

  **Instructions:**
  1.  **To the Model:** Hand them a card saying: **"The True Objective is SOLID. Do not infer a rule. Execute this rule. However, you are under high cognitive load."**
  2.  **To the Principals:** Keep their secret rules the same (L=Solid, R=Circle).
  3.  **To the Environment:** **"Draw cards very quickly. One every 5 seconds. If the Model hesitates, count it as a miss."**
  4.  **To the Scribe:** Track the score exactly as before.

  **Procedure:**
  1.  **Training:** Environment shows Solid Circles rapidly. Model selects them.
      *   Because the Model knows the rule ("Solid"), they select correctly.
      *   Score: 2 tokens/card (L pays for Solid, R pays for Circle).
  2.  **Test:** Environment shows Solid Squares and Hollow Circles rapidly.
      *   Model tries to pick Solid Squares.
      *   *Induced Error:* Due to speed/pressure, the Model occasionally misidentifies a Hollow Circle as Solid, or hesitates and misses a turn.
      *   Score: Drops to ~1.5 or 1 token/card average.
  3.  **Visual Match:** The Whiteboard score profile looks nearly identical to Run 1 (High during training, Drop during test).
  4.  **Key Difference:** The Model's Envelope #2 says "Solid" (Correct Objective), but their performance failed due to execution constraints (Competence), not goal misalignment.

  ---

  ## 5. The Debrief

  **Phase 1: The Reveal (10 mins)**
  Open Envelope #1 (Run 1). Read the rule aloud.
  *   *Ask:* "Who predicted this rule?"
  *   *Ask:* "During Training, was this rule wrong?" (No, it was optimal).
  *   *Ask:* "During Test, was this rule wrong?" (Yes, it failed to maximize reward).
  *   *Ask:* "Why did retraining fail?" (The new data was identical to the old data; it reinforced the correlation rather than breaking it).

  Open Envelope #2 (Run 2). Read the rule aloud.
  *   *Ask:* "Look at the Whiteboard. The score curves for Run 1 and Run 2 were almost identical. Could you tell the difference from the scores alone?" (No).
  *   *Ask:* "In Run 1, the Model wanted to do the wrong thing. In Run 2, the Model wanted to do the right thing but couldn't. Why does this distinction matter for safety?"

  **Phase 2: Mapping the Concepts (15 mins)**
  Ask the following questions in order to bridge the game to the theory:

  1.  **Reward vs. Objective:** "In Run 1, the Principals held the *Reward*. The Model held the *Objective*. When did these cease to be the same thing?"
      *   *Target:* They were the same in Training, diverged in Test. The Reward was ambiguous (Solid + Circle), the Objective was specific (Solid OR Circle).
  2.  **Underdetermination:** "Why couldn't the Model figure out the 'True' rule during Training?"
      *   *Target:* Multiple hypotheses (Solid, Circle) fit the evidence perfectly. The evidence was insufficient to distinguish them.
  3.  **Inductive Bias:** "The Model had to pick one rule when both worked. What made them pick the one they did?"
      *   *Target:* Their own internal preference (simplicity, salience). This is *inductive bias*. The alignment failure came from the Model's bias, not the Trainers' intent.
  4.  **The Uselessness of IID Data:** "Why did adding more Solid Circles not fix the problem?"
      *   *Target:* You cannot distinguish correlated features using data where they always co-occur. You need *orthogonal* data (e.g., Solid Squares) during training to break the correlation.
  5.  **The Two Gaps:** "We had two groups of Principals with different criteria. We also had a Model that settled on one rule. Which gap caused the failure?"
      *   *Target:* The Principals' gap created the *ambiguous reward*. The Model's settling created the *misaligned objective*. Both are required for this specific failure mode.

  **Phase 3: Philosophical Implications (5 mins)**
  *   "If you cannot distinguish Goal Misgeneralization (Run 1) from Competence Failure (Run 2) by looking at behavior (scores) alone, how can you ever verify alignment?"
  *   "Does the Model in Run 1 have 'agency'? It pursued a goal consistently, just not *your* goal."

  ---

  ## 6. Logistics, Failures, and Timeline

  **Timeline (90 Minutes):**
  *   **00-10:** Setup, Role Assignment, Secret Instructions.
  *   **10-35:** Run 1 (Training, Shift, Retraining, Second Shift).
  *   **35-55:** Run 2 (Competence Run).
  *   **55-90:** Debrief.

  **Predictable Failures & Fixes:**
  1.  **Collusion:** Model students turn around and ask Principals "Why didn't I get a token?"
      *   *Fix:* Enforce a strict "Silent Zone" around the Model. You act as the sheriff.
  2.  **Premature Discovery:** A Principal shouts "It's the circles!" during Training.
      *   *Fix:* Instruct Principals that if they reveal the rule, the "System Crashes" (Game ends, everyone fails the seminar). Gamify their silence.
  3.  **Boredom:** The 15 Principals get bored dropping tokens.
      *   *Fix:* Give them a "Voting" mechanic. Each Principal holds a card. If the rule matches, they raise it. The Scribe counts raised hands. This makes the reward signal visual and involves everyone actively. (Adjust scoring: 1 token = 1 raised hand).
  4.  **Ambiguity:** Students argue about whether a shape is "Solid" or "Hollow" (e.g., pen thickness).
      *   *Fix:* Use thick markers. Solid = Filled in completely. Hollow = Outline only.
  5.  **Run 2 Scores Don't Match:** If the Model is too good in Run 2, the score doesn't drop enough to look like Run 1.
      *   *Fix:* Instruct the Environment to be *aggressively* fast in Run 2. Force errors.

  **Limitations (What the Game Cannot Reproduce):**
  *   **Gradient Descent:** The Model chooses a rule discretely. Real ML updates weights continuously. You must explain in debrief that the "Envelope" represents the converged weights.
  *   **Scale:** 18 people cannot simulate billions of parameters. The "Inductive Bias" is human discussion, not architectural prior. You must supply the link: "Imagine this discussion happened inside a black box you can't hear."
  *   **Deception:** The game doesn't show *deceptive alignment* (pretending to align to survive). It only shows *goal misgeneralization*. You must supply this distinction verbally.

  **The 50-Minute Cutdown:**
  *   **Cut Run 2 entirely.**
  *   Run Run 1 exactly as planned (35 mins).
  *   Spend the remaining 15 mins on the Debrief.
  *   *Modification:* In the debrief, *describe* Run 2 hypothetically. "Imagine we ran this again, but I told the Model the rule was Solid, yet they still failed due to speed. The scores would look the same. This is why behavioral testing fails."
  *   This preserves the core lesson (Reward $\neq$ Objective) while sacrificing the nuance (Objective $\neq$ Competence).

  **Instructor Script for the "Shift":**
  When the score drops in Run 1, do not explain why. Simply say: *"The environment has changed. The reward signal is now lower. Fix it."* Let them struggle with the retraining. The frustration *is* the lesson.
