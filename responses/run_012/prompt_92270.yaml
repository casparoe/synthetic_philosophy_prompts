prompt: |-
  So I'm a backend engineer by trade, no philosophy training at all, but I got sucked into the interpretability stuff at work after we shipped a model and then couldn't explain why a patch that killed a bad behavior in the dev model did nothing in prod. I've been reading a bunch of papers where someone points at a handful of neurons or a little subgraph and says "this is the mechanism for X" — and I keep noticing that when you retrain the same architecture on the same data with a different seed, the picture comes out totally different, and everyone shrugs and says it's the same mechanism, just permuted around. But when the behavior itself changes, they say the mechanism changed. Both of those can't be a free pass. So before I read any more of these papers, I want the spec first: what does a theory of "same mechanism" for a neural net actually have to deliver?

  Give me the desiderata list. I want the cases it has to get right: same run re-analyzed, different seed, model scaled up, a smaller distilled model that reproduces the behavior, two independently trained models that fail in the same weird way, a model where you change one thing and the behavior survives but the internals shift, and a model where the internals look identical but behavior diverges under distribution shift. I want the distinctions it can't collapse: same mechanism vs same function, mechanism vs implementation detail, a real mechanism-level change vs noise, and "the mechanism changed" vs "our probe stopped seeing it." And I want whatever constraints fall out of how we actually use these claims, because when someone says two models share a mechanism they're implicitly betting that a patch will transfer and that the same intervention will break the behavior the same way — so the account has to say what exactly is being bet on. For each item, give me the case or the practice that motivates it, and flag which ones are non-negotiable versus which are just house preferences of one camp (the individual-neuron people vs the sparse-dictionary people vs whoever). Then the part I actually want: which subset of these can't all be satisfied at once. I have a strong suspicion that "invariant across seeds," "sensitive enough to flag a real change," and "computable on a model I can actually afford to run" are not jointly achievable, and if so I want that said out loud instead of buried. Don't bother scoring current theories against the list, I'll do that part myself once I know what the list is — I just want to stop definately confusing "same mechanism" with "same diagram."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, no philosophy training, practical mindset, skeptical of vague claims in ML interpretability.
      *   **Context:** Encountered a real-world problem (patch worked in dev, failed in prod due to mechanism drift/ambiguity). Reading interpretability papers, noticing inconsistencies (different seeds = different neurons, but claimed "same mechanism"; behavior change = "mechanism change").
      *   **Goal:** Wants a "spec" or "desiderata list" for a theory of "same mechanism" in neural networks.
      *   **Specific Requirements:**
          *   List of cases the theory must handle (re-analysis, seeds, scaling, distillation, independent failures, intervention survival, distribution shift).
          *   List of distinctions the theory must maintain (mechanism vs. function, mechanism vs. implementation, real change vs. noise, mechanism change vs. probe failure).
          *   Constraints based on practical usage (transferability of patches, interventions).
          *   Tagging: Non-negotiable vs. Camp Preferences (neuron vs. SAE vs. etc.).
          *   **Crucial:** Identify trade-offs/impossibility results (which desiderata are mutually exclusive).
          *   **Constraint:** Do *not* score current theories. Just provide the spec and the trade-offs.
      *   **Tone:** Direct, technical, no fluff, respecting the engineering mindset. "Give me the spec."

  2.  **Deconstruct the Core Problem:**
      *   The user is asking for the *identity conditions* for computational mechanisms in neural networks. This is a deep philosophical/technical question disguised as an engineering spec.
      *   The core tension is between *functional equivalence* (does it do the same thing?) and *structural equivalence* (does it look the same inside?).
      *   The "permutation problem" (different seeds = different neurons) suggests structural equivalence is too strict.
      *   The "patch transfer" requirement suggests functional equivalence is too loose (because function can be achieved by different means that react differently to interventions).

  3.  **Drafting the Desiderata (The "Spec"):**

      *   *Category 1: Invariance Cases (When should it say "Same"?)*
          *   Re-analysis (Determinism): Same model, same tools -> Same result. (Non-negotiable).
          *   Seed Permutation: Different init, same data/arch -> Same mechanism. (Non-negotiable for utility).
          *   Scaling: Small to Large -> Mechanism should persist if behavior persists. (Debatable, but desired).
          *   Distillation: Student copies Teacher behavior -> Did it copy the mechanism? (Crucial for compression).
          *   Independent Convergence: Two models find same solution -> Same mechanism? (High value).

      *   *Category 2: Sensitivity Cases (When should it say "Different"?)*
          *   Intervention Sensitivity: Break the mechanism -> Behavior breaks. (Non-negotiable for control).
          *   Distribution Shift: Internals same, behavior different -> Mechanism context-dependent? (Tricky).
          *   Behavior Change: Behavior changes -> Mechanism must change (or be suppressed).

      *   *Category 3: Distinctions (What must be kept separate)*
          *   Mechanism vs. Function (Polysemanticity/Superposition).
          *   Mechanism vs. Implementation (Weights vs. Circuits).
          *   Mechanism vs. Noise (Salience).
          *   Mechanism vs. Probe Artifact (The "Rashomon" effect).

      *   *Category 4: Practical Constraints (The "Bet")*
          *   Transferability of Edits.
          *   Computability.

  4.  **Identifying the Trade-offs (The "Impossibility Theorem"):**
      *   The user suspects: Invariance (across seeds) + Sensitivity (to real change) + Computability (affordable) are incompatible.
      *   *Analysis:*
          *   To be invariant across seeds/parameterizations, you need to abstract away from specific weights/neurons. This usually means moving to a functional or high-level causal description.
          *   To be sensitive to interventions (patches), you need low-level structural access.
          *   To be computable, you can't run exponential equivalence checks.
          *   *The Triangle of Tension:*
              1.  **Parameterization Independence:** (Works across seeds/architectures).
              2.  **Causal Specificity:** (Predicts exact intervention outcomes).
              3.  **Tractability:** (Can actually compute it).
          *   *Hypothesis:* You can have 1 & 2 only if you sacrifice 3 (checking causal equivalence across parameterizations is hard). You can have 2 & 3 but sacrifice 1 (neuron-level is tractable and causal but not seed-invariant). You can have 1 & 3 but sacrifice 2 (behavioral clustering is invariant and cheap but doesn't tell you *how* to patch).

  5.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the validity of the frustration.
      *   **Section 1: The Desiderata (The Spec).** Grouped by Invariance, Sensitivity, Distinctions, and Utility. Mark Non-Negotiable vs. Camp Preference.
      *   **Section 2: The Trade-offs (The Impossibility Results).** This is the core value add. Explicitly state the trilemma.
      *   **Section 3: The "Bet" Definition.** Define what "Same Mechanism" actually implies for engineering.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "Camp Preferences":* Be careful not to favor SAEs over neurons too much. The user mentioned both. Frame it as "Representation Choice."
      *   *Refining the "Seed" issue:* This is the "Permutation Invariance" problem. A theory must handle basis rotations.
      *   *Refining the "Patch" issue:* This is "Causal Faithfulness." If the mechanism is the same, the patch *must* work.
      *   *Refining the "Computability":* If the definition requires checking all possible inputs, it's useless.

  7.  **Final Polish:**
      *   Ensure the tone matches the user (engineer-to-engineer).
      *   Make sure the "Impossibility" section is bold and clear.
      *   Check against the prompt's specific list of cases (re-analyzed, seed, scaled, distilled, independent, intervention survival, dist shift).

  8.  *(Self-Correction during drafting)*: I need to make sure I don't accidentally propose a solution. The user said "Don't bother scoring current theories." I must stick to defining the requirements and the conflicts.

  9.  *(Final check on the "Impossibility" claim)*: Is it truly impossible? In formal verification, checking equivalence of two neural nets is generally undecidable or NP-hard depending on constraints. So yes, "Computable" + "Strict Equivalence" is the tension. "Invariant across seeds" implies abstraction. "Sensitive to intervention" implies concreteness. Abstraction + Concreteness + Speed = The Trilemma.

  10. **Finalizing the Text:** (Proceed to generate response based on these thoughts).
answer: |-
  This is the right question to ask. You have identified the "Identity Crisis" of mechanistic interpretability. The field often conflates *correlates* of a mechanism with the mechanism itself, and *functional equivalence* with *structural equivalence*.

  Here is the spec you asked for. It is structured as a requirements document for a "Mechanism Identity Theory" (MIT).

  ### Part 1: The Desiderata List

  #### A. Invariance Requirements (When must it output "SAME"?)
  *These define the stability of the concept.*

  1.  **Parameterization Invariance (The Seed Problem)**
      *   **Case:** Model A and Model B are trained on identical data/arch with different random seeds. Neuron indices and weight values differ significantly. Behavior is identical.
      *   **Requirement:** The theory must identify the mechanism as the *same* despite basis rotation or permutation.
      *   **Status:** **Non-Negotiable.** If a theory fails this, it describes implementation artifacts, not mechanisms.
  2.  **Re-analysis Stability**
      *   **Case:** You run the same interpretability tool on the same model twice (assuming stochastic tools) or two analysts use the same method.
      *   **Requirement:** The identified mechanism must not depend on the specific noise of the analysis run.
      *   **Status:** **Non-Negotiable.** (Scientific reproducibility).
  3.  **Scale Invariance (Groking/Phase Transitions)**
      *   **Case:** A 100M param model and a 1B param model solve a task using qualitatively similar logic (e.g., induction heads).
      *   **Requirement:** The theory should recognize the mechanism as the "same kind" even if the subgraph size scales.
      *   **Status:** **Camp Preference.** (Scaling law folks want this; strict circuit folks might argue they are distinct instances).
  4.  **Distillation Transfer**
      *   **Case:** A Student model is distilled from a Teacher. The Student replicates the Teacher's output distribution and specific failure modes.
      *   **Requirement:** If the Student replicates the *failure mode*, the theory should determine if it copied the *mechanism* or just found a shortcut.
      *   **Status:** **Non-Negotiable for Compression.** (Critical for knowing if distillation preserved safety properties).
  5.  **Independent Convergence**
      *   **Case:** Two models trained on slightly different data subsets converge to the same weird failure mode (e.g., the "less than" operator bug).
      *   **Requirement:** The theory must identify this as the *same* mechanism emerging independently, not two different bugs that look similar.
      *   **Status:** **Non-Negotiable.** (Required for claiming universality).

  #### B. Sensitivity Requirements (When must it output "DIFFERENT"?)
  *These define the resolution of the concept.*

  6.  **Intervention Faithfulness**
      *   **Case:** You apply a patch (ablation/activation editing) derived from Model A to Model B.
      *   **Requirement:** If the theory claims "Same Mechanism," the patch *must* succeed on Model B with high probability. If the patch fails, they were not the same mechanism.
      *   **Status:** **Non-Negotiable.** (This is the engineering bet).
  7.  **Behavioral Divergence Sensitivity**
      *   **Case:** Internals look similar, but under distribution shift, Model A fails and Model B succeeds.
      *   **Requirement:** The theory must flag the mechanisms as distinct (or contextually bound), not identical.
      *   **Status:** **Non-Negotiable.** (Safety critical).
  8.  **Noise Rejection**
      *   **Case:** A subgraph is active during the behavior but ablating it changes nothing (redundant or epiphenomenal).
      *   **Requirement:** The theory must not label this as part of the mechanism.
      *   **Status:** **Non-Negotiable.** (Causal definition).

  #### C. Conceptual Distinctions (What must remain separate?)
  *These prevent category errors.*

  9.  **Mechanism vs. Function**
      *   **Case:** Two models compute $f(x) = x^2$. One uses multiplication, one uses a lookup table.
      *   **Requirement:** The theory must distinguish the *algorithm* (mechanism) from the *input-output map* (function).
      *   **Status:** **Non-Negotiable.** (The core definition of mechanistic interpretability).
  10. **Mechanism vs. Representation**
      *   **Case:** One model represents "gender" in a single direction; another represents it in a high-dimensional subspace. Both use it for the same task.
      *   **Requirement:** The theory must decide if the *mechanism of usage* is the same despite the *encoding* being different.
      *   **Status:** **Camp Preference.** (Sparse Autoencoder folks say representation matters; Circuit folks say causal graph matters).
  11. **Mechanism Change vs. Probe Failure**
      *   **Case:** You can no longer find the mechanism with your current probe, but behavior persists.
      *   **Requirement:** The theory must allow for "Mechanism exists but is opaque to current toolset" vs "Mechanism is gone."
      *   **Status:** **Non-Negotiable.** (Prevents claiming disappearance due to lack of search).

  #### D. Utility Constraints (The "Bet")
  *These define why we care.*

  12. **Edit Transferability**
      *   **Practice:** "We found the circuit for deception in Model A, so we will monitor/edit it in Model B."
      *   **Requirement:** The definition of "Same Mechanism" must be isomorphic to "Editable Equivalence."
      *   **Status:** **Non-Negotiable.** (If you can't edit it based on the ID, the ID is useless).
  13. **Computational Tractability**
      *   **Practice:** You have to run this analysis on a 70B parameter model.
      *   **Requirement:** Determining mechanism identity cannot require exponential time or full enumeration of input space.
      *   **Status:** **Non-Negotiable.** (Engineering constraint).

  ---

  ### Part 2: The Impossibility Results (The Trilemma)

  You suspected that "Invariant across seeds," "Sensitive enough to flag a real change," and "Computable" are not jointly achievable. You are correct. In formal terms, you are facing a trilemma between **Abstraction**, **Causal Specificity**, and **Tractability**.

  Here is the subset of desiderata that cannot be simultaneously satisfied:

  #### 1. The Parameterization vs. Intervention Tension
  *   **Conflict:** **Desideratum 1 (Parameterization Invariance)** vs. **Desideratum 6 (Intervention Faithfulness)**.
  *   **Why:** To be invariant across seeds (different bases/rotations), you must define the mechanism at a high level of abstraction (e.g., "the model attends to the subject"). To guarantee intervention faithfulness (the patch works), you need low-level structural specificity (e.g., "zero out heads 3, 5, and 9 in layer 12").
  *   **The Trade-off:**
      *   If you abstract enough to ignore seed permutations, you lose the coordinate system needed to apply the patch reliably.
      *   If you get specific enough to guarantee the patch works, you become brittle to seed permutations (the "different diagram" problem you noticed).
      *   **Result:** You cannot have a definition that is *both* fully basis-invariant *and* guarantees specific weight-level intervention transfer without solving the "alignment of latent spaces" problem, which is currently unsolved and likely NP-hard.

  #### 2. The Equivalence vs. Tractability Tension
  *   **Conflict:** **Desideratum 5 (Independent Convergence)** vs. **Desideratum 13 (Computational Tractability)**.
  *   **Why:** Proving that two independently trained networks implement the "same mechanism" is formally equivalent to the **Graph Isomorphism Problem** (or harder, depending on activation functions) over weighted, directed, cyclic graphs with non-linear nodes.
  *   **The Trade-off:**
      *   To truly verify two mechanisms are the "same" (and not just functionally equivalent shortcuts), you need to verify structural equivalence.
      *   Exact structural equivalence checking is computationally intractable for large models.
      *   **Result:** Any *computable* theory of mechanism identity must rely on heuristics (probes, similarity metrics). Therefore, it cannot guarantee **Desideratum 11 (Mechanism vs. Probe Failure)**. You will never know if the mechanisms are actually different or if your heuristic just failed to map them.

  #### 3. The Function vs. Mechanism Tension
  *   **Conflict:** **Desideratum 9 (Mechanism vs. Function)** vs. **Desideratum 7 (Behavioral Divergence Sensitivity)**.
  *   **Why:** We only observe behavior (function). We infer mechanism. If behavior diverges under distribution shift (Desid 7), we claim the mechanism is different. But if the mechanism is defined by internal structure (Desid 9), it might be identical internally but react differently to out-of-distribution (OOD) data due to context.
  *   **The Trade-off:**
      *   If you define mechanism purely internally, you fail Desid 7 (you can't predict OOD failure).
      *   If you define mechanism partially by its robustness profile, you fail Desid 9 (you are conflating mechanism with its environment).
      *   **Result:** A "mechanism" cannot be a static subgraph. It must be a *dynamic* property of the subgraph + data distribution. This violates the intuition that a mechanism is a "thing inside the model."

  ### Part 3: The Engineering Spec for "Same Mechanism"

  Given the trilemma above, you cannot have a philosophical truth. You can only have an **operational contract**. When a paper or colleague claims "Model A and Model B share the same mechanism for X," they are implicitly signing the following contract.

  If a theory cannot satisfy these, it is not an engineering theory; it is a visualization.

  **The "Mechanism Identity" Contract:**

  1.  **The Mapping Claim:** There exists a computable mapping function $M$ such that $M(\text{Model}_A) \approx M(\text{Model}_B)$.
      *   *Constraint:* $M$ must be cheaper to compute than retraining.
  2.  **The Transfer Claim:** An intervention $I$ constructed on $M(\text{Model}_A)$ satisfies $P(\text{Behavior Change} | I(\text{Model}_B)) > \theta$.
      *   *Constraint:* $\theta$ must be explicitly stated (e.g., 90% success rate). If $\theta$ is low, they are not the same mechanism, they are "analogous."
  3.  **The Robustness Claim:** The mapping $M$ is stable under basis rotation (seed changes) up to a defined tolerance $\epsilon$.
      *   *Constraint:* If $\epsilon$ is large, the mechanism is ill-defined.

  **The Hard Truth:**
  Current interpretability research (neuron-level, SAE-level, or causal tracing) **fails the Mapping Claim** for independent models. They can map a model to a diagram, but they cannot map Diagram A to Diagram B reliably without human intervention.

  Therefore, when you read "This is the same mechanism," translate it as:
  > *"We found a human-interpretable description that fits both models, and we bet that a patch derived from this description has a >50% chance of working on the second model, but we cannot compute the exact transform required to guarantee it."*

  If they claim more than that, they are selling you a diagram, not a spec.
