prompt: |-
  I'm a fourth-year PhD student — formal epistemology / decision theory, my department can't decide which — and I've somehow become the person who runs the "disagreement" segment of our weekly forecasting meeting. Eight of us, mostly grad students plus two postdocs, forecasting things like will this bill pass, will this replication hold up, will this trial read out positive. House rule: if two of us are more than 0.15 apart on the same question, anyone can call deadlock, and then it's on me to run... whatever it is I'm supposed to run. Right now I basically make them talk at each other and we all go home.

  I want you to act as an expert in Bayesian epistemology and epistemic game theory who is also unusually good at turning theory into something a tired facilatator can actually execute live. Think carefully about this before you answer, and start with a short brainstormed list of the ways a deadlock like this can fail, so I can see the space before you commit to a procedure.

  What I want: a decision procedure I can run on two members, in maybe 30 minutes, questions in order, with what counts as a sufficient answer to each, and with explicit stop points — where it stops with a verdict of "you two aren't actually disagreeing in the sense that matters", and where it stops and hands the thing back to a human because it turns out not to be that kind of question. Ground it in Aumann's agreement theorem and be exact about the theorem's assumptions, because the whole point of this for me is that the theorem tells me *which* assumption must have failed when a disagreement survives. I don't want a summary of the theorem — I want the diagnostic that falls out of its assumptions.

  Three things it has to handle, because they're the three things that actually happen to us:

  1. One colleague ends every deadlock with "we just have different priors," and it's transparently a get-out-of-jail-free card. I want the procedure to make that move cost something: what does someone have to actually show before claiming the residual disagreement is a prior difference rather than one of the other failure modes? I suspect the honest answer is that "different priors" is what you're entitled to say only after you've failed the earlier tests, and I want the procedure to enforce that order and to say what a legitimate prior dispute looks like from the outside.

  2. Is each of us saying our number out loud, and hearing the other's, enough to get the common-knowledge condition? I have a nagging suspicion that most of our deadlocks are quietly failing that condition — that we each know the other's number but not really the other's reasons, or not that the other knows that we know. Give me a concrete test for when common knowledge of the posteriors has actually been achieved, as opposed to merely announced.

  3. The colleague who knows the literature keeps saying we should just iterate — announce, update, announce — and that convergence is guaranteed. Is that true, and under exactly which assumptions? If it's true, why doesn't it work for us? And if the guarantee has fine print, what's the shape of the case where it doesn't bite? I want to know whether "just keep announcing" is a real procedure or a myth with an asterisk.

  Then run the procedure on three cases. I want the third one to give an answer I won't like:

  - Two of us at 0.2 and 0.6 on whether a bill passes. We've both read the same three polls, we've both shared them, and we're still sitting there.
  - Two of us on whether a published effect will replicate — one says 0.3, the other 0.75.
  - A case where the honest output of the procedure is that no amount of Bayesian machinery is going to converge us, and where running the protocol anyway is making things worse by dressing a non-Bayesian disagreement up as a Bayesian one. Pick the most realistic version of that you can and tell me what the procedure should say instead of pretending.

  Also flag what the procedure can't do. I'd much rather see the edges than have it look more powerful than it is — and be honest about which steps are real tests and which are judgment calls I'm dressing up as tests.

  Format: lead with the bottom line in your first sentence — the one-sentence version of the procedure, the thing I'd write on the whiteboard — then the reasoning and the steps. No preamble, no restating my question back to me.
