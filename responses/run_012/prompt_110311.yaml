answer: |-
  Run a four-stage diagnostic that sequentially verifies semantic alignment, common knowledge of evidence partitions, Bayesian computational integrity, and finally isolates prior differences, with explicit stop rules at each stage.

  ### Brainstormed Failure Modes
  Before committing to the steps, here is the space of ways a deadlock can fail to resolve, mapped to the assumptions of Aumann's Agreement Theorem (AAT):

  1.  **Semantic Drift (Partition Failure):** You are conditioning on different propositions (e.g., "pass" means "pass Senate" vs. "become law"). AAT assumes a common state space; if your states don't match, the theorem doesn't bite.
  2.  **Information Asymmetry (Common Knowledge Failure):** You know the number, but not the *partition* (the specific evidence/reasoning) that generated it. AAT requires common knowledge of posteriors, which implies common knowledge of the information sets leading to them.
  3.  **Computational Error (Rationality Failure):** One of you is not actually Bayesian updating (math error, logical slip, cognitive bias). AAT assumes perfect rationality.
  4.  **Likelihood Disagreement (Model Failure):** You agree on priors and evidence, but disagree on $P(E|H)$. This is often masqueraded as a prior disagreement but is actually a dispute over the causal model.
  5.  **Genuine Prior Difference:** You agree on evidence, model, and math, but started from different base rates. AAT assumes common priors; if this fails, disagreement is permitted.
  6.  **Non-Epistemic Stake (Motivated Reasoning):** The reported credence is influenced by utility (wanting the bill to pass) rather than truth. This violates the Bayesian assumption entirely.

  ### The Procedure: Aumann Diagnostic Protocol
  **Time Limit:** 30 Minutes. **Facilitator Role:** Enforce stop points.

  **Stage 1: Semantic Alignment (5 mins)**
  *   **Action:** Both agents write down the exact proposition $X$ they are assigning a probability to. Compare definitions of all terms.
  *   **Sufficient Answer:** Both agents sign off on a single written sentence defining $X$.
  *   **Stop Point (Verdict: Dissolved):** If definitions differ, align them. Recalculate credences. If they converge, the disagreement was semantic.
  *   **Stop Point (Verdict: Hand Back):** If you cannot agree on what $X$ means after 5 minutes, this is not a forecasting disagreement; it is a conceptual one. Hand back to the group.

  **Stage 2: The Partition Test (Common Knowledge) (10 mins)**
  *   **Action:** Agent A states their credence $P(A)$ and lists the specific evidence $E_A$ used. Agent B states $P(B)$ and $E_B$. Merge evidence into set $E_{total}$.
  *   **Sufficient Answer:** Both agents agree that $E_{total}$ contains all relevant private information held by either party.
  *   **The Test:** Agent A must attempt to derive Agent B's credence using $E_B$ and A's own reasoning. Agent B does the same.
  *   **Stop Point (Verdict: Dissolved):** If sharing $E_{total}$ causes convergence, the disagreement was information asymmetry.
  *   **Stop Point (Verdict: Proceed):** If you share all evidence and still differ, you have achieved common knowledge of the posteriors (practically speaking). Move to Stage 3.

  **Stage 3: The Likelihood Check (Bayesian Integrity) (10 mins)**
  *   **Action:** Identify the primary hypothesis $H$ (e.g., "Bill passes"). Agree on a prior $P(H)$ (use a neutral reference class if needed). Compare likelihood ratios $P(E|H)$ vs $P(E|\neg H)$ for the key evidence.
  *   **Sufficient Answer:** Both agents agree on the likelihood ratios for the shared evidence.
  *   **Stop Point (Verdict: Prior Dispute):** If you agree on priors and likelihoods but still differ, the error is computational. Recalculate together. If the math holds and you still differ, you have isolated a **Genuine Prior Difference**. Record it and stop.
  *   **Stop Point (Verdict: Model Dispute):** If you disagree on likelihoods (e.g., how much weight a poll carries), this is not a prior dispute; it is a model dispute. Do not allow the "different priors" excuse. You must resolve the model or split the difference.

  **Stage 4: The Integrity Check (5 mins)**
  *   **Action:** Ask explicitly: "Is any part of your credence driven by how much you *want* this outcome, or trust in the source beyond the data?"
  *   **Stop Point (Verdict: Non-Bayesian):** If yes, acknowledge this is not a Bayesian disagreement. Stop the protocol.

  ### Addressing Your Three Pain Points

  **1. The "Different Priors" Get-Out-of-Jail-Free Card**
  *   **The Fix:** The procedure enforces an order of operations. You are only *entitled* to claim a prior difference at Stage 3, after you have proven you share the same evidence (Stage 2) and agree on the likelihood of that evidence given the hypothesis (Stage 3).
  *   **The Cost:** To claim a prior difference, you must explicitly state your prior $P(H)$ and justify it via a reference class. If you cannot state your prior independently of the evidence you just saw, you are not holding a prior; you are holding a posterior. This makes the move costly because it exposes you to scrutiny on your base rates.

  **2. Common Knowledge vs. Announcement**
  *   **The Fix:** Stage 2 (The Partition Test). Merely hearing "I say 0.6" is not common knowledge of the posterior in the Aumann sense because you don't know the information set generating it.
  *   **The Test:** The requirement to *derive* the other's number using their evidence is the concrete test. If I know your evidence and I am Bayesian, I should be able to calculate your posterior. If I can't, either I am irrational, you are irrational, or you are hiding evidence. This forces the "reasons" into the common knowledge set.

  **3. The Iteration Myth**
  *   **The Fix:** Limit iteration to Stage 2 only. Geanakoplos & Polemarchakis (1982) prove convergence if agents communicate posteriors and are Bayesians with common priors. However, this assumes you update on the *fact of the disagreement* itself.
  *   **The Reality:** Humans rarely update on "Bob disagrees with me" because we suspect Bob is irrational (violating the common rationality assumption). Therefore, blind iteration is inefficient. The procedure forces you to exchange *partitions* (evidence) rather than just posteriors. If exchanging evidence doesn't work, iterating the number won't either. The procedure cuts off iteration after Stage 2 to prevent wasted time.

  ### Running the Procedure on Three Cases

  **Case 1: The Bill (0.2 vs 0.6)**
  *   **Context:** Both read the same three polls.
  *   **Execution:**
      *   *Stage 1:* Semantics align ("Pass Senate by Friday").
      *   *Stage 2:* Evidence is identical (the three polls). Partition is common.
      *   *Stage 3:* Likelihood Check. Agent A (0.2) thinks Poll 1 is an outlier (low likelihood weight). Agent B (0.6) thinks Poll 1 is decisive (high likelihood weight).
      *   **Verdict:** **Model Dispute.** This is not a prior difference. They disagree on $P(\text{Poll}| \text{Pass})$.
      *   **Action:** Do not accept "different priors." Force them to agree on a weighting scheme for the polls or average their likelihood ratios. The procedure prevents the prior excuse here.

  **Case 2: The Replication (0.3 vs 0.75)**
  *   **Context:** Published effect vs. replication success.
  *   **Execution:**
      *   *Stage 1:* Semantics align ("Statistically significant effect in same direction").
      *   *Stage 2:* Partition Test reveals asymmetry. Agent A (0.75) knows the original lab's internal protocol details. Agent B (0.3) knows about a methodological critique in a recent preprint that A hasn't read.
      *   **Verdict:** **Information Asymmetry.** Common knowledge was not achieved initially.
      *   **Action:** Share the preprint and the protocol. Re-forecast. If they converge, the deadlock was solved by information transfer. If they still differ after sharing, proceed to Stage 3.

  **Case 3: The Non-Bayesian Disagreement (The Answer You Won't Like)**
  *   **Context:** Two colleagues on a policy-adjacent forecast (e.g., "Will this AI regulation pass?"). One is a techno-optimist, one is a safety advocate. Credences are 0.1 vs 0.9.
  *   **Execution:**
      *   *Stage 1 & 2:* Semantics and evidence are shared perfectly. They both read the same legislative text and lobbying reports.
      *   *Stage 3:* They agree on likelihoods (e.g., "If lobbying spend > X, pass probability increases"). They even agree to use a neutral reference class prior.
      *   *Stage 4:* Integrity Check. When asked why they differ despite identical inputs, Agent A admits, "I don't trust the legislators to act rationally," and Agent B admits, "I assume the industry lobby will block it regardless of text."
      *   **Verdict:** **Non-Bayesian Disagreement (Motivated Reasoning/Trust).**
      *   **Action:** The procedure halts. It declares that **no amount of Bayesian machinery will converge you.** You are not disagreeing about probability; you are disagreeing about *agency* and *values* masquerading as probability. Running the protocol further is harmful because it dresses a normative conflict in epistemic clothing.
      *   **Why you won't like it:** It tells you to stop trying to fix it with math. It forces you to admit that one or both of you is not reporting a genuine credence but a policy preference.

  ### Limitations and Flags

  1.  **Cannot Detect Lying:** If an agent lies about their evidence or their true credence (strategic misreporting), the procedure fails. AAT assumes truthful communication.
  2.  **Judgment Call on "Enough" Evidence:** Stage 2 requires agents to agree they have shared *all* relevant evidence. This is a judgment call. Agents may withhold "tacit knowledge" they can't articulate.
  3.  **Common Priors are Counterfactual:** Testing for "common priors" (Stage 3) requires agreeing on a reference class. This is often where the real fight is. The procedure forces you to call it a "Prior Dispute," but it cannot resolve which prior is correct.
  4.  **Rationality Assumption:** The procedure assumes agents *want* to converge. If an agent gains social status from maintaining a contrarian position, the protocol will stall at Stage 4.
  5.  **Time Boxing:** 30 minutes is arbitrary. Complex model disputes (Case 1) may require more time than allowed, leading to a false "Prior Dispute" verdict because you ran out of time to resolve the likelihoods.

  **Final Instruction:** If Stage 4 is triggered, do not force a number. Record the disagreement as "Structural/Value-Based" and move to the next question. Forcing convergence here degrades the calibration of your group.
