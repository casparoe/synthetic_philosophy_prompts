  I'm a philosophy professor and I teach a seminar that's nominally on the philosophy of science but keeps drifting into machine learning, and I've painted myself into a corner that I'm hoping you can help me out of. For a few years now I've had this lecture where I tell the students that the no-free-lunch theorem is really just Hume's problem of induction dressed up in math: the theorem says that, averaged over all possible problems, every learning algorithm does exactly as well as every other one — no learner beats any other, coin-flipping included — so there's no rational basis for preferring inductive inference to any other rule we could invent, and the whole scientific enterprise rests on a leap of faith, which is exactly what Hume was getting at. It's a crowd-pleaser, honestly. But last week one of my sharper grad students told me flatly that I was "conflating two completly different things," and when I asked him to be specific he muttered something about priors and the structure of the problem space and then the bell rang, so I never got the payoff.

  So what I want from you: is there actually a confusion buried in that lecture, and if so, where exactly does it go wrong? Is the no-free-lunch result a formalization of the problem of induction, or am I quietly smuggling in some assumption about what counts as a "problem" that Hume never signed on to? And if my student is right that I'm misreading it, then tell me honestly whether there's any defensible connection at all between no-free-lunch and the induction worry, or whether the whole analogy is a bust. Don't spare my feelings — I'd much rather find out from you now than keep giving a bad lecture for another five years. American English, please.
