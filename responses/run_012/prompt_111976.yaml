answer: |-
  Here is the breakdown of *Categories* 5 to help you untangle the passage, evaluate your colleague's reading, and handle the student questions.

  ### 1. The Engine of the Passage: "Said Of" vs. "Present In"
  To make sense of the apparent contradiction, you need to clarify the two technical criteria Aristotle introduces at the very start of the *Categories*. He divides all beings based on two binary distinctions:

  1.  **Said of a subject (predicable):** This is a logical/classificatory relation. 'Man' is said of Socrates. 'Animal' is said of Man. This establishes *what* the thing is.
  2.  **Present in a subject (inherent):** This is an ontological/dependence relation. A specific patch of 'white' is present in Socrates. It cannot exist separately from the subject it inheres in. This establishes *how* the thing is (its qualities, quantities, etc.).

  **The Four-Fold Result:**
  *   **Primary Substance (e.g., Socrates):** Neither said of nor present in. (The ultimate subject).
  *   **Secondary Substance (e.g., Man, Animal):** Said of, but **not present in**.
  *   **Accidents (e.g., a specific white):** Present in (and sometimes said of a subject, e.g., 'white' is said of 'color').

  **Why Secondary Substances count as Substances:**
  You noted the tension: Primary substances are defined by *not* being predicable, yet Secondary substances *are* predicable. The resolution lies in the second criterion. What makes something a substance in the *Categories* is primarily that it is **not present in a subject**.

  Both Socrates and 'Man' share the feature of ontological independence. 'Man' does not inhere in Socrates like the color white does; rather, 'Man' signifies the *essence* of Socrates. Because species and genera are **not present in** a subject (they are not accidents inhering in a host), they qualify as substances, albeit derivatively. They reveal the reality of the primary substance rather than merely modifying it.

  ### 2. Evaluating Your Colleague's "Order of Predication" Reading
  Your colleague is half-right but ontologically deflationary in a way that doesn't fit the *Categories*.

  *   **Where she is right:** She correctly identifies that secondary substances earn their title because they answer the *ti esti* ("what is it?") question regarding the primary substance. This is a predicative function.
  *   **Where she is wrong:** She suggests this is *only* about "how we say what things are" (language/logic) rather than "what there is" (ontology). In the *Categories*, universals (species and genera) are real beings. They are not merely linguistic labels; they are the essential structures of reality. To call them "secondary substances" is to grant them ontological status, just less fundamental than the individual.

  If you tell students they are substances *only* in the order of predication, you risk turning Aristotle into a nominalist here, which he isn't. In the *Categories*, the universal 'Man' is a real thing that exists, just not as independently as Socrates. Your suspicion is correct: she is likely reading the *Metaphysics* (where the status of universals is problematized) back into the *Categories*. In this text, you should teach that species/genera **really are substances**, just in a derivative, essential sense.

  ### 3. The Student's Transitivity Question ("Included In")
  Your student asks: If Animal is included in Man, and Man is included in Socrates, does Socrates contain every genus above him?

  This confusion arises from mixing up **logical subsumption** with **spatial containment**.

  *   **The Relation:** The relation of "said of" is transitive. Animal is said of Man; Man is said of Socrates; therefore, Animal is said of Socrates.
  *   **The Ontology:** Socrates does not "contain" Animal like a box contains a ball. Rather, Socrates **falls under** the classification of Animal.
  *   **The Explanation:** Tell your students to think in terms of instantiation, not containment. Socrates is a *token* of the type 'Man', and 'Man' is a *subtype* of the type 'Animal'. Socrates instantiates the essence of 'Man', which itself specifies the essence of 'Animal'. He doesn't "hold" the genus inside him; he *is* an instance of it. The "inclusion" is hierarchical classification, not mereological parts.

  ### 4. Squaring with the *Metaphysics* (No Universal is a Substance)
  This is the hardest pill to swallow, but the short answer is: **Don't square them.** Acknowledge the development.

  *   **In the *Categories*:** The priority is on **essence**. Since universals (species/genera) tell us the essence of the individual, they are granted the title of "secondary substance." The focus is on logical classification and stability.
  *   **In the *Metaphysics* (Book Z):** The priority shifts to **causal unity and individuality** (*tode ti*, or "thisness"). Aristotle argues that a substance must be a "this" (a particular). A universal is by definition "common" (*koinon*) to many things. What is common cannot be a "this." Therefore, in the *Metaphysics*, no universal can be a substance.

  **Teaching Tip:** Tell your students that the *Categories* is likely an earlier work where Aristotle is more comfortable with Platonic-style classification. By the *Metaphysics*, he is digging deeper into what makes an individual *one* thing, leading him to demote the universal. If a student presses, say: "In the *Categories*, essence wins. In the *Metaphysics*, particularity wins."

  ### Summary for the Classroom
  1.  **Primary Substance:** The individual (Socrates). The bedrock of reality.
  2.  **Secondary Substance:** The species/genus (Man/Animal). Real, essential, and ontologically independent (not "present in"), but dependent on primary substances for their existence.
  3.  **The Link:** Both Primary and Secondary substances share the feature of **not being present in a subject**. This distinguishes them from accidents.
  4.  **The Shift:** Later, Aristotle tightens the definition of substance to exclude universals entirely, but in this text, they are genuine, derivative substances.
