      *   *Metaphysics Z:* In *Metaphysics*, Aristotle becomes much stricter. Form is substance, matter is substance, but the universal *as universal* is often rejected as substance. The *Categories* is more Platonic-friendly regarding universals than *Metaphysics* Z.
      *   *Verdict:* The colleague is partially right about the "what is it" criterion, but wrong to imply it's *merely* linguistic or that it denies ontological status to secondary substances in the *Categories*. It's an ontological derivative status, not just a linguistic one.

