answer: |-
  There is no single canonical term in moral psychology or philosophy that captures precisely what you have described: the structural capacity of an emotion's "exit condition" to enable recidivism. However, your observation maps onto three distinct conceptual frameworks that, when overlaid, provide the name and the edges you are looking for.

  The closest existing label is **Moral Hazard**. Borrowed from economics and insurance, it describes a situation where an entity is more likely to take risks because it does not bear the full cost of those risks. In your team's culture, the apology mechanism functions as an insurance policy. Because the cost of the error is bounded (an apology and a repair plan) and the liability is discharged upon payment, the "premium" is low enough that repeating the error becomes a rational calculation. The emotion (guilt) is not failing; the *pricing structure* of the emotion is too favorable to the actor.

  The second framework is philosophical: **The Debt Model of Guilt**. This traces back to Nietzsche's *On the Genealogy of Morals*, but in contemporary ethics, it refers to the conception of wrongdoing as a quantifiable debt that can be repaid. Under this model, morality is a ledger. Once the debt is paid (the apology), the moral balance is restored, and the actor is free. This contrasts with what Bernard Williams, in *Shame and Necessity*, describes as the **Ontological Model of Shame**. In the shame model, the error reveals a flaw in the *substance* of the self, not just the ledger. There is no payment that fixes a cracked foundation; only reconstruction or concealment.

  The third framework is sociological: **Ritualism**. When a process (the apology) is repeated without achieving its intended transformative effect (behavioral change), it becomes a ritual. It serves a social function (restoring equilibrium) without serving a moral function (preventing harm).

  ### The Edges of the Phenomenon

  If we were to name this specifically, we might call it **Transactional Absolution** or **Bounded Liability**. For this dynamic to apply, three conditions must be true of the emotion:

  1.  **Fungibility:** The remedy must be exchangeable for the harm. (e.g., "I will work late" pays for "I missed the deadline.")
  2.  **Finality:** There must be a clear moment where the debt is considered settled.
  3.  **Addressability:** The object of the emotion must be specific and separable from the agent. (I *did* bad, not I *am* bad.)

  This explains why the dynamic does not extend to grief, anger at the dead, or aimless regret. Grief has no debtor to pay you; anger at the dead has no recipient to accept the payment; aimless regret has no specific act to repair. These emotions lack the *transactional architecture* required for a "settlement." They are states of being, not invoices. They linger because they cannot be discharged, which is why they do not produce the recidivism you see in your team.

  ### The Flaw in the Reasoning

  You ask where the reasoning goes wrong, specifically because it currently looks like an argument for preferring the "less decent" emotion (shame). The error lies in a false dichotomy: you are contrasting **Shame** (unbounded, preventative, toxic) with **Transactional Guilt** (bounded, permissive, decent).

  There is a third option, which is **Transformative Accountability**.

  The problem you are observing is not inherent to guilt; it is inherent to *closing the loop too quickly*. In your current system, the apology is the *end* of the process. In a robust guilt culture, the apology should be the *beginning* of a probationary period.

  Shame prevents error through the threat of identity death ("If I do this, I am worthless"). Transactional Guilt permits error through the mechanism of identity preservation ("If I do this, I am still worthy, provided I pay the fee"). Transformative Accountability prevents error through the mechanism of *trust erosion*.

  In your current model, trust is restored immediately upon apology. In the model you need, trust is decoupled from absolution. The act is acknowledged (guilt), the repair is made (guilt), but the *privilege of autonomy* is temporarily reduced. The exit condition for the emotion (feeling less guilty) is separated from the exit condition for the status (regaining full trust).

  ### Why This Is Not an Argument for Shame

  You worry that this analysis vindicates the old culture. It does not, for two reasons.

  First, shame's prevention mechanism is brittle. The colleague who is "ashamed" has not repeated the error, but she is "hardest to work with." Shame produces risk aversion, not competence. It encourages concealment of near-misses. In complex systems, hidden near-misses are catastrophic; they prevent the organization from learning where the fragility lies. Your guilt culture likely surfaces errors faster; that is a net gain, even if repetition occurs.

  Second, shame relies on a static view of the self (character is fixed). Guilt relies on a dynamic view (behavior is mutable). The repetition you see is not proof that guilt is ineffective; it is proof that the *consequences* attached to the guilt are insufficient to alter the behavior. If a speed camera fines you $10, you will speed repeatedly. The fine is a "guilt" mechanism (pay and settle). If the fine removes your license for a month, the behavior stops. The mechanism is the same (bounded liability); the *price* was wrong.

  ### Conclusion

  The phenomenon you have identified is **Moral Hazard applied to Emotional Accounting**.

  It covers any system where moral repair is commodified and final. It leaves out emotions that are non-transactional (grief, existential regret). It does not argue for shame; it argues that **guilt without consequence is merely a fee for service.**

  To fix it without reverting to shame, you must decouple *absolution* from *restoration*. Allow your team to feel guilt, allow them to apologize, allow them to repair the specific damage—but do not allow them to "settle the account" regarding their reliability. Let the apology close the emotional loop, but keep the procedural loop open until the behavior changes. That way, you keep the decency of discussing the act, but you remove the subsidy that makes repetition affordable.
