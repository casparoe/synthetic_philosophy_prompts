answer: |-
  ### Exam Question: The Anatomy of Analogy

  **Time:** 90 Minutes
  **Conditions:** Closed Book. No Internet.
  **Total Marks:** 20

  **Prompt:**
  Public discourse on AI safety frequently relies on three historical analogies: the Atomic Bomb, the Printing Press, and the Industrial Revolution. As discussed in class, these are often deployed as "vibes with a citation" rather than structural arguments.

  Your task is to construct a rigorous argument using *one* of these analogies, then dismantle it.

  **Instructions:**
  1.  **Select** one analogy (Bomb, Press, or Industry).
  2.  **Map** the analogy explicitly. Identify three structural features of the historical source case and specify exactly which feature of the AI target case they correspond to. State which features of the source case you are stipulating as *irrelevant*.
      *   *Example of explicit mapping:* "In the Bomb analogy, the feature 'requires state-level infrastructure' (Source) maps to 'requires massive GPU clusters' (Target). The feature 'radioactive fallout' (Source) is stipulated as irrelevant."
  3.  **Identify a Damaging Disanalogy.** Locate one difference between the source and target that does not just weaken the comparison but *breaks the inference*. If we accept this difference, the lesson from history no longer applies to AI.
  4.  **Classify the Claim.** State whether your disanalogy is **Empirical** (about timelines, actors, or physical constraints), **Conceptual** (about the nature of the technology or agency), or **Normative** (about what we are entitled to infer from past events).
  5.  **Conclude.** Explain why, given this disanalogy, the original policy prescription or risk assessment fails.

  **Constraint:** You are strictly forbidden from using the phrase "history does not repeat but it rhymes" or any variation thereof. This counts as a failure to engage with the prompt.

  ***

  ### Model Answer

  **Selected Analogy:** The Atomic Bomb

  **Structural Mapping:**
  To make the Atomic Bomb analogy work, we must map specific structural features rather than general feelings of doom.
  1.  **Dual-Use Potential:** The physics behind fission (Source) maps to the dual-use nature of foundational models (Target). Both can generate energy/utility or destruction.
  2.  **Threshold Effect:** The Trinity Test (Source) maps to the emergence of agentic capabilities (Target). In both cases, there is a distinct moment where the technology transitions from theoretical to operational.
  3.  **Centralisation:** The Manhattan Project (Source) maps to current frontier lab development (Target). Both rely on concentrated capital and specialised hardware.
  *Irrelevant Feature:* I stipulate that "radioactive fallout" (Source) is irrelevant. We are concerned with catastrophic risk, not environmental contamination mechanics.

  **The Damaging Disanalogy:**
  The inference usually drawn from the Bomb analogy is that existential risk can be managed through state-level non-proliferation treaties and hardware monitoring, because nuclear weapons required rare isotopes and massive state infrastructure.
  The damaging disanalogy is **Diffusibility of Competence**.
  In the nuclear case, the "knowledge" of the bomb was insufficient without the material supply chain (enriched uranium/plutonium). In the AI case, the "knowledge" (weights and architectures) is digital and potentially compressible. Once the capability exists in a frontier model, the risk of distillation into smaller, locally runnable models is non-zero.
  If we grant this disanalogy, the inference breaks: We cannot infer that IAEA-style monitoring of compute clusters will suffice for AI safety. The bottleneck for the Bomb was *material*; the bottleneck for AI is *information*.

  **Classification of Claim:**
  This is a **Conceptual** claim. It is not merely an empirical guess about timelines (e.g., "chips will get cheaper"). It is a claim about the ontological category of the risk. Nuclear risk is inherently tied to industrial supply chains; AI risk is inherently tied to information propagation. They are different *kinds* of security problems. Treating AI as a "munition" rather than a "message" is a category error.

  **Conclusion:**
  Because the bottleneck differs (material vs. informational), the policy prescription derived from the Bomb analogy (centralised containment) fails. The Bomb analogy suggests we can wait for the "Trinity moment" to regulate, because nothing dangerous could exist before then. The diffusibility disanalogy suggests that by the time the "Trinity moment" is publicly recognised, the capability may have already leaked into the open weights ecosystem. Therefore, relying on the Bomb analogy leads to a false sense of security regarding the window of opportunity for intervention. The structural feature of "centralisation" maps poorly because it is transient in AI in a way it never was in nuclear physics.

  ***

  ### Marking Scheme (Total: 20)

  **1. Explicit Structural Mapping (4 Marks)**
  *   **Criteria:** Student identifies three specific features and maps Source $\to$ Target clearly. Stipulates irrelevance.
  *   **Typical Failure:** Vague hand-waving (e.g., "Both are dangerous") without specifying *which* feature drives the danger.

  **2. Identification of the Inference (4 Marks)**
  *   **Criteria:** Student clearly states what conclusion the analogy is usually supposed to support (e.g., "Therefore we need an IAEA for AI").
  *   **Typical Failure:** Attacking the analogy without stating what policy or risk assessment the analogy was supposed to justify.

  **3. The Damaging Disanalogy (4 Marks)**
  *   **Criteria:** The difference identified must *break* the inference, not just weaken it. It must show why the historical lesson doesn't transfer.
  *   **Typical Failure:** Nitpicking surface details (e.g., "Nukes explode, AI doesn't") that don't impact the structural argument about risk management.

  **4. Classification of Claim (4 Marks)**
  *   **Criteria:** Correctly identifies the claim as Empirical, Conceptual, or Normative and justifies the label in one sentence.
  *   **Typical Failure:** Mislabeling a conceptual constraint as an empirical prediction (e.g., calling a category error a "timeline guess").

  **5. Adherence to Constraints (4 Marks)**
  *   **Criteria:** No "history rhymes" cop-outs. No bibliographic reliance. Follows the structure.
  *   **Typical Failure:** Using the forbidden "rhymes" phrase or citing specific authors (e.g., "As Bostrom says...") instead of reasoning.
