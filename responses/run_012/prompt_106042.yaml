answer: |-
  Here is the map of the case through Strawson's framework, followed by the analysis of the migration of resentment, the excuse/exemption collapse, and the limits of Strawson's project.

  ### 1. Mapping the Stances
  Your friend is correct on the basic mechanics, but the timeline matters.

  *   **The Defense & The Judge (Objective Attitude):** By accepting the "affluenza" argument, the court treated Ethan Couch not as a moral peer who chose evil, but as a broken object to be managed. In Strawson's terms, they suspended the participant attitude. They viewed him as psychologically incapacitated by his environment, requiring treatment (probation/therapy) rather than retributive punishment. They attempted to speak *for* the victims and the community in adopting this stance.
  *   **The Public & The Victims (Participant Attitude):** The public refused to let the court adopt the objective attitude on their behalf. They maintained the participant stance: Couch was a moral agent who engaged in a relationship of harm with the victims. The reactive attitudes (indignation, resentment, moral outrage) remained fully active.
  *   **The Outrage:** This confirms Strawson's central thesis: we cannot universally sustain the objective attitude toward those we consider members of the moral community. The public's refusal to accept the sentence proves that the participant attitude is the default setting of human society. You can try to override it institutionally, but the community will reassert it.

  ### 2. The Migration of Resentment
  This is where your friend's "vicarious resentment" label fails and your intuition holds.

  Your friend thinks the anger at the parents/judge is just displaced anger at Ethan (i.e., "I'm still mad about the deaths, but since I can't punch Ethan, I'll punch the judge"). You are arguing the anger is *about the excusing itself*.

  Strawson doesn't explicitly map "meta-resentment" (resentment about the handling of resentment), but his framework supports your view. Reactive attitudes are not just emotional reactions; they are the glue of the moral community. They signal what we demand of one another.

  When the court adopted the objective attitude, it didn't just let Ethan off; it violated the norms of the moral community. It told the public: *"Your demand for accountability is inappropriate here."* The public's response was not just "We want Ethan punished," it was "You have no right to suspend our attitudes."

  Therefore, the resentment migrated onto the **authority that mishandled the practice.**
  *   **Target:** The parents (for creating the incapacity), the psychologist (for legitimizing the excuse), the judge (for enacting the exemption).
  *   **Reason:** They became the agents responsible for corrupting the moral dialogue.
  *   **Strawsonian Fit:** This fits Strawson's idea that reactive attitudes are about the quality of will. The public perceived the *court's* quality of will as indifferent to the victims' standing in the moral community. The resentment isn't just vicarious; it is a defense of the practice of holding responsible. You are angry at the word "affluenza" because it is a tool used to break the link between action and consequence that holds society together.

  So, you are right: it is not merely vicarious resentment. It is indignation at the **usurpation of the community's right to hold responsible.**

  ### 3. Excuse vs. Exemption (The Watson Distinction)
  Gary Watson refined Strawson by distinguishing between **excuses** (I did it, but I wasn't fully responsible due to circumstances) and **exemptions** (I am not the kind of being who can be held responsible).

  *   **The Defense Strategy:** The "affluenza" defense tried to argue **Exemption**. They claimed Couch was so damaged by his upbringing that he lacked the capacity to understand consequences. He was, effectively, a child or psychologically incapacitated.
  *   **The Outcome:** The sentence (probation) functioned as an **Excuse**. He wasn't committed to a mental health facility (the standard outcome for exemption); he was let back into society with a slap on the wrist.
  *   **Your Intuition:** You feel it is neither. Here is why:
      *   It fails as an **Exemption** because Couch demonstrated moral agency in other areas (he chose to drink, he chose to drive). He wasn't globally incapacitated.
      *   It fails as an **Excuse** because an excuse admits the act was wrong but mitigates the blame. "Affluenza" suggested the act *wasn't really his fault* because he was a product of his environment, yet he kept the privileges of agency.

  It is a **category collapse.** The defense used an Exemption claim ("he can't help it") to secure an Excuse outcome ("he doesn't need prison"). This creates a moral monster: an agent who is responsible enough to walk free but irresponsible enough to avoid punishment. This is why it feels like "neither." It exploits the gap between the two categories to evade the demands of both.

  ### 4. Where Strawson is Silent
  You need to be honest here: **Strawson is descriptive, not normative.**

  *   **The Silence:** Strawson describes *how* our practices of responsibility work. He explains that we feel resentment when someone shows ill will, and we suspend it when someone is incapacitated. He does **not** provide a rulebook for deciding *which* incapacitations are real. He does not tell us whether "rich upbringing" counts as a valid exemption.
  *   **The Implication:** Using Strawson to argue for a specific sentence is a category error.
      *   Your friend cannot use Strawson to prove the probation was wrong, only to explain why people are angry about it.
      *   The Defense cannot use Strawson to prove the probation was right, only to explain that they attempted to shift the attitude from participant to objective.
  *   **The Verdict:** Strawson explains the *fuel* of the debate, not the *steering*. He tells us why the public is furious (the participant attitude was violated), but he offers no criteria to judge whether the judge *should* have adopted the objective attitude. That requires a normative theory of justice (retributive, restorative, utilitarian) that Strawson explicitly avoids providing.

  **Summary:**
  Your friend is right that Strawson explains the *mechanism* of the outrage (clash of attitudes). You are right that Strawson doesn't explain the *target* of the outrage (the corruption of the practice) or the *validity* of the excuse. The "affluenza" defense exploited a gap between excuse and exemption, and the public's resentment migrated to defend the integrity of the moral community itself. Strawson describes the fire, but he doesn't tell you who was right to light the match.
