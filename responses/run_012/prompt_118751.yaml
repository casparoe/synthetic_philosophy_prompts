          *   Followed by a section "What I was doing" (250-400 words) explaining the epistemic mechanics used.

  2.  **Deconstruct the Epistemic Mechanics:**
      *   *Mutual Knowledge vs. Common Knowledge:* I know X, you know X. But do I know that you know X? Do you know that I know that you know X? This infinite regress is crucial. Public announcement collapses this into common knowledge.
      *   *Backward Induction:* In a finite game with a known end, rational agents defect early because they know the other will defect at the end, so they defect before that, etc. This leads to suboptimal outcomes.
      *   *Team Reasoning:* Shifting the unit of agency from "I" to "We".
      *   *The "Creepy" Moment:* A public statement transforming mutual knowledge into common knowledge, forcing action.

  3.  **Brainstorming the Scenario:**
      *   *Setting:* A failing shop? A house sale? Let's go with a small business partnership dissolving. A bakery or a repair shop. Let's try a *laundromat*. It's mundane, has a clear end date (lease expiry), and involves routine maintenance/cooperation.
      *   *Characters:* Elias and Mara. Partners.
      *   *Conflict:* The lease is up in a month. The machine needs a expensive repair now to keep customers until the sale/end. If they both pay, it's fine. If one pays, the other free-rides. If neither pays, the business dies before they can sell the goodwill.
      *   *The Trap:* They both know the machine is broken. They both know they need to fix it to sell. They both know the other knows. But do they know the other knows *they* know?
      *   *The Backward Induction:* Lease ends in 30 days. If they fix it on day 29, it's useless. So day 28 is the last chance. But if day 28 is the last chance, the other won't contribute on day 28... so day 27... all the way to day 1.
      *   *The Team Reasoning:* One tries to shift to "What is best for the Shop?" vs "What is best for me given what they do?"
      *   *The Public Announcement:* They need to say "We are fixing this" out loud to lock it in.

