      *   **Specific Concepts:** Common knowledge vs. mutual knowledge (the ladder), backward induction (finite game defecting early), team reasoning (shifting from "what should I do" to "what should we do").
      *   **Requirements:**
          *   2,000 words or less.
          *   Tight beats baggy.
          *   Knowledge structure must be load-bearing (costs something real).
          *   Specific moment: Something said out loud changes the state without changing private facts (common knowledge creation).
          *   No lectures/professors explaining theory.
