answer: |-
  You have put your finger on a specific, documented paradox in the sociology of ritual and heritage studies, though it does not have a single, ubiquitous noun like "gravity" attached to it. You are describing a state where **historical veracity has been decoupled from ritual efficacy.**

  The closest established philosophical label for the *mindset* you are describing is **Second Naiveté** (or *Second Naïveté*), a term coined by the philosopher Paul Ricoeur. The closest sociological description of the *mechanism* is **Affective Authenticity** operating through **Collective Effervescence**.

  However, since you want the "carving"—the precise definition with edges drawn against similar concepts—here is how we distinguish this phenomenon from "Invented Tradition," "Nostalgia," and "Cynicism."

  ### The Name: Second-Order Tradition (or Second Naiveté)

  Ricoeur used "Second Naiveté" to describe a religious state: one passes through a "critical desert" (realizing the myth is not literally true) and emerges on the other side, not with cynicism, but with a renewed ability to hear the myth *symbolically*. You know the story isn't fact, but you accept it as truth nonetheless.

  Applied to your town procession, this is **Civic Second Naiveté**. It is a conscious, consensual agreement to treat a known fabrication as a valid vessel for community emotion.

  ### The Carving: Drawing the Edges

  To understand why this is distinct from the concepts you already know, we need to look at where the "truth" is located in each scenario.

  **1. Versus "Invented Tradition" (Hobsbawm & Ranger)**
  *   **The Standard Model:** When Hobsbawm wrote about "Invented Tradition," he focused on elites establishing continuity with a suitable historic past to legitimize institutions. The classic model implies a degree of **obfuscation**. The power relies on the participants *believing* (or assuming) the tradition is old.
  *   **Your Phenomenon:** The obfuscation has failed or been removed. Everyone knows it started in 1972. In standard "Invented Tradition" theory, this should weaken the ritual. In your case, it hasn't.
  *   **The Edge:** Standard Invented Tradition relies on *Historical Authenticity* (the claim of age). Your phenomenon relies on *Performative Authenticity* (the claim of the moment). The tradition is no longer a bridge to the past; it is a tool for the present.

  **2. Versus Sincere Historical Belief**
  *   **The Standard Model:** Participants believe the May Day procession dates to 1774. If you showed them the 1972 minutes, they would feel betrayed, angry, or foolish. The emotion is contingent on the lie.
  *   **Your Phenomenon:** Participants have seen the 1972 minutes. They feel no betrayal. The emotion survives the debunking.
  *   **The Edge:** In sincere belief, the history *causes* the emotion. In Second Naiveté, the community *causes* the emotion, and the history is merely the costume.

  **3. Versus Cynical Manipulation**
  *   **The Standard Model:** The parish council knows it's fake, the public knows it's fake, and everyone treats it as a hollow box-ticking exercise. The band plays, people walk, everyone is bored. It is "going through the motions."
  *   **Your Phenomenon:** You got a "lump in your throat." The committee gets "misty-eyed." The emotion is genuine, not feigned.
  *   **The Edge:** Cynicism acknowledges the falsity and rejects the feeling. Second Naiveté acknowledges the falsity and *accepts* the feeling. It is **Sincere Fabrication**.

  **4. Versus Nostalgia**
  *   **The Standard Model:** Nostalgia is a longing for a home that no longer exists or a time you cannot return to. It is often passive and melancholic (e.g., looking at old photos, lamenting the loss of the "old town").
  *   **Your Phenomenon:** This is active and generative. You are not longing for 1972; you are building something *now* using the materials of 1972.
  *   **The Edge:** Nostalgia looks backward and sighs. Second Naiveté looks at the "fake" artifact and says, "This works for us now." It is **Prospective**, not retrospective.

  ### Why It Works (The Mechanism)

  If it isn't the history doing the work, what is? You are experiencing what Émile Durkheim called **Collective Effervescence**.

  Durkheim argued that the power of ritual does not come from the gods or the history, but from the *assembly*. When a group synchronizes their movement (walking in a procession), their sound (the band), and their focus (the anniversary), they generate a psychological charge. That "lump in your throat" is the physiological response to social cohesion.

  The "1972" date is irrelevant to the biology of the ritual. The ritual creates the reality it describes. By walking the procession, you *make* the town a community, regardless of when the walk started. This is **Performative Truth**: the utterance (or action) creates the fact.

  ### How to Frame This for Your Committee

  Since you are organizing the anniversary, you do not need to hide the 1972 date, nor do you need to apologize for it. You can reframe the tradition using the logic of Second Naiveté.

  **Do not say:** "We know this is fake, but let's do it anyway."
  **Do say:** "This procession is a 50-year-old tradition of celebrating our 250-year history. It's a ritual we invented to keep ourselves connected, and it's worked for five decades."

  This shifts the value from **Antiquity** (how old is it?) to **Endurance** (how long has it served us?).

  ### Summary Definition

  If you need a label for your files, the most precise academic phrasing is **"Ritual Efficacy Independent of Historical Veracity."**

  But for your town, the definition is this:
  > A **Conscious Tradition** is a ritual practice where participants, fully aware of its recent or fabricated origins, continue to engage with it sincerely because the *social cohesion* it generates is experienced as more "true" than the *historical timeline* it claims to represent. It is distinct from deception because the falsity is known; distinct from cynicism because the emotion is felt; and distinct from nostalgia because it is an act of creation, not longing.

  You are not being fooled. You are participating in a social technology that works exactly as designed, even after you've read the manual. The lump in your throat is the real artifact; the 1972 date is just the packaging.
