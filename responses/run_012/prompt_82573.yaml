prompt: |-
  I am a software engineer with no formal philosophy background, and I run a monthly lunchtime discussion group for about ten engineers at my company; we have sixty minutes for the next session. I want to design an activity that makes us feel, rather than just hear about, the Pasadena paradox: a game can have perfectly well-defined probabilities for each possible outcome and still have no well-defined expected value, because the sum of the payoffs depends on the order in which the terms are added. The activity should have us actually play or simulate such a game, with small stakes or points, so that different ways of grouping or sequencing the outcomes yield different totals and we end up disagreeing about what the game is worth. Please give me your answer as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion: the setup and rules; the materials; the debrief that maps what happened onto the paradox; the predictable failure modes and how to handle them; and an honest note on what the activity cannot reproduce.
