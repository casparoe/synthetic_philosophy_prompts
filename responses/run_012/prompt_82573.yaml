  2. Print the tiles with clear fractions or decimals and provide each team with calculators or a shared spreadsheet to aggregate their specific summation strategy quickly. Scale the values by a factor of 100 so the differences between summation orders are visible within the 100-term limit.
  3. Reveal the differing totals to highlight how the same mathematical series yields different "expected values" solely based on summation order. Explain that this mirrors the Pasadena paradox, where the expected value equation is conditionally convergent rather than absolutely convergent.
  4. If participants argue that the finite sample size invalidates the paradox, remind them that the divergence grows logarithmically and would persist even with millions of rounds. Should arithmetic boredom set in, pre-calculate the sub-totals so the discussion focuses on the ordering logic rather than manual addition.
  5. Acknowledge that this simulation cannot reproduce the actual infinite series required for the mathematical proof, as you are limited to a finite number of cards. Admit that in reality, bounded utility functions or bankruptcy would prevent the paradox from manifesting in a physical casino.
