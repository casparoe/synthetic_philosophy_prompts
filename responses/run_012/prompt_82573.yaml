      *   The Pasadena game is a variant of the St. Petersburg paradox.
      *   In St. Petersburg, expected value is infinite ($\sum \frac{1}{2^n} 2^n = \sum 1 = \infty$).
      *   In Pasadena, the payoff alternates signs (positive and negative) such that the series $\sum \frac{(-1)^{n-1}}{n}$ (or similar conditionally convergent series) emerges when calculating expected value.
      *   Specifically, the expected value sum is conditionally convergent. By the Riemann series theorem, rearranging the terms changes the sum (can be any real number or diverge).
      *   Challenge for a 60-minute engineering group: You can't actually play an infinite game. You need to simulate the *effect* of conditional convergence through finite approximation or grouping strategies.
      *   Key insight for the activity: Divide the group into teams that calculate the "value" of the game using different ordering strategies on a fixed set of simulated outcomes.

  3.  **Drafting the Five Items:**

      *   *Item 1: Setup and Rules.*
          *   Need a game where outcomes have probabilities and payoffs that alternate signs and decrease in magnitude (like $1, -1/2, 1/3, -1/4...$).
          *   Since we can't play infinite rounds, we pre-generate a large list of outcomes based on the probability distribution.
          *   Teams calculate the total value using different summation orders.
          *   Draft: Divide into three teams and give each a identical deck of 100 cards representing game outcomes with alternating positive and negative point values that decrease in magnitude, such as +1, -1/2, +1/3, -1/4. Instruct Team A to sum the cards in natural order, Team B to group all positive cards before negative ones, and Team C to interleave them in a specific skewed ratio.

      *   *Item 2: Materials.*
          *   Cards or slips of paper.
          *   Calculators/Spreadsheets.
          *   Draft: Prepare three identical sets of 100 printed slips where each slip shows a probability weight and a corresponding payoff value derived from the alternating harmonic series. Provide each team with calculators or a shared spreadsheet to aggregate their specific summation strategy quickly.

      *   *Item 3: Debrief.*
          *   Connect the different totals to the mathematical concept.
          *   Explain that the "expected value" is undefined because the sum depends on ordering.
          *   Draft: Reveal the differing totals to highlight how the same set of outcomes yields different "expected values" solely based on summation order. Explain that this mirrors the Pasadena paradox, where the expected value equation is conditionally convergent rather than absolutely convergent.

      *   *Item 4: Failure Modes.*
          *   Engineers might say "just take the limit" or "it's finite so it doesn't matter."
          *   They might get bored with arithmetic.
          *   Draft: If participants argue that the finite sample size invalidates the paradox, remind them that the divergence grows logarithmically and would persist even with millions of rounds. Should arithmetic boredom set in, pre-calculate the sub-totals so the discussion focuses on the ordering logic rather than manual addition.

      *   *Item 5: Limitations.*
