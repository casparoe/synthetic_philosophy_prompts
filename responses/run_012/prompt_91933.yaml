answer: |-
  The requirements

  First, any adequate theory must maintain **Phenomenological Granularity**, distinguishing the intensity of an experience from its duration. The motivation is non-negotiable: a moment of extreme torture is phenomenologically distinct from an hour of mild irritation, and a theory that collapses these dimensions cannot capture the moral reality of suffering. This requirement demands that the value function treat intensity and duration as distinct variables, allowing for the possibility that high intensity cannot be normalized by short duration. Without this, the theory fails to describe the actual objects of moral concern.

  Second, the theory must specify the **Scope of Evaluation**, determining whether lexical ranking attaches to moments of experience or to whole lives. This is an artifact of one camp's commitments: lexical-threshold negative utilitarianism demands moment-level evaluation, whereas classical utilitarianism typically aggregates over lifetimes. For the lexicalist, this requirement demands that a single moment of threshold suffering renders a life不可compensable, regardless of surrounding pleasure. For the classical theorist, it demands that moments are merely inputs to a global sum. Adjudication requires deciding whether moral value inheres in temporal slices or narrative wholes.

  Third, the theory must satisfy **Continuity**, ensuring that small changes in physical or phenomenological inputs do not produce discontinuous jumps in value. This is generally considered non-negotiable for standard decision-theoretic treatments of value. It demands that there be no "lexical gaps" where an infinitesimal increase in pain suddenly outweighs all finite pleasure. This constraint prevents arbitrary breakpoints in the moral calculus, ensuring that the value structure mirrors the continuous nature of physical and phenomenological reality. Violating this invites charges of arbitrariness.

  Fourth, the theory must uphold **Transitivity** of preference and value ordering. This is a non-negotiable structural constraint on rationality. It demands that if outcome A is better than B, and B better than C, then A must be better than C. Without transitivity, decision-making becomes cyclical and action-guidance impossible. This requirement excludes views that rely on context-dependent valuations where the presence of a third option alters the ranking of the first two. It ensures the consistency required for any coherent moral theory to function as a guide for choice.

  Fifth, the theory must be **Action-Guiding under Empirical Uncertainty**. This is a non-negotiable requirement for any practical ethics. It demands that the theory provide verdicts when agents face non-zero probabilities of causing suffering, rather than requiring certainty. Specifically, it demands a rule for weighing a small probability of lexical suffering against a high probability of significant pleasure. If a theory implies that any non-zero risk of threshold pain vetoes all action, it fails this requirement by demanding impossibility. It must reconcile lexical priority with the probabilistic nature of the real world.

  Sixth, the theory must define a **Compensability Principle**, stating whether finite pleasure can offset suffering. This is an artifact of one camp's commitments: classical utilitarianism asserts compensability, while lexical negative utilitarianism denies it beyond a threshold. This requirement demands a clear boundary condition. For the classical theorist, it demands a exchange rate between pain and pleasure. For the lexicalist, it demands a proof that certain magnitudes of disvalue are immune to aggregation of value. This is the substantive core of the dispute, determining whether morality is a balancing scale or a constraint system.

  Fault lines

  The primary conflict arises between **Lexical Priority** and **Continuity**. If suffering lexically outweighs pleasure beyond a threshold, there must be a point where adding one more unit of pleasure fails to compensate for one more unit of pain. This creates a discontinuity in the value function, violating the Continuity requirement. To preserve lexicality, one must surrender the standard Archimedean axiom of decision theory, accepting that value space is not fully connected. The cost is a theory that posits moral "black holes" where standard aggregation fails. Conversely, to preserve Continuity, one must surrender lexicality, accepting that enough mild pleasure can theoretically offset extreme torture, a conclusion many find intuitively repugnant.

  A second fault line exists between **Lexical Priority** and **Action-Guidance under Uncertainty**. If lexical suffering outweighs all finite pleasure, and there is a non-zero probability of causing such suffering in almost any action, expected utility maximization may dictate absolute paralysis or fanaticism. To resolve this, the lexicalist must either surrender standard expected utility theory (adopting lexical probabilities) or surrender the strictness of the threshold (allowing risk trade-offs). The classical theoritor sacrifices the intuition that some harms are absolute; the lexicalist sacrifices the ability to use standard risk calculus. Both sides must modify standard decision theory to remain action-guiding, but the lexicalist faces a steeper cost in reconciling infinite disvalue with finite probabilities.

  The exclusionary requirement

  The single requirement that excludes the most otherwise plausible views is **Continuity**. While often treated as a neutral structural constraint, it functions as a substantive veto against any theory positing qualitative distinctions in value magnitude. It excludes lexical-threshold negative utilitarianism entirely, as lexicality necessitates a discontinuous jump in value. However, it also pressures classical utilitarianism into the "Repugnant Conclusion" and the "Torture vs. Dust Specks" paradox, forcing it to accept compensability intuitions that many find implausible. By demanding a smooth value surface, Continuity excludes any axiology that recognizes categorical moral boundaries, making it the most restrictive filter on plausible moral theories.
