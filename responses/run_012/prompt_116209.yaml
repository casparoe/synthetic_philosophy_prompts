  A silence that will never cease,
  Where nothing lives to call it brave.
  Nothing counts

  Pit joy against the steady sting,
  The bright high cost, the low dull fee.
  You say the song is not the thing,
  That delight holds no equity.
  Nothing

  So here the argument takes rest,
  No verdict carved in stone or dust.
  I leave the question unpossessed,
  Where meaning turns itself to rust.
   

  ***

  I'm taking a contested line on the second stanza (the "grave" analogy). Tranquilism usually argues for the *experience* of tranquility by a living subject, not the absence of the subject itself, so equating "absence of craving" with "absence of life" is a poetic stretch rather than a strict philosophical critique. I'm most confident I've got the first point (the paradox of wanting not to want) and the third point (the irrelevance of joy) right based on your description; the middle one is where I'm least sure I'm representing her view fairly, but it felt necessary to make the refrain's disappearance land.
