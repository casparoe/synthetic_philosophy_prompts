      *   *Nuance:* Make sure not to paint Descartes as a caricature. He isn't *just* looking for certainty; he's looking for truth. But the *method* is the key difference. Make sure not to paint Zhuangzi as a mystic devoid of logic; the logic of transformation is key.

  8.  **Final Polish:** (Reviewing against the prompt's constraints).
      *   "Do not give me a survey of the literature." -> Keep citations out.
      *   "I want the argument itself." -> Focus on reasoning.
