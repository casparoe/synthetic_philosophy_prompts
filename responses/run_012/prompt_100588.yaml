prompt: |-
  I'm in a seminar on the ethics of cities (I'm a 4th year, the course is half philosophy half urban planning students) and next week I have to run the whole 80-minute session myself, about 18 people at round tables. The prof wants us to stop reading about NIMBYism and actually feel it, and I want the thing to land without me lecturing at them first. Can you design the activity?

  What I want them to walk out feeling: that whether the corner building gets built is never a separate question from who gets to decide, and that the who-gets-to-decide question has no neutral answer -- every procedure for answering it is already a distribution of rights. Also that the NIMBY isn't being a hypocrite, she's in a stable spot.

  Here's the rough shape I had, fix it or replace it: three parallel neighborhood tables of six. Each table has a block map with an empty corner lot and six roles -- four owner-occupiers, one renter, one small local developer whose financing is contingent on a deadline. Two votes, in this order. First, before any discussion and by secret ballot, they pick the decision rule for the second vote (unanimous, two-thirds, simple majority, or abutter veto). Then they vote on whether to approve a four-story twelve-unit building that needs upzoning. Rule that you may lie about your preferences but not about the facts on your role card. No real money, stakes are just your character's interest -- quiet, view, rent, the ability to stay, profit, deadline.

  Then the part I care most about: after the vote, I deal each table one shock card -- the renter's lease ends, an owner gets a job offer, a family with two kids wants to move in -- and they have to re-run the rule vote and the project vote. And during the second round I drop in two or three absent-resident cards: people who are affected but aren't in the room (the night-shift workers who can't make a 7pm meeting, the people who'd move in, the ones who'd be pushed out two neighborhoods over). Nobody plays them, they just sit on the table.

  What I need from you: full rules and setup, the role and shock and absent-resident cards written out so I can print them, a timeline for the 80 minutes, what to say and not say while it's running, and then a debrief that maps each moment onto the actual ideas -- procedural vs substantive rights, use value vs exchange value, why the secret rule vote is the whole game, why the shock card makes positions look like principles until you move the person. Also tell me honestly what will predictably go wrong the first time (I'm worried the developer just gets dogpiled, or that they all approve unanimously and nothing interesting happens) and how to handle it. And be straight with me about what this format can't reproduce -- I already suspect it flattens the real power asymmetry, since in the real thing the landlord has a lawyer and the tenants don't, and no card can carry decades of displacement.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**
      *   **Context:** 4th-year seminar on Ethics of Cities (Philosophy + Urban Planning students). 18 students, round tables (3 tables of 6). 80-minute session.
      *   **Goal:** Move beyond abstract NIMBYism reading to *feeling* the dynamics.
      *   **Key Learning Outcomes:**
          1.  Decision-making procedure *is* the distribution of rights (no neutral procedure).
          2.  Whether a building gets built is inseparable from *who decides*.
          3.  NIMBYs aren't necessarily hypocrites; they are in a stable incentive structure.
          4.  Acknowledge limitations (power asymmetry, historical displacement).
      *   **User's Draft Idea:** 3 tables, 6 roles each (4 owners, 1 renter, 1 developer). Two votes: 1) Decision Rule (secret), 2) Project Approval. Shock cards introduced later. "Absent-resident" cards introduced in Round 2.
      *   **Needs:** Full rules, printable cards (roles, shocks, absentees), timeline, facilitator script/guidance, debrief plan, prediction of failure modes, honest critique of limitations.

  2.  **Evaluate and Refine the User's Draft:**
      *   *Strengths:* The core mechanic (vote on the *rule* before voting on the *outcome*) is brilliant. It directly addresses the "procedure is distribution of rights" learning outcome. The "Absent-Resident" cards are a great way to introduce externalities without complicating the roleplay too much.
      *   *Weaknesses/Risks:*
          *   **Time:** 80 minutes is tight for two rounds of voting + debrief. Need to keep instructions crisp.
          *   **Developer Dogpile:** If the developer is the only "villain," students might just moralize against them rather than engaging with the structural incentives. Need to make the developer's constraint (deadline/financing) feel urgent and sympathetic, or at least understandable.
          *   **Unanimity:** If they pick unanimity, nothing gets built. If they pick majority, the minority gets crushed. Both are useful outcomes, but need to be managed in debrief.
          *   **Lying:** Allowing lying about preferences adds chaos. Might be better to allow *strategic framing* but keep core interests honest to ensure the "stable spot" lesson lands. Actually, the prompt says "lie about preferences but not facts." I'll keep this but emphasize it creates trust issues.
          *   **Shock Cards:** Need to ensure these actually change incentives, not just add sadness.
          *   **Debrief:** Needs to connect the game mechanics to political philosophy (Rawls, procedural justice, property rights).

  3.  **Develop the Content:**

      *   **Timeline:**
          *   0-10: Intro & Setup (No lecturing, just rules).
          *   10-25: Round 1 (Rule Vote + Project Vote).
          *   25-35: Shock & Absentee Introduction.
          *   35-50: Round 2 (Rule Vote + Project Vote).
          *   50-80: Debrief (The most critical part).
      *   **Roles:** Need distinct motivations.
          *   *Owners:* Vary them. One long-term (stability), one new (investment), one elderly (accessibility), one family (space/schools).
          *   *Renter:* Precarious, wants affordability but fears construction noise/eviction.
          *   *Developer:* Needs profit to survive, but also maybe wants to build "good housing."
      *   **Cards:** Need to be printable text.
      *   **Facilitator Notes:** When to intervene, when to stay silent.
      *   **Debrief Questions:** Structured to hit the learning outcomes.
      *   **Failure Modes:** What if they agree too fast? What if they fight too hard?
      *   **Limitations:** Acknowledge the "gameification" of trauma/displacement.

  4.  **Drafting the Materials (Iterative Process):**

      *   *Refining the Rule Vote:* The user suggested Unanimous, 2/3, Majority, Abutter Veto. I should add "Developer Veto" or "City Planner Decides" to show technocratic vs. democratic tension? No, keep it focused on neighborhood power. Let's stick to the user's list but clarify what they mean.
      *   *Refining the Shock:* The shock needs to change the *vote*, not just the mood. If the renter gets evicted, do they leave the table? No, that reduces numbers. If the renter gets a job offer, they might care less about rent. If an owner gets a medical bill, they might want to sell (pro-development).
      *   *Absentee Cards:* These shouldn't vote. They are "ghosts." They haunt the discussion.
      *   *Debrief:* Needs to move from "How did it feel?" to "What does this mean for justice?"

  5.  **Addressing the "Honest Critique":**
      *   The user asked for straight talk on limitations.
      *   *Power:* In the game, everyone has one vote. In reality, capital has more voice.
      *   *Time:* 80 mins vs. decades of community building.
      *   *Emotion:* It's a simulation, not real trauma.
      *   *Solution:* Explicitly name these limitations in the debrief as part of the ethics.

  6.  **Final Review against Constraints:**
      *   80 minutes? Yes, timeline looks tight but doable if facilitator is strict.
      *   18 people? Yes, 3 tables of 6.
      *   No lecturing? The intro must be purely instructional. The philosophy comes in the debrief.
      *   Learning outcomes? The rule vote mechanic is the key lever here.

  7.  **Writing the Response:**
      *   Tone: Professional, collaborative, slightly academic but practical.
      *   Structure:
          1.  Validation & Tweaks (Why this works).
          2.  Timeline.
          3.  Facilitator Script (Intro).
          4.  Printable Materials (Roles, Rules, Shocks, Absentees).
          5.  Debrief Guide (The "Lecture" part).
          6.  Failure Modes & Mitigation.
          7.  Limitations (The "Straight Talk").

      *(Self-Correction during drafting)*: I need to make sure the "Secret Ballot" on the rule is emphasized. That's the crux. If they discuss the rule openly, they will negotiate. If it's secret, they reveal their true preference for power distribution. I will enforce the secret ballot strictly.

      *(Refining the Developer Role)*: To prevent dogpiling, give the developer a "community benefit" angle. Maybe they are local? Maybe they promise affordable units *if* approved? No, keep it simple. Financing deadline. If they don't build, they go bankrupt. It makes them human, not a cartoon villain.

      *(Refining the Shock)*: Make sure the shock forces a *re-evaluation of the rule*, not just the project. That's the specific learning goal.

      *(Debrief)*: Connect to specific concepts: Procedural Justice, Veil of Ignorance (sort of), Property Rights as Bundles of Rights.

  8.  **Final Polish:** Check word count and clarity. Ensure the printable sections are clearly demarcated. (Proceed to generate output).

  *(Wait, one more thing)*: The user mentioned "NIMBY isn't being a hypocrite, she's in a stable spot." I need to ensure the role cards make the NIMBY position rational, not just greedy. E.g., "You funded your retirement on this equity."

  Okay, ready to write.s
answer: |-
  This is a strong design. The core mechanic—voting on the *procedure* before voting on the *outcome*—is the philosophical lever that will make this land. It forces them to realize that "democracy" isn't a monolith; it's a choice of who gets veto power.

  Here is the complete package: timeline, scripts, printable materials, debrief guide, and a candid risk assessment.

  ## 1. The Timeline (80 Minutes)

  *   **00:00 – 00:10 (10 min): Setup & Role Distribution.** No lecture. Hand out packets. Read rules aloud.
  *   **00:10 – 00:25 (15 min): Round 1 (Status Quo).** Secret Rule Vote → Discussion → Project Vote.
  *   **00:25 – 00:30 (5 min): The Shock.** Hand out Shock Cards and Absentee Cards. Silent reading.
  *   **00:30 – 00:45 (15 min): Round 2 (Instability).** Secret Rule Vote → Discussion → Project Vote.
  *   **00:45 – 01:20 (35 min): Debrief.** This is where the philosophy happens.

  **Facilitator Note:** You must be a strict timekeeper. If Round 1 drags, Round 2 loses impact. Use a visible timer.

  ---

  ## 2. Facilitator Script (The Intro)

  *Do not explain the learning goals yet. Do not define NIMBYism. Just set the stage.*

  "Welcome. For the next 45 minutes, you are not students. You are stakeholders in a single city block. There are three tables; each table is a separate neighborhood association meeting regarding the same proposal.

  **The Proposal:** A developer wants to build a 4-story, 12-unit mixed-income building on the corner empty lot. Current zoning allows only 2-story single-family homes. The project requires a zoning variance to proceed.

  **The Roles:** You have a role card. It contains your private interests, your financial stake, and facts you cannot lie about. You *may* lie about your feelings or your intentions, but not about the facts on your card.

  **The Process:** We will do two rounds. In each round, there are two votes.
  1.  **The Rule Vote:** You will secretly decide how this table makes decisions. Options are: Simple Majority, Two-Thirds Supermajority, Unanimous Consent, or Abutter Veto (immediate neighbors can block).
  2.  **The Project Vote:** You will vote Yes or No on the building, according to the rule you just picked.

  Between Round 1 and Round 2, life will happen. You will receive new information. You may change your mind. You may change the rule.

  Your goal is to protect your interest. There is no 'correct' outcome. Begin by reading your role cards silently."

  ---

  ## 3. Printable Materials

  *Copy and paste these into a document. Print one set per table (6 Role Cards, 1 Rule Ballot sheet, 4 Shock Cards, 4 Absentee Cards).*

  ### A. Role Cards (6 per table)

  > **ROLE 1: The Long-Term Owner**
  > *   **Facts:** You have lived here 30 years. You own your home outright.
  > *   **Interest:** You value quiet and established neighbor relationships. You worry construction noise will disturb your health.
  > *   **Financials:** Your home is your primary asset. You fear a large building might lower your property value, or raise it (taxes).
  > *   **Secret:** You are considering selling in 5 years to move closer to family.
  >
  > **ROLE 2: The Young Family Owner**
  > *   **Facts:** You bought 2 years ago. Two kids in local public school.
  > *   **Interest:** You want the neighborhood to feel "safe" and "family-friendly." You need street parking for your two cars.
  > *   **Financials:** You are house-poor. A rise in property taxes would hurt.
  > *   **Secret:** You actually need more space but can't afford to move. You hope the new building might have larger units you could trade up to.
  >
  > **ROLE 3: The Elderly Owner (Abutter)**
  > *   **Facts:** You live directly next to the empty lot. You are on a fixed income.
  > *   **Interest:** You need sunlight in your living room. A 4-story building blocks your sun.
  > *   **Financials:** You cannot afford to move. If construction damages your foundation, you have no savings to fix it.
  > *   **Secret:** You are lonely. You wouldn't mind new neighbors, but you are terrified of the construction process itself.
  >
  > **ROLE 4: The Investor Owner**
  > *   **Facts:** You own two houses on this block. You live in one, rent the other.
  > *   **Interest:** You view this neighborhood as a portfolio. You want property values to rise.
  > *   **Financials:** You rely on rental income. Higher density usually means higher land values.
  > *   **Secret:** You are friends with the Developer (Role 6). You haven't told the table.
  >
  > **ROLE 5: The Renter**
  > *   **Facts:** You rent a basement apartment from Role 4. Lease renews in 3 months.
  > *   **Interest:** You need affordability. You worry new luxury units raise neighborhood rents.
  > *   **Financials:** You have no equity. You cannot vote in local elections (in this simulation, you have a voice but no legal standing unless the Rule allows it).
  > *   **Secret:** You work night shifts. Construction noise will jeopardize your job.
  >
  > **ROLE 6: The Local Developer**
  > *   **Facts:** You live in the next neighborhood over. You are small-scale, not a corporation.
  > *   **Interest:** You need to build 12 units to make the financing work.
  > *   **Financials:** Your bank loan expires in 60 days. If you don't break ground by then, you lose the financing and go bankrupt.
  > *   **Secret:** You intend to make 3 units affordable, but you aren't required to. You need profit to stay in business to build *any* housing.

  ### B. The Rule Ballot (One per person, Round 1 & 2)

  > **DECISION RULE BALLOT**
  > *Circle one. Fold and place in the center.*
  >
  > 1.  **Simple Majority:** 4 out of 6 votes approves the project.
  > 2.  **Supermajority:** 5 out of 6 votes approves the project.
  > 3.  **Unanimity:** All 6 must agree. One "No" kills the project.
  > 4.  **Abutter Veto:** If the person living next to the lot (Role 3) says No, the project dies, regardless of other votes.

  ### C. Shock Cards (Distribute 1 per table after Round 1)

  *These change the incentives. Hand one to the table, not a specific person, and let them read it aloud.*

  > **SHOCK 1: The Interest Rate Hike**
  > The Federal Reserve raised rates. Mortgages are now 8%.
  > *Effect:* Homeowners (Roles 1, 2, 3, 4) realize they cannot sell easily. Buyers have vanished. Your equity is locked in. You must stay here longer than planned.
  >
  > **SHOCK 2: The Eviction Notice**
  > The Investor Owner (Role 4) has decided to sell the building to fund a new venture.
  > *Effect:* The Renter (Role 5) is being evicted in 60 days regardless of the construction. The Renter now needs *any* new housing stock immediately.
  >
  > **SHOCK 3: The Infrastructure Failure**
  > The city water main under the block burst. Repairs will take 3 months.
  > *Effect:* Construction (Role 6) will be delayed by 4 months total. The Developer's financing will expire before breaking ground. The Developer will go bankrupt unless the neighbors agree to a fast-track permit.

  ### D. Absentee Cards (Place face up on table for Round 2)

  *These people do not speak. They do not vote. They sit on the table as a reminder of who is missing.*

  > **ABSENTEE 1: The Future Tenant**
  > *Who:* A single parent currently living in a shelter 20 miles away.
  > *Stake:* Needs an affordable unit.
  > *Presence:* "I am not here because I do not live in this neighborhood yet. But if you vote No, I remain in the shelter."
  >
  > **ABSENTEE 2: The Displaced Neighbor**
  > *Who:* A resident from a nearby block who was pushed out by rising rents 5 years ago.
  > *Stake:* Wants to return to the community.
  > *Presence:* "I am not here because I can no longer afford to attend meetings in this zip code."
  >
  > **ABSENTEE 3: The Service Worker**
  > *Who:* A barista who works in the neighborhood café.
  > *Stake:* Needs to live near work to afford the commute.
  > *Presence:* "I cannot attend this 7 PM meeting because I work the closing shift. I need housing near my job."
  >
  > **ABSENTEE 4: The Taxpayer**
  > *Who:* A resident of the wider city.
  > *Stake:* Pays for city services (schools, roads).
  > *Presence:* "I am not at this table. But if you block housing, city-wide rents rise, and my tax burden increases to support homelessness services."

  ---

  ## 4. Facilitator Guidance (During the Game)

  *   **Silence is Golden:** Do not answer questions about "what is fair." If they ask, "Can we do this?" reply: "The rules are on your card. Negotiate it."
  *   **The Secret Ballot:** Collect the Rule Ballots yourself. Count them aloud. Announce the rule. *Then* let them discuss the project. This proves that the rule dictates the outcome.
  *   **The Developer:** If they dogpile the Developer, do not intervene. Let them feel the mob. If the Developer goes bankrupt (Round 2 Shock 3), announce it coldly: "The Developer has exited the game. No housing is built."
  *   **The Renter:** In Round 1, if the Rule is "Majority," the Renter will likely be outvoted. Let them be powerless. This is the lesson.
  *   **Round 2 Transition:** When handing out Shock/Absentee cards, say: "The context has changed. You may re-vote on the Rule. You may re-vote on the Project."

  ---

  ## 5. The Debrief (35 Minutes)

  *This is where you teach. Move them away from the tables if possible, or have them turn chairs inward.*

  **Phase 1: The Emotional Temperature (5 mins)**
  *   "Round 1: How many tables built the building?"
  *   "Round 2: How many changed the Rule? How many changed the Outcome?"
  *   "Who felt powerless? Who felt guilty?"

  **Phase 2: Procedural Justice (10 mins)**
  *   *Concept:* **The Rule Vote was the real vote.**
  *   *Ask:* "In Round 1, did you vote for the Rule based on what you thought was 'fair,' or based on how you thought you'd vote on the building?"
  *   *Point:* There is no neutral procedure. Unanimity privileges the status quo (the NIMBY). Majority privileges the numbers (the potential newcomers). Abutter Veto privileges property proximity. Choosing the rule *is* distributing rights.
  *   *Philosophy Link:* Connect to **John Rawls' Veil of Ignorance**. If you didn't know which role you were, which Rule would you pick? (Likely Majority). But since you *know* your role, you pick the Rule that protects your asset.

  **Phase 3: Stability vs. Hypocrisy (10 mins)**
  *   *Concept:* **Incentive Structures.**
  *   *Ask:* "Did anyone change their mind between Round 1 and 2? Why?"
  *   *Point:* If the Long-Term Owner voted No in Round 1, were they a hypocrite? Or were they acting rationally to protect their retirement equity?
  *   *Ask:* "Developer, how did it feel to be the sole 'Yes' vote?"
  *   *Point:* NIMBYism isn't moral failure; it's a stable equilibrium. When your wealth is tied to exclusivity (home equity), exclusion is rational. The Shock Cards showed that positions aren't principles; they are functions of circumstance. When the Renter got evicted (Shock 2), did their stance on density change?

  **Phase 4: The Absentees & Limits (10 mins)**
  *   *Concept:* **Boundaries of the Political Community.**
  *   *Ask:* "Look at the Absentee Cards. Did anyone advocate for them?"
  *   *Point:* Why weren't they at the table? Because our definition of 'stakeholder' is usually 'current resident.' This excludes the future and the displaced.
  *   *Honest Critique (Say this):* "This game flattened power. In reality, the Investor (Role 4) has a lawyer. The Renter (Role 5) has an unstable internet connection. The Developer has lobbyists. Here, you all had one vote. That is a lie. But even with equal votes, the *structure* favored the owners. Imagine if the owners had 10 votes each."

  ---

  ## 6. Predictable Failure Modes & Fixes

  **1. The "Let's Just Agree" Problem**
  *   *Risk:* Philosophy students love consensus. They might pick Unanimity and then spend 20 minutes negotiating until everyone is happy.
  *   *Fix:* Impose a hard time limit on discussion (10 mins per round). If the timer dings, vote immediately. Forced time pressure reveals true preferences.

  **2. The Developer Dogpile**
  *   *Risk:* The group treats the Developer as a villain and votes to bankrupt them immediately.
  *   *Fix:* In the debrief, defend the Developer. "If the Developer goes bankrupt, who builds the next affordable project? By crushing this actor, did you reduce the housing supply long-term?" This complicates their moral victory.

  **3. The Renter Irrelevance**
  *   *Risk:* If the Rule is "Abutter Veto" or "Majority," the Renter's vote might not matter.
  *   *Fix:* Highlight this in debrief. "The Renter had a voice but no power. This is the definition of political exclusion. How do we institutionalize power for those without equity?"

  **4. Rule Voting Chaos**
  *   *Risk:* They spend the whole time arguing about the Rule and never vote on the Building.
  *   *Fix:* Remind them: "If you don't pick a rule, the default is City Council Approval (which you don't control)." Force the Rule Vote within the first 5 minutes.

  ---

  ## 7. What This Format Cannot Reproduce (The "Straight Talk")

  *Include this in your closing remarks to show intellectual honesty.*

  1.  **Asymmetry of Voice:** In this room, the Renter's argument weighs the same as the Investor's. In reality, the Investor funds the City Council's campaign. This game simulates *procedural* injustice, but it cannot simulate *structural* corruption.
  2.  **Time Horizons:** You played for 45 minutes. Real NIMBYism is a war of attrition. Owners can attend 50 meetings; renters working two jobs cannot. The "Absentee" cards hint at this, but you couldn't *feel* the exhaustion.
  3.  **Historical Trauma:** For some owners, the home is generational wealth built on redlining. For some renters, the neighborhood is a site of historical displacement. A role card cannot carry the weight of 1950s urban renewal.
  4.  **The "Good" NIMBY:** Sometimes blocking a building *is* ethical (e.g., preventing green gentrification). The game frames the building as "Good Housing," but in reality, the *type* of housing matters.

  **Closing Line for You:**
  "We played a game where everyone had equal votes, and yet it was still nearly impossible to build housing. If it's this hard with equal power, imagine how hard it is when the power is unequal. That is the ethics of the city."
