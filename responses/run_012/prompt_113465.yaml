answer: |-
  The clink of silverware had subsided, leaving the low hum of the dinner party in the background. Maya swirled her wine, looking across the table at Jonah.

  "So," Maya said, "you're still stuck on the vegetarian example? It's simple arithmetic. I value animal suffering less than you value your steak. You value your steak less than I value animal suffering. We swap. Total suffering goes down. Total satisfaction goes up. Why is that morally rotten?"

  Jonah leaned back, napkin on his lap. "Because it treats moral commitments like coupons. If I'm a vegetarian because I believe killing animals is *wrong*, not just 'suboptimal,' then I can't logically agree to kill one on Sunday so you don't kill one on Monday. That's not a trade; it's a contradiction. I'm saying killing is impermissible, then acting as if it's purchasable."

  "But you're already purchasing it," Maya countered. "Every time you choose to buy coffee instead of donating that twenty dollars to malaria nets, you're trading a life for a latte. We trade values internally every day. Moral trade just externalizes the market. It admits that we have different marginal utilities for different moral acts."

  "Internal deliberation isn't a market," Jonah said sharply. "When I weigh my comfort against a duty, I'm testing my integrity. I'm asking, 'Can I live with myself if I do this?' When you turn that into a trade with someone else, you're asking, 'What's the exchange rate?' That shifts the locus of morality from the agent's character to the transaction's outcome. It changes what the commitment *is*."

  "Okay, but let's distinguish," Maya said, leaning forward. "There's a difference between what I'd call thin and thick trades. A thin trade is when we share a currency. Say we both agree welfare is what matters. I hate fundraising, you hate canvassing. We swap tasks. That's just coordination. A thick trade is when our currencies differ—like the deontologist trading a rights violation for a utilitarian's welfare gain. You're conflating the two."

  "I'm not conflating them; I'm saying the logic of trade inevitably thickens," Jonah replied. "Even in your thin trade, if we're swapping tasks based on preference, we're implicitly admitting that the moral act itself has no intrinsic weight, only instrumental value. But look at the thick trade. That's the real test. If a deontologist agrees to violate a right because a utilitarian promises to save lives elsewhere, the deontologist has ceased to be a deontologist. They've admitted rights are fungible. They've been colonized by the utilitarian metric."

  "So what's the alternative?" Maya pressed. "Dogmatism? If I care deeply about X and lightly about Y, and you're the reverse, refusing to trade means we both walk away with less of what we value morally. You're privileging the purity of the agent over the actual state of the world. If the world is better because we traded, why does it matter if your hands are cleaner?"

  "Because morality isn't just about world-states," Jonah said. "It's about who we are. If I sell my commitment, I'm not keeping it; I'm monetizing it. A promise you're willing to sell stops being a promise. It becomes a conditional preference. And once you establish that mechanism—that moral acts are negotiable assets—you can't contain it to thin trades. People don't actually share currencies, Maya. Almost every trade is thick because everyone's moral framework is slightly unique. If you normalize the trading mechanism, you normalize the idea that nothing is sacred, only priced."

  Maya paused, tracing the rim of her glass. "I see the risk. If I treat my commitment to honesty as something I can breach for 'credits' elsewhere, I might erode my own reliability. But isn't that a risk of *weakness*, not trade? If I genuinely value the truth less than the welfare gain in a specific instance, isn't honesty just a heuristic? Refusing to trade feels like refusing to help. If I can save a life by doing something you care about, and you do something I care about in return, refusing because it feels like 'haggling' seems like moral vanity."

  "Maybe," Jonah conceded slightly. "Coordination on shared goals—your thin trade—is fine. That's just division of labor. But the moment the trade relies on us valuing the *acts themselves* differently because of divergent frameworks, you're not cooperating. You're negotiating a ceasefire between incompatible religions. And in that negotiation, one side usually loses its soul."

  "But if the soul is preserved while the world burns?" Maya asked. "Look, I'll grant you this: Thick trades are dangerous. If I trade away a right, I might undermine the normative force of rights in my own mind. I might become the kind of person who sees rights as negotiable. So, maybe thick trades require a firewall. You can trade the *action*, but you have to publicly maintain the *principle*."

  Jonah shook his head. "That's hypocrisy. And you know it corrodes trust faster than honesty."

  "Okay," Maya sighed. "Maybe you're right about the thick cases. If the trade requires me to act against my core framework, I'm not just swapping tasks; I'm admitting my framework was too rigid. That's ideological shift, not trade. So I'll concede: Thick moral trade is incoherent. It's just one person converting to the other's view temporarily, which undermines the integrity of both."

  "And thin trades?"

  "Thin trades are just coordination," Maya admitted. "If we share the metric, we're not really trading moral commitments; we're optimizing a shared project. The 'moral trade' label is misleading there. It's not haggling over values; it's logistics."

  "So the rabbit hole empties out," Jonah said, smiling faintly. "There's no market for morals. There's just collaboration among allies, and stubbornness among strangers."

  "Maybe," Maya said, raising her glass. "But I still think the vegetarian should eat the steak if it stops you from buying one. Even if it feels like selling out."

  "And I think," Jonah clinked his glass against hers, "that if she does, she's no longer a vegetarian. She's just a customer."
