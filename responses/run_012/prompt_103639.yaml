answer: |-
  ### The procedure at a glance

  1. Verify prima facie evidence exists for the accused's misconduct.
  2. Identify any unresolved misconduct by the complainant.
  3. Is the complainant's misconduct the same specific type? (Yes/No)
  4. Is the complainant's misconduct ongoing or uncorrected? (Yes/No)
  5. If Yes/Yes: Complainant lacks personal standing.
  6. If lacks standing: Does the issue threaten Institute integrity? (Yes/No)
  7. If Yes: Committee adopts case; complainant becomes anonymous source.
  8. If No: Dismiss complaint; log reason formally.
  9. If No/No on 3/4: Proceed to standard investigation.
  10. Chair signs standing logic; Committee votes factual findings.

  ### Step by step

  **Step 1: The Fact Check (Prima Facie)**
  Before worrying about who is speaking, ask: "If this evidence were presented in court, would it require a response?" You are not deciding guilt here. You are deciding if the accusation is empty noise or a potential violation.
  *   *Sufficient Answer:* "Yes, there is a document/email/image that, if authentic, violates policy."
  *   *Termination:* If No, dismiss immediately as frivolous. Stop.
  *   *Note:* This separates the *warrant* (the evidence) from the *standing* (the person).

  **Step 2: The Mirror Check (Complainant's Record)**
  Ask: "Does the complainant have a known, unaddressed violation of research integrity?" Check your logs. If the committee ignored a similar case involving them previously, note that.
  *   *Sufficient Answer:* A specific finding or admitted error on record. General rumors do not count.
  *   *Note:* This is where you catch the "look who's talking."

  **Step 3: Specificity (Same Type?)**
  Ask: "Is the complainant's sin the same specific rule as the accused's?"
  *   *Sufficient Answer:* "Yes, both are authorship disputes" or "No, one is data fabrication, the other is HR harassment."
  *   *Distinction:* A sinner in data fabrication has no standing to accuse another of data fabrication. They *do* have standing to accuse someone of harassment. Hypocrisy blocks the specific charge, not all charges.
  *   *Termination:* If No (different types), proceed to Step 9 (Standard Investigation).

  **Step 4: Timing (Resolved?)**
  Ask: "Has the complainant corrected their own error?"
  *   *Sufficient Answer:* "Yes, they retracted/corrected/ apologized formally" vs. "No, they are still using the bad data/practice."
  *   *Distinction:* A reformed sinner has standing. A continuing sinner does not. This distinguishes the hypocrite from the imperfect saint.
  *   *Termination:* If Yes (resolved), proceed to Step 9 (Standard Investigation).

  **Step 5: The Standing Block**
  If Step 3 and 4 are both "Yes" (Same Type AND Ongoing), the complainant lacks personal standing. Their complaint is functionally a confession.
  *   *Action:* Do not validate their moral authority. Do not let them claim victory if the accused is found guilty.

  **Step 6: The Institutional Interest**
  Ask: "Does this violation harm the Institute regardless of who reported it?" (e.g., risk to funding, safety, legal liability, reputation).
  *   *Sufficient Answer:* "Yes, fabrication risks grant fraud" vs. "No, this is a minor interpersonal squabble."
  *   *Note:* This is where the Committee's own past matters. If the Institute ignored this same issue 8 years ago (as you admitted), your institutional standing is weak. You need stronger evidence of harm to proceed now than you would have then.

  **Step 7: Committee Adoption (The "Own Motion" Clause)**
  If Step 6 is Yes (High Harm): The Committee takes the case over.
  *   *Operational Move:* The complaint is re-filed as "Committee Review." The original complainant is listed as an anonymous source in internal files, not as a party in the report. The report reads: "The Committee identified..." not "Dr. X alleged..."
  *   *Why:* This preserves the truth (the misconduct is investigated) without validating the hypocrite (they don't get to wield the gavel).

  **Step 8: Dismissal**
  If Step 6 is No (Low Harm): Dismiss the complaint.
  *   *Operational Move:* Send a letter: "While the allegation is serious, given the current record of all parties, this does not meet the threshold for formal inquiry." Do not mention the hypocrisy explicitly in the external letter to avoid libel; keep that logic in the internal minutes.

  **Step 9: Standard Investigation**
  If standing is clear (Steps 3/4 were No), run your normal fact-finding process. The complainant's past sins are irrelevant to the truth of the current claim.

  **Step 10: Sign-Off and Reflection**
  The Chair (you) signs the section explaining why the case was accepted or dismissed on standing grounds. The Committee votes on the factual findings.
  *   *Institutional Penitence:* Once a year, the Committee must review its own log of dismissed cases. If you see a pattern of ignoring a specific violation (like your 8-year-old case), you must issue a corrective policy statement to regain institutional standing.

  ### Three cases run through it

  **Case 1: The Notebook Shambles (Your current headache)**
  *   **Facts:** Group A (messy records) complains Group B (messy records) cannot verify data.
  *   **Run:** Step 1 (Yes, verification is impossible). Step 2 (Yes, Group A is also messy). Step 3 (Yes, both record-keeping). Step 4 (Yes, both ongoing). Step 5 (Group A lacks standing). Step 6 (Yes, data integrity threatens Institute). Step 7 (Committee adopts case).
  *   **Outcome:** You investigate Group B, but the report says "Committee Review," not "Group A Complaint." You fix Group B's data, and you separately cite Group A for their own record-keeping violations. Both get sanctioned; the hypocrite doesn't win.

  **Case 2: The Gift Authorship**
  *   **Facts:** Prof A (gives gifts to students) complains Prof B (padding list with colleagues).
  *   **Run:** Step 3 (Yes, both authorship abuse). Step 4 (Yes, both ongoing). Step 5 (Prof A lacks standing). Step 6 (Yes, authorship fraud risks funding/reputation). Step 7 (Committee adopts case).
  *   **Outcome:** You investigate Prof B. Prof A is not named as the accuser in the final report. However, because the Committee now has knowledge of Prof A's gifts (from the complaint), you must open a separate file on Prof A. You cannot know about a sin and ignore it without losing your own standing.

  **Case 3: The Toxic Whistleblower (The one you'll dislike)**
  *   **Facts:** A postdoc who is universally disliked and once falsified a travel reimbursement (admin fraud, corrected) accuses a popular Senior Prof of data fabrication.
  *   **Run:** Step 2 (Yes, past fraud). Step 3 (No, admin fraud ≠ data fabrication). Step 4 (Yes, corrected). Step 9 (Proceed to Standard Investigation).
  *   **Outcome:** The procedure forces you to investigate the Senior Prof. You will feel uneasy because the messenger is toxic. You might wish to dismiss this to keep peace. But because the *types* of misconduct differ and the postdoc's sin was resolved, their standing holds. The procedure protects the truth from your personal dislike of the messenger.

  ### Where this is judgment in a lab coat

  This procedure looks mechanical, but three steps require human judgment that cannot be automated. First, **Step 3 (Specificity)**: Determining if two sins are the "same type" is interpretive. Is padding an author list the same as gift authorship? A lawyer might say yes, a sociologist no. You must define this consistently in your minutes. Second, **Step 6 (Institutional Harm)**: Deciding what harms the Institute is a value judgment, not a fact. You might feel safety is paramount; your colleague might feel reputation is. Third, **Step 10 (Chair's Signature)**: You are personally certifying that the standing logic holds. If you get it wrong, you own the liability, not the committee. The procedure isolates these judgments so you know where you are thinking, not just counting.

  ### What this can't do

  It cannot cleanse the culture; it only manages the complaints that surface. It cannot protect you from legal appeal if a dismissed complainant sues for retaliation. It cannot fix the Committee's past sins, only prevent compounding them. It cannot force honesty from liars during the investigation. It will still produce outcomes that feel unjust to someone in the room.
