answer: |-
  **The Lunchtable Paradox: Causal Reality vs. Evidential Magic**

  The argument you and your friend had is one of the oldest and most sophisticated disputes in modern decision theory. It is not merely a disagreement about charity or diet; it is a clash between two distinct frameworks for understanding rationality: Causal Decision Theory (CDT), which you intuitively hold, and Functional Decision Theory (FDT) or Evidential Decision Theory (EDT), which your friend is articulating.

  Your friend is arguing that your actions are not isolated physical events, but rather outputs of a specific reasoning algorithm. If you are running the "be a good person" algorithm, then other people running the same algorithm will likely output the same result. Therefore, by choosing to act, you aren't just moving your own muscle; you are effectively "selecting" a world where everyone like you acts similarly. He compares this to the "Desert Hitchhiker" paradox (a variant of Newcomb's Problem), where a driver will only pick you up if they predict you will pay them later. In that scenario, the rational move is to pay, because your decision now is evidence of what the driver predicted earlier.

  You, conversely, are arguing from the standpoint of physical causation. You believe that for an action to be rational, it must mechanically change the state of the world. If your $100 donation doesn't build the well itself, and your skipped burger doesn't save the cow, then incurring a personal cost is irrational. You call this "magical thinking" because it suggests your choice influences strangers without a causal chain connecting you.

  To settle this, we must look at the mechanics of the argument your friend is making, and then test them against the messy reality of the actual world.

  **The Strength of the Friend's Position**

  Your friend's view is not actually magic; it is math. It relies on the concept of *subjunctive dependence*. The idea is that if two agents are similar enough, their decisions are logically linked. If you decide to vote, and there are 10,000 people who think exactly like you, you aren't just casting one vote; you are effectively casting 10,001 votes, because if *you* decide "voting is pointless," those 10,000 others likely will too.

  In high-stakes coordination problems, this logic is undeniable. If you and a partner are playing a Prisoner's Dilemma, and you know your partner is a perfect copy of you, the rational move is to cooperate. Defecting guarantees mutual defection. Cooperating guarantees mutual cooperation. In this specific, closed loop, your friend is right: your choice "moves" the other person, not through telepathy, but because you are both running the same source code.

  Applied to global issues, your friend suggests that by committing to Effective Altruism (giving 10% of income) or veganism, you are signaling to the "reference class" of rational, ethical people that this is the correct move. If you defect (choose selfishness), you lower the probability that others in your reference class will cooperate.

  **The Strength of Your Position**

  Your position rests on the bedrock of physics: causality flows forward, not sideways. In the real world, a farmer in Brazil does not know you skipped a burger at a lunch counter in Ohio. There is no mechanism by which your choice alters their production schedule unless enough people skip burgers to cross a specific economic threshold.

  This is the core of Causal Decision Theory. It asks: "Holding everything else constant, does this action improve the outcome?" If the answer is no, the action is irrational. You are correct that the world is not a closed system of logical copies. Strangers are not running your source code. They are influenced by culture, price, habit, and impulse. To assume that your internal reasoning process is mirrored by millions of strangers is, as you said, to treat the world as if it were full of copies of you.

  **The Fatal Flaw: The Reference Class Problem**

  Here is where the verdict must be determined. The crux of the matter lies in the two specific constraints you asked me to address: the requirement for shared decision procedures and the reality of human behavior.

  Your friend's argument secretly relies on a massive assumption: that there is a large enough group of people who are *subjunctively linked* to you to make the math work. For your choice to be evidence that "lots of other people" will choose similarly, those people must be reasoning the way you are. They must be asking the same question ("Does my action matter?") and processing the answer with the same logic.

  This is where the argument falls apart.

  Most people in the world are not running a sophisticated decision-theoretic algorithm. They are not asking, "If I choose to give 10% of my income, does this logically compel others to do the same?" Most people decide whether to donate based on whether they have extra cash this month, whether a ad made them sad, or whether their peers are doing it. Most people decide whether to eat meat based on taste, price, and availability.

  Because the vast majority of people are not treating their choice as *evidence* of what others will do, your choice cannot serve as evidence for them. You are essentially trying to play a cooperative game with people who don't know they are playing.

  If you are the only one (or one of a tiny few) reasoning this way, then your "reference class" is too small to generate the impact your friend promises. If you decide to give 10% of your income, you are not moving the needle for the "average person," because the average person isn't mirroring your logic. You are only moving the needle for the tiny sliver of the population that reads philosophy blogs and thinks about decision theory. While that group might be influential, they are not numerous enough to justify the claim that your action is "moving everyone similar to you at the same time" in a way that rivals causal impact.

  Furthermore, your friend's analogy to the Desert Hitchhiker is flawed. In the Hitchhiker problem, there is an *observer* (the driver) who is actively predicting you. In the global charity scenario, there is no observer. There is only a statistical correlation. Relying on a statistical correlation in a chaotic system where variables are not controlled is indeed a form of magical thinking. It assumes a uniformity of rationality that simply does not exist.

  **The Verdict**

  I commit to the following verdict: **You are right, and your friend is wrong.**

  While your friend's logic is internally consistent within a vacuum-sealed philosophical model, it fails when applied to the empirical reality of human behavior. His argument requires that the world be populated by agents who are logically dependent on your decision procedure. The world is not. It is populated by agents who are causally independent of your reasoning.

  Your friend claims that your action is a lever that moves others. In reality, your action is a drop in a bucket. The "evidential" value of your action is negligible because the correlation between your high-level reasoning and the behavior of the global population is too weak to bear the weight of the sacrifice he is asking you to make.

  However, you should refine your conclusion slightly. It is not that doing the good thing is *irrational*. It is that your friend's *reason* for doing it is flawed. You should give 10% of your income or skip the meat if you believe it is your moral duty, or if you believe that small causal contributions aggregate over time (which they do, via market signals and cultural shifting). But do not do it because you believe your choice magically coordinates the choices of strangers. That is indeed magical thinking dressed up in math.

  In the real world, causality is king. Since your choice does not cause strangers to act, and since most strangers are not mirroring your decision procedure, you cannot count their hypothetical actions as a dividend of your own rationality. You won the argument.
