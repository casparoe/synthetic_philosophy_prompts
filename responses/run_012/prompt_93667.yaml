  1. Ask whether the practice of holding responsible needs justification from outside itself; answering "No" yields **Strawsonian Non-justification**, while "Yes" proceeds to Node 2, though **Revisionist Warrant** cannot be separated from the "Yes" branch without incoherence, as it asserts warrant while inviting external revision.

  2. Consider a cruel agent shaped by an inescapable childhood versus one with an ordinary history; if this difference defeats responsibility, you land on **Hard Incompatibilism**, but if it leaves responsibility untouched, you land on **Compatibilism**, provided you do not find the distinction merely unattractive.

  3. Confront an agent who can recite moral reasons but is not moved by them; if apt blame requires only that she recognised the reason, you hold **Attributability**, whereas if it requires she could have been moved, you hold **Accountability**, but the **Three-way Version** adding **Answerability** cannot be separated from these branches, diagnosed as mere neglect.

  4. Assess a bystander's indignation at a wrong done to a stranger against the victim's resentment; if the attitudes come apart such that the bystander lacks standing, you arrive at the **Relational View** or **Second-personal Address**, but if they share standing as moves in an exchange, you arrive at the **Conversational View**, with no branch separating the relational from the second-personal due to unattractiveness.

  5. Decide whether to keep blaming vocabulary while replacing resentment with non-reactive sorrow; doing so marks the **Hard Incompatibilist Revisionist**, while retaining resentment marks the previous positions, yet the tree cannot prise apart whether self-directed guilt must follow resentment's fate, diagnosed as mere neglect.
