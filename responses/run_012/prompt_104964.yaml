      *   **Claim:** A single person over time is like a single gambler playing repeatedly; therefore, maximize geometric mean (growth rate), not expected value (arithmetic mean); never accept ruin risk.
      *   **Friend's Position:** General theory of rationality; large/unlikely prizes are irrational; institutions should reason like individuals.
      *   **Task:** Audit the analogy (not verdict on gambling).
      *   **Structure:**
          1.  Short table of correspondences (Crowd vs. Lone Player, Bankroll vs. Person, etc.).
          2.  At most five numbered paragraphs on disanalogies.
          3.  Brief verdict at the end.
      *   **Constraint:** No more than 800 words.

  2.  **Deconstruct the Argument (Ergodicity Economics):**
      *   The core argument is based on the distinction between ensemble averages (cross-sectional, many people once) and time averages (one person many times).
      *   In multiplicative processes (like the 1.5/0.6 coin flip), the ensemble average grows (positive expected value), but the time average shrinks (negative geometric mean).
      *   The claim is that rational agents should maximize time averages because they live through time, not across parallel universes.
      *   The friend extends this to: never risk ruin, institutions = individuals, all decisions = multiplicative compounding.

  3.  **Drafting the Table of Correspondences:**
      *   Need to map the gambling scenario to the life decision scenario.
      *   *Crowd of players* $\leftrightarrow$ *Possible future selves / Parallel outcomes*
      *   *Lone player (repeated)* $\leftrightarrow$ *Single life trajectory*
      *   *Bankroll* $\leftrightarrow$ *Utility / Wealth / Welfare*
      *   *One round* $\leftrightarrow$ *One decision period*
      *   *Average of crowd (Ensemble)* $\leftrightarrow$ *Expected Value*
      *   *Trajectory of individual (Time)* $\leftrightarrow$ *Geometric Mean / Growth Rate*

  4.  **Identifying Disanalogies (The "Audit"):**
      *   *Point 1: Repeatability.* Life decisions aren't always repeatable rounds of the same game. The 1.5/0.6 game relies on infinite repetition to converge to the geometric mean. One-off decisions (college, marriage) don't converge.
      *   *Point 2: Fungibility/Compounding.* Money compounds multiplicatively. Health, friendship, or moral values often don't. You can't necessarily reinvest "friendship points" into the next decision.
      *   *Point 3: Institutions vs. Individuals.* Institutions *can* average across risks (pooling). An insurer relies on the law of large numbers across clients, not just time. The friend's claim that institutions should reason like individuals ignores risk pooling.
      *   *Point 4: Ruin Definition.* "Ruin" in gambling is zero bankroll. In life, "ruin" is ambiguous. Does losing money mean life ends? Can you recover? The analogy assumes zero is an absorbing state, which isn't always true in life (bankruptcy laws, social safety nets).
      *   *Point 5: Utility vs. Wealth.* The argument conflates wealth with utility. Rationality is usually defined over utility. If utility is logarithmic in wealth, maximizing expected utility *is* maximizing geometric mean of wealth. The friend's claim that EV is *always* a mistake ignores utility functions.

  5.  **Drafting the Content (Iterative refinement for word count):**

