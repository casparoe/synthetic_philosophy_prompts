answer: |-
  | Gambling Analogy | Life Decision Theory |
  | :--- | :--- |
  | **Crowd of players** | Ensemble of possible outcomes (parallel worlds) |
  | **Lone player (repeated)** | Single agent through time |
  | **Bankroll** | Wealth or Utility |
  | **One round** | One decision period |
  | **Crowd average** | Expected Value (Arithmetic Mean) |
  | **Individual trajectory** | Time Average (Geometric Mean) |

  1.  **Repeatability and Convergence:** The mathematical proof that the geometric mean dominates relies on the Law of Large Numbers over *many* repeated rounds. The trajectory only converges to the geometric mean if the game is played indefinitely. Most life decisions (choosing a career, having a child) are unique or finite. You cannot rely on long-run convergence when $N=1$. Applying time-average logic to one-off decisions assumes a sequence of reinvestment that does not exist, forbidding useful reasoning about the distribution of outcomes even when no repetition is possible.

  2.  **Institutions and Pooling:** Your friend's claim that institutions should reason like individuals inverts the reality of risk. Insurers and states *are* the crowd. They pool independent risks across millions of clients, making the ensemble average physically realizable rather than hypothetical. For an insurer, avoiding a favorable gamble due to volatility is irrational because they do not face the same non-ergodic constraints as a single individual. The analogy breaks because institutions can split themselves into "copies" via diversification.

  3.  **Utility vs. Wealth:** The argument smuggles in a specific utility function by conflating wealth with value. If you maximize Expected Utility with logarithmic utility of wealth, you mathematically maximize the geometric mean of wealth. The claim that "maximizing expected value is a mistake" only holds if you assume utility is linear in wealth. A rational agent might have convex utility in desperate situations or linear utility for small stakes, making Expected Value maximization rational despite ruin risk.

  4.  **Non-Compounding Goods:** The analogy assumes multiplicative compounding (bankroll $\times$ 1.5). Health, friendship, or knowledge often do not compound multiplicatively. You cannot necessarily reinvest "health units" into the next health gamble. When stakes are additive, non-fungible, or consumable, the arithmetic mean often remains the relevant metric for rational choice. The analogy fails to map onto decisions where the stake does not serve as the seed for the next round.

  5.  **Defining Ruin:** "Never risk ruin" assumes zero is an absorbing state from which recovery is impossible. In the gambling model, zero bankroll ends the game. In life, "ruin" is ambiguous. Bankruptcy laws, social safety nets, and psychological resilience allow for recovery. The analogy treats ruin as mathematical zero, but life allows for reset buttons. Assuming ruin is absolute begs the question against risk-taking by defining any significant loss as game-over.

  **Verdict:** The analogy successfully demonstrates that time-average maximization is superior for *repeated multiplicative wealth processes* where ruin is absolute. However, it cannot support a universal theory of rationality. It fails to condemn institutions that pool risk, one-off decisions that lack convergence, or non-monetary stakes. Your friend's conclusion is an overextension; the analogy carries the conclusion only by assuming away recovery, pooling, and utility curvature.
