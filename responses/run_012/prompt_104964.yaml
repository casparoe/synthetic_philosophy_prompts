      *   *Paragraph 5 (Ruin):* "Never risk ruin" assumes zero is an absorbing state from which recovery is impossible. In reality, bankruptcy exists, safety nets exist, and "ruin" is often subjective. The analogy treats ruin as mathematical zero, but life allows for reset buttons. Assuming ruin is absolute begs the question against risk-taking.

      *   *Verdict:* The analogy proves that time-average maximization is superior for *repeated multiplicative wealth processes* without recovery. It cannot support a universal theory of rationality, nor does it condemn institutions or one-off decisions. The friend's conclusion is an overextension.

