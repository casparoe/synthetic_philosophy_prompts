answer: |-
  Here is my position on the pattern you describe.

  ### 1. Is there a term for the "stopping" direction?
  **No.** There is no established, distinct term in decision theory, behavioral economics, or management science that specifically names the tendency to abandon a project *because* of prior investment, separate from the tendency to continue.

  You will sometimes find this described in passing as "under-investment due to sunk costs" or "premature termination," but these are descriptions of outcomes, not names of the cognitive mechanism. The label "Sunk Cost Fallacy" is universally applied to the *continuation* error (escalation of commitment), creating the lexical gap you have identified. However, this is a failure of nomenclature, not a distinction in kind.

  ### 2. Are these one phenomenon or two?
  **I take the position that they are one phenomenon.**

  The underlying error is not "continuing" or "stopping"; the error is **Sunk Cost Sensitivity**. The fundamental violation is allowing an irreversible past cost to enter the decision function at all. Whether that sensitivity pushes the decision variable toward continuation (to "recoup" or "justify" the spend) or toward termination (to "cap" or "contain" the spend) is secondary to the primary error: the decision is being made on the cumulative ledger rather than the margin.

  The reason the literature focuses on the continuation direction is historical and salience-based. The Concorde Fallacy (the namesake for the continuation error) was dramatic: governments kept pouring money into a losing plane. The "stopping" variant is quieter; it looks like fiscal prudence. It hides in plain sight as "cutting losses," even when the losses are already sunk and the future is profitable.

  Therefore, I reject the idea that these are two biases. They are the same bias reacting to different incentive structures.
  *   **Continuation** usually arises when the decision-maker feels a need to *justify* the past expenditure (psychological commitment).
  *   **Termination** usually arises when the decision-maker feels a need to *report* the past expenditure (accounting constraint).

  ### 3. Where do the boundaries fall?
  To distinguish the pattern you describe from rational or distinct behaviors, we must draw lines around the specific mechanism of **irrelevance**. The core of the fallacy is that the past cost has *zero* causal bearing on the future utility.

  Here is how I draw the boundaries between your pattern and its neighbors:

  #### A. vs. Rational Inference (The "Evidence" Boundary)
  **The Line:** Does the past expenditure correlate with new information about quality?
  *   **The Fallacy:** "We have spent $10M, so we must stop (or continue) *because* the number is $10M."
  *   **The Rational Exception:** "We have spent $10M and achieved X. Based on X, the probability of success is low."
  In your laboratory example, if the six years of research yielded data suggesting the hypothesis is false, stopping is rational. The cost of the six years is irrelevant; the *data* generated is relevant. If the director shuts it down *solely* because the budget line looks red, despite the data being positive, that is the fallacy.
  *   **Why I draw it here:** Past investment is often a proxy for difficulty. If a project has consumed vast resources with little to show, it may be technically harder than anticipated. A rational actor updates on the *difficulty*, not the *cost*. The fallacy occurs when the cost itself is the deterrent, independent of the technical outlook.

  #### B. vs. Agency and Reputation (The "Audience" Boundary)
  **The Line:** Is the decision optimizing for the firm's value or the manager's career?
  *   **The Fallacy:** Stopping because the cumulative number damages the project's P&L.
  *   **The Rational Exception:** Stopping because a large cumulative number will cause the Board to fire the manager, and the manager's removal would cause greater disruption.
  This is the trickiest edge. In your board example, if the directors cancel a viable product to protect the balance sheet, it is an economic error (firm value is destroyed). However, if they cancel it to protect their own tenure, it is an *agency cost*. It is rational for the *individual*, irrational for the *entity*.
  *   **Why I draw it here:** I classify this as distinct because the "stopping" pattern you describe is often a rational response to irrational accounting systems. If bonuses are tied to ROI, and ROI is calculated using sunk costs, stopping is the mathematically correct move for the bonus-seeker. I distinguish the **Cognitive Fallacy** (believing the cost matters economically) from the **Institutional Incentive** (knowing the cost matters politically). Your examples suggest the actors believe they are being "clear-eyed about waste," implying a cognitive error, not just political maneuvering.

  #### C. vs. Loss Aversion (The "Realization" Boundary)
  **The Line:** Is the pain in the *spending* or the *booking*?
  *   **The Fallacy:** "We have spent too much" (Cumulative focus).
  *   **Loss Aversion:** "We don't want to book the loss" (Realization focus).
  Loss aversion (Prospect Theory) typically explains why people *hold* losers (to avoid realizing the loss). Your pattern is the inverse: stopping to prevent the loss from growing *on the books*.
  *   **Why I draw it here:** Loss aversion is about the asymmetry of pain (losing $100 hurts more than gaining $100 helps). Your pattern is about the *magnitude of the ledger*. A loss-averse person might continue a project to avoid admitting the sunk money is gone. Your "stopping" director admits the money is gone but refuses to add to the total. This is not aversion to the loss itself, but aversion to the *size of the recorded failure*.

  #### D. vs. The Disposition Effect (The "Asset" Boundary)
  **The Line:** Is this a project or a tradable asset?
  *   **The Fallacy:** Internal project management.
  *   **The Disposition Effect:** Selling winners too early and holding losers too long in a portfolio.
  The Disposition Effect is specific to financial assets where price is liquid and visible. Your pattern applies to illiquid projects (R&D, product launches).
  *   **Why I draw it here:** The mechanisms differ. The Disposition Effect is driven by mental accounting of gains/losses relative to a purchase price. Your pattern is driven by budgetary accumulation. They are cousins, but the "stopping" pattern you describe is more about **budget exhaustion** than **mental accounting of gains**.

  ### 4. Is the "Stopping" version a mistake in the same sense?
  **Yes, it is a normative error in the same sense, but it is socially more dangerous.**

  In strict decision theory, both directions violate the principle of marginal analysis. Future resources should be allocated based on future returns. Past resources are gone. To let them dictate the stop/go decision is to let a ghost drive the car.

  However, I argue the "stopping" version is **more insidious** than the "continuing" version for two reasons:

  1.  **It wears the mask of virtue.** Escalation of commitment is easily identified as "stubbornness" or "waste." Abandoning a project due to high cumulative cost is easily framed as "fiscal discipline" or "stopping the bleeding." It is harder to root out because it aligns with accounting heuristics that are useful in other contexts (e.g., budget caps).
  2.  **It is structurally reinforced.** Corporate accounting systems track cumulative spend. They do not track "future marginal utility" with the same fidelity. A manager is punished for a budget overrun (cumulative) more often than they are punished for lost opportunity cost (marginal). Therefore, the "stopping" fallacy is often the *rational* response to a broken measurement system.

  ### Summary of Position
  1.  **Name:** There is no specific name. It is the negative vector of the **Sunk Cost Fallacy**.
  2.  **Unity:** It is **one phenomenon** (Sunk Cost Sensitivity). The direction (stop/go) depends on whether the actor seeks to justify the spend or contain the ledger.
  3.  **Boundaries:** It is distinguished from rational inference by the **irrelevance of the cost** to future probability; from agency issues by the **actor's belief** in the economic necessity; and from loss aversion by the focus on **cumulative magnitude** rather than the pain of realization.
  4.  **Culpability:** It is the **same error** as the continuation bias, but it is often **less culpable socially** because it mimics prudence, making it a more persistent threat to value creation.

  The pattern you have isolated is the **Sunk Cost Fallacy operating under accounting constraints rather than psychological commitment.** It is the same disease, wearing a suit.
