prompt: |-
  I run the science side of a small foundation that gives multi-year grants to research groups, and I keep having the same fight with my board. A group's project stops producing anything genuinely new and just keeps patching itself -- every time a result comes back negative they bolt on another assumption and carry on -- and the board wants to know how we decide whether that's dogged persistence or a dead end. I know philosophy of science has a framework aimed right at this, the one about research programmes with a hard core you protect by policy and a belt of auxiliary assumptions you're allowed to revise, and a distinction between revisions that lead somewhere new and revisions that only save the theory from a counterexample. But I can't hand my board a philosophy book, and honestly half the useful content is in the fine distinctions that get lost when you wave at it in a meeting.

  So: turn that framework into a decision procedure we can actually run at a renewal meeting. Some constraints. The committee is eight people, about half are working scientists and half are donors with no technical background, so nothing can depend on reading the group's whole literature or on judging the theory's ultimate truth -- we can't settle whether they're right, only whether the programme is still going somewhere. We get one 90-minute slot per renewal, we have the group's own outputs plus two external letters, and the chair has to sign off, so I need a place in the procedure where the answer is genuinely a call for the chair and not a fact we can look up. Give me the questions to ask, in order, what counts as a sufficient answer to each one, where the procedure stops with a no, and where it hands the decision to a person because it's turned into a values question about risk appetite rather than a question about the science. And please keep what the framework actually says -- I don't want a generic innovation checklist wearing its clothes.

  Then run the procedure on three cases so I can see it work. One: a materials group that staked out a specific, falsifiable prediction a few years back and a completely separate lab has now confirmed it, though nothing else about their core picture has moved. Two: an immunology lab that's our flagship grant and whose PI is a friend of the foundation -- they've had four failed predictions in a row and each time the fix is a new auxiliary assumption that only ever gets tested by them. Three: a young programme that hasn't had time to make a novel prediction yet, where I honestly can't tell whether we're looking at a dead end or just an early stage. At least one of these should come out as a no that I won't like, and I want you to say so plainly. Also tell me where the procedure can't decide and is just dressing a judgment call up as a step, and what it can't do at all -- in particular, someone on my board will always say that defending a core against awkward evidence is just normal science and nothing to worry about, so tell me what that objection gets right and where the procedure should still push back.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Science lead at a small foundation giving multi-year grants.
      *   **Problem:** Conflict with the board over renewing grants for research groups that seem to be "patching" failing theories (ad hoc modifications) vs. showing "dogged persistence" in a fruitful research programme.
      *   **Theoretical Framework:** Lakatosian Methodology of Scientific Research Programmes (MSRP). Key concepts: Hard Core (protected), Protective Belt (auxiliary hypotheses), Positive Heuristic (guidance for growth), Negative Heuristic (what not to touch), Progressive vs. Degenerating Problemshifts.
      *   **Constraints:**
          *   Committee: 8 people (4 scientists, 4 non-scientists).
          *   Time: 90 minutes per renewal.
          *   Inputs: Group outputs + 2 external letters.
          *   Limitations: Cannot judge ultimate truth, cannot read whole literature.
          *   Output: A decision procedure (questions in order, sufficiency criteria, stop points).
          *   Governance: Must identify where the Chair makes the final call (values/risk).
          *   Fidelity: Must stay true to Lakatos, not generic innovation checklists.
          *   Testing: Run on 3 specific cases (Materials, Immunology, Young Programme).
          *   Honesty: Must admit where the procedure fails or is a judgment call in disguise. Must address the "normal science" objection.

  2.  **Deconstruct Lakatos for a Non-Philosopher Audience:**
      *   *Hard Core:* The fundamental assumptions the group refuses to give up.
      *   *Protective Belt:* The adjustable assumptions used to match data.
      *   *Progressive Problemshift:* Adjusting the belt leads to *new* predictions/facts discovered.
      *   *Degenerating Problemshift:* Adjusting the belt only explains *old* anomalies without new predictions.
      *   *The Crux:* Is the belt expansion producing *novel facts* (progressive) or just saving the core from refutation (degenerating)?

  3.  **Drafting the Decision Procedure (The "Lakatos Audit"):**
      *   *Goal:* Translate "Progressive vs. Degenerating" into actionable questions for a 90-minute meeting.
      *   *Step 1: Identify the Core.* (Can we state what they *won't* change?)
      *   *Step 2: Identify the Belt Moves.* (What did they change to fit data?)
      *   *Step 3: Check for Novelty.* (Did the change predict something *new* or just explain something *old*?)
      *   *Step 4: Check for Independence.* (Is the verification independent of the theorizers?)
      *   *Step 5: The Heuristic.* (Is there a plan for the next novel fact?)
      *   *Decision Point:* If Progressive -> Renew. If Degenerating -> Stop (unless Chair overrides based on risk).

      *Refining for Constraints:*
      *   Need to ensure non-scientists can follow. Focus on "Predictions vs. Explanations."
      *   Need a specific "Chair Call" moment. This should be about risk tolerance on a degenerating programme that *might* turn around (high risk/high reward).
      *   Need "Stop with No" criteria.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Materials):* Specific falsifiable prediction confirmed by *separate* lab. Core hasn't moved.
          *   *Analysis:* This is strong evidence of progress. External validation is key. Even if the core is static, the belt held and predicted.
          *   *Verdict:* Renew.
      *   *Case 2 (Immunology):* Flagship, PI is a friend. 4 failed predictions. 4 auxiliary fixes. Tested only by them.
          *   *Analysis:* Classic degenerating problemshift. Ad hoc adjustments. No independent verification. No novel facts.
          *   *Verdict:* No Renewal (The "No I won't like").
      *   *Case 3 (Young Programme):* No novel prediction yet. Early stage.
          *   *Analysis:* Lakatos allows for a "lag time." You can't judge progressiveness immediately.
          *   *Verdict:* Conditional Renewal / Chair Call (Risk appetite).

  5.  **Addressing the "Normal Science" Objection:**
      *   Board member says: "Defending a core is normal science."
      *   Response: Lakatos agrees *up to a point*. But if the belt only saves the theory from refutation without adding empirical content (new predictions), it becomes degenerating. The procedure distinguishes between *protecting* (valid) and *patching* (invalid).

  6.  **Addressing Limitations/Honesty:**
      *   Where is it a judgment call? Determining "novelty" can be tricky. Determining if a young programme is just "slow" or "dead" is inherently uncertain.
      *   The Chair's role: Deciding how much degeneration is tolerable for potential high payoff.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, direct, slightly academic but accessible.
      *   *Structure:*
          1.  Introduction (acknowledging the Lakatos framework).
          2.  The Procedure (The 5-Step Audit).
          3.  The Chair's Veto/Override (The Values Moment).
          4.  Running the Cases.
          5.  Limitations & Objections.

      *(Self-Correction during drafting)*: Make sure I don't simplify Lakatos *too* much. The distinction between "explaining an anomaly" vs. "predicting a novel fact" is the heart of it. I need to make sure the procedure asks specifically about *timing* (prediction before observation).
      *   *Constraint Check:* 90 minutes. The questions need to be answerable from the grant report and external letters.
      *   *Constraint Check:* Chair sign-off. I need to explicitly state where the procedure ends and the Chair begins.

  8.  **Final Polish:**
      *   Ensure the "No" in Case 2 is explicit.
      *   Ensure the "Young Programme" ambiguity is highlighted as a feature, not a bug.
      *   Ensure the "Normal Science" objection is treated respectfully but firmly.

  9.  **Final Review against Prompt:**
      *   Turn framework into decision procedure? Yes.
      *   Constraints met (8 people, mixed background, 90 mins, inputs)? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop points? Yes.
      *   Chair call identified? Yes.
      *   Run on 3 cases? Yes.
      *   One "No" I won't like? Yes (Case 2).
      *   Where it's a judgment call? Yes.
      *   What it can't do? Yes.
      *   Normal Science objection addressed? Yes.
      *   Keep Lakatos fidelity? Yes (Hard Core, Protective Belt, Novel Facts, Progressive/Degenerating).

  10. **Writing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a translation of Imre Lakatos's *Methodology of Scientific Research Programmes (MSRP)* into an operational audit tool. Lakatos argues that you cannot judge a theory by a single counterexample. Instead, you judge a *series* of theories (a research programme) by whether modifications to its "protective belt" lead to the discovery of **novel facts** (progressive) or merely explain away **old anomalies** (degenerating).

  Here is the procedure, designed for your 90-minute slot and mixed committee.

  ### The Lakatos Audit Procedure

  **Inputs:** The group's final report (specifically the "Deviations & Modifications" section), the list of publications from the grant period, and the two external letters.
  **Time Allocation:** 60 minutes for the Audit, 30 minutes for Deliberation/Chair Decision.

  #### Step 1: Identify the Hard Core (5 Minutes)
  **Question:** Can the committee state, in one sentence, the fundamental assumption this group refuses to abandon, even when data contradicts it?
  *   **Sufficient Answer:** A clear statement of the ontological or theoretical commitment (e.g., "Disease X is caused by Protein Y," or "Material Z exhibits superconductivity via Mechanism A").
  *   **Insufficient Answer:** A vague goal (e.g., "To cure Disease X") or a methodology (e.g., "Using CRISPR to screen...").
  *   **Stop Condition:** If the committee cannot agree on what the "Hard Core" is, the programme lacks coherence. **Recommendation: No Renewal.** (A research programme without a defined core is just a collection of projects).

  #### Step 2: Map the Protective Belt Moves (15 Minutes)
  **Question:** Since the last renewal, what specific assumptions in the "protective belt" (auxiliary hypotheses, initial conditions, measurement techniques) were altered to accommodate negative results or anomalies?
  *   **Sufficient Answer:** A list of specific modifications linked to specific data points (e.g., "When Trial A failed, they adjusted the dosage parameter," or "When the signal was noisy, they changed the filtering algorithm").
  *   **Source:** Look for discrepancies between the original proposal and the final report, highlighted in the external letters.
  *   **Stop Condition:** If the group claims *no* modifications were made despite negative results, they are either ignoring data or hiding it. **Recommendation: No Renewal.**

  #### Step 3: The Novelty Test (20 Minutes)
  **Question:** For every modification identified in Step 2, did it lead to the prediction of a **novel fact** (something not used to construct the modification) that was subsequently observed?
  *   **Sufficient Answer:** "Yes. They adjusted parameter X to fit Anomaly 1, and that adjustment successfully predicted Outcome 2, which was measured *after* the adjustment."
  *   **Insufficient Answer:** "Yes. They adjusted parameter X to fit Anomaly 1, and now the model fits Anomaly 1 perfectly." (This is *post-hoc* accommodation, not progress).
  *   **Crucial Distinction:** The fact must be *temporally novel* (predicted before observation) or *use-novel* (data not used to build the theory).
  *   **Stop Condition:** If all belt modifications only explain past anomalies without generating new, successful predictions, the programme is **Degenerating**. Proceed to Step 5 (Chair Call).

  #### Step 4: The Independence Check (20 Minutes)
  **Question:** Are the successful predictions from Step 3 verified by methods or labs independent of the PI's immediate control?
  *   **Sufficient Answer:** "Yes, the prediction was confirmed by Lab B," or "Yes, they used a blinded dataset they did not curate."
  *   **Insufficient Answer:** "Yes, the PI's students ran the follow-up experiment using the same apparatus." (This risks circularity and tuning).
  *   **Outcome:** If Step 3 was "Yes" and Step 4 is "Yes," the programme is **Progressive**. **Recommendation: Renew.**

  #### Step 5: The Degeneration Threshold (Chair's Call)
  *If the programme is identified as Degenerating in Step 3:*
  **Question:** Is the degeneration theoretical (mathematical inconsistency) or empirical (lack of new facts), and is there a plausible heuristic for a breakthrough?
  *   **Procedure:** The committee votes on "Risk Tolerance."
  *   **The Chair's Role:** The procedure cannot calculate risk appetite. If the science is degenerating but the potential payoff is existential (e.g., a cure for a rare disease with no other leads), the Chair must decide if the foundation's mission justifies funding a "last chance" degenerating programme.
  *   **Decision:** The Chair signs off on either "Terminate" (Science says stop) or "Final Extension" (Values say try once more).

  ---

  ### Running the Procedure on Your Cases

  #### Case 1: The Materials Group
  *   **Step 1 (Core):** "Superconductivity in Material Z is driven by Phonon Mechanism A." (Clear).
  *   **Step 2 (Belt):** They had to adjust purity thresholds to get the signal. (Identified).
  *   **Step 3 (Novelty):** They staked a specific falsifiable prediction years ago. A separate lab confirmed it. (Passes Novelty Test).
  *   **Step 4 (Independence):** Confirmed by a *completely separate lab*. (Passes Independence).
  *   **Result:** **Progressive.**
  *   **Recommendation:** **Renew.** Even if the core hasn't moved, the protective belt is robust and yielding external verification. This is healthy normal science.

  #### Case 2: The Immunology Lab (Flagship/PI Friend)
  *   **Step 1 (Core):** "Immune Response X is mediated by Pathway Y." (Clear).
  *   **Step 2 (Belt):** Four failed predictions. Four new auxiliary assumptions added (e.g., "The receptor was masked," "The sample was degraded," "There is a cofactor we missed").
  *   **Step 3 (Novelty):** Did these fixes predict anything *new*? No. They only explained why the previous prediction failed. (Fails Novelty Test).
  *   **Step 4 (Independence):** Fixes tested only by them. (Fails Independence).
  *   **Result:** **Degenerating Problemshift.**
  *   **Recommendation:** **No Renewal.**
  *   **The Hard Truth:** I know you don't want to hear this, and the board will feel pressure because the PI is a friend and a flagship. But Lakatos is explicit here: A programme that only saves itself from refutation without adding empirical content is scientifically dead. It is consuming resources to protect a dogma. The procedure forces a **No**.

  #### Case 3: The Young Programme
  *   **Step 1 (Core):** Defined.
  *   **Step 2 (Belt):** Minimal movement; still building the apparatus/theory.
  *   **Step 3 (Novelty):** No novel predictions yet.
  *   **Result:** **Indeterminate.**
  *   **Analysis:** Lakatos acknowledges a "lag time." A programme can be degenerating *temporarily* while tools are built. The procedure cannot distinguish between "early stage" and "dead end" without time-series data.
  *   **Recommendation:** **Conditional Renewal (Chair's Call).** This moves immediately to Step 5. The Chair must decide on risk appetite. Is the potential payoff high enough to fund the "construction phase"? This is not a science question; it is a portfolio strategy question.

  ---

  ### Limitations and Objections

  #### 1. The "Normal Science" Objection
  **Objection:** A board member will say: *"Defending a core against awkward evidence is just normal science. Kuhn says we shouldn't abandon a paradigm just because of anomalies. Why are we punishing them for doing science?"*

  **Where they are right:** They are right that we should not kill a programme on the first negative result. Lakatos agrees; the Hard Core is protected by a *negative heuristic* (do not touch this).
  **Where the procedure pushes back:** The distinction is not about *defending* the core, but about *how* the belt is modified.
  *   **Normal Science:** Modifying the belt leads to *new* discoveries (e.g., Newtonian mechanics predicting Neptune).
  *   **Patching:** Modifying the belt only explains the *old* failure (e.g., "The planet didn't appear because of dust," with no independent proof of dust).
  *   **The Pushback:** Tell the board: "We are not asking if they defended the core. We are asking if that defense bought us new knowledge. If the only output of their defense is an excuse for why they were wrong last time, that is not normal science; it is stagnation."

  #### 2. Where the Procedure is a "Dressed-Up Judgment Call"
  **Step 3 (The Novelty Test)** is the weakest link for non-scientists. Determining whether a fact is "novel" or "used in the construction of the hypothesis" can be subtle.
  *   *Example:* If they say "We predicted this," but the external letter says "They tuned the model until it fit," the committee must judge credibility.
  *   *Mitigation:* This is why the **External Letters** are critical inputs. The procedure relies on the external reviewers to flag *post-hoc* rationalization. If the letters are ambiguous, the procedure stalls, and it becomes a Chair call on credibility.

  #### 3. What The Procedure Cannot Do
  *   **It cannot predict a paradigm shift.** Sometimes a degenerating programme is actually a revolutionary theory in disguise (e.g., early quantum theory looked messy and ad hoc). The procedure is biased toward *conservative* progress. It will systematically weed out high-risk, high-reward outliers that look like failures in the short term.
  *   **It cannot measure "Truth."** As you noted, we aren't judging truth. A programme can be progressive (predicting new facts) but ultimately false (e.g., Phlogiston theory had a run of progressive predictions before dying). The procedure ensures you are funding *momentum*, not *correctness*.
  *   **It cannot solve the "Young Programme" problem definitively.** As seen in Case 3, without a history of predictions, the Lakatosian metric has nothing to grab onto. You are betting on the PI's heuristic intuition, not the programme's track record.

  ### Summary for the Chair
  The procedure gives you a shield for Case 2 (Immunology). You are not cutting them because they are "wrong"; you are cutting them because the *structure of their argument* has become degenerating. They are spending foundation money to explain why they haven't found anything, rather than finding new things.

  For Case 3, it gives you permission to admit uncertainty. You are not failing to decide; the *methodology* dictates that a decision is impossible, so the default is a risk-based judgment call.

  For Case 1, it prevents the board from getting bored. Just because the "Hard Core" hasn't changed doesn't mean the grant is stale. If the belt is yielding independent, novel facts, the programme is alive.
