      *   *The Lie:* Traditional lie hides the truth. Totalitarian lie replaces reality (makes the lie the new reality).
      *   *The Common World:* The space of appearance where we see the same world from different angles. Truth anchors this world.
      *   *Action/Speech:* Politics is about who we are, revealed in speech/action. Lying is an act of freedom (changing the course of events), but destroying the ground of fact destroys freedom itself.
