          *   *Extrapolation:* She would likely argue that (4) is *worse* than a lie because it removes agency. It makes the destruction of truth structural rather than volitional. It dissolves the "who" of politics.
          *   *Load-bearing:* The concept of *Action* (human agency). If agency is removed, politics dies. So (4) is the death of politics, not just lying.

      *   **(c) Ranking (2) vs. (1) & The Truth/Opinion Tension:**
          *   *Tension:* Arendt hates "Truth" ruling politics (tyranny of truth over opinion) but insists "Factual Truth" is the ground of politics.
          *   *Resolution:* Factual truth is the *table* upon which we sit to debate opinions. If the table rots (2), no debate is possible. (1) is just a bad move on the board; (2) breaks the board.
          *   *Verdict:* (2) is graver. The loss of the common world is the loss of the political realm itself.
          *   *Nuance:* She would warn against making Factual Truth *authoritative* (philosopher kings), but she insists it must be *incontrovertible*.

      *   **(d) Remedies:**
