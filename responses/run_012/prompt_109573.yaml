  *(Self-Correction during final review)*: In section (d), I need to be very careful about "platform liability." Arendt is skeptical of legalistic solutions to political problems. She would likely favor *institutional integrity* (a free press, independent archives) over *state regulation*. I must emphasize that distinction.

