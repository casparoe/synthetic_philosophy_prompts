  2.  **Math Check & Calibration:**

      *   *Theorem:* If voters vote independently with probability $p$ of being correct, the probability the majority is correct is $P(Majority) = \sum_{k=\lceil N/2 \rceil}^{N} \binom{N}{k} p^k (1-p)^{N-k}$.
      *   *Scenario 1 (Independence, $p=0.7$):* $N=20$. Need 11+ correct.
          *   Using binomial cumulative distribution: $P(X \ge 11)$ for $n=20, p=0.7$.
          *   Mean = 14. Std Dev = $\sqrt{20 \cdot 0.7 \cdot 0.3} \approx 2.16$.
          *   11 is roughly 1.4 SDs below mean.
          *   Calculation: $P(X \ge 11) \approx 0.952$. (Request said "19 times in 20" = 0.95). This matches perfectly.
      *   *Scenario 2 (Correlation):* This is trickier. If there is a common signal, errors become correlated.
          *   Mechanism proposed: Private clue ($p=0.6$) + Public clue ($p=0.6$).
          *   If everyone follows the public clue, $N$ effectively becomes 1. Reliability = 0.6.
          *   If they mix, it depends on weighting. To make the point "deliberation violates independence," we need them to converge on the *same* wrong answer when the public signal is wrong.
          *   Better mechanism for Scenario 2: Give a private signal ($p=0.7$) but tell them a "Expert Hint" (Public Signal) that is correct only 60% of the time. If they weight the hint heavily during discussion, correlation increases.
          *   *Refinement:* The prompt suggests "same private clue supplemented by identical public clue." If the public clue is strong, everyone follows it. If Public $p=0.6$, Group $p \approx 0.6$. This is worse than Scenario 1's 0.95.
          *   *Goal:* Show that *correlation* hurts. Even if individual $p$ stays high, if $\rho > 0$, group accuracy drops.
          *   *Revised Plan for Round 2:* Keep private $p=0.7$. Add a "Common Noise" factor. Or, simpler for class: Give a public hint that is misleading 40% of the time. If they discuss, they converge on the hint.
          *   *Let's stick closer to the prompt's mechanism:* "Private clue supplemented by identical public clue."
          *   If Private $p=0.7$ and Public $p=0.6$. If they average, $p$ goes up. If they *substitute* private with public (herding), $p$ drops to 0.6.
          *   *Decision:* To ensure the "feeling" of correlation hurting, the instruction must encourage relying on the shared information during discussion. I will design the "Discussion Round" to force reliance on a shared (fallible) piece of evidence.
      *   *Scenario 3 (Incompetence, $p=0.4$):* $N=20$. Need 11+ correct.
          *   Mean = 8.
          *   $P(X \ge 11)$ for $n=20, p=0.4$.
          *   Calculation: $P(X \ge 11) \approx 0.127$.
          *   So the majority is wrong ~87% of the time. This fits "wrong most of the time."
          *   Is it worse than a single participant? Single $p=0.4$. Majority $p \approx 0.13$. Yes.
          *   Is it worse than a coin? Coin = 0.5. Majority = 0.13. Yes.
      *   *Calibration Verdict:* The numbers ($0.7, 0.6/Correlated, 0.4$) work well for $N=20$.

