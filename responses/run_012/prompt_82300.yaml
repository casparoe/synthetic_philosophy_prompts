      *   This creates tension: Do I stick to my card (Individual) or listen to the group (Majority)? In the correlation round, if the group converges on the wrong shared signal, everyone loses the bonus.

  5.  **Debrief Strategy:**

      *   Reveal the math.
      *   Map Round 1 to $p > 0.5$, Independence.
