      *   *My tweak:* To ensure the correlation effect is visible, the Public Clue must be *salient*. I will instruct them in the discussion round: "You have 3 minutes to reach a consensus. You may share your card signals." When they share, they realize many have different signals. They will look for a focal point. I will write a "Hint" on the board for discussion rounds only.
