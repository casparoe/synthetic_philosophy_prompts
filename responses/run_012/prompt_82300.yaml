answer: |-
  # Lesson Plan: The Weight of the Majority

  **Course:** Upper-Level Seminar in Social Epistemology / Democratic Theory
  **Time:** 75 Minutes
  **Students:** 20
  **Goal:** Experiential demonstration of Condorcet's Jury Theorem (CJT), specifically the roles of competence ($p$) and independence ($\rho$).

  ---

  ## 1. Setting and Timing (75 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Setup** | Distribute materials. Explain the "State of the World" game. No mention of CJT. |
  | **00:05 – 00:15** | **Round 1** | **High Competence / Independent.** Silent vote. Reveal results. |
  | **00:15 – 00:25** | **Round 2** | **High Competence / Correlated.** Private cards + Public Hint. Discussion. Vote. Reveal results. |
  | **00:25 – 00:35** | **Round 3** | **Low Competence / Independent.** Silent vote. Reveal results. |
  | **00:35 – 00:55** | **Debrief** | Map experiences to theorem. Reveal the math. Live simulation. |
  | **00:55 – 01:05** | **Coda** | Condorcet Paradox (Intransitivity). |
  | **01:05 – 01:15** | **Buffer** | Q&A and cleanup. |

  ---

  ## 2. Materials and Deck Generation

  You need three sets of cards (one per round). Do not calculate probabilities in class. Use this Python script to generate the materials beforehand. It produces a text file you can print and cut.

  **The Logic:**
  *   **Round 1:** True State is fixed (e.g., A). Each card matches State A with 70% probability. Independent.
  *   **Round 2:** True State is fixed. Each card matches State with 70% probability. **PLUS** a "Public Hint" is projected that matches State with only 60% probability.
  *   **Round 3:** True State is fixed. Each card matches State with 40% probability. Independent.

  **Instructor Script (Run this once):**
  ```python
  import random

  def generate_round(n_students, p_correct, round_num, has_public_hint=False, p_public=0.0):
      # Fix the True State for this round (0 for Jar A, 1 for Jar B)
      true_state = random.choice([0, 1])
      state_label = "A" if true_state == 0 else "B"
      
      cards = []
      for i in range(n_students):
          # Generate private signal
          if random.random() < p_correct:
              signal = true_state
          else:
              signal = 1 - true_state
          
          signal_label = "A" if signal == 0 else "B"
          cards.append(f"Round {round_num}, Student {i+1}: Your Private Signal is [{signal_label}]")
      
      public_hint = ""
      if has_public_hint:
          if random.random() < p_public:
              hint_val = true_state
          else:
              hint_val = 1 - true_state
          public_hint = f"ROUND {round_num} PUBLIC HINT: The evidence leans toward Jar [{ 'A' if hint_val == 0 else 'B' }]"
          
      return true_state, state_label, cards, public_hint

  # CONFIGURATION
  N = 20
  random.seed() # Use system time

  # Round 1: p=0.7, Independent
  t1, s1, deck1, hint1 = generate_round(N, 0.7, 1)

  # Round 2: p=0.7 Private, p=0.6 Public (Correlation Driver)
  t2, s2, deck2, hint2 = generate_round(N, 0.7, 2, has_public_hint=True, p_public=0.6)

  # Round 3: p=0.4, Independent
  t3, s3, deck3, hint3 = generate_round(N, 0.4, 3)

  # OUTPUT
  with open("class_decks.txt", "w") as f:
      f.write(f"INSTRUCTOR KEY (DO NOT SHOW)\n")
      f.write(f"Round 1 True State: {s1}\n")
      f.write(f"Round 2 True State: {s2}\n")
      f.write(f"Round 3 True State: {s3}\n\n")
      
      f.write(f"PUBLIC HINTS (Project these in Round 2)\n")
      f.write(f"{hint2}\n\n")
      
      f.write(f"STUDENT CARDS (Cut these out)\n")
      for card in deck1: f.write(card + "\n")
      f.write("\n")
      for card in deck2: f.write(card + "\n")
      f.write("\n")
      for card in deck3: f.write(card + "\n")

  print("Generated class_decks.txt. Check Instructor Key for grading.")
  ```

  **Physical Prep:**
  1.  Run script. Print `class_decks.txt`.
  2.  Cut the "Student Cards" into strips. Sort into three piles (Round 1, 2, 3).
  3.  Prepare 20 small envelopes per round (optional, but prevents peeking) or just stack them face down.
  4.  Prepare a "Scoreboard" on the whiteboard (Columns: Round, Majority Vote, True State, Majority Correct?, Group Points).

  ---

  ## 3. Payoff Scheme (Epistemic Currency)

  To create a pull toward consensus without real money:
  1.  **Individual Point:** 1 point if your vote matches the True State.
  2.  **Collective Bonus:** 2 points for **everyone** if the Room Majority matches the True State.
  3.  **Reward:** The top 3 individual scorers get a chocolate bar. The Collective Bonus is required to unlock a "Class Privilege" (e.g., 5 minutes of free time next week or choosing one reading).

  *Why this works:* It aligns self-interest with truth, but makes the *Majority* outcome more valuable than the *Individual* outcome. In Round 2, if they correlate on the wrong hint, they lose the Collective Bonus, creating a tangible "pain" of correlation.

  ---

  ## 4. Procedure: The Three Rounds

  **Introduction (5 mins):**
  "There are two jars, A and B. One contains the 'True State' for this round. I know which one; you do not. You will receive a private signal (a card). It is not perfect. Your goal is to maximize your points. In some rounds, you may discuss; in others, you must vote silently."

  **Round 1: The Wisdom of Crowds (10 mins)**
  *   **Distribution:** Hand out Round 1 cards.
  *   **Instruction:** "Look at your card. Do not show it to anyone. Vote silently on A or B."
  *   **Vote:** Collect votes (show of hands or slip of paper).
  *   **Reveal:** Announce the Majority Vote. Reveal True State. Calculate Points.
  *   **Expected Experience:** Majority is correct (95% chance). Students feel confident.

  **Round 2: The Trap of Deliberation (10 mins)**
  *   **Distribution:** Hand out Round 2 cards.
  *   **Instruction:** "You have 3 minutes to discuss. You must submit **one** group vote. I am also providing a **Public Hint** on the board." (Project the Hint from the script).
  *   **Dynamic:** Students will see their private cards conflict. They will anchor on the Public Hint because it is a focal point for consensus.
  *   **Vote:** Group submits one answer.
  *   **Reveal:** Reveal True State. Calculate Points.
  *   **Expected Experience:** If the Public Hint was wrong (40% chance), the *entire room* is wrong. They had *more* information (Private + Public) but performed worse than Round 1.
  *   **Note:** If the Hint is right, the lesson is muted. *Instructor Fix:* If the Hint happens to be right in your generation, admit in debrief: "Today the correlation helped. But notice you ignored your private data to follow the hint. If the hint were wrong, you would have all failed together." (Better: Run the script until Round 2 Hint is Wrong for the demo, or acknowledge the variance).

  **Round 3: The Competence Threshold (10 mins)**
  *   **Distribution:** Hand out Round 3 cards.
  *   **Instruction:** "Silent vote. No discussion."
  *   **Vote:** Collect votes.
  *   **Reveal:** Reveal True State. Calculate Points.
  *   **Expected Experience:** Majority is wrong (87% chance). Students feel frustrated; their signals were "noisy."

  ---

  ## 5. Debrief: Mapping Experience to Theorem (20 mins)

  **Step 1: The Reveal (5 mins)**
  Write "Condorcet's Jury Theorem" on the board.
  "Today you enacted a mathematical theorem from 1785. It predicts the probability a majority is correct based on two variables."
  Write: $P(Majority) = f(N, p, \rho)$
  *   $N$: Group Size (20)
  *   $p$: Individual Competence (Probability your card is right)
  *   $\rho$: Correlation (Independence)

  **Step 2: Mapping the Rounds (10 mins)**
  *   **Round 1:** $p = 0.7$, $\rho = 0$.
      *   *Math:* With 20 people, the majority accuracy jumps from 70% to ~95%.
      *   *Lesson:* Aggregation amplifies competence.
  *   **Round 2:** $p = 0.7$ (Private) + Public Hint ($p=0.6$).
      *   *Mechanism:* Deliberation introduced correlation ($\rho > 0$). You effectively became 1 voter with $p=0.6$ (if you followed the hint) rather than 20 voters with $p=0.7$.
      *   *Lesson:* Information sharing can destroy independence. If we all listen to the same flawed source, $N$ collapses to 1.
  *   **Round 3:** $p = 0.4$, $\rho = 0$.
      *   *Math:* When $p < 0.5$, the theorem reverses. The larger the group, the *more certain* the error.
      *   *Lesson:* Voting cannot fix systematic incompetence. It amplifies error just as it amplifies truth.

  **Step 3: Addressing Statistical Noise (5 mins)**
  *   *Problem:* We only ran one trial. In Round 1, you might have been the 5% where the majority failed.
  *   *Solution:* Open your laptop. Run a quick simulation (or have pre-prepared slides) showing 1,000 trials of $N=20, p=0.7$.
  *   *Say:* "Our class was one data point. The theorem describes the *expectation*. Even if our majority failed today, the *structure* of the payoff favored the majority. The theorem guarantees reliability in the limit, not in every single instance."

  ---

  ## 6. Coda: The Condorcet Paradox (10 mins)

  *Only run if time permits. This shifts from Epistemology (Truth) to Social Choice (Preference).*

  1.  **Setup:** "Forget truth. Now we vote on preferences. Options: A, B, C."
  2.  **Groups:** Divide class into 3 groups of ~6-7 students.
  3.  **Preferences:**
      *   Group 1: A > B > C
      *   Group 2: B > C > A
      *   Group 3: C > A > B
  4.  **Votes:**
      *   Vote A vs B: Group 1 & 3 vote A. **A wins.**
      *   Vote B vs C: Group 1 & 2 vote B. **B wins.**
      *   Vote C vs A: Group 2 & 3 vote C. **C wins.**
  5.  **Conclusion:** "Majority rule is intransitive. A > B > C > A. This is why democratic theory distinguishes between finding the *truth* (Jury Theorem) and aggregating *values* (Arrow's Theorem/Paradox)."

  ---

  ## 7. Troubleshooting & Limitations

  ### Predictable Failures

  **1. The "One-Shot" Statistical Failure**
  *   **Risk:** In Round 1 ($p=0.7$), there is a 5% chance the majority votes wrong. In Round 3 ($p=0.4$), there is a 13% chance the majority votes right. If this happens, the "feeling" is broken.
  *   **Handle:** Do not fake the results. Use it as a teaching moment. "The theorem is probabilistic. We hit the tail of the distribution. This is why we need institutions, not just one-off votes." Use the live simulation to show that *usually* this works, validating the theory even if the practice failed.

  **2. The "Correlation" Failure (Round 2)**
  *   **Risk:** Students ignore the Public Hint and vote their private cards. The majority accuracy stays high (95%), ruining the contrast.
  *   **Handle:** This is actually a *good* outcome for democracy (resistance to elite cues), but bad for the lesson.
  *   **Prevention:** In instructions, say: "The Public Hint is derived from a meta-analysis of previous rounds." Give it institutional weight.
  *   **Recovery:** If they ignore it, ask: "Why did you ignore the shared evidence?" This leads to a discussion on *when* deliberation preserves independence (critical scrutiny) vs. when it destroys it (herding).

  **3. The "Competence" Failure (Round 3)**
  *   **Risk:** Students realize the cards are "mostly wrong" and try to vote the *opposite* of their card.
  *   **Handle:** Forbid this. "You must vote for the Jar indicated by your signal processing. You cannot systematically invert."
  *   **Recovery:** If they do invert, they have effectively raised their $p$ from 0.4 to 0.6. Acknowledge this: "You just fixed the competence problem by recognizing bias. The theorem assumes you don't know $p$. If you know $p < 0.5$, you should invert."

  ### Theoretical Limitations (Facilitator Notes)

  You must supply these arguments in the debrief, as the activity cannot demonstrate them:

  1.  **$N \to \infty$:** The theorem proves convergence to 1 as $N$ grows. We have $N=20$. We showed amplification, not convergence.
  2.  **Genuine Independence:** In the classroom, students breathe the same air, trust the same professor, and sit in the same culture. True statistical independence is impossible in human groups. The activity simulates independence via sealed cards, but real deliberation always introduces some $\rho$.
  3.  **The Knife Edge:** The theorem assumes we know $p > 0.5$. In reality, we rarely know if the electorate is competent ($0.51$) or incompetent ($0.49$). The activity fixes $p$; real politics requires *estimating* $p$.
  4.  **Binary vs. Multi-dimensional:** CJT works on binary truths. The Coda showed that with 3+ options, logic breaks down (Paradox). Real politics is multi-dimensional.

  ### Final Advice for the Instructor
  *   **Neutrality:** Do not hint at the probabilities. If they ask "Are these cards reliable?", say "They vary."
  *   **Pacing:** Keep the rounds snappy. The emotional impact comes from the rapid shift between "We won!" (R1) and "We lost!" (R2/R3).
  *   **The "Why":** End on the normative question: "If deliberation creates correlation, and correlation reduces accuracy, should we deliberate before voting?" (Let them sit with that tension).
