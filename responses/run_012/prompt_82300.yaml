      *   **Generating Decks:** Instructor needs a script or a pre-generated table. I will provide a Python script logic they can run once to print sheets.
      *   **The "Correlation" Trick:** In Round 2 (Deliberation), the "Public Clue" needs to be introduced *during* discussion.
      *   **Revised Sequence:**
          1.  Condition 1 (High Competence, Independent): Silent Vote.
          2.  Condition 1 (High Competence, Independent): Discussion Vote. (Should stay high).
