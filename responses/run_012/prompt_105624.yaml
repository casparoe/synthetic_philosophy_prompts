      *   **Constraints:**
          *   No summary of the original text.
          *   No survey of secondary literature.
          *   Must be a genuine prediction/reconstruction, not paraphrase.
          *   Address specific tensions: consolations depending on the existence of old age, attitude towards death if refuseable, meaning of a life without end.
          *   Be candid about limits (extrapolation vs. inference vs. guess).
          *   Format: Continuous prose, no headings/bullets/bold/tables.
          *   Style: Letter format, British English, suitable for reading aloud.
