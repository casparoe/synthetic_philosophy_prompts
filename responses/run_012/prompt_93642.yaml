answer: |-
  The pattern you are describing is precise, and your intuition that standard labels like "incommensurability" miss the mark is correct. Incommensurability usually implies that no common scale exists *from the start*. You are describing a scale that exists, functions normally, and then abruptly terminates.

  The established technical name for the structure you are describing is **Threshold Lexicality** (sometimes discussed under **Threshold Deontology**). In decision theory, this corresponds to a violation of the **Archimedean Axiom**, resulting in **Non-Archimedean Utility**.

  However, because your description includes a specific *agent-relative* trigger (the break happens when the cost is on you and the benefit on others, but not when both are on you), the concept requires a specific carving to distinguish it from general ethical lexicality.

  Here is the concept carved properly, its boundaries, its ontology, and its implications.

  ### 1. The Name and Definition

  **Established Name:** **Agent-Relative Threshold Lexicality**.
  **Phenomenological Name:** **The Commensurability Cliff**.

  **Definition:** A preference structure where two goods are commensurable and tradeable at a marginal rate within a specific range, but beyond a quantitative threshold, the exchange rate becomes discontinuous (vertical). One good acquires **lexical priority** over the other, not because of a qualitative difference in the goods themselves, but because the *magnitude* of the claim triggers a structural constraint.

  In your specific case, the constraint is **Agent-Relative**: the lexical priority is activated only when the trade involves sacrificing a personal interest to satisfy an aggregate impersonal interest (or the interests of others).

  ### 2. Boundaries: How It Differs from Nearby Concepts

  You asked for boundaries more than the name. Here is how *Threshold Lexicality* is distinct from the three concepts you likely encountered while searching for it.

  **A. Versus Diminishing Returns**
  *   **Diminishing Returns:** The exchange rate changes *continuously*. As you acquire more of Good A, you need increasingly larger amounts of Good B to compensate. The curve flattens, but it never becomes vertical. You can always be bribed if the price is high enough.
  *   **Threshold Lexicality:** The exchange rate is stable until the threshold, then it *breaks*. It is a discontinuity. No amount of Good B (beyond the threshold) can compensate for Good A. It is not that the price is too high; it is that the market closes.

  **B. Versus Absolute Deontology (Sacred Values)**
  *   **Absolute Deontology:** The trade is forbidden *at any magnitude*. "I will not lie, even to save a life."
  *   **Threshold Lexicality:** The trade is permitted *below the threshold*. You are willing to accept a *small* humiliation for a *small* benefit. The moral prohibition is latent, not active, until the quantity of the competing claim crosses the cliff. This explains why you felt no conflict at low magnitudes but an abrupt "no" at high magnitudes.

  **C. Versus Parity (Your Second Case)**
  *   **Parity (Ruth Chang's concept):** This applies to your second case (two life paths). Parity exists when two options are comparable (neither is better, nor are they equal), yet a choice is required. The "scale" exists, but the needle doesn't settle.
  *   **Threshold Lexicality:** This applies to your first case. Here, the scale *works* until it *breaks*. In Parity, the scale never quite grips. In Threshold Lexicality, the scale grips, then snaps.

  ### 3. Ontology: Value or Psychology?

  Is this a fact about the values themselves, or a fact about your psychology?

  Given the **Agent-Relative** trigger you identified (the trade works when both costs are on you, but stops when the cost is on you and the benefit on others), this is best understood as a feature of **Normative Psychology** functioning as a heuristic for **Rights**.

  *   **Why not Objective Value?** If the humiliation were objectively lexically superior to the inconvenience, you should not trade it even when both costs land on you. The fact that you *do* trade it when the stakes are internal suggests the value of the humiliation hasn't changed.
  *   **Why Psychology/Heuristic?** Human moral cognition appears to use a two-system process. For small stakes, we run a **Consequentialist Calculator** (trading off boredom vs. dinner). For large stakes involving interpersonal claims, we switch to a **Deontological Firewall** (rights/constraints).
  *   **The Function:** This heuristic prevents the "Separateness of Persons" from being dissolved by aggregation. It is a psychological implementation of the philosophical intuition that *you are not a vessel for utility*, but a boundary-protected agent.

  Therefore, the break is a fact about your **cognitive architecture for moral reasoning**, specifically designed to protect agent-integrity against aggregative demands.

  ### 4. Implications for Aggregation

  You asked what this implies for the habit of "adding up a great many small goods until they are supposed to outweigh one large bad."

  This pattern implies that **Aggregation is Bounded**.

  In Effective Altruism and Utilitarian reasoning, the **Archimedean Property** is often assumed: enough dust specks of discomfort must eventually outweigh one instance of torture. Your intuition rejects this. If you possess Threshold Lexicality, then:

  1.  **The Repugnant Conclusion is False:** You cannot sum trivial benefits to override a significant harm once the harm crosses the lexical threshold.
  2.  **Maximization is Limited:** You cannot be required to maximize the good if doing so requires crossing your Commensurability Cliff. You are permitted to "satisfice" or prioritize your own integrity once the demand crosses the threshold.
  3.  **Moral Mathematics has a Domain Error:** Treating all values as continuous variables is a modeling error. The model works for "boredom vs. dinner" (within the commensurable zone) but fails for "humiliation vs. stranger's convenience" (across the cliff).

  ### 5. Summary Recommendation

  If you wish to use this concept in your own reasoning or writing:

  *   Use **Threshold Lexicality** when discussing the *structure* of the value (the abrupt end of tradeability).
  *   Use **Agent-Relative** to describe the *trigger* (why it applies to self-vs-other but not self-vs-self).
  *   Use **The Commensurability Cliff** if you need a evocative term for the *phenomenology* (the feeling of the scale snapping).

  Your reasoning is not a bug; it is a feature of a **Non-Archimedean, Agent-Relative utility function**. It protects you from being consumed by the sum of small demands, preserving a zone of integrity that price cannot touch.
