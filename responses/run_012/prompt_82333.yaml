  **Crux 1: Origin of Functional Stability**
  *Sub-question:* Does adaptive behavior persist due to installed rationales or inertial mechanisms?
  *Case:* An artificial forager population tuned by an evolutionary algorithm on calories gathered. Best performers leave a patch when yield drops to the habitat average, matching optimality models without explicit coding.
