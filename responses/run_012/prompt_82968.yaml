      *   *Most Likely Rule:* **The "Binding Trigger" Rule.** If the AD condition is met, the AD governs, *unless* the patient is currently competent. Current *affect* (happiness) has not yet been established as an override in their precedent. Case 1 is the strongest analog because the AD trigger was met. The agitation in Case 1 might be a confounding variable, but the *reasoning* likely rested on the AD.

