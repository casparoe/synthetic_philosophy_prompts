      *   **Rule B: The "Current Best Interest/Well-Being" Rule.**
          *   *Principle:* ADs are evidence of values, but the primary duty is to the current patient's welfare. If the current patient is content, treat.
          *   *Fit with Past:* Fits Case 1 (agitated = suffering = don't treat). Fits Case 2 (doing fine = treat). Fits Case 3 (no evidence of suffering/futility = treat). Case 4 is tricky (competent wish usually trumps best interest, but consistent with respecting agency).
