      *   *Future Case:* **No AD + Patient Suffering.** If they stop treatment -> They care about Suffering (Best Interest). If they continue -> They care about Authorization (Precedent Autonomy). Case 3 hints at Authorization, but "begged to stop" is family, not patient suffering.
      *   *Let's go with:* **A patient with a valid AD triggering refusal, who is currently competent enough to say "I want treatment" but not enough to legally revoke.** (Wait, Case 4 covers competence).
