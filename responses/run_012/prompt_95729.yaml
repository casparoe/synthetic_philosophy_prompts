  Looking at the committee's history, the rule you have actually been running is the **Residency Principle**. In both the council tax and incinerator cases, the deciding factor was whether the individual was on the local electoral register or domiciled within the city boundary. In the first instance, non-resident property owners were excluded despite their financial stake; in the second, non-resident neighbours were excluded despite suffering the physical externality. The boundary line itself has been your proxy for legitimacy.

  There are, however, other rules that fit your record just as well. Consider the **Daily Presence Principle**: anyone who spends the majority of their waking hours within the city gets a say. This fits the council tax record (residents are home, owners abroad are not) and the incinerator record (residents breathe the air daily, border neighbours less so). Under this rule, the commuters would be eligible to vote, as they are here five days a week. Alternatively, a **Direct Liability Principle** suggests that anyone directly charged by the measure should vote. This fits the council tax case (residents pay) and the incinerator case (neighbours didn't pay a tax, merely suffered smoke). Under this rule, the commuters must vote, as they are the ones being levied.

  The closest analog to this new proposal is the **council tax rise**. Both are fiscal measures extracting money from individuals based on their connection to the city. In that case, you determined that a financial connection (ownership) without residency was insufficient for the franchise. The commuters are in the identical position: a financial connection (wages) without residency.

  Which call would I make? I would recommend you **exclude them**. While 'no taxation without representation' is a stirring slogan, your committee's jurisprudence is built on administrative clarity and boundary integrity, not stakeholder theory. If you admit commuters now, you undermine the precedent set with the absentee landlords and the border neighbours, opening the door to endless challenges about who counts as 'affected'. The commuters vote in their home suburbs; if this levy is unjust, their own councils should challenge it, not your electorate. To change the rule now looks less like democracy and more like rigging the register to ensure the levy passes.

  To pin down which rule you are truly on, your next test case should be a **visitor levy on hotel stays**. Tourists are non-residents who pay the charge but have no daily presence beyond a few days. If you let them vote, you are running a Liability Rule. If you exclude them, you are confirmed as strict Residency purists.

  Verdict: no — the Residency Principle
