prompt: |-
  I'm a software engineer, no philosophy training, and I've been sitting in on a reading group my flatmate runs about accuracy-first epistemology — the idea that what makes a credence good is just that it's accurate, and that you grade a whole set of credences with a proper scoring rule, basically the same machinery we use at work to score forecasters. What I can't get past is that the framework seems to run fine on either of the two scores I actually know, and I can't tell whether that's a feature or a bug. The two are the Brier score (for each question take your probability, subtract 1 or 0 depending on how it turned out, square that, add it up; lower is better) and the log score (add up the log of the probability you gave to what actually happened; closer to zero is better). At work we use log loss because that's what the library hands us, and we clip probabilities at 1e-15 so that a confidently wrong prediction doesn't come back as -infinity, which makes me wonder how much of the gap between the two is a real difference and how much is an artifact of nobody ever being actually certain.

  So: compare them as two candidate answers to "what is it for a set of credences to be accurate, and why should that matter?", and be specific about where they truely come apart rather than where they merely look different. I tried to construct a case myself and I'm not confident in it. One question, three possible answers, the truth is answer 1: credence set P is (0.5, 0.25, 0.25) and set Q is (0.55, 0.45, 0). Brier: P sums to 0.375 and Q to 0.405, so Brier likes P. Log: ln 0.5 against ln 0.55, so about -0.69 against -0.60, so log likes Q. If that's right, I want to know what that split is a symptom of. Someone in the group also said the log score is picked out uniquely by some theorem while Brier is just one option among many — is that right, and unique in what respect? And does one of them have a clean split into a calibration part and a resolution part, and if so does that tell us anything about which is the better theory of epistemic goodness? I don't need citations or a reading list. What I do want is for you to keep what's actually settled (theorems, points both sides accept) seperate from what's genuinely contested among people who work on this, and not to hand me one side of a live disagreement as if it were the consensus.
