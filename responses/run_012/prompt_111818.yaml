answer: |-
  Your calculation is correct, and your intuition that this divergence is significant is spot on. You have stumbled onto the central technical friction in accuracy-first epistemology.

  Here is the breakdown of where the math is settled, where the philosophy is contested, and what your specific example reveals about the two competing theories of accuracy.

  ### 1. The Settled Mathematical Ground
  First, let's clear the deck on what is not up for debate. Both the Brier score and the Log score are **strictly proper scoring rules**.

  *   **What this means:** If your goal is to minimize your expected score (or maximize expected log score), the only strategy that achieves this is to report your true credences. If you believe an event is 70% likely, reporting 70% yields a better expected score than reporting 60% or 80%, under *both* systems.
  *   **Why this matters:** This is why accuracy-firsters can use them at all. If a scoring rule wasn't proper, it would incentivize you to distort your beliefs to game the score, which defeats the purpose of measuring epistemic accuracy.

  Both frameworks agree on the "big picture": Accuracy is the fundamental epistemic good, and proper scoring rules measure it. They disagree on *which* proper scoring rule maps onto our intuitive notion of "epistemic virtue."

  ### 2. Your Example: Truth-Centric vs. Distribution-Centric
  Your example ($P$ vs. $Q$) highlights the single biggest conceptual split between the two scores.

  *   **Log Score is Local (Truth-Centric):** The Log score for a specific outcome depends *only* on the probability assigned to that outcome. It does not care what you thought about the other options. In your example, $Q$ assigned higher probability to the truth (0.55 vs 0.50). The Log score rewards this immediately. It ignores that $Q$ was confidently wrong about option 2 (0.45) or certain about option 3 (0).
  *   **Brier Score is Global (Distribution-Centric):** The Brier score measures the Euclidean distance between your probability vector and the ideal "truth vector" (1 for truth, 0 for falsehoods). It cares about the whole distribution. In your example, $Q$ was penalized heavily for assigning 0.45 to option 2. Even though $Q$ was more right about option 1, it was "further away" from the ideal vector overall because it misplaced mass on option 2. $P$ was more "spread out" and humble about the falsehoods.

  **The Philosophical Split:**
  *   **The Log View:** Epistemic value is about **identifying the truth**. If I believe the truth more strongly than you do, I am more accurate, regardless of how I distribute my error among the falsehoods.
  *   **The Brier View:** Epistemic value is about **modeling the world**. A probability function is a model of reality. A model that puts significant weight on a specific falsehood (like $Q$'s 0.45 on option 2) is structurally worse than a model that is uncertain, even if the latter assigns slightly less probability to the truth.

  ### 3. The "Unique Theorem" Claim
  Your flatmate is partially right, but the context matters.

  **Settled Math:** The Log score is uniquely characterized by the property of **Locality**.
  If you demand that the score assigned to a proposition $A$ depends *only* on the probability assigned to $A$ (and not on $\neg A$ or other alternatives), the Log score is the *only* strictly proper scoring rule that satisfies this (up to linear transformation).

  **Contested Philosophy:** Is Locality a virtue or a bug?
  *   **Pro-Log:** Belief is binary in content (you believe $A$ or you don't). The accuracy of believing $A$ shouldn't depend on how you carve up the rest of possibility space.
  *   **Pro-Brier:** Credences are holistic. Assigning 0.9 to $A$ means assigning 0.1 to $\neg A$. If $\neg A$ contains a specific dangerous falsehood, you *should* be penalized for not ruling it out. Many accuracy-firsters argue that Locality is actually a defect because it ignores the structure of the possibility space.

  So, Log is unique *if* you assume Locality is a requirement. But there is no consensus that Locality *is* a requirement.

  ### 4. The Zero/Infinity Issue (Clipping vs. Regularity)
  You mentioned clipping probabilities at work to avoid $-\infty$. In engineering, this is a pragmatic fix for finite data. In epistemology, it touches on a normative principle called **Regularity**.

  *   **The Issue:** Log score assigns $-\infty$ penalty to assigning 0 credence to a truth. Brier assigns a finite penalty (1.0).
  *   **The Regularity Principle:** Many epistemologists argue you should *never* assign 0 or 1 to any contingent proposition. You should always leave a "crumb" of doubt.
  *   **If Regularity is true:** You never actually hit $-\infty$. The Log score is always finite. The difference becomes one of degree: Log score penalizes near-certainty in error *much* more harshly than Brier.
  *   **If Regularity is false:** If it is permissible to be certain, Log score says being certain and wrong is infinitely worse than being uncertain and wrong. Brier says it's just finitely worse.

  **The Split:** This isn't just an artifact. It reflects a disagreement about **dogmatism**.
  *   **Log Score:** Treats dogmatic error as the ultimate epistemic sin (lexically prior to all other errors).
  *   **Brier Score:** Treats dogmatic error as very bad, but trade-off-able against other gains (like assigning higher probability to the truth, as in your example).

  ### 5. Calibration and Resolution
  You asked about the split into calibration and resolution.

  **Settled Math:** The Brier Score admits the **Murphy Decomposition**.
  $$ \text{Brier Score} = \text{Calibration} + \text{Resolution} - \text{Uncertainty} $$
  *   **Calibration:** Do your 70% predictions come true 70% of the time?
  *   **Resolution:** How much do your predictions differ from the base rate? (Are you actually saying anything informative?)
  *   **Uncertainty:** The inherent entropy of the events (outside your control).

  The Log Score does not have a clean, additive decomposition that is universally accepted in the same way.

  **Contested Philosophy:** Does this decomposition make Brier better?
  *   **Pro-Brier:** Epistemic value is a composite of being calibrated (honest) and having resolution (informative). A theory of accuracy should make this trade-off explicit.
  *   **Pro-Log:** Calibration is derivative. If you maximize Log accuracy (information), calibration tends to follow as a long-run consequence. Decomposing it might double-count virtues. Some argue the Brier decomposition encourages "gaming" calibration at the expense of truth-tracking.

  ### 6. Summary: Feature or Bug?
  To answer your core question: The fact that the framework runs on both is a **feature** of the mathematics (both are proper), but the fact that they rank your $P$ and $Q$ differently is a **bug** for the hope of a single, unified theory of accuracy.

  It forces the reading group to choose a stance on these questions:

  1.  **Holism:** Does accuracy depend only on the truth (Log) or the whole probability distribution (Brier)?
  2.  **Severity:** Is being confidently wrong infinitely bad (Log) or just quadratically bad (Brier)?
  3.  **Structure:** Is epistemic value best understood as a single scalar of information (Log) or a balance of calibration and resolution (Brier)?

  **Recommendation for the Group:**
  If you want to press the discussion, use your example. Ask the group: *"In this specific case, agent Q was more right about the truth, but more wrong about the alternatives. Is Q more accurate than P?"*
  *   If they say **Yes**, they are implicitly committed to the Log Score (or a local rule).
  *   If they say **No**, they are implicitly committed to the Brier Score (or a global rule).

  There is no mathematical theorem that resolves this. It is a normative choice about what kind of epistemic agent we want to be: one who hunts the truth above all else (Log), or one who builds a faithful map of the entire possibility space (Brier).
