prompt: |-
  Bit of context: I'm a second-year nursing student, and last spring I did a rotation in the neuro ICU, and right around then a close family friend was declared brain dead after an aneurysm — and his family had to decide about donation while he was still, you know, warm and breathing on the vent. That whole thing sent me down a rabbit hole reading about how we actually define death, and it turns out the answer is way messier than the pamphlet they handed us. Next month my ethics seminar is hosting a guest, a philosopher/bioethicist who's known for a pretty provocative line: she thinks the whole-brain criterion is basically a legal fiction cooked up so hospitals could take organs without anyone having to feel like a murderer, and that the intellectually honest fix isn't to keep tinkering with the definition of death but to scrap the dead-donor rule outright — just admit we're killing patients who've permanently lost what made them persons, and then argue about when that's permissible. I've been asked to run the Q&A after her talk, so I need questions that actually push on her view instead of letting her do the usual TED-talk summary.

  So: give me eight to ten questions, each with a follow-up keyed to the answer she's most likely to give. I want at least one question on the integration objection — the fact that some brain-dead bodies on ventilators still heal wounds, fight off infections, regulate temperature, even carry pregnancies to term, which some people say proves the organism is still alive and it's the *person* who's gone, not the life — and if she bites that bullet, the follow-up should press on whether she's now committed to saying those bodies are alive-but-not-persons, and whether that's a stable place to stand. At least one on donation after circulatory death and the two-to-five-minute rule, i.e. whether she thinks those donors are already dead, or whether her own view implies the surgeons are killing them and everyone has just quietly agreed not to say it out loud. At least one that turns her own move against her: if we ditch the dead-donor rule, what principled line stops us from harvesting from people in a persistent vegetative state, or from advanced dementia patients who've lost the relevant capacities too — does she have a non-question-begging answer, or does it come down to a bare intuition about who counts. And one closing question about what evidence or argument would actually change her mind, or whether her position is even the kind of thing evidence could touch.

  Keep the whole thing under 900 words. Don't give me a bibliography or cite anybody, and don't explain the debate to me — I've read plenty. I just want the questions and follow-ups, phrased the way I'd probaly actually say them out loud, and definately phrased so she can't dodge with a canned answer.
