  5.  **Drafting the Audit - Section by Section:**

      *   **Introduction:** Acknowledge the power of the analogy (it's intuitive) but state the thesis (it fails on ontology).
      *   **The Mapping (Table):** Keep it clean. Ball = Agent, Surface = Opportunity Structure, Friction = Discrimination/Norms, Trajectory = Career Path, Initial Velocity = Innate Preference.
      *   **The Breakages (Filtering for the Deciders):**
          *   *Decider 1: Preference Constitution.* Physics balls don't learn. Humans do. Preferences are endogenous, not exogenous. You can't subtract the socialization to find the "real" preference because the preference was built *by* the socialization.
