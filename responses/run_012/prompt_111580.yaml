  3.  **Identify Critical Breakages (The "Deciders"):**
      *   *Breakage 1: The Nature of the Object (Passive vs. Constituted).* In physics, the ball's mass/shape exists *before* the roll. In sociology, preferences are formed *during* the friction. You can't subtract socialization to find a "pre-social" self. This attacks the "nature" claim.
      *   *Breakage 2: The Nature of the Field (Static vs. Dynamic).* In physics, gravity/surface are independent of the ball. In society, the "field" (economy, value of jobs) changes *because* of the choices. Also, "egalitarianism" isn't just removing friction; it's changing the terrain (e.g., welfare state allows *more* risk, which might look like "choice" but is actually structural affordance).
