  ### Brainstorming Candidate Lines

  1.  *"You are the reason nothing can be changed."* (Fits Mother's agency, Narrator's lock on identity, Unconceived's absence as condition.)
  2.  *"There is no other way to be here now."* (Metaphysical necessity; fits all persons.)
  3.  *"You chose the flood instead of the higher ground."* (Specific action; fits Mother best, but echoes as metaphor for others.)
  4.  *"You are the debt that cannot be repaid."* (Obligation without creditor; fits Narrator and Mother.)
  5.  *"The stranger waits behind the closed door."* (The alternative person; fits the "other" in any stanza.)
  6.  *"You are the name we never spoke aloud."* (Fits Unconceived primarily, but could fit Narrator's suppressed self.)
  7.  *"I learned to breathe the air the water left."* (Survival; fits Narrator.)
  8.  *"The silence fills the space where you should be."* (Absence; fits Unconceived.)

  **Selection:**
  I am choosing *"You are the reason nothing can be changed"* and *"There is no other way to be here now"* as the repeating anchors (S1 L2 and S1 L4). They carry the metaphysical weight of the non-identity problem (fixity of identity) without explicitly stating the philosophy. They allow the "You" to drift from the agent (Mother) to the subject (Narrator) to the counterfactual (Unconceived) while remaining grammatically identical.

