  **STATE DEPARTMENT OF MOTOR VEHICLES**
  **SPECIAL OPERATIONS DIVISION**
  **DRIVER RESPONSIBILITY MANUAL: SECTION 7**

  **7.1 The Indistinguishable Exit Corridor**
  Upon entering Zone 4 (the "Piccione Corridor"), drivers will encounter two exits that are visually identical. Due to standardized foliage placement and lighting uniformity, a driver cannot determine whether they are at the first or second exit upon arrival. Furthermore, drivers who pass the first exit will undergo mandatory procedural amnesia regarding that passage. Consequently, conditional strategies (e.g., "exit if I feel tired") are prohibited. Drivers must select a single probability of continuation, $p$, prior to entering the zone. This probability must be applied identically at both exits.

  **7.2 Optimal Mixed Strategy**
  To maximize statewide throughput and payoff efficiency, the Department mandates a continuation probability of $p = 2/3$. Drivers must exit with probability $1/3$. This ratio is not a suggestion; it is the ex-ante optimal solution. Deviating from this ratio reduces expected utility for the driver and complicates actuarial tables for the state.

  **7.3 Approved Randomization Devices**
  Human intuition is statistically biased and constitutes a "pseudo-random habit," which is punishable by fine. Drivers must utilize an approved randomization device to determine action at each exit. Approved devices include:
  *   The Dashboard Analog Randomization Dial (ARD).
  *   A standard six-sided die stored in the glove compartment (continue on roll 1–4).
  *   A weighted coin issued at the toll booth.

  *Notice:* Proposal 88-B to install distinct signage on Exit 1 and Exit 2 was rejected by the Infrastructure Committee. Signage would render the corridor trivial and invalidate the existing budget allocation for randomization signage.

  **7.4 Temporal Consistency and Liability**
  Drivers may experience conflict between their pre-entry plan ($p=2/3$) and their preference upon reaching an exit. A **Resolute Driver** adheres to the initial plan despite changing incentives. A **Sophisticated Driver** recalculates optimal probability upon arrival, recognizing the time inconsistency. The Department declines to endorse either methodology. In the event of existential divergence between the driver who entered the zone and the driver exiting it, liability remains with the license holder.

  **Commissioner Statement:**
  *"The corridor is not designed to be intuitive. It is designed to be optimal. If the driver knows where they are, they are driving too slowly."* — H. Vance, Safety Commissioner

  ***

  **SAMPLE WRITTEN TEST QUESTIONS**

  **Q14:** You are entering the Indistinguishable Exit Corridor. Your goal is to maximize expected payoff. What is the legal probability of continuing past the first exit?
  **A:** $0.66$ (repeating).

  **Q15:** You arrive at an exit and feel certain it is the second one. You should:
  **A:** Ignore the feeling and consult your randomization device.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Is it legal to forget I passed the first exit?**
  **A:** Forgetting is not only legal; it is a prerequisite for operating in Zone 4. If you retain memory of the first exit, you are required to report to a cognitive recalibration center.

  **Q: If I choose to continue at the first exit, am I the same driver who planned to exit?**
  **A:** The Department does not rule on metaphysical identity. You are the same driver for the purposes of insurance premiums and traffic citations.

  **Q: Why can't I just look at the odometer?**
  **A:** Odometer reading is considered conditional information. See Section 7.1.

  ***

  *Footnote 1: The protocols outlined in Section 7 are based on external theoretical models. The Department of Motor Vehicles did not originate the concept of procedural amnesia and accepts no responsibility for the philosophical implications thereof.*
