answer: |-
  # The Spec: Requirements for a Definition of Life
  **Context:** Biosignature assessment (single sample, unknown chemistry, no temporal observation).
  **Goal:** To establish what a definition must *do*, not just what it must *say*.

  ## 1. The Requirements List
  For each requirement, I have listed the pressure case, the justification, and whether it is a hard constraint or a theoretical prejudice.

  ### A. Substrate Neutrality
  *   **The Case:** Alien biochemistry (e.g., silicon-based, ammonia solvent, or non-cellular).
  *   **The Requirement:** The definition cannot reference specific molecules (DNA, proteins, lipids) or specific thermodynamic gradients (water-liquid). It must describe *relationships* or *functions*, not materials.
  *   **Verdict:** **Non-negotiable.** Any definition referencing "carbon" or "cell membranes" is a description of Earth life, not life itself. It fails the biosignature spec immediately.

  ### B. Decidability on a Static Sample
  *   **The Case:** You have one scoop of ice. You cannot watch it grow, divide, or respond. You cannot run a generation time.
  *   **The Requirement:** The definition must allow for inference of *capacity* from *structure*. It cannot require observation of a process over time (e.g., "must reproduce" is impossible to verify here).
  *   **Verdict:** **Non-negotiable (for your context).** This is the operational constraint. Most philosophical definitions fail this. If a definition requires observing a lineage, it is useless for a single-sample biosignature protocol.

  ### C. The Dormancy Clause (Potentiality vs. Actuality)
  *   **The Case:** A seed in a drawer; a frozen tardigrade; a bacterial endospore. Metabolism is effectively zero.
  *   **The Requirement:** The definition must distinguish between a *paused* living system and a *dead* one, without relying on current metabolic flux. It must rely on the preservation of the *mechanism* to resume.
  *   **Verdict:** **Non-negotiable.** If "metabolism" is a strict requirement, seeds are dead. The definition must shift from "is metabolizing" to "holds the organized capacity to metabolize."

  ### D. The Sterility Clause (Individual vs. Lineage)
  *   **The Case:** A mule; a worker ant; a post-menopausal human.
  *   **The Requirement:** The definition cannot require the *individual* to reproduce. It must locate the reproductive requirement at the *lineage* or *system* level, while allowing non-reproducing nodes to count as "alive."
  *   **Verdict:** **Non-negotiable.** Empirically false to require individual reproduction. However, this creates tension with Requirement B (how do you verify lineage capacity on a static sample?).

  ### E. The Boundary Problem (Individuality)
  *   **The Case:** A lichen (fungus + alga); a Portuguese man o' war (colony); a slime mold (sometimes one cell, sometimes many); Thought Experiment B (global mixing medium).
  *   **The Requirement:** The definition must state whether "life" is predicated of a *physical object* with a boundary or a *process* that can be diffuse.
  *   **Verdict:** **Prejudice (but necessary for you).** Philosophically, life could be boundary-less (Thought Exp B). Practically, for a biosignature, you need to isolate a *sample*. If life has no boundary, you cannot scoop it. You must legislate a "unit of analysis" even if nature doesn't respect it.

  ### F. The Hierarchy Clause (Nested Life)
  *   **The Case:** Mitochondria; chloroplasts; the human microbiome.
  *   **The Requirement:** The definition must allow an entity to be "alive" at one scale and "machinery" at another. A mitochondrion was once a bacterium; now it is an organelle.
  *   **Verdict:** **Non-negotiable.** Life is recursive. A definition that forces a binary "Alive/Not Alive" on all scales creates false positives (organelles) or false negatives (symbiotic consortia).

  ### G. The History Clause (Evolution vs. Maintenance)
  *   **The Case:** Thought Experiment A (Self-maintaining reactor, no inheritance); Viruses (evolve, but no independent maintenance).
  *   **The Requirement:** The definition must decide if *history* (evolution) is essential, or if *current state* (autonomy) is sufficient.
  *   **Verdict:** **The Conflict Point.** This is where the spec breaks. See Section 3.

  ### H. The Mortality Clause
  *   **The Case:** Hydra, Turritopsis (biologically immortal organisms); Thought Experiment A (reactor might run forever).
  *   **The Requirement:** The definition cannot build "death" into "life." Aging is a contingent trait, not a defining one.
  *   **Verdict:** **Non-negotiable.** Empirical error to require death.

  ---

  ## 2. Case Pressure Summary
  *   **Viruses/Prions/Viroids:** Pressure the **Autonomy** requirement. They evolve but don't maintain themselves. If you demand autonomy, they aren't life. If you demand evolution, they are.
  *   **Plasmids:** Pressure the **Individuality** requirement. They are genetic parasites without boundaries.
  *   **Minimal Synthetic Cell:** Pressures the **Origin** requirement. If life requires "natural selection," is engineered life alive? (Verdict: Yes, origin is irrelevant to current state).
  *   **Mule:** Pressures **Reproduction**. (Verdict: Reproduction is a property of the lineage, not the specimen).
  *   **Seed/Tardigrade:** Pressures **Metabolism**. (Verdict: Metabolism must be defined as a *capacity*, not a *rate*).
  *   **9am Alive / Noon Dead:** Pressures **Materialism**. The atoms didn't change; the *organization* did. Life is a state of matter, not a type of matter.
  *   **Lichen/Man o' War:** Pressures **Unit Selection**. Is the life the fungus, the alga, or the pair? (Verdict: The consortium is the functional unit).
  *   **Mitochondria:** Pressures **Nested Life**. (Verdict: They are alive historically, dead functionally. A definition must handle time-dependent status).
  *   **Thought Exp A (Reactor):** Pressures **Evolution**. It maintains and grows but doesn't evolve. Metabolism-first says "Life." Evolution-first says "Fire/Crystal."
  *   **Thought Exp B (Global Medium):** Pressures **Individuality**. If the whole planet is one mixing pattern, there is no "organism." Evolution-first might accept it; Autonomy-first rejects it (no self/other boundary).

  ---

  ## 3. The Impossible Spec (Incompatibilities)
  You suspected a tension. It is real. You cannot satisfy all requirements simultaneously.

  **The Conflict:** **Decidability on a Static Sample (Req B)** vs. **Capacity for Darwinian Evolution (Req G).**

  *   **The Problem:** The most robust theoretical definition of life is "A self-sustaining chemical system capable of Darwinian evolution" (NASA). This handles fire (no evolution) and crystals (no open-ended evolution).
  *   **The Clash:** You cannot verify "Capacity for Evolution" on a single static sample without making assumptions about the chemistry. To know if something *can* evolve, you usually need to see it change over generations or identify a specific replication mechanism (like DNA). If the alien chemistry is unknown, you cannot identify the replication mechanism.
  *   **The Cost:**
      *   If you prioritize **Decidability (Biosignature Utility)**: You must rely on structural markers (complexity, disequilibrium). This risks false positives (weird geology looks like life).
      *   If you prioritize **Evolutionary Capacity (Theoretical Rigor)**: You admit you cannot confirm life on a single scoop. You need time-series data.
  *   **Who Gives Ground:** The **Theorists** must give ground. For your specific role (biosignature advice), a definition that requires observing evolution is a non-starter. You must adopt a **Proxy Definition**: "Structure implies capacity." You assume that if the complexity/disequilibrium is high enough, evolution *was* possible, even if you can't prove it.
  *   **Resolution:** The definition must shift from "Is evolving" to "Bears the structural scars of having evolved" or "Possesses the informational density required to evolve."

  ---

  ## 4. The Killer Requirement
  **"The requirement for a discrete, physically bounded individual."**

  This single requirement knocks out the most otherwise popular answers and creates the most friction with alien possibilities.
  *   **Why:** It eliminates Thought Experiment B (Global Medium). It makes the Lichen/Man o' War problematic (is it one or many?). It forces a distinction between "Life" and "Ecosystem" that may not exist on other worlds.
  *   **Impact:** It favors **Autonomy/Self-Maintenance** views over **Process/Evolution** views. It forces you to look for a "cell" equivalent. If life is a planetary-scale atmospheric process with no discrete units, a definition requiring individuality will classify the whole planet as "dead" or "geology," missing the life entirely.
  *   **Recommendation:** For your biosignature work, you cannot drop this (you need to scoop something). But you must acknowledge it is a **methodological prejudice**, not a truth about life.

  ---

  ## 5. Scoring the Contenders
  *Light scoring based on your Spec, not general philosophy.*

  **1. Metabolism-First (Life = Thermodynamic Disequilibrium)**
  *   **Verdict:** High utility for static samples (you can measure chemical gradients), but high false-positive risk. Fire and hurricanes maintain disequilibrium. It struggles with viruses (no metabolism) and seeds (no active metabolism).
  *   **Fit for Spec:** Good for detection, bad for definition.

  **2. Evolution-First (Life = Darwinian System)**
  *   **Verdict:** Theoretically strongest. Clears out fire/crystals. Handles viruses well. **Fails your Spec** because you cannot measure evolution on a single frozen sample without assuming the replication mechanism.
  *   **Fit for Spec:** Excellent conceptually, operationally impossible for you.

  **3. Autonomy/Self-Maintenance (Life = Bounded System preserving itself)**
  *   **Verdict:** Handles seeds (capacity) and mules well. Struggles with viruses (not autonomous) and Thought Experiment B (no boundary). Good for defining the "unit" to scoop.
  *   **Fit for Spec:** Strongest compromise for biosignatures, provided you accept "potential autonomy."

  **4. Deflationism (Life = A Cluster Concept with no Essence)**
  *   **Verdict:** Philosophically honest. Practically useless. You cannot write a protocol for "family resemblance."
  *   **Fit for Spec:** Reject. You need a decision boundary, not a spectrum.

  **Final Advice for the Handout:**
  Don't ask the group to agree on what life *is*. Ask them to agree on what life *looks like* when you can only take one picture. The definition for a biosignature hunt is not a truth claim; it is a **filter design**. The tension isn't between life and non-life; it's between **risk of false positive** (calling geology life) and **risk of false negative** (calling alien life geology). Your definition is just the setting on that dial.
