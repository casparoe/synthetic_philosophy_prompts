answer: |-
  # Session Plan: The Grip of Use (Wittgenstein)

  **Course:** Upper-Level Philosophy of Language
  **Class Size:** 16 Students
  **Duration:** 90 Minutes
  **Goal:** To move students from reciting Wittgensteinian slogans ("meaning is use," "family resemblance") to experiencing the *necessity* of those views by encountering the failure of essentialism firsthand.

  ---

  ## Part 1: Materials & Preparation

  ### 1. The "Dax" Protocol (Movement 1)
  *   **Props:** A hammer, a pen, a coffee mug, a pair of glasses, a textbook.
  *   **The Secret Rule:** An object is a **"Dax"** if and only if it is **currently being employed for its intended function by a human agent.**
      *   *Hammer:* Dax only when swinging/holding to hit. Not Dax on the table.
      *   *Pen:* Dax only when writing. Not Dax in a pocket.
      *   *Glasses:* Dax only when worn on eyes. Not Dax on the nose (pushed up) or in hand.
      *   *Mug:* Dax only when drinking or holding for drinking. Not Dax as a pencil holder.
  *   **Why this rule?** It forces students to look at *contextual use* rather than *intrinsic properties*. They will apply the term correctly long before they can articulate the rule, because the rule is relational, not categorical.

  ### 2. The "Game" Decks (Movement 2)
  Prepare four distinct decks (A, B, C, D). Each deck contains 20 cards. Each card has a single description.
  *   **Deck A (The Competition Bias):** Chess, Soccer, Poker, Boxing, Tennis, Checkers, Bridge, Go, Rugby, Wrestling, Debate Club, Court Trial, War (actual), Election, Stock Trading, Solitaire (excluded), Tag (excluded), Make-Believe (excluded), Juggling (excluded), Sleeping.
  *   **Deck B (The Solitary/Skill Bias):** Solitaire, Juggling, Yo-Yo Tricks, Speed Cubing, Patience, Puzzle (Jigsaw), Video Game (Single Player), Practice Drills, Meditation, Running (Solo), Swimming (Laps), Dancing (Solo), Painting, Writing, Reading, Chess (excluded), Soccer (excluded), Poker (excluded), Tag (excluded), War.
  *   **Deck C (The Play/Pretend Bias):** Make-Believe, House, Dungeons & Dragons, Tag, Hide & Seek, Improv, Ring Around the Rosie, Duck Duck Goose, Roughhousing, Playground Play, Sandcastles, Dolls, Action Figures, Roleplay, Cosplay, Chess (excluded), Solitaire (excluded), Court Trial, Work, Sleep.
  *   **Deck D (The Rule/Procedure Bias):** Chess, Monopoly, Scrabble, Court Trial, Religious Mass, Parliamentary Procedure, Traffic Flow, Queueing, Grammar, Mathematics, Computer Code, Protocol, Ritual, Ceremony, Liturgy, Tag (excluded), Make-Believe (excluded), Juggling, Sleeping, Eating.

  **The "Poison Pill" Cards (Instructor Reserve):**
  Keep these aside to introduce during the final whole-class debate.
  1.  *A child bouncing a ball against a wall with no score.* (Breaks "Competition")
  2.  *Professional Wrestling.* (Breaks "Competition" + "Rules" – it's scripted)
  3.  *A Chess player moving pieces randomly to lose.* (Breaks "Goal-oriented")
  4.  *A video game modded to have no win condition, just exploration.* (Breaks "Winning")
  5.  *A religious ritual that participants call "playing out the story."* (Breaks "Secular/Fun")

  ---

  ## Part 2: Session Flow (90 Minutes)

  ### Movement 1: Acquisition Without Definition (20 Minutes)
  **0:00–0:05: Setup.**
  Do not mention Wittgenstein. Do not write "Meaning is Use" on the board. Enter the room holding the props. Tell the class: *"I am going to teach you a new predicate: 'Dax.' I will not define it. I will only show you cases. Your job is to learn to use the word correctly."*

  **0:05–0:15: The Training.**
  Begin applying the term.
  *   Put the glasses on. *"These are Dax."* Take them off. *"These are not Dax."*
  *   Hand the pen to a student. *"When you write, it is Dax. When you stop, it is not."*
  *   Hold the mug to your lips. *"Dax."* Set it down. *"Not Dax."*
  *   Pick up the hammer. Swing it at a (imaginary) nail. *"Dax."* Rest it on the table. *"Not Dax."*
  *   Ask students to test you. *"Is this Dax?"* (Hold up book). Wait for them to realize they must *use* the book (open it, read) for you to say Yes.
  *   **Crucial Moment:** Around minute 12, the class should be correcting each other. *"No, don't just hold the pen, write with it, otherwise it's not Dax!"* They are now policing the use of the term confidently.

  **0:15–0:20: The Interrogation.**
  Stop the activity. Ask: *"Okay, you all use 'Dax' perfectly. Define it. What property do all Dax things share?"*
  *   *Expected Answers:* "Things you hold." (Refute: Glasses). "Things you wear." (Refute: Hammer). "Tools." (Refute: Glasses/Pen aren't always tools).
  *   *The Feeling:* They will feel frustration. They *know* how to use the word, but the definition slips away.
  *   *Transition:* *"Keep that feeling. You have command of a concept without a definition. Now, let's break a concept you think you already have."*

  ### Movement 2: The Definition Hunt (45 Minutes)
  **0:20–0:25: Group Formation.**
  Divide into 4 groups of 4. Hand out the decks. **Do not tell them the decks are different.**
  *   **Task:** *"You have 20 cases. Some are games, some are not. Your task is to produce a single-sentence definition of 'GAME' that covers all the 'Yes' cards and excludes all the 'No' cards in your deck. You have 15 minutes."*

  **0:25–0:40: Group Work.**
  Circulate. Listen to their struggles.
  *   *Group A* will likely settle on "Competitive activity with rules."
  *   *Group B* will likely settle on "Solo activity requiring skill."
  *   *Group C* will likely settle on "Imaginative play without fixed goals."
  *   *Group D* will likely settle on "Rule-governed procedure."
  *   *Intervention:* If a group finishes early, tell them: *"Make sure your definition is precise enough to exclude the 'No' cards."* This tightens their noose.

  **0:40–0:50: The Clash.**
  Ask each group to write their definition on the board.
  *   **The Reveal:** Ask Group A to test Group B's definition against *their* deck.
      *   *Group A (Competition):* "Solitaire isn't a game by your definition."
      *   *Group B (Solitary):* "Yes it is. Your definition excludes Solitaire."
  *   Ask Group C to test Group D.
      *   *Group C (Pretend):* "Tag has no fixed rules. Is it a game?"
      *   *Group D (Rules):* "Court Trial has rules. Is it a game?"
  *   **The Discovery:** At 0:45, reveal: *"By the way, you all had different decks."* Let this land. The silence is pedagogical. They realize their "essence" was an artifact of their sample.

  **0:50–1:05: The Whole-Room Attempt.**
  Erase the board. *"Okay, combine your insights. Write the one true definition of Game for the whole class."*
  *   As they propose definitions, deploy your **Poison Pill Cards**.
  *   *Student:* "Games have winners." -> *You:* Show *Ring Around the Rosie* or *Modded Video Game*.
  *   *Student:* "Games are just for fun." -> *You:* Show *Professional Gambling* or *Serious Chess*.
  *   *Student:* "Games are rule-governed." -> *You:* Show *Child making up rules as they go with a stick*.
  *   *Student:* "Games are distinct from work." -> *You:* Show *Pro Athlete*.
  *   **Goal:** Drive the room to exhaustion. The energy should drain as every necessary condition is shown to be non-necessary, and every sufficient condition is shown to be non-sufficient.

  ### Debrief & Mapping (25 Minutes)
  **1:05–1:15: Mapping Movement 1 (Meaning is Use).**
  *   *"Go back to 'Dax.' You used it correctly. Why did you fail to define it?"*
  *   **Point:** The meaning wasn't a mental picture or a list of properties; it was a technique of application. You knew *how to go on*.
  *   **Wittgenstein Connection:** PI §43 ("For a large class of cases... the meaning of a word is its use in the language"). The rule was not a proposition in your head; it was a practice you joined.

  **1:15–1:25: Mapping Movement 2 (Family Resemblance).**
  *   *"Why did the definition of 'Game' fail? Was it because you aren't smart?"*
  *   **Point:** No. It failed because the demand was wrong. There is no common thread running through all games.
  *   **Wittgenstein Connection:** PI §66-67 (Family Resemblance). Show the image of the rope: no single fiber runs the whole length, but overlapping fibers give it strength.
  *   **Key Insight:** The concept is held together by criss-crossing similarities, not an essence. Group A saw competition; Group C saw pretense. Both are part of the family, neither is the essence.

  **1:25–1:30: The Meta-Point (Philosophy of Language).**
  *   *"What about the term 'Language'? We are in a Philosophy of Language seminar. Does 'Language' have a definition?"*
  *   **Punchline:** If you try to define 'Language' (e.g., 'symbolic communication'), you will run into the same problems (Is bee dancing language? Is code language? Is music?). The seminar's own topic is a family resemblance concept.
  *   **Closing:** *"Wittgenstein isn't saying definitions are impossible. He's saying that for many of our most important concepts, the search for essence blinds us to how the concept actually works."*

  ---

  ## Part 3: Troubleshooting (What Will Go Wrong)

  ### 1. The Gerrymandered Definition
  **Scenario:** A group escapes the trap by offering a disjunctive definition: *"A game is either a competitive activity OR a solitary skill activity OR imaginative play..."*
  **The Drain:** The room feels like they "won." The energy drops.
  **The Fix:** Do not accept it as a success. Ask: *"What ties these disjuncts together? Why do we call all three 'games' and not 'games-or-stuff'? If there is no common thread, is 'game' just a name for a list?"*
  **Philosophical Pivot:** Push them to see that a disjunctive definition is an admission that there is no essence. It saves the definition by destroying the *kind*. Ask: *"Does a child learning the word 'game' learn a list of disjunctions, or do they learn to see similarities?"*

  ### 2. The Stipulation Stop
  **Scenario:** A group says, *"Fine, we stipulate: For this class, a game requires competition."* They ignore the counterexamples.
  **The Fix:** Challenge the *descriptive* aim. *"Wittgenstein isn't asking how we ought to use words (legislation). He's asking how we do use them (description). If a child calls Solitaire a game, and you say 'No, that's wrong,' who is misusing the language? You or the child?"*
  **Goal:** Reorient them from *prescribing* usage to *observing* usage.

  ### 3. The "Anything Goes" Relativism
  **Scenario:** A student concludes, *"So words mean whatever we want. There are no rules."*
  **The Fix:** Point immediately back to Movement 1 ("Dax"). *"Did 'anything go' with Dax? If you held the pen without writing and called it Dax, I corrected you. There are constraints. The constraints just aren't *essentialist* constraints; they are *normative* constraints based on practice."*
  **Goal:** Distinguish between "No Essence" and "No Rules." Family resemblance is not chaos; it is a different kind of order.

  ### 4. The Deck Difference is Missed
  **Scenario:** Students argue past each other without realizing their data sets differed.
  **The Fix:** You must orchestrate the reveal dramatically. *"Group A, read your first three cards. Group B, read your first three cards."* When the discrepancy is obvious, stop the debate. *"You are fighting over data that was rigged. But notice: even with the same data, you might have focused on different features. The rigging just made it visible."*

  ---

  ## Part 4: Limitations (Candid Instructor Notes)

  **1. The Activity Stages Failure, Not Therapy.**
  This session demonstrates the *negative* result: the definitional demand fails. It does not reproduce the *therapeutic* aim of Wittgenstein's work. Students will leave feeling frustrated (which is good), but they may not feel *released* from the urge to define.
  *   **Remedy:** In the debrief, explicitly state: *"The frustration you feel is the point. Wittgenstein wants you to feel that frustration so you stop looking for the ghost in the machine. But the reading will show you how to dissolve the urge, not just disappoint it."*

  **2. Family Resemblance is Shown Negatively.**
  The activity shows there is no common thread. It does not fully show *how* the overlapping similarities guide use positively. Students might ask, *"If there's no definition, how do I know if a new case is a game?"*
  *   **Remedy:** Use the "Dax" example to answer this. *"You knew if the glasses were Dax not by checking a definition, but by looking at how 'Dax' was used in similar cases. You learn by example and extension, not by rule."*

  **3. "Form of Life" is Missing.**
  The activity cannot easily stage the deeper background of shared human behavior ("Form of Life") that makes agreement in definitions possible.
  *   **Remedy:** This must be supplied in the lecture/reading. Tell them: *"The reason we agreed on 'Dax' and why we mostly agree on 'Game' is that we share a form of life. We react similarly to training. That is the bedrock. The activity shows the bedrock holds, even without the pillar of definition."*

  **4. The Reading is Still Necessary.**
  Do not let students think this activity replaces the *Investigations*.
  *   **Instruction:** *"Tonight's reading will give you the vocabulary for what happened here. When Wittgenstein talks about 'language-games,' he is talking about the 'Dax' activity. When he talks about 'family resemblance,' he is talking about the 'Game' decks. Read to find the text that matches your experience today."*
