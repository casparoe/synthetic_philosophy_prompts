answer: |-
  You're thinking like a mechanic, not a historian. Historians worry about provenance; mechanics worry about *function*. You're asking whether a story is a structural component or just a decal. That is a much better way to judge truth than asking "is it factual?" because communities run on stories the way engines run on fuel: sometimes the fuel is dirty, but if it burns clean enough to keep the thing moving, you don't drain the tank.

  However, your intuition is inconsistent because you are weighing two different scales: **Harm** and **Power**. Sometimes you prioritize preventing harm (Case 4), sometimes you prioritize correcting power imbalances (Case 6), and sometimes you prioritize cohesion (Case 1).

  Here is the principle that organizes your six cases, an evaluation of your friend's theory, the verdict on the bridge, and the honest critique of where this logic breaks.

  ### The Principle: Functional Legitimacy

  **A community's memory should override the written record when it serves internal cohesion without inflicting external harm, unless the written record itself is an instrument of historical oppression. Conversely, the written record must override memory when the memory is used to allocate material resources, enforce policy, or honor specific dead individuals.**

  This principle has three clauses. Here is how they map to your cases:

  **Clause 1: The Cohesion Clause (Memory Wins)**
  *If the story builds internal identity and harms no one outside the group, let it stand.*
  *   **Case 1 (The Church):** The story makes the parishioners feel proud and connected. The mill owner is dead and doesn't need the credit. No one is hurt. **Memory wins.**
  *   **Case 2 (The Statue):** The statue is a civic totem. Correcting the date and founder status is pedantic and damages civic pride without fixing an injustice. **Memory wins.**

  **Clause 2: The Dignity Clause (Record Wins)**
  *If the story concerns specific human loss, accuracy is required to honor the dead.*
  *   **Case 3 (The Factory Fire):** Inflating the death count (11 to 30) turns specific individuals into a symbol. It erases the actual eleven. To honor them, you must name them correctly. **Record wins.**

  **Clause 3: The Consequence Clause (Record Wins, Unless Power is Skewed)**
  *If the story is used to make policy, allocate property, or exclude people, the Record wins—unless the Record was created by the powerful to dispossess the vulnerable.*
  *   **Case 4 (Zoning):** The memory ("always working class") is being used as a weapon to exclude new housing. It has material consequences for outsiders. **Record wins.**
  *   **Case 5 (Grazing Rights):** The memory is used to claim a property right (economic resource). The archive says no. There is no indication of systemic oppression here, just a dispute over assets. **Record wins.**
  *   **Case 6 (Indigenous Land):** The memory is used to claim sovereignty/justice. The Record (treaty/survey) was created by the colonizer to legitimize the taking. The power dynamic is skewed. **Memory wins.**

  ### Your Friend's Theory: Load-Bearing vs. Scenery

  Your friend is about 80% right, but he's missing the *direction* of the load.

  He says: "Ask what falls down if you take it away."
  *   **Case 1 & 2:** If you take the story away, community pride falls down. (Load-bearing).
  *   **Case 4:** If you take the story away, the *exclusionary policy* falls down. (Load-bearing for bad things).
  *   **Case 6:** If you take the story away, the claim to justice falls down. (Load-bearing).

  **Where he breaks:** He treats "load-bearing" as inherently good. But a story can be load-bearing for a wall that keeps people out (Case 4). Your intuition correctly identifies that *some* load-bearing structures need to be demolished. The distinction isn't just "does it hold weight?" It's "what is it holding up?"

  ### The New Case: The Bridge of '55

  **The Scenario:** The town believes the bridge washed out in the '55 flood. The flood-control campaign for 70 years is built on this memory. Records show the bridge was condemned and removed two years *before* the flood.

  **The Verdict:** **The Record Wins.**

  **The Reasoning:** This falls under **Clause 3 (Consequence)**. This is not just identity; this is civil engineering and public spending.
  1.  **Material Consequence:** Flood control involves taxes, zoning, and physical infrastructure (levees, dams). If the engineering models are based on the premise that "a bridge failure caused the catastrophic flow," the physics are wrong.
  2.  **Safety:** You cannot build safety systems on a myth. If the bridge wasn't there, the flood dynamics were different. The town might be building defenses against the wrong threat.
  3.  **No Oppression:** There is no evidence the record was created to oppress the town. It's a county condemnation notice.

  **However,** you should handle this like a mechanic, not a prosecutor. You don't tell the town, "You're liars." You tell them, "The diagnosis was wrong. The bridge was already gone. That means the water pressure was even higher than we thought. We need to reinforce the plan." You use the Record to *strengthen* the response to the Memory, not erase the trauma of the flood.

  ### The Honest Critique: Where This Breaks

  You asked me to be honest about the shakiness. Here is where your reasoning (and mine) is vulnerable.

  **1. The Weak Link: Case 5 (Grazing Rights)**
  This is the case you are most likely to have to give up.
  *   **Why:** You said the archive in Case 5 is a "1930s compilation of interviews with people remembering things fifty years on." That is *codified oral history*. It is not a deed; it is someone else's memory written down by a bureaucrat.
  *   **The Contradiction:** In Case 6, you trust oral memory over a treaty. In Case 5, you trust a 1930s interview over current oral memory. Why? The only difference is that Case 6 involves Indigenous sovereignty and Case 5 involves "old families" (likely white settlers).
  *   **The Flip:** If the "old families" in Case 5 are marginalized (e.g., poor rural families vs. a wealthy development corporation), your Principle of Power (Clause 3) suggests Memory should win there, too. If you trust the 1930s archive because it's "written," you are falling into the trap you're trying to avoid. **I suspect if you examined Case 5 closer, you'd realize the Record doesn't deserve the authority you gave it.**

  **2. The Definition of "Harm" (Case 1 & 2)**
  *   **The Risk:** You let the Church and Statue lies stand because they seem harmless. But all myths have a cost. If the Church members believe they built it themselves, do they resent the mill owner's descendants? Do they feel entitled to the building in a way they shouldn't?
  *   **What would flip the verdict:** If you found out the mill owner's family was being actively harassed or excluded by the church because of the "we built this" story, Clause 1 collapses. Harmlessness is often just invisibility.

  **3. The "Specific Dead" Problem (Case 3)**
  *   **The Risk:** You want to correct the death count to honor the eleven. But what if the thirty includes people who died later from smoke inhalation or injuries? Official records often undercount disaster victims.
  *   **What would flip the verdict:** If the "11" is the coroner's immediate count, but the "30" is the community's count of everyone who never came home. In disaster memory, the community count is often functionally more true than the bureaucratic count. You might find yourself defending the "30" not as fact, but as *grief*.

  ### Summary
  You have a solid instinct: **Truth is a tool, not an idol.**
  *   Use the **Record** when building bridges, zoning land, or naming the dead.
  *   Use **Memory** when building community, identity, or seeking justice against power.

  Your friend's "load-bearing" idea is useful, but remember: sometimes you have to tear down a load-bearing wall to put in a better door. Just make sure you check the foundation (Case 5) before you decide which wall stays up.
