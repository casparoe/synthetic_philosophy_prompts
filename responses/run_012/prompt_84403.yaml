answer: |-
  This is a **bedrock disagreement about the sovereignty of normative frameworks**, masquerading as a formal dispute about representability. It is not merely verbal, nor is it a difference in the aim of inquiry. Your suspicion regarding the "constraint vs. ranking" distinction is the correct diagnostic tool for the stalemate, but it reveals why the impasse is substantive rather than resolving it.

  Here is the reasoning, based on the specific dialectic you described.

  ### 1. The Diagnosis: Hierarchy of Normativity

  The dispute is bedrock because the two camps disagree on which framework holds **normative sovereignty**.

  *   **Camp 1 (The Autonomists)** treats *Explanatory Goodness* as a primitive epistemic virtue. When they argue that "any fundamental rule... is defended in terms that presuppose it," they are articulating a coherentist or pragmatist view of inference rules. For them, the success of the practice (science works) vindicates the rule (IBE), and demanding a non-explanatory certificate is a category error. They place Explanation *above* Probability in the hierarchy of justification.
  *   **Camp 2 (The Reductionists)** treats *Probabilistic Coherence* as the exhaustive logic of uncertainty. When they insist virtues "can and must be represented either as a prior... or a likelihood," they are asserting that Probability is the sovereign framework. For them, a rule that cannot be mapped onto the probability calculus is not a rule of justification, but merely a psychological heuristic. They place Probability *above* Explanation.

  This is why the dispute has not moved in twenty years. You are not witnessing a failure of argumentation; you are witnessing a clash of "first philosophies."

  **Why it is not the other options:**
  *   **Not Verbal:** If this were merely about the word "inference," Camp 1 could concede "Okay, call it a heuristic," provided Camp 2 conceded that the heuristic *licenses belief*. But Camp 2 denies the licensing. The disagreement is about *normative force*, not terminology.
  *   **Not Aim:** Both camps are concerned with what we are "entitled to believe" (credibility). Camp 2 does not shift the goalposts to "action" or "utility"; they argue that without probabilistic representation, *credibility* is undefined.
  *   **Not Purely Formal:** If this were a technical question about whether virtues *can* be represented, a formal proof could settle it. But Camp 1 denies the *adequacy* of the formal framework to capture the normative source. They argue that even if you *could* map the virtues to priors, you still need an account of where the priors come from. The formal question is the battlefield, not the cause of the war.

  ### 2. Evaluating Your Hypothesis (Constraint vs. Ranking)

  Your hypothesis—that the stalemate relies on equivocation between IBE as an **admissibility constraint** and IBE as a **ranking device**—is analytically correct, but it confirms the bedrock nature of the disagreement rather than dissolving it.

  *   **The "Bad Lot" Objection (Camp 2):** This objection only works if IBE is a **Ranking** device operating on an antecedently defined space. If the space contains only low-prior hypotheses, ranking them yields a "best" that is still unbelievable.
  *   **The "Prior Source" Defence (Camp 1):** This defence only works if IBE is an **Admissibility Constraint**. If IBE determines which hypotheses enter the space (and thus what priors they receive), the "Bad Lot" never forms. A hypothesis with a vanishingly small prior is inadmissible *because* it lacks explanatory virtue.

  **Why this doesn't resolve the stalemate:**
  Camp 2 will simply reject the "Constraint" reading as question-begging. To a Bayesian, a "constraint on admissibility" *just is* a prior assignment (a prior of zero vs. non-zero). If Camp 1 says, "Explanation sets the prior," Camp 2 replies, "Then explain how that setting is truth-conducive without using probability." Camp 1 replies, "By using IBE."

  The loop closes. Your distinction correctly identifies *where* the two sides talk past each other, but it shows that they are operating with incompatible architectures of justification. Camp 1 sees the hypothesis space as *generated* by explanatory considerations. Camp 2 sees the hypothesis space as *given*, with explanation merely evaluating contents. You cannot separate the roles in practice because Camp 2 denies the normative validity of the "Constraint" role unless it is reduced to the "Ranking" (probabilistic) role.

  ### 3. What Counts as Progress?

  Given this diagnosis, **theoretical resolution is impossible.** You should not expect progress in the form of one side convincing the other, nor in the form of a formal result that settles the normativity. A formal result would be accepted by Camp 2 as a vindication of Reductionism and by Camp 1 as a limited model that presupposes the very explanatory assumptions it claims to derive.

  However, **methodological progress** is possible. It consists of the following:

  1.  **Abandoning the Universal Claim:** The stalemate persists because both camps seek a *universal* norm for scientific inference. Progress requires admitting that IBE and Bayesianism may be **incompatible but locally valid** systems. IBE may be the correct norm for *hypothesis generation and theory choice* (where the space is not fixed), while Bayesianism is the correct norm for *parameter estimation and testing* (where the space is fixed).
  2.  **Naturalizing the Dispute:** Stop asking "Is IBE a valid rule?" and start asking "Under what empirical conditions does explanatory virtue track truth?" If the link between explanation and truth is contingent (as van Fraassen argued), then IBE is not a rule of *logic* but a contingent *strategy*. This shifts the burden from a priori vindication to empirical validation.
  3.  **Explicitly Accepting the Hierarchy:** Force the students to declare their sovereignty. "I am an Explanation-First epistemologist" or "I am a Probability-First epistemologist." This stops the "picking a side and stop thinking" dynamic by making the choice a explicit commitment to a foundational framework, rather than a conclusion derived from the arguments.

  **Verdict:**
  The impasse is substantive. It is a clash between two coherent, mutually irreducible epistemic systems. Your "Constraint vs. Ranking" distinction is the sharpest way to map the boundary, but it will not bridge it. Progress consists not in solving the problem, but in **dissolving the demand for a single solution.** If your seminar continues to seek a verdict on which camp is *correct*, it will run for another twenty years. If it shifts to analyzing the *costs* of each sovereignty (e.g., Camp 1 risks dogmatism; Camp 2 risks paralysis), the students will learn more about the architecture of scientific reasoning than they ever would from a resolution.
