  To: Research Integrity Committee
  From: Chair
  Subject: Complaint Regarding Interpretative Claims in [Paper Title]
  Date: 24 May 2024

  This opinion addresses the complaint concerning the interpretative claims made in the aforementioned paper. The raw data are not disputed; the issue is whether the central conclusion—that the brain revises conscious experience retrospectively—is warranted by the evidence provided. As Chair, I must determine if the conclusion is stated more strongly than the evidence permits, thereby misleading the scientific record.

  The complainant argues that accurate initial experience followed by memory overwrite explains the reports equally well. This objection holds significant merit. While the authors highlight that button presses occurred before the second stimulus appeared, motor responses involve neural processing latency. A decision to press may be initiated based on expectation but finalised after the second stimulus arrives, allowing for postdictive memory interference before the action is executed. Therefore, the button press does not definitively rule out the complainant's 'memory overwrite' hypothesis. The reporting system, whether verbal or motor, is indeed produced 'after the fact' of the neural processing required to generate it.

  Conversely, my colleague argues that reports are our only access to experience. While epistemologically true, equating report directly with phenomenology is methodologically perilous here. The experiment robustly establishes that subsequent stimuli alter behavioural reports regarding prior events. It does not, however, distinguish between the alteration of the conscious experience itself and the alteration of the memory trace accessible to report. The press headlines regarding 'rewriting the past' rely on the stronger claim regarding consciousness, which the evidence does not uniquely support. To claim the experience itself was rewritten rather than the memory of it is an inference beyond the data.

  Consequently, the paper's conclusion is stated more strongly than the evidence permits. While this does not constitute fabrication, it risks misleading the public and scientific community regarding the nature of consciousness, falling under questionable interpretative practices that warrant committee intervention.

  **Recommendation:**
  I recommend we require the authors to publish a Correction or Letter of Clarification in the originating journal. This must acknowledge the viable alternative explanation of postdictive memory interference and temper claims regarding the retrospective revision of *conscious experience* specifically, distinguishing it from revision of *reports* or *memory*. The correction should explicitly state that the data are consistent with both perceptual revision and memory reconstruction.

  **Deadline:**
  The authors must submit evidence of this correction to the Committee within three months of this decision.

  I am highly confident in this recommendation, though I am least certain regarding the precise motor-latency thresholds required to definitively rule out the complainant's memory-overwrite hypothesis without further experimentation.
