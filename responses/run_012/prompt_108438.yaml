answer: |-
  Here is the teaching plan, designed for a 90-minute session with cognitive scientists who are skeptical of philosophy.

  ### Part 1: The Example Shortlist

  Before we lock in the plan, here are the three candidate examples I considered. You need to see why I'm rejecting two of them.

  1.  **Gold vs. Fool's Gold (Pyrite).**
      *   *Pros:* Everyone knows gold has value/identity. Everyone knows pyrite looks the same but isn't "real."
      *   *Cons:* Too entangled with *value* and *economics*. Psycholinguists might argue that "gold" is defined by its social value, not its atomic structure. It invites a pragmatic argument ("It's gold if I can sell it") rather than a semantic one.
  2.  **Elm vs. Beech (Putnam's Division of Linguistic Labor).**
      *   *Pros:* Very linguistic. Highlights reliance on experts.
      *   *Cons:* This is **Social Externalism** (Burge-style), not **Twin Earth Externalism** (Putnam-style). It proves we rely on community, not that the *physical world* fixes meaning. Using this validates the "meaning is just social agreement" view you're trying to disrupt.
  3.  **Jade (Nephrite vs. Jadeite).** **(The Winner)**
      *   *Pros:* It is a "natural kind" like water, but avoids the H2O reflex. Historically, "Jade" referred to two distinct minerals with identical macroscopic properties. It forces a decision: Is "Jade" defined by how it looks/feels (internal concept) or what it is made of (external structure)?
      *   *Cons:* Requires a brief geology stipulation.
      *   *Why this wins:* It isolates the *essence vs. appearance* debate without the chemical baggage of water. It appeals to categorization research (psycholinguists care deeply about how we group things).

  ---

  ### Part 2: Criteria for the Chosen Example (Jade)

  To work in this room, the Jade example **must have**:
  *   **Macroscopic Identity:** Earth-Jade and Twin-Jade must be indistinguishable to the naked eye, touch, and basic use (carving, wearing).
  *   **Microscopic Difference:** Earth-Jade is Mineral A; Twin-Jade is Mineral B.
  *   **Ignorance:** The speaker (Oscar) must not know the difference. He thinks he's talking about the same stuff on both planets.

  To work in this room, the Jade example **must avoid**:
  *   **Functional Differences:** Do not suggest Twin-Jade breaks easier or changes color. If it functions differently, the psycholinguists will argue meaning is defined by *use/function*, not structure.
  *   **Expert Intervention:** Do not bring in geologists yet. Keep it focused on Oscar's internal state vs. the world. If you bring in experts too soon, it becomes the "Elm/Beech" (Social) argument, not the Twin Earth (Physical) argument.

  ---

  ### Part 3: The 90-Minute Teaching Plan

  **Goal:** Move them from "Meaning is in the head (lookup table)" to "Meaning depends on the world," without getting bogged down in metaphysics.

  #### Phase 1: The Setup (0–20 mins)
  *   **Activity:** Tell the story of Oscar (Earth) and Twin-Oscar (Twin Earth).
  *   **The Stipulation:** On Earth, "Jade" = Nephrite. On Twin Earth, "Jade" = Jadeite. They look/feel identical. Oscar and Twin-Oscar are molecule-for-molecule identical.
  *   **The Question:** When Oscar says "This is beautiful jade," and Twin-Oscar says "This is beautiful jade," do they mean the same thing?
  *   **The Vote:** Ask for a show of hands. (Yes/No/Unsure).
  *   **Why this comes first:** You must establish **Internal Indistinguishability** before you introduce the external difference. If they don't grant that Oscar and Twin-Oscar are internally identical, the argument fails.
  *   **Head off Misconception (Introspection):** Someone will say, "Oscar knows what he means."
      *   *Intervention:* "Oscar knows what he *intends*, but does his word successfully pick out the same stuff in the world? We are asking about *reference*, not *intention*."

  #### Phase 2: The Intuition Pump (20–40 mins)
  *   **Activity:** Push the implications.
  *   **Scenario A:** Oscar travels to Twin Earth. He points at a rock (Jadeite) and says "Jade." Is he right?
      *   *Target Intuition:* No. He's mistaken. He's calling Jadeite "Jade," but his word "Jade" refers to Nephrite (his home stuff).
  *   **Scenario B:** We discover tomorrow that *all* Earth-Jade was actually two minerals mixed together. Did the meaning of "Jade" change yesterday?
      *   *Target Intuition:* No. The meaning was fixed by the stuff, not our discovery of the stuff.
  *   **Why this depends on Phase 1:** You can only test where the meaning "lives" (Head vs. World) after you've agreed the Heads are identical but the Worlds are different.
  *   **Head off Misconception (Lookup Tables):** The "Lookup Table" crowd will say, "The entry in Oscar's brain is the same, so the meaning is the same."
      *   *Intervention:* "If meaning is just the brain entry, then Oscar is *correct* to call Twin-Jade 'Jade.' But intuitively, he's wrong. Therefore, the brain entry isn't the whole meaning. The world is part of the vector."

  #### Phase 3: The Cognitive Science Pivot (40–60 mins)
  *   **Activity:** Connect to their field.
  *   **Discussion:** If Externalism is true, what happens to experimental methods that rely on self-report or priming?
  *   **Key Point:** You can measure the *concept* in the head (psychologically real), but that doesn't fix the *extension* (what the word actually picks out).
  *   **Head off Misconception (Causal Contact):** Someone will say, "So meaning is just pointing at stuff? Causal contact?"
      *   *Intervention:* "No. It's not just contact. It's about the *nature* of the stuff. If you point at a cat but think it's a robot, your word 'cat' still refers to animals, not robots. It's about the underlying kind, not the causal handshake."

  #### Phase 4: The Bilingual & Burge Detours (60–75 mins)
  *   **The Bilingual Thread (Mandarin/English speakers):**
      *   *The Trap:* They will argue that they feel like a "different person" in Mandarin vs. English, so meaning is internal/subjective.
      *   *The Move:* **Shut this down gently.**
      *   *Script:* "That is a fascinating phenomenon, but it is likely *connotation*, *pragmatics*, or *cultural framing*. Twin Earth argues that even if you feel identical, if the *stuff* is different, the *truth conditions* are different. Your feeling of 'different self' doesn't change whether the liquid in the lake is H2O or XYZ. Keep that for the session on Language & Identity."
      *   *Why:* Conflating *sense of self* with *semantic reference* will destroy the argument. Externalism is about truth conditions, not identity formation.
  *   **The Phil Grad Student (Arthritis/Burge):**
      *   *The Trap:* She says, "Burge's Arthritis case (thinking arthritis can be in the thigh) proves externalism without needing Twin Earth."
      *   *The Move:* **Acknowledge, then defer.**
      *   *Script:* "She is right that Burge proves *Social* Externalism (meaning depends on community norms). But Twin Earth proves *Natural Kind* Externalism (meaning depends on physical reality). For a cognitive science group, the Physical argument is more disruptive to computational models than the Social one. We need to establish that the *World* matters, not just the *Community*. We'll do Burge in Week 2."
      *   *Why:* If you use Arthritis, they will think this is just about "experts correcting me." Twin Earth shows that *even if everyone is wrong*, the world fixes the meaning. That's the harder, more important pill for CogSci to swallow.

  #### Phase 5: Wrap & Assessment (75–90 mins)
  *   **Summary:** Meaning = (Internal State) + (Environmental Context).
  *   **The Assessment Question:** Do not ask "What is externalism?" Ask this:
      *   *"If we upload Oscar's brain into a robot on Twin Earth, and he has never interacted with Twin-Jade, does his word 'Jade' refer to Twin-Jade now?"*
      *   *Correct Answer:* **No.** It still refers to Earth-Jade (or nothing), because his history/causal chain is tied to Earth.
      *   *Why this works:* It tests if they understand that meaning isn't just *current* internal state or *current* environment, but the **historical causal chain**. If they say "Yes," they missed the argument and think it's just about current context.

  ---

  ### Part 4: The "Do Not Cover" List

  Read this out loud at the start (or when things drift). It sets boundaries and shows you respect their time.

  1.  **"We are not solving Skepticism."** (We aren't asking if we *know* we aren't on Twin Earth. We are asking what our words mean *if* we were.)
  2.  **"We are not doing Philosophy of Mind."** (We aren't arguing about Qualia or Consciousness. Stick to Reference and Meaning.)
  3.  **"We are not debating Social Construction."** (Whether categories are 'real' in the world is a separate debate. For this hour, assume Natural Kinds exist.)
  4.  **"We are not fixing your Bilingual Intuitions."** (As noted above, keep L1/L2 identity feelings separate from Semantic Reference.)

  ### Teacher's Note on Jargon
  *   **Extension:** Call it "The stuff the word picks out."
  *   **Intension:** Call it "The concept in your head."
  *   **Natural Kind:** Call it "A group of things that are the same deep down, like gold or tigers."
  *   **Semantic Externalism:** Call it "The view that the world helps fix meaning."

  This plan respects their expertise (categorization, concepts) while forcing them to confront the specific philosophical claim without triggering their "I've heard the water one" defense mechanisms.
