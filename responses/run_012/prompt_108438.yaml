prompt: |-
  I'm running a 90-minute session for our cognitive science reading group next week — mostly psycholinguists, a couple of comp-ling folks, no philosophy of language background, and at least two of them think "meaning" is basically a lookup table. Topic is Twin Earth and the case for semantic externalism. Don't explain externalism to me, I know it; what I need is the teaching plan.

  Put on the hat of someone who's taught this to non-philosophers many times, and start by brainstorming two or three candidate carrying examples before you commit to one — I want to see the shortlist, not just the winner. For the one you pick, tell me what it has to have and what it has to avoid in order to do the work. Two constraints: it can't be water (everyone's heard the H2O/XYZ thing on a podcast, and the second I say "water" they'll stop listening and think they already know the argument), and it has to be something they can argue about in the room with no props. If you decide water is genuinely the only option, fine, but make the case.

  What I want from you: the order the pieces have to go in and why each one depends on the one before it, and where exactly in that sequence I head off each misconception. Here's what I'm expecting from them. They'll hear externalism as the boring claim that languages carve things up differently (words differ, not meanings). They'll think it proves meaning is just causal contact with stuff. They'll think it means introspection is worthless. And half the group is bilingual (Mandarin/English), so some of them will want to use their own sense of feeling like a different person in each language as evidence — which I'm pretty sure is a different thesis, something self-ish or Burge-ish social externalism. Tell me whether to encourage that thread or shut it down, and where. Also, the one person in the group with a philosophy degree says the arthritis case does the same job more cheaply than Twin Earth and I should just use that — is she right, and what would I lose?

  Then: one question I can ask at the end that would show me they got the argument rather than just a vibe, and a short list of what I should openly refuse to cover in 90 minutes with this crowd, said out loud.

  Give me the plan, not the lecture. And go easy on me with jargon — I have to say all of this out loud to psycholinguists who will definately ask me to define my terms.
