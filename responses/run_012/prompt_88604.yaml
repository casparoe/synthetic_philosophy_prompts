  There is no canonical term in philosophy of science or economics that isolates this specific move without carrying unwanted baggage. "Ad hoc rescue" is too broad; "immunization" implies unfalsifiability; "moving the goalposts" is colloquial and pejorative. I propose calling this **Temporal Deferral**.

  **Definition**
  Temporal Deferral occurs when a theory preserves its core mechanistic claim after a dated prediction fails, solely by shifting the culmination point. The delay is attributed to endogenous counter-pressures inherent to the mechanism itself, rather than external shocks or model error, without offering independent tests for the delay factors. Your description is accurate; the phenomenon exists, but the label has been missing.

  **Distinctions**
  1.  **Tendency-only theories:** These claim directional pressure (e.g., "prices tend to rise") without specific culmination dates. Temporal Deferral requires a missed deadline; a theory that never promised a date cannot defer it.
  2.  **Abandonment:** Here, the date is missed and the theory is discarded or the mechanism rejected. Deferral persists despite the miss, retaining the mechanism's validity.
  3.  **Predicted Delay:** Some models explicitly build in lag variables or counter-mechanisms *before* the test. If the theory predicted the delay mechanism beforehand (e.g., "pressure triggers innovation which delays collapse"), the survival is a success, not a deferral. Deferral identifies the counter-pressure only after the failure.
  4.  **Independent Confirmation:** If the mechanism is verified by evidence unrelated to the timeline (e.g., micro-foundations), the timing error is an artifact of the model, not the theory. In Temporal Deferral, the mechanism's support often relies on the continued pressure itself, risking circularity.

  **Defensible vs. Rhetorical**
  The line lies in **novel prohibition** and **ex-ante specification**.

  A defensible deferral transforms the theory into something riskier. It must say: "The collapse will not happen by Date A, but if it does not happen by Date B, then Condition C must be observed." It forbids a new state of affairs. If the revised theory merely says "Wait longer," it prohibits nothing new and is rhetorical.

  Furthermore, consider the counteracting factor. Was it predicted? If the theory stated beforehand that "innovation spikes when pressure peaks," and this delays the collapse, the delay confirms the theory. If the proponent says after the fact that "innovation must have spiked," without measuring innovation independently, it is a rhetorical deferral. The defense holds only if the explanation for the delay is testable independently of the collapse it postpones.

  In short, Temporal Deferral is legitimate only when the reason for the delay is itself a falsifiable claim that could have proven the theory wrong. If the delay explains everything, it predicts nothing.
