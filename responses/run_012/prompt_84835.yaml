prompt: |-
  I'm a science journalist, I've been sitting in on a workshop about convention and norms for a piece I'm writing, and it's basically two camps talking past each other. Camp one is the David Lewis type: a convention is a regularity that everyone follows, expects everyone else to follow, and prefers to keep following given that the others do; it's arbitrary in the sense that some other regularity could of done the same job; and it's held up by common knowledge, because it's a solution to a coordination problem. Camp two is the cultural-evolution crowd: conventions and norms are just whatever behaviors got copied and stabilized in a population, held in place by imitation, conformity bias and the threat of punishment, and you don't need common knowledge or a shared preference for any of it.

  What I want is the document these two should have written together instead of doing another panel. A joint statement of an adversarial collaboration: the claims both can sign about what a convention is, what actually needs explaining, and what their two accounts are really competing over; then exactly where they part ways, with each position written in wording its own side would accept; then the cruxes, and for each crux a case or argument both agree bears on it, with each side's prediction written down in advance. Numbered agreed-claims section first, then a disagreements table.

  Three things I'd like them to hash out, because I think thats where the action is. First: a village where everyone drives on the same side of the road, everyone expects everyone else to, but nobody has any belief at all about what the others expect third parties to do. Is that a convention yet, and what happens to it if one person's expectation shifts? Second: a regularity everyone privately dislikes and would rather swap for the other option, but keeps following because deviation gets you fined or shamed. Does that count, and does it matter that the preference to conform is manufactured by the penalty rather than coming out of the coordination problem itself? Third: whether the ought adds anything over and above everyone will do it and you'll be punished if you don't, and if it does, who gets to explain it.

  If part of their fight turns out to be about words, say which part and why. Skip the lit review, I don't need citations or reading lists, I need the formulations.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Role:** Science Journalist observing a workshop.
      *   **Task:** Create a document the two camps *should* have written together (a joint statement of adversarial collaboration).
      *   **The Two Camps:**
          *   Camp 1 (Lewisian/Philosophical): Conventions are arbitrary regularities, solutions to coordination problems, requiring common knowledge and conditional preferences (I prefer to do X if you do X).
          *   Camp 2 (Cultural-Evolutionary/Behavioral): Conventions/Norms are stabilized behaviors via copying, conformity bias, punishment. No need for common knowledge or shared preference.
      *   **Required Structure:**
          1.  Numbered Agreed-Claims Section (what both sign).
          2.  Disagreements Table (where they part ways, in their own wording).
          3.  Cruxes (specific tests/cases with predictions).
      *   **Specific Cases to Address:**
          1.  *The Road Case:* Driving on one side, expectations exist, but no higher-order expectations (no belief about what others expect third parties to do). Is it a convention? What if one expectation shifts?
          2.  *The Prison Case:* Everyone dislikes the regularity, follows due to punishment/shaming. Is it a convention? Does the source of preference (coordination vs. penalty) matter?
          3.  *The Normativity Case:* Does "ought" add anything beyond "will + punishment"? Who explains it?
      *   **Constraint:** Skip lit review/citations. Focus on formulations. Identify verbal disputes if any.

  2.  **Deconstruct the Camps & Find Common Ground:**
      *   *Common Ground:* Both agree there are stable behavioral regularities in populations. Both agree these regularities are socially transmitted/maintained. Both agree that deviations often incur costs (either coordination failure or punishment). Both agree "arbitrariness" plays some role (there *could* have been another way).
      *   *The Split:* Lewis focuses on the *mental state* and *rationality* (common knowledge, conditional preference). Evo focuses on the *mechanism* and *outcome* (transmission, stability, enforcement).
      *   *Verbal Dispute:* Likely around the definition of "Convention" vs. "Norm." Lewisians might reserve "Convention" for coordination and "Norm" for enforcement. Evo folks might lump them as "Cultural Traits." The document needs to acknowledge this terminology friction.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need statements both can sign without feeling they sold out.
      *   1. Existence of regularities.
      *   2. Arbitrariness (alternative equilibria exist).
      *   3. Social maintenance (it's not just individual habit).
      *   4. Sensitivity to others (behavior depends on what others do).
      *   5. Terminology acknowledgement (we are fighting over the extension of the word "convention").

  4.  **Drafting - Section 2: Disagreements (The Table):**
      *   Need to capture the essence of Lewis vs. Evo in their own idioms.
      *   *Dimension 1: Cognitive Requirements.* Lewis: Common Knowledge is necessary. Evo: Behavioral stability is sufficient.
      *   *Dimension 2: Preference Structure.* Lewis: Conditional preference (I want to match you). Evo: External enforcement or blind copying is sufficient.
      *   *Dimension 3: Normativity.* Lewis: The "ought" emerges from the rationality of coordination. Evo: The "ought" is a proximate mechanism (emotion/punishment) selected for stability.

  5.  **Drafting - Section 3: The Cruxes (The Three Cases):**
      *   *Case 1: The Shallow Road (Higher-order expectations).*
          *   Scenario: First-order expectations exist (I expect you to drive right), but no second-order (I don't know if you expect *him* to drive right).
          *   Lewis Prediction: Not a full convention. Fragile. If one person doubts others' expectations, they might defect.
          *   Evo Prediction: It is a convention. Stability matters, not the depth of recursion. It persists as long as punishment/copying holds.
      *   *Case 2: The Miserable Equilibrium (Preference vs. Punishment).*
          *   Scenario: Everyone hates the rule, follows only due to sanction.
          *   Lewis Prediction: This is a *norm* enforced by sanctions, not a pure *convention* (which relies on coordination payoff). The preference is not conditional on others doing it, but on avoiding pain.
          *   Evo Prediction: It is a convention/norm. The mechanism (internal preference vs. external threat) doesn't change the population-level classification.
      *   *Case 3: The Ghost of Ought (Normativity).*
          *   Scenario: Describing the rule.
          *   Lewis Prediction: "Ought" is reducible to rational expectation + preference. If you explain the coordination, you explain the ought.
          *   Evo Prediction: "Ought" is a distinct psychological adaptation (normative attitude) that needs its own explanation beyond behavior. It causally drives stability.

  6.  **Refining and Polishing:**
      *   *Tone:* Academic but collaborative. Precise.
      *   *Formatting:* Clear headings, tables for disagreements.
      *   *Check against constraints:* Did I address the three specific cases? Yes. Is there a lit review? No. Are the formulations clear? Yes.
      *   *Self-Correction on "Verbal Dispute":* I need to make sure I explicitly flag if they are just defining words differently. The prompt asks: "If part of their fight turns out to be about words, say which part and why." I should add a preamble or a specific note about the "Convention vs. Norm" semantic boundary. I'll put this in the Preamble/Agreed Claims.

  7.  **Final Review of the Three Cases:**
      *   *Road Case:* Lewis needs Common Knowledge (CK). If CK is missing, Lewis says it's not a convention. Evo says behavior is what matters.
      *   *Prison Case:* Lewis distinguishes Coordination Conventions (mutual benefit) from Norms (enforced). Evo lumps them.
      *   *Ought Case:* Lewis sees normativity as rational necessity. Evo sees it as a psychological heuristic.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Title:* Joint Statement on the Structure and Stability of Social Regularities.
      *   *Preamble:* Acknowledge the terminological friction.
      *   *Agreed Claims:* 1-5.
      *   *Disagreements:* Table format.
      *   *Cruxes:* The three scenarios with specific predictions.

      *(Self-Correction during drafting)*: Make sure the Lewisian position doesn't sound *too* rationalist. Lewis allows for precedent. But the key is the *reason* for following. For Lewis, I follow because I want to coordinate. For Evo, I follow because I copied or fear shame.
      *(Refining the Road Case)*: Lewis specifically argues Common Knowledge is required to solve the recursion of expectations. If I don't know that you know that I know, I might worry you won't show up. So Lewis says "Not stable/Not convention." Evo says "If they are driving, it's a convention."
      *(Refining the Prison Case)*: Lewis calls this a "Norm" distinct from a "Convention" sometimes, but often groups them. The prompt distinguishes them. I will frame it as: Lewis says the *source* of the preference defines the category. Evo says the *stability mechanism* defines the category.
      *(Refining the Ought Case)*: This is about explanation. Lewis: Explain the game, you explain the ought. Evo: The feeling of 'ought' is a causal force that needs evolutionary explanation.

  9.  **Final Polish:** Check the voice. It should sound like a document produced by the workshop facilitators or the leads of the collaboration. Clean, sharp, no fluff.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # JOINT STATEMENT ON THE STRUCTURE AND STABILITY OF SOCIAL REGULARITIES
  **Adversarial Collaboration Workshop: [Date Redacted]**
  **Signatories: The Rational-Expectation Group (Camp 1) & The Cultural-Transmission Group (Camp 2)**

  ## PREAMBLE: THE TERMINOLOGICAL FRICTION
  We acknowledge that a portion of our disagreement is verbal. Camp 1 tends to reserve the term **"Convention"** for coordination equilibria sustained by mutual expectation and conditional preference, distinguishing these from **"Norms"** sustained by sanction. Camp 2 treats **"Convention," "Norm,"** and **"Cultural Trait"** as functionally overlapping categories defined by population-level stability and transmission, regardless of individual mental states.

  In this document, we agree to use the neutral term **"Social Regularity"** when referring to the phenomenon generally, and we explicitly flag where our dispute is about the *extension of the label* versus the *mechanism of stability*.

  ---

  ## SECTION I: AGREED CLAIMS
  *Both camps sign the following propositions as true descriptions of the phenomena under discussion.*

  1.  **Existence of Arbitrariness:** For the Social Regularities in question, there exists at least one alternative behavioral regularity that could have solved the same social problem or occupied the same functional niche (e.g., driving left instead of right).
  2.  **Contingency on Others:** An individual's adherence to the Regularity is causally dependent on the behavior of others in the population. If the population switched to the alternative, the individual would (eventually) switch as well.
  3.  **Stability Mechanism:** The Regularity is maintained over time by social processes, not merely by individual habit or environmental constraint.
  4.  **Cost of Deviation:** Deviating from the Regularity typically incurs a cost for the deviator. Both camps agree this cost exists; we disagree on the *source* of the cost (coordination failure vs. social sanction).
  5.  **Explanatory Goal:** Both camps aim to explain how these Regularities emerge, how they persist despite the possibility of alternatives, and how they collapse.

  ---

  ## SECTION II: AREAS OF DISAGREEMENT
  *Where we part ways. Each position is phrased to be acceptable to its proponents.*

  | Dimension | Camp 1 (Rational-Expectation / Lewisian) | Camp 2 (Cultural-Transmission / Evo) |
  | :--- | :--- | :--- |
  | **1. Cognitive Requirements** | A Social Regularity is only a **Convention** if it is supported by **Common Knowledge**. Agents must know the rule, know that others know it, and know that others know that they know it. Without this recursive certainty, the coordination problem is not solved. | Cognitive depth is irrelevant to classification. If the behavior is stable and transmitted via imitation or conformity bias, it is a **Convention**. Agents may follow the rule via heuristics or blind copying without representing others' mental states. |
  | **2. Preference Structure** | Adherence must be driven by a **Conditional Preference**. I follow the rule *because* I prefer to match your action given that you follow it. The payoff comes from the coordination itself. | Adherence can be driven by **External Enforcement** or **Blind Copying**. I may follow the rule even if I dislike the coordination outcome, provided the threat of punishment or the bias to conform is strong enough. |
  | **3. The Source of "Ought"** | The normative force ("you ought to do X") is **reducible** to rational expectation. Once you explain the coordination equilibrium and the common knowledge, you have fully explained the "ought." | The normative force is a **distinct psychological adaptation**. The feeling of "ought" is a proximate mechanism (e.g., anticipatory shame) that causally contributes to stability and requires its own evolutionary explanation separate from the behavior. |

  ---

  ## SECTION III: THE CRUXES
  *Three specific cases where our theories generate different predictions or classifications. We agree to treat these as empirical or conceptual tests.*

  ### CRUX 1: THE SHALLOW ROAD (Higher-Order Expectations)
  **The Case:** A village where everyone drives on the right. Everyone expects everyone else to drive on the right. However, no driver has any belief about what *others* expect *third parties* to do (no second-order expectation). There is no Common Knowledge, only first-order expectation. One driver begins to suspect others are confused about what the rest of the village expects.

  | | **Camp 1 Prediction** | **Camp 2 Prediction** |
  | :--- | :--- | :--- |
  | **Is this a Convention?** | **No.** It is a fragile regularity. Without common knowledge, the recursion is broken. I cannot be sure you are sure I will show up, so the rational basis for coordination is incomplete. | **Yes.** The behavioral regularity is established and stable. The depth of recursive mentalizing does not change the population-level fact of the convention. |
  | **Effect of Shift:** If one person's expectation shifts (they doubt others' expectations), what happens? | **Collapse.** The rational agent will defect immediately because the coordination guarantee is lost. The convention is brittle without the common knowledge buffer. | **Persistence.** The individual will likely continue conforming due to habit, conformity bias, or fear of accident/punishment. The system absorbs the doubt without collapsing. |

  ### CRUX 2: THE MISERABLE EQUILIBRIUM (Preference vs. Punishment)
  **The Case:** A population follows a dress code. Everyone privately dislikes the dress code and would prefer a different one (or none). Everyone follows it solely because deviation results in shaming or fines. The "preference to conform" is manufactured entirely by the penalty, not by the benefit of matching others.

  | | **Camp 1 Prediction** | **Camp 2 Prediction** |
  | :--- | :--- | :--- |
  | **Classification** | **Norm, not Convention.** This is a social norm enforced by sanction, distinct from a coordination convention. In a true convention, the primary payoff is the coordination itself, not the avoidance of punishment. | **Convention/Norm (Indistinguishable).** The distinction is artificial. At the population level, the stability mechanism (penalty vs. coordination payoff) produces the same equilibrium. Both are cultural stable states. |
  | **Explanatory Focus** | We must explain the **origin of the sanction**. Why did we coordinate on *this* punishment regime? The behavior itself is not self-enforcing. | We must explain the **stability of the trait**. Whether the cost is internal (I want to match) or external (I fear shame), the evolutionary dynamic of transmission is the same. |

  ### CRUX 3: THE GHOST OF OUGHT (Normativity)
  **The Case:** We observe a population following a rule. We can fully describe the behavior ("Everyone does X") and the consequences ("If you don't, Y happens").

  | | **Camp 1 Prediction** | **Camp 2 Prediction** |
  | :--- | :--- | :--- |
  | **Does "Ought" add explanatory power?** | **No.** "You ought to do X" is shorthand for "It is rational for you to do X given that everyone else does." If you explain the game matrix and the common knowledge, the "ought" disappears into the rationality. | **Yes.** "You ought" refers to a specific cognitive/emotional state (normative attitude) that *causes* the behavior. Two populations could have the same behavior/payoffs, but only one has the "ought" feeling, making it more stable. |
  | **Who explains it?** | **Decision Theory.** The "ought" is explained by the logic of the coordination problem. | **Evolutionary Psychology.** The "ought" is a mechanism selected for to solve free-rider problems in large groups where rational calculation is too costly. |

  ---

  ## SECTION IV: NEXT STEPS FOR EMPIRICAL WORK
  To move beyond this stalemate, we agree to design experiments that manipulate **Common Knowledge** (Crux 1) and **Sanction Independence** (Crux 2) to see which variables actually predict the stability of Social Regularities in human subjects.

  *   **Test 1:** Create coordination games where first-order expectations are high but second-order expectations are experimentally degraded. Does coordination fail? (Tests Camp 1's Common Knowledge requirement).
  *   **Test 2:** Create equilibria where coordination payoffs are zero, but sanctions are high, vs. coordination payoffs high, but sanctions zero. Do subjects linguistically and psychologically categorize these differently? (Tests Camp 1's Convention/Norm distinction).

  **Signed,**
  *Representatives of Both Camps*
