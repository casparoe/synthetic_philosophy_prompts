      *   **Constraints:** Brainstorm multiple readings of Dana first. Don't hedge. No citations/reading lists. Plain language conclusion for Dana.

  2.  **Deconstruct Dana's Claim (Brainstorming Readings):**
      *   *Reading 1: Classical Pragmatism (James/Dewey).* Truth is what proves itself to be good in the way of belief. It's not just "useful" in a crude sense, but "expedient in the total long run." Dana might be simplifying this to the immediate hospice context.
      *   *Reading 2: Wittgensteinian/Therapeutic.* Truth isn't a metaphysical property but a move in a language game. In the "hospice game," the move that sustains life *is* the correct move. Calling it "true" is just marking it as the right move in this context.
      *   *Reading 3: Existential/Phenomenological.* Truth as *aletheia* (unconcealment) or authenticity. If a belief allows a person to face death without crumbling, it reveals a reality about their existence that a cold fact might obscure. It's ontologically disclosive, not just instrumentally handy.

  3.  **Deconstruct the Stats Friend's Claim:**
      *   This is clearly Peircean (C.S. Peirce). Truth is the "final opinion" of the community of inquirers.
      *   *Strength:* Avoids solipsism and relativism. Anchors truth in reality (something to agree *about*).
