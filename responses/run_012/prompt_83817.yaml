          3.  *Therapeutic Truth:* Truth = What restores agency. (Specific to clinical context).
      *   *The Disagreement:* They are fighting over the *telos* (purpose) of truth. Stats = Correspondence/Convergence. Dana = Coping/Function.
      *   *The "Slide" Question:* Can Dana avoid "true for me"? Yes, if she argues that human flourishing is an objective metric, not a subjective feeling. But she risks conflating "good to believe" with "true."
