      *   *Can Dana avoid relativism?* Yes, if she adopts a "robust pragmatism." It's not "true for me," it's "true because it successfully navigates reality." But in hospice, "navigating reality" includes emotional survival, not just factual accuracy.
      *   *Is Stats view usable?* It's good for science, bad for bedside manner. It makes past truths (70s diagnosis) problematic (were they false then?).
      *   *Strongest Objections:*
          *   To Dana: The "Comforting Delusion" problem. If a patient believes they will be cured to die peacefully, and they aren't, did that belief "work"? It worked until it didn't.
