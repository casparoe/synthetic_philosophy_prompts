prompt: |-
  Ok so me and my mate Daniel have been arguing about this for like two weeks in our school philosophy club and we just keep going round in circles, so I want an outside number. Context: we're both doing an EPQ (that's a mini dissertation you do in year 12, mine's roughly on where you draw the line between science and not-science) and our teacher brought up Popper, who apparently at one point said Darwinian natural selection isn't really a testable scientific theory and is more of a metaphysical research programme, the worry being that whatever survives, survives, so the survival-of-the-fittest idea starts to sound like it's just saying that the things which survive are the things which survive, which nothing could ever falsify. But then apparently he later kind of walked it back and said it is testable once you bundle it with assumptions about heredity and environment. Daniel sits at like 0.9 that natural selection is a proper falsifable theory (he keeps saying he can imagine a fossil record that would refute it); I'm at like 0.35 because every time he gives me a possible falsifier I can find a way to patch the theory so it survives anyway.

  What I actually want from you is a number and the working, not a vibe. What's your credence that the core mechanism of natural selection -- not the bare fact that life changed over time, but the mechanism itself, heritable variation plus some variants reproducing more than others -- is a genuinely falsifiable, testable scientific theory in Popper's sense? Please decompose it: how much rides on whether the circularity / tautology worry is fatal or fixable, how much on whether a theory is only ever testable when you bundle it with auxiliary assumptions (and whether that still counts as testing the theory rather than the baggage), how much on whether falsifiability is even the right dividing line between science and non-science in the first place, and how much on just what we mean by the theory -- the bare mechanism versus the whole package with genetics and ecology tacked on. Give me a rough probability for each piece with one line of why, then how they combine into your final number. Then the bit I care about most: which single sub-question is my 0.35 and Daniel's 0.9 actually disagreeing about, like if we only resolved that one thing would our numbers snap together? And finally, what sort of thing (an argument, a thought experiment, a real fact about biology) would move your number the most -- I can't really look stuff up right now, so it needs to be something I could actually reason through myself.
