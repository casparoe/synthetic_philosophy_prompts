prompt: |-
  I chair the ethics consultation service at a mid-sized teaching hospital, and I would like you to take on the role of a philosopher of practical ethics who is unusually good at building protocols — someone who knows the literature on moral dilemmas, moral residue, and the distinction between a hard choice and an impossible one, and who can compress it into something a committee can run in forty-five minutes without having read any of it. Our service receives roughly twenty consultations a month. Most are ordinary: questions of capacity, surrogate disagreements, discharge planning. But a growing share arrive with the same framing — the requesting team says there is no right answer here, or both options are wrong, or we cannot win either way. Within about forty-eight hours, usually before a family meeting, we owe the chart a one-page opinion; the attending then acts on it, and nobody is bound by what we say. The committee is six people: me, a bedside nurse, a chaplain, the hospital's lawyer, a community lay member, and the clinician who requested the consult. We have no power to decide anything; we can only say what we think and, if we are honest, either shield or fail to shield the person who has to choose. Our problem is that when a case gets hard we have exactly one move. Someone says it is a genuine dilemma, everyone nods, and the note concludes that either course is defensible. Sometimes that is the truth. Sometimes it is how we avoid a call we could have made, and sometimes it is a factual dispute or a policy gap wearing philosophical clothes.

  Please write me a procedure the committee can run on every consultation, in order, that sorts the case into one of a small fixed set of verdicts — something along the lines of genuine dilemma, hard choice with a better and a worse option, resolvable conflict, policy gap, and misuse of dilemma language to dodge responsibility — and specifies for each verdict what we must produce. That means: when we owe the decision-maker cover and when we should instead name a preferred course and defend it; when we should send the case back for facts; when the real answer is that the institution must declare a value it has never declared; and, in the cases we do call dilemmas, what is owed afterwards to the option that was not taken — an apology, compensation, follow-up with a bereaved family, a change to the policy that manufactured the trap. Two constraints. First, the procedure must not presuppose that genuine dilemmas exist. One colleague argues that a genuine dilemma is incoherent, because obligations that cannot be jointly fulfilled would not both be obligations, and he will veto anything that treats the existence of dilemmas as an assumption; the chaplain holds that the residue people feel after choosing is evidence the dilemma was real. I need a procedure both can sign, which means it must be able to certify a case as a dilemma without settling the metaphysics, and it must be explicit about which of its steps are conceptual commitments rather than observations. Second, it must terminate in one of the fixed verdicts. If the honest output is that it depends, then the procedure has failed, and I would rather you tell me that than paper over it. Some consults come at two in the morning from a resident who needs an answer before an operation, so say which steps can be skipped under that kind of pressure and which cannot.

  Start by laying out the distinctions you intend to rely on, and why the ones you discard are less useful, then give me the procedure as an ordered list of questions, with what counts as a sufficient answer to each and where the procedure stops. Then run it on three cases. The first: a family asks that a diagnosis be withheld from a patient who has said he would rather not be told, and then the family itself asks the nurses direct questions about his prognosis, so the team feels caught between honesty, the patient's stated preference, and the family's request. The second: one remaining course of an expensive therapy and two patients who both meet the criteria, a thirty-four-year-old with a reversible condition and a long recovery ahead, and a seventy-one-year-old who is the sole carer for a grandchild with a disability; the team insists there is no right answer, and I suspect the procedure will tell me that my committee should refuse to decide the case and instead force a policy the hospital has spent years avoiding — an answer I will not enjoy defending upstairs, so do not soften it. The third: a patient discloses in confidence that a relative who drives a school bus has been drinking before work; the relative is identifiable, the risk is real but not imminent, and the patient forbids any disclosure. Add a few lines on a fourth kind of request, one that arrives mainly because the attending wants cover against a threatened lawsuit. Finally, tell me where the procedure will misfire or be gamed, and say plainly what it cannot do. I have no interest in citations or a reading list; reason it out from what you know, and think carefully about the cases where the classification itself is the contested question.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**

      *   **Role:** Philosopher of practical ethics, expert in protocol building, moral dilemmas, moral residue, hard vs. impossible choices.
      *   **Context:** Mid-sized teaching hospital ethics consultation service (ECS). 20 consults/month. 48-hour turnaround for a one-page opinion. Non-binding advice.
      *   **Committee:** 6 people (Chair, Nurse, Chaplain, Lawyer, Community Member, Requesting Clinician).
      *   **Problem:** Overuse of "dilemma" framing to avoid responsibility. Too many "either course is defensible" conclusions. Need to sort cases into fixed verdicts.
      *   **Constraints:**
          1.  Must not presuppose genuine dilemmas exist (metaphysical neutrality between the skeptic colleague and the chaplain).
          2.  Must terminate in a fixed verdict (no "it depends").
          3.  Must handle emergency/night pressure (identify skippable steps).
          4.  Must specify post-decision obligations (residue management).
          5.  No citations/reading lists.
          6.  Must run the procedure on three specific cases + one "cover against lawsuit" type.
          7.  Must identify failure modes/gaming.
      *   **Tone:** Professional, direct, pragmatic, philosophically rigorous but operationally compressed.

  2.  **Deconstruct the Philosophical Distinctions:**

      *   *Goal:* Create a taxonomy that satisfies both the "dilemma skeptic" (no true conflicts of obligation) and the "dilemma realist" (moral residue proves conflict).
      *   *Strategy:* Focus on *action-guidance* and *institutional posture* rather than metaphysical truth. Define "dilemma" operationally as "unresolvable conflict of authoritative norms within current constraints," leaving the metaphysical status open.
      *   *Key Distinctions to Keep:*
          *   **Factual Uncertainty vs. Value Conflict:** Is the disagreement about what *is* or what *ought* to be?
          *   **Policy Gap vs. Policy Conflict:** Is there no rule, or do two rules clash?
          *   **Hard Choice vs. Impossible Choice:** Can one option be justified as *better*, or are they *equally* weighted/uncomparable?
          *   **Responsibility Dodge:** Is the "dilemma" claim actually a fear of liability or discomfort?
      *   *Key Distinctions to Discard:*
          *   *Objective Moral Truth:* We can't adjudicate that in 45 mins.
          *   *Psychological Distress alone:* Stress doesn't equal dilemma (could be fear of liability).
          *   *Legal vs. Ethical:* The lawyer is on the team, but the verdict must be ethical *within* legal bounds. Don't separate them too rigidly; integrate compliance as a constraint.

  3.  **Drafting the Procedure (The "Triage & Verdict" Protocol):**

      *   *Structure:* Ordered list of questions (gates). If Yes/No, go to next step or verdict.
      *   *Verdicts:*
          1.  **Resolvable Conflict:** One option is ethically superior.
          2.  **Policy Gap:** Institution needs to set a rule (ECS refuses to decide ad hoc).
          3.  **Factual/Procedural Deficit:** Send back for info.
          4.  **Responsibility Dodge:** Call out the avoidance.
          5.  **Operational Dilemma:** (The neutral term). No superior option within constraints. Requires residue management.
      *   *Emergency Mode:* Which steps can be cut? (Skip deep policy search, skip community member input if unavailable, focus on immediate harm).
      *   *Post-Verdict Obligations:* What happens after the choice? (Apology, debrief, policy review).

      *   *Refining the "Dilemma" Definition:* To satisfy the skeptic and the chaplain, define it as *Residual Obligation*. If an option is chosen, is there a remaining duty to the unchosen path? If yes -> Operational Dilemma. If no -> Hard Choice. This sidesteps "were both obligations real?" and asks "do we owe reparations?"

  4.  **Developing the Three Cases (and the fourth):**

      *   *Case 1 (Withholding Diagnosis):* Family vs. Patient preference vs. Honesty.
          *   Analysis: Patient said he doesn't want to know. Family asks nurses. Team feels caught.
          *   Protocol run: Is there a policy? (Usually yes on truth-telling/capacity). Is the patient capacitated? If yes, his preference rules.
          *   Verdict: Resolvable Conflict (Patient autonomy > Family preference).
      *   *Case 2 (Two Patients, One Therapy):* 34yo vs. 71yo caregiver.
          *   Analysis: Team says "no right answer." ECS suspects Policy Gap.
          *   Protocol run: Is there a triage policy? If no, ECS shouldn't make a utilitarian calculation ad hoc.
          *   Verdict: Policy Gap. (Force the hospital to decide criteria, don't let ECS be the scapegoat).
      *   *Case 3 (Tarasoff/Driving Relative):* Confidentiality vs. Public Safety.
          *   Analysis: Risk not imminent. Patient forbids.
          *   Protocol run: Legal duty? (Varies by jurisdiction, assume "duty to warn" threshold not met). Ethical duty? Harm reduction.
          *   Verdict: Hard Choice (with a better option). Breach confidentiality to prevent harm, but minimize breach. Or, if legal duty is clear, it's Resolvable. Let's assume legal duty is ambiguous to make it ethical.
          *   *Correction:* The prompt asks for specific verdicts. Let's make this a "Hard Choice" where breach is preferred but requires repair.
      *   *Case 4 (Defensive Medicine/Lawsuit Cover):*
          *   Analysis: Attending wants cover.
          *   Verdict: Responsibility Dodge.

  5.  **Addressing Constraints & Failure Modes:**

      *   *Metaphysical Neutrality:* Use the term "Operational Dilemma" or "Unresolvable within Constraints." Focus on the *aftermath* (residue) rather than the *ontology* of the obligation.
      *   *Gaming:* How will people game this? By claiming "Policy Gap" to avoid work. By claiming "Dilemma" to avoid blame.
      *   *Limitations:* ECS cannot fix broken systems instantly. ECS cannot guarantee legal safety.

  6.  **Refining the Output (Self-Correction during drafting):**

      *   *Critique:* Is the procedure too long for 45 mins?
      *   *Fix:* Make the questions binary and sharp.
      *   *Critique:* Did I address the skeptic/realist divide?
      *   *Fix:* Explicitly state in the preamble that the protocol treats "dilemma" as a functional category regarding *residue*, not metaphysical reality.
      *   *Critique:* Case 2 needs to be hard. The prompt says "do not soften it."
      *   *Fix:* Be blunt. The ECS must refuse to allocate scarce resources without a pre-existing policy. This will anger administration. State that clearly.
      *   *Critique:* Emergency steps.
      *   *Fix:* Add a "Red Flag" section at the start for 2 AM consults.

  7.  **Final Polish:** Check tone. Ensure it sounds like a philosopher writing for clinicians (precise, structured, no fluff). Ensure the "Verdicts" are clearly defined with required outputs.

      *(Self-Correction on Case 1)*: The prompt says the patient "said he would rather not be told." This is a waiver of right to know. The family asks nurses direct questions. The nurses are caught. This is less about truth-telling and more about confidentiality and the waiver. The verdict should be Resolvable: Respect the waiver, do not lie to family but refer to patient.
      *(Self-Correction on Case 3)*: Tarasoff duties are legal. If the risk is "not imminent," legal duty might not trigger. Ethical duty remains. This is a classic conflict. Let's classify it as a Hard Choice where the ethical weight tips toward safety, but confidentiality is violated.
      *(Self-Correction on Dilemma Definition)*: To satisfy the skeptic, the verdict shouldn't be "Genuine Dilemma." It should be "Equipoise with Residue." This acknowledges the *feeling* (chaplain) without asserting the *ontological conflict* (skeptic). Actually, the prompt asks for "Genuine Dilemma" as a possible verdict category but says the procedure must not *presuppose* they exist. I will use the term "Certified Operational Dilemma" to bridge the gap.

      *Wait, re-reading the prompt's verdict list:* "genuine dilemma, hard choice with a better and a worse option, resolvable conflict, policy gap, and misuse of dilemma language." Okay, I must use these or equivalent fixed set. I will use "Certified Dilemma" to handle the metaphysical objection (it certifies the *situation* as requiring dilemma-management, not the *ontology* as true).

      *Actually, better phrasing:* "Verified Dilemma." The procedure *verifies* the conditions that make it function as a dilemma regardless of metaphysics.

      *Let's finalize the Verdicts:*
      1.  **Resolvable Conflict:** One path is ethically obligatory.
      2.  **Hard Choice:** One path is preferable, but the other is permissible.
      3.  **Verified Dilemma:** No ethically preferable path; both permissible; residue management required. (Satisfies chaplain's residue, satisfies skeptic's "permissible" view).
      4.  **Policy Gap:** No decision possible without institutional value declaration.
      5.  **Avoidance:** The conflict is manufactured to shift liability.

      *Let's write.*

  8.  **Final Review against constraints:**
      *   45 mins? Yes, flowchart style.
      *   Metaphysical neutrality? Yes, via "Verified" language focusing on residue.
      *   Fixed verdicts? Yes.
      *   Emergency mode? Yes.
      *   Three cases + fourth type? Yes.
      *   Failure modes? Yes.

      *(One last check on Case 2)*: The prompt says "I suspect the procedure will tell me that my committee should refuse to decide the case and instead force a policy." I need to ensure the protocol leads there. The key question is "Is there an institutional policy for resource allocation?" If No -> Policy Gap.

      *(One last check on Case 1)*: Patient waived right to know. Family asks nurses. Nurses feel caught. This is often a "Resolvable Conflict" (Patient's waiver controls). But if the family is the surrogate? Prompt says "Patient... said he would rather not be told." Implies capacity. Family asks nurses. Verdict: Resolvable.

      *(One last check on Case 3)*: Relative drives school bus. Drinking. Risk real but not imminent. Patient forbids. This is a confidentiality vs. harm case. Usually, if not imminent, confidentiality holds *unless* statutory duty exists. If statutory duty is unclear, it's a Hard Choice.

      *Ready to draft.*
answer: |-
  ### Preamble: Distinctions and Definitions

  To build a protocol that satisfies both the metaphysical skeptic (who denies genuine dilemmas exist) and the phenomenological realist (who points to moral residue as proof), we must shift from *ontology* to *operation*. We are not adjudicating the nature of the universe; we are adjudicating the nature of the *obligation remaining after action*.

  **Distinctions We Keep:**
  1.  **Conflict of Norms vs. Conflict of Interest:** A dilemma requires competing ethical principles (e.g., autonomy vs. beneficence), not merely competing desires (e.g., family wants X, doctor wants Y).
  2.  **Epistemic Uncertainty vs. Ethical Uncertainty:** Not knowing the prognosis is a factual gap; not knowing whether to prioritize prognosis over quality of life is an ethical conflict.
  3.  **Residue vs. Regret:** Regret is emotional; residue is a recognized obligation to the unchosen path (e.g., restitution, apology). The protocol treats residue as the operational marker of a dilemma, regardless of whether the "competing obligation" was objectively real.
  4.  **Institutional Value vs. Committee Preference:** If the hospital has no stated value on a matter, the committee cannot invent one without overstepping its advisory role.

  **Distinctions We Discard:**
  1.  **"Right" vs. "Wrong":** Too binary. We deal in "Obligatory," "Permissible," and "Impermissible."
  2.  **Legal vs. Ethical:** The lawyer is in the room. If it's illegal, it's usually impermissible ethically. We treat legal constraints as hard boundaries, not competing values.
  3.  **Emotional Distress:** A clinician feeling bad does not make a case a dilemma. It makes it a hard choice or a support need.

  **The Five Fixed Verdicts:**
  1.  **Resolvable Conflict:** One course is ethically obligatory; others are impermissible.
  2.  **Hard Choice:** One course is ethically preferable, but the alternative is permissible.
  3.  **Verified Dilemma:** Competing obligations are of equal weight; either choice is permissible; moral residue is inevitable and must be managed. (This satisfies the skeptic by calling it "Verified" based on criteria, not metaphysics, and the chaplain by mandating residue management).
  4.  **Policy Gap:** The conflict arises because the institution has not declared a value. The committee cannot decide without setting precedent.
  5.  **Avoidance:** The "dilemma" is manufactured to shift liability or discomfort.

  ---

  ### The Protocol: Triage and Verdict Procedure (TVP)

  **Time Allocation:** 45 Minutes total.
  **Emergency Mode (2 AM/Immediate Harm):** Skip Questions 3 and 5. Proceed directly to Question 4. If "Policy Gap" is triggered, the senior clinician on-site makes the decision; ECS reviews post-hoc.

  #### Step 1: The Boundary Check (5 Minutes)
  *Question:* Is any proposed course of action illegal or in direct violation of a mandatory hospital policy?
  *   **Yes:** That course is impermissible. Eliminate it. If only one course remains, Verdict = **Resolvable Conflict**. Stop.
  *   **No:** Proceed to Step 2.

  #### Step 2: The Fact Check (10 Minutes)
  *Question:* Is the disagreement driven by missing medical facts, unclear prognosis, or uncertainty about the patient's capacity/wishes?
  *   **Yes:** The conflict is epistemic, not ethical.
      *   *Output:* Recommendation to pause decision until facts are clarified (e.g., capacity eval, family meeting to clarify wishes).
      *   *Verdict:* **Factual Deficit** (Treat as Resolvable once facts are known). Stop.
  *   **No:** Proceed to Step 3.

  #### Step 3: The Policy Search (10 Minutes)
  *Question:* Does the hospital have an existing policy or precedent that resolves this specific value conflict (e.g., triage criteria, truth-telling standards, confidentiality exceptions)?
  *   **No:** The committee is being asked to set a value the institution has not declared.
      *   *Output:* Recommendation to escalate to Administration/Risk Management for policy declaration. ECS declines to recommend a specific clinical path.
      *   *Verdict:* **Policy Gap**. Stop.
  *   **Yes:** Apply the policy. If the policy resolves it, Verdict = **Resolvable Conflict**. If the policy creates the conflict (e.g., two policies clash), Proceed to Step 4.

  #### Step 4: The Weighting Test (10 Minutes)
  *Question:* Can the committee identify a compelling ethical reason to prefer Option A over Option B (e.g., preventing irreversible harm, respecting explicit prior autonomy)?
  *   **Yes, clear preference:** One option is superior, though the other is not forbidden.
      *   *Output:* Recommendation for Option A. Plan for support regarding Option B.
      *   *Verdict:* **Hard Choice**. Stop.
  *   **Yes, one is obligatory:** One option is required.
      *   *Verdict:* **Resolvable Conflict**. Stop.
  *   **No, weights are equal:** The reasons for A and B are incommensurable or equally authoritative.
      *   *Proceed to Step 5.*

  #### Step 5: The Residue Test (10 Minutes)
  *Question:* If we choose Option A, is there a remaining duty owed to the interests represented by Option B (e.g., apology, compensation, follow-up)?
  *   **No:** The unchosen option carried no moral weight. (Rare).
      *   *Verdict:* **Hard Choice** (Re-evaluate Step 4).
  *   **Yes:** The unchosen option generates a debt.
      *   *Output:* Recommendation that either option is permissible *provided* a Residue Management Plan is executed.
      *   *Verdict:* **Verified Dilemma**. Stop.

  #### Step 6: The Motivation Check (Integrated throughout)
  *Question:* Is the request for consultation driven by a desire to distribute liability rather than resolve patient care?
  *   **Evidence:** Requesting party refuses to commit to a recommendation even after ECS analysis; language focuses on "protection" rather than "patient good."
      *   *Verdict:* **Avoidance**.
      *   *Output:* Explicit note stating ECS will not provide liability cover; clinical team must own the decision.

  ---

  ### Required Outputs per Verdict

  1.  **Resolvable Conflict:** State the obligatory action. No residue plan needed.
  2.  **Hard Choice:** State the preferred action. Acknowledge the permissibility of the alternative. No formal residue plan, but suggest peer support for the decision-maker.
  3.  **Verified Dilemma:** State that both options are ethically defensible. **Mandatory:** Attach a Residue Management Plan (e.g., "If ventilation is withdrawn, chaplain to meet family within 24 hours," or "If therapy is denied, social work to assist with transition").
  4.  **Policy Gap:** State that ECS cannot recommend a course without establishing institutional precedent. Refer to Administration. **Mandatory:** ECS Chair to draft policy recommendation.
  5.  **Avoidance:** State that the ethical question is clear (refer to Step 1-4 findings) and the barrier is psychological/administrative. Decline to provide "cover."

  ---

  ### Case Runs

  #### Case 1: The Withheld Diagnosis
  *Facts:* Patient (capacitated) waives right to know diagnosis. Family asks nurses for prognosis. Nurses feel caught between honesty, patient's waiver, and family pressure.
  *Run:*
  1.  **Boundary:** No law against respecting patient waiver. No policy violation.
  2.  **Facts:** Patient capacity is confirmed. Waiver is documented.
  3.  **Policy:** Hospital policy supports patient autonomy regarding information disclosure.
  4.  **Weighting:** Patient's explicit waiver (Autonomy) outweighs Family's desire to know (Beneficence/Transparency). Lying to family is impermissible; telling family violates patient trust.
  5.  **Resolution:** The team can tell the family, "We cannot discuss the patient's condition without his permission," without revealing the diagnosis.
  *Verdict:* **Resolvable Conflict.**
  *Output:* Support the team in using the standard "cannot discuss" script. No residue plan needed; the family's distress does not create an ethical debt if the patient's rights are upheld.

  #### Case 2: The Two Patients, One Therapy
  *Facts:* One course of expensive therapy left. Patient A (34, reversible, long recovery). Patient B (71, sole carer for disabled grandchild). Team claims "no right answer."
  *Run:*
  1.  **Boundary:** Both medically eligible. Legal constraints equal.
  2.  **Facts:** Prognosis and social situations are clear.
  3.  **Policy:** **Stop.** Does the hospital have a ratified triage policy for scarce resources?
      *   *Scenario:* If no policy exists (as implied by "team insists no right answer" and your suspicion).
  *Verdict:* **Policy Gap.**
  *Output:* ECS refuses to allocate the resource ad hoc. Allocating based on "social worth" (carer status) vs. "life years" (age/reversibility) requires an institutional value declaration. ECS cannot make this choice without setting a precedent that binds future cases.
  *Instruction:* The note must state: "Ethics Committee cannot recommend allocation without a pre-existing institutional framework. Recommendation: Escalate to Medical Director/Risk Management for immediate policy guidance. Until then, allocation decision rests with Clinical Leadership, not ECS."
  *Note:* This will anger administration. It is the correct output. You are shielding the committee from becoming the scapegoat for a resource allocation policy the hospital refuses to write.

  #### Case 3: The Drinking Bus Driver
  *Facts:* Patient discloses relative (school bus driver) drinks before work. Risk real, not imminent. Patient forbids disclosure.
  *Run:*
  1.  **Boundary:** Check state law (Tarasoff-type duty).
      *   *Assumption:* Law requires "imminent" threat for mandatory breach. Threat here is "real but not imminent." Legal duty is ambiguous.
  2.  **Facts:** Risk is probabilistic, not immediate.
  3.  **Policy:** Hospital confidentiality policy defers to law.
  4.  **Weighting:** Public Safety (Non-maleficence) vs. Confidentiality (Trust/Autonomy).
      *   *Analysis:* Public safety is weighty, but breach destroys therapeutic trust. Since risk is not imminent, immediate breach is not strictly obligatory, but silence is risky.
  5.  **Residue:** If we breach, we owe the patient an explanation and apology for breaking trust. If we don't, we owe the public a mitigation strategy (e.g., persuade patient to act).
  *Verdict:* **Hard Choice.** (Preference for limited breach or aggressive persuasion).
  *Output:* Recommend the clinician attempt to persuade the patient to report or stop the relative. If patient refuses, and risk is significant, breach confidentiality to the minimum necessary extent (e.g., anonymous tip to transport authority).
  *Residue Plan:* Document the breach necessity. If breach occurs, inform patient afterwards unless doing so increases danger. Offer continued care to repair alliance.

  #### Case 4: The Lawsuit Cover (The Fourth Kind)
  *Facts:* Attending requests consult regarding a DNR order. Family is threatening litigation. Attending says, "I need to know if I'm protected."
  *Run:*
  1.  **Boundary:** DNR is legal if medically appropriate.
  2.  **Facts:** Patient lacks capacity, surrogate agrees with DNR.
  3.  **Policy:** Policy supports DNR in this context.
  4.  **Weighting:** No ethical conflict.
  5.  **Motivation:** Request focuses on "protection," not patient care.
  *Verdict:* **Avoidance.**
  *Output:* "Ethics consultation confirms DNR is ethically appropriate per policy. ECS does not provide legal indemnity. Clinical decision should proceed based on patient best interest, not litigation risk."

  ---

  ### Failure Modes and Limitations

  **Where the Procedure Will Misfire:**
  1.  **The "Policy Gap" Loophole:** Clinicians may learn that claiming "no policy exists" forces ECS to kick the case upstairs, delaying care.
      *   *Mitigation:* In Emergency Mode, Step 3 is skipped. The clinician must act. ECS reviews later.
  2.  **Gaming the Residue:** A team might prefer a "Verified Dilemma" verdict because it absolves them of choosing the "better" option. They want to flip a coin and call it ethics.
      *   *Mitigation:* The Chair must enforce Step 4 rigorously. If a preference exists, "Verified Dilemma" is forbidden. The "Residue Management Plan" is also labor-intensive (requiring chaplain/social work follow-up), which disincentivizes choosing this verdict lightly.
  3.  **The Metaphysical Veto:** Your skeptic colleague may still argue that "Verified Dilemma" implies obligations that don't exist.
      *   *Mitigation:* Remind him the verdict certifies the *operational necessity of residue management*, not the ontological status of the obligation. We are managing the *aftermath*, not the *truth*.

  **What This Procedure Cannot Do:**
  1.  **It cannot fix broken systems:** In Case 2, if Administration refuses to write a triage policy, the next consult will face the same problem. ECS can only flag the gap, not fill it permanently.
  2.  **It cannot guarantee legal safety:** The "Avoidance" verdict tells the truth, but it does not stop the lawsuit.
  3.  **It cannot eliminate moral distress:** Even with a Residue Management Plan, the nurse who withdraws life support will still grieve. The protocol manages the *ethics*, not the *psychology*, though it acknowledges the link.

  **Final Instruction:**
  Print this protocol. Place it in the committee binder. At the start of every meeting, ask: "Are we in Emergency Mode?" If no, run the steps. If the group tries to linger in ambiguity, point to the Step 4/5 boundary. If the verdict is "Policy Gap," do not sign the chart note until the referral to Administration is documented. This forces the institution to own its values.
