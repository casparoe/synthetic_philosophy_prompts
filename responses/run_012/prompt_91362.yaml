answer: |-
  You are not arse-backwards; your intuition is philosophically sound. The confusion arises because people use 'incommensurable' loosely. Strictly speaking, if two things are incommensurable, you cannot compare them at all (like comparing the weight of a stone to the beauty of a song), which would indeed paralyses decision-making. But the view you are describing doesn't deny comparison; it denies *linear* comparison. It posits a scale that changes rules at a certain point. Below the threshold, pleasure and pain trade off normally. Above it, pain vetoes pleasure. You need a scale to measure where the threshold is, so there is a common currency, but it is a tiered one. The proper term is usually 'lexical priority' rather than 'lexical threshold negative utilitarianism', but your understanding of the mechanics is correct.

  Here is a paragraph you can lift:

  "Critics often dismiss this position by claiming it renders pleasure and pain incommensurable, as if comparing them were like weighing metres against kilograms. But that suggests a paralysis that proponents do not actually endorse. The mechanism is not a lack of scale, but a discontinuous one. Philosophers call this 'lexical priority': a tiered ledger rather than a single continuum. Below a certain threshold of severity, trade-offs are permitted; a minor ache can be outweighed by a modest joy. But cross that threshold, and the arithmetic changes. Severe suffering ceases to be a negative number on a continuous line and becomes a veto. Thus, the view avoids decision-making paralysis not by denying comparison, but by rigging the scales: you can weigh pain against pleasure, provided the pain isn't too heavy to lift."
