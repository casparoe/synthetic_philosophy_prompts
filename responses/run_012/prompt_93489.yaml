      *   *Family's Interpretation:* If recognition makes us persons, withholding recognition unmakes them. Therefore, we can exclude Dana.
      *   *The Trap:* This interprets recognition as a *reward* or a *privilege* granted by a sovereign group, rather than a *fundamental condition* of human existence.
      *   *The Counter-Argument:* Relational personhood implies *responsibility*, not *power*. If I constitute you, I am responsible for your standing. To "unmake" someone is an act of violence, not a neutral administrative decision. It reveals a moral failure in the group, not a deficit in the individual.
      *   *Status vs. Graded:* If personhood is binary (have/have not), exclusion is ontological murder. If it's graded, it's still abusive to manipulate the grade based on compliance. The family is treating it as a status they control.
      *   *Conclusion:* The philosophy *condemns* the family's action. It highlights the violence of their exclusion, not the justification for it.

  3.  **Formulate the Advice (The "What to Do"):**
