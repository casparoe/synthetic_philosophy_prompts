      *   **Tone Check:** Needs to be authoritative but not preachy. Respect the user's intelligence. Use American English spelling and idioms.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe tell them to give a speech about complexity.
      *   *Correction:* No, the prompt says the dinner is to "ratify this." A speech about complexity might be seen as sabotage or weakness. The ethical move is to refuse the framework.
      *   *Philosophical nuance:* Make sure to distinguish between *social standing* (which can be lost) and *moral personhood* (which shouldn't be). The family is conflating the two.
