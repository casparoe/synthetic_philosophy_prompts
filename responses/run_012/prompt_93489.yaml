      *   **Task:** The user is asked to speak at a dinner that will "ratify" this exclusion. They are stalled.
      *   **Philosophical Core:** The concept that personhood is constituted through recognition by others (relational personhood). The user is worried this philosophy might *support* the family's action (if personhood is granted by the group, the group can take it away) rather than condemn it.
      *   **Constraints:**
          *   Commit to an answer (no "on the one hand, on the other").
