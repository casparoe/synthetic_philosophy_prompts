answer: |-
  **Title:** Choice, Welfare, and Defeasibility: Reconstructing Revealed Preference

  **Research Question**
  Standard revealed preference theory oscillates between two unsatisfactory poles: either choice is the *definition* of preference (behaviorism), or choice is *evidence* of a mental state (mentalism). The standard disciplinary move is to treat this as a verbal dispute with no downstream consequences. I reject this. If choice defines welfare, welfare economics cannot coherently justify correcting biases (e.g., nudges for savings), as there is no gap between what is chosen and what is good. If choice is merely evidence, we owe an account of the mental state being evidenced, reintroducing the introspective black box behaviorism sought to eliminate.

  My research question is: **Can revealed preference be reconstructed as a *defeasible constitutive rule* rather than a definition or an empirical hypothesis, such that it accommodates bias correction without collapsing into mentalism?**

  **Motivation**
  The current dichotomy leaves normative economics on unstable ground. Policy interventions aimed at "correcting" choices presuppose that the uncorrected choice was not welfare-maximizing. Under a strict behaviorist reading, this is nonsense; under a mentalist reading, it requires access to unobservable states. A third option is needed: one where choice constitutes welfare by default, but where that constitution can be *defeated* by specific, observable structural features of the choice situation, without referencing hidden mental contents. This project argues that such a middle ground is logically possible and necessary for coherent welfare analysis.

  **Methodology**
  I will not survey the literature on who said what; the problem is structural, not historical. Instead, I will use conceptual analysis and case testing over a four-week timeline:

  *   **Week 1: Mapping the Logical Space.** I will formalize the trilemma (Definition, Evidence, or Nothing) to show exactly where current accounts fail. I will define "defeasible constitutive rule" using analogies from institutional facts (e.g., "X counts as Y in context C unless Z").
  *   **Week 2: Case Selection.** I will isolate three specific classes of choice anomalies: framing effects, hyperbolic discounting, and adaptive preferences. These will serve as the test bed. The goal is to find cases where intuition strongly suggests choice *should not* count as welfare.
  *   **Week 3: Constructing Defeasibility Conditions.** I will attempt to draft principles that defeat the constitutive link based solely on the *structure* of the choice (e.g., instability over time, sensitivity to irrelevant alternatives) rather than the *content* of the mind.
  *   **Week 4: Stress Testing and Drafting.** I will apply the drafted principles to the Week 2 cases. If the principles rule out too much (paralysis) or too little (hard behaviorism), I will iterate. The final output will be a paper outlining the necessary and sufficient conditions for defeasibility.

  **Expected Outcome**
  A successful project will produce a set of "defeat conditions" for revealed preference. For example, a principle might state: *Choice constitutes welfare unless the choice set is manipulated in a way that reverses ranking without changing intrinsic properties.* Success means these conditions are derived without smuggling in mentalist assumptions (like "what they really wanted").

  **Feasibility and Failure Conditions**
  This project is scoped to remain feasible by limiting the analysis to structural features of choice rather than attempting a full theory of well-being. The project fails if:
  1.  **Scope Creep:** I attempt to solve the general problem of well-being rather than the specific logical status of revealed preference.
  2.  **Collapse:** The defeasibility conditions turn out to be covert mentalist claims (e.g., "unless they were confused" relies on a mental state of confusion).
  3.  **Triviality:** The conditions are so narrow they never apply, or so broad they invalidate all choice data.

  **Risk Assessment: The Sinking Cases**
  The most significant threat to this "third way" comes from cases where structural indicators align with welfare, or diverge from it, in counterintuitive ways. Specifically, **adaptive preferences** (where agents choose less because they expect less) and **experienced utility mismatches** (where an agent chooses X, structurally consistent, but reports misery) are the sinkholes. If the only way to identify these as welfare-reducing is to appeal to the agent's reported experience or hypothetical mental states, then the project collapses back into mentalism. If I cannot distinguish a "biased choice" from a "valid but unusual preference" using only choice data and structural context, the defeasible constitutive account is untenable. I will treat these cases as the primary falsification conditions for the proposed framework.
