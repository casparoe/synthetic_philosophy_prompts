answer: |-
  This specification outlines the desiderata for a normative account distinguishing **lying** (asserting what one believes to be false) from **merely misleading** (causing a false belief without asserting it). The account is tasked not merely with describing linguistic usage, but with grounding enforceable standards in law, professional ethics, and AI alignment.

  Below are the requirements, categorized by their function, followed by an analysis of their constraints, inconsistencies, and critical weight.

  ### I. The Desiderata

  **1. The Assertion Constraint**
  *   **Requirement:** The account must provide a principled basis for distinguishing an explicit assertion of falsehood from the strategic implication of falsehood.
  *   **Motivating Case:** *Paltering and Faint Praise.* A reference letter states "He was always punctual" (true) to imply "He was incompetent" (false/unstated). A negotiator uses true facts to imply a false bottom line.
  *   **Rationale:** Without this, the distinction collapses into "causing false belief," rendering the category of "misleading" empty. Legal systems (perjury) and social norms rely on this boundary; an account that cannot map it cannot guide rule design.

  **2. The Intent Condition**
  *   **Requirement:** The account must distinguish deception aimed at falsehood from indifference to truth.
  *   **Motivating Case:** *Lying vs. Bullshitting.* The liar cares about the truth enough to hide it; the bullshitter ignores it.
  *   **Rationale:** Psychological fact. Moral culpability generally tracks intent. An AI or professional code must know whether to punish *error*, *negligence*, or *malice*. If the account cannot distinguish aiming at falsehood from ignoring truth, it cannot calibrate sanctions.

  **3. The Benign Exception Clause**
  *   **Requirement:** The account must allow for contexts where inducing a false belief is permissible or obligatory, without classifying them as moral failures equivalent to predatory lying.
  *   **Motivating Case:** *Placebos, Therapeutic Privilege, and White Lies.* A doctor withholding a prognosis to prevent psychological collapse; a host lying to a guest to spare feelings.
  *   **Rationale:** Moral fact. Any account that categorizes a therapeutic placebo as morally identical to fraud is counter-intuitive and unusable in medical or social policy.

  **4. The Malicious Prohibition (The Murderer Constraint)**
  *   **Requirement:** The account must explain the intuition that lying is forbidden even when it prevents harm, or explain why that intuition is mistaken without dismissing it as mere confusion.
  *   **Motivating Case:** *The Murderer at the Door.* A truthful answer assists a murderer. The intuition persists that lying remains *prima facie* forbidden (or at least morally costly), even if overridden.
  *   **Rationale:** Deontological fact. A purely consequentialist account dismisses this intuition entirely. A workable ethical code must account for the "residue" of guilt or the need for justification that persists even in justified lies.

  **5. The Institutional Fit**
  *   **Requirement:** The account must align with the asymmetry in legal liability between false statements and misleading omissions.
  *   **Motivating Case:** *Perjury vs. Fraud.* Perjury usually requires an explicit false statement; Fraud/Securities law often reaches misleading omissions but requires a duty to disclose. Mere non-disclosure is usually not misrepresentation.
  *   **Rationale:** Practical artifact. Since this account is meant to guide rule design, it cannot demand legal structures that contradict established jurisprudence without overwhelming justification. It must explain why the law treats the *form* of the deception as relevant to liability.

  **6. The Agent-Neutrality Condition**
  *   **Requirement:** The account must apply to agents that do not possess human psychology but optimize for outcomes using information selection.
  *   **Motivating Case:** *The AI Assistant.* A machine that never utters a falsehood but selects/orders/withholds true statements so the user forms a false belief.
  *   **Rationale:** Design artifact. Traditional accounts rely on "belief" and "assertion." An AI account must translate these into "internal state representation" and "output generation." If the account relies essentially on human phenomenology, it fails the AI design purpose.

  **7. The Equivalence Challenge**
  *   **Requirement:** The account must determine whether misleading is morally equivalent to lying when the resulting belief and harm are identical.
  *   **Motivating Case:** *Paltering vs. Lying.* If a negotiator lies about their bottom line vs. palters to imply the same false bottom line, is the blame equal?
  *   **Rationale:** Normative coherence. If the account claims lying is distinctively worse, it must explain why the *method* carries weight independent of the *outcome*. If it claims they are equivalent, it must explain why social and legal norms treat them differently.

  ---

  ### II. Binding vs. Artifacts of Purpose

  **Binding on Any Account (Metaphysical/Semantic):**
  *   **The Assertion Constraint (1):** Any account of *lying* must define what a lie is. If it cannot distinguish assertion from implication, it is not an account of lying; it is an account of deception generally.
  *   **The Intent Condition (2):** Without intent, the distinction between a lie, a mistake, and bullshit vanishes. This is a conceptual necessity, not a policy choice.

  **Artifacts of the Design Purpose (Practical/Regulatory):**
  *   **The Institutional Fit (5):** A purely philosophical account might argue the law is wrong to distinguish perjury from fraud. However, because your goal is to *guide* rule design, the account must be compatible with existing legal levers or provide a roadmap for changing them.
  *   **The Agent-Neutrality Condition (6):** A purely humanistic moral theory could reject AI moral agency. But since you require the account to govern AI assistants, this is a hard constraint on the *specification*, not necessarily on moral theory itself.
  *   **The Benign Exception Clause (3):** An Absolutist (Kantian) account could reject this, arguing all lies are forbidden. However, for *professional codes* (medical, legal), this is non-negotiable. It is a requirement of the *application*, not the *theory*.

  ---

  ### III. Non-Negotiable vs. Optional

  **Non-Negotiable:**
  *   **Assertion Constraint (1):** If you collapse this, you cannot write a code of conduct that distinguishes "false reporting" from "spin."
  *   **Intent Condition (2):** If you collapse this, you cannot distinguish fraud from negligence.
  *   **Agent-Neutrality (6):** Given your explicit aim to govern AI, an account that requires human qualia is useless.

  **Optional (Negotiable Trade-offs):**
  *   **The Equivalence Challenge (7):** You may choose an account that says lying is *always* worse than misleading (Absolutist), or that they are *equally* bad (Consequentialist). The specification only demands the account *take a position*, not a specific one.
  *   **The Malicious Prohibition (4):** You may accept an account that says lying to the murderer is *obligatory* (overriding the prohibition) or one that says it is *forbidden* (upholding the prohibition). The requirement is only that the account *process* the intuition, not necessarily validate it.

  ---

  ### IV. Inconsistencies and Trade-Offs

  There is a fundamental tension within this specification that no single account may satisfy without cost. This is the **Consistency Paradox**.

  **The Conflict:**
  *   **Requirement 3 (Benign Exception)** demands that some lies (white lies, placebos) are permissible.
  *   **Requirement 4 (Malicious Prohibition)** demands that the intuition that lying is forbidden (even to the murderer) is respected.
  *   **Requirement 7 (Equivalence Challenge)** demands an explanation of why the *method* (lying vs. misleading) matters.

  **The Inconsistency:**
  If you satisfy **Requirement 3** (allowing benign lies), you undermine the strength of **Requirement 4** (that lying is inherently forbidden). If lying is permissible for benevolence, why is it forbidden for self-preservation against a murderer?
  *   *Resolution:* The account must introduce a hierarchy of goods (e.g., "Life > Truth" but "Feelings < Truth").
  *   *The Deeper Conflict:* If you satisfy **Requirement 7** by arguing lying is *distinctively worse* than misleading (due to the violation of the assertion norm), you struggle to explain why **Requirement 3** allows *lying* (the worse act) for placebos but often relies on *misleading* (the better act) for politeness.
  *   *The AI Conflict:* **Requirement 6** (AI) conflicts with **Requirement 2** (Intent). AI does not "believe." To satisfy 6, you must reduce Intent to "Objective Function Optimization." This risks collapsing the distinction between Lying and Bullshitting (Requirement 2), as an AI optimizing for engagement might be indifferent to truth (Bullshit) while outputting falsehoods (Lie).

  **Most Useful Result:**
  The specification reveals that **Legal Formalism (5)** and **Moral Substantivism (3 & 4)** are in tension. The law often punishes the *form* (perjury = false statement). Morality often judges the *substance* (harm caused). An account that aligns perfectly with the law may fail moral nuance; an account that captures moral nuance may be impossible to codify into the bright-line rules required for AI and Law. **You cannot have an account that is both legally precise and morally granular without a mechanism to translate between them.**

  ---

  ### V. The "Killer" Requirement

  The single requirement that does the most to eliminate the leading positions is **Requirement 7: The Equivalence Challenge.**

  **Why it eliminates the Absolutist:**
  The Absolutist claims lying is intrinsically wrong. But if paltering (misleading) achieves the exact same false belief and harm, the Absolutist must explain why the *physical act of assertion* carries moral weight independent of the *deceptive outcome*. If they cannot, their prohibition looks like fetishizing speech acts over human welfare. If they admit paltering is equally wrong, their "prohibition on lying" is under-inclusive and needs to be a "prohibition on deception," changing the theory.

  **Why it eliminates the Consequentialist:**
  The Consequentialist claims morality is determined by outcomes. If lying and misleading produce identical false beliefs and harms, they must be morally identical. However, **Requirement 1 (Assertion)** and **Requirement 5 (Legal Fit)** demand a distinction. Social trust is damaged differently by explicit lies than by implicature. If the Consequentialist cannot account for the *long-term institutional damage* of lying vs. misleading (which differs despite identical immediate outcomes), their calculus is too short-sighted to guide rule design.

  **Why it eliminates the Skeptic:**
  The Skeptic claims the distinction carries no moral weight. **Requirement 5 (Legal Fit)** and **Requirement 1 (Assertion)** demonstrate that society *acts* as if there is a weight. To guide rule design, the Skeptic must explain why we should maintain laws (perjury) that track a distinction they claim is morally empty. If they cannot justify the institutional utility of the distinction, they cannot guide the design of professional codes.

  **Conclusion:**
  Requirement 7 forces the account to explain **why the mechanism of deception matters.** It prevents the Absolutist from hiding behind "rules," the Consequentialist from hiding behind "outcomes," and the Skeptic from hiding behind "semantics." It demands a theory of **Trust Architecture**: how different modes of deception degrade the social or human-machine trust bond in quantitatively or qualitatively different ways.
