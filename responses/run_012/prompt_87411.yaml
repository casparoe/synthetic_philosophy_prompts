  The late afternoon light slanted through the high windows of the Oxford laboratory, illuminating dust motes dancing above the whiteboard. Mira stirred her tea, the spoon clinking against the mug, while Hugo paced before the diagram of the box, the piston, and the growing stack of registers labelled 'Cupboard'.

  'It seems too clean, Hugo,' Mira said, setting the mug down. 'You have a machine that extracts $kT \ln 2$ of work every cycle, simply by shuffling bits into a cupboard. You agree the measurement is reversible. You agree the swap is reversible. So where is the debt?'

  'The debt is deferred,' Mira answered her own question, turning to face him. 'But you treat the deferral as if it were a cancellation. I say the bill falls on the preparation of those blank registers. To have a stock of pristine, zero-entropy bits ready to receive data requires work elsewhere. You cannot simply assume a supply of low-entropy resources without accounting for how they got that way.'

  Hugo stopped pacing and leaned against the desk. 'But that pushes the problem back a step. If I hand you a box of blank registers, prepared by some prior process, you must accept they are blank. If the cost was paid in the past, why does it invalidate the current cycle? You are charging me for the history of the equipment, not the operation of the engine.'

  'Because the Second Law is about cycles,' Mira countered. 'If your engine relies on consuming low-entropy resources without replenishing them, it is not a perpetual motion machine; it is a battery. The bill falls on the finitude of the stock. Eventually, the cupboard is full. You run out of blank registers. At that moment, the engine stops.'

  'So the Second Law is merely a statement about inventory management?' Hugo raised an eyebrow. 'You are reducing a fundamental law of nature to the contingent fact that my laboratory is not infinite. If I had a larger cupboard, the law would hold for longer? That suggests the violation is real, merely limited by supply. I press you: if the universe were large enough, would your law break?'

  'No, because the bill also falls on the agent,' Mira said, shifting her ground. 'Even if the cupboard is vast, someone must eventually describe the world. To bring your description of the world up to date—to know which bits are in the cupboard—requires a measurement. If you never look, the registers are useless. If you do look, you must clear your own memory to record new data. The cost is in the epistemic update.'

  Hugo pushed off the desk, walking back to the board. 'Now you are hiding the cost in the observer's mind. But the physics of the gas and the piston proceeds regardless of whether a human looks at the registers. The correlation exists between the molecule and the register whether an agent reads it or not. You are conflating thermodynamics with knowledge.'

  'Let me ensure I understand your position,' Mira said, folding her arms. 'You argue that the correlations stored in the cupboard constitute thermodynamic entropy themselves, regardless of observation. You hold that a reversible operation can shift a correlation about but cannot destroy one, and therefore the total entropy of the universe increases with every bit swapped into the cupboard, even if no heat is dissipated.'

  'Precisely,' Hugo said. 'The joint state of the gas and the register has a phase-space volume that reflects the correlation. You cannot erase that correlation without dissipation. Since you are accumulating correlations in the cupboard, you are accumulating entropy. The Second Law is safe because the entropy is there, physically, in the joint system.'

  'And my position, in your view?' Mira asked.

  'You believe the Second Law is a safeguard for agents with finite memories,' Hugo replied. 'You think the law forbids us from simplifying our description of the world without cost. You argue that the demon fails not because the physics stops working, but because the accountant eventually runs out of paper.'

  'That is a fair summary,' Mira conceded. 'But if the entropy is purely in the correlation, and no one ever measures the cupboard, is it entropy or merely a record of what nobody has bothered to look at? If I leave the cupboard sealed forever, does the universe care?'

  'The universe does not care about your ignorance,' Hugo said firmly. 'The correlations are physical constraints. They reduce the available phase space for future operations. That is objective.'

  'Then show me,' Mira challenged. 'If information is physical, as you assert, prove it. Do not let the assertion stand. Why is a correlation in a dark cupboard thermodynamically equivalent to heat in a reservoir?'

  Hugo hesitated, tapping the marker against his chin. 'Because to reuse that register, you must reset it. And to reset it, you must dissipate heat. The potential for work is locked in that correlation. If you cannot access it without paying, it counts as entropy.'

  'But we agreed clearing a known bit costs nothing,' Mira pointed out. 'If I open the cupboard and look, the bit becomes known. I can then clear it for free. So the cost is not in the clearing, but in the looking. You are circling back to the agent.'

  'Not necessarily,' Hugo said. 'The cost is in the fact that the register is no longer blank. Its capacity to absorb entropy is consumed. You cannot build this demon, Mira. Not really.'

  'Why not?'

  'Because the stock of blank registers cannot be infinite,' Hugo said. 'The universe is finite. Physical memory requires physical substrate. You cannot pack an infinite number of distinguishable states into a finite volume without energy costs that scale up. Eventually, the density of the registers themselves creates a gravitational collapse or thermal noise that overrides the signal. The demon fails because the hardware fails.'

  'So it is contingent,' Mira said. 'It fails because of gravity or noise, not because of the Second Law of Thermodynamics. You are defending the law by appealing to other laws.'

  'I am defending it by appealing to physics,' Hugo retorted. 'You ask what the Second Law forbids on my account. It forbids the destruction of distinctions. It forbids reducing the phase-space volume of a closed system without compensation. The demon attempts to reduce the entropy of the gas by exporting it to the registers. If the registers are part of the system, the total entropy does not decrease. If they are not, you have opened the system.'

  'But if the registers are in the cupboard and never interact again,' Mira pressed, 'they are effectively removed from the system. On your account, the Second Law forbids heat flowing uphill, but here the heat flows from reservoir to work. The only violation is the accumulation of unobserved bits. Is the Second Law a statement about the behaviour of reversible dynamics and the impossibility of destroying a distinction, or is it about the epistemic position of agents with finite memories?'

  'It is about the dynamics,' Hugo insisted. 'The distinction exists physically.'

  'You assert it exists physically,' Mira said. 'But if no interaction can ever reveal it, in what sense is it physical? You say the demon cannot be built because of finite volume. I say the law holds because the preparation of that volume cost entropy. We are arguing over where the ledger is balanced.'

  'We are arguing over whether the ledger exists independently of the banker,' Hugo said.

  'Then state it,' Mira said. 'What is the core disagreement?'

  Hugo looked at the board, at the drawn cupboard filling with bits, then at Mira. 'You believe the cost is in the preparation of low-entropy resources,' he said slowly. 'I believe the cost is in the accumulation of correlation itself.'

  'And neither of us can prove the other wrong without assuming the very principle in dispute,' Mira said. She picked up her tea, her eyes fixed on him. 'We differ over whether the Second Law is a statement about the behaviour of reversible dynamics and the impossibility of destroying a distinction, or the epistemic position of agents with finite memories and the cost of preparing low-entropy resources.'
