answer: |-
  This position is a variant of **Reductive Naturalistic Moral Realism**, specifically tuned to deflect Evolutionary Debunking Arguments (EDAs) like those of Sharon Street and Richard Joyce. It attempts to solve the "coincidence problem" by collapsing the distinction between the *cause* of the belief (evolutionary fitness) and the *truth-maker* of the belief (moral facts).

  Here is the mapping of its exposure, the ranked defeaters, the internal dialectic, and the verdict on its empirical risk.

  ### 1. Argument vs. Construction
  **Verdict: 10% Argument, 90% Construction.**

  The *argumentative* core is thin and logically valid: If Moral Property $M$ is identical to Natural Property $N$, and our belief-forming faculties were selected for tracking $N$, then our faculties track $M$. The EDA fails because the "off-track" premise is false.

  The *construction* is massive. You must construct an identity claim ($M = N$) that is robust enough to satisfy moral phenomenology (normativity, authority, universality) but specific enough to match the actual output of evolutionary psychology. The EDA does not fail because of the logic; it fails only if the specific natural facts you identify (cooperation, reciprocity) actually exhaust the domain of morality. The heavy lifting is done by the substantive claim that "moral truth" is nothing over and above "fitness-enhancing social coordination." This is not a logical necessity; it is a substantive bet on the nature of value.

  ### 2. Ranked Defeaters
  Ranked from fatal (abandon the view) to awkward (requires patching).

  #### **I. Fatal: The "Repugnant Fitness" Finding**
  *   **The Defeater:** Empirical evidence that the evolutionary causes of our moral intuitions track fitness strategies that are morally repugnant by the view's own lights.
  *   **The Scenario:** Evolutionary psychology demonstrates that a significant portion of our "moral" repertoire (e.g., purity norms, xenophobic out-group hostility, patriarchal hierarchy) was selected for because it enhanced group competition or reproductive skew, *not* because it facilitated general cooperation or reduced vulnerability.
  *   **Why Fatal:** Your view claims the genealogy is a discovery of truth-makers. If the genealogy reveals that our strongest moral convictions are adaptations for *dominance* or *parochial exclusion*, you are committed to saying those convictions are *true* (because they track the natural facts that caused them). If you then say, "Well, those aren't the *real* moral facts," you have abandoned the identity claim and re-opened the gap the EDA exploits.
  *   **Prediction vs. Rivals:**
      *   *Rivals (Non-Naturalists):* Predict that evolved intuitions may systematically diverge from moral truth (e.g., we evolved to favor kin, but morality demands impartiality).
      *   *Your View:* Predicts that evolved intuitions generally align with moral truth.
      *   *Falsification:* If moral progress consistently requires *overriding* deep-seated evolutionary intuitions (e.g., effective altruism toward distant strangers who offer no reciprocity), your view predicts this progress is unintelligible or impossible, whereas rivals predict it is difficult but real.

  #### **II. Serious: The Reform and Error Problem**
  *   **The Defeater:** The inability to make sense of radical moral reform that contradicts the "natural facts" of the time.
  *   **The Scenario:** Consider the abolition of slavery. In the 18th century, the "natural facts about cooperation and reciprocity" within the dominant economic framework arguably supported slavery (it was stable, reciprocal among citizens, fitness-enhancing for the owners).
  *   **Why Serious:** If moral facts *are* the natural facts explaining the beliefs, then for the slaveholder, slavery was morally right (it tracked the local natural facts of their social equilibrium). You lose the ability to say they were *wrong* about the moral facts, only that they were right about the facts *then* and we are right about the facts *now*. This collapses morality into social convention or game-theoretic equilibrium, making moral error regarding one's own time nearly impossible.
  *   **Phenomenology:** It cannot describe the phenomenology of the reformer who feels they are discovering a truth that *contradicts* the prevailing social/natural order, not just updating to a new equilibrium.

  #### **III. Moderate: The "Is-Ought" Collapse**
  *   **The Defeater:** The view collapses into a rival it was meant to displace (specifically, a sophisticated Expressivism or Relativism).
  *   **The Scenario:** If you define moral facts as "facts about cooperation," critics will argue you have changed the subject. When people argue about abortion or rights, they are not arguing about game-theoretic stability; they are arguing about authority and reasons.
  *   **Why Moderate:** You can bite the bullet and say "folk morality is confused," but this risks making your realism irrelevant to actual moral discourse. It becomes a revisionary project rather than a vindication of existing practice.

  #### **IV. Awkward: The Multiple Realizability of Fitness**
  *   **The Defeater:** There is no single "natural fact" of cooperation.
  *   **The Scenario:** Different equilibria support fitness equally well (e.g., high-trust/low-punishment vs. low-trust/high-punishment societies).
  *   **Why Awkward:** If multiple, incompatible natural systems yield equal fitness, and moral facts *are* those natural facts, then there are multiple, incompatible moral truths. This pushes you toward relativism, which undermines the realist apparatus you wish to retain.

  ### 3. Defender Concessions and Dismissals
  How proponents of this naturalistic identity theory would handle the pressure.

  *   **On Parochialism (The "Repugnant Fitness" Defeater):**
      *   **Concede:** They must concede that *some* specific intuitions (e.g., disgust-based purity norms) are evolutionary byproducts and not truth-tracking.
      *   **Dismiss:** They will dismiss the threat by arguing that the *core* moral faculty (reciprocity, harm avoidance) is distinct from the *peripheral* faculty (purity, hierarchy). They will argue the EDA targets the wrong layer of psychology.
      *   **Grounds:** They rely on a "reflective equilibrium" between best evolutionary science and considered moral judgments. If they clash, they will tweak the interpretation of the evolutionary function rather than abandon the moral judgment.

  *   **On the Identity Claim (Cause = Truth-Maker):**
      *   **Concede:** They concede that *causal origin* does not usually equal *truth-maker* (e.g., I believe there is a cup because of photons, but the truth-maker is the cup).
      *   **Dismiss:** They dismiss the disanalogy by arguing morality is *functional*. The "cup" is defined by its shape; "morality" is defined by its role in social coordination. Therefore, the cause (selection for coordination) fixes the reference of the term.
      *   **Grounds:** Functional role semantics.

  *   **On Retaining Realist Apparatus:**
      *   **Concede:** They concede they retain "correctness" and "facts."
      *   **Dismiss:** They dismiss the charge that this is "spooky." They argue naturalism *earns* the right to normativity by showing how normative force arises from the needs of agents embedded in a causal world.
      *   **Grounds:** The "Queerness" argument cuts both ways; it is queerder to posit non-natural facts than to posit that natural facts have normative grip on agents who need them to flourish.

  ### 4. Verdict on the Three Pressures
  You guessed the pressure comes from three directions. Here is the ranking of seriousness:

  1.  **Most Serious: Parochialism and Reform.**
      *   **Why:** This is the empirical kill-shot. If morality tracks fitness/cooperation, and fitness/cooperation sometimes requires oppression (e.g., stable caste systems), your view implies those systems were morally valid *at the time*. This makes moral progress look like mere drift in environmental parameters, not correction of error. It renders the reformer's claim ("I am right, my society is wrong") false; the reformer is just "ahead of the curve" on natural facts, not morally superior in a timeless sense. This strips morality of its critical power.

  2.  **Second: The Identity Claim Motivation.**
      *   **Why:** It is philosophically vulnerable but defensible via functionalism. The claim that "the cause is the truth-maker" is only plausible if morality is *defined* by its causal role. If morality has intrinsic content beyond its function, the identity fails. This is a conceptual battle, not an empirical one, so it is less likely to force abandonment than a hard empirical mismatch.

  3.  **Least Serious: Retaining Realist Apparatus.**
      *   **Why:** This is a standard move for naturalists. As long as the natural facts can bear the weight of "oughtness" (via hypothetical imperatives or constitutive norms of agency), the view survives. The debunkers argue they can't; the naturalists argue they can. This is a stalemate, not a defeater.

  ### 5. Honest Verdict on Risk and Falsifiability
  **Does the position risk anything?**
  Currently, **no.** Stated loosely, it is unfalsifiable.

  **The Defect:**
  The view suffers from the **"No-Lose" Betting Structure.**
  *   If our moral intuitions match evolutionary predictions: "See? Truth-tracking!"
  *   If our moral intuitions *diverge* from evolutionary predictions (e.g., we feel obliged to help strangers who can't reciprocate): "See? We have discovered *higher-order* natural facts about rational agency/cooperation that override the primitive impulses."
  *   If our moral intuitions are repugnant (e.g., xenophobia): "That's not the *moral* faculty; that's a byproduct/disorder."

  By allowing yourself to cherry-pick *which* evolutionary outputs count as "moral" (cooperation) and which count as "noise" (disgust/tribalism) based on whether they align with your pre-theoretical moral commitments, you insulate the view from empirical refutation. You are using your moral intuitions to filter the evolutionary data, then using the filtered evolutionary data to vindicate your moral intuitions.

  **What a Version with Genuine Empirical Content Would Look Like:**
  To make this view risky (and thus scientifically respectable), you must fix the identity claim *independently* of your moral intuitions.
  1.  **Pre-commitment:** You must specify *exactly* which natural properties constitute moral facts *before* looking at the moral intuitions. (e.g., "Moral Rightness = Maximizing Inclusive Fitness" or "Moral Rightness = Nash Equilibria in Repeated Games").
  2.  **Falsification Condition:** You must identify a specific, robust moral intuition that is widely held but contradicts this pre-committed natural fact.
      *   *Example:* If you define Morality = Reciprocal Altruism, and you find that humans have a robust, non-derivative intuition that we owe duties to **non-reciprocating future generations** or **sentient animals who cannot cooperate**, and you cannot explain this as a miscalculation of reciprocity, your theory is falsified.
      *   *Example:* If you find that moral progress (e.g., universal human rights) systematically *reduces* group fitness or stability in the short-to-medium term, and you still claim it is "true," you have admitted that moral truth comes apart from the natural facts of fitness/cooperation.

  **Conclusion:**
  Your view is currently a **protective belt** around moral realism, not a standalone theory. It works only if you are allowed to define the "relevant natural facts" retrospectively to match the moral intuitions you wish to save. To transform it into a genuine argument, you must risk being wrong about the *content* of morality based on the *science* of cooperation. If you are unwilling to say, "If evolutionary game theory shows that rights reduce fitness, then rights are not morally required," then you are not a naturalist realist; you are a non-naturalist realist using naturalist language to dodge debunkers.
