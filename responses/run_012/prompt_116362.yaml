          *   Weakness 3: Causality. Does changing the protected attribute *actually* isolate bias, or just mask proxy correlation?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Damage Level 1 (High):* The Actuarial Soundness/Legal Authority clash. If the score isn't the decision, is it still actuarially justified?
