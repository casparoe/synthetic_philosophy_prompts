          *   Weakness 3: Proxy variables. If the score *itself* is biased (correlated with protected class), does the rule matter?
          *   Weakness 4: Implementation friction. Vendors sell "decisions," not just scores.
      *   *Thesis 2 (Swap Test):*
          *   Weakness 1: Statistical power. Is one swap enough? What about interaction effects?
