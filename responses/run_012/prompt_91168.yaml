  2.  **Deconstruct the Frege-Geach Problem:**
      *   *Core Issue:* Moral sentences look like propositions (they can be true/false, embedded in logic), but Expressivism says they are non-cognitive attitudes (boo/hurrah).
      *   *The Embedding Problem:* In "If kicking puppies is wrong, then teaching children to kick puppies is wrong," the speaker isn't necessarily booing puppy-kicking in the antecedent. They are hypothesizing. So what does "wrong" mean there? If it means "Boo!", the sentence becomes "If Boo! puppy-kicking, then Boo! teaching..." which doesn't make logical sense.
      *   *The "Save":* Expressivists often argue that the *meaning* is constant (it always refers to the attitude type), even if the *force* (actually having the attitude) changes.
      *   *The Counter:* But then how do we reason with it? How does "I doubt X is wrong" work if "wrong" just means "I disapprove"?

