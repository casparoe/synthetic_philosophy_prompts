answer: |-
  An expressivist and a skeptic are stuck in a departmental elevator.

  The expressivist says, "Look, it's simple. When you say 'Kicking puppies is wrong,' you aren't stating a fact. You're just expressing your disapproval. It's basically 'Boo puppies!'"

  The skeptic nods. "Okay. But what if I say, 'I *doubt* kicking puppies is wrong'?"

  "Same meaning," says the expressivist. "The word 'wrong' still signifies disapproval."

  "But I'm not disapproving," says the skeptic. "I'm explicitly telling you I'm unsure. I'm withholding the 'Boo.'"

  "Ah," says the expressivist, "but the *meaning* of the word remains constant, even if the psychological *force* changes. The word 'wrong' still does the job of referring to the attitude, even if you aren't currently having it."

  The skeptic thinks for a moment. "So, in that sentence, the word 'wrong' is carrying the emotional weight... while I'm just holding the microphone?"

  "Essentially, yes. The logic holds because the semantic content is stable."

  "So 'wrong' is like a stunt double for my conscience?" the skeptic asks. "It shows up to the logical scenes so my actual feelings don't have to?"

  The expressivist opens their mouth to reply, but the doors open.

  "Because that doesn't solve the embedding problem," the skeptic calls out as they walk away. "That just turns ethics into emotional lip-syncing."
