answer: |-
  **Project Title:** Unit Commensurability and Threshold Comparability: A Structural Analysis of Lexical-Threshold Negative Utilitarianism

  This project tests the hypothesis that lexical-threshold negative utilitarianism is viable only if threshold comparability can be decoupled from unit commensurability, and it argues that the vagueness inherent in this decoupling is a structural feature rather than a defect. The standard objection to lexical thresholds assumes that positing a switching point on a welfare scale presupposes a single cardinal metric capable of measuring both pleasure and pain; by distinguishing the structural requirement for a threshold from the metric requirement for unit exchange, I will demonstrate that the objection targets a straw man, though this defense opens a secondary problem regarding vagueness that must be resolved to save the view from indeterminacy.

  **1. The Central Question**

  Can a lexical threshold be defined structurally via threshold comparability without presupposing unit commensurability, and if so, does the inevitable vagueness in borderline trade-off cases render the view action-guiding?

  This question demands a determinate answer because the viability of the view hinges on the relationship between the two forms of comparability. If threshold comparability logically entails unit commensurability, the view collapses into standard utilitarianism or arbitrary stipulation. If threshold comparability can stand alone, the view survives the standard objection, but only if the resulting vagueness—where it is unclear whether to spare one agony or distribute many modest pleasures—is shown to be a permissible feature of value structure rather than a failure of normative guidance.

  **2. The Gap in Existing Positions**

  Current debates in value theory regarding negative utilitarianism and lexical views leave this question open because they operate under a shared assumption that commensurability is binary: either values are fully commensurable on a single scale, or they are incomparable. Standard consequentialist defenses assume unit commensurability is necessary for any trade-off analysis, thereby conceding the threshold objection before it is raised; they argue that if suffering and pleasure can be weighed at all, they must share a common unit, which makes lexical priority appear as an arbitrary interruption of a continuous scale. Conversely, deontological or rights-based objections to utilitarianism often posit lexical priorities but lack a welfare-based account of the threshold, relying instead on agent-relative constraints or inviolable rights that do not address the specific structural problem of welfare thresholds.

  Neither approach isolates the structural possibility of a threshold that functions without a common unit. The literature treats the threshold as a point *on* a scale rather than a boundary *between* scales. This conflation means that when vagueness arises in trade-off cases—such as determining how many modest pleasures outweigh one agony—critics diagnose this as evidence that the threshold is arbitrary because no unit exists to count the pleasures against the pain. However, this diagnosis presupposes that counting requires units. By failing to distinguish unit commensurability (the ability to exchange fixed amounts at a constant rate) from threshold comparability (the ability to identify a level at which priority switches), existing arguments leave open the possibility that the threshold is real but vague, rather than arbitrary. The project addresses this gap by treating the threshold not as a metric measurement but as a structural transition, thereby shifting the burden of proof onto the claim that vagueness implies indeterminacy.

  **3. Method and Work Plan**

  The summer will be divided into three months of focused conceptual analysis and modeling, prioritizing the derivation of the threshold structure over the defense of the normative view itself.

  *Month 1: Formalizing the Distinction.*
  The first month will be dedicated to constructing a rigorous conceptual distinction between unit commensurability and threshold comparability. I will develop a formal or quasi-formal model that represents welfare spaces where lexical priority operates without a common cardinal unit. This involves defining the conditions under which a "level" of suffering can be identified as lexically significant without referencing a quantity of pleasure that could offset it. The goal is to produce a definition of the threshold that is invariant to changes in the unit of measurement for pleasure, thereby proving that the threshold does not rely on unit commensurability. I will avoid the obvious alternative of simply stipulating a threshold (e.g., "suffering above intensity X is lexical") because stipulation begs the question against the objection; it assumes we can identify X without a common scale. Instead, I will derive the threshold conditions from the phenomenological or structural properties of agony versus modest pleasure, arguing that the switch in priority is grounded in a qualitative shift rather than a quantitative accumulation.

  *Month 2: The Vagueness Test.*
  The second month will apply this model to the specific problem of vagueness in trade-off cases. I will analyze the case where a fixed number of people receive modest pleasures versus one person spared agony, treating the number of pleasure-recipients as a variable. Using the model from Month 1, I will determine whether the indeterminacy in the switching point is epistemic (we don't know the number) or ontic (there is no fact of the matter). If the distinction between unit commensurability and threshold comparability holds, the vagueness should resemble sorites paradoxes in other normative domains (e.g., wealth thresholds for taxation) rather than mathematical indeterminacy. I will test whether the view can offer action-guidance despite this vagueness, perhaps by adopting a supervaluationist approach or by arguing that the range of indeterminacy is narrow enough to be practically negligible. This step is crucial because successfully decoupling the concepts is useless if the resulting view cannot guide action in the very cases it was designed to address.

  *Month 3: Synthesis and Drafting.*
  The final month will integrate the structural model and the vagueness analysis into a cohesive argument. I will draft the core paper, focusing on demonstrating that the standard objection fails because it conflates the two forms of commensurability, while honestly assessing the cost of the vagueness solution. The writing will prioritize clarity on the unit/threshold distinction, ensuring that the argument does not inadvertently smuggle unit commensurability back into the definition of the threshold. I will also prepare a presentation of the findings for a departmental workshop, using feedback to refine the handling of the indeterminacy objection before submitting the paper for external review.

  **4. Outcomes and Failure Conditions**

  A successful outcome will consist of a validated conceptual model showing that threshold comparability does not entail unit commensurability, alongside a defensible account of why the resulting vagueness in trade-off cases is permissible. Specifically, success means producing a manuscript that demonstrates the standard objection is category mistake, and that the lexical-threshold view can be coherent even if it cannot specify the exact number of pleasures that outweigh an agony.

  The project fails if the analysis reveals that threshold comparability logically presupposes unit commensurability. If I cannot define the threshold without implicitly relying on a common metric to locate it, then the distinction is merely verbal, and the standard objection stands. A secondary failure condition is if the vagueness analysis shows that the indeterminacy is so wide that the view offers no action-guidance in realistic scenarios; if the range of permissible trade-offs spans from one person to a million, the view collapses into practical uselessness. In either failure case, the project will still yield a definitive argument against the viability of lexical-threshold negative utilitarianism, which is a valuable philosophical result, but it would not achieve the primary goal of defending the view.

  **5. Feasibility Assessment**

  This project is ambitious for a single summer, primarily because constructing a non-cardinal model of welfare thresholds requires careful logical work to avoid hidden assumptions. The risk is that Month 1 will consume too much time attempting to formalize the distinction, leaving insufficient time for the vagueness analysis in Month 2. If this occurs, I will cut the formal modeling component in favor of a purely conceptual analysis. While a formal model is preferable for precision, the core philosophical claim—that the objection conflates two distinct types of comparability—can be argued through rigorous conceptual distinction and case analysis alone. I will prioritize the vagueness problem over the formalization because the vagueness issue is the ultimate test of the view's viability; a formal model that does not resolve the indeterminacy problem is less valuable than a conceptual argument that does. By focusing on the vagueness test as the primary deliverable, I ensure that the project produces a determinate answer to the central question even if the structural modeling remains incomplete.
