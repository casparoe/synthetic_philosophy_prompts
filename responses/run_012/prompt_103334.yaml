          *   65-90: Debrief (The Reveal).
      *   **Troubleshooting:**
          *   *Failure:* Students update on the sequence of worlds (e.g., "He hasn't shown us Q2 yet").
          *   *Fix:* Emphasize each round is a "fresh scenario" or "parallel case." Or simply reset the narrative. "Imagine a new day."
          *   *Failure:* Math confusion.
