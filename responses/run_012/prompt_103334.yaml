  # Activity Design: The Ridge Radio

  **Target:** Graduate Seminar in Formal Epistemology (14 Students)
  **Duration:** 90 Minutes
  **Goal:** Demonstrate that updating on a conditional sentence is undefined without a specified selection protocol (likelihood function).

  ## 1. Materials & Setup

  **Room Layout:**
  *   One central "Broadcast Station" (Instructor's desk).
  *   Students seated in a semi-circle or clusters facing the station.
  *   Projector or Whiteboard visible to all.

  **Handouts (Minimal Text):**
  *   **The Map:** A simple square divided into four quadrants.
      *   Top Half: **Red** | Bottom Half: **Blue**
      *   Left Half: **A** | Right Half: **not-A**
      *   Quadrants labeled: **Q1 (Red-A)**, **Q2 (Red-not-A)**, **Q3 (Blue-A)**, **Q4 (Blue-not-A)**.
  *   **The Betting Slip:** A table with four rows (Q1–Q4) and columns for "Round 1" through "Round 4". Students write percentages (0–100) that must sum to 100 per round.
  *   **The Scorecard:** A personal log to track points (provided with a simple formula).

  **Instructor Materials:**
  *   **Four Protocol Decks:** Four distinct decks of cards. Each deck contains cards representing the Quadrants (Q1, Q3, Q4). *Q2 is never in any deck because the message is false there.*
      *   *Deck 1 (Fixed):* Equal mix of Q1, Q3, Q4.
      *   *Deck 2 (Antecedent-True):* Only Q1 cards.
      *   *Deck 3 (Antecedent-False):* Equal mix of Q3, Q4.
      *   *Deck 4 (Asymmetric):* Weighted mix (See Instructor Key).
  *   **A Die:** To demonstrate randomness during debrief.
  *   **Scoreboard:** To track aggregate class performance.

  ## 2. The Payoff Scheme (Proper Scoring Rule)

  To ensure students report honest credences, use a simplified **Quadratic Scoring Rule**.

  **Instructions to Students (Verbal):**
  > "In each round, you will assign a probability (0% to 100%) to each of the four quadrants. They must sum to 100%.
  >
  > At the end of the round, I will reveal the true Quadrant.
  >
  > Your score for that round is calculated as: **100 minus the Squared Error.**
  >
  > *   If you assigned $p\%$ to the *true* quadrant, your error is $(100 - p)^2$.
  > *   If you assigned $q\%$ to a *false* quadrant, your error adds $(0 - q)^2$.
  > *   Sum these errors for all four quadrants, subtract from 100.
  >
  > **Example:** Truth is Q1. You bet Q1: 80%, Q2: 10%, Q3: 10%, Q4: 0%.
  > Error = $(100-80)^2 + (0-10)^2 + (0-10)^2 + (0-0)^2$
  > Error = $400 + 100 + 100 + 0 = 600$.
  > Score = $1000 - 600 = 400$ points. (Scale adjusted for ease).
  >
  > **Maximize your points by writing exactly what you believe.**"

  *(Note: For in-class speed, provide a pre-calculated lookup table or a simple spreadsheet on the projector where they type percentages and it outputs the score.)*

  ## 3. Timeline (90 Minutes)

  ### Phase 1: Setup (00:00 – 00:15)
  *   **00-05:** Distribute Map and Betting Slips. Explain the Geography (Red/Blue, A/not-A). Confirm uniform prior (you are equally likely to be anywhere).
  *   **05-15:** Explain the Betting Game and Scoring Rule. Run one practice round with *no message* (just guess the prior) to ensure they understand the scoring. (Correct Prior: 25% each).

  ### Phase 2: The Four Rounds (00:15 – 00:55)
  *   **Instruction:** "I am the Spotter. I see where you are. I will radio one sentence. You update your beliefs and bet. Then I reveal where you actually were. We do this four times."
  *   **Constraint:** "I will not tell you *why* I chose that sentence. Just trust that I am telling the truth."

  *   **Round 1 (00:15 – 00:25):**
      *   **Message:** "If you are in Red, you are in A."
      *   **Protocol:** Fixed Probability (Deck 1).
      *   **Action:** Students bet. Instructor draws from Deck 1. Reveal World. Score.
  *   **Round 2 (00:25 – 00:35):**
      *   **Message:** "If you are in Red, you are in A." (Identical sentence).
      *   **Protocol:** Antecedent-True (Deck 2).
      *   **Action:** Students bet (likely similar to R1). Instructor draws from Deck 2 (Must be Q1). Reveal World. Score.
  *   **Round 3 (00:35 – 00:45):**
      *   **Message:** "If you are in Red, you are in A."
      *   **Protocol:** Antecedent-False (Deck 3).
      *   **Action:** Students bet. Instructor draws from Deck 3 (Q3 or Q4). Reveal World. Score.
  *   **Round 4 (00:45 – 00:55):**
      *   **Message:** "If you are in Red, you are in A."
      *   **Protocol:** Asymmetric Vacuity (Deck 4).
      *   **Action:** Students bet. Instructor draws from Deck 4. Reveal World. Score.

  ### Phase 3: Aggregation & The Reveal (00:55 – 01:05)
  *   Collect Betting Slips.
  *   Project a table showing the **Class Average Bet** for each Round vs. the **Actual World Distribution** used in that Round.
  *   **Observation:** The Message was identical. The "Rational Bet" (matching the Deck) was different every time. Most students likely kept their bets stable (e.g., 33/33/33) and lost heavily in Rounds 2 and 3.

  ### Phase 4: Debrief (01:05 – 01:30)
  *   **The Reveal:** Show the four Protocol Decks. Explain the rule used for each.
  *   **Discussion:**
      *   Why did the same sentence mean different things?
      *   What piece of information was missing from the radio transmission? (The Selection Rule).
      *   Map the Decks to Likelihood Functions ($P(Message | World)$).
      *   Introduce the formal terms: *Conditionalization, Likelihood, Protocol, Gricean Norms.*
  *   **Conclusion:** Updating is not defined on the proposition alone, but on the proposition *plus* the likelihood of its utterance.

  ## 4. Instructor Key (The Math & Protocols)

  **Prior:** $P(Q1)=P(Q2)=P(Q3)=P(Q4) = 0.25$.
  **Message $M$:** "If Red, then A" (Material Conditional: $\neg R \lor A$).
  **Truth:** $M$ is True in Q1, Q3, Q4. False in Q2.

  **Protocol 1: Fixed Probability (The "Friend" View)**
  *   **Rule:** "Whenever $M$ is true, I say it with equal probability."
  *   **Likelihoods:** $P(M|Q1) = P(M|Q3) = P(M|Q4) = k$.
  *   **Deck Composition:** Equal cards of Q1, Q3, Q4.
  *   **Target Posterior:** Q1: 33%, Q3: 33%, Q4: 33%.
  *   **Teaching Point:** This reproduces standard conditionalization ($P(Q|M) = P(Q \land M)/P(M)$).

  **Protocol 2: Antecedent-True (The "Red" Spotter)**
  *   **Rule:** "I only speak about Red if you are actually in Red."
  *   **Likelihoods:** $P(M|Q1) = 1$. $P(M|Q3) = 0$. $P(M|Q4) = 0$.
  *   **Deck Composition:** 100% Q1 cards.
  *   **Target Posterior:** Q1: 100%.
  *   **Teaching Point:** Hearing the message proves you are in Red (and A).

  **Protocol 3: Antecedent-False (The "Blue" Spotter)**
  *   **Rule:** "I only speak about Red if you are *not* in Red (vacuous truth)."
  *   **Likelihoods:** $P(M|Q1) = 0$. $P(M|Q3) = 0.5$. $P(M|Q4) = 0.5$. (Assuming symmetry in Blue).
  *   **Deck Composition:** 50% Q3, 50% Q4.
  *   **Target Posterior:** Q3: 50%, Q4: 50%. (Credence on Blue = 100%).
  *   **Teaching Point:** Hearing the message proves you are in Blue.

  **Protocol 4: Asymmetric Vacuity (The "User's" View)**
  *   **Rule:** "If you are in Blue, I prefer to describe the negative (not-A)."
  *   **Likelihoods:** $P(M|Q1) = 1$ (Only true conditional). $P(M|Q3) = 0.25$. $P(M|Q4) = 0.75$.
      *   *Calculation for Target:* To get $P(Q4|M) = 0.5$, we need Likelihood Ratio $L4 : (L1+L3)$ to be $1:1$.
      *   Let $L1=1, L3=1, L4=2$.
      *   Unnormalized: $Q1(0.25), Q3(0.25), Q4(0.5)$. Total = 1.0.
      *   Posterior: Q1: 25%, Q3: 25%, Q4: 50%.
  *   **Deck Composition:** 1 Card Q1, 1 Card Q3, 2 Cards Q4.
  *   **Target Posterior:** Q4 gets half the credence.
  *   **Teaching Point:** Even within "true" statements, selection bias skews the posterior away from flat thirds.

  ## 5. Predictable Failures & Solutions

  **Failure 1: Students update on frequency during the game.**
  *   *Risk:* In Round 2, if the World is revealed as Q1, students might assume Round 3 will also be Q1.
  *   *Solution:* Explicitly state before *each* round: "This is a fresh scenario. The prior resets to uniform. The Spotter's rule is consistent *within* the round, but do not assume rules persist across rounds." (This is a white lie to preserve the experimental design, acknowledged in debrief).

  **Failure 2: Confusion over the Conditional.**
  *   *Risk:* Students treat "If Red then A" as "If and only if Red then A" or confuse it with "If A then Red".
  *   *Solution:* On the Map, visually cross out Q2 (Red-not-A) immediately after the message is read. Confirm everyone agrees Q2 is impossible. The debate is only about Q1, Q3, Q4.

  **Failure 3: Scoring Calculation Delays.**
  *   *Risk:* Calculating quadratic scores manually eats debrief time.
  *   *Solution:* Use a projected spreadsheet. Students shout their percentages for Round 1; you enter them; the sheet shows the score. Or, simplify scoring to "10 points if you assigned the highest probability to the true quadrant, 0 otherwise" (Less proper, but faster). *Recommendation:* Stick to the Proper Scoring Rule but provide a **Lookup Table** handout. (e.g., "If you bet 80% on Truth: 84 pts. If 60%: 68 pts...").

  **Failure 4: The "Cheating" Accusation.**
  *   *Risk:* In Round 2 (Deck 2), the World is *always* Q1. Students may feel the Instructor is rigging the world rather than following a protocol.
  *   *Solution:* In the Debrief, physically show Deck 2. It contains *only* Q1 cards. Shuffle and let a student draw to prove it. This validates the Likelihood function $P(M|Q3)=0$.

  ## 6. Limitations (What You Must Supply)

  This activity successfully demonstrates that **posteriors diverge** based on protocols. It does not, however, solve **which protocol is rational**.

  *   **The Gap:** The activity shows that Protocol 1 (Flat Thirds) is just one option among four. It does not prove it is the *default* rational choice.
  *   **Your Task:** In the final 15 minutes, you must lecture on **Gricean Maxims** and **Principle of Maximum Entropy**. Explain that while the *logic* allows all four protocols, conversational norms usually push us toward Protocol 1 (Fixed Probability) unless context suggests otherwise.
  *   **The Takeaway:** "The sentence gives you the Truth Conditions. The Context gives you the Likelihoods. Epistemology requires both."

  ## 7. Student-Facing Script (Opening)

  > "Welcome. You are lost. There is a map on your desk. You are in one of the four quadrants. You start with no idea where.
  >
  > I am the Spotter on the ridge. I can see you. I will radio you one sentence. It will be true.
  >
  > Your job is to tell me where you think you are. You will write percentages on your slip.
  >
  > I will score you on accuracy. The more confident you are in the truth, the more points you get. The more confident you are in a falsehood, the more points you lose.
  >
  > We will do this four times. The sentence might be the same. The world might change. Begin."

  ## 8. Debrief Mapping (Instructor Notes)

  When revealing the protocols, map them to the formal epistemology concepts:

  1.  **Deck 1 (Flat Thirds):** "This assumes $P(Message | World)$ is constant for all worlds where the message is true. This is **Standard Conditionalization**."
  2.  **Deck 2 (Red Only):** "This assumes the Spotter only speaks if the Antecedent is true. This makes the conditional equivalent to a conjunction ($R \land A$)."
  3.  **Deck 3 (Blue Only):** "This assumes the Spotter only speaks if the Antecedent is false. This makes the message evidence for $\neg R$."
  4.  **Deck 4 (Asymmetric):** "This assumes a bias in how vacuous truths are selected. This shows that even among true statements, **selection bias** alters the likelihood."

  **Closing Line:** "Your friend argued for Deck 1. You argued for the existence of Decks 2, 3, and 4. You were both right. He described the update *given* Deck 1. You described the uncertainty *about* the Deck. Without knowing the Deck, the update is incomplete."
