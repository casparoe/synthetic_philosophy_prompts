          *   This ensures the *empirical frequency* matches the *rational credence* for that protocol.
          *   *Risk:* Students will notice "Hey, Round 2 was always Q1."
          *   *Mitigation:* It's only one round per protocol. They can't infer frequency from n=1.
          *   *Debrief:* "In Round 2, the rule *forced* Q1. If you knew the rule, you should have bet 100% Q1. You didn't. You lost points."

  6.  **Refining the Debrief:**
