answer: |-
  The concept you are describing is established in mathematical logic and metamathematics. The principle itself is called the **Reflection Principle** (specifically, the *Uniform Reflection Principle*). The phenomenon that renders its global adoption ruinous is **Löb's Theorem**. In contexts involving self-modifying systems or epistemic agents, this specific limitation is often referred to as the **Löbian Obstacle**.

  I commit to the position that **Löb's Theorem** is the definitive name for the structural constraint you have identified, and that the pattern is best understood as the **Impossibility of Global Reflection**.

  Here is the breakdown of why this fits, why the asymmetry exists, and where the boundaries lie.

  ### 1. The Name and the Pattern
  The principle "If I have established $P$, then $P$" is formally written as $\square P \to P$, where $\square$ denotes "it is provable by me that." In logic, this is the **Reflection Principle**.

  The pattern you observe—that a system can verify any *specific* proof it has constructed ($\square P \to P$ for a particular $P$) but cannot assert the *general* claim that all its proofs are true ($\forall P, \square P \to P$)—is the direct consequence of **Löb's Theorem**.

  Löb's Theorem states that for any formal system capable of arithmetic (like Peano Arithmetic), if the system can prove that "if $P$ is provable then $P$ is true" ($\vdash \square P \to P$), then the system can prove $P$ itself ($\vdash P$).

  If the system adopts the Reflection Principle as a general axiom (asserting $\square P \to P$ for *all* $P$), it can apply Löb's Theorem to *any* statement $Q$. It asserts $\square Q \to Q$. By the logic of provability, it can also prove that it asserts this ($\vdash \square(\square Q \to Q)$). Löb's Theorem then licenses the system to conclude $Q$. Since $Q$ was arbitrary, the system proves everything, true or false. It collapses into triviality.

  Thus, the pattern is not merely a "near miss" like the Preface Paradox; it is a hard logical barrier. The Preface Paradox concerns rational *belief* (where inconsistency is regrettable but survivable); Löb's Theorem concerns *provability* (where inconsistency is fatal).

  ### 2. The Asymmetry: Truth vs. Provability
  You asked why the principle is harmless when read as a claim about truth but ruinous when read as a claim about provability. This asymmetry is the crux of the matter.

  **The Ruinous Claim (Provability):**
  When the system asserts $\square P \to P$, it is making a claim within its own language about its own syntactic operations. The operator $\square$ satisfies specific **Derivability Conditions** (the Hilbert-Bernays-Löb conditions). Crucially, one condition is that if the system proves $A \to B$, it proves $\square A \to \square B$. Another is that the system can prove its own consistency conditions up to a point. These conditions allow the system to "loop" the statement back into itself via the Fixed-Point Lemma. The system can construct a sentence $L$ that effectively says, "If I am provable, then I am true." Löb's Theorem shows that this self-referential loop forces the system to prove $L$ unconditionally, and if the loop is generalized, to prove everything.

  **The Harmless Claim (Truth):**
  When an external observer (or the system speaking from a meta-language) says, "Everything the system proves is true," they are making a **Semantic** claim about **Soundness**. This relies on a truth predicate, $True(P)$.
  However, **Tarski's Undefinability Theorem** dictates that a consistent formal system cannot define its own truth predicate. The system *cannot* internally express the claim "All my proofs are true" ($\forall P, \square P \to True(P)$) without becoming inconsistent for reasons unrelated to Löb (it would violate Tarski).
  Therefore, the claim is "harmless" only because it is **external**. It lives in the meta-language. The system can *be* sound (all its proofs are true) without being able to *say* or *prove* that it is sound.

  **The Verdict:**
  The asymmetry is a fact about **Provability**, not belief or self-reference in the abstract.
  *   **Belief:** In doxastic logic (logic of belief), we often idealize agents and assume axiom T ($\square P \to P$), meaning "If an agent believes $P$, $P$ is true." This is harmless there because doxastic logic typically ignores computational limits and the specific derivability conditions that trigger Löb's Theorem. It models an idealized, omniscient observer, not a computing machine.
  *   **Provability:** For a machine or a formal system, "belief" is "proof." Proof is computable and syntactic. Because it is syntactic, it is subject to Gödelian self-reference and Löb's Theorem.

  ### 3. Local vs. Global: The Remainder
  You noted the "strange remainder": the system can satisfy itself of any single proof but not the general claim.
  This is the distinction between a **Rule of Inference** and an **Axiom**.
  *   **As a Rule:** The system *uses* the rule "If $\vdash P$, then accept $P$." This is implicit in the definition of the system. It is safe. This allows the system to verify individual instances ($\square P \to P$) for any $P$ it actually proves.
  *   **As an Axiom:** The system *states* the rule as a theorem ($\forall P, \square P \to P$). This makes the rule an object of its own reasoning. This is fatal.

  This is why the system is **$\omega$-incomplete** regarding its own soundness. It can prove $P_1$, prove $P_2$, prove $P_3$... and for each, prove "If I proved $P_i$, then $P_i$." But it cannot prove the universal quantification over all $i$.

  ### 4. Conclusion
  The pattern has an established name. The principle is the **Reflection Principle**. The limitation is **Löb's Theorem**. The specific phenomenological pattern of being able to trust local instances but not global self-trust is the **Löbian Obstacle**.

  It is not merely a "near miss" of the Preface Paradox. The Preface Paradox is about the *rationality of inconsistent beliefs*. Löb's Theorem is about the *impossibility of consistent self-validation* in formal systems.

  **Commitment:**
  This is fundamentally a fact about **Provability**. While it applies metaphorically to human belief, the "ruinous" consequence only strictly holds when "belief" is cashed out as "formal proof" within a system that satisfies the derivability conditions. Human beings do not collapse into triviality when they assert their own reliability because human reasoning is not a formal system subject to Löb's Theorem (we are not $\omega$-consistent formal provers). However, for any machine, program, or formal agent, the **Löbian Obstacle** is absolute: you can have self-trust, or you can have consistency, but you cannot have a system that proves its own self-trust.

  **Term:** **The Löbian Obstacle** (to Reflective Consistency).
  **Definition:** The impossibility for a formal system to prove its own soundness (Reflection Principle) without becoming inconsistent, despite being able to verify the soundness of any individual proof.
  **Edges:** It applies to formal systems capable of arithmetic. It does not apply to informal human reasoning (except as an analogy) or to idealized doxastic logic that ignores computational realizability. It distinguishes **Soundness** (semantic, external, safe) from **Provably Sound** (syntactic, internal, explosive).
