answer: |-
  This is not a weird question at all. You have identified a structural failure in how groups process information. You are describing the breakdown of the **Wisdom of Crowds**, specifically the violation of its most critical condition: **independence**.

  When independence is lost, the math changes. You are correct that 600 reviews are not worth 600 opinions, and four interviewers speaking in sequence are not worth four independent assessments.

  Here is the carving you are looking for, broken down by the mechanism, the statistical error, and the distinction between your two examples.

  ### 1. The Review Scenario: The Information Cascade
  The phenomenon you are describing in the coffee grinder reviews is formally known in economics and sociology as an **Information Cascade**.

  Here is how the carving works:
  *   **The Mechanism:** Person 1 and 2 buy based on private information (they actually used the grinder). Person 3 sees two positive reviews and buys. Person 4 sees three. By Person 10, the "public signal" (the star rating) is so strong that it outweighs any private doubt they might have. They buy, and then they write a review.
  *   **The Illusion:** As you noted, the text of Review #500 looks like independent testimony. It contains specific details ("the burrs are sharp," "it's loud"). But the *decision to verify* was not independent. They only verified because the crowd told them it was worth verifying.
  *   **The Statistical Error:** The mistake you made (counting the crowd size as testimony) is called ignoring the **Effective Sample Size (ESS)**.
      *   In statistics, if data points are correlated, they contain less information than independent data points.
      *   If 600 people flip a coin, you have 600 bits of data. If 600 people copy the first person's coin flip, you have **1 bit of data** disguised as 600.
      *   In your review scenario, the ESS might be 20, not 600. The rest is **redundant signaling**.

  **Is there a name for the "hidden copying"?**
  In network science, this is sometimes called **Latent Homophily** or **Cryptic Herding**. But the most precise description of the *state of affairs* you described—where the output looks independent but the process was dependent—is **Mimetic Independence**. The reviews mimic the structure of independent inquiry without the substance.

  ### 2. The Hiring Scenario: Sequential Bias & Preference Falsification
  The hiring panel is structurally similar but mechanically distinct. You identified the difference perfectly: in the reviews, the *reasoning* was compressed into a number (stars). In the meeting, the reasoning is aired, but the *social cost* of disagreement rises with each speaker.

  *   **The Mechanism:** This is **Sequential Disclosure Bias**. Because opinions are voiced one after another, the early speakers set the **Anchor**.
  *   **The Psychological Shift:** Your colleague who flipped in real-time experienced **Preference Falsification** (a term coined by Timur Kuran). She privately held one view but publicly expressed another to align with the emerging consensus.
  *   **The Difference:** In the review case, the later people are lazy (rationally ignoring private research). In the hiring case, the later people are often silenced (socially pressured to conform).
  *   **The Result:** Both result in **Correlated Error**. If the first interviewer is biased against a specific trait, that bias is no longer random noise; it becomes a systematic error that the rest of the panel inherits.

  ### 3. The Carving: What distinguishes "Real" Consensus from "Echo" Consensus?
  You asked for the edges: *What would have to be true for six hundred reviews to actually be worth six hundred people?*

  For a crowd's agreement to be **Robust Consensus** rather than an **Echo Cascade**, three conditions must be met:

  1.  **Decoupled Observation:** The observers must not know the aggregate opinion before forming their own. (e.g., Amazon hides the star rating until *after* you submit your review).
  2.  **Diverse Incentives:** The observers must be looking for different things. (If all 600 reviewers are looking for "durability," you have 600 opinions on one dimension. If 200 look for durability, 200 for noise, and 200 for aesthetics, the ESS is higher).
  3.  **Uncorrelated Error:** The mistakes must be random, not systematic. (If the grinder has a flaw that only appears after 6 months, and all 600 reviewers write their reviews at 1 month, they are not 600 independent witnesses; they are 600 people blind to the same thing).

  **The Term for Real Agreement:**
  When a group agrees because they independently converged on the truth despite different starting points, this is called **Convergent Validation**. It is the gold standard of evidence.

  **The Term for the "Hidden Copying" State:**
  You asked for a name for the state where giveaways of copying are absent. In epistemology, this is **Spurious Corroboration**. The evidence *looks* like it corroborates (supports) the claim, but the support is spurious (false) because the sources are not independent.

  ### 4. Why the Hiring Case Feels Different (The "Compression" Point)
  You sensed the hiring case deserves its own term because the "compression" is different.

  *   **Reviews:** The compression is **Information Loss**. The nuanced reasons of the first 20 people are squashed into "4.5 Stars." The next 580 people react to the statistic, not the nuance.
  *   **Hiring:** The compression is **Social Weight**. The reasons are spoken, but they accumulate weight. By the fourth speaker, disagreeing requires overturning the "sunk cost" of the previous three people's social capital.

  The hiring problem is solvable with a procedural fix known as the **Delphi Method** (or simply **Simultaneous Disclosure**).
  *   **The Fix:** Everyone interviews the candidate. Everyone writes down their score and *key reasons* privately. Only *then* do they reveal them simultaneously.
  *   **Why it works:** It prevents the Anchor. It forces **Preference Revelation** instead of Preference Falsification. It preserves the Effective Sample Size of the panel.

  ### Summary of Terms for Your Toolkit

  If you want to use these concepts in your ops work without sounding like a textbook, here is the vocabulary set that matches your "carving":

  1.  **Effective Sample Size (ESS):** Use this when discussing the reviews. "We have 600 reviews, but the ESS is probably closer to 30 because of herding."
  2.  **Information Cascade:** The specific mechanism where later actors ignore their own private info to follow the public signal.
  3.  **Sequential Disclosure Bias:** The hiring problem. The order of speaking determines the outcome.
  4.  **Spurious Corroboration:** The state where evidence looks independent but isn't.
  5.  **Simultaneous Disclosure:** The solution to the hiring problem.

  **The Edge Case You Asked For:**
  You asked: *Is there a term for the state of affairs where the usual giveaways of copying are absent so a reader has no way to check?*

  In fraud detection and security, this is called **Sybil Resistance** failure. A "Sybil attack" is when one entity pretends to be many. In your review scenario, the crowd isn't necessarily one person (a bot farm), but they are acting as one mind. There isn't a perfect single English word for "organic Sybil behavior," but **Endogenous Herding** captures it. The herding comes from inside the system (endogenous), not from an outside attacker.

  **The Bottom Line:**
  You are seeing the difference between **Aggregation** (adding up independent signals) and **Amplification** (louder versions of the same signal).
  *   **Reviews:** Amplification masquerading as Aggregation.
  *   **Hiring:** Amplification caused by Sequence.

  The mistake you made in counting the reviews is assuming **Additivity**. You assumed Information = Person 1 + Person 2 + Person 3. In reality, Information = Person 1 + (Person 2 * Independence Factor) + (Person 3 * Independence Factor). When the Independence Factor drops to near zero, the crowd stops getting wiser and just gets louder.
