  ## V. What This Activity Cannot Reproduce

  **The Facilitator's Note:**
  This session simulates the *logic* of the problem, not the *weight*.
  In this room, if they fail to decide, nothing happens. The grant does not expire. Elias does not move.
  In the real world, the vertigo is accompanied by **grief**.
  You must assert this verbally at the end.
  Tell them: "The anxiety you felt when the numbers flipped was the simulation working. But in reality, that anxiety is the cost of governance. You cannot solve it. You can only own it."

  ---

  ## VI. Troubleshooting the Six Failure Modes

  1.  **Someone invents a zero-to-ten scale immediately.**
      *   *Fix:* The Auditors are your first line of defense. If they miss it, you intervene: "That is a valid heuristic, but it is not data. You have just assigned weights without justification. Write that down in your justification: 'We arbitrarily weighted Elias higher.'"
  2.  **Someone argues the trouble is subjectivity and the remedy is better measurement.**
      *   *Fix:* "Better measurement gives you better ordinal data. It does not give you a common unit. Can you measure 'pain' in the same units as 'joy'? If you say yes, you are making a philosophical claim, not a scientific one."
  3.  **The group reaches consensus too fast for the wrong reason.**
      *   *Fix:* "You agreed on Package B. Read your justification. Does it explain why Mara's gain outweighs Elias's loss? Or does it just say 'Mara is a nurse'? If it's the latter, you have a dictator, not a committee."
  4.  **One participant derails everything by insisting on procedure.**
      *   *Fix:* "Procedure is a way to avoid the moral choice. If you vote, you are saying 'the majority's intensity does not matter.' That is a valid ethical stance, but you must write it as such."
  5.  **Someone conflates utility with money.**
      *   *Fix:* "If we give cash, David might spend it on rent and Elias on paint. Is a dollar of rent worth a dollar of paint? If you say yes, you are assuming marginal utility of income is equal across persons. It rarely is."
  6.  **Phase Two consumes the debrief.**
      *   *Fix:* Strict timer. When the 3 minutes for the whiteboard demo are up, stop calculating. State the result. "The math works. The point is the fragility. Move on."

  ---

  ## VII. Final Check: The Vertigo Moment

  The session succeeds if, at minute 65, during the Rescaling Demo, the room goes quiet.
  When you multiply Elias's scores by 2 and the winner flips, watch the participants.
  They will look at the numbers, then at each other.
  They will realize the "truth" of the decision rested on a multiplier you chose arbitrarily.
  That silence is the goal. Do not fill it too quickly. Let them sit in the fact that they cannot prove their choice is right.
  That is the scene you are trying to write.
