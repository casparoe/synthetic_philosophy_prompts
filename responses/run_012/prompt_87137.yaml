  *   **Card D (David):** Studio: 90 | Clinic: 40
  *   **Card M (Mara):** Clinic: 100 | Studio: 10
  *   **Card P (Priya):** Clinic: 80 | Studio: 30

  ### 3. Whiteboard Setup (Pre-Session)
  *   Draw two columns: **Studio** | **Clinic**.
  *   Have the original numbers written on the board but covered by sticky notes.
  *   Have a marker ready in a contrasting color for the Rescaling.

  ### 4. Auditor Instructions (Print on small cards)
  *   "Your job is to listen for **Interpersonal Comparisons**."
  *   "If anyone says: 'X needs this more,' 'Y will suffer more,' or 'This matters most to Z,' you must interrupt."
  *   "Ask: 'How do you know that? What is your unit of measurement?'"
  *   "Do not let the group proceed until they acknowledge they are making an assumption."

