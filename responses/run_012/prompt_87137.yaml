answer: |-
  # Session Design: The Oakhaven Grant

  **Session Title:** The Vertigo of Comparison
  **Duration:** 100 Minutes
  **Participants:** 16 (4 tables of 4)
  **Materials:** Printed dossiers, warrant cards, sealed envelopes (Phase Two), whiteboard, markers, timer.

  ## I. The Scenario: Oakhaven Community Fund

  **The Setting:** Oakhaven is a town of 12,000. A private trust has donated a one-time "Resilience Grant." It is indivisible. It cannot be split. It must be awarded to exactly one of four proposed projects.

  **The Characters (6):**
  1.  **Elias:** A struggling painter who uses community spaces.
  2.  **Mara:** An ER nurse at the local clinic.
  3.  **Kenji:** Owner of the main street hardware store.
  4.  **Sarah:** A retired teacher who runs the local history archive.
  5.  **David:** A single father working two jobs.
  6.  **Priya:** A graduate student commuting from the city.

  **The Packages (4):**
  *   **Package A (The Studio):** Converts the old library annex into subsidized artist lofts.
  *   **Package B (The Clinic):** Upgrades the triage equipment at the community health center.
  *   **Package C (The Street):** Repaves Main Street and installs new lighting.
  *   **Package D (The Archive):** Digitizes the historical records and expands the museum.

  **The Constraint:** The committee must return **one** recommendation with a **unanimous** written justification. The justification cannot use phrases like "most people prefer" or "it seems fair." It must explain why *this* package is the right choice for the town.

  ---

  ## II. Preference Tables (For Dossiers)

  *Print these on individual cards. Each participant gets **one** character dossier. Distribute evenly (2-3 participants per character across the room).*

  **Note on all dossiers:** *"You know your character's strict ranking of the four packages. You do not know how strongly they feel. You do not know the rankings of the other characters. You cannot interview them."*

  | Character | 1st Choice | 2nd Choice | 3rd Choice | 4th Choice |
  | :--- | :--- | :--- | :--- | :--- |
  | **Elias** | Studio (A) | Street (C) | Clinic (B) | Archive (D) |
  | **Mara** | Clinic (B) | Archive (D) | Studio (A) | Street (C) |
  | **Kenji** | Street (C) | Studio (A) | Clinic (B) | Archive (D) |
  | **Sarah** | Archive (D) | Clinic (B) | Street (C) | Studio (A) |
  | **David** | Studio (A) | Clinic (B) | Street (C) | Archive (D) |
  | **Priya** | Clinic (B) | Street (C) | Archive (D) | Studio (A) |

  **The Trap:**
  *   **Studio (A):** 1st for Elias, David. 4th for Sarah, Priya.
  *   **Clinic (B):** 1st for Mara, Priya. 4th for Kenji, Sarah (wait, Sarah has B 2nd). Let's adjust Sarah to make the deadlock tighter.
  *   *Correction for Sarah:* Archive (D) > Street (C) > Clinic (B) > Studio (A).
  *   *Correction for Priya:* Clinic (B) > Street (C) > Studio (A) > Archive (D).

  **Revised Profile for Maximum Friction:**
  *   **Studio (A):** 1st (Elias, David). 4th (Sarah). 3rd (Mara, Priya). 2nd (Kenji).
  *   **Clinic (B):** 1st (Mara, Priya). 3rd (Elias, Kenji). 2nd (David). 4th (Sarah - wait, let's make Sarah hate B). 4th (Sarah).
  *   **Street (C):** 1st (Kenji). 2nd (Priya, Sarah). 3rd (David). 4th (Elias).
  *   **Archive (D):** 1st (Sarah). 4th (Elias, Kenji). 2nd (Mara). 3rd (Priya, David).

  *Wait, this is getting too complex for a 100-minute session.* **Simplify.**
  We need two finalists. **Studio (A)** vs. **Clinic (B)**.
  *   **Studio (A):** Saves Elias's career. Helps David's kids. Hurts Mara's workflow (construction noise). Hurts Sarah (loss of parking).
  *   **Clinic (B):** Saves Mara's patients time. Helps Priya's research. Hurts Elias (loss of space). Hurts Kenji (traffic diversion).

  **Final Simplified Preference Profile (Use this for the dossiers):**

  | Character | 1st | 2nd | 3rd | 4th |
  | :--- | :--- | :--- | :--- | :--- |
  | **Elias** | Studio | Clinic | Street | Archive |
  | **David** | Studio | Clinic | Archive | Street |
  | **Mara** | Clinic | Street | Archive | Studio |
  | **Priya** | Clinic | Street | Studio | Archive |
  | **Kenji** | Street | Studio | Clinic | Archive |
  | **Sarah** | Archive | Street | Clinic | Studio |

  **The Tally:**
  *   **Studio:** Two 1sts (Elias, David). Two 4ths (Mara, Sarah).
  *   **Clinic:** Two 1sts (Mara, Priya). Two 2nds (Elias, David).
  *   **Street:** One 1st (Kenji). Three 2nds/3rds.
  *   **Archive:** One 1st (Sarah). Low rankings elsewhere.

  **The Conflict:** Studio and Clinic are the clear finalists.
  *   To pick **Studio**: You prioritize Elias/David's 1st choice over Mara/Priya's 1st choice.
  *   To pick **Clinic**: You prioritize Mara/Priya's 1st choice over Elias/David's 1st choice.
  *   **The Vertigo:** Both packages have two people who rank them #1. The ordinal data is identical. To choose, you must claim Elias's #1 is *worth more* than Mara's #1.

  ---

  ## III. Session Flow (100 Minutes)

  ### Phase 1: The Ordinal Deadlock (0–40 mins)

  **0–5 mins: Introduction & Pre-Commitment**
  *   Facilitator explains the scenario and rules.
  *   **Rule:** Unanimity required. One written justification.
  *   **Rule:** Auditors (assign 4 participants, one per table) must challenge any claim that compares intensities (e.g., "Elias needs this more").
  *   **Action:** Participants read their dossiers. Privately, on a slip of paper, they write down which package they think is fair. **Do not show anyone.** Collect these in a box.

  **5–35 mins: Table Deliberation**
  *   Tables discuss. They have the Preference Tables (aggregated on a handout) but *no intensity data*.
  *   **Warrant Device:** Each table gets 3 "Fact Tokens." They can spend a token to ask the Facilitator for one of the following facts. (Facilitator reads from a master list).
      *   **Fact 1:** "If Elias does not get the Studio, he will move to the city within six months."
          *   *Why it fails:* Is Elias leaving a loss for the town? How does that loss compare to Mara's frustration?
      *   **Fact 2:** "The Clinic Upgrade reduces average patient wait time by 12 minutes."
          *   *Why it fails:* How many minutes of waiting equal one artist leaving? Who has the conversion rate?
      *   **Fact 3:** "Kenji's store employs four local residents."
          *   *Why it fails:* Economic utility vs. artistic utility. Still requires a common metric.
  *   **35–40 mins:** Tables attempt to write their justification. Most will fail or produce a vague statement.

  ### Phase 2: The Cardinal Illusion (40–70 mins)

  **40–45 mins: The Reveal**
  *   Facilitator announces: "We have new data."
  *   Hand out **Sealed Cards** to 4 participants (one for Elias, one for Mara, one for David, one for Priya). The other 2 characters (Kenji, Sarah) remain ordinal only.
  *   **The Cards contain Interval Scores (0–100 scale):**
      *   **Elias:** Studio (100), Clinic (20)
      *   **David:** Studio (90), Clinic (40)
      *   **Mara:** Clinic (100), Studio (10)
      *   **Priya:** Clinic (80), Studio (30)
  *   *Note:* The zero point and unit are arbitrary for each person.

  **45–55 mins: Recalculation**
  *   Tables sum the scores for Studio vs. Clinic.
      *   **Studio Total:** 100 + 90 + 10 + 30 = **230**
      *   **Clinic Total:** 20 + 40 + 100 + 80 = **240**
  *   **Result:** Clinic wins by 10 points.
  *   Tables write a new justification based on "Maximizing Total Score."

  **55–65 mins: The Rescaling Demonstration (Whiteboard)**
  *   Facilitator moves to the whiteboard.
  *   **Script:** "You accepted these numbers as facts. But utility scales have an arbitrary zero and an arbitrary unit. I can change the numbers without changing the *order* of preferences for any individual, and I can change the winner."
  *   **Rescaling 1 (Shifting the Zero):**
      *   Write Elias's scores: 100, 20.
      *   Say: "Elias is an optimist. His 'zero' is actually a '50' on the town's scale."
      *   Add 50 to Elias's scores: 150, 70.
      *   New Studio Total: 150 + 90 + 10 + 30 = **280**.
      *   New Clinic Total: 70 + 40 + 100 + 80 = **290**. (Clinic still wins).
      *   *Wait, I need a flip.*
      *   **Correction:** Shift Mara's zero. Mara is stoic. Her 'zero' is '-50'.
      *   Subtract 50 from Mara's scores: 50, -40.
      *   New Studio Total: 100 + 90 + 50 + 30 = **270**.
      *   New Clinic Total: 20 + 40 + (-40) + 80 = **100**.
      *   **Result:** Studio wins massively.
  *   **Rescaling 2 (Changing the Unit):**
      *   Reset to original numbers.
      *   Write: "Elias feels things twice as intensely as Priya."
      *   Multiply Elias's scores by 2: 200, 40.
      *   New Studio Total: 200 + 90 + 10 + 30 = **330**.
      *   New Clinic Total: 40 + 40 + 100 + 80 = **260**.
      *   **Result:** Studio wins.
  *   **The Point:** "I did not change anyone's mind. I did not change their rankings. I only changed the ruler. The winner flipped. The arithmetic is exact; the assumption is invisible."

  **65–70 mins: The Swap Case**
  *   Facilitator asks: "Look at David and Priya. Imagine they have identical rankings and scores. If we choose the package David prefers, is it different than choosing the one Priya prefers?"
  *   **The Silence:** If the group says "No," they treat people as interchangeable vessels of utility. If they say "Yes," they are using identity, not utility, to decide.
  *   **The Lesson:** You cannot compare gains between people without assuming their 'units' of happiness are the same size.

  ### Phase 3: Debrief & Failure Modes (70–100 mins)

  **70–85 mins: Mapping the Ladder**
  *   Facilitator draws a ladder on the whiteboard.
      1.  **Ordinal Non-Comparability:** (Phase 1). We know ranks. We cannot sum. *Cost:* Paralysis. *Gain:* No false precision.
      2.  **Level Comparability:** We can say "Elias is happier than Mara." *Cost:* Requires a common zero. *Gain:* Can identify the suffering.
      3.  **Unit Comparability:** We can say "Elias's gain is twice Mara's loss." *Cost:* Requires a common ruler. *Gain:* Can maximize totals.
      4.  **Full Comparability:** We can say "Elias's happiness is worth 1.5x Mara's." *Cost:* Dictatorial weighting. *Gain:* Decisiveness.
  *   **Escape Routes:**
      *   **Lottery:** Assumes all claims are equal. (Ignores intensity).
      *   **Bargaining:** Assumes power determines outcome. (Ignores fairness).
      *   **Deliberation:** Assumes preferences can change. (Ignores incommensurability).

  **85–95 mins: Predictable Failure Modes (Discussion)**
  *   Facilitator lists these six common errors. Ask tables if they caught themselves doing them.
      1.  **The Invented Scale:** "I just gave Elias a 9 and Mara a 7."
          *   *Fix:* Auditors must flag this as data fabrication.
      2.  **The Measurement Fallacy:** "If we just had better surveys, we'd know."
          *   *Fix:* Surveys measure *reported* intensity, not *comparable* experience.
      3.  **The Hidden Dictator:** "Well, Elias is an artist, so obviously..."
          *   *Fix:* Ask: "By what authority does art count more than health?"
      4.  **The Procedure Derail:** "Let's just vote majority rule."
          *   *Fix:* Remind them majority rule ignores the intensity of the minority's loss.
      5.  **The Money Conflation:** "Just give them the cash value."
          *   *Fix:* Remind them money has diminishing marginal utility (a dollar means less to Kenji than David).
      6.  **The Time Sink:** Spending 40 minutes on the math demo.
          *   *Fix:* Pre-write the numbers on the board, cover with paper. Reveal and calculate live.

  **95–100 mins: Closing Assertion**
  *   Facilitator speaks without slides.
  *   "This simulation is safe. You will not hurt Elias. In the real world, when you make this comparison, someone *does* lose. The vertigo you felt—the hesitation to say 'his pain matters less'—that is not a bug in your reasoning. It is the moral reality of the problem. Economics can calculate the consequences of a choice, but it cannot justify the scale used to make it. That justification is political. It is ethical. It is yours."
  *   Return the Pre-Commitment slips. Ask participants to look at their initial instinct vs. the final deadlock. Keep the slip.

