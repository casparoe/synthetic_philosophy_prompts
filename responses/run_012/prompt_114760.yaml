prompt: |-
  I host a small philosophy-of-physics podcast with one cohost, and we've been arguing about time for about a year now — he's a presentist, I lean block-universe, and we keep circling the same questions. Next month our guest is a philosopher who has spent a lot of her career defending Gödel's argument that time, in the sense of an objective lapse or becoming, is unreal, and she treats the rotating-universe solution as the centerpiece: the 1949 exact solution with the swirling dust, the negative cosmological constant, the closed timelike curves through every point, no global time function, and — unusually for these things — no singularities and geodesic completeness, so you can't just wave it off as a pathological solution. She's sharp and she's heard all the lazy objections, so I want questions that actually make her work. Draft me 10 to 12 interview questions, each paired with a follow-up keyed to the answer she's most likely to give, so I can press in real time instead of just reading the next item off my list.

  I want at least one question each on: (1) the inference from there being no global time function to there being no objective becoming — what exactly is the bridge premise, and does it come from relativity or from metaphysics? (2) the possibility/actuality gap — our universe doesn't look like Gödel's, so why does a mere solution of the field equations bear on whether time is real here? (3) the local-becoming reply — someone says becoming could be local and frame-relative rather than global, so why don't the closed timelike curves just make becoming local instead of unreal? (4) whether the argument needs the closed timelike curves specifically or only the failure of global hyperbolicity — could a Gödel-style argument run in a spacetime with no CTCs but still no global time function, and would that change the dialectic? and (5) the tension between Gödel's conclusion about time and his Platonism about mathematical objects — if the world is a static block and time is a subjective form, what becomes of the objective mathematical realm he spent his life defending, and does the word idealistic in the 1949 Schilpp piece mean the same thing in both contexts? Also work in a question about what empirical or theoretical discovery would actually count against her view, and one about why she thinks Gödel's argument does more than special relativity already does, since SR already kills absolute simultaneity and yet plenty of people still think time is real. She's fine being interrupted and she likes being pushed, so don't soften anything; no softballs about what drew her to Gödel. And for each question, give me a one-line note on what she'll probably say, so I know where the follow-up is headed. This is definately the episode I've been wanting to do all year.
