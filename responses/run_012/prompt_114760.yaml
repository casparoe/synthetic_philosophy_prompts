answer: |-
  Here are 12 rigorous interview questions designed to cut through the standard dialectic, complete with targeted follow-ups and intelligence on her likely responses.

  **1. The Bridge Premise**
  **Question:** Gödel moves from "there is no global time function in this spacetime" to "there is no objective lapse of time." What exactly is the bridge premise here? Is it a physical claim that objective becoming *requires* a global foliation, or is it a metaphysical claim that if becoming can't be defined globally, it's not fundamental?
  **One-line note:** She will argue it's conceptual: objective time must be universal, not frame-dependent.
  **Follow-up:** If it's a conceptual truth, why should the topology of a specific solution to Einstein's equations dictate our concepts? Are you letting GR define metaphysics, or using metaphysics to interpret GR?

  **2. The Possibility/Actuality Gap**
  **Question:** Our universe is expanding, not rotating, and shows no evidence of Closed Timelike Curves (CTCs). Why does the mere *possibility* of a Gödel universe dictate the metaphysics of *our* actual universe? Doesn't the modal argument fail if the actual boundary conditions allow a global time function?
  **One-line note:** She will claim laws of nature, not contingent matter distribution, determine temporal ontology.
  **Follow-up:** But if the "laws" allow both timelessly consistent worlds and temporal worlds, doesn't that make time a contingent feature of the actual world rather than an unreal illusion?

  **3. The Local-Becoming Reply**
  **Question:** A presentist might concede global becoming is impossible in Gödel spacetime but insist becoming is still real *locally*. Since CTCs are global structures, why does the existence of a loop light-years away negate the reality of the present moment right here?
  **One-line note:** She will argue local lapse implies a global structure; CTCs make local lapse logically incoherent upon return.
  **Follow-up:** So are you saying the reality of *now* depends on the global causal structure of the future? That sounds like a verificationist constraint on ontology.

  **4. CTCs vs. Global Hyperbolicity**
  **Question:** Does your argument need the Closed Timelike Curves specifically, or just the failure of global hyperbolicity? Could we run the same argument in a spacetime with no CTCs but still no Cauchy surface, and would that strengthen or weaken the case against time?
  **One-line note:** She will say CTCs are the strongest proof, but the lack of a Cauchy surface is the real killer.
  **Follow-up:** If it's the lack of a Cauchy surface, doesn't that shift the argument from "time is impossible" to "determinism is impossible," which are distinct metaphysical claims?

  **5. Gödel vs. Special Relativity**
  **Question:** Special Relativity already killed absolute simultaneity, yet presentists have survived by adopting neo-Lorentzian views or frame-relative becoming. What does the 1949 argument do that SR doesn't? Why isn't Gödel just adding mathematical flourish to a point SR already made?
  **One-line note:** She will argue SR allows a "foliation" choice, whereas Gödel spacetime makes *any* foliation physically arbitrary or impossible.
  **Follow-up:** But if the block universe is compatible with SR without needing CTCs, is Gödel's solution necessary for your view, or just a dramatic illustration?

  **6. Geodesic Completeness and Pathology**
  **Question:** Critics often wave away CTCs as artifacts of singularities or idealizations. But Gödel's solution is geodesically complete and singularity-free. Is the "non-pathological" nature of this solution the only reason we must take it ontologically seriously?
  **One-line note:** She will confirm that geodesic completeness blocks the "unphysical solution" objection.
  **Follow-up:** If a future theory of Quantum Gravity renders geodesic completeness irrelevant at the Planck scale, does the Gödel argument collapse with it?

  **7. The Role of the Cosmological Constant**
  **Question:** The solution relies on a negative cosmological constant to balance the rotating dust. Given our universe has a positive $\Lambda$, doesn't this highlight that Gödel's universe is physically distinct from ours, not just topologically distinct? Why does a solution requiring the wrong sign of $\Lambda$ constrain our metaphysics?
  **One-line note:** She will pivot back to the modal argument: the *lawful possibility* matters, not the actual value of $\Lambda$.
  **Follow-up:** But if the *actual* value of $\Lambda$ prevents CTCs in our world, aren't you arguing that time is unreal here because it *could* have been unreal elsewhere?

  **8. Platonism vs. Idealism**
  **Question:** Gödel was a staunch Platonist about mathematical objects but argued time is "ideal" or subjective in the 1949 Schilpp piece. Is there a tension here? If mathematical structures are objectively real, why is the temporal structure of those same equations merely a form of intuition?
  **One-line note:** She will distinguish abstract objects (timeless) from temporal experience (phenomenological).
  **Follow-up:** So "ideal" means mind-dependent? If so, does time cease to exist if there are no minds to experience the lapse, even in a block universe?

  **9. The Phenomenology of Lapse**
  **Question:** If time is unreal, the feeling of becoming is a systematic illusion. What is the evolutionary or physical explanation for why beings in a block universe would evolve a cognitive faculty that so fundamentally misrepresents reality?
  **One-line note:** She will likely cite cognitive efficiency: tracking change is useful even if "flow" isn't fundamental.
  **Follow-up:** But if the fundamental ontology is static, isn't "tracking change" itself a fiction? How do you account for the *veridicality* of any perception in a static block?

  **10. Falsification Conditions**
  **Question:** What specific empirical discovery or theoretical development would count against your view? If tomorrow we found a preferred foliation in the CMB or a breakdown of Lorentz invariance, do you concede time becomes real?
  **One-line note:** She will say only a theory that restores absolute time fundamentally (not just effectively) would change her mind.
  **Follow-up:** So if Loop Quantum Gravity or Horava-Lifshitz gravity restores a preferred frame, is that sufficient, or do you require a return to Newtonian absolute time?

  **11. The Definition of "Real"**
  **Question:** When you say time is "unreal," are you saying temporal relations don't exist, or that the *dynamic* aspect of them doesn't? Can we have a block universe where "earlier than" is real but "becoming" is not, and does that satisfy the presentist's core intuition?
  **One-line note:** She will insist "becoming" is the core of time; without it, you just have space-like ordering.
  **Follow-up:** But if "earlier than" is objective, haven't you saved the objective structure of reality and just quarreled over the word "flow"?

  **12. The Cost of the View**
  **Question:** If you're right, agency and deliberation are also illusory, since the future is as fixed as the past. Is this a *reductio* of the argument? Is the cost of saving Parmenidean consistency the loss of the very rationality required to formulate the argument?
  **One-line note:** She will reject the link: determinism does not negate rationality or the utility of deliberation.
  **Follow-up:** But if the outcome of this podcast is fixed in the block, in what sense are we "arguing" to find the truth rather than just playing out a script?
