      *   *Theme 6: No Default.*
          *   *Draft 4:* What if there's no status quo?
          *   *Refinement:* "SPI needs a baseline game. In real diplomacy, there is no baseline. Does the math break when the status quo is fuzzy?"
          *   *Follow-up:* If she says you construct one: "So we're negotiating the past before we negotiate the future?"

      *   *Theme 7: Computational Complexity/Realism.*
          *   *Idea:* Finding SPIs might be hard.
          *   *Refinement:* "Finding these improvements—computationally, is that tractable for the AIs I'm writing about?"
          *   *Follow-up:* If it's hard: "So the bottleneck isn't trust, it's compute?"

      *   *Theme 8: The "Black Box" Delegate.*
          *   *Idea:* The user mentioned "negotiating software."
          *   *Refinement:* "If the delegate is a neural net, not code, can you even check the isomorphism?"
          *   *Follow-up:* If she says no: "Then SPI is only for transparent code, not learned weights?"

      *   *Theme 9: Dynamic vs. One-shot.*
          *   *Idea:* Real negotiations happen over time.
          *   *Refinement:* "This looks like a one-shot deal. Does it hold up if we play the game a thousand times?"
          *   *Follow-up:* If she says repetition changes things: "So safety is harder when there's history?"

      *   *Theme 10: The Human Element.*
          *   *Idea:* Humans delegate to AIs.
          *   *Refinement:* "The humans hand over the keys. What if the SPI says 'cut costs' and the humans say 'wait, ethics'?"
          *   *Refinement (Better):* Stick to the technical/game theory side. Let's focus on the *joint* nature. "You need both sides to adopt the transformation. What if one side's internal politics block the SPI even if the math says it's safe?" (Maybe too sociological).
