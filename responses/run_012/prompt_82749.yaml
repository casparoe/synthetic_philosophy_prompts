answer: |-
  Here are ten questions designed for a stage conversation. They assume familiarity with the concepts without bogging down in definitions, and each includes a follow-up tailored to the standard technical defense you're likely to hear.

  **1. The "No Assumptions" Claim**
  "The literature emphasizes that we don't need probabilistic beliefs about the opponent's delegate to find a Safe Pareto Improvement. But the proofs rely on principles like 'isomorphic games are played isomorphically.' To a layperson, that sounds like an assumption about how agents think, dressed up as logic. Are we actually avoiding assumptions, or just shifting them from probabilities to structural symmetries?"
  *   **Follow-up (if she says these are standard symmetry principles):** "So if my lab's AI and your lab's AI have different definitions of 'symmetry'—different priors on what counts as the same game—the safety guarantee breaks? It's only safe if we agree on how to see the board?"

  **2. The Scope of "Safe"**
  "In the framework, 'safe' means the delegators are better off than the default. But in my novel, two labs can make themselves safer while increasing the risk to the public. Does the math account for externalities, or is 'Safe Pareto Improvement' strictly safe for the signatories, regardless of who stands outside the game?"
  *   **Follow-up (if she says externalities are out of scope):** "So this is a tool for cooperation, but it's also a tool for collusion? It guarantees you won't hurt each other, but it doesn't guarantee you won't hurt everyone else?"

  **3. Why a New Theory?**
  "If a transformation makes everyone better off, why don't they just take it? Is the machinery of SPI actually solving a new problem, or is it just the old problem of equilibrium selection with a more rigorous coat of paint?"
  *   **Follow-up (if she says it's about uncertainty/commitment):** "So the value isn't in finding the improvement—it's in building a bridge over the trust gap so we can walk across it without guessing what the other side is holding?"

  **4. Credible Defaults**
  "To make this work, players commit to behaving as a function of what the other side's default would have been. That presupposes I can credibly reveal my default. In high-stakes negotiation, the default is exactly the thing I'd lie about to get a better baseline. Is 'revealing the default' a modeling convenience, or is there a mechanism that forces honesty?"
  *   **Follow-up (if she says cryptographic commitment solves this):** "But I can still strategically *choose* a terrifying default to force your hand. The commitment might be honest, but the baseline itself is a weapon, isn't it?"

  **5. The Ceiling on Safety**
  "Are there impossibility results here? Is there a theorem that says 'beyond this point, you cannot guarantee an improvement'? I'm looking for the ceiling where the math stops promising safety and starts demanding a gamble."
  *   **Follow-up (if she cites specific bounds):** "So when we hit that bound, we're not doing safety engineering anymore, we're just betting? The framework tells us exactly when we're gambling?"

  **6. The Fuzzy Default**
  "SPI requires a well-defined default game to improve upon. But in real diplomacy, or in my book, there is no status quo—only competing versions of what the status quo *should* be. Does the framework break when the baseline is contested, or do you have to negotiate the past before you negotiate the future?"
  *   **Follow-up (if she says you construct a focal point):** "So the hardest part isn't the safety protocol, it's agreeing on what we're safe *relative to*? We spend all our energy defining the disaster we're avoiding?"

  **7. Transparency vs. Black Boxes**
  "The proofs assume you can verify the game structure and the strategies. But modern AI isn't clean code; it's weights and black boxes. If I can't inspect your delegate to verify it respects the isomorphism, does the 'Safe' part of SPI vanish? Is this only for transparent code?"
  *   **Follow-up (if she says interpretability is a prerequisite):** "Then this isn't just a negotiation protocol, it's a demand for full auditability. You can't have the safety improvement without surrendering the trade secret?"

  **8. Computational Tractability**
  "Finding these improvements requires mapping the game space. For the AIs in my story, is finding an SPI computationally trivial, or is the bottleneck that proving safety is harder than just playing the game? Do we run out of compute before we run out of risk?"
  *   **Follow-up (if she says it can be hard):** "So the lab with more compute doesn't just have a smarter model, they have a safer negotiation? Safety becomes a resource advantage?"

  **9. Unilateral Adoption**
  "Most of the literature looks at joint adoption. But what if one lab adopts SPI logic and the other plays standard game theory? Does the SPI player get exploited, or does the framework protect you even if you're the only one playing by the new rules?"
  *   **Follow-up (if she says you need joint commitment):** "So it's all or nothing. I can't unilaterally make myself safer; I can only make us safer if I can convince my rival to tie their own hands the same way?"

  **10. Dynamic vs. One-Shot**
  "These models often look like one-shot games. But AI development is iterative. If we play this negotiation a thousand times, does the 'Safe' guarantee hold, or does the history of play introduce new vulnerabilities that the static model doesn't see?"
  *   **Follow-up (if she says repetition changes the equilibrium):** "So safety is harder when there's history? Because now we're not just playing the game, we're playing the memory of the game?"
