      *   **Tone:** Conversational, suitable for a stage, accessible to an audience that hasn't read the papers but rigorous enough for the researcher.

  2.  **Deconstruct the Technical Subject (Safe Pareto Improvements):**
      *   *Core Concept:* Two players delegate to agents (programs). They want to modify the game they play (e.g., remove strategies, change payoffs) such that the outcome is guaranteed to be Pareto better than the default equilibrium, without needing probabilistic beliefs about the opponent's agent.
      *   *Key Assumptions:* Isomorphism (if games look the same, agents play them the same), Dominance (agents don't play strictly dominated strategies).
      *   *The "Safe" part:* It's safe for the *delegators* relative to the default. It doesn't account for externalities.
      *   *The "Why" part:* It solves a specific coordination problem under uncertainty about the opponent's reasoning, often related to program equilibrium or logical correlation.
      *   *Commitment:* Requires credible commitment to the default strategy if the SPI fails or isn't adopted.
      *   *Defaults:* Requires a focal point or status quo.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Theme 1: Assumptions vs. Logic (The "No Beliefs" claim).*
          *   *Draft 1:* You say no probabilities, but you use isomorphism. Isn't that an assumption?
          *   *Refinement:* Make it sound like a novelist probing the logic. "The math says we don't need beliefs, but the proof relies on agents treating isomorphic games identically. Is that logic, or just a polite assumption about rationality?"
          *   *Follow-up:* If she says it's a symmetry principle: "So if my AI lab decides their rationality looks different than yours, the safety guarantee evaporates?"

      *   *Theme 2: "Safe" for whom? (Externalities).*
