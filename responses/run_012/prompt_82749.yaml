          *   *Refinement:* Connect to the novel's theme. "In my book, the labs save themselves but risk the public. In SPI, 'safe' means safe for the signatories. Is the framework blind to collateral damage, or is that a feature?"
          *   *Follow-up:* If she says it's out of scope: "So this is a tool for collusion as much as cooperation?"

      *   *Theme 3: Why a new theory? (Equilibrium Selection).*
          *   *Draft 1:* Why do we need SPI if Pareto improvements are good?
          *   *Refinement:* "If everyone wins, why don't they just do it? Is SPI just solving equilibrium selection with extra steps?"
          *   *Follow-up:* If she says it's about uncertainty: "So the machinery isn't creating value, it's just building a bridge over the trust gap?"

      *   *Theme 4: Credible Defaults (Commitment).*
          *   *Draft 2:* How do you prove your default?
          *   *Refinement:* "The mechanism requires committing to what you *would* have done. In high-stakes AI, isn't the default the one thing you'd fake to get a better deal?"
          *   *Follow-up:* If she says cryptographic commitment: "But the *choice* of that default is still strategic. Can't I pick a terrifying default to force your hand?"

      *   *Theme 5: Ceilings/Limits.*
