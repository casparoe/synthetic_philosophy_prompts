  2. You may continue to use causal language pragmatically because Al-Ghazālī affirms that God's habits are sufficiently reliable to ground medical practice, even if the necessity involved is moral rather than logical.
  3. Holding a colleague responsible remains valid because God has established a moral order wherein humans are accountable for their choices within the habitual framework, regardless of who holds the ultimate ontological power.
  4. An error is understood not as a metaphysical cause of harm but as a failure to act in accordance with the professional duties God has entrusted to you within the sphere of secondary causes.
  5. This view ultimately fosters humility regarding outcomes, reminding you that whilst you are judged on your efforts, the final result rests solely with God, thereby mitigating both professional arrogance and despair.
