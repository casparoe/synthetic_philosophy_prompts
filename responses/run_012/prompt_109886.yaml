answer: |-
  Here is a specification sheet for a theory of dream experience, designed to frame the Malcolm/Dennett debate for your reading group. It isolates the commitments required to hold a position, flags the verificationist assumptions you suspected, and identifies the genuine trade-offs where a theory must choose sides.

  ### Desiderata for a Theory of Dream Experience

  **1. The Report-Experience Gap**
  *   **Requirement:** The theory must explain the causal and temporal relationship between the putative experience and the waking report. It must account for the fact that all data is retrospective.
  *   **Case:** As you noted with the alarm clock example, the report is always generated in a waking state. Sensory input from the waking world (the alarm) can be incorporated into the narrative (the bell). A theory must explain whether the dream experience *absorbed* the noise while asleep, or whether the waking brain *retrofitted* the noise into a story to make sense of the awakening.
  *   **Status:** **Non-negotiable.** Any account must deal with the delay between the alleged event and the evidence.
  *   **Camp Prejudice Alert:** Insisting that the report *constitutes* the dream (rather than describing it) is the Malcolm/Dennett move. Insisting the report is a fallible memory of a prior event is the Realist move.

  **2. Temporal Location**
  *   **Requirement:** The theory must assign a time to the dream. Did the experience occur during sleep (t1), or at the moment of waking/reporting (t2)?
  *   **Case:** Ordinary language suggests dreams happen *during* sleep ("I was dreaming when you called"). However, if the content is constructed at waking, the "time of occurrence" is an illusion. If the content is experienced during sleep, there must be a mechanism for storing that experience without waking the subject.
  *   **Status:** **Live Fight.** This is the core metaphysical disagreement.
  *   **Camp Prejudice Alert:** Demanding a precise timestamp for dream content often smuggles in a "Cartesian Theater" assumption (that there must be a specific moment when consciousness happens). Dennett argues this demand itself is flawed.

  **3. The Forgotten Dream**
  *   **Requirement:** The theory must account for the intuition that we dream more than we remember.
  *   **Case:** Subjects often wake with a strong feeling that they *were* dreaming even if no content is retrievable. If dreams are identical to reports (Malcolm), a forgotten dream is a contradiction (you cannot have a report you didn't make). If dreams are experiences, forgetting is a standard memory failure.
  *   **Status:** **Non-negotiable (Phenomenologically), Contested (Ontologically).** The feeling of having dreamed is data; the explanation of that feeling is the fight.
  *   **Camp Prejudice Alert:** Treating the "feeling of having dreamed" as sufficient proof of an occurrent experience privileges first-person authority over third-person verification.

  **4. Neural Correlation without Reduction**
  *   **Requirement:** The theory must accommodate sleep lab data (REM/non-REM physiology) without reducing the *experience* to the *physiology*.
  *   **Case:** REM sleep correlates highly with dream reports, but reports occur in non-REM, and REM occurs without reports. A theory cannot simply say "Dreaming = REM," but it cannot ignore the physiological state either.
  *   **Status:** **Mostly Settled (Data), Live Fight (Interpretation).** It is settled that REM is not necessary or sufficient for reports. It is contested whether REM is the *substrate* of the experience or merely a state of high brain activation that facilitates story-construction upon waking.
  *   **Camp Prejudice Alert:** Assuming that neural activity *during sleep* is sufficient proof of *conscious experience* is a realist prejudice. Assuming neural activity is only proof of *capacity to report* is a verificationist prejudice.

  **5. Real-Time Signaling (The Lucid Constraint)**
  *   **Requirement:** The theory must explain lucid dreaming data, where pre-arranged eye movements signal from within the sleep state.
  *   **Case:** Lucid dreamers can count or signal "left-right-left-right" while asleep, verified by polysomnography. This suggests conscious agency and temporal tracking *during* sleep, not just upon waking. This is the strongest empirical counter to the "narrative at waking" view.
  *   **Status:** **Settled Data, High Theoretical Pressure.** The signals happen. The fight is over whether this proves *all* dreaming is like this, or if lucid dreaming is a unique hybrid state.
  *   **Camp Prejudice Alert:** Dismissing lucid signaling as "micro-awakenings" is a defensive move to protect the "no experience during sleep" thesis.

  **6. Attribution to Non-Reporters**
  *   **Requirement:** The theory must provide criteria for attributing dreams to entities that cannot produce waking reports (dogs, newborns, non-verbal humans).
  *   **Case:** We say "the dog is dreaming" when it twitches. If dreaming is a report, this is category mistake. If dreaming is a biological/phenomenal state, this is an inference to the best explanation based on behavioral and physiological similarity.
  *   **Status:** **Camp Prejudice.** This is where verificationism wears the lab coat.
  *   **Camp Prejudice Alert:** Demanding public criteria for attribution is methodological rigor. Claiming that *without* public criteria the attribution is *meaningless* is verificationism.

  ***

  ### Incompatible Pairs (The Trade-Offs)

  You suspected that certain requirements cannot be jointly satisfied. You are correct. A coherent theory usually has to sacrifice one of the following pairs.

  **Pair A: The Verificationist Constraint vs. The Realist Attribution**
  *   **Conflict:** You cannot hold that (1) "Dreams are constituted by waking reports" (Malcolm) AND (2) "We can meaningfully claim dogs/newborns dream."
  *   **The Trade-off:** If you want to attribute dreams to non-reporters, you must admit that the experience exists independently of the report. If you insist the report is constitutive, you must admit that attributing dreams to dogs is merely metaphorical or behavioral shorthand.
  *   **Seminar Hook:** This is the clearest test of verificationism. If a student insists dogs dream *but* also insists a dream is just a story told on waking, they are contradicting themselves.

  **Pair B: First-Person Authority vs. Empirical Fallibility**
  *   **Conflict:** You cannot hold that (1) "The dreamer is the ultimate authority on whether they dreamed" AND (2) "Lab data can correct or override the dreamer's account."
  *   **The Trade-off:** Malcolm leans on first-person authority (if you say you didn't dream, you didn't). Sleep science leans on empirical fallibility (you were in REM, you likely had an experience even if you say you didn't).
  *   **Seminar Hook:** Ask the room: If a subject wakes from REM and says "I had no experience," but their eye signals during sleep indicated counting, who is wrong? The subject or the theory?

  **Pair C: Temporal Precision vs. Narrative Coherence**
  *   **Conflict:** You cannot hold that (1) "Dreams have a precise duration matching the report" AND (2) "Dream narratives are constructed/edited at waking."
  *   **The Trade-off:** If the story is assembled at waking (to incorporate the alarm clock), the "time" the dream took place is fictional. If the dream took place in real-time during sleep, the incorporation of external stimuli requires a mechanism of perception during sleep that Realists must explain and Malcolmists deny.
  *   **Seminar Hook:** The alarm clock example. Did the dream *last* 5 minutes and end with the alarm, or did it *happen* in the 2 seconds after the alarm rang? You can't have both.

  ***

  ### Settlement Map: What is Actually Agreed Upon?

  To prevent your students from trading contested readings as consensus, here is the current landscape of agreement versus dispute.

  **Settled Consensus (Empirical)**
  *   **Reports are fallible:** Waking reports do not perfectly match sleep physiology. Confabulation happens.
  *   **REM is not the sole locus:** Dreams (reports) occur in non-REM sleep; REM sleep occurs without dream reports.
  *   **Lucid signaling is real:** Subjects can communicate via eye movements during REM sleep without waking.
  *   **External stimuli can be incorporated:** Sounds or touches during sleep can appear in the waking report.

  **Live Fights (Philosophical/Interpretive)**
  *   **The Ontology of the Dream:** Is the dream an *event* that happened during sleep, or a *disposition* to tell a story upon waking? (This is the Malcolm/Dennett core).
  *   **The Nature of the "I":** Is the "I" who dreams the same as the "I" who reports? (Dennett challenges the continuity of the self here).
  *   **Verificationism:** Is it a methodological necessity to tie dreams to reports, or an ontological error? (Your suspicion is correct: Malcolm's position *is* verificationist. It is not a neutral starting point; it is a philosophical commitment).
  *   **Phenomenal Consciousness:** Does the neural activity during sleep *feel like something* to the sleeper in real-time, or does the "feeling" only arise upon waking?

  ### Note on Your Verificationism Suspicion
  You asked if it is unfair to suggest that demands for public criteria are "verificationism wearing a lab coat."

  **It is not unfair.**
  Norman Malcolm's argument explicitly relies on Wittgensteinian verificationism: if there is no criterion for distinguishing "true" from "false" memory of a dream, then the distinction is meaningless. However, modern neuroscience operates on **Inference to the Best Explanation.** They assume the experience is real because the physiological correlates (brain activity, eye movements) resemble waking perception.

  When a student demands, "How can we know the dog dreamed if it can't tell us?" they are asking for a verificationist criterion. When a student answers, "Because its brain looks like mine when I dream," they are offering a realist inference. The friction between those two moves is the entire seminar. Make them identify which camp they are speaking from before they argue.
