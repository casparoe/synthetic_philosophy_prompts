answer: |-
  This is a sophisticated stalemate, and your intuition that it is structural rather than factual is correct. You are not disagreeing about the world; you are disagreeing about the map you are drawing of it.

  Here is the diagnosis: Your dispute is a **category error regarding the ontological status of "function,"** exacerbated by the **Reference Class Problem** (your third hypothesis). Your first two hypotheses explain the *friction* of the conversation, but the third explains the *impasse*. However, there is a fourth element—the domain asymmetry between cardiology and psychiatry—that explains why your friend is immune to your heart examples.

  ### Evaluation of Your Hypotheses

  **Hypothesis 1 (Equivocation on "Norm"):**
  This is the source of the heat, but not the light. You are using "norm" in a statistical or teleological sense (how the system is structured to operate); your friend is using it in a prescriptive sense (how the system ought to operate to minimize suffering or maximize autonomy).
  *   **Verdict:** Clarifying this distinction will not solve the dispute. If you concede that you mean "statistical norm" and not "moral ought," the normativist will simply ask: "Why does a statistical deviation matter unless it violates a moral or pragmatic ought?" The equivocation masks the deeper gap, but removing the mask reveals the gap is still there.

  **Hypothesis 2 (Difference of Question):**
  This is the source of the talking-past-each-other. You are asking an ontological question ("What property does this organism possess?"); your friend is asking a pragmatic question ("What license does this label grant us?").
  *   **Verdict:** This is accurate. However, naturalists typically argue that the pragmatic license *follows* from the ontological property. If you can show the property exists independently of the license, you win. The problem is you cannot show that without solving Hypothesis 3.

  **Hypothesis 3 (The Reference Class):**
  This is the substantive blocker. This is where the naturalist position is most vulnerable and where the stalemate is actually anchored. Biology can tell you how a heart pumps. It cannot tell you, without appealing to external values, *which* heart pumping counts as the standard.
  *   **Verdict:** This is the engine of the disagreement. To say a heart is "failing," you must compare it to a reference class (e.g., "healthy adult humans"). But biology does not dictate that *this* is the correct reference class rather than "humans in high-stress environments" or "humans with genetic variant X." The choice of reference class determines whether a trait is a dysfunction or an adaptation. Since the choice of reference class often depends on what we value (e.g., do we value reproductive fitness or subjective well-being?), the "fact of the matter" is contaminated by the very values the naturalist claims to exclude.

  ### The Fourth Possibility: The Domain Asymmetry

  There is a factor you have not explicitly weighted: **your friend is a psychiatrist.**

  In cardiology, function is mechanical. A heart pumps blood. If it doesn't, the organism dies. The link between mechanism and survival is tight and value-neutral (survival is a biological given).
  In psychiatry, function is teleological and representational. A belief is "for" representing reality; a mood is "for" regulating social engagement. But what counts as "accurate representation" or "appropriate regulation" is inextricably tied to the environment and the goals of the agent.

  Your friend sees the "naturalist" definition of disease working in cardiology only because the values (survival, circulation) are uncontroversial. In psychiatry, the values (autonomy, happiness, social conformity) are contested. Therefore, your friend suspects that even in cardiology, the "uncontroversial values" are just values everyone happens to share, not objective biological facts. Your heart example does not move him because he views it as a special case where the value judgment is invisible, not absent.

  ### The Verdict on the Disagreement

  You are asking different questions, but you are both pretending to ask the same one.
  *   **You are asking:** "Is the mechanism operating within the parameters required for the organism's survival and reproduction, given its design?"
  *   **Your friend is asking:** "Is this condition a legitimate target for medical intervention given our social and ethical commitments?"

  The word "disease" is being used to bridge these two questions. The naturalist assumes the answer to the first guarantees the answer to the second. The normativist assumes the answer to the second is required to make the first meaningful.

  **Which hypothesis is doing the stalling?**
  Hypothesis 3 (Reference Class) is doing the heavy lifting. If biology could dictate the reference class without appealing to environmental context or survival priorities, you would win. It cannot. Therefore, the "fact of the matter" you posit is incomplete without a value-laden selection of the comparison group.

  ### What Would Count as Progress?

  More biology will not move this. More philosophy of language will not move this. Progress requires one of three shifts:

  **1. Abandon the Search for Necessary and Sufficient Conditions**
  Accept that "disease" is a **cluster concept** rather than a natural kind. It has no essence. Sometimes it tracks biological dysfunction (gangrene); sometimes it tracks social deviance (historical diagnoses of homosexuality); sometimes it tracks subjective suffering (chronic pain syndromes with no clear lesion).
  *   *Progress:* You stop trying to prove your friend wrong about the *definition* and agree that the term serves different functions in different contexts. You concede that in psychiatry, the normativist line is stronger; he concedes that in trauma surgery, the naturalist line is stronger.

  **2. Shift from "Is it a Disease?" to "Is it a Harmful Dysfunction?"**
  This modifies your question. You concede that dysfunction alone is not enough (a flat foot is dysfunctional by some metrics but not a disease). He concedes that harm alone is not enough (ugliness is harmful but not a disease).
  *   *Progress:* You agree that *both* a biological deviation *and* a negative value judgment are required. This dissolves the stalemate by making the value judgment explicit rather than hidden. You get your biology; he gets his values.

  **3. The "Failing Heart" Test**
  You asked specifically about your intuition regarding the failing heart.
  *   *Diagnosis:* When you say "a failing heart is a diseased heart," you are implicitly invoking a **teleological norm** (the heart is *for* pumping) and a **valuation of survival** (pumping is *good*).
  *   *The Move:* Ask your friend: "If we discovered a human subspecies that survived better without a pumping heart, would a pumping heart be a disease in them?"
      *   If he says "No," he admits biology dictates the norm (Naturalism wins).
      *   If he says "Yes, because survival is the goal," he admits a value is driving the biology (Normativism wins).
      *   If he says "It depends on whether we want them to survive," the Reference Class problem is confirmed.

  ### Recommendation

  The dispute is in principle decidable, but not in the way you hope. It is decidable by admitting that **Naturalism is true for mechanisms, but Normativism is true for categories.**

  Biology determines what is broken. Society determines what counts as a disease. A broken heart is a biological fact. Calling it a "disease" is a social act that mobilizes resources, excuses behavior, and mandates treatment.

  **To move the conversation:** Stop arguing about whether disease *is* a value. Argue about whether the *concept* of disease *should* be reserved for value-free biological failures.
  *   Propose this: "Let's use 'pathology' for the biological malfunction (my domain) and 'illness' for the value-laden experience and social role (your domain)."
  *   If he agrees that "pathology" exists independently of values, you have saved the naturalist core.
  *   If he argues that even "pathology" requires a value-laden reference class, then you must concede Hypothesis 3: the biology is not value-free because the selection of the biological standard is value-laden.

  **Final Diagnosis:** You are fighting over a boundary that does not exist in nature. The "fact of the matter" you seek exists at the level of physiology, but the label "disease" exists at the level of social practice. You are right about the heart; he is right about the label. The stalemate persists because you both want one word to do two jobs. Split the jobs, and the argument dissolves.
