prompt: |-
  I am putting together a ninety-minute session for a graduate interdisciplinary reading group—philosophers, computer scientists, and economists—on decision theory under uncertainty. Most participants can state the difference between causal and evidential decision theory and have seen Newcomb's problem, but almost none have thought carefully about counterfactual mugging or XOR blackmail, and I want the session to leave them able to see why those cases are supposed to put pressure on ordinary decision theory rather than merely being exotic bets. I am not asking you to explain the cases to me; I need a teaching plan. What has to be introduced first for the question even to be well posed—the distinction between a decision's causal consequences and its evidential bearing, the difference between acting in a branch and acting on a policy, the role of the predictor's accuracy, something else? What single example should carry the session, and why that one rather than the other? What must the example have, and what must it conspicuously lack, so that the audience feels the pull of both the pay and the refuse answers before any formalism arrives? Which misconceptions will they form—that the problem is just a weird bet about a coin, that the answer turns on how probable the predictor is, that XOR blackmail is ordinary blackmail in disguise, that updatelessness requires backward causation, that evidential decision theory is simply irrational—and at exactly which point in the sequence should I head each one off?

  I also want to end with a variant I have been developing: the predictor is not an omniscient demon but a publicly audited model trained on a transcript of the agent's earlier deliberations, and the agent knows the model is running before the coin is tossed. I want to ask whether that variant sharpens the problem or merely adds machinery. Show me where that capstone belongs and what it is supposed to test. Finally, give me one question I can ask at the end to tell whether they have understood the structure of the problem rather than merely memorized a verdict, and tell me what I should openly refuse to cover at this level and why.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** Graduate interdisciplinary reading group (Philosophers, CS, Economists).
      *   **Background:** Know CDT vs. EDT, know Newcomb's Problem. *Don't* know Counterfactual Mugging (CFM) or XOR Blackmail well.
      *   **Goal:** Move beyond "exotic bets" to understanding *why* these cases pressure ordinary decision theory.
      *   **Specific Needs:**
          *   Prerequisites/Conceptual groundwork (what must be introduced first?).
          *   Single core example choice (CFM vs. XOR) and justification.
          *   Features the example must have/lack to generate tension.
          *   Anticipated misconceptions and when to address them.
          *   Integration of the user's specific variant (Audited Model/Transcript).
          *   Final assessment question.
          *   Scope limitation (what *not* to cover).
      *   **Time:** 90 minutes.

  2.  **Determine the Conceptual Groundwork:**
      *   They know CDT/EDT/Newcomb.
      *   To understand CFM/XOR, they need to grasp *Updatelessness* and *Policy Selection* vs. *Act Selection*.
      *   Newcomb is about prediction of an *action*. CFM/XOR is about prediction of a *decision rule* (or counterfactual behavior).
      *   *Key Distinction:* Acting in a branch (conditional on information received) vs. Acting on a policy (committing before information is received).
      *   *Key Distinction:* Causal influence vs. Logical/Counterfactual correlation (without causation).
      *   *Decision:* The session must pivot on the shift from "What should I do *now*?" to "What rule should I have committed to *earlier*?"

  3.  **Select the Core Example:**
      *   *Options:* Counterfactual Mugging (CFM) vs. XOR Blackmail.
      *   *CFM:* Omega asks for $100. If you would have paid, Omega gives you $10,000 (but only if coin came up tails, say). If coin heads, Omega asks. You see heads. Do you pay?
      *   *XOR Blackmail:* Predictor sends letter only if (Termite & Pay) OR (No Termite & Refuse). You get letter. Do you pay?
      *   *Comparison:* CFM is cleaner for "Updatelessness." XOR is often confused with standard blackmail or logical uncertainty quirks. CFM isolates the "regret across possible worlds" aspect better for a general audience.
      *   *Decision:* **Counterfactual Mugging.** It's the canonical "Updateless Decision Theory" (UDT) case. It forces the "ex-ante vs. ex-post" conflict most sharply without the logical opacity of XOR.

  4.  **Design the Example's Features:**
      *   *Must Have:* A clear ex-ante commitment point (before the coin toss). A high-stakes reward for the counterfactual behavior. A low-stakes cost for the actual behavior. A predictor with high accuracy (near 1).
      *   *Must Lack:* Causal link between paying and the coin toss (rules out CDT triviality). Causal link between paying and the reward in the *actual* world (rules out standard instrumental rationality). Ambiguity about the predictor's mechanism (keep it abstract initially).
      *   *Tension:* Ex-post (I see Heads, paying gains nothing) vs. Ex-ante (If I commit to pay, I win big in the other branch).

  5.  **Address Misconceptions (Timing is Key):**
      *   *Misconception 1: "It's just a weird bet."* -> Address early when setting up the payoff matrix. Emphasize the *counterfactual* nature of the reward.
      *   *Misconception 2: "It depends on predictor probability."* -> Address when discussing CDT/EDT responses. Show that even with $P=1$, CDT fails.
      *   *Misconception 3: "Updatelessness = Backward Causation."* -> Address when introducing Policy Selection. Crucial distinction.
      *   *Misconception 4: "EDT is simply irrational."* -> Address when comparing EDT to UDT. EDT gets it right in Newcomb but wrong in CFM (sometimes, depending on formulation) or at least lacks the robustness of UDT. Actually, in CFM, EDT usually refuses (bad), CDT refuses (bad), UDT pays (good). Wait, EDT calculates $E[U|Pay]$ vs $E[U|Refuse]$. If I pay, it evidences I'm a payer, so Omega would have predicted payer... but the coin already landed. EDT is tricky here. Better to focus on CDT vs. UDT (Policy). Let's stick to the tension between "Act" (CDT/EDT) and "Policy" (UDT).
      *   *Misconception 5: "XOR is ordinary blackmail."* -> (Since I chose CFM, I'll skip XOR specific misconceptions, but keep the "logical correlation" point).

  6.  **Integrate the User's Variant (Audited Model):**
      *   *Variant:* Predictor = Model trained on transcript of deliberations. Agent knows model is running *before* coin toss.
      *   *Purpose:* Demystifies "Omega." Makes it a CS/Engineering problem. Tests if the "magic" of Omega was doing the work.
      *   *Placement:* Capstone (last 20 mins).
      *   *Test:* Does this make it clearer that the *source code* (policy) is the object of prediction, not the specific action instance? It sharpens the problem by removing "metaphysical prediction" and replacing it with "simulation."

  7.  **Drafting the Session Plan (90 Minutes):**
      *   *0-15:* Setup & Prerequisites (Policy vs. Act).
      *   *15-45:* Core Case (Counterfactual Mugging). Intuitions, CDT/EDT failure, UDT solution.
      *   *45-60:* Misconception Surgery (Backward causation, Probability).
      *   *60-80:* Capstone Variant (Audited Model).
      *   *80-90:* Assessment & Scope Limitation.

  8.  **Refining the "Single Question":**
      *   Need to test structural understanding, not verdict memorization.
      *   *Idea:* Ask them to modify a parameter that *shouldn't* change the decision under UDT but *would* under CDT.
      *   *Better:* Ask about the *timing* of the commitment. "At what exact timestamp does the rational agent lose the ability to change the outcome, and why does rationality demand they ignore that loss?"
      *   *Best:* "If the agent can erase their memory of the coin toss outcome before deciding, should they? Why?" (Tests understanding of information as a liability in updateless contexts).

  9.  **Refining Scope Limitation:**
      *   What to avoid? Logical Induction, Full FDT formalism, Timeless Decision Theory history wars, Parfit's Hitchhiker (too similar to Newcomb).
      *   *Why:* Keep focus on Updatelessness vs. Updating.

  10. **Review against Constraints:**
      *   Did I explain the cases? No (user knows them).
      *   Did I choose one? Yes (CFM).
      *   Did I place the variant? Yes (Capstone).
      *   Did I list misconceptions? Yes.
      *   Did I set the final question? Yes.

  11. **Final Polish:** Ensure tone is appropriate for grad students (rigorous, pedagogical, not condescending). Ensure the distinction between "Act" and "Policy" is the through-line. (Self-Correction: Make sure to explicitly mention why XOR was rejected in favor of CFM for *this* audience—CFM is better for the "Policy" intuition without getting bogged down in logical operators).

  12. **Wait, one nuance on EDT in CFM:** In standard CFM, EDT often *also* refuses because conditional on "Coin=Heads", paying doesn't change the coin. The correlation is via the *prediction*, which happened in the past. Once the coin is heads, the prediction is fixed. So EDT and CDT align in refusal. UDT pays. This makes CFM a great wedge to separate Updateless from *both* standard theories. I need to make sure the plan reflects this.

  13. **Wait, one nuance on the Variant:** The variant specifies the model is trained on *earlier deliberations*. This implies the "policy" is encoded in the deliberation transcript. This strongly supports the "Policy Selection" framing. I need to highlight that the "decision" happens at the deliberation stage, not the payment stage.

  14. **Final check on the "Single Question":** The memory erasure question is good, but maybe too specific. How about: "If the predictor predicts based on your source code, but you can rewrite your source code *after* the coin toss but *before* the payment, should you?" This tests if they understand the commitment must be *before* the prediction (which is before the coin). Actually, the prompt says model runs *before* coin. So rewriting after coin is too late.
      *   *Revised Question:* "Suppose you are allowed to pre-commit *after* the coin is tossed but *before* the predictor runs its simulation. Does the problem collapse?" (Tests understanding of the temporal ordering of Prediction vs. Outcome vs. Decision).
      *   *Actually, the best test of Updatelessness:* "Does receiving the information (Coin = Heads) make you richer or poorer compared to not receiving it?" (Information should be valuable, but here it's a liability).
      *   *Let's go with the "Value of Information" angle.* It strikes at the heart of why Updating is problematic here.

  15. **Structure the Output:** Follow the user's specific questions in a logical flow.
      *   Conceptual Groundwork.
      *   Core Example Choice.
      *   Example Design (Have/Lack).
      *   Misconception Map.
      *   Session Flow (incorporating Variant).
      *   Final Question.
      *   Scope Limit.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is a teaching plan designed for a 90-minute graduate session. It prioritizes the shift from *act-based* to *policy-based* rationality, using Counterfactual Mugging as the primary vehicle.

  ### 1. Conceptual Groundwork: What Must Be Introduced First
  Before presenting the case, you must establish the **Unit of Evaluation**. Participants know CDT and EDT evaluate *acts* (what do I do *now*, given what I know *now*?). To make Counterfactual Mugging (CFM) well-posed, you must introduce the distinction between:

  *   **Act-Selection:** Maximizing utility conditional on current information (the standard CDT/EDT approach).
  *   **Policy-Selection:** Maximizing utility conditional on the decision rule committed to *before* specific information was received (the Updateless approach).

  **Why this first?** Without this distinction, CFM looks like a request to cause the past. With this distinction, it is a request to honor a commitment made in a state of greater ignorance. You must explicitly frame the session not as "How do we solve Newcomb's Problem?" but as "When does information become a liability?"

  ### 2. The Core Example: Counterfactual Mugging
  **Choice:** Use **Counterfactual Mugging** rather than XOR Blackmail.
  **Justification:** XOR Blackmail relies heavily on logical correlation (logical uncertainty), which often distracts economists and CS folks into debates about logical omniscience or the nature of the predictor's algorithm. Counterfactual Mugging isolates the *temporal* and *informational* tension. It forces the conflict between "I know the coin is Heads" and "I wish I were the kind of person who didn't know that." It is the cleanest wedge to separate Act-Based rationality from Policy-Based rationality without requiring a tutorial on logical induction.

  **Design Constraints for the Example:**
  *   **Must Have:**
      1.  **A clear Ex-Ante timestamp:** A moment $T_0$ before the coin toss where the agent can commit to a policy.
      2.  **Asymmetric Payoffs:** A small cost in the actual world (e.g., \$100) vs. a massive gain in the counterfactual world (e.g., \$10,000).
      3.  **High Predictor Accuracy:** Set $P(\text{Prediction} = \text{Action}) \approx 1$. This removes "probability of prediction" as a variable to hide behind.
      4.  **Information Arrival:** The agent must learn the coin outcome *before* deciding to pay, but *after* the prediction is made.
  *   **Must Lack:**
      1.  **Causal Loops:** Ensure no participant thinks paying changes the coin toss.
      2.  **Reputation Effects:** Explicitly state this is a one-shot interaction with no social signaling.
      3.  **Ambiguity on "Prediction":** Do not dwell on *how* Omega predicts initially. Treat it as a primitive function $P(\text{Policy}) \to \text{Prediction}$.

  ### 3. Misconception Map & Intervention Points
  You must anticipate where the interdisciplinary friction will occur. Address these at the specified moments:

  | Misconception | Who tends to hold it | When to Head It Off | How to Intervene |
  | :--- | :--- | :--- | :--- |
  | **"This is just backward causation."** | Philosophers / Physicists | **Minute 20** (After initial intuition pump) | Explicitly state: "The coin is already Heads. Your payment cannot change it. The question is whether your *disposition* could have changed the prediction." |
  | **"It depends on the predictor's probability."** | Economists / Statisticians | **Minute 30** (During CDT/EDT analysis) | Show the math: Even if $P=1$, CDT refuses. The failure is structural, not probabilistic. |
  | **"EDT gets this right."** | Philosophers | **Minute 35** (Comparing theories) | Show that EDT conditions on *receiving the letter/ask*. Conditional on "Coin=Heads", paying has no evidential value for the reward. EDT refuses. |
  | **"Updatelessness requires magic."** | Computer Scientists | **Minute 65** (Before the Variant) | Clarify that "Updateless" means "computing expected utility over all branches weighted by prior probability," not ignoring data. |
  | **"This is just Pre-commitment."** | All | **Minute 40** (The Pivot) | Distinguish *binding* pre-commitment (contractual) from *rational* pre-commitment (what a rational agent would wish to be). CFM is about the latter. |

  ### 4. Session Flow (90 Minutes)

  **00–15: The Unit of Evaluation (Policy vs. Act)**
  *   Briefly recap Newcomb to establish baseline CDT/EDT conflict.
  *   Introduce the **Ex-Ante Perspective**: "If you could choose your source code before the universe started, what would you choose?"
  *   Define **Updatelessness**: Evaluating decisions based on the prior distribution, not the posterior conditional on current observations.

  **15–45: The Core Case (Counterfactual Mugging)**
  *   Present the case (Coin, Omega, \$100 vs \$10k).
  *   **Poll the room:** Who pays? Who refuses?
  *   **Walkthrough CDT:** Causal graph shows Pay $\to$ Cost. No arrow to Reward. Verdict: Refuse.
  *   **Walkthrough EDT:** Condition on "Coin=Heads". Paying doesn't correlate with Reward in this branch. Verdict: Refuse.
  *   **The Tension:** Both standard theories refuse, but the Ex-Ante expected utility of the "Payer" policy is higher than the "Refuser" policy.
  *   **Key Insight:** Rationality seems to require acting against your current interests to satisfy your past interests.

  **45–60: Misconception Surgery**
  *   Address the "Backward Causation" and "Probability" errors (see table above).
  *   Emphasize that the "pressure" on ordinary decision theory is that **Information has negative value**. In standard theory, more information never hurts expected utility. In CFM, knowing the coin is Heads destroys your ability to claim the counterfactual reward.

  **60–80: Capstone Variant (The Audited Model)**
  *   **Introduce Variant:** Omega is replaced by a publicly audited model $M$. $M$ was trained on a transcript of your deliberations at $T_0$ (before the coin toss). You know $M$ is running. The coin is tossed at $T_1$. You decide at $T_2$.
  *   **Placement:** This belongs *after* the abstract case is understood but *before* the final assessment.
  *   **What it Tests:** It tests whether the "magic" of Omega was doing the work.
      *   If they say "This solves it," they missed the point. The tension remains: The model predicts based on $T_0$ deliberations, but you decide at $T_2$ with new info.
      *   If they say "This sharpens it," they understand: It makes the **Policy** concrete. Your "deliberation transcript" *is* your source code.
      *   **Discussion Prompt:** "Does knowing the model architecture change the rational choice? If the model is a perfect simulator of your $T_2$ reasoning, does the problem collapse into Newcomb's Problem?" (Answer: Yes, if it simulates $T_2$. If it simulates $T_0$, it remains CFM).
      *   **Goal:** Show that CFM is not about metaphysics; it is about **when** the prediction locks in relative to **when** the information arrives.

  **80–90: Assessment & Scope Limitation**
  *   **The Final Question:** Ask this to test structural understanding:
      > "Suppose you are given the option to erase your memory of the coin toss outcome just before you must decide whether to pay, but you cannot forget the rules of the game. Should a rational agent take this option? Why?"
      *   *Correct Understanding:* Yes. Erasing the memory restores the agent to the Ex-Ante distribution, allowing the policy to maximize expected utility across both branches. Information was the liability.
      *   *Memorized Verdict:* "No, information is always power."
  *   **What to Refuse to Cover:**
      *   **Formal FDT/UDT Calculus:** Do not derive the decision equations. It consumes time and alienates the economists/philosophers who don't code.
      *   **Logical Uncertainty Mechanics:** Do not dive into how the model simulates the agent (Gödelian loops, etc.). Keep the predictor as a black box that correlates with policy.
      *   **Why:** You want them to grasp the *normative pressure* of Updatelessness, not the *computational implementation*. Implementation is for a follow-up CS seminar; normative pressure is for this group.

  ### 5. Why This Plan Works for This Audience
  *   **Philosophers** get the normative puzzle (rationality vs. self-interest).
  *   **Computer Scientists** get the "source code" analogy in the Variant.
  *   **Economists** get the "Value of Information" violation in the Assessment.
  *   **The Variant** serves as a reality check: it prevents the session from devolving into "Omega isn't real" and forces them to confront the decision structure in a plausible engineering context.

  ### 6. Instructor Note on the Variant
  Be careful with the Variant's timing. If the model simulates your *final* decision process (at $T_2$), the problem becomes isomorphic to Newcomb's Problem (Prediction depends on Action). If the model simulates your *initial* deliberation (at $T_0$), it remains Counterfactual Mugging (Prediction depends on Policy).
  **Crucial Distinction to Draw:** You must specify that the model is frozen at $T_0$. If participants assume the model updates on your $T_2$ state, they will solve the wrong problem. Use this confusion to highlight the difference between **Predicting an Action** (Newcomb) and **Predicting a Disposition** (Mugging).
