answer: |-
  **Credence:** 60%

  **Decomposition:**
  1.  **Goal (Agent-Neutrality):** High dependency; if liberation is strictly agent-relative (your Nirvana vs. mine), it fails classical consequentialism, but the universal badness of *dukkha* pulls it back toward neutrality.
  2.  **No-Self (Welfare Subject):** Moderate dependency; consequentialism survives if 'persons' are accepted as conventionally real for ethics, but collapses if 'no-self' is read as eliminating the locus of welfare entirely.
  3.  **Karma/Rebirth (Structure):** Low dependency for classification, high for coherence; karma provides the causal mechanism for consequences, but Western secular consequentialists reject the ontology while keeping the logic.
  4.  **Definition (Maximization):** Critical dependency; Buddhism fits if consequentialism means 'rightness depends on outcomes,' but fails if it requires 'maximizing aggregate welfare' since Buddhism seeks cessation, not maximization.

  **How they combine:**
  The definition and no-self factors cancel out the metaphysical friction (by allowing conventional persons and negative utility), leaving the structural causal logic of karma and suffering as the dominant weight, though the agent-relative soteriology keeps it from reaching 90%.

  **Least sure:**
  The **No-Self** factor, because it is unclear whether early Buddhism treats conventional persons as robust enough to bear moral weight in a way a consequentialist calculus requires, or merely as illusions to be dispensed with.

  **What would move it most:**
  A clear textual instance in the early Suttas where the Buddha explicitly authorizes breaking a precept *solely* because it produces less net suffering in a specific scenario, rather than because it aligns with the character of the Noble One.

  **What counts as settling:**
  Settling requires abandoning the hope of a perfect isomorphism; the question is only "settled" when we agree we are mapping *logical structure* (where it is consequentialist) versus *ontological commitment* (where it is not), acknowledging that 'consequentialism' is a modern heuristic applied to a pre-modern soteriology.
