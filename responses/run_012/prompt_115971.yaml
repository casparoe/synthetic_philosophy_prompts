prompt: |-
  Okay, so I've been reading Buddhist stuff on my own for a few years now — the old suttas, not the mindfulness-app version — and I keep hitting the same wall. Everyone says Buddhist ethics is really a kind of consequentialism: you're reducing suffering, the precepts are rules of thumb, the whole thing is goal-directed. But Buddhism also says there's no self, and consequentialism seems to need selves — welfare has to belong to somebody for it to add up. So give me your actual credence, a number, that early Buddhist ethics is best classified as consequentialism, and show me the decomposition. How much rides on whether the goal (the end of suffering, nirvana) is agent-neutral rather than something each person works out for themselves? How much on whether no-self really dissolves the welfare subject or just says it's impermanent and conventional? How much on karma and rebirth doing structural work that a western consequentialist wouldnt sign up for? And how much on whether 'consequentialism' even requires maximizing aggregation, or just any goal-directed ethics? A rough number and one line for each, then how they combine, which one you're least sure about, and what would move it most. And what would even count as settling the classification question, since I can never tell what that would look like.
