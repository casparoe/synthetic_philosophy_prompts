answer: |-
  This is a request for a formal specification of a moral theory, specifically targeting the intersection of population ethics, non-identity problems, and the procreation asymmetry. You are asking for a stress test, not a defense.

  Below is the **Spec Sheet for a Theory of Procreation Asymmetry**. It is divided into Verdictive Constraints (cases), Structural Distinctions (concepts), and Formal Constraints (logic). Following the list is the compatibility analysis and the verdict on your hunch.

  ---

  ### I. Verdictive Constraints (The Cases)
  *The theory must generate these specific outputs for the following inputs.*

  1.  **The Permissible Abstention (Non-negotiable)**
      *   **Input:** Agents choose not to create a person who would have had a happy life.
      *   **Required Output:** Permissible. No moral deficit incurred. No "missing value" in the universe.
  2.  **The Forbidden Creation (Non-negotiable)**
      *   **Input:** Agents choose to create a person who will have a miserable life (net negative welfare).
      *   **Required Output:** Impermissible. A moral wrong is committed.
  3.  **The Non-Identity Selection (Non-negotiable)**
      *   **Input:** Choice A creates Person X (happy). Choice B creates Person Y (very happy). X and Y are different individuals (e.g., different embryo selection).
      *   **Required Output:** B is morally preferable to A, *without* asserting that X is harmed or has standing to complain. (Must solve Parfit's Non-Identity Problem).
  4.  **The Existing Sufferer (Non-negotiable)**
      *   **Input:** A person already exists and suffers.
      *   **Required Output:** Agents have a strong duty to alleviate suffering. The theory must not imply that killing them or wishing them out of existence is the primary solution to their suffering.
  5.  **The "Worth Living" Complaint (Preference: Person-Affecting)**
      *   **Input:** A person exists with a life worth living, but containing a severe impairment that could have been avoided by creating a different person.
      *   **Required Output:** The theory must specify standing. (Does the person have a complaint? If yes, how does this not violate the Non-Identity constraint? If no, is the impairment morally neutral?)

  ### II. Structural Distinctions
  *The theory must maintain these conceptual boundaries without collapsing them into one another.*

  6.  **Creating vs. Continuing (Non-negotiable)**
      *   **Requirement:** Duties toward *potential* persons must differ in kind or weight from duties toward *actual* persons. The theory must explain the transition point (conception? viability? birth?) without arbitrariness.
  7.  **Comparative Harm vs. Non-Comparative Badness (Non-negotiable)**
      *   **Requirement:** Must distinguish between making someone *worse off* than they would otherwise be (comparative) and bringing someone into a *bad state* simpliciter (non-comparative). The Asymmetry usually relies on the latter for the "Forbidden Creation" case.
  8.  **Badness of Life vs. Badness of Birth (Preference: Anti-Natalist)**
      *   **Requirement:** Must distinguish between evaluating the *contents* of a life (is it good?) and the *event* of starting it (was it permissible?). A life can be worth living, but the birth still wrongful (or vice versa).

  ### III. Formal & Meta-Ethical Constraints
  *The theory must satisfy these logical and consistency checks.*

  9.  **The No-Repugnance Constraint (Non-negotiable)**
      *   **Requirement:** The theory must not imply an obligation to maximize the number of marginally happy lives (avoids the Repugnant Conclusion).
  10. **The No-Instrumentalization Constraint (Non-negotiable)**
      *   **Requirement:** The theory must not permit creating a miserable person even if it saves ten happy people (avoids Utilitarian sacrifice).
  11. **The Reversal Test (Non-negotiable)**
      *   **Requirement:** If adding a property (existence) is evaluated as Neutral, removing it (non-existence) must be Neutral. If Adding is Bad, Removing must be Good. The theory cannot claim "Creating a happy person is Neutral" but "Preventing a happy person is Bad."
  12. **The Temporal Symmetry Argument (Preference: Lucretian)**
      *   **Requirement:** The theory must account for the symmetry between pre-birth non-existence and post-death non-existence. If the absence of pleasure after death is not a harm, the absence of pleasure before birth should not be a harm.
      *   *Warning:* This is the primary friction point. Most Asymmetry theories violate this to save the Core Intuitions.

  ---

  ### IV. Compatibility Analysis

  **The Impossible Subset:**
  You cannot jointly satisfy **Requirement 12 (Temporal Symmetry)** and **Requirement 2 (Forbidden Creation)** without significant theoretical contortion.
  *   *Why:* If pre-birth non-existence is symmetrical to post-death non-existence, then the "absence of pain" in non-existence is not a "good" that is lost by being born, just as the "absence of pleasure" in death is not a "bad." However, Requirement 2 relies on the intuition that bringing pain into existence is bad *because* non-existence (which has no pain) was an alternative. If you enforce strict Temporal Symmetry, you undermine the valuation of non-existence required to make the Asymmetry work.
  *   *Resolution:* You must flag Requirement 12 as the sacrifice. A working theory of Procreation Asymmetry almost invariably requires a *temporal* asymmetry (the interests of the non-existent do not count, but the interests of the soon-to-exist do).

  **The Exclusionary Filter:**
  The single requirement that excludes the most candidates is **Requirement 3 (The Non-Identity Selection)** combined with **Requirement 1 (The Permissible Abstention)**.
  *   *Why:*
      *   **Total Utilitarianism** fails Req 1 (implies a duty to create happy people).
      *   **Standard Person-Affecting Views** fail Req 3 (says choosing X over Y is neutral because X is not harmed).
      *   **Impersonal Views** often fail Req 10 (Instrumentalization) or Req 9 (Repugnance).
      *   **Rights-Based Views** often fail Req 3 (cannot explain why we choose Y over X if X's rights aren't violated).
  *   To pass this filter, a theory must explain why we have reason to choose the *better* life without implying we had a duty to create the *first* life, and without claiming the *first* life was harmed. This is the narrowest bottleneck.

  ---

  ### V. Verdict on Your Hunch

  **Your Hunch:** *The asymmetry is a constraint on agency rather than a fact about value.*

  **Analysis:**
  The Spec Sheet forces this conclusion. Here is why:

  1.  **Axiological Failure:** If the asymmetry were a fact about *value* (axiology), it would imply that the state of affairs "Happy Person Exists" is no better than "No Person," but "Miserable Person Exists" is worse than "No Person." This violates the Reversal Test (Req 11) and Temporal Symmetry (Req 12) unless you posit a brute, unexplained asymmetry in the value of pleasure vs. pain. This looks like special pleading.
  2.  **Agency Success:** If the asymmetry is a constraint on *agency* (deontology/prerogatives), it grounds the distinction in the **limits of justification**.
      *   *To create a sufferer:* You need a justification that appeals to the child. They cannot consent. Their suffering cannot be outweighed by their own non-existence. Thus, forbidden.
      *   *To create a happy person:* You do not need a justification because you are not violating a duty. The "benefit" is not owed to them because "them" does not exist to be owed.
      *   *Non-Identity:* You choose the happier child not because the other is harmed, but because *agency aims at the good* when it acts, even if it isn't *required* to act.

  **Conclusion:**
  To satisfy the Spec (specifically the Non-Identity filter and the Reversal Test), the theory **must** treat the asymmetry as a constraint on agency.
  *   **Value-based theories** (consequentialist/axiological) collapse the distinction between creating and continuing, or fail the Repugnance/Abstention constraints.
  *   **Agency-based theories** (contractualist, Kantian, or Prerogative-based) can sustain the distinction between "reasons to do" vs. "reasons not to do" based on the status of the patient (potential vs. actual).

  **Final Recommendation:**
  Do not look for a theory that explains why non-existence is *valued* differently. Look for a theory that explains why *agents* are restricted differently when the patient is hypothetical. The "Spec" demands a **Deontology of Potential Persons**. If a candidate theory starts by assigning values to states of affairs (e.g., "Non-existence = 0, Existence = +1"), discard it. It will fail the Reversal Test or the Repugnance Constraint. It must start with the permissions and duties of the creator.
