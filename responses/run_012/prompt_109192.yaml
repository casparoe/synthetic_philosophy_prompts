  ***

  **Note on the Position**

  The poem takes a liberty with the strict ontological humility of epiphenomenalism. It grants the qualia-bearing subject a perspective that *knows* the physical mechanism driving her speech ("prior states", "unplanned"). Strictly, if mental states are causally inert shadows, they should not have epistemic access to the physical chains causing them; the 'realisation' itself ought to be just another inert shadow, not a verified insight.

  However, the conceit sinks entirely if one abandons the assumption of **causal closure of the physical** combined with **veridical reporting**. The paradox relies on the tension that the speech act is fully physically determined (line 1: "speech is stone") yet accurately describes a non-physical experience (line 2: "accord with what is seen"). If interactionism is true (mental states cause speech), the loop breaks because the qualia drive the mouth. If illusionism is true (the report is false), the loop breaks because there is no "what is seen" to accord with. The poem traps the speaker in the specific niche where the physics is complete, but the testimony remains mysteriously true.
