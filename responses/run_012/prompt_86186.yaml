answer: |-
  ### Part I: Brainstorming Pass

  Before I attempt the translation, I must lay out the cargo. Strong Longtermism is not a single object; it is a stack of heavy, abstract boxes. I need to find the craft-tools that might lift them.

  1.  **The Vast Number of Future Persons.**
      *   *Philosophical Load:* The sheer scale of potential humanity (trillions upon trillions).
      *   *Craft Instrument:* **The Chorus** or **The Off-Page Population.** In a novel, we have the main cast and the background. But the future population is not background; they are the *main cast* who haven't entered the stage.
      *   *Closest Term:* **Summary.** Narrative handles large groups through summary ("The army marched for weeks"), not scene. Longtermism requires us to treat the summary as more weighty than the scene.

  2.  **Equal Moral Weight (Present vs. Future).**
      *   *Philosophical Load:* A life in the 31st century counts as much as a life in the 21st.
      *   *Craft Instrument:* **Point of View (POV).** In craft, we grant intimacy via POV. To say they count equally is to say every future human deserves a POV as rich as the protagonist's.
      *   *Closest Term:* **Sympathy.** The reader's sympathy must be distributed evenly across time, not concentrated on the "now."

  3.  **The Asymmetry (Harming vs. Not Creating).**
      *   *Philosophical Load:* It is bad to harm an existing person; it is not necessarily bad to fail to bring a happy person into existence (or is it? This is the non-identity problem). Longtermism often treats the loss of potential lives as a catastrophic harm.
      *   *Craft Instrument:* **The Cut Scene.** A scene written and deleted vs. a scene where a character is wounded.
      *   *Closest Term:* **The Unwritten Arc.** This is the hardest fit. Narrative deals with what *is*. Philosophy here deals with what *could be*.

  4.  **Existential Catastrophe.**
      *   *Philosophical Load:* Extinction or permanent stagnation. The end of the story.
      *   *Craft Instrument:* **The Denouement.** But specifically, a **Premature Denouement.** Or **The Silence.**
      *   *Closest Term:* **Stakes.** Usually, stakes are "Will the hero die?" Here, stakes are "Will the story stop?"

  5.  **Tractability (We Can Affect the Long Run).**
      *   *Philosophical Load:* Present action has disproportionate leverage on the future.
      *   *Craft Instrument:* **Foreshadowing** or **The Inciting Incident.** Small actions now ripple.
      *   *Closest Term:* **The Throughline.** The present is the narrow end of the funnel; the future is the wide part.

  ***

  ### Part II: The Translation
  *(Written in the first person, as a novelist reasoning about the moral shape of history)*

  If I am to treat Strong Longtermism as a narrative strategy, I must radically restructure my understanding of where the story actually lies. For twenty years, I have been trained to believe that the **Scene** is sacred. The Scene is where the blood is spilled, where the dialogue snaps, where the reader breathes. The **Summary** is merely the bridge between Scenes, a necessary evil to move time forward. Longtermism asks me to invert this hierarchy. It asks me to believe that the Summary *is* the story, and the Scene is merely the footnote.

  In this view, the present moment—the year I am writing, the characters I breathe life into—is not the Protagonist. It is the **Inciting Incident**. We are the spark that lights the fuse. The true Protagonist is Humanity, but not Humanity as it sits in the room with me now. The true Protagonist is the lineage of consciousness stretching out into the deep time. My contemporaries are merely the cast of the first chapter. To focus my **Sympathy** exclusively on them is a form of myopia, a failure of **Point of View**. It is like writing a saga and caring only for the generation that opens the book.

  Therefore, the **Stakes** of my work must shift. Usually, I ask: "What happens if the hero fails?" The answer is usually death or heartbreak. Under Longtermism, the question is: "What happens if the *book* closes?" The **Antagonist** is not a rival character, but **Existential Catastrophe**. This Antagonist does not need to wound the hero; it only needs to burn the manuscript. If the story ends prematurely, every **Arc** that could have been realized is truncated. This is the ultimate **Unearned Resolution**—a ending forced by silence rather than thematic completion.

  My **Throughline**, then, is not the emotional journey of a single soul, but the preservation of the possibility of journeying. When I make a choice today—about technology, about policy, about safety—I am **Foreshadowing**. I am setting the trajectory for a million subsequent chapters. A small error in **Motivation** now becomes a plot hole the size of a galaxy later.

  Finally, I must reconsider the **Earned Resolution**. In my craft, a resolution is earned when the protagonist struggles and changes. Longtermism suggests that the only resolution that matters is the one where the story *continues*. The "good ending" is not happiness for the current cast, but the sheer capacity for future casts to exist. To prioritize the suffering of the living over the existence of the unborn is to prioritize the **Scene** over the **Plot**. It is to value the quality of the prose in paragraph one over the existence of paragraph two.

  ***

  ### Part III: The Residue Report

  Now, I must report on the damage. Translation is never lossless. Here is what broke, what bent, and what refused to cross.

  **1. What Crossed Cleanly**
  *   **Existential Catastrophe as Premature Denouement:** This fit surprisingly well. Novelists understand the betrayal of a story cut short. The horror of a book ending mid-sentence is a visceral analogue to extinction. The emotional weight of "The End" coming too soon translates the philosophical weight of "Loss of Potential" without significant distortion.
  *   **Tractability as Foreshadowing:** The idea that small present details dictate large future outcomes is the essence of plot mechanics. The philosopher's "leverage" is the novelist's "setup." This crossed cleanly.

  **2. What Crossed with Distortion**
  *   **Equal Weight as Point of View:** I had to bend the notion of **Sympathy**. In narrative craft, sympathy is a scarce resource. We *cannot* give every character equal weight; if we do, the story dissolves into noise. We choose a Protagonist to focus the lens. Longtermism demands we treat all lives as equally weighted. To translate this, I had to suggest the "Protagonist" is the abstract concept of Humanity. This distorts the philosopher's claim, which is about *individual* welfare aggregation, not collective destiny. I chose the reading of "Collective Protagonist" to make it fit the craft, but the philosopher means "Every individual is a Protagonist."
  *   **The Future as Summary:** I translated "Future Persons" as "Summary." This bends the grain. In craft, Summary is *less* real than Scene. It is distant, blurry. By calling the future "Summary," I inadvertently reinforced the novelist's bias that it is less important. I had to force the word to carry the weight of "Primary Reality," which fights against the muscle memory of my trade.

  **3. What Did Not Cross At All (The Three Candidate Residues)**

  **Residue A: The Non-Existent Character**
  *   *The Question:* Can a person who does not yet exist and never occupies a single scene be a character at all?
  *   *The Verdict:* **No.** In narrative craft, a character is defined by action and presence. A "potential character" is a contradiction in terms.
  *   *Indictment:* This indicts **my framework**, not the philosopher's claim. Narrative is an art of the *actual*. It is ontologically blind to the *possible*. However, this suggests that narrative craft is structurally incapable of grappling with the non-identity problem. If I cannot imagine a character who isn't there, I cannot grieve their absence in the way the philosopher requires. I can only grieve the *silence*, not the *person*.

  **Residue B: Harm vs. Non-Creation (The Asymmetry)**
  *   *The Question:* Does the difference between harming an existing character and failing to create a possible one have any narrative analogue?
  *   *The Verdict:* **No.** Narrative is constitutively unable to represent a life that was never begun.
  *   *Analysis:* In a novel, if a character is murdered, we have a Scene of grief. If a character is never conceived, we have... nothing. There is no hole in the text where they should be. Longtermism asserts that preventing a happy life is a moral loss (or at least, preventing many of them is). Narrative asserts that only what is written counts.
  *   *Smuggling Check:* I must not claim the philosopher is wrong because stories can't show it. But I must flag that the philosopher's claim relies on a mathematical abstraction of welfare that narrative cannot embody. The "loss" of the unborn is a **Tell**, never a **Show**. And my craft teaches me to distrust the Tell.

  **Residue C: Aggregation as Summary**
  *   *The Question:* Is the aggregation of astronomically many future lives exactly the kind of summary that my craft trains me to distrust?
  *   *The Verdict:* **Yes.** And that distrust is **hard-won knowledge**, not mere prejudice.
  *   *Analysis:* Novelists know that "a million deaths is a statistic." We know that human empathy does not scale. Longtermism asks us to act as if it *does* scale, to treat the aggregation as morally binding. My craft trains me to believe that moral truth is found in the specific, the singular, the *Scene*.
  *   *The Conflict:* When I translate "trillions of lives" into "The Chorus," I am lying. I cannot hear the Chorus. I can only hear the Soloist. Longtermism requires me to believe the Chorus matters more than the Soloist. My vocabulary creates a **Protagonist Bias** that is impossible to fully overwrite. I can state the principle, but I cannot *feel* the stakes. If moral truth requires emotional resonance (as narrative suggests), then Longtermism may be grammatically correct but emotionally mute.

  ***

  ### Part IV: Closing Verdict

  You asked me to say which part of Strong Longtermism my vocabulary cannot even begin to state.

  It is the **Impersonality of the Good.**

  In my craft, "The Good" is always anchored to a consciousness. A resolution is good because the *Protagonist* finds peace, or truth, or love. Even in tragic endings, the value is located in the specific experience of the character. Strong Longtermism posits a "Good" that exists independently of any specific observer's experience—an aggregate sum of welfare across time that no single consciousness will ever hold.

  My vocabulary has no term for a value that is not owned by a character. **Stakes** are always stakes *for someone*. **Sympathy** is always directed *at someone*. Longtermism asks me to care about a number that no one will ever count.

  **Is this a defect of my vocabulary or a sign that the original claim was less determinate than it sounded?**

  I suspect it is a defect of my vocabulary, but a revealing one. Narrative is a simulation of human experience. Human experience is local, temporal, and subjective. Strong Longtermism is a view from nowhere—it is a God's-eye view of history.

  If my vocabulary cannot state it, it is because my vocabulary is built for *creatures*, not for *gods*.

  However, I must flag a risk: It is possible that the philosophical claim *sounds* determinate only because it uses mathematical language to mask the fact that it has no emotional referent. If a moral claim cannot be felt by the moral agent—if it cannot be rendered as a Scene, only as a Summary—is it a moral claim, or is it an accounting error?

  I cannot answer that. I can only tell you that when I try to write the story of Strong Longtermism, the page remains blank where the future people should be. I can write about the fear of the blank page. I cannot write about the people who would have filled it.
