      *   *Climax:* The Elders call for the Stones. The crowd shifts attention. The rational argument fades. The stones are weighed.
      *   *Falling Action:* The winner is declared. The loser accepts it (because of custom/force of tradition). Elian's judgment is ignored.
      *   *Resolution:* Elian understands the Pascalian trap. Justice (his way) is helpless. Force (the stones) rules. But the Force *is* the Justice now because it's custom.

  5.  **Refining the Persona:**
      *   I need to sound like a professor who writes fiction. Thoughtful, slightly academic but creative.
