      *   **Task:** Write a short story dramatizing this idea based on a specific setting provided by the user.
      *   **Setting:** Small fishing town on an island. No government. Dispute resolution via "heavy stone" custom (sortition/chance/force metaphor). Young magistrate arrives from mainland, wants reasoned law, has no force/authority.
