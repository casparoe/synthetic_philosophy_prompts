answer: |-
  # Diagnostic Decision Tree: Individual Contributions to Collective Harms

  **Instructions:** Start at **Node 1**. Answer the question based on your intuitive judgment about the scenario (e.g., buying a factory-farmed chicken, driving a gas car, or voting in a safe seat). Follow the branch corresponding to your answer until you reach a leaf.

  ### Node 1: The Role of Consequences
  **Question:** If your specific act produces no perceptible good consequences for the world, can it still be morally required?
  *   **No** (Morality depends on producing good outcomes) → Go to **Node 2**.
  *   **Yes** (Morality depends on other factors like duty, character, or meaning) → Go to **Node 4**.

  ### Node 2: The Nature of Causal Impact
  **Question:** Does imposing a tiny, imperceptible probability of preventing harm count as producing a "good consequence"?
  *   **Yes** (Tiny risks aggregate to moral value) → **Leaf 1: Expected-Impact Consequentialism**.
  *   **No** (Only perceptible changes or general patterns count) → Go to **Node 3**.

  ### Node 3: Generalization vs. Thresholds
  **Question:** Is the act wrong because it would be disastrous if *everyone* did it, or only if *you* personally cross a physical tipping point?
  *   **If Everyone** (The general practice matters) → **Leaf 2: Rule-Consequentialism**.
  *   **Tipping Point** (Only physical thresholds matter) → **Leaf 3: Threshold Consequentialism**.

  ### Node 4: Individual vs. Collective Context
  **Question:** Are you obligated to act even if no collective agreement or law requires it?
  *   **Yes** (Individual duty exists independently) → Go to **Node 5**.
  *   **No** (Obligation depends on collective coordination) → Go to **Node 8**.

  ### Node 5: Source of Individual Duty
  **Question:** Is the wrongness derived from violating a universal principle of reason that applies to all rational agents?
  *   **Yes** (Duty is based on rational consistency) → **Leaf 4: Kantian Universalisability**.
  *   **No** (Duty is based on participation, character, or expression) → Go to **Node 6**.

  ### Node 6: Participation vs. Self-Development
  **Question:** Is the wrongness located in joining a harmful social practice, or in what the act does to you?
  *   **Joining Practice** (You become part of the harm) → **Leaf 5: Complicity or Authorization Views**.
  *   **What it Does to You** (Focus on the agent's inner state) → Go to **Node 7**.

  ### Node 7: Character vs. Communication
  **Question:** Is the primary value of the act found in shaping your own character or in communicating a stance to others?
  *   **Shaping Character** (Becoming a certain type of person) → **Leaf 6: Virtue-Ethical Views**.
  *   **Communicating Stance** (Sending a message of solidarity/dissent) → **Leaf 7: Expressive or Participatory Views**.
      *   *Note: These leaves are often difficult to separate in practice, as virtuous acts are frequently expressive.*

  ### Node 8: The Nature of Collective Failure
  **Question:** Is the moral failure located in the group's inability to coordinate, or in your choice to act without coordination?
  *   **Group's Inability** (We have a duty, but I am not individually blameworthy) → **Leaf 8: Collective Agency Views**.
  *   **Your Choice** (I am excused or forbidden from acting until laws change) → **Leaf 9: Political-Obligation Views**.

  ---

  ## Position Leaves & Awkward Commitments

  1.  **Expected-Impact Consequentialism:** You must calculate tiny probabilities of harm, implying you should abstain from meat even if your purchase definitely does not trigger an order.
      *   *Awkward Commitment:* You are obligated to spend immense time calculating microscopic probabilities for trivial acts.
  2.  **Rule-Consequentialism:** You must follow the rule that yields the best outcomes if universalized, even if breaking it secretly would produce better actual results.
      *   *Awkward Commitment:* You must abstain from a harmless act (e.g., driving on an empty road) simply because the rule forbids it.
  3.  **Threshold Consequentialism:** Your act is permissible until you are the specific individual who crosses the physical tipping point of harm.
      *   *Awkward Commitment:* It is morally permissible to pollute heavily right up until the exact moment the ecosystem collapses.
  4.  **Kantian Universalisability:** You must act on maxims you could will to be universal law, regardless of whether your individual act changes the outcome.
      *   *Awkward Commitment:* You must abstain from emissions even if you know with certainty that your abstention is causally futile.
  5.  **Complicity or Authorization Views:** You are morally tainted by participating in a harmful structure, even if your contribution makes no causal difference.
      *   *Awkward Commitment:* You share responsibility for harms you could not have prevented, solely based on your association with the practice.
  6.  **Virtue-Ethical Views:** The focus is on cultivating a character that does not desire excess or harm, rather than on the external outcome.
      *   *Awkward Commitment:* A virtuous person might act correctly even if their action inadvertently causes more harm than a vicious person's action.
  7.  **Expressive or Participatory Views:** The act is valuable as a symbol of solidarity with victims or nature, independent of causal efficacy.
      *   *Awkward Commitment:* Symbolic acts may be treated as morally equivalent to effective acts, potentially encouraging inefficacious gestures.
  8.  **Collective Agency Views:** The primary obligation lies with the "we," meaning individuals are not fully blameworthy for collective inaction.
      *   *Awkward Commitment:* It becomes difficult to identify who, specifically, is responsible for initiating the collective action required.
  9.  **Political-Obligation Views:** Individual lifestyle changes are optional or impermissible until binding political structures are in place.
      *   *Awkward Commitment:* You are permitted to continue contributing to harm (e.g., flying frequently) as long as it remains legal.

  ---

  ## Unoccupied or Problematic Combinations

  *   **Threshold Consequentialism + Kantian Universalisability:** *Incoherent.* Kantian duties are not contingent on physical thresholds or causal efficacy.
  *   **Political-Obligation + Expected-Impact:** *Incoherent.* Expected-impact requires acting on probabilities now; Political-Obligation requires waiting for legislation.
  *   **Virtue Ethics + Threshold Consequentialism:** *Unattractive.* Virtue focuses on character dispositions, which do not align with waiting for physical tipping points to act.
  *   **Complicity + Political-Obligation:** *Unexplored/Tense.* Complicity suggests you should withdraw now; Political-Obligation suggests you should wait for laws. Some hybrid views exist but require careful negotiation.

  ---

  ## Note on Settled vs. Contested Literature

  **Settled:** There is broad consensus in the literature that the "inefficacy objection" (the claim that individual acts make no perceptible difference) is the central problem to be addressed. Pure causal individualism (the idea that only perceptible causal differences matter) is widely rejected as insufficient for collective harm problems.

  **Contested:** It is genuinely contested whether non-causal views (Complicity, Expressive, Kantian) successfully generate *binding obligations* or merely *recommendations*. Furthermore, the tension between **Political-Obligation Views** (wait for structural change) and **Individual-Duty Views** (act now) remains unresolved; presenting either as the consensus would be inaccurate. The literature is currently divided on whether individual action is a substitute for, or a prerequisite to, political change.
