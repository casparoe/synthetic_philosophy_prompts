answer: |-
  **What the theorem buys you**

  Aumann's Agreement Theorem states that two Bayesians with a common prior cannot have common knowledge of differing posteriors. In plain English: if you trust each other's rationality and start from the same baseline assumptions, you cannot honestly agree to disagree about facts.

  This buys you a specific lever: **Disagreement is evidence of asymmetric information.** If you both trust the math, a gap in numbers isn't a conflict to be won; it's a signal that one of you holds a piece of evidence the other hasn't fully integrated.

  It does *not* license you to force agreement on values, goals, or actions. It does not apply if your fundamental priors (e.g., "trust in institutions" vs. "trust in data") are actually different. It does not prove who is right. It only proves that if you are both rational and similar enough, the gap shouldn't exist without a reason. Your job is to find the reason, not to enforce the convergence.

  **The procedure**

  **1. The Category Check (5 mins)**
  *   **Ask:** "Write down the exact proposition you disagree on. Is it a prediction about the world (credence), or a preference about what to do (value/action)?"
  *   **Sufficient Answer:** A binary statement with a probability attached (e.g., "This startup will hit $1M ARR in 12 months: 70%").
  *   **Halt Condition:** If the statement is "We should quit" or "This is unfair," stop. This is a values negotiation, not an Aumann update. Hand it back.
  *   **Facilitator Note:** If they try to sneak a value in ("It's 90% likely to be a disaster" when they mean "I hate risk"), call it out.

  **2. Independent Calibration (5 mins)**
  *   **Ask:** "Don't talk. Write down your current credence (0-100%) on a slip of paper. Hand it to me."
  *   **Sufficient Answer:** Two numbers.
  *   **Why:** Prevents anchoring. Do not let them say numbers out loud yet.
  *   **Noise Floor Check:** If the gap is ≤10%, tell them: "This is within human calibration noise. Stop. Go build the thing."
  *   **Halt Condition:** Gap is small. Procedure ends.

  **3. The Information Dump (15 mins)**
  *   **Ask:** "Person A, you are higher. What is the *single strongest piece of evidence* you have that Person B does not fully possess? Not your reasoning—your evidence."
  *   **Sufficient Answer:** A specific data point, observation, or model input (e.g., "I spoke to three churned customers," not "I think the market is tough").
  *   **Process:** Person B acknowledges receipt. Then swap. Person B gives their strongest unique evidence.
  *   **Update:** "Knowing what Person A just told you, does your number move? Write the new number."
  *   **Halt Condition:** Numbers don't move after two rounds of evidence exchange. Proceed to Step 4.

  **4. The Prior Test (10 mins)**
  *   **Ask:** "If you had been born with Person B's memories and saw the evidence they just showed you, would you arrive at their number?"
  *   **Sufficient Answer:** "Yes" (Common Prior) or "No" (Divergent Prior).
  *   **If Yes:** They must update. The theorem demands it. If they don't, one is processing incorrectly.
  *   **If No:** They must articulate *which* prior differs (e.g., "I assume people lie in interviews," vs "I assume people tell the truth").
  *   **Halt Condition:** If priors are fundamentally different and non-negotiable, halt. The theorem is void. You are now mediating a worldview clash, not a factual dispute.

  **5. The Convergence Check (10 mins)**
  *   **Ask:** "Reveal your current numbers. Is the gap now ≤10%?"
  *   **If Yes:** Stop. You have extracted the value.
  *   **If No:** "One of you is likely making a calculation error or withholding information. I am not going to solve this for you. You have 5 minutes to find the error, or you must agree to pause the decision until you can."
  *   **Facilitator Note:** Do not say "You are being irrational." Say "The math suggests hidden info or error. I can't tell which."

  **Three dry runs**

  **Case 1: The Business Partners (Success)**
  *   **Disagreement:** Will the beta launch get 1,000 signups?
  *   **Step 1:** Credence check. Valid.
  *   **Step 2:** Alice writes 80%. Bob writes 40%. Gap is 40%. Proceed.
  *   **Step 3:** Alice reveals she has a waitlist of 2,000 emails. Bob reveals he knows the email provider has a 50% bounce rate on old lists.
  *   **Update:** Alice updates to 60% (bounce rate hurts). Bob updates to 55% (2,000 is a big base).
  *   **Step 4:** Prior test. Both agree "Email marketing generally works if deliverability is fixed." Common prior confirmed.
  *   **Step 5:** Gap is 5%. Procedure stops. They launch.
  *   **Outcome:** Information asymmetry resolved.

  **Case 2: The Couple (Values Masking as Credence)**
  *   **Disagreement:** Should he quit his job? (Framed as: "Is there a >50% chance you'll find a better job in 3 months?")
  *   **Step 1:** She says 80% (Yes). He says 20% (No).
  *   **Step 3:** She offers evidence: "You have great skills." He offers evidence: "The market is frozen."
  *   **Update:** Numbers don't move. She stays 80%, He stays 20%.
  *   **Step 4:** Prior test. She says, "If I had your experience of the market, I'd still bet on you." He says, "If I had your optimism, I'd quit."
  *   **Halt:** They admit priors differ (Optimism vs. Risk Aversion).
  *   **Outcome:** Procedure halts at Step 4. You tell them: "This isn't a fact dispute. You disagree on how much risk is acceptable. Aumann doesn't apply. Negotiate the risk, not the probability."

  **Case 3: You are the Party (The Uncomfortable Update)**
  *   **Context:** You are facilitating, but you step in as a party. You believe a project will succeed (90%). Your partner believes it will fail (30%). You hate their number.
  *   **Step 2:** You write 90%. Partner writes 30%. Gap 60%.
  *   **Step 3:** You give your evidence: "The tech works." Partner gives their evidence: "I saw the regulatory filing that bans this use-case in our target state."
  *   **Update:** You didn't know about the filing. It is hard evidence.
  *   **Step 4:** Prior test. You ask yourself: "If I knew about the filing, would I still be 90%?" Honest answer: No. "Would I be 30%?" Maybe not, but lower.
  *   **Step 5:** You must update. You move to 50%. Partner moves to 45%.
  *   **The Feeling:** You hate this. You feel the partner is over-weighting the regulation.
  *   **The Math:** The procedure forces you to move. Why? Because you accepted the Common Prior assumption in Step 4. You admitted that *given the same information*, you should roughly agree. Since they had info you didn't, your 90% was mathematically invalid.
  *   **Is this diplomacy?** No. The theorem licenses this *only if* you accept that your partner is a rational agent processing valid evidence. If you think they are misinterpreting the regulation, you must state that as *new evidence* ("The regulation has a loophole"), not as a prior difference. If you can't find the loophole, the theorem says you are the one in error for ignoring the filing. You move because the procedure exposes that your 90% was based on incomplete data, not because "compromise is good."

  **Where the math stops and I start**

  1.  **The Noise Floor (Step 2):** The theorem doesn't define "noise." I set the 10% threshold.
      *   *Say:* "I'm calling this noise. Not because the math says so, but because human calibration isn't that precise. I'm stopping the process here."
  2.  **The Prior Validity (Step 4):** I decide if a prior difference is "fundamental" or just "unarticulated evidence."
      *   *Say:* "You're claiming different priors, but it sounds like you just trust different sources. I'm going to treat that as an evidence problem, not a prior problem. If you insist it's a prior, we stop."
  3.  **The Error Call (Step 5):** If the gap remains, I decide whether to push harder or halt.
      *   *Say:* "The math says one of you is wrong. I don't know who. I'm not going to guess. But you can't make this decision until the gap closes or you admit you're guessing."

  **What this can't do**

  *   **Moloch Problems:** If both parties see the evidence but have incentives to lie (e.g., salary negotiation), the procedure breaks at Step 3. You will know because the "evidence" offered will be vague or unverifiable.
  *   **Complex Causal Models:** If the disagreement is about *how* variables interact (a structural model disagreement) rather than the value of the variables, Step 3 will spin forever. You will know because they will keep saying "Yes, but..." instead of updating numbers.
  *   **Identity-Protective Cognition:** If the belief is tied to their self-concept ("I am the kind of person who sees risk"), Step 4 will fail. They will claim a prior difference to protect their identity. You will know because the prior they articulate is unfalsifiable.
