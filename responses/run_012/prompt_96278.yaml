answer: |-
  ### Session Plan: The Load of Belief

  **Goal:** Move students from reciting Dennett's slogan ("predict by treating as rational") to distinguishing between *load-bearing* belief ascriptions (doing predictive work the design cannot) and *idle* ones (mere redescription).
  **Time:** 90 Minutes.

  ---

  ### I. The Order of Components (and Dependencies)

  1.  **The Design Stance Boundary (15 mins)**
      *   *Content:* Briefly re-establish the Physical, Design, and Intentional stances. Crucially, define the **Design Stance** for this session strictly as *architectural/functional explanation* (e.g., "It is a wall-follower," "It maximizes reward function R"), not just "how it was made."
      *   *Dependency:* You must establish that if the Design Stance *fully* predicts the behavior, the Intentional Stance is suspect. This sets the trap for the "Idle" distinction later.
      *   *Why first:* If you start with the Intentional Stance, they will treat it as the default. You must make it the *contingent* tool.

  2.  **The Carrying Case: "The U-Trap Agent" (20 mins)**
      *   *Content:* Introduce the specific system (details below). Do not reveal its architecture yet. Show its behavior: it successfully navigates mazes but enters a specific U-shaped trap and loops indefinitely.
      *   *Dependency:* Requires the Design Stance boundary to be set so students attempt to explain the failure via design first.
      *   *Why here:* You need a concrete failure mode to test the stances against.

  3.  **The Representation Objection (20 mins)**
      *   *Content:* Reveal the architecture (details below). Students will claim internal states *must* represent the goal. You must block this.
      *   *Dependency:* Requires the case to be fresh in mind so they try to "save" realism about belief.
      *   *Why here:* This is the pivot point. If they succeed in finding a representation, the session collapses into standard cognitive science. You must force them into Dennett's anti-realism to reach the distinction.

  4.  **Deriving the Distinction (20 mins)**
      *   *Content:* Compare the predictions made by the Design Stance vs. the Intentional Stance regarding *novel* variations of the trap.
      *   *Dependency:* Requires the Representation Objection to be settled (i.e., agreed that there are no internal symbols).
      *   *Why here:* The distinction must emerge from the *utility* of the prediction, not a definition.

  5.  **The LLM Application & Closing Question (15 mins)**
      *   *Content:* Apply the derived distinction to Large Language Models.
      *   *Dependency:* Requires the distinction to be clear.
      *   *Why last:* This tests transfer of understanding.

  ---

  ### II. The Carrying Case: "The U-Trap Agent"

  You need a case that feels like an agent, fails systematically, and has no "belief box."

  **What the Case Needs:**
  1.  **Input/Output:** A robot navigating a 2D grid. Input: local wall sensors (binary). Output: motor commands (forward, turn left, turn right).
  2.  **Training:** Trained via Reinforcement Learning (PPO) to reach a "goal zone" (green tile).
  3.  **The Failure:** In open space and simple corridors, it succeeds. In a **U-shaped trap** (goal is visible at the start, but blocked by a U-wall requiring a retreat to go around), it drives into the wall and oscillates/loops.
  4.  **The "Wrongness":** It acts *as if* it believes "The goal is directly ahead and reachable." It is systematically wrong about reachability.

  **What the Case Must Lack:**
  1.  **No Map:** The architecture is a recurrent neural network (RNN) with no explicit spatial mapping layer.
  2.  **No Goal Variable:** There is no internal state variable labeled `goal_location` or `distance_to_goal`. The "goal" is implicit in the reward function during training, not present during deployment.
  3.  **No Symbolic Planner:** No search tree, no "if-then" rules.

  **Where Students Will Wrongly Reach for Representation:**
  *   *The Move:* "The activation pattern in the hidden layer *is* the representation of the goal. It encodes the vector to the target."
  *   *Your Block:* **Refuse to explain the internal weights.** Stipulate that we have inspected the weights and found no interpretable structure (the "Black Box" stipulation). Tell them: *"For the purpose of this session, assume the internal states are causally efficacious but semantically opaque. There is no state that means 'goal' any more than a voltage in a thermostat means 'cold'. Denial of this stipulation forfeits the argument."*
  *   *Why:* If they insist representations exist, the distinction between Load-bearing and Idle collapses into "Real vs. Fake" belief. You need them to accept that the *ascription* is the only thing on the table.

  **What You Must Openly Refuse to Explain:**
  *   **How the behavior is generated.** Do not allow them to simulate the network in their heads. The Design Stance must remain abstract ("It is a policy trained to maximize reward").
  *   **Whether the system is conscious.** This is irrelevant to the Intentional Stance.
  *   **Whether the belief is "real."** Dennett's point is that this is a category error. Focus on *predictive utility*.

  ---

  ### III. Misconceptions and Interventions

  | Misconception | When it Arises | Exact Intervention |
  | :--- | :--- | :--- |
  | **"The Intentional Stance is just a metaphor."** | Early, when defining the stance. | "Metaphors don't predict specific failure modes in novel environments. If calling it a 'belief' allows you to bet money on its crash in a *new* maze, it is doing work. Is it metaphor or instrument?" |
  | **"If it has no internal representation, it can't be wrong."** | During the Representation Objection phase. | "Wrongness is not a property of the system; it is a relation between the system, the observer, and the world. The *observer* attributes the error to make sense of the mismatch. The system just crashes." |
  | **"The Design Stance explains the loop, so Belief is redundant."** | During the Distinction phase. | "The Design Stance explains *this* loop in *this* maze. Does it predict the loop in a *mirror-image* maze without re-running the code? The Belief ascription ('It thinks the goal is ahead') does. Where is the leverage?" |
  | **"Load-bearing means the belief is real."** | Near the end. | "No. Load-bearing means the ascription is *indispensable for the predictor*. A map is load-bearing for a traveler, even if the territory has no lines on it." |

  ---

  ### IV. Forcing the Distinction (Load-bearing vs. Idle)

  Do not announce the distinction. Force them to articulate it through the **Generalization Test**.

  1.  **Step 1:** Ask: "Using the Design Stance ('It maximizes reward via policy P'), predict what it does in a **V-shaped trap** (where retreating works immediately)."
      *   *Result:* They cannot know without running the simulation. The Design Stance is computationally expensive or opaque here.
  2.  **Step 2:** Ask: "Using the Intentional Stance ('It believes the goal is reachable directly'), predict what it does in the **V-shaped trap**."
      *   *Result:* They predict it will try to drive forward, fail, and perhaps retreat (if the belief updates) or crash.
  3.  **Step 3:** Ask: "In the Thermostat case, does attributing 'belief' allow you to predict anything the Design Stance ('bimetallic strip bends') does not?"
      *   *Result:* No. The Design Stance is trivial and complete. The belief is **Idle**.
  4.  **Step 4:** Ask: "In the U-Trap Agent, does attributing 'false belief' allow you to predict the *pattern of error* across *different* traps without re-training or re-simulating?"
      *   *Result:* Yes. It captures the *generalization failure*. The belief is **Load-bearing**.

  **The Definition They Must Arrive At:**
  *   **Idle:** The belief ascription is a gloss on a mechanism that is fully understood and tractable. (The design does the work).
  *   **Load-bearing:** The belief ascription captures a pattern of generalization or error that the mechanistic design explanation cannot efficiently predict or explain. (The design *fails* to do the work).

  ---

  ### V. The Closing Question

  Do not ask "Do LLMs have beliefs?" That invites metaphysics. Ask about the *work* the ascription does.

  **Pose it exactly like this:**

  > "We have a present-day Large Language Model. It outputs a falsehood.
  >
  > **Scenario A:** We attribute the falsehood to a 'hallucination' (a false belief). This attribution leads us to predict that if we challenge the model with evidence, it will *apologize and correct itself*.
  >
  > **Scenario B:** We attribute the falsehood to 'next-token probability distribution over training data.' This attribution leads us to predict that if we challenge the model, it will *continue to generate plausible-sounding tokens consistent with the error*.
  >
  > In current systems, which prediction is accurate? If the first prediction holds, is the belief ascription **load-bearing** or **idle**? If the second holds, what does that tell us about the limits of the Intentional Stance for AI safety?"

  **Why this works:**
  *   It tests if they understand that "Load-bearing" is about *predictive leverage*, not ontological status.
  *   It forces them to apply the U-Trap logic (Generalization of error) to the LLM case.
  *   If they say "It doesn't matter if it's real," they failed. The point is that if the belief ascription predicts *correction* (rational update) and the system *doesn't* correct, the stance is failing (or idle). If the system *does* correct, the stance is load-bearing.
  *   It highlights the danger: If we treat an idle stance as load-bearing, we trust the AI to be rational when it is merely statistical.

  ### VI. Instructor's Note on the "No Representation" Constraint

  Students will fight the "no representation" stipulation. They will cite "mechanistic interpretability" papers.
  **Your Counter:** "Interpretability finds *correlates* of behavior. It does not find *propositions*. Unless you can show me a state that has truth conditions independent of the observer's attribution, you are describing causal levers, not beliefs. For this session, if you cannot point to a variable that says 'P' where P can be false, there is no representation."

  This keeps the focus on the *stance* (the observer's tool) rather than the *system* (the object), which is the core of Dennett's view and your specific distinction.
