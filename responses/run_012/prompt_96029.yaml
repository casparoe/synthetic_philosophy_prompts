  hey so I'm a 3rd-year PhD student in political science, doing some formal modeling on the side, and I'm trying to use the discursive dilemma in a chapter on committee decision-making. I get the basic shape of it — say three of us are hiring and we all accept the rule that you hire someone iff they're strong on research and strong on teaching. Each of us has a perfectly consistent set of views, but when we majority-vote the two premises seperately we end up rejecting the candidate that two of the three would individually have hired. Fine, I can draw the table. What I can't shake is this: as far as I can tell the whole thing only bites because people aren't being fully sincere, or because they're voting on premises they don't really care about in the way the rule asks them to. If everyone just voted for whatever best matched their all-things-considered view of the case, or if we deliberated long enough to converge on the same relevant considerations, wouldn't it just dissapear? So isnt the dilemma basically an artifact of strategic or half-hearted voting rather than a fact about group rationality? And if it isn't, then the practical upshot seems obvious — just vote on the conclusion and skip the premises. Why would any committee ever do it the other way round? My supervisor keeps insisting it's deep and I'd like to be able to say something better than 'just vote on the conclusion', so tell me what it actually implies for how a group like ours should structure its decisions.
