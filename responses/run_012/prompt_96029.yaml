answer: |-
  This is a classic reaction to the Discursive Dilemma (or Doctrinal Paradox), and honestly, if you weren't skeptical of it, I'd worry you hadn't thought about it hard enough. Your intuition—that the "solution" is to just vote on the conclusion (Conclusion-Based Procedure, or CBP) rather than the premises (Premise-Based Procedure, or PBP)—is the standard first-order response.

  However, for a PolSci PhD chapter, "just vote on the conclusion" is insufficient because it treats the dilemma as a technical glitch rather than a structural tension in democratic theory. Your supervisor is pushing you because the dilemma isn't about *mistakes*; it's about a trade-off between **collective consistency** and **collective accountability**.

  Here is how you need to reframe this for your modeling and your chapter.

  ### 1. Correcting the Sincerity Misunderstanding
  First, a quick technical correction that will help your modeling: The dilemma does **not** require strategic or insincere voting. It arises even under perfect sincerity.

  If I sincerely believe $P$ (Research is good) and $Q$ (Teaching is good), and I accept the rule $P \land Q \to R$ (Hire), I will vote Yes on $P$, Yes on $Q$, and Yes on $R$. The paradox arises because the *aggregation function* (majority rule) applied to the premises yields a different collective outcome than the aggregation function applied to the conclusion.
  *   **PBP:** Majority on $P$ + Majority on $Q \to$ Collective $R$.
  *   **CBP:** Majority on $R$ directly.

  The "bite" isn't that people are lying; it's that **majority rule is not distribution-neutral.** It matters *where* you apply the majority threshold. So, this isn't an artifact of strategic voting; it's an impossibility theorem regarding judgment aggregation (related to List & Pettit's "Impossibility Theorem for Judgment Aggregation").

  ### 2. Why Would Any Committee Vote on Premises?
  You asked: *"Why would any committee ever do it the other way round?"* This is the million-dollar question. If CBP avoids the inconsistency, why does PBP exist in the real world (e.g., courts, tenure committees, legislatures)?

  **A. Accountability and Reason-Giving**
  If you vote only on the conclusion ("Hire/Don't Hire"), the decision is opaque. If a candidate is rejected under CBP, they don't know if it was because of research, teaching, or service. They cannot improve.
  *   **Institutional Design Implication:** PBP forces the group to go on record regarding *reasons*. This creates a public transcript that allows for external review. In a tenure committee, if you vote on the conclusion, you can hide bias behind a black box. If you vote on premises, you must admit, "We think the research is weak."

  **B. Integrity and Constraint on Power**
  PBP binds the committee to its own stated principles. If the rule is "Research AND Teaching," but the majority wants to hire a friend who is weak on teaching, CBP allows them to just vote "Hire." PBP forces them to either lie on the premise (which is detectable if reasons are required) or follow the rule.
  *   **Institutional Design Implication:** PBP sacrifices logical consistency in the *single case* to preserve the integrity of the *rule* over time.

  **C. Precedent and Diachronic Rationality**
  This is the List & Pettit argument. A committee isn't a one-off game; it's a continuing agent.
  *   If you use CBP to avoid the paradox today, you might set a precedent that contradicts a premise-based decision you made yesterday.
  *   **Example:** Today you hire Candidate A (CBP) despite weak teaching. Tomorrow you fire Candidate B (PBP) for weak teaching. The group looks arbitrary.
  *   **The Trade-off:** PBP ensures the group is rational *across time* (consistent application of rules), even if it produces an "irrational" result in a specific case (rejecting someone the majority wants). CBP ensures the group gets what it wants *now*, but risks looking arbitrary *later*.

  ### 3. Does Deliberation Solve It?
  You suggested: *"If we deliberated long enough to converge... wouldn't it just disappear?"*

  Deliberation can resolve the dilemma by aligning judgments (making the profile single-peaked or consistent), but you cannot model deliberation as a guarantee.
  *   **Cost:** Deliberation is expensive (time, political capital).
  *   **Persistent Disagreement:** In deep pluralism, people agree on the conclusion for *different reasons*. (e.g., Member 1 votes Hire because Research; Member 2 votes Hire because Teaching). They agree on $R$, but disagree on $P$ and $Q$. The dilemma re-emerges when you try to write the justification for the hire.
  *   **Modeling Angle:** You can model deliberation as a cost function. The dilemma persists when the cost of reaching consensus on premises exceeds the cost of accepting the inconsistency.

  ### 4. Practical Upshot for Your Chapter
  To satisfy your supervisor and make the chapter substantive, move beyond "Vote on Conclusion." Instead, argue that the Discursive Dilemma reveals a **trilemma** for committee design. You generally have to sacrifice one of the following:
  1.  **Consistency** (No logical contradictions in outcomes).
  2.  **Responsiveness** (The outcome matches the majority's will on the specific case).
  3.  **Accountability** (The decision is based on public, principled reasons).

  **CBP** sacrifices Accountability (and potentially Integrity) to save Consistency and Responsiveness.
  **PBP** sacrifices Consistency (in the specific case) to save Accountability and Integrity.

  **Recommendations for Committee Structure:**
  1.  **Sequential Voting with Feedback:** Vote on premises first. If the premise vote implies a conclusion that contradicts a direct vote on the conclusion, trigger a mandatory deliberation phase. This models the "cost" of the dilemma.
  2.  **Special Majorities:** Require a supermajority on premises to bind the conclusion. This reduces the probability of the paradox occurring (as the threshold for $P$ and $Q$ becomes harder to meet independently than $R$).
  3.  **The "Opinion" Requirement:** Require that the majority coalition must be able to sign a single justification. If the majority for hiring is a coalition of different premise-majorities (a "doctrinal coalition"), the hire is invalid. This forces the group to find a *common reason*, not just a common outcome.

  ### Summary for your Supervisor
  You can tell your supervisor:
  > "I initially thought the dilemma was an artifact of insincere voting or solvable by switching to conclusion-based voting. But I've come to see that premise-based voting serves a distinct normative function: it prioritizes **diachronic rationality** and **accountability** over **synchronic consistency**. The dilemma isn't a bug to be fixed by CBP; it's a structural exposure of the tension between getting the 'right' result today and maintaining a consistent rule of law for tomorrow. My chapter will model the conditions under which a committee should accept the risk of the paradox to preserve the integrity of its criteria."

  That moves you from "I found a workaround" to "I understand the institutional trade-off." That's PhD-level work.
