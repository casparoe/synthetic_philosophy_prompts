answer: |-
  TO: Graduate Medical Education Committee
  FROM: [Your Name], Committee Member
  DATE: [Date]
  SUBJECT: Recommendation Regarding Vendor Assessment Package

  At Thursday's meeting, we will vote on whether to replace our current criteria-referenced rotation assessments with a vendor package that ranks residents against one another. After reviewing the pilot data and considering the structural implications of this change, I recommend that we reject the vendor package as proposed. Instead, I propose we retain our current criteria-referenced system while launching a targeted review to improve its sensitivity for identifying struggling residents.

  We must give the vendor's case a fair hearing. Their argument is pragmatic. Our current system relies on narrative comments and binary pass/fail markers that often lack granularity. It is plausible that program directors miss early signs of struggle until a major incident occurs. The vendor's tool promises objectivity through data, claiming to surface issues months earlier than human review. There is also the uncomfortable possibility that our current system is hypocritical. Attendings likely compare residents to one another in their heads anyway; the vendor package simply makes this explicit. If we are already ranking residents informally, formalizing the process could reduce bias and ensure everyone gets the same scrutiny. Furthermore, the philosophical framework my colleague introduced describes how institutions function; it is a descriptive account, not a moral verdict. Knowing that a system exerts disciplinary power does not automatically mean we should abolish it. We need power to train competent physicians. The question is whether this specific mechanism serves our educational mission.

  However, the shift from measuring residents against a standard to measuring them against a cohort is not merely a technical adjustment; it changes the nature of the judgment. The argument here concerns normalization. In our current system, the goal is to meet a fixed standard of competence. In the proposed system, the goal is to avoid being in the bottom quartile of the group. This distinction matters because these techniques are productive, not just repressive. They do not simply punish bad behavior; they shape behavior by defining what is normal.

  When we make residents continuously observable and comparable, we encourage them to optimize for the metric rather than the standard. If the cohort is weak, a resident can be "normal" while still being unsafe. If the cohort is strong, a competent resident may be flagged as deficient. More importantly, this system produces self-regulating subjects. Residents will learn to manage their dashboard scores rather than focusing solely on patient care. The automated flag triggers a conversation that is officially non-punitive, but the knowledge that one is being watched and ranked changes how one acts. This is the core of disciplinary power: it works best when the subject polices themselves to fit the norm.

  Understanding this mechanism does not forbid us from using data. But it requires us to ask if we want a system that produces conformity to a peer group or competence against a professional standard. The vendor's package assumes the peer group is the valid reference point. I believe this is incorrect. Our duty is to ensure residents meet the standards of the profession, not that they beat each other. The descriptive framework tells us that this tool will exert control by making residents comparable. It does not tell us that control is inherently evil, but it does require us to justify why this specific form of control is necessary. Given that we can identify struggling residents through improved criteria and better faculty training, the added risk of shifting to norm-referencing is not justified.

  I could be wrong about this. If evidence emerges that our current criteria-referenced system is fundamentally incapable of identifying struggling residents despite faculty training, and if norm-referencing is the only viable alternative to patient harm, then my position would need to change. I am also willing to concede that our current narrative system may already be performing this normalization work covertly. If we find that narrative comments are simply coded rankings, we should fix that honesty gap without adopting a tool that hardwires the comparison into the evaluation engine.

  Therefore, I propose the following course of action. We should not adopt the vendor package. Instead, we should task the Clinical Competency Committee with a six-month review of all narrative assessments from the past year to identify where struggling residents were missed. We will use that data to refine our existing criteria and provide faculty development on writing actionable feedback. We will revisit the question of vendor tools only if this internal review proves that criteria-referenced assessment cannot meet our safety needs.

  **Motion:**
  I move to reject the proposal to adopt the vendor assessment package in its current form. I further move to establish a subcommittee charged with reviewing current assessment data over the next six months to identify gaps in resident identification, with the goal of refining our existing criteria-referenced system before considering external normative tools.
