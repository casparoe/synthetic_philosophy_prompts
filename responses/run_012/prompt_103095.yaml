          *   *Nyāya:* The knowledge is "This is the *referent* of that word." Inference gives you "This is a cloud." Testimony gave you "Words mean X." Upamāna gives you "This object = That word."
          *   *Buddhist:* That equation is an inference.
          *   *Nyāya:* It's immediate recognition.
          *   *Buddhist:* Recognition is memory-perception hybrid.
          *   *(Self-Correction)*: Make sure the Buddhist doesn't just say "It's inference" but explains *why*. The link between word and object is established by convention (inference about social usage).
          *   *Śabda/AI:*
