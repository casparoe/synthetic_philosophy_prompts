answer: |-
  **Setting:** *A university seminar room, late afternoon. Sunlight cuts across a table littered with books, tablets, and half-empty coffee cups. Two philosophers, Vatsya (Nyāya) and Prajna (Buddhist Logician), are winding down a lecture.*

  **Vatsya (Nyāya):** You're being parsimonious to the point of starvation, Prajna. You want to feed the human mind on only two courses: Perception and Inference. But experience is a banquet.

  **Prajna (Buddhist):** And yet, when we analyze the menu, every dish turns out to be either ingredients we tasted directly or a recipe we deduced. Why invent new kitchens? Your *Upamāna* and *Śabda* are just *Pratyakṣa* and *Anumāna* wearing masks.

  **Vatsya:** Masks imply deception. These are distinct faculties. Let's start with *Upamāna*. Comparison. You always reduce it to inference, but the cognitive event is different.

  **Prajna:** Show me. And please, spare me the *gavaya*. I know the forest cow story by heart.

  **Vatsya:** Fine. Let's talk about the "Velvet Ant."

  **Prajna:** Which is a wasp.

  **Vatsya:** Precisely. Imagine a student, let's call her Ananya. She's never been to the American Southwest. She's never seen a Velvet Ant. A mentor tells her: "A 'Velvet Ant' is a creature that looks like a large, fuzzy ant, but it's actually a wasp." Ananya knows what ants look like. She knows what wasps look like. She stores this. Months later, she's hiking in Arizona. She sees a creature on the trail. Instantly, she thinks: *"Ah, so that is what they meant by 'Velvet Ant'."*

  **Prajna:** Okay. Where is the magic?

  **Vatsya:** In that "Ah." What *pramāṇa* generated that knowledge?

  **Prajna:** Perception, obviously. She sees the creature. The visual data hits her retina.

  **Vatsya:** Perception tells her "There is a fuzzy, ant-like wasp." It does not tell her "This is the referent of the word 'Velvet Ant'." That link requires memory of the mentor's statement.

  **Prajna:** So it's Perception plus Memory. Still not a third *pramāṇa*.

  **Vatsya:** It's not just memory. It's the *application* of the name to the object based on similarity. If it were just inference, she would have to reason: "All things that look like fuzzy ants in this region are called Velvet Ants. This looks like a fuzzy ant. Therefore, this is a Velvet Ant." But she doesn't reason. She *recognizes*. The knowledge of the relation between the word and the object arises immediately upon seeing the similarity.

  **Prajna:** "Immediately" is a description of speed, not ontology. Just because a calculation happens fast doesn't mean it isn't a calculation. When she sees the wasp, she perceives the form. That form triggers a mental trace (*vāsanā*) of the mentor's description. She infers identity. "This matches the description." That is inference (*anumāna*). The major premise is the linguistic convention she learned earlier.

  **Vatsya:** But inference requires a universal connection (*vyāpti*) known beforehand. Did Ananya know beforehand that "Looking like a fuzzy ant" is universally connected to "Being called a Velvet Ant"? No. She learned a *definition*. *Upamāna* is the knowledge of the relation between a name and a thing (*saṃjñā-saṃjñī-sambandha*). Inference gives you facts about the world. *Upamāna* gives you the key to the dictionary of the world.

  **Prajna:** But the dictionary was written by testimony! Her mentor spoke. That was *Śabda*. She inferred the mentor was reliable. Now she perceives the object. She infers the match. You're slicing a single cognitive stream into artificial chunks and giving each a name. Why? What work is *Upamāna* doing that Perception and Inference can't?

  **Vatsya:** It validates the *similarity* itself as a source of knowledge. Perception sees *this* object. Memory recalls *that* description. *Upamāna* is the bridge that says "The similarity *is* the knowledge." Without it, she's just looking at a wasp and remembering a sentence. With it, she understands the *naming convention*.

  **Prajna:** I'll concede the phenomenology feels distinct. But ontologically? It collapses. If the mentor lied, and it wasn't a wasp but a robot, her *Upamāna* fails. Why? Because her inference about the mentor's reliability was wrong. If the light is dim and she misidentifies the fuzz, her *Upamāna* fails. Why? Because perception was flawed. The validity conditions of *Upamāna* are entirely dependent on the validity conditions of Perception and Inference. A dependent variable isn't a separate source.

  **Vatsya:** (Pauses, sips coffee) You're treating knowledge like a supply chain. I'm treating it like an ecology. But fine. Let's say you win on the wasp. The real battleground is *Śabda*. Testimony. And I have a case your 7th-century logic won't cover.

  **Prajna:** Try me.

  **Vatsya:** Ananya asks an AI assistant: "What is the capital of Burkina Faso?" The AI says: "Ouagadougou." Ananya has no idea how the AI works. She doesn't know the training data. She just accepts it. She now knows the capital. Is this *Śabda*?

  **Prajna:** (Smiles) That's the trap, isn't it? For Nyāya, *Śabda* requires an *āpta*. A reliable person. Someone who *knows* the truth and *intends* to tell it.

  **Vatsya:** Correct.

  **Prajna:** The AI has no mind. It has no knowledge. It predicts tokens based on statistical weights. It has no intention (*tātparya*). It doesn't care if Ouagadougou is the capital. So, by your own definition, this cannot be *Śabda*.

  **Vatsya:** I'm not ready to concede that.

  **Prajna:** If it's not *Śabda*, what is it? If you accept the answer as knowledge, you must have a *pramāṇa*. If it's not Testimony, it must be Inference. You see the text on the screen. You infer: "This system has been reliable in the past. Therefore, this text is likely true." That is pure inference.

  **Vatsya:** But I don't run that inference. I just read it. It feels like testimony. I'm engaging with language.

  **Prajna:** Feelings aren't epistemology. If you buy a thermometer and it says 30 degrees, you infer the temperature. You don't say the thermometer *testified* to you. The AI is a linguistic thermometer.

  **Vatsya:** But a thermometer measures a physical causal chain. Language conveys *meaning*. When the AI says "Ouagadougou," it's not just a causal signal like smoke indicating fire. It's a semantic unit. I understand the sentence.

  **Prajna:** You understand it because *you* have the capacity for language. The AI is just a mirror. The knowledge resides in the humans who created the training data. They were the *āptas*. You are inferring that the AI accurately reflects their knowledge.

  **Vatsya:** That makes the epistemology of the modern world impossible. I can't verify the chain of humans behind the AI. If *Śabda* requires tracking the original knower's intention, I can never learn from a book, a recording, or a server.

  **Prajna:** Exactly! That's my point. *Śabda* as you define it—a direct transmission of truth from a knowing mind to a trusting mind—is a myth. It's always inference. You infer the book is reliable. You infer the server hasn't been corrupted. You infer the words map to reality.

  **Vatsya:** You're reducing language to noise. Nyāya says words have a power (*śakti*) to convey meaning directly. When I hear "Fire," I don't infer fire. I grasp the meaning. With the AI, the *structure* of the testimony is intact, even if the *agent* is synthetic. We can update Nyāya. The *āpta* isn't the speaker; it's the *source of the information*.

  **Prajna:** Now you're changing the definition mid-debate. If the *āpta* is just "the source," then a tree ring is an *āpta*. It tells you the age of the tree. Is reading tree rings *Śabda*?

  **Vatsya:** Don't be obtuse. Tree rings don't use language.

  **Prajna:** And the AI doesn't *know*. It uses syntax without semantics. It's a Chinese Room. If you accept AI output as *Śabda*, you sever testimony from truth. You make *Śabda* about social utility, not knowledge.

  **Vatsya:** I make it about *social epistemology*. Knowledge is distributed. The AI is a node in the human knowledge network. When I query it, I am querying the network. The *pramāṇa* is the linguistic interaction itself, which preserves truth conditions regardless of the immediate psychological state of the transmitter.

  **Prajna:** That's a beautiful sociological claim. But epistemologically? It's weak. If the AI hallucinates, it lies without intent. If you believe it, you have false belief. If you believe it when it's right, you have true belief. What distinguishes the *process* from guessing?

  **Vatsya:** The process relies on the convention of language.

  **Prajna:** Conventions are inferences about how people use sounds. You're back to Inference.

  **Vatsya:** (Leans back) So, for you, there is no such thing as trusting a voice? It's always calculating odds?

  **Prajna:** Trust is a heuristic for inference. "I trust my mother" means "My inference model assigns high probability to her statements based on past data."

  **Vatsya:** And that's why your philosophy is so lonely, Prajna. You live in a world of solitary calculators. Nyāya lives in a world of speakers and listeners. The AI case breaks my definition of *āpta*, I admit. A machine cannot be a "reliable person." But if I say it's just Inference, I lose the immediacy of understanding language.

  **Prajna:** And if I say it's Testimony, I have to grant knowledge to a script.

  **Vatsya:** Perhaps the AI case shows *Śabda* isn't about the speaker's mind, but about the *listener's competence*.

  **Prajna:** Now you sound like a Prābhākara Mīmāṃsaka.

  **Vatsya:** I'm a Nyāya pragmatist. If the student learns the capital of Burkina Faso, knowledge happened. If you can only explain it by saying she "inferred it from text," you're describing the mechanism, not the experience. *Śabda* names the experience of learning from another. Even if the "other" is a ghost in the machine.

  **Prajna:** And I say we shouldn't name ghosts. We should explain the machine. If we call it Inference, we stay alert. We check the weights. We verify the source. If we call it *Śabda*, we get lazy. We treat the output as revelation.

  **Vatsya:** Or, we recognize that we are dependent beings. We *need* testimony to function. Reducing it to inference doesn't make us safer; it just makes the map more complicated without changing the terrain.

  **Prajna:** (Gathers papers) The terrain is all there is, Vatsya. The map is where you're adding extra lines.

  **Vatsya:** And without those lines, you can't find your way home.

  *(They pack up in silence, neither fully convinced, the sun having moved off the table.)*
