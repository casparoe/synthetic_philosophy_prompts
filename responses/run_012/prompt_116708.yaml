  2. The marginal-impact reply smooths the discrete threshold into a probability distribution, arguing that while the realized loss may be zero, the expected loss contribution (burn cost) is positive. The fudge here is replacing the binary reality of the threshold with a continuous risk price, asserting that incurring the expected cost matters even if the claim never triggers.

  3. The complicity reply translates to an underwriting restriction rather than a loss calculation, asserting that binding coverage on this exposure violates risk appetite regardless of its profitability or loss ratio. This avoids the attribution problem by declaring the hazard uninsurable ex ante, though it fudges the distinction between financial risk limits and moral prohibitions.

  4. The collective-action reply treats individual decisions as correlated variables that shift the entire portfolio exceedance probability curve rather than acting as independent exposure units. It requires capital allocation against the systemic risk of the generalized practice, but fudges by assuming the individual agent has control over the portfolio's correlation structure.

  5. The residue is that "wrong" assigns a negative value to the existence of the exposure itself, whereas my framework only prices the manifestation of the risk. The verdict is that my framework is missing something real: actuarial science can price a harmful pool accurately, but it lacks the vocabulary to declare that the pool itself should not be written regardless of the expected loss.
