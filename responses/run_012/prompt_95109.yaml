prompt: |-
  Ok so I'm taking this ethics-and-history module and for the assessment I have to hand in a research proposal for my term paper (6000 words, one semester). I've got a half-formed idea and I'd like you to turn it into the actual proposal.

  The idea: when someone waves off a historical figure with "he was a man of his time", everyone treats it as one kind of claim — either a sneaky bit of moral relativism or a claim that the person just couldn't have known better. I think that lumps together three different things that should be pulled apart. (a) the person literally didn't have the concept — no word or idea for the wrongness existed for them; (b) they had the concept but it was practically unavailable, because nobody around them had worked it out, there was no shared vocabulary for it, no social support for acting on it; (c) they had full access and simply faced a big social cost for acting on it. My hunch is that only (a) and maybe a weak form of (b) actually excuse, and that the whole presentism-vs-relativism fight never notices it's mashing these together.

  Then I want to stress-test it rather than just assert it. Nearly all the obvious examples are about slavery and race, which I think has made the debate lazy. So I want to also run the framework on at least one case that isn't about race or slavery — how people treated animals, say, or the mentally ill, or children, or the natural world — where the man-of-his-time move feels different, and see whether my three-way split still earns its keep or just collapses.

  What I need the proposal to do: state the question precisely enough that it has a definite answer; explain why the existing positions on the defence leave it open; lay out what I'd actually do month by month; say why this angle rather than the obvious alternatives; and be honest about what a good result looks like and what would count as the project failing. Keep the scope realistic for one semester — if its too big, cut it and tell me what you cut.

  Don't give me citations or a reading list, I'll fill those in myself. And be upfront about which bits of this are settled vs. genuinely contested among people who actually work on it — don't just tell me my framing is the consensus if it isn't.
