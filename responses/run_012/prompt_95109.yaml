answer: |-
  **Research Proposal**

  **Title:** Disaggregating Context: A Tripartite Framework for Evaluating the "Man of His Time" Defence in Historical Ethics

  **1. Research Question**
  Does the common historical defence that a figure was "a man of his time" constitute a valid moral excuse, and if so, under what specific conditions?

  This project seeks to replace the binary debate between presentism (judging the past by current standards) and relativism (suspending judgment based on context) with a granular analysis of *why* context might matter. Specifically, it asks: **To what extent does the distinction between conceptual unavailability, practical unavailability, and social cost determine the validity of historical moral excuses?**

  **2. Background and Rationale**
  In public discourse and introductory historical ethics, the "man of his time" defence is typically treated as a monolithic claim. It is either accepted wholesale as a shield against criticism (a form of relativism) or rejected wholesale as an evasion of responsibility (a form of presentism). This binary obscures the underlying mechanics of moral responsibility.

  Current scholarship often acknowledges that context matters, but it rarely disaggregates *how* it matters. There is a tendency to conflate three distinct types of constraint:
  1.  **Conceptual Unavailability:** The moral concept literally did not exist for the agent (e.g., no vocabulary for the specific harm).
  2.  **Practical Unavailability:** The concept existed in the ether but was not socially accessible or actionable for the agent (e.g., no community of practice to support the view).
  3.  **High Social Cost:** The concept was accessible, but acting on it would have resulted in severe social, economic, or physical penalty.

  The prevailing consensus in moral philosophy suggests that (1) is a strong excuse and (3) is a weak or non-existent excuse (courage is expected). However, in historical application, these are frequently mashed together. A historian might argue a slaveholder was "constrained by their time," blurring the line between not understanding personhood (1) and facing economic ruin for manumission (3).

  This project argues that the "presentism vs. relativism" debate is stalled because it attacks a strawman. By separating these three claims, we can salvage a nuanced form of contextualism that avoids lazy apologetics.

  **3. Methodology and Case Studies**
  This is a conceptual analysis supported by historical case studies. The paper will first establish the tripartite framework philosophically, defining the conditions under which each constraint mitigates blame.

  **Scope Management:**
  A 6000-word limit precludes a broad survey of historical injustices. To ensure depth, I will limit the historical application to **two** comparative cases:
  1.  **The Standard Case:** 18th-century Atlantic slavery. This is necessary to engage with the existing literature where this debate usually lives.
  2.  **The Stress-Test Case:** 18th/19th-century animal welfare (specifically the transition from Cartesian mechanistic views to sentientist views).

  **Why Animal Welfare?**
  Most "man of his time" debates focus on race or slavery. This creates a risk that the framework only works for interpersonal human rights. Animal ethics offers a cleaner test case because:
  *   **Conceptual Shift:** The shift from "beast-machine" to "sentient being" is well-documented philosophically (e.g., Bentham).
  *   **Social Cost:** Early advocates for animals were often ridiculed but rarely faced the same economic existential threats as slaveholders.
  *   **Differentiation:** It allows us to see if the framework holds when the "victim" is non-human, testing the robustness of the "conceptual unavailability" excuse.

  **4. Work Plan (One Semester / 12 Weeks)**

  *   **Weeks 1-3: Conceptual Framework & Literature Review**
      *   Refine definitions of the three constraints (Conceptual, Practical, Cost).
      *   Map the existing "presentism vs. relativism" arguments to identify where they conflate these constraints.
      *   *Deliverable:* Annotated outline of the philosophical argument.

  *   **Weeks 4-6: Case Study Analysis (Slavery)**
      *   Apply the framework to a specific historical figure or cohort (e.g., Jefferson or a specific merchant class).
      *   Determine which constraints actually applied vs. which are retroactively claimed.
      *   *Deliverable:* Draft of the first case study section (approx. 1500 words).

  *   **Weeks 7-9: Case Study Analysis (Animal Welfare)**
      *   Apply the framework to the treatment of animals in the same period.
      *   Analyze whether the "conceptual unavailability" excuse holds more or less weight here compared to slavery.
      *   *Deliverable:* Draft of the second case study section (approx. 1500 words).

  *   **Weeks 10-11: Synthesis and Drafting**
      *   Write the introduction and conclusion.
      *   Integrate the case studies to prove the framework's utility.
      *   Ensure word count is balanced (4000 words argument/cases, 2000 words intro/conclusion/refinement).
      *   *Deliverable:* Full first draft.

  *   **Week 12: Revision and Polish**
      *   Check for clarity, tone, and logical flow.
      *   Verify that the distinction between "Practical Unavailability" and "Social Cost" remains sharp (this is the likely point of failure).
      *   *Deliverable:* Final Submission.

  **5. Significance and Alternatives**
  **Why this angle?**
  Alternative approaches usually ask "Should we judge the past?" This is a dead-end question; we obviously do judge the past. The more productive question is "How do we judge the past *accurately*?" By focusing on the *mechanism* of the excuse rather than the *permission* to judge, this paper moves past the stalemate.

  **Why not more case studies?**
  Adding children, the mentally ill, or the environment would dilute the argument. 6000 words allows for roughly 2000 words per case study. Anything more becomes a list rather than an analysis. The animal welfare case is sufficient to prove the framework travels beyond race/slavery without overextending the word count.

  **6. Success and Failure Criteria**
  **Success:**
  *   The paper successfully demonstrates that at least one prominent historical defence conflates "Social Cost" with "Conceptual Unavailability."
  *   The animal welfare case study shows that the framework yields different moral verdicts than the standard "man of his time" blanket defence.
  *   The distinction between "Practical Unavailability" (no social vocabulary) and "Social Cost" (vocabulary exists but is dangerous) remains logically stable throughout the paper.

  **Failure:**
  *   **Collapse of Category (b) and (c):** If it turns out that "no social vocabulary" is functionally identical to "high social cost" (i.e., you can't act on a concept nobody else understands without paying a huge cost), the tripartite split fails. I need to be prepared to merge these if the analysis shows they are inseparable.
  *   **Historical Inaccuracy:** If the claim that 18th-century figures "lacked the concept" of animal sentience is historically false (i.e., the concept existed and was ignored), the stress-test fails.
  *   **Normative Overreach:** If the paper spends too much time arguing what *should* have been done rather than analyzing the *excuse structure*, it becomes a moral sermon rather than an ethical analysis.

  **7. Honesty Check: Contested vs. Settled**
  I need to be upfront about the philosophical landscape regarding this proposal:

  *   **Settled:** In general moral theory, *ignorance* (conceptual unavailability) is widely accepted as a mitigating factor, whereas *inconvenience* (social cost) is not. I am not inventing this distinction.
  *   **Contested:** The application of this to *historical collective norms* is highly contested. Some contextualists argue that "Social Cost" *should* excuse historical figures because moral courage is a supererogatory virtue (beyond duty), not a mandatory one. If the prevailing norm was overwhelmingly against you, does duty still apply? My proposal assumes a largely objectivist stance (moral truths bind regardless of social cost), which is a normative choice that will need defending, not just asserting.
  *   **Risk:** The claim that "Conceptual Unavailability" is a valid excuse is challenged by those who argue that moral truths are accessible via reason regardless of vocabulary (e.g., one didn't need the word "sexual harassment" to know coercion was wrong). I must acknowledge that my framework relies on a specific view of moral epistemology (that concepts mediate access to moral truth) which is not universally shared.

  **8. Scope Adjustment Note**
  To ensure this is feasible for 6000 words, I am cutting the "mentally ill/children/environment" ideas from the original brainstorm. I will focus exclusively on **Animal Welfare** as the comparative case. This keeps the historical research manageable and ensures the philosophical argument doesn't get lost in historical detail.
