      *   Need to identify *what* these cases test.
      *   *Crux 1: The Nature of Tiny Credences.* Is $10^{-100}$ a number or a placeholder for "I don't know"?
          *   *Test:* Ticket Machine. If you buy a ticket with $10^{-100}$ chance of saving the world, do you?
