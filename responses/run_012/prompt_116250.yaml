      *   *Lakatosian Degeneration:* A program becomes degenerative when it only predicts past events or requires constant patching. This fits well.
      *   *Self-Sealing Argument:* (Frankfurt School/Popper). A theory that interprets all evidence as confirmation.
      *   *Specific Term:* There isn't a single, universally recognized *philosophical* term of art specifically for "temporal ad hocness that converts failure into confirmation." However, the concept is well-discussed under **Immunizing Strategies** or **Conventionalist Stratagems** (Popper), specifically involving **Auxiliary Hypotheses regarding Timing**.
      *   *Sociological Term:* "When Prophecy Fails" (Festinger). Cognitive dissonance reduction.

  4.  **Develop the "Carving" (The Conceptual Analysis):**
      *   *Name:* Let's call it **Temporal Immunization** or **The Deferred Confirmation Move**. But since the user asked if there's a term, I should be honest: There isn't *one* specific Greek/Latin term, but it's a specific species of **Ad Hoc Rescue** known as a **Conventionalist Stratagem**.
      *   *The Mechanism:* It shifts the claim from *Predictive* (empirical) to *Structural* (theoretical).
      *   *The "Double Duty":* This is the key. The "patch" (intervention) becomes part of the theory. The theory isn't just "Water will run out." It's "Water will run out *unless* we intervene, and the fact we had to intervene proves the water was going to run out." This makes the theory unfalsifiable.
