      *   Respect the "Plain American English" constraint.
      *   Ensure the "Weakest Reasoning" section is genuine, not feigned humility.

  8.  **Final Review against constraints:**
      *   Did I answer if there's a term? (Yes, mostly no, but here are the closest).
      *   Did I carve the concept? (Yes).
