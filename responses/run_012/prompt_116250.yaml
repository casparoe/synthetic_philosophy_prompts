  2.  **Deconstruct the Phenomenon:**
      *   *Core Mechanism:* Moving the goalposts on time while claiming the goal hasn't changed.
      *   *Epistemic Move:* Converting a falsifiable empirical claim (Event by Time $T$) into a non-falsifiable structural claim (Event is inevitable).
      *   *The "Double Duty" Aspect:* The delay is explained by intervention (patching), which validates the threat (pressure was real). This is a "Heads I win, tails you lose" situation regarding the *threat*, even if the *timing* was wrong.
      *   *Comparison Points:*
          *   *Popper:* Falsification. This avoids falsification.
          *   *Lakatos:* Protective belt vs. hard core. This looks like modifying the protective belt (auxiliary hypotheses about timing/technology) to save the hard core (the theory of scarcity/collapse).
