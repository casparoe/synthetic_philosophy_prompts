      *   *Nuance 1:* Models *are* probabilistic. Maybe "2020" was a median estimate, not a hard deadline. Hydrologists know confidence intervals. If the public hears "2020" but the model meant "2020 +/- 10 years," is it a rescue or just communication noise?
