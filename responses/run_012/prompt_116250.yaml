          3.  **The Vagueness Distinction:** Initial specificity vs. retroactive vagueness.
      *   *Lakatos Connection:* Yes, it's a sign of a degenerating research program if *all* they do is push dates. But if the "patch" leads to new insights (e.g., efficiency tech), it might still be progressive.
      *   *Self-Critique (The "Weakest Link"):*
          *   *Communication vs. Deception:* Did the scientist mean "2020" or did the media?
          *   *Probabilistic Nature:* Hydrology isn't physics. Confidence intervals matter.
          *   *Value of the Core:* Is the "hard core" (resources are finite) worth saving even if the "belt" (dates) is wrong?
      *   *Conclusion:* Summarize the epistemic sin.

  7.  **Refining the Tone:**
