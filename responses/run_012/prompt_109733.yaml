answer: |-
  Your hypothesis is astute and captures the primary source of the stagnation. You are correct that the debate has shifted from a dispute about moral psychology to a dispute about the **criteria of adequacy for a semantic theory** and the **explanatory priority of logic versus practice**. However, characterizing the dispute as merely "verbal" or as "answering different questions" understates the substantive philosophical clash that keeps the deadlock in place.

  Here is the diagnosis of the structure of the dispute, an evaluation of your subsidiary questions, and an assessment of where progress lies.

  ### 1. The Core Diagnosis: Explanatory Priority, Not Just Definition

  Your hypothesis identifies the symptom (different standards of success) but the underlying disease is a clash of **explanatory priority**.

  *   **The Critic's Priority:** Logic and Semantics are prior to Use. For an argument to be valid, its validity must be grounded in the truth-conditions of its constituents. If a sentence lacks truth-conditions (because it expresses an attitude), it cannot logically interact with sentences that do (or with itself in embedded contexts) in the way classical logic requires. Therefore, a theory of meaning *must* assign truth-conditions to explain validity.
  *   **The Expressivist's Priority:** Use and Practice are prior to Logic and Semantics. Logic is a formalization of our inferential practices. If our practice treats moral sentences as premises and conclusions, then they *have* logical properties, regardless of whether they map onto facts. The job of the theory is not to find the facts that ground the logic, but to explain how the psychology of attitudes can mimic the structure of truth-conditional logic.

  The stalemate occurs because the Expressivist offers a **functionalist** account of meaning (meaning is defined by the role in inference), while the Critic demands a **representationalist** account (meaning is defined by correspondence/conditions).

  When the Expressivist says, "We have reconstructed validity," they mean: "We have shown that holding these attitudes is inconsistent in a way that mirrors logical inconsistency."
  When the Critic says, "You have not solved the problem," they mean: "You have shown psychological inconsistency, not logical validity. You have changed the subject."

  This is not merely verbal. It is a substantive disagreement about whether logic is a normative constraint on thought that requires truth-bearers, or a descriptive generalization of linguistic behavior that does not.

  ### 2. Addressing the Subsidiary Questions

  **Is the dispute partly verbal?**
  Yes, but disambiguation does not dissolve it.
  If we agree to define "meaning" as "truth-conditions," Expressivism is trivially false. If we define "meaning" as "use," Expressivism is trivially true. The debate persists because both sides claim their definition is the one that captures what *matters* for logic.
  The ambiguity lies in the word **"validity."**
  *   **Critic:** Validity = Truth-preservation.
  *   **Expressivist:** Validity = Consistency of commitment.
  The Expressivist argues that "truth-preservation" is just a realist façon de parler for "consistency of commitment." The Critic argues that "consistency of commitment" only makes sense if we presuppose the truth-conditional structure we are trying to explain.
  **Verdict:** The verbal dispute is a proxy for a substantive one. Even if we disambiguate, the Expressivist still has to prove that "consistency of commitment" is sufficient to ground the normativity of logic. The Critic denies this is possible without smuggling in truth-conditions.

  **Are they answering different questions?**
  Yes, but the Expressivist claims their answer subsumes the Critic's question.
  *   **Critic:** "What is the semantic value of the antecedent?" (Looking for an object/proposition).
  *   **Expressivist:** "What is the state of mind of someone who accepts the antecedent?" (Looking for a psychological type).
  The Expressivist strategy (Quasi-Realism) is to argue that the Semantic question is a illusion generated by the surface grammar of language. They claim that once you answer the Psychological/Pragmatic question fully, the Semantic question disappears (or is answered deflationarily).
  **Verdict:** The disagreement is about whether the Semantic question is legitimate. The Critic insists it is; the Expressivist insists it is a category mistake. This confirms your suspicion that they are measuring success by different standards, but it highlights that the Expressivist is making a revisionary metaphysical claim, not just a semantic one.

  ### 3. Where the Hypothesis Needs Correction: The Deflationary Pivot

  You suggest the disagreement is about whether deflationary truth can bear the weight Expressivists place on it. This is the crux, but you underestimate the Critic's specific objection here.

  The problem is not just that deflationary truth is "thin." The problem is **circularity**.
  To explain why "Lying is wrong" and "Lying is not wrong" are inconsistent, the Expressivist must define a relation between attitudes (e.g., being *for* something vs. being *against* it). But to ensure this relation maps onto logical negation and validates *Modus Ponens*, the Expressivist must structure these attitudes using logical operators.
  *   **The Critic's Charge:** You are using logic to explain logic. You define the attitude of "disapproval" using the very logical constants (negation, implication) you are trying to justify for moral sentences.
  *   **The Implication:** The Expressivist cannot generate the logic of moral language from non-cognitive attitudes alone; they must build the logic into the attitudes *ex ante*. If they do that, they have essentially conceded that moral thoughts have propositional structure, which undermines the core non-cognitivist claim.

  This is why the debate doesn't move. The Expressivist keeps refining the psychology (hybrid views, norm-expressivism) to accommodate the logic, while the Critic keeps pointing out that the accommodation requires the very propositional structure Expressivism denies.

  ### 4. What Counts as Progress?

  Do not expect a "solution" in the sense of one side conceding. The positions are reflective of deeper temperamental divides in philosophy (naturalism/pragmatism vs. platonism/realism). However, progress can be made in clarifying the **costs** of each view.

  **A. Formal Results (The Expressivist Burden)**
  Progress would look like a formal semantics for expressivism that is **non-ad hoc**.
  Currently, Expressivists often construct a logic that works for moral sentences but looks suspiciously like classical logic with the labels changed. A genuine breakthrough would be a formal system that derives classical logical validities from purely non-cognitive primitives *without* presupposing propositional content in the primitives. (Mark Schroeder's work attempts this, but critics argue it remains circular).
  *   *If achieved:* It forces Realists to admit Expressivism is logically viable.
  *   *Likelihood:* Low. The structural pressure to reintroduce propositions is immense.

  **B. The Ontological Cost-Benefit Analysis (The Realist Burden)**
  Progress would look like a clear articulation of what the Realist buys with their ontology.
  If Expressivism can mimic all the logical practices of Realism (which Quasi-Realism claims to do), what work is the "Moral Fact" actually doing?
  *   *Realist Answer:* It explains the objectivity and mind-independence of moral truth.
  *   *Expressivist Counter:* That is an illusion of grammar.
  *   *Progress:* A consensus that the debate is not about logic (which Expressivism can mostly handle) but about **metaphysical explanation**. The debate should shift from "Can Expressivism handle logic?" (Probably yes, with enough complexity) to "Is the metaphysical parsimony of Expressivism worth the semantic complexity?"

  **C. Redefining the Question**
  The most productive move is to accept your hypothesis fully: The debate is about **semantic minimalism**.
  Progress lies in abandoning the hope that semantics alone settles metaethics. We should treat the Frege-Geach problem not as a "gotcha" against Expressivism, but as a constraint on *any* theory of meaning.
  *   **Realists** face a "Access Problem" (How do we know these facts?).
  *   **Expressivists** face a "Logic Problem" (How do attitudes validate?).
  Progress is recognizing these as symmetrical costs.

  ### 5. Taking a Side on the Structure

  You asked for a diagnosis that takes a side. Here it is:

  **The Critic has the stronger structural position, but the Expressivist has the stronger methodological position.**

  *   **Why the Critic wins on Structure:** The demand for compositional semantics is not an arbitrary realist imposition; it is a requirement for explaining **systematicity**. Language is productive; we understand sentences we have never heard before. Truth-conditional semantics explains this via composition of parts. Expressivism struggles to explain how non-cognitive attitudes compose systematically without implicitly treating them as propositions. The "Negation Problem" (Schroeder) demonstrates that distinguishing between "not disapproving" and "disapproving of not" requires a logical structure internal to the attitude. Once you admit that structure, the distinction between "belief" and "attitude" blurs. The Critic is right that you cannot have the logic without the ontology (or something functionally identical to it).

  *   **Why the Expressivist wins on Method:** The Realist's "solution" is trivial. They solve Frege-Geach by stipulating that moral sentences express beliefs about facts. But this pushes the problem back: What makes these beliefs true? If they are natural facts, we face the Open Question Argument. If they are non-natural facts, we face epistemological skepticism. The Expressivist is right that the Realist buys logical simplicity at the cost of metaphysical extravagance.

  **Conclusion:**
  Your hypothesis is correct that the debate is stalled by conflicting criteria of adequacy. However, it is not merely verbal. It is a substantive clash over whether **logic is autonomous from psychology**.
  *   If logic is autonomous (Critic), Expressivism fails because attitudes cannot bear logical relations.
  *   If logic is internal to practice (Expressivist), Realism is unnecessary because practice alone justifies the logic.

  **Progress** will not come from solving Frege-Geach. It will come from abandoning the idea that Frege-Geach is the decisive battleground. The real battle is over **metaphysical parsimony**. Expressivists should stop trying to prove their semantics is *identical* to realist semantics (Quasi-Realism) and admit it is a *replacement* that trades logical transparency for ontological economy. Realists should stop claiming Expressivism is *logically incoherent* and admit it is *metaphysically revisionary*.

  The stalemate persists because both sides want the other's virtue: Expressivists want realist logic without realist facts; Realists want expressivist epistemology (moral knowledge is accessible) without expressivist semantics. Until one side accepts the cost of their virtue, the debate will remain exactly where you found it.
