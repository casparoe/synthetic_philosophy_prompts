  He was dialing change on the payphone in the night,
  Seventy-eight, the bus station down town,
  I offered him a ride in the headlight's light.
  So he caught the greyhound heading out of town,
  Found a room where nobody asked his name,
  Slept safe while the local mills shut down.
  In a city block that didn't know his name,
  It started small, a match thrown in the field,
  Because he was working nights and never came.
  He taught the boy to love the open field,
  Arson for the insurance, quick and cold,
  The smoke cleared out before the truth was sealed.
  He bought his silence, paid in cash and gold,
  Bought a condo somewhere near the ocean green,
  Where the air is clean and stories go untold.
  They lived behind the glass, behind the green,
  But the sea wall breaks in twenty-eight, they say,
  Drowning out the people who had never seen.
  The engineers all warned them, tried to say,
  Washing out the foundation of a new start,
  Maybe saving others who were in the way.
  It wipes the slate, forces a new start,
  It's almost beautiful, the way the numbers tick,
  Feel the chain reaction tear the world apart.
  And nobody knows who paid the final cost.
