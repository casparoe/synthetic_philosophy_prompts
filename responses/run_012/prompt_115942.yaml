prompt: |-
  I am a high-school student and I run the philosophy club at my school. Next Thursday I have the whole forty-five-minute meeting, and I want to spend it on superrationality — the term, as I understand it, comes from Douglas Hofstadter. My audience is about a dozen students between fifteen and seventeen. They met the Prisoner's Dilemma once in economics and can say what a dominant strategy is, but they know no decision theory at all, and I have nothing but a whiteboard.

  Please do not explain superrationality to me; I have read enough to have the idea roughly in hand. Plan how I should explain it. Tell me the order in which the pieces have to be introduced and what depends on what; which single example should carry the session, and what that example must have and must lack; the misconceptions they will bring or form — my guesses are that it is just the Golden Rule, that it requires the other player to be literally a copy of you or some mechanism forcing your two choices together, and that it is really about playing the game repeatedly — and the exact point in the sequence where each one should be headed off; one question I can ask at the end that would show the idea has landed rather than that they can repeat my sentences back; and what I should openly refuse to cover at this level.

  I want the session built around a live demonstration I have designed, and I want your verdict on whether it should carry the lesson or whether it plants the very misconception I am trying to avoid. Each student writes C or D on a card; the payoffs are the ordinary one-shot Prisoner's Dilemma. They are then told that they have been paired with a student in another room who answered the same logic quiz in the same way, that in each pair only one card will be read and entered as both players' move, and that in their pair it is their own card — while their partner has been told exactly the same thing. In the last ten minutes I want to re-run it with a relatedness dial: only a stated fraction of the room is reasoning this way, and we turn that fraction up and down. Tell me what that exercise actually shows and where in the sequence it belongs.

  Give me one definite plan rather than a menu, choosing wherever a choice has to be made — including whether to mention Newcomb's problem at all — and giving your reasons. Flag any place where the plan presents a contested reading as settled; I gather superrationality is not orthodox, and I would rather know where I am oversimplifying than have a student find out for me.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** High school philosophy club leader (student).
      *   **Audience:** ~12 students, ages 15-17. Know Prisoner's Dilemma (PD) and dominant strategy from economics. No decision theory background.
      *   **Topic:** Superrationality (Hofstadter).
      *   **Constraints:** 45 minutes, whiteboard only.
      *   **Specific Requirements:**
          *   Do not explain superrationality to the user (they know it).
          *   Plan the explanation order/dependencies.
          *   Select *one* core example (criteria: what it must have/lack).
          *   Address specific misconceptions (Golden Rule, literal copying/mechanism, repeated game).
          *   Pinpoint *when* to head off each misconception.
          *   Provide one final assessment question (tests understanding, not rote memory).
          *   Specify what to *refuse* to cover (scope limits).
          *   Evaluate the user's proposed live demonstration (PD cards + "same logic quiz" pairing + "relatedness dial").
          *   Give one definite plan (no menus), including whether to mention Newcomb's Problem.
          *   Flag contested readings presented as settled.

  2.  **Evaluate the User's Proposed Demonstration:**
      *   *Setup:* Students write C/D. Paired with someone in another room who answered the "same logic quiz." Only one card read per pair, entered as *both* players' moves.
      *   *Analysis:* This is tricky.
          *   "Same logic quiz" implies correlation/similarity, not identity.
          *   "Only one card read... entered as both" sounds like a *mechanism* forcing agreement (like a binding contract or a single switch controlling two lights).
          *   *Risk:* This strongly suggests the "mechanism forcing choices together" misconception. Superrationality relies on *logical* correlation due to identical reasoning processes, not a causal mechanism that overrides individual agency. If the teacher says "Your card counts for both," that sounds like causal decision theory (CDT) with a twist, not superrationality.
          *   *Correction:* The prompt says "in their pair it is their own card — while their partner has been told exactly the same thing." This implies symmetry. But the "only one card will be read" part is confusing. If only one is read, why does the other write?
          *   *Refinement:* The core of superrationality is: "I know they are thinking like me. Therefore, if I choose C, they likely choose C. If I choose D, they likely choose D." The demonstration needs to highlight *reasoning symmetry*, not *outcome enforcement*.
          *   *Verdict:* The demo as described risks reinforcing the "mechanism" misconception. It needs modification to emphasize *prediction based on shared reasoning* rather than *linkage*. However, the "relatedness dial" (fraction of room reasoning this way) is a brilliant way to introduce the probability of encountering another superrationalist.
          *   *Decision:* I need to advise modifying the demo to remove the "one card counts for both" mechanic and replace it with "You are paired with someone identical in reasoning."

  3.  **Determine the Core Example:**
      *   PD is already known. It's the standard vehicle.
      *   *Must Have:* Symmetry, one-shot (to avoid reciprocity), high stakes (to make D tempting), clear payoff matrix.
      *   *Must Lack:* Communication, reputation, enforcement mechanisms, iterative history.
      *   *Why:* To isolate the *logical* link from the *causal* link.

  4.  **Structure the 45 Minutes:**
      *   0-5: Hook & Review (PD basics).
      *   5-15: The Problem with Rationality (Why D is standard, why it feels wrong).
      *   15-25: Introducing Superrationality (The "Magic" Step).
      *   25-35: The Demo (Testing the intuition).
      *   35-40: Misconception Check (Golden Rule, Copying, Repetition).
      *   40-45: Final Question & Wrap-up.

  5.  **Address Misconceptions:**
      *   *Golden Rule:* "Do unto others." Superrationality isn't moral; it's instrumental. Address early when introducing the concept.
      *   *Literal Copy/Mechanism:* "Are they clones?" "Is there a wire?" Address during the Demo explanation.
      *   *Repeated Game:* "Won't they punish me later?" Address during the PD review (emphasize *one-shot*).

  6.  **Newcomb's Problem:**
      *   *Decision:* Leave it out.
      *   *Reason:* It adds a layer of prediction/omniscience (Omega) that confuses the symmetry argument. Superrationality in PD is about *peer* symmetry, Newcomb is about *predictor* asymmetry. Too much for 45 mins.

  7.  **Final Assessment Question:**
      *   Needs to distinguish between "I cooperate because it's nice" (Golden Rule) and "I cooperate because my choice predicts theirs" (Superrationality).
      *   *Idea:* A scenario where cooperating hurts the other person but helps you both? No, that's not PD.
      *   *Idea:* A scenario where the other player is *not* superrational.
      *   *Best:* "If you know your partner is a standard rational agent (CDT), what do you do?" (Answer: Defect). This tests if they understand the conditionality of superrationality.

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Re-establish PD. Ensure they know D is dominant.
      *   *The Pivot:* Ask "Why does this feel unsatisfying?" Elicit the "If we both cooperated..." thought.
      *   *The Concept:* Hofstadter's move. We are similar thinkers. My decision is *evidence* of theirs.
      *   *The Demo:* Use the user's idea but fix the "mechanism" flaw. The "Relatedness Dial" is great for expected utility calculation.
      *   *Misconceptions:* Explicitly name them.
      *   *Scope:* Refuse to cover CDT vs. EDT formalism, Nash Equilibria proofs, or evolutionary game theory.
      *   *Contested Flag:* Acknowledge that mainstream game theory rejects this (Nash equilibrium stands). Superrationality is a normative/philosophical challenge, not standard orthodoxy.

  9.  **Refining the Demo Critique:**
      *   The user's demo says: "only one card will be read and entered as both players' move."
      *   *Critical Flaw:* This makes the correlation *causal*. If I write C, the result *is* (C,C) by rule. That removes the decision problem. Superrationality is about *inferring* the other's move from my own reasoning, not having my move *dictate* theirs physically.
      *   *Fix:* Tell them: "You are paired with someone who took the same logic quiz. We believe people with the same quiz answers reason identically. You choose independently. But because you reason identically, your choices will likely match."
      *   *Wait, actually:* Hofstadter's original column *did* use a scenario where people sent letters to a magazine. The "magic" is the belief in correlation.
      *   *Verdict:* I must tell the user to change the "one card read" rule. It invalidates the philosophical point. It turns it into a team game.

  10. **Finalizing the Plan Details:**
      *   *Time:* 45 mins is tight. Keep lectures short.
      *   *Whiteboard:* Draw the matrix. Keep it visible.
      *   *Tone:* Socratic. Ask, don't just tell.

  11. **Review against Constraints:**
      *   One definite plan? Yes.
      *   Flag contested readings? Yes (Nash vs. Superrational).
      *   Newcomb? No.
      *   Demo verdict? Critical feedback provided.
      *   Misconceptions addressed? Yes.
      *   Final question? Yes.
      *   Refusals? Yes.

  12. **Self-Correction on the Demo:**
      *   If I tell them to change the demo too much, it burdens the teacher.
      *   Can I salvage the "one card" idea? No, it fundamentally breaks the "independent choice" axiom required for the dilemma to exist.
      *   I need to be firm: The demo *must* preserve independent choice to test superrationality. If the choices are mechanically linked, it's not a dilemma.
      *   The "Relatedness Dial" is the strongest part. It introduces probability $p$ that the other is superrational. This allows for an Expected Utility calculation: $EU(C) > EU(D)$ if $p$ is high enough. This is a concrete mathematical hook for high schoolers.

  13. **Final Polish:**
      *   Ensure the distinction between "causal influence" and "logical correlation" is clear.
      *   Make sure the "Golden Rule" distinction is sharp (Morality vs. Rationality).
      *   Check the "Contested" flag. Standard Game Theory says Superrationality is wrong. Must state this clearly so students don't think this is settled science.

  14. **Writing the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  Here is a definite plan for your 45-minute session. It is designed to be tight, interactive, and philosophically precise while respecting the limits of your audience's background.

  ### 1. The Core Example
  **Use the standard one-shot Prisoner's Dilemma (PD).**
  Do not invent a new scenario. Your students already know the PD from economics. Reusing it isolates the variable you are changing (the definition of rationality) rather than confusing them with new payoff structures.

  *   **What it must have:** Symmetry (both players face the same choice), clear dominance (Defect pays more regardless of the other), and a better mutual outcome (Cooperate/Cooperate) that is not the Nash equilibrium.
  *   **What it must lack:** Communication, reputation, future interaction, or external enforcement. It must be strictly one-shot and anonymous.
  *   **Why:** Superrationality is a claim about how to reason *within* the standard constraints of the PD, not about how to change the game.

  ### 2. Verdict on Your Demonstration
  **Your proposed demonstration contains a fatal flaw that validates a misconception.**

  *   **The Flaw:** The rule "only one card will be read and entered as both players' move" creates a **causal mechanism**. If my card physically determines their outcome, I am not predicting their choice; I am controlling it. This validates the misconception that superrationality requires a "mechanism forcing choices together."
  *   **The Fix:** Change the instruction. Tell them: *"You are paired with a student in another room who answered the same logic quiz. We hypothesize that people who answer logic quizzes identically reason identically. You choose independently. However, because you reason identically, your choices will likely match."*
  *   **What the Exercise Shows:**
      1.  **Phase 1 (100% correlation):** Tests if they will cooperate when they believe the other is a "mirror" of their reasoning.
      2.  **Phase 2 (The Relatedness Dial):** This is excellent. By stating "Only $X\%$ of the room is reasoning this way," you introduce probability. This allows you to show that superrationality is an **expected utility calculation**. If the probability of meeting another superrationalist is too low, a superrationalist should actually Defect.
  *   **Placement:** Run this *after* you have defined superrationality but *before* you discuss misconceptions. Use the results of the demo to fuel the misconception discussion.

  ### 3. The Sequence (45 Minutes)

  **0:00–0:05: Review and Hook**
  *   Draw the PD matrix on the whiteboard.
  *   Ask: "Who can remind us why Economics says we must Defect?" (Elicit: Dominant strategy).
  *   Ask: "Who feels unsatisfied by that answer?" (Elicit: We both get less money).
  *   **Flag:** Write on the board: *"Standard Game Theory = Defect."*

  **0:05–0:15: The Superrational Pivot**
  *   Introduce Hofstadter's premise: We are not isolated atoms; we are similar reasoning engines.
  *   **Key Distinction:** I cannot *cause* them to Cooperate. But my reasoning process is the same as theirs. Therefore, my decision is *evidence* of their decision.
  *   **Head off Misconception 1 (Repeated Game):** Explicitly state: "This is not about trust, reputation, or punishment. They will never know what you did. You will never meet them again."
  *   **Head off Misconception 2 (Golden Rule):** Explicitly state: "This is not morality. You are not cooperating to be 'nice.' You are cooperating because it maximizes your own payout given the logical link."

  **0:15–0:30: The Demonstration**
  *   **Round 1:** "Assume your partner is reasoning exactly like you." Have them vote C or D secretly. Reveal. Discuss.
  *   **Round 2 (The Dial):** "Assume only 50% of the room is superrational; the rest are standard rational defectors." Have them vote.
  *   **Analysis:** Ask a student who switched from C to D why they did. Guide them to see that if the partner is likely a standard defector, the logical link is broken, and Dominance returns.
  *   **Head off Misconception 3 (Literal Copy/Mechanism):** During the debrief, ask: "Did anyone feel like your pen was being moved by a magnet?" Use this to clarify that the link is *logical*, not physical. "It's not that you *must* match; it's that you *will* match because you are the same type of thinker."

  **0:30–0:40: The Contested Nature of the Idea**
  *   **Crucial Step:** You must explicitly tell them that mainstream decision theory (Causal Decision Theory) rejects this.
  *   Explain: "Most mathematicians and economists say this is a fallacy called 'magical thinking.' They say your choice cannot change the past or the other person's mind."
  *   Write on the board: *"Orthodox Decision Theory = This is wrong."*
  *   Explain that Superrationality (Evidential Decision Theory) is a minority but philosophically robust challenge to the orthodoxy. This prevents a student from feeling tricked if they look it up later.

  **0:40–0:45: Assessment and Close**
  *   Do not ask "What is superrationality?"
  *   **Ask this question:** "You are in a Prisoner's Dilemma. You are a superrationalist. You have strong evidence that your partner is a standard rational economist who believes in dominant strategies. Do you Cooperate or Defect, and why?"
  *   **Correct Answer:** "Defect. Because the logical correlation is broken. They will Defect regardless of my reasoning, so my cooperation does not predict theirs."
  *   **Why this works:** It proves they understand that superrationality depends on the *other player also being superrational*. It distinguishes the view from the Golden Rule (which would say Cooperate anyway) and from blind optimism.

  ### 4. What to Refuse to Cover
  To keep this within 45 minutes and at the right level, explicitly state at the beginning or end that you are **not** covering:
  1.  **Newcomb's Problem:** It introduces a predictor (Omega) which confuses the symmetry of the PD. It adds a layer of "prediction vs. choice" that distracts from "shared reasoning."
  2.  **Formal Math:** Do not derive the Expected Utility inequalities on the board ($p \cdot R + (1-p) \cdot S > \dots$). Describe it conceptually.
  3.  **Evolutionary Game Theory:** Do not discuss how superrationalists might survive in a population over time.

  ### 5. Contested Readings Flag
  You must flag one specific point as contested, or you will be teaching dogma rather than philosophy.
  *   **The Point:** Whether "logical correlation" counts as a valid basis for decision-making.
  *   **The Flag:** When you introduce the concept (0:05–0:15), say: *"Hofstadter argues that your choice is evidence of their choice. Standard economists argue this is a fallacy because your choice cannot physically change their card. We are exploring Hofstadter's view today, but know that it is not the standard view in economics."*
  *   **Reason:** Superrationality is not orthodox. If a student takes an economics class next year, they will be taught that superrationality is incorrect. If you present it as settled truth, you undermine their trust in you when they discover the controversy.

  ### Summary of Misconception Management
  | Misconception | When to Head Off | How to Phrase It |
  | :--- | :--- | :--- |
  | **Repeated Game** | 0:05–0:15 (Intro) | "This is one-shot. No future punishment." |
  | **Golden Rule** | 0:05–0:15 (Intro) | "This is self-interest, not morality." |
  | **Mechanism/Copy** | 0:30–0:40 (Demo Debrief) | "No wires connect you. It is about shared reasoning types." |
  | **Orthodoxy** | 0:30–0:40 (Contested) | "Mainstream theory calls this a fallacy." |

  ### Final Advice on the Whiteboard
  Keep the PD Matrix up for the entire 45 minutes.
  *   Circle the Nash Equilibrium (D/D) in **Red**.
  *   Circle the Superrational Outcome (C/C) in **Green**.
  *   Write **"Logic Link?"** with an arrow between the two players.
  *   This visual anchor prevents them from getting lost in the abstraction.

  This plan respects the time limit, uses your demo effectively (once corrected), and ensures the students leave understanding the *conditions* of the theory, not just the slogan.
