answer: |-
  Your hypothesis is correct: the impasse persists because the disagreement has shifted from metaphysics to semantics and epistemology, centering on whether causal contact is a necessary condition for intentional aboutness and epistemic warrant.

  The reason this diagnosis explains the endless loop is that the initial metaphysical claim (experience is causally inert) is logically consistent until it encounters the constraint of intelligibility (how do we know talk about it?). Once the critic invokes the self-undermining objection, they are no longer arguing about physics or causation per se, but about the conditions for reference and knowledge. The physicalist side operates under a **Causal Constraint on Intentionality**: for a mental state to be *about* X, or for a belief to be warranted regarding X, there must be a causal or counterfactual-tracking relationship between the believer and X. From this vantage, the epiphenomenalist's "reliable correlation" looks like a pre-established harmony or a miracle, because the correlation lacks the causal mechanism that normally explains reliability.

  The epiphenomenalist, conversely, operates under a **Phenomenological Constraint on Presence**: the immediate givenness of experience provides its own warrant and fixes content without needing to causally impact the judging mechanism. When they offer the "ambitious reply" (answerability without causation), they are asserting that acquaintance constitutes a relation sufficient for aboutness, bypassing the need for causal output. The debate never resolves because neither side can refute the other's bedrock principle without sacrificing a core theoretical virtue they refuse to lose: the physicalist cannot accept non-causal reference without breaking naturalistic closure, and the epiphenomenalist cannot accept causal efficacy without breaking the causal closure of physics.

  Your reading group friend's distinction between the etiological and constitutive questions is accurate diagnostics but not a cure, because it merely labels the two sides of the axiom clash. The physicalist insists that constitutive aboutness *requires* an etiological basis in a natural world; the epiphenomenalist insists constitutive aboutness is sui generis. Progress will not come from a formal result or a new distinction, but from recognizing that the choice is not between truth and falsehood, but between two incompatible sets of theoretical priorities. To move forward, one side must concede that their "constraint" is actually a negotiable preference: either we accept that reference can be non-causal (saving epiphenomenalism but complicating naturalism) or we accept that our judgments about experience might be systematically mistaken or causally grounded only in correlates (saving naturalism but accepting a form of eliminativism or illusionism). Until participants acknowledge that they are defending competing axioms rather than describing the same phenomenon, the loop will continue.
