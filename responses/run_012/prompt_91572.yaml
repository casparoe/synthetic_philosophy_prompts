prompt: |-
  I'm a science journo and I'm putting together a 25-minute podcast segment on underdeterminaton of theory by evidence for a general audience — smart listeners, no philosphy background. I don't want the explanation itself; I want you, as a philosopher of science who's also a veteran science communicator, to plan how I should explain it. Think carefully first and brainstorm the dependency order before you commit. Build the whole thing around one carrying example that I've made up but that's realistic: a marine biologist has the same coral-bleaching data from a reef, and it fits a heat-stress model and a pathogen model equally well; every new survey can be absorbed by either. Tell me what has to come first, what depends on what, why this example can carry the idea (what it must have and what it must not have), when I should introduce the holism point (that no hypothesis is tested alone), which misconceptions the audience will predictably form — I'm guessing so science is just opinion, so all theories are equally good, so the evidence doesn't matter — and exactly where in the sequence I should head each one off. Also give me one question to ask at the end that would show whether the idea landed, and tell me what to leave out at this level and say so. Make definite choices and give reasons; don't just lay out the options. End with a single line \answer{...} naming the one dependency that everything else hangs on.
