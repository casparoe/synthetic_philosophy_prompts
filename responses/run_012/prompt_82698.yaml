  I'm in a metaphysics of science seminar and the unit we're on right now is natural kinds — carving nature at its joints, all that — and for Wednesday we each have to bring in a ranked list of candidate kinds and defend the ranking in front of everyone. I've been staring at mine for two days and I dont trust my own gut anymore. Can you build me the tier list? S through D, a line or two of reasoning each, and please actually commit — if any entry lands at "well, it depends what you mean by a kind" then I've failed the assignment. Use the whole range of tiers, I dont want everything piled into A.

