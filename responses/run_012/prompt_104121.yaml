answer: |-
  The arcade was dying, but Arthur's shop remained lit. It was a small square of brightness in a corridor of boarded-up storefronts, the fluorescent hum competing with the silence of the empty mall. Leo sat on a stool near the door, a clipboard resting on his knee. He was there to assess viability for the management company, though there was hardly anything left to manage. His job was to count the footfall and judge the quality of the service.

  Arthur sat at his workbench, a loupe screwed into his right eye. He was working on a mechanical chronograph from the nineties. The watch was on a timing machine, a device that plotted the beat of the escapement on a paper strip. Arthur watched the needle dance. It wavered, just slightly, off the zero line.

  "Too much variance," Arthur muttered. He didn't look up.

  "It keeps time," Leo said, checking his own wrist. "My phone says it's within two seconds."

  Arthur tweezed a microscopic screw from the balance wheel. "It drifts. If it drifts now, it stops in six months. I won't sell it."

  He set the watch aside in a tray labeled *Rejects*. There were perhaps a dozen watches in there, all ticking, all beautiful to Leo's untrained eye. Arthur picked up a rag and wiped his hands. He looked tired. The lines around his mouth were deep, etched by months of squinting and refusing. He was performing at the peak of his craft, but he looked like a man losing a war. He searched for a perfection the market hadn't asked for, and because he couldn't find it, he stopped nothing. He worked late into the night, searching for a part that fit just so, driven by a standard that seemed to rise every time he came close to it.

  Leo made a note: *High skill, low throughput. Possible obstructionism.* He wondered if Arthur was hoarding the repairable units, waiting for a scarcity that would drive up prices. It was a reasonable theory for a man who refused to let a watch leave the shop unless it was flawless.

  ***

  Three months later, the air conditioning in the arcade had been turned off to save power. The heat sat heavy in the shop, smelling of oil and dust. Footfall had dropped to zero; Arthur's customers were now only those who knew to knock on the glass door before entering.

  Leo returned for a follow-up. He found Arthur humming. It was a tuneless, cheerful sound that clashed with the gloom outside. On the bench lay a cheap quartz watch, the kind sold in vending machines. The back case was open. Arthur wasn't using tweezers. He was using a dab of epoxy glue to secure a loose battery contact.

  Leo frowned. "You're gluing it?"

  "Holds better than the clip," Arthur said. He pressed the case back together. He didn't put it on the timing machine. He simply shook it near his ear. He smiled. "Listen. Steady."

  "It's a disposable watch, Arthur. The movement is plastic."

  "It ticks," Arthur said. He placed it in the *Finished* tray. The *Rejects* tray from the first visit was gone. In its place was a box marked *Parts*, filled with cannibalized mechanisms.

  Leo watched him work on the next item, a kitchen timer. The spring was broken. Arthur bypassed the spring entirely, rigging a rubber band to provide the tension. It wouldn't last more than a few weeks, but the bell rang true. Arthur leaned back, wiping sweat from his forehead. He looked lighter than he had in the spring. The tension in his shoulders had vanished. He was finishing three jobs an hour.

  "You've lowered your standards," Leo said. He tried to keep the accusation out of his voice.

  Arthur blinked, taking the loupe out. "I'm meeting demand."

  "The demand is for watches that last."

  "The demand is for clocks that tell the time today," Arthur corrected. "They don't have the money for the other kind. Not anymore."

  Leo wrote in his notebook: *Subject appears to be engaging in planned obsolescence. Deliberately reducing quality to ensure repeat business.* It was the only logic that made sense. Why would a master craftsman glue a battery unless he was farming the customer? It was a hidden goal, a cynical strategy to survive the downturn by ensuring the repairs failed. Leo couldn't see the alternative: that Arthur had simply stopped looking for the perfect fix once the watch started ticking. The search had ended not because the work was done, but because the threshold had moved.

  ***

  Six months after that, the mall management company filed for bankruptcy. The security guards stopped doing rounds. The lights in the corridor were flickering, sometimes staying off for hours at a time. Arthur's shop was lit by a single battery-powered lantern.

  Leo came one last time before his own contract was terminated. He wanted to see the end of it. He expected to find Arthur packing up, finally admitting defeat.

  Instead, Arthur was selling a grandfather clock. It was a massive thing that had been stuck in the back of the shop for years, owned by the mall itself. The pendulum was cracked. Arthur had taped it with silver duct tape. The weights were mismatched.

  "It chimes," Arthur said proudly. He gave the pendulum a push. It swung with a heavy, uneven *thud-clack, thud-clack*. It was nowhere near the isochronous swing of a proper clock. The timekeeping would be wild, subject to the humidity and the stickiness of the tape.

  Leo looked at the clock. It was a ruin. "Arthur, that's junk. It's an insult to the craft."

  Arthur looked at him, genuinely confused. "It chimes on the hour. The lady who bought it, she just wants to hear the bell. She said it reminds her of her grandmother's house."

  "But it won't keep time."

  "It keeps enough time," Arthur said. He was smiling. He looked healthier than he had in the spring. He was sleeping through the night now. He wasn't staying late to polish gears that nobody would see. He was stopping the moment the clock worked enough to satisfy the customer's request. The gap between what he did and what he wanted to do had closed, not because the work had improved, but because the want had shrunk.

  Leo felt a surge of frustration. He saw a man surrendering. He saw a craftsman letting the world degrade him until he was content with tape and glue. "You're letting them win," Leo said. "You're accepting less than you are."

  "I'm accepting what is," Arthur said. He wiped his hands on his apron. "If I wait for the perfect gear, the shop closes. If I fix it with tape, the shop opens tomorrow."

  "There's a floor, Arthur. You shouldn't go below the floor."

  Arthur paused. He picked up a small screwdriver and tapped the duct tape on the pendulum. "The floor is that it moves. If it doesn't move, it's scrap. This moves."

  "But the quality..."

  "Quality is what they can carry home," Arthur said. He turned back to the bench. There was a pile of broken toasters there now. He was branching out. "I found a way to fix the heating element with wire from a lamp. It gets hot. It burns the bread. It works."

  Leo looked at the toaster. It was dangerous. It was inefficient. It was a fire hazard. But Arthur looked at it with the same satisfaction he had once reserved for a Swiss chronograph. The performance had plummeted. The risk had skyrocketed. But Arthur's satisfaction was higher than it had ever been. He was no longer searching. He had found the option that cleared the threshold, and he had stopped.

  Leo realized then that he couldn't audit this. He couldn't measure the drift of Arthur's expectations against the decay of the mall. If he wrote that Arthur was incompetent, he ignored the happy customers who could finally afford repairs. If he wrote that Arthur was strategic, he implied a control Arthur didn't seem to possess. Arthur wasn't steering the ship; he was adjusting the sails to a wind that only blew one way.

  "Are you happy?" Leo asked. It was the only metric left.

  Arthur looked up. The lantern light caught the dust motes dancing around him. "I'm open," he said. "The lights are on. The clocks are ticking."

  "You're fixing toasters with lamp wire."

  "And they toast," Arthur said. He picked up a piece of bread and put it in the slot. He pushed the lever down. They waited. The wire glowed orange, unevenly. The bread began to smoke. After a minute, the lever popped up. The bread was charred on one side, raw on the other.

  Arthur took a bite. He chewed thoughtfully. "It's warm," he said.

  Leo closed his clipboard. He looked at the *Rejects* tray, which was now empty. He looked at the *Finished* tray, piled high with taped, glued, and wired contraptions that functioned just well enough to be sold. He thought about the perfect chronograph from the spring, sitting in a box somewhere, unsold, too good for a world that couldn't afford it.

  "Management is shutting off the main power on Friday," Leo said. "Even the emergency circuits."

  Arthur nodded. He didn't look worried. He reached under the bench and pulled out a small wind-up radio. "I heard. I've got a crank generator. I can fix the wiring on the lanterns. They'll light up if you turn the handle."

  "That's not permanent."

  "It's light," Arthur said.

  Leo stood up. He walked to the door. He looked back at the shop. It was a mess of salvage and compromise. It was a testament to decline. And yet, Arthur was humming again, twisting wires together, his face relaxed, his aspiration met by the simple fact of the glow.

  Leo couldn't decide if Arthur was a genius of adaptation or a victim of slow surrender. The distinction required a fixed standard, and Arthur no longer had one. He had only the threshold of the moment.

  "See you Friday," Arthur said. He didn't look up. He was searching for a wire cutter, but only until he found one that worked. Then he would stop.

  Leo stepped out into the dark corridor. He listened. Behind him, through the glass, he could hear the uneven *thud-clack* of the grandfather clock, and the scratch of the toaster element. It was a symphony of things working just well enough to continue. Leo walked away, leaving Arthur in the light of the lantern, content in the ruins, unable to tell if the man was surviving the fall or simply learning to love the ground.
