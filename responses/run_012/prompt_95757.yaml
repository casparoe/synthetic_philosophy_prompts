      *   *Where theory bites?* (Knife/Train = Info partitions).
      *   *Where film exceeds theory?* (Juror 3's emotion, the cost of communication).
      *   *Person vs. Argument?* (Juror 8's demeanor).
      *   *Confidence/Uncertainty?* (Included at end).

  8.  *(Self-Correction on Uncertainty Flag)*: The user asked me to flag the point I'm least sure about, likely regarding what the theorem implies. I should focus on the definition of "Common Priors" in this context. Is it a belief about the defendant's guilt, or a belief about the world (e.g., how often slum kids kill fathers)? This distinction matters for the "biography" argument.

