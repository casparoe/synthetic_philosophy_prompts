answer: |-
  The view is falsified by the historical persistence of the "Left" label on entrenched communist regimes and the "Right" label on radical anti-establishment movements, proving the terms track ideological content rather than relational status.

  **1. The Swap Case (Real-World Evidence)**
  Your theory predicts that if an egalitarian order becomes entrenched, its defenders become the "Right." The Soviet Union and Maoist China are the real-world test cases. In the USSR, the Communist Party was the entrenched authority defending a rigid hierarchy (the *nomenklatura*) against dissidents and reformers. By your definition, the Soviet state was "Right" and the dissidents (like Solzhenitsyn or Sakharov) were "Left." Yet, globally and historically, the Soviet regime retained the "Left" label until its collapse, while its opponents were categorized as "Right" (reactionaries) or liberals. This demonstrates that "Left" carries positive content (state ownership, internationalism, egalitarian rhetoric) independent of its relationship to power. Similarly, Trumpism and Neoconservatism are classified "Right" despite being radically disruptive to the institutional status quo ("Drain the Swamp," regime change wars). If "Right" were merely a temperament for order preservation, revolutionary movements seeking to overturn norms should migrate to the "Left" label; they did not.

  **2. The One-Axis Question**
  If empirical data demands two dimensions (economic and social), your asymmetry thesis survives only by redefining "Hierarchy" so broadly it loses meaning. For example, Libertarians are typically "Right" but oppose state hierarchy. To keep your theory, you must argue they defend *economic* hierarchy (capital). But this contradicts your claim that the Right defends order "regardless of content." It implies the Right defends *specific* hierarchies (property, tradition) rather than hierarchy *as such*. Regarding the horseshoe: your view predicts extremes should converge on "Order," which fits authoritarian agreement. However, it fails to explain why Anarchists (far Left) and Anarcho-Capitalists (far Right) agree on abolishing the state but remain opposites. Your view collapses the distinction into "Pro/Anti State," erasing the ideological content that actually separates them.

  **3. Concession vs. Wave-Away**
  *   **Concede:** A proponent should concede if a movement explicitly labeled "Left" openly advocates for aristocracy, monarchy, or fixed caste systems *as virtues*, yet retains the label. (This rarely happens because such movements self-identify as Right).
  *   **Wave-Away:** A proponent will wave away the USSR case by claiming "State Capitalism isn't real Leftism" (No True Scotsman). They will wave away Trumpism by shifting the definition of "Status Quo" from *institutional* norms to *demographic* or *cultural* hierarchies (e.g., "He was defending white patriarchy"). This moves the goalposts from observable institutional power to abstract social structures, insulating the theory from disconfirmation.

  **4. Falsifiability Verdict**
  This position has been qualified into unfalsifiability. By defining "Hierarchy" elastically enough to cover both institutional power (USSR) and abstract social orders (Trumpism), and by defining "Left" as a residual negation that vanishes or changes name upon taking power, you make the theory true by definition but useless for prediction. That is not necessarily a problem if you intend this as a philosophical heuristic rather than an empirical claim, but you cannot claim it describes political reality while ignoring the stubborn persistence of the labels themselves.
