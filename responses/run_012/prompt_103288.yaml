answer: |-
  Hofstadter's satire functions successfully as a phenomenological demonstration that renders the cognitive default of the generic masculine visible, but it fails as a logical argument because it conflates the pragmatic mechanism of gender defaulting with the semantic mechanism of racial exclusion.

  The distinction you propose between exclusion and defaulting is the precise lever needed to dismantle the stalemate in your seminar. When the prescriptivist mourns the loss of 'man', they claim a semantic loss: the word once referred to humanity, and now it refers only to males. When Hofstadter transposes this to 'white', he creates a semantic absurdity because 'white' never held the license to refer to humanity; its usage there is purely exclusionary, erasing non-whites from the category of human by definition. The generic masculine, however, operates pragmatically: 'man' may semantically include women (as in "mankind"), but it cognitively defaults to men, rendering women invisible rather than logically excluded. This difference explains why your students split: the first camp accepts the pragmatic equivalence (both feel exclusionary), while the second camp insists on the semantic distinction (one is grammatically generic, the other is not). By diagnosing the satire as a demonstration rather than an argument, you validate the first camp's intuition without conceding to the second camp's linguistic pedantry. The satire works not because the linguistics are identical, but because it forces the reader to experience the *effect* of the generic masculine—the jarring specificity of a supposed neutral—by simulating it with a term that lacks neutral cover.

  This diagnosis shifts the grounds for arguing for gender-neutral usage from truth-conditions to processing costs. If the problem were exclusion, the remedy would be logical correction (e.g., "women are not men"). If the problem is defaulting, the remedy is cognitive retraining (e.g., "hearing 'man' activates male prototypes, inhibiting female representation"). Empirical psycholinguistics supports this: studies on mental imagery and sentence verification show that generic 'he' or 'man' slows processing for female referents and reduces recall of women in generic contexts. Therefore, the argument for neutral language should not be that 'man' is false, but that it is inefficient and biased in its retrieval conditions. We argue for 'humanity' or 'they' not to correct a semantic error, but to eliminate a processing bias that reinforces social hierarchy. The satire, read your way, is a tool to induce the *experience* of that bias, not to prove the linguistic equivalence.

  Regarding the race case, the same move does not work cleanly because racial categories in English rarely claim generic status in the same morphological way. While whiteness often functions as an unmarked category (e.g., "people" vs. "people of color"), the word 'white' itself is not historically codified as a hypernym for 'human' in the way 'man' is. Consequently, the satire's transposition feels more violent in the race case because it invents a semantic history that never existed, whereas in the sex case it exposes a semantic history that is actively being dismantled. This suggests that the politics of the generic are specific to the linguistic architecture of the category; you cannot simply swap variables and expect the mechanism to hold. The satire relies on the moral equivalence of racism and sexism to paper over the linguistic discontinuity, which is why it shocks but does not prove.

  The weakest point of this position is its potential consequentialism: if the outcome of both the generic masculine and the generic 'white' is the erasure of a marginalized group, does the linguistic mechanism matter? A critic could argue that distinguishing between semantic exclusion and pragmatic defaulting is a luxury of the privileged, offering a technical escape hatch for prescriptivists who wish to maintain the status quo by claiming their language is logically sound even if socially harmful. If the social effect is identical, the linguistic distinction may be theoretically interesting but politically inert. You must concede that while the mechanism differs, the injury is comparable, and insisting too hard on the distinction risks validating the prescriptivist's claim that 'man' is technically correct.

  A defender of the satire's argumentative pretensions would argue that Hofstadter is not making a claim about linguistics but about power logic. They would say the analogy holds because the *move*—claiming neutrality for a specific identity—is identical regardless of the semantic machinery. The prescriptivist argues that 'man' is neutral; the racist argues (implicitly) that 'white' is normal. The satire exposes the arrogance of claiming particularity as universality. On this view, the linguistic distinction between default and exclusion is irrelevant because the political act of appropriation is the same. You should not be moved by this because it ignores the material constraints of language change. If the mechanisms differ, the resistance to change differs. Defending 'man' relies on appeals to tradition and etymology; defending 'white' would rely on appeals to biology or explicit supremacy. Conflating them obscures the specific strategies needed to dismantle each. Your diagnosis preserves the nuance required to fight the specific battle of the generic masculine without diluting the specific horror of racial exclusion.
