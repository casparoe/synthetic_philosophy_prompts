          *   *Translation:* User's $E_t[\cdot]$ operator assumes a unique prior $\pi$. Keynes says for some events, no $\pi$ exists (non-numeric probability/weight of argument).
          *   *Status:* No counterpart. SEU assumes risk (known distribution) or subjective belief (Bayesian). Keynesian uncertainty is Knightian/ambiguity where priors aren't just unknown, they don't exist.

  4.  **Synthesizing the Residue Report:**

      *   *Intact:* The shift from goods to states of mind (Household Production).
      *   *Bent:* The "disease" of moneymaking (requires meta-preferences); The present vs. future (requires non-separability).
      *   *Missing (Residue):*
          1.  **Normativity vs. Description:** Utility functions describe choice; Keynes prescribes *correct* choice. The "disease" claim is diagnostic, not descriptive.
          2.  **Endogenous Ontology:** Preferences changing fundamentally vs. just habit formation.
          3.  **Uncertainty:** The lack of a probability distribution vs. a diffuse prior.
          4.  **The "Good":** The idea that some states of mind are *objectively* better, not just preferred.

  5.  **Refining the Tone:**
      *   Speak "Quant." Use terms like *state variables*, *control variables*, *objective function*, *WARP*, *stationarity*, *measure zero*, *Radon-Nikodym derivative*.
