answer: |-
  Here is a decision procedure designed for your committee's constraints. It avoids causal jargon by focusing on timing and data construction. It is built to be run in a spreadsheet during a meeting.

  ### The "Before-and-After" Data Gatekeeper

  Run these questions in order. If you hit a **STOP**, record the verdict and do not proceed. If you pass all gates, use the final verdict.

  **Gate 1: The Metric Check (Handles the "Improvement" Puzzle)**
  *   **Question:** Are we comparing "Improvement" (End Score minus Start Score) between units?
  *   **Check:** Look at the average Start Scores for each unit. Are they different by more than 10%?
  *   **If Yes:** You cannot trust the raw "Improvement" number. You must split the data by Start Score bands (e.g., Low, Medium, High starting health) and compare units within those bands.
  *   **Action:** Treat this as a **Stratified** requirement. Stop here.
  *   **If No:** Proceed to Gate 2.

  **Gate 2: The Clock Test (Handles Simpson's Paradox)**
  *   **Question:** Did the characteristic used to split the data (e.g., severity, age, risk band) exist *before* the patient walked into the unit?
  *   **If Yes (Prior Condition):** This split adjusts for fairness. It removes the advantage of picking easier patients. Proceed to Gate 3.
  *   **If No (Result of Care):** The split is based on something that happened *during* or *after* care (e.g., "Diagnosis confirmed," "Survived to discharge," "Completed treatment"). This creates artificial safety.
  *   **Action:** **STOP**. Verdict: **Neither**. (The data is biased by the care itself).

  **Gate 3: The Filter Test (Handles Selection Bias)**
  *   **Question:** Did we exclude any patients from the count based on what happened *after* they arrived?
  *   **Examples:** Excluding patients who died, excluding transfers, counting only those who finished the protocol.
  *   **If Yes:** You are comparing survivors, not patients. This hides mortality or failure.
  *   **Action:** **STOP**. Verdict: **Neither**. (You need data on everyone who entered).
  *   **If No:** Proceed to Gate 4.

  **Gate 4: The Count Test (Handles Noise)**
  *   **Question:** Are there at least 30 patients in *every* single subgroup band?
  *   **If No:** The stratified numbers are too noisy to trust (random luck looks like performance).
  *   **Action:** **STOP**. Verdict: **Neither**. (Collect more data).
  *   **If Yes:** Proceed to Gate 5.

  **Gate 5: The Job Test (Handles Politics)**
  *   **Question:** Are we judging how well the staff performed (Skill), or how much total harm happened in the region (Burden)?
  *   **If Skill (Performance):** We want to know if the doctors did well given what they were handed.
  *   **Action:** Verdict: **Stratified**.
  *   **If Burden (Public Health):** We want to know the total risk to the population regardless of where they went.
  *   **Action:** Verdict: **Aggregate**.

  ***

  ### Where This Procedure Will Misfire or Get Gamed

  1.  **Gaming the Job Test:** Administrators may claim they want to judge "Burden" (Aggregate) when the aggregate number looks good, even if they are actually evaluating staff performance. This hides poor performance in high-risk units. You must force them to declare the goal *before* looking at the numbers.
  2.  **The "Prior Condition" Lie:** Severity scores are often entered by staff *after* admission. If staff know a patient died, they might unconsciously record a higher severity score to justify the outcome. This makes a "Prior Condition" look like a "Result of Care." If you suspect this, the Clock Test fails.
  3.  **Band Manipulation:** In Gate 4, someone can combine bands to meet the count of 30, hiding a specific outlier group (e.g., combining "Moderate" and "Severe" so the Severe failure rate disappears). You must insist the bands are defined clinically, not by convenience.
  4.  **Unmeasured Differences:** Even if you pass Gate 2, there may be differences you didn't measure (e.g., socioeconomic status). Stratification helps, but it doesn't guarantee truth. If the verdict is "Stratified" but the result feels wrong, the answer is not to switch to Aggregate, but to collect better data (Gate 4 failure).

  ***

  ### Case (a): Hospital A vs. Hospital B Mortality

  **Scenario:** Hospital A has higher overall mortality. Hospital B has lower overall mortality. When split by Arrival Severity (Low, Medium, High), Hospital A has lower mortality in every band.
  **Run the Procedure:**
  1.  **Metric Check:** Not comparing improvement scores. Pass.
  2.  **Clock Test:** Was Arrival Severity known before care? Yes, it is measured at triage. Pass.
  3.  **Filter Test:** Did we exclude anyone? No, this is total mortality. Pass.
  4.  **Count Test:** Are there enough patients in each severity band? Yes, these are regional hospitals. Pass.
  5.  **Job Test:** Are we judging staff skill or total burden? The committee is asking which hospital is "better" (Skill).
  **Decision:** The severity mix is a Prior Condition. Hospital A takes sicker people, making their aggregate look worse. To judge skill, we must adjust for what they were handed.
  \verdict{stratified}

  ### Case (b): The Uncomfortable Truth

  **Scenario:** You suspect Unit X is performing poorly. The dashboard shows Unit X has a lower "Complication Rate" than Unit Y (Aggregate favours X). However, Unit X only accepts low-risk patients, while Unit Y takes everyone. When split by Risk Band, Unit X has higher complications in every band. You want to believe Unit X is safe because they are in your town.
  **Run the Procedure:**
  1.  **Metric Check:** Not comparing improvement scores. Pass.
  2.  **Clock Test:** Was Risk Band known before care? Yes, it is an intake criterion. Pass.
  3.  **Filter Test:** Did we exclude anyone? No, all admitted patients counted. Pass.
  4.  **Count Test:** Are there enough patients? Yes. Pass.
  5.  **Job Test:** Are we judging staff skill? Yes, that is the purpose of quality safety.
  **Decision:** The procedure forces you to acknowledge that the Aggregate number is misleading because Unit X cherry-picked easy cases. The Stratified number reveals the performance gap. You must report the stratified data, even though it implicates your local unit.
  \verdict{stratified}

  ### Case (c): The Discharge Trap

  **Scenario:** Two rehab units are compared on "Functional Gain." Unit A shows huge gains. Unit B shows small gains. The data only includes patients who were successfully discharged home. Patients who died or went to nursing homes are excluded from the calculation.
  **Run the Procedure:**
  1.  **Metric Check:** Comparing gain (End minus Start). Start scores differ. Requires stratification by Start Score. *However*, we must check validity first.
  2.  **Clock Test:** The grouping variable is "Discharged Home." Did this exist before care? No. This is a result of care.
  3.  **Filter Test:** Did we exclude patients based on what happened after arrival? Yes. We excluded anyone not discharged home (including deaths).
  **Decision:** Stop at Gate 3. By excluding those who failed rehab, you have removed the worst outcomes from the dataset. Unit A might look better because they transferred out their failures rather than discharging them home. The data cannot answer the question as constructed. You need records for every patient who entered rehab, regardless of where they ended up.
  \verdict{neither}

  \answer{Did the characteristic used to split the groups exist before the patient entered the unit?}
