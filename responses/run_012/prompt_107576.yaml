answer: |-
  This is a sharp reconstruction of a worry that often circulates in effective altruism and longtermist circles, but which rarely gets the metaphysical scrutiny it demands. You are asking whether an *epistemic* limitation (cluelessness) forces a *metaphysical* conclusion (indeterminacy of value), which in turn forces a *normative* shift (abandoning consequentialism).

  As requested, I will first lay out the structure of your argument and identify the specific joints where equivocation is doing heavy lifting. Only then will I give you my verdict on the inference.

  ### I. The Structure of the Argument and Hidden Equivocations

  Let's formalize the reconstruction you provided. I will label the premises to make the dependencies clear.

  **P1 (The Cluelessness Premise):** For almost any action, the expected value is dominated by long-term, diffuse consequences that are causally tangled.
  **P2 (The Strong Epistemic Limit):** These consequences are not merely difficult for humans to estimate, but are unknowable *in principle* (by any finite or even idealized agent, perhaps due to chaos or quantum indeterminacy).
  **P3 (The Verificationist Bridge):** If the comparative value of two actions cannot be known in principle, then there is no fact of the matter about which action is better. (i.e., Epistemic opacity entails Metaphysical indeterminacy).
  **C1 (Metaphysical Conclusion):** There is no determinate fact about which action maximizes value.
  **P4 (Normative Link):** If there is no fact about which action maximizes value, the command to "maximize expected value" is a fiction.
  **C2 (Normative Conclusion):** We ought to retreat to a normative standard grounded in what is knowable/controllable (intentions, rules, character).

  #### Where the Equivocations Hide

  There are two specific places where terms are shifting meaning, threatening to smuggle the conclusion in through the premises.

  **1. "Unknowable" vs. "Indeterminate" (The Verificationist Bridge)**
  This is the most critical equivocation. In P2, "unknowable" is an *epistemic* claim about access to information. In P3, you treat this as entailing an *ontological* claim about the existence of truth conditions.
  *   *The Equivocation:* You are sliding from "No one can *find* the number" to "There *is* no number."
  *   *Why it matters:* In a realist framework (which most consequentialists hold), the value of an outcome exists independently of our ability to calculate it. A tree falling in a forest makes a sound even if no one hears it; similarly, an action causing a future war has a negative value even if no one could have predicted the war. P3 assumes a verificationist theory of truth that most ethicists reject.

  **2. "Decision Procedure" vs. "Criterion of Rightness"**
  This is a classic distinction in normative ethics that your argument conflates.
  *   *The Equivocation:* You treat the *method* we use to decide (calculating EV) as identical to the *standard* by which actions are judged (maximizing EV).
  *   *Why it matters:* Consequentialism is typically a theory about the *criterion of rightness* (what makes an act right), not necessarily the *decision procedure* (how agents should deliberate). If P2 is true, it destroys the feasibility of direct EV calculation as a *procedure*, but it does not necessarily invalidate EV as the *criterion*. C2 assumes that if we can't use the standard to decide, we must throw away the standard.

  ### II. Does the Inference Go Through?

  **The Verdict:** No, the inference does not go through. It fails primarily at **P3**, and secondarily at **P4**.

  You have inflated an epistemic problem into a metaphysical one, and then used that metaphysical collapse to justify a normative retreat that isn't actually required. Let's dismantle the specific steps you asked me to separate.

  #### 1. Unknowable vs. Uncomputable vs. Indeterminate

  You asked: *Is the problem supposed to be that the consequences are unknowable, or merely uncomputable — and does the argument actually need the stronger claim?*

  *   **Uncomputable:** In a strict mathematical sense, this means no algorithm can derive the answer. In ethical discourse, it usually just means "too complex for human brains." If it's just too complex for humans, P2 fails immediately, because an idealized observer (or a "God's eye view") could still know it. Consequentialism usually relies on the God's eye view for the *truth* of the claim, even if humans can't access it.
  *   **Unknowable (in principle):** This requires something stronger, like fundamental quantum indeterminacy. Even here, Expected Value theory is designed to handle probability. If the future is probabilistic, the EV is the weighted sum of those probabilities. The fact that the *actual* outcome is undetermined until it happens doesn't mean the *expected* value is undetermined now.
  *   **Indeterminate:** This is what your argument *needs* to reach C1. It requires that value itself is vague.

  **The Problem:** The cluelessness argument establishes *complexity* and perhaps *probabilistic uncertainty*. It does not establish *ontological vagueness*.
  Even if the universe is indeterministic (quantum mechanics), the *probability distribution* of outcomes might be well-defined. If Action A has a 51% chance of saving a million lives and Action B has a 49% chance, there is a fact of the matter about which has higher EV, even if we can't know which outcome will actualize.
  To get to "no fact of the matter," you need to argue that the *values* themselves are indeterminate, not just the *events*. That is a much heavier metaphysical lift than cluelessness provides.

  #### 2. Epistemic Access vs. Metaphysical Fact

  You asked: *Does unknowability in principle entail that there is no determinate fact about which action is better?*

  **No.** This is the Verificationist Bridge (P3), and it is the weakest link in your chain.

  Unless you are committed to an anti-realist or verificationist semantics for moral claims, "we could never find out" does not entail "there is nothing there to find out."
  *   **Realist Consequentialism:** Holds that "Right" = "Maximizes Good." This is a natural or non-natural fact about the world. Our inability to measure the height of a mountain doesn't mean the mountain has no height.
  *   **The Implication:** If you accept moral realism, P3 is false. The fact of the matter exists; we are just "clueless" about it.

  If you *do* accept P3 (perhaps you are sympathetic to pragmatism or verificationism), you have indeed undermined Objective Consequentialism. But you have done so by importing a controversial theory of truth, not by deriving it from cluelessness alone.

  #### 3. The Normative Shift (C2)

  Even if we grant the stronger claim (that there is no fact of the matter), your conclusion that we must retreat to "intentions, rules, or character" as *rivals* to consequentialism is a non-sequitur.

  *   **Indirect Consequentialism:** One can hold that EV is the *criterion* of rightness, but that because of cluelessness (P1 & P2), the best *decision procedure* is to follow rules or cultivate virtues.
  *   **The Distinction:** You conclude we should retreat to rules/character *instead* of EV. But a sophisticated consequentialist says we should adopt rules/character *because* of EV.
  *   **The Artifact:** Your phrasing suggests that if EV is "unrecoverable in practice," it ceases to be the standard. But if the standard is "Make the world better," and we can't calculate the best way, the standard doesn't vanish; it just forces us to use proxies. Deontology and Virtue Ethics claim that intentions/character are *constitutive* of morality, not just proxies for outcomes. Cluelessness does not prove they are constitutive; it only proves they are necessary heuristics.

  ### III. What Actually Follows?

  If we strip away the inflated premises and put them back at their proper strength, here is what the cluelessness argument actually establishes:

  1.  **It kills Act-Consequentialism as a Decision Procedure:** You cannot directly calculate EV for every act. We knew this, but cluelessness makes it worse by suggesting our estimates are not just noisy, but potentially systematically biased by unknown long-term effects.
  2.  **It supports Indirect Consequentialism:** It provides a powerful argument for Rule Consequentialism or Virtue Ethics *instrumentally*. We follow rules not because they are inherently moral, but because they are robust against our cluelessness.
  3.  **It does not kill Objective Consequentialism:** The claim that "Action A was objectively better than Action B" remains true or false based on the actual outcomes, regardless of our ability to know it.
  4.  **It does not justify Deontology:** Deontology claims that some actions are wrong *regardless* of consequences. Cluelessness says consequences are hard to know. It does not show that consequences are morally irrelevant. Retreating to intentions because consequences are opaque is like retreating to aiming carefully because you can't see the target. It doesn't mean hitting the target stops being the goal.

  ### Summary

  You are running together **epistemic humility** with **ontological skepticism**.

  *   **The Bad Premise:** P3 (Verificationist Bridge). "Unknowable in principle" does not entail "No fact of the matter" unless you already assume anti-realism.
  *   **The Inflation:** You treat the failure of a *calculation method* (EV estimation) as the failure of a *normative standard* (Maximization).
  *   **The Result:** The inference fails. Cluelessness forces us to be humble about our *judgments*, but it does not force us to abandon the *truth-conditions* of those judgments, nor does it force us to adopt non-consequentialist foundations. It pushes us toward **Indirect Consequentialism**, not away from Consequentialism entirely.

  The honest move isn't to retreat from EV as a standard; it's to acknowledge that EV is the target we are shooting at in the dark, and rules/character are the flashlights we use to try to find it. Changing the flashlight doesn't change the target.
