answer: |-
  **The position, restated**
  Honest communication is mechanically impossible without differential cost. When sender and receiver interests conflict, a signal is credible only if producing it is marginally cheaper for a high-quality sender than for a low-quality one. This cost barrier prevents low-quality imposters from invading the signaling system. Where signals appear cost-free, the cost is either hidden (physiological, opportunity-based), the honesty is transient (pre-cheater invasion), or the model has abstracted away the constraint that actually enforces truth. This is not merely one mechanism among many; it is the necessary condition for any separating equilibrium in biological or economic signaling. Cost is the anchor; honesty is the buoy that floats only because the anchor holds.

  **What it rules out**
  This view falsifies any claim of stable, honest signaling under significant conflict of interest where marginal costs are equal across types. It predicts that if you measure the metabolic, risk, or opportunity cost of a signal, you will find a negative correlation between that cost and the sender's quality. It rules out "conventional" signals (arbitrary symbols) maintaining honesty in high-conflict zones without enforcement penalties. Crucially, it predicts that removing the cost differential—either by subsidizing low-quality senders or taxing high-quality ones—should collapse the signal's information content immediately. If a signal remains honest after costs are equalized, the view is false. It also predicts that cheap talk should vanish wherever interests diverge beyond a specific threshold.

  **The defeaters, ranked**
  1.  **Cheap Talk with Aligned Interests (Fatal):** Crawford and Sobel's cheap talk models demonstrate that honest signaling can be evolutionarily stable without cost if interests align sufficiently. If biological conflicts are often partial rather than total (e.g., parent-offspring communication where interests overlap 80%), cost-free honesty is not a corner case but a common regime. If empirical work shows robust honest signaling in these zones without hidden costs, your claim that *every* durable signal is cost-underwritten is factually false.
  2.  **Indices vs. Signals (High):** An index (e.g., a deep voice caused by testosterone) is physically unfakeable, not cost-fakeable. Your view absorbs this by calling it "infinite cost," but this is semantic stretching. If the constraint is physical impossibility rather than economic trade-off, the mechanism is distinct. If nature prefers indices where possible because they are cheaper than handicaps, cost is not the primary driver; physical constraint is.
  3.  **Receiver-Side Verification (Medium):** Your hypothetical regarding receiver inspection costs is a genuine threat. If honesty is maintained because the *receiver* pays to verify (e.g., a predator testing prey stamina) rather than the sender paying to signal, the sender-side cost constraint is unnecessary. The equilibrium separates based on receiver investment, not sender handicap. This shifts the mechanism from signaling to screening.
  4.  **Multiplicative Fitness (Low/Medium):** Grafen's formalization assumes additive costs. If fitness components interact multiplicatively (e.g., survival probability × mating success), the marginal cost logic may not hold linearly. While likely robust, if the math breaks under multiplicative conditions, the universal claim loses its formal proof, reducing it to a heuristic.
  5.  **Cultural Convention in Humans (Low):** Human language often relies on social enforcement (reputation) rather than biological cost. If you claim this applies to humans, you must equate "social ostracization" with "biological cost." If you restrict the view to biology, human communication is a massive exception that limits the theory's scope.

  **Concede or dismiss**
  A committed cost-first theorist (e.g., Grafen) would concede that cheap talk exists but dismiss it as irrelevant to "hard" signaling problems where conflict is high. They would argue that in the wild, interests diverge enough to require handicaps. This is a legitimate scope restriction, but it weakens your "Every durable honest signal" claim to "Every durable honest signal under high conflict." Regarding indices, they would insist that physical impossibility *is* a cost structure (infinity vs. finite). This is theoretically consistent but risks making the theory tautological: if "cost" includes "physical impossibility," then everything has a cost. Regarding receiver verification, they would likely argue this is a hybrid model, but if the sender's cost is near-zero, it counts against the necessity of sender-side handicaps. They would dismiss multiplicative fitness concerns as technicalities solvable by recalibrating the function, which is fair unless the core logic collapses.

  **The falsifiability audit**
  The view risks severe unfalsifiability. If "cost" is inferred from the existence of the equilibrium (i.e., "the signal exists, therefore the cost structure must exist"), the theory is circular. You observe honesty, posit a hidden cost, and claim validation. To avoid this, cost must be measurable independently of the signal's stability (e.g., measuring metabolic expenditure directly). If you cannot measure the cost without assuming the theory is true, the view is a just-so story generator. This is not fatal if treated as a framework, but it is fatal if claimed as a predictive law. Currently, the tendency to label any stabilizing factor as a "cost" (including opportunity cost, risk, etc.) makes it hard to imagine evidence that wouldn't be absorbed. The theory needs a strict definition of cost that excludes post-hoc rationalizations.

  **Bottom line**
  Your view is a powerful heuristic for high-conflict biological signaling but fails as a universal law. Cheap talk and indices prove cost is not *always* necessary, only often sufficient. The theory's greatest risk is tautology: defining cost broadly enough to explain any equilibrium renders it unfalsifiable. Restrict the claim to high-conflict contexts and demand independent cost measurement, or admit it is a lens, not a law.
