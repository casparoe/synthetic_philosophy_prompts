      *   Avoid being too hopeful about empirical resolution. The user asked for honesty ("If it's the latter I'd rather hear that").

  8.  **Final Polish:**
      *   Check tone: Academic but accessible, respectful of the reading group's effort.
      *   Ensure the distinction between *sensory-discriminative* and *affective-motivative* is clear (Melzack & Casey).
      *   Mention the 2020 IASP definition update (relevant context).
      *   Highlight that Camp B's position is often a defense of the *concept* of pain, whereas Camp A is analyzing the *mechanism*.

  9.  **Self-Correction during drafting:** I initially thought about suggesting fMRI studies. But the user asked if it's a standoff where nothing moves until people agree on words. I should lean into that. Empirical data won't solve a definitional/metaphysical dispute unless the data is interpreted through a shared framework. Camp C is the biggest hurdle. I need to emphasize that Camp C might be the most philosophically robust position.

