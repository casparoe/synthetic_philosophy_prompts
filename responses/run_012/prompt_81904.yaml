  Your "fixed frame" objection begs the question by assuming that for "better" to remain univocal, it must track a single scalar metric across all comparisons. But that's precisely what I deny. When I say 1 is better than 2, 2 is better than 3, and 3 is better than 1, the meaning of "better" is constant: it means "all-things-considered more choice-worthy." What shifts isn't the meaning of the term, but the salient features that ground the judgment in each pairwise context. In the 1-vs-2 comparison, smoothness dominates; in 2-vs-3, balance dominates; in 3-vs-1, body dominates. This isn't a semantic sleight of hand; it's the structure of pluralistic value. You're insisting that if I can't reduce all these features to a single "coffee score," then I'm not really comparing the same thing. But why should reality conform to your demand for a linear scale? That's just the economist in your reading group talking, not the phenomenology of choice.

  Consider the frame you proposed: same taster, same purpose, same time. That frame is fixed. I am standing at the machine, wanting a coffee, right now. I judge 1 better than 2. I judge 2 better than 3. I judge 3 better than 1. If you say this is impossible, you're not arguing from the data of experience; you're arguing from a theoretical commitment to transitivity. You're treating transitivity as a conceptual truth rather than a substantive claim about value structure. If I genuinely would choose 1 over 2, 2 over 3, and 3 over 1 in a direct choice, then "better than" is intransitive in this context. To say I must be "shifting frames" is just a way to save the theory from the counterexample. You're defining away the phenomenon because it doesn't fit the model of rationality you want to preserve. But rationality might just be more messy than that.
