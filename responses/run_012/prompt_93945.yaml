answer: |-
  Dear colleague, it is quite understandable that you find this rhetorical move frustrating, precisely because it functions as a sort of conceptual compression algorithm, packing several distinct claims into a single punchy sentence that shuts down debate. When someone asserts that we only get one shot at this and uses that to dismiss empirical red-teaming, they are often conflating a metaphysical claim about the stakes with an epistemic claim about the methodology. To disentangle this, we must separate the distinct precise theses hiding within that assertion, ranging from the nearly tautological to the highly contentious, and assess whether each actually licenses the conclusion that empirical work is a distraction.

  The first and most defensible reading is the thesis of absorbing failures. This is the claim that the outcome space contains a state, typically existential catastrophe, from which there is no return, meaning the trial sequence terminates upon entry. This is nearly tautological in the context of existential risk; if humanity is extinguished, there is no second trial to correct errors. This thesis is highly plausible, perhaps incontrovertible, but it does not on its own license shelving the empirical study. Knowing that failure is absorbing argues for extreme caution, but it does not dictate whether caution is best achieved through formal verification, empirical stress-testing, or theoretical modelling. In fact, in most high-stakes engineering, the absorbing nature of failure argues for more testing, not less, to ensure the absorbing state is not entered. Therefore, while this premise is true, it is insufficient to support the conclusion that red-teaming is a distraction.

  The second reading shifts from the structure of the outcome space to the framework of decision theory. This is the claim that because failures are absorbing, expected-value reasoning is the wrong framework, and worst-case guarantees should take priority over average-case performance. This is a substantive normative claim. It suggests that we should not balance the probability of success against the cost of development, but rather seek to minimise the maximum possible loss. While this is plausible in existential contexts where the utility function drops to negative infinity, it still does not necessarily ban empirical work. Empirical red-teaming could be viewed as a method for bounding the worst case, rather than estimating the average case. However, if the speaker believes that empirical results can only ever speak to average performance and never constrain the worst case, then this thesis combined with that epistemic belief would support shelving the study. On its own, however, prioritising worst-case reasoning does not rule out empirical data collection unless one assumes such data is irrelevant to worst-case bounds.

  The third reading is epistemic and concerns the trustworthiness of the results. This is the claim that no result from an empirical study could be trusted when what we actually care about is the worst case. This relies on the assumption that empirical testing samples from a distribution that is distinct from the deployment distribution, or that the system may behave deceptively during testing. This is a strong claim about the limitations of induction in machine learning. It is plausible to a degree, particularly if one suspects deceptive alignment or significant distributional shift, but stating it as an absolute—that no result could be trusted—is likely false. Empirical data usually provides some evidence, even if it is not a formal proof. If this thesis is interpreted to mean that empirical data provides negligible evidence regarding the worst case relative to the cost of the delay, it might license shelving the study. However, if it is interpreted as saying empirical data provides zero information, it is probably false. This is likely the core of what your colleague meant, wrapped in the moral urgency of the first thesis.

  The fourth reading introduces a sociological distinction between the agent and the shot. This is the claim that the agent who gets one shot is humanity, while the shot itself is taken by a lab or a field. This highlights a principal-agent problem where the lab might treat the deployment as one shot among many for their own career or organisational trajectory, whereas for humanity it is the only shot. This thesis is plausible and highlights a governance failure, but it does not logically support shelving a specific safety study. If anything, recognising this misalignment should argue for more rigorous independent scrutiny, such as red-teaming, rather than less. Unless the argument is that the lab cannot be trusted to interpret the red-teaming results correctly, this reading does not license the conclusion that the study itself is a distraction. It rather suggests the study should be conducted by a different agent.

  The fifth reading is technical and concerns the definition of the worst case. This is the claim that the worst case is not well defined until the space of options is specified, since the worst outcome over every conceivable policy is simply whatever the worst policy produces. This is a crucial logical point. If we do not constrain the policy space, the worst case is trivially catastrophic. Therefore, safety work must be about constraining the policy space or proving properties within a constrained space. Empirical red-teaming often explores the behaviour of a specific trained model, not the space of all possible models. If the speaker means that empirical work on one model does not constrain the policy space sufficiently to define a meaningful worst case, this is a strong technical objection. It is plausible that empirical work on a single instance does not generalise to the class of systems we care about. This reading would genuinely support shelving the study if the study is not designed to inform the bounds of the policy space, but merely to find bugs in a specific instance.

  Regarding what your colleague probably meant, it is most likely a conflation of the absorbing failure thesis with the epistemic claim that empirical data does not generalise to worst-case scenarios. They are likely using the moral weight of the one-shot condition to bolster the weaker epistemic claim that red-teaming cannot guarantee safety. The absorbing failure claim is true, but the inference that empirical work is therefore useless is false unless accompanied by the specific claim that empirical data cannot bound existential risk. The claim that expected-value reasoning is wrong is plausible in this context, but again, does not rule out empirical methods that reduce worst-case probability. The claim about the agent versus the shot is insightful but irrelevant to the utility of the study itself. The claim about the definition of the worst case is technically sound and is the only one that might genuinely support shelving a study that fails to address policy space constraints.

  When we translate the one-shot premise to settings like aviation safety or reactor design, the argument begins to fray. In these fields, failures are often absorbing for the individuals involved and potentially catastrophic for the environment, yet engineers do not rely solely on formal guarantees. They manage irreversible risks through extensive empirical testing, probabilistic risk assessment, and redundancy, precisely because formal guarantees are impossible for complex physical systems. The one-shot logic in aviation leads to more testing, not less. The comparison suggests that the AI safety argument relies on a hidden premise that AI systems are fundamentally different from physical engineering systems, perhaps because they are agentic, capable of deception, or operate in a digital space where copying is trivial. If the speaker cannot articulate why AI differs from aviation in a way that makes empirical testing useless rather than vital, the one-shot argument loses its force. In engineering, the impossibility of formal guarantees makes empirical validation the primary tool for managing one-shot risks. If your colleague argues that empirical work is a distraction, they are implicitly claiming that AI safety is not an engineering problem solvable by testing, but a mathematical problem solvable only by proof. This is a substantive claim that should be defended on its own merits, rather than hiding behind the tautology that we only get one shot. The comparison to engineering weakens their position unless they can specify why the irreversibility of AI failure precludes the standard engineering response of rigorous empirical validation. Ultimately, the one-shot premise survives translation to engineering only if one accepts that empirical testing reduces risk, which contradicts the conclusion that the study is a distraction. Therefore, the argument in your meeting likely rests on an unstated assumption about the unique opacity of neural networks compared to physical systems, and that is the premise that ought to be challenged.
