answer: |-
  **Project Title:** The Architecture of Commitment: Disentangling Temporal Normativity in Parfit's Hitchhiker

  **Principal Investigator:** [Your Name], PhD Candidate, Department of Philosophy

  **Duration:** Six Weeks (Full-Time)

  **Abstract**
  Parfit's Hitchhiker case is standardly treated as a stress test for decision theories. The orthodox view holds that the case adjudicates between Causal, Evidential, and Functional Decision Theory. This proposal argues that this framing obscures a prior, structural question. The paradox arises not from competing decision rules, but from conflating three distinct normative moments: the initial choice in the desert, the subsequent payment in town, and the standing question of what disposition to cultivate. This project will disentangle these moments to investigate the specific channels by which a later action can rationally govern an earlier decision. By analyzing causal, evidential, constitutive, and normative (answerability) channels, I aim to determine which connections sustain rational commitment without resorting to formal modeling. The outcome will be a taxonomy of diachronic rationality that clarifies when "rational irrationality" is substantive and when it is conceptual confusion.

  **Statement of the Problem**
  In the standard Hitchhiker scenario, a dying agent is offered rescue conditional on a promise to pay later. Once safe, paying is strictly against the agent's immediate interests. The driver predicts the agent's choice; if the agent is predicted to defect, the ride is refused. The prevailing consensus in the decision-theory literature treats this as a closed fight: if one's later conduct is suitably connected to one's earlier undertaking, one pays; otherwise, one dies. The lesson is taken to be purely about which decision theory correctly captures that connection.

  This proposal contends that this consensus is premature. It assumes the connectivity between the desert moment and the town moment is a binary switch determined by one's preferred decision theory. However, this ignores the possibility that "connectivity" is not monolithic. The literature frequently runs together three distinct decision points, each with its own currency: what one should do *now* (in the desert), what one should do *then* (in town), and what sort of agent one has reason to *be*. The case appears paradoxical only because we allow a verdict at one point to do duty for a verdict at another.

  Consequently, existing positions leave the core metaphysical and normative question open: *What makes a later action relevant to an earlier decision at all, such that the earlier decision may rationally be governed by it?* Decision-theoretic models typically hardwire this relevance into the payoff matrix or the dependency graph. They presuppose the structure of the connection rather than explaining it. To simply run the case through a formal model is to assume the very link that requires investigation. A philosophical analysis is required to map the channels of relevance before we can calculate the optimal path.

  **Research Plan and Methodology**
  Over six weeks, I will engage in conceptual analysis and case variation to isolate and evaluate the channels of diachronic influence. I will not construct formal models. Formalization is ill-suited for this specific inquiry because it requires defining the nodes and edges of the decision problem in advance. My goal is to determine what those edges *are*. If I formalize now, I risk baking in the conflation I aim to expose.

  *Weeks 1–2: Disaggregation.* I will construct a rigorous distinction between the three temporal moments identified above. I will draft schematic descriptions of the "Desert Choice," the "Town Choice," and the "Standing Disposition." The goal is to produce a set of variations on the Hitchhiker case where these moments come apart. For example, cases where the disposition is fixed but the choice is free, or where the choice is bound but the disposition is irrelevant. This phase establishes the conceptual space for the inquiry.

  *Weeks 3–4: Channel Analysis.* I will evaluate four specific channels through which the Town Choice might influence the Desert Choice:
  1.  **Causal:** Can the agent physically bind themselves (Ulysses-style)?
  2.  **Evidential:** Does the later act merely signal the type of agent present in the desert?
  3.  **Constitutive:** Is the later act part of what the earlier commitment *consisted in*?
  4.  **Answerability:** Is the later act something the agent is normatively accountable for, simply in virtue of having asked for the ride?

  I will test each channel against the case variations from Weeks 1–2. My working hypothesis is that only the Causal and Constitutive channels do genuine normative work, and that appeals to "rational irrationality" often covertly rely on Evidential or Answerability channels that cannot sustain the weight placed on them. However, the research design is built to falsify this. I will specifically look for cases where Answerability seems to generate rational requirements independent of causation or constitution.

  *Weeks 5–6: Synthesis and Drafting.* I will synthesize the findings into a coherent argument. Given that I am a slow writer, Week 5 will be dedicated to a complete rough draft, allowing Week 6 for revision and polishing. This buffer is essential to ensure the final paper meets departmental standards for clarity and precision.

  **Expected Outcomes and Success Conditions**
  A successful outcome will be a draft paper (approx. 8,000 words) that provides a determinate answer to the research question. Success is defined as a clear taxonomy showing which channels of relevance are sufficient for rational commitment. Specifically, I aim to show whether the "paradox" of the Hitchhiker dissolves when we specify which channel is operative. If I can demonstrate that the debate between decision theories is often a verbal dispute about which channel is in play, the project will have succeeded.

  **Failure Conditions and Risks**
  The project would fail if the distinctions between the three moments collapse under scrutiny. If it turns out that the "Desert Choice" and "Standing Disposition" are conceptually inseparable, the proposed methodology loses its footing. Similarly, if the "Answerability" channel proves reducible to the Evidential channel without remainder, the scope of the contribution will be narrower than anticipated.

  There is a significant time risk. Six weeks is a tight constraint for deep conceptual work, particularly regarding the "Answerability" channel, which touches on meta-normative issues that could easily become a rabbit hole. If the analysis of Answerability requires a broader theory of normative obligations than can be developed in this timeframe, I will have to bracket it as a topic for future research. The schedule includes a writing buffer in Week 5 to mitigate the risk of drafting delays, but if the conceptual distinctions prove more intractable than expected, the final paper may remain provisional rather than definitive.

  **Conclusion**
  The Hitchhiker case is a touchstone in contemporary philosophy, but the standard decision-theoretic framing has stalled progress. By shifting focus from *which theory wins* to *how temporal relevance functions*, this project aims to clear the ground for more productive inquiry. The requested funding will allow me to dedicate six weeks to this disentangling process, producing a manuscript suitable for submission to a specialized journal in ethics or action theory. This work will not only advance my dissertation research on diachronic rationality but also contribute a clearer framework to the department's ongoing discussions in decision theory.
