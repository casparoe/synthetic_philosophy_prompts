          *   *Critique:* Good. Covers topic 1.

      *   *Topic 2: Measurement Dependence*
          *   Draft: The paradox depends on how you measure equality.
          *   Refinement: Mention specific indices (WEF vs. others).
          *   Question: "The paradox is robust using the World Economic Forum's index, but critics note it weakens or disappears if you use indices focused strictly on economic opportunity or political empowerment, rather than health and education. What do you think the paradox is actually tracking—gender equality, or something else like national wealth?"
