answer: |-
  Five owners hold titles to a crumbling cliffside stretch where local ordinance permits individual fortification without collective approval. Each commissions independent geotechnical surveys to assess whether installing a private concrete seawall will stabilize their plot or accelerate undercutting elsewhere; all agree on the soil composition and wave data, but their models diverge on the probability of catastrophic slippage versus localized protection. Though the aggregate data confirms the walls will destabilize the entire ridge, causing net loss for everyone, each owner calculates expected value based on their specific risk estimate. The owner with the most optimistic risk model sees a positive expected value and proceeds immediately, unable to be vetoed by the four neighbors who correctly assess the danger but lack the power to stop him.

  **Analysis**

  Model the decision as a binary choice where the action is objectively bad (negative true value), but each agent $i$ has a probability $p$ of erroneously estimating it as good due to uncertainty in the risk parameters. The action occurs if $\max_i(\text{estimate}_i) > 0$. Assuming independent errors and identical competence ($p=0.1$):
  *   $n=1$: Probability of action = $0.10$
  *   $n=3$: Probability of action = $1 - (0.9)^3 \approx 0.27$
  *   $n=10$: Probability of action = $1 - (0.9)^{10} \approx 0.65$

  **Assumptions:** Errors are independent; agents share identical competence distributions; the action's outcome is fixed regardless of who performs it.
  **Most Regrettable Assumption:** Independence of errors. In reality, agents share data sources, cultural biases, and modeling tools, creating correlated errors that dampen the effect (if $\rho=1$, probability stays at $0.10$ regardless of $n$).
  **Key Feature:** The logical **OR** gate (the maximum operator). The group acts if *any* member acts.
  **Modifications:**
  (a) **Consensus Rule:** Changes the logic to an **AND** gate. Probability becomes $p^n$ ($0.1 \to 0.001 \to 0.0000000001$), effectively neutralizing the curse but risking paralysis.
  (b) **Correlated Errors:** As correlation approaches 1, the benefit of adding agents vanishes; the group acts only if the shared model is wrong, making $n$ irrelevant.
  **Objection:** "Unilateralism is the engine of progress; requiring consensus stifles innovation and allows veto-holding luddites to block beneficial breakthroughs."
  **Rebuttal:** "The Curse applies specifically to irreversible actions with negative aggregate expected value. Innovation involves uncertainty about *positive* value; the Curse describes situations where the group *knows* the net value is negative, but dispersion in risk estimates allows a false positive to trigger disaster."

  **Variant Feasibility**

  Your hunch is mathematically correct but structurally impossible under the Curse's definitions. For the probability of a bad outcome to decrease as $n$ increases, the individual probability of acting ($p$) must drop faster than the union probability rises. This requires the value of the action to depend on $n$ (e.g., strategic deterrence where more actors increase the risk of mutual destruction, lowering everyone's incentive to strike). However, this breaks the Unilateralist's Curse structure, which assumes agents evaluate a **fixed outcome** independently. If the outcome depends on how many *can* or *will* act, you are no longer modeling independent estimation errors regarding a fixed fact, but rather a game-theoretic equilibrium. In the strict Curse framework—where the action is unilateral, non-rival, and has a fixed negative value—adding capable agents monotonically increases the risk. You cannot lower the probability of a logical OR by adding more inputs without changing the inputs themselves.
