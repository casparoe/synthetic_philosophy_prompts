answer: |-
  **Project Title:** The Counterfactual Settlement Problem in Decision Markets
  **Applicant:** [Your Name], Backend Engineer
  **Duration:** 6 Months (Part-Time)
  **Request:** Small Research Grant (Public-Interest Tech)

  ### 1. The Core Question
  Futarchy proposes that we vote on a welfare metric and let prediction markets choose policies by pricing the expected outcome of each option. Standard criticism focuses on manipulation, liquidity, or metric gaming. These are engineering constraints: we can design better oracles, subsidize liquidity, or audit metrics.

  This project addresses a structural constraint that design tweaks cannot fix: **The Settlement Gap.**

  In a binary decision (Policy A vs. Policy B), the market must price $E[Metric|A]$ and $E[Metric|B]$. We implement the winner. Consequently, we observe the metric for the winner, but the loser’s outcome remains a counterfactual. It is never settled against reality.

  **Research Question:** *In the absence of ground-truth settlement, does the market price for the unchosen policy retain informational calibration, or does it structurally decouple from reality?*

  If the price decouples, the market cannot learn from mistakes on the unchosen branch, and long-term convergence to truth is impossible. If it remains calibrated, futarchy is viable even without observing the counterfactual. My hypothesis is that calibration holds only when the decision space allows for randomized unit-level testing (A/B testing), which implies futarchy is redundant in those domains and inapplicable in others.

  ### 2. Why Standard Objections Do Not Apply
  Reviewers often conflate "market accuracy" with "settlement feasibility."
  *   **Manipulation:** This assumes actors try to move the price away from truth. The Settlement Gap exists even with perfectly honest actors. If I bet on Policy B, and Policy A is chosen, there is no oracle call to prove me right or wrong. My capital is returned, or settled on a simulation. In either case, the penalty for being wrong is removed.
  *   **Liquidity:** Thin markets are noisy, but noise averages out over time *if* there is settlement. Without settlement, bias does not average out; it accumulates.
  *   **Metric Selection:** This is a governance problem. The Settlement Gap is an epistemic problem. Even if we agree on the metric, we cannot measure it on the path not taken.

  Economists often assume rational expectations fill this gap (the market "knows" what would have happened). Engineers know that without a feedback loop (loss function), optimization drifts. This project treats the unchosen market branch as a system without a feedback loop and tests for drift.

  ### 3. Methodology
  I will build a minimal decision market environment within a controlled software deployment context. This allows me to simulate the "governance" constraint (we can only ship one version) while secretly retaining the "god view" (we can measure both versions via holdout groups) to evaluate market accuracy post-hoc.

  **Phase 1: Specification & Modeling (Month 1-2)**
  *   Define the formal condition for "harmless" vs. "fatal" counterfactual drift.
  *   *Harmless:* Drift is random noise; the market still picks the winner correctly more often than a baseline heuristic.
  *   *Fatal:* Drift is systematic; the market consistently overvalues the unchosen option, leading to policy oscillation or stagnation.
  *   Draft the smart contract/logic for a two-sided conditional market. Shares pay out $1 if Metric > Threshold, $0 otherwise, conditional on that policy being enacted.

  **Phase 2: The Build (Month 3-4)**
  *   Deploy an internal prediction market tool accessible to ~50-100 engineering colleagues.
  *   **The Asset:** Feature flags. Policy A = New UI, Policy B = Old UI. Metric = Click-through rate (CTR).
  *   **The Trick:** The market decides which flag is enabled for the *majority* of users. However, I will retain a randomized 5% holdout group where the *loser* is forced on.
  *   **The Blind:** Traders do not know the holdout exists. They trade under the assumption that the unchosen policy will never be observed (simulating real futarchy).
  *   **The Data:** I will record the market price of the unchosen policy at the time of decision and compare it against the *actual* CTR observed in the secret holdout group.

  **Phase 3: Analysis & Reporting (Month 5-6)**
  *   Correlate market price vs. actual hidden ground truth for the unchosen branch.
  *   Determine if the market price drifted after the decision was made (since no settlement occurs, does the price go to zero? Does it stay static? Does it hallucinate?)
  *   Write the final report: "Calibration Without Settlement."

  ### 4. Success and Failure Conditions
  *   **Success (Positive Result):** The market price for the unchosen policy tracks the hidden ground truth within a statistically significant margin, even without settlement. This would imply rational actors can infer counterfactuals from side-channels, validating futarchy for non-experimental domains.
  *   **Success (Negative Result):** The market price for the unchosen policy detaches completely from the hidden ground truth (drifts, goes to zero, or becomes noise). This confirms the hypothesis that futarchy is strictly bounded by the ability to run A/B tests. This is a valuable negative result: it saves public interest funders from backing governance structures that cannot learn.
  *   **Project Failure:** Inconclusive data due to low participation (liquidity) or technical failure of the market mechanism. To mitigate this, I will subsidize initial liquidity with grant funds and use a simple centralized ledger rather than complex blockchain infrastructure to reduce friction.

  ### 5. Timeline Honesty & Scope
  **Is six months part-time feasible?**
  Yes, but only because I am restricting the scope to a *mechanism check*, not a societal trial.
  *   **Risk:** The "holdout" method requires organizational buy-in to run conflicting feature flags. If my employer denies the A/B test structure, the project stalls.
      *   *Mitigation:* I have pre-cleared the concept with my engineering lead. We can frame this as "decision quality research."
  *   **Risk:** Liquidity. 50 traders is not a real market.
      *   *Mitigation:* We are not measuring price discovery efficiency, we are measuring *calibration*. Even a thin market reveals whether traders care about the counterfactual truth if they aren't paid on it.
  *   **Risk:** Scope Creep. It is tempting to try to "solve" the counterfactual problem.
      *   *Mitigation:* The grant proposal is strictly to *measure* the drift, not to fix it. If the drift is fatal, the output is a warning, not a patch.

  **The "Three-Year" Reality:**
  A full validation of futarchy for public governance is absolutely a three-year (or decade) endeavor requiring longitudinal data across multiple policy domains. However, the specific engineering question—*does the signal die when the feedback loop is cut?*—can be answered in a sandbox environment in six months.

  If the signal dies in the sandbox, it will die in the senate. If it lives, we have a roadmap for where futarchy can actually be deployed (iterative, testable environments) versus where it is purely speculative (one-shot geopolitical decisions).

  ### 6. Conclusion
  Futarchy enthusiasts assume the market "knows" the counterfactual. Skeptics assume the market will be manipulated. Both miss the engineering reality: a system without a settlement oracle is a system without a loss function.

  This project builds the loss function in secret to see if the system learns without it. If the market fails this test, we save the public interest sector from adopting a governance technology that fundamentally cannot verify its own errors. If it passes, we identify the specific architectural requirement (randomized holdouts) needed to make futarchy safe. Either way, we move from philosophical debate to empirical data.
