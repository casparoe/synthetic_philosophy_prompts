answer: |-
  ### 1. Essay Question

  **Question 1 (25 marks)**

  Consider the following claim: "An individual bears no moral responsibility for a collective harm if their action makes no difference to whether that harm occurs."

  To evaluate this, distinguish three senses in which an act might "make no difference": (i) the outcome would have been identical had you acted otherwise; (ii) your act does not alter the probability of the outcome; or (iii) your act does not increase the quantity of harm produced.

  Apply this distinction to three familiar cases: casting a vote in a large election, purchasing a unit of factory-farmed meat, and emitting a ton of carbon. Explain why the force of the claim above varies across these examples depending on which sense of "difference" is employed.

  Finally, consider a lake where fish die if and only if seasonal phosphorus runoff strictly exceeds 100 units. In **Arrangement A**, 1,000 farms each discharge 0.5 units (total 500); in **Arrangement B**, 201 farms each discharge 0.5 units (total 100.5). In both, the fish die. In **B**, any single farm's withdrawal saves the fish; in **A**, no single farm's withdrawal saves the fish.

  Does the claim above exonerate the farmers in Arrangement A but condemn those in Arrangement B? If so, is this verdict defensible? If not, state and defend a principle connecting individual acts to collective harms that yields a consistent verdict for both arrangements.

  ***

  ### 2. Model Answer

  The claim that individual responsibility requires "making a difference" is the core of the inefficacy objection. However, its persuasive power collapses unless we specify which of the three senses of "difference" is doing the work. The objection is most plausible when it relies on the first sense: counterfactual dependence. If the outcome would have been identical had I acted otherwise, it seems I cannot be blamed for the outcome. The other two senses are less robust. An act might fail to change the *probability* of an outcome (sense ii) simply because the agent lacks information, even if the act is causally potent. Similarly, an act might fail to increase the *amount* of harm (sense iii) in cases of binary harm (life/death), even if it triggers the harm. Therefore, the inefficacy objection must rest primarily on the first sense: that the agent is not counterfactually necessary for the harm.

  When we apply this to the three standard examples, the objection's force fluctuates. In voting, the probability of being pivotal is vanishingly small. For almost any voter, sense (i) holds: the election result would have been the same without their vote. Thus, the objection seems strong. In factory farming, supply chains often operate on thresholds. A single purchase might not trigger a new production cycle (sense i holds), but it increases the probability that a threshold will be crossed (sense ii fails). In carbon emissions, the harm is often cumulative rather than threshold-based. One ton of carbon adds to the total atmospheric concentration, contributing marginally to warming. Here, sense (iii) fails: the act *does* increase the amount of harm, even if it doesn't single-handedly cause a climate tipping point. Thus, the inefficacy objection is strongest for voting, weaker for meat, and weakest for emissions, depending on whether we prioritize counterfactual necessity, probability, or marginal contribution.

  The Lake Case exposes a fatal flaw in grounding responsibility solely on counterfactual necessity (sense i). In Arrangement B, every farm is pivotal; remove one, and the total drops to 100, saving the fish. In Arrangement A, no farm is pivotal; remove one, and the total drops to 499.5, and the fish still die. If responsibility requires counterfactual necessity, the farmers in B are responsible, but the farmers in A are not. This is intuitively unacceptable. The farmers in A are doing the exact same act as those in B (discharging 0.5 units), contributing to the exact same outcome (dead fish), with the only variable being the number of other contributors. It cannot be that moral responsibility vanishes simply because there are enough other wrongdoers to render your contribution redundant.

  A tempting but mistaken move is to argue that the farmers in A are responsible because they *might* have been in B. This conflates epistemic uncertainty with metaphysical responsibility. Even if the farmers in A *know* they are in a surplus situation where they are not pivotal, the intuition that they share blame remains. Relying on probability (sense ii) does not solve this, because in the exam scenario, the arrangement is stipulated as fact, not risk.

  To resolve this, we must reject the premise that responsibility requires counterfactual dependence. Instead, we should adopt a principle of **Complicity in Sufficient Sets**. An individual is responsible for a harm if their act is a necessary member of a set of acts that is sufficient to produce the harm, provided they know (or should know) that such a set is being formed. In Arrangement B, each farm is a member of the minimal sufficient set. In Arrangement A, while no single farm is necessary, each farm is a member of *many* different sufficient sets (any 201 farms constitute a sufficient set). By contributing to the pool of runoff, each farmer in A ensures that enough sufficient sets exist to kill the fish.

  Alternatively, one might argue for a **Fair Share** principle. The harm is caused by the group; the burden of restraint should be distributed equally among contributors. Whether a farm is pivotal (B) or redundant (A) is a matter of luck regarding how many others pollute. Moral obligation should not track this luck. Both principles yield the same verdict: the farmers in A are just as responsible as those in B. The inefficacy objection fails because it mistakes causal redundancy for moral irrelevance. Responsibility tracks participation in a harmful practice, not just pivotal causation.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  | Move | Description | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Distinction Analysis** | Clearly distinguishes the three senses of "makes no difference" and identifies counterfactual dependence (sense i) as the only one capable of grounding the inefficacy objection. | 5 | Treating the three senses as synonymous or arguing probability is the strongest basis for the objection. |
  | **2. Application to Examples** | Correctly applies the distinction to Voting, Meat, and Emissions, showing how the objection's strength varies (e.g., noting emissions often fail sense iii). | 5 | Claiming the objection applies equally to all three, or failing to note that emissions usually involve marginal harm. |
  | **3. Lake Case Diagnosis** | Identifies that relying on counterfactual necessity exonerates Arrangement A while condemning B, and flags this as an arbitrary or unacceptable result (the "redundancy problem"). | 5 | Accepting the verdict that A is exonerated, or missing that the physical act is identical in both arrangements. |
  | **4. Critique of Mistaken Move** | Identifies and rejects a plausible but flawed reply (e.g., conflating uncertainty with redundancy, or appealing to risk in a stipulated fact case). | 5 | Failing to flag a specific mistaken move, or critiquing a straw-man argument not relevant to the stipulated case. |
  | **5. Alternative Principle** | Proposes and defends a principle (e.g., Complicity, Fair Share, Expected Value) that holds A and B responsible equally, explaining *why* it works. | 5 | Proposing a principle but failing to explain how it applies to Arrangement A specifically. |

  **Note on Grading:**
  *   **A Grade (20-25):** Hits all five moves with precision. The alternative principle is clearly defined and applied to the Lake Case.
  *   **B Grade (15-19):** Typically hits moves 1, 2, and 3 well but **omits or weakly executes Move 5**. They diagnose the problem with the Lake Case effectively but fail to articulate a robust positive principle that solves it, often resorting to vague appeals to "fairness" without structural detail.
  *   **C Grade (10-14):** Summarizes the examples and the Lake Case but fails to separate the three senses of "difference" (Move 1) or accepts the counterfactual requirement without challenge (Move 3).
