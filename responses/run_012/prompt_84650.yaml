  **THE BACK ROOM READING GROUP: JOINT STATEMENT ON TRUTH AND PARADOX**
  **Date:** [Fortnight of the 14th]
  **Location:** The Back Room, [Pub Name]
  **Signatories:** The Gappy Theorist, The Dialetheist
  **Scribe:** The Reluctant Secretary

  **PURPOSE:**
  To cease circular oral argument and record, in writing, the precise points of agreement, disagreement, and outstanding theoretical debt regarding the Liar Paradox and the nature of truth. This document serves as the baseline for all future sessions. No one is allowed to say "But I thought we agreed..." without referencing this paper.

  ***

  ### I. SHARED COMMITMENTS
  *Both parties affirm the following. Denial of any point below constitutes resignation from the current line of inquiry.*

  1.  **The T-Schema Intuition:** We start from the pre-theoretical thought that a sentence is true exactly when things are as the sentence says they are. This intuition applies to *every* sentence, including sentences that contain the word "true."
  2.  **Semantic Closure:** A theory of truth must be able to apply to itself. It must be possible for the theory to assert, within its own language, that its own claims are true. We reject any solution that requires a hierarchy of languages where the theory of truth can only be stated in a "higher" language that the theory itself cannot describe.
  3.  **No Syntactic Bans:** The sentence "This sentence is not true" is grammatically well-formed and meaningful. It is not to be dismissed as category mistakes, nonsense, or context-shifts. It is a genuine sentence.
  4.  **The Cost of Solution:** The paradox demonstrates that our current framework is inconsistent. Something has to give. We agree that the options are limited to: (i) restricting the T-Schema intuition for some sentences, or (ii) revising classical logic (specifically regarding Excluded Middle or Explosion).
  5.  **Fatal Objections:** We agree that a theory of truth fails if:
      *   It cannot classify the Liar sentence without contradiction (unless it accepts contradiction).
      *   It renders ordinary reasoning impossible (e.g., we can no longer infer "It is raining" from "It is raining and it is raining").
      *   It creates a "Revenge Paradox" where the solution itself generates a new sentence that breaks the solution in the same way the original Liar did.

  ***

  ### II. TABLE OF DISAGREEMENTS
  *Each disagreement is worded to be acceptable to the party it describes.*

  | Topic | The Gappy Theorist's Position | The Dialetheist's Position |
  | :--- | :--- | :--- |
  | **1. The Status of the Liar** | The sentence "This sentence is not true" is **neither true nor false**. It suffers from a truth-value gap. | The sentence "This sentence is not true" is **both true and false**. It constitutes a true contradiction (glut). |
  | **2. The Logic to be Revised** | We must restrict **Excluded Middle** (the rule that every sentence is either true or not true). Some sentences fall outside this binary. | We must restrict **Explosion** (the rule that from a contradiction, anything follows). Contradictions can be true without trivializing the system. |
  | **3. The Meaning of "False"** | "False" is a distinct status from "Not True." A sentence can be "not true" because it is false, *or* because it is gappy. | "False" simply means "Not True." There is no third option. If a sentence is not true, it is false. If it is both, it is both true and not true. |
  | **4. Expressibility** | We can describe the gap status, but we must be careful not to use the object language's negation to do it, or we risk recreating the Liar. | The Gappy view cannot consistently state its own position within its own language. The Dialetheic view can state its own position (including its own contradictions). |

  ***

  ### III. PREDICTIONS ON SPECIFIC SENTENCES
  *Both parties must commit to the status of the following sentences under their respective theories. We will check these predictions against the Shared Commitments (specifically Point 5).*

  **Sentence (a): "This sentence is not true." (The Liar)**
  *   **Gappy Prediction:** This sentence is **Neither True Nor False**.
      *   *Reasoning:* If true, it is not true. If false, it is true. Therefore, it fails to be either.
  *   **Dialetheist Prediction:** This sentence is **True and False**.
      *   *Reasoning:* If true, it is not true (so false). If false, it is true. Therefore, it is both. This is acceptable because Explosion is rejected.

  **Sentence (b): "This sentence is true." (The Truth-Teller)**
  *   **Gappy Prediction:** This sentence is **Neither True Nor False** (or Unstable).
      *   *Reasoning:* It asserts its own truth but provides no ground for it. It is not forced to be false, but it is not anchored enough to be true. It shares the Liar's lack of classical value.
  *   **Dialetheist Prediction:** This sentence is **True** (and consistently so, though potentially also false).
      *   *Reasoning:* There is no contradiction in it being true. Unlike the Liar, it does not force a negation. It can be accepted as true without logical disaster.

  **Sentence (c): "Either this sentence is not true, or it is neither true nor false." (The Revenge)**
  *   **Gappy Prediction:** This sentence is **Neither True Nor False** (Handled same as the Liar).
      *   *Reasoning:* This is the Liar in a party hat. If it is true, then one disjunct must hold. If "not true" holds, it isn't true. If "neither" holds, it isn't true. So if true, it's not true. Therefore it must be gappy.
  *   **Dialetheist Prediction:** This sentence is **True** (and proves the Gappy view is inexpressible).
      *   *Reasoning:* If the Gappy theorist is right about the Liar, then the second disjunct ("it is neither true nor false") describes the actual state of affairs for Liars. Therefore, sentence (c) states a truth. But if (c) is True, the Gappy theorist must classify it. If they classify it as True, they contradict its content (which says it's not true or neither). If they classify it as Gap, they admit their theory produces gaps for sentences that seem obviously true.

  ***

  ### IV. THE CRUXES
  *These are the specific points where the argument stalls. We identify the substantive issues versus the verbal ones.*

  **Crux 1: The Meaning of Negation ("Not")**
  *   **The Issue:** When we say "not true," do we mean "false" (contradictory negation) or "lacking truth" (exclusion negation)?
  *   **The Test Sentence:** "The Liar sentence is not true."
  *   **Gappy Claim:** This statement is **True**. (Because the Liar lacks truth).
  *   **Dialetheist Claim:** This statement is **True**. (Because the Liar is false).
  *   **Verbal or Substantive?** **Mostly Verbal, but with logical consequences.** Both agree the statement "The Liar is not true" is assertible. They disagree on whether asserting "not true" commits you to "false."
      *   *Resolution:* The Gappy theorist admits "not true" covers two categories (False + Gap). The Dialetheist admits "not true" covers one (False), but allows overlap with True.

  **Crux 2: Expressibility (The "Ineffability" Problem)**
  *   **The Issue:** Can the Gappy theorist say "The Liar is neither true nor false" without generating a new paradox?
  *   **The Test Sentence:** "The Liar sentence is neither true nor false."
  *   **Gappy Claim:** This statement is **True**. It correctly describes the world.
  *   **Dialetheist Claim:** If this statement is True, then the Liar sentence falls under a description that makes it "not true." If it is "not true," does the original T-Schema apply? The Dialetheist argues the Gappy theorist needs a "super-truth" predicate to state their theory, violating Shared Commitment #2 (Semantic Closure).
  *   **Verbal or Substantive?** **Substantive.** This is not just about words; it is about whether the Gappy theory can survive its own application. If the Gappy theorist cannot assert their own theory is true without contradiction, they lose to the Dialetheist on Shared Commitment #2.

  **Crux 3: The Cost of Logic**
  *   **The Issue:** Which classical rule is less painful to lose?
  *   **The Choice:** Excluded Middle (Gappy cost) vs. Explosion (Dialetheist cost).
  *   **Gappy Argument:** It is better to accept that some sentences have no value than to accept that contradictions are true. "True and False" is unintelligible.
  *   **Dialetheist Argument:** It is better to accept contradictions than to deny that every sentence is either true or not true. "Neither True Nor False" is just "False" in disguise, or requires a logic so weak it cannot do mathematics.
  *   **Verbal or Substantive?** **Substantive.** This is a clash of intuitions about the nature of reality and logic, not definition.

  ***

  ### V. SECRETARY'S NOTE ON VERBAL DISPUTES
  *Added by the Scribe to ensure we actually finish a pint tonight.*

  There is a suspicion that **Disagreement #3 (The Meaning of "False")** is a verbal dispute masking a substantive one.
  *   If the Gappy theorist defines "False" as "Not True AND Not Gap," and the Dialetheist defines "False" as "Not True," they are talking past each other *unless* they agree on the logic of "AND" and "NOT."
  *   **Action:** For the purpose of this group, we will treat "False" as "Not True" for the Dialetheist, and "False" as a specific subset of "Not True" for the Gappy theorist. We will not argue about the word "False" again. We will argue about the **status** of the sentence.

  **Next Meeting:** We will evaluate Sentence (c). If the Gappy theorist cannot explain why (c) is not a fatal Revenge Paradox without using a metalanguage forbidden by Shared Commitment #2, the Dialetheist buys the first round. If the Dialetheist cannot explain how "True and False" is distinct from "Nonsense," the Gappy theorist buys the first round.

  **Signed:**
  ____________________ (The Gappy One)
  ____________________ (The Dialetheist)
  ____________________ (The Secretary)
