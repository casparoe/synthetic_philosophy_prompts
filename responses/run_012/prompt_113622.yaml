answer: |-
  # Specification for a Theory of Dreaming: Desiderata and Constraints

  ## (i) The Cases the Theory Must Get Right

  1.  **The Silent Narrator Classification**
      *   **Requirement:** The theory must provide a principled verdict on whether the sleeper producing fluent speech without waking recall underwent a conscious experience during the night.
      *   **Motivation:** This case isolates behavioural output from mnemonic access. A theory that ties dreaming essentially to memory must classify this as non-dreaming; a theory that ties it to neural or behavioural capacity must classify it as dreaming. The theory cannot remain agnostic.
      *   **Status:** Non-negotiable.

  2.  **The Bare Verdict Differentiation**
      *   **Requirement:** The theory must explain the difference in epistemic status between a subject disposed to assert they dreamed (without imagery) and a subject asserting based on vivid recall, even if the truth value of the assertion is identical.
      *   **Motivation:** Introspective confidence varies. If dreaming is a uniform state, the theory must account for why the *grounds* for the claim differ without necessarily denying the claim in the "bare" case.
      *   **Status:** Negotiable (eliminativists may collapse the distinction).

  3.  **The Inserted Dream Boundary**
      *   **Requirement:** The theory must specify criteria to distinguish a genuinely generated dream from a waking confabulation that the subject sincerely believes is a dream.
      *   **Motivation:** The "Inserted Dream" shows that the *feeling* of having dreamed is replicable by external suggestion. A theory of dreaming must define the causal origin of the content, not just the subject's conviction.
      *   **Status:** Non-negotiable.

  4.  **The Real-time Signalling Interpretation**
      *   **Requirement:** The theory must state whether pre-agreed eye signals during REM sleep constitute proof of concurrent conscious experience, or merely proof of motor capacity.
      *   **Motivation:** Lucid dreaming signalling is the strongest evidence for consciousness during sleep. A theory must either accept this as verifying concurrent experience or provide an alternative explanation for the signal that preserves its stance on consciousness.
      *   **Status:** Non-negotiable.

  5.  **The Replay Location**
      *   **Requirement:** The theory must identify where the dream "happens" in the Replay case: in the sleeping brain (source), the waking brain (recipient), or neither.
      *   **Motivation:** If neural activity constitutes the dream, reproducing it should reproduce the dream. If the dream is essentially first-personal, the Replay subject's experience might be distinct from the sleeper's. The theory must locate the ontology of the dream.
      *   **Status:** Negotiable (depends on theory of mind).

  ## (ii) The Distinctions It Must Not Collapse

  6.  **Experience vs. Memory/Report**
      *   **Requirement:** The theory must maintain an ontological gap between the occurrence of an experience and the subsequent ability to report or remember it, or explicitly argue for their identity.
      *   **Motivation:** Amnesia does not logically entail non-existence. Collapsing these renders dream amnesia conceptually impossible rather than empirically contingent.
      *   **Status:** Non-negotiable.

  7.  **Sleep Occurrence vs. Waking Construction**
      *   **Requirement:** The theory must specify whether the dream event is temporally located during sleep or constitutes a narrative constructed at the moment of waking.
      *   **Motivation:** This is the central metaphysical dispute in dream theory. Ambiguity here renders the theory vacuous regarding the nature of sleep consciousness.
      *   **Status:** Non-negotiable.

  8.  **Phenomenon vs. Datum**
      *   **Requirement:** The theory must distinguish the dream itself (the phenomenon) from the dream report (the datum used to study it).
      *   **Motivation:** Confusing the map for the territory leads to methodological errors where the structure of language is mistaken for the structure of experience.
      *   **Status:** Non-negotiable.

  9.  **Subject vs. Processor**
      *   **Requirement:** The theory must distinguish between a system processing information (e.g., registering stimuli) and a subject undergoing an experience of that information.
      *   **Motivation:** Neural processing occurs without consciousness in many states (e.g., coma, anaesthesia). A theory of *dreaming* (as experience) must not reduce to a theory of neural activity alone.
      *   **Status:** Non-negotiable.

  10. **Content vs. Phenomenal Character**
      *   **Requirement:** The theory must account for whether the propositional content of a dream can survive the loss of its qualitative "feel" (phenomenality).
      *   **Motivation:** It is conceivable to recall *what* happened in a dream without recalling *how it felt*. A theory must explain if the "what" is sufficient for the dream to have existed.
      *   **Status:** Negotiable (functionalists may collapse this).

  ## (iii) The Empirical Findings It Must Not Contradict

  11. **REM Report Frequency**
      *   **Requirement:** The theory must accommodate the higher frequency of dream reports following REM awakenings compared to NREM, without denying NREM reports.
      *   **Motivation:** This is the most robust correlation in sleep science. A theory claiming dreaming is uniform across sleep stages contradicts data; a theory claiming it is exclusive to REM contradicts data.
      *   **Status:** Non-negotiable.

  12. **Rapid Recall Decay**
      *   **Requirement:** The theory must explain the sharp decay of dream memory within minutes of waking.
      *   **Motivation:** This suggests a specific mechanism of memory consolidation failure unique to the sleep-wake transition, which the theory must integrate.
      *   **Status:** Non-negotiable.

  13. **Stimulus Incorporation**
      *   **Requirement:** The theory must allow for external stimuli (e.g., sounds, water spray) to be causally integrated into dream content.
      *   **Motivation:** This demonstrates a causal link between the sleeping environment and the dream narrative, constraining theories that view dreams as wholly endogenous or solipsistic.
      *   **Status:** Non-negotiable.

  14. **Lucid Signalling Capability**
      *   **Requirement:** The theory must be consistent with the data showing sleepers can execute complex, pre-planned motor tasks (eye signals) while asleep.
      *   **Motivation:** This proves high-level cognitive planning and working memory are active during specific sleep phases.
      *   **Status:** Non-negotiable.

  15. **Report Variance by Stage**
      *   **Requirement:** The theory must account for variations in report length, coherence, and emotional tone across different sleep stages.
      *   **Motivation:** Dreaming is not a monolithic state; its qualitative properties shift with neurophysiology.
      *   **Status:** Non-negotiable.

  ## (iv) Explanatory and Methodological Demands

  16. **Non-Circularity**
      *   **Requirement:** The theory must not presuppose that dreams are experiences during sleep in its definition of dreaming.
      *   **Motivation:** Begging the question precludes the possibility of discovering that dreaming is a waking construction. The definition must be neutral enough to allow the question to be answered.
      *   **Status:** Non-negotiable.

  17. **Evidential Asymmetry**
      *   **Requirement:** The theory must respect that all third-person knowledge of dreams is mediated by waking reports, without concluding that dreams *are* nothing but reports.
      *   **Motivation:** We cannot observe another's dream directly. A theory must navigate the gap between private access and public verification without collapsing one into the other.
      *   **Status:** Non-negotiable.

  18. **Parsimony**
      *   **Requirement:** The theory must not posit hidden experiences where no behavioural or mnemonic trace exists, unless required to explain other data.
      *   **Motivation:** Positing unreportable experiences risks making the theory unfalsifiable.
      *   **Status:** Negotiable.

  19. **Intersubjective Testability**
      *   **Requirement:** Despite the private nature of dreams, the theory's claims must yield predictions testable by third parties (e.g., via signalling or neural imaging).
      *   **Motivation:** A theory of dreaming must be scientific, not purely metaphysical.
      *   **Status:** Non-negotiable.

  ***

  # V. Status, Conflicts, and Exclusions

  **Negotiable vs. Non-Negotiable**
  Requirements 1, 3, 4, 6, 7, 8, 9, 11, 12, 13, 14, 15, 16, 17, and 19 are marked **Non-negotiable**. These constitute the hard constraints of logic, method, and established empirical data. To violate them is to cease doing theory of dreaming and begin doing something else (e.g., pure speculation or behaviourism). Requirements 2, 5, 10, and 18 are **Negotiable**. These touch on deep metaphysical disputes (functionalism vs. phenomenalism, realism vs. instrumentalism) where a theory may take a stand that collapses a distinction, provided it pays the theoretical cost explicitly.

  **Disputes on Non-Negotiables**
  *   **Norman Malcolm** would dispute **Requirement 7 (Sleep Occurrence vs. Waking Construction)** and **Requirement 6 (Experience vs. Memory)**. He argues that the concept of "experience during sleep" is logically incoherent; for Malcolm, the dream *is* the waking impression.
  *   **Daniel Dennett** would dispute **Requirement 10 (Content vs. Phenomenal Character)** and potentially **Requirement 4 (Real-time Signalling Interpretation)**. Dennett challenges the notion of "qualia" or intrinsic phenomenal character, suggesting that what we call experience is a matter of judgment and report, not a separate internal movie.
  *   **Strict Behaviourists** would dispute **Requirement 9 (Subject vs. Processor)**, reducing the subject to the processing system.

  **Impossibility Result**
  There is a fundamental tension between **Requirement 6 (The distinction between Experience and Report)** and **Requirement 17 (Respect the Evidential Asymmetry)**.
  *Argument:* Requirement 17 acknowledges that our *only* access to dreams is through waking reports. Requirement 6 demands that we maintain an ontological distinction between the experience and the report. However, if access is *exclusively* via the report, any claim about the experience independent of the report is empirically unverifiable. To maintain the distinction is to posit entities beyond the reach of the evidence allowed by the asymmetry. A theory that rigorously respects the asymmetry is forced to collapse the distinction (making the dream identical to the report conditions), while a theory that maintains the distinction must violate the strictures of the asymmetry by inferring unobservable entities. They cannot be jointly satisfied in a strictly empirical framework.

  **Most Exclusionary Requirement**
  **Requirement 4 (The Real-time Signalling Interpretation)** does the most to exclude otherwise attractive theories.
  *Explanation:* This requirement forces the theory to accept that conscious experience occurs *during* sleep. This immediately excludes all "retrospective construction" theories (such as Malcolm's) and any theory that posits dreaming is solely a function of waking memory consolidation. It demands a realist ontology of sleep consciousness that many philosophical and psychological frameworks are designed to avoid.

  **Evaluation of Contenders**
  *   **Malcolm-style View:** Fails the list immediately on Requirements 4, 6, and 7, as it denies the logical possibility of experience during sleep, treating the dream as constituted by the waking report.
  *   **Dennett-style Challenge:** Struggles with Requirements 6 and 10, as it tends to collapse the distinction between having an experience and being disposed to make a report, viewing the "inner witness" as a theoretical fiction.
  *   **Threat Simulation Theory (Revonsuo):** Fares well on empirical constraints (11-15) and Real-time Signalling (4), but faces difficulty with the Inserted Dream (3) and Replay (5) cases regarding the specific causal origins of content versus the simulation mechanism.

  Verdict: The requirement to treat Real-time Signalling as proof of concurrent experience and the pair comprising the Distinction between Experience and Report and the Demand to Respect Evidential Asymmetry.
