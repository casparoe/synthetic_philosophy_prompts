  1. "The practice, restated"

  Insurance pricing operates not on individual prophecy but on classification. Insurers assign applicants to rating classes defined by observable traits—age, territory, vehicle type, credit scores—where everyone shares a base rate derived from the group's loss history. Individual adjustments layer atop this, such as telematics discounts or surcharges for prior claims. However, the classification itself is constrained. In health insurance under the Affordable Care Act, federal law mandates specific classes (age, geography, tobacco use) while forbidding others that might predict cost more accurately, like medical history or sex. Thus, the institution does not seek a unique metaphysical probability for your specific crash or illness. Instead, it constructs a reference class, calculates the frequency of loss within it, and charges accordingly. The practice treats the class frequency as the operational proxy for individual risk, mediated by regulatory choices that prioritize overall social goals over predictive precision.

  2. "The implicit theory of probability"

  The practice operationalizes a frequentist interpretation of probability, though it stops short of metaphysical commitment. Actuarially, the probability of loss is defined as the long-run relative frequency within the chosen reference class. When an insurer charges you based on your age bracket, it presupposes that your individual risk is adequately represented by the group's historical loss ratio. This does not necessarily assert that there is *no* further fact about your individual chance; rather, it asserts that such a fact is epistemically inaccessible or commercially irrelevant. The institution behaves *as if* the class frequency is the probability, because only class frequencies are stable enough to satisfy the law of large numbers required for solvency.

  A propensity theorist could underwrite this practice without contradiction. They would view the class rate not as the definition of your chance, but as the best available estimate of your single-case propensity. Since propensities are often hidden, the observable frequency of similar cases serves as the evidence. This approach effectively treats the reference class problem as an engineering constraint rather than a metaphysical puzzle. However, the practice does presuppose that reference classes are homogeneous enough that individual deviations average out. It assumes that within a class, there is no systematic bias left unpriced that would threaten the pool's stability.

  Crucially, the practice sidesteps the reference class problem's philosophical sting by treating class selection as a pragmatic variable. It does not presuppose a uniquely correct class waiting to be discovered. Instead, it presupposes that *some* stable class can be constructed where predictions hold. When regulations like the ACA forbid certain variables, they reinforce that the class is a policy choice, not a statistical discovery. The probability is relative to the class, and the class is relative to regulatory and market constraints. Thus, the practice presupposes a relativized frequentism: probability is real relative to a class, but the class itself is chosen based on predictive power, legal permissibility, and market stability, rather than metaphysical necessity.

  3. "Strict presupposition versus comfortable fit"

  Strictly, the practice presupposes only that loss distributions are stable within chosen classes and that the law of large numbers applies to the pool. It requires that the class be sufficiently homogeneous to prevent adverse selection from destroying the risk pool, but it does not require a specific interpretation of probability. Both frequentist and propensity views fit comfortably here. A frequentist sees the rate as the truth; a propensity theorist sees it as evidence. Both license the same premiums. Bayesian updating occurs only when an individual moves between classes, not within them.

  What the practice quietly rules out is radical subjectivism that ignores empirical frequencies, and more importantly, it rules out the feasibility of pricing true single-case chances. If individual chances were directly accessible and priced perfectly, insurance pooling would collapse into self-insurance. The practice also leaves underdetermined the moral status of the class. Statistics cannot tell us whether using credit scores is fair; that is external to the probability calculus.

  Conversely, the practice is compatible with the view that reference classes are purely social constructs. Whether the class is "natural" (biological sex) or "arbitrary" (zip code) matters less to the actuarial math than its predictive correlation with loss. The institution remains agnostic on whether the probability inheres in the individual or the group, provided the group behavior is predictable. The only strict necessity is predictability and solvency; the metaphysical grounding of that predictability is philosophically underdetermined by the pricing mechanism itself.

  4. "The two rating logics"

  Actuarial fairness and mandated community rating rest on incompatible normative premises, though they share the same probabilistic machinery. Actuarial fairness presupposes that premiums should reflect expected costs as accurately as permissible; justice lies in the proportionality between risk contributed and price paid. This logic pushes toward narrower, more predictive reference classes. Community rating, as seen in the ACA, presupposes that access to coverage is a social good that outweighs precise pricing. It mandates broader classes to subsidize high-risk individuals within the pool.

  These logics pull apart on the purpose of the premium. For the actuarial logic, the premium is a price for risk transfer based on statistical expectation. For the community logic, the premium is a contribution to a shared safety net, partially decoupled from individual expectation. However, they are not logically inconsistent within the institution because both still rely on *some* reference class. The ACA does not abolish classes; it merely widens them and forbids specific variables. Both systems presuppose that costs must be aggregated somewhere. This requires a political decision to prioritize equity over efficiency. The tension is not about probability theory but about the boundary of the moral community. Actuarial fairness defines the community narrowly (the risk class); community rating defines it broadly (the nation or state). The institution manages this by treating the reference class as a policy lever rather than a statistical constant.

  5. "If the presupposition were replaced"

  If we replaced the class-based presupposition with a serious commitment to pricing individual chance, the institution of insurance would cease to exist in its current form. Insurance relies on pooling heterogeneous risks to stabilize costs; if every premium perfectly matched the individual's specific propensity, there would be no cross-subsidization. High-risk individuals would face prohibitive costs, effectively denying coverage, while low-risk individuals would pay so little they might opt for self-insurance. Moral hazard would vanish, replaced by perfect risk alignment.

  Underwriting would transform from classification to surveillance. Instead of assigning you to a group, insurers would require real-time data on your biology, behavior, and environment to estimate your unique propensity. Telematics would become mandatory, not optional. Genetic testing would be standard. The concept of "pooling" would vanish, replaced by individualized risk accounts. This would resolve the reference class problem by dissolving the class entirely, but it would destroy the social function of insurance as a mechanism for sharing uncertainty. The institution would become a marketplace for pre-existing conditions rather than a shield against them. Ultimately, taking individual chance seriously undermines the very logic of risk transfer, revealing that insurance presupposes ignorance of the individual case as a necessary condition for its operation.
