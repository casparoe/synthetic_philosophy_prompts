          These logics pull apart on the purpose of the premium. For the actuarial logic, the premium is a price for risk transfer based on statistical expectation. For the community logic, the premium is a contribution to a shared safety net, partially decoupled from individual expectation. However, they are not logically inconsistent within the institution because both still rely on *some* reference class. The ACA does not abolish classes; it merely widens them and forbids specific variables. Both systems presuppose that costs must be aggregated somewhere. The tension is not about probability theory but about the boundary of the moral community. Actuarial fairness defines the community narrowly (the risk class); community rating defines it broadly (the nation or state). The institution manages this by treating the reference class as a policy lever rather than a statistical constant.

