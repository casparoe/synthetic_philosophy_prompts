answer: |-
  # The Unilateralist's Brake: A Field Procedure for High-Stakes Research Decisions

  **Origin:** Adapted from Bostrom, Douglas, & Sandberg (2016), *The Unilateralist's Curse*.
  **Target User:** Senior researchers facing one-off, high-consequence decisions with potential externalities.
  **Time Budget:** 30 minutes.
  **Required Resources:** One trusted colleague (for calibration), email access (to estimate peer count).

  ---

  ## Part I: The Fine Print (Assumptions & Limits)

  Before running this procedure, you must acknowledge the epistemic conditions under which it functions. This tool is not a moral oracle; it is a bias correction mechanism.

  1.  **The Independence Assumption:** The logic of the curse relies on the idea that your error is *uncorrelated* with your peers' errors. If you are all wrong for the *same* reason (e.g., a systemic blind spot in the field, shared funding bias, or identical training), the curse does not protect you—it hides a systemic cliff. This procedure treats correlated error as a distinct risk factor.
  2.  **The Observability Assumption:** The curse is strongest when you cannot see if others have already acted. If the action is secret (e.g., releasing code to a private server, publishing a preprint that might be ignored), you cannot update on their inaction. This procedure assumes low observability by default.
  3.  **The Symmetry Assumption:** This procedure assumes you are not uniquely qualified. If you possess private information that definitively proves safety or necessity which others *cannot* access, the curse weakens. However, researchers systematically overestimate their own private information. This procedure forces you to discount it.
  4.  **What This Cannot Do:** This procedure cannot resolve disputes about fundamental values (e.g., "Is knowledge inherently good?" vs. "Is safety paramount?"). It operates only on the *probability of error* given a shared goal.

  ---

  ## Part II: The Procedure

  **Instructions:** Answer the following five questions in order. Do not skip to the end. If any step triggers a **STOP**, the decision is "Do Not Act Unilaterally."

  ### Step 1: The Reference Class Check
  **Question:** Are there at least 5 other competent agents (labs, PIs, teams) globally who *could* take this same action within the next 12 months, independent of your choice?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **HALT.** The Unilateralist's Curse does not apply. Proceed with standard ethical review.
  *   **Uncertain:** Assume **Yes**. (Error on the side of caution).

  ### Step 2: The Consequence Ceiling
  **Question:** If you are the *only* one who acts, and your judgment about the net benefit is wrong (i.e., the action is actually harmful), is the harm reversible within 5 years?
  *   **Yes (Reversible):** Proceed to Step 3.
  *   **No (Irreversible/Catastrophic):** **STOP. DO NOT ACT.**
      *   *Rationale:* In a unilateralist scenario, the probability that *someone* acts approaches 1 as $N$ grows. If the cost of a single erroneous action is irreversible, the expected utility of *any* individual acting drops below the threshold, regardless of your private confidence.

  ### Step 3: The Error Correlation Test
  **Question:** Consult your colleague. Is there a reason to believe your judgment and your peers' judgments share the *same* blind spot? (e.g., Are you all using the same risk model? Relying on the same unpublished data? Incentivized by the same grant structure?)
  *   **No (Errors likely independent):** Proceed to Step 4.
  *   **Yes (Errors likely correlated):** **STOP. DO NOT ACT.**
      *   *Rationale:* If errors are correlated, you are not a check on the system; you are part of a cascade. The "wisdom of the crowd" logic fails. You must establish a new epistemic standard before moving.

  ### Step 4: The Coordination Feasibility
  **Question:** Can you delay the action for 2 weeks to attempt to contact the other agents identified in Step 1 to seek consensus or a moratorium?
  *   **Yes:** **STOP. DO NOT ACT YET.** Initiate coordination.
      *   *Rationale:* The solution to the unilateralist's curse is the "Principle of Conformity." If you can coordinate, you dissolve the curse.
  *   **No (Time pressure/Secrecy required):** Proceed to Step 5.

  ### Step 5: The Values Boundary
  **Question:** Is your confidence in the action's benefit based on a factual claim (e.g., "This containment works") or a value claim (e.g., "The scientific freedom outweighs the risk")?
  *   **Factual:** You may proceed, but you must document the reasoning and notify a neutral oversight body.
  *   **Value:** **HAND BACK TO HUMAN.**
      *   *Rationale:* This procedure optimizes for error reduction, not value arbitration. If the dispute is about values, the "curse" is irrelevant. You must own the value judgment personally. This requires signing your name to the decision explicitly, acknowledging you are breaking a norm for a principled reason.

  ---

  ## Part III: Case Applications

  ### Case A: The Pathogen Synthesis Protocol
  **Scenario:** You lead a virology lab. You have developed a streamlined synthesis route for a dangerous pathogen. You believe publishing the protocol is net positive because it allows for faster vaccine development. You know three other labs are close to the same result. You feel 80% confident the benefits outweigh the biosafety risks.

  **Running the Brake:**
  1.  **Reference Class:** Are there 5+ agents? *Yes.* (You know of 3, plus unknown actors in less regulated jurisdictions. $N \geq 5$).
  2.  **Consequence Ceiling:** Is harm reversible? *No.* Once the protocol is published, it cannot be unpublished. If a bad actor uses it, the harm is persistent.
      *   **TRIGGER:** **STOP. DO NOT ACT.**

  **Analysis:** Even though your private prior is 80% confidence, the procedure overrides this. The irreversibility of the information hazard combined with the high $N$ means the probability that *someone* (perhaps less careful than you) publishes this approaches certainty. By publishing, you normalize the action and lower the barrier for the less careful agents. The procedure forces you to accept that your "net positive" calculation is likely an outlier error in a high-stakes distribution.

  ### Case B: The Geoengineering Field Trial
  **Scenario:** You are part of a consortium considering a small-scale outdoor aerosol release. It is visible to satellites. It is partly reversible (atmosphere clears in months). You believe the data gained is vital. There are only 4 other groups capable of this. You suspect your group is more safety-conscious than the others.

  **Running the Brake:**
  1.  **Reference Class:** Are there 5+ agents? *Borderline.* (4 others + you = 5). *Proceed.*
  2.  **Consequence Ceiling:** Is harm reversible? *Yes.* (Atmosphere clears). *Proceed.*
  3.  **Error Correlation:** Do you share blind spots? *Yes.* (All use similar climate models).
      *   **TRIGGER:** **STOP. DO NOT ACT.**
      *   *Nuance:* Here, the stop is not because of irreversibility, but because of **Step 3**. If the climate models are wrong, *all* of you are wrong. Your specific safety consciousness does not protect against a shared factual error about atmospheric chemistry.

  **Alternative Outcome (if Step 3 was 'No'):**
  If we assume errors are independent, we move to **Step 4 (Coordination)**. Since the trial is visible, coordination is feasible.
  *   **Result:** **STOP. DO NOT ACT YET.** You must contact the 4 other groups.
  *   **Why:** If you act unilaterally, you signal that unilateral action is acceptable. Even if your trial is safe, you lower the normative barrier for the other 4 groups, who might be less careful. The procedure demands you secure a "normative license" from the peer group before moving.

  ---

  ## Part IV: What The Procedure Cannot Settle

  This tool is designed to prevent *erroneous* unilateralism, not *principled* unilateralism. There are three specific zones where "The Brake" fails, and you must recognize them:

  1.  **The Whistleblower Exception:** If the "harm" you are preventing is caused by the *inaction* of the community (e.g., withholding a cure during a pandemic), the Unilateralist's Curse inverts. This procedure assumes the status quo is safe and action is risky. It cannot calculate the cost of omission.
  2.  **The Asymmetric Competence Problem:** If you are genuinely, objectively more competent than the reference class (not just confident, but provably so), Step 3 becomes a lie. The procedure treats you as average to curb arrogance. It cannot validate genuine genius or unique insight. Using this procedure might suppress necessary innovation from outliers.
  3.  **The Value Pluralism Limit:** As noted in Step 5, if your decision rests on a value judgment that the community rejects (e.g., "Open source is worth the risk"), this procedure tells you to stop. But history sometimes rewards those who break norms. This procedure protects the community from you; it does not protect you from a stagnant community.

  **Final Instruction:** If you bypass this procedure's "STOP" command, you are no longer acting as a standard researcher. You are acting as a political agent. Do not hide behind "scientific necessity." State clearly: *"I am aware of the unilateralist risk, I am aware of the peer consensus, and I am choosing to override it based on [Value X]."*
