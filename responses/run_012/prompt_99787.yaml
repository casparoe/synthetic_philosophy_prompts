answer: |-
  **The Archwood Institute for Personal Agency**
  **Frequently Asked Questions for Prospective Residents and Families**

  **1. Is the Archwood Institute a medical facility?**
  No. Archwood is a residential community dedicated to the clarification of personal values and the management of life's difficulties. We operate on the scientific principle that disease must involve a demonstrable lesion in the body. Since no such lesion has been identified for conditions like depression, anxiety, or schizophrenia, we do not treat medical illnesses. We assist individuals who are experiencing conflicts in their relationships, careers, or moral frameworks. Our staff consists of coaches, legal consultants, and philosophers rather than physicians.

  **2. Do you assign psychiatric diagnoses?**
  We do not. Diagnoses such as bipolar disorder or personality disorder are metaphors that describe behavior, not biology. Using them implies a biological cause where none has been proven, which relieves the individual of responsibility for their conduct. Instead of a diagnosis, our admissions team works with you to draft a Statement of Intent. This document outlines the specific problems of living you wish to address and the strategies you intend to employ to resolve them.

  **3. What is your policy on medication?**
  We do not prescribe psychotropic medications to alter mood or perception. If a resident wishes to take medication prescribed by an outside physician, they may do so at their own discretion, provided it does not impair their ability to participate in community responsibilities. We do not monitor compliance, as medication management is a personal choice, not a medical necessity. Our focus is on talk, contract, and conduct.

  **4. How does Archwood handle residents who express suicidal ideation?**
  We respect the right of every adult to determine the course of their own life, including its termination. Suicidal statements are understood as communications of distress or intent, not symptoms of a disease requiring containment. Our staff will engage the resident in a discussion about the consequences of their choice and the impact on their community obligations. However, we do not detain residents against their will. If a resident chooses to leave Archwood to end their life, we do not intervene. We believe that protecting someone from themselves is a form of imprisonment that undermines human dignity.

  **5. What happens if a resident becomes violent or dangerous?**
  Violence is a legal matter, not a medical one. If a resident assaults another person or property, we do not evaluate them for insanity or involuntary commitment. We contact law enforcement. Archwood does not recognize the insanity defense; we operate on the premise that all adults are responsible agents capable of distinguishing right from wrong. If a resident commits a crime, they are subject to the same penal consequences as any other citizen. Our role is to maintain a safe community through contract enforcement, not to provide exemptions from the law based on emotional states.

  **6. Do you accept health insurance?**
  Generally, no. Health insurance is designed to cover medically necessary treatments for bodily diseases. Since we do not treat diseases, our services are not eligible for medical reimbursement. Some residents utilize out-of-network benefits for life coaching or legal consulting, but payment is primarily the responsibility of the resident or their family. We provide detailed invoices that describe our services as educational and residential, ensuring there is no misrepresentation of medical care.

  **7. Will Archwood provide testimony for court proceedings regarding competency or criminal responsibility?**
  We will provide factual testimony regarding a resident's conduct and compliance with community contracts, but we will not offer opinions on mental state or competency. We do not validate the concept of mental incapacity as a defense for criminal action. If a court seeks our input, we will state that the individual was treated as a responsible agent during their stay. We believe that reclassifying moral failures as medical conditions expands the therapeutic state and erodes the foundation of personal liberty.

  **8. Who decides if a problem is a difficulty of living or an illness?**
  The individual decides. However, upon arriving at Archwood, you agree to our doctrinal framework. If you believe you are sick rather than responsible, Archwood is not the appropriate environment for you. We find that many people prefer the security of the patient role, but our mission is to restore the dignity of agency. We do not adjudicate sickness because we do not believe it exists in the realm of the mind. We only address conduct that violates the social contract or hinders your stated goals.

  **9. What is the average length of stay?**
  Stay duration is determined by the completion of the Statement of Intent. There is no clinical discharge criteria because there is no clinical admission criteria. Some residents stay for weeks, others for years. The goal is not cure, but clarity. When you are ready to resume your obligations without institutional support, you leave. We do not follow up, as continued contact implies a ongoing dependency that contradicts our philosophy of self-ownership.
