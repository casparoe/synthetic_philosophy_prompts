answer: |-
  **The Two Universes**

  Universe A consists of a finite collection of material bodies with specified masses and fixed relative positions, embedded in an infinite, three-dimensional Euclidean grid of Absolute Space, such that the center of mass of the system is at rest relative to the grid. Universe B consists of the exact same material bodies with the exact same masses and relative positions, embedded in the same Absolute Space, but the entire system possesses a constant, non-zero velocity vector $\vec{v}$ relative to the grid, with all internal relative velocities and forces remaining exactly zero.

  **Consequences for the Three Positions**

  For the **Newtonian Substantivalist**, A and B are two distinct possible worlds. Because Absolute Space is a real entity with its own identity, the relation "being at rest relative to Space" is a genuine physical property distinct from "moving uniformly relative to Space." The difference is not merely in how we label the coordinates; it is a difference in the instantiation of a real relation between matter and the container. The Substantivalist accepts that these worlds are empirically indistinguishable due to the Galilean invariance of the laws, but maintains that ontological distinctness does not require empirical discriminability.

  For the **Leibnizian Relationist**, A and B are not two distinct worlds, but one world described twice over. Since space is nothing over and above the order of coexisting things, a shift in the velocity of the entire material content relative to a non-entity (Absolute Space) changes no actual relation between bodies. To claim A and B are distinct violates the Principle of the Identity of Indiscernibles: there is no observable difference between them, so there is no fact of the matter to distinguish them. Furthermore, it violates the Principle of Sufficient Reason: if A and B were distinct, there would be no reason for the universe to be in state A rather than state B, rendering the choice arbitrary.

  For the **Machian Relationist**, A and B are not even two distinct possibilities; the description of B is physically meaningless in this context. Since inertia is not an intrinsic property of matter but arises from the interaction of a body with the total distribution of mass in the universe, a velocity defined against empty space has no physical currency. In a universe containing only the laboratory and no "fixed stars" or external mass to serve as a reference, the concept of absolute velocity collapses. Without a material reference frame to define inertia, the distinction between rest and uniform motion vanishes, rendering A and B identical descriptions of the same physical state.

  **The Check: The Feature and the Variation**

  The single feature that makes this case work is **Galilean Invariance**. The laws of Newtonian mechanics are symmetric under a boost; they dictate how systems evolve based on relative positions and accelerations, but they contain no term for absolute velocity. This symmetry guarantees empirical indistinguishability, which forces the Substantivalist to posit hidden facts and the Relationist to invoke metaphysical principles like the Identity of Indiscernibles.

  If you replace the uniform velocity with a **uniform rotation** of the whole collection, the case survives but the pressure shifts dramatically. In the rotation scenario, the Substantivalist still claims A (non-rotating) and B (rotating) are distinct, but now they are *empirically* distinct: in B, the water in the bucket becomes concave due to centrifugal forces, while in A it remains flat. Here, the Substantivalist is vindicated by the presence of inertial forces. The embarrassment falls on the **Relationist**. If the entire universe rotates, relative to what is it rotating? If there is nothing external, the Relationist must claim there is no rotation, yet the water still becomes concave. The Relationist is now forced to explain the origin of these forces without appealing to motion relative to space, often requiring a complex appeal to the distant matter in the universe (which we stipulated away or made finite) or a modification of the laws. The boost case embarrasses the Substantivalist with ontological excess; the rotation case embarrasses the Relationist with explanatory deficit.

  **Defense and Reply**

  The Substantivalist's best line of defense is that **empirical indistinguishability does not entail ontological identity**. They argue that the structure of the world is not exhausted by what can be measured from within it. Just as two identical twins are distinct persons despite sharing all qualitative properties, two universes can differ in their relation to Absolute Space even if no internal experiment reveals the difference. The laws of physics describe the geometry of the container, and if the geometry allows for a shift, that shift represents a real possibility, regardless of our epistemic limitation in detecting it. To deny this is to confuse what we can know with what there is.

  The Relationist's reply is that this defense renders Absolute Space an **occult quality**. If a property makes no difference to the causal behavior of matter, it is not a physical property but a metaphysical ghost. By insisting on the reality of absolute velocity, the Substantivalist breaks the link between physics and observation, allowing for facts that are in principle inaccessible. This violates the methodological requirement that physical posits should earn their keep by explaining phenomena. If the "shift" explains nothing and predicts nothing, it is not a feature of the world, but a feature of a redundant mathematical description.

  **Analogy to General Relativity**

  This Newtonian case mirrors the "Hole Argument" in General Relativity. In that context, one can mathematically shift the metric field (the geometry of spacetime) relative to the manifold points (the substantival substrate) within a region devoid of matter. If spacetime points are real entities (substantivalism), this shift creates a distinct physical reality where the curvature is located at different points, even though all observable relations between particles remain identical. This leads to a form of indeterminism, where the laws cannot determine which shifted version is the real one. The parallel is exact: in both Newtonian boosts and Relativistic hole drags, substantivalism commits you to distinct physical states that are empirically and dynamically identical, forcing you to choose between accepting hidden ontological differences or denying the independent reality of the spacetime substrate.
