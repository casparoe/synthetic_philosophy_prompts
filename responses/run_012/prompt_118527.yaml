      *   *Who is embarrassed?*
          *   In the *boost* case (original), the Substantivalist is embarrassed by ontological excess (haecceitism/PII violation).
          *   In the *rotation* case, the Relationist is embarrassed. If the whole universe rotates, relative to what is it rotating? If nothing external, Relationist says "no rotation," but Newtonian physics says "centrifugal forces appear." The Relationist must explain the forces without absolute space. (This is the Bucket argument again, but globalized).
      *   *Does the case survive?* Yes, but the pressure shifts. In the boost case, Substantivalist pays the price (indistinguishable states). In the rotation case, Relationist pays the price (explaining inertial forces).

  6.  **Substantivalist's Defense & Relationist's Reply:**
      *   *Defense:* Empirical indistinguishability does not entail ontological identity. Two things can be physically distinct even if we can't measure the difference (e.g., hidden variables, or just the nature of space). The laws describe the structure of space, not just observations.
