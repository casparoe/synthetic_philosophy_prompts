      *   *Substantivalist Pressure:* The pressure in the *boost* case is on the Substantivalist. They must accept "hidden" facts. This is the "Shift Argument."
      *   *Rotation Pressure:* The pressure is on the Relationist. They must explain forces without absolute space.
      *   *Goal:* Help the student decide if the dispute is substantive. The boost case suggests it might be verbal (or at least ontologically costly for Substantivalists). The rotation case suggests it's substantive (forces exist). The tension between the two is where the philosophy lives.

  9.  **Final Polish:**
      *   Ensure the universe description is tight.
      *   Ensure the "Defense/Reply" section is dialectical.
      *   Ensure the GR analogy is clear but secondary.

