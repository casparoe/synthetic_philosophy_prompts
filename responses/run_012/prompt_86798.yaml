prompt: |-
  My niece is graduating from a big state univeristy in June and she's asked me to give the commencement address. She's in the philosophy-and-econ honours stream, so maybe forty people in an audience of three hundred will know what I'm on about; the rest are parents, grandparents, siblings, and the folding-chair crowd who came to see a name read out.

  I said yes. Now I'm stuck, and it's a philosophical problem, not a scheduling one. I'm a consequentialist, and for years I've been half-convinced by the cluelessness worry: even when you can see the short-run effects of an action plainly, the ripples run out through a causal web so vast and tangled, and over such a long stretch of time, that you can't have any real confidence about whether the thing made the world better or worse all told. It usually gets discussed as a problem for whether utilitarianism can give any practical guidance at all. I want to find out what it does to a podium.

  Because the assignment is: tell these kids to go out and do some good. And nearly every sentence in that genre is something I'd be asserting without a shred of warrant. 'Go into medicine, you'll save lives' — sure, and maybe you'll also spend thirty years doing something you'd rather not look at directly. 'Work on the hardest problems you can find' — warrant? 'Give a chunk of your salary to the most effective charity you can find' — that's the pitch I'd have made ten years ago, and it's exactly the one I can't now make in good faith.

  So write the address, for me, in my voice. Six to eight minutes out loud. Warm, funny once or twice, no jargon the grandparents can't follow, and it has to sound like an actual commencement speech and not a paper with jokes in it. But the cluelessness thing has to do the structural work: it should decide what I'm allowed to say and what I have to give up, and I want the speech to be honest about the giving-up instead of sliding past it. My hunch is that there's still something you can tell a person to do without knowing whether it will make the world better on balance, and I'd like the speech to arive at it rather than announce it. Don't let me cheat with 'it's about the journey' humanism that dissolves the moment you press on it. And the philosophy kids will be listening to see whether I face the hard version, so whatever I can't get around has to be said out loud, not gestured at.
reasoning: |-
  Here's a thinking process that leads to the commencement address:

  1.  **Analyze the Request:**
      *   **Speaker:** A consequentialist (likely utilitarian-leaning) academic or intellectual.
      *   **Audience:** 300 people. ~40 are Philosophy/Econ honors students (understand technical terms/concepts), ~260 are family/friends (need accessibility).
      *   **Topic:** Commencement address.
      *   **Core Conflict:** The "Cluelessness Objection" to consequentialism. (We can't know the long-term consequences of our actions, so how can we say "do good"?).
      *   **Constraint:** Must be honest about this epistemic limitation. No cheap outs (e.g., "it's about the journey," "just follow your heart"). No jargon for the grandparents, but the philosophy kids need to see the hard problem is being faced head-on.
      *   **Tone:** Warm, funny once or twice, 6-8 minutes spoken (approx. 900-1200 words), sounds like a speech not a paper.
      *   **Goal:** Arrive at a actionable recommendation *despite* the cluelessness, without lying about the uncertainty.

  2.  **Deconstruct the "Cluelessness" Problem in this Context:**
      *   *Standard Consequentialist Advice:* Maximize expected utility. Calculate outcomes.
      *   *The Problem:* Long-term outcomes are unknowable. Saving a life today might lead to a tyrant being born tomorrow. Fixing a policy might cause a crash in 50 years.
      *   *The Trap:* If I admit this too strongly, the speech becomes nihilistic ("Do whatever, who knows?"). If I ignore it, I'm lying to the philosophy students.
      *   *The Solution:* Shift the locus of evaluation from *outcomes* (which are unknowable) to *process/integrity/immediate sphere of influence* without resorting to deontology or virtue ethics explicitly. It needs to be a *consequentialist* response to cluelessness.
      *   *Potential Angle:* Expected Value vs. Actual Value. We can't know Actual Value, but we can act on Expected Value based on local knowledge. Or, focus on reducing *suffering* which is more visible than increasing *happiness*. Or, focus on maintaining the *capacity* to do good.
      *   *Better Angle:* The "Non-Identity Problem" lite. We can't control the distant future, but we can control the *quality of the attempt*.
      *   *Best Angle for a Speech:* Focus on *responsiveness* and *attention*. If the future is opaque, the only lever we have is the present quality of our engagement. It's not "the journey matters more" (which is empty); it's "the journey is the only thing you can actually influence."
      *   *Wait, the prompt says:* "Don't let me cheat with 'it's about the journey' humanism that dissolves the moment you press on it."
      *   *Okay, need a harder edge.* How about: Since we can't know the net good, we should focus on *reducing clear harms* and *building resilience*. Or, acknowledge that "doing good" is a bet, not a guarantee.
      *   *Refined Idea:* Treat life as a series of bets with unknown odds. The advice isn't "win," it's "don't rig the game against yourself" and "keep betting on things that look good locally."
      *   *Actually, let's look at the "Cluelessness" literature.* Lenman? Greaves? The response is often about *expected* value. But for a speech, "maximize expected value" is dry.
      *   *Let's try this:* Admit the blindness. Then argue that because we are blind to the long term, the only honest strategy is to tend to the immediate vicinity with extreme care. Not because the "journey" is nice, but because the *causal chain starts there*. You can't steer a ship from the shore. You have to be on the boat.
      *   *Key constraint:* "It has to be honest about the giving-up." I need to explicitly say: "I cannot tell you that X will make the world better."
      *   *The Pivot:* I can tell you to be the kind of person who is *capable* of recognizing good when it appears, and *willing* to bear the cost of uncertainty.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, the niece, the mix of people. Set the scene. (Warmth).
      *   **The Hook:** The standard commencement advice ("Go change the world!").
      *   **The Problem (for the philosophy kids):** Introduce Cluelessness without using the word "Cluelessness." Explain the causal web. The butterfly effect problem. (Accessibility for grandparents: "ripples").
      *   **The Concession:** Admit I can't promise that medicine/charity/activism *will* work. This is the "giving up" part.
      *   **The Turn:** If we can't see the end, what do we hold onto?
      *   **The Argument:** We act on *local* knowledge. We reduce *visible* suffering. We maintain our *integrity* so we don't become part of the problem.
      *   **The Conclusion:** A charge to the graduates. Not to be heroes, but to be attentive.

  4.  **Refining the Tone:**
      *   Needs to sound spoken. Short sentences. Rhetorical questions.
      *   Humor: Self-deprecation about being a philosopher/economist. The folding chairs.
      *   Avoid: "Deontology," "Utilitarianism," "Epistemic limitation." Use: "Counting the good," "Knowing what happens," "Blindness."

  5.  **Addressing the "No Cheat" Constraint:**
      *   I need to make sure I don't slip into "Just be kind." Kindness is a virtue ethic move. I need to keep it consequentialist-adjacent.
      *   *Idea:* Focus on *risk management*. Since we don't know the upside, minimize the downside. Don't be a monster. That's knowable.
      *   *Better Idea:* Focus on *Expected Value* but framed as "best guess." "Act on your best map, even if the territory is hidden."
      *   *Best Idea:* The speech should argue that *acknowledging* the uncertainty is itself a moral tool. It prevents arrogance. It makes you humble. Humility prevents catastrophic errors. Therefore, admitting cluelessness *is* the strategy for doing good.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Hi everyone. Proud of my niece.
      *   Usually, speakers say "Go fix climate change."
      *   But I'm a consequentialist. I care about results.
      *   Problem: I don't know the results. Saving a life might lead to war.
      *   So I can't promise you that your work will matter.
      *   But you have to do something.
      *   So, do what looks best right now, but stay humble.
      *   Don't burn out trying to save the universe. Save the room you're in.
      *   Because the universe is too big to calculate.
      *   Go forth.

      *Critique 1:* A bit too simple. Needs more weight on the "giving up" part. The philosophy students need to feel the tension.

  7.  **Writing - Iteration 2 (Focusing on the "Cluelessness"):**
      *   Make the "Cluelessness" the centerpiece.
      *   "I am supposed to tell you how to make the world better. I have spent my career studying how to measure 'better'. And I have come to the conclusion that I can't."
      *   That's a strong opening.
      *   Then explain why (the causal web).
      *   Then the pivot: If we can't measure the total good, we measure the *local* good.
      *   And we accept the risk.
      *   The advice: Be willing to act without guarantees.

  8.  **Final Polish (incorporating constraints):**
      *   Check word count (6-8 mins is roughly 900-1100 words at a moderate pace).
      *   Ensure grandparents understand "causal web."
      *   Ensure philosophy kids see the "Cluelessness Objection."
      *   Ensure no "journey" clichés.
      *   Ensure the ending is actionable.

      *(Self-Correction during drafting)*: I need to be careful not to sound nihilistic. The point isn't "nothing matters." The point is "you can't know *how much* it matters, so don't let the paralysis stop you."
      *Actionable advice:* "Tend to the garden in front of you." No, too cliché. "Reduce the suffering you can see." Yes. "Keep your hands clean." Yes. "Stay in the game."

      *Let's try to find a specific consequentialist workaround.* If long-term consequences are unknowable, *expected value* relies on short-term proxies. So, advise them to trust robust short-term proxies (alleviating pain, increasing knowledge) while admitting the long-term is a black box.
      *Actually, the prompt asks to arrive at what you can tell a person to do.*
      *Recommendation:* Act on the best available evidence, but hold your conclusions lightly. The moral virtue is *epistemic humility*.

      *Wait, one more check:* "Don't let me cheat with 'it's about the journey' humanism."
      *Okay, so the advice must be about *impact*, just a limited kind.*
      *Advice:* Focus on *reducing clear harms* rather than *maximizing abstract goods*. Harms are more visible than distant goods.

      *Let's write.*

      *Structure:*
      1. Intro: Pride, the setting, the folding chairs.
      2. The Assignment: "Do Good."
      3. The Problem: The Causal Web (Cluelessness).
      4. The Concession: I can't promise you success.
      5. The Pivot: If the future is dark, look at your hands.
      6. The Advice: Reduce visible suffering, maintain integrity (to avoid accidental harm), keep trying.
      7. Conclusion: The bet.

      *Word Count Check:* 130 words per minute x 7 minutes = 910 words. I'll aim for around 1000 to be safe.

      *Tone Check:* Warm but intellectually rigorous.

      *(Final thought before drafting)*: Make sure the niece gets a specific nod.

      *Let's go.*
answer: |-
  Thank you. It is a genuine honor to be here. I want to start by congratulating the Class of [Year], and specifically my niece, [Niece's Name]. I am incredibly proud of you. To the parents, grandparents, and siblings: thank you for the folding chairs, the flowers, and for tolerating the length of this ceremony. I promise to keep my part under eight minutes.

  Usually, this is the part of the ceremony where the speaker tells you to go out and change the world. You are given a marching order: *Solve climate change. Fix the economy. Cure disease.* The implication is that if you work hard enough, the world will get better, and you will be able to see that improvement.

  I am here to tell you that I cannot, in good faith, make that promise to you.

  Some of you know I work in philosophy and economics. For the last twenty years, I have studied how we measure the "good" we do in the world. I am a consequentialist. That means I believe actions are judged by their outcomes. If you want to do good, you should do what produces the best results.

  But there is a problem. It's a problem that keeps me up at night, and today, I'm going to share it with you.

  Imagine you save a life today. That is clearly a good thing. But that person goes on to have children, and their children have children. One of their descendants, three hundred years from now, might start a war. Or invent a plague. Or discover a cure for cancer. The ripples of that single action spread out through time in a web so vast and tangled that no human mind can trace it.

  This is known, in my field, as the problem of "cluelessness." Because the future is opaque, we cannot know if our actions, all things considered, actually make the world better or worse.

  So, when I stand here and look at you, and I think about telling you to "go do good," I hit a wall. I cannot tell you that becoming a doctor will save lives on balance, because I don't know what those saved lives will do. I cannot tell you that donating to charity is the optimal choice, because I can't calculate the long-term economic ripples. To promise you that your work will definitely improve the future is to pretend I have a crystal ball. I don't. None of us do.

  Now, for the forty or so philosophy and econ majors in the front row: I know what this sounds like. It sounds like I'm about to tell you that morality is impossible, or that we should all just go home and eat ice cream.

  It sounds like I'm going to tell you that "it's the journey that matters," or "just follow your heart." I am not going to do that. Those are comforting lies. The consequences *do* matter. The world *does* get better or worse based on what you do. We just can't see the final score.

  So, if I can't promise you success, and I can't tell you to ignore the outcome, what is left? What can I actually tell you to do?

  I can tell you this: Since we cannot see the distant future, we must become experts on the immediate present.

  Because the causal web is too big to map, you cannot aim for "The Greater Good" as a distant target. You have to aim for the good that is visible to you. You can't know if you will save the world in 2080. But you can know if you are alleviating suffering in this room, in this year, in this neighborhood.

  The cluelessness objection doesn't mean we stop acting. It means we stop posturing. It means we give up the arrogance of thinking we are the architects of history. We are not. We are gardeners. We tend to the patch of ground in front of us. We pull the weeds we can see. We water the plants that are thirsty. We do this not because we know exactly what the forest will look like in a century, but because a tended patch of ground is better than a neglected one *now*.

  This changes the assignment. It means your job is not to be a hero. Heroes are obsessed with legacy. Your job is to be a responsible agent.

  This requires two things. First, it requires you to reduce the harms you can actually see. If you see someone in pain, help them. If you see a system that is crushing people, push back. Do not let the fear of unknown future consequences paralyze you from addressing the known present suffering. The pain in front of you is real, even if the benefit of fixing it is uncertain.

  Second, and perhaps more importantly, it requires you to maintain your own integrity. Since you cannot predict the external consequences of your actions, you must control the internal quality of them. Do not lie. Do not cheat. Do not become the kind of person who justifies cruelty today for the sake of a "better tomorrow." We have seen enough of that in the twentieth century. If the future is a black box, do not put monsters inside it.

  To the graduates: You are entering a world that is desperate for certainty. People want leaders who promise them that if they just vote for this person, or buy this product, or follow this ideology, everything will work out.

  You now know better. You know that the causal web is too tangled for guarantees. You know that doing good is a bet, not a calculation.

  So, make the bet.

  Act on your best evidence. Tend to your immediate vicinity. Reduce the suffering you can witness. And when you fail—and you will fail, because you are human and the world is complex—do not collapse into cynicism. Acknowledge the uncertainty. Stay humble.

  I cannot tell you that you will save the world. I cannot tell you that your efforts will tip the scales toward utopia. But I can tell you that there are people in this room, and in the communities you are about to enter, who will be better off if you show up, pay attention, and act with care.

  That is enough. It has to be enough. And I believe, looking out at you today, that it is.

  Congratulations.
