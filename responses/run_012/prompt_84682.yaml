answer: |-
  Colleagues, guests, and friends.

  We are gathered here to mark an occasion that is, by its nature, incomplete. We speak in the name of John von Neumann, invoking a set of lectures that were never delivered in their final form, a manuscript left unfinished at the time of his death, and a comparison between the nervous system and the calculating machine that was intended as a probe rather than a verdict. The text we honor is fragmentary. It is appropriate, then, that our conversation today should resist the comfort of a settled conclusion.

  There is a common shorthand that circulates outside this room, and perhaps sometimes whispers within it, which suggests that this venue exists to celebrate a specific identity: the brain is a computer. It is a slogan that serves well enough for grant applications and popular science covers, but it does not survive contact with the text we are here to consider. If we read the Silliman Lectures closely, we do not find a declaration of identity. We find something more rigorous and more unsettling. We find a structural comparison used deliberately to locate its own breaking points.

  My purpose this morning is not to resolve the relationship between neuromorphic engineering and the philosophy of mind. Instead, I want to propose that the productive work of this symposium lies precisely in the tension that von Neumann left open. He did not use the computer to explain the brain. He used the computer to measure where the brain ceases to behave like a machine we understand.

  For the engineers in the room, those who design silicon substrates that mimic spiking dynamics, this tension is often treated as a constraint to be optimized away. You build circuits that respect the all-or-nothing nature of the action potential. You treat the spike as a digit, a discrete event in time. This is a necessary starting point. But von Neumann's analysis suggests that if we stop there, we have missed the phenomenon. He observed that while the spike itself is discrete, the conditions that produce it are not. The threshold is not fixed; the timing is not absolute; the chemical environment is graded and continuous.

  If the neuron were simply a logic gate, the nervous system should be far more fragile than it is. A digital computer relies on precision. If a voltage drops below a specific threshold, the bit is lost, and the calculation fails. The nervous system operates with components that are slow, noisy, and prone to failure individually, yet the system as a whole achieves a reliability that our most robust architectures envy. Von Neumann pointed out that the brain does not achieve this through the exactitude of the symbol, but through the statistics of the ensemble. It is not the single spike that carries the message, but the frequency, the pattern, the coincidence of firing across a massive parallel field.

  For the hardware architects, this is a challenge to the unit of analysis. We tend to build neuromorphic chips where the neuron is the atom. Von Neumann speculated that this might be a category error. He wondered if the true functional unit might be smaller—perhaps the synapse, or a specific region of the dendritic tree—or perhaps larger, involving the statistical behavior of clusters. If the brain's reliability emerges from the statistical smoothing of noisy components, then a architecture that seeks to minimize noise at the transistor level might be optimizing for the wrong virtue. We might be building machines that are too precise to be robust. The lesson from the text is not that we should copy the brain's components, but that we should copy its tolerance for error. The engineering challenge is not to make the spike digital, but to make the computation statistical.

  This brings us to the second layer of the tension, one that concerns the neuroscientists and cognitive scientists here. You are rightly wary of the computer metaphor. You have seen it used to flatten the richness of biological process into a flowchart of information processing. You listen for whether I am treating the analogy as an identity claim. I am not. Nor, I argue, was von Neumann.

  When he compared the nervous system to a digital computer, he was working with the only formal language of organization available to him at the time. But he used that language to highlight what the brain is *not*. He noted the discrepancy in speed. The switching speed of a neuron is orders of magnitude slower than the vacuum tubes of his machines, yet the brain solves perceptual and motor problems in steps that are far fewer. A computer solves a problem through billions of rapid, sequential steps. The brain solves it through fewer, slower, massively parallel steps.

  This suggests that the logic of the brain is not the logic of sequential derivation. For the cognitive scientist, this means that searching for a "program" in the brain may be futile if we define a program as a sequence of instructions. The organization is likely structural rather than sequential. The memory is not stored in a separate bank addressed by a pointer; it is likely distributed across the connectivity weights themselves. Von Neumann's comparison forces us to admit that our standard models of computation—models based on the separation of memory and processing—may be fundamentally ill-suited to describe a system where the wiring is the memory.

  This is where the metaphor stops being a map and starts being a mirror. It reflects the limitations of our own mathematical tools back at us. We describe the brain using mathematics that was developed to describe physics and logic, not biology. We assume that because we can model a neuron with an equation, the neuron is executing that equation. But the model is external. The question von Neumann left hanging is whether the internal operations of the nervous system correspond to any mathematics we currently possess.

  This leads us to the third and most difficult layer, the one reserved for the philosophers and the historian in our midst. It concerns the nature of the language itself. Von Neumann suggested that the language the brain uses to process information internally may not be the language of conscious mathematics. We write equations on paper using symbols that stand for quantities. We assume the brain does something similar with spikes. But he raised the possibility that the internal code is of a different logical type.

  Consider the issue of precision. In our external mathematics, precision is a virtue. We carry decimal places. We correct errors. In the nervous system, precision is often irrelevant. The system works with approximations, with fuzzy boundaries, with signals that degrade and are restored not by error correction codes but by redundancy. If the internal language of the brain is statistical rather than symbolic, then our attempts to translate neural activity into logical propositions may be suffering from a translation error. We are trying to read a statistical texture as if it were a digital text.

  For the philosopher of mind, this opens a profound epistemological gap. If the brain's internal language is not the language of logic, then the relationship between neural process and conscious thought becomes even more opaque. We experience our thoughts as propositional. I think, therefore I am. I decide to lift my arm. But if the underlying machinery is operating on a logic of probability and timing that does not map cleanly onto propositions, then consciousness may be a user interface that hides the true nature of the computation. We are not seeing the code; we are seeing the dashboard.

  Von Neumann did not solve this. He could not. He was working at the edge of what could be said with the mathematics of the mid-century. He offered this not as doctrine, but as mathematically guided speculation. He knew the text was unfinished. He knew the comparison was provisional. And this is why we must not tidy up his position for him.

  There is a temptation, when invoking a name like von Neumann, to treat his fragments as ordinances. We want to say, "He proved the brain is a computer," or "He proved it is not." But the value of this lecture series lies in honoring the uncertainty he left behind. He stood between two worlds: the world of the machine, which was becoming deterministic and precise, and the world of the organism, which remained stochastic and analog. He did not choose one over the other. He held them in tension.

  For the historian of mathematics here, I acknowledge that this reading relies on the unfinished state of the lectures. It relies on the hints dropped in the margins of the comparison rather than the central argument of the chapters. If one reads the text looking for a definitive taxonomy of neural function, one will be disappointed. But if one reads it as a record of a specific mind grappling with the limits of its own tools, the fragments become significant. The breaks in the argument are not failures of the text; they are markers of the boundary where the known meets the unknown.

  So, where does this leave us, here and now?

  For the engineers, it means that when you design your next architecture, you should not ask only how to make the spike more digital. Ask how to make the noise more functional. Ask how to build reliability out of uncertainty. Do not fear the analog drift in your memristors or the jitter in your timing. That may not be a bug. It may be the feature that allows the system to learn without collapsing.

  For the scientists, it means that when you model a network, you should not assume that the success of the model proves the mechanism. A model that replicates behavior using digital logic does not prove the brain uses digital logic. It only proves that digital logic can mimic the output. The internal structure may still be opaque. We must remain humble about the isomorphism between our models and the tissue.

  For the philosophers, it means that the hard problem of mind is compounded by a hard problem of language. If the brain speaks a language we do not yet know how to speak, then our philosophical categories—belief, desire, representation—may be high-level abstractions that miss the ground truth of the mechanism. We are debating the software while unsure if there is any software at all.

  We are here to do work. That work is not to close the gap between the neuron and the transistor. It is to understand what lives in that gap. Von Neumann's legacy is not the computer, and it is not the brain. It is the comparison itself. It is the rigorous act of holding two different systems side by side and measuring the distance between them.

  If we treat the brain as a computer, we risk ignoring the biology. If we treat the computer as a brain, we risk ignoring the logic. But if we treat the comparison as a tool for finding limits, we have a methodology. We can ask: Where does the digital metaphor break? What happens at the break? Is there a different kind of mathematics waiting there?

  The text we honor is unfinished. Our understanding is unfinished. The machines we build are unfinished. Let us not rush to complete the picture. Let us instead ensure that the tension remains audible. Let us build architectures that respect the noise. Let us formulate theories that respect the ambiguity. And let us acknowledge that the most important insights may come not from the points where the brain and the computer match, but from the points where they diverge.

  In that divergence, there is work for the hardware, there is work for the science, and there is work for the philosophy. It is that shared work, in the space of the unresolved, that I invite you to begin.

  Thank you.

  ***

  **PRIVATE NOTE TO SPEAKER**

  **Contested Interpretive Claims:**
  1.  **The "Unit of Analysis" Speculation:** In the speech, I suggest von Neumann wondered if the neuron was the wrong unit of analysis (favoring synapse or dendrite). While von Neumann did discuss the complexity of the neuron and the possibility that the "organ" of memory might be distinct from the switching element, attributing a specific doubt about the neuron *as the unit* is slightly extrapolated from the text. He mostly treats the neuron as the primary switching element but notes the complexity of the synapse. A strict historian might argue he was more committed to the neuron-as-relay model than I imply, though he acknowledged the chemical transmission complexities.
  2.  **The "Internal Language":** I frame his view on the brain's internal language as "not the language of conscious mathematics" and potentially statistical/non-symbolic. This is the most philosophically charged interpretation. Von Neumann did distinguish between the "primary language" of the brain and the secondary language of mathematics, suggesting the former might be of a different logical structure. However, some scholars argue he still believed it was fundamentally arithmetic, just in a different base or precision regime (low precision arithmetic vs. high precision). My reading leans toward the "different logical type" interpretation favored by some philosophers of mind (like McCulloch's contemporaries), but it is not the only reading.
  3.  **Reliability via Statistics:** I state he believed the brain achieves reliability through statistics/parallelism rather than exact symbols. This is generally supported by his discussion of pulse frequency modulation and the high reliability of the system despite low component reliability. However, he also spent significant time trying to map logical structures onto neural nets, suggesting he hadn't fully abandoned the symbolic mapping.

  **Where the Reading is Most Likely to Fail:**
  *   **Historical Literalism:** The historian in the audience might object if I imply von Neumann had a coherent "theory of noise" comparable to modern information theory. He was aware of Shannon, but his integration of noise into the *logical* structure of the brain was speculative. If he viewed the noise merely as a nuisance to be averaged out rather than a functional component of the code, my encouragement to engineers to "make the noise functional" projects a modern neuromorphic view onto a 1950s structuralist view.
  *   **Identity vs. Analogy:** While I emphasize the analogy, von Neumann *did* write the book to explain the computer *using* the brain as a reference point as much as the reverse. There are passages where he treats the similarity as quite strong. If the historian presses on whether he viewed the brain as a *type* of computer (even if a unique one), my insistence on the "breaking points" might seem like I'm softening his actual conviction that the brain *was* a computing machine, just a unique one.

  **Specific Textual/Historical Considerations for Revision:**
  *   **The Silliman Context:** The lectures were intended for a general academic audience, not just specialists. This might mean some of the speculation was rhetorical rather than technical. If evidence suggests he tightened these claims in private correspondence (e.g., with Bigelow or McCulloch), I should be more cautious about treating the published text as his final technical word.
  *   **The "Language" Remark:** The specific claim that the brain's language is not mathematical rests on his distinction between the "logic" of the brain and the "mathematics" we use. If further scholarship shows he believed the brain's language *was* mathematical but simply non-decimal (e.g., pulse frequency coding), my philosophical hook for the audience weakens. I should be prepared to pivot to "different *kind* of mathematics" rather than "not mathematics."
  *   **Unfinished State:** Because the manuscript was edited posthumously (by his wife and colleagues), there is a risk that the "speculative" tone is partly an artifact of the editing process to fill gaps. I must remain humble about attributing intentional ambiguity to him versus acknowledging the text is simply incomplete.
