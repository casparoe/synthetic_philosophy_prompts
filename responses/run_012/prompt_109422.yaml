  ### The two accounts

  The structural account posits that letter identity relies on invariant topological properties. An 'a' exists only if its skeleton maintains specific connections: a closed counter joined to a stem. Identity is discrete; violating these constraints destroys the letter instantly. It treats recognition as rule-based parsing of geometric essentials. Conversely, the prototype account argues there is no single invariant core. Instead, 'a'-ness is a graded similarity to a learned central tendency within a perceptual feature space. Weights for specific features are acquired through exposure to a community's writing. This model allows a "deformation budget," permitting unlimited variance along some dimensions while restricting others. Where structuralism sees a sharp threshold of legibility, prototype theory sees a fading gradient. Structuralism prioritizes logical necessity in form; prototype theory prioritizes statistical likelihood in perception. One demands structural integrity, the other demands familial resemblance. Both attempt to explain how variable physical marks map onto stable linguistic categories, but they disagree fundamentally on whether that mapping relies on hard constraints or soft averages. The structuralist sees a switch; the prototypist sees a dial. This distinction shapes how each theory predicts failure modes in recognition tasks and handles edge cases in typography. Consequently, error handling differs significantly between the models.

  ### The three phenomena

  Phenomenon (a), the instant legibility of wildly stylized forms, favors the prototype account. A decorative 'a' may violate strict skeletal rules yet remain instantly recognizable because it retains high similarity to the learned central tendency. Structuralism struggles here unless its definition of "skeleton" becomes overly abstract, losing predictive power. Phenomenon (b), where tiny deformations destroy legibility while large ones do not, supports a hybrid view but highlights structural vulnerabilities. Breaking a closed counter (a tiny change) kills the letter, supporting structural constraints. However, warping the stem significantly (a large change) preserves identity, supporting the prototype's deformation budget. This suggests the feature space has ridges where movement is costly and valleys where it is free. Phenomenon (c), historical variance, strongly favors the prototype account. The Carolingian 'a' and modern single-story 'a' share little geometric overlap. Structuralism must posit such abstract invariants that they become vacuous, whereas prototype theory accommodates shifting central tendencies over time. The prototype model better explains how we recognize letters across diverse typefaces and eras without requiring a universal geometric constant. However, structuralism better explains the categorical cliff-edge where a specific topological break occurs. Thus, (a) and (c) lean prototype, while (b) reveals the necessity of structural constraints within the perceptual space. Neither account fully captures all three phenomena alone; the tiny fatal flaw suggests hard limits exist within the soft gradient of similarity. The structural account explains the crash; the prototype account explains the glide. Together they map the boundaries of the deformation budget, showing that while most features are flexible, specific topological closures act as hard anchors preventing total category collapse. Ultimately, the prototype account handles diversity better, but structuralism explains the binary nature of reading failure. We do not read "mostly an a"; we read "a" or "not a." This binary output requires some structural trigger, even if the input processing is prototypical. The tension between continuous perception and discrete linguistic function is the core conflict revealed by these phenomena.

  ### Rivals or complements

  Are they genuine rivals? Superficially, yes: one claims discrete identity, the other graded similarity. However, they likely describe different levels of the same cognitive process. The prototype account describes the perceptual input stage, where visual data is matched against weighted averages. The structural account describes the categorical output stage, where the brain must commit to a discrete linguistic symbol for language processing to proceed. Reading requires discrete units to function combinatorially; perception tolerates noise. Therefore, they are complements: perception is prototypical, but categorization is structural. However, both accounts miss a crucial ingredient: social convention. Neither form nor perception alone dictates identity. An 'a' is an 'a' because a community agrees to treat it as such. This convention is historical and arbitrary. If a community decided a triangle was 'a', it would be. Perception tracks these conventions, it does not dictate them. The structural constraints are not laws of nature but laws of usage. The prototype is not a natural kind but a statistical reflection of cultural artifacts. Without this social layer, both accounts mistake the mechanism of recognition for the source of identity. The letter exists in the intersubjective space of communication, not merely in the retina or the geometry. Thus, the accounts are partial descriptions of the tracking mechanism, not the grounding of the category itself. They explain how we see, not why we agree. To fully adjudicate, one must acknowledge that the "budget" for deformation is set by social agreement, not just perceptual capacity. We tolerate variation because our community tolerates it.

  ### Verdict

  The prototype account offers a superior explanation for the flexibility of letter recognition across styles and eras, accommodating the deformation budget that structuralism cannot easily quantify. However, structuralism correctly identifies the catastrophic failure points where topological breaks disrupt processing. Neither is sufficient alone. The true account requires a third ingredient: social convention. Letter identity is not intrinsic to form or perception but is a normative status granted by a linguistic community. Perception and structure are merely the tools we use to navigate these conventions. Therefore, the puzzle is not solved by geometry or psychology alone, but by acknowledging the historical arbitrariness of the sign. The 'a' is a stable target only because we collectively agree to aim at it. We recognize 'a's because we are trained to ignore certain differences and highlight others. The verdict is that identity is conventional, tracked by a hybrid perceptual system that utilizes both graded similarity and hard constraints to maintain communicative stability amidst visual chaos. Both models are necessary but insufficient without this normative context.
