answer: |-
  It is hot under these lights, and this gown is heavy. I know the feeling. I've worn it for thirty-eight years. Usually, I stand behind a lectern and talk about arguments other people made. Today, I want to talk about a notebook I keep in my desk drawer.

  For twenty years, I've carried this notebook. On the back page, I have written eight claims. I wrote them in ink. I haven't crossed one out. I believe them flatly. I don't hold them loosely. I don't think they are "probably" true. I believe them.

  Here is what is on the back page:

  I believe this town smells like cut grass and diesel in July.
  I believe my brother is the better man than I am.
  I believe kindness is more useful than cleverness.
  I believe I have never lied to a student about their work.
  I believe water boils at 212 degrees at sea level.
  I believe you will miss this place within five years.
  I believe love is a thing you build, not a thing you find.
  I believe it is going to rain later this afternoon.

  Those are the claims. They are not hypotheses. They are not opinions I'm willing to debate over coffee. They are the ground I stand on.

  But on the front page of that same notebook, in the same pen, I wrote this: *At least one of the things on the back page is false.*

  I have lived with those two pages for two decades. I know the claims are flat. I also know the set contains an error. I don't know which one. It might be the boiling point. It might be about my brother. It might be about the rain. But I know one of them is wrong.

  I am not telling you this to show you how clever I am. I am telling you because you are leaving here tomorrow morning, and you are going to have to live inside this same tension.

  You are going to sign a lease on an apartment you haven't seen. You are going to take a job based on a description written by a stranger. You are going to look at a person across a table and decide to spend your life with them. You will do these things on claims. You will say, "This is the right city." "This is the right work." "This is the right person."

  You will say those things flatly. You cannot say them any other way. You cannot sign a lease saying, "I am seventy percent sure this roof doesn't leak." You cannot marry someone saying, "I hold the plausible view that I will love you." You have to put your weight down. You have to believe the claim.

  But you also know, if you are honest, that you are like me. You know that somewhere in your stack of certainties, there is a mistake. You will misjudge a friend. You will misunderstand a contract. You will be wrong about the weather.

  The temptation is to soften the claims. To hedge. To say, "Well, nothing is certain." That is mush. It doesn't help you book the flight. It doesn't help you love your spouse.

  The other temptation is to pretend you are infallible. To pretend that because you believe it, it must be true. That is arrogance. It breaks when the error shows up.

  Here is how you act tomorrow morning: You act on the claim, not on the certainty.

  You book the ticket. You say the vows. You move across the country. You put your full weight on the foot, even though you know, intellectually, that one step in your journey might land on a stone you didn't see. You do not hover. Hovering is not humility; it is paralysis.

  When the error reveals itself—and it will—you do not collapse. You do not say, "I knew nothing." You say, "This one was false." You cross it out. You write a new one. You keep the notebook.

  My colleagues know that logic says these two pages shouldn't sit together. But life says they must. You need the conviction to move, and you need the honesty to correct course.

  So go out there. Believe your claims. Build your life on them. And keep a pen in your pocket for the day you need to change one.

  It's going to be a good life. And yes, I believe that too.

  Thank you.
