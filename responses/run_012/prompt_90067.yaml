prompt: |-
  I'm in a second-year grad seminar on causation and I have to lock in a paper topic this week; I've settled on causation by omission, but before I start defending anything I want the spec sheet first -- what does a theory of causation by omission actually have to deliver to count as adequate? The reason I want that rather than a survey is that alot of the time the authors in this area seem to be talking past each other, and I'm pretty sure its because each of them has quietly picked a different requirement as the one that matters (one cares about the ordinary-language verdicts, another about keeping causation a mind-independent natural relation with no normative residue, another about not letting the class of causes balloon). So: give me the requirements list, with the case or consideration motivating each requirement, and say for each whether it's non-negotiable or just a commitment of one camp.

  Roughly what I want on it: the core cases it has to get right (the gardener who doesn't water, the doctor who never shows, the drowning swimmer and the bystander scrolling on his phone, double prevention where someone's failure lets a chain that would otherwise have been cut short run to completion); the profligacy problem -- if every absence of a but-for condition counts as a cause then every event has infinitely many omission-causes, so the theory must either restrict the class or explain why we shouldn't care; the action/omission asymmetry, and whether a theory is allowed to just explain it away; the finding from the vignette studies that whether we're willing to say someone caused something by not acting seems to track whether they violated some norm, which is awkward for anyone who wants causation to be value-free; whether omissions need agents at all (does a thermostat that fails to kick the furnace on, so the pipes freeze, stand on the same footing as a person who fails to act?); and the relation between causation and causal explanation, since alot of people suspect omissions explain without causing. I'll also throw in three cases I'd like you to run against the final list, because I think they're where the accounts come apart: (a) a factory that never installs a filter it was under no obligation to install, and the river downstream dies -- a but-for omission that violated no norm; (b) a supervisor who fails to notice that the safety inspector failed to show up, i.e. an omission about an omission; (c) someone who doesn't warn a stranger about a hazard they could easily have mentioned -- no duty, no special relationship, but it sure feels like their silence had something to do with what happened.

  Once the list is up, flag any pair of requirements you think can't be satisfied together -- that's the part I actually want, because I suspect the whole literature is a fight over which one to give up -- and tell me which single requirement does the most work seperating the candidate theories. Then a short scorecard: counterfactual-dependence accounts, the norm-based accounts of causal selection, the eliminativist line that omissions never cause and only figure in explanations, and whatever powers/dispositional story is current. And be honest about the soft spots: tell me which of your requirements I'd most likely be wrong to treat as fixed, and what argument or case would change your verdict on the conflicting pair -- I'd rather find that out now than three drafts in.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Second-year grad seminar on causation.
      *   **Task:** Create a "spec sheet" for a theory of causation by omission.
      *   **Goal:** Identify requirements/constraints, distinguish non-negotiables from camp-specific commitments, highlight tensions/trade-offs, and evaluate existing theories against this spec.
      *   **Specific Inputs:** Core cases (gardener, doctor, bystander, double prevention), profligacy problem, action/omission asymmetry, norm-sensitivity (vignette studies), agents vs. non-agents (thermostat), causation vs. explanation.
      *   **Test Cases:** (a) Factory/no filter/no obligation, (b) Supervisor/omission of omission, (c) Stranger/no warning/no duty.
      *   **Critical Output:** Flag incompatible requirements, identify the "splitter" requirement, scorecard of theories, and advise on which requirement is most vulnerable.
      *   **Tone:** Academic, precise, candid about trade-offs (no sugar-coating the problems).

  2.  **Deconstruct the "Spec Sheet" (Requirements List):**
      *   I need to categorize the user's points into distinct theoretical constraints.
      *   *Constraint 1: Intuitive Verdicts (The Core Cases).* Needs to handle the Gardener (cause), Bystander (non-cause), Doctor (cause).
      *   *Constraint 2: Profligacy/Abundance.* Needs to stop the "infinite causes" problem (e.g., me not watering the plant in Africa).
      *   *Constraint 3: Metaphysical Purity (Naturalism).* Causation should be mind-independent, physical, non-normative.
      *   *Constraint 4: Normative Sensitivity.* Causation tracks duties/expectations (based on experimental data).
      *   *Constraint 5: Agent-Neutrality.* Can non-agents omit? (Thermostat).
      *   *Constraint 6: Causation vs. Explanation.* Are omissions *causes* or just *explanatorily relevant*?
      *   *Constraint 7: Double Prevention.* Handling cases where an omission prevents a preventer.

  3.  **Evaluate "Non-Negotiable" vs. "Camp Commitment":**
      *   *Non-Negotiable:* Internal consistency, ability to handle double prevention (since it's logically structurally identical to standard omission cases in counterfactual terms).
      *   *Camp Commitment:* Metaphysical Purity vs. Normative Sensitivity (this is the big fight). Causation vs. Explanation (eliminativism vs. realism).

  4.  **Analyze the Tensions (The "Incompatible Pair"):**
      *   The biggest tension is between *Metaphysical Purity* (causation is physical/natural) and *Normative Sensitivity* (causal selection tracks duties).
      *   If causation is purely physical, omissions (nothings) can't be causes.
      *   If causation tracks norms, it's not purely physical.
      *   *Verdict:* You can't have a naturalistic relation that is also sensitive to normative expectations without redefining one of them.

  5.  **Identify the "Splitter" Requirement:**
      *   What divides the literature most? It's the **Profligacy vs. Naturalism** tension, often resolved via **Causal Selection**.
      *   Actually, the deepest split is **Realism vs. Eliminativism/Explanation**. Do omissions *cause* or do we just *talk* as if they do?
      *   Let's refine: The requirement that does the most work is **"The Ontological Status of Absences."** Are absences *things*? If no, how do they cause?

  6.  **Develop the Test Cases against the Spec:**
      *   (a) Factory/No Filter/No Duty: Tests Normative Sensitivity. If no duty, is it a cause? Naturalism says yes (counterfactual dependence), Normativism says no.
      *   (b) Omission of Omission: Tests Transitivity and Complexity. Does the chain hold?
      *   (c) Stranger/No Warning: Tests the "Special Relationship" boundary.

  7.  **Drafting the Scorecard:**
      *   *Counterfactual (Lewis):* Good on dependence, fails on profligacy and norms.
      *   *Norm-Based (Sytsma, Livengood, etc.):* Good on profligacy and intuitions, fails on naturalism.
      *   *Eliminativist (Beebee):* Good on naturalism, fails on intuitive verdicts (says gardener didn't kill plant).
      *   *Process/Dispositional:* Struggles with the "nothingness" of omissions.

  8.  **Refining the Advice (Soft Spots):**
      *   Which requirement is most vulnerable? *Intuitive Verdicts.* Folk intuitions are unstable and context-sensitive. Building a metaphysics on them is risky.
      *   What changes the verdict on the conflict? If one can show that normative sensitivity is actually a heuristic for a deeper physical relation (pragmatic encroachment), the conflict dissolves.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the prompt.
      *   **Section 1: The Spec Sheet:** List requirements, motivation, and status (Non-negotiable vs. Commitment).
      *   **Section 2: The Incompatibility:** Highlight the Naturalism vs. Normativity clash.
      *   **Section 3: The "Splitter":** Identify the key dividing line.
      *   **Section 4: Test Cases:** Run (a), (b), (c) against the requirements.
      *   **Section 5: Theory Scorecard:** Evaluate major approaches.
      *   **Section 6: Strategic Advice:** What to drop, what to keep.

  10. **Review and Refine:**
      *   *Self-Correction during drafting:* Make sure I don't just summarize the literature but answer the specific prompt about *requirements*. Ensure the distinction between "causal relation" and "causal selection" is clear, as that's often where the confusion lies.
      *   *Tone Check:* Keep it rigorous but accessible to a grad student. Use standard terminology (profligacy, double prevention, causal selection).
      *   *Check Specifics:* Did I include the thermostat? Yes. Did I include the vignette studies? Yes.

  11. **Final Polish:** Ensure the "Incompatible Pair" is highlighted clearly, as the user specifically asked for that as the high-value insight. (The Naturalism vs. Normativity tension is the standard answer, but I need to frame it as a requirement conflict: "Mind-Independence" vs. "Folk-Verdict Accuracy").

  *(Self-Correction on the "Splitter"):* While Ontology is deep, the *functional* splitter in the literature is usually how they handle **Profligacy**. Lewis accepts it (mostly), others restrict it. But the *metaphysical* splitter is Realism vs. Quasi-Realism. I will focus on the **Naturalism vs. Normativity** requirement clash as the primary tension, as that dictates the ontology.

  *(Refining the Test Cases):*
      *   (a) Factory: Hits the Normative Requirement hard.
      *   (b) Omission of Omission: Hits Transitivity/Chain requirements.
      *   (c) Stranger: Hits the "Special Relation" boundary condition.

