answer: |-
  This is the right way to approach the literature. The debate over omission causation is notoriously fractious because authors are optimizing for different theoretical virtues. Below is the spec sheet you asked for, designed to function as a diagnostic tool for evaluating papers (and for positioning your own).

  ### I. The Spec Sheet: Requirements for a Theory of Omission Causation

  Here are the six core constraints any adequate theory must address. I have categorized them as **Non-Negotiable** (logical/metaphysical consistency conditions) or **Camp Commitments** (theoretical virtues that define specific schools of thought).

  | Requirement | Motivation / Case | Status |
  | :--- | :--- | :--- |
  | **1. The Verdict Constraint** | Must align with stable intuitive judgments on core cases. <br>*(Gardener waters → plant lives; Gardener omits → plant dies = Cause. Bystander omits → swimmer drowns ≠ Cause.)* | **Camp Commitment** (Pragmatists/Folk-theorists treat as non-negotiable; Metaphysicians often sacrifice it.) |
  | **2. The Profligacy Constraint** | Must prevent the class of causes from exploding. <br>*(If I didn't water the plant, neither did the Queen of England. If both are causes, causation loses explanatory power.)* | **Non-Negotiable** (A theory that yields infinite causes for every event is functionally useless, even if metaphysically true.) |
  | **3. The Naturalism Constraint** | Causation must be a mind-independent, natural relation. <br>*(No normative residues, no dependence on human expectations or duties.)* | **Camp Commitment** (Metaphysical Realists treat as non-negotiable; Pragmatists/Pluralists reject it.) |
  | **4. The Norm-Sensitivity Constraint** | Must accommodate experimental data showing causal ascriptions track norm violations. <br>*(Vignette studies: We call it a "cause" when an agent breaches a duty, even if counterfactual dependence is identical to a no-duty case.)* | **Camp Commitment** (Causal Selection theorists treat as non-negotiable; Naturalists treat as a performance error.) |
  | **5. The Agent-Neutrality Constraint** | Must explain whether non-agents can omit. <br>*(Thermostat fails → pipes freeze. Is this omission causation structurally identical to the Gardener?)* | **Non-Negotiable** (The theory must explicitly rule in or out; ambiguity here leads to equivocation.) |
  | **6. The Causation/Explanation Distinction** | Must specify if omissions are *ontological causes* or merely *explanatorily relevant*. <br>*(Did the gardener's inaction *make* the plant die, or does it just *explain* why it died?)* | **Camp Commitment** (Eliminativists/Quasi-realists separate them; Realists conflate them.) |

  ---

  ### II. The Incompatible Pair

  Here is the tension that drives the literature. You cannot maximize both without significant theoretical cost.

  **The Conflict:** **The Naturalism Constraint (3)** vs. **The Norm-Sensitivity Constraint (4).**

  *   **Why they clash:** If causation is a mind-independent natural relation (3), it cannot depend on whether an agent had a duty or violated a norm. Duties are social/normative; nature is indifferent. However, if you build norm-sensitivity into the theory to satisfy (4) (e.g., "X caused Y only if X violated a duty"), you make causation dependent on human practices, violating (3).
  *   **The Trade-off:**
      *   **Keep Naturalism:** You must argue that the folk are wrong about norm-sensitivity (it's a pragmatic overlay on a physical relation). *Cost:* You lose the Verdict Constraint on norm-heavy cases.
      *   **Keep Norm-Sensitivity:** You must argue that causation is not a purely natural relation (it is partly conceptual or pragmatic). *Cost:* You lose the claim that causation is "out there" in the world independent of us.

  **The "Splitter" Requirement:**
  The single requirement that does the most work separating candidate theories is **Requirement 6 (Causation vs. Explanation)**.
  *   **Realists** say omissions *cause*. They must solve the ontology of "nothing."
  *   **Eliminativists/Quasi-Realists** say omissions *explain*. They dissolve the ontology problem but must explain why causal language is so pervasive.
  *   *Almost every paper in your seminar will fall on one side of this line.*

  ---

  ### III. Running Your Test Cases Against the Spec

  Here is how your three specific cases stress-test the requirements.

  **(a) The Factory (No filter, no obligation, river dies)**
  *   **Stress Test:** Norm-Sensitivity vs. Counterfactual Dependence.
  *   **The Problem:** There is clear counterfactual dependence (if filter installed, river lives). There is *no* norm violation.
  *   **Verdict:**
      *   *Naturalist/Counterfactual theories:* Must say this **IS** a cause. (Risk: Profligacy. Why isn't the factory's failure to paint the roof also a cause?)
      *   *Norm-Based theories:* Must say this **IS NOT** a cause. (Risk: Counter-intuitive. The river is dead because of the factory's lack of action.)
      *   *Use:* This case breaks theories that try to hide normativity. If a theory says "no cause" here, it admits norms are essential. If it says "cause," it admits profligacy is a real threat.

  **(b) The Supervisor (Omission of an Omission)**
  *   **Stress Test:** Transitivity and Agent-Neutrality.
  *   **The Problem:** Inspector omits to check → Safety fails. Supervisor omits to check Inspector → Safety fails. Is the Supervisor a cause of the Safety Failure?
  *   **Verdict:**
      *   *Counterfactual theories:* Yes (chain of dependence holds).
      *   *Process theories:* Struggle heavily. There is no physical process from the Supervisor to the Accident, only a lack of process.
      *   *Use:* This case reveals if a theory can handle **double prevention** chains. If the theory breaks here, it likely cannot handle complex institutional causation.

  **(c) The Stranger (No warning, no duty, hazard)**
  *   **Stress Test:** The Boundary of the Verdict Constraint.
  *   **The Problem:** Intuitions are split. Some say "You did nothing wrong," others say "But you *let* it happen."
  *   **Verdict:**
      *   *Strict Duty theories:* Not a cause (no special relationship).
      *   *Capacity theories:* Is a cause (you had the power to prevent).
      *   *Use:* This is the best case for arguing that **Requirement 1 (Verdicts)** is unstable. If intuitions vary here, building a metaphysics on them is dangerous.

  ---

  ### IV. Theory Scorecard

  | Theory Type | Profligacy (2) | Naturalism (3) | Norm-Sensitivity (4) | Ontology (6) | Soft Spot |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Counterfactual (Lewis)** | **FAIL.** (Admits profligacy; relies on pragmatics to filter.) | **PASS.** (Pure dependence.) | **FAIL.** (Treats norms as post-hoc selection.) | **Realist.** (Omissions are real conditions.) | Cannot distinguish Gardener from Bystander without extra-theoretic help. |
  | **Norm-Based (Sytsma, Livengood, etc.)** | **PASS.** (Norms restrict the field.) | **FAIL.** (Causation is partly normative.) | **PASS.** (Built-in.) | **Pragmatist.** (Causal claims are judgments.) | Makes causation local to social contexts; hard to apply to pre-human history. |
  | **Eliminativist (Beebee)** | **PASS.** (No omissions = no profligacy.) | **PASS.** (Only positive events cause.) | **PASS.** (Explains why we *talk* as if norms matter.) | **Anti-Realist.** (Omissions explain, don't cause.) | **High Cost.** Must tell the Gardener "You didn't kill the plant." |
  | **Dispositional / Powers** | **PASS.** (Only active powers cause.) | **PASS.** (Powers are natural.) | **FAIL.** (Struggles to account for "lack" as causal.) | **Realist.** (But no "absences".) | Often reduces omission to "presence of a competing power," which feels like a gloss. |

  ---

  ### V. Strategic Advice: What to Drop and What to Keep

  You asked which requirement you would most likely be wrong to treat as fixed.

  **Drop Requirement 1 (The Verdict Constraint) as a Metaphysical Anchor.**
  *   **Why:** The vignette studies you mentioned show that intuitions are context-sensitive and unstable (see Case C). If you try to build a theory that saves *all* intuitive verdicts, you will end up with a gerrymarked mess.
  *   **The Pivot:** Treat verdicts as data for **Causal Selection** (pragmatics), not **Causal Relation** (metaphysics). Argue that the *relation* is natural/counterfactual, but our *ascriptions* are normative. This allows you to keep Naturalism (3) while explaining away the Norm-Sensitivity (4) data without calling the folk "wrong," just pragmatically engaged.

  **The Argument That Changes the Verdict on the Conflict:**
  The only way to resolve the **Naturalism vs. Norm-Sensitivity** conflict without giving up one is to argue for **Causal Pluralism**.
  *   *The Argument:* There is no single concept of "causation." There is *physical causation* (natural, no omissions) and *agentive causation* (normative, includes omissions).
  *   *Risk:* This can look like a dodge. To make it stick, you need to show these two concepts play different functional roles in our cognitive architecture (e.g., one for prediction, one for blame).

  **Recommendation for Your Paper:**
  Don't try to solve the ontology of absences. That's a quagmire. Instead, write on **the function of the norm-sensitivity**.
  *   *Thesis:* "Omission causation is not a metaphysical problem but a regulatory technology. We attribute omission-causes not to track the fabric of the universe, but to assign responsibility in cooperative networks."
  *   *Why this wins:* It accepts the Eliminativist's metaphysical cleanliness (no spooky absences) but accepts the Norm-Theorist's data (people really do think this way). It reclassifies the problem from *metaphysics* to *epistemology/pragmatics*.

  **Final Warning:** Watch out for **Double Prevention**. If you argue omissions cause, you must accept that preventing a preventer is causation. If you accept that, you must accept that the bystander *could* have been a cause if they had intervened. Your theory needs a principled way to stop the slide from "Gardener caused death" to "Everyone who didn't save the swimmer caused death." The only non-arbitrary stopper is **Norms**. If you admit that, you've surrendered Naturalism. Be ready to own that surrender.
