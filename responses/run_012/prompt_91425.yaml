prompt: |-
  I host a small podcast that sits awkwardly between history of computing and philosophy of mind, and next month's guest is a philosopher of neuroscience who's spent the last few years arguing that von Neumann's late thinking about the brain — the Silliman lecture material that got published posthumously as The Computer and the Brain — is usually treated as a quaint historical curiosity when it should be treated as a live set of constraints on computational neuroscience. Her line is basically that von Neumann wasn't just drawing loose analogies between machines and brains; he was trying to derive limits. I've read the book a couple of times but I'm worried my questions will just get her to do the standard "he was prescient about parallelism" routine, which I could get from any undergrad essay.

  Can you draft eight to ten interview questions that actually dig into the argumentative structure? I want roughly one question each on: the claim that the nervous system is neither straightforwardly analog nor straightforwardly digital, and what work that hybrid picture is really doing; the wiring/volume argument — his worry that you couldn't fit enough connections through the available space if the brain were organized the way a computer is — and whether that survives modern connectomics; his suggestion that the brain's "language" isn't the language of mathematics and that its signals may be statistical or low-precision rather than exact; how reliable cognition is supposed to come out of unreliable neurons, and whether he thought redundancy or error-correcting codes were carrying the load; and his skepticism that memory is addressed the way computer memory is. For each question, give me a follow-up keyed to the answer she's most likely to give, since she has a habit of retreating into "well, that's an empirical question" whenever things get sharp.

  I also want at least one question pressing on whether the wiring/volume argument is a genuine argument or just an estimate with enormous slack in it, and one asking what evidence would make her give up the whole framework. And finish on something about what von Neumann would have made of modern deep learning — but keep it non-trite, I don't want "he'd be amazed" filler.
