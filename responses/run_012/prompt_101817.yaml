  **THE REALITY CHECK**
  *Sisters Cordelia and Prudence apply competing theories of truth to your everyday dilemmas.*

  **Dear Aunts,**
  **My boyfriend moved to Australia six months ago. He says he'll return, but his texts are getting shorter. If I believe he's coming back, I can function. If I accept he's gone, I collapse. Should I keep believing?**
  **— Stuck in Limbo**

  **Prudence:** Dear Stuck, ask yourself: what is the cash value of this belief? If holding onto the idea that he returns allows you to eat, sleep, and work, then the belief is working. It guides you successfully through the day. Truth isn't a stagnant property; it happens to an idea. If believing he returns makes your life worth living while you wait, then, for now, it is true.

  **Cordelia:** Dear Stuck, you are attempting to settle belief via the method of tenacity, which is doomed. Truth is not what comforts you today; it is the opinion fate and the community of inquirers would converge upon if investigation were pushed indefinitely into the long run. Currently, the evidence is inconclusive. To claim truth before the inquiry is complete is wishful thinking. I advise suspending judgment until his return is either verified or falsified. Do not let your will dictate reality.

  **Dear Aunts,**
  **My dad died last year. I want to believe he's proud of my grades, but I can't ask him. My brother says I'm deluding myself. Does it matter if it's real?**
  **— Seeking Approval**

  **Prudence:** Dear Seeking, consider the outcome. If believing your father is proud inspires you to study harder and live with confidence, then the belief has instrumental value. It leads you into vital relations with experience. Whether you can verify his pride empirically is secondary to whether the belief pays off in the way of your thinking. If it works, it is true enough for human purposes.

  **Cordelia:** Dear Seeking, it matters profoundly. A belief is only meaningful if it implies a conceivable practical difference in experience that can be tested. Since your father cannot confirm or deny his pride, no experiment can settle the matter. Therefore, the proposition is meaningless. To adopt it is to indulge in sentimentality rather than inquiry. You must distinguish between what feels good and what is real. My colleague William once suggested we might have a right to believe in such cases, but I found this too cosy. I renamed my own doctrine 'pragmaticism' to ensure it remained distinct from such licence. Stick to what can be evidenced.

  **Dear Aunts,**
  **I have two job offers. I feel convinced that whichever I pick is my 'true calling'. Can both be true?**
  **— Crossroads**

  **Prudence:** Dear Crossroads, truth is made in the process of living. If you choose Job A and it leads to a flourishing life, then it was true that Job A was your calling. If you had chosen Job B and flourished, that would also have been true. Truth is mutable depending on the path taken. Both options possess potential truth until you act to verify them.

  **Cordelia:** Dear Crossroads, no. Only one path aligns with the actual structure of reality, even if we cannot know which yet. To say both are true is a contradiction. The community of inquiry might eventually determine which choice yielded the better outcome based on objective criteria, but until then, you are merely guessing. Do not confuse optimism with truth.

  **Prudence:** But Cordelia, if both paths lead to good ends, why insist on a single reality?
  **Cordelia:** Because the long run does not care for our convenience.
  **Prudence:** But we live in the short run.
  **Cordelia:** Then you must live in error.

  *Send your dilemmas to truth@magazine.com. Please note: We do not guarantee convergence.*
