prompt: |-
  Ok so context: I'm a 3rd-year PhD student, officially in an econ dept but my work is really decision theory / phil of action, and I've been roped into running the next session of our little cross-department reading group. It's about 8 people, mix of game theorists and philosophy-of-action folks, all comfortable with basic Bayesian decision theory, two of them have Strong Opinions about Newcomb's problem, and thats roughly the ceiling of the room. My topic got assigned as "evidential cooperation in large worlds," which nobody in the group has heard of, so I can't lean on prior reading. I don't want you to explain the idea to me — I basically get it, I think — I want a plan for how to *teach* it in 75 minutes, because I've now tried twice to explain it off the cuff and both times it went off the rails: half the room decided I was doing mysticism, and the other half decided it was just ordinary causal bargaining wearing a hat, and after that the session was dead.

  Here's the thing I need to land. Two agents who will never interact causally — no signals, no precommitment devises, no shared ancestry, nothing — but who are similar enough that one agent's choice of policy counts as evidence about what the other will do, can both do better by adopting a cooperative / compromising policy. The gains come precisely from that evidential link: choosing to cooperate is like a unilateral move that nonetheless shifts both payoffs. And the juicy part is when their values *differ*, because then there's a real question about which compromise to adopt, and the answer has to be something both can coordinate on without communicating (a Schelling-point problem, and I'd rather not put "Nash bargaining solution" on a slide until they've felt the need for it themselves). There's also a mean little issue where some subset of the cooperators can do better by walking away from the agreed compromise, and I'd love them to hit that wall on their own rather than have me announce it.

  So what I want from you: the order the pieces have to go in so the conclusion feels forced rather than spooky, and why each piece has to come before the next. What's the one example that should carry the whole session — and what does it have to *not* have? My instinct was to build it on Newcomb's problem, but I'm worried that drags in twenty minutes of evidential-vs-causal decision theory and we never come back; tell me if I'm wrong. Then the misconceptions you'd expect this particular audience to form, and exactly where in the sequence each one needs to be headed off: my guesses are (a) "this is just causal influence in disguise," (b) "it only works if the other agents are literally identical / copies of me," (c) "it's wishful thinking that depends on the universe being infinite or on me being a Boltzmann brain," and (d) "if their values differ from mine, why on earth would I compromise instead of just doing my own thing." Also: one question I can put at the end that actually discriminates between them getting the mechanism and them just nodding along, and what I should explicitly refuse to cover at this level (and say out loud that I'm refusing). Please no reading list, half of them will just skim it and come back with worse intuitions than they started with.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the User and Context:**
      *   **User:** 3rd-year PhD student (Econ dept, work in Decision Theory/Phil of Action).
      *   **Audience:** 8 people, mix of game theorists and phil-of-action folks. Comfortable with basic Bayesian DT. Two have Strong Opinions on Newcomb. Ceiling is roughly Newcomb/CDT vs. EDT level.
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL).
      *   **Problem:** Previous attempts failed. Half thought it was mysticism, half thought it was causal bargaining in disguise. Session died.
      *   **Goal:** A 75-minute teaching plan.
      *   **Key Concepts to Land:**
          *   Non-causal correlation (logical/evidential) allows cooperation.
          *   Gains from trade even with different values (compromise).
          *   Schelling point problem for *which* compromise.
          *   Stability issue (subsets walking away).
      *   **Constraints:** No reading list. Don't explain the idea to the user (they get it). Need order/sequence, one core example (what to include/exclude), handle misconceptions, one discriminating final question, and explicit boundaries on what *not* to cover.
      *   **Specific Worry:** Using Newcomb's Problem might derail into CDT vs. EDT debates.

  2.  **Deconstruct the Failure Modes:**
      *   *Mysticism:* Happens when the correlation mechanism isn't grounded. If it sounds like "thinking hard makes the other person do it," CDT folks revolt.
      *   *Causal Bargaining:* Happens when the setup implies hidden communication or shared history. If the correlation looks causal, EDT folks get bored and CDT folks say "oh, just standard game theory."
      *   *Derailment:* Newcomb's Problem is a trap. It focuses on *one* agent vs. a predictor. ECL is about *multiple* agents with *different* values. Focusing on Newcomb invites the CDT/EDT war rather than the cooperation/trade aspect.

  3.  **Develop the Core Example:**
      *   *Requirement:* Needs to be non-causal, non-identical values, large world context, intuitive payoffs.
      *   *Bad Example:* Twin Prisoner's Dilemma (implies identity). Newcomb (implies predictor/one-way).
      *   *Good Example:* "The Alien Civilizations" or "The Multiverse Agents." Let's go with **Alien Civilizations in a Vast Universe**.
      *   *Why:* It naturally handles the "Large World" aspect (statistical correlation due to similar laws of nature/evolution/logic without causal contact). It allows for different values (Aliens want X, We want Y). It removes causal channels (light cones don't overlap).
      *   *What to Exclude:* No quantum entanglement (too physics-y/mystical). No shared ancestry (too causal). No Omega/Predictor (avoids Newcomb baggage).

  4.  **Structure the 75 Minutes:**
      *   *Total Time:* 75 mins.
      *   *Segments:*
          1.  Setup & The Causal Wall (15 mins)
          2.  The Evidential Link (15 mins)
          3.  Gains from Trade / Different Values (20 mins)
          4.  The Stability/Schelling Problem (15 mins)
          5.  Wrap & Discriminating Question (10 mins)

  5.  **Drafting the Sequence (Iterative Refinement):**

      *   *Segment 1 (Setup):* Need to kill causal bargaining immediately. Define "Large World" (infinite or vast enough for duplicates/similar agents).
      *   *Segment 2 (The Link):* How do we correlate without causality? Logical similarity. If I reason this way, a similar agent reasons this way. *Crucial:* Distinguish from "identity." I am not *them*, but we run similar *algorithms*.
      *   *Segment 3 (Trade):* Now introduce different values. If we both cooperate, we both get what we want more than if we both defect. This is the "ECL" core.
      *   *Segment 4 (The Catch):* Which compromise? And what if a subgroup defects? This addresses the user's specific "mean little issue."
      *   *Segment 5 (Check):* The question needs to test if they understand the *mechanism* of the correlation, not just the payoff matrix.

  6.  **Addressing Misconceptions (The "Pre-emption" Strategy):**
      *   *(a) Causal Influence:* Address in Segment 1. Explicitly draw light cones.
      *   *(b) Literal Identity:* Address in Segment 2. Use "similar algorithm" not "clone."
      *   *(c) Mysticism/Infinity:* Address in Segment 1/2. Ground it in logic/reasoning, not magic.
      *   *(d) Why Compromise:* Address in Segment 3. Show the payoff matrix where unilateral defection leads to mutual loss due to the evidential link.

  7.  **The Newcomb Question:**
      *   User asked: "My instinct was to build it on Newcomb's problem... tell me if I'm wrong."
      *   *Verdict:* You are right to worry. Newcomb focuses on *prediction* and *one-boxing*. ECL focuses on *mutual correlation* and *trade*. Using Newcomb invites the CDT/EDT fight.
      *   *Alternative:* Use a symmetric Prisoner's Dilemma variant where the correlation is stipulated by "logical similarity" rather than a predictor.

  8.  **The Discriminating Question:**
      *   Needs to separate "I get the math" from "I get the philosophy."
      *   Idea: Ask about a scenario where the correlation is *imperfect*. If they say "cooperate anyway," they get it. If they say "defect because causal impact is zero," they missed the point. Or, ask about the *compromise ratio*.
      *   *Better:* Ask about the *subset defection* problem. "If you know 90% of agents accept the compromise, but you represent a faction that can gain by breaking it *without* breaking the correlation for the others, do you break it?" (Actually, that's too complex).
      *   *Best:* "Under what conditions does the evidential link *break*?" If they say "when we stop talking," they failed. If they say "when our decision algorithms diverge," they succeeded.

  9.  **Refining the Plan (Self-Correction during drafting):**
      *   *Wait, the user wants them to hit the wall on the stability issue.* I shouldn't explain it; I should set up the exercise so they realize it.
      *   *Timing:* 75 minutes is tight. Need to be strict.
      *   *Tone:* Academic but conversational. Acknowledge the weirdness.
      *   *Visuals:* Minimal. Payoff matrices and Light Cones.

  10. **Final Polish:**
      *   Check against constraints: No reading list? Check. One example? Check (Aliens). Misconceptions addressed? Check. Discriminating question? Check. What to refuse? Check (infinite ethics details, specific FDT formalisms).

  11. **Final Review of the "Discriminating Question":**
      *   I need a question that reveals if they think the correlation is *magical* or *logical*.
      *   Question: "If you discover your decision algorithm has a bug that makes you defect, but the aliens' algorithm does not have this bug, do you still cooperate?"
      *   If they say "Yes, to influence them," they think it's magic/causal.
      *   If they say "No, the link is broken," they get ECL.
      *   *Wait, better:* "If you can precommit *after* calculating the odds, does it help?" (No, because the correlation is in the calculation).
      *   *Let's go with the "Why Compromise" angle.* "If I value paperclips and you value staples, and we correlate, why don't I just maximize paperclips and hope you correlate with that?" Answer: Because you evidence that you are the type who maximizes paperclips unilaterally, which evidences they will too, leading to lower total utility for you if trade was possible.
      *   *Actually, the prompt asks for ONE question at the end.* Let's make it about the *condition* of correlation.

      *(Self-Correction)*: The prompt asks for "One question I can put at the end that actually discriminates between them getting the mechanism and them just nodding along."
      *   *Idea:* Ask them to identify the *source* of the leverage.
      *   *Question:* "In this model, what specific physical or logical fact changes in the universe when you switch from Defect to Cooperate?"
      *   *Wrong answer:* "The alien's decision changes." (Implies causality).
      *   *Right answer:* "The conditional probability distribution over the alien's decision changes, because our decisions share a common logical cause."

      *Let's refine that to be more punchy.* "If you could surgically change your action without changing your decision algorithm, would the alien's action change?" (No). This tests CDT vs EDT/ECL understanding.

      *Wait, one more constraint:* "What I should explicitly refuse to cover at this level (and say out loud that I'm refusing)."
      *   Refuse: Formal FDT (Functional Decision Theory) math. Refuse: Infinite Ethics (measure problem). Refuse: Metaphysics of identity.

      *Okay, ready to write.*
answer: |-
  Here is a 75-minute teaching plan designed to bypass the "mysticism vs. triviality" deadlock.

  ### The Core Example: "The Silent Civilizations"
  **Do not use Newcomb's Problem.** You are correct to worry. Newcomb focuses on a predictor (Omega) and a single agent, which immediately triggers the CDT/EDT war. You want them focused on *mutual correlation* and *trade*, not prediction and one-boxing.

  **Use this instead:** Two civilizations in causally disconnected regions of a vast (potentially infinite) universe.
  *   **Agent A (Us):** Values suffering reduction.
  *   **Agent B (Aliens):** Values knowledge acquisition.
  *   **Constraint:** Light cones do not overlap. No signal can ever pass. No common ancestor.
  *   **Link:** Both civilizations arose under similar physical laws and evolved rational agents. Therefore, their decision-making algorithms are *logically similar*, even if not identical.

  **What this example must NOT have:**
  1.  **No "Clones":** Do not say they are identical. If they are identical, the "different values" problem vanishes. They must be *analogous* reasoners.
  2.  **No Quantum Entanglement:** This invites physics objections. The link is logical/statistical, not physical.
  3.  **No Omega:** No external predictor. The correlation comes from the structure of reasoning itself.

  ---

  ### The Sequence (75 Minutes)

  #### 1. The Causal Wall (0:00 – 0:15)
  **Goal:** Pre-empt misconception (a) "This is just causal bargaining."
  **Action:** Draw two light cones on the board that do not touch.
  *   **Setup:** "We are here. They are there. Spacelike separation. If I press a button here, nothing physically changes there. CDT says my expected utility is calculated by holding their action fixed."
  *   **The Trap:** Ask the room: "If I know for a fact that my choice has zero causal impact on them, why would I ever constrain my choice to help them?"
  *   **The Pivot:** Acknowledge CDT is right about *causality*. But ask: "Is causality the only way actions can be correlated?"
  *   **Why here first:** If you don't kill causal influence immediately, the game theorists will spend the next hour trying to find the hidden signal. Force them to accept the *absence* of causality as a premise.

  #### 2. The Evidential Link (0:15 – 0:30)
  **Goal:** Pre-empt misconceptions (b) "Only works for copies" and (c) "Mysticism."
  **Action:** Introduce "Logical Correlation."
  *   **Argument:** "I am not choosing an *action* in a vacuum. I am executing a *decision algorithm*. If the aliens are rational agents in a similar universe, they are running a similar algorithm."
  *   **Key Distinction:** "I am not a clone of the alien. But my *reasoning process* is a cousin of theirs. If my algorithm outputs 'Cooperate' given this input, what is the probability theirs does too?"
  *   **The Math (Light):** Write $P(A_{alien} = C | A_{me} = C) > P(A_{alien} = C)$.
  *   **Why here:** This grounds the "mysticism." It's not magic; it's Bayesian updating on the output of a logical function. You are learning about their output by observing your own.
  *   **Stop the Bleeding:** Explicitly state: "We are not saying thinking changes reality. We are saying your decision is *evidence* of the output of similar processes elsewhere."

  #### 3. Gains from Trade / Different Values (0:30 – 0:50)
  **Goal:** Pre-empt misconception (d) "Why compromise?" and land the core ECL insight.
  **Action:** The Payoff Matrix.
  *   **Setup:**
      *   If both Defect: We get 10 suffering reduction, They get 10 knowledge.
      *   If both Cooperate (Compromise): We help them get knowledge, they help us reduce suffering. We get 20, They get 20.
      *   If I Defect (Maximize my value) and They Cooperate: I get 30, They get 0.
  *   **The Twist:** Because of the evidential link (from Step 2), if I choose Defect, it is highly probable they also choose Defect.
  *   **The Exercise:** Do not tell them to cooperate. Ask: "Given the correlation coefficient from Step 2, calculate the Expected Utility of 'Always Maximize My Value' vs. 'Adopt Compromise Policy'."
  *   **Why here:** This forces the "Why compromise?" question. They will see that unilateral maximization leads to mutual defection *because* the other agent is reasoning the same way. The gain comes from *correlated policy selection*, not causal influence.

  #### 4. The Stability Wall (0:50 – 1:05)
  **Goal:** Let them hit the "subset defection" problem on their own.
  **Action:** Introduce a third faction.
  *   **Setup:** "Okay, we agreed to compromise. But now imagine a subset of agents (Faction X) realizes that if *they* defect while the rest of us cooperate, they gain extra utility, and the correlation isn't strong enough to punish them specifically."
  *   **Prompt:** "Does the compromise hold? Who defects? How do we coordinate on *which* compromise without talking?"
  *   **Silence:** Let them struggle here for 10 minutes. This is where the "Schelling point" need arises naturally. They will realize that without a focal point for the compromise ratio, the evidential link fractures because everyone is guessing a different compromise.
  *   **Why here:** If you explain this, it sounds like a technicality. If they derive it, they understand that ECL requires *coordination on policy*, not just "being nice."

  #### 5. Wrap & Discriminating Question (1:05 – 1:15)
  **Goal:** Verify understanding.
  **Action:** The Question.

  **The Question:**
  > "Suppose you discover a bug in your own code that makes you defect, but you know the aliens' code does not have this bug. Do you still cooperate to 'signal' to them?"

  *   **The "Nodding Along" Answer:** "Yes, because I still want to influence them." (This implies they think it's causal/magical).
  *   **The "Got It" Answer:** "No. The evidential link is broken. My action is no longer evidence of *their* algorithm's output, only of my bug. Cooperating loses me utility with no evidential gain."
  *   **Why this works:** It tests if they understand that the leverage comes from *shared logical structure*, not from the act of willing itself.

  ---

  ### What to Explicitly Refuse to Cover
  At the start (minute 5), say this out loud:
  > "I am explicitly refusing to cover three things today.
  > 1.  **The Metaphysics of Identity:** We are not arguing whether you *are* the alien. We are arguing about statistical correlation.
  > 2.  **Infinite Ethics:** We are not solving the measure problem of the multiverse. Assume the 'large world' is large enough for correlation, small enough to sum.
  > 3.  **Formal FDT:** I will not write down the Functional Decision Theory equations. We are doing this with Bayesian intuitions and payoff matrices."

  **Why:** This prevents the philosophers from drifting into identity metaphysics (misconception c) and prevents the econ folks from demanding rigorous axiomatics that will bog down the intuition.

  ### Summary of Misconception Pre-emption
  *   **(a) Causal Influence:** Killed in Minute 10 with Light Cones.
  *   **(b) Literal Identity:** Killed in Minute 20 with "Similar Algorithm, Different Values."
  *   **(c) Mysticism/Infinity:** Killed in Minute 20 with "Bayesian Updating on Logic."
  *   **(d) Why Compromise:** Solved in Minute 40 via Expected Utility calculation showing unilateral maximization fails under correlation.

  ### Why This Order Works
  If you start with the *benefits* (cooperation is good), they assume causality. If you start with the *mechanism* (logic), they get bored.
  By starting with the **Causal Wall**, you create a puzzle: "How can I help them if I can't touch them?"
  By solving it with **Logic**, you give them the tool.
  By applying it to **Trade**, you show the value.
  By breaking it with **Stability**, you show the limits.

  This forces the conclusion: ECL isn't magic, and it isn't standard game theory. It's a specific regime of decision theory that only activates when causal channels are closed but logical channels are open.
