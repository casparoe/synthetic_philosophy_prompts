answer: |-
  You have put your finger on the central tension in modern collapse studies, and your intuition is correct: there is no single, standard term that captures the *triad* of temporal, scalar, and normative bias you're describing. However, each leg of that stool has a name in critical archaeology and historiography, and there is a growing movement to synthesize them.

  Here is the breakdown of the three complaints, the existing terminology for each, and a proposal for the unifying concept you're looking for.

  ### 1. The Three Complaints (and their names)

  **A. The Window (Periodization Artifact)**
  *   **The Problem:** As you noted with the Maya, declaring "collapse" depends entirely on the *t1* and *t2* you select.
  *   **Existing Term:** **Periodization Bias** or **Chronological Tunnel Vision.**
  *   **The Mechanism:** Historians carve time into blocks (Late Classic, Terminal Classic, Postclassic). If you draw the line after the monument building stops, it's a collapse. If you draw it after the population stabilizes, it's a transition. This is often driven by **Teleological Bias**—assuming the "end" of the high period was the inevitable destination of the era, rather than one phase in a cycle.

  **B. The Counting (Level of Analysis)**
  *   **The Problem:** Counting palaces vs. counting farmers.
  *   **Existing Term:** **State-Centric Bias.**
  *   **The Mechanism:** This is best articulated by James C. Scott (*Against the Grain*, *The Art of Not Being Governed*). Archaeology and history have traditionally been the handmaidens of the state; we count what the state counted (grain, taxpayers, monuments). When the state vanishes, we call it collapse, even if the "people" (the vast majority) are liberated from tax burdens and live healthier lives. This is also related to **Monumentality Bias**: we equate stone with significance and perishable materials (where most people lived) with insignificance.

  **C. The Threshold (Normative Thing)**
  *   **The Problem:** How much loss counts as "collapse"?
  *   **Existing Term:** **Normative Collapse** vs. **Descriptive Collapse.**
  *   **The Mechanism:** Joseph Tainter's famous definition ("rapid loss of sociopolitical complexity") sounds descriptive, but "complexity" is a value-laden term. Is a simpler society "collapsed" or just "simplified"? When scholars use the word *collapse*, they are almost always making a normative judgment that the previous state was *better* or *more desirable*. This is sometimes called **Value-Laden Categorization**.

  ### 2. The Unifying Concept

  Since no single term currently binds these three, I propose we coin the term you need for your piece:

  **The Collapse Reference Frame**

  **Definition:** A *Collapse Reference Frame* is the specific combination of temporal window, scalar focus (elite vs. commoner), and normative threshold an observer adopts to declare a society "collapsed." Crucially, "collapse" is not an intrinsic property of the historical system (like mass or charge); it is a relationship between the system and the observer's frame.

  **Why this term works:**
  It borrows from physics (relativity). In relativity, velocity is not absolute; it is relative to the observer's frame of reference. Similarly, "collapse" is not absolute. A society can be "collapsed" in the *Elite-Monumental Frame* (palaces burn) while simultaneously being "resilient" in the *Agrarian-Demographic Frame* (farming continues).

  **The Edges of the Concept:**
  To use this in your writing, you need to know where the frame holds and where it breaks. Here are the answers to your specific edge cases:

  *   **Case 1: Farming continues, Kings/Temples stop.**
      *   *Verdict:* **Political Collapse, Societal Continuity.**
      *   *Reference Frame:* This is only a "collapse" in the *State-Centric Frame*. In the *Subsistence Frame*, it is a reorganization. (See: The Maya "collapse" was largely the dissolution of divine kingship, not the disappearance of Maya people).
  *   **Case 2: Population dies, Institutions survive.**
      *   *Verdict:* **Demographic Catastrophe, Institutional Resilience.**
      *   *Reference Frame:* This is rarely called "collapse" in the Tainter sense, because the *complexity* (the institution) survived the shock. (See: Post-Black Death Europe; the feudal system bent but didn't break, even if millions died).
  *   **Case 3: Settlement was fine, Evidence has a hole.**
      *   *Verdict:** **The Silence of the Strata.**
      *   *Reference Frame:* This is an **Epistemic Collapse**, not an Ontological one. It happens when a society shifts from high-visibility practices (stone carving, writing) to low-visibility practices (oral tradition, wood/thatch). The society didn't collapse; our ability to *see* it did. (See: The Greek Dark Ages after Linear B stopped).

  ### 3. What is doing the "Real Work"?

  You asked which of these three (Window, Counting, Threshold) is doing the heavy lifting in the stories we tell.

  It is **The Threshold (The Normative Thing).**

  The temporal window and the level of analysis are usually selected *retroactively* to support the normative threshold. We want "Collapse" to be a moral warning.
  *   If we want to tell a story about **Ecocide** (Rapa Nui), we select the *Statue-Building Frame* as the baseline and the *Pre-Contact Low Point* as the end.
  *   If we want to tell a story about **Resilience** (Indigenous survival), we select the *Pre-Contact* baseline and the *Modern* endpoint.

  The "Real Work" is **Narrative Utility.** "Collapse" is a genre, not just a diagnostic category. It requires a Fall (hubris), a Climax (the disaster), and a Moral (don't burn your rainforest). If you define the denominator as "the farmers," the moral becomes muddy (maybe the farmers were better off without the kings?). If you define the denominator as "the Palace," the moral is clear (don't overextend your elite infrastructure).

  ### 4. Who is fighting this battle?

  If you want to cite scholars who are explicitly wrestling with this "denominator" problem, look at the **Critical Collapse Studies** movement. They are the ones arguing that "collapse" is often a modern construct projected onto the past.

  *   **Guy Middleton:** (*Understanding Collapse: Ancient History and Modern Myths*). He argues explicitly that collapse is a "value judgment" and that we need to distinguish between the collapse of *states* and the collapse of *peoples*.
  *   **Patricia McAnany:** (*Saving the Maya: The New Archaeology of the Ancient Maya*). She focuses on how the "collapse" narrative erases the continuity of Indigenous Maya people to serve tourism and colonial narratives.
  *   **James C. Scott:** (*Against the Grain*). As mentioned, for the "State-Centric Bias." He argues that early states were fragile and often collapsed *beneficially* for the people living in them.
  *   **David Webster:** (*The Fall of the Ancient Maya*). He distinguishes between "dynastic termination" and "population collapse," noting they often don't happen at the same time.

  ### Summary for your piece

  You are describing **Collapse Frame Dependency**.

  The "denominator nobody says out loud" is the **Unit of Value**.
  *   If the Unit of Value is **Monuments**, the Bronze Age collapsed.
  *   If the Unit of Value is **Caloric Intake**, the Bronze Age might have improved for the average person (less surplus extraction for palaces).
  *   If the Unit of Value is **Literacy**, it was a catastrophe.
  *   If the Unit of Value is **Violence**, it's ambiguous (less organized warfare, perhaps more raiding).

  The term "Collapse" smuggles in the assumption that **Complexity = Good**. Your job as the journalist is to make that denominator visible. When a scholar says "The society collapsed," your follow-up question is: "Which society? The one that built the temples, or the one that ate the food?"

  If you use **The Collapse Reference Frame** in your article, you give your readers the tool to spot the trick: *Ask them to declare their coordinates before they declare the disaster.*
