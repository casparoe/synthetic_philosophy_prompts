  *   If the Unit of Value is **Literacy**, it was a catastrophe.
  *   If the Unit of Value is **Violence**, it's ambiguous (less organized warfare, perhaps more raiding).

  The term "Collapse" smuggles in the assumption that **Complexity = Good**. Your job as the journalist is to make that denominator visible. When a scholar says "The society collapsed," your follow-up question is: "Which society? The one that built the temples, or the one that ate the food?"

  If you use **The Collapse Reference Frame** in your article, you give your readers the tool to spot the trick: *Ask them to declare their coordinates before they declare the disaster.*
