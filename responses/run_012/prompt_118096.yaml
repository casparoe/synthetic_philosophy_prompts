answer: |-
  ### The Trilemma (Put this on the board first)

  Any theory of the Doing/Allowing distinction must satisfy three constraints. **You cannot satisfy all three simultaneously.** You must choose which one to sacrifice.

  1.  **Metaphysical Independence:** The distinction is descriptive/factual *prior* to moral evaluation. (It is not *defined* by duty or wrongness).
  2.  **Intuitive Accuracy:** The theory yields the correct classification in hard cases (e.g., the Nurse/Button case, high-cost omissions).
  3.  **Moral Significance:** The distinction carries independent moral weight. (It explains *why* the act is worse, rather than just labeling the worse act "Doing").

  **The Conflict:**
  *   To get **Intuitive Accuracy** (Nurse case), you must appeal to normative baselines (expectations/duties). This threatens **Metaphysical Independence** (making the distinction defined by duty).
  *   To keep **Metaphysical Independence** (purely causal/kinematic), you fail **Intuitive Accuracy** (lifting a finger becomes "Doing").
  *   To keep **Moral Significance** without circularity, you need **Metaphysical Independence**. If you sacrifice Independence to save Accuracy, the distinction risks collapsing into "Wrong vs. Less Wrong," losing its explanatory power.

  ***

  ### The Specification (Desiderata)

  Here is the detailed spec for the unit. If a theory fails these, it is inadequate. If it passes all, it is likely circular.

  #### 1. Kinematic Neutrality (The Nurse/Button Constraint)
  *   **The Case:** A patient lives only while a button is pressed. The nurse lifts her finger. The patient dies.
  *   **The Requirement:** The theory must classify this as *Allowing*, not *Doing*.
  *   **The Constraint:** The distinction cannot be defined by "bodily movement vs. stillness" or "energy expenditure vs. conservation." Lifting a finger is a muscular contraction identical in kinematic structure to pressing it.
  *   **Why:** If the line is physical, the nurse killed the patient. Our moral and linguistic intuition rejects this. The theory must locate the distinction in *counterfactuals* or *baselines*, not physics.

  #### 2. Cost Invariance (The Effort/Risk Constraint)
  *   **The Case:**
      *   *A:* I push a button to save you (low effort).
      *   *B:* I refrain from jumping into a shark-infested tank to save you (high risk/effort).
  *   **The Requirement:** The classification (Doing vs. Allow) must not flip simply because the omission becomes more costly or difficult than the action would have been.
  *   **The Constraint:** A theory where "Allowing" turns into "Doing" once the cost of saving exceeds the cost of harming is unacceptable.
  *   **Why:** Moral difficulty affects *blameworthiness*, not the *metaphysical category* of the act. If I let you die because saving you costs me my life, I have still *let you die*, even if I am not blameworthy. Conflating the *category* with the *excuse* collapses the distinction.

  #### 3. Conceptual Independence (The Non-Collapse Constraint)
  *   **The Requirement:** The Doing/Allowing distinction must remain distinct from:
      *   **Intending/Foreseeing (DDE):** I can *do* harm unintentionally (negligence). I can *allow* harm intentionally (for profit).
      *   **But-For Causation:** Both doing and allowing are causal conditions for the outcome. If the distinction is just "more direct causation," it loses moral traction.
  *   **The Constraint:** The theory cannot define "Doing" as "Intending harm" or "Being the primary cause."
  *   **Why:** If Doing = Intending, the distinction is redundant to the DDE. If Doing = Stronger Causation, you face the "False Dilemma" below.

  #### 4. Institutional Reflective Equilibrium (The Law/Med Constraint)
  *   **The Case:** Withdrawing life support vs. Lethal Injection.
  *   **The Requirement:** The theory must largely align with how courts and clinical protocols categorize these acts (withdrawing = allowing), even if those institutions admit the moral justification is complex.
  *   **The Constraint:** A theory that classifies withdrawing treatment as *killing* is practically useless for bioethics, regardless of its metaphysical elegance.
  *   **Why:** Ethics courses train professionals. A theory that contradicts the legal/medical framework they will operate in creates dangerous cognitive dissonance, unless you explicitly argue for radical reform (which is a different unit).

  #### 5. The Anti-Begging Constraint (The No-Difference Check)
  *   **The Requirement:** The theory must identify what the "No-Difference" argument (e.g., Rachels' Smith/Jones) violates.
  *   **The Violation:** The No-Difference argument violates **Conceptual Independence** by assuming **Consequentialist Supervenience**.
  *   **Why:** The argument assumes that if outcomes are identical, moral status must be identical. This begs the question against non-consequentialist theories. The spec requires a theory that explains *why* the causal pathway matters even if the outcome doesn't.

  ***

  ### Addressing Your Specific Worries

  #### 1. The False Dilemma: Causal Structure vs. Moral Work
  > *"If the distinction turns out to be nothing but a difference in causal structure, i lose the moral work i wanted it for; if the moral work is built in from the start, i'm not sure its a distinction in the world anymore."*

  **Verdict:** This is **not a false dilemma**. It is the exact tension of the Trilemma above.
  *   **Horn 1 (Pure Causation):** If you define Doing/Allowing purely by causal chains (e.g., "intervention on a system" vs. "failure to intervene"), you preserve Metaphysical Independence. But then you must argue *separately* why that causal difference matters morally. (Risk: It might not matter enough to justify the heavy moral weight we give it).
  *   **Horn 2 (Normative Baselines):** If you define Doing/Allowing by reference to duties (e.g., "Doing is violating a negative duty; Allowing is failing a positive duty"), you get Intuitive Accuracy (Nurse case works). But now the distinction is *defined* by the moral work. Saying "Killing is worse than Letting Die" becomes "Violating negative duties is worse than violating positive duties." This is true, but it makes the Doing/Allowing distinction redundant to the duty taxonomy.

  **Teaching Move:** Tell students the distinction is likely **Counterfactual + Normative**. It is about *deviation from a baseline*. But the "baseline" is not purely physical; it is partly normative (what was expected to happen). This saves the Nurse case but admits the distinction is not "in the world" like gravity; it is in the *expectations* placed on agents.

  #### 2. What the No-Difference Arguments Violate
  You asked which requirement they violate. They violate **Desideratum #3 (Conceptual Independence)** by smuggling in **Consequentialism**.
  *   **The Trap:** They argue: "Outcome A (Death by Poison) = Outcome B (Death by Drowning). Therefore Moral Status A = Moral Status B."
  *   **The Violation:** This assumes the *only* morally relevant feature is the outcome. It begs the question against Deontology or Agent-Relative views.
  *   **The Fix:** The spec requires a theory that can say: "Outcomes are identical, Causal Structures are identical (in terms of but-for), but the **Baseline Relation** differs." The No-Difference argument ignores the Baseline Relation.

  #### 3. The "Unjustifiable" Legal/Clinical Practice
  You noted courts treat withdrawing treatment as allowing, "including the fact that a lot of them treat it as a difference they can't fully justify."
  *   **How to handle:** Do not try to fully justify it in this unit. Treat the legal distinction as a **Fixed Point** for the sake of the theory (Desideratum #4).
  *   **The Lesson:** Ethics is not just about finding the Truth; it's about managing Agency. The law maintains the distinction not because it is metaphysically pristine, but because it preserves the *role of the physician* (healer vs. executioner). A theory that ignores this functional role fails the "Clinical Fit" spec.

  ### Summary for the Syllabus

  **The Killing/Letting Die Spec:**
  1.  **Must handle the Nurse Case:** Movement $\neq$ Doing.
  2.  **Must handle Cost:** Effort $\neq$ Classification.
  3.  **Must remain distinct:** Not just DDE, not just Causation.
  4.  **Must fit Practice:** Aligns with medical withdrawal norms.
  5.  **Must avoid Circularity:** Cannot define "Doing" as "The Worse Thing."

  **The Catch:** Satisfying 1 and 4 requires Normative Baselines. Satisfying 3 and 5 requires Descriptive Baselines. **You cannot have both.** The unit is about choosing which constraint to relax.
