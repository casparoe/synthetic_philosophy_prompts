answer: |-
  # THE ANTHROPOCENE DECISION TREE
  *A logic map for resolving stratigraphic/historical friction*

  **Q1: ONTOLOGY**
  Is the Anthropocene primarily a **Stratigraphic Unit** (a layer in the rock record) or a **Historical Concept** (a claim about human power/history)?
  │
  ├── **PATH A: STRATIGRAPHIC UNIT** (The rock must speak)
  │   │
  │   **Q2: LEGIBILITY**
  │   Does the boundary require a **Physical Marker** (GSSP/"Golden Spike")?
  │   │
  │   ├── **YES** (Needs a spike in stone/ice)
  │   │   │
  │   │   **Q3: THE SIGNAL**
  │   │   Which signal defines the start?
  │   │   │
  │   │   ├── **Radionuclides (1950s)** → **1. The Great Acceleration Formalist**
  │   │   │   *Awkward Commitment:* Must treat pre-1950 industrial damage as "Holocene background noise."
  │   │   ├── **Carbon/Soot (1800s)** → **2. The Industrial Stratigrapher**
  │   │   │   *Awkward Commitment:* Struggles to distinguish the signal from natural climate variability.
  │   │   └── **Pollen/CO₂ (8000BP)** → **3. The Early Anthropocene Geologist**
  │   │       *Awkward Commitment:* Dilutes 'Anthropocene' until it becomes synonymous with 'Holocene'.
  │   │
  │   └── **NO** (Theoretical boundary is enough)
  │       │
  │       **Q4: AUTHORITY**
  │       Who defines the boundary?
  │       │
  │       ├── **Future Geologists** → **4. The Wait-and-See Geologist**
  │       │   *Awkward Commitment:* Admits current usage is technically incorrect until the future arrives.
  │       └── **Us Now** → **[EMPTY SPACE]** *(See Map Annotations)*
  │
  └── **PATH B: HISTORICAL CONCEPT** (The history must speak)
      │
      **Q2: TEMPORALITY**
      Are we defining a **Start Date** or a **Structural Condition**?
      │
      ├── **START DATE** (When did it begin?)
      │   │
      │   **Q3: SYNCHRONICITY**
      │   Did it start everywhere at once?
      │   │
      │   ├── **YES (Isochronous)**
      │   │   │
      │   │   **Q4: AUTHORITY**
      │   │   Why fix the date?
      │   │   │
      │   │   ├── **To Unify Science** → **5. The Planetary Boundary Technician**
      │   │   │   *Awkward Commitment:* Reduces political responsibility to engineering thresholds.
      │   │   └── **To Implicate All Humans** → **6. The Humanist Universalist**
      │   │       *Awkward Commitment:* Implies a Neolithic farmer is as responsible as a petrochemical CEO.
      │   │
      │   └── **NO (Diachronous)**
      │       │
      │       **Q4: AUTHORITY**
      │       Who decides the local start?
      │       │
      │       └── **Local Histories** → **7. The Colonial Diachronist**
      │           *Awkward Commitment:* Destroys the utility of a single global timeline for policy.
      │
      └── **STRUCTURAL CONDITION** (How does it work?)
          │
          **Q3: ONTOLOGY OF THE TERM**
          Is "Anthropocene" a useful word?
          │
          ├── **YES, but it's an Event** → **8. The Event Ontologist**
          │   *Awkward Commitment:* Insists it's a 'happening' not a 'time', but keeps using epoch language.
          ├── **YES, but it's Capital** → **9. The Capitalocene Critic**
          │   *Awkward Commitment:* Rejects the term 'Anthropocene' while using it to argue against the term.
          └── **NO, it's just a Metaphor** → **10. The Informal Pragmatist**
              *Awkward Commitment:* Admits the term is scientifically empty but keeps using it for vibes.

  ***

  ### MAP ANNOTATIONS (For the Pub Discussion)

  **⚠️ THE EMPTY SPACE (Path A → No Marker → Us Now)**
  *Position:* **The Political Stratigrapher.** (We should declare a geological epoch now for political reasons, even without a perfect spike.)
  *Diagnosis:* **Incoherent to Geologists.** This violates the stratigraphic rule that boundaries are *discovered* in the rock, not *decreed* by committee. Historians love this view; Geologists view it as category error. This is why you talk past each other: one side sees "declaration" as necessary work, the other sees it as scientific fraud.

  **⚠️ THE INDISTINGUISHABLE LEAVES (Leaves 8 & 10)**
  *Position:* **The Event Ontologist** vs. **The Informal Pragmatist.**
  *Diagnosis:* **Functional Overlap.** Both refuse a formal date and both reject the ICS process. The only difference is semantic: one says "It's a real condition, wrong category" (Event), the other says "It's a useful metaphor, fake category" (Informal). In practice, both result in "Don't formalize the Anthropocene." If your group is fighting over these two, you are fighting over branding, not logic.

  ***
  *Handout for [Reading Group Name]. Printed on one page to fit on a beer mat.*
