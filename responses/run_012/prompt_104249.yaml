answer: |-
  Hi there,

  It is completely understandable that this feels unsettling, but you are definitely not imagining things and it is not just normal committee chaos. You have stumbled onto a well-documented problem in social choice theory, and yes, it has a name. For the specific situation with your housing co-op and the roof repair, the technical term is the Discursive Dilemma, though you will also see it called the Doctrinal Paradox. The election scenario your friend described is a close cousin, often referred to as the Paradox of Multiple Elections or sometimes Anscombe's Paradox, depending on the precise voting mechanics. While they feel like the same shape because they both involve a conflict between the parts and the whole, they are technically distinct phenomena with different boundaries, and understanding the difference helps explain why your board meeting felt so broken.

  The Discursive Dilemma, which matches your roof repair scenario exactly, happens when a group votes on logically connected propositions. In your case, the logic was that if the roof is failing and the money exists and no one objects, then the repair is approved. The paradox arises because majority rule is not always consistent across logically linked questions. You can have a majority for premise A, a majority for premise B, and a majority for premise C, yet have a majority against the conclusion that follows from A, B, and C. This happens because the majorities are made up of different people. Person one might reject the conclusion because they doubt the roof is failing, while person two rejects it because they doubt the funding is secure, and so on. Individually they all agree the repair should happen only if the conditions are met, but collectively their judgments on the conditions do not align with their judgment on the outcome. This is different from the election example, where the issue is usually about bundling. In the election case, voters are often choosing a package deal because they cannot vote on each plank separately. The paradox there is that the winning package might be one that would lose if every plank were voted on individually, or conversely, that the combination of winning planks creates a platform no single voter actually wanted. The core similarity is that aggregating votes on parts does not necessarily yield the same result as aggregating votes on the whole.

  You asked if this is the same as the Condorcet cycle, and the answer is no, though they are siblings in the family of voting paradoxes. A Condorcet cycle is about preferences over alternatives, where the group prefers A to B, B to C, but also C to A, creating a loop with no clear winner. That is a problem of transitivity in preferences. The Discursive Dilemma is about logical consistency in judgments. It is not that the group prefers Yes to No and No to Yes in a circle, but rather that the group accepts the premises but rejects the conclusion that logically follows from them. The Condorcet problem says we cannot find a stable winner, while the Discursive Dilemma says we cannot find a stable truth value for connected statements using majority rule.

  Regarding the boundaries of this problem, it does require the questions to be logically linked. If you vote on three completely independent questions, like what color to paint the fence, what to serve at lunch, and when to hold the next meeting, you can vote on each separately without running into this paradox. The paradox only emerges when there is a logical constraint connecting the propositions, such as if A and B are true then C must be true. In your roof case, the bylaw created that logical link explicitly. The bad thing here is not that people are being sneaky or that the group is irrational. The problem is that majority rule is not systematic when applied to connected judgments. It implies that a group does not have a single consistent mind in the way an individual does. An individual who accepts the premises must accept the conclusion to be rational. A group can accept the premises by majority vote and reject the conclusion by majority vote without any single individual being inconsistent. The inconsistency is in the aggregation method, not the voters.

  To give you a sense of where the boundary lies, consider an edge case where the logical connection is probabilistic rather than deterministic. Imagine your board votes on whether the roof is old, whether it has leaked before, and whether it should be replaced. Suppose everyone agrees that if the roof is old and has leaked, it probably should be replaced, but not definitely. If the board votes yes on old, yes on leaked, but no on replacement, is that the Discursive Dilemma? Technically no, because the logic is not strict. The paradox requires a logical entailment, like a legal doctrine or a mathematical rule, where the conclusion must follow if the premises are true. If the connection is just a strong correlation or a matter of opinion, then the divergence between the parts and the whole is just a difference of judgment, not a structural paradox. In your roof case, the bylaw made the connection strict, which is why the paradox appeared so sharply.

  So to summarize, your roof situation is the Discursive Dilemma, and the election situation is the Paradox of Multiple Elections. They both show that you cannot always build a consistent group decision by simply tallying majority votes on component parts. The lesson for your co-op is that you have to choose whether you are voting on the premises or the conclusion, because majority rule will not guarantee consistency between the two. Most experts suggest that for high-stakes decisions with logical constraints, you should vote on the conclusion directly and treat the premises as discussion points, or else appoint a smaller committee to ensure logical consistency, because the math of majority voting simply does not support both at the same time.

  I hope this helps clarify what you are seeing, and good luck with the fence.

  Best wishes
