t cycle where you get A beats B, B beats C, C beats A? Is it the same as a group just having incoherent preferences? Does it require the questions to be logically linked, or would any bundle of separate yes/no questions do it? And what's the actual bad thing here, is it that majority rule is inconsistent, or that we asked the question in the wrong order, or that we assumed the group has a single mind that can be consistent in the first place? If there's no exact name for my roof-repair version then tell me that and give me a name and a definition, plus a case that sits right on the edge where you'd be unsure whether it counts. Just write it as plain prose please, no bullet points, no headings, no bold, like you're writing me an email.
