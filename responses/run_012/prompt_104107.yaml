prompt: |-
  my cousin is a graphic designer and she keeps insisting that generative image models are just the camera happening all over again: when photography showed up, painters screamed that a machine was making pictures and that it wasn't real art, and they were wrong, so the same thing is going to happen with AI and everyone hand-wringing about it is on the wrong side of history. her version of it is pretty specific — she says that in both cases the machine takes over the part that's merely mechanical (getting an image onto a surface) while the human keeps the part that's genuinely creative (deciding what the picture should be of and what it should look like). i want to push back but i don't want to be the guy who just says "but this time it's different." how far does the camera analogy actually hold?

  can you give me exactly five numbered points, each a sentence or two, no intro and no outro:

  1. the correspondence table — light, lens, shutter, film and darkroom, the photographer, the subject, the print — say what plays each role on the AI side, and flag any role that has no counterpart at all.
  2. where the mapping is solid, and in particular whether her line about "machine does the mechanical part, human does the creative part" survives being spelled out in both cases.
  3. where it breaks, and of the breaks, which ones actually matter for her conclusion versus which are just noise.
  4. what the camera story quietly imports that the AI case may not have — about intention, about who picked the subject, about whether the operator controls the output or only steers it, and about whether a camera ever needed to have seen billions of prior pictures to work.
  5. whether her "right side of history" conclusion still stands once the disanalogies are on the table, and if it doesn't, what a better analogy would be.
