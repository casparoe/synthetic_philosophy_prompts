  **PROSPECTUS FOR THE MILLHAVEN COOPERATIVE EXPERIMENT & LAND REFORM ASSOCIATION**

  **PREAMBLE**

  Whereas the present organization of industry wastes human labour through competition and rewards idle ownership over diligent improvement; and Whereas the proposed remedy of common ownership risks substituting the despotism of Capital for the far more suffocating Despotism of Society; be it known that the undersigned Consultant, acting in the spirit of cautious progression, hereby establishes the following Rules of Association. These statutes are designed not to inaugurate the Millennium, but to conduct a probationary trial of socialist principles without extinguishing the individual spontaneity required for human progress.

  **RULES OF ASSOCIATION**

  **I. On the Raw Material of the Globe**
  Recognizing that no man made the land, the Association claims ownership of the soil itself. However, recognizing that men did make the improvements, any Member who drains a marsh or builds a barn shall hold exclusive rights to the value of said improvement. The unearned increment of land value, arising solely from the growth of the community, shall be taxed into the Common Fund. No Member shall be permitted to own more acreage than they can personally cultivate, lest we recreate the landlord class under the guise of cooperation.

  **II. On Remuneration and Incentives**
  Absolute equality of remuneration is hereby declared injurious to the general welfare. While a minimum subsistence is guaranteed to all, including the infirm, additional rewards shall be distributed according to effort and skill. To suggest otherwise is to invite the lazy to feed upon the industrious, which is neither just nor utilitarian. Piecework is encouraged, provided it does not degrade the quality of the article produced.

  **III. On the Protection of Eccentricity**
  To prevent the community from becoming a hive of uniform mediocrity, the Majority shall have no power to regulate the private conduct, tastes, or amusements of Members, provided such conduct causes no detriment to others. The Committee of Public Taste is expressly forbidden from censuring unusual clothing, unconventional hours of sleep, or peculiar dietary habits. A certain amount of social friction is to be tolerated as the price of intellectual vitality.

  **IV. On the Position of Women**
  The Association recognizes the family as the primary school of moral education. Therefore, the legal subordination of women is abolished within these bounds. Wives shall retain control of their own earnings and persons. Husbands shall not vote on behalf of their wives, nor shall domestic labour be considered valueless. Any Member found treating a woman as a servant rather than a companion shall be subject to review by the Tribunal of Equality.

  **V. On the Probationary Nature of the Experiment**
  This Association is not a final destination, but a trial. No Member shall be bound for life. Exit visas shall be granted upon fourteen days' notice, without penalty. Should the experiment prove detrimental to the character of its participants, the Association reserves the right to dissolve itself and return to competitive wages, acknowledging that liberty is preferable to comfort if comfort requires servitude.

  **VI. On the Danger of Collective Meddling**
  While production may be cooperative, consumption shall remain largely individual. The Association shall not provide a common kitchen unless unanimously requested, for nothing kills individuality faster than a mandatory communal meal. No Member shall be obliged to attend moral improvement lectures more than twice per month.

  **VII. Final Provision**
  These Rules may be amended only by a two-thirds majority, provided such amendments do not infringe upon the liberty clauses herein. The Ghost-Editor of *The Utilitarian Review* reserves the right to audit the books for logical consistency.

  ***

  **AUTHOR'S NOTE**

  This satire leans heavily on Mill's *Chapters on Socialism* and his *Autobiography*, specifically his fear that socialism might stagnate human development by enforcing conformity. I take some liberty with the specificity of his land views; while Mill championed taxing the unearned increment, he was less prescriptive about individual improvement rights than Clause I suggests. Additionally, Mill's support for women's suffrage was absolute, but framing it as a "Rule" within a socialist charter exaggerates the integration of his feminist and economic views in his actual lifetime. If the satire misses the mark, it is by portraying Mill as more skeptical of socialism than he truly was; by the end of his life, he was not merely cautioning against it, but actively hoping for its eventual success, provided it could be reconciled with liberty. The joke assumes his caution outweighed his hope, which is a contested reading.
