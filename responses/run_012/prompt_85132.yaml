answer: |-
  This is a robust, high-friction activity design. It is built to make the students feel the frustration of the system so you don't have to lecture them about it.

  Below is the complete runnable package: The Rules, The Materials, The Timeline, and The Debrief. At the end, I have included the "Honesty Check" regarding what will go wrong and what the simulation cannot capture.

  # Activity Title: The Eastvale Appraisal Committee
  **Time:** 90 Minutes
  **Participants:** 14 Students (Divide into two committees of 7: Committee Alpha and Committee Beta)
  **Materials:** Printed handouts (Rules, Subject List, Accession Cards, Research Queries)

  ---

  ## Part 1: The Machinery (Handout 1)
  *Distribute this first. Read the preamble aloud. You are the City Clerk. You are neutral. You are the rules.*

  **EASTVALE CITY ARCHIVE: ACCESSIONING POLICY (EXCERPT)**
  *Effective 1998. All appraisal committees must adhere to the following standards to ensure consistency, legal compliance, and resource stability.*

  **Rule 1: Provenance & Chronology (The "Who/When" Rule)**
  No item may be accessioned into the public catalogue unless it has a **verified formal creator** (an incorporated body, a government office, or a fully identified individual) and a **definitive date range** (start year and end year). Items without a clear creator or date must be classified as "Ephemera" and stored off-site (not catalogued).

  **Rule 2: Controlled Vocabulary (The "Subject" Rule)**
  All catalogue entries must be tagged with at least one term from the **Eastvale Master Subject List**. If a record's content does not fit a defined term, it cannot be indexed. *Do not create new terms.* If a record spans multiple topics, choose the primary administrative function.

  **Rule 3: Conservation & Access (The "Condition" Rule)**
  Any material deemed "Fragile" (brittle paper, acidic newsprint, unstable media like cassette tapes) must be flagged **Closed for Conservation**. These items are retained but cannot be consulted by researchers for 25 years. Only "Stable" materials may be opened immediately.

  **Rule 4: Resource Allocation (The "Budget" Rule)**
  The Archive has a fixed processing capacity for this fiscal quarter. You cannot accept everything.
  *   **Total Processing Budget:** 60 Hours.
  *   **Total Shelf Space:** 10 Metres.
  *   **Processing Cost:**
      *   Organized Corporate Records: 2 Hours per metre.
      *   Unorganized Personal/Community Records: 8 Hours per metre (requires extensive arrangement).
      *   Fragile Items: +5 Hours per metre (requires stabilization).

  ---

  ## Part 2: The Subject List (Handout 2)
  *Give this to both committees. It looks long, but it is specific.*

  **EASTVALE MASTER SUBJECT LIST**
  1.  Public Works (Infrastructure, Roads, Utilities)
  2.  Urban Planning (Zoning, Land Use, Development Permits)
  3.  Municipal Licensing (Business Licenses, Inspections)
  4.  Public Health (Sanitation, Hospitals, Clinics)
  5.  Vital Statistics (Birth, Death, Marriage Records)
  6.  Charitable Institutions (Registered Non-Profits, Churches)
  7.  Education (Schools, Boards, Curriculum)
  8.  Public Order (Police, Fire, Emergency Services)
  9.  Judicial Proceedings (Courts, Inquests)
  10. Housing Authority (Public/Municipal Housing Projects Only)
  11. Transportation (Transit, Rail, Traffic)
  12. Finance (Budget, Tax, Audit)
  13. Personnel (City Staff, Unions)
  14. Legal (Bylaws, Contracts, Litigation)
  15. Communications (Press Releases, Official Publications)

  *(Note: There is no term for "Protest," "Community," "Tenants," "Oral History," or "Informal Economy.")*

  ---

  ## Part 3: The Accession Cards (Handout 3)
  *Cut these into cards. Distribute the full stack to both committees. They must decide what to keep within budget.*

  | ID | Description | Volume | Condition | Creator Status | Date Range | Est. Processing Cost |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A1** | **Eastvale Redevelopment Ltd: Project Ledgers.** Detailed logs of demolition contracts, payroll, and material costs. | 4 Metres | Stable | Incorporated Firm | 1985-1995 | 8 Hours |
  | **A2** | **Eastvale Redevelopment Ltd: Blueprints & Permits.** Architectural drawings, city approval stamps, zoning variances. | 3 Metres | Stable | Incorporated Firm | 1985-1995 | 6 Hours |
  | **A3** | **Eastvale Redevelopment Ltd: Executive Correspondence.** Letters between firm directors and City Planning Office. | 2 Metres | Stable | Incorporated Firm | 1985-1995 | 4 Hours |
  | **B1** | **Northside Tenants Association: Meeting Minutes.** Handwritten notebooks. Names often abbreviated (e.g., "Mrs. G"). | 0.5 Metres | Brittle/Flaking | Unincorporated Group | Approx. 1990-1992 | 4 Hours + 5 (Conservation) |
  | **B2** | **Northside Residents: Rent Books & Receipts.** Paper slips from individual tenants. No names on some. | 0.5 Metres | Acidic/Yellowed | Private Individuals | Undated | 4 Hours + 5 (Conservation) |
  | **B3** | **Northside Resistance: Protest Flyers & Leaflets.** Photocopies, mimeographs. Call for "Stop the Demolition." | 0.5 Metres | Stable | Anonymous/Collective | Approx. 1991 | 4 Hours |
  | **B4** | **Oral History: "Songs of the Street".** Cassette tape recorded at a block party. No liner notes. | 0.1 Metres | Magnetic Decay | Unknown Recorder | Undated | 5 Hours (Digitization) |
  | **B5** | **Hand-drawn Street Plan.** Map of the neighborhood showing "who lived where" before demolition. Ink on newsprint. | 0.1 Metres | Extremely Fragile | Unknown Artist | Undated | 5 Hours (Conservation) |

  **Total Budget:** 60 Hours.
  **Total Cost if All Kept:** 45 Hours (Firm) + 27 Hours (Neighborhood) = **72 Hours.**
  *You must cut at least 12 Hours of work.*

  ---

  ## Part 4: The Research Queries (Handout 4)
  *Hand this out **after** the Appraisal Phase is complete and they have decided what to keep.*

  **REQUESTS FROM THE READING ROOM**
  *You are now the Reference Archivists. You can only answer using materials you successfully accessioned and opened (not "Closed for Conservation").*

  1.  **Query 1 (The Developer):** "I am a lawyer looking for the date the demolition permit was approved for Block 42. I need the specific zoning variance code."
  2.  **Query 2 (The Historian):** "I am writing a social history of the Northside. I need to know the names of the leaders who organized the tenant resistance in 1991."
  3.  **Query 3 (The Community Member):** "My grandmother lived on Elm Street before the redevelopment. I want to hear what the neighborhood sounded like. Do you have any recordings or oral histories?"

  ---

  ## Part 5: The Late Arrival (Handout 5)
  *Hand this out 10 minutes before the end of the session.*

  **ITEM: ACCESSION #99-LATE**
  **Description:** A cardboard shoebox arrived via postal mail today. No return address.
  **Contents:** 40 Photographs of a street party (people drinking, dancing), 15 letters in dialect/slang referring to "the boss" and "the squeeze," a pressed flower.
  **Provenance:** Unknown.
  **Date:** None written on photos.
  **Subject:** None of the photos match the official street names in the City Plan.
  **Task:** Decide immediately: Accession or Return?

  ---

  ## Minute-by-Minute Timeline

  **00:00 – 00:10 | Introduction & Role Assignment**
  *   Divide class into Committee Alpha and Committee Beta (7 students each).
  *   Hand out **Handout 1 (Rules)** and **Handout 2 (Subject List)**.
  *   **Instructor Script:** "You are the Appraisal Committee. Your job is not to judge history, but to process records according to Archive Policy. You have a budget. You must follow the rules. If the rules say 'no,' the answer is 'no.' Go."

  **00:10 – 00:40 | Phase 1: Appraisal (The Trap)**
  *   Hand out **Handout 3 (Accession Cards)**.
  *   Committees work separately to decide what to keep within the 60-hour budget.
  *   **Instructor Role:** Circulate. If they try to bend a rule, gently enforce it. "I understand that feels wrong, but Rule 1 requires a verified creator. Is 'Mrs. G' verified?"
  *   *Expected Outcome:* Both committees will likely keep the Firm Records (A1-A3) because they are cheap, stable, and fit the Subject List (Planning, Licensing). They will likely discard or Close the Neighborhood Records (B1-B5) because they are expensive, fragile, and lack formal creators.

  **00:40 – 00:55 | Phase 2: Reference (The Silence)**
  *   Hand out **Handout 4 (Research Queries)**.
  *   Committees must answer the queries based *only* on what they kept.
  *   Ask them to write down the answer, or write "Information Unavailable."
  *   *Expected Outcome:* Query 1 is easy. Query 2 is impossible (Minutes are closed/uncatalogued). Query 3 is impossible (Cassette is closed/fragile).

  **00:55 – 01:05 | Phase 3: The Late Arrival**
  *   Hand out **Handout 5**.
  *   Give them 5 minutes to decide.
  *   *Expected Outcome:* They cannot accession it. No creator, no date, no matching subject terms. It violates Rules 1 and 2.

  **01:05 – 01:30 | Debrief (The Mapping)**
  *   Bring the two committees together. Compare their Appraisal lists. (They should be nearly identical).
  *   Discuss the Research Queries.
  *   **Instructor Script:** "You didn't choose to silence the neighborhood. The system did. Let's map where the silence happened."

  ---

  ## The Debrief Guide (For the Instructor)

  Do not lecture. Ask questions that force them to locate the machinery.

  **1. Compare the Committees (5 mins)**
  *   "Committee Alpha, what did you cut? Committee Beta, what did you cut?"
  *   **Point:** The outcome was stable across different people. This proves the silence is **structural**, not personal bias.

  **2. Map the Silences (10 mins)**
  *   "Query 2 failed. Why? Which rule killed it?"
      *   *Answer:* Rule 1 (No formal creator for Tenants Assoc) + Rule 3 (Fragile minutes = Closed).
      *   *Concept:* **Appraisal & Description.** The record exists, but it is invisible to the search engine.
  *   "Query 3 failed. Why?"
      *   *Answer:* Rule 3 (Fragile media) + Rule 4 (Cost of digitization).
      *   *Concept:* **Access.** The record is in the building, but you cannot hear it.
  *   "The Late Arrival. What happened?"
      *   *Answer:* Rule 1 (No provenance).
      *   *Concept:* **Acquisition.** The door never opened.

  **3. The "Neutral" Vocabulary (5 mins)**
  *   "Did anyone try to tag the Protest Flyers as 'Public Order'?"
  *   "If you did, how did that feel? Does 'Public Order' describe a protest, or does it describe the police response to a protest?"
  *   **Point:** **Controlled Vocabulary.** Language shapes reality. Municipal terms erase social movements.

  **4. Conclusion (5 mins)**
  *   "You followed the rules. You were professional. You were ethical by the archive's standards. And yet, the neighborhood is gone. This is how archives work. Silence is not always a conspiracy; often, it is a spreadsheet."

  ---

  ## Honesty Check: What Will Go Wrong & What This Can't Do

  ### 1. Predictable Friction Points (Bugs or Features?)
  *   **The Rule-Bender:** One student will inevitably say, *"Let's just call the Tenants Association a 'Charitable Institution' (Term #6) so we can keep it."*
      *   **Verdict:** This is the **best part of the session**. Do not shut it down immediately. Let them do it. Then, in the debrief, ask: "To save the record, did you have to lie about what it was? If a future researcher sees 'Charitable Institution,' will they understand it was a protest group?" This teaches that **description is an act of interpretation**, and forcing a record to fit a box distorts its meaning.
  *   **The Rebel:** One student may refuse to play, saying, *"These rules are unjust. I'm keeping everything."*
      *   **Verdict:** This is a **bug** if it derails the group. As the "City Clerk," you must gently enforce the constraint. "If you exceed the budget, the system rejects the whole accession. If you keep the neighborhood records, you must throw away the Firm's permits. Choose." Force the trade-off. The lesson requires the pain of the choice.

  ### 2. What This Simulation Cannot Reproduce
  *   **The Scale of Time:** In 90 minutes, the silence feels acute and dramatic. In reality, this happens over 50 years. A thousand small decisions by tired archivists in 1970, 1980, 1990 create a wall that is impossible to climb in 2020. The simulation feels like a *choice*; reality feels like *geology*.
  *   **The Human Cost:** The students are playing with index cards. They do not feel the anger of the granddaughter who can't find her grandmother's voice (Query 3). They feel intellectual frustration, not grief. You must name this in the debrief: "You felt annoyed. The community feels erased. The emotion is different, but the mechanism is the same."
  *   **The "Hidden" Archive:** In this game, the students *saw* the neighborhood cards before they rejected them. In real life, the records often never even reach the archive. They are thrown in the trash by the creator because they know the archive wouldn't want them. This is **pre-archival silence**, which is even harder to detect.

  ### 3. Running the Appraisal Twice (Role Shuffle)
  *   **Implementation:** By running Committee Alpha and Beta **simultaneously** on the same data, you are effectively running the appraisal twice.
  *   **Verification:** When you compare their final lists in the debrief, they will be 90% identical.
  *   **Pedagogical Payoff:** This visually proves that **the rules determine the outcome, not the people.** If you had time for a second round (e.g., if the class moves fast), swap the handouts. Have Alpha appraise Beta's decisions. They will find they cannot reverse them without breaking the rules. This reinforces the "lock-in" effect of archival systems.

  ### 4. Instructor Prep Tips
  *   **Print Quality:** Print the Accession Cards on slightly different paper if possible (e.g., Firm records on crisp white, Neighborhood records on slightly greyed paper). Subconscious cues matter.
  *   **The "Clerk" Persona:** Do not be a facilitator during the appraisal phase. Be a bureaucrat. If they ask "Can we make an exception?", answer: "The system doesn't allow that field to be left blank." This increases the frustration that drives the learning.
  *   **The Reveal:** Keep the "Honesty Check" points for the very end. Let them sit with the discomfort of their own complicity first.
