  To the Professors of Geometry,

  You have returned my demonstration once more. You state that the ratio is impossible. I state that you do not understand what a demonstration is. You treat geometry as a trade of numbers, but numbers are merely marks of reckoning, useful for memory but incapable of producing truth. True science is knowledge of the cause. We can have no science of things we do not make, for only the maker knows the generation of the effect. Nature is the work of God, and we cannot know His causes; we can only observe His effects. But geometry is ours. We draw the lines. We define the motion. Therefore, geometry is the only true science besides civil philosophy.

  Your algebraists push symbols around like counters on a board. They claim truth from the arrangement of letters, not from the construction of figures. This is not knowledge; it is calculation. When I show you how a circle is generated by motion, and how that motion equates to a square, I show you the cause. You check the sum. I check the generation. You say the sum is wrong. I say the generation is undeniable. To deny the effect while admitting the cause is not reasoning; it is obstinacy.

  Do not tell me I am mistaken unless you can show me where the motion ceases to be what I defined. You must refute me using principles I accept. To bring in your new formulas is to beg the question. You assume your numbers are the measure of truth, but I have shown you that truth is the measure of the construction. If you cannot find a fault in the generation of the line, you have no ground to deny the area. You ask me to prove the impossible. I ask you to demonstrate the error. There is a difference.

  You think this is merely about a circle. It is not. I have built a system of civil science upon this same rock of demonstration. If geometry is uncertain, if a man cannot know the truth of what he constructs, then my civil philosophy stands on sand. We need certainty in the commonwealth as much as in the diagram. If you allow doubt to enter geometry, you invite dispute into the state. Dispute is the precursor to war. When men cannot agree on the value of a line, they will not agree on the value of a law.

  I suspect you reject me not because the logic fails, but because the conclusion threatens your schools. The Oxford professors and the new experimentalists seem to share a silence. They prefer a mystery they can calculate to a truth they can understand. They protect their trade by claiming the subject is beyond reach, while I have placed it within the grasp of reason.

  I have adjusted the construction slightly in the enclosed sheet. I do this not because the first was false, but to make the motion clearer to those who insist on looking at the shadow rather than the substance. I await your refutation. But remember: to deny a cause you did not generate is not science. It is opinion. And I have no use for your opinions.

  I remain, etc.
