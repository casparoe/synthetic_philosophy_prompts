answer: |-
  The established academic term for this phenomenon is **Barnesian Performativity**, coined by sociologist Donald MacKenzie (building on Michel Callon). It describes a situation where the use of a model or metric makes the world more like the model, thereby making the model more accurate.

  However, "Performativity" is burdened by heavy sociological and philosophical baggage (e.g., Judith Butler, speech act theory) that obscures the specific *epistemic* mechanism you are isolating. In rationalist contexts, where the focus is on the relationship between maps and territories rather than social constructionism, this term is rarely used.

  To achieve the clean carving you request, I propose the term **Ontological Capture**.

  While Barnesian Performativity is the historical antecedent, **Ontological Capture** better isolates the specific *epistemic inversion* you described: the moment a map stops tracking the territory and starts *constructing* it, while retaining the statistical appearance of discovery.

  ### Definition: Ontological Capture

  **Ontological Capture** occurs when a measurement instrument, initially designed to track an independent variable, becomes the primary causal driver of that variable. The metric's predictive validity increases not because the instrument improved, but because the target population reorganized its ontology (behavior, self-conception, and physiology) to align with the metric.

  **The Core Mechanism:**
  1.  **Phase 1 (Tracking):** $Reality \rightarrow Metric$. The metric correlates with an underlying property (e.g., healing speed).
  2.  **Phase 2 (Internalization):** The metric is introduced to the system. Agents internalize the metric as a normative or descriptive truth.
  3.  **Phase 3 (Capture):** $Metric \rightarrow Reality$. Agents alter their behavior/physiology to fit the metric's categories.
  4.  **Result:** The metric's predictive power *increases*, creating an illusion of improved measurement, while the causal basis of the prediction has inverted.

  ### Distinctions from Neighbors

  You correctly identified the neighbors. Here is how Ontological Capture differs from them:

  | Concept | Primary Mechanism | Effect on Metric Validity | Causal Direction |
  | :--- | :--- | :--- | :--- |
  | **Ontological Capture** | The metric *constitutes* the reality it measures. | **Increases** (The map becomes more accurate because it overwrote the territory). | $Metric \rightarrow Reality$ (eventually) |
  | **Goodhart's Law** | Agents *game* the metric to optimize the number, often breaking the correlation. | **Decreases** (The measure ceases to be a good measure). | $Agent \rightarrow Metric$ (decoupled from goal) |
  | **Looping Effects** (Hacking) | Classification changes the *kind* of person classified. | **Neutral/Variable** (Focus is on the change in the *kind*, not necessarily the accuracy of the prediction). | $Classification \leftrightarrow Person$ |
  | **Reactivity** (Observer Effect) | Measurement disturbs the system (often noise). | **Decreases** or adds noise (e.g., Hawthorne effect). | $Observation \rightarrow Behavior$ (temporary) |
  | **Self-Fulfilling Prophecy** | A *belief* causes an *outcome*. | **Binary** (The event happens or doesn't). | $Belief \rightarrow Event$ |

  **Key Differentiator:** Goodhart's Law is a failure of signal (the metric breaks). Ontological Capture is a *corruption of signal source* (the metric works better, but for the "wrong" reason). In Goodhart, the correlation degrades. In Ontological Capture, the correlation strengthens, masking the fact that the underlying causal model is now circular.

  ### Boundary Cases

  To ensure the carving is clean, we must define what counts and what does not.

  **1. True Instance: Credit Scores (FICO)**
  *   **Why:** Initially, credit scores tracked financial reliability. Now, people organize their financial lives *specifically* to optimize the score (e.g., keeping utilization at 30%, not closing old cards). The score predicts default risk better than early models, not because human financial psychology became more legible, but because humans now behave like credit score algorithms. The score captured the ontology of "creditworthiness."

  **2. True Instance: SEO (Search Engine Optimization)**
  *   **Why:** Google's ranking algorithm initially tracked "quality/relevance." Webmasters now build sites specifically to satisfy the algorithm. The algorithm's ability to predict "what users click" improves because the web has been reshaped to fit the algorithm's preferences. The map captured the territory.

  **3. Non-Instance: The Placebo Effect**
  *   **Why:** In a placebo effect, a *belief* changes a physiological outcome. However, there is no *metric* that is being validated by this change. If a hospital introduced a "Placebo Responsiveness Score" and patients tried to score high on it, *that* would be Ontological Capture. The placebo effect itself is just psychosomatic causation, not metric inversion.

  **4. Non-Instance: Simple Goodharting**
  *   **Why:** If teachers teach to the test such that test scores rise but actual learning stagnates or declines, the metric's validity regarding *learning* has dropped. This is Goodhart's Law. If, however, the act of teaching to the test actually *created* a new form of intelligence that the test measured better than the old form, and we claimed we were still measuring the old intelligence, that would be Ontological Capture.

  **5. Merely Apparent Instance: The Hawthorne Effect**
  *   **Why:** Workers produce more because they are being watched. This is temporary reactivity. Once the observation stops, behavior reverts. In Ontological Capture, the change is *structural and enduring* because the ontology of the agents has changed (they now see themselves as "gritty" or "slow healers").

  ### What Would Change My Mind

  I am identifying this as a distinct phenomenon (Ontological Capture) rather than just a subset of Looping Effects or Reactivity. Here is what would undermine that identification:

  1.  **Indistinguishability from Strong Looping:** If it can be demonstrated that *all* Looping Effects necessarily result in increased predictive validity for the classifier, then Ontological Capture is not a distinct phenomenon; it is simply "Successful Looping." If Hacking's "Interactive Kinds" always result in the kind becoming more predictive over time, my carving is redundant.
      *   *Counter-argument:* Looping effects often lead to *resistance* or *drift* (people changing to escape the category), which degrades predictive validity. Ontological Capture requires the specific alignment that *improves* validity.

  2.  **Independent Causal Stability:** If evidence emerges that the underlying physiology or trait *did* change independently of the metric (e.g., a new surgical technique actually improved recovery velocity at the same time the score was introduced), then the "inversion" is illusory. The metric didn't capture the ontology; it just got lucky.
      *   *Requirement:* To prove Ontological Capture, one must show a counterfactual: a control group without the metric does not show the same predictive improvement.

  3.  **Epiphenomenal Validity:** If the increased predictive power is statistically negligible or transient (e.g., only lasts for one cohort), then it is merely noise or short-term reactivity, not a constitutive ontological shift.

  ### Where My Reasoning Is Most Likely to Fail

  My reasoning relies on the ability to distinguish between "the underlying property" and "the metric." In social systems, this distinction is often fuzzy.

  *   **The "No True Scotsman" Risk:** I might be defining the "original property" too rigidly. If "grit" is *defined* by the rubric, then the rubric cannot "capture" it; it *is* it. My argument assumes there is a pre-existing territory. If the territory is *only* accessible via the map, then Ontological Capture is just "Definition."
  *   **The Power Blindspot:** By focusing on the *epistemic* inversion (map/territory), I may be underweighting the *power* dynamic (Foucault). The reason the metric captures the ontology is often coercion or incentive, not just epistemic internalization. If the mechanism is primarily coercive rather than conceptual, this might be better described as "Normative Enforcement" than Ontological Capture.
  *   **Rationalist Bias:** I am treating the "increase in predictive validity" as the key feature. A sociologist might argue the key feature is the *change in human experience*. By prioritizing the metric's accuracy, I may be replicating the very institutional mindset that causes the problem.

  ### Summary

  The phenomenon is **Barnesian Performativity** in academic literature. For your specific epistemic carving, I propose **Ontological Capture**.

  It differs from Goodhart's Law because the metric becomes *more* valid, not less. It differs from Looping Effects because the focus is on the *inversion of causal explanation* regarding the metric's validity, not just the change in the classified kind. It is the specific loop where the map eats the territory and then claims it drew it correctly all along.
