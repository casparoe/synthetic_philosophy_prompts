prompt: |-
  As someone who has read rationalist blogs and forums for years, I keep running into a pattern in institutions that I cannot find a clean name for. Here are two instances. A hospital introduces a numerical recovery velocity score to track patients after surgery. At first the score merely summarizes clinical observations. Within a year, patients have learned the score and begin to describe their own recovery in its terms—I am a slow healer, I am ahead of schedule—and nurses start treating the score as the thing itself. The score's predictions improve, but not because the underlying physiology has changed. They improve because the score has become part of what it measures: people now organize their behavior and self-understanding around the category, and the category then looks vindicated. Second instance: a school district adopts a grit rubric. Teachers see students through it, students see themselves through it, and the rubric starts predicting outcomes better than the original research did. Again the prediction improves because the category has been installed in the people it classifies. I know this is near Foucault's normalization and disciplinary power, and near the idea of a looping effect, and near reactivity and Goodhart's law. But it seems to me there is a narrower thing here. The metric does not just change behavior, and it is not just gamed. The metric's predictions become true for a different reason than the reason they were originally true. First the score tracks an independent property; later the property tracks the score. The correlation survives, but the causal explanation of the correlation is replaced. Is there an established name for that specific inversion, or for the broader loop in which a measure becomes constitutive and then self-confirming? If there is, what is it, and how exactly does it differ from each of those neighbors? If there is not, please coin a term and define it, with boundary cases: what would count as an instance, what would not