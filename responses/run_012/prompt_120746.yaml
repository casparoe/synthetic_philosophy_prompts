answer: |-
  The question of whether culture can function as a cause is often obscured by the false dichotomy between materialist and idealist historiography. To resolve this, one must examine the most famous instance of the claim: Max Weber's thesis that the Protestant ethic helped bring about the spirit of modern capitalism. By subjecting this thesis to rigorous conceptual scaffolding, we can determine not only the validity of Weber's specific historical claim but the broader ontological status of cultural causation. The verdict reached here is that culture can indeed be a cause, specifically functioning as a 'difference-maker' within a conjunctural chain of events. However, establishing this requires rejecting an overly rigid evidential test that covertly privileges material explanations, while accepting that explanation by reasons is a legitimate form of causal explanation.

  To assess the Weberian claim, we must first classify the role culture plays. A fourfold classification offers a useful starting point: a cultural factor may be a *difference-maker* (its presence determines the outcome); an *enabling condition* (it makes the outcome possible without selecting it); a *constitutive element* (it is part of the outcome's definition); or a *mere accompaniment* (correlation without causation). Weber's defenders do not need to claim that Protestantism was the sole sufficient cause of capitalism; such mono-causality is historically implausible. Nor should they settle for 'mere accompaniment', which renders the culture epiphenomenal. The 'constitutive' role is also problematic, as modern capitalism exists today in secular and non-Protestant contexts; Protestantism is not part of the definition of capitalism *per se*.

  The most robust defence positions the Protestant ethic as a *difference-maker*. In the specific historical context of early modern Europe, the presence of Calvinist doctrine altered the trajectory of economic behaviour where it was present, compared to where it was absent. It selected a specific form of economic rationality out of available alternatives. However, this classification requires assessment. Is it sufficient? To claim culture is merely a difference-maker risks reducing it to a switch that is flipped by deeper structural forces. A strong Weberian must argue that the cultural content itself—the specific theology of the calling and predestination—generated the causal power. If the classification system implies that a difference-maker must be independent of material conditions to count as a 'true' cause, then the classification is flawed. Culture operates entangled with material reality. Nevertheless, within this framework, the 'difference-maker' status is the only one that grants culture genuine explanatory weight without overstating its autonomy.

  This leads to the philosophical prerequisite for cultural causation: can explanation by reasons be causal explanation at all? Materialist critics often argue that citing a belief or a value explains an action only by rationalising it, not by identifying the efficient cause. If this were true, culture could never be a cause, as culture operates through the medium of human reasons. To deny that reasons are causes is to deny human agency, reducing actors to automatons driven solely by physical or economic impulses. If a merchant refrains from conspicuous consumption because he believes it is sinful, that belief is the cause of his frugality. The mental state is a real event in the world with downstream consequences. Therefore, if the Protestant ethic influenced the 'spirit' of capitalism, it did so by providing new reasons for action which, when aggregated, created new institutions. To deny this is to adopt a behaviourist psychology that cannot account for the complexity of social change. Thus, explanation by reasons is not merely compatible with causal explanation; it is necessary for it in the social realm.

  With the mechanism established, we must apply the evidential test provided: a cultural factor is a cause only if we can specify a historically adjacent case where the factor is absent, the outcome fails, and we can say what stood in its place. Does the Weber case pass? Superficially, yes. One might compare the rapid capitalist development of the Dutch Republic and England against the slower development of Spain or Southern Germany during the same period. In the former, the Protestant ethic was present; in the latter, it was largely absent. The outcome (rational industrial capitalism) failed to emerge in the latter with the same intensity. What stood in the place of the Protestant ethic? A Catholic culture that, through the sacrament of confession and a different moral theology, permitted a more episodic approach to sin and accumulation, lacking the psychological pressure for systematic, lifelong asceticism.

  However, this evidential test requires assessment, for it is treacherous. It demands a counterfactual control group that history rarely provides cleanly. Economic development in Catholic regions was hindered by many factors—state centralisation, inflation from New World silver, geopolitical overextension—making it difficult to isolate culture as the variable of failure. If the test requires that culture be the *only* difference, no cultural explanation could ever pass, nor could most material ones. Furthermore, the requirement to identify 'what stood in its place' risks a materialist bias. It implies that for a cause to be valid, there must be a functional substitute, often conceived in material or institutional terms. If the answer is 'a different set of beliefs', the materialist critic may deem this insufficiently tangible. The test is fair only if applied symmetrically to material causes. We rarely demand of a coal deposit that we show a nearby region without coal where the industrial revolution failed, controlling for all other variables. Therefore, while the Weberian case satisfies the test as well as can be expected in historical sociology, the test itself is too stringent to be a definitive gatekeeper. It makes cultural causation *hard* to prove, but not impossible.

  This difficulty is compounded by the singularity of the Reformation. It was a unique, unrepeatable episode. Does this make the thesis untestable in principle? No. While we cannot rerun the sixteenth century, we can engage in comparative sociology across space. Weber himself attempted this by examining the economic ethics of Confucianism and Hinduism in China and India. He argued that despite the presence of material prerequisites for capitalism in those regions, the cultural-religious framework prevented the specific 'spirit' from emerging. This spatial comparison substitutes for temporal repetition. The singularity makes the thesis hard to test, demanding rigorous comparative work, but it does not render it metaphysical speculation.

  A common objection to admitting cultural causes is that it commits one to counting every self-description a society holds as causally efficacious. If we accept Weber, must we accept that a society's mythological origins or propaganda caused its behaviour? This is a category error. Admitting cultural causes does not require accepting all cultural claims at face value. There is a distinction between *post hoc* rationalisation and *guiding* belief. Weber did not take Protestant sermons as proof of capitalism's origin simply because they existed. He looked for evidence that the beliefs guided conduct: the keeping of account books, the reinvestment of profits, the avoidance of traditionalist leisure. A self-description is causally efficacious only if it can be shown to structure action and constrain choices. Many cultural claims are merely decorative; those that are causal leave a trace in behavioural patterns that diverge from what material incentives alone would predict.

  This divergence highlights what the best version of the Weberian claim predicts that its rivals do not. A purely materialist explanation predicts that capitalism arises wherever technology, trade routes, and property rights allow for surplus accumulation. It predicts a convergence of behaviour based on profit maximisation. The Weberian claim predicts a specific *type* of economic actor: the ascetic entrepreneur who reinvests profit not out of greed, but out of a sense of duty, and who avoids traditionalist consumption even when they can afford it. Materialism predicts the capitalist; Weber predicts the *spirit* of the capitalist. The evidence of early Quaker and Calvinist business practices—characterised by rigid honesty and frugality distinct from mere profit-seeking—supports the Weberian prediction. It suggests that the cultural framework selected a specific pathway of development that material conditions alone did not dictate.

  In conclusion, culture can be a cause. In the Weberian test case, the Protestant ethic functioned as a difference-maker that shaped the specific rationality of modern capitalism by altering the reasons for action available to historical agents. The evidential test provided is a useful heuristic but must not be applied with a rigidity that implicitly demands material substitutes for cultural variables. Explanation by reasons is causal, and the singularity of historical events renders cultural theses difficult to test, but not unprincipled. We need not accept every societal self-description as a cause, only those that demonstrably guide conduct against the grain of mere material incentive.

  My verdict rests on the assumption that human beliefs have the power to override or redirect material impulses. For me to have come out the other way, denying that culture can be a cause, two things would have to be true. First, it would have to be demonstrated that the 'Protestant ethic' was itself entirely determined by prior material conditions—such as class structure or geography—such that religious language was merely a shadow cast by economic reality with no feedback loop into action. Second, it would have to be shown that actors' stated reasons for behaviour are systematically unrelated to their actual conduct, rendering the realm of meaning epiphenomenal. As neither is the case, culture stands vindicated as a genuine engine of historical change.
