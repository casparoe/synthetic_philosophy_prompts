answer: |-
  Right, here is the breakdown for the group chat. I've kept it in British English as requested (no 'obligated' in sight), and laid it out as a menu of interpretations so you can see exactly where Dan went off the rails.

  ***

  **Subject: The 'When in Rome' Autopsy (for the wine-stained record)**

  Hi all, following the weekend's debate, I've dissected the proverb 'When in Rome, do as the Romans do'. It turns out it isn't one claim, but several different ones stacked on top of each other. Depending on which version you use, Dan is either a saint, a pragmatist, or a moral relativist.

  Here are the five distinct readings, ranked from 'obvious' to 'dangerous', with a verdict on each.

  **1. The Prudential Reading ('Don't Make a Scene')**
  *   **The Claim:** If you act differently from the locals, you will attract unwanted attention, confusion, or trouble. Therefore, to avoid hassle, copy them.
  *   **Type of Force:** Prediction / Prudence.
  *   **Verdict:** **Platitude.** Obviously true. If you drive on the left in France, you might die. If you don't tip in New York, the waiter might chase you down the street.
  *   **Does it help Dan?** No. This explains *why* he tipped (to avoid a scene), but it doesn't support his claim that it was *morally wrong* not to. It just means it was risky.
  *   **The Jaywalking Problem:** This actually supports *jaywalking* if everyone else is doing it. If the locals cross on red at 2am and the police ignore it, prudence says cross with them. Dan is inconsistent here.

  **2. The Politeness Reading ('Be a Good Guest')**
  *   **The Claim:** Local conventions are expressions of local culture. Ignoring them is a sign of disrespect to your hosts. You are obliged to follow them as a matter of courtesy, not morality.
  *   **Type of Force:** Etiquette / Social Norm.
  *   **Verdict:** **Plausible.** It is rude to ignore local customs. However, rudeness is not the same as immorality. Eating with your hands might be rude in London, but it isn't *evil*.
  *   **Does it help Dan?** Only partially. It makes stiffing the waiter *rude*, but Dan insisted it was *wrong*. There is a gap between 'cheeky' and 'wicked'.
  *   **The Jaywalking Problem:** If jaywalking is common and accepted socially (despite the law), this reading suggests you should jaywalk to fit in. If it's frowned upon, you shouldn't. Dan needs to check the social temperature, not just the statute book.

  **3. The Reciprocity Reading ('Fair Play')**
  *   **The Claim:** By entering a society, you benefit from its infrastructure and economic arrangements. You are obliged to contribute to them as the locals do. The convention creates the obligation because the system relies on participation.
  *   **Type of Force:** Moral / Quasi-Contractual.
  *   **Verdict:** **Plausible-but-Substantive.** This is the strongest argument for tipping. In the US, tips subsidise wages. If you don't tip, you are effectively consuming labour without paying the agreed price. You are 'free-riding' on a system you didn't build but are using.
  *   **Does it help Dan?** Yes. This gets him to 'morally obliged'. But notice: the obligation comes from *fairness*, not just from the fact that 'Romans do it'. The slogan is doing less work here; the real work is done by the economic reality.
  *   **The Jaywalking Problem:** This cuts against jaywalking. If the law says 'wait', and the social contract is based on rule of law, breaking it undermines the system. Dan is inconsistent unless he argues the jaywalking law is a 'dead letter' that no one relies on.

  **4. The Relativist Reading ('Morality is Local')**
  *   **The Claim:** There is no universal right or wrong in these matters. The only thing that makes an action right is that the locals do it. If the locals push in queues, queue-jumping becomes virtuous.
  *   **Type of Force:** Strong Moral Relativism.
  *   **Verdict:** **Plainly False.** This implies that if the local custom is morally appalling (e.g., discrimination, oppression), you are obliged to participate. Most of us reject this. We think some things are wrong even if the Romans do them.
  *   **Does it help Dan?** It gets him the 'moral obligation' conclusion, but at a terrible cost. He'd have to admit that if he were in a country where bribery was standard, he'd be morally obliged to bribe. I doubt he wants to sign up for that.
  *   **The Jaywalking Problem:** If the locals jaywalk, it becomes 'right'. If they wait, it becomes 'right'. It makes morality too fluid.

  **5. The Legalist Reading ('Obey the Law')**
  *   **The Claim:** 'Romans' refers to the state, not the people. You must follow the local laws, regardless of what people actually do.
  *   **Type of Force:** Legal / Civic Duty.
  *   **Verdict:** **Contentious.** Many argue we have a duty to obey laws abroad. However, the proverb usually refers to *custom*, not statute.
  *   **Does it help Dan?** No. This condemns his jaywalking immediately. It also makes tipping optional (since tipping isn't usually law), which undermines his point about the waiter.
  *   **The Jaywalking Problem:** This solves the inconsistency by calling Dan a hypocrite. He obeyed the 'tipping custom' but broke the 'jaywalking law'.

  ***

  **The Diagnosis: What was Dan actually doing?**

  Dan is smuggling in a premise. He is using **Reading 3 (Reciprocity)** to justify the tip, but hiding behind **Reading 1 (Prudence)** or **Reading 4 (Relativism)** to make it sound like a simple rule of thumb.

  *   **On the Tip:** He is right that not tipping in the US is morally dubious, but not because 'Romans do it'. It's because the US wage system is broken and relies on tips to function. Not tipping there is akin to underpaying a bill. The slogan is just a shortcut for 'respect the local economic contract'.
  *   **On the Jaywalking:** He is inconsistent. If he follows Reading 3 for tipping (respect the system), he should respect the legal system and not jaywalk. If he follows Reading 1 for jaywalking (everyone does it, it's safe), he should apply that to tipping too (everyone does it, it's safe). He can't pick and choose based on which one suits him.

  **The Verdict for the Chat:**
  The slogan is a **platitude** regarding prudence, a **polite suggestion** regarding etiquette, but a **dangerous falsehood** regarding morality. Dan is correct about the tip, but for the wrong reasons. He's treating a specific economic obligation (fair pay) as if it were a general cultural rule.

  Tell him he owes the waiter the money because of fairness, not because of St Ambrose. And tell him to stand at the lights next time.
