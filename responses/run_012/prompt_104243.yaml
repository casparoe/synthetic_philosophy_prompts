prompt: |-
  I am trying to locate precisely where a disagreement with a colleague actually lives, and I would like your own credence as well. The proposition is this: expressivism about normative language — the thesis that the meaning of a sentence such as "lying is wrong" is given, at least in the first instance, by the non-cognitive attitude it conventionally expresses rather than by a truth-conditional content it represents — can be extended to a fully compositional semantics for normative vocabulary in unasserted contexts (negation, conditionals, disjunction, and embedding under propositional-attitude verbs like believes, doubts, and wonders whether) such that (i) the standard arguments come out valid, including the modus ponens from "lying is wrong" and "if lying is wrong then getting your little brother to lie is wrong" to "getting your little brother to lie is wrong"; (ii) the semantics does not overgenerate, i.e. does not license inferences that the pre-theoretical notion of validity forbids; and (iii) the resulting account is still recognizably expressivist rather than a descriptivism wearing an expressivist label.

  My credence is about 0.55; my colleague's is about 0.85. Give me your own number, but more importantly decompose the question and assign a rough probability to each of the sub-questions you think the number depends on, with one line of justification for each, then show how they combine. The sub-questions I would expect to matter include: whether the so-called Frege–Geach problem is really a single problem or a family, and in particular whether the validity of unasserted normative occurrences and the negation problem (that a naive expressivist account of negation threatens to make "lying is wrong" and "lying is not wrong" express the same or the wrong attitude) require separate machinery; whether solving the narrow cases of negation and the conditional suffices, or whether wide embedding under attitude verbs and in questions and nominalizations ("wrongness") is where the real difficulty lies; whether the higher-order-attitude route, on which embedded sentences express attitudes directed at attitudes, can capture the validity of the argument without also validating inferences that should fail; whether the inference in question is genuinely formally valid at all, or merely materially good, so that the demand for a compositional semantics is misplaced; and whether expressivism can survive at all without conceding the Frege point that predication and assertion are one thing while truth is another.

  I should also flag a proposal my colleague has been pushing, which I suspect is doing most of the work in her higher number and which I would like you to assess on its merits. On her view, which she calls the bifurcated-commitment account, an unembedded normative sentence carries an expressive or assertoric clause in addition to its compositional content, while the compositional content itself is supplied by a minimal descriptive surrogate predicate whose extension is fixed by whatever attitude the unembedded sentence would have expressed. Assign a probability to the claim that this account is coherent and genuinely expressivist, and say whether, if it works, it settles the problem or merely relocates it.

  Finally, tell me which sub-question your number is most sensitive to, which of the two people at 0.55 and 0.85 most likely disagrees about, and — this is the part I care about most — what argument or consideration would move your number, and where your own reasoning is most likely to fail.
