          *   Fit: Long Cooling? It disrupts slowly. Is slow disruption "acting"?

  4.  **Selecting the Best Candidates for the Response:**
      *   *Candidate A: The Episodic Agency Rule.* (Focus on discrete events vs. continuous background).
      *   *Candidate B: The Reciprocity Rule.* (Focus on the "answer" aspect Nell mentioned).
      *   *Candidate C: The Disruption Threshold Rule.* (Focus on suddenness/shock vs. gradual pressure).

  5.  **Testing Against the List:**
      *   *Episodic:* Fits all. Cooling fails (it's a trend).
