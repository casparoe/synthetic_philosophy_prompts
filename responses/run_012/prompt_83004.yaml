          *   Problem: Eruption and Gales aren't alive. Nell calls them Actors. So, it's not strictly biological. It's about *unpredictable force*.
      *   *Rule 2: The Event vs. State Rule (Temporality).*
          *   Definition: Actors are discrete events with a beginning and end. Conditions are continuous states.
          *   Fit: Plague (event), Eruption (event), Gales (event), Blight (event).
          *   Fit: Coastline (state), Road (state), Wall (state).
