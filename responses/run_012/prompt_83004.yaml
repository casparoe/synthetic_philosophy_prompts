      *   *Rule 3: The "Answerability" Rule (Reciprocity).*
          *   Definition: Can humans negotiate with it or react to a specific move? Does it "speak"?
          *   Fit: You can flee a plague, pray against gales. You can't negotiate with a coastline; it just sits there.
          *   Fit: Long Cooling? It's slow. You don't "answer" it year-to-year; you adapt over generations. It lacks the "call and response" of a storm.
      *   *Rule 4: The Human-Independence Rule (Autonomy).*
