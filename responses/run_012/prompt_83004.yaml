  2.  **Deconstruct Nell's Logic (The "Data"):**
      *   *Actors:* Plague, Eruption, Gales, Blight, Rats.
          *   Commonality: They are events or agents that *change* the state of things unexpectedly or autonomously. They have agency or a "biography" (start, middle, end, movement). They impose a will (metaphorically) that humans must *answer*.
      *   *Non-Actors:* Coastline, Road, Wall.
          *   Commonality: They are static or human-made structures. They are the *context* in which action happens. The harbour makes the town rich, but it doesn't *do* anything actively; it just *is*.
      *   *The Contested Item:* The Long Cooling (Little Ice Age).
          *   User wants it as an Actor (presence/character).
