answer: |-
  Dear Colleague,

  I have spent considerable time thinking about how to structure your ninety-minute session to achieve the specific phenomenological goals you outlined, and I want to walk you through the design I would actually run if I were in your shoes. I initially considered using a Sudoku-based activity because the verification is so transparent, but I discarded it because it is too difficult to generate instances that are structurally distinct yet visually similar, which is crucial for your point about structure versus size. I also looked at Traveling Salesperson tours, but the verification requires summing weights which introduces arithmetic friction that distracts from the logical asymmetry you want them to feel. Instead, I recommend a Graph Coloring tournament. It is visually immediate, verification is purely local and instant, and it allows us to hide structural tractability behind visual noise. You will need to prepare four large printed graphs, each with fifty vertices and roughly one hundred and twenty edges, distributed to four teams of four students. The graphs should be printed on large poster paper or displayed on separate tablets where students can mark colors digitally, but physical prints with colored markers work best for the tactile sense of commitment.

  The core of the activity relies on how you generate these instances. For Teams One, Two, and Three, you need genuinely hard 3-colorable graphs. Do not attempt to generate these randomly during class or with a naive script, as you might accidentally produce a trivial instance. I advise you to use a standard benchmark library like the DIMACS Challenge graphs or write a simple Python script using the NetworkX library with a fixed seed known to produce graphs near the phase transition threshold for 3-colorability, specifically looking for graphs with high girth and no obvious clusters. You must verify beforehand that these instances are solvable but require backtracking that will exceed the forty minutes of solving time you will allocate. For Team Four, you will generate a bipartite graph, which is 2-colorable and therefore trivially 3-colorable. However, you must disguise this structure. Generate the bipartite sets, connect them randomly, and then apply a random permutation to the vertex labels so that the two partitions are not visually obvious. To the students, Team Four's graph will look just as tangled and complex as the others, satisfying your requirement that one group's problem looks like the others but is tractable due to hidden structure rather than size.

  You will begin the session by distributing the graphs and colored markers, assigning each team a number. Explain that their goal is to color the vertices using only three colors such that no two connected vertices share the same color. Establish the verification rule immediately: you, the instructor, act as the Oracle. Any team can call you over at any time to verify a complete coloring. If it is valid, they receive ten points. If it is invalid, they lose two points. This makes verification easy and low-stakes for them but finding the solution high-stakes. To simulate the encryption aspect, tell them that these graphs represent public locks and their coloring is the private key. The security of the system relies on the assumption that finding the key is hard. Then, introduce the reduction mechanic. Hand Team Two a sealed envelope labeled Translation Key. Tell them that their graph is a structural transformation of Team One's graph. If Team One solves their graph, they can pass their solution to Team Two, who can use the key to instantly translate the colors to their own vertices and claim the win without solving their own puzzle. The Translation Key is simply a list mapping Vertex A on Sheet One to Vertex X on Sheet Two. This physically demonstrates that hardness travels; if Team One's problem is solved, Team Two's problem collapses. To simulate the collapse of the complexity class, announce a global bonus: if any team holding a hard instance (Teams One, Two, or Three) solves their problem, every student in the room receives a bonus point regardless of their team. This creates a shared interest in the solvability of the hard class, mirroring how P equals NP if any complete problem falls.

  The session should run for about forty minutes of pure solving time. You will observe Teams One, Two, and Three struggling. They will try greedy approaches, get stuck, backtrack, and feel the frustration of exponential search space. They will experience firsthand that verifying a partial solution is easy, but extending it is not. Team Four, however, will likely finish within ten to fifteen minutes because a simple breadth-first search solves bipartite graphs efficiently. When Team Four finishes, they will claim their ten points. Crucially, the global bonus does not trigger. This is the moment the room must confront. Team Four will ask why their success didn't help everyone. You will not answer yet. Let them sit with the fact that solving one instance did not solve the class. Around the fifty-minute mark, allow Team One to pass their partial work or full solution if they have it to Team Two. If Team One has not solved it, Team Two remains stuck, reinforcing that the reduction only transfers success, it does not generate it. If Team One has solved it, Team Two wins instantly, proving the reduction link. However, given the hardness of the instances, it is highly probable that Teams One, Two, and Three will not finish. When the timer stops at the fifty-minute mark, declare the activity over. Most teams will have failed.

  This failure is the most important pedagogical tool you have. You must resist the urge to comfort them with the answer. Instead, move immediately into the debrief while the frustration is fresh. Ask them if the fact that they failed proves the problem is hard. They will want to say yes. You must correct them. Explain that their failure is empirical, not mathematical. They ran out of time, not logic. There might be a clever trick they missed. This maps directly to the state of complexity theory today: we have no proof that P does not equal NP, only a lack of successful algorithms so far. Then address Team Four's success. Explain that their problem was in a different subclass (bipartite graphs are in P, general 3-coloring is NP-Complete). The visual similarity masked the structural difference. This illustrates that size is not the source of difficulty, structure is. Finally, address the encryption point. Remind them that the security of their digital lives relies on the bet that the hard graphs given to Teams One, Two, and Three are inherently hard, not just hard for undergraduates in ninety minutes. We act as if P is not equal to NP because the landscape looks that way, not because we have a theorem saying so.

  There are predictable failures you must manage. The most common issue is that a clever student might recognize the bipartite structure in Team Four's graph despite your permutation. If this happens, acknowledge it immediately and use it to reinforce the point about structure. Ask them to explain why that structure makes it easy and why they couldn't find that structure in the other graphs. Another risk is that Team One and Team Two might get bogged down in the Translation Key mechanics. To prevent this, keep the mapping simple, perhaps grouping vertices by clusters in the key, or ensure the vertex labels are large and clear. A third risk is that students might try to brute force the hard graphs by guessing. The penalty for incorrect verification should discourage random guessing, but you may need to enforce a limit on verification requests if they abuse it. The most significant limitation of this activity is that it cannot reproduce the actual mathematical proof of reduction. You are simulating a reduction via isomorphism for simplicity, whereas real NP-Completeness reductions involve transforming problem types, not just relabeling. You will have to supply this nuance yourself in the debrief, explaining that while you showed them a trivial reduction, the real theory says any problem in NP can be reduced to these graphs, which is why solving one solves all. You must also be careful not to imply that Team Four's problem was useless; emphasize that knowing which class you are in is the hard part, which is why cryptography works. If you manage the timing strictly and ensure the hard instances are genuinely resistant to naive search, this activity will leave them with a visceral understanding of why we trust encryption despite lacking a proof, and why the line between easy and hard is a matter of landscape, not just effort.
