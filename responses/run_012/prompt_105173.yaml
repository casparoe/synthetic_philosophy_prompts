answer: |-
  # Desiderata for a Theory of Therapy and Enhancement

  To serve the public, defensible needs of an insurer, a regulator, and a clinician, a theory of the therapy/enhancement distinction cannot be merely metaphysical. It must be operational. The following five desiderata outline the constraints any adequate theory must satisfy. Each is motivated by specific cases or distinctions required by the seminar parameters.

  ### 1. The Functional Baseline Requirement
  **Motivation:** The theory must distinguish between restoring a capacity to a level where the organism functions as intended versus raising that capacity beyond its intended design. This is motivated by the **Growth Hormone (GH)** cases and **SSRIs**.
  *   **Case Classification:**
      *   *GH for deficiency:* Therapy. The biological system for growth is broken.
      *   *GH for short healthy child:* Enhancement. The system works; the output is merely at the lower end of the distribution.
      *   *SSRIs for depression:* Therapy. Restores mood regulation function.
      *   *SSRIs for shyness:* Enhancement. Modulates a personality trait within functional range.
  *   **Requirement:** The theory must define a baseline of "normal functioning" that is not merely statistical average but tied to the organism's biological design or species-typical functional organization.
  *   **Rules Out:** Purely statistical definitions (where the bottom 10% is "disease" and the top 10% is "enhancement") and purely subjective definitions (where "feeling better" dictates the category).
  *   **Status:** **Non-negotiable.** Without a functional baseline, the insurer cannot distinguish repair from upgrade.

  ### 2. The Contextual Relativity Requirement
  **Motivation:** Function is not absolute; it is relative to the environment and the agent's goals. This is motivated by the **Corrective Lenses** cases.
  *   **Case Classification:**
      *   *Lenses for myopia:* Therapy. Restores species-typical visual function for general navigation.
      *   *Lenses for fighter pilot (20/10):* Enhancement (relative to human baseline) but potentially Therapy (relative to occupational requirement). The theory must allow that an intervention can be therapy *for a role* while being enhancement *for a human*.
  *   **Requirement:** The theory must permit the "baseline" to shift based on legitimate environmental demands or occupational standards, provided those standards are publicly justified and not arbitrary.
  *   **Rules Out:** Rigid biological essentialism that ignores the fact that "disability" is often a mismatch between body and environment.
  *   **Status:** **Negotiable.** If made too flexible, it risks collapsing into "whatever is useful is therapy," erasing the distinction. To maintain it, we must restrict "context" to essential social roles (e.g., safety-critical jobs) rather than competitive advantages.

  ### 3. The Normative Revisability Constraint
  **Motivation:** Medical categories are not static facts of nature; they evolve with moral understanding. This is motivated by the **Cochlear Implant** cases and the historical constraint regarding **Homosexuality**.
  *   **Case Classification:**
      *   *Cochlear implant in deaf infant:* Therapy. The child has an "open future" and cannot consent to exclusion from the hearing world; the intervention restores access to the dominant mode of communication.
      *   *Cochlear implant in deaf adult (cultural):* Enhancement (or violation). If the adult identifies with Deaf culture and does not view their state as a deficit, forcing "correction" is not therapy.
      *   *Homosexuality:* Must be classifiable as non-pathological despite past medical consensus.
  *   **Requirement:** The theory must allow the definition of "defect" to be revised based on moral progress and community consensus, not just biological discovery. It must distinguish between "statistically unusual" and "bad for the bearer."
  *   **Rules Out:** Biological determinism that treats current diagnostic manuals as infallible maps of nature. It prevents the theory from cementing current prejudices into "biology."
  *   **Status:** **Non-negotiable.** A theory that cannot accommodate the de-pathologization of homosexuality is morally bankrupt and historically naive.

  ### 4. The Non-Identity of Improvement and Enhancement
  **Motivation:** Not every intervention that makes a life better is an enhancement in the policy sense. This is motivated by the **Sleep Pill**, **Anti-Aging**, and **Statins** cases.
  *   **Case Classification:**
      *   *Sleep pill (8hrs to 4hrs):* Enhancement. Reduces a biological need without pathology.
      *   *Anti-aging in healthy people:* Prevention/Enhancement hybrid. If aging is not a "disease," slowing it is enhancement, even if it improves life.
      *   *Statins (Familial Hypercholesterolemia):* Therapy. Corrects a specific pathological mechanism.
      *   *Statins (Average cholesterol + history):* Prevention. This tests the therapy/prevention collapse. The theory must classify this as distinct from therapy (risk reduction vs. cure) to manage insurer liability.
  *   **Requirement:** The theory must distinguish between *restoring/maintaining health* (Therapy/Prevention) and *exceeding health* (Enhancement), even if both "improve" the subject's welfare. It must not collapse therapy into prevention, or insurers would be liable for all risk-reduction measures indefinitely.
  *   **Rules Out:** Utilitarian definitions where "whatever maximizes well-being is therapy."
  *   **Status:** **Non-negotiable.** If "improvement" equals "therapy," the distinction vanishes, and the insurer's budget becomes infinite.

  ### 5. The Teleological Transparency Requirement
  **Motivation:** The purpose of the distinction changes depending on who is asking. This is motivated by Section (d) regarding the **Insurer, Regulator, and Clinician**.
  *   **Case Classification:**
      *   *Gene edit for muscle mass:*
          *   *Clinician:* Contraindicated (risk/benefit ratio poor for healthy patient).
          *   *Insurer:* Not covered (not medically necessary).
          *   *Regulator:* Banned (unfair advantage/doping).
      *   The theory must explain why the *same intervention* receives different labels or valuations depending on the institutional goal.
  *   **Requirement:** The theory must explicitly state whether it is defining a metaphysical category (what the intervention *is*) or a normative category (what we should *do* with it). It must allow for the possibility that an intervention is biologically an enhancement but socially a requirement (e.g., vaccines).
  *   **Rules Out:** The assumption that there is a single "God's eye" classification that solves all policy problems.
  *   **Status:** **Negotiable.** One could argue for a unified metaphysical definition that is then applied differently. However, transparency about the divergence is safer.

  ---

  ### Analysis of the Desiderata

  #### Which Desiderata Do the Real Work?
  The two desiderata that exclude the most candidate theories are **D1 (Functional Baseline)** and **D3 (Normative Revisability)**.
  *   **D1** excludes purely subjective or welfare-based theories (e.g., "therapy is whatever makes you happier"). It forces the theory to grapple with biological facts.
  *   **D3** excludes purely biological or naturalistic theories (e.g., "therapy is whatever fixes a deviation from species design"). It forces the theory to grapple with social values.

  Most failed theories fail one of these: they are either too rigid (biological essentialism) or too fluid (preference satisfaction).

  #### The Joint Unsatisfiability (The Tension)
  I argue that **D1 (Functional Baseline)** and **D3 (Normative Revisability)** are jointly unsatisfiable in a single, unified, publicly defensible framework.

  *   **The Conflict:** D1 requires an objective, stable baseline so an insurer can calculate risk and a regulator can enforce rules. If the line moves, contracts and regulations become unstable. D3 requires that the line *must* move when our moral understanding changes (e.g., Deaf culture, neurodiversity).
  *   **The Consequence:** You cannot have a line that is both *fixed enough for budgeting* and *flexible enough for moral progress*.
      *   If you prioritize D1 (Fixed Baseline), you risk pathologizing cultural differences (e.g., insisting Deaf adults need implants).
      *   If you prioritize D3 (Flexible Baseline), you lose public defensibility (e.g., an insurer cannot budget if "deficiency" is subject to cultural negotiation).
  *   **Resolution:** The theory must be **pluralistic**. There is no single "Therapy/Enhancement" distinction. There is a *Clinical* distinction (focused on D1), a *Cultural* distinction (focused on D3), and a *Policy* distinction (a pragmatic compromise). A theory claiming to be one-size-fits-all is lying.

  #### Purpose-Dependence (Section d)
  Is this one distinction or three? **It is three.**
  *   **The Clinician** asks: "Is there pathology?" (Relies on D1).
  *   **The Regulator** asks: "Is there unfair advantage?" (Relies on D2/D4).
  *   **The Insurer** asks: "Is there obligation?" (Relies on D4/D5).
  A theory that assumes they have the same answer is answering a question nobody asked. The "Therapy/Enhancement" label is a placeholder for three different normative judgments.

  #### Confidence and Negotiability

  | Desideratum | Status | Confidence | Notes |
  | :--- | :--- | :--- | :--- |
  | **D1: Functional Baseline** | **Non-negotiable** | High | Without this, "therapy" means nothing. I would defend this against welfare-based critiques. |
  | **D2: Contextual Relativity** | Negotiable | Medium | Can be restricted to safety-critical roles to prevent scope creep. |
  | **D3: Normative Revisability** | **Non-negotiable** | High | Moral progress (Homosexuality case) trumps theoretical tidiness. |
  | **D4: Improvement ≠ Enhancement** | **Non-negotiable** | High | Essential to prevent the distinction from collapsing into "good vs. bad." |
  | **D5: Teleological Transparency** | Negotiable | Medium | One could argue for a unified metaphysical base, but I am less sure this is possible given the tension between D1 and D3. |

  **Least Sure Point:** I am least sure about **D3 (Normative Revisability)** in the context of the **Insurer**. While morally necessary, it is administratively chaotic. If "deafness" is not a deficit for one group but is for another, how does a national insurer code the claim? I defend D3 as a moral requirement, but I acknowledge it may break the "public defensibility" requirement for the insurer. This confirms the tension: we may have to sacrifice a unified administrative theory to preserve moral correctness.

  **Most Defensible Claim:** **D4 (Improvement ≠ Enhancement).** This is the easiest to defend against critics who claim "all medicine is enhancement." Sleep pills and anti-aging interventions clearly improve life but intuitively fall outside the scope of medical obligation. Distinguishing "need" from "want" (or "health" from "optimization") is the only way to keep healthcare systems solvent.

  **Conclusion for the Seminar:**
  Begin by presenting D1 and D3 as the twin pillars of the debate. Show how every historical attempt to define enhancement fails because it leans too hard on one and breaks the other. Conclude that the "Therapy/Enhancement" distinction is not a discovery of nature, but a **negotiated boundary** between biology and budget, which shifts depending on whether you are holding a stethoscope, a checkbook, or a whistle.
