      *   **Specific Constraints:**
          *   Address two specific tensions: (1) Does physiological determinism vindicate him or flatten him/open him to pathography? (2) Is wellness culture a new Ascetic Ideal or a project of "Great Health"?
          *   Base arguments on actual Nietzschean concepts (decadence, ascetic ideal, *ressentiment*, great health, suspicion of moralized improvement, body as multiplicity).
          *   **Crucial:** Mark clearly what is textually supported vs. extrapolation.
          *   **Crucial:** Be honest if the question is malformed or if the answer is largely guessing. Don't play along if it's a category mistake.

