answer: |-
  You're right to press me on the pill, because if Reflection were simply a blind algebraic constraint—match whatever number you expect to see in your own head tomorrow—it would indeed be absurd. It would turn foresight of my own corruption into a license for current delusion. So let me state the restriction outright, not as a retreat, but as the actual shape of the principle: Reflection governs only those future selves I expect to be updating on evidence I currently lack, via processes I currently endorse as truth-tracking. In your pill case, I know the shift in credence comes from chemistry, not evidence. I don't treat that future self as an epistemic proxy; I treat them as a victim. So the principle doesn't command me to align with them. It costs me nothing to admit this, because the authority I owe my future self is never about the mere passage of time; it's about the expected accumulation of truth-conducive information.

  Now, regarding the cases that interest you—exhaustion, fear, love—we have to distinguish whether those states are functioning as evidence or as noise. If I expect to be frightened tomorrow because I will have learned something dangerous, my fear is evidence, and Reflection holds: I should be somewhat anxious now. But if I expect to be frightened because of a panic disorder unrelated to the world's state, then like the pill, it breaks the epistemic link. I'm happy to bite the bullet that in those latter cases, I owe my future self no deference. The principle isn't about obeying whoever happens to inhabit my skin tomorrow; it's about respecting the trajectory of reason. If that trajectory is severed, the obligation dissolves. Does that distinction between emotional evidence and emotional impairment track with the cases you're looking to explore?
