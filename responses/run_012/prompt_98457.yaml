answer: |-
  ### The "What's Off-Limits?" Decision Tree

  Start with a specific case that bugs you (kidney sales, price gouging, vote selling, etc.). Answer the questions below based on *that* case. Don't worry about being consistent across different cases yet; just follow your intuition for the one you picked.

  **Node 1: The Reversibility Test**
  *Case: Kidney Sales.* Imagine the transaction reversed: the rich person sells a kidney to the poor person (money flows to the poor). Does your moral objection disappear or significantly weaken?
  *   **Yes, it disappears.** → Go to **Node 2** (Distributive Branch).
  *   **No, it still feels wrong.** → Go to **Node 4** (Commodification Branch).

  ---

  #### **Distributive Branch (Objection depends on who has the money)**

  **Node 2: Source of Harm**
  *Case: Hurricane Price Gouging.* Is the problem primarily the *disaster conditions* that created the need, or the *high price* itself?
  *   **The Disaster Conditions.** → Go to **Node 3**.
  *   **The High Price.** → **Leaf: Fairness View (Unnamed)**.
      *   *Awkward Commitment:* You must oppose mutually beneficial trades simply because the price ratio looks unequal, even if both parties agree.

  **Node 3: Remedy**
  *Case: Hurricane Price Gouging.* Should we ban the market to protect people, or fix the background inequality so the market doesn't hurt them?
  *   **Fix the Inequality.** → **Leaf: Background Injustice View**.
      *   *Awkward Commitment:* You must tolerate potentially exploitative sales in the present until the perfect society is built.
  *   **Ban the Market.** → **Leaf: Soft Paternalism (Unnamed)**.
      *   *Awkward Commitment:* You override people's current choices to protect them from circumstances you admit aren't the market's fault.

  *(Flagged Unoccupied Combination: Reversibility = Yes + Deal Focus. If you think the objection vanishes when money flows the other way, you usually care about the market structure, not just the individual handshake. Nobody really says "This specific deal is fine because the seller is rich, but a general market is bad.")*

  ---

  #### **Commodification Branch (Objection stays even if money flows the other way)**

  **Node 4: Locus of Wrong**
  *Case: Paying a Stranger to Be Your Friend.* Is the wrongness located in *this specific handshake* (the transfer), or in the fact that *a market exists* for this at all?
  *   **This Specific Handshake.** → Go to **Node 5**.
  *   **A Market Exists.** → Go to **Node 6**.

  **Node 5: Consent Sufficiency**
  *Case: Vote Selling or Selling Your Spot in a Queue.* If everyone involved consented fully and understood the risks, would the transaction be permissible?
  *   **Yes, Consent is Enough.** → **Leaf: Markets Without Limits**.
      *   *Awkward Commitment:* You must accept that political votes or human body parts are fundamentally no different from toaster ovens.
  *   **No, Consent Isn't Enough.** → **Leaf: Voluntarist/Consent-Only View**.
      *   *Awkward Commitment:* You claim consent is the only moral gatekeeper, but then admit some goods (like votes) aren't yours to consent away.

  **Node 6: Source of Norms**
  *Case: Commercial Surrogacy.* Is the repugnance toward this market based on timeless human meanings, or just current social norms?
  *   **Current Social Norms.** → **Leaf: Conventionalist View**.
      *   *Awkward Commitment:* You must admit that selling babies would be morally fine if society just got used to it for long enough.
  *   **Timeless Human Meanings.** → Go to **Node 7**.

  **Node 7: Mechanism of Harm**
  *Case: Commercial Surrogacy.* Does the market corrupt the *value of the good* (the child), or does the institution turn the *person into a tool* (the mother)?
  *   **Corrupts the Good.** → **Leaf: Corruption-of-Meaning View**.
      *   *Awkward Commitment:* You must argue that private, non-market surrogacy is meaningfully different from commercial surrogacy, even if the physical act is identical.
  *   **Turns Person into Tool.** → **Leaf: Institutional View**.
      *   *Awkward Commitment:* You must claim individual participants are blameless while condemning the system that enabled their choices.

  *(Flagged Indistinguishable Leaves: **Corruption-of-Meaning** and **Institutional View**. In practice, these often collapse into each other because changing the meaning of a good usually requires an institution to enforce that meaning. Students picking either end up banning the same markets.)*

  Summary: The Reversibility Test does the most sorting work because it immediately separates those who object to inequality from those who object to the market itself.
