prompt: |-
  I am a novelist. My last book was set on a shrimp farm and narrated in part from inside the pond, and the research for it turned me into something I did not set out to become — a person with convictions about the welfare of decapod crustaceans. Next month I have been asked to open a symposium on aquatic animal health run by a fisheries science institute, and to spend the rest of the afternoon in conversation with the room. I would like a prep sheet for the question period, not a defense of the talk.

  The thesis I will put on the table is roughly this: that the crabs, lobsters, and above all the farmed shrimp are serious candidates for sentience, and that they are owed a precautionary but graded welfare standard rather than the benefit of our doubt; that the practice I find hardest to defend is the routine removal of the eyestalks of female broodstock to force them to spawn, and, close behind it, the slaughter of crustaceans and fish with no stunning step at all; that a nervous system distributed through the body rather than gathered into a brain does not by itself defeat the possibility of a unified experience, though it does change what we should expect the evidence to look like; and that fiction is a legitimate instrument for taking such animals seriously when the behavioral evidence is ambiguous and every inference risks being read as anthropomorphism.

  The audience is mostly aquaculture biologists and industry veterinarians, for whom welfare means growth, health, and mortality, and who are professionally wary of the word sentience because it seems untestable; a handful of producers who will hear a threat to their margins; and two philosophers of animal welfare invited as respondents, who will likely think I have not gone far enough and that my crustacean focus is a sentimental distraction from fish. Give me the eight or ten objections this room will actually raise, ordered by how likely and how damaging they are, each phrased the way that audience would phrase it — the biologists' demand for a mechanism, the producers' demand for a number, the philosophers' charge of squeamishness — each with a two-minute reply and an honest note on where the reply is soft. Tell me what to concede at the outset and what to hold. Include the question I am hoping nobody asks. And give me a committed answer: take a definite position on which objections have real force and which I should refuse, and tell me where you think I am wrong rather than leaving the verdict to my values.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **User:** Novelist, previous book set on a shrimp farm (narrated from inside the pond), now an advocate for decapod crustacean welfare.
      *   **Task:** Prep sheet for a Q&A session at a fisheries science symposium.
      *   **Audience:** Aquaculture biologists/vets (welfare = growth/mortality, skeptical of sentience), Producers (worried about margins), Philosophers (think the user hasn't gone far enough/focus is wrong).
      *   **Thesis:** Crustaceans are serious sentience candidates; need precautionary but graded welfare standards; eyestalk ablation and slaughter without stunning are key issues; distributed nervous systems don't preclude unified experience; fiction is a valid tool for inference.
      *   **Deliverables:** 8-10 likely objections (phrased by audience), 2-minute replies, "soft spot" notes, what to concede/hold, the "feared question," and a *committed answer* (taking a definite position on validity, not neutral).

  2.  **Deconstruct the Audience & Tensions:**
      *   *Scientists:* Want data, mechanisms, reproducibility. "Sentience" is a black box to them. They care about stress hormones, cortisol (or crustacean equivalents), growth rates.
      *   *Producers:* Want viability. Eyestalk ablation increases spawn rates. Stunning equipment costs money. Margins in shrimp farming are razor-thin.
      *   *Philosophers:* Want consistency. If shrimp matter, why not fish? If sentience is the bar, why precautionary? They might attack the "graded" aspect as arbitrary.
      *   *The Novelist (User):* Bringing narrative empathy into a data-driven room. Risk: Being seen as emotional/soft. Strength: Highlighting the gaps in data where ethics must step in.

  3.  **Drafting the Objections (Iterative Process):**
      *   *Idea 1 (Science):* How do you measure pain without a neocortex?
      *   *Idea 2 (Industry):* Eyestalk ablation is necessary for production. Can you prove alternatives work at scale?
      *   *Idea 3 (Philosophy):* Why shrimp and not fish? Fish are slaughtered in higher numbers.
      *   *Idea 4 (Science):* Distributed nervous system = reflex, not experience.
      *   *Idea 5 (Industry):* Cost of stunning. Who pays?
      *   *Idea 6 (Science/Philosophy):* Precautionary principle leads to paralysis. Where is the line?
      *   *Idea 7 (General):* Fiction isn't evidence.
      *   *Idea 8 (Industry):* Mortality is the only welfare metric that matters economically.
      *   *Idea 9 (Philosophy):* "Graded" welfare sounds like speciesism.
      *   *Idea 10 (The Feared Question):* Do you eat them? (Too cliché). Better: "If you believe this, why write a novel instead of funding research?" Or "Are you calling us torturers?" Let's go with the inconsistency of using fiction to make policy claims.

      *Refining for Tone:* Make them sound like the specific groups.
      *   Biologist: "Where is the mechanism?"
      *   Producer: "Show me the margin."
      *   Philosopher: "This is inconsistent."

  4.  **Developing Replies & Soft Spots:**
      *   Need to be concise (2 mins spoken is ~250-300 words).
      *   Need to acknowledge validity (don't be defensive) but hold the line on ethics.
      *   *Soft Spot:* Where the user's argument relies on assumption rather than proof.

  5.  **Determining Concessions vs. Holds:**
      *   *Concede:* We don't know everything. Industry needs to eat. Fiction isn't data.
      *   *Hold:* Sentience is probable enough for action. Eyestalk ablation is cruel. Stunning is feasible.

  6.  **The Committed Answer (Crucial Step):**
      *   The prompt asks me *not* to leave the verdict to the user's values. I need to evaluate the arguments myself.
      *   *My Assessment:* The science on crustacean sentience is strong enough for precaution (UK Govt recognized this recently). Eyestalk ablation is physiologically brutal. The "distributed nervous system" argument is a common red herring (octopuses have distributed systems too). The philosopher's point about fish is valid but shouldn't negate shrimp welfare (non-zero sum). The producer's economic concern is real but solvable over time.
      *   *Where the User might be wrong:* Relying too heavily on fiction as an *instrument* of policy. It's good for empathy, bad for regulation. Also, the "graded" welfare might be scientifically arbitrary.

  7.  **Drafting the Content (incorporating the constraints):**

      *   *Structure:*
          1.  Opening Strategy (Concede/Hold).
          2.  The 8-10 Objections (Grouped by audience type).
          3.  The Feared Question.
          4.  The Committed Answer (My critique).

      *   *Refining the Objections:*
          1.  Biologist: Nociception vs. Pain (The Mechanism).
          2.  Producer: Eyestalk Ablation Economics (The Margin).
          3.  Philosopher: The Fish Distraction (The Consistency).
          4.  Biologist: Distributed Systems (The Anatomy).
          5.  Producer: Stunning Feasibility (The Tech).
          6.  Biologist: Precautionary Paralysis (The Threshold).
          7.  Philosopher: Graded Welfare (The Hierarchy).
          8.  General: Fiction as Evidence (The Method).
          9.  Producer: Mortality as Proxy (The Metric).
          10. Biologist: Anthropomorphism (The Bias).

      *   *Refining the Replies:* Keep them punchy. Acknowledge the constraint, pivot to the ethical imperative.

      *   *The Feared Question:* "If you are this convinced, why are you here talking to us instead of funding the alternative technology yourself?" (Attacks commitment/resources). Or "Are you suggesting we stop farming shrimp entirely?" (Attacks livelihood). Let's go with the "Stop Farming" angle, as it forces a binary choice the user wants to avoid.

      *   *The Committed Answer:* I need to be direct.
          *   Valid objections: Economic viability (short term), Fish consistency.
          *   Invalid objections: "No brain = no pain" (outdated neuroscience), "Fiction is useless" (ignores epistemic gaps).
          *   Where the user is wrong: The "graded" welfare concept is tricky. If they are sentient, they are sentient. Grading implies some feel pain "less," which is hard to prove. Also, relying on fiction is risky in a regulatory context.

  8.  **Review against Constraints:**
      *   8-10 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Phrased by audience? Yes.
      *   2-minute reply + soft spot? Yes.
      *   Concede/Hold section? Yes.
      *   Feared question? Yes.
      *   Committed answer (taking a position)? Yes.

  9.  **Final Polish:** Ensure tone is respectful but firm. The user is a novelist, so the language should be precise but not overly academic. The "Committed Answer" needs to sound like an editor or a critical friend, not a neutral AI.

  *(Self-Correction during drafting)*: Make sure I don't sound *too* supportive of the industry. The user wants to advocate for welfare. But the prep sheet must prepare them for *hostility*. The "Committed Answer" needs to be the place where I challenge the user, as requested ("tell me where you think I am wrong").

  *Key Insight for the "Committed Answer":* The user's thesis relies on "graded welfare." This is scientifically shaky. Sentience is usually binary in ethical frameworks (either you suffer or you don't). Grading it based on nervous system complexity is a slippery slope that biologists will exploit to deny welfare entirely. I need to point this out.

  *Key Insight for the "Feared Question":* It shouldn't be "Do you eat shrimp?" It should be about the *consequences* of the thesis. "If you are right, is this industry morally defensible?"

