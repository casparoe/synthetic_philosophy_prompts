answer: |-
  You have identified a genuine and subtle structural flaw in reasoning, one that is pervasive in evolutionary psychology and behavioural ecology. While there is no single, canonical noun-phrase for this exact manoeuvre (like "The Naturalistic Fallacy" in ethics), it is a recognised species of error within the philosophy of biology.

  If we are to carve it out precisely, the most accurate existing diagnosis is that your friend is committing a **Null Hypothesis Error** via an **Immunizing Stratagem**. However, to capture the specific dynamic you described—the hollow concession followed by re-absorption—I propose we label this pattern **The Adaptive Re-absorption**.

  Here is the carving of the concept, its distinction from neighbouring ideas, and the conditions required to escape it.

  ### 1. The Diagnosis: The Adaptive Re-absorption

  The pattern you describe is not simple dogmatism. Your friend is not denying the existence of byproducts (spandrels) or drift. Rather, they are employing a logical structure that renders those categories empty in practice.

  The structure runs as follows:
  1.  **Observation:** Trait $T$ exists and appears fit for Function $F$.
  2.  **Hypothesis:** $T$ exists *because of* $F$ (Adaptation).
  3.  **Challenge:** Could $T$ be a byproduct of Constraint $C$?
  4.  **Concession:** Yes, in principle.
  5.  **Re-absorption:** However, for $T$ to persist, it must not be deleterious. If it is neutral or beneficial, selection will act on it. Its current "fit" suggests it is beneficial. Therefore, selection is the relevant explanation for its current form, even if not its origin.

  The error lies in the slide from **maintenance** to **explanation**. That a trait is *maintained* by selection (or drift) is not the same as saying its specific form is *explained* by selection. By treating any trait that survives as "standing variation for selection to act upon," your friend converts all existence into potential adaptation. The "fit" you observed is treated as evidence of selection, rather than a phenomenon that requires an explanation independent of selection.

  This is an **Immunizing Stratagem**. In the philosophy of science (notably discussed by Karl Popper and later Imre Lakatos), this occurs when a theory is protected from refutation by making auxiliary assumptions that absorb counter-evidence. Here, the auxiliary assumption is: *"If it persists, it is effectively adaptive."*

  ### 2. Distinctions from Nearest Notions

  To understand why this is distinct, we must separate it from three neighbouring concepts.

  **A. Pan-adaptationism (The Panglossian Paradigm)**
  *   **The View:** Every trait is an optimal adaptation for a specific function. Byproducts do not exist.
  *   **The Difference:** Your friend *admits* byproducts exist. Pan-adaptationism is an ontological claim (everything is an adaptation). Your friend's view is methodological (everything is *treated* as an adaptation until proven otherwise, but the proof is rigged). The Adaptive Re-absorption is more insidious because it feigns openness.

  **B. The Just-So Story**
  *   **The View:** Narratives about adaptation that are untestable.
  *   **The Difference:** You noted your friend treats stories as testable *in principle*. The vice here is not a lack of testability, but a **burden of proof inversion**. In a Just-So story, no test is offered. In Adaptive Re-absorption, tests are offered, but the null hypothesis (drift/constraint) is set so high that it can never be met. The friend demands you prove *negative* selection or *impossible* constraint, rather than requiring them to prove positive selection.

  **C. Exaptation**
  *   **The View:** A trait evolves for one purpose (or no purpose) and is later co-opted for another (e.g., feathers for warmth, then flight).
  *   **The Difference:** Exaptation is a valid biological concept. The fallacy arises when "exaptation" is used as a rescue device to save adaptationism. If your friend argues, "It started as a byproduct, but was *refined* by selection," they must provide evidence of that refinement (e.g., comparative phylogenetics showing the trait changing in correlation with the function). If they assume refinement solely based on current utility, they are committing the Adaptive Re-absorption.

  ### 3. The Core Logical Error: The Retention Fallacy

  At the heart of this pattern is what we might coin **The Retention Fallacy**.

  The argument is: *"The trait persists; therefore, it must be useful; therefore, selection explains it."*
  This ignores **Neutral Theory**. Traits can persist simply because they are not harmful enough to be weeded out, or because they are genetically linked to other traits that *are* selected for (hitchhiking).

  By conflating **persistence** with **utility**, your friend makes the adaptive explanation unfalsifiable. To falsify it, one would have to prove the trait is actively harmful (which would lead to its removal) or that it is impossible to build (developmental constraint). But most traits are merely neutral. The Adaptive Re-absorption treats neutrality as a temporary waiting room for adaptation, rather than a valid final destination.

  ### 4. What Would Sincere Non-Adaptive Reasoning Look Like?

  To entertain a non-adaptive explanation sincerely, one must invert the methodological default. This is the **Null Hypothesis of Neutrality**.

  A sincere researcher does not ask: *"What is the function of this trait?"*
  They ask: *"Can this trait's distribution and form be explained by drift and constraint alone?"*

  To do this, they would need to provide one of the following, independent of the "fit" you observed:
  1.  **Phylogenetic Bracketing:** Show that the trait exists in ancestors who did not have the function, or in sister species who do not have the function. (e.g., "We have chins, but our ancestors didn't need them for speech, and chimps don't have them.")
  2.  **Developmental Modelling:** Demonstrate that the trait is an inevitable physical consequence of growing a larger brain or a different bone structure, regardless of utility.
  3.  **Neutral Simulations:** Show that the frequency of the trait in the population matches what would be expected by random drift, rather than the signature of a "selective sweep."

  If your friend is unwilling to run these tests, or dismisses them because "selection is a stronger force," they are not doing evolutionary science; they are doing **natural theology** with a genetic vocabulary.

  ### 5. Is This Pattern Always a Vice?

  Not necessarily. There is a context where this heuristic is useful, known as **Methodological Adaptationism**.

  If you are studying the heart, assuming it is for pumping blood is a productive starting point. The "fit" is so complex, specific, and costly that drift is an implausible explanation. In cases of **complex design**, the prior probability of adaptation is high.

  However, the vice emerges when this heuristic is applied to **subtle, low-cost, or pleiotropic traits** (like certain cognitive biases, aesthetic preferences, or minor morphological details). In these cases, the "fit" is often vague (e.g., "music binds groups"), and the cost of the trait is low. Here, the Adaptive Re-absorption becomes a vice because it stops the enquiry. It accepts a plausible story as a proven mechanism.

  ### Summary

  The pattern has no single canonical name, but it is best described as **The Adaptive Re-absorption**, underpinned by **The Retention Fallacy**.

  It differs from pan-adaptationism because it admits exceptions in theory; it differs from Just-So stories because it claims testability. Its defining feature is the **hollow concession**: it allows the category of "byproduct" to exist, but structurally prevents any specific instance from ever occupying it.

  To escape it, one must treat **drift** not as a rival theory to be defeated by "fit," but as the **null hypothesis** to be defeated by evidence of specific selective history. If your friend cannot specify what evidence would convince them that a trait is *not* adaptive (other than it being actively harmful), then their explanation is, for all scientific purposes, unfalsifiable.
