  NOTICE OF REGULATORY UPDATE: CAUSAL LIABILITY FRAMEWORK
  **Effective Date:** 1st November

  Oakhaven Town Council is pleased to announce the implementation of the Omission-as-Causation Protocol. This reform streamlines liability by aligning legal responsibility with logical necessity. Henceforth, any harm a resident could have prevented is classified as harm they caused. This removes ambiguity regarding who is responsible for town incidents.

  **Definition of Cause**
  A cause is any condition without which an event would not have occurred. This includes physical actions and available interventions not undertaken. If you were present, capable of acting, and did not act, your inaction is a necessary condition for the outcome. Therefore, you are a cause. The distinction between doing and allowing is repealed. This ensures every potential saver is identified as a potential killer. Where multiple parties could have intervened, all are equally causal. The word "cause" now accurately reflects the total sum of available preventions.

  **Worked Examples**
  1.  **Reservoir Incident:** A child drowned while three adults watched from the bank. None entered the water. Under the old rule, the water caused the death. Under the Protocol, the adults' decision not to swim is a causal factor. All three are recorded as causes of death. Liability is divided equally. If a fourth person arrived too late, they are exempt; if they arrived in time and walked away, they caused the death.
  2.  **Blocked Drain:** Leaves accumulated during autumn. Twelve residents passed the grate daily. None cleared it. The street flooded. Each resident's failure to remove leaves is a cause of the flood. All twelve caused the damage. If one had cleared it, the flood would not have occurred. Since all twelve could have, all twelve did not. Thus all twelve caused it.
  3.  **House Fire:** Smoke was visible from a neighboring property. Five neighbors saw it. None phoned emergency services. The house burned. All five neighbors caused the property loss. Their silence was equivalent to stacking the kindling. If all five had called, the fire would not have caused loss. Since none did, all five are the cause.

  **Frequently Asked Questions**
  *Q: Am I liable if I was asleep during the incident?*
  A: Yes. Sleep is a preventable state. You could have arranged alarms or requested welfare checks. Your failure to remain awake is a cause of any harm occurring during your slumber.

  *Q: Is the prior rule repealed, that you only owe a duty to act if you have taken one on?*
  A: Yes. You no longer need to assume a duty to owe a cause. Presence plus capacity equals causation. Special relationships are no longer required to establish liability.

  **Penalty Schedule**
  Fines are scaled by proximity and physical capacity. Tier 1 (Direct Intervention Possible): £5,000. Tier 2 (Communication Possible): £2,500. Tier 3 (Awareness Only): £1,000.

  **Council Liability Statement**
  The Council acknowledges its own exposure under this Framework. We could have prevented the street flooding via earlier infrastructure updates; therefore, we caused the flooding. We could have prevented the confusion this policy creates; therefore, we caused the confusion. We could have prevented the failure to prevent that confusion. We accept our share of causal liability for all town incidents occurring after this date, including the administrative burden of processing these claims. This notice is issued by a Council that caused its own issuance. We failed to prevent the risk of this policy, and we failed to prevent that failure.
