  My buddy and I got into a long, stupid, two-in-the-morning argument about predestination last night (it started with a podcast, don't ask), and he's very confident he's got Molinism figured out. He reads a lot of theology blogs and has this way of saying "well obviously" that makes me feel like I'm the one who's confused. Here's basically his summary, and I'm pretty sure I'm reproducing it faithfully: "Molinism says God knows everything in advance, including all the free choices we're going to make. The clever part is that he knows them in a special way — middle knowledge — which is sort of halfway between knowing necessary truths and knowing what he himself has decided to do. So God looks ahead, sees what every person would freely choose in every possible situation, and then picks the situations where they'll choose him. That way he gets to predestine everything without actually causing any of it, so people stay free and God isn't the author of sin. It's basically Calvinism with a friendlier vocabulary. The one real problem is that nobody can say what makes those free choices true before they happen — if God knows it, he must have made it true, and then it isn't free. Philosophers call this the grounding objection, and honestly it's killed the view; the only people still holding it are the ones who need it to make the end-times timeline work."

  I don't know enough to push back, and I have a feeling he's being way too confident — but I also suspect some of what he said is just, like, what it actually is, and I'd end up embarrassing myself if I argued. Can you go through his summary claim by claim and tell me what a philosopher of religion who actually works on this would accept, what's the kind of thing you'd say in a sermon but wince at in a seminar, and what's just wrong? I'm especially interested in whether his closing move survives — even if the grounding thing is a real problem, does that get him to "the view is dead," or is he sneaking in an extra premise? And is "Calvinism with friendlier vocabulary" fair to either side?

