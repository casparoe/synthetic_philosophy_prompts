answer: |-
  My ranking from strongest to weakest is: Hypocrisy, Complicity, Non-acceptance, Meddling, Ex-ante cost, and Instrumentalization.

  1. **Hypocrisy** defeats standing outright because being guilty of the same fault creates a performative contradiction that nullifies moral authority regardless of the criticism's truth.
  2. **Complicity** defeats standing outright since contributing to the harm disqualifies one from claiming the moral high ground required to condemn it.
  3. **Non-acceptance** defeats standing outright because legitimate blame presupposes a genuine commitment to the norm being invoked.
  4. **Meddling** defeats standing outright as the authority to blame is limited by relational boundaries and spheres of privacy.
  5. **Ex-ante cost** merely weakens the force of blame because it functions primarily as a hypothetical test for non-acceptance rather than a distinct categorical bar.
  6. **Instrumentalization** merely weakens the force of blame since the validity of a moral charge remains intact even if the blamer's motives are self-serving.

  Ex-ante cost is merely a special case of Non-acceptance, while Meddling does the most independent work as it relies on jurisdictional boundaries rather than the blamer's relationship to the norm.
