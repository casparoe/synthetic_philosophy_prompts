      *   *Section 3: The Cruxes.* Address the user's hunch. Yes, it's about information, but specifically *tacit vs. explicit* and *static vs. dynamic*.
      *   *Section 4: Concrete Cases.* Need to map the economic theory to sci-fi survival scenarios.
