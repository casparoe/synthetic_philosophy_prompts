      *   *Justification:* A century of intense scrutiny by thousands of mathematicians makes a *short* contradiction vanishingly unlikely, but a *long* derivation (beyond human survey) remains possible.
  *   **(d) Well-Posedness (Semantics):** $p_d = 0.0005$
