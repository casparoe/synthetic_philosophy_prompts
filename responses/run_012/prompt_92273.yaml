  *   **(b) Meta-Induction (Incompleteness):** $p_b = 0.002$
      *   *Justification:* The inability to prove consistency from within, coupled with the need for ever-stronger large cardinal axioms to prove the consistency of weaker ones, leaves a permanent "Gödelian shadow" of ungroundedness.
