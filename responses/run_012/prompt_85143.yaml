          *   *Actually, the theorem says:* If posteriors are common knowledge, they must be equal.
          *   *So the mechanism:* Common knowledge implies the posteriors are constant on the "common knowledge cell" (the meet). Since they share a prior, the average posterior over that cell must equal the prior conditional on that cell. Since both agents' posteriors are constant on that cell (because they know them), they must both equal that average. Hence equal.
          *   *Simplified:* Common knowledge creates a "public bucket" of states. Inside that bucket, both agents must have the same average probability (due to common prior). If they *know* their own probability is constant inside that bucket (which they do, if it's common knowledge), their specific number must match the average.

  3.  **Part 2: The Coin Under the Cup**
      *   *Scenario:* Coin Heads/Tails. Prior 50/50.
