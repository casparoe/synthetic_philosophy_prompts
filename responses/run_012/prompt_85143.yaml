          *   B sees $\{1, 3\}$, calculates $P(E) = 1/2$.
          *   They agree. Boring.
          *   *Need disagreement:* Let's adjust partitions to create different posteriors, then show why they can't be *common knowledge*.
          *   *Better Example:* The standard "Halpern-Moses" style or a simplified Aumann grid.
          *   Let's use a 4-state world.
          *   States: $\omega_1, \omega_2, \omega_3, \omega_4$. Prior: $1/4$ each.
          *   Event $H$: $\{\omega_1, \omega_2\}$.
          *   Alice's info: $\{\{\omega_1, \omega_2\}, \{\omega_3, \omega_4\}\}$.
          *   Bob's info: $\{\{\omega_1\}, \{\omega_2, \omega_3, \omega_4\}\}$.
          *   If state is $\omega_1$: Alice sees $\{\omega_1, \omega_2\} \to P(H)=1$. Bob sees $\{\omega_1\} \to P(H)=1$. Agree.
          *   If state is $\omega_2$: Alice sees $\{\omega_1, \omega_2\} \to P(H)=1$. Bob sees $\{\omega_2, \omega_3, \omega_4\} \to P(H)=1/3$. **Disagreement.**
          *   *Crucial Question:* Is this disagreement *common knowledge*?
          *   Alice knows she has 1. Does she know Bob has 1/3? No. Alice knows Bob's partition is $\{\{\omega_1\}, \{\omega_2, \omega_3, \omega_4\}\}$. If state is $\omega_2$, Alice knows the state is in $\{\omega_1, \omega_2\}$. From Alice's perspective, the state could be $\omega_1$ (where Bob has 1) or $\omega_2$ (where Bob has 1/3). So Alice doesn't know Bob's posterior.
