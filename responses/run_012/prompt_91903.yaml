answer: |-
  1. **The Relocation Objection**
  You argue that a hypothetical global assembly solves the circularity of the *demos* deciding its own boundaries. But a global assembly is itself a collective body that requires membership. Who is seated in this assembly? If you say "everyone," you have presupposed a boundary of the human community; if you say "all affected," you seem to have relocated the boundary problem to the global level rather than dissolving it. How do you define the membership of the constitutive body without invoking the very boundary criteria you are trying to justify?

  *Follow-up:* If you answer that the assembly's membership is determined by a moral universal rather than a political decision, I want to press you on whether the constitutive stage is doing any independent work. If the "global assembly" is just a placeholder for "all moral persons," isn't that functionally identical to assuming the ordinary *demos* should be universal from the start, rendering your two-stage distinction merely cosmetic?

  2. **The Scope of Affectedness**
  Your constitutive stage is authorized by the principle that all affected interests have a claim to inclusion. Causality, however, is notoriously infinite; a policy decision in one state can ripple out to affect future generations, distant foreigners, and even non-human animals. Does your constitutive assembly include representatives for these entities? If you restrict the principle to "significantly affected" or "currently living humans," what meta-principle draws that line, and isn't that line itself a boundary decision?

  *Follow-up:* If you argue that we restrict the scope to keep the mechanism feasible, does that not concede that feasibility constraints are actually doing the normative heavy lifting? If feasibility limits the constitutive stage, doesn't that collapse the distinction between your ideal legitimacy and the non-ideal reality you claim to transcend?

  3. **Affectedness vs. Coercion**
  Many democratic theorists, following Robert Dahl or Frederick Whelan, argue that subjection to coercion is the proper ground for membership, not mere affectedness. Coercion is legally identifiable; affectedness is empirical and fuzzy. Why do you prefer the fuzzier criterion for the foundational constitutive stage? Are you concerned that a coercion-based criterion would legitimize existing state boundaries too easily, and if so, does your preference reveal that your theory is driven more by a desire to critique the status quo than to solve the logical paradox?

  *Follow-up:* If you maintain that coercion is too narrow because it ignores externalities, does your solution risk making the constitutive stage so expansive that it swallows the ordinary stage? If everyone is affected by everything in a globalized world, does your constitutive assembly effectively become a world government, thereby eliminating the bounded *demos* you aim to legitimate?

  4. **Legitimacy and Feasibility**
  You insist this is a claim about legitimacy rather than a blueprint for institutions. But in political theory, legitimacy usually implies a duty to obey or a right to rule that has practical force. If the constitutive stage is a thought experiment that cannot be instantiated, how does it generate normative obligations for actual states? Does a boundary gain legitimacy merely because it *could* be agreed to by a global assembly, or does the assembly need to be something we could actually convene?

  *Follow-up:* If you argue that the thought experiment guides our judgment of existing boundaries, I need to ask whether the constitutive stage is doing any independent work here. If we are just using our own moral intuitions to simulate what a global assembly would decide, aren't we just using the ordinary *demos* under another name to validate our pre-existing judgments about who belongs?

  5. **The Self-Constitution Premise**
  Your core premise is that the same body cannot both constitute itself and act. But isn't this a category error? Constitutions are often ratified by the very people they constitute. Why is the *demos* unique in requiring an external constitutor? If the global assembly is made up of individuals who will eventually be members of ordinary *demoi*, isn't the "constitutive" act just the first decision made by the "ordinary" body, merely chronologically prior rather than logically distinct?

  *Follow-up:* If you reply that the rules of procedure differ between the stages, doesn't that admit that the distinction is institutional rather than foundational? If the same individuals are applying different rules, isn't the "constitutive stage" just the ordinary *demos* operating in a different mode, which brings us back to the circularity you sought to avoid?

  6. **Convocation and Agency**
  Even as a hypothetical, the global assembly requires a convener. In the absence of a world state, who calls this assembly to order? If the answer is "philosophers imagining it," does that not make the boundary problem an elitist exercise where theorists decide boundaries rather than peoples? How do you reconcile the democratic pedigree of your theory with the undemocratic nature of its hypothetical enactment?

  *Follow-up:* If you suggest that existing international bodies could approximate this role, does that not import all the legitimacy deficits of current international organizations into your constitutive stage? How does that help solve the boundary problem for a citizen who views those bodies as illegitimate?

  7. **Temporal Stability**
  Boundaries are not static; populations shift, and interests change. Does your global assembly need to convene periodically to re-evaluate the boundaries of ordinary *demoi*? If so, who decides when a re-evaluation is necessary? If not, on what grounds do you freeze the boundaries at the moment of the constitutive stage, potentially locking in injustices as demographics evolve?

  *Follow-up:* If the assembly must reconvene, does that not create a permanent supra-national authority? If it doesn't, doesn't the ordinary *demos* inevitably reclaim the power to adjust its own boundaries, effectively nullifying the constitutive stage's authority over time?

  8. **Recourse for the Excluded**
  Suppose the constitutive stage draws a boundary that excludes a group who feel they are significantly affected by the ordinary *demos*'s decisions. What recourse do they have? If they can appeal to the constitutive principle, doesn't that allow them to bypass the ordinary stage's authority? If they cannot appeal, doesn't that render the constitutive stage's legitimacy claim empty for those on the wrong side of the line?

  *Follow-up:* If you say they can appeal to a higher court of legitimacy, who staffs that court? If it is staffed by members of existing *demoi*, haven't we returned to the problem of interested parties judging their own boundaries?

  9. **Conflict of Verdicts**
  Imagine a scenario where the hypothetical global assembly's ruling on a boundary conflicts with the will of an existing, historically stable *demos*. Which verdict holds normative priority? If the existing *demos* wins, your constitutive stage seems toothless; if the global assembly wins, are you not advocating for a form of cosmopolitan override that undermines local self-determination?

  *Follow-up:* If you argue for a balance between the two, what is the metric for that balance? Is that metric itself a boundary rule, and if so, was it decided in the constitutive stage or the ordinary stage?

  10. **The Residual Paradox**
  Finally, let's step back. You claim to dissolve the circularity of the boundary problem. But if every solution requires a prior decision about who decides, isn't there always a residual moment of decision that is itself undecidable by democratic standards? Are you not simply hiding that moment of undecidability inside the "hypothetical" black box of the global assembly, rather than truly solving it?

  *Follow-up:* If you concede there is a residual moment of undecidability, does that not mean the boundary problem is ultimately political rather than philosophical? If so, does your two-stage model risk obscuring the raw power dynamics involved in border-making by dressing them up in procedural legitimacy?
