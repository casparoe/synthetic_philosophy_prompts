answer: |-
  ### The Pre-Meeting Audit Protocol

  **Purpose:** To separate mathematical vulnerabilities from policy preferences *before* the 90-minute selection meeting.
  **Owner:** You (The Chair).
  **Timing:** Run this on any proposed rule submitted 48 hours before the meeting.
  **Outcome:** A "Traffic Light" report for the committee (Green = Safe, Yellow = Value Choice, Red = Hard Stop).

  You are not asking the readers to understand the math. You are telling them: *"I tested this rule against five structural risks. Here is where it breaks."*

  ---

  ### Part 1: The Five Questions (The Audit)

  Ask these questions in order. If the answer triggers a **STOP**, the rule is rejected without debate. If it triggers a **CHOICE**, it goes to the meeting agenda as a policy decision, not a mathematical fact.

  #### 1. The Cognitive Load Test
  *Question:* Does this rule require a reader to compare every candidate against every other candidate (full ranking), or can they score each file independently?
  *   **Pass:** Independent scoring (e.g., 1–5 scale per file).
  *   **Stop:** Full ranking of >50 candidates. (With 200 files and skim-reading readers, this guarantees random noise).
  *   **Verdict:** **Hard Stop.**

  #### 2. The Monotonicity Test
  *Question:* If a candidate receives a *higher* score from one reader (with all other scores constant), can that candidate's final rank *drop*?
  *   **Pass:** No. More support never hurts.
  *   **Stop:** Yes. (Some complex runoff systems penalize candidates for doing "too well" in early rounds).
  *   **Verdict:** **Hard Stop.** (This is indefensible to applicants).

  #### 3. The "Spoiler" Test (Independence of Irrelevant Alternatives)
  *Question:* If Candidate C withdraws *after* scoring but *before* final ranking, can the winner flip between Candidate A and Candidate B?
  *   **Pass:** No. The relative order of A and B depends only on A and B.
  *   **Choice:** Yes. (Common in runoff systems).
  *   **Verdict:** **Value Choice.** (You must decide if stability is worth the complexity).

  #### 4. The Agenda Test
  *Question:* If we process the candidates in a different order (e.g., Alphabetical vs. Random), does the final winner change?
  *   **Pass:** No. The math is order-agnostic.
  *   **Stop:** Yes. (This means the person setting the agenda chooses the winner).
  *   **Verdict:** **Hard Stop.**

  #### 5. The Dictator Test
  *Question:* Is there any scenario where one reader's preference overrides the combined preference of all other readers, regardless of their scores?
  *   **Pass:** No.
  *   **Choice:** Yes, but only in ties (e.g., Chair tie-break).
  *   **Stop:** Yes, permanently (e.g., Senior reader has 51% weight).
  *   **Verdict:** **Choice** (for ties) / **Hard Stop** (for permanent weight).

  ---

  ### Part 2: Running the Audit on Your Three Rules

  Here is the output you would generate for the committee. Note specifically where Rule (a) is flagged, as this is likely your current standard.

  #### Rule (a): Average Score with Chair Tie-Break
  *   **Load:** **PASS.** Readers score files independently. Feasible for 200 apps.
  *   **Monotonicity:** **PASS.** Higher scores always raise the average.
  *   **Spoiler:** **PASS.** Removing a loser does not change the average of the winners.
  *   **Agenda:** **PASS.** Order of calculation does not matter.
  *   **Dictator:** **YELLOW FLAG.**
      *   *Analysis:* In the event of a tie for the final fellowship slot, your vote alone decides. If ties occur in 10% of cycles, you are a "10% Dictator."
      *   *Audit Note:* This is not mathematically impossible, but it concentrates power. If you favor this rule for *efficiency*, you must acknowledge you are retaining veto power.
  *   **Polarization (Value Add):** **YELLOW FLAG.**
      *   *Analysis:* Averages punish polarization. A candidate with scores (5, 5, 1, 1, 1, 1) averages 2.3. A candidate with (3, 3, 3, 3, 3, 3) averages 3.0. The consistent mediocre candidate beats the polarizing brilliant one.
      *   *Decision:* This is not a math error; it is a value judgment. Do we want safe choices or high-variance geniuses?
  *   **Audit Result:** **Proceed to Meeting**, but tie-break authority and polarization tolerance must be explicitly voted on.

  #### Rule (b): Two-Round Runoff (Top 2 by Average, then Pairwise Vote)
  *   **Load:** **PASS.** Scoring is independent; pairwise vote only involves 2 candidates.
  *   **Monotonicity:** **PASS.**
  *   **Spoiler:** **FAIL (Hard Stop).**
      *   *Analysis:* This system is vulnerable to "Clone Candidates." If two similar candidates (A1 and A2) split the "progressive" vote in the first round, a polarizing candidate (B) can make the Top 2 with a lower aggregate support level. If A1 drops out, A2 might have made the runoff instead of B. The withdrawal of a *loser* (A1) changes the *winner* (B vs A2).
      *   *Audit Note:* This violates the Spoiler Test. A candidate's fate depends on who else applied, not just their own merit.
  *   **Agenda:** **FAIL (Hard Stop).**
      *   *Analysis:* You mentioned readers complain about the "order of pairwise votes." If the final round involves ranking the Top 2 against previous winners (or if there is a 3-way tie for 2nd place requiring sequential elimination), the order in which you compare them determines the winner.
      *   *Audit Note:* This allows the Chair to manipulate the outcome by setting the voting order.
  *   **Audit Result:** **Reject.** The structural vulnerability to manipulation and spoilers is too high for a fellowship intended to be merit-based.

  #### Rule (c): Weighted Ranking by Seniority
  *   **Load:** **FAIL (Hard Stop).**
      *   *Analysis:* Requires readers to rank 200 candidates. With half the readers skimming, the bottom 150 rankings will be random noise. Random noise weighted by seniority is institutionalized error.
  *   **Dictator:** **FAIL (Hard Stop).**
      *   *Analysis:* If the most senior reader has enough weight to outweigh the sum of the other five (e.g., Senior = 5 votes, Others = 1 vote each), this is a mathematical dictatorship. Even if the weight is lower (e.g., Senior = 2 votes), it creates a "Veto Class."
      *   *Audit Note:* This explicitly codifies that some merit counts more than other merit based on tenure, not file quality.
  *   **Audit Result:** **Reject.** Fails feasibility and fairness thresholds.

  ---

  ### Part 3: The Honest Paragraph (What This Cannot Do)

  This procedure will not tell you who deserves the fellowship. It will not solve the fight between the reader who wants "safe, publishable candidates" and the reader who wants "risky, transformative candidates." Arrow's Theorem and its cousins prove that no voting system can perfectly translate individual preferences into a group ranking without violating at least one fairness criterion. By using this audit, you are not finding the "true" winner; you are choosing which flaws you can live with. Rule (a) is the most stable, but it systematically filters out polarizing talent and gives you, the Chair, final veto power. If you choose it, you are not choosing mathematical truth; you are choosing institutional stability over potential brilliance, and your own authority over collective ambiguity. When you present this to the committee, do not say, "The math says we must do this." Say, "The math says every rule breaks something. I am proposing we break the tie-break rule because I prefer stability over the risk of agenda manipulation. If you prefer risk, propose a different trade-off." That is the only honest ground you have.
