answer: |-
  Father Alvarez, Mary, Ray's grandchildren, and friends.

  Ray knew I was standing here today. We talked about it three weeks before he died, while we were sitting on his porch watching the rain. He knew I didn't believe in the resurrection, he knew I didn't expect to see him again, and he knew I wasn't going to pretend otherwise just because he was gone. He would have hated that. He had a low tolerance for nonsense, even the comforting kind.

  So I'm not going to tell you that Ray is in a better place, or that he's looking down on us right now. I don't know that. But I do know what Ray was while he was here, and I know what his faith did for him, and for us.

  We were friends for sixty years. For sixty years, we disagreed about the ultimate nature of the universe. But we agreed on almost everything else. We agreed on what constituted honesty. We agreed on how to treat a waiter, how to listen to a friend, and how to show up when things went wrong. Ray's faith wasn't just a list of things he checked "yes" on in his head. It was a discipline. It was the forty-four years of showing up to the organ loft. It was the daily mass, not because it was easy, but because it was something that needed to be done.

  I've spent a lot of time thinking about why we do what we do in places like this. Why we gather around a loss. Why we need music, and words, and a shared story. I think it's because we are human beings, and this is what human beings do. We are creatures who need to make sense of silence. We are built to look for a hand behind the curtain, to seek a reason when the world feels random. When someone we love stops breathing, our instincts demand a ritual. We need to stand shoulder to shoulder. We need to sing, even if our voices shake.

  Ray understood this better than I ever could. He didn't just participate in the ritual; he sustained it. He knew that the truth of a life isn't found only in whether the metaphysics hold up under scrutiny, but in whether the practice makes you better. Did it make you kinder? Did it make you more honest? Did it bind you to your community?

  By that measure, Ray's faith was true. It worked. It produced a man who played the organ for forty-four years without needing applause. It produced a man who could disagree with an atheist friend for six decades without ever making him feel less than. That is a miracle of a different sort, but it is a miracle I witnessed.

  I know there is a gap between believing a thing and valuing the belief itself. I feel that gap standing here. I don't share the theology of this parish, but I share the grief. I share the need for this room, for this music, and for this community. Ray bridged that gap every day of his adult life. He didn't see a contradiction between loving his neighbors and loving his God. He just saw work that needed to be done.

  There is a specific kind of honesty that comes from admitting we don't know everything. Ray had that. He also had the courage to act as if he did know, to live fully within the story he was given. I respect that. I respect the way he leaned into the mystery instead of running from it.

  To Mary and the family: You taught him how to love, and he taught you how to endure. To Father Alvarez: Thank you for letting me speak, and for taking care of the rest. Ray trusted you with the things I couldn't share with him, and I'm grateful for that.

  We are here because a body has stopped, and because a group of people needs to know what to do next. Ray knew what to do. He played the notes in front of him. He showed up. He told the truth.

  I will miss him. I will miss the arguments, and the silence, and the music. And while I don't expect to see him again, I expect to feel the weight of his example for as long as I'm here to carry it.

  Rest well, Ray. You earned it.
