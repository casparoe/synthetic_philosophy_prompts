      *   Plato would say: It reveals you have a lack of control and perhaps latent hostility, but it doesn't guarantee the *proposition* "I hate you" is a stable, rational truth.
      *   Dan's move is a category error: Confusing *ethological truth* (what kind of animal is this?) with *propositional truth* (what is this person's current opinion?).

