  # HISTORY THEORY SORTING TREE
  **Instructions:** Start at the top. Answer each question honestly based on your intuition about how history works. Follow the arrow that matches your answer. Do not look at the destination names until you reach the bottom.

  ---

  ### **START: The Nature of the Past**

  **Q1. Do you see statistical regularities in history that exist independently of what the actors believed they were doing?**
  *   **No:** Patterns are hindsight constructs; every event is unique.
      *   └─► **LEAF A: Plain Idiographic** ("Each event is its own thing")
  *   **Yes:** There are detectable structures beneath the noise.
      *   └─► *Go to Q2.*

  **Q2. Are these regularities best explained as the sum of individual rational choices, or as emergent systemic forces?**
  *   **Individual Choices:** Macro patterns are just micro decisions aggregated.
      *   └─► **LEAF B: Rational-Action** ("We don't need social laws")
  *   **Systemic Forces:** Structures constrain choices regardless of intent.
      *   └─► *Go to Q3.*

  **Q3. Is the data-generating process stationary enough to pool centuries (e.g., Rome + Modern) into one model, or are patterns context-sensitive mechanism-sketches?**
  *   **Context-Sensitive (No):** Deep structures change; eras need their own models.
      *   └─► **LEAF C: Annales / Longue-Durée** (Structure-over-events)
  *   **Stationary (Yes):** Underlying dynamics remain consistent across time.
      *   └─► *Go to Q4.*

  **Q4. Is the primary payoff of the model retrodiction (fitting the past) or actually calling the next few decades?**
  *   **Retrodiction:** Measure carefully, explain variance, don't prophesy.
      *   └─► **LEAF D: Cliometrics** ("Measure carefully, don't prophesy")
  *   **Prediction:** The goal is forecasting future structural stress points.
      *   └─► *Go to Q5.*

  **Q5. Do the cycles come from inside the social system (elite overproduction, demographics) or from outside shocks (climate, plague, new tech)?**
  *   **Outside Shocks:** Drivers are exogenous to the social structure.
      *   └─► **LEAF E: Unoccupied Position** (*See Note 1*)
  *   **Inside System:** Drivers are endogenous feedback loops.
      *   └─► *Go to Q6.*

  **Q6. Is a 'cycle' a clock (fixed period) or just a recurring shape with no set length?**
  *   **Fixed Clock:** The period is deterministic (e.g., exactly 50 years).
      *   └─► **LEAF E: Unoccupied Position** (*See Note 1*)
  *   **Recurring Shape:** The trajectory is similar, timing varies.
      *   └─► *Go to Q7.*

  **Q7. If the state starts steering society using your model, does the model survive?**
  *   **Yes (Survives):** Publishing the law does not change the law.
      *   └─► **LEAF E: Unoccupied Position** (*See Note 1*)
  *   **No (Breaks):** Reflexivity alters the variables; prediction becomes intervention.
      *   └─► **LEAF F: Turchin-Style Cliodynamics** (Structural-Demographic)

