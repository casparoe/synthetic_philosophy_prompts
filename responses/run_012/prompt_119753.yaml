  ### **HANDOUT FOOTNOTES & META-ANALYSIS**

  **Note 1: The Unoccupied Position (Leaf E)**
  Three distinct logical branches terminate here. None are currently occupied by a major school of thought.
  *   *Branch from Q5 (External Shocks + Prediction):* **Unexplored/Unattractive.** Predicting decades based on exogenous shocks (volcanoes, weather) assumes those shocks are themselves predictable on social timescales.
  *   *Branch from Q6 (Fixed Clock):* **Incoherent.** Social systems lack the isolation required for fixed-period periodicity. Claims here usually drift into astrology or numerology.
  *   *Branch from Q7 (Reflexivity Survives):* **Unattractive.** Assumes a "view from nowhere" where human knowledge of the model does not alter human behavior. Most structuralists admit steering breaks the curve.

  **Note 2: Indistinguishable Leaves**
  **Leaf B (Rational-Action)** and **Leaf D (Cliometrics)** are often empirically indistinguishable using this tree. Both rely on stationary data and micro-foundations. The split relies on whether the user emphasizes *theory of choice* (B) or *measurement of outcomes* (D). In practice, these groups often read each other's papers.

  **Note 3: Usage**
  This tree is designed to expose where your philosophical commitments lie, not to validate them. If you end up at **Leaf E**, you may hold a unique position—or you may need to refine your definitions of "law" and "cycle."
