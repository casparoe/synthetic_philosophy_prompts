answer: |-
  ### Fault Lines Brainstorm

  Your disagreement with Dan isn't just about morals; it's about ontology and jurisdiction. You are arguing from a **Universalist/Principal-Agent** framework (corruption is a specific type of harm to a public principal, regardless of context), while Dan is arguing from an **Anti-Universalist/Particularist** framework (corruption is a label applied by a specific bureaucratic culture to legitimate local exchange).

  The four questions you were sliding between are:
  1.  **Ontology:** Is corruption a natural kind (like "poison") or a social kind (like "heresy")?
  2.  **Normativity:** Is the wrong in breaking the *rule*, violating the *role*, or harming the *community*?
  3.  **Jurisdiction:** Does the state's law override kinship obligation, or do they operate in separate "publics"?
  4.  **Function:** Does the payment fix a broken system (grease) or break a working one (sand)?

  ***

  ### The Corruption Decision Tree

  **Instructions:** Start at the root. Answer the question based on your intuition about the case (e.g., the Lagos customs officer). Follow the branch to the next node or leaf.

  **ROOT:** If a customs officer in Lagos and a counterpart in Berlin both take cash to clear a carton of cigarettes, are they doing the **same act** (universally defined) or **different acts** (defined by local meaning)?
  *   **Same Act** → Go to **Node A (Act-Type)**
  *   **Different Acts** → Go to **Node D (Standpoint)**

  **NODE A:** Is the standard for judging this act **external** (universal ethics/law) or **internal** (local rules only)?
  *   **Internal** → **LEAF 1: [EMPTY]** *(Incoherent: You cannot claim an act is universally the same type but judge it only by local rules.)*
  *   **External** → Go to **Node B**

  **NODE B:** Is the definition of corruption **monistic** (one standard for all interactions) or **layered** (strict for core duties, flexible for periphery)?
  *   **Layered** → **LEAF 2: Thin-Core-Thick-Local**
  *   **Monistic** → Go to **Node C**

  **NODE C:** What is the primary **locus of wrongness** in the act?
  *   **Breach of Formal Rule** → **LEAF 3: Legalist/Formalist**
  *   **Violation of Trust/Role** → Go to **Node C2**

  **NODE C2:** Is the role's core duty **fiduciary** (serve the principal/employer) or **impartial** (serve the public/strangers equally)?
  *   **Fiduciary** → **LEAF 4: Principal-Agent**
  *   **Impartial** → Go to **Node C3**

  **NODE C3:** Where does the **gift/bribe line** fall for an impartial official?
  *   **Explicit Quid Pro Quo** (Intent/Timing) → **LEAF 5: Universalist (Narrow)**
  *   **Status of Office** (Any gift compromises impartiality) → **LEAF 6: Universalist (Broad)**

  **NODE D:** Is the judgment of the practice based on its **consequences** (what it does) or its **meanings** (what it signifies)?
  *   **Consequences** → **LEAF 7: Functionalist**
  *   **Meanings** → Go to **Node E**

  **NODE E:** Is the behavior driven by **strategic adaptation** (survival/equilibrium) or **moral obligation** (duty/identity)?
  *   **Strategic Adaptation** → **LEAF 8: Collective-Action**
  *   **Moral Obligation** → Go to **Node F**

  **NODE F:** Does the actor face **competing legitimate duties** (Two Publics) or is the 'corruption' label itself **political weaponry**?
  *   **Competing Duties** → **LEAF 9: Particularist-Clientelist**
  *   **Political Weaponry** → **LEAF 10: Anti-Universalist Critique**

  ***

  ### The Leaves: Positions & Awkward Commitments

  1.  **[EMPTY] Universal Particularism:** *Incoherent.* (Claims the act is universally identical but insists only local rules can judge it.)
  2.  **Thin-Core-Thick-Local:** *Awkward Commitment:* Stealing the school budget is universally wrong, but the customs cigarette payment is culturally negotiable.
  3.  **Legalist/Formalist:** *Awkward Commitment:* A perfectly legal party donation that buys policy is not corruption, but a illegal gift to a starving nurse is.
  4.  **Principal-Agent:** *Awkward Commitment:* The minister hiring his nephew is only corrupt if the state (principal) is harmed, not if the community benefits.
  5.  **Universalist (Narrow):** *Awkward Commitment:* The surgeon's post-op gift is permissible because the service was already rendered (no quid pro quo).
  6.  **Universalist (Broad):** *Awkward Commitment:* The surgeon's post-op gift is corrupt because holding office requires total distance from private gratitude.
  7.  **Functionalist:** *Awkward Commitment:* The carton of cigarettes is virtuous if it clears the customs backlog that would otherwise rot the goods.
  8.  **Collective-Action:** *Awkward Commitment:* Anti-corruption campaigns fail because individuals are rational, not because they are immoral.
  9.  **Particularist-Clientelist:** *Awkward Commitment:* The minister owes the nephew the Mercedes more than the schoolchildren due to kinship duty (Two Publics).
  10. **Anti-Universalist Critique:** *Awkward Commitment:* Calling the Lagos customs payment a 'bribe' is an act of epistemic violence, regardless of the harm.

  ***

  ### Seminar Notes: Indistinguishability & Hinges

  **The Collective-Action vs. Anti-Universalist Problem**
  You suspected these two make the same predictions. The tree separates them at **Node E** (Strategy vs. Morality), but in practice, they are hard to distinguish.
  *   **Prediction:** Both predict anti-corruption campaigns will fail in high-corruption equilibria.
  *   **Split Question:** "If the system were fixed, would the actor *still* feel obliged to pay?"
      *   **Collective-Action:** No. (It was a survival tax).
      *   **Anti-Universalist:** Yes/Irrelevant. (The obligation is cultural, not systemic).
  *   **Verdict:** If your seminar participants can't answer that counterfactual, treat these leaves as functionally identical for policy design, though morally distinct.

  **The Gift/Bribe Hinge (Node C3)**
  This is the sharpest tool for your debate with Dan.
  *   **Narrow Universalist:** Focuses on *intent/timing*. (The surgeon gift is okay).
  *   **Broad Universalist:** Focuses on *office status*. (The surgeon gift is corrupt).
  *   **Dan's Position:** He rejects Node C entirely. He argues that for the Lagos officer, the "office" does not carry a duty of impartiality to strangers, but a duty of distribution to kin. This pushes him to **Node F**.

  **The Two Publics (Node F)**
  This is not a footnote; it is the branch that saves Dan's argument from being "anything goes."
  *   **Particularist-Clientelist:** Admits there is corruption *relative to the State*, but argues the State is not the only legitimate public.
  *   **Anti-Universalist:** Argues the State's definition of corruption is illegitimate *tout court*.
  *   **Your Counter:** If the "Kinship Public" loots the "Civic Public" (the school budget), does the Kinship Public have a mechanism to repay the debt? If not, it's not a "Two Publics" equilibrium; it's predation. This forces Dan off **Leaf 9** and toward **Leaf 4** (Principal-Agent).
