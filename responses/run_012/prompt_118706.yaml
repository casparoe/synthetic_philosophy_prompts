  *My duty:* Be honest. The Smoke Alarm Fink sounds a lot like a Mask to a layperson ("It stopped the sound"). The Glass/Sorcerer is clearer because the glass *itself* changes nature. I will recommend the Glass for *conceptual clarity* in a 25-min no-slide talk. The cognitive load of "alarm mechanism" is higher than "glass breaking."

  *Decision:* I will recommend the **Fragile Glass** but offer the Smoke Alarm as a secondary analogy if they really want it. I'll explain *why* the glass is better (intrinsic vs extrinsic is easier to see in breaking).

  *Wait, let's look at the "Reverse Fink" again.*
  Standard Fink: Fragile -> Struck -> Becomes Non-Fragile -> Doesn't Break.
  Reverse Fink: Non-Conductive -> Touched -> Becomes Conductive -> Current Flows.
  Why it matters: It shows the conditional "If struck, breaks" is false even if the object *does* break (because it wasn't fragile *until* struck).
  I need to make sure this is clear.

  *Closing Question:* Needs to distinguish Fink from Mask. "If I wrap a glass in bubble wrap and it doesn't break, is it still fragile?" (Mask). "If a wizard makes the glass unbreakable the moment you hit it, was it fragile?" (Fink).
  Better: "Which one changes the object, and which one changes the world around it?"

  *Limitations:* Don't talk about the "Causal Basis" problem (what physical property grounds the disposition). Don't talk about Lewis's reformulation.

  *Let's build the plan.*

  **Sequence:**
  1.  **The Intuition (Dispositions):** Things have "powers" (Fragility).
