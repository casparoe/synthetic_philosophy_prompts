  I'm a science journalist and in a few weeks I'm doing a 25 minuets live segment at a festival — no slides, just me and a mic — on dispositions and the whole fink/mask thing, which I only half get myself. Skip the explanation, I need the teaching plan. The room is smart generalists, they read alot, but they've never taken a metaphysics class. Give me the sequence — which idea has to land before the next one can, and why that order rather than some other — so that fink and mask come out as two genuinely different problems instead of one blur. What's the one example that carries the whole thing? I was thinking smoke alarms: a clever one that kills its own siren the second it smells smoke, versus a normal one that's working fine but buried under insulation so you'd never hear it. Can that pair actually carry fink vs mask, or am I already conflating them? If it can't, what should carry it instead — and is the fragile glass everyone uses really unusable, or is that just snobbery? Then the misconceptions they'll walk in with or pick up on the way — my guesses are 'so masking just means the thing was never really there,' 'fink and mask are just two words for interference,' and 'this proves dispositions are spooky and irreducible' — and exactly where in the sequence I should head each one off. There's also some reverse version I keep hearing about, where the thing isn't fragile until the moment you hit it, and I can never remember where it goes or what it's for — sort that out for me. And finally: one question I can throw at the room at the end to see whether it actually landed, and what I should openly say I'm not going to get into at this level — it's live, so nothing that needs a diagram or notation.
