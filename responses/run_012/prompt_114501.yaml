prompt: |-
  ok so I've got two freinds in my reading group who have been going at each other about humanitarian intervention for about three years now and I'm tired of refereeing. One of them is a liberal interventionist / R2P type: thinks Kosovo was a rare case of the West doing the right thing way too late, thinks the 2011 Libya campaign was justified when it started and got wrecked by mission creep, thinks the lesson of Rwanda is that we should have gone in, and thinks the lesson of Iraq isn't "never intervene" but "never do it on a fake pretext with no plan for the day after". The other is a restraint person: thinks the sovereignty norm is load-bearing, thinks these wars keep getting sold with atrocity stories that turn out thinner than advertised, thinks "we had to do something" is a machine for generating wars, and thinks the real lesson of Libya is that a resolution to protect civilians turns into a regime change operation the moment the interveners get bored of the mandate.

  What I want is the document those two should have written instead of arguing in my kitchen. Neither of them gives up their view, neither gets strawmanned, but it has to be honest enough that both would actually sign it.

  So:

  1. A numbered list of claims they both accept — about the empirical record (Kosovo, Iraq, Libya), about what the fight is even about, and about what would count as evidence either way. Keep it non-vacuous; if a claim would be signed by literally anyone, cut it. And say which parts of their fight are just words — I suspect "humanitarian" is doing a lot of quiet work in both of their sentences, and I suspect they mean seperate things by "the intervention worked".

  2. A disagreements table, one row per live disagreement. Column 1: the question, phrased neutrally enough that neither side thinks it's been loaded. Column 2: what the interventionist says. Column 3: what the restraint person says. Column 4: who bears the cost if that side is wrong — the interveners' soldiers, the civilians we were trying to save, the civilians on the other side of the line, the norm itself, whatever is actually accurate for that row.

  3. The cruxes: the sub-questions where settling it would actually move one of them. I think one crux is whether they're judging the decision by what was knowable at the time or by how it turned out, and another is whether Security Council authorization is a condition of legitimacy or just a legal hoop. For each crux, give a case or argument that both of them would agree bears on it, and write down each side's prediction in advance.

  4. One case neither of them has staked out yet, where they have to pre-register before they know the answer: a country with a credible mass-atrocity warning, no oil or other loot worth mentioning, no Western diaspora lobby, and one permanent Security Council member with a naval base on its coast. Make the details concrete enough that "it depends" is not an available answer, then give me each of their predictions and where the split actually lands when neither has a dog in the fight.

  No bibliography, no reading list, just the document. And don't let either of them off the hook with "it depends on the circumstances" — I want the circumstances pinned down.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Create a document to resolve/reframe a three-year argument between two friends in a reading group regarding humanitarian intervention.
      *   **Characters:**
          *   *Friend A (Liberal Interventionist/R2P):* Pro-Kosovo, Pro-Libya (initially), Pro-Rwanda intervention, Anti-Iraq (due to pretext/planning, not principle). Believes in moral obligation to stop atrocities.
          *   *Friend B (Restraint/Sovereigntist):* Pro-Sovereignty norm, Skeptical of atrocity propaganda, Anti-"Something must be done" mentality, Anti-Libya (mission creep/regime change), believes interventions often worsen outcomes.
      *   **Constraints:**
          *   No bibliography/reading list.
          *   Must be honest enough for both to sign (no strawmanning).
          *   Non-vacuous claims (avoid platitudes).
          *   Identify semantic disagreements (e.g., "humanitarian," "worked").
          *   Disagreements table with specific columns (Question, Interventionist, Restraint, Cost of Being Wrong).
          *   Cruxes section (sub-questions that would move minds, with pre-registered predictions).
          *   Specific Future Case (concrete details, no "it depends," pre-registered predictions).
          *   Tone: Analytical, precise, diplomatic but firm.

  2.  **Deconstruct the Arguments (Mental Simulation):**
      *   *Common Ground:* Both hate Iraq (for different reasons). Both acknowledge Kosovo was "okay" but messy. Both acknowledge Libya went south. Both care about civilian welfare (one via action, one via non-action stability).
      *   *Semantic Friction:* "Success" (Interventionist = regime falls/atrocities stop short term; Restraint = state stability/long term order). "Humanitarian" (Interventionist = intent to save; Restraint = marketing label for strategic interests).
      *   *Core Tension:* Moral obligation to strangers vs. Systemic stability/Unintended consequences.

  3.  **Drafting Section 1: Shared Claims (The Preamble):**
      *   Need to avoid "War is bad."
      *   Need to acknowledge the track record is mixed.
      *   Need to admit that motives are always mixed.
      *   Need to agree on the definition of terms to stop talking past each other.
      *   *Drafting thought:* Make sure to highlight the Iraq agreement. It's the strongest bridge.
      *   *Drafting thought:* Clarify "Success." Interventionist sees stopping the massacre *now* as success. Restraint sees not creating a warlord state *later* as success.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Row 1: The Counterfactual.* (Would Rwanda have been worse without intervention? vs. Would Libya have been better without?)
      *   *Row 2: Motive vs. Outcome.* (Does good intent justify bad outcome? vs. Does bad outcome negate good intent?)
      *   *Row 3: The Sovereignty Norm.* (Is it a shield for dictators or a shield for the weak?)
      *   *Row 4: Institutional Constraints.* (Can UN mandates bind interveners? vs. Are they just fig leaves?)
      *   *Cost Column:* This is crucial. Who pays? Civilians, soldiers, international order.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1: Ex Post vs. Ex Ante.* Judgment based on information available *then* vs. results *now*.
          *   *Test Case:* A hypothetical where intel was good but outcome bad (or vice versa).
          *   *Prediction:* Interventionist says "Decision was right, execution failed." Restraint says "Decision was wrong because execution was predictable."
      *   *Crux 2: The UN Veto.* (Legitimacy vs. Legalism).
          *   *Test Case:* A vetoed intervention that stops a genocide.
          *   *Prediction:* Interventionist says "Illegal but Legitimate." Restraint says "Illegitimate and Dangerous."

  6.  **Drafting Section 4: The Pre-Registered Case (The "Turing Test" for their theories):**
      *   *Requirements:* Mass atrocity warning, no oil/loot, no diaspora, P5 naval base nearby.
      *   *Scenario:* Let's create a fictionalized version of a real potential flashpoint to avoid immediate bias, or use a specific real one that fits. The prompt asks for "concrete enough." A fictionalized country avoids "But that's not exactly like Syria" arguments. Let's call it "Aethelgard" or use a real analog. Let's use a specific real-world analog scenario to make it sticky. Let's go with a hypothetical coup in *Madagascar* or *Fiji*? No, needs mass atrocity. Let's create "The Republic of Ostra."
      *   *Details:* Ostra. Civil war. Government shelling civilians. China has a naval base there (P5 veto threat). No oil. No Western diaspora.
      *   *The Split:* Interventionist says "Go in without UN if vetoed." Restraint says "Stay out, UN veto holds the line."
      *   *The "Settlement":* Who pays the cost?

  7.  **Refining and Polishing:**
      *   *Check Tone:* Is it too academic? Keep it sharp.
      *   *Check Constraints:* Did I allow "it depends"? No. Must force a stance.
      *   *Check "Signing":* Would the Interventionist sign the part about sovereignty being load-bearing? Yes, if acknowledged as *a* value, not *the* value. Would the Restraint sign the part about Rwanda? Yes, if acknowledged as a failure of *capacity* not just *will*.
      *   *Semantic Check:* Ensure the definition of "Humanitarian" is exposed as a contested term.
      *   *Cost of Being Wrong:* Make this specific. Not just "people die," but *which* people and *what principle* dies.

  8.  **Final Review against Prompt:**
      *   Numbered list of claims? Yes.
      *   Disagreements table (4 cols)? Yes.
      *   Cruxes with predictions? Yes.
      *   One concrete case with pre-registration? Yes.
      *   No bibliography? Yes.
      *   No "it depends"? Yes.

      *(Self-Correction during drafting Section 4)*: The prompt asks for a case "neither of them has staked out yet." Since they've argued for 3 years, they've probably covered Rwanda, Kosovo, Libya, Iraq, Syria. I need a scenario that feels fresh or specific enough to bypass their rehearsed lines. A scenario involving a *Chinese* naval base adds the P5 constraint requested. Let's make it a hypothetical coup in a strategic but resource-poor African nation. Let's call it "The Zambezi Crisis."

      *(Refining the "Cost" column)*: Make sure it distinguishes between immediate physical cost and long-term systemic cost.

      *(Refining the "Shared Claims")*: Ensure they admit their own side's blind spots. Interventionist admits "mission creep is structural." Restraint admits "sovereignty protects murderers."

      *(Final Polish)*: Ensure the voice is neutral but authoritative, like a mediator's summary.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # MEMORANDUM OF UNDERSTANDING: THE INTERVENTION DEBATE
  **Parties:** The Liberal Interventionist (LI) and The Restraint Advocate (RA)
  **Subject:** Principles of Foreign Military Intervention for Humanitarian Purposes
  **Status:** Pre-Commitment to Empirical Accountability

  ## 1. SHARED CLAIMS (THE COMMON GROUND)
  *Both parties affirm the following propositions. Denial of any item below constitutes a violation of this agreement.*

  1.  **The Iraq Concession:** Both parties agree that the 2003 Iraq War was a catastrophic failure of humanitarian justification. LI agrees the pretext was fabricated and the planning negligent. RA agrees that if the WMD intelligence had been accurate and the occupation planned competently, their objection would have been significantly weaker, though not necessarily void.
  2.  **The Mixed-Motive Axiom:** Both parties agree that no modern military intervention is purely humanitarian. Strategic interests (bases, migration flows, regional stability) are always present. The debate is not about *purity* of motive, but whether humanitarian benefit can outweigh strategic cynicism.
  3.  **The Definition of "Success":** Both parties acknowledge they have been using different time horizons.
      *   LI defines success as: *The immediate cessation of mass killing and the removal of the specific threat.*
      *   RA defines success as: *The establishment of a stable political order that does not require perpetual foreign military presence.*
      *   **Agreement:** Henceforth, "Success" requires both the immediate cessation of atrocities AND a political settlement viable without foreign troops within 5 years.
  4.  **The Sovereignty Trade-off:** Both parties agree that the norm of state sovereignty is a tool that protects weak states from strong ones, but also protects tyrants from their own people. Abandoning it entirely invites imperialism; enforcing it absolutely invites genocide. The fight is about the threshold for overriding it.
  5.  **The "Atrocity Propaganda" Risk:** Both parties agree that atrocity stories are sometimes exaggerated to sell wars (e.g., incubator babies in Kuwait, some claims in Libya). LI accepts this requires higher evidentiary standards. RA accepts this does not prove all atrocity claims are false (e.g., Srebrenica).
  6.  **The Cost of Inaction:** Both parties agree that "doing nothing" is a policy choice with a body count, not a neutral baseline. RA accepts that non-intervention in Rwanda resulted in 800,000 deaths. LI accepts that non-intervention in Syria (post-2013) resulted in a stalemate that spared a Libya-style collapse but prolonged suffering.
  7.  **Semantic Clarity:** Both parties agree that the word "Humanitarian" is currently doing too much work. It conflates *intent* (we want to help) with *outcome* (they were helped) and *legal status* (UN sanctioned). Henceforth, we distinguish between *Humanitarian Intent*, *Humanitarian Outcome*, and *Humanitarian Legitimacy*.

  ## 2. DISAGREEMENTS TABLE
  *Live disputes where the parties remain opposed. Column 4 specifies who physically or systemically pays the price if the chosen policy is incorrect.*

  | # | The Question (Neutral Phrasing) | Liberal Interventionist Position | Restraint Advocate Position | Cost of Being Wrong (Who Pays?) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Counterfactual Baseline:** When judging an intervention (e.g., Libya 2011), do we compare the outcome to the status quo ante or to the most likely alternative trajectory without intervention? | We compare to the status quo ante (Qaddafi threatening Benghazi). If Benghazi was saved, the intervention succeeded, even if the state later collapsed. | We compare to the most likely alternative trajectory (e.g., a negotiated settlement or a slower civil war). If the intervention accelerated state failure, it failed, regardless of Benghazi. | **Civilians in the target state.** They bear the brunt of the state collapse vs. the brunt of the massacre. |
  | **2** | **Mission Creep:** Is "mission creep" (protection of civilians evolving into regime change) an accidental failure of planning or a structural inevitability of liberal intervention? | It is a failure of planning and political will. It can be fixed with clearer mandates and exit strategies. | It is structural. You cannot bomb a government into behaving humanely; removing the threat requires removing the government. | **The Intervening Soldiers & Taxpayers.** They bear the cost of open-ended nation-building. |
  | **3** | **The Sovereignty Norm:** Does violating sovereignty to stop atrocities strengthen the norm (by making it conditional on behavior) or weaken it (by making it optional)? | It strengthens the norm by making sovereignty conditional on responsibility (R2P). Tyrants lose the shield. | It weakens the norm by making borders porous to powerful states. Weak states lose the shield. | **The International Order.** Weak states globally lose protection against future aggression by strong powers. |
  | **4** | **Epistemic Humility:** Can Western intelligence agencies reliably distinguish between a genuine impending genocide and a standard civil war atrocity cycle within a 2-week decision window? | Yes, with sufficient political will to listen to analysts rather than politicians. The Rwanda failure was ignoring intel, not lacking it. | No. The "fog of war" and the "marketing of atrocity" make this impossible. The default must be skepticism. | **Civilians on the "Other Side."** If wrong, the interveners become occupiers fighting a nationalist insurgency. |
  | **5** | **Legitimacy Source:** Does legitimacy derive from the UN Security Council (UNSC) or from the moral necessity of the act? | Moral necessity is primary. UNSC is a procedural hurdle that can be bypassed if vetoed unreasonably (e.g., Kosovo). | UNSC authorization is primary. Without it, the act is aggression, regardless of moral intent. | **The Intervening State.** It risks pariah status and reciprocal violations of its own sovereignty. |

  ## 3. THE CRUXES
  *These are the specific sub-questions where settling the fact would force one party to update their view. Both parties pre-register their predictions below.*

  ### Crux A: The "Knowable at the Time" Test
  **The Issue:** LI judges decisions based on information available *ex ante*. RA judges decisions based on outcomes *ex post*.
  **The Test Case:** A hypothetical intervention where intelligence confirms imminent massacre, the intervention stops the massacre, but the state collapses into warlordism 3 years later due to unforeseen local factionalism.
  **The Prediction:**
  *   **LI Prediction:** This counts as a **Success**. The moral obligation was to stop the massacre. The collapse is a tragedy, but not a failure of the intervention decision itself.
  *   **RA Prediction:** This counts as a **Failure**. If the political structure cannot sustain the peace, the violence was merely paused, not solved. The intervention borrowed time at a high interest rate.
  **The Settlement Condition:** If LI admits that a "successful" massacre prevention that leads to a failed state is a net negative, LI moves toward Restraint. If RA admits that stopping a genocide is a moral good even if state-building fails later, RA moves toward Intervention.

  ### Crux B: The Veto Power Legitimacy
  **The Issue:** Is a UNSC Veto by a P5 member (e.g., Russia/China) a legitimate legal barrier or a moral obstruction?
  **The Test Case:** A genocide is occurring. The UNSC votes 14-1 to intervene. The lone veto is cast by a P5 member with a strategic base in the region, explicitly to protect that base, not for humanitarian reasons.
  **The Prediction:**
  *   **LI Prediction:** Intervention without UNSC approval is **Legitimate**. The veto was abused for strategic interest, voiding the legal barrier.
  *   **RA Prediction:** Intervention without UNSC approval is **Illegitimate**. Allowing exceptions for "abuse of veto" creates a loophole that powerful nations will use to invade whenever they claim the veto was "abused."
  **The Settlement Condition:** If LI accepts that bypassing the veto erodes the long-term protection of the UN system even in just cases, LI moves toward Restraint. If RA accepts that some atrocities are too high a price to pay for procedural purity, RA moves toward Intervention.

  ## 4. THE PRE-REGISTERED CASE: "THE ZAMBEZI CRISIS"
  *Neither party has argued this specific scenario. Both must sign their prediction column BEFORE the outcome is known. No "it depends" allowed.*

  **The Scenario:**
  *   **Location:** The Republic of Zambezia (fictionalized analog: a coastal Southern African state).
  *   **Threat:** A military junta has surrounded the capital with artillery. Credible intelligence (verified by 3 independent NGOs) indicates they will shell civilian districts within 72 hours to crush an uprising. Estimated death toll: 50,000+ in week one.
  *   **Strategic Value:** Zero oil. No rare earth minerals. No significant Western diaspora.
  *   **The Complication:** China maintains a dual-use naval logistics base on the Zambezian coast.
  *   **The UN Vote:** A resolution to intervene passes 14-1. China vetoes it, citing "protection of strategic infrastructure."
  *   **The Proposal:** A Western coalition proposes a no-fly zone and targeted strikes on artillery positions *without* UN authorization, promising no ground troops and no regime change.

  **Pre-Registered Predictions:**

  | Feature | Liberal Interventionist (LI) | Restraint Advocate (RA) |
  | :--- | :--- | :--- |
  | **Decision** | **Intervene.** The moral imperative to save 50,000 lives overrides the procedural veto, especially when the veto is explicitly strategic. | **Do Not Intervene.** Violating the veto over a Chinese base risks great power conflict and sets a precedent that "humanitarianism" overrides P5 security interests, destabilizing the UN. |
  | **Predicted Outcome** | **Net Positive.** The shelling stops. The junta negotiates. China protests but accepts the *fait accompli*. The sovereignty norm bends but does not break. | **Net Negative.** China views this as encirclement. They increase military aid to the junta or rival proxies. The conflict internationalizes. Zambezia becomes a proxy war zone. |
  | **The "Success" Metric** | Lives saved in the first 6 months. | Stability of the region after 2 years. |
  | **Cost of Being Wrong** | **Civilians of Zambezia.** If LI is wrong, the proxy war kills more than the shelling would have. | **Civilians of Zambezia.** If RA is wrong, the shelling happens and could have been stopped. |
  | **Signing Condition** | I commit to admitting my view is flawed if intervention leads to a prolonged proxy war involving China, even if the initial shelling stops. | I commit to admitting my view is flawed if non-intervention leads to the confirmed massacre of 50,000+ civilians and no broader geopolitical backlash occurs. |

  **Signatures:**

  _________________________ (Liberal Interventionist) Date: __________

  _________________________ (Restraint Advocate) Date: __________

  _________________________ (Mediator) Date: __________
