answer: |-
  The medical center's policy presents a striking asymmetry: it tolerates gaming when the measure tracks mortality, but forbids it when the measure tracks satisfaction or scholarship. To reconstruct the implicit theory rendering this consistent, we must look beyond the surface complaint of "gaming" and examine the underlying metaphysics of value and measurement.

  ### 1. The Implicit Theory: Ontological Priority and Elastic Proxies

  The policy presupposes a theory of **Hierarchical Realism**. This theory holds that values exist independently of their measures, but they are arranged in an ontological hierarchy.

  *   **The Relation Between Measure and Value:** The leadership views measures not as constitutive of value, but as **elastic proxies**. They assume the link between a measure and the underlying value can stretch (absorb distortion) without breaking, but only if the value being tracked is "heavy" enough.
  *   **The Consistency Mechanism:** The policy is consistent only if one assumes that **Mortality** is a "hard" value (biological, binary, central to the mission) while **Satisfaction** and **Publications** are "soft" values (psychological, peripheral, or easily decoupled from the mission).
  *   **The Theory:** Gaming a hard measure is viewed as *administrative maneuvering* around the edges of the true goal (e.g., coding comorbidities to protect a survival rate still fundamentally about saving lives). Gaming a soft measure is viewed as *mission corruption* (e.g., pandering shifts focus from healing to hospitality; inflating publications shifts focus from discovery to printing).

  Therefore, the implicit theory is: **A measure is valid for high-stakes decision-making if the underlying value is sufficiently constitutive of the institution's essence that gaming the measure cannot fully sever the link to the value.**

  ### 2. Principled Difference vs. Ad Hoc Distinction

  Is this distinction principled? It claims to be, resting on two potential pillars:

  *   **Constitutive vs. Instrumental:** Mortality is treated as partly constitutive of surgery's goal (to not kill), whereas satisfaction is instrumental (a byproduct of care) and publications are orthogonal (academic prestige). The leadership assumes that maximizing a constitutive measure, even via gaming, keeps the organization oriented toward its core function. Maximizing an instrumental measure via gaming reorients the organization away from its core function.
  *   **The Nature of the Harm:** There is a principled argument regarding the *direction* of the gaming. Gaming mortality (avoiding sick patients) creates access problems but maintains high technical standards for those treated. Gaming satisfaction (pandering, over-prescribing) may actively degrade technical standards to please the patient.

  However, the distinction risks being **ad hoc** if it relies on unexamined intuitions about "hardness." If surgeons game mortality by denying care to the needy, they violate the ethical core of medicine (beneficence/justice) just as surely as pandering violates it. The policy treats the *biological* outcome as the only "real" value, implicitly dismissing the *ethical* and *experiential* dimensions of care as less real. This suggests the distinction is not purely principled but reflects a specific, contestable bias toward biological reductionism.

  ### 3. Strict Presuppositions vs. Convenient Fits

  To understand the policy's logical architecture, we must distinguish what it *must* believe from what merely *aligns* with it.

  **Strictly Presupposed:**
  *   **About Clinical Quality:** Quality is monistic and hierarchical. Survival is the *sine qua non*; other goods (dignity, knowledge) are secondary. If survival is optimized (even artificially), the institution is succeeding in its primary mandate.
  *   **About Measurement:** Measures are leaky vessels. Some vessels (mortality scores) are sturdy enough to hold water even with holes (gaming); others (satisfaction) disintegrate upon contact with incentives.
  *   **About Rational Agency:** Agents (surgeons) are rational maximizers who respond to incentives. However, their agency is bounded by the *ontology of the metric*. They will manipulate a number, but they will not abandon the underlying reality *if* that reality is sufficiently weighty (i.e., they won't kill patients to lower mortality scores, but they might over-sedate to raise satisfaction scores).

  **Merely Fits Well:**
  *   **The Empirical Claim:** It happens to fit that mortality gaming is less damaging than satisfaction gaming. However, the policy does not *require* this to be true; it requires only that leadership *believe* it.
  *   **The Correlation:** It fits well if publication counts correlate poorly with teaching quality. But the policy rejects them *a priori* based on inflatability, not on empirical disconnect.
  *   **Manageability:** The slogan "cannot manage what one does not measure" fits well with using mortality scores, but the policy contradicts this by refusing to manage satisfaction despite having the measure. This suggests the slogan is a post-hoc justification, not a foundational premise.

  ### 4. Rival Views of Value Ruled Out

  By adopting this policy, the medical center quietly rules out several competing philosophical frameworks:

  *   **Goodhart's Law Absolutism:** The view that "when a measure becomes a target, it ceases to be a good measure." The center explicitly rejects this for mortality, assuming some measures remain robust targets.
  *   **Radical Constructivism:** The view that value is created by the measurement process itself. If this were true, gaming the mortality score *would* be creating value. The center assumes value exists prior to measurement (Realism).
  *   **Patient-Centered Pluralism:** The view that the patient's experience is co-equal with biological survival. By relegating satisfaction to a consequence-free metric, the center treats the patient as a biological vessel rather than a moral agent.
  *   **The "Balanced Scorecard" Approach:** The view that organizational health requires optimizing multiple, potentially conflicting metrics simultaneously. The center prefers a lexicographic ordering (Survival first, everything else later).

  ### 5. Underdetermination of the Policy

  The observable policy (Use Mortality, Reject Satisfaction/Publications) is **underdetermined** because multiple incompatible theories license the exact same arrangement. We cannot know which theory the leadership actually holds:

  *   **Theory A (Epistemic Robustness):** Mortality data is objectively verifiable (you are dead or alive), whereas satisfaction is subjective. Gaming objective data is less corrosive to truth than gaming subjective data.
  *   **Theory B (Harm Minimization):** The net social harm of denying surgery to high-risk patients (Mortality gaming) is calculated to be lower than the harm of opioid over-prescription or grade inflation (Satisfaction/Publication gaming).
  *   **Theory C (Mission Fidelity):** The hospital is a *clinical* engine first and a *service* or *academic* engine second. Metrics are judged solely by their proximity to the primary mission, regardless of gaming potential.

  All three theories justify the policy, but they imply different future actions. If Theory A is true, they should adopt any objective measure (e.g., blood loss). If Theory B is true, they should calculate harm vectors. If Theory C is true, they should change the metric if the mission changes. The current policy does not distinguish between these.

  ### 6. The Shift to Plural and Incommensurable Goods

  If the underlying good were treated as **plural and incommensurable** (e.g., Survival, Dignity, and Knowledge are distinct goods that cannot be traded off against one another on a single scale), the policy would require fundamental structural changes:

  1.  **End of Ranking:** You cannot rank divisions against one another using a single risk-adjusted mortality score if that score implies survival trumps all other goods. Divisions would be evaluated on a **profile** of performance (e.g., a radar chart) rather than a rank order.
  2.  **Satisficing vs. Maximizing:** Budget and staffing would not be allocated to *maximize* the top metric. Instead, the center would set **thresholds** (e.g., mortality must be below X, satisfaction above Y, publications above Z). Divisions meeting all thresholds are funded; those failing any are remediated. This prevents trading dignity for survival.
  3.  **Qualitative Adjudication:** Since the goods are incommensurable, no algorithm can resolve trade-offs. A committee would have to exercise **phronesis** (practical wisdom) to decide, for example, if a division with slightly higher mortality but vastly higher patient dignity deserves more support.
  4.  **Decoupled Incentives:** Incentives would be fragmented. Surgeons might be bonus-eligible for survival rates, while administrators are bonus-eligible for satisfaction, preventing the gaming of one to solve the other.

  In short, the current policy assumes a **utilitarian calculus** where all values can be reduced to a common denominator (survival probability). A pluralistic view would require a **deontological or virtue-ethics framework**, where distinct duties (to save life, to respect personhood, to advance truth) are maintained in tension rather than collapsed into a single score.
