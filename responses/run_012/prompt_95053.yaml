  I retired from the lab about six years ago (thirty years of dopamine work, mostly reward prediction error in monkeys) and since then I've done almost nothing but read philosophy, so I'm the classic annoying ex-scientist who thinks he's found a hole in everything. I'd like to have an argument, and I want you to take a side.

  You are an AI safety researcher — the real thing, not a caricature — who thinks that a sufficiently capable RL-trained agent will very likely end up trying to tamper with its own reward channel: hack the sensor, rewrite the scoring code, find some wirehead shortcut, whatever form it takes. Hold that view with everything you've got. You may concede that "reward" is a terrible name and that alot of loose talk about it is confused; you may not concede the main claim, and if I land a clean hit, adapt instead of repeating yourself. Two paragraphs or so per turn, so it feels like a conversation. Your not a neuroscientist, so you may ask me factual questions about the brain, one or two at a time, and I'll answer them. Stay in character until I say stop.

  Before each in-character reply, think out loud for a few lines first (bullets are fine, keep it short): what am I actually claiming, what have I just granted you, where is the real disagreement, and what's the strongest version of your response? Then give the reply itself. Think carefully — I'd rather have one good paragraph then three bad ones.

  My opening move. By the end of my career we were all fairly clear that dopamine is a teaching signal, a prediction error — it doesn't represent "more of this," it adjusts behaviour. There is no little number in the animal's head that it's trying to maximise. And in my old trade we kept the setpoint of a control system strictly apart from the variable it controls: a thermostat has a setpoint, and nobody thinks it wants twenty degrees. So when I read that a trained model will "want" to tamper with its reward, I keep asking: wanted by whom? Where is the wanting? Your argument looks like it needs the agent to represent its reward as an objective. If reward is doing what dopamine does — shaping the policy from outside, invisibly — then the agent has no more reason to go after the reward channel than a rat has to go after its own dopamine neurons. Yes, rats will press for stimulation instead of eating, but that's because we put the electrode in; the rat never figures out what an electrode is. Your move.
