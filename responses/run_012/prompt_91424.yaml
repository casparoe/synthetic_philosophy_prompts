answer: |-
  To read the collapse of the Bretton Woods system through Aristotle is to shift the ground from macroeconomic management to political ethics. Where a Keynesian reading sees a failure of liquidity provision and demand coordination, an Aristotelian reading sees a crisis in the ontology of money itself—a collision between the conventional nature of the measure and the natural limits of the community it serves. What follows is an account of Aristotle's monetary theory as presented in the *Nicomachean Ethics* and *Politics*, followed by an application of that framework to the 1971 suspension of gold convertibility.

  ### I. Aristotle's Account of Money and Exchange

  Aristotle's inquiry begins not with banks or states, but with the household. In the *Politics*, he distinguishes between two arts of acquisition. The first is part of household management (*oikonomia*), which is natural and limited. Its aim is to secure the goods necessary for the life of the community. The second is the art of wealth-getting (*chrematistike*), which is concerned with exchange and, in its unlimited form, the accumulation of coin for its own sake. Aristotle argues that while the first is essential to human flourishing, the second is unnatural because it has no limit; there is no point at which one possesses "enough" money.

  This distinction rests on his analysis of the commodity. In a reconstruction of his argument in *Politics* Book I, every possession has a double use: a proper use (wearing a shoe) and an exchange use (trading the shoe for food). Barter arises naturally from the surplus of the household, but it is limited by local need. As exchange extends beyond the immediate community, money is introduced to facilitate reciprocity.

  In the *Nicomachean Ethics*, Aristotle defines money primarily as a measure. It is not valuable by nature, but by convention (*nomos*). It exists to make incommensurable things commensurable so that proportional reciprocity can occur. A builder and a farmer exchange not identical goods, but goods equalized by a common standard of demand. Money acts as a *symbol* of this demand. Because it is a symbol, Aristotle suggests it exists by agreement and can be changed or rendered worthless if the convention collapses.

  However, the texts leave a genuine ambiguity regarding the material substrate of this symbol. Aristotle observes that money historically emerged from useful commodities (like iron or silver) that were easier to measure than the goods being traded. He implies that money usually *is* a commodity with a use-value (as metal) that is then repurposed as a measure. Yet, because he defines it functionally as a guarantee of future exchange and a measure of demand, he does not explicitly rule out the possibility of a token with no intrinsic value, provided the convention holds. The text commits him to the view that money is a social institution grounded in need, but it remains open whether that institution requires a natural anchor (a commodity) to remain just, or whether the convention alone suffices.

  Finally, Aristotle condemns the breeding of money from money. In his view, money was invented for exchange, not reproduction. To charge interest (*tokos*) is to make the measure itself the source of increase, which is the most hated and unnatural form of acquisition because it perverts the end of money.

  ### II. Mapping the 1971 Episode

  The Bretton Woods system established the US dollar as the global measure of value, pegged to gold at $35 per ounce, with other currencies pegged to the dollar. In Aristotelian terms, the dollar was the conventional symbol, while gold was the natural anchor—the commodity with value independent of the convention.

  **The Imbalance:** By the late 1960s, foreign claims on dollars vastly outran the US gold stock. Through an Aristotelian lens, this represents the expansion of *chrematistike* (unlimited financial claims) beyond the bounds of *oikonomia* (the tangible wealth of the household, here represented by the gold reserve). The convention (dollar claims) had grown detached from the natural measure (gold). The system required the US to run deficits to provide the world with liquidity, meaning the "measure" was being created in quantities that the "anchor" could not support.

  **The Suspension:** When President Nixon closed the gold window in August 1971, he unilaterally suspended the convertibility of the dollar into gold. Aristotle would likely view this as the moment the convention admitted it was merely a convention. By severing the link to the commodity, the dollar became purely what Aristotle said money essentially was: a symbol by agreement. However, this also removed the "natural" limit on the issuer's ability to create money.

  **The Slide to Floating Rates:** As fixed exchange rates gave way to floating rates, the measure of value became variable. For Aristotle, justice in exchange relies on a stable measure to ensure proportional reciprocity. A floating rate implies that the measure itself fluctuates with opinion and speculation, making the "equality" of exchange unstable. This vindicates his fear that when money is treated as a commodity to be traded (speculated upon) rather than a mere measure to facilitate trade, it destabilizes the reciprocity of the community.

  ### III. Vindication and Limitations

  **Where Aristotle is Vindicated:**
  The episode vindicates Aristotle's claim that money is fundamentally conventional. The world did not end when the dollar ceased to be redeemable in a commodity; the convention held because the network of trade required a common symbol. It also vindicates his suspicion of unlimited acquisition. The pressure on Bretton Woods came from the explosion of Eurodollars and private credit—money breeding money outside the control of the household (the state). The crisis was, in essence, a revolt of the natural limit (gold scarcity) against the unnatural expansion of credit.

  **Where Aristotle Lacks Resources:**
  However, the Aristotelian framework leaves you without resources to explain three critical features of 1971:
  1.  **Credit as Liability:** Aristotle views money as a medium of exchange, not as a claim on future production. He lacks a concept of money as a liability of the issuer. He cannot easily explain why the dollar retained value after 1971 despite having no commodity backing, because he does not fully account for the trust in the *issuer's* future capacity to tax or produce.
  2.  **The Unit of Account as Power:** For Aristotle, exchange is grounded in mutual need. He has no conceptual space for a monetary order run explicitly for the issuer's benefit. The "exorbitant privilege" of the US—ability to run deficits without constraint because others need the dollar—is a form of political dominance Aristotle's model of reciprocal justice does not anticipate. He assumes the measure serves the exchangers, not that the exchangers serve the measure-maker.
  3.  **Global vs. Local:** Aristotle's *oikonomia* is bounded by the polis. He lacks the resources to analyze a global economy where the "household" of the issuer (the US) is distinct from the community using the currency (the world).

  **The Natural/Unnatural Distinction:**
  Does the distinction survive? In a modified form, yes. The "natural" limit reasserted itself not through gold, but through inflation. When the convention is untethered from any constraint, the value of the symbol degrades. The inflation of the 1970s can be read as the "nature" of value reasserting itself against the "unnatural" proliferation of symbols. However, the distinction blurs because the commodity anchor (gold) proved too rigid for the natural growth of global trade. Aristotle might argue that the *true* natural limit is not the stock of metal, but the total volume of real goods available for exchange; when money outpaces that, inflation occurs.

  ### IV. The Aristotelian Analogue to the Triffin Dilemma

  The Triffin Dilemma posits that the issuer of a reserve currency must run balance-of-payments deficits to supply the world with liquidity, but persistent deficits undermine confidence in that currency's value.

  There is a profound Aristotelian analogue to this, rooted in the tension between *oikonomia* and *chrematistike*.
  *   **The Liquidity Requirement:** To serve the global community of exchange (a form of universal *oikonomia*), the issuer must export money. This requires the issuer to send out more symbols than it receives in goods.
  *   **The Confidence Requirement:** To maintain the validity of the symbol (the convention), the issuer must demonstrate that its own household is in order and that the symbol represents a claim on real wealth.

  In Aristotelian terms, the dilemma is that the reserve issuer is forced to practice *chrematistike* (unlimited issuance of claims) to facilitate global trade, but this very activity undermines the *oikonomia* (the soundness of the issuing state's household) required to validate the convention. The issuer must choose between being a good neighbor (providing liquidity) and being a good householder (maintaining solvency). Aristotle would likely argue that the dilemma arises because the system attempts to use a particular household's currency as a universal measure. A truly "natural" money would not depend on the solvency of one polis, but the 1971 episode proved that in a world of sovereign states, money remains tied to the power of the household, making the universalization of a particular currency inherently unstable.

  ### Conclusion

  Reading 1971 through Aristotle shifts the focus from technical failure to ethical category error. The Bretton Woods system collapsed because it tried to sustain a conventional symbol (the dollar) with a natural anchor (gold) that could not support the scale of modern *chrematistike*. Nixon's decision vindicated Aristotle's insight that money is ultimately a creature of convention, but it also realized his fear: once money is fully untethered from the "natural" limit of commodity value, it becomes an instrument of unlimited acquisition, subject to the whims of the issuer rather than the reciprocal needs of the exchangers. The Triffin Dilemma, seen this way, is not merely a technical constraint of international finance, but a manifestation of the impossibility of subordinating the unlimited art of wealth-getting to the limited needs of the political community.
