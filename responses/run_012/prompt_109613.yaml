answer: |-
  Rashomon shows the knowability principle trades on a confusion between ontological truth and epistemic access, demonstrating that while facts exist, the conjunction required to know them objectively is inaccessible to any human perspective.

  Fitch's proof relies on the assumption that for any true proposition $p$, it is possible that someone knows $p$ ($\Diamond Kp$), and that knowledge distributes over conjunction. The film dismantles the first assumption by presenting the "truth" of the killing not as a single proposition $p$, but as a set of mutually exclusive narratives ($p_1, p_2, p_3$) that cannot be conjoined without contradiction. Because no single observer—including the woodcutter, who admits confusion—holds a coherent account of the event, the objective truth becomes a proposition that is true but unknowable ($\neg \Diamond Kp$), blocking Fitch's proof at its initial premise rather than forcing the absurd conclusion that all truths are already known.

  The woodcutter's omission complicates this but does not save the principle; while he physically knows more than he says, making the facts *technically* known by someone, his admission that he "couldn't tell what was happening" suggests the core reality remains epistemically fragmented even for the witness. The medium's testimony does not count as privileged knowledge but functions as another subjective narrative layer, failing to provide the God's-eye view required to resolve the contradictions into a single knowable conjunction. The audience occupies no superior position; we are placed in the role of the gatekeeper at the Rashomon gate, forced to weigh incompatible reports without access to the event itself, confirming that the "truth" is socially constructed rather than logically discoverable.

  This reading strains where the film's barriers are moral rather than logical. Fitch's paradox operates in the realm of modal logic, where "knowable" means logically possible, whereas *Rashomon* presents truths that are logically knowable but psychologically suppressed by ego and shame. The film suggests the barrier to knowledge is human dishonesty, not inherent unknowability, which means the knowability principle might still hold logically even if it fails sociologically. However, this is where the film surpasses the proof: Fitch treats knowledge as a binary state of a rational agent, while *Rashomon* reveals that knowledge is a moral act contingent on the willingness to surrender self-interest. The film adds what the proof cannot: the diagnosis that the failure of knowability is not a glitch in logic, but a feature of the human condition, where preserving the self often requires obscuring the truth.
