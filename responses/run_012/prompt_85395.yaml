answer: |-
  The single most critical question is whether alignment-relevant claims (intent, harm, values) possess truth-conditions verifiable by a bounded judge, or if they are ontologically underdetermined such that no debate protocol can resolve them.

  Your suspicion is correct: Underdetermination is categorically upstream of Obfuscation. Obfuscation assumes a ground truth exists but is costly to find; Underdetermination asserts no ground truth exists for the judge to latch onto. Standard remedies (stronger judges, cross-examination) solve cost problems, not ontology problems. If Underdetermination holds, solving Obfuscation is wasted effort. I rank the Judge Regress diagnosis (the "fixed point" problem) as second: even if facts exist, a fallible judge may lack the anchor to converge on them. Obfuscation is third: it is merely a resource constraint that matters only if the first two barriers are cleared.

  ### Ranked Research Agenda

  **1. The Verifiability Horizon (Underdetermination)**
  *   **Question:** Can we formally define a class of "alignment claims" (e.g., "this action is harmful") that reduce to empirical predicates accessible to a weak judge, or do these claims inherently lack truth-conditions independent of the judge's bias?
  *   **Ranking Justification:** This is the ultimate upstream kill-switch. If alignment claims are underdetermined, debate oversight cannot work in principle, regardless of compute or protocol. It is neglected because empirical papers assume ground truth exists to measure accuracy. It is answerable via conceptual analysis (philosophy of language + formal logic) without experiments.
  *   **Update Condition:** Move down only if a rigorous reduction is demonstrated mapping value judgments to verifiable behavioral constraints. Move up if case studies show fundamental ambiguity in high-stakes alignment scenarios (e.g., conflicting human preferences).
  *   **Dissolvability:** This question is most likely to be dissolved by a single good argument—either an impossibility proof showing value claims cannot be grounded, or a reduction proof showing they can be compiled into checkable constraints.

  **2. The Judge's Fixed Point (Regress)**
  *   **Question:** Does the judge's fallibility introduce a regress where the judge must verify the verification process, preventing convergence even when ground truth exists?
  *   **Ranking Justification:** Upstream of Obfuscation. If the judge cannot stabilize on a verdict because their own reasoning is opaque or untrusted, the debate equilibrium fails. This addresses the "third diagnosis" you mentioned. It is conceptual (epistemology/game theory) and neglected in favor of assuming judges are honest arbiters.
  *   **Update Condition:** Move down if a formal mechanism is found that guarantees convergence despite judge fallibility (e.g., cryptographic verification of reasoning steps). Move up if analysis shows judge bias systematically amplifies through debate rounds.

  **3. The Obfuscation Complexity Bound**
  *   **Question:** What is the computational complexity gap required for a dishonest debater to successfully obfuscate a flaw against an optimal honest debater and a bounded judge?
  *   **Ranking Justification:** Downstream of 1 and 2. This only matters if facts exist (Q1) and the judge can converge (Q2). It is the standard "Obfuscation" diagnosis. It is answerable via complexity theory (proof systems) rather than training runs. It is less neglected but often conflated with empirical performance.
  *   **Update Condition:** Move down if bounds show obfuscation requires super-polynomial resources relative to verification. Move up if theoretical models show linear-cost obfuscation is possible for common reasoning tasks.

  **4. Equilibrium Stability under Ambiguity**
  *   **Question:** In cases of partial underdetermination, does debate converge to a stable falsehood (persuasive nonsense) or a reflective equilibrium (best available justification)?
  *   **Ranking Justification:** Downstream of Q1. This explores the "failure mode" if Underdetermination is partial rather than total. It requires game-theoretic modeling of debate dynamics. It is neglected because most theory assumes binary true/false states.
  *   **Update Condition:** Move down if models show debate consistently degrades to sophistry in ambiguous domains. Move up if mechanisms are found that reward "uncertainty signaling" over false precision.

  **5. Mechanism Design for Truth-Seeking**
  *   **Question:** Can protocol tweaks (e.g., penalty for retracting claims, random cross-examiner selection) alter the Nash equilibrium to favor honesty without requiring stronger judges?
  *   **Ranking Justification:** Most downstream. This is solution-space exploration. It is actionable but low-value if Q1 or Q2 are negative. It is conceptual (mechanism design) but risks becoming prompt-engineering theory.
  *   **Update Condition:** Move down if Q1 or Q2 results are negative. Move up if a specific protocol modification theoretically guarantees honesty under bounded rationality.

  ### Deliberate Exclusions (Do Not Touch)

  Given your constraints (3 theorists, 2 years, no training), your group must avoid work that requires empirical validation or compute scaling.
  1.  **Empirical Scaling of Debate Trees:** Do not attempt to measure how debate performance scales with model size or tree depth. This requires training runs and compute you do not have, and it conflates capability gains with oversight gains.
  2.  **Prompt Engineering & Protocol Tuning:** Do not optimize specific debate prompts or cross-examination scripts. This is engineering, not theory, and results will be obsolete when model architectures shift.
  3.  **Human Judge Data Collection:** Do not run studies where humans judge AI debates. This introduces ops overhead and confounds the theoretical question (can *AI* oversee *AI*?) with human psychology.

  ### Final Verdict on Dissolvability

  **Question 1 (The Verifiability Horizon)** is the candidate for dissolution by a single argument. If your team can construct a formal proof that "intent" and "harm" cannot be reduced to observable state transitions checkable by a weaker agent, the entire debate oversight line of research collapses immediately, saving your funders years of investment. Conversely, if you can demonstrate a reduction mapping these values to formal constraints, you validate the entire field's premise without running a single experiment. This high-variance, high-conceptual-leverage work is the only use of your limited bandwidth that matches the funders' need for a "continue or stop" decision.
