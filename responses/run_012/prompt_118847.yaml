answer: |-
  This is a superb intervention. As a biologist entering philosophy, you have spotted a structural weakness that many philosophers gloss over because they are enamored with the Wittgensteinian "family resemblance" move. The argument you describe is a hybrid of Morris Weitz's application of Wittgenstein to aesthetics (1956) and the Institutional Theory of Art (Danto, Dickie) that followed it.

  Your intuition is correct: the move from "no essential definition" to "therefore the Artworld decides anything" is a non-sequitur, and the Game Analogy is doing heavy lifting it cannot support. Your biological alternative is, in fact, philosophically superior for grounding a realist but non-essentialist view of art.

  Here is the audit you requested.

  ### 1. The Mapping: Game vs. Art

  To audit the analogy, we must first make the implicit correspondences explicit. The argument assumes a structural isomorphism between the concept **GAME** and the concept **ART**.

  | Domain | The Game Analogy | The Art Concept | Intended Function |
  | :--- | :--- | :--- | :--- |
  | **Instance** | A specific game (Chess, Tag) | A specific artwork (*Mona Lisa*, *Fountain*) | The unit of classification. |
  | **Activity** | Playing | Making / Creating | The generative act. |
  | **Participants** | Players | Artists / Audience | The agents involved. |
  | **Structure** | Rules (constitutive) | Criteria / Conventions | What governs the instance. |
  | **Goal** | Winning / Fun / Play | Aesthetic Experience / Expression | The *telos* (purpose). |
  | **Authority** | Referee / Rulebook | The Artworld (Curators, Critics) | The arbiter of validity. |
  | **Logic** | Family Resemblance | Family Resemblance | The justification for anti-essentialism. |

  The argument runs: Because *Games* lack a single common feature (some have balls, some don't; some have winners, some don't), they are held together only by overlapping similarities. *Art* is mapped onto this structure. Therefore, Art lacks a common feature. Therefore, there is no definition. Therefore, the "Authority" (Artworld) fills the vacuum.

  ### 2. Where the Mapping Breaks Down

  The analogy fails in three critical places. We must distinguish between **superficial disanalogies** (which do not affect the logic) and **structural disanalogies** (which undermine the conclusion).

  #### A. Superficial Disanalogies (Irrelevant to the Conclusion)
  *   **Physicality:** Games are often activities; artworks are often objects. *Irrelevant.* Concepts can apply to both events and objects without changing their logical structure.
  *   **Seriousness:** Games are often "for fun"; art is often "serious." *Irrelevant.* This is a sociological difference, not a logical one regarding classification.

  #### B. Structural Disanalogies (Relevant to the Conclusion)

  **1. Constitutive Rules vs. Open Texture**
  *   *The Game:* A game *requires* constitutive rules to exist. You cannot play Chess without the rules of Chess. If you move a rook diagonally, you are *not* playing Chess; you are violating the game. The "Family Resemblance" applies across *different* games, but within a specific game, rules are rigid.
  *   *The Art:* Artworks do not generally have constitutive rules. A painting can break all prior rules of perspective and remain a painting.
  *   *The Break:* The argument uses the *variety* of games to prove art has no rules, but then relies on the *authority* of referees (Artworld) to validate art. But referees enforce rules. If art has no rules, the "Artworld Referee" has nothing to enforce. They are not judging correctness (as in a game); they are conferring status. The Game Analogy implies rule-following; the Art Conclusion implies status-conferring. These are incompatible mechanisms.

  **2. The "Anything Goes" Gap**
  *   *The Game:* Even if "Game" is undefinable by necessary and sufficient conditions, **not anything can be a game.** A rock sitting in a forest is not a game. A game requires players intending to play.
  *   *The Art:* The conclusion drawn is that "the field is left open to whatever the artworld chooses."
  *   *The Break:* The Family Resemblance argument (no definition) does not logically entail the Institutional Conclusion (anything goes). "Undefinable" does not mean "Unconstrained." Wittgenstein never argued that because "game" is undefinable, I can declare a rock a game and be right. The analogy supports *anti-essentialism*, but it actively contradicts *unlimited permissibility*.

  **3. The Source of Authority**
  *   *The Game:* Authority in games comes from mutual agreement among players to abide by rules.
  *   *The Art:* The argument posits the "Artworld" as a distinct body that *chooses*.
  *   *The Break:* In the Game Analogy, the "players" constitute the game. In the Institutional Conclusion, the "Artworld" constitutes the art. But who are the players in art? The audience? The artist? The analogy dissolves the community of practice into a bureaucratic authority, which has no counterpart in the concept of "Game."

  ### 3. Does the Conclusion Stand?

  **Verdict: No.** The conclusion that "anything may be art" is not supported by the Game Analogy; it is smuggled in.

  The Game Analogy successfully destroys **Classical Essentialism** (the idea that there is one trait shared by all art). However, it fails to justify **Institutional Relativism** (the idea that status is purely conferred by authority).

  If we stick strictly to the Game Analogy:
  1.  Art has no single defining trait. (Supported)
  2.  Art is a cluster of overlapping practices. (Supported)
  3.  **Therefore, anything can be art.** (Unsupported. A rock is not a game just because I say so; it must participate in the family resemblance of play.)
  4.  **Therefore, the Artworld decides.** (Unsupported. Games are decided by players following traditions, not by a "Gameworld Committee.")

  The analogy carries the anti-essentialist weight but collapses under the weight of the institutional conclusion. The conclusion relies on a sociological claim (power of the Artworld) that the logical analogy (family resemblance) does not provide.

  ### 4. The Biological Alternative: Species and Art

  Your proposed analogy is not only better; it aligns with the most robust developments in post-Weitz aesthetics (specifically the **Historical/Narrative Definitions** of art proposed by Jerrold Levinson and Noël Carroll).

  Let us map the **Biological Species Concept** to **Art**.

  | Domain | Biological Taxonomy | Aesthetic Classification |
  | :--- | :--- | :--- |
  | **Unit** | Organism | Artwork |
  | **Class** | Species | Art (or Art Kinds) |
  | **Mechanism** | Descent with Modification | Art-Historical Tradition |
  | **Constraint** | Phylogenetic Lineage | Intentional Relation to Prior Art |
  | **Status** | Real but not Essentialist | Real but not Essentialist |
  | **Boundary** | Fuzzy (ring species, hybrids) | Fuzzy (avant-garde, boundary cases) |
  | **Arbiter** | Taxonomist (discovers) | Critic/Historian (discovers/traces) |

  #### Why this analogy improves matters:

  **1. Realism without Essentialism**
  Biologists abandoned the search for a single trait (e.g., "ability to interbreed") that defines all species because evolution produces fuzzy boundaries. However, no biologist concludes that "species are unreal" or "anything can be a species." A rock is not a species. A chimera is rare and constrained.
  *   *Application to Art:* We can abandon the search for a single trait (beauty, form, expression) without concluding that *anything* is art. An artwork is an artwork because it stands in a specific **historical relation** to previous artworks, just as an organism is a member of a species because it stands in a causal lineage to previous organisms.

  **2. Constraint vs. Permission**
  In biology, you cannot simply declare a new species. There must be a causal link (reproduction/lineage).
  *   *Application to Art:* This blocks the "anything goes" conclusion. Duchamp's *Fountain* is art not because the "Artworld" magically waved a wand, but because Duchamp intentionally positioned it in relation to the existing history of art (challenging the concept of the retinal). A random urinal in a hardware store is not art because it lacks that **intentional-historical lineage**.
  *   *Advantage:* This preserves constraints. Not everything can be art, just as not everything can be a *Canis lupus*.

  **3. Discovery vs. Conferral**
  Taxonomists *discover* relationships; they do not *confer* them. If we treat art classification like taxonomy, the critic's job is to trace the lineage and intention, not to vote on status.
  *   *Advantage:* This removes the mystical authority of the "Artworld." It makes art history a cognitive discipline similar to phylogenetics, rather than a political one.

  #### Where the Biological Analogy Relocates Trouble

  It is not without friction. You should be aware of two disanalogies:

  1.  **Natural vs. Cultural Kinds:** Species are (mostly) natural kinds; Artworks are cultural artifacts. Species arise via blind variation and selection; Art arises via *intentionality*.
      *   *Resolution:* This requires adding "Intentionality" to the biological model. An artwork is an artifact *intended* to be regarded in a way prior artworks were regarded (Levinson's definition). The "gene" in art is the *intention*, not the DNA.
  2.  **Extinction:** Species can go extinct. Can "Art" go extinct? Or can a specific *kind* of art (e.g., Tragedy) go extinct?
      *   *Resolution:* This is actually a feature, not a bug. It allows us to say certain art forms are dead without denying the reality of the concept.

  ### Summary Recommendation

  The argument you have encountered is a philosophical "bait and switch."
  1.  It uses **Wittgenstein (Games)** to destroy Essentialism. (Valid)
  2.  It uses **Institutional Theory (Artworld)** to fill the void with Authority. (Invalid inference from #1)

  Your biological instinct is the corrective.
  *   **Reject** the conclusion that "anything may be art."
  *   **Accept** the premise that "no single feature defines art."
  *   **Replace** the Game Analogy with the **Species Analogy**.

  This leads to a **Historical-Relational Definition**: *X is an artwork if and only if X is an artifact intended to be engaged with in a way that prior artworks were engaged with.*

  This satisfies the biologist in you: it allows for variation, mutation, and fuzzy boundaries (ring species/avant-garde), it rejects essentialism (no single gene/trait), but it maintains realism and constraint (lineage/causality). It treats Art as a living population rather than a game with no rules.
