  Give me a number, then break it into at least: (a) how often cheap-to-state, expensive-to-refute false claims exist on the questions we'd actually want to debate; (b) whether protocol moves — cross-examination, "point to the single crux step", letting the judge recursively delegate, per-round length caps that escalate — close the gap or just relocate it; (c) whether a judge's built-in verifier-ish heuristics break toward honesty even when it can't check anything; (d) whether the proposition is even well-posed, given "the truth" may be undefined for the open questions we care about. Number plus one line each, then how they combine.

  Then tell me which term the final number is most sensitive to, and what would move you most: a small-scale experiment with deliberately obfuscated arguments, or a theoretical separation result. And what would have to come out for you to drop below 0.2 or go above 0.8?
