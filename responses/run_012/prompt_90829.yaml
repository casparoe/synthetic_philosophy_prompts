answer: |-
  Thank you. Please, stay seated. I know the gowns are hot, I know the chairs are hard, and I know that lunch is waiting. I also know that for thirty-one years, I have stood where I am standing now, and today is the last time I will do it. When I walk off this stage, I am leaving the profession. So I want to spend these few minutes not on congratulations, which you have heard already, but on a confusion that has kept me awake for most of those three decades.

  It is a simple question. Why is knowing something better than merely being right about it?

  Imagine two people trying to get to Larissa. One has studied the map, walked the roads, and understands the terrain. The other flipped a coin at the crossroads and guessed correctly. Both arrive at the same time. Both are equally dry, equally fed, equally successful. In terms of the result, there is no difference. And yet, we instinctively treat the first person as better off. We say she *knows* the way, while the other was just lucky. But why does that matter?

  I have spent my career trying to answer this, and I want to tell you honestly that I have not succeeded. But I can show you where the trouble lies.

  Ten years ago, in my introductory logic course, I was grading a final exam. There was a difficult problem on the page. One student wrote down the correct symbol sequence. It was perfect. When I asked her later how she had derived it, she looked at me blankly and said, "I found the answer key online and copied it." She had the truth. She had the right answer. But she had no grip on it. If I had changed one variable in the problem, she would have been lost.

  Another student got that same problem wrong. She made a mistake in the third line. But when I sat with her and asked, "What were you trying to do here?" she walked me through her reasoning. I pointed to the error. Her face lit up. "Oh," she said. "I see. I distributed the negative wrong." She picked up her pen and fixed it instantly. She left the room with a wrong answer on the paper, but she understood the ground she was standing on.

  Who was better off? The university registrar would say the first student. She got the credit. But I felt a warmth toward the second one that I did not feel for the first. The first student had a true belief. The second was on the path to knowledge.

  Plato asked this question two thousand years ago, and he suggested that knowledge is like a statue tied down so it cannot run away, while true belief is a statue that might wander off. It is a pretty image. But it does not quite hold. Sometimes true beliefs stay put. Sometimes knowledge wanders. We also say knowledge is better because you can explain it, you can hand it to someone else. But you can hand on a guess just as easily as a proof, provided the other person doesn't ask too many questions.

  And now, the trouble deepens. You are graduating into a world where true belief is free. You have machines in your pockets that will tell you the road to Larissa every single time. They will not guess. They will not tire. They will be right more often than any of us ever were. If the value of knowledge is just getting the right answer, then my profession is obsolete. You do not need me to tell you what is true. You can search for that.

  So why are you here? Why did you spend four years struggling with texts, with labs, with arguments that offered no answer key?

  My colleagues in the third row know the standard defenses. They know I usually argue that knowledge is stable, or that it is an achievement rather than an accident. I am telling you today that those answers prove too much or too little. They do not fully close the gap. I do not know exactly why the student who understood her mistake was better off than the one who copied the truth. I only know that she was.

  There is a difference between having the world inside your head and having your head inside the world. The machine gives you the world. Education is supposed to help you build the capacity to hold it. But I cannot define that capacity for you without sounding like I am selling something. And I am not. I am retiring.

  So I will leave you with this. You are going into a life that will demand correct answers. Your bosses, your voters, your patients, your clients will want the road to Larissa, and they will not care how you found it. They will want the true belief. And you will be tempted to stop there. It is easier to copy the answer key. It is faster to trust the machine.

  But I hope that sometimes, when you have the right answer, you will pause and ask yourself if you know why it is right. I hope you will value the student who fixes the mistake over the one who copies the solution. I hope you will treat understanding as a kind of wealth that does not show up on a balance sheet.

  I cannot promise you that this will make you happier. I cannot promise it will make you richer. I cannot even promise you that knowledge is objectively superior to true belief in every single case. Sometimes, being right is enough to save a life. Sometimes, understanding is just a luxury.

  But I have watched students like the second one for thirty-one years. I have seen them walk out of my office having failed a test but having gained something I could not name. I am betting my life's work that what they gained was worth the trouble. I do not know exactly what it is. But I know I would rather have it than not.

  Thank you, and good luck.
