  *(Refining the Popper point)*: Popper requires a potential falsifier. In Tlön, the metaphysics denies the independent object. So, there is nothing to falsify *within* Tlön's framework. But from *our* framework, it's falsifiable (the objects don't exist). However, the story shows the objects *starting* to exist. So the falsification condition shifts. I need to highlight this instability.

  *(Refining the "Literature" aspect)*: The story isn't just a thought experiment; it's an aesthetic experience of vertigo. The reading must acknowledge the literary effect of the "hoax" frame.

