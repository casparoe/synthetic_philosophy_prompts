prompt: |-
  I am a PhD student in epistemology, and I have been asked to prepare the framing document for a two-day workshop that will pair a committed pragmatic encroacher (a subject-sensitive invariantist) with a committed epistemic contextualist. Both have agreed to produce a joint statement rather than another round of talking past each other, and the drafting falls to me. Write that statement. It should open with a numbered section of claims both parties can sign — about the ordinary pattern of knowledge attributions, about the rival positions they jointly reject, about the methodological constraints on a theory of knowledge ascription, and about what each would accept as evidence against its own view. It should then set out the residual disagreements in a table, each disagreement given twice, once in wording the encroacher would endorse and once in wording the contextualist would endorse, with a note on which disagreements might be merely verbal and what turns on disambiguating "knows". I expect at least two cruxes: whether the practical factor enters the truth conditions of "knows" or the knowledge relation itself, and whether the practical situation doing the work is the subject's or the attributor's. For each crux, give the case or argument both parties agree bears on it, and record each side's prediction in advance. I want the statement to face two cases squarely: an engineer who must certify a bridge as safe, where an error would kill, hearing a colleague say over a relaxed lunch that she knows the bridge is fine; and a subject with fixed evidence who is mistaken about her own stakes, believing she is choosing a footpath when she is in fact choosing whether to send a bus over a failing span. For each case the parties should state the verdict and the reason, and if they reach the same verdict by different routes, they should say so.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Role:** PhD student in epistemology.
      *   **Task:** Write a framing document/joint statement for a two-day workshop.
      *   **Participants:** A committed Pragmatic Encroacher (Subject-Sensitive Invariantist - SSI) and a committed Epistemic Contextualist (EC).
      *   **Goal:** Move beyond "talking past each other" to a joint statement.
      *   **Structure Requirements:**
          1.  Numbered section of agreed claims (ordinary patterns, rejected rivals, methodological constraints, falsification conditions).
          2.  Table of residual disagreements (Encroacher wording vs. Contextualist wording, notes on verbality/disambiguation).
          3.  Two specific "Cruxes":
              *   Crux 1: Practical factor in truth conditions of "knows" vs. knowledge relation itself.
              *   Crux 2: Subject's practical situation vs. Attributor's practical situation.
              *   For each crux: Agreed case/argument, Side A prediction, Side B prediction.
          4.  Two Specific Cases:
              *   Case 1: Engineer certifying a bridge (high stakes) vs. Colleague at lunch (low stakes context).
              *   Case 2: Subject with fixed evidence, mistaken about stakes (thinks footpath, actually bus span).
              *   For each case: Verdict, Reason, Note on convergence/divergence.
      *   **Tone:** Academic, precise, collaborative but clear on distinctions, suitable for a workshop framing document.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Pragmatic Encroachment (SSI):** Knowledge depends on truth, belief, justification, *and* practical stakes for the *subject*. "Knows" is invariant, but the bar for knowledge shifts with the subject's practical environment.
      *   **Epistemic Contextualism (EC):** Knowledge depends on truth, belief, justification. The *standards* for "knows" shift depending on the *attributor's* context (conversational context).
      *   **Common Ground:** Both reject Traditional Invariantism (TI) which says only truth, belief, and justification matter, regardless of stakes or context. Both agree that knowledge attributions *seem* to vary with practical factors. Both are sensitive to linguistic data.
      *   **Key Disagreement:** *Where* does the variation come from? (Semantics of "knows" vs. Metaphysics of Knowledge) and *Whose* context matters? (Subject vs. Attributor).

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to establish common ground to show good faith.
      *   *Ordinary Pattern:* Both agree that in high-stakes scenarios, people are less willing to attribute knowledge than in low-stakes scenarios (the "Bank Case" intuition).
      *   *Rejected Rivals:* Both reject Skepticism (we know things) and Traditional Invariantism (stakes never matter).
      *   *Methodology:* Both agree theories must respect linguistic usage *and* explain the function of knowledge ascriptions.
      *   *Falsification:* What would change their minds? Encroacher: If stakes change but knowledge intuition stays fixed. Contextualist: If attributor context changes but knowledge intuition stays fixed.

  4.  **Drafting - Section 2: Residual Disagreements (Table):**
      *   Need to show the *same* disagreement from two angles.
      *   *Disagreement 1 (Semantics vs. Metaphysics):*
          *   Encroacher: "Knows" means the same thing; the *state* changes.
          *   Contextualist: The *state* is stable; the word "knows" changes content.
      *   *Disagreement 2 (Whose Stakes):*
          *   Encroacher: Subject's stakes determine knowledge.
          *   Contextualist: Attributor's conversational standards determine truth of attribution.
      *   *Verbality Note:* Acknowledge that some of this might hinge on whether we are theorizing the *word* or the *concept*.

  5.  **Drafting - Section 3: The Two Cruxes:**
      *   *Crux 1 (Truth Conditions vs. Relation):*
          *   Case: A variation of the Bank Case where semantic intuition is probed directly.
          *   Encroacher Prediction: Subject lacks knowledge in high stakes.
          *   Contextualist Prediction: Attribution is false in high standards context, true in low.
      *   *Crux 2 (Subject vs. Attributor):*
          *   Case: "Mismatched Contexts" (Subject high stakes, Attributor low stakes).
          *   Encroacher Prediction: No knowledge (Subject stakes win).
          *   Contextualist Prediction: Knowledge attribution true (Attributor standards win).

  6.  **Drafting - Section 4: The Two Specific Cases:**
      *   *Case 1 (The Bridge Engineer):*
          *   Scenario: Engineer (Subject) has high stakes (certification/death). Colleague (Attributor) at lunch has low stakes (casual chat).
          *   Encroacher: Engineer does *not* know (high stakes). Colleague's claim is false.
          *   Contextualist: Colleague's claim is *true* relative to lunch context (low standards), but useless for certification. (Or, if the certification context saliently raises standards, it becomes false). Let's refine: EC usually says the attribution's truth depends on the *attributor's* context. So at lunch, "She knows" is true.
          *   *Convergence?* They might agree the engineer shouldn't act, but disagree on the truth of the lunch claim.
      *   *Case 2 (Mistaken Stakes):*
          *   Scenario: Subject thinks low stakes (footpath), actually high stakes (bus span). Evidence fixed.
          *   Encroacher: Knowledge depends on *actual* stakes. So, No Knowledge.
          *   Contextualist: Knowledge depends on attributor context. But what if the attributor knows the stakes? If the attributor is the subject herself (self-ascription)? EC struggles here. Usually, EC says standards are set by the conversation. If the subject is deliberating, her own context sets standards. If she *believes* stakes are low, her standards are low. But the *fact* is high stakes.
          *   *Refinement for EC:* EC focuses on the truth of the *ascription*. If I say "I know," and I'm wrong about stakes, is it true? EC usually ties standards to salient error possibilities. If the risk is objective, does it make error salient? Let's assume the Subject is the Attributor here.
          *   Encroacher: No knowledge (Objective stakes matter).
          *   Contextualist: If the subject's context doesn't make the risk salient, "I know" is true in that context, even if dangerous. (This highlights the "Factivity" worry for EC).
          *   *Wait, better EC move:* EC says standards are determined by what is *properly* taken for granted in the conversation. If the bus risk is real, perhaps it *should* be salient. But let's stick to the prompt's constraint: "Subject... mistaken about her own stakes."
          *   Encroacher Verdict: S does not know.
          *   Contextualist Verdict: S's claim "I know" is true in her low-stakes context, but misleading.
          *   *Divergence:* This is a key split.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too adversarial? The prompt asks for a "joint statement" to stop "talking past each other." It needs to sound like a collaborative framework, acknowledging differences without hostility.
      *   *Formatting:* Use clear headings, numbered lists, and a markdown table.
      *   *Philosophical Accuracy:* Ensure SSI and EC are represented charitably. SSI isn't just "stakes matter," it's "stakes affect justification/knowledge." EC isn't just "context matters," it's "semantic content of 'knows' shifts."
      *   *Specific Constraint Check:* Did I include the "note on which disagreements might be merely verbal"? Yes, need to ensure that's in the table section. Did I include the "prediction in advance" for cruxes? Yes.

  8.  **Final Polish:**
      *   Make sure the distinction between "truth conditions of 'knows'" and "knowledge relation" is clear in Crux 1.
      *   Ensure the Bridge case distinguishes between the Engineer's state and the Colleague's utterance.
      *   Ensure the Mistaken Stakes case highlights the objective vs. subjective tension.

      *(Self-Correction during drafting)*: In the Bridge Case, the Contextualist needs to be careful. If the Colleague says "She knows" at lunch, EC says that's true *at lunch*. But if the Engineer acts on it, she moves to a high-stakes context. The Joint Statement should reflect that EC allows the sentence to be true even if the action is unwarranted. SSI says the sentence is false because the knowledge state isn't there. This is a clear divergence.

      *(Self-Correction on Mistaken Stakes)*: For the Contextualist, if the subject is the attributor, her context determines the standards. If she thinks it's a footpath, standards are low. So "I know" is true. For the Encroacher, the *actual* stakes determine the threshold. So "I know" is false. This is a perfect test case.

  9.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # JOINT WORKING STATEMENT: PRACTICAL FACTORS IN EPISTEMIC EVALUATION
  **Prepared for the Workshop on Knowledge, Stakes, and Context**
  **Drafting Committee:** [Encroacher Representative], [Contextualist Representative]
  **Facilitated by:** [PhD Student Name]

  ## PREAMBLE
  We, the undersigned, represent two distinct theoretical approaches to the interaction between practical factors and knowledge: **Pragmatic Encroachment (Subject-Sensitive Invariantism)** and **Epistemic Contextualism**. We acknowledge a history of dialectical stalemate wherein our respective defenses have often appeared to be descriptions of the same phenomena using different ontological commitments. The purpose of this workshop is not to force a synthesis, but to precisely locate the divergence. We agree that traditional invariantism is insufficient to explain ordinary usage, but we disagree on the locus of the variation. This document frames our inquiry for the next two days.

  ## I. AGREED CLAIMS
  *Both parties endorse the following propositions as the baseline for this workshop.*

  1.  **The Ordinary Pattern:** In ordinary discourse, the willingness to attribute knowledge ("S knows that p") varies systematically with practical factors. Specifically, as the practical cost of being wrong increases, speakers become less willing to attribute knowledge, even when evidence held by the subject remains fixed.
  2.  **Joint Rejection of Rivals:** We jointly reject **Radical Skepticism** (the claim that we rarely or never know) and **Traditional Insensitive Invariantism** (the claim that knowledge depends *only* on truth, belief, and justification/evidence, and never on practical stakes or conversational context).
  3.  **Methodological Constraints:** A viable theory of knowledge ascription must satisfy two constraints:
      *   *The Linguistic Constraint:* It must account for the felicity and infelicity of knowledge claims in natural language.
      *   *The Action Constraint:* It must explain the normativity of knowledge (i.e., why knowledge is the norm of assertion and practical reasoning).
  4.  **Falsification Conditions:**
      *   The **Encroacher** accepts that their view is falsified if it is demonstrated that a subject retains the *same* knowledge state across high and low stakes, and the variation in attribution is purely due to conversational implicature or performance error.
      *   The **Contextualist** accepts that their view is falsified if it is demonstrated that the semantic content of "knows" remains fixed across contexts where practical factors vary, and the variation is due to a shift in the metaphysical conditions of knowledge itself.

  ## II. RESIDUAL DISAGREEMENTS
  *The following table maps our disagreements. We note where divergence is metaphysical and where it may be merely verbal (semantic).*

  | Domain of Disagreement | Encroacher Formulation (SSI) | Contextualist Formulation (EC) | Verbality & Disambiguation Note |
  | :--- | :--- | :--- | :--- |
  | **Locus of Variation** | Practical factors alter the **knowledge relation** itself. The threshold for justification shifts based on stakes. | Practical factors alter the **semantic content** of "knows." The relation remains stable; the word's standard shifts. | **Substantive.** Turns on whether "knowledge" refers to a natural kind with fixed properties or a gradable adjective sensitive to context. |
  | **Relevant Agent** | The **Subject's** practical situation determines whether they know. | The **Attributor's** conversational context determines the truth of the knowledge claim. | **Substantive.** Turns on whose context fixes the parameters of evaluation. |
  | **Error Possibilities** | High stakes make distant error possibilities **relevant** to justification, defeating knowledge. | High stakes make distant error possibilities **salient**, raising the semantic standard for "knows." | **Potentially Verbal.** Both agree error possibilities matter; we disagree on whether this is a feature of the world (SSI) or the conversation (EC). |
  | **Facticity** | Knowledge is factive and stable; if stakes change, knowledge is lost or gained objectively. | Knowledge ascriptions are indexical; "S knows" can be true in one context and false in another simultaneously. | **Substantive.** Turns on whether contradictory knowledge claims can both be true. |

  ## III. THE TWO CRUXES
  *We identify two specific theoretical cruxes where our predictions diverge sharply. For each, we stipulate a case we agree bears on the issue and record our predictions in advance.*

  ### Crux 1: The Locus of Practical Sensitivity
  *Does the practical factor enter the truth conditions of the word "knows" or the knowledge relation itself?*

  *   **Agreed Test Case:** **The "Pure Stakes" Variation.** Two subjects have identical evidence and identical psychological states. Subject A is in a low-stakes environment. Subject B is in a high-stakes environment. Neither is aware of the other's environment. An omniscient observer evaluates both.
  *   **Encroacher Prediction:** Subject A knows; Subject B does not know. The difference is in the *world* (the relation between B and the proposition), not just in our description of them.
  *   **Contextualist Prediction:** Both subjects stand in the same epistemic relation to the proposition. Whether the omniscient observer says "A knows" and "B does not know" depends on the *observer's* context of assessment, not the subjects' environments. If the observer uses low standards, both know.

  ### Crux 2: The Subject/Attributor Mismatch
  *Whose practical situation does the work: the subject's or the attributor's?*

  *   **Agreed Test Case:** **The "Crossed Context" Scenario.** A Subject is in a High-Stakes situation (error is fatal). An Attributor is in a Low-Stakes situation (error is trivial). The Attributor says, "The Subject knows."
  *   **Encroacher Prediction:** The Attributor's claim is **False**. The Subject's high stakes prevent them from knowing, regardless of the Attributor's relaxed context.
  *   **Contextualist Prediction:** The Attributor's claim is **True** (relative to the Attributor's context). The low standards of the Attributor's conversation are satisfied, even if the Subject cannot act on that knowledge.

  ## IV. CASE STUDIES FOR WORKSHOP ANALYSIS
  *We commit to analyzing the following two cases squarely. We state our verdicts and reasons below to highlight convergence or divergence.*

  ### Case 1: The Bridge Engineer
  **Scenario:** An Engineer (Subject) must certify a bridge as safe. If she is wrong, people die (High Stakes). Later, at a relaxed lunch, a Colleague (Attributor) says to a third party, "Don't worry, Sarah (the Engineer) knows the bridge is fine." The Colleague is not involved in the certification and faces no risk (Low Stakes).

  | Party | Verdict on Colleague's Claim ("Sarah knows") | Reason |
  | :--- | :--- | :--- |
  | **Encroacher** | **False.** | The truth of the claim depends on Sarah's epistemic position. Because Sarah's stakes are high, her evidence is insufficient for knowledge. The Colleague's relaxed context cannot restore the knowledge relation Sarah lacks. |
  | **Contextualist** | **True (at lunch).** | The truth of the claim depends on the Colleague's conversational context. At lunch, the standards for "knows" are low. Sarah meets those standards. (Note: EC agrees Sarah should not *act* on this until she meets the higher standards of the certification context). |
  | **Consensus?** | **No.** | **Divergence.** Encroacher says the claim is objectively false. Contextualist says it is contextually true but practically inert for certification purposes. |

  ### Case 2: The Mistaken Stakes
  **Scenario:** A Subject has fixed evidence regarding a path. She believes she is choosing a footpath (Low Stakes). In reality, she is choosing whether to send a bus over a failing span (High Stakes). She is unaware of the bus. She asserts, "I know the path is safe."

  | Party | Verdict on Subject's Claim ("I know") | Reason |
  | :--- | :--- | :--- |
  | **Encroacher** | **False.** | Knowledge is sensitive to *objective* practical facts, not just believed stakes. Because the actual stakes are high (bus safety), the threshold for justification is raised. Her evidence does not meet this threshold, so she does not know. |
  | **Contextualist** | **True (in her context).** | The standards for "knows" are set by what is salient in the Subject's deliberative context. Since the bus risk is not salient to her (she thinks it's a footpath), the standards remain low. Her evidence meets these low standards. Her claim is true, though her action is dangerously misguided. |
  | **Consensus?** | **No.** | **Divergence.** This is the critical test. Encroacher ties knowledge to objective normative pressure. Contextualist ties knowledge ascription to the agent's subjective conversational/deliberative context. |

  ## V. WORKSHOP OBJECTIVES
  1.  To determine if the divergence in **Case 2** can be resolved by distinguishing between *knowledge* and *warranted assertibility*.
  2.  To examine if the **Contextualist** can accommodate the Encroacher's intuition in Case 2 by arguing that objective stakes *make* error possibilities salient, even if the subject is unaware (a "Moderate Contextualism").
  3.  To examine if the **Encroacher** can accommodate the Contextualist's intuition in Case 1 by granting that the Colleague's claim is "loosely true" without violating invariantism.

  *Signed,*

  __________________________
  (Pragmatic Encroachment Representative)

  __________________________
  (Epistemic Contextualist Representative)
