answer: |-
  The practice of the Nuremberg and Tokyo tribunals occupies a fraught space between legal positivism, natural law theory, and political realism. To understand what this practice presupposes, one must disentangle the justificatory rhetoric of the judgments from the operational mechanics of the tribunals. The account below distinguishes between what the proceedings strictly necessitate regarding the nature of law and responsibility, and what theories merely accommodate the outcome. It concludes by considering how the practice would shift under alternative theoretical commitments.

  **Conceptions of Law: Sovereignty versus Morality**

  The judgment's dual characterisation of the Charter—as both an exercise of 'sovereign legislative power' and an 'expression of international law existing at the time'—reveals a strategic ambiguity. Strictly speaking, the practice does not require a moralised conception of law on which the defeated states' legal authorisations were void *ab initio*. It is sufficient that the victors possessed the sovereign power to legislate for the vanquished, a view rooted in the law of occupation and the reality of unconditional surrender. On this positivist or realist view, the prior domestic laws of Germany and Japan remained 'law' within their own systems, but were simply overridden by the superior legislative authority of the occupying powers. The tribunals did not need to declare the Nazi state legally non-existent to punish its leaders; they only needed to assert jurisdiction over the persons in their custody.

  Consequently, the practice is underdetermined regarding the concept of law. It fits well with a natural law view (such as Gustav Radbruch's later formula, that extreme injustice is no law), which would render the defendants' actions illegal even by the standards of their own time. However, it fits equally well with a 'victor's justice' positivism, where law is the command of the sovereign, and the sovereign has changed hands. The fact that the victors did not submit their own conduct to the same law suggests the latter view is more descriptive of the practice than the former. A thoroughgoing natural law view would imply a universal jurisdiction that ought to bind the victors as much as the vanquished; the exemption of Allied conduct points instead to a power-based jurisdiction.

  **A Theory of Responsibility**

  The tribunals presuppose a specific theory of responsibility that prioritises individual moral agency over domestic legal permission. By stipulating that official position is no defence and that superior orders merely mitigate punishment, the Charter treats prior legal permission as irrelevant to blameworthiness. This presupposes that there is a layer of obligation—international or moral—that transcends the state. It does not, however, strictly commit to a view that domestic law is never law; rather, it commits to the view that domestic law is not a *sufficient* justification for atrocities.

  Regarding omissions and command responsibility, the practice presupposes that liability can attach to a failure to act where a duty to control exists. This shifts the basis of responsibility from direct commission to a derivative negligence or dereliction of duty. This is consistent with a broader moral view of responsibility but creates tension with strict criminal law principles requiring a direct causal link between act and harm. The practice assumes that a commander's authority entails a duty to prevent crimes, and that the breach of this duty is itself a culpable act.

  **Consistency with *Nullum Crimen Sine Lege***

  The judgment's insistence that no one may be punished without a law in force when he acted (*nullum crimen sine lege*) sits uneasily with the retroactive drafting of the Charter. To maintain consistency, the tribunals presupposed that the Charter was declaratory of customary international law already in existence. Strictly, the practice presupposes that the *substance* of the crimes (murder, persecution, aggressive war) was sufficiently recognised as wrongful to satisfy the principle of legality, even if the *procedure* and specific definitions were new.

  However, if one adopts a strict legality view, this presupposition fails. Aggressive war was not clearly criminalised for individuals prior to 1945. Therefore, the practice does not strictly satisfy a rigorous *nullum crimen* principle; it satisfies a diluted version where 'law' includes emerging norms and general principles of justice. The practice presupposes that the moral gravity of the acts outweighs the procedural requirement for antecedent statutory law.

  **Strict Presuppositions versus Underdetermination**

  It is vital to distinguish what the practice strictly presupposes from what it merely fits well with.
  *   **Strict Presuppositions:** The practice strictly presupposes that individuals are subjects of international law, capable of bearing duties directly without state mediation. It presupposes that the victors have the authority to adjudicate the defeated, regardless of the defeated state's consent. It presupposes that moral blameworthiness can survive domestic legal authorisation.
  *   **Underdetermination (Fits Well):** The practice does not strictly presuppose that the Nazi regime was legally void. A positivist could argue the laws were valid but overridden. It does not strictly presuppose natural law, though natural law theorists find the judgments congenial. The exemption of the Japanese Emperor and Allied leaders is not dictated by any theory of law but fits well with a political realist view that law is instrumental to order and stability.

  **Counterfactuals: Replacing the Presupposed View**

  If we were to replace the hybrid view of the tribunals with a **strict legality view** (no liability without antecedent law), the practice would have to change significantly. Charges of 'Crimes Against Peace' (waging aggressive war) would likely have been dismissed, as individual criminal responsibility for aggression was not firmly established in treaty or custom prior to the war. Command responsibility would require explicit prior treaty ratification by the defendant's state. The tribunals would have been limited to prosecuting conventional war crimes (violations of the Hague and Geneva conventions) where the laws were clearly codified and accepted by the belligerents. The scope of conviction would have narrowed, and the 'retroactivity' critique would have been legally fatal rather than rhetorically managed.

  Conversely, if we adopted a **thoroughgoing natural law view** (injustice voids legal authorisation), the practice would theoretically broaden but face a crisis of consistency. If the Nazi laws were void because they were unjust, then the legal defence of 'acting according to law' collapses entirely. However, this view imposes a universal standard. To remain consistent, the tribunals would have to submit Allied conduct (such as the firebombing of civilian centres) to the same natural law scrutiny. If the injustice of targeting civilians voids the authorisation for such acts, Allied commanders could theoretically be liable. To avoid this, the practice would have to become either hypocritical (applying natural law only to the enemy) or truly universal (establishing a permanent court with jurisdiction over all powers). The latter is what eventually emerged with the International Criminal Court, but it was not the practice at Nuremberg.

  **Conclusion**

  The Nuremberg and Tokyo practices presuppose a shift from a state-centric to an individual-centric view of international responsibility, grounded in the belief that certain acts are inherently blameworthy regardless of domestic permission. However, they do not strictly require a natural law conception of validity; they function adequately on a basis of sovereign power exercised by the victors. The judgment's claim to be applying pre-existing law is best understood as a necessary legal fiction to bridge the gap between the demand for justice and the principle of legality. A strict legality view would have crippled the tribunals' ability to address 'aggressive war', while a thoroughgoing natural law view would have demanded a universality the victors were unwilling to accept. The practice, therefore, rests on a pragmatic compromise: asserting the supremacy of international norms over domestic law, while retaining the sovereign discretion to determine who stands in the dock.
