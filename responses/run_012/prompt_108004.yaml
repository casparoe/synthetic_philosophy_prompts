      *Need to make sure the EMH vs No-Trade distinction is sharp.* No-Trade says *speculative* trade vanishes. EMH says prices reflect info. You can have EMH with noise traders. No-Trade assumes *only* informed rational traders. That's the key.

  7.  **Final Review against constraints:**
