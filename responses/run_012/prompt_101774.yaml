  4.  **Drafting Section 2: The Residue Report (Mapping Analysis):**
      *   *Clean Carryover:* Decomposition (Scope of Work), Human Oversight (Punch List/Correction), Training (Shadowing), Iteration (Job to Job).
      *   *Bent/Forced:* The "Distillation" step. In AI, you copy weights. In humans, you copy *understanding*. It's lossy. A new hire never thinks *exactly* like the Owner.
      *   *No Counterpart (The AI Gap):*
          *   *Speed/Replication:* AI copies instantly. Humans take seasons to train.
          *   *Agency/Resistance:* AI (theoretically) has no desires. Miguel *does*. He might cut corners or have a "better way" that conflicts with the Vision.
          *   *The "Black Box" Intent:* The Owner holds the intent. In AI, we are trying to *externalize* the intent into the system. In landscaping, the intent stays with the Owner.
      *   *The "Tree" vs. "Web":* AI assumes a clean dependency tree. Job sites are messy (rain, broken equipment, mood).

  5.  **Drafting Section 3: The Verdict (Hole in Thinking or Hole in Theory?):**
      *   *User's Gut:* The "tree of tasks" is too tidy. People have agency.
      *   *Analysis:* The AI theory *hopes* that decomposition captures all the nuance. It often fails because "context" is lost in the handoff.
      *   *The Verdict:* It's mostly a hole in the AI theory (or at least, an optimistic simplification). They treat "alignment" like a spec sheet, but the User knows alignment is a continuous negotiation.
      *   *Nuance:* However, the User's model also has a bottleneck (The Owner). If the Owner gets hit by a bus, the "system" collapses. AI wants to solve the scalability problem the User faces (can't be everywhere at once).
      *   *Conclusion:* The AI people are describing an *idealized* version of management. They are dressing up the hard problem (transferring tacit knowledge and intent) as a solved engineering problem (distillation). The User's skepticism about "people with their own ideas" is the critical friction point the AI theory glosses over.

  6.  **Refining and Polishing:**
      *   *Check Tone:* Is it too academic? Needs to sound like one pro talking to another. Use terms like "change order," "tacit knowledge," "field conditions."
      *   *Check Constraints:* Did I assume the crew has no goals? Make sure to highlight Miguel's agency. Did I assume the spec is fixed? Emphasize the "vibe check" the Owner does.
      *   *Specific AI Terminology:* I need to make sure I'm accurately reflecting the "Iterated Distillation and Amplification" concept without using jargon, just as requested.
      *   *Self-Correction on "Distillation":* In AI, distillation is training a net on the output of a bigger net. In humans, it's training a junior on the output of a senior. The difference is *internal state*. The junior doesn't get the senior's intuition, just their actions. This is a key "Residue" point.

  7.  **Final Review against User Prompt:**
      *   Restate in vocabulary? Yes.
      *   Don't cheat on crew goals/customer spec? Yes.
