answer: |-
  At the Centennial Symposium for the Department's Founder, three senior members were invited to speak on his legacy.

  The first, a Dean, stood to give the **Monumental** address. "We must tell the story of the Night of the Breakthrough exactly as the legend goes," he declared. "If the students learn he spent ten years in dead ends, they will lose heart. The distortion *is* the inspiration. We polish the myth so they have a ladder to climb, even if the ladder leans against the wrong wall."

  The second, a Curator, spoke for the **Antiquarian** tradition. "We must preserve his laboratory exactly as found," she insisted, gesturing to a display case containing a rusted valve. "If we replace the broken equipment with modern tools, we break the chain of continuity. The decay *is* the reverence. We keep the dust because it is the only thing that hasn't moved on."

  The third, a Historian of Science, took the **Critical** stance. "We must publish the audit of his rivalries," he argued. "If we do not condemn his methods, we remain children in his shadow. The destruction *is* the liberation. We must burn the idol so we can breathe the air, even if there is nothing left to stand on."

  Then the retired experimentalist stood up, adjusted his glasses, and said:

  "I went down to the basement and rebuilt his 1954 apparatus. I reproduced the setup exactly, but I changed the cooling fluid from tap water to distilled. The signal vanished. He didn't discover a new particle; he discovered a mineral deposit in the pipes. You three are debating whether he was a hero, a saint, or a thief. I just isolated the variable."
