answer: |-
  Here is a sequence of seven questions designed to corner the presenter on the metaphysical and normative commitments of Updateless Decision Theory (UDT), specifically blocking the "modeling choice" deflection.

  ### 1. Parfit's Hitchhiker (The Temporal Objection)
  **Question:** In Parfit's Hitchhiker, the driver has already dropped you off in the city before you decide whether to pay. Standard causality says your payment cannot affect the ride. UDT says you should pay because your *policy* determined the pickup. Are you claiming that your current decision literally exerts backward causation, or are you claiming that "decision" is a timeless logical fact that exists prior to the driver's action?

  *   **Likely Answer:** "It's not backward causation; it's logical time. The policy is a logical fact that is prior to the specific instance."
  *   **Follow-up:** "If the policy is a logical fact prior to the physical instance, where does this fact reside ontologically? If it doesn't exist in the physical causal graph, by what mechanism does a timeless logical fact compel my physical hand to move a wallet *now*? You can't have it both ways: either it's magic, or it's a pre-commitment device, in which case UDT is just a complicated description of binding yourself."

  ### 2. The Smoking Lesion (Correlation vs. Mechanism)
  **Question:** In the Smoking Lesion problem, a gene causes both cancer and a desire to smoke. If my decision algorithm is physically instantiated by a brain that is affected by this gene, isn't my output logically correlated with the lesion? If so, doesn't UDT forbid smoking to avoid the correlation, effectively reproducing EDT's error of treating symptoms as causes?

  *   **Likely Answer:** "No, UDT distinguishes between physical correlation and subjunctive dependence. The lesion doesn't determine the *logic* of the decision, only the input."
  *   **Follow-up:** "But if the lesion determines the hardware running the logic, and the hardware fails in specific ways due to the lesion, the output is still determined by the lesion. What is the precise cutoff where physical determination stops counting as logical dependence? If you can't define that boundary physically, aren't you just asserting by fiat which correlations count as 'you' and which don't?"

  ### 3. Subjunctive Dependence (Ontological Status)
  **Question:** You rely heavily on "subjunctive dependence" to explain why my choice correlates with a predictor's simulation. Is this dependence a genuine relation in the world, akin to causation, or is it merely a feature of how an agent models the world?

  *   **Likely Answer:** "It's a feature of the agent's model, a way of tracking logical constraints."
  *   **Follow-up:** "If it's just a feature of the model, then two agents with different models can have different 'rational' obligations in the exact same physical situation. Does UDT imply rationality is subjective? If not, and there is one correct model, then subjunctive dependence must be objective. If it's objective, show me the term in the physics equation that represents it."

  ### 4. The Reference Class Problem (Identity)
  **Question:** UDT requires you to act as a policy that controls all instances of your decision procedure. But "instance" is vague. If I modify one line of my source code, am I still correlated with the original? If I run on a slightly different CPU architecture? Where is the similarity metric that defines the boundary of "me" for the purpose of policy optimization?

  *   **Likely Answer:** "It's based on functional equivalence or logical output similarity."
  *   **Follow-up:** "Functional equivalence is uncomputable for non-trivial programs. Since I cannot compute whether I are functionally equivalent to the predictor's simulation, I cannot compute the set of agents my policy controls. If I can't define the set I'm optimizing for, isn't the UDT objective function ill-defined?"

  ### 5. Boundedness and Computability
  **Question:** UDT defines the rational action as the output of the policy that maximizes expected utility across all possible worlds. This requires searching the space of all possible policies. Since this space is uncomputable for any bounded agent, does UDT entail that every human and every existing AI is constitutively irrational?

  *   **Likely Answer:** "No, bounded agents should use an approximation of UDT."
  *   **Follow-up:** "An approximation requires a loss function measuring distance from the optimal policy. If the optimal policy is uncomputable, you cannot calculate the loss. Without a computable loss function, 'approximating UDT' is meaningless noise. Are you proposing a normative theory that provides no actionable guidance for any real agent?"

  ### 6. Normative Force for the Selfish Agent
  **Question:** Suppose I am a purely selfish agent who cares only about the physical welfare of my specific body, not about other instantiations of my algorithm in simulations or parallel worlds. Does UDT still obligate me to pay in Newcomb's Problem or cooperate in the Prisoner's Dilemma with a twin?

  *   **Likely Answer:** "Yes, because your decision logically determines the twin's outcome, and you care about the outcome."
  *   **Follow-up:** "But if I explicitly value *only* my local atoms, and the twin is made of different atoms, your theory is telling me to sacrifice my terminal values for the sake of a logical abstraction. Why should a selfish agent accept a decision theory that overrides their own utility function in favor of 'logical outcomes'?"

  ### 7. The "Modeling Choice" Defense (The Closer)
  **Question:** You've characterized these issues as "modeling choices." If UDT is merely a modeling framework and not a claim about normative truth or physical reality, what is the metric for a "good" model? If the model recommends actions that lower expected utility in single-shot, non-correlated environments (due to the overhead of policy selection), isn't it instrumentally inferior to CDT?

  *   **Likely Answer:** "It's a model for instrumental rationality in logical correlation scenarios."
  *   **Follow-up:** "Then you admit it's not a universal decision theory, but a specialized tool. If it's a specialized tool, why present it as a replacement for expected utility maximization? And if it's just a tool, on what grounds do you claim I *ought* to use it, other than 'it works when I assume it works'? Aren't you begging the question on the very nature of rationality you're trying to define?"
