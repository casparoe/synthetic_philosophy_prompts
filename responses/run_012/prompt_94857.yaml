answer: |-
  You should reject step (5). The argument relies on a logical slide from degraded precision to total blindness: while steps (3) and (4) establish that targeting a proxy reduces its correlation with the true good, step (5) illicitly infers that a reduction in correlation implies a total loss of informational content. A measure can cease to be "good" (meaning perfect or highly reliable) without becoming useless; it retains value as a noisy signal rather than a definitive proof, allowing evaluation to distinguish between broad success and failure even if it cannot measure magnitude perfectly. Rejecting this step costs you the simplicity of treating metrics as objective arbiters of truth. You lose the ability to claim that meeting a target equates to achieving the good, forcing you to accept that evaluation is now a matter of probabilistic judgment rather than mechanical verification. This requires you to invest in triangulating metrics with qualitative context and to periodically audit the relationship between the number and the reality, shifting your burden from defending the numbers themselves to defending your interpretation of them.
