          *   *Position:* Epicurus's claim is substantive. It transforms the neutral state into a positive good. A consistent tranquilist should reject calling it "pleasure" and view it as "neutral." Epicurus allows for active life *within* stability; Tranquilism risks valuing mere non-existence or vegetative states if craving is the enemy.

