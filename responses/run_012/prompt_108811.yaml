      *   **Epicureanism:** Goal = *Ataraxia* (freedom from disturbance) + *Aponia* (freedom from pain). Key Claim: Removal of pain *is* pleasure (katastematic pleasure). Positive pleasures (kinetic) are permissible but not necessary for the *summun bonum*. Friendship and philosophy are instrumental/constitutive of security and peace.

