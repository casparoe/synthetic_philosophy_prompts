answer: |-
  This is a sharp observation. You have put your finger on a structural pathology that sits exactly at the intersection of Inverse Reinforcement Learning (IRL), Bayesian inference, and the Philosophy of Mind. You are right to feel that "underdetermination" is too weak a word for this. Underdetermination says "many answers fit." Your observation is stronger: "The model finds *one* answer, feels *sure* of it, and that certainty is an artifact of the model's own flexibility."

  Here is the breakdown of the existing concepts, why they fall short, and the precise definition of the phenomenon you are seeing.

  ### 1. Brainstorming Existing Concepts

  Here are the three nearest neighbors from philosophy and machine learning.

  **A. The Quine-Duhem Thesis (Philosophy of Science)**
  *   **The Idea:** You cannot test a scientific hypothesis in isolation. If a prediction fails, you can always save the core hypothesis by adjusting an "auxiliary assumption" (e.g., the telescope was dirty, the clock was wrong).
  *   **Where it fits:** This is exactly your "excuse slot." The Goal is the core hypothesis; the Belief is the auxiliary assumption. The detour (data) falsifies the "Shortest Path Goal" only if you assume "Accurate Map Belief." Change the belief to "Flooded Road," and the Goal is saved.
  *   **Where it stops:** Quine-Duhem is about *falsifiability* (you can't prove it wrong). It does not predict *confidence*. In fact, standard scientific intuition suggests that needing to tweak auxiliary assumptions should make you *less* confident in the theory. Your system does the opposite: it gets *more* confident. Quine-Duhem explains the degeneracy, not the overconfidence.

  **B. Non-Identifiability (Statistics / System ID)**
  *   **The Idea:** A model is non-identifiable if different parameter settings produce the exact same probability distribution over data. In IRL, this is the classic "many reward functions explain the same trajectory" problem.
  *   **Where it fits:** It captures the mathematical structure. You have a manifold of $(Goal, Belief)$ pairs that all yield optimal behavior.
  *   **Where it stops:** Standard non-identifiability implies a *flat* posterior. If parameters are non-identifiable, a honest Bayesian estimator should show high uncertainty (a wide distribution). Your system shows a *sharp* posterior. This means your system is not reporting the true posterior; it is reporting a local mode and mistaking it for the global truth.

  **C. Overfitting via Latent Variables (Machine Learning)**
  *   **The Idea:** Adding hidden parameters increases model capacity. If unconstrained, the model fits the noise in the training data perfectly.
  *   **Where it fits:** This explains the "Rising Confidence." The belief variable is absorbing the "noise" (the weirdness of the action). Because the fit is perfect, the loss is near zero, and the optimizer reports high confidence.
  *   **Where it stops:** "Overfitting" is too generic. It doesn't capture the *semantic* relationship between Goal and Belief. It doesn't explain why the *Goal* estimate specifically becomes sharper, rather than just the *Behavior* prediction becoming sharper. The error is being specifically routed into the Belief variable to protect the Goal variable.

  ### 2. The Synthesis: What You Have Found

  You are describing a specific failure mode of **Bayesian Theory of Mind** models when the **Belief State is unconstrained**.

  The phenomenon is not just underdetermination. It is **Spurious Identifiability via Compensatory Error**.

  Here is the breakdown of your three observations:

  1.  **The Detour/Reheat (Degeneracy):** This is **Quinean Degeneracy**. Any behavior $B$ can be rationalized by a pair $(G, \neg B_{elief})$.
  2.  **The Symmetry (Goal vs. Belief):** This is **Holism of the Mental**. In the likelihood function $P(Action | Goal, Belief)$, these two variables are coupled. You can slide along the contour of constant likelihood by trading Goal-complexity for Belief-complexity. They are not independent dimensions; they are a single manifold of "Rationalizations."
  3.  **The Rising Confidence (The Killer):** This is **Mode Collapse on a Degenerate Manifold**.
      *   *Why it happens:* Your inference algorithm (likely variational or MAP) finds a specific point $(G^*, B^*)$ where the likelihood is maximized. Because $B$ is flexible, the likelihood is near-perfect.
      *   *The Error:* The algorithm calculates confidence based on the *local curvature* around that peak (the Hessian). Locally, it looks like a sharp peak. Globally, it is a long, flat ridge (because other $(G', B')$ pairs work just as well). The system reports the local sharpness, ignoring the global flatness.
      *   *Result:* The system is **Confidently Wrong** about the Goal, because the Belief variable has absorbed all the evidence that should have created uncertainty.

  ### 3. Coining the Term

  Since you need to reconstruct this argument later, I propose you call this **"Compensatory Certainty."**

  **Definition:** Compensatory Certainty occurs in intentional inference when a latent belief variable is sufficiently flexible to absorb all behavioral residuals, causing the posterior estimate of the agent's goal to become artificially sharp (high confidence) despite the underlying parameters being non-identifiable.

  **Why this term?**
  *   **Compensatory:** The belief compensates for the mismatch between the assumed goal and the observed action.
  *   **Certainty:** The distinctive feature is the *increase* in confidence, not just the ambiguity.

  ### 4. Boundary Cases: When Does Behavior Pin the Goal?

  You asked where this stops. It stops when the **Cost of the Belief** exceeds the **Cost of Changing the Goal**.

  In your current system, the "Belief" variable likely has a weak prior (e.g., "any belief is possible"). To fix this, you need a **Complexity Prior on Beliefs**.

  **The Boundary Condition:**
  Behavior pins down the Goal only when the Belief required to rationalize an alternative Goal is *more complex* (less probable a priori) than the Goal itself.

  *   **Case 1 (The Detour):**
      *   *Goal:* Go Home. *Belief:* Road Flooded. (Plausible belief).
      *   *Goal:* Wander. *Belief:* Road Clear. (Plausible goal).
      *   *Result:* Ambiguous. Compensatory Certainty applies.
  *   **Case 2 (The Wall):**
      *   *Action:* Agent walks directly into a wall.
      *   *Hypothesis A:* Goal = Hit Wall. Belief = Wall is solid. (Simple Goal, Simple Belief).
      *   *Hypothesis B:* Goal = Go Through. Belief = Wall is an Illusion. (Simple Goal, **Complex Belief**).
      *   *Result:* If your prior penalizes "Wall is an Illusion" heavily enough, the model must reject Hypothesis B. The Goal is now pinned to "Hit Wall" (or "Stop", etc.).

  **The Transformation Group:**
  You asked what behavior is pinned down *up to*.
  Behavior pins down the **Ratio of Goal-Utility to Belief-Complexity**.
  It does not pin down the Goal alone. It pins down the *joint* configuration.
  If you define a "Rationalization Cost" $C(G, B) = -\log P(G) - \log P(B) - \log P(Action | G, B)$, the system identifies the minimum $C$.
  Compensatory Certainty happens when $\frac{\partial C}{\partial B} \approx 0$ (Belief is "free").
  The boundary is where $\frac{\partial C}{\partial B} \gg 0$ (Belief is "expensive").

  ### 5. Reconstructing the Argument for Your Friend

  Here is the script for the next pizza argument:

  1.  **Agree on Quine-Duhem:** Acknowledge that yes, behavior underdetermines mind. Any action can be rationalized by tweaking beliefs.
  2.  **Introduce the Statistical Pathology:** Point out that standard underdetermination should yield *high uncertainty* (a flat posterior).
  3.  **Show the Data:** Your system yields *low uncertainty* (a sharp posterior).
  4.  **Name the Mechanism:** This is **Compensatory Certainty**. The belief variable acts as a **Nuisance Parameter** that is being optimized rather than marginalized.
  5.  **The Fix:** The solution isn't more data; it's a **Prior on Belief Complexity**. You cannot infer Goals without a constraint on how "weird" a Belief is allowed to be. This is the computational version of Davidson's **Principle of Charity** (maximize the rationality/agreement of the agent).
  6.  **The Symmetry:** Confirm her intuition that Goal and Belief are holistically linked, but insist that the *confidence* artifact is a specific engineering failure, not just a philosophical truth.

  **Summary for your notes:**
  *   **Phenomenon:** Compensatory Certainty.
  *   **Mechanism:** Overfitting on a degenerate manifold (Belief absorbs residual error).
  *   **Philosophical Root:** Quine-Duhem Thesis (Auxiliary hypotheses).
  *   **Statistical Root:** Non-Identifiability + Mode Collapse.
  *   **Boundary:** Defined by the Complexity Prior on Beliefs.
  *   **Solution:** Regularize the Belief space (Principle of Charity).

  This distinguishes your "Excuse Slot" from plain underdetermination: Underdetermination is about the *existence* of multiple solutions. Compensatory Certainty is about the *false elimination* of all but one solution due to model pathology.
