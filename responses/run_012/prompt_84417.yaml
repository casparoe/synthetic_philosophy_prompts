  Okay, I need an expert here — someone who really knows inverse reinforcement learning but also has read the philosophical stuff about interpreting what people want from what they do, because I just spent two hours arguing with my friend (she's in a philosophy PhD, I'm doing a robotics-adjacent masters and I've been building a system that watches a cook's demonstrations in a kitchen and tries to infer what they're going for) over bad pizza, and we went in circles. Please think carefully and, before you commit to an answer, start by brainstorming for yourself the handful of existing concepts that might already cover the thing I'm about to describe, then tell me which ones actually fit. I'm on a train with no signal, so please don't send me off to read anything or give me a reading list — I just want the ideas themselves, stated in enough detail that I can reconstruct the argument.

