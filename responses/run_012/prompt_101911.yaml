answer: |-
  This is a precise and high-leverage question. You are asking for the *axiomatic boundary conditions* of acausal decision theories (often grouped under Functional Decision Theory (FDT) or Updateless Decision Theory (UDT)), specifically focusing on the mechanism that allows an agent to treat logically correlated outputs as a single control variable.

  To clarify terminology: In classical game theory, "strategy-stealing" is a non-constructive existence proof (e.g., in Hex). In the context you're describing (Newcomb, symmetric Prisoner's Dilemma with copies), this is usually referred to as **acausal coordination via logical correlation**. I will use your term ("Strategy-Stealing Assumption" or SSA) but define it as: *The assumption that an agent can optimize its decision procedure by treating the outputs of sufficiently similar decision procedures as functionally dependent on its own choice.*

  Here are the desiderata for a formal theory incorporating SSA, categorized by their function, followed by the impossibility results that define the theory's limits.

  ---

  ### Part 1: The Desiderata

  These are the requirements a theory must meet to successfully operationalize SSA without collapsing into Causal Decision Theory (CDT), Evidential Decision Theory (EDT), or magical thinking.

  #### 1. The Symmetry Principle (Non-Negotiable)
  **Requirement:** If two agents instantiate the exact same decision algorithm and receive the exact same inputs (including source code and history), they must output the exact same action (or the exact same probability distribution over actions).
  **Case:** Identical Prisoner's Dilemma.
  **Why:** This is the definition of SSA. If the theory allows identical algorithms to diverge without an external causal cause, it denies the logical necessity that $f(x) = f(x)$. Without this, there is no "stealing," only hoping.

  #### 2. Acausal Leverage (Non-Negotiable)
  **Requirement:** The theory must prescribe actions that maximize utility in scenarios where outcomes depend on the *logical correlation* between agents, not just physical causation.
  **Case:** Prisoner's Dilemma with identical agents. CDT defects (Nash Eq); SSA must cooperate (Pareto optimal).
  **Why:** If the theory yields the Nash Equilibrium in symmetric dilemmas with identical agents, it has failed to capture the value of SSA. The whole point is to escape suboptimal equilibria by recognizing logical entanglement.

  #### 3. Causal Deflationism (Non-Negotiable)
  **Requirement:** The theory must explain the correlation without positing backward causation or superluminal physical influence.
  **Case:** Newcomb's Problem.
  **Why:** You cannot claim your choice *physically causes* the predictor's past action. You must claim that your choice and the prediction are both effects of a common cause (the decision algorithm's logical output). If the theory implies spooky action, it violates physicalism.

  #### 4. Continuity of Correlation (The "Fragility" Test)
  **Requirement:** The degree of coordination prescribed by the theory should scale smoothly with the degree of similarity between agents.
  **Case:** Two agents with identical source code, but Agent B has a single random bit flipped in its memory that doesn't affect the decision logic, or Agent B has a slightly different prior.
  **Why:** In the real world, perfect identity is impossible. If the theory works for 100% identical code but drops to 0% coordination for 99.999% identical code, it is mathematically brittle and practically useless. It must handle "near-identical" agents.

  #### 5. Mixed Strategy Synchronization (Technical Consistency)
  **Requirement:** If the optimal strategy involves randomization, the theory must account for how correlations are maintained across random draws.
  **Case:** A game where identical agents must randomize to keep an opponent indifferent, but need to correlate to avoid mutual destruction.
  **Why:** If I flip a coin to decide, and my copy flips a coin, do we get the same result?
  *   If we use independent physical coins, correlation breaks (SSA fails).
  *   If we use a logical pseudo-random generator seeded by source code, correlation holds.
  The theory must specify *which* randomization is permissible. It cannot simply say "randomize"; it must say "randomize using logically correlated seeds."

  #### 6. Asymmetric Information Handling (Robustness)
  **Requirement:** The theory must specify how to reason when the symmetry is broken by information sets.
  **Case:** Transparent Newcomb (you see the box is full) or one agent sees a card the other doesn't.
  **Why:** If I see the box is full, do I still one-box? If my copy doesn't see the box, does it still one-box? SSA implies we should act as a "team," but if I have information my copy doesn't, acting as a team might require me to ignore my local evidence. The theory must resolve the tension between *local evidence* and *global policy*.

  ---

  ### Part 2: The Impossibility Results (The Tensions)

  This is the critical section. You asked which requirements rule out the popular contenders. There is a fundamental tension between **Logical Discreteness** and **Physical Continuity**.

  #### The "Turing Trap" (Conflict between Desiderata 1 & 4)
  **The Conflict:** You cannot simultaneously satisfy **Symmetry Principle** (strict logical identity) and **Continuity of Correlation** (smooth degradation under asymmetry).
  **Why:** Logical correlation is binary. Two programs either compute the same function or they don't. There is no "0.9 same."
  *   If you base SSA on strict logical identity (to satisfy Desideratum 1), then changing one bit in the opponent's source code (e.g., a comment, or a tie-breaking variable) technically makes the functions distinct ($f \neq f'$). A strict logical theory must treat them as independent. Coordination drops from 100% to 0% instantly.
  *   If you base SSA on probabilistic similarity (to satisfy Desideratum 4), you collapse into Evidential Decision Theory (EDT). You are no longer "stealing" the strategy via logical necessity; you are just betting that you are similar. EDT is known to fail in certain variants (e.g., the "Smoking Lesion" or specific Newcomb variants where evidence is spurious).

  **The Verdict:** This is the hardest constraint. **Desideratum 4 (Continuity) is the one that breaks formal SSA.**
  Most formalizations (like early FDT) bite the bullet and accept discontinuity. They argue that *logical* identity is the only thing that grants acausal leverage, and physical similarity without logical identity is just correlation, not control. This makes SSA a "genuine constraint" only for digital agents with shared source code, and a "fragile heuristic" for humans or analog systems.

  #### The "Löb Obstacle" (Conflict between Desideratum 1 & Computational Boundedness)
  **The Conflict:** To satisfy the **Symmetry Principle**, an agent must know that its copy will do what it does. This requires the agent to prove statements about its own output.
  **Why:** By Gödel's Second Incompleteness Theorem and Löb's Theorem, a consistent formal system cannot prove its own consistency or necessarily determine its own output in all cases without risking inconsistency or infinite regress.
  **The Verdict:** A perfectly formal SSA requires **Logical Omniscience**. If you add a requirement for **Computational Tractability** (a preference, but a strong one), you cannot satisfy the Symmetry Principle in all cases. You have to rely on "modal fixed points" or approximations, which reintroduces uncertainty.

  #### The "Updateless Tension" (Conflict between Desideratum 3 & 6)
  **The Conflict:** **Causal Deflationism** vs. **Asymmetric Information**.
  **Why:** In Transparent Newcomb, if you see the box is full, standard causal reasoning says "take both." SSA (via Updatelessness) says "you should have precommitted to one-boxing before you saw the box."
  To maintain coordination with your copy (who might not see the box), you must ignore your current information. This looks like irrationality from a local perspective.
  **The Verdict:** To satisfy SSA, you must satisfy **Updatelessness**. If you require a theory to be **Dynamically Consistent** (always maximize utility given *current* information), you cannot satisfy SSA in Transparent Newcomb cases. You have to choose: do you optimize the *policy* (SSA) or the *action* (CDT/EDT)?

  ---

  ### Part 3: Which Requirements Do the Real Work?

  If you are trying to determine whether SSA is a genuine constraint or a heuristic, look at these two requirements:

  1.  **Logical Identity vs. Physical Similarity (The Continuity Requirement):**
      *   If you insist that SSA only applies to **logically identical** agents (same source code), it is a **genuine constraint**. It is mathematically sound within that domain (digital copies).
      *   If you insist that SSA must apply to **physically similar** agents (humans, slightly different code), it becomes a **heuristic**. There is no formal bridge that allows you to "steal" a strategy from an agent that is merely *probably* similar to you without collapsing into EDT.
      *   *The Dealbreaker:* **Continuity of Correlation.** No existing theory successfully gradients logical correlation. It is a cliff.

  2.  **Updatelessness:**
      *   SSA *requires* updatelessness. If you update on information that is logically correlated with your decision (like the Predictor's guess in Newcomb's), you break the link that allows you to "steal" the strategy.
      *   *The Dealbreaker:* **Dynamic Consistency.** If you demand that an agent always act optimally given its *current* knowledge state, SSA is impossible. SSA requires acting optimally given your *prior* knowledge state (the policy).

  ### Part 4: Brief Scorecard of Contenders

  *   **Causal Decision Theory (CDT):** Fails **Acausal Leverage**. Treats other agents as fixed environment. Good on **Causal Deflationism** and **Continuity** (because it assumes no correlation).
  *   **Evidential Decision Theory (EDT):** Satisfies **Continuity** (handles probabilistic similarity) but fails **Causal Deflationism** (confuses correlation with causation, leading to "Smoking Lesion" errors). It doesn't "steal" strategy; it bets on correlation.
  *   **Functional Decision Theory (FDT) / UDT:** Satisfies **Symmetry**, **Acausal Leverage**, and **Causal Deflationism** (by positing logical causation).
      *   *Failure Point:* **Continuity of Correlation.** FDT struggles to define "similarity" between algorithms. It works perfectly for copies, but has no formal metric for "99% similar." It also requires **Logical Omniscience** to find the fixed points, which is computationally impossible for bounded agents.

  ### Summary Conclusion

  You suspected there was more to it than superrationality. You are right. Superrationality is the *intuition*; SSA is the *mechanism*.

  The theory stands or falls on **Continuity of Correlation**.
  *   If you accept that logical correlation is binary (a cliff), SSA is a **genuine constraint** for digital agents sharing source code. It is not magic; it is logic.
  *   If you require the theory to work for agents that are merely similar (humans, noisy channels), SSA **falls apart**. There is no formal way to "steal" a strategy from an agent that isn't logically you, without resorting to evidential reasoning which has its own pathologies.

  **The Non-Negotiable Core:**
  1.  **Symmetry Principle** (Logic is logic).
  2.  **Updatelessness** (Optimize the policy, not the act).
  3.  **Causal Deflationism** (No spooky physics).

  **The Preference that Breaks It:**
  *   **Continuity/Robustness to Noise.** This is the requirement that most proponents wish they could meet but can't. If you drop this, SSA is coherent but fragile. If you keep this, SSA dissolves into EDT.

  Your friend is half-right: it is superrationality formalized. But the formalization reveals that the "rationality" is bounded by the limits of logical identity. It is not a universal law of rational choice; it is a specific property of systems that share computational structure.
