  # Scoring Key

  Find the profile below that matches most of your answers. Most people will match one profile strongly, with a few outliers.

  ### 1. The Regime View
  **Signature:** Q1: **B** | Q2: **A**
  **Philosophy:** Bet sizing depends on the horizon. In a one-off situation, you maximize expected value (bet everything). In repeated multiplicative situations, you maximize growth (bet Kelly). You believe the math changes because the opportunity to rebet changes the risk profile.

  ### 2. The Log Utility Purist
  **Signature:** Q1: **A** | Q2: **A** | Q6: **B**
  **Philosophy:** Kelly is just expected utility maximization with logarithmic utility. You have a consistent risk aversion regardless of the time horizon. Even on the last bet of your life, you don't bet everything because the utility of money diminishes.

  ### 3. The Objective Growth Camp (Growth-Rate Normative)
  **Signature:** Q1: **A** | Q2: **A** | Q8: **B**
  **Philosophy:** Maximizing the geometric growth rate is the normative right thing to do, period. Even in the "Multiverse" (Q8), you believe each copy should act to preserve its own growth trajectory rather than sacrificing some copies to boost the group average.

  ### 4. The Ergodicity Economist
  **Signature:** Q2: **A** | Q8: **A**
  **Philosophy:** You distinguish between time averages and ensemble averages. For a single person over time (Q2), you maximize growth (Kelly). For a group of copies (Q8), you maximize the sum (Expected Value). You believe the "Kelly rule" applies to time, not to groups.

  ### 5. The Survival-First
  **Signature:** Q2: **C** | Q3: **B** | Q4: **B**
  **Philosophy:** The primary rule is to avoid the absorbing state (ruin). You are willing to sacrifice significant upside to ensure you stay in the game. In the "Shortfall" scenario (Q4), you might even accept the bad outcome rather than risk a 50% chance of making it worse.

  ### 6. The Fractional Kelly
  **Signature:** Q5: **A**
  **Philosophy:** You believe the Kelly criterion is correct in theory, but in practice, your probabilities are noisy. You intentionally under-bet (e.g., half-Kelly) to account for estimation error. You treat probability as a estimate that needs a margin of safety.

  ### 7. The Ambiguity Skeptic
  **Signature:** Q5: **B**
  **Philosophy:** You don't trust the probabilities at all. If you can't know the bias with certainty, the optimization is fiction. You prefer to wait for data or avoid the bet entirely rather than optimize based on a guess.

  ### 8. The Deflationary Realist
  **Signature:** Q7: **A**
  **Philosophy:** You think bet sizing isn't a deep decision-theory question; it's about incentives and contracts. In Q7, you bet 100% because the contract rewards upside without punishing downside. You adjust your size based on who bears the risk, not just the math of the coin.

