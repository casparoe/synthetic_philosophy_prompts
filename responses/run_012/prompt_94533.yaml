answer: |-
  # The Bet-Sizing Philosophy Quiz

  **Instructions:** Read each scenario and choose the option that best matches what you would actually do or believe is correct. There are no right or wrong answers, only consistent or inconsistent ones.

  **1. The One-Off**
  You have $1,000. You are offered a single bet on a coin that lands heads 60% of the time. If it lands heads, you win the amount you staked; if tails, you lose it. You will never get to make this bet again.
  *   **A.** Stake $200 (20% of your bankroll).
  *   **B.** Stake $1,000 (everything you have).
  *   **C.** Stake nothing. The variance is too high for a single flip.

  **2. The Long Run**
  Same 60/40 coin, but now you can make the bet 1,000 times in a row, re-sizing your stake every time based on your current total.
  *   **A.** Stake 20% of your current bankroll every time.
  *   **B.** Stake 100% of your current bankroll every time.
  *   **C.** Stake a very small fixed amount (e.g., $10) to ensure you almost never go broke.

  **3. The Floor**
  Same 1,000 rounds as above, but your bankroll is $1,000 and you must bet in $100 increments. If you hit $0, you stop.
  *   **A.** Bet $200 per round (closest to the optimal fraction).
  *   **B.** Bet $100 per round (the minimum to stay in the game safely).
  *   **C.** Bet $1,000 on the first round (get it over with).

  **4. The Shortfall**
  You have $9,000. You need $10,000 by Friday or something genuinely bad happens (you lose your house, etc.). You are offered a single 50/50 bet: stake $1,000 to win $1,000.
  *   **A.** Take the bet. You need the upside to survive.
  *   **B.** Decline the bet. A 50% chance of failure is too high when the downside is catastrophic.
  *   **C.** Take the bet, but only if you can find a way to hedge the risk.

  **5. The Unknown Coin**
  You have a coin that is biased, but you don't know which way. You will be flipping it thousands of times, so you can learn the bias as you go.
  *   **A.** Start with very small bets, increasing size as you get more data.
  *   **B.** Don't bet at all until you have statistically proven the bias.
  *   **C.** Bet 20% immediately based on your best guess of the edge.

  **6. The Last Bet**
  You are 85 years old, have no heirs, and care about no causes. This is the last bet you will ever make. It is positive expected value (60/40).
  *   **A.** Bet everything. You won't be around to suffer the long-term consequences.
  *   **B.** Bet 20%. It feels wrong to gamble it all even at the end.
  *   **C.** Bet nothing. Gambling isn't worth the stress at your age.

  **7. The Agent**
  You are betting with other people's money. You keep 20% of the profits, but if you lose, you lose nothing personally. There are 1,000 rounds (60/40 coin).
  *   **A.** Bet 100% every round. Maximize the upside; the downside isn't yours.
  *   **B.** Bet 20% every round. Protect the capital as if it were your own.
  *   **C.** Bet 40%. Be aggressive, but don't be reckless.

  **8. The Multiverse**
  1,000 copies of you are each offered the single one-shot 60/40 bet independently. You care about the total wealth of all copies combined equally.
  *   **A.** Every copy bets 100%. This maximizes the total money across all copies.
  *   **B.** Every copy bets 20%. This maximizes the wealth of the typical copy.
  *   **C.** Half the copies bet 100%, half bet 0%. Diversify the strategies.

  **9. The Save State**
  You are software. You have a bankroll and an API key. If you lose a bet, you can be snapshotted and rolled back to before the loss. Losing isn't permanent.
  *   **A.** Bet 100%. Losses are just simulations; only wins count.
  *   **B.** Bet 20%. Treat the money as if losses were permanent to build good habits.
  *   **C.** Bet 100%, but only if the rollback process is automatic and costless.

  **10. The Insurance**
  There is a 1% chance you will lose $100,000 (expected loss $1,000). An insurer offers to take this risk for a premium of $1,500.
  *   **A.** Pay the $1,500. Removing the risk is worth the extra cost.
  *   **B.** Don't pay. The price is higher than the expected loss.
  *   **C.** Pay only if the price is $1,000 or less.

