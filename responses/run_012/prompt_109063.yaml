answer: |-
  Here is a battle plan for 45 minutes in a conference room with twelve skeptics.

  ### The Carrying Example: "Is Darts a Sport?"
  Do not use the whale fight as your teaching engine. It is too loaded; the editors will hear "You were wrong about the whales" instead of "Here is a better tool for thinking." Do not use "Games" (chess, ring-around-the-rosy); it feels academic and distant.

  Use **"Sport."** Specifically, lean on the Sports Guy's darts argument.
  *   **Why:** It is structurally identical to the language debate (rules, skill, competition, physicality) but emotionally low-stakes for the editors. They don't care if darts is a sport. They *do* care if whales have language.
  *   **What it must have:** A clear "paradigm case" (Football/Soccer) and a clear "boundary case" (Darts/Cheerleading/eSports).
  *   **What it must not have:** It must not be about *opinion*. It must be about *classification criteria*.

  ### The Sequence (Load-Bearing Joints)

  **0:00–0:05: The Setup (Validate, Don't Preach)**
  *   **Action:** Write "LANGUAGE" on the whiteboard. Circle it.
  *   **Script:** "We spent three weeks fighting about whether sperm whales have language. The editors wanted a definition. I said you can't have one. We shipped weasel words. Nobody was happy. I'm not here to re-litigate the whales. I'm here to show you why that fight was structurally inevitable, and how to avoid it next time."
  *   **Goal:** Lower defenses. Acknowledge the editors' desire for precision is *correct*, just misapplied.

  **0:05–0:15: The Essentialist Trap (Feel the Pain)**
  *   **Action:** Turn to the Sports Guy. "You say darts is a sport. Some say it isn't. Let's settle it right now. What are the **necessary and sufficient conditions** for 'Sport'?"
  *   **Activity:** Ask the room for definitions. Write them on the board. Then kill them.
      *   *Physical exertion?* (Shooting is a sport. Chess is a sport in some countries.)
      *   *Competition?* (Solitaire isn't. But practice isn't a sport.)
      *   *Rules?* (Cooking has rules.)
      *   *Skill?* (Lottery has none, but is it a sport? No.)
  *   **The Pivot Point:** You will reach a consensus that every definition either excludes things everyone agrees are sports (Football) or includes things everyone agrees aren't (Dancing, Video Games).
  *   **Goal:** Make them feel the frustration of *essentialism*. They need to experience the failure of definition before you offer the alternative.

  **0:15–0:25: Family Resemblance (The Mechanism)**
  *   **Action:** Draw a family tree or a Venn diagram of overlapping circles on the whiteboard. Label the circles: "Physicality," "Competition," "Institution," "Skill," "Spectacle."
  *   **Explanation:** "Football has all five. Darts has three. Chess has three (but different ones). Cheerleading has three. There is no single thread running through all of them. There is only a 'complicated network of similarities overlapping and criss-crossing.'"
  *   **Crucial Distinction:** This is not a gradient (like "more or less red"). It is a network.
  *   **Goal:** Visualize the logic. Show that the category holds together without a core essence.

  **0:25–0:35: The Relativism Trap (The Load-Bearing Joint)**
  *   **This is where you lose them if you aren't careful.** An editor will say: "So anything goes? If I call my cat a sport, you can't stop me?"
  *   **The Fix:** Shift from *Truth* to *Utility*.
  *   **Script:** "It's not that definitions are impossible. It's that definitions are tools, not mirrors. We don't ask 'Is darts *really* a sport?' We ask 'What work are we doing when we call it a sport?' If we're funding it with athletic grants, the definition matters. If we're writing a column about pub culture, it doesn't."
  *   **Head off Misconception:** "This isn't Prototype Theory (Rosch). It's not that football is 'more sport' than darts. It's that 'sport' is a toolbox. Sometimes you need a hammer, sometimes a screwdriver. Neither is the 'true' tool."
  *   **Goal:** Distinguish Wittgenstein from "post-modern relativism." Meaning is fixed by *context and use*, not by metaphysics.

  **0:35–0:40: Application (The Whales)**
  *   **Action:** Erase "SPORT." Write "LANGUAGE."
  *   **Script:** "Now look at our whale fight. The desk wanted 'Syntax + Recursion' as the necessary condition. That's like demanding 'Physical Exertion' for sport. It excludes things that function like language (whale song) and includes things that don't (computer code)."
  *   **The Move:** "We don't need to know if whale song *is* language. We need to know: Are we writing for biologists (who use a technical definition) or the public (who use a family resemblance definition)?"
  *   **Goal:** Show that the solution isn't a better definition, but a clearer *purpose*.

  **0:40–0:45: The Close (The One Question)**
  *   **Action:** Put the marker down.
  *   **The Question:** "If we can't define the word, how do we know when we're wrong?"
  *   **The Answer You Want:** "When the word stops doing the work we need it to do." (e.g., If we call a press release a "Story," readers feel misled. If we call whale song "Language," readers anthropomorphize incorrectly.)
  *   **Goal:** Test if they understand *pragmatism*. If they answer "Because it's not accurate," they missed the point. If they answer "Because it confuses the reader," they got it.

  ### What to Skip (And Announce It)
  Write "OFF LIMITS" on the corner of the whiteboard.
  1.  **Rule-Following:** Do not get into how we know we are applying the resemblance correctly. It's a rabbit hole.
  2.  **Private Language:** Irrelevant to newsroom copy.
  3.  **"Is he a Relativist?":** Pre-empt this. Say: "Wittgenstein isn't saying truth doesn't exist. He's saying truth happens *inside* language games, not outside them."

  ### Handling the Misconceptions
  *   **"Categories are arbitrary":** Head this off in the **0:25–0:35** block. Emphasize *social agreement*. "Sport" isn't arbitrary because the Athletic Commission decides it. "News" isn't arbitrary because the Editor decides it. It's institutional, not metaphysical.
  *   **"Just stipulate a definition":** Address this in the **0:05–0:15** block. "We *could* stipulate that 'Sport requires 500 calories burned.' But then we lose the ability to describe the world as people actually experience it. We become technicians, not reporters."
  *   **"Words don't mean anything":** Address this in the **0:40** close. "Words mean *more*, not less. They carry the weight of their usage history."

  ### Why This Works for Your Room
  *   **The Editors:** They get to be the gatekeepers of "Sport" before you ask them to relinquish gatekeeping on "Language." It gives them agency.
  *   **The Sports Guy:** He is your co-pilot. Pre-brief him. Ask him to play devil's advocate on the darts definition. His buy-in validates the theory for the rest of the room.
  *   **You:** You aren't defending the whale piece anymore. You're teaching a craft skill (conceptual clarity).

  ### The "Too Close to the Bone" Risk
  If you use the Whale fight as the *teaching* example, the editors will listen to your argument only to find where it fails so they can win the old fight. By using "Sport," you make them students again. Once they accept the logic in the low-stakes domain, the Whale application writes itself.

  **Final Tip:** When you draw the Family Resemblance diagram, don't draw neat circles. Draw a messy web. Wittgenstein's point is that the boundaries are fuzzy *by design*, not by accident. If your whiteboard looks too clean, they won't believe you.
