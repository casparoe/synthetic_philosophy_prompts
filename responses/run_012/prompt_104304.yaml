  So I just burned two hours arguing with my mate about whether approval-directed agents are really safer than goal-directed ones, and we kept talking past each other, so I want a clean case instead of more hand-waving. Build me a thought experiment where an approval-directed agent does the harmful thing and a plain goal-directed agent with the same resources and the same starting situation doesn't — the opposite of the usual "approval is safer" story. Constraints: realistic, no superintelligence, no exotic physics, the whole thing in one paragraph, and the bad outcome can't come from the human approver being dumb, corrupt, or having bad taste — it has to fall out of the structure of "maximize the approval of this evaluator" as a training signal. I don't want you to just stipulate the ending, the setup has to generate it. After the scenario, walk through what each agent does and why, tell me which single feature of the case is doing the work, what happens if I remove that feature, and what a defender of approval-direction would say to block it. Also spell out what would count as the case failing, because I have a suspicion it's easy to cheat here.
