prompt: |-
  So I've been going through William James's Principles of Psychology (1890, vol 1) for a post I'm drafting, and I've hit a wall in the preface of all places. Here's the passage:

  "All attempts to explain our phenomenally given thoughts as products of deeper-lying entities (whether the latter be named 'Soul,' 'Transcendental Ego,' 'Ideas,' or 'Elementary Units of Consciousness') are metaphysical. This book consequently rejects both the associationist and the spiritualist theories; and in this strictly positivistic point of view consists the only feature of it for which I feel tempted to claim originality."

  I get the general vibe — psychology should just corrolate thoughts with brain states and not try to explain them by reference to deeper entities. But I'm confused about a few things. First, what exactly counts as a "deeper-lying entity" here, and why does he lump "Elementary Units of Consciousness" (which sounds like the panpsychist's basic experiential bits) together with "Soul" and "Transcendental Ego"? Those seem like very different kinds of posits. Second, he says he rejects "both the associationist and the spiritualist theories" — but I thought the whole point of his later chapter on the mind-stuff theory (chapter 6, I think?) is to argue that you can't get a unified consciousness by combining elementary units of consciousness. Isn't that a rejection of associationism too, just for different reasons? And is that the chapter where he does the thing with the twelve men each holding one word of a sentence, nobody having the thought of the whole sentence? I remember something like that but I might be mangleing it.

  The reason I care: I've been reading a lot about panpsychism and the combination problem lately, and it seems like James is basically an early formulator of the combination problem — the worry that you can't get one unified subject of experience by adding up a bunch of tiny subjects. But then in the preface he seems to dismiss the whole question as "metaphysical" and not psychology's business. So is he (a) saying the combination problem is real but not psychology's problem, (b) saying it's not a real problem because the whole framing is confused, or (c) something else?

  Can you walk me through what James is actually doing in this passage, how it connects (or doesn't) to the mind-stuff/combination stuff, and whether his "positivistic" stance is a principled position or just a methodological dodge? Please answer in American English. Also if I'm wrong about the twelve-men thing, correct me — I don't need citations or reading lists, just tell me what the actual argument is.
