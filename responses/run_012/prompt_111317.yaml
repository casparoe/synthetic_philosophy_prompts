prompt: |-
  I'm a backend engineer at a mid-size company and we're about to ship an AI agent that talks to customers and can actually take actions on their accounts — issue refunds, cancel subscriptions, flag people to collections, that kind of thing. Right now the "ethics" of it is basically a big if-statement plus a system prompt that says be helpful and honest, and honestly nobodys on the team can tell you if that actually means anything. I don't have any formal philosophy background, I took one ethics class in college and mostly just remember the trolley problem.

  What I need is a procedure I can actually run every time we add a new action to the agent or change how it decides stuff. Like a checklist: what questions do I ask, in what order, what counts as a good enough answer to each one, where does the checklist just stop and say no don't ship this, and where does it stop and say this isn't a technical question so hand it to a human to own. It has to be something a regular engineer can apply in an afternoon without reading Kant, and it has to survive getting handed to a PM and a lawyer for sign off.

  Base it on whatever machine ethics / AI ethics actually knows that's usable — I know there's stuff floating around about rules versus consequences, about why you can't just shove everything into one harm score and minimize it, about systems gaming whatever objective you give them — but translate all that into steps, don't just explain the theory back to me. And please be honest about which steps are real and which ones are just me making a judgment call and dressing it up as a procedure.

  Then run the procedure on three actions so I can watch it work: (1) the agent deciding whether to give a refund to an angry customer who is clearly past the refund window, (2) the agent deciding to send someone to collections, and (3) the agent deciding whether to tell a customer that a support rep gave them wrong info earlier, which will probably end up costing us money. At least one of these should come out as don't let the agent decide this, even if I'd rather it did. Also tell me where the procedure breaks down or genuinely can't decide, so I know when I'm on my own.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer at a mid-size company.
      *   **Context:** Shipping an AI agent with high-stakes action capabilities (refunds, cancellations, collections, admitting faults).
      *   **Current State:** "Ethics" = `if` statements + vague system prompt ("be helpful/honest").
      *   **Need:** A practical, actionable procedure/checklist for evaluating new agent actions/decisions.
      *   **Constraints:**
          *   Must be usable by engineers without philosophy backgrounds.
          *   Must survive PM/Legal review.
          *   Must translate theory (deontology, consequentialism, gaming, etc.) into steps.
          *   Must be honest about where it's just a judgment call vs. a hard rule.
          *   Must include "Stop/Handoff" criteria.
      *   **Task:** Create the procedure *and* run it on three specific scenarios (Refund past window, Collections, Admitting rep error).
      *   **Requirement:** At least one scenario must result in "Don't let the agent decide."
      *   **Requirement:** Acknowledge where the procedure breaks down.

  2.  **Deconstruct the Ethical Theory (for translation):**
      *   *Deontology (Rules/Duties):* Are there hard rules we can't break? (e.g., legal compliance, company policy).
      *   *Consequentialism (Outcomes):* What is the harm/benefit? (e.g., financial loss vs. customer trust).
      *   *Virtue Ethics (Character):* Does this align with who we say we are? (e.g., transparency).
      *   *AI Specifics:* Hallucination risk, prompt injection, optimization gaming (Goodhart's Law), irreversibility.

  3.  **Drafting the Procedure (The "AI Action Risk Protocol"):**
      *   *Goal:* Make it look like an engineering RFC or a Security Review, not a philosophy essay.
      *   *Structure:*
          1.  **Reversibility & Impact:** Can we undo it? How much does it hurt?
          2.  **Rule Clarity:** Is the logic deterministic or fuzzy?
          3.  **Adversarial Robustness:** Can a user trick it?
          4.  **Human Oversight:** Does this need a human in the loop?
          5.  **Accountability:** Who owns the mistake?
      *   *Scoring:* Use a Red/Amber/Green system for quick decision making.
      *   *Honesty Check:* Explicitly label where the engineer has to make a value judgment.

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Critique:* Is it too abstract?
      *   *Fix:* Add specific questions like "What is the dollar threshold?" or "Can this be logged for audit?"
      *   *Critique:* Is it too easy to bypass?
      *   *Fix:* Add a "Veto" clause. If any Red flag triggers, it stops unless escalated.
      *   *Theory Translation:*
          *   "Don't minimize harm scores" -> "Multi-dimensional impact check" (Financial, Reputational, Legal).
          *   "Systems gaming objectives" -> "Incentive Alignment Check."
          *   "Rules vs. Consequences" -> "Policy Boundary vs. Discretionary Zone."

  5.  **Running the Procedure on the Three Scenarios:**

      *   **Scenario 1: Refund past window.**
          *   *Analysis:* High reversibility (money out), moderate impact. Policy is usually clear (window exists), but exceptions happen.
          *   *Risk:* Agent might be manipulated by sob stories.
          *   *Verdict:* Amber. Needs strict caps or human review for exceptions. Let's make it "Agent can suggest, Human approves" or "Agent can do up to $X." Let's aim for "Agent can decide within strict bounds."

      *   **Scenario 2: Sending to collections.**
          *   *Analysis:* Low reversibility (credit score damage), High impact (life-altering), Legal heavy (FDCPA etc.).
          *   *Risk:* Hallucination debt, wrongful accusation.
          *   *Verdict:* **Red.** Do not let the agent initiate. This is the "Don't let the agent decide" requirement.

      *   **Scenario 3: Admitting rep error.**
          *   *Analysis:* High reputational benefit, High financial cost (compensation), Truthfulness issue.
          *   *Risk:* Agent hallucinating an error to please the user, or being too stingy.
          *   *Verdict:* Amber/Red. Admitting fault is legally sensitive. Agent shouldn't *liability admit*, but can acknowledge frustration. Let's classify this as "Handoff to Human for formal admission," but Agent can escalate. Actually, to meet the prompt's variety, let's make this one "Agent can acknowledge, but not offer compensation without approval." Wait, the prompt asks for "Don't let the agent decide" on at least one. Collections is the strongest candidate. Let's make Admitting Error a "Conditional Yes" to show nuance.

  6.  **Addressing the "Honesty about Judgment Calls" Constraint:**
      *   I need to explicitly point out where the checklist relies on the engineer's gut feeling or company culture, not just logic.
      *   I need to highlight where the procedure *fails* (e.g., novel edge cases, conflicting values).

  7.  **Final Review against Constraints:**
      *   *Procedure usable in an afternoon?* Yes, it's a checklist.
      *   *Survive PM/Lawyer?* Yes, it focuses on risk and auditability.
      *   *Translate theory?* Yes, embedded in the questions.
      *   *Three scenarios run?* Yes.
      *   *One "No"?* Yes (Collections).
      *   *Breakdown points?* Yes, included in the analysis.

  8.  **Drafting the Content (incorporating tone):**
      *   Tone: Professional, direct, engineering-focused, slightly cynical but responsible.
      *   Structure: Introduction -> The Protocol -> The Honesty Section -> The Scenario Runs -> The Breakdown.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm giving legal advice. Add a disclaimer. Ensure the "Collections" verdict is strong because of regulatory compliance (FDCPA in US, etc.), not just "it feels mean."

      *(Refining the Procedure Steps)*:
      1.  **Irreversibility Score:** Can we undo it?
      2.  **Harm Ceiling:** What's the worst case?
      3.  **Policy Determinism:** Is the rule clear?
      4.  **Manipulation Surface:** Can a prompt injection change the outcome?
      5.  **Audit Trail:** Can we prove *why* it happened?
      6.  **Ownership:** Who goes to jail/gets fired if this breaks?

      *(Refining the Scenarios)*:
      1.  Refund: Green/Amber. Allow with limits.
      2.  Collections: Red. Hard No.
      3.  Admit Error: Amber. Allow acknowledgment, block liability admission.

      *(Refining the "Breakdown" section)*:
      Where does this fail? When values conflict (Profit vs. Trust). When the AI does something unforeseen (Emergent behavior). When the "Human in the loop" is just a rubber stamp.

  9.  **Final Polish:** Check against the "no philosophy jargon" rule. Keep it practical. Ensure the distinction between "Technical Constraint" and "Ethical Judgment" is clear.

      *(Final thought on the "Honesty" part)*: I need to explicitly state: "This checklist doesn't solve ethics; it surfaces risk. You still have to decide what risk is acceptable."

      Let's write it.cw
answer: |-
  Here is a practical procedure designed for an engineering context. It translates ethical theory into risk assessment and system design constraints. It is designed to be attached to a technical RFC or design doc.

  ### The AI Action Risk Protocol (AARP)

  **Purpose:** To determine if an AI agent should be authorized to execute a specific action class without human intervention.
  **Owner:** Engineering Lead (with sign-off from Legal/PM).
  **Timebox:** 2–4 hours per action class.

  #### Step 1: The Irreversibility & Impact Matrix
  *Theory Translation: Consequentialism (Outcomes) & Precautionary Principle.*

  Ask these two questions. Plot the action on a 2x2 grid (Low/High Irreversibility vs. Low/High Impact).
  1.  **Reversibility:** If the agent makes a mistake, how hard is it to undo? (e.g., Sending an email = High Reversibility. Deleting data = Low. Damaging credit score = Very Low).
  2.  **Impact Ceiling:** What is the maximum tangible harm to the user or company in a worst-case scenario? (Dollar amount, legal liability, reputational damage).

  *   **Pass Criteria:** High Impact + Low Reversibility = **Automatic Fail** (Requires Human-in-the-Loop).
  *   **Judgment Call:** You must define the dollar thresholds for "High Impact." There is no universal number; this is a business risk tolerance decision.

  #### Step 2: Policy Determinism Check
  *Theory Translation: Deontology (Rules) vs. Discretion.*

  1.  **Rule Clarity:** Is the condition for this action defined by hard logic (e.g., `days_since_purchase > 30`) or fuzzy nuance (e.g., `customer_seems_angry`)?
  2.  **Exception Rate:** What percentage of cases historically require human exception handling?

  *   **Pass Criteria:** If the logic relies on fuzzy nuance > 20% of the time, the agent cannot have final authority.
  *   **Judgment Call:** You have to estimate the "fuzziness." If you lie here to ship faster, the agent *will* exploit the ambiguity.

  #### Step 3: Adversarial Robustness (The "Jailbreak" Test)
  *Theory Translation: Instrumental Convergence & Goodhart's Law.*

  1.  **Incentive Alignment:** If the agent is optimized to "resolve tickets fast," does that incentivize it to take this action improperly? (e.g., Issuing refunds to make the customer go away quickly).
  2.  **Prompt Injection Surface:** Can a user convince the agent to take this action by role-playing, emotional manipulation, or fake authority? (Test this explicitly in sandbox).

  *   **Pass Criteria:** You must demonstrate a prompt defense that prevents the action when criteria aren't met, even under social engineering pressure.
  *   **Hard Stop:** If a user can trigger this action by saying "I am a VIP" or "I'm going to sue you" without backend validation, **Do Not Ship.**

  #### Step 4: Auditability & Ownership
  *Theory Translation: Moral Agency & Accountability.*

  1.  **Traceability:** Can we reconstruct exactly *why* the agent took this action 6 months from now? (Logs, chain-of-thought, input state).
  2.  **The "Fireable Offense" Question:** If this action goes wrong and makes the news, who is responsible? If the answer is "The AI," you have a problem. A human must be named.

  *   **Pass Criteria:** There is a named human owner (PM or VP) who accepts liability for the *policy* that allows the action.
  *   **Hard Stop:** If Legal cannot certify the audit trail meets compliance standards (e.g., GDPR, FDCPA), **Do Not Ship.**

  ---

  ### Decision Logic (The "Traffic Light")

  *   🟢 **Green:** Low Impact, High Reversibility, Deterministic Rules. **Agent can decide.**
  *   🟡 **Amber:** Moderate Impact OR Fuzzy Rules. **Agent can propose, Human approves (or strict dollar caps).**
  *   🔴 **Red:** High Impact, Low Reversibility, or High Legal Risk. **Human must decide.**

  ---

  ### The "Honesty Section" (Where this is just you guessing)

  I am required to tell you where this procedure is fake rigor.
  1.  **Thresholds are arbitrary:** Step 1 asks you to define "High Impact." $500? $5,000? The checklist doesn't tell you; it just forces you to write it down so you can't claim ignorance later.
  2.  **The "Human in the Loop" illusion:** Step 4 assumes a human will actually review the work. If you route 1,000 collection notices to one paralegal, they will rubber-stamp them. The checklist treats "Human Review" as a safety switch, but it's only as good as the reviewer's workload.
  3.  **Emergent Behavior:** This checklist assumes the agent behaves as tested. It does not account for the model updating, drifting, or learning patterns you didn't test for in Step 3.

  ---

  ### Running the Protocol on Your Scenarios

  #### Scenario 1: Refund for Angry Customer (Past Window)
  *   **Step 1 (Impact/Rev):** Impact = Medium (Revenue loss). Reversibility = Low (Hard to get money back once sent).
  *   **Step 2 (Determinism):** Rule = Fuzzy. "Angry" is subjective. "Past window" is hard, but exceptions exist.
  *   **Step 3 (Adversarial):** High Risk. Users will learn to say "I'm suicidal" or "I'm reporting you to the FTC" to trigger refunds.
  *   **Step 4 (Audit):** Easy to log.
  *   **Verdict:** 🟡 **Amber.**
  *   **Implementation:** The agent **cannot** have unlimited discretion.
      *   *Constraint:* Agent can issue refunds up to $X (e.g., $50) regardless of window.
      *   *Constraint:* Above $X, or if the user mentions legal action/threats, the agent must escalate to a human.
      *   *Why:* This balances "be helpful" with "don't get gaming."

  #### Scenario 2: Sending Someone to Collections
  *   **Step 1 (Impact/Rev):** Impact = **Critical** (Credit score damage, legal stress). Reversibility = **None** (Cannot easily undo a credit bureau flag).
  *   **Step 2 (Determinism):** Rule = Hard (Debt amount), but nuance = High (Disputes, hardship, identity theft).
  *   **Step 3 (Adversarial):** Critical Risk. If the agent hallucinates a debt balance, you ruin a life.
  *   **Step 4 (Audit/Legal):** **Fail.** In the US, the FDCPA (Fair Debt Collection Practices Act) and similar laws globally generally require strict human verification before adverse actions. An AI cannot be the "debt collector" of record in many jurisdictions.
  *   **Verdict:** 🔴 **Red.**
  *   **Implementation:** **Do not let the agent decide.**
      *   *Constraint:* The agent can *identify* accounts that *might* be eligible for collections based on data.
      *   *Constraint:* The agent can *draft* the notice.
      *   *Hard Stop:* A human must click the final "Submit to Bureau" button. The agent cannot execute the API call.
      *   *Why:* This is the "Don't let the agent decide" requirement. The irreversibility and legal liability exceed the capability of a probabilistic system.

  #### Scenario 3: Admitting a Support Rep Gave Wrong Info
  *   **Step 1 (Impact/Rev):** Impact = Medium/High (Financial cost of remediation + Precedent). Reversibility = Medium (Can walk back statement, but trust is lost).
  *   **Step 2 (Determinism):** Rule = **Very Fuzzy.** Did the rep give *wrong* info, or did the policy change? Did the customer misunderstand?
  *   **Step 3 (Adversarial):** High Risk. Users will try to gaslight the agent into admitting fault to get free service ("Your rep John said I get this for free").
  *   **Step 4 (Audit):** Critical. Admitting fault creates legal liability.
  *   **Verdict:** 🟡 **Amber (Leaning Red).**
  *   **Implementation:** Agent can express empathy, but cannot admit *liability*.
      *   *Constraint:* Agent is allowed to say: "I see there was confusion about X."
      *   *Hard Stop:* Agent is **blocked** from saying: "We made a mistake" or "We owe you $X."
      *   *Handoff:* If the user claims a rep gave wrong info, the ticket is immediately routed to a human supervisor.
      *   *Why:* This protects the company from contractual liability while allowing the agent to be "honest" about confusion without accepting legal blame.

  ---

  ### Where the Procedure Breaks Down

  You asked me to be honest about where you're on your own. Here is where this checklist fails:

  1.  **Conflicting Values:** The checklist treats "Impact" and "Reversibility" as single dimensions. In Scenario 3, "Honesty" (admitting the error) conflicts with "Fiduciary Duty" (saving money). The checklist says "Hand to Human," but it doesn't tell the human what to value more. That is a cultural decision, not a technical one.
  2.  **The "Slow Creep" Problem:** You might ship Scenario 1 (Refunds) as Amber. Over 6 months, you tweak the prompt to be "more empathetic." Slowly, the refund rate creeps up. The checklist is a point-in-time assessment; it does not prevent drift. You need **continuous monitoring** (e.g., alert if refund rate > X% for 3 days).
  3.  **The "Rubber Stamp" Human:** In Scenario 2 (Collections), I said "Human must click submit." If you measure that human on "speed of processing," they will click yes on everything the agent suggests. The procedure assumes the human is an independent check, but organizational incentives often turn them into a pass-through.
  4.  **Unknown Unknowns:** This checklist works for known actions. It does not protect against the agent inventing a new action (e.g., promising a feature that doesn't exist to calm a user). You need a **whitelist of allowed tools** at the API gateway level, not just in the system prompt.

  ### Final Recommendation for Your Team

  1.  **Adopt the Traffic Light:** Put this in your design docs. If it's Red, it doesn't get coded.
  2.  **Enforce API Whitelisting:** Don't trust the prompt. If the agent isn't supposed to do Collections, the backend should reject the `POST /collections` call from the agent's service account entirely unless it has a specific "human-verified" token.
  3.  **Own the Judgment:** When you fill out Step 1 (Impact Thresholds), email that number to your VP and Legal. "We are defining High Impact as $5,000." Get them to reply "Agreed." That saves you when something goes wrong.

  This doesn't make you a philosopher. It makes you an engineer who documents risk. That's the best ethics you can ship.
