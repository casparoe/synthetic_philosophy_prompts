prompt: |-
  My friend's in law school and he's decided consent -- medical, sexual, whatever -- is basically just a contract, so everything contract law knows carries straight over: you need a meeting of the minds, capacity, no duress, and if you were deceived about anything material the whole thing's void. He uses this to argue that a patient never told about a rare side effect never really consented, and that being lied to about something you'd obviously care about turns sex into assault. I think he's onto something but overreaching. Audit the analogy for me: give me the correspondence first (what plays the role of offer, acceptance, consideration, breach, remedy), then where the mapping breaks -- consent's revocable, it's a permission rather than a promise, there's no damages remedy, nothing's negotiated -- and then whether his two conclusions survive once the disanalogies are on the table, or whether the analogy was carrying them the whole time. One thing I want you to press hard on: contract law only treats silence as deception when there's a duty to disclose, and consent theory looks like it has the same hole (how material does the undisclosed thing have to be, and material to whom -- the reasonable patient or this particular one?), so does the analogy just relocate the problem instead of solving it? And if the contract picture is the wrong one, what should replace it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Core Task:** Audit the analogy "Consent = Contract."
      *   **User's Friend's Position:** Consent is basically a contract (meeting of minds, capacity, no duress, material deception voids it).
      *   **Friend's Conclusions:**
          1.  Undisclosed rare side effect = no medical consent (battery/negligence).
          2.  Lies about material facts in sex = assault.
      *   **User's Intuition:** Onto something but overreaching.
      *   **Required Structure:**
          1.  Correspondence (Offer, Acceptance, Consideration, Breach, Remedy).
          2.  Where the Mapping Breaks (Revocability, Permission vs. Promise, Damages, Negotiation).
          3.  Evaluation of Conclusions (Do they survive the disanalogies?).
          4.  Specific Pressure Point: Duty to Disclose/Silence as Deception (Materiality standards).
          5.  Alternative Framework (If not contract, then what?).

  2.  **Part 1: The Correspondence (Mapping Contract to Consent):**

      *   *Offer:* Proposal of interaction (Doctor: "I will perform surgery"; Partner: "I want to have sex").
      *   *Acceptance:* Affirmative agreement ("Yes," signing the form, nodding, participating).
      *   *Consideration:* This is tricky. In contracts, it's exchange of value. In consent, it's mutual benefit or exchange of rights (Patient gets health, Doctor gets fee/license; Partners get pleasure/intimacy).
      *   *Breach:* Violation of scope (Doing a different surgery, removing a condom without asking).
      *   *Remedy:* Contract = Damages/Specific Performance. Consent/Tort/Criminal = Battery, Assault, Malpractice, Prison.

  3.  **Part 2: Where the Mapping Breaks (Disanalogies):**

      *   *Revocability:* Contracts bind you (mostly). Consent is revocable *at any time*. This is a huge structural difference.
      *   *Permission vs. Promise:* Contract creates an obligation to *do*. Consent creates a license to *act* (waiver of a right to sue/protect). It's a shield, not a sword.
      *   *Negotiation:* Contracts are bargained-for exchanges. Consent is often adhesion (medical forms) or non-verbal/implied (sex). There's no haggling over terms usually.
      *   *Remedy:* Contract aims to make whole economically. Consent violations are bodily integrity violations (criminal/tort), often punitive or restorative in a non-monetary sense (justice, safety).
      *   *Capacity:* Contract capacity is rigid (age, mental state). Consent capacity is contextual (intoxication levels vary by jurisdiction/activity).

  4.  **Part 3: Evaluating the Friend's Conclusions:**

      *   *Conclusion 1 (Medical Side Effects):*
          *   Contract view: Non-disclosure of material fact = voidable contract.
          *   Legal reality: Informed Consent doctrine exists but isn't strict liability. It's usually negligence (malpractice), not battery, unless the procedure itself was unauthorized.
          *   Verdict: Analogy pushes too hard. Not *every* undisclosed risk voids consent, only those a reasonable patient (or specific patient) would find material. The contract model suggests *any* material deception voids it, but law allows for therapeutic privilege or standard of care deviations.
      *   *Conclusion 2 (Sexual Deception):*
          *   Contract view: Fraud in the inducement voids consent.
          *   Legal reality: "Fraud in the factum" (nature of the act) voids consent. "Fraud in the inducement" (lying about wealth, love, status) usually *does not* void consent in criminal law.
          *   Verdict: Analogy fails here. Contract law voids for many lies; Criminal sexual assault law is much narrower to avoid over-criminalization.

  5.  **Part 4: The Pressure Point (Duty to Disclose & Materiality):**

      *   *Contract Law:* Silence isn't fraud unless there's a fiduciary duty or half-truth.
      *   *Consent Law:* Same problem. Do you have to disclose *everything*? No.
      *   *Materiality Standard:*
          *   Objective (Reasonable Patient/Person): Stable, predictable, but ignores individual quirks.
          *   Subjective (This Particular Patient/Person): Respects autonomy, but creates uncertainty/trap for the actor.
      *   *Does the analogy solve it?* No, it just imports the contract ambiguity into bodily autonomy. It shifts the question from "Was consent valid?" to "Was there a duty to disclose?" which is the exact same hard question.
      *   *Key Insight:* The contract model assumes parties *should* disclose material info to ensure a fair bargain. Consent theory assumes actors *should* disclose info to ensure autonomy. The *why* is different, but the *hole* (defining materiality) remains.

  6.  **Part 5: Alternative Framework:**

      *   If not Contract, then what?
      *   *Tort Law (Battery/Negligence):* Focuses on bodily integrity and harm.
      *   *Property/Rights Waiver:* Consent as a temporary waiver of a right to exclude.
      *   *Communicative Ethics/Relational Theory:* Consent as an ongoing communication process, not a one-time signature.
      *   *Best Fit:* **Fiduciary/Relational Model (Medical)** and **Autonomy/Bodily Integrity Model (Sexual).**
      *   *Medical:* Doctor-Patient is fiduciary. Higher duty to disclose than a commercial contract.
      *   *Sexual:* Affirmative Consent standard. Focus on communication and capacity, not bargain terms.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, legally precise but accessible, respectful of the friend's insight but firm on the limits.
      *   *Structure:* Follow the user's prompt exactly.
      *   *Refining the "Consideration" point:* Be careful not to imply sex is a transaction. Consideration in consent is better framed as "mutual assumption of risk" or "exchange of access."
      *   *Refining the "Materiality" point:* This is the crux. In contracts, *fraud in the inducement* makes a contract voidable. In sex, lying about being sterile or wealthy is usually not assault. Lying about identity (impersonation) might be. The distinction is "Nature of the Act" vs. "Collateral Facts." The contract analogy blurs this.
