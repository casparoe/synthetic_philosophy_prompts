  9.  **Self-Correction during drafting:** I need to make sure I don't get too bogged down in specific jurisdictional laws (e.g., California vs. New York) but stick to general common law principles and legal theory. The friend is making a theoretical argument, so the rebuttal should be theoretical with doctrinal support. I need to emphasize that *Contract* is about enforcing promises, while *Consent* is about waiving rights. That's the fundamental category error.

  10. **Final Polish:** Ensure the distinction between "Fraud in the Factum" and "Fraud in the Inducement" is clear, as that's the legal kill-shot for the sexual assault argument. Ensure the distinction between Battery and Negligence is clear for the medical argument.

