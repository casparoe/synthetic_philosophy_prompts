answer: |-
  This is a sophisticated legal theory question that cuts to the heart of how the law conceptualizes autonomy. Your friend has identified a genuine structural similarity (both involve voluntary agreement between parties), but he is making a category error by conflating **obligation-creating mechanisms** (contracts) with **liability-shielding mechanisms** (consent).

  Here is the audit of the "Consent as Contract" analogy.

  ### 1. The Correspondence (The Mapping)

  If we force consent into the contractual framework, the elements map as follows:

  *   **Offer:** The proposal of interaction.
      *   *Medical:* "I propose to perform this surgery."
      *   *Sexual:* "I propose we engage in this sexual act."
  *   **Acceptance:** The affirmative agreement to the terms.
      *   *Medical:* Signing the form or verbal assent.
      *   *Sexual:* Verbal "yes" or affirmative conduct.
  *   **Consideration:** The exchange of value (the weakest link).
      *   *Medical:* Health improvement/Life extension $\leftrightarrow$ Fee/Professional satisfaction.
      *   *Sexual:* Mutual pleasure/Intimacy $\leftrightarrow$ Mutual pleasure/Intimacy. (Note: Legally, sex cannot be a "bargained-for exchange" without risking prostitution laws, which highlights the friction here).
  *   **Breach:** Exceeding the scope of the agreement.
      *   *Medical:* Operating on the left knee instead of the right; failing to use sterile equipment.
      *   *Sexual:* "Stealthing" (removing a condom); continuing after withdrawal of consent.
  *   **Remedy:** The recourse for violation.
      *   *Contract:* Expectation damages (put plaintiff in position as if contract performed).
      *   *Consent:* Tort damages (Battery/Malpractice) or Criminal Punishment (Prison). The goal is not economic equilibrium but vindication of bodily integrity.

  ### 2. Where the Mapping Breaks (The Disanalogies)

  The analogy collapses under four specific pressures:

  **A. Revocability (The "Exit Right")**
  *   **Contract:** Generally binding. You cannot unilaterally void a contract because you changed your mind (unless there's a specific clause). Breach leads to damages.
  *   **Consent:** Unilaterally and instantly revocable at any time, for any reason, without penalty. If consent were a contract, stopping sex midway would be a breach of contract. It is not; it is an exercise of autonomy.

  **B. Permission vs. Promise (The Direction of Fit)**
  *   **Contract:** Creates a **duty to act**. It is a sword. ("I *must* build the wall.")
  *   **Consent:** Creates a **license to act**. It is a shield. ("You *may* touch me.") Consent is a waiver of a right to sue (or a right to bodily exclusion). It does not obligate the consenter to do anything; it merely removes the legal prohibition against the other party.

  **C. Negotiation vs. Adhesion**
  *   **Contract:** Presupposes a "meeting of the minds" often reached through bargaining.
  *   **Consent:** Often non-negotiable. Medical consent forms are contracts of adhesion (take it or leave it). Sexual consent is often non-verbal and contextual. There is no haggling over the "terms" of intercourse in the way there is over price or delivery dates.

  **D. The Remedy Mismatch**
  *   **Contract:** Remedies are economic.
  *   **Consent:** Violations are often criminal (assault/rape) or tortious (battery). You cannot "pay damages" to make a rape "whole" in the economic sense. The law treats bodily integrity as inalienable, not a commodity to be traded and compensated.

  ### 3. Do the Conclusions Survive?

  Your friend uses the contract model to argue two points. Let's test them against the disanalogies.

  **Conclusion 1: Undisclosed rare side effects void medical consent.**
  *   **Verdict:** **Partially survives, but mischaracterizes the cause of action.**
  *   **Analysis:** In contract law, material concealment can void an agreement. In medicine, failure to disclose risks violates the doctrine of **Informed Consent**. However, legally, this is usually treated as **Negligence (Malpractice)**, not **Battery**.
      *   *Battery* requires that you touched me *without any consent* (e.g., I said no, or you operated on the wrong leg).
      *   *Negligence* admits I consented to the touch, but the *process* of obtaining consent was flawed.
  *   **Why the Contract Analogy Fails Here:** If consent were a contract, a voided agreement means the interaction was unauthorized *ab initio* (from the start). But courts rarely treat undisclosed risks as turning a surgery into a battery. They treat it as a breach of professional duty. The contract model pushes for a "void" status (Battery), but the law settles for "breach of duty" (Negligence).

  **Conclusion 2: Lies about material facts turn sex into assault.**
  *   **Verdict:** **Fails.**
  *   **Analysis:** Contract law distinguishes between *fraud in the factum* (lying about the nature of the document/act) and *fraud in the inducement* (lying to get you to sign).
      *   *Fraud in the Factum:* "This is a handshake" (it's actually a sex act). Consent is void. This maps to sexual assault.
      *   *Fraud in the Inducement:* "I am a millionaire" or "I love you" or "I am sterile." In contract, this might void the deal. In criminal sexual assault law, **this does not void consent.**
  *   **Why the Contract Analogy Fails Here:** If we applied contract rules strictly, lying about your HIV status, wealth, or marital status would render the "contract" void, making every subsequent touch a battery. The law rejects this to avoid over-criminalization and because sexual autonomy is not a commercial bargain. The "materiality" of a lie in sex is narrowly construed (usually limited to identity or nature of the act), whereas contract law is much broader regarding material facts.

  ### 4. The Pressure Point: Duty to Disclose and Materiality

  You asked to press hard on the "Silence as Deception" hole. This is the strongest part of your critique.

  **The Contract Hole:**
  In contract law, silence is not fraud unless there is a **fiduciary duty** or a **duty to disclose** (e.g., latent defects in real estate). The hard question is: *What must be disclosed?*
  *   *Objective Standard:* What would a reasonable person care about?
  *   *Subjective Standard:* What did *this* plaintiff care about?

  **The Consent Hole:**
  Consent theory imports this exact ambiguity.
  *   **Medical:** The standard has shifted from *Professional Practice* (what doctors usually disclose) to *Patient-Centered* (what a reasonable patient would want to know). Some jurisdictions allow *Subjective* materiality (what *this* patient would want), but this creates uncertainty for doctors.
  *   **Sexual:** There is generally **no affirmative duty to disclose** personal history (past partners, STD status, gender history) in many jurisdictions, unless specific statutes say otherwise.

  **Does the Analogy Solve the Problem?**
  **No, it relocates it.**
  By framing consent as a contract, your friend assumes the "Duty to Disclose" is solved by "Materiality." But "Materiality" is the exact battleground.
  *   If we use the **Objective Standard** (Reasonable Person), we ignore the specific autonomy of the victim (e.g., a patient who specifically cares about a 0.1% risk of paralysis).
  *   If we use the **Subjective Standard** (This Particular Person), we create a trap for the actor (e.g., "How could I know *that* specific lie mattered to *you*?").

  The contract analogy doesn't fix this; it just imports the commercial "materiality" test into the bedroom and the ER, where it fits poorly. In commerce, we want efficient markets. In bodily integrity, we want absolute autonomy. These are different goals requiring different disclosure rules.

  ### 5. What Should Replace the Contract Picture?

  If "Consent = Contract" is the wrong model, what is the right one? It depends on the context.

  **A. Medical Context: The Fiduciary Model**
  *   **Framework:** The Doctor-Patient relationship is not arm's-length commerce; it is **fiduciary**.
  *   **Why it works:** A fiduciary has a higher duty of loyalty and disclosure than a contracting party. This explains why doctors *must* disclose risks that a car salesman wouldn't.
  *   **Remedy:** Negligence/Malpractice. It acknowledges the patient agreed to the touch, but the doctor failed their heightened duty of care.

  **B. Sexual Context: The Communicative/Autonomy Model**
  *   **Framework:** Consent is not a waiver or a deal; it is an **ongoing communicative process**.
  *   **Why it works:** This aligns with "Affirmative Consent" standards. It focuses on the *presence* of agreement rather than the *absence* of fraud.
  *   **Remedy:** Criminal Law/Tort. It treats violations as offenses against the person, not breaches of an agreement.
  *   **On Deception:** This model distinguishes between **Deception regarding the Act** (voids consent) vs. **Deception regarding Collateral Facts** (does not void consent). This avoids the "contract trap" where lying about your job makes sex assault.

  ### Summary for Your Friend

  Tell him he is right about the **inputs** (capacity, voluntariness, information) but wrong about the **mechanism**.

  1.  **Contract creates obligations; Consent waives rights.** You can't revoke a contract unilaterally; you can always revoke consent.
  2.  **The "Materiality" trap:** Importing contract materiality doesn't solve the disclosure problem; it just asks whether we judge materiality by a "reasonable person" or "this specific victim." Law struggles with this in both fields.
  3.  **The Sexual Assault Conclusion:** If consent were a contract, lying about being sterile would be rape (fraud in the inducement). The law rightly rejects this. Consent is about the *nature of the physical act*, not the *terms of the relationship*.
  4.  **The Medical Conclusion:** Undisclosed risks are usually negligence, not battery. The contract model conflates "I didn't know the risks" (negligence) with "I didn't agree to this touch" (battery).

  **The Better Analogy:** Consent is a **Key**, not a Contract.
  A key grants access to a space (the body). You can lend the key (consent). You can take the key back anytime (revocability). If someone picks the lock (assault), they violated your property rights. If you lent the key but lied about what was inside the room (deception), that's a different wrong, but it doesn't necessarily mean they broke in. Contract law is about the deal made *after* entry; Consent law is about who holds the key.
