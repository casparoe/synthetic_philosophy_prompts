          *   Modern model theory says reference is fixed *relative to a model*, truth varies.
          *   The relativist conflates "extension varies" with "concept is empty."
          *   We understand "uncountable" perfectly; we just recognize its extension depends on the domain.
      *   **Conclusion/Verdict:**
