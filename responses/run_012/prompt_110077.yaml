answer: |-
  # Activity Design: The Binding Pot

  ## 1. Core Mechanics & Rules

  **Objective:** Teams compete to claim shares of a fixed 100-point pot. The goal is to maximize your team's score.
  **Structure:** 3 Teams (Red, Blue, Green). ~6-7 students per team.
  **Roles:**
  *   **Players:** The 3 teams.
  *   **Secretariat:** 2 students (non-players). They track the "Claim Board," enforce penalties, and manage the turn order deck.
  *   **Instructor:** Game master and timekeeper.

  **The Pot:** 100 Points.
  **Outcomes:**
  1.  **Agreement:** If all 3 teams sign a division proposal (e.g., 40/30/30), the game ends immediately. Points awarded as written.
  2.  **Crash:** If the sum of *Binding Claims* on the board exceeds 100 at any point, the pot shatters. All teams receive 5 points (Consolation).
  3.  **Timeout:** If 10 rounds pass without Agreement or Crash, points are awarded based on current Binding Claims *if* they sum ≤ 100. If > 100, Crash rules apply.

  **Actions (per turn):**
  On a team's turn, they must choose one of two actions:
  1.  **Propose Division:** Submit a written split (must sum to 100). This proposal is *non-binding* and takes effect only if **all three teams** sign it before the next turn begins.
  2.  **Play Commitment Card:** Place a card face-up on the Claim Board.
      *   Cards have values: 10, 20, 30, 40, 50.
      *   **Binding Rule:** Once played, a card cannot be withdrawn.
      *   **Claim Rule:** A team's current claim is the *highest value card* they have played. (Playing a 40 overrides a previous 20).
      *   **Immediate Check:** After every card play, the Secretariat sums the highest cards of all three teams. If Sum > 100, immediate Crash.

  **Turn Order:**
  *   The Secretariat holds a deck of 9 cards (3 Red, 3 Blue, 3 Green).
  *   At the start of each round, 3 cards are drawn to determine the order of play for that round.
  *   This ensures no team has a permanent first- or last-mover advantage.

  **Phases:**
  *   **Phase 1 (Rounds 1-3): The Era of Talk.** Commitment Cards are *non-binding*. They can be withdrawn or ignored at any time. They serve only as signals. A Crash cannot occur in Phase 1 (Secretariat warns if sum > 100 but does not enforce).
  *   **Phase 2 (Rounds 4-10): The Era of Steel.** Commitment Cards are *binding*. Withdrawal is impossible. Crash is enforced immediately.

  **Internal Decision Rule (Crucial Modification):**
  *   *Do not require internal unanimity.* With 6-7 students per team, unanimity creates intra-team gridlock that masks the inter-team commitment dynamic.
  *   *Rule:* Each team designates one **Commander** immediately. The Commander consults the team for 60 seconds, then makes the final decision. The team can veto the Commander only by a 2/3 vote, which costs the team one turn (they forfeit their action). This simulates organizational friction without paralyzing the game.

  ## 2. Materials

  1.  **Claim Board:** A whiteboard or large sheet with three columns (Red, Blue, Green). Space to stack cards vertically. A running "Total" display at the bottom.
  2.  **Commitment Deck:** 15 cards per color (values: three 10s, three 20s, three 30s, three 40s, three 50s).
  3.  **Turn Order Deck:** 9 cards (3 per team color).
  4.  **Deal Slips:** Small paper slips for writing proposals.
  5.  **Scoreboard:** Visible to all.
  6.  **Timer:** Visible countdown for turn decisions (90 seconds per turn).

  ## 3. Payoff Scheme & Numbers

  The numbers are tuned to make the "Race" rational.

  *   **Fair Split:** ~33 points each. (Preferred over Crash).
  *   **Aggressive Claim:** 50 points. (Preferred over Fair Split).
  *   **Crash:** 5 points each. (Worst outcome).

  **The Logic of the Trap:**
  *   In Phase 1, Team A plays a 50 card. Teams B and C know this is cheap talk. They ignore it and propose 33/33/33.
  *   In Phase 2, Team A plays a 50 card. This is now binding. Team A *cannot* accept less than 50.
  *   Team B now faces a choice:
      *   Accept 25 (remaining pot 50 split between B & C).
      *   Play a 50 card to fight for dominance.
  *   If Team B thinks Team C will play a 50 card, Team B *must* play a 50 card now to avoid being left with 0.
  *   If B and C both play 50s, Sum = 150. Crash.
  *   **Incentive:** Each team prefers 50 > 33 > 5. But the strategy that secures 50 (binding commitment) creates the risk of 5.

  ## 4. Session Timeline (90 Minutes)

  *   **00-10: Setup.** Divide class. Appoint Secretariat. Explain rules *without* using the term "commitment race." Emphasize that Phase 1 is "negotiation" and Phase 2 is "enforcement."
  *   **10-30: Phase 1 (Cheap Talk).** 3 Rounds.
      *   *Expected Outcome:* Teams signal aggressively but settle on a deal (e.g., 40/30/30).
      *   *Instructor Role:* If they agree too fast, pause and ask: "Are you sure? You can do better." Encourage them to hold out for more before signing.
  *   **30-35: The Transition.** Announce Phase 2. "Cards are now steel. What is on the board stays on the board. If the sum exceeds 100, the pot breaks."
      *   *Critical:* Do not clear the board. Any cards played in Phase 1 remain, but now become binding. (Or, clear the board to reset trust, but I recommend *keeping* the cards to show how past signals become future shackles). *Decision:* **Clear the board.** It makes the shock of the new rules sharper.
  *   **35-75: Phase 2 (Binding).** Up to 7 Rounds.
      *   *Expected Outcome:* Escalation. One team plays a 40 or 50 to "secure" their share. Others feel threatened and match it. Crash occurs around Round 5 or 6.
      *   *Instructor Role:* Enforce time limits strictly. Do not intervene to save them from a Crash.
  *   **75-90: Debrief.** (See below).

  ## 5. Debrief Guide: Mapping Moments to Theory

  Do not lecture. Ask questions that force them to reconstruct the logic.

  **1. The Shift (Phase 1 vs. Phase 2)**
  *   *Ask:* "In Round 3, you had a deal on the table. Why didn't you sign it before Round 4 started?"
  *   *Point:* They wanted to use the new binding rules to improve their position. They *wanted* the tool of commitment.
  *   *Insight:* The commitment device was introduced to *help* them enforce deals, but it became a weapon.

  **2. The Escalation (The Race)**
  *   *Ask:* "Team Blue, when you played the 50 card in Round 5, did you want the pot to crash?" (No). "Did you think it would crash?" (Maybe/No). "Then why play it?"
  *   *Point:* "I had to. If I didn't, Red would take it."
  *   *Insight:* This is the race. You committed not because you preferred war, but because you feared being the *only one* who didn't commit. You raced to bind yourself to avoid being exploited.

  **3. The Random Order**
  *   *Ask:* "How did the turn order affect your anxiety?"
  *   *Point:* If you move last, you might find the pot already claimed. If you move first, you risk setting off the crash.
  *   *Insight:* Uncertainty about *when* others will commit drives pre-emptive commitment.

  **4. The External Enforcer**
  *   *Ask:* "The Secretariat enforced the rules. Would an external enforcer (a contract law) have fixed this?"
  *   *Point:* No. The rules *were* the enforcement. The problem wasn't lack of enforcement; it was that the enforcement mechanism (binding cards) removed the flexibility needed to de-escalate.
  *   *Insight:* Commitment races are not failures of law; they are failures of strategic flexibility under binding constraints.

  **5. The "Greed" Defense**
  *   *Ask:* "Was this caused by greed?"
  *   *Point:* If everyone was greedy, they would have crashed in Phase 1. They cooperated when they could.
  *   *Insight:* The structure drove the outcome, not individual malice. Rational agents produced an irrational outcome.

  ## 6. Troubleshooting: What Will Go Wrong

  **1. The "Polite Stall" (Phase 2)**
  *   *Problem:* Teams refuse to play cards, hoping others will propose a deal. The clock runs out.
  *   *Fix:* Introduce a "Decay Rule." If 3 rounds pass with no card play and no deal, the pot shrinks by 10 points per round. This forces action.

  **2. The "Secretariat Error"**
  *   *Problem:* The student secretariat miscalculates the sum, causing a false crash or missing a real one.
  *   *Fix:* Give the Secretariat a simple checksum sheet. Instructor verifies the sum before announcing a Crash.

  **3. The "Unanimity Bottleneck"**
  *   *Problem:* As noted, 7 students arguing inside a team kills the 90-minute flow.
  *   *Fix:* Stick to the **Commander Rule**. If a team takes >90 seconds, they forfeit the turn (play a "Pass" card). This penalizes internal disorganization, keeping the focus on inter-team dynamics.

  **4. Early Cooperation in Phase 2**
  *   *Problem:* They sign a deal immediately in Round 4, fearing the crash.
  *   *Fix:* You need to seed distrust. In the transition, whisper to each team: "The other teams are asking about the 50 cards." (Use sparingly). Or, ensure Phase 1 ends *without* a signed deal, leaving tension high.

  ## 7. One Rule Change for Replay

  **The Dial:** **Costly Commitment.**
  *   **Change:** Playing a Commitment Card costs points from the team's final score (e.g., playing a 50 card costs 5 points; a 40 costs 4, etc.), regardless of the outcome.
  *   **Prediction:** Escalation slows down. Teams will hesitate to play high cards because the "burn" makes the risk of crash less worth it. However, if a team *does* play a high card, it is a more credible signal (because they paid for it).
  *   **Why:** This simulates "burning bridges." It filters out bluffs. You will likely see fewer cards, but the ones played will be more aggressive, potentially leading to a sharper, more sudden crash rather than a slow escalation. It highlights that commitment is only useful if it is *costly* to reverse.

  ## 8. Failure Analysis: Where the Design is Most Fragile

  **The Weakest Link:** **The Causal Chain from "Binding" to "Race".**
  *   **Risk:** The game might demonstrate that *binding agreements cause crashes*, but fail to show *why rational agents choose them*. Students might walk away thinking, "They were just stupid/greedy," rather than "They were trapped."
  *   **Why:** If the payoff difference between Winning (50) and Deal (33) isn't felt as urgent, they won't race. If the Crash penalty (5) isn't scary enough, they won't fear it.
  *   **What to Watch in a Trial Run:**
      *   Do teams play high cards *defensively*? (i.e., "I'm playing 40 so you don't take 60").
      *   If they play high cards *offensively* only ("I want 60"), the lesson is about greed, not commitment races.
      *   **Correction:** If you see offensive play only, adjust the debrief to emphasize that *defensive* fear drives the offensive move. If the trial run shows no race at all, increase the Crash penalty to 0 points (total loss) to heighten the stakes, or reduce the Pot to 80 points while keeping card values the same to make the margin for error thinner.

  **Abandon First:** **The Random Turn Order.**
  *   If the game drags, fix the turn order to A-B-C-A-B-C. Random order adds realism but consumes time in shuffling/explaining. If you must cut complexity to save the debrief time, fix the order. The commitment race dynamic survives fixed order; it just becomes more predictable.

  **The Insight You Must Supply:**
  *   The game cannot reproduce the **epistemic uncertainty**. In the real world, I don't *know* you are rational. In the game, you are all in the same room. You must explicitly explain in the debrief that in real multi-agent systems (AI, nuclear deterrence, markets), agents cannot see each other's "internal unanimity" process. They only see the card. The game makes the cards public; reality hides them until it's too late. You must verbalize this gap.
