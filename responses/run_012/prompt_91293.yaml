prompt: |-
  I'm writing a novel and I need one scene to carry a whole argument, so I want you to draft it for me. Two teachers at a French lycée, cornered in the staffroom, going at each other over whether the school should keep making room for religious and cultural difference or insist everyone leaves it at the gate. One is a committed laïcard: the republic's neutrality, he says, is the only thing that actually protects kids from getting sorted into the community they were born into, and "recognition" is just a prettier word for locking people inside that box — the protections meant to shelter a group quietly become its cage. The other taught for years in Toronto and thinks that's a fairy tale: the supposedly neutral secular schoolroom is already somebody's culture, and making minorities file in and drop what they carry isnt neutral, it's just the majority's habits wearing a costume. Write the dialogue. Make them both sharp. The laïcard has to have a real answer to the charge that neutrality is never neutral (something about how hard the exit from community is, and what it costs the kid who can't leave), and the multiculturalist has to have a real answer to the assimilation-is-a-cage worry. No strawmen, no talking past each other — each one should pick up what the other actually said before hitting back. Keep it tight.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Setting:** Staffroom of a French *lycée* (high school). Cornered, tense atmosphere.
      *   **Characters:** Two teachers.
          *   *Teacher A (Laïcard):* Committed to *laïcité* (strict secularism). Believes republic neutrality protects kids from being sorted by birth community. Sees "recognition" as a cage.
          *   *Teacher B (Multiculturalist):* Taught in Toronto. Believes "neutral" secularism is just majority culture in disguise. Asking minorities to drop their baggage isn't neutral; it's assimilation.
      *   **Requirements:**
          *   Sharp dialogue.
          *   No strawmen (both arguments must be strong and responsive).
          *   Specific argumentative beats:
              *   Laïcard must answer the "neutrality is never neutral" charge (focus on the difficulty/cost of exiting community).
              *   Multiculturalist must answer the "assimilation-is-a-cage" worry.
          *   Tight pacing.

  2.  **Character Conception:**
      *   *Laïcard:* Let's call him **Marc**. Older, perhaps worn down by the system but believing in its ideal. Cigarette stain on fingers (maybe), coffee in a chipped mug. Sharp, intellectual, slightly dogmatic but out of care.
      *   *Multiculturalist:* Let's call her **Sarah**. Younger or mid-career, international experience. Pragmatic, observant, frustrated by rigidity.
      *   *Setting the Scene:* The staffroom needs to feel claustrophobic. Rain against the window? The smell of stale coffee. The bell ringing in the distance to add time pressure.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Start *in media res*. No pleasantries. Establish the conflict immediately.
      *   **Beat 1: The Charge of Neutrality.** Sarah attacks the idea of neutrality. Marc defends it.
          *   *Sarah:* Neutrality is a myth. It's majority culture pretending not to be.
          *   *Marc:* It's not about culture, it's about armor.
      *   **Beat 2: The Cost of Exit (Marc's Key Argument).** Marc needs to explain *why* the hard line is necessary. It's about the kid who *wants* to leave their community.
          *   *Marc:* If we validate the community inside school, the kid can't escape it. The school must be the exit door.
      *   **Beat 3: The Cost of Entry (Sarah's Key Argument).** Sarah needs to counter the "cage" argument. She needs to show that forcing assimilation is also a cage.
          *   *Sarah:* If they have to amputate themselves to enter, they never truly belong. The "neutral" space is already occupied.
      *   **Beat 4: The Climax/Resolution.** No easy agreement, but a mutual acknowledgment of the stakes. A sharp closing line.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Is Marc sounding too cold?
      *   *Fix:* Give him a specific example. A student who wants to be more than their parents' expectations. Make his passion about *liberation*, not just rules.
      *   *Critique:* Is Sarah sounding too soft/relativist?
      *   *Fix:* Ground her in reality. The "neutral" rules (hair, food, holidays) aren't actually neutral; they align with the Catholic/Secular majority. Make her point about *dignity*.
      *   *Check:* Did Marc answer "neutrality is never neutral"? Yes, by arguing that *explicit* neutrality is the only tool to break tribal gravity.
      *   *Check:* Did Sarah answer "assimilation is a cage"? Yes, by arguing that forced amputation creates resentment, not citizens.

  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Line:* "You think neutrality protects them." -> *Better:* "You call it protection. I call it erasure."
      *   *Line:* "The Republic is blind." -> *Better:* "The Republic is blind so it cannot judge you by your origins."
      *   *Toronto reference:* Make sure it lands. "In Toronto, they ask who you are. Here, we ask what you are not."
      *   *The "Exit" argument:* Marc needs to talk about the price of leaving a community. If the school validates the community, the price goes up.
      *   *The "Costume" argument:* Sarah needs to say the "neutral" mask fits the majority face perfectly.

  6.  **Polishing:**
      *   Check rhythm. French intellectual debates can be rapid-fire. Use dashes for interruptions.
      *   Add sensory details. The coffee machine, the rain, the bell.
      *   Ensure the French context is clear (laïcité, Republic, banlieue implications without being explicit stereotypes).

  7.  **Final Review against Constraints:**
      *   Sharp? Yes.
      *   No strawmen? Both positions are defensible.
      *   Marc's specific rebuttal on exit costs? Included.
      *   Sarah's specific rebuttal on the cage? Included.
      *   Tight? Keep it under 1000 words.

  **(Self-Correction Note):** Make sure Marc doesn't sound like a xenophobe. He must sound like a *defender of the individual against the group*. That's the core of Republican universalism. Make sure Sarah doesn't sound like she wants religious schools. She wants *inclusive* public schools.

  8.  **Final Polish:** (Writing the scene based on these thoughts.)
answer: |-
  The staffroom smelled of wet wool and burnt coffee. Rain blurred the high windows, turning the courtyard grey. Marc stood by the machine, nursing an espresso. Sarah leaned against the doorframe, blocking his exit.

  "You call it protection," Sarah said. "I call it erasure."

  Marc didn't turn. "I call it armor. When that boy walks in here, I don't want to see his religion, his neighborhood, or his parents' grievances. I want to see a student. The Republic is blind so it cannot judge him by his origins."

  "The Republic isn't blind, Marc. It's myopic. It sees the majority culture perfectly and calls it 'neutral.'" Sarah stepped into the room. "You ask them to leave their identity at the gate. But you don't. You wear your Catholic-secular habits like a skin. You think *your* normal is invisible. It's not. It's just the default setting."

  Marc turned, sharp. "Default settings can be changed. Tribal gravity cannot. You taught in Toronto. You know the model. You validate the difference, you think you're being kind. But you're cementing the walls."

  "I'm acknowledging the furniture in the room."

  "You're locking the door." Marc set the cup down hard. "Think about the kid who wants to leave. The girl whose family expects her to be a wife, not a physicist. If we validate her community inside these walls, if we say 'yes, you are first and foremost a Muslim girl,' we raise the price of her exit. We make her betrayal of that identity a betrayal of the school, too."

  Sarah crossed her arms. "So you save her by forcing her to amputate herself?"

  "I save her by making the school a zone where that identity has no currency. Here, she is just a mind. If we start recognizing groups, we give the community leverage over her. The pressure comes from the outside, yes. But if the school says 'we see your difference,' the community says 'see? even the school knows you belong to us.' Neutrality is the only ladder out of the well."

  "That ladder is missing the first rung," Sarah shot back. "Because you're asking her to climb it while carrying a heavy pack that everyone else was told to leave at home. You say neutrality protects the kid who wants to leave. I'm telling you it abandons the kid who needs to arrive."

  She moved closer, voice dropping. "You worry about the cage of community. I worry about the cage of 'citizen.' If the only way to enter your Republic is to pretend I don't carry my history, then I am never truly inside. I'm a guest in your house, wearing your slippers. That's not integration, Marc. That's surrender. And kids feel the hypocrisy. They know 'universalism' usually speaks French and eats pork."

  "So we pander?" Marc's eyes flashed. "We let them sort themselves? Once you allow the signifiers, the sorting begins. The kids sit together. The teachers lower their expectations. 'Oh, he's from that background, we must be sensitive.' That is the cage. Soft, padded, but a cage. I refuse to pre-sort them by their pasts."

  "And I refuse to pretend their pasts don't shape their presents," Sarah said. "You say the neutral space is empty. It's not. It's occupied by the people who wrote the rules. When you tell a minority kid to drop their baggage to enter, you aren't creating a vacuum. You're asking them to step into *your* culture and call it 'nothing.' That costs them everything."

  "It costs them a performance," Marc corrected. "A small performance for a massive gain. Access to a universal language that doesn't belong to any tribe. If I let them keep the tribal markers inside, I deny them the tool to break the tribe."

  "And if the tool requires them to break themselves first," Sarah said, "they won't use it. They'll resent it. They'll stay in the courtyard, because at least there they're whole."

  The bell rang, shrill and sudden. The vibration hung in the air between them.

  Marc picked up his coffee. His hand didn't shake. "Better whole in the courtyard than broken in the classroom."

  "Better struggling in the truth," Sarah said, opening the door, "than comfortable in a lie."

  She held the door open. Marc walked through, not looking at her.

  "See you at the meeting," he said.

  "Bring your armor," she replied.
