  | 5 | You assess robustness across disjointed dimensions. But virtues are unified. A person robust on cost but not on kin lacks integrity, not partial worth. | Virtue Ethicist | Claim 2 fragments dispositions, contradicting the unity of virtues thesis. | Medium | Medium | Unity is a regulative ideal, not a baseline description. Most agents possess fragmented virtues. My gradable account captures this reality better than an all-or-nothing unity claim. We can acknowledge the fragmentation while striving for unity. Partial worth is still worth. | Might alienate the VE who thinks unity is constitutive. | Concede unity is the goal; hold fragmentation is the reality. |
