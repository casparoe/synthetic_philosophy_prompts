answer: |-
  **DECISION TREE: CRIMINALIZATION JUSTIFICATIONS**

  **1. Must conduct cause tangible harm to non-consenting others to be criminalized?**
  *   **Yes:** Go to 2.
  *   **No:** Go to 3.

  **2. (If Yes) Is preventing profound public offense (disgust) sufficient grounds?**
  *   **No:** **Millian Liberalism.** *Awkward commitment:* Must tolerate privately harmful but publicly invisible evils (e.g., consensual brutality).
  *   **Yes:** Go to 4.

  **3. (If No) Is preventing the agent's self-harm/degradation sufficient grounds?**
  *   **Yes:** **Legal Paternalism / Perfectionism.** *Awkward commitment:* State assumes superior knowledge of the agent's good or virtue.
  *   **No:** Go to 5.

  **4. (If Yes to Offense) Is the remedy to ban conduct or shield observers?**
  *   **Shield Only:** **Feinbergian Offense Principle.** *Awkward commitment:* Requires constant balancing of subjective disgust against objective reasonableness standards.
  *   **Ban Conduct:** **Hartian Moderation.** *Awkward commitment:* Risks sliding into moralism if "offense" tracks traditional morality too closely.

  **5. (If No to Above) Is enforcing shared morality sufficient grounds?**
  *   **No:** **Strict Liberalism (Unnamed).** *Awkward commitment:* Cannot criminalize desecration of corpses if done privately without offense.
  *   **Yes:** Go to 6.

  **6. (If Yes to Moralism) Is there a determinate shared morality legislators can identify?**
  *   **No (Rationalist):** **Perfectionist Moralism.** *Awkward commitment:* Elites impose objective morality without democratic consensus.
  *   **Yes (Empirical):** Go to 7.

  **7. (If Yes to Shared Morality) Is morality's value instrumental (prevents chaos) or constitutive (society *is* its morality)?**
  *   **Instrumental:** **Utilitarian Moralism (Unnamed).** *Awkward commitment:* Must cease punishing immorality if society proves stable despite it.
  *   **Constitutive:** **Devlinian Conservatism.** *Awkward commitment:* Must punish private immorality even if no social unrest is empirically visible.

  ***

  **ANALYSIS OF GAPS & COLLAPSES**

  **Empty Combinations:**
  *   **Legal Moralism + No Morality Source:** Incoherent. You cannot enforce "morality" without specifying whether it is derived from consensus (Devlin) or reason (Perfectionism). If neither, the legislator has no criterion.
  *   **Paternalism + No Shared Good:** Unappealing/Undefended. Paternalism requires a metric of "better off." Without a conception of the good (Perfectionism) or welfare (Hard Paternalism), the view lacks content.

  **The Devlin Collapse:**
  Does the tree collapse Devlin into plain consequentialism? **No, but narrowly.**
  *   **The Fork:** Node 7 (Instrumental vs. Constitutive) is the critical joint.
  *   **The Work:** If Devlin were merely instrumental (Utilitarian Moralism), he would require empirical evidence that private homosexuality *actually* loosens bonds leading to collapse. He explicitly rejects this burden, arguing society *is* its morality; attacking the morality *is* attacking the society, regardless of empirical stability.
  *   **The Difference:** The Constitutive view lowers the evidentiary bar for criminalization. The Instrumental view makes moral enforcement contingent on social stability data. They are extensionally different in cases where immorality is widespread but society remains stable.

  **Equivalence Flags:**
  *   **Hartian Moderation vs. Feinbergian Offense:** These are extensionally similar but distinct in principle. Feinberg grounds offense in individual rights not to be confronted; Hart grounds it in a weaker social interest. In practice, both recommend shielding rather than banning. If your theory treats "shielding" as a form of "ban on public conduct," these leaves merge.
  *   **Utilitarian Moralism vs. Devlinian Conservatism:** In stable societies, these yield identical results (enforce morality). They diverge only in transitional societies where morality shifts without causing collapse. If you believe morality shifts *only* when collapse is imminent, these views collapse into one another.

  **Note on "Shared Morality":**
  Node 6 isolates the "Legislator's Epistemic Problem." Devlin assumes the "man on the Clapham omnibus" reveals shared morality. Perfectionists deny this is necessary or possible. If you answer "No" to Node 6 but "Yes" to Node 5, you are a Perfectionist, not a Devlinian. This clarifies that Devlin is not a Legal Moralist in the rationalist sense, but a sociological conservative.
