          *   If payoffs differ, situations differ.
          *   *Verdict:* It's a boundary marker, not a refutation. Mira's argument *requires* symmetry. Dan shows it fails without it. This limits the scope of Mira's claim, doesn't invalidate it within its scope.

      *   **Section 4: Fixed Point vs. Circle.**
          *   Dan: You assume Green to prove Green.
          *   Mira: Looking for a stable equilibrium of reasoning (Kantian/Reflective Equilibrium).
