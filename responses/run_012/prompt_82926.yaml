  **Note on Textual Liberties**

  This poem treats Turing's handling of the "Argument from Extrasensory Perception" (Section 6 of *Computing Machinery and Intelligence*) as a serious methodological pivot, though scholars debate his sincerity. Turing writes that the statistical evidence for telepathy is "overwhelming"; the poem softens this to "strong" for rhythm, but retains the concession. More significantly, the poem frames the "telepathy-proof room" as a sensible yet strange necessity ("A physical fix for a mental judge"). Turing presents the shielded room somewhat casually, as a standard control variable. However, an alternative reading suggests Turing was being ironic—granting the ESP premise only to show that even with it, the machine could win, or to highlight that the Test relies on behavioral output, not physical isolation. Had I adopted that ironic reading, the third and fourth stanzas would have focused on the absurdity of shielding thoughts rather than the necessity of it, likely ending with the collapse of the test rather than its preservation.
