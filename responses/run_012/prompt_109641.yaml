answer: |-
  Here is a reading of *Memento* designed for your philosophy of mind seminar, structured to address the specific tensions between the Extended Mind Thesis (EMT) and the film's narrative mechanics.

  ### 1. The Glitch in Otto's Notebook: Trust vs. Testimony

  The standard reading of *Memento* posits Leonard Shelby as the tragic limit-case of Clark and Chalmers' Otto. Otto uses his notebook to store beliefs he cannot hold biologically; Leonard uses tattoos and Polaroids to store facts he cannot remember. In the standard EMT framework, the external resource counts as part of the cognitive system if it meets specific criteria: it must be reliably available, easily accessible, and, crucially, **automatically endorsed**.

  This last condition is where *Memento* breaks the model. Clark and Chalmers argue that for a notebook to be part of the mind, the agent must trust the information as implicitly as they trust biological memory. Otto does not verify his notebook entries every time he checks them; he treats them as memories. Leonard, however, cannot do this. He is acutely aware that his past self is a stranger who might lie to him. When he looks at a tattoo or a note, he is not retrieving a memory; he is evaluating **testimony**.

  This distinction is vital for your seminar. The film dramatizes a failure of the "trust" condition. If the external store requires scrutiny, it functions less like a memory buffer and more like an external witness. This suggests that Clark and Chalmers' framework *does* have the resources to distinguish genuine extension from mere delegation, but only if you enforce the "automatic endorsement" clause rigorously. Leonard's system is not an extended mind; it is an **extended archive of testimony**. The moment Leonard has to verify the source of a note (e.g., checking if the handwriting is his, or if the Polaroid has been doctored), the cognitive loop is broken. The system shifts from *ontological extension* (this is my mind) to *epistemic reliance* (this is evidence I must interpret).

  ### 2. Cognitive Colonization and Diachronic Agency

  You raised the point that the notes are authored and untrustworthy. This introduces a feature standard EMT cases suppress: **inter-temporal conflict**. In the Otto case, Past-Otto and Present-Otto share the same goals. In *Memento*, Past-Leonard actively weaponizes the external system to manipulate Future-Leonard.

  This moves the discussion from cognitive science to the philosophy of action. Leonard is not just extending his memory; he is attempting to **outsource his will**. He uses the tattoos as "Ulysses contracts" (pre-commitment devices) to bind his future self to a specific course of action (finding John G.). However, because his condition resets his agency along with his memory, the external system becomes a site of colonization.

  When Leonard writes "Don't believe his lies" on Teddy's photo, he is not storing data; he is issuing a command to a future agent he knows will be vulnerable. This dramatizes something the EMT arguments often miss: the **politics of cognitive extension**. External scaffolding is not neutral. It can be hijacked. If we accept that our smartphones and notes are part of our minds, *Memento* warns us that they are also points of vulnerability where our past selves (or other agents) can program our future behavior without our present consent. This motivates a sharp distinction between **extending memory** (passive storage) and **outsourcing will** (active constraint). The latter requires a theory of diachronic agency that EMT does not currently provide.

  ### 3. Reverse Chronology as Phenomenological Scaffold

  Taking the reverse chronology seriously as a formal argument is your strongest pedagogical tool here. The film does not just depict amnesia; it induces a structural analog of it in the viewer.

  *   **The Viewer as Otto:** In a linear film, the viewer's biological memory scaffolds the narrative. In *Memento*, the viewer's biological memory is rendered useless because the causal chain is hidden. We are forced to rely on the film's external scaffolding (the black-and-white sequences, the captions, the Polaroids) to construct coherence.
  *   **The Film as Extended Mind:** The film itself functions as the "notebook." Without the external structure of the editing, the viewer cannot form a coherent belief about the plot. This successfully demonstrates the EMT: the viewer's understanding of the narrative is literally constituted by the external arrangement of the scenes.
  *   **The Epistemic Position:** By denying the viewer the causal context of the scenes until the end, Nolan forces us into Leonard's epistemic position. We feel the anxiety of relying on unverified data. We experience the "trust condition" failing in real-time.

  This validates the EMT from the audience's perspective even as it invalidates it for Leonard. The viewer successfully extends their cognition into the film's structure to make sense of the world, proving that external scaffolding can constitute understanding. However, because the scaffolding is manipulated by the director (just as Leonard's notes are manipulated by his past self), we also learn that extended cognition is susceptible to external manipulation.

  ### 4. Where the Reading Overreaches: Flags for the Class

  To keep the seminar rigorous, you should flag three potential overreaches where the philosophical analogy strains against the cinematic reality:

  1.  **The Homunculus Problem:** Be careful not to imply there is a "true" Leonard inside the head looking at the notes. The film suggests Leonard *is* the system of body-plus-notes. If the notes are lies, Leonard is a lie. Don't let students retreat to a Cartesian inner theater where the "real" mind is safe from the tattoos. The tragedy is that there is no inner sanctuary.
  2.  **Function vs. Mechanism:** EMT is functionalist. It doesn't matter *how* the memory is stored, only *what it does*. Students might argue that tattoos aren't "neural" enough. Push back: the issue isn't the ink; it's the functional role. However, concede that if the functional role is deception rather than recall, it fails the functional definition of memory.
  3.  **The Emotional Gap:** EMT focuses on belief and computation. *Memento* is about grief and guilt. Leonard's system isn't just failing cognitively; it is serving an emotional need to perpetuate his quest. A purely cognitive reading misses that Leonard *wants* to be deceived. He ignores evidence (like the matching license plates) because the extended system serves a therapeutic, not a truth-tracking, function. This challenges the EMT assumption that cognitive extensions are primarily truth-aimed.

  ### 5. Conclusion: Memory vs. Will

  Does the case motivate a distinction between extending memory and outsourcing will? **Yes, emphatically.**

  *   **Extending Memory:** This preserves the agent's sovereignty. I use a notebook to remember a phone number so *I* can decide whether to call.
  *   **Outsourcing Will:** This constrains the agent's sovereignty. I use a tattoo to ensure *I must* kill a man, regardless of what I might decide if I knew the whole truth.

  *Memento* suggests that when we externalize our cognition, we risk externalizing our agency. Leonard's tragedy is not that he lost his memory; it is that he turned his mind into a machine that could be reprogrammed by his past self. For your seminar, the takeaway is that the Extended Mind Thesis needs a companion **Extended Agency Thesis** that accounts for how external tools can constrain, manipulate, or colonize the will, not just store data.

  In sum, *Memento* is not a confirmation of EMT; it is a stress test that reveals the ethical and agential vulnerabilities inherent in coupling our minds to the world. Use the film to show that "glue and trust" are not just functional requirements, but normative ones. When trust breaks, the mind does not just shrink; it fragments.
