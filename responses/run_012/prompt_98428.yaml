answer: |-
  You are spot on. Your hypothesis is correct, but I think you can push it a little further to explain why everyone gets so angry about it.

  Here is the diagnosis: You are dealing with a **category error disguised as a factual disagreement.**

  Your three questions are the right tools to cut this knot. Let's label them simply so your group can use them:

  1.  **The Kernel:** Did *something* happen? (A war, a battle, a migration).
  2.  **The Map:** Is the story we have an accurate guide to what happened?
  3.  **The Name:** Does the story belong to the Kernel, even if the Map is wrong?

  Here is where the hidden work is sitting, and why your group is stuck.

  ### 1. The Fight About Thresholds
  The Maximalists and Minimalists agree on the data (the ruins, the stele, the texts). They disagree on the **threshold of distortion.**

  *   **The Maximalist view:** If there is a Kernel (Q1), the story keeps the Name (Q3). Even if the Map (Q2) is full of dragons and gods, the story is "about" the real event because there is a causal chain. Someone saw something, told someone, who told someone, until it became the *Iliad*. To them, "History" means "rooted in reality."
  *   **The Minimalist view:** If the Map (Q2) is too wrong, the link is broken. If you say a ten-year siege happened over a woman, and archaeology shows a city burned during a trade dispute, the story is no longer "about" that event. It's a new story inspired by an old event. To them, "History" means "an accurate account of reality."

  So, when a Maximalist says, "There is evidence for the Trojan War," they mean Q1 (There was a war at Troy). When a Minimalist says, "There is no evidence for the Trojan War," they mean Q2 (There is no evidence for the *story* of the Trojan War). They are using the same words to point at different targets.

  ### 2. The Definition of "History"
  The substantive disagreement underneath the verbal one is about what history is supposed to *do*.

  *   One side thinks history's job is to preserve **identity**. (This is *our* story, it connects us to that past, so the link matters more than the details).
  *   The other side thinks history's job is to preserve **accuracy**. (If the details are made up, the connection is worthless).

  This is why they talk past each other. You can't compromise on this. Either accuracy is the point, or connection is the point.

  ### 3. The "Reference" Problem (Your Question 3)
  You asked if a name can stick to a real thing even if the stories are false. In philosophy, this is the difference between a "causal theory of reference" and a "descriptive theory."

  *   **Causal (Maximalist lean):** I can tell a crazy story about George Washington chopping down a cherry tree. It's false. But I am still talking about George Washington. The name sticks because of the chain of telling, not because every detail is true.
  *   **Descriptive (Minimalist lean):** If I tell a story about a wizard king named Arthur who fought Saxons with magic swords, and the real person was a Roman officer named Artorius who fought Picts with spears, I am not talking about Artorius. I am talking about a character named Arthur. The description matters more than the name.

  Your group is fighting because they haven't agreed on which rule applies to ancient legends. Does the name "Arthur" travel down the centuries like a baton in a relay race (Causal), or does it have to match the facts to keep the name (Descriptive)?

  ### What Counts as Progress?
  You asked if this can be settled. It cannot be settled factually because the facts aren't the problem. The problem is the rules of the game.

  **Progress looks like this:**
  Stop asking "Did it happen?" That question is too heavy. It forces everyone to pick a side on all three of your questions at once.

  Instead, force the group to separate the questions. Before discussing a legend, ask the group to agree on which question they are answering.
  *   "Are we asking if a battle happened at Badon Hill?" (Q1)
  *   "Are we asking if Geoffrey of Monmouth told the truth?" (Q2)
  *   "Are we asking if the King Arthur legends are *about* that battle, even if Geoffrey lied?" (Q3)

  **The Verdict on the Fight:**
  This is a **verbal disagreement** fueled by **different standards of evidence.**
  *   It is verbal because they define "The Trojan War" differently. One means "The destruction of Layer VI at Hisarlik," the other means "The story of Helen and Achilles."
  *   It is about standards because they disagree on how much myth destroys history. Does 10% truth make it history? 50%? 90%?

  **Recommendation:**
  Don't try to solve the history. Solve the definitions.
  Next meeting, propose a rule: No one can say "It happened" or "It didn't happen" without specifying which of your three questions they are answering.

  If you do that, you'll find the Maximalists are mostly answering Q1 and Q3, and the Minimalists are mostly answering Q2. Once they see they are playing different sports, the fighting should cool down. They won't agree on the answer, but they'll stop being mad that the other side isn't seeing the "obvious" truth.
