  I am afraid to **ask**
  Where the regress must **stop**,
  Lest I choose the **base**.

  I want a solid **base**,
  Some ontological **virtue**,
  To make the questioning **stop**.
  But nothing here is **made**
  To answer when I **ask**,
  Except the **matter**.

  No **base** holds up what is **made**,
  Just the **virtue** in the **ask**,
  Where **stop** and **matter** meet **Silence**.

  Bottom line: The poem suggests the chain ends where language fails, leaving it unclear whether that limit is truth or exhaustion.
