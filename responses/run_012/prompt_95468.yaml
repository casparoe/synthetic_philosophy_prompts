answer: |-
  # Session Plan: The Wager on the Limit
  **Course:** Philosophy of Mathematics (Year 2)  
  **Topic:** Supertasks and the Underdetermination of Limits (Thomson's Lamp)  
  **Duration:** 90 Minutes  
  **Students:** 18  
  **Format:** Single Guided Activity (No Lecture)

  ---

  ## 1. Materials Required
  1.  **Whiteboard & Markers:** Black, Red, Blue, Green.
  2.  **Wager Cards (Photocopiable):** 3 sets of 18 cards each.
      *   *Set A (ON):* Printed in Green. Text: "I wager the lamp is ON at $t=1$."
      *   *Set B (OFF):* Printed in Red. Text: "I wager the lamp is OFF at $t=1$."
      *   *Set C (UNSETTLED):* Printed in Blue. Text: "I wager the state is LOGICALLY UNDETERMINED."
      *   *Space on card for:* Student Name, Group Number, Signature.
  3.  **Sequence Sheets:** 6 sheets (one per group). Each lists the switching times: $1/2, 3/4, 7/8, 15/16 \dots$ and the state at $t=0$ (OFF).
  4.  **The "Bank of Logic" Stamp:** A physical stamp or distinct marker to signify official validation.

  ---

  ## 2. The Rules of the Activity
  1.  **The Machine:** You are given the specification of a lamp. It is OFF at $t=0$. It is toggled (ON to OFF, or OFF to ON) at $t=1/2, 3/4, 7/8, \dots$ (intervals of $1/2^n$).
  2.  **The Task:** Your group must determine the state of the lamp at $t=1$.
  3.  **The Wager:** Each student must sign one Wager Card. You are betting your philosophical reputation. If your group's consensus is proven by the rules provided, you win. If the rules do not prove your claim, the Bank refuses to pay.
  4.  **The Constraint:** You may not appeal to physics (e.g., "lamps burn out"), psychology, or external metaphysics. You must derive the answer *solely* from the switching description provided.

  ---

  ## 3. Minute-by-Minute Plan

  ### Phase 1: Calibration and Commitment (0–25 mins)
  *   **00–05:** **Distribution.** Divide students into 6 groups of 3. Hand out Sequence Sheets and piles of mixed Wager Cards.
  *   **05–10:** **Generation.** Ask groups to write out the state of the lamp at the first 5 switching points on their whiteboard space (or paper).
      *   $t=0$: OFF
      *   $t=1/2$: ON
      *   $t=3/4$: OFF
      *   $t=7/8$: ON
      *   ...
  *   **10–15:** **The Pattern.** Ask them to describe the state at $t_n = 1 - (1/2^n)$.
      *   *Prompt:* "Is there a formula for the state at step $n$?" (Answer: Parity of $n$).
  *   **15–25:** **The Wager.** Instruct students to choose a card, sign it, and place it in the centre of their table. They must agree within their group, but every individual must stake a claim. Collect all 18 cards into a "Bank Box".

  ### Phase 2: The Default of the Bank (25–40 mins)
  *   **25–30:** **The Adjudication.** You act as the Bank Manager. Begin to "pay out" the winners.
      *   Pick a group that wagered ON. Ask: "Show me the rule in the description that forces this."
      *   Pick a group that wagered OFF. Ask: "Show me the step where the lamp stays OFF after being switched."
      *   Pick a group that wagered UNSETTLED. Ask: "If it is unsettled, what does that imply about the completeness of the description?"
  *   **30–35:** **The Refusal.** Announce that *no* payout can be made.
      *   *Statement:* "The description fixes the state for every $t < 1$. It says nothing about $t = 1$. Therefore, the Bank cannot validate any claim based *only* on the rules given."
  *   **35–40:** **Frustration Elicitation.** Allow the grumbling. Ask: "Why does this feel unsatisfactory? We know the sequence. Why don't we know the end?"
      *   *Key Question:* "Which switch was the last one?" (They must realise there is no last switch).

  ### Phase 3: The Contrasting Machine (40–55 mins)
  *   **40–45:** **Introduce Machine B (The Dimmer).**
      *   *Specification:* A light dimmer. At $t=0$, brightness is 0. At $t=1/2$, brightness is $1/2$. At $t=3/4$, brightness is $3/4$. At $t_n$, brightness is $t_n$.
      *   *Task:* What is the brightness at $t=1$?
  *   **45–50:** **Consensus.** Students will almost universally agree the brightness is 1 (Full On).
  *   **50–55:** **Comparison.** Ask: "Both machines run through infinite steps before $t=1$. Why is Machine B settled and Machine A unsettled?"
      *   *Guide them to:* Machine B has a *continuous* function ($f(t) = t$). Machine A oscillates.
      *   *Board Work:* Draw the graph of Machine B (solid line reaching $t=1$). Draw the graph of Machine A (dots oscillating up and down, approaching $t=1$ but with no dot *at* $t=1$).

  ### Phase 4: The Two Specifications (55–70 mins)
  *   **55–60:** **The Staged Revelation.** Tell them you have two secret documents from the Engineer who built the Lamp.
      *   *Document 1:* "The Lamp is OFF at $t=1$."
      *   *Document 2:* "The Lamp is ON at $t=1$."
  *   **60–65:** **Consistency Check.** Ask: "Does Document 1 contradict the switching rules for $t < 1$?" (No). "Does Document 2 contradict the switching rules for $t < 1$?" (No).
  *   **65–70:** **The Visual Proof.** On the whiteboard, draw the time axis $0$ to $1$.
      *   Draw the oscillating points for $t < 1$.
      *   In **Blue**, draw a filled circle at $(1, \text{OFF})$. Label "Specification A".
      *   In **Red**, draw a filled circle at $(1, \text{ON})$. Label "Specification B".
      *   *Point:* "These are two different functions that agree everywhere on $[0, 1)$ but disagree at $\{1\}$. The infinite sequence does not pick one."

  ### Phase 5: Debrief and Context (70–90 mins)
  *   **70–80:** **Mapping the Concepts.**
      *   *Determinate Steps:* The switching rules (fixed for all $n$).
      *   *Undetermined Limit:* The state at $t=1$.
      *   *The Gap:* The lack of a "last step". If there were a last switch, the state would be fixed. Because the steps converge to 1 without reaching it, the causal chain does not bridge the gap to $t=1$.
  *   **80–85:** **Scholarly Context (Settled vs. Contested).**
      *   *Settled:* In classical analysis, the limit of the *sequence of states* (0, 1, 0, 1...) does not exist. The function is discontinuous.
      *   *Contested:* Does this mean the supertask is logically impossible? (Thomson said yes; Benacerraf said no, the description is just incomplete). Is physical continuity required for causal determination?
  *   **85–90:** **Closing.** Return the Wager Cards. No winners today. The lesson is that infinity does not guarantee closure.

  ---

  ## 4. Debrief Script: Mapping the Activity
  *Use this structure to synthesise the experience during Phase 5.*

  "You have just felt the gap between the **process** and the **limit**.
  1.  **The Intermediate States:** You could calculate the state at $t=0.999$ easily. Those states were *determinate*. The rules worked perfectly there.
  2.  **The Limit:** At $t=1$, the rules fell silent. You wanted the limit to be a *consequence* of the steps. But a limit is not a step.
  3.  **The Last Step:** To fix the state at $t=1$ via switching, you would need a final switch. But for every switch at $t_n$, there is a later one at $t_{n+1}$. There is no 'last' switch to determine the final state.
  4.  **The Two Specifications:** When I showed you Document A and Document B, you saw that logic alone permits either. To choose one, you must add a *new* rule (e.g., 'the lamp is continuous' or 'the lamp defaults to OFF'). That rule is not in the infinite sequence. It is external.
  5.  **The Contrast:** Machine B (The Dimmer) worked because the function $f(t)=t$ is continuous. The limit is fixed by the *path*, not just the points. Machine A has no path, only points."

  ---

  ## 5. Troubleshooting: Predictable Failures

  **1. The Physics Objection**
  *   *Problem:* Students argue, "In reality, the switch would melt," or "You can't move faster than light."
  *   *Handling:* "You are correct physically. But this is a conceptual machine. We are testing logical entailment, not engineering. If the description is logically coherent, the physics is irrelevant. If the description is logically incomplete, better physics won't fix it."

  **2. The 'State Before' Fallacy**
  *   *Problem:* A student insists, "It must be the state it was in immediately before $t=1$."
  *   *Handling:* "Point to the time 'immediately before' $t=1$ on the number line." (They cannot). "For any time you pick before 1, I can pick a later time where the state is different. There is no 'immediately before'."

  **3. Premature Consensus on 'Undefined'**
  *   *Problem:* One clever student shouts "It's undefined!" and the group coasts.
  *   *Handling:* Challenge them. "If it is undefined, does that mean the lamp vanishes? Does it mean the description is contradictory? You must define what 'undefined' means for a physical object. Is 'Undefined' a state?" (This forces them to grapple with the metaphysics).

  **4. Boredom during Sequence Generation**
  *   *Problem:* Writing out $1/2, 3/4 \dots$ is tedious.
  *   *Handling:* Keep Phase 1 tight. Stop them after 5 steps. The pattern is obvious; the tedium is intentional to simulate the infinite regress, but don't let it drag.

  ---

  ## 6. Limitations: What You Must Supply
  This activity successfully demonstrates *underdetermination*, but it cannot reproduce the following without your explicit instruction:

  1.  **The Topological Reason:** The activity shows *that* the limit is unsettled, but not the rigorous topological *why* (i.e., the set of switching times is not closed; $t=1$ is a limit point not in the domain of the switching function). You must articulate that the domain of the function given is $[0, 1)$, and asking for $f(1)$ is asking for a value outside the defined domain.
  2.  **The Causal Principle:** The activity hints that causality fails, but you must explicitly state the principle: "Causal determination requires a contiguous chain." The students feel the break, but you must name it.
  3.  **The Distinction between Epistemic and Ontic:** Students may think "We don't *know* the state" (epistemic) rather than "There *is no fact* of the matter" (ontic). You must clarify in the debrief that the activity demonstrates ontic underdetermination given the premises.

  ---

  ## 7. Scholarly Context: Settled vs. Contested
  *Do not present the following as settled fact. Present them as the landscape of the debate.*

  **Settled (Mathematical Consensus):**
  *   The sequence of states $(0, 1, 0, 1, \dots)$ does not converge in the standard topology of real numbers.
  *   The function describing the lamp's state is discontinuous at $t=1$.
  *   The value at the limit is not determined by the values preceding the limit without an additional premise (such as continuity).

  **Contested (Philosophical Disagreement):**
  *   **Thomson (1954):** Argued the task is logically impossible because it leads to a contradiction (the lamp must be either on or off, but neither is entailed).
  *   **Benacerraf (1962):** Argued there is no contradiction. The description is simply incomplete. It is not that the lamp *cannot* be on or off, but that the story doesn't *say*. The supertask is logically possible, just underdescribed.
  *   **Causal Continuity (Earman, Norton):** Some argue that physical laws require continuity (e.g., conservation of energy), which would rule out the Lamp but allow the Dimmer. Whether this is a logical truth or a physical contingency is debated.
  *   **The Verdict:** Do not tell them who is right. Tell them: "Thomson saw a paradox; Benacerraf saw a gap. Your wager today was on whether the gap could be bridged by logic alone. The Bank says no."

  ---

  ## 8. Instructor's Note on Tone
  Maintain the persona of the "Bank of Logic". Be polite but rigid. When a student argues passionately for "ON", do not say "No." Say, "Show me the clause in the contract (the problem description) that mandates that." This shifts the burden of proof to the entailment relation, which is the core philosophical lesson. Use British English spelling throughout (e.g., *programme*, *analyse*, *colour*).
