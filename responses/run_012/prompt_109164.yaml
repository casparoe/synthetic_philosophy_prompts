answer: |-
  You are right to be suspicious. The literature often treats Dutch Book arguments (DBAs) as a monolithic block, but they vary wildly in their force. Some establish logical consistency conditions; others rely on pragmatic assumptions that can be dodged; others require physically impossible scenarios.

  Here is the sorting, from "actually constraining" to "philosophical bluff."

  ### Tier 1: The Synchronic Core
  **1. The plain one.**
  **2. Same thing with no bookie.**

  These two are effectively the same argument, but **1** is the honest version and **2** is the philosophical patch. They belong at the top because they are the only ones that don't require assumptions about time, infinity, or decision rules.

  *   **What it gets you:** If you grant that your credences *are* (or entail) betting dispositions, this proves your credences must satisfy the probability axioms (non-negativity, normalization, additivity). It establishes coherence as a minimal requirement for rationality.
  *   **The Pushback:** The "Pragmatic vs. Epistemic" gap. Argument 1 proves you are *pragmatically* exploitable, not necessarily *epistemically* wrong. You can push back by saying, "My beliefs are not betting dispositions" (the "I won't bet" defense). Argument 2 tries to block this by saying the incoherence is internal, but it secretly relies on the same link between belief and price. If you deny that "fair price" has any behavioral cash-value, Argument 2 becomes a tautology about numbers rather than beliefs.
  *   **Order:** 1 is slightly superior to 2 because 2 often tries to hide the behavioral assumption inside the definition of "credence," whereas 1 admits it's about betting behavior.

  ### Tier 2: The Diachronic Heavyweight (With a Crack)
  **3. The one about changing my mind (Lewis's Argument for Conditionalization).**

  This is the standard argument for why you must update by conditionalization ($P_{new}(A) = P_{old}(A|E)$). It is powerful but fragile.

  *   **What it gets you:** It forces Bayesian updating *if* you accept the setup. It shows that deviating from conditionalization makes you vulnerable to a sequence of bets that guarantees a loss over time.
  *   **The Pushback:** You correctly identified the "certainty about update" assumption, but the killer objection is **"the offer itself tells me something."** For the bookie to construct this book, they must know your update rule and the evidence you will receive. If they offer you the bet, that offer conveys information about the truth of A. If you update on the *offer* rather than just the evidence, the Dutch Book disappears. This argument only works in "sterile" environments where bookies know your secrets but reveal nothing by acting on them.

  ### Tier 3: The Overreach
  **4. The one about my future self (Van Fraassen's Reflection Principle).**

  This argues that your current credence should match your expected future credence ($P_{now}(A | P_{later}(A)=x) = x$). It is widely considered weaker than Argument 3.

  *   **What it gets you:** It attempts to bind your current self to your future self, preventing you from thinking "I will believe X later, but I know better now."
  *   **The Pushback:** Reflection is too strong. It fails in cases of **forgetting** or **anticipated irrationality**. If I know I will be drunk at midnight, I should *not* align my current credences with my drunk future credences, yet the Dutch Book argument says I must (or I lose money). The "buy low, sell high" strategy assumes the future bet will actually be offered and accepted, but if my future self is compromised, the trade doesn't go through. The DBA assumes my future self is a reliable trading partner, which contradicts the scenarios where Reflection is most needed.

  ### Tier 4: The Broken Tools
  **5. The infinite one (Countable Additivity).**
  **6. The one about vague credences (Imprecise Probabilities).**

  These are the bottom tier. One requires physical impossibility; the other attacks the wrong target.

  *   **5. What it gets you:** It attempts to force **countable additivity** (that the probability of a countable union of disjoint events is the sum of their probabilities) rather than just finite additivity.
      *   **The Pushback:** It requires a **supertask**. You have to make infinitely many bets in finite time. As you noted, "I never actually lose anything at any finite stage." Most Bayesians (like de Finetti) explicitly rejected countable additivity *because* this DBA is unpersuasive. It survives "I won't bet" only if you are forced to bet on every point, which no one is.
  *   **6. What it gets you:** Nothing. Your friend is wrong, and your intuition is right.
      *   **The Pushback:** A Dutch Book against vague credences (intervals) only works if you assume a specific, permissive **decision rule** (e.g., "accept any bet that is favorable on *some* probability in the interval"). If you use a conservative rule (e.g., "accept only if favorable on *all* probabilities in the interval"), you cannot be Dutch Booked. The incoherence is in the *decision rule*, not the credal state. You correctly calculated that buying A at 0.2 and ~A at 0.2 yields a profit; the friend's argument collapses unless they force you to post sharp prices, which defeats the purpose of having vague credences.

  ---

  ### The Survivor
  If I have to throw all but one away, **Argument 1 (The Plain One)** survives.

  It is the bedrock. Arguments 3 and 4 rely on the coherence defined in 1 to even set up the bets. Argument 5 relies on 1 extended to infinity. Argument 6 tries to attack a modification of 1 but fails. Argument 1 is the only one that establishes a necessary condition for consistency without requiring supertasks, time travel, or specific decision rules. It is the only one that leaves a scar even if you try to dodge it.

  ### What You Got Wrong
  You didn't get much wrong, but you are slightly underestimating the dependency of **Argument 2**.

  You treated 2 as a distinct argument ("Same thing with no bookie"). In reality, **2 is not an independent argument; it is a re-description of 1.** It doesn't add force; it just tries to change the subject from "money lost" to "logical inconsistency." If you push back on 1 by saying "Credences aren't betting prices," Argument 2 evaporates because it has no independent definition of "fair price" other than the betting one.

  Also, on **Argument 6**: You asked if the friend is wrong or if there's a version that works. The friend is wrong about the *credences*, but right that there is a version that works against the *decision rules*. If your friend said, "A bookie can clean out someone who uses E-admissibility with interval credences," they would be correct. But that doesn't prove intervals are irrational; it proves E-admissibility is risky. Your calculation (pay 0.4, collect 1) is correct for a rational agent using interval credences properly.
