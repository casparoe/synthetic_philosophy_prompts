answer: |-
  **Seminar Paper Proposal**

  **Title:** The Architecture of Convention: Normative Structure, Precedent, and the Visitor's Obligation

  **Project Summary**
  This paper challenges the standard binary framing in the moral philosophy of social norms, which asks simply whether conventions generate obligations. Using the "Visitor Problem" (what moral weight do local norms carry for non-members?) as a stress test, I argue that the obligatoriness of a norm depends on its internal structural features rather than its status as a convention *simpliciter*. I propose a typology based on three variables: (1) the economic or social function of the norm (coordination vs. price completion vs. risk allocation), (2) the legibility of non-compliance to the affected party, and (3) the precedent-setting capacity of the violation. By applying this typology to three everyday cases—tipping, queuing, and jaywalking—I aim to demonstrate that moral obligations for visitors and locals are asymmetric. In some cases (e.g., tipping), the visitor may be more tightly bound than the local; in others (e.g., risk-based norms), the local is more tightly bound due to precedent. The project concludes with a preliminary assessment of how this moral typology might inform legal treatments of custom and usage.

  **The Research Question**
  Existing literature tends to treat social norms as a monolithic category. Consequently, debates stall on whether "conventions" create moral duties. This project asks a more granular question: **Do the structural features of a specific social norm determine the scope of moral obligation for non-members, and do these features generate asymmetric obligations for locals versus visitors?**

  A determinate answer requires moving beyond the question "Is there an obligation?" to "Under which structural conditions does the obligation bind the visitor more than the local, and vice versa?"

  **State of the Debate and The Gap**
  Current approaches to the normativity of everyday life generally fall into four camps, all of which leave the Visitor Problem indeterminate:

  1.  **Coordination-Based Accounts:** These argue norms are obligatory because they solve coordination problems. *Limitation:* They cannot distinguish between a queue (where any stable rule works) and tipping (where the specific rule matters economically). They imply visitors should always comply to maintain stability, failing to capture why we might forgive a visitor for jaywalking on an empty street but not for skipping a queue.
  2.  **Fairness/Reciprocity Accounts:** These argue obligations arise from not free-riding on the cooperative efforts of others. *Limitation:* They struggle with norms where the "benefit" is diffuse (like traffic norms) or where the visitor has not voluntarily accepted the benefits of the scheme. They treat the visitor as a potential free-rider in all cases, missing the nuance of temporary membership.
  3.  **Harm-Based Accounts:** These focus on whether violation imposes risk or loss. *Limitation:* They often classify tipping as non-obligatory because the harm is economic rather than physical, or jaywalking as permissible if no cars are present. They fail to account for the *symbolic* harm or the erosion of the norm itself, which may differ for a visitor versus a local.
  4.  **Voluntarist/Expectation Accounts:** These suggest obligations arise only when one voluntarily opts into a practice. *Limitation:* This makes the visitor's obligation vanish almost entirely, which contradicts strong intuitions about certain norms (like tipping) where ignorance is not a full excuse.

  The gap is not that these theories are unresolved, but that they are applied at too high a level of abstraction. They treat "conventions" as a single kind of object. My hypothesis is that once we disaggregate conventions by their structural mechanics, these theories yield conflicting verdicts that explain the asymmetry between local and visitor obligations.

  **Methodology and Timeline**
  The paper will be approximately 7,000 words. The work will proceed over four months as follows:

  **Month 1: Taxonomy and Matrix Construction**
  *   **Task:** Precisely define the three structural features.
      1.  *Function:* Is the norm a pure coordination device, a price-completion mechanism, or a risk-allocation rule?
      2.  *Legibility:* Is non-compliance visible to the affected party in real-time (allowing for renegotiation or sanction), or only after the fact?
      3.  *Precedent:* Does the violation create a copyable model for third parties? (i.e., Does my violation make it easier for the next person to violate?)
  *   **Deliverable:** Construct a scoring matrix for the three test cases (Tipping, Queuing, Jaywalking).
  *   **Drafting:** Write the introduction and the section critiquing the monolithic view of conventions.

  **Month 2: Stress Testing and Divergence**
  *   **Task:** Apply the matrix to generate verdicts. The goal is to find cases where the standard theories (Fairness vs. Coordination) give opposite answers, but the structural typology gives a consistent explanation.
  *   **Specific Focus:** Investigate the "Visitor Asymmetry."
      *   *Hypothesis A (Tipping):* Because tipping is price-completion with low legibility, the visitor is *more* bound than the local. A regular's non-tip signals server failure; a visitor's non-tip signals visitor defection.
      *   *Hypothesis B (Jaywalking):* Because this is risk-allocation with high precedent, the local is *more* bound. A local's violation degrades the local safety norm; a tourist's violation is seen as an anomaly.
  *   **Drafting:** Write the core argument sections analyzing the three norms through the matrix.

  **Month 3: Criticizable Norms and Limits**
  *   **Task:** Test the typology against norms that *should* be violated. Not all conventions are morally neutral.
  *   **Focus:** Identify a norm where the local practice shifts an obligation onto the party who should not bear it (e.g., a tipping culture that substitutes for a living wage, or a queuing norm that excludes marginalized groups).
  *   **Goal:** Determine if the structural features (like Precedent) make it harder or easier to criticize the norm from the inside vs. the outside. Does the "Visitor" have a *duty* to violate a corrupt local norm?
  *   **Drafting:** Write the section on norm criticism and the limits of compliance.

  **Month 4: Synthesis, Legal Bridge, and Revision**
  *   **Task:** Assemble the argument and address the cross-listed requirement.
  *   **Legal Component:** Draft a dedicated section (approx. 750 words) connecting the moral typology to legal concepts of "custom" and "usage." Focus on how courts determine when a local practice creates a reasonable expectation for outsiders.
  *   **Revision:** Refine for word count and clarity. Ensure the distinction between Legibility and Precedent is sharp.

  **The Analytical Matrix**
  The core of the paper will be a comparative analysis using the following framework. I will score the norms qualitatively (High/Low/Mixed) to show where the moral weight lies.

  | Feature | Tipping | Queuing | Jaywalking (Empty Street) |
  | :--- | :--- | :--- | :--- |
  | **1. Function** | Price Completion (Economic) | Coordination (Order) | Risk Allocation (Safety) |
  | **2. Legibility** | Low (Post-factum) | High (Real-time) | Mixed (Visible but victimless) |
  | **3. Precedent** | High (Sets price baseline) | High (Invites copycats) | High (Normalizes risk) |
  | **Visitor Obligation** | **High** (Must signal good faith) | **Medium** (Must respect order) | **Low** (Precedent is local) |
  | **Local Obligation** | **Medium** (Can critique wage) | **High** (Must maintain order) | **High** (Must set example) |

  *Note: The "Visitor Obligation" row is the target of the argument, not a premise. I will argue that standard theories cannot explain why the Visitor Obligation row varies while the Local Obligation row remains relatively stable.*

  **Success and Failure Conditions**
  *   **Success:** The paper successfully demonstrates that a unified theory of "conventional obligation" is impossible because the structural features pull in different directions. It provides a plausible explanation for why we intuitively judge the Osaka friend's tipping differently from her jaywalking. It establishes that "Precedent" is a distinct moral variable from "Harm."
  *   **Failure:**
      1.  **Collapse:** If the three features (Function, Legibility, Precedent) turn out to be mere proxies for "Harm" or "Fairness" (e.g., if Precedent is just long-term Harm), the typology adds no value.
      2.  **Indeterminacy:** If the matrix yields the same verdict for visitors and locals across all three cases, the asymmetry hypothesis fails.
      3.  **Scope Creep:** If the analysis of "Criticizable Norms" requires a full theory of political obligation, the project becomes unmanageable for 7,000 words.

  **Legal Relevance (Scope Limitation)**
  As this seminar is cross-listed with the law school, I will include a section titled "Implications for Legal Custom." This will not be a full legal analysis but will map the moral features to legal doctrines regarding notice and reasonable reliance.
  *   *Connection:* The "Legibility" feature maps to legal requirements for notice of a custom. The "Precedent" feature maps to the requirement that a custom be "settled and uniform."
  *   *Limitation:* I will explicitly flag this section as provisional. My training is in philosophy, not jurisprudence. The goal is to show *where* the law might look for moral justification when enforcing local customs against outsiders, not to argue for a specific legal ruling. If the philosophical argument holds, the legal section will suggest that courts should distinguish between "coordination customs" (which bind outsiders) and "price-completion customs" (which may require explicit notice).

  **Limitations and Scope**
  *   **Word Count:** 7,000 words is tight for a typological argument plus three case studies plus a legal bridge. I will prioritize the Tipping and Jaywalking cases as the primary contrast, treating Queuing as a secondary control case.
  *   **Empirical Claims:** My claims about how servers interpret tips or how pedestrians interpret jaywalking are phenomenological, not empirical. I will frame them as claims about the *structure of the reasoning* involved, not sociological data.
  *   **Cultural Specificity:** The examples are drawn from Western/Urban contexts (with the Osaka exception). I will limit the claim to industrialized, market-based societies to avoid over-generalizing about "custom" globally.
  *   **The Legal Section:** As noted, this will be clearly labelled as a suggestion for further interdisciplinary work, not a definitive jurisprudential claim.

  **Conclusion**
  This project moves the debate from "Do conventions bind?" to "How do different conventions bind?" By isolating the mechanics of the norm, I aim to resolve the intuitive asymmetry regarding visitors that current theories leave unexplained. If successful, this offers a more precise tool for moral reasoning in everyday life and a clearer framework for understanding when local practices demand compliance from outsiders.
