answer: |-
  - **Shortlist**

  Here are the four core questions structuring the term, ordered from ontological foundation to practical application.

  1. Is the primary unit of letter identity the abstract grapheme, the concrete glyph, or the motor gesture, and which discipline holds the definitional key?
  2. Does perceptual invariance rely on geometric similarity or functional interchangeability within a specific script system, and where does this break down?
  3. Where do computational encoding standards (Unicode) diverge from ontological categories of 'same letter', and does this divergence matter for processing?
  4. Must a generative system presuppose letter identity to produce style, or does identity emerge from the generation process itself?

  - **The case for the ordering**

  **Question 1** is the upstream bottleneck. Without agreeing on the unit of analysis, the group will talk past each other. The linguist defines *grapheme* (functional unit), the designer defines *glyph* (visual instance), and the vision scientist sees *form* (contour). The philosopher's role here is to prevent category errors, ensuring we don't conflate the token with the type. This is highly tractable for this room because it requires conceptual clarification, not data. We spend three sessions here because everyone assumes they mean the same thing by 'letter'. My least confidence lies in reconciling the motor gesture (handwriting) with digital encoding; if the linguist argues gesture is primary, the Unicode representative faces an ontological crisis. This must be first because Q2 assumes we know *what* is being perceived.

  **Question 2** tackles the 'two-storey vs single-storey' problem directly. Since we cannot run psychophysics, we must map the theoretical landscape of invariance. Is recognition structural (Biederman) or statistical? This sits second because you need the unit (Q1) before asking how it's recognized. It is the hardest cluster because the vision scientist cannot appeal to new data. We must rely on existing models to explain why geometrically distinct shapes (single vs two-storey 'a') map to one identity. This is neglected; most assume perception is settled. Here, the empirical/conceptual seam is widest. If the vision person argues invariance is purely contextual, the philosopher must explain what persists across contexts. If we fail here, Q4 becomes impossible.

  **Question 3** grounds the metaphysics in infrastructure. Unicode is a practical ontology. The NLP/Unicode rep can show where standardization forces identity (code points) versus where it allows variation (fonts). This is downstream of Q1 and Q2 because encoding assumes a theory of identity. It is highly tractable; we have the standard in the room. It reveals where 'same letter' is an engineering compromise, not a metaphysical truth. For example, why does Fraktur get a code point while Bold does not? This question moves the discussion from abstract theory to concrete constraint. It tests whether our philosophical distinctions survive contact with computational reality. If Unicode dictates identity rather than reflecting it, our earlier definitions need revision.

  **Question 4** is the synthesis. Letter Spirit requires a model of identity to vary style. If identity is fixed (Q1/Q2), generation is constraint satisfaction. If identity is emergent, generation is exploration. This must be last because it tests the previous conclusions. Type designers drive this. It moves the discussion from 'what is' to 'how do we make'. If the generative model requires a definition of 'a' that contradicts the perceptual model (Q2), we have found a genuine tension between production and perception. This is where the term pays off: a functional framework for building systems that respect letter identity without hard-coding essence. It validates whether our conceptual work has operational utility.

  - **What I'm cutting**

  I am deprioritizing **historical evolution** (how 'a' changed from Roman to Carolingian). While interesting, it is descriptive, not explanatory. Knowing where a form came from doesn't explain why it is identified as 'a' now. I would only restore this if the linguist brings evidence that historical discontinuity creates cognitive discontinuity in modern readers, suggesting identity is path-dependent.

  I am also cutting **legibility and readability metrics**. This is an empirical trap requiring eye-tracking and speed tests, which we cannot do. Furthermore, legibility is about processing efficiency, not identity conditions. A illegible letter is still an 'a'. Finally, I am avoiding **cross-script identity** (is Cyrillic 'a' the same as Latin 'a'? ). This is too broad for twelve sessions. We must solve intra-script variation first. If the Unicode representative shows that cross-script confusion is a primary driver of encoding decisions, I would swap this in for Q3, but currently, it dilutes the focus on essence.

  - **What would reshuffle it**

  **Q1** moves downstream if the linguist proves graphemes are purely phonological, not orthographic. A good session would involve mapping phoneme-grapheme mismatches to see if identity holds without sound. **Q2** moves upstream if the vision person demonstrates invariance is impossible without semantic context. The session would then focus on word-level recognition rather than letter-level. A good session here requires the vision scientist to sketch models, not show data.

  **Q3** becomes primary if the Unicode rep shows encoding drives design, not vice versa. The session would analyze recent encoding proposals to see if technology dictates ontology. **Q4** moves up if generative AI demonstrates identity is simply latent space distance. The session would involve examining vector embeddings of glyphs. A genuinely good session on any question avoids presentations. It requires structured debate on a whiteboard, forcing the type designer to challenge the philosopher's definitions against practical constraints, ensuring the theory survives contact with the real world.
