  # KARMA POSITION SORTER: A DECISION TREE

  **INSTRUCTIONS:** Follow the path that matches your commitment. Mark empty nodes are flagged with **[EMPTY]**.

  **Q1. MECHANISM & IMAGERY:** Is karma a judgment made by an agent, or a causal law like gravity?
  │
  ├── **JUDGMENT** (Picture: **LEDGER** — Debts/Credits kept by someone)
  │   │
  │   ├── **Q4. PURPOSE:** Is suffering retributive (because you did wrong), educative (to change you), or descriptive?
  │   │   ├── Retributive/Educative → Go to Q3.
  │   │   └── Descriptive → **[EMPTY: Incoherent]** (A ledger implies transaction, not mere description).
  │   │
  │   └── **Q3. IDENTITY:** Does the sufferer have to be the "same" person who acted?
  │       ├── Yes (Self persists) → Go to Q6.
  │       └── No (No-Self) → **[EMPTY: Incoherent]** (Who pays the debt if there is no owner?).
  │
  └── **CAUSAL LAW** (Picture: **WEATHER** — Standing condition OR **ECOSYSTEM** — Causal network)
      │
      ├── **Q2. DESERT SURVIVAL:** Can there be deserved suffering with no one who intended it?
      │   ├── Yes (Desert survives) → Go to Q3.
      │   └── No (Desert is error) → Go to Q4 (Purpose must be Descriptive).
      │
      └── **Q3. IDENTITY:** Does the sufferer have to be the "same" person who acted?
          ├── Yes (Self persists) → Go to Q6.
          └── No (No-Self causal stream) → Go to Q6.

  **Q6. ATTACHMENT:** Does karma attach to acts, intentions, or whole lives/groups?
  │
  ├── **Acts/Intentions** → Go to Q5.
  └── **Whole Lives/Groups** → **[EMPTY: Unattractive]** (Collective desert clashes with individual causality in most models).

  **Q5. TESTABILITY:** How long can ripening be deferred before the claim stops being testable?
  │
  ├── **Must be testable/falsifiable** → See Leaves 1-3.
  ├── **Deferred indefinitely (Faith)** → See Leaves 4-5.
  └── **Testability irrelevant (Story)** → See Leaf 6.

  ---

  ### LEAVES (POSITIONS)

  **1. THEISTIC GOVERNANCE** (Path: Judgment → Retributive → Self → Testable/Faith)
  *   Karma is moral governance by a divine agent. Ledger is literal.
  *   *Status:* (a) Theistic governance.

  **2. IMPERSONAL COSMIC FITTINGNESS** (Path: Law → Desert Survives → Self → Weather)
  *   Universe has moral structure without a judge. Suffering fits the act.
  *   *Status:* (b) Impersonal cosmic fittingness.

  **3. HARD DETERMINISM** (Path: Law → No Desert → No-Self → Ecosystem → Descriptive)
  *   Karma is just causality. "Desert" is a category error.
  *   *Status:* (f) Hard determinism.

  **4. NO-SELF CAUSAL STREAM** (Path: Law → Desert Survives (as causal fact) → No-Self → Ecosystem)
  *   Continuity exists without owner. Suffering propagates like energy.
  *   *Status:* (c) The no-self causal stream.

  **5. USEFUL FICTION** (Path: Any → Desert = Fiction but retained)
  *   Desert is false, but believing it aids practice.
  *   *Status:* (e) Useful fiction. **[FLAG: Overlaps with 6 if utility = control]**.

  **6. SOCIAL CONTROL / ACCRETION** (Path: Any → Desert = Story for control)
  *   Desert is a later invention to enforce norms. Not testable.
  *   *Status:* (d) The position that the desert reading is a later accretion. **[FLAG: Overlaps with 5]**.

  ---

  ### EMPTY SPOT ANALYSIS
  *   **Judgment + No-Self:** **Incoherent.** A ledger requires an account holder.
  *   **Ledger + Ecosystem:** **Incoherent.** Transactional vs. Network imagery clash.
  *   **Law + Retributive + No Desert:** **Unstable.** Retribution requires a deserving subject.
  *   **Collective Karma + Ledger:** **Unattractive.** Group sin violates individual moral agency assumptions.

  ### IDENTICAL LEAF FLAG
  *   **Leaves 5 & 6:** Both deny ontological reality of desert. Distinguished only by *intent* (beneficial aid vs. coercive control). If intent is mixed, these leaves merge.
