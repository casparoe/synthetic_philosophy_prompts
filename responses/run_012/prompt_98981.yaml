          *   T1: 1, 7 (In-situ Finks).
          *   T2: 3, 5 (Mimic & Mental Fink).
          *   T3: 4, 6 (Removal Fink & Ubiquitous Mask).
          *   T4: 2, 8 (Standard Masks).

      *   *Wait, one more check:* Case 6 (Antibiotic). "In every actual patient...". This makes the counterfactual "If administered to a patient, it would cure" FALSE. This is a Mask. But because it's *every* patient, it looks like the disposition is false. This is a strong Mask. Is it stronger than 4? 4 is a Fink. Finks break the logic of the counterfactual evaluation (the antecedent triggers the failure). Masks just make the antecedent world "impure". Finks are usually deemed more problematic for SCA. So 4 > 6 is correct.

