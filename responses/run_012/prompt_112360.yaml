prompt: |-
  ok so me and this other kid in debate club (Theo) have been going at it about sex work for basically a whole year and our coach says we have to stop just yelling across the table and actually write down where we agree and where we dont. So I need you to write the joint statement that both of us can put our names on.

  Quick background: I'm the Nordic model one — criminalize the buying, leave the person selling alone. Hes the decrim one, hes done like three projects on New Zealand, and we both think the Germany/Netherlands version where its legal and licensed is a mess, just for different reasons. Our teacher keeps telling us we're "arguing past each other" which is annoying but probably true.

  Whats in it:

  1. The agreed claims — stuff we can both sign without feeling tricked, including about legalization being the wrong frame. No weasel wording.
  2. Our actual disagreements, each one written in the wording that side would accept for itself (so write my position the way I'd defend it and his the way he'd defend it, dont make either of us sound like a cartoon).
  3. The cruxes — the sub questions where if one of us got convinced, we'd actually have to change our position. Not "does trafficking exist," something real.
  4. For each crux: a case, test, or piece of evidence we'd BOTH agree counts as relevant, plus each of our predictions written down in advance. Dont invent statistics — if a number is what matters, say what data would settle it instead of making one up.

  Some things I want in there because they're where we actually get stuck: our teacher gave us this test where you ask, for any rule, who ends up carrying the risk when it goes wrong — the worker, the client, or the neighbours — and we totally disagree about what it shows for the Nordic model. Also the measurement thing: when street numbers go down, is that less prostitution or just less visible prostitution, and can you even ask people about this honestly if the law makes them want to hide. Also whether "sex work is work" is a claim you can just assert or whether it actually settles anything about what the state should be trying to do. Also whether the money should go to exit programs or to labour enforcement and health stuff — I think thats a bigger deal than we admit. And if any part of this is just us meaning different things by the same words ("harm", "coercion", "choice"), say which part and why.

  Then, after the statement, give me a JSON object so I can bring it to club, with exactly these fields:

  - agreed_claims: array of {id, claim, why_both_sign}
  - disagreements: array of {id, topic, nordic_wording, decrim_wording, kind (one of "fact", "value", "concept", "just words"), why_it_matters}
  - cruxes: array of {id, crux, test_we_both_accept, nordic_prediction, decrim_prediction, could_actually_move (me, him, or neither)}
  - words_we_mean_differently: array of {word, how_i_mean_it, how_he_means_it}
  - still_unresolved: array of short strings

  Write the statement itself in first person plural like we're co signing it, no snark, and if one of us has a hole the other already poked a finger through, put it in rather than hiding it, I'd rather know before the tournament.
