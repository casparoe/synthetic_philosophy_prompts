answer: |-
  ### Brainstorming & Diagnostic

  Okay, let's tear this apart before we commit to the page. Your hunch is that *diachronic* cycling can generate money pumps even with *synchronic* transitivity, and that this decouples exploitability from irrationality. That's a spicy claim, but it's walking into a minefield of existing dynamic choice theory. Here is the strongest version of your idea, the ways to formalize it, and where the bodies are buried.

  **The Strongest Version:**
  The standard Money Pump Argument (MPA) is sold as a justification for Synchronic Transitivity. The moral is: "If you violate transitivity, you get pumped; therefore, transitivity is a requirement of rationality." Your counter-example shows: "You can get pumped *without* violating synchronic transitivity."
  The philosophical payload isn't just "time matters." It's that the MPA is actually a *Diachronic Coherence* argument in disguise. If the MPA is supposed to normatively compel us, and it compels us in diachronic cases where synchronic rationality is preserved, then the norm it establishes isn't transitivity—it's *stability*. This forces a wedge between "structurally irrational" (violating logic/constraints at $t$) and "pragmatically vulnerable" (losing value across $t_1 \dots t_n$).

  **Three Ways to Make it Precise:**
  1.  **The Exogenous Shift Model:** Preferences change due to external factors (mood, hunger). You prefer $A \succ B$ Monday, $B \succ A$ Tuesday.
      *   *Verdict:* Too easy. No one calls this irrational. It's just volatility. If this is your model, the project dies in week one.
  2.  **The Myopic Choice Model:** The agent knows their preferences will change but maximizes only current utility at each node (naïve dynamic choice).
      *   *Verdict:* This is the standard "Dynamic Inconsistency" literature (Strotz, 1955). The standard fix is "Sophistication" (anticipating future selves) or "Resoluteness" (sticking to prior plans). If you just reproduce this, you're relabeling McClennen or Bratman.
  3.  **The Normative Gap Model:** You grant that the agent is *myopic*, but you ask whether the *loss of money* constitutes a *rational failure* or merely a *causal vulnerability*.
      *   *Verdict:* **This is the winner.** The literature assumes that if you can be pumped, you are irrational. You are challenging the inference from *Pumped* to *Irrational*. You are arguing that in diachronic cases, being pumped might be a tragic feature of temporal finitude, not a logical flaw.

  **The Risk of Relabeling:**
  The biggest danger is that "Diachronic Cycling" is just "Dynamic Inconsistency" with extra steps. If you define the agent as having foreknowledge of their preference shifts and *choosing* not to bind themselves, standard dynamic choice theory already calls this irrational (failure of sophistication or resolution).
  To make this a genuine contribution, you must isolate a case where the agent *cannot* resolve the cycle via standard means (binding, sophistication) yet remains synchronically rational. Or, you must argue that the *cost* of resolution exceeds the cost of the pump, making the "irrational" choice actually rational. That's where the "Exploitability $\neq$ Irrationality" claim lives.

  **Recommendation:**
  Frame the project not as "discovering diachronic pumps" (that's known), but as "testing the normative force of the Money Pump Argument." Does the existence of diachronic pumps undermine the MPA's ability to prove synchronic transitivity?

  ***

  ### Research Proposal

  **Project Title:** The Diachronic Money Pump: Exploitability Without Intransitivity
  **Applicant:** [Your Name]
  **Fellowship:** Internal Fellowship in Decision Theory

  **1. The Research Question**
  Standard Money Pump Arguments (MPAs) are deployed to demonstrate that synchronic intransitivity is irrational: if an agent's preferences cycle ($A \succ B \succ C \succ A$) at a single time $t$, they can be induced to pay to cycle through options, ending up worse off. The normative inference is: *Vulnerability to a money pump entails irrationality.*

  This project asks: **Does vulnerability to a *diachronic* money pump entail irrationality when synchronic preferences remain transitive at every moment?**

  Specifically, I will test whether the normative force of the MPA relies on *logical incoherence* (intransitivity) or merely *pragmatic vulnerability* (loss of value). If an agent with perfectly transitive snapshots ($A \succ_t B$, $B \succ_{t+1} C$, $C \succ_{t+2} A$) can be pumped, does this demonstrate a failure of rationality, or merely a failure of diachronic control? Resolving this requires determining whether standard rationality requirements (sophistication, resoluteness, binding) are applicable or obligatory in diachronic cycling cases.

  **2. Background and Motivation**
  Existing literature leaves this question open by conflating two distinct families of views.
  *   **The Structuralist View:** Holds that rationality is a matter of satisfying synchronic constraints (transitivity, completeness). On this view, a diachronic pump is not a rational failure unless it stems from a synchronic violation. If the snapshots are clean, the agent is blameless, even if exploited.
  *   **The Pragmatist View:** Holds that rationality is defined by immunity to exploitation (Dutch Book/ Money Pump style). On this view, if you lose money, you are irrational, regardless of whether the flaw is synchronic or diachronic.

  The tension arises in Dynamic Choice Theory. Standard treatments of dynamic inconsistency (e.g., hyperbolic discounting) assume the agent *ought* to resolve the inconsistency via sophistication or pre-commitment. However, these solutions presuppose that the agent has the capacity to bind their future self or treat future preferences as normative constraints. It remains unsettled whether an agent who lacks these capacities—or for whom the cost of resolution exceeds the cost of the pump—is *irrational* or merely *constrained*. The project isolates the diachronic pump to see if it breaks the link between exploitability and irrationality.

  **3. Methodology and Work Plan**
  The project will proceed over one semester (4 months), moving from formalization to normative analysis.

  *   **Month 1: Formalizing the Diachronic Pump.**
      I will construct a decision-tree model where an agent faces a sequence of trades.
      *   *Constraint:* At every node $n$, the agent's preference ordering is transitive and complete.
      *   *Variable:* Preference orderings shift between nodes ($ \succ_n \neq \succ_{n+1} $).
      *   *Task:* Demonstrate that a "Myopic" agent (maximizing current utility only) ends up with a dominated outcome. I will distinguish this from standard dynamic inconsistency by ensuring the cycle requires at least three stages ($A \to B \to C \to A$) to rule out simple time-discounting reversals.

  *   **Month 2: Testing Standard Remedies.**
      I will apply the three standard fixes for dynamic inconsistency to the Diachronic Pump model to see if they dissolve the vulnerability.
      *   *Sophistication:* Does backward induction prevent the trades? (Hypothesis: No, because the future self *wants* to trade).
      *   *Resoluteness:* Can the agent simply choose to stick to a prior plan? (Hypothesis: Only if we assume a normative principle of diachronic coherence, which begs the question).
      *   *Binding:* Is pre-commitment available? (Hypothesis: If binding is costly or unavailable, does the vulnerability persist?)
      *   *Goal:* Identify if there is a "Residual Pump" that survives even when standard rationality tools are applied.

  *   **Month 3: Normative Analysis (Exploitability vs. Irrationality).**
      I will evaluate the status of the agent who succumbs to the Residual Pump.
      *   If the agent is synchronically rational but diachronically vulnerable, is the defect *rational* or *prudential*?
      *   I will argue that if the cost of diachronic coherence (e.g., rigid binding) exceeds the cost of the pump, the "irrational" choice to be pumped is actually rational. This would sever the link between exploitability and irrationality.

  *   **Month 4: Drafting and Refinement.**
      Synthesis of the formal model and normative argument into a draft paper (approx. 8,000 words). Focus on clarifying the implications for the standard Money Pump Argument for transitivity.

  **4. Expected Outcomes and Success Conditions**
  *   **Success:** The project successfully demonstrates that diachronic money pumps do not necessarily imply irrationality. This would require showing that (a) standard remedies (sophistication/resoluteness) fail to block the pump in specific plausible contexts, and (b) the resulting vulnerability is a pragmatic cost of temporality, not a logical defect. This would force a revision of the Money Pump Argument: it proves the need for *diachronic stability*, not *synchronic transitivity*.
  *   **Failure (Negative Result):** The analysis shows that any diachronic pump *does* imply a synchronic defect (e.g., a failure to have preferences over plans) or that standard dynamic choice theory already fully accounts for this. If the project collapses into a restatement of "Myopic Choice is suboptimal," it will not be a genuine contribution.
  *   **Failure (Scope Creep):** The project attempts to solve the problem of personal identity or time preference generally. I will avoid this by sticking strictly to the money pump structure.

  **5. Scope and Feasibility**
  This is a **semester-length project** suitable for a single journal article. The formal modeling is lightweight (decision trees), and the philosophical heavy lifting is in the interpretation of the results. It does not require empirical data or complex logic systems. However, if the "Residual Pump" proves robust, it could expand into a **year-long project** examining the implications for normative ethics (e.g., planning policies) or a **career trajectory** focusing on diachronic rationality. For the purposes of this fellowship, the scope is limited to the theoretical decoupling of exploitability and irrationality in the diachronic case.

  **6. Significance**
  If successful, this project undermines a foundational argument in decision theory. The Money Pump Argument is frequently used to introduce and justify the axioms of Expected Utility Theory. Showing that the argument targets diachronic coherence rather than synchronic consistency would require a significant reframing of how we teach and justify rational choice axioms. It suggests that rationality is not just about having the right preferences, but about having the right relationship with one's future selves—a distinction currently blurred in the literature.
