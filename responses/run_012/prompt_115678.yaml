answer: |-
  Subject: Clarifying the requirements for the Wrong Kind of Reasons problem

  Hi there,

  It is smart to pause and map out the requirements before diving into the specific theories, because the literature is often tangled by people proposing solutions before agreeing on what counts as a success. You are asking for the job description of an account of the Wrong Kind of Reasons problem before hiring anyone for the position. To do this, we need to list the cases the account must get right, the distinctions it must preserve, and the constraints it must obey, while being careful to separate what is generally agreed upon from what is fiercely contested.

  The first and most forced requirement is extensional adequacy. Any viable account must correctly classify the standard paradigm cases. The most famous is the Demon Case, where a demon threatens to kill you unless you admire him. You have a overwhelming reason to bring it about that you admire him, but intuitively, this threat does not make the demon admirable. An account must classify the threat as a Wrong Kind Reason for admiration. Conversely, the demon's cruelty is a Right Kind Reason against admiration. If an account cannot distinguish these, it fails immediately. Similarly, for belief, the account must classify evidence as a Right Kind Reason and pragmatic benefits, like Pascal's Wager, as Wrong Kind Reasons. This is mostly settled ground; almost everyone agrees these classifications are the target data, even if they disagree on why they hold.

  The second requirement is non-circularity. You want an account that says whether a consideration is of the right kind without simply defining the Right Kind as reasons that make the attitude fitting. If the theory says a reason is of the right kind just in case it bears on fittingness, you are left asking what bearing on fittingness means. The account must provide an independent criterion, such as the structure of the reason, the source of the reason, or the relation between the reason and the attitude's aim. This is a forced requirement for a philosophical analysis, though some camps are willing to accept a primitive notion of fittingness if necessary. However, most people working on this want a reductive explanation that does not rely on the very notion it is trying to clarify.

  The third requirement concerns attitude specificity. The account must explain why a consideration might be the Right Kind for one attitude but the Wrong Kind for another. For example, the fact that a belief would make you happy is a Wrong Kind Reason for belief, but potentially a Right Kind Reason for hope or desire. The account cannot simply say that pragmatic reasons are always wrong; it must explain why they are wrong for belief but permissible for desire. This ties into the distinction between factive attitudes like belief, which aim at truth, and non-factive attitudes like desire or admiration, which aim at goodness or value. An account must be consistent with the different normative standards governing different mental states.

  Now let's look at your specific sticking point regarding the confidence pill. You asked whether the fact that confidence raises your odds of passing becomes evidence, and thus a Right Kind Reason. An account must address this loop explicitly. If the account allows pragmatic benefits to count as evidence simply because they make the belief successful, the distinction between Right and Wrong Kind Reasons collapses for all self-fulfilling beliefs. Therefore, a robust account must rule that out. It needs to distinguish between a reason that bears on the truth of the proposition independently of the belief itself, and a reason that bears on the benefits of holding the belief. Even if confidence causes you to pass, the reason for confidence should be the likelihood of passing, not the benefit of passing. The account must explain why the causal link between having the attitude and the outcome does not transform a pragmatic reason into an epistemic one. This is a hard requirement because there is a contested view that in self-fulfilling cases, pragmatic reasons do become Right Kind Reasons. However, the dominant view holds that they do not, because the reason for belief must be truth-conducive in a way that is not merely instrumental. Your proposed account should likely side with the dominant view to maintain the distinction, but it must acknowledge that this is where the boundary is tested.

  This leads directly to your second sticking point, the symmetry issue. You noted that for every Wrong Kind Reason for an attitude, there seems to be a matching Right Kind Reason for a neighboring attitude, such as wanting to have that attitude. The fact that admiration saves your life is a Wrong Kind Reason for admiration but a Right Kind Reason for wanting to admire. An account cannot simply say that Wrong Kind Reasons do not bear on the object of the attitude, because wanting also has an object. Instead, the account must distinguish between reasons that bear on the correctness conditions of the attitude itself versus reasons that bear on the value of being in that state. It must avoid circularity here by not defining the correctness conditions in terms of the reasons. If it says admiration is correct when there are Right Kind Reasons for it, and Right Kind Reasons are those that make admiration correct, it has gone in a circle. The account needs a structural distinction, often framed as object-given versus state-given reasons. Object-given reasons cite properties of the object of the attitude, while state-given reasons cite properties of having the attitude. To handle the symmetry issue without collapsing the distinction, the account must show why state-given reasons are structurally incapable of making an attitude fitting, even if they are genuine reasons to want or cause the attitude.

  Regarding what is forced versus what is wanted by one camp, it is forced that the account handles the Demon Case and the belief versus desire distinction. It is also forced that the account avoids explicit circularity. However, it is contested whether Wrong Kind Reasons are reasons for the attitude at all. Some philosophers argue that threats are not reasons to admire the demon, but rather reasons to want to admire or to try to admire. If you adopt this view, you dissolve the problem by denying the existence of Wrong Kind Reasons for attitudes. This is a live option, but it is not the consensus. The consensus is that there is a distinction to be drawn, but there is disagreement on whether both kinds are reasons for the same target. You should treat the requirement to classify them both as reasons for the attitude as something one camp wants, whereas the requirement to distinguish their normative force is forced.

  There is also significant disagreement on whether the distinction applies to all attitudes. Some argue it is specific to evaluative attitudes like admiration or envy, while others think it applies to belief and intention as well. A comprehensive account should aim to cover all attitudes, but be aware that some theorists restrict the scope. Furthermore, there is disagreement on whether the Right Kind Reasons are identical to the conditions of fittingness. Some say fittingness is fundamental and reasons derive from it; others say reasons are fundamental and fittingness is defined by them. Your requirements list should remain neutral on this direction of explanation, but demand that whichever direction is chosen, it does not beg the question.

  Finally, you asked whether any of these requirements cannot be satisfied at once. There is a significant tension, perhaps an incompatibility, between the requirement for a reductive, non-circular analysis and the requirement for full extensional adequacy. Many proposed accounts that define the Right Kind in terms of object-given reasons run into counterexamples where object-given reasons seem to be the Wrong Kind, or state-given reasons seem to be the Right Kind. This suggests that satisfying the non-circularity requirement might force you to misclassify some intuitive cases, violating extensional adequacy. This is often called the extensional adequacy problem. Additionally, there is a tension between the requirement to handle the confidence pill case and the requirement to avoid ad hocery. If you rule out pragmatic benefits as evidence for self-fulfilling beliefs to save the distinction, you must explain why without simply stipulating that evidence must be independent of the belief. If you cannot provide a principled reason for this independence, the account may seem arbitrary. These tensions suggest that while you can list all these requirements, finding a theory that satisfies them all simultaneously is the core challenge of the literature, and some philosophers argue it is impossible to satisfy them all without accepting some primitive normative notions.

  In summary, you need an account that gets the Demon and Pascal cases right, distinguishes between reasons for having an attitude versus wanting it, explains why pragmatic benefits do not become evidence in self-fulfilling cases, and does so without circular definitions. You should treat the existence of the distinction as settled, but the analysis of what constitutes that distinction as highly contested. Be wary of solutions that dissolve the problem by denying Wrong Kind Reasons exist, as this sidesteps the phenomenological intuition that there is a reason there, just not the right kind. The hardest part will be maintaining the distinction in the face of self-fulfilling prophecies and neighboring attitudes without relying on the very notion of fittingness you are trying to explain.

  Best regards,

  Your Assistant
