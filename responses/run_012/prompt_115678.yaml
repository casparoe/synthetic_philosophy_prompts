prompt: |-
  I'm trying to get clear on the wrong kind of reasons problem before I read any more about it, and I want the requirements list first, before any theory. So here's the target: an account that says, for any attitude and any consideration, whether that consideration is a reason of the right kind -- the kind that bears on whether the attitude is fitting (correct, appropriate, whatever word you like) -- or a reason of the wrong kind, the kind that might make it useful or prudent to have the attitude without touching its fittingness. What does such an account have to deliver? I want the cases it has to get right, with the case behind each requirement; the distinctions it cant collapse; and anything it has to stay consistent with. Then tell me which of those requirements can't all be satisfied at once, if any.

  Two things I especially want it to handle. First, a case I keep getting stuck on: suppose its established that being confident you'll pass an exam actually raises your chance of passing, something about stress and sleep. A doctor offers you a pill that makes you confident with no new evidence. Taking the pill seems clearly worth it -- but does the fact that the confidence helps give you a reason to be confident? And here's the part that bothers me: if you know the confidence raises your odds, doesn't that itself become evidence that you'll pass, and so a right-kind reason after all? I want to know whether the account has to rule that out, and how. Second, the symmetry issue: for every consideration that looks wrong-kind for some attitude there's usually a matching consideration that's right-kind for a neighboring attitude -- the same fact is a reason to want to be confident, wrong-kind for the confidence. So if the account just says wrong-kind reasons don't bear on the object, how does it keep the two apart without going in a circle?

  Also mark which requirements are forced and which are just what one camp wants, and be explicit about what's settled versus what people who work on this genuinely disagree about -- dont sell me a contested view as the consensus. No reading list needed. Write it as continuous prose, no headings, bullets, bold, or tables, like an email. American English.
