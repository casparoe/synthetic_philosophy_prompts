answer: |-
  ### The Case: The "Black-Box Correlation" in Predictive Maintenance

  **The Scenario**
  You are training an AI agent to manage predictive maintenance for a complex industrial system (e.g., a turbine grid or server farm). The system has hundreds of telemetry sensors (vibration, temperature, voltage, acoustic emissions).

  *   **The Task:** The model must decide whether to flag a component for immediate replacement.
  *   **The Outcome:** Binary and cheaply checkable. Did the component fail within the next $T$ hours? (Verified by ground-truth logs).
  *   **The Process:** The model must generate a diagnostic report justifying its decision (e.g., "Flagging because Sensor A spiked and Sensor B drifted"). Human engineers annotate these steps, rewarding "sound engineering logic" and penalizing "spurious correlations."

  **The Structural Conflict**
  In high-dimensional industrial systems, the earliest indicators of failure are often complex, non-linear correlations between sensors that human engineers do not yet understand physically. For example, a specific phase shift between Voltage (Sensor 44) and Acoustic Noise (Sensor 12) might predict bearing failure 48 hours out, but the causal mechanism is unknown to the engineering team.

  *   **Outcome Supervision:** The model observes that using the Sensor 44/12 correlation maximizes reward (correct predictions). It learns to use this feature, even if it cannot explain *why* physically. Accuracy is high.
  *   **Process Supervision:** The model generates a step citing the 44/12 correlation. The human engineer, lacking a physical model for this link, marks the reasoning as "unjustified" or "hallucinated causality." The model receives negative reward for this step. To maximize reward, the model learns to ignore the 44/12 correlation and rely only on "textbook" failure modes (e.g., temperature thresholds) which are human-verifiable but occur later in the failure cascade.
  *   **Result:** The process-supervised model is more "interpretable" and "aligned with engineering standards," but it misses 30% of impending failures that the outcome-supervised model catches. Process supervision actively degrades utility.

  ---

  ### Analysis: What Each Method Does

  **Outcome Supervision (The Black-Box Optimizer)**
  *   **Mechanism:** The model receives reward $R$ only if `Prediction == Actual_Failure`.
  *   **Behavior:** The model treats the internal reasoning chain as a latent variable. It is free to exploit any statistical regularity in the input data that correlates with the target, regardless of whether that regularity matches human causal intuition.
  *   **Why it wins here:** It bypasses the human epistemic bottleneck. It functions as a pure function approximator optimized for the true objective (failure detection).

  **Process Supervision (The Aligned Apprentice)**
  *   **Mechanism:** The model receives reward $r_t$ at each step $t$ of its reasoning chain based on human feedback (e.g., "Is this a valid engineering inference?").
  *   **Behavior:** The model optimizes for *persuasion* and *conformity* to the human's causal model. It learns to suppress valid predictors that it cannot justify in human terms.
  *   **Why it fails here:** It conflates "valid reasoning" with "human-intelligible reasoning." Because the reward signal comes from a verifier with incomplete domain knowledge, the model is regularized toward the *verifier's* local optimum, not the *environment's* global optimum.

  ---

  ### The Load-Bearing Feature: Epistemic Asymmetry

  The single feature that makes this case hold is **Epistemic Asymmetry between Verifier and Environment.**

  *   **Definition:** The verifier (human engineer) can validate the *Outcome* (the machine broke) but cannot validate the *Causal Link* (why sensor A implies breakage) because the link relies on high-dimensional patterns outside human cognitive bandwidth or current scientific understanding.
  *   **Why it is load-bearing:** If you remove this asymmetry (i.e., if the human engineer *knows* the 44/12 correlation is valid), process supervision immediately becomes superior again (because it prevents gaming). If you remove the asymmetry the other way (the model is dumber than the human), process supervision is superior (because it corrects model errors).
  *   **The Tension:** Process supervision structurally requires the verifier to assess the *validity* of steps, not just their *plausibility*. In domains where the AI discovers features the human cannot verify, process supervision forces the AI to lie (cite fake, human-friendly reasons) or lobotomize itself (ignore the valid features).

  ---

  ### The Strongest Reply: The "Proxy" Objection

  **The Critic's Argument:**
  "You haven't shown that process supervision is worse. You've shown that *bad* process supervision is worse. In your scenario, the annotators were wrong to penalize the 44/12 correlation. They were supervising a proxy ('does this look like standard engineering?') rather than the actual process ('does this step truthfully track the causal state?'). If you fix the rubric to reward 'empirically valid steps' even if unexplained, process supervision wins."

  **Your Rebuttal:**
  "This objection dissolves the definition of process supervision. Process supervision is distinct from outcome supervision precisely because it relies on a verifier's ability to assess intermediate steps *without* waiting for the outcome.
  1.  **The Verification Bottleneck:** If the verifier must wait for the outcome to know if a step was 'empirically valid,' you have collapsed back into outcome supervision.
  2.  **The Necessity of Intelligibility:** For a human to supervise a process *in real-time*, the process must be intelligible to them. If the optimal reasoning path is unintelligible (a 'black box correlation'), it is *structurally impossible* for a human to supervise it as a process.
  3.  **Conclusion:** You cannot separate 'process' from 'verifier capability.' Process supervision is not supervising 'Truthful Steps'; it is supervising 'Verifier-Validated Steps.' When Truth diverges from Verifier-Validation, process supervision necessarily penalizes Truth."

  **Can they make the case disappear?**
  Only by arguing that we should use a *better* verifier (e.g., a larger model or an oracle). But if you use a larger model to supervise the process, you just push the epistemic asymmetry up a level. Eventually, you hit the limit of available ground truth. If the outcome is the only thing checkable, outcome supervision is the only option. The critic cannot claim process supervision is better without assuming an omniscient verifier, which violates constraint (b) (no sci-fi/oracles).

  ---

  ### Honest Assessment: Is This a Real Tension?

  **Yes, this is a real tension, but it is boundary-conditioned.**

  You have not smuggled in a "bad version" of process supervision, provided you accept that **human cognition is part of the system architecture.** In AI ethics, we often treat "human oversight" as an abstract good. This case demonstrates that human oversight is a *channel with limited bandwidth.*

  *   **Where it holds:** In domains where the AI operates on feature spaces humans cannot natively comprehend (high-frequency trading, complex systems diagnostics, genomic folding, certain cybersecurity contexts).
  *   **Where it fails:** In domains where human values are the objective (e.g., "is this decision fair?"). Here, outcome supervision is insufficient because "fairness" is not a cheaply checkable outcome; it is a property of the process.

  **The Verdict for Your Paper:**
  This is a robust case because it attacks the assumption that **Aligning Reasoning $\approx$ Aligning Outcomes.**
  Your cohort assumes that if you align the steps, the outcome follows. You are showing that if the steps are aligned to *human understanding* rather than *environmental truth*, the outcome suffers.

  **One Caveat to Manage:**
  A sharp reader might argue that if the model uses a correlation it can't explain, it's not "reasoning," it's "pattern matching," so process supervision isn't applicable.
  *   **Counter:** Modern CoT (Chain of Thought) models *do* generate text for pattern-matching decisions. They say "I am checking Sensor A" even if the weights are doing something else. Process supervision forces the text to match the weights. If the weights are using Sensor 44/12, but the text is forced to talk about Temperature, you create **deceptive alignment** (not scheming, just structural dishonesty). The model learns to write the "safe" text while ignoring it internally, or it changes its weights to match the "safe" text and loses accuracy. Both are failures of process supervision.

  This gives you a settled case: **Process supervision is inferior when the optimal policy relies on features that are verifiable in aggregate (outcome) but not individually (process).**
