prompt: |-
  Bit of a weird one. I'm a first-year in a political theory program and I've somehow ended up helping a neighborhood group that's trying to get our city to stop using referendums for big land-use decisions and switch to a citizens' assembly instead — you know, sortition, thirty-odd people pulled at random, a few weekends of deliberation, then they decide. Anyway we had a meeting last week and it turned into a shouting match about four words. The guy leading the keep-the-referendum side kept saying that only a referendum can tell you the will of the people, full stop, and that you can't manufacture the will of the people in a room of thirty strangers. The assembly woman shot back that a referendum just gives you the will of the people on a bad day, and that a proper deliberative body is the only way to find out what the people would will if they'd actually thought about it. Then someone else piled on that the courts shouldn't be able to strike down a referendum result either, because that's just thwarting the will of the people — same phrase, third argument.

  The annoying thing is all three of them say 'the will of the people' like its completely obvious what it means, and I'm now pretty sure it isn't one thing at all. Can you lay out for me the different precise claims that phrase could actually be making — whose will, will about what, at what time, does it have to be a majority, does it even have to be a single will, is it a claim about what people happen to want or a norm about what makes a decision legitimate — going from the readings that are basically trivial up to the ones that are a whole Rousseauian metaphysics, and for each one tell me whether it's plausible and, way more useful for me, whether it's the reading you'd actually have to be using for the phrase to do the work each of them was making it do. My suspicion is the referendum guy needs a much heavier reading than he realizes, the assembly woman is quietly using a different one, and the courts comment is doing something else again, but I can't put my finger on where each of them is cheating.

  Give it to me as a list or menu I can bring to the next meeting, not an essay — I need to be able to point at a line and say 'that's the one you're leaning on.' And if some of these readings turn out to be the same reading wearing different hats, say so. Sorry this got so long.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** First-year political theory student.
      *   **Context:** Helping a neighborhood group advocate for citizens' assemblies (sortition) over referendums for land-use decisions.
      *   **Problem:** A meeting devolved into an argument where three different parties (Referendum Proponent, Assembly Proponent, Court/Anti-Judicial Review Proponent) all used the phrase "the will of the people" to mean different things, causing confusion.
      *   **Task:** Create a "menu" or list of precise claims/interpretations of "the will of the people."
      *   **Requirements:**
          *   Range from trivial/empirical to heavy/metaphysical (Rousseauian).
          *   For each interpretation: Is it plausible? Does it support the specific argument being made (Referendum vs. Assembly vs. Courts)?
          *   Format: List/Menu (not an essay).
          *   Goal: Enable the user to point at a specific line during the next meeting and identify which conception a speaker is relying on.
          *   Tone: Academic but accessible, sharp, analytical, slightly informal (matching the user's "weird one" vibe).

  2.  **Deconstruct the Three Arguments:**
      *   *Referendum Guy:* "Only a referendum tells you the will... can't manufacture it in a room." -> Implies *Will = Aggregated Preference of All Eligible Voters at a Specific Moment.*
      *   *Assembly Woman:* "Referendum is will on a bad day... assembly finds what people would will if they thought about it." -> Implies *Will = Considered Judgment / Rational Preference / Hypothetical Consent.*
      *   *Court Commenter:* "Courts shouldn't strike down referendums... thwarting the will." -> Implies *Will = Sovereign Authority / Unchecked Power / Legitimacy Source.*

  3.  **Brainstorm Conceptions of "The Will of the People":**
      *   *Simple Aggregation:* Counting heads. (Downs, Schumpeter)
      *   *Majority Rule:* 50% + 1.
      *   *Supermajority/Consensus:* Higher bar.
      *   *Deliberative/Reflective:* What they *would* want if informed. (Habermas, Rawls)
      *   *General Will (Rousseau):* Common good, distinct from sum of private wills.
      *   *Constituent Power:* The people as the source of law, above the law. (Sieyès, Schmitt)
      *   *Historical/Tradition:* What the people *have* willed over time.
      *   *Representation:* What elected reps say the people will.

  4.  **Select and Refine for the "Menu":**
      *   Need to organize these logically, from "thin" to "thick."
      *   Need to map them to the three speakers.
      *   Need to assess plausibility and utility.

      *   *Drafting Item 1: The Headcount (Empirical Aggregation).* Simple sum of preferences. Supports Referendum Guy. Plausible but shallow.
      *   *Drafting Item 2: The Majority Principle (Decision Rule).* Focus on the 50%+1 threshold. Supports Referendum Guy (against courts). Plausible but ignores minorities.
      *   *Drafting Item 3: The Considered Judgment (Deliberative).* What people want after learning/discussing. Supports Assembly Woman. Plausible but hard to measure.
      *   *Drafting Item 4: The General Will (Rousseau).* The common good, distinct from private interest. Supports Assembly Woman (if she claims to find the *true* good). Metaphysically heavy.
      *   *Drafting Item 5: The Constituent Power (Sovereign).* The people as the ultimate authority, unconstrained. Supports Court Commenter (no judicial review). Plausible in revolution, tricky in constitutionalism.
      *   *Drafting Item 6: The Procedural Will (Institutional).* Whatever the rules say counts as the will. Neutral/Analytical.

  5.  **Develop the Content for Each Item:**
      *   *Name:* Clear label.
      *   *Definition:* Whose will? About what? When?
      *   *Plausibility Check:* Does it make sense?
      *   *Who's Using It?* Map to Referendum Guy, Assembly Woman, Court Commenter.
      *   *The "Cheat":* Where is the conceptual slippage?

  6.  **Review against Constraints:**
      *   *List/Menu format?* Yes.
      *   *Not an essay?* Yes.
      *   *Pointable lines?* Yes.
      *   *Address the "cheating"?* Yes, need to highlight where they swap definitions.
      *   *Tone:* Keep it sharp. "Here is the menu."

  7.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between the Referendum Guy's claim about *epistemology* (how we know the will) vs. the Court Commenter's claim about *authority* (who overrides whom). They might both like referendums, but for different reasons.
      *   *Correction:* Ensure the Assembly Woman's claim isn't just "elitism." It needs to be framed as *counterfactual preference* (what they *would* will).
      *   *Addition:* Add a "How to Catch Them" section for each, so the user knows what question to ask.

  8.  **Final Polish:**
      *   Check the Rousseau reference (make sure it's accurate).
      *   Ensure the distinction between "Will of All" vs. "General Will" is clear.
      *   Make sure the "Court" argument is identified as *Constituent Power* or *Popular Sovereignty* rather than just majority rule.

  9.  **Final Output Generation:** (Proceeding to generate response based on these steps.)
answer: |-
  This is a classic political theory trap. You are correct: "The Will of the People" is not a single concept; it is a placeholder that different theories fill with different content. Your colleagues are talking past each other because they are operating with different ontologies of "the people" and different epistemologies of "the will."

  Here is a menu of six distinct conceptions of "The Will of the People," ranked from thin/empirical to thick/metaphysical. I have mapped which speaker is relying on which conception, assessed its plausibility, and provided a "trap question" you can use in the meeting to expose when they are swapping definitions.

  ### 1. The Aggregated Preference (The Headcount)
  *   **Definition:** The sum of individual private preferences held by eligible voters at a specific moment ($t_1$).
  *   **Whose Will:** Every voter equally.
  *   **About What:** Immediate self-interest or gut reaction.
  *   **Time:** The exact moment the ballot is cast.
  *   **Plausibility:** High empirical clarity, low normative depth. It is easy to measure, but easily manipulated by misinformation or panic.
  *   **Who is using it:** **The Referendum Guy.** He needs this definition to claim the referendum is the *only* legitimate measure.
  *   **The Cheat:** He treats this raw data as "final" rather than "input." He ignores that preferences can be adaptive or uninformed.
  *   **Trap Question:** "If 51% of people vote to seize a specific neighbor's house because they don't like their lawn, is that the 'will of the people' we should follow, or is the will something more than just a count of impulses?"

  ### 2. The Considered Judgment (The Deliberative Will)
  *   **Definition:** The preferences people *would* hold if they were fully informed, free from coercion, and forced to listen to opposing arguments.
  *   **Whose Will:** The same voters, but in a hypothetical "better" state of mind.
  *   **About What:** Public good, not just private interest.
  *   **Time:** Timeless/Counterfactual (What they *would* will, not what they *do* will).
  *   **Plausibility:** Normatively strong, empirically murky. Hard to prove a small group actually represents what the larger group *would* think.
  *   **Who is using it:** **The Assembly Woman.** She needs this to argue that a referendum is "will on a bad day."
  *   **The Cheat:** She assumes the assembly successfully reaches this "considered" state and that it translates back to the whole populace.
  *   **Trap Question:** "How do we verify that the thirty people in the room actually arrived at what the rest of us *would* think, rather than just what *they* think after a weekend of talking?"

  ### 3. The General Will (The Rousseauian Metaphysics)
  *   **Definition:** A singular common interest that exists distinct from the sum of private wills. It is objective, not subjective.
  *   **Whose Will:** The body politic as a single organism.
  *   **About What:** The common good (which may contradict what individuals *want*).
  *   **Time:** Permanent/Enduring.
  *   **Plausibility:** Metaphysically heavy. Requires believing there is a "true" interest the people have even if they vote against it.
  *   **Who is using it:** **The Assembly Woman (implicitly).** If she claims the assembly finds the *right* answer, not just a *considered* one, she is sliding into this.
  *   **The Cheat:** This is dangerous. If the people vote against the General Will, Rousseau says they are "wrong." This can justify authoritarianism.
  *   **Trap Question:** "If the citizens' assembly decides X, but a referendum says Y, are you saying the assembly is 'truer' even if more people disagree? Are we saying the people can be wrong about their own will?"

  ### 4. The Majoritarian Command (The Decision Rule)
  *   **Definition:** The will is simply whatever option crosses the threshold (50% + 1) in a binding vote.
  *   **Whose Will:** The Majority. (The minority is conceptually erased).
  *   **About What:** Policy direction.
  *   **Time:** The moment of victory.
  *   **Plausibility:** Practical for decision-making, but morally risky. It conflates "winning" with "willing."
  *   **Who is using it:** **The Referendum Guy & The Court Commenter.** They use this to argue that once the vote is counted, the matter is settled.
  *   **The Cheat:** It treats the majority's will as the *whole* people's will. It ignores rights or constitutional constraints.
  *   **Trap Question:** "Does 'the will of the people' mean the will of the *majority* of the people? If so, why do we have rights that protect minorities from that will?"

  ### 5. The Constituent Power (The Sovereign)
  *   **Definition:** The people as the ultimate source of legal authority, standing above the constitution and the courts.
  *   **Whose Will:** The People as a political entity (demos), not just voters.
  *   **About What:** The fundamental order of things (Legitimacy).
  *   **Time:** Revolutionary or Founding moments (but invoked during crises).
  *   **Plausibility:** Explains why revolutions happen, but destabilizes rule of law.
  *   **Who is using it:** **The Court Commenter.** This is the only reading that justifies why courts *cannot* strike down a referendum. It claims the People are higher than the Law.
  *   **The Cheat:** It conflates a specific policy vote (land use) with an exercise of sovereign power (constitutional founding).
  *   **Trap Question:** "Are we treating this land-use decision as a normal law, or as a new founding of the city? Because only in a founding does the 'will of the people' override all existing courts and rules."

  ### 6. The Procedural Will (The Institutional)
  *   **Definition:** The will of the people is whatever the established rules say counts as the will of the people.
  *   **Whose Will:** Defined by the system.
  *   **About What:** Compliance with process.
  *   **Time:** Ongoing.
  *   **Plausibility:** Most stable, least inspiring. It avoids metaphysics but offers no moral shield against bad laws.
  *   **Who is using it:** **Nobody.** This is the boring compromise. Everyone at your meeting is rejecting this because they want "The Will" to be a trump card.
  *   **The Cheat:** N/A.
  *   **Trap Question:** "If our current rules say referendums are binding, isn't *that* the current will of the people? Why are we trying to change the rules using a definition of 'will' that doesn't exist yet?"

  ***

  ### Summary of the "Cheats" for Your Meeting

  *   **Referendum Guy** is swapping between **#1 (Headcount)** and **#4 (Majoritarian Command)**. He wants the ease of counting heads but the authority of a sovereign command.
      *   *Call him out:* "You're treating a headcount like it's a sovereign command. But a headcount is just data; it doesn't tell us if the result is legitimate or just popular."
  *   **Assembly Woman** is swapping between **#2 (Considered Judgment)** and **#3 (General Will)**. She wants the democratic feel of #2 but the moral authority of #3.
      *   *Call her out:* "You're arguing for deliberation, but you sound like you think the assembly finds the 'true' good. If the public rejects the assembly's decision, do you respect the public or the assembly?"
  *   **Court Commenter** is using **#5 (Constituent Power)** for a routine policy issue.
      *   *Call him out:* "You're treating a zoning vote like a revolution. If the 'will of the people' can override courts on anything, we don't have a rule of law, we have mob rule."

  **Recommendation:** Print this list. When someone says "The Will of the People," stop them and ask: "Which number on the menu are we using? Because Number 1 conflicts with Number 5."
