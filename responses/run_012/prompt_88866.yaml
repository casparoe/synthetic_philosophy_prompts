  For Horizon-Relative Geometric Rationality (HRGR) to be false, specific formal or empirical conditions must obtain. Defeaters range from fatal logical contradictions to awkward practical limitations.

  **Fatal Defeaters**
  1.  **Dynamic Inconsistency:** If the optimal threshold $T(W, N)$ creates time-inconsistent preferences, the policy is irrational. Rationality typically requires that a plan optimal at $t=0$ remains optimal at $t=1$. If HRGR dictates a bet size at $t=0$ that the agent wishes to revise at $t=1$ without new information, the policy requires external precommitment. A theory of rationality that relies on precommitment for basic implementation is fundamentally flawed.
  2.  **Asymptotic Dominance Failure:** The strong claim states non-HRGR policies are almost surely dominated in the long run. However, the Kelly criterion (pure log utility) maximizes almost-sure asymptotic growth rates. If $N \to \infty$, the threshold $T$ should recede to infinity, converging to Kelly. If HRGR does not converge to Kelly asymptotically, a Kelly agent will almost surely possess more wealth, falsifying the dominance claim. If it does converge, the hybrid rule is redundant in the limit.

  **Serious Defeaters**
  3.  **Parameter Sensitivity & Dependence:** The view assumes independent gambles with known edges. In reality, edges are estimated and gambles may be correlated. If estimation error is high, the threshold becomes unstable. Formal results on optimal growth under uncertainty often favor fractional Kelly over hybrid threshold rules. Furthermore, if gambles are correlated, the independence assumption fails. HRGR relies on the Law of Large Numbers applying to the sequence; if correlations exist, variance compounds differently, potentially making the linear region dangerous.
  4.  **Utility Mismatch:** HRGR assumes wealth is the sole utility input. If agents care about consumption paths, relative status, or have bounded utility, the wealth-centric threshold is normatively irrelevant.
  5.  **EU vs. Almost-Sure:** Standard decision theory maximizes Expected Utility (EU). An EV maximizer may have higher EU than an HRGR agent despite lower median wealth (due to skewed upside). If rationality is defined by EU, HRGR's reliance on almost-sure dominance is a category error.

  **Predictions and Testability**
  HRGR predicts bet sizes vary non-monotonically relative to wealth: conservative (log-like) when far below $T$, aggressive (linear-like) near $T$. Unlike Kelly (constant fraction of wealth) or EV (fixed dollar amount or all-in), HRGR agents should increase bet *fractions* as wealth approaches the threshold. This is testable in simulations or controlled trading experiments. Rival accounts predict constant fractions or fixed bets. Empirical observation of constant fractional betting in professional gambling would count against HRGR.

  **Defender Concessions and Unfalsifiability**
  A committed defender would dismiss EU objections, insisting wealth survival is the primary rational goal. They might concede that threshold calibration is computationally difficult (merely awkward) but insist the *functional form* is correct. They would reject dynamic inconsistency claims by arguing rational agents bind themselves to plans. Regarding dependence and uncertainty, they would likely dismiss these as outside the model's idealized scope rather than falsifications.

  However, the view risks unfalsifiability. If the threshold $T$ is treated as a free parameter fitted to outcomes rather than derived from $W$ and $N$, the theory becomes ad hoc. Furthermore, if "long run" is indefinitely deferred when dominance fails empirically, the strong claim is shielded from refutation. To remain scientific, $T(W, N)$ must be derivable from first principles, and the "long run" must be defined finitely. Without these constraints, HRGR retreats into a motte-and-bailey where failures are blamed on incorrect threshold settings rather than the theory itself.
