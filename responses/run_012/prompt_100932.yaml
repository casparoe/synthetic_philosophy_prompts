  2.  **Designing the Activity (The "Core Mechanic"):**
      *   *Idea:* A threshold model of collective behavior (Granovetter/Schelling style).
      *   *Specific Rule:* "Stand up if $X$ number of people are already standing."
      *   *Problem:* If everyone knows the rule, they might game it or coordinate intentionally.
      *   *Fix:* Private thresholds. Each student gets a secret number.
      *   *Refinement:* To make the "explanation" phase tricky, we need the aggregate pattern to be robust despite micro-variation. A "cascade" or "tipping point" works best.
      *   *Selected Rule:* **The Quiet Riot.**
          *   State: Sitting (Quiet) vs. Standing (Noise).
          *   Trigger: A student stands up if the number of people *currently* standing meets or exceeds their private threshold.
          *   Twist: To ensure the pattern emerges without coordination, we need a seed. The instructor acts as the exogenous shock.
          *   To ensure the "underdetermination" point (different micro-histories -> same macro outcome), we need to run it twice with different threshold distributions but similar outcomes, OR run it once and show that *who* stood up doesn't explain *that* they stood up.
          *   *Better approach for the prompt's specific requirement (b):* "Two runs with different individual orderings or different micro-histories yield the same aggregate pattern." This implies running the simulation twice.
          *   *Modification:* Run the simulation twice. In Run 1, distribute thresholds randomly. In Run 2, distribute different thresholds (or change the order of activation). If the outcome (e.g., "everyone stands" or "50% stand") is the same, but the *individual* reasons (thresholds) were different, MI struggles to explain the *stability* of the macro fact.
          *   *Wait, actually:* The prompt asks for the explanation phase to collapse. If I explain *why Alice stood*, I say "Her threshold was 3 and 3 people were up." If I explain *why the room stood*, I say "Because enough people had low thresholds." But if I change the thresholds and the room *still* stands, the specific individual facts didn't determine the specific outcome in a unique way.
          *   *Let's go with a Spatial/Tipping Model:* It's more visceral.
          *   *Revised Mechanic:* **The Neighborhood Shift.**
          *   Setup: Students sit in a grid (or circle).
          *   Rule: You are happy if at least $N$ of your immediate neighbors are doing the same thing as you. If not, you switch.
          *   *Critique:* Too complex for 90 mins including debrief.
          *   *Back to Threshold:* It's cleaner. Let's stick to the **Threshold Cascade**.
          *   *Rule:* "Stand up if the number of people currently standing is $\ge$ your secret number."
          *   *Process:* Instructor counts down. 3, 2, 1. Everyone checks their card. If condition met, stand. Repeat rounds.
          *   *To satisfy condition (b):* We need to show that the *specific* individuals who stood don't matter as much as the *distribution*.
          *   *Actually, the prompt asks for:* "Two runs with different individual orderings or different micro-histories yield the same aggregate pattern."
          *   *Implementation:* Run the cascade twice.
              *   Run A: Thresholds distributed normally (mean 5).
              *   Run B: Thresholds distributed bimodally (some 1, some 10).
              *   If both result in "Full Room," the macro fact is stable, but the micro facts are totally different.
              *   *Wait, simpler:* Just swap the cards between students between Run 1 and Run 2. The *set* of thresholds is identical, but the *people* holding them are different.
              *   *Outcome:* The macro pattern (e.g., 80% stand) remains roughly the same (due to law of large numbers), but the *explanation* for why *Alice* stood changes (in Run 1 she had a low threshold, in Run 2 she had a high threshold but stood anyway because the cascade was stronger).
              *   *Even better for the "Explanation Collapse":* In the debrief, ask "Why did the room stand?" If they say "Because Alice, Bob, and Charlie stood," point out that in Run 2, Alice and Bob sat, but Dave and Eve stood, and the room *still* stood. Therefore, the identity of the individuals is irrelevant to the social fact.

  3.  **Drafting the Plan:**

      *   **Activity Name:** The Threshold Cascade.
      *   **Materials:** Index cards (thresholds), pens, projector (for counting rounds).
      *   **Incentive:** "Epistemic Points" or simply the desire to win a trivial prize (candy) for the "most accurate prediction" or "best explanation." Let's use a "Prediction Wager." Students bet on the outcome (How many will stand?). This makes them care about the macro pattern.

      *   **Timeline:**
          *   0-10: Setup & Rules (No theory).
          *   10-25: Run 1 (Data Generation).
          *   25-40: Run 2 (Variation).
          *   40-60: The Explanation Trap (Group work).
          *   60-90: Debrief & Theory Mapping.

      *   **The "Trap":**
          *   Task 1: Explain why *Student X* stood. (Easy: Micro + Context).
          *   Task 2: Explain why *80% of the room* stood. (Hard: If they list individuals, show Run 2 had different individuals).
          *   Task 3: Explain why the *tipping point* happened at Round 3. (Requires reference to the "state of the room," not just individuals).

      *   **Debrief Mapping:**
          *   MI: Social facts are nothing over and above individuals.
          *   MH: Social facts have causal powers/explanatory autonomy.
          *   Supervenience: No change in macro without change in micro (True in activity).
          *   Explanatory Autonomy: Macro explanations are better/more robust (The point of the activity).

      *   **Predicted Failures:**
          *   Students cheat (look at cards).
          *   Students coordinate (talk).
          *   The cascade fails (nobody stands).
          *   *Fix:* Instructor seeds the first stander (exogenous shock). Strict silence rule.

      *   **Honest Limitation:**
          *   The activity shows *explanatory* autonomy, but it doesn't prove *ontological* holism. The cards (micro facts) still determine the outcome. The activity simulates the *friction*, not the metaphysical resolution. The instructor must clarify that MI accepts the pattern exists but insists it reduces; MH insists the pattern exerts downward causation. The activity shows the *utility* of MH, not necessarily the *truth*.

  4.  **Refining the Rules for Maximum Friction:**
      *   To make the "Explanation Collapse" work, the prompt requires: "the best available explanation of the individual's move cites the emerging aggregate."
      *   *Scenario:* Alice stands in Round 3. Why? Not just "My card says 3." But "Because 3 people were *already* standing." The "3 people standing" is a social fact, not an individual fact.
      *   *Scenario:* Why did the room tip? "Because the distribution of cards allowed it." But if we swap cards (Run 2) and it *still* tips, the specific distribution isn't the key, the *structure* is.
      *   *Let's ensure Run 2 yields the SAME macro outcome but DIFFERENT micro history.*
      *   *Method:* Collect cards. Shuffle. Redistribute. Run again.
      *   *Result:* Same set of thresholds, different people holding them.
      *   *Macro Outcome:* Likely very similar (e.g., 15/18 stand).
      *   *Micro History:* Alice stood in Run 1 (low threshold). Alice sits in Run 2 (high threshold).
      *   *Question:* "Why did the room stand in both cases?"
      *   *MI Answer:* "Because of the specific people." (False, people changed). "Because of the thresholds." (True, but abstract).
      *   *MH Answer:* "Because the social system reached a critical mass."

  5.  **Fleshing out the Debrief:**
      *   Need to map specific moments.
      *   Moment 1: Checking the card. (Individual property).
      *   Moment 2: Looking around the room. (Social fact).
      *   Moment 3: Standing. (Action).
      *   Moment 4: The Cascade. (Emergent pattern).
      *   Connect to Supervenience: Could the room have stood if cards were different? Yes. Could the room have sat if cards were the same? No. (Supervenience holds).
      *   Connect to Explanation: Is "The room tipped" a valid cause?

  6.  **Addressing the "Honest Note":**
      *   The activity is a simulation. In real life, "social facts" aren't just aggregated numbers; they involve meaning, norms, institutions. The activity is mechanistic. It shows *structural* holism, not *normative* holism. The instructor needs to bridge the gap between "mathematical emergence" and "social reality."

  7.  **Review against Constraints:**
      *   18 students? Yes.
      *   90 mins? Yes.
      *   No money incentive? Yes (candy/bragging rights).
      *   No preview of vocab? Yes.
      *   Two runs? Yes.
      *   Explanation collapse? Yes.

  8.  **Final Polish:**
      *   Make the instructions crisp.
      *   Ensure the "Explanation Phase" is structured to force the failure.
      *   Write the "Predictably Go Wrong" section with practical classroom management tips.

