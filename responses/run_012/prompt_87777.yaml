answer: |-
  **Title:** The Equilibrium of the Left-Side Control: A Defense of Lewisian Deflationism

  **To:** Third-Year PhD Candidate
  **From:** [Your Name/Role]
  **Re:** Chapter Draft / Social Ontology Case Study

  You have put your finger on the exact pressure point where social ontology tends to fracture. The case of the research lab's figure convention is intuitive, empirically plausible, and theoretically vexing. You are asking whether David Lewis's 1969 account can sustain the weight of this case, specifically regarding the *reasons for action* it generates for a newcomer. You also want to know if your setup conflates conventions with norms.

  Here is the plain truth about your setup: **It is not confused.** You are correctly identifying a paradigmatic Lewisian convention. The confusion lies not in your description of the lab, but in the expectation that Lewis's machinery *ought* to produce a deontic "bindingness" that it was explicitly designed to bypass.

  Below, I lay out the analysis of the lab case through Lewis's framework, weigh the standard normativity objections against the deflationary reply, and then commit to a position. My argument is that the lab habit is a Lewisian convention, that Lewis's machinery *does* explain the newcomer's reason to conform (instrumental rationality), and that the demand for a thicker "obligation" is a metaphysical luxury this specific social fact does not require. We should side with the deflationists.

  ### 1. Is the Lab Habit a Lewisian Convention?

  Let's run your case against Lewis's five conditions for convention (simplified from *Convention: A Philosophical Study*):

  1.  **Regularity:** Everyone puts the control on the left. (Check.)
  2.  **Common Knowledge:** Everyone knows everyone does this, and everyone knows that everyone knows. In a lab, figures are public; corrections are public. This is easily satisfied. (Check.)
  3.  **Arbitrariness:** Control on the right would work equally well. You specified this is arbitrary in the relevant sense. (Check.)
  4.  **Conditional Preference:** Everyone prefers to conform *on the condition* that others conform. (This is the crux.)
  5.  **Alternative Equilibrium:** There is another possible regularity (control on right) that could have solved the coordination problem. (Check.)

  The friction usually arises at condition 4. Lewis requires a coordination problem: I prefer to match you, and you prefer to match me. In your lab, the motivation is "I don't want to be the weird one" and "a senior person will ask why."

  Is this a coordination preference or merely fear of sanction? For Lewis, this is a false dichotomy. Sanctions are simply negative payoffs in the preference matrix. If the social cost of being "the weird one" (awkwardness, reputation damage, time spent explaining) outweighs the negligible cost of moving the control to the left, then the preference to conform is rational.

  The origin story you provided—one person's habit copied by older students, now picked up by new ones—is precisely how Lewis explains the emergence of conventions without explicit agreement. It is a process of *salience* and *induction*. The first student provided a salient focal point; the repetition created an expectation; the expectation creates the reason for the next student.

  So, yes: **This is a convention in Lewis's sense.** It is a coordination equilibrium sustained by common knowledge and conditional preferences.

  ### 2. The Normativity Objection vs. The Deflationary Reply

  Here is where your chapter needs to do its heavy lifting. You note that Lewis buys you "rational compliance but nothing you'd call being bound or owing."

  **The Objection (The Gilbertian/Constraint View):**
  Critics like Margaret Gilbert argue that Lewis reduces social order to a mass of individual instrumental rationality. In the lab, when a senior asks, "Why is your figure wrong?", they are not merely predicting a coordination failure; they are invoking a standard that *ought* to be followed regardless of the newcomer's personal preference to avoid awkwardness. Gilbert argues that conventions involve a "joint commitment" that creates *sui generis* obligations. On this view, the newcomer doesn't just have a *reason* to conform (to avoid hassle); they have a *duty* to conform (because they are entering a practice constituted by mutual obligation). If Lewis cannot explain why the newcomer feels *bound* rather than just *pressured*, his account is incomplete.

  **The Deflationary Reply (The Lewisian/Bicchieri View):**
  The deflationist argues that "obligation" is a folk-psychological reification of stable expectations. Cristina Bicchieri, refining Lewis, distinguishes between *empirical expectations* (I think others will do X) and *normative expectations* (I think others *want* me to do X). In your lab, the senior's question ("Why does this look wrong?") signals a normative expectation. However, the *force* of that expectation still rests on the newcomer's desire to satisfy those expectations (to belong, to not be criticized). There is no ghostly "bond" over and above the web of preferences and beliefs. The "ought" is just the "is" of a stable equilibrium viewed from the inside.

  ### 3. The Decision: Why Deflationism Wins Here

  You asked me to come down on a side. **I defend the Lewisian deflationary account.**

  Here is the argument for why you should write your chapter from this perspective, specifically regarding the lab case.

  **First, ontological parsimony.**
  To posit a "joint commitment" or a *sui generis* obligation in the case of the left-side control figure is to bring a nuclear weapon to a knife fight. This convention is fragile. If the PI left tomorrow and a new PI preferred the right side, the "obligation" would vanish instantly. A genuine normative bond (like a promise or a legal contract) usually resists mere changes in preference. The fact that this rule is so easily overturned by a shift in the payoff matrix (e.g., a new senior who doesn't care) suggests there is no deep normative structure holding it up. It is held up by preferences. Lewis's machinery captures this fragility perfectly; Gilbert's machinery obscures it by granting the convention too much solidity.

  **Second, the explanation of the "Reason to Conform."**
  You asked whether Lewis's machinery can explain why the newest member has any reason to conform *beyond the fact that the others do*.
  The Lewisian answer is: **No, and it shouldn't.**
  If there were a reason beyond the fact that others do it (e.g., "controls on the left are cognitively faster to process"), it would cease to be a convention and become a technical standard or a functional norm. The *essence* of a convention is that the reason for action is constituted by the regularity itself.
  The newcomer conforms because:
  1.  They want to publish/graduate (Goal).
  2.  Deviating causes friction/sanctions (Constraint).
  3.  Others conform (Fact).
  Therefore, they conform.
  To demand a reason *beyond* this is to misunderstand the nature of arbitrary coordination. The "normativity" you feel is missing is actually just the psychological weight of the social sanction. When the senior asks, "Why is this wrong?", they are making the cost of deviation salient. That *is* the reason.

  **Third, the empirical fit.**
  You mentioned empirically minded work on transmission. Work by scholars like Chandra Sripada or even evolutionary game theorists (Skyrms) suggests that norms propagate via learning mechanisms and payoff tracking, not via the recognition of abstract obligations. In your lab, the new students "pick it up because everyone else does it." This is behavioral mimicry driven by equilibrium selection, not the recognition of a joint commitment. If you adopt the Gilbertian view, you have to explain how this "joint commitment" is transmitted without explicit agreement. Lewis avoids this problem: the commitment is not transmitted; the *equilibrium* is. The new student enters an existing game where the strategy "Left" is dominant *given* that others play "Left."

  ### 4. Addressing the "Confusion" Worry

  You asked me to say plainly if your setup is confused.
  There is a risk of confusion, but it is terminological, not structural.
  In social ontology, "Norm" is often used as a genus containing "Conventions," "Moral Rules," and "Laws."
  *   If you use "Norm" to mean *any* rule-like regularity*,* your case is a norm.
  *   If you use "Norm" to mean *a rule with deontic bindingness independent of sanctions* (the Gilbertian sense), your case is **not** a norm; it is a convention.

  Your setup is not confused, provided you define your terms. The tension you feel ("Is this really a norm?") is the tension between the *phenomenology* of the rule (it feels binding) and the *ontology* of the rule (it is just preferences).
  My advice for the chapter: **Do not try to rescue the "bindingness."** Lean into the deflation. The fact that the student conforms *only* because they don't want to be weird is not a failure of the convention to be normative; it is proof that the convention is purely Lewisian.

  ### 5. Conclusion for the Chapter

  Your chapter should argue that the lab case demonstrates the sufficiency of Lewis's account for low-stakes, arbitrary social regularities. The "normativity" of the left-side control rule is an illusion generated by the stability of the coordination equilibrium.

  When the newest member conforms, they are not obeying a law; they are solving a coordination problem. The senior's question ("Why does this look wrong?") is not an appeal to moral duty; it is a reminder of the payoff matrix. If we posit a "joint commitment" here, we are mystifying a simple sociological fact: people hate being the outlier.

  **The Verdict:**
  Side with Lewis. The machinery holds. The newcomer has a reason to conform (instrumental rationality within a coordination equilibrium), and that is *all the reason there is*. To ask for more is to ask for a norm where there is only a habit. Your chapter should defend the view that much of what we call "lab culture" or "academic norms" is actually just sedimented Lewisian convention, and that recognizing this demystifies the pressure new students feel. It's not that they *ought* to do it in a moral sense; it's that the cost of not doing it is socially expensive. That is a robust enough explanation for social ontology without invoking ghostly obligations.

  **Move for the Chapter:**
  1.  Define the Lab Case as a Coordination Equilibrium.
  2.  Show how Lewis's conditions map onto the "habit -> copy -> sanction" history.
  3.  Anticipate the "But is it *binding*?" objection (Gilbert).
  4.  Crush it with the Parsimony Argument: The rule is too fragile to be a joint commitment.
  5.  Conclude that "Normativity" in this context is just the subjective experience of high switching costs.

  This gives you a clear, defensible, and philosophically rigorous lane. Go write it.
