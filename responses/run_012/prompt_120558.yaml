  **The question**

  The question is whether a single structural account covers both ordinary reactive attitudes and detached reactive attitudes. Ordinary attitudes target agents capable of good or ill will, satisfying the quality-of-will condition. Detached attitudes target entities lacking agency, such as the dead or fictional characters, yet share the same phenomenology and action-tendencies. The two candidate answers are distinct. First, detached attitudes are parasitic imaginative extensions, leaving the quality-of-will condition intact as essential to genuine responsibility. Second, detached attitudes reveal a unified core, such as a demand for acknowledgment, rendering quality-of-will merely contingent. Settlement depends on whether detached features can be explained without agency conditions. If the structure holds without the condition, it fails as essential. If the structure collapses without the condition, the parasitic reading wins. The answer determines whether the quality-of-will condition is constitutive of the attitude or merely a common circumstance of its occurrence.

  **Why the field leaves it open**

  Current interpretations of Strawson leave this unresolved because they prioritize different aspects of the reactive attitudes. The quality-of-will reading defines these attitudes strictly as responses to perceived regard. On this view, detached cases are category errors; feeling resentment at a storm is merely metaphorical. This reading dismisses the phenomenon rather than explaining it. The response-dependent reading focuses on the feelings themselves, potentially accommodating detached cases but struggling to explain why they feel normative rather than merely emotional. It lacks resources to distinguish between grieving a loss and resenting a betrayal when the betrayer is dead. The second-personal reading grounds responsibility in the capacity for mutual address. This handles ordinary cases well but must classify detached attitudes as defective or incomplete, as no answer can be demanded from the dead. The question becomes live precisely at the point of exemption. Strawson distinguishes excusing an agent from exempting them entirely. Detached targets look like exempt cases, yet we do not withdraw the attitudes as exemption theory predicts. We maintain the stance. Existing frameworks cannot explain why we sustain reactive stances toward exempt targets without collapsing the distinction between exemption and participation. This gap allows the project to test whether the structure of the attitude depends on the target's capacity or the participant's demand. If the demand persists without the capacity, the capacity is not essential. This tension is currently ignored in the literature, which assumes exempt targets necessarily dissolve the reactive stance. My project challenges this assumption directly. Consequently, the field lacks a taxonomy for these hybrid cases. Scholars either force them into the exempt category, ignoring their normative force, or treat them as anomalies. Neither option explains the persistence of the demand for acknowledgment. By isolating this persistence, the project identifies the exact friction point where current theories fail to map onto our actual practices. This makes the question live rather than merely curious, as it threatens the coherence of the exempting condition itself.

  **The strategy and its rivals**

  The strategy employs the detached cases as a stress test on proposed necessary conditions for reactive attitudes. This method is superior to two rivals. The first rival is conceptual analysis of the term reactive attitude. This is too static; it codifies existing usage rather than testing the underlying structure. It risks begging the question by defining away the detached cases as non-reactive. The second rival is empirical survey of what people report feeling. This is descriptive rather than normative. Knowing people feel resentment toward fiction does not tell us whether that resentment shares the same logical structure as interpersonal resentment. My method treats detached cases not as evidence that such attitudes exist, but as probes to see if the account breaks. If an account requires agency, but the attitude persists without it while retaining its normative force, the account requires revision. A successful result will be a generalization of the account. It must explain the phenomenology and action-tendencies of both ordinary and detached cases under a single description, such as a demand for acknowledgment. An ad hoc patch would merely note the similarity without integrating the normative logic. The goal is to show whether the quality-of-will condition is constitutive or incidental. If incidental, the theory expands; if constitutive, the detached cases are shown to be structurally distinct despite surface similarities. This distinguishes the project from mere exception-hunting. It forces a choice between revising the core theory or explaining away the data. This methodological rigor ensures that the conclusion bears on the theory of responsibility itself, not just on the psychology of grief or fiction. It transforms the detached cases from boundary problems into central evidence. Furthermore, the strategy avoids the trap of over-intellectualizing the attitudes. By focusing on action-tendencies like avoidance or the wish for acknowledgment, the method grounds the analysis in observable behavioral dispositions rather than abstract judgments. This makes the stress test concrete. If I avoid a fictional character because I resent them, that avoidance mirrors interpersonal avoidance. The rivals fail to capture this behavioral parity. Conceptual analysis ignores the behavior; surveys report the feeling but not the structure. The stress test connects the feeling to the practice. This connection is vital for a theory of responsibility, which is inherently practical. Therefore, the strategy is not just about classification but about functional equivalence. If the function is the same, the structure likely is too.

  **Work plan**

  The six-month plan divides the borderline cases to test the limits of generalization. Month one focuses on phenomenology and the dead. I will establish the baseline description of detached attitudes using grief and posthumous resentment. Month two examines fictional characters. This tests imagination versus belief, isolating whether actual agency is required for the attitude's structure. Month three addresses the past and future self. This introduces temporal distance and identity conditions, testing whether the target must be contemporaneous. Month four covers animals and corporate agents. These are the hardest cases, testing biological versus functional agency. By month five, I will synthesize findings to determine if the account generalizes or breaks. This is the decision point. If the structure holds across fiction and the dead but fails at institutions, the theory limits to psychological targets. If it holds across all, the quality-of-will condition is discarded. Month six is dedicated to drafting the article and refining the argument based on the synthesis. The schedule ensures that the most contestable cases, like institutions, are left until the core structure is established. If the account breaks at month three, the remaining months focus on explaining the break rather than forcing a unity. This flexibility prevents overreach. The work plan prioritizes depth on the clearest cases before moving to the most controversial, ensuring the central argument is secure even if the scope narrows. Each month includes a specific deliverable of notes and draft sections to ensure progress is tangible. Month one will produce a phenomenological map. Month two will generate a comparison matrix between fictional and real agents. Month three will draft the section on temporal identity. Month four will assess the institutional cases against the established criteria. This incremental output prevents bottlenecks in the final months. The synthesis in month five involves a formal check against the quality-of-will condition. I will explicitly list which conditions are met by detached targets and which are not. This makes the breaking point visible. If the condition fails early, the project pivots to explaining the illusion of agency. If it holds, the project pivots to redefining the condition. This decision tree is built into the schedule. The final month allows for peer feedback integration before submission.

  **Deliverables**

  The primary deliverable is a journal article of roughly 10,000 words. It will present the unified account or the definitive argument for the parasitic reading. The secondary deliverable is a workshop paper. This will focus on the specific case of the dead and fictional characters to solicit early feedback on the phenomenological claims. Both pieces will avoid technical jargon where possible to ensure accessibility across ethics and philosophy of mind. The article will contain the full argument regarding the quality-of-will condition. The workshop paper will be presented at a faculty seminar to gauge initial reactions to the stipulated terminology.

  **What success and failure look like**

  Success means a reader can distinguish between the essential features of moral responsibility and the contingent features of agency. They will understand whether the demand for acknowledgment is primary, with quality-of-will as a secondary specification, or vice versa. This clarifies the excusing versus exempting distinction. If the project succeeds, we know whether exempting targets truly requires withdrawing the reactive stance. Failure looks like two specific outcomes. First, the detached attitudes may turn out to be merely metaphorical. If further analysis shows they lack the action-tendencies of genuine resentment, the project collapses into the standard quality-of-will view. Second, the unified account may become uninformative. If the only thing covering both cases is the trivial claim that we care about things, the account loses its normative bite. It would fail to explain why these feelings demand acknowledgment rather than mere sadness. Honest failure admits that the detached cases are too disordered to support a unified theory. In that case, the project concedes that Strawson's original restriction to agency was correct, but provides a detailed explanation of why the confusion arises. This is still a result, but it counts as failure for the hypothesis of unity. The value lies in resolving the ambiguity, even if the resolution negates the initial hunch.

  **Scope and risks**

  The scope risks becoming too large if I attempt to solve the metaphysics of agency alongside the psychology of attitudes. To stay within six months, I must treat agency as a given variable rather than analyzing it deeply. The first cut would be corporate agents and institutions. These require complex social ontology that could derail the project. Animals are the second cut if time runs short, as biological agency is contested. If the detached cases turn out to be less revealing than hoped, the proposal must concede that they are secondary phenomena. I would then pivot to explaining why humans project agency where none exists, rather than claiming this reveals the core of responsibility. This concession preserves the work's value as an error theory rather than a constructive account. The risk is that the project becomes purely negative. To mitigate this, I will focus on the phenomenology of the demand itself. The proposal concedes that it may not rewrite responsibility theory but will clarify the boundaries of the reactive stance. This ensures a deliverable outcome regardless of whether the unified structure survives the stress test.
