ur honest read on where the residue falls: is it something my framework can't express, or something that was never as clear as it sounded. I dont need a reading list or citations, just the argument. And could you write it as continuous prose, no headings, bullets, bold or tables, just paragraphs like an email, I print these out and read them on the bus. Sorry for the wall of text.
