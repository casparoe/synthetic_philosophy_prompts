      *   Moves 1-6 Analysis.
      *   The Syndrome Question (Hedonic vs. Motivational).
      *   Hidden Premises & Missing Elements.
      *   The Practical Inference.

      *(Self-Correction during drafting)*: Make sure to clearly distinguish between the *empirical* claim (what is happening in the brain) and the *philosophical* claim (what counts as badness). A mixes them; B tries to separate them.

      *Move 1:* A is empirically right, philosophically contentious.
      *Move 2:* B is philosophically consistent, empirically speculative.
      *Move 3:* A is strong on subjective welfare.
      *Move 4:* B is strong on linguistic/phenomenological ambiguity.
      *Move 5:* A is strong on parsimony, weak on safety.
      *Move 6:* B is strong on evolutionary function.

      *Practical Inference:* It survives as "harm reduction" but fails as "harm elimination without cost."

