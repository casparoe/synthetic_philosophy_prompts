answer: |-
  ### Brainstorming Candidate Explanations

  Before fixing upon the explanatory power of superrationality, we must delineate the competing mechanisms that might account for the live-and-let-live system. We are looking for the engine of cooperation in a hostile environment.

  1.  **Iterated Prisoner's Dilemma (Tit-for-Tat):** The standard account. Cooperation is rational because the shadow of the future is long. Defection today invites retaliation tomorrow. The static nature of the trenches ensures the same agents interact repeatedly.
  2.  **Signalling and Focal Points:** Agents use costly signals (shooting high) to propose a convention. Time and routine (mealtimes) serve as Schelling focal points where coordination is natural without communication.
  3.  **Risk Dominance:** In a chaotic environment, shooting exposes one's position. Restraint minimises the immediate risk of drawing accurate return fire, regardless of the other's long-term intent.
  4.  **Superrationality:** Agents cooperate because they recognise the symmetry of the situation. They reason that if they defect, the other (being a similar reasoner in a similar situation) will also defect, leading to a worse outcome. They choose cooperation to 'force' the logical correlation.
  5.  **Normative Conformity:** Soldiers adhere to an emerging local norm to avoid social sanction from peers or to maintain a self-conception of 'honourable' conduct, distinct from strategic calculation.

  My task is to isolate whether superrationality does any work distinct from the first three, particularly given your suspicion that it may only apply to the initiation of the convention.

  ***

  ### 1. Mapping the Decision Problem

  To apply superrationality rigorously, we must specify the formal structure of the agency involved. If the mapping is imprecise, the theory cannot fail, but neither can it succeed.

  **The Agent**
  The agent cannot be the High Command, as they actively discouraged the practice. Nor can it easily be the individual soldier in isolation, as individual deviation often drew collective retaliation. The most coherent unit of agency for this model is the **individual combatant acting as a representative of his immediate trench section**. He possesses the discretion to aim high or low, and he understands that his action will be interpreted as the action of his sector. For superrationality to hold, the agent must view himself as a locus of reasoning that is replicable across the wire.

  **The Acts**
  *   **Cooperate (C):** Withhold fire, shoot to miss, or shell predictably.
  *   **Defect (D):** Shoot to kill, shell randomly, or raid.

  **The Payoffs**
  *   **Mutual Cooperation (CC):** High survival probability, low resource expenditure, maintenance of status quo.
  *   **Mutual Defection (DD):** High casualty risk, high resource expenditure, no tactical gain (in static sectors).
  *   **Unilateral Defection (DC):** Tactical advantage (eliminating enemy without loss), but high risk of immediate retaliation converting it to DD.
  *   **Unilateral Cooperation (CD):** High vulnerability, potential for elimination.

  This preserves the Prisoner's Dilemma ordinality ($DC > CC > DD > CD$) provided we weigh survival heavily. However, in the trenches, the gap between $DC$ and $CC$ narrows significantly because a sniper who reveals his position to take a kill ($DC$) is often immediately neutralised. This flattens the incentive to defect, which aids cooperation but complicates the PD classification. Let us assume for the sake of the test that the PD structure holds: there is always a temptation to kill if one could do so with impunity.

  **The Reference Class**
  This is the critical variable for superrationality. For the British rifleman to reason superrationally, he must condition his choice on the choice of "every agent who reasons as he does."
  *   **Wide Class:** "All rational agents." This yields absurdity; it implies cooperation with a fanatic who does not value survival.
  *   **Narrow Class:** "The specific German opposite me." This collapses superrationality into empirical prediction. If I know *he* will cooperate, I should cooperate regardless of superrationality.
  *   **Salient Class:** "Soldiers in static sectors facing mutual destruction." This requires the agent to believe that the German opposite is not just an enemy, but a *structural duplicate* in terms of decision-making constraints. He must believe: "We are both tired, both under similar orders, both preferring life to death, and both capable of recognising this symmetry."

  For superrationality to yield the observed restraint, the reference class must be defined by **situational symmetry** rather than national identity or moral alignment.

  ***

  ### 2. Assessment Against Rival Accounts

  We must now weigh superrationality against the more conventional explanations, specifically looking for the marginal gain it offers.

  **The Iterated Play Dominance**
  The live-and-let-live system was remarkably stable over months. This stability is the hallmark of iterated games. If I shoot you today, you shoot me tomorrow. The threat of retaliation is causal and observable. Superrationality, by contrast, relies on a logical correlation: "I choose C, therefore you choose C."
  In a sustained trench sector, the shadow of the future is so long that iterated rationality (Tit-for-Tat) swamps superrationality. A soldier does not need to believe the German is a "similar reasoner"; he only needs to believe the German is *capable of retaliation*. The observed decay of the system supports iterated play over superrationality. When raids were ordered or units rotated, the "shadow of the future" was severed. If superrationality were the primary driver, the symmetry of the situation (two men in mud) remained even during raids, yet cooperation collapsed. This suggests the mechanism was causal expectation of future interaction, not logical correlation of present reasoning.

  **Signalling and Focal Points**
  Much of the behaviour you describe—shelling fixed spots at predictable hours—is classic focal-point coordination. It reduces uncertainty. Superrationality does not explain *which* convention is selected (why mealtimes? why dawn?). It only argues for coordination *simpliciter*. The specific content of the live-and-let-live system is better explained by Schellingian focal points (natural breaks in the day) than by superrational calculation.

  **The 'Best Shot': Spontaneous Initiation**
  You suggest the best case for superrationality is the spontaneous initiation between strangers. This is astute. In the very first days of a sector settling down, before a reputation is established, iterated play has no grip. Why does the first shot go high?
  Here, superrationality has a role. If two agents recognise the symmetry of their plight (the "suicidal" nature of mutual aggression), they may simultaneously opt for restraint to 'lock in' the better outcome. However, even here, **risk dominance** competes. Shooting exposes you. Not shooting keeps you hidden. A soldier might withhold fire simply to avoid revealing his position, not because he is reasoning about the German's reasoning.
  Therefore, superrationality adds value only if we can rule out risk aversion. If the soldier *could* shoot with impunity (e.g., from a protected perch) but chooses not to because he expects the other to do the same, that is superrationality. The historical record suggests most restraint was indeed motivated by the desire to avoid drawing fire (risk aversion). Thus, even at initiation, superrationality is crowded out by simpler safety heuristics.

  **Verdict:** Superrationality adds very little once iterated play, signalling, and risk aversion are accounted for. Its only potential niche is the very first move in a context where risk aversion is insufficient to explain restraint, but the historical evidence leans towards risk aversion being sufficient.

  ***

  ### 3. The Case Against: Reference Class and Patchiness

  The philosophical vulnerabilities of superrationality are sharpened by the empirical details of the Western Front.

  **The Reference Class Problem**
  As noted, superrationality requires a specific reference class. If the class is "soldiers," why did live-and-let-live not occur in mobile sectors? If the class is "soldiers in static sectors," the theory becomes contingent on empirical facts about the sector, not purely on rationality.
  The theory faces a dilemma:
  1.  **Fixed Wide:** If the agent reasons "I am a rational agent, the enemy is a rational agent, therefore we cooperate," the prediction is universal cooperation. This is falsified by the vast amount of killing that did occur.
  2.  **Fixed Narrow:** If the agent reasons "I am a soldier in a static sector facing the same constraints," the theory relies on the agent correctly identifying the empirical constraints. This makes the 'rationality' dependent on empirical knowledge (is the line static? will we rotate?) rather than logical form.
  The theory is held hostage to how the class is drawn. A superrational agent who misidentifies the reference class (e.g., thinks the enemy is a fanatic) will defect. A superrational agent who identifies it correctly will cooperate. This makes the theory look less like a norm of rationality and more like a prediction about the agent's sociological categorisation of the opponent.

  **The Patchiness of Restraint**
  The restraint was local and uneven. Sector A had a truce; Sector B, fifty yards away, did not.
  *   **Argument Against:** If superrationality is a truth of practical reason, it should be universalisable across identical situations. Why did the logic hold for the 2nd Battalion but not the 3rd?
  *   **Argument For:** One could argue the *conditions* for the reasoning were not identical. Perhaps the 3rd Battalion had more aggressive officers or a different rotation schedule.
  *   **Analysis:** This defence saves the theory by making it trivial. If every failure of superrationality is explained away by a slight difference in the empirical description of the reference class, the theory loses its normative bite. It becomes a description of when conditions allowed for a specific type of reasoning, rather than a prescription of what reason demands. The patchiness suggests that local conventions (iterated norms) were doing the work, as these can vary wildly over short distances, whereas logical rationality should not.

  ***

  ### 4. What the Episode Shows About the Theory

  The live-and-let-live episode suggests that superrationality, as a standalone theory of practical rationality, is too brittle to sustain social order.

  **Practical Rationality vs. Coordination Heuristic**
  The episode indicates that superrationality is better recast as a **coordination heuristic** that draws its force from the perception of symmetry, rather than a fundamental law of rationality. It functions as a tie-breaker when causal expectations are undefined.
  However, for the heuristic to work, it must be supported by the *possibility* of iteration. The soldiers did not cooperate because they were logically identical; they cooperated because they were *situationally* identical in a way that made retaliation likely. The "superrational" move (cooperate) was only safe because the "rational" move (retaliate) was available to the opponent.
  Thus, the episode shows that superrationality is parasitic on the underlying structure of iterated interaction. It cannot stand alone in a truly one-shot environment where retaliation is impossible. If the trenches had been a true one-shot game (e.g., a suicide mission), superrationality would likely have failed to produce restraint, because the logical correlation does not change the payoff matrix, only the probability assignment.

  **Falsification Conditions**
  To test this verdict, we would look for cases of restraint in **truly one-shot, asymmetric interactions** on the Front.
  *   If a sniper had a guaranteed escape route (no risk of retaliation) and yet chose not to shoot a visible enemy because "he wouldn't shoot me if he were in my position," that would support superrationality.
  *   If restraint *only* occurred where retaliation was possible (the historical reality), then superrationality is redundant.
  The historical record supports the latter. Restraint broke down when retaliation became impossible (e.g., during artillery barrages where the target could not respond) or when the interaction became one-off (raids). This suggests the mechanism was causal expectation, not logical correlation.

  ***

  ### 5. Testing Your Suspicion

  You suspect that the restraint was sustained less by identical reasoning and more by a shared expectation about the local schedule, with superrationality entering only at the moment the schedule is first proposed.

  **Validation of the Suspicion**
  This suspicion is robust and aligns with the analysis above.
  1.  **Sustenance:** Once the pattern is established (e.g., "no fire at 7 PM"), the game transforms from a Prisoner's Dilemma into a **Coordination Game**. The equilibrium is stable. Deviating brings punishment. This requires no superrationality; it requires only standard instrumental rationality and memory. The "shared expectation" is a convention in the Lewisian sense.
  2.  **Initiation:** This is the only moment superrationality might claim jurisdiction. In the absence of a schedule, how does the first act of restraint occur?
      *   *Superrational View:* "I will not shoot, reasoning that he will do the same."
      *   *Alternative View:* "I will not shoot, because shooting draws fire." (Risk Aversion).
      *   *Alternative View:* "I will shoot high to signal I am not a threat." (Signalling).

  **Where the Theory is Silent**
  Superrationality is silent on the **content** of the convention. It dictates that we should coordinate, but not *how*. It cannot explain why mealtimes were chosen over moonlight, or why artillery targeted specific coordinates. These details are determined by focal points and environmental constraints.
  Furthermore, the theory is silent on the **breakdown**. When commanders ordered raids, the symmetry of the situation (two men in mud) remained, but the restraint vanished. Superrationality cannot explain why the logical correlation ceased to hold simply because an order was given, unless the order changed the reference class (e.g., "I am now a raider, not a static defender"). But this again makes the theory hostage to the description of the class.

  **Conclusion on the Suspicion**
  Your suspicion is correct. The heavy lifting is done by the **shared expectation (convention)** sustained by the **threat of retaliation (iteration)**. Superrationality, if it appears at all, is a fleeting psychological mechanism that might assist in the initial leap of faith required to start the convention. However, even that initial leap is adequately explained by risk aversion and signalling.
  Consequently, the live-and-let-live system does not validate superrationality as a distinct, robust engine of social order. It demonstrates that where symmetry exists, agents can find focal points, but the *stability* of their cooperation relies on the causal power of future consequences, not the logical power of identical reasoning. Superrationality is a philosopher's description of a moment of symmetry, but not the sociologist's explanation of a sustained convention.
