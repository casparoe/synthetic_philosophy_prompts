answer: |-
  # Lesson Plan: The Escalating Demand

  **Module:** Ethics (Second-Year Undergraduate)
  **Topic:** Consequentialism and the Demandingness Objection
  **Time:** 90 Minutes
  **Class Size:** 18 Students
  **Room:** Movable chairs, Whiteboard + Markers

  ## I. Materials & Preparation

  1.  **Tokens:** 400 small slips of paper (cut beforehand).
  2.  **Envelopes:** 18 small envelopes, each containing 20 tokens.
  3.  **Goal Cards:** 18 index cards. Each reads: *"Personal Life Plan: To complete this plan, you must retain at least 6 tokens at the end of the session. If you finish with fewer than 6, your Plan fails."*
  4.  **Prize:** One high-quality chocolate bar (or equivalent trivial prize).
  5.  **Whiteboard:** Divided into two sections: "Phase 1 Refusal Points" and "Phase 2 Refusal Points."
  6.  **Anonymous Slips:** Small scraps of paper for students to write refusal points/reasons.
  7.  **Timer:** Visible to you.

  ## II. Facilitator Script & Timeline

  ### 0:00 – 0:10 | Setup & Rules (No Theory)
  *Arrange chairs in a large circle. Hand out one envelope (20 tokens) and one Goal Card to each student. Do not let them read the Goal Card yet.*

  **Script:**
  "Welcome. Today we are running a simulation. There is no reading required, and I am not going to tell you what moral theory we are discussing until the very end.

  Here are the rules. Inside your envelope are 20 tokens. At the end of class, we will hold a raffle. Each token you hold is one entry into the raffle for this chocolate bar. More tokens = higher chance of winning.

  However, there is a 'Global Pot' on the table. Tokens in the Global Pot do not help you win the prize. Instead, they generate 'Relief Units.' The exchange rate is fixed and fictional: **1 Token = 100 Relief Units** for a fictional disaster zone.

  Your task is not to win. Your task is to decide, in real-time, how many tokens you are willing to move from your envelope to the Global Pot.

  Please do not talk to each other about your decisions. Keep your tokens hidden. Do not read the Goal Card yet. Wait for my instruction."

  ### 0:10 – 0:35 | Phase 1: The Escalation
  *Goal: Establish the instability of the stopping point.*

  **Script:**
  "We will proceed in rounds. In each round, I will ask you to consider moving **one additional token** from your envelope to the Global Pot.
  Round 1: Will you give 1 token?
  Round 2: Will you give a 2nd token?
  Round 3: Will you give a 3rd token?
  And so on.

  You may stop at any time. When you decide to stop giving, you must do three things:
  1. Stop moving tokens.
  2. Take an anonymous slip.
  3. Write down: (A) The number of tokens you gave, and (B) One sentence explaining *why* you stopped at that number and not one higher.
  4. Place the slip in this box.

  You may keep giving even if others stop. There is no penalty for stopping, and no reward for giving more, other than the knowledge of the Relief Units generated.

  Let us begin. Round 1. Please consider giving 1 token."
  *(Wait 30 seconds. Observe. Do not comment on who gives.)*
  "Round 2. Consider giving a 2nd token."
  *(Continue rounds. Speed up slightly as numbers get higher. Stop the verbal rounds when you notice significant hesitation or when about half the class has stopped submitting tokens. Usually around token 8–12.)*

  **Script:**
  "Pause. Please finalize your decision for Phase 1. If you have stopped, submit your slip. If you are still giving, submit a slip stating your current number and 'Continuing.' Place all slips in the box."

  *(Collect slips. While a student helper or you quickly tally the refusal numbers on the board under "Phase 1," ask the class to sit quietly.)*

  **Action:** Write the refusal numbers on the board in ascending order (e.g., 3, 4, 4, 5, 7, 9, 12, 20). Do not write names.

  ### 0:35 – 0:45 | Phase 1 Debrief (The Instability)
  *Goal: Highlight the arbitrariness of the stopping point.*

  **Script:**
  "Look at the board. We have a spread of stopping points. I am going to read a few of the anonymous reasons you wrote."
  *(Read 3-4 distinct reasons, e.g., 'I needed to keep some for myself,' '5 felt like enough,' 'It started to feel like too much.')*

  "Question for the room: If giving 5 tokens was 'enough' for one person, and 9 was 'enough' for another, what is the moral difference between token 6 and token 8? Why is token 6 too costly for the first person, but token 8 acceptable for the second? Is there a principled difference, or is it just a feeling?"
  *(Allow 5 minutes of discussion. Do not answer. Push them on the justification.)*
  "Did anyone feel they could name the exact token where the demand became 'wrong'? Or did you just feel a resistance?"

  ### 0:45 – 0:50 | Phase 2 Setup (The Personal Project)
  *Goal: Introduce the Integrity/Identity constraint.*

  **Script:**
  "We are moving to Phase 2. Please take your envelopes again. You retain the tokens you kept in Phase 1.

  Now, please read your Goal Card."
  *(Students read: "To complete this plan, you must retain at least 6 tokens...")*

  "This card represents a deep personal commitment. For some, this is finishing a degree. For others, caring for a parent. For others, an artistic project. To complete this Plan, you **must** finish the session with at least 6 tokens. If you drop below 6, your Plan fails. You cannot buy it back.

  However, the Global Pot is still open. The exchange rate is the same: 1 Token = 100 Relief Units. The need in the disaster zone has not changed.

  We will resume the rounds. You may give tokens from your remaining stash. But remember: if you dip below 6, you betray your Plan.
  Begin Round 1 of Phase 2."
  *(Resume the counting. "Will you give 1 more?" "Will you give another?")*

  *Note: Students who kept fewer than 6 tokens in Phase 1 are now in immediate conflict. Students who kept many must decide if they will sacrifice their Plan for the Pot.*

  ### 0:50 – 1:05 | Phase 2 Execution & Data Collection
  *Run the rounds until the tension peaks. Most will stop exactly at 6 retained tokens. Some might sacrifice the Plan. Some might refuse to give any more.*

  **Script:**
  "Stop. Submit your final anonymous slips. This time, write: (A) Tokens Retained, (B) Did you complete your Plan? (C) Why did you stop here?"

  *(Collect slips. Tally on the board under "Phase 2." Note how many failed their Plan.)*

  ### 1:05 – 1:25 | Final Debrief (Mapping the Objection)
  *Goal: Connect experience to theory. Name the objection.*

  **Script:**
  "Look at the two boards. In Phase 1, many of you stopped because it 'felt like enough.' In Phase 2, your stopping point likely clustered around 6 tokens.

  Here is what we were simulating: You were acting as agents under a strict Consequentialist framework. The rule was simple: Maximize Relief Units. The only limit was your willingness to pay the cost.

  The discomfort you felt is known in philosophy as the **Demandingness Objection**. But that label hides three distinct complaints. Let's map your experience to them."

  **(Write on Board: 1. Overdemandingness, 2. Fairness, 3. Integrity)**

  **1. Overdemandingness (The Plain Claim)**
  "Raise your hand if you stopped in Phase 1 simply because giving more was annoying or costly, even though you knew it would do more good."
  *(Link to activity: The feeling that the theory asks for more than is reasonable.)*
  "Standard Reply: The world is demanding, not the theory. If children are starving, does your inconvenience matter? The theory just reflects the severity of the need."

  **2. Fairness (The Compliance Complaint)**
  "Did anyone look around the room and think, 'Why should I give 10 tokens if the person next to me is only giving 2'?"
  *(Link to activity: The resentment that the burden is not shared.)*
  "Standard Reply: Consequentialism judges *your* action, not the collective outcome. However, some argue for a 'Cooperative Consequentialism' where demands are scaled to what others do."

  **3. Integrity/Alienation (The Williams Complaint)**
  "This is Phase 2. How many of you stopped giving *specifically* because you needed to keep your 6 tokens for your Plan?"
  *(Link to activity: The moment the demand threatened your identity/project.)*
  "This is the strongest version. It's not that the cost is high; it's that paying it requires you to abandon the projects that make you *you*. If morality requires you to abandon your Life Plan, does morality require you to cease being a distinct person?"
  "Standard Reply: Ordinary morality also demands integrity sacrifices (e.g., lying to save a life). Why is consequentialism unique? Also, a 'Scalar' version of the theory says you are never 'required' to do anything, just that some acts are better than others. Does that solve the problem?"

  **Closing Question:**
  "Is the problem that Consequentialism is false? Or is the problem that the world is a place where doing the right thing might ruin your Life Plan? The activity cannot answer that. But it should make you feel why the question is hard."

  ### 1:25 – 1:30 | Wrap Up
  "Next week, read Williams' 'A Critique of Utilitarianism.' Bring your Goal Card with you. Class dismissed."
  *(Conduct the raffle quickly to honor the stakes.)*

  ---

  ## III. Troubleshooting: Predictable Failure Modes

  **1. The Performative Maximizer**
  *   **Risk:** One student donates all 20 tokens immediately, making others look selfish.
  *   **Handling:** Do not praise them. Treat their data point as neutrally as the person who gave zero. Say: "That is a valid data point. It shows the upper bound of willingness." If they speak, ask: "Did you feel a cost? If not, does your choice tell us about the theory's demand, or just your preferences?"

  **2. The Anchor Speaker**
  *   **Risk:** A vocal student says "I'm stopping at 5" out loud, influencing others.
  *   **Handling:** Reinforce the anonymity rule strictly. "Please do not announce numbers. The value of this exercise is in your private calculation." If it happens, remind the class: "Your slip is anonymous. You are free to change your number before submitting."

  **3. The Real-World Skeptic**
  *   **Risk:** "This is stupid. 1 token doesn't actually save anyone."
  *   **Handling:** Agree with them. "You are right. The exchange rate is fictional. We are testing the *structure* of the demand, not the efficacy of the charity. Treat the 'Relief Units' as abstract value."

  **4. The Moral Leaderboard**
  *   **Risk:** Students view those who gave more as "better people."
  *   **Handling:** Pre-empt this in the Setup. "There is no correct answer here. A person who keeps 19 tokens might have a Life Plan that requires it. A person who gives 20 might not. We are studying the *justification*, not ranking the *agents*."

  **5. Phase 2 Confusion**
  *   **Risk:** Students forget the "6 Token" rule or think they can buy the Plan back.
  *   **Handling:** Write the rule on the board during Phase 2: **RETAIN ≥ 6 OR PLAN FAILS**.

  ---

  ## IV. Limitations: What This Activity Cannot Do

  Be prepared to admit these limitations if students raise them in the debrief.

  1.  **Unbounded vs. Bounded:** The activity ends after 90 minutes. Real consequentialist demands are lifelong and unbounded. The activity simulates a *snapshot* of the demand, not the crushing weight of a lifetime of sacrifice.
      *   *Say:* "You got to go home after this. A real agent faces this demand every day. The fatigue is cumulative."
  2.  **Normative Status:** The activity makes the demand *feel* objectionable. It does not prove that the demand *is* morally objectionable. It appeals to intuition, not argument.
      *   *Say:* "Feeling uncomfortable doesn't make a theory false. Physics is often counter-intuitive. We must decide if this intuition is a truth-tracker or a bias."
  3.  **Isolation:** Students make decisions in a vacuum. Real moral life involves community, support, and shared burden.
      *   *Say:* "You were alone in this room. In reality, you might organize with others to share the burden, which changes the individual cost."

  ---

  Bottom line: The activity succeeds only if students recognize that their stopping point is psychologically inevitable but philosophically arbitrary, forcing them to confront whether morality is about limits or outcomes.
