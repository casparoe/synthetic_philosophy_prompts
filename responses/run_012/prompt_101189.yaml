      *   No naming objection until debrief? (Check).
      *   Fictional exchange rate? (Check).
      *   Troubleshooting section? (Check).
      *   Limitations section? (Check).
      *   Bottom line sentence? (Check).

  13. **Final Review of the "Bottom Line":** Needs to be punchy and accurate. "Bottom line: The activity succeeds only if students recognize that their stopping point is arbitrary rather than justified." Or something about the *source* of the objection. Let's go with: "Bottom line: The activity succeeds only if students recognize that their stopping point feels arbitrary rather than principled, forcing them to confront whether morality is about limits or outcomes." -> Let's refine that to match the prompt's focus on the *objection landing*. "Bottom line: The activity succeeds only if students recognize that their refusal to continue stems from an inability to justify the specific boundary of their sacrifice, rather than from a principled limit on what morality can ask."

