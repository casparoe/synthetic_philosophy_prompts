answer: |-
  You have stumbled onto one of the most famous problems in 20th-century philosophy without reading a single page of Kant or Kripke. Your gut is working correctly, but your two rules (P1 and P2) are tracking **two different dimensions**, not one.

  In philosophy, these are called the **Epistemic** dimension (how you know it) and the **Modal** dimension (how the world could have been).

  Here is the principle that resolves your conflict, translated into engineering terms.

  ### The Two Axes

  You are trying to map everything onto a single boolean: `IS_DEFINITION`. But you actually have two independent flags:

  1.  **Epistemic Status (Your P1):** Is this known **A Priori** (by reasoning/words alone, like reading a spec) or **A Posteriori** (by checking the world, like running integration tests)?
  2.  **Modal Status (Your P2):** Is this **Necessary** (true in all possible universes, like a type constraint) or **Contingent** (true in this universe, but could have been otherwise, like a runtime value)?

  The traditional view (pre-1970s) assumed these always lined up:
  *   **Definition** = A Priori + Necessary
  *   **Fact** = A Posteriori + Contingent

  Your intuition broke because **they don't always line up.** There are edge cases where the flags decouple.

  ### The Classification Grid

  Let's run your list through this 2x2 grid.

  #### 1. The "Pure Definitions" (A Priori + Necessary)
  *   **"If someone's a bachelor, they're unmarried."**
  *   **"If a shape is a square, it has four sides."**
  *   **"A correct program does what its spec says."**
      *   **Verdict:** These are **Analytic**. The predicate is contained in the subject.
      *   **Why:** If you change the truth value, you break the language. If a bachelor is married, you aren't speaking English anymore.
      *   **Engineering Analogy:** This is an **Interface Contract**. If the implementation violates it, the implementation is wrong, not the contract.

  #### 2. The "Math & Logic" Cases (A Priori + Necessary)
  *   **"Every number divisible by 4 is even."**
  *   **"If a triangle has three equal sides, it has three equal angles."**
  *   **"If a number is prime and bigger than 2 then it is odd."**
      *   **Verdict:** These are **Necessary Truths**, but they require **Derivation**.
      *   **Why:** You said the triangle one "feels like a discovery." It is! But it's a discovery of *implications*, not *facts*. You don't need to measure physical triangles (which are never perfect anyway); you need to unpack the definitions of Euclidean space.
      *   **The "Work" Factor:** Just because you have to compute it doesn't make it empirical. `2 + 2 = 4` is true by definition, but a toddler has to count on their fingers to learn it. The "work" is computational complexity, not empirical data gathering.
      *   **Engineering Analogy:** This is **Compile-Time Logic**. The compiler might have to do heavy type inference to prove it, but the result is fixed before the program runs.

  #### 3. The "Water" Case (A Posteriori + Necessary)
  *   **"Water is H2O."**
  *   **"A whale is a mammal."**
      *   **Verdict:** This is the bombshell. These are **Synthetic Necessary Truths**.
      *   **Why:** You were right to feel conflicted.
          *   **Epistemic (P1):** It is **A Posteriori**. We had to go look at the world to find this out. Ancients didn't know it. It was a discovery.
          *   **Modal (P2):** It is **Necessary**. Once we identify that the stuff in the lakes *is* H2O, there is no possible world where "water" (the actual stuff) is *not* H2O. If you find a liquid that looks like water but is XYZ, it isn't water; it's a different substance.
      *   **Why it feels like a definition:** Because now that we know it, we treat it as essential to the identity of the thing.
      *   **Engineering Analogy:** This is **Hard-Coded Configuration discovered at Runtime**. You didn't know the config value was `H2O` until you deployed, but now that you know, the system *cannot* be otherwise without ceasing to be the same system.

  #### 4. The "Metre Bar" Case (A Priori + Contingent)
  *   **"The bar in the vault... is one metre long."** (At the time it defined the metre).
      *   **Verdict:** This is a **Contingent A Priori Truth**.
      *   **Why:**
          *   **Epistemic (P1):** You know it **A Priori**. By definition, that bar is the standard. You don't need to measure it with another metre stick.
          *   **Modal (P2):** It is **Contingent**. If someone heated the vault, the bar would expand. It would physically be longer. It would still be "one metre" by definition, but the physical length would have changed.
      *   **Engineering Analogy:** This is **Stipulative Constant**. `const METRE = getPhysicalBarLength()`. The code defines `METRE` as whatever that function returns. The code is "true by definition," but the return value depends on the physical state of the server.

  #### 5. The "Red/Green" Case (Conceptual Exclusion)
  *   **"Nothing can be all red and all green..."**
      *   **Verdict:** This is usually treated as **Analytic/Conceptual**.
      *   **Why:** It depends on how you define color space. In our human perceptual model, "red" and "green" are defined as mutually exclusive coordinates. It's not a law of physics (light frequencies can mix); it's a law of our *categorization*.
      *   **Engineering Analogy:** Enum values. `Color` cannot be `RED` and `GREEN` simultaneously because the type definition forbids it.

  #### 6. The "Build/Tests" Case (Stipulative Shift)
  *   **"If the build passes, the tests pass."**
      *   **Verdict:** You identified this perfectly. You moved a **Synthetic** claim to an **Analytic** one by refactoring.
      *   **Yesterday:** `Build` and `Tests` were separate processes. The claim was an observation about the pipeline (Synthetic/Contingent).
      *   **Today:** You redefined `Build` to *include* `Tests`. Now the claim is true by the definition of your CI/CD config (Analytic).
      *   **Engineering Analogy:** You refactored a **Runtime Check** into a **Type Constraint**.

  ---

  ### Addressing Your Specific Questions

  **1. Is there a principle that matches my gut?**
  Yes. Your gut is distinguishing between **Linguistic Truth** (Analytic) and **Metaphysical Truth** (Necessary).
  *   **Rule:** A sentence is "True by Definition" if its negation implies a contradiction in terms (Bachelor/Married).
  *   **Rule:** A sentence is "True because of the World" if its negation is conceivable, even if false (Water/H2O).
  *   **The Conflict:** "Water is H2O" is true because of the world (we had to look), but it is *metaphysically fixed* (it couldn't be otherwise). Your gut sensed the "fixed" part (P2) but your definition rule sensed the "looking" part (P1).

  **2. Where do the triangle and water cases end up?**
  *   **Triangle:** It is **True by Definition** (within Euclidean geometry). The "work" you did was compiling the logic, not gathering data.
  *   **Water:** It is **True because of the World** (Synthetic), BUT it is **Necessary**. This is the category you were missing. It's not a "random fluke" (Contingent); it's an "essential identity" (Necessary).

  **3. Is this a real distinction or a spectrum?**
  It is a real distinction, but the mapping is 2D, not 1D.
  However, a philosopher named **W.V.O. Quine** would tell you that even the "Definition" side is a spectrum. He argued that *no* statement is immune to revision. If we found a married bachelor, we wouldn't say "logic is broken," we'd say "our definition of bachelor was wrong."
  For a software engineer, though, the distinction is real enough to be useful: **Interface vs. Implementation.**
  *   **Analytic/A Priori:** Interface specs, Type definitions.
  *   **Synthetic/A Posteriori:** Implementation logic, Runtime state.
  *   **Necessary A Posteriori:** Immutable infrastructure, Hardware IDs.

  **4. Predictions for your new cases:**

  *   **"If you're in pain you're having an experience."**
      *   **Prediction:** **True by Definition (Analytic).**
      *   **Reasoning:** "Pain" is defined as a type of subjective experience. If you are having no experience, you aren't in pain. You can't discover this in a lab; you understand it by understanding the word "pain."
      *   **Verdict:** A Priori + Necessary.

  *   **"If a number is prime and bigger than 2 then it is odd."**
      *   **Prediction:** **True by Definition (Analytic/Mathematical).**
      *   **Reasoning:** This feels like the triangle case. It requires proof (work), but the truth is contained within the definitions of "prime," "2," and "odd." It does not depend on the physical universe.
      *   **Verdict:** A Priori + Necessary.

  ### The "Straight Talk" Conclusion

  Your gut is contradicting itself because you are using one label ("True by Definition") for two different things:
  1.  **Linguistic Tautology:** True because of how we use words (Bachelor).
  2.  **Metaphysical Necessity:** True because of the nature of reality (Water).

  **The Verdict:**
  *   Stick with **P1 (Knowable by words/reason)** as your test for "True by Definition."
  *   Use **P2 (Could it be false)** as a test for "Necessary Truth."
  *   Accept that **Water is H2O** is a "Necessary Truth" that is **NOT** "True by Definition." It is a fact about the world that happens to be unchangeable.

  You aren't making it up case-by-case. You've independently rediscovered the **Kripkean distinction** between *epistemic access* and *metaphysical necessity*. In engineering terms: you've realized that **Documentation** (Definition) and **Source Code** (Reality) usually match, but sometimes the Source Code is immutable (Water), and sometimes the Documentation is just a pointer to a mutable variable (Metre Bar).
