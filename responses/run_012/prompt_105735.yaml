  6.  **Developing the New Cases:**
      *   *Third-Party Memory:* Chain is Human -> Memory -> Builder -> Copy. Is this "appropriate causal chain"? Usually, rationalist criteria require reliable causation. Human memory is unreliable. Verdict: Weak survival or No survival (too much noise/interpretation).
      *   *Old Scan:* Scan at 20, Die at 50, Build at 50. Copy is 20. Psychological continuity exists but with a gap and regression. Verdict: Survival, but with a "time jump" and loss of intervening memories. (Like waking from amnesia).
