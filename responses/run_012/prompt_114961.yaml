          *   *Correction/Refinement:* In standard MU, $U$ is just a symbol. The invariant is usually tracked on the count of $I$'s.
              *   Rule 1: $xI \to xIU$ (I count unchanged).
              *   Rule 2: $Mx \to Mxx$ (I count doubles).
              *   Rule 3: $III \to U$ (I count decreases by 3).
              *   Rule 4: $UU \to \epsilon$ (I count unchanged).
              *   Invariant: $N_I \pmod 3 \neq 0$. Start with 1. Doubling $1 \to 2 \to 4 \equiv 1$. Subtracting 3 doesn't change mod 3. So $N_I \pmod 3$ is always 1 or 2.
          *   MIU-plus (Add $U \to III$): Now you can increase I count by 3. This doesn't change $N_I \pmod 3$. So the invariant *holds*. MU has 0 I's. $0 \equiv 0 \pmod 3$. Start is $1 \pmod 3$. So MU is *still* unreachable. This is a trap for students who think "more rules = reachable."
