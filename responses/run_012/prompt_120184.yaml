prompt: |-
  i just started a part time gig at a small natural history museum, mostly writing label text, and the exhibit we're putting up in the spring has a big wall timeline running from the Pleistocene to now with the Anthropocene as the last chunk of it. the designer wants a date printed on the wall and i've been volunteered to defend whatever date we use, which has turned into a running argument with my flatmate, who did a geology degree and keeps telling me the whole question is dead because a committee of stratigraphers voted the epoch down a year or two ago (they'd proposed some lake in Ontario as the reference site, and then the thing went up the chain and got knocked back, and there was a whole procedural row about how the vote was handled). so before i write a word i want the spec rather than an answer, i want to know what i should even be asking of a proposal about when the Anthropocene started.

  what i'm after: the list of requirements any serious candidate answer has to meet, with the case behind each one, and a view on which are non-negotiable and which are just preferences of one camp. so: the start dates people actually put forward (the early-agriculture one, the 1610 low point that's supposed to come from forests regrowing after the conquest of the Americas, the 1780s steam-engine date, the 1950s bomb-test fallout) and what each of them does and doesn't deliver; the distinctions a proposal can't be allowed to collapse, like a unit defined by a single point in one rock or sediment sequence vs. a stretch of time, an isochronous marker vs. a phenomenon that spreads across the planet at different speeds, the base of a stratigraphic unit vs. the onset of the human influence it's meant to name, and a formal geological unit vs. the loose word humanists use; the rules it has to play by if it wants to be a geological unit at all, i.e. what the stratigraphic bodies demand of a boundary and of a candidate site, the chain of votes from the working group up through the subcommission and the commission and the union, and the supermajority thresholds involved; and what it has to be consistent with in the actual record, meaning what's readable in sediments and ice, how far back each signal can be detected, and how long a marker would still be findable by geologists a few million years from now.

  then the part i care about most: flag which of these requirements can't be satisfied at the same time. my suspicion is that picking the cleanest, most globally synchronous marker forces you onto a date so recent that the concept becomes useless to the historians and artists who actually use the word, and if that's a real conflict rather than me being confused, say so and say what has to give. i'd also like a view on which single requirement does the most work in ruling candidate dates out, and on the who-decides side: what a defensible decision procedure would have to look like given that the term leaked out of geology into everything else -- is it a problem that the only votes that counted were cast by geologists, and could a process be set up that was legitimate for the other users without giving them a veto over the stratigraphy? i don't need you to score every contender, i'll do that in the label copy, i just want the criteria and the conflicts. a table would be fine if it helps.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Part-time museum worker writing label text for a timeline exhibit (Pleistocene to Anthropocene).
      *   **Context:** There's a debate with a flatmate (geology grad) about the validity of the Anthropocene as a formal epoch due to recent stratigraphic committee votes (specifically the rejection of Crawford Lake). The designer wants *a* date.
      *   **Goal:** The user doesn't want a definitive answer (e.g., "Pick 1950"). They want the *specification* for a proposal. They want to know the requirements, the trade-offs, the conflicts, and the decision-making process.
      *   **Tone:** Intellectual, precise, nuanced, slightly academic but accessible (museum label context), acknowledging the tension between science and humanities.
      *   **Key Deliverables:**
          1.  List of requirements for a serious candidate start date (with cases for each).
          2.  Distinctions that must not be collapsed (e.g., GSSP vs. onset of influence).
          3.  Formal rules (ICS hierarchy, voting thresholds).
          4.  Stratigraphic consistency (what's readable in the record).
          5.  **Crucial:** Flag incompatible requirements (trade-offs).
          6.  **Crucial:** Identify the single most exclusionary requirement.
          7.  **Crucial:** Address the "who decides" legitimacy issue (geologists vs. wider usage).
          8.  Format: Text + Table (if helpful).

  2.  **Deconstruct the Scientific/Procedural Context:**
      *   *The "News":* In 2024, the International Commission on Stratigraphy (ICS) effectively rejected the formalization of the Anthropocene as a geological epoch. The proposal for Crawford Lake (1950s) was voted down by the Subcommission on Quaternary Stratigraphy (SQS) and upheld by the ICS. The flatmate is right: formally, it's "dead" as an epoch *for now*.
      *   *The Museum Need:* Museums still need to tell a story. The term "Anthropocene" is culturally potent even if stratigraphically informal.
      *   *The Conflict:* Formal Stratigraphy (Golden Spikes/GSSP) vs. Informal Usage (Humanities/Activism/General Science).

  3.  **Drafting the Requirements (The "Spec"):**
      *   *Requirement 1: Stratigraphic Signal.* Needs a physical marker (plutonium, microplastics, carbon isotopes).
      *   *Requirement 2: Global Synchronicity.* Needs to be found everywhere at roughly the same time (isochronous).
      *   *Requirement 3: Permanence.* Needs to last millions of years.
      *   *Requirement 4: Distinctiveness.* Needs to look different from the Holocene.
      *   *Requirement 5: Procedural Legitimacy.* ICS rules (Working Group -> SQS -> ICS -> IUGS).
      *   *Requirement 6: Conceptual Utility.* Needs to make sense for the narrative (human impact).

  4.  **Identifying the Distinctions (Don't Collapse These):**
      *   *Formal Epoch vs. Informal Term.*
      *   *GSSP (Point) vs. GSSA (Age).*
      *   *Onset of Impact vs. Stratigraphic Boundary.* (Humans impacted things long before a global signal).
      *   *Process vs. Event.*

  5.  **Addressing the Candidates (Briefly, as per prompt):**
      *   *Early Ag (10kya):* Good for impact narrative, bad for stratigraphy (diachronous).
      *   *Orbis Spike (1610):* Good global signal (CO2 drop), but debated magnitude.
      *   *Industrial (1780s):* Good narrative, bad stratigraphic sharpness.
      *   *Great Acceleration (1950):* Best stratigraphy (radionuclides), too recent for some narratives.

  6.  **Analyzing the Conflicts (The "Impossible Triangle"):**
      *   *Conflict 1:* Global Synchronicity vs. Early Onset. (Early = messy/local; Sync = late/radioactive).
      *   *Conflict 2:* Formal Rigor vs. Cultural Utility. (Geologists want a spike; Historians want a process).
      *   *Conflict 3:* Precision vs. Accuracy. (A precise date implies a sudden change that didn't happen).
      *   *The "Single Most Exclusionary Requirement":* Global Synchronicity (Isochrony). This kills the Early Ag and Industrial dates for *formal* status.

  7.  **Addressing the "Who Decides" Legitimacy:**
      *   Geologists hold the keys to the *rock record*.
      *   Humanities hold the keys to the *concept*.
      *   *Solution:* Dual-track. Formal stratigraphy stays with ICS. Museum/Policy uses "Informal Anthropocene" with defined criteria suitable for the context. Don't let geologists veto culture, don't let culture demand geological precision.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the flatmate's correctness (ICS rejection) but validate the museum's need (cultural utility).
      *   **Section 1: The Specification (Requirements).** Break down into Stratigraphic, Procedural, and Conceptual.
