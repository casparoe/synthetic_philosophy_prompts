  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to mention the specific 2024 ICS decision clearly so the user knows the flatmate is technically right about the *formal* status.
      *   *Nuance:* Ensure the distinction between GSSP (Global Boundary Stratotype Section and Point) and the general concept is clear.
      *   *Tone Check:* Keep it professional but engaging. The user asked for a "spec," so use language like "constraint," "threshold," "deliverable."
