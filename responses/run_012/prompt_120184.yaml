answer: |-
  This is a sophisticated brief. You are asking for the *metadata* of the debate rather than the data itself, which is the correct approach for a museum label that needs to survive shifts in scientific consensus.

  Your flatmate is technically correct regarding the *formal* status: in March 2024, the International Commission on Stratigraphy (ICS) voted against ratifying the Anthropocene as a formal geological epoch. The proposal to anchor it at Crawford Lake, Canada, circa 1950, was rejected. However, the *term* remains vital in cultural, political, and scientific discourse.

  For a museum timeline, you are navigating two distinct regimes: **Formal Stratigraphy** (rocks, votes, boundaries) and **Informal Chronocorrelation** (narratives, impacts, processes).

  Below is the specification you asked for. It outlines the requirements for a start date, the constraints of the geological code, the inevitable conflicts, and the legitimacy of the decision-making process.

  ### 1. The Specification: Requirements for a Candidate Start Date

  To defend a date on a wall, you must declare which "regime" the date belongs to. A date cannot simultaneously satisfy the requirements of a Formal Golden Spike (GSSP) and the requirements of a Cultural/Historical narrative.

  #### A. Stratigraphic Requirements (For a Formal Geological Unit)
  These are non-negotiable if you claim the date marks a geological *epoch*.

  1.  **Global Synchronicity (Isochrony):**
      *   *The Case:* A geological boundary must be effectively instantaneous across the planet. If the signal appears in Europe in 1800 and in Asia in 1900, it is diachronous and cannot define a single horizontal line in the rock record.
      *   *Status:* **Non-negotiable** for formal stratigraphy.
  2.  **Primary Marker Preservation:**
      *   *The Case:* There must be a physical signal preserved in sediment, ice, or coral that will be detectable by geologists 10 million years from now. Examples: Plutonium-239 fallout, fly ash, distinct carbon isotope excursions.
      *   *Status:* **Non-negotiable** for formal stratigraphy.
  3.  **Distinctiveness from the Holocene:**
      *   *The Case:* The sediments above the line must be measurably different from those below it in a way that isn't just "more of the same."
      *   *Status:* **Non-negotiable** for formal stratigraphy.
  4.  **Accessibility of the Stratotype:**
      *   *The Case:* There must be a specific physical location (the "Golden Spike" site) where the boundary is clearly visible and accessible for future calibration.
      *   *Status:* **Non-negotiable** for formal stratigraphy.

  #### B. Conceptual Requirements (For a Cultural/Historical Narrative)
  These are non-negotiable if you want the label to make sense to historians, artists, and the public.

  1.  **Causal Attribution:**
      *   *The Case:* The date should correspond to a shift in human behavior or capacity that *caused* the change (e.g., invention of steam engine, colonization of Americas).
      *   *Status:* **Non-negotiable** for public understanding.
  2.  **Process Duration:**
      *   *The Case:* Human impact is a ramp, not a step. The date should acknowledge a transition, not imply the world changed overnight.
      *   *Status:* **Preference** (can be managed with label copy), but critical for accuracy.
  3.  **Political/Historical Resonance:**
      *   *The Case:* The date should align with recognized historical eras (e.g., Industrial Revolution, Post-War).
      *   *Status:* **Preference**, but aids visitor engagement.

  ### 2. Distinctions You Cannot Collapse

  In your label text, you must keep these concepts separate. Collapsing them is where most controversies arise.

  *   **GSSP vs. GSSA:** A **GSSP** (Global Boundary Stratotype Section and Point) is a physical spike in a rock somewhere (e.g., Crawford Lake). A **GSSA** (Global Standard Stratigraphic Age) is a fixed number on a calendar (e.g., 1950 CE) used when rock records are poor. The Anthropocene Working Group (AWG) sought a GSSP; a museum timeline often needs a GSSA.
  *   **Onset of Influence vs. Stratigraphic Boundary:** Humans have influenced the planet for millennia (megafauna extinctions, agriculture). This is the *onset of influence*. A stratigraphic boundary is the point where that influence becomes *globally synchronous and rock-recordable*. They are not the same date.
  *   **Formal Unit vs. Informal Term:** "Holocene" is a formal unit ratified by the ICS. "Anthropocene" is currently an informal term, like "Ice Age." You can use it without it being an epoch.
  *   **Event vs. Process:** Stratigraphy demands a boundary (an event). History describes a process. A single date on a wall inevitably misrepresents a process.

  ### 3. The Procedural Rules (The "Who Decides" Chain)

  If you were pursuing formal status, this is the gauntlet. Knowing this helps explain why the 1950s date was chosen (it was the only one that could pass this gauntlet) and why it ultimately failed.

  1.  **Anthropocene Working Group (AWG):** Proposes the concept and candidate. (Vote: Simple majority).
  2.  **Subcommission on Quaternary Stratigraphy (SQS):** Must approve the proposal. (Vote: **60% majority** required). *This is where the Crawford Lake proposal failed in 2024.*
  3.  **International Commission on Stratigraphy (ICS):** Final scientific approval. (Vote: **75% majority** required).
  4.  **International Union of Geological Sciences (IUGS):** Executive ratification.

  **Legitimacy Note:** The only votes that count for *geological time* are those of geologists. This is not a bug; it is a feature. Geologists are the custodians of the rock record. However, this creates a legitimacy gap for *cultural time*. A defensible decision procedure for a museum is **dual-track**: Acknowledge the ICS rejection of the formal epoch, but assert the museum's authority to use the term informally based on interdisciplinary consensus. Do not give historians a veto on stratigraphy, and do not give stratigraphers a veto on history.

  ### 4. The Incompatibilities (The "Impossible Triangle")

  This is the core of your request. You suspected that picking the cleanest marker forces a date too recent for the concept to be useful. **You are correct.**

  There is a fundamental tension between **Stratigraphic Precision**, **Historical Utility**, and **Global Synchronicity**. You can pick two, but not all three.

  | Conflict | The Tension | What Has to Give |
  | :--- | :--- | :--- |
  | **Synchronicity vs. Early Onset** | To be globally synchronous (Stratigraphy), the signal must be atmospheric or oceanic (e.g., radionuclides). These only appear in the 1950s. Early human impacts (Ag, Colonization) were regional and diachronous. | If you want an early date (1610, 1780), you must sacrifice **Formal Stratigraphic Status**. You are defining a cultural epoch, not a rock layer. |
  | **Precision vs. Process** | Stratigraphy requires a boundary (a line). Human impact is a gradient (a curve). A precise date (1950) implies a sudden switch that didn't happen. | If you want a precise date for the wall, you must add text qualifying it as a **conventional marker**, not a literal switch. |
  | **Permanence vs. Relevance** | The best stratigraphic markers (Plutonium) are permanent in rock but meaningless to a visitor's understanding of *cause*. The best causal markers (Steam Engine) leave weak rock signals. | If you prioritize **Visitor Understanding**, you must accept a weaker stratigraphic signal. |

  **The Single Most Exclusionary Requirement:**
  **Global Synchronicity (Isochrony).**
  This is the requirement that killed the Early Agriculture and Industrial Revolution dates for formal status. Human development spread at different speeds across the globe. There is no single year where "Industrialization" appears in the sediment of Antarctica, China, and the Amazon simultaneously. Only the mid-20th century "Great Acceleration" (nuclear tests, plastics, concrete) provides a signal that hits everywhere at once. If you demand synchronicity, you are forced to 1950. If you reject 1950 as "too late" for the story, you must abandon synchronicity and thus formal stratigraphy.

  ### 5. Audit of Candidate Dates Against the Spec

  | Candidate Date | Signal | Stratigraphic Viability | Narrative Viability | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **~10,000 BP (Agriculture)** | Pollen changes, erosion | **Fail.** Diachronous (spread over millennia). No global marker. | **High.** Captures the start of major human landscape modification. | **Informal Only.** Good for "Human Impact" timeline, bad for "Epoch" boundary. |
  | **1610 (Orbis Spike)** | CO2 drop (genocide/reforestation) | **Low.** Signal is detectable in ice cores but debated in magnitude. | **High.** Links ecology to colonialism. | **Informal Only.** Strong candidate for "Early Anthropocene," weak rock record. |
  | **1780s (Industrial)** | Soot, Carbon isotopes | **Low.** Soot is patchy. Isotope curve is gradual, not sharp. | **High.** Aligns with technology and capitalism narratives. | **Informal Only.** Culturally resonant, stratigraphically messy. |
  | **1950 (Great Acceleration)** | Plutonium-239, Fly Ash, Concrete | **High.** Sharp, global, permanent signal. (The Crawford Lake proposal). | **Low.** Feels too recent. Ignores prior colonial/industrial damage. | **Formal Candidate (Rejected).** Best rock record, worst historical nuance. |

  ### 6. Recommendation for the Label Copy

  Since the ICS has voted down the formal epoch, your museum is not bound by their constraints. You are curating a narrative, not a rock core.

  **The Strategy:**
  1.  **Print the Date:** Choose **1950** if you want to align with the scientific "Great Acceleration" data visualizations (which most visitors will recognize). Choose **1800** if you want to align with the Industrial Revolution narrative.
  2.  **Qualify the Label:** Do not label it "Start of the Anthropocene Epoch." Label it "Conventional Boundary of the Anthropocene" or "Onset of the Great Acceleration."
  3.  **Acknowledge the Conflict:** Use the text to explain *why* there is a debate. This turns a liability (the argument with your flatmate) into an exhibit feature (science as a process).

  **Sample Text Logic:**
  *"While human influence on the planet began millennia ago, geologists seek a specific marker in the rock record that appears globally at the same time. The mid-20th century offers the clearest signal (radioactive fallout from nuclear tests). However, historians argue this ignores earlier impacts. This timeline uses 1950 as a conventional boundary for the 'Great Acceleration,' while acknowledging that the human footprint stretches back further."*

  ### Summary Checklist for Your Defense

  When the designer or your flatmate challenges the date, ask these three questions:

  1.  **Are we defining a rock layer or a cultural era?** (If rock, must be 1950 or nothing. If cultural, any date is defensible with caveats).
  2.  **Are we prioritizing synchronicity or causality?** (Synchronicity = 1950. Causality = 1610/1780).
  3.  **Are we claiming ICS ratification?** (If yes, you are wrong. If no, you are free to choose the most pedagogically useful date).

  **Final View:** The requirement for **Global Synchronicity** is the hard filter. It is the only non-negotiable constraint for *geology*. For a *museum*, it is optional. If you drop it, you unlock the earlier dates, but you must explicitly state that you are using "Anthropocene" as a cultural-historical term, not a formal stratigraphic unit. This preserves scientific integrity while maintaining narrative utility.
