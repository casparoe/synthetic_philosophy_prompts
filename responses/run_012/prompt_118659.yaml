      *   *Failure:* Sometimes safety *increases* capability (the "free lunch" mentioned). But more specifically, consider *hardware*. If you tax chip usage (compute governance), there is no "unsafe chip" substitute easily available. The supply is inelastic. The incidence falls on everyone, not just the "safe" vs "unsafe" split.
