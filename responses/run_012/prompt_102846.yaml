answer: |-
  This is a formidable challenge. You have effectively reconstructed the "Paradox of Supererogation," pushing it toward a dilemma that threatens to dissolve the category entirely. Your argument rests on a specific assumption about the relationship between *deontic status* (what is obligatory, permissible, or forbidden) and *moral value* (what is good, better, or best).

  A defender of supererogation would not try to escape your dilemma by denying the horns, but by rejecting the premise that forces the choice between them. Specifically, they would argue that you are conflating the **logic of obligation** with the **economy of moral value**.

  Here is how a defender would answer your two main points: the collapse argument and the donation case.

  ### 1. Responding to the Collapse Argument
  Your dilemma assumes that if two agents are "equally within their rights" (both acting permissibly), it is arbitrary to judge one as having acted *better*. This assumes a binary moral landscape: you are either in the red (wrong) or in the black (not wrong). If you are in the black, you are all the way in the black.

  The defender argues that the "black" zone has depth.

  **The Distinction Between Duty and Value**
  The standard account relies on distinguishing *deontic* categories from *aretaic* (virtue/value) categories.
  *   **Deontic:** Is this act required? (Yes/No). If No, omitting it is not wrong.
  *   **Aretaic:** Is this act morally valuable? (Low/High).

  Your argument suggests that if omitting an act is not *wrong*, then performing it cannot be *better*. But consider an analogy outside morality: Academic grading. A student who scores 51% passes; a student who scores 100% passes. Both are "within their rights" to claim they passed the course. Neither failed. But it is not arbitrary to say the 100% student performed *better*. The threshold for "passing" (duty) is distinct from the scale of "excellence" (supererogation).

  **Addressing Horn 2 (The Obligation Claim)**
  You argue: *"If the rescuer is admirable... then the onlooker was under some obligation to act."*
  The defender rejects this inference. Admiration does not track obligation; it tracks **ideal**. If I am obligated to do $X$, I am blameworthy for not doing $X$. If I am merely invited to do $Y$ (where $Y$ is supererogatory), I am not blameworthy for omitting $Y$, but I are praiseworthy for doing it.

  The "confusion" you suspect in the received view is actually a feature, not a bug. It acknowledges that morality sets a **floor** (duty) below which you cannot fall without sanction, but also posits a **ceiling** (sainthood/heroism) which you are encouraged to reach but not punished for missing. To say the onlooker had an "obligation" they weren't blamed for neglecting is to misunderstand the function of blame. Blame is the sanction for violating the floor; it is not the appropriate response for failing to reach the ceiling.

  **Demand vs. Requirement**
  You ask if the notion survives separating "what we are prepared to demand" from "what they are actually required to do."
  The defender says: **Yes, that is precisely where it survives.**
  *   **Requirement:** What is objectively morally best or mandated by principle.
  *   **Demand:** What can reasonably be expected of human agents given psychological and social limitations.

  If we define "required" strictly as "what morality dictates is best," supererogation vanishes (this is the consequentialist view). But if we define "required" as "what is necessary to maintain the moral community without imposing unreasonable burdens," supererogation emerges. The category exists to protect agents from the **overdemandingness objection**. If every good act were required, morality would become too burdensome to sustain. By categorizing heroic acts as supererogatory, we acknowledge they are *morally superior* without making them *mandatory*, thus preserving the agent's liberty to pursue their own projects.

  ### 2. Responding to the Donation Case
  Your second case cuts to the heart of the definition: *Is supererogation a property of the act or the agent?*

  > *Two people make the same large donation, but for one the sum is trivial and for the other it means genuine sacrifice. If the act performed is identical, is only the second donation supererogatory?*

  The standard view (championed by philosophers like David Heyd and J.O. Urmson) is that supererogation is essentially tied to **sacrifice**.

  An act is supererogatory if:
  1.  It is morally good.
  2.  It is not obligatory.
  3.  It involves a significant cost or risk to the agent.

  Therefore, in your donation case, **only the second donation is supererogatory.**
  *   **Donor A (Trivial Cost):** This act is merely **beneficent**. It is good, permissible, and perhaps virtuous, but it does not cross the threshold of "beyond the call of duty" because the "duty" (to help when it costs you nothing) is arguably already close to obligatory. If helping costs you nothing, many philosophers argue it slides toward duty.
  *   **Donor B (Significant Sacrifice):** This act is **supererogatory**. The moral value is heightened *because* of the cost.

  If we defined supererogation solely by the *outcome* (the amount donated), we would ignore the agent's moral experience. Morality is not just about world-states; it is about the relationship between the agent and the act. The "heroic" quality of supererogation comes from the overcoming of self-interest. If there is no self-interest to overcome (because the donation is trivial), there is no heroism, and thus no supererogation in the strict sense.

  ### Summary of the Defense
  To accept your critique is to accept a maximizing consequentialist framework where "ought" implies "best." If you believe morality demands the *best* outcome always, then supererogation is indeed incoherent.

  However, if you view morality as a system of **constraints** (duties) within which agents pursue **ideals** (values), the category holds firm.
  1.  **Against the Dilemma:** One can be "within one's rights" (permissible) while still occupying a lower rung on the ladder of moral value. The distinction is not arbitrary; it is the distinction between the *mandatory minimum* and the *optional excellence*.
  2.  **Against the Donation Case:** Supererogation is agent-relative. It depends on the cost to the specific agent. The act of giving is the same, but the *moral achievement* is different.

  The "puzzle" remains, but it is not a sign of confusion. It is the necessary friction point between what is good for the world and what can be demanded of the individual. Supererogation is the philosophical tool we use to keep those two things from tearing each other apart.
