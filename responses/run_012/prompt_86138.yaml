answer: |-
  **JOINT STATEMENT ON THE LIMITS OF THE CRIMINAL LAW**

  **Preamble**
  We, the undersigned, have engaged in a two-year adversarial collaboration regarding the proper limits of the criminal law. One of us argues from a liberal perspective (the Liberal), prioritising individual liberty and requiring specific harm for state coercion. The other argues from a legal moralist perspective (the Moralist), prioritising social cohesion and the enforcement of shared moral standards. We have sought to isolate our points of agreement from our points of fundamental divergence. This document records the result. We have not sought to paper over cracks; where we could not agree, we have recorded the disagreement with precision.

  ### 1. Agreed Claims

  We jointly affirm the following propositions. Each is intended to have substantive content and to exclude specific alternatives.

  1.  **On the Aims of Criminal Law:** We agree that the criminal law is not a tool for perfecting human virtue in private. It is a coercive instrument of last resort, to be used only when less intrusive measures (social pressure, civil regulation, education) are demonstrably inadequate. We reject the use of criminal law solely to punish private thoughts or unacted-upon desires.
  2.  **On Necessity of Wrongfulness:** We agree that, for the core criminal law (excluding purely regulatory offences like driving on the left), moral wrongfulness is a *necessary* condition for criminalisation. The state should not criminalise conduct that is morally good or morally neutral. If an act is widely recognised as a moral duty, it cannot be a crime.
  3.  **On Necessity of Harm:** We agree that the prevention of harm is a necessary condition for criminalisation. Neither side supports the criminalisation of conduct that is morally condemned but produces *no* negative consequence of any kind, whether to individuals or to the structure of society. The dispute lies in defining what constitutes a relevant harm (see Section 2).
  4.  **On the Sufficiency of Morality:** We agree that this is the primary battleground. We formally record that the Liberal denies that shared moral disapproval is *sufficient* for criminalisation. The Moralist asserts that, subject to the constraints in Claim 1, shared moral disapproval *can* be sufficient, provided the morality is genuinely shared and deeply held.
  5.  **On Offence:** We agree that serious offence to others can be a ground for restriction, distinct from physical or financial harm. However, we agree that mere dislike or distaste is insufficient. The offence must be of a kind that a reasonable person could not be expected to avoid in the ordinary course of life.
  6.  **On the Empirical/Conceptual Split:** We agree that the dispute contains both conceptual questions (what is 'society'? what is 'harm'?) and empirical questions (does moral change cause social collapse?). We agree that conceptual clarity must precede empirical investigation.
  7.  **On the Historical Record:** We agree that the historical and comparative record does not show a simple correlation between the liberalisation of private moral laws and the immediate collapse of political order. Societies have altered their moral codes without dissolving into anarchy. However, we also agree that this does not prove that *no* moral changes could ever threaten cohesion; it only proves that specific past changes did not.
  8.  **On Concrete Cases:**
      *   **Case A (Private/Condemned/Harmless):** We agree to consider the case of consensual sexual relations between adult siblings, conducted in private, using contraception, with no possibility of offspring and no psychological coercion. Shared morality condemns this; direct harm to third parties is absent.
      *   **Case B (Harmless/Liberal Hesitation):** We agree to consider the case of a competent adult voluntarily signing a contract to become the permanent slave of another, surrendering all future rights to withdraw consent. This harms no third party, yet the Liberal hesitates to permit it, acknowledging a limit to liberty where liberty itself is destroyed.
      *   **Case C (The Openness Variant):** We agree to consider Case A conducted openly in a public space. We agree that the state may restrict this, not necessarily because of the incest, but because of the unavoidable offence caused to unwilling observers.

  ### 2. Residual Disagreements

  Where we could not reach agreement, we state our positions separately. We have noted where a disagreement appears to be merely verbal.

  1.  **The Definition of Harm (Substantive):**
      *   *The Liberal:* Harm must be tangible, set-back to interests, or a violation of rights assignable to specific individuals or the public order. 'Damage to social fabric' is a metaphor, not a harm, unless it can be cashed out into specific increases in violence, insecurity, or rights violations.
      *   *The Moralist:* Harm includes the disintegration of the shared ideas that constitute society. A society is a community of ideas; if those ideas are eroded, the society ceases to exist. This is a tangible harm to all members, akin to the dissolution of a partnership.
      *   *Note:* This is partly verbal (what counts as 'tangible'?) but largely substantive. If the Moralist is correct, 'harm' is much broader than the Liberal allows.

  2.  **The Status of Shared Morality (Truth vs. Feeling):**
      *   *The Liberal:* For the law to intervene, the morality being enforced must be defensible by reason. The mere fact that a majority feels disgust is irrelevant. If the morality is false, enforcing it is an error.
      *   *The Moralist:* The law protects the *shared feeling* itself, not the objective truth of the moral proposition. It does not matter if the morality is philosophically 'true'; it matters that it is the glue holding the specific society together. To ask if it is 'true' is to ask the wrong question.
      *   *Note:* This is a bedrock philosophical disagreement. The Moralist is not doing moral philosophy; they are doing political sociology. The Liberal insists political sociology cannot override moral philosophy.

  3.  **The Burden of Proof:**
      *   *The Liberal:* The burden lies on the state to demonstrate why liberty should be restricted. In cases of doubt (such as Case A), liberty prevails.
      *   *The Moralist:* The burden lies on the reformer to demonstrate that changing the law will not damage social cohesion. In cases of doubt, stability and established custom prevail.

  4.  **On Sufficiency (Revisited):**
      *   *The Liberal:* Moral wrongfulness is never sufficient on its own. It must be accompanied by independent harm (as defined by the Liberal).
      *   *The Moralist:* Moral wrongfulness, if it represents a deep, shared, and intolerable violation of the community's code, is sufficient, because the violation *is* the harm to the community.

  ### 3. Cruxes

  We identify three sub-questions (cruxes) where settling the matter would move at least one side. For each, we specify the evidence or argument that would bear on it, and record our advance predictions.

  **Crux 1: The Empirical Link between Moral Change and Social Collapse**
  *   **The Question:** Is there a measurable threshold of moral divergence beyond which a society becomes unable to function politically or economically?
  *   **Agreed Evidence:** Comparative sociological data from pluralistic societies with divergent moral codes (e.g., modern multicultural states) versus homogenous states, measuring social trust, compliance with law, and willingness to sacrifice for the collective.
  *   **Predictions:**
      *   *The Liberal:* Data will show no correlation between moral pluralism and social failure. High-trust societies can be morally diverse.
      *   *The Moralist:* Data will show that while surface diversity is tolerable, divergence on *fundamental* questions (life, death, family) correlates with lower social trust and higher enforcement costs.

  **Crux 2: The Distinction between Disgust and Harm**
  *   **The Question:** Can 'deep offence' or 'disgust' be separated from 'harm' in a way that is legally actionable?
  *   **Agreed Evidence:** Psychological and legal analysis of cases where public disgust was high but no tangible harm occurred (e.g., flag burning, corpse desecration). We would examine whether the distress reported by citizens is transient or causes lasting psychological injury.
  *   **Predictions:**
      *   *The Liberal:* Distress is transient. It does not amount to a rights violation. The law should not protect feelings.
      *   *The Moralist:* The distress is a symptom of the bond breaking. If the law ignores it, the bond snaps. The feeling *is* the evidence of the harm.

  **Crux 3: The Paternalism Boundary (Case B)**
  *   **The Question:** If the Liberal hesitates on voluntary slavery (Case B), is this because of harm to the individual (paternalism) or harm to the concept of citizenship (moralism)?
  *   **Agreed Argument:** A philosophical analysis of why voluntary slavery is rejected. If it is rejected because it destroys the agent's capacity for morality, does that imply the state has an interest in the moral capacity of its citizens?
  *   **Predictions:**
      *   *The Liberal:* It is a unique exception based on the irreversibility of the act. It does not open the door to general moral enforcement.
      *   *The Moralist:* It proves the Liberal is secretly a Moralist. You admit the state can stop a man from degrading his own moral status. If so, why not stop him from degrading the community's moral status?

  ### 4. Table of Disagreements

  | Issue | The Liberal Position | The Moralist Position | Status |
  | :--- | :--- | :--- | :--- |
  | **Grounds for Coercion** | Harm to others (and serious offence). | Harm to others + Protection of Shared Morality. | **Bedrock** |
  | **Definition of Harm** | Set-back to interests/rights of individuals. | Includes disintegration of social bonds. | **Substantive** |
  | **Role of Morality** | Constraint on law (do not punish good). | Ground for law (punish wrongs). | **Agreed (Necessity)** |
  | **Sufficiency of Morality** | Never sufficient alone. | Sufficient if deeply shared. | **Bedrock** |
  | **Truth vs. Consensus** | Morality must be rationally defensible. | Morality must be genuinely felt/shared. | **Bedrock** |
  | **Burden of Proof** | On the state to restrict liberty. | On the reformer to prove safety. | **Procedural** |
  | **Case A (Private Incest)** | Should not be criminal (no victim). | May be criminal (violation of order). | **Application** |
  | **Case B (Slavery)** | Banned (liberty-destroying). | Banned (moral degradation). | **Verbal/Overlap** |
  | **Case C (Public Act)** | Restricted (Offence Principle). | Restricted (Moral + Offence). | **Agreed Outcome** |

  **Signed,**

  _________________________ (The Liberal)

  _________________________ (The Moralist)

  **Date:** 24 May 2024
