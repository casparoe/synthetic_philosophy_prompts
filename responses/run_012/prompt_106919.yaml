prompt: |-
  Hey, I need a hand with something for work and I'd rather get a real methodologist than wing it.

  Quick context: I'm a producer on a long-running history documentary series (cable, not prestige streaming, so we're doing 12-14 segments a season). Every season we do a batch of episodes built around famous legends -- the Trojan War, King Arthur, the Exodus, that kind of thing -- and the whole fight internally is always the same: how do we label this stuff on screen and in the narration. Some of our writers want to say the events "really happened" because there's a city at Hisarlik or because the Merneptah reference exists, some want to hedge everything into mush, and our standards person keeps bouncing scripts back. Right now it's pure vibes and whoever argues loudest in the room wins. We're also getting complaints from both directions -- historians saying we're laundering myth as fact, and viewers saying we're being condescending by calling everything a legend.

  So I want you to act like a philosopher of history / historiographer who's also had to work with people who have no theory background. Take your time with this, and please actually think it through step by step rather than giving me the usual "it depends, historians disagree" thing.

  Start with a short brainstorming section where you lay out what you think the real question even is when someone asks "did this happen" about a legendary narrative -- I suspect it's several different questions wearing one coat, and I want you to separate them (the existence of a person vs. an event vs. the story as told vs. the tradition's age vs. its social function, etc.).

  Then give me an actual reusable decision procedure my writers and fact-checkers can run on a segment before it goes to the standards desk. Requirements:

  - The questions in the order they get asked, and for each one what counts as a sufficient answer to move on.
  - Where the procedure can stop with a hard no, and where it hands the decision to a human because it's turned into a values call (how much do we care about being wrong in each direction, what our audience will hear, etc.). Mark those handoff points clearly instead of hiding them.
  - It has to be runnable in maybe twenty minutes by a writer who has never read a word of philosophy of history. So the distinctions that matter have to survive being dumbed down, and I want you to say which distinctions you dropped on purpose and what that costs us.
  - I'd like the output of the procedure to be one of a small fixed set of labels plus a one-line presentation note, so the writers can't invent new categories.

  Things I want the procedure to actually grapple with, because these are where our arguments always go in circles: the difference between a tradition being old and a tradition being accurate; why "there's a kernel of truth in every legend" feels obvious but might be a trap; the argument from silence and when it's legitimate; what independent attestation really requires; anachronisms; and the fact that archaeology can confirm a destruction layer without confirming who did it or why (I think there's a word for many different causes producing the same evidence, please use it if it fits).

  Then run the procedure all the way through on three cases: the Trojan War, King Arthur, and the Exodus. For at least one of them I want the procedure to spit out an answer that will make me unhappy -- don't soften it to keep me comfortable, and tell me straight why I should live with it.

  Last, a section on what this procedure cannot do and the specific ways it will misfire in our production context. And please don't cite sources or give me a reading list, that's useless to me here -- just the reasoning.

  Write it all in American English.
