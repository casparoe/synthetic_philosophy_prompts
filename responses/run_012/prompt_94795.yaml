answer: |-
  Here is the reverse-engineering of your friend's decision machinery, broken down by theory, prediction, and the critical tests that separate them.

  ### 1. The Candidate Rules & Track Record

  Here is how the four major decision frameworks stack up against her existing verdicts.

  | Verdict | **Causal (CDT)** | **Evidential (EDT)** | **Superrationality** | **Functional (FDT/TDT)** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Mirror PD** (Identical Algorithm) | **Defect** (No causal leverage) | **Cooperate** (Action evidences clone's action) | **Cooperate** (Same reasoning = same output) | **Cooperate** (Subjunctive dependence) |
  | **Stranger PD** (No info) | Defect | Defect | Defect | Defect |
  | **Newcomb** (Trusted Predictor) | **Two-Box** (Money is already there) | One-Box (Choice evidences prediction) | One-Box | One-Box |
  | **Hitchhiker** (Pay after rescue) | **Don't Pay** (No causal effect on rescue) | *Wobbly* (Usually Don't Pay ex-post) | Pay | **Pay** (Policy determines prediction) |
  | **Randomizer** (Coin Flip) | Defect | Defect | Defect | Defect |
  | **Guilt Opinion** | Compatible | Compatible | Compatible | **Strong Fit** (Rationality is structural) |

  **Eliminations:**
  *   **Causal Decision Theory (CDT):** Dead on arrival. She cooperates in the Mirror PD and pays in Hitchhiker. CDT defects and free-rides in both.
  *   **Pure Evidential Decision Theory (EDT):** A strong contender, but it struggles with **Hitchhiker**. Once you are in town, the rescue is a past fact. Paying provides no *new* evidence to the driver (who has already left). Standard EDT says "Don't Pay" at the moment of payment unless you invoke precommitment. Your friend pays *in the moment*.
  *   **Superrationality:** Fits well, but is often vague on *asymmetry*. It relies on the intuition that "same reasoning" implies "same action," even if contexts differ slightly.

  ### 2. The Target Case Prediction

  **The Scenario:** One-shot PD vs. Identical Algorithm, but the clone has **different payoffs** and **extra information** you lack. You know this asymmetry exists.

  *   **CDT Prediction:** **Defect.** (Always defects in one-shot PD).
  *   **EDT Prediction:** **Defect.** Correlation is empirical. If the inputs (payoffs/info) differ, the statistical correlation between your action and the clone's action breaks down. You cannot infer their move from yours.
  *   **Superrationality Prediction:** **Cooperate (Likely).** Hofstadter's original conception leans heavily on the identity of the *reasoners*. If you are both "superrational," you reach the same conclusion regardless of minor contextual noise, because the "right" move is objective. However, strict adherents might defect if the payoff asymmetry changes the *logic* of the situation.
  *   **FDT/TDT Prediction:** **Defect.** FDT relies on **subjunctive dependence**. You cooperate with a clone because your decision *is* their decision (logically). But if the input variables to the function differ (different payoffs, different facts), the function outputs may diverge. Since you cannot predict the extra fact, you cannot assume logical correlation. You have no control over their output.

  ### 3. The Bet: Functional Decision Theory (FDT)

  I would bet heavily that she is running **FDT (or Timeless Decision Theory)**, and that her verdict on the Target Case will be **Defect**.

  **Why?**
  1.  **The Hitchhiker Smoking Gun:** The Hitchhiker problem is the classic "CDT killer," but it also distinguishes FDT from EDT. EDT agents often struggle to justify paying *after* the rescue without a binding precommitment device. FDT agents pay because they view their current decision as the logical output of the same function that the driver simulated. Your friend's willingness to pay "once she's in town" implies she treats her decision as controlling the past prediction logically, not just evidentially.
  2.  **The "Guilt" Comment:** By calling guilt-based cooperation "irrational," she is signaling that she views rationality as a property of the **decision algorithm**, not the **utility function**. A CDT player can cooperate if they value "not feeling guilty" more than money. Your friend rejects this; she thinks the *method* of deciding is what matters. This is the core thesis of FDT.
  3.  **The Randomizer Constraint:** She defects against a coin flip. This shows she isn't a "magical thinker" who cooperates with anything. She requires a specific kind of link (logical correlation), which FDT specifies precisely, whereas Superrationality is sometimes looser.

  ### 4. Potential Inconsistencies

  There is one tension in her profile you should flag:

  **The Hitchhiker vs. Newcomb Consistency:**
  In Newcomb, she one-boxes (standard for Non-CDT). In Hitchhiker, she pays (standard for FDT). However, if she justifies the Hitchhiker payment by saying "I promised," she risks sliding back into CDT with a "keeping promises" utility value.
  *   *The Trap:* If she says she pays *because* she promised, a CDT theorist says "That's just a preference for honesty."
  *   *The Fix:* She must justify it by saying "If I wouldn't pay, the driver wouldn't have picked me up." If she grounds it in the **counterfactual dependency** of the rescue on her payment decision, she is consistent. If she grounds it in "honor," she is inconsistent with her "guilt is irrational" claim.

  ### 5. The Cleanest Further Case

  If she **Defects** in the Target Case (as predicted), she aligns with FDT, EDT, and CDT on *this specific problem*. To distinguish her FDT machinery from EDT (her main rival), use **The Counterfactual Mugging**.

  **The Case:**
  Omega appears. He says: "I flipped a coin. If it came up Tails, I would have asked you for $100. If you gave it, I would have given $10,000 to a counterfactual version of you in the world where the coin came up Heads. The coin actually came up Heads. I am not giving you anything regardless. But I want to know: Would you have given me the $100 if I had asked?"

  *   **EDT Prediction:** **No.** Paying gives you no evidence that benefits *you* (the coin is already Heads). It doesn't change the past.
  *   **FDT Prediction:** **Yes.** You want your decision function to output "Pay" in this scenario, because that ensures the counterfactual version of you gets $10,000. You are optimizing the *policy*, not the specific instance.
  *   **Superrationality:** Ambiguous/No.

  **Why this splits them:**
  Your friend already passed Newcomb (correlation with prediction) and Hitchhiker (correlation with past action). Counterfactual Mugging tests correlation with **counterfactual worlds**. If she pays (or says she would), she is firmly FDT. If she refuses, she is likely EDT masquerading as FDT.
