answer: |-
  **Scratch Notes: Decidability & Epistemic Limits**

  The core tension here is between *structural causality* (Aunt's institutions) and *binding constraints* (Cousin's geography/health). The Aunt's "natural experiment" argument is intellectually seductive but operationally fragile. The border correlates with ecology (tsetse/rainfall) and historical colonial investment intensity. It is not random. Even if it were, identifying *that* institutions caused divergence over 60 years doesn't tell us if *buying* institutions works over 5 years. Institutions are endogenous; they emerge from demand, not just supply.

  The 2027 decentralization bill is the killer variable for Option 1. Funding a land registry just before a potential legislative overhaul is high-risk capital allocation. You could build a system that becomes illegal or obsolete in 36 months.

  Option 2 (Geo/Health) has higher certainty of marginal impact. Malaria reduction and irrigation yield immediate returns on human capital. Option 3 (Trust) is low-cost insurance against coordination failure.

  *Epistemic Limit:* In five years, we cannot measure "development." We can measure inputs (nets, roads) and intermediate outcomes (infection rates, yields). We cannot prove we changed the region's trajectory, only that we alleviated specific bottlenecks. We must avoid the "hubris of measurement."

  ***

  **MEMORANDUM**

  **TO:** Board of Directors, Family Foundation
  **FROM:** Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Five-Year Funding Cycle (2024–2029)

  **Executive Summary**

  After reviewing the three proposals and consulting with our program officer, I recommend we adopt a **Modified Option 2 (Geography and Health)** as our primary strategy, supplemented by **Option 3 (Trust and Culture)**. We will pause **Option 1 (Governance)** for the first 30 months.

  **Budget Allocation ($3.5m Annual):**
  *   **$2.9m/year:** Expanded Health & Infrastructure (Option 2 scaled).
  *   **$0.6m/year:** Savings Groups & Media (Option 3 scaled).
  *   **$0.0m/year:** Land Registry (Option 1 paused).

  **Rationale: Binding Constraints vs. Institutional Risk**

  Our mission is impact, not theory. While all three options identify real barriers to development, we must prioritize interventions where our capital has the highest certainty of return within a five-year window.

  Option 2 addresses immediate binding constraints. In this region, malaria and lack of water access are not just symptoms of poverty; they are active drivers of it. A farmer cannot invest in land improvement if she is incapacitated by fever every rainy season. A merchant cannot arbitrage price differences if the road is impassable. These interventions have a direct causal chain to productivity that does not rely on state cooperation.

  Option 3 is included as a low-cost hedge. Social capital is a public good. Savings groups provide immediate liquidity smoothing, and while radio dramas are hard to measure, the cost is low enough to justify the potential upside in community cohesion.

  **The Case for Option 1 (and Why We Are Pausing It)**

  I want to address the argument for Option 1 directly, because my Aunt is right about the diagnosis, even if the prescription is currently too risky.

  The strongest case for Governance is that without secure property rights, any gains from health or infrastructure are transient. If a farmer improves her land but cannot prove ownership, she cannot borrow against it, and she risks expropriation. The colonial border split provides compelling historical evidence that legal frameworks determine long-term economic trajectories. If we could successfully digitize the registry and empower courts, we would be fixing the engine rather than just pushing the car.

  However, two factors make this untenable for *this* cycle:
  1.  **The 2027 Decentralization Bill:** Our program officer has flagged significant legislative risk. If parliament shifts control of land records to local municipalities in 2027, a national-level registry system we fund today could be rendered obsolete or incompatible. We cannot bet $1.2m/year on a moving target.
  2.  **The Timeline of Institutional Change:** Institutions are not software; you cannot install them. They require local buy-in and enforcement capacity. Five years is insufficient to verify success. If we fund courts that remain corrupt or unused, we have wasted $6m with nothing to show.

  We will revisit Option 1 in Year 3, contingent on the passage and content of the decentralization bill.

  **Measurement and Triggers**

  We will not measure "poverty reduction" directly; the noise is too high. We will measure intermediate outcomes where we have causal leverage.

  *   **Health:** Reduction in confirmed malaria cases in target villages (target: 40% reduction); bed net usage rates.
  *   **Infrastructure:** Reduction in travel time to market town (target: 50%); irrigation scheme uptime during dry season.
  *   **Culture:** Number of active savings groups; loan repayment rates within groups.

  **Change-of-Course Triggers:**
  1.  **Legislative Trigger:** If the 2027 decentralization bill passes *before* Month 30, we will immediately reallocate 50% of the Infrastructure budget to a rapid-assessment Governance pilot to align with the new law.
  2.  **Performance Trigger:** If irrigation uptime falls below 60% due to lack of local maintenance capacity, we will shift funds from infrastructure rehab to technical training for local water committees.

  **Epistemic Limits: What We Can Claim**

  We must be honest with ourselves about what this money can buy. We are not purchasing "development" in the macroeconomic sense. We cannot claim that our grants caused regional GDP growth or institutional reform. Social science does not allow us to isolate our contribution from global commodity prices, climate shifts, or national politics over a five-year span.

  We are entitled to claim that we *relieved specific constraints*. We can say, "We reduced the malaria burden," and "We improved market access." We cannot say, "We made this region rich."

  Furthermore, regarding the border "natural experiment": We cannot use our funding to prove my Aunt's theory. The ecological confounders (rainfall, tsetse fly) are too significant. Attempting to design a grant solely to test a historical hypothesis would compromise the utility of the aid for the recipients. Our primary fiduciary duty is to the people in the region, not to the literature on colonial legacies.

  **Conclusion**

  This strategy prioritizes high-certainty human capital improvements (Health/Infra) while hedging against institutional volatility. It respects the Aunt's insight by acknowledging that institutions matter, but recognizes that timing and risk management matter more for a foundation of our size. We will build the health and economic surplus now, so that when the institutional window opens post-2027, the population is healthy and capitalized enough to demand and use those rights.

  I request board approval to proceed with drafting RFPs for the Health and Infrastructure components based on these allocations.
