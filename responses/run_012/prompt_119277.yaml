answer: |-
  First, regarding your hunch about topics **(a)** and **(b)**: You are half-right. They are not the *same* question logically—one is ontological (what *is* the thesis about?) and the other is epistemological (what *evidence* supports it?). However, for **this specific guest**, they will collapse into the same answer. Because she views the thesis as a claim about *notations*, the "convergence of formalisms" (b) is just proof that the notation is stable, and the "physical device" version (a) is a category error. If you ask her about physical limits, she will tell you that's not what the thesis is. If you ask her about the evidence, she will tell you the evidence only supports the notational claim. So, while you should keep both topics to show you've done your homework, expect her to funnel (a) into (b).

  Here are ten questions designed to press her deflationary view without letting her retreat into "that's just a premise."

  ### Topic (a): The Scope of the Thesis (Notation vs. Physics)

  **1.** You argue the Church–Turing Thesis is about the faithfulness of symbolic notations, not the limits of physical machines. But if a physical device could be built that computed a non-Turing-computable function, wouldn't that force us to say our "faithful notation" was actually incomplete?
  *   **Follow-up:** So is the thesis protected from physical refutation by definition, or does physics constrain what counts as a "faithful" notation?
  *   **⚠️ Flag:** She will likely say physics doesn't constrain the *notation*. Press on whether a notation that fails to describe physical reality is still "faithful" to *procedure*.

  **2.** If the thesis is really just about whether a formalism captures our informal idea of a "step-by-step procedure," aren't we just circularly defining "procedure" as "what a Turing machine does"?
  *   **Follow-up:** Then what work is the thesis doing, if it's not telling us something about the world we didn't already put into the definitions?
  *   **⚠️ Flag:** She will say it's not circular, it's *explication*. Ask her what distinguishes a good explication from a stipulation.

  ### Topic (b): The Convergence of Formalisms

  **3.** You dismiss the "no counterexample in a century" argument as worthless evidence. But isn't the convergence of lambda calculus, recursive functions, and Turing machines a mathematical discovery, not just a tuning of definitions?
  *   **Follow-up:** If it's a discovery, doesn't that imply there was a pre-existing target they all hit, rather than just a shared intuition we all codified?
  *   **⚠️ Flag:** She will claim the "target" was the informal intuition, not a physical law. Ask if that intuition is stable across cultures or just 20th-century logicians.

  **4.** Critics say the formalisms converge because later definitions were intentionally designed to match Turing's. If we hadn't known about Turing machines, would Post systems still look equivalent?
  *   **Follow-up:** If the answer is "we don't know," how confident can we be that the convergence isn't just an artifact of historical path-dependence?
  *   **⚠️ Flag:** She might say the math proves equivalence regardless of history. Remind her that *choosing* which math to formalize is historical.

  ### Topic (c): Hypercomputation and Idealization

  **5.** Take Malament-Hogarth spacetimes where an observer can witness an infinite computation in finite time. If physics allows this, does it refute the physical version of the thesis, or does it just mean "mechanical procedure" doesn't apply there?
  *   **Follow-up:** If "mechanical procedure" doesn't apply there, isn't the thesis just a claim about spacetimes like ours, which makes it empirical after all?
  *   **⚠️ Flag:** **Major Trap.** She will say the thesis is about the *concept* of procedure, not spacetime. Press on why we care about the concept if it doesn't map to our spacetime.

  **6.** Hypercomputation often relies on "oracles" or infinitely precise real numbers. Is your rejection of these as counterexamples based on their physical impossibility, or on them violating the finiteness required by your "notation" story?
  *   **Follow-up:** If it's the latter, are you ruling out counterexamples by fiat rather than by argument?
  *   **⚠️ Flag:** She will say finiteness is part of the *informal idea* being captured. Ask who gets to decide what the informal idea requires.

  ### Topic (d): Efficiency and Quantum Computing

  **7.** The "Extended Church–Turing Thesis" claims that anything efficiently computable is efficiently computable by a probabilistic Turing machine. Is this thesis deflationary like the original, or is it an empirical claim threatened by quantum computing?
  *   **Follow-up:** If the Efficiency Thesis is empirical but the Original Thesis is not, where exactly is the boundary between conceptual truth and physical law?
  *   **⚠️ Flag:** She will try to keep them separate. Push her on why "efficiency" introduces physics when "computability" supposedly doesn't.

  **8.** If quantum computers can solve problems in BQP that classical machines can't do efficiently, does that change the *notation* of what is computable, or just the *cost* of the notation?
  *   **Follow-up:** If it's just cost, why do we treat the complexity version as a fundamentally different kind of claim than the computability version?
  *   **⚠️ Flag:** She may say complexity is about resources (physics) and computability is about functions (logic). Ask if resources aren't part of the "procedure."

  ### The "Brain" Question & Wrap-Up

  **9.** You visibly tense when people infer from the thesis that brains are computers. If the thesis is only about notations and symbolic systems, why does that inference bother you if it's clearly a category error in your view?
  *   **Follow-up:** Is the danger that people will mistake a claim about math for a claim about cognition, or that the claim about math is being overstated?
  *   **⚠️ Flag:** This is personal to her research. Be gentle but firm. She might say it leads to bad cognitive science.

  **10.** If we accept your deflationary view, what do we lose? Does stripping the thesis of its empirical content make it less useful for computer science or physics, or does it just protect it from being wrong?
  *   **Follow-up:** Is a thesis that cannot be falsified by physics still a thesis, or is it just a convention for talking?
  *   **⚠️ Flag:** She will say it clarifies confusion. Ask if clarity is worth the loss of predictive power.

  ### Advice for the Interview
  *   **The "Premise" Trap:** In questions 1, 5, and 6, she will almost certainly say, "You are assuming the thesis is about physics, but my premise is that it is about notations." When she does this, acknowledge it ("I understand that's your premise...") but then ask **why** that premise is the correct one to adopt if it disconnects the thesis from the actual machines we build.
  *   **Pacing:** She is likely to give long, nuanced answers. Your follow-ups need to be ready to cut through the nuance. If she starts defining "effective calculability," interrupt gently: "I know how you define it, but why *that* definition?"
  *   **Tone:** You are a student, but you are the host. You don't need to debunk her; you just need to make sure the audience understands the *consequences* of her view. If the thesis is just about notations, why did Turing matter? If it's not about brains, what is?

  Good luck with *Unfinished Business*. It sounds like a great project.
