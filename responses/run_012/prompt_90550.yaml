answer: |-
  **JOINT STATEMENT ON NORMATIVE UNCERTAINTY**

  **Drafted for the Moral Uncertainty Reading Group**
  **Date:** 24 October 2023
  **Signatories:** [The Formalist], [The Sceptic]
  **Facilitator:** [The Moderate]

  **PREAMBLE**

  This document records the current state of play in our dispute regarding the rational management of moral uncertainty. Its purpose is not to resolve the dispute, but to isolate the precise points of divergence and eliminate the verbal confusions that have stalled progress. We agree that the following formulations are charitable to both positions. Where we disagree, we have specified the empirical or conceptual evidence that would alter our credences.

  **PART I: AGREED CLAIMS**

  1.  **The Phenomenon:** Moral uncertainty is distinct from factual uncertainty. It is possible for a fully informed agent to remain uncertain about which normative theory is true, without any remaining ignorance of non-normative facts.
  2.  **The Necessity of Action:** An agent cannot suspend action pending the resolution of moral uncertainty. A rational agent must have some disposition to choose between options even when torn between theories.
  3.  **The Insufficiency of 'My Favourite Theory':** It is not always rational to simply follow the theory to which one assigns the highest subjective probability. There are cases (e.g., low-probability/high-stakes moral risks) where intuitively correct action requires hedging against the less probable theory. Both sides accept that a satisfactory account must explain *when* hedging is required.
  4.  **The Intertheoretic Comparison (ITC) Problem:** Comparing the magnitude of value or choiceworthiness across different moral theories is not straightforward. Both sides accept that any account relying on such comparisons must explain how these comparisons are grounded, rather than assuming them away.
  5.  **The Role of Normalisation:** Any formal account requiring cardinal utility across theories requires a normalisation procedure. Both sides accept that arbitrary normalisation can manipulate verdicts. The dispute is not whether this *can* happen, but whether it can be *constrained*.
  6.  **Agreed Cases (Formalist Success):** In cases involving 'moral Pascal's wagers' (e.g., a tiny credence in a theory demanding extreme sacrifice to prevent infinite disvalue), the Formalist's machinery correctly identifies the intuition that the low-probability theory should dominate. The Sceptic agrees that 'practical wisdom' would also counsel extreme caution here, rendering the verdict identical.
  7.  **Agreed Cases (Sceptic Success):** In cases where theories differ only in abstract justification but agree on all practical rankings, the Formalist agrees that attempting to calculate expected choiceworthiness is unnecessary and potentially misleading. The Sceptic agrees that in such cases, the Formalist's machinery (if applied) would yield the same result as simply following the consensus ranking.
  8.  **Cheap Shots:** The Sceptic will no longer claim the Formalist is 'doing moral philosophy by spreadsheet' as a dismissal of the project's intent. The Formalist will no longer claim the Sceptic is 'irrational' for refusing to assign cardinal numbers; the Sceptic's position is that such numbers are unavailable, not that rationality is ignored.

  **PART II: THE THREE DERAILING CASES**

  We identify three specific scenarios that have repeatedly stalled discussion. We record how each machinery handles them and where the breakdown occurs.

  **Case 1: Recursive Uncertainty (Uncertainty about the Rule)**
  *Scenario:* The agent has credence in the Formalist's rule (MEC) and non-trivial credence in the Sceptic's view (that one should use practical wisdom/intuition directly).
  *   **Formalist Handling:** The Formalist machinery must be applied to the uncertainty about the machinery itself. If MEC is 60% probable and Scepticism 40%, the agent must maximise expected choiceworthiness. However, the Sceptic's 'theory' does not output choiceworthiness units; it outputs a directive ('use wisdom'). To process this, the Formalist must assign a 'choiceworthiness' value to 'using wisdom'.
  *   **Sceptic Handling:** The Sceptic contends this reveals a category error. You cannot use a formal rule to decide whether to use a formal rule without begging the question. If the Formalist assigns a value to 'using wisdom', they are merely codifying their intuition about when to use the rule, proving the rule is not doing the work.
  *   **Joint Assessment:** We agree that the Formalist cannot process the Sceptic's view as a standard input without translation. We disagree on whether this translation is a technical hurdle (Formalist) or a fatal *reductio* (Sceptic).

  **Case 2: Infinite or Lexical Value**
  *Scenario:* Theory A assigns finite value to outcomes. Theory B assigns infinite (or lexically prior) value to a specific constraint. The agent has 1% credence in Theory B.
  *   **Formalist Handling:** Standard expected choiceworthiness calculation yields that Theory B swamps Theory A regardless of the stakes for A. The Formalist acknowledges this verdict is often counter-intuitive (the 'fanaticism' problem) and accepts that the machinery requires modification (e.g., truncation, relative normalisation, or rejection of infinite values) to avoid absurdity.
  *   **Sceptic Handling:** The Sceptic contends that the need for such modification proves the numbers are not measuring a real property. If a 1% credence can dictate action against 99% of one's moral outlook, the 'measurement' is broken. The Sceptic's 'practical wisdom' would naturally discount the 1% view as too uncertain to act upon in the face of finite catastrophe.
  *   **Joint Assessment:** We agree that standard MEC fails here without ad hoc adjustment. We disagree on whether the adjustment is a legitimate refinement of the theory (Formalist) or an admission that the theory does not match rational practice (Sceptic).

  **Case 3: Identical Rankings, Disputed Scales**
  *Scenario:* Theory A and Theory B both rank Option 1 > Option 2. However, Theory A holds the gap is trivial; Theory B holds the gap is immense.
  *   **Formalist Handling:** The Formalist insists the magnitude of the gap matters for decision-making under uncertainty. If Theory B is 40% probable, the 'immense gap' should weigh heavier than the 'trivial gap' of Theory A, potentially altering risk profiles in complex choices involving third options.
  *   **Sceptic Handling:** The Sceptic contends that if the theories agree on the ranking of all available options, the 'magnitude of the gap' is metaphysically idle. Disputes over normalisation in this context are purely artefacts of the formalism. No real-world decision changes based on the 'size' of the gap if the order is fixed.
  *   **Joint Assessment:** This is the core technical dispute. The Formalist claims cardinal information is relevant even when ordinal information aligns (due to risk-weighting in multi-option scenarios). The Sceptic claims this is a solution in search of a problem, as such scenarios are rare or the cardinal difference is inaccessible.

  **PART III: DISAGREEMENTS TABLE**

  | # | Precise Statement of Disagreement | The Crux | Agreed Evidence / Test | Formalist Prediction | Sceptic Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Metaphysics of Choiceworthiness:**<br>Formalist: Intertheoretic comparisons of value magnitude are factually grounded (or rationally constrainable).<br>Sceptic: Such comparisons are either meaningless or entirely dependent on arbitrary stipulation. | Is there a fact of the matter about whether '1 util' in Theory A is 'more' or 'less' than '1 duty-fulfilment' in Theory B, independent of our decision procedures? | A thought experiment where two agents agree on all probabilities and theory definitions but disagree on the conversion rate, leading to different actions. Does one seem *mistaken* or merely *different*? | One agent is making a rational error. There is a correct conversion rate (or range). | Neither is mistaken. The conversion rate is a policy choice, not a truth-apt claim. |
  | **2** | **The Function of the Theory:**<br>Formalist: The decision rule is *constitutive* of rationality under uncertainty.<br>Sceptic: The decision rule is at best a *heuristic summary* of prior moral intuitions. | Does the machinery generate verdicts that can surprise a reflective agent, or does it only systematise verdicts the agent already held? | A case where the MEC verdict contradicts the agent's pre-theoretical intuition about what to do. | The intuition should be discarded in favour of the calculation. | The calculation should be discarded; the intuition reveals the machinery's limit. |
  | **3** | **The Source of Normativity:**<br>Formalist: Rationality requires structural coherence across theories (like coherence across time).<br>Sceptic: Rationality requires fidelity to the substantive moral truth as best understood. | Is the obligation to hedge derived from the structure of rational choice (decision theory) or from the substantive moral theories themselves (moral philosophy)? | If a substantive moral theory explicitly says "Do not hedge, follow me even if uncertain," does rationality override this? | Yes. Structural rationality binds the agent even against the content of the theories. | No. If the moral theory says 'do not hedge', following that instruction is the rational moral action. |

  **PART IV: VERBAL DISPUTES AND SLIDING CLAIMS**

  We acknowledge the following areas where language has been used imprecisely, leading to the sensation of talking past one another.

  **1. The Sceptic's 'Practical Wisdom'**
  *   **The Charge:** The Formalist charges that the Sceptic's appeal to 'practical wisdom', 'humility', and 'caution' is often a disguised formalism. When the Sceptic says 'be careful with irreversible stuff', they are implicitly assigning higher weight to negative outcomes in a way that resembles risk-weighted expected utility.
  *   **The Concession:** The Sceptic accepts that if 'practical wisdom' yields consistent verdicts, it could be *modelled* formally. However, the Sceptic maintains that the *source* of the verdict is not the model, but the moral perception. The model is ex-post rationalisation.
  *   **Resolution:** We will distinguish between *psychological process* (where the Sceptic claims intuition leads) and *rational reconstruction* (where the Formalist claims logic leads). We agree to stop accusing the Sceptic of having 'no rule' if they have consistent heuristics, and stop accusing the Formalist of 'ignoring intuition' if their rule captures it.

  **2. The Formalist's 'Technical Problem'**
  *   **The Charge:** The Sceptic charges that the Formalist sometimes slides between claiming ITC is a 'hard technical problem' (solvable in principle) and 'a matter of stipulation' (we just pick a normalisation). If it is stipulation, the Sceptic's charge of arbitrariness holds.
  *   **The Concession:** The Formalist accepts that without a metaphysical account of value magnitudes, normalisation involves stipulation. The claim is not that the stipulation is *discovered*, but that it is *constrained* by coherence requirements (e.g., avoiding fanaticism, respecting Pareto principles).
  *   **Resolution:** The Formalist will no longer imply the conversion rates are 'out there' to be found like physical constants. They are rational constraints on policy. The Sceptic will no longer treat 'stipulation' as synonymous with 'arbitrary', acknowledging that rational stipulations exist (e.g., in logic or probability axioms).

  **3. The Meaning of 'Rational'**
  *   **The Dispute:** The Formalist uses 'rational' to mean *structurally coherent* (like consistency in logic). The Sceptic uses 'rational' to mean *substantively correct* (likely to achieve the good).
  *   **Resolution:** We will henceforth distinguish **Structural Rationality** (coherence of attitudes) from **Substantive Rationality** (responding correctly to reasons). The Formalist argues Moral Uncertainty theory is a theory of Structural Rationality. The Sceptic argues that in the moral domain, Structural Rationality collapses into Substantive Rationality. This is a fundamental metaphysical disagreement, not a confusion, and we will treat it as such.

  **SIGNATURES**

  _________________________ (The Formalist)

  _________________________ (The Sceptic)

  _________________________ (The Moderate)
