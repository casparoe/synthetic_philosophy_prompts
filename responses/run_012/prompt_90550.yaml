prompt: |-
  I'm in a fortnightly reading group on moral uncertainty and we've hit a wall. Two of us have been having the same fight for about six sessions now and it's starting to feel less like disagreement and more like the two of us talking past each other. She's what I'd call a formalist: she thinks that once you grant that a sane, well-informed agent can be genuinely torn between two moral theories -- not torn about the facts, torn about which theory is right -- you need some machinery for deciding what to do in that state, and that the natural machinery is maximising expected choiceworthiness (or a refinement of it that builds in some caution about moral risk), with the awkwardness of comparing amounts of choiceworthiness across theories being a hard technical problem rather than a reductio of the whole project. He's the sceptic: he thinks the project is either empty or built on a fiction. His line is that without intertheoretic comparisons you end up with something that just tells you to follow whichever theory you find most probable, and that if you supply the comparisons by hand you can get any verdict you like out of the same case by fiddling with the normalisation, so the decision theory is never what's really doing the work. He thinks the honest response to not knowing which theory is right is a lot less formal -- get clearer about your own moral beliefs, be humble about your track record, be careful with the irreversible stuff, and let practical wisdom mop up. For what it's worth I'm somewhere between them, which is how I got nominated to write this up.

  I'd like you to take the role of a philosopher who works on normative uncertainty and is unusually good at forcing precision out of people who are gesturing at each other, and draft the joint statement the two of them could actually both put their names to. Start with a numbered list of claims both sides accept: about what moral uncertainty is and isn't, about what any adequate response to it would have to do, about which objections are live and which are cheap shots, and about the cases where they agree the formalist's machinery gets the right answer and the sceptic's misgivings don't bite. Then a disagreements table. For each remaining dispute, give the precise statement of the disagreement in wording that each side would accept as fair to its own view -- this matters more than anything else in the document, I want formulations that are neither vacuous nor quietly loaded toward one side -- then the crux underneath it, then the case, argument or piece of evidence both sides agree would bear on that crux, and then, recorded seperately, what each side predicts about it. If some part of the fight turns out to be merely verbal, say which part and why, and don't be diplomatic if you think one of them is really making two claims and sliding between them.

  Three things I'd like the document to confront head-on, because they're what keep derailing us. First, a case where one of the theories you're uncertain between is itself a theory of how to act under moral uncertainty, so whatever rule you adopt has to be applied to itself -- if the sceptic's view gets non-trivial credence, what does the formalist's rule say to do then? Second, a case where one candidate theory assigns infinite or lexically prior value to something, so that even a small credence in it swamps every other consideration and the expected-choiceworthiness verdict comes out absurd. Third, a case where the theories agree completely on how to rank the options but disagree about what the units on the scale mean, so that the only thing left to fight over is the normalisation. These three are our own inventions, so don't worry about whether they're realistic -- just say what each side's machinery does with them. Take your time and brainstorm the candidate cruxes before you start drafting; the whole value here is in the formulations. Don't pad it out with literature -- I know the literature, I want the document, and no reading lists or citations please, they're no use to me here. British English throughout, our department is pedantic about it.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A fortnightly reading group on moral uncertainty. Two members (Formalist vs. Sceptic) are stuck talking past each other. The user is a moderate tasked with drafting a joint statement.
      *   **Role:** A philosopher specializing in normative uncertainty, skilled at forcing precision and exposing verbal disputes or hidden cruxes.
      *   **Task:** Draft a joint statement both parties could sign.
      *   **Structure:**
          1.  Numbered list of agreed claims (nature of moral uncertainty, requirements for adequacy, live vs. cheap objections, agreed cases).
          2.  Disagreements Table (Precise statement, Crux, Agreed evidence/test, Separate predictions).
          3.  Address three specific "derailing" cases: Recursive uncertainty (uncertainty about uncertainty), Infinite/Lexical value swamping, and Scale/Normalisation disputes where rankings agree.
          4.  Identify verbal disputes/sliding claims.
          5.  **Constraint:** British English. No literature citations/reading lists. High precision, no padding.

  2.  **Deconstruct the Positions:**
      *   **The Formalist:** Believes moral uncertainty is real. Believes we need a decision-theoretic machinery (Maximising Expected Choiceworthiness - MEC). Acknowledges intertheoretic comparison (ITC) is hard but technical, not fatal. Wants a systematic rule.
      *   **The Sceptic:** Believes the project is empty/fiction. Without ITC, MEC collapses to "follow most probable theory." With ITC, it's manipulable via normalisation. Prefers "practical wisdom," humility, and caution over formal rules. Thinks the formalism doesn't do the work.
      *   **The User (Moderate):** Wants precision. Wants to stop the talking past each other.

  3.  **Brainstorming Agreed Claims (The Common Ground):**
      *   Moral uncertainty is distinct from factual uncertainty.
      *   Agents can be torn between theories (not just facts).
      *   We need *some* guidance on what to do (inaction is not an option).
      *   "Follow the most probable theory" is insufficient in some cases (e.g., high stakes/low probability vs. low stakes/high probability).
      *   Normalisation is a problem for everyone, not just Formalists (Sceptics use heuristics that implicitly normalise).
      *   There are cases where MEC works intuitively (e.g., Pascal's Wager style moral cases).
      *   There are cases where Sceptic's caution works intuitively (e.g., irreversible harm).

  4.  **Brainstorming the Disagreements (The Cruxes):**
      *   *Is the formalism action-guiding or just descriptive?* Formalist says action-guiding. Sceptic says it rationalises pre-existing intuitions.
      *   *Is ITC possible?* Formalist says yes (hard but possible). Sceptic says no (or arbitrary).
      *   *What is the status of the "rule"?* Formalist: Constitutive of rationality. Sceptic: At best a heuristic.

  5.  **Addressing the Three Derailing Cases:**
      *   **Case 1: Recursive Uncertainty (Uncertainty about Uncertainty).**
          *   *Scenario:* Credence in MEC vs. Credence in Scepticism (or a rival uncertainty theory).
          *   *Formalist:* Must apply MEC to the uncertainty about MEC. This leads to regress or fixed points.
          *   *Sceptic:* This shows the absurdity of the formalist project. You can't formalise the decision to use a formalism.
          *   *Resolution:* Acknowledge the regress. Formalist needs a "meta-rule." Sceptic says this proves the meta-rule is just intuition.
      *   **Case 2: Infinite/Lexical Value.**
          *   *Scenario:* Theory A says "Save the world" (finite). Theory B says "Prevent Blasphemy" (Infinite/Lexical). Tiny credence in B swamps A.
          *   *Formalist:* Acknowledges this is a problem for standard MEC. Needs truncation, lexical handling, or rejection of infinite values.
          *   *Sceptic:* This is a *reductio*. No sane agent should let 0.01% credence in a lexical theory dictate action.
          *   *Resolution:* Agree that standard MEC fails here without modification. Disagree on whether modification is possible (Formalist) or whether it admits the whole approach is broken (Sceptic).
      *   **Case 3: Same Rankings, Different Scales (Normalisation).**
          *   *Scenario:* Theory A and B agree Option 1 > Option 2. But A thinks the *gap* is huge, B thinks it's tiny.
          *   *Formalist:* The gap matters for risk-weighting. MEC needs cardinal utility.
          *   *Sceptic:* If they agree on ranking, the "gap" is metaphysical fluff. Fighting over normalisation here proves the numbers are fake.
          *   *Resolution:* This is the core ITC dispute.

  6.  **Drafting - Tone and Style:**
      *   British English (e.g., "normalisation," "behaviour," "programme").
      *   Precise, philosophical, slightly dry but sharp.
      *   No citations.
      *   Focus on "forcing precision."

  7.  **Drafting - Section by Section:**

      *   *Header:* Joint Statement on Normative Uncertainty.
      *   *Preamble:* Brief context.
      *   *Section 1: Agreed Claims.* Focus on the phenomenon existing, the need for guidance, and the limitations of simple probabilistic following. Acknowledge the ITC problem is real, not imagined.
      *   *Section 2: The Three Derailing Cases.* Tackle these specifically as requested.
          *   *Recursive:* Formalist admits need for a fixed point or dogmatism at the meta-level. Sceptic calls this arbitrary.
          *   *Infinite:* Formalist admits standard MEC breaks. Sceptic calls this fatal.
          *   *Normalisation:* Formalist insists cardinality matters. Sceptic insists it's unmeasurable.
      *   *Section 3: Disagreements Table.*
          *   *Dispute 1:* The Metaphysics of Choiceworthiness. (Real magnitude vs. Ordinal ranking).
          *   *Dispute 2:* The Function of the Theory. (Constitutive rule vs. Heuristic summary).
          *   *Dispute 3:* The Source of Normativity. (Structure of rationality vs. Substantive moral truth).
      *   *Section 4: Verbal Disputes & Sliding.* Call out the Sceptic on "practical wisdom" potentially hiding implicit formalism. Call out the Formalist on "technical problem" potentially masking "impossible problem."

  8.  **Refining the Precision (Self-Correction during drafting):**
      *   *Check:* Did I use British spelling? (Normalisation, programme, behaviour).
      *   *Check:* Are the formulations neutral? Instead of "Sceptic is wrong," use "Sceptic contends..."
      *   *Check:* Did I address the "sliding" claim? Yes, need to explicitly note where the Sceptic might be using implicit weights.
      *   *Check:* The "Recursive" case needs careful handling. If the Formalist puts credence in Scepticism, MEC might tell them to *not* use MEC. This is the "Self-undermining" objection. I need to make sure the document captures this tension.
      *   *Check:* The "Infinite" case. The Formalist shouldn't just say "we fix it." They should admit it requires a departure from standard expectation.
      *   *Check:* The "Normalisation" case. This is the heart of the ITC debate. The Sceptic says it's arbitrary; Formalist says it's constrainable.

  9.  **Final Polish:**
      *   Ensure the "Disagreements Table" has the specific columns requested: Precise Statement, Crux, Agreed Evidence, Separate Predictions.
      *   Make sure the tone is that of a facilitator who is cutting through the noise.

  *(Self-Correction on the "Recursive" point)*: The prompt asks: "if the sceptic's view gets non-trivial credence, what does the formalist's rule say to do then?" This is the "My Favourite Theory" vs. "Metanormative Regress" issue. If I'm 60% MEC and 40% Sceptic (who says 'just use intuition'), MEC says: Calculate expected choiceworthiness. But the Sceptic theory doesn't *have* choiceworthiness units. It says 'use wisdom'. So how does MEC process that input? This is a category error. I need to highlight this category error in the document.

  *(Self-Correction on "Sliding")*: The Sceptic says "be careful with irreversible stuff." The Formalist will say "That's just risk-aversion built into the utility function." The Sceptic needs to admit if that's a formal rule in disguise. The Formalist needs to admit if their "technical normalisation" is just codifying their own moral intuitions about weight.

  10. **Final Review against constraints:** British English? Yes. No citations? Yes. Three specific cases addressed? Yes. Table format? Yes. Numbered agreement list? Yes.

