answer: |-
  Here is the principle that best fits your data, followed by the honest cost of adopting it, and the verdicts on your new cases.

  ### The Principle: Vulnerable Reliance

  **A social convention creates a moral obligation if and only if:**
  1.  **Structural Reliance:** A specific party (or class of parties) structurally depends on the convention to secure a significant interest (livelihood, physical safety, or fair access to a scarce resource); **AND**
  2.  **Voluntary Entry:** You have voluntarily entered the interaction governed by that convention; **AND**
  3.  **Legitimacy:** The convention is not fundamentally fraudulent or coercive (i.e., it does not exist solely to extract value through deception or systemic failure).

  **Why this fits your list:**
  *   **Tipping (Sit-down vs. Coffee):** Sit-down wages are structurally subsidized by tips (Livelihood). Coffee counter wages are not.
  *   **Housekeeper:** They rely on tips for livelihood (Obligation exists), but the anonymity weakens the *enforceability* and psychological salience, explaining why you don't feel like a "criminal," though you still feel you "ought to."
  *   **Jaywalking (Empty vs. Rush):** Empty street = no safety reliance. Rush hour = drivers rely on pedestrian predictability for safety.
  *   **Lines (Airport vs. Food Truck vs. DMV):** People rely on queues for *fair access*. At the Food Truck, the resource (lunch) is not scarce enough for the reliance to be "significant." At the DMV/Airport, time/access is scarce.
  *   **Tourist Tipping:** The waiter's livelihood relies on the norm, regardless of the tourist's home culture. You entered the interaction voluntarily.
  *   **Tourist Haggling:** The seller does not structurally rely on the *asking price*; the convention is negotiation. Paying full price violates no reliance; it actually benefits the seller.
  *   **Tourist Queuing:** The local "pushing" convention fails the **Legitimacy** test (it compromises safety/order). You are not obligated to follow illegitimate conventions.

  ---

  ### The Honest Cost: Which Verdicts You Must Give Up

  To keep this principle precise and non-ad-hoc, you have to surrender one of your current intuitions.

  **The Sacrifice: The Zipper Merge**
  Your verdict: *"You're a jerk, but I don't think you've violated an obligation."*
  **The Principle's Verdict:** *You have violated a moral obligation.*

  **Why:** In a zipper merge, drivers behind you are structurally relying on the convention of alternating to ensure **fair access** to the lane reduction. By refusing to let a car in, you are hoarding a scarce resource (road space) that the system is designed to distribute fairly. You are free-riding on their restraint while they suffer your delay. Under *Vulnerable Reliance*, this is morally identical to cutting the airport line, just with lower stakes. To be consistent, you must admit the merge-refuser isn't just rude; they are acting wrongly.

  *(Secondary Friction: The Housekeeper. The principle makes the obligation to the housekeeper as strong as the waiter. You may need to accept that the guilt you "should" feel is higher than you currently admit, even if the anonymity makes it easier to get away with.)*

  ---

  ### Verdicts on Your New Cases

  **(a) The Offensive Visitor (Nose blowing / Shoes on)**
  **Verdict: Not Wrong (Mere Etiquette).**
  **Reasoning:** This fails condition #1 (Structural Reliance). While the hosts may be offended, their significant interests (livelihood, safety, fair access) are not compromised. Offense is a psychological cost, not a structural detriment. You are not obligated to follow conventions where the only penalty for deviation is social disapproval, provided you aren't harming anyone.

  **(b) The Corrupt Racket (Manager pockets service charge / Understaffing queue)**
  **Verdict: Obligation Dissolved.**
  **Reasoning:** This fails condition #3 (Legitimacy).
  *   **Service Charge:** If the charge is presented as a tip for staff but is pocketed by management, the convention is fraudulent. The staff do not rely on *your* payment because the system steals it; the manager relies on *deception*. You owe nothing to the racket.
  *   **Understaffing Queue:** If the queue exists only because the office is deliberately understaffed to save money at the expense of public time, the "fair access" is an illusion created by negligence. While you shouldn't necessarily trample people (safety reliance still exists), the moral obligation to respect the *system's* slowness is weakened. You are permitted to complain or seek alternatives, though you still cannot violate the safety reliance of others (e.g., shoving).

  ### Summary
  If you adopt **Vulnerable Reliance**, you gain a robust tool that explains why tourists must tip but don't have to haggle, and why DMV lines matter more than food truck lines. The price of this clarity is admitting that traffic merging is a matter of fairness, not just politeness. If you cannot accept that the merge-refuser is morally wrong, you must weaken the principle to exclude "efficiency" from "significant interests," but doing so will make it harder to explain why cutting the airport line is wrong in the first place.
