answer: |-
  You have put your finger on one of the most persistent, painful, and structurally embedded problems in transitional justice and oral history. You are correct that "The Grey Zone" is not quite it, and you are correct that the obvious phrase "victim-perpetrator overlap" fails to capture the *institutional* violence you are describing.

  Here is the breakdown of the terminology landscape, the closest existing concepts, and a proposal for the specific gap you have identified.

  ### 1. The "Grey Zone" (Zona Grigia)
  **Verdict:** You are right to set this aside.
  **Why:** Primo Levi's concept describes a moral and psychological space where the oppressed are coerced into complicity with the oppressor (e.g., Kapos in concentration camps). It is primarily about *moral ambiguity* and the corrosion of agency under extreme duress.
  **The Mismatch:** Your example is not necessarily about moral ambiguity (the younger son killing neighbours may have been a clear-cut act of revenge or defense in his view); it is about *administrative incompatibility*. The Grey Zone explains why someone did it; it does not name the error that occurs when a bureaucracy tries to file them.

  ### 2. Existing Terms (The Near Misses)
  There is no single noun that captures the *institutional failure* specifically, but there are three terms that describe the surrounding anatomy of the problem.

  **A. Complex Victimhood (or Complex Political Perpetrator)**
  *   **What it is:** The standard term in Transitional Justice (used by scholars like Erin Baines and Mahmood Mamdani) for individuals who occupy both roles.
  *   **How it differs:** This describes the *person*, not the *process*. It validates their status but does not name the friction that occurs when they encounter a form that demands a single checkbox.
  *   **Does your example fit:** Yes. The woman and the man are both cases of "complex victimhood."

  **B. Categorical Violence**
  *   **What it is:** A sociological term (rooted in James Scott and Pierre Bourdieu) describing the harm inflicted by state institutions when they force complex social realities into simplified administrative categories to make them "legible."
  *   **How it differs:** This is the closest term for the *institutional failure*. It describes the harm done by the form, the funder, and the editor.
  *   **Does your example fit:** Yes. When the editor cuts the story because it "doesn't fit the shape," that is an act of categorical violence.

  **C. Hermeneutical Injustice**
  *   **What it is:** A philosophical term (Miranda Fricker) describing a situation where a gap in collective interpretive resources prevents someone from making sense of their own experience to others.
  *   **How it differs:** This describes the *epistemic gap*. The narrators cannot be understood because the institution lacks the concepts (the "hermeneutical resources") to process a dual-status narrative.
  *   **Does your example fit:** Yes. The interview goes badly because the *questions* themselves lack the vocabulary to hold the contradiction.

  ### 3. The Gap (and the Coining)
  There is no established single term for **the specific moment the narrative breaks because the institutional categories cannot hold the subject's duality.**

  Scholars talk *around* it (using the terms above), but in the specific context of oral history editing and archival processing, the phenomenon is usually described descriptively (e.g., "narrative disruption due to role ambiguity").

  Since you asked me to coin a term if nothing fits, I propose:

  ## **Categorical Dissonance**

  **Definition:** The structural friction and subsequent narrative degradation that occurs when a subject's lived experience violates the binary ontological requirements of the recording or justice institution.

  **Why this term:**
  *   **Categorical:** Locates the problem in the taxonomy (victim/perpetrator), not the morality.
  *   **Dissonance:** Borrows from "cognitive dissonance" but shifts it to the *system*. The system cannot resolve the input, so it produces noise (tangled stories, corrections, editing cuts).

  **The Edges of Categorical Dissonance:**
  *   **Does it need one person?** Yes. It is an individual-level experience of a structural problem. A whole group can suffer it, but the dissonance manifests in the individual testimony.
  *   **Same conflict?** Yes. If the roles are in different conflicts (e.g., WWII veteran who was abused as a child), it is usually processed as "trauma history" vs. "service." Categorical Dissonance specifically arises when the *same* conflict logic demands they be one or the other (e.g., Truth and Reconciliation processes).
  *   **Causality?** It matters. If the first role caused the second (victimization radicalized into perpetration), the dissonance is higher because the institution often views this as "mitigation" rather than "status." The form wants to know *what you are*, not *why you became it*.
  *   **Institutional Failure vs. Personal Situation:**
      *   **Personal Situation:** *Complex Victimhood.*
      *   **Institutional Failure:** *Categorical Dissonance* (or *Categorical Violence* if emphasizing harm).

  ### 4. Which of your examples don't belong?
  Both of your examples fit **Categorical Dissonance** perfectly.
  *   **The Woman:** Victim (son disappeared) + Victim (son killed) + *Implied Perpetrator?* (You mention she is a narrator in a project about conflicts, implying she may have taken action, or perhaps her "perpetrator" status is simply that she is associated with the "other side" by the neighbours). If she is purely a victim of two different sides, she actually fits the binary (Victim vs. Perpetrator) but challenges the *political alignment* binary. If she took action, she fits the Dissonance model.
  *   **The Man:** Victim (detained) + Perpetrator (vigilante). This is the textbook case. The institution wants to know: Are you here for reparations (Victim) or amnesty/confession (Perpetrator)? He is both, so the form breaks.

  ### 5. Meta-Analysis: Where I Might Be Wrong

  **What would change my mind?**
  I would retract the claim that "no established term exists" if there is a specific methodology term within **Oral History Archival Science** (distinct from Transitional Justice theory) that I am missing. For example, if the Oral History Association has a specific technical term for "editing out non-conforming narrative arcs" (e.g., *"Archival Normalization"*). My training data covers the sociological and justice literature heavily, but specific archival taxonomy might have a niche term I haven't prioritized.

  **Where am I most likely to be wrong?**
  1.  **Loose Usage of "Grey Zone":** I am confident in the distinction regarding Levi, but in contemporary colloquial usage, many practitioners *do* use "Grey Zone" to mean exactly what you described (any blurring of lines). If you are in a room of practitioners, they might just call it "working in the Grey Zone," even if that's theoretically imprecise.
  2.  **Hermeneutical Injustice:** I am leaning heavily on this as the philosophical descriptor. However, some philosophers argue this term is reserved for *marginalized groups* lacking concepts, not necessarily *individuals* conflicting with *bureaucracies*. If the field narrows that definition, it might not apply.
  3.  **The "Coin":** "Categorical Dissonance" is intuitive, but it risks sounding like psychology (internal state) rather than sociology (structural failure). If you use it, you must define it clearly as an *institutional* dissonance, not an internal one.

  ### Summary Recommendation
  If you are writing about this or discussing it with the project team:
  1.  Use **Complex Victimhood** to describe the narrators.
  2.  Use **Categorical Violence** to describe the harm the project might be inflicting by cutting their stories.
  3.  Use **Categorical Dissonance** (your new term) to describe the specific technical failure of the interview/editing process when the binary collapses.

  This distinguishes the *person* (Complex), the *harm* (Violence), and the *mechanism of failure* (Dissonance).
