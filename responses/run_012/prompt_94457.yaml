  This is a clean, rigorous argument. It's also a recognized problem in modern moral philosophy, often called the **"Cluelessness Objection"** to consequentialism (championed by philosophers like Hilary Greaves and Joe Carlsmith). You have independently re-derived a significant philosophical impasse using the intuition of your trade.

  You asked for the bad step and the honest price. You also asked if your friend's distinction repairs the wreck.

  Here is the diagnosis.

  ### The Bad Step

  The logical error is in **(4)**, but the *work* is being done by **(5)**.

  **Step (4) commits a category error:** It infers ontological indeterminacy from epistemic instability.
  *   *The Claim:* "If a ranking flips on small model tweaks, the ranking is a feature of the model, not the actions."
  *   *The Error:* In your old job, if a harvest policy ranking flipped based on a recruitment parameter, you didn't conclude "there is no fact of the matter about which policy yields more fish." You concluded "our model is not precise enough to distinguish them." The fish don't care about your parameterization. Reality has a truth value even if your model is chaotic.
  *   *The Consequence:* If you reject (4), you save Moral Realism (one action *is* better), but you don't save Action Guidance. You still don't know *which* one. Since you want to keep (1) ("Better" means "goes better in expectation"), and expectation is an epistemic calculation, (4) is practically true even if ontologically false.

  **Step (5) is the empirical engine:** "Everything worth deliberating about has long enough downstream chains."
  *   This is the premise that allows the chaos of the long-term to swamp the signal of the short-term.
  *   In fish stocks, you know that beyond a certain horizon (say, 50 years), the prediction interval is wider than the ocean. But within 5 years, the signal-to-noise ratio is acceptable.
  *   If (5) is true, the "noise" (long-term chaos) always dominates the "signal" (short-term robustness).
  *   If (5) is false, the signal can dominate the noise.

  ### The Fix: Attack Premise (5)

  To keep (1) and (3) without landing in (6), you must deny that the long-term chaotic tail determines the expected value of the action. You do this by arguing that **moral value is discounted over time** or that **causal chains converge.**

  In modeling terms: You must argue that the *variance* of the long-term outcome does not carry enough *weight* to flip the robust short-term EV.

  There are two ways to do this, and both have a cost.

  **Option A: Pure Time Discounting**
  You apply a discount rate to moral value, just as you do to economic value. A life saved today counts for more than a life saved in 200 years.
  *   *How it fixes the argument:* If future value is discounted exponentially, the infinite chaotic tail sums to a finite, negligible number. The EV calculation converges on the short-term, robust effects. The ranking stabilizes.
  *   *The Honest Price:* You must accept that the distant future is morally muted. You have to look a longtermist in the eye and say, "Preventing human extinction in 500 years is less important than alleviating suffering today." This is a bullet many consequentialists refuse to bite, but it is the only mathematical way to stabilize EV in a chaotic system.

  **Option B: Causal Convergence (The "Fade-Out" Argument)**
  You argue that while causal chains are long, their *moral significance* fades. The world is resilient; small perturbations (vaccination vs. placebo) wash out over centuries due to system homeostasis.
  *   *How it fixes the argument:* It denies that the "shape of the distribution" in 2500 depends on your choice today. The variance doesn't grow infinitely; it plateaus.
  *   *The Honest Price:* You have to assume the moral landscape is stable and self-correcting. You lose the ability to claim that small present actions can have astronomical future stakes (the core of "Longtermism").

  ### Does Your Friend's Distinction Help?

  Your friend mentioned the distinction between **not knowing consequences** (structural uncertainty) and **knowing them but being unable to add them up** (computational/chaotic uncertainty).

  *   **Does it repair the wreck?** No.
  *   **Why?** In your fish stock models, you faced the second kind. You knew the equations, but the system was chaotic. You couldn't "add them up" because the integral didn't converge reliably.
  *   In ethics, we face *both*. We don't know the equations (what is the value of a person in 2400?) *and* we can't solve them (how do actions propagate?).
  *   Your friend's distinction names the type of uncertainty. It tells you whether you need better data (structural) or more compute/robustness (chaotic). But since your argument relies on (3)—that small tweaks flip the ranking—you are already assuming the worst-case scenario (chaos/sensitivity).
  *   Knowing the name of the uncertainty doesn't give you the EV. It just confirms that the variance is high. It explains *why* the wreck happened, but it doesn't provide the steel to fix it.

  ### Summary of the Cost

  You want to keep:
  1.  **Consequentialism** (Better = Higher EV).
  2.  **Sensitivity** (Long-term models are unstable).

  To avoid **Nihilism** (No action is better), you must sacrifice **Long-term Neutrality**.

  You have to accept that for an action to be "better," its positive effects must be **proximate and robust**. You cannot count on the long-term tail to carry the moral weight, because the long-term tail is mathematically indistinguishable from noise.

  **The Honest Price:**
  You must abandon the idea that we can meaningfully calculate the moral value of actions based on their deep future consequences. You are forced into a kind of **"Myopic Consequentialism."** You can say the vaccine is better than the placebo because the *next ten years* are robustly better, not because the *next ten centuries* are.

  If you refuse to pay this price—if you insist that the year 3000 counts just as much as the year 2025—then your own logic holds, and (6) is true. You are paralyzed.

  Given your background, you know that when a model is sensitive to parameters, you don't trust the projection. You trust the near-field fit. Apply that to ethics. Trust the near-field. Admit the rest is noise.

