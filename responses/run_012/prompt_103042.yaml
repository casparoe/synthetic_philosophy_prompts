      *   *Refining Point 2:* Distinguish between "Pascal's Mugging" (malicious agent) and "Pascal's Wager" style reasoning. The real issue is *Epistemic Cluelessness* (Hilary Greaves). We don't know the long-term effects of insect intervention.
      *   *Refining Point 3:* Focus on the "Affective" component of pain. Nociception $\neq$ Suffering. Insects have nociception. Do they have suffering? If not, $W=0$ for welfare (though $W$ might exist for preference satisfaction, but let's stick to hedonic).
