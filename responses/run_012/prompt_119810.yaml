      *   *Key Insight from User:* "Maybe the run wasn't a failure of common knowledge; maybe it was a horrible success of it." This is crucial. The run *is* an equilibrium driven by common knowledge of fear.
      *   *Knowledge vs. Belief:* In game theory, "knowledge" usually implies truth ($K_i \phi \implies \phi$). "Belief" allows for falsehood ($B_i \phi \not\implies \phi$). In a bank run, if the bank is actually solvent, depositors *believing* it is insolvent causes the insolvency. So "Common Belief of Insolvency" creates "Actual Insolvency." This makes the distinction vital, not a quibble.
      *   *Almost Common Knowledge:* Rubinstein's Email Game. If I know $X$, and you know $X$, but I don't know that you know that I know... (infinite regress). A tiny break in the chain can collapse coordination.

