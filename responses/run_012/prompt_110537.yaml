  I've come around to panpsychism, but the ethics keep me from going full convert. If experience is fundamental, morality becomes a counting problem. How many subjects? How much suffering?

  But I spent forty years in semiconductors. I know electrons are indistinguishable. Swap two, and the physical state is identical. There's no "this" electron or "that" electron.

  So I told a philosopher friend, "You can't count subjects if the universe doesn't keep score."
  He said, "So you reject the view?"
  I said, "No, I just reject the accounting. I've decided the field feels the whole thing at once. So my kettle isn't committing murder, it's just practicing monism."

  It's much easier on the conscience. And the body count.
