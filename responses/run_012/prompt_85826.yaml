answer: |-
  ### 1. The Order of Ideas and Prerequisites

  **The Prerequisite:** Before the four levels can be distinguished, you must establish a **Mutually Agreed Factual Baseline**. You cannot teach students to distinguish a *compositional* disagreement from a *factual* one if they do not share a common set of undisputed data points. If the baseline is contested, every subsequent level collapses into a factual argument.

  **The Sequence (Three Periods):**
  You must build the levels from the ground up. Do not introduce "Purpose" until "Composition" is understood.

  *   **Period 1: The Factual and The Compositional.**
      *   *Goal:* Distinguish between *what happened* (data) and *how it is arranged* (narrative).
      *   *Concept:* History is not a video recording; it is a mosaic. The tiles are facts; the picture is composition.
      *   *Key distinction:* Omission is not lying.
  *   **Period 2: The Lexical and The Purposive.**
      *   *Goal:* Distinguish between *what we call it* (labeling) and *why we tell it* (function).
      *   *Concept:* Names carry verdicts; purposes dictate selection.
      *   *Key distinction:* A "rebellion" and a "revolution" may describe the same actions but assert different legitimacies.
  *   **Period 3: Diagnosis and Application.**
      *   *Goal:* Identify which level a specific argument is occurring on.
      *   *Concept:* Disagreements become toxic when prosecuted on the wrong level.
      *   *Key distinction:* You cannot refute a purposive claim with a factual correction.

  ### 2. The One Case: The 1936 Berlin Olympics Marathon (Son Ki-jeong)

  **The Case:** The victory of Korean runner Son Ki-jeong (competing under the Japanese name Son Kitei) in the marathon at the 1936 Berlin Olympics.

  **What it must have:**
  *   **Stable Facts:** Both sides agree he ran, he won, the Japanese flag was raised, the Japanese anthem was played, his name was recorded as Japanese on official documents.
  *   **High Stakes:** It touches directly on national identity, colonial subjugation, and pride.
  *   **Clear Lexical Divides:** "Colonial Humiliation" vs. "Olympic Achievement"; "Korean Hero" vs. "Japanese Athlete."
  *   **Clear Purposive Divides:** "Evidence of Resilience/Resistance" (Korea) vs. "Evidence of International Integration/Rule of Law" (Japan).

  **What it must lack:**
  *   **No Fact Disputes:** Unlike Nanking or the Comfort Women, there is no dispute over whether the event occurred or the basic mechanics of it.
  *   **No Cartoon Villain:** The IOC rules required athletes to compete for their governing nation. The Japanese Olympic Committee followed the rules. The tragedy is structural, not necessarily the result of a specific villainous order to "erase him" (though the erasure happened). This prevents students from retreating into moral outrage and forces them to look at the *structure* of the story.

  **Why this case rather than the obvious ones (Annexation, March 1st, Nanking):**
  The "obvious" cases currently in your students' bags are mired in **Factual** disputes (death tolls, existence of coercion, legal validity). If you use those, students will immediately revert to shouting about numbers and documents, and you will lose the ability to teach the *Compositional, Lexical, and Purposive* levels. You need a case where the facts are stable so the *disagreement* is forced into the higher levels. This case acts as a training simulation; once they master the levels here, they can return to the textbooks in their bags with new tools.

  ### 3. Misconceptions and Intervention Points

  **Misconception 1: "A shaped account is a distortion." (Naive Realism)**
  *   *The belief:* If a story has a beginning, middle, and end, it is fake. Only a raw list of facts is true.
  *   *Intervention Point:* **Period 1 (Composition).**
  *   *Correction:* Show them a timeline of the athlete's life (20 years) vs. the race (2 hours). Ask: "Which is the truth?" Explain that *all* history is selection. The sin is not shaping; the sin is hiding the shape.

  **Misconception 2: "The truth lies in the middle." (False Equivalence)**
  *   *The belief:* If Korea says X and Japan says Y, the truth is (X+Y)/2.
  *   *Intervention Point:* **Period 3 (Diagnosis).**
  *   *Correction:* Explain that if one side is arguing on the *Purposive* level ("This story builds pride") and the other on the *Factual* level ("The flag was Japanese"), there is no middle. They are talking past each other. Validating both as "half-true" validates the confusion.

  **Misconception 3: "A family's account is simply what happened." (Oral History as Fact)**
  *   *The belief:* My grandmother's memory is unmediated fact.
  *   *Intervention Point:* **Period 2 (Lexical/Purposive).**
  *   *Correction:* When discussing naming, ask: "Did your grandmother call it an 'Incident' or a 'Crime'?" Show that even personal memory uses lexical frames that serve a purposive end (e.g., protecting the family's honor). Memory is also composed.

  ### 4. The Single Exercise: "The Translation Task"

  **The Setup:**
  Provide a neutral, 100-word paragraph describing the 1936 victory containing only undisputed facts (e.g., "On August 9, 1936, Son Ki-jeong crossed the finish line first. The flag raised was the Japanese rising sun. The name on the roster was Son Kitei.").

  **The Task:**
  1.  Divide the class into two groups (do not divide by nationality; mix them).
  2.  **Group A** must rewrite the paragraph to align with a *Korean nationalist narrative* **without changing a single fact**. They may only change Composition (what comes before/after), Lexicon (names/titles), and imply Purpose.
  3.  **Group B** must rewrite the paragraph to align with a *Japanese 1930s administrative narrative* **without changing a single fact**.
  4.  **The Swap:** Groups exchange texts. Their job is not to argue the history, but to **tag the changes**. They must highlight in three colors:
      *   Blue: Compositional shifts (what was emphasized/minimized).
      *   Red: Lexical shifts (what words were swapped).
      *   Green: Purposive shifts (what the ending implies for the reader).

  **Success Criteria:**
  If a student changes a fact (e.g., claims the flag was Korean), they fail the exercise. If they successfully shift the *meaning* while keeping the *facts*, they pass. This proves they understand that disagreement can exist without lying.

  ### 5. What to Refuse to Resolve

  **The Refusal:**
  You must openly refuse to resolve **which Purpose is morally correct.**

  **The Script:**
  *"I will not tell you whether Son Ki-jeong's victory should be remembered primarily as a tragedy of colonialism or a triumph of athletic perseverance. That is not a historical question; it is a civic and moral one. My job is to ensure you understand how that choice changes the history you write. Which purpose you choose is for you, your families, and your societies to decide. But you must decide it consciously, knowing that choosing a purpose requires selecting a composition."*

  **Why:**
  If you validate one purpose over the other, you collapse the lesson back into a moral referendum. You become the referee again. By refusing, you force them to hold the tension of the disagreement without needing to destroy the other side to win.
