      *   *Analysis:* This touches on *performativity* or *signaling games*. Standard evidential reasoning is passive (updating on the fact of action). The Scout's Licence is active (action as a signal to *enable* others). It's distinct because it values the *informational externality* of the act, not just the direct utility + evidential correlation.
