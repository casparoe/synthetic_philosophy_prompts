      *   *Essay's View:* Expands the scope to include *under-acting* (scarcity).
      *   *Analysis:* This is a real distinction in game theory terms. Plenty is a "War of Attrition" or "Chicken" variant (too many drivers). Scarcity is a "Volunteer's Dilemma" (no drivers). The standard literature usually focuses on the existential risk/harm side (Plenty). By distinguishing them, the author clarifies *why* the conformity norm fails in Volunteer's Dilemmas.
