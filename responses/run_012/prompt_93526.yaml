answer: |-
  The air up in the Nilgiris always smells of wet earth and eucalyptus, but inside the factory it smells of something else entirely, a heavy, sweet rotting scent that clings to the back of the throat. Farida has breathed it in for twenty years, since she was old enough to hold a cupping spoon without trembling. She is the final gate. The machines wither the leaves and the rollers twist them and the dryers bake them, but Farida decides if the tea is worth selling. Her specific burden is the dryer number four, which runs a little hot in the afternoon shift. If the heat spikes too high, the tea doesn't burn, not exactly. It just acquires a ghost of smoke, a taint so faint that most people would call it woodiness or a hint of charcoal, but to the buyers in Kolkata and London, it is a defect that ruins the price.

  On Tuesday, the humidity was high enough to make the walls sweat. Farida sat at the long table in the tasting room, surrounded by white porcelain bowls and the silver spittoon that gleamed like a eye. There were six samples from the afternoon shift. She moved through them with the rhythm of prayer, slurping the liquor loudly to aerate it across the palate, holding it on the tongue, letting it cool, swallowing, waiting for the aftertaste. The first three were clean. Green, bright, a little astringent. The fourth sample, from batch four-oh-nine, sat in her mouth differently. It wasn't wrong. It wasn't right. It was a shade darker than the third, but not as dark as the fifth, which was definitely clean. She spat it out. She tasted water. She tasted the third sample again. Then the fourth.

  The difference was smaller than the difference between two sips of the same cup taken ten seconds apart. Her tongue is not a machine; it has days. It has moments where the roof of the mouth is dry, or where a cold she caught last week leaves a phantom sweetness. She looked at the logbook. To sign is to say I know this is clean. To sign is to put her name against the quality. If she rejects it, the batch goes to auction at a lower grade, the workers lose their bonus, the manager looks at her with that tight-lipped patience that means he thinks she is losing her edge. If she signs it and the buyers complain, she loses her authority. She dipped the pen. She signed. The ink flowed smoothly, a black commitment on the white page. She knew it was clean. She had to know it. She felt the certainty in her chest, a solid warm stone.

  She left the factory as the sun was going down, the hills turning a bruised purple. The drying sheds were still warm, radiating the day's heat into the cooling air. Usually, the walk home is when her mind empties, when she thinks about what to cook or whether the monsoon will hold. But today, the taste of batch four-oh-nine was still there, not on her tongue but in her head. She walked past the shed where dryer number four hummed behind corrugated iron. She stopped and looked at the venting steam. It smelled of nothing special. Just tea.

  The thought came quietly, without permission. It wasn't a question of whether the tea was actually smoky. It was a question of whether she knew it wasn't. She had felt confident. But she remembered a day three years ago, batch two-twenty, when she had felt exactly this same confidence, only to receive a letter from a buyer two weeks later noting a hint of smoke. She had trusted her feeling then. The feeling had been identical to the feeling she had today. The internal state, the warmth in the chest, the lack of hesitation, the clarity of the taste—it had all been the same. But in one case, the tea was clean, and in the other, it was not.

  If the feeling of knowing is the same whether you know or whether you are merely guessing correctly, then the feeling cannot tell you which one you are doing. Farida stood in the dust of the road and watched a truck grind past, kicking up red dirt. She thought about the batches that were just a degree hotter than four-oh-nine. If the dryer had been one degree hotter, would she have tasted it? Probably not. The difference would be below her threshold. She would have signed that batch too. And if the dryer had been one degree cooler, she would have signed it. There is a range of heat where the tea is technically tainted, but her tongue cannot catch it. There is a range of heat where the tea is clean, and her tongue cannot distinguish it from the tainted range.

  So when she signs, she is standing in a margin of error. She is saying I know this is clean, but she cannot know that she knows it. Because to know that she knows it, she would need to be sure that she isn't in that nearby situation where the tea is slightly smokier and she still says it is clean. But she can't tell the difference between being in the safe zone and being in the danger zone. The light inside her mind, the thing that is supposed to show her her own certainty, doesn't reach all the way into the corners. It leaves shadows.

  She reached her house and unlocked the door. Her husband was listening to the radio in the other room. She went to the sink to wash her hands. She scrubbed them with soap, then with lemon, then with salt, the way her mother taught her to remove the smell of fish or tea or blood. She dried them on a towel. She brought her hands to her face and cupped them over her nose and mouth. They still smelled of the factory. They smelled of the drying leaves. She couldn't tell if the smell was on her skin or if it was just in her memory, projecting itself onto the clean skin.

  She walked into the bedroom and sat on the edge of the bed. The logbook was in her bag in the hallway. The pen was capped. The tea was shipped. In a month, someone in London would brew it. They might say it is perfect. They might say it is flawed. But tonight, in the quiet of the room, Farida realized that even if they say it is perfect, she still won't know if she knew it was clean. She will only know that she was right. And being right is not the same as knowing. She lay back on the bed and stared at the ceiling fan cutting the dark air. She tried to summon the feeling of certainty she had had at the table, the solid warm stone in her chest. She found it, or something that felt exactly like it. But now that she was looking at it, now that she was examining the feeling itself, it seemed thin, like a layer of paint over a wall you can't see. She closed her eyes, but the taste remained, suspended in the dark, neither clean nor tainted, just waiting for someone else to decide what it was.
