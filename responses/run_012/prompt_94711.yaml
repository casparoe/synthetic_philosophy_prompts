answer: |-
  You are describing a coherent cluster of cognitive phenomena that sits at the intersection of epistemology (the philosophy of knowledge), cognitive psychology, and linguistics. You are not just narrating normal cognition; you are describing the *mechanics* of how human cognition handles testimony, which turns out to be quite different from how we *think* we handle it.

  There is no single label that captures all four observations because they actually belong to three different systems: **Belief Fixation** (1 & 2), **Memory Architecture** (3), and **Pragmatic Inference** (4).

  Here is the carving you asked for, separating which observations are the same mechanism and which are distinct, along with the established names for each and where those names fail to capture your specific experience.

  ### Cluster 1: The Mechanics of Acceptance (Observations 1 & 2)
  *The belief arrives instantly (like perception); reasons are generated post-hoc.*

  These two observations are two sides of the same coin. Observation 1 is the *process*; Observation 2 is the *metacognitive reflection* on that process.

  **1. The Philosophical Name: The Principle of Credulity (Thomas Reid)**
  In the 18th century, David Hume argued that belief in testimony is inferred (we weigh the speaker's honesty, the likelihood of the event, etc.). Thomas Reid argued the opposite: belief is **default**. He proposed a "Principle of Credulity," suggesting humans are hardwired to accept information as true unless there is a specific reason not to.
  *   **Where it fits:** It perfectly matches your feeling that belief "just shows up" and that disbelief requires a trigger.
  *   **Where it fails:** Reid treated this as a normative moral principle (we *should* trust). You are describing a descriptive psychological fact (we *do* trust, even when we shouldn't).

  **2. The Cognitive Name: The Spinozan Model of Belief Fixation (Daniel Gilbert)**
  Cognitive psychologist Daniel Gilbert proposed that understanding a proposition and believing it are the same initial step. To *not* believe it requires a second, effortful step of "unaccepting" it. This is often called **Spinozan Belief Fixation**.
  *   **Where it fits:** This explains why belief feels like "seeing." In the Spinozan model, comprehension *is* acceptance. The "reasoning" you do later is the Cartesian correction step that often never happens.
  *   **Where it fails:** It doesn't fully explain the *social* aspect of why you trust the pharmacist but not the uncle. It treats all propositions similarly, whereas your experience suggests a filter based on "fit with existing stuff."

  **3. The Social Psychology Name: The Social Intuitionist Model (Jonathan Haidt)**
  Haidt argues that moral (and factual) judgments are intuitive flashes followed by strategic reasoning. He calls the reasoning part "the press secretary."
  *   **Where it fits:** This captures your feeling that the reasons are "fake" or invented after the fact. You are acting as your own press secretary, justifying a decision your intuition already made.
  *   **Where it fails:** Haidt focuses on moral judgments. Applying it to mundane facts (pharmacy hours) requires extending the theory, though most cognitive scientists now accept this applies to factual belief too.

  ### Cluster 2: The Memory Architecture (Observation 3)
  *You defend the belief but cannot recall the source.*

  This is distinct from Cluster 1. Cluster 1 is about *input*; this is about *storage and retrieval*.

  **The Name: Source Monitoring Error (or Source Amnesia)**
  This is a well-documented memory failure where the content of a memory is retained, but the context (where, when, who) is lost.
  *   **Where it fits:** It explains exactly why you can defend the fact ("pharmacy closes at 6") but not the evidence ("pharmacist told me").
  *   **The Mechanism:** Over time, the "tag" that labels information as "heard from X" decays faster than the semantic content.
  *   **Where it fails:** Source amnesia usually implies the belief becomes *more* fragile over time. In your case, you say you would "still defend it." This suggests the belief has been **integrated** into your web of belief (Quine's term). Once a fact is integrated, the source becomes irrelevant because the fact is now supported by the coherence of the web, not the original testimony.
  *   **Related Concept:** **The Illusion of Truth Effect.** This is the finding that repetition makes statements feel truer. However, that usually relies on *forgetting the source*. If you forget you heard it five times, it just feels "familiar," and familiarity mimics truth.

  ### Cluster 3: The Repetition Backfire (Observation 4)
  *Hearing the same surprising thing a fifth time decreases trust.*

  This is the outlier. It contradicts the standard "Illusion of Truth" effect (where repetition increases belief). This suggests you are not just processing the *content*, but the *communicative act*.

  **The Name: Violation of Gricean Maxims (Pragmatics)**
  Linguist Paul Grice proposed that communication relies on unspoken rules. One is the **Maxim of Quantity**: make your contribution as informative as required, but *not more so*.
  *   **Where it fits:** If someone tells you a surprising thing once, it's information. If they tell you five times, they are violating the Maxim of Quantity. Your brain interprets this violation not as "more evidence," but as "persuasive pressure."
  *   **The Mechanism:** You are engaging in **Epistemic Vigilance** (a term coined by Dan Sperber). This is the counter-system to Reid's Credulity. It scans for manipulation. Repetition signals that the speaker is *trying* to make you believe, which triggers a suspicion that the evidence is weak.
  *   **Where it fails:** This only applies to *surprising* claims. If someone says "I have two hands" five times, you think they are joking or testing you, but your trust doesn't necessarily drop. It drops specifically when the claim requires evidence and the repetition substitutes for it.

  ---

  ### The Carving: How they relate

  1.  **Observations 1 & 2 are the Core Engine.** This is your **Default Credulity System**. It is fast, automatic, and perception-like. It is the standard operating mode for human cognition because it is energetically cheap.
  2.  **Observation 3 is a Storage Artifact.** This is **Source Decay**. It serves the Core Engine by allowing you to use information without carrying the cognitive load of tracking every source. It makes the belief feel more like "knowledge" and less like "hearsay."
  3.  **Observation 4 is the Safety Valve.** This is **Epistemic Vigilance**. It is the only thing that stops the Core Engine. It is triggered not by the content, but by the *behavior* of the speaker (redundancy/pressure).

  **Are they the same phenomenon?**
  No. 1 & 2 are about *acquisition*. 3 is about *retention*. 4 is about *verification*. However, they all point to a single conclusion: **Belief is not a conclusion of reasoning; it is a state of being that reasoning is hired to protect.**

  ### Is this a genuine puzzle?

  It is a genuine puzzle for **Normative Epistemology** (how we *ought* to think), but it is standard fare for **Descriptive Psychology** (how we *do* think).

  The puzzle you are feeling is the gap between the **Cartesian Ideal** (I think, therefore I am; I weigh, therefore I believe) and the **Reidian Reality** (I hear, therefore I believe; I doubt, therefore I think).

  Most people assume they are Cartesians. Realizing you are a Reidian feels like discovering you don't have free will. It feels "fake" because you were taught that belief *should* be the result of weighing evidence. Discovering that the weighing happens after the fact feels like fraud, but it's actually efficiency.

  ### A Proposed Name

  Since no single term covers the phenomenology of the *whole* cluster (the feeling of automaticity + the post-hoc justification + the source loss + the vigilance trigger), I propose calling this **Passive Testimonial Absorption with Pragmatic Override.**

  **Definition:** A cognitive mode where factual claims are accepted into the belief system automatically upon comprehension (Absorption), source attribution decays to integrate the fact into general knowledge (Passive), and skepticism is triggered only by violations of communicative norms rather than evidential deficits (Pragmatic Override).

  **Edge Cases (Where this stops applying):**

  1.  **High-Stakes Adversarial Contexts:** If you are buying a used car or negotiating a salary, the "Default Credulity" switches off. You enter "Cartesian Mode" where belief *is* withheld until evidence is provided. Your phenomenon applies to *low-stakes cooperative* contexts.
  2.  **Domain Expertise:** If you are a pharmacist and someone tells you about pharmacy hours, you won't believe them automatically. You will check your own knowledge. This phenomenon applies when you lack the means to verify the claim independently.
  3.  **Contradictory Testimony:** If Person A says "Open at 6" and Person B says "Open at 8," the automaticity breaks. You are forced into weighing. Your phenomenon describes the state *before* contradiction arises.

  ### Summary of Names to Research

  If you want to read more, search for these specific terms. They map to your four points:

  1.  **Thomas Reid's "Principle of Credulity"** (Philosophy of Testimony)
  2.  **Daniel Gilbert's "Spinozan Model of Belief"** (Cognitive Psychology)
  3.  **Source Monitoring Error** (Memory Psychology)
  4.  **Dan Sperber's "Epistemic Vigilance"** (Evolutionary Psychology/Pragmatics)

  You are describing the human condition accurately. The "fakeness" you feel regarding your reasons is the feeling of your conscious mind catching up to what your unconscious mind has already decided.
