answer: |-
  # Joint Statement on the Reference Class Problem

  **To:** The Working Group on Probability
  **From:** The Single-Class Realist and The Question-Relativist
  **Date:** October 26, 2023
  **Subject:** Mapping the Disagreement

  After one year of adversarial collaboration, we submit this document to clarify the structure of our disagreement regarding the reference class problem. We have not reached a consensus on the metaphysics of probability. However, we have isolated the points of contact and the points of divergence. The following statement represents the boundary of our agreement and the precise topology of our dispute.

  ### 1. Agreed Claims

  Both signatories endorse the following claims. These statements are formulated to avoid presupposing either the existence of a unique causal class or the necessity of a pragmatic context.

  1.  **Formal Neutrality:** The standard mathematical formalism of probability (measure theory, conditional expectation with respect to a sub-sigma-algebra) does not dictate how a reference class is selected. The mathematics governs the manipulation of probabilities once assigned, but not the assignment itself.
  2.  **Desiderata:** We agree that two competing virtues guide class selection:
      *   **Specificity:** All else being equal, a narrower class with stable statistics is preferable to a broader one.
      *   **Statistical Relevance:** All else being equal, factors that do not alter the probability conditional on other fixed factors should be excluded.
  3.  **Causal vs. Statistical:** We agree that statistical relevance does not entail causal relevance. A variable may screen off others statistically without being a cause in the underlying physical structure.
  4.  **Indefensible Classes:** We agree that some class selections are objectively indefensible. A class constructed solely to maximize or minimize a probability without regard for stability, replicability, or evidential access is rejected by both sides.
  5.  **Numerical Agreement:** In cases where only one stable, relevant class is available, or where all salient classes yield the same conditional frequency, we agree on the numerical probability assignment.
  6.  **Nature of the Dispute:** We agree that our disagreement is not about the axioms of probability, nor about whether classes can be ranked by informativeness, nor about the computational methods used to derive frequencies from data.

  ### 2. Disagreements

  The following table details the remaining substantive disagreements. The "Statement of Position" columns are drafted to be acceptable to the respective signatory as a fair characterization of their view.

  | Question at Issue | Realist's Statement of Position | Relativist's Statement of Position | Crux | Agreed Case / Evidence | Realist's Prediction | Relativist's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Does the correctness of a singular probability claim presuppose a decision context?** | A singular probability claim asserts a fact about the world's causal structure. Its truth is independent of whether an agent is present to act on it. | A singular probability claim is an answer to a query. Without a decision context or evidential goal, the query is incomplete, and the claim has no truth value. | Is probability a property of the *event* or a relation between the *event and the inquirer*? | **The Single Atom:** An atom with a known decay constant is observed. No decision is attached; no bet is offered. The question is simply: "What is the chance it decays in the next hour?" | The claim has a determinate truth value fixed by the physical setup. | The claim is indeterminate. It acquires a value only if embedded in a protocol (e.g., "for the purpose of prediction"). |
  | **Does objective chance supply a distinguished class or only a distinguished protocol?** | Physical chance identifies a unique reference class defined by the causal variables that govern the outcome. | Physical chance identifies a protocol for generating data, but the class is determined by how the agent partitions the protocol's variables. | Is the "correct" class discovered in nature or constructed for inquiry? | **The Single Atom:** (Same as above). The physical setup is identical for both. | There is one natural kind (the atomic species/state) that dictates the class. | There is one experimental setup, but multiple valid descriptions (e.g., by energy level, by time of emission) depending on the question. |
  | **Is the conflict between specificity and relevance governed by a rule or resolved by interest?** | When specificity and relevance conflict, causal relevance trumps statistical relevance. The rule is to find the class fixed by the causal mechanism. | When specificity and relevance conflict, the choice is resolved by the agent's interest (e.g., predictive accuracy vs. causal explanation). | Is there a hierarchy of virtues, or is the hierarchy context-dependent? | **The Actuarial vs. Marker Case:** A patient has an actuarial risk of 1/100. A biological marker screens off the actuarial variables, yielding a risk of 8/100. The marker is statistically relevant but its causal status is unknown or it is a proxy. | If the marker is a proxy, the 1/100 (or the causal underlying) is the true probability. The 8/100 is misleading. | If the marker is available for testing and prediction, the 8/100 is the correct probability for clinical decision-making, regardless of causal status. |
  | **Can two contradictory probability assignments for the same event both be correct?** | No. If two classes yield different probabilities, at most one corresponds to the causal reality. The other is false. | Yes. Relative to distinct decision problems or evidential states, contradictory assignments can both be warranted. | Is contradiction a sign of error or a sign of distinct contexts? | **The Actuarial vs. Marker Case:** (Same as above). | One number is the chance; the other is an error or an approximation. | Both numbers are valid probabilities relative to different information sets. |

  *Note on Discrimination:* In **The Single Atom** case, the positions discriminate on the *existence* of a truth value, not on a numerical value. In **The Actuarial vs. Marker** case, the positions discriminate on the *numerical value* deemed appropriate for action. Where the marker is causally transparent, the positions may coincide numerically, but they diverge on the justification for that number.

  ### 3. Verbal Residue

  A portion of our dispute is merely verbal, centering on the word **"Correct."**

  *   **The Realist** uses "correct" to mean **ontologically faithful**: A probability assignment is correct if it matches the objective propensity generated by the causal structure.
  *   **The Relativist** uses "correct" to mean **pragmatically warranted**: A probability assignment is correct if it is the optimal input for a specific decision problem given available evidence.

  **Agreement upon Disambiguation:**
  Once this terminological distinction is made, we agree on the following mapping:
  1.  There exists a physical structure (causal variables) that generates frequencies. (Realist's domain).
  2.  There exists a set of rational strategies for assigning measures to events based on available descriptions and goals. (Relativist's domain).

  We disagree only on whether the word "probability" (in the context of a singular claim) refers to (1) or (2). The Realist insists "probability" names the propensity. The Relativist insists "probability" names the rational degree of belief. We agree that if we distinguish "Chance" (propensity) from "Probability" (rational credence), the mathematical relations between them remain stable, even if we disagree on whether they can be decoupled in singular cases.
