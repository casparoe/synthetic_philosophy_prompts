      *   *Crux 2: Necessity of Representation.*
          *   Computationalist: You need internal states standing for external things.
          *   Critic: Coupling with environment is enough; no internal "picture."
          *   *Test Case:* A robot navigating a maze.
          *   *Prediction:* Comp: Internal map required. Critic: Sensorimotor contingency sufficient.
      *   *Refining the Test Cases:* They need to be concrete enough for an engineer. The "Chinese Room" is too cliché. Let's use a specific engineering scenario: *Porting code to a fundamentally different architecture* or *Damage recovery*. Let's go with *Damage Recovery/Plasticity*.
