answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Ontological and Explanatory Status of Computation in Neural Systems  
  **Parties:** Proponent (Computational Functionalist) & Critic (Dynamical/Enactivist Systems Theorist)  
  **Date:** October 26, 2023  
  **Status:** Final Draft for Signature

  ## PREAMBLE
  This document records the results of a structured adversarial collaboration regarding the proposition: *"The brain is a computer."* The goal is not to force consensus where none exists, but to precisely isolate the ontological, semantic, and empirical points of divergence. Both parties agree that the term "computer" is ambiguous in common parlance and commit to the definitions and distinctions below.

  ## SECTION I: JOINTLY AFFIRMED CLAIMS
  Both parties affirm the following ten claims. Disagreement regarding the *interpretation* of these claims is reserved for Section II.

  1.  **Definition of Computation:** Computation is formally defined as the manipulation of symbols or state transitions according to a set of rules (an algorithm). It requires a discrete state space and a transition function. Both parties agree this is a mathematical definition, not inherently a physical one.
  2.  **Levels of Description:** Physical systems can be described at multiple levels (e.g., quantum, molecular, cellular, network, behavioral). A description at one level does not negate the validity of descriptions at other levels, provided mapping rules exist between them.
  3.  **Multiple Realizability (Weak):** The same input-output behavior or functional role can be physically realized by distinct substrates (e.g., silicon vs. carbon, digital vs. analog). Both parties agree this is empirically true for simple functions; disagreement exists regarding complex cognition (see Section II).
  4.  **Implementation Constraints:** Not every physical mapping counts as a valid implementation for *explanatory* purposes. To claim a system implements a computation, the causal structure of the physical system must reliably mirror the logical structure of the computation without requiring *post-hoc* gerrymandering of the mapping.
  5.  **The Triviality Worry:** Both parties acknowledge the "Triviality Argument" (that with a complex enough mapping, any physical system can be described as implementing any program). Both agree that if *any* mapping counts, the claim "the brain is a computer" becomes vacuous and scientifically useless.
  6.  **Computation vs. Computational Description:** There is a distinction between a system that *computes* (where the causal mechanism relies on the syntactic manipulation of states) and a system that *admits a computational description* (where an observer can model the system mathematically). Both agree planets orbiting a star admit a computational description but do not compute.
  7.  **Physical Grounding:** All neural activity is fundamentally physical (electrochemical). No "ghost in the machine" is posited by either side. Any computational process must be physically instantiated.
  8.  **Explanatory Utility:** Computational models have successfully predicted neural behavior, guided experimental design, and produced working artificial neural networks. Both parties agree these models are *useful*, regardless of whether they reflect the brain's ontological nature.
  9.  **Causal Efficacy:** Physical states cause physical states. If computational states are to be causally relevant, they must supervene on physical states without violating physical causal closure.
  10. **Environmental Coupling:** The brain does not operate in isolation. It is continuously coupled with a body and an environment. Both parties agree that isolating the brain from this context degrades the explanatory power of any model, computational or dynamical.

  ## SECTION II: TABLE OF REMAINING DISAGREEMENTS
  The following points remain unresolved. Wording is negotiated so that each party accepts the phrasing as an accurate representation of their opponent's view.

  | ID | Topic | Proponent (Computationalist) Position | Critic (Dynamical/Enactivist) Position |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Ontology of Implementation** | Implementation is an **objective** property. If the causal structure is isomorphic to the formal structure, the system *is* computing, regardless of whether an observer is present to interpret it. | Implementation is **observer-relative**. A system only computes relative to an interpreter assigning semantic value to the states. Physics alone does not distinguish bits from voltage. |
  | **D2** | **Necessity of Representation** | Cognition requires **internal representations**. Neural states must carry content (stand for) external variables or goals to explain flexible behavior. | Cognition is **direct coupling**. Internal states need not "represent" anything; they merely mediate sensorimotor contingencies. Representation is an optional explanatory tool, not a biological requirement. |
  | **D3** | **Substrate Independence** | Cognition is **substrate-neutral**. If we replicate the functional/computational architecture of a brain in a different medium (e.g., silicon), the resulting system possesses the same cognitive status. | Cognition is **substrate-dependent**. The specific temporal dynamics and biological materiality of the brain are constitutive of cognition, not merely implementational details. |
  | **D4** | **Discreteness vs. Continuity** | The brain can be adequately modeled as a **discrete** state machine (spikes as bits) for the purposes of explaining cognition. Continuous dynamics are implementation noise. | The brain is fundamentally a **continuous** dynamical system. Discretization is a lossy compression that discards the mechanism of cognition (e.g., timing, phase, amplitude). |

  ## SECTION III: CRUXES AND PRE-REGISTERED PREDICTIONS
  These are the specific empirical or conceptual tests that would most significantly shift confidence in either direction. Both parties agree that the outcomes listed below would bear on the truth of their respective positions.

  ### Crux 1: The Objectivity of Implementation (Addressing D1)
  **The Test Case:** *The Uninterpreted Isomorph.*
  Consider a physical system constructed to have a causal state-transition structure isomorphic to a specific algorithm (e.g., a sorting network), but which is never connected to an input/output device and never observed by an agent capable of interpreting the states as "data."

  *   **Proponent Prediction:** The system **is** computing. The physical causal structure suffices for implementation. If we later discover it, we find a computer, we do not make it one by observing it.
  *   **Critic Prediction:** The system is **not** computing. It is merely evolving physically. Without an interpreter to assign syntactic/semantic value to the states (distinguishing 0 from 1), there is no computation, only dynamics. Computation is a relation, not a property.

  ### Crux 2: The Necessity of Representation (Addressing D2)
  **The Test Case:** *The Minimal Navigation Task.*
  A robot must navigate a maze to a goal. We compare two architectures: (A) An internal map builder (explicit representation of the maze) and (B) A Braitenberg-style vehicle (direct sensor-motor coupling with no internal state storage of the maze layout). Both succeed 100% of the time in dynamic environments.

  *   **Proponent Prediction:** Architecture (A) is required for *general* cognition. If we scale to human-level flexibility, Architecture (B) will fail. True cognition requires decoupling from the immediate environment via representation.
  *   **Critic Prediction:** Architecture (B) is sufficient in principle. Apparent "representation" is just complex coupling. If Architecture (A) succeeds, it is because it simulates dynamics, not because it manipulates symbols. We will find that biological brains operate closer to (B) even in complex tasks (e.g., via resonance/oscillation rather than map storage).

  ## SECTION IV: SEMANTIC CLARIFICATIONS (VERBAL DISPUTES)
  Both parties acknowledge that a portion of the disagreement stems from divergent definitions of key terms. This section isolates those disputes to prevent them from contaminating empirical claims.

  1.  **"Computer":**
      *   *Proponent Usage:* Any system that processes information via state transitions, regardless of substrate.
      *   *Critic Usage:* A human-designed artifact intended for symbolic manipulation.
      *   *Resolution:* When the Proponent says "The brain is a computer," the Critic hears "The brain is like a human-designed artifact." The Proponent intends "The brain instantiates formal operations." **Agreement:** Future usage will distinguish "Computational System" (Proponent's sense) from "Turing Machine Artifact" (Critic's sense).

  2.  **"Representation":**
      *   *Proponent Usage:* Any internal state that covaries with an external state and is used to guide action (Informational/Teleological).
      *   *Critic Usage:* An internal state that possesses "aboutness" or semantic content independent of use (Strong Intentionality).
      *   *Resolution:* The Critic does not deny covariation. The Critic denies that covariation constitutes "content." **Agreement:** Future usage will distinguish "Correlational State" (Critic acceptable) from "Semantic Representation" (Proponent required).

  3.  **"Model" vs. "Reality":**
      *   *Dispute:* The Proponent often argues from the success of the *model* to the nature of the *reality*. The Critic argues that a successful model does not imply ontological identity (e.g., fluid dynamics models water, but water is not made of equations).
      *   *Resolution:** Both agree that predictive success does not prove ontology. The Proponent must provide independent evidence for the ontological claim beyond model fit.

  ## SIGNATURES

