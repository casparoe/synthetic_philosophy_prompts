prompt: |-
  I'm a backend engineer with no formal philosphy background, but I've gotten into a long argument with a coworker about whether the brain is a computer. I want the document that two people could actually sign after a real adversarial collaboration: a committed computationalist (the brain implements computations, and that's the right level of explanation) and a committed dynamical-systems/enactivist critic (the brain is a dynamical system, and computation is at best a useful model, not what's really going on). Write the joint statement they'd produce. I want a numbered list of claims both can sign -- about what 'computation' means, levels of description, multiple realizability, what counts as an implementation, the triviality worry that any physical system implements some program under some mapping, and the difference between a system that computes something and one that merely has a computational description. Then a disagreements table with the exact remaining disagreements, each phrased so the side that holds it would accept the wording. Then the cruxes -- I think one is whether implementation is observer-relative or objective, and another is whether representation is needed at all -- and for each crux a concrete case or argument both sides agree bears on it, with each side's prediction written down in advance. If some of the fight turns out to be about words, say which part and why. No reading list or citations, just the document.
