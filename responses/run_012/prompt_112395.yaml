  2.  **Deconstruct the Debate (Computationalism vs. Dynamical Systems/Enactivism):**
      *   *Computationalist:* Brain = Information processing system. Cognition is computation over representations. Functionalism holds. Multiple realizability is key.
      *   *Dynamical/Enactivist:* Brain = Biological organ embedded in an environment. Cognition is embodied action. Computation is a metaphor or high-level abstraction, not the ontological reality. Triviality argument (Searle/Putnam) is a major weapon. Representation is suspect.
      *   *Common Ground:* Both agree the brain is physical. Both agree math/models are useful. Both agree behavior needs explaining.
      *   *Key Friction Points:* What counts as "computation"? Is it intrinsic or attributed? Do neurons represent things? Is the "software/hardware" distinction real in the brain?

  3.  **Drafting Section 1: Agreed Claims (The Consensus):**
