answer: |-
  A line of rational agents sequentially chooses a restaurant. Everyone picks Luigi's.

  The last agent turns to the group. "Does this unanimity mean Luigi's is definitely good?"

  The second agent says, "No. Only the first two signals favored Luigi's. That's all the public information contains."

  The last agent asks, "And the rest of you?"

  The crowd replies, "Our private signals favored Mario's. But once the cascade started, our data became irrelevant to the public record."

  The last agent shrugs. "So this crowd of fifty is statistically identical to a crowd of two?"

  "Basically," says the second agent. "Now please pick Luigi's. It costs you nothing to ignore your signal, and it saves us from admitting we're just three people wearing fifty masks."

  ***

  The punchline depends on the information loss property of cascades, where later agents' private signals are rationally ignored and thus never aggregated into the public record. The setup licenses this because agents observe only prior actions, not signals, causing the public history to eventually outweigh any single private piece of evidence.
