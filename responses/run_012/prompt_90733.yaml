answer: |-
  This is one of the hardest problems in the philosophy of action, often called the problem of **Shared Intentionality**. You are sensing the difference between *aggregate behavior* (a bunch of I's) and *joint action* (a We).

  Your tentative principle ("knowing the others were doing theirs... partly because of that") is close to the standard philosophical account (Michael Bratman's theory of shared intention), but you are right that it breaks on Improv. That's because your principle demands knowledge of the *content* of the action, whereas joint action often only requires knowledge of the *commitment* to the activity.

  Here is a precise principle you can use, followed by the resolution of your contradictions.

  ### The Principle: Counterfactual Interdependence

  To truthfully say **"We did X,"** two conditions must be met:

  1.  **Mutual Responsiveness:** During the action, each participant adjusts their behavior in response to the others to sustain the activity.
  2.  **Fragility:** If one participant had stopped or acted significantly differently, the others would have been unable to complete the action *as described*, or the action would have lost its identity.

  If the action survives unchanged regardless of what the others do, it is not a "We." It is a collection of "I's."

  ### Applying the Principle to Your Cases

  Here is how the principle sorts your gut feelings, and where you need to adjust.

  **1. The Couch (Yes)**
  *   **Test:** If I let go, you drop it. The action "carrying the couch" ceases to exist if one of us quits.
  *   **Verdict:** Keep. This is the strongest "We."

  **2. The Sidewalk (No → Yes)**
  *   **Test:** Walking north independently? If I stop, you keep walking. The action "walking north" is not fragile. (Verdict: No).
  *   **Test:** Walking *together*? If I stop to tie a shoe, you wait. If I speed up, you match. The action "walking together" is fragile.
  *   **Verdict:** Keep. The transition point is when **Mutual Responsiveness** begins.

  **3. The Jury (Yes)**
  *   **Test:** This is institutional. The action is "convicting," which is a rule-bound status. One vote does not convict. The action is structurally fragile; it requires the threshold.
  *   **Verdict:** Keep. Note that this is a *Procedural We*, not necessarily an interpersonal one.

  **4. The Corporation (Yes, but...)**
  *   **Test:** This is a *Systemic We*. No single person intended the pollution, but the system is designed such that individual actions aggregate to the outcome.
  *   **Adjustment:** For your novel, be careful. If your "We" narrator is the *employees*, they might truthfully say "We polluted" only if they feel complicit. If they feel like cogs, "The Company polluted" is more accurate than "We."
  *   **Verdict:** Keep, but recognize it as a different *species* of "We" than the couch. It is a "We" of outcome, not necessarily of intent.

  **5. Improv (Yes)**
  *   **Why your principle failed:** You thought they needed to know *what* the other would do. They don't. They need to know the other is *committed to the scene*.
  *   **Test:** If Actor A stops engaging, the scene dies. Actor B must adjust instantly to save it. There is high Mutual Responsiveness and high Fragility.
  *   **Verdict:** Keep. The shared goal is not "say this line," it is "sustain this interaction."

  **6. The Surprise Trip (No)**
  *   **Test:** During the planning phase, if I booked London, you still successfully booked Paris. My action did not require your adjustment. The "meshing" happened only in *retrospect*.
  *   **Verdict:** Keep. This is coincidence, not joint action.

  **7. The Flash Mob (The Pivot Point)**
  *   **Test:** This is the boundary case.
  *   **Analysis:** During the dance, do I adjust to you? If you stop, do I stop? Probably not. I dance because of the *text*, not because of *you*. However, there is a shared awareness *during* the act that creates a temporary "We."
  *   **Verdict:** **Downgrade this.** Your gut said "half-true." The principle says "No, unless..."
      *   If they are just following a script individually: It is **not** a "We." It is parallel action.
      *   If they make eye contact, sync up, and feed off the crowd energy: It **becomes** a "We" in the moment due to Mutual Responsiveness.
      *   **Correction:** You must treat the Flash Mob differently from the Surprise Trip. The Flash Mob has *synchronicity of awareness* (I know you are doing this while I do it). The Surprise Trip does not.

  ### The Contradiction Resolution

  You suspected the Flash Mob and Surprise Trip were structurally identical. **They are not.**

  *   **Surprise Trip:** No awareness during the act. No responsiveness. **Verdict: "I's."**
  *   **Flash Mob:** Awareness during the act. Potential for responsiveness (energy matching). **Verdict: "Weak We."**

  **You must give up the idea that the Flash Mob is a full "We" in the same way the Couch is.** It is a "We" of *attention*, not necessarily *agency*. If your narrator says "We danced," it implies a shared mind. If they were strangers ignoring each other while following a script, "We danced" is a lie the narrator is telling to create unity where there is none. **This is a great tool for characterization.** If your "We" narrator claims "We danced" for a flash mob where no one looked at each other, your narrator is unreliable or desperate for connection.

  ### A New Test Case

  **Case:** A group of neighbors all mow their lawns on Saturday morning because the HOA fines them if they don't.
  **Principle Prediction:** "We mowed the lawns."
  **Analysis:**
  *   *Responsiveness:* No. If I don't mow, you still mow to avoid the fine.
  *   *Fragility:* No. My mowing doesn't depend on yours.
  *   **Verdict:** **False.** It should be "We all mowed our lawns" (distributive), not "We mowed the lawns" (collective).
  *   **Narrative implication:** If your narrator says "We mowed the lawns" here, they are asserting a community bond that doesn't exist. Use this to show the narrator's bias.

  ### Practical Application for Your Chapters

  When you are stuck on a sentence, run the **Stop-Test**:

  > *"If one of us had stopped halfway through, would the rest of us have been unable to finish, or would the meaning of the act have changed?"*

  *   **Couch:** Yes. (We carried it.)
  *   **Improv:** Yes. (We built the scene.)
  *   **Flash Mob:** No. (We happened to dance.)
  *   **Surprise Trip:** No. (We happened to plan trips.)
  *   **Jury:** Yes. (We convicted.)

  **The "We" Voice Trap:**
  Since you are writing in a "We" voice, you have a unique opportunity. The "We" voice *itself* creates a collective mind.
  *   If the group acts with **Interdependence**, the voice feels truthful and strong.
  *   If the group acts with **Coincidence**, but the voice says "We," the narrator feels **oppressive or delusional**.

  If your narrator says "We decided to go to war" when actually it was a vote where 51% overruled 49%, the "We" is a political lie. If they say "We walked north" when they were strangers, the "We" is a poetic longing for connection.

  **Summary of changes to your draft:**
  1.  **Improv:** Keep as "We." (Shared commitment to the frame).
  2.  **Surprise Trip:** Keep as "I's." (Retrospective meshing doesn't count).
  3.  **Flash Mob:** Treat as "I's" *unless* they interact. If you want it to be a "We," write the eye contact and the syncing.
  4.  **Principle:** Use the **Stop-Test (Fragility)**. If the action survives the individual quitting, it's not a "We."
