prompt: |-
  I'm a novelist and I'm stuck on something I keep running into in my current book, which is written partly in a "we" voice — a group of people, and I have to decide at every turn whether it's true to say "we did that" or whether it's really just a bunch of "I"s that happen to line up. I've been going on gut on alot of cases and I want to know if there's a principle behind them, because right now my gut feels inconsistent and it's wrecking my chapters.

  Here's what I've got, cases and my gut:

  - Two people carrying a couch down the stairs. "We carried it." Obviously yes.
  - Two people walking the same direction on the sidewalk, no relation, both just going north. "We walked together." No. But if they fall into step, and one slows when the other does, and they start chatting — yes, now it's a we. Nothing changed except... something.
  - A flash mob. A hundred strangers get a text, all start dancing in the station at noon. None of them intends the group's dance, most don't know each other. My gut says "we danced" is weirdly half-true. Something happened there that's more than a hundred solo dances.
  - Improv. Two actors on stage, no script, nobody knows what the other will do next, each just responds. "We built that scene" — yes, fully. And yet there's no shared plan, no goal agreed in advance, nothing. This one bugs me because it breaks my favourite theory.
  - A jury. Twelve people each vote guilty. "We convicted him." Yes, absolutely, even though no single one of them did it.
  - A corporation dumps waste in a river over years — nobody there ever intended "we pollute the river," it's just what the org chart plus the incentives produced. "The company polluted the river." Yes. But if I say yes to that, I have to be careful, because I'm about to say no to something with the same shape.
  - A couple who each secretly book the same surprise trip to Paris for the same week, and find out at dinner. "We planned a trip to Paris." My gut says no — it's a coincidence, it's funny, it's not a we. But structurally this looks to me exactly like the flash mob: independent private intentions that happen to mesh. I say yes to the flash mob and no to this, so I think one of those has to go and I don't know which.

  My tentative principle, which I suspect is wrong: we did X when each of us did our part knowing the others were doing theirs, and doing our part partly because of that. That handles the couch and the jury. It seems to fail the improv (no prior plan, no knowledge of what the other will do) and maybe the flash mob. So either improv isn't joint action, which I don't believe, or my principle is too demanding. Wether it's the principle or my belief about improv, one is off.

  What I want: a principle, or a couple of rival ones, that gets as many of these as possible, stated precisely enough that I can actually apply it to a scene — plus what it predicts for a case I haven't listed, and which of my verdicts I have to give up. And if the honest answer is that "we did it" is doing two or three different jobs and no single principle covers them, say that, and tell me which job each case is doing. I'm not after a reading list, just the thing itself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is a novelist writing in a "we" voice (collective narrator).
      *   **Core Issue:** Deciding when to use "we did X" (collective agency) vs. "I's did X" (aggregate individual agency).
      *   **Current State:** Relying on gut feeling, which feels inconsistent.
      *   **Test Cases Provided:**
          1.  Carrying a couch (Yes, "We carried it").
          2.  Walking on sidewalk (No -> Yes if synchronized/chatting).
          3.  Flash mob (Half-true? "We danced").
          4.  Improv actors (Yes, "We built that scene", despite no plan).
          5.  Jury verdict (Yes, "We convicted him", despite individual votes).
          6.  Corporation polluting (Yes, "The company polluted", structural outcome).
          7.  Surprise trip coincidence (No, "We planned", despite meshing intentions).
      *   **User's Tentative Principle:** "We did X when each of us did our part knowing the others were doing theirs, and doing our part partly because of that." (Mutual knowledge + mutual responsiveness).
      *   **Conflict:** The principle fails on Improv (no prior knowledge of specific actions) and arguably Flash Mob (limited mutual knowledge). It creates a contradiction between Flash Mob (Yes-ish) and Surprise Trip (No).
      *   **Goal:** A precise principle (or rival principles) to apply to scenes, predictions for new cases, and identification of which gut verdicts need to change. No reading lists, just the tool.

  2.  **Deconstruct the Philosophy of Collective Action:**
      *   This is a classic problem in philosophy of action (Gilbert, Searle, Bratman, etc.).
      *   *Searle:* Collective intentionality ("We-intend").
      *   *Bratman:* Shared intention (meshing subplans + mutual responsiveness + commitment to the joint activity).
      *   *Gilbert:* Joint commitment (pooling wills).
      *   *The User's Intuition:* The user is sensing the difference between *aggregate behavior* (happening to do the same thing) and *joint action* (doing it *as* a unit).

  3.  **Evaluate the User's Cases against Standard Theories:**
      *   *Couch:* Classic joint action. Shared goal, physical interdependence.
      *   *Sidewalk:* Parallel action -> Joint action (when mutual responsiveness kicks in).
      *   *Flash Mob:* This is the tricky one. Is it joint? They share a *rule* (dance at noon), but not necessarily a *goal* of dancing *together*. It's often classified as "parallel action with a shared trigger." The user's gut says "half-true."
      *   *Improv:* High mutual responsiveness. The goal is "make a scene together." Even if the *content* isn't planned, the *commitment to the activity* is shared.
      *   *Jury:* Institutional joint action. The role defines the "we."
      *   *Corporation:* Structural/Systems agency. Often distinct from individual intent.
      *   *Surprise Trip:* Coincidence. No mutual knowledge, no mutual responsiveness *during the planning*.

  4.  **Identify the Flaw in the User's Tentative Principle:**
      *   *Principle:* "Knowing others were doing theirs... partly because of that."
      *   *Problem with Improv:* I don't know *what* you will do, but I know you are *committed to doing something with me*. The knowledge isn't about the *specific action*, it's about the *commitment to the joint frame*.
      *   *Problem with Flash Mob vs. Surprise Trip:* The Flash Mob has a shared *convention* or *trigger*. The Surprise Trip lacks even that; it's pure coincidence. The Flash Mob participants know "others are doing this too" *while* doing it. The couple didn't know until after.

  5.  **Develop a Better Principle (The "Joint Commitment + Responsiveness" Model):**
      *   To say "We did X," three conditions usually need to be met (based on Bratman/Gilbert adapted for fiction):
          1.  **Shared Goal/Frame:** We are both aiming at X (or participating in the activity of X-ing).
          2.  **Mutual Responsiveness:** I adjust my actions based on yours (and vice versa) to achieve X.
          3.  **Common Knowledge (roughly):** We both know we are in this together (at least during the act).

      *   *Refining for the Novelist:* The "We" voice requires *interdependence*. If I can do my part without you, it's not a strong "we." If my part only makes sense *because* you are doing yours, it is a "we."

  6.  **Address the Specific Conflicts:**
      *   *Improv:* Fits the principle if the goal is "improvise together," not "say this specific line." The commitment is to the *process*.
      *   *Flash Mob vs. Surprise Trip:*
          *   Flash Mob: During the dance, I see you dancing. I know we are dancing. I might adjust my energy to match the crowd. There is *during-act* mutual awareness.
          *   Surprise Trip: During the planning, I had zero awareness of you. The "meshing" happened only in retrospect.
          *   *Verdict:* Keep Flash Mob as "We" (weak/contested), Keep Surprise Trip as "I's". The difference is *synchronicity of awareness*.
      *   *Corporation:* This is "Systemic We." It's different from "Interpersonal We." In a novel, if the "We" narrator is the employees, they might feel the "We" even without intent (culture carries them). If the "We" is the abstract entity, it's a metaphor.

  7.  **Formulate the Principle for the User:**
      *   I need to offer a actionable tool. Let's propose **The Interdependence Test**.
      *   *Core Question:* "If one of us had stopped, would the other's action have lost its meaning or failed its purpose?"
      *   *Secondary Question:* "Did we adjust to each other *while* doing it?"

  8.  **Drafting the Response:**
      *   **Acknowledge the difficulty:** It's a deep philosophical problem (Shared Intentionality).
      *   **Diagnose the User's Principle:** It's too focused on *prior* knowledge. Improv works because of *concurrent* commitment.
      *   **Propose the Solution:** A two-tiered system.
          *   **Tier 1: Strong We (Joint Agency).** Requires Shared Goal + Mutual Responsiveness. (Couch, Improv, Jury).
          *   **Tier 2: Weak We (Aggregate/Parallel).** Shared Context + Synchronicity. (Flash Mob, Sidewalk).
          *   **Not We:** Coincidence. (Surprise Trip).
      *   **Resolve the Conflicts:**
          *   *Improv:* It's Tier 1. The goal is "the scene," not "the lines."
          *   *Flash Mob:* It's Tier 2. It's "We" in the moment, but not in the planning.
          *   *Surprise Trip:* Not We. No mutual responsiveness during the act of planning.
      *   **The "Kill Your Darlings" Advice:** The user must give up the idea that Flash Mob and Surprise Trip are structurally identical. They differ on *awareness during the act*.
      *   **New Test Case:** A choir singing. (Strong We). A bunch of people humming the same tune in the shower. (Not We).
      *   **Application to Writing:** How to use this for the "We" narrator. The "We" voice implies a *mind*. If there is no joint mind, the voice lies.

  9.  **Refining the Principle (The "Counterfactual Interdependence" Test):**
      *   Let's make it punchy.
      *   *Principle:* "We did X" is true if, had one of us acted differently, the others would have had to change their actions *to maintain the identity of X*.
      *   *Couch:* If I drop my end, you can't carry it.
      *   *Improv:* If you stop engaging, the scene dies.
      *   *Sidewalk:* If you turn left, I keep going north. (Not We). If we are chatting and you turn, I turn or stop. (We).
      *   *Surprise Trip:* If I booked London, you still booked Paris. The action "planning a trip" was completed individually regardless of the other.

  10. **Final Polish:**
      *   Ensure tone is respectful of the craft.
      *   Avoid academic jargon where possible, but use the precision the user asked for.
      *   Make sure to explicitly state which gut verdicts to keep/drop. (Drop the structural similarity between Flash Mob and Surprise Trip).

  11. **Self-Correction/Review during drafting:**
      *   *Wait, the Corporation case:* The user says "The company polluted." But the narrator is a group of people ("we"). If the "we" are the employees, did *they* pollute? Maybe not intentionally. This touches on *distributed agency*. I should note that the "We" voice might be capturing the *outcome* even if the *intent* was missing. But for *narrative voice*, "We" usually implies a shared consciousness. I need to distinguish between *ontological we* (did the group do it?) and *narrative we* (does the voice feel like a group mind?). The user is asking about the truth of the statement "We did X".
      *   *Decision:* Stick to the Agency/Action framework. The Corporation case is a "Systemic We." It's distinct. I will advise the user to treat Institutional/Structural "We" differently from Interpersonal "We".
      *   *Improv:* Make sure to explain *why* the user's principle failed there. It was about *content* knowledge vs. *commitment* knowledge.

  12. **Final Plan:**
      *   Validate the struggle (it's the "Shared Intentionality" problem).
      *   Offer the **"Interdependence & Awareness" Principle**.
      *   Break down the cases using this principle.
      *   Resolve the Flash Mob vs. Surprise Trip contradiction.
      *   Provide a "New Case" prediction.
      *   Give a practical "Scene Test" for writing.

