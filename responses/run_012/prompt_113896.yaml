answer: |-
  **Exam Question**

  Consider Marco, who holds a stable, deterministic preference cycle: Tea ≻ Coffee, Coffee ≻ Water, Water ≻ Tea. He is fully informed, remembers everything, and cares only about his final holding, not the process of trading. A cafe owner exploits this over three separate visits, charging a small fee per swap. Marco ends with his original drink and less money. Friend A claims this proves Marco is irrational and must maximize Expected Utility (EU) to avoid exploitation. Friend B claims it proves nothing, as Marco never faces a single choice where the full cycle is offered as a package.

  Answer the following in a unified essay:
  1.  Identify precisely which axiom(s) of the von Neumann-Morgenstern representation theorem Marco violates and which he satisfies.
  2.  Explain what dynamic assumption the money pump requires beyond the preference cycle itself. Does a sophisticated agent (who anticipates future trades) escape the pump, or merely force the exploiter to redesign it?
  3.  Contrast Marco with an agent who satisfies Transitivity and Completeness but violates Independence (Allais-style). Is she pumpable in the same way? What does the coherence argument establish about her rationality if not exploitability?
  4.  Conclude on the normative force of coherence arguments: does vulnerability to exploitation constitute irrationality, or merely pragmatic vulnerability?

  ***

  **Model Answer**

  Marco's case targets the structural foundations of rational choice theory, specifically the link between static consistency and dynamic vulnerability. To evaluate the friends' claims, we must dissect the axioms, the dynamic context, and the comparative case of Independence violations.

  First, regarding the von Neumann-Morgenstern (vNM) axioms, Marco clearly violates **Transitivity**. A rational preference relation must be ordered such that if $A \succ B$ and $B \succ C$, then $A \succ C$. Marco's cycle ($T \succ C \succ W \succ T$) contradicts this. However, he likely satisfies **Completeness** (he has a definite ranking for each pair) and **Continuity** (the margins are small but definite). **Independence** is less relevant here as the choices are certain outcomes, not lotteries, but structurally, his failure is ordinal. Thus, the money pump directly targets Transitivity, not the probabilistic axioms required for EU maximization over risk. The pump shows that without Transitivity, one cannot assign a consistent utility function to outcomes.

  Second, the money pump relies on a crucial dynamic assumption: **Myopia**. For Marco to be pumped over separate visits, he must treat each trade as an isolated event, ignoring the sequence's cumulative cost. If Marco is **sophisticated**, he uses backward induction. At the final visit, he knows swapping Water for Tea costs money and returns him to the start; he refuses. Anticipating this, he refuses the second swap, and consequently the first. Sophistication blocks the pump without restoring Transitivity to his underlying preferences; it merely aligns his *choices* with a transitive revealed preference (e.g., keeping Water). This defeats the specific pump but suggests Marco must adopt **resolute choice** or constrain his future agency to avoid exploitation. It does not force him to be an EU maximizer, only to act *as if* his preferences were transitive in dynamic contexts.

  Third, consider the Allais-style agent. She satisfies Transitivity and Completeness but violates **Independence**. Because her preferences are transitive, she cannot be money-pumped via a simple preference cycle; there is no $A \succ B \succ C \succ A$ loop to exploit. She is not pumpable in Marco's sense. However, she still fails the vNM representation theorem. The coherence argument here establishes that she violates the Sure-Thing Principle, implying her choices cannot be represented as maximizing expected utility with stable probabilities. While less pragmatically devastating than a money pump, it suggests her sensitivity to irrelevant contextual frames (common consequences) undermines the normative claim that rationality requires invariant valuation of prospects across different risk profiles.

  Finally, the normative upshot. Vulnerability to exploitation demonstrates **pragmatic inconsistency**, not necessarily structural irrationality. Marco loses money, which is instrumentally defective. However, Friend B is partially correct: if the choices are genuinely separate, Marco's local choices are consistent with his local preferences. The normative force of coherence arguments rests on the premise that rational agents must care about global consistency across time and contexts. If one accepts that rationality requires immunity to sure losses, then Marco is irrational. If one views rationality as merely local optimization given current constraints, he is not. Ultimately, coherence arguments show that violating axioms like Transitivity makes one vulnerable to external manipulation, providing a pragmatic justification for EU norms, but they do not prove that non-EU agents are logically incoherent in a static sense.

  ***

  **Marking Scheme (25 Marks Total)**

  1.  **Axiom Identification (5 marks):** Must identify **Transitivity** as the violated axiom and note that Completeness/Continuity are likely satisfied.
      *   *Common Mistake:* Claiming Marco violates Independence or Completeness instead of Transitivity.
  2.  **Dynamic Assumptions (5 marks):** Must identify **Myopia** (treating trades as isolated) as the necessary condition for the pump to succeed.
      *   *Common Mistake:* Assuming the pump works automatically given the cycle, ignoring the temporal separation of visits.
  3.  **Sophistication Reply (5 marks):** Must explain that a **sophisticated agent** blocks the pump via backward induction/resoluteness, forcing choices to align transitively even if preferences do not.
      *   *Common Mistake:* Claiming sophistication restores transitive *preferences* rather than constraining *choices*.
  4.  **Allais Comparison (5 marks):** Must state the Allais agent is **not pumpable via cycles** (due to Transitivity) but still violates **Independence**, showing coherence arguments target different defects.
      *   *Common Mistake:* Arguing Allais agents are money-pumpable in the same way as cyclic agents.
  5.  **Normative Conclusion (5 marks):** Must distinguish between **pragmatic vulnerability** (losing money) and **structural irrationality**, noting coherence arguments rely on the norm of global consistency.
      *   *Common Mistake:* Concluding definitively that exploitability equals irrationality without qualifying the normative premise.
