prompt: |-
  You're a decision theorist, so put on that hat and help me write one question for the final of my grad seminar on rational choice. The unit is coherence arguments for expected utility maximization, and I'm sick of answers that just recite "Dutch book" and "money pump" and call it a day.

  Build the question around this case, which I made up, so nothing in the literature answers it off the shelf. Marco has a stable, fully deterministic preference cycle over three drinks: tea over coffee, coffee over water, water over tea, each by a small margin. He's fully informed, never forgets, never changes his mind, and has no preferences at all about trades or sequences of trades — only about which drink he ends up holding. A cafe owner on his street runs him through the cycle over three seperate visits, one swap each, taking a small fee every time; Marco ends up back where he started, with water and less money. Marco's friend says this proves he's irrational and that any non-EU-maximizer is exploitable, so the fix is simply to be an EU-maximizer. Marco's other friend says it proves nothing, because Marco is never offered a single choice in which the package deal beats standing pat.

  I want the question to force students to (i) say precisely which axioms of the standard representation theorem the pump actually reaches and which it leaves alone, (ii) say what the pump needs to assume about the agent beyond the cycle itself, and whether the foresighted/sophisticated-agent reply defeats the pump or merely forces the exploiter to redesign it, (iii) run the same analysis for an agent who satisfies transitivity and completeness but violates independence in an Allais-style pattern — is she pumpable, and if not, what does the coherence argument really establish about her, and (iv) say what the whole thing shows normatively, if anything. No citations or reading lists in the question — they can't look anything up.

  Give me the question, a model answer of about 650 words, and a marking scheme of five must-hit points worth 5 marks each (25 total), each with a one-line note on the mistake that typically costs students the marks. Think it through carefully before drafting: brainstorm the crux in a few lines first, then write.
