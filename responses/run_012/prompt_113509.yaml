          5.  The Residue Report (Answering the "Why" and "Is it a hole").

      *   *Refining the Humean Sim Metaphor:* It's not just compression. It's that the *only* thing that exists is the rendered frame buffer history. The code is just a post-hoc zip file.
      *   *Refining the Non-Humean Sim Metaphor:* The code is a physical object in memory that exerts force on the data.
      *   *The "Programmer's Eye":* This is the crucial insight. The user assumes a "Meta-Time." Humeanism denies Meta-Time.
      *   *The "Hole":* The distinction between "Syntax" (the rule) and "Execution" (the reality). In physics, is there execution? Or just syntax?

  7.  **Final Polish:** Check against constraints.
