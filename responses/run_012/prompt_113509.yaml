answer: |-
  Here is the translation of the debate into your stack, followed by the residue report you asked for.

  ### The Vocabulary Mapping

  Let's establish the shared context.
  *   **The Mosaic:** The full trajectory log ($S_0, S_1, ... S_N$). Every position, velocity, and flag at every tick.
  *   **The Rule:** The function `Update(S_t) -> S_{t+1}`.
  *   **The Engine:** The hardware/VM executing the function.

  #### Side 1: The Humean (Best System Analysis)
  **Translation:** The "Law" is a compression algorithm.
  In this view, the only thing that actually exists in memory is the **Trajectory Log**. The log is just a giant array of structs. There is no `Update` function running in the background. There is no Engine stepping through time.

  The "Laws of Nature" are simply the source code of the shortest program that, when run, reproduces the Log exactly. We (the observers inside the sim) look at the Log, notice patterns (e.g., "momentum looks conserved"), and write a compressor that encodes those patterns.
  *   **Ontology:** Only the Log exists.
  *   **Laws:** Lossless compression schemes we invent to describe the Log.
  *   **Causation:** Just correlation in the array indices. $S_t$ doesn't *make* $S_{t+1}$ happen; they are just adjacent entries in the array that happen to fit the compression scheme.

  #### Side 2: The Non-Humean (Necessitarian / Dispositionalist)
  **Translation:** The "Law" is the Executable.
  In this view, the Trajectory Log is a side effect. The primary reality is the **Rule** and the **Engine**. The Rule exists *before* the simulation runs. It has "causal power"—it is the active agent that forces the state vector to change from $S_t$ to $S_{t+1}$.

  Furthermore, the entities in the state vector have "dispositions." A `RigidBody` struct isn't just data; it has an intrinsic property (a vtable pointer, effectively) that dictates how it *must* respond to the `Update` function.
  *   **Ontology:** The Rule and the Dispositions exist independently of the Log.
  *   **Laws:** The actual code in memory that governs state transitions.
  *   **Causation:** The execution of the `Update` function. It *makes* the next state happen.

  ---

  ### Where the Mapping Goes Crooked

  **1. The Meta-Time Problem**
  In your engine, there is "Sim Time" (the $t$ in $S_t$) and "Wall Time" (the time it takes your CPU to calculate the step).
  *   **Side 2** fits your workflow perfectly because you stand in Wall Time, writing code that runs in Sim Time. The Rule is prior to the Log.
  *   **Side 1** breaks this. It claims there is no Wall Time. There is only the completed Log. The "running" of the simulation is an illusion. The universe isn't a process; it's a static block of data (a "block universe"). Your vocabulary assumes a *process* (step forward, integrate), but Humeanism describes a *structure*.

  **2. The "Runner" Distinction**
  In your job, there is a distinction between the **Code** (text file), the **Binary** (executable), and the **CPU** (hardware).
  *   **Side 2** conflates Code and CPU. The Law is both the instruction and the force that executes it.
  *   **Side 1** says there is no CPU. There is only the output.
  *   **The Crook:** In your experience, code without a CPU does nothing. In Humean metaphysics, "doing" is the wrong category. The pattern *is* the reality.

  ---

  ### The Residue Report

  You asked: *In a simulation the rule genuinely is separate from and prior to the trajectory it generates, so my whole vocabulary seems to make side two the default... is that because side two is right, or because the programmer's-eye view is smuggled into how I'm talking?*

  **1. Why Side 2 Feels Default**
  It is because you are smuggling in the **Programmer**.
  In your model, the Rule exists because *you* wrote it and loaded it into memory before pressing Play. You are an external agent with ontological priority over the simulation.
  Side 2 (Non-Humeanism) implicitly assumes a "Cosmic Programmer" (or Platonic realm) where the Laws reside before the Universe begins.
  Side 1 (Humeanism) assumes there is no Programmer and no "Before." There is just the data.

  Your vocabulary makes Side 2 default because **simulation implies a simulator.** If you treat the universe as a simulation, you have already begged the question in favor of Side 2. To model Side 1, you have to delete the concept of "execution."

  **2. Can Side 1 be stated in your terms?**
  Yes, but you have to change what you consider "real."
  Imagine you ship a game, but you don't ship the executable. You only ship the **Replay File** (the full input log or state log).
  *   **Side 2 says:** "The game mechanics exist. They caused this replay."
  *   **Side 1 says:** "The replay is all we have. The 'mechanics' are just a description we derive by analyzing the replay. If we find a shorter set of inputs that generates the same video, that's the 'law'."

  In your terms, Side 1 is the claim that **the universe is a replay file without an engine.** The "laws" are just the codec we use to watch it.

  **3. What Won't Translate: The "Governing" Relation**
  There is a specific concept in Side 2 that refuses to map cleanly: **Nomic Necessity.**
  In your engine, `Velocity += Acceleration * dt` is syntax. It doesn't *force* anything. The CPU forces it.
  *   If you ask a Non-Humean, "What makes the electron obey Maxwell's equations?" they say, "It is the nature of the electron."
  *   If you ask a Humean, "What makes the electron obey Maxwell's equations?" they say, "Nothing. It just does. Regularity is brute fact."

  In your vocabulary, you can simulate the *regularity*, but you cannot simulate the *necessity*. You can make a rule that *always* runs, but you can't make a rule that *must* run without appealing to a higher-level rule (the CPU architecture).
  **This is the residue:** The distinction between **Syntax** (the rule text) and **Execution** (the rule happening).
  *   **Side 2** claims the Universe has built-in Execution.
  *   **Side 1** claims the Universe is just Syntax.

  **4. Is this a hole in your framework or a fuzzy philosophical distinction?**
  It is a **category error in your framework**, but a genuine **ontological dispute** in philosophy.

  *   **The Framework Hole:** Your "State Vector + Update Rule" model presupposes **Process Philosophy**. It assumes reality is a verb (happening). Humeanism is **Substance/Block Philosophy**. It assumes reality is a noun (a thing that exists). You cannot express "static block" naturally in "step-forward" vocabulary without treating the "step" as an illusion.
  *   **The Philosophical Distinction:** The distinction between "Rule" and "What runs the Rule" is not fuzzy; it is the core of the debate.
      *   If there is no "What runs the Rule" (no God, no Platonic realm, no Meta-Time), then Side 1 wins by default. The Rule is just a description of the data.
      *   If there *is* a "What runs the Rule" (physical necessity, dispositions), then Side 2 wins.

  **The Verdict:**
  Your intuition that Side 2 is default is correct *relative to your job*. In game dev, the Code is always prior to the Log.
  However, to translate Side 1 faithfully, you must imagine a **headless simulation**. A log that exists without ever having been computed.
  *   **Side 2:** The Log exists *because* the Rule ran.
  *   **Side 1:** The Rule is true *because* the Log exists.

  If you can conceive of a trajectory log that is "true" without ever having been "generated," you have successfully modeled Humeanism. If that concept crashes your mental compiler (Error: Null Reference Exception on 'Cause'), that is not a hole in your logic; it is the exact friction point the philosophers are fighting over. They are arguing over whether the universe is a **movie file** (Side 1) or a **game engine running in real-time** (Side 2). You build engines, so naturally, you bet on the latter.
