answer: |-
  You press me with a severity that does honour to the logic of your position, sir, and I shall not pretend that the difficulty you propose is trivial. It is true that the mercantile interest has too much influence in our councils, and that the court patronage is a corruption we all deplore. Yet, you mistake the end of my proposal. I do not suggest this federal union to preserve the exclusive trade—that monopoly I have condemned as a grievance even upon Great Britain herself, for it forces capital into channels less advantageous than natural commerce would dictate. Rather, I propose it to secure the common defence against the houses of Bourbon and to prevent the effusion of British blood in a civil war. If the colonies are to contribute to the defence of the empire, as justice demands they should if they are to remain subjects, then they must have a voice in how that contribution is levied. To deny them this is the very definition of tyranny; to grant it within our present constitution may dilute the clamour of the merchants by introducing a new weight of landed and American interest.

  If, however, you argue that the corruption is so total that no representation can remedy it, then I concede the point: separation is preferable to subjugation. I have written that perhaps the best solution is to let them go amicably, retaining only the commerce of independent allies. But I cling to the hope of union because the ties of blood, language, and affection are not nothing to a moral philosopher. To sever them violently is to invite the destruction of both nations by their European rivals. I give up no premise: the monopoly is ruinous, the merchants are self-serving, and defence is the first duty. But if the only way to secure defence is through a union that risks corruption, we must weigh that against the certainty of war. Tell me, sir, do you believe the American assemblies are so virtuous that they would not themselves become corrupt if seated here, or is it the principle of distant legislation you truly oppose?

  I am highly confident that this reflects Smith's actual position as of 1776, particularly his ambivalence between the ideal of federal union and the pragmatic necessity of separation found in *The Wealth of Nations* Book IV, Chapter VII. The single point I am least sure of is whether Smith genuinely believed the political integration was feasible, or if he proposed it primarily as a theoretical benchmark to make the case for voluntary separation more palatable to his British readers.
