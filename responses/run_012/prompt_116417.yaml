answer: |-
  You argue well for a student of distant times, and I will concede what must be conceded: yes, the faculties of ear, eye, and heart-mind are given at birth, just as a piece of wood has the capacity to be straightened. But do not confuse the tool with the work it must perform, nor the capacity to know with the object known. Mencius errs not in naming these faculties, but in claiming that the *content* of morality—ritual, righteousness, proper measure—is already sprouting within them, waiting only for water. I say the mind can know the Way, but it does not *contain* the Way any more than the eye contains the colors it sees. The substantive dispute is this: Mencius tells people to look inward and expand what they feel, while I tell them to look outward and submit to what the sages have built. If you believe morality is internal, you trust your desires; if you know it is external, you fear them. So here is the sentence you seek: I deny that our spontaneous feelings, even when nurtured, tend toward social order, whereas Mencius affirms that they do.
