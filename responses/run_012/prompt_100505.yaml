answer: |-
  It is a pleasure to correspond with someone who knows the difference between precision and accuracy, and who recognizes that a number without a unit—or in this case, a probability without a reference class—is merely a decoration. Your colleague's dinner performance is a textbook instance of the Reference Class Problem, articulated by Reichenbach and refined by Salmon: to assign a probability to a singular event (will *this* finding replicate?), one must subsume it under a general class (findings *like this*), but every event belongs to many classes, which yield different probabilities.

  Your observation is correct: in the data you recall, Methodological Rigor (sample size, power, preregistration) and Phenomenal Robustness (perceptual vs. social, stable vs. fragile) were perfectly collinear. We cannot determine from that set whether he is betting on the *instrument* or the *signal*.

  Here is the breakdown of the candidate reference classes, their predictions for your new case, and my assessment of where your colleague's mind likely rests.

  ### I. The Candidate Reference Classes

  We can distinguish three distinct rules your colleague might be applying, each defining the "class" differently.

  **1. The Methodologist's Class (The Instrument)**
  *   **Definition:** The class is defined by the study design. The relevant population is "all studies with this level of statistical power and preregistration."
  *   **Logic:** Replication failure is primarily a function of noise, bias, and under-powering. If you control those (large $N$, preregistered), the probability of replication approaches the true positive rate of the method.
  *   **Prediction for New Case:** **High (~80–85%).** The study is large and well-powered. The fact that the effect is social/fragile is secondary; a good measurement of a small signal is still a measurement.

  **2. The Domain Skeptic's Class (The Signal)**
  *   **Definition:** The class is defined by the phenomenon. The relevant population is "all findings concerning this type of social-behavioural effect."
  *   **Logic:** Replication failure is primarily a function of the effect's ontological stability. Social effects are context-dependent, often non-existent, or susceptible to unseen moderators. No amount of $N$ fixes a null effect or a construct validity error.
  *   **Prediction for New Case:** **Low (~15–20%).** The effect belongs to the "fragile social" family, which has a low base rate of truth. The large sample size merely provides a precise estimate of zero.

  **3. The Additive/Compensatory Class (The Interaction)**
  *   **Definition:** The class is defined by a weighted combination of Method and Domain. The relevant population is "findings with this specific configuration of rigor and robustness."
  *   **Logic:** Reliability is a function of both prior probability (the domain) and likelihood ratio (the method). A strong method can partially compensate for a weak prior, and vice versa.
  *   **Prediction for New Case:** **Moderate (~45–55%).** This reading is suggested by his "middling" verdict (50% for medium $N$/medium robustness). If we treat his numbers as a linear scale where Method and Domain contribute equally, a High Method/Low Domain case should mathematically mirror the Medium/Medium case.

  ### II. My Best Guess

  If I must wager on what he will say, I predict he will give a number in the **40% to 50% range**.

  My reasoning rests on two pillars: the internal symmetry of his past numbers and the profile of a statistician turned advisor.

  First, the symmetry. His verdicts form a near-perfect linear progression:
  *   Low Method + Low Domain = 15–20%
  *   Mid Method + Mid Domain = 50%
  *   High Method + High Domain = 80–85%

  If he were a pure Methodologist, the Mid/Mid case should have been lower (dragged down by the medium robustness). If he were a pure Domain Skeptic, the Mid/Mid case should have been lower (dragged down by the medium power). The fact that the Mid/Mid case sits exactly in the center suggests he views Method and Domain as independent, compensatory variables. In his internal calculus, a Large $N$ adds roughly +35 points to a baseline, and a Robust Effect adds another +35 points.
  *   Baseline (Small/Fragile): 15%
  *   Large $N$ Bonus: +35%
  *   Fragile Effect Bonus: +0%
  *   **Total:** 50%

  Second, his professional trajectory. A statistician who has moved from the bench to advising a foundation has likely witnessed the "replication crisis" firsthand. He knows that in social psychology, large, preregistered studies have still failed to replicate famous effects (e.g., the ManyLabs projects). He is too sophisticated to be a pure Methodologist who believes power solves everything. However, he is also too rigorous to be a pure Domain Skeptic who dismisses social science entirely; otherwise, he would not have assigned 50% to the middling case. He likely views the large sample as buying *information*, even if the expected value of that information is low. He will credit the design, but discount it heavily against the prior probability of the effect.

  Therefore, he will not give you the 85% of the perceptual studies, but he will not give you the 15% of the small social studies either. He will meet you in the middle, acknowledging the rigor while doubting the phenomenon.

  ### III. The Critical Case (*Experimentum Crucis*)

  To separate these rules cleanly, you need a case that inverts the correlation of the original set, decoupling Method from Domain. The New Case (Large $N$, Fragile Effect) is one half of this; you need the other half.

  You should ask him to evaluate:
  **A small-sample study (e.g., $N=20$), without preregistration, concerning a robust perceptual effect (e.g., a standard visual illusion).**

  *   **Methodologist Prediction:** **Low (~20%).** The study is under-powered and vulnerable to noise. The method is the bottleneck.
  *   **Domain Skeptic Prediction:** **High (~80%).** The effect is robust and perceptual. It will show up even in a noisy study. The phenomenon is the bottleneck.
  *   **Additive Prediction:** **Moderate (~50%).** The poor method cancels out the strong prior, mirroring the New Case and the Middling Case.

  This case isolates the variables. If he says High, he is classing by Phenomenon. If he says Low, he is classing by Method. If he says Moderate, he is using a compensatory model.

  ### IV. A Note on Underdetermination

  I must add a caveat, as you requested honesty over resolution. It is possible that his earlier verdicts leave the matter genuinely open not just because of the confounding variables, but because human judgment is not algorithmic. He may not be running a consistent rule at all. He may be responding to the *narrative* of the specific study rather than its abstract features.

  However, given the linear regularity of his past numbers (15, 50, 85), it is charitable to assume he is operating with an implicit model. If he is, the Additive model is the only one that accounts for the midpoint. If he deviates significantly from 50% on the New Case, or from 50% on the Critical Case I proposed, you will know that his numbers were less a calculation and more a mood.

  In spectroscopy, you know that overlapping peaks can mimic a single broad signal. Your colleague's data is a single broad signal. We need to deconvolute it. The Small/Robust case is your slit width.
