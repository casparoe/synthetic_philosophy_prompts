answer: |-
  # Teaching Plan: Sphexishness (90 Minutes)

  ## 1. Sequence of Components and Rationale

  You must introduce the components in this specific order to prevent the concept from collapsing into determinism or vague insult.

  1.  **The Perturbation Test (Behavioral Phenomenology)**
      *   **Why first:** You cannot identify a system as *sphexish* by observing successful behavior alone. Success is compatible with both intelligence and luck. You must first establish that the label applies only when a system fails to adapt to a specific class of environmental changes that it *ought* to handle given its apparent goals.
      *   **Goal:** Establish that sphexishness is diagnosed by *failure under perturbation*, not by the presence of a script.

  2.  **The Architectural Explanation (Mechanism)**
      *   **Why second:** Once the behavior is identified, you must explain *why* it happened. This distinguishes sphexishness from mere incompetence. The cause must be a disconnect between the system's *representation of the goal* and its *feedback loops*.
      *   **Goal:** Define sphexishness as a structural property (open-loop vs. closed-loop control) rather than a performance metric.

  3.  **The Level-of-Description Constraint (The Regress)**
      *   **Why third:** Only after they have a working detector can you challenge the detector. If you introduce the regress problem ("what checks the checker?") too early, they will never accept the initial diagnosis. Now you ask: Is the mechanism itself sphexish at a higher level?
      *   **Goal:** Show that sphexishness is relative to a level of abstraction. Everything is sphexish at the physics level; nothing is sphexish at the evolutionary level. The concept only bites at the *architectural* level.

  4.  **The Free Will Distinction (Application)**
      *   **Why last:** You can only argue the link to free will after proving sphexishness is not identical to determinism. If they believe sphexishness = determinism, the free will discussion is dead on arrival.
      *   **Goal:** Decouple *causal determination* (physics) from *adaptive capacity* (control architecture).

  ## 2. The Carrying Example

  **The Load-Bearing Case:** A **Reinforcement Learning (RL) Navigation Agent** in a dynamic grid world.
  **The Role of the Wasp:** Use the wasp *only* for the first 5 minutes as an etymological hook and intuition pump. It illustrates the *uncanny valley* of behavior (looks like care, is actually reflex). Discard it immediately after because biological intent is ambiguous. The RL agent is superior because its "goals" and "policies" are explicit.

  **What the Example Must Have:**
  *   **A Clear Objective Function:** The agent is rewarded for reaching a target (e.g., "pick up package").
  *   **A Fixed Policy:** The agent has learned a specific route or set of rules to achieve this.
  *   **A Perturbation Scenario:** The environment changes in a way that preserves the *possibility* of the goal but breaks the *script*.
      *   *Scenario:* The agent learns to navigate around a wall to reach the goal. You move the wall two feet to the left.
      *   *Sphexish Failure:* The agent walks into the wall repeatedly, executing the "turn right at coordinate X" script, rather than re-mapping.
      *   *Flexible Success:* The agent detects the collision, updates its map, and finds a new path.

  **What the Example Must Lack:**
  *   **Ambiguous Intent:** Unlike the wasp, we know exactly what the agent is optimizing. This prevents the "maybe it had a different goal" defense.
  *   **Physical Determinism Confusion:** The code runs on hardware that is fully determined. This forces the distinction between "determined physics" and "rigid logic."

  **Addressing the Level-of-Description Issue:**
  Use the RL agent to demonstrate the "zoom" problem.
  *   *Zoom In (Code Level):* The agent is just executing `if/then` statements. It looks purely sphexish.
  *   *Zoom Out (Learning Level):* The agent has a meta-algorithm that updates weights based on failure. It looks flexible.
  *   *The Point:* Sphexishness is not a property of the *stuff* (silicon/neurons); it is a property of the *control loop*. The session must anchor at the **Architectural Level**: Does the system have a feedback mechanism that allows it to correct errors *relative to its stated goal*?

  ## 3. Misconceptions and Interventions

  **Misconception 1: "This is just Determinism."**
  *   **When it surfaces:** Immediately after the Architectural Explanation (Minute 30). Philosophers will argue that if the code is fixed, the behavior is determined, so "sphexish" is redundant.
  *   **Intervention:** Draw a diagram of two systems. System A is a rock rolling down a hill (determined, no goal). System B is a thermostat (determined, has a goal, has feedback). System C is a broken thermostat (determined, has a goal, no feedback).
  *   **Correction:** "Determinism describes the *causal history*. Sphexishness describes the *control architecture*. A system can be fully determined and highly flexible (System B). Sphexishness is the absence of error-correction, not the absence of freedom from physics."

  **Misconception 2: "Make it Measurable." (The Engineer's Objection)**
  *   **When it surfaces:** During the Perturbation Test (Minute 20). The engineer will ask for a "sphex-index" or a threshold for how many failures count as rigid.
  *   **Intervention:** Acknowledge the demand but reframe the metric.
  *   **Correction:** "Do not measure *performance*; measure *topology*. A system is sphexish if the loop is open, not if it fails often. A flexible system can fail 100 times while learning. A sphexish system fails 100 times doing the *same* thing. The metric is not error rate; it is *variance in response to error*."

  **Misconception 3: "It's an Unfalsifiable Put-Down."**
  *   **When it surfaces:** During the Level-of-Description/Regress section (Minute 60). If we can always zoom in to find a script, isn't everything sphexish?
  *   **Intervention:** Force a commitment to a specific level of analysis before the session begins.
  *   **Correction:** "The claim is not 'everything is sphexish at some level.' The claim is 'at the level of *agency* we are discussing, this system lacks a specific feedback mechanism.' If you accuse a human of being sphexish, you must specify: Are they rigid in their habits? Their reasoning? Their biology? Without specifying the level, the term is indeed empty. With the level specified, it is a structural critique."

  ## 4. Closing Task

  **The "Substitution Test"**
  Do not ask them to define sphexishness. Give them a case and ask them to design the perturbation.

  **The Prompt:**
  > "Consider a Large Language Model (LLM) engaged in a debate. It argues persuasively, cites sources, and adjusts its tone to the opponent.
  >
  > **Task:** Propose a specific change to the input context that would reveal the system is *sphexish* rather than *flexible*.
  >
  > *Constraint:* You cannot simply say 'turn it off.' You must propose a change where a human debater would adapt to maintain the *goal* of the debate, but the model would fail to maintain the goal despite having the *capacity* to do so."

  **What to look for in their answers:**
  *   **Bad Answer:** "Ask it a question it wasn't trained on." (This tests training distribution, not rigidity).
  *   **Bad Answer:** "It's deterministic code." (This fails the level constraint).
  *   **Good Answer:** "Introduce a rule change mid-debate (e.g., 'No more citations'). If the model continues citing because its reward function weights 'citation density' higher than 'adhering to new constraints,' it is sphexish."
  *   **Why this works:** It forces them to distinguish between *complexity* (sounding smart) and *flexibility* (updating policy to match intent).

  ## 5. What to Decline to Settle

  **The Question of Human Sphexishness**
  *   **What to say:** "We have defined the tool. I am not going to use this session to determine whether *humans* are sphexish. That requires empirical psychology and neuroscience we do not have here."
  *   **How to frame it:** "If you leave thinking 'Humans are sphexish,' you have missed the point. If you leave thinking 'Humans are never sphexish,' you have also missed the point. The point is that you now have a vocabulary to ask: *At what level of my own decision-making is my feedback loop open?* That is a diagnostic tool, not a verdict."

  **The Ultimate Free Will Verdict**
  *   **What to say:** "Sphexishness is a constraint on *agency*, not a proof of *determinism*. We are not solving the compatibility problem today."
  *   **How to frame it:** "You can be a libertarian free-will believer and still act sphexishly (habit). You can be a hard determinist and act flexibly (complex feedback). Do not let this concept do the work of your metaphysics."
