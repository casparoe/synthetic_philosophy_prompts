answer: |-
  **Project Title:** The Opacity of the Probe: Distinguishing Conceptual Variation from Pragmatic Interpretation in Cross-Cultural Epistemology

  **Project Summary**
  This project investigates a foundational assumption in experimental philosophy (X-Phi): that survey instruments used in cross-cultural intuition studies transparently measure participants' underlying concepts (e.g., KNOWLEDGE, INTENTION). Early 2000s studies suggested significant East-West divergence in knowledge attribution (Gettier cases), sparking a debate between "universalists" (who attribute variance to noise) and "variationists" (who attribute it to distinct concepts). Both sides, however, treat the survey instrument as a neutral window. I argue this is a category error. The variance may reflect not different *concepts*, but different *pragmatic interpretations* of the probe (e.g., interpreting "Does he know?" as "Is he blameworthy?" or "What would the committee rule?"). Over eight weeks, I will produce a taxonomy of these interpretive confounds, design a discrimination protocol to separate conceptual variance from probe-reading variance, and run a small-scale feasibility pilot on campus bilinguals. This is a philosophical project because it concerns the evidential validity of intuitions, not merely the cognitive mechanisms producing them.

  **Research Question**
  Does the observed variance in cross-cultural epistemic intuition studies reflect genuine divergence in folk concepts, or does it reflect systematic variation in how the survey probe is pragmatically interpreted? Furthermore, is this distinction empirically decidable with current methodological tools?

  **Significance and Philosophical Stake**
  If the variation is conceptual, it challenges the universality of epistemic norms. If the variation is pragmatic (a "probe-reading artifact"), the data may tell us nothing about epistemology, but rather about conversational norms or risk-assessment strategies. Currently, this instrument-validity question is treated as a methodological footnote. I argue it is the primary philosophical problem.

  Why is this philosophy and not psychology? Psychologists seek to model the cognitive mechanism generating the response. Philosophers seek to know if that response warrants normative conclusions about knowledge. If the instrument is opaque, the intuition is evidentially inert. A philosopher must determine *what* is being measured before a psychologist models *how* it is measured.

  **Methodology and Work Plan (8 Weeks)**

  *Weeks 1-3: Conceptual Taxonomy and Literature Synthesis*
  I will catalog the implicit assumptions in the universalist/variationist debate. The core output here is a taxonomy of "Probe Interpretations."
  *   *Category A (Semantic):* The participant is accessing the truth-conditions of 'knows'.
  *   *Category B (Pragmatic/Normative):* The participant is assessing blame, assertibility, or institutional approval.
  *   *Category C (Linguistic):* The variance is driven by translation non-equivalence (e.g., 'know' vs. 'recognize').
  I will map existing studies onto this taxonomy to show where the "Instrument Transparency Assumption" fails.

  *Weeks 4-6: Designing the Discrimination Protocol*
  I will evaluate three proposed methods for distinguishing these categories and select the most viable for future large-scale study.
  1.  **Wording Shifts:** If changing the probe from "Does he know?" to "Is he certain?" shifts responses more than changing the population, the effect is probe-sensitive, not concept-sensitive.
  2.  **Bilingual Switching:** Testing bilinguals in Language A vs. Language B. If the "cultural" effect flips with the language, it is linguistic/pragmatic, not deep conceptual.
  3.  **Within-Group Variance:** If within-country variance on probe-reading is as high as between-country variance, the "cultural concept" claim is undermined.
  *Decision:* I will argue that **Bilingual Switching** is the only decisive test for this specific problem. Wording shifts can be dismissed as changing the subject; within-group variance is hard to interpret without baseline data. Bilingual switching isolates the linguistic/pragmatic frame while holding the subject constant.
  *Design:* I will draft a pre-registered protocol for a bilingual study using Gettier-style vignettes, counterbalanced for language order, with added "comprehension check" questions designed to detect if the participant is tracking truth-conditions or normative status.

  *Weeks 7-8: Feasibility Pilot and Reporting*
  I will recruit ~40 bilingual students on campus (convenience sample) to test the protocol.
  *   *Goal:* Not to settle the debate, but to test if the "probe-reading" manipulation works. Can I induce a shift in attribution simply by framing the question pragmatically vs. semantically?
  *   *Deliverable:* A final report containing the Taxonomy, the Pre-registered Design, Pilot Data, and a "Failure Analysis" (see below).

  **Risk Assessment and Failure Conditions**
  I am explicitly budgeting time for the possibility that this project fails to distinguish the two variables.
  1.  **The Collapse Scenario:** It may be that "how one reads the probe" is constitutive of the concept. If my concept of KNOWLEDGE includes norms about when it is appropriate to attribute it, then pragmatic variation *is* conceptual variation. If the pilot suggests this, I will argue that the X-Phi literature is talking past itself, using "concept" to mean both psychological representation and normative usage.
  2.  **The Underdetermination Scenario:** It may be that no survey design can separate these factors because any new probe introduces new pragmatic baggage. If so, the deliverable will be a proof of this impossibility, arguing for a shift away from survey-based intuition pumping.
  3.  **Scope Limit:** I will *not* attempt to replicate the original cross-cultural studies. I lack the time and demographic reach. I will *not* claim to resolve the universalist/variationist debate. I claim only to show that the debate is currently ill-posed.

  **Budget Justification**
  *   **Participant Compensation:** $1,000 (approx. 100 participants for pilot/feasibility testing at standard rates).
  *   **Software/Platform:** $200 (Qualtrics or similar license for advanced randomization).
  *   **Stipend:** $800 (Summer living support to allow full-time focus).
  *   **Total:** $2,000.

  **Deliverables**
  1.  A working paper: "The Instrument Transparency Assumption in Experimental Epistemology."
  2.  A pre-registered study design for a definitive bilingual discrimination test.
  3.  A dataset from the campus bilingual pilot (open access).

  ***

  **Note on Confidence and Empirical Claims**

  *Confidence Level:* Moderate.
  My confidence in the *philosophical* argument (that the instrument transparency assumption is unjustified) is high. However, my confidence in the *empirical* landscape is constrained by the nature of my training data. The claim that early 2000s cross-cultural studies showed robust divergence is based on the prominent literature (e.g., Weinberg, Nichols, Stich), but I am aware that many of these findings have faced replication crises or attenuation in later, larger studies (e.g., the Many Labs projects or specific X-Phi replications). I am assuming for the sake of this proposal that *some* variance exists worth explaining, even if the effect size is smaller than originally claimed.

  *The Weakest Point:*
  The point I would bet on least is the **decisiveness of the Bilingual Switching test**. I propose this as the "gold standard" for separating language/pragmatics from concepts. However, it rests on the assumption that a bilingual speaker accesses the same underlying cognitive state regardless of language, merely swapping the linguistic label. If language actually modulates the conceptual access itself (a strong Sapir-Whorf hypothesis version), then switching language *is* switching concepts, and my test fails to distinguish between "probe reading" and "conceptual variation." I acknowledge this in the risk section, but the entire methodology leans heavily on the idea that language is a vehicle for concepts rather than a constituent of them. If that assumption is false, the distinction I'm trying to draw collapses.
