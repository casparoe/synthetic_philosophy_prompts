          5.  Determine if the analogy is doing the work or if the argument stands on its own.
          6.  Address specific genetic phenomena: reading frames, overlapping genes, codon redundancy.
          7.  Provide a verdict on the friend's conclusion.
          8.  Specify what would change my mind (falsifiability).
