prompt: |-
  I run a weekly reading group, small room, mix of philosophy grad students and two engineers. Everyone in there can do Bayes' rule in their sleep, but none of them has ever read anything on imprecise probabilities, and honestly none of them has thought much about decision rules under uncertainty either. Next month it's my turn to run the session: 75 minutes, whiteboard, no slides. Don't explain the topic to me, plan how I should explain it.

  What has to land first for the rest of it to even be statable, and what depends on what? Pick the one example that carries the whole thing and tell me what it has to have and what it must not have. I assume everyone reaches for the Ellsberg urn, so if that's your pick say why it survives the trip, and if it isn't, say exactly what it gets wrong for this room. Then the misconceptions: I'd bet money someone says "isn't this just a probability distribution over probabilities," and I need to know where in the sequence I head that off before it sets, plus the two or three others I should expect and the precise point in the arc where each one gets dealt with. Tell me the one thing I should announce out loud that I'm refusing to explain at this level. And give me a single closing question to put to the room that would actually show me whether the idea landed or whether they just nodded along.

  Give me definite choices with your reasons, not a menu of options you leave me to sort out. American English, please.
