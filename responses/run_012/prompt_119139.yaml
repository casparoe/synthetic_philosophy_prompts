answer: |-
  Here is the plan for your 75-minute session.

  ### 1. The First Thing to Land
  **The Distinction Between Risk and Ambiguity.**
  Before you write a single formula, you must establish that "uncertainty" is not a monolith. Your audience knows Bayes' rule, which means they are comfortable modeling uncertainty as a probability distribution. You have to break that equivalence first.
  *   **Why:** If they believe all uncertainty can be captured by a precise prior (even a vague one), imprecise probabilities (IP) look like unnecessary clutter. They need to accept that there is a qualitative difference between a known coin flip (Risk) and an opaque urn (Ambiguity) that cannot be resolved by simply choosing a "wider" distribution.
  *   **How:** Do not start with definitions. Start with behavior. Ask them if they would bet on a known 50/50 coin versus an opaque coin where the bias is fixed but unknown. When they hesitate on the opaque one, label that hesitation. That hesitation is the object you are studying.

  ### 2. The Example: The Ellsberg Urn
  **Pick:** Yes, use the Ellsberg Urn.
  **Why it survives:** For a room of philosophers and engineers, Ellsberg is the minimal counterexample to Savage's Sure Thing Principle. It is discrete, axiomatic, and requires no domain knowledge (unlike climate or finance models). It isolates the variable you care about (ambiguity) while holding the payoffs constant.
  **What it must have:** A direct comparison between Urn A (50 Red, 50 Black) and Urn B (100 balls, Red/Black mix unknown). You must offer them a choice of bets that reveals a preference for Urn A in both directions (betting on Red *and* betting on Black), which violates additive probability.
  **What it must not have:** **Any generative story about how Urn B was filled.** Do not say "someone filled it randomly" or "we haven't looked inside yet." If you imply a stochastic process generated the composition, the engineers will immediately model that process with a hyperprior. The composition must be presented as *fixed but undefined* relative to the agent. The opacity must be structural, not informational.

  ### 3. The Sequence and Misconceptions
  You have 75 minutes. Here is the arc and where you kill the misconceptions.

  **0:00–0:20: The Violation (Ellsberg Setup)**
  Draw the urns. Elicit preferences. Show that preferring Urn A for both bets violates the law of total probability ($P(Red) + P(Black) = 1$).
  *   **Misconception 1: "Isn't this just a probability distribution over probabilities?"**
      *   **When:** This will arise immediately after you draw Urn B, likely around minute 10. Someone will say, "Just put a Uniform(0,1) prior on the proportion of Red balls."
      *   **The Move:** Stop the whiteboard. Do not let this pass. Tell them: "If you integrate over that Uniform prior, you get a precise 50% marginal probability. That collapses Urn B back into Urn A. But you just told me you prefer Urn A. Your math just contradicted your intuition."
      *   **Reason:** You must sever the link between IP and Hierarchical Bayes early. IP is not a second-order distribution; it is a set of measures that refuses to integrate.

  **0:20–0:45: The Representation (Sets of Priors)**
  Formalize the intuition. Instead of $P(A) = 0.5$, write $\mathcal{P} = \{P : P(Red) \in [0, 1]\}$. Show how this set preserves the ambiguity rather than averaging it away.
  *   **Misconception 2: "This is just ignorance / missing data."**
      *   **When:** Around minute 35, when discussing why the set is so wide.
      *   **The Move:** Clarify that IP is not a temporary state waiting for data. It is a valid permanent model for situations where the data generating process is not well-defined. Ignorance implies a true value exists and we just don't know it; IP allows for the possibility that "the true probability" is not a coherent concept for this event.

  **0:45–1:05: Decision Rules (Maximin)**
  Explain how to act. If you have a set of probabilities, you cannot maximize expected utility. Introduce **Maximin Expected Utility** (choose the act with the best worst-case expectation).
  *   **Misconception 3: "This is just Robust Bayes / Sensitivity Analysis."**
      *   **When:** Around minute 55. Engineers will view this as checking corner cases.
      *   **The Move:** Distinguish *sensitivity* (how much does my output change if I tweak my input?) from *indeterminacy* (the input is fundamentally a set). Sensitivity analysis assumes a true model exists and we are testing stability. IP assumes the model itself is the object of uncertainty.

  **1:05–1:15: Discussion and Closing**
  Open floor for challenges, then land the plane.

  ### 4. The Refusal
  **Announce this at minute 20, right after you block the Hyperprior move:**
  "I am refusing to explain **updating rules** today."
  *   **Reason:** Bayesian updating for sets of probabilities (Generalized Bayes, Dempster-Shafer, etc.) is a technical quagmire involving dilation and washing out. It will suck the air out of the room and distract from the conceptual shift. Tell them: "We are learning how to represent the state and make a decision. How that set shrinks or shifts with new evidence is a different war."

  ### 5. The Closing Question
  Do not ask for a summary. Ask a question that forces them to choose between the Bayesian ontology and the IP ontology.

  **Put this on the whiteboard:**
  > "If you assign $P(Heads) \in [0.4, 0.6]$, does this mean you believe the true chance of Heads is somewhere inside that interval, or does it mean you believe there *is* no single true chance?"

  *   **Why this works:** If they say "the true chance is in there," they haven't understood IP; they are still thinking in terms of a hidden parameter (Bayesian). If they say "there is no single true chance" (or "the model refuses to commit"), the idea has landed. It tests whether they accept indeterminacy or just see IP as a confidence interval for a precise value.
