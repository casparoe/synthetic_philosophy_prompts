answer: |-
  You have reconstructed **Fitch's Paradox of Knowability**. It is one of the most formidable challenges to verificationism (and epistemic theories of truth) in contemporary philosophy. You are not missing a simple logical slip; you have encountered a structural tension between **Classical Logic**, **Epistemic Modesty** (there are unknown truths), and **Verificationism** (all truths are knowable).

  To answer your core question: **The leak is not in the epistemic principles (1) or (2), nor strictly in (3). The leak is in the Classical Logic used to derive (9) from the contradiction.**

  However, since you asked specifically about saving (3) via restriction and the costs involved, I will break down the three main repair strategies, their costs, and answer your specific technical questions.

  ### 1. The Intuitionistic Repair (Saving Verificationism)
  **The Move:** Reject Classical Logic in favor of Intuitionistic Logic.
  **The Cost:** You must abandon the Law of Excluded Middle and Classical quantifier equivalences for statements about truth.

  This is the standard response favored by Michael Dummett and other semantic anti-realists. Here is why it works:
  In Classical Logic, the statement "There are no unknown truths" ($\neg \exists p (p \land \neg Kp)$) is equivalent to "All truths are known" ($\forall p (p \to Kp)$).
  In Intuitionistic Logic, **this equivalence fails.**

  If you adopt Intuitionistic Logic, Fitch's argument still proves $\neg \exists p (p \land \neg Kp)$. But this does **not** entail (9) "Every truth is known." It merely entails "It is absurd to claim there is an unknown truth."
  *   **Does this save (3)?** Yes. You can keep the Knowability Principle ($p \to \Diamond Kp$).
  *   **Does this avoid Realism?** Yes. It prevents the collapse into Omniscience without forcing you to admit "truths that outrun verification." It redefines truth such that asserting "there is an unknown truth" is itself a claim to knowledge you cannot possess.
  *   **The Real Cost:** You lose the ability to say "Either $p$ is known or it isn't" for arbitrary $p$. Truth becomes inherently linked to our capacity to recognize it. This is a heavy metaphysical and logical price, but it is the price of admission for the anti-realist view you want to hold.

  ### 2. The Restriction Repair (Saving Classical Logic)
  **The Move:** Restrict the domain of (3) so it does not apply to the specific conjunction used in the paradox.
  **The Cost:** Verificationism no longer defines *truth simpliciter*, but only a subset of truths.

  You asked if (3) can be restricted on a **principled basis** rather than ad hoc amputation. There are two main candidates:

  **A. The "Cartesian" Restriction**
  Restrict (3) to propositions where knowing them is logically consistent (i.e., $\Diamond Kp$ is not self-contradictory).
  *   **Principle:** A proposition is truth-apt only if it is "Cartesian" (compatible with being known).
  *   **Problem:** This looks circular. How do we know if a proposition is Cartesian without checking if $\Diamond Kp$ holds? If the test for being a truth is "it is possible to know it," you haven't really restricted the principle; you've just defined truth as "knowable propositions," which leaves the paradox biting at the boundary of what counts as a proposition.

  **B. The "Decidability" Restriction (More Promising)**
  Restrict (3) to **basic** or **decidable** propositions. The Fitch conjunction ($p \land \neg Kp$) is inherently **undecidable**. To verify it, you must verify $p$ (making it known) and verify $\neg Kp$ (making it unknown), which is impossible.
  *   **Principle:** Verificationism only applies to statements for which a decision procedure exists. Complex statements involving epistemic operators about the totality of knowledge are not legitimate truth-bearers.
  *   **Does it do the Anti-Realist work?** It does, but it shrinks the domain of truth. You would have to say that the hair-count claim in (4) is not a "truth" in the verificationist sense unless there is a method to count them.
  *   **The Cost:** You concede to the Realist that there are "facts" (like the hair count) that exist but are not "truths" (because they are not verifiable). You avoid Omniscience, but you accept a form of Realism about the "unknowable facts" even if you deny them the title of "truth."

  ### 3. The Epistemic Repair (Rejecting 1 or 2)
  **The Move:** Deny Factivity (1) or Distribution (2).
  **The Cost:** Crippling the concept of knowledge.

  *   **Rejecting (1) Factivity:** If verification doesn't guarantee truth, you aren't a verificationist about *truth*; you're a pragmatist about *warrant*. This abandons your core project.
  *   **Rejecting (2) Distribution:** Some suggest that knowing a conjunction doesn't imply knowing the conjuncts *simultaneously* or *under the same description*. However, in modal logic, $K(A \land B) \to KA$ is very hard to deny without making knowledge irrational. If you verify the whole, you have verified the parts. Denying this makes inquiry unintelligible.

  ### Addressing Your Specific Questions

  **1. Does it matter whether the knower in (6) is the same person?**
  No. The quantifier "someone" in (3) is inside the possibility operator ($\Diamond \exists x Kx...$). The paradox holds even if the knower in the possible world is different from anyone in the actual world. The contradiction arises within the *possible world* where the knowledge occurs. In that world, the agent knows the conjunction, therefore knows the second conjunct ("no one knows p"), which entails in that world that no one knows p, including the agent.

  **2. Does it matter if I read the second conjunct as "not-known-now" or "never-known"?**
  It strengthens the paradox to use "never-known," but it is not strictly necessary.
  *   **"Not known now":** Leads to the conclusion that there are no *currently* unknown truths (which implies omniscience now).
  *   **"Never known":** Leads to the conclusion that there are no *ever* unknown truths.
  The logical structure is identical. The "never" version is often preferred because it blocks the reply "Well, maybe they will know it later." If the proposition is "p is true but will *never* be known," and someone comes to know it, the proposition becomes false. But if they know it, it must be true (Factivity). Contradiction.

  **3. Where does the real cost lie?**
  The real cost lies in **abandoning Classical Logic**.

  If you keep Classical Logic, you are forced to choose between:
  1.  **Omniscience (9):** (Absurd)
  2.  **Realism (Reject 3):** Admitting truths that are in principle unknowable. (This is what you want to avoid).
  3.  **Restricting Truth (Restrict 3):** Admitting that some meaningful statements (like the Fitch conjunction) are neither true nor false.

  If you adopt **Intuitionistic Logic**, you can keep (3) and avoid (9).
  *   **Why this is the best fit for you:** You stated you are a "mild verificationist" trying to avoid Realism. Intuitionism *is* the logic of verificationism. In Intuitionism, $p \to \Diamond Kp$ is plausible, and $\neg \exists p (p \land \neg Kp)$ is provable, but $\forall p (p \to Kp)$ does *not* follow.
  *   **The Trade-off:** You must accept that the statement "There are unknown truths" (Premise 4) cannot be asserted. Not because it is false, but because it is **unwarranted**. You cannot verify that there are unknown truths.

  ### Recommendation
  Do not amputate (3) ad hoc. That makes verificationism look like a desperate dodge.
  Instead, **embrace the Intuitionistic consequence.**
  Tell your friend: "I accept the derivation up to the point where it claims all truths *are* known. I deny that step. I maintain that it is *incoherent to assert* that there are unknown truths, without claiming that all truths are actually known."

  This preserves your Verificationism (3), avoids Realism (by denying the coherence of unknowable truths), and avoids Omniscience (9) by changing the logic of truth. The cost is that you can no longer use Classical Logic to describe the relationship between truth and knowledge, but for a verificationist, that is a feature, not a bug.
