      *   *Structure:*
          1.  Audit of the Organism Analogy (Mapping & Breakdown).
          2.  Hidden Imports (Teleology, Holism, Normativity).
          3.  The Ecological Succession Rival (Mechanism & Predictions).
          4.  Cyclical Theories (Polybius/Khaldun placement).
          5.  Final Verdict.

      *(Self-Correction during drafting)*: Make sure I explicitly answer the "naturalness of death" point. The user asked if "naturalness is being smuggled in as a reason to accept it." Yes, the Is-Ought problem.
      *(Refining the Succession Analogy)*: Ensure I explain *hysteresis*. It explains why "restoring trust" is hard (you can't just put the soil back, you need a fire to clear the brush).
      *(Refining Polybius/Khaldun)*: Polybius allows for a "mixed constitution" to stop the cycle. That's a crucial distinction from Spengler. Khaldun is generational, which looks biological but is actually sociological learning.

  7.  **Final Polish:** Check against all constraints. No reading lists. Argue from concepts. Ensure the distinction between "picturesque" and "bearing" disanalogies is clear. (e.g., "No blood" is picturesque; "No fixed genome" is bearing).

