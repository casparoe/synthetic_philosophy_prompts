prompt: |-
  I sit on my district's instructional-materials committee — the body that actually votes on which textbooks the high schools buy — and in three weeks we vote on a new US history text the curriculum office is pushing, a big glossy thing with "unfinished" in the title. I have to circulate a written opinion to the other six members before the meeting, so this is a real ask and not a thought experiment. The facts in the book look fine to me. What bothers me is the shape of it. Every chapter goes from some injustice to some partial remedy, and every chapter closes with a two-page photo spread called "Where This Led" that ties the chapter forward to something in the present — the Reconstruction chapter ends by leaping straight to 1965, the Pullman chapter ends at a modern labor board ruling. Read cover to cover it's a staircase, and every step is higher than the one below it. Our retired archivist keeps calling it whig history and wants us to reject the book outright. I think he's about half right, and the half he's wrong about is the half that decides what I recommend.

  My hang-up is this: the book never says it had to turn out this way. There's no sentence anywhere claiming the outcome was inevitable, or that the winners were right. It just only ever shows you the things that did lead somewhere. The archivist's test is to cover the last page of a chapter and ask whether you'd know what the people in it thought was going to happen next, and the honest answer is no, you'd only know what did happen. I don't have a name for that — hindsight by selection rather than hindsight by verdict — and I'm not sure it's the same fault as the one the archivist is accusing the book of, or a milder one, or a worse one because it's invisible. Meanwhile a friend of mine who teaches history says the alternative to a progress frame is a declinist frame, which is just as teleological with the sign flipped, and one of our members is argueing we should approve the book as is because a district like ours (about 60% students of color, and the last adoption cycle nearly blew up over a text that treated slavery as a regional disagreement) needs the progress story more than it needs historiographical purity. He might be right about the politics and I still have to put my name on a recommendation.

  So please draft the memo I'll circulate. I need a bottom line — adopt, adopt with conditions, or reject — with a time frame that works for a three-week vote, and if it's conditions, spell them out concretely enough that the curriculum office can act on them (they've told me the teacher's edition is already at the printer, so anything requiring new page layouts is basically a no). Do the taxonomy work inside the memo: say precisely what's wrong with the book's shape, whether that's the whig-history complaint or something adjacent to it, and what a declinist frame would and wouldn't fix. Give the archivist's rejection case its strongest form before you say why I'm not going all the way there. No bibliography please — two members will actually read this and neither of them wants footnotes.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a district instructional-materials committee (IMC).
      *   **Task:** Draft a written opinion memo to circulate to the other six members before a vote in three weeks.
      *   **Subject:** A new US History textbook (glossy, "unfinished" in title).
      *   **The Issue:** The book's narrative structure ("shape"). It moves from injustice to partial remedy in every chapter, ending with a "Where This Led" section connecting to the present (e.g., Reconstruction -> 1965). It creates a "staircase" of progress.
      *   **The Conflict:**
          *   *The Archivist:* Calls it "Whig history" (inevitable progress), wants outright rejection.
          *   *The Teacher Friend:* Argues the alternative is "declinist" (also teleological), and the district (60% students of color, previous controversy over slavery) *needs* the progress story for political/pedagogical stability.
          *   *The User (Me):* Thinks the Archivist is half-right. The book doesn't claim *inevitability*, but it uses *selection bias* (hindsight by selection). It hides the contingency. Needs to decide on a recommendation (Adopt, Adopt with Conditions, Reject).
      *   **Constraints:**
          *   Bottom line required (Adopt/Conditions/Reject).
          *   Time frame: 3 weeks.
          *   Conditions must be concrete/actionable (Teacher's Edition already at printer, no new page layouts).
          *   Taxonomy work: Define the specific historiographical fault (Whig vs. Selection Bias vs. Declinist).
          *   Give the Archivist's case its due before refuting/modifying it.
          *   No bibliography/footnotes.
          *   Tone: Professional, persuasive, nuanced, committee-appropriate.

  2.  **Determine the Recommendation:**
      *   *Reject:* Too risky politically (given the district demographics and previous controversy). The Archivist's purity might undermine the goal of engaging students of color with a narrative that validates struggle and achievement.
      *   *Adopt As Is:* Ignores the valid historiographical concern. Leaves teachers without tools to address the "invisible" bias.
      *   *Adopt with Conditions:* This is the sweet spot. It acknowledges the Archivist's concern (validating his expertise) but accepts the Teacher Friend's political reality (validating the community need).
      *   *Conditions:* Since page layouts can't change, conditions must focus on *teacher support* and *supplemental materials*. The Teacher's Edition (TE) is at the printer, but can notes be added? Can professional development be mandated? Can a supplemental packet be created?
      *   *Decision:* **Adopt with Conditions.** Specifically, mandatory professional development on historiography and supplemental "contingency" case studies that don't fit the staircase model.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the bottom line immediately. (Committee members are busy).
      *   **The Historiographical Problem (Taxonomy):**
          *   Address the Archivist's "Whig History" claim.
          *   Refine it: It's not *inevitability* (Whig), it's *survivorship bias* (Selection). The book shows winners, not losers. It's "Hindsight by Selection."
          *   Address the "Declinist" counter-argument. Flipping the sign doesn't fix the teleology. Both remove agency/contingency.
      *   **The Political/Pedagogical Reality:**
          *   Acknowledge the district context (60% students of color).
          *   Acknowledge the previous adoption cycle trauma (slavery as regional disagreement).
          *   Validate the need for a narrative of agency and progress, *but* note the risk of simplifying struggle.
      *   **The Recommendation (Conditions):**
          *   Since pages can't change, focus on the *Teacher's Edition* (marginalia/notes) and *PD*.
          *   Condition 1: TE Annotations. Teachers need prompts to ask "What else was happening?"
          *   Condition 2: Supplemental Case Studies. Specific examples where progress stalled or reversed (not in the book).
          *   Condition 3: Professional Development. Train teachers on the "Staircase vs. Maze" concept.
      *   **Closing:** Reiterate the goal (rigor + relevance).

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Hindsight by Selection" a real term?
      *   *Fix:* The prompt says "I don't have a name for that." I should coin a phrase or describe it clearly without pretending it's standard jargon. Let's call it "Retrospective Selection Bias" or stick to the user's "Hindsight by Selection" but define it sharply. Let's use the user's phrase but formalize it.
      *   *Critique:* Can we really change the Teacher's Edition if it's at the printer?
      *   *Fix:* The prompt says "Teacher's edition is already at the printer, so anything requiring new page layouts is basically a no." Digital overlays or an addendum packet is safer. Or instructions to the curriculum office to issue a "Corrigenda/Addendum" document. Let's go with a "Curriculum Addendum" and PD. That's actionable in 3 weeks.
      *   *Tone Check:* Ensure I don't sound like I'm overruling the Archivist disrespectfully, but rather synthesizing his concern with the practical reality.
      *   *District Context:* Make sure the sensitivity regarding the previous adoption cycle (slavery controversy) is handled carefully. It supports the "Adopt" side but requires the "Conditions" to ensure accuracy isn't sacrificed for comfort.

  5.  **Final Polish:**
      *   Check constraints: No footnotes. Concrete conditions. 3-week timeline.
      *   Ensure the "Bottom Line" is clear.
      *   Make sure the distinction between Whig (inevitability) and Selection (omission of dead ends) is clear.

  6.  **Writing the Memo:** (Proceeding to generate output based on these thoughts.)
      *   *Subject:* Recommendation on US History Instructional Material Adoption.
      *   *Structure:* Executive Summary -> Historiographical Analysis -> District Context -> Conditions -> Conclusion.
      *   *Key Phrase:* "Hindsight by Selection."
      *   *Action:* Curriculum Office to produce a "Contingency Packet."

  7.  **Final Review against constraints:**
      *   Bottom line? Yes (Adopt with Conditions).
      *   Time frame? Yes (Conditions met before school year/PD days).
      *   Concrete conditions? Yes (Addendum, PD).
      *   Taxonomy work? Yes (Whig vs. Selection vs. Declinist).
      *   Archivist's case honored? Yes.
      *   No bibliography? Yes.

  *(Self-Correction on "Printer" constraint)*: If the TE is at the printer, I can't ask them to change the TE. I must ask for a *separate* document or digital resource. I will specify a "Supplemental Historiography Guide" distributed digitally or as a handout.

  *(Refining the "Declinist" point)*: Make sure to explain why the teacher friend's argument is partially right but insufficient. A decline narrative is also deterministic. We need *contingency*.

  *(Final Polish on Tone)*: Keep it collegial but firm. This is a vote memo.

