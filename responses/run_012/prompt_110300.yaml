          *   *Fix:* Redefine "sincere" or admit self-deception involves a split in belief (avowal vs. disposition).

      *   **Clash D: Claim 3 (Norm) vs. Verdict (Tense/Simultaneity).**
          *   Claim 3 says it's a norm violation.
