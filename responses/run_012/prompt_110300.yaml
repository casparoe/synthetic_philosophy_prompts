      *   *Refining the "Single Change":*
          *   If the user changes Claim 3 to cover *judgment/thought* as well as assertion, does it fix Claim 4? Yes.
          *   If the user changes Claim 2 to allow self-deception, does it fix Claim 5? Yes.
          *   Which is more central to Moore's Paradox? The Thought/Assertion gap (3 vs 4) is the classic philosophical hurdle. The Self-Deception one (2 vs 5) is more about philosophy of mind/language interface.
          *   *Wait, looking closer at Claim 1 & 6:* If belief is dispositions (1), and I access belief via truth (6), how do I explain Moore? Moore is "P & I don't believe P". If I judge P is true (via 6), I thereby believe P (via 1+6 link). So asserting "I don't believe P" contradicts the act of asserting P.
          *   *Actually, the Claim 3 vs 4 tension is the most dangerous for a seminar on Moore.* If you concede it's just an assertion norm, the professor will ask "What about occurrent thought?" If you say "Oh, that's weird too," you've undermined your own theory.
          *   *The Claim 2 vs 5 tension is semantic.* You can fix it by distinguishing "avowal" from "dispositional belief."

      *   *Decision:* The Claim 3 vs 4 tension is the highest damage. The Claim 2 vs 5 tension is the second highest. The Claim 1 vs 6 tension is manageable.

