  7.  **Final Polish:** Ensure the distinction between "sincere assertion" and "self-deception" is handled sharply. If I self-deceive, do I believe? Dispositionalism usually says "No, I don't believe, I just act like I do." But Claim 2 says sincere assertion = asserting what you believe. So if I self-deceive, am I sincere? Claim 5 says yes. Contradiction.
