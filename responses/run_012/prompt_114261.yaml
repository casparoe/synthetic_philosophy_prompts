      *   *Claim 6 (Footnote/Disagreement):* This refers to Harsanyi's moral philosophy (preference utilitarianism + rationality). The claim that shared info eliminates value disagreement is Harsanyi's "rationalist ethics," but it's highly controversial and not a theorem.
