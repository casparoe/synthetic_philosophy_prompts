answer: |-
  Dear Colleague, your skepticism is well-founded, and it is good that you are probing this before the reading group solidifies these distinctions into dogma. The trade book you are reading is performing a very common sleight of hand, one that conflates a mathematical representation theorem with a substantive ethical argument, and then treats the ethical premises as if they were mathematical corollaries. To give you the map you need to navigate this, we have to disentangle three distinct layers: the formal mathematics of the Aggregation Theorem itself, the ethical assumptions required to move from that theorem to utilitarianism, and the meta-ethical claims about rationality that Harsanyi bundled with the technical results but which do not follow from them.

  Let us begin with the core claim that Harsanyi proved a rational society must be utilitarian. The sentence a social choice theorist would sign off on is that if individual preferences and social preferences both satisfy the von Neumann-Morgenstern axioms for expected utility, and if the social planner respects the Weak Pareto principle (meaning if everyone prefers state A to state B, society prefers A to B), then the social welfare function must be a linear combination of individual utilities. This is the actual Aggregation Theorem from his 1955 paper. However, the book's claim that this sums to utilitarianism is where the first extra premise is smuggled in. The theorem yields a weighted sum, not necessarily an unweighted one. Mathematically, the social utility function is the sum of individual utilities multiplied by positive constants. For this to be utilitarianism in the standard sense, those weights must be equal. The Aggregation Theorem itself does not dictate equal weights; it allows for a social planner who satisfies all the axioms but prioritizes the utility of person one over person two. To get equal weights, you need an additional ethical axiom, usually Anonymity or Impartiality, which states that the identity of the individuals should not matter. The book presents this as if it falls out of the veil of ignorance argument, but that is a conflation of Harsanyi's 1955 Aggregation Theorem with his 1953 Impartial Observer Theorem. In the Impartial Observer argument, Harsanyi posits that an ethical observer imagines they have an equal chance of being anyone in society. If that observer maximizes expected utility, they will maximize the average utility. But this equal chance is not a mathematical necessity derived from the axioms of rationality; it is a substantive moral postulate about how we model impartiality. So, when the text says the weights come out equal because of the equal chance, it is correct that this yields average utilitarianism, but it is wrong to imply this is a result of the Aggregation Theorem alone. The money changes hands here: you pay for equal weights with an ethical premise about impartiality, not with the logic of aggregation.

  This conflation leads directly to the book's handling of Arrow's impossibility theorem. The claim that Arrow's problem evaporates once utilities are cardinal is partially correct but misleadingly strong. Arrow's theorem assumes ordinal, non-comparable utilities. If you enrich the informational basis to allow for cardinal and interpersonally comparable utilities, you do escape Arrow's impossibility result. However, the book's assertion that the social welfare function is uniquely pinned down as the utilitarian sum is false. Cardinal comparability allows for a whole class of social welfare functions, including prioritarianism (which weights gains to the worse off more heavily) or sufficientarianism. To get unique utilitarianism, you need the specific structure of the von Neumann-Morgenstern independence axiom applied to social choices under risk. Without that specific risk structure, cardinality alone does not force the linear sum. Furthermore, the move from a total sum to an average, as the book describes, is trivial in a fixed population but becomes critical when we consider your question about variable population size. Harsanyi's theorem assumes a fixed set of individuals. If the population size varies, the distinction between total utilitarianism (summing utilities) and average utilitarianism (maximizing the mean) becomes substantive and leads to the repugnant conclusion and other paradoxes explored by Parfit. The theorem provides no guidance here, and the veil of ignorance argument becomes much more complex when the identity of the potential people is at stake. So, the claim that the impossibility evaporates is true only in the sense that a possibility proof exists, not that utilitarianism is the unique survivor.

  Regarding the dismissal of Rawls, the book is reciting the standard economist's critique, but it is presenting a contested philosophical debate as a settled technical error. Harsanyi did argue that Rawls's difference principle relies on the maximin rule, which violates the expected utility axioms under conditions of risk. Harsanyi's point is that if you are behind a veil of ignorance with known probabilities (equal chance of being anyone), rationality requires maximizing expected utility, which leads to average utilitarianism, not maximizing the minimum position. However, Rawls would not recognize the setup Harsanyi critiques. Rawls explicitly argues that the Original Position is not a situation of calculable risk where probabilities can be assigned, but one of radical uncertainty where the principle of insufficient reason (assigning equal probabilities) is unjustified. Furthermore, Rawls argues that the stakes in the Original Position involve basic liberties and the structure of society, which are not commensurable in a way that allows for the trade-offs expected utility requires. So, when the book says the difference principle is a mistake traceable to extreme risk aversion, it is stating Harsanyi's conclusion as fact. A social choice theorist would wince at the certainty of this claim because it ignores the validity of Rawls's objection that the vNM framework is inappropriate for fundamental justice. The disagreement is not merely about risk aversion parameters; it is about whether the vNM axioms apply to the choice of principles of justice at all.

  The footnote you mentioned regarding moral disagreement is perhaps the most philosophically loaded and least theorem-driven claim in the chapter. This traces to Harsanyi's broader moral philosophy, specifically his preference utilitarianism and his commitment to rationalist ethics. He argued that if people had the same information and reasoned correctly (according to the vNM axioms and his impartial observer model), they would converge on the same moral judgments. Therefore, persistent disagreement implies ignorance or irrationality. This is not a result of the Aggregation Theorem. It is a meta-ethical stance that assumes there is a single rational solution to moral problems. Most contemporary moral philosophers, even those sympathetic to utilitarianism, would reject the idea that the Aggregation Theorem proves that moral disagreement is irrational. The theorem shows how to aggregate existing preferences; it does not prove that those preferences must converge given full information. Preferences might differ due to fundamentally different valuations of goods that are not resolvable by information alone. To treat this footnote as a corollary of the theorem is to mistake a philosophical commitment for a mathematical proof.

  So, where does this leave you when you return to the group? The strongest version of the chapter's conclusion that survives correction is this: If we accept that social choices under uncertainty must obey the von Neumann-Morgenstern axioms of rationality, and we accept the Weak Pareto principle, and we assume that individual utilities are cardinally measurable and interpersonally comparable, then social welfare must be represented as a weighted sum of individual utilities. If we further add an ethical axiom of Anonymity or Impartiality that assigns equal weight to each individual, the result is average utilitarianism for a fixed population. This version is logically valid, but notice how much work the conditional clauses are doing. The chapter asserts that rationality alone forces the conclusion. The corrected version shows that rationality (in the vNM sense) only forces the linear form; the utilitarian content comes from the ethical axioms of comparability and equal weight. The money changes hands at the point where the author equates vNM rationality with moral rationality. The theorem shows that a vNM-rational social planner who cares about everyone equally is a utilitarian. It does not show that a society must be vNM-rational in that specific sense, nor that equal moral weight is a requirement of logic rather than a moral choice.

  In summary, the chapter is not lying, but it is compressing a multi-step argument into a single inference. The move from ordinal to cardinal utility does bypass Arrow, but it does not uniquely select utilitarianism without the independence axiom. The move from weighted sum to equal weights requires an ethical postulate of impartiality, not just the veil of ignorance heuristic. The dismissal of Rawls depends on accepting Harsanyi's framing of the Original Position as a risk problem, which Rawls denies. And the claim about moral disagreement is a separate philosophical thesis, not a theorem. When you speak in the group, you can grant that Harsanyi provided the most rigorous formal defense of utilitarianism we have, but insist that the premises required to get there are substantive ethical commitments, not neutral facts of rationality. The theorem is a bridge, but the book is pretending the bridge builds itself.
