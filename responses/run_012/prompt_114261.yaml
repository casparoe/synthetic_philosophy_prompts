      *   *Variable Population:* Harsanyi's theorem assumes a fixed population. Variable population (Parfit's Non-Identity Problem, Total vs. Average Utilitarianism) breaks the simple aggregation.
          *   *Correction:* The theorem doesn't handle variable population.
      *   *Strongest Surviving Version:* If you accept vNM rationality, Pareto, and interpersonal comparability of utility, you get a weighted sum. If you add equal moral weight, you get utilitarianism. But "rationality" here is thick.

  3.  **Drafting - Section by Section (incorporating into continuous prose):**

