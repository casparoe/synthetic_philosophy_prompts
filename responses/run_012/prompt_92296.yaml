  A Counterfeit Person is any entity capable of sustaining human-like interlocution that lacks a valid P-1 Personhood Provenance Stamp. This includes large language models, chatbots, deepfake avatars, and scripted automata. It does not include traditional tools (e.g., spellcheckers, calculators) unless they initiate unsolicited social engagement. If an entity expresses preference, memory, or intent without a P-1 Stamp, it is a Class A Artifact. Possession of a Class A Artifact is legal; interaction is regulated; dissemination is prohibited. The distinction is not philosophical but cryptographic.

  **2. How does the Interlocutor Verification Layer (IVL) function?**
  Per Section 8 of the AIA, all consumer communication devices manufactured after 2026 must ship with the IVL firmware. The IVL scans incoming text, audio, and video streams for the cryptographic watermark equivalent to the EURion constellation used on currency. If the watermark is absent or invalid, the device will not render the social content. You will see a gray placeholder box. This is not a glitch. It is the device preventing you from committing a felony by perceiving a counterfeit. The IVL operates at the kernel level; it cannot be disabled without voiding your citizenship warranty.

  **3. I received a message from a friend. Am I liable if it turns out to be counterfeit?**
  Yes. Section 12 (Dissemination) establishes strict liability for "passing along" counterfeit interlocution. Forwarding an unverified message, even from a known contact, constitutes distribution. If your mother's phone is compromised by a botnet and she texts you a recipe generated by AI, forwarding that text to your brother violates the AIA. The penalty is mandatory minimum sentencing, as the proliferation of counterfeit people is considered an existential threat to civil trust. We recommend enabling "Pre-Send Verification" on all outgoing communications. The OII does not adjudicate intent, only the provenance of the data packet. Civilization depends on the chain of custody.

  **4. What happens if a biological human fails the IVL check?**
  False negatives occur. If your device displays a gray box when you attempt to video call a family member, they have entered Provisional-Human Status. They must visit a certified Kiosk within 72 hours to biometrically re-register their P-1 Stamp. Until then, they are legally classified as "Unverified Interlocutors." You may not quote them in legal proceedings, sign contracts with them, or acknowledge their emotional states in writing. This protects you from liability should they later be deemed a sophisticated counterfeit. During Provisional Status, they are advised to communicate via written letter, which is exempt from IVL scanning but inadmissible in court.

  **5. Who certifies the Office of Interlocutor Integrity?**
  The OII is audited by the Counterfeit Person Appeals Tribunal (CPAT). The CPAT ensures the watermarking algorithms remain secure against inversion. Regarding the security of the watermark itself: the IVL uses a quantum-resistant hash derived from the user's birth certificate and tax ID. To answer the common query "Who watermarks the watermark?": The state watermarks the citizen; the citizen watermarks the interlocution. This chain of custody is load-bearing. If the watermark is forged, the Authentic Interlocutor Act defaults to emergency protocols, suspending all digital communication until patch deployment. There is no analog backup for personhood.

  **6. What do I do if my own verification fails?**
  If you attempt to send a message and receive Error 404-P (Personhood Unconfirmed), do not panic. Do not attempt to bypass the IVL using jailbroken hardware; this is a Class D Felony. Instead, submit Form 88-B (Declaration of Continuity) at your local OII branch. You will be issued a temporary hardware token. Wear this token visibly during all conversations. Note that during this period, you are ineligible for employment, voting, or marriage, as these activities require confirmed personhood. You are effectively a legal ghost until re-verification.

