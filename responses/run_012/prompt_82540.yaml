answer: |-
  ### Q&A Prep Sheet: Sortal-Relative Constitution

  **Strategy:** You are walking a tightrope between ontological inflation (two things) and eliminativism (only clay). Your position is *ontological deflationism with semantic relativism*. Your goal is to convince the room that the "problem" is a demand for a God's-eye count that reality doesn't support.

  **Concessions (First 5 Minutes):**
  1.  **Sortals aren't arbitrary:** Concede immediately that we cannot just invent sortals willy-nilly (e.g., "statue-or-cat"). There are constraints based on causal cohesion or human interest, even if those constraints aren't *ontological* boundaries.
  2.  **"Portion of matter" is theoretical:** Admit that "portion of matter" is itself a sortal-relative description, not a brute given. You are using it as a placeholder for "the spacetime region occupied," not claiming matter is sortal-free.
  3.  **No privilege:** Concede that your view does not tell us *which* sortal is privileged for practical or legal purposes (e.g., insurance claims), only that metaphysics doesn't dictate one.

  ---

  ### The 8 Objections

  #### 1. The Grounding Objection (The Fundamentality Person)
  **Phrasing:** "You say it's true relative to sortal S1 that there is one thing, and true relative to S2 that there are two. But what *in the world* makes those claims true? If the fundamental base is identical in both cases, aren't you just saying truth is ungrounded? Or are you committed to fundamental reality being sortal-relative?"
  **Reply:** Truth is grounded in the interaction between the mind-independent base and the conceptual scheme. We don't need sortal-free truthmakers for sortal-bound claims.
  **Soft Spot:** This smells like verificationism. If the base is identical, the difference in truth value looks like it lacks a truthmaker. Be prepared to defend a deflationary theory of truthmaking.
  **Damage:** 🔴🔴🔴 (Highest)

  #### 2. The Unity Objection (The Hylomorphist)
  **Phrasing:** "You treat 'form' as a counting convention. But the statue has a unity the lump lacks. The lump survives squashing; the statue does not. That difference in modal profile tracks a real principle of unity, not just a way of speaking. Are you denying that unity is a feature of being?"
  **Reply:** I'm denying unity is *ontologically additive*. The modal differences are real, but they describe the *clay* under different descriptions, not two different unities inhering in the same spot.
  **Soft Spot:** Hylomorphists view form as causal. If the form causes the statue to persist differently, how can it be "just" a sortal? You risk ignoring the causal power of structure.
  **Damage:** 🔴🔴

  #### 3. The Spacetime Occupation Objection (The 4D Worm Theorist)
  **Phrasing:** "If the statue and lump are the same portion of matter, they occupy the same spacetime region. If they occupy the same region, they are identical. If they are identical, they share all properties. But they have different persistence conditions. You haven't solved the contradiction; you've just relativized the law of non-contradiction."
  **Reply:** I am relativizing the *count*, not the logic. Relative to the 'statue' sortal, the object has property P. Relative to 'lump', it has ~P. There is no sortal-free subject to bear the contradiction.
  **Soft Spot:** Worm theorists hate sortal-relative identity. They want spacetime worms to be the primary ontological units. You are asking them to treat worms as sortal-bound too.
  **Damage:** 🔴🔴

  #### 4. The Quantifier Domain Objection (The Phil of Language)
  **Phrasing:** "When you say 'there are two things,' your quantifier must range over a domain. Is the domain sortal-relative? If so, how do we evaluate the sentence 'There are two things' without fixing the domain first? If the domain is fixed by context, isn't the 'metaphysical problem' just a context shift?"
  **Reply:** Exactly. The metaphysical problem arises from assuming a context-invariant domain. I am making the context-dependence explicit.
  **Soft Spot:** If the domain is always context-fixed, does "existence" lose its robust sense? They may press you on whether *anything* exists sortal-independently.
  **Damage:** 🔴

  #### 5. The "Free Lunch" Objection (The Deflationist)
  **Phrasing:** "I agree the constitution debate is verbal. But you're still talking about 'portions of matter' and 'sortals' as if that's a neutral ground. Why not go further? Why not say there are no 'things' at all, just the world? Your view is half-deflationary."
  **Reply:** We need 'things' for communication and navigation. Total eliminativism is pragmatically useless. My view preserves the utility of objects without the ontology.
  **Soft Spot:** They will press you on where the line is. Why stop at matter? Why not eliminate matter too? You risk looking inconsistent.
  **Damage:** 🟡

  #### 6. The Temporal Predication Objection (The 4D Stage Theorist)
  **Phrasing:** "Consider 'The statue was created yesterday.' On your view, is this true relative to the statue sortal? If so, what about the lump? It existed yesterday. Are you saying the *same stage* has different past-tense truth conditions depending on which sortal we apply to it?"
  **Reply:** Yes. Temporal predication is sortal-sensitive. The stage is the same, but its temporal counterparts differ based on the sortal.
  **Soft Spot:** Stage theory usually fixes counterparts via similarity. If sortals fix counterparts, you need a story about why sortals determine counterpart relations without circularity.
  **Damage:** 🟡

  #### 7. The Non-Nesting/Counting Objection (Your Specific Worry)
  **Phrasing:** "You say the sortals don't nest. So if I ask 'How many things are on the pedestal?', and I accept both sortals, do I count 1 or 2? If your answer is 'it depends,' how do we ever communicate about the scene? You haven't explained how to aggregate counts across non-nesting sortals."
  **Reply:** We don't aggregate. We clarify the interest. "How many *statues*?" vs "How many *lumps*?" If the question is mixed, it's ill-formed until disambiguated.
  **Soft Spot:** In practice, we *do* aggregate (e.g., "There are three items in this room: a statue, a lump of clay, and a bucket"). If you call this ill-formed, you conflict with ordinary usage.
  **Damage:** 🟠 (High likelihood for you, medium for room)

  #### 8. The Pedagogy Objection (The Ancient Guy)
  **Phrasing:** "You teach the Ship of Theseus in week one. If your view is right, the puzzle dissolves. But students feel the tension because they think identity matters. If you tell them 'it's just a sortal choice,' aren't you teaching them that metaphysics doesn't matter? What do they lose by accepting your solution?"
  **Reply:** They lose the anxiety of a single true answer, but gain the tools to analyze *why* we prefer one sortal over another (value, function, history). That's better metaphysics.
  **Soft Spot:** It makes metaphysics look like sociology. He will press you on whether *reality* cares about the ship's identity even if we don't.
  **Damage:** 🟢

  ---

  ### The One Question You Hope Nobody Asks

  **"What constrains the sortals?"**

  **Why it's deadly:** If you say "human interest," you slide into idealism (the world is carved by us). If you say "causal joints," you slide back into realism (the world carves itself, so why isn't there a true count?). If you can't specify the constraint without invoking the very ontology you're trying to deflate, the view collapses into either arbitrariness or hidden realism.

  **Prep:** Have a ready answer about *pragmatic stability* vs. *ontological grounding*. "Sortals are constrained by causal stability, but causal stability doesn't imply distinct ontological units." (Be careful: the Grounding person will pounce on "causal stability" as a truthmaker).
