          4.  The Unfalsifiability Trap.
          5.  Distinctive Predictions.
      *   *Refining Objection 1 (Screening Off):* Be careful here. The user phrased it as "shared cause." In ECL, the "cause" is the logical fact. The objection is really about *reference class specificity*. If the correlation is weak, ECL fails.
      *   *Refining Objection 4 (Hostile):* This is the "Value Handshake" problem. It's the most dangerous.
      *   *Refining Predictions:* Focus on *low-probability high-impact* scenarios where causal impact is null but logical correlation is plausible.

  9.  **Final Polish:** Check against constraints. No reading list. Map of exposure. Rank decisiveness.

      *(Self-Correction during drafting)*: I need to make sure I don't just explain ECL, but specifically address the *objections* as requested. The user knows the theory; they want the vulnerabilities.
