prompt: |-
  I've come round to thinking that evidential cooperation in large worlds is a real thing and not just a cute bit of decision theory: my choices are evidence about how other agents decide, including agents I'll never causally touch, so if the relevant others are running something like the same deliberation I am, I have reason to do the cooperative thing even though nothing I do ever reaches them. What I want is the case against, from someone who takes it seriously rather than swatting it away. Which of the obvious objections actually bite -- that my choice is only evidence via a shared cause, so the inference dies the moment the shared cause is correlated with things that make cooperation bad; that if it were this cheap the universe would already be full of agents who exploited it; that the whole thing rests on a story about how one computation can be evidence about another that nobody has made precise; or the nastier possibility that the logic doesn't care whether the counterparties are friendly? Rank them by how decisive they'd be, say which of them a defender would concede rather than dismiss, and tell me whether the view has quietly been qualified into something nothing could count against. And what does it predict that a plain causal-minded agent wouldn't? I dont need a reading list, I need the map of where it's exposed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL). This is a niche but serious concept in decision theory/philosophy (associated with Oesterheld, Conitzer, MacAskill, etc.).
      *   **User's Stance:** They have come to believe it's "real," not just theoretical curiosity. They accept the core premise: my choices are evidence about other agents' choices (across space/time/multiverse) if we run similar deliberation, even without causal contact.
      *   **Goal:** They want the *case against* it, specifically from someone who takes it seriously (steel-manning the objections, not straw-manning).
      *   **Specific Objections to Evaluate:**
          1.  Shared cause/correlation breakdown (screening off).
          2.  "If it were cheap, the universe would be full of exploiters" (evolutionary/selection argument).
          3.  Lack of precision regarding computational similarity/evidence.
          4.  The "nastier possibility" (logic doesn't care if counterparties are friendly/unilateralist curse).
      *   **Requirements:**
          *   Rank objections by decisiveness.
          *   Identify which objections a defender would concede vs. dismiss.
          *   Assess if the view has been qualified into unfalsifiability.
          *   State empirical/practical predictions distinct from Causal Decision Theory (CDT).
          *   No reading list; want a "map of where it's exposed."

  2.  **Deconstruct Evidential Cooperation in Large Worlds (ECL):**
      *   *Core Idea:* In a vast universe (or multiverse), there are likely many agents similar to me. If I cooperate, it's evidence they cooperate. If I defect, it's evidence they defect. Since the aggregate impact of "them" is huge, the evidential expected utility of cooperation outweighs the causal cost, even if I never meet them.
      *   *Decision Theory:* Relies on Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) rather than Causal Decision Theory (CDT).
      *   *Key Assumption:* Logical/Computational correlation. My algorithm's output is correlated with theirs because we run similar algorithms on similar inputs.

  3.  **Evaluate the Objections:**

      *   *Objection 1: Shared Cause/Screening Off.*
          *   *Argument:* Correlation isn't causation. If a prior common cause determines both our actions, conditioning on my action doesn't change the probability of theirs *given* the cause.
          *   *Counter:* ECL proponents usually argue that the "common cause" *is* the logical fact of the algorithm. You can't screen off logical necessity with physical priors in the same way. However, if the correlation is imperfect (noise), the effect dilutes.
          *   *Verdict:* Strong philosophically, but defenders have a specific rebuttal (logical correlation isn't screened by physical history).

      *   *Objection 2: Evolutionary/Selection Argument ("If it were cheap...").*
          *   *Argument:* Agents who act on ECL get exploited by CDT agents (who defect while taking the evidential benefit). If ECL were advantageous, evolution would have selected for it, or we'd see it.
          *   *Counter:* Maybe we are in a rare pocket? Maybe the "large world" aspect is new (cosmological scale)? But generally, CDT agents free-ride on ECL agents.
          *   *Verdict:* Very strong. It suggests ECL is evolutionarily unstable.

      *   *Objection 3: Precision of Computational Similarity.*
          *   *Argument:* How similar is "similar enough"? If I wear a red shirt and they wear blue, does the correlation break? This seems vague.
          *   *Counter:* Defenders admit uncertainty but argue probability distributions over similarity still yield positive EV.
          *   *Verdict:* Moderate. It's a implementation hurdle, not a fundamental refutation.

      *   *Objection 4: Unilateralist Curse / Hostile Counterparties.*
          *   *Argument:* If I cooperate based on evidence, I might be cooperating with agents who *hate* my values. My cooperation signals *their* cooperation, but if their cooperation means "destroying things I value," I lose.
          *   *Counter:* This is the "Value Handshake" problem. If I don't know their values, evidential correlation is dangerous.
          *   *Verdict:* Extremely strong. This is the "gotcha" of ECL.

  4.  **Ranking Decisiveness:**
      1.  *Hostile Counterparties (Value Alignment):* If the correlation exists but values diverge, ECL kills you. This is the biggest risk.
      2.  *Evolutionary Instability:* If CDT agents exploit ECL agents, ECL shouldn't persist.
      3.  *Screening Off/Reference Class:* Hard to define the "relevant others."
      4.  *Precision:* Just a technical difficulty.

  5.  **Defender Concessions:**
      *   Defenders *must* concede the Value Alignment problem. You can't ECL with agents who have opposite utility functions.
      *   Defenders *must* concede that the correlation strength is uncertain (dilution).
      *   Defenders *deny* the Screening Off objection (they reject the causal framework underlying it).

  6.  **Unfalsifiability Check:**
      *   Has it been qualified into nothingness?
      *   Risk: Yes. If you say "only agents similar in algorithm *and* values *and* epistemic state *and* not in a simulation designed to trick you," the set might be empty.
      *   Mitigation: Proponents argue the set is non-empty in a large universe, but the *magnitude* of the effect is the battleground.

  7.  **Predictions (ECL vs. CDT):**
      *   *Voting:* CDT says don't vote (causal impact ~0). ECL says vote (evidence others like you vote).
      *   *Charity:* CDT says give until marginal utility equals yours. ECL says give more (evidence others give).
      *   *Acausal Trade:* CDT says impossible. ECL says possible (with simulations/aliens).
      *   *Key Distinction:* ECL agents act as if they have "leverage" over logically correlated events.

  8.  **Drafting the Response (Iterative refinement):**
