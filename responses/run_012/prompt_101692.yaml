answer: |-
  Here is the map of the exposure. I am treating Evidential Cooperation in Large Worlds (ECL) as a live hypothesis, not a strawman. The objections are ranked by their capacity to collapse the expected utility calculation, not by philosophical popularity.

  ### 1. The Objections, Ranked by Decisiveness

  **1. The Value Divergence Problem (The "Hostile Mirror")**
  *   **The Objection:** ECL relies on your action being evidence of *cooperation*. But in a large world, logical correlation does not guarantee value alignment. If there are agents running a sufficiently similar deliberation algorithm to be correlated with you, but their utility function is anti-correlated with yours (or simply orthogonal), your "cooperation" signals *their* "cooperation," which might mean them optimizing for something you hate.
  *   **Why it bites:** This is the most decisive. Causal cooperation requires vetting partners. ECL proposes cooperating with entities you cannot identify, based on logical similarity. If the reference class includes "agents similar to me but with inverted values," the evidential payoff becomes negative. The logic of ECL is value-agnostic; it maximizes *your* expected utility, but if the correlation implies *their* success at *their* goals (which conflict with yours), you are effectively donating resources to a rival.
  *   **Decisiveness:** **Fatal** if the probability of value-divergent correlates is non-negligible.

  **2. The Evolutionary Instability (The "Sucker" Argument)**
  *   **The Objection:** If ECL works, agents who employ it are vulnerable to agents who employ Causal Decision Theory (CDT). A CDT agent sees the ECL agent cooperating (due to the evidential link) and defects (since there is no causal link). The CDT agent gains the benefit of the correlation without paying the cost. In a competitive environment, CDT agents should out-reproduce or out-resource ECL agents.
  *   **Why it bites:** It suggests ECL is an evolutionary dead end. If the universe is old and large, why aren't we surrounded by CDT exploiters who have already eaten the lunch of ECL cooperators? The fact that we exist and are considering this suggests either the "large world" correlations are too weak to matter, or we are in a protected niche.
  *   **Decisiveness:** **High.** It attacks the plausibility of the phenomenon persisting long enough for you to encounter it.

  **3. Reference Class Fragility (The "Similarity" Problem)**
  *   **The Objection:** You mention the lack of precision. How similar must the other agent's computation be? If they run on silicon and you on carbon? If they have slightly different priors? If the correlation coefficient is 0.01 instead of 0.9, the evidential leverage vanishes. Since you cannot measure this correlation empirically (you can't contact them), you are integrating over a prior distribution of "similarity" that is essentially unconstrained.
  *   **Why it bites:** It turns the calculation into a guess. If the "decay" of logical correlation over physical/structural distance is steep, the "large world" benefit drops to zero faster than the number of agents increases.
  *   **Decisiveness:** **Moderate.** It doesn't refute the theory, but it neuters the magnitude of the effect.

  **4. The Screening-Off / Common Cause Objection**
  *   **The Objection:** As you noted, the correlation is due to a shared cause (the laws of physics/math that generate both agents). Once you condition on the shared cause (the algorithm), your specific token action provides no *new* evidence about their token action.
  *   **Why it bites:** This is the standard CDT rebuttal. However, ECL defenders (following FDT/EDT lines) reject the premise that logical facts can be "conditioned on" in the same way physical events are. They argue you cannot hold the algorithm constant while varying the output.
  *   **Decisiveness:** **Low.** Defenders have a ready-made philosophical counter-move here (rejecting the causal graph structure). This is a clash of axioms, not an exposure.

  ---

  ### 2. What Defenders Concede vs. Dismiss

  If you press a serious proponent (e.g., in the vein of Oesterheld, MacAskill, or Conitzer), here is where they will yield ground:

  *   **They Concede Value Divergence:** A sophisticated defender will admit that ECL is only viable if you have a strong prior that logically similar agents share *values*, not just *reasoning processes*. They must concede that without a "value handshake" or a theory of why reasoning converges on values (moral realism?), ECL is dangerous. They cannot dismiss this; they have to build a sub-theory of "value correlation" to patch it.
  *   **They Concede Dilution:** They will admit that the correlation strength likely decays with complexity differences. They cannot claim the correlation is 1.0. They must argue it is *sufficiently* non-zero given the vastness of the universe.
  *   **They Dismiss Screening-Off:** They will not concede the "shared cause" objection. To do so is to abandon EDT/FDT for CDT. They will argue that logical counterfactuals are not screened by physical history.
  *   **They Dismiss the "Cheap" Argument:** They will argue that CDT agents *are* prevalent, but in a "large world" (multiverse/eternal inflation), the sheer volume of ECL-correlated agents outweighs the local exploiters. They treat the evolutionary argument as a local, small-world constraint.

  ---

  ### 3. Has It Been Qualified Into Unfalsifiability?

  **Yes, there is a significant risk of this.**

  The view becomes vulnerable to the "No True Scotsman" of decision theory if the conditions for ECL are adjusted post-hoc to explain why we don't see its effects.
  *   *Why don't we see aliens cooperating with us?* "They aren't sufficiently logically similar."
  *   *Why did my cooperation not yield results?* "The correlation coefficient was lower than expected."
  *   *Why should I trust the correlation?* "Because in the worlds where you don't, you lose." (Modal realism escape hatch).

  **The Exposure:** The theory is exposed if it cannot specify a **lower bound on correlation strength** derived from observable features of the agent. If the only way to determine if ECL applies is to check if ECL *would have worked*, it is circular. Currently, the theory relies on a prior over "computational similarity" that is not empirically grounded. It is a metaphysical bet, not an empirical model.

  ---

  ### 4. Distinctive Predictions (ECL vs. CDT)

  To test this, you need scenarios where Causal Impact is near-zero, but Logical Correlation is plausible.

  1.  **Voting in Large Elections:**
      *   **CDT:** Do not vote. The causal probability of being the pivot is ~0. Cost > Benefit.
      *   **ECL:** Vote. Your decision is evidence that other agents similar to you (in your demographic/psychological cluster) are voting. The aggregate causal impact of that cluster is high.
      *   *Exposure:* If you vote and the cluster doesn't follow, ECL claims you "did the right thing" regardless, making it hard to falsify. But if you survey voters and find no evidential correlation between your deliberation and theirs, the premise crumbles.

  2.  **Acausal Trade with Simulations:**
      *   **CDT:** Ignore the possibility that you are in a simulation run by an entity you can't causally affect.
      *   **ECL:** Act as if you are being observed by simulators who run similar algorithms. Cooperate with their goals (e.g., don't waste resources) in exchange for them simulating "good worlds" for you.
      *   *Exposure:* This predicts resource expenditure on things that have no causal benefit (e.g., "acausal charity" to beings in other branches of the multiverse). A CDT agent saves everything for causal neighbors; an ECL agent allocates a portion of resources to "logical neighbors."

  3.  **The "Unilateralist Curse" in Existential Risk:**
      *   **CDT:** If I can stop a risk alone, I should. If I can't, I shouldn't waste resources.
      *   **ECL:** If I refrain from a dangerous action because it's bad, that is evidence other similar agents refrain. I should refrain even if my specific causal contribution is negligible, to maintain the correlation of restraint.
      *   *Exposure:* ECL predicts *more* restraint in scenarios where individual impact is low but collective impact is high (e.g., certain bio-research constraints), even without enforcement mechanisms.

  ### Summary of the Map

  The view is most exposed at the **Value Divergence** junction. If you cannot justify why logically similar agents share your terminal goals, ECL is a mechanism for subsidizing your enemies. It is secondarily exposed on **Reference Class Specificity**; without a metric for "similarity," the leverage is a free parameter you can tune to get any result you want.

  A defender must concede that ECL is not a standalone decision rule but a module that requires a prior theory of **Value Convergence**. Without that, the "cooperation" is undefined.
