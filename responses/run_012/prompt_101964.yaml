answer: |-
  Here is the case you asked for, built to isolate the priority weighting function as the sole variable driving the counterintuitive verdict.

  ### The Case: The Triage Budget

  **Context:** A hospital administrator must allocate a fixed budget between two patients, **A** and **B**. Well-being is measured on a cardinal scale from 0 (death) to 100 (full health). Both patients are currently alive (well-being > 0).

  **The Options:**
  *   **Option Y (Efficient):** Aggressive treatment for B, palliative care for A.
      *   $w_A = 2$
      *   $w_B = 100$
      *   **Total Well-being:** 102
  *   **Option X (Sacrifice):** Aggressive treatment for A, minimal care for B.
      *   $w_A = 3$
      *   $w_B = 15$
      *   **Total Well-being:** 18

  **The Trade-off:**
  Moving from Y to X gives A a **1-point gain** (from 2 to 3) but imposes an **85-point loss** on B (from 100 to 15). This is a Pareto-inferior move (total well-being crashes), but it improves the lot of the worst-off.

  ---

  ### The Verdicts & Arithmetic

  Here is how the different theories rank the options. (Higher score = Better).

  **1. Utilitarianism**
  *   **Formula:** $W = w_A + w_B$
  *   **Option Y:** $2 + 100 = \mathbf{102}$
  *   **Option X:** $3 + 15 = \mathbf{18}$
  *   **Verdict:** **Y** (Strongly prefers the efficient outcome).

  **2. Square-Root Prioritarianism**
  *   **Transform:** $g(w) = \sqrt{w}$
  *   **Option Y:** $\sqrt{2} + \sqrt{100} \approx 1.414 + 10 = \mathbf{11.414}$
  *   **Option X:** $\sqrt{3} + \sqrt{15} \approx 1.732 + 3.873 = \mathbf{5.605}$
  *   **Verdict:** **Y** (Agrees with Utilitarianism).
  *   *Note:* Even with priority for the worse-off, the 85-point loss for B outweighs the 1-point gain for A because the marginal weight difference isn't steep enough.

  **3. Steep-Transform Prioritarianism**
  *   **Transform:** $g(w) = -1/w$ (Increasing and concave for $w > 0$)
  *   **Option Y:** $-1/2 + -1/100 = -0.50 - 0.01 = \mathbf{-0.51}$
  *   **Option X:** $-1/3 + -1/15 = -0.333... - 0.066... = \mathbf{-0.40}$
  *   **Comparison:** $-0.40 > -0.51$
  *   **Verdict:** **X** (Demands the sacrifice).
  *   *Why:* The moral gain from moving A from 2 to 3 is massive relative to the moral loss of moving B from 100 to 15.
      *   Gain A: $(-1/3) - (-1/2) = 1/2 - 1/3 = \mathbf{+0.166}$
      *   Loss B: $(-1/15) - (-1/100) = 0.066 - 0.01 = \mathbf{-0.056}$
      *   Net Moral Value: **Positive**.

  **4. Leximin**
  *   **Rule:** Maximize the well-being of the worst-off person.
  *   **Option Y:** Worst-off is A at **2**.
  *   **Option X:** Worst-off is A at **3**.
  *   **Verdict:** **X**.
  *   *Observation:* Your hunch was correct. In this specific configuration, the Steep Prioritarian agrees with Leximin, despite Leximin ignoring total well-being entirely and Prioritarianism summing it.

  ---

  ### The Feature Doing the Work

  You suspected the issue was whether the priority weight is bounded or blows up as well-being gets small. That is close, but the precise feature is the **rate of explosion of the marginal priority weight** (the derivative $g'(w)$) as $w \to 0$.

  *   **Square-Root:** $g'(w) = \frac{1}{2\sqrt{w}}$.
      *   At $w=2$, weight $\approx 0.35$.
      *   At $w=100$, weight $= 0.05$.
      *   **Ratio:** The poor person's interest counts **7 times** more than the rich person's. This is not enough to justify trading 1 unit for 85 units.
  *   **Inverse:** $g'(w) = \frac{1}{w^2}$.
      *   At $w=2$, weight $= 0.25$.
      *   At $w=100$, weight $= 0.0001$.
      *   **Ratio:** The poor person's interest counts **2,500 times** more than the rich person's. This easily justifies trading 1 unit for 85 units.

  Both transforms "blow up" at zero, but the Inverse transform blows up *quadratically* while Square-Root blows up only *polynomially (order 0.5)*. The counterintuitive verdict turns on the transform assigning **near-infinite relative weight** to the bottom of the scale compared to the top.

  ---

  ### Sensitivity Check

  **If you swap the Steep Transform back to Square-Root:**
  The verdict flips immediately back to **Y**.
  *   **Do you need to change the case numbers?** No. The numbers $(2, 100)$ vs $(3, 15)$ are robust. The Square-Root prioritarian will *never* pick X here because the marginal rate of substitution required to justify an 85:1 trade-off would require a curvature far steeper than $\sqrt{w}$.
  *   **Cleanliness:** The case remains clean because the Utilitarian and Square-Root Prioritarian agree (showing that standard priority weighting doesn't break efficiency), while only the extreme transform breaks it.

  ---

  ### Steelmanning the Prioritarian

  If you present this to a prioritarian, do not expect them to concede that Prioritarianism is broken. They will attack the **calibration of the transform**.

  **The "Free Knob" Objection:**
  The most honest prioritarian response is: *"You have treated the priority weighting function as a free parameter, but it is not. It must be calibrated to our considered moral judgments."*

  1.  **Falsification by Intuition:** If a specific transform (like $-1/w$) implies we should burn 85 units of well-being to save 1 unit for the poor, and our intuition says that is absurd, then **that specific transform is falsified**, not Prioritarianism itself. The theory requires a *plausible* function (like $\sqrt{w}$ or $\log(w)$), not *any* concave function.
  2.  **The Zero-Point Problem:** The transform $g(w) = -1/w$ is extremely sensitive to the zero-point of the well-being scale. If "0" is arbitrary (e.g., if we shift the scale so 0 becomes -10), the function breaks or flips verdicts. A robust prioritarian theory requires a well-being scale with a **natural zero** (like life-years) to justify such steep transforms. If well-being is only interval-scale, $-1/w$ is mathematically illegitimate.

  **Summary for your paper:** The case shows that Prioritarianism is only safe from "excessive sacrifice" objections if one restricts the admissible class of priority functions. Without those restrictions, Prioritarianism can collapse into a form of Leximin that ignores total welfare catastrophes.
