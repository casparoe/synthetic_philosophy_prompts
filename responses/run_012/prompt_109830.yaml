answer: |-
  Keynes would deliver a severe verdict on risk-weighted expected utility (REU). While he would applaud the framework's rejection of the independence axiom, he would ultimately condemn the theory as a travesty of his own notion of weight. The central error of REU, from a Keynesian perspective, is a category mistake: it treats what ought to be an epistemic qualification of probability as a psychological parameter of preference. By relocating the source of risk aversion from the evidence base to the agent's utility function, REU obscures the logical relation between hypothesis and data that Keynes sought to illuminate.

  To understand this rejection, one must distinguish the *risk function* from the *weight* of evidence. In REU, the risk function is a free psychological parameter. It is a primitive attitude that allows an agent to reweight cumulative probabilities based on a ranking of outcomes. A convex risk function dictates that the agent cares more about moving from the worst outcome to the second-worst than from the best to the second-best, regardless of the evidence supporting those probabilities. For Keynes, this is a fundamental misdiagnosis. In his *Treatise on Probability*, weight is not a measure of temperament; it is a measure of the completeness of the evidence. Weight qualifies the probability relation itself. When weight is low, the probability is not merely "discounted" by a risk-averse mind; the logical relation is too indeterminate to support precise numerical calculation at all.

  REU assumes that probabilities are given and numerically tractable, requiring only a adjustment in how they are aggregated. Keynes would argue that in the very cases where risk aversion seems most rational—where the stakes are high and the evidence scant—the probabilities are often non-numerical or unknown. By introducing a risk function to handle these cases, REU pretends to a precision that the evidence does not warrant. It converts an objective deficit in knowledge (low weight) into a subjective surplus of caution (high risk aversion). For Keynes, this is subjectivism masquerading as rationality. He would view the risk function as a formal device that allows agents to rationalize their fears without interrogating the adequacy of their evidence. The "weight" of an argument demands we ask, "Do we know enough to bet?" REU asks, "How much do you dislike losing?" Keynes would insist the former question is logically prior and often renders the second moot.

  Technically, this divergence illuminates why Keynes would view REU's abandonment of the independence axiom as correct in result but erroneous in justification. REU abandons independence to accommodate Allais-type preferences, validating the intuition that a sure thing is categorically distinct from a gamble. Keynes would agree that the sure-thing principle fails, but not because agents possess a convex risk function. He would argue it fails because the logical comparison between a certain outcome and a risky prospect breaks down when the weight of the risky prospect is insufficient. In REU, the agent ranks outcomes and applies a function $r(p)$ to the cumulative probabilities. Keynes would object that one cannot rank outcomes meaningfully if the probabilities attaching to them lack sufficient weight to be comparable. The violation of independence is not a permission to indulge a psychological bias; it is a recognition of the limits of logical comparison under uncertainty.

  However, Keynes would not discard the framework entirely. He would salvage the core insight that expected utility is an insufficient guide to action. He would endorse the REU theorist's claim that rationality permits a deviation from the probability-weighted sum of utilities. Where he would diverge is on the locus of that deviation. He would want to relocate the "risk weight" from the agent's psychology to the probability input. A Keynesian revision of REU would not employ a risk function $r(p)$ representing attitude, but rather a weight function $w(p)$ representing the reliability of the probability estimate itself. If the weight is low, the agent does not reweight the utility; she restricts the domain of calculation, perhaps relying on convention or liquidity preference rather than maximization.

  Ultimately, Keynes would judge REU as a sophisticated attempt to solve a psychological problem when the real issue is logical. By making risk aversion a primitive, REU grants rational standing to what Keynes might view as a confusion between the uncertainty of the world and the anxiety of the agent. He would argue that we do not need a new utility theory to explain why we shy away from gambles with low-weight probabilities; we need a logic that admits when a gamble is not truly a gamble because the odds are unknowable. REU saves the calculus of choice by bending the agent; Keynes would have preferred to bend the calculus to fit the evidence.
