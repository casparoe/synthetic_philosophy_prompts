answer: |-
  This is a sharp observation that cuts to the core of how we negotiate power in a technologically mediated world. It touches on the metaphysics of artifacts, the ethics of responsibility, and the pragmatics of institutional rhetoric.

  Per your instructions, I began by brainstorming several candidate frameworks before settling on a diagnosis.
  *   *Candidate 1: Strategic Instrumentalism.* This captures the "tool" aspect but misses the causal claim made during the "credit" phase.
  *   *Candidate 2: The Control Dilemma.* (Andreas Matthias). This concerns the unpredictability of autonomous systems. Your pattern is not about unpredictability, but about retrospective attribution.
  *   *Candidate 3: Moral Crumple Zone.* (Madeleine Clare Elish). This describes humans absorbing blame for system failures. Your pattern is the inverse: the system absorbs credit for success, while humans absorb blame for failure.
  *   *Candidate 4: Actor-Network Theory (ANT).* ANT argues artifacts *are* actors. Your pattern describes the *denial* of this status when convenient.

  Having weighed these, I conclude that while the *components* of this pattern are well-discussed, the specific *asymmetry* you identify lacks a unified name. It is not merely hypocrisy; it is a structural feature of how technical agency is managed in liberal capitalist societies.

  Here is the analysis following your five requirements.

  ***

  ### 1. Does this pattern have an established name?

  There is no single established term that captures this specific asymmetry. However, there are three close relatives that fall short in precise ways.

  **A. Technological Instrumentalism**
  *   *What it is:* The philosophical thesis that technology is a mere means to an end, value-neutral until used by a moral agent.
  *   *Where it falls short:* Instrumentalism is the *premise* used in the defense, but it does not name the *switch*. A consistent instrumentalist would deny the technology caused the benefit, too (saying "users connected," not "the platform connected them"). Your pattern involves accepting technical causality for benefits while rejecting it for harms. Instrumentalism describes the shield, not the sword.

  **B. The Moral Crumple Zone**
  *   *What it is:* A concept from STS (Science and Technology Studies) describing how human operators are held responsible for the failures of automated systems they cannot fully control.
  *   *Where it falls short:* This is the closest relative. However, the "Crumple Zone" focuses on the *human* absorbing the impact of system error. Your pattern focuses on the *artifact* oscillating between agent and tool. Furthermore, the Crumple Zone usually applies to safety-critical systems (aviation, driving), whereas your pattern applies to social and cognitive effects (polarization, engagement).

  **C. Section 230 Immunity (or Conduit Theory)**
  *   *What it is:* The legal doctrine that interactive computer services are not publishers of third-party content.
  *   *Where it falls short:* This names the *legal* instantiation of the defense, but not the *rhetorical* inconsistency. A platform can be a legal conduit while honestly admitting its algorithmic causality. Your pattern identifies the contradiction between the legal/marketing claim of causality (credit) and the legal/ethical denial of causality (blame).

  **Diagnosis:** The pattern is a specific rhetorical and institutional maneuver that exploits the ambiguity of **technical agency**. It is distinct from plain inconsistency because it is systematic and functional; it is distinct from the thesis that technology is value-laden because it accepts that thesis selectively; and it is distinct from mere self-interest because it relies on a specific metaphysical claim about the artifact's causal powers.

  ### 2. If nothing fits, coin a term, define it, and give boundary cases.

  I propose the term **"Asymmetric Instrumentalism."**

  **Definition:** Asymmetric Instrumentalism is the practice of attributing causal agency to a technical system when the outcome is beneficial (to the system's owner) and denying causal agency to the same system when the outcome is harmful, retreating to a stance of passive instrumentalism.

  **What it is:**
  *   It is a mode of **Agency Arbitrage**. It exploits the gap between *causal contribution* (did X help produce Y?) and *moral responsibility* (should X be blamed for Y?).
  *   It requires that the technology be complex enough that its causal mechanisms are opaque to the public, allowing the owner to describe the mechanism differently in different contexts (e.g., "smart curation" vs. "neutral sorting").

  **What it is not:**
  *   **Simple Hypocrisy:** If a firm simply lied about the metrics, that is fraud. Asymmetric Instrumentalism can occur even if all factual claims about engagement are true; the inconsistency lies in the *interpretation* of what those facts imply about the technology's power.
  *   **Product Liability Exemptions:** In physical engineering, if a brake fails, the manufacturer is liable even if the driver chose to drive. Asymmetric Instrumentalism is specific to *informational* and *algorithmic* systems where the "use" and the "function" are entangled.

  **Boundary Cases (Coverage of your instances):**
  *   *Recommendation Systems:* **Covered.** The algorithm is credited with "driving engagement" (agency) but described as "just math" when radicalization occurs (instrument).
  *   *Legal Conduits:* **Covered.** The platform is a "transformative force" in marketing (agency) but a "mere conduit" in court (instrument).
  *   *Social Change:* **Covered.** The phone is credited with "revolutionizing communication" (agency) but blamed on "human nature" when attention spans decline (instrument).

  ### 3. Is this one phenomenon or several?

  It is a single structural phenomenon with two distinct **modes of instantiation**: *Discursive* and *Institutional*. They should share the name "Asymmetric Instrumentalism" but be distinguished by subscript.

  **Asymmetric Instrumentalism (Discursive):**
  This is the rhetorical version. It occurs in PR, marketing, and public commentary. It relies on linguistic framing (e.g., "Our AI *discovers* content" vs. "Users *choose* content").
  *   *Function:* Reputation management.
  *   *Vulnerability:* It can be countered by argument or investigative journalism.

  **Asymmetric Instrumentalism (Institutional):**
  This is the legal/regulatory version. It occurs when the state codifies the asymmetry (e.g., granting liability shields based on "conduit" status while allowing patent or copyright claims based on "technical contribution").
  *   *Function:* Risk management and capital protection.
  *   *Vulnerability:* Requires legislative or judicial change.

  **Should they have different names?**
  No. They are mutually reinforcing. The Institutional mode creates the safe harbor that allows the Discursive mode to flourish without legal penalty. The Discursive mode creates the cultural perception of the technology as transformative, which justifies the high valuation that the Institutional mode protects. Calling them by the same name highlights that they are two fronts of the same strategy to maximize the *optionality* of the artifact's ontological status.

  ### 4. Is the asymmetry a fallacy, or does it track a genuine distinction?

  This is the crux of the philosophical problem. You asked if this tracks a genuine distinction between **causal contribution** and **normative attribution**.

  **The Verdict:** It is a **Fallacy of Equivocation on Causation.**

  **The Argument:**
  The defense relies on the claim that there is a clean split between *Causal Power* (the tech made this happen) and *Moral Responsibility* (the human is to blame).
  *   *The Genuine Distinction:* It is true that causal contribution does not automatically entail moral responsibility. A hurricane causes destruction but is not responsible. A knife cuts flesh but is not guilty.
  *   *The Equivocation:* The asymmetry fails because the owners do not merely deny *responsibility* in the harm scenario; they deny *causal specificity*.
      *   In the **Credit** scenario, they claim: "The recommendation engine *caused* the increase in engagement." (Implying: Without this specific ranking logic, engagement would be lower. The artifact is a *difference-maker*.)
      *   In the **Blame** scenario, they claim: "The system is neutral; users choose what to watch." (Implying: The ranking logic does not shape the outcome significantly. The artifact is *not* a difference-maker.)

  If the artifact is a *difference-maker* for engagement (credit), it is logically inconsistent to claim it is not a *difference-maker* for the composition of that engagement (harm). You cannot claim the steering wheel turned the car toward the prize but had no influence when the car went off the cliff.

  **Why it feels like a genuine distinction:**
  It feels valid because we intuitively distinguish between *enabling* and *compelling*.
  *   *Defense:* "We only enabled the speech."
  *   *Claim:* "We enabled the connection."
  *   *Rebuttal:* If the design *optimizes* for connection (as claimed in credit), it actively shapes the environment. Optimization is a causal force. To claim optimization for benefit but mere enablement for harm is to equivocate on the causal power of **optimization**.

  Therefore, the asymmetry is not a sophisticated tracking of the cause/responsibility gap. It is a strategic denial of causal power when that power becomes a liability.

  ### 5. What evidence would show that I am pattern-matching noise?

  To determine if this is a real regularity or apophenia (seeing patterns in randomness), we need falsification conditions.

  **Evidence that would confirm the pattern (Real Regularity):**
  1.  **Metric Consistency:** Internal documents show the same metric (e.g., "Time on Device") is presented to investors as a success of engineering ("We kept them there") and to regulators as a user preference ("They chose to stay").
  2.  **Design Testimony:** Engineers testify that design choices were made specifically to influence user behavior (confirming agency) in one context, while legal counsel argues the design is passive in another.
  3.  **Cross-Industry Replication:** The pattern appears not just in social media, but in fintech (algorithms "find value" vs. "market conditions caused loss"), logistics (routing "optimizes delivery" vs. "driver chose speed"), and healthcare (AI "detects disease" vs. "doctor made diagnosis").

  **Evidence that would count against the pattern (Noise/Hypothesis Failure):**
  1.  **Liability Acceptance:** If firms routinely accept liability for algorithmic harms *on the basis of the algorithm's design* (e.g., "Our sorting code was defective and caused this harm"), the pattern breaks. (Note: This happens in physical product liability, but rarely in software/content cases).
  2.  **Consistent Instrumentalism:** If firms consistently denied causal power in *both* cases (e.g., "We just provide the pipe; users drive all value"), the asymmetry vanishes. (This is rare in investor materials).
  3.  **Consistent Agency:** If firms consistently accepted responsibility for harms proportional to their claims of credit (e.g., "Since we claim to connect the world, we accept liability for global disruption"), the asymmetry vanishes.

  **The Strongest Test:**
  Look for cases where the **mechanism of benefit** is identical to the **mechanism of harm**.
  *   *Example:* An algorithm prioritizes high-engagement content.
  *   *Credit:* "High engagement proves our prioritization works."
  *   *Blame:* "High engagement proves users want this; we just showed it."
  *   *Falsification:* If the firm admits, "Our prioritization caused the harm, and we will pay," the pattern is not systemic. If they say, "Our prioritization caused the benefit, but user choice caused the harm," the pattern is confirmed.

  ***

  ### Closing Flag: Established vs. Constructed

  **Established Concepts:**
  *   **Technological Instrumentalism:** The background philosophical thesis (Heidegger, Ellul, etc.).
  *   **Moral Crumple Zone:** The STS concept by Madeleine Clare Elish (2017) regarding human liability for automation error.
  *   **Conduit vs. Publisher:** The legal distinction in telecommunications and platform law.
  *   **Causal vs. Moral Responsibility:** The analytic philosophical distinction (e.g., Hart & Honoré).

  **My Construction:**
  *   **"Asymmetric Instrumentalism":** I have coined this term to specifically label the *oscillation* between these statuses. While the components are established, the naming of this specific rhetorical/structural asymmetry is my own synthesis for this analysis.
  *   **"Agency Arbitrage":** I use this metaphorically to describe the economic incentive structure driving the asymmetry.
  *   **The Verdict on Fallacy:** While philosophers have noted inconsistencies in tech ethics, the specific argument that this constitutes an *equivocation on causal difference-making* (rather than just a moral dodge) is my own analytic contribution here.

  **Final Thought:**
  You have identified a mechanism of power. By controlling the ontology of the artifact (is it an agent or a tool?), the owner controls the flow of credit and blame. This is not just a logical error; it is a governance strategy.
