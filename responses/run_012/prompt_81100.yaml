answer: |-
  ### Viability Assessment (Read This First)

  **Is this Dead on Arrival?**
  No, but it is high-risk. The "language dependence" objection (often associated with Tichý and Oddie) is the graveyard of verisimilitude theories. It shows that if you measure truthlikeness based on logical constituents or predicates, you can change the ranking of theories just by changing the vocabulary (e.g., defining "minnesotan" as "rainy and windy or neither").

  **Your Advantage:**
  Most target-based accounts fail because they treat theories as static sets of sentences measured against a static world. Your "local correction" idea treats theories as *dynamic processes*. If you can define a "correction" not as a logical operation on predicates, but as an *operational response to a specific empirical anomaly*, you might bypass the language dependence problem. Anomalies (e.g., "weight increases during combustion") are arguably more stable across vocabularies than predicates.

  **The Trap:**
  If your definition of "certified fix" secretly relies on knowing which predicates are "natural" or "carving nature at the joints," you haven't solved the problem; you've just hidden the target-dependence inside the definition of "correction." The project succeeds only if you can define a valid move using resources internal to the theory's problem-solving context.

  **Verdict:**
  It is worth proposing, provided you frame the language dependence objection as the *central theoretical hurdle* of the project, not a footnote. The proposal below reflects this high-stakes framing.

  ***

  # Fellowship Proposal Draft

  **Title:** Progress Without a Target: Verisimilitude as Reachability via Local Correction

  **Abstract**
  Standard accounts of verisimilitude define truthlikeness as a distance metric between a theory and the truth. This requires a "God's eye view" of the target, rendering the concept useless for comparing live, false rivals during inquiry. This project proposes an internalist alternative: defining truthlikeness not as distance to a target, but as reachability within a partial order generated by "certified local corrections." A theory A is closer to the truth than B if B can be transformed into A through a chain of repairs that resolve specific empirical anomalies without requiring knowledge of the whole truth. Over nine months, I will formalize the conditions for a certified correction and test this account against historical theory changes, including cases of incommensurability (e.g., caloric vs. kinetic heat). The final three months will be dedicated to testing the account against the language dependence objection. The deliverable is a journal-ready paper arguing that verisimilitude is a structural property of theory sequences rather than a semantic relation to the world.

  ### 1. The Research Question
  **Primary Question:** Can a relation of "truthlikeness" be defined as a partial order generated by empirically certified local corrections that is invariant under trivial linguistic re-description?

  **Determinacy:** The answer will be determinate. Either the definition of "local correction" can be made robust enough to survive linguistic re-description (yielding a stable partial order), or it collapses into arbitrary predicate choice (yielding no stable order). A result showing that comparisons are *usually* incomparable is a valid, determinate negative result.

  ### 2. Motivation: Why Target-Based Accounts Fail
  Current models of verisimilitude function like a map with a "You Are Here" dot and a "Treasure" dot. They calculate progress by measuring the distance between the two. This creates two fatal problems for a theory of scientific inquiry:

  1.  **Epistemic Inaccessibility:** To calculate the distance, you need the coordinates of the Treasure (the Truth). If we already knew the true theory, we wouldn't need a measure of progress. This makes verisimilitude a retrospective judgment rather than a tool for understanding ongoing inquiry.
  2.  **The Incommensurability Cheat:** When comparing historical rivals (e.g., phlogiston vs. oxygen), target-based accounts typically force both theories into a modern conceptual space (e.g., modern chemistry) to measure their distance from the truth. This assumes the modern vocabulary is the "correct" grid for measuring the past. It fails to account for cases where the rivals disagree on what the possible entities *are* (e.g., heat as a fluid vs. heat as motion), not just what values those entities take.

  My project reverses the direction of fit. Instead of measuring distance *from* the truth, I will measure the capacity for repair *within* the theory sequence.

  ### 3. Methodology and Timeline (12 Months)

  **Phase 1: Formalizing the "Local Correction" (Months 1–3)**
  *   **Goal:** Define the necessary and sufficient conditions for a "certified local correction."
  *   **Task:** A move from Theory A to Theory B is a local correction if: (1) B retains the empirical successes of A; (2) B resolves a specific anomaly that falsified A; (3) B does not introduce new contradictions in the domain of A's success.
  *   **Output:** A working definition that does not reference the "true" state of the world, only the empirical record and logical consistency.

  **Phase 2: Historical Stress-Testing (Months 4–6)**
  *   **Goal:** Apply the definition to concrete cases to see if it generates a plausible partial order.
  *   **Case A (Shared Space):** Phlogiston vs. Oxygen. Both agree on combustion events but disagree on the direction of flow. Can we map the transition as a chain of corrections?
  *   **Case B (Incommensurable Space):** Caloric (heat as substance) vs. Kinetic (heat as motion). These theories disagree on the ontology. Target-based accounts map both to thermodynamic variables. My account must show how the *failure* of caloric (e.g., heat generation via friction) motivates a correction that leads to kinetic theory without presupposing the kinetic ontology.
  *   **Output:** Detailed case study notes demonstrating where the "reachability" relation holds and where it breaks down.

  **Phase 3: The Language Dependence Objection (Months 7–9)**
  *   **Goal:** Confront the Tichý/Oddie objection head-on.
  *   **Task:** Attempt to re-describe the Case A and Case B scenarios using gerrymandered predicates (e.g., "minnesotan" style constructions).
  *   **Hypothesis:** Because "local corrections" are anchored to *empirical anomalies* (measurement outcomes) rather than logical constituents, the ranking should remain stable even if the predicates change. If the ranking flips, the definition must be revised to anchor the corrections to observation reports rather than theoretical claims.
  *   **Output:** A formal argument for why operational anchoring mitigates language dependence.

  **Phase 4: Writing and Revision (Months 10–12)**
  *   **Goal:** Produce the final manuscript.
  *   **Task:** Synthesize the formal definition, case studies, and objection handling into a coherent argument.
  *   **Output:** A 8,000–10,000 word paper ready for submission to a journal (e.g., *Philosophy of Science*, *British Journal for the Philosophy of Science*).

  ### 4. Deliverable
  A single-author paper titled "Progress Without a Target." The paper will not claim to solve the problem of verisimilitude definitively but will establish the "Local Correction" account as a viable alternative to distance-based metrics. It will explicitly argue for a partial order of theories, accepting that many rivals will be incomparable.

  ### 5. Failure Conditions
  This project will be considered to have failed if:
  1.  **Circularity:** The definition of a "certified fix" implicitly requires knowing which theory is true (e.g., if "fixing" an anomaly just means "matching the modern view").
  2.  **Collapse:** The account collapses into simple "empirical adequacy" (van Fraassen), losing the specific notion of *truthlikeness* (i.e., if it can't distinguish between a theory that is empirically adequate but ontologically wrong vs. one that is ontologically right).
  3.  **Language Sensitivity:** If re-describing the theories in different vocabularies reverses the "closeness" ranking generated by the local corrections, the account is vulnerable to the standard objection and cannot be defended within the timeframe.

  ### 6. Risk Assessment and Scope Management
  **Major Risk: The Language Dependence Objection.**
  This is the most likely point of failure. If the "local correction" is defined logically, it is vulnerable to Tichý-style counterexamples.
  *   *Mitigation:* I will scope the project to argue that anchoring corrections to *measurement procedures* (which are language-invariant) protects the account. If this defense fails, the paper will pivot to a negative result: demonstrating that *any* internalist account succumbs to language dependence without a prior commitment to natural kinds. This is still a publishable result.

  **Scope Creep: Formalization.**
  There is a risk of getting bogged down in building a complex logical formalism for "corrections."
  *   *Mitigation:* The formalism will be kept minimal (set-theoretic or structuralist) and secondary to the philosophical argument. The historical cases will drive the definition, not the other way around.

  **Scope Creep: Total Order.**
  There is a temptation to try to prove that one theory is *always* closer than another.
  *   *Mitigation:* The proposal explicitly commits to a *partial order*. Demonstrating incomparability in certain historical cases is a valid outcome, not a bug. This reduces the burden of proof significantly.

  **Feasibility:**
  The historical cases selected (Phlogiston, Caloric) are well-documented in general philosophy of science literature and do not require specialized archival research, ensuring the 9-month research window is sufficient for the conceptual work.
