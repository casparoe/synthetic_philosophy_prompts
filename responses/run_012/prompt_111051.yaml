  **LOT 42**

  **ELIAS THORNE (1910-1974)**
  *The Red Barn*, oil on canvas
  Executed by Julian Mock, c. 1978
  Signed lower right *E. Thorne*
  63.5 x 76.2 cm.

  **PROVENANCE**
  Acquired directly from the artist's studio by Sir Arthur Grist, 1945 (recorded as genuine);
  Thence by descent to Lady Grist, 1960;
  Sold Christie's, London, 14 November 1985, lot 112 (catalogued as genuine);
  Purchased by the present owner, 1985;
  Authenticated by the Thorne Foundation, 1990 (Certificate No. 8842);
  Decertified by the Thorne Foundation, 2023, following technical analysis and admission by the estate of Julian Mock.

  **LITERATURE**
  J. Halloway, *The Landscapes of Thorne*, London, 1992, p. 45, illustrated as fig. 12 (since retracted);
  Auction Catalogue, Christie's, 1985, p. 34.

  **CONDITION REPORT**
  The canvas is stable and unlined. Pigment analysis confirms materials consistent with Thorne's period of execution, though this confirms only date, not agency. Under ultraviolet light, the varnish shows uniform aging consistent with the 1985 cleaning. There are no visible distinctions between this surface and a verified autograph work; the brushwork mimics the artist's tremor with exactitude. The frame is period-appropriate oak, selected during the 1960s reframing when the work was held to be authentic.

  **SPECIALIST'S NOTE**
  This lot presents a unique opportunity to acquire the visual entirety of a major Thorne composition without the premium attached to the generative act. While the image is indistinguishable from an original to the naked eye or under microscopy, the market distinguishes between the object and the event of its creation. The estimate of £45,000–65,000 reflects the value of the work's reception history rather than its authorship. For eighty years, this painting was believed to be by Thorne; it was cleaned, insured, hung, and written about as such. That false belief is now a factual part of the object's provenance. We are not selling the hand of Thorne, but the history of the hand's reception.

  Professor A. Vane has noted that such a work is "ontologically bankrupt, possessing the appearance of art without the authority of decision." While this objection is philosophically sound, the auction market trades in testimony, not metaphysics. The certificate of decertification provides a new form of authentication, verifying the lie so that it may be sold as truthfully as possible. The estimate absorbs the discount for the lack of autographic authority while retaining a premium for the continuity of the narrative. Collectors should note that while the aesthetic experience is preserved, the asset class has shifted from original creation to documented error. Something resides in the original decision that cannot be copied, hence the estimate remains significantly below the artist's record, yet the object retains the dignity of its display history.

  **ACKNOWLEDGEMENTS**
  The Auction House wishes to thank the Thorne Foundation for their rigorous decertification process, the estate of Julian Mock for their transparency regarding the commission, and Dr. S. Grist for providing the original 1945 invoice which establishes the timeline of the error. We are also grateful to Professor Vane for his concise summary of the work's ontological status, which has been factored into the reserve.

  **ESTIMATE**
  **£45,000 – 65,000**
