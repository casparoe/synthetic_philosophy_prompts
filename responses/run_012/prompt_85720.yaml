      3.  The Verdict (Philosophy vs. Craft).
      4.  The Meta-Character Twist.

      *Wait, one nuance:* The prompt asks to restate the debate *in the vocabulary I actually use*. So I need to speak directly to the novelist's experience of constructing the scene.
      *EDT* = Writing backwards from the ending. The choice is a symptom of the plot.
      *CDT* = Writing forwards from the character. The choice is the engine of the plot.

