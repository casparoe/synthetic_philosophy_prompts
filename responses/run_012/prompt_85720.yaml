      *   *EDT side:* Choosing Aleppo is just admitting you read the outline. It's about accepting the theme.
      *   *CDT side:* Choosing Aleppo is an act of defiance, even if it fails. It's about the *act* of choosing.
      *   *Residue:* Math vs. Emotion. Probability vs. Plausibility.
      *   *Verdict:* The philosophers are fighting over a ghost. In narrative, both are true simultaneously.

  9.  **Final Polish:** Check against constraints. American English. No citations. Keep it tight. Ensure the "novelist vocabulary" isn't just a skin over the math but actually reframes the problem. (Self-Correction: Make sure I don't just say "Author = God." Make it about the *craft*.)

      *Key Insight:* In decision theory, the prediction happens *before* the choice. In writing, the ending is often decided *before* the draft, but discovered *during* the draft. This temporal ambiguity is the key translation.

  10. **Final Review against Prompt:**
