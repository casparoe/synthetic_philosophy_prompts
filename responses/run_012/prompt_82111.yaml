      *   *Section 2: The Operational Definition (Answering a & c).* Analyze Benchmarks vs. RLHF. Show that Benchmarks assume Correspondence Truth, while RLHF assumes Coherentism/Pragmatism. Highlight CoT Faithfulness as the key evidence for "inner state" commitment.
      *   *Section 3: The User's Hunch (Answering a & d).* Evaluate the "disposition to assert" idea. It's better than pure reliabilism but still doesn't capture the "Hallucination" exemption. Propose "Honesty as Transparency of Process" as the actual underlying norm.
